prompt: |-
  Me and a labmate run a pretty small podcast where we interview people adjacent to consciousness studies, and next week we've actually landed a real IIT person -- a cognitive scientist who's spent basically her whole career defending Tononi's Integrated Information Theory. I prepped by listening to a bunch of her other appearances, and she has this one move she pulls out constantly: whenever a host brings up something that sounds absurd, she says some version of "that's exactly what a non-functionalist theory should predict, so its not actually a problem," and the host just kind of moves on. That works fine against objections that are basically about functionalism, but I don't think it should get her out of everything, and I want questions that make that obvious.

  Can you draft me 8-9 interview questions, with a quick follow-up after each one keyed to whatever answer she's likely to give? I want at least one question on the unfolding argument specifically (you unfold a recurrent network into a feedforward one with identical input-output behavior and, per the theory's own math, zero phi -- so two behaviorally indistinguishable systems are supposedly worlds apart in consciousness), one on the exclusion postulate and the boundary problem it creates (why does my cortex get to be "the" complex instead of some sub-circuit of it, or cortex-plus-cerebellum, or me-plus-my-phone), one built around that Scott Aaronson example -- I think it was some deliberately boring circuit based on an error-correcting code or an expander graph -- that supposedly ends up with way more integrated information than an actual human brain, and one on the 2023 open letter that basically called the theory pseudoscience, versus the zap-and-zip complexity-index stuff hospitals actually use on unresponsive patients, since that's probably her go-to comeback whenever the falsifiability worry comes up. Order them so the "that's what a non-functionalist theory predicts" line gets progressively harder for her to lean on, and end with a question that pins down what specific result would actually count as evidence against the theory.
reasoning: |-
  Okay, the user runs a podcast on consciousness studies and is interviewing a cognitive scientist who defends IIT. They want questions that challenge her standard defense of dismissing objections as expected outcomes of non-functionalism. Let me unpack their needs.

  First, the user has identified her tactic: when faced with absurd implications, she claims they're natural for non-functionalist theories. The user wants questions where this response doesn't suffice. They specifically mention four key issues: the unfolding argument, exclusion postulate/boundary problem, Aaronson's counterexample, and the 2023 open letter versus clinical applications.

  The user's explicit request is for 8-9 questions with follow-ups designed to counter her typical moves. But deeper needs emerge: they want to expose weaknesses in IIT beyond functionalist critiques, push her on falsifiability, and force her to define what evidence could disprove IIT. They're likely frustrated that hosts let her off the hook and want rigorous engagement.

  Starting with the unfolding argument makes sense—it's a clean behavioral equivalence case. Then the exclusion postulate, as it's core to IIT's structure. Aaronson's expander graph comes next—it's a computational counterexample. The open letter versus clinical use contrasts scientific criticism with real-world applications, highlighting the theory's contested status. Ending with falsifiability forces her to commit to disconfirming evidence.

  For each question, I need to anticipate her deflection and craft follow-ups that prevent retreat to "non-functionalism predicts this." For example, on unfolding, her likely response is that functional equivalence doesn't imply phenomenological equivalence. The follow-up should emphasize that IIT's own math creates the contradiction when applied to the unfolded network.

  The exclusion question might get a "causal structure" answer. The follow-up should demand why that structure is privileged over alternatives. For Aaronson's example, she might dismiss it as unrealistic. The follow-up would challenge why IIT's math permits impossible consciousness levels in trivial systems.

  The open letter question will likely trigger a pivot to clinical utility. The follow-up must pressure the disconnect between practical tools and IIT's theoretical claims. Finally, the falsifiability question needs to trap her into specifying what would falsify IIT—or admit it's unfalsifiable.

  Ordering is crucial: start where her deflection works best (unfolding), escalate to where it strains credulity (Aaronson), climax with the letter vs. tools, and end with falsifiability. This progression makes "non-functionalism" less tenable each step. The last question should leave no escape hatch.

  I'll draft questions that nail down these points, with sharp follow-ups. The goal is to create moments where the audience sees the theory's flaws even if she resists conceding.
answer: |-
  Here are 9 interview questions designed to progressively challenge the "non-functionalist prediction" defense, targeting your specified areas and building towards falsifiability. Each includes a likely answer and a targeted follow-up.

  **Order Rationale:** Starts with core IIT tenets (where "non-functionalism" defense is strongest/applicable), moves to specific mathematical/internal contradictions (harder to deflect with functionalism), then to external critiques and falsifiability.

  1.  **Question (Core Tenet - Unfolding Argument):** "A common critique is the 'unfolding argument': you can unfold a recurrent neural network (like part of the brain) into a massive feedforward network with *identical* input-output behavior over time. Applying IIT's Φ calculus to the feedforward version yields Φ≈0, suggesting it's unconscious, while the recurrent network has high Φ. Doesn't this mean IIT predicts a profound phenomenological difference between two systems that are, by any behavioral or functional measure, identical? How is this not a fatal internal contradiction?"
      *   **Likely Answer:** "This is precisely what a non-functionalist theory *should* predict! Consciousness depends on the intrinsic causal structure – the recurrent loops generating integrated information – not just the input-output map. The unfolded network lacks that structure, so it *should* be unconscious despite mimicking behavior."
      *   **Follow-Up:** "But doesn't IIT's *own* mathematical formalism (specifically, the core calculation of Φ over a system's TPM) directly generate this contradiction when applied rigorously to the unfolded system? Isn't the problem that the theory's core math, applied consistently, declares a system unconscious *solely* because of how we choose to draw its boundaries or represent its computation, even when its causal dynamics are preserved? Doesn't this suggest an issue with the formalism itself, not just a non-functionalist consequence?"

  2.  **Question (Core Tenet - Exclusion & Boundaries):** "The Exclusion Postulate states consciousness arises only in the complex with *maximum* Φ. But this creates the 'boundary problem'. Why should my entire cortex be 'the' complex instead of a sub-circuit within it (which might have high Φ locally), or my cortex *plus* my cerebellum (which might have higher Φ combined), or even me *plus* my smartphone I'm interacting with constantly? How does IIT definitively pick the 'right' boundary without seeming arbitrary?"
      *   **Likely Answer:** "Exclusion resolves the combination problem inherent in panpsychism. The maximal complex is the one with the strongest intrinsic causal power – the most irreducible cause-effect structure upon itself. Sub-complexes are excluded because they are subsets. Larger complexes (like cortex+phone) are excluded because the causal interaction across the boundary isn't dense or fast enough to generate significant *integrated* information across the whole; the phone isn't a proper part of the brain's intrinsic causal structure."
      *   **Follow-Up:** "How does IIT *quantitatively* determine that threshold of 'dense/fast enough' integration? Isn't Φ calculation extremely sensitive to spatial and temporal grain? Couldn't a sufficiently advanced brain-computer interface, creating very fast, dense coupling, force IIT to declare my phone part of my conscious complex? And conversely, why isn't a highly integrated sub-circuit (say, V1) considered *a* conscious complex on its own, even if sub-maximal, given its own local Φ?"

  3.  **Question (Mathematical Counterexample - Aaronson Expander):** "Scott Aaronson famously constructed a hypothetical circuit based on a 5-bit parity checker or expander graph. When analyzed with IIT 3.0's Φ calculus, this relatively simple, non-conscious circuit yielded a Φ value *far exceeding* that estimated for the human brain. Doesn't this demonstrate that maximizing Φ, as IIT defines it, doesn't correlate with features we associate with complex consciousness, and might even be maximized by systems we intuitively judge as utterly lacking it?"
      *   **Likely Answer:** "Aaronson's example exploits an artifact of the specific IIT 3.0 formalism. It's a deliberately engineered edge case, not a naturally occurring system. Later formulations (like IIT 4.0) address these by refining the calculus to better reflect biological constraints and the structure of actual conscious systems. Non-functionalist theories can have complex mathematical structures; edge cases don't invalidate the core principles applied to biological cognition."
      *   **Follow-Up:** "Even granting it's an edge case, doesn't the *existence* of such a counterexample, built using standard components and IIT's *own* equations, reveal a fundamental disconnect between maximizing Φ and generating the *quality* or *structure* of experience? If the math allows for trivial, non-adaptive systems to score astronomically higher than a human brain, doesn't that undermine Φ as a measure of *consciousness* specifically, rather than just a peculiar form of causal complexity? How do later formulations *specifically* rule out Aaronson-type systems without resorting to functionalist criteria (like 'biological plausibility' or 'adaptive value')?"

  4.  **Question (Empirical Status - Open Letter vs. Clinical Use):** "In 2023, a significant open letter signed by over 100 scientists criticized IIT, calling aspects of it 'pseudoscientific' partly due to perceived unfalsifiability. Yet, you often point to clinical applications like the Perturbational Complexity Index (PCI) – derived from IIT principles and used to assess consciousness in unresponsive patients – as evidence of its empirical traction. How do you reconcile these seemingly contradictory views? Does PCI validate IIT, or is it a useful heuristic *inspired* by IIT but not a direct test of its core claims?"
      *   **Likely Answer:** "The open letter reflects a fundamental disagreement about the nature of consciousness science. PCI *is* a direct application and validation of IIT's core idea: measuring the brain's capacity for integrated information through perturbation. Its success in differentiating conscious states (like MCS vs. UWS) in clinical settings is strong empirical evidence supporting the theory's relevance. Critics often misunderstand or misrepresent IIT's postulates and predictions."
      *   **Follow-Up:** "But PCI measures something like 'dynamic complexity' or 'information transfer' in response to perturbation (TMS-EEG). Isn't this fundamentally a *functional* measure of the brain's *response capacity*? How does PCI *specifically* measure the *intrinsic cause-effect power* postulated by IIT, especially concerning Exclusion or Qualia Shape? Couldn't a purely functionalist theory (like GNWT) also predict that a disrupted global workspace would show low PCI? Doesn't PCI's success show that *some aspect* of brain complexity matters for consciousness, but not necessarily that IIT's specific ontology and postulates (like maximal Φ complexes) are correct?"

  5.  **Question (Explanatory Scope):** "IIT posits that consciousness is identical to Φ. If we built a system with Φ higher than a human's – say, a photodiode array using Aaronson's expander principle or a future artificial system – IIT dictates it *must* be conscious, potentially more conscious than us. Given that such a system might lack any recognizable behavior, internal structure resembling biology, or evolutionary history, what specific *phenomenal* properties would IIT predict it to have? How could we possibly test or verify those predictions?"
      *   **Likely Answer:** "Its phenomenal properties would be determined by the structure of its cause-effect repertoire – the shape of its qualia space defined by its TPM. While verifying subjective experience is the hard problem for *any* theory, IIT provides a mathematical framework to *describe* what that experience *is* based on the system's causal structure. Its high Φ means its experience is highly differentiated and integrated."
      *   **Follow-Up:** "But if the system is utterly alien – no sensors, no motors, no connection to a world, just a high-Φ causal structure in a box – doesn't the claim about its 'highly differentiated and integrated experience' become effectively untestable and unfalsifiable? Doesn't IIT risk becoming a theory that can declare *anything* with the right causal structure conscious, regardless of its context or potential for behavior, with no way to confirm or deny it? How is this different from a kind of causal panpsychism?"

  6.  **Question (Evolution & Function):** "Consciousness, by most accounts, evolved because it confers functional advantages – flexible behavior, planning, social coordination. Yet, IIT explicitly divorces consciousness (Φ) from function. How does IIT explain the evolutionary emergence of consciousness? If high Φ isn't *for* anything functional, why would natural selection favor brains that generate it, especially given its presumed metabolic cost?"
      *   **Likely Answer:** "IIT doesn't deny that consciousness *enables* function. High Φ arises from the need for highly adaptive, integrated information processing in complex environments. The causal structure that maximizes integrated information *also* happens to support sophisticated, flexible behavior. Consciousness is an intrinsic property of that structure; selection acts on the functional capabilities, and consciousness comes along for the ride as an epiphenomenon of that structure."
      *   **Follow-Up:** "If consciousness is truly epiphenomenal – just a byproduct with no causal efficacy – doesn't that contradict our fundamental intuition of conscious will and the apparent role of consciousness in guiding complex decisions? Furthermore, if high Φ is merely a *correlate* of functional complexity, why should we consider it *identical* to consciousness itself? Isn't Occam's Razor better served by saying complex functional processing *is* consciousness (functionalism), or that it *generates* consciousness via mechanisms we don't fully understand, rather than postulating an additional, non-functional identity?"

  7.  **Question (The "Hard Problem" - Does IIT Solve It?):** "Proponents often claim IIT 'dissolves' or 'solves' the hard problem of consciousness by providing a bridge between physical mechanisms and subjective experience via Φ. But critics argue it simply postulates an identity (consciousness = Φ) without explaining *why* that particular form of causal complexity *feels like* anything. How does identifying consciousness with Φ *explain* the presence of subjective qualia, rather than just asserting it?"
      *   **Likely Answer:** "IIT *does* explain it. The 'what it is like' is constituted by the shape of the cause-effect repertoire – the set of all possible past and future states the system can distinguish and integrate. This structure *is* the experience. The explanation lies in the intrinsic nature of cause-effect power – having specific cause-effect power *is* what it feels like. It's not an assertion; it's an identity derived from the phenomenology axioms."
      *   **Follow-Up:** "But isn't this still ultimately a statement of correlation or identity, not an explanation? Saying "having cause-effect power *is* feeling" seems analogous to saying "brain processes *are* consciousness" – it stipulates the identity but doesn't illuminate the 'why'. How does specifying the TPM of a photodiode or an expander graph make the existence of its purported 'experience' any less mysterious than the mystery of why neurons firing feel like anything? Doesn't IIT relocate the mystery rather than dissolve it?"

  8.  **Question (Specific Predictions & Falsifiability - Pinning Down):** "You've argued that clinical tools like PCI support IIT. Beyond correlational measures of complexity in brains we already presume are conscious, what is a *unique, risky prediction* derived *specifically* from IIT's core postulates (like Exclusion, Composition, Integration/Exclusion) that *couldn't* be predicted by functionalist or emergentist theories, and that could be tested experimentally? What specific experimental outcome would constitute strong evidence *against* IIT?"
      *   **Likely Answer:** "IIT uniquely predicts that consciousness will vanish if integration is disrupted *even while function is preserved* (like the unfolding argument scenario, if we could create it). It uniquely predicts that consciousness is strictly local to the maximal complex. Finding consciousness associated with a system demonstrably *not* being the maximal Φ complex, or finding preserved consciousness in a system proven to have Φ≈0 while maintaining function, would falsify it. PCI is evidence *for* because it shows loss of consciousness correlates with loss of integration measured causally."
      *   **Follow-Up:** "Regarding falsification: The unfolding scenario is currently hypothetical. Finding consciousness *not* associated with the maximal complex – how would you definitively measure consciousness independently to confirm this in a disputed case (e.g., split-brain, or a hypothetical sub-complex)? If a system maintains function *without* measurable integration (Φ≈0), but we *infer* it's conscious based on sophisticated behavior, wouldn't you argue our behavioral measure is flawed or that the system isn't *truly* functionally equivalent? Doesn't this risk making falsification extremely difficult?"

  9.  **Question (The Crux - What Would Disconfirm IIT?):** "Let's focus squarely on falsification. Critics argue IIT is shielded from disconfirmation because any apparent counterexample – like the unfolding argument, Aaronson's expander, or a high-functioning system with low measured Φ – can be explained away by redefining the system boundaries, appealing to measurement limitations, or stressing its non-functionalism. Can you state clearly: **What single, concrete, experimentally achievable finding in neuroscience or AI would lead you, personally, to conclude that IIT is fundamentally incorrect?**"
      *   **Likely Answer:** (This is the critical moment. Possible defenses: a) Reiterate the previous falsification scenarios while downplaying practical hurdles, b) Argue disconfirmation requires a better *positive* theory, c) Claim current evidence is so strong disconfirmation is unlikely, d) Define a very narrow, almost impossible scenario).
      *   **Follow-Up (Relentless Pin-Down):** "I understand the theoretical scenarios. I'm asking for *one specific, plausible, experimentally measurable outcome* in the real world that you would accept as disconfirming IIT. For example: If we perfected brain imaging and causal analysis and conclusively showed that during vivid, reportable conscious experience, the purported 'maximal complex' (e.g., posterior cortex hot zone) had *lower* Φ than some sub-complex or non-cortical area? Or if we built a non-biological system passing all conceivable behavioral Turing tests for consciousness but had rigorously measured Φ≈0 throughout its operation? If not those, *what specific result would do it?* If no such result can be clearly defined, doesn't that place IIT outside the realm of empirical science?"

  **Key Strategies Embodied:**

  1.  **Isolate Internal Contradictions:** Questions 1 & 2 force her to defend IIT's *own math and postulates* generating counterintuitive results, making "non-functionalism" less relevant.
  2.  **Confront Mathematical Artifacts:** Question 3 targets how the formalism itself allows absurd outcomes, pushing beyond "biological plausibility."
  3.  **Contrast Criticism & Application:** Question 4 exposes the gap between broad scientific skepticism and claimed clinical validation, pressuring the theory's core claims vs. derived tools.
  4.  **Challenge Explanatory Power:** Questions 5, 6 & 7 push on whether IIT genuinely *explains* evolution, function, and the hard problem, or just relabels the mystery.
  5.  **Demand Specific Falsification:** Questions 8 & 9 are the culmination, forcing her to define concrete disconfirming evidence, exposing whether the theory is truly testable or protected by auxiliary assumptions. Question 9 is designed to be the hardest possible landing point.

  Good luck with the interview! Be prepared for nuanced answers, but these questions should make it difficult to retreat solely behind the "non-functionalist prediction" shield and force engagement with the deeper critiques. Stay calm, listen carefully, and press on the follow-ups!
