answer: |-
  Your question touches on a fundamental aspect of intuitionistic logic and its philosophical underpinnings. The confusion arises from the interplay between the law of excluded middle (LEM), double negation, and what it means for a statement to be "true" in a constructive setting. I'll break this down step by step, addressing why intuitionists reject LEM as a general principle while still proving its double negation, and why the double negation rule doesn't behave as in classical logic.

  ### 1. **The Law of Excluded Middle (LEM) in Intuitionistic Logic**
  In classical logic, LEM states that for any proposition \(P\), \(P \lor \neg P\) must hold: either \(P\) is true or \(\neg P\) is true. This is accepted without requiring a method to determine which disjunct is true.

  Intuitionistic logic, however, ties truth to provability or constructibility. A proposition \(P\) is considered true only if we have a proof (or constructive method) for it. Similarly:
  - \(P \lor Q\) is true only if we have a proof of \(P\) or a proof of \(Q\).
  - \(\neg P\) is true only if we have a method to derive a contradiction from any proof of \(P\) (i.e., \(\neg P\) is shorthand for \(P \to \bot\), where \(\bot\) is absurdity or contradiction).

  Thus, for \(P \lor \neg P\) to hold intuitionistically, we must either:
  - Have a proof of \(P\), or
  - Have a proof that \(P\) leads to a contradiction (i.e., a proof of \(\neg P\)).

  If \(P\) is an open conjecture (e.g., the Riemann Hypothesis), we lack both a proof of \(P\) and a proof of \(\neg P\). Therefore, intuitionists do not assert \(P \lor \neg P\) for such \(P\), as it would require a non-constructive "leap of faith."

  ### 2. **Why \(\neg \neg (P \lor \neg P)\) is Provable Intuitionistically**
  Despite rejecting LEM, intuitionistic logic proves \(\neg \neg (P \lor \neg P)\) for any \(P\). This means it is impossible to refute \(P \lor \neg P\), but it does not mean we can prove \(P \lor \neg P\) itself. Here's why \(\neg \neg (P \lor \neg P)\) is always provable:

  - Assume \(\neg (P \lor \neg P)\). We will derive a contradiction from this assumption.
  - \(\neg (P \lor \neg P)\) means that \(P \lor \neg P\) leads to a contradiction. In intuitionistic logic, this implies both \(\neg P\) and \(\neg \neg P\):
    - \(\neg P\): If we had a proof of \(P\), then \(P \lor \neg P\) would hold (since a proof of \(P\) justifies the left disjunct). But \(\neg (P \lor \neg P)\) says this is impossible, so \(P\) must be false—i.e., we have \(\neg P\) (which is \(P \to \bot\)).
    - \(\neg \neg P\): Similarly, if we had a proof of \(\neg P\), then \(P \lor \neg P\) would hold (justifying the right disjunct). But \(\neg (P \lor \neg P)\) also makes this impossible, so \(\neg P\) must be false—i.e., we have \(\neg \neg P\) (which is \(\neg P \to \bot\), or \((P \to \bot) \to \bot\)).
  - Now we have both \(\neg P\) and \(\neg \neg P\). Since \(\neg P\) is \(P \to \bot\) and \(\neg \neg P\) is \((P \to \bot) \to \bot\), applying \(\neg \neg P\) to \(\neg P\) (via modus ponens) yields \(\bot\) (contradiction).
  - Therefore, \(\neg (P \lor \neg P)\) leads to a contradiction, so its negation, \(\neg \neg (P \lor \neg P)\), is true. This holds for any \(P\).

  This proof is constructive: it shows that assuming \(\neg (P \lor \neg P)\) is absurd, but it does not produce a proof of \(P\) or \(\neg P\). Hence, while \(\neg \neg (P \lor \neg P)\) is always provable, it does not imply \(P \lor \neg P\).

  ### 3. **Why Intuitionists Cannot Prove \(\neg (P \lor \neg P)\) for Any \(P\)**
  As shown above, \(\neg (P \lor \neg P)\) leads to a contradiction in intuitionistic logic. Therefore:
  - \(\neg (P \lor \neg P)\) is always false intuitionistically because it is refutable for every \(P\).
  - This means there is no \(P\) for which \(\neg (P \lor \neg P)\) can hold—it would require proving both \(\neg P\) and \(\neg \neg P\), which is impossible (as it directly implies \(\bot\)).
  - Consequently, intuitionists cannot "prove the negation of LEM" (i.e., \(\neg (P \lor \neg P)\)) for any \(P\), as such a proof would be contradictory.

  Intuitionists do not claim that LEM "fails" in the sense that \(\neg (P \lor \neg P)\) is true for some \(P\). Instead, they argue that LEM is not a valid general principle because we cannot always construct a proof of \(P \lor \neg P\). For undecided propositions (e.g., open conjectures), \(P \lor \neg P\) is not provable, but this does not make \(\neg (P \lor \neg P)\) true—it simply means we lack the disjunction.

  ### 4. **The Breakdown of Double Negation**
  Your intuition that "cancelling two negatives should return the original statement" is correct in classical logic, where double negation elimination (\(\neg \neg Q \to Q\)) is a valid rule. However, this rule is not part of intuitionistic logic. Here's why:
  - In intuitionistic logic, \(\neg \neg Q\) means "it is absurd that \(Q\) is false." This does not equate to a proof of \(Q\); it only shows that denying \(Q\) leads to a contradiction.
  - For \(Q = P \lor \neg P\), we have \(\neg \neg Q\) (as proven), but \(Q\) may not hold because we lack a constructive method to decide \(P\).
  - Double negation elimination is rejected because it allows non-constructive proofs. For example, if \(\neg \neg P\) were equivalent to \(P\), one could prove \(P\) by showing that \(\neg P\) is absurd—without ever constructing a proof of \(P\). Intuitionists require direct evidence.

  Thus, the "ordinary rule" of double negation is a classical principle. Adding it to intuitionistic logic would make it equivalent to classical logic, but intuitionists deliberately omit it to maintain constructivity.

  ### 5. **Consistency of the Intuitionist Position**
  Intuitionists consistently decline to assert LEM as a universal law while being unable to refute it for specific cases because:
  - **LEM is not refutable:** As shown, \(\neg (P \lor \neg P)\) is contradictory for all \(P\), so there is no counterexample where LEM "fails." Intuitionists do not believe LEM is false; they believe it is unjustified for propositions where we lack a decision procedure.
  - **LEM is not always provable:** For undecided \(P\) (e.g., "There are infinitely many twin primes"), we have no proof of \(P\) or \(\neg P\), so \(P \lor \neg P\) cannot be asserted. The proof of \(\neg \neg (P \lor \neg P)\) does not fill this gap—it only shows that \(P \lor \neg P\) cannot be denied.
  - **Philosophical motivation:** Intuitionists view mathematics as a mental construction. Asserting \(P \lor \neg P\) without a method to decide \(P\) is seen as meaningless, as it claims a disjunction exists without evidence for either option. The double negation \(\neg \neg (P \lor \neg P)\) is acceptable because it is proven constructively (by deriving a contradiction from its negation), but it does not create the missing evidence for \(P\) or \(\neg P\).

  ### Practical Implications in Lean
  In Lean, which uses a version of intuitionistic logic (the Calculus of Inductive Constructions), you can prove `¬¬ (P ∨ ¬ P)` for any `P`, but not `P ∨ ¬ P` unless you have a constructive proof or use classical axioms. For example:
  ```lean
  open classical -- Enables classical logic, including LEM

  -- Without 'open classical', this does not compile
  theorem lem (P : Prop) : P ∨ ¬ P :=
  by exact em P -- Uses classical.em

  -- But intuitionistically, we can always prove the double negation
  theorem double_neg_lem (P : Prop) : ¬¬ (P ∨ ¬ P) :=
  λ h : ¬ (P ∨ ¬ P), 
    have ¬ P, from λ hp, h (or.inl hp),
    have ¬¬ P, from λ hnp, h (or.inr hnp),
    show false, from this ‹¬ P›
  ```
  In intuitionistic mode (without `open classical`), `em P` is unavailable, reflecting the constructive stance.

  ### Summary
  - Intuitionists prove \(\neg \neg (P \lor \neg P)\) for all \(P\) because assuming otherwise leads to a contradiction.
  - They cannot prove \(\neg (P \lor \neg P)\) for any \(P\), as it is always contradictory.
  - LEM (\(P \lor \neg P\)) is not asserted for all \(P\) because it requires a constructive decision, which may be lacking.
  - Double negation elimination (\(\neg \neg Q \to Q\)) is not valid in intuitionistic logic, so \(\neg \neg (P \lor \neg P)\) does not imply \(P \lor \neg P\).

  This position is consistent: intuitionists avoid non-constructive leaps by demanding proofs for disjunctions, while acknowledging that LEM cannot be falsified. Your reading on Brouwer and constructivism is a great start—this tension highlights how intuitionistic logic refines classical reasoning to align with computational or constructive principles. If you have more questions about Lean or specific examples, I can expand further!
