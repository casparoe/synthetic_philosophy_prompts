answer: |-
  Here are 10 interview questions designed to push the substance of unrestricted composition (universalism), targeting key arguments and potential weaknesses, with anticipated deflections and follow-ups:

  1.  **Targeting Vagueness/Sorites Defense:**  
      "You often argue that any non-universal answer to the Special Composition Question (SCQ) must draw an arbitrary line, leading to vagueness paradoxes. But why must we accept that *only* universalism avoids vagueness? Couldn't we accept that composition is sometimes vague (e.g., vague clouds, vague heaps) without collapsing into universalism? Isn't the cost of embracing trout-turkeys *worse* than accepting some limited ontological vagueness at the boundaries?"  
      *   *Likely Deflection:* "Vagueness in existence itself is incoherent/metaphysically impossible; only semantic vagueness is acceptable."  
      *   **Follow-Up:** "But why is vague *existence* uniquely intolerable? We readily accept vague *identity* (e.g., the Ship of Theseus), vague *properties* (e.g., 'bald'), and vague *spatial boundaries* (e.g., mountains). Isn't insisting that composition *must* be perfectly precise everywhere-or-nowhere itself an arbitrary metaphysical prejudice?"

  2.  **Testing "Ontological Innocence" / Composition-as-Identity Lite:**  
      "You likely endorse a view like Lewis's, where composition is 'ontologically innocent' – the fusion is 'nothing over and above' its parts. But if the trout-turkey fusion is *identical* to its parts (collectively), how do we account for the fact that the fusion *has different properties* than the parts? The parts are spatially scattered; the fusion (if it exists) has a specific, albeit scattered, shape and location the parts *as a mere collection* arguably don't possess. Doesn't this violate Leibniz's Law?"  
      *   *Likely Deflection:* "Composition-as-identity doesn't mean strict numerical identity; it's a weaker relation where the whole is 'constituted by' or 'is the mereological sum of' the parts, with no *additional* fundamental entity."  
      *   **Follow-Up:** "If it's not strict identity, doesn't the claim of 'ontological innocence' become much weaker? Doesn't positing a *sui generis* relation of 'constitution' or 'being the sum of' that applies *absolutely universally* still represent a significant ontological commitment to infinitely many composite entities, even if they are 'built from' the parts? How is this truly 'innocent'?"

  3.  **The Epistemic/Ontological Gap of Gerrymandered Objects:**  
      "Universalists posit the existence of countless entities like the fusion of my left shoe, the Eiffel Tower, and Alpha Centauri. Yet, our best scientific theories, our sensory experiences, and crucially, our *causal explanations* of events never seem to require quantifying over or referring to these objects. If these fusions are real, concrete parts of the world, why do they play *absolutely no role* in explaining anything that happens? Doesn't this suggest they are explanatorily inert epiphenomena?"  
      *   *Likely Deflection:* "Causation and explanation operate at the level of the *parts* (fundamental particles, fields). The fusion inherits its causal powers entirely from its parts. Its inertness doesn't negate its existence."  
      *   **Follow-Up:** "But if the fusion's properties and causal powers are *exhaustively determined* by the properties and arrangements of its parts (plus fundamental laws), and we can explain everything perfectly well *only* by referring to the parts and their relations, what *explanatory work* is the fusion itself doing? Isn't positing its existence then violating some principle of ontological parsimony, even if it's claimed to be 'innocent'?"

  4.  **Ordinary Language and Quantification:**  
      "Our everyday language and thought are saturated with restricted quantifiers and sortals ('a bookshelf', 'some boards', 'a pile'). We *never* find ourselves needing to quantify over or refer to arbitrary gerrymandered fusions in ordinary or scientific discourse. If unrestricted composition is true, why is ordinary language so systematically and successfully structured to *ignore* the vast majority of objects your ontology posits? Doesn't this linguistic practice suggest that these fusions simply aren't part of the 'furniture of the world' we interact with and talk about?"  
      *   *Likely Deflection:* "Ordinary language reflects pragmatic interests, not fundamental ontology. We quantify restrictedly because we care about *salient* wholes (like chairs) for our purposes, not because arbitrary fusions don't exist."  
      *   **Follow-Up:** "But doesn't this drive a massive wedge between fundamental ontology and the ontology embedded in our successful linguistic practices and scientific models? If unrestricted composition is true, doesn't it render our ordinary object concepts and quantifiers fundamentally *misleading* about what actually exists? Isn't a theory that aligns better with our actual conceptual practices (like some form of restricted composition) prima facie more plausible?"

  5.  **The "Cost" of Avoiding Trout-Turkeys:**  
      "Van Inwagen argues that universalism forces us to accept 'countless trillions of trivially composite objects' that are metaphysically bizarre and causally inert. You counter that the alternatives (nihilism, various restricted views) have higher costs (vagueness, arbitrariness, denying ordinary objects). Could you explicitly weigh these costs? Why is the cost of ontological profligacy with gerrymandered objects *less* problematic than, say, the cost of accepting some metaphysical vagueness or the cost of denying that ordinary artifacts are composite objects (if one leans towards nihilism)?"

  6.  **Unrestricted Composition & Persistence:**  
      "How does unrestricted composition interact with persistence through time? Consider a trout-turkey fusion at T1. At T2, one quark in the trout has moved. Is this numerically the *same* trout-turkey fusion, or a different one? If identity over time requires the same parts, then virtually no composite object persists for more than an instant. If it allows part change, what principle governs *which* fusions persist through *which* part changes? Doesn't universalism either lead to radical temporal instantaneity for composites or require arbitrary principles of diachronic identity for fusions?"

  7.  **Mereological Essentialism & Modal Oddities:**  
      "Does unrestricted composition commit you to mereological essentialism for fusions? That is, is the trout-turkey fusion essentially composed of *those exact parts*? If so, couldn't there be a distinct, equally real fusion that is *just like* the trout-turkey but missing one quark? And isn't this modal profile wildly out of step with how we think about ordinary objects (which can survive part replacement)? If not, and fusions can gain/lose parts, what principle determines which fusions have this modal flexibility?"

  8.  **The Analogy to Sets:**  
      "Some defenders liken unrestricted composition to set theory: any plurality defines a set/fusion. But sets are abstracta, existing outside spacetime, causally inert by nature. The fusions you posit are supposed to be *concreta*, parts of the spatiotemporal causal order. Doesn't this disanalogy undermine the comparison? How can concrete, spatiotemporal objects be as ontologically profligate and gerrymandered as abstract sets without cluttering the causal structure of the world?"

  9.  **Intuitions and Counterintuitiveness:**  
      "You readily acknowledge that unrestricted composition is deeply counterintuitive. Van Inwagen uses this as an argument against it, while you often suggest intuitions are unreliable guides in fundamental metaphysics. But *why* are intuitions unreliable here? Is it just because they conflict with the logical elegance of universalism? Or is there a deeper reason to distrust our strong intuition that a pile of unscrewed Ikea boards is *not yet* a bookshelf and *is not* a fusion with my coffee mug?"

  10. **The Empirical Falsifiability Question:**  
      "The case for unrestricted composition seems entirely a priori, based on arguments against vagueness, arbitrariness, and the alleged innocence of composition. What, if anything, could *empirically* count as evidence against unrestricted composition? Is the theory falsifiable in principle? If not, does this lack of empirical content or testability weaken its claim to be describing the actual structure of concrete reality, rather than just presenting a logically coherent metaphysical model?"  
      *   *Likely Deflection:* "Metaphysics is fundamentally a priori; empirical science studies the *properties* and *arrangements* of parts, not the mere existence of arbitrary sums."  
      *   **Follow-Up:** "But if *no conceivable observation or scientific discovery* could ever bear on the truth or falsity of unrestricted composition – if it's entirely insulated from empirical check – doesn't that risk making it untethered from the world we experience and investigate? How does it differ from a purely mathematical structure in its relationship to empirical reality?"

  **Key Principles Used:**
  *   **Substance over Recap:** Questions force defense, application, and comparison, not just restatement.
  *   **Anticipate Defenses:** Follow-ups target the *next* move in the dialectic (vagueness tolerance, weak composition-as-identity, pragmatic vs. ontological quantifiers).
  *   **Highlight Costs:** Questions emphasize the *weirdness burden* (trout-turkeys, inertness, linguistic mismatch) and force comparison to alternatives' costs.
  *   **Push Implications:** Explore consequences for persistence, modality, causation, and the theory's empirical grounding.
  *   **Challenge Core Moves:** Directly question the necessity of the vagueness argument, the substance of "ontological innocence," and the disconnect from practice.

  These questions should create a dynamic interview that genuinely probes the foundations and implications of unrestricted composition, moving far beyond a simple exposition of the view. Good luck with the episode!
