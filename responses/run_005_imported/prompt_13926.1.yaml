prompt: |-
  Got into an argument about this on the ACX subreddit a while back and never got a satisfying answer, so hoping you can settle it. I've been rereading the Sequences and Yudkowsky's "conservation of expected evidence" post is one of those results everyone on LW treats as obviously true and kind of boring: if you can already predict which direction you'll update your credence in, you should just update now, since your expected future credence has to equal your current one -- that's basically just the law of total probability. Separately I've been poking around in formal epistemology (SEP rabbit hole, as always) and ran into van Fraassen's Reflection Principle, which says the same thing as far as I can tell: if your certain what your credence in some claim will be at a later time, your credence now should already equal that. He even backs it with an explicit Dutch book argument -- if you don't conform, a bookie can set up bets now and later that guarantee you a loss regardless of outcome.

  Except in that literature this is apparently a live, heavily contested principle, not some settled one-paragraph result. There's a whole back and forth of counterexamples (something about anticipating you'll be drunk, senile, or otherwise less reliable later, and I think a positive case involving a guru you know will end up being right), plus decades of people -- Christensen, maybe Talbott, don't remember exactly who -- proposing increasingly fiddly restrictions on when you're actually supposed to defer to your future self like that. If it's the same underlying mathematical result, why does the philosophy side treat this as such an open problem requiring decades of patches, when LW apparently nailed the whole thing in one moderately short blog post? Am I missing some real technical difference between the two principles, or is this just the same idea getting independently reinvented by two communities that don't read each other, with the philosophers being unnecessarily precious about it?
reasoning: |-
  Okay, the user is asking about the difference between Eliezer Yudkowsky's Conservation of Expected Evidence (CEE) and van Fraassen's Reflection Principle, and why the philosophical community treats Reflection as a contentious issue while the LessWrong community sees CEE as straightforward. Let me start by recalling what each principle states.

  CEE is about the expected value of future credences. It says that your current credence must equal the expected future credence, considering all possible evidence. For example, if you think there's a 60% chance of rain, and you expect that after looking at the radar, your belief might go up to 80% or down to 40%, the average of those should still be 60%. This comes from the law of total probability. So it's a mathematical necessity.

  Van Fraassen's Reflection Principle, on the other hand, states that if you're certain about what your future credence will be (say, you know that tomorrow you'll believe P with 70% confidence), then your current credence should match that. It's framed as a rational constraint. The Dutch Book argument supports it: if you deviate, a bookie can exploit you with bets now and later.

  The user is confused because both seem similar, but philosophers debate Reflection with counterexamples like anticipating being drunk or brainwashed. In such cases, you wouldn't want your current belief to align with your future irrational self. So philosophers add conditions: future selves must be rational, epistemically relevant, etc.

  But why isn't Reflection as straightforward as CEE? The key difference is that CEE deals with expectations over evidence, while Reflection requires certainty about future beliefs. CEE is about the average of possible updates, whereas Reflection is about a specific future belief you're certain of. The certainty aspect is crucial. If you're certain about a future credence, and it's rational, then Reflection holds. But if you expect irrationality, it doesn't apply.

  The user might be missing that CEE is a theorem, a direct result of probability laws, so it's uncontroversial. Reflection is a normative principle about rational deference, which is why it's debated. Philosophers are considering cases where future certainty isn't rational, leading to counterexamples and refinements.

  The user's deeper need might be understanding why two seemingly similar ideas have different receptions. They might also want to reconcile the communities' approaches. The answer lies in distinguishing mathematical necessity versus normative rationality. The LessWrong community focuses on the math, while philosophers explore the conditions under which such deference is rational, especially in real-world scenarios with anticipated irrationality.

  So, the key points are: CEE is a theorem; Reflection is a normative principle. The certainty requirement in Reflection introduces complications when future states aren't rational, leading to philosophical debates. The communities address different aspects—mathematical vs. normative—hence the disparity in treatment.
answer: |-
  You've hit on a fascinating disconnect between two intellectual communities that *should* be talking more. You're right that **Conservation of Expected Evidence (CEE)** and **van Fraassen's Reflection Principle (RP)** share a deep mathematical core. Both are essentially expressions of the **Law of Total Probability (LOTP)** applied to beliefs over time. However, the *framing, interpretation, and intended scope* differ significantly, explaining why one is "obviously true" and the other is "heavily contested." Here's the breakdown:

  1.  **The Common Mathematical Core (LOTP):**
      *   Both principles rely on the fundamental property of probability: Your current expectation of a future random variable must equal its current value.
      *   **CEE:** `P(H) = E[P(H|E)] = Σ P(E_i) * P(H|E_i)`. Your current credence `P(H)` *is* the weighted average of your possible future credences `P(H|E_i)` after seeing evidence `E_i`, weighted by the probability `P(E_i)` of seeing that evidence.
      *   **RP:** If you are *certain* that your future credence at time `t'` will be `x` (`P(P_{t'}(H) = x) = 1`), then LOTP demands your current credence *must* be `x` (`P_t(H) = E[P_{t'}(H)] = x`).

  2.  **Why CEE (LessWrong) is "Boringly True":**
      *   **Scope:** CEE deals *explicitly* with **belief updates driven by anticipated evidence**. It's a direct application of LOTP to the process of conditioning on new information.
      *   **Assumption:** The future credences `P(H|E_i)` are those you *would rationally have* *if* you observed `E_i`. The principle assumes you are reasoning correctly *about the update process itself*.
      *   **Focus:** It's presented as a *consistency constraint* on probabilistic reasoning. Violating it means you are mathematically incoherent *right now* in how you describe your own updating procedure. A Dutch Book can be constructed *based on your current commitments* about how you'll update.
      *   **Counterfactuals:** CEE talks about *possible* evidence paths `E_i`. You don't need to be certain about *which* evidence you'll get, only about how you *would* update *if* you got it.

  3.  **Why RP (Philosophy) is Contested:**
      *   **Scope:** RP deals with **deference to a *specific*, *certain* future belief state**, regardless of *how* that state is reached. It's not inherently tied to *evidence-based updating*.
      *   **The Crux of the Problem: "Rationally Reached?"** RP, in its basic form (`P_t(H | P_{t'}(H) = x) = x`), makes *no assumption* about whether the future credence `x` is *rational* or *well-founded*. This opens the floodgates to counterexamples:
          *   **The Drunk/Senile Future Self:** You know with certainty that tomorrow night, when you are drunk/senile/drugged, you will believe you can fly (`P_{drunk}(Fly) = 1`). RP naively says your *sober* credence today should be 1. This is absurd. (Van Fraassen's initial counterexample).
          *   **The Brainwashed Self:** You know a cult will brainwash you tomorrow into believing the moon is made of cheese with credence 0.9. RP says you should believe it now at 0.9.
          *   **The Guru:** You know a perfectly reliable guru will tell you her credence `x` tomorrow, but you don't know what `x` is yet. You *are* certain you will then adopt `x` as your own credence. *Should* your credence today be the *expectation* of `x`? (This is closer to CEE, but the "how" matters). What if the guru is reliable but you know she bases her belief on evidence you currently consider irrelevant or flawed? What if she *is* brainwashed?
      *   **The Challenge:** How to restrict RP *only* to cases where your future self is *epistemically superior* or *better positioned* in a way that *justifies deference*? Philosophers grapple with defining "better positioned":
          *   **More Evidence:** The future self has strictly more evidence (the classic CEE case). (Talbott, Christensen focus here).
          *   **Rationality:** The future self is fully rational *and* has at least your current evidence. (But what defines "rational"?)
          *   **No Misleading Evidence:** The future self hasn't been exposed to evidence you *know* is misleading, or hasn't undergone cognitive impairment. (This is hard to define formally).
      *   **Framing as a Normative Principle:** RP is often presented not just as a consistency constraint, but as a *norm* of rational planning or self-trust: "You *should* trust your future (better) self." This normative claim invites debate about *when* such trust is warranted, leading to the "fiddly restrictions."
      *   **The Certainty Requirement:** RP requires *absolute certainty* (`P(P_{t'}(H)=x) = 1`) about the future credence. This is psychologically unrealistic and fragile. What if you're 99.9% sure? Does a weaker principle hold? Philosophers explore generalizations.

  4.  **Key Differences Summarized:**

      | Feature             | Conservation of Expected Evidence (CEE)          | van Fraassen's Reflection Principle (RP)       |
      | :------------------ | :----------------------------------------------- | :--------------------------------------------- |
      | **Core Trigger**    | Anticipation of *possible future evidence*       | Certainty about a *specific future belief state* |
      | **Assumption**      | Future credence is *rational given evidence E_i* | *No inherent assumption* about future rationality |
      | **Mathematical Basis** | Direct application of LOTP to evidence updating | Application of LOTP to certainty about a future belief |
      | **Counterexamples** | Essentially impossible (violates LOTP/math)      | Abundant (drunkenness, senility, brainwashing) |
      | **Community Focus** | Probabilistic consistency *now*                  | Rational deference to future selves, self-trust |
      | **Status**          | Uncontroversial mathematical theorem             | Contested normative principle requiring refinement |

  5.  **Why the Disconnect? Same Math, Different Focus:**
      *   **LessWrong (Rationalist Community):** Focuses intensely on *ideal Bayesian reasoning* and *internal consistency*. CEE is a powerful tool for exposing biases (e.g., hindsight bias, update asymmetry) *within that framework*. The counterexamples to RP are dismissed as irrelevant to the *core mathematical point* about evidence updating because they involve scenarios violating the (often unstated) assumption that future updates are rational. LW treats "anticipating being irrational" as a different problem outside the scope of pure probabilistic coherence *about evidence updating*.
      *   **Formal Epistemology (Philosophy):** Is deeply concerned with the *normative foundations of rationality* and how principles like RP apply to *real, imperfect agents* in messy situations. The counterexamples highlight genuine puzzles about rational self-governance over time, deference, and what constitutes an "epistemically superior" standpoint. Philosophers are trying to articulate *when and why* you *should* defer to your future self, not just when math forces it in a highly constrained evidence-updating scenario.

  **Conclusion:** You are *not* missing a major technical difference in the underlying probability theory. Both are LOTP in different clothing. The difference lies entirely in **framing and scope**:

  *   **CEE** is a **mathematical theorem** about the **expectation of rationally updated beliefs conditional on anticipated evidence**. Its scope is narrow and its truth is derived directly from probability axioms. Counterexamples involve irrationality, which falls outside its defined scope.
  *   **RP** is presented as a **normative principle** about **deferring with certainty to a specific future belief state**, *regardless of how it was formed*. This broad, normative framing makes it vulnerable to counterexamples where the future state is reached irrationally. Philosophers contest it *because* they take its broad normative claim seriously and seek to refine it into a plausible principle of rational self-trust applicable to non-ideal agents.

  It's less about communities not reading each other (though that happens) and more about them asking fundamentally different questions about the *same* mathematical structure. LW asks: "What does probability theory *demand* of my updating procedure?" Formal Epistemology asks: "When, in principle, *should* I trust my future self, and what does that imply for my current beliefs?" The first question has a definitive mathematical answer (CEE). The second question is philosophically rich and contested, leading to the decades of refinement around Reflection. The philosophers aren't being unnecessarily precious; they're tackling a harder, messier, but deeply important problem about rational agency over time.
