  ## MEMORANDUM  
  TO: Graduate Committee Members  
  FROM: Committee Secretary  
  RE: Recommendation on the Frege Prize Name & Ethical Acknowledgment  
  DATE: 15 October 2023  

  **1. Background & Committee Deliberation**  
  This memo addresses the ethical status of the Frege Prize in light of Frege’s posthumously discovered 1924 diary, which expresses virulent antisemitism, including advocacy for stripping Jewish citizens of political rights. The committee has rigorously debated whether this requires renaming the prize, retaining it as-is, or retaining it with formal acknowledgment. Key points of contention include:  
  *   The **relevance** of the diary to Frege’s philosophical work.  
  *   The **symbolic meaning** of continuing to award a prize under Frege’s name.  
  *   The **precedent** set by any action (or inaction).  

  **2. Strongest Argument for Renaming the Prize (Presented Fairly)**  
  The core argument for renaming is **moral consistency and the inescapability of endorsement**:  

  *   **Symbolic Endorsement:** Awarding a prize explicitly named for Frege constitutes an ongoing institutional honor bestowed upon *the person*, not merely the work. Regardless of intent, this perpetuates Frege’s status as an intellectual hero *simpliciter* within the department.  
  *   **Severity & Relevance of the Offense:** Frege’s diary advocates for the political disenfranchisement of Jews based on racial essentialism. This is not merely a "private complaint" or a product of its time, but a call for state-sanctioned persecution. While occurring late in life, it reflects a profound moral failing.  
  *   **Moral Taint & Separation Fallacy:** The attempt to rigidly separate the "pure" philosopher from the antisemitic person is conceptually flawed. While his logic may be formally separable, honoring *him* unavoidably honors the totality of the person who held these abhorrent views. The diary reveals a character fundamentally at odds with the values of intellectual community and equality we must uphold.  
  *   **Impact on Community:** Continuing the name signals to Jewish students, colleagues, and visitors that the department implicitly tolerates the honoring of someone who wished to strip people like them of fundamental rights. This creates a hostile climate, regardless of the committee's intent.  
  *   **Precedent of Integrity:** Renaming demonstrates a commitment to ethical responsibility over historical inertia. It acknowledges that some legacies, upon fuller revelation, become incompatible with public honor. Many institutions have renamed awards or buildings upon similar reckonings (e.g., removing names of eugenicists). This is not "erasure" but a necessary ethical correction.  

  **3. Strongest Argument for Retaining the Name As-Is (Presented Fairly)**  
  The core argument for retention is **the categorical separation of philosophical contribution from personal biography and the protection of intellectual history**:  

  *   **Category Error:** The prize recognizes excellence in *logic and philosophy of language*. Frege's foundational contributions in these specific domains (e.g., quantification, sense/reference, logicism) are objectively monumental and demonstrably separable from his personal, late-life antisemitism. Judging the *philosophical work* or the *name of the award* by his private, non-philosophical writings commits a fundamental category mistake.  
  *   **Absence of Philosophical Contamination:** There is no evidence that Frege’s antisemitic views influenced the *content*, *method*, or *arguments* presented in the *Begriffsschrift*, *Grundlagen*, or *Grundgesetze* (vol. I). His philosophical legacy stands independently. Honoring this specific contribution does not imply endorsement of his unrelated, reprehensible personal views.  
  *   **Danger of Retroactive Purity Tests:** Applying modern moral scrutiny to historical figures' private writings, especially those unrelated to their professional work, sets a dangerous precedent. Many foundational figures across disciplines (philosophy, science, literature, politics) held views now considered abhorrent. Renaming based on this risks a perpetual, destabilizing revisionism that ultimately diminishes our connection to intellectual history.  
  *   **Function of the Prize:** The prize's purpose is to incentivize and reward outstanding graduate work in specific technical fields. Its efficacy and meaning derive from its association with Frege's *intellectual achievements* in those fields, not his personal character. Changing the name severs this specific, valuable link to the history of the discipline.  
  *   **Slippery Slope:** Renaming creates an expectation that *any* problematic personal view held by *any* historical namesake warrants removal. This is administratively untenable and philosophically suspect, potentially leading to the erasure of complex but essential figures from disciplinary memory.  

  **4. Recommended Action: Retain the Name with a Mandatory Standing Acknowledgment**  
  After careful consideration of the strong arguments on both sides, the committee secretary recommends a **third path: Retain the name "Frege Prize" but institute a permanent, formal acknowledgment of Frege's antisemitism accompanying all future announcements, awards, and records of the prize.**  

  *   **Rationale for Retention:** Frege's contributions to logic and philosophy of language remain uniquely foundational and defining for these fields. The prize name serves a valuable historical and disciplinary function by directly linking contemporary excellence to the origin of these core analytic traditions. Renaming risks obscuring this specific intellectual lineage.  
  *   **Rationale for Acknowledgment:** Ignoring the diary is morally untenable and perpetuates harm. A standing acknowledgment directly addresses the core concern of endorsement:  
      *   It explicitly **disassociates** the award and the department from Frege's antisemitic views.  
      *   It **acknowledges the harm** caused by those views and their presence in his legacy.  
      *   It **demonstrates transparency** and a commitment to confronting uncomfortable historical truths.  
      *   It **educates** recipients and the community about the complex, flawed nature of historical figures.  
  *   **Implementation:** The acknowledgment should be concise, factual, and solemn. Example:  
      > "The Frege Prize recognizes outstanding graduate work in logic and philosophy of language. While Gottlob Frege's foundational contributions to these fields are honored by this award, the Department explicitly rejects and condemns the antisemitic views expressed in his personal diary, which advocated for the disenfranchisement of Jewish citizens. This acknowledgment stands as a permanent reminder of the need to confront harmful legacies within our intellectual history."  
      *(This text would appear on all call for nominations, award certificates, department website listings, and event programs.)*  

  **5. Why This Path Over Renaming or Pure Retention**  
  *   **Avoids Endorsement (vs. Pure Retention):** Pure retention ignores the valid concern that the name alone constitutes an unqualified honor. The acknowledgment actively counters this perception.  
  *   **Preserves Intellectual History (vs. Renaming):** Renaming severs the specific link to Frege's *philosophical* achievements. This option maintains that link while forcefully rejecting the unacceptable *personal* legacy.  
  *   **Manages Precedent:** It establishes a framework for acknowledging problematic aspects of historical figures *without* requiring automatic renaming, focusing instead on transparency and disavowal.  
  *   **Practical & Symbolic Balance:** It allows the prize to continue its core function while demonstrating the department's ethical awareness and responsibility.  

  **6. Proposed Committee Vote**  
  I recommend the full committee vote on the following motion:  
  > "The Graduate Committee moves to retain the name 'Frege Prize' for the annual award for the best graduate essay in logic or philosophy of language. Simultaneously, the Committee institutes a permanent standing acknowledgment, as drafted in Section 4, to be included on all official materials related to the prize henceforth, explicitly condemning the antisemitic views expressed in Frege's 1924 diary."  

  This recommendation seeks a path that respects the gravity of Frege's antisemitism, the integrity of his philosophical contributions, the concerns of our community, and the educational mission of the department. It moves beyond simple retention or erasure towards a more nuanced and responsible engagement with our disciplinary history.
