  First, I recall the basics. The conditional analysis says: X is fragile iff if it were struck, it would break. Finkish cases involve a disposition that disappears when the stimulus is applied. For example, a wizard protecting a glass—struck, but not fragile at that moment because the magic removes the fragility. Masking cases, like bubble-wrapped glass, have the disposition present but blocked. The glass is fragile, struck, but doesn't break because the bubble wrap prevents it.

