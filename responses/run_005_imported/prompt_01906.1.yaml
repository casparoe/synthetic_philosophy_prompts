  First, I need to accurately present Berker's argument. He critiques the accuracy-dominance justification for probabilism. Joyce showed that non-probabilistic credences are accuracy-dominated. But Berker points out that in cases like dominated credences, avoiding dominance might require trade-offs. For example, if assigning a high credence to one proposition makes another more accurate overall, even if it's inaccurate for that proposition. This mirrors Rawls' separateness of persons. The key is whether such trade-offs are epistemically permissible.

  Next, the user wants engagement with counterarguments. One approach is to deny the analogy to persons. Propositions aren't agents with interests, so no "wronging" occurs. But Berker might say the issue is normative independence, not just interests. Another counter is to adjust the inaccuracy measure. Using a strictly proper scoring rule like Brier score ensures that expected accuracy is maximized only by true credences. But even then, trade-offs might still happen. Maybe a non-aggregative approach? Pettigrew's per-proposition dominance? But that might not fully solve the problem.

