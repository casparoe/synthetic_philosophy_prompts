  For Sleeping Beauty, they want to explore if memory loss is a different threat than cognitive degradation. The speaker might downplay the difference. The follow-up should press on whether forgetting changes self-trust dynamics compared to knowing about impairment.

  The analogy to Lewis's Principal Principle is another angle. The user wants to know if this analogy explains anything or just relabels the issue. The follow-up should question if treating future selves as experts is justified when they might be compromised.

  They also need a closing question about genuine counterexamples. The speaker might dismiss cases by redefining rationality. The follow-up should ask if any empirical scenario could falsify the principle.

  The user is an academic in formal epistemology, so the questions must be precise and show deep engagement. They want to avoid letting the speaker retreat to standard responses. The questions should push the speaker into new territory, revealing potential weaknesses in her unrestricted view. 

