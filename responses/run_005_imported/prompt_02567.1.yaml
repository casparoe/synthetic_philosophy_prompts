prompt: |-
  Got into it with my friend last night over Hart vs Fuller and neither of us gave an inch. It started with the grudge informer case -- the wife who ratted her husband out to the Nazis for badmouthing Hitler while he was home on leave, got him a death sentence (commuted, but still), and then got prosecuted herself once a German court had to decide in '49 whether the law she used was ever really law. My friends a hardcore Fullerian: says a legal system that rotten just isn't law, full stop, so the court wasn't retroactively punishing her, it was just refusing to dignify Nazi statutes with the name. I took Hart's side, that the statute was law whether we like it or not, and that the honest move would've been a frank retroactive law against her rather then pretending 'law' has a built in morality filter. Then we somehow ended up on 'no vehicles in the park' too -- she kept insisting you can't even apply that rule to an ordinary car without smuggling in the park's purpose, and that Hart's whole 'plain core meaning' idea for easy cases is a fiction for exactly that reason. Neither of us actually cracked the other, we just ran out of steam. Could you write a dialogue between a convinced Hartian and a convinced Fullerian that actually fights this out properly -- both flashpoints, real engagement, nobody just restating their priors -- and see where, if anywhere, they end up?
