  First, I need to recall the key points of the Hart-Fuller debate. Hart represents legal positivism, arguing that law is separate from morality. A law is valid if it follows the system's rules, regardless of its moral content. Fuller, on the other hand, argues for a connection between law and morality, proposing that for a system to be considered legal, it must meet certain procedural moral standards, his eight principles of legality.

  The grudge informer case is central here. In post-war Germany, a woman used a Nazi statute to report her husband for derogatory remarks about Hitler. He was sentenced to death, though it was commuted. After the war, she was prosecuted. The question was whether the Nazi law was valid. Fuller would say no, because the Nazi system didn't meet the criteria for legality, so her act wasn't protected by law. Hart would argue that the law was valid under the Nazi system, so punishing her required a new retroactive law, not pretending the old law wasn't valid.

  The other point is the "no vehicles in the park" rule. Hart uses this to illustrate that in easy cases, the core meaning of words suffices for application, while in hard cases (like bicycles or ambulances), interpretation is needed. Fuller would counter that even in so-called easy cases, applying the rule involves considering the purpose behind the rule, thus requiring moral evaluation.

