  ## MEMORANDUM: Honorary Fellowship Nomination - Air Marshal [REDACTED] - Recommendation  
  **To:** Committee on Honorary Fellowships  
  **From:** [Your Name], Committee Member  
  **Date:** [Date]  
  **Subject:** Principled Recommendation Regarding Nomination of Air Marshal [REDACTED]  

  This memo addresses the nomination of Air Marshal [REDACTED] for an Honorary Fellowship, specifically considering the concerns raised invoking Elizabeth Anscombe's opposition to President Truman's honorary degree in 1956. It aims to ground the discussion in Anscombe's actual philosophical arguments, fairly represent the case for the Air Marshal, and provide a reasoned recommendation.

  **1. The Case for the Air Marshal (Stated Fairly):**  
  Proponents argue that the Air Marshal faced an agonizing choice during the prolonged [City Name] siege. Intelligence indicated the siege could continue for up to another year, causing widespread starvation, disease, and societal collapse, with estimated civilian deaths vastly exceeding the thousands tragically killed by the strikes. By ordering decisive strikes on critical infrastructure (power, water), he precipitated the siege's end within a week. His defenders contend this action, while horrific in its immediate consequences, constituted a lesser evil – a tragic necessity that ultimately saved a far greater number of lives. His nomination recognises the burden of command in extremis and the consequentialist logic that guided his decision to prioritise ending the suffering swiftly, albeit brutally.

  **2. Anscombe's Core Argument (Beyond "Double Effect" Simplification):**  
  Anscombe's objection to Truman (specifically regarding the atomic bombings of Hiroshima and Nagasaki) was **not merely about unintended civilian deaths or the Doctrine of Double Effect (DDE) as a mathematical calculation.** Her argument was far more fundamental and absolute:

  *   **The Absolute Prohibition on Intentional Killing of the Innocent:** Anscombe, drawing on Catholic natural law tradition (especially Aquinas) which she rigorously defended, argued that it is *always intrinsically evil* to intentionally kill an innocent human being. This prohibition is categorical, not contingent on consequences.
  *   **"Intention" is Key:** The DDE, for Anscombe, wasn't a loophole for achieving good ends via foreseeably evil means. Its core function was to distinguish between:
      *   **Intending an evil as a means or an end:** (Absolutely forbidden).
      *   **Foreseeing an evil as a *side-effect* of an otherwise permissible action:** (Potentially permissible *if* proportionate).
  *   **Truman's Case:** Anscombe argued that targeting civilian populations (Hiroshima/Nagasaki) *was* the chosen means to achieve the end of Japanese surrender. The deaths weren't a tragic side-effect of attacking a legitimate military target; the civilians *were* the target. Therefore, the killing was *intended* as the means to break morale and force capitulation. This, for Anscombe, was murder on a vast scale, making Truman unworthy of an honour from an institution dedicated to truth and moral principle.

  **3. Applying Anscombe's Principle to the Air Marshal's Action:**  
  The parallels are significant and ethically challenging:

  *   **The Nature of the Target:** The Air Marshal ordered strikes on the city's power grid and water plants. While infrastructure *can* be dual-use, the stated purpose and known, immediate effect was the deprivation of essential life-sustaining utilities to the entire civilian population within the besieged city.
  *   **The Foreseen Consequence:** The Air Marshal acted *knowing* these strikes would cause the deaths of "several thousand civilians fast." Intelligence clearly predicted this outcome.
  *   **Intention vs. Foresight:** This is the crux. Proponents frame the civilian deaths as a *foreseen but unintended* side-effect of attacking infrastructure to break the siege. However, Anscombe would likely argue:
      *   The deprivation of water and power to civilians *was the direct mechanism* chosen to achieve the strategic goal of breaking the siege. It wasn't collateral damage from attacking a munitions factory; it was the *means* itself.
      *   The rapid civilian deaths were not an accidental by-product; they were the *predictable and necessary instrument* to achieve the desired psychological and physical collapse of the city's resistance within a week.
      *   Therefore, under Anscombe's strict definition, the deaths of these civilians were not merely *foreseen* but *intended as the means* to achieve the end (ending the siege). The action was chosen *because* it would cause this specific, catastrophic effect on the civilian population to force the enemy's hand.

  **4. The Consequentialist Counter-Argument and Anscombe's Rejection:**  
  The Air Marshal's advocates present a powerful consequentialist argument: net lives saved. Anscombe, however, explicitly rejected this calculus *when the act itself involved an intrinsic evil* (intentional killing of the innocent). For her, consequences cannot justify an inherently immoral act. To honour someone for such an act, even one taken under duress with arguably good consequences, is to endorse the principle that such acts *can* be justified by outcomes. This, she believed, corrupts moral reasoning and the institution bestowing the honour.

  **5. The Oxford Context and the Meaning of an Honorary Fellowship:**  
  An Oxford Honorary Fellowship signifies more than recognition of effectiveness or difficult choices made. It represents an alignment with the intellectual, ethical, and humanistic values the College seeks to embody and promote. Anscombe's protest was fundamentally about Oxford maintaining its moral integrity by refusing to honour actions that violated foundational ethical principles, regardless of their consequences or the stature of the individual.

  **6. Recommendation:**  
  Based on a rigorous application of the principle invoked by committee members – Elizabeth Anscombe's core argument against intentionally targeting the innocent, which she believed was exemplified in Truman's case and finds a strong parallel here – **I recommend voting against the conferral of the Honorary Fellowship upon Air Marshal [REDACTED].**

  *   **Reasoning:** While acknowledging the horrific dilemma and the Air Marshal's stated aim of minimizing overall suffering, his chosen method involved actions that, under Anscombe's stringent analysis, constitute the *intentional use of lethal force against civilians as a direct means* to achieve a strategic objective. Honouring him for this specific action risks endorsing the principle that the ends can justify intrinsically evil means, a principle Anscombe argued Oxford must repudiate to maintain its moral standing. This decision is not a judgment on the Air Marshal's entire career or character, nor a denial of the complexity he faced. It is a judgment about the *specific act* for which he is nominated and its incompatibility, under the Anscombe principle, with the ethical significance of this particular honour.

  **7. Conclusion:**  
  This is a profoundly difficult decision, forcing us to confront the tension between utilitarian necessity in desperate situations and absolute moral prohibitions. The Air Marshal's advocates present a compelling case based on outcomes and the burden of command. However, Elizabeth Anscombe's challenge forces us to ask not only "did it work?" or "was the net outcome better?", but "was the act itself inherently morally licit?" Her resounding answer, applied to actions involving the intentional targeting of civilians as a means, was "no." To honour such an act, she would argue, compromises the very values an institution like this College exists to uphold. I believe we should uphold this principle.
