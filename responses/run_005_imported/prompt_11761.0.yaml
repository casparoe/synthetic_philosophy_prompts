prompt: |-
  Okay so I co-run a tiny philosophy-of-computer-science podcast with a friend (a few hundred subscribers, mostly people we know from the same LW/ACX-adjacent Discords), and next week we're recording with a guest whose spent basically her whole career arguing that computational complexity theory -- not just plain old Turing-style computability -- is the right tool for dissolving a bunch of classic philosophical chestnuts. It's very much in the tradition of that old Aaronson essay "Why Philosophers Should Care About Computational Complexity" that resurfaces on LW every couple of years, except she's built it into a whole research program. Three of her signature claims: (1) the "a waterfall implements every computation" objection to computationalism gets defanged once you insist the mapping from physical microstates to computational states has to be efficiently computable, not just computable-in-principle; (2) free will is best cashed out through something like a "freebit" picture, where choices are unpredictable not because of any libertarian magic but because predicting them would require information that's Knightian-uncertain to any outside observer -- amplified up from microscopic quantum noise and shielded from copying by the no-cloning theorem; and (3) P vs NP is basically a rigorous, formalized version of the old insight-vs-verification distinction people have always gestured at when talking about mathematical creativity.

  My co-host is worried we'll just let her restate the framework for 40 minutes and everyone nods along. Can you draft me 8-10 interview questions -- at least one real one on each of the three claims above -- that push on the actual soft spots instead of just inviting a recap? Like for (1), the obvious complaint that "efficiently computable" just relocates the arbitrariness of the mapping rather than removing it (who decided poly-time was the magic threshold and not, say, NC or logspace?); for (2), the worry that this is just garden-variety indeterminism wearing a complexity-theory costume, and that it makes free will hostage to an unsettled empirical question about decoherence timescales in warm wet brains; and for (3), the fact that the whole analogy leans on an unproven conjecture, plus the suspicion that reducing "creativity" to brute-force search misses whatever's actually creative about it (problem choice, aesthetic taste, knowing which lemma to reach for, etc). For each question, throw in a quick follow-up keyed to whatever answer she's most likely to give, so we don't get stuck nodding along ourselves.
