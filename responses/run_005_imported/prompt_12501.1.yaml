  **What both missed:**  
  1. **Alternative frameworks**: Neither considered consequentialist approaches (e.g., utilitarianism) where lying becomes obligatory to save lives, nor did they examine Aquinas' distinction between lying and mental reservation (truthful evasion).  
  2. **Epistemic limitations**: Augustine's stance assumes perfect knowledge of divine law, but real-world dilemmas involve uncertainty about the hunters' intent or the hidden person's guilt.  
  3. **Cultural relativity**: The Hebrew midwives narrative suggests ancient Jewish ethics prioritized life over truth differently than Augustine's neo-Platonic idealism.  
  4. **Practical consequences**: Ellie's "reductio" implicitly assumes lying *works*, ignoring scenarios where lying escalates violence or corrupts the liar's character – concerns central to Augustine's position.  
  5. **Modern parallels**: Contemporary equivalents (e.g., lying to Nazis about hidden Jews) reveal most ethical systems *do* permit lying in extremis, making Augustine's view a theological outlier rather than universal logic.  

  The core oversight was treating this as binary ("permitted vs. forbidden") rather than exploring how different ethical traditions *balance* competing values when duties conflict – a nuance Augustine's rigid hierarchy struggles to accommodate.
