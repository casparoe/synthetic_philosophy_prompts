  The relationships among the solution concepts in finite two-player normal-form games are structured as follows. The Nash equilibrium (NE) set is the smallest, as every Nash equilibrium is also a correlated equilibrium, and NE strategies are rationalizable. The correlated equilibrium (CE) set contains NE, as correlated equilibria generalize Nash equilibria by allowing correlated signals. The rationalizable strategies (RAT) and strategies surviving iterated elimination of strictly dominated strategies by mixed strategies (ESDS-mix) are equivalent in two-player games and contain CE. Strategies surviving iterated elimination of strictly dominated strategies by pure strategies (ESDS-pure) form the largest set, as mixed strategies can dominate more strategies than pure ones alone. The set of strategies surviving iterated elimination of weakly dominated strategies (EWDS) is unplaceable due to its dependence on elimination order and potential incomparability.

