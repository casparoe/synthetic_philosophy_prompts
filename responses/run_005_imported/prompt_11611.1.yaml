  Here is a eulogy draft that honors your mother's life, work, and love, staying true to her non-reductive physicalism while speaking powerfully to both audiences. It weaves her core philosophical commitment into the narrative of her life, showing its practical, human meaning.

  **Eulogy for [Mother's Name]**

  Good morning. For those who don't know me, I’m [Your Name], [Mother's Name]’s child. Two weeks ago feels like both an eternity and a single, impossible moment. The world feels… different without her. Sharper edges, maybe. Less light.

  My mom, [Mother's Name], lived a life dedicated to understanding. For nearly 30 years in this very university, she wrestled with one of the hardest questions we can ask: how does the mind – our thoughts, our feelings, our *selves* – fit into the physical world? How does something like *love* actually *do* something in a universe made of matter? She spent her career passionately defending an idea that the mental isn't some ghostly extra, nor is it just an illusion – it’s real, it matters, and it genuinely causes things *in and through* the physical world. She called it the "subset view." The essence wasn't competition, but integration.

  Now, I know half of you [gesture towards the department] could launch into a spirited debate right now about whether that truly sidesteps Jaegwon Kim’s exclusion problem or if it’s just epiphenomenalism in a clever hat. Trust me, we’ve had those debates at the kitchen table, and even after her wake. Mom loved that fight. She relished the intellectual rigor, the careful argument, the refusal to accept easy answers that diminished either the complexity of the brain or the undeniable reality of experience. She wouldn't want us to stop asking those questions.

  But today isn't about winning the philosophical argument. Today is about honoring the woman who lived that conviction, not just in her office, but every single day.

  Because Mom’s profound belief that the mental is *causally potent within the physical* wasn’t just an academic stance. It was the blueprint for how she lived. She believed, fiercely, that her thoughts, her intentions, her *love* – weren't just passive passengers. They were active forces, shaping the physical world *through* her actions, her words, her very presence.

  Think about it:

  *   Her **love for us, her family**, wasn't some disembodied feeling floating in the ether. It *was* the warmth of her embrace. It *was* the late nights she spent listening, truly listening, to our teenage dramas or existential crises. It *was* the meticulous way she planned birthday surprises, the fierce protection she offered when we were hurt, the patient explanations given over homework at the kitchen table long after she must have been exhausted. Her love *became* actions. It *caused* comfort, security, encouragement, growth. It built the physical reality of our family life. The causal power of her love *was* the causal power of her showing up, consistently, attentively, caringly.

  *   Her **passion for her students and her field** wasn't just neurons firing. It *was* the hours spent crafting lectures that made the dense clear and the abstract urgent. It *was* the detailed, thoughtful feedback on papers, often returned faster than anyone expected. It *was* the way she championed struggling students, opening her office door and her heart. It *was* the rigor and clarity of her writing, pushing the debate forward. Her intellectual passion *became* mentorship, inspiration, challenge, and genuine progress in understanding. It *caused* careers to be launched, minds to be changed, and ideas to take root.

  *   Her **sense of justice and compassion** wasn't an inert belief. It *was* marching where it mattered. It *was* speaking up against unfairness, big or small. It *was* the quiet donations, the volunteer hours, the unwavering support for friends in crisis. Her convictions *became* tangible support, advocacy, and change in her community. They *caused* things to be better for others.

  Mom didn't believe her love was a separate, rival force to her body and brain. She believed her love *found its true expression and its real power* precisely *through* her physical being in the world – through her voice, her hands, her time, her energy. Her mental life wasn't *added on*; it was *woven in*, manifesting in countless tangible ways. The "subset" wasn't a limitation; it was the *channel* through which her inner world became our outer reality. It meant her love wasn't less real; it was *more* real, because it *did* something. It mattered. It caused ripples that changed lives.

  So, to her colleagues: She never gave ground on the reality and efficacy of the mental. She argued brilliantly that it doesn't compete; it *completes* within the physical framework. Her work stands.

  And to her family, her friends, her students: Her love was not an illusion. It was not just a story. It was as real as the ground we stand on. It *did* things. It shaped us. It comforted us. It challenged us. It built this family. It changed this department. It made this world better, in countless, tangible ways. The proof isn't just in our grief, but in the strength she gave us, the values she instilled, the memories that are etched not just in our minds, but in the very fabric of who we are *because* of her.

  Mom showed us that the mind matters. Not by magic, but by the profound, everyday miracle of a thought becoming a word, a feeling becoming an embrace, an intention becoming an action, love becoming *life lived*.

  Her physical presence is gone. But the causal power of who she was – her intellect, her passion, her fierce, unwavering love – that power has already done its work. It’s in us. It’s in the choices we make, the love we give, the standards of integrity and care we uphold. Her love doesn't need to watch *over* us from somewhere else; it lives *within* us and *through* us, shaping the physical world still, one action, one choice, one act of love at a time.

  That was her life’s work. That was her gift. And that is her enduring legacy. We will miss her every single day. And we will carry her forward, always.

  ---

  **Key elements and why they work:**

  1.  **Acknowledges the Loss & Her Field:** Starts with raw emotion and immediately connects it to her professional passion.
  2.  **Explains the Core Idea Accessibly:** Uses plain language ("integration," "woven in," "channel," "causes things *in and through* the physical world") to convey the *essence* of the subset view without jargon. Emphasizes **causal potency** and **manifestation**.
  3.  **Directly Addresses the Debate (Subtly):** Mentions Kim and epiphenomenalism explicitly, acknowledges the ongoing argument ("she wouldn't want us to stop"), and frames it as part of her passion, but firmly shifts the focus to the *meaning* of the idea for her *life*.
  4.  **Uses Concrete Examples:** Provides multiple, relatable examples of how her mental states (love, passion, conviction) **manifested as specific physical actions** that **caused specific effects** (comfort, security, growth, inspiration, change). This is the heart of the argument *for* the subset view's efficacy and *against* epiphenomenalism/eliminativism in a human context. It *shows* the causal power.
  5.  **Connects Philosophy to Life:** Explicitly states: "Mom’s profound belief... was the blueprint for how she lived." Makes the abstract philosophy the foundation of her concrete humanity.
  6.  **Reframes "Subset" Positively:** Calls it the "channel" through which her inner world became outer reality. Argues this makes her love *more* real, not less, because it *does* something.
  7.  **Addresses Both Audiences Explicitly:**
      *   *To Colleagues:* "She never gave ground... Her work stands." Affirms her core stance held firm.
      *   *To Family/Friends:* "Her love was not an illusion... It *did* things... It shaped us... It built this family." Directly counters eliminativism and affirms reality and efficacy.
  8.  **Explains the Legacy:** Her causal power lives on *through* the effects she had on others, *through* their actions. "It’s in us... shaping the physical world still." This avoids dualistic "spirit causing things" by grounding her ongoing influence in the physical actions and choices of those she impacted. It's a powerful, non-supernatural conclusion consistent with her views.
  9.  **Emotional Landing:** Focuses on love, impact, legacy, and carrying her forward. Ends on a note of enduring connection through action.

  **Delivery Tip:** Speak slowly, pause for emotion, make eye contact with both sides of the room. This bridges the gap by honoring the intellectual rigor she loved while focusing on the profound human impact everyone felt. It doesn't resolve the Kim debate; it transcends it by showing why her answer mattered so deeply to *her* and to *all* of you.
