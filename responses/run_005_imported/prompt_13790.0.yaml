answer: |-
  ## Dialogue: The Negation Knot

  **Characters:**  
  *   **Eva (Expressivist):** Defends a Gibbard/Blackburn-style attitude logic. Believes complex attitudes can solve negation without smuggling in propositions.  
  *   **Cris (Critic):** Presses the Unwin/Schroeder negation problem. Skeptical that attitude logic escapes the core dilemma.

  **(Setting: Philosophy department common room, coffee in hand)**

  **Cris:** Eva, I appreciate your defense of expressivism against the Frege-Geach core case. Planning states or commitments might handle embedded contexts like conditionals. But let’s cut to the real thorn: negation. If "Cruelty is wrong" expresses disapproval of cruelty, what on earth does "Cruelty is *not* wrong" express? "Not disapproving"? That’s hopelessly inadequate.

  **Eva:** Agreed, Cris. Mere absence isn’t negation. That’s why we need a richer structure. Think Blackburn’s commitment semantics or Gibbard’s planning states. "Cruelty is not wrong" doesn’t express *no* attitude. It expresses a *specific*, *oppositional* attitude within the normative framework.

  **Cris:** Oppositional? Like… approval? But that’s clearly wrong. Saying cruelty isn’t wrong isn’t endorsing it! One could be indifferent, or ignorant, or think it’s merely permissible. Your "oppositional attitude" seems to conflate denying wrongness with affirming rightness.

  **Eva:** No, no. It’s not approval. It’s a *rejection* of the commitment expressed by "wrong." Think of it as the attitude of *withholding* the disapproval commanded by the norm. In Gibbard’s terms: endorsing a plan that *does not include* forbidding cruelty. This is distinct from indifference. Indifference might be *not having* a plan about cruelty. Negation is *having* a plan that *specifically permits* it, or at least *refuses to forbid* it.

  **Cris:** Okay, let’s parse that. So "Cruelty is not wrong" expresses endorsing a plan where forbidding cruelty is *absent*? But how is that different from simply not having considered cruelty at all? My plan for baking a cake doesn’t forbid cruelty either, but that doesn’t mean I think cruelty isn’t wrong!

  **Eva:** Fair point. The context matters. The negation operates *within* the domain of moral consideration. Uttering "Cruelty is not wrong" presupposes we *are* discussing norms governing actions like cruelty. It expresses endorsing a plan *for the relevant domain* (say, interpersonal actions) that *lacks* the directive "forbid cruelty." Crucially, it’s an *active* endorsement of that *lack* in the normative structure. Indifference is passive non-consideration.

  **Cris:** "Active endorsement of the lack"... That sounds perilously close to reintroducing a proposition – the proposition that the norm forbidding cruelty is *incorrect* or *does not apply*. Aren’t you just calling that "endorsing a plan lacking a prohibition"? The logical work seems done by the *content* of what’s lacking, not the attitude itself.

  **Eva:** Not necessarily. The attitude *is* the endorsement of the plan-state. The "logical relations" emerge from the *incompatibility* of planning states. Endorsing a plan that forbids cruelty is *incompatible* with endorsing a plan that lacks that prohibition (in the relevant context). That incompatibility is a feature of the practical logic of planning, not derived from truth-conditions. Negation is defined by this incompatibility: accepting "not-P" is accepting a state incompatible with accepting "P."

  **Cris:** Ah, the famous incompatibility! But here’s Schroeder’s bootstrapping problem. *Why* are those two planning states incompatible? If expressivism is truly non-representational, the incompatibility can't come from the *propositions* they would represent conflicting. It has to be a *brute* feature of the attitudes themselves. But that seems arbitrary. Why *can't* I simultaneously plan to forbid cruelty *and* plan a world where it’s not forbidden? Unless... you're *defining* the attitudes by their mutual exclusivity, which just sneaks logical form back in through the back door!

  **Eva:** It’s not brute, Cris. It stems from the *functional role* of these attitudes in guiding action and deliberation. Trying to *act* on both plans – forbidding cruelty while simultaneously endorsing a plan where it’s not forbidden – leads to practical incoherence, a kind of deliberative paralysis or contradiction in intention. The incompatibility arises from the *purpose* of normative language: to coordinate and guide action. Two plans prescribing incompatible directives for the same situation *cannot* be jointly implemented. That’s where the logic gets its grip.

  **Cris:** Functional role, practical incoherence... Fine. But let’s test this with a specific case. Suppose I say: "If donating to this charity isn't wrong, then I will donate." According to your logic, the antecedent expresses... what? Endorsing a plan that *lacks* a prohibition on donating to that charity?

  **Eva:** Essentially, yes. Accepting the conditional involves a complex planning state: being disposed to adopt the plan "I will donate" *if* I adopt the plan-state that lacks a prohibition on donating to that charity.

  **Cris:** And the negation *inside* the antecedent? "Isn't wrong" – that's the negation we're struggling with! You've just relocated the problem. How does *that* negation – "lacking a prohibition" – differ from mere indifference *within* the conditional context? How does your "incompatibility" logic generate the right truth-preserving inference? If the charity *is* wrong (so I *disapprove*), then the antecedent ("it isn't wrong") is... what? *Not* endorsing the lack-of-prohibition plan? But that could be indifference or disapproval! How does this force the *denial* of the consequent?

  **Eva:** The inference works because accepting the conditional *and* accepting that donating *is* wrong (i.e., endorsing the plan that forbids it) commits me to a conflict. Accepting "If not-P, then Q" and accepting "P" commits me to both endorsing the lack-of-prohibition plan *if* I endorse the lack-of-prohibition plan (a tautology, but via the conditional) *and* endorsing the prohibition plan (via "P"). But endorsing the prohibition plan is *incompatible* with endorsing the lack-of-prohibition plan for the same act. So, accepting both the conditional and "P" generates an *incompatible* set of planning states. To avoid incoherence, I must reject either the conditional or "P" or... crucially... *not* be committed to Q if I find myself in the "not-P" state. If I accept "P" (it is wrong), I must reject the conditional *or* be committed to *not* being disposed to donate even if I were to accept not-P. The modus tollens pressure comes from the threat of practical incoherence.

  **Cris:** *<Sighs, takes a long sip of coffee>* Eva, it’s clever. Truly. But the machinery feels increasingly baroque. You start with a simple attitude (disapproval), but to handle negation and embedding, you posit complex, structured, logically interrelated planning states defined by functional roles and incompatibilities. The *logical behavior* – the incompatibilities, the inferences – is doing all the work. The connection to the original, simple, non-cognitive attitude feels stretched thin. Isn’t this "plan-lacking-prohibition-X" state just a *proxy* for the proposition "X is not wrong"? And haven’t you just rebuilt a quasi-propositional structure out of attitudes, complete with its own "truth" (plan endorsement) and "falsity" (plan rejection or incompatible endorsement)? The ghost of propositions haunts your logic of attitudes.

  **Eva:** It *is* complex, Cris. I won't deny that. Expressivism isn't the simple "Boo!" theory anymore. But the core non-representational commitment remains: the fundamental state expressed is *endorsing a plan for what to do*. The "proposition-like" behavior emerges *from* the logic of planning, not the other way around. The attitude is still primary, even if it's highly structured. We haven't *reintroduced* truth-conditional content covertly; we've built a *logic* for practical commitments. The ghost isn't propositions; it's the inescapable structure of rational practical thought.

  **Cris:** "Inevitable structure of rational practical thought"... which looks suspiciously like the structure of logical relations between propositions. I fear we've reached the stalemate Schroeder predicted. Either your negation attitude ("endorsing lack-of-prohibition") is too weak (collapsing into indifference/ignorance), or the logic you need to make it strong enough and generate the right inferences effectively replicates the very propositional logic you sought to avoid. Your move saves the phenomena, but perhaps at the cost of the original expressivist motivation. <Stands up> More coffee? I think we’ll need it. This knot won’t untangle easily.

  **Eva:** <Smiles wryly> Strong coffee sounds perfect. And you’re right, Cris. The negation problem cuts deep. Maybe the attitude *has* to be complex enough to mirror the logic... or maybe that mirroring *is* the concession. Let’s get that coffee. The debate continues.

  **(End Scene)**

  **Key Points Engaged:**
  1.  **Critic's Challenge:** Mere absence of disapproval ≠ negation (indifference/ignorance problem).
  2.  **Expressivist Move 1:** Defines negation as a *positive*, oppositional attitude (rejection, withholding, endorsing lack-of-prohibition *within* the normative domain).
  3.  **Critic's Reply 1:** Challenges distinction between this attitude and indifference/ignorance *within context*. Charges re-introduction of propositional content ("plan lacking P" as proxy for "not-P").
  4.  **Expressivist Move 2:** Appeals to *incompatibility* of planning states (e.g., forbidding vs. not forbidding) as the source of logical relations.
  5.  **Critic's Reply 2 (Bootstrapping):** Questions the source of incompatibility – is it brute, or does it rely on implicitly propositional conflict? Charges arbitrariness or covert descriptivism.
  6.  **Expressivist Move 3:** Grounds incompatibility in *functional role* and *practical incoherence* (impossibility of joint implementation of conflicting plans).
  7.  **Critic's Reply 3:** Tests with embedded negation (conditional), argues the "solution" relocates the problem. Charges that the structured attitudes & their logic effectively *replicate* propositional structure ("quasi-propositions").
  8.  **Expressivist Move 4:** Maintains core commitment – fundamental state is plan endorsement; propositional-like logic *emerges* from practical rationality.
  9.  **Stalemate:** Critic sees replication of propositional logic as fatal concession; Expressivist sees it as a necessary development of non-representational practical reasoning. Resolution is deferred, reflecting the ongoing debate.
