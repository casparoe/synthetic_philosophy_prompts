  Another angle is the nature of awareness. Even without body awareness, the self-awareness experienced might still be a product of the brain. The user could be conflating the content of awareness (no body) with the mechanism (brain-based). Philosophical critiques from materialists or physicalists would argue that all mental states supervene on physical states.

