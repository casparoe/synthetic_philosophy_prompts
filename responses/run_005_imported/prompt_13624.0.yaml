     Now, to verify the axioms:

          Independence of Irrelevant Alternatives (IIA) for Nash: 
            If we form a subset T of S that contains the Nash solution of S and the disagreement point, then the Nash solution for T should be the same.
            In our example, let T be the comprehensive hull of the convex hull of (0,0), (0,1), (1,0), (0.8,0.4), and (2/3,1/2). 
            Note: (2/3,1/2) is in S and on the frontier. 
            The Pareto frontier of T will be the same as that of S? 
               In S, the frontier is from (0,1) to (0.8,0.4) and then to (1,0). 
               In T, since we include (0,1), (0.8,0.4), (1,0), and (2/3,1/2) which is on the first segment, the frontier will be the same.
            Therefore, the Nash solution for T is the same as for S: (2/3,1/2).

          So Nash satisfies IIA.

          Individual Monotonicity for KS: 
            If we have an expansion from T to S such that the ideal point for player 2 remains the same and the ideal point for player 1 might increase or stay the same, then the utility for player 1 in the KS solution should not decrease.
            In our example, if we start from a subset T of S and expand to S, and if the ideal point for player 2 in T and in S are the same, then the KS solution for player 1 in S should be at least as much as in T.

