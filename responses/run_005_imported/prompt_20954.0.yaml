  Quick philosophy question for a novel I'm drafting -- I've got a side character, an eleventh-century physician-philosopher type loosely modeled on Avicenna, who corners my protagonist with the flying man argument to convince her the soul can't just be the body. I know the basic setup (a man created whole and floating, no senses working, yet certain he exists), but every summary I find just says it's basically Descartes' cogito a few centuries early and leaves it at that, which feels too easy. Can you actually unpack what the flying man is supposed to prove that "I think therefore I am" doesn't, and whether the jump from "I can conceive of myself without a body" to "my self is really a separate thing from my body" holds up logically -- or if its the same kind of leap people criticize Descartes for making with his own mind-body arguments? I don't need a history lecture, just the real philosophical meat so my characters argument doesn't come off like a wikipedia paraphrase.
