  The deterrence extension they propose is actually quite sharp. The paradox they mention about sincere intention vs. rational action avoidance comes from thinkers like Kavka ("The Toxin Puzzle") and Schelling. But the user's application to Anscombe's framework feels fresh - if forming genocidal intent corrupts morally, then deterrence doctrine inherently requires maintaining that corrupt state. That's a legitimate original synthesis worth developing.

