answer: |-
  Here's a joke crafted specifically for your seminar's opening, targeting the profligacy problem and the awkwardness of needing normative criteria to single out "the" omission:

  ---

  **The Setup:**  
  A negligent lifeguard, a distracted beachgoer, and a philosopher are sued by the estate of a drowned swimmer. The plaintiff argues all three caused the death by omission: the lifeguard failed to watch, the beachgoer failed to notice, and the philosopher failed to leap into action despite having just lectured on moral duty.  

  **The Lifeguard’s Defense:**  
  *"Your Honor, I accept I *should* have acted. But if we’re counting omissions as causes, why stop with us? What about every person on Earth who didn’t drive here to save him? My cousin in Oslo didn’t come! The Prime Minister didn’t intervene! By the plaintiff’s logic, this drowning has seven billion causes!"*  

  **The Philosopher’s Interjection:**  
  *"Worse yet, Your Honor! Causation requires events—but omissions aren’t events! They’re *absences*. If ‘nothing’ causes drowning, then the true culprit is... nothing! Case dismissed on metaphysical grounds!"*  

  **The Judge’s Ruling:**  
  *"Enough. Lifeguard: you’re guilty because you had a *duty*. Beachgoer: you’re free—you had no special obligation. Philosopher: you’re fined for ontological obstruction. Next case!"*  

  **The Philosopher’s Muttering:**  
  *"Ah, so it’s normativity *all the way down*..."*  

  ---

  ### Why it works for your class:
  1. **Profligacy Problem**: The lifeguard explicitly ridicules the idea that *every possible non-saver* is a cause, highlighting the absurdity of bare counterfactual dependence.  
  2. **"Nothing" as Cause**: The philosopher’s defense weaponizes the metaphysical worry that omissions aren’t "events" (a classic objection).  
  3. **Normative Awkwardness**: The judge resolves it by appealing to *duty*—exposing how we smuggles in context/norms to avoid profligacy.  
  4. **In-Joke Vibe**: The philosopher’s final line nods to how "solutions" often just kick the problem to another level.  

  **Punchline Delivery Tip:** Pause after "*fined for ontological obstruction*" for maximum groans. The humor lies in the judge’s pragmatic-but-unprincipled appeal to duty—mirroring how theorists often "fix" profligacy by stealthily privileging context.  

  Let me know if you'd prefer a version leaning harder into the gardener example or the "nothingness" angle!
