  We are ranking approaches to the frame problem, specifically the deep epistemic version about knowing what's relevant to check, not just avoiding infinite frame axioms.

  Approaches:
  1. STRIPS-style add/delete lists: Explicitly lists changes. Assumes everything else remains unchanged. Doesn't address the relevance problem; it just avoids writing frame axioms by convention. It's a syntactic solution.

  2. Reiter's successor state axioms: Axioms that define when a fluent changes and when it doesn't, by considering all possible actions that could change it. Still requires enumerating all actions that affect a fluent. Doesn't address the relevance problem in the deep epistemic sense.

  3. Circumscription/nonmonotonic logic: Minimizes changes by assuming only what is stated to change does change. It's a form of nonmonotonic reasoning that allows default assumptions. However, it doesn't inherently tell you what's relevant; it just minimizes the extension of abnormality predicates. It's a formalization of the minimization idea but doesn't solve the relevance problem.

  4. Connectionist/neural-net approaches: These use pattern recognition and statistical learning to predict what might change. They can learn from data which changes are likely and thus which things to check. However, they are approximate and may miss rare but critical changes. They engage with the relevance problem by learning from experience but are not guaranteed to be complete or sound.

  5. Modern LLM agents leaning on implicit world knowledge: LLMs have vast implicit knowledge about the world and can use that to reason about what might change. They can generate plausible scenarios and thus focus on relevant changes. However, they are still prone to hallucinations and may not be logically consistent. They are data-driven and can be seen as a form of connectionist approach but at a larger scale.

