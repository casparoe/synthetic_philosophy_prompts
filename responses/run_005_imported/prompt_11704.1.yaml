prompt: |-
  I sit on the executive committee of a mid-sized manufacturing firm deciding what to do about a three-year-old breach-of-contract suit against a former supplier. We've already spent $3.5 million in legal fees; outside counsel says another $1.5 million and eight months would get us to trial, where we could win $6 million or lose entirely, and the supplier has just offered to settle for $500,000. Over dinner last night, a friend who teaches game theory argued that we're now in a real-world dollar auction: since neither side can recover what it has already spent, stopping now locks in a $3 million loss for us, while continuing offers a chance of coming out ahead at the risk of an even larger one — and the supplier faces the mirror image of that same choice, so both of us have reason to keep escalating well past the point where, in hindsight, stopping would have made more sense. A colleague's draft memo takes this to mean we should simply accept the settlement, since sunk costs are sunk; I think that's too quick, because what we should do here depends on what the supplier is likely to do next, not only on what we've already spent. Please draft the short memo I'll bring to Monday's vote: a concrete recommendation — accept, counter, or proceed to trial — with a timeframe, reasoning that actually engages the two-sided escalation dynamic my friend described rather than just invoking "ignore sunk costs" the way my colleague did, and a fair account of the strongest consideration against whatever you end up recommending.
reasoning: |-
  Okay, the user is on the executive committee of a mid-sized manufacturing firm facing a tough decision about a breach-of-contract lawsuit. They've already spent $3.5 million in legal fees, and outside counsel estimates needing another $1.5 million over eight months to get to trial. At trial, they could win $6 million or lose entirely. The supplier has offered a $500,000 settlement. 

  The user's friend, a game theory professor, framed this as a "dollar auction" dilemma where both sides keep escalating despite mounting losses because they can't recover sunk costs. A colleague's memo argues for accepting the settlement based solely on ignoring sunk costs, but the user thinks that's too simplistic - they want to consider the supplier's likely actions too. 

  Hmm, this is a classic escalation trap. The dollar auction analogy is spot-on: both parties have already invested so much that walking away feels like admitting total loss, while continuing promises a chance to recoup. But mathematically, the expected value of proceeding to trial is negative: 50% chance of $6M minus $5M total costs = net +$1M, but 50% chance of -$5M loss. Average outcome is -$2M, worse than the $3.5M sunk loss. 

  But the user's insight is crucial - this isn't just about our math. The supplier also faces mirror-image incentives: they've likely spent comparable legal fees, so settling for $500K nets them +$500K versus their own sunk costs. But if they think we'll fold, they might refuse reasonable offers. Their settlement offer suggests they're also feeling the pain. 

  The key is disrupting the escalation cycle. A bold settlement demand could signal resolve while creating off-ramps: offering to settle for $0 (mutual walk-away) eliminates their $500K gain incentive and might appeal if their legal costs are high. Alternatively, a small payment like $250K could let them save face. 

  Major risk: if the supplier misreads this as weakness, they might dig in. But given their own escalating costs and the offered settlement, they're probably motivated to end this. The memo should acknowledge this risk while arguing that proactive de-escalation is better than passive trial preparation. 

  The recommendation should be time-boxed (48-hour counteroffer) to prevent dragging out negotiations. Strongest counterargument: if we have >50% trial win probability, proceeding might be better. But given uncertainty and the eight-month/$1.5M trial cost, forcing closure now is wiser.
answer: |-
  ## MEMORANDUM  
  **To:** Executive Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommended Action: Breach-of-Contract Suit (Supplier X)  

  ### I. Recommendation
  **Counteroffer:** Propose a mutual walk-away settlement ($0 payment) with prejudice within **48 hours**. If rejected, immediately accept the supplier’s $500,000 settlement offer.  

  ### II. Reasoning: The Escalation Trap & Strategic De-escalation  
  This is a textbook **escalation game** (a "dollar auction"): both parties face identical, self-reinforcing incentives to keep investing despite mounting losses. Crucially, this dynamic is driven by *future expectations*, not sunk costs alone.  

  1.  **Our Position:**  
      - **Sunk costs ($3.5M) are irrelevant** to future decisions (as colleague correctly notes).  
      - **Future choice:** Spend $1.5M more for an expected value (EV) of (50% * $6M) + (50% * $0) - $1.5M = **$1.5M EV**. *But this ignores the supplier’s incentives.*  

  2.  **Supplier’s Position (Mirror Image):**  
      - They have also sunk significant costs (likely $3M+).  
      - Their $500K offer signals they want to avoid trial costs ($1.5M+) and risk ($6M loss).  
      - Their EV for trial is negative: (50% * -$6M) + (50% * $0) - $1.5M = **-$4.5M EV**.  
      - *Their incentive: Paying $500K to settle is far better than their trial EV.*  

  3.  **The Trap:**  
      - If *both* sides focus only on their own EV *including future costs*, proceeding seems rational (our EV: +$1.5M; their EV: -$4.5M).  
      - **But this guarantees mutual destruction:** Combined, we burn $3M more in legal fees ($1.5M each) for a net transfer of $6M or $0 – a net societal loss.  
      - The supplier’s offer proves they recognize this. Our best move is to **break the cycle** by de-escalating decisively.  

  ### III. Why a $0 Counteroffer?  
  - **Cost Efficiency:** Saves $500K vs. their offer and $1.5M vs. trial prep.  
  - **Signals Resolve to End:** A $0 demand demonstrates we won’t fund further escalation. It reframes the choice: "Mutual relief" vs. "Mutual assured loss."  
  - **Appeals to Supplier’s Incentive:** They avoid *all* future costs/risk. Paying us $500K still feels like a loss; walking away scot-free may be psychologically acceptable.  
  - **Time Pressure:** Forces rapid resolution, preventing costly drift.  

  ### IV. Why Not Proceed to Trial?  
  While the raw EV appears positive, it fails to account for:  
  - **Asymmetric Information:** Our 50% win estimate is uncertain. The supplier’s offer suggests they assess their risk as >50%.  
  - **Reputational/Operational Drag:** 8 more months of distraction.  
  - **Supplier’s Reaction:** If we proceed, they *must* fight, locking both sides into $1.5M+ in avoidable costs.  

  ### V. Strongest Counterargument & Mitigation  
  - **Counterargument:** "Demanding $0 is reckless. The supplier could reject it, and we lose $500K in savings while appearing weak."  
  - **Mitigation:**  
    - Their $500K offer reveals a strong desire to settle. Rejecting $0 to risk trial (where their EV is -$4.5M) is irrational.  
    - We set a 48-hour window to accept $0 or we take their $500K – preserving savings. This is not weakness; it’s disciplined deal-making.  
    - If they reject both, we proceed knowing we exhausted off-ramps.  

  ### VI. Action Requested  
  Vote to authorize the General Counsel to:  
  1.  Offer Supplier X a mutual release with no payment, settlement with prejudice, within 48 hours.  
  2.  If rejected, immediately accept their $500,000 settlement offer.  
  3.  If neither occurs, proceed to trial per outside counsel’s plan.  

  **This strategy leverages game theory to escape a lose-lose escalation spiral, saving $500K–$2M versus alternatives.**  

