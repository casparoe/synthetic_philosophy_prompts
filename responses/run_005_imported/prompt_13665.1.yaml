  First, I need to recall Bernoulli's core argument: diminishing marginal utility of wealth for individuals. He argued that people value each additional dollar less than the previous one, which resolves the infinite expected value paradox by making the utility finite. 

  Now, SBF's scenario involves repeated coin flips doubling global welfare or destroying it. SBF claims that without diminishing marginal utility at the aggregate level, a rational maximizer should take the bet. The user is asking whether Bernoulli would see this as a recurrence of his paradox or if his argument doesn't apply to collective welfare.

