answer: |-
  Here’s a toast that threads the needle—warm for the newsroom, substantive for philosophers, and centered on Dana’s rule, not her omniscience. (Clockwise in at ~5 mins when spoken with pauses.)

  ---

  (Clink glass) Friends, colleagues, philosophers—especially philosophers who’ve endured my attempts to explain quantum gravity at the coffee machine—tonight we celebrate Dana Kessler. For 28 years, she wasn’t just our standards editor; she was the guardian of a single, unwavering principle: **If you don’t *know* it, you don’t print it.**

  Not "it’s probably true."  
  Not "my source swears by it."  
  Not even "all the evidence points this way."  
  Just: **Know it.**  

  Now, newsrooms run on lore. And the story that defines Dana’s reign—the one whispered over keyboards and shouted across bars—is the one where she spiked a *true* story. A story her own reporter nailed. A story that was factually flawless. Why? Because Dana declared the source had “gotten it right by accident.”  

  *(Pause, turn to newsroom tables)*  
  To our colleagues: you know what this cost. You’ve felt that gut-punch when Dana killed your beautifully crafted piece because one thread wasn’t knotted tight enough. That day? She sacrificed a scoop. A *win*. Because the source guessed right. Rolled doubles. Got lucky. And Dana said: **“Luck isn’t knowledge.”**  

  *(Shift tone, include philosophers)*  
  To our philosopher friends: you’re nodding. You see it. That wasn’t just an editor being thorough—it was a live-action **Gettier case**. True belief? Yes. Justified? Arguably. But knowledge? Dana said *no*. Because knowledge isn’t just truth plus a good story. It’s a right to assert. A foundation you can build on.  

  Dana understood what that norm costs. It costs scoops. It costs elegance. It costs column inches. Truth norms? They’d have run that story. Belief norms? "Trusted source" would’ve sufficed. But Dana’s knowledge norm? It demands we *earn* the right to tell the world something. It’s why our readers trust us when we say, **“We know this.”** Not “we suspect.” Not “we heard.” *We know.*  

  That’s the weight she carried for us. Every judgment call was a tightrope: over the chasm between being first and being *right*, between plausibility and certainty. She made us sweat the gaps between “true” and “known”—because in the chaos of breaking news, that gap is where errors breed.  

  *(Softer, affectionate)*  
  Dana, you asked us not to toast you as infallible. Fine. You weren’t *always* right. But your **rule**? Always was.  
  You taught us that journalism isn’t alchemy—we can’t turn hearsay into gold.  
  You showed us that integrity isn’t refusing to print lies; it’s refusing to print truths we haven’t *earned*.  

  So tonight, we raise a glass to the woman who’d rather be silent than uncertain.  
  To the rule that guarded our credibility like a dragon guards treasure.  
  And to the legacy you leave: a newsroom that knows the difference between getting it right… and *knowing* you got it right.  

  To Dana—and her unbendable, unbreakable, indispensable rule.  

  ---

  **Why this works:**  
  - **Newsroom feels seen:** Uses insider language ("scoop," "gut-punch," "killed your piece"), celebrates their sacrifice.  
  - **Philosophers get depth:** Name-drops Gettier, contrasts norms ("truth vs. knowledge"), nods to epistemic "right to assert" without jargon.  
  - **Honors Dana’s request:** Focuses on the *rule’s* value ("the rule was always right"), not her perfection.  
  - **Tone:** Warmth ("whispered over keyboards"), respect ("guardian"), and wit ("philosophers who’ve endured my quantum gravity") keep it human.  
  - **Structure:** Anecdote → newsroom meaning → philosophical depth → unifying tribute to the rule’s legacy.  

  The final lines crystallize the toast: Dana’s legacy is a newsroom that internalized the difference between truth and *warranted* truth. That’s her gift to journalism.
