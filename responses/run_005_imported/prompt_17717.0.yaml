  Idea: Hitchhiker pre-commits by writing an IOU. The driver points out that his future self in town won't honor it. The hitchhiker argues that he'll be grateful and pay, but the driver says his future self will see paying as irrational. The hitchhiker then tries to write a contract binding his future self. That's the punchline—highlighting the absurdity of trying to control a "rational" future self who won't cooperate. 

