prompt: |-
  David Lewis's triviality results are usually taken to have killed the simple idea that P(if A, B) = P(B|A) (Adams' thesis) as a general fact about indicative conditionals. But theres been a bunch of famous attempts since to save something like it anyway: Adams/Edgington just deny conditionals have truth conditions at all (no proposition, no problem), Stalnaker leans on context-sensitivity of the selection function to block the argument, Jackson tells a "robustness" story for why we assert material conditionals exactly when P(B|A) is high, van Fraassen moves to Popper functions / a family of probability measures instead of one fixed one, and McGee defends a restricted version of the thesis that only covers simple, non-embedded conditionals. Rank these five from most to least successful at actually rescuing something worth still calling "Adams' thesis" while dodging triviality -- don't be afraid to put one at the bottom for basically just changing the subject. Give it to me as a JSON list like:

  ```json
  [
    {"view": "...", "reason": "one sentence on why it ranks where it does"},
    ...
  ]
  ```
reasoning: |-
  We are ranking five attempts to rescue something like Adams' thesis (P(if A, B) = P(B|A)) from the triviality results. The views are:

  1. Adams/Edgington: Deny that conditionals have truth conditions (no proposition, no problem).
  2. Stalnaker: Uses context-sensitivity of the selection function to block the triviality argument.
  3. Jackson: "Robustness" story for why we assert material conditionals when P(B|A) is high.
  4. van Fraassen: Moves to Popper functions or a family of probability measures.
  5. McGee: Defends a restricted version that only covers simple, non-embedded conditionals.

  We rank from most to least successful at rescuing something worth calling "Adams' thesis" while dodging triviality.

  Criteria:
  - How well does it preserve the core idea of Adams' thesis?
  - How effectively does it avoid the triviality results?
  - Does it provide a satisfying account of conditionals that is still in the spirit of Adams?

  Ranking:

  1. **Stalnaker**: He maintains that conditionals have truth conditions (propositions) but the selection function is context-sensitive. This blocks the triviality argument because the probability of a conditional is not the same as conditional probability in a fixed context. However, he still aims to have P(if A, B) = P(B|A) in many contexts. This is a robust defense that keeps the thesis as a central part of the semantics.

  2. **van Fraassen**: By using Popper functions (which allow conditioning on events of probability zero) or a family of probability measures, he avoids the triviality because the conditional probability is defined more generally. This approach preserves the equation P(if A, B) = P(B|A) as a general fact, but at the cost of moving away from classical probability. It's a substantial and technically sophisticated solution that directly addresses the problem.

  3. **McGee**: He restricts Adams' thesis to simple, non-embedded conditionals. This avoids the triviality because the problematic cases involve embeddings. However, by restricting the scope, he abandons the general applicability of the thesis. Still, it preserves the thesis for the core cases and is a clear and workable solution for those.

  4. **Adams/Edgington**: They deny that conditionals express propositions and thus avoid the triviality because there is no proposition to have a probability. The probability of a conditional is then interpreted as the conditional probability. This is a radical departure but does preserve the equation in a way. However, it changes the subject by denying that conditionals have truth conditions, which might be seen as avoiding the problem rather than solving it.

  5. **Jackson**: He defends the material conditional account and explains why we assert it when P(B|A) is high by invoking "robustness" (the conditional remains assertable even if we learn the antecedent). But this doesn't actually preserve Adams' thesis because for Jackson, the conditional is the material conditional, so P(if A, B) = P(A ⊃ B), which is not equal to P(B|A) in general. Thus, he doesn't really rescue the equation but instead offers a pragmatic story for why we might use the material conditional when the conditional probability is high. This is the least successful at preserving Adams' thesis.

