prompt: |-
  In my political philosophy elective, we've been working through Robert Nozick's *Anarchy, State, and Utopia*, and I came across a footnote where he wonders whether morality needs two different standards: full Kantian side-constraints -- treating a being as an end in itself, never merely as a means -- for persons, but only a utilitarian, suffering-minimizing standard for animals. He seems uneasy about this split himself and never fully defends it. I have a dog I would never let be used in painful research no matter how large the benefits, yet I eat meat from animals raised on factory farms without much guilt. Could you describe the most important implications of Nozick's proposed two-tier view for a case like mine -- specifically, whether it can actually justify treating my dog and a factory-farmed pig so differently, and what the view would commit me to about hunting, animal testing, and similar cases if I accepted it?
