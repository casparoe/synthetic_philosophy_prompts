  Okay, let me approach this systematically. The journalist has encountered a bioethical argument that uses evolutionary psychology to dismiss discomfort about human-animal chimeras, and they're noticing a tension when applying the same logic to other moral intuitions. 

  First, I need to map the core argument structure: 
  1. Disgust toward human-animal chimeras originates from an evolutionary "contamination-detection" mechanism. 
  2. This mechanism was adaptive for avoiding disease/mis-mating but isn't relevant to modern biotech ethics. 
  3. Therefore, the disgust shouldn't count as ethical evidence.

  The journalist's counter-move is sharp: we wouldn't discard empathy or consent-based ethics just because they evolved for kin/reciprocity reasons. So why treat disgust differently? 

  Hmm... the key might lie in distinguishing between different types of moral foundations. Jonathan Haidt's moral foundations theory comes to mind - disgust relates to "purity/sanctity" while empathy relates to "care/harm". But that doesn't fully resolve it because both are evolutionarily shaped. 

  Perhaps the difference is epistemic? Disgust is a crude affective response that misfires here (like fearing harmless spiders), whereas empathy tracks actual harm. But that seems question-begging - the whole debate is about whether chimera disgust *is* misfiring. 

  Another angle: maybe it's about corrigibility. We can rationally override disgust (e.g., eating insects if nutritious) but not harm-avoidance (torture is always wrong). But that doesn't hold - we override harm intuitions too (e.g., justified self-defense). 

  *scribbles mentally* What if the distinction is in the object? Disgust responds to categorical boundaries (human/animal), while empathy responds to sentient experience. The former boundaries are precisely what biotechnology challenges, so... circular again? 

  *lightbulb* Perhaps the deeper issue is that contamination-disgust makes no truth claims - it's pure avoidance - whereas care-ethics makes claims about suffering that can be independently verified. That might be the fault line the journalist needs: disgust can't be "wrong" because it isn't asserting anything falsifiable, just "yuck". 

  But wait - isn't the biologist implicitly claiming disgust is factually mistaken here? That's confusing the levels. The feeling exists, but its presumed object (actual contamination risk) is absent. Whereas for harm, the feeling and the harm-object remain linked. 

  *re-reads journalist's consent example* Ah! Consent violations cause actual harm (autonomy violation), not just disgust. So even if the "ick" fades, the ethical wrong persists. But with chimeras, if you remove the disgust, what wrong remains? That's the asymmetry. 

  For the paragraph, I'd suggest: The argument works only for bare disgust unconnected to identifiable harms. But if chimera research risks creating human-neural tissue in animals or degrading human dignity, those would be harms requiring evaluation beyond disgust. The evolutionary explanation doesn't resolve those.
answer: |-
  You've hit on a profound tension in applied ethics. The biologist's argument—that evolutionary origins discredit *this specific disgust* but not other moral intuitions—can hold, but only if we distinguish between **epistemically reliable vs. unreliable intuitions** based on their functional purpose and corrigibility. Here's the logic:

  ### 1. **Not All Evolved Intuitions Are Equal**  
     Evolutionary origins don’t automatically invalidate an intuition, but they *do* invite scrutiny of its **epistemic reliability** in a novel context. Key questions:  
     - **What problem did this intuition evolve to solve?**  
       - Disgust toward species-mixing evolved to avoid pathogens, mis-mating, or cognitive dissonance (e.g., "contamination" avoidance).  
       - Empathy/consent intuitions evolved to regulate social cooperation (e.g., harm prevention, reciprocity).  
     - **Is the intuition tracking morally relevant facts *today*?**  
       - Contamination-disgust misfires in sterile labs: no actual disease or reproductive risk exists.  
       - Empathy tracks suffering (still morally relevant); consent tracks autonomy (still foundational).  

  ### 2. **The Fault Line: Correctability and Moral Relevance**  
     - **Disgust is a "dumb alarm"**: It reacts to superficial cues (e.g., "human + animal tissue") without sensitivity to context. We routinely override it (e.g., vaccines, organ transplants) when the *reason* for disgust (disease) is absent.  
     - **Harm/consent intuitions are reason-responsive**: They bind to observable, morally salient facts (pain, coercion, dignity). Even if evolved, they remain tethered to values we endorse upon reflection (e.g., "suffering is bad").  

  ### 3. **Why the Argument Doesn’t Overgeneralize**  
     The biologist’s move only discredits intuitions when:  
     - **The original evolutionary trigger is absent** (here, bio-contamination), *and*  
     - **The intuition cannot be re-justified by other moral principles**.  
     Disgust at chimeras meets both criteria. Core ethics like "don’t inflict gratuitous cruelty" don’t: cruelty still causes harm; non-consensual experimentation still violates autonomy. We uphold these because reflective ethics *confirms* their validity.  

  ### 4. **The Genuine Risk (What the Biologist Misses)**  
     Disgust *might* point to unexamined harms (e.g., creating sentient chimeras with human neurons). But if the research avoids such harms, disgust alone isn’t probative. The burden shifts to critics to identify *actual wrongs*, not just unease.  

  ### Your Paragraph Draft:  
  > "Scientists argue that disgust toward human-animal chimeras is an evolutionary misfire—a hardwired 'contamination detector' irrelevant to modern labs. This holds because the intuition evolved for disease avoidance, a risk absent here. Unlike empathy or consent, which remain tethered to enduring moral values (harm, autonomy), disgust lacks inherent reason-giving force. But this doesn’t dismiss ethical scrutiny: if chimera research creates conscious hybrids or commodifies human life, *those* harms demand engagement beyond disgust. The evolutionary argument only nullifies gut reactions disconnected from demonstrable wrongs."  

  **Key Philosophers**: This channels Lisa Tessman on "burdened virtues" (misapplied intuitions), and Joshua Greene on dual-process moral cognition (automatic vs. reflective judgments). The logic is defensible if confined to intuitions that are (a) biologically vestigial in context, and (b) unsupported by reflective ethics. Your unease about overgeneralization is apt—but the fault line lies in whether the intuition can be validated through moral reasoning, not just in its origins.
