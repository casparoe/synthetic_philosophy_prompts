  Okay, let me start by unpacking the user's request. They had a heated debate with their friend Theo about Parfit's Hitchhiker, specifically whether it's rational to pay once you're in town. The user co-runs a philosophy podcast and has a decision theorist guest next month defending Functional Decision Theory (FDT). They need interview questions that dig deep into the tricky parts without rehashing the setup.

  First, I need to understand the core of their argument with Theo. Theo thinks refusing to pay in town is rational, while the user argues that a theory suggesting dying of thirst is rational must be flawed. The user wants to challenge their guest on FDT's stance that paying is rational at the moment of action, not just as a prior commitment. 

  The user specified four key questions: one separating rational disposition vs. act, one connecting to Gauthier or McClennen, a "why ain'cha rich" challenge, and one about the driver being only a good lie detector. They also want follow-ups to prevent dodges. 

  For the disposition/act separation, I recall that FDT often blurs this by saying the rational act is determined by the disposition. The follow-up should push back on that conflation. Gauthier's constrained maximization and McClennen's resolute choice are precursors, so asking how FDT differs is crucial. The "why ain'cha rich" objection usually targets causal decision theorists who end up worse off, but FDT might have its own vulnerabilities. The follow-up could ask about cases like Toxin Puzzle where commitment seems costly. 

  The lie detector's fallibility introduces uncertainty. If the driver isn't perfect, does FDT still recommend paying? The follow-up should question if this undermines the commitment mechanism. 

  I should also consider the user's deeper needs. They want the interview to be engaging and reveal the guest's reasoning under pressure. They need questions that force the guest to confront potential weaknesses in FDT. The mention of Parfit's identity theory suggests they appreciate meta-commentary, but the questions should stay focused. 

  Structuring each question with a sharp main query and a prepared follow-up ensures the guest can't retreat to rehearsed answers. Making the follow-ups specific to likely responses is key. For example, if the guest says paying is rational because of prior commitment, the follow-up challenges why that commitment binds the present self. 

  Overall, the questions need to bridge abstract theory and practical implications, highlighting where FDT might contradict common intuitions. Ensuring each question targets a specific argumentative edge will help the user create a compelling podcast episode that advances the debate beyond their initial argument with Theo.
answer: |-
  Here are 8 interview questions designed to pressure-test FDT's stance on Parfit's Hitchhiker, focusing on the core tensions you identified, complete with targeted follow-ups:

  1.  **The Disposition/Act Split:** "FDT argues that the rational act *in town* is to pay. But isn't this fundamentally smuggling in the *disposition* to keep promises made to perfect predictors? Can you rigorously define 'rational act' *at the moment of choice in town* – where paying costs $1000 and gains you nothing tangible *from that temporal perspective* – without implicitly relying on the counterfactual benefits of *having had* a cooperative disposition beforehand? How is this not conflating two distinct evaluations?"
      *   *Likely Dodge/Response:* "Rationality requires acting as the agent you needed to be to get this far."
      *   *Follow-Up:* "But *at the specific spatiotemporal point* 'in town', the agent who got you there is past. Why is the *current* agent, facing only the cost and no future benefit from *this specific act of paying*, rationally obligated to honor the disposition of a past self? Isn't FDT privileging a cross-temporal agent identity that Parfit himself might question?"

  2.  **Gauthier/McClennen Connection:** "FDT's insistence on paying seems reminiscent of Gauthier's 'constrained maximization' or McClennen's 'resolute choice' – the idea that rationality involves sticking to beneficial plans. How does FDT *differ* from these views, particularly in how it justifies the *in-the-moment* rationality of paying? Is it primarily the explicit role of *logical dependence/prediction* that sets FDT apart?"
      *   *Likely Dodge/Response:* "FDT focuses on the logical output of the decision function itself, not just plans or dispositions."
      *   *Follow-Up:* "But in *practical terms* for the agent *at the choice point*, how is the compulsion to output 'pay' (because not doing so would undermine the prior output 'promise') meaningfully different from McClennen's 'resolute' agent feeling bound by their prior plan? Isn't the 'logical dependence' argument just a different *rationalization* for the same behavioral prescription?"

  3.  **The "Why Ain't Cha Rich?" Challenge:** "Proponents of CDT often get hit with the 'Why Ain't Cha Rich?' objection in Newcomb-like problems – they end up poorer. But doesn't FDT face a symmetrical challenge *here*? The FDT agent pays $1000 they didn't *have* to pay in town. In purely monetary terms, *at the end of the day*, isn't the CDT agent (who lies successfully in the desert but wouldn't pay in town if they got there) richer by $1000 *and* alive? How does FDT avoid being the 'sucker' theory in *this specific interaction structure*?"
      *   *Likely Dodge/Response:* "The FDT agent *gets to town* reliably, while the CDT agent dies in the desert when faced with a perfect predictor."
      *   *Follow-Up:* "But focus *only* on the instances where both agents *somehow* find themselves in town (maybe the predictor was imperfect *once*, or it's a different scenario). In *those* specific instances, the FDT agent is down $1000 compared to the CDT agent who cheats. Doesn't this expose a cost to FDT's commitment mechanism *even when it works*, making it vulnerable to the same 'why ain't cha rich?' critique in *outcome*-based terms for *this* subpopulation?"

  4.  **The Fallible Predictor Problem:** "The case hinges on a *perfect* predictor. Let's make it realistic: the driver is only 95% accurate at detecting lies/promise-keeping dispositions. Does FDT *still* categorically demand paying once in town? If so, doesn't that mean accepting a 5% chance of being a 'sucker' who paid $1000 unnecessarily? If not, how does FDT formally incorporate this uncertainty about the predictor's ability into its decision function *at the moment of paying*, and where does the threshold lie?"
      *   *Likely Dodge/Response:* "FDT would likely recommend promising only if the accuracy is high enough to make the expected utility positive, and then paying if you get to town."
      *   *Follow-Up:* "But *why* pay if you get to town? The driver's job is done; his accuracy *now* is irrelevant to whether he *already* misjudged your disposition. The 5% risk was of *dying in the desert* due to misprediction. Once you're *in town*, that risk is past. Paying *now* still costs $1000 with *zero* future benefit *from this act*, regardless of the driver's past accuracy. Doesn't the fallibility argument actually *strengthen* the case for defecting in town?"

  5.  **The Binding Force of Logical Dependence:** "FDT argues you pay because failing to pay would mean your decision function outputs different actions in logically linked situations, undermining its effectiveness. But *for the agent standing in town*, what is the *immediate, compelling reason* to care about maintaining the coherence of their abstract decision function across counterfactuals *at the cost of $1000 right now*? Isn't this prioritizing metaphysical consistency over tangible, immediate payoff maximization?"
      *   *Likely Dodge/Response:* "Caring about the coherence and effectiveness of your decision function *is* what defines rationality for FDT; it's how you maximize payoff *across* scenarios."
      *   *Follow-Up:* "So is FDT fundamentally claiming that 'rationality' means being the *type of agent* who performs well across a broad class of decision problems, even if that requires taking a loss in some specific instantiations? If so, how is this different from advocating for a *disposition*, and doesn't it concede that the *act* of paying *in this isolated moment* isn't locally payoff-maximizing?"

  6.  **The Toxin Puzzle Counterpoint:** "How does FDT resolve the Toxin Puzzle (where you get rewarded for *intending* to drink toxin, but drinking it itself is harmful and avoidable)? Does FDT say you *must* drink the toxin to be consistent? If not, how does it cleanly distinguish the logic of Toxin from Parfit's Hitchhiker? If yes, doesn't that make FDT seem *more* demanding and counterintuitive than its resolution of Hitchhiker?"
      *   *Likely Dodge/Response:* Focus on differences in dependence (Toxin reward depends *only* on intention, Hitchhiker rescue depends on predicted *action*).
      *   *Follow-Up:* "In Hitchhiker, doesn't the rescue *also* depend on the predicted *intention* (to pay)? If you *intend* to pay in town but then change your mind *after* being rescued (like forming the intention to drink toxin), why is the Hitchhiker case different? Isn't FDT relying on the fact that the driver predicts the *final action*, not just the prior intention, to force the payment?"

  7.  **Temporal Neutrality vs. Present Bias:** "FDT seems to require a radical form of temporal neutrality, where the agent in town must sacrifice current resources purely to vindicate the logical structure that benefited a *past* self. Doesn't this clash profoundly with the common intuition that rationality involves responding to *current* incentives? How does FDT rebut the charge that it's demanding an irrational *present* sacrifice for the sake of a past benefit or abstract consistency?"
      *   *Likely Dodge/Response:* "It's not for the *past* self, it's for the *cross-temporal* agent defined by its decision function."
      *   *Follow-Up:* "But the *experience* of cost and benefit is localized in time. The thirsty past self experienced the benefit of rescue; the present self experiences the cost of payment. If the 'cross-temporal agent' is just a useful fiction, why should the *experiencing* present self bear a cost solely to maintain the fiction's logical properties? Isn't FDT privileging the abstraction over the lived reality of the agent *at the choice point*?"

  8.  **Bootstrapping Cooperation:** "Ultimately, FDT claims paying in town is rational because it's part of the only strategy that gets desert-stranded agents reliably rescued. But isn't this somewhat circular? It defines rationality as the thing that enables cooperation with perfect predictors, which only works if everyone plays along. How does FDT justify this as *foundational* rationality rather than a beneficial *convention* specific to a very peculiar type of interaction (perfect prediction) that rarely exists?"
      *   *Likely Dodge/Response:* "FDT identifies the consistent decision rule that performs best across a wide range of problems involving logical correlation, not just prediction."
      *   *Follow-Up:* "But in the *absence* of logical correlation (like purely causal scenarios), doesn't FDT collapse to CDT? Doesn't this suggest FDT's prescription in Hitchhiker is *contingent* on the specific, unusual structure of prediction/co-dependence, making 'rationality' dependent on the problem type rather than offering a universal, context-independent definition? Is FDT really a theory of *rationality* or a theory of *optimal cooperation under logical omniscience*?"

  **Key Angles Covered:**

  *   **Disposition vs. Act (Q1, Q5, Q7):** Forces the distinction and challenges the justification for the in-the-moment act.
  *   **Historical Precedents (Q2):** Contextualizes FDT within broader debates about commitment.
  *   **"Why Ain't Cha Rich?" (Q3):** Turns the classic objection back on FDT in this specific outcome.
  *   **Fallibility (Q4):** Tests the robustness of the argument under realistic uncertainty.
  *   **Counterpoint/Comparison (Q6):** Uses Toxin to probe the boundaries of FDT's logic.
  *   **Temporal Tension (Q7):** Highlights the conflict between present cost and past/counterfactual benefit.
  *   **Bootstrapping/Scope (Q8):** Questions the foundational nature of FDT's rationality claim.

  These questions push beyond restatement by demanding justifications for the *in-the-moment* rationality of paying, highlighting potential costs, inconsistencies, and comparisons to alternative views and scenarios. The follow-ups anticipate common FDT responses and push back on their potential weak points. Good luck with the interview!
