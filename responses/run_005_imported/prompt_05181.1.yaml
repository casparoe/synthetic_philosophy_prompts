answer: |-
  ## The Metaphysics of Missing: Why Omissions *Are* Causes (But Only Contrastively)

  The question of whether omissions can be genuine causes strikes at the heart of what causation *is*. After wrestling with the counterfactual promiscuity, the process-theoretic denial, and the explanatory gambit, a clear verdict emerges: **Omissions can indeed be genuine causes, but *only* relative to a contextually specified contrast class. This contrastivist framework resolves the promiscuity problem without smuggling in normative or default-relativist baggage illegitimately, preserving a robustly metaphysical core for causation.**

  ### The Core Conflict: Permissive Dependence vs. Physical Process
  1.  **Counterfactual Permissiveness (Lewisian):** The core strength is undeniable. If the plant dies, and it's true that *had I watered it, it would not have died*, then my failure to water it satisfies the canonical counterfactual test for causation. It seems a straightforward application: the effect counterfactually depends on the omission. The fatal weakness is promiscuity: the same dependence holds for *anyone* whose watering would have saved it – the neighbor, the mail carrier, the Martian. Unrestricted, this floods the causal field with absurd candidates.
  2.  **Process-Theoretic Denial (Salmon/Dowe):** This rightly demands a physical connection – a spatiotemporally continuous process involving the transfer or exchange of conserved quantities (energy, momentum). My inaction involves no such process connecting me to the plant's dehydration. Their strength is preserving causation as a concrete, physical relation. Their weakness is denying an obvious truth: my not watering the plant *made a difference* to its death in a way utterly unlike, say, the President's not watering it. Reducing this to mere "explanation" or "quasi-causation" seems inadequate to the phenomenon and our causal reasoning (e.g., "Why did it die? Because *I didn't water it*" feels robustly causal).
  3.  **Beebee's Explanatory Gambit:** Beebee argues we conflate causation with causal *explanation*. Omissions feature in explanations (often crucially), but they aren't causes themselves. The strength is neatly sidestepping the metaphysical mess: we explain the death by citing my omission, but the *real* cause is the positive process of dehydration. The weakness is twofold: (1) It struggles with cases where the omission *is* the most salient explanatory factor precisely because it *feels* causal ("The power cut caused the outage" vs. "The lack of power caused the outage"). (2) It doesn't fully resolve promiscuity – why is *my* omission explanatory but not the mail carrier's? Normative/duty considerations seem to creep back in at the explanatory level instead.

  ### The Failed Fixes: Duty and Normalcy
  The standard remedies for promiscuity – restricting causes to agents with a *duty* or to failures deviating from *normal* conditions – fail on metaphysical grounds:
  *   **Smuggling Normativity:** Duty is paradigmatically normative (moral, legal, conventional). Basing a fundamental metaphysical relation like causation on it conflates "is" with "ought." We want causation to ground duties, not vice-versa.
  *   **The Default Trap:** "Normalcy" is elusive. Is it statistical (what usually happens)? Causal (the course events take without intervention)? Prescriptive (what *should* happen)? Each faces counterexamples. More crucially, what counts as "normal" often *depends* on prior causal or normative assumptions, making it unsuitable as a *foundation* for causation.
  *   **The Legal Dodge:** While law usefully manages omissions via duty for *liability*, this is a pragmatic, normative framework. It doesn't answer the metaphysical question. "Cause-in-law" and "cause-in-metaphysics" may indeed diverge.

  ### The Contrastivist Verdict
  The solution lies in recognizing that **all causal claims, positive or omissive, are implicitly contrastive.** We never ask "Did X cause Y?" *simpliciter*. We ask "Did X (rather than X*) cause Y (rather than Y*)?" 

  *   **Applying it to Omissions:** The question isn't "Did my failure to water cause the death?" but "Did my *not watering* (rather than my *watering*) cause the death (rather than its survival)?" The contrast class for the cause is {watering, not watering}. For the mail carrier, the relevant question is typically "Did the mail carrier *not watering* (rather than *doing their usual job/delivering mail*) cause the death?" Here, the contrast class {delivering mail, not delivering mail} is irrelevant to the plant's survival; altering it makes no difference. The mail carrier's omission fails the *contrastive* counterfactual test: the death does *not* depend on whether they delivered mail or not.
  *   **Resolving Promiscuity:** Promiscuity arises only if we use a single, monolithic, non-contrastive counterfactual: "If *anyone* had watered it, it would have lived." But this misrepresents actual causal inquiry. We are always interested in *specific* potential differences relative to a contextually salient baseline. The Martian's failure isn't part of the salient contrast class in the context of my neglected plant; my failure *is*. The contrast class isn't fixed by duty or normativity *per se*, but by **contextual salience and relevance**, often grounded in expectations, possibilities, or the focus of inquiry. My watering was a genuine, salient possibility in the scenario; the mail carrier watering it was not (absent specific context). This is a fact about the *situation and our epistemic interests*, not a normative fact smuggled in.
  *   **Metaphysical Foundation:** Contrastivism doesn't abandon counterfactuals; it refines them. The fundamental causal relation is difference-making: an event (or omission) of type C (rather than C*) makes a difference to an event of type E (rather than E*). This difference-making is objective: whether my *not watering* (vs. watering) makes a difference to the death (vs. survival) is a fact about the world, determined by physical laws and circumstances. The *choice of contrast class* is contextual/pragmatic, but the *truth of the contrastive causal claim*, given a contrast class, is objective.
  *   **Costs and Gains:**
      *   *Cost:* Admits that causal claims are not absolute but relative to a contrast. Some desire a monolithic "cause" relation.
      *   *Gain:* Provides a principled, purely metaphysical (non-normative) criterion for distinguishing genuine omissive causes (like mine) from spurious ones (like the mail carrier's or the Martian's). It fully vindicates the intuitive difference-making power of omissions without collapsing into promiscuity. It seamlessly integrates omissions and positive causes within a single, unified framework of difference-making. It explains why Beebee's explanatory insights feel right (explanations highlight salient contrasts) without denying omissions a causal role.

  ### The Conditional Verdict Defended
  Therefore: **Omissions are genuine causes, but only relative to a contextually specified contrast class.** The promiscuity worry is real only if we insist on a non-contrastive understanding of causation, which is fundamentally misguided. When we properly frame causal questions contrastively – "Did my *failure to water* (rather than watering) cause the death (rather than survival)?" – we get a clear "yes" based on counterfactual dependence. When we ask "Did the mail carrier's *failure to water* (rather than delivering mail) cause the death?" we get a clear "no" based on the *lack* of counterfactual dependence relative to *that* contrast. The context fixes the relevant alternatives (watering/not-watering *for me*; delivering/not-delivering *for the mail carrier*), blocking promiscuity without invoking duty or normalcy as constitutive of causation. Duty and normalcy might *influence* which contrasts are contextually salient (e.g., my duty makes my potential watering highly salient), but they don't *define* the causal relation itself. The causal truth, once the contrast is fixed, remains a matter of objective difference-making in the world.

  This preserves the core Lewisian insight about dependence while solving its fatal flaw. It acknowledges the process theorist's intuition that "nothing happened" between my inaction and the plant, but argues that causation fundamentally concerns *differences* between what happened and what *could* have happened, not solely positive processes. The wilting *was* a positive process; its occurrence *depended* on the absence of my watering. Omissions, understood contrastively, earn their place as genuine difference-makers in the causal structure of the world.
