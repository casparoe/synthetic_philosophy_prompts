  Hmm, the user is a PhD student in philosophy working on promissory obligation, and they're stuck on a debate between their housemates about whether a promise to oneself is binding. This is directly relevant to their dissertation, so I need to provide a thorough analysis that helps them make progress.

  Looking at the exchange between Owen and Nadia: Owen promised himself he'd quit online poker but later played a hand and hid it. Nadia argues this was a broken promise with moral weight, while Owen insists self-promises aren't binding like interpersonal ones because there's no other party to hold him accountable.

  Let me break this down move by move. First, Nadia's point (1) focuses on performative sincerity - Owen declared it aloud with intention. That gives it some weight, but Owen counters in (2) with the core philosophical issue: promises require a second party who can claim rights. This seems strong theoretically. 

  Nadia's (3) introduces psychological evidence - Owen's secrecy suggests he felt obligated. That's clever empirical insight. Owen's (4) response about New Year's resolutions is valid but might conflate different types of commitments. 

  In (5), Nadia makes an important point about self-governance: if we can't bind our future selves, personal projects become impossible. Owen's (6) rebuttal about distinguishing willpower failures from moral betrayals is reasonable but perhaps too dismissive of self-commitment's special status.

  The ambiguity here is between promise-as-social-contract versus promise-as-self-constitution. Neither fully addresses how self-promises might create normative expectations internally, similar to how we hold past selves accountable to future selves. 

  Overall, Owen has the stronger case on strict promise theory since the two-party element is definitional in most philosophical frameworks. But Nadia's practical insights about self-governance deserve weight in a broader ethical context. For the user's dissertation, this tension between interpersonal obligation theories and intrapersonal commitment structures might be fruitful to explore further.
answer: |-
  Here's a move-by-move analysis of the Owen/Nadia debate, highlighting the strengths and weaknesses of each argument, potential ambiguities, and unaddressed considerations:

  1.  **Nadia (1):** *"He broke a promise (real betrayal) because he said the words out loud and meant them."*
      *   **Strengths:** Accurately identifies the performative act and intentionality crucial to promising. Meaning it sincerely *at the time* establishes initial commitment.
      *   **Weaknesses:** Doesn't address Owen's core challenge: *to whom* is the obligation owed? Sincerity alone doesn't establish an *obligation* distinct from a strong intention. "Betrayal" implies a victim, which is contested.
      *   **Who has the edge?** **Nadia (slightly)**. She correctly identifies the core performative act resembling a promise. Owen hasn't yet undermined the *possibility* of self-promises.

  2.  **Owen (2):** *"A promise to yourself isn't the same; it lacks another party to hold you accountable or be harmed. No one was wronged."*
      *   **Strengths:** Hits the core philosophical issue. Most theories (e.g., Scanlon, Raz, Rawls) ground promissory obligation in the expectations and reliance *created in another person*, and the right they acquire to make a claim. Without a distinct promisee, the normative force changes fundamentally. No one is "entitled to object."
      *   **Weaknesses:** Downplays the potential for self-directed normative force (e.g., integrity, self-trust). Doesn't address why we use the *language* of promising to ourselves.
      *   **Who has the edge?** **Owen (significantly)**. He directly challenges the applicability of the standard model of promissory obligation to self-directed declarations. This is the central theoretical point.

  3.  **Nadia (3):** *"His secrecy shows he knew he was 'getting away with something,' not just changing his mind. He'd have announced a preference change."*
      *   **Strengths:** Provides compelling *psychological evidence*. Secrecy and shame strongly suggest Owen himself perceived his act as a violation of a commitment, not merely a preference shift. This challenges Owen's claim that it was *only* a preference.
      *   **Weaknesses:** Psychological feeling (guilt/shame) doesn't *prove* the existence of a *moral obligation* equivalent to an interpersonal promise. He might feel self-disappointment without believing he wronged *someone*.
      *   **Who has the edge?** **Nadia**. While not proving a moral obligation, her point effectively counters Owen's claim that this was *merely* a preference change. It shows the *phenomenology* of a broken self-promise mirrors that of a broken interpersonal promise, suggesting a similar internal normative structure.

  4.  **Owen (4):** *"Feeling awkward/guilty proves self-disappointment, not a violated obligation to another. Broken resolutions cause guilt without 'failing anyone.'"*
      *   **Strengths:** Correctly distinguishes between moral obligation (owed *to* another) and self-regarding feelings like disappointment or guilt. The New Year's resolution analogy is apt – we feel bad without thinking we've *wronged* someone else.
      *   **Weaknesses:** Doesn't engage with Nadia's point about the *nature* of the guilt (implying "getting away with something" suggests a perceived *breach*, not just disappointment). Doesn't explain why self-promises feel different from simple resolutions.
      *   **Who has the edge?** **Owen**. He successfully separates the feeling of guilt from the existence of an interpersonal moral obligation, which is the core of his argument.

  5.  **Nadia (5):** *"If self-commitment lacks binding force, long-term projects (training, saving) become impossible. The releasability *is* what makes keeping it demanding and significant."*
      *   **Strengths:** Raises a crucial practical and normative point about *self-governance*. If future selves couldn't be bound by past commitments, sustained agency and identity over time would be severely undermined. The very fact that *only* he could release himself highlights the *challenge* and potential *value* of keeping faith with oneself.
      *   **Weaknesses:** Doesn't prove this binding force is *equivalent* to an interpersonal promissory obligation. It might be a distinct kind of normativity (e.g., integrity, prudence, constitutive of agency) rather than a moral *duty* owed to oneself as a separate party.
      *   **Who has the edge?** **Nadia (strongly)**. This is her strongest point, highlighting a deep flaw in Owen's position regarding the necessity of self-binding for practical agency. It forces the question: what *is* the normative force of a self-promise if not obligation?

  6.  **Owen (6):** *"We have self-imposed rules (diets, budgets) without treating lapses as betrayals. Calling it a 'broken promise' inflates a willpower failure into a moral failure only applicable between people."*
      *   **Strengths:** Correctly observes that we routinely distinguish between failures of willpower/prudence and moral betrayals. Labeling a self-lapse a "broken promise" risks moralizing ordinary human frailty in a way reserved for interpersonal breaches.
      *   **Weaknesses:** Doesn't address why Owen specifically used the language of *promising* to himself, not just stating a rule or resolution. Doesn't engage with Nadia's point (5) about the unique binding challenge and potential distinct normativity of self-*promises* compared to mere rules.
      *   **Who has the edge?** **Owen**. He successfully argues that conflating self-lapses with interpersonal moral failures is inappropriate and unhelpful. It maintains the crucial distinction in normative kind.

  **Hidden Ambiguity:**
  The core ambiguity is the meaning of "binding" and "obligation." Nadia often argues from the **phenomenology and practical necessity** of self-commitment – it *feels* binding, and agency *requires* treating past commitments as binding on the future self. Owen argues from the **specific normative structure of promissory obligation** – its essential *interpersonal* nature creating rights and duties *between distinct agents*. They are talking about different aspects of normativity: self-governance/integrity vs. interpersonal moral duty.

  **Unaddressed Consideration:**
  Neither fully explores the idea of **temporal agency**. Promising to oneself can be seen as an act where the *present self* makes a commitment to the *future self*, treating them as distinct temporal parts of the same person. Some philosophers (e.g., Margaret Gilbert, though primarily for groups, or theories of extended agency) argue this creates a quasi-contractual obligation *within* the self across time. The future self can "hold" the past self to account (through feelings of guilt/betrayal), and the past self "wrongs" the future self by undermining its plans or self-trust. This bridges the gap: it explains the distinctive feeling of obligation and betrayal Nadia identifies, while grounding it in a structure analogous to, though distinct from, interpersonal promises.

  **Overall Verdict:**

  While Nadia makes compelling points about the phenomenology and practical necessity of self-binding, Owen's core argument aligns more closely with the predominant philosophical understanding of promissory obligation as inherently interpersonal. Promissory obligations create specific rights and duties *between* distinct moral agents. A declaration to oneself, however sincere, intense, or practically necessary, lacks this essential relational component. It generates a different kind of normative demand (prudence, integrity, self-fidelity) but not the *moral obligation* specific to promises. Owen's secrecy and guilt (Nadia's strong points) reflect the seriousness of failing his *own* standards and the challenge of self-governance, not a breach of duty owed to another party capable of releasing him or claiming a right. Therefore:

  \answer{Owen}
