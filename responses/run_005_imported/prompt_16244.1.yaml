answer: |-
  ## Opening Remarks: Consciousness, Evidence, and the Boundaries of Science  

  **(Approx. 6.5 minutes)**  

  Good morning. It’s a privilege to welcome you to this unique gathering. My name is [Your Name], and I cover consciousness research for [Magazine Name]. Today, we convene not just as scientists, but as explorers at a frontier—a frontier where the very tools we use to map the unknown are themselves in dispute.  

  Some of you signed a letter last year calling Integrated Information Theory (IIT) "pseudoscience." Others dedicated decades to developing IIT and felt that letter was a profound mischaracterization. Many here are uncommitted observers or funders simply asking: *What is the productive path forward?*  

  **Let’s acknowledge the tension.** It’s real. But this workshop isn’t about relitigating that letter. It’s about something deeper: **understanding why this disagreement feels so fundamental.** It’s not merely a turf war over methods or data. It’s a clash over what *counts* as evidence for a theory of consciousness in the first place.  

  ### Why Evidence Itself is the Dispute  
  IIT makes a radical claim: Consciousness *is* integrated information. It proposes precise mathematical postulates to quantify this. But one postulate, **Exclusion**, highlights why this debate is so thorny. Let me explain it simply—especially for our funders and colleagues new to IIT.  

  Imagine you’re holding a ceramic coffee cup. You experience it *as a single, unified object*. But physically, it’s made of trillions of atoms, each interacting locally. Which system is "conscious" of the cup? The whole cup? A single atom? A random group of atoms?  

  **IIT’s Exclusion Postulate says:** Consciousness arises *only* at the level of a system that generates the *maximum* amount of *irreducible, intrinsic cause-effect power*—nothing higher, nothing lower, nothing overlapping.  

  *   **Irreducible:** The system’s causal power can’t be reduced to its parts.  
  *   **Intrinsic:** It’s defined from the system’s own perspective, not an external observer.  
  *   **Exclusion:** Only *one* specific spatio-temporal grain achieves this maximum. All others are excluded.  

  **Why does this matter for evidence?**  

  1.  **The "Intrinsic" Problem:** IIT defines consciousness from the *system’s intrinsic perspective*. But we, as external scientists, can only measure extrinsic correlates (brain scans, behavior). How do we *prove* what’s happening intrinsically? Critics argue this makes IIT untestable. Proponents argue we *can* infer intrinsic properties through causal analysis of the physical substrate.  
  2.  **The "Exclusion" Challenge:** If consciousness only exists at one precise level of organization (e.g., cortical neurons, not atoms or whole brain regions), where do we look? If we find neural correlates at multiple levels, which one "counts"? Critics see this as moving goalposts. Proponents see it as precise prediction.  
  3.  **The "Falsifiability" Dilemma:** What experiment could *conclusively* falsify IIT? Critics say too much flexibility in applying Exclusion shields the theory. Proponents point to specific predictions (e.g., lack of consciousness in feed-forward networks, presence in split-brain cases) they argue *are* testable and sometimes verified.  

  ### The Crossroads We Face  
  This isn’t just about IIT. It’s about the science of consciousness itself. **We are wrestling with a foundational question: Can a theory that fundamentally prioritizes *intrinsic* cause-effect structure ever be fully validated by *extrinsic* observation?**  

  *   If the answer is "No," then theories like IIT may lie beyond traditional empirical science.  
  *   If the answer is "Yes," we need new methodologies and consensus on what constitutes valid evidence for intrinsic properties.  

  **That’s the genuine disagreement at the heart of this room.** It’s not primarily about personalities, prestige, or even the "pseudoscience" label. It’s about the boundaries of scientific inquiry when studying subjective experience.  

  ### Our Task Here  
  Over the next two days, we have a rare opportunity:  

  1.  **For proponents:** Demonstrate how Exclusion generates concrete, testable predictions that avoid unfalsifiable flexibility. Show how "intrinsic" cause-effect power can be rigorously inferred.  
  2.  **For critics:** Engage directly with the *specific* mathematical structure of IIT and its predictions. Identify what *specific* empirical outcomes would falsify its core postulates in your view.  
  3.  **For all:** Seek clarity on the standards of evidence we demand. Can we agree on what would constitute decisive evidence *for* or *against* intrinsic causal structures as the basis of consciousness?  

  **Our goal isn’t consensus on IIT today.** Our goal is a deeper, shared understanding of *why* we disagree so profoundly about the evidence. That understanding is the first step towards progress—whether it leads to refining theories, developing new tests, or even redefining the questions we ask.  

  Let’s proceed not just with civility, but with genuine curiosity. The hardest frontiers demand nothing less. Thank you. I look forward to the discussion.  

  ---
  **Key elements addressed:**  

  1.  **Acknowledges Tension Neutrally:** Names the letter without validating or condemning the "pseudoscience" label.  
  2.  **Frames Core Dispute:** Positions the conflict as fundamental (evidence standards), not superficial (turf war).  
  3.  **Explains Exclusion for Funders:** Uses simple analogy (coffee cup), defines key terms (Intrinsic, Irreducible, Exclusion), avoids math.  
  4.  **Links Exclusion to Evidence Dispute:** Explicitly shows how the postulate creates the core methodological clash (Intrinsic vs. Extrinsic measurement, Falsifiability challenges).  
  5.  **Elevates the Stakes:** Connects the IIT debate to the broader challenge of consciousness science.  
  6.  **Provides Concrete Workshop Goals:** Gives specific tasks for proponents, critics, and all attendees focused on evidence.  
  7.  **Neutral & Forward-Looking:** Ends by focusing on understanding the *nature* of the disagreement as progress.  

  This structure respects the charged history while elevating the discussion beyond it, using IIT's own framework to illuminate why the debate exists, making it accessible and relevant to all attendees.
