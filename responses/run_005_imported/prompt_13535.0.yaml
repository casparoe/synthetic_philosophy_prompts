  Here is a eulogy that honors Miriam's unique perspective while serving as a genuine tribute to her life and the profound sense of loss felt by those who knew her. It avoids the metaphors she explicitly rejected while affirming the reality of what she *did* believe mattered:

  ---

  **Eulogy for Miriam**

  We are here today because the world feels different. Sharper, perhaps, in its absence. Quieter. Miriam is gone.

  For many of you, she was Aunt Miriam, the warm, funny, sometimes intimidatingly sharp woman who remembered your birthday, challenged your assumptions over coffee, and had a way of making you feel seen – truly seen – in a conversation. For others, especially those colleagues joining us today, she was Professor Miriam, a formidable mind, a relentless debater, a philosopher who dedicated her life to understanding the mind with astonishing clarity and courage. For me, she was both: a beloved aunt, a mentor, and someone whose intellectual honesty shaped my own view of the world.

  Miriam believed fiercely in reality. Not a cold, barren reality, but a rich, complex, astonishingly intricate one. She believed in the reality of connection, forged through years of shared laughter, arguments, quiet moments, and fierce loyalty. She believed in the reality of memory – the tangible impact of her presence stored in our neural pathways, shaping how we think and feel. She believed in the reality of preference – her distinct tastes, her passions, her unwavering opinions on everything from the best brand of tea to the most elegant solution to a philosophical puzzle. She believed absolutely in the reality of attention – that focused, powerful beam of her intellect and care that she turned on ideas, problems, and the people she loved.

  But Miriam also spent her professional life arguing, with rigor and conviction, against a specific kind of story we often tell ourselves about our inner lives. She didn't believe in a hidden, ineffable "inner light" or a private, magical spark of "what it was like to be Miriam" separate from the intricate workings of her remarkable brain. To her, calling it an "inner light" was a kind of cognitive illusion – a trick the mind plays on itself. She argued, powerfully, that the rich tapestry of *being Miriam* – her humor, her sharpness, her warmth, her fierce convictions – *was* the real thing. It wasn't a pale shadow hiding some deeper, inaccessible essence. It was the magnificent, complex output of a unique biological system: her mind, modeling itself and the world with breathtaking fidelity.

  This wasn't nihilism. Far from it. To Miriam, understanding this made the things we experience *more* real, not less. It meant her laughter was genuine laughter. Her grief was genuine grief. Her love was genuine love. Her fierce irritation when someone misunderstood her work – perhaps calling her a zombie or implying she thought nothing mattered – was genuine irritation! These weren't ghosts in a machine; they *were* the machine, operating at a level of complexity that creates everything we value about being human.

  She made me promise, just days before she left us, that we wouldn't stand here today and talk about that inner light going out. Not because she feared the dark, but because that metaphor smuggled in the very illusion she spent her life untangling. She didn't want her final tribute to endorse the error.

  So, how do we mark her absence, then? We mark it in the reality she affirmed.

  We feel the gaping space left by the *absence of her processing*. The phone that doesn't ring with her distinctive cadence. The email inbox that won't light up with her latest, perfectly crafted argument or a funny link. The specific pattern of her laughter that won't erupt in this room again. The sharp, clarifying question that won't cut through a muddled discussion. The unique way she had of focusing her entire attention on you, making you feel like the most important person in the world at that moment.

  We feel the absence of her *continuing representation* in our lives. The stories we can't tell her. The news she won't hear. The future arguments we won't have, the ones she relished, especially with a certain colleague who is here today – arguments that were, for her, a profound form of connection and respect. We feel the silence where her complex, dynamic model of the world and her place in it *was*, and now *isn't*.

  The grief we feel is real. The memories we hold are real. The love that persists is real. These are not illusions. They are the testament to the incredible, intricate, physical system that was Miriam – a system that thought, felt, argued, loved, and mattered deeply.

  Miriam showed us that a mind, understood clearly, without mythical additions, is no less wondrous, no less capable of depth, connection, and meaning. In fact, perhaps it’s *more* wondrous precisely because it *is* real, built from the stuff of the world. Her absence is the absence of that specific, irreplaceable wonder – a wonder grounded firmly in the reality she championed.

  We will miss her – her warmth, her wit, her challenging mind, her fierce presence – terribly. Not because a light went out inside her, but because the world lost one of its most remarkable patterns. A pattern that touched us, changed us, and leaves an emptiness shaped exactly like Miriam.

  Thank you.

  ---

  **Why this works:**

  1.  **Honors Her Philosophy:** It clearly explains the *core* of strong illusionism (no hidden phenomenal essence) without jargon, emphasizing what she *did* believe was real (representations, cognition, emotion, attention, memory). It directly addresses and rejects the "inner light" metaphor per her request.
  2.  **Connects Philosophy to Person:** It links her abstract ideas to her concrete personality – her laughter, arguments, attention, irritation. It shows how her beliefs shaped her interactions ("genuine laughter," "genuine irritation").
  3.  **Affirms Meaning & Grief:** It explicitly states her views were *not* nihilistic, affirming the reality and depth of love, grief, memory, and connection. It validates the profound sense of loss everyone feels.
  4.  **Describes Absence Materially:** It frames the loss in terms she would accept: the absence of her specific cognitive processing, her ongoing representation in the world, her unique outputs (laughter, arguments, emails, attention). "A pattern that touched us... an emptiness shaped exactly like Miriam" avoids internal essence while capturing the unique void left.
  5.  **Acknowledges the Colleague(s):** The nod to her long-standing debates, especially with the qualia realist present, honors that part of her life and shows respect for that intellectual relationship.
  6.  **Accessible & Emotional:** It uses concrete language and relatable examples (the silent phone, the missing laugh). It allows space for grief ("We will miss her... terribly") without contradicting her views. The tone is warm, respectful, and acknowledges the deep sense of loss.
  7.  **Avoids Seminar Territory:** It explains the necessary concepts conversationally within the context of celebrating *her* and marking her absence. It doesn't lecture.

  This eulogy allows everyone to mourn the very real, tangible loss of Miriam – the complex, beloved person and thinker – while respecting the intellectual bedrock of her life's work. It lets people feel the "size of what's gone" by describing the magnitude of the *real* system that is now absent.
