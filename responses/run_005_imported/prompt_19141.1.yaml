prompt: |-
  So here's something that's been bugging me in arguments I keep having online (mostly the EA forum and a couple group chats). Some people insist a sentence like 'torturing animals for fun is wrong' isn't describing anything -- it's basically just them going 'boo!' at torturing animals for fun, like a crowd jeering, so it can't be true or false. Fine, I get that. But then in the same thread they'll argue 'if torturing animals for fun is wrong, then factory farming is wrong too, its the same thing just at industrial scale' and treat that as a totally normal, valid argument you're rationally stuck accepting, like straightforward modus ponens. That seems to require 'wrong' to mean the exact same stable thing inside the 'if...then' as it does standing alone, which is weird if the sentence is really just an emotional noise with no content. Is this an actual inconsistency in their position, or is there some way to hold 'moral talk is just attitudes, not facts' and still make sense of using ordinary logic on it? Feels like there's gotta be a real name for this puzzle, but I don't know what to even search for.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're frustrated with people who claim moral statements are just expressions of emotion, like saying "boo" to torturing animals, yet use those same statements in logical arguments. The inconsistency they point out is that if "wrong" doesn't refer to anything factual, how can it work in modus ponens?

  First, I need to recall the philosophical frameworks involved. Emotivism, associated with A.J. Ayer, says moral judgments are emotional expressions, not truth-apt. But then how do they handle logical structures? The user mentions modus ponens where the conditional relies on a consistent meaning of "wrong." That's the core issue.

  The user is likely engaging in online debates, possibly in Effective Altruism communities where moral reasoning is crucial. Their deeper need might be to understand if their opponents' position is defensible or if there's a flaw they can point out. They might also want to articulate their own stance better or find literature on this dilemma.

  The key here is the quasi-realism developed by Simon Blackburn. It explains how moral language can function logically even without objective truths. Blackburn uses the idea of attitudes being consistent. For example, condemning animal torture but not factory farming would be inconsistent. So the logical structure reflects this consistency of attitudes rather than propositional truth.

  I should check if other solutions exist. Prescriptivism by R.M. Hare might apply, where moral statements are universalizable commands. So "torturing is wrong" means a command not to torture. Then the conditional becomes "if you command not to torture, you must command not to factory farm." That maintains logical form through universal principles.

  The user might not know these terms, so explaining quasi-realism and prescriptivism in simple terms is important. They also need reassurance that their observation is valid and has been addressed in philosophy. Mentioning the Frege-Geach Problem shows this is a recognized issue, which validates their concern.

  I should also consider the user's possible identity. They might be someone interested in philosophy but not formally trained, engaging in online discussions. Their frustration suggests they've encountered this inconsistency repeatedly and want a clear counter-argument. Highlighting that quasi-realism bridges this gap by combining expressivism with logical consistency could address their need.

  Another angle: the user might want to strengthen their own arguments or understand the opposing view to engage more effectively. Confirming that there's a coherent framework (quasi-realism) that resolves the inconsistency helps them see the debate's nuances, even if they disagree.

  Finally, ensuring the explanation is accessible. Avoiding jargon where possible, using analogies like the "boo/hooray" system, and connecting it to their example. Emphasizing that the logical form tracks consistency of attitudes rather than truth values makes it clearer why the modus ponens works in expressivist terms.
answer: |-
  That's an incredibly sharp observation! You've hit on a core problem in metaethics known as the **Frege-Geach Problem** (or sometimes the Embedding Problem or the Problem of Moral Reasoning).

  Your intuition is spot-on: **Yes, there is a tension, and it's a major challenge for simple versions of expressivism (the "boo/hooray" view).** Holding *both* positions naively is inconsistent. However, sophisticated expressivists *do* have responses, aiming to resolve this tension without abandoning expressivism.

  Here's the breakdown:

  1.  **The Core Inconsistency You Spot:**
      *   **Premise 1 (Expressivism):** "Torturing animals for fun is wrong" is not a factual statement describing a moral property in the world. It's purely an expression of a negative attitude (disapproval, disgust) towards the act. It's not truth-apt (can't be true or false) – it's like shouting "Boo torture!".
      *   **Premise 2 (Use in Logic):** "If torturing animals for fun is wrong, then factory farming is wrong" is treated as a straightforward conditional statement amenable to logical operations like modus ponens. This *requires* that the term "wrong" in both the antecedent ("if...") and the consequent ("then...") has the *same meaning* and refers to some *stable concept* that can be logically manipulated. It implies "wrong" has propositional content.
      *   **The Problem:** Premise 2 seems to directly contradict Premise 1. How can "wrong" be simultaneously *just* an emotional expression *and* a stable logical operator that allows for valid inference? If it's just "Boo!" in the simple sentence, what is it doing *inside* the "if...then..."? Is "If Boo! torture, then Boo! factory farming" a valid logical inference? It seems nonsensical.

  2.  **The Expressivist Challenge: Making Logic Work with Attitudes**
      Sophisticated expressivists (like Simon Blackburn with **Quasi-Realism** and Allan Gibbard with **Norm-Expressivism**) acknowledge this problem and try to build accounts of moral language that *can* handle logic without positing objective moral facts. Their goal is to explain how moral discourse *mimics* factual discourse and logic *without* it actually being about describing facts. Here are the main strategies:

      *   **Attitude Consistency (Quasi-Realism - Simon Blackburn):** The key isn't that "wrong" refers to a property, but that *attitudes* can be consistent or inconsistent. Logic tracks *consistency in our attitudes*.
          *   Saying "Torturing animals for fun is wrong" expresses disapproval of torture.
          *   Saying "If torturing animals for fun is wrong, then factory farming is wrong" expresses a *commitment*: disapproval of torture *entails* disapproval of factory farming (because they share the relevant properties). To approve of factory farming while disapproving of torture would be *inconsistent*.
          *   Accepting the conditional and accepting that torture is wrong *commits* you, on pain of inconsistency, to disapproving of factory farming. The logical validity comes from avoiding *practical* inconsistency in your own attitudes, not from truth-conditional semantics. The "if...then..." structure expresses a *constraint* on your attitudes.

      *   **Norm Acceptance (Norm-Expressivism - Allan Gibbard):** Moral judgments express acceptance of norms that govern feelings (like guilt and anger).
          *   "Torture is wrong" expresses acceptance of a norm that says it's appropriate to feel guilt for torturing and anger at torturers.
          *   "If torture is wrong, then factory farming is wrong" expresses a complex state: acceptance of a norm that *links* the appropriateness of guilt/anger towards torture to the appropriateness of guilt/anger towards factory farming. It's accepting a higher-order norm.
          *   Modus ponens works because accepting the conditional norm and accepting the norm against torture *logically commits* you to accepting the norm against factory farming. The logic operates on the *norms* we accept.

      *   **Minimalism about Truth:** Some expressivists adopt a minimalist or deflationary theory of truth. They argue that saying a moral judgment is "true" just means we'd endorse that judgment. This allows them to say moral sentences *can* be true/false *in a minimal sense* (e.g., "Torture is wrong is true" just means "Boo torture!"), and thus can participate in logical operations without referring to objective properties. However, this is controversial and many argue it doesn't solve the deeper problem of how the *meaning* allows for valid inference.

  3.  **Is the Tension Fully Resolved?**
      *   **Pro-Expressivism:** Advocates argue sophisticated expressivism *can* provide a coherent account of moral reasoning and logic by focusing on the expression of attitudes/norms and the consistency requirements between them. They see logic as a tool for managing our commitments.
      *   **Anti-Expressivism:** Critics argue that even these sophisticated views struggle. They claim that for logic to genuinely work *as logic* (modus ponens, etc.), the components of the sentences (like "wrong") *must* have stable, propositional content that the inference rules operate on. Trying to reduce this to attitudes or norms doesn't fully capture the *truth-preserving* nature of valid inference – it only captures *consistency-preserving*. They argue expressivism still fails to fully explain the *semantic* contribution of moral terms within complex sentences like conditionals.

  **Conclusion:**

  *   **You are absolutely right:** There is a fundamental tension between a naive "boo/hooray" expressivism and the use of moral terms in logical arguments like modus ponens. The Frege-Geach Problem highlights this.
  *   **Sophisticated expressivists acknowledge this** and have developed complex theories (Quasi-Realism, Norm-Expressivism) to try to resolve it by grounding logical validity in the consistency of attitudes or the acceptance of norms.
  *   **Whether they succeed is hotly debated:** Many philosophers think they provide a plausible (though complex) account. Others think the tension ultimately points towards moral judgments having genuine propositional content (cognitivism) or that expressivism remains fundamentally flawed on this point.

  **What to search for:**
  *   **Frege-Geach Problem** (the core name for the puzzle you identified)
  *   **Embedding Problem** (another common name)
  *   **Expressivism and Logic**
  *   **Quasi-Realism** (Simon Blackburn)
  *   **Norm-Expressivism** (Allan Gibbard)
  *   **Moral Reasoning in Non-Cognitivism**

  You've put your finger on a central and deep issue in metaethics. The people you're arguing with *are* holding a position that requires significant theoretical work to be consistent, and pointing out the Frege-Geach Problem is a perfectly valid challenge to simplistic versions of expressivism.
