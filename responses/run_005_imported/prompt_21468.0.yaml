answer: |-
  Here are eight interview questions designed to press the technical and philosophical mechanics of the interventionist/counterfactual dispute, incorporating your specific requests and featuring pointed follow-ups:

  1.  **Question (Causal Primitive - Intervention):** Interventionism defines a causal relation X->Y in terms of how Y would change under *interventions* on X. But Woodward's own definition of an "intervention" (e.g., in *Making Things Happen*) crucially involves stipulations like "the intervention I must not be caused by any variable that causes Y via a path not going through X" and "I must not be correlated with any cause of Y that doesn't lie on a causal path from I to X to Y." Doesn't this render "intervention" itself a *causally laden* concept? If so, doesn't interventionism fail as a *reductive* account of causation, merely swapping Lewis's primitive counterfactual similarity metric for a primitive causal concept of "intervention"?
      *   **Likely Answer/Follow-Up:** *(If she argues interventions can be defined non-causally, e.g., via ideal randomized experiments)*: "But doesn't the very *possibility* and *interpretation* of a randomized experiment rely on causal assumptions? For instance, the randomization device *causing* the assignment, and the assumption that randomization *breaks* pre-existing causal paths? Doesn't this just push the causal baggage back a step?"

  2.  **Question (Late Preemption - Mechanics):** Consider a classic late preemption case: Suzy and Billy both throw rocks at a bottle. Suzy's rock hits first and shatters the bottle. Billy's rock would have shattered it a moment later if Suzy's hadn't. Interventionism, using structural equations, typically handles this by setting Billy's throw to 'no throw' in the model while intervening on Suzy's. But isn't this essentially *ad hoc*? Why is it "Billy's throw" that gets fixed, rather than Suzy's? Isn't this asymmetry introduced precisely *because* we know Suzy's was the actual cause, mirroring the kind of patch Lewis needed for his similarity metric? Is the structural equations treatment fundamentally *less* patched-together than Lewis's?
      *   **Likely Answer/Follow-Up:** *(If she argues the model structure reflects the actual mechanism/dependencies)*: "But doesn't the 'actual mechanism' here *include* the temporal sequence? If the equations explicitly build in time (e.g., SHATTERED(t) = SUZY_THREW(t-δ) OR (BILLY_THREW(t-δ) AND ~SUZY_HIT(t-δ))), haven't we simply *built the preemption solution into the causal model from the start*, rather than deriving it from a more fundamental interventionist principle? How does this differ in spirit from Lewis building temporal asymmetry into his similarity metric?"

  3.  **Question (Trumping Preemption - Symmetry):** Jonathan Schaffer's trumping preemption case: A sergeant and a major simultaneously shout "Advance!" at a private. The private advances. Military rules dictate that the major's order trumps the sergeant's. Intuitively, the major's order caused the advance, the sergeant's did not. Interventionism needs to model this. If we represent both orders as binary variables (ORDER_MAJ, ORDER_SERGE) and ADVANCE, with ADVANCE = ORDER_MAJ OR ORDER_SERGE, this symmetric model *fails* – it would say both are causes. So, interventionists must build the hierarchy into the equation, e.g., ADVANCE = ORDER_MAJ OR (ORDER_SERGE AND ~ORDER_MAJ). **What non-arbitrary, non-circular resource within interventionist theory justifies introducing this *asymmetry* into the structural equations, beyond just stipulating the hierarchy because we know it's a trumping case?** Isn't this just encoding the causal fact we're trying to explain?
      *   **Likely Answer/Follow-Up:** *(If she argues the hierarchy is part of the system's structure/nature)*: "But doesn't this 'structure' just *be* the causal facts? If the equations themselves are symmetric (both orders seem individually sufficient), what *interventionist principle* forces us to introduce the trumping asymmetry (~ORDER_MAJ) clause *specifically*, rather than any other modification, if not our prior causal knowledge of the trumping rule? How does interventionism *discover* this structure without relying on pre-theoretical causal intuitions about trumping?"

  4.  **Question (Non-Manipulability - Counterfactuals Redux):** Interventionism grounds causal meaning in potential manipulations. How does it handle causal claims about systems fundamentally beyond manipulation, like the causal influence of the Big Bang on the cosmic microwave background, or the gravitational interaction between two distant galaxies? Does appealing to "hypothetical" interventions here – interventions that are physically or nomologically impossible – simply collapse back into evaluating standard Lewisian counterfactuals ("If the Big Bang had been different, would the CMB be different?")? If so, hasn't interventionism just reintroduced the very counterfactual dependence it sought to replace, now disguised as a 'hypothetical intervention'?
      *   **Likely Answer/Follow-Up:** *(If she argues hypothetical interventions are distinct, perhaps tied to invariant relationships)*: "But isn't the evaluation of whether a relationship is 'invariant' under a hypothetical intervention *itself* just the evaluation of a counterfactual? Specifically, the counterfactual: 'If an intervention *were* to change X (even if impossible), *would* Y change according to this invariant relationship?' Doesn't this make the hypothetical interventionist account *parasitic* on a prior understanding of counterfactuals?"

  5.  **Question (Structural Equations - Ontology & Justification):** Interventionism relies heavily on specifying the 'correct' set of structural equations for a system. What determines the ontology of variables and the functional relationships in these equations? Is it purely empirical (data patterns under interventions), or does it involve substantive theoretical and causal assumptions? If the latter, doesn't this risk circularity? If the former, how do we uniquely identify the *causal* structure from statistical dependencies alone, especially given the underdetermination highlighted by the causal Markov condition and faithfulness assumptions?
      *   **Likely Answer/Follow-Up:** *(If she emphasizes invariance testing under interventions)*: "But doesn't testing for invariance *presuppose* we can perform interventions, which brings us back to the primitive causal notion of intervention? And how do we decide *which* variables to include in the model and *which* functional forms to test for invariance between *before* we have causal knowledge? Doesn't this prior step involve causal assumptions?"

  6.  **Question (Overdetermination & Difference-Making):** Interventionism often emphasizes actual *difference-making*. In symmetric overdetermination (two sufficient causes, both occur, effect occurs – e.g., two switches both flipped, both connected to the same light), does interventionism typically say *neither* switch caused the light to go on (since intervening to flip just one switch to 'off' while holding the other fixed doesn't change the outcome), or does it adopt a different view? How does this verdict compare to Lewis's treatment, and does interventionism offer a more satisfying account of why we might still feel intuitively that *both* are causes?
      *   **Likely Answer/Follow-Up:** *(If she concedes interventionism often says neither is a cause in symmetric overdetermination, or adopts a different strategy)*: "Given that common intuition strongly leans towards both being causes in such cases, doesn't this verdict reveal a potential weakness in the core interventionist focus on *actual* difference-making? Does interventionism need to supplement its account (e.g., with notions of 'contributing cause') in a way that starts to look like Lewis's appeal to more fragile counterfactual dependence?"

  7.  **Question (Interventionism vs. Process Theories):** Some critics (e.g., Salmon, Dowe) argue that interventionism, like counterfactual theories, fails to capture the intrinsic *production* or *mechanism* of causation, focusing only on dependencies. How does interventionism respond? Does its reliance on *structural* equations, specifying mechanisms connecting variables, adequately address this concern, or does it still reduce causation to patterns of dependency under manipulation?
      *   **Likely Answer/Follow-Up:** *(If she argues structural equations *do* capture mechanisms)*: "But aren't structural equations fundamentally *mathematical representations* of dependencies? Does writing Y = f(X) *explain* how X *produces* Y, or does it merely describe how Y's value covaries with X's? Doesn't the actual productive mechanism (e.g., the kinetic energy transfer from Suzy's rock to the bottle) remain outside the equations themselves, which just encode the input-output relation?"

  8.  **Question (The Role of Actual Causation):** Interventionism provides a clear account of *type*-causation (general relationships). Its account of *actual*-causation (singular events, like Suzy's throw causing *this* shattering) relies on evaluating counterfactuals of intervention on the actual values. Given that evaluating these counterfactuals often requires holding fixed other variables at their *actual* values (as in the late preemption case), and given the potential complexity in choosing *which* variables to hold fixed (the "non-descendants" or "off-path" variables), is the interventionist account of actual causation significantly *simpler* or *less* context-dependent than Lewis's account with its similarity ordering? Or do both theories ultimately require careful, sometimes complex, stipulations to get the right answers?
      *   **Likely Answer/Follow-Up:** *(If she argues interventionism provides clearer, more objective principles for holding variables fixed, e.g., via the causal graph)*: "But doesn't constructing the correct causal graph *for the specific context of the actual cause* still require significant causal knowledge and judgment? For instance, in the preemption case, knowing *which* variables are on the path and need holding fixed depends on knowing the actual causal sequence. Doesn't this mean the account relies on prior causal knowledge to get the right answer about actual causation?"

  **Key to Follow-Ups:** These follow-ups anticipate common interventionist defenses and press the core concerns: circularity (Q1, Q5), the potential ad-hocness or reliance on prior causal knowledge in handling problem cases (Q2, Q3), the collapse into counterfactuals for non-manipulable cases (Q4), potential counter-intuitive consequences (Q6), the distinction between dependency and production (Q7), and the complexity/context-dependence of actual causation judgments (Q8). They force the guest to confront whether interventionism genuinely *reduces* causation or provides a fundamentally *different kind* of analysis compared to counterfactual theories, or whether it shares similar foundational challenges dressed in different formal attire. Good luck with the interview!
