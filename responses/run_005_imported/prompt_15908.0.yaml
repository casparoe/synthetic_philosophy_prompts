answer: |-
  You've hit on a profound and often underappreciated point about Parfit's Hitchhiker. Your skepticism is well-founded, and the standard framing *is* misleading. Here's why:

  1.  **The Core Confusion: Temporal Perspective**
      *   The alleged superiority of EDT is typically argued from the *ex-ante* perspective (before the trip), not the *interim* perspective (in town).
      *   **Ex-Ante (Before Pickup):**
          *   **EDT:** "If I *plan* to pay ($P(Pay)$), that is strong evidence the predictor *saw* me paying, meaning they picked me up ($P(PickedUp | Pay)$ is high). If I *plan* not to pay ($P(\neg Pay)$), that is strong evidence the predictor saw me not paying, meaning they didn't pick me up ($P(PickedUp | \neg Pay)$ is low). Since I prefer being picked up and paying to not being picked up at all, EDT recommends *planning* to pay."
          *   **CDT:** "My decision *now* ($PlanPay$) cannot *cause* the predictor's past decision. My choice only affects the future payment. $U(PlanPay) = U(Pay)$ and $U(Plan\neg Pay) = U(StayLost)$. CDT recommends *planning* not to pay." This leads to the bad outcome.
      *   **Interim (In Town):**
          *   **EDT:** "I *know* I was picked up ($PickedUp$ is now evidence with probability ~1). Conditioning on $Pay$ vs $\neg Pay$ *cannot change this known fact*. $P(PickedUp | Pay) \approx P(PickedUp | \neg Pay) \approx 1$. The only relevant consequences are -$100 vs $0. EDT recommends $\neg Pay$."
          *   **CDT:** "My decision *now* ($Pay$ vs $\neg Pay$) cannot change the past fact I was picked up. The only causal consequences are -$100 vs $0. CDT recommends $\neg Pay$."
      *   **The Trap:** Proponents of EDT point to its ex-ante recommendation ("plan to pay") as correct and CDT's ex-ante recommendation ("plan not to pay") as flawed. However, when you examine the *actual decision node in town*, *both* theories give the *same* recommendation: **Don't Pay**.

  2.  **Why is EDT's Ex-Ante Recommendation Problematic?**
      *   EDT's ex-ante reasoning relies on evaluating *plans* or *dispositions* ("If I *plan/intend* to pay..."), not just isolated acts at a node.
      *   **EDT itself doesn't naturally handle sequential decisions.** Its core mechanism is evaluating an act *A* by conditioning on *A* being true *now*. At the ex-ante node, conditioning on "I pay *later*" requires EDT to implicitly look ahead to the future node and assume the plan is followed. This is stepping outside pure act-based EDT.
      *   **The "EDT solution" requires a *policy*:** To get the "good" recommendation (plan to pay), EDT needs to evaluate the *policy* "Pay if picked up", not just the isolated act "PlanPay" at the first node. It needs to bind the decision at node 1 (intention) to the decision at node 2 (action).

  3.  **Your Key Insight is Correct: The Problem is Myopic Node-by-Node Evaluation**
      *   **Any decision theory** that evaluates each decision node in isolation, using *only* the information available at that node and the *immediate* causal/evidential consequences, **will fail in Parfit's Hitchhiker**.
      *   **At the interim node:**
          *   The information "I was picked up" is fixed.
          *   The immediate consequence of paying is losing $100; not paying gains $0.
          *   *No* theory evaluating just this node can justify paying. The benefit (being saved) is already in the past and unaffected by the current choice.
      *   **The failure of CDT** is evident at the *first* node because its causal model prevents it from seeing the link between its *current* plan and the predictor's *past* action.
      *   **The failure of pure act-based EDT** is revealed at the *second* node. While it got the "right" answer ex-ante by implicitly using policy reasoning, it gives the "wrong" (short-sighted) answer when applied strictly node-by-node later.

  4.  **Is Hitchhiker a Point for EDT over CDT? A Qualified No.**
      *   **Yes, if...** you define EDT's success by its ex-ante recommendation ("plan to pay") and CDT's failure by its ex-ante recommendation ("plan not to pay").
      *   **But this is misleading because:**
          *   It ignores that EDT fails *at the payment node*.
          *   It relies on EDT performing policy evaluation (binding future actions to current intentions), which isn't inherent to its basic act-evaluation mechanism.
          *   It doesn't show EDT is fundamentally superior; it shows EDT *can be coerced* into policy reasoning where CDT struggles. CDT can also be fixed by explicitly adopting policy-based approaches (like Ratificationism or TDT/UDT).
      *   **Therefore:** Framing Hitchhiker *primarily* as a win for EDT over CDT *is a mistake*, or at least an oversimplification. It obscures the deeper issue you identified: **sequential decision-making under perfect prediction requires evaluating *policies* or *commitments*, not just isolated acts node-by-node.** This is a challenge for *any* theory limited to myopic node evaluation.

  **Conclusion:**

  You are absolutely right. Parfit's Hitchhiker is **not** a clean victory for EDT over CDT in the way Newcomb's Problem often is. It primarily highlights a fundamental problem for *any* decision theory that evaluates choices strictly node-by-node, based *only* on the information and consequences immediately available at that node, in sequential problems involving predictors or pre-commitments.

  *   **CDT fails** at the first node due to its causal isolation.
  *   **Pure act-based EDT fails** at the second node due to its inability to justify costly actions when the benefit is already locked in.
  *   The "EDT solution" only works by **smuggling in policy evaluation** at the ex-ante stage.

  The case is better understood as an argument for **policy-based decision theories** (like FDT, UDT, or even sophisticated forms of EDT/CDT that evaluate strategies) over **act-based decision theories** (whether causal or evidential) in environments with predictors or where current choices signal future behavior. It exposes the limitations of myopic rationality. Treating it as a simple point for EDT over CDT does indeed obscure this crucial nuance. Your seminar's framing was incomplete.
