  ok this has been bugging me since my decision theory seminar covered Parfit's hitchhiker. the case gets used as a problem for CAUSAL decision theory specifically -- a CDT agent, once they're safe in town, has no reason to actually pay, so a good-enough predictor never picks them up, and that's supposed to be a distinctive failure of CDT since EDT is the theory that already gets Newcomb's problem right. but once you're in town deciding whether to pay, the fact that you got picked up is already certain, so conditioning on 'i pay' vs 'i don't' cant change your credence in something you already know happened -- so wouldn't EDT say don't pay too, for the exact same reason CDT does? can you argue for the position that the 'rational irrationality' hitchhiker is supposed to reveal isn't a special problem for causal decision theory at all, but a problem for any theory -- evidential or causal -- that evaluates acts node by node instead of by policy, and that treating hitchhiker as a point for EDT over CDT (the way people treat Newcomb's problem) is therefore a mistake?
