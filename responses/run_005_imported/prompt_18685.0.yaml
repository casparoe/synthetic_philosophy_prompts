prompt: |-
  I teach the philosophy of computability as part of a graduate logic sequence, and an exchange with a sharp student this term has left me genuinely unsure what to say the next time the topic comes up. The standard story I give is this: Turing's machine model, Church's lambda calculus, and the general recursive functions developed by Gödel and Kleene were each motivated independently, then proved extensionally equivalent, and Turing additionally supplied a direct argument — via his analysis of what a human clerk mechanically following fixed instructions, equipped with only finitely many recognizable symbol-configurations and states of mind, could accomplish — for why no wider notion of an "effective procedure" could escape this class. My student's response was that this is a strange thing to still call a "thesis." On her view, once three independently motivated formal systems converge on a single extension, and you additionally have an argument, like Turing's, that engages the informal notion directly rather than just cross-checking formalisms against one another, you have exactly the kind of triangulation that mathematics treats as a proof everywhere else. She takes the continued insistence that the Church-Turing thesis remains a well-supported conjecture, forever short of the status of a theorem, to be either an empty terminological scruple or a holdover from before Turing's argument was fully appreciated.

  I would genuinely like to know why she is mistaken, if she is. Kleene, in coining the term "Church's thesis," clearly meant to mark it off from anything provable, and most subsequent writers on the philosophy of computability have followed him in denying that such a proof exists or could exist — but on the spot, I could not reconstruct a principled reason for this that did not simply restate the fact that "effectively calculable" is an informal notion, which sounds uncomfortably close to declaring the thesis unprovable by definitional fiat. Is there a real argument, distinct from Turing's own, for why extensional convergence plus Turing's analysis still falls short of a mathematical proof of the thesis? And does that argument also explain why no future analysis of this kind, however careful, could ever close the gap?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a philosophy professor teaching computability theory, and a student challenged the status of the Church-Turing Thesis (CTT) as an unprovable thesis rather than a proven theorem. The student argues that the convergence of multiple formal models (Turing machines, lambda calculus, recursive functions) plus Turing's analysis of human computation should constitute proof. The professor wants to understand why this isn't sufficient and why CTT remains a thesis.

  First, I need to recall the standard arguments for why CTT can't be proven. The key point is that "effective calculability" is an informal concept. Formal systems can be proven equivalent, but linking them to an informal notion isn't a mathematical proof. Turing's analysis is persuasive, but it's still an argument, not a proof. 

  The user mentioned Kleene's distinction and worries that calling CTT unprovable by definition is circular. So I should find a more substantive argument. Maybe the problem of interpretation: any formal model requires interpreting its symbols as computations, which isn't formal. Also, future models might challenge CTT if they align better with the informal notion, though that seems unlikely.

  The user wants to know if there's a reason why no future analysis could close the gap. That touches on philosophy of language—how informal concepts relate to formal ones. If "effective computation" is a pre-theoretic concept, it can't be formally captured by definition. Any proof would assume a formalization, begging the question.

  I should also address why the triangulation isn't seen as proof. In math, multiple formal proofs converge on truth, but here it's formal models matching an informal idea. The evidence is strong, but not deductive. Maybe use an analogy, like defining "algorithm" before formalization.

  The student's point about Turing's analysis being direct is valid, but Turing still relied on intuitions about human cognition. Those assumptions could be questioned, making it non-mathematical. 

  The professor needs to explain this without sounding dogmatic. Emphasize that CTT's status reflects the interplay between math and philosophy. Even with strong evidence, the informal nature keeps it a thesis. Future models would need to be intuitively valid and equivalent, but that's different from proof.
answer: |-
  Your student raises a profound and legitimate challenge that cuts to the heart of the relationship between formal systems, informal concepts, and mathematical proof. While her position is intellectually compelling, the continued designation of the Church-Turing Thesis (CTT) as a *thesis* rather than a *theorem* rests on deep philosophical and methodological grounds. Here's why the triangulation argument, though extraordinarily strong evidence, doesn't constitute a mathematical proof, and why the gap is likely insurmountable in principle:

  ### 1. **The Nature of the Target: An Informal Concept**
     The core issue is that "effective calculability" or "mechanical procedure" is an *informal*, pre-formal, intuitive notion existing *prior* to and *independent* of any formal mathematical system. Mathematical proofs operate *within* formal systems or establish relationships *between* formal systems. Proving something *about* an informal concept requires bridging the semantic gap between the formal and the informal. This gap cannot be closed by formal mathematics alone.

     *   **Analogy:** Consider defining "algorithm" before 1936. Mathematicians knew what an algorithm was (Euclid's algorithm, etc.), but lacked a formal definition. Proving that Euclid's algorithm *is* an algorithm would be circular or trivial once defined formally. Proving that *only* things like Euclid's algorithm *can be* algorithms is impossible without a prior formalization – which is precisely what CTT asserts the formalisms do.

  ### 2. **Why Triangulation Isn't Proof of Capture**
     While the extensional equivalence of Turing machines (TM), Lambda Calculus (λC), and General Recursive Functions (GRF) is a powerful *mathematical theorem*, it proves only that these three (and later, all other known) formalisms *coincide extensionally*. It does **not** prove that this common extension *exhausts* the informal notion of effective calculability.

     *   **The "Unknown Formal System" Objection:** It remains logically possible (though widely deemed implausible) that some future formal system F, motivated by different intuitions about computation (e.g., involving physical continua, hypercomputation, or undiscovered mathematical principles), could:
          *   Satisfy all intuitive criteria for representing "effective procedures."
          *   Compute functions *beyond* the TM/λC/GRF class.
          *   Be seen as a *more faithful* formalization of the informal concept than TM/λC/GRF.
     The convergence of TM/λC/GRF rules out systems *contradicting* them if they are equivalent, but it doesn't preclude a *broader* system that also satisfies the intuitive criteria. Only an *analysis* of the informal concept (like Turing's) can address this, but that analysis is inherently non-mathematical.

  ### 3. **Why Turing's Analysis Isn't a Mathematical Proof (Despite Being Compelling)**
     Turing's argument is brilliant and widely accepted. However, it is fundamentally a *conceptual analysis* grounded in *intuitions* about human cognition and the limitations of finite, discrete symbolic manipulation. It relies on premises like:
      *   A human "computer" has only finitely many distinct "states of mind."
      *   Their perception of symbols is finite and discrete (only recognizing bounded configurations).
      *   Their actions are determined locally by the immediate symbol/state.
      *   The workspace (paper) is effectively one-dimensional and discrete.
     While these premises seem undeniable, **they are not mathematical axioms**. They are empirical or phenomenological claims about *how we perform calculations*. To *prove* CTT mathematically, you would need to formalize these very premises. But formalizing "state of mind," "recognizable symbol," or "determined locally" *within a model of computation* would risk circularity – you'd likely build the limitations of TMs *into* your formalization of the premises. Turing's genius was identifying these intuitive constraints *without* presupposing a formal model, but this very reliance on intuition places it outside the realm of formal proof.

  ### 4. **The Problem of Interpretation and Faithfulness**
     Even if we grant that TM/λC/GRF capture everything *we can currently imagine* as mechanical, and that Turing's analysis is correct, there's a meta-problem: **How do we know our *interpretation* of the formalisms as representing "effective procedures" is the only possible faithful interpretation?**
     *   The symbols and rules of a TM are inert mathematics. We *interpret* the tape symbols, states, and transitions as representing steps in a calculation. This interpretation relies on *our* understanding of "mechanical procedure." A mathematical proof cannot certify that this interpretation is the *only possible* one compatible with the informal concept. It might be conceivable (though again, implausible) that some other interpretation of a different formalism could align *better* with the informal notion while yielding a larger class.

  ### 5. **The Inevitable Role of Intuition and the Limits of Formalism**
     Ultimately, the justification for CTT rests on the **inescapable appeal to shared intuition**. We examine the informal concept, we examine the formal systems, and we *see* that they align. Turing's argument sharpens this intuition dramatically. However:
      *   **Intuitions can evolve:** What seemed intuitively "mechanical" might change (though the stability of the concept since the 1930s is remarkable).
      *   **Intuitions can be disputed:** Someone might genuinely hold different intuitions about what constitutes a "mechanical step" (e.g., allowing infinitesimal steps).
      *   **Proof requires formal premises:** A mathematical proof must start from defined axioms and rules. There are no axioms defining "effective procedure" *prior* to the formalisms. Any attempt to *create* such axioms would either be arbitrary or would implicitly build in the intended conclusion (e.g., defining "effective" as "Turing computable").

  **Why No Future Analysis Can Close the Gap (The Principled Reason):**

  The gap is **categorical**, not contingent. It arises from the fundamental difference between:
  1.  **Formal Concepts:** Defined precisely within a mathematical system (e.g., "TM-computable function," "λ-definable function").
  2.  **Informal Concepts:** Understood pre-theoretically or based on shared human practice and intuition ("a procedure a human could follow mechanically with paper and pencil").

  Mathematics can prove equivalence between formal concepts (1). It can provide compelling arguments *based on analysis* that a formal concept (1) captures an informal concept (2). However, it **cannot** *prove* that (1) captures (2) *without*:
      *   **Reducing (2) to (1):** Which would be circular (defining the informal by the formal).
      *   **Relying on unformalized intuition:** Which moves beyond mathematical proof into philosophical argument.

  Any future "analysis," no matter how careful, will either be:
      *   A *mathematical proof* relating formal systems (irrelevant to capturing the informal concept).
      *   Or a *conceptual/philosophical argument* analyzing the informal concept and showing its alignment with a formal system. This argument, however rigorous, will rely on premises about the informal concept that are themselves intuitive and not formally provable. It will be *persuasive*, not *deductive* in the mathematical sense.

  **Conclusion & What to Tell Your Student:**

  Acknowledge the power of her point: The convergence of independent formalisms coupled with Turing's brilliant conceptual analysis provides **overwhelmingly strong evidence** for CTT. It is arguably the best-supported "thesis" in logic/mathematics. However, it remains a "thesis" because:

  1.  **The Target is Informal:** Proof requires formal premises; "effective calculability" lacks them inherently.
  2.  **Equivalence ≠ Exhaustion:** Proving formal systems are equivalent doesn't prove they capture *all* that is informally computable.
  3.  **Analysis is Persuasion, Not Proof:** Turing's argument, while compelling, relies on intuitive premises about human cognition that cannot be formally verified without circularity.
  4.  **Interpretation is Key:** The mapping between formal symbols and the informal notion relies on unprovable intuitions about faithfulness.

  Tell her that calling CTT a "thesis" isn't a mark of weakness, but an acknowledgment of a deep philosophical truth: **Mathematics can formalize and prove relationships within formal systems, but the justification for why a particular formal system captures a pre-theoretical intuitive concept ultimately rests on irreducible, albeit robust, shared human understanding.** The "terminological scruple" reflects the genuine boundary between formal proof and conceptual analysis. CTT is as close to certain as a claim linking the formal and informal can be, but its status highlights the limits of formalism in grounding its own applicability to the intuitive world of computation. Kleene's distinction was prescient: it marks the point where mathematics meets philosophy.
