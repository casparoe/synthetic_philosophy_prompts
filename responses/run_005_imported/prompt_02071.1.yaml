  ```

  ### Justifications:
  - **S (Acausal influence)**: This is foundational to logical decision theories (LDTs) like FDT/TDT/UDT, where rational agents consider logical correlations with other agents (including future ones) as decision-relevant. Denying this collapses the entire framework.
  - **A (Simulation harm)**: If personal identity is functional/computational (a common LDT assumption), harm to a perfect computational duplicate constitutes legitimate concern for the original, as the duplicate instantiates identical conscious states.
  - **B (Follow-through incentive & Simulation uncertainty)**: Follow-through is plausible under updatelessness (punishment maintains decision-theoretic consistency), but contingent on the agent's specific utility function. Simulation uncertainty is coherent under computational metaphysics, but non-negligible credence requires disputable cosmological assumptions.
  - **C (Exposure culpability)**: Arbitrarily singles out epistemic states over actions; difficult to justify normatively without ad hoc moral assumptions about "tainted knowledge."
  - **D (Privileged threat & Blackmail compliance)**: Privileged threat is vulnerable to symmetry problems (infinite possible threats/rewards make this one unmotivated). Blackmail compliance is refuted by LDTs endorsing precommitment to non-negotiation—the Nash equilibrium for acausal blackmail.
