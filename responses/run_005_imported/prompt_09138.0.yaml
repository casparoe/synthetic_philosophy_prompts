  Here's a toast that weaves the situationist idea into a warm tribute, using academia itself as the "hostile situation," with a central joke and a clear focus on Professor Kessler's enduring qualities. It balances insider references with universal appreciation:

  ---

  **(Clink glass gently)** Good evening everyone. For those who don't know me, I’m [Your Name], one of Professor Kessler’s former PhD students, and I’m incredibly honoured to be saying a few words tonight as we celebrate her truly remarkable career.

  Now, Professor Kessler has spent over forty years thoughtfully, rigorously, and often quite passionately, defending the idea that *character matters*. That our virtues – things like integrity, kindness, intellectual honesty – aren’t just fleeting moods, but deep-seated parts of who we are. This, of course, put her squarely in the crosshairs of some pretty famous psychological critiques – arguments suggesting that situations, not stable traits, often dictate our behaviour. You know the studies: whether you help a stranger might depend more on if you’re late for a lecture than on how pious you feel, or whether you return a lost dime depends on if you just found it in a phone booth.

  **(Pause, lean in slightly, with a knowing smile)** And honestly? Looking back on Professor Kessler’s four decades right here in the heart of academia… I think she might have inadvertently conducted the *ultimate* situationist experiment. Think about it!

  **(Build the joke here - the core)**
  *   **The Setup:** The tenure track? That’s not just a career path; it’s a meticulously designed series of high-pressure situations: gruelling hiring committees probing your every flaw, the nail-biting suspense of promotion letters, navigating the sometimes-treacherous waters of departmental politics, referees who seem to miss the point *spectacularly*, the constant demand to publish or perish…
  *   **The Punchline:** If the situationists are right, and our behaviour is *that* easily swayed by context, then forty years inside the academic pressure cooker should have turned *anyone* into a puddle of expediency, self-interest, or at the very least, perpetual grumpiness! It’s practically a laboratory designed to *disprove* the existence of stable character virtues!

  **(Shift tone from humorous to deeply sincere)**
  But here’s the beautiful thing, the thing that speaks volumes more than any lab experiment ever could: **It didn’t work on Professor Kessler.**

  Through all of it – the high-stakes evaluations, the bureaucratic hurdles, the intellectual battles (including those early 2000s skirmishes defending character itself!) – a core set of qualities in Professor Kessler didn’t just survive; they shone. They became her defining features, visible to students, colleagues, and yes, even deans.

  *   **Her intellectual integrity** wasn't just for the seminar room when things were easy; it was unwavering when defending unpopular ideas or challenging powerful arguments.
  *   **Her genuine kindness** wasn't reserved only for sunny days and easy students; it extended to anxious first-years, struggling colleagues, and even that visiting speaker whose question was… less than coherent.
  *   **Her fairness** wasn't situational; it guided her teaching, her mentorship, and her service, even when the easier path might have been to play favourites or cut corners.
  *   **Her commitment to her students** wasn't conditional on our brilliance (thank goodness!); it was a constant, whether we were soaring or needed help picking up the pieces of a disastrous draft.

  **(Connect back to the theme warmly)**
  So, while the psychologists might point to the seminary student rushing past the injured man, or the person who kept the found dime, we – her students, her colleagues, her friends – we point to *her*. To forty years of evidence gathered not in a controlled lab, but in the messy, demanding, often adversarial real-world laboratory of academic life. And the data is overwhelming: **Her virtue wasn't just theoretical; it was robust. It was real. It was tested daily, and it held true.**

  **(Focus on the person & legacy)**
  Professor Kessler, you didn’t just write about character; you embodied it. You showed us, through decades of consistent action across countless challenging situations, what intellectual courage, unwavering kindness, and deep integrity actually look like in practice. You built a legacy not just of brilliant scholarship, but of profound decency. You made this department, and the lives of everyone you taught and worked with, significantly better.

  **(Raise glass)**
  So, let’s raise our glasses. Not just to a stellar career, but to the remarkable, consistent, truly *virtuous* person behind it. To Professor Kessler: May your retirement be filled with all the joy, peace, and fascinating new situations (hopefully involving more beaches and fewer committee meetings!) that you so richly deserve. Thank you for everything.

  ---

  **Why this works:**

  1.  **The Joke Lands:** The core joke ("academia as the ultimate situationist test") is genuinely funny for philosophers (who recognize the studies and the pressures) and accessible enough for family (they get that academia is tough and appreciate the hyperbole).
  2.  **Informed Insider Nods:** References to "situationist critiques," "early 2000s skirmishes," "Harman and Doris," "intellectual battles," and concepts like "robust" virtue are there for the philosophers without needing explanation. The studies are named in a way that non-experts grasp the gist (rushing past someone in need, keeping found money).
  3.  **Universal Warmth:** The focus shifts decisively to Professor Kessler's *enduring personal qualities* (integrity, kindness, fairness, commitment) demonstrated *through* those tough situations. This is what family and friends connect with.
  4.  **Not Two Speeches:** The situationist critique isn't a separate topic; it's *used* as the *lens* through which to view and praise her *character* and *career*. The punchline isn't the philosophy; it's *her*.
  5.  **Structure:** Setup (Character matters) -> Challenge (Situationists say situations rule) -> Joke Setup (Academia = Hostile Lab) -> Joke Punchline (It should have broken her!) -> Sincere Turn (But it didn't! Look at her qualities!) -> Evidence (List of virtues demonstrated consistently) -> Conclusion (Legacy of decency & scholarship) -> Warm Toast.
  6.  **Respectful & True:** It honours her life's work by showing its real-world manifestation in *her*, without being a dry lecture. It lands on warmth, appreciation, and admiration.
