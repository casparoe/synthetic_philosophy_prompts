answer: |-
  ## The Laboratory of Your Lives  
  *(Commencement Address for the Liberal Arts Laboratory)*  

  Good morning. It’s an honor to be back at this place that shaped me – a place unafraid to call itself a “laboratory in democracy.” And congratulations, Class of [Year]! You’ve earned this moment.  

  Now, I confess: I said yes to this speech before truly considering how hard it is. Hard because I know what this college values. It’s the place that handed me John Dewey’s *The Public and Its Problems* as a bewildered first-year and whispered, *"Figure this out, it matters."* Hard because today, standing before you and your families – most of whom have likely never cracked a page of Dewey – I feel the weight of that book’s central question: **How do we find our way together when the world feels too complex, too fragmented, too big to grasp?**  

  You don’t need me to tell you the world feels unsettled. You’ve lived it – through screens, through crises, through the sheer velocity of information. A century ago, a brilliant observer of public life looked at a similarly bewildering, industrializing world and declared, essentially: *It’s over. The problems are too technical, too distant. Ordinary people can’t possibly understand enough to govern themselves. Honesty demands we hand the reins to the experts, the insiders, the specialists.* It was a powerful, pessimistic argument: democracy, in its old form, was obsolete.  

  **John Dewey heard that argument. He didn’t dismiss it.** He looked at the same fractured, confused public, adrift in a sea of indirect consequences, and said: *Yes. This is the problem. The public isn’t incompetent by nature; it’s eclipsed. It can’t find itself, can’t organize itself under these conditions.*  

  **But Dewey’s response wasn’t surrender to the experts.** It wasn’t, “Oh well, guess we need philosopher-kings.” His response was radical in its insistence: **The answer isn’t to replace the public, but to rebuild the conditions *for* the public.** The remedy, he argued, lies in better tools for communication, deeper forms of social inquiry, and crucially, creating spaces – like vibrant local communities – where people can actually *encounter* the consequences of their shared life and reason together about them.  

  This isn’t just civics. This is how Dewey believed we *know* anything. He saw knowledge not as a vault of eternal truths guarded by experts, but as an ongoing experiment. Picture it: You face an **unsettled situation** – confusing, uncertain. You form a **hypothesis** – a guess about what’s wrong or what might work. You test it, look at the **consequences**. You talk, argue, observe. Slowly, painstakingly, you move towards what he called **“warranted assertibility”** – not absolute, final certainty, but the best, most tested judgment you can make *right now*, based on the evidence and the conversation. And then? You stay open. The next piece of evidence might unsettle it again.  

  **This, graduates, is where your education meets your life, and where democracy meets your daily choices.**  

  For four years, this campus *has* been your laboratory. That seminar debate where the text suddenly clicked? That group project that nearly imploded until you truly *listened*? That research paper where your first thesis collapsed under the evidence, forcing you to rebuild? These weren’t just academic exercises. They were practice runs in **Deweyan inquiry.** You were working through unsettled situations – intellectual ones – forming hypotheses, testing consequences, arriving (sometimes messily) at warranted assertibility.  

  **Now, look ahead.** The next phase of your life will be filled with profoundly personal unsettled situations: What career path? Where to live? What relationships to nurture? How to live meaningfully in this complex world?  

  **Here’s the connection I urge you to make:** The method you’ve practiced here isn’t confined to politics or philosophy papers. **It’s the same experimental method your life now demands.**  

  *   Facing a career choice? Don’t wait for a lightning bolt of absolute certainty. Treat it as an unsettled situation. Form a hypothesis: *"Working in X field might align with my values and skills."* Test it – intern, talk to people *doing* the work, volunteer. Look at the consequences – on your time, your spirit, your community. Arrive at a warranted assertibility. And stay open. The test might change the hypothesis.
  *   Navigating a difficult conversation with someone you love? It’s an unsettled situation. Your hypothesis: *"Saying Y might help them understand."* Test it. Listen to the consequences – their reaction, your own feelings. Adjust. Seek a shared warrant, however tentative.
  *   Feeling overwhelmed by a national crisis or a local injustice? Remember: the public isn’t a monolith you join perfectly formed. Dewey’s public emerges *through* inquiry and communication. Start where you are. Find others grappling with the same unsettled situation. Form hypotheses about action *together*. Test small interventions. Look at consequences. Build warranted assertibility collectively. This is the slow, unglamorous work of making a public capable of self-government.  

  **Am I standing here claiming Dewey’s solutions are easy? That vibrant local communities and uncorrupted communication are simple to build in our digital, fragmented age?**  
  No. I share the doubt. The conditions Dewey hoped would restore the public are under immense strain. The "laboratory" feels more complex than ever.  

  **But that doubt isn’t an endpoint; it’s the starting gun for your inquiry.** Dewey didn’t offer naive uplift. He offered a **method** – a way of working through the doubt, the complexity, the uncertainty, *together*. He offered the radical faith that people, given better tools and better conditions to communicate and inquire, *can* become competent to shape their shared fate.  

  So, graduates, as you leave this laboratory, carry this with you:  

  **Your life is your next great experiment.** Your unsettled situations – personal, professional, civic – are not signs of failure. They are the essential terrain. Approach them not with a demand for final certainty, but with the courage to form hypotheses, the honesty to test them, the humility to listen to consequences, and the patience to build warranted assertibility, step by step.  

  **Democracy isn’t just something we have; it’s something we *do*, every day, in how we navigate our own uncertainties and engage with others in theirs.** It lives not in the grand pronouncement, but in the next honest conversation, the next considered action, the next willingness to test an idea against the world.  

  Your education hasn’t given you answers to hold onto forever. It’s given you a method to navigate the unanswerable. Trust that method. Practice it in your choices. Apply it to rebuilding the connections that make a public possible.  

  The laboratory isn’t just this campus. It’s the world you’re entering. And the experiment – the grand, difficult, necessary experiment in figuring out how to live well together – desperately needs your disciplined curiosity, your courage to question, and your commitment to working through the unsettled situation, together.  

  Go conduct your experiment. We need it. Congratulations.
