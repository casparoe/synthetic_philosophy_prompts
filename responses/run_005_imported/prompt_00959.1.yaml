  ## Rehabilitating the "Prior View": Aumann's Common Prior and Savage's Subjectivism in Harmony

  Gul's critique of Aumann's correlated equilibrium derivation hinges on a perceived conflict between the "prior view" of the Common Prior Assumption (CPA) – where players share identical prior beliefs *over the entire state space, including their own future actions* – and Savage's personalist/subjectivist conception of probability. Gul argues that requiring players to share identical beliefs about their *own* future choices at a hypothetical "prior stage" is psychologically implausible and fundamentally contradicts Savage's tenet that equally informed, rational individuals can hold different subjective probabilities. While Gul raises a valid concern about psychological realism, his argument misinterprets the *formal and normative* role of the CPA within Savage's framework. The "prior view" can be coherently defended as consistent with Savagean subjectivism. Here's why:

  1.  **Savage's Core Tenet: Coherent Beliefs, Not Mandatory Disagreement:**
      Savage's personalism establishes that probability is a measure of an *individual agent's* coherent, preference-based degrees of belief given their information. Crucially, **Savage does *not* assert that equally informed rational agents *must* disagree.** He merely establishes that it is *possible* and *rational* for them to do so. His framework provides the *rules* for coherent belief formation and updating (conformity with the probability axioms, Bayesian updating), but it does not dictate the *specific content* of those beliefs, except as constrained by logic and evidence. The CPA is a *substantive assumption* about the *content* of beliefs at a specific hypothetical point (the "prior stage"), not a violation of Savage's rules. It posits that, in the specific context being modeled, the agents *do* happen to share the same prior. This is entirely compatible with Savage, as his framework allows for shared priors just as it allows for divergent ones; it simply doesn't *force* shared priors.

  2.  **The "Prior Stage" as a Modeling Abstraction, Not a Temporal Claim:**
      Gul's objection regarding psychological implausibility ("players holding identical beliefs about player 1's own future move") mistakes the *model* for reality. The "prior stage" in Aumann's derivation is **not a literal, historical moment** where players contemplate their future choices. It is a *formal modeling device* representing the state of knowledge *before* the agents receive their private information (correlating devices, signals, etc.). At this hypothetical point, by assumption, they possess no differentiating information. Within the model's logic:
      *   **Players are Represented as Distinct Decision Nodes:** The player at the "prior stage" and the player making the choice later are formally distinct entities within the model's extensive form. The prior represents the beliefs of the *ex ante*, uninformed agent about the entire future state of the world, including the actions chosen by their *future, informed self* and others. This is no more problematic, in principle, than assigning probabilities to any other future event involving agents (e.g., "What is the probability the CEO will announce a merger tomorrow?").
      *   **Coherence Over Time:** Savagean rationality requires an agent's beliefs to be coherent *at any given point in time* given their current information. The prior represents the agent's coherent beliefs *at t0*. When the agent reaches t1 and makes their choice, they have new information (their signal, their deliberation) and update their beliefs accordingly. The prior at t0 *about* their choice at t1 is simply their best assessment *at t0*, based on their understanding of the game structure, their own potential reasoning process, and the potential signals. It is not a prediction they are bound to fulfill, but a probabilistic assessment made under uncertainty. The requirement is that beliefs *at each stage* are coherent *given the information at that stage*.

  3.  **Modeling Uncertainty About One's Future Self:**
      Savage's framework readily accommodates uncertainty about one's own future actions, preferences, or even identity (e.g., the "problem of the absentminded driver"). An agent can rationally assign probabilities to propositions like "I will choose A" at a future decision node. This probability reflects their current assessment of the factors that will influence their future choice – the signals they might receive, their future beliefs about others, their own potential reasoning errors, or even unresolved internal conflict. The CPA simply asserts that, in the specific game being modeled, two agents, lacking any differentiating information at t0, form the *same* coherent assessment about the entire future play of the game, including each other's *and their own* future choices. This shared assessment is part of the *model's specification* of the agents' initial epistemic state.

  4.  **The CPA as a Consistency Condition on Hierarchies of Belief:**
      The CPA, especially in its "prior view" interpretation, is fundamentally a powerful **consistency condition on the players' hierarchies of beliefs** (beliefs about beliefs, etc.) at the ex ante stage. It ensures that all differences in beliefs later on stem *only* from differences in the private information received, not from fundamental differences in prior interpretation of the world. Savage's framework provides the *logic* for how beliefs should be updated *given* a prior and new information. The CPA specifies a particular *structure* for the prior (commonality) and the information partition. This structure ensures that the players' posterior beliefs (and hence their rational choices) are correlated in a way that can support an equilibrium. It doesn't violate subjectivism; it leverages the logic of subjectivism within a specific, highly structured informational context to derive a powerful solution concept.

  5.  **Addressing the "Antithetical" Charge:**
      Gul claims the CPA is "antithetical" to Savagean subjectivism because Savage allows rational disagreement. However, this mischaracterizes the CPA's role:
      *   **CPA is Context-Specific:** It applies to a specific, highly structured interactive decision problem (a game) with defined rules and information flows. It is not a universal claim about all rational agents in all situations. Savage allows disagreement *in general*; the CPA posits agreement *in this specific modeled scenario* due to the hypothetical absence of differentiating information.
      *   **CPA is About Modeling Structure, Not Psychological Dictate:** It is a modeling assumption chosen by the theorist to analyze the epistemic foundations of correlated outcomes in games. Its purpose is to isolate the effect of asymmetric information *given* shared fundamental expectations. Savage provides the tools for belief representation and updating; the CPA uses those tools to build a particular model of interdependent reasoning.

  **Conclusion:**

  While Gul rightly highlights the psychological oddity of players literally sharing identical beliefs about their own future choices, this critique targets the *psychological interpretation* of a *formal modeling construct*. The "prior view" of the CPA is best understood not as a claim about players' introspective psychology at a real prior time, but as a rigorous formal device within Savage's subjectivist framework. It represents a hypothetical state of symmetric ignorance where rational agents, by the *modeler's assumption*, share a common, coherent prior probability measure over the entire state space, including descriptions of their own future informed choices. This assumption is consistent with Savage because:

  1.  Savage allows for shared priors as a possibility.
  2.  Savage permits agents to hold probabilistic beliefs about their own future actions as part of a coherent ex ante state.
  3.  The "prior stage" is a formal representation of initial symmetric uncertainty, not a claim about temporal psychology.
  4.  The CPA serves as a powerful consistency condition on belief hierarchies, leveraging Savage's logic to derive results about correlated rational play.

  Therefore, far from being antithetical to Savagean subjectivism, Aumann's "prior view" CPA can be seen as a sophisticated *application* of it, providing a formal foundation for understanding how correlated equilibrium emerges from common rationality, common priors over the world (including future actions), and asymmetric information. Gul's objection conflates the model's formal structure with an implausible psychological narrative, overlooking the normative and abstraction-based nature of both Savage's probability and Aumann's equilibrium concepts. The "prior view" remains a valid and Savage-consistent foundation for analyzing correlated equilibrium.
