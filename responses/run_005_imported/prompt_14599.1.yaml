prompt: |-
  So in my philosophy of language seminar we're going through the Kripkenstein rule-following stuff (Kripke's book on Wittgenstein) and I think I've got the basic plus/quus setup down, but im not really seeing why its supposed to be such a deep problem. Like ok, I've only ever added finitely many numbers so I can't be totally sure I mean plus and not some deviant quus function that agrees with plus on everything so far. But couldnt I just get a computer to crunch through way more cases, like trillions of them, and use that as really strong evidence that I actually mean plus? Isn't this basically just a problem-of-induction type worry that gets weaker the more data you pile on, rather than some permanent unsolvable paradox? Why does Kripke think throwing more computation at it wouldn't settle the question at all?
