answer: |-
  ## Death at the Gate: A Dialogue on Damascus

  **Setting:** The ancient stone gate of Damascus. Dust hangs in the air. A terrified man (OMAR) stands frozen, eyes darting between the dusty road to Aleppo and the darkening city behind him. Two figures stand beside him, deep in discussion – DR. ELARA FINCH (sharp, intense, gestures decisively) and DR. SILAS VANCE (calm, analytical, speaks with quiet precision). Both are causal decision theorists.

  **ELARA:** (To Omar, firmly) Don't move yet. Not until we settle this. Silas, the causal calculus is undeniable: conditional on Omar fleeing, Death is predicted to be in Aleppo, making fleeing causally *worse* than staying. Conditional on staying, Death is predicted to be in Damascus, making staying worse. Neither pure act is ratifiable! Each choice looks *worse* than the alternative *precisely* because he's considering *making* it. This instability *demands* resolution. He *must* randomize. Fifty-fifty. Only then does the causal expected utility calculation stabilize. Only then is his plan immune to this self-undermining loop.

  **SILAS:** (Nodding slowly) I agree entirely on the causal structure and the unratifiability of the pure acts. Where I diverge, Elara, is in your leap from that diagnosis to the *prescription* of randomization. Causal Decision Theory (CDT) gives us the causal expected utility *given the act*. For fleeing, it's low because Death predicts the flee and goes to Aleppo. For staying, similarly low. The calculations are symmetric. CDT outputs a tie. Why isn't that the end of the story? Why impose an *additional* requirement – ratifiability – that CDT itself doesn't inherently demand? Demanding ratifiability here smuggles in the idea that Omar *should* update his credences about Death's location *based on his own tentative choice*. But CDT explicitly forbids that! His choice doesn't *cause* Death's location; the prediction does. Updating *on the choice itself* is precisely the evidential move CDT rejects.

  **ELARA:** (Leans forward) Because the unratifiability *reveals* a flaw, Silas! It shows that committing to either pure act creates a situation where, *from the perspective of having chosen it*, he sees the other act as causally better! That’s instability! CDT tells him *at the moment of choice* that fleeing is best *if* he were to stay, and staying is best *if* he were to flee. This isn't just a tie; it's a *disequilibrium*. Randomization resolves it. When he commits to a 50/50 mix, *then* the causal calculation *conditional on that mixed strategy* gives both options the *same* causal utility – and crucially, that utility is higher than the utility he *would* get from either pure act *given that he's using the mix*. The mixed strategy *is* ratifiable.

  **SILAS:** But you're privileging the perspective *after* choice. CDT is about choosing *an act* based on its causal consequences. Omar hasn't chosen yet. He's evaluating options. From the *pre-choice perspective*, fleeing and staying have symmetric, low causal utilities. Tied. Done. Your "disequilibrium" only arises if you illicitly step into the shoes of someone who has *already chosen* one act and then evaluates the *other* act from that vantage point. But why should Omar do that? He hasn't chosen! CDT tells him, pre-choice: "Fleeing causes bad outcome. Staying causes bad outcome. Equal badness. Pick arbitrarily."

  **ELARA:** Arbitrarily? But if he arbitrarily "picks" fleeing, what happens? The moment he settles on fleeing, his evidence shifts – he *knows* he's fleeing. Updating on that evidence (even though CDT technically forbids it *as part of the calculation*, the *fact* of his decision exists!) tells him Death will be in Aleppo, making staying look better. This creates psychological and rational pressure to switch! The only way to *avoid* this pressure, to make a commitment he won't regret *from the perspective of that commitment*, is to randomize. The coin flip isn't just a tie-breaker; it's a commitment device against this corrosive self-doubt.

  **SILAS:** Ah, but there's the rub, Elara. You keep invoking "updating on the choice." But CDT *doesn't do that*. Omar, as a causal decision theorist, *shouldn't do that* when calculating utilities. He should fix his credences *before* he chooses, based on his background knowledge. Death is a perfect predictor. Omar knows this. His credence that Death will be in Aleppo *if he flees* is 1, because fleeing is perfectly correlated with Death predicting fleeing and going to Aleppo. Similarly, credence Death in Damascus *if he stays* is 1. These are fixed by the setup, *independent* of any tentative leaning. He doesn't need to "update" mid-thought. The causal utilities are fixed and tied from the start. Randomization adds nothing but unnecessary complexity.

  **ELARA:** Complexity? It adds *stability*! And you haven't answered my point: if he arbitrarily picks fleeing, won't he *then* see staying as causally better? How does CDT advise him *then*? Does it say "Stick with fleeing"? But that seems perverse when staying *now* looks better! Or does it say "Switch to staying"? But then the same thing happens! Randomization cuts this Gordian knot. As for Death predicting the coin flip... (She gestures dismissively) So what? If he randomizes 50/50, Death predicts that. Death goes to Aleppo 50% of the time, Damascus 50% of the time. Omar's survival chance is 50% *regardless* of whether he flees or stays *after* the coin flip, because his action is now *independent* of Death's prediction. Crucially, *conditional on having committed to the mixed strategy*, both pure acts *now* have a causal utility of 0.5 (survival chance), which is *higher* than the 0 utility he gets under either pure strategy when committed purely. The mix *is* causally ratifiable.

  **SILAS:** You're conflating perspectives again. *After* he commits to the mix and flips the coin, *then* he chooses a pure act based on the flip. But *at the moment he decides to randomize*, what is the causal utility *of the mixed strategy itself*? CDT evaluates *acts*. The mixed strategy is the act "Flip a coin, then go to Aleppo if Heads, Damascus if Tails." What is its causal utility? Death predicts *this specific plan*. If she predicts he will randomize and flee on Heads, she knows the outcome of the coin flip he will use! She goes to Aleppo if Heads is flipped, Damascus if Tails is flipped. When Omar executes the plan, he dies regardless. The causal utility of the mixed strategy is *zero*, same as the pure acts! Randomizing buys him *nothing* if Death predicts the randomizer. The tie remains. Omar can simply pick arbitrarily without the coin and get the same outcome.

  **ELARA:** (Pauses, then counters fiercely) Not so fast. You assume Death predicts the *outcome* of the coin flip. But does she? She predicts *choices*. The mixed strategy *is* the choice. It's the choice to outsource the final decision to a random device. Death predicts *that Omar will employ this randomizing device*. She therefore knows he will end up in Aleppo 50% of the time. Her optimal response is to also randomize 50/50. Now, Omar's *survival probability*, *caused by his choice of the mixed strategy*, is 50%. Because his location and Death's location are now independent. Crucially, *conditional on Omar choosing the mixed strategy*, the causal utility of *this specific mixed strategy* is 0.5. It is *ratifiable* – he sees no reason to switch to a pure strategy, as each would yield 0 utility *given his commitment to randomizing*. The instability is gone. The pure strategies weren't true options precisely because they weren't ratifiable endpoints.

  **SILAS:** But Elara, your 50% survival hinges on Death randomizing in response. Why would she? She's a perfect predictor, not an expected utility maximizer playing a game. If Omar chooses the mixed strategy, she *predicts the outcome* – she knows *which city he will end up in* because she knows the coin flip result *in advance*. She goes there. Survival chance: 0%. Same as pure acts. If she *can't* predict the coin flip outcome (a big if!), then perhaps you get 50%. But CDT, strictly applied, evaluates the causal consequences of the *act* chosen. The act "Randomize 50/50" leads to Death predicting that act and then... what? The causal chain is murky. CDT, focused on the *choice*, might still just see symmetric doom. The elegance of the pure tie is that it requires no assumptions about how Death handles randomizers. Omar faces two causally identical doors to death. He can walk through either. Adding a randomizer doesn't change the causal landscape defined by prediction; it just adds a layer of self-deception about where the blade will fall. The rational output of CDT is a tie. The rest is psychology, not decision theory.

  **(Omar looks between them, more confused than ever, as the shadow of the gate lengthens.)**
