answer: |-
  You've captured Gould and Lewontin's core critique beautifully, and your group member's objection highlights a crucial tension. Let's dissect this dispute and refine your heuristic into a more robust methodological principle.

  ### Resolving the Dispute
  1.  **Your Position (Burden Shifting is Remedial):** You are fundamentally correct that Gould and Lewontin's primary target was the *uncritical acceptance* of adaptationist explanations as the *default and sufficient* explanation. Their critique exposed a methodological flaw: the lack of serious consideration for non-adaptive alternatives and the ease of constructing unfalsifiable "just-so" stories. Shifting the burden of proof *is* the natural remedy for this specific bias. It forces adaptationists to do the rigorous work they often skipped.

  2.  **Your Group Member's Objection (Risk of Inversion):** This objection has *some* validity but is ultimately "too quick" as you suspect. The risk isn't that shifting the burden creates a *symmetrical* error (assuming everything is non-adaptive would be equally dogmatic), but rather a *procedural* one:
      *   **Risk 1: Stifling Inquiry:** An overly strong "non-adaptive by default" rule could discourage researchers from even *investigating* potentially valid adaptive hypotheses.
      *   **Risk 2: Misrepresenting G&L:** Gould and Lewontin weren't arguing that *most* traits are non-adaptive spandrels. They argued that biologists *must consider the full range* of evolutionary explanations (constraint, drift, pleiotropy, spandrels, *and* adaptation) and not privilege adaptation *a priori*. Their goal was pluralism, not simply swapping one monism for another.
      *   **Risk 3: Oversimplifying "Non-Adaptive":** "Non-adaptive byproduct" encompasses a wide range of possibilities (developmental constraint, physical constraint, pleiotropic effect, genetic drift, exaptation precursor). Treating it as a single default category might obscure important distinctions.

  3.  **The Core Insight:** The key methodological flaw G&L identified wasn't just *favoring* adaptation, but **failing to test adaptationist hypotheses against plausible non-adaptive alternatives.** Shifting the burden directly addresses *this specific failure mode* by demanding that adaptationists *do* this testing work.

  ### Sharpening the Heuristic: From Default to Methodological Imperative
  Instead of a rigid "default assumption," frame it as a **methodological rule emphasizing burden of proof and hypothesis testing**. Here's a refined principle you can apply:

  **The Adaptationist Scrutiny Principle (ASP):**

  1.  **Presumption of Complexity:** For any observed trait, especially complex behavioral/cognitive ones in evolutionary psychology, the initial working stance should be that its evolutionary origin and current utility are *not self-evident* and likely involve complex interactions of selective pressures, constraints, and historical contingencies. *Assume complexity, not simplicity.*

  2.  **Burden of Proof on Adaptationist Claims:** Any claim that a trait is a direct product of natural selection *for its current specific function* (an adaptation in the strict sense) bears a **significant burden of proof**. This burden is *not* discharged by a plausible-sounding narrative alone.

  3.  **Mandatory Consideration of Alternatives:** A credible adaptationist hypothesis **must explicitly consider and attempt to falsify** the most plausible non-adaptive alternatives relevant to the case. These include:
      *   **Developmental/Structural Constraint:** Is the trait a necessary consequence of growth patterns or physical laws?
      *   **Pleiotropy/Genetic Correlation:** Could the trait be a side effect of selection on a genetically correlated trait?
      *   **Drift:** Could the trait's fixation/persistence be explained by random processes?
      *   **Exaptation/Co-option (a special case):** Is the trait a byproduct ("spandrel") or vestige that was later co-opted for its current use? *(Note: This is crucial. G&L's spandrels are often *not* functionless; they are *architectural necessities* that *become available* for later co-option. Your current use might not reflect the original reason for the trait's existence).*
      *   **Phylogenetic Inertia/History:** Is the trait best explained as a legacy from an ancestor, rather than a recent adaptation to the current environment?

  4.  **Criteria for Credible Adaptationist Claims:** To meet its burden, an adaptationist hypothesis should provide evidence addressing most of the following:
      *   **Specificity:** Does the trait show complex, specialized design *specifically* suited to solving a proposed adaptive problem? (Avoid "adaptive storytelling" about generic benefits).
      *   **Comparative Evidence:** Does the trait show predictable variation across species facing different selective pressures related to the proposed function? (Phylogenetic contrasts).
      *   **Developmental Evidence:** Is the trait developmentally robust and canalized in a way suggestive of past selection? Does developmental biology rule out key constraints?
      *   **Genetic Evidence:** Are there signatures of past selection (e.g., from population genetics)? Can pleiotropy be ruled out or disentangled?
      *   **Falsifiability:** What evidence *would* disprove the adaptive hypothesis? Can predictions derived from the hypothesis be tested (and potentially falsified) against the non-adaptive alternatives?
      *   **Avoid Presentism:** Does the hypothesis consider the likely environment of evolutionary adaptedness (EEA), not just the modern context? Is the proposed function plausible *in that specific past environment*?

  ### Applying the ASP to Evolutionary Psychology (EvPsych)
  EvPsych is particularly vulnerable to G&L's critique. Apply the ASP rigorously:

  1.  **Encounter Claim:** "Trait X (e.g., jealousy, specific mate preference, cheater detection module) is an adaptation for function Y."
  2.  **Apply ASP:**
      *   **Burden:** Immediately ask: "What specific, rigorous evidence meets the burden of proof outlined above? How have plausible non-adaptive alternatives been ruled out?"
      *   **Scrutinize Specificity:** Is the trait *really* that specific? Is the proposed function sufficiently precise? (e.g., "jealousy" is vague; "mate retention behaviors triggered by cues of infidelity risk" is more specific).
      *   **Demand Comparative Data:** Where is the cross-species evidence? Humans aren't an evolutionary island.
      *   **Question Development/Genetics:** How does this trait develop? Are there known genetic correlates or constraints? Could it be a side effect of general cognition or emotion systems?
      *   **Check for Falsifiability:** What would disprove this? If the trait appears in contexts unrelated to Y? If it's absent where Y is a strong pressure? If it shows no heritability or specific developmental pathway?
      *   **Beware Presentism:** Is function Y plausibly linked to *fitness* in a Pleistocene environment, not just modern social dynamics? Is the EEA specified and justified?
      *   **Prioritize Alternatives:** Could X be a spandrel (e.g., a byproduct of general intelligence or emotional responsiveness)? A result of cultural evolution? Strongly influenced by drift in small ancestral populations? A pleiotropic effect?

  **Conclusion:** Your instinct to shift the burden is methodologically sound and directly addresses the core flaw Gould and Lewontin exposed. However, framing it as a rigid "non-adaptive by default" rule risks oversimplifying their nuanced call for pluralism and rigorous testing. The **Adaptationist Scrutiny Principle (ASP)** incorporates the essential burden shift while emphasizing the *mandatory consideration and testing* of non-adaptive alternatives as the hallmark of credible adaptationist science. This principle provides the concrete, actionable framework you need to critically evaluate claims in evolutionary biology and psychology, demanding the rigor Gould and Lewontin rightly insisted upon. It doesn't assume non-adaptation; it assumes *complexity* and demands *evidence* for adaptation.
