prompt: |-
  I write novels for a living, but I also co-host a tiny podcast about the ethics of fiction on the side (we record it in my kitchen, nothing fancy), and next week's guest is a scholar who's basically built her career on the claim that Rousseau's Letter to d'Alembert -- the one where he talks the Genevans out of building a theatre -- was never really just about actors on a stage. Her line, as best as I can reconstruct it from her papers, is that everything Rousseau says about live performance (the empty, self-congratulatory pity we're supposed to feel for people who aren't real, the way an actor's whole craft is counterfeiting a self he doesnt actually have) applies with basically equal force to novels, and that anyone who thinks he exempted the page just hasn't followed the argument to the end. Which, obviously, makes me a little defensive going in, since it's my own trade on trial here, and I don't want her getting an easy hour where she just restates the thesis in slightly different words each time.

  Could you help me put together nine or ten questions for the interview? I want at least one that goes after the pity/catharsis bit specifically -- whether crying over a character on the page is really the same empty kind of feeling Rousseau thought stage-pity was, or whether reading alone changes the calculation -- with a follow-up ready for whichever way she answers. I want one on the "actor as liar" argument, pressing on whether that charge even makes sense leveled at somebody alone at a desk rather than a body performing live in front of people. I want one that forces her to deal with Rousseau's own contradiction here -- the man wrote a hit opera and at least one comedy himself, so I assume she's got a rehearsed move for that, and I'd like the question built so the rehearsed move is visible rather than sliding by unnoticed. And I want one that takes his bit about Geneva's citizens turning from participants into passive spectators and makes her apply it to someone bingeing eight episodes alone on a couch, since "passive spectator" seems to fit that a lot better than it ever fit a room of actual Genevans watching a play together. Add a couple more if there's an obvious thread I'm leaving out, but for every question give me a one-line note on the dodge she's likely to reach for and how the follow-up should shut it down.
reasoning: |-
  Okay, let's tackle this user's request. The user is a novelist and co-host of a podcast about the ethics of fiction. They're preparing for an interview with a scholar who argues that Rousseau's critique of theater in "Letter to d'Alembert" applies equally to novels. The user needs incisive questions to challenge the scholar's thesis and prevent her from repeating rehearsed arguments. 

  First, I need to understand the core of the scholar's argument: Rousseau's concerns about theater—fake pity, actors as liars, passive spectatorship—extend to novels. The user wants to expose weaknesses in this analogy. Key angles to cover: the private nature of reading vs. public performance, Rousseau's own literary contradictions, and whether novels inherently create passivity.

  The user specified four must-cover topics: pity/catharsis differences in reading vs. theater, the "actor as liar" charge applied to writers, Rousseau's hypocrisy in writing fiction, and passive spectatorship in modern binge-watching. I should add questions about moral corruption and Rousseau's potential exceptions for text. 

  For the pity question, the scholar might argue emotional response is identical regardless of medium. The follow-up should press on how solitude changes self-awareness. For the "liar" charge, she may conflate performance with creation. The counter should distinguish crafting a persona from deceiving an audience in real time. On Rousseau's contradictions, she'll likely dismiss his fiction as failed experiments. The follow-up must note their publication and his later justifications. For passivity, comparing communal theater to isolated streaming highlights her overextension of Rousseau's communal concerns.

  I'll add two more angles: moral harm (since Rousseau feared theater's social decay) and whether text's fixed nature reduces manipulation. The scholar might dodge by overgeneralizing; follow-ups demand specificity. Each question needs a trap for her go-to dodges—like forcing her to admit Geneva's context doesn't map to modern media. 

  The user's defensiveness is understandable; their livelihood is implicated. The questions must reframe the debate to novels' unique traits. Tone should be rigorous but respectful to keep dialogue productive. Finally, structuring questions to build logically from emotional response to societal impact will make the interview cohesive.
answer: |-
  Here are 9 sharp questions designed to challenge the scholar's thesis, expose potential dodges, and force engagement with the unique aspects of the novel form. Each includes a note on the likely dodge and a follow-up strategy:

  1.  **Core Thesis Press:**
      *   **Question:** "You argue Rousseau's critique of theatre's 'dangerous illusions' applies *equally* to novels. Could you pinpoint *the exact passage or logical step* in the *Letter* where Rousseau explicitly extends his condemnation of *live performance* – with its embodied actors, immediate audience reaction, and public gathering – to the solitary act of reading a printed narrative?"
      *   **Likely Dodge:** Vague reference to "the logic of the argument," "implicit extension," or "principles applicable to all fiction."
      *   **Follow-Up:** "But isn't Rousseau meticulously specific about the *mechanisms* of theatre's corruption – the actor's dissembling *body*, the contagious *collective* emotion of the *assembled* crowd? If the novel lacks these specific mechanisms (solitary reader, no performing body, no live audience), doesn't the *burden of proof* fall on showing how the *same* corruption occurs through *fundamentally different means*?"

  2.  **Pity/Catharsis (Solitary vs. Collective):**
      *   **Question:** "Rousseau condemns theatrical pity as 'barren' and self-congratulatory because it's felt collectively *in public* for *fictional* beings, replacing real action. Is the pity felt by a reader *alone*, immersed in a novel's internal world, truly the *same phenomenon*? Doesn't the solitude and inward focus of reading potentially create a more reflective, less performative emotional engagement?"
      *   **Likely Dodge:** "The object is still fictional, so the emotion is equally 'false' and morally useless."
      *   **Follow-Up:** "But Rousseau's key concern was the *public performance* of emotion replacing civic duty. If a reader weeps *privately* over a character, then closes the book and *goes to help a neighbor*, has the novel truly engendered the same 'barren' passivity he feared from the theatre crowd? Isn't the potential for *subsequent* action structurally different?"

  3.  **The "Actor as Liar" Charge (Desk vs. Stage):**
      *   **Question:** "Rousseau attacks the actor for 'counterfeiting a self he doesn't have' *live* for an audience. How does this charge map onto a novelist *at their desk*? The novelist crafts a *written narrative*, not a performed persona. Isn't the accusation of *personal* dissembling, central to his actor critique, fundamentally misapplied to the authorial act of *fictional creation*?"
      *   **Likely Dodge:** "The novelist is still 'lying' by creating falsehoods/presenting non-realities as compelling."
      *   **Follow-Up:** "But Rousseau specifically attacks the actor's *moral corruption* through the act of *publicly performing* falsehood *as themselves* in real-time. Does writing 'Emma Bovary felt...' carry the same *personal* ethical weight for the author *as an individual* as an actor *embodying* Hamlet night after night? Isn't the nature of the 'lie' and its impact on the *creator* categorically different?"

  4.  **Rousseau's Hypocrisy/Contradiction (Le Devin & Narcisse):**
      *   **Question:** "Rousseau wrote *Le Devin du Village* (a hit opera) and *Narcisse* (a comedy). If his critique of fiction is truly universal and damning, how do you reconcile this with his *own* creation of the very forms he ostensibly condemns? Was he simply a hypocrite, or does this suggest his target was *specifically* the *institutionalized public theatre* and its social effects, *not* fictional representation *per se*?"
      *   **Likely Dodge:** "He later regretted them," "They were youthful errors," or "They prove the *power* of fiction's corruption, even on him."
      *   **Follow-Up:** "But he *published* them, even after developing his critiques. And his Preface to *Narcisse* explicitly defends the *comedy* while attacking the *theatre as an institution*. Doesn't this strongly indicate his target was the *social practice and context* of theatre (public spectacle, idleness, moral corruption of actors/audience), *not* the inherent evil of *inventing fictional narratives*? Doesn't his own practice suggest a distinction?"

  5.  **Passive Spectatorship (Couch vs. Genevan Assembly):**
      *   **Question:** "Rousseau feared the theatre would turn Genevan citizens from active participants into 'passive spectators.' How does the image of a modern reader bingeing a novel alone on a couch for hours *not* represent the *ultimate* form of passivity he decried – arguably far more isolated and sedentary than Genevans walking to a public playhouse and reacting collectively?"
      *   **Likely Dodge:** Conflating the two experiences under the broad umbrella of "spectatorship/consumption."
      *   **Follow-Up:** "But Rousseau's concern was about replacing *civic engagement* with *public diversion*. The isolated reader isn't avoiding a town meeting; they're alone. Doesn't this highlight that his critique was deeply tied to a *specific communal context*? Can we truly equate the passive consumption *within* a vibrant civic society (Geneva) with the isolated consumption common *outside* such a context today? Doesn't this difference weaken the direct application?"

  6.  **Moral Corruption Mechanism:**
      *   **Question:** "Rousseau argues theatre corrupts *because* it makes vice alluring through performance. Does the novel possess the same *immediate, sensual power* to corrupt through performance? Or is the mediation of text, requiring active imagination from the reader, a significant filter that potentially alters the mechanism of moral influence?"
      *   **Likely Dodge:** "Fiction can still depict vice alluringly and influence readers."
      *   **Follow-Up:** "Absolutely, but Rousseau's theatre critique hinges on the *combined* effect of the *live performer's charisma*, the *shared audience arousal*, and the *seduction of spectacle*. Does the solitary, imaginative act of reading generate moral danger through the *exact same mechanism*, or is it a *different psychological process* – one Rousseau might have viewed differently, perhaps even with more ambivalence (like his complex view of reading in *Emile*)?"

  7.  **The "End of the Argument" Challenge:**
      *   **Question:** "You contend that those who think Rousseau exempted the page 'haven't followed the argument to the end.' Could you walk us through that *final logical step*? Where does he explicitly state, or where does the *inevitable* logic *force* the conclusion that the *solitary, imaginative act of reading fiction* is morally equivalent to the *public, performative spectacle* of theatre?"
      *   **Likely Dodge:** Restating the core principles (falsity, emotion, passivity) and asserting they *must* apply universally.
      *   **Follow-Up:** "But principles are applied *to specific phenomena*. Fire burns, but we distinguish between a campfire and an arson attack. If Rousseau meticulously details the unique dangers of the *theatrical apparatus* (public gathering, live dissembling, spectacle), isn't assuming he *must* condemn the *novel* without addressing its distinct features (solitude, text, imagination) itself a failure to follow *his* argument rigorously? Isn't the burden to show he *did* take that step?"

  8.  **Potential Novel Exemption (Text vs. Performance):**
      *   **Question:** "Is there *any* aspect of the novel form – perhaps its reliance on the reader's *imagination* rather than sensory spectacle, or the *fixed nature of the text* versus the actor's variable performance – that you believe Rousseau *might* have seen as mitigating the dangers he associated with theatre, even if he didn't explicitly endorse novels?"
      *   **Likely Dodge:** Downplaying differences as insignificant to the core corruption.
      *   **Follow-Up:** "Given Rousseau's deep suspicion of *public opinion* and *performance for others* (central to the actor's sin), could the *privacy* of reading – where one isn't performing feeling for an audience – actually align *better* with his ideal of authentic sentiment than the communal theatre experience he condemned? Might the novel, ironically, be *less* susceptible to the 'empty pity' charge precisely because the emotion *isn't* performed publicly?"

  9.  **Modern Context & Your Stakes:**
      *   **Question:** "If Rousseau's critique *does* apply equally to novels, as you argue, what's the practical consequence? Should we view novelists, including Rousseau himself, as purveyors of dangerous illusions akin to the actors he despised? And in an age saturated with fictional narratives far beyond 18th-century Geneva, does this critique lead to a stance of radical suspicion towards all fiction, or is there a way to salvage ethical value within your interpretation of his argument?"
      *   **Likely Dodge:** Academic detachment ("I'm just interpreting Rousseau"), or vague talk about "critical engagement."
      *   **Follow-Up:** "But your interpretation has real stakes for how we value an entire art form. If Rousseau's logic *inevitably* condemns novels as morally corrosive illusions, doesn't that position force a very bleak view of literature's role in society? How do *you*, as a scholar engaging with fiction, reconcile this potential condemnation with your own work and the value you presumably find in textual narratives?"

  **Key Interview Strategy:**

  *   **Listen Aggressively:** Pay close attention to *how* she answers. Does she use vague terms like "fiction," "representation," "illusion" without distinguishing forms? Does she downplay Rousseau's specific theatrical mechanisms?
  *   **Control Definitions:** Politely but firmly push for precision. Ask her to define key terms (pity, passivity, corruption, spectacle) in Rousseau's context and for the novel.
  *   **Highlight Differences:** Constantly bring the focus back to the *material differences* between live public performance and solitary reading of text.
  *   **Use Her Words:** Quote her answers back to her in follow-ups to expose contradictions or vagueness.
  *   **Maintain Respect:** Keep the tone rigorous but collegial. The goal is a compelling debate, not an attack. Frame challenges as genuine attempts to understand the nuances of her argument and Rousseau's text.

  These questions force her to defend the *mechanism* of how theatre's specific corruptions translate to novels, confront Rousseau's own practice, and grapple with the implications of her thesis. Good luck with the interview – it sounds fascinating!
