  ## The Weight of Reflection: Why Non-Conservativeness Undermines Deflationism

  The non-conservativeness of natural truth theories – specifically, their ability to prove reflection principles like Global Reflection (GR) for the base theory *T* (∀x(Provₜ(x) → True(x))) – presents a profound challenge to deflationism about truth. While deflationists have mounted spirited defenses, I argue that the reflection result decisively reveals an inadequacy in the core deflationist thesis, demonstrating that truth, even when introduced via seemingly "logical" axioms, plays a more substantive role than deflationism allows. The deflationist responses, while insightful, ultimately fail to fully neutralize the force of the argument.

  **The Deflationist Rationale for Conservativeness**

  Deflationism's core tenet is that truth lacks substantive metaphysical or explanatory weight. "True" isn't a robust property tracking deep features of reality; it's a logical device enabling semantic ascent and descent (disquotation: True(⌜φ⌝) ↔ φ) and expressive generalization (e.g., "Everything the Pope says is true"). Consequently, adding a truth predicate to a base theory *T* (e.g., Peano Arithmetic, PA) should merely augment its expressive power concerning *truth itself* without altering its core commitments about the *non-semantic* world described by *T*'s original vocabulary. Conservativeness formalizes this: the truth-extended theory *T*+ should prove no new sentences in the original language of *T* that *T* alone couldn't prove. If *T*+ *were* non-conservative, proving some new arithmetical fact *σ* that *T* couldn't, this would suggest the truth predicate isn't merely expressive window dressing. It would imply that "true" interacts with the base theory in a way that uncovers *new information* about the non-semantic subject matter (arithmetic, syntax), contradicting the deflationist claim that truth is metaphysically and explanatorily inert.

  **The Challenge: Reflection and Non-Conservativeness**

  Shapiro and Ketland's insight cuts deep. When we add a truth predicate to PA, governed by compositional axioms (like Tarski's) and crucially, allow the *induction schema* to apply to formulas *containing* the truth predicate (yielding CT↾, or KF, or similar theories), the resulting theory becomes non-conservative. Crucially, it proves GR(PA): ∀x(Provᴘᴀ(x) → True(x)) – the statement that every theorem of PA is true. Why is this problematic?

  1.  **Non-Conservativeness Demonstrated:** GR(PA) is a sentence in the *extended* language (it contains 'True'). However, its *arithmetical consequences* are devastating. GR(PA) implies Con(PA), Gödel's consistency statement for PA. By Gödel's Second Incompleteness Theorem, PA cannot prove Con(PA) if PA is consistent. Therefore, CT↾ proves Con(PA), while PA (if consistent) cannot. This means CT↾ proves arithmetical sentences (like Con(PA)) in the *original language of PA* that PA itself cannot prove. Conservativeness fails spectacularly.
  2.  **The Anti-Deflationist Interpretation:** This result seems fatal to deflationism. If adding a "merely logical" truth predicate allows us to prove substantial new arithmetical facts – specifically, facts about the *soundness* and *consistency* of the base theory itself – then truth appears to be doing significant epistemic work. It seems to embody a substantive property of *correctness* or *correspondence with arithmetical reality* that PA alone cannot grasp. GR(PA) isn't just *about* truth; it leverages truth to tell us something new and important *about PA itself*, namely that its proofs are reliable. This looks like precisely the kind of explanatory power deflationism denies truth possesses.

  **Deflationist Responses and Their Limitations**

  Deflationists have offered three main lines of defense:

  1.  **Biting the Bullet: Non-Conservativeness is Compatible with Thin Truth.**
      *   **The Argument:** Some deflationists (e.g., early Horwich, though his view is complex) argue that non-conservativeness doesn't entail a "thick" truth property. The proof of GR(PA) and Con(PA) relies solely on the disquotational/compositional nature of truth plus induction over truth-involving formulas. This derivation, they claim, merely makes explicit what was already *implicit* in our acceptance of PA and the rules governing truth. Truth isn't revealing a *new* property; it's facilitating the expression of commitments latent in the base theory and the logical apparatus we've added. The knowledge gained (Con(PA)) is "merely logical" knowledge derived from syntactic and semantic rules, not discovery about an independent arithmetical realm.
      *   **Assessment:** This response is ingenious but ultimately unconvincing. While the *derivation* uses logical rules, the *content* of Con(PA) is undeniably about the non-contradictory nature of PA's theorems – a core arithmetical fact. PA's inability to prove Con(PA) shows this fact is *not* implicit in PA's own axioms and rules. The truth predicate, coupled with extended induction, becomes an *essential bridge* to this arithmetical knowledge. Claiming this knowledge was "implicit" all along rings hollow; without the truth predicate and its specific logical behavior, PA cannot access it. Truth isn't just expressing latent belief; it's *generating* new justifiable belief about the base theory's reliability. This strongly suggests truth has a substantive justificatory role deflationism cannot accommodate.

  2.  **Retreat to Conservatism: Weak, Conservative Truth Theories.**
      *   **The Argument:** Other deflationists (e.g., Field, Halbach) concede that *natural*, induction-rich truth theories are non-conservative and problematic for deflationism. Their solution is to adopt a deliberately weaker truth theory, such as T(PA) (PA plus Tarski-biconditionals *restricted* to the language of PA) or similar systems that explicitly prohibit induction over formulas containing 'True'. These theories *are* conservative over PA. Deflationists argue this is sufficient: it captures the core disquotational function and allows generalizations over base-language sentences, fulfilling truth's essential logical role. The inability to prove GR(PA) or Con(PA) within the truth theory is not a defect but a virtue, reflecting truth's logical, non-substantive nature.
      *   **Assessment:** While this secures conservativeness, the cost in expressive power is cripplingly high and philosophically revealing. A deflationist using T(PA) cannot *express*, let alone prove, within their own truth theory, the fundamental belief that *the theorems of their base theory PA are true* (GR(PA)). They must assert this belief *externally*, as a metalinguistic stance. This creates a debilitating expressive gap. Deflationism prides itself on truth enabling essential generalizations. Yet, the most crucial generalization about the very theory they are using – "All PA-theorems are true" – is inexpressible in their chosen conservative truth theory. They can only gesture towards it from the outside. This undermines a key deflationist motivation: that adding truth solves genuine expressive deficiencies. If the solution prevents expressing the most salient fact about the theory's own correctness, it seems self-defeating. The retreat to conservatism saves the letter of deflationism by sacrificing its spirit and utility.

  3.  **Rejecting Conservativeness as a Core Commitment.**
      *   **The Argument:** A third strategy (hinted at by some, like Azzouni) questions whether conservativeness was ever the right criterion for deflationism in the first place. Perhaps deflationism is only committed to truth not adding new *empirical* content or not explaining *non-semantic* phenomena. Since GR(PA) and Con(PA) are *about* the theory itself (syntax/provability), their provability doesn't show truth explaining, say, physics or chemistry. Deflationism, on this view, is only undermined if truth adds new content about the *subject matter* of the base theory (e.g., prime numbers), not about the theory's own properties.
      *   **Assessment:** This draws an artificial and unsustainable line. PA is a theory *of arithmetic*. Con(PA) is a statement *about arithmetic* (specifically, about the consistency of a certain set of axioms describing arithmetic). GR(PA) makes a claim about the *arithmetical correctness* of PA's theorems. These are fundamentally arithmetical statements, even if they concern the meta-property of provability. Furthermore, deflationism's core rationale – that truth is explanatorily inert and doesn't generate new knowledge – is violated by the proof of Con(PA). The knowledge gained *is* substantial knowledge *about arithmetic*: the non-contradictory nature of its standard formalization. Allowing truth to generate such knowledge while insisting it remains "insubstantial" strains credulity. This move risks redefining deflationism into vacuity.

  **The Verdict: A Decisive Blow**

  While the deflationist responses demonstrate philosophical ingenuity and highlight nuances in the debate, they fail to overcome the fundamental challenge posed by the reflection result. The "Bullet Biting" response trivializes the substantive new knowledge gained. The "Conservative Retreat" avoids the problem only by embracing expressive impotence regarding the very soundness of the base theory, contradicting a core motivation for truth. "Rejecting Conservativeness" as a criterion severs deflationism from its own motivating rationale concerning truth's epistemic inertness.

  The non-conservativeness demonstrated by the proof of GR(PA) and Con(PA) is not a mere "curiosity for proof theorists." It reveals that the truth predicate, when integrated via natural compositional rules and the indispensable logical principle of induction, becomes a powerful engine for generating *justified belief about the soundness of the base theory itself*. This capability is inherently at odds with the deflationist picture of truth as a metaphysically thin, purely expressive device. Truth, in these systems, demonstrably plays a substantive role in justifying our confidence in the very mathematical theories we employ. It provides a form of internal coherence or soundness justification that the base theory cannot attain on its own. This is precisely the kind of explanatory work deflationism seeks to deny truth can perform.

  Therefore, the proof-theoretic argument from non-conservativeness, centered on reflection principles, **cuts decisively against deflationism**. It provides strong evidence that truth, even when introduced via rules deflationists favor, possesses a substantive logical and epistemic power that cannot be reconciled with the thesis that it is merely a device for disquotation and generalization. While deflationism captures important aspects of truth's function, the reflection result shows it is ultimately an incomplete account; truth does more, and matters more, than deflationism allows.
