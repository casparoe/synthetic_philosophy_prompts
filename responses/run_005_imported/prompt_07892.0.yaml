  2. **Introduce her philosophy through story**: The priest anecdote makes it accessible. 
  3. **Frame tetralemma as her compass**: Emphasize it was about honesty, not cold logic. 
  4. **Address death directly**: Acknowledge the impossibility of "correct" words, turning her rigor into a shared tribute. 
  5. **Close with collective grief**: Redirect focus to the living—our memories, love, and how she shaped us. 

  Tricky balance: 
  - Not reducing her philosophy to a soundbite. 
  - Not letting logic overshadow emotion. 
  Solution: Present her quest for truth as an act of love. Her refusal of comfort was itself a gift—inviting others to engage deeply. 

  Symbolism: 
  - **Annotated book**: Represents her lifelong dialogue with ideas. 
  - **Courtroom vs. meditation**: Juxtapose precision of stenography with the openness of Buddhism. 

  Risk areas: 
