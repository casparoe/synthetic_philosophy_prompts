answer: |-
  The strings whispered, a sound like dry leaves skittering across stone. Conductor Elias Thorne lowered his baton, the final, dissonant chord of Elara Vance’s *Elegy for Fractured Light* hanging in the rehearsal hall air. Silence, thick and uneasy, followed. Not the stunned silence of profundity, Elara thought, but the awkward silence of a question unanswered.

  "Alright, people," Thorne boomed, a forced heartiness failing to mask his own uncertainty. "The *intention* is there. The *craft* is undeniable. Let’s take five, then back to the top. Focus on the emotional *arc*."

  Elara retreated to a worn velvet seat in the empty auditorium, the cool plush a shock against her skin. Her fingers absently traced the embossed title on the score resting on her lap – her magnum opus, performed for the first time tonight. Critically lauded in previews. *Technically dazzling*, they said. *A complex exploration of modern alienation*. But that silence… it gnawed at her.

  Lately, an old book had haunted her: Tolstoy’s *What is Art?*. Found in a dusty second-hand shop, its margins filled with someone else’s fervent, faded pencil marks. The core idea – *infection* – had lodged itself in her mind like a stubborn splinter. Art wasn't about complexity or skill, Tolstoy argued, but about the sincere transmission of a specific feeling from artist to audience. *Individuality*: Was the feeling uniquely hers? *Clarity*: Could the audience grasp it unmistakably? *Sincerity*: Did *she* truly feel it when creating it, and did she transmit it purely?

  She’d dismissed it initially as reductive. Now, watching the orchestra members chat, sip water, fiddle with instruments – no lingering resonance, no shared heaviness – Tolstoy’s words echoed: *"Counterfeit art… merely a means of pleasing and entertaining."*

  She closed her eyes, trying to recall the feeling that birthed the *Elegy*. Five years ago. Sitting on a fire escape overlooking a rain-slicked city street at 3 AM. Watching an old man painstakingly sweep the same patch of sidewalk, over and over, under a flickering neon sign. A crushing wave of futility mixed with a strange, aching admiration for his persistence. A feeling of light trapped, fractured, struggling against an indifferent darkness. *That* feeling. Raw, specific, overwhelming. She’d rushed inside, poured it out onto manuscript paper in a white-hot frenzy.

  She opened the score. Page after page of intricate counterpoint, daring harmonic shifts, complex rhythmic layers. Technically, it was her best work. But as she scanned the dense notation, a cold realization seeped in. Where was the *sweeping man*? Where was the 3 AM desolation? The neon flicker?

  The music had become something else. During revisions, she’d smoothed jagged edges critics called "amateurish." She’d amplified the dissonance because "modern audiences expect challenge." She’d added the shimmering celesta passage because it sounded "ethereal" and impressed the conductor. The raw, desperate *feeling* of futile persistence had been buried under layers of compositional *intention* – the intention to be profound, to be complex, to be *recognized* as a significant voice.

  She pictured Tolstoy’s scorn: *"As soon as the artist is not guided by his inner feeling… he begins to invent."*

  The orchestra reassembled. Thorne tapped his stand. "From the Andante Sostenuto, people. Elara, that haunting cello line – let’s really *lean* into the melancholy."

  As the cellos began their mournful melody, Elara listened not as the composer, but as Tolstoy’s stern judge. The sound *was* beautiful. The playing *was* expressive. But was it transmitting *her* specific feeling? Or was it transmitting a *generalized* sadness, expertly crafted? Was the audience being infected with *her* unique blend of futility and awe, or were they appreciating the skill, the expected emotional cues, the *idea* of alienation presented like a museum piece?

  She watched the first violinist, Anna, her brow furrowed in concentration, executing a fiendishly difficult passage with flawless precision. Admirable. But was Anna feeling the fractured light? Or was she feeling the pressure to hit the notes, to follow Thorne’s baton, to deliver a successful premiere?

  The music swelled towards its climactic dissonance – the moment previews called "devastating." Elara remembered writing it, trying to *force* the devastation she no longer fully felt, substituting technical complexity for the sincerity that had faded with endless revision. The orchestra played it powerfully, a wall of anguished sound. Yet, Elara felt… nothing. Worse than nothing: a hollow ache of recognition.

  *Infection requires sincerity*, Tolstoy whispered in her mind. *Where is yours?*

  The dissonance resolved, not into peace, but into a tense, unresolved shimmer – the celesta passage. It sounded clever. It sounded "artistic." It sounded utterly disconnected from the man sweeping under the neon light. It was a decoration, a flourish added to impress. *Counterfeit*.

  The final chord faded. Again, that silence. Not the silence of shared catharsis, but the silence of polite anticipation for the conductor’s next instruction. Thorne nodded, satisfied. "Good. The anguish in the brass was particularly effective there."

  *Effective*. The word struck her like a physical blow. Not *true*, not *infectious*, not *sincere*. Effective at doing what? At fulfilling expectations? At demonstrating skill?

  Elara stood up. The velvet seat sighed. Thorne looked over, surprised. "Elara? Something wrong?"

  She looked at her score, the product of years of labor and ambition. She looked at the orchestra, skilled professionals executing a demanding piece. She looked towards the empty seats where, in a few hours, an audience would sit, trained perhaps to find profundity in complexity, to applaud technical mastery.

  The feeling wasn't there. Not in the music anymore. Not truly in her. The infection had failed because the source was contaminated – not with malice, but with everything *except* the pure, urgent sincerity of that one rain-soaked moment.

  "Elias," she said, her voice surprisingly steady in the vast hall. "Stop."

  Thorne lowered his baton, perplexed. The orchestra stilled, instruments lowering, all eyes on her.

  "I… I need to withdraw the *Elegy*," Elara said. "It shouldn’t be played tonight."

  A collective murmur rippled through the musicians. Thorne’s face paled. "Elara, what on earth? It’s too late! The program’s printed, the audience—"

  "It’s not ready," she interrupted, the real reason too raw, too tied to a theory that suddenly felt devastatingly true. "It’s… not sincere." She met Thorne’s bewildered gaze. "It’s a very well-made… object. But it isn’t doing what real art should do. Not anymore." She gathered her score, the thick paper suddenly heavy with the weight of its own artifice. "I’m sorry. I can’t explain it better right now."

  She walked out of the rehearsal hall, leaving behind a stunned silence far deeper than any her music had created. The ornate hallway echoed with her footsteps. The feeling she sought to capture – the futility, the persistence – was now her own. But it was real. And for the first time in years, staring down the wreckage of her premiere, she felt, uncomfortably, clean. She had diagnosed the hollow sound. Now she had to find the true one again, if she could. The infection demanded nothing less.
