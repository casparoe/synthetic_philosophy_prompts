answer: |-
  That's an astute observation about Douglass's evolution! While his 1852 "Fourth of July" speech is a searing indictment of American hypocrisy, it doesn't quite mark the moment he abandoned *all* constitutional arguments. His shift was more nuanced and driven by crushing political and legal realities, primarily:

  1.  **The Fugitive Slave Act of 1850 & Its Enforcement:** This was the absolute game-changer.
      *   **Nullified State Laws:** It overrode Northern states' personal liberty laws designed to protect free Black people and fugitives.
      *   **Federal Enforcement:** It mandated federal commissioners and citizens to assist in capturing alleged fugitives, turning the entire nation into slave catchers.
      *   **Denial of Due Process:** Alleged fugitives were denied jury trials, the right to testify on their own behalf, and faced summary decisions by commissioners paid more for returning than freeing them.
      *   **Impact on Douglass:** This law demonstrated the federal government's absolute commitment to enforcing slavery *nationwide*. It made a mockery of any argument that the Constitution could be interpreted to limit slavery where it existed or protect free Black citizens. It showed the legal system actively *perpetuating* slavery, not constraining it. Moral outrage became the only appropriate response to such a blatant injustice codified in federal law.

  2.  **The Dred Scott Decision (1857):** This Supreme Court ruling was the final, crushing blow to constitutional strategies.
      *   **No Citizenship:** The Court declared that Black people, free or enslaved, were not and could *never* be citizens of the United States under the Constitution. This stripped them of all legal standing.
      *   **No Rights:** The Court ruled that Black people "had no rights which the white man was bound to respect."
      *   **Congressional Power Nullified:** The Court declared the Missouri Compromise (banning slavery in certain territories) unconstitutional, asserting that Congress had no power to prohibit slavery in federal territories.
      *   **Impact on Douglass:** Dred Scott wasn't just a bad ruling; it was a constitutional *death knell* for legal challenges to slavery. It explicitly declared the Constitution a pro-slavery document that enshrined white supremacy and the property rights of slaveholders above all else. Any argument that the Constitution's guarantees applied to Black people or could be used to limit slavery was rendered legally void by the highest court.

  **How This Shaped Douglass's Strategy:**

  *   **From Interpretation to Condemnation:** Pre-1850s, Douglass (after breaking with Garrison) argued the Constitution's *principles* (Preamble, guarantees of liberty, due process, privileges/immunities) were fundamentally anti-slavery and could be used against the institution. After Fugitive Slave and especially Dred Scott, he shifted to condemning the document *as interpreted and applied* by the pro-slavery government and courts. He didn't necessarily abandon the *text* entirely, but he saw its potential for justice nullified by the prevailing power structure.
  *   **Moral Appeals as Primary Weapon:** With legal avenues seemingly obliterated by Dred Scott and actively weaponized against Black people by the Fugitive Slave Act, moral suasion became the only viable, powerful tool left. He intensified his focus on:
      *   Exposing the brutal inhumanity of slavery.
      *   Shaming Northern complicity (via the Fugitive Slave Act and economic ties).
      *   Appealing directly to the conscience of the nation and the world.
      *   Advocating for resistance (moral, political, and eventually, physical).
  *   **Emphasis on Higher Law:** He increasingly invoked "higher law" – natural law, divine law, the inherent principles of justice – as superior to a Constitution corrupted by slavery and racist interpretation. "There is a law above the Constitution," he argued.
  *   **Shift Towards Political Action & Force:** While moral appeal remained central, the failure of legal/constitutional remedies pushed him towards supporting political action (like the new Republican party, despite its limitations) and, ultimately, by the late 1850s, accepting the necessity of violence (e.g., John Brown's raid) and civil war to destroy slavery.

  **Important Nuance:**

  *   **He Didn't Entirely *Stop* Citing the Constitution:** Even after Dred Scott, Douglass might reference constitutional principles rhetorically to highlight the nation's hypocrisy or to argue for what *should* be. He continued to fight for citizenship and rights *based on principle*, even when the legal framework denied them.
  *   **Post-Civil War:** After the war, Douglass *vigorously* returned to constitutional arguments, championing the 13th, 14th, and 15th Amendments as the tools to finally realize the promises of liberty and equality he had always believed were inherent, even when the original text was perverted. This was his vindication.

  **In Summary:**

  It wasn't disillusionment *alone* that shifted Douglass's emphasis. It was the concrete, devastating impact of **the Fugitive Slave Act of 1850** and, definitively, **the Dred Scott decision of 1857**. These events proved that the constitutional and legal system wasn't just hypocritical; it was actively, ruthlessly pro-slavery and anti-Black. The courts and federal power were not neutral arbiters but instruments of oppression. This forced Douglass to rely overwhelmingly on the power of moral truth-telling, appeals to conscience, and eventually, support for extralegal political and military action to achieve justice. The legal door, as interpreted by the government and Supreme Court, had been slammed shut and bolted.
