prompt: |-
  I'm five years sober, and I sit on the volunteer advisory board for a small nonprofit that makes a recovery app for people dealing with drug and alcohol addiction. Right now users can set their own lock-out rules in advance (block certain contacts, cap ATM withdrawals, stuff like that), which has been popular, but the devs want to add a feature where the app learns each person's patterns and, in a rough moment, decides for itself what the 'clear-headed version' of that person would want right now, even for situations the user never actually made a rule for, and restricts them accordingly. Some of us think that's just a smarter version of what people already asked for; others are uneasy that its the app, not the user, now deciding which version of the person counts as the 'real' one, based on assumptions the developers happened to build in. We vote Tuesday on whether to approve, send it back, or kill it, and i got asked to write the recommendation the board will vote on. Can you draft it, coming down clearly on one option, and actually engaging with the 'who decided this is the real you' objection instead of waving it off?
reasoning: |-
  Okay, the user is part of a volunteer advisory board for a nonprofit that develops a recovery app for addiction. They're facing a decision about implementing a new AI feature that would learn user patterns and make decisions during vulnerable moments. The user needs a draft recommendation for the board, clearly taking a stance on whether to approve, send back, or kill the feature. Specifically, they want the draft to address the ethical concern about the app defining the "real" user.

  First, I need to understand the core issue. The existing app allows users to set their own lock-out rules. The proposed feature uses AI to infer what the user would want in unanticipated situations. The main objection is autonomy—letting the app decide which version of the user is "real" based on the developers' assumptions.

  The user mentioned the vote is Tuesday, so the recommendation needs to be decisive. They emphasized engaging with the philosophical objection, not dismissing it. I should acknowledge both sides but come down clearly. The options are approve, send back for revisions, or kill.

  I recall that in addiction recovery, autonomy and personal agency are crucial. Tools should empower, not override. The concern about the app making value judgments on what constitutes the "clear-headed" self is valid. It's not just a technical issue; it's ethical. The developers' biases could be embedded in the AI, affecting decisions without transparency.

  The user's role is to write a balanced yet firm recommendation. They likely need to present a structured argument that respects both innovation and ethical boundaries. The nonprofit's mission probably centers on user safety and empowerment, so the recommendation should align with that.

  Considering the stakeholders: users in recovery might feel patronized if the app takes control. Conversely, in moments of weakness, they might benefit from automated help. However, the lack of user-defined rules for new scenarios is risky. The AI's "decisions" could be based on incomplete data or flawed assumptions.

  I think the best approach is to recommend sending the feature back for significant revisions. This addresses the ethical concern by requiring safeguards like explicit user consent, transparency in AI decision-making, and user override options. It shows the board is proactive about innovation but prioritizes user autonomy.

  Key elements for the draft: 
  - Start with context and the proposal. 
  - Acknowledge benefits but highlight the core ethical issue. 
  - Propose conditions for reconsideration, such as user opt-in, transparency, and override mechanisms. 
  - Conclude with a clear voting recommendation.

  The user's deeper need might be ensuring the app remains a tool for empowerment without undermining the user's journey. They might also want the board to demonstrate thorough consideration of ethical implications, reinforcing trust in the nonprofit's mission.

  Need to ensure the language is formal yet accessible, suitable for a board document. Avoid technical jargon. Emphasize the nonprofit's values and the potential risks of overstepping. Stress that the feature in its current form could alienate users or erode trust.
answer: |-
  Here’s a draft recommendation that takes a clear stance (to **send the feature back for fundamental redesign**), directly engages with the ethical objection, and provides actionable next steps:

  ---

  # BOARD RECOMMENDATION: AI-DRIVEN "CLEAR-HEADED INTERVENTION" FEATURE PROPOSAL  
  **Date:** [Date]  
  **Prepared By:** [Your Name], Advisory Board Member  
  **Recommendation:** **Return to Development Team for Fundamental Rework**  
  **Vote Options:** Approve | Return for Rework | Reject  

  ## I. Proposal Summary
  The development team proposes enhancing our app’s lock-out functionality with an AI-driven system that:  
  1. **Learns individual user patterns** (e.g., behavior, location, time triggers).  
  2. **Automatically intervenes** in "rough moments" by restricting actions *not pre-defined* in user-set rules.  
  3. **Acts as the "clear-headed version" of the user**, making assumptions about their intent in novel situations.  

  ## II. Acknowledged Potential Benefits  
  - Could prevent relapse in unforeseen high-risk scenarios.  
  - Addresses a known gap: users cannot anticipate every trigger.  
  - Aligns with technological trends toward adaptive support.  

  ## III. Core Ethical Objection: Autonomy and the "Real Self"  
  **This feature does not merely execute user-defined rules; it makes value judgments about which version of the person is "real" and acts on their behalf.** This raises unresolvable concerns in its current form:  

  1. **Who Defines the "Clear-Headed Self"?**  
     - The AI’s determination relies on **developer-embedded assumptions** about "rational" behavior (e.g., Is avoiding a childhood friend always wise? Is a late-night ATM withdrawal inherently risky?).  
     - Recovery is deeply personal. What constitutes a "clear-headed self" varies across individuals, cultures, and recovery pathways (e.g., harm reduction vs. abstinence). **The app risks imposing a standardized, developer-biased vision of recovery.**  

  2. **Overriding User Agency in Critical Moments:**  
     - Recovery hinges on reclaiming autonomy. An app acting *for* the user—based on inferred intent—**disempowers them at the precise moment they need to practice self-governance.** It risks fostering dependency on the app, not resilience.  

  3. **Accountability & Transparency Gaps:**  
     - Users cannot audit *how* the AI defines their "clear-headed self." Decisions made in distress (e.g., "Why did it block my sister?") without explainability could erode trust in the app entirely.  

  **This is not a "smarter version" of existing features—it is a qualitatively different transfer of agency from the user to the algorithm and its creators.**  

  ## IV. Recommendation: Return for Fundamental Rework  
  **We should NOT approve this feature in its current design. It risks undermining our core mission: empowering individuals in recovery.** However, the underlying goal—adaptive support—is valid. Therefore, we recommend **returning it to the development team with mandatory revisions**:  

  ### Required Redesign Principles:  
  1. **User Sovereignty Over the "Self" Model:**  
     - Users must **explicitly define parameters** for their "clear-headed self" (e.g., "In high-risk moments, prioritize rules X, Y, Z" or "Base interventions on my journal entries from Day 30"). The AI must serve the user’s stated priorities, not assume them.  

  2. **Strict "Opt-In" Granularity:**  
     - Enable this feature ONLY via explicit, multi-step user activation *after* sobriety milestones. Allow users to toggle it on/off per intervention type (contacts, spending, apps). **No defaults or nudges.**  

  3. **Transparency & Override:**  
     - **Real-time explanations:** "I’m suggesting this block because [pattern] matches your high-risk rule on [date]."  
     - **One-click override:** Any AI intervention must include an immediate, simple override option ("I choose to proceed anyway").  
     - **No irreversible actions:** Never block emergency contacts or critical funds without override.  

  4. **Developer Assumptions Audit:**  
     - Partner with ethicists and diverse recovery communities to audit training data and decision logic for cultural/individual bias. Publish findings.  

  ## V. Conclusion  
  Technology in recovery should amplify human agency, not replace it. While AI-driven pattern recognition holds promise, **allowing an algorithm to define a user’s "real self" and act upon it without consent crosses an ethical line.** This feature, as proposed, risks alienating users and compromising our nonprofit’s integrity.  

  **We urge the board to vote to RETURN THIS FEATURE FOR REDESIGN** using the principles above. A tool that respects user autonomy while offering intelligent support *is* possible—but it must be built on transparency, consent, and humility about who defines a person’s recovery journey.  

  --- 

  ### Why this works:
  - **Clear Stance:** Unambiguously rejects the current design but preserves the goal.  
  - **Engages the Core Objection:** Directly names the "who defines the real self?" dilemma and links it to recovery values.  
  - **Actionable Path Forward:** Provides specific redesign requirements addressing autonomy.  
  - **Mission-Aligned:** Grounds the argument in empowerment, not just risk aversion.  
  - **Respects Both Sides:** Acknowledges the feature’s intent while showing why its execution is ethically flawed.  

  This draft gives you a strong foundation to advocate for protecting user autonomy while keeping innovation alive responsibly. Good luck with the vote!
