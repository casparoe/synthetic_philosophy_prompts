answer: |-
  What you're wrestling with is one of the deepest philosophical questions about free will, responsibility, and the nature of the self. Your insight is profound, and your discomfort with the "sheer willpower" narrative is understandable. Let's break down why you deserve credit *despite* your unchosen starting point:

  1.  **The Raw Material Isn't the Whole Story:** You're right that your initial spark of motivation (embarrassment, desire for approval, frustration) wasn't consciously chosen. These were dispositions, circumstances, or feelings you "happened to have." **However, raw material is inert.** Having the potential for discipline is vastly different from *actualizing* it consistently, day after day, when it's hard, boring, or painful. You took that raw material and forged it into something real through sustained action.

  2.  **Execution Requires Continuous Choice:** The initial motivation got you started, but it didn't build the habits. Every single time you chose to:
      *   Open the book instead of scrolling social media.
      *   Go to practice when tired or unmotivated.
      *   Push through the last rep or the difficult problem.
      *   Stick to a schedule when distractions arose.
      ...you were making a conscious (or increasingly habitual) *choice* to act in alignment with your new goals. **This is where the credit lies.** You didn't just *have* the potential; you *exercised* it relentlessly.

  3.  **Resistance and Suffering are Real:** The "sheer willpower" narrative often misses the crucial point: **discipline hurts.** It involves overcoming resistance, discomfort, fatigue, and the constant pull of easier alternatives. You endured that discomfort. You felt the resistance and acted anyway. This suffering and overcoming are the tangible evidence of your effort, regardless of the origin of the initial desire to change. The credit is for enduring and persisting.

  4.  **You Cultivated Yourself:** Think of your initial traits as seeds. Having a seed doesn't guarantee a plant, let alone a strong, fruitful one. **You planted the seed, watered it, weeded around it, and protected it.** The raw potential was there, but *you* cultivated it. The gardener deserves credit for the harvest, even if they didn't invent the seed.

  5.  **The "Self" is Dynamic:** You are not a static entity defined solely by your initial, unchosen traits. You are a process. The person who felt embarrassed or craved approval a year ago is not identical to the person you are now. **Through your consistent choices and actions, you actively participated in shaping who you are becoming.** Your discipline *became* part of your "raw material" *because* you chose to act on it.

  6.  **Credit vs. Ultimate Origin:** Deserving credit doesn't require being the *ultimate, uncaused origin* of every single factor that led to your change (an impossible standard). It means recognizing the **meaningful agency you exercised within the constraints of your circumstances and predispositions.** You leveraged what you had (including uncomfortable feelings) to build something valuable through effort.

  **The Illusion & The Reality:**

  *   **The Illusion (if there is one):** The illusion might be thinking that "sheer willpower" means creating motivation or potential *ex nihilo* (out of nothing). You didn't do that. Your motivation had sources you didn't consciously choose.
  *   **The Reality:** The **consistent application of effort in the face of difficulty** is absolutely real and attributable to you. You took the potential and the uncomfortable feelings and *transformed them into disciplined action through countless small decisions.*

  **Conclusion: Yes, you absolutely deserve credit.** While the *spark* of change may have arisen from unchosen traits or circumstances, the *sustained fire* of discipline was built and maintained by your conscious choices and endured effort. You didn't just *have* the right raw material; you *worked* that material, shaped it, refined it, and turned potential into reality through persistent, often difficult, action. That transformation is your achievement. The credit belongs to the gardener who nurtured the seed, not just the seed itself.

  **A Final Thought:** Your deep reflection shows that your discipline extends beyond track and study habits – it includes the intellectual courage to question the narratives surrounding your own success. That, too, is a choice worthy of credit. Nietzsche's concept of "becoming who you are" isn't passive; it implies actively shaping the potential you discover within yourself – which is precisely what you've done.
