answer: |-
  Based on Frank Ramsey's foundational ethical principles, his utilitarian framework heavily influenced by G.E. Moore, and his explicit arguments in *A Mathematical Theory of Saving*, he would almost certainly side **decisively with Nicholas Stern** in the dispute over the pure rate of time preference, and his logic would strongly support prioritizing the mitigation of long-term existential risks like climate change or advanced AI, though his emphasis on calculability might introduce practical caveats.

  Here's the breakdown, drawing on his key commitments:

  1.  **The "Ethically Indefensible" Core Principle:** Ramsey's rejection of discounting future well-being *purely due to its temporal distance* is absolute and ethical, not pragmatic. He viewed it as a failure of moral imagination and a violation of the fundamental utilitarian principle that "equal amounts of good are equally desirable whether enjoyed by ourselves or by others, or enjoyed now or in the future" (derived from Moore's *Principia Ethica*). Nordhaus's higher rate, grounded in observed market behavior (revealed preference), would be precisely the type of "weakness of the imagination" and ethically unjustifiable practice Ramsey condemned. Stern's near-zero rate (reflecting only extinction risk) aligns perfectly with Ramsey's ethical imperative.

  2.  **Moore's Objectivist Utilitarianism & The "Good":** Ramsey, deeply influenced by Moore, was an objectivist utilitarian. The "good" (states of consciousness, beauty, knowledge, etc.) exists independently of our current preferences or market behaviors. Future generations have the same claim to experiencing this "good" as the present generation. Discounting their potential well-being because they aren't here *now* violates this objectivity. Nordhaus's approach, incorporating real-world savings rates reflecting individual myopia and institutional imperfections, would be seen by Ramsey as descriptive of flawed human behavior, not prescriptive of ethical value. Stern's approach respects the intrinsic value of future good.

  3.  **Keynesian Connection - The Long Run:** While Keynes famously quipped "in the long run we are all dead," Ramsey's ethical framework was fundamentally about *that very long run*. His optimal saving model aimed to maximize enjoyment (or "bliss") over an indefinite future. His collaboration with Keynes (e.g., on probability) reinforced his focus on long-term consequences and the importance of rational calculation over present impulses. Prioritizing the survival and flourishing of civilization over centuries or millennia is the ultimate expression of this long-run perspective.

  4.  **Existential Risk Extension: A Logical Corollary:**
      *   **Total Utilitarian Logic:** Ramsey's utilitarianism was "total" (maximizing the sum of good across all individuals in all times). The potential future population over millennia is astronomically large. An existential catastrophe wiping out humanity would destroy this vast potential sum of future good. Preventing such a catastrophe, even at significant cost today, becomes an overwhelming moral imperative under this calculus. Discounting this future good at a near-zero rate makes the present value immense.
      *   **"Bliss" and Civilizational Potential:** Ramsey's concept of achieving "bliss" (the maximum sustainable consumption per capita) implies a long, stable, flourishing future for civilization. Existential risks are the ultimate threat to achieving and maintaining any semblance of "bliss" for humanity. Preserving the *possibility* of this long-term flourishing is paramount.
      *   **Probability, Not Discounting:** Ramsey (a pioneer in subjective probability) would likely frame existential risk mitigation not through discounting the value of the far future, but through the *probability* of the catastrophe occurring and the *effectiveness* of interventions. If an action today significantly reduces a non-negligible probability of losing all future potential good, its expected value could be enormous under his near-zero discounting. This is the core logic of modern existential risk prioritization (e.g., Bostrom, Ord).

  5.  **Potential Caveat: Calculability and Uncertainty:** While Ramsey's *ethical principle* points strongly towards prioritizing existential risk mitigation, his emphasis on *calculation* ("a practice and not a creed") might introduce nuance. He might demand rigorous probabilistic assessment of the risks and the efficacy of interventions. If the risks were deemed highly speculative or the interventions utterly ineffective, he *might* resist allocating vast resources based purely on remote possibilities. However, for well-characterized, credible existential threats with plausible mitigation pathways (like catastrophic climate change or arguably some AI scenarios), his core ethical logic would demand significant present investment. He would likely view the uncertainties surrounding the *magnitude* of future climate damages or *precise* AI risks as reasons for *greater precaution*, not less, given the stakes.

  **Conclusion:**

  Frank Ramsey would be a staunch ally of Stern, rejecting Nordhaus's higher discount rate as ethically bankrupt, a capitulation to flawed human psychology rather than a reflection of true value. His zero pure time preference principle, grounded in Moorean objectivist utilitarianism and the intrinsic equal value of future well-being, leads inexorably towards prioritizing actions that safeguard humanity's very long-term future. **He would absolutely push his logic towards the prioritization of mitigating existential risks.** Preventing the permanent loss of astronomical future potential good would be the highest ethical calling under his framework. While he would insist on careful probabilistic assessment, the sheer scale of the potential loss would make the expected value of existential risk mitigation overwhelmingly compelling to him, dwarfing many nearer-term concerns. His thought doesn't resist this extension; it demands it. The modern longtermist arguments for existential risk prioritization are a direct, logical, and ethically consistent application of Ramsey's core insights about time, value, and the good.
