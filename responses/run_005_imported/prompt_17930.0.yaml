  Next, the intending/foreseeing distinction: The student explains it well, using the factory example and applying it to Truman. They correctly state that certainty of death implies intention. However, they oversimplify by saying "a death you know for certain will occur is a death you intend," which isn't entirely accurate—Anscombe allows for foreseen but unintended deaths. This is a subtle point a quick grader might miss. Score 18/20.

