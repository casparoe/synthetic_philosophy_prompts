answer: |-
  You're absolutely right to feel that something is off here. Your husband is misappropriating a legitimate therapeutic concept to evade accountability for specific harmful actions. Let's break down why this is both intellectually dishonest and practically problematic:

  1.  **Conflating Different Levels of Analysis:**
      *   **The Pattern:** Your therapist correctly identified the *interpersonal dynamic* ("pursuer-withdrawer" cycle). This explains how you both got *stuck* in conflict communication. It's about the *interaction*, not the origin or justification of the *specific issues* being discussed.
      *   **Individual Actions:** Moving a large sum of savings into a secret account is a **concrete, unilateral action** with significant material and ethical implications. It's not an *interaction*; it's a *decision and act* taken by one person.

  2.  **The Pattern Doesn't Cause or Excuse Specific Unilateral Acts:** While the pattern created distress and communication breakdowns, it does **not**:
      *   **Cause Dishonesty:** The pattern didn't *make* him choose secrecy and deception.
      *   **Cause Financial Control/Manipulation:** Feeling withdrawn doesn't necessitate hiding marital assets.
      *   **Negate Agency:** He still had the agency to choose *how* to respond to his feelings of withdrawal. He chose deception instead of communication (even difficult communication), therapy, or other avenues.

  3.  **Accountability Exists on Multiple Levels:**
      *   **Systemic Accountability:** You both contributed to the dysfunctional communication *pattern*. This is valid, and understanding it is crucial for healing (individually and, if applicable, co-parenting).
      *   **Individual Accountability:** Each person remains 100% responsible for their *choices* and *actions*, especially those that violate trust, ethics, or the law. His choice to hide money is solely *his* responsibility, regardless of the pre-existing relationship dynamic. The pattern might explain his *feelings* (e.g., fear, resentment) that *led* to the action, but it doesn't *excuse* the action itself.

  4.  **The Therapist's Intent vs. Husband's Misuse:** The therapist focused on the pattern to help you *break the cycle* and communicate more effectively *within the relationship*. The goal was mutual understanding and change, **not** to absolve individuals of responsibility for harmful behaviors or provide ammunition for one partner to avoid consequences during divorce. Your husband is weaponizing the concept for a purpose entirely contrary to its therapeutic intent.

  5.  **The Slight of Hand You Sense:** He's using the valid insight about *shared communication dysfunction* to try and invalidate your entirely valid claim about *his individual act of financial deception and potential dissipation of assets*. He's implying that because the *relationship* was a system, *all actions within it* are equally shared and thus no one is individually accountable. **This is false logic.** Think of it this way: just because two countries have a long history of conflict (the "pattern"), it doesn't mean one country isn't responsible if its leader orders an illegal invasion (the concrete act).

  **How to Address This in Mediation:**

  1.  **Name the Distinction Clearly:** "I acknowledge the communication pattern we fell into, as identified in therapy. That pattern was about *how we talked* and *reacted emotionally*. However, moving $X into a secret account was not part of that communication pattern. It was a separate, unilateral financial decision you made involving marital assets."
  2.  **Focus on the Action, Not the Pattern:** "Regardless of our communication struggles, the act of secretly moving marital funds requires its own explanation and accountability. That action is the issue here, not our past communication dynamic."
  3.  **Reframe for the Mediator:** Explain to the mediator: "My husband is attempting to use insights from couples therapy about our *communication dynamics* to deflect from taking responsibility for specific, significant *financial actions* he took unilaterally. The therapy was about understanding our *interactions*, not excusing individual decisions that breach financial trust or legal obligations regarding marital assets."
  4.  **Stick to Facts & Consequences:** Focus mediation on the concrete facts: What money was moved? When? To where? What was its intended purpose (if he claims one)? What is the impact on the marital estate? What needs to happen to rectify it (e.g., returning the funds, full disclosure of all accounts)? The *why* (blaming the pattern) is irrelevant to the *what* and the *consequences*.
  5.  **Separate the Issues:** "Our communication pattern is important for understanding our history, but it has no bearing on the equitable division of assets or the fact that full financial disclosure is required in this process. His action with the savings is a separate financial matter that needs resolution based on the facts of the transaction and the law."
  6.  **Consider Your Mediator:** If the mediator seems swayed by this argument or doesn't effectively shut it down, you may need to be firmer or consider whether this mediator is equipped to handle this level of complexity/manipulation. A good mediator should recognize this deflection tactic.

  **In essence:** Understanding the co-created pattern is crucial for emotional healing and insight, but it **does not dissolve individual moral, ethical, or legal responsibility for specific harmful acts.** Your husband is engaging in a profound misuse of therapy to avoid accountability for a serious breach of trust. Trust your instincts – the sleight of hand you perceive is real. Hold firm on the concrete facts and demand accountability for the specific actions that damaged the marital partnership financially.
