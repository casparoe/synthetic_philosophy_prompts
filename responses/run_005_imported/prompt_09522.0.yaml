  The user's core question is whether she's misunderstanding relational systems or if he's weaponizing therapy language. Important to validate both: yes, patterns are real and co-created BUT that doesn't erase individual agency for specific choices. The secret account move wasn't part of their mutual dynamic - it was a solo act with material consequences.

  Mediation context is crucial here. Unlike therapy, mediation has different goals: asset division, custody etc. The therapist's framework wasn't designed for this legal/financial context. Should emphasize that patterns explain emotional disconnection but don't justify financial secrecy or determine asset division.

