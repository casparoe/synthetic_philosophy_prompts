  So this has been bugging me since dinner with a friend last night. Hes a committed buy-and-hold investor who flat out refuses to check his brokerage account whenever the market's tanking, because he's already decided that no matter what the number says, he won't sell and won't buy more either — so looking literally can't change what he does. It costs him nothing but a few seconds, and yet he insists checking would still leave him worse off than not checking, just because of what it'd do to his mood that day. Something's nagging at me about the claim that totally free information that wouldn't change your plans could still make you worse off for having it — is he actually being irrational, or am I missing something?
