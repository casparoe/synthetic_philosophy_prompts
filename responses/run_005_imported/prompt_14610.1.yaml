answer: |-
  That's a fascinating puzzle that cuts to the heart of behavioral economics and the difference between *instrumental rationality* (using information to make better decisions) and *experiential rationality* (maximizing well-being). Your friend is likely **perfectly rational**, and here's why:

  1.  **Information Has Emotional Cost:** While the information (the portfolio value) is "free" in terms of monetary cost and time, it carries a significant *emotional cost*. Seeing a large paper loss triggers negative emotions like anxiety, regret, fear, and stress. These emotions are real psychological burdens, even if they don't change his investment *actions*.

  2.  **Loss Aversion is Powerful:** Behavioral economics (Kahneman & Tversky) shows people feel the pain of a loss roughly twice as intensely as the pleasure of an equivalent gain. Seeing his portfolio down significantly causes disproportionate psychological pain. Avoiding this pain is a rational act of self-preservation for his mental well-being.

  3.  **No Instrumental Benefit, Only Emotional Cost:** Your friend has *already* made his optimal decision (hold). Checking the account provides him with **zero instrumental benefit** – it doesn't help him make a better decision because his decision is fixed. However, it imposes a definite **emotional cost**. Therefore, the net effect of acquiring that information is negative for him.

  4.  **Rational Ignorance:** Economists recognize "rational ignorance" – it can be rational to *not* acquire information if the cost of acquiring it (including emotional cost) outweighs the benefit. Your friend's situation is a perfect example: the emotional cost of seeing the loss outweighs the zero benefit of knowing the number (since it won't change his action).

  5.  **Self-Control & Pre-Commitment:** By refusing to look, your friend is exercising self-control. He knows that *in the moment* of seeing the loss, he might experience intense, irrational urges to act (even if he knows intellectually he shouldn't). Avoiding the trigger entirely is a rational pre-commitment strategy to prevent potential future irrationality driven by emotion.

  6.  **Utility Maximization Includes Mood:** Rationality isn't solely about maximizing financial returns; it's about maximizing *utility* (overall well-being/happiness). Your friend understands that his mood and peace of mind are crucial components of his utility. Protecting his mood by avoiding unnecessary distress is a rational way to maximize his overall utility that day and beyond.

  **Where the Nagging Feeling Might Come From (and Why It's Misplaced):**

  *   **Classical Economics Assumption:** Traditional models assume information is costless and always beneficial. Your intuition might stem from this. But humans aren't purely logical robots; we have emotions that information affects.
  *   **Confusing "Can't Change Plans" with "No Impact":** Just because he *won't* change his plans doesn't mean the information *can't* impact him. The impact is psychological, not transactional.
  *   **Belief Information Must Be Actionable:** We often value information based on its potential to change actions. Your friend correctly recognizes that *this specific piece of information, at this specific time*, has no actionable value *for him*, given his strategy. Its only effect is detrimental to his well-being.

  **Is He Irrational? Almost Certainly Not.**

  *   **Self-Aware:** He understands his own psychology (loss aversion, emotional response).
  *   **Consistent:** His action (not looking) aligns perfectly with his goals (long-term holding, maintaining emotional equilibrium).
  *   **Cost-Benefit Analysis:** He implicitly weighs the zero benefit against a known emotional cost and chooses the option with higher net utility (avoiding the cost).
  *   **Optimal for *Him*:** Given his chosen strategy and psychological makeup, this is likely the optimal behavior.

  **What He Might Be Missing (Slightly):**

  *   **Opportunity Cost?** If *not* looking means he misses information *unrelated* to the market dip that *would* require action (e.g., a corporate action notice, fraud alert), then avoiding the account entirely could be suboptimal. He should ideally find a way to check *only* for critical non-market-related information during downturns.
  *   **Long-Term Habit:** Rigidly never checking *could* theoretically lead to missing a fundamental shift that *should* cause a strategy change, but this is unlikely for a passive investor and doesn't apply to short-term dips.

  **Conclusion:** Your friend is exhibiting sophisticated rationality by recognizing the *emotional cost* of information that provides him with *no instrumental benefit*. He prioritizes his mental well-being and protects his long-term strategy by avoiding a known psychological trigger. His logic is sound: free information that causes distress without offering any decision-making advantage *does* make you worse off. The "nagging" feeling likely comes from underestimating the real psychological cost of seeing losses when powerless to act. He's not being irrational; he's being psychologically astute.
