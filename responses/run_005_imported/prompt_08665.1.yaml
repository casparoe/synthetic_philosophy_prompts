answer: |-
  Here's the strongest case for Bentham's inconsistency, built rigorously on his own utilitarian principles:

  1.  **The Utilitarian Imperative: Aggregate All Sentient Experience:** Bentham's core axiom is that pleasure is good, pain is bad, and the morality of an action is determined *solely* by its net effect on the aggregate balance of pleasure over pain for all affected sentient beings. Crucially, *any* conscious state of pain, regardless of its source, nature, or object, *must* be counted in the hedonic calculus. As Bentham himself states: "Nature has placed mankind under the governance of two sovereign masters, *pain* and *pleasure*." He makes no exception for pains arising from specific mental states like disgust or antipathy.

  2.  **The Calculus is Formally Source-Neutral:** The dimensions of the calculus – intensity, duration, certainty, propinquity, fecundity, purity, and extent – are explicitly designed to be *descriptive* and *non-evaluative* regarding the *cause* or *reasonableness* of the pleasure or pain. The calculus asks *how much* pain, *how long* it lasts, *how sure* it is, *how near* it is, etc. It does *not* ask *why* the pain exists or whether it's justified. A pain caused by stubbing a toe counts the same as a pain caused by hearing bad news, provided the descriptive metrics are equal. **Therefore, the origin of the pain in "antipathy" or "prejudice" is formally irrelevant to its inclusion and weighting within the calculus itself.**

  3.  **Antipathy-Pain Meets the Formal Criteria:**
      *   **Intensity:** The disgust described can be intense and visceral.
      *   **Duration:** It can be long-lasting, especially if the knowledge is pervasive or constantly reinforced.
      *   **Certainty:** For many individuals in Bentham's time (and ours), the feeling of disgust upon *knowing* about the act was highly certain. The mere *idea* reliably triggered the pain.
      *   **Propinquity:** While the physical act might be distant, the *knowledge* of its occurrence is psychologically proximate. Bentham acknowledges "imaginary" pains as real in their effect. Knowing an act occurs *somewhere* in society brings it mentally close enough to cause distress.
      *   **Fecundity:** This disgust could lead to further pains: anxiety, social tension, support for discriminatory policies, etc.
      *   **Purity:** The pain might be mixed with other feelings (fear, moral outrage), but the core painful experience of disgust is present.
      *   **Extent:** Given widespread social condemnation, the *number* of people experiencing this disgust-pain could be very large.

  4.  **Discounting Antipathy-Pain Requires an *External* Value Judgment:** When Bentham argues that antipathy-pain "doesn't count" or "counts less," he is introducing a criterion *outside* the formal structure of the hedonic calculus. He is making a normative judgment *about* the pain, based on its origin: "This pain arises from prejudice, therefore it is illegitimate or deserves less weight." This judgment relies on concepts like "reasonableness," "authenticity," or "inherent worth" of the feeling, which are fundamentally *non-utilitarian* values. They appeal to an implicit standard beyond mere sentient experience.

  5.  **The "Prejudice" Argument is a Trojan Horse:** Labeling the disgust "prejudice" or "inherited" is an *explanation* of its origin, *not* a justification for its exclusion within utilitarianism. The calculus doesn't care *why* the pain exists; it only cares *that* it exists and *what* its measurable characteristics are. If inherited prejudice causes intense, widespread, and certain pain, a *strict* utilitarian calculus *must* weigh that pain heavily against the pleasures derived from the decriminalized act. Calling it prejudice may be sociologically accurate, but it doesn't erase the phenomenological reality of the pain felt *now*.

  6.  **The Slippery Slope of Discounting "Unreasonable" Pains:** If Bentham allows the discounting of pains deemed "unreasonable" or arising from "prejudice," he opens the door to arbitrary value judgments that undermine the supposed neutrality of utilitarianism. Who defines "reasonableness"? Why discount prejudice-pain but not, say, the pain of envy or the pain of an artist whose work is criticized? This move privileges certain *kinds* of pains (physical harms, direct consequences) over others (psychological, reactive) based on an unstated moral hierarchy alien to pure hedonism.

  **Conclusion:** Bentham's attempt to exclude or radically discount the pain of antipathy is **not** a consistent application of his own hedonic utilitarian principles. It is a pragmatic or perhaps morally motivated *departure* from strict hedonism. He implicitly imports a distinction between "valid" pains (those he deems grounded in direct harm or "reason") and "invalid" pains (those grounded in socially constructed disgust or "unreason"), a distinction absent from the formal calculus. This move is necessary to reach his desired policy conclusion (decriminalization) *despite* the potential aggregate weight of widespread disgust-pain revealed by the calculus itself. It reveals a tension within utilitarianism when confronting deeply ingrained social prejudices that cause widespread, real suffering merely through the *knowledge* of others' harmless actions. Bentham's solution here leans more towards a proto-liberal harm principle ("no *real* harm, therefore no grounds for interference") than a strict application of the aggregative, source-neutral hedonic calculus he championed.
