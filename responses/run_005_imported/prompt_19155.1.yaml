prompt: |-
  okay so I'm on my school's student council executive board and we've got a situation. every homecoming week the four grade levels compete in a pledge drive for the local food bank -- whoever pledges the most money by friday's pep rally gets a trophy and a pizza party, but everyone has to pay whatever they pledged whether they win or not. this year the senior and junior classes got in a back-and-forth on the cafeteria whiteboard where every time one class's number went up the other bumped theirs, and it spiraled from ~$300 each to something like $2,800 each, way past what either class can actually raise by friday. a couple senior officers already put in their own money to keep pace, and some juniors say their families can't keep chipping in every time the total changes. seniors now want us to void the drive and reset it at a reasonable number, since they say it stopped being about the food bank and became about not backing down first; juniors want the final number to stand, since they're currently ahead and didn't break any rule, they just kept matching. the drive's rules never covered this, so it's on us. we present a decision at fridays pep rally -- can you write the memo id bring to the e-board? give an actual call (not "revisit next year") with reasons we could actually vote on, say exactly what happens to this year's pledges, and make sure it seriously engages the juniors' "we were winning fair and square" argument instead of just saying the escalation was bad.
