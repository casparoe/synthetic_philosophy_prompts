answer: |-
  Here are 10 targeted questions designed to challenge the Boorse/Daniels framework, expose its tensions, and force nuanced engagement – complete with predicted answers and sharp follow-ups:

  1.  **Question:** "You ground the therapy/enhancement distinction in Boorse's 'statistical, species-typical functioning'. But critics argue this collapses the 'is' into the 'ought'. *How* does a purely *descriptive* account of what *is* typical automatically generate the *normative* claim that society is only obligated to restore that baseline, not go beyond it?"
      *   **Predicted Answer:** She'll invoke Norman Daniels' extension – arguing that justice (via Rawls) only requires protecting "fair equality of opportunity," which restoring normal function achieves, while enhancement exceeds this. It's the *link* to opportunity that provides the normativity.
      *   **Follow-Up:** "But doesn't that just shift the problem? *Why* tie 'fair opportunity' solely to restoring a statistically average range? Couldn't someone argue that in a technologically advanced society, 'fair opportunity' for certain roles might *require* enhancement beyond the historical species-typical baseline? Isn't the choice to privilege the statistical norm *itself* a normative leap?"

  2.  **Question:** "Let's test the 'statistical typicality' criterion with aging. On Boorse's view, progressive loss of function, frailty, and susceptibility to age-related diseases are statistically *typical* for human cohorts beyond a certain age. Therefore, interventions to significantly slow or reverse aging processes wouldn't be 'therapy' restoring normal function, but 'enhancement'. Do you agree with that classification?"
      *   **Predicted Answer:** Yes, she'll bite the bullet. Aging is not a disease; it's a universal, species-typical process. Interventions targeting fundamental aging mechanisms are therefore enhancements, even if they prevent diseases.
      *   **Follow-Up:** "Given that age-related decline is the primary driver of morbidity, mortality, and healthcare costs, doesn't classifying *preventing* this decline as mere 'enhancement' seem medically perverse and potentially unjust? If we *can* safely intervene to keep 80-year-olds functioning like healthy 50-year-olds, why should justice *not* obligate providing that, if we provide hip replacements for statistically common osteoarthritis?"

  3.  **Question:** "The classic Growth Hormone (GH) case: A child with GH deficiency gets GH treatment (therapy). A child with Idiopathic Short Stature (ISS), equally short but with 'normal' GH levels, gets the identical GH injection (enhancement). Same biological intervention, same outcome, but one is treatment owed in justice, the other is optional enhancement. What *morally relevant difference* does the underlying statistical deviation in hormone levels actually make here?"
      *   **Predicted Answer:** She'll argue the GH-deficient child has a *disease* (a subfunction failing), while the ISS child has a *variation* within the statistically normal range. Restoring function vs. altering a non-dysfunctional state is the key difference.
      *   **Follow-Up:** "But functionally and experientially, both children suffer the same disadvantage – being very short in a society that disadvantages shortness. Doesn't privileging the *cause* (low GH stats) over the *effect* (disadvantage) punish the biologically unlucky child for having a 'disease' label, while telling the equally disadvantaged ISS child their need isn't 'real' enough for justice? How is that fair?"

  4.  **Question:** "Boorse defines 'normal function' relative to age and sex cohorts. How do we avoid this framework entrenching existing social inequalities or biological limitations? For example, if women statistically have higher rates of depression than men, does that make depression 'normal functioning' for women, reducing the claim for therapeutic intervention?"
      *   **Predicted Answer:** She'll likely argue Boorse aims for biologically-defined reference classes and that statistical norms shouldn't override clear dysfunction. She might distinguish between prevalence and function.
      *   **Follow-Up:** "But isn't the *choice* of relevant reference classes (age, sex) itself potentially value-laden? Couldn't this statistical approach inadvertently define away dysfunctions prevalent in marginalized groups by making them 'typical' for that group? How do we guard against the framework normalizing disadvantage?"

  5.  **Question:** "Many human traits exist on a continuum (height, cognitive processing speed, mood stability). Where exactly on that continuum does 'normal function' end and 'subnormal function' requiring therapy begin? Isn't the line inherently arbitrary from a purely biological/statistical perspective?"
      *   **Predicted Answer:** She'll concede it can be fuzzy but argue medicine constantly deals with thresholds (e.g., hypertension diagnosis). Statistical deviation plus significant disadvantage or risk often defines the line.
      *   **Follow-Up:** "Doesn't that admission – that 'significant disadvantage or risk' is doing crucial work – show that the framework *can't* be purely descriptive? Aren't we smuggling in normative judgments about *what level of disadvantage counts* when we draw that line, even if we use statistics to help define it?"

  6.  **Question:** "Daniels argues justice only requires restoring normal function to protect 'fair equality of opportunity'. But doesn't this dramatically underserve people with congenital disabilities who *never had* 'normal species functioning' to restore? How does the framework account for their claims to resources enabling opportunity?"
      *   **Predicted Answer:** She might argue that while therapy isn't possible, other social supports (assistive tech, accommodations) are still required by justice to achieve fair opportunity, separate from the health mandate. Or that the framework focuses on healthcare justice specifically.
      *   **Follow-Up:** "Doesn't this reveal a fundamental limitation? If justice *does* require providing resources (like advanced prosthetics or neuro-interfaces) to people with congenital conditions to achieve opportunity, how is that conceptually different from 'enhancement' for someone born within the statistical norm? Doesn't it break the tight therapy/enhancement link?"

  7.  **Question:** "Technologies like CRISPR potentially allow us to edit genes *before birth*. Preventing a severe genetic disease in an embryo clearly fits 'therapy'. But what about editing an embryo to give it immunity to common diseases like malaria or HIV, or to significantly boost average lifespan potential? Is that therapy (preventing future disease) or enhancement (exceeding species-typical resilience/lifespan)?"
      *   **Predicted Answer:** She'll likely lean towards calling immunity to specific diseases therapy (preventing dysfunction), but boosting lifespan beyond the current statistical norm as enhancement.
      *   **Follow-Up:** "But isn't *all* preventative medicine about reducing *future* statistical risk? How is editing for malaria immunity fundamentally different from prenatal vitamins preventing neural tube defects? And if lifespan is a function of accumulated disease burden, isn't reducing that burden across the board just very effective preventative 'therapy'?"

  8.  **Question:** "The 'species-typical' baseline isn't static. Eyeglasses, vaccines, and antibiotics now let us function far beyond the historical 'normal' human baseline. Were these interventions initially 'enhancements' that only became 'therapies' as their use shifted the statistical norm? Doesn't this make the classification relative and historically contingent?"
      *   **Predicted Answer:** She'll argue these *restore* function (vision, immune defense) to the species-typical level, even if the *means* are novel. They counteract specific dysfunctions.
      *   **Follow-Up:** "But doesn't widespread use of vaccines fundamentally alter the 'statistical norm' for immune function and lifespan? If we develop safe, widespread cognitive enhancers that become ubiquitous, shifting the average IQ significantly, would correcting someone to the *old* average then become 'therapy' for a newly defined dysfunction? Doesn't this technological feedback loop undermine the stability of the 'species-typical' baseline?"

  **Bonus Strategy:** Frame the aging question slightly differently if she dodges initially: "You've said slowing aging is enhancement, not therapy. Does that mean, under this framework, a 90-year-old with severe dementia is actually functioning 'normally' for their age cohort? And that therefore, efforts to *prevent* that dementia aren't owed as a matter of justice, only treating its symptoms might be?" This forces confronting the counterintuitive implication head-on.

  **Key to Success:** Listen *closely* to her answers. If she retreats to pure description ("Boorse just defines health, normativity comes later"), hammer the fact/value gap and Daniels' reliance on it. If she leans hard on Daniels' opportunity argument, press on why *that specific baseline* defines opportunity. If she makes concessions about fuzziness or the need for other supports, exploit those openings to show the framework isn't sufficient or clear-cut. Good luck!
