  Third, the growth-hormone case is perfect. Identical inputs, different classifications based on statistical deviation alone. She'll distinguish "disease" from "variation," but the follow-up must expose how this punishes biologically unlucky kids while rewarding socially unlucky ones. Bonus if we tie it to how race/gender norms could warp "species-typical" definitions. 

  ...Wait, the user mentioned "LW-adjacent" (LessWrong?) longevity folks. That crowd hates fuzzy boundaries. Maybe sneak in a question about continuous traits (like height) blurring the therapy/enhancement line? 

  Structure-wise: Lead with grounding questions to sound fair, then escalate. Save aging for mid-interview—too early feels ambush-y, too late risks running out of time. Growth-hormone works early; fact/value gap late as the philosophical kill shot. 

