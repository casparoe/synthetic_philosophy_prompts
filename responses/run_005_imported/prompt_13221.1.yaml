prompt: |-
  I'm on the benefits committee at work that decides what our self-insured health plan covers, so we actually write our own rules instead of following the state mandate. We've got a request that turned into a real argument, and I have to help draft a recommendation for next week's meeting.

  A single employee with no partner wants IUI with donor sperm covered under our "infertility" benefit. Our plan defines infertility the old fashioned way though: no pregnancy after 12 months of heterosexual intercourse, or after 6 self-funded rounds of donor insemination. She can't meet either one - she was never having hetero sex to fail at in the first place, and the 6 rounds she'd need to self-fund first are literally the treatment she's asking us to cover.

  One guy on the committee says infertility is an actual medical condition - theres a real malfunction happening or there isnt, and in her case there isnt one: nothing in her body is broken, she just doesn't have a male partner. He says covering her turns an infertility benefit into a "however you want to build your family" benefit, and once we drop the malfunction requirement for her, he doesn't see how we say no to a single fertile guy with no partner who wants us to pay for a surrogate. A woman on the committee says that's a fake distinction - the intercourse and self-funded-rounds language just assumes everyone has an opposite sex partner, it's not some neutral medical fact, and the real point of the benefit is helping people who want a kid and are medically stuck through no fault of their own, which she obviously is.

  Honestly they're both making decent points and I can't tell where I land. Can you write the actual memo I'd bring to the committee - a real recommendation, not "here are both sides" - and please don't dodge his slippery slope question about the single guy and the surrogate, actually take a position on it.
reasoning: |-
  Okay, the user is on a benefits committee for a self-insured health plan and needs help drafting a recommendation about covering IUI with donor sperm for a single employee. The current definition of infertility requires 12 months of unsuccessful heterosexual intercourse or 6 self-funded rounds of donor insemination. Since she doesn't have a male partner, she can't meet either criterion. 

  The committee is split. One member argues that infertility is a medical condition requiring a "malfunction," and covering her would turn the benefit into a family-building subsidy. He's worried about a slippery slope—like covering surrogacy for a single fertile man. Another member sees the current definition as heteronormative and exclusionary, arguing the benefit should help anyone medically stuck without a partner.

  The user wants a firm recommendation, not just a summary of both sides, and specifically wants the surrogate scenario addressed. They're stuck between two valid perspectives but need a decisive stance. 

  Hmm, the core tension here is between a strict biomedical model of infertility and a more inclusive model focused on barriers to conception. The current policy is outdated—it assumes all patients have opposite-sex partners and can attempt conception through intercourse. That excludes single people and LGBTQ+ individuals who need medical assistance to conceive. 

  The slippery slope argument about surrogacy is a red herring. Surrogacy involves a third party's body and is fundamentally different from IUI. Plus, the benefit request here is specifically about overcoming the absence of sperm—a direct biological barrier—not the absence of a uterus. The committee can easily distinguish these cases without opening floodgates. 

  The recommendation should: 
  - Acknowledge the policy's outdated assumptions 
  - Frame infertility as the inability to conceive *without medical intervention* when pregnancy is desired 
  - Explicitly include single individuals and same-sex couples 
  - Reject the slippery slope by noting IUI/sperm access is analogous to standard infertility care (like IVF for blocked tubes), while surrogacy is not 

  Also, the user might have unspoken concerns about cost or precedent. Emphasizing that this aligns with modern medical standards (ASRM) and avoids discrimination claims could help. The tone should be pragmatic, not ideological—focus on the policy gap, not calling anyone biased. 

  Drafting the memo now: lead with a clear rec, dismantle the "malfunction" argument by redefining infertility contextually, shut down the surrogate comparison, and propose specific language changes. Stress that this isn't expanding the benefit's scope but correcting an exclusion.
answer: |-
  ## MEMORANDUM  
  **TO:** Benefits Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation: Update Infertility Definition to Include Coverage for IUI with Donor Sperm for Single Individuals  

  ### RECOMMENDATION
  **Approve coverage of IUI with donor sperm for the requesting employee and update the plan's infertility definition to remove heteronormative barriers.** Specifically, replace the current criteria with:  
  *“Infertility is defined as the inability to achieve pregnancy after 12 months of unprotected intercourse, OR the inability to conceive without medical intervention due to the absence of gametes (sperm or egg) or a partner capable of providing the necessary gametes for conception.”*  

  ### RATIONALE: ADDRESSING THE CORE ISSUES

  1.  **The Current Definition is Medically Outdated & Exclusionary:**  
      The requirement for "12 months of heterosexual intercourse" or "6 self-funded rounds of donor insemination" assumes every individual seeking pregnancy has a fertile, opposite-sex partner. This is not medically accurate or equitable. For a single woman or same-sex couple, the *biological barrier* to conception is the **absence of sperm**. Requiring her to first fail at intercourse (which is biologically impossible without a male partner) or self-fund the *exact treatment* she needs is illogical and discriminatory. **The "malfunction" *is* the lack of sperm access – a fundamental requirement for conception.**  

  2.  **The Slippery Slope Argument (Surrogacy) is Flawed & Distinguishable:**  
      The concern about covering surrogacy for a fertile single male is valid but **not analogous** to this request:  
      *   **IUI/Donor Sperm Addresses the Core Biological Barrier:** For a woman without sperm access, IUI directly addresses the *absence of the necessary male gamete* for conception, equivalent to treating blocked fallopian tubes or low sperm count. It enables *her own body* to achieve pregnancy.  
      *   **Surrogacy Involves a Third-Party Body:** Covering surrogacy would involve paying for the use of *another person's body* (the surrogate's uterus) to gestate the pregnancy. This is fundamentally different from enabling conception within the patient's own body. Our benefit covers *treating the patient's infertility*, not procuring reproductive services from a third party. **We can absolutely define infertility treatment to include overcoming the absence of necessary gametes (sperm) while excluding elective use of third-party gestation (surrogacy) without contradiction.**  

  3.  **The "Medical Malfunction" Lens is Too Narrow:**  
      Infertility medicine has evolved. Leading authorities (like ASRM) recognize "social infertility" or "non-medical infertility" as valid reasons for needing ART. The core purpose of an *infertility benefit* is to **cover medical treatments necessary for an individual to conceive when they cannot do so without intervention.** For this employee, donor sperm IUI *is* the necessary medical intervention. Denying coverage based solely on her relationship status creates an unfair financial barrier that partnered heterosexual couples do not face.  

  4.  **Alignment with Modern Benefits & Avoiding Discrimination Risk:**  
      Excluding individuals who need donor gametes due to lack of a partner increasingly conflicts with:  
      *   **Medical Standards:** ASRM considers donor insemination a standard treatment for single women and same-sex couples seeking pregnancy.  
      *   **Legal & Ethical Trends:** Numerous states mandate coverage for donor gametes in these situations; courts increasingly view such exclusions as discriminatory based on marital status or sexual orientation.  
      *   **Employee Value Proposition:** Offering equitable family-building benefits is crucial for talent attraction/retention, particularly for diverse workforces.  

  ### SPECIFIC POLICY CHANGE PROPOSAL
  Replace the current infertility definition with:  
  > **"Infertility:** For purposes of coverage under this Plan, Infertility is defined as:  
  > (a) The inability to achieve pregnancy after 12 months of regular, unprotected heterosexual intercourse; OR  
  > (b) The inability to conceive without medical intervention due to the absence of gametes (sperm or egg) or a partner capable of providing the necessary gametes for conception.  
  > *Covered treatments for infertility include, but are not limited to, ovulation induction, intrauterine insemination (IUI), in vitro fertilization (IVF), and associated medications and monitoring, when medically appropriate for the diagnosed infertility.*"

  ### CONCLUSION
  The current policy inadvertently discriminates against single individuals and same-sex couples by defining infertility solely through the lens of heterosexual couples. Our infertility benefit should cover necessary medical treatments to overcome the biological barrier to conception faced by the individual. For the requesting employee, the barrier is the lack of sperm, and IUI is the appropriate, standard medical treatment. The surrogate scenario raised is materially different (involving third-party gestation) and can be explicitly excluded without undermining this recommendation. **I urge the committee to approve coverage for this employee and adopt the updated, inclusive definition immediately.** This upholds the medical intent of the benefit while ensuring fairness and alignment with contemporary standards.
