answer: |-
  You've hit upon a genuine and sophisticated point of contention in contemporary philosophy of causation. While Woodward's interventionism undeniably builds upon the counterfactual tradition (especially Lewis's), there are several principled reasons why it's often treated as a distinct research program, not merely a refinement:

  1.  **Fundamental Aims & Motivations:**
      *   **Lewis:** Primarily engaged in *metaphysical reduction*. He sought to analyze causation (a seemingly "thick" relation in the world) in terms of more basic, non-causal concepts: distinct events, counterfactual dependence, and overall similarity of possible worlds. His goal was to provide a reductive, *mind-independent* account of what causation *is*.
      *   **Woodward:** Primarily engaged in *epistemology and methodology*. He aimed to provide an account of causal *explanation*, *discovery*, and *inference* that makes sense of scientific practice, particularly experimental science and causal modeling (e.g., structural equation models, econometrics, randomized trials). His goal is to clarify the *meaning* and *use* of causal claims, especially in contexts where we can *intervene* or imagine intervening. He explicitly avoids a reductive metaphysical ambition, focusing instead on *what it is to represent and reason causally*.

  2.  **The Central Role of "Intervention" and its Specific Constraints:** You're right that an intervention specifies a counterfactual antecedent. However, Woodward imposes very *specific, non-trivial conditions* on what counts as an "intervention" (I) on variable X w.r.t. variable Y:
      *   I must *directly* change X.
      *   I must *break* the causal influence of all *other* variables on X (i.e., isolate X from its normal causes).
      *   I must *not* affect Y *directly*, only *via* X (if at all).
      *   I must *not* be correlated with other causes of Y except via X.
      *   These conditions are designed to *eliminate confounding* – a core problem in causal inference that Lewis's similarity-based semantics doesn't directly address. This transforms the counterfactual from a vague "what if X had been different?" to a precise "what if X were *set* to a value *independently of its normal causes and confounders*?". This precision is crucial for Woodward's methodological goals.

  3.  **Rejection of Overall Similarity:** Woodward explicitly rejects Lewis's reliance on vague, context-sensitive judgments of overall similarity among possible worlds as the basis for evaluating counterfactuals. He argues this leads to problematic context-dependence and ambiguity. Instead, interventionism grounds counterfactuals in the *invariant relationships* captured by causal models under interventions. The truth conditions are tied to the structure of the causal system (the equations/graphs) and what happens under interventions *defined relative to that structure*. This is a fundamentally different *semantics* for causal counterfactuals.

  4.  **The Primacy of Variables & Invariance:** Interventionism shifts the focus from *events* to *variables*. Causation is fundamentally about relationships between variables that remain *invariant* under relevant interventions. This focus on invariance under manipulation is central to Woodward's account of causal explanation and generalization, aligning directly with scientific practice. Lewis's event-based ontology struggles to capture this level of abstraction and generality naturally.

  5.  **Handling Problem Cases (Like Preemption) Reflects Deeper Differences:**
      *   **Lewis's Approach (Original):** Struggled with late preemption. His initial solution involved complex appeals to chains of counterfactual dependence ("quasi-dependence") or extremely fine-grained events, which many found ad hoc and metaphysically dubious. His reliance on similarity judgments made the analysis sensitive to how we describe the events/worlds.
      *   **Woodward's Approach:** Handles preemption relatively cleanly within the framework. An intervention on the preempting cause (e.g., Suzy's throw) *directly* sets its value, breaking its normal causes. If the model correctly represents Billy's throw as being preempted (e.g., via an intermediate variable like "rock in flight path"), then intervening *only* on Suzy's throw will change the outcome (bottle shatters), while intervening *only* on Billy's throw will *not* (because Suzy's rock already hit). The interventionist counterfactual directly picks out the actual cause (Suzy) without needing complex chains or fine-graining. This solution flows *naturally* from the interventionist constraints (isolating the cause) and the structural representation, rather than being a patch applied to a similarity metric.

  6.  **Metaphysical Commitment vs. Pragmatic Focus:** Lewis is committed to a specific, reductive metaphysical picture (Humean supervenience). Woodward is explicitly *non-reductive* and *pragmatic*. He doesn't claim interventions reveal the *metaphysical essence* of causation; he claims they define a *concept* of causation that is maximally useful for explanation, prediction, and control in science. He allows that there might be other legitimate concepts of cause, but argues the interventionist concept is the scientifically central one.

  **Conclusion: Is it a Distinct Research Program?**

  **Yes, in several crucial respects:**

  *   **Different Goals:** Metaphysical reduction (Lewis) vs. Epistemology/Methodology of science (Woodward).
  *   **Different Semantics:** Similarity of worlds (Lewis) vs. Invariance under interventions defined relative to causal structure (Woodward).
  *   **Different Conceptual Primacy:** Events & counterfactual dependence (Lewis) vs. Variables, interventions, & invariance (Woodward).
  *   **Different Treatment of Context/Confounding:** Similarity handles context implicitly/vaguely; Interventions explicitly *define away* confounding through their conditions.
  *   **Different Handling of Problem Cases:** Solutions emerge from core machinery (Woodward) vs. requiring significant amendments (Lewis).

  **However, your core insight is correct and important:**

  *   **Rooted in Counterfactuals:** Interventionism *is* fundamentally a type of counterfactual theory. Woodward acknowledges this debt.
  *   **Privileged Subset:** Interventions *do* define a specific, privileged class of counterfactuals deemed relevant for causal inference.
  *   **Formal Advantages:** Part of Woodward's appeal *is* the tidier formal apparatus (SEMs, graphs) he employs, which handles many problem cases more elegantly than Lewis's original framework.

  **The Verdict:**

  The sharp contrast in surveys is **not *merely* emphasis or bookkeeping**, but reflects genuine differences in philosophical goals, semantic foundations, conceptual tools, and the problems each theory prioritizes solving. Woodward's interventionism represents a significant *pragmatic turn* within the counterfactual tradition, shifting focus from metaphysical reduction to scientific methodology and employing a more precise, structurally-grounded semantics for counterfactuals. It deserves recognition as a distinct research program because it asks different questions, provides different kinds of answers, and integrates with scientific practice in a way Lewis's theory does not. However, acknowledging its distinctiveness doesn't negate its deep counterfactual roots – it's a sophisticated evolution, not a complete revolution. Your classmate's point about preemption illustrates how the *consequences* of these foundational differences manifest in solving specific problems.
