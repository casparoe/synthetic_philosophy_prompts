answer: |-
  That's a fantastic question that cuts right to the heart of Sidgwick's complexity and why he remains such a fascinating figure. You're absolutely right that the juxtaposition is jarring: the meticulous, skeptical analyst of *The Methods of Ethics* versus the man meticulously testing table-rappings. Dismissing the psychical research as mere "quirky Victorian colour" is a profound misunderstanding. Here's why serious scholars *don't* ignore it and why it doesn't necessarily undermine his rigor:

  1.  **It Wasn't a "Side Hobby" - It Was Existential:** For Sidgwick, psychical research wasn't a diversion; it was a *consequence* of the unresolved tension in his ethics. His core problem was the "Dualism of the Practical Reason": he couldn't prove that rational self-interest (egoism) ultimately aligned with rational universal benevolence (utilitarianism). He famously wrote, "The prolonged effort of the human intellect to frame a perfect ideal of rational conduct is seen to have been foredoomed to inevitable failure." This wasn't just an academic puzzle; it caused him deep personal distress and threatened the rational foundation of morality itself.
      *   **The Connection:** Sidgwick saw the *possibility* of an afterlife and post-mortem justice/punishment as the *only potential solution* to this dualism. If the universe was structured so that virtue was ultimately rewarded (even after death) and vice punished, then pursuing the general good *would* align with rational self-interest in the grandest scheme. Psychical research was his attempt to find *empirical evidence* for this necessary cosmic structure. It was a desperate, lifelong search for a foundation for morality that pure reason couldn't provide.

  2.  **It Was Part of His Broader Intellectual Project - Bridging Knowledge Gaps:** Sidgwick lived in an era of massive intellectual upheaval. Science (especially Darwinism) was dismantling traditional religious foundations for morality. Sidgwick, though deeply skeptical of dogma, wasn't a materialist. He believed that if traditional religion was crumbling, *some* form of non-material reality or post-mortem existence needed investigation if ethics was to have a secure foundation. The Society for Psychical Research (SPR) wasn't founded for kicks; it was founded (by Sidgwick, Myers, Gurney, etc.) with the explicit goal of applying rigorous, scientific methods to phenomena traditionally claimed by religion or dismissed as superstition. They aimed to *demarcate* truth from fraud using evidence and reason.

  3.  **It Showcased His *Methodological* Rigor Applied Elsewhere:** This is crucial. Sidgwick approached psychical research with the *same* scrupulous skepticism and demand for evidence that he applied to ethics. The SPR under his leadership:
      *   Developed meticulous protocols for investigating mediums (attempting controlled conditions, exposing frauds like Eusapia Palladino).
      *   Systematically collected and cross-verified spontaneous case reports (leading to *Phantasms of the Living*).
      *   Critically analyzed evidence, often concluding it was insufficient or fraudulent.
      *   **He remained deeply skeptical throughout.** He didn't "believe" in ghosts; he was *testing the hypothesis* that evidence for survival existed. He famously said he would give ten years of his life to see a ghost that conversed rationally. His despair near the end wasn't about failing to find ghosts *per se*, but failing to find the evidence he needed to resolve his ethical dualism. His rigor was in the *process*, not in presupposing the *outcome*.

  4.  **It Reveals the *Person* Behind the Philosophy:** Sidgwick wasn't a logic machine. He was a deeply serious, morally anguished man grappling with the biggest questions. His psychical research reveals the profound *personal stake* he had in his philosophical conclusions. It shows the human cost of intellectual honesty – the pain of admitting reason couldn't provide a complete answer to how we *should* live. Ignoring it paints an incomplete, sanitized picture of the philosopher.

  5.  **Context is Everything - Victorian Crisis of Faith:** What seems like "quirkiness" to us was, for many serious Victorians (including brilliant minds like William James, Alfred Russel Wallace, and even briefly, J.J. Thomson), a desperate attempt to find a rational basis for spirituality and ethics in a post-Darwinian world. Sidgwick was operating within the intellectual currents of his time, trying to use the tools of reason and science to explore the very boundaries of what reason and science could know.

  **Does it Say Something Bad About His Rigor?**

  *   **On Process:** No, not really. His *method* in psychical research mirrored his philosophical rigor: demanding evidence, critical analysis, exposing fraud, acknowledging inconclusive results. He applied his skeptical toolkit to a different domain.
  *   **On Judgment/Target:** Here, it's more complex. He devoted immense energy to a field that, with hindsight, we know was fundamentally flawed. The phenomena he investigated were either fraudulent, misinterpreted, or based on psychological mechanisms not understood at the time (suggestion, dissociation, sensory illusions). He was ultimately chasing an answer he *needed* to find, which perhaps made him persist longer than pure evidence warranted. One could argue that his *desperate hope* for a solution to the dualism clouded his judgment about the *likelihood* of finding valid evidence in that particular domain.
  *   **The Irony:** The tragic irony is that Sidgwick, the ultimate rationalist, was driven by his rational despair into investigating the irrational, hoping to find a rational basis for the non-rational (an afterlife) to save his rational ethics. The rigor remained, but the object of study was, as we now know, a mirage.

  **In Conclusion:**

  Scholars bring up Sidgwick's psychical research not as trivia, but because:

  1.  It is **intellectually inseparable** from his core ethical dilemma and his search for a foundation for morality.
  2.  It demonstrates the **depth of his personal commitment** and the existential stakes he saw in philosophy.
  3.  It showcases the **application of his rigorous methods** to a radically different problem set.
  4.  It provides **essential context** for understanding his era and his profound crisis of meaning.
  5.  It **humanizes** a deeply serious and conflicted thinker.

  While his decades-long pursuit ended in what we now see as a dead end, it stemmed from the very same relentless intellectual honesty that made *The Methods of Ethics* so powerful and frustratingly unresolved. It wasn't a lapse in rigor; it was rigor tragically applied in a direction where no satisfying answer could be found, driven by the profound implications of his own philosophical conclusions. It makes him not less of a philosopher, but a more complex, human, and ultimately tragic one.
