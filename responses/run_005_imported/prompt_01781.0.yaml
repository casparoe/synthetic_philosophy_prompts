answer: |-
  G. E. Moore's analysis of aesthetic appreciation and personal affection in *Principia Ethica* hinges crucially on the **Principle of Organic Unities**, which resolves the apparent tension between his claim for the superiority of personal affection and his concession about admiring "pure" mental qualities. Here's a breakdown of the comparison, the role of organic unity, and an evaluation of his argument:

  1.  **The Two Goods Compared:**
      *   **Aesthetic Appreciation of Beauty:** This is an organic unity comprising:
          *   *Cognition:* The apprehension of beautiful qualities in an object (e.g., a landscape, a painting, a person's physical form).
          *   *Appropriate Emotion:* The feeling of admiration or pleasure directed towards those beautiful qualities.
          Moore argues that the *whole* (cognition + emotion) is intrinsically good, and its value is greater than the sum of the values of the cognition alone and the emotion alone (if they could even exist independently in a valuable way).

      *   **Personal Affection:** This is also an organic unity, but far more complex:
          *   *Cognition 1:* The apprehension of the *mental qualities* of the beloved person (their thoughts, feelings, character).
          *   *Cognition 2:* The apprehension of the *beautiful qualities* of the beloved's *consciousness itself* (the "beauty" of their mental states).
          *   *Appropriate Emotion:* The feeling of love directed towards the *person* possessing these mental qualities and beautiful consciousness.
          *   *A Crucial Addition:* Personal affection typically includes the *reciprocal affection* of the beloved. Moore emphasizes that the love is directed towards a *person* who is also capable of loving in return.

  2.  **The Apparent Tension:**
      *   **Claim 1:** Personal affection is *far more valuable* than aesthetic appreciation.
      *   **Concession:** Admiring someone's mental qualities *alone*, abstracted from their bodily expression and without the context of mutual affection (i.e., admiring a "disembodied mind"), may be worth no more, or even less, than the appreciation of physical beauty.
      *   **Tension:** If admiring mental qualities alone (a key *cognition* in personal affection) might be less valuable than physical beauty appreciation, how can the whole complex of personal affection be *far more* valuable?

  3.  **Resolution via the Principle of Organic Unities:**
      The Principle of Organic Unities states that **"The value of a whole must not be assumed to be the same as the sum of the values of its parts."** This principle is absolutely central to dissolving the tension:
      *   **The Concession Explained:** Moore's concession applies to a *fragment* of personal affection – the isolated cognition of mental qualities, stripped of its essential context within the organic whole. He argues that this isolated cognition, without the emotion of love directed at the *person*, without the appreciation of the *beauty* of that consciousness, and crucially, without the *embodiment* and *reciprocity*, lacks significant value. It might even be less valuable than appreciating physical beauty because the latter is a simpler, complete organic unity (cognition of physical beauty + admiration).
      *   **The Superiority of Personal Affection Explained:** The immense value of personal affection arises *only* when all the elements combine into the *complete organic whole*:
          *   The cognition of mental qualities *plus* the cognition of the *beauty* of that consciousness.
          *   The emotion of love directed at the *whole person* who possesses these qualities.
          *   The *embodiment* of those mental qualities (their expression in face, voice, gesture), linking the mental and physical beauty.
          *   The *reciprocity* of affection – loving someone who loves you in return. This mutual recognition and shared feeling creates a complex, dynamic unity of enormous value.
      *   **The Whole vs. The Part:** The concession deals with a *part* (cognition of disembodied mental qualities) that, in isolation, has low or negligible value. However, when this part is integrated into the vastly more complex organic unity of *personal affection* – including the other cognitions, the appropriate emotion of love, embodiment, and reciprocity – the resulting *whole* possesses a unique and immense intrinsic value that vastly outstrips the simpler organic unity of aesthetic appreciation. The value emerges from the *specific combination*, not from simply adding up the values of isolated components.

  4.  **Evaluation: Does the Argument Succeed?**
      *   **Success within Moore's Framework:** Moore's argument largely succeeds *on its own terms* and consistent with the Principle of Organic Unities.
          *   He successfully identifies why the concession about admiring "pure" mental qualities doesn't undermine the ranking: it targets an incomplete and artificial fragment, not the true organic whole of personal affection.
          *   He plausibly argues that the complete whole of personal affection, incorporating mutual love and the appreciation of beautiful consciousness embodied in a person, is a richer, more complex, and therefore potentially far more valuable state than the simpler appreciation of inanimate or non-reciprocating beauty.
          *   The Principle of Organic Unities provides the necessary logical tool to reconcile the high value of the complex whole with the low value of one of its potential components in isolation.
      *   **Potential Weaknesses/Challenges:**
          *   **The Weight of Reciprocity:** Moore places enormous weight on reciprocity as a value-multiplier. One could question whether non-reciprocal love (e.g., loving someone unaware of you, or loving someone who cannot return affection) might still hold significant, even great, intrinsic value, even if less than mutual love. Moore's hierarchy might undervalue such states.
          *   **The Necessity of Embodiment:** His claim that admiring disembodied mental qualities is low-value relies heavily on the idea that consciousness is best (or only truly) appreciated *through* its physical expression. Some might argue that deep appreciation of abstract ideas or the character revealed through words/writings (closer to his "disembodied" case) *can* hold very high value, challenging his sharp distinction.
          *   **Subjectivity of "Beautiful Consciousness":** Identifying the "beauty" of someone's mental qualities is highly subjective compared to (relatively) more objective standards of physical beauty. This raises questions about the stability of the value judgment.
          *   **The Concession as Symptom:** While resolved logically, the concession highlights that the *cognitive component* of personal affection (apprehending mental qualities) *in itself* isn't the primary source of value. The value arises overwhelmingly from the emotional bond (love) and its reciprocity within the whole. This might lead some to question if the *cognition* of mental qualities is as essential to the *unique* value as Moore claims, or if the core value lies more in the mutual affection itself.

  **Conclusion:**

  Moore successfully uses the Principle of Organic Unities to resolve the apparent tension. He demonstrates that the concession regarding the low value of admiring "pure" mental qualities applies only to an incomplete fragment artificially isolated from the essential elements (love for the person, appreciation of the beauty *of* that consciousness, embodiment, and especially reciprocity) that constitute the true organic whole of personal affection. It is this complete, complex whole, not its dissected parts, that possesses vastly superior intrinsic value compared to aesthetic appreciation.

  While his overall argument succeeds within his framework by logically reconciling the points, potential weaknesses remain. These lie primarily in the heavy emphasis on reciprocity as a value-multiplier (potentially undervaluing non-reciprocal love), the strict requirement for embodiment (potentially undervaluing abstract appreciation of mind), and the subjectivity involved in judging "beautiful consciousness." However, the concession about disembodied mental qualities, properly understood as referring to an incomplete part, does not fundamentally undermine his ranking of the *complete* organic unity of personal affection above aesthetic appreciation. The value emerges from the unique, irreducible combination within the whole.
