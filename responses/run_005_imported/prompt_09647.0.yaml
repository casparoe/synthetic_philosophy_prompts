  Key imagery might include: diagnostic criteria literally rewritten in different colored inks across editions, a patient's posture shifting to match textbook illustrations, the clinician's own reflection warping in a monitor screen. The ending shouldn't be neat - maybe the doctor still uses the revised diagnosis while knowing it's contaminated, perpetuating the loop. 

  Must avoid making the patient a victim or the doctor a villain. The tragedy is systemic - well-intentioned frameworks taking on lives of their own. The user's "freaked out" tone suggests the climax should emphasize creeping ontological dread rather than shock value. That quiet moment when you realize the rocks are staring back.
