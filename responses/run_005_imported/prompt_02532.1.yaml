answer: |-
  That's an incredibly sharp question from your roommate—and you're right to sense that your professor's "CDT wins, case closed" narrative is an oversimplification of a famously thorny debate. The ongoing literature isn't academic wheel-spinning; it reveals deep, unresolved problems in decision theory that Death in Damascus (DiD) exposes. Here’s why it’s still contentious:

  ### 1. **The "Ought Implies Can" Problem for CDT**
     CDT says: *"Treat Death's choice as fixed (since your decision doesn't *cause* Death to be in a city retroactively), then pick the city where you're less likely to die."*  
     - If Death predicts you’ll **stay**, you should **flee** (utility: life).  
     - If Death predicts you’ll **flee**, you should **stay** (utility: life).  
     **But**: CDT doesn’t tell you *what to do* before knowing Death’s prediction—it only says *conditional* on the prediction, the other action is better. This leads to **instability**: whichever choice you make, CDT retroactively says you should have done the opposite!  

     This violates **ratifiability**: a decision is "ratifiable" if, upon choosing it, you wouldn’t prefer to switch. CDT’s recommendation *isn’t ratifiable* in DiD. If you choose Damascus, CDT says "you should have fled!" and vice versa. So CDT advises an action it *simultaneously* deems counterfactually worse. This paradox (highlighted by Harper himself in later work) makes CDT feel self-undermining.

  ### 2. **Mixed Strategies Break CDT**
     What if the man flips a fair coin to decide?  
     - Death (a perfect predictor) knows the coin outcome and waits in the chosen city.  
     - The man’s survival chance is 50%—strictly better than 0% if he picks purely.  
     **Problem**: CDT struggles to endorse mixed strategies.  
     - *Causal* analysis says: "Given Death’s choice, fleeing/staying has 0% survival."  
     - But *before* acting, a mixed strategy dominates. CDT lacks tools to evaluate *plans* (like randomization) vs. *acts* (pure choices). EDT, ironically, handles this better by recognizing the correlation between randomness and survival.

  ### 3. **The "Tickle Defense" and EDT’s Revival**
     EDT says: *"Staying is evidence Death is in Damascus (bad), fleeing is evidence Death is in Aleppo (bad), so both options suck equally."* Critics called this "fatalism."  
     But sophisticated EDT proponents (e.g., Arif Ahmed) argue:  
     - If there’s a "tickle" (internal signal) *causing* your choice and *correlated* with Death’s prediction, EDT *can* advise fleeing if the tickle makes fleeing feel "safer."  
     - In modern terms: EDT + **causal modeling** (using Bayes nets) can sometimes mimic CDT’s good advice while avoiding DiD’s paralysis.  

  ### 4. **Newer Theories Complicate the Picture**
     DiD became a testing ground for *new* frameworks:  
     - **Updating CDT (e.g., Gallow 2020)**: What if you *learn* your own propensity to choose? CDT must then update beliefs about Death’s prediction mid-decision.  
     - **Functional Decision Theory (FDT)**: Treats decisions as *outputs of a general algorithm*. FDT says: "Choose the algorithm that, if *always followed*, gives the best outcome." In DiD, FDT may recommend a mixed strategy or even accepting fate—prioritizing consistency over causal counterfactuals.  
     - **Ambiguity in "Causation"**: If Death’s prediction *logically necessitates* your choice (in a deterministic universe), is your choice truly "causally independent"? Philosophers still debate this.

  ### 5. **The Real Stakes: What Counts as "Rational"?**
     DiD isn’t about fleeing Death—it’s a metaphor for dilemmas like:  
     - **Predictive policing**: If an algorithm predicts you’ll commit a crime, does avoiding the crime scene look suspicious?  
     - **AI alignment**: How should an AI act if its actions are predicted by a rival AI?  
     The debate continues because **no theory handles all cases perfectly**:  
     - CDT "solves" DiD only by ignoring the dynamical inconsistency (ratifiability).  
     - EDT handles mixed strategies but stumbles on "smoking lesion" problems.  
     - FDT is promising but highly abstract.

  ### Why Your Professor Framed It Simply
  Introductory courses often present DiD as a *motivation* for CDT over EDT because:  
  - It starkly shows EDT’s "fatalism" in symmetric predictors.  
  - CDT *seems* to give clear advice *if* you ignore the ratifiability hole.  
  But the literature you found reveals the **messy reality**: CDT’s "solution" creates new problems that theorists are still untangling 45 years later.

  ### In short:
  - **Your roommate is wrong** that this is settled; DiD is a live stress test for decision theories.  
  - **Your professor isn’t "wrong"** but gave a pedagogical simplification.  
  - **The debate persists** because DiD exposes flaws in *all* theories—including CDT—and pushes decision theory toward greater nuance. It’s not about "CDT vs. EDT" anymore; it’s about building theories that don’t break under paradoxes of prediction and rationality.

  If your roommate remains skeptical, ask her: *"If you’re told a perfect predictor will punish you for whatever you choose, how would *you* decide—and what principle would justify that?"* That’s why decision theory isn’t a waste of time 😉.
