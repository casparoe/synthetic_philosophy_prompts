prompt: |-
  I write about science and the ideas that shape it, and lately much of that work has meant covering the replication crisis in psychology. Partly on the strength of a piece I wrote on p-hacking and the preregistration movement, a psychology department recently invited me onto its newly formed Open Science Committee as the outside, non-specialist member. The committee has just run into its first genuinely hard case, and both factions have asked me to draft the memo, since neither entirely trusts the other to state its opponent's position fairly.

  Two years ago the department pre-registered a well-powered Registered Report attempting to replicate a well-known ego-depletion effect, committing in the Stage 1 protocol to a one-tailed t-test at α = .05 with a specified sequential stopping rule. The finished study lands at p = .058 — just outside the pre-registered threshold, which by the letter of the protocol makes it a null result and nothing more. The complication is that one committee member, a Bayesian statistician, reran the same data (a reanalysis that was not itself part of the pre-registered plan) and reports a Bayes factor of roughly 8-to-1 favoring the null. She wants the write-up and any press release to describe the effect as actively disconfirmed rather than merely "not significant," and points out that her method isn't even sensitive to the stopping rule the frequentist plan specified so carefully in advance. Two other members insist we report exactly what was pre-registered and nothing else, arguing that introducing a different statistical framework after seeing the data reopens precisely the interpretive latitude Registered Reports exist to close off, whatever that framework's merits in the abstract.

  Could you draft the memo I'll circulate to the department chair before we meet with the full faculty next month? I need a specific, defensible recommendation for how this result should be characterized and reported, ideally a standing rule the committee could apply the next time this situation comes up, and real engagement with the Bayesian statistician's argument rather than a default retreat to "the protocol is the protocol."
reasoning: |-
  Okay, let me start by understanding the core issue here. The user is part of an Open Science Committee dealing with a tricky situation. A pre-registered study on ego-depletion got a p-value of 0.058, just above the pre-registered threshold of 0.05. The protocol specifies a one-tailed t-test, so technically it's a null result. But a Bayesian member reanalyzed the data, finding a Bayes factor of 8 in favor of the null. She wants to report the effect as disconfirmed, not just not significant. Others insist on sticking strictly to the pre-registered plan to avoid post-hoc analysis.

  First, I need to balance the principles of pre-registration with valid statistical arguments. Pre-registration aims to prevent p-hacking and data dredging, so deviating might set a bad precedent. But the Bayes Factor here is strong evidence for the null, which the frequentist approach can't provide. The stopping rule issue is key because the Bayesian method isn't affected by it, whereas the t-test is.

  The user needs a memo that addresses both sides fairly. They want a standing rule for future cases. So the recommendation must respect the pre-registration while acknowledging the Bayesian result without letting it override the protocol. Including the Bayesian analysis as supplementary but labeling it exploratory makes sense. That way, it's transparent but doesn't replace the primary analysis.

  Also, the committee's credibility is at stake. If they dismiss the Bayesian argument outright, it might seem rigid. But if they change the conclusion based on an unplanned analysis, it undermines pre-registration. The memo should emphasize transparency and caution in interpreting both results. Highlighting the Bayes Factor as additional context but not the primary finding could be a middle ground.

  For the standing rule, specifying that any deviations must be pre-registered or clearly marked as exploratory is important. Future protocols could include Bayesian methods upfront. This case shows the value of considering multiple methods in the planning stage. The memo should also stress that "no effect" isn't the same as "evidence for no effect" in frequentist terms, which the Bayes Factor provides.

  I should check if the Bayes Factor calculation is correct and if the prior used is reasonable. But since the user might not have those details, the memo can recommend verifying that in the supplementary materials. The key is maintaining the integrity of the pre-registered plan while enriching the discussion with additional analyses, clearly labeled.
answer: |-
  ## Memorandum: Recommendation for Reporting Pre-Registered Ego-Depletion Replication  
  **To:** Department Chair, Psychology Department  
  **From:** Open Science Committee (via [Your Name], External Member)  
  **Date:** October 26, 2023  
  **Subject:** Reporting Protocol for Pre-Registered Study (p = .058) & Bayesian Reanalysis (BF₁₀ ≈ 0.125)  

  ### Background
  The committee is tasked with resolving how to characterize results from our pre-registered Registered Report (RR) replication of the ego-depletion effect. The Stage 1 protocol committed to:  
  - **Primary Analysis:** One-tailed t-test (α = .05)  
  - **Stopping Rule:** Pre-specified sequential design  
  - **Interpretation Threshold:** p ≤ .05 supports replication; p > .05 is a null result.  

  The observed result (**p = .058**) narrowly misses the pre-registered significance threshold. A committee member subsequently conducted an unplanned Bayesian reanalysis, yielding a Bayes Factor of **BF₁₀ ≈ 0.125 (8:1 for H₀)**, arguing this warrants reporting "active disconfirmation."  

  ### Core Conflict  
  1. **Bayesian Position:** The BF₁₀ provides direct evidence *for* the null hypothesis, is unaffected by the stopping rule, and offers a more intuitive interpretation than NHST. Ignoring it undersells the evidence against the effect.  
  2. **Pre-Registration Purist Position:** Deviating from the pre-registered plan—*especially* by introducing a new statistical framework post-hoc—undermines RR principles. It reintroduces researcher degrees of freedom and compromises the study’s credibility.  

  ### Recommendation: The Dual-Layer Reporting Approach  
  **We recommend the study report adhere strictly to the pre-registered frequentist analysis as the primary result, while incorporating the Bayesian analysis as a transparent, supplementary exploration.**  

  #### 1. **Primary Result (Pre-Registered Framework):**  
     - State unequivocally: **"The pre-registered one-tailed t-test did not reach statistical significance (p = .058). Per our Stage 1 protocol, this is interpreted as a failure to replicate the ego-depletion effect under the specified experimental conditions."**  
     - **Do not** claim "active disconfirmation" or "evidence for the null" in primary results, abstracts, or press releases.  

  #### 2. **Supplementary Bayesian Analysis:**  
     - Include a dedicated section: **"Post-Hoc Bayesian Reanalysis."**  
     - Report: "An unplanned Bayesian analysis yielded BF₁₀ ≈ 0.125 (8:1 favoring H₀ over H₁), suggesting moderate evidence for the absence of the ego-depletion effect under the specified prior model. *This analysis was not pre-registered and should be interpreted as exploratory.*"  
     - **Contextualize limitations:** Note that while Bayesian methods are insensitive to stopping rules, post-hoc analyses risk bias. Specify the prior distribution used and justify its appropriateness.  

  #### 3. **Discussion Nuance:**  
     - Contrast frameworks explicitly:  
       > "Whereas our pre-registered frequentist analysis found insufficient evidence to reject the null (p = .058), a post-hoc Bayesian analysis suggested positive evidence *for* the null (BF₁₀ ≈ 0.125). This divergence highlights how methodological choices influence interpretations near decision thresholds. Crucially, only the frequentist approach was vetted pre-study to control Type I error under our stopping rule."  
     - **Avoid overstatement:** Emphasize that neither result "proves" the null. The Bayesian result supports absence *under the tested model*, while the frequentist result indicates insufficient evidence for the effect.  

  ### Standing Rule for Future Cases  
  For all Registered Reports in this department:  
  1. **Primary Interpretation** must follow the pre-registered statistical plan. Deviations forfeit the RR’s guaranteed publication.  
  2. **Unplanned Analyses** may be included *only* if:  
     - Clearly labeled "exploratory," "post-hoc," or "unregistered."  
     - Separated from primary results.  
     - Accompanied by justification for methodology (e.g., prior choice for Bayes Factors).  
  3. **Bayesian Methods** should be encouraged *at Stage 1*. Authors may pre-register Bayes Factor thresholds (e.g., BF₁₀ > 10 for H₁; BF₁₀ < 0.1 for H₀) alongside or instead of frequentist tests.  

  ### Why This Balances Both Concerns  
  - **Upholds Pre-Registration:** The RR’s core strength—eliminating analytic flexibility—is preserved. The primary claim is protocol-compliant.  
  - **Acknowledges Bayesian Insight:** The BF₁₀ is shared transparently, enriching discussion without overriding the design.  
  - **Mitigates "p = .058" Misinterpretation:** The Bayesian result cautions against dismissing the null as "undetected but present."  
  - **Sets a Precedent:** Future committees can reference this case when evaluating post-hoc analyses.  

  ### Conclusion  
  Pre-registration’s discipline must remain paramount, but open science also demands intellectual honesty about *all* evidence. By clearly distinguishing pre-registered inferences from exploratory follow-ups, we honor both the process and the nuance of statistical reasoning. This approach maintains the RR’s integrity while showcasing rigorous self-reflection—a model for resolving contentious results.  

  **Recommended Vote:** Approve the Dual-Layer Reporting Approach for this study and adopt the Standing Rule for future RRs.  

