answer: |-
  You've nailed the core tension in promise theory beautifully. Hume's "transubstantiation" critique is indeed devastating for pure will-based theories: you can't bootstrap an obligation *ex nihilo* just by saying "I promise." Scanlon's Principle F (from *What We Owe to Each Other*) attempts an elegant end-run around this by grounding promissory obligation in the *harm* of manipulating expectations and causing reliance losses. But you're right to smell circularity – Kolodny, Wallace (and others like Shiffrin) have pushed hard on this. Let's break it down:

  **1. Hume's Bootstrapping Worry (The Target):**
     *   **The Claim:** Promising magically creates a *new*, *binding* moral obligation simply by uttering words expressing the will to be bound.
     *   **The Problem:** This assumes the very binding force it needs to explain. *Why* should expressing my will in this specific way create an obligation? It's like saying "Abracadabra creates obligation!" without explaining *how* or *why* "Abracadabra" has that power. It's question-begging.

  **2. Scanlon's Principle F (The Proposed Solution):**
     *   **Principle F:** "If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A's not doing X); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then, in the absence of special justification, A must do X unless B consents to X's not being done."
     *   **The Escape Route:** The obligation doesn't come from the *will* or the *words* themselves. It comes from the *wrongness of the act* A performs if they *then* don't do X. By deliberately inducing reliance based on the expectation they've created (via steps 1-6), A would be:
          *   **Manipulating B's expectations** (acting in bad faith).
          *   **Causing B a harm** (the loss incurred due to reliance).
          *   **Failing to prevent a harm they deliberately set B up to suffer**.
     *   **No Magic Words:** The words "I promise" are just a particularly clear and efficient way to satisfy conditions (1)-(6). The moral force comes from the *consequences* of breaking the induced reliance, not the utterance itself.

  **3. The Circularity/Objection (Kolodny, Wallace, etc.):**
     *   **The Crux:** Where does the promisee's (B's) *initial trust/reliance* come from? For Principle F to *work*, B has to believe that A creating the expectation *actually gives A a reason to fulfill it*. But why would B believe that *unless they already believe promising creates an obligation*?
     *   **The Loop:**
          1.  For A to be obligated (via Principle F), B must rely *because* A created the expectation (conditions 1-6).
          2.  But for B to rely *based on that expectation*, B must believe that A creating the expectation *binds* A (i.e., that Principle F is true/operative).
          3.  Therefore, B's reliance seems to *presuppose* the very obligation Principle F is supposed to *explain*.
     *   **The Relocation:** It seems like Scanlon hasn't eliminated the bootstrapping; he's just moved it from the *promisor's will* to the *promisee's belief*. The obligation depends on the promisee believing the obligation exists *before* the specific promise is made. How does *that* belief get justified without circularity? Isn't *that* belief the thing needing explanation? This is the "expectations costume" you mentioned.

  **4. Can Scanlon Escape? Possible Defenses & Counter-Defenses:**

  *   **Scanlon's Response (Foreseen Reliance, Not Trust in Obligation):** Scanlon argues B's reliance isn't primarily based on *trust in the binding force of the promise itself*, but on **trust in A's character and intention to act according to Principle F**. B relies because they believe A is a moral agent who recognizes the general wrongness defined by Principle F (manipulating expectations/harming through induced reliance). B trusts A *as a moral person*, not because of a mysterious obligation conjured by words.
      *   **Counter:** Critics argue this just pushes the question back: Why does B believe A recognizes Principle F as binding? Isn't *that* belief equivalent to believing in the obligation? And how did *Principle F itself* become binding in the first place? Isn't *its* justification the ultimate bootstrapping problem?

  *   **The Social Practice Gambit (Implicit in Scanlon):** Principle F gains its traction within a social context where people *generally* accept and act on it. B relies because they observe that *in their community*, people who create expectations via Principle F conditions *usually fulfill them*, and those who don't are criticized. The obligation arises from the *shared practice* and the *harm of undermining it*.
      *   **Counter (Humean Echo):** This sounds suspiciously like grounding the obligation in the *conventions* of the practice itself. Hume would likely retort that this merely describes *how* promising works socially, not *why* the convention creates a *genuine moral obligation*. Why *should* we uphold *this* convention? Isn't the wrongness still needing explanation? Kolodny/Wallace might add that the practice only works *because* participants believe it's obligatory, recreating the circularity at the social level.

  *   **The Harm is Real (Scanlon's Core):** Scanlon would emphasize that regardless of the *origin* of B's belief, the *harm* A causes by deliberately inducing reliance and then reneging is *objectively* wrong. It's a distinct kind of manipulation and betrayal. Principle F identifies *that* wrong, and promising is just a paradigm case. The obligation flows from the wrongness of the *act of betrayal*, not from the prior belief in obligation.
      *   **Counter:** This is powerful, but the objection persists: Why does *this specific act* (inducing reliance via Principle F conditions) cause a *distinct, binding obligation*? Why isn't it just a case of being inconsiderate or mildly deceptive? The "binding" force seems to require the *social context* where such inductions are *understood* to create strong obligations, bringing us back to the practice.

  **Conclusion: Relocation, Not Full Escape (But Meaningful Progress?)**

  *   **Does Principle F *genuinely escape* Hume's bootstrapping?** Probably **not entirely**. The Kolodny/Wallace objection is potent. The need for the promisee's reliance, which seems to depend on a pre-existing belief in the binding nature of the practice or Principle F itself, recreates a form of the circularity. The "conjuring" is relocated from the individual's will to the social/intersubjective level of shared understanding and expectation.
  *   **Does it *just* relocate it?** It's more nuanced than that. Principle F makes **significant progress**:
      *   It **demystifies** the source: Obligation stems from the *wrongness of harming others through deliberate manipulation of their agency* (inducing reliance then dashing it), not from magical will-power.
      *   It **integrates** promissory obligation into a broader moral landscape (duties regarding expectations, harm, manipulation) rather than treating it as a unique, inexplicable phenomenon.
      *   It provides a **clearer account** of *when* promises are binding (when all the reliance-inducing conditions are met) and *why* breaking them is wrong (the specific harm done).
  *   **The Residual Problem:** Scanlon successfully grounds the *content* of the obligation (don't harm via induced reliance) in a more fundamental wrong. However, the *specific, strong, binding force* attached *precisely* to the act of promising (or satisfying Principle F conditions) still seems to depend on a social context where that act *is recognized* as creating such a force. Explaining how *that* recognition arises *without* presupposing the obligation remains the challenge. Hume's ghost whispers that the binding force of the *convention itself* is the ultimate unexplained explainer.

  **In essence:** Principle F brilliantly shifts the ground from mysterious will-power to concrete harm and manipulation. It dissolves *some* of the mystery. But the question of how the *practice* of promising (or Principle F compliance) acquires its *distinctive normative force* in the first place, such that promisees feel entitled to rely *in that strong way*, still involves a form of bootstrapping at the level of social norms. Scanlon relocates and refines the problem rather than definitively solving Hume's deep worry about conjuring obligations from thin air. The debate continues!
