  → Social utility = weighted sum of individual VNM utilities + constant
  ...with weights non-negative via Pareto weak preference.

  Now Sen's objection: VNM utilities are only affine-transform unique (scale and zero point arbitrary per person), while utilitarianism requires comparable cardinal units. The theorem gives us a mathematical sum, but is it summing *welfare*? Sen says no - we've smuggled in interpersonal comparability without justification.

