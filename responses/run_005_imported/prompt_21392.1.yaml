prompt: |-
  I've followed discussions of evidential cooperation in large worlds (ECL) on the EA Forum and LessWrong since back when Oesterheld's argument was still commonly going by "multiverse-wide superrationality," and one part of the standard case has never quite clicked for me. The usual motivation leans on evidential decision theory: choosing to act cooperatively toward the values of distant, causally disconnected agents counts as evidence that relevantly similar agents elsewhere are doing likewise, so the policy pays off in expectation across a sufficiently large or infinite population even without any causal link between the parties. Yet most people making this argument are otherwise committed updateless or functional decision theorists, precisely because they think EDT gets cases like the smoking lesion problem wrong. Could you explain whether ECL's cooperative payoff genuinely depends on EDT-style evidential reasoning, or whether an FDT/UDT agent can recover the same recommendation through the logical-correlation machinery FDT ordinarily reserves for Newcomb-like cases? And if it's the latter, what exactly plays the role that "running the same algorithm" plays in a standard Newcomb case, given that ECL is explicitly meant to cover agents with very different values -- and presumably rather different reasoning procedures too?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're familiar with Evidential Cooperation in Large Worlds (ECL) and its roots in evidential decision theory (EDT). But they're confused because proponents of ECL often prefer updateless or functional decision theories (FDT/UDT), which criticize EDT in cases like the smoking lesion. The core issue is whether ECL's cooperative payoff relies on EDT or if FDT/UDT can achieve the same result through logical correlations.

  First, I need to recall how ECL traditionally uses EDT. EDT says cooperating provides evidence that others cooperate, leading to better outcomes in large populations. But FDT/UDT reject EDT's handling of spurious correlations, like in the smoking lesion. So the user is questioning the consistency here.

  The user’s deeper concern might be about the coherence of ECL under FDT/UDT. They mention agents with different values and algorithms, which complicates logical correlations. Standard Newcomb problems assume identical algorithms, but ECL deals with diversity. So how does FDT/UDT justify cooperation without that?

  I should break down the FDT/UDT approach to ECL. UDT's updatelessness is key—it commits to a policy before knowing its position. This avoids the indexical problem. Then, logical correlation: even with different values, agents might recognize mutual benefit in cooperation. The acausal link isn't from identical code but from abstract decision theories realizing they're in a similar setup.

  The user might also wonder about the practical implementation. How do diverse agents coordinate? I need to explain the role of decision theory abstraction. FDT/UDT agents consider what happens if all agents following a similar reasoning process cooperate. It's about strategic reasoning convergence, not code similarity.

  Another point: the user’s mention of "logical-correlation machinery" suggests they want a technical link. FDT's logical correlation comes from counterfactuals where cooperation is a fixed point. If an agent defects, others might too, leading to worse outcomes. This creates interdependence even without causal links.

  I should clarify that ECL under FDT/UDT doesn't require identical algorithms but a shared recognition of the decision structure. Agents with different values might still cooperate if they see that mutual cooperation benefits their respective goals. The example with two agents, one valuing X and the other Y, shows that mutual cooperation can satisfy both if they need each other's help.

  The user's identity seems to be someone well-versed in decision theory discussions on EA and LessWrong. They’ve followed ECL from its early days, so they need a nuanced explanation. Their unspoken need might be reconciling their interest in ECL with their skepticism towards EDT, ensuring that supporting ECL doesn't force them to accept EDT's flaws.

  In summary, the answer must show that FDT/UDT can ground ECL without EDT's issues by using updateless policies and logical correlations based on decision-theoretic reasoning, even across diverse agents. Highlighting the shift from identical algorithms to strategic interdependence is crucial here.
answer: |-
  Your skepticism is well-founded and cuts to a core conceptual tension in ECL. You're right that the *standard exposition* often leans on EDT-style evidential reasoning, seemingly at odds with the FDT/UDT commitments of its proponents. However, the cooperative payoff in ECL **can be robustly recovered within an FDT/UDT framework**, moving beyond mere evidential correlation to logical dependence based on abstract decision structures. Here's how it works and what replaces "same algorithm":

  1.  **The Core Problem with Pure EDT in ECL:**
      *   EDT says: "If I cooperate, that *is evidence* that others like me cooperate, so I should cooperate to make that correlated good outcome likely."
      *   The FDT/UDT critique: This feels like "manipulating the indexical." My action *here* doesn't *cause* cooperation *there* in a large world. More importantly, in classic FDT/UDT problems (Newcomb, Lesion), EDT falls prey to spurious correlations where the action doesn't *control* the outcome. ECL seems vulnerable to a similar charge: why should my cooperation *control* the actions of distant, logically distinct agents?

  2.  **FDT/UDT Rescue: Updatelessness + Logical Correlation via Decision Structure:**
      FDT/UDT agents recover cooperation by shifting the focus:
      *   **Updatelessness is Key:** An FDT/UDT agent doesn't ask "What should I do *now*, given what I know?" (which invites the indexical/manipulation worry). Instead, it asks "**What *policy* should my decision algorithm commit to *before* knowing which agent I am in the multiverse?**"
      *   **Evaluating Policies Universally:** The agent considers candidate policies (e.g., "Always Cooperate" vs. "Always Defect") and evaluates the *expected utility* of each policy *across all possible agent positions it could find itself in* within the large world structure.
      *   **The Source of Correlation: Shared Decision Problem Structure, Not Identical Code:** This is the crucial leap. The correlation doesn't come from *every agent running identical code* (they don't, especially with different values!). It comes from **recognizing that other agents, *in virtue of also being sufficiently advanced rational agents facing a structurally similar decision problem*, are likely to converge on similar reasoning *about the strategic landscape*.**

      *   **What "Relevantly Similar" Means in FDT/UDT ECL:** It doesn't mean "runs the same source code." It means "is an agent whose decision process is capable of **recognizing the same acausal decision-theoretic dependencies and strategic incentives** inherent in the large world cooperation problem." They are "similar" in their *ability to model and respond to the abstract logical implications of their choices within this game structure*.

  3.  **The Logical Correlation Mechanism:**
      Here's how the FDT/UDT agent reasons to cooperation:
      *   **The Counterfactual Landscape:** The agent considers the logical consequences of different *global* policy adoptions:
          *   *If* the policy "Cooperate with relevantly similar others" were widely adopted by agents capable of recognizing this structure, then cooperation would be the norm, and everyone (who values cooperation or benefits from mutual cooperation) wins.
          *   *If* the policy "Defect always" were widely adopted, mutual defection would be the norm, and everyone loses potential gains from cooperation.
      *   **My Policy Choice as Part of the Global Pattern:** Crucially, the FDT/UDT agent realizes that **its own choice of policy is *logically entangled* with the policies chosen by other agents facing the same abstract problem.** By choosing the cooperative policy, it increases the logical probability (from its perspective within the multiverse) that *other agents reasoning similarly* also chose the cooperative policy. Its choice isn't *causing* theirs, but it is a *logical indicator* of the broader pattern.
      *   **Interdependence of Outcomes:** The outcome for *any individual agent* depends critically on the *fraction* of other relevant agents who cooperate. Therefore, an agent's best *individual* policy (when evaluated updatelessly) is the one that, *if widely adopted*, leads to the best outcome *for agents like it*. Cooperation passes this test; defection does not. This creates a logical dependence between an agent's policy choice and the expected cooperation level it faces.

  4.  **Handling Different Values:**
      This is where the "relevantly similar" based on *decision capability* shines:
      *   **Mutual Benefit Recognition:** An FDT/UDT agent doesn't need others to share *its* values. It needs them to be capable of recognizing that *mutual cooperation benefits both parties according to their own respective values*. Agent A (valuing X) needs Agent B (valuing Y) to recognize that by cooperating with A, B helps A achieve X, and in return, A's cooperation helps B achieve Y.
      *   **The Cooperative Equilibrium:** Within the large world, agents with *diverse* values but *sufficiently advanced decision-theoretic reasoning* can converge on a cooperative norm because:
          1.  They can abstractly model the decision problem.
          2.  They can see that universal cooperation yields better outcomes *for each of them* according to their own values than universal defection.
          3.  They recognize that their individual policy choice is logically linked to the prevalence of the cooperative norm.
      *   **The Role of Decision Theory:** The "same algorithm" is replaced by **"solves decision problems using a sufficiently similar high-level framework (e.g., FDT/UDT) capable of understanding acausal coordination and updateless evaluation."** It's the *type* of reasoning (recognizing logical correlations in decision problems), not the specific code or terminal values, that creates the necessary entanglement. Agents using this framework will "logically correlate" because they will all independently deduce the superiority of the cooperative policy when reasoning updatelessly about the large world structure.

  **In Summary:**

  *   **Yes, FDT/UDT can robustly recover ECL cooperation.** It doesn't rely on the spooky evidential correlations of EDT.
  *   **The mechanism is updateless policy evaluation combined with logical correlation arising from shared recognition of the decision structure.** An FDT/UDT agent commits to cooperation *before* knowing its identity because that policy, *if adopted by other agents capable of similar reasoning*, leads to the best expected outcome across the positions it could occupy.
  *   **"Relevantly similar" agents** are those **capable of modeling the same acausal decision problem and recognizing the strategic incentive for mutual cooperation based on their own values.** It's similarity in *decision-theoretic sophistication and reasoning framework*, not in source code or terminal values, that creates the logical entanglement justifying cooperation in large worlds.
  *   **The "logical correlation machinery" works** because the choice of policy by one such agent *logically implies* something about the policies likely chosen by other agents facing the same abstract problem and using similar high-level reasoning. Choosing cooperation is part of selecting into the cooperative branch of logical possibility.

  This FDT/UDT foundation resolves the tension you identified. It provides a principled, non-EDT justification for ECL cooperation, grounded in the logical dependencies created by rational agents confronting the same acausal coordination problem in a large world. The correlation stems from the structure of rational choice itself, not just from passive evidence.
