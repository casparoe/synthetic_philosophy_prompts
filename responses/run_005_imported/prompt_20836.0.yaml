  The gaslight hissed like a disappointed spirit. Henry Sidgwick shifted in the stiff-backed chair, the worn velvet upholstery offering no comfort. Across the round table, draped in heavy, dark damask, sat Mrs. Ambler. Her eyes were closed, her breathing deep and unnervingly rhythmic. Eleanor, his Eleanor, sat to his left, her presence a steady warmth against the room’s pervasive chill. Frederic Myers sat opposite, his notebook open, pencil poised, the very picture of eager intensity. Edmund Gurney, quieter, more reserved, observed from the shadows near the door, a silent sentinel against intrusion – or escape.

  The air smelled of dust, candle wax gone cold, and the faint, cloying scent of lavender water Mrs. Ambler favoured. Sidgwick noted it all. He noted the slight tremor in the medium’s left hand resting on the table, the minute shift in her posture as she settled deeper into her trance. He noted the precise distance between her fingertips and the small, polished slate resting before her, the stub of chalk lying beside it. He noted the faint draft sneaking under the door, the distant rumble of a carriage on the street below. Mundane. Always the mundane, pressing in.

  A rap. Sharp, distinct, against the table leg near Mrs. Ambler.

  Myers’ pencil scratched furiously. Eleanor leaned forward slightly, her eyes fixed on the medium. Sidgwick remained still, his own notebook open on his knee, his fountain pen uncapped but motionless. He observed the point of impact. The grain of the wood. Was the vibration consistent? Did it travel? He mentally mapped the room’s structure.

  *Rap. Rap-rap.*

  This time, nearer to Gurney. Edmund shifted, his gaze sharpening. Sidgwick’s eyes flickered to the gas fixture above, then to the window frame. Settling? Expansion? *Possible*, he noted internally, the word a familiar anchor. *Probable.*

  Mrs. Ambler’s breath hitched. Her right hand, the one not touching the table, twitched. Then, slowly, almost dreamily, it drifted towards the slate. Her fingers closed around the chalk. Sidgwick’s focus narrowed to that point of contact. Muscle tension? Intentional movement disguised as automatism? He willed his own breathing to stay even, his mind to remain the cold, clear lens it was trained to be.

  The chalk scraped. A jagged line. Then another. Not letters. Shapes. Angles. Sidgwick felt, rather than saw, Eleanor’s intake of breath. Myers stopped writing, transfixed. Gurney took a silent step closer.

  The chalk moved faster now, scraping and squeaking, filling the slate with chaotic, intersecting lines. Sidgwick cataloged the movements: the rotation of the wrist, the pressure applied, the way her shoulder shifted. Too controlled? Too *human*? Or was the very awkwardness evidence of an external force wrestling with clumsy matter?

  A pattern began to emerge from the chaos. Not words, but a diagram. Geometric. Complex. Sidgwick’s pulse, against his iron will, quickened infinitesimally. It resembled… vaguely… a structure he’d once sketched while theorizing about metaphysical correspondences. A purely speculative doodle, shared only with Myers and Gurney years ago. Coincidence? Cryptomnesia? Mrs. Ambler might have heard it described…

  The chalk faltered. Drew a long, wavering line off the edge of the slate, scratching onto the damask cloth. Then it stopped. Mrs. Ambler’s hand went limp, the chalk rolling free. Her head lolled back, and she let out a long, shuddering sigh.

  Silence descended, thick and heavy. Myers was practically vibrating. Gurney’s expression was unreadable. Eleanor’s hand found Sidgwick’s under the table, her fingers cool. He squeezed back, a silent communication honed over decades of shared pursuit.

  Sidgwick stared at the slate. The diagram was there, undeniable in its complexity. It *was* reminiscent. Almost painfully so. Hope, a treacherous, desperate thing he kept locked deep within a vault lined with logic and disappointment, rattled its chains. *What if…?* The thought was a spark threatening to ignite dry tinder.

  He forced his gaze upwards, away from the tantalizing lines, back to Mrs. Ambler. Her eyelids fluttered. She looked drained, bewildered. He noted the faint sheen of sweat on her upper lip, the slight tremor returning to her resting hand. Exertion? Theatrical performance? He saw the frayed cuff of her sleeve, the worn spot on her shoe visible beneath the table’s edge. A woman of modest means, susceptible to financial incentive, perhaps. Vulnerable to suggestion. Desperate for validation.

  He picked up his pen. The nib hovered over the pristine paper. He needed to record the ambient temperature. The exact timing of the raps. The sequence of the chalk marks. The medium’s physical state before, during, and after. He needed to cross-reference this diagram with his old notes, assess the probability of independent generation. He needed to eliminate the draft, the settling house, the power of collective expectation.

  The diagram seemed to pulse on the slate. It whispered of order, of connection, of a universe where the scales weren’t perpetually balanced on a knife-edge. Where the relentless, selfless pursuit of the good wasn’t perpetually shadowed by the whispering voice of rational self-interest, forever unresolved. Where the guarantee he couldn’t accept on faith might be proven empirically, in this dim room, on this piece of slate.

  He began to write, his script precise, detached: *"Sitting commenced 8:47 PM. Medium: Ambler. Present: Sidgwick, E.M.S., Myers, Gurney. Initial phenomena: distinct raps, loci..."*

  Each word was a brick in the wall against that treacherous hope. He was the investigator, the skeptic, the guardian against delusion. The cost of being wrong – of credulity – was too high. It betrayed reason. Yet, the cost of *never* being wrong, of perpetually finding the mundane explanation… that cost was the perpetual, gnawing void of the dualism. A universe indifferent, perhaps even hostile, to the moral imperative he had so meticulously deduced.

  His pen moved, recording data, building the case for doubt. But his eyes kept flicking back to the slate. To the almost-recognizable pattern. To the ghost of a possibility that *this time*, the darkness might yield not just cold drafts and tired theatrics, but light. The tension wasn't in the raps or the chalk, but in the silent war within the man who watched, hoped against hope, and doubted with all his formidable will. He was both the lock and the desperate, fumbling key.

  *(Years later, long after Sidgwick, Myers, and Gurney had passed, Eleanor would sit in a different room, sunlight streaming through a window. Before her lay fragments – automatic writings from mediums who had never met, never corresponded. Scraps of paper filled with disjointed phrases, geometric patterns eerily reminiscent of that night, and a persistent, chilling signature: a symbol combining Henry’s initials with those of Myers and Gurney. A message seemingly stitched together from beyond the veil they had so relentlessly, so yearningly, probed. She would touch the papers, her expression unreadable, the weight of the unconfirmed pressing down, a spectral coda to a lifetime of disciplined hope and profound, unresolved longing.)*
