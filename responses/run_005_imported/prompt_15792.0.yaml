  First, I need to recall the core arguments of both sides. Reductionists, following Hume, argue that testimonial justification requires inductive support. Anti-reductionists, inspired by Reid, think testimony is inherently credible unless contradicted. The user is stuck on the circularity issue—using testimony to prove testimony's reliability. 

