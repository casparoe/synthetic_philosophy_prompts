  Then, I'll address why anti-reductionists find these insufficient. They argue that individual experiences are too limited to support general reliability. Collective induction's non-testimonial access is questionable. Restricted scope might not cover new contexts. Bootstrapping still assumes some default credibility, which reductionists reject. Anti-reductionists emphasize the impracticality and the necessity of trusting testimony as a basic source of knowledge.

