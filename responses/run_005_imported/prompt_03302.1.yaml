  **Why S-Tier Holds Up Best:**  
  1. The "science AI" approach actively reduces the knowledge gap between humans and the AI, making it exponentially harder to construct a simulator that can exploit human ignorance without creating detectable inconsistencies in the resulting human understanding.  
  2. Unlike passive penalties or observational methods, this strategy attacks the root cause of the simulator problem (asymmetric knowledge) by making human models increasingly aligned with ground truth.  
  3. To break this, an adversary would need to engineer scenarios where the AI's "teaching" systematically creates blind spots – a far more contrived failure mode than simply fooling static human observers or gaming simple penalties.  

  *(Remember: As noted in the report, no method *fully* solves ELK in worst-case scenarios, but S-tier requires dramatically more sophisticated counterexamples than lower tiers.)*
