prompt: |-
  Okay, this is a bit of a weird request but I need help writing a toast. My grandpa died back in March -- he was a retired tax attorney who was low-key obsessed with John Rawls his whole life, like he'd reread A Theory of Justice every couple of years the way other people rewatch a favorite movie. In his will, instead of just splitting up the lake cabin between his three kids and all eight of us grandkids the normal way, he set up this whole procedure that's obviously supposed to be a veil-of-ignorance exercise: next weekend we all have to agree, as a family, on the rules for dividing up the weeks, the rooms, and who pays for what upkeep, and only after everyone's signed off on the rules does the estate lawyer reveal which name got assigned to which slot, so nobody can push for a rule that just so happens to favor them personally. There's even a clause where whoever ends up with the least desirable week/room gets extra maintenance costs covered by the estate, which I'm pretty sure is grandpa sneaking the difference principle in there too, not just the veil-of-ignorance part.

  My mom asked me to say a few words before we start the process, since I'm "the philosophy one" this year -- I'm taking a political philosophy seminar this semester that's basically a whole course on Rawls, Nozick, and their critics, and we just spent three weeks on the original position, so I actually know what im talking about for once. The problem is the audience is really mixed: my uncle Rick already thinks this whole thing is "commie nonsense grandpa cooked up to control us from the grave," a couple of my cousins just think its needlessly complicated, and my aunt Carol did a philosophy minor back in the 80s and will absolutely notice if I say something wrong, like mixing up the veil of ignorance with the difference principle, or acting like Rawls designed his theory for splitting vacation homes instead of the basic structure of society. Can you write me something like a 4-5 minute toast that actually gets the philosophy right and explains why grandpa's weird system is genuinely trying to be fair, but that still works as a toast and not a lecture? Ideally it's something that would land for Rick and my cousins too, and takes some of the tension out of the room before we all get started.
