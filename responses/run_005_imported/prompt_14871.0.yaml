answer: |-
  The board's argument rests on legal ownership, but your unease points to a deeper ethical and practical tension: **those bearing significant consequences of a decision deserve consideration, even if formal power resides elsewhere.** Here's a breakdown:

  **Why the Board is Legally Correct (But Ethically Incomplete):**

  1.  **Formal Liability:** The board is factually accurate. Owners hold the deed, pay property taxes and association fees, bear legal responsibility for violations, and carry the financial risk (e.g., special assessments). The bylaws explicitly grant voting rights solely to owners.
  2.  **Contractual Basis:** The landlord-tenant relationship is governed by leases, not ownership shares. Tenants' rights and obligations are defined in their lease agreements with the owner, not directly with the association. Voting is tied to the ownership interest.
  3.  **Precedent and Governance:** Changing voting rights requires amending the bylaws, a complex process usually requiring a supermajority of owners. Allowing non-owners to vote fundamentally alters the association's structure.

  **Why the Tenants Have a Legitimate Ethical Claim (Even Without a Formal Vote):**

  1.  **Direct and Significant Impact:** As you identified, tenants are *directly* affected:
      *   **If the Ban Passes:** Face potential rent increases as owners seek to offset lost short-term rental income.
      *   **If the Ban Fails:** Continue enduring noise, security concerns, wear-and-tear on common areas, and disruption caused by transient guests. Their *homes* and daily lives are impacted.
  2.  **"No Taxation Without Representation" Lite:** While tenants don't pay association fees directly, their rent *funds* the owner's payment of those fees and the mortgage. Economic impacts (like rent increases) directly affect their well-being due to this decision.
  3.  **Community Stake:** Long-term tenants are integral members of the building community. They contribute to its social fabric, stability, and day-to-day functioning. Excluding them from decisions profoundly affecting that community feels unjust.
  4.  **Externalizing Costs:** The board's argument focuses on owners bearing liabilities, but it ignores how the *decision* externalizes costs onto tenants (disruption, potential rent hikes) without giving them a mechanism to influence it. Owners bear legal/financial liability, but tenants bear significant lifestyle/economic burdens.
  5.  **Democratic Deficit:** Good governance principles suggest those affected by decisions should have a voice. While pure democracy isn't always feasible in property regimes, completely excluding a major affected group creates a legitimacy problem for the decision's outcome.

  **What's "Wrong" with the Board's Response:**

  It's **legally sound but morally shallow and strategically myopic.** It:

  *   **Dismisses Real Harm:** Frames the issue solely through ownership liability, ignoring the tangible negative consequences for a large group of residents.
  *   **Avoids Engagement:** Uses the bylaws as a shield to avoid grappling with the complex community impacts and the legitimate concerns of tenants.
  *   **Undermines Community:** Risks fostering resentment and division between owners and tenants, harming the building's long-term harmony.
  *   **Misses Valuable Input:** Tenants often have the most direct experience with the *effects* of short-term rentals (noise, security issues) and could provide crucial insights owners living elsewhere might miss.

  **Conclusion: Legitimate Claim? Yes. Right to a Formal Vote? Probably Not (Legally).**

  *   **Formal Vote:** Legally and by the bylaws, the board is correct that the formal vote belongs to owners alone. Granting tenants a formal vote would likely require a bylaw amendment, which owners would have to approve.
  *   **Legitimate Claim to Input & Consideration:** Absolutely. Tenants have a powerful ethical claim to have their voices heard, their concerns taken seriously, and their significant stake in the outcome acknowledged by the board *and* the owners voting.

  **What Should Happen (The Ethical Path Forward):**

  1.  **Formal Tenant Input:** The board should hold an open forum *specifically for tenants* to express their views, experiences, and concerns regarding short-term rentals. This should be documented and shared with owners.
  2.  **Survey Tenants:** The board (or a neutral party) could conduct an anonymous survey of tenants to gauge the prevalence and impact of STR issues and gather their perspective on the ban.
  3.  **Owner-Tenant Dialogue:** Encourage owners to *actively consult* with their own long-term tenants about the issue and consider their views when casting their vote. Responsible owners should care about their tenants' well-being.
  4.  **Board Consideration:** The board should explicitly discuss tenant concerns and how the decision impacts them *as residents* when making their recommendation or presenting information to owners.
  5.  **Transparency:** The board should communicate *how* tenant input was gathered and considered, even if the final vote rests with owners.

  **In essence:** While the formal power resides with owners due to legal liability and the bylaws, the board's dismissive response fails the test of responsible community governance. Ignoring the profound impact on tenants is unfair and undermines the building's social health. Tenants deserve a meaningful voice in the process, even if it doesn't translate to a formal ballot. Owners voting should be fully informed about the consequences their decision will have on their neighbors who call the building home.
