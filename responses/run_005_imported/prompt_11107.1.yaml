  For the iterated knowledge point, I'll mentally simulate Wednesday: The students "know" it can't be Friday (first-order), but by Wednesday they need to "know they know" it wasn't Monday/Tuesday (third-order?) to eliminate Thursday. Williamson says this tower collapses because real knowledge doesn't perfectly iterate. 

