answer: |-
  Your friend's perspective reflects a narrow but common definition of rationality (instrumental rationality focused solely on future consequences). However, your payment was rational under a broader, more sophisticated framework that accounts for human systems, identity, and long-term consequences. Here's why:

  1.  **Upholding Personal Integrity as Identity Capital:** Rationality isn't just about external consequences; it includes internal coherence. Your "word" is part of your identity capital. Violating it creates cognitive dissonance, erodes self-trust, and makes future self-bargaining harder. Paying maintains a coherent self-narrative of reliability, which is instrumentally valuable. A person who easily breaks promises *to themselves* undermines their own future decision-making integrity.

  2.  **Maintaining Systemic Trust & Reciprocity:** The guide operates in a system where trust is fragile. His bitterness about being "stiffed" highlights the real-world consequence of defection: fewer people willing to help strangers in peril without upfront payment. By paying:
      *   You reinforced a cooperative norm.
      *   You increased the likelihood that *this specific guide* (and potentially others he tells) will help the *next* injured person who can't pay upfront.
      *   You contributed to a system where "promise now, pay later" remains viable, benefiting *future you* or others in similar situations. Defection would have been a tragedy-of-the-commons for backcountry ethics.

  3.  **Reputation & Signaling (Even Asymmetrically):** While the guide couldn't enforce payment, your action signals your character:
      *   **To the guide:** He now knows trustworthy people exist, potentially altering his future behavior positively.
      *   **To yourself:** Consistently acting with integrity reinforces that identity, making it easier to act reliably in the future.
      *   **To your social circle (like your friend):** How you recount this story (and knowing you paid) signals your values, impacting how others perceive and interact with you. Defection might have subtly altered your friend's view of your trustworthiness.

  4.  **Avoiding Internal "Costs":** Failing to pay would likely incur internal costs: guilt, shame, dissonance, and a nagging sense of being indebted. These are real psychological burdens with tangible impacts on well-being and future decision-making. Paying avoided these negative utilities.

  5.  **Game Theory Beyond a Single Iteration:** Your friend treats this as a one-off Prisoner's Dilemma where defection (not paying) is dominant once safe. However:
      *   **Indefinite Iteration:** Life consists of countless interactions. Building a reputation for cooperation (even in seemingly one-off events) pays dividends in a society that values trust. You never know when paths might cross again.
      *   **Meta-Games:** Your actions shape your *own* future tendencies. Habitually cooperating makes you a more reliable partner in *all* cooperative endeavors, including those involving people who *can* enforce reciprocity.
      *   **Rule Utilitarianism:** What if everyone acted like your friend? The norm of post-rescue payment would collapse. Guides would demand cash upfront or refuse help, leading to more deaths. Following the cooperative rule ("pay what you promised") sustains a system that maximizes overall welfare, including your own potential future need.

  **Why your payment was rational:**

  *   **Instrumental Rationality (Broader View):** It served your long-term interests: maintaining self-integrity, avoiding psychological costs, contributing to a trustworthy system you rely on, and signaling your cooperative nature.
  *   **Epistemic Rationality:** You honored a commitment based on a truthful assessment of the situation. Breaking your word would have involved revising your self-concept dishonestly ("I'm the kind of person who keeps promises... except when inconvenient").
  *   **Moral Rationality (if included):** It aligned with principles (keeping promises, reciprocity) that foster functional societies and individual flourishing.

  **What this says about acting in such situations:**

  1.  **Your Identity is Part of Your Utility Function:** Acting in ways that violate your core values or self-concept has long-term costs. Rationality includes optimizing for a coherent and positive self-narrative.
  2.  **You Exist Within Systems:** Individual actions ripple through social systems. Rational choices consider how your behavior sustains or degrades beneficial norms (like trust) that you depend on.
  3.  **Consequences Aren't Just Immediate or Enforceable:** Psychological costs, reputational signals (even subtle ones), and systemic impacts are real consequences with utility implications.
  4.  **Promises Create Rational Obligations:** Making a credible promise changes the rational calculus. Breaking it incurs costs (internal, reputational, systemic) that often outweigh the immediate savings, even when enforcement is impossible. Keeping promises is often the *strategically* sound choice for a social being.

  **Conclusion:** Your friend is correct only within an extremely narrow, myopic, and ultimately self-defeating view of rationality focused solely on unenforceable, immediate material gains. Your payment was rational under a more comprehensive model that accounts for identity, psychological well-being, reputation, systemic health, and long-term self-interest. By paying, you invested in your own character, supported a lifesaving norm, avoided internal conflict, and signaled your reliability – all of which are profoundly rational outcomes. Decency and rationality, in this broader sense, were aligned.
