answer: |-
  Your puzzlement is entirely understandable and reflects a nuanced debate in quantum foundations. Philosophers challenging the locality of standard QM aren't denying that Copenhagen rejects realism (it famously does), but they argue that **relinquishing realism alone is insufficient to fully restore locality**. Here's a breakdown of what you might be missing:

  1.  **Bell's Theorem Targets "Local Realism":** Bell's theorem proves that *any* theory satisfying both **Local Causality** and **Realism (Definite Values)** must obey the inequalities. QM violates the inequalities, so *at least one* must be false.
  2.  **Copenhagen Rejects Realism:** As you state, Copenhagen (and similar interpretations) jettisons realism. Observables don't have definite values prior to measurement. This *seems* to preserve locality by sacrificing the other horn.
  3.  **The Philosophers' Point: Nonlocality Creeps Back In:** Critics argue that even without realism, standard QM exhibits forms of nonlocality incompatible with a truly local universe. Key arguments include:
      *   **Nonlocal State Collapse (The Core Issue):** When a measurement is performed on one part of an entangled system (e.g., Alice measures her particle in an EPR-Bell pair), the *entire* wave function collapses instantaneously, affecting the state of the distant particle (Bob's particle). This collapse happens *faster than light* and is frame-dependent. While Copenhagen often treats this collapse as merely "updating knowledge," the *predictive power* of the theory hinges on this update being instantaneous and nonlocal. Bob's measurement statistics depend *causally* on what Alice did, even if no signal is sent.
      *   **The Born Rule & Nonlocal Probabilities:** The probability assigned to the outcome of a measurement on Bob's particle *depends nonlocally* on the measurement setting and outcome chosen by Alice for her particle. Before Alice measures, the probability for Bob to get spin-up might be 50%. *After* Alice measures and gets spin-up, the probability for Bob to get spin-up *instantly* becomes 0% (or 100%, depending on the entangled state). This change in probability assignment is nonlocal – it depends on an event space-like separated from Bob.
      *   **Failure of Local Commutativity (Operational Nonlocality):** In relativistic QFT, operators representing observables at space-like separated points commute (`[A(x), B(y)] = 0` for (x-y) spacelike). This ensures no *signaling* faster than light (microcausality). **However,** philosophers like Tim Maudlin argue that this only prevents controllable *information transfer*. The *statistical correlations* predicted by the entangled state itself are demonstrably nonlocal. The outcomes *are* correlated in a way that cannot be explained by any local common cause (as Bell proved), and the formalism *relies* on this nonlocal connection to make correct predictions. The correlations are physically real, even if uncontrollable.
      *   **The Quantum State Itself as Nonlocal:** The entangled quantum state (`|ψ> = (|↑↓> + |↓↑>)/√2`) is a global state of the whole system. It cannot be factorized into separate states for each subsystem that fully determine their local properties. This global state encodes the nonlocal correlations *directly*. While not a *dynamical* influence in the Bohmian sense, it represents a fundamental, irreducible non-separability of the system.
      *   **The EPR Argument Revisited (Without Realism):** EPR argued that if you could predict with certainty the outcome of a distant measurement without disturbing it (which QM allows via entanglement), then that observable *must* have had a definite value beforehand (realism). Bell showed realism+locality fails. Copenhagen avoids EPR's conclusion by denying realism. **But:** The *ability* to predict the distant outcome with certainty *after* your local measurement *still* demonstrates a nonlocal connection. Reality at Bob's location is constrained *instantaneously* by Alice's action, even if we don't call it a "pre-existing value." It's a nonlocal *constraint* or *correlation*.

  **Why Bohm is Explicitly Nonlocal, While Standard QM's Nonlocality is Subtler:**

  *   **Bohmian Mechanics:** Has explicit, dynamical, controllable nonlocality. The velocity of a particle *depends instantaneously* on the positions of *all other particles* via the quantum potential derived from the wave function. This is a clear, direct violation of local causality in the equations of motion.
  *   **Standard QM (Copenhagen/Orthodoxy):** Its nonlocality is primarily manifested in:
      *   The *instantaneous, non-selective* collapse of the wave function upon measurement.
      *   The resulting *instantaneous change in probability distributions* for distant measurements.
      *   The *irreducible global nature* of the entangled quantum state.
      *   The existence of *nonlocal correlations* that cannot be explained by local common causes.

  **In essence, philosophers argue that while Copenhagen avoids the *dynamical* nonlocality of Bohm, it retains a deep *kinematic* or *structural* nonlocality inherent in the quantum formalism itself, particularly through the nonlocal character of state collapse and the nonlocal probabilistic dependencies encoded in entanglement.**

  **Key Thinkers/Concepts to Explore:**

  *   **Tim Maudlin:** Argues forcefully that QM is straightforwardly nonlocal ("Quantum Non-Locality and Relativity").
  *   **Failure of Local Commutativity to Ensure Full Locality:** As discussed above.
  *   **Parameter Dependence vs. Outcome Dependence (Jarrett/Shimony):** Outcome dependence (the dependence of the probability for Bob's outcome on Alice's *actual outcome*) is generally considered nonlocal.
  *   **The PBR Theorem:** While about realism, reinforces that the quantum state has ontological status, making its nonlocal collapse harder to dismiss as mere "knowledge update."
  *   **Entanglement Swapping & Delayed Choice Experiments:** Demonstrate that nonlocal correlations can be established *after* the particles involved have been measured and no longer exist, highlighting the nonlocal nature of the quantum state itself.

  **Conclusion:**

  Your teaching point – that Copenhagen sacrifices realism to *avoid the specific nonlocality targeted by Bell's theorem (local causality combined with realism)* – is correct. However, philosophers contend that **sacrificing realism doesn't magically make the quantum world local.** The phenomena of **instantaneous wave function collapse** and the resulting **nonlocal changes in probabilities**, coupled with the **irreducible non-separability** described by entangled states, constitute a genuine form of nonlocality that persists even in interpretations rejecting realism. This nonlocality may not allow signaling, but it represents a fundamental departure from the principle that physical effects propagate continuously through space at or below the speed of light. The debate hinges on whether this "passive" nonlocality of correlation and constraint is acceptable or still violates a reasonable notion of locality in physics.
