answer: |-
  You've hit on one of the deepest problems in epistemology (the theory of knowledge): **The Regress Problem.** How *do* we justify our beliefs without falling into an infinite loop, arbitrary foundations, or circular reasoning? Your character's struggle is profoundly real and philosophical. Let's break down the three main responses (Foundationalism, Coherentism, Infinitism), their strengths, weaknesses, and how they can play out dramatically for your protagonist.

  Here's a comparison of the three approaches:

  | **Approach** | **Core Premise** | **Strengths** | **Weaknesses** | **Character Application** |
  |--------------|------------------|---------------|----------------|---------------------------|
  | **Foundationalism** | Some beliefs are "basic" and self-justifying | Feels intuitive; matches everyday experience; provides stopping point | What counts as "basic" is debatable; risk of dogmatism; can feel arbitrary | Character points to a core, undeniable experience ("When he said X, his eyes...") |
  | **Coherentism** | Justification comes from belief network coherence | Flexible; holistic; mirrors how we build real-world cases | Coherent ≠ true; circularity risk; can ignore external evidence | Character weaves incidents into a narrative ("Don't you see how A, B, and C fit together?") |
  | **Infinitism** | Justification chains can be infinite | Avoids dogmatism; emphasizes process | Impractical; psychologically impossible; undermines confidence | Character experiences paralyzing doubt ("I could question forever...") |
  | **Practical Resolution** | Balance of coherence, core experiences, and pragmatic necessity | Real-world applicability; acknowledges limitations | Not philosophically pure; requires judgment | Character combines approaches, accepts uncertainty, and commits to action |

  Now let's explore each approach in depth and how your protagonist might use them:

  1.  **Foundationalism: The Bedrock Beliefs**
      *   **The Idea:** Justification *must* stop somewhere. There are "basic" or "foundational" beliefs that are justified *without needing further justification* from other beliefs. They are self-evident, incorrigible (can't be mistaken about them), or evident to the senses. They form the solid ground upon which other beliefs are built.
      *   **How it Works for Your Protagonist:** She points to one or more experiences that feel *indisputably real and directly indicative of betrayal* to her.
          *   "I *saw* the look in his eyes when I mentioned Project Phoenix. It wasn't confusion, it was *fear*. Pure, cold fear. And then he lied about why."
          *   "I *heard* his voice on that intercepted call. Not a similar voice, *his*. Saying those specific words about selling us out. That recording *is* the proof."
          *   "He *admitted* it, Jess! Not in so many words, but when I confronted him about the missing funds, he didn't deny it. He just... deflected. With that practiced calm he uses when he's hiding something. You *know* that tone."
      *   **Why it Might Work (Strength):** It feels intuitive. We *do* stop regresses in everyday life based on core perceptual experiences ("I saw it with my own eyes!") or basic logical/mathematical truths ("2+2=4"). It provides a psychological and epistemic stopping point. Your protagonist *feels* the truth of these core experiences in her gut.
      *   **Why it Might Fail (Weakness):** The "Given" is rarely uncontested. What feels foundational to one person seems interpretable to another.
          *   *The Friend's Challenge:* "Fear? Or surprise? Or worry *for* you? Voices can be faked or misheard. Deflection could be embarrassment or protecting someone else, not guilt. Your 'foundation' looks like *interpretation* to me." Foundationalism can feel dogmatic ("I just *know*!") or arbitrary ("Why *this* experience as foundational and not another?").

  2.  **Coherentism: The Web of Belief**
      *   **The Idea:** Justification isn't linear (A justifies B justifies C) but holistic. A belief is justified if it *coheres* (fits consistently and supportively) with a larger, interconnected system or "web" of beliefs. No single belief is foundational; they mutually support each other. Strength comes from the overall fit and explanatory power of the system.
      *   **How it Works for Your Protagonist:** She doesn't rely on one smoking gun. She weaves multiple incidents into a single, compelling narrative where betrayal is the *best explanation* for *all* the evidence. Each piece gains meaning from its place in the whole.
          *   "Look, it's not *just* the look or *just* the call or *just* the money. It's *all of it together*. Why did he cancel our meeting *the day after* the Phoenix leak? Why did he suddenly start taking 'personal trips' to the same city where our main competitor is headquartered? Why did his old assistant vanish right after questioning the accounts? And why does every explanation he gives feel like a half-truth that falls apart when you poke it? Take any one thing, maybe it's coincidence. Take them *all*? The *only* thing that makes sense of *all* these pieces fitting together is that he betrayed us. What other story explains *everything*?"
      *   **Why it Might Work (Strength):** This is how we often build complex cases in real life (detectives, scientists, historians). It's flexible and powerful. A single weak piece doesn't necessarily collapse the whole structure if the overall coherence is strong. It feels less dogmatic than foundationalism – it's about the weight of the interconnected evidence.
      *   **Why it Might Fail (Weakness):** A coherent story isn't necessarily *true*. You can have a perfectly coherent system built on false premises or ignoring crucial evidence ("But what if there's another explanation you haven't considered?"). It risks circularity (Belief A supports B supports C which supports A). It can feel detached from reality – "It's a nice story, but where's the *proof*?"

  3.  **Infinitism: The Endless Chain**
      *   **The Idea:** Justification *does* require an infinite chain of reasons. There are no foundational beliefs, and circularity is invalid. A belief is justified only if there is an endless, non-repeating chain of supporting reasons available. The *process* of justification is key, not a final stopping point.
      *   **How it Might Manifest for Your Protagonist:** This is where paralyzing doubt sets in. She *starts* down the chain, but realizes it never ends.
          *   Protagonist: "The look proved it!"
          *   Friend: "How do you know it meant betrayal?"
          *   Protagonist: "Because I know his expressions!"
          *   Friend: "How do you know *that* knowledge is reliable?"
          *   Protagonist: "Because he's been my mentor for 15 years!"
          *   Friend: "And how do you know *that* experience wasn't building a false sense of security? Maybe he *wanted* you to trust those expressions?"
          *   Protagonist: (Silence, then softly) "...I see your point. I could question forever. Maybe I can never *truly* know..." (This leads to despair or inaction).
      *   **Why it Might Seem Logical:** It avoids the perceived weaknesses of the other two – no arbitrary stopping point, no circularity.
      *   **Why it Fails (Practically and Often Philosophically):** It's psychologically impossible for finite humans. We *can't* traverse infinite chains. It provides no actual justification we can use to *hold* a belief or *act* upon it. It leads to skepticism and paralysis. Most philosophers find it untenable as a complete account of knowledge because it renders knowledge practically unattainable.

  **The Resolution for Your Protagonist (and Epistemic Honesty):**

  Real people (and believable characters) don't rigidly adhere to one pure theory. They use a **pragmatic blend**, often anchored in **Modified Foundationalism** and **Coherentism**, with a dose of **practical necessity**:

  1.  **Core Experiences as *Provisional* Foundations:** She identifies experiences that feel *so* direct, *so* compelling, that she takes them as her *starting point*, acknowledging they *could* be wrong, but the burden of proof shifts to the doubter. "I *saw* the files on his private drive, labeled with the competitor's name. Could it be a setup? Maybe. But *you* tell me a plausible reason for *that* specific thing to be there, right now, given everything else."
  2.  **Coherence as the Compelling Force:** The true power of her conviction comes from how *many* strands of evidence, including those core experiences, weave together into a single, powerful narrative that explains *more* of the puzzling events than any alternative. "The look *alone*? Maybe not. The files *alone*? Suspicious. The money *alone*? Could be an error. But the look *when* I mentioned the files, the files *dated* right after the money went missing, the trip he took *to* the competitor's city *the next day*... Jess, the pieces *lock together*. Nothing else fits."
  3.  **Acknowledging Limits and Embracing Fallibility:** Epistemic honesty means recognizing she doesn't have Cartesian certainty (absolute, indubitable proof). "Do I have iron-clad, courtroom-proof evidence that would stand up to every conceivable doubt? No. But I have *enough*. Enough for *me* to know. Enough to act on. And if I'm wrong... I'll face that. But I can't *not* act on what I see and what fits."
  4.  **Pragmatism and Responsibility:** Ultimately, she has to *do* something. The cost of inaction (if she's right) is too high. Her justification becomes: "Given the weight of coherent evidence anchored in these core experiences, and given the stakes involved, I am *responsible* for acting on this belief. Waiting for impossible certainty *is* a choice – a choice to risk disaster."

  **How to Write the Scene:**

  *   Have the protagonist start with specific incidents (pointing towards foundationalism).
  *   Let the friend challenge the interpretation (poking holes in naive foundationalism).
  *   Have the protagonist pull in *more* incidents, showing how they interconnect and how betrayal is the *best explanation* (coherentism).
  *   Let the friend push towards the infinite regress ("But couldn't there *always* be another explanation?").
  *   Have the protagonist hit the wall of infinitism, feel the despair briefly.
  *   Then, show her shift to **pragmatic conviction**: She acknowledges the *possibility* of error but emphasizes the *coherence* of her interpretation, the *weight* of the evidence, the *unacceptability* of the alternatives, and the *necessity to act*. "I see the chain, Jess. I see it could go on forever. But I *also* see the picture it forms. And I see what happens if I ignore it. I have to trust what fits. I have to trust *myself* now."

  This makes her conviction feel earned, human, and epistemically honest – grounded in reason and evidence, yet acknowledging its fallibility and driven by the practical need to navigate a complex and dangerous world. It's not magic, it's not circular, and it's not infinite; it's the messy, resilient way humans actually build and live by justified beliefs.
