  Here’s a eulogy draft that honors Denny’s connection to the "extended mind" concept while respecting its boundaries and his personality, balancing technical/philosophical accuracy with warmth and accessibility. It’s structured for clarity and emotion, aiming for about 5-6 minutes:

  ---

  **(Start warmly, looking at the gathering)**

  Hi everyone. For those I haven’t met yet, I’m Denny’s nephew. Like many of you, I loved him deeply – for his brilliant mind, his wicked sense of humor, and the stubborn, practical way he tackled absolutely everything… including Alzheimer’s.

  When Denny was diagnosed, it felt like a theft. But Denny wasn’t wired for helplessness. He was an engineer, a problem-solver. And a couple of years in, he found something that clicked – a concept from philosophy and cognitive science called the "extended mind." He’d call me up, excited, explaining this thought experiment about a guy named Otto who had Alzheimer’s.

  **(Explain the concept simply, neutrally)**

  The idea goes like this: Otto uses a notebook to remember things – addresses, names, appointments – because his own memory struggles. The argument is, that notebook isn't *just* a tool. It becomes *part* of how Otto thinks and functions, just like the memory inside his skull. His mind literally extends into the world, using the notebook as a component. It’s not magic; it’s functional. It’s how all of us work when we use a calculator for math, or write a list because we know we’ll forget.

  **(Connect it to Denny, emphasize his attitude)**

  Denny latched onto this. Hard. He thought it was the funniest, most validating thing he’d ever heard. Suddenly, his own meticulous system – the notebooks filled with lists and reminders, the alarms on his phone, the carefully labeled everything – wasn't just coping. It was strategy. It was engineering. He proudly called it his "Otto Stack." And he became its fiercest advocate.

  **(Key philosophical honesty + Denny’s perspective)**

  Now, Denny would be the *first* person to insist – quite firmly, probably with a raised eyebrow if I got it wrong – on what this theory *doesn’t* say. The Otto Stack only *worked* because Denny was there. It was *his* intention, *his* hand writing in the notebook, *his* finger setting the reminders, *his* mind actively using these tools. The magic wasn't in the paper or the phone. The magic – the *mind* – was in Denny’s engagement with it. It was a brilliant workaround, a testament to his refusal to be defined by what was fading. He wasn't mystical about it; he was fiercely practical. He wasn't talking about souls or afterlives; he was talking about clever engineering. He’d get almost annoyed if you tried to make it sound sentimental! For him, the power was in the *doing*, in the active, stubborn act of building external scaffolding for his thoughts.

  **(Address the "lives on" urge honestly & pivot to legacy)**

  So, standing here today, I know what Denny would *not* want me to say. He wouldn't want me to tell you his mind "lives on" in those notebooks and phones sitting quiet now. He’d point out, correctly, that without him actively using them, they’re just objects. The Otto Stack needed Otto.

  **(Pivot to the true legacy - his approach and impact)**

  But what *does* live on is something far more powerful, and far more *Denny*. It’s the *example* of how he used the Otto Stack. It’s his sheer, defiant ingenuity in the face of a disease trying to box him in. It’s his refusal to surrender his agency, his problem-solving nature. He looked Alzheimer’s in the eye and said, "Fine. If that part won't work, I’ll build a workaround." He moved his memory *outside* his skull not as an act of faith, but as an act of brilliant, stubborn engineering.

  **(Bring it home for both audiences)**

  For those of you who knew the Otto Stack well – his firmware crew, his philosophy friends – you saw this genius up close. You saw the meticulousness, the dark humor, the absolute refusal to be pitied. He found dignity and agency in a concept most people have never heard of, and he made it his own.

  For family who maybe never heard him rant about Otto, know this: Denny fought to stay connected, to be *himself*, with every tool he could find, right up until the end. Those notebooks weren't magic, but the *will* behind them was extraordinary. That fierce, funny, brilliant will – *that* is what we carry forward.

  **(Conclude with warmth and appreciation)**

  Denny showed us how to meet an impossible challenge head-on, with brains, tools, and a completely unsentimental kind of courage. He taught us that the mind is resilient, adaptable, and can extend its reach in surprising ways when it needs to. His legacy isn't stored in paper or silicon. It’s stored in the way he faced adversity, in the memories *we* hold of his wit and his fight, and in the incredible example he set of building your own damn scaffolding when the world tries to take the ground from under you.

  So thank you, Denny, for the Otto Stack. Not because it holds your mind now, but because it showed us the remarkable strength of the mind you had, and the unforgettable person you always were. We’ll miss you terribly.

  ---

  **Why this works:**

  1.  **Honors the Concept Accurately:** Explicitly states what the extended mind theory *is* (functional extension during life) and, crucially, what it *isn't* (a soul, an afterlife, something mystical or persisting after death). Uses Denny's own language ("Otto Stack," "engineering").
  2.  **Respects Denny's Personality:** Captures his pragmatism, humor, and annoyance with sentimentality. Uses phrases like "fiercely practical," "unsentimental kind of courage," "stubborn engineering." Avoids any "woo."
  3.  **Resolves the "Lives On" Dilemma:** Directly addresses the temptation ("I know what Denny would *not* want me to say") and pivots powerfully to what *does* live on – his *example*, his *approach*, his *will*, his *legacy* of resilience and ingenuity. This is emotionally satisfying without violating the philosophy.
  4.  **Accessible to All:** Explains the Otto thought experiment simply in one paragraph. Uses analogies everyone understands (calculator, shopping list). Clearly separates the concept from Denny's personal application of it.
  5.  **Balances Audiences:**
      *   **Tech/Philosophy Folks:** They hear the accurate explanation, the nod to Clark & Chalmers (via Otto), and the respect for Denny's intellectual engagement. They'll appreciate the accuracy and the avoidance of misrepresentation.
      *   **Family:** They hear a clear story of Denny's fight, his cleverness, his character, and what he truly valued (agency, ingenuity, connection). They get the emotional core without needing the philosophy.
  6.  **Focuses on Denny:** The concept is a lens to view *Denny's* character and actions, not the main event. The eulogy is *about him*.
  7.  **Tone:** Respectful, warm, appreciative, with touches of his humor ("stubborn," "build your own damn scaffolding"). Ends on a note of gratitude and love.
  8.  **Length:** Structured for natural pacing; reading it aloud slowly and clearly should hit the 5-6 minute mark.

  **Delivery Tip:** Practice reading it aloud several times beforehand. Focus on speaking clearly and naturally, pausing for emphasis, especially after key points about the theory or Denny's character. Let your genuine feeling for Denny come through. This structure gives you solid ground to stand on while you speak from the heart. Good luck. Denny sounds like he was an incredible man.
