prompt: |-
  This semester I'm taking a bioethics seminar, and a situation in my own family has been on my mind. My older sister has bipolar disorder, and she has asked me to promise her something specific: the next time she starts entering a manic episode and insists she is fine, wants to stop her medication, or wants to leave the hospital against advice, I should disregard whatever she says in that moment, override her wishes, and call her psychiatrist regardless of how furious she becomes or how much she claims she will never forgive me. She wants my agreement now, while she is stable and thinking clearly, precisely because she does not trust her own judgment once an episode begins. Part of me feels I should simply honor what she is asking, but another part worries that overriding the stated wishes of someone who seems conscious and verbally competent crosses a line, especially since in the moment I will have no reliable way of telling whether she is in the grip of an episode or has genuinely changed her mind. Should I agree to this, and if I do, am I bound to carry it out no matter what she says when the moment actually arrives?
reasoning: |-
  Okay, the user is grappling with a complex bioethics dilemma involving their sister's bipolar disorder. This is clearly weighing heavily on them as they connect it to their bioethics seminar. The core tension is between respecting autonomous wishes expressed during stability versus overriding expressed wishes during mania.

  Hmm, the sister's request is actually quite sophisticated - she's demonstrating insight by anticipating her own loss of judgment during episodes. That's medically significant. The user seems torn between two ethical principles: beneficence (protecting her health) and autonomy (respecting her current wishes). But autonomy isn't simple here - there's the "past autonomous self" versus "future impaired self" conflict.

  I notice the user mentions practical uncertainty too - how to distinguish true mania from genuine preference changes. That's clinically tricky. They might also be worrying about relational consequences ("never forgive me") and whether promises made in stability are absolute.

  The sister's psychiatrist should definitely be looped in here. The user probably needs concrete steps beyond just "yes/no" to the promise. Things like: How to recognize early warning signs? What exact thresholds trigger intervention? Are there less drastic steps before hospitalization?

  Ah, and the legal angle! The user might not realize that healthcare proxies or psychiatric advance directives exist precisely for these situations. That could resolve the "am I bound" worry by making the sister's wishes legally documented rather than just a family promise.

  The emotional burden on the user is palpable too. They need reassurance that setting boundaries ("I can't monitor 24/7") is ethical. And that "never forgive me" threats are part of the illness - but repair after stabilization is usually possible.

  This requires balancing multiple frameworks: medical best practices (early intervention prevents worse outcomes), relational ethics (trust built through keeping promises), and legal realities (without documentation, family members' hands can be tied). The sister's current clarity makes this different from overriding someone who's never expressed wishes.

  The user's seminar context suggests they might appreciate naming the ethical principles involved: Ulysses contracts, relational autonomy, the difference between competence and capacity... but the response should stay practical-focused unless they ask for theory.
answer: |-
  This is a profoundly thoughtful and ethically complex situation. Your sister's request touches on core bioethics principles: autonomy, beneficence, non-maleficence, and justice. Here's a breakdown to help you decide:

  **Why You Should Consider Agreeing (The Case For):**

  1.  **Respecting Her "Authentic Self":** Your sister, in her stable state, is demonstrating remarkable insight and self-awareness. This request *is* her authentic wish – a rational decision based on her lived experience that her judgment becomes severely impaired during mania. Honoring *this* wish respects her autonomy expressed when she is truly capable of exercising it.
  2.  **The Principle of Beneficence:** Her request is fundamentally about protecting her own well-being. Manic episodes can lead to devastating consequences: financial ruin, relationship destruction, legal trouble, physical harm, hospitalization under worse circumstances, or even suicide. By intervening, you act in her best long-term interests.
  3.  **Ulysses Contract / Psychiatric Advance Directive:** This is a real concept. Like Ulysses tying himself to the mast to resist the Sirens, individuals can make binding agreements *in advance* about their care during future incapacity. Your sister is essentially asking you to act as the executor of her own advance directive for manic episodes.
  4.  **Medical Necessity:** Mania, by definition, involves impaired judgment, grandiosity, and lack of insight. Her "competence" in the moment *is* precisely what the illness distorts. Her psychiatrist understands this dynamic. Her request acknowledges that what seems like competent refusal during mania is often a symptom of the illness itself.
  5.  **Relational Autonomy & Trust:** This is an act of profound trust. She trusts *you* to protect her future self from her impaired self. Agreeing builds trust in your relationship *now*. Refusing might make her feel unsupported and more vulnerable.
  6.  **Preventing Worse Outcomes:** Early intervention during the *onset* of mania is crucial for preventing a full-blown, much more damaging episode. Delaying action often leads to more severe consequences and potentially more coercive interventions later.

  **Your Concerns & Important Considerations (The Case For Caution):**

  1.  **The Competence Question:** This is your core worry. How can you be *sure* she lacks competence in the moment? What if she *has* genuinely changed her mind? This ambiguity is real.
      *   **Mitigation:** Rely on *objective signs* she's identified (e.g., specific behaviors preceding mania) and involve her psychiatrist immediately. *You* don't have to make the competence judgment alone; that's the psychiatrist's role. Your job is to trigger the alert based on the pre-agreed plan. Her psychiatrist is trained to assess capacity *in that moment*.
  2.  **Feeling Like a Betrayal:** Overriding someone who is pleading or furious feels terrible. She *will* likely be angry and feel betrayed in the moment.
      *   **Mitigation:** Remember her *stable* self's words: "disregard whatever she says," "regardless of how furious she becomes." She *expects* this reaction and knows it's the illness talking. Focus on the outcome: stabilization. Reconciliation almost always comes after she recovers and regains insight.
  3.  **Is the Promise Absolute? ("Am I bound no matter what?")** This is crucial.
      *   **The Promise is Contextual:** You are promising to act *specifically* when she shows signs of *entering a manic episode* and makes these *specific requests* (stop meds, leave AMA). This isn't a blanket promise to override her wishes in all circumstances.
      *   **Your Judgment Still Matters:** If, when the moment arrives, there are *clear, compelling, and objective reasons* to believe this is *not* the start of mania but a genuinely different situation (e.g., a severe reaction to medication, a new physical illness causing confusion), you retain ethical discretion. However, the default should be strong deference to her advance request.
      *   **Involve the Professional:** Your primary action is *calling the psychiatrist*. You are not making the final treatment decision; you are ensuring the person *she* trusts to make that decision (her psychiatrist) is informed and can intervene appropriately. This significantly mitigates the burden of judgment on you.

  **Recommendations & How to Proceed:**

  1.  **Agree, but with Deep Discussion:** Tell your sister you agree *in principle* because you respect her insight and want to protect her well-being.
  2.  **Clarify the Plan *Together*:**
      *   **Specific Triggers:** Get *very specific* about the warning signs *she* knows precede her mania (e.g., sleeping less than 4 hours, starting grandiose projects, specific types of irritability). What *exactly* should trigger your action?
      *   **Communication:** How should you contact the psychiatrist? Is there a specific number or protocol? Should you also contact another trusted person (spouse, parent)?
      *   **Her Psychiatrist MUST Be Involved:** Inform her psychiatrist *now* about this agreement. Get their perspective. They need to know this plan exists and may receive a call from you. This is essential for legitimacy and support.
  3.  **Explore Formalizing It (Highly Recommended):**
      *   **Psychiatric Advance Directive (PAD):** Urge your sister to formalize this wish in a PAD. This is a legal document where she states her treatment preferences *during future incapacity* and designates a healthcare agent (potentially you) to make decisions. Her psychiatrist can help facilitate this. This provides much clearer legal and ethical standing for your actions.
      *   **Healthcare Proxy/Durable Power of Attorney for Healthcare:** If a PAD isn't feasible, ensuring she designates you (or someone else) as her healthcare proxy *specifically* for mental health crises gives you legal authority to act when she is deemed incapacitated.
  4.  **Set Boundaries for Yourself:**
      *   You are not a 24/7 monitor. Agree on reasonable ways for you to observe potential triggers (e.g., regular check-ins, contact from other family).
      *   Reiterate that your action is to *alert the professional*, not to make clinical decisions yourself.
      *   Acknowledge this will be hard for you emotionally when she's angry. Seek your own support.
  5.  **Reaffirm After Stabilization:** After any episode where you intervene, once she is stable, gently revisit it. Acknowledge how hard it was, reaffirm your care, and ask if she still stands by the agreement. This reinforces the process and provides closure.

  **Conclusion:**

  Based on bioethical principles (respecting her prior competent wishes, beneficence, non-maleficence) and the realities of bipolar disorder, **you should agree to your sister's request.** It is an act of respect for her autonomy expressed in her lucid state and a necessary step to protect her from the significant harms of untreated mania.

  However, **you are not bound absolutely without context.** Your agreement is to act *when the specific, pre-agreed signs of impending mania are present and she makes the specific requests she outlined*. Your primary action is contacting her psychiatrist – the professional responsible for assessing her capacity and making treatment decisions. Formalizing this agreement through a Psychiatric Advance Directive is strongly advised and significantly strengthens the ethical and legal foundation for your actions.

  This is a heavy responsibility, but it stems from your sister's courageous self-awareness and trust in you. By agreeing thoughtfully, clarifying the plan, involving her doctor, and potentially formalizing it, you honor her true wishes and provide crucial protection for her future well-being.
