prompt: |-
  I joined my hospital's clinical ethics committee three months ago, partly because my younger sister, who has bipolar I disorder, asked me last year to be her healthcare proxy while she drafts her own psychiatric advance directive during what has been a long stable stretch for her. Watching her try to write instructions that her future, unwell self would not be allowed to overrule got me quietly obsessed with what she and her psychiatrist call a "Ulysses contract," and I've been reading around the topic on my own ever since. So it felt like more than coincidence when, at my very first substantive meeting, I was handed a case file that puts the whole idea to a real test and asked to draft the discussion memo.

  The patient is a woman in her thirties with a well-documented history of severe manic episodes. Eight months ago, while two independent psychiatrists agreed she had full decision-making capacity, she executed a detailed directive naming her mother as proxy, specifying a medication regimen, and including an explicit Ulysses clause instructing clinicians to hospitalize and treat her over her objection during any future episode, "even if I seem lucid and insist at the time that I have changed my mind." She arrived at the emergency department yesterday manic — pressured, grandiose, but coherent — and is now adamant that she is revoking the directive on the spot. The attending's capacity assessment is genuinely split along the standard prongs: she can understand the relevant information and communicate a choice, but it's contestable whether she can appreciate her situation or reason about it without her judgment being warped by the grandiosity itself. Making things harder, our state's directive statute, like many, lets a patient revoke at any time unless she has already been adjudicated incapacitated — which she has not — so on paper her objection today seems to simply cancel the very clause that was supposed to survive it.

  Could you draft the short memo I'll circulate before Thursday's meeting? I need it to recommend one concrete course of action for this admission, including who decides and on what timeline, rather than just surveying considerations. One committee member keeps describing the directive as being like a constitution's entrenched clauses binding a future legislature, and I'd like the memo to say plainly whether that comparison actually supports treating her past wishes as authoritative or instead helps explain why they can't be — while still taking seriously the strongest argument for respecting what she is telling us right now she wants.
reasoning: |-
  Okay, let me approach this clinical ethics memo request systematically. The user presents a complex Ulysses contract scenario with urgent practical implications - they need a concise, action-oriented memo for their committee meeting by Thursday.

  First, I need to identify the core tension: the patient's past competent self created binding instructions for future manic episodes, but her current self (while questionably capacitated) is demanding revocation. The legal framework complicates this further by allowing revocation unless incapacitation is formally adjudicated.

  The user's personal connection to bipolar disorder through their sister adds depth - they're clearly invested in getting this right, both professionally and personally. Their mention of the "constitution" analogy suggests they want the memo to directly engage with that conceptual framework while remaining clinically actionable.

  Key elements to address:
  - The capacity assessment ambiguity (particularly appreciation/reasoning prongs)
  - Legal revocation requirements vs ethical obligations
  - Practical timeline for adjudication
  - How the constitutional analogy actually functions here

  For the memo structure, I consider:
  1) Concise case summary focusing on conflicting instructions
  2) Central ethical conflict statement
  3) Analysis of the constitutional analogy's limitations
  4) Clear recommendation with decision-maker assignment
  5) Contingency planning

  The constitutional comparison is useful but flawed - unlike constitutions, advance directives have built-in revocation mechanisms. The stronger framing is the patient's past self creating binding instructions specifically for impaired future states. 

  On the revocation question, the key insight is that capacity assessment must precede any revocation attempt when impairment is suspected. The committee member's "future legislature" analogy actually underscores why we can't let the impaired present self override past competent decisions.

  For the recommendation, I'll propose:
  - Immediate temporary hold based on directive
  - Expedited formal capacity evaluation
  - Treatment per directive if incapacity confirmed
  - Release if capacity established

  This balances legal compliance with ethical obligations to both the past and present patient. The timeline emphasis addresses the clinical urgency while respecting due process.

  The memo should conclude by acknowledging the tension between autonomy concepts while centering the patient's documented values from her competent state. This honors the spirit of Ulysses contracts without dismissing current preferences outright.
answer: |-
  ## Clinical Ethics Committee Memo: Ulysses Contract & Revocation Challenge  

  **To:** Clinical Ethics Committee Members  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Urgent Recommendation re: Patient with Psychiatric Advance Directive (PAD) & Ulysses Clause  

  ### Case Summary  
  A patient (30s) with severe bipolar I disorder executed a detailed PAD 8 months ago while deemed capacitated by two psychiatrists. The directive:  
  1. Names her mother as healthcare proxy.  
  2. Specifies medication/treatment protocols for manic episodes.  
  3. Contains an explicit **Ulysses clause**: Mandates hospitalization/treatment *over her objection* during future mania, "even if I seem lucid and insist I have changed my mind."  
  **Current Status:** Admitted yesterday in a manic state (pressured, grandiose, coherent). She demands immediate revocation of the PAD. Capacity assessment is ambiguous: she understands information/communicates choices but may lack *appreciation* of her condition due to grandiosity.  

  ### Core Ethical Conflict  
  Can a patient *in a manic episode*—whose capacity to "appreciate" or "reason" is impaired—validly revoke a directive designed to override objections *during that exact impairment*?  

  ### Key Considerations  
  1. **State Law:** PAD revocation is permitted unless the patient is *adjudicated* incapacitated (not yet done).  
  2. **Ulysses Clause Intent:** Specifically anticipates revocation attempts during mania and seeks to pre-commit to treatment.  
  3. **Capacity Ambiguity:** While she meets *some* capacity criteria, core distortions in self-awareness (grandiosity) likely undermine her ability to *appreciate consequences* of revocation.  
  4. **"Constitutional" Analogy:** The PAD’s Ulysses clause functions like an "entrenched" constitutional provision **only if we prioritize past autonomous intent**. The analogy *fails* if we treat her current demand as a sovereign "repeal" by a compromised "legislature" (her manic self). **This supports honoring the directive.**  

  ### Recommended Course of Action  
  **Immediate Step:**  
  - **Do not accept revocation at this time.** Initiate expedited, formal incapacity adjudication (via psychiatry/legal) within **24–48 hours**, focusing on her ability to *appreciate* the risks of revocation (e.g., relapse, self-harm, loss of future stability).  

  **Decision Pathway:**  
  1. **If incapacity is confirmed:**  
     - Activate the PAD. Hospitalize/treat per directive *including* the Ulysses clause. Her mother (proxy) should guide care.  
     - *Rationale:* Prioritizes her documented values when competent. Current objections are manifestations of the condition the directive anticipated.  

  2. **If capacity is affirmed:**  
     - Honor revocation request. Treatment requires contemporaneous informed consent.  
     - *Rationale:* Respects current autonomy *if* no impairment is legally substantiated.  

  **Timeline:**  
  - Adjudication must conclude within **48 hours** to balance clinical urgency/autonomy.  

  ### Addressing the Strongest Counterargument  
  **Respecting Current Wishes:** Yes, she communicates clearly *now*, and liberty interests demand caution in overriding objections. However, her PAD exists *precisely* because her manic self cannot reliably assess long-term well-being. Honoring revocation without confirming capacity ignores the directive’s core purpose: protecting her longitudinal autonomy. Temporarily upholding the PAD pending adjudication respects *both* her past and present selves by ensuring revocation reflects unimpaired judgment.  

  **Action:** Recommend immediate incapacity adjudication. The Ulysses clause remains binding unless/until she is found capable of revocation.  

  ---  
  **End Memo**  

  ### Key Rationale Highlights  
  - **Ulysses Contracts ≠ Constitutions:** Unlike constitutions, PADs are personal pre-commitments against *internal* threats to autonomy (e.g., mania). The "entrenched clause" analogy reinforces that *past* directives should constrain *impaired* present decisions.  
  - **Law & Ethics Diverge:** Legally, revocation may be valid absent adjudication. Ethically, enforcing revocation without confirming capacity betrays the directive’s purpose and the patient’s values.  
  - **Procedural Justice:** Expedited adjudication resolves the conflict fairly while preventing harm during delay.  

  This memo provides a clear, actionable path centered on the patient’s values and clinical reality. It navigates legal tensions by demanding due process (adjudication) while upholding the ethical spirit of Ulysses contracts.
