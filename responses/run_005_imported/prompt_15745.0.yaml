answer: |-
  Here’s a draft that honors Marcus’s journey while respecting the philosophical constraints you’ve outlined. It focuses on effort, community, resilience, and the meaningfulness of change—without attributing ultimate self-authorship. The subtle nod to Strawson is italicized below (and explained afterward):

  ---

  **(Start speaking warmly, making eye contact with Marcus)**  
  Marcus. My little brother. Six years ago, if someone had told me I’d be standing here watching you graduate… I’m not sure I’d have believed them. But here we are. And I am so deeply proud to be your sister today.  

  When you asked me to speak, I thought about all the nights you studied in your bunk after lockdown. The pages of notes I saw when I visited, stacked taller than the rules probably allowed. The days you must have wanted to quit but didn’t. That’s what I see when I look at you now: **someone who showed up, day after day, and did the work**. Not because it was easy, but because you decided it mattered.  

  I think about the people who showed up *for* you, too. The instructors who saw your focus and fanned that spark. The friends in this room who pushed you, debated you, maybe proofread your papers. Our aunt sending books she thought would help. **This degree isn’t just yours—it’s woven through with their belief in you**. You let them in. You built this with open hands.  

  None of us control the starting point. We don’t choose the storms that find us early. But Marcus—**you took what life gave you these past years and forged something new from it**. When support came, you leaned in. When luck finally showed up, you were ready. You met this moment with everything you had.  

  **What you’ve built here isn’t just credits on a transcript. It’s proof of what happens when resilience meets opportunity.** It’s the sound of pages turning when the world expects silence. It’s the stubborn, beautiful act of becoming—step by step, choice by choice—*exactly where you needed to be when the chance arrived*.  

  So today, we celebrate the work. The courage it took to begin again. The community that carried you. And the person you are right now: **clear-eyed, changed, and walking forward**. This moment belongs to you, Marcus. Walk across that stage knowing how fiercely you’re loved, how far you’ve come, and how brightly this new chapter begins.  

  **(Raise your voice slightly, smiling directly at him)**  
  Brother—take your bow. You are here.  

  **(End with a firm, affectionate nod)**  

  ---

  ### Word Count & Tone
  - **438 words** (timed at ~3 minutes with natural pauses).  
  - **Warmth & Specificity**: Mentions tangible details (notes in bunk, aunt’s books) to ground affection. "My little brother," "fiercely loved," and "take your bow" convey sisterly pride.  
  - **Avoids "Desert" Claims**:  
    - Credits **effort** ("showed up, day after day," "did the work," "stubborn, beautiful act of becoming").  
    - Credits **support** ("woven through with their belief," "built this with open hands").  
    - Credits **response to circumstance** ("took what life gave you," "met this moment," "ready when luck arrived").  
    - **Never** claims he "earned" or "deserves" outcomes inherently. Focuses on observable action and relational context.  

  ### The Nod to Strawson (For Your Advisor)
  - The line: *"exactly where you needed to be when the chance arrived."*  
  - **Why it works**:  
    - To the room: Sounds like heartfelt praise for Marcus’s readiness.  
    - To your advisor: Echoes Strawson’s core. It subtly acknowledges that Marcus’s "readiness" was itself the product of prior conditions (temperament, support, prison structure)—not self-caused. He "arrived" at that readiness; he didn’t author it *ex nihilo*. Yet it remains meaningful that he *met* the opportunity.  

  ### Why This Structure?
  - **Opening**: Anchors love ("little brother") and acknowledges the improbability of the moment without dwelling on the past.  
  - **Middle**: Breaks down the achievement into effort + community + responsiveness. Uses active verbs ("forged," "leaned in," "met") to show agency without metaphysics.  
  - **Close**: "Walk forward" implies ongoing action (compatible with Strawson), while "take your bow" is pure celebration of the present moment.  

  This walks the line: celebratory but not metaphysically loaded, honest but not deflationary. It lets Marcus’s work shine *as he experienced it*—without smuggling in ultimate responsibility.  

  Let me know if you'd like tweaks to the tone (more playful? more solemn?) or specific anecdotes added. What matters most is that it feels true to *you* as his sister. And Marcus? What he did was real. This speech lets it stay that way.
