answer: |-
  Here's an example illustrating the tension, using the 1991 Gulf War:

  **Scenario: Operation Desert Storm (1991 Gulf War)**

  1.  **The Conflict:** Iraq, under Saddam Hussein, invades and annexes Kuwait in August 1990. A US-led international coalition forms, demanding Iraqi withdrawal. When diplomacy fails, the coalition launches Operation Desert Storm in January 1991 to liberate Kuwait.

  2.  **Just War Claim (Macro Level):**
      *   **Coalition (Just Side):** They possess a *just cause*: defending Kuwait's sovereignty against an unprovoked act of aggression (a core *jus ad bellum* criterion). They also have *right intention* (liberation, not conquest), *legitimate authority* (UN authorization), *last resort* (exhausted diplomacy), and a *reasonable chance of success*.
      *   **Iraq (Unjust Side):** Iraq's invasion is a clear act of aggression violating Kuwait's sovereignty. Its cause (annexation) is unjust. Its actions within Kuwait (looting, atrocities) further violate *jus in bello* principles.

  3.  **Equal Moral Status of Combatants (Micro Level):**
      *   **Coalition Soldier:** A young US Marine, drafted or enlisted, following lawful orders from their government. They believe they are defending a victim of aggression. They fight according to the rules of war (*jus in bello* - distinction, proportionality, avoiding unnecessary suffering).
      *   **Iraqi Soldier:** A young Iraqi conscript, likely from a poor background, forced into service. They may have been fed propaganda about Kuwait "belonging" to Iraq or threatened with severe punishment for desertion. They are also following orders from their (illegitimate) authority. On the battlefield, many Iraqi conscripts fought conventionally without committing specific war crimes (though the regime itself did).

  **The Tension:**

  *   **Macro Level:** The Coalition's *cause* is objectively just; Iraq's *cause* is objectively unjust. This justifies the Coalition's resort to war (*jus ad bellum*) and frames the conflict morally.
  *   **Micro Level:** The individual Marine and the individual Iraqi conscript share a similar moral status *as combatants*:
      *   **Both are non-innocents:** By taking up arms, both have forfeited their general immunity from attack under the laws of war. They are legitimate targets for each other.
      *   **Both are largely instruments:** They are primarily agents carrying out the political decisions and military strategies of their respective states/commanders. Their individual moral culpability for the *overall justice of the war* is minimal or non-existent. The conscript, especially, may have no meaningful choice or accurate information.
      *   **Both have duties under *jus in bello*:** Both are obligated to follow the rules of combat (distinction, proportionality). Killing either in combat, assuming they follow these rules, isn't *murder* but a tragic consequence of war.
      *   **Symmetry in Combat:** On the battlefield, the Marine is morally permitted to kill the Iraqi conscript to achieve the just objective of liberation. Simultaneously, the Iraqi conscript is morally permitted (even obligated by their state) to kill the Marine to defend their position/unit/country against an invading force. Their *permission* to kill each other stems from their combatant status, not the justice of their respective causes.

  **What Creates the Tension?**

  The tension arises from the **separation of the moral assessment of the war's cause (*jus ad bellum*) from the moral assessment of the individual combatant's status and actions (*jus in bello*)**:

  1.  **Collective vs. Individual Responsibility:** The justice of the cause is determined by the actions and decisions of political leaders and the state *as a collective entity*. Individual combatants are rarely responsible for initiating the war or determining its justice. Holding the *individual soldier* morally responsible for the *state's unjust cause* seems unfair, especially for conscripts or misinformed troops. This separates their moral status *as combatants* from the macro-level justice.
  2.  **Function of Combatant Status:** The equal moral status (and specifically, the "moral equality of combatants") is a practical and legal principle designed for the realities of warfare. It allows for symmetrical rules of engagement (*jus in bello*) regardless of the war's origin. If combatants on the unjust side were considered inherently "guilty" or "murderers," it would be impossible to apply consistent rules of war or treat POWs humanely. It recognizes soldiers as agents acting under authority, not necessarily as personal moral arbiters of the conflict.
  3.  **The Moral Dilemma of Killing:** The tension becomes acute when considering the act of killing. The Marine kills an Iraqi conscript fighting for an unjust cause. Yet, that conscript, as an individual combatant, isn't morally culpable *for the invasion itself* and is just defending themselves/their position. Killing them is permitted by *jus in bello*, but the Marine is fighting *for* a just cause. Conversely, the conscript kills a Marine fighting *for* a just cause, but the conscript is *only* permitted to do so because of their combatant status, not because their cause is just. This creates a moral asymmetry at the macro level (just vs. unjust cause) coexisting with a symmetry at the micro level (permission to kill based on combatant status).
  4.  **Potential for Exploitation:** The unjust side can exploit the equal moral status of combatants. By fielding soldiers (especially conscripts), they gain a shield – their soldiers can fight and kill just soldiers "legitimately" under *jus in bello*, even though the war itself is illegitimate.

  **Conclusion:**

  The Gulf War example starkly shows the tension: While the Coalition's cause to liberate Kuwait was just and Iraq's aggression was unjust, the young conscript facing the young Marine on the battlefield possessed an equal moral status *as a combatant*. Neither was morally responsible for starting the war; both were instruments of their states, both were legitimate targets, and both were bound by the same rules of engagement. The tension lies in reconciling the clear moral asymmetry of the *war itself* with the necessary functional and moral symmetry applied to *individual fighters* for the practical and ethical conduct of warfare. This is a core challenge within Just War Theory.
