  First, I need to recall the key concepts here. The just war theory has criteria like just cause, legitimate authority, right intention, proportionality, etc. But the equal moral status of combatants comes from the idea that soldiers on both sides are just doing their duty, following orders, and shouldn't be blamed personally for the war's justice.

