prompt: |-
  Okay so I'm drafting a chapter for my sci-fi novel where teleportation works the Star Trek way -- you get scanned and disintegrated here, and a perfect copy gets assembled somehwere else -- and I want a scene where two of my characters have it out over whether the person who steps out the other end is actually them, or just a very convincing copy of a dead person. I know enough to know this is basically Parfit's teleporter thing, so please don't give me the lazy reddit version of this argument ("what if the original wasn't destroyed, checkmate"). Write me a dialogue between a character who's a hardcore reductionist about personal identity -- no extra "fact" about who's who beyond the physical and psychological continuity, and honestly not even sure identity is the thing that should matter to us in the first place -- versus a character who thinks there's a further fact about survival that's seperate from all that continuity stuff, so a flawless copy might just be a way of dying without anyone, including the copy, noticing. I want them to actually get into the version where the original body doesn't die right away, so for a while there's an "original" dying back on Earth while a perfect copy is already off living life on Mars, and into whether identity could come in degrees instead of being all-or-nothing. Neither one should fold or strawman the other -- they should each land real hits on the other's actual position. Bonus points if there's some real stakes on the table, like one of them has a boarding pass for the machine sitting in their coat pocket.
reasoning: |-
