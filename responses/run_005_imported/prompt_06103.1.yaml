  Underlying philosophies? Consequentialism (lenient side: no harm, no foul) vs. deontology (strict side: rules are absolute). Also virtue ethics: what does this decision say about the institution's character? The user might be struggling because both sides have valid points but prioritize different ethical frameworks.

