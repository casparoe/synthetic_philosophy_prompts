answer: |-
  You've hit on a fascinating and still-debated philosophical crux! Russell's position in that passage is **distinct from both modern epistemicism and supervaluationism.** He's advocating for a **truth-value gap view**, specifically rejecting the Law of Excluded Middle (LEM) for vague predicates. Here's the breakdown:

  1.  **Russell's Claim (Truth-Value Gaps):**
      *   **Core Thesis:** For borderline cases of a vague predicate (like "bald" or "red"), the statement "X is bald" is *neither true nor false*. It lacks a definite truth value.
      *   **Rejection of LEM:** Crucially, this means the disjunction "X is bald OR X is not bald" is also *not true* for borderline cases. LEM fails. There *is* a third status: indeterminate or borderline.
      *   **Reason:** The meaning of the vague word itself doesn't determine a sharp boundary. The "extent of whose application is essentially doubtful." Vagueness is semantic, not epistemic (about our knowledge).
      *   **Consequence:** Russell's view requires a non-classical logic where LEM isn't universally valid. Statements can be truth-valueless.

  2.  **Epistemicism (Williamson, Sorensen):**
      *   **Core Thesis:** There *is* a precise, sharp boundary for vague predicates (e.g., a specific number of hairs defining baldness). Vagueness is *only* due to our ignorance of this boundary.
      *   **Upholds LEM:** For *any* individual at *any* time, "X is bald OR X is not bald" is *necessarily true*. One disjunct is true, the other false – we just don't know which one.
      *   **Contrast with Russell:** Epistemicism *preserves* classical logic (including LEM) by insisting there *is* a fact of the matter, even if unknowable. Russell explicitly denies this sharp boundary exists *at all*, calling the search for a specific hair "absurd."

  3.  **Supervaluationism (Fine, Keefe):**
      *   **Core Thesis:** The meaning of a vague predicate determines a *range* of admissible precisifications (ways of making it precise). A statement is:
          *   **Super-true:** True on *all* admissible precisifications.
          *   **Super-false:** False on *all* admissible precisifications.
          *   **Neither (Indeterminate):** True on some precisifications, false on others.
      *   **Upholds LEM (Super-validity):** "X is bald OR X is not bald" is *super-true* (true on every precisification). Even in borderline cases, every precisification makes *one* disjunct true.
      *   **Contrast with Russell:**
          *   **LEM:** Supervaluationism *recovers* LEM as a logical truth ("super-true") for vague languages. Russell explicitly says LEM *fails*.
          *   **Truth Status:** While both views recognize borderline cases where neither "X is bald" nor "X is not bald" is *definitely* true (super-true for SV, simply true for Russell), SV provides a mechanism (precisifications) to explain *why* LEM holds globally despite local indeterminacy. Russell provides no such mechanism; he just asserts LEM fails.
          *   **Sharp Boundaries:** SV avoids sharp boundaries *in the actual vague language* (no single precisification is "the correct one"), but boundaries exist *within each precisification*. Russell rejects sharp boundaries *simpliciter*.

  **Where Russell Stands & Why He's Different:**

  *   **Third Position:** Russell is firmly in the **truth-value gap** camp. He believes borderline cases genuinely lack a truth value, and this directly invalidates LEM for statements involving vague predicates applied to borderline cases. "P or not-P" can be false (or truth-valueless) when 'P' is vague and applied to a borderline case.
  *   **Commitment:** He is committed to the existence of genuine semantic indeterminacy ("extent of whose application is essentially doubtful") that isn't resolvable by discovering hidden facts (contra epistemicism) or by quantifying over precisifications (contra supervaluationism).
  *   **Against Both Modern Camps:**
      *   **Epistemicism:** He rejects the existence of a sharp cutoff point ("absurd").
      *   **Supervaluationism:** He rejects the idea that LEM must hold ("not true when symbols are vague"). SV *insists* LEM holds (super-true) for the disjunction, even if neither disjunct is super-true/false in borderline cases. Russell says the disjunction itself *isn't true* in borderline cases.
  *   **Charitable Reading?** While Russell anticipates the *problem* that both epistemicism and supervaluationism try to solve (how to handle borderline cases), his *solution* – abandoning LEM for vague predicates – is fundamentally different. Neither modern camp accepts that LEM fails; they both find ways to preserve it within their frameworks.

  **Why Russell's View Isn't Dominant Today:**

  1.  **Commitment to Non-Classical Logic:** Rejecting LEM requires significant revisions to classical logic, which is deeply embedded in mathematics, science, and philosophy. Epistemicism and supervaluationism offer ways to preserve classical logic.
  2.  **The Appeal of Preserving LEM:** LEM is intuitive for many clear-cut cases. Modern views try to save it even for vague languages, seeing its failure as a bigger cost than positing unknowable boundaries (epistemicism) or complex semantics over precisifications (supervaluationism).
  3.  **Development of Formal Frameworks:** Supervaluationism provides a powerful formal model for vagueness that captures many intuitions without abandoning LEM. Epistemicism offers a robust (if counterintuitive to many) defense of classical semantics.

  **In Summary:**

  Russell isn't anticipating epistemicism or supervaluationism; he's offering a distinct third option. He **rejects the Law of Excluded Middle for vague predicates applied to borderline cases**, believing these statements genuinely lack a truth value. Both epistemicism and supervaluationism, despite their profound differences, are united in **preserving the universal truth of "P or not-P"** for vague predicates, even for borderline cases. Russell explicitly denies this preservation. His view is a clear precursor to modern **truth-value gap** or **indeterminacy** theories of vagueness, which remain a minority position compared to epistemicism and supervaluationism, largely because of the perceived cost of abandoning classical logical laws like LEM. Your confusion is justified – Russell *is* staking out different ground.
