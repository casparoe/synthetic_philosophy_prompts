  I remember McClennen's resolute choice: agents evaluate plans over time, not just immediate choices. A resolute agent would see the whole sequence and stick to a plan avoiding exploitation. The deeper point is about diachronic rationality versus synchronic. Synchronic rationality focuses on each moment, leading to pumping, while diachronic allows evaluating entire strategies. 

