prompt: |-
  Random research question for a novel I'm drafting -- I've got a crime family whose loyalty tests keep escalating over the book: first it's a specific tattoo, then torching your own restaurant for the family, then something worse. I want that escalation to have real internal logic, not just read as "mob bosses are sadistic for drama." I vaguely remember the handicap principle from biology (peacock tails, gazelles stotting at lions to prove they're too fit to bother chasing) and that its been extended to human status and loyalty signalling, but I never got the actual mechanics of why it works. Can you give me the most important implications of costly signalling theory for a scenario like mine -- specifically, what determines how costly a loyalty test needs to be before its actually trustworthy, why a plain promise or oath stops working past a certain point, and whether the theory predicts some kind of ceiling where escalating further stops making sense even by the family's own logic?
