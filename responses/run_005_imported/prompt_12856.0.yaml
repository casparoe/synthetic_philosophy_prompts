answer: |-
  Here’s a toast that threads that needle – precise for the cohort, meaningful for all, and anchored in warmth:

  **(Raise glass, warm smile towards the couple)**  

  "Friends, family, and esteemed colleagues in jurisprudence… *(slight knowing glance towards cohort)* …today is pure joy. [Partner A] and [Partner B], seeing you both here, radiating happiness, surrounded by love… it’s exactly where you belong.  

  As many of you know, [Partner A] and I have spent years wrestling with big questions – questions about society, law, and what holds us together. Some of our fiercest debates *(nod to cohort)* centered on ideas forged decades ago, like those between H.L.A. Hart and Lord Devlin. They grappled with a fundamental tension: Can – or should – the criminal law enforce a society’s prevailing morality simply *because* it’s the prevailing morality?  

  Devlin argued passionately that shared morals were society’s essential glue – remove them, he feared, and disintegration would follow. The ‘disintegration thesis,’ we called it. Fear of the unknown, fear of change, fear that difference itself might unravel the social fabric.  

  Hart’s response, grounded in principle, was powerful in its restraint. He didn’t necessarily champion new moralities; instead, he fiercely defended a vital limit: the state, he argued, has no business intruding into the realm of truly private, consensual conduct between adults. His harm principle drew a bright line: law exists to prevent tangible harm to others, not to police private lives based solely on tradition or majority discomfort. It was a shield *against* coercion, not a sword *for* any particular way of living.  

  **(Pivot to the couple, voice softens, becomes more personal)**  

  Why mention this old academic debate on such a joyful day? Because that struggle – that insistence on a space for private life, free from the heavy hand of state-enforced conformity – is part of the quiet foundation upon which a moment like *this* becomes possible. It’s the intellectual groundwork that helped carve out the legal and social oxygen allowing love, in its diverse and beautiful forms, to simply *be*. Hart’s precise, principled argument wasn’t about endorsing any specific relationship; it was about clearing the ground, removing an ancient barrier, and saying: *This is not the law’s domain.*  

  **(Voice strengthens with warmth and conviction)**  

  And what do we see standing on that cleared ground today? Not disintegration. Far from it. We see [Partner A] and [Partner B]. We see profound commitment. We see a family, new and extended, celebrating. We see friends, old and new, united. We see love – not as an abstract concept debated in seminar rooms *(another glance to cohort, warm smile)* – but as a vibrant, resilient, *integrating* force. Their love, their choice, their commitment *builds* community. It strengthens the fabric. It proves that the old fears were just that: fears, not prophecies.  

  So, let’s raise our glasses:  
  To [Partner A] and [Partner B] – a magnificent testament to the power of love that thrives in the space freedom provides.  
  To the principle that private joy deserves protection.  
  And to the beautiful, undeniable truth that love, freely chosen and celebrated, doesn’t disintegrate society… it makes it whole. Cheers!"

  **Why this works:**

  1.  **Precision for the Cohort:**
      *   Accurately names Hart's core argument ("state has no business intruding... truly private, consensual conduct").
      *   Explicitly states his position was a *limit* ("shield against coercion") and *not* a positive endorsement ("didn't necessarily champion new moralities," "not about endorsing any specific relationship").
      *   Correctly frames the "cleared ground" metaphor – removing a barrier, not building a specific structure.
      *   Uses the term "disintegration thesis" correctly in context.
      *   Acknowledges the academic context ("wrestling with big questions," "seminar rooms").
  2.  **Accessibility for Family:**
      *   Frames the debate in universal terms: "society's glue," "fear of change," "difference might unravel the fabric," "space for private life," "removing an ancient barrier."
      *   Quickly moves past jargon to the human impact ("allowing love... to simply *be*," "cleared ground," "vibrant, resilient, *integrating* force").
      *   Uses relatable contrasts: "fear" vs. "joy," "disintegration" vs. "builds community," "old fears" vs. "beautiful truth."
      *   Anchors everything in the visible, emotional reality of the couple and the celebration ("seeing you both here," "profound commitment," "family... celebrating").
  3.  **Warmth and Focus on the Couple:**
      *   Starts and ends with the couple and their love.
      *   Clearly links the philosophical point to *their* happiness and *their* moment ("part of the quiet foundation," "a moment like *this* becomes possible," "We see [Partner A] and [Partner B]").
      *   The final paragraph is purely celebratory and forward-looking.
      *   Tone shifts from explanatory to deeply personal and emotional.
  4.  **Honest Connection:**
      *   Doesn't claim Hart foresaw or advocated for same-sex marriage. Focuses accurately on how his *principle* of limiting state power in private life created essential preconditions.
      *   Highlights the *result* (love flourishing) disproving the *fear* (disintegration), which is a powerful and truthful narrative.

  **Delivery Tip:** Practice the pivot points – especially the shift from explaining Hart/Devlin to focusing on the couple ("Why mention this..."). Let your warmth and genuine happiness for your friends carry the emotional weight, especially when looking at them. The cohort will nod at the precision; everyone will feel the celebration. Good luck!
