prompt: |-
  I'm on the small committee at my company that reviews and signs off on postmortems for our worst ("Sev-1") incidents before they go out to the rest of engineering, and a write-up we're finalizing this week has turned into a bigger disagreement than I expected. Three weeks ago, a refactor removed a validation check on one field in our checkout flow; when that field arrived null from a client we don't fully control, a downstream pricing service threw an unhandled exception and took the whole checkout path down for about fifty minutes. The draft postmortem, written by the incident commander, names the missing check (and the missing regression test that would have caught its removal) as the "root cause," and recommends a coaching conversation with the engineer who did the refactor.

  Half the committee thinks that's reasonable; the other half points out that at least three other omissions were just as necessary for the outage to happen: the reviewer approved the pull request without flagging that the change had no new test coverage, a ticket asking for broader edge-case tests on exactly that code path had been sitting deprioritized in the backlog for eight months, and the alert that would have caught the malformed requests within two minutes had been muted after a false-positive spree the previous quarter, with the ticket to re-tune it left untouched since. If any single one of those four things had gone differently, we don't have an outage — so strictly by that test we have four root causes, or none, and "root cause" stops doing any real work. One of our staff engineers, who reads philosophy outside of work, told me this is basically an old and apparently unresolved problem philosophers call "causation by omission," which didn't leave me feeling much better about Thursday.

  Could you draft the memo I'll bring into Thursday's meeting? It needs to do two concrete things: recommend how the postmortem should describe causation in this specific case — keep the engineer's omission as the named root cause, list several contributing causes with no ranking among them, retire "root cause" language for this class of incident altogether, or something else you think fits better — and state a rule the committee could actually reuse the next time several omissions all pass the "it wouldn't have happened otherwise" test, so we're not relitigating this from scratch every quarter. Whatever you recommend, take seriously the strongest argument for keeping a single named cause — that spreading responsibility across four different omissions means no one in particular is on the hook to fix anything — rather than dismissing it as just blame culture. And keep it something the committee could act on inside our one-hour meeting, not a philosophy seminar.
reasoning: |-
  Okay, the user is part of a committee reviewing postmortems for major incidents. They're stuck in a disagreement about how to assign root causes for an outage caused by multiple omissions. The incident involved a refactor removing a validation check, which combined with other issues like a muted alert and backlogged tickets. Half the committee wants to pin it on the engineer, the other half sees four equally necessary failures.

  The user needs a memo draft that resolves two things: how to describe causation in this specific case, and a reusable rule for future similar incidents. They emphasize not dismissing the accountability argument (single cause = clear ownership) while avoiding philosophical debates. The memo must be practical for a one-hour meeting.

  Hmm... The core tension is between precision (acknowledging all contributing factors) and actionability (ensuring fixes happen). The staff engineer's mention of "causation by omission" is interesting but unhelpful practically. 

  The strongest counterargument is real: if responsibility is too diffused, fixes might fall through the cracks. But naming only one "root cause" feels inaccurate and unfair. Maybe a compromise? 

  I recall safety engineering models like Swiss Cheese or 5 Whys that treat failures as layered defenses breached. That could frame the validation check removal as the *proximal* cause (the immediate failure), while the other omissions are *systemic* causes (why it wasn't caught). 

  For the rule, they need something scalable. A decision tree might work: if multiple omissions pass the "but-for" test, call the most immediate technical failure the "primary contributing factor" and list others as "systemic factors." Then mandate that primary factors get owned fixes, while systemic ones trigger process reviews. 

  The memo should avoid "root cause" entirely—it’s clearly causing semantic fights. Instead, use "contributing factors" with clear subcategories. For accountability, assign owners to every factor, even systemic ones (e.g., the muted alert is owned by the team that silenced it). 

  User’s identity seems senior—they’re mediating a technical debate but care about engineering culture. Unspoken need: preventing committee burnout from recurring arguments. The reusable rule is key there. 

  Draft structure: 
  - Problem recap (neutral) 
  - Recommendation for this case (proximal + systemic factors) 
  - General rule with examples 
  - Implementation steps (owner assignments, template tweaks) 

  Phrase ownership as "fix responsibility," not blame. Stress that systemic fixes often have higher leverage. 

  ...Time to write the memo bluntly but constructively.
answer: |-
  Here’s a focused, actionable memo draft for your committee meeting, designed to resolve the disagreement and establish a reusable rule. It balances accountability with systems thinking while avoiding philosophical debates:

  ---

  **MEMO: Postmortem Causation Framework & Recommendation for [Incident ID]**  
  **To:** Sev-1 Postmortem Review Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Resolution for Incident [ID] Causation Description & Reusable Rule for Omission-Based Failures  

  ### **1. Issue Summary**
  The draft postmortem for the checkout outage (caused by a missing validation check, unmuted alert, deprioritized test ticket, and unreviewed PR) currently labels the removed validation check as the sole "root cause" and recommends coaching the involved engineer. However, committee disagreement centers on:  
  - Whether "root cause" is accurate when 4 omissions were equally necessary for the incident (per the "but-for" test).  
  - Accountability concerns: Diffusing responsibility may reduce fix ownership.  

  ### **2. Recommendation for *This* Postmortem**  
  **Adopt a "Proximal Cause + Systemic Contributors" model:**  
  - **Primary contributing factor:** The removal of the validation check without a regression test.  
    - *Why:* This was the most immediate technical action that allowed the error to propagate.  
    - *Ownership:* The engineering pair (author + reviewer) owns fixes for *this code change*.  
  - **Key systemic contributors:**  
    - Muted alert not re-tuned (owned by [Team X]).  
    - Deprioritized edge-case test ticket (owned by [Product/Eng Leadership]).  
    - PR review missed test coverage gap (owned by team’s review process owner).  
  - **Retire "root cause" language** for this postmortem. Use "primary contributing factor" and "systemic contributors" instead.  

  **Rationale:**  
  - Acknowledges the *proximal trigger* (validation check) while highlighting *systemic gaps* that enabled it.  
  - Preserves accountability (each factor has an owner) without oversimplifying.  
  - Aligns with industry best practices (e.g., NASA’s "contributing causes" model).  

  ### **3. Proposed Rule for Future Incidents**  
  **When multiple omissions pass the "but-for" test:**  
  1. **Identify the *proximal contributing factor***: The most immediate technical omission/action that directly triggered the failure.  
     - *Example:* Code change without tests, config push without validation.  
  2. **List *systemic contributing factors***: Process/cultural omissions that enabled the proximal factor (max 3–5 key items).  
     - *Example:* Silent alerts, backlogged tech debt, training gaps.  
  3. **Assign owners to ALL factors**, including systemic ones (e.g., "Alerting team owns alert tuning").  
  4. **Ban standalone "root cause" labeling**; use "contributing factors" with clear categorization.  

  **Why this works:**  
  - **Accountability preserved:** Every named factor has an owner and action item.  
  - **Focus on fixes:** Proximal factors get immediate remediations; systemic factors drive process improvements.  
  - **Scalable:** Avoids philosophical debates by using pragmatic, observable criteria.  

  ### **4. Implementation for This Postmortem**  
  - **Revise causation section:**  
    > "The outage occurred when a null value from Client X triggered an unhandled exception in the pricing service. This was made possible by four key contributing factors:  
    > 1. **Primary contributing factor:** Removal of validation check during refactor without regression test (Owned: [Engineer] & [Reviewer]; Action: Test coverage audit + coaching).  
    > 2. **Systemic contributor:** Delayed tuning of checkout alerts after false positives (Owned: [SRE Team]; Action: Revise alert governance).  
    > 3. **Systemic contributor:** Backlogged edge-case test ticket (Owned: [Eng Manager]; Action: Backlog review process update).  
    > 4. **Systemic contributor:** PR review missed test coverage gap (Owned: [Team Lead]; Action: Review checklist update)."  
  - **Actions:** Ensure each factor has a concrete, assigned fix (no "TBD" items).  

  ### **5. Why Not Other Options?**  
  - ❌ *Single "root cause":* Ignores systemic gaps, risking repeat failures.  
  - ❌ *Unranked factors:* Dilutes ownership; harder to prioritize fixes.  
  - ✅ *Proximal + systemic:* Directly links human actions to process fixes.  

  ### **6. Next Steps for Committee Approval**  
  - Vote to adopt:  
    - **A.** The revised causation framework for *this* postmortem.  
    - **B.** The reusable rule for future incidents with multiple omissions.  
  - Timebox: 15 min discussion, 5 min vote. If approved, finalize postmortem by EOD.  

  --- 

  **Key Strengths of This Approach:**  
  - **Solves the accountability dilemma:** Owners are explicitly tied to *fixes*, not blame. The engineer/reviewer own *their* part (coaching, test audits), while leadership owns systemic repairs (backlog/alert processes).  
  - **Prevents "relitigation":** The rule provides clear criteria for future cases (e.g., "proximal" = most direct trigger; "systemic" = enabling gaps).  
  - **Fits in 1 hour:** Concrete recommendations with minimal abstraction.  

  **Anticipate Pushback:**  
  - *"Why call out the engineer at all?"* → Because code changes require individual ownership, but we’ve balanced it with systemic fixes.  
  - *"This feels bureaucratic."* → It’s lighter than debating "causation by omission" quarterly. Assign owners takes 5 extra minutes per postmortem.  

  Final recommendation: **Adopt the rule and revised postmortem language.** This ends the cycle of philosophical debates while making our write-ups both accurate and actionable.
