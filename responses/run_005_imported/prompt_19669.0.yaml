prompt: |-
  On several old Overcoming Bias and LessWrong threads about decision theory under unbounded gambles, I keep running into people gesturing at the "Pasadena paradox" as some sort of nastier cousin of the St. Petersburg paradox, without ever quite explaining why it's supposed to be worse. As I understand the two cases: in the classic St. Petersburg game, a fair coin is tossed until it first lands heads, and you're paid 2^n if the first heads occurs on toss n; the expected payoff is a divergent sum of positive terms, so it comes out unambiguously infinite, and there's a familiar toolkit for defusing the resulting puzzle — bounded utility functions, diminishing marginal utility of money, objections from the counterparty's necessarily finite wealth, and so on. Nover and Hájek's Pasadena game instead pays (-1)^(n+1) × 2^n⁄n if the first heads occurs on toss n, so the terms of the expectation alternate in sign and sum to the alternating harmonic series, which converges to ln 2 only conditionally, not absolutely. Since the series isn't absolutely convergent, Riemann's rearrangement theorem tells us that reordering the very same underlying outcomes lets you make the "expected value" equal any real number you like, or diverge to positive or negative infinity, or oscillate without ever settling on a value.

  I'd like you to compare the two paradoxes properly, rather than treating Pasadena as just "St. Petersburg, but weirder." Please explain precisely why an expectation that is undefined by rearrangement constitutes a different, and arguably deeper, kind of problem than one that is merely infinite, and then assess whether the standard rescues for St. Petersburg — bounding utility, invoking finite wealth, or simply refusing to take unbounded gambles seriously — do anything at all to help with Pasadena. Close with a clear, justified verdict: which of the two paradoxes poses the more serious threat to someone committed to maximizing expected value, and why?
reasoning: |-
  Okay, the user is asking about the Pasadena paradox versus the St. Petersburg paradox. They've noticed people mention Pasadena as a nastier version but don't fully grasp why. Let me start by recalling the key differences.

  The St. Petersburg game has an infinite expected value because the series diverges. The payouts grow exponentially, and even though the probabilities decrease, the sum of the terms goes to infinity. The solutions here involve bounded utility, finite resources, etc. These are somewhat practical fixes.

  But the Pasadena paradox is different. The payout has alternating signs and a denominator of n. The series converges conditionally but not absolutely. Riemann's rearrangement theorem applies here. That means rearranging the terms can make the sum anything you want. So the expected value isn't just infinite; it's undefined. That's a fundamental problem.

  Why is this worse? In St. Petersburg, at least the expected value is infinite in a consistent direction. Any finite approximation will be positive and growing. But in Pasadena, finite approximations can swing wildly depending on the order. The decision-maker can't even define what to maximize. That undermines the very foundation of expected value maximization.

  Now, do the standard fixes work? Bounded utility might cap the payouts, but the conditional convergence issue could still persist if the bound isn't tight. Finite wealth truncates the series, but different truncations yield different expected values. The sign can flip based on where you stop. So even with finite resources, the problem remains ambiguous. Refusing unbounded gambles avoids both, but Pasadena highlights a deeper theoretical flaw.

  The user wants a verdict. Pasadena is more serious because it challenges the coherence of expected value itself. St. Petersburg is manageable with adjustments, but Pasadena shows that expectation can be undefined, making maximization impossible. That's a stronger threat to decision theory.
answer: |-
  Here's a precise comparison of the St. Petersburg and Pasadena paradoxes, explaining why the latter poses a fundamentally deeper challenge to expected utility maximization, and why standard "rescues" for St. Petersburg largely fail against Pasadena:

  **Core Difference: Defined Infinity vs. Undefined Expectation**

  1.  **St. Petersburg: Divergent but Unambiguously Positive Infinite Expectation:**
      *   The expectation is the divergent series: Σ (Probability_n * Payoff_n) = Σ (1/2^n * 2^n) = Σ (1) = 1 + 1 + 1 + ... → +∞.
      *   **Why it's "defined":** Every partial sum (the expectation computed only up to a finite number of tosses `N`) is finite and positive. As `N` increases, these partial sums increase monotonically without bound towards +∞. There is only one sensible way to say "what happens as N→∞": it diverges to positive infinity. Any finite truncation gives a large positive expected value. The direction (positive) and the divergence are unambiguous.

  2.  **Pasadena: Conditionally Convergent, Absolutely Divergent - Undefined Expectation:**
      *   The expectation is the conditionally convergent series: Σ (1/2^n * (-1)^(n+1) * 2^n / n) = Σ (-1)^(n+1) / n.
      *   **Absolute Divergence:** Σ |(-1)^(n+1) / n| = Σ 1/n → ∞ (harmonic series). The payoffs don't diminish fast enough in magnitude to guarantee a stable sum independent of order.
      *   **Conditional Convergence:** Σ (-1)^(n+1) / n converges to ln(2) ≈ 0.693 *if summed in the standard order (n=1,2,3,...)*.
      *   **Why it's "Undefined":** Riemann's rearrangement theorem proves that by reordering the terms (which correspond to reordering the *natural sequence of outcomes* based on when the first heads occurs), you can make the series converge to *any real number whatsoever*, or diverge to +∞, or diverge to -∞, or oscillate without converging.
      *   **Consequence:** The "expected value" isn't a property of the game itself; it's a property of *how you choose to list the outcomes* when summing them. This is catastrophic for decision theory. The partial sums oscillate wildly; the sum up to N depends critically on whether N is odd or even and doesn't settle towards a single value. Different finite truncations can yield large positive, large negative, or near-zero expected values.

  **Why Undefined Expectation is Worse than Infinite Expectation:**

  *   **Coherence of Maximization:** An infinite expectation (like St. Petersburg) is challenging but conceptually coherent within an unbounded utility framework. You can say "This dominates any finite-expected-value gamble." An *undefined* expectation (like Pasadena) means the core concept of "expected value" *fails to assign any value at all* to the gamble. You literally cannot compare it arithmetically to other gambles or to the status quo. Maximization is impossible because the quantity to maximize doesn't exist.
  *   **Sensitivity to Description:** St. Petersburg's infinite expectation is robust to how you describe or order the outcomes. Pasadena's "expectation" is *fragile*; merely changing the order in which you list the same physical outcomes (e.g., grouping all odd-n outcomes before even-n, or vice versa) changes the sum arbitrarily. This violates the principle that the value of a gamble should depend only on the physical outcomes and their probabilities, not on an arbitrary labeling scheme.
  *   **Finite Approximations:** For St. Petersburg, any large finite truncation gives a large positive expected value, correctly signaling the desirability of the gamble if utility is unbounded. For Pasadena, finite truncations give wildly different and contradictory signals (very positive, very negative, near-zero) depending on exactly where you truncate. This provides no reliable guidance.

  **Assessment of Standard "Rescues":**

  1.  **Bounded Utility:**
      *   **St. Petersburg:** Effectively resolves the paradox. If utility is bounded (e.g., u(wealth) < U_max), the divergent series becomes convergent (Σ (1/2^n * u(2^n)) < Σ (1/2^n * U_max) = U_max). The expectation becomes finite.
      *   **Pasadena:** **Doesn't Necessarily Resolve.** While bounding utility *might* force absolute convergence (if the bound is sufficiently "tight" relative to the payoff growth), it *doesn't guarantee it*. If the unbounded payoffs grow fast enough relative to the bound, the absolute utility series Σ |u(payoff_n)| * Prob_n could still diverge, leaving the conditional convergence problem intact. The expectation could still be rearrangement-dependent and undefined, even if finite for a specific ordering.
  2.  **Finite Resources/Counterparty:**
      *   **St. Petersburg:** Pragmatically resolves the issue. Truncating the game at the point where 2^n exceeds the bank's wealth makes the expectation large but finite. The gamble is desirable if the entry price is below this finite value.
      *   **Pasadena:** **Exacerbates the Problem.** Truncation is necessary, but *where* you truncate critically changes the calculated finite expectation due to the oscillating partial sums. Truncating after an odd term gives a positive expectation; after an even term gives a negative expectation. The sign and magnitude of the finite approximation depend arbitrarily on the truncation point (dictated by the bank's wealth). There's no single "correct" finite expectation. This mirrors the core undefinedness problem at the finite level.
  3.  **Rejecting Unbounded Gambles:**
      *   **St. Petersburg:** Avoids the paradox by refusing to consider the unrealistic gamble.
      *   **Pasadena:** Also avoids the paradox. However, this approach sidesteps the problem rather than solving it. Pasadena's core issue (undefined expectation due to conditional convergence) is a *theoretical flaw* in the definition of expected value for certain plausible gambles, even if they involve finite resources in practice (as the truncation point issue shows). Rejecting unbounded gambles doesn't fix the underlying mathematical pathology; it just avoids confronting gambles where it manifests most severely.

  **Verdict: The Pasadena Paradox Poses the More Serious Threat**

  *   **Reason:** The St. Petersburg paradox highlights the *practical limitations* of unbounded utility and infinite resources when encountering divergent positive expectations. While challenging, the expectation itself is unambiguously defined (as +∞), and standard resolutions (bounded utility, finite resources) successfully address the practical decision problem. The core framework of expected value maximization remains intact.
  *   The Pasadena paradox exposes a *fundamental theoretical flaw* in the very definition of expected value for a significant class of plausible gambles. The conditionally convergent expectation is **undefined** – not infinite, but mathematically indeterminate. This makes expected utility maximization **incoherent** for these gambles, as there is no quantity to maximize. Standard rescues either fail to resolve the indeterminacy (bounded utility might not ensure absolute convergence), replicate it at the finite level (finite truncation yields arbitrary results), or merely avoid the problem without fixing the underlying pathology (rejecting unbounded gambles).

  **In essence:** St. Petersburg is a problem of *magnitude* ("How do we handle infinite expected value?"). Pasadena is a problem of *existence* ("Does an expected value even exist for this gamble?"). The threat posed by the non-existence of a coherent expected value is categorically more severe to the foundations of decision theory based on expected utility maximization than the challenge of handling a well-defined, albeit infinite, value. Pasadena demonstrates that the standard machinery of summing probability-weighted utilities can fail catastrophically, not just by diverging, but by failing to yield a determinate sum at all. This strikes at the heart of the theory's coherence.
