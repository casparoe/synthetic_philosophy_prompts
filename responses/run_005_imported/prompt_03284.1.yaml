answer: |-
  Here’s a dialogue between **David Lewis** (defending counterfactual dependence) and **Jim Woodward** (defending interventionism) grappling with the Suzy/Billy case, trumping preemption, and the deeper metaphysical rift. Both aim to expose weaknesses in the other’s framework.

  ---

  **Setting:** *A philosophy department common room. Coffee cups litter the table. David Lewis sketches possible worlds on a napkin; Jim Woodward jots structural equations on a tablet.*

  **Woodward:** David, I’ll grant you this: for Suzy and Billy’s bottle, our theories *coincide*. Suzy’s throw (S) causes the shattering (BOT). Billy’s throw (T) doesn’t, because if we intervene to set S = 0 (Suzy doesn’t throw), BOT still occurs (via T). Your counterfactual dependence gets it right too: if Suzy hadn’t thrown, the bottle would still have shattered. So why insist my framework is just "counterfactuals in disguise"?

  **Lewis:** Because your "interventions" are parasitic on causation, Jim! You define an intervention on S as an exogenous cause that sets S’s value *without affecting other variables except through S*. But "exogenous cause"? "Affecting through"? You’ve baked causation into your *explanans*! My account reduces causation to non-causal bedrock: laws, particular facts, and similarity between worlds. Yours is circular.

  **Woodward:** It’s *epistemically* circular, not *metaphysically* empty. Scientists *use* interventions to *discover* causal structure. An "intervention" is an idealization of experimental control. When we clamp Suzy’s throw to "off" in a controlled test, we isolate S’s effect. The circularity is pragmatic—it reflects how we *access* causation, not a flaw in the *concept*. Your "similarity metric" between worlds is just as contested. Why prioritize worlds where Suzy’s throw is "miraculously" absent over worlds where gravity fails? That’s *ad hoc* patchwork!

  **Lewis:** Ah, but my patches *work*. Take "trumping preemption": The Major and Sergeant both shout "Advance!" simultaneously; the Major’s order trumps the Sergeant’s. The soldiers advance (ADV). Counterfactually: If the Major hadn’t ordered (~M), they still advance (via S). But if the Sergeant hadn’t ordered (~S), they advance *via M*. So neither depends on ADV? Absurd! My fix: ADV quasi-depends on M. In the closest ~M-world, S’s order *would* cause ADV, but it’s still M’s actual causal chain that "wins." Structural equations give the same verdict, but how? By *freezing* S at its actual value (ordered) when intervening on M. Isn’t that equally *ad hoc*?

  **Woodward:** Not at all! Freezing S reflects *modularity*: causal mechanisms are autonomous. The soldiers’ response to the Major (M → ADV) is independent of the Sergeant’s shout (S). When we intervene on M (e.g., gag the Major), S’s value remains whatever it *actually* was—it’s "off-path." Your "quasi-dependence" is a metaphysical sleight of hand. Why should ADV in the actual world "depend" on a *non-actual* causal chain in another world? I’m tracking actual invariant relationships under interventions.

  **Lewis:** But your "invariance" depends on which variables you include! If your model omits the military rule that "Majors trump Sergeants," interventions on M alone might falsely suggest M doesn’t cause ADV. You need the *right* graph. My account doesn’t rely on pre-selected variables; it grounds causation in the fundamental fabric of reality.

  **Woodward:** And *that’s* the rub. You’re after a reductive, metaphysical account of causation "all the way down." I’m explicating causation as a *relational* concept tied to human inquiry. Science doesn’t need your "Humean supervenience." It needs to know: "If I wiggle X, does Y wiggle?" That’s what interventions capture. In Suzy/Billy, both theories agree, but for different reasons: you care about chains of counterfactual dependence across worlds; I care about modular mechanisms we can manipulate. When they *diverge*—like in certain preemption or overdetermination cases—the difference is stark. My account handles causation in complex systems; yours is elegant but requires bespoke fixes for every puzzle.

  **Lewis:** And yours is circular when pushed to its foundations.

  **Woodward:** Only if you demand reductionism. Causation might be primitive in its domain, like computation or information. We’re not wearing the same trenchcoat, David. You’re building causation from the bottom up; I’m mapping it from the top down.

  **Lewis:** ...Then we disagree on what a theory of causation *should do*. For me, it must reduce; for you, it must explain scientific practice.

  **Woodward:** Precisely. And Suzy’s throw breaks the bottle either way. But *why* it’s causal? That’s where our paths split.

  ---

  ### Key Takeaways for Your Paper:
  1. **Circularity Charge:** Woodward *concedes* interventionism isn’t metaphysically reductive but argues it’s *explanatorily* superior for science. The "circularity" is virtuous—it mirrors how causal knowledge is built.
  2. **Ad Hoc Fixes:** Lewis’s quasi-dependence and Woodward’s "freezing" both handle preemption, but:
     - Lewis appeals to laws/similarity (non-causal bedrock).
     - Woodward appeals to modularity (a causal postulate).
  3. **Core Disagreement:** It’s **metaphysical**. Lewis seeks reduction to non-causal facts; Woodward treats causation as a sui generis tool for prediction/control. Their agreement on cases like Suzy/Billy masks divergent foundations.
  4. **Trumping Case:** Highlights Lewis’s reliance on "closest worlds" vs. Woodward’s reliance on model structure. Both verdicts align, but the mechanisms differ radically.

  **Your Paper Angle:** Argue whether a non-reductive account (Woodward) can be truly explanatory, or if reduction (Lewis) is necessary to avoid "causal primitivism." Use cases where they *diverge* (e.g., early preemption, omission cases) to force the issue.
