answer: |-
  The cab’s windshield wipers thumped rhythmically against a steady Oxford drizzle. In the backseat, Clara (Anscombean, sharp-featured and intense) massaged her temples. David (Double-Effect Defender, earnest with a hint of frayed patience) stared out at the blurred streetlights.

  **David:** ...and I still think Williams made a fair point about proportionality in asymmetric conflicts. Even if you reject consequentialism outright, Clara, ignoring the projected casualty figures for Downfall feels... morally myopic.

  **Clara:** *(Sighs, turning to him)* David, we’ve danced this waltz. Anscombe’s point *isn’t* about the numbers. It’s about the *moral structure* of the act itself. Throwing a million lives on one side of a scale doesn’t magically transform the *deliberate killing of innocents as a tool* into something licit. Truman chose to vaporize cities full of non-combatants *because* he believed the horror and shock would break the government’s will. That makes their deaths *instrumental*, a chosen *means* to his end. That’s murder.

  **David:** But that’s precisely where double effect *does* the work! Look, the official target selection wasn’t random terror. Hiroshima was headquarters of the Second General Army, a major military command hub. It housed troop concentrations, logistics, munitions factories – legitimate military targets by any wartime standard. The bomb *was* aimed at destroying that capacity. The civilian deaths, while foreseen as inevitable given the weapon’s nature and the city’s layout, were a *side effect* of attacking those targets, not the *intended mechanism* for surrender.

  **Clara:** Oh, come *on*. Do you honestly believe Curtis LeMay firebombing Tokyo, or Groves targeting Hiroshima, were primarily concerned with wiping out a specific army HQ or a few workshops? The *entire strategy* of area bombing, culminating in the atomic bombs, was psychological. The Target Committee explicitly listed “psychological factors” and the desire for a “profound psychological impression” as selection criteria. Truman himself wrote about the “rain of ruin” bringing surrender *because* of the unprecedented destruction. The military targets were window dressing – the *means* to the end of surrender was the terror wrought upon the civilian population.

  **David:** It’s not that simple. Destroying the military and industrial capacity *was* a genuine, primary objective. Crippling Japan’s ability to wage war *is* a legitimate military aim. The bomb achieved that *through* destroying the infrastructure and killing combatants present. The civilian deaths were tragically bound up in that, foreseen but collateral. The *shock* might have been a welcome *further consequence* facilitating surrender, but it wasn’t the *intended object* of the act itself. The act was: “Destroy key military/industrial center X.” The deaths of non-combatants within X are a foreseen evil, but not part of the *chosen means*.

  **Clara:** That feels like a semantic shell game. If the destruction of the city center – where the people *are* – is the necessary and foreseen method to destroy the dispersed military assets, and crucially, if the planners *knew* the scale of civilian death was the very thing that would create the desired shockwave to Tokyo... how can you cleave the means so neatly? The bomb wasn’t a precision weapon hitting *only* the HQ. It was chosen *because* its indiscriminate, city-annihilating power guaranteed massive civilian casualties. That power *was* the weapon, not just an unfortunate byproduct. Truman *used* those deaths, *relied* on them, to achieve his end. That makes them integral to his chosen means.

  **David:** But intention matters crucially! The bomber pilot’s *direct intention* was to destroy the military target complex. The civilian deaths, however foreseen, were outside that intentional object. They were the *unintended* (though known) consequence of achieving the *intended* military effect. The shock value was a *further* unintended consequence *of* the destruction, not the thing directly aimed at. It’s like destroying a munitions factory knowing workers are inside – tragic, foreseen, but the *intention* is destroying the factory, not killing the workers *as such*.

  **Clara:** Except the factory here *is* the entire city, and the workers *are* the civilian population. And the “further unintended consequence” – the shock – was the *operational objective*! It wasn’t an accident; it was the calculated *reason* they dropped it on a city rather than an unpopulated area or waited for a purely military target opportunity. The Target Committee minutes show they *rejected* purely military targets because they wouldn’t demonstrate the bomb’s ‘destructive power’ sufficiently – meaning, its power to kill civilians en masse. How is that not making civilian destruction the means?

  **David:** *(Leans forward, earnest)* Okay, Hiroshima is borderline, I’ll grant the psychological factor was heavily weighted. But consider Nagasaki. The primary target was the Mitsubishi shipyards – a clear, vital military-industrial complex. The bomb missed slightly, but the *intent* was squarely on that target. The civilian deaths there are far clearer collateral damage under double effect. Doesn’t that salvage at least *that* bombing?

  **Clara:** *(Shakes head)* It doesn’t work retroactively. The *context* matters. Nagasaki happened *after* Hiroshima failed to elicit immediate surrender. The entire strategy was demonstrably *about* leveraging civilian horror. Using the same weapon, in the same way, days later, reinforces that the *method* itself – city-destroying terror – was the chosen instrument. The specific industrial target in Nagasaki feels like post-hoc justification. The *means* remained the same: kill civilians to shock the government. The shipyards were *within* the chosen instrument of terror, not the sole justification for it.

  **David:** So, are you saying *any* attack on a target within a populated area where civilians *will* die, if the attackers know their deaths might *also* demoralize the enemy, automatically becomes illegitimate? That paralyzes warfare entirely!

  **Clara:** No. If you bomb a genuine, discrete military target – say, a remote airfield – and a few civilians nearby are killed as a foreseen but unintended side effect, *that* might pass double effect. The key is whether the civilian deaths are part of the *mechanism* you select to achieve your goal. Did Truman *need* to kill those civilians *in order to* shock the government? Yes. Was destroying a city *the method chosen* to create that shock? Yes. Therefore, killing innocents was a chosen means. Hiroshima and Nagasaki weren’t tragic overspills; they were the deliberate application of the weapon *for* its terror effect. That’s why Anscombe called it murder. Double effect requires a clean intention directed solely at the legitimate target; here, the intention was inherently fused with the terror.

  **David:** *(Stares out the window again, the wipers still thumping)* I think you demand an impossible purity of intention in the fog of total war. The legitimate military objective *was* there, desperately so. The civilian horror, however leveraged, was a ghastly amplification of the *material* destruction of Japan’s capacity. To say the military objective was just a fig leaf... I can’t accept that. The double effect *does* shield the core act.

  **Clara:** And I think you’re letting the sheer scale of the *other* horrors – the war itself, the projected invasion – blur the specific moral shape of *this* act. It wasn’t just *another* bombing run. It was the conscious, deliberate choice to make the mass killing of innocents the *engine* of victory. That shape, David, that *choice*, is what Anscombe wouldn’t let Oxford whitewash. The means *define* the act. *(She falls silent, watching the rain streak the glass.)*

  **David:** *(Quietly)* Maybe. But I still see a city saved from firebombing by conventional means, an invasion forestalled... lives, however grimly weighed... *(He trails off. The cab turns a corner, the argument unresolved, the fundamental chasm between the moral structure of the act and its consequences yawning as wide as ever in the damp Oxford night.)*
