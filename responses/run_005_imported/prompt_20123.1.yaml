answer: |-
  Your situation is both deeply personal and philosophically rich, touching on fairness, value, and the challenge of dividing indivisible goods. The mediator's percentage-matching rule isn't arbitrary—it rests on a principled foundation in cooperative bargaining theory, specifically the **Kalai-Smorodinsky solution** (or the "equal proportional sacrifice" principle). I'll explain why this approach is defensible, address your sister's concerns, and offer practical advice for moving forward.

  ### The Principled Basis for the Mediator's Rule
  The core idea is that fairness requires both parties to sacrifice an *equal proportion* of their potential gains above the fallback outcome, rather than equal dollar amounts. Here's why this is coherent and fair:

  1. **Equal Relative Sacrifice**:
     - Your "best outcome" (keeping the cabin with repairs) and your sister's (keeping the store with expansion capital) represent asymmetric gains above the fallback ($550,000 each). Crucially, these gains incorporate *subjective value* (sentimental, entrepreneurial, or otherwise), which the fallback sale ignores.
     - If you received equal dollar gains above the fallback (e.g., each getting $600,000 in value), your sister would sacrifice a *larger proportion* of her potential gain. For example:
       - Suppose your best outcome is worth $700,000 to you (a $150,000 gain over $550K), and hers is worth $800,000 (a $250,000 gain).
       - Equal dollar gains of $600,000 mean you get 100% of your possible gain ($150K/$150K), but she gets only 20% of hers ($50K/$250K). This feels unfair because she bears more relative sacrifice.
     - The percentage-matching rule avoids this by ensuring both sacrifice the same *fraction* of their gains. If the largest feasible percentage is 60%, you get $550K + 60% × $150K = $640K in value, and she gets $550K + 60% × $250K = $700K. You both enjoy 60% of your potential upside, sharing the burden of compromise equally.

  2. **Efficiency and Pareto-Optimality**:
     - This rule maximizes the minimum gain (the "maximin" principle), ensuring neither is unnecessarily worse off. It also leads to a **Pareto-efficient** outcome: no alternative exists where one benefits without harming the other. Selling everything would destroy subjective value (e.g., the cabin's sentiment, the store's business potential), but this rule preserves it by allocating items to the highest-value users.

  3. **Axiomatic Fairness**:
     - In game theory, the Kalai-Smorodinsky solution satisfies key fairness axioms:
       - **Individual Rationality**: Both do at least as well as the fallback.
       - **Symmetry**: If your gains were identical, you'd split equally.
       - **Monotonicity**: If the "pie" grew, neither would get less.
       - **Scale Invariance**: Fairness isn't affected by how gains are measured (dollars, utility, etc.).
     - Matching dollars or other rules violate these. Equal dollar concessions favor the party with smaller gains; splitting based on market value ignores subjective worth.

  4. **Addressing Your Sister's Suspicion**:
     - She's right that fairness isn't self-evident here—but percentage-matching isn't a dressed-up arbitrary compromise. It responds directly to the asymmetry in your valuations. Her larger potential gain ($250K vs. your $150K) isn't ignored; she *still receives more dollars* under this rule (e.g., $150K gain for her vs. $90K for you at 60%). What's equalized is the *relative opportunity realized*, respecting both her ambition and your sentiment.
     - Alternatives like matching dollars or splitting market value:
       - **Ignore subjective value**, treating the estate as purely monetary. But this undermines why you both avoid the fallback.
       - **Favor one party**: Equal dollars advantage you; prioritizing business potential advantages her.
       - **Risk inefficiency**: If you haggle over cash, you might deadlock and trigger the sale.

  ### Practical Advice: How to Proceed
  While the mediator's rule is principled, it only works if both accept it. Your sister's skepticism suggests a need for concrete justification and compromise. Here's a step-by-path forward:

  1. **Quantify Gains Transparently**:
     - Work with your accountant to estimate:
       - The cash value of the estate (confirming the $550K fallback per person).
       - Your "best outcome": Cabin market value + cash needed for repairs (e.g., $500K cabin + $200K repairs/cash = $700K total value *to you*).
       - Hers: Store market value + expansion capital needed (e.g., $600K store + $200K capital = $800K *to her*).
     - This makes gains explicit. If she disputes your cabin valuation, use independent appraisals for market values and agree on repair/expansion costs.

  2. **Calculate the Percentage**:
     - With gains above fallback (e.g., $150K for you, $250K for her), find the largest percentage \( p \) where:
       \[
       (\text{Cash needed for your repairs} \times p) + (\text{Cash needed for her expansion} \times p) \leq \text{Total cash in estate}
       \]
       - Example: If repairs cost $50K, expansion costs $100K, and estate cash is $90K:
         \[
         p \times (50K + 100K) \leq 90K \implies p \leq 60\%
         \]
       - You receive cabin + $30K cash (60% of repairs), valuing your bundle at $550K + 60% × $150K = $640K.
       - She receives store + $60K cash (60% of expansion), valuing hers at $550K + 60% × $250K = $700K.

  3. **If She Rejects Percentage-Matching, Propose a Test**:
     - Frame it as an experiment: "If we apply this rule, do we both come out ahead of the fallback? Does it feel more balanced than alternatives?" 
     - Compare alternatives numerically:
       - **Equal dollars**: Each gets $600K value. You need only $50K cash for repairs (since $550K + $50K = $600K), but she gets $600K vs. her $800K ideal—a 20% gain for her vs. 100% for you.
       - **Split market value**: Cabin ($500K) and store ($600K) are divided equally via cash adjustments. If you take cabin, you pay her $50K for equality. But you lose repair cash, and she forfeits expansion capital—destroying subjective value.
     - Highlight how percentage-matching leaves you *both* better off subjectively.

  4. **Leverage Your Unique Position**:
     - As a philosophy teacher, appeal to shared principles: "We both want a solution that respects our differing values without forcing sameness. This rule does that—it gives you more dollars because you have more to gain, but we sacrifice equally in proportion."
     - If she resists, offer a small, symbolic concession (e.g., you cover minor estate costs) to honor her business acumen without undermining the framework.

  5. **Fallback to Mediation (Not Sale)**:
     - If deadlock persists, return to the mediator. Ask them to explain the rule's rationale in business terms: it's like allocating scarce capital to two projects, prioritizing equal return on opportunity.
     - Worst case, a binding arbitration clause in the will might force a decision, but avoid this—it risks relationship damage.

  ### Final Thought
  The mediator's rule is fair because it acknowledges that value is personal and that fairness lies in equal sacrifice, not equal outcomes. It bridges your emotional attachment to the cabin and your sister's entrepreneurial vision, preserving more wealth than a sale. But fairness also requires consent. Approach this as collaborators, not adversaries: "What solution honors Dad's legacy best?" If you both emerge richer in value than the fallback, with compromise shared proportionally, you've found your answer.
