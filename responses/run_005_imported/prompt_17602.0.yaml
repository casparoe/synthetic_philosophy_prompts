  But there are disanalogies. Formal systems have strict axioms and proof rules, while everyday justification is defeasible and holistic. Provability is binary (proven or not), whereas epistemic justification has degrees. Also, formal systems can't expand their axioms internally, but humans can reflect and adjust beliefs based on new evidence. The Löbian obstacle is about internal consistency, while epistemic circularity is about the structure of justification, not necessarily leading to inconsistency.

