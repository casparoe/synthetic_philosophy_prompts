answer: |-
  Your unease is profound and justified—it cuts to the heart of mathematical epistemology. Gödel's second incompleteness theorem *does* impose a fundamental limitation: no consistent formal system capable of encoding basic arithmetic (like PA or ZFC) can prove its own consistency. This means:

  1.  **The Specter of Inconsistency:** We cannot rule out, *from within PA or ZFC itself*, the possibility that a contradiction (`P ∧ ¬P`) exists somewhere in the system, even if we haven't found it yet.
  2.  **Explosion's Consequence:** As you note, if such a contradiction exists (making the system *inconsistent*), then the principle of explosion entails that *every well-formed statement* (and its negation) becomes a theorem. All proofs within that system become vacuous.

  **So, is trusting PA/ZFC an "act of faith"?**

  In the strictest philosophical sense, **yes, but it's a highly *pragmatic and justified* faith, grounded in evidence and experience, not blind belief.** Here's why mathematicians generally accept this state of affairs:

  1.  **Empirical Robustness:** PA and ZFC have been subjected to *intense scrutiny* for over a century. Countless complex proofs have been formalized (especially recently with tools like Lean, Coq, Isabelle/HOL). No contradiction has ever been found. While absence of evidence isn't evidence of absence, the sheer volume and complexity of work built on these foundations *without* collapse provides strong inductive evidence for their consistency. Think of it like engineering: a bridge design might have an undiscovered flaw, but its successful use under heavy load for decades builds confidence.
  2.  **Relative Consistency Proofs:** While we can't prove `Con(PA)` within PA, we *can* prove `Con(PA)` within stronger systems (like ZFC). We can also prove the *relative* consistency of one system to another (e.g., "If ZFC is consistent, then PA is consistent" is provable in very weak systems). Gentzen famously proved the consistency of PA using transfinite induction up to ε₀, which is beyond PA's own reach but still finitistically meaningful. This creates a web of supporting evidence, even if not absolute.
  3.  **Mathematical Practice Focuses on Structures, Not Foundations:** Most mathematicians are interested in the *structures* defined within the system (groups, manifolds, sets, etc.) and the relationships between them. As long as the foundational system consistently describes these structures and allows valid reasoning about them (which experience suggests it does), the inability to *prove* its own consistency internally doesn't impede their day-to-day work. The foundations are the stage, not the play.
  4.  **The Lack of Plausible Alternatives (and Their Own Issues):** What's the alternative? Rejecting PA/ZFC leaves mathematics without a foundation. Proposed finitist or constructivist foundations (e.g., based only on Primitive Recursive Arithmetic) are provably consistent but are *too weak* to formalize large swathes of modern mathematics that mathematicians rely on and find meaningful. Stronger systems (like ZFC + Large Cardinals) offer more power but face the *same* Gödelian limitation—they cannot prove their *own* consistency either. There's no escape hatch.
  5.  **Pragmatic Necessity:** Mathematics *must* start somewhere with unproven assumptions (axioms). The axioms of PA and ZFC are remarkably simple and intuitive (especially PA's). While ZFC's Axiom of Choice and Replacement are more debatable, their utility and consistency within the broader system are strongly supported by practice. Accepting these axioms as "obviously true" or at least "consistently productive" is the price of entry for doing powerful mathematics.
  6.  **The "Worthless" Proof Argument is Overstated:** If ZFC *were* inconsistent, it *would* be a catastrophe. *However*, the proofs generated within it wouldn't suddenly become "worthless" in all senses. They would still represent:
      *   **Valid reasoning patterns:** The *logical steps* themselves would still be correct applications of first-order logic. The flaw would be in the axioms, not necessarily in the derivations.
      *   **Insight into relative implications:** Proofs often reveal deep connections (`A implies B`). Even if the whole system exploded, the fact that a specific chain of reasoning led from A to B might still offer conceptual insight, even if A and B individually became meaningless within the exploded system.
      *   **Blueprints for reconstruction:** If an inconsistency were found, mathematicians would work frantically to isolate and fix the problematic axiom(s) (e.g., as with Russell's Paradox leading to the abandonment of naive set theory for ZFC). The vast body of existing proofs would serve as blueprints for reconstructing mathematics in a new, consistent system, salvaging most of the structure.

  **Why doesn't it bother mathematicians as much?**

  1.  **Focus on Practice:** Most mathematicians spend their time proving theorems *within* the system, not obsessing over its meta-properties. The system works remarkably well for their purposes.
  2.  **Confidence from Use:** Decades (for PA) or over a century (for set theory foundations) of successful use without contradiction breeds deep, practical confidence. Gödel's theorem feels like a remote, theoretical possibility.
  3.  **Acceptance of Limits:** Many mathematicians understand and accept the Gödelian limitations as an inherent feature of sufficiently rich formal systems. They see it not as a crippling weakness, but as a profound insight into the nature of mathematical truth and proof.
  4.  **Faith in Mathematics, Not Just ZFC:** The trust isn't *solely* in ZFC. It's in the entire edifice of mathematics built over millennia. ZFC is currently the best formalization we have of that edifice. The consistency of mathematics as a human endeavor feels more certain than the consistency of any single formal system describing it.
  5.  **Lean/Proof Assistants Add Value Anyway:** Even *with* the Gödelian specter, formalizing proofs in Lean is immensely valuable:
      *   It eliminates human error in logical deduction.
      *   It forces extreme precision in definitions and statements.
      *   It allows verification of proofs far too complex for human checking.
      *   It provides an unambiguous, reusable library of mathematical knowledge.
      The value of these benefits is largely independent of the absolute consistency of the underlying foundational system. They make the mathematics we *do* more reliable and accessible.

  **In Conclusion:**

  Yes, trusting PA or ZFC involves an irreducible element of faith in their consistency, because absolute proof is impossible within the systems themselves. Gödel ensures this. However, this faith is:

  *   **Not blind:** It's grounded in overwhelming empirical evidence, successful practice, relative consistency proofs, and the lack of viable alternatives.
  *   **Pragmatic:** It's the necessary foundation upon which the vast, powerful, and incredibly useful structure of modern mathematics rests.
  *   **Shared:** The collective experience and validation of the entire mathematical community over a very long time provide strong justification.

  While the philosophical unease you feel is valid and shared by foundational researchers, working mathematicians focus on the remarkable success and internal coherence of the mathematics built *upon* these foundations. The possibility of inconsistency is acknowledged but considered vanishingly remote based on all available evidence, making it a risk worth taking for the immense rewards. Lean, by automating logical rigor within this system, enhances the reliability of the mathematics we create, even if it cannot guarantee the absolute consistency of its deepest axioms. The value of proof assistants lies in eliminating *human* error within the system we've chosen to trust, based on strong pragmatic and empirical grounds.
