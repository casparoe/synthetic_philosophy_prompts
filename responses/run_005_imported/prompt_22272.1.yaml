  My dad died 11 days ago and Im doing his eulogy this weekend. Heres the thing thats been messing with my head since it happened - he was declared brain dead on the Tuesday but they kept him on the ventilator until Thursday for the organ donation, so when we actually said our goodbyes in that room his chest was rising, he was warm, his heart was going on the monitor. My brother (and a couple of my aunts honestly) have basically decided dad didnt really die until they switched the machines off Thursday, and my brother keeps saying they harvested organs out of a living man. Ive been reading alot about this on and off ever since, whole brain death vs circulatory death, the old Harvard report, all of it, and Ive landed on thinking the doctors had it right on the Tuesday. But I dont want to get up there and basically tell half the family that theyre wrong about when their own father died, not at his funeral. Can you write me something for the service thats honest about what I actually believe, doesnt turn into a lecture on brain death, and doesnt leave my brother and aunts feeling like I just called them fools for how they grieved?
