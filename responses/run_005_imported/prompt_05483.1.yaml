  Penrose tried to fix this by switching from consistency to soundness. If a system is sound (only true theorems), then it's consistent, and humans can know it's sound externally. So why hasn't this argument swayed philosophers? I need to break down the objections. 

  First, the assumption of soundness. Penrose claims that if we only assert F's theorems as true, we know F is sound. But philosophers might question if humans actually meet this criterion. Human reasoning isn't infallible; we make mistakes. So assuming our mathematical output is always sound is a big leap. 

  Next, the "F+Sound(F)" system. Penrose says humans can see the soundness of F, but if they formalize this as F+Sound(F), that becomes a new system F'. Then Gödel applies to F' too. Humans would need to see the soundness of F' and so on. This leads to an infinite regress, suggesting humans aren't formal systems but need increasingly complex ones. Critics argue this doesn't show non-computability but an ability to generate new systems. 

  Also, computationalism doesn't require a fixed F. Maybe humans use an ever-growing sequence of systems. Or perhaps the mind is a messy, inconsistent system where Gödel doesn't apply. Gödel's theorems assume consistent, recursive systems, but human cognition might not fit that. 

  Another point: the argument might be circular. Penrose assumes humans can know soundness, which implies they're consistent. But if humans are machines, they couldn't know that. So the argument presupposes what it's proving. 

  The user might be interested in why philosophers still hold computationalism. I should highlight that Penrose's move, while clever, doesn't resolve all issues. The objections center on the feasibility of knowing soundness, the regress problem, and the flexibility of computational models. 

  Also, maybe the user is looking for deeper critiques or recent developments. Penrose's quantum brain theories are controversial and lack evidence. Philosophers might see computationalism as adaptable, incorporating probabilistic or non-classical systems. 

  In summary, Penrose's argument is seen as an improvement but still has logical gaps. Philosophers remain unconvinced because the soundness assumption is problematic, the regress issue persists, and computationalism can evolve beyond strict formal systems.
answer: |-
  Penrose's "soundness move" is indeed a sophisticated attempt to bypass the Benacerraf objection that crippled Lucas's original argument. While it represents a significant improvement in logical structure, most philosophers of mind remain unconvinced that it successfully refutes computationalism (the view that minds are computational systems). Here's a breakdown of the key reasons:

  1.  **The Dubious Assumption of Human Soundness:**
      *   Penrose's core premise is that the mathematician, reflecting on her own output, is entitled to affirm the *soundness* of the formal system F supposedly capturing her reasoning. Why? Because she would only ever *assert* F's theorems as *true*.
      *   **The Problem:** This assumes that the mathematician *never* makes a mistake in her mathematical reasoning. It assumes her mathematical output is infallible. Philosophers find this assumption highly implausible. Human mathematicians demonstrably *do* make errors – sometimes subtle logical errors, sometimes accepting flawed proofs. While we strive for truth and often correct errors, the *fact* of fallibility undermines the claim that we can infallibly know *from the outside* that the system F (which is supposed to model our *actual*, fallible reasoning) is sound. We cannot guarantee that *everything* we assert mathematically is true.

  2.  **The Regress Problem / The "F + Sound(F)" System:**
      *   Penrose argues that the mathematician, seeing the soundness of F from an external standpoint, can therefore know F is consistent and see the truth of G(F) (F's Gödel sentence).
      *   **The Problem:** What system *is* this mathematician using to recognize the soundness of F and the truth of G(F)? Let's call this more powerful system F'.
      *   F' must be at least as strong as F + Sound(F) (the system F augmented with the axiom asserting F's soundness).
      *   Gödel's theorems apply to F' too! F' will have its *own* Gödel sentence G(F'). The mathematician, using F', can presumably also see the truth of G(F').
      *   But to do *that*, she must recognize the soundness of F'. This requires an *even more powerful* system F'', and so on, ad infinitum.
      *   **The Computationalist Response:** This regress doesn't prove the mathematician is *non*-computational. It suggests she might be identified with an *open-ended sequence* of increasingly powerful formal systems (F, F', F'', ...), each recognizing the soundness of the previous one. Computationalism doesn't require the mind to be captured by a *single*, fixed, finitely specifiable formal system; it could be an ever-extending computational process. Alternatively, the mind could be modeled by a system capable of *generating* such a sequence.

  3.  **Human Reasoning May Not Be Captured by a Gödel-Susceptible System:**
      *   Gödel's theorems apply specifically to consistent, recursively axiomatizable formal systems capable of expressing a certain amount of arithmetic.
      *   **Computationalist Options:**
          *   **Inconsistency:** Human reasoning might be fundamentally *inconsistent* in ways Gödel's theorems don't address. While we strive for consistency, our biological brains might operate with mechanisms that aren't perfectly consistent formal systems.
          *   **Non-Recursive Axiomatization:** The "system" underlying human thought might not be recursively axiomatizable (i.e., there might be no finite program listing *all* the rules we follow). Gödel's incompleteness doesn't apply to non-recursive systems.
          *   **Limited Arithmetic:** While humans understand a vast amount of mathematics, it's conceivable (though debated) that the *core reasoning mechanisms* implemented in the brain don't reach the level of complexity required for Gödelian incompleteness to kick in. They might only implement a consistent but *complete* fragment of arithmetic.
          *   **Non-Classical Computation:** Computationalism isn't limited to classical, deterministic, discrete-symbol manipulation (Turing machines). Models involving connectionist networks, analog computation, probabilistic computation, or quantum computation (though Penrose champions this, his Gödelian argument is separate) might evade the specific structure of Gödel's theorems while still being computational in a broader sense.

  4.  **The Argument May Be Dialectically Ineffective / Question-Begging:**
      *   The argument relies on the mathematician's *certainty* about the truth of her mathematical assertions and their soundness. The computationalist can argue that this certainty is *itself* a computational state or process within the system. To assume that this certainty *proves* the system is unsound or transcends computation risks begging the question against the computationalist. The computationalist maintains that the *feeling* of certainty and the *act* of affirming soundness are both phenomena generated by the computational system.

  5.  **The Gap Between Mathematical Insight and General Cognition:**
      *   Penrose's argument focuses intensely on highly abstract, conscious mathematical reasoning. Computationalists argue that even *if* this specific type of reasoning required something non-computational (which they dispute), it wouldn't necessarily mean that the *entire* mind, including perception, learning, emotion, language comprehension, and most ordinary reasoning, is non-computational. Mechanism might still hold for the vast bulk of cognition.

  **Why Computationalism Remains a Live Option:**

  Given these persistent objections, philosophers see Penrose's argument as failing to deliver a decisive knockout blow:

  1.  **The Soundness Assumption is Unjustified:** Humans aren't infallible.
  2.  **The Regress is Manageable Computationally:** Minds could be identified with ever-extending sequences of systems.
  3.  **Minds Might Not Fit the Gödelian Mold:** Human reasoning might be inconsistent, non-recursive, limited, or implemented non-classically.
  4.  **The Argument Might Beg the Question:** Certainty about soundness could be part of the computational process.
  5.  **Scope is Limited:** Even if successful for pure math, it might not generalize.

  Computationalism persists because it offers a powerful, naturalistic, and increasingly well-supported framework for explaining a vast range of cognitive phenomena. Penrose's argument, while ingenious and highlighting profound issues in the foundations of mathematics and mind, is seen as relying on assumptions about human infallibility and the nature of the underlying computational system that most philosophers find untenable or insufficient to rule out computational explanations. The burden of proof for demonstrating non-computability remains very high, and Penrose's soundness move hasn't convinced the majority that this burden has been met.
