prompt: |-
  Ok so this is a real dispute in my group house right now and I keep thinking it's secretly a philosophy problem wearing a trenchcoat, so I want a genuinely rigorous outside take rather than more Slack-thread arguing (we've all read enough LessWrong to think we're being rigorous when we're actually just being stubborn). Backstory: seven of us bought into a house together in Oakland two years ago -- very much the kind of house where people unironically drop "Schelling point" into an argument about whose turn it is to do dishes -- and part of the deal, deliberately never turned into an actual contract because the whole ethos was "our word is good, we don't need lawyers for each other," was that everyone commits to a 2-year minimum stay plus an even per-head share of a $38k retrofit loan (solar, insulation, heat pump) that two of the longer-term housemates personally co-signed. Everyone since, including a housemate who moved in 8 months ago, signed onto a shared doc saying "I commit to staying and paying my full share for two years, barring genuine emergency."

  That 8-month housemate now has to move across the country for a sick parent, wants to leave in 6 weeks, and is offering a lump sum equal to 3 more months of her share and then shes done. About half the house thinks thats basically fine -- there was real reliance on her money, but 3 months roughly covers the actual hole it leaves in the loan repayment, and a parent's illness is exactly what "genuine emergency" was supposed to mean. The other half (me, on my more curmudgeonly days) thinks that if "commit" cashes out to "pay for the damage if you feel like leaving," the word never meant anything, and every future promise in this house is now worth noticeably less.

  I'm on the 3-person house council that actually has to adjudicate this, and I need to write the memo we're gonna read out at Sunday's house meeting. I don't want it to just be vibes-based mediation -- I want it to take a real position on what's doing the moral work in a promise like this, since I think that's what we're actually disagreeing about underneath the numbers: is the obligation basically about the reliance and expectations the rest of us built on her word, in which case her offer might be roughly right once you price out the real shortfall -- or is there something more Scanlon-ish going on, where deliberately giving us assurance to get something from us (a cheaper buy-in, a vote of confidence, whatever) creates an obligation that isn't just discharged by covering the financial damage? And does "genuine emergency" function as a real implicit clause everyone would've signed onto up front, or is it a hole you can drive any sufficiently inconvenient life event through -- Hume's whole point about promise-keeping as a convention we all have an interest in protecting notwithstanding? Can you draft the actual memo: a specific recommendation (an amount and a deadline) the house can vote on, the reasoning behind it, and an honest steelman of whichever side you don't end up recommending, not just the side that wins?
reasoning: |-
  Okay, let's start by unpacking the user's problem. They're in a group house with a dispute about a housemate leaving early due to a family emergency. The housemate offered a lump sum, but there's disagreement on whether that's sufficient. The user wants a rigorous, philosophical approach to resolve this, not just vibes.

  First, I need to understand the core issues. The main conflict is between reliance damages versus the sanctity of the promise. Half the house thinks the financial offer covers the actual loss, while the other half worries about precedent and the integrity of commitments. The user mentioned Scanlon's principle and Hume, so they're looking for ethical frameworks.

  The user is on the house council and needs to draft a memo with a specific recommendation. They want both sides steelmanned, which shows they value fairness. The deeper need here might be maintaining trust in the community. The house ethos was built on verbal agreements, so any breach could undermine future cooperation.

  Next, considering the principles involved. Reliance theory focuses on compensating for actual losses incurred because of the promise. If the three months cover the financial gap, that might suffice. However, the promise-based view argues that the commitment itself holds moral weight, regardless of tangible harm. Breaking it sets a bad precedent.

  The genuine emergency clause is another key point. Is the parent's illness covered? The housemate signed the doc, so it's reasonable to argue that this qualifies. But does that nullify all obligations, or just allow renegotiation? The user might be worried that "emergency" becomes a loophole if not handled carefully.

  Also, the practical aspects: finding a replacement. The departing housemate offering to help is good, but if the market is tough, the house bears the risk. The lump sum should account for that uncertainty. The memo needs to balance ethics with practicality, ensuring the solution is both fair and implementable.

  The user's identity as a LessWrong reader suggests they appreciate logical, structured arguments. They might also value transparency and collective decision-making. The memo should facilitate a vote, so clarity and options are crucial. Including a steelman for both sides respects each viewpoint and reduces defensiveness.

  Finally, the recommendation should uphold the community's values while addressing the immediate issue. Compensating the full obligation period might be too harsh, but three months could be insufficient. A compromise, like extending to 5-6 months with assistance in finding a replacement, might bridge the gap. Highlighting the emergency clause as valid but not absolving all responsibility maintains trust without being inflexible.
answer: |-
  Here’s a rigorously reasoned memo draft for your house council, designed to frame the dispute, provide a concrete proposal, and honor the philosophical stakes while resolving the practical issue. It steelmans both positions and makes a recommendation based on the principles most aligned with your house’s foundational ethos.

  ---

  **MEMO: Adjudication of Early Departure Obligation**  
  *To: All Housemates*  
  *From: House Council*  
  *Date: [Date of Meeting]*  
  **Subject: Recommendation re: [Name]’s Departure & Retrofit Loan Obligation**

  ### I. Core Dispute & Principles
  This case tests our shared understanding of commitment, reliance, and the function of "emergency" clauses in non-contractual agreements. We must resolve two interdependent questions:
  1. **Financial Obligation:** What does [Name] owe upon early departure due to a genuine emergency?
  2. **Normative Precedent:** How does this decision affect the integrity of future promises in our community?

  Two principled positions emerge:
  - **Position A (Reliance-Based):** The moral core of the promise is compensating for tangible harm caused by breach. [Name]’s offer of **3 months’ payment** covers the *actual financial shortfall* (loan repayment gap until a replacement is found) and aligns with the "genuine emergency" exception. Further obligation is punitive and ignores the spirit of mutual support.
  - **Position B (Promise-Based):** The moral core is upholding assurances that enabled collective action. "Commitment" means fulfilling the *entire period* barring emergencies, but emergencies only *excuse presence*, not financial duty. Accepting partial payment degrades trust in all future promises, as it signals commitments are renegotiable based on convenience.

  ### II. Steelmanning Both Positions
  **Steelman of Position A (Reliance):**  
  The retrofit loan was a joint investment predicated on stable cost-sharing. The *actual harm* to the house is the cashflow disruption until a new housemate fills the gap. [Name]’s 3-month offer is empirically sufficient: average Bay Area housing searches take 4-8 weeks, and her share ($38k ÷ 7 ÷ 24 months ≈ **$226/month**) means 3 months ($678) likely covers the vacancy risk. The "genuine emergency" clause exists precisely for unforeseeable, morally weighty events like a parent’s illness—insisting on further payment instrumentalizes human suffering and betrays our ethos of care. Financially "making whole" the house satisfies the obligation’s purpose.

  **Steelman of Position B (Promise):**  
  [Name] received a reduced buy-in cost and voting rights by giving explicit assurance of 24 months of payments. This assurance induced *reliance on stability*, not just money. If "commitment" dissolves when financial harm is offset, promises become cheap talk. The emergency clause excuses *physical presence*, not the duty to ensure the house suffers no loss from her departure. A 2-year payment obligation is binary; emergencies permit *early exit* but not *reduced responsibility*. Precedent matters: if "emergency" voids financial commitments, future housemates may invoke it subjectively, eroding trust in all agreements.

  ### III. Council Recommendation & Reasoning
  **Proposal: [Name] pays a lump sum equal to 5 months of her share ($1,130) and commits to actively assist in finding a replacement for 4 weeks.**  
  - **Payment Breakdown:** 3 months (reliance coverage) + 2 months (goodwill/contingency buffer).  
  - **Deadline:** Payment due upon departure (6 weeks from now).  
  - **Replacement Assistance:** [Name] posts listings, conducts virtual tours, and screens applicants until a successor is confirmed.  

  #### Why This Balance?
  1. **Honors the Emergency Without Absolving Duty:**  
     A parent’s illness is unambiguously a "genuine emergency." Compelling full payment would be cruel and contradict our values. However, the emergency does not nullify the *financial reliance* her promise created. The 2-month buffer acknowledges that vacancy risks or rushed replacements may impose costs beyond 3 months (e.g., rent discount for urgency, administrative labor).

  2. **Upholds the Sanctity of Promises:**  
     A purely compensatory model (Position A) reduces commitments to actuarial calculations, inviting future opportunism. Adding a goodwill premium reinforces that promises are moral undertakings, not just risk-pools. This preserves trust while avoiding the rigidity of Position B.

  3. **Quantifiable Fairness:**  
     - **Reliance Cost (3 months):** Covers 12 weeks of search/replacement time (generous for a 7-person house).  
     - **Contingency (2 months):** Accounts for potential rent loss, administrative burdens, or market volatility without demanding full 16 months of unpaid obligations ($3,616).  
     - **Active Assistance:** Leverages [Name]’s agency to mitigate harm, aligning with Scanlon’s principle that promisors must *reasonably rectify* breaches.

  4. **Precedent & Norms:**  
     This sets a clear standard: emergencies permit departure but require (a) covering tangible reliance costs, (b) a goodwill premium reflecting the broken assurance, and (c) active mitigation. Future cases will inherit this template—not a slippery slope toward trivialized commitments.

  ### IV. Path Forward
  We propose a house vote on the following:  
  *"Resolved: [Name]’s obligation is fulfilled by a lump sum payment of $1,130 (5 months of her retrofit share) and 4 weeks of active replacement assistance."*

  #### Voting Options:
  - **YES:** Accepts the council’s proposal.  
  - **NO (Reliance Model):** Endorses Position A (3 months’ payment only).  
  - **NO (Full Obligation Model):** Endorses Position B (payment for all remaining months).  

  **Rationale for Vote Structure:** A binary yes/no on our proposal risks ignoring nuanced dissent. Splitting "no" votes clarifies which principle the house majority truly endorses. If no option achieves majority, the council will revise using the leading vote’s logic.

  ---

  ### Why This Works Philosophically & Practically
  - **Scanlon-Compliant:** [Name] gave assurance to gain a benefit (lowered risk/cost). She now rectifies the harm *she caused* by ensuring the house is no worse off (reliance + buffer) and mitigates actively.  
  - **Hume-Respectful:** The "convention" of promise-keeping is preserved by requiring more than bare compensation, but not so much as to make conventions inhumanely rigid.  
  - **Oakland-Pragmatic:** The buffer protects against Bay Area’s rental volatility without demanding impossible sums.  
  - **Trust-Preserving:** By rejecting both extremes, we signal that promises matter *and* we support each other in crises.  

  This memo provides a defensible, principle-based resolution—not a split-the-difference compromise. It treats your community as the moral laboratory it is. Good luck on Sunday.
