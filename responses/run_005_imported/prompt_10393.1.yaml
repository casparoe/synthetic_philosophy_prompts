  First, I need to recall Nietzsche's key ideas. The Cornaro example is crucial here. Nietzsche criticized Cornaro for mistaking cause and effect—his diet wasn't the cause of longevity but a result of his metabolism. This ties into Nietzsche's broader critique of morality and ascetic ideals. The user mentioned Nietzsche's comments on German food affecting philosophy, showing how he links physiology to intellectual output.

  The user's hunch is that Nietzsche would see moralizing in biohacking as ascetic ideal but appreciate the discipline. I should validate that but also explore nuances. Let's break down each biohacking trend:

