answer: |-
  Here are 10 targeted interview questions with anticipated dodges and sharp follow-ups, designed to push beyond a simple restatement of her position and engage the live tensions in Devlin's framework (especially applied to sex work). Each follows a "Question > Likely Dodge > Follow-Up" structure:

  1.  **Question:** Devlin insists the law can enforce shared morality only when backed by "intolerance, indignation, and disgust" from a *reasonable/right-minded person*. But how do we distinguish this "principled" disgust from mere prejudice or transient distaste in practice, especially given Devlin's own caveat that "mere distaste" *isn't* enough?
      *   **Likely Dodge:** Appeal to democratic deliberation, community standards, or the "wisdom" of the collective over time.
      *   **Follow-Up:** Doesn't that process *rely* on the very majority sentiment it's supposed to validate? If the "reasonable person" is defined by prevailing norms, how does this *not* just codify existing prejudices (like those against homosexuality in 1957)? What *independent* check exists besides "this group really hates it"?

  2.  **Question:** Devlin's core argument is the "disintegration thesis": that tolerating significant moral divergence destroys society's "shared morality" and thus the society itself. But he offers no empirical evidence of a society collapsing *specifically* because it tolerated a victimless "immoral" practice. Isn't this thesis effectively unfalsifiable? If we tolerate something (like homosexuality or certain forms of sex work) and society *doesn't* collapse, defenders can always say "it wasn't significant *enough* divergence yet."
      *   **Likely Dodge:** Argue it's a prudential, precautionary principle; we can't wait for collapse to act. Cite historical examples of social decay linked to moral laxity (often vague).
      *   **Follow-Up:** Doesn't that make the thesis a tautology? *Any* moral enforcement can be justified by the *potential* for unseen future harm. How do we objectively measure the "threat level" of a specific practice (like consensual sex work) to the moral fabric *before* resorting to criminal law?

  3.  **Question:** Devlin's original focus was defending the criminalization of homosexuality, which he saw as a threat to the shared morality essential for society. Today, that view is widely rejected precisely because we see such acts as private, harmless conduct. If your updated Devlinian view acknowledges this was a *mistake*, doesn't that fatally undermine the reliability of the "intolerance/disgust" test and the disintegration thesis *as applied in real time*?
      *   **Likely Dodge:** Concede it was a historical error but argue society's *current* moral judgment on other issues (like sex work) is different/more reliable, or that the *framework* for identifying threats remains sound.
      *   **Follow-Up:** If the framework led society (and Devlin) so catastrophically wrong on a core example *within living memory*, why should we trust it *now* on sex work? Doesn't this suggest the "shared morality" enforced by law often tracks power and prejudice, not a genuine societal necessity?

  4.  **Question:** Let's apply your view directly to the live debate on decriminalizing sex work – the very issue reigniting this debate for many. What *specific, non-circular* harm to the "shared moral fabric" does consensual adult sex work cause that justifies criminalization, beyond the assertion that many people find it morally distasteful?
      *   **Likely Dodge:** Shift to associated harms (trafficking, exploitation, public nuisance, degradation) or argue it inherently commodifies intimacy in a way erodes social bonds.
      *   **Follow-Up:** But aren't those *associated* harms best addressed by targeted regulation (e.g., licensing, labor laws, zoning), not blanket criminalization? And isn't the claim that it "inherently commodifies/degrades" itself a *moral judgment* smuggled in? How is this different from the *exact* argument used against homosexuality ("inherently degrading to marriage")?

  5.  **Question:** You argue Hart's "no victim, no crime" liberalism smuggles in its own contestable morality (e.g., radical individualism, neutrality). But doesn't Devlin's view *also* smuggle in a highly contestable morality – namely, that collective moral sentiment *ought* to have coercive force, and that social cohesion *requires* this enforcement?
      *   **Likely Dodge:** Argue that collective moral enforcement *is* a fundamental social good/necessity, not a "smuggled" premise.
      *   **Follow-Up:** Doesn't that just push the question back? Why should we value *that* specific good (enforced shared morality) over competing goods like individual autonomy or preventing state overreach, *especially* when the targeted conduct causes no direct harm? Isn't *your* foundational moral preference just as contestable as Hart's?

  6.  **Question:** How does your updated Devlinian view account for deep moral pluralism? In diverse modern societies, where *is* this singular "shared moral fabric"? Isn't using the law to enforce *one* segment's morality (even if a majority) inherently oppressive to minorities holding different views?
      *   **Likely Dodge:** Argue there is still a core of shared values necessary for coexistence; the law reflects the "overlapping consensus" or the dominant culture necessary for stability.
      *   **Follow-Up:** Doesn't this inevitably mean suppressing minority moral views? If the "dominant culture" in 1957 demanded criminalizing gay sex, and today it doesn't, was the earlier suppression justified *then*? If so, doesn't that justify oppression based solely on majority strength?

  7.  **Question:** Devlin worried about a "slippery slope" of permissiveness. But doesn't the *opposite* slope seem just as dangerous? Once we accept enforcing morality without direct harm, where's the principled stopping point? Why not ban adultery, blasphemy, or eating meat, if enough "reasonable" people feel intense disgust?
      *   **Likely Dodge:** Argue Devlin *did* propose limits (only practices causing "right-minded" intolerance/indignation, not mere distaste), or that proportionality and democratic process act as brakes.
      *   **Follow-Up:** But if "right-minded" is defined by the majority's intensity of feeling (as per Q1), and democracy can express that intensity, what *principled* barrier exists to banning those things if a majority feels strongly enough? How is this different from majoritarian tyranny dressed in philosophical garb?

  8.  **Question:** You emphasize law's role in expressing and sustaining communal values. But aren't there *non-coercive* ways to do this – education, art, public discourse, social norms – that don't involve the violence and stigma of the criminal law? Why is the *hammer* of criminalization necessary for maintaining the moral fabric?
      *   **Likely Dodge:** Argue that law has a unique symbolic and reinforcing power; non-coercive methods are insufficient for truly foundational norms.
      *   **Follow-Up:** Doesn't criminalizing consensual conduct (like sex work or historically gay sex) *itself* cause immense, demonstrable harm (stigma, violence, driving activity underground, empowering criminals, wasting resources)? How does *this* harm weigh against the *speculative* harm of a frayed moral fabric?

  9.  **Question:** Devlin framed morality as essential for society's very survival. But modern societies like the Netherlands or New Zealand have decriminalized/regulated sex work without apparent societal collapse. Doesn't this empirical reality directly challenge the disintegration thesis's core prediction?
      *   **Likely Dodge:** Argue it's too early to tell, or point to perceived negative social trends in those countries (often contested), or claim they have other strong social bonds compensating.
      *   **Follow-Up:** If the thesis requires societies to collapse *only* when they tolerate *every* moral divergence, or if *any* societal problem can be cited as evidence of fraying, doesn't this make the thesis impossible to disprove? How much evidence of *non*-disintegration is needed to falsify it?

  10. **Question:** Finally, focusing on sex work again: If the core argument is preserving the shared moral fabric, doesn't *criminalization itself* actively *damage* that fabric by fostering disrespect for the law among those engaged in or supporting the work, breeding corruption, and creating a vast underground society operating outside communal norms?
      *   **Likely Dodge:** Argue the damage is caused by the "immoral" activity itself, not the law; the law is a necessary response.
      *   **Follow-Up:** But the empirical evidence (e.g., from places that decriminalized) often shows *reduced* corruption, *increased* cooperation with authorities, and *improved* safety. If criminalization demonstrably *creates* these harms while failing to eliminate the activity, doesn't this pragmatic reality outweigh the abstract moral claim, even on Devlin's own terms about preserving social order?

  **Key Strategy:** Listen closely for when she appeals to democracy/majority sentiment (dodge for Q1, Q6, Q7), shifts to associated harms (dodge for Q4), invokes precaution/unknowability (dodge for Q2, Q9), or relies on the inherent "wrongness" of the act (dodge for Q4, Q5). The follow-ups force her to confront the circularity, potential for oppression, historical fallibility, and empirical weaknesses of the position, especially regarding the concrete case of sex work. Good luck with the interview!
