  **The Setup:** Two mathematicians, Alex and Bailey, are reviewing a contract for the Pasadena Game offered by a shady promoter, "Lucky" Louie.

  **Alex:** (Frowning at the payout table) Louie, this expected value clause is nonsense. It just says "Theoretical EV: Priceless Potential". We need a number for the contract.

  **Lucky Louie:** (Shrugs) Eh, the eggheads say it ain't got a fixed one. Infinite? Undefined? Whatever. Call it... fifty bucks a play for the contract, keeps it simple.

  **Bailey:** (Eyes light up, grabs a napkin and starts scribbling) Hold on, Alex... Louie's right, but *legally*... we can *define* it! The series *converges*, just conditionally. Watch this... *(Bailey furiously rearranges terms on the napkin)* ...carry the two... negative payout here... group *these*... Yes! According to *this* summation order, the Expected Value is precisely... **$3.72**.

  **Alex:** (Leans in, intrigued) $3.72? That’s *less* than the cost! Louie, we pay $50 to play an EV of $3.72? That’s predatory!

  **Lucky Louie:** (Sweating) Now hold on just a—

  **Bailey:** (Waves dismissively, flips the napkin over, scribbles faster) No, no, Alex, hang on! That was just *one* arrangement! Totally arbitrary! *(Reorganizes the terms with manic glee)* Let's see... prioritize the *large* positive payouts *early*... delay the negatives... cluster the cancellations *here*... YES! *This* order gives us... **$1,842,009.55**!

  **Lucky Louie:** (Eyes wide with panic) A MILLION?! No way, pal! That ain't—

  **Alex:** (A slow, understanding grin spreads across their face) I see... So, Bailey, what you're telling Louie is... **his contractually defined Expected Value depends entirely on the order in which he plans to pay us?**

  **Punchline:** **Bailey:** (Beams, holding up the napkin scrawled with arrows and sums) Exactly! Louie, before we sign... *how do you plan to sum the series? Chronologically, or... advantageously?* We need to specify the *summation order* in Appendix C.

