  Estlund's objection is trickier. The core tension is between procedural neutrality and substantive disagreement. I need to avoid letting the guest reframe this as mere implementation difficulty; it's a conceptual knife to the heart of epistocracy. The follow-up must block the "we'll agree on basics" dodge by invoking polarization on foundational values. 

  The Caplan/bias question needs to connect credentialing to bias amplification. The user cited empirical literature, so I should reference concrete biases like anti-trade or anti-immigrant sentiment. The follow-up should challenge the exam's insulation from designer bias—maybe by asking who designs the designers. 

