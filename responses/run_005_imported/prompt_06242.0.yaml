answer: |-
  You've articulated the core objection with impressive precision, and your reading of Maher's critique is spot-on. This arbitrariness worry about the choice of scoring rule is indeed a central and persistent challenge for accuracy-first epistemology's claim to provide a purely epistemic, nonpragmatic vindication of probabilism. Let's break down why this is a serious issue and how the literature has responded, ensuring you have the nuance needed for your paper.

  **The Core Objection (Maher's Point):**

  1.  **The Claim of Nonpragmatism:** Accuracy-first arguments (like Joyce's 1998) aim to show that incoherence is an *epistemic* flaw *in itself* – being further from the truth – without invoking practical consequences like sure-loss bets.
  2.  **The Dependence on Scoring Rules:** The *only* way Joyce (and similar arguments) establish this "further from the truth" claim is by employing a specific mathematical measure of distance from truth: the Brier score (squared Euclidean distance).
  3.  **Arbitrariness of Choice:** There are infinitely many mathematically possible ways to measure "distance from truth" (scoring rules) that seem prima facie legitimate (e.g., Log Score, Spherical Score, Absolute Value Score, various weighted Brier scores). Crucially:
      *   **Not all support probabilism:** Only scoring rules satisfying very specific mathematical properties (like *strict propriety*) guarantee that incoherent credences are dominated and coherent ones are not.
      *   **No Unique Epistemic Grounding:** The bare concept of "accuracy" or "closeness to truth" does not *uniquely* pick out the Brier score, or even the class of strictly proper scoring rules. Why is minimizing *squared* error more "truth-tracking" than minimizing absolute error, or maximizing log probability? What purely epistemic principle dictates this?
  4.  **The Relocation of Pragmatism:** Therefore, the justification for probabilism doesn't come *solely* from the epistemic goal of accuracy. It crucially depends on the *choice* of scoring rule. Defending *that choice* seems to require auxiliary justifications that may reintroduce pragmatic considerations or other contestable epistemic values (e.g., sensitivity to small errors, differentiability, additivity). This undermines the claim that the argument is *fundamentally* nonpragmatic in a way that decisively improves upon Dutch Books.

  **Why This is a Powerful Objection:**

  *   **It targets the foundation:** Accuracy-first epistemology stakes its claim on grounding norms in the *single* epistemic good of accuracy. If the very *measurement* of that good requires unmotivated or contestable choices, the foundational claim is weakened.
  *   **It mirrors the Dutch Book critique:** Just as critics argued Dutch Books rely on the unmotivated (or pragmatically loaded) assumption that susceptibility to sure loss is rationally impermissible, this argues that accuracy-first arguments rely on the unmotivated (or potentially pragmatically loaded) assumption that accuracy *must* be measured by a strictly proper rule like Brier.
  *   **It highlights "epistemic conventionalism":** The worry is that the dominance result reflects the *conventions* built into the scoring rule, not an inherent feature of accuracy *simpliciter*.

  **Responses from Accuracy-First Proponents (Key for Balance):**

  Proponents have offered several lines of defense, though none are universally accepted as dissolving the worry entirely:

  1.  **Generalization to Strictly Proper Rules (Joyce 2009, Predd et al. 2009):** Joyce and others quickly moved beyond just the Brier score. They showed that a credence function is non-dominated *if and only if* it is probabilistic *relative to the class of all continuous, strictly proper scoring rules*. The argument doesn't *need* the Brier specifically; it works for any member of this broad class (which includes Brier, Log, Spherical).
      *   *Objection Persists:* Why restrict attention to *strictly proper* rules? What purely epistemic principle demands that legitimate accuracy measures must incentivize probabilistically coherent expectations? Isn't propriety itself a kind of coherence requirement smuggled in? Why exclude, say, the Absolute Value score (which is proper but not strictly proper and doesn't yield the dominance result for all incoherent credences)?

  2.  **Axiomatic Characterizations of Scoring Rules:** Some argue that plausible *axioms* capturing core epistemic desiderata for accuracy measures uniquely characterize (or narrow down) the class of acceptable rules. Common axioms include:
      *   **Strict Propriety:** As above.
      *   **Separability/Additivity:** Inaccuracy is the sum of inaccuracies on individual propositions. (Crucial for Joyce-style additive dominance proofs).
      *   **Continuity/Differentiability:** Small changes in credence cause small changes in inaccuracy.
      *   **Symmetry:** Permuting propositions doesn't change inaccuracy structure.
      *   **Normality/Dominance:** If credence `c` is further from truth value `v` than `c'` is, then `c` is more inaccurate than `c'` at that world.
      *   **Arguments exist** (e.g., Joyce 2009 building on Savage 1971; Predd et al. 2009; Levinstein 2012) suggesting that rules satisfying a plausible set of such axioms (often including strict propriety and additivity) are either the Brier score or close relatives (like weighted Brier).
      *   *Objection Persists:* Are these axioms truly *purely epistemic*? Why is additivity essential for measuring accuracy? Couldn't a holistic measure be equally valid? Is normality uncontroversial? The justification for these axioms often seems to rely on mathematical convenience for proving dominance, intuitions about "sensitivity," or even implicit pragmatic considerations (e.g., additivity making aggregation easier). Maher and others argue the axioms are chosen precisely *because* they deliver the desired dominance result for probabilism, rather than being independently compelling.

  3.  **Accuracy-Dominance is the Core Insight:** Proponents might argue that the *existence* of *some* legitimate, well-motivated scoring rule(s) under which incoherence guarantees dominance (and coherence guarantees non-dominance) *is* the significant epistemic insight. The exact choice among the plausible rules (like Brier, Log, Spherical) might be less critical for the core argument against blatant incoherence.
      *   *Objection Persists:* This concedes that the *specific* dominance result depends on the rule. If different legitimate rules yield different dominance structures (e.g., Absolute Value doesn't dominate *all* incoherent credences), then the claim that incoherence *as such* is accuracy-defective becomes rule-relative. The "non-dominated iff coherent" result *only* holds relative to the (contestable) class of strictly proper rules.

  4.  **Pragmatic Justification for the Scoring Rule?:** Some might bite the bullet and argue that justifying the scoring rule *does* involve pragmatic elements (e.g., sensitivity to small errors might matter more in contexts requiring precise action), but that this doesn't undermine the argument's core epistemic *interpretation* of what coherence *is* (avoiding accuracy-domination).
      *   *Objection Persists:* This significantly weakens the claim of a *purely* nonpragmatic vindication. It concedes that the epistemic norm rests partly on a foundation that isn't purely epistemic.

  **Stating the Worry Precisely and Fairly in Your Paper:**

  *   **Precise Statement:** "While accuracy-first arguments for probabilism avoid the *direct* pragmatic link to betting behavior found in Dutch Book arguments, their reliance on a specific class of scoring rules (notably strictly proper rules like the Brier score) to define 'accuracy' introduces a different kind of dependence. The epistemic justification for probabilism derived from dominance results is contingent upon the justification for adopting this particular class of accuracy measures. Critics argue that this justification may itself rely on auxiliary assumptions (e.g., additivity, strict propriety) that lack a clear, purely epistemic grounding independent of mathematical convenience, implicit coherence requirements, or even pragmatic considerations. Consequently, the claim that accuracy-first arguments provide a *fundamentally* nonpragmatic vindication of probabilism, decisively superior to Dutch Book arguments, is challenged by the apparent arbitrariness in the choice of scoring rule."
  *   **Fair Statement:** Acknowledge the responses:
      *   "Proponents counter that the dominance result holds relative to the broad and well-motivated class of *continuous, strictly proper scoring rules*, not just the Brier score."
      *   "They further argue that plausible axiomatic constraints on legitimate accuracy measures (e.g., additivity, strict propriety, normality, symmetry) uniquely or nearly uniquely characterize scoring rules like the Brier score within this class, providing independent epistemic justification."
      *   "The core epistemic insight, they maintain, is that probabilism is necessary and sufficient to avoid accuracy-domination under *any* reasonable measure satisfying core epistemic desiderata."

  **Is it Fatal?**

  Whether it's *fatal* depends on your stance on the justifiability of the axioms defining "reasonable" scoring rules.

  *   **If you find the axioms (strict propriety, additivity, etc.) independently compelling as purely epistemic constraints:** Then the argument largely succeeds in being nonpragmatic. The dependence is relocated, but the relocation lands on seemingly epistemic ground.
  *   **If you find the axioms unmotivated, circular, or implicitly pragmatic/conventional:** Then the worry is indeed serious and potentially fatal to the claim of a *purely* nonpragmatic vindication. It suggests the argument hasn't escaped a foundational dependence on stipulation or auxiliary values that aren't purely about truth-aiming. The nonpragmatic advantage over Dutch Books appears significantly diminished or illusory.

  **Conclusion for Your Paper:**

  You are absolutely correct in identifying this as the major challenge to accuracy-first epistemology's nonpragmatic aspirations. Maher's objection hits home. Your characterization is precise and fair. When drafting:

  1.  Clearly lay out Joyce's argument and its claimed nonpragmatic advantage.
  2.  Present Maher's objection: The dependence on Brier (and later, the class of strictly proper rules) reintroduces arbitrariness/justification problems analogous to Dutch Book bridge principles.
  3.  Detail the key responses (generalization to strictly proper rules, axiomatic characterizations).
  4.  Critically evaluate whether these responses successfully ground the choice of scoring rule on *purely epistemic* grounds, independent of mathematical convenience or implicit coherence requirements. This is the crux.
  5.  **Your Stance:** Based on your evaluation in (4), argue whether the arbitrariness worry undermines the *purely nonpragmatic* nature of the vindication. You can reasonably conclude that while accuracy-first offers valuable insights, its claim to have decisively overcome the "pragmatic taint" of Dutch Books is overstated due to the unresolved justificatory burden placed on the scoring rule. The relocation of the unmotivated assumption doesn't fully solve the foundational problem; it reframes it.
