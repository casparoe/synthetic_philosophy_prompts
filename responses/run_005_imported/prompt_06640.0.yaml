  The bonus question about non-lethal resistance is tricky. Aquinas's objections seem focused on the actor's standing and consequences, not just lethality. Leaks or sabotage by private individuals could still provoke worse repression or be driven by ambition. But if a group with some legitimacy (like dissident officials) acts, it might align more with Aquinas's idea of public authority.

  The user's deeper need seems to be applying medieval philosophy to modern authoritarianism. They want a principled way to justify resistance without endorsing vigilantism. They might also be seeking historical perspectives to inform current debates. I should address both the textual analysis and the practical implications, showing how Aquinas's logic adapts (or doesn't) to contemporary contexts.
answer: |-
  That's a brilliantly framed question – you've nailed the core tension in Aquinas's thought and perfectly identified the gap modern autocrats exploit. Let's break this down using his own categories and logic:

  **1. The Modern Autocrat & Aquinas's Framework:**

  Your scenario – a leader legitimately elected who systematically dismantles constitutional constraints – is Aquinas's nightmare case. Applying his categories:

  *   **Initial Stage (Post-Election):** The ruler is clearly a *tyrannus ex parte exercitii* (tyrant by exercise). His title is legitimate (*ex defectu tituli* doesn't apply). Therefore, Aquinas's strong caution holds: only "public authority" (the community acting collectively through legitimate institutions, or a higher temporal/spiritual authority) can correct or depose him. Private individuals acting alone with violence (tyrannicide) is forbidden due to the high risk of chaos, worse tyranny, and usurpation of rightful authority.
  *   **The Erosion Phase:** This is where Aquinas's framework strains. As the ruler guts the courts, neuters the legislature, jails dissenters, and rigs the system, he isn't just governing tyrannically; he is *actively destroying the very institutions that constitute the "public authority"* Aquinas says must act against him. Aquinas likely didn't contemplate such a comprehensive, internal subversion of the *res publica* itself by its own legitimate head.
  *   **The End State (Captured State):** Here lies the crux. Once the ruler has effectively nullified the independent legislature, judiciary, free press, and electoral mechanisms, **the "public authority" required by Aquinas to act legitimately no longer functionally exists.** It *is* a dead end within his purely institutional framework.

  **2. Principled Point for Conversion? Using Aquinas's Own Logic:**

  While Aquinas doesn't explicitly address this gradual usurpation, his *principles* offer a path to argue for a conversion from *ex parte exercitii* to something akin to *ex defectu tituli*:

  *   **The Foundation of Legitimacy:** For Aquinas, political authority exists for the common good. Legitimate title isn't just a historical fact (winning an election); it's *ongoing* legitimacy derived from governing *for* the common good within the established constitutional order. A ruler who systematically destroys that order violates the *purpose* and *conditions* of his legitimacy.
  *   **The "Title" Becomes Void:** By destroying the constitutional framework that granted him authority and defined its limits, the ruler effectively *annuls his own title*. His power no longer rests on the consent and order of the community mediated through institutions; it rests solely on force and fraud against the *res publica*. He becomes, in effect, a *usurper of the very state he was entrusted to govern*. He holds power *defectu tituli* – lacking legitimate title – because the title he once held was contingent on upholding the constitutional order, which he has destroyed.
  *   **The Community as Ultimate Authority:** Aquinas roots authority ultimately in the community (*multitudo*). Institutions are the community's mechanisms for exercising its authority. When a ruler destroys those mechanisms, *the community itself remains the source of legitimacy*. Its right to self-preservation and the common good doesn't vanish. If the institutional "public authority" is captured and inert, the community's *inherent right to act collectively* in defense of the common good re-emerges as the only remaining legitimate authority. Aquinas hints at this when discussing resistance to usurpers (*ex defectu tituli*) being open to anyone, implying the community's latent sovereignty.

  **Conclusion on Point 1:** Yes, using Aquinas's *own principles* (the purpose of authority, the common good, the community as foundation), there is a principled point where the *ex parte exercitii* tyrant, through destroying the constitutional order, effectively converts himself into a ruler *ex defectu tituli*. His legitimacy is voided by his actions. At this point, resistance (including potentially lethal force, though Aquinas would still prefer non-lethal if possible) becomes licit *in principle* for the community acting collectively, as it would against any usurper. However, Aquinas would **still vehemently oppose private, individual assassination** at this stage. The action must be collective, representing the community's will, not individual zeal.

  **3. Bonus: Non-Lethal "Tyrannicide-Adjacent" Moves & Aquinas's Concerns:**

  This is fascinating. Aquinas's core objections to *private* tyrannicide are primarily about **agency and consequences, not just lethality:**

  1.  **Standing/Authority ("Who Acts?"):** This is paramount. Aquinas's primary objection is that a *private individual* lacks the legitimate authority to judge and execute a ruler, even a tyrant. This applies *regardless of the means used*. Leaking classified material, sabotage, hacking – if done by a private citizen acting on their *own* judgment – still constitute an individual usurping the authority that belongs to the community or its legitimate representatives. It's vigilantism by other means.
  2.  **Consequences & Motives:**
      *   **Ambition Masquerading as Justice:** This danger applies equally. Sabotage or leaks could easily be motivated by personal vendetta, ideological fanaticism, or a desire for power/notoriety, disguised as patriotism. Non-lethal means don't purify the motive.
      *   **Provoking Worse Repression:** This is arguably *more* likely with non-lethal resistance. A leak or hack won't kill the tyrant but will almost certainly trigger massive crackdowns, increased surveillance, and paranoia, harming the populace far more than the act itself. Sabotage could cripple essential infrastructure, hurting ordinary citizens. Aquinas would see this as reckless disregard for the common good he aimed to protect.
      *   **Chaos and Anarchy:** While less immediately bloody than assassination, widespread private sabotage or leaking could still destabilize society, erode trust in *all* institutions (even good ones), and create a power vacuum ripe for worse actors – outcomes Aquinas feared deeply.

  **Conclusion on Bonus:** Aquinas's core case against *private* action against a tyrant (even one who may have voided his legitimacy) applies **robustly to non-lethal "tyrannicide-adjacent" moves.** His fundamental concerns are:
  *   Illegitimate assumption of authority by private individuals.
  *   High risk of harmful consequences outweighing potential benefits (increased repression, chaos, harm to innocents).
  *   The danger of hidden, impure motives.

  **He would likely only approve of such actions if:** 
  *   They were undertaken by a clearly constituted *public authority* (e.g., a legitimate resistance council recognized by the people, remnants of a legitimate government-in-exile, perhaps even an international body with proper jurisdiction if such existed in his view).
  *   The actions were proportional, necessary for the common good, and minimized harm to innocents.
  *   Non-violent means were exhausted or impractical.

  **In essence:** For Aquinas, the "who" (public authority acting for the common good) is often more important than the specific "how" (lethal vs. non-lethal), though the "how" must still meet criteria of proportionality and prudence. Private individuals acting alone or in small secret cells, regardless of their methods, fundamentally lack the standing he requires for legitimate action against a ruler, even a tyrannical one. The modern autocrat who subverts democracy from within exploits the gap between institutional legitimacy and actual power; Aquinas's solution, rooted in the community's ultimate sovereignty and the common good, points towards collective action as the only legitimate response once institutions are captured.
