  George Ainslie's key ideas on hyperbolic discounting and akrasia — the "picoeconomics" framework, where self-control problems are modeled as intertemporal bargaining among a series of momentary selves — are well-established and consistent with my existing knowledge, so I'll finalize the prompt on that basis.

  So my friend Priya is getting married next month and asked me (her oldest friend from way back in the SSC comment section days, lol) to give the toast. Heres the wrinkle: Priya and her fiancé Dev are both extremely rationalist-brained -- they actually ran a Beeminder-style precommitment contract on their own relationship early on, I think it started as a joke about always flaking on date night and turned into an actual signed doc with financial penalties attached. Half the guests will find that detail delightful, the other half (both sets of parents, assorted aunts) will just be confused if I don't handle it right.

  I want to build the toast around the idea that wedding vows are basically a commitment device against your own future hyperbolic discounting -- like Odysseus getting tied to the mast, except the mast is a legal contract and a room full of witnesses, and the whole point is to bind some future version of you on a random miserable Tuesday in year twelve who does not feel like being married that day. I keep coming back to Ainslie's picture of akrasia as a kind of ongoing intertemporal bargain between your successive selves rather than a simple failure of willpower, and vows-as-treaty feels like the natural extension of that. My worry is that this reads as cynical or reduces their love to a game-theoretic hack if I'm not careful, and it needs to land as actually romantic, not like I'm just showing off that I've read the Sequences at their expense.

  Could you write me the toast -- something in the 4-5 minute range, spoken not read off a card? It needs at least one solid joke that rewards the rationalist contingent without losing the relatives who have no idea what a discount curve is, and it has to actually earn the "this doesn't cheapen it, it's the opposite" turn rather than just asserting it, since that's the whole crux of why I want to frame it this way in the first place.
