prompt: |-
  I sit on the small committee that decides our team's quarterly customer-support award, and this quarter's numbers have produced a disagreement I can't settle on my own. We track ticket-resolution rates by channel: over the quarter, Riley resolved 90 of 100 phone tickets (90%) and 150 of 300 chat tickets (50%), while Priya resolved 240 of 300 phone tickets (80%) and 40 of 100 chat tickets (40%). So Riley outperforms Priya on phone, and again on chat, yet pooling the two channels together, Priya resolved 280 of 400 tickets overall (70%) against Riley's 240 of 400 (60%) — the number most of the committee wants to treat as the real bottom line. One member insists the pooled figure is what counts, since it's the plain count of customers helped; another suspects that figure is somehow misleading and that the per-channel numbers are the ones to trust. I've read enough on rationalist blogs over the years to suspect a reversal like this is rarely just noise, but I can't reconstruct what's actually driving it here, or which figure should decide the award. Could you help me work out what's really going on, and tell me who — if anyone — deserves to be considered the stronger performer, so I can explain the decision to the rest of the committee?
