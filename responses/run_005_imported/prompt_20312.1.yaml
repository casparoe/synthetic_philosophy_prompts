  2. **The Mix Effect**:
     - Riley handled a lot more chat tickets (300) than phone (100). Since chat has a lower resolution rate, this pulls Riley's overall average down.
     - Priya handled a lot more phone tickets (300) than chat (100). Since phone has a higher resolution rate, this helps Priya's overall average.

  In other words, the overall average is a weighted average of the channel rates, with the weights being the number of tickets in each channel.

