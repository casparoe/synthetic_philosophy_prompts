answer: |-
  This situation is a classic example of **Simpson's Paradox**, where aggregate data (pooled tickets) shows a trend that reverses when the data is split into subgroups (per-channel tickets). The paradox arises because the subgroups (phone vs. chat) have different baseline difficulties and uneven sample sizes, which distorts the pooled result. Let's break it down step by step.

  ### 1. **The Data Recap**:
  - **Riley**:
    - Phone: 90/100 resolved (**90%**)
    - Chat: 150/300 resolved (**50%**)
    - **Overall**: 240/400 resolved (**60%**)
  - **Priya**:
    - Phone: 240/300 resolved (**80%**)
    - Chat: 40/100 resolved (**40%**)
    - **Overall**: 280/400 resolved (**70%**)

  ### 2. **Why the Reversal Happens (Simpson's Paradox)**:
  - **Channel Difficulty**:  
    Phone tickets are easier to resolve (both agents have higher success rates here) compared to chat tickets (lower success rates).  
    - Phone baseline: Riley (90%), Priya (80%) → **easier**.  
    - Chat baseline: Riley (50%), Priya (40%) → **harder**.  
  - **Uneven Work Distribution**:  
    - Riley handled **300 chat tickets** (harder channel) and only **100 phone tickets** (easier channel).  
    - Priya handled **300 phone tickets** (easier channel) and only **100 chat tickets** (harder channel).  

  The pooled rate is a **weighted average** of channel-specific rates. Since Priya handled mostly easy tickets (phone) and Riley handled mostly hard tickets (chat), Priya’s overall rate gets inflated by the easier workload, while Riley’s is dragged down by the harder workload.  

  **Mathematically**:  
  - Riley’s overall rate = \(\frac{(90\% \times 100) + (50\% \times 300)}{400} = \frac{90 + 150}{400} = 60\%\).  
    - Heavy weight (300/400 = 75%) on the harder chat channel (50%).  
  - Priya’s overall rate = \(\frac{(80\% \times 300) + (40\% \times 100)}{400} = \frac{240 + 40}{400} = 70\%\).  
    - Heavy weight (300/400 = 75%) on the easier phone channel (80%).  

  ### 3. **Which Metric Should Decide the Award?**:
  - **Pooled Rate (70% vs. 60%) is Misleading**:  
    It ignores channel difficulty. Priya’s higher pooled rate stems from her handling more phone tickets (easier) and fewer chat tickets (harder). This isn’t a fair comparison of skill—it’s skewed by workload assignment.  
  - **Per-Channel Rates are More Meaningful**:  
    Riley outperformed Priya in **both** channels:  
    - Phone: **90% vs. 80%** (Riley resolved 10% more phone tickets).  
    - Chat: **50% vs. 40%** (Riley resolved 10% more chat tickets).  
    This consistency suggests Riley is the stronger performer *when controlling for channel difficulty*.  

  ### 4. **Additional Insight: Standardized Comparison**:
  To eliminate workload bias, calculate what their rates would be if both handled the **same mix of tickets**. For example, using the **overall committee’s ticket distribution**:  
  - Total phone tickets: 100 (Riley) + 300 (Priya) = **400**  
  - Total chat tickets: 300 (Riley) + 100 (Priya) = **400**  
  - Standardized mix: 50% phone, 50% chat.  

  **Adjusted Rates**:  
  - Riley: \( (90\% \times 50\%) + (50\% \times 50\%) = 45\% + 25\% = **70\%** \)  
  - Priya: \( (80\% \times 50\%) + (40\% \times 50\%) = 40\% + 20\% = **60\%** \)  

  **Result**: Riley’s adjusted rate (70%) > Priya’s (60%), confirming Riley is stronger when fairly compared.  

  ### 5. **Conclusion: Who Deserves the Award?**
  - **Riley** is the stronger performer.  
    - They excelled in both channels individually.  
    - Their lower pooled rate is an artifact of being assigned more hard tickets (chat), not skill.  
  - **Priya’s pooled rate is inflated** by her favorable workload (mostly easy tickets).  

  ### 6. **How to Explain to the Committee**:
  > "We have a statistical illusion here. Priya’s higher overall rate (70%) comes from handling mostly phone tickets, which are easier to resolve. Riley handled mostly hard chat tickets, which pulled their overall rate down. But when we compare them fairly—channel by channel—Riley resolved a higher percentage of tickets in both phone (90% vs. 80%) and chat (50% vs. 40%).  
  >   
  > Even if we standardize their workloads to a 50-50 phone-chat split, Riley’s adjusted rate (70%) beats Priya’s (60%). The pooled number hides the true performance because it doesn’t account for channel difficulty. Riley deserves the award for consistently outperforming Priya in both channels."  

  This approach resolves the paradox by prioritizing **like-for-like comparisons** (per-channel metrics) over aggregated data skewed by external factors (uneven workloads).
