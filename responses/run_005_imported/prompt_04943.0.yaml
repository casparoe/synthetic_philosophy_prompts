prompt: |-
  I just got put on our company's promotion committee (first case ever, and it's doing my head in). We're choosing between two reps, Priya and Dan, for the open regional director slot. Overall Priya closes 67% of her leads vs Dan's 46%, so on paper it looks obvious. But our ops guy split the numbers by lead type just to double check, and it flips: on warm leads Dan closes 92% to Priya's 90%, and on cold leads Dan closes 30% to Priya's 20%. Priya's total is only higher becuase she's been fed mostly warm leads (200 warm/100 cold) while Dan's gotten mostly cold ones (50 warm/150 cold) -- and nobody on the committee can agree on whether that split happened because Priya was already seen as the stronger closer, or if it's just how the queue got divvied up before either of them had a track record. We vote Thursday. Can you draft the memo I'd actually bring in -- a real pick (Priya, Dan, or hold the promotion for better data, and if so for how long and on what basis), the reasoning behind it, and an honest version of the strongest case for whoever we don't go with?
reasoning: |-
  Okay, the user is on a promotion committee and needs to decide between Priya and Dan for a regional director position. The surface numbers show Priya has a higher overall close rate (67% vs. 46%), but when split by lead type, Dan actually performs better in both warm (92% vs. 90%) and cold leads (30% vs. 20%). The key issue is the unequal distribution of leads: Priya got mostly warm leads (200 warm/100 cold) while Dan got mostly cold ones (50 warm/150 cold). 

  The committee is divided on whether this lead allocation was intentional (because Priya was seen as stronger) or random. The user needs a memo that makes a clear recommendation, acknowledges counterarguments, and provides reasoning. 

  First, I need to analyze why the overall numbers are misleading. This looks like a classic Simpson's Paradox where aggregated data shows one trend but disaggregated data shows the opposite. The math checks out: Priya's total closes are (200*0.9 + 100*0.2) = 200, divided by 300 leads is 67%. Dan's is (50*0.92 + 150*0.3) = 46 + 45 = 91 closes from 200 leads → 45.5% ≈46%. But per lead type, Dan is superior. 

  The real question is about fairness in evaluation. If the lead allocation was biased against Dan from the start, promoting Priya would compound that unfairness. But if the allocation reflected Priya's existing skill, then her higher volume might justify the promotion. The problem is there's no data on how leads were assigned initially. 

  For the regional director role, handling cold leads is likely more critical because warm leads are easier to close. Dan's 50% higher success rate on cold leads (30% vs 20%) is significant here. Also, resilience in tough situations matters for leadership. 

  The strongest case for Priya would be: she excelled with the opportunities given, and her volume of closed deals (200) vastly outpaces Dan's (91). If the director role involves leveraging warm networks, her performance there is stellar. But this ignores systemic advantages. 

  Recommendation: Dan, because he demonstrates better absolute skill when lead difficulty is factored in. But acknowledge the lead distribution issue and suggest tracking future assignments fairly. 

  The memo should present this neutrally, show the math transparently, and propose a short-term review period to validate the decision with balanced leads. The user needs to appear data-driven while handling committee disagreements diplomatically.
answer: |-
  ## Promotion Committee Memo: Regional Director Recommendation  
  **To:** Promotion Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Analysis & Recommendation for Regional Director Promotion  

  ### 1. Executive Summary  
  After rigorous analysis of Priya’s and Dan’s performance data, I recommend **promoting Dan** to Regional Director. While Priya’s aggregate close rate (67%) exceeds Dan’s (46%), this disparity is entirely attributable to unequal lead distribution. Dan demonstrates superior closing ability *across both lead types* when evaluated fairly.  

  ---

  ### 2. Data Breakdown: The Simpson’s Paradox  
  Our ops team uncovered a critical statistical anomaly:  

  | Metric          | Warm Leads (Avg. 90% Close Rate) | Cold Leads (Avg. 25% Close Rate) | Overall |  
  |-----------------|----------------------------------|----------------------------------|---------|  
  | **Priya**       | 90% (180/200)                   | 20% (20/100)                    | 67%    |  
  | **Dan**         | 92% (46/50)                     | 30% (45/150)                    | 46%    |  
  | **Lead Allocation** | 200 warm / 100 cold (67% warm) | 50 warm / 150 cold (25% warm)   | —      |  

  **Key Insight:**  
  - Dan outperforms Priya on **both** warm leads (+2%) and cold leads (+10%).  
  - Priya’s higher aggregate is an artifact of her receiving **3× more warm leads** (67% vs. Dan’s 25%).  

  ---

  ### 3. Recommendation: Promote Dan  
  **Core Reasoning:**  
  - **Skill > Circumstance:** Dan’s higher close rates *despite* harder conditions demonstrate stronger fundamental sales acumen. Closing cold leads is critical for a Regional Director scaling new markets.  
  - **Resilience Proof:** Dan’s 30% cold lead rate (vs. Priya’s 20%) shows adaptability in challenging scenarios—a director-level competency.  
  - **Fairness Imperative:** Punishing Dan for receiving fewer warm leads perpetuates systemic bias. His performance should be evaluated on *demonstrated skill*, not skewed inputs.  

  **Risk Mitigation Plan:**  
  - Place Dan on a **60-day performance review** with balanced lead allocation (50% warm/cold).  
  - Track not just close rates, but deal size, client retention, and cross-team collaboration.  

  ---

  ### 4. Strongest Case for Priya (and Why It Falls Short)  
  **Argument for Priya:**  
  *“Priya maximized her opportunity: she closed 180 warm deals (vs. Dan’s 46), proving she can leverage high-value relationships—essential for a director. Her aggregate numbers reflect consistent execution, and she earned her lead allocation through past excellence.”*  

  **Counterpoints:**  
  - Her warm-lead dominance may stem from **preferential assignment** (not merit), creating a self-fulfilling cycle.  
  - **Cold-lead underperformance (20% vs. Dan’s 30%)** raises concerns about versatility in new markets.  
  - Regional Directors face unpredictable pipelines; Priya’s reliance on warm leads is a strategic liability.  

  ---

  ### 5. Recommendation Against Holding the Promotion  
  Waiting for "better data" without action:  
  - **Penalizes high performers** (Dan) for flawed systems.  
  - **Ignores existing evidence** of skill disparity.  
  - **Demoralizes talent** by implying data matters more than fairness.  

  If the committee remains split, I propose:  
  - **Run a 30-day trial:** Assign both 50 warm + 50 cold leads.  
  - **Promote the leader in cold leads** (the director’s true test).  

  ---

  ### 6. Conclusion  
  Promoting Priya rewards circumstance; promoting Dan rewards skill. Dan’s ability to excel with fewer resources aligns with the demands of Regional Director. I move to promote Dan with a 60-day review anchored in equitable lead distribution.  

  **Vote:** Dan  
  **Backup Plan:** 30-day trial (if consensus fails).  

  // Signature //  
  [Your Name]  
  [Your Title]  

  ---

  **Why this works:**  
  - **Preempts bias** by naming Simpson’s Paradox.  
  - **Balanced** by giving Priya’s case full credit.  
  - **Action-oriented** with review safeguards.  
  - **Prioritizes role needs** (cold-lead resilience > warm-lead harvesting).  

  Bring the ops lead to Thursday’s vote to explain the data anomaly. Numbers lie; context doesn’t.
