  Then, the patches: lexical thresholds mean that reducing extreme suffering always trumps creating happiness. Tranquilism is the idea that a world without suffering but minimal happiness is better than a world with both. The user wants to know if these are principled or just damage control. So in the dialogue, the CU should press on whether these modifications are consistent or if they're arbitrary exceptions to avoid the annihilation implication.

