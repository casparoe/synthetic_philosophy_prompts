  ### Justifications

  **Move (1): Marcus (Score: 1)**  
  Marcus correctly identifies that Cummins' causal-role account captures the *current* causal contribution of flight feathers to flight, which aligns with intuitive functional ascriptions in physiology or engineering. However, this move overlooks the core weakness Elena raises: causal-role theory struggles to exclude non-functional side effects (e.g., heart sounds). It is partially right but incomplete, as it dismisses history too hastily.

  **Move (2): Elena (Score: 2)**  
  Elena’s objection is clearly right: causal-role theory indeed overgenerates by counting *any* causal effect (e.g., heart thumps) as a function, failing to distinguish between selected advantages and incidental byproducts. Her appeal to etiology resolves this by tying functions to selective history, which provides an objective criterion for privileging certain effects (e.g., blood-pumping) over others.

  **Move (3): Marcus (Score: -1)**  
  Marcus’s reply misrepresents the etiological account. While he rightly notes that tracing origins too far back could assign outdated functions (e.g., thermoregulation for feathers), etiological theories (e.g., Neander’s) typically focus on the *most recent* selection pressures that explain the trait’s current form—not its distant origins. For hawk feathers, this would be aerodynamic refinement for flight. His claim that this cutoff is arbitrary is overstated, as it ignores how etiologists define "selection history" operationally (e.g., stabilizing selection). Still, his point about potential vagueness in "recent" history has mild force, warranting a negative but not maximal score.

  **Move (4): Elena (Score: 1)**  
  Elena correctly argues that the relevant selective regime is a factual (not stipulative) matter, and it avoids the explanatory subjectivity of causal-role theory. However, she understates practical challenges: identifying the "actual" selective regime often involves interpretive uncertainty (e.g., distinguishing exaptations from adaptations). Her point is solid but not flawless, as real-world applications can blur the line between history and current utility.

  ### What Both Are Overlooking  
  Elena and Marcus both overlook the potential for *pluralism* or *hybrid accounts* of function. For instance, Millikan’s teleosemantics or Griffiths’ modern etiological theories integrate history with current causal roles, accommodating traits with multiple functions (e.g., feathers for both insulation *and* flight). They also neglect the role of *context*: in evolutionary developmental biology ("evo-devo"), function can shift dynamically during trait modification, making rigid distinctions (e.g., "original vs. current" function) less tenable. A fuller account must address how function ascriptions depend on explanatory scope (e.g., proximal mechanisms vs. deep phylogeny) and whether vestigial traits (e.g., human appendix) challenge both theories by having historical functions but no current causal role.
