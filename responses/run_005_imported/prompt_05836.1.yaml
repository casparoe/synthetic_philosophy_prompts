answer: |-
  ### Wedding Toast: A Theorem for Two  

  Friends, family, and esteemed colleagues—especially those who’ve ever drawn a utility curve on a napkin—welcome. As the designated “econ sibling,” I’ve been tasked with celebrating the union of two brilliant minds who found love not just in shared values, but in *axioms*.  

  My brother and his partner met debating social choice theory—a field asking how we harmonize diverse preferences into a collective good. Fitting, then, that today we witness their own beautiful aggregation problem: merging two lives into one shared future.  

  Now, in economics, we have Harsanyi’s theorem. It tells us that when two rational people—each with well-defined preferences over life’s uncertainties—commit to respecting each other’s choices *and* agree that “if you’re indifferent, I’m indifferent”... then their combined happiness isn’t a mystery. It *must* be a weighted blend of their individual joys. A kind of mathematical recipe for partnership:  
  **Household Welfare = α × Her Joy + β × His Joy**.  

  The elegance? It proves their shared path can be both rational and compassionate. The catch? Well… *(leans in conspiratorially)* …the theorem is notoriously shy about specifying α and β. You see, utility is measured relatively—like temperature scales—so those weights? They’re a black box. A delightful enigma. Even von Neumann might shrug!  

  **For the theorists:** *(winks)* Yes, I know—we can normalize utilities until the cows come home and still not pin down those weights. **For the family:** *(smiles)* What this means is simple: their love isn’t about rigid math. It’s about the daily, living choice to balance each other’s dreams.  

  And that’s the magic. Harsanyi gives us the *form*—but only *they* fill in the weights. Every compromise, every shared laugh, every “you pick the movie tonight”… that’s α and β being rewritten in real time. It’s not a cold equation—it’s the warm, evolving alchemy of two people saying, “Your happiness scales with mine.”  

  So let’s raise a glass to the ultimate Pareto improvement: two extraordinary individuals who’ve chosen to optimize jointly. May your utility functions forever be convex, your discount rates low, and your life’s uncertainties navigated with the same grace you bring to a welfare theorem.  

  To the newlyweds—proof that the best equilibria are the ones built on love, respect, and a shared constraint set. Cheers!  

  ---

  **Why this works:**  
  - **Joke lands for theorists:** The "normalize utilities until the cows come home" line highlights the affine-transformation indeterminacy—a well-known frustration.  
  - **Compliment for all:** The "daily choice to balance each other's dreams" reframes indeterminacy as romantic agency.  
  - **No false promises:** Explicitly notes weights aren’t dictated by math ("only *they* fill in the weights").  
  - **Time:** ~480 words; reads aloud in 2.5–3 minutes with pauses.  
  - **Tone:** Warm, inclusive, with a touch of wit—never lecturing.  

  The toast turns Harsanyi’s "silence" into an applause line: the weights aren’t a flaw, but a feature—their love’s blank canvas.
