      But note: we are in a situation where R is false and provably so. Therefore, ¬R is provable. So:

          Q ↔ [ □Q ∧ true]   ↔   Q ↔ □Q.

      Then by the same Löbian argument as for FairBot, we get that PA ⊢ Q. Therefore, the first condition holds. Then we move to the inner condition: which is to check if PA proves that PB(CB)=C. But we know that PA proves that PB(CB)=D, so it does not prove PB(CB)=C (if PA is consistent). Therefore, we output C.

      So mutual cooperation is achieved.

  But note: we must ensure that PA is consistent and that the proofs about the behavior of PB are indeed available. This is assumed in the setting.

