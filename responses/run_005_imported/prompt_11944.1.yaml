prompt: |-
  In the multi-agent systems seminar I'm taking this term, we recently spent a session on Tennenholtz's notion of program equilibrium: instead of choosing actions directly, players in a game such as the one-shot Prisoner's Dilemma submit programs that can inspect one another's source code before outputting a move. Our instructor first noted that the obvious naive strategy — cooperate only if the opponent's code is identical to your own — is unsatisfying, since it only ever produces cooperation within a clique of byte-for-byte identical programs and offers no principled way to extend trust to a differently written but behaviorally equivalent agent. She then introduced FairBot, which cooperates with an opponent X precisely when a fixed formal system such as Peano Arithmetic can prove that X cooperates with FairBot, and claimed that Löb's theorem guarantees that FairBot playing against itself provably leads to mutual cooperation, whereas the tempting alternative of having each bot simply simulate its opponent to decide what to do collapses into an infinite regress.

  I followed the general shape of this argument in lecture, but the notes move quickly over the actual logical machinery, and I would like to understand it properly rather than just memorize the conclusion. Could you explain, with enough technical detail to be genuinely illuminating: (a) how exactly Löb's theorem is invoked to certify that FairBot cooperates with FairBot, including the role the diagonal (quining) construction plays in letting FairBot's own definition refer to facts about FairBot's behavior; (b) precisely where the infinite regress bites in the naive "simulate your opponent" strategy, and why substituting provability — checked via a bounded proof search — for direct execution avoids it; and (c) how a refinement such as PrudentBot can still defect against unconditional cooperators like CooperateBot, so as to capture the temptation payoff rather than leave it on the table, without thereby destroying the Löbian cooperation it otherwise achieves against FairBot and against itself. My background is in computer science, but I encountered the □ ("provable in the fixed system") notation for the first time in this lecture, so please don't assume much more provability-logic background than that.
