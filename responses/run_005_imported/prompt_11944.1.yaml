          But note: the first condition is about proving CB(PB)=C. Since CB is simple, this proof exists. Then PB would output C? 
          However, we want PB to output D in this case.

  So we have a problem: the first condition is satisfied (because PA can prove CB(PB)=C) so PB would output C. But we want it to output D.

