  Therefore, PrudentBot achieves mutual cooperation with itself and with FairBot, but defects against CooperateBot.

  One caveat: the formal system must be strong enough to prove the necessary properties about the programs. In practice, we assume that the system is sufficiently strong (like PA) and consistent.

