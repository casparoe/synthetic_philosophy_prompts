  But what about when X is PrudentBot? 
      First condition: PA proves that X(PrudentBot)=C? We need to see what PrudentBot does against PrudentBot.

      PrudentBot(PB):
          Check: does PA prove that PB(PB)=C? 
          But note: inside PB, if the first condition holds, then it goes to the inner if: and then checks if PA proves that PB(CooperateBot)=C. 
