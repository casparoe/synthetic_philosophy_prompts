      But we know that PB(CB)=D (as argued above). Therefore, PA should be able to prove that PB(CB)=D (if the system is consistent). So the inner condition fails (because it is checking for PB(CB)=C, which is false and not provable; in fact, PB(CB)=D is provable). Therefore, the inner condition is false, so we output C.

      Therefore, PB(PB)=C.

  But now, we must check if the first condition is provable. That is, does PA prove that PB(PB)=C? 

      We have: PB(PB)=C if and only if:
          (1) PA proves that PB(PB)=C, and 
