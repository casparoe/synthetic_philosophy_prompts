              When PB is given CB: 
                  First condition: does PA prove that CB(PB)=C? Yes (because CB always cooperates) -> so it would then check: does PA prove that CB(CooperateBot)=C? Yes -> so PB(CB)=D.
          Therefore, PB is not an unconditional cooperator: it defects against CB. 
          So when we are at the inner if for PB(PB): we are checking: does PA prove that PB(CooperateBot)=C? 
          But we just saw that PB(CB)=D, so PA should be able to prove that (if the system is consistent). Therefore, we get: PA proves that PB(CB)=D, so the inner condition fails? 

  Wait, let me clarify:

