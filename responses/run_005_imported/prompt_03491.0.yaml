  The core tension here is between two approaches: those who think conditionals have truth conditions (like Lewis) and those who think they're non-propositional (Adams-Edgington). Lewis showed that if conditionals express propositions with probabilities equal to conditional probabilities, this leads to triviality - only possible in degenerate cases. Adams and Edgington avoid this by saying conditionals don't express propositions at all, so we can only assign probabilities to unembedded conditionals.

  But the user wants me to argue that this restriction is a major concession, not just a technical fix. Let me think about why embeddings matter so much. First, natural language constantly embeds conditionals - "If A, then if B, C" or "It's not true that if A, B". If your semantics can't handle these, it's incomplete. The compositionality point is crucial: any adequate semantics must explain how meaning builds from parts.

