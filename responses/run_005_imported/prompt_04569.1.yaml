  I should also address possible counterarguments. Realists might say that any decomposition that allows manipulation is valid. But the user can argue that without a privileged basis, the features are context-dependent tools, not fundamental entities. Comparing to other sciences, like neurobiology where stimulating neurons leads to effects, but here the features aren't stable across analyses.

