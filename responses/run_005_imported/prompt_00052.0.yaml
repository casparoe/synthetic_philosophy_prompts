answer: |-
  ## The Unraveled Mosaic: Quantum Entanglement and the Fate of Humean Supervenience

  David Lewis's Humean supervenience (HS) presents an elegant and parsimonious vision of the world: the entire universe supervenes on a vast, fundamental "mosaic" of local, intrinsic properties instantiated at space-time points or small regions. Everything else – laws of nature, causation, modality, even probabilities – emerges as patterns within this pointillist arrangement, captured by Lewis's "best-system account" (BSA). The BSA defines laws as the axioms in the systematization of the mosaic that best balances simplicity and strength. However, the phenomenon of quantum entanglement, particularly its manifestation of *non-separability*, poses a seemingly existential threat to this worldview. Entangled states exhibit correlations that defy explanation by any arrangement of purely *local* intrinsic properties possessed by the individual entangled parts. This essay argues that while modifications like introducing fundamental relations or adopting wave-function realism offer potential paths forward, they either fundamentally abandon the core commitments of Lewisian HS or stretch it beyond plausible recognition, ultimately rendering the project untenable in its original, robust form.

  **The Core Challenge: Non-Separability and the Mosaic's Limits**

  The essence of the challenge lies in quantum non-separability. For entangled systems (like two electrons in a singlet state), the quantum state assigns properties (like spin) only to the *whole system*, not definitively to the individual parts prior to measurement. The correlations observed upon measurement (e.g., if one electron is spin-up, the other is *always* spin-down, regardless of distance) cannot be accounted for by pre-existing, local properties of each electron considered independently. As Tim Maudlin forcefully argued, no arrangement of local qualities within the mosaic, even supplemented with purely local dynamical laws, can generate these perfect, non-local correlations. The entanglement relation is *irreducibly holistic*; the state of the whole is not determined by the states of the parts plus their spatiotemporal relations. This directly contradicts the HS requirement that the global supervenes on the local and intrinsic.

  **Proposed Modifications: Saving Grace or Concession?**

  Faced with this challenge, Humeans have explored modifications:

  1.  **Enlarging the Base: Fundamental Relations:** One strategy is to expand the supervenience base to include fundamental, irreducible relations between space-time points or regions. These relations wouldn't supervene on the intrinsic properties of the relata; they would be primitive additions to the mosaic. While this *could* potentially encode the necessary correlations for entanglement (e.g., a fundamental "entanglement relation"), it constitutes a significant retreat from core HS tenets.
      *   **Assessment:** This move directly abandons Lewis's insistence that the fundamental base consists *only* of local intrinsic properties. Introducing fundamental relations violates the spirit of the "pointillist" mosaic. The relations themselves are not local qualities of points but inherently involve multiple locations. While the *global* state might supervene on the base (now including relations), the base itself is no longer purely local and intrinsic. This concedes the anti-Humean point that some fundamental, irreducible structure beyond localized qualities is necessary to describe the world. It salvages supervenience only by sacrificing the *Humean* character of the fundamental base.

  2.  **Wave-Function Realism:** Another prominent approach, championed by David Albert and Barry Loewer, is wave-function realism. Here, the fundamental physical entity is not a mosaic of local properties, but the quantum wave-function itself, understood as a field inhabiting a very high-dimensional configuration space (e.g., 3N-dimensional for N particles). The familiar 3D space-time manifold and objects within it are derived phenomena. The wave-function's state at a point in *configuration space* is taken as the fundamental local intrinsic property.
      *   **Assessment:** This approach can formally accommodate entanglement: the entangled state is simply a specific, non-separable configuration of the wave-function field in its high-dimensional space. The BSA could then apply to the history of this field. However, this represents a radical reinterpretation of the HS mosaic:
          *   **Locality Lost:** The "local" properties are now defined in configuration space, not physical space-time. Correlations in 3D space that appear non-local are merely manifestations of the structure in configuration space. While *mathematically* local in the high-D space, this bears little resemblance to the intuitive, spatiotemporally local mosaic Lewis envisioned. The fundamental ontology is radically different.
          *   **Intrinsicness Questioned:** The wave-function's value at a point in configuration space describes a property of the *entire system*, not a localized part of 3D space. Its "intrinsicness" is defined relative to a point in an abstract space, not a point in the familiar world.
          *   **Emergence Challenge:** Recovering the manifest 3D world and its objects from the wave-function dynamics in configuration space is a formidable, arguably unresolved problem. It risks making the familiar world a mere epiphenomenon.
      Wave-function realism saves a *form* of supervenience (the world supervenes on the wave-function's evolution) but abandons the core HS commitment to a fundamental ontology grounded in localized qualities within *physical* space-time. It redefines the mosaic beyond recognition to fit the quantum data.

  **A Third Way? Ontic Structural Realism (OSR):**
  Some, like Michael Esfeld, propose a Humean-compatible OSR. Here, the fundamental base consists *only* of spatiotemporal relations (or structures), with objects being mere "placeholders" in these relations. Entanglement relations become part of the fundamental relational structure.
  *   **Assessment:** This avoids fundamental intrinsic properties but faces challenges. Defining "local" relations without relata possessing intrinsic properties is difficult. More critically, the BSA requires a distribution of *particulars* to systematize. If the fundamental base is pure structure, what are the "particular facts" supervened upon? This approach risks dissolving the mosaic entirely into pure relations, losing the Humean emphasis on particular occurrences. It remains controversial whether this genuinely preserves HS or constitutes another form of anti-Humean structuralism.

  **Definite Verdict: The Mosaic Unraveled**

  Quantum non-separability delivers a fatal blow to Lewis's original, robust conception of Humean supervenience. The core commitment – that *everything* globally supervenes on an arrangement of *purely local and intrinsic* qualities at space-time points – is irreconcilable with the irreducible holism of entangled states. No arrangement of such pointillist facts can ground the necessary non-local correlations.

  The proposed modifications represent strategic retreats, not successful defenses:
  1.  **Adding fundamental relations** abandons the purely local intrinsic base, conceding the need for irreducible holism at the fundamental level.
  2.  **Wave-function realism** redefines the fundamental ontology and the meaning of "local" so drastically that it no longer embodies the spirit of Lewis's mosaic in physical space-time. It saves supervenience only by redefining the terms.
  3.  **Humean OSR** struggles to maintain a coherent notion of particulars within the mosaic and risks collapsing into a non-Humean structuralism.

  Therefore, **Humean supervenience, understood as the doctrine that the global supervenes on a fundamental base consisting *exclusively* of local intrinsic properties instantiated at space-time points, is not tenable in light of quantum non-separability.** The world revealed by quantum mechanics, particularly entanglement, necessitates fundamental structure that is irreducibly non-local or holistic. While a modified "neo-Humean" project might persist – perhaps embracing wave-function realism or fundamental relations within a supervenience framework – it does so only by relinquishing the defining characteristics of Lewis's elegant vision. The mosaic, as originally conceived, is fundamentally inadequate to capture the entangled fabric of quantum reality. The challenge of entanglement forces a recognition that the world's fundamental structure involves irreducible connections that transcend the aggregation of localized qualities, marking a significant victory for anti-Humean intuitions about the nature of physical law and ontology.
