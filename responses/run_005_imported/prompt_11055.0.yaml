  Okay, the user is teaching a graduate seminar on philosophy of mind, specifically focusing on naturalizing intentional content. They're comparing Millikan's teleosemantics and Fodor's asymmetric dependence theory, especially regarding the disjunction problem and the Swampman case. The students are struggling, so the user wants a clear comparison and analysis of how each theory handles these issues.

  First, I need to recall the disjunction problem. It's about how a representation can misrepresent. If a representation is caused by both its true referent and some decoys, a purely causal theory might say its content is a disjunction (e.g., "cat or robot-cat"), making misrepresentation impossible. Both Millikan and Fodor have solutions, but they approach it differently.

  Millikan uses evolutionary history. Content is fixed by the proper function derived from selection history. For example, a frog's fly-detector has the function to detect flies because that's what it was selected for. Even if it sometimes fires at BBs, misrepresentation occurs because BBs aren't the Normal condition. The disjunction is blocked because only flies are what the mechanism is supposed to detect. 

  Fodor, however, rejects history. His asymmetric dependence theory relies on current causal laws. A representation (e.g., "horse") is caused by horses, but also sometimes by cows in the dark. The content is horse because the cow-causing instances depend on the horse-causing laws. If the horse-causing law were removed, the cow-causing wouldn't happen, but not vice versa. So misrepresentation is possible when non-horses cause the token, but asymmetrically depend on the primary law.

  Now, Swampman: a duplicate created by chance, no evolutionary history. Millikan's theory would say Swampman has no intentional states because no selection history. But intuitively, Swampman behaves like a person, so this seems counterintuitive. Fodor's theory, being non-historical, can ascribe content based on current causal relations. So Swampman's brain states could have content via asymmetric dependence in the current nomological network.

  The user's deeper needs: They want a clear comparison for students, highlighting how each theory resolves the disjunction problem and handles Swampman. Also, they might want to discuss the trade-offs—like Millikan's historical reliance vs. Fodor's current laws but with issues like distal content and natural kind assumptions. 

  Students might be confused about why Millikan dismisses Swampman's mentality or how Fodor's asymmetric dependence is established without history. The user probably wants to emphasize the philosophical implications: internalism vs. externalism, the role of history, and whether content depends on factors beyond the current state. 

  I should structure the response by first explaining each theory's solution to disjunction, then Swampman, followed by pros/cons. Point out Millikan's strength in grounding content in function but weakness in Swampman. Fodor avoids Swampman's issue but has other problems like indeterminacy. Conclude that both have costs, but Millikan might better handle distal content while Fodor's internalism is more intuitive for some.
answer: |-
  Here's a comparative analysis of Millikan's and Fodor's approaches to the disjunction problem and the Swampman case, addressing the core philosophical tensions:

  ### 1. **Solving the Disjunction Problem**
     - **Millikan (Teleosemantics):**  
       Content is fixed by *evolutionarily selected functions*. A representation (e.g., a frog’s "fly-detector" neural state) **means** *fly* because its **proper function** is to detect flies (the state was selected *for* indicating flies in "Normal conditions").  
       - **Blocking disjunction:** When the detector fires at a BB pellet (not a fly), it **misrepresents** because BBs are not what the mechanism was *designed* to detect. The content isn’t disjunctive ("fly or BB") because BBs played no role in the mechanism’s evolutionary history. Only *flies* are the "Normal" cause.  
       - **Key move:** Misrepresentation occurs when the representation is tokened outside its evolutionary "Normal conditions."

     - **Fodor (Asymmetric Dependence):**  
       Content is fixed by **current causal-nomological dependencies**. A symbol "H" means *horse* iff:  
       (1) Horses cause "H" tokens.  
       (2) Non-horses (e.g., cows at night) sometimes cause "H" tokens.  
       (3) **Asymmetric dependence:** The cow-caused "H" tokens *depend* on the horse-caused "H" tokens (if horses stopped causing "H," cow-caused "H"s would likely cease), but *not vice versa*.  
       - **Blocking disjunction:** "H" doesn’t mean *horse or cow* because the cow-cow causation law asymmetrically depends on the horse-"H" law. Misrepresentation (cow → "H") is parasitic on correct representation (horse → "H").  

     - **Comparison:**  
       Millikan **grounds content in history/function**; Fodor grounds it in **current causal structure**. Both block disjunction by privileging *one cause* (the selected function/Normal cause for Millikan; the independent law for Fodor). Fodor’s theory avoids history but requires a robust account of laws/counterfactuals.

  ---

  ### 2. **The Swampman Test**
     - **Millikan’s Verdict:**  
       Swampman has **no intentional states**. Without evolutionary history, there are no "proper functions" or "Normal conditions" to fix content. Even if Swampman behaves identically to a human, its states lack *aboutness*.  
       - *Proponent’s satisfaction?* **Yes, but controversially.** Millikan explicitly bites the bullet: intentionality requires selection history. Swampman is a "mere mock-up" (Millikan, 1996). Her theory prioritizes metaphysical rigor over intuition.  

     - **Fodor’s Verdict:**  
       Swampman **has contentful states**. Its duplicate brain structures enter into current causal-nomological relations identical to a human’s. If "horse" tokens in Swampman asymmetrically depend on horses (not cows), then "horse" means *horse*.  
       - *Proponent’s satisfaction?* **Yes.** Fodor’s anti-historicism delivers the intuitive result: same structure, same causes → same content.  

  ---

  ### 3. **Resolving the Disjunction Problem: Trade-offs**
     | **Theory**       | **Strengths**                          | **Hidden Costs**                                  |
     |------------------|----------------------------------------|--------------------------------------------------|
     | **Millikan**     | • Grounds misrepresentation in biological function (clear for sensory states).<br>• Explains distal content (e.g., "fly" not retinal pattern).<br>• Integrates content with biological norms. | • **Swampman problem:** Denies mentality without history.<br>• **Internalism critique:** Content depends on external history, not current state ("no bearing on the head").<br>• Vague "Normal conditions." |
     | **Fodor**        | • Accommodates Swampman.<br>• Content supervenes on current laws (internalist-friendly).<br>• No appeal to murky evolutionary history. | • **Indeterminacy:** Hard to specify *which* laws are asymmetric (e.g., does "horse" mean *horse* or *horse-shaped-patch*?).<br>• **Natural kinds:** Relies on privileged causal laws (e.g., horse→"H" is "basic"), which may be arbitrary.<br>• Struggles with abstract concepts (e.g., "justice"). |

  ---

  ### 4. **On Balance: Which Theory "Earns Its Keep"?**
     - **Millikan** offers the **more satisfying resolution** to the disjunction problem **for sensory/biological representations**. Her account:  
       - Explains why misrepresentation is *systematic* (deviation from function).  
       - Grounds content in a concrete (though historical) mechanism.  
       - Avoids Fodor’s indeterminacy by anchoring content to evolutionary targets.  
     - **Fodor** better handles **Swampman and internalist intuitions** but struggles to:  
       - Fix distal content without ad hoc privileging of laws.  
       - Explain content beyond simple perceptual symbols.  

     - **The Core Cost:**  
       Millikan’s success against disjunction **requires externalism**—content depends on facts outside the head (history). If you reject externalism (e.g., on grounds that meaning must be accessible to the thinker), this is a fatal flaw. Fodor preserves internalism but at the cost of a less determinate account of content.  

     - **Conclusion:** For *naturalizing* intentionality, **Millikan’s functional-historical approach** is stronger against the disjunction problem but demands a hard externalist commitment. **Fodor’s theory** is more flexible with internalist intuitions but may not fully solve disjunction for complex representations. Swampman starkly reveals the trade-off: embrace history (Millikan) or embrace laws (Fodor), but neither easily reconciles with all intuitions.

  ---

  **Key References:**  
  - Millikan, R. G. (1984). *Language, Thought, and Other Biological Categories*.  
  - Fodor, J. A. (1990). *A Theory of Content and Other Essays*.  
  - Millikan (1996) on Swampman: "On Swampkinds," *Mind & Language*.  
  - Fodor (1994) critique of teleosemantics: *The Elm and the Expert*.
