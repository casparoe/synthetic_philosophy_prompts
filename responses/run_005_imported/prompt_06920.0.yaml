  Ensure the philosophers reference real concepts (e.g., genetic fallacy, mere means) and challenge each other's weaknesses. For instance, Thorne must address why emotions are dismissed if they align with Kantian principles. Voss should grapple with cases where emotions clearly mislead (e.g., implicit biases). 

