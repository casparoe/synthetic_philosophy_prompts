answer: |-
  Here are 10 targeted interview questions with anticipated answers and sharp follow-ups, designed to push beyond the abstract and probe the philosophical & practical tensions in Risk-Weighted Expected Utility (RWEU) theory, keyed to the FTX/EA context:

  1.  **Question:** FTX's implosion suggests a catastrophic failure in applying *any* decision theory. But focusing on the *premise* prevalent in SBF's circle: **"Why is maximizing Expected Value (EV) insufficient or irrational for significant, irreversible bets, even if we accept the probabilities and outcomes?"** How does RWEU formally capture the intuition that risking ruin for higher EV *can* be irrational, without smuggling in standard concave utility?
      *   *Anticipated Answer:* She'll emphasize that EV ignores the *distribution* of risk/uncertainty itself as a source of disutility. RWEU's risk function `ρ` directly weights outcomes based on their "rank" (badness), allowing rational aversion to catastrophic tails even if EV is high.
      *   **Follow-up:** Isn't this functionally similar to having a highly concave utility function for wealth? How does `ρ(p)` doing the work *differ conceptually* from extreme diminishing marginal utility? Is the distinction more than just where we place the mathematical operator?

  2.  **Question:** Critics argue RWEU is descriptively useful but normatively weak – it rationalizes biases like Allais Paradox instead of correcting them. **How do you draw a *normative* line between a "rational risk function" `ρ(p)` and Kahneman & Tversky's probability weighting function `π(p)`, which describes a cognitive bias?**
      *   *Anticipated Answer:* She'll argue `ρ(p)` reflects a *considered attitude* towards uncertainty itself as a fundamental value, consistent with axioms of rational choice under RWEU, while `π(p)` is an error-prone *misperception* of probabilities violating standard axioms. Rationality lies in the coherence of the preference structure, not the shape.
      *   **Follow-up:** But if a subject consistently exhibits Allais preferences *and* passes RWEU coherence tests, how can you tell if it's "rational risk aversion" or "probability distortion bias"? Doesn't RWEU's normative claim rest *entirely* on accepting its specific axioms (like weak independence) as definitionally rational, making the line circular?

  3.  **Question:** **Walk me through a concrete gamble to show `ρ(p)` doing distinct work.** Imagine Option A: 89% chance of $1M, 10% chance of $5M, 1% chance of $0. Option B: 100% chance of $1M. An Allais-type chooser prefers B over A. Now, show how RWEU explains this *without* primarily relying on curvature in the utility function `u(x)`.
      *   *Anticipated Answer:* She'll set `u($0)=0`, `u($1M)=1`, `u($5M)=k>1`. Under EU, preferring B requires extreme concavity making `k` small. Under RWEU (e.g., using a pessimistic `ρ(p)` like Rank-Dependent Utility), she'll show how overweighting the worst outcome (the 1% chance of $0) via `ρ` can generate the preference even with modest or linear `u(x)`.
      *   **Follow-up (Rabin Calibration):** Matthew Rabin showed that for small stakes gambles, EU *requires* extreme, absurd concavity to explain risk aversion. You'd say this proves EU *can't* handle risk aversion rationally, so we need `ρ(p)`. But Uzi Segal & Zvi Safra argue similar "calibration" problems plague *any* theory violating EU's linearity, including RWEU – the absurd risk aversion just manifests differently in the `ρ` function. Does this mean RWEU just *relocates* the calibration problem rather than solving it? How do you escape that trap?

  4.  **Question:** The "money pump" objection is classic: If you violate Independence (like in Allais/RWEU), you can be exploited through a series of choices. **How does RWEU avoid rendering agents dynamically inconsistent and pumpable? Does relying on "resolute choice" (sticking to a prior plan) actually solve the problem or just define it away by fiat?**
      *   *Anticipated Answer:* She'll concede dynamic inconsistency *can* arise but argue rational agents can (and should) be *resolute* – commit to a plan (e.g., "I choose the safe option in Allais situations") and stick to it when later choices arise, avoiding the pump. Resoluteness is part of rational agency.
      *   **Follow-up:** Isn't resoluteness just an *ad hoc* fix? If the agent genuinely prefers B over A at time T1, but when presented with a *sequence* where choosing A at T1 leads to a dominated position at T2, why is it rational to ignore that future consequence at T1? Doesn't this make RWEU rationality depend on arbitrary framing (isolated choice vs. sequence) rather than the underlying outcomes?

  5.  **Question:** SBF seemed to treat EV maximization as a *moral imperative*. **Does RWEU provide a framework where *deliberately* taking a lower-EV bet due to risk aversion isn't just permissible, but can be the *more* rational choice? How does `ρ(p)` encode a value judgment about risk itself being bad?**
      *   *Anticipated Answer:* Absolutely. RWEU explicitly incorporates the disvalue of bearing risk. A sufficiently pessimistic `ρ(p)` makes the risk-weighted utility of a high-EV, high-dispersion bet lower than a safer, lower-EV bet. Rationality requires maximizing *risk-weighted* EU, not raw EV.
      *   **Follow-up:** Doesn't this open the floodgates to justifying almost *any* degree of risk aversion as "rational" via an extreme `ρ(p)`? If an agent has a `ρ(p)` so pessimistic they turn down *any* positive-EV bet with a non-zero chance of loss, is that rational under RWEU, or is there a normative constraint on `ρ`?

  6.  **Question:** **How does RWEU handle "long-termism" arguments common in EA**, where tiny probabilities of astronomical payoffs (e.g., x-risk reduction) dominate the EV calculation? Does a rational `ρ(p)` necessarily downweight these tail risks compared to their raw probability?**
      *   *Anticipated Answer:* It depends on the `ρ` function. A *pessimistic* `ρ` might *overweight* catastrophic tail risks (like x-risk), making them even more salient. An *optimistic* `ρ` might underweight them. RWEU doesn't dictate the direction; it provides a tool to express the attitude.
      *   **Follow-up:** Doesn't this highlight a core tension? EA long-termism relies on *unmodified* EV to justify focusing on low-probability/high-impact tails. RWEU says rational agents *should* weight these probabilities non-linearly via `ρ(p)`. Doesn't this fundamentally undermine the "EV as moral imperative" stance by showing its probability weighting is arbitrary?

  7.  **Question:** Prospect Theory descriptively uses weighting functions `π(p)` that are inverse-S shaped (overweight low p, underweight mid-high p). **What shape does a "rational" `ρ(p)` typically take in RWEU, and how is its justification *normatively* different from Prospect Theory's descriptive account?**
      *   *Anticipated Answer:* Common "rational" `ρ` shapes include concave (pessimism, overweighting bad outcomes) or convex (optimism). The justification is axiomatic (coherence within RWEU framework) and based on reflection/endorsement of preferences over uncertain prospects, unlike PT's cognitive error explanation.
      *   **Follow-up:** If an agent reflects and genuinely endorses an inverse-S shaped `ρ(p)` (similar to PT's `π(p)`), is that rational under RWEU? If so, how is RWEU providing a *normative correction* rather than just a *rationalization* of descriptively common (and often disadvantageous) biases?

  8.  **Question:** **Could two agents, Alice and Bob, agree perfectly on:**
      *   **All probabilities of all events.**
      *   **The *utility* `u(x)` of every possible outcome `x` (i.e., they value money/outcomes identically).**
      **...but have different risk functions `ρ_A` vs. `ρ_B`, leading them to make *opposite choices* on *every single* non-trivial risky decision they ever face?**
      *   *Anticipated Answer:* Yes, absolutely. This is a core feature. Alice with a concave `ρ` (pessimistic) could always prefer safer options, Bob with a convex `ρ` (optimistic) could always prefer riskier options with the same `u` and probabilities.
      *   **Follow-up (The Permissiveness Problem):** If rationality *only* requires internal coherence of preferences defined by `u` and `ρ`, and imposes no external constraint on `ρ`, doesn't this make RWEU *too* permissive? If Alice and Bob are diametrically opposed on *every* risk, yet both are "rational," what substantive guidance does the theory offer for evaluating decisions like those that led to FTX? Isn't "coherence" too thin a notion of rationality here?

  **Bonus Closing (Reflective):**

  9.  **Question:** Given the FTX catastrophe and the critique of naive EV maximization, **what do you see as the most significant *practical* limitation or potential pitfall in applying RWEU responsibly in real-world, high-stakes domains like finance or philanthropy? How does it guard against its own forms of miscalibration or misuse?**
      *   *(Focuses the conversation back to the real-world context and invites self-reflection on the theory's application)*

  **Key Rationale for Questions:**

  *   **Concrete Distinction (Q3 & F/U):** Forces the demonstration of `ρ`'s unique role, then immediately challenges it with the Rabin/Safra-Segal calibration critique, demanding a defense of RWEU's core claim over EU.
  *   **Dynamic Consistency/Money Pump (Q4 & F/U):** Targets a major theoretical objection, probes the adequacy of "resolute choice" as a solution, and questions whether it addresses the core conflict.
  *   **Rational vs. Bias Line (Q2, Q7 F/U):** Directly confronts the "same math, different label" concern, demanding a clear normative demarcation and probing whether RWEU can actually correct biases or just rationalizes them.
  *   **Permissiveness Problem (Q8 & F/U):** Highlights the potential normative emptiness of RWEU if `ρ` is unconstrained, directly challenging its usefulness for evaluating real-world rationality claims like those in the EA/FTX debate.
  *   **FTX/EA Context (Q1, Q6 F/U):** Grounds the abstract theory in the specific case study motivating the piece.
  *   **Closing Practicality (Q9):** Ends on application and self-awareness.

  **Preparation Tip:** Before the interview, briefly skim the SEP entries on RWEU (Rank-Dependent Utility, Disappointment Aversion, etc.), the Rabin calibration theorem, the basic Allais Paradox, and the money pump argument. Knowing these concepts at a surface level will help you immediately recognize the points she's making and deliver sharp follow-ups. Good luck!
