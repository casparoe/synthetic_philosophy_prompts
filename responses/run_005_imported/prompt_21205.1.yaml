  The chimeric-figures test is key here. For the duality view, explaining why patients don't report two competing percepts is tricky. For the switch model, explaining parallel visual search is awkward. The cross-cuing point about hemispheres "teaching" each other feels especially damning for the switch model—it implies coordination deeper than mere switching.

