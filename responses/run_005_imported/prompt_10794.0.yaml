  I've read that Aumann's agreement theorem proves that two Bayesian-rational people can never knowingly disagree about a matter of fact. Since two rational agents surely can't simply start out assigning different probabilities to the same hypothesis for no reason, doesn't this mean the "common prior assumption" invoked in these models is really just a restatement of what rationality already requires, rather than the substantive, often-contested assumption game theorists treat it as?
