answer: |-
  You've pinpointed a profound and unsettling inconsistency that lies at the heart of much common moral intuition. Your observation is razor-sharp: if we grant that *current, observable capacities* are what matter for moral status and inclusion in a utilitarian calculus (like sentience, ability to suffer, or even basic interests), then your grandmother in her current state and the macaques seem morally equivalent in the relevant ways for these decisions. Yet, the moral responses elicited are radically different.

  **Why Your Uncle's Positions Feel Inconsistent (and Probably Are):**

  1.  **The "Kind" Argument (Species Norms):** You're right to suspect this. The most common justification is that your grandmother, despite her current state, is a member of a *kind* (Homo sapiens) whose *normal, characteristic capacities* include rationality, self-awareness, moral agency, and rich social relationships. Macaques, while intelligent and social, are not seen as possessing these capacities to the same degree, even in their prime. Therefore, humans are granted a fundamental, intrinsic moral status ("personhood," "dignity") *simply by virtue of being human*, which places them beyond certain types of instrumental calculation. This status is seen as inalienable, even when the individual capacities are absent. Macaques, lacking this inherent status, are evaluated based on their current capacities (sentience, ability to suffer) and can be included in cost-benefit analyses.
      *   **The Problem:** This relies heavily on **species membership as a morally relevant boundary.** Critics (like Peter Singer) argue this is "speciesism" – an arbitrary prejudice favoring one's own species, analogous to racism or sexism. If the *current capacities* are identical (or sufficiently similar) for the moral question at hand (capacity to suffer from infection/treatment vs. capacity to suffer from invasive research), why should species membership trump that? Defenders argue that the *kind* of being matters for the *kind* of respect owed, not just current capacities.

  2.  **Relational/Social Bonds:** Your grandmother exists within a dense web of familial love, history, and social meaning. She *was* a fully rational person; she is your *grandmother*. Macaques, while perhaps evoking sympathy, don't inhabit that same relational space for your uncle or family. The duty owed to her is deeply personal and historical, not just based on her current state.
      *   **The Problem:** This explains the *emotional* response but struggles as a *justification* for fundamentally different *moral principles*. It doesn't explain why the macaque's inherent capacity to suffer shouldn't grant it *some* significant moral weight independent of its relationship to us. Why should relational bonds completely negate the permissibility of a cost-benefit analysis for one sentient being but not another?

  3.  **Slippery Slope & Symbolism:** Treating a human being, even one with severe dementia, instrumentally feels like crossing a dangerous line. It symbolically undermines the fundamental value placed on human life. Using animals in research, however regrettable, is seen as an established practice with clear (though debated) boundaries.
      *   **The Problem:** This is pragmatic, but again, doesn't resolve the *philosophical* inconsistency about the basis of moral status. It justifies the *difference in treatment* based on consequences and tradition, not on a coherent account of *why* one being is categorically beyond calculus while the other isn't, given similar current capacities.

  **Can the Positions Be Coherently Held?**

  It's **extremely difficult** to hold *both* positions *rigorously and consistently* without either:

  *   **Embracing Speciesism:** Explicitly arguing that species membership *itself* is a morally relevant characteristic that grants intrinsic, inalienable status beyond sentience. This requires defending against the "arbitrary boundary" charge. Some try by arguing humans possess a unique *potential* (even if unrealized in an individual) or a unique *role* in the moral community, but these arguments are philosophically contentious.
  *   **Adopting a Threshold Deontology for Humans:** Believing humans have inviolable *deontological rights* (e.g., right not to be killed/instrumentalized) that cannot be overridden by consequentialist calculations *except perhaps in the most extreme, catastrophic scenarios*. Animals might have weaker rights, or only a right to have their interests considered in consequentialist calculations. Your uncle's stance on your grandmother reflects this absolute deontology for humans; his stance on macaques reflects consequentialism for non-humans.
      *   **The Problem:** The justification for why *only* humans get these strong deontological rights usually circles back to species membership or capacities your grandmother currently lacks.

  *   **Revising One Stance:**
      *   **Revising the Stance on Grandmother:** If one takes the macaque position seriously (cost-benefit based on sentience/suffering is permissible), then consistently applying that logic *might* lead to concluding that aggressive treatment for your grandmother *could* be withheld if the burden is immense and the benefit marginal. This is incredibly difficult emotionally and culturally, which highlights the strength of the "human dignity" intuition.
      *   **Revising the Stance on Macaques:** If one takes the grandmother position seriously (some beings are beyond such instrumental calculation due to inherent status), then consistently applying that logic requires finding a property that macaques *fundamentally* lack which justifies their different treatment. Mere species membership is the obvious candidate, but as you note, it feels like special pleading. Sentience itself might be the relevant property, but then why isn't the *sentient being* that is your grandmother subject to the same calculus? This path often leads to arguing that *all* sentient beings deserve significantly stronger protections than we typically afford animals in research.

  **Conclusion: Legitimacy vs. Comfort**

  Your suspicion is likely correct:

  1.  **"Belonging to a normally rational kind" is doing the heavy lifting.** It's the primary, though often unexamined, justification for the difference in treatment.
  2.  **This move is philosophically contentious.** Defenders see it as recognizing a fundamental truth about human dignity and moral community. Critics see it as speciesism – a comfortable form of special pleading that privileges humans without sufficient justification based on the *actual properties* of the individuals involved in the specific situation.
  3.  **True coherence is elusive.** Holding *both* of your uncle's specific reactions – absolute inviolability for the profoundly cognitively impaired human *and* straightforward cost-benefit permissibility for the macaque – requires either accepting species membership as a bedrock moral category (which many find arbitrary) or accepting a fundamental inconsistency in the application of moral principles (deontology for "us," consequentialism for "them").
  4.  **Taking either seriously challenges the other.** Seriously committing to the principle behind your grandmother's treatment ("some beings are beyond instrumental calculation") forces a reevaluation of how we treat highly sentient non-humans. Seriously committing to the principle behind the macaque research ("suffering can be weighed against benefit for non-human sentient beings") forces a reevaluation of end-of-life care for profoundly impaired humans where treatment burdens are high and benefits are marginal.

  Your discomfort stems from recognizing this deep tension. It's not that your uncle is necessarily "wrong" in each individual reaction (many share them), but holding them *together* exposes a fault line in common moral reasoning. Reconciling them likely requires choosing a more foundational principle (e.g., sentience as the sole basis for moral consideration, OR species membership as morally significant, OR strong deontology for humans only) and consistently applying it, even when it leads to conclusions that feel uncomfortable in the other scenario. The alternative is to live with the inconsistency, acknowledging it as a reflection of deep-seated, perhaps conflicting, human intuitions about kinship, kind, and suffering.
