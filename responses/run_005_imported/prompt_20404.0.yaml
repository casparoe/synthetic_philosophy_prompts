answer: |-
  This situation touches on fundamental questions about technical leadership, ethical consistency, and psychological safety in engineering teams. Let's dissect it systematically:

  ### 1. **Validity vs. Credibility: The Core Tension**
     - **The Feedback Itself** is objectively valid: Untested customer-facing code *is* irresponsible and outage-prone. The technical principle is sound regardless of the source.
     - **The Critic's Credibility** is compromised: By routinely violating the same principle elsewhere, the senior engineer undermines their moral authority. This creates cognitive dissonance for observers ("Why should we adhere to standards you ignore?").

  ### 2. **Stakes Matter, But Principles Shouldn't Fracture**
     - **Lower-stakes contexts (e.g., internal tools)** *do* warrant different risk tolerances. Quick fixes might be acceptable if failures cause minimal disruption.
     - **The Hypocrisy Problem:** If the senior engineer *never* writes tests for internal tools while demanding them for customer code, they signal that standards are situational—not principled. This erodes trust in *all* their technical judgments. Consistency demonstrates conviction; inconsistency suggests arbitrariness.

  ### 3. **Consequences of the Hypocrisy**
     - **If the teammate discovers the double standard:**
       - **Valid Reaction:** They might dismiss the feedback as hypocritical, damaging psychological safety. The valid point about testing risks being discarded with the critic's credibility.
       - **Invalid Reaction:** Using the hypocrisy to justify *ignoring the substance* of the feedback ("Since he doesn’t test, I don’t need to either"). This conflates two issues: the critic's flaw doesn’t negate the technical truth.
     - **Team Dynamics:** Silent observers (like you) experience moral distress. This breeds resentment and normalizes "rules for thee, not for me."

  ### 4. **Navigating the Situation Constructively**
     - **For You (as an observer):**
       - **Address the Feedback Separately:** Support the *principle* ("Tests *are* critical for customer features") without endorsing the *delivery*.
       - **Engage the Senior Engineer Privately:** Frame it as a leadership opportunity: *"Your point about tests was spot-on. To champion this standard, could we also revisit testing expectations for internal tools? Consistency would help the team embrace this."* Focus on elevating practices, not accusing.
       - **Advocate for Process:** Push for documented standards (e.g., "All production services require tests; internal tools *strongly encouraged*"). This depersonalizes expectations.
     
     - **If the Teammate Reacts Poorly:** Redirect to the principle: *"Whether or not he tests internal tools, untested customer code *is* risky. Let’s focus on making this robust."*

  ### 5. **The Bigger Picture: Leadership & Psychological Safety**
     - **Effective technical leadership requires:**  
       - **Consistency:** Standards applied proportionally but predictably.  
       - **Self-Accountability:** Publicly acknowledging one’s own lapses ("I cut corners on internal tools sometimes, but that’s why I’m adamant we don’t do it here").  
       - **Constructive Delivery:** Bluntness without context feels punitive, not instructive.  
     - **Hypocrisy isn’t just "human" – it’s corrosive:** It signals that rules are negotiable based on seniority, not technical necessity. This erodes team cohesion faster than any untested feature.

  ### Key Takeaway:
  **The validity of the feedback and the critic’s right to deliver it are distinct issues.** The technical point stands, but the senior engineer’s inconsistency damages their influence and the team’s culture. Addressing this requires:  
  1. Upholding the principle (tests for customer code).  
  2. Challenging the double standard privately to protect team trust.  
  3. Formalizing standards to remove personal arbitrariness.  

  Truth without integrity is weaponized; integrity without truth is virtue signaling. Great engineering cultures demand both.
