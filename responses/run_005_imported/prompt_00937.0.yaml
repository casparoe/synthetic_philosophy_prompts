answer: |-
  This is a superb case study for probing originalism's nuances. Douglass's reversal offers rich implications for the intent/public meaning distinction:

  **Key Implications for Modern Originalism:**

  1.  **The Primacy of Text vs. the Weight of Context:** Douglass's initial position (1849-1851) prioritized the *contextual understanding* (everyone knew "person held to service" meant "slave") over the *literal text* (absence of "slave/slavery"). His mature position (post-1851) flipped this, arguing the *literal text alone* should control, regardless of overwhelming contemporary understanding. This highlights the core tension: Does "public meaning" reside solely in the semantic meaning of the words at the time, or does it *necessarily* include the shared contextual knowledge that gave those words their *practical legal effect*? Modern public meaning originalists generally argue the latter is crucial.

  2.  **The Problem of Evasion & "Winks and Nods":** The Framers' deliberate use of euphemisms ("person held to service," "other persons," "importation," migration or importation") presents a critical challenge. Douglass's initial view recognized this as a pro-slavery *strategy* – the meaning was clear *despite* the evasion. His mature view treated the evasion as legally *consequential* – the absence of the words meant the Constitution couldn't *sanction* slavery. Modern originalists debate how to handle such "winks and nods." Should courts give effect to the understood but unstated meaning, or strictly enforce the semantic evasion? Douglass's mature position aligns with a very strict textualism that penalizes evasion by denying legal effect to unstated intentions.

  3.  **Intent vs. Meaning in Morally Charged Contexts:** Garrison/Douglass (initial) saw the Framers' *intent* to protect slavery (through structure, clauses, compromises) as inseparable from the document's *meaning*. Douglass (mature) and Spooner argued that only the *semantic meaning of the ratified text* mattered, irrespective of the Framers' hopes or expectations. This directly foreshadows the modern shift from intent-based to public-meaning originalism. Douglass's reversal embodies the argument that "original public meaning" is found in the objective meaning of the words adopted, not the subjective intentions behind them.

  4.  **The Role of Moral Principles in Construction:** While Douglass (mature) argued from the text's silence, his *motivation* was deeply moral. He sought an interpretation that aligned the Constitution with anti-slavery principles. This raises the question: **Is his method purely textualist/originalist, or does it smuggle in natural law through construction?** This is the crux of your final question.

  **Was Douglass's Mature Position Public-Meaning Originalism or Natural Law Textualism?**

  It exhibits elements of both, but leans towards a **Natural Law Canon of Construction expressed in Textualist Terms**:

  *   **Arguments for Public-Meaning Originalism:**
      *   He focused relentlessly on the *words actually used* ("slave" is absent).
      *   He rejected arguments based on Framers' *intentions* or expectations (the "covenant with death" view).
      *   He claimed to be uncovering the document's *true meaning* as ratified.
      *   His argument resembles the modern originalist claim that semantic meaning, not expectations or applications, controls.

  *   **Arguments for Natural Law Textualism:**
      *   **The Driving Force:** His conclusion was fundamentally driven by the moral imperative that the Constitution *could not* sanction slavery. The textual argument was the *means* to reach this morally necessary conclusion. Spooner's influence was profound here.
      *   **The "Properly Construed" Caveat:** Douglass insisted the Constitution, *"properly construed,"* was anti-slavery. This implies an interpretive principle *external* to the text itself – a principle likely rooted in natural law (law cannot sanction inherent evil). The strict literalism was the *tool* demanded by this principle when confronting euphemisms for evil.
      *   **Rejecting Overwhelming Context:** His insistence on ignoring the near-universal contemporary understanding of the clauses as pro-slavery requires a *justification beyond semantic meaning*. That justification was moral: giving effect to that understanding would make the Constitution an instrument of profound injustice, which he believed law (properly understood) could not be. This resembles a natural law presumption against interpreting text to authorize grave injustice unless *explicitly* stated.
      *   **Canon of Construction:** His approach functions like a substantive canon: "Where the text uses evasive language potentially referring to a grave moral evil, but avoids the explicit term, interpret the text as *not* authorizing that evil." This canon serves natural law ends.

  **Conclusion for Your Seminar:**

  Douglass's mature position is best understood as a **hybrid, but fundamentally rooted in Natural Law principles, expressed *through* a radical textualist methodology.** While it uses the *tools* of textual focus and rejection of intent that characterize modern public-meaning originalism, its *engine* was a moral conviction about the nature of law and justice. He employed extreme textual literalism *specifically* as a strategy to defeat the pro-slavery reading demanded by context and intent, driven by the belief that the Constitution *must* be compatible with fundamental human freedom.

  **Teaching Points to Highlight:**

  *   This case vividly illustrates the practical difference between "original intent," "original expected application," and "original public meaning (semantic vs. contextual)."
  *   It exposes the challenge euphemisms and deliberate textual evasion pose for originalism.
  *   It demonstrates how moral and political commitments can shape the *choice* of interpretive methodology (Douglass *adopted* textualism to serve abolition).
  *   It forces the question: Can "original public meaning" ever be truly separated from the moral framework of the interpreter, especially when confronting profound historical injustices embedded in the law? Douglass's journey suggests that even rigorous textualism can be deployed in service of a higher law ideal.
