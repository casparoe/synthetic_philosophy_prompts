  I spent thirty-odd years running a physiology lab before I retired, and these days I've been working my way through the philosophy of medicine for fun -- currently stuck on the naturalism vs normativism debate about disease, Boorse's biostatistical theory on one side, Nordenfelt's line that health judgments are irreducibly value-laden on the other. Trouble is every SEP article and intro paper reaches for the same handful of examples -- homosexuality getting pulled from the DSM, drapetomania, left-handedness back when that got pathologized -- and answering those doesn't really test wether I understand the theories, they're too easy. Could you give me a condition, ideally something more obscure or contemporary that doesn't turn up in every survey piece, where Boorse's theory and a normativist account would actually spit out different verdicts on whether it counts as a disease? Walk me through the reasoning each side uses to land on it's verdict, and since I spent my career treating "function" as a purely mechanistic notion, flag for me where exactly Boorse's supposedly value-free version of it might be smuggling in something normative after all. I want a case borderline enough to make both camps a bit uncomfortable, not a softball planted for one side to knock down.
