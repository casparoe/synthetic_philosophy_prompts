prompt: |-
  So in my proof theory / phil of math seminar we've been going down this rabbit hole about the consistency of PA and ZFC that's been bugging me for weeks now. I get the basic statement of Gödel's second incompleteness theorem - that PA can't prove Con(PA) if PA is actually consistent - but I don't really have a gut feel for why this is supposed to be *worrying* rather than just a neat technical curiosity. Like, Gentzen proved Con(PA) using transfinite induction up to epsilon_0 in a system that doesn't have full induction below epsilon_0 - so we do have "proofs" of PA's consistency, they just live in systems that aren't obviously weaker than PA itself. My professor mentioned this creates a regress: any consistency proof for a system S has to happen in some system S' which needs its own consistency proof, and there's no non-circular place to stand where your certainty isn't borrowed from somewhere else. I also keep thinking about that Nelson episode (his attempted inconsistency proof for PA that turned out to have a bug in it) - if someone actually did find a hidden contradiction buried in some exotic derivation, would it even touch any of the "ordinary" math we do, or could PA/ZFC be inconsistent in some far-off corner while every theorem in a normal textbook stays perfectly fine and untouched?

  Can you give me a more intuitive, less purely-formal explanation of why this regress is a genuine philosophical worry and not just an artifact of the incompleteness machinery, and some sense of whether there's a principled way to get off the regress or whether we're basically stuck living with it?
