prompt: |-
  I'm working on a piece about the boundary between astrology and astronomy in the early modern period, and I keep running into this factoid that gets tossed around as fun trivia — "even Kepler cast horoscopes!" — like its just proof that even geniuses have blind spots, or that he only did it because the astronomy gig didn't pay enough on its own. But a professor friend of mine pointed me toward some of what he actually wrote on the subject (there's a treatise called Tertius Interveniens, I think, where hes positioning himself between the credulous astrologers on one side and the people who want to chuck the whole practice out on the other), and it sounds like his real position was a lot weirder and more specific than "secret believer" or "cynical grifter." From what I can tell he threw out most of the standard machinery — the zodiac signs, the houses, fixed planetary rulerships — but kept insisting there was something physically real about the angles between planets (aspects, I guess is the term), and he tied this to his whole harmony-of-the-spheres, musical-ratio obsession from Harmonices Mundi.

  Could you walk me through what exactly he was keeping versus throwing out, and more importantly, what his actual reasoning was for why aspects specifically could plausibly affect things like weather or a person's temperament, given that he'd already rejected the rest of the astrological toolkit as bunk? I'm trying to figure out whether this was a genuinely principled position that followed from his other scientific and metaphysical commitments (something about geometric archetypes imprinted on the soul, if I'm remembering right) or whether it was more of an inconsistent compromise he backed into for professional and financial reasons. Happy to hear it's a bit of both — I just want something with more texture than the "quirky genius" version of this story that's out there.
