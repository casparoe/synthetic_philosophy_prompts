  Your initial check (pure-vs-pure) is necessary but **insufficient**. **Always check for domination by mixed strategies** before concluding that IESDS cannot reduce the game. Failure to do so may leave dominated strategies in the game, leading to incorrect analysis of equilibria or outcomes. Implement the full IESDS procedure to ensure the game is fully reduced.
