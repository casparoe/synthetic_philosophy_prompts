  3. **Marriage Proposal**: One partner needs a grand gesture of trust, like giving up something valuable, believing the other will reciprocate later when it's inconvenient. This could highlight personal relationships and irrational commitments.

  4. **First Contact**: An alien or AI requires a human to perform an action that only makes sense if they follow through later when there's no immediate benefit. This allows creative sci-fi elements and avoids real-world checks.

  The first contact idea seems strong. It’s original and fits the requirement. The alien can have a way to detect "temporal integrity" or inherent honesty, not through technology but through an innate sense. The human needs urgent help (like saving their community), and the alien provides it only if they’re sure the human will fulfill the promise later when it’s costly.

  Character names: The human could be Elara, the alien entity called the Weaver. The setting: a dying colony on a harsh planet. The bargain: Elara must promise to return a part of the planet's core, which is sacred to the aliens, after using it to save her people. Later, returning it might doom the colony, making it irrational to follow through.

  Structure the story: Start with Elara's desperate plea. The Weaver presents the deal, emphasizing the paradox. Elara agrees, knowing she’ll keep her word. Later, she faces the dilemma and follows through. The colony survives another way, showing that her integrity leads to unforeseen benefits.

  Ensure the alien’s detection method isn’t technological. Maybe the Weaver perceives time non-linearly or senses moral fiber directly. This avoids reputation systems and stays true to Parfit’s point.

  After the story, explain the Hitchhiker beat: The Weaver’s ability to detect Elara’s inherent trait (temporal integrity) ensures only those who’ll fulfill the promise get help, even when it’s against their immediate interest. This mirrors the driver picking only those who’d pay despite no incentive.
answer: |-
  ## The Weaver's Bargain

  The air in the chamber tasted of ozone and ancient dust. Elara’s suit readouts screamed warnings – thermal overload imminent, life support at 12%. Outside the alien spire, the sun-scorched plains of Veridian III baked her stranded crawler, and her dying colony. Inside, the entity known only as the Weaver pulsed with soft, internal light, its crystalline form shifting like frozen smoke.

  "Help us," Elara rasped, the translator bead at her throat vibrating. "The geothermal tap… it failed. Without stable power, the habitat domes collapse in days. We need the Corestone fragment. Just a sliver. To reignite our tap."

  The Weaver’s light dimmed. A complex series of chimes resonated through the chamber. *Understood. Thermal collapse imminent. Probability of colony survival without intervention: 3.7%.*

  Elara’s heart hammered against her ribs. "Then you’ll help?"

  *Affirmative. Fragment transfer possible.* A tendril of light extended, coalescing into a shimmering, fist-sized shard hovering before her. It hummed with contained power. *But a bargain is required.*

  "Anything. Name it."

  *The fragment is lent, not given. It is… vital. Its absence weakens the Spire’s integrity over time. You must return it. Exactly one standard year from now. To this place.*

  Elara stared. "Return it? But… it powers our colony! Once it’s integrated, removing it would cause another catastrophic failure! We’d be back where we started, probably worse!"

  *Precisely.* The Weaver’s light pulsed, slow and deliberate. *The fragment is yours to use. For one year. It will save your people now. But to receive it, you must bind yourself to return it. Knowing the cost it will later impose.*

  Cold dread washed over Elara. "So… you only give it to me if you believe I’ll bring it back? Even when bringing it back dooms us all over again? That’s insane! Why would anyone agree to that?"

  *Why indeed?* The Weaver chimed, a sound like dry leaves skittering on stone. *A purely rational calculus dictates: accept the fragment now, secure your survival, integrate it fully. When the year ends, the rational act is to keep it. The survival benefit is already realized; returning it offers only destruction. Therefore, a purely rational entity would promise to return it, knowing they intend to break that promise, to secure the fragment now.*

  Elara felt the suffocating logic of it. "But you… you wouldn’t give it to someone who thought that way. You’d know."

  *Correct.* The Weaver’s light intensified, seeming to peer *into* her, not just at her. *My perception… it discerns temporal integrity. Not intention in the moment, but the immutable shape of a being’s relationship with consequence. I perceive those for whom a promise, once given, becomes a fixed point in their personal timeline, regardless of shifting advantage. The cost of breaking it is not external penalty, but internal fracture. They cannot not fulfill it. It is irrational by survival metrics. Yet…*

  The Weaver paused. The hovering fragment glowed brighter. *It is the only currency I accept. Only those bound by such irrational fidelity receive aid. For only they will return what they borrow, even when the return burns them. They are the only ones whose promises have weight across time. So. Elara of Veridian III. Do you bind yourself? Knowing the future cost? Knowing that to be the person who receives this salvation, you must also be the person who will later enact your own potential ruin?*

  Elara looked at the fragment – salvation for her children, her friends, the fragile biosphere under the cracking domes. Then she looked into the Weaver’s impossible, knowing light. She saw the brutal logic trap. To be saved, she had to be the kind of person who would willingly walk back into the fire later. There was no trick, no loophole. Only this terrible, binding truth about who she fundamentally *was*.

  Her voice, when it came, was clear. "I bind myself. I will return the fragment. In one year."

  The Weaver’s light flared, warm and approving. The fragment floated gently into her outstretched hands. *Salvation granted, Keeper of Promises.*

  ***

  The year was the hardest Veridian III had ever known. The Corestone fragment worked miracles. The geothermal tap roared back to life. Crops flourished. Children laughed under repaired, sturdy domes. Elara led them, the hero who had wrested life from the jaws of the desert.

  As the year’s end neared, the arguments were fierce, logical, and devastating. "It’s suicide, Elara!" her chief engineer pleaded. "The tap is calibrated to the fragment now. Removing it *will* cause a cascading failure. We might not recover this time!" The colony council voted unanimously to defy the Weaver. "It’s alien logic! Our survival comes first!" Survival. The rational choice.

  Elara spent the last night walking the verdant hydroponic aisles, smelling damp earth and growing things, listening to the hum of healthy machinery – all powered by the borrowed light in her hands. She remembered the Weaver’s gaze, seeing the unbreakable thread within her. To break the promise wouldn’t just be betrayal; it would unravel something core to her being, making the woman who saved them a lie. The cost of breaking it *was* internal fracture. She couldn't *not* fulfill it.

  On the appointed day, against all pleas, against all survival instinct, Elara took the humming fragment and walked alone back into the desert, towards the Spire. The airlock cycled shut behind her colony’s horrified silence.

  The Weaver awaited. Elara held out the fragment. "As promised."

  The Weaver retrieved it. The Spire’s hum deepened, stabilised. *Bargain fulfilled, Keeper.*

  A profound silence fell. Elara braced for the news of her colony’s collapse. None came. Hours later, her comm crackled. It was the chief engineer, voice thick with awe. "Elara… the tap… it didn’t fail. Not completely. It stabilized at 65% output. It’s… tight, but manageable. We can survive on this. How…?"

  The Weaver chimed softly. *Integrity resonates, Keeper. The Spire… appreciates fidelity. A minor recalibration was possible upon the fragment’s return. Your people will endure. Because you were the one who could be trusted to bring it back, even into the fire. The rational choice for the moment would have doomed you all in the end. Your irrational fidelity created a different path.*

  Elara sank to the cool crystal floor, trembling not with fear, but with the profound, terrifying weight of the paradox. She was alive, her colony lived, precisely because she was the type of person who would have walked willingly into destruction to keep her word.

  ---

  **The Hitchhiker Beat:** The Weaver only gives Elara the life-saving Corestone fragment because it can intrinsically perceive her "temporal integrity" – her fundamental, irrational trait of being unable to break a promise, *even when keeping it later offers only self-destruction and defies all rational self-interest*. Elara only receives the *immediate* salvation because the Weaver correctly identifies her as someone who will *later* fulfill the costly bargain when there is zero benefit and only harm in doing so. Her "irrational" commitment to promise-keeping is the paradoxical prerequisite for her (and her colony's) survival, mirroring the desert hitchhiker's need to be inherently honest to get the ride. The Weaver's perception bypasses reputation or checks, targeting an immutable character trait.
