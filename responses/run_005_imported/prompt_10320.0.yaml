  Then Theo shifts to a pure thought experiment - imagining someone born without any bodily sensations. He argues this person would still know they exist, proving self and body are distinct. Naomi counters that just because we can imagine something doesn't make it metaphysically possible. She uses the water/H2O example effectively - conceivability doesn't equal possibility.

