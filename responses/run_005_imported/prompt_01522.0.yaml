  The son's argument that the dad's choices are irrational stems from expected utility theory (EUT), which assumes that decision-makers maximize expected utility based on a consistent utility function for wealth. Under EUT, the dad's choices appear inconsistent, as shown by the following analysis:

  - **First choice (A vs. B)**:  
    - Option A: Guaranteed $1,000, so utility = \(u(1000)\).  
    - Option B: 89% chance of $1,000, 10% chance of $5,000, 1% chance of nothing, so expected utility = \(0.89u(1000) + 0.10u(5000) + 0.01u(0)\). Assuming \(u(0) = 0\), this simplifies to \(0.89u(1000) + 0.10u(5000)\).  
    - Choosing A over B implies:  
      \[
      u(1000) > 0.89u(1000) + 0.10u(5000)
      \]  
      Rearranging:  
      \[
      0.11u(1000) > 0.10u(5000) \implies u(5000) < 1.1u(1000)
      \]  
      This suggests that the utility of $5,000 is less than 1.1 times the utility of $1,000, indicating risk aversion (diminishing marginal utility).

  - **Second choice (C vs. D)**:  
    - Option C: 11% chance of $1,000, otherwise nothing, so expected utility = \(0.11u(1000)\).  
    - Option D: 10% chance of $5,000, otherwise nothing, so expected utility = \(0.10u(5000)\).  
    - Choosing D over C implies:  
      \[
      0.10u(5000) > 0.11u(1000) \implies u(5000) > 1.1u(1000)
      \]  
      This suggests that the utility of $5,000 is greater than 1.1 times the utility of $1,000, which contradicts the first inequality.

  Under EUT, \(u(5000)\) cannot be both less than and greater than \(1.1u(1000)\), so the choices are inconsistent. This is a classic example of the Allais paradox, a well-known violation of EUT's independence axiom, where people's preferences change based on the presence of a sure thing.

  However, this does not mean the dad is irrational. Behavioral economics, particularly prospect theory (developed by Daniel Kahneman and Amos Tversky), explains such choices as common and predictable deviations from EUT due to psychological factors:

  - **Probability weighting**: People don't perceive probabilities linearly. They tend to overweight small probabilities and underweight large ones. In the first choice:
    - The 1% chance of nothing in Option B may be overweighted, making it seem riskier than it is, especially compared to the sure gain in A (this is the "certainty effect").
    - In Option B, the 89% chance of $1,000 may be underweighted, reducing its appeal, while the 10% chance of $5,000 may not be sufficiently attractive to offset the perceived risk.

  - **Second choice context**: With no sure option, both C and D involve high chances of nothing. Here:
    - The 11% chance in C might be underweighted (as it's low but not extremely small), making it seem less attractive.
    - The 10% chance in D might be similarly weighted, but the higher potential gain ($5,000 vs. $1,000) becomes more appealing when there is no safe alternative. This is amplified if small probabilities of large gains are overweighted.

  - **Framing and reference points**: The dad might evaluate the first choice as avoiding a loss (since getting nothing feels like a loss compared to the sure $1,000), but in the second choice, with no reference for a sure gain, he focuses on maximizing potential upside. This aligns with loss aversion, where losses loom larger than gains.

  In essence, the dad's choices can be defended:
  - He was risk-averse when a sure gain was available (avoiding the small risk of nothing for a modest upside).
  - He was risk-seeking in the absence of a sure gain, opting for a slightly lower chance of a larger payoff when both options were risky.

  This behavior is not irrational in a real-world sense; it reflects how humans often make decisions under risk. Studies like the one the dad participated in are designed to explore these patterns, and choices like his are common. The son, as a stats minor, is correct mathematically under EUT but misses the behavioral context—people don't always follow EUT, and that doesn't make them incoherent. The dad should not feel insulted; his choices are a normal response to how the options were framed. For a deeper dive, reading about the Allais paradox or prospect theory (e.g., in Kahneman's "Thinking, Fast and Slow") could help both understand the phenomenon.
