  The user mentions Borges and Ted Chiang as references, so they're aiming for a literary, conceptual horror vibe. The key elements are: airtight internal proof of uncountability, external countability revealed subtly, ambiguous enumerator, and around 1000 words. The dread should stem from the implication, not exposition.

