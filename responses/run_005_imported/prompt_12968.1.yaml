prompt: |-
  Ok so I'm on the allocations committee for a small giving circle -- five of us, pretty EA-brained, funding a handful of grants every quarter. Our bylaws say a grant only gets funded if it clears two bars we vote on seperately -- cost-effectiveness, and whether the org has the capacity to absorb the money well this cycle -- with majority rule on each and funding iff both pass. This quarter, for one borderline grantee, three of us were satisfied on cost-effectiveness and three were satisfied on capacity (not the same three each time), so bar-by-bar voting says fund -- but only two people were actually yes on both bars at once, so a straight gut poll of "fund, yes or no" says don't. Half the committee now wants to scrap bar-by-bar voting as obviously broken and just go with gut polls from now on; the other half thinks the gut poll is the incoherent one and we should stick to voting on the sub-questions. I have this nagging feeling that there's a real name for this in social choice / group-agency theory, but googling around didn't tell me what to actually *do* about it. Can you write the memo I'd circulate before next week's meeting -- an actual recommendation for which procedure we adopt going forward (or a third option, if you think both of ours are broken), argued well enough to convince whichever half it doesn't side with, not just admire the paradox?
reasoning: |-
  We are facing a procedural dilemma: should we continue with our current bar-by-bar voting system or switch to a holistic "gut poll" for grant funding decisions? The recent case revealed a discrepancy: under bar-by-bar voting, the grant passed (majority yes on cost-effectiveness and majority yes on capacity), but in a hypothetical holistic vote, it would have failed (only two out of five voted yes on both criteria). 

  I propose we stick with the bar-by-bar system but with a modification: require that each bar be passed by a supermajority (e.g., 4 out of 5) to fund a grant. Alternatively, we could introduce a holistic vote as a tiebreaker or require that at least one member must be in the majority on both bars. However, I believe the supermajority requirement on each bar is the most straightforward and robust solution.

  Below, I outline the reasoning and address the concerns of both sides.

  ---

  **MEMORANDUM**

  **To:** Allocations Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Grant Funding Voting Procedure  

  ### Background
  Our current voting procedure requires a grant to pass two separate bars (cost-effectiveness and capacity to absorb funds) by majority vote. A grant is funded only if both bars pass. In the recent case, Grant X passed both bars (3 votes for cost-effectiveness, 3 for capacity) but only two members were satisfied on both criteria. This led to a debate: half the committee argues that a holistic vote (a single "fund/don't fund" vote) would have rejected Grant X, and thus our bar-by-bar system is flawed. The other half argues that the holistic vote is inconsistent because it ignores the structure of our criteria.

  ### The Problem: A Social Choice Perspective
  This situation is an example of a **preference aggregation problem**. Our two criteria are designed to be independent conditions for funding. The bar-by-bar system is a **conjunctive rule**: both conditions must be satisfied. The holistic vote, by contrast, aggregates preferences over the entire proposal without decomposing the criteria. 

  The conflict arises because the holistic vote may capture unstated interdependencies (e.g., "I won't fund even if cost-effective if capacity is weak") but at the cost of transparency and structure. The bar-by-bar system ensures each criterion is explicitly considered, but it can lead to funding a grant that no majority would endorse holistically if the majorities on the criteria are disjoint.

  ### Analysis of the Two Approaches
  1. **Bar-by-Bar Voting (Current System)**  
     - **Pros:** Transparent, forces explicit consideration of each criterion, aligns with our bylaws (which reflect the intent that both criteria are necessary).  
     - **Cons:** May fund grants that lack holistic support (as seen in the recent case).  

  2. **Holistic Voting**  
     - **Pros:** Reflects overall judgment, avoids "mechanical" outcomes.  
     - **Cons:** Lacks transparency on why a grant fails (was it cost-effectiveness, capacity, or both?), and may lead to inconsistent application of criteria. It also ignores the structure of our funding requirements: both criteria are meant to be necessary.  

  ### Recommendation: Modified Bar-by-Bar with Supermajority
  I propose we retain the bar-by-bar system but require a **supermajority (4 out of 5 votes) on each bar** to fund a grant. This addresses the recent case:  
  - In the recent vote, Grant X would have failed under a supermajority requirement (only 3 votes on each bar, not 4).  
  - A supermajority ensures broader consensus on each criterion, reducing the chance of a grant passing with disjoint majorities.  
  - It maintains the structure of our criteria (both must be passed) while increasing the bar for funding, which is appropriate given our small size and the importance of alignment.  

  **Why not switch to holistic voting?**  
  - Holistic voting undermines the purpose of having two distinct criteria. It risks conflating the two and may lead to grants being rejected for reasons unrelated to the criteria (e.g., personal bias).  
  - Our bylaws were designed to ensure grants are cost-effective **and** have the capacity to absorb funds. Holistic voting does not enforce this structure.  

  **Why not require at least one member to vote yes on both?**  
  - This would be an ad hoc rule and might not scale. It also doesn't guarantee broad support.  

  **Why supermajority?**  
  - Given our small committee (5 members), a 4-vote supermajority ensures that at least one member overlaps in the majority for both criteria (by the pigeonhole principle). This avoids the disjoint majority problem.  
  - It raises the bar for funding, which is prudent for borderline cases.  

  ### Addressing Counterarguments
  - **"But the holistic vote better reflects our true preferences!"**  
    - True, but it does so at the cost of structured decision-making. We chose the two-bar system for a reason: to prevent funding grants that excel on one criterion but fail on the other. The supermajority modification fixes the flaw without abandoning the structure.  

  - **"What if a grant passes both bars by majority but not supermajority, and we all agree holistically to fund it?"**  
    - This is unlikely because if a grant has broad support on each criterion, it should get at least 4 votes on each. If it doesn’t, it’s borderline and should be scrutinized. We can allow a holistic vote to override a supermajority failure only if unanimous (5/5). But I recommend avoiding overrides to keep the system clean.  

  ### Implementation
  I propose we amend our voting procedure as follows:  
  1. Votes are taken separately on cost-effectiveness and capacity.  
  2. A grant is funded only if it receives at least 4 "yes" votes on cost-effectiveness **and** at least 4 "yes" votes on capacity.  
  3. If a grant fails under this rule but there is strong sentiment to fund, we can discuss and re-vote (with the same supermajority rule) only if new information emerges.  

  This change requires a bylaws amendment. I recommend we adopt it for the next funding cycle.  

  ### Conclusion
  The bar-by-bar system is fundamentally sound but vulnerable to disjoint majorities in a small committee. A supermajority requirement fixes this while preserving the integrity of our two criteria. I urge the committee to adopt this modification.  

  Let’s discuss at the meeting.
answer: |-
  **MEMORANDUM**  
  **To:** Allocations Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Resolving Our Voting Paradox: A Proposal for Structured Holistic Review  

  ### The Core Issue  
  Our recent deadlock reveals a classic problem in group decision theory: the **separability paradox** (or "referendum paradox"). This occurs when voting separately on necessary conditions (like our two bars) leads to outcomes misaligned with holistic preferences. Here’s why:  
  - **Bar-by-bar voting** assumes criteria are independent. But in practice, members’ judgments on cost-effectiveness and capacity may interact (e.g., "I’d only fund if both are strong").  
  - **Gut polls** capture holistic intent but discard structure, risking inconsistent standards and underdefined reasoning.  

  Neither system is "broken," but both have flaws. Crucially, **abandoning structure entirely invites bias and ambiguity**. Yet rigid separability ignores how humans weigh trade-offs.  

  ### Recommendation: Hybrid Voting with a "Double Majority" Rule  
  I propose a **third option** blending both approaches:  
  1. **Vote on both bars separately** (retaining structured criteria).  
  2. **Add a binding holistic vote** for grants that pass both bars.  
  3. **Fund only if:**  
     - A majority approves **each bar** (status quo), **and**  
     - A majority approves the **holistic "fund" vote**.  

  *Example applied to last quarter:*  
  - Grant passes cost-effectiveness (3–2) and capacity (3–2).  
  - *Then* run a holistic vote: "Fund this grant, given it passed both bars?"  
  - Only 2/5 voted holistically "yes," so it fails.  

  ### Why This Solves the Problem  
  1. **Preserves structure** while respecting holistic judgment:  
     - Bars ensure explicit focus on core criteria (avoiding "gut-only" vagueness).  
     - The holistic vote catches cases where fragmented majorities misrepresent true support.  
  2. **Closes the separability loophole** without overhauling bylaws.  
  3. **Scalable and transparent:** Documents *why* grants fail (e.g., "Failed holistic vote despite passing bars").  

  ### Addressing Counterarguments  
  #### *"Why not stick with bar-by-bar voting?"*  
  Bar-by-bar is defensible if criteria are truly independent. But our recent split vote proves they’re not: members implicitly weigh interactions (e.g., "Is moderate cost-effectiveness *worth it* given weak capacity?"). Ignoring this risks funding grants nobody fully endorses—**undermining the intent of our bylaws**.  

  #### *"Why not switch entirely to gut polls?"*  
  Holistic voting alone sacrifices rigor. Without separate bars:  
  - A grant could fund despite failing one criterion (e.g., terrible capacity), violating our bylaws.  
  - Debates become muddled ("I voted no because of capacity, but others voted no for cost-effectiveness—was either truly decisive?").  
  - **Result:** Less accountable, more arbitrary decisions.  

  #### *"Doesn’t adding a third vote overcomplicate things?"*  
  It adds one step but prevents messy post-hoc disputes. For comparison:  
  - **Today:** 2 votes.  
  - **Proposal:** 3 votes (cost-effectiveness → capacity → holistic), but only for grants passing the first two bars.  
  In practice, borderline grants (like ours) are rare—we’ll seldom need all three votes.  

  ### Why Not Other Fixes?  
  - **Supermajority per bar?** (e.g., 4/5 per bar)  
    Overcorrects: A grant with 4–1 support on cost-effectiveness and 3–2 on capacity would fail, even if all 5 holistically support it.  
  - **Require overlap in bar approvals?** (e.g., "At least one ‘yes’ voter must support both bars")  
    Too fragile: One member’s shift could swing outcomes arbitrarily.  

  ### Implementation  
  1. **Tweak bylaws** to:  
     > "A grant is funded only if approved by majority vote on cost-effectiveness, majority on capacity, *and* majority on a final holistic vote."  
  2. **Process:**  
     - Discuss all grants, emphasizing interactions between criteria (e.g., "How does capacity affect your cost-effectiveness view?").  
     - Vote on bars first. If both pass, *then* vote holistically: "Should we fund this grant, given its performance on both criteria?"  

  ### Conclusion  
  Our goal isn’t just consistency—it’s funding *better grants*. The hybrid system:  
  - Retains the **rigor of bar-by-bar voting**,  
  - Adds a **safety valve for holistic judgment**,  
  - Avoids both the separability paradox *and* the ambiguity of gut polls.  

  This isn’t a compromise—it’s an upgrade. Let’s vote to adopt this for next quarter.  

  **Appendices**  
  - *Social choice context:* The separability paradox is discussed in Dietrich & List (2013) on "preference aggregation under constraints."  
  - *Precedent:* Similar hybrid models are used by WHO funding committees (e.g., separate technical scores + holistic programmatic review).  

  ---  
  **Final note:** This passes the "coffee test." If three colleagues separately approve a coffee’s taste, price, and ethical sourcing—but only two would actually buy it—you wouldn’t force the group to purchase it. Our grants deserve the same coherence.
