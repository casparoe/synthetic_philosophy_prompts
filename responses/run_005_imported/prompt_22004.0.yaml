  Had a long argument with my buddy last night about betting and investing strategy and I honestly can't drop it. He's really into the Kelly criterion and kept insisting theres basically a mathematical proof that full Kelly makes you richer than any other strategy in the long run, so betting half-Kelly like i do (to avoid the brutal drawdowns) is just irrational and leaving money on the table. He also kept bringing up this 'geometric rationality' stuff, saying it proves expected-value reasoning is basically flawed once you're making repeated bets, and that growth-rate reasoning is the only actually rational approach. Is he right that this is settled math and I'm just being irrational, or is he overselling what the Kelly result actually shows?
