answer: |-
  You're absolutely on the right track, and Bentham's unpublished work is **perfect** for your scene. Your grasp of the core argument is excellent. Let's break it down:

  1.  **The Core Argument: Disgust ≠ Harm ≠ Justification for Law:**
      *   **Yes, you've nailed it.** Bentham's primary argument against the sodomy laws (particularly in "Offences Against One's Self: Paederasty" written c. 1785) is precisely that they punish acts based purely on "antipathy" (disgust, prejudice, religious condemnation) rather than any demonstrable harm caused by the Principle of Utility.
      *   He systematically dismantles the *claimed* harms:
          *   **Population:** Argues it has negligible impact compared to other factors (wars, disease, celibacy).
          *   **Health:** Dismisses disease arguments (diseases spread via other acts too; the act itself isn't inherently diseased).
          *   **Weakening Men/Military:** Finds this absurd and unsupported.
          *   **Seduction/Corruption:** Argues it's no more inherently seductive than other consensual acts; focuses on consent and age (distinguishing clearly between consensual acts between adults and non-consensual acts or acts with minors, which *do* cause harm).
          *   **"Against Nature":** Explicitly rejects this as a valid legal principle, calling it vague and rooted in prejudice/sympathy-antipathy. Asks "what *is* natural?" and points to its prevalence historically/cross-culturally.
      *   **His Conclusion:** Since the act, when consensual and between adults, causes no primary harm (pain) to the participants or to others, and may even produce pleasure (gain) for them, punishing it inflicts **gratuitous pain** (the harm of punishment itself: execution, imprisonment, social ruin) without preventing any countervailing harm. This is the *opposite* of utility – it's pure **mischief** generated by the law itself, driven solely by irrational antipathy.

  2.  **Bentham's Personal Disgust & Its Source:**
      *   **Yes, he explicitly confesses this, and it's crucial.** He writes something to the effect of (paraphrasing): *"I feel the disgust as strongly as any man... the very thought of it inspires me with disgust... I cannot help feeling it..."* BUT, crucially, he immediately follows this with: *"...but I know not why..."* and *"...ought it therefore to be punished? No."*
      *   **Why does he mention it?** For several reasons:
          *   **Honesty & Rhetorical Power:** Acknowledging his own prejudice makes his subsequent *rejection* of it as a legal basis far more powerful. It shows he's arguing *against* his gut feeling *because* reason demands it.
          *   **Isolating the Argument:** He separates the *feeling* (which he cannot control) from the *rational judgment* about what the law should do (which he can control).
          *   **Demonstrating the Irrationality:** By admitting he feels it but cannot rationally justify *why* it should be illegal, he highlights the core problem of the "sympathy and antipathy" principle.
      *   **Explanations for the Antipathy (Where it comes from):** While primarily focused on why antipathy *shouldn't* dictate law, he does offer some psychological/social explanations for its existence:
          *   **Association with Actual Harms:** Confusion with non-consensual acts (rape), acts with minors, or disease.
          *   **Religious Condemnation:** Deeply ingrained teachings framing it as a profound sin.
          *   **Violation of "Purpose":** The idea that sexual organs have a sole "natural purpose" (procreation), which Bentham finds a weak argument but recognizes its hold.
          *   **Novelty/Unfamiliarity:** For many, it lies outside their own experience or desires.
          *   **"Greek Fear":** Association with ancient Greek pederasty, raising fears of corruption of youth (even though Bentham distinguishes consensual adults).
          *   **Mere Habit & Prejudice:** Deeply ingrained cultural taboos passed down without examination.
      *   **His Point:** Regardless of the *source* of the antipathy (even if partly explainable), its *normative status* remains zero. Feeling disgust does not create a harm that justifies inflicting the massive harms of punishment. The law must be based on preventing tangible evils, not catering to feelings of revulsion.

  3.  **The Hart-Devlin Debate: A Direct Rerun?**
      *   **Yes, absolutely.** The Hart-Devlin debate (late 1950s) is fundamentally a re-run of Bentham's core argument applied to the Wolfenden Report's recommendation to decriminalize consensual homosexual acts in private.
      *   **The Parallels:**
          *   **H.L.A. Hart (Bentham's Heir):** A legal positivist deeply influenced by utilitarianism/Bentham. He argued **exactly like Bentham**:
              *   Law should only intervene to prevent **harm to others** (physical, psychological, or tangible harm to societal institutions necessary for all, like contract enforcement).
              *   Criminalizing consensual "immoral" acts (like homosexuality) in private based solely on **public disgust, moral outrage, or the "enforcement of morality for its own sake" is unjustified**. It inflicts harm (punishment, ruined lives) without preventing a countervailing harm. He explicitly invoked the "harm principle" often traced back to Mill, but rooted in Benthamite utility.
          *   **Lord Patrick Devlin (The Modern "Sympathy/Antipathy" Principle):**
              *   Argued that society has a right to protect its **shared morality** as the glue holding society together, even if no *obvious* tangible harm results from a specific private act.
              *   **Extreme Disgust as a Test:** Famously argued that if an act evokes feelings of **"intolerance, indignation, and disgust"** in the "right-minded person," that was sufficient evidence of its threat to the social fabric, justifying legal suppression.
              *   **This is PRECISELY what Bentham called "the principle of sympathy and antipathy" dressed up as "social cohesion."** Devlin elevated the *feeling of disgust* itself into a criterion for legal action, arguing that the collapse of shared morality *is* a profound harm. Bentham (and Hart) would argue this is circular: the law *creates* the feeling of outrage by criminalizing it, and the "harm" of weakened morality is speculative and rooted in the very antipathy being questioned.
      *   **The Verdict:** It's entirely fair, and indeed common in legal philosophy, to see the Hart-Devlin debate as a 20th-century re-enactment of the Benthamite critique of punishing acts based on antipathy vs. tangible harm. Hart directly channels Bentham's utilitarian logic against using law to enforce popular morality where no clear harm exists.

  **How This Serves Your Scene:**

  Your narrator, a former barrister, grappling with his friend's peril, can have a powerful moment of realization using Bentham's framework:

  1.  **Initial Gut Reaction:** He likely feels the societal disgust/revulsion himself (as Bentham did). He might fear for his friend, feel shame by association, or wrestle with his own beliefs.
  2.  **Legal Training Kicks In:** He starts applying reason. *What is the actual harm caused by the specific act his friend is accused of?* Was there force? A minor? Public indecency causing alarm? Or was it consensual, private, between adults?
  3.  **Confronting the Law:** He sees the statute – its severity (death!), its basis. He realizes it doesn't require proof of *harm* (like assault or corruption), only proof of the *act* itself. The punishment is grotesquely disproportionate to any actual harm done in a consensual scenario.
  4.  **The Benthamite Epiphany:** This is where he makes the leap. The law isn't punishing harm; **it's punishing the *feeling* of disgust that society holds.** It's codified antipathy. The law itself *becomes* the instrument of harm, inflicting immense pain (death, infamy, the destruction of his friend) purely to satisfy an irrational, unexamined collective prejudice. He realizes the sheer *inutility* and profound *injustice* of it – the law causing more misery than it prevents. He might even recall Bentham's confession of personal disgust and his firm rejection of it as a legal basis, finding resonance.
  5.  **The Outrage:** His appalled reaction isn't modern wokeness; it's the appalled reaction of a rational man trained in law seeing the law perverted from its true purpose (preventing harm) into an engine of cruelty driven by unreason. His anger is at the *betrayal* of legal principle.

  **In short:** You have the perfect historical, philosophical foundation. Bentham's argument is clear, powerful, rooted in the period, acknowledges the visceral disgust, and provides the logical framework for your narrator's realization that the law is monstrous precisely *because* it elevates irrational antipathy above reason and utility. The Hart-Devlin parallel just underscores how timeless and fundamental this clash of principles is. Go forth and write that powerful scene!
