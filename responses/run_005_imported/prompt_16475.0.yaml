  Also, considering the user's role as a PhD student, they might be hesitant to challenge a postdoc. But their deeper need here is probably to ensure sound scientific decision-making without letting speculative reasoning derail their field. They might also be concerned about the ethical implications of abandoning long-term projects that could benefit future generations, even if those generations are smaller than hoped.

  The postdoc's stance could stem from a genuine concern about existential risks, which is valid. But the Doomsday Argument isn't the best way to address those. Instead, focusing on known risks like climate change or asteroids makes more sense. The user could redirect the conversation towards actual risk mitigation without buying into the controversial argument.

  In the planning meeting, the user should push back by highlighting the flaws in the Doomsday Argument and emphasizing the importance of long-term investments in science. They could mention how past long-term projects have led to major breakthroughs. Also, if the field only funds short-term projects, it might miss out on transformative discoveries that require sustained effort. Balancing short and long-term goals is key, but abandoning the latter based on a disputed theory isn't wise.

