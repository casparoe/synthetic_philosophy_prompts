answer: |-
  Here’s a toast that threads the needle: philosophically sound for Aaron’s colleagues, warm and funny for family, and structured so *all* the Sartre references can be cut while leaving a heartfelt, coherent toast. The "essence" remains even if the "existence" of philosophy is removed.

  ---

  **(Start with a raised glass, warm smile)**  
  "Aaron, Jess, everyone… I’ve known Aaron since grad school, when his hair was thicker and his existential dread was *mostly* about dissertation deadlines. Back then, if you’d told him he’d be standing here today? He’d have quoted Sartre: *‘We are condemned to be free.’* And then ordered another whiskey. **(Pause for laughter)**  

  But look at you both now. And look at this room! Half of us are here because we love you. The other half are here because Aaron spent 15 years explaining *why* you shouldn’t love clichés. **(Nod to philosophy table)** No ‘meant to be’. No ‘written in the stars’. And definitely **(turn to Aaron, pointedly)** no ‘in-itself that has a wedding date’.  

  *(Philosophy version:*  
  *Because Aaron taught us: love isn’t fate. It’s not some pre-fabricated ‘essence’ you stumble into. Existence precedes essence, right? You two didn’t* find *a timeless love story—you* built *it. Choice by choice. Day by day. Even when it’s hard. Especially when it’s hard.*  
  *)*  

  **So what do I say about two people who turned radical freedom into something real?**  

  I say: Aaron didn’t meet Jess and just *know*. He met her and *chose*. He chose her sharp wit over his own monologues. Chose her farm calls at 3 AM over sleeping in. Chose her stubborn hope over his own beautifully crafted pessimism. And Jess? **(Turn to her)** You chose right back. Chose his intensity over easy answers. Chose his rants about ‘bad faith’ over… well, probably peace and quiet. **(Smile)** You looked at a man who analyzes love like a logic puzzle and said: *‘I’ll take that project.’*  

  *(Philosophy version:*  
  *That’s the transcendence in the facticity, isn’t it? The coffee Jess brings him during late-night writing? The way Aaron actually* listens *now when she explains a complicated surgery? Those aren’t accidents. They’re tiny, daily rebellions against the absurd. Proof that meaning isn’t found—it’s made.*  
  *)*  

  **Which brings me to the scary part of Aaron’s work.**  
  *(Lean in conspiratorially)*  
  He once told me wanting to be loved is wanting someone to *freely choose to be captured by you forever*. **(Pause, let the room tense slightly)** Sounds intense, right? Almost unstable? Like setting a wild animal free and praying it comes back to your tiny apartment. **(Nod to Jess, the vet)**  

  But then I watched you two.  

  *(Philosophy version:*  
  *It’s unstable if you think ‘capture’ means chains. But what if ‘capture’ looks like this? **(Gesture to them)** Two people staring at the void of infinite choice and saying, ‘Nah. I pick* you*. Again. Today.’ Not because they have to. Because in a world of radical freedom, choosing each other—knowing the other could walk away—is the bravest thing they do.*  
  *)*  

  **So Aaron—**  
  That line about the ‘in-itself’? It killed at parties. But today? Today, you’re not the ‘in-itself’ that has a wedding date.  
  **You’re the ‘for-itself’ that chose one.**  

  And Jess? You didn’t just capture him. You built a pasture where freedom feels like home.  

  **So let’s raise a glass:**  
  To Aaron and Jess. Masters of their own freedom. Architects of their own meaning. And proof that the most profound choice isn’t found in a book—it’s lived. May you keep choosing each other, freely, fiercely, for all your days.  

  **(Clink glass, big smile)** Cheers!"  

  ---

  ### Why This Works  
  1. **Sartrean Core, Human Shell:**  
     - Uses "existence precedes essence" (their choices built the relationship, not fate).  
     - Flips "in-itself" from a deflection to a declaration of agency ("You chose one").  
     - Addresses the "love as capture" paradox by reframing it as mutual, brave commitment.  

  2. **Survives Philosophy Removal:**  
     - **Cut all philosophy lines?** You still get:  
       *"Aaron didn’t just know—he chose. Jess chose back. They built this. Their choices are brave. The ‘in-itself’ line was funny, but today he chose this. They keep choosing each other. Cheers."*  
     - Warmth and humor carry it.  

  3. **Balances the Room:**  
     - **Academics:** Nods to transcendence/facticity, bad faith, radical freedom.  
     - **Family:** "Farm calls at 3 AM", "rants about bad faith", "whiskey", "vet" = relatable laughs.  
     - **Aaron & Jess:** Honors their intellect while celebrating their humanity.  

  4. **Tone:**  
     - Warm, funny, and slightly teasing (as a best man should be). The "scary part" setup disarms the love-capture idea.  
     - "Pasture where freedom feels like home" softens philosophy with Jess’s vocation.  

  **Delivery Tip:** Pause before/after the heavier philosophy lines. Let the academics chuckle, then pivot quickly to a human moment ("coffee", "surgery"). They’ll feel seen without losing the room.  

  You’ve got this. It’s not a dissertation defense—it’s a celebration of your friend who finally chose his own happy ending. Sartre would *hate* that. Perfect.
