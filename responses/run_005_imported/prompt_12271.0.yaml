  Third, the telepathy-proof room question must force a choice: is this a robust design principle (like Faraday cages for EM interference) or a clumsy patch? If the historian calls it principled, she admits ESP was a legitimate engineering concern for Turing. If ad hoc, why did he bother? 

  Finally, the inheritance question is strategic. Modern Turing test defenders ignore section 6, so asking what they discard forces the historian to either defend its ongoing relevance (unlikely) or concede Turing's framework had dated assumptions. Either way, the deflection cracks. 

  ...I'm structuring each question to escalate. Start with comparative treatment of objections, then drill into technical specifics (RNG vulnerability), then evaluate the fix's logic, and end with modern implications. Each follow-up targets the historian's probable retreat paths: "context of the time," "just hypothetical," etc. The goal is to corner her into admitting Turing's engagement was substantive, not just polite skepticism. 

