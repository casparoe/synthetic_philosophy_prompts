  Hmm, the user is clearly well-versed in this topic—they mention specific technical details like the card-guessing scenario and telepathy-proof rooms. This isn't a surface-level interview; they want to push the historian beyond comfortable answers. The frustration with the deflection suggests they suspect there's more to Turing's engagement with ESP than mere methodological caution. 

  Breaking this down: First, I need to anchor questions in Turing's own logic. Why did he treat ESP differently than other objections? The historian's deflection probably relies on painting Turing as passively accepting contemporary parapsychology, but Turing actively redesigned his test because of it. That's unusual—he dismissed Lady Lovelace's objection with arguments but built a physical barrier for ESP. 

