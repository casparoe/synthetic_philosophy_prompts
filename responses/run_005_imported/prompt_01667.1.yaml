answer: |-
  That's a fantastic question that cuts to the heart of evolutionary biology's complexities! The ambiguity you describe is very real – untangling "pure" costly signaling from other intertwined selective pressures or developmental constraints is notoriously difficult. Here's a concrete example that fits your request perfectly, where costly signaling is highly plausible but faces strong, difficult-to-dismiss alternative explanations:

  **Example: High-Risk, Low-Reward Behaviors in Adolescent/Young Adult Males (Human or Primate)**

  *   **Behavior:** Engaging in physically dangerous activities with minimal immediate survival or resource benefit – e.g., street racing, extreme sports with high injury/fatality rates (free solo climbing, BASE jumping), reckless dares, unnecessary physical confrontations, conspicuous substance abuse, or (in primates) gratuitous displays near predators or challenging dominant males with low chance of success.
  *   **Costly Signaling Hypothesis (Plausible):**
      *   **Signal:** Bravery, physical prowess, stamina, resilience, tolerance for risk (itself a potentially valuable trait).
      *   **Cost:** High risk of serious injury or death. Only individuals with genuinely superior physical condition, coordination, reaction times, pain tolerance, and perhaps underlying neural resilience (e.g., lower baseline stress reactivity) can *reliably* survive and excel at these behaviors. The cost ensures honesty.
      *   **Benefit:** Attracting mates (demonstrating "good genes" or the ability to provide/protect), gaining status/respect within the male hierarchy (which itself confers mating and resource advantages), deterring rivals.
      *   **Why Plausible:** These behaviors are often highly conspicuous, peak during peak reproductive years, and correlate (anecdotally and in some studies) with short-term mating success or social status gains in certain contexts. The sheer costliness screams "handicap."

  **Compelling Alternative Explanations (Hard to Rule Out):**

  1.  **Byproduct of Neuromaturation & Hormonal Surge:**
      *   **Explanation:** The adolescent/young adult brain, particularly in males, undergoes significant development. The prefrontal cortex (responsible for impulse control, risk assessment, long-term planning) matures later than the limbic system (involved in emotion, reward, sensation-seeking). Simultaneously, testosterone levels surge dramatically. This neuroendocrine "perfect storm" inherently increases sensation-seeking, novelty-seeking, impulsivity, and discounting of future consequences.
      *   **Why it's Compelling & Hard to Rule Out:** This is a well-documented biological phenomenon. It predicts risk-taking *generically* during this life stage, regardless of signaling value. It doesn't require the behavior to be *specifically* selected *for* signaling; it could simply be an unavoidable side effect of developmental timing. Disentangling the evolved *function* (signaling) from the developmental *mechanism* (neuromaturation) is extremely difficult. Does signaling exploit this developmental window, or is the behavior *primarily* driven by it?

  2.  **Skill Acquisition & "Practice" Under Lower Stakes:**
      *   **Explanation:** Engaging in controlled risks during adolescence might be crucial for developing essential physical and cognitive skills needed for *real* adult challenges (hunting, warfare, navigating complex social hierarchies, defending resources). The "low-reward" risks provide a training ground where mistakes, while potentially costly, are less likely to be immediately fatal than mistakes made during critical adult tasks.
      *   **Why it's Compelling & Hard to Rule Out:** This explains *why* the behavior peaks during adolescence (a learning phase) and why it might persist even if immediate mating/social rewards are unclear. It frames the cost as an investment in future competence rather than (or in addition to) a current signal. Proving that a specific risky behavior *doesn't* confer *any* future skill benefit is challenging. Does reckless driving build spatial awareness and reflexes useful in emergencies? Does gratuitous fighting build combat skills vital for later defense?

  3.  **Alternative Strategy in High-Variance Environments / "Desperation" Hypothesis:**
      *   **Explanation:** For individuals facing poor prospects via conventional, low-risk routes (low status, limited resources, few mating opportunities), high-risk gambles might offer the *only* viable path to significant gains. The potential payoff (sudden status jump, mate acquisition) outweighs the high risk *because* the low-risk alternatives are so poor. It's less about signaling inherent quality and more about a calculated (or desperate) gamble in an unfavorable position.
      *   **Why it's Compelling & Hard to Rule Out:** This explains why high-risk behavior might be more prevalent in disadvantaged groups or contexts. It doesn't require the individual to be inherently "high quality"; they might just have little to lose. Distinguishing between an individual taking a risk *because* they are high-quality (signaling) vs. *because* they are low-quality with limited options (gambling) based purely on the behavior is very difficult.

  **Why this example fits your request perfectly:**

  1.  **Costly Signaling is Genuinely Plausible:** The behaviors are costly, conspicuous, occur during prime reproductive years, and anecdotally linked to status/mating gains. The handicap principle logic fits intuitively.
  2.  **Strong Alternatives Exist:** The neurodevelopmental/hormonal explanation is grounded in concrete biology. The skill-acquisition hypothesis offers a clear adaptive rationale beyond signaling. The desperation hypothesis provides a socioecological context. None of these are easily dismissed "straw men."
  3.  **Empirical Distinction is Extremely Difficult:**
      *   How do you isolate the *motivation*? Is it conscious display or inherent drive?
      *   How do you measure the *net future benefit* of potential skill acquisition vs. the immediate signaling benefit?
      *   How do you control for underlying neurobiological state when observing the behavior?
      *   How do you definitively separate individuals taking risks *from a position of strength* (signaling quality) vs. *from a position of weakness* (gambling)?
      *   Cultural context heavily influences the expression and interpretation of risk, adding another layer of complexity.

  **Resolving the Ambiguity (The Hard Part):**

  Researchers would need clever, multi-pronged approaches:

  *   **Longitudinal Studies:** Track individuals over time. Do adolescent risk-takers who avoid injury *actually* achieve higher status/mating success later? Do they demonstrably possess superior skills acquired through the risks?
  *   **Neurobiological Correlates:** Can we identify specific neural or hormonal markers *beyond* typical adolescent development that correlate *specifically* with high-risk behaviors *and* later success, supporting the "quality" aspect of signaling?
  *   **Cross-Cultural Comparison:** Do risky behaviors increase in contexts where mating competition is fiercer or status hierarchies are more fluid (supporting signaling)? Or do they increase where future prospects are bleak (supporting desperation)? Or where specific survival skills are paramount (supporting practice)?
  *   **Cost-Benefit Modeling:** Can models accurately predict the observed level of risk-taking based *only* on signaling benefits, or do they require incorporating skill acquisition benefits or developmental constraints?
  *   **Experimental Manipulation (Ethically Complex):** Could subtle manipulations of perceived status/mating opportunities or future prospects alter risk-taking propensity in predictable ways for different subgroups?

  This example highlights that in complex organisms, especially social ones, behaviors rarely have a single, clean evolutionary explanation. Costly signaling is a powerful concept, but it often operates alongside, or is deeply entangled with, developmental constraints, learning imperatives, and alternative adaptive strategies, making definitive proof elusive. The ambiguity *is* the reality.
