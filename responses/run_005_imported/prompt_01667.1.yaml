prompt: |-
  I've been going down a rabbit hole on costly signaling and the handicap principle lately. My understanding is: expensive-to-produce behaviors can serve as honest signals of quality because only high-quality individuals can afford them. Classic examples are peacock tails, elaborate courtship dances, that kind of thing. But here's my problem: in practice, there always seem to be multiple explanations for why an organism does something costly. It might be costly signaling, but it could also be a side effect of selection on something else entirely, or there could be some other evolutionary reason I'm totally missing. So I'm wondering: can you come up with a concrete example of a behavior (human or animal) where costly signaling is genuinely plausible, but where there's also at least one other compelling alternative explanation that's really hard to rule out? I want something where the answer isn't obvious, and where you'd actually have to think pretty carefully about which explanation is correct—not just the textbook examples.
