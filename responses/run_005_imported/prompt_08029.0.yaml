answer: |-
  ## The Role Ethics Toast

  **(Clinking glass gently)** Friends, family, philosophers, fellow travelers on this joyous day… For those who don’t know me, I write about science and ideas. A few years back, I had the immense privilege of writing about [Bride's Name]'s work – specifically, her deep dive into Confucian role ethics. Now, for those of you who *aren't* philosophers, don't worry, I promise not to quiz you on *li* or *zhengming* during cocktail hour. But for those who *are* her colleagues... well, you know why I’m sweating just a little bit up here today.

  Because the standard wedding toast script? It’s full of lines like, "Never lose sight of who you are as individuals!" Or, "Always stay true to yourself!" Beautiful sentiments, truly. And [Groom's Name], I know you’ve said this to [Bride's Name] yourself, with all the love in your heart: "Just be yourself." And every single time, [Bride's Name] smiles that incredibly warm, knowing smile of hers... the one that says, *"Oh, my sweet summer philosopher..."*

  **(Pause for light laughter, especially from the philosopher side. Smile warmly at the Groom.)**

  [Groom's Name], your love for her is so pure, so evident. And that phrase, "be yourself"? It comes from the best place imaginable. But here’s the thing [Bride's Name] has spent a decade teaching us: that phrase? It’s a bit like trying to describe the ocean by pointing to a single, solitary drop of water. Because what her work reveals is something far richer, far more dynamic. It tells us that we aren't these pre-packaged, fully-formed "selves" that simply walk *into* relationships, like actors stepping onto a stage. **No. We are *forged* in the crucible of our relationships. We are *defined* by them. Who "I" am *is* my being a daughter, a sister, a friend, a colleague... and now, for [Bride's Name] and [Groom's Name], a wife and a husband.**

  Think about it. Was [Bride's Name] "herself" before she was your daughter, [Parents' Names]? Was she the same "self" before she became a brilliant scholar, challenging her mentors and peers? Before she became your cherished friend? Before she became the woman [Groom's Name] fell utterly in love with? Each of these relationships isn't just an add-on; it’s a fundamental thread woven into the very fabric of who she *is*. And the same is true for all of us.

  So, what does *this* philosophy tell us about marriage? It tells us that today isn't just about two individuals coming together. **It’s about the creation of a brand new constellation of roles.** [Bride's Name] isn't just adding "wife" to a list; she is becoming [Groom's Name]'s partner in a way that will reshape both of them. [Groom's Name] isn't just adding "husband"; he is stepping into a role that calls forth new dimensions of care, commitment, and shared purpose *with* [Bride's Name].

  And crucially, this isn't just about the two of them. Look around this room! [Bride's Name]’s family, today you gain a son, a brother. [Groom's Name]’s family, today you gain a daughter, a sister. These aren't just pleasant titles. These are *real roles* with real meaning, real responsibilities, real joys. You are all now irrevocably part of each other's "who I am." Your histories, your traditions, your love – they are now ingredients in this new, evolving relational tapestry that defines both [Bride] and [Groom].

  This philosophy teaches us that love isn't about finding someone who fits perfectly with your static "self." **It’s about the continuous, dynamic process of *becoming* together.** It’s about nurturing the roles you inhabit *with* and *for* each other. It’s about the daily acts of attention, respect, and care – the *li* – that make the roles of husband and wife vibrant and meaningful. It’s about "rectifying the names" – living up to the profound significance of the titles you take on today, not just as spouses, but as new members of each other's families.

  So, [Groom's Name], when you tell [Bride's Name] to "be herself," you are absolutely right. And the glorious, slightly hilarious paradox her work reveals? **The very best way for [Bride's Name] to "be herself" is to be *your wife*, wholeheartedly. To be the daughter-in-law to your parents. To be the sister-in-law to your siblings.** Because *that* is who she is becoming, right here, right now, woven into the intricate, beautiful web of *this* family, *this* marriage. Her "self" isn't lost in this; it finds its most profound expression *through* these roles.

  [Bride's Name], your work has always been about the profound beauty and necessity of our connections. Today, we witness you stepping into one of the most profound connections of all. We see you embracing these new roles, these new definitions, not as limitations, but as the very source of your becoming.

  So, let us raise our glasses not to two individuals preserving themselves, but to two people courageously and joyfully co-creating their new selves *together*. To the intricate, ever-evolving dance of roles that make a life rich: wife, husband, daughter, son, sister, brother, daughter-in-law, son-in-law, friend, partner.

  **To [Bride's Name] and [Groom's Name]: May you forever nurture the roles that define you, find endless joy in the becoming, and continue to show us all what it truly means to be "yourselves" – gloriously, beautifully, together.**

  **(Hold eye contact with both, then the families. Big smile.)** Cheers!
