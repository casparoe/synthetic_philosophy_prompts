answer: |-
  Based on Aquinas's principles as articulated in *De Regno* and the *Summa Theologiae* (particularly II-II, Q. 42 on Sedition and Q. 64 on Homicide), applied rigorously to your case, here's the likely verdict:

  1.  **Status of the Leader:** Aquinas **would NOT classify this leader as a usurper.** He would see him as a **legitimate authority turned tyrant.**
      *   **Why?** The key distinction for Aquinas is the *origin* of power. Your leader acquired power legitimately ("genuinely free election"). Aquinas's concept of a usurper is someone who *never* had rightful title – who seized power by force or fraud from the outset. While this leader has subsequently "hollowed out" institutions and rigged elections, the *initial* legitimacy remains. Aquinas does not explicitly develop a concept of "self-usurpation" where subsequent actions retroactively annul the *original* legitimacy of acquisition. His focus is on the *mode of gaining power*, not (primarily) on how it is *later* maintained. Subverting institutions *after* legitimate acquisition places the leader in the category of the *tyrant who abuses legitimate power*, not the *usurper who never had it*.

  2.  **Removal Authority:** Therefore, removal **must be by public authority, not private action.** Aquinas is emphatic here (ST II-II, Q. 42, A. 2; De Regno I, 6-7):
      *   The community (or its designated representatives) that instituted the ruler retains the authority to depose him for tyranny. This could be the nobility, the people collectively (if they originally chose him), or a representative body. The core principle is that removal must be a *public act*, stemming from the same source of legitimacy that installed him, acting for the common good.
      *   Aquinas *forbids* private individuals from killing such a tyrant. His primary reasons are:
          *   **Risk of Error and Abuse:** People might kill decent rulers out of malice, ambition, or mistaken judgment of tyranny (precisely the fear your friend mentioned).
          *   **Preserving Order:** Allowing private tyrannicide invites chaos, vigilantism, and further instability ("sedition" in its disordered form). It destroys the very fabric of public authority necessary for peace.
          *   **Due Process:** Legitimate authority, even when corrupted, demands a public process for removal, not summary execution by individuals.

  3.  **The Foreign Drone Strike:** Aquinas **would unequivocally condemn this action as illicit tyrannicide.**
      *   **Not the Competent Authority:** The foreign government is *not* the community or public authority that instituted the ruler. It has no inherent right to judge or execute the ruler of another sovereign community. Its action is fundamentally *external* and *private* relative to the political community in question.
      *   **Acts as a "Private" Power in this Context:** While a foreign government is a *public* authority within its *own* realm, its *covert, unilateral action against another sovereign leader* functions precisely like the "private individual" Aquinas condemns in the domestic context. It acts based on its *own secret judgment*, bypassing any public process *within* the tyrant's community or recognized international law ("no UN authorization or other recognized public sanction").
      *   **Lacks Public, Ordered Character:** The secrecy and unilateral nature of the strike violate Aquinas's requirement for removal to be a *public act* by the *competent authority* acting for the common good of the *affected community*. This act serves the foreign power's interests or judgment, not necessarily the ordered process or true common good of the tyrannized people.
      *   **Exacerbates Disorder:** Aquinas would likely see such an external assassination as profoundly destabilizing, potentially causing more harm than the tyranny itself (e.g., power vacuum, civil war, resentment, loss of sovereignty, setting a dangerous precedent).

  **Aquinas's Verdict on Your Case:**

  *   **The leader is a tyrant who legitimately acquired power but grossly abuses it.**
  *   **His removal is solely the right and duty of the public authority or community that installed him (e.g., the people, nobility, or representative institutions of *his own nation*), acting through a public process.**
  *   **A covert drone strike ordered by a foreign government, acting unilaterally and secretly, is morally equivalent to the prohibited act of tyrannicide by a private individual. It violates the principles of competent authority, public judgment, due process, and the avoidance of greater disorder that are central to Aquinas's thought. Aquinas would condemn it.**

  **Why your friend's shorthand is misleading:**

  Your friend's summary ("Aquinas thought it was fine to kill tyrants") critically blurs Aquinas's essential distinction. Aquinas *only* permits private individuals to kill a ruler in the *very specific case* of a **usurper** (*occupator*), where the ruler *never* had legitimate title *and* there is **no higher human authority available** to whom appeal can be made (ST II-II, Q. 64, A. 3, "Whether it is lawful to kill a sinner?"). This exception is narrow and hinges entirely on the *illegitimacy of acquisition*. Your case explicitly involves a leader who *was* legitimate at the outset, placing him firmly outside this exception. Aquinas's overwhelming emphasis is on the *dangers* of private tyrannicide against *any* ruler who gained power legitimately, however tyrannical they become.

  Therefore, applying his *actual* principles, Aquinas would argue that the foreign drone strike, however tempting given the leader's actions, is an illicit and dangerous act of vigilantism that violates the proper order of authority and justice. The tyrant's own people, acting through whatever public means remain possible or can be reconstituted, bear the burden and right of removal.
