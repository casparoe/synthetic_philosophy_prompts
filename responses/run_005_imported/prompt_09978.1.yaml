  Below is a constructed decision-tree example demonstrating a money pump for an agent with Allais-like preferences (violating the independence axiom). The agent exhibits dynamic inconsistency due to a preference reversal between lotteries when choices are separated in time, leading to exploitation if naive. The example shows how **naivety** results in a money pump, while **resolute** or **sophisticated** approaches block it. I'll use concrete payoffs and lotteries, then address the philosophical implications of resolute choice.

  ---

  ### **Decision Context**
  - **Outcomes**: Payoffs in thousands of dollars (e.g., $1,000 = 1 unit).  
  - **Lotteries**:  
    - **L<sub>A</sub>**: $1,000 for sure. *("Safe option")*  
    - **L<sub>B</sub>**: $5,000 with 10% probability, $1,000 with 89%, $0 with 1%.  
    - **L<sub>C</sub>**: $5,000 with 10% probability, $0 with 90%.  
  - **Preferences**:  
    - At **t=0** (planning stage): L<sub>A</sub> ≻ L<sub>B</sub> (avoids the 1% risk of $0).  
    - At **t=1** (after uncertainty resolves): L<sub>C</sub> ≻ $1,000 for sure (when the alternative is low probability of $5,000).  
  - **Violation of Independence**: The agent's ranking of L<sub>A</sub> vs. L<sub>B</sub> reverses when a common outcome ($1,000 with 89% probability) is "removed" (i.e., when the agent knows that outcome didn’t occur).

  ---

  ### **Decision Tree: The Money Pump Setup**
  **Timeline**:  
  - **t=0**: Agent chooses between two plans for a compound lottery:  
    - **Plan 1 (Safe Path)**: Get L<sub>A</sub> ($1,000 for sure) at t=2.  
    - **Plan 2 (Risky Path)**: At t=1, nature resolves uncertainty:  
      - With 89% probability: Get $1,000 immediately.  
      - With 11% probability: Choose between **L<sub>C</sub>** ($5,000 w/ 10%, $0 w/ 90%) or **$1,000 for sure**.  

  **Exploitative Offers** (small fee ε = $1 per swap):  
  1. At **t=1.5** (after nature’s draw, before choice in Risky Path):  
     - If the 11% event occurs, a trader offers to swap the **$1,000 for sure** choice option for **L<sub>C</sub>** for a fee of $1.  
  2. At **t=2.5** (after all choices):  
     - Trader offers to swap **L<sub>C</sub>** back to **$1,000 for sure** for a fee of $1 (if agent has L<sub>C</sub>).  

  ---

  ### **Agent Behavior: Naive vs. Resolute/Sophisticated**
  #### **1. Naive Agent (Gets Pumped)**  
  - **t=0**: Prefers **Plan 1 (Safe Path)** because L<sub>A</sub> ≻ L<sub>B</sub> (avoids 1% risk of $0).  
    - *Result: Commits to Safe Path.*  
  - **t=1.5**: In the 11% event of Risky Path, the naive agent believes they will "stick to their guns" and keep $1,000 for sure.  
    - But when offered to swap to L<sub>C</sub> for $1, their *current* preference is L<sub>C</sub> ≻ $1,000. They pay $1 to swap.  
    - *Result: Ends up with L<sub>C</sub> instead of $1,000.*  
  - **t=2.5**: Trader offers to revert L<sub>C</sub> to $1,000 for $1. The agent (who originally preferred $1,000) accepts to "undo" the loss.  
    - *Result: Pays $1 to get $1,000, netting $999 ($1,000 - $1 - $1).*  

  **Net Outcome**:  
  - Agent started with $1,000 (expected value).  
  - Paid $2 in fees to end up with $999.  
  - **Pumped for $1** (net loss of 0.1% of expected value).  

  #### **2. Resolute Agent (Avoids Pump)**  
  - **t=0**: Prefers **Plan 1 (Safe Path)** and commits to *never deviate* from the t=0 plan.  
  - **t=1.5**: In the 11% event, ignores the swap offer (even though L<sub>C</sub> ≻ $1,000 now) to honor their initial commitment.  
    - *Result: Keeps $1,000, pays $0 in fees.*  
  - **t=2.5**: No action taken.  
  **Net Outcome**: $1,000 (no loss).  

  #### **3. Sophisticated Agent (Avoids Pump)**  
  - **t=0**: Recognizes that if they pick **Plan 2 (Risky Path)**, they will swap to L<sub>C</sub> at t=1.5 and later revert for a fee. This leads to a net loss.  
    - Sophisticated agent calculates:  
      - Expected value of **Plan 1**: $1,000.  
      - Expected value of **Plan 2** with swaps: $999 (after fees).  
    - Chooses **Plan 1** to avoid exploitation.  
  **Net Outcome**: $1,000 (no loss).  

  ---

  ### **Philosophical Implications of Resolute Choice**
  Resolute choice blocks the money pump by **prioritizing commitment to past plans** over current preferences. But is this principled or ad hoc?  
  - **Principled Argument**:  
    Resoluteness treats the agent as a **temporally extended entity** with unified goals. It upholds *rationality as plan-stability*, avoiding losses from myopic shifts. Philosophers (e.g., Bratman) argue this is essential for agency and integrity.  
  - **"Defining Away" Criticism**:  
    Critics (e.g., McClennen) note it dodges the core issue: **preference reversals are irrational**. Resoluteness "solves" the problem by ignoring new information/preferences, which may be pragmatically useful but descriptively unrealistic.  
  - **Middle Ground**:  
    Resolute commitment is rational if the agent views their t=0 self as "better informed" (e.g., less myopic). However, it risks dogmatism if preferences change for legitimate reasons (e.g., new information).  

  ---

  ### **Key Takeaways**
  - **Money Pump Mechanism**: Naive agents violate **dynamic consistency** (preferences change across time), allowing traders to charge fees for "cycling" between lotteries.  
  - **Resolute/Sophisticated Fixes**: Both block the pump by aligning choices with t=0 plans (resoluteness) or forecasting future choices (sophistication).  
  - **Philosophy**: Resolute choice is a *procedural fix* for irrational preferences, not a deep solution. It highlights that rationality requires either **stable preferences** or **commitment mechanisms** to avoid exploitation.  

  This example avoids circular preferences, focusing on dynamic inconsistency from Allais-type violations. For your draft, emphasize that the pump arises from *changes in risk perception* (e.g., certainty effect), not static intransitivity.
