answer: |-
  That's a fantastic angle for your piece, and Sidgwick is indeed a perfect case study! The tension between his hyper-rational ethics and his deep dive into psychical research is fascinating. While "compartmentalization" is a common way to describe it, the reality is more nuanced, and there are several relevant concepts and terms you could consider:

  1.  **"Methodological Bifurcation" or "Epistemic Partitioning":** These terms directly capture the idea of employing *radically different standards of evidence and inquiry* for different domains. Sidgwick demanded near-mathematical rigor in ethics but applied a much looser, often credulous, standard when evaluating mediums (e.g., accepting anecdotal reports, forgiving methodological flaws in séances he desperately wanted to believe were real). This highlights the *how* rather than just the *that* of the separation.

  2.  **"Crisis-Driven Empiricism" (or "Anxiety-Driven Inquiry"):** This frames it less as a "blind spot" and more as a *motivated* extension of his rationalism, albeit under immense psychological pressure. Sidgwick, along with many Victorians (like Myers, Gurney, even William James), was deeply traumatized by the collapse of religious certainty due to Darwinism and biblical criticism. Psychical research wasn't *irrational* escapism for him; it was a desperate, *empirical* gamble to find *scientific proof* of an afterlife and cosmic moral order. His analytical mind was fully engaged, but the *stakes* and *desire* fundamentally warped his application of skepticism. He famously said the SPR's work was "the most important work, not only for the present but for all time" – showing the immense weight he placed on it.

  3.  **"Rationalist's Gambit" (or "Empirical Hail Mary"):** This emphasizes the calculated, albeit desperate, nature of his involvement. He *knew* conventional science dismissed the occult. His turn to psychical research was a conscious decision to apply scientific *methods* (however imperfectly in practice) to an area *beyond* current science, hoping to force a paradigm shift. It was rationalism pushed to its limits in a realm where evidence was inherently elusive.

  4.  **"Scholastic Schizophrenia" (Use with Caution):** This is a more provocative, slightly outdated psychological term sometimes used historically. It directly implies a split mind. While it captures the stark contrast, it's pathologizing and might oversimplify the complex motivations. Best used if you're quoting a contemporary critic or explicitly framing it as a historical perception.

  5.  **"Epistemological Pluralism Gone Awry" (or "Selective Suspension of Skepticism"):** Sidgwick believed in rigorous inquiry, but implicitly accepted that *different kinds of truths* might require different modes of access. The problem was that for the deeply personal, existential question of immortality, he suspended the very skepticism he championed elsewhere, allowing "pluralism" to become a backdoor for credulity.

  6.  **"The Sidgwick Paradox":** You could even coin this term within your piece! Define it as: *The phenomenon wherein a rigorously analytical thinker, driven by profound existential or moral anxiety, systematically applies investigative methods to a marginalized field (like the paranormal) but does so with a significantly lowered threshold for evidence and skepticism than they demand in their primary field of expertise.*

  **Why "Blind Spot" or Simple "Compartmentalization" Might Be Inadequate:**

  *   **It Wasn't Walled Off:** Sidgwick didn't see psychical research as *separate* from his ethical project. He saw potential proof of an afterlife as the *foundation* for a rational ethics and cosmic justice. The motivation was deeply intertwined with his philosophical anxieties about utilitarianism and the meaning of life without God.
  *   **It Wasn't *Irrational* in Intent:** His *goal* was empirical verification. His *methods* (on paper) aimed for objectivity (using codes, controls, multiple observers). The failure was in execution and the overpowering influence of hope, not a lack of *attempted* rationality.
  *   **It Was a Collective Endeavor:** The SPR involved many brilliant minds (scientists, philosophers) caught in the same cultural moment. This suggests a broader societal "compartmentalization" or motivated reasoning driven by shared anxieties, not just an individual quirk.

  **Recommendation for Your Piece:**

  *   **Lead with "Methodological Bifurcation" or "Epistemic Partitioning":** These are precise, descriptive, and academic enough for an intelligent audience without being overly obscure. They highlight the core issue of *differing standards*.
  *   **Contextualize with "Crisis-Driven Empiricism":** Explain *why* this bifurcation occurred. Frame Sidgwick's psychical research not as an irrational hobby, but as a high-stakes, desperate application of empirical methods to solve an existential crisis created by the very rationalism he championed.
  *   **Use "Compartmentalization" as a Secondary Term:** It's widely understood and captures the psychological separation aspect. But pair it with the above to add depth.
  *   **Avoid Overly Pathologizing Terms:** Unless specifically discussing contemporary critiques or psychological interpretations.

  **In essence:** Sidgwick wasn't walling off an irrational blind spot; he was desperately trying to *extend* his rationalism into a realm where evidence was incredibly slippery, driven by a profound need that his rigorous ethics couldn't satisfy. The "bifurcation" was in the *rigor* of the methods applied, fueled by the existential stakes. Calling it his "rationalist's gambit" or "crisis-driven empiricism" might be the most illuminating approach for your piece. Good luck – it's a fascinating topic!
