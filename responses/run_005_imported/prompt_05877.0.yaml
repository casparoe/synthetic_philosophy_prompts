answer: |-
  ## MEMORANDUM  
  TO: Committee on Elections Delegates  
  FROM: Chair, Committee on Elections  
  DATE: October 26, 2023  
  SUBJECT: Critical Analysis of SB 107: Lowering Municipal Voting Age to 16 & Alternative Proposals  

  ### I. The Core Dilemma: The Boundary Problem  
  Arguments about whether 16-year-olds are "mature enough" miss the foundational challenge: **Why draw any age-based line?** Political theory identifies two major principles for defining the *demos* (the voting body):  

  1.  **The All-Affected Interests Principle:** Those significantly impacted by political decisions should have a vote.  
      *   *Application:* Municipal laws (e.g., zoning, school funding, parks, local taxes, public transit) demonstrably affect 16-year-olds. *But so do they affect 12-year-olds.*  

  2.  **The Subjection to Coercion Principle:** Those bound and coerced by a community's laws should have a say in making them.  
      *   *Application:* 16-year-olds face legal penalties for violating municipal ordinances (e.g., curfews, loitering laws, truancy). *But so do 12-year-olds.*  

  **Conclusion:** Neither principle cleanly justifies *16* over *12*, *14*, or *18*. **A cutoff requires an *additional* justification beyond these core democratic tests.**  

  ### II. Evaluating SB 107: Lowering to 16 (Direct Enfranchisement)  
  **Arguments For:**  
  *   **Civic Habit Formation:** Voting is a habit. Municipal elections (lower-stakes, hyper-local) offer an ideal "training ground" to engage citizens earlier, potentially increasing lifelong participation (evidence from Takoma Park, MD shows higher youth turnout).  
  *   **Local Impact:** Municipal decisions (schools, jobs, environment, transit) acutely impact 16/17-year-olds. Their voices directly address this impact.  
  *   **Administrative Feasibility:** 16/17-year-olds possess state-issued IDs (driver's licenses, learner's permits) and are embedded in school systems, easing voter registration.  
  *   **Recognition of Capacity:** Many 16-year-olds work, pay local taxes (sales tax), drive, and contribute significantly to their communities. Excluding them contradicts their functional civic role.  

  **Arguments Against (The Case for 18):**  
  *   **Clear Legal & Social Threshold:** 18 marks near-universal legal adulthood (voting, contracts, jury duty, military enlistment without parental consent). It represents a **bright line** signifying full, independent civic responsibility. Lowering it creates ambiguity.  
  *   **Protection vs. Autonomy Balance:** Society accepts significant paternalism below 18 (compulsory schooling, limited work hours, juvenile justice distinctions) reflecting a judgment about developmental stages and vulnerability. Granting the full franchise at 16 may be inconsistent with other protections.  
  *   **Risk of Dilution:** If the franchise boundary is fluid, pressure arises to lower it further (to 14, 12?), undermining the coherence of the *demos*. 18 provides a stable, defensible anchor.  
  *   **Cognitive Development:** While maturity varies, neuroscience suggests key aspects of long-term planning, risk assessment, and impulse control continue developing into the early 20s. 18 represents a broader societal consensus on sufficient development for *full* citizenship burdens.  

  ### III. Evaluating the Amendment: Demeny Voting (Proxy for Minors)  
  This amendment would replace direct enfranchisement at 16 with granting parents/guardians an *extra vote* per minor child in their household for municipal elections.  

  **Arguments For:**  
  *   **Recognizes Affected Interests:** Acknowledges that minors are deeply affected by policy but addresses capacity concerns via trusted proxies.  
  *   **Strengthens Families:** Gives parents greater stake in policies impacting their children's environment (schools, safety, parks).  
  *   **Avoids Boundary Problem:** Sidesteps the age-cutoff debate entirely by encompassing *all* minors.  
  *   **Increases Parental Engagement:** May incentivize higher turnout among parents.  

  **Arguments Against:**  
  *   **Paternalism & Autonomy Denial:** Deprives capable 16/17-year-olds (and younger minors) of direct political agency, treating them as extensions of parents. Contradicts the goal of fostering independent citizenship.  
  *   **Distorts Representation:** Gives households with multiple children disproportionate voting power compared to childless adults or single adults. Violates "one person, one vote."  
  *   **Proxy Imperfection:** Assumes parents perfectly represent children's distinct interests, which is often untrue (e.g., teen perspectives on transit, recreation, or school climate may differ).  
  *   **Complexity & Fraud Risk:** Introduces significant administrative complexity (verifying minors, household structures) and potential for abuse.  

  ### IV. Recommendation  
  After careful consideration of the boundary problem, the arguments for and against lowering the voting age to 16, the case for retaining 18, and the merits/drawbacks of Demeny voting, the Chair recommends:  

  **Report SB 107 FAVORABLY AS AMENDED (Adopt Demeny Voting Amendment)**  

  *   **Rationale:**  
      1.  **Acknowledges the Boundary Problem:** Demeny voting directly confronts the core theoretical dilemma by encompassing *all* affected minors without drawing an arbitrary new age line below 18.  
      2.  **Strengthens Local Democracy:** It increases the electoral weight of families raising the next generation of citizens on precisely the hyper-local issues (schools, parks, safety) that most impact minors' daily lives, potentially boosting engagement on these issues.  
      3.  **Preserves the 18 Threshold:** It maintains 18 as the bright line for *independent* voting, respecting the significant legal and societal weight of that age, while still recognizing the political interests of minors.  
      4.  **Practical Alternative:** It offers a philosophically coherent alternative to direct enfranchisement at 16, which, while appealing, struggles to provide a uniquely defensible justification against the strong case for the stability and societal consensus of 18 as the age of full civic responsibility.  

  **Dissent Considered:** The case for keeping the voting age at 18 is robust, resting on clear legal adulthood, societal consistency, and concerns about developmental capacity and boundary coherence. Reporting unfavorably is a defensible position. However, the Demeny amendment offers a more innovative and theoretically sound path forward than direct lowering to 16, addressing the "affected interests" principle without undermining the significance of 18.  

  ### V. Call to Action  
  Move to amend SB 107 by striking "lower the voting age to 16" and replacing it with "implement Demeny voting, granting one additional municipal vote per minor child to a parent or legal guardian." Following amendment, move to report the bill **FAVORABLY**.  

  **Vote wisely, considering not just political preference, but the foundational principles of democratic inclusion and the practical realities of defining our community.**  

  ---  
  **Chair's Note:** This is complex! The strongest debates will grapple with *why* we draw lines, not just assert maturity. Be prepared to defend the coherence of your preferred boundary (whether 18, 16, or via proxy) against the theoretical challenges. Respect the depth of the arguments on all sides.
