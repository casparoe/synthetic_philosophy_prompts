answer: |-
  ## The Wager & The Philosophers  
  *(A drafty study. AMANDA paces, coin spinning on the table. KELLY, intense and precise, faces SAMUELSON, calm and skeptical.)*

  **AMANDA:** This coin gives me 60% heads, pays even money. I can play forever. How much of my $100 should I bet *each* time? Maximize my wealth. Go.

  **KELLY:** (Leans forward) **Twenty percent.** Exactly $20 on the first bet. Always 20% of your *current* bankroll. This isn't a guess; it's the **only fraction guaranteeing your wealth grows at its maximum possible *compound* rate over time.** Think of it as the engine tuning for relentless growth. Bet more, and volatility drag eats you alive. Bet less, and you leave growth on the table. It dominates *almost surely* in the long run – meaning, along the single, actual path of reality *you* experience.

  **SAMUELSON:** (Shakes head, a wry smile) "Almost surely in the long run." Amanda isn't living in the long run. She lives *once*. Kelly's answer assumes her **only desire is to see her wealth number grow as fast as possible *compounded*.** But what if losing $50 hurts her more than gaining $50 pleases her? What if she dreams of buying a specific $150 item soon? Kelly imposes **logarithmic utility** – meaning her happiness from wealth is precisely proportional to the *log* of the dollar amount. That’s a very specific, and frankly, *arbitrary*, psychological profile.

  **KELLY:** You dismiss the long run, but it's the *only* run she gets! Expected value, your tool, **averages outcomes across countless parallel Amandas she'll never see.** One Amanda wins millions, another goes bust. The average looks great, but *this* Amanda only gets one sequence! Kelly maximizes the growth rate *along her actual, singular journey*. Look at the math: Betting 20% (`f* = p - q = 0.6 - 0.4 = 0.2`) gives a **growth rate `g` of `0.6*ln(1.2) + 0.4*ln(0.8) ≈ 0.6*0.1823 + 0.4*(-0.2231) ≈ 0.1094 - 0.08924 ≈ 0.020156` or ~2.015% per bet.** Bet 10%? `g ≈ 0.6*ln(1.1) + 0.4*ln(0.9) ≈ 0.6*0.0953 + 0.4*(-0.1054) ≈ 0.05718 - 0.04216 ≈ 0.01502` (~1.5%). Slower growth. Bet 30%? `g ≈ 0.6*ln(1.3) + 0.4*ln(0.7) ≈ 0.6*0.2624 + 0.4*(-0.3567) ≈ 0.15744 - 0.14268 ≈ 0.01476` (~1.48%). *Slower still*, and far riskier! Only 20% maximizes `g`.

  **SAMUELSON:** (Taps the table) **Maximizing `g` is not synonymous with maximizing Amanda's *expected utility* unless her utility is `ln(wealth)`!** Suppose Amanda is more risk-averse. Her utility is `U(W) = sqrt(W)` – losing half hurts more than doubling pleases. Starting at $100, betting $20 (Kelly):
  *   **Heads (60%):** $120, `U=sqrt(120)≈10.95`
  *   **Tails (40%):** $80, `U=sqrt(80)≈8.94`
  *   **Expected Utility (EU):** `0.6*10.95 + 0.4*8.94 ≈ 6.57 + 3.576 = 10.146`
  Now, suppose she bets only **$10**:
  *   Heads: $110, `U=sqrt(110)≈10.49`
  *   Tails: $90, `U=sqrt(90)≈9.49`
  *   **EU:** `0.6*10.49 + 0.4*9.49 ≈ 6.294 + 3.796 = 10.090` (Slightly *lower* than Kelly? Wait...)
  Ah, but for one bet, Kelly *might* win on EU even for `sqrt`... but the risk profile changes dramatically over many bets! Let her bet **$5**:
  *   Heads: $105, `U≈10.25`
  *   Tails: $95, `U≈9.75`
  *   **EU:** `0.6*10.25 + 0.4*9.75 = 6.15 + 3.90 = 10.05` (Lower still). Now, **$30**:
  *   Heads: $130, `U≈11.40`
  *   Tails: $70, `U≈8.37`
  *   **EU:** `0.6*11.40 + 0.4*8.37 ≈ 6.84 + 3.348 = 10.188` (Higher than Kelly's 10.146!) **For *one* bet with `sqrt` utility, betting *more* than Kelly maximizes EU!** Kelly's 20% is *not* universally optimal.

  **KELLY:** (Eyes flashing) You focus on *one* bet? That's irrelevant! This is about *repeated play*. Your EU calculation for multiple bets using `sqrt` utility is horrendously complex – it depends on the *entire future path*! **Kelly gives her the highest probability of *achieving* any large wealth goal *N* bets from now, for any *N*.** It minimizes the *time* to reach a goal. If she bets $30 (30%), the **risk of ruin is terrifying.** Probability of dropping to 10% of her bankroll before doubling it? Much higher than at 20%! At 20%, the growth is *smooth* and *sustained*. Your "optimal" $30 bettor might get lucky early, but she has a significant chance of blowing up spectacularly *on Amanda's only journey*. Kelly protects her from that disaster while still delivering near-optimal growth *on her actual path*.

  **SAMUELSON:** "Protects"? At 20%, after 4 tails in a row – hardly impossible (0.4^4 = 2.56% chance) – she's down to `100 * (0.8)^4 = $40.96`! Is that "protected"? If she were more risk-averse, she might prefer betting 10% – down to `100*(0.9)^4≈$65.61` after 4 tails. Less growth potential, yes, but less gut-wrenching loss *on her path*. **Kelly's "protection" is only optimal if her fear of loss is *exactly* inversely proportional to her current wealth (the derivative of `ln(W)`).** Why should Amanda conform to that? Why is surviving to see the long run *in that specific logarithmic way* the only rational goal? Expected utility theory respects *her* preferences, not impose Kelly's logarithmic obsession. If she values stability more, betting less is rational, not a "mistake."

  **KELLY:** Because the long run *is* the goal when offered infinite repetition! Your expected utility across phantom universes is a mathematical abstraction. **Her lived reality is one sequence of wins and losses. Kelly maximizes the growth rate of that *single sequence*. Any other fraction guarantees a lower growth rate *along her actual life* with probability approaching 1.** Yes, ruin is possible even at Kelly, but *minimized* for the growth rate achieved. Betting less or more *systematically* sacrifices potential growth for reduced volatility *she might not even care about* in a pure capital growth context. If she truly has a different utility function, fine, but you must specify it *and* solve the vastly harder multi-period optimization. Kelly is the clean, robust answer for pure growth on the one path we walk.

  **SAMUELSON:** "Might not even care about"? Amanda is human! The pain of losing 60% of her wealth in a crash *matters*, even if she'll "probably" recover in 100 years! Kelly's "probability approaching 1" is cold comfort when you're staring at a 95% loss *in this life*. **Rationality is about maximizing *satisfaction* across the actual, finite sequence experienced, not worshiping the limit.** Expected utility, even if complex, is the framework that respects *her* values. Prescribing Kelly without knowing if `ln(W)` reflects her soul is the *real* mistake. It substitutes a convenient mathematical property for genuine preference optimization.

  **KELLY:** And you substitute an intractable calculation and phantom averages for a proven engine of growth on the only path that exists! Shall we simulate Amanda's journey? Let the coin fall where it may. I stake my 20%. What fraction does *your* Amanda stake, Professor, and *what is her utility function today*?
  **SAMUELSON:** She stakes what maximizes *her* expected utility *over her finite horizon*, Professor. And defining that utility is her prerogative, not dictated by the logarithm of her bank balance. The coin is waiting. Amanda, choose your fraction – and know *why* you choose it.

  *(Amanda stops pacing, eyes fixed on the spinning coin. The tension hangs, unresolved.)*

  ## Key Philosophical Conflict Illustrated
  1.  **The Nature of Rationality:** Is it maximizing the growth rate of the *single realized path* (Kelly) or maximizing the expectation of subjective utility *before the path is known* (Samuelson)?
  2.  **The Significance of the Long Run:** Does "almost sure" dominance in the infinite limit justify the strategy for a finite, single lifetime?
  3.  **The Role of Utility:** Is logarithmic utility a fundamental truth for capital growth, or an arbitrary assumption imposed by the Kelly criterion?
  4.  **Risk in Reality:** Does Kelly truly "protect" against devastating losses *felt* by a real person on their single journey, or does it merely optimize a mathematical long-run property?
  5.  **Tractability vs. Precision:** Is the robust, computable Kelly fraction superior to the theoretically precise but often intractable expected utility maximization?
