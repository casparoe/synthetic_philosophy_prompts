prompt: |-
  I've read enough Less Wrong and adjacent blogs that the basic pitch of updateless decision theory feels familiar, but one part of it has never sat right with me. In cases like counterfactual mugging, an agent that conditionalizes on new evidence and maximizes expected utility relative to the resulting posterior ends up refusing to pay Omega once it has learned that the coin came up tails, since paying can no longer benefit it; UDT is supposed to avoid this by having the agent evaluate its entire policy against its original, unconditional prior instead. But the policy an updateless agent settles on still assigns a different action depending on whether it learns the coin came up heads or tails, so its behavior obviously tracks what it observes. In what sense, then, has it avoided updating on that observation, rather than simply updating on it and calling the result a "policy" instead of a posterior-guided choice? Is there a substantive difference between updating one's beliefs and updating one's policy, or does "updatelessness" just amount to ordinary Bayesian conditionalization performed in advance and relabeled?
reasoning: |-
  Okay, the user is grappling with the concept of updateless decision theory (UDT), particularly confused about how it avoids updating on evidence despite its policies seemingly depending on observations. Let me unpack their query step by step.

  First, they mention counterfactual mugging as a key example where traditional Bayesian updating fails—agents refuse to pay Omega after learning the coin is tails since it can't benefit them. UDT supposedly fixes this by evaluating policies against the original prior. But the user points out that the chosen policy still acts differently based on observations (heads vs. tails). So they're essentially asking: Isn't this just regular updating disguised as policy selection?

  Hmm, the core tension here is between epistemic updating (belief revision) and strategic commitment. The user might be conflating two things: (1) changing beliefs upon seeing data, versus (2) pre-committing to actions conditional on data. UDT separates these by locking in responses *before* seeing evidence, while keeping beliefs static during planning. 

  Ah! The subtlety is in when probabilities are used. Standard agents update beliefs *then* act optimally given new beliefs. UDT agents use fixed priors to choose *in advance* how to map future observations to actions. So yes, the behavior is observation-contingent, but the *reason* for choosing that contingency comes from pre-evidence calculations. 

  The user might also be hinting at a deeper question: Is UDT just computational pragmatism? I should emphasize that it's fundamentally about avoiding self-sabotage in dilemmas where your future knowledge would cause you to defect (like in counterfactual mugging). The "updateless" label refers to not letting *decision-making* be contaminated by information that would create blind spots, even though sensorimotor responses still react to inputs. 

  ...Wait, maybe their real frustration is philosophical? They might suspect UDT is repackaging Bayes under a fancy name. But the key distinction is normative: UDT rejects the idea that rational choice should always condition on all current knowledge. Sometimes ignorance is strategically valuable! That's why it's not just "Bayes in advance"—it's choosing to bind yourself to rules that would seem irrational *after* updating. 

  I should clarify with the coin example: When UDT "pays on tails," it's not because it updated on tails; it's because its pre-commitment (evaluated when heads was still plausible) calculated that this rule nets higher overall utility across both branches. The moment of choice is just executing a plan, not recalculating based on new beliefs. 

  The user seems analytically sharp—they've spotted what looks like a contradiction. Their underlying need might be to reconcile UDT's mechanical similarity to conditioning with its claimed philosophical innovation. The answer lies in the *telos*: standard updating myopically maximizes utility given current beliefs; UDT maximizes across counterfactual selves by simulating their coordination under a shared prior.
answer: |-
  You've hit on a profound and subtle tension in UDT. Your skepticism is well-founded—the distinction *isn't* about whether behavior depends on observations (it always must), but about **when and how that dependence is determined** and **what probabilities govern the choice of dependence**. Here's the substantive difference:

  1.  **The Core Distinction: Time of Commitment vs. Time of Execution**
      *   **Standard Bayesian Agent (Conditionalizing):** At time T (after seeing the coin is tails), it *reasons from its new epistemic state*. It calculates: "Given that I *know* it's tails (P(tails)=1), what action maximizes my expected utility *now*?" Paying Omega yields no benefit, so it refuses.
      *   **Updateless Agent:** *Before* seeing the coin flip (or more precisely, *before* it has any information distinguishing it from its counterfactual selves), it chooses a *complete policy* (a function mapping possible observations to actions). It evaluates this policy *solely* against its *initial prior* (e.g., P(heads)=0.5, P(tails)=0.5). It asks: "Which policy, *if followed by all my counterfactual selves*, maximizes *expected utility according to my original uncertainty*?" The policy "Pay Omega if tails, get paid if heads" wins because, under the prior, it yields +$50 (0.5 * $100 - 0.5 * $100 = $0? Wait... standard CM payout is often asymmetric. Let's assume Omega pays *you* $100 if heads, and *you pay Omega* $10 if tails. Then expected utility under the cooperative policy is (0.5 * $100) + (0.5 * -$10) = $45. The non-payment policy gives (0.5 * $0) + (0.5 * $0) = $0. So $45 > $0). At time T, when it sees tails, it simply *executes* the pre-committed policy: it pays. It *does not re-evaluate* the action based on its *current* knowledge state.

  2.  **Avoiding the Epistemic Update in Decision-Making:**
      *   The UDT agent *does* update epistemically (it learns it is in the tails branch). **The "updatelessness" refers *specifically* to avoiding the use of that *updated belief state* as the basis for *evaluating actions*** at the moment of decision.
      *   Crucially, the *reason* it pays on tails is *not* because it thinks paying is good *given that it's tails* (it knows paying is locally useless). It pays *solely* because, *before it knew tails*, it committed to a policy that maximizes expected utility *under the prior uncertainty*, and that policy dictates paying on tails. The *justification* for the action traces back to the prior, not the posterior.

  3.  **It's Not Just Pre-Computation:**
      *   While the policy *is* chosen in advance based on the prior, the key difference is **normative**. Standard Bayesian decision theory dictates that a rational agent *should* always act to maximize expected utility *conditional on its current information*. UDT argues this norm is self-sabotaging in certain dilemmas involving coordination across counterfactual branches.
      *   UDT agents *violate* the standard Bayesian norm *at the moment of action*. When the UDT agent sees tails and pays, it *knows* this action has *no causal benefit* to its current self. It pays *against* the prescription of maximizing expected utility *given its current knowledge* (P(tails)=1). It does so *only* because it is following the policy that was optimal *under the original state of ignorance*.

  4.  **The Role of the Policy:**
      *   The policy isn't just "relabeled conditionalization." It's a **pre-commitment mechanism**. The agent binds its future self to actions that would seem irrational *from the future self's perspective* but are necessary for achieving a globally optimal outcome *across all possible selves*. This binding is what allows cooperation with counterfactual versions of oneself.

  5.  **Illustration: Counterfactual Mugging Breakdown**
      *   **Stage 1 (Prior - Before Flip):** Agent uses prior P(Heads)=0.5, P(Tails)=0.5.
      *   **Stage 2 (Policy Selection - Still Before/Without Observation):** Agent evaluates candidate policies:
          *   `Policy_Defect`: Never pay Omega. *Expected Utility (Prior)*: (0.5 * $0) + (0.5 * $0) = $0
          *   `Policy_Cooperate`: Pay Omega iff Tails. *Expected Utility (Prior)*: (0.5 * $100) + (0.5 * -$10) = $45
      *   Agent commits to `Policy_Cooperate` because $45 > $0.
      *   **Stage 3 (Observation - Coin Flips Tails):** Agent learns `Tails`. Its *epistemic state updates*: P(Tails)=1.
      *   **Stage 4 (Action Execution):** Agent consults its *pre-committed policy* `Policy_Cooperate`. Policy says "Pay Omega iff Tails". It pays $10.
      *   **Crucial Point:** At Stage 4, if the agent *re-evaluated* using its *current* knowledge (P(Tails)=1), it would calculate:
          *   Pay: EU = -$10
          *   Don't Pay: EU = $0
          *   Don't Pay ($0) > Pay (-$10). **It would defect if it re-evaluated now.** UDT *forbids* this re-evaluation. It forces execution of the pre-commitment.

  **Conclusion:** "Updatelessness" is **not** just relabeled conditionalization. The substantive differences are:

  1.  **Normative:** UDT rejects the norm that an agent must *always* maximize expected utility relative to its *current* beliefs. It prioritizes the optimal *pre-observation* commitment over optimal *post-observation* action.
  2.  **Justification:** The action taken upon seeing evidence is justified *only* by reference to the *prior* evaluation of the policy, *not* by a utility calculation using the *posterior* beliefs.
  3.  **Binding:** UDT agents commit to actions that are *locally suboptimal* (given their posterior knowledge) but *globally optimal* (given the prior uncertainty). They sacrifice local optimality to enforce cooperation with their counterfactual selves.
  4.  **Avoidance of Self-Sabotage:** By refusing to update the *basis for decision-making* (even while updating epistemically), UDT avoids the self-sabotage inherent in dilemmas like Counterfactual Mugging, where conditioning on the posterior severs the link to the counterfactual benefit.

  In essence, UDT shifts the locus of rationality from the *moment-by-moment application of conditional expected utility* to the *ex-ante choice of a globally optimal strategy across all potential information states*. The agent updates what it *believes*, but it does *not* update the *rule* it uses to map those beliefs into actions; that rule was fixed earlier based on the prior. This is the core of "updatelessness" in decision-making.
