  5. **Priya (Score: 2)**  
     Devastating critique: If virtues flex to justify *any* action (e.g., walking past a dying person as "contextually wise"), virtue ethics becomes unfalsifiable. This is a recognized weakness in neo-Aristotelian theories (e.g., Julia Driver’s critiques).

  ### Bigger Considerations Both Missed:
  - **Interactionist Perspective:** Traits × situations interact (e.g., a "virtuous" person in moderate hurry helps, but crumbles under extreme pressure). This reconciles both views: traits exist but are situation-dependent.
  - **Moral Luck:** The passerby’s choice hinges on unseen factors (e.g., their prior trauma with medical emergencies). Situationism overgeneralizes; virtue ethics overlooks how luck shapes "character."
  - **Institutional Solutions:** Debating individual morality ignores systemic fixes (e.g., apps for reporting emergencies while rushed). Ethics should address structures enabling/impeding virtue.
