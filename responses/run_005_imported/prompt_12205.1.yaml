answer: |-
  Your observation about the structural similarity between Rawls's reflective equilibrium and van Fraassen's Reflection Principle is astute—both are coherence-based methods aiming for stable consistency. However, the *disparity in criticism* stems from fundamental differences in their domains, goals, and underlying assumptions. Here's why the "no truth guarantee" objection hits Rawls harder than van Fraassen:

  ### 1. **Divergent Epistemological Contexts**
     - **Rawls (Moral/Political Epistemology)**:  
       Reflective equilibrium seeks *normative truth* (e.g., "What is justice?"). Critics argue that coherence between intuitions and principles doesn't guarantee objective moral truth, as intuitions may be culturally biased or empirically flawed. Rawls offers no external anchor (e.g., empirical reality) to validate the outcome.
     - **Van Fraassen (Formal Epistemology/Bayesianism)**:  
       The Reflection Principle operates within a framework where *probabilistic coherence* is the **definition** of rationality. It doesn’t claim to track "Truth" (with a capital T) but aims for *internally consistent credences* across time. Truth-seeking is delegated to other tools (e.g., Bayesian updating via evidence).

  ### 2. **The Role of External Input**
     - **Reflective Equilibrium**:  
       Relies heavily on *pre-theoretic intuitions* (e.g., "slavery is unjust"). If these inputs are flawed, the equilibrium is "garbage in, garbage out." No mechanism corrects for biased starting points.
     - **Reflection Principle**:  
       Functions within a system where beliefs are *updated by evidence* via conditionalization. Reflection ensures that *current beliefs anticipate future evidence-responsive updates*. It’s a consistency constraint on a process already tied to external input.

  ### 3. **Formal vs. Substantive Goals**
     - **Van Fraassen’s Principle**:  
       A technical tool to avoid *diachronic incoherence* (e.g., Dutch books). It’s criticized for being too demanding (e.g., requiring certainty in one's future rationality) or violating *future autonomy* (e.g., if you expect to be drugged), **not** for failing to track truth. Formal epistemologists accept that probabilistic coherence doesn’t guarantee truth—but see it as necessary (not sufficient) for rationality.
     - **Rawls’s Method**:  
       Makes a *substantive claim*: that reflective equilibrium yields justified moral/political principles. Critics target this ambition directly, arguing coherence alone can’t justify normative conclusions.

  ### 4. **How Formal Epistemology Deflects the "Truth" Objection**
     - Bayesian frameworks treat *calibration* (e.g., credences matching observed frequencies) as the proxy for truth-conduciveness. Reflection ensures that if your *future* self is better calibrated (due to more evidence), your *current* self defers to them. The focus is on *internal consistency of a truth-seeking process*, not truth itself.
     - **Key distinction**: For Bayesians, **coherence is a minimal requirement of rationality**, while for Rawls, **coherence is the entire justificatory apparatus**.

  ### 5. **Van Fraassen’s Own Stance Matters**
     Van Fraassen (an anti-realist) never claimed Reflection tracks truth—he framed it as a pragmatic constraint to avoid self-sabotage. Critics like Arntzenius or Briggs attack it on technical grounds (e.g., conflicts with self-locating beliefs), not truth-aptness.

  ### Why Formal Epistemologists Don’t Prioritize the "Truth" Objection
  - **Reflection is a tool, not a foundation**: It’s one consistency norm among many (e.g., Kolmogorov axioms), not a standalone epistemology.
  - **Truth is external to the system**: Formal epistemology often assumes that rational coherence + evidence *leads toward* truth (via "washing out" priors, etc.). Reflection is a small piece of this machinery.
  - **Rawls invites the objection**: By positioning reflective equilibrium as the *source* of normative truth, he opens himself to metaphysical critiques. Van Fraassen makes no such claim.

  ### Conclusion
  Your intuition about procedural similarity is correct, but the criticism asymmetry arises because:
  - Rawls uses coherence to **define moral truth**.
  - Van Fraassen uses coherence to **constrain belief dynamics** within an evidence-responsive system.  
  The "no truth guarantee" objection applies weakly to Reflection because formal epistemology treats coherence as a necessary condition for rationality—not a sufficient one for truth. Critics of Rawls reject the sufficiency claim; critics of van Fraassen debate its necessity or practicality.
