prompt: |-
  I'm several drafts into a novel whose narrator has turned an absolute refusal to lie into the organizing principle of his life, modeled loosely on the rigorism of Augustine's early treatise "On Lying" (De Mendacio, c. 395 CE), which I've been reading in the old Nicene and Post-Nicene Fathers translation. Earlier in the treatise Augustine defines a lie as saying something other than what is in one's mind, with the further intention of deceiving one's hearer, and he writes as though these two conditions simply travel together. Then he arrives at the passage below, where he tries to pull them apart, and by my reading he never quite manages to put them back together:

  But it may be a very nice question whether in the absence of all will to deceive, lying is altogether absent. Thus, put the case that a person shall speak a false thing, which he esteems to be false, on the ground that he thinks he is not believed, to the intent, that in that way falsifying his faith he may deter the person to whom he speaks, which person he perceives does not choose to believe him. For here is a person who tells a lie with studied purpose of not deceiving, if to tell a lie is to utter anything otherwise than you know or think it to be. But if it be no lie, unless when something is uttered with wish to deceive, that person lies not, who says a false thing, knowing or thinking it to be false, but says it on purpose that the person to whom he speaks by not believing him may not be deceived, because the speaker either knows or thinks the other will not believe him. Whence if it appear to be possible that a person should say a false thing on purpose that he to whom it is said may not be deceived, on the other hand there is this opposite case, the case of a person saying the truth on purpose that he may deceive. For if a man determines to say a true thing because he perceives he is not believed, that man speaks truth on purpose that he may deceive: for he knows or thinks that what is said may be accounted false, just because it is spoken by him. Wherefore in saying a true thing on purpose that it may be thought false, he says a true thing on purpose to deceive. So that it may be inquired, which rather lies: he who says a false thing that he may not deceive, or he who says a true thing that he may deceive? The one knowing or thinking that he says a false thing, and the other knowing or thinking that he says a true thing? For we have already said that the person who does not know the thing to be false which he utters, does not lie if he thinks it to be true; and that that person rather lies who utters even a true thing when he thinks it false: because it is by the sense of their mind that they are to be judged. Concerning these persons therefore, whom we have set forth, there is no small question. The one, who knows or thinks he says a false thing, and says it on purpose that he may not deceive: as, if he knows a certain road to be beset by robbers, and fearing lest some person for whose safety he is anxious should go by that road, which person he knows does not trust him, should tell him that that road has no robbers, on purpose that he may not go by it, as he will think there are robbers there precisely because the other has told him there are none, and he is resolved not to believe him, accounting him a liar. The other, who knowing or thinking that to be true which he says, says it on purpose that he may deceive: for instance, if he tells a person who does not believe him, that there are robbers in that road where he really knows them to be, that he to whom he tells it may the rather go by that road and so fall among robbers, because he thinks that to be false, which the other told him. Which then of these lies? The one who has chosen to say a false thing that he may not deceive? Or the other who has chosen to say a true thing that he may deceive? That one, who in saying a false thing aimed that he to whom he spoke should follow the truth? Or this one, who in saying a true thing aimed that he to whom he spoke should follow a falsehood? Or haply have both lied? The one, because he wished to say a false thing: the other, because he wished to deceive? Or rather, has neither lied? Not the one, because he had the will not to deceive: not the other, because he had the will to speak the truth? For the question is not now which of them sinned, but which of them lied: as indeed it is presently seen that the latter sinned, because by speaking a truth he brought it about that a person should fall among robbers, and that the former has not sinned, or even has done good, because by speaking a false thing he has been the means of a person's avoiding destruction.

  For if a lie is an utterance with will of uttering a false thing, that man has rather lied who willed to say a false thing, and said what he willed, albeit he said it of set purpose not to deceive. But if a lie is any utterance whatever with will to deceive; then not the former has lied, but the latter, who even in speaking truth willed to deceive. And if a lie is an utterance with will of any falsity, both have lied; because both the former willed his utterance to be false, and the latter willed a false thing to be believed concerning his utterance which was true. Further, if a lie is an utterance of a person wishing to utter a false thing that he may deceive, neither has lied; because both the former in saying a false thing had the will to make a true thing believed, and the latter to say a true thing in order that he might make a false thing believed. We shall be clear then of all rashness and all lying, if, what we know to be true or right to be believed, we utter when need is, and wish to make that thing believed which we utter.

  I'd like to get the mechanics of this right before I lend a version of it to my narrator. Could you help me reconstruct: first, exactly how the two travelers on the dangerous road are meant to be mirror images of each other with respect to Augustine's two conditions; second, why he explicitly refuses to settle the question by simply asking who caused harm and who caused good; and third, whether the closing rule he proposes ("We shall be clear then of all rashness and all lying, if...") actually adjudicates among the four rival definitions of a lie he has just run through, or whether it quietly changes the subject instead. I want to know whether there is a genuinely rigorous position buried in here, or whether his absolutism about lying is, at this exact joint, resting on an unresolved equivocation.
