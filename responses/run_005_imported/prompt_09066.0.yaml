answer: |-
  You've hit upon one of the most enduring and sophisticated debates in philosophy of time and logic. Your understanding of Aristotle's challenge and Łukasiewicz's solution is accurate, but contemporary logicians have developed nuanced positions that aim to preserve classical bivalence *without* fatalism. Here are the key strategies they employ:

  1.  **The Ockhamist Solution (Thin Red Line / Actual Future):**
      *   **Core Idea:** Future contingents *are* true or false today, but this **does not imply necessity or causal determinism**. Truth is about *how things actually turn out* in the single, concrete, unfolding history of the world (the "thin red line" or "actual future").
      *   **Mechanism:** They utilize branching time models (like Arthur Prior's or Richmond Thomason's). The future branches into multiple possibilities representing what *could* happen. Crucially, one branch is designated as the *actual* future branch.
      *   **Truth Conditions:** "There will be a sea battle tomorrow" is true *today* if and only if *on the actual future branch*, there is a sea battle tomorrow. It is false if on the actual branch, there is no sea battle tomorrow.
      *   **Blocking Fatalism:** Truth is grounded in the actual course of events, which is contingent. That the actual future *will* contain a sea battle (making the statement true today) does *not* mean that sea battle is *necessary* or *causally determined* today. Other branches (possibilities) remain open until the moment of decision/action. The truth of the statement simply reflects the eventual outcome within the single timeline of actuality.
      *   **Bivalence Preserved:** Every future contingent is either true (if it holds on the actual branch) or false (if it doesn't). No third value.

  2.  **Supervaluationism (Truth as Inevitability):**
      *   **Core Idea:** Future contingents are **neither true nor false *today***, but bivalence is preserved *retrospectively*. Truth requires *inevitability* or *settledness*.
      *   **Mechanism:** Also uses branching time models. A statement is true at a time if it is true *on all branches* passing through that time (it's inevitable). It's false if false on all branches (impossible). If it's true on some branches and false on others (contingent), it is *indeterminate* (neither true nor false) *at that time*.
      *   **Bivalence Preserved?:** *At a specific moment*, a contingent future statement lacks a truth value. However, **bivalence holds globally**: once the future event occurs (or doesn't), looking back, the statement *was* either determinately true or false all along. When the sea battle happens tomorrow, "There will be a sea battle tomorrow" *was* true yesterday. Supervaluationism denies *present* bivalence for contingents but preserves the idea that every statement *is* (timelessly) either true or false; its *truth-value-at-a-time* just depends on the structure of the future at that time.
      *   **Blocking Fatalism:** Since truth requires inevitability, the mere fact that a sea battle *will* happen (making the statement true *later*) doesn't mean it *had* to happen when it was still contingent. The indeterminacy at the earlier time reflects the genuine openness.

  3.  **The Peircean Solution (Truth *Only* as Inevitability):**
      *   **Core Idea:** The *only* future-tensed statements that are true *now* are those describing what is **now inevitable**. Genuine future contingents are simply **false**.
      *   **Mechanism:** (Inspired by C.S. Peirce). "There will be a sea battle tomorrow" is true now *only* if a sea battle is now inevitable/necessary. If it's merely possible (contingent), the statement is *false* now. "There will be *no* sea battle tomorrow" is similarly false now if a sea battle is possible. Only statements like "There will be a sea battle tomorrow or there will not be a sea battle tomorrow" are true now (as they are inevitable).
      *   **Bivalence Preserved?:** Technically yes: every statement is true or false. But it's highly revisionist. "There will be a sea battle tomorrow" is false *even if* a sea battle *does* occur tomorrow, simply because it wasn't *inevitable* when uttered. This clashes strongly with our ordinary use of "will".
      *   **Blocking Fatalism:** Truth being limited to the inevitable directly avoids attributing determinate truth to contingents. However, its cost is significant semantic revision.

  **Why Classical Semantics Persists (Despite Łukasiewicz):**

  1.  **Simplicity and Power:** Classical logic is incredibly well-understood, powerful, and integrated into vast areas of mathematics, computer science, and other branches of philosophy. Adopting a non-classical logic introduces significant complexity.
  2.  **Rejecting the Fatalism Inference:** Proponents argue Aristotle's inference (Bivalence -> Fatalism) is invalid. They claim it commits a modal fallacy: confusing "It is true that P" (which they see as a fact about the world's unfolding) with "It is *necessary* that P". They insist truth *simpliciter* does not entail causal or metaphysical necessity. The Ockhamist embodies this view.
  3.  **Accommodation within Classical Framework:** Ockhamism and Supervaluationism show ways to model future contingency *using* essentially classical structures (branching time + actual branch or supervaluations over histories) while offering formally precise accounts that avoid fatalism. They provide tools to articulate the distinctions needed.
  4.  **Discomfort with Truth-Value Gaps:** Many philosophers find the idea of propositions being neither true nor false metaphysically problematic or incompatible with a robust correspondence theory of truth. Ockhamism avoids gaps; Supervaluationism limits them to the present perspective but ensures global bivalence.
  5.  **The "Retrospective" Intuition:** There's a strong intuition that *after* the sea battle, we want to say "It *was* true yesterday that it would happen." Łukasiewicz struggles with this. Ockhamism embraces it directly. Supervaluationism secures it retrospectively. Peirceanism explicitly rejects it for contingents.

  **Conclusion:**

  You are not missing a simple "move," but rather the development of sophisticated frameworks designed precisely to address the tension you identify. The dominance of classical semantics isn't necessarily an "unacknowledged inconsistency," but rather reflects:

  *   **The Enduring Appeal of Ockhamism:** Many find the distinction between *truth* (actual outcome) and *necessity* compelling and sufficient to block fatalism while preserving a straightforward notion of truth and bivalence.
  *   **The Technical Sophistication of Supervaluationism:** It offers a way to model openness without abandoning classical truth conditions, accepting local gaps but preserving global bivalence.
  *   **A Rejection of the Equivalence:** A widespread belief that the fatalism argument rests on a conflation of truth and necessity.

  Łukasiewicz's three-valued approach remains a viable and important position, championed by philosophers like Jan Łukasiewicz himself, A.N. Prior (in some moods), and more recently, Patrick Greenough. However, the field has largely judged that the resources within (or closely adjacent to) classical logic – particularly Ockhamism and Supervaluationism – offer more powerful, intuitive, or metaphysically satisfying ways to reconcile bivalence with genuine future contingency and avoid fatalism. The debate is very much alive, but the persistence of classical semantics reflects these developed alternatives rather than inconsistency.
