  But the indulgence analogy is also sharp. There's a whiff of self-deception here - they're both getting to indulge while feeling virtuous. The key difference, though, is that indulgences were fictional moral credits, whereas here there's real-world impact: cage-free campaigns actually reduce animal suffering. 

