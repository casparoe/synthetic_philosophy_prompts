answer: |-
  Here are 10 targeted questions designed to probe the tensions and internal debates within textualism, complete with likely-follow-ups. They push beyond restatement and into justification, conflict, and falsifiability:

  1.  **Core Tension - Absurdity & Scrivener's Error:** "Textualism famously rejects seeking legislative purpose, yet it carves out exceptions for absurd results and scrivener's errors. How do you rigorously define 'absurdity' or 'scrivener's error' *exclusively* through textual evidence and linguistic canons, without implicitly invoking judgments about what Congress *must have intended* or *would have wanted* given the overall statutory scheme or purpose?"
      *   *Likely Answer/Focus:* "Linguistic canons, context within the statute, dictionary definitions at the time, avoiding results that defy basic logic or render other provisions meaningless."
      *   **Follow-Up:** "But isn't the judgment that a result 'defies basic logic' or 'renders other provisions meaningless' inherently a purposive one? Doesn't it require assuming Congress intended a *rational* or *coherent* scheme – a purpose – rather than just reading the words as written, even if they lead to an outcome *you* find nonsensical? Where's the bright line between textual incoherence and a purpose you dislike?"

  2.  **Paradigm Case - Holy Trinity:** "Church of the Holy Trinity is often cited as the archetypal case textualism was built to overturn – purpose overriding clear text. Beyond just disagreeing with the outcome, what specific *textual tools* or *linguistic principles* available to a modern textualist would compel the *opposite* result (upholding the fine) in Holy Trinity? How do those tools definitively overcome the overwhelming evidence of Congress's actual, specific purpose regarding labor?"
      *   *Likely Answer/Focus:* "The plain meaning of 'laborer'/'workman' at the time, the rule against surplusage (the specific exceptions list), the statute's specific *linguistic* context."
      *   **Follow-Up:** "If the evidence of Congress's *actual, specific purpose* (to exclude *all* contracted foreign labor, including ministers) is so overwhelming and uncontradicted by the text's *broader context* (the statute's title, legislative history), doesn't textualism's insistence on ignoring that purpose, even when the text is arguably ambiguous *in isolation*, risk elevating a rigid formalism over the demonstrable reality of what the law was designed to do? Isn't that the core critique Holy Trinity represents?"

  3.  **Internal Split - Bostock:** "Bostock v. Clayton County exposed a deep fracture among textualists. Gorsuch's majority focused on the 'but-for' cause of the discrimination and ordinary meaning of 'sex,' while Alito/Kavanaugh emphasized perceived societal expectations and the 'fundamental' nature of the change. Setting aside who was 'right,' what does this split reveal about the potential *indeterminacy* of textualist methodology when applied to complex social concepts? Can both sides genuinely claim textualism, or does one side inevitably import extra-textual assumptions?"
      *   *Likely Answer/Focus:* "Gorsuch correctly applied but-for causation and ordinary meaning; Alito/Kavanaugh smuggled in policy concerns about scope. Textualism provides the tools, but judges can misapply them."
      *   **Follow-Up:** "If textualism's core tools (ordinary meaning, but-for causation) can lead such sophisticated textualist jurists to diametrically opposed conclusions on a landmark case, doesn't that suggest the methodology itself lacks sufficient constraining power? Doesn't the choice of *which* linguistic tools to prioritize (dictionaries, causation tests, semantic ranges) become the critical – and potentially subjective – decision point?"

  4.  **Canon or Purpose? - Elephants in Mouseholes:** "Scalia's 'elephants in mouseholes' principle from Whitman v. American Trucking asserts Congress doesn't hide major policy changes in vague or ancillary statutory language. Is this best understood as: (A) a genuine *linguistic canon* about how language communicates importance (e.g., via specificity, placement), empirically verifiable? Or (B) a *purposive assumption* about how a rational legislature *ought* to operate, smuggled in under textualist cover? How do you justify it purely textually?"
      *   *Likely Answer/Focus:* "It's a linguistic canon based on how language conveys significance; major changes require clear statements. Reflects how language works in context."
      *   **Follow-Up:** "But isn't the judgment of what constitutes an 'elephant' (a major policy change) versus a 'mousehole' (ambiguous/vague language) fundamentally a *substantive, purposive judgment* about the *importance* of the issue and Congress's *likely intent* regarding delegation? Doesn't this principle functionally require the judge to assess the *significance* of the statutory change relative to other statutes/policies – an assessment inherently outside the four corners of the text being interpreted?"

  5.  **Judicial Role - Dynamic vs. Static:** "Textualism emphasizes the fixed meaning of the text at enactment. How does this view reconcile with the undeniable reality that societal understandings of words (like 'sex' in Bostock, 'cruel and unusual,' 'commerce') evolve, and that Congress often *relies* on courts interpreting old statutes in light of new circumstances? Doesn't strict fixation risk making statutes irrelevant or produce results Congress *never* anticipated or desired, ironically undermining legislative supremacy?"
      *   *Likely Answer/Focus:* "Congress can update statutes. Courts apply the law as written, not update it. Original public meaning captures how words were understood."
      *   **Follow-Up:** "But isn't there a tension? If Congress *knows* courts will rigidly apply original meanings regardless of societal evolution, doesn't that impose an unrealistic burden on Congress to constantly update statutes? And if Congress *expects* courts to apply statutes pragmatically over time (a form of delegation), is textualism actually frustrating, rather than effectuating, legislative intent?"

  6.  **Legislative History - The Forbidden Fruit:** "Textualists categorically reject reliance on legislative history as indicative of intent. Yet, isn't legislative history sometimes the *best evidence* of how a specific, ambiguous term was understood by the enacting Congress? By excluding it entirely, even when it directly clarifies textual ambiguity, does textualism risk *increasing* judicial subjectivity by forcing judges to rely *only* on dictionaries and canons, which are often equally manipulable?"
      *   *Likely Answer/Focus:* "Legislative history is unreliable, manipulable, and not voted on. Text is the law. Canons and dictionaries are objective tools."
      *   **Follow-Up:** "But if multiple committee reports, sponsor statements, and floor debates *convergently* clarify the intended meaning of a genuinely ambiguous phrase, and using that history would lead to a result *more consistent* with the enacted text in its full context, isn't the textualist's categorical exclusion an act of willful blindness that *increases* the chance of misinterpretation based on the judge's chosen canon or dictionary definition?"

  7.  **The "Whole Text" Challenge:** "Textualism insists on reading words in context – the whole statute, related statutes. But doesn't 'context' inevitably bleed into understanding the *purpose* or *scheme* the text is creating? How do you rigorously distinguish between using context to clarify the *semantic meaning* of a word or phrase and using context to divine the *functional purpose* the text is serving?"
      *   *Likely Answer/Focus:* "Context provides linguistic clues (e.g., surrounding words, structure, definitions within the act). Purpose is an external, unenacted intention."
      *   **Follow-Up:** "When you use the structure of the statute (e.g., titles, chapter headings, the relationship between provisions) to interpret an ambiguous term, aren't you inherently making inferences about the *organizing principle* or *functional goal* Congress had in mind when structuring it that way? How is that fundamentally different from inferring purpose?"

  8.  **Falsifiability - Kagan's Challenge:** "Justice Kagan quipped 'we're all textualists now.' If textualism is truly the superior, most constraining methodology, what specific, observable pattern in judicial outcomes or reasoning *would* constitute convincing evidence *against* it? Short of judges explicitly renouncing text, what empirical result would make you reconsider textualism's descriptive accuracy or normative force?"
      *   *Likely Answer/Focus:* "If judges routinely achieved desired policy outcomes by blatantly ignoring clear text without using recognized textualist tools/canons/exceptions."
      *   **Follow-Up:** "But isn't that a very high bar? Given the flexibility inherent in choosing *which* textual tool to apply (as Bostock showed), defining 'absurdity,' or determining the 'ordinary meaning' of complex terms, couldn't textualism be used to reach almost any result a judge desires *while still claiming fidelity to text*? If so, how is it meaningfully constraining or falsifiable? What pattern *within the bounds of claimed textualism* would worry you?"

  **Key for the Novelist:**

  *   Listen for how the professor navigates the tension between formalism and the practical need to avoid truly nonsensical results. Does he concede a tiny bit of purpose, or insist on pure text even unto absurdity?
  *   On Holy Trinity, does his defense of the textualist outcome feel convincing, or like an exercise in ignoring reality?
  *   On Bostock, where does his sympathy lie? Does he acknowledge the methodological indeterminacy, or just assert Gorsuch was "right"?
  *   On Elephants/Mouseholes, does he honestly grapple with its purposive core, or try to dress it up linguistically?
  *   The Kagan question is crucial for your judge's self-awareness. Does the professor have a genuine answer for what would falsify textualism, or does he retreat to "it's just the right way"?

  These questions should force your professor beyond rote recitation and into the contested heart of textualist practice, giving you rich material to make your judge's convictions feel hard-won and complex. Good luck with the interview and the novel!
