  First, the brother's behaviors: canceling plans last minute, forgetting birthdays, borrowing money and not repaying until reminded. When the user gets upset, the brother uses his ADHD diagnosis as a defense, making the user feel guilty. To cope, the user has stopped expecting anything from him—planning for flakiness, not mentioning money, forgiving in advance. But this approach feels like they're treating him like a child or a pet, not an equal. The user feels worse despite less fighting. The core question: is it fair to hold these things against him, or is there a way to be annoyed without being unfair?

  I need to validate the user's feelings. They're not wrong for feeling hurt; anyone would. The brother's actions have real consequences. But ADHD does explain some behaviors—executive dysfunction affects memory, time management, impulse control. However, the brother's response when confronted is problematic. Using ADHD as a shield instead of taking responsibility isn't okay. The user's current coping mechanism—lowering expectations—is practical but leads to emotional distance, which is why they feel like they're treating him as less capable.

  The key here is balance. The brother needs to take responsibility. ADHD is a reason, not an excuse. The user shouldn't have to suppress their feelings. They need strategies that acknowledge ADHD while setting boundaries. For example, the brother could use reminders for birthdays or commitments. The user could express their feelings using "I" statements without blaming. Also, discussing the impact of his actions on their relationship might help him understand the need for effort.

  The user's deeper needs might include wanting a genuine connection where they feel valued, not just managing conflicts. They might fear enabling him or losing respect. They need mutual respect where both parties try. The solution involves communication, collaborative strategies, and the brother showing initiative. If he refuses to work on things, that's on him, not the ADHD. The user deserves to have their needs met without guilt.
answer: |-
  You've articulated an incredibly common and painful dilemma with remarkable clarity. Your brother isn't entirely wrong, but neither are you. This isn't an either/or situation – it's about finding a balance that respects both his neurological reality **and** your emotional needs. Here's a breakdown:

  1.  **ADHD is Real and Explains, But Doesn't *Excuse*:**
      *   **The Reality:** His struggles (forgetfulness, time blindness, impulsivity with money, difficulty initiating tasks like repayment) are core ADHD symptoms. His brain genuinely works differently. The effort required for him to remember your birthday or repay you *is* significantly higher than for a neurotypical person.
      *   **The Limit:** Using "you know how my brain works" as a *shutdown* to avoid any accountability is where it becomes problematic. ADHD is a *reason*, not a universal *get-out-of-jail-free card*. It doesn't absolve him of the responsibility to *try* to develop strategies or acknowledge the impact of his actions on others.

  2.  **Your Current Strategy (Lowered Expectations) is Understandable but Harmful:**
      *   **Why You Did It:** You protected yourself from repeated hurt and conflict. That's self-preservation, and it's valid.
      *   **Why It Feels Bad:** You've identified the core issue perfectly. Treating him like a toddler or a dog inherently strips him of agency and dignity. It lowers the relationship to caretaker/charge, not siblings. It denies both of you the possibility of a genuine, reciprocal adult connection. It also means *your* needs (for reliability, thoughtfulness, reciprocity) are perpetually sidelined.

  3.  **You ABSOLUTELY "Get to Hold This Against Him" (Within Reason):**
      *   **Your Feelings are Valid:** Feeling hurt, forgotten, used, or disrespected by his actions is completely understandable and fair. ADHD doesn't make those actions *feel* different to the person on the receiving end.
      *   **The Target of Your Annoyance Matters:** Being annoyed at *the impact of his symptoms* is fair. Being annoyed specifically at *his lack of effort to manage those symptoms* or *his refusal to acknowledge the impact* is crucial and fair. Being annoyed at *him as a person* for having ADHD isn't fair.
      *   **The Key Distinction:** Holding him accountable ≠ Judging him as a bad person. It means expecting him to engage in the *process* of managing his ADHD in ways that respect the relationship.

  **How to Navigate This (Moving Beyond Toddler/Dog Mode):**

  1.  **Shift the Conversation from Blame to Collaboration & Impact:**
      *   **"I" Statements Focused on Impact:** Instead of "You forgot my birthday *again*!" try: "When my birthday passes without hearing from you, it makes me feel forgotten and unimportant, even though I know that's not your intention."
      *   **Focus on the Relationship:** "Our relationship is important to me. When plans get canceled last minute frequently, it makes it hard for me to feel like I can rely on you, and that hurts."
      *   **Acknowledge the ADHD:** "I know your ADHD makes remembering dates/time management/really hard. That's why I'm bringing this up – I want to figure out how we can work *with* that so we both feel better."

  2.  **Set Boundaries *With* Strategies (Not Just Lowered Expectations):**
      *   **Plans:** "I'd love to hang out on Saturday! Because last-minute changes are tough with my schedule, can you let me know by Thursday if it's still looking good? If things feel shaky for you by then, we can reschedule *now* for a better time." If he flakes without notice anyway: "Hey, I was really counting on seeing you today. When you don't show up or call, it wastes my time and makes me feel like you don't value it. Next time, please shoot me a text if things change, even last minute." Then, *follow through* – don't prioritize plans with him if he consistently abuses this.
      *   **Birthdays/Gifts:** "I know remembering dates is tough. Would it help if I sent you a reminder a week before my birthday? Or maybe we could just agree to celebrate sometime *around* the date when it works better?" If he forgets entirely despite strategies: "It really hurt my feelings that my birthday passed without hearing from you, especially after we talked about it. I need you to find a system that works."
      *   **Money:** **STOP LENDING MONEY.** This is a crucial boundary. "I love you, but lending you money hasn't worked out well in the past, so I'm not comfortable doing it anymore." If he asks why: "Because it creates stress for me when repayment doesn't happen as agreed, and I don't want that between us." If he owes you money *now*: "Let's figure out a concrete, written repayment plan that works for you, even if it's $5 a week. I need this resolved so it doesn't hang over us."

  3.  **Expect Effort, Not Perfection:**
      *   The goal isn't for him to magically become neurotypical. The goal is for him to demonstrate *awareness* and *effort*.
      *   **Look For:** Is he apologizing sincerely *without* immediately deflecting to "but my brain..."? Is he *actively* trying to use strategies you discussed? Is he showing any initiative in finding solutions ("Hey, I put your birthday in my phone with 3 alerts this year!")? Is he acknowledging the *impact* on you ("I know it sucks when I cancel, I'm really trying to manage my time better")?
      *   If he shows *effort* but still slips up, your annoyance can be tempered with understanding. If he shows *no effort* and just uses ADHD as a shield, your annoyance is entirely justified.

  4.  **Protect Yourself Without Diminishing Him:**
      *   **Plan Backups:** Have a backup plan for events you *really* care about (like your birthday dinner) if you invite him. Don't center events solely around him.
      *   **Manage Your Investment:** Enjoy his company when it happens spontaneously or when plans work. Don't pour excessive emotional energy into plans likely to fall through.
      *   **Accept What You Can't Change:** Accept that he may *never* be perfectly reliable or remember every date. But *don't* accept zero effort or disregard for your feelings.

  **The Crucial Question for Your Brother:** Is he willing to partner with you? Is he willing to acknowledge that while his *struggles* are due to ADHD, the *impact* on you is real and requires mutual effort to mitigate? Or is he using his diagnosis as a shield to avoid all responsibility?

  **You are not a jerk.** You are a sibling who wants a reciprocal, respectful relationship. True understanding of ADHD means recognizing both the challenges it creates *and* the responsibility the person with ADHD has to manage it in ways that consider others. It's entirely possible (and necessary) to hold both compassion for his struggles *and* reasonable expectations for effort and accountability. If he refuses to engage in that process, the emotional distance you feel isn't you treating him like a toddler – it's the natural consequence of an unbalanced relationship.
