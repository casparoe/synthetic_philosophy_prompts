  Okay, this is gonna sound like an oddly specific thing to be hung up on, but here goes. I got into prediction markets a few months back (Polymarket during the election, and now I've got small money sitting in a couple of Fed meeting markets too), and last week someone sent me the Milgrom-Stokey no-trade theorem just to mess with me: the result that if traders share a common prior and everyone's rational, the mere fact that someone is willing to take the other side of your bet should make you update in a way that makes the trade unravel, so no trade based purely on private information should happen at all. Obviously real markets are full of trades, so something in that setup breaks down in practice, and I cant stop wondering what Keynes would've said about it -- Mr. Beauty-Contest, Mr. Animal Spirits, and himself a fairly reckless currency speculator and college-endowment fund manager -- given he died decades before this game theory (or anything like Polymarket) existed. Would he say the theorem is technically fine but beside the point because real markets were never really in the business of aggregating information in the first place, or would he take it as backing for his own suspicion that prices mostly track guesses about other people's guesses rather than fundamentals? I want you to actually reconstruct how he'd have argued it, not just give me the one-line "markets are driven by psychology" answer that already gets said in his name.
