  The discursive dilemma shows that consistent individual judgments can lead to inconsistent group outcomes. This is tied to broader impossibility theorems, like List and Pettit's, which prove that no aggregation rule can always satisfy basic desiderata when judgments are interconnected. The user is likely looking for validation that their situation is a recognized theoretical problem and guidance on best practices for committees.

