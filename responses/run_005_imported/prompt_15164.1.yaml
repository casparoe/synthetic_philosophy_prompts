  Hmm, this is ethically thorny. The user is clearly looking for nuanced philosophical engagement, not just bureaucratic boilerplate. As a philosophy PhD themselves, they'll expect rigorous argumentation. The memo needs to balance institutional integrity with compassion, while acknowledging the real-world consequences of visa termination.

  First, I should acknowledge the strongest case for substitution: the catastrophic collateral damage to the offender (visa termination/career destruction) versus the voluntary sacrifice by an innocent party who understands the consequences. There's also precedent with the lab absorbing fines. 

  But the counterarguments are weighty: sanctions exist to rehabilitate the offender, deter others, and uphold institutional credibility. Transferring punishment undermines all three. The offender wouldn't experience consequences, others might see fabrication as less risky if punishment is transferrable, and the university looks inconsistent. 

  David Lewis's penal substitution theory is relevant but limited - it works in legal contexts where punishment is purely retributive, but academic sanctions are rehabilitative. The offender needs to confront the fallout of their actions. 

  Practically, allowing this could set a dangerous precedent. What if the substitute later regrets it? Or if wealthy students pay others to take punishments? The integrity system could unravel. 

  Still, the visa consequence feels disproportionate. Maybe a counterproposal: shorten the suspension but add intensive ethics training and community service, allowing visa preservation. The innocent co-author could contribute to her restitution somehow without taking the punishment. 

  The memo should recommend denying the substitution but offering alternative sanctions that prevent visa termination while maintaining accountability. Timeline: 2 weeks for offender to propose a modified sanction plan incorporating rehabilitation elements. 

