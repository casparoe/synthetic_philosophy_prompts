   1. For Row, strategy C is strictly dominated by a mixed strategy (say, 50% A and 50% B) but not by either A or B alone.

   2. This means that for every possible pure strategy of Column (X, Y, Z), the payoff of playing C is strictly less than the payoff of the mixed strategy (0.5*A + 0.5*B).

   3. However, when comparing pure strategies:
      - C is not dominated by A: meaning there is at least one column where C gives a higher payoff than A (so A doesn't dominate C).
      - C is not dominated by B: meaning there is at least one column where C gives a higher payoff than B.

   Let me design the payoffs for Row (we are only concerned with Row's payoffs for this elimination):

          | Column X | Column Y | Column Z
