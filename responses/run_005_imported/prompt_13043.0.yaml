          In Y: A=4, C=1 -> C does not beat A (1<4).
          In Z: A=3, C=2 -> no.

     But we only need at least one column where C beats A? We have X: 1>0 -> so A does not dominate C (because in X, C is better than A).

     Similarly, for B:
          In X: B=4, C=1 -> 1<4 -> so C not better than B in X.
          In Y: B=0, C=1 -> 1>0 -> so in Y, C beats B -> so B does not dominate C.

     So now we have:

          X: A=0, B=4, C=1
          Y: A=4, B=0, C=1
          Z: A=3, B=3, C=2

     Let's write the matrix:

          | X   | Y   | Z
      ----|-----|-----|-----
      A | 0   | 4   | 3
      B | 4   | 0   | 3
      C | 1   | 1   | 2

