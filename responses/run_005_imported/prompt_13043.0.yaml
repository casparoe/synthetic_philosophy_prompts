     We can have:
          In X: c1=1 > a1=0? But we already set a1=4 and c1=1 -> c1=1 < a1=4 -> so in X, A beats C.

     We need a column where C beats A. Let me change the setup.

     How about:

          X: A gets 0, B gets 4, C gets 1 -> mix: (0+4)/2 = 2 > 1 -> holds.
          Y: A gets 4, B gets 0, C gets 1 -> mix: (4+0)/2 = 2 > 1 -> holds.
          Z: We set A=0, B=0, C=3 -> but then mix=0 which is less than 3 -> doesn't hold.

