  Been going down a game theory rabbit hole for a multi-agent RL side project and got stuck on iterated elimination of dominated strategies. Every intro explanation I find only ever kills off a strategy when some other pure strategy beats it outright, but I keep running into offhand mentions of strategies that only get eliminated once you let the dominating strategy be a mix of two others. Could you cook up an actual small payoff matrix (say 3 of my strategies against however many of the opponent's you need) where none of my pure strategies dominates another, but one of them still gets strictly dominated by some mix of the remaining two? Also explain in plain terms why killing that strategy off is still legit even tho the "winning" mix never once beats it head-to-head as a pure strategy.
