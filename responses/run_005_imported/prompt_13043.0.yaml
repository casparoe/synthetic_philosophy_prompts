     So we have the desired example.

   Why is it legitimate to eliminate C?

     The idea of strict dominance is: if there exists a strategy (which can be pure or mixed) that gives a strictly better payoff for every possible action of the opponent, then the dominated strategy (C) can be eliminated because a rational player would never play it.

     In this case, the mixed strategy (playing A and B with 50% chance each) yields a strictly higher payoff than C no matter what the opponent does. Therefore, a rational player would prefer to use the mixed strategy over C.

     Note: The player doesn't have to actually randomize. The fact that there exists a mixed strategy that dominates C means that the player can achieve a better outcome by sometimes playing A and sometimes playing B (according to that mix) than by always playing C. 

     Since the player is assumed to be rational and expected utility maximizing, they would avoid C. Even if the player does not randomize, they might choose a pure strategy that is part of the mix, but note: the mix is strictly better than C in every contingency. Therefore, regardless of the opponent's move, the mix does better. This makes C an inferior choice.

     Importantly, the elimination by a mixed strategy is valid because it relies on the fundamental concept of dominance: a strategy is strictly dominated if there is another strategy (pure or mixed) that yields a strictly higher payoff for every possible opponent action.

     In our example, the mixed strategy (0.5A, 0.5B) is that dominating strategy.

