      Row A |    a1   |    a2   |    a3
      Row B |    b1   |    b2   |    b3
      Row C |    c1   |    c2   |    c3

   Conditions for C not dominated by A:
     There exists at least one column j such that c_j > a_j.

   Conditions for C not dominated by B:
     There exists at least one column j such that c_j > b_j.

   Condition for C dominated by a 50-50 mix of A and B:
     For every column j (X, Y, Z):
          0.5 * a_j + 0.5 * b_j > c_j

   Let me try to assign numbers.

   Example:

