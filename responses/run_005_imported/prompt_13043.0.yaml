     So we must set c3 to be less than the mix. Let me set c3 to 0. Then in Z:
          mix = 0.5*0 + 0.5*0 = 0, which is not greater than c3=0 (it's equal). We need strict.

     Therefore, we must have in every column the mix strictly greater than c_j. So in Z, we need:
          0.5*a3 + 0.5*b3 > c3.

