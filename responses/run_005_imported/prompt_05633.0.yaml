answer: |-
  Here’s a concise, actionable memo for your zoning board that addresses the philosophical tension while delivering a clear recommendation:

  ---

  **MEMORANDUM**  
  **TO:** Zoning Board of Appeals Members  
  **FROM:** [Your Name]  
  **DATE:** October 26, 2023  
  **RE:** Application #2023-ADU-114 (Detached ADU at [Address]); Hearing Thursday, October 26  
  **RECOMMENDATION: GRANT PERMIT WITH CONDITIONS**  

  ### I. Core Conflict: Names vs. Actualities  
  The applicant argues the **name "accessory dwelling unit"** (ADU) categorically excludes it from being a "family" or "dwelling unit" under our bylaws. Per state law, ADUs are "accessory to" a primary home and thus, they claim, cannot alter the lot’s "single-family" status.  

  Opponents argue **actual use** defines the property: two distinct households (unrelated tenants, separate leases/utilities) functionally create a two-family reality, regardless of labels. The ADU’s "accessory" label, they contend, is a semantic shield obscuring material impacts (parking, density, neighborhood character).  

  ### II. Analysis: Why the "Name" Argument Prevails (with Caveats)  
  1. **State Law Preemption**:  
     - The state ADU statute (M.G.L. c. 40A § 3) explicitly overrides local zoning to permit ADUs "by right" in single-family districts. Denial based on tenant kinship likely violates this.  
     - **Key nuance**: The law defines ADUs as "subordinate" but does *not* restrict tenancy. Our bylaw’s "family" definition applies to the *primary* residence; it is silent on ADU occupancy.  

  2. **The "White Horse" Logic Applied**:  
     - **Gongsun Long’s insight holds**: "Accessory" *names* a specific relationship (subordinate, incidental) to the primary dwelling. A standalone house is "a horse." An ADU is a "white horse" – it satisfies "accessory" only if it meets size, location, and design criteria, *not* based on occupancy.  
     - **But**: Opponents channel Xunzi – names must track realities. **Rebuttal**: The "reality" regulated here is physical development (scale, use intensity), not social arrangements. State law intentionally decouples ADUs from kinship to expand housing.  

  3. **Practical Impacts Aren’t Zoning Violations**:  
     - Parking, noise, or density concerns are valid but **not grounds for denial**. They must be addressed via:  
       - General bylaws (e.g., parking space mandates)  
       - Design/operational conditions (see *Recommendation*)  
       - Future zoning amendments (e.g., ADU occupancy caps).  

  ### III. Recommendation: Approve with Conditions  
  **GRANT** the permit subject to:  
  1. **Design Subordination**:  
     - Maximum ADU square footage ≤ 50% of primary dwelling.  
     - Architectural consistency with primary residence (materials, roofline).  
  2. **Operational Limits**:  
     - No short-term rentals (e.g., <30 days) to align with "accessory" residential use.  
     - Owner occupancy required in *either* primary dwelling *or* ADU (ensures oversight).  
  3. **Parking Mitigation**:  
     - 2 off-street parking spaces total (1 for primary + 1 for ADU) to prevent street overcrowding.  

  ### IV. Next Steps & Timeline  
  - **Thursday Hearing**: Move to approve with above conditions.  
  - **Post-Decision**:  
    - 20-day appeal window (M.G.L. c. 40A § 17).  
    - If appealed, expect Superior Court ruling in 6–12 months.  
  - **Long-Term Fix**:  
    - **Board Action**: Propose a bylaw amendment (2024 Town Meeting) defining ADU occupancy rules (e.g., "owner-occupancy required," "tenant kinship limits").  
    - **Neighbors**: Redirect energy toward drafting evidence-based amendments addressing density/parking, not litigating tenancy.  

  ### V. Why This Balances Names and Realities  
  This decision honors both the **legal name** ("accessory" = subordinate physical form) and **material realities** by imposing conditions that enforce subordination and mitigate impacts. Denying the permit misapplies the "family" definition to a use exempted by state law. Ignoring neighbor concerns invites backlash; conditions bridge the gap by ensuring the ADU *functions* as accessory in practice, not just in name.  

  ---  

  **Key Philosophical Takeaway for the Board**:  
  Gongsun Long reminds us that names create categories, but Xunzi warns that categories must serve human needs. Here, "accessory" is a valid category under state law, but we can enforce its *material intent* (subordination) through design/use conditions. This avoids the "lazy logic" of pure literalism *or* dismissing definitions entirely.  

  Let me know if you need revisions for specific bylaws/state statutes.
