  Key gaps: Both underplay the role of emotions (pride, vengeance) and imperfect information in lawsuits. The auction analogy assumes symmetric rationality, but real opponents may irrationally escalate. Also, legal costs are probabilistic—winning isn't guaranteed, unlike the auction's fixed prize.

