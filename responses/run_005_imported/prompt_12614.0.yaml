prompt: |-
  A friend of mine got into a property-line dispute with his neighbor over a strip of yard worth maybe $2,000, and by the time a court ruled in his favor he'd spent about $35,000 on lawyers -- his neighbor, who lost, spent even more. Two other friends argued about it afterward. Mara said his decision to keep fighting once he was already deep into legal fees was a textbook sunk-cost fallacy: the money already spent was gone either way, so the only sane question at each point was whether the remaining costs were worth that strip of yard, and they obviously weren't. Ben disagreed: he said the real logic at work wasn't "I've already spent so much" but "if I stop now I lose everything for certain, whereas if I keep going the neighbor might fold first" -- which he said is exactly the structure of that old experiment where a dollar gets auctioned off, except the second-highest bidder also has to pay and gets nothing, so quitting looks worse than bidding again. Mara answered that this doesn't excuse him: a genuinely rational person would have foreseen that dynamic and fixed a walk-away point in advance, so failing to do that is itself the irrational part. Ben replied that this is easy to say after the fact, since even people who are warned beforehand exactly how that auction works still tend to get pulled into overbidding once they're actually playing it, which suggests the trap runs deeper than foresight alone can fix.

  Neither of them convinced me. Could you go through the exchange move by move -- Mara's two points, then Ben's two -- and say who has the better of it at each step? I'd also like to know whether there's something about the dollar-auction idea itself, or about how well it really maps onto a lawsuit, that both of them are missing. Please give your verdict first, as a JSON object of the form {"Mara-1": <score>, "Ben-1": <score>, "Mara-2": <score>, "Ben-2": <score>}, with each score an integer from -2 (clearly mistaken) to 2 (clearly right), and then briefly justify each score.
