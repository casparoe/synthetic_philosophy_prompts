  I recall Kant's indirect duty view: cruelty to animals violates our duty to humanity by coarsening our moral character. The CI prohibits actions that corrupt rational will, not because animal suffering intrinsically matters. The user needs this distinction unpacked—they're intuitively drawn to the suffering argument but respect Kant's framework.

  Ah! The key is differentiating between the CI's formal test (can we universalize maxims?) and moral patient status. The CI evaluates maxims' rationality, not intrinsic wrongness of suffering. Animals aren't "ends" because they lack autonomy to set ends. The user's phrase "suffering has to count morally in its own right" reveals their underlying concern—they want moral weight given to experience, not just rationality.

  But Kant's ethics is will-centered, not consequence-centered. Maybe the user's deeper need is reconciling ethical intuition (animal suffering matters) with philosophical rigor. They might be seeking whether Kant can accommodate this without abandoning his system—or if they must choose between Kant and expanding moral circles.

