  First, I need to recall the exact context of Galileo's quote. The user mentioned "the Bible teaches you how to get to heaven, not how the heavens go." That's a paraphrase of what Galileo wrote to the Grand Duchess Christina. He was arguing against interpreting the Bible literally when it conflicts with scientific evidence. His point was that scripture uses figurative language to accommodate common understanding, not to provide scientific facts.

  Galileo was a devout Catholic, not an atheist. He believed science and religion could coexist if each stayed in their domain. The Church's mistake was insisting on a literal interpretation of passages that were never meant as scientific statements. For example, verses like Psalm 93:1 about the world being fixed were poetic, not astronomical claims. 

  The friend's argument assumes that if one part of the Bible is scientifically inaccurate, the whole text is unreliable. But Galileo and theologians like Augustine argued that the Bible isn't a science textbook. Its purpose is spiritual guidance. So, interpreting non-scientific passages as literal science creates unnecessary conflicts. 

  Also, the Church's reaction wasn't just about theology. Political power and the Protestant Reformation played roles. Admitting error could weaken the Church's authority during a fragile time. The real issue was institutional resistance to change, not an inherent clash between faith and science.

