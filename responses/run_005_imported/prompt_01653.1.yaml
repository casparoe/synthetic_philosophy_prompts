answer: |-
  You've pinpointed the core tension in Anscombe's argument brilliantly. Her position *is* logically complex, blending descriptive convention, a specific normative exception, and a crucial distinction about the *source* of distinction. Let's break down the logical structure:

  1.  **Descriptive Premise (What Honorary Degrees *Are*):**
      *   Honorary degrees are **not rewards for moral or intellectual merit**.
      *   They are **rewards for being a "very distinguished person."**
      *   Distinction here is primarily a **fact of public reputation and recognition**, not a judgment of inherent worthiness.
      *   Therefore, **inquiring into the candidate's "deservingness" of their distinction is generally "foolish" and "devoid of interest."** The question of merit is categorically misplaced.

  2.  **Normative Implication from Premise 1 (The General Rule):**
      *   Because they reward distinction (a public fact) rather than merit (a moral/intellectual judgment), **honorary degrees generally lie outside the realm of moral evaluation**. They are amoral gestures of recognition.
      *   **Exceptions to this amoral status are extremely rare:**
          *   A "very distinguished person" is "hardly" a "notorious criminal." (Implication: Notoriety for evil fundamentally contradicts the *kind* of distinction being honored).
          *   If they are a "non-notorious criminal," it's "improper to bring the matter up." (Implication: Private immorality doesn't invalidate the public distinction being recognized).

  3.  **The Specific Normative Exception (The Truman Case):**
      *   **Condition:** A candidate is "known everywhere for an action."
      *   **Nature of the Action:** The action is such that "it is sycophancy to honour him" in the face of it.
      *   **Consequence:** In *this specific case only*, the question of awarding the degree becomes "of the slightest interest" (i.e., morally relevant and potentially prohibitive).

  4.  **The Crucial Distinction (Carrying the Weight):**
      *   **"Very Distinguished Person" (General Case):** This describes someone whose distinction arises from a *complex amalgamation* of achievements, position, reputation, and public perception across their life/career. It's a holistic, often diffuse, public status. Honoring this status is amoral because the *basis* is multifaceted and not reducible to a single moral act.
      *   **"Known Everywhere for an Action" (Exceptional Case):** This describes someone whose *primary or defining* claim to fame/distinction is *one specific act*. The distinction *is* the act, and the act *is* the distinction in the public eye.
      *   **Why it Carries Weight for Anscombe:** The moral problem arises precisely when the *source* of the distinction *is* the morally reprehensible act itself. Honoring the distinction *in this case* becomes inseparable from honoring or condoning the act. It transforms the honorary degree from a neutral recognition of diffuse public status into **active sycophancy** – fawningly endorsing or whitewashing the specific evil act that *constitutes* the distinction.

  **Logical Structure Summary:**

  1.  **Premise:** Honorary degrees reward *distinction* (public status), not *merit* (inherent worthiness).
  2.  **Corollary 1 (General Rule):** Therefore, moral evaluation of the candidate's merit is generally irrelevant and misplaced.
  3.  **Corollary 2 (Limited Exceptions):** Exceptions only arise if the distinction *itself* is fundamentally incompatible with the honor (notorious criminal) or if honoring would require delving into private immorality (non-notorious criminal - ruled out as improper).
  4.  **Specific Exception Premise:** A distinct category exists where a person's distinction is *singularly and publicly defined* by a specific action.
  5.  **Normative Claim:** When that *specific action defining the distinction* is morally repugnant, honoring the distinction becomes an act of **sycophancy** towards the act.
  6.  **Conclusion:** In *this specific case* (where distinction = notorious act), the question of awarding the degree *does* become morally relevant and interesting (i.e., potentially grounds for opposition).

  **Addressing Your Specific Questions:**

  *   **Compatibility of Moves:** Anscombe *does* reconcile the descriptive and normative moves. The descriptive claim (**D**: degrees reward distinction, not merit) establishes the **general irrelevance of moral scrutiny**. The normative exception (**N**: sycophancy when honoring distinction defined by an evil act) applies **only when the very *basis* of the distinction *is* the morally problematic element**. **D** shields *most* candidates from moral inquiry; **N** applies only when the *source* of distinction *forces* a moral confrontation. They are compatible because **N** is a narrow caveat triggered by the *nature* of the distinction itself, not a general reopening of merit evaluation.
  *   **Role of Distinction:** The distinction between "distinguished person" (diffuse status) and "known everywhere for an action" (singular act-based status) is **essential**. It provides the logical bridge. Without it, her exception collapses into general moral evaluation, contradicting Premise 1. This distinction *does* carry the philosophical weight because it identifies the precise condition under which honoring public status becomes morally complicit endorsement.
  *   **Deeper Significance:** You're right to sense something deeper. Anscombe is arguing that institutions like Oxford have a **moral responsibility regarding the symbolic meaning of their actions**. Honoring someone whose global fame rests on a specific act (like Truman's atomic bomb decision) isn't just recognizing status; it's unavoidably interpreted as **institutional endorsement or legitimization of that act**. It's about **collective moral responsibility** – the university, by its symbolic act, becomes associated with and seemingly condones the act that defines the honoree's distinction. The "sycophancy" is towards the *power* or *consequences* of the act, not necessarily the person. It's an argument against institutional complicity in evil through symbolic gestures.

  **In essence:** Anscombe carves out a narrow but powerful exception to the general amorality of honorary degrees. She argues that when the distinction being honored *is constituted by* a notorious evil act, the act of honoring becomes an immoral act of sycophancy, implicating the institution in the evil. The distinction between diffuse distinction and act-based distinction is the linchpin making this argument work without contradicting her starting point. Her opposition to Truman stems from her belief that his global distinction *was* defined by the atomic bombings, making honoring him sycophancy towards that act.
