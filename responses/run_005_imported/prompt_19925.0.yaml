  - Two options: Suppliers A and B.
  - Choosing makes it wrong: Committing to A makes A lower quality, so A is bad. Switching to B makes B lower quality.
  - Loop: Merchant flips back and forth, never able to settle.
  - Not Newcomb's: The decision causes the outcome; it's not pre-set based on prediction without causation.

