prompt: |-
  Random ask, but I could use your brain for a scene I'm drafting. It's loosely inspired by that old decision-theory puzzle "Death in Damascus" — quick recap in case its obscure: a guy gets a meaningful glance from Death in Damascus, so he flees to Aleppo, except Death was always going to end up wherever he went, because Death had already predicted the move perfectly. The unsettling part isn't just that he can't escape — it's that whichever city he's currently planning on becomes, by that very fact, the doomed one, so he'd want to switch to the other city, then switch back once THAT one becomes doomed too. No choice ever stays put as the safe one.

  I don't want to just reskin Damascus/Aleppo, been done to death. Can you invent a totally different scenario — no death or reaper required — where a character's caught in that exact same trap? I don't mean a generic "the outcome was predicted in advance" Newcomb's-problem setup, but specifically one where settling on any option is what makes it the wrong one, so the character's stuck wanting to flip back and forth forever. Then explain in a couple sentences why your example actually has that structure and isn't just dressed-up Newcomb.
