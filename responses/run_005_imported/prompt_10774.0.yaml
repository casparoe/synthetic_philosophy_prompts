prompt: |-
  So my friend Kayla and I had this whole hour-long argument last night about norms of assertion—basically what has to be true of you before it's okay to just flatly assert something instead of hedging it. She was defending the view that solid justification is all you need, doesn't have to be knowledge, and she used this case (I think it's from Lackey? the "selfless assertion" thing) about a science teacher who doesn't personally believe in evolution but asserts it in class anyway because the evidence clearly supports it—her point being that this shows you don't even need belief, let alone knowledge, to assert properly. I pushed back with lottery ticket cases (you can be 99.9999% sure your ticket lost but it still feels off to just flatly say "it lost" before the draw) to argue knowledge has to be the real requirement, and I threw in the Moore's paradox thing too ("it's raining but I don't believe it") to say belief obviously has to matter somehow. We got nowhere and it's bugging me.

  Can you actually rate how plausible you find each of these as THE norm governing assertion, using reasoning like the stuff above rather than just textbook vibes: a truth norm, a knowledge norm, a justified/rational belief norm (justification suffices, no knowledge needed), and a mere sincere belief norm (you just need to actually believe it). Give a couple sentences on each, then your final answer as credences summing to 1, formatted as:

  ```json
  {"truth": 0.0, "knowledge": 0.0, "justified_belief": 0.0, "sincere_belief": 0.0}
  ```
