prompt: |-
  This term I am running a graduate seminar on the philosophy of action, and next week's session juxtaposes Donald Davidson's classic treatment of weakness of will in "How Is Weakness of the Will Possible?" with the hyperbolic discounting models that several of my students keep importing from behavioral economics. Davidson's puzzle turns on three individually plausible principles that jointly seem to rule out incontinent action: that judging one course of action better than another gives one a correspondingly stronger want for it, that the stronger want issues in action whenever one is free to act on either option, and yet that people plainly do sometimes choose the option they judge worse. His resolution rests on distinguishing an "all things considered" judgment, arrived at by weighing every reason available to the agent, from a merely conditional judgment reached by attending to only some of those reasons -- the akratic agent, on this account, acts on the latter while still holding the former. The discounting literature explains the same surface phenomena -- procrastination, succumbing to temptation, abandoning a diet -- quite differently: not via any mismatch between judgment and action, but via a hyperbolic rather than exponential discount function that produces a genuine reversal of preference as a reward draws nearer in time, so that the option that looked better from a distance simply stops being preferred once it is close at hand.

  What I would like from you is a rigorous comparison of these two accounts, since I suspect several of my students are too quick to treat the discounting model as merely a mechanistic underpinning of Davidson's phenomenon rather than a rival characterization of it. Concretely: does hyperbolic discounting actually model akrasia in Davidson's sense, given that a clean preference reversal may involve no moment at which the agent judges one option best all things considered and yet chooses the other -- since the evaluation itself has changed, is there really anything "weak" about acting on it? Or can the discounting story be run so that it reproduces a genuine synchronic split between judgment and action, rather than a merely diachronic change of mind? I would also welcome your own verdict, informed by however you understand the efforts of philosophers such as Alfred Mele and Richard Holton to keep these two phenomena apart, on which framework -- or what combination of the two -- better explains why weakness of will has struck philosophers as a distinctive puzzle, rather than just another instance of people changing their minds over time.
reasoning: |-
  Okay, the user is teaching a graduate seminar on the philosophy of action, specifically comparing Davidson's account of weakness of the will with hyperbolic discounting models from behavioral economics. They want a rigorous comparison because their students might be conflating the two as complementary rather than rival explanations. 

  Hmm, the core tension here is whether preference reversal via hyperbolic discounting qualifies as genuine Davidsonian akrasia. Davidson defines akrasia as acting against one's all-things-considered judgment (AOTC) at the moment of action. Hyperbolic discounting, though, seems to involve a shift in preference itself as time passes. So the key question is: when the agent chooses the immediate reward, do they still hold their previous AOTC judgment, or has their evaluation completely changed?

  Let me unpack Davidson's three principles again: 1) Better judgment implies stronger desire, 2) Stronger desire leads to action when free, 3) Yet people sometimes choose what they judge worse. His solution splits practical reasoning into conditional vs. unconditional judgments. The akratic agent acts on a judgment that's only true under specific conditions while holding an unconditional AOTC judgment. 

  For hyperbolic discounting, the discount function itself causes the preference reversal. At T1 (distant future), studying is preferred; at T2 (imminent), gaming is preferred. The user's pointed question: is there a synchronic conflict at T2? If the agent's evaluation fully shifts at T2, then they're not acting against their current judgment—they've changed their mind. That would make it diachronic shift, not akrasia.

  But maybe we can model it differently. Suppose at T2 the agent still judges studying better AOTC but feels a stronger desire to game. That would mirror Davidson. Behavioral economists like Ainslie might say the desire shift is the judgment shift. Philosophers like Mele and Holton argue otherwise. Holton's resolution willpower model suggests maintaining intentions despite fluctuating desires.

  The user probably wants to highlight why philosophers find akrasia puzzling—it's not just changing preferences but acting against your own best judgment at that moment. Hyperbolic discounting might explain the mechanism behind the desire shift but doesn't capture the normative conflict unless there's residual commitment to the long-term goal.

  Also, the user mentions Mele and Holton. Mele distinguishes between akrasia and compulsion, emphasizing intentional action against judgment. Holton focuses on abandoning resolutions. Hyperbolic discounting might align more with resolution failure than strict akrasia.

  Practical implication: Davidson's akrasia involves irrationality due to internal conflict, while hyperbolic discounting might be seen as a different kind of rationality (time-consistent but dynamically inconsistent). The puzzle is why we feel regret afterward—suggesting we still hold the AOTC judgment.

  So for the seminar, the user should stress that hyperbolic discounting only models Davidsonian akrasia if there's a synchronic conflict. Otherwise, it's a competing explanation for similar behaviors but without the same philosophical puzzle. The verdict? They're distinct phenomena requiring different frameworks, though in practice they intertwine.
answer: |-
  Here's a rigorous comparison of Davidsonian akrasia and hyperbolic discounting, structured to address your core concerns about their relationship as rival explanations rather than complementary mechanisms:

  **Core Conceptual Divergence:**
  | **Feature**               | **Davidsonian Akrasia**                          | **Hyperbolic Discounting (HD)**                |
  |---------------------------|-------------------------------------------------|-----------------------------------------------|
  | **Primary Defect**        | *Structural irrationality*: Judgment-action mismatch | *Temporal inconsistency*: Preference reversal |
  | **Locus of Conflict**     | Synchronic (at *t*-action)                      | Diachronic (between *t₁* and *t₂*)            |
  | **Evaluation Stability**  | Stable AOTC judgment at *t*-action              | Unstable valuation across time                |
  | **"Weakness" Definition** | Failure to act on *current* best judgment       | Failure to bind future selves                 |
  | **Phenomenology**         | Regret/guilt *during* or immediately post-action | Regret *after* reversal, satisfaction *during*|

  ### Addressing Your Key Questions:
  1. **Does HD Model Davidsonian Akrasia?**  
     **No**, in its standard formulation. Davidson requires an agent at *t*-action to:
     - Hold a stable, unconditional AOTC judgment ("X is best")
     - Intentionally choose ~X *despite this judgment*  
     HD involves no such synchronic conflict: at *t*-action, the agent *genuinely prefers* the imminent reward (e.g., eating cake) due to shifted valuation. Their AOTC judgment *has changed* with the discounting curve. As Ainslie (2001) insists: "The reversal of preference is a *change of mind*." This makes HD action *strong-willed* by Davidson's lights—the agent acts on their *current* strongest desire.

  2. **Can HD Reproduce Synchronic Split?**  
     **Only in modified interpretations**, but this departs from standard HD:
     - **Holton's Resolution Account**: If the agent maintains a *resolution* (e.g., "I will diet") based on prior AOTC judgment while experiencing HD-driven desires, choosing the imminent reward *against their resolution* could approximate Davidsonian akrasia. Here, HD explains *why* the desire arises, but the conflict is between resolution and desire.
     - **Dual-Process Models**: If AOTC judgments involve deliberative processing while HD operates via affective systems (e.g., Metcalfe & Mischel's "hot/cool" systems), a synchronic split *could* occur. However, this imports philosophical machinery absent in pure HD models.

  ### Why Philosophers See Akrasia as Distinctive:
  - **Normative Puzzle**: Davidsonian akrasia violates the *practical syllogism*—the bedrock of intentional action explanation. HD merely violates *dynamic consistency*, a technical rationality condition.
  - **First-Person Authority**: Akrasia challenges the idea that agents know/control their own actions. HD agents act authentically on current preferences.
  - **Regret Dynamics**: Akratic regret stems from *self-betrayal* ("I knew better!"); HD regret stems from *unanticipated preference shift* ("Why did I want that?"). This aligns with Mele's (2010) distinction between *strict* akrasia (synchronic) and *sophisticated* preference reversal.

  ### Synthetic Verdict (Informed by Mele & Holton):
  Both frameworks explain surface behaviors (procrastination, etc.), but capture **fundamentally distinct phenomena**:
  - **Davidsonian Akrasia** is a *synchronic failure of practical rationality*—an enigma for theories of agency.
  - **Hyperbolic Discounting** is a *diachronic failure of intertemporal coordination*—a puzzle for decision theory.

  **Where they intersect**: HD can *cause* the conditions for akrasia. When an agent:
  1. Maintains a resolution based on prior AOTC judgment (e.g., "I value health")
  2. Experiences HD-driven surge in desire for imminent reward
  3. *Despite still endorsing the resolution*, acts against it  
  ...we get *akrasia enabled by HD*. Here, Holton's resolution theory bridges the accounts: HD explains the *temptation*, while failure to abide by the resolution constitutes akrasia.

  **Recommendation for Seminar**:
  - Have students test scenarios against Davidson's three principles:
    > *"When you ate the cake at t=2, did you simultaneously judge abstaining better *all things considered*?"*  
    HD-only agents will say *"No, I wanted it more then"*; akratic agents say *"Yes, but I ate it anyway."*
  - Highlight **Mele's taxonomy** (*Irresistible Desire*, 2010):  
    Pure HD = **Preference Reversal** (no akrasia)  
    HD + Endorsed Resolution = **Derivative Akrasia**  
    Judgment-action conflict sans HD = **Strict Akrasia**

  **Conclusion**: Treating HD as mechanistic underpinning of Davidson's akrasia misconstrues both. HD explains *why long-term preferences get abandoned*; Davidson explains *how we act against our own current best judgment*. The philosophical puzzle arises uniquely from the latter—it violates the constitutive norms of agency itself. Behavioral economics can inform *when* akrasia occurs, but not *what makes it conceptually paradoxical*.

  ---
  **Key References for Students**:  
  - Davidson, D. (1980). *Essays on Actions and Events*.  
  - Ainslie, G. (2001). *Breakdown of Will*.  
  - Mele, A. (2010). "Weakness of Will and Akrasia".  
  - Holton, R. (2009). *Willing, Wanting, Waiting*.  
  - Ross, D. (2010). "Economic Models of Procrastination".
