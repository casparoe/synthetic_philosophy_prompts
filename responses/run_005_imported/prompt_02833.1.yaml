  ## The Unbending Line: Why Hobbes Would Have Dismantled Non-Euclidean Geometry

  Your group has grasped the profound centrality of geometry to Hobbes's system. His "maker's knowledge" epistemology – where certainty arises solely from constructing objects according to definitions we stipulate – elevates geometry (and his derivative civil philosophy) to the pinnacle of science. Non-Euclidean geometries, emerging centuries later, present a fundamental challenge to this edifice. Reconstructing Hobbes's likely response based on *De Corpore* and his feud with Wallis reveals not adaptation, but implacable rejection. Non-Euclidean geometry would have struck directly at the root of his reasons for geometry's supremacy, reinforcing his disdain for hypotheticals and vindicating his war with Wallis.

  **1. The Core of Hobbesian Geometry: Construction, Not Abstraction:**
     Hobbes's rejection of Euclid's definitions wasn't pedantry; it stemmed from his radical materialism and constructivism. A "partless point" or "breadthless line" is *impossible* for Hobbes because:
      *   **Materialism:** All real existence is body. Thought is computation with names attached to bodily motions or the phantasms they produce. Abstracta divorced from possible bodily generation are fictions.
      *   **Constructivism:** True science requires generating the object *from* the definition via motion. Geometry isn't about contemplating ideal Platonic forms; it's about the *generative power* of definitions combined with the concept of motion applied to bodies ("A line is the way of a point moved"). We know a circle *demonstratively* because we define it ("figure described by a line where one end is fixed") and then *construct* it with compasses (embodying that motion). This act of construction provides "maker's knowledge" – absolute certainty because we built the object according to our own rules.

  **2. Non-Euclidean Geometry: The Return of the Hypothetical Demon:**
     Gauss, Bolyai, Lobachevsky, and Riemann introduced systems logically consistent *within themselves* but incompatible with Euclid (and each other) regarding the behavior of parallels or the nature of space itself. For Hobbes, this would be catastrophic precisely because it reintroduces the very specter he exiled from true science:
      *   **The Problem of Multiple "Truths":** Hobbes believed there could only be *one* true geometry because it described the possible motions *of actual bodies* in the actual space we experience (which for Hobbes, is the imaginary space arising from the potential motion of bodies). Geometry wasn't a free creation of the mind playing with axioms; it was the science of *possible bodily constructions*. Multiple internally consistent systems imply geometry isn't discovering the singular truth about bodily motion, but inventing abstract rule-sets. This reduces it to the level of the hypothetical models he derided in natural science ("if we assume X, then Y follows").
      *   **Empirical Contamination:** Riemann's geometry, used by Einstein to describe physical space, is the ultimate nightmare. If the "true" geometry of physical space is determined *empirically*, then geometry loses its *a priori*, demonstrative certainty derived from construction. It becomes contingent, reliant on observation and experiment – *exactly* the "second-class" knowledge Hobbes assigned to physics. We don't "construct" curved spacetime; we infer it from phenomena. For Hobbes, this would prove geometry had abandoned its foundational principles and descended into the realm of natural philosophy's uncertainties. The "maker's knowledge" evaporates if the "making" (construction via bodily motion) doesn't correspond to the fundamental structure being described.
      *   **The Ghost of Wallis:** Hobbes's decades-long battle with Wallis was fundamentally about this point. Wallis represented the "mathematician" divorced from material construction, manipulating symbols according to abstract rules to produce results Hobbes deemed physically impossible (like "squaring the circle" algebraically). Hobbes saw this as sophistry, mistaking the manipulation of names for the generation of real knowledge about bodies. Non-Euclidean geometry, developed through abstract axiomatic manipulation and validated by logical consistency rather than physical constructibility, would appear to Hobbes as Wallis's error writ large – a triumph of "reckoning" over genuine science. The fact professionals accepted it would only confirm his deep suspicion of the "mathematical establishment."

  **3. Why Relativization Fails: The Need for Anchorage:**
     Could Hobbes adapt by relativizing certainty to *any* consistent constructive system? This is profoundly antithetical to his system:
      *   **Civil Philosophy Requires Anchorage:** Hobbes's *civil* philosophy, modeled on geometry, relies on univocal definitions (e.g., "person," "covenant," "sovereign") agreed upon and "constructed" into a commonwealth. If geometry itself fractures into multiple equally valid but incompatible systems, the model collapses. What guarantees the definitions underpinning the Leviathan? Relativism in geometry invites relativism in politics – Hobbes's ultimate terror.
      *   **Certainty Demands Uniqueness:** For Hobbes, *scientia* (scientific knowledge) *is* demonstrable, absolute certainty. "Maker's knowledge" only provides this if there is one, unambiguous way to construct the object from the definition within the framework of possible bodily motion. Multiple constructive systems imply that the "making" doesn't lead to a unique truth, undermining the very certainty Hobbes cherished. It reintroduces the "opinion" and "conjecture" he abhorred.
      *   **The Primacy of Experience (of Motion):** Hobbes didn't believe we *invented* space or motion arbitrarily. Our concepts arise from sense experience of bodies moving. The geometry we construct reflects the possibilities inherent in *that* experienced reality. Non-Euclidean geometries, especially those describing curvature beyond our direct constructive experience (like hyperbolic planes), would seem like fantastical inventions detached from the foundational experience of bodily motion. They aren't "constructed" in the Hobbesian sense of tracing paths with moving bodies; they are *conceived* abstractly.

  **Verdict: The Uncompromising Rejection**

  Hobbes would have dismissed non-Euclidean geometry utterly. He would have seen it as:
  1.  **A Triumph of Abstraction over Construction:** Mere symbolic manipulation, akin to Wallis's "algebra," divorced from the generation of knowledge through the possible motion of actual bodies.
  2.  **The Surrender to Empiricism:** Reducing geometry to the level of natural science, where its "truth" depends on *a posteriori* confirmation, destroying its unique demonstrative certainty.
  3.  **The Proliferation of Hypotheticals:** Creating a family of mutually incompatible "geometries," precisely the hypothetical reasoning he condemned as inferior to true science.
  4.  **A Threat to the Civil Model:** Undermining the univocal, constructive certainty he needed geometry to provide as the template for political science.

  Non-Euclidean geometry wouldn't have been an expansion of knowledge for Hobbes; it would have been a confirmation of the slippery slope of abstraction and hypothetical reasoning he fought against his entire life. It would have validated his war with Wallis and reinforced his conviction that true science lies only in the unshakeable certainty derived from constructing the possible motions of bodies according to definitions we control. The discovery wouldn't have adapted his system; it would have proven, to his mind, why his rigid constructivism was *necessary* to guard against the encroaching chaos of mere hypothesis. The line, for Hobbes, could not bend; to allow it would be to collapse the entire structure of his philosophy.
