  Then there's the concept of psychological continuity. Locke's theory says personal identity is tied to consciousness and memory. If the friend remembers borrowing the money, that connects him to the past self. The user mentioned the friend talks differently now, which suggests some continuity. But if the friend disavows that past self, does that break continuity? Parfit's view on psychological connectedness might apply here. Even if there's a weaker connection, as long as there's overlapping memories, responsibility could still hold.

