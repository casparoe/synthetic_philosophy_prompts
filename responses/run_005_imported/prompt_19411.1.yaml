  Now Zorn's Lemma is such a clever end-run around explicit construction. It doesn't mention ordinals at all - just maximal elements in posets satisfying chain conditions. The user is spot-on noting how it's "dressed up" differently. But I wonder... would Kronecker see through the packaging? 

  Looking at his actual behavior: he attacked Weierstrass for non-constructive analysis and famously tried to block Cantor's papers. This suggests he'd reject any non-constructive existence proof, regardless of framing. The user's "load-bearing work in concrete algebra" point is sharp though - maximal ideals underpinning algebraic number theory might give him pause. 

  But remember Kronecker's own proof of the existence of basis for polynomials? He gave an algorithm! For him, existence without method was empty. Even if Zorn's Lemma "felt" algebraic, its non-constructive nature would likely trigger the same revulsion. 

