  Okay, the user is part of a grants committee for a small EA-adjacent foundation. They need a memo to resolve a debate about including a pure time preference (PTP) discount rate. Let me start by understanding the key issues.

  The quant lead wants a 1.5% PTP, arguing that people inherently value near-term benefits more. The opposition cites Sidgwick and Ramsey, saying there's no rational basis for discounting based on time alone. The user is worried that without PTP, their model might lead to deferring too much to the far future, especially with tiny probabilities of huge payoffs.

  First, I need to break down the three discount components clearly: PTP, growth/diminishing marginal utility, and probability/existence discounting. The old writeups blurred these, so clarity is crucial. The memo should keep them distinct.

  The quant's main point isn't just impatience but avoiding overcommitment to speculative long-term grants. The user mentioned "permanent patient philanthropy" or favoring the largest far-future claims. That's a valid concern. How to address it without endorsing PTP?

  Alternative solutions? Maybe adjust the probability discounting to better handle cluelessness or tail risks. Or use a time-varying discount rate. Also, maybe cap deferrals or set a time horizon. The memo needs a recommendation, so I should weigh options.

  Stakeholders: quant lead wants PTP, others oppose on ethical grounds. The foundation's focus areas (global health, animal welfare, biosecurity/AI) mean both near and long-term grants matter. Balancing these without bias is key.

  User's deeper needs: They want a principled yet practical solution. Avoiding scope insensitivity while preventing overinvestment in highly uncertain long-term projects. Also, ensuring the guidance is implementable and doesn't complicate evaluations.

  I recall the Stern vs. Nordhaus debate. Stern used low discount rates, leading to high climate action costs now. Nordhaus used higher rates, favoring slower action. Here, it's about grant allocation. The memo should reference this but focus on their context.

  Options: Keep PTP but lower it? Eliminate and adjust other factors? Introduce a new mechanism for cluelessness? Each has pros and cons. The recommendation should address the deferral risk without compromising ethical principles.

  Need to structure the memo: Background, components, arguments for/against PTP, alternatives, recommendation. Emphasize distinct components. Suggest enhancing probability weighting and maybe a horizon approach. Advise against PTP but tackle the deferral issue through other means.

  Also, the user wants a decisive recommendation. Not just "reasonable people disagree." So, after analysis, pick a path. Given EA principles, siding against PTP but offering concrete alternatives makes sense. Highlighting that PTP might be a proxy for other uncertainties that can be better handled elsewhere.
answer: |-
  ## MEMORANDUM  
  **To:** Grants Committee Members  
  **From:** [Your Name], Committee Chair  
  **Date:** [Current Date]  
  **Subject:** Resolution Proposal: Time Discounting Framework & Pure Time Preference (PTP)  

  ---

  ### **1. Background & Core Issue**  
  Our guidance must transparently compare grants with radically different payoff timelines (e.g., near-term bednets vs. century-scale AI safety research). Current debate centers on whether to include a **Pure Time Preference (PTP)** rate (~1.5%/year) *separate* from:  
  - **Growth/Diminishing Marginal Utility (DMU) Discounting** (adjusting for wealthier future beneficiaries).  
  - **Existence/Probability Discounting** (adjusting for risk that beneficiaries/impact never materialize).  

  The Quant Lead argues PTP is a necessary "revealed preference" acknowledging humans *do* intrinsically value near-term benefits more. Opponents contend PTP is ethically indefensible (Sidgwick/Ramsey) and entrenches scope-insensitive bias.  

  **Crucially, this is not about impatience.** The strongest concern is that **PTP = 0% + current probability model may force pathological prioritization**:  
  - Over-investment in speculative, ultra-long-term grants with poorly modeled tail risks.  
  - "Permanent patient philanthropy" – indefinitely deferring action for larger future payoffs.  
  - Susceptibility to "scope hijacking" (e.g., grants claiming maximal far-future leverage).  

  ---

  ### **2. Principles for Our Framework**  
  To resolve this, we adopt:  
  - **Transparency:** Strict separation of the 3 discounting components.  
  - **Pragmatism:** Models must avoid conclusions that violate reasonable prioritization (e.g., spending 99% on year-2200 interventions).  
  - **Ethical Rigor:** No arbitrary devaluation of future lives.  

  ---

  ### **3. Analysis: The Case For/Against PTP**  

  | **Argument For PTP (1.5%)** | **Argument Against PTP (0%)** |  
  |------------------------------|--------------------------------|  
  | • **Revealed Preference:** All agents (donors, institutions, humans) exhibit time preference. Ignoring this risks misalignment with real-world decision-making. | • **Ethical Absurdity:** Discounting lives based *only* on temporal location is discriminatory (Sidgwick: "pure time preference is ethically indefensible"). |  
  | **• Anti-Pathology:** Mitigates overcommitment to speculative far-future claims by adding friction to long horizons. | **• Scope Insensitivity:** PTP directly contradicts our mandate to weigh welfare equally across time. |  
  | • **Decision Robustness:** Acts as a proxy for unmodeled tail risks (e.g., value drift, institutional collapse). | **• Proxy Failure:** If PTP is a stand-in for risk, we should model risk explicitly (see Section 4). |  

  **Key Insight:** The Quant Lead’s core objection isn’t about impatience—it’s about **avoiding a rigid model that demands irrational deference to the long term**. PTP is one solution, but not the only one.  

  ---

  ### **4. Recommended Solution: Eliminate PTP, Enhance Probability Discounting & Horizon Limits**  
  **Recommendation:** **Remove Pure Time Preference** from our discounting framework. Instead, address pathologization concerns via:  

  #### **A. Strengthened Probability/Existence Discounting**  
  - **Explicitly model "cluelessness"** (uncertainty about far-future causal chains):  
    - For payoffs >50 years, apply **stepped uncertainty multipliers** (e.g., 0.5x/year post-2070) to expected value.  
    - Require **tail-risk sanity checks**: "What is the 10th percentile impact estimate?"  
  - **Calibrate probability of beneficiary existence:**  
    - For existential risk grants, use **semi-informative priors** (e.g., Metaculus forecasts) on human survival by year 2100/2200.  
    - **Do not conflate this with time preference.**  

  #### **B. Implement a "Practical Horizon"**  
  - **Cap deferral windows:** No grant’s *primary* expected payoff may exceed **150 years** without special committee review.  
  - **Focus on robust proxies:** Prioritize interventions with near-term lock-in effects (e.g., policy wins, institution-building) *even for long-term goals*.  

  #### **C. Growth/DMU Discounting Remains**  
  - Continue using **η = 1–1.5** (per standard EA practice) for wealth differentials. Update forecasts biennially.  

  ---

  ### **5. Why This Over PTP?**  
  - **Ethically Coherent:** Aligns with foundational EA principles while addressing practical risks.  
  - **Transparent:** Isolates uncertainty (probabilistic) from temporal bias (PTP).  
  - **Robust:** Targets pathology sources directly (cluelessness, tail risks) rather than masking them with PTP.  
  - **Precedents:** Mirrors Stern Review’s near-zero PTP while embedding Nordhaus-like pragmatism via stepped uncertainty.  

  ---

  ### **6. Implementation Plan**  
  1. **Revised Guidance:** Template separating 3 discount factors:  
     ```  
     [Grant EV] = (Impact) × [Prob_Discount] × [Growth_DMU_Discount]  
     Where:  
     - Prob_Discount = f(existential risk, institutional endurance, cluelessness)  
     - Growth_DMU_Discount = g(η, forecasted GDP/capita growth)  
     - PTP = 0%  
     ```  
  2. **Training:** Workshop on estimating cluelessness multipliers and tail risks.  
  3. **Review:** Revisit framework in 12 months; track % of grants >50-year horizon.  

  ---

  ### **7. Conclusion**  
  Pure Time Preference is an inadequate solution to the real problem: modeling uncertainty over long horizons. By eliminating PTP and enhancing our handling of cluelessness and tail risks, we uphold ethical consistency while preventing pathological deferral. **This framework rejects temporal discrimination but acknowledges that predicting the far future is fundamentally harder—and our calculus should reflect that explicitly.**  

  **Proposed Vote:** Adopt the above recommendations for all grant evaluations effective Q3.  

  ---  
  *Appendices:  
  A. Discounting Component Definitions  
  B. Worked Example: AI Safety Grant vs. Bednets  
  C. Stern-Nordhaus Discount Rate Comparison*  

  Let’s discuss at the quarterly meeting. I recommend we settle this decisively to unblock $2.1M in pending grants.
