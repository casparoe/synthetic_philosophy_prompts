  2. **Informational cascades and herding**: Strategic voting can lead to situations where voters ignore their signals and follow others, leading to incorrect outcomes even with large groups. This directly contradicts CJT's prediction. 

  3. **Equilibria where voting is uninformative**: Game theorists have shown that in some equilibria, voters may always vote the same way regardless of their signals, making the vote outcome meaningless. 

