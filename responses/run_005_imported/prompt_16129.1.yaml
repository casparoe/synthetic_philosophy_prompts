  ## The Moorean Ideal in the Shadow of Insatiability: Keynes's Unfinished Vision

  Keynes’s 1930 essay, "Economic Possibilities for our Grandchildren," presents a tantalizing vision: a future liberated from the "economic problem" by sustained growth. Absolute needs would be met, freeing humanity from the relentless toil driven by scarcity. This abundance, Keynes argued, would finally allow us to relegate the "love of money" to its proper status as a "disgusting morbidity," a vice rather than a necessity. The purpose of this liberation was not mere idleness, but the cultivation of the "good life" – a life dedicated, as per his youthful absorption of G.E. Moore's ethics, to "timeless, passionate states of contemplation and communion" centered on love, beauty, and knowledge. This Moorean ideal was intensely private, aesthetic, and unconcerned with worldly achievement or rigid moral rules; it was about experiencing intrinsic value states.

  Yet, by 2030, the predicted fifteen-hour week and widespread leisure remain elusive. While growth of roughly the magnitude Keynes foresaw *has* occurred globally, its fruits have been unevenly distributed and relentlessly consumed. The failure stems from both the economic dynamics he identified in 1930 and the psychological realities he grappled with in 1938:

  1.  **The Economics of Insatiable Relative Needs (1930):** Keynes correctly identified "relative" needs – the desire for status, superiority, and positional goods – as potentially insatiable. However, he underestimated their dominance. Modern capitalism, fueled by sophisticated advertising, social media, and a culture of competitive consumption, has masterfully stoked these relative desires. The "hedonic treadmill" ensures that as absolute wealth increases, so do perceived necessities and aspirations for status. Keynes also critically underplayed **distributional inequality**. While aggregate wealth soared, its concentration meant vast populations never reached the threshold where absolute needs were securely met, forcing them to remain in the economic struggle, while the wealthy channeled surplus into competitive consumption rather than Moorean contemplation.
  2.  **The Psychology of Irrationality and Wickedness (1938):** In "My Early Beliefs," Keynes delivered a profound self-critique. He acknowledged the naivete of his Bloomsbury circle in believing Moore’s vision of the good life could be pursued by simply discarding conventional morality and reason. They had ignored "the insane and irrational springs of wickedness in most men." This psychological insight is crucial. The failure of the leisure society isn't just about insatiable *wants*; it's about deep-seated human drives – for power, dominance, security, belonging, and the gratification found in competition itself – that economic growth alone does not pacify. The "love of money" persists not merely as a useful evil, but because it feeds these darker, irrational impulses that Keynes later recognized. Our economic system actively channels and rewards these impulses.

  **The Harder Question: Endorsing the Moorean Ideal?**

  Is this vision of a private, contemplative life focused on love, beauty, and knowledge, unconcerned with achievement or rules, an ideal we should still endorse? Keynes’s later disillusionment forces a reckoning.

  **Defense of the Ideal (Despite the Shortfall):**

  On its own terms, the Moorean ideal retains profound value. Its core assertion – that the highest goods are intrinsic states of consciousness found in deep appreciation (love, beauty, knowledge) – points towards a human flourishing distinct from material accumulation or social competition. In a world saturated with instrumental logic, achievement anxiety, and status-seeking, the call to cultivate "timeless, passionate states of contemplation" offers a vital counterpoint. It reminds us that meaning can be found in the quality of our attention and experience, not just in our output or rank. The ideal critiques the relentless instrumentalization of life under late capitalism. Even without mass leisure, individuals *can* carve out spaces for such contemplation, finding respite and depth. Its value lies precisely in its indifference to consequence and rules – it posits an intrinsic worth to certain experiences, independent of their social utility or conformity. To dismiss the ideal because humanity hasn't yet achieved the material conditions for its universal practice, or because humans have destructive impulses, is to confuse the worth of the destination with the difficulty of the journey.

  **Critique Informed by Keynes’s Later Verdict (The Ideal as Mistake):**

  Keynes’s later confession suggests the Moorean ideal itself, as embraced by Bloomsbury, contained a fatal flaw. By discarding ordinary moral rules and focusing *only* on the private, intense experience of the ultimate good, it neglected the essential social and institutional framework necessary for any widespread good life to exist. It was politically and psychologically naive. The ideal’s indifference to "achievement" and "consequence" becomes problematic when scaled. A society composed solely of individuals pursuing private aesthetic contemplation lacks the mechanisms to address collective challenges, manage conflicts arising from those "insane springs of wickedness," or ensure the basic justice and stability that are prerequisites for *anyone* to safely pursue contemplation. Keynes realized too late that Moore’s willingness to bind the vision with rules wasn't a quaint relic, but a necessary safeguard against human irrationality. The ideal’s intense privacy risks solipsism and disengagement, leaving the public sphere vulnerable to the very forces of unreason and domination Keynes saw rising in 1938. An ideal that ignores the need for shared rules, social responsibility, and engagement with consequence is ill-equipped to foster a *sustainable* good life in a complex, interdependent world populated by fallible humans. It becomes a luxury for the privileged few, insulated by the very structures it refuses to engage with or justify.

  **Synthesis and Defense:**

  While the critique exposes a profound limitation in the *Bloomsbury interpretation* of Moore, it does not negate the core value of the experiences Moore and Keynes identified. The mistake was not in valuing contemplation, love, beauty, or knowledge as intrinsic goods, but in the belief that these states could constitute the *sole* focus of the good life in isolation from social reality, moral constraints, and the need to actively shape a just world.

  We still have good reason to endorse the *experiential core* of the Moorean ideal – the pursuit of deep appreciation, connection, and understanding as ends in themselves. These remain essential components of human flourishing. However, Keynes’s later insight compels us to embed this ideal within a more robust framework. The good life cannot be *only* private contemplation; it must also involve engagement with the social and political world to create conditions where such contemplation is possible and widespread. Ordinary moral rules and concern for consequence are not antithetical to the ideal, but necessary preconditions for its realization beyond a tiny elite. We need rules to curb the "insane springs of wickedness" that threaten the peace required for contemplation. We need engagement with achievement (understood broadly as contribution, not just status-seeking) and consequence to build and maintain the institutions that protect individuals and foster the cultural conditions where love, beauty, and knowledge can thrive.

  **Defending Against the Strongest Opposition:**

  The strongest opposing view argues the ideal is inherently elitist, passive, and irrelevant in a world facing existential crises (climate change, inequality, resurgent authoritarianism). Focusing on private contemplation, it claims, is a retreat from urgent collective action.

  This critique holds weight against the *pure*, disengaged Bloomsbury version. However, endorsing the *core experiential value* of Moore does not necessitate passivity or disengagement. True contemplation of beauty can fuel environmental stewardship; deep knowledge of history and science informs political action; authentic love extends to compassion and justice. The ideal reminds us *why* we fight for a better world: not just for survival or power, but to create the space for these intrinsic goods to flourish for all. It provides the ethical compass and the vision of fulfillment that motivates sustained engagement. Dismissing it entirely risks reducing politics and ethics to mere instrumentalism and struggle, losing sight of the positive human potential we aim to cultivate. The good life must integrate the Moorean moments of intrinsic appreciation with active, rule-bound engagement in shaping a world where such appreciation is possible and sustainable – a world that acknowledges, rather than naively ignores, Keynes’s later understanding of human complexity.

  **Conclusion:**

  Keynes’s two texts present an unresolved dialectic. The 1930 essay offers a compelling endpoint: liberation from scarcity for the pursuit of intrinsic goods. The 1938 memoir injects a sobering dose of psychological and political reality: humans are not simply rational calculators ready for aesthetic contemplation; they harbor irrational, destructive drives requiring social management. The failure of the leisure prediction stems from the explosive interaction of the relative consumption traps Keynes identified and the deep psychological forces he later acknowledged. While the Moorean vision of intrinsic goods remains a vital pole of human aspiration, Keynes’s self-critique reveals it as insufficient alone. The ideal we should endorse today is not the pure, disengaged Bloomsbury vision, but a hybrid: one that fiercely values the states of contemplation, love, beauty, and knowledge as the ultimate ends of life, but recognizes that achieving a society where these are widely accessible requires robust moral rules, social engagement, and a constant struggle against the darker currents of human nature that Keynes, in his youthful optimism, had dared to believe abundance alone would wash away. The good life is not *either* contemplation *or* engagement; it is the difficult, necessary integration of both.
