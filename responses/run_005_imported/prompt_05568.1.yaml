  Justification: Leo accurately defends IIA as a stability feature, not a flaw. If rational agents agreed on a solution in a smaller feasible set, adding irrelevant options (even if they shift utopia points) shouldn’t disrupt that agreement. His critique that KS "lets a party’s unexercised hypothetical best case do normative work it hasn’t earned" is astute: the utopia payoff is counterfactual and may never be chosen, so weighting it heavily risks rewarding unrealized leverage.  

  **Move (3): Ines**  
