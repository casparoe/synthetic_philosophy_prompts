  ### Context Recap
  - Nash bargaining solution: Maximizes the product of gains over the disagreement point. It satisfies Independence of Irrelevant Alternatives (IIA): if the feasible set shrinks but the original solution remains feasible, then it remains the solution in the smaller set.
  - Kalai-Smorodinsky (KS) solution: Equalizes relative concessions. It satisfies individual monotonicity: if one agent's ideal payoff increases (while the disagreement point and the other agent's ideal remain fixed), then that agent should not get less in the new solution.

