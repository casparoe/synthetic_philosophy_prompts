  Silas Thorne’s manuscript *The Fractured Mirror* was rejected (again). He’s wallowing when an email arrives: a journal article titled "Cross-World Epistemic Anomalies" by Dr. Aris Thorne. The abstract references a book called *The Fractured Mirror*—published last year by Silas A. Richter.  

  Silas finds the article online. There’s a cover image of "his" book. The author photo is *almost* him—same eyes, but colder. The book is a critical darling.  

  He buys a copy. Holding it, he feels nothing. This book didn’t bleed through six years of his life. Its success belongs to a stranger who shares his face.  

  He places it on his desk, next to his rejected draft. Two identical titles. Two different worlds.  

  Outside, rain streaks the window. Silas doesn’t open the book.  

