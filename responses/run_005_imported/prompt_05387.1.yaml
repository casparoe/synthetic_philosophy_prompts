prompt: |-
  A friend and I stayed up far too late arguing about whether 'disease' names a purely biological condition or is inherently evaluative, and it turns out to bear directly on a vote my employer's health-plan committee is about to take. She defended something close to Boorse's biostatistical theory: health as nothing more than statistically normal functioning for one's reference class. I kept insisting that no purely descriptive account can do the work, since calling something a disease already involves a judgment about harm. Here's the case: our plan ties fertility-treatment coverage to the traditional clinical marker of infertility (twelve months of unprotected heterosexual intercourse without conception), so single members and same-sex couples can only qualify by first self-funding several failed cycles of donor insemination, even if they already have a diagnosed condition like PCOS. Some committee members want eligibility tied purely to documented internal dysfunction, partner status aside; others think that abandons any real concept of disease and just ends up funding unmet reproductive desire. I sit on the committee and need to circulate a memo before next week's vote. Please draft it: recommend a specific eligibility definition, and engage honestly with the strongest version of whichever side you reject.
reasoning: |-
  Okay, the user is in a tough spot. They're on a health-plan committee voting soon about fertility treatment eligibility, and their personal debate with a friend about the nature of "disease" directly impacts this real-world decision. 

  First, let's unpack their dilemma: On one side, there's the biostatistical view (like Boorse's) that says infertility should be defined purely by biological dysfunction - so only people with documented medical conditions like PCOS would qualify. On the other side, there's the evaluative view that recognizes the harm of being unable to form a family regardless of relationship status. 

  The current policy seems unfair - it forces single people and same-sex couples to pay out-of-pocket for failed treatments before getting coverage, while different-sex couples get coverage immediately after 12 months of trying naturally. That creates a financial barrier based on relationship structure rather than medical need.

  Hmm... the user needs a memo that both recommends a specific policy and fairly addresses the opposing arguments. They're clearly intellectually honest - they want the memo to "engage honestly with the strongest version of whichever side you reject." 

  The key tension is between:
  - Medical purity (only covering biological dysfunction)
  - Reproductive equity (covering all paths to parenthood equally)

  The strongest case for the medical view is that health plans shouldn't fund social desires - but this ignores how reproduction is fundamentally biological even when it requires assistance. The strongest case for the inclusive view is that the inability to conceive without medical help is the same functional limitation whether you're in a same-sex relationship or not.

  *Pausing to consider real-world impact*... If the committee adopts the strict medical definition, people without partners or with same-sex partners would still face extra costs and delays - which feels like discrimination disguised as medical objectivity. But if they cover all fertility treatments without any criteria, that could indeed blur the line between medical need and elective choice.

  *Brainstorming solutions*... Maybe a hybrid approach? Define infertility as the inability to conceive after X attempts with the necessary means? That would cover same-sex couples and single people using donor gametes, while still requiring evidence of difficulty conceiving. Six attempts seems reasonable - it mirrors the 12-month marker for couples having regular sex.

  For the memo structure:
  - Start by framing the philosophical debate clearly
  - Show how each view applies to this policy
  - Recommend the hybrid definition
  - Thoroughly explain why the pure medical view falls short here
  - Acknowledge valid concerns about "funding desire"
  - End with practical benefits of the recommendation

  The tone should be academic but decisive - this committee needs to vote soon. Should emphasize that reproduction is a biological function whether you're single or partnered, and that equitable access aligns with modern medical ethics.
answer: |-
  ## MEMO: Defining Infertility for Equitable Fertility Treatment Coverage  

  **To:** Health-Plan Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Evidence-Based, Equitable Fertility Treatment Eligibility  

  ### I. The Core Philosophical Conflict & Its Practical Impact  
  Our debate centers on whether "infertility" is defined by **biological dysfunction alone** (aligned with Boorse’s biostatistical theory) or **requires an evaluative judgment about harm** (accounting for social context). This directly affects coverage fairness:  
  - **Current Policy:** Limits coverage to those failing to conceive after 12 months of heterosexual intercourse, excluding single individuals and same-sex couples despite diagnosed conditions (e.g., PCOS).  
  - **Proposed Alternatives:**  
    - **Option A (Biological Dysfunction Focus):** Cover *only* individuals with documented internal dysfunction (e.g., anovulation, azoospermia), regardless of partner status.  
    - **Option B (Functional Infertility Focus):** Cover *any individual* unable to conceive after evidence-based attempts using necessary medical intervention (e.g., donor gametes).  

  ### II. Recommendation: Adopt Option B (Functional Infertility)  
  **Eligibility Definition:**  
  > *"Infertility is defined as the inability to achieve a clinical pregnancy after 12 months of regular, unprotected heterosexual intercourse OR after 6 cycles of medically supervised donor insemination/IUI (for individuals/couples requiring donor gametes to attempt conception), OR with a documented condition causing probable infertility (e.g., PCOS, tubal occlusion, severe endometriosis)."*  

  **Key Advantages:**  
  1. **Medical Equity:** Aligns with ASRM/WHO guidelines recognizing infertility as a "disease of the reproductive system" impairing a *core biological function*—regardless of marital status or sexual orientation.  
  2. **Harm Reduction:** Acknowledges that PCOS or tubal blockages cause identical biological dysfunction in a single woman or a same-sex couple as in a heterosexual couple. Denying coverage compounds harm by imposing financial barriers unrelated to medical need.  
  3. **Evidence-Based:** 6 cycles of donor insemination/IUI is clinically comparable to 12 months of heterosexual intercourse in establishing infertility.  
  4. **Cost Efficiency:** Excludes purely elective requests (e.g., fertility preservation without dysfunction) while covering those with a diagnosed impairment or proven inability to conceive.  

  ### III. Engaging the Biological Dysfunction View (Option A)  
  *I acknowledge the principled case for Option A, grounded in Boorse’s theory:*  
  > **Strongest Argument:** Health plans should cover *diseases*, not social desires. If infertility requires a partner to manifest, it is not a biological dysfunction *of the individual*. Covering single individuals/same-sex couples medicalizes a social problem, blurring the line between treatment and enhancement.  

  *Honest Engagement:*  
  This view rightly safeguards against conflating medical necessity with lifestyle desires. However, it fails in three key ways:  
  1. **Scientific Accuracy:** Conditions like PCOS *are* intrinsic dysfunctions. They impair oocyte maturation—a statistically subnormal biological process—whether conception is attempted with a male partner or donor sperm.  
  2. **Ethical Consistency:** We do not deny insulin to a diabetic because they lack a partner to share meals with. Similarly, a lesbian couple with tubal infertility experiences the *same biological failure of reproductive function* as a heterosexual couple.  
  3. **Practical Reality:** The WHO defines infertility as the failure to achieve pregnancy "in a risk-exposed population." For same-sex couples, exposure requires donor gametes; for single individuals, it requires ART. Limiting coverage to coital infertility ignores this.  

  ### IV. Addressing Concerns About "Funding Reproductive Desire"  
  Option B does not open coverage to non-medical requests:  
  - **Diagnosed Conditions:** PCOS/endometriosis meet Boorse’s criteria (subnormal functioning).  
  - **Proven Attempts:** Requiring 6 failed IUI cycles objectively demonstrates impaired reproductive function.  
  - **Exclusions Preserved:** Elective social egg freezing or transgender fertility preservation *without diagnosed dysfunction* remain uncovered.  

  ### V. Conclusion  
  Defining infertility purely by internal dysfunction (Option A) appears scientifically neutral but ignores how reproductive biology interacts with social reality. Option B retains a rigorous, biological basis for "disease" while ensuring equitable access for *all* members with impaired reproductive function. **I urge the committee to adopt the Functional Infertility definition to align medical ethics with clinical evidence.**  

  **Vote Recommendation:** Approve coverage for individuals/couples meeting ASRM clinical criteria for infertility, including those requiring donor gametes to attempt conception after 6 cycles.  

  ---  
  *Sources for Further Review:*  
  - ASRM Ethics Committee. (2021). *Access to fertility treatment by gays, lesbians, and unmarried persons*.  
  - WHO. (2020). *International Classification of Diseases (ICD-11)*.  
  - Boorse, C. (2014). *A rebuttal on health*.
