prompt: |-
  A friend and I spent a good part of an evening arguing about Aquinas's political philosophy and never quite reached an agreement. My position was that, since Aquinas explicitly approves of killing tyrants in works such as De Regimine Principum, he should be counted as a genuine forerunner of later resistance theories that grant ordinary subjects a standing right to rise up and assassinate an unjust ruler. My friend thought this overstated matters but struggled to cite a specific passage in response. Was I basically right to read Aquinas this way, or is my friend's hesitation textually justified?
reasoning: |-
  Okay, the user is asking about Aquinas's political philosophy, specifically whether he can be seen as a forerunner to later resistance theories that justify assassinating tyrants. They mentioned debating a friend about this, with the user arguing that Aquinas approves of killing tyrants in works like *De Regimine Principum*, while the friend hesitated but couldn't cite a specific passage. 

  Hmm, I need to carefully analyze Aquinas's texts here. The user seems confident in their interpretation but open to being corrected. They're probably looking for a nuanced answer that addresses both their viewpoint and their friend's hesitation. The fact that they spent "a good part of an evening" debating suggests this matters to them intellectually - maybe they're philosophy students or enthusiasts.

  First, I recall that Aquinas does discuss tyrannicide in *De Regimine Principum*, but the context is crucial. The famous passage about killing a tyrant being "praiseworthy" is actually conditional - Aquinas immediately adds that this shouldn't be done through private presumption but by public authority. That's a massive qualification! The user might be overlooking this part.

  Then there's the *Summa Theologiae* where Aquinas is even more cautious. He frames resistance as a last resort only after exhausting all lawful means, emphasizing the greater evil of rebellion. This doesn't sound like a "standing right" at all. The user's claim about "ordinary subjects" having this right seems particularly shaky when Aquinas consistently points to "public authority" as the legitimate actor.

  I should also consider the medieval context - Aquinas operates within a framework where hierarchy and authority are divinely ordained. His concept of "tyrant" is very specific (usurper or extreme oppressor), not just any unpopular ruler. And his solution hierarchy favors lesser authorities deposing tyrants, not mob violence.

  The friend's hesitation makes perfect sense textually. While Aquinas does justify removing tyrants in extreme cases, his conditions are so strict that calling him a "forerunner of resistance theories" stretches it. Later thinkers like Calvin or Knox were more permissive about individual resistance. 

  But I should acknowledge why the user thinks this way - that one line about killing tyrants being "praiseworthy" does jump out if read in isolation. The challenge is showing how the surrounding text qualifies it. Maybe the user needs help reconciling the bold statement with Aquinas's overall conservative framework.

  In the end, I'll need to explain that while Aquinas opens a door for extreme action against tyranny, he bolts it shut with so many conditions and warnings that it's fundamentally different from later resistance theories. The burden of proof is incredibly high, and ordinary individuals definitely don't have a standing right. The friend was right to hesitate, even if they couldn't pinpoint why.
answer: |-
  Your reading captures an important dimension of Aquinas, but your friend's hesitation is **textually justified**. Aquinas does *not* grant ordinary subjects a "standing right" to assassinate tyrants in the manner later developed by resistance theorists like Calvinists, Monarchomachs, or Locke. Here's why:

  1.  **The Crucial Passage & Its Context (De Regimine Principum I, 6):**
      *   Aquinas writes: *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power."* He then adds the controversial line: *"Nor should such an action be considered seditious... unless perhaps when it is done so inordinately... that the multitude suffers greater harm from the ensuing disturbance than from the tyrant's rule."*
      *   **Immediately following this**, he discusses the extreme case: *"If there be no human recourse available against a tyrant, recourse must be had to God... Nevertheless, it may be permissible, granted the requisite authority, to kill a tyrant, even if it involves laying ambushes... But this is not permissible for any private person but only for a public authority."* (The authenticity of the section explicitly mentioning "killing" is sometimes debated, but it's generally accepted as Thomistic thought).
      *   **Key Points Here:**
          *   **Public Authority, Not Private Initiative:** Aquinas explicitly restricts the *act* of killing the tyrant to "public authority," *not* private individuals or mobs. This "public authority" likely refers to lesser magistrates, nobles, or representatives of the community who held recognized governing roles within the medieval constitutional framework (e.g., barons, elected officials in communes, the Pope in extreme spiritual/secular overlap). Ordinary subjects acting alone or as a mob are excluded.
          *   **Deposition/Power Restriction Preferred:** The primary remedy he discusses first is *deposition* or *restriction of power* by the multitude (or its representatives), not assassination. Killing is presented as a last resort within the context of this authorized action.
          *   **Avoiding Greater Harm:** Even authorized action must avoid causing greater harm than the tyranny itself.

  2.  **The Summa Theologiae Framework (ST I-II, Q. 90-97; II-II, Q. 42, Q. 104, Q. 120):**
      *   **Obedience to Lawful Authority:** Aquinas grounds political authority in natural law and divine ordinance (mediated through human reason and custom). Subjects generally owe obedience to legitimate rulers for the sake of the common good (ST II-II, Q. 104).
      *   **Tyranny as Unjust Law:** A ruler who commands contrary to the divine or natural good (e.g., commanding idolatry or intrinsically evil acts) becomes a tyrant, and such commands *lose the force of law* (ST I-II, Q. 96, A. 4). Subjects are *not* obliged to obey unjust commands.
      *   **Resistance to Injustice Permitted, Rebellion Cautious:** While disobedience to unjust commands is justified, Aquinas is extremely cautious about *active rebellion*. He emphasizes the grave evils of sedition (ST II-II, Q. 42), which disrupts the unity essential for the common good. Rebellion is only permissible as an absolute last resort when the tyranny is extreme *and* likely to succeed *and* when led by legitimate authority *and* when the probable outcome is better than the existing tyranny.
      *   **No Right of Revolution for Individuals:** Nowhere does Aquinas grant individuals or amorphous groups of subjects the inherent right to initiate violent revolution. Action against a tyrant requires a foundation in *lawful authority* within the existing (or pre-tyrannical) political order.

  3.  **Distinction from Later Resistance Theory:**
      *   **"Standing Right":** Later theorists (e.g., in the Huguenot resistance tracts post-St. Bartholomew's, Knox, Locke) often argued for a more inherent, natural right of the *people* (or their representatives) to resist and depose tyrannical rulers, sometimes even extending to individual conscience in extreme Calvinist thought. Aquinas bases his justification on the *failure of the ruler to fulfill his office* and the *pre-existing authority structure* that authorized him, not on an inherent, individual natural right to revolution.
      *   **Ordinary Subjects:** Later theories sometimes explicitly empowered "lesser magistrates" or even "the people" collectively. Aquinas restricts the *violent act itself* to "public authority," a much narrower category than "ordinary subjects."
      *   **Assassination:** While Aquinas permits killing a tyrant under strict conditions, it's framed as an act of public justice undertaken by legitimate authority, not as "assassination" in the sense of a private, clandestine murder plot by individuals. It's more akin to a public execution following a (perhaps informal) judgment.

  **Conclusion:**

  *   **You are right that:** Aquinas provides a powerful theological and philosophical justification for *removing* a tyrant, including, as a last resort undertaken by legitimate public authority, the *possibility* of killing him. He breaks decisively with the idea of absolute, unconditional obedience. He is a crucial figure in developing the concept that authority is conditional on serving the common good and divine/natural law.
  *   **Your friend is textually justified in hesitating because:** Aquinas does **not** grant "ordinary subjects" a "standing right" to assassinate a ruler they deem unjust. His conditions are extremely stringent:
      1.  The tyranny must be extreme and intolerable.
      2.  All peaceful, lawful means of redress must be exhausted.
      3.  The act must be undertaken by recognized "public authority," not private individuals or mobs.
      4.  The action must be likely to succeed and result in less harm than the tyranny.
      5.  Deposition/restriction is preferred over killing.

  **Therefore, while Aquinas opens the door to legitimate resistance in extreme cases, he does so within a framework that is fundamentally conservative, hierarchical, and deeply wary of popular rebellion. He is a *precursor* to resistance theory in establishing the principle that authority is conditional and tyranny can be illegitimate, but he is **not** a direct forerunner of theories granting a broad, standing right of revolution or tyrannicide to ordinary individuals or amorphous collectives.** His thought points more towards constitutional mechanisms of accountability (even if extra-legal in extremis) led by established elites within the social order, rather than popular revolution. Your friend's instinct that your claim overstates the case, particularly regarding "ordinary subjects" and a "standing right," is supported by Aquinas's own carefully qualified and restrictive text.
