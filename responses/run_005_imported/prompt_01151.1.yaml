  Also, there's the argument from consciousness. Without subjective experience, can there be understanding? Thomas Nagel's "what it's like to be a bat" suggests that understanding requires phenomenology. Since LLMs lack consciousness, they can't truly understand. This is a deeper philosophical point that's hard to counter.

  The user might also need to address internalist vs. externalist views. Internalists say understanding is a mental state, which LLMs don't have. Externalists like Putnam focus on behavior, which LLMs simulate. But is simulation enough? Critics argue that behavior alone isn't sufficient; there must be underlying cognitive processes.

  I should also mention Dennett's intentional stance. We treat systems as if they have intentions for practicality. But that doesn't mean they actually do. The company's marketing might be taking the intentional stance, but skeptics say it's just a useful fiction.

