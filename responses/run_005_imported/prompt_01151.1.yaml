  Then there's the grounding problem. Harnad and others argue symbols need connection to the real world. LLMs are trained on text, not sensory experiences, so their "understanding" is ungrounded. They might generate correct responses without actual comprehension. This relates to the symbol grounding problem. Also, Wittgenstein's private language argument could be relevant—meaning requires social practices, which LLMs aren't part of.

