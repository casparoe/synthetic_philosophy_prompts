  Homotopy type theory (HoTT) adds layers. Univalence might resonate with Brouwer's views on equivalence, but the formal system and computer reliance would likely make him dismiss it as another formalism. The user's deeper need is to resolve the tension between Brouwer's philosophy and its computational descendants. They might want to explore if there's a middle ground or if Brouwer's ideas are fundamentally incompatible with formal systems.

