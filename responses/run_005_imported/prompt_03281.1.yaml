prompt: |-
  So this semester I'm teaching a philosophy of math seminar and we just spent two weeks on Brouwer, and I've got a couple of CS grad students auditing who keep insisting Brouwer would've loved Coq, Agda, and especially homotopy type theory -- their argument is basically "he wanted constructive proofs that actually hand you the object, and now there's literally software that checks exactly that, so obviously he'd be thrilled." I keep pushing back, because as I read him Brouwer was pretty adament that mathematics is a languageless activity that happens in the head, and that logic and formal language are secondary at best -- a report on the mental construction, not the construction itself -- which was basically his whole objection to Hilbert's formalism in the first place. So theres something almost funny about the fact that the actual living inheritor of his program, decades after he died, turned out to be a bunch of extremely formal, symbol-heavy type theories running on computers -- exactly the sort of thing he spent his career insisting mathematics wasn't.

  I'd love your actual take on this, not the "Brouwer rejected excluded middle" cliffnotes version. If you sat Brouwer down and showed him a Lean proof, or explained the univalence axiom and Curry-Howard to him, do you think he'd recognize it as his intuitionism finally vindicated, or would he call it a formalist trojan horse -- constructive in its output, maybe, but missing the point entirely because none of it is actually happening "in the mind"? Does his stuff on the creating subject and choice sequences give him any real resources for drawing a more interesting distinction here, or would he just have to bite one bullet or the other? Genuinely unsure myself, so don't feel like you need to land on some tidy resolution if the honest answer is messier than that.
