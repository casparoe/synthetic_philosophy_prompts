  The user’s role as a council member gives them responsibility to act. But how? If the president is self-deceived, just presenting facts might not work. They need strategies that address both the practical consequences and the epistemological shift. Maybe frame the issue around governance risks rather than accusing the president of lying. Propose checks like regular financial reports or third-party audits. Emphasize the need for accurate data to serve the student body effectively.

