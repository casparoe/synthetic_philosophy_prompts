prompt: |-
  So at my job we're always told not to peek at A/B test dashboards early because it messes with the p-value (something about repeated testing inflating false positives, which I sort of get). But I read that a Bayesian can peek at the data as much as they want and keep updating their posterior, and that's apparently not "cheating" in the same way. That feels like black magic to me -- why would switching frameworks change whether looking at your data early is a valid move? Can you walk me through the actual mechanics of why optional stopping breaks frequentist inference but doesn't break Bayesian inference, rather then just giving me the one-line summary everyone gives? Bonus points if you can tie it back to why this is one of the things people blame for the replication crisis.
reasoning: |-
  We are going to discuss the problem of "peeking" (also known as "optional stopping") in the context of A/B testing and why it is problematic in frequentist statistics but not in Bayesian statistics.

  ### Frequentist Perspective (Why Peeking is Bad)

  In frequentist statistics, we use p-values to measure the strength of evidence against the null hypothesis. The p-value is defined as the probability of observing a test statistic at least as extreme as the one observed, assuming the null hypothesis is true.

  The key issue with peeking (i.e., checking the results multiple times as data accumulates) is that it inflates the Type I error rate (false positive rate). This is because every time you check the data and consider stopping if the result is significant, you are effectively conducting multiple hypothesis tests. 

  Consider the following: 
  - Suppose we plan to collect 1000 samples for an A/B test. 
  - The frequentist approach sets a significance level (alpha) of 0.05. This means that if the null hypothesis is true, there's a 5% chance we will reject it when we look at the data at the end.

  But if we peek at the data at multiple interim points (say after 100, 200, 500, and 1000 samples) and stop if at any point the p-value is below 0.05, then the chance of a false positive is increased. Why? Because at each peek we have a 5% chance of a false positive. The more we peek, the more opportunities we have to falsely reject the null.

  This is similar to the problem of multiple testing. The overall Type I error rate (the probability of at least one false rejection in the sequence of tests) becomes higher than 0.05. In fact, if we peek infinitely many times, the Type I error rate can approach 1.

  To control the overall Type I error rate in sequential testing, frequentists use methods like the alpha-spending function (e.g., in group sequential designs) or sequential probability ratio tests (SPRT). These adjust the significance level at each interim analysis to keep the overall error rate at the desired level.

  ### Bayesian Perspective (Why Peeking is Okay)

  In Bayesian statistics, we update our beliefs about the parameters (e.g., the difference in conversion rates between A and B) as new data arrive. We start with a prior distribution, and after observing data, we obtain a posterior distribution. 

  The key point is that the Bayesian inference conditions on the observed data. The stopping rule (i.e., when we decide to stop collecting data) does not affect the likelihood function (except in some specific cases like when the stopping rule is informative about the parameter). Therefore, the posterior distribution is the same regardless of whether we decided to stop at a predetermined sample size or because we saw a promising result.

  This property is known as the "likelihood principle", which states that all the information about the parameter from the experiment is contained in the likelihood function. The likelihood function depends only on the observed data and not on the stopping rule.

  Therefore, a Bayesian can monitor the data as often as desired and update the posterior accordingly. The posterior distribution at any point is valid given the data observed so far. 

  However, note that the prior distribution must be specified before seeing the data. If the prior is chosen after seeing the data, that would be cheating.

  ### Why the Difference?

  The fundamental difference lies in what is considered fixed and what is random.

  - **Frequentist**: The parameter is fixed (but unknown), and the data are random. The inference is based on the sampling distribution of the data (i.e., what might happen in repeated experiments). Therefore, the procedure (including when we stop) must be fixed in advance to control the long-run error rates.

  - **Bayesian**: The data are fixed (once observed), and the parameter is random (with uncertainty described by the posterior distribution). The inference is conditional on the observed data, so the stopping rule (which is part of the experimental design) does not affect the likelihood and hence the posterior.

  ### Tying to the Replication Crisis

  The replication crisis refers to the difficulty in reproducing scientific results, particularly in psychology, medicine, and social sciences. One of the blamed practices is "p-hacking", which includes optional stopping (peeking) and other data-dependent analyses that inflate false positives.

  In frequentist settings, if researchers peek at the data and stop when they see a significant result (without adjusting for multiple looks), they are effectively conducting multiple tests. This leads to an inflated Type I error rate. Thus, they might publish a "significant" result that is actually a false positive. When other researchers try to replicate the study, they fail to find the same effect.

  In contrast, Bayesian methods with proper priors and without data-dependent stopping rules (or with stopping rules that are accounted for in the posterior) are less prone to this particular issue. However, note that Bayesian methods are not immune to all problems (e.g., choice of prior, model misspecification). 

  But why is optional stopping less problematic in Bayesian analysis? Because the posterior distribution is updated based on the data actually observed. The Bayesian approach does not rely on the long-run frequency properties of the procedure but on the coherence of updating beliefs. Therefore, if the prior is appropriate, the posterior will appropriately reflect the uncertainty given the data, regardless of when you stopped.

  ### Caveats

  1. **Informative Stopping**: If the stopping rule is informative about the parameter (e.g., stopping when the data are "extreme" in a way that depends on the unknown parameter), then even Bayesian inference might be affected. However, in the common case of stopping based on the observed data (like when the posterior probability of an effect exceeds a threshold), the stopping rule is non-informative and the likelihood principle holds.

  2. **Prior Sensitivity**: The Bayesian posterior can be sensitive to the choice of prior. If a prior is chosen to favor certain results, then the posterior might be biased.

  3. **Calibration**: In practice, Bayesian methods with uninformative priors might still have good frequentist properties in fixed sample size settings. However, under optional stopping, the frequentist properties of Bayesian methods (like the coverage of credible intervals) can be compromised. But the Bayesian would argue that the posterior is still valid for the observed data and the prior.

  ### Conclusion

  The reason why switching frameworks changes the validity of peeking is due to the foundational principles of each framework. Frequentist inference relies on the control of long-run error rates, which are disrupted by data-dependent stopping. Bayesian inference conditions on the observed data and updates beliefs via Bayes' theorem, which is invariant to the stopping rule (as long as the stopping rule is non-informative). 

  This difference is one of the reasons why optional stopping (without correction) is considered a form of p-hacking in frequentist statistics and contributes to the replication crisis. Bayesian methods, when properly applied, can mitigate this particular issue.

  However, it is important to note that the Bayesian approach is not a panacea. The replication crisis is multifaceted, and both frameworks require careful and honest application.
answer: |-
  Let's break down why optional stopping (peeking) is problematic in frequentist inference but acceptable in Bayesian inference. I'll explain the mechanics step by step, then tie it to the replication crisis.

  ### **Core Problem: What Optional Stopping Does**
  When you "peek" at an A/B test early and decide whether to stop or continue based on interim results, you're introducing **data-dependent stopping**. This means:
  - Your sample size \(n\) isn't fixed in advance.
  - You might stop early if results look "significant" (or favorable).

  ---

  ### **1. Why Frequentist Inference Breaks**
  #### **The Mechanics**
  - **Frequentist inference relies on fixed procedures**. The p-value and Type I error rate (\(\alpha\)) are calibrated under the assumption that the experiment's design (including sample size) is fixed *before* seeing data.  
  - **P-values assume a single test**. A p-value answers:  
    *"Assuming the null hypothesis \(H_0\) is true, what's the probability of seeing data as extreme as this **in a single, fixed-\(n\) experiment**?"*  
  - **Optional stopping inflates false positives**:  
    - Each "peek" is a potential hypothesis test. If you check after every 100 new users, you're performing many tests.  
    - Under \(H_0\), p-values follow a uniform distribution: at each peek, you have a 5% chance of a false positive (if \(\alpha = 0.05\)).  
    - The more you peek, the more chances to falsely reject \(H_0\).  
    - **Example**: If you peek 10 times, the probability of ≥1 false positive isn't 5%—it’s \(\approx 40\%\).  

  #### **Mathematical Intuition**
  - The sampling distribution of test statistics (e.g., t-statistic) assumes fixed \(n\). When \(n\) changes based on data, this distribution becomes **non-standard**.  
  - **Sequential testing adjustments** (e.g., alpha-spending) fix this by making \(\alpha\) stricter at each peek. But if you peek *without* adjusting \(\alpha\), you break the p-value's meaning.  

  #### **Consequence**  
  P-values become **meaningless**. A "significant" result from optional stopping is likely a false positive.  

  ---

  ### **2. Why Bayesian Inference Survives**
  #### **The Mechanics**  
  - **Bayesian inference updates beliefs**. You start with a prior (e.g., "no difference between A/B"), then compute a posterior distribution using observed data via Bayes' theorem:  
    \[
    \text{Posterior} \propto \text{Likelihood} \times \text{Prior}
    \]  
  - **Stopping rules don't affect the likelihood principle**:  
    - The likelihood function (data \(\rightarrow\) model parameters) depends *only* on the observed data, not on how you decided to stop.  
    - **Example**: If you see 50 conversions out of 100 users, the likelihood is the same whether you planned \(n=100\) or stopped early because 50 looked "promising".  
  - **Posteriors are interpretable at any stopping point**:  
    - A 95% credible interval means: *"Given the observed data, there's a 95% probability the true effect lies here."*  
    - This doesn't require a fixed \(n\) or prespecified stopping rule.  

  #### **Mathematical Intuition**  
  - Bayesian inference conditions on the **observed data**. The stopping rule is irrelevant as long as it doesn't directly depend on unobserved data or parameters.  
  - **Example**: If you stop when posterior probability of A > B exceeds 95%, the final posterior still accurately reflects the evidence *in the data you collected*.  

  #### **Consequence**  
  Peeking doesn't inflate false positives because Bayesian inference doesn't control long-run error rates. It quantifies uncertainty given *existing data*.  

  ---

  ### **3. Why the Frameworks Diverge**  
  - **Frequentism is about long-run error control**:  
    "If I run this experiment 1000 times under \(H_0\), I’ll falsely reject \(H_0\) 5% of the time."  
    → Optional stopping breaks this calibration.  
  - **Bayesianism is about updating beliefs**:  
    "Given this exact dataset, how should I update my prior belief?"  
    → The posterior depends only on the data, not how it was collected.  

  ---

  ### **4. Tie to the Replication Crisis**  
  Optional stopping is a key driver of the replication crisis because:  
  1. **It inflates false positives in frequentist testing**:  
     - Researchers peek, see a "significant" p-value (e.g., p < 0.05) early, stop the experiment, and publish.  
     - But the true false positive rate might be 20–50% (not 5%).  
     - **Result**: Published "effects" are often noise. Replication fails.  
  2. **Bayesian methods aren't immune to abuse**:  
     - If priors are cherry-picked or too vague, posteriors can mislead.  
     - But optional stopping alone doesn’t invalidate the posterior.  
  3. **The real-world impact**:  
     - Psychology, medicine, and social sciences rely heavily on frequentist A/B tests.  
     - Widespread peeking (without correction) floods literature with false positives.  
     - **Example**: A drug trial stopped early for "efficacy" might be a false alarm. Replication studies later fail.  

  ---

  ### **Key Takeaway**  
  - **Frequentist p-values**: Broken by peeking because they depend on the *experimental design*.  
  - **Bayesian posteriors**: Survive peeking because they depend *only on observed data*.  
  - **Replication crisis link**: Optional stopping (without correction) is rampant in frequentist workflows, producing false positives that fail to replicate. Bayesian methods avoid this *specific* pitfall but require thoughtful priors.  

  This isn't "black magic"—it's a consequence of what each framework optimizes for. Frequentism controls long-run errors; Bayesianism updates beliefs coherently. Neither is universally "better," but understanding this distinction is critical for reliable inference.
