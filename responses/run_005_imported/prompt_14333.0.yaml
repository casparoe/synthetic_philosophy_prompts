prompt: |-
  Me and my friend Sam got into it pretty hard last night about this streamer we both watch — some guy who blew up on Twitch over the past couple years and now apparently pulls in something like $8-10 million a year, almost all of it from millions of tiny $5 subs, tips, and gifted subs from a fanbase that's mostly broke teenagers and college kids. Sam's take is that even though every single one of those transactions is just a kid voluntarily hitting "subscribe," the end result — this one guy owning three houses while a bunch of his own fans can barely make rent — is still messed up and unjust, and that platforms (or the government) should cap payouts or tax "attention income" like this way harder than a normal salary. I pushed back that if nobody was forced or lied to, and he didnt steal his way into his first thousand fans, I don't see how the resulting pile of money becomes unjust just because it ended up being huge. Sam thinks I'm missing something about how fortunes like this actually get built though — the way the platform's algorithm boosted him over other streamers who arguably grinded just as hard, whether his fans are really choosing "freely" given how addictive the whole gifting/subscription mechanic is engineered to be, stuff like that. Neither of us could actually pin down why a giant pile of individually-fine transactions might not be fine as a pile, and we went back and forth for like an hour without getting anywhere (not the first time this has happened with us, tbh).

  So I want an actual answer here, not just "well both sides have a point": whos closer to right? Can you untangle which of Sam's objections — the algorithm thing, the "were they really choosing freely" thing, or anything else you think is relevant — are doing real philosophical work versus which ones are basically just "inequality makes me uncomfortable" dressed up as an argument?
