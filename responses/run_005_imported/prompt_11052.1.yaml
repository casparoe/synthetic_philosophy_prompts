  First, I need to recall the key historical points. Garrison famously called the Constitution a "covenant with death" and burned it, believing its clauses protected slavery. Douglass initially agreed but later changed his view after engaging with thinkers like Gerrit Smith and Lysander Spooner, arguing that the Constitution's wording doesn't explicitly sanction slavery.

