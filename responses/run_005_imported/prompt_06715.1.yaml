  We are trying to build an agent framework where a controller wants to deploy a successor agent only after proving (within a fixed formal system) that this successor will only ever take actions that the controller has verified as safe. The successor, in turn, might want to deploy its own successor under the same condition.

  The problem we run into is known as the Löbian obstacle, which is related to Löb's theorem. Löb's theorem states that in a sufficiently powerful formal system (like Peano Arithmetic), if you can prove that "if the system can prove P then P is true" (i.e., □P → P), then you can already prove P (i.e., □P).

  In our context, the controller (call it A0) wants to prove about its successor (A1) that whenever A1 proves a statement S is safe (i.e., A1's formal system proves S), then S is indeed safe (i.e., S holds). But note: we are requiring that A0 proves that for every S that A1 might prove, we have □_{A1} S → S. However, if we try to require this for all S, then in particular we can set S to be a statement that leads to a contradiction.

  But let's break it down intuitively.

  The core idea of the obstacle is that the controller A0 is trying to establish a kind of trust in A1: that if A1 proves something, then it is true. However, if A0 is using a formal system T, and A1 is using the same system T, then A0 is effectively trying to prove that the system T is sound (at least for the kind of statements S that A1 will prove about safety). But by Gödel's second incompleteness theorem, a consistent system T cannot prove its own consistency. And the soundness of T (which implies consistency) is stronger than what we need? Actually, the condition we are asking for (□_T S → S for every S) is equivalent to the soundness of T? Not exactly for every S, but if we require it for every S, then we are requiring that T is sound. And T cannot prove its own soundness.

  However, note that we don't necessarily require it for every S, but only for the S that A1 will actually prove. But the problem is that we don't know in advance which S those are. So we have to prove it for all S that A1 might prove. And that means we are effectively trying to prove the soundness of T.

  But let's see how Löb's theorem comes in.

  Suppose that the controller A0 is working in a formal system T. It wants to prove about A1 (which also uses T) that:

     For all statements S, if A1 (using T) proves □_T S → S, then ... wait, no. Actually, we want A0 to prove that A1 only takes safe actions. How is that formalized?

  We are saying that A1 will only take an action if it has a proof (in T) that the action is safe. So for every action, if A1 takes it, then there exists a proof in T that the action is safe. But we want the action to actually be safe. So we require:

     For every action a, if A1 takes a, then Safe(a).

  But A1 takes a only if it has a proof of Safe(a). So we require:

     For every a, if □_T Safe(a) then Safe(a).

  But note: this must be proven by A0 for every a that A1 might consider. And that means A0 must prove:

     ∀ a, □_T Safe(a) → Safe(a)

  But now, if T is sufficiently powerful, we can construct a particular statement that will cause trouble.

  Let P be a statement. Consider a particular action a_P that is defined as: take this action only if P is true. Then Safe(a_P) is defined as P.

  So for this action, we require:

     □_T P → P

  But now, if A0 is to prove this for every P (because we don't know which P the successor might use), then in particular it must prove □_T P → P for every P. But then, by Löb's theorem, if T proves □_T P → P for a particular P, then T proves P. But we don't want that because we don't have a proof of P in general.

  Alternatively, if we try to have A0 prove the universal statement:

     ∀ P, □_T P → P

  then note that this is a statement about the soundness of T. And if T is consistent, it cannot prove its own soundness (by Gödel's second incompleteness theorem, because soundness implies consistency).

  But wait, we don't require it for every P? Actually, in the setup we only require it for the safety statements that A1 will use. However, A1 might use any P that it can prove. And if we want to be safe, we must cover every possible P that A1 might use. So we are forced to require the universal statement.

  So the problem is that the controller A0 must prove the soundness of T, which it cannot do if T is consistent.

  But now, what about the patch: having the successor A1 use a weaker system T' ⊂ T (so T' is a subtheory of T). Then, the controller A0 (using T) can prove the soundness of T'? Well, if T is stronger than T', then T might be able to prove the consistency (or even soundness) of T'. For example, if T is PA and T' is PRA, then PA can prove the consistency of PRA.

  So then A0 can prove:

     ∀ S, □_{T'} S → S

  because T (being stronger) can prove that T' is sound.

  But note: the successor A1 is now using T'. When A1 wants to deploy its own successor A2, it must prove that A2 (which we assume is also using T') will only take safe actions. But then A1 must prove the same thing about A2: that for every S, □_{T'} S → S. However, A1 is using T', and T' cannot prove its own soundness. So A1 cannot prove the soundness of T'. Therefore, A1 cannot satisfy the condition for deploying A2.

  Thus, the problem has been pushed down one level. The first successor A1 can be deployed because A0 (using T) can vouch for the soundness of T'. But then A1 (using T') cannot vouch for the next successor A2 because A2 is also using T' and T' cannot prove its own soundness.

  So we break the chain at the first step: A0 can deploy A1, but A1 cannot deploy A2.

