  But note: the condition we require is that the successor only takes actions that are safe. We are formalizing "safe" by requiring that the successor proves the safety of the action. But we want that proof to be correct. So we require that the successor's proof system is sound. But if we require each agent to prove the soundness of its own proof system, we run into Löb's theorem. If we require the parent to prove the soundness of the child's proof system, then we can do that if the parent's system is stronger. But then the child cannot prove the soundness of the next child's system because it is in a weaker system.

  So the chain breaks at the next level.

  Alternatively, we might have the agents use the same system T, but have the parent prove a specific condition for the child's deployment that does not require the full soundness of T. But what condition?

