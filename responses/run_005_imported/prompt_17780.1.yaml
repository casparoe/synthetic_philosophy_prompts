prompt: |-
  I teach a graduate seminar, cross-listed with the psychology department, on the philosophical foundations of statistical inference, and much of our discussion this term has turned on how much of the replication crisis is really a symptom of frequentist methodology specifically, as opposed to something that would survive a wholesale switch to Bayesian methods. A psychology postdoc auditing the course offered his own recent practice as evidence for the Bayesian side of that debate: he had specified a prior for his key parameter before running an experiment, found that the resulting posterior left his hypothesis looking distinctly unpromising, decided on reflection that his original prior had actually been too uninformative given a closely related result in the literature, revised it accordingly, and reran the analysis, arriving at a posterior that supported his hypothesis comfortably. That is the version now heading toward publication. He maintains that since his revised prior is, if anything, more defensible than his original one, nothing methodologically suspect is going on here, in contrast to the sort of data-contingent flexibility that produces false positives under null hypothesis significance testing.

  I could not say exactly why this bothered me at the time, beyond a sense that he had relocated a familiar problem rather than escaped it. Is he right that moving to Bayesian inference insulates a researcher from the kind of analytic flexibility that produced so many false positives in the first place, or is there something wrong with what he did, even though each step in his reasoning about the prior sounds reasonable taken on its own?
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a seminar on the philosophical foundations of statistical inference, and their discussion revolves around whether the replication crisis is tied to frequentist methods or if Bayesian methods would face similar issues. The user presents a case where a psychology postdoc revised his prior after seeing initial results, leading to a supportive posterior for his hypothesis. The postdoc claims this is methodologically sound, but the user feels uneasy about it.

  First, I need to understand the core issue. The user is questioning if the postdoc's actions are a legitimate use of Bayesian methods or if it's analogous to p-hacking. The user's discomfort suggests they suspect this might be a form of bias masked by Bayesian flexibility. 

  Looking at the postdoc's process: he specified a prior, got an unfavorable result, revised the prior based on a related study, and got a favorable result. Each step seems reasonable individually. But the sequence is problematic. The key red flag is that the prior revision was influenced by the initial data. Even though he cited a related study, the timing after seeing the data introduces suspicion. 

  I recall that in Bayesian methodology, priors should be set before data collection to avoid confirmation bias. The postdoc's revision after seeing the data mirrors HARKing (hypothesizing after results are known) in frequentist contexts. This could lead to false positives, similar to p-hacking. 

  The user's deeper concern might be about whether Bayesian methods truly prevent analytic flexibility issues or just repackage them. They might also be interested in how to teach students about responsible Bayesian practices. The seminar's focus on the replication crisis suggests a need to address methodological rigor across paradigms. 

  I should highlight that the problem isn't Bayesianism per se but the violation of pre-registration principles. The solution would be to pre-specify priors or use methods like prior predictive checks. The user might benefit from discussing how both frameworks require transparency and predefined analysis plans to mitigate biases. 

  Also, considering the audience, the user might want concrete examples to illustrate these points in their seminar. Emphasizing that no statistical method is immune to researcher degrees of freedom is key. The takeaway is that methodological integrity depends on practices, not just the framework used.
answer: |-
  You're right to be troubled. This postdoc's approach isn't inherently "Bayesian malpractice," but it **absolutely replicates the core problem of the replication crisis: researcher degrees of freedom leading to potential false positives.** He hasn't escaped the problem; he's translated it into a Bayesian dialect. Here's a breakdown:

  1.  **The Core Problem: Data-Contingent Flexibility & Confirmation Bias:**
      *   **Frequentist Analogue:** This is directly analogous to "HARKing" (Hypothesizing After Results are Known), p-hacking (trying different tests/covariates/outliers until p<.05), or optional stopping (collecting more data until significance is reached). The *decision* about the analysis (hypothesis, model, stopping rule) is influenced by seeing the data, inflating false positives.
      *   **Bayesian Translation:** Here, the *decision* about the **prior** is influenced by seeing the initial posterior (which incorporates the data). He didn't like the result based on Prior A, so he searched for a justification (the "closely related result") to adopt Prior B, which gave him the result he wanted. This is **prior-hacking** or **confirmation bias operating through prior specification**.

  2.  **Why His Justification ("More Defensible") is Flawed:**
      *   **Motivated Reasoning:** The timing is suspect. *After* seeing an unfavorable result, he *re-evaluated* his prior and found it "too uninformative." This strongly suggests motivated reasoning – searching for reasons to justify a prior that yields a desired outcome. Would he have deemed Prior A "too uninformative" *before* seeing the data, or *if* the posterior had been favorable?
      *   **The "Closely Related Result" Trap:** Citing a related result sounds objective. However:
          *   Why wasn't this result incorporated *from the start*? If it was truly relevant and known, it *should* have informed the initial prior.
          *   If it wasn't known initially, why was it only discovered/considered *after* the unfavorable outcome? Was it a genuine new insight, or a search for supporting evidence?
          *   How "closely related" is it really? The flexibility in judging relevance creates another degree of freedom.
      *   **Subjectivity vs. Objectivity:** While priors are inherently subjective, the *process* of choosing them shouldn't be contaminated by the data they are meant to precede. His process made the prior effectively *data-dependent*.

  3.  **How This Leads to False Positives (Bayesian Style):**
      *   **Inflation of Bayes Factors/Posterior Odds:** By selectively revising the prior towards one that favors his hypothesis *after* seeing suggestive (but unconvincing under Prior A) data, he artificially inflates the evidence *for* his hypothesis in the final analysis. The posterior under Prior B looks strong, but its strength is partly an artifact of the revision process triggered by the data.
      *   **Violation of Pre-Data Principles:** The power of Bayesian methods relies on the prior representing genuine pre-data belief. Revising the prior *based on the data* undermines the logical coherence and evidential interpretation of the posterior. The posterior under Prior B no longer cleanly represents the rational updating of *pre-data* belief.

  4.  **Why Bayesianism Isn't Magically Immune:**
      *   **Researcher Degrees of Freedom Persist:** Bayesian analysis involves numerous choices: likelihood model, prior family (e.g., Normal vs. Cauchy), prior parameters, computational methods, how to handle missing data, which hypotheses to compare, etc. *All* of these choices can be manipulated, consciously or unconsciously, to favor desired outcomes. Your postdoc focused his flexibility on the prior parameters.
      *   **Lack of Pre-Specification:** The key safeguard in *both* paradigms is **pre-specification and transparency**. Just as pre-registering hypotheses, analysis plans, and stopping rules helps curb frequentist flexibility, **pre-registering the prior** (or a well-justified prior specification protocol) is essential for responsible Bayesian inference. Your postdoc did *not* pre-specify his prior revision rule.

  5.  **What *Would* Have Been More Defensible:**
      *   **Pre-Specification:** Declaring the prior *and the justification for it* (including any relevant literature) *before* data collection or analysis begins.
      *   **Robustness Analysis:** Presenting results under *both* Prior A and Prior B, discussing the sensitivity of the conclusion to the prior choice, and transparently explaining the reasoning behind considering Prior B *even if it wasn't pre-specified*. The key is acknowledging the dependence and uncertainty.
      *   **Prior Predictive Checks:** Running simulations *before* seeing data based on the prior to ensure it generates plausible data. If Prior A was truly "too uninformative," this *might* have been apparent beforehand (e.g., generating unrealistically extreme effect sizes too often).
      *   **Using the "Closely Related Result" Prospectively:** If the related result genuinely wasn't considered initially, the *strictly correct* Bayesian approach would be to treat the first experiment as data, update to a *new* prior incorporating that result, and then run a *new, independent experiment* to test the hypothesis under this updated prior. Rerunning the analysis *on the same data* with the revised prior is circular.

  **Conclusion:**

  Your instinct is correct. The postdoc has relocated the problem, not solved it. He engaged in a form of **Bayesian p-hacking** by exploiting the flexibility in prior specification *after* seeing the data. While priors are subjective, the *process* of selecting them *must not* be contingent on the data they precede if valid evidential interpretation is desired. Moving to Bayesian methods does not automatically insulate researchers from confirmation bias or analytic flexibility; it simply changes the tools through which those biases can operate. **Robust scientific inference, regardless of paradigm, requires pre-specification of key analytic choices, transparency about deviations, and sensitivity analyses.** His revised prior *might* be more defensible, but the *process* by which he arrived at it for *this specific dataset* renders the resulting posterior potentially misleading as evidence for his hypothesis. He hasn't insulated himself; he's found a new way to tune the dials.
