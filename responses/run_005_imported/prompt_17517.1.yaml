  Ah, the key twist: Clara’s own grandfather curated the archive, hiding connections to protect the town’s "special" trauma. So the bijection isn’t just missing—it was *erased from the system*. When Leo shows her external records, her worldview fractures: the event transforms from absolute to relative. The vertigo isn’t "everything’s a simulation," but "my singularity was curated."  

