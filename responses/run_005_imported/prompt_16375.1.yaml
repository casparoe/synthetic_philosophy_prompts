answer: |-
  Here’s an original scenario designed to contrast Kantian and *de re* views on moral worth:

  **Scenario: The Reluctant Whistleblower**  
  Dr. Lena Chen is a senior engineer at NovaTech, a company developing autonomous medical drones. She discovers that NovaTech’s flagship model has a critical flaw: under rare weather conditions, its navigation system fails, risking fatal collisions. Management dismisses her concerns, prioritizing profit over a costly recall. Company policy mandates internal reporting only, threatening termination for public disclosure.  

  Lena *believes* she has a moral duty to obey company rules and protect proprietary information. However, she is deeply empathetic toward potential victims—particularly imagining children harmed by malfunctioning drones. Haunted by nightmares of a child injured "because she stayed silent," she anonymously leaks the data to a regulator. She acts *solely* from visceral empathy for strangers, explicitly rejecting her perceived "duty" to stay loyal. When questioned later, she insists, "I did the wrong thing ethically, but I couldn’t live with the guilt."  

  **The Right Action**: Blowing the whistle was objectively right—it prevented foreseeable harm.  

  ### Verdicts  
  1. **Kantian View**: **NO moral worth**.  
     Lena acts *against* her conception of duty (obeying company policy) and is motivated by empathy, not duty. Her torment stems from compassion, not respect for moral law. Kantians would argue her action is merely "in accordance with duty" (since it achieved the right outcome) but lacks moral worth because her motive is pathological (empathy), not pure.  

  2. **De Re View**: **HAS moral worth**.  
     Lena is exquisitely responsive to the *actual right-making features*: the imminent danger to human life and the injustice of corporate negligence. Her empathy directly attunes her to these features, overriding her false belief that loyalty is a duty. Her emotional distress reflects accurate moral perception, not weakness. Thus, she deserves credit for acting virtuously—*despite* her mistaken judgment.  

  ### Which is More Defensible?  
  The **de re view** is more defensible here.  

  **Why**:  
  - **Moral Perception Over Doctrine**: Lena’s empathy enables her to grasp concrete moral realities (lives at risk) that her abstract "duty" to the company obscures. Punishing her for not acting "from duty" ignores that her *feelings* aligned with objective moral reasons—precisely what matters.  
  - **Anti-Rigidity**: The Kantian view crumbles when agents have false moral beliefs (like Huck’s pro-slavery conscience). Insisting on "duty as motive" would deny credit to reformers who acted from compassion against prevailing immoral norms (e.g., abolitionists violating fugitive slave laws).  
  - **Credit for Moral Luck**: Lena’s empathy accidentally led her to do right. But *de re* rightly credits her *sensitivity* to moral reasons, not just outcomes. Kantians reduce her to a flawed vessel, ignoring her responsiveness.  

  **Kantian Counterargument Weakness**:  
  Kantians might argue Lena’s empathy is unreliable (e.g., what if she only cared about *children*, not adults?). Yet here, her empathy generalized appropriately—she feared for "people," not just a specific child. The *de re* view accommodates this: moral worth hinges on *actual* responsiveness in the context, not hypothetical failures.  

  In sum, the *de re* view better captures moral credit by prioritizing an agent’s connection to *what actually matters*, even when their conscious principles misfire. Lena’s action has moral worth because her heart perceived the truth her mind denied—a virtue worth celebrating, not discounting.
