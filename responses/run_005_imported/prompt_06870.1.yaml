answer: |-
  Your identification of the structural parallel between Goodman's "grue" and Kripke's "quus" is insightful and widely acknowledged by philosophers. You're absolutely right that both arguments deploy a deviant function (predicate/rule) that is empirically equivalent to the standard one on all past evidence but diverges wildly in the future. This core similarity is profound and highlights a fundamental challenge in induction and meaning.

  However, while the *problems* share this deviant-function structure, the *contexts, targets, and proposed solutions* differ significantly. This explains Kripke's silence on Goodman and why Goodman's "entrenchment" solution doesn't straightforwardly resolve Kripke's skeptical paradox:

  1.  **Different Philosophical Problems:**
      *   **Goodman (New Riddle of Induction):** Addresses the problem of *projection* or *confirmation*. Given that past evidence equally supports conflicting hypotheses about the future (green vs. grue), how do we justify projecting *one* rather than the *other*? How do we *choose* which predicates are "projectible"? His problem is about *justifying future predictions*.
      *   **Kripke/Wittgenstein (Rule-Following Paradox):** Addresses a problem of *meaning* and *intention*. How does my past use of a word (like "+") determine its correct application in *future*, novel cases? What *constitutes* my meaning addition by "+" rather than quus? Kripke presents a *skeptical challenge*: there is *no fact* (past behavior, mental state, disposition) that constitutes meaning one thing rather than the other. His problem is about the *possibility of meaning itself*.

  2.  **Why Entrenchment Doesn't Directly Solve Kripke's Puzzle:**
      *   **The Skeptical Target:** Kripke's skeptic argues there is *no fact of the matter* about what you meant in the past. Pointing to entrenchment ("plus is the entrenched rule") presupposes that there *is* a fact about which rule *was* entrenched in your past usage. The skeptic challenges *that very presupposition*. How do you know the *past community* meant *addition* by "+" and not *quaddition*? The grue/quus problem applies recursively to the *past* meaning of "entrenched rule" or "plus". Entrenchment relies on a stable past meaning that the skeptic denies exists.
      *   **Normativity vs. Description:** Meaning is *normative*. Meaning addition by "+" tells you what you *ought* to do in new cases (e.g., say "125" for "68+57"). Entrenchment is fundamentally *descriptive* and *sociological*. It says "this is the rule we *have* used." But why *should* I continue using the entrenched rule? Why is it *correct*? Kripke's puzzle highlights the gap between descriptive past practice and normative future correctness. Goodman's solution addresses *which description to project*, not the *normative force* of following a rule.
      *   **Dispositions vs. Entrenchment:** You rightly note the parallel between "entrenched" and "dispositionally set up." Kripke explicitly argues against dispositional accounts (pp. 22-37). His key objections apply equally to entrenchment-as-disposition:
          *   **Error:** I can be disposed to make mistakes (e.g., say "5" for "2+2" when tired). Entrenchment/disposition doesn't capture the *norm* I *ought* to follow, only what I *tend* to do.
          *   **Finitude:** My past dispositions (or the community's entrenched practices) only cover a finite number of cases. The skeptic asks about cases *beyond* any I've encountered or been disposed to handle. What fact determines that my disposition *now* (or the community's entrenchment) points to the *correct* application in those novel cases?
          *   **Circularity:** Defining "meant addition" as "disposed to add" (or "following entrenched addition") seems circular. It uses the very notion (addition) that it's trying to define/ground.

  3.  **Kripke's "Solution" vs. Goodman's Solution:**
      *   Goodman offers a *positive*, pragmatic solution: project the entrenched predicates. This directly addresses the New Riddle.
      *   Kripke presents Wittgenstein's position (as he interprets it) not as a *solution* dissolving the skeptical doubt by finding the missing fact, but as a *skeptical solution*. It concedes the skeptic's point that there is no fact constituting meaning but argues we can still meaningfully talk about meaning by grounding it in communal agreement and practices of correcting deviations. The emphasis shifts from internal facts to external, public criteria ("assertability conditions" rather than "truth conditions"). This is fundamentally different in spirit from Goodman's appeal to entrenchment. Entrenchment is a factor *within* the practice Goodman describes; Kripke's skeptical solution is about the *conditions of possibility* of the practice itself.

  **Where the Parallel Holds and Where it Breaks:**

  *   **Holds:** The core logical structure of the deviant function argument is identical. Both expose the underdetermination of future application (prediction/rule-following) by finite past evidence/behavior. Both challenge naive views of induction and meaning.
  *   **Breaks:**
      *   **Target:** Projection/Confirmation (Goodman) vs. Meaning/Intention (Kripke).
      *   **Skepticism's Depth:** Goodman's riddle is about *choosing* between projectible predicates. Kripke's skeptic challenges the very *existence* of determinate meaning or rules.
      *   **Proposed Resolution:** Goodman offers a substantive, pragmatic criterion (entrenchment). Kripke/Wittgenstein (as presented) offer a skeptical dissolution grounded in communal practice, not a criterion like entrenchment *within* that practice.
      *   **Normativity:** Goodman's solution doesn't grapple with the normative "ought" inherent in rule-following in the way Kripke's puzzle demands. Entrenchment tells you what's *customary*, not what's *correct* in a novel case if custom hasn't spoken yet.

  **Why Kripke Ignores Goodman:**

  *   **Different Philosophical Traditions:** Goodman worked primarily in philosophy of science, logic, and aesthetics. Kripke was engaging deeply with Wittgenstein, philosophy of language, and metaphysics. The communities overlapped less in the early 1980s.
  *   **Focus on Wittgenstein Exegesis:** Kripke's primary aim was to present a compelling interpretation of Wittgenstein's cryptic remarks. Goodman's problem, while structurally similar, wasn't part of that exegetical project.
  *   **Perceived Different Targets:** Kripke likely saw the rule-following paradox as attacking a more fundamental level (meaning and intentionality) than Goodman's problem (projection of predicates), even if the structure was similar. The skeptical challenge to the *existence* of meaning facts felt distinct from the problem of *selecting* between projectible hypotheses.
  *   **The Normativity Gap:** Kripke's central concern – how past use *obligates* future use – isn't directly addressed by entrenchment, which remains descriptive.

  **Conclusion:**

  You've correctly identified a deep and important structural parallel. Goodman *did* pioneer the "deviant function" argument that Kripke later deployed masterfully. However, the problems they address are distinct: Goodman tackles the justification of inductive projections, Kripke tackles the very possibility of meaning and rule-following. Consequently, Goodman's solution of entrenchment, while powerful for its own problem, cannot resolve Kripke's skeptical paradox. Entrenchment presupposes stable past meaning, which the skeptic denies, and fails to bridge the gap between descriptive past practice and the normative "ought" of rule-following. Kripke's silence on Goodman is likely due to this difference in focus and target, despite the shared logical machinery. The parallel between "entrenched" and "dispositionally set up" is real, but Kripke forcefully argues that *neither* concept can answer the radical skeptical challenge about meaning and normativity.
