  this probably has nothing to do with the history of economic thought class i'm taking (unless it does, in which case i clearly wasn't paying attention) but here's my situation: a friend from my dorm found a new side hustle where he buys limited-release sneakers the second they drop online and resells them a week later, still in the box, for like 3x what he paid. his whole argument is that this isn't any different from what a regular shoe store does, buy low sell high, thats literally retail. i can't really say he's wrong, the transaction structure is the same, but it still feels different from him just opening an actual store and i can't pin down why. is there an actual distinction here or am i just hating on hustle culture for no reason?
