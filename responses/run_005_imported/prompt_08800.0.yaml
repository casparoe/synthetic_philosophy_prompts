answer: |-
  You've hit on a fascinating economic gray area that *absolutely* connects to the History of Economic Thought! Your unease isn't just "hating" – there are genuine distinctions rooted in classical and modern economic theory. Here's a breakdown:

  1.  **The Retailer's Function (Adding Value & Reducing Friction):**
      *   **Classical View (Smith, Ricardo):** Retailers don't just buy low and sell high. They perform valuable economic functions that justify their margin. They:
          *   **Bear Risk:** They invest capital in inventory without knowing if it will sell. Your friend knows *exactly* which limited sneakers will resell instantly.
          *   **Provide Convenience & Aggregation:** They hold diverse stock, saving consumers the immense time/effort/cost of finding every item directly from countless producers. Your friend holds *only* hyped items consumers already know about and are desperately trying to find *at retail price*.
          *   **Offer Location & Accessibility:** They provide physical (or established online) spaces. Your friend operates ad-hoc, likely online-only via platforms like StockX/GOAT.
          *   **Provide Services:** Expertise, curation, returns, warranties, customer service. Your friend provides none of this – he's selling a sealed box.
      *   **Your Friend's Activity:** He performs *none* of these traditional retail functions. He's not reducing friction for the end consumer; *he's creating the friction* by snapping up supply before regular consumers can access it at MSRP.

  2.  **Arbitrage vs. Value Creation:**
      *   **Arbitrage (Modern Finance):** This is closer to what your friend is doing. He exploits a temporary market inefficiency – the mismatch between the fixed initial retail price and the much higher immediate secondary market price fueled by scarcity and hype. He buys where the price is artificially low (the retail drop) and instantly sells where the market-clearing price is much higher.
      *   **Value Creation?:** Classical economists (and many modern ones) would argue pure arbitrage, while profitable, doesn't *create* new value in the economy. It merely captures value by exploiting the inefficiency. A retailer arguably creates value through the services listed above.

  3.  **"Unproductive Labour" (A Controversial but Relevant Concept):**
      *   **Marxist View (Karl Marx):** Marx distinguished between "productive" labour (which creates surplus value directly tied to commodity production) and "unproductive" labour (like many commercial activities, which merely circulate existing commodities). He saw merchants' profits as deriving from appropriating a share of the surplus value created in production, not creating new value themselves.
      *   **Connection:** While Marx's framework is specific, it highlights the historical debate about whether simply moving goods (especially without adding services) is truly productive. Your intuition might be touching on this: your friend isn't *making* the shoes or providing a meaningful *service*; he's just inserting himself into the distribution chain to capture profit solely based on privileged access/timing.

  4.  **The Nature of the Good & Artificial Scarcity:**
      *   **Veblen Goods / Positional Goods (Thorstein Veblen):** These sneakers are often "Veblen goods" (demand increases with price due to status) or "positional goods" (value derived from exclusivity/scarcity).
      *   **The Reseller's Role:** By exacerbating scarcity and driving prices higher, resellers like your friend *intensify* the positional/Veblen aspects. They don't make the shoe *better*; they make it *harder to get* at retail, which paradoxically increases its desirability and market price for some. The manufacturer *intentionally* creates artificial scarcity for marketing; the reseller exploits it purely for profit.

  **Why It Feels Different (Your Intuition is Correct):**

  1.  **No Value-Added:** As above, he adds no service, convenience, expertise, risk-bearing (beyond the immediate flip), or accessibility. He's a pure intermediary exploiting a timing/access loophole.
  2.  **Zero-Sum Perception:** His gain seems directly tied to a loss for the genuine consumer who wanted the shoe at retail price but was beaten to it by a bot or script (tools resellers often use). Retail feels less zero-sum (you pay more for convenience/services).
  3.  **Exploiting Hype vs. Serving Demand:** Retailers generally aim to meet existing consumer demand. Resellers actively fuel and profit from speculative hype cycles, sometimes creating artificial demand bubbles.
  4.  **Ethical Dimension (Fairness & Access):** There's a perception that he's "gaming the system" using technical advantages (fast internet, bots) to bypass the intended retail experience, denying fair access to enthusiasts, purely for personal gain. Traditional retail feels like a more transparent, consented transaction.

  **Connection to History of Economic Thought:** You were paying attention! This debate echoes centuries-old arguments:
  *   **Mercantilists:** Focused on buying low/selling high (like your friend), but on an international scale (buy raw materials cheap, sell finished goods high).
  *   **Classical Economists (Smith, Ricardo):** Shifted focus to production and the value-added by labour and capital. They saw merchants as necessary but were skeptical of profits derived *purely* from exchange without production or significant service.
  *   **Marxists:** Explicitly critiqued merchant capital as "unproductive" in the value-creation sense.
  *   **Austrians (Mises, Hayek):** Might defend your friend! They see *all* profit as arising from entrepreneurial alertness to arbitrage opportunities (spotting the price discrepancy) and argue this process *does* serve a function by moving resources to where they are most valued and signaling market information.

  **Conclusion:** Your friend is technically correct that the basic "buy low, sell high" principle exists in retail. **However, the *distinction* you feel is real and grounded in economics:** He's primarily an **arbitrageur** or **speculator** exploiting a specific market inefficiency (artificial scarcity + hype) and privileged access, *without* performing the traditional value-adding functions of a retailer (risk-bearing, aggregation, convenience, service). He's capturing value created by the brand's marketing/scarcity and the consumer's desire, not creating new value through service. Your unease likely stems from the perceived lack of productive contribution and the zero-sum nature of his activity compared to traditional retail. It's not just "hating on hustle culture"; it's recognizing a different (and historically debated) economic role.
