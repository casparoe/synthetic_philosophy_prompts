  For encroachment, the subject's high stakes affect knowledge even if she doesn't know about them. This seems to violate access intuitions. But theorists like Stanley might argue that knowledge is factive and stakes are part of the world, so awareness isn't necessary. Still, it feels counterintuitive that external factors she’s unaware of strip her knowledge.

  For contextualism, the oblivious subject’s self-attribution ("I know") uses her low-stakes context, so it’s true. But a bystander aware of the high stakes would deny knowledge in their context. The challenge is whether these two can coexist without disagreement. Contextualism says they’re talking past each other since "knows" has different meanings. But this might seem ad hoc, especially if the bystander references the subject's stakes. 

  The user mentioned the bystander and subject both making claims simultaneously. Contextualism handles this via different contexts, so no contradiction. But the user might find it unsatisfying that the bystander’s denial doesn’t contradict the subject’s claim. 

  Assessing which looks less ad hoc: encroachment has the access problem, which is a big cost. Contextualism avoids this but might seem semantically ununified. Since access intuitions are strong in epistemology, contextualism might fare better here. Also, in the case where the subject remains oblivious, contextualism preserves her self-knowledge attribution, which aligns with her internal state.

