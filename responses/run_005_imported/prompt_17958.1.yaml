  Honest treatment of the strongest point on the other side:

  The strongest point of the first engineer (who wants the patch) is that the signal only pertained to the US cluster, so the update should not change the total probability assigned to the EU cluster. This is intuitive: we have no new information about the EU cluster, so why should our belief about the EU cluster change? The KL update, by changing the EU cluster total, seems to violate this intuition. The patch fixes the EU cluster total and only updates the US cluster. This is a straightforward and easy-to-explain method. It also has the advantage of being computationally simpler.

  However, as we have seen, the patch does not minimize the KL divergence and introduces an arbitrary choice (fixing the cluster split). Moreover, the KL update is the standard method in information theory for incorporating constraints and is used in many applications. It is the most conservative update in the sense of information geometry.

