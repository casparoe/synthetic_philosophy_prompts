  ---

  **To**: Incident-Response Tooling Review Board  
  **From**: [Your Name]  
  **Date**: [Current Date]  
  **Subject**: Recommendation on On-Call Automation Update Behavior  

  ### Background
  During a recent incident, our on-call bot updated its probability distribution over the four subsystems (US-gateway, US-auth, EU-gateway, EU-auth) based on an automated signal. The signal stated: "if the fault is in the US cluster, it is about three times as likely to be the gateway service as the auth service." The bot updated the distribution by minimizing the Kullback-Leibler (KL) divergence from the prior distribution under the given constraint, resulting in approximately (35%, 12%, 26.5%, 26.5%). This update reduced the overall US cluster probability from 50% to 47% and increased the EU cluster to 53%. 

  ### Issue
  One engineer proposed a patch that would restrict updates to the cluster named in the signal (in this case, the US cluster), leaving the other cluster's total probability unchanged. A second engineer argued that such a patch is arbitrary because it fixes the "cluster" split without justification and that fixing another split (e.g., "gateway vs auth") would yield different results.

  ### Analysis
  The current update method (KL divergence minimization) is a standard approach in information theory for updating a probability distribution to satisfy constraints while minimizing the informational distance from the prior. The constraint from the signal was a conditional statement about the US cluster, which translates to:  
     `P(US-gateway) = 3 * P(US-auth)`.  

  The KL update satisfies this constraint and minimizes the overall divergence, resulting in a distribution that is as close as possible to the prior. The update adjusted the EU cluster probabilities symmetrically (because the constraint did not break the symmetry within the EU cluster) and the overall EU cluster probability increased to 53%.  

  The proposed patch would fix the total probability of the US cluster at 50% and redistribute within, leading to (37.5%, 12.5%, 25%, 25%). While this satisfies the constraint, it does not minimize the KL divergence. Moreover, the patch arbitrarily chooses to fix the cluster split, which is not required by the constraint. Fixing a different split (e.g., the overall gateway vs auth split) would lead to a different distribution, and there is no clear reason to prefer one over the other.  

  ### Recommendation
  We recommend retaining the current KL divergence update method without the patch. This method is mathematically principled and avoids arbitrary choices. It is the standard approach for incorporating constraints in probability distributions.  

  However, we acknowledge the strongest point of the patch: it aligns with the intuition that a signal about one cluster should not change the total probability of the other cluster. This is a valid concern. The KL update, by changing the EU cluster's total, may seem counterintuitive. But note that the constraint about the US cluster indirectly affects the entire distribution because probabilities must sum to 1. The KL update minimizes the overall change while respecting the constraint.  

  ### Rollout Plan
  We propose:  
  1. **Approval**: Seek board approval for the current KL divergence update method.  
  2. **Timeline**: Roll out the current behavior (without the patch) on Thursday, [date of next Thursday].  
  3. **Communication**: Document the update method and its justification for the engineering team.  

  ### Conclusion
  The current update method is sound and should be retained. The patch, while intuitive, introduces an arbitrary constraint and does not minimize the KL divergence. We are open to further discussion but believe the current method is the best approach.  

