prompt: |-
  I teach formal epistemology and host a departmental podcast featuring specialists in the field. Next episode's guest is known for her defense of van Fraassen's Reflection Principle: the requirement that your current credence in a proposition, conditional on your credence in it at a later time being r, should itself equal r. Draft eight to ten interview questions that go beyond having her restate the principle. Include at least one question on whether the diachronic Dutch book argument for Reflection actually establishes an epistemic failure rather than a merely prudential one, one on the restriction she needs to block counterexamples involving anticipated hypnosis, drugging, or induced memory loss, one on how Reflection is supposed to relate to, or go beyond, ordinary conditionalization, and one on what her view implies about the Sleeping Beauty case. For each question, add a follow-up keyed to the answer she is most likely to give.
