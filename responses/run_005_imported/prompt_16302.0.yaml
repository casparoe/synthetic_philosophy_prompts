  The teammate's argument is based on base rates. If 90% of confident students are wrong, that's strong evidence. But the user's own confidence is evidence too. So, it's about weighing prior probability (the base rate) against the likelihood (their confidence). 

  The user might need a structured approach. First, acknowledge the statistic as a serious signal. Then, methodically re-examine the problem, possibly with fresh eyes. Maybe involve teammates to check their work. Also, consider if the problem has a known trick or common pitfall. 

  The user's deeper need might be about handling uncertainty in expertise. They want to trust their skills but also respect data. Balancing humility and confidence is key. They might need strategies for such situations in competitions, like double-checking specific steps or seeking peer review when possible. 

