  The unresolved tension: Is God’s consistent choice *equivalent* to natures? Ghazālī says no—it’s will, not necessity. Rushd says yes—you’ve just renamed "nature" as "divine habit." The user’s "heavy cost" (brute fact) is real, but Ghazālī might accept it as the price of God’s sovereignty.  

