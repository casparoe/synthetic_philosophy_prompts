prompt: |-
  I recently learned about the no-trade theorem in a econ podcast, which apparently proves that if two rational investors both know the other is rational, they should never trade with each other based on private information. But obviously millions of shares change hands every day on the stock market. Doesn't this mean that basically everyone trading on Wall Street is behaving irrationally, and if so, why do economists still treat market prices as trustworthy indicators of value?
