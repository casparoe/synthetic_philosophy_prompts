prompt: |-
  okay so in TOK (theory of knowledge, it's this IB class) we got into testimony as a "way of knowing" but it was all pretty surface-level, so i went down a rabbit hole afterward and found out theres this whole real debate between reductionists and anti-reductionists about it that seems way more interesting than what we covered in class. reductionists (tracing back to Hume) say you're only justified in believing what someone tells you if that trust can be cashed out in terms of your own perception/memory/induction, while anti-reductionists (Reid, and apparently Coady and Burge keep it going today) say testimony is its own basic source of justification, not reducible to that other stuff. can you compare the two for me? specifically, which one actually deals better with the fact that little kids believe almost everything adults tell them WAY before they could've built up enough evidence that adults are reliable? feels like a huge problem for reductionism but idk if they've got a good comeback, thats what i actually wanna know.
