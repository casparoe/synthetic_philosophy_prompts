  Let me unpack this step by step. First, the core clash: reductionists (Hume-style) treat testimony as derivative—you need independent reasons (perception, memory, induction) to trust a speaker. Anti-reductionists (Reid et al.) say testimony is foundational; you can just believe unless there are red flags.  

  Now, the kid problem is brutal for reductionists. Toddlers don’t track speaker reliability; they just swallow what adults say. If reductionism requires evidence-based trust, kids shouldn’t be justified—but that’s absurd. Anti-reductionists celebrate this: kids have innate, non-inferential trust (Reid’s "veracity principle").  

  But reductionists aren’t helpless. They might argue:  
