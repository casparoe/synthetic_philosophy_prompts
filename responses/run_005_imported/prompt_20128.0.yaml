answer: |-
  The desert air tasted like static and burnt plastic. Mara adjusted her respirator, the rhythmic hiss syncing with her frustration. Site Gamma-7 was supposed to be a quick survey: confirm the preliminary scans showing pre-Collapse alloy deposits beneath the alkali flats. Instead, her ground-penetrating radar had pinged something unexpected – shallow, anomalous, *organic*. Now, three hours into meticulous scraping under the twin suns of New Gobi, she’d unearthed it. Not alloy. Bone. A human skull.

  "Contamination," she muttered, the word dry in her throat. "Pre-Collapse scavenger. Got lost. Or dumped." Standard procedure dictated bagging it for the bio-archive back in the domed city. But procedure felt suddenly hollow, absurd even, kneeling in this vast, indifferent silence with this relic of a forgotten death. It was bleached white, smooth as ceramic under her gloved fingers, the lower jaw missing. The orbits stared past her, towards the impossibly distant mountains.

  That night, inside the humming, climate-controlled belly of her crawler unit, the skull sat on her small workbench. She’d logged it: *Gamma-7, Sector Delta. Specimen #001. H. sapiens. Fragmentary cranial remains.* The sterile words glared back from the screen. Outside, the wind picked up, a low moan against the reinforced hull. The silence inside felt heavier.

  Sleep wouldn’t come. The image of those empty sockets bored into her thoughts. She was a systems engineer, a practical woman. Death was system failure, entropy, data loss. Clean. Final. Yet, this skull… it felt like an unanswered query. On impulse, fueled by fatigue and the eerie solitude, she picked it up. It was cool, surprisingly dense. "Alright," she whispered, feeling foolish. "How did you end up out here? Bad luck? Worse choices? Did you just… stop?"

  The silence amplified. She almost laughed at herself. Talking to a fossil. She placed the skull on her narrow cot, intending to bag it properly in the morning. Too tired to move it, she lay down, resting her head not on her inflatable pillow, but directly against the smooth, cool curve of the parietal bone. "Make yourself useful," she mumbled, closing her eyes. "Best pillow I’ve got."

  The dream wasn’t like dreaming. There was no transition. One moment, darkness; the next, she was *awareness*, floating in a vast, cool, silent space. Before her, not the skull, but a coalescence of light and shadow, forming a face – ancient, genderless, etched with a profound, unsettling calm.

  *"You ask how I came to be beside the road?"* The voice resonated not in her ears but within her bones, dry and rustling like desert wind over stone. *"Perhaps the road came to be beside me. Does it matter? The Great Process deposited me there, as it deposited you in your humming metal shell."*

  Mara tried to speak, to protest, but her thoughts were the voice. *"Process? You mean decay. Death."*

  The skull-being emitted a sound like pebbles tumbling. *"Decay? Transformation. The Clod loads us with form – this body, that mind, its worries and wires. It wears us down with the friction of living: your deadlines, your scans, the taste of recycled air. Then, in its kindness, it eases the burden. Old age loosens the grip. And finally… rest. True rest. No more crawling across alkali flats chasing echoes of metal."*

  *"Rest?"* Mara’s thought-voice was sharp. *"It’s oblivion. The system shuts down. Permanently."*

  *"Oblivion?"* The skull seemed genuinely amused. *"Says the temporary configuration of matter currently using me as a headrest. Tell me, Engineer: when your crawler unit powers down for maintenance, is it ‘dead’? Or is it simply… resting? Reorganizing? The energy doesn’t vanish. The components don’t cease. They become available."*

  *"But *I* cease. My consciousness. My… me."*

  *"Your current program terminates,"* the skull conceded. *"But the substrate persists. And who’s to say the next configuration isn’t… preferable? You cling to your particular arrangement of neurons and synthetic proteins as if it were the pinnacle of existence. How provincial."*

  *"Provincial?"* The insult stung, even in a dream.

  *"Utterly. You assume *life* – your specific, anxious, scheduled life – is the superior state. Based on what? Fear of the unknown? It’s like a single subroutine declaring it understands the entire network’s purpose. Arrogance."* The light-shadows shifted. *"Let me tell you, little flicker of organized dust: here, there is no schedule. No malfunction alerts. No yearning for cool water or warm approval. No dread of the twin suns or the corporate audit. Here, there is only… peace. The deep, quiet hum of the Process itself. No king in his domed palace, gorged on synth-protein and filtered air, knows a contentment half so profound."*

  Mara felt a surge of her waking pragmatism. *"Easy for you to say. You’re not facing dissolution."*

  *"I *am* dissolution,"* the skull replied, its calm unbroken. *"And it is… pleasant. Imagine no longer being a bug trapped in the circuitry, constantly sensing impending system failure. Imagine being the current flowing through it, or the silence when the power cycles. Your arm fears becoming a rooster? Why? It might crow the dawn! Your backside fears becoming a wheel? Ha! Hitch it to a willing spirit-horse! Never buy a carriage again! Why mourn the loss of one form when infinite others beckon?"*

  The concept was ludicrous, terrifying… and yet, it landed. The fear wasn't of non-existence, but of becoming something *else*, something unknown and uncontrolled. The skull wasn’t advocating nihilism; it was describing a fundamental fluidity she’d never considered. Her "self" wasn't a static chip, but a temporary pattern in the cosmic data stream. Termination wasn't deletion; it was reassignment.

  *"You mourn your lost flesh?"* the skull pressed, its tone almost gentle now. *"The Process needed it back. Loaned it to you for a while. Wore it out. Now it’s time to return it. Why drum on the basin and weep? Drum on the basin and *sing*! The song changes, that’s all."*

  The vast, cool space began to recede. Mara felt the hard curve of bone against her cheek, the hum of the crawler’s life support, the gritty dryness in her throat. The profound peace the skull described remained tantalizingly out of reach, a foreign operating system she couldn’t boot.

  Morning light, harsh and metallic, streamed through the crawler’s viewport. Mara sat up slowly. The skull lay beside her pillow, inert, a scientific specimen again. But the dream clung like desert dust. She picked it up, not with the clinical detachment of the night before, but with a strange, newfound curiosity. The smooth dome felt different. Not just bone, but… potential.

  The dread she’d felt looking at it yesterday was still there, a low-level hum, but it was overlaid now with something else. Awe? A disturbing sense of kinship? The skull’s words echoed: *"Provincial… the song changes…"*

  She didn’t bag it immediately. She placed it back on the workbench, facing the viewport towards the endless, shimmering flats. Her project was delayed. The alloy deposits were still down there. Her corporate deadlines still loomed. But the sterile urgency had bled out of it.

  Outside, the wind sighed. Mara imagined it not as an eroding force, but as the breath of the Great Clod itself, shifting the sands, reshaping the landscape, patiently wearing down mountains and men. She looked at the skull, then at the vast, indifferent desert.

  "Okay," she said aloud, her voice rough. "Crow at dawn if you want. See if I care." She didn’t sing. Not yet. But the basin of her certainty had been struck, and the sound it made was strange, unresolved, and strangely lighter than before. She powered up her scanner, not just for the alloy, but watching the readout flicker with the myriad tiny transformations happening right beneath her treads, a vast, ongoing process where even a lost skull was just… temporarily repurposed material. The song hadn't ended. It had just changed key.
