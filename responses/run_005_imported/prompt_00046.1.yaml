  Compare the propensity interpretation of probability with objective single-case chance more broadly. Is propensity theory just one way of cashing out single-case chance, or does its appeal to dispositional/causal structure add substantive commitments that other single-case accounts avoid? Use Humphreys' paradox to sharpen the comparison.
