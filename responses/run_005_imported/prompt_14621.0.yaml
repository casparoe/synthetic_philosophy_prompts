  Here’s a warm, funny, and insightful speech that honors your brother’s journey, Priya’s unique role, and works for both sides of the room – weaving behavioral econ in subtly for the experts while keeping it heartfelt and humorous for your family:

  **(Start with a warm smile, raise your glass slightly)**

  "Good evening, everyone! For those who don’t know me, I’m [Your Name], [Brother's Name]’s brother, and incredibly honored to be his Best Man today. Now, anyone who knows my brother knows a few things: he’s got a huge heart, an infectious laugh, and... let’s just say... a *remarkable* enthusiasm for trying new things."

  **(Light chuckle from the room)**

  "I mean, seriously. Over the years, we’ve seen [Brother's Name] dive headfirst into careers with the passion of a startup founder... for about as long as it takes to watch a Netflix series. Gym memberships? He collected the T-shirts like they were rare Pokémon cards. Even relationships... well, let's just say his previous track record made *me* nervous about RSVPing 'plus one'!"

  **(Gentle laughter - keep it light and affectionate, not mean)**

  "And honestly? For a long time, I just thought, 'That’s [Brother's Name]! Always chasing the next shiny thing!' But then... **(lean in conspiratorially)** ...I got weirdly obsessed with understanding *why* we humans sometimes make choices that baffle even ourselves. I fell down a rabbit hole reading about how our brains value things *now* versus *later*. Turns out, for some of us, the allure of that immediate reward – that new job, that weekend off, that extra slice of cake – can sometimes make those fantastic *future* rewards, like career stability or... say... six-pack abs... feel incredibly far away and less shiny."

  **(Pause, glance knowingly but warmly at Priya's side of the room, especially if you catch the advisor's eye - a small, subtle nod of recognition for them)**

  "Psychologists and economists have a fancy term for this: **hyperbolic discounting**. Basically, the distant future feels... well... *distant*. And our brains aren't always great at weighting it properly against what's right in front of us. It’s not about *meaning* the commitment any less when you make it. It’s about the math in your head changing when temptation gets close. **(Smile at your brother)** Sound familiar, mate?"

  **(Brother likely laughs or nods, audience chuckles - keep the tone understanding, not accusatory)**

  "So, when [Brother's Name] told me he was marrying Priya, part of me did that older-brother calculation: 'Okay, commitment horizon... check!' But then I saw them together. And I saw something different. I saw something that cuts right through that 'distant future' problem."

  **(Turn fully to Priya, sincere warmth)**

  "Priya, you see, you’re not just the *distant future* reward. You are the **immediate joy**. You are the fascinating conversation *right now*. You are the person who laughs *with* his impulsiveness, not just *at* it. You challenge him intellectually – and trust me, watching my brother try to keep up with a behavioral econ PhD candidate is its own kind of hilarious and wonderful spectacle. You ground him, but you also light him up... *today*."

  **(Turn back to the room)**

  "The magic isn't that [Brother's Name] has suddenly become a monk of delayed gratification. The magic is that **with Priya, the 'long-term commitment' *is* packed with 'immediate rewards' every single day.** She makes the journey itself so incredibly valuable *right now* that the temptation to flip the script just... doesn't land the same way. She doesn't just represent a future 'happily ever after'; she *is* the happily *right now*."

  **(Share a quick, specific anecdote - keep it warm and illustrative, not a roast)**
  "Like that time he got the wild idea to [mention a brief, funny but endearing example of his impulsivity - e.g., 'build a chicken coop in the backyard at 10 PM'], and instead of rolling her eyes, Priya was right there, [mention her reaction - e.g., 'researching heritage breeds on her phone and debating the optimal coop design... while reminding him he had work in the morning']. She meets him where he is, but gently steers the ship towards the horizon."

  **(Raise your glass again)**
  "So, here’s the truth: This commitment holds not because my brother has magically rewritten his brain's wiring overnight. It holds because he found someone so extraordinary, so engaging, so *present* and so *right* for him, that **choosing Priya every single day isn't just a promise for the future, it's the absolute best, most rewarding choice he can make *today*.** She makes the long-term investment feel like the most exciting immediate payoff."

  **(Look directly at your brother and Priya)**
  "Brother, I am so incredibly proud of the man you are, and seeing the happiness and stability you’ve found with Priya is genuinely wonderful. Priya, thank you for seeing the amazing, committed heart beneath the whirlwind, and for being the brilliant, kind, and endlessly patient partner he absolutely needs. You’ve somehow made the 'long haul' look like the most fun, rewarding adventure imaginable. We all see how much you adore each other, and it’s truly inspiring."

  **(Turn back to the room, full warmth)**
  "Everyone, please raise your glasses with me...
  **To [Brother's Name] and Priya!** May your life together be filled with endless fascinating conversations, shared laughter, unwavering support, and a lifetime of choosing each other – not just for the distant horizon, but because every single day together is simply the best choice you could possibly make. Cheers!"

  **(Big smile, clink your glass, lead the applause)**

  **Why this works:**

  1.  **Honest & Warm:** Acknowledges his past patterns without cruelty, frames it through a lens of understanding (brain wiring), not blame.
  2.  **Funny & Accessible:** Uses relatable humor (Netflix, Pokémon, cake) that lands with your family. The "weird obsession" line about your reading is self-deprecating and funny.
  3.  **Behavioral Econ Nod:** Clearly explains hyperbolic discounting in simple, non-jargon terms. Priya's side (especially the advisor) will *immediately* recognize the accurate application and the clever twist – Priya as the *immediate reward* making the long-term commitment sustainable. It shows deep thought without being a lecture.
  4.  **The Crucial Twist:** The core message isn't "he's cured," it's "**she changes the equation.**" Priya makes the *present* of the commitment so rewarding that the temptation to discount the future diminishes. This is profound, honest, and incredibly flattering to Priya.
  5.  **Flatters Priya:** Highlights her intelligence, patience, humor, and the specific ways she complements him. The anecdote shows her in action.
  6.  **Positive & Hopeful:** Ends on a strong, optimistic, and loving toast focused entirely on their future together.
  7.  **Timing:** This structure should comfortably fit within 5 minutes, allowing for pauses and laughter.

  **Delivery Tips:**

  *   **Pace:** Speak clearly and confidently. Pause for laughter after the lighter jokes.
  *   **Eye Contact:** Connect with your brother, Priya, both sides of the family, and especially Priya's advisor when mentioning the behavioral econ concept (a quick, knowing glance is enough).
  *   **Tone:** Keep it warm, affectionate, and sincere, especially when talking about Priya and their relationship. The teasing should be gentle and loving.
  *   **Practice:** Read it aloud several times to get the flow and timing right. Time yourself!
  *   **The Anecdote:** Choose something *real* and *positive* that illustrates their dynamic. Keep it brief (30 seconds max).

  This speech acknowledges reality, celebrates their love intelligently, honors Priya profoundly, and leaves everyone feeling warm and optimistic about their future. Good luck!
