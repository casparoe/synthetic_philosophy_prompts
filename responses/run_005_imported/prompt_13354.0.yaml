  Here’s a toast that navigates the theological tightrope with warmth, humor, and philosophical integrity—tailored for your audience. It clocks in at just under 5 minutes when read aloud with pauses and leans into your sister’s journey while honoring the complexity of Molinism.  

  ---

  ### The Toast  
  (Clink glass gently)  

  Family, friends, philosophers—and especially those of you who *aren’t* philosophers but have kindly tolerated us tonight—welcome. As maid of honor, I’ve been tasked with celebrating two things: the love between my brilliant sister and her fiancé, and a 16th-century Jesuit’s theory of divine knowledge. (Pause for laughter) *Yes*, this is what happens when you marry a philosopher.  

  A few years ago, if you’d told me my sister would become a card-carrying Molinist, I’d have laughed. I remember dinners where her now-fiancé would explain Luis de Molina’s “middle knowledge,” and she’d roll her eyes so hard I feared for her optic nerves. But here we are: she quotes *Concordia* at breakfast, and I’ve learned more about counterfactuals of freedom than I ever expected.  

  So, for the uninitiated: Molinism is about how God knows *everything*—including what we’d freely choose in any circumstance—without controlling our choices. Imagine God, *before* creating the world, looking at every possible scenario: every person, every crossroads, every “what if?” He sees *this* moment right now—not because He scripted it, but because He knew exactly what choices you two, and all of us, would *freely* make in response to His grace.  

  (Pause, turn to the couple)  

  Which brings me to you two.  
  God didn’t just *foresee* your marriage; He knew every twist, every near-miss, every late-night debate about metaphysics that brought you here. He knew how you’d *freely* choose each other in a thousand possible worlds—if you’d met in a library, a coffee shop, or, I don’t know, a debate on divine foreknowledge. (Smile) And in His wisdom, He created *this* world—the one where your choices collide so perfectly.  

  To our Reformed family: no, this isn’t a backdoor to human arrogance. God’s sovereignty isn’t diminished; it’s *magnified*. He doesn’t need to puppet our wills to orchestrate beauty. He’s so sovereign, He can weave our freedom into His design.  

  To the philosophers: no, this isn’t compatibilism in a fancy hat. (Nod to the grounding objection) And yes, we all know Molina still owes us an answer for *how* God knows those counterfactuals. But tonight? We’re celebrating that he *does*—and that this knowledge is intimate, not invasive.  

  (Put hand on heart, warm tone)  

  Sis, your journey from eye-rolls to Molinism mirrors your love story. You weren’t destined; you were *known*. Known so deeply that God built reality around the promise of your “yes.” Your fiancé didn’t win your heart by divine coercion; he won it freely, over tacos and Thomas Aquinas. And that’s the miracle: your love is *yours*, yet it’s nestled in the very architecture of grace.  

  So let’s raise a glass:  
  To the God who knows all our “what ifs”—and chose a world where your “what if” became “what is.”  
  To two people who chose freely, loved fiercely, and proved that even middle knowledge can’t predict how ridiculously happy you’d look today.  
  And to a marriage built not on fate, but on a love so true, it was worth creating a universe for.  

  Cheers.  

  ---

  ### Why This Works  
  1. **Accessible Explanation**: Uses vivid imagery ("God looking at every possible scenario") and avoids jargon. The coffee shop/library/debate line makes counterfactuals tangible.  
  2. **Nods to Both Camps**:  
     - *Reformed relatives*: Explicitly affirms sovereignty ("magnified," not diminished) and rejects puppetry.  
     - *Philosophers*: Distinguishes Molinism from simple foreknowledge ("not because He scripted it") and compatibilism ("not compatibilism in a fancy hat"). The grounding objection gets a cheeky, honest mention without derailing warmth.  
  3. **Centers the Couple**: Uses your sister’s conversion to Molinism as a metaphor for her relationship—organic, thoughtful, and freely chosen.  
  4. **Tension Maintained**: "Your love is *yours*, yet nestled in the architecture of grace" holds divine providence and human freedom in equilibrium.  
  5. **Warmth & Humor**: Eye-rolls, tacos, and late-night debates keep it human. The "ridiculously happy" line undercuts any academic stuffiness.  

  **Delivery Tip**: Pause after the grounding objection line for a knowing chuckle from the philosophy table. End with a genuine smile to the couple—this toast’s success hinges on your affection for them shining through the theology.  

  You’ve got this. And if all else fails? Blame Molina.
