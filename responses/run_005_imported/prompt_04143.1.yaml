        - With do-calculus, we can see that the captain's order causes the death, even though if the captain hadn't ordered, the shooters might not have shot.

     In that example, the counterfactual test: if the captain hadn't ordered, would the death have occurred? -> no, because then the shooters wouldn't have shot.
     -> so the captain's order caused the death.

     Both theories would say that.

