answer: |-
  You've grasped the key theoretical advantages of Kalai-Smorodinsky (KS) over Nash perfectly: it preserves Pareto optimality, Symmetry, Scale Invariance, and Independence of Irrelevant Alternatives (IIA), while adding the crucial **Individual Monotonicity** that Nash lacks. This *should* make KS the obvious choice for the moral parliament model. However, several practical and theoretical challenges explain why Nash remains prominent:

  1.  **The Requirement of Meaningful "Ideal Points" (Utopia Point):**
      *   **KS Relies Heavily on It:** The KS solution is defined relative to the *ideal point* (or utopia point) – the point where each delegate gets their maximum possible utility *within the feasible set*. Calculating this requires knowing the maximum utility achievable *for each delegate individually* across the entire bargaining space.
      *   **Problem in Moral Uncertainty:** Defining the "maximum utility" for a single moral theory in isolation is often **deeply problematic**:
          *   **Incommensurability:** Utilities across different moral theories might be defined on radically different scales or lack a common unit (e.g., hedonic utils vs. deontic constraints vs. aesthetic value). KS requires comparing the *relative distance* each delegate is from their *absolute maximum* within the set, which presupposes that these maxima are meaningful and comparable concepts across theories.
          *   **Feasibility Ambiguity:** What *is* the maximum possible utility for a strict deontologist in a complex world? Or for a negative utilitarian aiming to minimize suffering? These maxima might be ill-defined, infinite, or contextually dependent in ways that Nash avoids.
          *   **Computational Burden:** Identifying the true ideal point for each delegate over a complex, high-dimensional action space can be computationally intractable or ambiguous, especially compared to the relatively simpler optimization problem of Nash.

  2.  **Translation Invariance vs. Scale Invariance:**
      *   **Nash has Scale Invariance:** If you rescale a delegate's utility function linearly (u_i' = a_i * u_i + b_i, a_i > 0), the Nash solution is invariant. Only the *relative ratios* of utility gains matter. This aligns well with the common practice of normalizing utility functions within each theory relative to the disagreement point.
      *   **KS has Scale Invariance BUT NOT Translation Invariance:** KS *is* invariant to *positive affine transformations* of *individual* utilities (like Nash). **However**, it is **NOT** invariant under *translations* (adding a constant to a utility function). Shifting a delegate's entire utility scale up or down (changing their "zero point") will change the ideal point and thus the KS solution. This is significant:
          *   **Disagreement Point Sensitivity:** The meaning of the disagreement point (usually the status quo or worst outcome) is critical. A different choice of disagreement point effectively translates utilities, altering the KS outcome.
          *   **Zero-Point Arbitrariness:** Defining the "zero" of utility for a moral theory (e.g., what constitutes zero pleasure, zero rights violations, zero aesthetic value) is often arbitrary or theory-dependent. KS's sensitivity to this choice is a major drawback Nash avoids.

  3.  **Behavior Under Asymmetric Feasible Sets:**
      *   While Individual Monotonicity is desirable, the specific *way* KS achieves it can be seen as less intuitive or less "proportionally fair" than Nash in some asymmetric scenarios. Nash maximizes the *product* of gains, which has a strong claim as a fair compromise representing proportional concessions. KS equalizes the *relative concessions* from the ideal point. Which notion of fairness is more appropriate for a moral parliament is debatable, and proponents of Nash argue its proportional fairness property is fundamental.

  4.  **Historical Precedence and Simplicity:**
      *   Nash's solution is older, more widely known across disciplines (economics, game theory), and often simpler to compute *if* the ideal point isn't a barrier. Its axiomatic foundation (Pareto, Symmetry, Scale Invariance, IIA) is deeply ingrained. KS requires an additional axiom (Individual Monotonicity) and the more complex concept of the ideal point. This inertia shouldn't be underestimated.

  5.  **The "Expanding Feasible Set" Scenario vs. General Robustness:**
      *   You correctly identify the core weakness of Nash: a delegate *can* lose out if the feasible set expands only in directions favorable to *others*. KS fixes this specific pathology.
      *   However, proponents of Nash might argue that in the *more common* scenarios encountered in moral uncertainty modeling, where the feasible set is fixed or expands symmetrically, Nash's well-understood properties, scale invariance, and lack of reliance on a problematic utopia point make it a more robust and practical choice. They might view the specific pathology KS fixes as less critical than the issues KS introduces with its ideal point requirement and translation sensitivity.

  **In Summary:**

  You're not fundamentally *wrong* about KS's theoretical advantages. Its Individual Monotonicity *is* highly desirable for the moral parliament model. However, the **practical requirement of defining meaningful, comparable "ideal points" (utopia points) for each moral theory**, combined with **KS's sensitivity to the choice of utility zero-point (translation variance)**, creates significant hurdles that Nash avoids due to its reliance only on the disagreement point and scale-invariant ratios.

  **What you might be missing is the depth of the problem of defining intertheoretic "ideal utilities" and the significance of translation variance in this context.** While KS solves a specific flaw in Nash, it introduces other potential problems that many researchers find more concerning or intractable when modeling bargaining between fundamentally different moral frameworks. Nash's robustness to affine transformations (both scaling *and* translation, in practice, as disagreement defines zero) and its avoidance of the utopia point make it a more pragmatically viable choice in many complex moral uncertainty scenarios, despite its lack of Individual Monotonicity. The debate often centers on which set of trade-offs is more acceptable for modeling the moral parliament.
