  Okay, the user is really bothered by this linguistic puzzle about indicative vs. counterfactual conditionals. They've noticed that swapping verb forms changes the meaning dramatically, like in their pizza example. The classic Oswald/JFK example hasn't helped them understand why this happens, so they want a fresh example and a clear explanation.

  First, I need to create a new scenario that illustrates the same split. The hospital scenario comes to mind - where "if Dr. Evans didn't perform the surgery, someone else did" (indicative) feels certain, while "if Dr. Evans hadn't performed it, someone else would have" (counterfactual) feels speculative. This should work because it mirrors their pizza dilemma but in a different context.

  Breaking this down: the indicative version operates within known facts - the surgery happened, so someone must have done it. The counterfactual version imagines an alternate reality where Dr. Evans didn't perform it, and here the certainty disappears because we're dealing with possibilities rather than actualities. 

  What's really interesting is how these constructions trigger different cognitive processes. The indicative conditional stays grounded in evidence, while the counterfactual invites us to mentally simulate alternatives. That explains why the second version feels "shaky" - it's inherently hypothetical.

  The user also asks if this split always occurs. I recall that when the antecedent is known to be false (like "if I were you"), the counterfactual is natural. But if we're uncertain about the antecedent, the lines blur - like "if it rains tomorrow, the game will be canceled" vs. "if it rained tomorrow..." which sounds odd precisely because we don't know about tomorrow's weather yet.

  Underlying all this, the user seems to be probing how language shapes our reasoning. Their frustration with recycled examples suggests they want to grasp the mechanism, not just recognize the pattern. By walking through the hospital case and highlighting the epistemic stance each construction takes, I can help them see why verb forms carry such semantic weight. The key is emphasizing that grammar forces us to take a position on reality's malleability - and that position changes everything.
answer: |-
  You've nailed a fascinating quirk of language and logic! That gut feeling you have is spot-on, and the indicative/counterfactual distinction is absolutely key. The Oswald/JFK example is overused precisely because it's so stark, but let's break new ground. Here's a fresh scenario and a deep dive into the "why":

  **New Example: The Hospital Emergency**

  *   **Situation:** A complex, life-saving surgery *was* performed successfully last night at City Hospital. Dr. Evans, the lead surgeon, was on call.
  *   **Indicative Conditional (Dealing with Known/Assumed Facts):**
      *   **Sentence:** "If Dr. Evans didn't perform the surgery last night, someone else did."
      *   **Your Gut Feeling:** This feels obviously true. The surgery *happened*. *Someone* must have done it. It's a logical deduction based on the known outcome (the surgery occurred).
  *   **Counterfactual Conditional (Imagining an Alternate Past):**
      *   **Sentence:** "If Dr. Evans hadn't performed the surgery last night, someone else would have."
      *   **Your Gut Feeling:** This feels shaky or possibly false. It *implies* that there was a clear, capable, and available backup surgeon just waiting in the wings, ready to step in instantly. Maybe there wasn't! Maybe the patient would have died waiting, or a less qualified resident would have struggled. It feels like an assumption about the hospital's staffing and contingency plans.

  **Why the Dramatic Difference? Under the Hood**

  It's not *just* the grammar ("didn't/did" vs. "hadn't/would have"). The grammar **signals** a fundamental shift in the speaker's **epistemic stance** (how they relate to the truth of the situation) and the **type of world** being described:

  1.  **Indicative ("If X, Y"): Anchored in Reality**
      *   **Presupposes:** The speaker treats the *consequent* (Y - "somebody else did") as being very likely true *based on the context*, or at least treats the *possibility* of the antecedent (X - "roommate didn't eat"/"Evans didn't perform") as a live option within the *actual* world.
      *   **Focus:** Logical consequence *within the actual course of events*. It's about explaining the known outcome (vanished pizza, completed surgery).
      *   **Pizza/Surgery Logic:** "The pizza *is* gone. *Therefore*, if it wasn't my roommate, it logically *must* have been someone else." / "The surgery *was* done. *Therefore*, if Evans didn't do it, someone else logically *must* have." The truth of the consequent (someone ate/did it) is driven by the *observed fact* of the pizza being gone/surgery being done. The conditional is often used to *rule out possibilities* or express *certainty about the consequent if the antecedent holds*.

  2.  **Counterfactual ("If X had happened, Y would have happened"): Building an Alternate Reality**
      *   **Presupposes:** The speaker treats the *antecedent* (X - "roommate hadn't eaten"/"Evans hadn't performed") as **false** in the actual world. We *know* the pizza was eaten; we *know* the surgery happened. We are explicitly imagining a *different past*.
      *   **Focus:** Causality, dependency, and *what was necessary or sufficient* in that imagined alternate scenario. It's not just about what *did* happen, but about the *conditions* and *dependencies* that *would* have led to a specific outcome *in that different world*.
      *   **The "Would Have" Burden:** This phrase demands a *reason* or *mechanism* for Y happening in the alternate world. It implies a causal connection, a plan, a backup system, or a general tendency.
      *   **Pizza/Surgery Counterfactual Logic:** "In the world where my roommate *didn't* eat the pizza (which we know is false, because it *is* gone), what *would* have *caused* someone else to eat it? Was there really another person present, hungry, and likely to take it? Was it inevitable?" / "In the world where Evans *didn't* perform the surgery (which we know is false, because it *was* done), what *would* have *ensured* that someone else did it? Was there a guaranteed backup system? Was another surgeon immediately available and capable? Was the outcome *inevitable* regardless of Evans?" The shakiness comes from questioning whether the mechanism ensuring Y (someone else eating/performing) *actually existed* or was robust enough in the *actual* world to guarantee the outcome in the *counterfactual* world. It's not just about logical possibility; it's about causal necessity/sufficiency in the alternate timeline.

  **Does This Split Always Happen? (The "When" Question)**

  **No, the split is not absolute.** The difference in "feel" depends crucially on the **speaker's knowledge** and the **context's causal structure**. Here's when the shift might be less dramatic or even neutral:

  1.  **When the Consequent is Truly Inevitable/Guaranteed:**
      *   **Example:** "If I hadn't woken up when my alarm went off, my backup alarm would have gone off 5 minutes later." (Because I meticulously set two alarms).
      *   **Indicative Equivalent:** Hard to form naturally because the antecedent is known false ("I *did* wake up"). A forced indicative "If I didn't wake up to the first alarm, my backup alarm did go off" sounds odd because it implies the backup *might* have actually gone off (which it didn't, since I woke up).
      *   **Why similar?** The causal mechanism (the set backup alarm) is robust and known to exist. Both forms point to the backup alarm as the guaranteed next step. The counterfactual feels true because the mechanism is real.

  2.  **When the Speaker is Uncertain About the Antecedent:**
      *   **Example:** (Finding a broken vase, unsure if the cat did it) "If the cat didn't knock it over, the dog would have." / "If the cat didn't knock it over, the dog did."
      *   **Why similar?** In this context of uncertainty, *both* sentences are expressing the speaker's belief about the *only possible culprits*. The indicative focuses on explaining the actual breakage ("one of them *must* have done it"). The counterfactual expresses the speaker's belief about the dog's *inclination* or *opportunity* in the scenario where the cat is innocent. The "would have" feels less like a strong causal claim and more like an expression of likelihood based on the dogs known behavior. The difference is subtler.

  3.  **Generic or Habitual Statements:**
      *   **Example:** "If I didn't eat breakfast, I would get hungry by 10 AM." (Describing a past habitual pattern) vs. "If I don't eat breakfast, I get hungry by 10 AM." (Describing a general truth).
      *   **Why similar?** Both express a consistent causal relationship. The counterfactual ("would get") simply signals we're talking about past instances, not necessarily constructing a specific, known-to-be-false alternate past for one particular event. It's describing a pattern, not a single counterfactual event.

  **Key Takeaway:**

  The dramatic split you feel (like with the pizza or surgery) occurs most strongly when:
  1.  **The consequent is a *deduction* from a known outcome** (pizza gone, surgery done) in the indicative, making it feel certain.
  2.  **The counterfactual requires positing a *specific, reliable causal mechanism* in an alternate past** that might not actually have existed or been guaranteed (the lurking pizza thief, the flawless backup surgeon system), making it feel speculative.

  The grammar isn't just changing the tense; it's forcing your brain into different modes of thinking: **logical deduction within the real world** vs. **causal simulation in an imaginary world**. Your gut is brilliantly detecting that shift in cognitive burden! It's not a quirk of one example; it's a core feature of how conditionals map onto our understanding of reality and possibility.
