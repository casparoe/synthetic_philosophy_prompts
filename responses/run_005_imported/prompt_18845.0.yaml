prompt: |-
  I have come across "hinge propositions" often enough on rationalist blogs and forums—usually invoked as shorthand for background assumptions that no amount of Bayesian updating could touch—that I finally went back and read the relevant sections of Wittgenstein's *On Certainty* myself. Now I am stuck on how two of his central images there are supposed to fit together.

  The first is the hinge metaphor itself:

  "That is to say, the questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn. That is to say, it belongs to the logic of our scientific investigations that certain things are indeed not doubted. ... If I want the door to turn, the hinges must stay put." (§341–343)

  A few dozen remarks earlier, however, he offers an image that seems to pull in the opposite direction:

  "It might be imagined that some propositions, of the form of empirical propositions, were hardened and functioned as channels for such empirical propositions as were not hardened but fluid; and that this relation altered with time, in that fluid propositions hardened, and hard ones became fluid. The mythology may change back into a state of flux, the river-bed of thoughts may shift. But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division of the one from the other." (§96–97)

  What I cannot reconcile is this: a hinge is supposed to be whatever has to "stay put" for doubting and investigating to be possible at all, yet a riverbed, on his own telling, can shift over time, and he is explicit that the shift is gradual rather than sharply set off from the ordinary flow. So is a given proposition's status as a hinge something that holds absolutely, or only relative to a particular stretch of practice that can itself later be carried away like the rest of the bed? And if it is the latter, what survives of the claim that hinges are what make doubt possible, rather than merely whatever happens to be settled at a given time? I would like an actual reading of these two passages together, rather than a restatement of "hinge propositions cannot be doubted."
reasoning: |-
  Okay, the user is grappling with a philosophical dilemma from Wittgenstein's *On Certainty*, specifically the tension between the hinge metaphor and the riverbed imagery. They want a coherent reading that doesn't just restate the surface claims. Let me unpack this step by step.

  First, the hinge metaphor suggests certain propositions must remain fixed for doubt to function—like a door needing stable hinges. But the riverbed analogy describes these "fixed" elements as capable of gradual change over time. The user's core confusion is whether hinges are absolute foundations or contextually stable within a framework. They’re rejecting simplistic answers, so I need to address the dynamism without undermining the necessity of hinges.

  Wittgenstein’s riverbed isn’t opposed to hinges; it’s the *mechanism* for how hinges function historically. Hinges aren’t eternal but *framework-relative*. For example, Newtonian physics once served as hinges but later shifted. The key is distinguishing *logical* necessity (within a framework) from *historical* contingency (across frameworks). The user needs to see that "fixed" means "currently non-negotiable for this language-game," not "immutable forever."

  The riverbed’s gradual shift resolves the tension: hinges stabilize practice *until* collective doubt accumulates enough to reconfigure the bed itself. This isn’t Bayesian updating but a tectonic change in what counts as doubtable. The user’s deeper need might be understanding how rationality accommodates both stability and revolution—how we can have "certainties" without dogmatism. 

  I should emphasize that the riverbed shift isn’t individual but communal and slow, preserving the hinge’s role *during* its tenure. When hinges dissolve, it’s not because they were doubted directly, but because the entire "game" changed—e.g., modernity didn’t doubt Ptolemy; it abandoned his cosmos for a new one. 

  The user might also be wrestling with rationalist overconfidence in Bayesianism. Highlighting Wittgenstein’s anti-foundationalism could reassure them that rejecting absolutes doesn’t collapse into relativism—it just grounds certainty in human practice. 

  Final synthesis: hinges are the riverbed’s temporary solidifications. They "stay put" not metaphysically but pragmatically, until the river carves a new path. The answer must honor both metaphors without dilution.
answer: |-
  You've pinpointed a crucial tension in *On Certainty*, and your instinct that these metaphors need reconciliation is spot on. Wittgenstein isn't contradicting himself; he's grappling with the complex, dynamic nature of foundational certainty. Here's a reading that integrates the hinge and riverbed metaphors:

  1.  **Hinges are Absolutely Necessary *Within* a Framework of Practice:** The hinge metaphor captures the *logical* or *grammatical* necessity of certain propositions *for a specific form of inquiry or language-game to function at a given time*. For doubting, questioning, investigating, or even making empirical claims *about the world*, certain things *must* be held fast. They are the "scaffolding" (§211) or the "axis" (§152) around which everything else turns. To doubt *everything* simultaneously is impossible; it leads to paralysis, not inquiry. The hinge's immobility is relative to the *current* operation of the door (the current practice). "If I want the door to turn *now*, the hinges *must* stay put *now*."

  2.  **Riverbeds Represent the *Historical* and *Dynamic* Nature of Hinges:** The riverbed metaphor addresses the *ontological* or *historical* status of these propositions *over time*. What functions as an immovable hinge *today* might not have been one in the past and might cease to be one in the future. The key insight here is that:
      *   **Hinges Can Change:** Propositions that were once fluid (doubtable, empirical) can become hardened into hinges (e.g., "The Earth is a sphere" moving from controversial claim to fundamental background assumption).
      *   **Hinges Can Become Fluid:** Propositions that were once hinges can later become fluid and subject to doubt/investigation (e.g., "The Earth is the center of the universe," or "Diseases are caused by imbalances of humors").
      *   **The Shift is Gradual:** This change isn't usually a single, sharp event but a slow, collective process of shifting practices, language-games, and forms of life. It's the "shift of the bed itself" (§97).

  3.  **Reconciling the "Absolute" Necessity with Historical Change:**
      *   **Relativity to a "Form of Life":** The necessity of hinges is absolute *relative to a specific "form of life" (Lebensform)* and its associated language-games *at a specific historical moment*. Hinges are the bedrock *for that particular way of being in the world and making sense of it*. They are the "inherited background against which I distinguish between true and false" (§94).
      *   **The Riverbed Shift *is* a Change in Form of Life:** When the riverbed shifts, it signifies a fundamental change in the underlying form of life and its constitutive practices. What was once a hinge *ceases to function as one* within the *new* framework. The *new* form of life will have *its own* set of hinges that must stay put for *its* inquiries and doubts to function.
      *   **Hinges Make Doubt Possible *Within Their Framework*:** The claim that hinges "make doubt possible" holds true. But crucially, *which propositions* play that role is not fixed for all time. For any *given* system of thought and practice (a specific riverbed configuration), *its* hinges are what allow doubt and investigation *within that system*. When the riverbed shifts, a *new* system arises with *new* hinges enabling doubt *within the new paradigm*.
      *   **The Nature of the Shift:** The shift isn't driven by *doubt* directed *at the hinge itself within the old system*. You cannot rationally doubt a hinge *while operating within the framework it supports* – that would undermine the very activity of doubting. Instead, the shift occurs through:
          *   The accumulation of anomalies and tensions *within* the fluid propositions that the current hinges can't resolve satisfactorily.
          *   The emergence of entirely new practices, technologies, or ways of seeing the world.
          *   A slow, often imperceptible, change in what is *taken for granted* in action and language, eventually leading to a collapse or reconfiguration of the old framework and the emergence of a new one with different certainties. This is more like a Kuhnian paradigm shift than Bayesian updating.

  4.  **What Survives of the Hinge Claim?**
      *   **The Functional Necessity:** The core insight survives: meaningful doubt, inquiry, and empirical judgment *always require* a background of unquestioned certainties. There is no such thing as a completely foundationless inquiry. We always stand *somewhere*.
      *   **The Non-Empirical Status (Within the Framework):** Within a given framework, hinges are not treated as empirical hypotheses to be confirmed or falsified by evidence *within that same framework*. Their role is grammatical/logical.
      *   **The Contrast with "Merely Settled":** Hinges are distinguished from "merely settled" propositions precisely by their *role*. A "merely settled" proposition is one we *could* doubt or investigate *within the current framework* without collapsing the whole enterprise (e.g., "This apple is red" – we can doubt it based on lighting, color blindness, etc., using the *existing* hinges like "My eyes usually work," "Objects have colors," etc.). A hinge is a proposition whose doubt *within the current framework* would render *all* such empirical doubts nonsensical or impossible. It's what makes the distinction between "settled" and "doubtful" meaningful *at all*.

  **Synthesis:**

  Think of the riverbed as the *historical trajectory of hinge configurations*. At any specific point along the river (a specific historical/cultural moment), the bed *is* relatively fixed, allowing the water (empirical inquiries, doubts, claims) to flow meaningfully. *At that moment*, the hinges *must* stay put for the water to have direction and purpose. However, over geological time (historical/cultural evolution), the river *can and does* erode its bed and carve a new course. When this happens, the *old* bed (and its old hinges) is abandoned, and a *new* bed (with new hinges) forms. The *necessity* of having *a* fixed bed/hinge structure is constant, but *which specific structure* holds that position changes gradually over the long term. The hinge metaphor captures the synchronic necessity; the riverbed captures the diachronic fluidity.

  Your question gets to the heart of Wittgenstein's anti-foundationalist foundationalism: there is always a foundation, but it's not eternal, universal, or grounded in some external reality; it's contingent, historical, and rooted in human practice. Hinges are absolutely necessary for the game being played *now*, but the game itself can change.
