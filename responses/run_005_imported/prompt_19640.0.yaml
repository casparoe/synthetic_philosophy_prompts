answer: |-
  This taps into deep philosophical territory about the nature of promises, reliance, and what transforms individual plans into collective obligations. Your intuition that a *joint* commitment creates different moral stakes than an individual one is well-founded. Here's a breakdown of the key concepts at play:

  1.  **From Individual Intention to Joint Commitment (Margaret Gilbert):**
      *   When individuals each state "I am in" individually, it might seem like a collection of personal promises. Philosopher Margaret Gilbert argues something more profound happens. By mutually agreeing *together* ("we simply talked it through... and each said we were in"), you create a **joint commitment**. This isn't just five individual promises; it's the creation of a *plural subject* – "we" are doing this.
      *   **Implication:** Within a joint commitment, individuals lose the full unilateral right to abandon the plan. Withdrawal requires the *consent of the group* or constitutes a breach of the shared understanding that bound you together. Your feeling of being "wronged" stems from this unapproved dissolution of the "we."

  2.  **The Principle of Fidelity (T.M. Scanlon):**
      *   Scanlon's principle states that when you lead others to reasonably form expectations about your future behavior based on your assurances, and they rely on those expectations (especially incurring costs), you have an obligation not to disappoint those expectations without a compelling reason.
      *   **Implication:** Your team didn't just hear her *intention*; you heard her *commitment* as part of the group plan. You reasonably relied on this: you structured training runs, coordinated weekends, and pooled money *based on that reliance*. While she covered the financial cost, she cannot compensate for the disruption to the *shared project structure* and the *relational trust*. Her "situation changed, plan changed" reasoning ignores the *interdependence* she created.

  3.  **Relational Ethics & the Value of Shared Endeavors:**
      *   The marathon relay wasn't just a logistical task; it was a *shared social good*. It represented mutual support, collective effort towards a challenging goal, and the intrinsic value of doing something *together*. Her withdrawal, while practically mitigated, damages this intangible good.
      *   **Implication:** What feels "wronged" is the devaluation of the *relational aspect*. Her framing reduces it to a mere scheduling conflict with compensatable costs. For the others, it was also about the meaning derived from participating *as this specific team* with its established dynamic and shared effort. A substitute, while solving the logistical problem, doesn't restore *that* specific shared good.

  4.  **The Difference Between Bilateral and Multilateral Commitments:**
      *   A solo runner only owes fidelity to themselves (and perhaps the race organizers contractually). A joint plan creates a web of *multilateral* obligations. Each person owes fidelity not just to one other, but to *the group and the collective endeavor itself*.
      *   **Implication:** Her argument ("if it were solo...") fails because the solo scenario lacks this multilateral obligation structure. Her exit doesn't just affect an impersonal system; it directly breaches obligations owed to *each* of the other four teammates *as co-participants in the joint plan*.

  5.  **Reasonable Reliance and Sunk Costs (Beyond Money):**
      *   The reliance wasn't just financial. It included:
          *   **Emotional/Time Investment:** Structuring lives, prioritizing training, the mental energy devoted to the *team* effort.
          *   **Opportunity Cost:** You likely structured other plans (weekends, social events) around this *specific* team commitment. Finding a substitute solves the race day problem, but not the months of coordinated effort built around *her* participation.
          *   **Group Cohesion & Trust:** The team dynamic was built with her as an integral part. Her departure fractures that cohesion, regardless of a replacement.

  **Is your teammate right?** While her actions were understandable and she addressed the *financial* reliance admirably, her perspective is **incomplete**. She focuses solely on the *individual* aspect of her commitment ("*my* plan changed") and the *practical* inconvenience.

  **Are the remaining four owed something?** Yes, in a meaningful sense beyond money:
  *   **Acknowledgement:** Acknowledgement that withdrawing unilaterally from a *joint* commitment after others have reasonably relied upon it *does* breach an obligation, even with compensation for direct costs.
  *   **Acknowledgement of the Relational Harm:** Recognition that this wasn't just a logistical hiccup but a disruption to the shared project and the trust underpinning it.
  *   **An Apology for the Breach of the Joint Commitment:** An expression of regret for letting down the *team*, not just for causing practical trouble.

  **What's beneath the disagreement?**

  1.  **Individualism vs. Collectivism:** She emphasizes individual autonomy and adaptability ("*My* situation changed"). The others emphasize the obligations inherent in the collective project ("*We* committed to *this* together").
  2.  **Scope of Obligation:** She defines her obligation narrowly (don't cost others money). The others define it more broadly (uphold the joint plan, honor the shared reliance, maintain the team trust).
  3.  **Valuation of the Shared Good:** She sees the relay primarily as an individual task within a group framework. The others see it as an intrinsically collective endeavor where the *team participation itself* holds value.

  **In essence:** By jointly committing, you created a small social entity with mutual obligations. Her unilateral withdrawal dissolved part of that entity without consent. While she mitigated the tangible losses, the breach of the joint commitment itself and the damage to the relational trust and the intrinsic value of the *shared* effort are the sources of the lingering sense of being wronged. It's not illogical or purely emotional; it reflects a genuine philosophical difference between individual plan revision and the dissolution of a collectively made promise. Her reasoning is impeccable only if one ignores the moral weight of the *jointness* of the original commitment.
