answer: |-
  You've pinpointed the central and most persistent critique of Christensen's depragmatization strategy—the potential circularity in demanding additive consistency for fairness judgments. Let's dissect the smuggling operation and assess the viability of the strategy.

  ### The Core Issue: Where Additivity Sneaks In
  1.  **The Classical Pragmatic Dutch Book:**
      *   Defect: Violates **betting prudence** (accepting a guaranteed loss).
      *   Objection: Prudence isn't epistemic rationality; an agent might rationally decline all bets.

  2.  **Christensen's Depragmatized Move:**
      *   Defect: Violates **consistency of judgment**. The agent judges *each individual bet* as fair based on their credences.
      *   The *consequence* of this inconsistency is that the *sum* of these individually fair bets is a guaranteed loss.
      *   Key Claim: The irrationality lies in simultaneously holding judgments that logically entail a guaranteed loss *could be imposed* via these bets, even if no bets are made. The loss is a *symptom* of inconsistent fairness judgments.

  3.  **Maher's Objection & The Smuggling:**
      *   How do we get from "Each bet B_i is judged fair" to "The sum bet ΣB_i is judged fair (or entails a guaranteed loss)"?
      *   **The Crucial Premise:** Judging a set of bets individually fair *commits* the agent to judging any sum or combination of those bets as also fair. Fairness must be preserved under (finite) aggregation.
      *   **The Smuggling:** This premise *assumes* the **linearity (additivity)** of value (or "fairness value") across bets. Specifically, it assumes:
          *   **Additivity of Fairness:** If Bet A is fair and Bet B is fair, then (A + B) is fair.
          *   **Scale Invariance:** If Bet A is fair, then (k * A) is fair for any real number k (especially negative k, allowing the construction of the Dutch Book).
      *   **Why it Looks Circular:** The coherence requirement probabilism demands (specifically, finite additivity and scaling) is *exactly what is built into this premise about how fairness judgments combine*. Probabilism *is* the requirement that your credence function is linear (additive and scalable). The depragmatized argument seems to *presuppose* the linearity it aims to prove by embedding it in the logic of fairness aggregation.

  ### Can Depragmatization Survive?
  Survival depends on whether the additivity premise can be justified *without* presupposing probabilism. Proponents offer several defenses, with varying degrees of success:

  1.  **Constitutive Norm of Fairness Judgment:** This is the strongest defense. Argue that additivity under aggregation is *constitutive* of what it *means* to judge a bet as fair based on one's credences. It's not an extra premise; it's built into the *concept* of a "fairness judgment" derived from credences.
      *   **Analogy:** Judging "P implies Q" true and "P" true *constitutively commits* you to judging "Q" true (Modus Ponens). You aren't *adding* MP as a premise; MP defines the meaning of implication and truth preservation.
      *   **For Fairness:** If you judge Bet A (on S, paying £1 if S, costing £C(S)) fair *because* your credence C(S) makes its expected value 0, and similarly for Bet B (on T), then judging (A+B) fair *follows directly* from the *same evaluative standard* applied to the combined bet. The combined bet's expected value is C(S) + C(T) - [C(S) + C(T)] = 0, *if* your credences are additive. The inconsistency arises *because* your actual credences *violate* the additivity *required* by the constitutive standard you are applying when making individual fairness judgments.
      *   **Counter:** Is this constitutive standard *itself* justified independently of probabilism? The critic (like Maher) might argue this just pushes the problem back: Why *must* the constitutive standard for fairness judgments require linear aggregation? Couldn't an agent have a non-additive conception of fairness? (This connects to defenses of non-additive measures like Dempster-Shafer).

  2.  **Weakest Link Principle:** If you judge each bet fair individually, but their sum guarantees a loss, then *at least one* of your initial fairness judgments *must* be mistaken. The inconsistency reveals an error *somewhere* in the set of judgments, even if you can't pinpoint which one. The additivity of loss is used diagnostically to reveal inconsistency, not as a premise about how judgments combine.
      *   **Counter:** This seems weaker. It shows *some* judgment is wrong, but it doesn't *force* the conclusion that the *only* possible error is non-additivity of credences. The error could lie elsewhere (e.g., in the agent's understanding of fairness itself, or in a failure to consider combinations).

  3.  **Higher-Order Consistency:** Judging each B_i fair is a first-order commitment. The guaranteed loss shows that these commitments are incompatible *with the agent's own standard for evaluating bets via expected value*. The defect is a failure of the agent's higher-order commitment to the coherence of their own first-order fairness judgments under aggregation.
      *   **Counter:** This still relies on the agent accepting that fairness judgments *should* aggregate additively according to their credences. It assumes the agent is committed to that aggregative principle.

  ### Your Broader Question: Dutch Books vs. Representation Theorems
  *   **Dutch Books (Pragmatic or Depragmatized):**
      *   **Strengths:** Provide a vivid, *diachronic* (if idealized) picture of vulnerability. Depragmatized versions *attempt* a direct link to epistemic inconsistency.
      *   **Weaknesses:** Deeply entangled with pragmatic elements (bets, losses). Depragmatization struggles convincingly to escape the charge of smuggling in additivity. May seem less foundational.
  *   **Representation Theorems:**
      *   **Strengths:** Directly link rationality constraints (e.g., preference axioms: ordering, continuity, independence) to probabilistic representation. Grounded in general decision theory/rational choice. The additivity of probability falls *out* of the axioms (like Independence in Savage, or linearity of the utility function in vNM). Avoids pragmatic baggage more cleanly. Feels more fundamental to many.
      *   **Weaknesses:** The normative force shifts to justifying the preference axioms (e.g., is the Independence Axiom rationally compulsory?). Less directly about *belief* and more about *choice*. Often static/synchronic.

  ### Conclusion & Recommendation
  1.  **The Smuggling:** Maher's objection is powerful. Christensen's depragmatization *does* implicitly rely on a premise about the additive combinability of fairness judgments. This premise functionally assumes the linearity (finite additivity and scaling) that probabilism requires. While defenses exist (especially the constitutive norm argument), they require accepting that the very *meaning* of "fairness based on credences" includes linear aggregation. This is plausible but not uncontestable; it can feel like the probabilistic norm is being built into the semantics.
  2.  **Viability of Depragmatization:** It survives only if the constitutive norm defense is accepted. It remains a popular and influential strategy because many find this defense compelling. However, it hasn't definitively silenced critics who find the circularity charge fatal. It's a live debate.
  3.  **Dutch Books vs. Representation Theorems:** Abandoning Dutch Books entirely isn't necessary, but **relying solely on the classical pragmatic Dutch Book is insufficient for your epistemic focus.** The depragmatized version is worth engaging with critically. However, for a robust defense of probabilism grounded in epistemic rationality, **representation theorems are generally considered stronger and less problematic.** They derive probabilistic coherence from more abstract, arguably more fundamental, norms of preference or comparative belief. They sidestep the messy pragmatics and the additivity smuggling charge entirely. A comprehensive defense of probabilism will likely involve both, recognizing their different strengths and weaknesses.

  **In short:** The smuggled premise is the linear (additive and scalable) combinability of fairness judgments. Depragmatization survives only if this linearity is constitutive of fairness judgments based on credences. While worth understanding, representation theorems offer a cleaner, more widely accepted path to defending probabilism on epistemic grounds. Focus your energy there, using your understanding of the Dutch Book challenges to critically engage with the justification of representation theorem axioms.
