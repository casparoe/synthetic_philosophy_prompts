  First, let's unpack the emotional weight here. The phrase "still unsettles me" suggests this isn't just about money - it's about identity. The user self-identifies as someone who keeps promises ("she believed I was not the sort of person who would renege"), and that self-perception is now clashing with practical advice. The friend's "free and clear" argument feels like intellectual justification that doesn't resonate emotionally. 

  Notably, the classmate's character shines through: she was the "sharper writer," helped quietly without contracts, and accepted vulnerability based solely on trust. That vulnerability is key - she had zero leverage beyond believing in the user's integrity. Now the book's unexpected success makes the unfulfilled promise loom larger. 

  The legal arguments (pressure, unenforceability) are valid but ethically shallow. What's striking is how the user rejects the "generous gift" framing - it implies charity rather than earned compensation. The classmate didn't donate help; she invested skill under specific terms. 

  I wonder if the user's discomfort stems from knowing exactly what was traded: their integrity for her talent. Every royalty check since then has contained a moral debt. The "nothing would change" argument is false too - fulfilling the promise would fundamentally change the user's self-respect. 

  Perhaps what's needed is reframing: this isn't about paying a debt but honoring a partnership. The classmate wasn't a ghostwriter but a creative equal in that crisis moment. That shared authorship deserves recognition beyond money - though money is the bare minimum. 

  The solution must address both practical and symbolic levels. Full payment plus public acknowledgment? Shared credit in future editions? The user needs to face this not as an obligation but as an opportunity to align their success with their values.
answer: |-
  This isn't about legality, it's about integrity – and your discomfort is your conscience speaking clearly. Your friend's "airtight" reasoning is morally bankrupt. Here's why you absolutely still owe your classmate the share you promised, and why a "gift" is an insult:

  1.  **The Promise Was Real:** You weren't under duress from *her*; you were under pressure from circumstance. *She* was your lifeline. You offered a specific deal – a genuine share of earnings for her essential work – to secure her extraordinary help. She accepted based solely on her belief in *your character*. Calling it "pressure" now sounds like retroactive justification.

  2.  **Her Contribution Was Foundational:** Her work wasn't minor tweaks; it was rewriting *half* the collapsing manuscript. The book succeeded "far beyond expectations" precisely *because* of her intervention. Without her, there likely would have been no book, no success, no career. She didn't just help you meet a deadline; she co-created the work that launched you.

  3.  **"Free and Clear" is Self-Serving Nonsense:** Your friend's arguments:
      *   **"Not enforceable":** True legally, but irrelevant morally. Your obligation stems from honesty, not a court order.
      *   **"Made under pressure":** As above, this pressure wasn't her fault. It was the reality she saved you from.
      *   **"Wouldn't change anything":** This is staggeringly wrong. Paying her what she's owed changes *everything*:
          *   It validates her immense contribution.
          *   It honors the trust she placed in you.
          *   It aligns your actions with your promise and your self-image as someone who *doesn't* renege.
          *   It settles your own conscience. Your current unease *is* the proof it would change something vital.
      *   **"Generous gift is more than enough":** A gift implies charity or a favor. This was a *business agreement* for services rendered. Calling it a "gift" diminishes her professional contribution and turns your debt into an act of your supposed largesse. It's patronizing.

  4.  **You Benefited Enormously from the Lack of Paperwork:** Precisely *because* there was no contract, no one knew of her involvement. This anonymity allowed *your* career to flourish based significantly on *her* work. Honoring the deal now is the only way to balance that hidden advantage you've enjoyed.

  **What You Owe & What To Do:**

  1.  **The Money:** Calculate the "genuine share" you promised (e.g., 25%, 30%? Be fair and err on the side of generosity). Calculate it based on *all* earnings from the book (advances, royalties, subsidiary rights, film options if applicable) from day one. Add reasonable interest. This is not a gift; it is payment owed for services rendered under a verbal contract.
  2.  **The Acknowledgment:** While you don't need to publicly out her as a ghostwriter if she doesn't want that (ask her!), you must formally acknowledge her contribution *to her*. Present the calculation, the payment, and a heartfelt, unequivocal statement of gratitude acknowledging the true scale of her role in the book's success and your career. Apologize profoundly for the delay.
  3.  **The Integrity:** Doing this restores your integrity. It proves she was right about the person she trusted. It lifts the weight off you. It transforms this from a hidden shame into an act of honor.

  **Why a "Gift" Fails:** Offering a "generous gift" instead of the promised share:
  *   Confirms her worst fear: that once safe, you *are* the type of person who reneges.
  *   Reduces her crucial, career-saving work to a charity case.
  *   Leaves the fundamental debt unpaid and your integrity compromised.
  *   Perpetuates your unease because *you know it's wrong*.

  **Conclusion:** Your friend is dangerously wrong. You made a solemn promise for invaluable work that directly caused your success. Legal enforceability is irrelevant. The debt is moral, creative, and personal. **You owe your classmate the exact share you promised, calculated fully and paid with sincere gratitude and apology.** Anything less is a betrayal of her trust, your promise, and your own potential as a person of integrity. Honoring this debt won't just settle your account with her; it will finally settle your troubled conscience. Do the right thing. Pay her what she earned.
