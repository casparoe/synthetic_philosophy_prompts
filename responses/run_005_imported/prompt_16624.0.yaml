prompt: |-
  I host a podcast on judgment and decision-making whose audience mostly arrived via Kahneman, the Sequences, and the rest of the usual rationalist-blogosphere canon, so next week I want to complicate that picture: my guest is a cognitive scientist who defends the fast-and-frugal heuristics program as the true heir to Herbert Simon's bounded rationality, against a heuristics-and-biases tradition she thinks quietly redefined "satisficing" as a story about error measured against an idealized rational-actor benchmark. On her view, strategies like take-the-best and the recognition heuristic aren't degraded stand-ins for fuller computation but can outperform it outright -- the "less-is-more" effect -- and most textbook biases reflect the wrong normative standard rather than genuine irrationality. Draft eight to ten interview questions that don't just let her restate the adaptive-toolbox picture: I want one that presses on how far less-is-more results demonstrated in narrow tasks like city-population judgments are entitled to generalize, one on the strategy-selection problem -- how an agent, or a modeler, is supposed to know which heuristic from the toolbox fits a given environment without already doing something like the fuller computation the heuristic exists to avoid -- and one asking her to distinguish take-the-best's cue-by-cue stopping rule from Simon's original aspiration-level satisficing, rather than simply asserting continuity between them. For each of these three, add a follow-up keyed to the answer she's most likely to give, and close with a question about what finding would actually settle the dispute with the heuristics-and-biases camp, as opposed to one that just gets her to restate which normative standard each side prefers.
reasoning: |-
  Okay, the user hosts a podcast focused on judgment and decision-making, with an audience familiar with Kahneman and the rationalist blogosphere. They want to challenge that perspective by interviewing a cognitive scientist who supports the fast-and-frugal heuristics program. The goal is to complicate the traditional view, so the questions need to go beyond just restating the adaptive toolbox idea. 

  First, I need to understand the key points of contention. The guest argues that heuristics like take-the-best and the recognition heuristic aren't inferior but can outperform more complex computations (the less-is-more effect). She criticizes the heuristics-and-biases tradition for using an idealized rational benchmark, claiming that many biases are mislabeled because of the wrong normative standards.

  The user specifically wants three main questions with follow-ups: 

  1. **Generalization of less-is-more effects**: How applicable are findings from narrow tasks (like city population judgments) to real-world decisions? The follow-up should challenge whether these effects hold in complex, ambiguous environments where cues are less clear.

  2. **Strategy selection problem**: How do agents choose the right heuristic without doing the complex computation they're meant to avoid? The follow-up needs to address whether this pushes towards meta-heuristics, which might reintroduce computational demands.

  3. **Distinguishing take-the-best from Simon's satisficing**: Clarify the difference between cue-based stopping rules and aspiration-level satisficing. The follow-up should explore if this difference affects how we model bounded rationality.

  Additionally, the closing question should identify what empirical finding could settle the dispute between the two camps, not just restate normative preferences.

  I should ensure each question presses the guest beyond rehearsed arguments. For the generalization question, the follow-up must highlight environmental dependency. For strategy selection, the follow-up should tackle the computational load of choosing heuristics. The satisficing distinction needs to clarify procedural differences. The closing question must push for falsifiable evidence.

  The user's deeper needs might include wanting to provide listeners with a nuanced debate, highlighting where fast-and-frugal heuristics face genuine challenges. They likely want to avoid a one-sided interview and instead foster critical thinking. Ensuring the questions challenge the guest's stance while remaining respectful is key. Also, the audience's familiarity with rationalist ideas means questions should bridge their existing knowledge and new perspectives introduced by the guest.
answer: |-
  Here are eight interview questions designed to push beyond simple restatements of the adaptive toolbox, incorporating your specific requests for depth and challenge, plus follow-ups and a closing question:

  1.  **Core Challenge (Less-is-More Generalization):** "You compellingly demonstrate the 'less-is-more' effect in controlled tasks like inferring which of two cities is larger using limited cues. Critics argue these are often highly structured, cue-rich environments with clear ecological validities. How confident are we that this effect robustly scales to the complex, ambiguous, multi-attribute, and often time-pressured decisions people face daily – like choosing a medical treatment, a major investment, or navigating social conflict – where cues might be unreliable, conflicting, or simply absent?"
      *   *Likely Answer:* Point to ecological rationality – the fit between heuristic structure and environmental structure – and argue that many real-world domains *do* possess the necessary structure (e.g., non-compensatory cues, skewed validities).
      *   **Follow-Up:** "But doesn't that reliance on identifying specific environmental structures *itself* require a meta-cognitive assessment or learning process? How does the agent *know*, especially in a novel or shifting environment, whether the structure is 'right' for a specific fast-and-frugal heuristic *before* employing it, without effectively engaging in a more complex analysis of the environment that the heuristic is meant to bypass?"

  2.  **Core Challenge (Strategy Selection Problem):** "The adaptive toolbox is a powerful metaphor, but it raises the critical question of *strategy selection*. If an agent has multiple heuristics available – take-the-best, tallying, satisficing with different aspiration levels – how do they, or a modeler aiming to predict behavior, determine *which* heuristic is ecologically rational *for this specific problem instance*? Doesn't selecting the 'right' tool from the toolbox implicitly require evaluating the environment's structure in a way that might demand the very computational effort the heuristics are designed to avoid?"
      *   *Likely Answer:* Argue for ecological rationality guiding selection through evolved or learned principles (e.g., exploit recognition if available & valid; use take-the-best if cues are known to be non-compensatory and validity-ranked). Suggest selection can be based on simple cues *about the environment* or reinforcement learning over time.
      *   **Follow-Up:** "Aren't those 'simple cues about the environment' – like estimating cue validity dispersion or cue intercorrelation – often complex statistical properties themselves? And doesn't reinforcement learning over multiple trials potentially incur significant costs (errors, time) before converging on the right heuristic for a *stable* environment, and struggle immensely in dynamic ones? Doesn't this selection process risk becoming a computationally demanding 'meta-heuristic'?"

  3.  **Core Challenge (Satisficing Distinction):** "You position fast-and-frugal heuristics as the true heirs to Simon's bounded rationality and satisficing. Let's focus on take-the-best's stopping rule: it stops searching cues after finding the first discriminating one. Simon's original satisficing concept involved setting an *aspiration level* for an outcome (e.g., 'a salary above $X', 'a house with at least Y bedrooms') and stopping search when any option meets it. How is take-the-best's *cue-based stopping rule* fundamentally different from Simon's *outcome-based aspiration-level satisficing*, rather than just a specific implementation? Doesn't the former prioritize efficient *discrimination* between options, while the latter prioritizes finding a *satisfactory* option, regardless of relative superiority?"
      *   *Likely Answer:* Emphasize both are satisficing on *search effort* rather than optimization. Argue aspiration levels can be seen as a very simple, one-cue heuristic itself ("Does it meet threshold Y?"). Stress the shared core principle: stopping search when a simple, sufficient reason is found.
      *   **Follow-Up:** "Accepting the shared satisficing-on-search principle, doesn't the *nature* of the 'sufficient reason' matter critically? Take-the-best stops based on a *relative cue comparison* implying one option is *better*. Aspiration-level satisficing stops based on an *absolute outcome value* being met, implying *good enough*, even if potentially worse than alternatives not yet found. Isn't this a fundamental difference in the *goal* of the stopping rule (discrimination vs. adequacy) that reflects different underlying decision problems?"

  4.  **Beyond Simple Restatement:** "Heuristics-and-biases researchers often defend their normative benchmarks (like probability theory or logic) as providing clear, general standards for evaluating judgment, even if descriptively inaccurate. What specific *empirical finding*, observable in real-world decision-making, would genuinely challenge your view and suggest the heuristics-and-biases camp has a stronger claim on describing human *irrationality*, rather than just employing the wrong normative yardstick?"
  5.  **Normative Foundations:** "You argue that textbook 'biases' often reflect a mismatch between the heuristic and the environment, or the application of the wrong normative standard. But how do we *determine* the 'right' normative standard for a given environment without smuggling in an implicit optimization assumption? Is ecological rationality itself a normative standard, and if so, how is it fundamentally different from the optimization it critiques?"
  6.  **Computational Cost Shifting:** "Critics like Lieder & Griffiths suggest that while fast-and-frugal heuristics minimize *execution* cost, the cost is often shifted to *learning* the correct cue orderings or validities, or to the *meta-cognitive* process of selecting the heuristic. How does the adaptive toolbox framework account for and measure these potential hidden costs to establish true frugality?"
  7.  **Defining "Outperform":** "When you say fast-and-frugal heuristics 'outperform' more complex models, it's often in terms of accuracy *given limited information or time*. However, in domains where maximizing accuracy is paramount and resources allow (e.g., some medical, engineering, or policy decisions), isn't the 'less-is-more' effect less relevant, and mightn't the biases tradition still offer valuable insights into errors that *could* be corrected with more effort or better tools?"
  8.  **Closing/Settling the Dispute:** "Let's imagine we could run the definitive study. What *concrete, observable phenomenon* – not just a philosophical preference for one normative standard over another – would you accept as strong evidence that the heuristics-and-biases framework provides a more accurate fundamental description of human judgment *flaws*, rather than your view that apparent flaws are mostly artifacts of misapplied norms? Conversely, what phenomenon would decisively demonstrate the superiority of the adaptive toolbox/ecological rationality view?"

  **Key Rationale:**

  *   **Question 1 & Follow-Up:** Directly tackles the generalization concern, pushing beyond lab demonstrations. The follow-up hits the core tension: knowing the environment's structure might require complex analysis.
  *   **Question 2 & Follow-Up:** Addresses the strategy selection problem head-on. The follow-up challenges the potential computational demands of *selecting* frugality.
  *   **Question 3 & Follow-Up:** Forces a specific comparison between TTBs stopping rule and Simonian satisficing, moving beyond vague claims of continuity. The follow-up highlights the crucial difference in the *goal* of the stopping condition.
  *   **Question 4:** Directly asks for an empirical vulnerability of her view, moving beyond normative debates.
  *   **Question 5:** Probes the normative foundations of ecological rationality itself.
  *   **Question 6:** Addresses a key criticism about potential hidden costs (learning, selection).
  *   **Question 7:** Challenges the scope of "outperformance," acknowledging domains where maximizing accuracy might still favor more complex approaches.
  *   **Question 8 (Closing):** Explicitly asks for *empirical* criteria to settle the core dispute, not just restatements of normative preference. This forces thinking about falsifiable evidence.

  These questions should encourage deep reflection, challenge core assumptions of the adaptive toolbox program in a constructive way, and move the conversation beyond well-rehearsed arguments into the complexities and potential limitations her framework must address.
