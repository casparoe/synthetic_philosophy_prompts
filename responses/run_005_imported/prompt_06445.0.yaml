  Welfare policies are often based on precautionary principles. Even if there's no consensus, the potential for suffering in these animals warrants protection. The user questions if such policies overstep scientific evidence. But policies like those in the UK and EU consider behavioral and physiological data, not just neuroanatomy. The burden of proof might be higher to deny pain in these animals than to assume they don't feel it.

  I should also address the user's possible concern about anthropocentrism. Insisting on a mammalian neocortex could be seen as biased. Evolution can produce different solutions for similar functions. Fish pallium and cephalopod vertical lobe might serve integrative roles analogous to the cortex.

