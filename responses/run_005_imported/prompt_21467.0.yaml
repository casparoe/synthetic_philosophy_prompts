answer: |-
  You've articulated a profound tension in Sidgwick's work, and your defense of his psychical research as methodologically robust—*despite* his profound philosophical motivation—is compelling. Sidgwick’s project wasn't motivated reasoning to be excused; it was a model of disciplined inquiry precisely *because* he confronted his own biases with empirical rigor. Here’s why:

  1.  **The "Dualism" as a Catalyst, Not a Prejudice:** Sidgwick's despair over the "dualism of practical reason" (the irreconcilability of rational self-interest and rational benevolence) wasn't wishful thinking; it was a rigorously derived philosophical *problem*. His turn to psychical research wasn't an evasion, but a hypothesis: *If* personal survival and a moral order could be empirically verified, *then* the dualism *might* be resolved. This framed a specific, testable question: Does empirical evidence support post-mortem consciousness? His philosophical need didn't predetermine the answer; it defined the question worth investigating.

  2.  **Operationalizing Hope with Skepticism:** Sidgwick didn't merely *hope* for survival; he designed methodologies to *test* for it. The SPR, under his leadership, pioneered:
      *   **Blind Protocols:** Testing mediums without revealing sitter identities.
      *   **Documentation & Cross-Verification:** Meticulous recording of sittings, independent witness accounts, and cross-checking of "veridical" information.
      *   **Exclusionary Criteria:** Actively seeking *normal* explanations (fraud, coincidence, sensory leakage, subconscious cueing) *before* invoking the paranormal.
      *   **Quantification:** Attempting statistical analysis of telepathy experiments (though methods were primitive).
      This systematic approach elevated psychical research beyond anecdote towards an empirical science, however fraught.

  3.  **The Creery Sisters Incident: The Crucible of Integrity:** This episode is central to your argument. Sidgwick *wanted* the sisters' telepathy to be real; it offered tantalizing evidence. Barrett, emotionally invested and perhaps seeing a vindication of his own beliefs, protested its exclusion. Sidgwick, however, demonstrated core scientific virtues:
      *   **Falsifiability in Action:** The discovery of the signaling code was a potential falsifier. Sidgwick treated it as such, despite the cost to a promising line of evidence.
      *   **Priority of Process over Result:** He prioritized methodological purity and the integrity of the evidential record over a personally and philosophically desirable outcome.
      *   **Willingness to Invalidate:** He didn't downplay, excuse, or rationalize the fraud. He publicly discarded the evidence, setting a standard for the SPR. This act wasn't a lapse in motivation; it was the *triumph* of methodological discipline *over* motivation.

  4.  **Transparency About Motivation:** Sidgwick was remarkably open about his philosophical stakes ("a ray of hope"). This transparency is a strength, not a weakness. It:
      *   **Acknowledges Bias:** Forces critical scrutiny of methods and conclusions.
      *   **Clarifies Stakes:** Explains why the question mattered intensely, justifying the decades of effort.
      *   **Highlights the Stakes of Negative Results:** If rigorous investigation *failed* to find evidence, the dualism remained, and the "ray of hope" dimmed. He accepted this possibility.

  5.  **Long-Term Commitment as a Test of Rigor:** Decades of largely negative or ambiguous results would break a true believer engaged in motivated reasoning. Sidgwick persisted *not* because he ignored negative results, but because:
      *   He recognized the profound implications of a *positive* result.
      *   He believed the question was intrinsically important.
      *   He saw methodological progress being made, even if breakthroughs were elusive.
      *   His commitment was to the *process* of inquiry, not a predetermined conclusion. His ultimate pessimism late in life testifies to his responsiveness to the cumulative evidence, not dogmatic belief.

  **Conclusion: Rationality Forged in Tension**

  Sidgwick's psychical research was rational and methodologically respectable precisely *because* of the tension you identify. His profound philosophical motivation provided the impetus and defined the high-stakes question. His unwavering commitment to empirical rigor—epitomized by the Creery exclusion—acted as the necessary counterweight, ensuring that the search for evidence wasn't corrupted by desire.

  He embodied the ideal of the scientist-philosopher: driven by deep existential and ethical questions, yet bound by the discipline of evidence, falsification, and methodological honesty. He hoped *for* a result, but he structured his inquiry to rigorously test *against* it. The fact that he persisted despite mounting discouragement speaks to the depth of the philosophical problem, not a failure of reason. Sidgwick's psychical research wasn't an embarrassment to be overlooked; it was a demanding, decades-long experiment in holding profound hope accountable to the severest standards of empirical proof—an experiment that ultimately demonstrated the *strength* of his commitment to reason, even when it threatened his deepest hopes. His admirers shouldn't overlook it; they should champion it as a model of intellectual integrity wrestling with the hardest questions.
