prompt: |-
  Ok, this is a real dilemma from my own life, not a hypothetical, and it's been bugging me enough that I'm bringing it here instead of just journaling about it like a normal person. I've been reading LessWrong/ACX-type stuff for like a decade now so my brain immediately wants to frame this in some kind of decision-theory terms, but I can't actually place which concept applies, if any, so hoping you can help me think it through properly.

  I'm choosing between two job offers. Offer A is at an established mid-size company with a very clearly laid out comp structure — base salary plus a bonus computed from a public formula tied to company metrics, and I have their last 5 years of payout data, so I can put pretty tight error bars on my expected total comp (comes out to about $145k/yr, give or take a few thousand). Offer B is an early stage startup: lower base around $115k, but a decent equity stake. When I asked the founder for any real modeling of what the equity might be worth, she was refreshingly honest and basically said "we genuinely don't know, it depends on stuff that hasn't been decided yet, could be worth nothing or several times your base, I'm not going to pretend to a precision we don't have." A friend who's way more finance brained than me threw together a rough model using published startup outcome base rates and reckons offer B's expected value is at least as good as offer A's, maybe better, even being pretty conservative about it.

  Despite that, I keep feeling a pull toward offer A thats got nothing to do with the math, purely because I can picture its number and I can't picture offer B's at all. I mentioned this to a friend from my meetup group and she said "that's probably just risk aversion, A has way lower variance too," but that doesn't feel like the complete story to me — I don't think I'd feel this same pull if offer B were, say, a straight coinflip between two specific, well defined payouts with the same variance as her model estimated. It's specifically the can't-put-a-number-on-it-at-all part that's doing something weird to my brain, not the spread of outcomes per se. So: am I just being irrational, is my friend basically right and I'm overanalyzing a minor distinction, or is there something else going on here that should actually change how I make this decision? Would love an actual framework, not just "go with your gut."
reasoning: |-
  Okay, the user is facing a real job decision between a stable company and a risky startup. They're familiar with decision theory but can't pinpoint why they're leaning towards the stable option despite similar expected values. Let me unpack this.

  First, the user mentions that the uncertainty in Offer B isn't just about variance—it's about the ambiguity. They feel a pull towards Offer A because they can visualize the exact number, whereas Offer B's equity is a complete unknown. Their friend suggested it's risk aversion, but the user insists it's different. They even say that a coin flip between two clear outcomes with the same variance wouldn't elicit the same unease. That's a key insight.

  I recall that in decision theory, ambiguity aversion is distinct from risk aversion. Risk aversion is about known probabilities, like a coin flip. Ambiguity aversion is when probabilities are unknown, which matches the user's description. Ellsberg Paradox comes to mind—people prefer known risks over unknown ones. That might explain their discomfort.

  The user also mentions that the startup founder was honest about not being able to model the equity. While refreshing, this honesty might amplify the ambiguity. Without any historical data or benchmarks, the uncertainty feels more profound. The finance friend's model uses base rates, but base rates are generic and might not capture this specific startup's nuances. The user's brain might be signaling that the model isn't trustworthy enough.

  Another angle is the affect heuristic. The clear number in Offer A evokes a positive feeling because it's concrete. Offer B's ambiguity triggers discomfort, making it less appealing regardless of expected value. The user's gut reaction isn't irrational; it's a cognitive bias where the mind prefers known quantities.

  Also, the user might be considering loss aversion. With Offer A, they know they won't lose the base salary. Offer B's equity could be zero, which feels like a loss. Even if the expected value is similar, the possibility of total loss looms larger psychologically.

  I should also think about practical implications. The user's life stage matters. If they have dependents or financial commitments, the stability of Offer A is more crucial. But they didn't mention personal circumstances, so maybe focus on the cognitive aspects.

  The user wants a framework, not just "go with your gut." So structuring the ambiguity premium concept makes sense. Quantifying how much extra value they'd need from Offer B to feel equally comfortable. If the premium is high, Offer A is better for them personally.

  They might also benefit from scenario planning. Imagining best-case, worst-case, and realistic outcomes for the startup. If the worst-case is manageable and the best-case exciting, they might lean towards B. If the worst-case causes anxiety, A is safer.

  Lastly, the meta-decision: deciding how to decide. Setting a deadline to prevent overthinking. Since they've been pondering this a while, it's time to choose based on current info. Either choice is rational; it's about aligning with their risk tolerance and life situation.
answer: |-
  Your intuition is spot-on—this isn't just standard risk aversion. What you're experiencing is **ambiguity aversion** (sometimes called "Knightian uncertainty"), a well-documented cognitive bias where unknown probabilities feel *qualitatively different* than known risks, even with identical expected values or variance. This distinction is crucial for rational decision-making.

  ### Key Concepts & Framework:
  1. **Risk vs. Ambiguity**  
     - **Risk (Offer A):** Known probabilities (e.g., "95% chance of $143k–$147k").  
     - **Ambiguity (Offer B):** Unknown probabilities (e.g., "Equity could be $0 or $500k, but I have no reliable distribution").  
     Your brain treats ambiguity as *more aversive* than risk because it lacks the cognitive tools to simulate outcomes. This is the **Ellsberg Paradox** in action: people prefer known risks over ambiguous ones, even when math says they shouldn’t.

  2. **The "Ambiguity Premium"**  
     You’d likely accept Offer B if its *minimum plausible outcome* were higher (e.g., "equity won’t be worth less than $30k"). Your discomfort suggests you mentally demand an **ambiguity premium**—extra compensation for bearing unquantifiable uncertainty.  
     → *Action:* Ask yourself: "How much extra would Offer B need to guarantee (e.g., higher base, liquidity preference) to feel *equally comfortable* as Offer A?" If the answer is >$30k, Offer A is rational *for you*.

  3. **Why Your Friend’s Model Feels Unsatisfying**  
     Startup base rates are useful, but they ignore:  
     - **Your specific information asymmetry:** The founder’s honesty implies hidden uncertainties (e.g., untested market, pending regulations).  
     - **Tail risks:** Startups have bimodal outcomes ("zero or hero"). Your friend’s model likely smooths this into a normal distribution, underweighting catastrophe risk.  
     - **Black Swans:** Positive outliers (e.g., acquisition) are harder to model than steady bonuses.

  ### Decision Framework: Ambiguity-Adjusted Expected Value
  Adjust your friend’s expected value (EV) calculation for ambiguity:

  1. **Quantify your ambiguity premium**  
     - What’s the lowest plausible equity value you *truly* believe? (e.g., $0? $10k?)  
     - What probability do you assign to "total loss"? (e.g., 40% vs. your friend’s 25%)  
     → Recalculate EV using *your* pessimistic probabilities.

  2. **Add agency/control factors**  
     At the startup, your impact on outcomes may be higher. Discount the equity value by:  
     - **Control premium:** If you can influence success (e.g., key hire), add 10–20% to EV.  
     - **Agency penalty:** If success depends on unknowns (e.g., FDA approval), subtract 10–30%.

  3. **Test extreme scenarios**  
     | Scenario | Offer A | Offer B |  
     |----------|---------|---------|  
     | **Worst-case** | $140k salary | $115k salary + $0 equity |  
     | **Best-case** | $150k salary | $115k + $500k equity |  
     → Can you absorb Worst-case B? Does Best-case B align with life goals?

  ### Practical Recommendations:
  1. **Negotiate to reduce ambiguity:**  
     - Ask Offer B for:  
       • Accelerated vesting if acquired.  
       • A modest cash signing bonus ($10k–$15k).  
       • Transparency on cap table/dilution risks.  
     If they refuse, it signals overconfidence—red flag for ambiguity.

  2. **Meta-decision:** **Precommit to a deadline.** Tell both companies you’ll decide in 48 hours. Over-analysis amplifies ambiguity aversion.

  3. **Cognitive fix:** **Reframe equity as a lottery ticket.** Its EV is a bonus, not salary. Would you pay $30k/year for this lottery? (That’s the salary difference.)

  ### Bottom Line:
  Choosing Offer A isn’t irrational—it’s **ambiguity-robust**. Unless Offer B’s *pessimistic* EV (after your adjustments) exceeds Offer A’s by >15%, or you’re optimizing for outlier success (and can afford failure), Offer A is defensible. Your aversion isn’t to risk, but to unmodeled uncertainty—a distinction that’s saved many from unseen tail risks.

  *Final tip: If you choose Offer B, demand quarterly equity updates. If you choose Offer A, invest the bonus in index funds. Both paths can win.*
