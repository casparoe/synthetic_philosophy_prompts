  I keep a few chickens and a couple pigs out back and treat them well, definitely better than they'd get on a factory farm. Only thing is, I do eventually eat them, that's the whole reason I started raising them in the first place. I keep telling myself that's fine because if I wasn't gonna eat them eventually, they never would've existed at all, so giving them a decent life and then eating them still leaves them better off than never existing. It's not even like I need the meat, I just like the taste. Feels like there's a catch in that reasoning somewhere but I cant put my finger on it - am I actually right that its fine, or am I just justifying what I already wanted to do?
