  Hmm, the user mentions flip-flopping, which tells me they want nuance. The solution can't be binary approval/rejection. Real ethics committees love conditional approvals with safeguards. I'm considering structuring it as "approved with risk-mitigation conditions" - that threads the needle.

  Key points to address:
