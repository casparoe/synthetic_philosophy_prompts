answer: |-
  ## Poster Session Debate: Are Dictionary Features "Real" Concepts?

  **Setting:** *Crowded conference hall poster session. Coffee cups litter a nearby table. SAM (neural realist) stands by a poster titled "Ontology of Learned Features." ALEX (feature instrumentalist) approaches, scanning the diagrams.*

  **Alex:** (Pointing at a neuron activation plot) Sam, your poster implies these dictionary features *are* the model's concepts. But isn't that reifying what's fundamentally just a *description* of the activation space? Like finding constellations in stars – the lines aren't *in* the sky.

  **Sam:** Alex! Good to see you. I get the skepticism, but the *causal power* changes the game. We don't just *see* the Golden Gate Bridge direction; we *use* it. Ablate that direction – the model loses specific knowledge *only* about the bridge. Boost it – bridge mania infects everything. That’s not just pattern-finding; that’s interacting with a *functional component* carrying semantic content. It behaves like a concept *token*.

  **Alex:** Okay, steering is impressive. But let's dissect that. You find Direction D_GG. Boosting it injects "Golden Gate Bridge"-ness. But is D_GG *the* bridge concept? Or is it *one* vector in a high-D space that *induces* bridge-related behavior? Consider the seed dependence: Train the *same model architecture* on the *same data*, run dictionary learning with different initializations or sparsity penalties (λ in the L0 regularization), and you get a *different* set of features. Feature #347 might be "Golden Gate Bridge" in run A, but in run B, it's a messy superposition of "suspension bridges" and "San Francisco tourism," and "Golden Gate Bridge" is split across features #122 and #581. If the concept is *really* in there, why isn't its decomposition stable?

  **Sam:** (Leans in, tapping the poster) Strong point. The instability under different *extraction methods* is a challenge. But it doesn't kill realism; it refines it. Think superposition. A single neuron – or more likely, a polysemantic *direction* in the residual stream – might represent multiple concepts simultaneously because the network is efficient. Dictionary learning (like sparse autoencoders) is *trying* to *factor* this superposition. Different seeds or λ values prioritize different factorizations – maybe a monolithic "Golden Gate Bridge" feature vs. compositional "Red Bridge" + "SF Landmark" features. The *information* is there; the *decomposition granularity* is method-dependent. Crucially, *whichever* valid decomposition you find for "Golden Gate Bridge" *will* causally steer the output when manipulated. That functional consistency across decompositions suggests the underlying *semantic content* is real.

  **Alex:** But Sam, that sounds suspiciously like instrumentalism dressed up! You're saying the *content* is real, but the *features as discrete units* are extraction artifacts. Isn't that conceding my point? The "joints" aren't pre-cut by the model; *we* choose how to carve via our SAE hyperparameters (dictionary size, k, λ). The frog's fly-detector neuron fires *reliably* for flies; it doesn't radically reconfigure its "fly concept" representation based on how we probe it. If the model's representation is this fluid under factorization, can we truly say it *has* discrete concepts like we do?

  **Sam:** Not fluid – *composed*. And the frog analogy is imperfect. Our brains *also* use distributed, compositional representations! Your "mom's face" isn't one neuron; it's a complex activation pattern across many, potentially overlapping with other faces. Dictionary learning *reveals* that composition. The key is: **1)** Manipulating *any* valid decomposition direction for concept X produces coherent, concept-specific behavioral changes (unlike random directions, which cause noise or collapse). **2)** These directions are *sparse* and often *interpretable* – they activate on coherent data subsets. **3)** They form *hierarchies* (lower-level "red," "steel" feeding into "Golden Gate Bridge"). That structural and functional coherence screams "real representation," even if its *exact decomposition* isn't uniquely fixed. It's not a cloud; it's a lump of marble. Different sculptors (SAE settings) might reveal David or Hercules, but the form was latent *in the stone*.

  **Alex:** I'll grant you the marble has structure! But Hercules and David are *different interpretations* imposed *on* the stone. Similarly, the SAE imposes a *particular sparse, linear basis* onto a highly non-linear manifold. The fact that boosting *any* direction correlating with "bridge" induces bridge-y outputs might just mean the model's output distribution is *smooth* in semantic space near that manifold. You're finding directions *orthogonal to the loss gradient*, not necessarily the model's intrinsic "concept axes." The retraining instability shows the axes aren't intrinsic! It's a useful *control interface* we've discovered, not a privileged ontology.

  **Sam:** Ah, but the *precision* matters! We don't just get "bridge-y." We get *specific factual errors* corrected by editing a single feature. Inject the "Golden Gate Bridge" feature during a history question, and it might erroneously mention its color in 1850. That's not smoothness; that's accessing a *specific, localized bundle of attributes*. It's replicating how *biological* concept neurons work – albeit artificial and distributed. The different SAE bases? They're like finding different coordinate systems for the same underlying manifold. The *points* (specific concept instances) are real; the *axes* are a human-readable projection. The causal power comes from moving *to specific points* (concept states) via those axes.

  **Alex:** (Sighs, but smiles) Okay, I'll buy that the *information* corresponding to our concept "Golden Gate Bridge" is robustly encoded in the network's weights. And that sparse linear interventions on activations are a powerful tool to *interface* with that information causally. But calling the specific SAE feature *the* model's concept? That still feels like mistaking the map for the territory. The territory is the high-dimensional, non-linear activation state; the SAE feature is *one useful map* we can draw. The instability shows there are *many* valid maps. The frog has *one* fly-map, hardwired.

  **Sam:** Fair enough. Maybe "the concept" is the *invariant information* itself, residing in the weight configuration, and the SAE features are *discovered access points* to it – like finding different levers to trigger the same underlying mechanism. But finding those levers, seeing they work consistently *across contexts*, and that they align with human-understandable semantics? That tells me we're not just drawing bunnies on clouds. We're reverse-engineering functional components of a cognitive system. It might not be a *frog's* neuron, but it's something *real* in there, doing representational work. Pass me that coffee?

  **Alex:** (Passes a cup) Deal. Real information, real causal levers... but the *units* are context-dependent artifacts of our probe. Let's grab lunch and argue about whether superposition counts as "understanding." *(They head towards the exit, still gesturing animatedly.)*

  **Key Points Engaged:**
  *   **Realist (Sam):** Grounds "reality" in causal power (steering/ablation), functional consistency across SAE runs (same info, different granularity), compositionality, and alignment with human semantics.
  *   **Instrumentalist (Alex):** Counters with SAE seed/hyperparameter instability (undermining uniqueness), argues steering exploits smooth output distributions rather than revealing intrinsic axes, and emphasizes the SAE imposes structure (sparse linear basis) onto a non-linear manifold.
  *   **Resolution:** Convergence on "real information/function" but disagreement on whether the *SAE feature unit itself* is a discovered fundamental component or a useful but non-unique probe artifact.
