prompt: |-
  My colleague Diane is retiring after thirty-one years and I got roped into giving the toast at her dinner next month. Her whole career has basically been one long defense of Williams-style internalism about reasons -- she's the person half our field cites for the canonical reply to the McDowell line that there must be external reasons out there regardless of what anyone actually cares about. She's also genuinely famous in the department for interupting other people's toasts to point out when an "ought" isn't hooked to anything in the speaker's actual motivational set -- she heckled a colleague's retirement speech for exactly this two years ago. Which is a problem for me, because toasts run on exactly that move: "be more like her," "let her be an example to us all" -- a bare, desire-independent ought, which is precisely what she's spent thirty years arguing is either false or really something else in disguise. Half the room will be former grad students who'll clock this instantly; the other half will be her sister and a couple of college roommates who've never heard the phrase "sound deliberative route" in their lives. Can you write me the actual toast -- five minutes, genuinely moving, and it has to solve the problem rather than dodge it, so that whatever it ends up exhorting people to do is tied to something already sitting in their own S, not just handed down from nowhere.
reasoning: |-
  Okay, the user is preparing a retirement toast for their colleague Diane, who is a prominent advocate of Williams-style internalism about reasons. This philosophy argues that reasons for action must be tied to an individual's existing motivations ("motivational set" or "S"). The challenge is that traditional toasts often use external "oughts" (e.g., "we should be more like her"), which Diane would critique as meaningless since they aren't grounded in listeners' actual desires.  

  The user needs a toast that:  
  1. Avoids bare "oughts" disconnected from the audience's motivational sets.  
  2. Respects Diane's intellectual legacy while being accessible to non-philosophers.  
  3. Handles the meta-problem—Diane herself might interrupt if the toast violates internalism.  

  First, I should structure the toast to mirror Williams' internalism. Instead of prescribing actions, it should help listeners discover existing motivations Diane's example connects to. The toast must:  
  - Start by celebrating Diane's impact without commanding imitation.  
  - Frame her qualities as activating the audience's latent values (e.g., curiosity, integrity).  
  - Explicitly reject external "oughts" to preempt heckling—making the meta-awareness a strength.  

  Key angles:  
  - **Intellectual legacy:** Highlight how Diane defended internalism against McDowell, but translate this into human terms (e.g., "reasons must resonate personally").  
  - **Personal warmth:** Include humanizing details (her heckling habit, passion) to balance rigor with affection.  
  - **Dual audience:** Philosophers will recognize internalist structure; non-philosophers will hear a tribute about shared values.  

  Risks to avoid:  
  - **Hypocrisy:** Using an unmotivated "ought" would invite Diane’s critique.  
  - **Obfuscation:** The solution can’t just dodge exhortations; it must repurpose them as discoveries.  
  - **Accessibility:** Jargon like "motivational set" must be replaced with plain language ("what matters to us").  

  The toast structure could flow like this:  
  1. **Hook with humor:** Reference Diane’s history of interrupting toasts to disarm tension.  
  2. **Reframe her philosophy:** Present internalism as "reasons must speak to you," not abstract rules.  
  3. **Connect to audience motivations:** Show how Diane’s traits (e.g., curiosity) align with common human desires.  
  4. **Replace "ought" with invitation:** Suggest engaging with her legacy as a choice stemming from existing values.  

  Finally, the emotional core—gratitude—is universally internalist: thanking Diane naturally ties to the audience’s existing appreciation. No external "ought" required.
answer: |-
  Here’s a toast that honors Diane’s legacy *on her own terms*, avoids any free-floating "oughts," and anchors every call to action in the audience’s existing motivations. It’s structured to preempt heckling by making the internalist move explicit, while remaining warm and accessible. The key is framing Diane’s impact as *activating* what’s already in our S—not demanding something alien to it.  

  **(Clink glass. Pause. Smile.)**  

  "Friends, colleagues, Diane’s beloved family—I promise this won’t be a eulogy. Diane would hate that. In fact, if history’s any guide, she might still interrupt me. *(Gentle laughter.)* Because Diane never let us get away with loose talk about what we ‘should’ do. For 31 years, she’s shown us that reasons aren’t ghosts floating in the ether—they’re alive in us, tangled in what we already care about.  

  So tonight, I won’t stand here and say we *ought* to be more like her. That’d be cheating. And worse—Diane would see right through it. *(Nod to her, playful.)* Instead, I want to talk about what Diane *does*: how she wakes up parts of us that were already there. Quiet desires. Dormant commitments. The things in our ‘S’—our motivational sets—that she nudges to life.  

  Think about her signature move: that sharp, incisive question in a seminar. The one that exposed a gap between what someone *claimed* we must do and what actually *moved* them. It wasn’t just critique—it was an invitation. To ask: *What’s your stake in this? What’s already burning in you?* That’s Diane’s gift: she doesn’t implant new reasons; she helps us excavate our own.  

  So when we admire her fierce clarity—that brilliant mind dissecting arguments—it resonates because *we already value truth*. Not in the abstract, but because confusion frustrates us. Because we want to understand. When we celebrate her integrity—her refusal to fake it—it lands because *we already crave authenticity*. We’re tired of posturing. We want to be real.  

  And her legendary interruptions? *(Smile.)* Yes, even those. They matter because *we already hate it when words ring hollow*. When a toast, or a theory, floats untethered from human feeling. Diane didn’t heckle to embarrass—she heckled because she trusted us to want better. To want substance.  

  To her grad students here tonight: you know this intimately. She didn’t force you to care about internalism. She showed you how it *mattered*—how it connected to your hunger for philosophy that speaks to human lives. Not dusty dogma, but reasons that breathe.  

  To Diane’s family: you’ve lived this. You’ve seen her at the kitchen table, debating her nieces with the same intensity she brought to seminars. Why? Because she knew *they* cared—about fairness, about loyalty. She met them where their hearts already lived.  

  So here’s where this leaves us. If you find yourself inspired tonight—if something in Diane’s journey stirs you—it’s not because I commanded you to feel it. It’s because she’s spent 31 years putting a mirror to our deepest motivations:  

  - That itch to *get it right* when we’re wrong?  
  - That hunger to speak with *honesty*, even when it’s hard?  
  - That urge to *engage*—really engage—with people, not just ideas?  

  That’s not Diane implanting an ‘ought.’ That’s her revealing what’s *already in us*. So if you want to honor her legacy, don’t try to ‘be like Diane.’ That’s not the point. Instead, do what she taught us: **Look into your own S**. Find what’s glowing there—your curiosity, your stubbornness, your love for tough questions—and *follow that*. Not because I said so. But because *you* care.  

  Diane, you’ve armed us with the ultimate tool: the insistence that reasons must *mean* something—to *us*. That philosophy isn’t a sermon. It’s a conversation. A shared, messy, glorious struggle to live by what matters.  

  So raise your glass to Diane: the relentless champion of reasons that *stick*. May we all keep listening—to her, and to ourselves. Cheers!"  

  ### Why This Works  
  1. **Preempts Heckling**: Directly addresses the "bare ought" problem by reframing admiration as *activation* of existing motives ("we already value truth," "we already crave authenticity").  
  2. **Internalist Structure**: Every call to action ("look into your own S") ties to pre-existing elements in the audience’s motivational sets (e.g., frustration with confusion, desire for honesty).  
  3. **Dual Audience**:  
     - *Philosophers*: Nods to "motivational sets" and Williams’ framework without jargon. The "excavate our own reasons" line is pure internalism.  
     - *Non-Philosophers*: Uses universal human motivations (e.g., "hate when words ring hollow," "want to be real").  
  4. **Emotional Punch**: Anchors her intellectual rigor in human warmth (family moments, grad students) and positions her as a catalyst—not a statue.  
  5. **Meta Solution**: The toast *exemplifies* internalism. It doesn’t dodge the problem; it turns Diane’s life into proof of her philosophy.  

  **Delivery Tip**: Pause before "Look into your own S." Let the room lean in. Diane’s heckling reflex will likely short-circuit—because you’ve built the toast *inside* her logic.
