  Looking deeper, the user could be grappling with the authenticity of their emotions. They might worry if their feelings are valid or if they're over-invested. There's an unspoken need for confirmation that their immersion enhances their writing, not hinders it. They might also seek strategies to harness this emotional response constructively.

