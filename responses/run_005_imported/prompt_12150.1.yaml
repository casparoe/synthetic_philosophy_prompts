prompt: |-
  Ok, random craft question for the novel I'm working on. I've got a subplot where a sketchy benefactor tells my protagonist he'll clear her debt tonight if she can prove she truly intends, right now, to do some specific painful thing tomorrow -- and the catch is that once the debt's cleared there'll be absolutely no reason left for her to actually go through with it. Its basically Kavka's toxin puzzle, but I don't want to just reskin the vial and the eccentric billionaire, that's way too recognizable to anyone who's taken a philosophy class. Can you invent a completely different, grounded-in-real-life scenario that keeps the exact same bones -- payoff for the sincere intention alone, zero reason to perform the act once the reward's secured, and no way for either party to peek inside her head to check -- and then tell me honestly where the analogy starts to creak?
