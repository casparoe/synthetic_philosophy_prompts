prompt: |-
  I cover science and ideas for a general-interest magazine, and next month I'm interviewing a philosopher of psychiatry whose recent work extends Ian Hacking's account of looping effects to autism. She argues that the DSM-5's 2013 folding of Asperger's, PDD-NOS, and autistic disorder into a single 'autism spectrum disorder' is a textbook case of what Hacking called an interactive kind reshaping itself through the very people it sorts, as against an indifferent kind that couldn't care less how it's classified. Draft seven or eight interview questions that push past a restatement of the framework. Include at least one question that pins down what a looping effect adds to the self-fulfilling-label idea that sociologists like Merton and Becker described decades earlier; one asking whether the neurodiversity movement's own feedback into diagnostic criteria commits her to denying that autism has any stable reality apart from that feedback; and one asking what observation would convince her that a given psychiatric category is not interactive, so the claim has some empirical bite. For each, add a short follow-up keyed to the deflection she's most likely to reach for, and close with a question on whether coverage of 'rising autism rates' makes journalism itself part of the loop she studies.
reasoning: |-
  Okay, the user is a science journalist for a general-interest magazine preparing to interview a philosopher of psychiatry. They need interview questions that dig deeper into the application of Hacking's looping effects to autism, specifically regarding the DSM-5 consolidation of autism diagnoses. 

  First, I need to unpack the core request: they want questions that go beyond restating Hacking's framework, with three mandatory components - distinguishing looping effects from Merton/Becker's self-fulfilling labels, addressing neurodiversity's impact on autism's ontological status, and specifying falsifiable conditions for non-interactive categories. Plus a closing question about media's role. 

  The user's phrasing suggests they're deeply familiar with the concepts but need help formulating incisive questions that would compel the philosopher to move past theoretical boilerplates. The emphasis on "empirical bite" and anticipating deflections indicates they want to avoid a fluffy conceptual discussion. 

  For the Merton/Becker comparison question, I recall Hacking's key differentiator is the bidirectional feedback loop between classification and classified - not just labels creating outcomes, but outcomes reshaping labels. The follow-up should preempt the obvious "it's about institutional power" deflection by asking how the looping effect redistributes that power. 

  The neurodiversity question needs to walk a tightrope: if the movement influences diagnostic criteria, does that negate autism's biological reality? The deflection will likely be "it's both social and biological," so the follow-up must demand specifics about what remains unchanged. 

  The falsifiability question is trickiest - what observable evidence could disprove interactivity? Hacking himself thought interactive kinds were the rule in human sciences, so I'll propose institutional resistance to change as a test case. 

  Finally, the media question writes itself: journalists constantly report "autism epidemics" without examining how their framing affects diagnostic patterns. That's pure looping effect material. 

  The questions should maintain academic rigor while staying accessible for a general audience. Each follow-up needs to block escape routes without being combative. Time to structure this as eight questions with tactical follow-ups.
answer: |-
  Here are eight interview questions designed to push past framework restatement, incorporating your specific requests and anticipating deflections:

  1.  **Core Mechanism:** You argue the DSM-5 consolidation created a powerful "autism spectrum" kind. Beyond individuals simply adapting to the label, *how specifically* does the *diagnostic criteria itself*, and the clinical/research practices built around it, become reshaped *because* of the diverse ways people now categorized under ASD embody it, advocate for themselves, or challenge its boundaries? *(Follow-up if she focuses only on individual adaptation): But Hacking emphasizes the *institutional* feedback loop. Could you give a concrete example of how the *formal criteria* or *standard assessment tools* might be pressured to change *because* of the lived realities of people now unified under ASD?)*

  2.  **Distinguishing Looping from Self-Fulfilling Prophecy:** Sociologists like Merton described self-fulfilling prophecies where a label (e.g., "delinquent") changes behavior because people *believe* it and act accordingly. What does Hacking's "looping effect" concept add that this older idea *misses* when applied to autism and the ASD category? Specifically, how does the *interaction* go beyond belief-induced behavioral change to alter the *very meaning and structure* of the category? *(Follow-up if she conflates them or emphasizes belief): So, is the key difference that looping effects involve the classified group actively *engaging with and reshaping the scientific and institutional definitions themselves*, not just internalizing a static label?)*

  3.  **Neurodiversity & Ontological Stability:** The neurodiversity movement powerfully influences how autism is understood and experienced. Given that this movement's advocacy directly feeds back into diagnostic discussions (e.g., challenging deficit models, emphasizing support needs), does this looping dynamic commit you to the view that autism has *no stable biological or cognitive reality* independent of these social feedback processes? Or is there a core that persists? *(Follow-up if she asserts a "core"): What observable evidence could distinguish that hypothesized stable "core" of autism from aspects that are demonstrably products of the looping interaction? Doesn't the *meaning* of any biological correlate change within the interactive framework?)*

  4.  **Falsifiability/Indifferent Kinds:** Hacking contrasted interactive kinds with "indifferent kinds" that are unaffected by classification (like quarks). What specific observation or evidence regarding a *psychiatric* category (like ASD or another) would convince you it is functioning primarily as an "indifferent kind" – that is, its classification *isn't* significantly changing the people classified or the category itself through feedback? *(Follow-up if she says it's unlikely/impossible for psychiatry): If the claim that psychiatric kinds are *always* interactive isn't falsifiable in principle, doesn't it risk becoming unfalsifiable dogma? What would a genuine counterexample look like, even if improbable? (e.g., a category utterly ignored by those diagnosed?)*

  5.  **The Specificity of the DSM-5 Shift:** The pre-DSM-5 subtypes (Asperger's, PDD-NOS, Autistic Disorder) arguably also exhibited looping effects. What makes the *consolidation* into ASD a particularly potent or distinct catalyst for new forms of looping? Is it the sheer scale/diversity now under one umbrella, the removal of diagnostic "escape hatches," or something else? *(Follow-up if she downplays the uniqueness of consolidation): So, is the consolidation significant mainly because it *amplified* pre-existing looping dynamics by forcing previously distinct groups into shared spaces and discourses?)*

  6.  **Power Dynamics & Resistance:** Looping effects aren't neutral. Who has the most power to *steer* the looping of ASD? Is it clinicians, researchers, policymakers, autistic self-advocates, or parents? How does the consolidation shift these power dynamics compared to the previous sub-categories? *(Follow-up if she emphasizes co-construction): Even in co-construction, power isn't equal. Where do you see the most significant friction or contestation *within* the looping process shaping ASD right now?)*

  7.  **Beyond Diagnosis: Cultural Embedding:** Looping extends beyond the clinic. How does the pervasive cultural narrative of the "autism spectrum" – in media, schools, workplaces – interact with the diagnostic category to create feedback loops that further shape both individual identities *and* the broader societal understanding of ASD? *(Follow-up if she focuses only on clinical impact): Can you give an example of how a popular cultural trope about autism (e.g., the "tech genius") might influence self-perception, diagnosis-seeking, or even research priorities, thereby looping back?)*

  8.  **Journalism's Role in the Loop:** Coverage of "rising autism rates" often frames it as an epidemic of a fixed disorder. Given your framework, how might this journalistic framing *itself* become part of the looping effect – influencing diagnostic practices, parental concern, resource allocation, or even self-identification, thereby potentially contributing to the very increase it reports? What responsibility do science journalists have in covering autism differently? *(Follow-up if she absolves journalism or focuses only on awareness): But doesn't the constant emphasis on "rising rates," often without deep contextualization about diagnostic changes and broadening criteria, risk reinforcing a crisis narrative that fuels further diagnostic expansion and anxiety, regardless of intent?)*

  **Key Follow-up Strategies Incorporated:**
  *   **Merton/Becker Distinction:** Question 2 directly asks for the "added value" of looping, with a follow-up specifically targeting the deflection towards individual belief/internalization by forcing the institutional/definitional change aspect.
  *   **Neurodiversity & Ontology:** Question 3 explicitly asks about the "stable reality" challenge, with a follow-up pushing on how to distinguish any claimed "core" from interactive aspects.
  *   **Falsifiability:** Question 4 directly asks for observable evidence of an indifferent kind in psychiatry, with a follow-up challenging the potential unfalsifiability if she deflects by saying it's always interactive.
  *   **Journalism in the Loop:** Question 8 directly addresses this, with a follow-up pushing back if she downplays media's constitutive role.

  These questions aim to move beyond Hacking 101, forcing concrete application, grappling with implications (like ontology and falsifiability), and examining power dynamics and specific catalysts (like the DSM-5 shift and media coverage).
