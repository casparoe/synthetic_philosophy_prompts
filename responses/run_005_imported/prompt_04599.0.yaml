  Ok I need a tie-breaker because me and my friend Marco argued about this for like two hours last night and neither of us backed down. We're both in this causation reading group, and I made the case that Woodward's interventionist account basically makes the old counterfactual theory of causation (Lewis, Stalnaker, etc.) obsolete. My reasoning: the counterfactual theory grounds causation in these kind of hand-wavy "closest possible world" similarity judgements, whereas interventionism cashes causation out in terms of what would happen to Y if you did a clean surgical intervention on X, using causal graphs and structural equations instead. And that's the framework actual scientists use — Pearl's DAGs, epidemiology, econometrics — nobody doing real causal inference is out here reasoning about possible-world similarity metrics. So to me interventionism is just a different, more rigorous, basically non-modal theory that quietly won and made the counterfactual approach into basically a historical curiosity at this point.

  Marco's whole objection was "isnt 'if you were to intervene on X, Y would change' still a counterfactual claim though?" and I said sure, technically, but that's beside the point because the actual content of the theory is the intervention/manipulation part, not some possible-worlds metaphysics, so it's a different kind of theory even if it happens to use the word "if." He wasn't having it, and honestly neither of us could really cash out what was at stake, we just kept repeating ourselves till we gave up. So who's actually closer to right here — did interventionism replace counterfactual theories of causation with something fundamentally different, like I was arguing, or is there a lot less daylight between the two views than that? And if Marco has a point that it's "still counterfactual" in some real sense, does that actually cost interventionism anything, or is it a distinction without a difference?
