  Here's a five-minute toast designed to hit both targets: warm affection for the retiree, a solid insider joke for the philosophers, and accessible humor for the family, all without dumbing it down:

  **(Clink glass gently)**  

  "Friends, colleagues, [Husband's Name], [Sister's Name], and especially the guest of honor – [Colleague's Name]... forty years! Forty years of shaping minds, dissecting dilemmas, and teaching generations of students the subtle art of asking *exactly* the wrong question at the right time. Specifically: 'Is it okay to flip that switch?'  

  "Now, [Colleague's Name]'s dedication to the trolley problem and the doctrine of double effect is legendary. She didn't just teach it; she lived it. Her seminar wasn't just a class; it was an intellectual boot camp where moral intuitions went to get rigorously interrogated under bright lights. For over twenty years, she expertly guided students through the thickets of bystander ethics, footbridge conundrums, and the weight of hypothetical consequences. She built arguments like masterpieces.  

  "Then, about a decade ago... she did something truly remarkable. Something only the bravest, most intellectually honest philosophers do. She stood up... and **pulled the lever on her own position.**  

  **(Pause for effect, knowing smile towards the grad students)**  

  "One day, after two decades of meticulously defending the bystander's right – perhaps even duty? – to flip that switch and divert the trolley onto the one track... she declared: 'No. Actually, you may *not*.'  

  **(Turn slightly towards the family section with a conspiratorial grin)**  

  "Now, for those of us in the philosophy trenches – her former students here tonight, colleagues – we know what an earthquake that was. It wasn't just 'changing her mind.' Oh no. That was like Judith Jarvis Thomson herself walking onto the tracks and giving the whole runaway trolley of bystander literature a *massive philosophical shunt* off its foundational rails! **She didn't just derail the argument; she politely informed the argument it was never really on the right track to begin with.**  

  **(The grad students chuckle/raise glasses knowingly. You see a few nods. The family leans in, recognizing the 'unbearable' reference is coming.)**  

  "And [Colleague's Name], being the passionate, utterly committed thinker she is, didn't just *have* this realization quietly over tea. She *lived* it. She wrestled with it. She turned it over like a particularly stubborn Kantian imperative.  

  **(Look warmly at Husband and Sister)**  

  "[Husband's Name], [Sister's Name]... you know this better than anyone. I believe the technical philosophical term for how this intellectual revolution manifested at home... was 'Christmas.' Am I right? That year where the doctrine of double effect wasn't just discussed over dinner... it *was* dinner? Where the question wasn't 'Pass the gravy?' but 'Does *intending* to pass the gravy, knowing Aunt Mildred might spill it, fundamentally alter the moral calculus?'  

  **(Gentle, warm laughter from the whole room. The family laughs in recognition, the philosophers laugh at the relatable absurdity.)**  

  "The legend goes that by Boxing Day, even the *turkey* was reconsidering its causal role in the proceedings! We philosophers admire the sheer intellectual integrity it took to publicly reverse such a deeply held position. But you, her family, deserve a special medal for living through the intense, passionate, and yes, occasionally *unbearable* focus that such a monumental shift requires! You saw the fire behind the logic.  

  "And *that* is the magic of [Colleague's Name]. Her brilliance isn't cold. It's not abstract. It burns with conviction. She cares so deeply about getting it *right*, about following the argument wherever it leads – even if it leads her straight off the track she spent twenty years meticulously laying. She taught us that real intellectual courage isn't just defending your position; it's being willing to stand on the footbridge of your own beliefs and ask, 'But what if I'm *wrong*?'... even if it means throwing your own perfectly good lever into the ravine.  

  "So tonight, we celebrate not just forty years of teaching, but forty years of *thinking*. Deeply, rigorously, challengingly, and always with integrity. We celebrate someone who inspired countless students not just to *answer* ethical questions, but to question the very ground those answers stood on. And we celebrate someone whose passion for truth is so fierce, it could derail a thousand trolleys... and occasionally dominate a family holiday!  

  "To [Colleague's Name]: Thank you for the decades of dedication, the intellectual earthquakes, the unwavering passion, and for proving that sometimes, the most profound act isn't flipping the switch... but having the courage to declare it shouldn't be flipped after all. May your retirement be filled with peace, joy, and perhaps... slightly fewer runaway hypothetical vehicles.  

  **(Raise glass high)**  
  **To [Colleague's Name]!**"

  **Why this works:**

  1.  **The Joke:** The core joke ("She didn't just derail the argument; she politely informed the argument it was never really on the right track to begin with") uses the trolley metaphor itself, making it instantly recognizable to the insiders. The follow-up about Christmas ("unbearable," turkey reconsidering its role) makes the *impact* of her intensity relatable to the family without needing the philosophy. It lands as affection because it celebrates her passion and integrity.
  2.  **Balances Audiences:**
      *   *Philosophers:* Uses precise terminology ("bystander," "footbridge," "doctrine of double effect," "Thomson," "foundational rails," "causal role," "intellectual integrity"). They understand the *weight* of her reversal ("earthquake," "derail the bystander literature," "shunt off foundational rails").
      *   *Family:* Focuses on her passion, intensity, commitment ("fire behind the logic," "burns with conviction," "unbearable focus," "dominate a family holiday"). The Christmas anecdote is their anchor point. Terms like "intellectual revolution" and "monumental shift" sound impressive without needing technical understanding.
  3.  **Avoids Dumbing Down:** The philosophical concepts are named and their significance hinted at ("foundational rails," "massive philosophical shunt") without lengthy explanation. The grad students fill in the blanks. It doesn't *explain* double effect or Thomson; it *references* their significance.
  4.  **Tone is Affectionate:** The core message is admiration for her intellectual courage, passion, and integrity. The jokes about Christmas and derailing arguments are framed as endearing quirks stemming from her admirable qualities ("magic," "brilliance isn't cold," "burns with conviction," "real intellectual courage").
  5.  **Structure:** Opening (Legacy) -> The Reversal (Joke for Philosophers & Setup) -> Impact on Family (Relatable Joke) -> Synthesis (Celebrating her Qualities) -> Toast.
  6.  **Respectful:** It celebrates her change of mind as a strength, not a flaw. It honors both her professional impact and her personal intensity.

  **Delivery Tip:** Pace yourself. Let the laugh points land, especially after the "unbearable" Christmas setup and the "turkey reconsidering" line. Make strong eye contact with the grad students during the philosophical reversal description and with the family during the Christmas part. End with genuine warmth directed at the retiree. Good luck!
