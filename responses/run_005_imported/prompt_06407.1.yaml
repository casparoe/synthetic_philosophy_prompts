  First, I need to analyze the core problem with the chair election. Plurality failed because vote-splitting allowed an unpopular candidate to win. The three proposed solutions are ranked-choice voting (RCV), approval voting, and maintaining the status quo with the argument that all systems are manipulable. The budget referendum presents a simpler case since it's single-dimensional.

  For the chair election, I should compare RCV and approval voting in depth. RCV addresses vote-splitting through instant runoffs but has known vulnerabilities to strategic voting in certain scenarios. Approval voting offers simplicity but may encourage bullet voting. The Gibbard-Satterthwaite theorem is relevant here - it mathematically proves no perfect system exists, so we must be transparent about trade-offs.

  The budget referendum is fundamentally different. With single-peaked preferences along one dimension, majority rule becomes robust. Range voting could be considered but simple majority rule between options is likely sufficient and familiar.

  In drafting the memo, I'll need to:
  Acknowledge the legitimacy of strategic voting concerns while showing how different systems mitigate (not eliminate) risks
  Recommend RCV for chair elections for its balance of expressiveness and resistance to vote-splitting
  Recommend sequential majority votes for the budget referendum
  Explain clearly what reforms can realistically achieve - reducing obvious failures rather than creating perfect systems
  Maintain academic rigor while keeping the memo accessible to non-specialist senators

  The tone should be honest about limitations but constructive - emphasizing that while no system is strategy-proof, some are significantly better than plurality for their specific contexts. The memo should help senators understand why different problems require different solutions.
answer: |-
  ## MEMORANDUM  
  To: Faculty Senate  
  From: Rules Committee  
  Subject: Recommendations for Voting Procedures: Chair Election & Budget Referendum  
  Date: October 26, 2023  

  **I. Introduction**  
  This memo addresses voting procedure reform following the unsatisfactory outcome of last spring's Chair election under plurality rules and in anticipation of the upcoming budget referendum. The Committee acknowledges the profound challenge raised by the Gibbard-Satterthwaite theorem: no voting system with ≥3 options can guarantee both non-dictatorship and strategy-proofness (i.e., sincerity is never a dominant strategy for all voters in all situations). **Manipulability is inherent in any democratic system.** Our goal is not to achieve the impossible (a perfectly strategy-proof system), but to select procedures that:  
  (a) Minimize *incentives* for manipulation in *common* scenarios,  
  (b) Reduce the likelihood of *egregiously bad outcomes* (e.g., a Condorcet loser winning),  
  (c) Reflect voter preferences more accurately than the status quo, and  
  (d) Are practical for Senate operations.  

  **II. Recommendation for Chair Election: Ranked-Choice Voting (RCV)**  
  *   **Procedure:** Voters rank candidates in order of preference. If no candidate receives >50% of first-choice votes, the last-place candidate is eliminated, and their votes are redistributed to remaining candidates based on next preferences. This repeats until one candidate achieves a majority.  
  *   **Rationale:**  
      *   **Addresses the Plurality Failure:** RCV directly solves the vote-splitting problem that led to the election of a widely disliked candidate. It ensures the winner has majority support among voters whose preferences are still active in the final round.  
      *   **Mitigates Manipulation Risks (Compared to Status Quo):** While RCV *is* theoretically manipulable (e.g., voters might misrepresent lower preferences to help a "lesser evil" against a frontrunner they dislike), such manipulation requires complex coordination and accurate polling data – unlikely in our context. Crucially, *the incentive to vote insincerely to avoid wasting one's vote* (a major flaw under plurality) is significantly reduced.  
      *   **Promotes Sincere Expression:** Voters can safely rank their true favorite first without fear of helping their least favorite candidate (the "spoiler effect").  
      *   **Identifies Broadly Acceptable Candidates:** RCV tends to favor candidates acceptable to a broader coalition, aligning better with the collaborative role of Senate Chair.  
  *   **What Reform Buys Us:** Primarily, **robustness against vote-splitting and the election of Condorcet losers.** It moves us closer to majority support for the winner and allows fuller expression of preference intensity. It does *not* eliminate all strategic incentives, but it makes harmful manipulation harder and less likely than under plurality.  

  **III. Recommendation for Budget Referendum: Sequential Majority Runoff**  
  *   **Procedure:** Senators vote in two rounds:  
      1.  Vote between the two extreme options (0% and 6%).  
      2.  The winner of Round 1 faces the middle option (3%).  
  *   **Rationale:**  
      *   **Acknowledges Single-Dimensionality:** Unlike the Chair election (multidimensional preferences), budget options lie on a clear spectrum (low to high). This structure matters profoundly.  
      *   **Exploits Robustness of Majority Rule:** On a single dimension with single-peaked preferences (a reasonable assumption for budgets), majority rule is highly robust. The median voter theorem applies: the option preferred by the median voter cannot be defeated by any other option in a pairwise majority vote.  
      *   **Simplicity & Transparency:** Sequential pairwise votes are intuitive, easy to administer, and produce a clear Condorcet winner (the option beating all others head-to-head) *if* preferences are single-peaked.  
      *   **Mitigates Manipulation Risks:** Strategic voting (e.g., voting insincerely in Round 1 to get a preferred matchup in Round 2) is possible but:  
          *   Requires accurate knowledge of others' preferences.  
          *   Risks backfiring severely (e.g., voting for 6% hoping it loses to 3%, but 6% wins and then beats 3%).  
          *   Is generally considered less likely and less damaging than manipulation in multi-candidate, multi-dimensional races like the Chair election.  
  *   **What Reform Buys Us:** A **simple, decisive process highly likely to select the Condorcet winner (the median preference)** under realistic assumptions about budget preferences. It avoids the ambiguity of approval/range voting on a single dimension and the complexity of RCV for only three ordered options.  

  **IV. Addressing the Fundamental Concern (Gibbard-Satterthwaite)**  
  The economist member is correct: **no voting system for ≥3 options is immune to strategic voting in all possible scenarios.** This is a mathematical certainty. Our recommendations do not claim otherwise. Instead, we argue:  

  1.  **Context Matters:** The *likelihood* and *severity* of manipulation vary drastically between systems and settings. Plurality is highly vulnerable to harmful, *simple* strategies (e.g., deserting a viable favorite for a lesser evil). RCV and Sequential Runoff are less vulnerable to these common pathologies in their respective contexts (multi-candidate vs. single-dimensional).  
  2.  **Minimizing Harm:** Reform aims to make *damaging* manipulation harder and less rewarding, and to reduce the frequency of outcomes perceived as fundamentally unfair (e.g., a Condorcet loser winning).  
  3.  **Expressive Power:** Systems like RCV allow voters to express more nuanced preferences, leading to better information aggregation even if some strategy occurs.  
  4.  **Theater vs. Tangible Improvement:** While no system is perfect, abandoning reform due to Gibbard-Satterthwaite is akin to abandoning medicine because no treatment cures all diseases. Plurality demonstrably failed. RCV for Chair elections and Sequential Runoff for the budget are demonstrably *better* tools for these specific jobs, offering significant practical improvements in outcome quality and voter satisfaction despite inherent theoretical limitations.  

  **V. Summary Recommendations**  
  *   **Chair Elections:** Adopt **Ranked-Choice Voting (RCV)** to prevent vote-splitting, ensure majority support in the final round, and allow sincere expression of first choices.  
  *   **Budget Referendum:** Adopt a **Sequential Majority Runoff** (0% vs 6%, winner vs 3%) to leverage the robustness of majority rule on a single dimension and efficiently find the median preference.  

  These reforms offer substantial practical improvements over the status quo by reducing the most common and damaging failure modes, providing voters better tools to express their preferences, and increasing the legitimacy of outcomes. They acknowledge, rather than dismiss, the inevitability of strategic incentives, while choosing systems where such incentives are harder to exploit and less likely to produce perverse results in our specific Senate context.  

  Respectfully submitted,  
  The Faculty Senate Rules Committee
