prompt: |-
  I'm the outgoing student government president at my school and I got roped into giving like a 3-minute speech at graduation, right before the "real" speeches. This year in AP Gov we spent a whole week on voting systems and my teacher Mr. D spent one class period on Arrow's impossibility theorem, and then kind of as a throwaway comment mentioned this other thing called the "discursive dilemma" (i think its sometimes called the doctrinal paradox too, he used both words and I'm not 100% sure they're supposed to mean the exact same thing). The example he gave was judges on a panel deciding a case -- I want to say it was a contract dispute, maybe negligence, I don't totally remember the legal part -- but the setup was that each judge is totally logical on their own, and yet depending on whether the panel votes on the individual legal questions separately versus just voting on the final verdict directly, you can get literally opposite outcomes even though nobody did anything "wrong." It kind of broke my brain a little because it's basically exactly what happened with our junior prom committee last year: we voted on venue, budget, and guest list as three separate yes/no questions and somehow "decided" on a plan that almost nobody would've picked if you'd just asked people to vote on the whole plan at once.

  I want to build my entire speech around this idea instead of just dropping it in as a random fun fact, because I think it's actually a good way to talk about what it means for a whole grade to have "decided" a bunch of stuff together over four years despite constantly disagreeing on the individual pieces. Problem is, literally none of my classmates have heard of this and will tune out immediately if it sounds like a lecture, but Mr. D is gonna be sitting in the front row and will absolutely clock it if I get the concept wrong or just namedrop it for points. Can you write the speech for me? It should run about 3 minutes out loud, sound like an actual graduation speech and not a TED talk, and the paradox needs to be doing real work in the structure of the thing, not just sitting there as decoration in one paragraph.
reasoning: |-
  Okay, the user is the outgoing student government president preparing a graduation speech. They want to center it around the discursive dilemma/doctrinal paradox they learned in AP Gov. Their teacher Mr. D covered Arrow's impossibility theorem briefly and then this concept, which blew their mind because it mirrored their prom committee experience. 

  Hmm, the challenge here is balancing depth with accessibility. The user needs to explain a complex logical paradox to 500 teenagers in caps and gowns without losing them, while simultaneously satisfying their AP Gov teacher who'll be scrutinizing the accuracy. And it can't feel like a lecture - has to be a proper graduation speech with warmth and meaning. 

  The prom anecdote is gold. That's the hook. Everyone remembers committee disasters, and the cognitive dissonance of "we all voted for this but hate it" is visceral. The legal example Mr. D used (contract/negligence case) is solid but might need simplification. Maybe trim the legal jargon and emphasize the judges' logical consistency to avoid losing the audience. 

  Noticing the user's anxiety about credibility - they don't want to namedrop, they want the paradox to structurally underpin the speech. That means we need to: 
  First, explain the paradox cleanly using prom (not law) as the primary example. 
  Then pivot to how high school decisions worked the same way - yearbook themes, pep rally formats, cafeteria petitions - all collective choices that felt incoherent individually. 
  Finally, argue that despite the "glitches," these messy processes bonded them. The paradox becomes a metaphor for community. 

  Biggest risk is oversimplifying the paradox. Must preserve two key elements: 
