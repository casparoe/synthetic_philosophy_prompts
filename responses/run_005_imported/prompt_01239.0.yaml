  First, the background: Hobbes claimed to have solved classical problems like squaring the circle, but Wallis debunked him repeatedly over 25 years. Wallis's strategy was to attack Hobbes's geometry to discredit his political philosophy, which relies on geometry as a model for certainty. The friend argues that Hobbes's persistent errors and refusal to accept refutation weaken his epistemological claim that geometry provides certain knowledge. The user counters that this is ad hominem—Hobbes's personal incompetence doesn't invalidate his theory.

  I need to assess both sides. The friend's point is that Hobbes's theory posits geometry's certainty because we construct the objects ourselves. If Hobbes himself, despite constructing these objects, consistently fails to achieve certainty (as shown by his errors and refusal to concede), that challenges the theory's practical validity. The user's ad hominem argument has merit—personal failure doesn't necessarily negate a philosophical argument. However, in this case, there's a stronger connection because Hobbes's epistemology is tied to the reliability of geometric construction.

  Hobbes's "maker's knowledge" is key here. If the maker (in this case, Hobbes) can't produce correct results despite following the method, it questions the method's efficacy. The friend might be implying that if the method were sound, even a mediocre mathematician should achieve correct results over time, but Hobbes didn't. His dogmatism also highlights a flaw—certainty requires openness to correction, which Hobbes lacked.

  The user's point about other philosophers being mediocre mathematicians is valid, but Hobbes's case is unique because his entire political philosophy rests on geometry's certainty. So his failures are more relevant here. Also, Wallis's strategy was to target the geometry to undermine the political theory, which adds historical context.

  I should also consider Jesseph's work, which the user mentioned. Jesseph likely argues that Hobbes's math failures expose a tension in his system. If geometry is certain because we construct it, but constructions can be contested (as Wallis showed), then the certainty isn't as absolute as Hobbes claimed. This ties into the social aspect of math—consensus and peer review matter, which Hobbes rejected.

  The user might need a balanced view: Hobbes's failures don't logically disprove his epistemology, but they expose practical and theoretical weaknesses. The ad hominem charge isn't entirely wrong, but the specifics of Hobbes's theory make his personal failures more relevant. The deeper issue is whether "maker's knowledge" can guarantee certainty if the maker errs and won't correct mistakes.
