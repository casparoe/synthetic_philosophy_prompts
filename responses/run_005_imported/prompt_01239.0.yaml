  You and your friend have hit on a classic and fascinating tension in Hobbes scholarship: the relationship between his mathematical blunders and his ambitious epistemology. Neither of you is entirely wrong, but your friend has a stronger case *within the specific context of Hobbes's own system*. Here's a breakdown:

  1.  **Your Point (Ad Hominem Defense):**
      *   **Logically Sound:** Strictly speaking, you are correct. A philosopher's *personal incompetence* in a field does not, *by itself*, logically invalidate their *philosophical arguments* about that field. One could argue that Hobbes had a brilliant insight into *why* geometry *should* be certain (maker's knowledge), even if he personally failed to execute it correctly.
      *   **Precedent Exists:** As you note, there are plenty of philosophers of science, math, or mind who weren't practicing scientists, mathematicians, or neuroscientists. Their philosophical arguments stand or fall on their own merit.
      *   **Focus on the Theory:** The core of Hobbes's epistemological claim – that certainty arises from construction based on definitions – is a distinct conceptual argument. Its validity should be assessed philosophically, not solely based on Hobbes's failed attempts.

  2.  **Your Friend's Point (The Hobbesian System Implodes):**
      *   **Attacking the Foundation:** Your friend's argument isn't *just* an ad hominem; it's an attack on the *practical viability and internal coherence* of Hobbes's specific system. Hobbes didn't just *describe* geometry; he made it the **foundational model** for all genuine knowledge, especially political philosophy.
      *   **"Maker's Knowledge" Put to the Test:** Hobbes's core argument ("maker's knowledge") is that we *know* geometrical truths with absolute certainty *because we construct the objects ourselves* from clear definitions. The certainty is inherent in the act of correct construction. Therefore:
          *   **Failure to Construct Correctly:** If Hobbes, diligently applying his own method (as he believed he was), consistently produces demonstrably *false* constructions over decades, it raises a devastating question: **How can the method guarantee certainty if its most ardent proponent, using it earnestly, constantly generates error?**
          *   **Failure to Recognize Error:** Worse than the errors themselves was Hobbes's **dogmatic refusal to accept refutation** by Wallis (and others). For Hobbes, correct construction *should* lead to immediate, undeniable certainty. The fact that he remained *certain* of his *errors* fatally undermines his claim that the method *produces* indisputable certainty. It suggests the "certainty" he experienced was psychological stubbornness, not the logical outcome of the method. If the method doesn't reliably prevent or correct such profound errors even in its champion, how can it be the bedrock of *any* certain knowledge?
      *   **The Political Stakes:** Wallis understood this perfectly (as Jesseph details). Hobbes's political philosophy *depended* on geometry being the paradigm of certain knowledge. If the geometric method could be shown to be vulnerable to persistent, incorrigible error – especially error stemming from the *constructor* themselves – then the claim that political philosophy, built on the same method of definition and deduction, could achieve similar certainty becomes highly suspect. The worm was in the apple.
      *   **Highlighting a Theoretical Flaw:** Hobbes's failures expose a potential theoretical flaw in his maker's knowledge model. It assumes that correct construction *from definitions* is transparent and error-proof. Wallis's refutations (and Hobbes's reactions) demonstrated that constructions can be *complex*, definitions can be *misapplied* or *inconsistent*, and the relationship between definition and constructed object can be *misjudged*, even by someone deeply committed to the method. The certainty isn't as automatic or foolproof as Hobbes claimed.

  3.  **The Better Way to Frame It:**
      *   Hobbes's mathematical failures are **not merely embarrassing trivia** to be set aside. They are **highly relevant evidence** in assessing the *practical application* and *internal robustness* of his specific epistemological theory, especially given:
          *   **The Centrality of Geometry:** Geometry wasn't just an example for Hobbes; it was *the* exemplar and foundation.
          *   **The Nature of "Maker's Knowledge":** The theory claims certainty arises *from the act of correct construction*. Persistent failure *in construction* directly challenges that claim.
          *   **Hobbes's Own Dogmatism:** His refusal to concede error starkly contradicts the supposed infallibility granted by the method.
      *   **However, it's not a *logical knockout* of the *abstract idea* of maker's knowledge.** One could argue that Hobbes simply failed to apply his *own* method correctly. A defender could say: "The method *is* sound; Hobbes was just a uniquely bad practitioner." But this defense is weak because:
          *   Hobbes *believed* he was applying it correctly.
          *   He was intellectually formidable in other areas (politics, linguistics).
          *   The sheer scale and duration of the failure, coupled with his intransigence, make it hard to dismiss as mere personal incompetence. It points to a flaw *in the method as he conceived and practiced it*.
      *   **The Real Lesson:** Hobbes's debacle shows that **even a "maker's knowledge" approach requires robust criteria for *verifying* the correctness of the construction and mechanisms for *correcting* error.** Hobbes lacked these. His system assumed the construction's correctness was self-evident, which Wallis proved false. This highlights the social and critical dimension of knowledge production that Hobbes downplayed. Certainty, even in geometry, isn't just individual; it's intersubjectively tested and refined.

  **Conclusion:** Your friend has the stronger argument *in the context of Hobbes's specific project*. While you are formally correct that personal failure doesn't *automatically* invalidate a philosophical theory, Hobbes's mathematical fiascos are devastating *because* they directly attack the core mechanism (successful construction yielding undeniable certainty) upon which his entire epistemological and political edifice was built. They aren't just an ad hominem; they are a practical demonstration of a critical weakness *within* his system. They show that the "certainty" promised by maker's knowledge, as Hobbes practiced it, was vulnerable to profound and incorrigible error, fatally undermining its claim to be the unique foundation for political science. The feud isn't trivia; it's a powerful case study in the limitations of Hobbes's grand philosophical ambition.
