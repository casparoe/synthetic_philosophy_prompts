  ## Not Me, But Someone Like Me

  The hum of the makeshift resonator – salvaged oscillators, jury-rigged quantum processors, and pure, stubborn intuition – filled Elin’s cluttered study. The air shimmered like heat haze over tarmac. She braced herself. Oslo-Elin was always the most… *insistent* visitor.

  A figure coalesced within the distortion. Same dark hair, cut sharper. Same intelligent eyes, but framed by subtle lines of stress Elin didn’t recognize in her own mirror. Oslo-Elin wore a tailored charcoal suit, crisp white shirt, radiating a weary competence. She stepped forward, the shimmer collapsing behind her.

  "Home," Oslo-Elin breathed, looking around at the familiar chaos of Elin’s books and half-built gadgets with undisguised longing. "God, I miss the smell of damp paper and solder."

  "You *are* home," Elin corrected automatically, the familiar philosophical itch starting. "This *is* your origin point. Just… not your timeline."

  Oslo-Elin waved a dismissive hand, already moving towards the kettle. "Semantics, Elin. We’re the *same*. Born same day, same parents, same stupid fight with Liam over that awful vase his mother gave us. We diverged at the Oslo offer, that’s all. Different choices, same essence." She filled the kettle with practised ease, knowing exactly where the cups were kept.

  Elin watched her. The ease was unnerving. This woman moved through *her* space like she owned it, precisely *because* she believed she *did* own it, fundamentally. She was the Elin who’d said yes to the high-pressure research director role in Norway, leaving behind her marriage and her quieter life of tinkering. The life Elin had chosen.

  "You seem… tired," Elin ventured.

  "Exhausted," Oslo-Elin sighed, leaning against the counter. "Brilliant team, groundbreaking work on quantum tunnelling applications. But the politics… the endless pressure. I haven’t slept through the night in months." She pulled a small silver locket from beneath her shirt, clicking it open. Inside were two photos: one of her parents, identical to Elin’s, and one of a smiling man Elin didn’t recognize. "Anders. We met three years ago. He’s wonderful. But…" She trailed off, looking pointedly at Elin’s bare ring finger. "You never found anyone else, did you? After Liam."

  Elin flinched. "No. Too busy." The question felt invasive, even though Oslo-Elin clearly saw it as asking about her *own* life. "But that’s my point. *You* have Anders. *I* don’t. We’ve lived different lives. Doesn’t that make us… different people? Just very, very similar?"

  Oslo-Elin poured the boiling water, steam curling around her face. "Different paths, same traveller. The core is identical. The potential was always there. *You* had the potential for Oslo, for Anders. You just chose… this." She gestured vaguely at the workshop. "The cowardly choice, frankly."

  The barb stung. Elin *had* agonized over Oslo. The fear of the unknown, the comfort of the familiar… they’d won. "It wasn’t cowardice! It was… different priorities. Doesn’t that *mean* something? Doesn’t the sum of our choices define who we *are*?"

  "Define the surface," Oslo-Elin countered, stirring her tea. "Not the substance underneath. Think about it. If I swapped places with *you* right now, permanently, who would notice? My colleagues? Anders? Your neighbours? They'd see *me*, acting slightly off-kilter for a while, maybe, then adjusting. Because *I am Elin*. The one who belongs in this world, just… detoured." Her eyes gleamed. "That’s why I’m here. I want to swap. Permanently."

  Elin froze. "What?"

  "You heard me. This life," Oslo-Elin gestured around, "is what I *crave*. Quiet. Solitude. Meaningful tinkering without corporate sharks breathing down my neck. *You* take Oslo. Take Anders. Take the stress and the glory. You have the potential! It’s just buried under… well, under *this*." Her tone wasn't malicious, just chillingly pragmatic. "We swap. You get the life you *could* have had. I get the life I *should* have had. We both win. Because we *are* the same person. It’s just… correcting a past mistake."

  Elin’s mind reeled. The philosophical abstraction slammed into visceral reality. Oslo-Elin saw this as trading places with *herself*. An upgrade. A course correction. She saw Elin not as a distinct individual shaped by different experiences, but as a slightly defective version *of herself* that needed replacing.

  "But… what about *me*?" Elin whispered. "The me standing here? The one who *lived* this life? The one who chose the vase fight with Liam, who built this resonator bolt by bolt? What happens to *her* if I walk into Oslo?"

  Oslo-Elin frowned, genuinely perplexed. "What do you mean? *You* become me. *I* become you. There’s only one Elin. Just… relocated." She took a step closer. "Think of Anders. He’s waiting for *me* tonight. If you come, he’ll have *me* back. The woman he loves. The woman who argued with him about Bergman films last week. *Your* presence, your memories of solitude and gadgets… they’d fade. You’d *become* me, because you *are* me. Transworld identity, Elin. It’s the only logical way this works."

  The Humphrey objection crystallized in Elin’s mind, sharp and terrifying. If she went to Oslo, *she* wouldn't be winning Anders, living the high-powered life. Some *other* entity, incredibly similar, with Elin's origin and potential, would step into *her* shoes and live *her* life. But *this* Elin, the one shaped by *this* specific sequence of choices and consequences… *she* would cease. Replaced. Erased. Not relocated, but terminated.

  Oslo-Elin saw only one self, hopping worlds. Elin suddenly saw two distinct beings, terrifyingly alike, but fundamentally separate. One born of Oslo’s pressures and Anders’s love. The other forged in solitude and solder fumes. To swap wasn't trading places; it was annihilation for one and usurpation for the other.

  "No," Elin said, her voice surprisingly steady. She backed towards the humming resonator console. "You’re wrong. We’re not the same."

  Oslo-Elin’s expression hardened. "Don’t be absurd. Of course we are."

  "You have Anders. I have this workshop. You thrive on pressure. I need quiet. You think my choice was cowardly. I think yours was… lonely, in its own way. We share origins, Oslo-Elin. We share potential. But the life lived… the choices made… they *matter*. They make us *different people*. You’re not *me*. You’re someone remarkably like me, from a world remarkably like mine. But you are a *stranger* asking me to die so you can steal my life."

  Rage flashed in Oslo-Elin’s eyes – the rage of someone told they don't fundamentally exist. "You selfish fool! You’re throwing away *your own* happiness! *My* happiness! We are *identical*!"

  "Similar enough," Elin countered, her hand hovering over the resonator’s recall sequence. "Not identical. Not *me*. And I don’t want your life. I *choose* mine. Go home."

  "You don’t understand what you’re denying!" Oslo-Elin lunged, not for Elin, but for the resonator’s control panel, fingers outstretched to override the recall, to force the swap.

  Elin reacted faster. She slammed her palm down on the emergency recall actuator. A high-pitched whine pierced the air. The shimmering distortion exploded outwards, engulfing Oslo-Elin. For a split second, Elin saw pure, bewildered betrayal in those familiar eyes – the look of someone who genuinely couldn't comprehend why her *own self* would reject her salvation.

  Then she was gone. The resonator sputtered, sparked violently, and fell dark, a thin wisp of smoke curling from its overloaded core.

  Silence crashed down, thick and absolute. Elin stood alone in her workshop, the smell of ozone and burnt circuitry replacing the phantom scent of expensive perfume. Her hands trembled.

  Oslo-Elin believed she was offering Elin her own better life. Elin knew Oslo-Elin had asked her to commit suicide so a brilliant, ambitious stranger could live in her place.

  The broken resonator was just twisted metal and fried silicon. The philosophical chasm it had revealed, however, gaped wider than any portal between worlds. She hadn't just sent back a visitor; she'd affirmed a terrifying truth: in the vast ocean of possible worlds, she was utterly, irrevocably, alone. Not even her closest counterpart was truly *her*. The only Elin was the one standing in this room, breathing the acrid air, her choices – the cowardly, quiet, solder-scented ones – etched into her very being. She picked up Oslo-Elin’s discarded teacup. It was still warm. The gesture of making tea, familiar yet alien, felt like the deepest violation. She placed the cup carefully in the sink, the porcelain clinking in the sudden, profound quiet. The right choice, she told herself. The *only* choice. So why did the silence feel so much like grief?
