prompt: |-
  I have just agreed to take over grading for an upper-level undergraduate seminar on classical Indian philosophy after the instructor had to step away midway through the term, and the first stack of exams I have inherited covers Nyāya epistemology, which is not really my subfield. Below is the question and one student's response. I would appreciate an outside assessment before I commit to a grade.

  Question (20 points): Explain the Nyāya school's account of the pramāṇas, focusing especially on anumāna. Your answer should (a) list the pramāṇas Nyāya recognizes, (b) reconstruct the classic inference of fire from smoke using the five members (avayava) of the Nyāya syllogism, (c) explain the role of vyāpti in licensing the inference, and (d) contrast the Nyāya position with at least one rival school's treatment of a pramāṇa.

  Student's answer: Nyāya is a realist school that recognizes four pramāṇas, or valid means of knowledge: pratyakṣa (perception), anumāna (inference), upamāna (comparison), and śabda (testimony). This puts it in the middle of the spectrum of classical epistemologies: the Cārvākas accepted only perception, while the Mīmāṃsakas and Advaita Vedāntins went as far as six.

  Take the stock example of inferring fire on a distant mountain from the smoke above it. Nyāya breaks the inference into five members: the pratijñā or thesis ("the mountain has fire"), the hetu or reason ("because it has smoke"), the udāharaṇa or example, drawn from a case where the connection is already familiar ("wherever there is smoke there is fire, as in a kitchen"), the upanaya, applying the rule to the case at hand ("the mountain has smoke of that kind"), and the nigamana, which restates the conclusion ("therefore the mountain has fire").

  What entitles us to move from smoke to fire is vyāpti, the invariable concomitance between the hetu and the sādhya: every case of smoke is a case of fire, without exception. Nyāya thinks the Cārvākas were wrong to reject this apparatus, since their skepticism about inference really amounted to a broader skepticism about whether our experience corresponds to any external world beyond the immediate deliverances of the senses, which is too strong a doubt to build an epistemology on.

  Nyāya's other non-perceptual pramāṇa, upamāna, works on a similar analogical footing: from an observed resemblance between two things, we reason to further, unobserved facts about them. The classic case is the gavaya, a wild ox: told that a gavaya resembles a cow, a traveler who later meets one in the forest can infer, by that resemblance, further facts about the animal's temperament and habits, in just the way one might infer a new drug's side effects from its resemblance to a known one.

  Since vyāpti-knowledge is itself just the residue of repeated perception, and upamāna is a form of analogical inference, the four pramāṇas are best understood as different routes that all terminate in pratyakṣa: anumāna, upamāna, and śabda are elaborations of perception rather than independent sources of knowledge in their own right.

  Could you grade this out of 20 and give point-by-point comments that justify the grade rather than a general impression? A short rubric in JSON — category, points possible, points awarded, and a one-line justification for each of parts (a) through (d) plus overall coherence — would also help.
reasoning: |-
  Okay, the user is stepping in to grade exams on Nyāya epistemology, which isn't their specialty. They've shared a student's answer and want a detailed evaluation with a rubric. Let me break this down carefully.

  First, the question has four clear parts: (a) list pramāṇas, (b) reconstruct fire/smoke inference, (c) explain vyāpti, and (d) contrast with a rival school. The student's answer seems strong at first glance—they hit all the required components with textbook examples.

  For part (a), they perfectly list the four Nyāya pramāṇas and contextualize them against other schools. That's full points. Part (b) is also flawless: the five avayavas are correctly named and applied to the mountain example. 

  Part (c) is where minor issues start. The student defines vyāpti accurately but oversimplifies it as "just the residue of repeated perception"—ignoring Nyāya's nuanced view that vyāpti requires more than mere observation (like absence of counterexamples). I'd deduct a point here. 

  Part (d) has a bigger problem. They contrast Nyāya with Cārvāka regarding inference, but then pivot to upamāna without comparing its treatment to rivals as required. The Mīmāṃsaka contrast is implied but not explicit. That costs another point. 

  The coherence deduction is for the last paragraph's controversial claim that all pramāṇas reduce to perception—this contradicts Nyāya's explicit pluralism. While interesting, it's inaccurate and distracts from the question's focus. 

  Overall, the answer is well-structured and demonstrates good knowledge, just needs tighter alignment with Nyāya orthodoxy in spots. 17/20 feels fair—strong but not perfect.
answer: |-
  Here's a point-by-point assessment and the requested JSON rubric:

  **Overall Assessment:**
  The answer demonstrates a strong grasp of Nyāya epistemology, correctly addressing all required parts (a-d) with mostly precise technical terminology and classic examples. Key strengths include the accurate listing of pramāṇas, flawless reconstruction of the 5-membered inference, and a clear core explanation of vyāpti. The main weaknesses are a minor oversimplification of vyāpti's basis, an incomplete rival contrast in part (d), and a concluding claim about all pramāṇas reducing to perception that contradicts Nyāya's explicit pluralism, impacting coherence. It remains an excellent answer deserving a high grade.

  **Rubric (JSON):**

  ```json
  {
    "gradingRubric": {
      "parts": [
        {
          "category": "(a) List pramāṇas",
          "pointsPossible": 4,
          "pointsAwarded": 4,
          "justification": "Correctly lists all four Nyāya pramāṇas (pratyakṣa, anumāna, upamāna, śabda) and contextualizes them."
        },
        {
          "category": "(b) Reconstruct inference (5 avayavas)",
          "pointsPossible": 6,
          "pointsAwarded": 6,
          "justification": "Perfectly reconstructs the fire/smoke inference with all five members correctly named, defined, and applied to the example."
        },
        {
          "category": "(c) Explain vyāpti's role",
          "pointsPossible": 5,
          "pointsAwarded": 4,
          "justification": "Core explanation of vyāpti licensing inference is correct, but oversimplifies its basis as 'just the residue of repeated perception' (ignoring need for tarka/counterfactual analysis)."
        },
        {
          "category": "(d) Contrast with rival school",
          "pointsPossible": 3,
          "pointsAwarded": 2,
          "justification": "Contrast with Cārvāka on inference is valid, but fails to explicitly contrast a rival's treatment of a *specific pramāṇa* (e.g., Mīmāṃsā on śabda or upamāna) as required. Gavaya example is good but used for upamāna explanation, not contrast."
        },
        {
          "category": "Overall Coherence & Accuracy",
          "pointsPossible": 2,
          "pointsAwarded": 1,
          "justification": "Well-structured and mostly accurate, but concluding reductionist claim (all pramāṇas terminate in pratyakṣa) misrepresents Nyāya's explicit commitment to pluralism."
        }
      ],
      "totalScore": 17,
      "totalPossible": 20
    }
  }
  ```

  **Detailed Comments:**

  1.  **(a) List pramāṇas (4/4):** Perfect. All four Nyāya pramāṇas are correctly named and briefly contextualized against other schools (Cārvāka, Mīmāṃsaka/Vedāntin). No errors.
  2.  **(b) Reconstruct inference (6/6):** Excellent. The five avayavas are correctly named (pratijñā, hetu, udāharaṇa, upanaya, nigamana) and accurately applied to the classic fire/smoke example. The definitions are concise and precise.
  3.  **(c) Explain vyāpti's role (4/5):** The core explanation is correct: vyāpti (invariable concomitance) is correctly identified as licensing the inference from hetu (smoke) to sādhya (fire). The definition is accurate. **Deducted 1 point** for the claim "vyāpti-knowledge is itself just the residue of repeated perception." While perception plays a role, Nyāya emphasizes that *certain* knowledge of vyāpti (especially for non-pervasive relations like smoke-fire) requires additional methods like *tarka* (hypothetical reasoning/counterfactual analysis) to rule out accidental correlations and establish true necessity. This oversimplification slightly weakens the explanation.
  4.  **(d) Contrast with rival school (2/3):**
      *   **Strengths:** The contrast with Cārvāka skepticism about inference/anumāna is valid and relevant. The explanation of the Cārvāka position and the Nyāya critique is sound.
      *   **Weakness (Deducted 1 point):** The question specifically asks to contrast the Nyāya position with a rival school's treatment of **a pramāṇa**. While contrasting anumāna with the Cārvāka view *is* one valid approach, the answer then shifts to explaining Nyāya's *upamāna* (using the gavaya example) without actually contrasting how a rival school (e.g., Mīmāṃsā or Buddhism) treats *upamāna* or another specific pramāṇa. The gavaya example is used to *explain* upamāna, not to *contrast* it with a rival view. A complete contrast requires explicitly stating how another school defines, accepts, or rejects a specific pramāṇa differently than Nyāya (e.g., "Mīmāṃsakas consider śabda/Veda to be intrinsically authoritative (autpattika), while Nyāya grounds it in the reliability of the speaker" or "Buddhists reduce upamāna to inference/perception, denying its independent status").
  5.  **Coherence & Accuracy (1/2):** The answer is generally well-structured, clear, and flows logically. **Deducted 1 point** for the concluding claim: "the four pramāṇas are best understood as different routes that all terminate in pratyakṣa: anumāna, upamāna, and śabda are elaborations of perception rather than independent sources." This is a significant misrepresentation of the Nyāya position. Nyāya is explicitly a *pluralist* school regarding pramāṇas. While perception is foundational, anumāna, upamāna, and śabda are considered *sui generis*, irreducible, and *independent* valid means of knowledge (pramāṇas), each with its own unique object domain and mechanism. Gautama's Nyāyasūtra (1.1.3) lists them separately precisely because they are distinct sources. This reductionist claim undermines a core Nyāya doctrine and thus impacts the overall coherence and accuracy negatively.

  **Final Grade: 17/20 (A- / Excellent, minor flaws)**
