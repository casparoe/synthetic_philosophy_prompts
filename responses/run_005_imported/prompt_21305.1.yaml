answer: |-
  That's an excellent synthesis of the replication crisis critique, and you're absolutely right about the central role of p-values and NHST (Null Hypothesis Significance Testing) in enabling junk science. However, while Bayesian methods are a crucial improvement, the situation is more nuanced than simply switching statistics solving everything. Let's break down your points:

  1.  **P-Values & NHST ARE Structurally Broken (in common practice):** Your diagnosis is spot on.
      *   **p < .05 ≠ Truth:** It only means the observed data (or more extreme) is unlikely *if the null hypothesis is strictly true*. It says nothing about the probability the null is false, the probability the alternative is true, the size of the effect, or its practical importance.
      *   **Vulnerability to QRPs:** The system incentivized p-hacking, HARKing, selective reporting, and publication bias. Getting p < .05 became the goal, not finding truth. Bem's work is a prime example of how flexible analysis + low power + publication bias = false positives.
      *   **Ignoring Power:** Low-powered studies (common in psych) have a high chance of missing real effects *and* a surprisingly high chance of *finding* false positives if the null is slightly false (which it almost always is).
      *   **The Base Rate Fallacy:** Even with a low p-value, if you're testing unlikely hypotheses (like ESP), most "significant" findings will be false positives. NHST doesn't incorporate prior plausibility.

  2.  **Wagenmakers' Reanalysis IS a Smoking Gun for the Problem:** It perfectly illustrates the flaw.
      *   Applying even mildly skeptical Bayesian priors (reflecting the inherent implausibility of ESP) showed that Bem's data provided *at best* very weak evidence for psi, and often evidence *for* the null. The p-values massively overstated the evidence.
      *   This demonstrated how NHST, divorced from prior plausibility and focused only on rejecting a strict null, can make weak evidence look revolutionary.

  3.  **Bayesian Statistics ARE a Better Framework (in principle):**
      *   **Quantifies Evidence:** Bayes Factors directly compare the evidence for H1 vs H0 (or different models), which is what scientists actually want to know.
      *   **Incorporates Priors:** Forces explicit consideration of prior knowledge/plausibility. An extraordinary claim *needs* extraordinary evidence (a very high BF).
      *   **Less Vulnerable to Stopping Rules:** Bayesian updating is more coherent with sequential data collection (though not immune to bias).
      *   **Focuses on Effect Size:** Estimation (posterior distributions) naturally emphasizes the size and uncertainty of effects, not just binary significance.

  4.  **BUT... Switching to Bayes Wouldn't Have *Eliminated* the Crisis Alone:**
      *   **"Honest Priors" are Hard:** Defining an "honest" prior is subjective and contentious. Researchers motivated to find an effect could still choose overly optimistic priors ("Why be so skeptical?"). Publication bias could still favor papers with high BFs obtained via questionable priors or other QRPs.
      *   **QRPs Don't Vanish:** HARKing, selective reporting of analyses/models, data dredging, and publication bias can still distort Bayesian results. A BF of 10 looks great, but if it's the only one reported out of 20 analyses, it's still misleading.
      *   **Incentive Structure Remains:** The core problem was (and still is, though improving) the academic incentive system: publish novel, surprising, positive results in high-impact journals. This pressure exists regardless of the statistical framework. Bayes factors can be hacked too (e.g., choosing uninformative priors when convenient, or tweaking models).
      *   **Low Power is Still Bad:** A Bayesian analysis with low power will yield inconclusive BFs (around 1), but these studies are still wasteful and contribute to the literature's noise. They might not create *as many* false positives as NHST, but they don't generate reliable evidence either.
      *   **Implementation & Training:** Widespread, *correct* use of Bayesian methods requires a massive shift in training and software, which is still ongoing.

  5.  **Should You Discount Pre-2015 p-value Findings & Trust Bayes Factors More? (A Nuanced Answer):**
      *   **Yes, Be Highly Skeptical of Isolated p < .05 Findings (Especially Surprising Ones):** Especially from the pre-crisis era (pre ~2010-2012), single-study p < .05 findings, particularly of novel or surprising effects, should be treated as very preliminary. Assume a high false positive rate. The Bem/power posing examples are canonical warnings.
      *   **Look for More Than Just p or BF:** Prioritize findings that have:
          *   **Been Directly Replicated:** Especially pre-registered, high-powered replications.
          *   **Large Effect Sizes:** Small effects are much harder to reliably detect and more likely to be false positives or inflated.
          *   **Strong Theoretical Plausibility:** Does it fit with established knowledge?
          *   **Pre-registration & Open Data/Code:** These practices reduce QRPs far more effectively than just switching statistics.
          *   **Meta-analyses:** Synthesize evidence across multiple studies.
      *   **BFs are *Generally* More Informative Than p-values:** A BF > 10 (strong evidence for H1) or BF < 0.1 (strong evidence for H0) is typically more robust evidence than a p < .05 *if the analysis is well-conducted*. But:
          *   **Check the Prior:** Is it reasonable? Is it justified? An overly optimistic prior inflates the BF for H1; an overly skeptical one deflates it. Sensitivity analyses are crucial.
          *   **It's Still One Study:** A single BF, like a single p-value, isn't definitive. Replication is key.
          *   **BFs Don't Solve All QRPs:** Be alert to potential HARKing, selective reporting, or data dredging *within* the Bayesian framework.
      *   **Don't Automatically Discount *All* Pre-2015 Findings:** Some well-established findings with large effects, strong theoretical backing, and consistent replication (e.g., many core cognitive psychology phenomena, basic social psych effects like conformity or cognitive dissonance *when carefully replicated*) hold up. The crisis hit hardest at novel, small-effect, "sexy" findings. Discount based on *characteristics* (novelty, effect size, methodological rigor, replication status), not *solely* publication date or statistical method.

  **Conclusion & Recommendation:**

  You've correctly identified the deep flaws in NHST/p-values as a major engine of the replication crisis. Bayesian methods, particularly Bayes Factors with sensible priors, are a *significantly better* framework for quantifying evidence and incorporating prior knowledge. Wagenmakers' demolition of Bem is indeed a powerful demonstration.

  **Should you trust papers with Bayes Factors more than those with just p-values? Generally, yes, *if* the Bayesian analysis is well-conducted and transparent about priors.** They provide more directly relevant information.

  **Should you discount *any* pre-2015 finding leaning on p-values? Not universally, but apply strong, informed skepticism, especially to:** single studies, small effects, surprising claims, and findings from fields/methods known for low power and QRPs. Look for the other hallmarks of reliability (replication, pre-registration, large effects, plausibility).

  **The real lesson is broader than just Bayes vs. Frequentism:** The replication crisis was fueled by a *system* of incentives, practices (QRPs), and inadequate statistical training/understanding. Fixing it requires:
  1.  **Better Statistics:** Widespread adoption of Bayesian methods, estimation (effect sizes & CIs), and power analysis.
  2.  **Better Practices:** Pre-registration, open data/code, replication efforts (especially by independent labs).
  3.  **Better Incentives:** Rewarding replication, robustness, transparency, and quality over novelty and p < .05.

  Bayesian statistics are a vital part of the solution, but they are not a magic bullet that would have single-handedly prevented the crisis. They are, however, a much better tool for the job when used correctly within a reformed scientific ecosystem. Your instinct to value them more highly than isolated p-values is well-founded.
