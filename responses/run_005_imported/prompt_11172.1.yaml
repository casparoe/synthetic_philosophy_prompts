prompt: |-
  I sit on the incidental-findings subcommittee of my university's biobank, and we're close to voting on a policy for a case that keeps recurring in our aging-cohort study: participants who consented to research-grade whole-genome sequencing and turn out to carry two copies of the APOE4 allele, which substantially raises lifetime Alzheimer's risk and for which there is still no approved intervention that prevents or delays onset in people who are asymptomatic. At enrollment, participants ticked a box indicating whether they wanted this kind of finding disclosed if it ever turned up, and a sizable minority said no.

  One subcommittee member, a former decision theorist now doing public-health research, keeps invoking what she calls Good's theorem -- the result that for a Bayesian expected-utility maximizer, the expected value of costless evidence is never negative -- to argue that the "no" box is tracking discomfort rather than anything a sound policy should defer to, and that disclosure by default is simply what the math recommends once you're honest about it. Two of our clinicians push back with the "right not to know" tradition that grew out of Huntington's-disease predictive testing, together with documented cases of anxiety and family disruption following unsolicited disclosure of similarly grim, non-actionable results -- disruption that's compounded here, since a participant's APOE4 status also implies something about their parents and siblings, none of whom consented to learn anything. I've read enough Bayesian-inflected blogs over the years to recognize the theorem on sight, but I've never seen anyone actually work out whether it bears on a case like this one, and nobody on the subcommittee seems able to either dismiss the argument or accept it outright.

  Could you draft the short recommendation memo the subcommittee will bring to the full board next month? It should land on one specific policy for this class of finding rather than calling for further study -- covering at least the default (opt-in vs. opt-out at enrollment), the threshold a finding must meet to be disclosed at all, and how, if at all, biological relatives factor in. And since the decision-theoretic argument is the one nobody here has managed to actually rebut rather than just talk past, please give it a serious hearing on its own terms: say specifically which of the theorem's idealizing assumptions -- about the evidence being free, the relevant utility function being fixed and already complete, there being a single decision-maker, and so on -- this situation satisfies or fails to satisfy, rather than just asserting that real participants aren't idealized Bayesian agents.
reasoning: |-
  Okay, the user is part of a biobank subcommittee dealing with a complex ethical dilemma. They need to draft a recommendation memo on disclosing APOE4 results to participants who opted out. The core tension is between a decision theorist invoking Good's theorem (arguing disclosure is always beneficial) and clinicians emphasizing the "right not to know" based on real-world harms. 

  Hmm, the user's frustration is palpable - they've recognized Good's theorem from blogs but never seen it applied to real-world bioethics. Their committee is stuck between abstract math and clinical pragmatism. What they really need is to bridge that gap: show why the theorem doesn't mechanically apply here without dismissing its intellectual merit.

  Let me unpack Good's theorem first. Its assumptions are brittle: costless evidence, fixed utilities, single decision-maker. But in this scenario? The evidence isn't free (psychological costs), utilities aren't fixed (people regret choices), and relatives become collateral decision-makers. The clinician's anxiety cases directly violate the "no negative utility" premise. 

  The Huntington's precedent is crucial - it established that autonomy isn't just about choosing to know, but choosing not to know. Forcing disclosure would treat consent as a one-time checkbox rather than an ongoing right. And wow, the familial implications are ethically explosive: revealing a participant's status outs their parents' genotypes without consent. That alone might sink the "single decision-maker" assumption.

  For the memo... must land on a policy, not punt. Given the opt-outs were explicit, default should be respect the "no" with rare exceptions. Threshold? Only clinically actionable findings - which APOE4 fails. Relatives? Absolutely no disclosure without proband's consent. Should probably recommend counseling support too, since even willing recipients may struggle.

  The decision-theory rebuttal needs surgical precision: "We acknowledge Good's theorem but note condition X fails because of Y empirical evidence." Not "participants aren't Bayesian" - that's lazy. Show exactly where the model cracks. The former decision theorist might still dissent, but at least the gap is framed rigorously.
answer: |-
  ## Recommendation Memo: APOE4 Disclosure Policy for Biobank Aging Cohort

  **To:** Biobank Oversight Board  
  **From:** Incidental Findings Subcommittee  
  **Date:** October 26, 2023  
  **Subject:** Policy Recommendation for Disclosure of APOE4 Homozygosity Findings  

  **1. Recommended Policy:**  
  *   **Default:** **Respect explicit opt-out ("No") selections.** Participants who declined disclosure of non-actionable, high-impact risk findings at enrollment should *not* receive unsolicited APOE4 results.  
  *   **Threshold for Disclosure:** Findings must meet **BOTH** criteria:  
      *   **High clinical significance** (well-established, substantial impact on morbidity/mortality).  
      *   **Actionability** (established prevention, treatment, mitigation, or surveillance protocols available *at the time of disclosure*).  
      *   *APOE4 homozygosity currently FAILS the actionability threshold.*  
  *   **Biological Relatives:** **No direct disclosure.** Information cannot be shared with relatives without the proband's explicit, informed consent and involvement. Counselors may discuss *implications* for relatives with the consenting proband.  

  **2. Rationale:**  
  While APOE4 homozygosity confers significant Alzheimer's risk, the absence of proven preventative or delaying interventions for asymptomatic individuals renders it non-actionable. Respecting participant autonomy, as exercised via the initial consent process, is paramount. The documented risks of psychological harm, anxiety, stigmatization, and family disruption associated with unsolicited disclosure of non-actionable genetic risks outweigh the theoretical benefits of knowledge in this specific context. The familial implications (revealing parental genotypes and sibling risk without their consent) compound the ethical violation.  

  **3. Addressing Good's Theorem:**  
  We have carefully considered the argument invoking **Good's Theorem** (that costless evidence cannot have negative expected value for a Bayesian expected-utility maximizer). While theoretically compelling, its application here is flawed due to violations of core assumptions:  

  *   **"Costless" Evidence Assumption (FAILS):** Disclosure is **not costless** in this real-world context. Documented harms include:  
      *   *Psychological Costs:* Significant anxiety, depression, existential distress ("spoiled identity").  
      *   *Practical Costs:* Insurance discrimination fears (despite GINA, limitations exist), family conflict, potential impact on financial/estate planning based on perceived doom.  
      *   *Opportunity Costs:* Time/emotional burden of seeking unnecessary screening or unproven interventions.  
  *   **Fixed and Complete Utility Function Assumption (FAILS):** Individuals are not static utility maximizers with fully known preferences.  
      *   *Endogenous Preferences:* Learning APOE4 status *changes* an individual's preferences, risk perception, and utility function itself (e.g., shifting weight onto "peace of mind" vs. "knowledge"). The "no" box often reflects a pre-commitment strategy *against* anticipated future regret or distress, a rational choice incompatible with a fixed utility model.  
      *   *Incomplete Self-Knowledge:* Participants may lack perfect foresight about how this knowledge would truly impact their wellbeing.  
  *   **Single, Isolated Decision-Maker Assumption (FAILS):** Disclosure impacts a *network*:  
      *   *Familial Impact:* Revealing the participant's status unavoidably discloses probabilistic risk information about parents and siblings *without their consent*. This imposes potential harm on non-consenting third parties, violating the theorem's individualistic frame.  
      *   *Relational Autonomy:* Decisions impact family dynamics and obligations.  

  **Conclusion on Good's Theorem:** While the theorem highlights the potential *intrinsic* value of information under idealized conditions, the *extrinsic costs* (psychological, familial, social) and the *dynamic nature of human preferences* in the face of life-altering, non-actionable risk information mean the idealized assumptions do not hold. Therefore, the theorem **does not mandate overriding a participant's prior, explicit preference against receiving this specific finding.** Respecting the "no" selection is not irrational; it honors a participant's autonomous choice to avoid foreseeable, significant burdens associated with non-actionable knowledge and its collateral effects on their family.

  **4. Implementation:**  
  *   Maintain and rigorously respect the enrollment consent selection ("Yes" or "No") for disclosure of non-actionable, high-risk findings like APOE4 homozygosity.  
  *   **Re-consent at Threshold Change:** If APOE4 status becomes clinically actionable (e.g., effective prevention approved), proactively re-contact *all* participants (regardless of initial "no") with updated information and a clear opportunity to opt-*in* to disclosure.  
  *   **Mandatory Genetic Counseling:** For participants who *did* opt-in and receive an APOE4 homozygous result, disclosure must occur **only** through certified genetic counseling to address psychological impact, familial implications, and current lack of interventions.  
  *   **Education for "No" Participants:** Provide general educational materials about Alzheimer's research and risk factors *without* disclosing individual results.  

  **Vote:** The Subcommittee recommends adoption of this policy (Respect Opt-Out / Threshold = Actionability / No Relative Disclosure) by a majority vote.
