  I recall that behavioral economics addresses this through concepts like time inconsistency and hyperbolic discounting. People might value long-term rewards but succumb to immediate gratification. The website blocker example is key here—it's a precommitment strategy to align future actions with present intentions. That suggests the user does value writing, but their "present self" overrides their "future self" when temptation strikes.

  The friend's point about each moment having its own preference is valid but incomplete. It ignores how humans are temporally extended beings. Philosophers like Harry Frankfurt discuss higher-order desires: the desire to have certain desires. The user's frustration about wanting to want writing fits this model. 

