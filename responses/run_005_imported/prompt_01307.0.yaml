answer: |-
  Your friend's argument draws from **revealed preference theory** in economics, which asserts that choices *reveal* true preferences because actions speak louder than words. While logically coherent, this view is reductionist and ignores key insights from psychology, philosophy, and behavioral economics. Here’s why her stance oversimplifies human motivation and why your intuition holds merit:

  ### 1. **The Problem of "Multiple Selves" Over Time**  
     Your friend treats each decision in isolation, but humans exist across time. Philosophers like **Derek Parfit** and economists like **Thomas Schelling** argue we have **competing selves**:  
     - Your **"planning self"** (installing the blocker) values long-term goals (finishing your book).  
     - Your **"impulsive self"** (scrolling at 9 PM) prioritizes immediate gratification.  
     Neither is "fake"—both reflect genuine aspects of your preferences. But your *strategic action* (the blocker) proves your planning self actively fights your impulsive self to align behavior with deeper values.  

  ### 2. **Higher-Order Preferences**  
     Philosopher **Harry Frankfurt** distinguishes:  
     - **First-order desires**: "I want to scroll TikTok."  
     - **Second-order desires**: "I *want to want* to write more than I want to scroll."  
     Your frustration stems from a conflict between these levels. When you say "writing is my priority," you’re describing a second-order desire—a preference *about* your preferences. Your choices fail to reflect this not because it’s illusory, but because willpower is finite.  

  ### 3. **Self-Binding as Evidence of True Preference**  
     Your website blocker isn’t just a past whim—it’s a **commitment device** (a concept from behavioral economics). People use these precisely when they *know* their future selves will act against their deeper values. Examples:  
     - Odysseus tying himself to the mast to resist the Sirens.  
     - Addicts locking away drugs.  
     These acts reveal a *meta-preference*: "I value my long-term goal so much that I restrict future choices."  

  ### 4. **Cognitive Biases and Self-Deception**  
     Your friend claims "nobody can be mistaken about their priorities," but psychology disproves this:  
     - **Present bias**: We overweight immediate rewards (e.g., dopamine from scrolling) vs. distant rewards (book completion).  
     - **Akrasia** (weakness of will): Acting against one’s better judgment, as described by Aristotle.  
     - **Cognitive dissonance**: Claiming a preference to reduce guilt while acting otherwise.  
     These aren’t "flattering stories"—they’re measurable psychological phenomena.  

  ### 5. **The Flaw in "Choice = Preference"**  
     If choices *always* revealed true preferences, we couldn’t explain:  
     - Addiction (choosing substances while valuing health).  
     - Procrastination (choosing distractions while valuing productivity).  
     - Regret ("I chose X, but I *wish* I’d chosen Y").  

  ### A Defensible Middle Ground
  Your true preference isn’t *either* your actions *or* your stated goal—it’s the tension between them. **Economist Amartya Sen** reconciles this:  
  > *"Choice functions reflect not just preferences, but also the process of choice, self-scrutiny, and the values we aspire to uphold."*  

  **In your case**:  
  - **Your choices reveal** that scrolling/reading is more *tempting* in the moment.  
  - **Your blocker and frustration reveal** that writing is more *meaningful* to your long-term identity.  

  ### Practical Steps to Bridge the Gap
  1. **Reframe "preference" as a hierarchy**: Acknowledge your conflict instead of judging yourself.  
  2. **Strengthen commitment devices**: Use stricter blockers, schedule writing *sessions* (not goals), or join a writing group for accountability.  
  3. **Reduce friction**: Make writing easier (e.g., open your document first thing in the evening).  
  4. **Track progress**: Small wins (e.g., 200 words/day) build momentum that can outweigh instant gratification.  

  **Conclusion**: Your friend is right that choices *reveal* something real, but wrong to dismiss aspirational preferences as self-deception. The disconnect you feel isn’t hypocrisy—it’s a universal struggle between immediate desires and enduring values. Your blocker isn’t proof of a "past preference"; it’s proof you’re fighting to align your actions with the person you want to become. That battle *is* your true priority.
