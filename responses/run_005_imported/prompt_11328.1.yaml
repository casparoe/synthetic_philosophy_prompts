  Also, the user mentions the saved kids will "on average end up living harder lives." That's crucial. The wellbeing calculation assumes saving a life inherently adds positive value, but if their future is overwhelmingly bleak, does that hold? Maybe the charity's impact isn't just adding life-years but transforming trajectories—malnutrition rescue might include follow-up care that changes outcomes.

  The friend's numbers might overlook ripple effects too. Helping healthier kids thrive could uplift whole families or communities, while emergency aid might be more siloed. But without data, that's speculative. 

