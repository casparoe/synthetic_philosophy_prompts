  First, I need to recall both arguments. Kripke's paradox, based on Wittgenstein, questions how past behavior or mental states determine meaning. For example, when someone says "plus," how do we know they meant addition and not "quus" (which gives different results for numbers ≥57)? The skeptic argues there's no fact that fixes the correct meaning. Kripke's solution involves communal practices rather than individual mental states.

  Quine's indeterminacy of translation, from "Word and Object," argues that translation between languages is underdetermined by behavior. The "gavagai" example shows that a native's utterance could mean "rabbit," "undetached rabbit part," etc., with no behavioral evidence to decide. Quine sees meaning as tied to stimulus conditions, leading to multiple possible manuals.

