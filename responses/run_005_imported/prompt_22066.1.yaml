  - The karmic responsibility problem over time gaps in consciousness

  Vasubandhu should counter with:
  - The causal chain explanation
  - Problems with positing an indefinable pudgala
  - How labeling functions without ontological commitment

  But crucially, he should acknowledge the Pudgalavadin's points as reasonable concerns rather than dismissing them. The dialogue needs genuine tension - maybe end in stalemate with mutual respect.

  I'll structure it as:
  1) Opening positions
  2) Memory debate (Pudgalavadin presses "whose memory?" issue)
