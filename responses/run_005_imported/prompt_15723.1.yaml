answer: |-
  Your instinct to question the "separate compartments" approach is wise—Sidgwick's ethical philosophy and psychical research were profoundly interconnected, forming a single, desperate line of reasoning. Flattening this connection risks missing the tragic, driven core of his intellectual life. Here's why and how to deepen your portrayal:

  1.  **The Unresolved Agony in *The Methods of Ethics*:**
      *   Sidgwick's masterpiece meticulously analyzed three "methods" of ethics: Intuitionism (common-sense morality), Egoistic Hedonism (maximize one's own pleasure), and Utilitarianism (maximize the general happiness).
      *   His devastating conclusion was the **"Dualism of Practical Reason."** He found Utilitarianism rationally compelling for determining *what is right*, but Egoism rationally compelling for determining *what it is reasonable for an individual to do*.
      *   Crucially, he could find **no rational reconciliation** between the demands of duty (Utilitarianism) and self-interest (Egoism) within the confines of *this* life. Reason dictated two potentially conflicting ultimate principles. This was paralyzing.

  2.  **Psychical Research as the *Only* Potential Solution:**
      *   Sidgwick didn't turn to psychical research *after* his "real" philosophy ran its course; he turned to it *because* his philosophy hit this seemingly insurmountable wall. The "real work" was fundamentally *unfinished* without resolving the Dualism.
      *   **Survival Hypothesis:** If consciousness survives bodily death, then the time horizon for self-interest radically expands. Actions sacrificing self-interest in *this* life (as Utilitarianism often demands) could be rationally justified if they lead to greater personal happiness (or avoidance of misery) in an *after*life. Duty and self-interest *could* be reconciled.
      *   **Divine Governance Hypothesis:** Evidence for survival could also imply a universe governed by a moral order (a just God). This would provide a cosmic guarantee that duty and self-interest ultimately coincide, even if the mechanisms aren't fully clear in *this* life. The "Egoistic Principle" could be subsumed under a divine Utilitarianism.
      *   **The Stakes:** This wasn't a hobby; it was an existential quest for the very foundation of ethics. Without evidence for survival or a moral order, Sidgwick feared his rigorous ethics led to a bleak, rationally fragmented universe where morality might be ultimately irrational. As he famously wrote, "The prolonged effort of the [Ethics] has thrown me into a state of moral scepticism."

  3.  **The Connection is Substantive, Not Just Psychological:**
      *   The psychical research wasn't just "private consolation"; it was the **empirical investigation** required to potentially *validate* the premises needed to resolve the central problem of his ethical system. His treatise logically *demanded* this investigation if ethics was to be rationally coherent.
      *   **Hope vs. Conviction:** Sidgwick approached psychical research with profound *hope*, born of desperation, but not with *credulity*. He *wanted* to believe because his ethics needed it, but his philosophical rigor demanded proof. This tension is crucial.

  4.  **"Credulous" is Fundamentally Wrong: Rigor in the Darkened Rooms:**
      *   Sidgwick, his wife Eleanor Balfour, and key SPR figures like Edmund Gurney and Frederic Myers were **hyper-skeptical investigators**. Their methodology was explicitly modeled on scientific inquiry and legal evidence-gathering.
      *   **Key Aspects of their Method:**
          *   **Fraud Detection:** They became expert in uncovering trickery, developing controls (holding mediums' hands, using sealed rooms, searching participants).
          *   **Cross-Verification:** Meticulously comparing notes from multiple observers immediately after séances.
          *   **Documentation:** Creating vast archives of case studies (like the *Census of Hallucinations*), demanding corroborating testimony, seeking out natural explanations first.
          *   **Statistical Analysis:** Pioneering the use of statistics in psychical research (e.g., assessing the probability of coincidental death-coincidences).
          *   **Critical Publication:** Publishing detailed, critical reports in SPR *Proceedings* and *Journals*, including exposures of fraud and failed experiments. Sidgwick himself often concluded reports with profound skepticism about the evidence obtained.
          *   **Epistemic Humility:** They constantly acknowledged the fallibility of human testimony and perception. Sidgwick famously said the field required "an infinite capacity for doubting and being bored."
      *   **The Painful Result:** Despite decades of effort, Sidgwick died largely unconvinced by the evidence. He found much fraud, much wishful thinking, and intriguing but inconclusive phenomena. The empirical solution to the Dualism remained elusive. This failure was a source of deep personal and intellectual anguish.

  **Implications for Your Novel:**

  *   **Drop the "Separate Compartments":** Instead, show the **haunting presence of the Dualism** during his daytime writing. His revisions aren't just academic; they're shadowed by the terrifying void his own logic has uncovered. The treatise feels incomplete, its foundations shaky.
  *   **Show the Psychical Research as Driven by Philosophy:** His nightly vigils aren't an escape *from* philosophy, but a desperate continuation *of* it by other, empirical means. Frame his note-taking not as credulous recording, but as a philosopher-scientist rigorously testing a hypothesis crucial to his life's work. He *hopes* for evidence, but his *method* demands skepticism. Show his disappointment, his moments of near-conviction followed by crushing doubt when fraud is exposed.
  *   **Highlight the Methodological Rigor:** Show the *process* of investigation: the planning of controls, the careful interrogation of witnesses, the tedious cross-checking of notes, the arguments *within* the SPR circle about evidence standards, the moments of exposing fraud. This rigor makes the *lack* of conclusive proof more poignant, not less.
  *   **Embrace the Tragic Irony, Not the Quiet Irony:** The irony isn't just that a logician hunts ghosts. The deeper, tragic irony is that the most rigorous philosopher of his age was driven by his own devastating logic to spend decades in darkened rooms seeking proof he could never find, all to save the rational foundation of morality. His brilliance condemned him to this quest.
  *   **"Credulous" vs. "Desperately Hopeful":** Portray him not as gullible, but as a man torn between profound intellectual despair (the Dualism) and a desperate, rigorously tested hope (psychical evidence). His nightly work is an act of disciplined, almost grim, intellectual courage in the face of potential cosmic meaninglessness.

  **In essence:** Sidgwick's psychical research wasn't a separate life or a lapse in judgment; it was the direct, necessary, and tragically unresolved empirical corollary to the most profound problem in his masterwork. Portraying this deep connection, the driving *despair* behind the hope, and the rigorous methodology *despite* the hope, will give your protagonist far greater depth, tragedy, and intellectual coherence than the compartmentalized approach. Show the philosopher *in* the séance room, relentlessly applying his critical mind to the only question that could save his ethical system.
