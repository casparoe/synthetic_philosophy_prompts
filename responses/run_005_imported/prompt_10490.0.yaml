answer: |-
  Here's a systematic breakdown of Naomi's and Owen's moves, scored individually with reasoning. The JSON scorecard is followed by a detailed analysis of each step and substantive omissions.

  ### JSON Scorecard
  ```json
  {
    "1": 1,
    "2": 1,
    "3": 2,
    "4": 0.5
  }
  ```

  ---

  ### Analysis of Moves
  **Key:**  
  - **Naomi's Move 1 (Score: 1)**  
    *Claim:* Avoidance of slurs even in mention contexts supports prohibitionism (offense targets word-forms, not communicated content).  
    *Verdict:* **Partially right, but incomplete.**  
    - **Strength:** Correctly identifies that offense persists under mention (e.g., "‘n-word’ is offensive" remains taboo). This *is* predicted by prohibitionism, which treats slurs as prohibited lexical items regardless of context.  
    - **Weakness:** Fails to acknowledge that conventional implicatures (CIs) or presuppositions *also* project through mention/embedding (e.g., "‘damn’ is offensive" doesn’t lose its CI of offensiveness). Owen rightly notes this doesn’t discriminate between theories.  

  **Owen's Move 1 (Score: 1)**  
    *Claim:* Projection in mention contexts is equally predicted by CI/presupposition theories, so it doesn’t favor prohibitionism.  
    *Verdict:* **Largely correct, but underspecified.**  
    - **Strength:** Accurate about projective content. Slurs modeled as CIs (e.g., Potts 2007) or presuppositions (e.g., Schlenker 2007) *do* project through quotation/mention, as their offensiveness isn’t canceled in embeddings. This neutralizes Naomi’s initial argument.  
    - **Weakness:** Doesn’t address why *only* slurs (not other projective content) trigger universal typographic avoidance in academia. The data isn’t theory-neutral after all.  

  **Naomi's Move 2 (Score: 2)**  
    *Claim:* Asymmetry with taboo words (e.g., swear words printed in phonology papers) suggests social practice, not semantics, drives slur avoidance.  
    *Verdict:** **Strong and decisive.**  
    - **Strength:** Highlights a fatal flaw in Owen’s equivalence claim. Linguists routinely print taboo words (e.g., "fuck" in phonology studies) without euphemisms, despite their projective offensiveness. If semantics alone explained slur avoidance, taboo words should behave identically. The asymmetry implies social/political norms specific to slurs are doing the work, aligning with prohibitionism’s emphasis on community-wide prohibitions.  
    - **Weakness:** Minor overstatement—some taboo words *are* occasionally softened (e.g., "f-word"), but the asymmetry with slurs is stark and consistent.  

  **Owen's Move 2 (Score: 0.5)**  
    *Claim:* Hom-style theories explain the asymmetry: slurs encode discriminatory histories, unlike generic taboo words.  
    *Verdict:** **Plausible but inadequate.**  
    - **Strength:** Correctly notes Hom’s theory (where slurs conventionally encode oppressive ideologies) distinguishes them from generic taboo words. This *could* explain why only slurs receive kid-glove treatment: their content is uniquely tied to systemic harm.  
    - **Weakness:**  
      - Doesn’t explain *why* this historical content leads to typographic avoidance *even in formal mention*. If offense is semantic (e.g., a CI), printing the word in a technical gloss shouldn’t trigger harm—yet academia universally avoids it.  
      - Hom’s theory predicts offense arises from *using* the term with its derogatory content, not *mentioning* it neutrally. Avoidance in mention suggests an additional layer of prohibition.  
      - **Empirical gap:** Fails to explain why non-slur terms with similar histories (e.g., archaic medical slurs) don’t always receive identical treatment.  

  ---

  ### What Both Missed: Substantive Omissions
  1. **Institutional Safeguarding:** Academia avoids printing slurs partly to protect readers (especially targeted groups) from harm, reflecting ethical norms beyond semantics. Prohibitionism captures this; CI theories struggle.  
  2. **Meta-Linguistic Awareness:** Avoidance may signal recognition that slurs *reinscribe* harm when reproduced, even mentioned. This aligns with Judith Butler’s work on performativity.  
  3. **Theoretical Hybridity:** Hom’s combinatorial externalism *could* incorporate prohibitionist elements (e.g., conventions enforcing word-form restrictions), but neither explores synthesis.  
  4. **Cross-Cultural Variation:** Typographic avoidance isn’t universal. Some non-Anglophone journals print slurs in philosophical contexts, suggesting cultural norms > semantic universals.  

  ### Conclusion
  - **Naomi wins the exchange overall** (her Move 3 is decisive), but Owen correctly forces nuance.  
  - **Prohibitionism better explains the data:** Typographic avoidance reflects social prohibitions on word-forms, not just projective content. The taboo-word asymmetry undermines purely semantic accounts.  
  - **Hom-style theories need supplementation:** They explain *why* slurs are offensive but not why academia avoids *mentioning* them—prohibitionism fills this gap.  

  Would you like a deeper dive into how prohibitionism/Hom could be reconciled, or analysis of specific papers?
