  Hmm... the marine biology background might help. Maybe compare species classification? Two biologists might call the same creature a "counterpart" for different purposes (migration vs genetics), just like context determines Humphrey's counterparts. But is that satisfying? Probably not - marine species have objective traits, while "relevance" feels subjective. 

  The user's suspicion that this relocates the problem seems spot-on. If "Humphrey could've won" depends on whether we care about his nose shape today, that doesn't feel like modal truth. But Lewis would argue that's how language works everywhere - "tall" depends on context too. 

  ...Still, Kripke would say modal claims aren't like "tallness." Possible worlds should ground necessities, not social conventions. I should emphasize Lewis's trade-off: he sacrifices Kripkean rigidity to keep worlds concrete and isolated. It's a package deal. 

  The marine biologist might appreciate that - biologists know taxonomy involves trade-offs between different useful frameworks. No perfect system, just fit-for-purpose. But does that answer their worry? Only if they buy Lewis's whole metaphysical framework. 

