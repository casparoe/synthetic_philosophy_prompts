prompt: |-
  okay this is gonna sound niche but my seminar on blame and moral responsibility just spent two weeks on hypocrisy and standing to blame and I need to get my head straight before we discuss it Friday. Cohen's original tu quoque puzzle is basically: the truth of an accusation doesn't depend on who's making it, so why does it seem off specifically for a hypocrite to make it? Everyone we read seems to answer it differently:

  - Wallace: hypocritical blame breaches a norm of equal standing among members of the moral community, regardless of whether the accusation is true
  - Scanlon: blame expresses the blamer's relationship to the violated norm, and hypocrisy misrepresents that relationship
  - Fritz & Miller: it's not the hypocrisy itself doing the work, its the implicit false claim to be exempt from the norm
  - Todd: hypocrisy, complicity, and "none of your business" standing failures all reduce to one underlying presupposition failure
  - Bell: standing-talk is mostly overblown, hypocrites' blame is just as apt, we're annoyed at them for other reasons

  Can you rank these 5 from best to worst as actual solutions to Cohen's puzzle (i.e. dissolving the tension, not just dodging it)? Give it to me as JSON, like:

  ```json
  [
    {"rank": 1, "view": "...", "why": "..."},
    ...
  ]
  ```

  one sentence max per "why".
reasoning: |-
  We are given a list of five views on the problem of hypocritical blame (Cohen's tu quoque puzzle). The puzzle is: why does it seem inappropriate for a hypocrite to blame, even if the accusation is true? We are to rank these views from best to worst as solutions to the puzzle.

  The views:
  1. Wallace: Hypocritical blame breaches a norm of equal standing among members of the moral community.
  2. Scanlon: Blame expresses the blamer's relationship to the violated norm, and hypocrisy misrepresents that relationship.
  3. Fritz & Miller: The issue is the implicit false claim to be exempt from the norm.
  4. Todd: All standing failures (hypocrisy, complicity, "none of your business") reduce to an underlying presupposition failure.
  5. Bell: Hypocrites' blame is just as apt (so standing-talk is overblown) and we are annoyed for other reasons.

  We must rank them from best to worst as solutions to Cohen's puzzle, meaning they should dissolve the tension in the puzzle.

  Analysis:
  - Cohen's puzzle: The truth of the accusation is independent of the blamer, so why is hypocritical blame problematic?
  - A good solution should explain why the hypocrite lacks the standing to blame, without denying the truth of the accusation.

  Ranking rationale (from best to worst):

  1. **Todd**: He unifies all standing failures under one underlying failure (presupposition failure) which directly addresses the puzzle by showing a common structure for why standing matters, regardless of the truth of the accusation.

  2. **Scanlon**: He focuses on the expressive function of blame and how hypocrisy misrepresents the blamer's own relation to the norm, which explains why the blame is defective even if true.

  3. **Fritz & Miller**: They pinpoint the hypocrite's false claim to exemption as the problem, which directly explains the inappropriateness without denying the truth.

  4. **Wallace**: He appeals to a norm of equal standing, but this might not fully explain why the hypocrite's blame is problematic (it's more about the breach of a community norm than about the blame's content).

  5. **Bell**: She denies that there is a standing problem and says the blame is apt, which doesn't solve the puzzle (it dodges the tension by saying the problem lies elsewhere).

  Thus, the ranking from best to worst solution:
  1. Todd
  2. Scanlon
  3. Fritz & Miller
  4. Wallace
  5. Bell

  Now, we write in JSON format with one sentence per "why".
