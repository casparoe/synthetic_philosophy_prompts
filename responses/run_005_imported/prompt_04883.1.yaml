answer: |-
  ## Commencement Address: On Laws, Conscience, and the Lawyer's Calling

  Dean, esteemed faculty, proud parents, families, friends, and most importantly, the remarkable Class of [Year]:

  It is an honor to stand before you today. We gather in celebration – of your hard-earned achievements, of the intellect and resilience that brought you here, of the boundless potential you carry into the world. Yet, we gather also in a particular moment. This spring has been turbulent. Some of you, including students I had the privilege of teaching in discussions about political obligation, found yourselves arrested during campus protests. This reality hangs in the air, a complex thread woven into the fabric of this graduation.

  Some of you accepted citations without contest. Others chose a different path. And soon, remarkably soon, most of you will stand before a different authority, raise your right hand, and swear a solemn oath to uphold the laws and constitutions of this nation – the very same structures that, this spring, some felt compelled to challenge, even to disobey. It is this tension, this profound intersection of conscience, action, and the law you are about to swear to serve, that I feel compelled to address.

  Now, many parents and families here today might be thinking: "Law school speeches are usually about justice, service, maybe a funny story. What’s all this about protests and disobedience?" And you’d be right. My colleagues in the audience, steeped in legal philosophy, might be listening for a particular theorist we teach – John Rawls – and his specific criteria for when breaking the law *might* be considered a profound act of fidelity to it, rather than its rejection. So, let me try to bridge that gap.

  The truth is, the relationship between law and conscience is as old as law itself. We teach you that law is the bedrock of society – the framework that allows us to live together, resolve disputes peacefully, and build towards justice. It demands our respect, even when imperfect. **But we also teach you that law is not static, not infallible, and sometimes, tragically, it can be an instrument of injustice.**

  This creates a dilemma. What does a citizen – and especially, what does a *lawyer*, sworn to uphold the law – do when they believe a law, or a system enforcing it, is profoundly wrong? When does the act of breaking a law become not a rejection of order, but a desperate plea *for* a better, more just order? This is where the concept of **civil disobedience** enters the conversation, distinct from ordinary lawbreaking.

  Ordinary lawbreaking serves private ends – convenience, gain, anger, or disregard. It fractures the social contract without offering a vision to repair it. Civil disobedience, when it truly earns that name, is fundamentally different. It’s a public, conscientious, and deeply *political* act. Think of it like this:

  1.  **It’s a Public Appeal, Not a Private Act:** It’s done openly, not in secret. The person breaking the law *wants* to be seen, *wants* the community and its authorities to witness their act and understand the moral urgency behind it. It’s a form of communication aimed at the public conscience, saying, "This situation is so intolerable, so contrary to our shared ideals of justice, that I feel compelled to disrupt the normal order to make you see it."
  2.  **It Targets Injustice, Not Just Inconvenience:** The target isn't random. It’s focused on laws or policies perceived as deeply unjust, often where conventional political channels seem blocked or unresponsive. The act itself symbolically highlights that injustice.
  3.  **It Embraces the Cost:** This is perhaps the most crucial distinction, and the hardest part. The civil disobedient doesn’t seek to evade the law’s consequences. They *accept* the punishment. Why? Because by willingly facing the penalty, they demonstrate profound respect for the *rule of law itself*. They say: "I break *this specific law* because I believe it violates a higher principle of justice, but I submit to the legal system's authority to judge my action. My goal is not chaos, but a more perfect realization of the law's promise." Accepting punishment is a testament to their belief that the system, however flawed, can still hear their plea and correct itself. It’s a wager on the system’s capacity for self-repair.

  **This is not a get-out-of-jail-free card for any act of protest.** Not every act of lawbreaking in a cause meets these demanding criteria. The motivations matter. The methods matter. The willingness to accept the legal consequences matters profoundly. It’s a heavy burden, chosen not lightly, but as a last resort rooted in deep moral conviction about justice.

  You didn't ask for this lesson to unfold quite so vividly this spring. Some of you were directly involved; others observed. Some agreed with the methods; others disagreed. That’s the nature of a vibrant intellectual community grappling with real-world problems. What matters now is how you carry this experience forward as lawyers.

  **Because this distinction – between civil disobedience and ordinary lawbreaking – isn’t just academic philosophy. It will live at the heart of your practice.**

  *   You may represent clients who engaged in acts of protest. Understanding this framework will help you navigate their defense, their motivations, and the potential consequences they face. Was this an act of conscience meeting those stringent criteria, or something else?
  *   You may advise communities grappling with perceived injustice. You’ll need to understand the power, the risks, and the profound ethical weight of advocating civil disobedience as a tactic.
  *   You may work within the system – as prosecutors, judges, legislators, corporate counsel. You will encounter arguments rooted in claims of conscience challenging the laws you are bound to uphold or enforce. Recognizing the *potential* validity of civil disobedience, even if you disagree with a specific instance, is crucial to administering justice wisely and maintaining the system’s legitimacy. Dismissing all dissent as mere lawbreaking risks deafness to genuine cries for justice.
  *   Most fundamentally, **your oath.** You swear to uphold the law. That oath binds you to its procedures, its institutions, its fair application. But upholding the law *also* means upholding its highest purpose: justice. Sometimes, that means working tirelessly within the system to change unjust laws. Sometimes, it means zealously defending those who challenge laws based on conscience. Always, it means remembering that the law is not an end in itself, but a means to secure a more just and equitable society.

  The arrests this spring were a moment. The oath you take is a lifetime commitment. That commitment requires not just knowledge of statutes and precedents, but deep moral reasoning. It demands that you grapple with the tension between order and justice, between fidelity to the law as it is and the aspiration for the law as it ought to be.

  You leave here equipped with formidable tools: analytical rigor, persuasive power, an understanding of how systems function. Use them wisely. Use them to mend the fractures in our social fabric, not widen them. Use them to listen – truly listen – to the grievances that sometimes erupt into protest, even as you uphold the structures designed to resolve conflict peacefully. Use them to discern the crucial difference between an act that rejects law and an act that, however controversially, seeks to call law closer to its own ideals.

  Class of [Year], yours is a profound calling. You are entering a profession that holds immense power to shape lives and societies. Carry the lessons of this spring – the passion, the debate, the confrontation with law’s complexities – with you. Let them inform your understanding, but never harden your hearts or cloud your judgment. Uphold the law fiercely. Serve justice relentlessly. And never forget that the most powerful tool a lawyer possesses is an unwavering moral compass, guided by the unshakeable belief that the law, in its highest form, exists to serve human dignity.

  Congratulations. Go forth and build that more perfect union. The world needs your courage, your intellect, and your unwavering commitment to justice.
