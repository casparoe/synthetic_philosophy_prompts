answer: |-
  The candle guttered, casting nervous shadows across the séance table. Professor Alistair Vance felt, not for the first time, the profound absurdity of his position. Here he sat, grey-haired, knuckles white on the polished oak, renowned for his *Principles of Rational Benevolence*, straining to hear the faintest whisper from beyond the veil. The air hung thick with incense and desperate hope.

  Across from him, Madame Celeste, her eyes rolled back, shuddered. A faint rapping sounded beneath the table. Mrs. Pembroke gasped. Vance didn’t flinch. His gaze, honed by decades of dissecting flawed arguments and wishful thinking, scanned the dim room. He noted the slight tremor in Madame Celeste’s ankle pressed against the table leg, the almost imperceptible shift of her weight coinciding with the next *rap-rap-rap*.

  *"Is someone there?"* Mrs. Pembroke whispered, tears glistening.

  Vance cleared his throat, the sound harsh in the expectant silence. "Madame Celeste," he said, his voice calm, precise, utterly devoid of the wonder everyone else seemed to feel, "might we adjust the positioning of your feet? Merely for scientific rigor, you understand."

  The medium’s eyes snapped open, flashing annoyance before settling into wounded dignity. "Professor Vance," she sighed, the rapping ceasing instantly, "your skepticism chills the ether. The spirits shy from such... hostility."

  He’d heard variations of this refrain for twenty years. Hostility. Coldness. A lack of faith. But it wasn't hostility; it was the terrible, necessary burden of *honesty*. His life's work, his *magnum opus*, had led him here, to darkened parlours and the dubious talents of charlatans.

  **The bind was elegant, and agonizing.**

  Vance’s ethics were built on pure reason. He’d dismantled intuitionism, exposed the inconsistencies of dogmatic theology. The only coherent path, he argued, was Utilitarianism – the greatest good for the greatest number. Impartial benevolence. Yet, reason itself presented a monstrous flaw: **the Dualism of Practical Reason.**

  Why *should* a rational individual sacrifice their own undeniable good, their happiness, security, even life, for the greater good? Reason couldn't definitively prove that duty outweighed self-interest. Without some cosmic guarantee, some ultimate reconciliation, egoism remained a terrifyingly rational alternative. Virtue needed its reward, not just abstract praise, but a *real*, posthumous payoff. Otherwise, the ethical life became, potentially, a cosmic sucker’s bet.

  Hence, the Society for Metaphysical Inquiry. Hence, the séances. Not a hobby, but a desperate empirical quest. He *needed* evidence of the soul’s persistence, of a just cosmos, of the "postulate" his ethics demanded. He needed proof that the scales *were* balanced, even if mortally invisible.

  And so, he investigated. With the same meticulous rigor he applied to ancient texts and logical syllogisms. He devised controls: sealed rooms, fingerprinting instruments, pre-sitting searches, complex signalling systems. He recorded temperatures, measured draughts, noted timings. He became the Society’s most feared investigator, not because he wanted to debunk, but because he *needed* to *believe* – and only the unassailably real would suffice.

  He remembered Elena Vespera. The Society’s great hope. A Neapolitan whirlwind who levitated tables, conjured spectral hands, produced fragrant ectoplasm in full light. She’d passed every test in Europe. Vance, desperate, hopeful, had brought her to his own Cambridge study, under conditions he personally designed. Ironclad. Scientific.

  The first night was astounding. Cold breezes. Luminous forms. The scent of violets – his late wife’s favourite. His heart hammered, not with fear, but with a terrifying, fragile hope. *Could this be it? The proof?*

  Night two. Vance, positioned behind Vespera, saw it. A fraction of a second. Under the cover of a swirling drape, her foot, clad in a soft slipper, extended. Just an inch. Just enough to nudge the leg of the heavy table poised to "levitate." It was a movement born of fatigue, perhaps, or the subconscious pressure to perform. Utterly human. Devastating.

  He didn’t shout. He didn’t accuse immediately. He recorded it in his notebook, his hand steady while his soul fractured. He called for stricter controls. Night three: Vespera, visibly strained, failed spectacularly. Her tricks, exposed by Vance’s relentless protocols, seemed clumsy, pathetic. The Society was scandalized. Vespera fled Cambridge, her reputation in tatters among the very circle that had championed her. Vance’s report was a masterpiece of clinical demolition.

  He had been the instrument of her downfall. And his own.

  Now, watching Madame Celeste rearrange her skirts with exaggerated affront, Vance felt the familiar hollowness. He’d exposed another fraud. Another dead end. Another blow to the cosmic postulate. His honesty, his intellectual integrity – the very qualities that made him a formidable ethicist – were systematically dismantling the foundation his ethics required to stand against the crushing weight of rational self-interest.

  Mrs. Pembroke dabbed her eyes. "Perhaps another time, Madame Celeste? The Professor means no harm..."

  Vance rose. "My apologies for disturbing the proceedings, ladies. Madame." His voice was ash. He gathered his coat and notebook. The walk home through the damp Cambridge streets was long. His study awaited, filled with the leather-bound certainty of his ethical treatises – and the gnawing uncertainty they spawned.

  He lit a single lamp. On his desk lay the latest draft of his revised *Principles*. Chapter Twelve: *The Dualism and its Possible Resolutions*. The page was mostly blank. He stared at the empty space where the cosmic postulate should fit. He saw Elena Vespera’s desperate foot nudge the table leg. He saw Madame Celeste’s annoyed flush. He saw the endless parade of hopeful frauds and wishful thinkers, all dissolving under his relentless, necessary gaze.

  His ethics demanded proof of a just universe. His method, the only method worthy of the rational mind he championed, ensured he would likely never find it. To accept the evidence offered was to betray reason. To reject it was to potentially doom his ethical system to irrelevance.

  He picked up his pen, the instrument of both his scholarship and his despair. He wrote a single line beneath the chapter heading: *"The search continues, though the light grows dim."* He underlined it. Not a resolution. Not a defeat. Just the stark, honest record of the trap. His honesty was the lock. His need was the key. And they fit together perfectly, turning only to tighten the bind. The lamp flickered, casting long, wavering shadows that offered no answers, only the echo of his own, meticulously reasoned, solitude.
