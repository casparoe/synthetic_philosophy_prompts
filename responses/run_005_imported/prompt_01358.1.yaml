  For names: "Aldous Thorne" sounds suitably Victorian-scholarly. "Elena Vespera" for the medium—hints at "evening star" (twilight, illusion). The SPR equivalent will be "The Society for Metaphysical Inquiry" to avoid direct baggage. 

