prompt: |-
  I convene a small, biweekly reading group on formal ethics and social choice theory with a handful of my graduate students, and we spent our last two sessions working line by line through Harsanyi's 1955 aggregation theorem: the result that if every individual's preferences over lotteries satisfy the von Neumann-Morgenstern axioms, if the social ranking over those lotteries satisfies them as well, and if the two agree whenever every individual is indifferent between two prospects, then the social utility function must be a constant plus a weighted sum of the individual utility functions. Afterward, two of my students, Marcus and Elif, fell into an extended disagreement over coffee about what the theorem actually establishes, one that ran long enough that we never got back to the applications I had planned for that day. I've reconstructed their exchange as faithfully as I can below; both were arguing in good faith, and neither budged.

  (1) Marcus said the theorem is close to a proof of utilitarianism for anyone who accepts expected-utility rationality: you don't get to keep the von Neumann-Morgenstern axioms for individuals and for society, plus a bare unanimity condition, and still reject some form of weighted-sum aggregation -- maximin and other social welfare functions that aren't additively separable across people are simply off the table for anyone who accepts the premises. (2) Elif objected that this oversells the result: the individual utility functions in the proof are von Neumann-Morgenstern functions, pinned down only up to each person's own arbitrary risk-scaling, not to anything that measures how well their life is actually going, and -- as Sen pointed out -- the specific weights the proof extracts change if you rescale any individual's utility function, which you are always free to do without changing that person's actual preferences over gambles. Real utilitarian weights shouldn't be an artifact of which representative function you happened to write down, so what the theorem hands you is a fact about risk attitudes wearing the costume of welfare. (3) Marcus replied that this is a complaint about the label 'utilitarianism,' not about the force of the constraint: call u_i whatever you like, the theorem still forces the social ranking to be some affine combination of the individual rankings, and that already rules out plenty of positions people actually hold. (4) Elif came back with a case she said doesn't depend on any interpretive dispute at all: take two candidates with a perfectly symmetric claim on one scholarship, equal in every respect the theorem could care about, so that they get equal weight. Run that through the affine form the theorem delivers, and giving the scholarship to A outright, giving it to B outright, and flipping a coin to decide are all exactly tied. But almost nobody actually thinks that: the coin flip is the only one of the three that gives each candidate a fair shot instead of picking a winner by fiat, and a theorem whose own conclusion can't tell 'flip fairly' apart from 'arbitrarily favor A' has lost something real about fairness. (5) Marcus answered that nothing is lost if the case is told honestly: if the candidates genuinely care about the fairness of the procedure and not only about who wins, that preference belongs in their von Neumann-Morgenstern utility functions from the outset, at which point they are no longer indifferent among the three options and the tie disappears -- you don't get a real counterexample by quietly changing what's in the utility function partway through the example. (6) Elif answered that this move saves the theorem by emptying it: if any ethical consideration can always be relocated into 'what the utility function really contains' whenever it's needed, then Pareto indifference was never the thin premise it was advertised as, and the theorem has been rendered compatible with anything -- which is not the same as having been defended.

  Please adjudicate this move by move rather than simply declaring a winner. Begin with a JSON object scoring each numbered turn from -2 (clearly mistaken) to 2 (clearly right) -- {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>, "6": <score>} -- and briefly justify each score. Then, separately: tell me whether Elif's objection in (2) is really the same objection as her objection in (4), or whether these are two independent problems for Harsanyi's theorem that this exchange happens to run together; tell me whether Marcus's move in (5) genuinely rescues ex-ante Pareto indifference as a premise, or whether Elif's response in (6) shows that no such rescue is available without depriving the premise of the work it was supposed to do; and finally, tell me whether there's something both of them are overlooking that you think the literature on this theorem ought to have brought up by now.
reasoning: |-
  We are adjudicating a debate between Marcus and Elif about Harsanyi's aggregation theorem. The theorem states that, under certain conditions (individual and social preferences satisfying the von Neumann-Morgenstern axioms, and Pareto indifference), the social utility function must be an affine combination (constant plus weighted sum) of individual utility functions.

  We are to score each move from -2 (clearly mistaken) to 2 (clearly right) and then answer three specific questions.

  Let's break down each numbered move:

  1. **Marcus (1)**: He claims the theorem is close to a proof of utilitarianism for those who accept expected-utility rationality. He argues that if you accept the VNM axioms for individuals and society plus Pareto indifference, then you must accept a weighted-sum aggregation, ruling out maximin and other non-additively separable social welfare functions.

     This is a standard interpretation. The theorem does show that the social welfare function must be affine (which in the context of VNM is linear in the utilities). However, note that the weights are not necessarily equal and are determined by the representation. Also, the theorem does not require interpersonal comparability. So, it is a form of weighted utilitarianism, but not necessarily classical utilitarianism (which assumes equal weights and interpersonal comparability). Marcus is right that it rules out many non-linear social welfare functions. But he may be overselling by calling it "close to a proof of utilitarianism" without caveats.

     Score: 1 (mostly right but with some oversimplification)

  2. **Elif (2)**: She objects that the individual utility functions are VNM functions, which are unique only up to affine transformations. Therefore, the weights change if you rescale an individual's utility function. Since the weights are arbitrary (depending on the chosen representation), they don't represent real welfare weights. She cites Sen, who made this point.

     This is a valid and well-known criticism. The weights in Harsanyi's theorem are not invariant to the scaling of individual utilities. Therefore, the theorem does not provide a unique weighting for utilitarianism without additional assumptions (like interpersonal comparability). Elif is correct that the theorem does not give us a unique social welfare function in terms of welfare levels.

     Score: 2 (clearly right, standard point)

  3. **Marcus (3)**: He replies that the complaint is about the label, not the constraint. He emphasizes that the theorem forces the social ranking to be an affine combination, which rules out many positions (like maximin). So even if we don't call it utilitarianism, it is a strong constraint.

     This is also a valid point. The theorem does require that the social ordering is linear in the individual utilities (in the VNM sense). So it does rule out non-linear social welfare functions. The fact that the weights are arbitrary doesn't change that the functional form is linear. However, without fixed scales, the weights are arbitrary and the social ordering is not uniquely determined. But the constraint on the functional form remains.

     Score: 1 (mostly right, but note that without fixed scales the social ordering is not uniquely determined by the individual orderings alone)

  4. **Elif (4)**: She presents a case: two symmetric candidates for a scholarship. The theorem (with equal weights) would rank giving to A, giving to B, and flipping a coin as indifferent. But, she argues, almost nobody thinks that: flipping a coin is fair while arbitrarily picking A is not. So the theorem fails to capture fairness.

     This is a different objection. She is pointing out that the theorem, by requiring indifference in this symmetric case, fails to account for procedural fairness. However, note that in the theorem, if the individuals are indifferent between the outcomes, then by Pareto indifference the society must be indifferent. But in her example, the individuals might care about the procedure? She assumes the candidates are symmetric in every respect the theorem cares about, meaning that the individuals (the candidates) are indifferent among the three options? But if the candidates care about fairness, then they are not indifferent. So the example might be misstated.

     However, if we interpret the example as the two candidates having preferences only over who wins (and being indifferent to the procedure) then the theorem does require society to be indifferent. But if society (or the candidates) care about the procedure, then that must be included in the description of the outcomes. So this example might be challenging the assumption that the outcomes are described only in terms of who wins, without including the procedure.

     Score: 0 (the point is valid in that the theorem does not account for procedural fairness if the individuals don't, but it may be addressed by redefining the outcomes to include the procedure)

  5. **Marcus (5)**: He responds that if the candidates care about fairness, then that should be included in their VNM utility functions from the start. Then they would not be indifferent, and the tie would break. So the example is not a counterexample if we fully specify the utility functions.

     This is a standard defense. In the VNM framework, the description of the outcomes must include everything that the individuals care about. If they care about the procedure, then the lottery must be defined over outcomes that include the procedure. Then, if they have a preference for fairness, they would not be indifferent between a coin flip and arbitrarily picking A. Therefore, Pareto indifference would not require society to be indifferent.

     This move seems to save the theorem. But note: if we include the procedure in the outcome, then the lottery is over these richer outcomes. The theorem then applies without a problem.

     Score: 2 (clearly right, the example was incomplete in its specification of the outcomes)

  6. **Elif (6)**: She replies that this move saves the theorem by emptying it. If any ethical consideration (like procedural fairness) can be relocated into the utility function, then Pareto indifference is no longer a thin premise because it requires that society be indifferent only when every individual is indifferent, but now the individuals are never indifferent if we include every ethical consideration in their utilities. So the theorem becomes compatible with anything because we can always define the utilities to avoid indifference.

     This is a deeper point. The worry is that by expanding the description of outcomes to include all morally relevant features, we might make Pareto indifference too easy to satisfy (because individuals will rarely be indifferent) or too hard (because we have to include everything). But note: the theorem requires that if every individual is indifferent between two lotteries, then society must be indifferent. If we include all relevant features in the outcomes, then when individuals are indifferent, society must be. But if there is a social concern that is not captured by any individual's utility (like a fairness concern that is purely social), then Pareto indifference might not capture it. However, Harsanyi's theorem assumes that social preferences are based solely on individual preferences. So if there is a social concern that is not reducible to individual concerns, then the theorem does not account for it.

     Elif's point is that if we allow arbitrary expansion of the outcome space to include any feature that might break indifference, then we can always avoid the situation where Pareto indifference applies. But that doesn't make the theorem empty: it still forces the social welfare function to be linear in the individual utilities when the individuals are indifferent. However, if we require that the individuals must be indifferent only when they are truly indifferent in every respect, then the condition is not vacuous. But if we interpret the outcome space too narrowly, we get counterexamples; if we interpret it too broadly, we might make the condition hard to satisfy. But the theorem is still a constraint: when individuals are indifferent (in the full outcome space), society must be.

     However, note that the theorem does not allow for externalities or for preferences about the social state that are not captured by the individual's own consumption. In the scholarship example, if the candidates care about the fairness of the procedure, then including that in the outcome is appropriate. If they don't, then why should society care? But if society cares even when the individuals don't, then that violates the Pareto condition. So Elif's objection is that the theorem assumes that all social concerns are reducible to individual concerns. If there are irreducible social concerns, then the theorem cannot capture them.

     Score: 1 (partly right, but the theorem is not empty: it still imposes a strong constraint when the individuals are indifferent. However, it is true that the theorem does not account for social values that are not derived from individual preferences.)

  Now, let's assign scores:

  - Move (1): Marcus is mostly right but oversimplifies by calling it a proof of utilitarianism without noting the scaling issue. Score: 1
  - Move (2): Elif is correct about the scaling issue. Score: 2
  - Move (3): Marcus correctly points out that the functional form is constrained. Score: 1
  - Move (4): Elif's example is initially compelling but can be addressed by redefining outcomes. Score: 0 (it's a valid concern but not a knockout)
  - Move (5): Marcus's response is correct: the example should include the procedure in the outcomes. Score: 2
  - Move (6): Elif's point is that the move in (5) might make the Pareto condition too weak, but it doesn't render the theorem empty. The theorem still has force. However, it highlights a limitation: the theorem assumes that all relevant information is in the individual utilities. Score: 1 (partly right)

  Scores in JSON:

  {"1": 1, "2": 2, "3": 1, "4": 0, "5": 2, "6": 1}

  Now, the additional questions:

  1. **Are Elif's objections in (2) and (4) the same or independent?**
     They are independent. The objection in (2) is about the arbitrariness of the weights due to the lack of interpersonal comparability. The objection in (4) is about the theorem's failure to capture procedural fairness (if the individuals don't care about it). The first is about the interpretation of the weights and the second is about the content of the outcomes.

  2. **Does Marcus's move in (5) rescue ex-ante Pareto indifference without depriving the premise of its force?**
     Marcus's move in (5) does rescue Pareto indifference by requiring that the outcome space includes all relevant features (like the procedure). This does not deprive the premise of its force. It ensures that when we say individuals are indifferent, we mean they are indifferent in every aspect that matters. Therefore, if the individuals are truly indifferent (including about the procedure), then society must be. If they are not, then the tie is broken by their preferences. However, if there is a social concern for fairness that is not reflected in any individual's utility (e.g., if the society cares about fairness even when the individuals do not), then the theorem does not account for that. But the Pareto condition is meant to reflect individual preferences. So, in the context of the theorem, the move in (5) is valid and does not empty the premise. The premise still requires that when all individuals are indifferent, society must be. The force remains because we are now considering the full outcome space.

  3. **Is there something both are overlooking?**
     Both are overlooking the possibility of interpersonal utility comparisons. Harsanyi's theorem does not require interpersonal comparisons, but if we allow them (by fixing the scales of the individual utility functions), then the weights become meaningful. This is the direction taken by Harsanyi in his later work and by others (e.g., using extended preferences). Also, there is a literature on how to incorporate fairness concerns within the framework, such as by using original positions or veil of ignorance, which Harsanyi also considered. Moreover, the theorem is often discussed in the context of social choice with uncertainty, and there are extensions that account for fairness (e.g., by Diamond, who criticized Harsanyi for not allowing ex-post fairness). Diamond's example shows that even if two individuals have symmetric preferences, we might prefer a fair lottery for reasons that are not captured by the ex-ante Pareto principle. This is related to Elif's point (4). But note that in Diamond's example, the individuals are ex-ante indifferent but the society might not be because of ex-post fairness. That directly challenges the ex-ante Pareto condition. So, a key point that might be missing is the debate between ex-ante and ex-post fairness and whether the ex-ante Pareto condition should be relaxed.
