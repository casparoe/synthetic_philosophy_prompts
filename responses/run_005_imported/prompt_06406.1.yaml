  We are going to create a new example of the doctrinal paradox (discursive dilemma) in a different context: a hiring committee.

  Scenario:
  A company has a hiring committee of three members (Alice, Bob, and Charlie) who are evaluating a candidate for a job. The company policy states that they should hire a candidate only if the candidate meets two criteria:
  1. The candidate has strong technical skills (Premise A).
  2. The candidate has good communication skills (Premise B).

  The conclusion (Hire) is true only if both Premise A and Premise B are true.

  Now, let's set up the individual votes:

  - Alice believes: 
     - Premise A (technical skills): Yes (the candidate has strong technical skills)
     - Premise B (communication skills): No (the candidate does not have good communication skills)
     - Therefore, by the rule, she votes No on Hire.

  - Bob believes:
     - Premise A: No (the candidate lacks strong technical skills)
     - Premise B: Yes (the candidate has good communication skills)
     - Therefore, he votes No on Hire.

  - Charlie believes:
     - Premise A: Yes (strong technical skills)
     - Premise B: Yes (good communication skills)
     - Therefore, he votes Yes on Hire.

  Now, we have two procedures:

  1. Premise-based procedure: 
     - We take a majority vote on each premise independently and then apply the rule.
     - Premise A (technical skills): 
          Alice: Yes, Bob: No, Charlie: Yes -> Majority: Yes (2-1)
     - Premise B (communication skills):
          Alice: No, Bob: Yes, Charlie: Yes -> Majority: Yes (2-1)
     - Therefore, applying the rule: Hire = Premise A AND Premise B -> Yes AND Yes = Yes -> Hire.

  2. Conclusion-based procedure:
     - Each member votes on the conclusion (Hire) based on their own evaluation of the premises.
     - Alice: No, Bob: No, Charlie: Yes.
     - Majority vote on Hire: No (2-1).

  So, the premise-based procedure yields "Hire" (Yes) and the conclusion-based procedure yields "Do not hire" (No). They conflict.

  Explanation of the paradox:

  The paradox arises because the majority opinion on the premises (which individually are each supported by a majority) leads to a conclusion that is not the same as the majority opinion on the conclusion itself. This happens because the logical connection between the premises (here, an AND condition) is not respected in the conclusion-based procedure when aggregating the premises. In the conclusion-based procedure, the majority vote on the conclusion does not require a majority on both premises. Instead, it aggregates the final decisions without regard to the underlying reasons. The premise-based procedure, however, respects the logical structure but may lead to a collective judgment that no individual holds (in this case, no individual thought both premises were true and then also thought the conclusion was true? Actually, Charlie did, but the collective premises lead to the same conclusion as Charlie's). The key is that the majority on each premise does not correspond to the majority on the conclusion because the conclusion requires agreement on both premises simultaneously.

  The structural issue is that majority voting is applied to each premise independently, which can lead to a set of collectively accepted premises that no individual accepted (but note: in this example, the collective premises are the same as Charlie's, but the problem is that the two methods yield different results). The deeper point is that the aggregation of individual judgments on connected propositions may not be consistent with the aggregation of the conclusions drawn from those propositions.

  Optional side-question: Relation to Arrow's theorem.

  The doctrinal paradox is indeed related to Arrow's Impossibility Theorem. Arrow's theorem shows that no voting system can convert the ranked preferences of individuals into a community-wide ranking while satisfying a set of reasonable criteria (when there are three or more options). The doctrinal paradox, on the other hand, deals with the aggregation of judgments on logically interconnected propositions. Both reveal difficulties in aggregating individual opinions into a collective decision. The doctrinal paradox can be seen as a judgment aggregation version of the same kind of impossibility: there may be no way to aggregate individual judgments on premises and a conclusion in a way that simultaneously satisfies logical consistency, respect for individual judgments, and independence conditions. In fact, there are impossibility theorems in judgment aggregation (like the List-Pettit theorem) that are direct analogs of Arrow's theorem. So the comparison is not misleading; they are part of the same family of results about the challenges of collective decision-making.
answer: |-
  Here's a fresh example set in a **sports rules committee** deciding whether to ban a new performance-enhancing substance. The committee has three members voting on two premises that determine a conclusion via a specific rule.

  ### Scenario: Sports Committee on Substance Ban
  - **Rule for Banning**: A substance should be banned if it meets *both* criteria:  
    **Premise A**: It significantly enhances athletic performance.  
    **Premise B**: It poses a serious health risk.  
    *(Conclusion = Ban if A AND B are true)*  

  #### Individual Votes:
  | Member   | Premise A (Enhances Performance) | Premise B (Health Risk) | Conclusion (Ban?) |  
  |----------|----------------------------------|--------------------------|-------------------|  
  | **Alex** | Yes                              | No                       | No                | *(A but not B → No ban)*  
  | **Bri**  | No                               | Yes                      | No                | *(B but not A → No ban)*  
  | **Casey**| Yes                              | Yes                      | Yes               | *(A and B → Ban)*  

  ---

  ### Aggregation Methods:
  1. **Premise-Based Procedure** (vote on premises first, then apply rule):  
     - **Premise A** (Performance): Majority = Yes (Alex: Yes, Bri: No, Casey: Yes → 2-1)  
     - **Premise B** (Health Risk): Majority = Yes (Alex: No, Bri: Yes, Casey: Yes → 2-1)  
     - **Conclusion**: A AND B = Yes AND Yes → **Ban the substance**.  

  2. **Conclusion-Based Procedure** (vote directly on conclusion):  
     - **Conclusion** (Ban?): Alex: No, Bri: No, Casey: Yes → Majority = **No ban** (2-1).  

  **Result**:  
  - Premise-based: **Ban**  
  - Conclusion-based: **No ban**  
  → **Direct conflict!**  

  ---

  ### Why This Is a Paradox (Not Just Disagreement):
  The paradox arises because **majority voting on individual premises can construct a "collective truth" that no individual actually believes**. Here, the premise-based approach creates a fictional committee member who accepts both A and B (since each premise has majority support), even though *no real member holds that view*—Alex rejects B, Bri rejects A, and only Casey accepts both. Meanwhile, the conclusion-based approach respects each member's holistic judgment but ignores the logical structure of the rule. This isn't about disagreement; it's about **aggregation methods generating incompatible outcomes** from the same individual judgments, violating our expectation that logically connected decisions should cohere.  

  ---

  ### Optional Side-Answer: Connection to Arrow's Theorem
  Yes, this is deeply related to Arrow’s Impossibility Theorem! Both reveal **inherent flaws in aggregating individual inputs into collective decisions**:  
  - **Arrow** shows no voting system can perfectly translate *ranked preferences* into a fair group ranking (e.g., avoiding intransitive cycles).  
  - **Doctrinal Paradox** shows no method can perfectly aggregate *logically connected judgments* (e.g., premises → conclusion) without risking inconsistency.  

  The core similarity is that **individual rationality doesn't guarantee collective rationality**—both theorems prove that under reasonable conditions (e.g., non-dictatorship), systems will sometimes produce incoherent or contradictory group outcomes. The key difference is the input: Arrow handles *preference rankings*, while the doctrinal paradox handles *binary judgments with logical constraints*. They’re sibling results in social choice theory, highlighting the fragility of democratic decision-making.
