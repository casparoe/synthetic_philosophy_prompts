  Nina's unfalsifiability move is philosophically sound - Popper's falsification principle is core to scientific epistemology. Her shift from truth-value to epistemic hygiene is clever. But Theo's hindsight objection has merit: in active cover-ups, absence of evidence does temporarily support the conspiracy hypothesis. The test might only work in retrospect.

  Theo's debunker-equivalence point is sharp - confirmation bias cuts both ways. But he misses that scientific skepticism requires specifying falsification criteria, while conspiracy thinking often doesn't.

