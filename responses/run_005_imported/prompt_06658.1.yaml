  Okay, let me tackle this problem step by step. The user teaches a graduate seminar on conditionals and is frustrated because students can't create new examples beyond the Oswald/Kennedy assassination case. They want a fresh minimal pair in a different domain that clearly shows the indicative/subjunctive split.

  First, I need to recall why the Oswald example works. The indicative "If Oswald didn't kill Kennedy..." relies on known historical facts - Kennedy was killed, so if Oswald didn't do it, someone else must have. The counterfactual "If Oswald hadn't killed Kennedy..." imagines a world where Kennedy wasn't killed by anyone, so "someone else would have" is false. The key differences are epistemic access (what we know vs. what could've been) and what's held fixed (actual past events).

  Now, to create a new example, I should avoid politics and violence. Medical scenarios come to mind because they involve known diagnoses vs. alternative possibilities. Imagine a patient with a rare disease that only responds to one specific medication. 

  For the indicative: "If Drug X didn't cause the remission, Drug Y did." This could be true if we know remission occurred and only two drugs exist. For the counterfactual: "If Drug X hadn't caused the remission, Drug Y would have." This would be false if Drug X was uniquely effective. 

  The mechanics: 
  - Indicative holds actual outcome fixed (remission happened) and considers compatible epistemic possibilities. 
  - Counterfactual holds actual causes fixed (Drug X worked) and varies antecedent, so remission might not occur without it.

  I wonder if the pattern where indicative is true and counterfactual false is necessary. Maybe a reverse case exists. Consider a scenario where we don't know an outcome, but the counterfactual reveals a necessary cause. For example: "If the power didn't go out (indicative)" - but we don't know if it did, so it's unassertable. Versus "If the power hadn't gone out (counterfactual)" - we know it did go out and caused the server crash, so the consequent (servers wouldn't have crashed) is true. 

  This reverses the pattern: counterfactual is clearly true while indicative is inappropriate because we lack knowledge. The key is whether the speaker knows the antecedent's truth value. For indicatives, we need epistemic uncertainty; for counterfactuals, we presume antecedent's falsehood.

  This addresses both requests: a clean medical example and a reverse case breaking the usual truth pattern. The medical example isolates the standard split without violence, while the power outage example shows the asymmetry isn't inevitable.
answer: |-
  Here's a fresh minimal pair set in pharmacology, avoiding violence entirely. I'll then analyze the mechanics and provide a reversed case where the counterfactual is true and the indicative fails.

  ### The Minimal Pair: Drug Efficacy Scenario
  **Background Facts:**  
  - Patient has a rare disease *only* treatable by Drug X.  
  - Medical consensus: No alternative treatments exist (Drug Y is ineffective).  
  - Patient took Drug X and recovered.  

  **Indicative Conditional (True):**  
  "If Drug X didn't cause the remission, Drug Y did."  
  *Assertability: High* – Given recovery occurred and no other options, *if not X, then Y* is forced by known constraints.  

  **Counterfactual Conditional (False):**  
  "If Drug X hadn't caused the remission, Drug Y would have."  
  *Assertability: Low* – Holding actual medical knowledge fixed, without Drug X, remission wouldn’t occur at all.  

  ---

  ### Why It Works: The Mechanics  
  1. **Epistemic vs. Metaphysical Fixity**  
     - **Indicative**: Fixes *known outcomes* (recovery happened). It explores *epistemically open worlds* consistent with our knowledge ("Given recovery occurred, what must be true?"). Since recovery is fixed, if X didn’t cause it, something else must have – even if we know Y is ineffective.  
     - **Counterfactual**: Fixes *actual causal laws* (only Drug X works). It explores *metaphysically close worlds* where X wasn’t taken, holding biological facts constant. Here, remission fails – making the consequent false.  

  2. **Similarity Ordering**  
     - Indicative prioritizes worlds where *observed outcomes* (recovery) are preserved.  
     - Counterfactual prioritizes worlds where *causal laws* are identical and only the antecedent differs.  

  3. **Modality**  
     - Indicative: **Epistemic necessity** ("Given what we know, recovery *had to* come from X or Y").  
     - Counterfactual: **Metaphysical necessity** ("In worlds where X wasn’t taken, recovery *couldn’t* happen").  

  ---

  ### Reversing the Pattern: A Case Where the Counterfactual is True and the Indicative Fails  
  **Background Facts:**  
  - A server cluster has two power sources: Grid A (primary) and Grid B (backup, known to be faulty).  
  - Grid A failed last night. Grid B (as expected) did *not* engage. Servers crashed.  

  **Counterfactual Conditional (True):**  
  "If Grid A hadn’t failed, the servers wouldn’t have crashed."  
  *Assertability: High* – Holding actual flaws fixed (Grid B’s defect), without A’s failure, no crash occurs.  

  **Indicative Conditional (False/Unassertable):**  
  "If Grid A didn’t fail, Grid B didn’t engage."  
  *Assertability: Low* – We *know* Grid A failed. The indicative presupposes epistemic openness about the antecedent, but here A’s failure is known. Forcing it leads to incoherence:  
  - If uttered *before* knowing A failed: "If A didn’t fail..." is reasonable but *consequent* fails (we know B wouldn’t engage even if A failed).  
  - If uttered *after* knowing A failed: It’s Moore-paradoxical ("A failed, but if it didn’t, B didn’t engage" – clashes with knowledge).  

  ---

  ### Why the Reversal Works  
  - **Counterfactual’s Truth**: Antecedent (A not failing) is false. Holding actual defects fixed (B’s flaw), servers run fine – consequent true.  
  - **Indicative’s Failure**:  
    - **Timing Issue**: If pre-failure knowledge, "If A didn’t fail" is open, but "B didn’t engage" is false (B *would* engage if A failed, but we know it’s defective? Contradictory premises).  
    - **Knowledge Conflict**: Post-failure, the antecedent contradicts known facts, violating the indicative’s requirement for *epistemic openness*.  

  ### Key Insights  
  1. **Asymmetry Isn’t Necessary**: The Oswald-style pattern (indicative true, counterfactual false) dominates because:  
     - We often *know* outcomes (Kennedy died) but not causes.  
     - Reversed cases exist when we *know* the antecedent is false (Grid A failed) and the consequent depends on that fact.  
  2. **Core Difference**:  
     - Indicatives: **Knowledge-dependent**. They track rational inference given *current information*.  
     - Counterfactuals: **Reality-dependent**. They track causal/nomic necessity holding *actual history fixed*.  

  ### Classroom Implementation  
  - **Generate New Pairs**: Have students:  
    1. Pick a known outcome (e.g., "The bridge collapsed").  
    2. State an indicative forcing an explanation ("If not design flaw, then material fatigue").  
    3. State a counterfactual denying necessity ("If no design flaw, it still would’ve collapsed" – false if flaw was critical).  
  - **Break the Mold**: Challenge them to find cases where counterfactuals "win" (like the grid example).  

  This breaks the assassination monotony while clarifying the epistemic/metaphysical divide. The reversed case proves the asymmetry isn’t inherent – it’s about knowledge configuration.
