  Counterexamples? The Jamesian belief case might be one. Another could be moral reasons. Suppose you have a reason to admire a virtuous person because it motivates you to be better. Strip the motivational payoff, and the reason might weaken, but the admiration could still be fitting. The insulation test might misclassify this as wrong-kind. Or consider epistemic virtues: believing based on evidence vs. social benefits. The test should handle evidence-based reasons as right-kind, but if extrinsic benefits are stripped, only evidential reasons remain. But in the Jamesian case, the belief's success is tied to the object (your own actions), making it tricky. If the reason includes the causal role of the belief in success, stripping the payoff might leave some reason related to the belief's effectiveness, but that's still instrumental. So maybe the test correctly marks pragmatic reasons as wrong-kind for fittingness, even if practically rational.

