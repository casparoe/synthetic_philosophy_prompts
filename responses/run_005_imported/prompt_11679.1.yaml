  Now, the hard cases. Vestigial organs: etiological says no current function, causal-role might assign one if it does something. Exaptations: feathers for insulation vs. flight—etiological has original vs. new function, causal-role just looks at current role. Malfunction: etiological can say it's supposed to pump but fails, causal-role struggles because if it doesn't pump, it has no function. Swampman: etiological denies functions without history, causal-role assigns based on current roles.

