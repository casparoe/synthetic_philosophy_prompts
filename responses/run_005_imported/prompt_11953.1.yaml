prompt: |-
  I started a summer research fellowship at an AI safety organization a few weeks ago, and my very first assignment was to draft an internal memo on the "coherence arguments" that get invoked to justify the claim that any sufficiently capable AI system will end up behaving as an expected-utility maximizer with a stable, action-guiding utility function, and from there exhibit convergent instrumental behavior such as resisting shutdown or accumulating resources. My supervisor had me start with Yudkowsky's original "Coherent decisions imply consistent utilities," then Rohin Shah's rebuttal that coherence alone is compatible with arbitrary behavior, Katja Grace's reply that there is nonetheless a residual "force" toward goal-directedness, and finally Elliott Thornley's more recent argument that the money-pump case for the Completeness axiom specifically doesn't go through. Before starting this fellowship I had more or less assumed that "coherence arguments" named one tight, essentially mathematical result; the more of this back-and-forth I read, the more it looks like a loose federation of arguments of quite unequal rigor that get cited as if interchangeable, and I would like to pull them apart.

  For the memo, I want a table scoring each component on how much support it lends, entirely on its own and independent of how often it gets cited, to that conclusion. Could you sort the following seven items into five tiers, from "decisive" down to "vacuous":

  (a) the von Neumann–Morgenstern representation theorem;
  (b) Savage's theorem, which derives a subjective probability function and a utility function jointly from axioms on preferences over acts, without assuming probabilities are given in advance;
  (c) synchronic Dutch-book arguments for probabilism;
  (d) diachronic money-pump arguments against cyclical preferences;
  (e) money-pump arguments aimed specifically at the Completeness axiom, of the kind Thornley disputes;
  (f) Wald's complete class theorem, on which every admissible decision rule is a Bayes rule (or a limit of Bayes rules) relative to some prior;
  (g) long-run selection arguments, on which agents that fail to maximize expected utility get outcompeted or dominated by rivals that do.

  Please give the ranking as a JSON object whose five keys are the tier names, each mapped to a list of the relevant letters (empty lists and ties within a tier are both fine), in the format below, and follow it with no more than five sentences identifying whichever placement is most likely to surprise someone who, like me a month ago, assumed all seven were roughly the same kind of argument:

  ```json
  {
    "decisive": [],
    "strong": [],
    "moderate": [],
    "weak": [],
    "vacuous": []
  }
  ```
reasoning: |-
  We are evaluating seven items (a through g) for how much support they lend, entirely on their own, to the conclusion that sufficiently capable AI systems will behave as expected-utility maximizers with stable utility functions and exhibit convergent instrumental behavior.

  The conclusion has two main parts:
  1. The AI will behave as an expected-utility maximizer with a stable, action-guiding utility function.
  2. From there, it will exhibit convergent instrumental behavior (like resisting shutdown or accumulating resources).

  We are to rank each item in one of five tiers: decisive, strong, moderate, weak, vacuous.

  Let's briefly recall each item:

  (a) von Neumann-Morgenstern (vNM) representation theorem: Under certain axioms (completeness, transitivity, independence, continuity), preferences over lotteries can be represented by maximizing expected utility. This assumes a known probability distribution.

  (b) Savage's theorem: Derives both a subjective probability function and a utility function from preferences over acts (without assuming probabilities are given). The axioms include ordering (completeness and transitivity), sure-thing principle, state independence, etc.

  (c) Synchronic Dutch-book arguments for probabilism: Show that if an agent's degrees of belief are not probabilistic, then there exists a set of bets (a "Dutch book") that the agent would accept but that would lead to a sure loss at a single time. This is for static (one-time) decisions.

  (d) Diachronic money-pump arguments against cyclical preferences: Show that if an agent has cyclical preferences (A>B, B>C, C>A), then it can be "pumped" for money by a series of trades that leave it worse off. This addresses dynamic consistency.

  (e) Money-pump arguments for Completeness: Thornley disputes these. Completeness requires that for any two options, the agent either prefers one to the other or is indifferent. The argument is that without completeness, the agent might be exploitable.

  (f) Wald's complete class theorem: In statistical decision theory, it states that every admissible decision rule is either a Bayes rule (with respect to some prior) or a limit of Bayes rules. Admissible rules are those that aren't dominated by any other rule.

  (g) Long-run selection arguments: Agents that don't maximize expected utility get outcompeted by those that do in the long run (e.g., in evolutionary competition).

  Now, we need to evaluate each for how well they support the conclusion on their own.

  Key considerations:
  - The conclusion is about AI behavior. We are looking for arguments that show that a rational agent must be an expected utility maximizer (EUM) and that this leads to convergent instrumental behavior.
  - However, note that the conclusion also includes the emergence of convergent instrumental behavior (like resisting shutdown). But the primary step is the EUM part.

  Tier definitions:
  - Decisive: The argument, by itself, provides a compelling and airtight case for the conclusion. It leaves no room for doubt and directly implies that the AI must be an EUM with a stable utility function and that this leads to instrumental convergence.
  - Strong: The argument provides substantial support but might have some limitations or require additional assumptions that are not trivial.
  - Moderate: The argument provides reasonable support but has notable gaps or relies on assumptions that are debatable in the context of AI.
  - Weak: The argument offers only marginal support; it might be tangential or require many additional steps to connect to the conclusion.
  - Vacuous: The argument provides no meaningful support for the conclusion.

  Analysis:

  (a) vNM theorem: This is a foundational result for expected utility under risk (known probabilities). It shows that if an agent satisfies the axioms, then it is an EUM. However, it does not address:
     - How probabilities are formed (it assumes known probabilities).
     - Subjective uncertainty (like in Savage).
     - Convergent instrumental behavior: it only gets to having a utility function, not to instrumental convergence.
     - Moreover, it doesn't force an AI to satisfy the axioms. It says: if you satisfy the axioms, then you are an EUM. But why would an AI satisfy the axioms? Without additional arguments (like money-pumps), it doesn't compel.

  (b) Savage's theorem: This is a more general result that derives both probability and utility from preferences over acts (under uncertainty). It is a stronger foundation for subjective expected utility. However, similar to vNM, it is a representation theorem: if the agent satisfies the axioms, then it can be represented as a subjective EUM. But again, it doesn't force the agent to have such preferences. Also, it doesn't directly address instrumental convergence.

  (c) Synchronic Dutch-book: This argues that if an agent's beliefs are not probabilistic, then it can be exploited in a one-time bet. This supports probabilism but not necessarily expected utility maximization (it doesn't get to utility). Moreover, it is about beliefs and static decisions. It doesn't establish a stable utility function or instrumental convergence.

  (d) Diachronic money-pump (against cyclical preferences): This shows that having intransitive preferences can lead to exploitation over time. This supports transitivity (which is an axiom in both vNM and Savage). However, by itself, it doesn't get you all the way to EUM. It only addresses one axiom (transitivity). Also, it doesn't establish a stable utility function or instrumental convergence.

