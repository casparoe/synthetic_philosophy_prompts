  (f) Wald's complete class theorem: This is about admissibility in statistical decision rules. It says that the only admissible rules are Bayes rules. This suggests that for an agent to be admissible (not dominated), it must be a Bayesian. However, note:
     - It applies in a setting with a fixed set of decision rules and a loss function. 
