     - Also, it doesn't directly show that the AI will have a stable utility function. Moreover, the prior might be arbitrary, so the utility function might not be stable in the sense of being fixed over time.
     - It doesn't necessarily lead to instrumental convergence.

  (g) Long-run selection arguments: These are evolutionary arguments. They say that in the long run, non-EUM agents are outcompeted. This might apply in an evolutionary setting, but for a single AI, it's not clear. Also, it assumes a competitive environment and long-run dynamics. It doesn't force a single AI to be an EUM. Moreover, the timescales might not apply to AI.

