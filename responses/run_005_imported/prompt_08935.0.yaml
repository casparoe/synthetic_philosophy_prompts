  In strategic contexts, revealing info affects others' actions, which Good doesn't account for. Direct utility violates the "no intrinsic value of information" premise. Self-command issues break the optimal update and action assumption. So each failure mode violates a different part of Good's setup. They're distinct but all relate to relaxing one of the core assumptions.

  The user wonders if these failures stem from the same underlying assumption. But looking closer, each corresponds to a separate pillar: strategic violates single-agent, direct utility violates instrumental value, self-control violates optimal updating. So the friend is right—they're three distinct failure modes. However, they all share the broader theme of deviating from Good's ideal Bayesian agent model.

