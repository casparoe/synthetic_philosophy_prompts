  My mom died in March and I'm giving her eulogy this weekend, and there's one part of it I can't get past. She was an ICU nurse for almost 30 years and had very strong opinions on this exact stuff - she always said if your brain is gone, that's you gone, and she definately didn't want anyone dressing that up into something softer. She had a stroke and was declared brain dead on a tuesday, but my dad had the hospital keep her on the ventilator so my brother could fly back from overseas, so her heart kept going for six more days until they finally turned it off. My aunt spent that whole week praying over her for a recovery and is still a little raw about my dad "giving up" when he agreed to switch off the machine. I want the eulogy to actually be honest about what mom believed instead of smoothing it over for everyone's comfort, but I don't want it to come off like I'm using my aunt's grief as a teaching moment. Most of the family has never thought about brain death vs the heart stopping for one second in their life, so it can't get technical, but it can't dodge the real question either - she'd have hated that. Can you write it for me, around 5 minutes, meant to be read out loud at the service?
