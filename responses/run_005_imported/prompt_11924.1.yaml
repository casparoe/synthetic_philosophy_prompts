prompt: |-
  I'm doing a podcast episode with a guest who defends the knowledge norm of assertion: you're only allowed to assert p if you know p. From his older interviews I've noticed his go-to dodge -- whenever you hand him a case where someone asserts something on terrific evidence that turns out false, or true only by luck, and the assertion still seems totally fine, he just says it was improper but excused, so it doesnt actually count against the norm. Can you draft me 8-10 questions that make that dodge harder to reach for, plus a follow-up ready for when he repeats that line? I want at least one built on the lottery case -- why does the asymmetry (fine to believe your ticket lost, not fine to assert it) require knowledge itself, rather than just much stronger justification -- one asking flat out whether "improper but excused" can absorb literally any counterexample thrown at it, and what that does to the view's testability, and one on whether the oddity of "p, but I don't know that p" might just be conversational implicature rather than proof of a real constitutive norm. End with a question that makes him actually describe the one case that would get him to drop the knowledge norm for something weaker.
reasoning: |-
  Okay, the user is preparing for a podcast interview with a guest who defends the knowledge norm of assertion (KNA). The guest's typical defense strategy is to dismiss counterexamples as "improper but excused" assertions. The user wants questions that challenge this dodge effectively, specifically targeting scenarios where assertions seem proper despite lacking knowledge, like lottery cases or Gettier situations. 

  Hmm, the user's frustration is palpable—they've clearly studied the guest's previous tactics and want to avoid a repetitive exchange. Their deeper need isn't just for questions but for *leverage*: they want to expose potential weaknesses in KNA by forcing the guest to either abandon the "excused" loophole or admit its ad hoc nature. The lottery asymmetry point is especially sharp—why can we believe but not assert without knowledge? That’s a pressure point. 

  The user also hints at meta-concerns: if "improper but excused" swallows every counterexample, does KNA become unfalsifiable? And could the "p but I don’t know p" oddity just be pragmatics? Smart angles. I’ll design questions that chain these: start with concrete cases (lottery, Gettier), escalate to the excuse loophole, then corner with falsifiability. 

  For the lottery question, I need to preempt the guest’s likely reply. If they say belief doesn’t need knowledge but assertion does, the follow-up should demand *why*—what’s special about assertion? Maybe press them to define "proper" assertion beyond "requires knowledge." 

  The falsifiability hook is critical. If the guest claims KNA is still testable, they must explain *what evidence* would disprove it. Otherwise, it’s dogma. 

  Endgame: force them to sketch a counterexample they’d surrender to. If they can’t, it reveals KNA’s rigidity. If they do, it might crack the door for alternatives. 

  Structure: 
  - Open with lottery (classic, forces justification vs. knowledge distinction). 
  - Hit Gettier cases (luck-based truths). 
  - Question the "excused" escape hatch. 
  - Attack the "p but ~Kp" intuition (is it really semantic?). 
  - Close with falsifiability and a hypothetical surrender scenario. 

  Follow-ups must be ready to pounce if "excused" reappears. My drafted Q8 nails this: "Doesn’t 'excused' just mean 'seems proper'? Then your norm is circular." Brutal but fair. 

  Final note: the user’s "conversational implicature" point is gold. If the guest hasn’t engaged with semantic vs. pragmatic explanations for "p but ~Kp," this could fluster them. Lean in.
answer: |-
  Here are 10 targeted questions designed to pressure the "improper but excused" dodge, force clarification on falsifiability, exploit key cases like the lottery, and end with a surrender scenario. Each includes a follow-up prepped for the "excused" response:

  **Core Questions:**

  1.  **The Lottery Asymmetry (Justification Focus):** "You often cite the lottery case: it seems proper to *believe* my ticket lost based on overwhelming odds, yet *asserting* it seems improper without knowledge. But why must this asymmetry point to a *knowledge* norm specifically? Couldn't it just show assertion requires *stronger justification* than belief – perhaps maximal non-knowledge justification – without demanding infallible knowledge?"
      *   *If "excused":* "If asserting 'My ticket lost' based on 99.999% odds is *still improper* (merely excused), doesn't that imply justification alone is *never sufficient* for proper assertion? What then is the functional difference between 'maximal non-knowledge justification' and knowledge, if both leave assertion improper?"

  2.  **Gettier & High-Stakes Luck (Excuse Scope):** "Consider a surgeon who asserts 'This instrument is sterile' based on flawless, verified hospital protocols (documentation, autoclave logs, visual inspection). Unbeknownst to her, a rare, undetectable contaminant is present (a Gettier case). Her assertion guides a successful, life-saving surgery. Was her assertion *improper*? If so, why doesn't the crucial role it played in a *good outcome* based on *flawless evidence* make it at least excusable to the point of seeming perfectly appropriate?"
      *   *If "improper but excused":* "Doesn't labeling this 'improper but excused' stretch the concept? If acting on flawless evidence leading to ideal outcomes *still* results in an improper assertion, doesn't 'proper' become detached from any reasonable practical or epistemic standard we actually use?"

  3.  **The Excuse Loophole & Falsifiability:** "Your 'improper but excused' move seems applicable to *any* putative counterexample: false assertions, lucky true ones, high-evidence/low-stakes cases. What specific, realistic scenario *couldn't* be absorbed by this move? Put differently, what would a genuine counterexample to KNA actually *look like*, and how would we distinguish it from an 'excused' case?"
      *   *If he describes a potential counterexample:* "But couldn't you *still* argue that case is merely 'excused'? What principle *prevents* you from applying 'excused' universally?"

  4.  **The Cost of 'Excused':** "If virtually every intuitive case of appropriate assertion without knowledge gets classified as 'improper but excused', doesn't the concept of 'proper assertion' become practically vacuous or irrelevant? What practical guidance does KNA offer if 'proper' assertion is so rarely achievable outside trivialities, and 'excused' covers almost everything else we intuitively commend?"
      *   *If he downplays the cost:* "If 'excused' assertions are the norm in everyday life, and 'proper' ones are rare, isn't KNA failing to describe the actual practice it purports to govern? Shouldn't a norm track when assertions are *actually appropriate*, not just theoretically ideal?"

  5.  **"P, but I don't know that P" - Implicature vs. Constitutive Norm:** "The oddity of 'P, but I don't know P' is central to your case. But couldn't this simply be a *conversational implicature* (violating Grice's Maxim of Quality) rather than proof of a *constitutive norm*? We find 'It's raining, but I don't believe it' equally odd, but we don't think there's a 'belief norm' for weather reports. Why isn't KNA conflating pragmatics with semantics/constitutive rules?"
      *   *If he insists it's constitutive:* "What specific linguistic evidence distinguishes this oddity as evidence for a *constitutive norm* rather than just a very strong pragmatic rule, like the one governing Moorean absurdity?"

  6.  **High-Evidence False Assertions in Low-Stakes:** "Imagine I assert, based on meticulously checking my calendar, reliable texts, and my own vivid memory, 'I had lunch with Alex last Tuesday.' Unbeknownst to me, it was Wednesday (I misremembered the day, but everything else is correct). My friend casually says 'Cool.' Intuitively, my assertion seems perfectly appropriate. Is it *improper*? If so, why does the presence of overwhelming (but misleading) evidence + low stakes not make it proper, or at least render the 'improper' label practically meaningless?"
      *   *If "improper but excused":* "Given the evidence was as strong as anyone could reasonably demand for such a claim, and the context was utterly low-stakes, doesn't calling it 'improper' undermine the notion that epistemic norms serve our communicative needs? What *more* could I have done to make it proper?"

  7.  **Knowledge vs. Actionable Certainty:** "In many practical contexts (e.g., engineering, navigation, diagnostics), we assert based on evidence that provides *actionable certainty* – sufficient certainty to warrant high-stakes action – even if it falls *just short* of philosophical knowledge (e.g., tiny, uneliminated skeptical possibilities remain). Isn't the norm governing assertion in these contexts *actionable certainty* rather than *knowledge*? Why impose the stricter standard?"
      *   *If he insists on knowledge:* "If engineers assert 'The bridge is safe' based on models passing all known tests (actionably certain), but a bizarre, unforeseen quantum effect *could* cause failure (so not strictly 'known' safe), was their assertion *improper*? If so, does this match professional standards of assertion?"

  **The Final Challenge (Surrender Scenario):**

  8.  **Demarcating the Excuse:** "You distinguish 'proper' from 'excused'. Could you give a clear, principled criterion for when an assertion is *merely excused* versus *genuinely proper* under KNA? Specifically, what does 'excused' add beyond 'the listener reasonably thinks the asserter knew, or the stakes were low, or the evidence was great'?"
      *   *If he gives a criterion:* "Couldn't a critic argue your criterion for 'excused' is *defined* to protect KNA, making it unfalsifiable? Doesn't this risk being ad hoc?"

  9.  **Testing the Norm:** "If KNA is a substantive empirical claim about a speech-act norm, it must be falsifiable. If 'improper but excused' can always explain away apparent counterexamples, doesn't this shield KNA from empirical refutation? How is this different from a theory that's true *by definition*?"
      *   *If he claims testability:* "What *observable phenomenon* would unequivocally falsify KNA, that couldn't be explained away by 'excused'?"

  10. **The Falsifying Case:** "Imagine you encounter a case so compelling that you *would* abandon the strict knowledge norm for a weaker norm (e.g., justified-to-a-certain-degree, safe assertion, or actionable certainty). **Please describe the specific details of that hypothetical case.** What evidence would the asserter have? What would the context be? What would the outcome be? What makes *this* case different from Gettier or lottery cases, such that 'improper but excused' *wouldn't* apply, forcing you to concede knowledge isn't necessary for proper assertion?"

  **Key Strategies Embedded:**

  *   **Focus on Justification vs. Knowledge:** Questions 1 & 7 directly challenge whether knowledge is *necessary* or if justification/certainty suffices.
  *   **Pressure the "Excuse":** Questions 2, 3, 4, 6, and 8 force him to define "excused," demonstrate its limits, and confront its potential to make KNA unfalsifiable or practically irrelevant.
  *   **Target Intuitions:** Questions 2 and 6 present cases designed to make the "improper" label seem deeply counterintuitive and disconnected from practice.
  *   **Undermine Key Evidence:** Question 5 directly attacks the primary linguistic argument for KNA.
  *   **Demand Falsifiability:** Questions 3 and 9 explicitly challenge the testability of KNA if "excused" is all-encompassing.
  *   **Force a Concession Scenario:** Question 10 is crucial – it makes him describe what *would* change his mind, revealing the boundaries (or lack thereof) of his commitment and potentially exposing KNA's inflexibility.

  Use these questions strategically, not necessarily in order. Listen closely to his answers, and don't let him off the hook with vague appeals to "excused" – immediately deploy the prepared follow-ups to demand precision and consequences. Good luck!
