  First, I need to understand the guest's position. Strawsonian compatibilism centers on reactive attitudes (resentment, gratitude, etc.) as the basis for moral responsibility, independent of determinism. The challenge is to frame questions that force engagement with objections without letting her retreat to the "objective attitude" deflection.

  For Gary Watson's case: Robert Harris had a horrific childhood, leading to conflicting reactive attitudes—resentment for his crimes versus compassion due to his upbringing. The key is to ask whether both emotions track quality of will or if compassion arises from discomfort with the causal history. The follow-up should push her to explain how both can be fitting without contradiction.

  Pereboom's manipulation argument involves cases where agents are manipulated into committing actions. The goal is to make her identify a principled difference between manipulation and ordinary determinism. Her likely response is that manipulated agents lack normal psychological structures, so the follow-up should challenge whether those structures are truly absent in the final case where manipulation is subtle.

