  Also, consider the podcast audience: rationalist community values precise, evidence-based arguments. Questions must be rigorous and avoid vagueness. The guest is knowledgeable, so questions should respect her expertise while pressing for concrete answers.

  Potential pitfalls: The guest might still deflect, so follow-ups must anticipate her responses and corner her into engaging. For example, in Pereboom's case, if she distinguishes manipulation via psychological structures, the follow-up questions why those structures aren't present in Case 4, challenging her criteria.

  Check if all user points are covered: Watson, Pereboom, Wallace, AI, and the closing. Each has a question and follow-up. Need eight to ten total; with four main topics plus intro and closing, that fits. Add transition questions to connect topics smoothly.

