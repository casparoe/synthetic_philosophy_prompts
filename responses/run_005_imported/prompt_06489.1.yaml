answer: |-
  Your intuition is spot-on—this is a classic case of a **collective action problem** intersecting with an **evolved social norm**, and Priya's "free choice" defense ignores crucial asymmetries. Here's the breakdown:

  ### 1. **The Problem Isn't "Free Choice"—It's a Volunteer's Dilemma**
     - **Structural Imbalance**: You’re describing a textbook **Volunteer’s Dilemma**: A group benefits if *someone* acts (cleaning the kitchen), but the volunteer bears the full cost (time/effort). Those who don’t act get a "free ride." Priya frames this as symmetric ("we both choose freely"), but **the costs/benefits are wildly asymmetric**:
       - **Your cost**: Cleaning labor + frustration of always doing it.
       - **Priya’s cost**: None (she tolerates mess).
       - **Shared benefit**: Clean kitchen enjoyed by all, including Priya.
     - **Hidden Coercion**: Saying "you could just wait longer" ignores that **your tolerance threshold imposes a tangible burden** (discomfort, unusable kitchen, pest risk), while Priya’s inaction has no downside *for her*. Her "choice" is cost-free; yours isn’t.

  ### 2. **Priya’s Argument Overlooks the Norm’s Evolution**
     - **Adaptive Tolerance**: You suspect Priya’s tolerance has *increased* because she knows you’ll crack first. This is likely **strategic behavior** (conscious or not). Once a pattern emerges where one person consistently volunteers, others rationally lower their effort—knowing the task will get done anyway. This isn’t "neutral"; it’s **exploiting the volunteer**.
     - **The "Unmade Rule" Fallacy**: Just because a norm wasn’t voted on doesn’t make it neutral. **Evolved norms often reflect power imbalances** (e.g., who cares more, who has more free time). Priya benefits from the status quo, so she defends it as "natural," but it’s arbitrary and unfair.

  ### 3. **Why This Feels Unfair (Your Case Is Legitimate)**
     - **Burden Distribution**: In a fair system, chores are shared proportionally. Here, you shoulder more labor for a *shared* resource because you’re more sensitive to disarray. This is like taxing people with lower pain thresholds for bandaids used by everyone.
     - **Eroded Trust**: The norm incentivizes housemates to *suppress* their discomfort, knowing someone else will cave. This breeds resentment (as you’re experiencing) and is unsustainable.
     - **The "Fairness" Test**: Ask: *Would this feel fair if everyone behaved like Priya?* If all 5 tolerated ever-worsening mess until someone snapped, the kitchen would become unusable. Priya’s position only "works" because *you* deviate from her behavior.

  ---

  ### How to Renegotiate the Unmade Rule
  Your goal is to **reset expectations collectively** without blaming Priya. Focus on the *system*, not individuals. Here’s a step-by-step:

  1. **Gather Data (Optional but Powerful)**  
     Track kitchen cleanups for 2 weeks: Who cleaned? How bad was it? Visual evidence (photos of "intolerable" mess levels) can highlight disparities. Present this neutrally: *"I noticed the kitchen hits my limit about twice a week—how often does it bother others?"*

  2. **Frame It as a Collective Problem**  
     Start a house meeting with:  
     *"Our ‘whoever cares first cleans’ system made sense early on, but now that we’re busier/using the kitchen more, I’m worried it’s creating uneven work. I’ve realized my tolerance is lower, so I end up cleaning way more than my share. Can we brainstorm a fairer solution together?"*  
     → **Crucially: Invite others’ perspectives.** Are *they* satisfied? Priya isn’t the only free-rider; silent housemates benefit too.

  3. **Propose Structured Alternatives**  
     Offer 2–3 options, emphasizing *shared* responsibility:
     - **Rotating "Kitchen Captain"**: Each person is responsible for 1 week. They can clean *or* delegate tasks (e.g., *"Alex, can you handle dishes tonight?"*).  
     - **Chore Wheel with Flexibility**: Assign daily tasks (sweep, counters, dishes) but allow swaps if someone’s busy.  
     - **"Clean as You Go + Weekly Deep Clean"**: All agree to wipe spills/load dishwashers immediately, plus one person handles a 30-min weekly scrub (rotating).  
     → **Sweeten the deal**: *"If we rotate, no one has to stress about being the ‘first to crack’—we all know our turn is coming."*

  4. **Address Priya’s Objection Preemptively**  
     If she repeats "just wait longer," respond:  
     *"That‘s the issue—waiting longer isn’t cost-free for me. I get stressed when the kitchen’s messy, and it’s not fair that I pay that price *plus* do the labor while others get a clean space without effort. A fixed system shares the burden so no one feels exploited."*

  5. **Secure Buy-In**  
     Aim for consensus: *"Does anyone *prefer* the current system? If not, which new option seems most doable?"* If Priya resists, ask: *"What would feel fair to you?"* Make her propose an alternative.

  ---

  ### Why This Works
  - **Shifts Focus**: From "you vs. Priya" to "us vs. the problem."  
  - **Appeals to Self-Interest**: Others may fear being stuck with your role if you move out.  
  - **Leverages Reciprocity**: People who’ve free-ridden may agree to avoid guilt.  

  **Bottom Line**: Priya’s "free choice" argument collapses under scrutiny—it ignores the volunteer’s burden and the norm’s accidental exploitation. You’re not wrong to demand change. By moving from an implicit, asymmetrical norm to an explicit, cooperative agreement, you restore fairness without drama. Good luck!
