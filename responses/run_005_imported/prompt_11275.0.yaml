  ## The Cup of Contradiction: Plato's Defense of Drunkenness and the Coherence of His Moral Psychology

  Plato's Athenian Stranger in the *Laws* presents a startling proposition: regulated, state-supervised drinking parties (*symposia*) are essential tools for cultivating virtue, specifically moderation (*sophrosyne*). By deliberately inducing drunkenness in a controlled environment, citizens can be tested and trained in self-control, much like soldiers hardened in battle. This stands in stark contrast to the familiar Platonic model, particularly from the *Republic*, where virtue arises from reason's (*logos*) absolute dominion over the irrational appetites (*epithymia*) and spirited element (*thymos*), achieved through rigorous education and suppression of disruptive desires. At first glance, this *Laws* doctrine seems a radical inconsistency, advocating the deliberate loosening of reason's grip to build the very character that grip defines. However, a closer examination reveals this as a coherent, albeit complex, extension of Plato's moral psychology, adapting its core principles to the practical demands of governing fallible humans in a non-ideal state.

  **The Case for Inconsistency:**

  The argument for a genuine contradiction is strong and rests on fundamental tenets of Platonic ethics:

  1.  **The Primacy of Rational Control:** The *Republic* unequivocally establishes reason as the rightful ruler. Virtue (*arete*) *is* the harmony of the soul achieved when reason commands, spirit enforces, and appetite obeys (Rep. IV, 441d-444e). Appetites, especially those related to pleasure like drink, are inherently unruly and dangerous. Indulging them, even temporarily, risks strengthening them, making reason's task harder. The *Laws* strategy of deliberately weakening reason's hold through intoxication seems to directly undermine this foundational principle, empowering the very element reason must suppress.
  2.  **The Danger of Appetitive Stimulation:** Plato consistently portrays base appetites as insatiable and corrupting. The *Republic* (IX, 571c-580c) vividly depicts the tyrannical soul, born when lawless appetites run rampant. Feeding these appetites, even in a "controlled" setting, seems antithetical to the project of taming them. How can deliberately inflaming desire teach control? Isn't this akin to training fire safety by starting small, controlled fires in a tinderbox?
  3.  **The Ideal vs. The Practical?:** Critics argue this represents a pragmatic concession in the *Laws*, Plato's late work focused on establishing a feasible "second-best" state for actual humans, not the ideal Kallipolis. The *Republic* presents an abstract, rational ideal achievable only by philosopher-kings; the *Laws* grapples with flawed citizens. The drinking parties, therefore, might be an *ad hoc* solution, inconsistent with the pure theory of the soul but deemed necessary for managing real-world weakness. This view suggests Plato abandoned or compromised his core psychology for expediency.
  4.  **The Problem of "Training" Through Failure:** The Athenian Stranger compares symposia to military drills. But while soldiers face simulated danger *while maintaining discipline*, the symposion deliberately induces a state (drunkenness) where discipline *collapses*. How does experiencing loss of control *build* control? Doesn't repeated exposure to failure potentially normalize it and weaken the resolve to resist?

  **The Case for Coherent Extension:**

  Despite these strong objections, the *Laws*' defense of symposia can be understood as a sophisticated application of Platonic principles to a more complex understanding of human development and the nature of virtue:

  1.  **Virtue Requires Resistance, Not Just Absence:** The *Republic* focuses on establishing rational harmony *within* the soul. The *Laws* emphasizes that true virtue must be *tested* against external *temptations*. Reason's rule isn't secure if it's never challenged. A soul that only experiences calm obedience from appetite hasn't proven its strength. Symposia provide a controlled, low-stakes battlefield where citizens encounter the internal enemy (unruly desire) under supervision. This isn't *abandoning* reason's rule; it's *stress-testing* it. The supervisor (the sober "symposiarch") embodies reason's externalized, guiding presence.
  2.  **Knowledge Through Experience and Self-Revelation:** Plato's epistemology values self-knowledge. The Athenian Stranger argues drunkenness acts as a "truth serum" for the soul (Laws I, 649d-650b). It strips away social conventions and rationalizations, revealing a person's true character – their latent cowardice, arrogance, or lust. This revelatory function is crucial. How can reason govern effectively if it doesn't know the true strength and nature of the enemy within? The symposion becomes a diagnostic tool, exposing vulnerabilities *so that* reason, informed by this knowledge, can then target its educational efforts more effectively.
  3.  **Building Resilience Through Controlled Exposure:** The military analogy is deeper than it first appears. Soldiers aren't just trained in technique; they are *habituated* to fear and chaos to prevent panic in real combat. Similarly, symposia aim to habituate citizens to the *feeling* of strong temptation and the *process* of resisting it or recovering from failure *while support is available*. Experiencing the disorientation of drunkenness, observing others' failures, and practicing reasserting control under the symposiarch's guidance builds psychological resilience. It teaches reason how to operate *during* the assault of appetite, not just in its absence. This is less about "loosening reason's grip" and more about *training reason to maintain its grip under pressure*.
  4.  **The Shift from Ideal Theory to Applied Psychology:** The *Laws* doesn't reject the tripartite soul or reason's sovereignty. Instead, it confronts the practical question: *How do you instill rational self-rule in souls already shaped by untrained appetites?* Pure suppression might create fragile virtue that shatters at the first real temptation. The symposion strategy acknowledges the *developmental* nature of virtue. It proposes a pedagogical method akin to "inoculation" – controlled exposure to the "pathogen" (temptation) to build immunity (resistance). Reason remains the goal and the ultimate authority; the symposiarch *is* reason personified, guiding the process. This is an extension of Socratic/Platonic educational principles – confronting ignorance or weakness directly to provoke self-examination and growth.
  5.  **Moderation as Dynamic Mastery:** In the *Laws*, *sophrosyne* isn't just the absence of desire; it's the *mastery* of it. True mastery isn't proven by avoiding all battle, but by emerging victorious from it. The symposion provides a safe arena for this battle. The "loosening" isn't an end but a *means* to strengthen reason's capacity to *reassert* control, demonstrating that its rule is dynamic and resilient, not merely a static absence of conflict.

  **Verdict: Coherent Extension**

  While the tension is undeniable and the *Laws* approach initially jarring, the defense of regulated symposia ultimately emerges as a **coherent extension** of Platonic moral psychology, not a fundamental inconsistency. Plato in the *Laws* is grappling with the application of his core principles – the tripartite soul, reason's sovereignty, the necessity of education – to the messy reality of human psychology and statecraft. He recognizes that virtue forged only in the sterile environment of pure reason is ill-equipped for the real world saturated with pleasure and pain. The symposion strategy is a bold but logical adaptation: if virtue requires knowing and overcoming internal threats, then creating a safe space to *confront* those threats under the guidance of reason (embodied by the symposiarch and the laws) becomes a necessary, albeit risky, pedagogical tool. It shifts the emphasis from simply *establishing* reason's rule (the *Republic*'s focus) to *fortifying* and *proving* that rule against destabilizing forces. The Athenian Stranger isn't abandoning reason's leash; he's arguing that for the leash to hold against a powerful beast, the handler must practice controlling it even when the beast strains. It's a pragmatic deepening, not a betrayal, of Plato's enduring quest to understand how reason can best govern the human soul.
