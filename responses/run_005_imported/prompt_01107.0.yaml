answer: |-
  You've nailed the core tension perfectly – Lewis's meticulous game-theory scaffolding *does* feel like it's describing something we intuitively call a "social norm" or "custom." But the devil (and the genius) is in the **precision and specific explanatory power** his framework provides. Let's break it down, comparing it to the folk concept and addressing Gilbert's critique:

  **The Folk Concept of Social Norm (The Blunt Instrument):**

  *   **What it captures:** "People do X here because others do it, expect it, and there might be social pressure or awkwardness if you don't." It encompasses a *huge* range:
      *   Conventions (driving side, tipping percentages).
      *   Moral norms (don't steal, help the elderly).
      *   Etiquette norms (chew with mouth closed, say "bless you").
      *   Group-specific norms (how to dress at a tech startup vs. a law firm).
  *   **Strengths:** Intuitive, broad, recognizes social expectation and pressure.
  *   **Weaknesses:** Vague. Doesn't clearly distinguish *why* a norm exists, *how* it emerges, or the specific *type* of problem it solves. It bundles together things with very different underlying logics (coordination vs. morality vs. group identity).

  **Lewis's Convention (The Precision Tool):**

  Lewis isn't just *describing* conventions; he's rigorously *defining* a specific *subset* of social norms that solve a very particular kind of problem, using game theory to explain their stability. Here's the comparison:

  1.  **Solves a Specific Problem: Coordination Equilibrium.**
      *   **Lewis:** The convention *must* solve a **recurring coordination problem** with **multiple equally good solutions (equilibria)**. Driving on the left vs. right solves the "avoid collision" problem equally well *as long as everyone picks the same side*. Tipping 15% vs. 20% solves the "compensate service staff without constant haggling" problem (in contexts where it's expected).
      *   **Folk Norm:** May or may not solve a coordination problem. A norm against public nudity might stem from moral/religious beliefs, not coordination. A norm of wearing black at funerals signals respect/solidarity, not necessarily coordination. Folk norms often solve *other* problems (morality enforcement, group cohesion, signaling).

  2.  **Arbitrariness is Core.**
      *   **Lewis:** **Arbitrariness is definitional.** The *only* reason to prefer solution A over solution B is that *everyone else expects A*. The solution itself has no intrinsic superiority. Left vs. right driving, "Hello" vs. "Hi," QWERTY vs. Dvorak keyboards.
      *   **Folk Norm:** Arbitrariness isn't essential. Many norms feel "right" for non-arbitrary reasons (moral conviction, perceived efficiency, tradition's inherent value). While tipping percentages *are* arbitrary, the folk concept doesn't *require* this.

  3.  **The Engine of Compliance: Self-Interest & Expectations.**
      *   **Lewis:** People conform **primarily out of rational self-interest**, *given their expectations* about others. I drive on the left *because I expect you to*, and deviating would be dangerous/inconvenient *for me*. I tip 20% *because I expect the server expects it*, and not doing so might lead to awkwardness or poor future service. The preference to conform is conditional on the expectation of others' conformity.
      *   **Folk Norm:** Compliance motivation is often vague. It might be self-interest, fear of sanction, habit, internalized morality, or a sense of duty. The folk concept doesn't isolate the specific *expectation-based, conditional preference* mechanism.

  4.  **The Glue: Common Knowledge.**
      *   **Lewis:** **Common knowledge is crucial.** It's not enough that everyone knows the rule. Everyone must know *that* everyone knows, know *that* everyone knows *that* everyone knows, and so on. This creates the robust mutual expectations that make the convention self-reinforcing and stable. If it weren't common knowledge that *everyone* drives on the left in the UK, you couldn't confidently rely on it.
      *   **Folk Norm:** While mutual awareness exists, the infinite regress of common knowledge isn't explicitly recognized or deemed necessary. The folk concept often stops at "people know what's expected."

  5.  **No Need for Agreement or Sanction.**
      *   **Lewis:** Conventions emerge and persist *without* explicit agreement, legislation, or centralized enforcement. Sanctions (disapproval, awkwardness) are a *byproduct* of the coordination failure, not the *source* of the norm. The source is the mutual expectations and self-interest.
      *   **Folk Norm:** Often implies some degree of collective agreement (even if implicit) and often includes the idea of sanctions for violation.

  **What the "Fancy Apparatus" Buys Lewis (The Special Sauce):**

  1.  **Explains Emergence & Stability:** Game theory shows *how* conventions can arise spontaneously from individual interactions in recurring coordination problems without a central planner. It explains *why* they are stable – deviating is irrational if you expect others to conform.
  2.  **Precisely Demarcates the Category:** It cleanly separates conventions (arbitrary coordination solutions) from other social norms (moral rules, efficiency norms, personal habits). This is crucial for analysis.
  3.  **Predictive Power:** The model allows us to predict when a convention might change (if expectations shift dramatically, e.g., mass migration between driving-side systems) or when coordination might fail (lack of common knowledge).
  4.  **Clarifies the Role of Arbitrariness:** It highlights that the *power* of the convention comes *entirely* from the shared expectation, not any inherent property of the action itself.

  **Margaret Gilbert's Critique: Where Lewis Falls Short (The "Wronged" Feeling)**

  Gilbert argues Lewis's model is brilliant but incomplete for capturing the *social* reality of conventions. Her key points:

  1.  **Obligation vs. Self-Interest:** Lewis explains compliance via self-interested expectations. Gilbert argues that when we break a convention, it often feels like we've **wronged others** or **violated an obligation**, not just been imprudent. We feel *accountable*. Cutting in line doesn't just cause delay; it feels *unfair*, a violation of a shared understanding we owe to others.
  2.  **The Plural Subject:** Gilbert proposes conventions are rooted in a "**plural subject**" – a "we" formed by joint commitment. When we participate in a convention, we're not just acting based on personal expectations; we're acting as members of a collective that has *jointly* accepted the rule. Breaking it is betraying that joint commitment.
  3.  **Lewis's Gap:** Lewis's model struggles to explain the *normative force* – the feeling that others have a *right* to expect conformity and a *right* to rebuke you for deviation. Self-interest explains *why I conform*, but not why others feel *entitled* to my conformity or why I might feel *guilty* for letting them down.

  **Is Gilbert Fair? Does Lewis Survive?**

  *   **Fairness:** Gilbert's critique is **highly relevant and points to a genuine limitation** in Lewis's purely expectation/self-interest model. It doesn't invalidate Lewis's analysis of *how* conventions function as coordination devices, but it highlights that his model undersells the *social bond* and sense of mutual obligation that often accompanies established conventions, especially deeply ingrained ones.
  *   **Survival:** Lewis's model **survives as a powerful analytical tool** for understanding the core *mechanism* of conventions – their emergence, arbitrariness, and stability based on expectations. It remains foundational in philosophy, economics, and social science. However:
      *   **It's a Narrow Slice:** It captures a specific *type* of social regularity (arbitrary coordination solutions) exceptionally well, but it's not a complete theory of *all* social norms or the full *phenomenology* of convention-following.
      *   **Gilbert Complements:** Gilbert (and others like Searle on "status functions" or Brennan et al. on "normativity") provides crucial insights into the *normative* and *collective intentional* aspects that Lewis downplays. The "feeling wronged" *is* a real part of many conventions.

  **Plain English Takeaway for Your Article:**

  Think of social norms as a big, messy toolbox. Lewis takes out *one specific, incredibly useful tool* – the adjustable wrench designed *only* for nuts and bolts that could be tightened just as well in another way.

  *   **The Folk Norm:** "We do this here because it's what we do. It feels right, people expect it, and it'd be weird/rude not to."
  *   **Lewis's Convention:** "We landed on *this particular* solution (out of several equally good options) for a problem where we *need* to be on the same page. We all keep doing it because we *all expect everyone else to do it*, and going rogue would backfire *on us individually*. It works purely because we're all reading from the same invisible script that we know everyone else is reading too."
  *   **Gilbert's Addendum:** "...and breaking that script doesn't just mess things up; it feels like you've broken a silent promise *we* all made to each other to keep this show running smoothly."

  Lewis gives you the intricate *mechanics* of why arbitrary habits stabilize. Gilbert reminds you that once stabilized, they often become part of the *social glue* holding people together, creating expectations that feel like obligations. Your editor gets the plain-English version by focusing on the "arbitrary solution to a teamwork problem held together by everyone knowing what everyone expects" core of Lewis, while acknowledging that breaking these habits often *feels* like more than just a practical mistake.
