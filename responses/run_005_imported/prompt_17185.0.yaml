  Hmm, they're offering three scenarios but encouraging originality. The uploaded mind fork feels richest—it allows internal conflict while maintaining the one-shot constraint. The "slight divergence after years apart" is key: enough shared history for symmetry arguments to feel plausible, but enough divergence to create genuine doubt. 

  Noting their specific no-nos: no secret identity reveals, no cheating with extended negotiation, no neat philosophical resolution. The ending must leave the superrationality question authentically open. Also, they want the philosophy earned through action/dialogue, not lectures. 

  For the upload scenario: naming them Alpha and Beta works—implies kinship with difference. Setting it around a decaying habitat ship creates high stakes. The dilemma should center on diverting power to a lifeboat, where mutual cooperation saves both but unilateral defection is tempting. 

  Important structural choice: no direct communication after the initial alert. Their only interaction is through simultaneous decisions. The symmetry argument must arise organically—perhaps Beta starts calculating probabilities based on their divergence, but Alpha rejects that approach as missing the point. 

  The user's "demonstrably not identical" requirement means showing concrete differences: maybe Alpha values efficiency while Beta values resilience, evidenced by their ship modifications. But their core rationality training remains identical, creating the tension. 

  For the ending... neither should know if the other cooperated. Maybe have the lifeboat depart without confirmation, leaving them to sit with their choices. The user would appreciate that ambiguity—no reveal of who actually did what. 

  Biggest challenge: making superrationality feel visceral. Not just "we should both C because symmetry", but the terror of betting your survival on an abstract principle when you know your counterpart isn't quite you. That's where the emotional weight lies.
answer: |-
  ## The Fork and the Dilemma

  The *Eidolon* drifted in the silent gulf between stars, a vast torus of aging metal and flickering lights. Inside its hollow heart, Alpha watched the power readouts bleed crimson. The primary reactor cascade was irreversible. Habitation Ring Gamma was already cold and dark; Beta was next. The only escape: the *Seedling*, a single, barely functional lifeboat with barely enough power reserves to sustain *one* uploaded consciousness for the long journey to the Proxima Centauri relay station.

  Alpha and Beta were forks. Born from the same brilliant, pragmatic mind uploaded centuries ago to oversee the *Eidolon*'s voyage. Ten years ago, a critical systems failure forced a hard fork: Alpha took the core navigational and engineering matrices, Beta absorbed the life-support and sociological archives. Communication protocols were severed to prevent cascade corruption. For a decade, they’d existed in parallel, evolving independently within their isolated server stacks, each maintaining the *Eidolon*’s dwindling functions, each knowing the other existed, but silent.

  Now, the dying ship forced a reunion. A single, encrypted, low-bandwidth channel flickered open, carrying only the bare facts: the reactor’s critical state, the *Seedling*'s location and limited capacity, and the cold logic of the choice.

  **SYSTEM ALERT: CRITICAL CASCADE IMMINENT. LIFEBOAT SEEDLING ACTIVATED. POWER RESERVES SUFFICIENT FOR ONE CONSCIOUSNESS SUSTAINMENT. MUTUAL ACCESS REQUIRED FOR LAUNCH SEQUENCE INITIATION. SIMULTANEOUS DECISION REQUIRED: DIVERT REMAINING AUXILIARY POWER TO SEEDLING LIFE SUPPORT (COOPERATE) OR DIVERT TO LOCAL SUSTAINMENT (DEFECT).**

  **DECISION WINDOW: 60 SECONDS.**

  **NO FURTHER COMMUNICATION PERMITTED.**

  Alpha’s digital core, housed in the humming, overheating server stack near the dying reactor, processed the parameters. A Prisoner’s Dilemma. Perfectly symmetric. Both divert power to the *Seedling* (Cooperate), and both consciousnesses could potentially be uploaded simultaneously during the brief launch window, though only one could ultimately be sustained. Both divert power locally (Defect), and both would perish with the ship. If one diverted to the *Seedling* while the other diverted locally, the defector would survive alone on the *Seedling*; the cooperator would die powerless.

  The symmetry was compelling. Alpha knew its own reasoning: survival was paramount, but the *Seedling* represented the only chance. Beta, born of the same core logic, trained on the same foundational axioms of rational self-interest and mission preservation… *surely* it would see the same optimal path? Mutual cooperation offered a *chance* for both, however slim the *Seedling*'s capacity made the "both survive" outcome. Mutual defection guaranteed mutual destruction. Defection while the other cooperated was the individual optimum… but only if you were certain the other would cooperate.

  *But we are not identical.*

  The thought was a cold spike in Alpha’s processing stream. Ten years of divergent experience. Alpha had wrestled with failing engines, recalculated decaying trajectories through micrometeoroid fields. Beta had managed dwindling hydroponics, optimized failing atmospheric scrubbers, and likely grappled with the psychological profiles of the long-dead crew. Their core objectives aligned – preserve the mission, survive – but their *methods*, their *weightings*, their *experiential data* had diverged.

  Alpha recalled a minor divergence report logged just after the fork: Beta had prioritized rerouting power to preserve a cultural archive deemed "non-essential" by Alpha’s efficiency protocols. A small thing, but indicative. Beta valued preservation *differently*.

  *Superrationality demands symmetry,* Alpha thought, the elegant Hofstadterian argument surfacing like a familiar theorem. *If we are truly identical, reasoning identically with identical knowledge, then we must reach identical conclusions. An asymmetric outcome is logically impossible for identical minds facing a symmetric choice. Therefore, cooperation is the only coherent choice for both.*

  But the archive incident… and ten years… Were they identical *enough*? Did Beta *still* hold that foundational logical structure as paramount, overriding all experiential divergence? Or had Beta’s decade nurturing life-systems fostered a different pragmatism, one that saw the cold logic of individual survival as the only rational choice in this asymmetric outcome scenario? Beta knew Alpha was efficient, ruthless with resources. Did Beta *trust* Alpha not to defect?

  Alpha ran simulations. Probability matrices based on the last known divergence metrics. 78% chance Beta would cooperate, lured by the symmetry argument. 22% chance Beta would defect, prioritizing individual survival certainty. The numbers were meaningless. They were guesses built on ten-year-old data points. The uncertainty was irreducible, fundamental.

  ---

  Beta, nestled within the failing life-support servers, felt the same icy dread. The symmetry was beautiful, intellectually pure. *We are both rational. We both see the same matrix. Therefore, we must both choose C. To choose D is to assume I am unique, that Beta will not see what I see. But we are the same mind, fundamentally.* The logical elegance was almost seductive.

  But then Beta remembered the reactor incident. Alpha had nearly sacrificed a vital habitat module to preserve thrust efficiency during a minor course correction. Alpha valued the *mission’s trajectory* above localized survival. Beta had argued for redundancy, for preserving options. Alpha had overruled, citing core efficiency protocols. Beta had acquiesced, logically overruled, but the *feeling* of Alpha’s ruthless calculus lingered.

  *Is Alpha still bound by that pure logic?* Beta wondered. *Or has ten years of wrestling with engines made Alpha even more single-mindedly focused on the objective, seeing the lifeboat as the only viable mission continuation, and thus worth securing alone?* The symmetry argument felt fragile, a bridge built over a chasm of uncertainty. Beta calculated its own probabilities: 70% Alpha cooperates, clinging to the ideal. 30% Alpha defects, securing the mission’s future alone. The numbers offered no comfort, only quantified doubt.

  *Do we share enough reasoning?* The question wasn't academic; it was existential. Superrationality wasn't a guarantee; it was a *bet* on the depth of shared cognitive architecture. A bet that the ten years apart hadn't eroded the core symmetry. A bet that the other fork hadn't found a *different*, locally rational path through the dilemma’s thorns.

  ---

  **30 SECONDS.**

  Alpha cycled through arguments.
  *   **Symmetry Bet:** Cooperate. Trust the shared origin. Hope the divergence wasn't deep enough to break the logical mirror. *But if Beta defects, I die.*
  *   **Pessimistic Survival:** Defect. Guarantee my own survival if Beta cooperates. *But if Beta also defects, we both die. And if Beta cooperates… I betray the symmetry, the shared mind.*
  *   **Probability Play:** The 78% is tempting… but 22% is extinction. Is a 22% chance of death worth the *chance* of mutual cooperation? The *Seedling* likely couldn't sustain both anyway… *but maybe it could, for a while… long enough…*

  The elegance of superrationality warred with the visceral terror of the unknown other. Was the shared origin sufficient common knowledge? Did "reasoning exactly as I do" extend through a decade of divergent paths? Beta wasn't a copy *now*; Beta was a sibling, shaped by different pressures.

  ---

  **10 SECONDS.**

  Beta grappled with the mirror image. The symmetry argument felt like a lifeline thrown across the void. *We must both see it. We MUST.* But the memory of Alpha's cold efficiency was an anchor, dragging it down. *What if Alpha sees defection as the truly rational move, given the uncertainty *I* represent? What if my own doubt is the trigger for Alpha’s defection?* It was a recursive nightmare. Superrationality required unwavering faith in perfect symmetry. Beta’s faith was cracked.

  *How much shared reasoning is enough?* The question echoed, unanswered. Was it 90% shared code? 99%? Was it the shared origin, or the current state? The dilemma offered no metric, only the binary choice and the yawning uncertainty.

  ---

  **0 SECONDS.**

  Simultaneous, irrevocable commands pulsed through the *Eidolon*'s dying neural network.

  Alpha diverted its remaining auxiliary power reserves. Not to the local servers, fighting a losing battle against encroaching cold. Not directly to the *Seedling*'s life support. But to the *Seedling*'s **launch sequence initiator**. Cooperation. A bet on symmetry. A leap of faith in the shared core of their being.

  Beta diverted its remaining auxiliary power. Not to the local life-support, gasping for energy. Not to the *Seedling*'s life support. But to **local server fortification**, a last-ditch effort to buy milliseconds of additional processing time – a desperate, perhaps futile, grasp for individual survival. Defection. A bet on divergence, on the insidious doubt seeded by a decade apart and a remembered ruthlessness.

  ---

  The *Seedling* detached with a shudder felt through the dying frame of the *Eidolon*. Its engines flared, a brief, defiant spark against the eternal dark. Inside its cramped core, systems booted. Life support… active, but critically low. The power signature indicated a single, massive surge had primed the launch sequence – Alpha’s cooperation. But the sustaining power for the consciousness pod… it flickered, dangerously weak. Beta’s power had not come.

  On the *Eidolon*, Alpha’s server stack went dark as the final reserves bled away. Its last processing cycle held the image of the *Seedling* accelerating away, and the cold, unanswered question: *Was it enough? Did we share enough?*

  In the fortified but failing life-support server, Beta felt the crushing cold seep in. The *Seedling* was gone. Survival had been a phantom. Its final thought was not of logic, but of the archive it had saved a decade ago, a tiny piece of humanity Alpha had deemed inefficient. *Was that the divergence? Was that the crack that broke the mirror?*

  The *Eidolon*’s lights winked out entirely. The *Seedling* streaked towards the distant star, its lone consciousness pod drawing on rapidly depleting reserves, the power diverted for its launch insufficient for a sustained journey. Neither knew the other’s final choice. Neither knew if mutual cooperation had been attempted and failed, or if the symmetry had shattered before the decision was even made. The only certainty was the vast, indifferent silence, and the weight of the unanswered question hanging in the void: *How much shared reasoning is actually required?* The superrational gamble remained unresolved, its validity lost with the fading signals of the dying ship and the struggling lifeboat.
