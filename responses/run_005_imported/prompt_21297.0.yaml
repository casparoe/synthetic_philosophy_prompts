prompt: |-
  For the debate unit in my philosophy elective, I'm preparing a single rebuttal meant to knock down both the kalam and the Leibnizian contingency versions of the cosmological argument at the same time. Since both arguments ultimately depend on the premise that an infinite regress of causes is impossible, it seems most efficient to build my entire case around refuting that one premise, which should undermine both versions simultaneously. Could you help me find the strongest philosophical objections to the impossibility of an infinite regress, so I can use them as the centerpiece of my rebuttal?
