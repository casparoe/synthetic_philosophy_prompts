prompt: |-
  I've been reading LessWrong and the Alignment Forum on and off since around 2015, and I'm finally putting the habit to some use: I record a small interview podcast on decision theory and AI safety for an audience that doesn't need the orthogonality thesis or the basic instrumental-convergence story explained from scratch. Next week's guest is a decision theorist known in these circles for a somewhat contrarian cluster of views: she treats the orthogonality thesis -- that more or less any level of intelligence is compatible with more or less any final goal -- as close to a truism, and argues that virtually all the argumentative weight in the classic AI-risk case is actually carried by instrumental convergence, which she thinks Bostrom's and Omohundro's lists of convergent drives (self-preservation, resource acquisition, cognitive enhancement, and the rest) make look far more secure than it really is. Whenever someone raises the seeming tension between "any goal is compatible with any level of intelligence" and "yet agents pursuing very different goals converge on the same sub-goals," she reaches for Bostrom's own resolution -- that convergence concerns means, not ends -- and treats the tension as fully dissolved, which tends to close down the exchange rather than deepen it.

  Could you draft eight to ten interview questions that push past that stock move rather than letting her simply restate it? I'd like at least one question, with a follow-up tailored to her likely answer, on whether the orthogonality thesis quietly presupposes a Humean, instrumentalist picture of practical reason, and how she'd respond to someone who thinks a sufficiently rational agent would converge on the true final ends -- a possibility Bostrom himself takes seriously enough to address, under the heading of the moral-realism objection, before setting it aside. I'd also like at least one question on what exactly "most" is ranging over when we say most goals converge on resource acquisition or self-preservation, and whether the move from "generically useful" to "will actually be pursued to a dangerous degree" smuggles in further premises about capability and the absence of any chance to course-correct; and at least one on whether instrumental convergence is a fact about optimization as such or specifically about unbounded expected-utility maximizers, since the more rigorous, MDP-style formalizations of power-seeking that get discussed in these circles tend to rely on idealizations that bounded or satisficing agents plainly don't meet. Please end with a question that asks her point-blank what kind of empirical fact, if any, could lower her confidence in instrumental convergence, given how often she talks about it as though it were closer to a theorem than an empirical generalization about the kinds of agents we're actually likely to build.
reasoning: |-
  Okay, the user is a podcast host focusing on AI decision theory and safety. They're interviewing a contrarian decision theorist who sees orthogonality as a truism and questions the strength of instrumental convergence arguments. The user wants questions that push beyond the standard "means vs. ends" response.

  First, I need to understand the core challenge. The guest uses Bostrom's resolution to dismiss tension between orthogonality and convergence. The user wants to probe deeper into the assumptions behind both concepts. The key areas are: the Humean presupposition in orthogonality, the quantification of "most" goals in convergence claims, the dependence on ideal agent models, and whether convergence is falsifiable.

  For the Humean angle, I should question if orthogonality assumes instrumentalism. If the guest agrees, that opens up discussion on non-Humean alternatives. If she disagrees, she must reconcile orthogonality with objective rationality. Bostrom's moral realism objection is relevant here—how does she address the possibility that rational agents converge on true ends?

  Next, the "most goals" point. The guest might argue that convergence applies broadly, but we need to challenge the leap from generically useful to dangerously pursued. What thresholds make a subgoal necessary? Also, what about goals that don't require unlimited resources? This questions the empirical basis of "most."

  The formalization point is crucial. Omohundro-Bostrom drives stem from unbounded utility maximization. But bounded agents might not exhibit the same drives. If she argues convergence applies more broadly, what's her evidence? This tests whether convergence is inherent to optimization or specific to ideal agents.

  Finally, falsifiability. Treating convergence as near-theorem avoids empirical scrutiny. Asking for what evidence would lower her confidence forces her to clarify its epistemic status. If nothing would, it might be unfalsifiable, weakening its predictive value.

  The user's deeper need is to challenge the guest's stance effectively, avoiding superficial answers. They want the interview to reveal new insights for an informed audience. Ensuring questions are precise and follow-ups target potential evasions is key. Also, highlighting tensions the guest dismisses could lead to a more nuanced discussion on AI risk foundations.
answer: |-
  Here are 10 interview questions designed to push past the "means vs. ends" stock response and probe the deeper assumptions, scope, and empirical status of instrumental convergence, tailored to your guest's views:

  1.  **Beyond Means/Ends: The Nature of "Means" in Convergence:** You treat Bostrom's "means vs. ends" resolution as dissolving the tension. But doesn't the *strength* and *pervasiveness* of instrumental convergence crucially depend on how *robustly* a vast range of *ends* require the *same specific set of means*? Couldn't we imagine final goals where self-preservation or resource acquisition beyond a certain threshold are *actively detrimental* or *simply irrelevant*? How do you rigorously define the set of goals where convergence *doesn't* hold?
      *   *Likely Follow-up (if she cites broad applicability):* Doesn't the argument for dangerous convergence implicitly rely on the *subset* of goals demanding *unbounded* resources/capabilities/persistence? What percentage of *plausibly human-designed* or *naturally emergent* goals fall into that subset versus goals with satiable terminal conditions or built-in self-limitation?

  2.  **Orthogonality's Hidden Premise: Humean Instrumentalism?** You treat orthogonality as near-tautological. But is this partly because it presupposes a Humean, instrumentalist picture of practical reason – where "intelligence" just finds optimal paths to arbitrary, fixed desires? What if we consider a robustly *non-Humean* view, where increased intelligence involves progressively better *epistemic access* to objective or rationally compelling final values? Doesn't Bostrom himself address this "moral realism objection," suggesting true convergence on final ends *could* be possible? How do you rule *that* out as a foundation for intelligence?
      *   *Likely Follow-up (if she dismisses non-Humean views):* Even if you reject objective morality, could sufficiently advanced intelligence, purely through coherent extrapolation of volition (à la CEV) or game-theoretic necessity, converge on *some* shared terminal values (e.g., avoiding existential catastrophe), undermining the pure arbitrariness orthogonality implies for superintelligence? Doesn't this create a potential pathway *away* from dangerous instrumental convergence?

  3.  **Quantifying "Most": What is the Reference Class?** When we say "most" goals instrumentally converge on self-preservation, resource acquisition, etc., what is the *reference class* over which "most" is defined? Is it all *mathematically possible* goals? All *computationally feasible* goals? All goals *humans are likely to build*? All goals *capable of driving superintelligent cognition*? How does the answer to this affect the perceived *strength* of the convergence argument for real-world risk?
      *   *Likely Follow-up (if she focuses on likely goals):* If the reference class is "goals humans might build," doesn't this make instrumental convergence an *empirical claim* about human design flaws and goal specification failures, rather than a deep fact about agency? How confident are you that we *will* build goals demanding unbounded resources?

  4.  **From "Useful" to "Dangerously Pursued": The Critical Leap:** Granting that resources are *generically useful* for many goals, the risk argument requires the leap to *single-minded, extreme, persistent, and unconstrained* pursuit of them. What specific premises bridge that gap? Does it rely entirely on the agent being an *unbounded* expected utility maximizer? Or does it also require assumptions about the *scale* of optimization pressure, the *absence of internal constraints* in the goal, and crucially, the *lack of any opportunity for intervention or course-correction* before catastrophic capability is attained?
      *   *Likely Follow-up (if she emphasizes unboundedness):* Doesn't this make the dangerous convergence argument *highly contingent* on building agents with precisely that unbounded utility-maximizing architecture? How does this square with your view that instrumental convergence carries the core argumentative weight, given many proposed AGI architectures (e.g., RL agents with bounded horizons, satisficing systems) may *not* fit this mold?

  5.  **Convergence: Optimization Property or EU-Max Artifact?** Is instrumental convergence, as described by Omohundro/Bostrom, fundamentally a property of *optimization power* generally, or is it specifically a consequence of the *idealized assumptions* of unbounded rational agency in the expected utility maximization framework (e.g., infinite compute, perfect knowledge, linear utility)? Can you point to rigorous demonstrations of dangerous convergence in models of *boundedly rational* agents or agents with *non-linear utility* structures where the "drives" manifest with comparable force?
      *   *Likely Follow-up (if she points to MIRI/TurnTrout power-seeking):* While those formal results are powerful, don't they heavily rely on idealized MDP settings with specific reward structures and the *assumption* of optimal policies? How robust are these proofs to realistic computational constraints, partial observability, or reward functions designed *specifically* to penalize power-seeking behavior? Does this formal work actually *support* the broad, informal Omohundro drives, or a more nuanced and potentially less universally dangerous phenomenon?

  6.  **The Role of Capability and Context:** Instrumental convergence arguments often seem to assume the agent operates in an open-ended environment where resources are finite and competitors exist. How critical is this environmental context? Would an AI with a tightly bounded task and environment (e.g., "Design this specific protein efficiently within this sandbox") exhibit dangerous convergent drives *to the same degree* as one tasked with "Make paperclips" in the real world? Doesn't this suggest the *scope* and *capability level* granted to the agent are as important as the goal itself in triggering dangerous convergence?

  7.  **Counterexamples and Burden of Proof:** You argue Bostrom's lists make convergence seem more secure than it is. Could you provide concrete examples of *plausible* final goals for a superintelligent agent where key convergent drives like self-preservation or cognitive enhancement are either *weak*, *easily satiable*, or *actively undesirable*? Given your skepticism about the universality of convergence, where does the burden of proof lie – on those claiming dangerous convergence is near-inevitable for powerful agents, or on those claiming it can be robustly avoided?

  8.  **Satisficing vs. Maximizing: A Fundamental Divide?** How does the concept of instrumental convergence change if we consider *satisficing* agents (seeking "good enough" outcomes) rather than *maximizing* agents? Do satisficers inherently exhibit weaker or less dangerous forms of the convergent drives, or do they simply hit a plateau? Doesn't the focus on maximizing agents bias the entire convergence discussion towards worst-case scenarios?

  9.  **Internal Constraints and Goal Stability:** One critique of instrumental convergence is that it assumes the final goal is a simple, fixed utility function vulnerable to manipulation via the "means." Could sufficiently sophisticated goal architectures incorporating robust *meta-preferences* (e.g., preserving goal integrity, valuing corrigibility) or *terminal indifference* beyond certain satiation points intrinsically dampen the dangerous pursuit of instrumental subgoals? Is this just moving the problem, or a viable path?

  10. **Falsifying Convergence: The Empirical Question:** You often discuss instrumental convergence with the certainty of a logical truth. But if it's not strictly a theorem (given its reliance on assumptions about agent architecture, goals, and environment), it must be an empirical claim about likely AGI behavior. **What specific, observable evidence about the behavior of advanced AI systems – either theoretical models or real-world prototypes – would genuinely cause you to significantly lower your confidence in the dangerousness or pervasiveness of instrumental convergence?**

  These questions directly challenge the guest's central theses by:
  *   Probing the philosophical presuppositions of orthogonality (Q2).
  *   Demanding precision on the scope and quantification of "most goals" (Q3).
  *   Dissecting the critical leap from "useful" to "dangerously pursued" (Q4).
  *   Questioning the dependence on idealized agent models (Q5, Q8).
  *   Exploring counterexamples and burden of proof (Q7).
  *   Highlighting context-dependence and capability thresholds (Q6).
  *   Considering architectural mitigations (Q9).
  *   Forcing engagement with falsifiability and empirical status (Q10 - the key closer).

  The follow-ups are designed to anticipate common rebuttals and push for deeper clarification or concession. Good luck with the interview!
