answer: |-
  Okay, let's dive deep into this fascinating rabbit hole. You're asking exactly the right questions, and I'll break it down step-by-step with a concrete example. Forget the betting for a moment; we're going to build the accuracy-dominance argument from the ground up.

  **Core Idea Recap:**

  1.  **Probabilism:** Rational degrees of belief (credences) must satisfy the axioms of probability: Non-negativity (P(A) >= 0), Normalization (P(Tautology) = 1), and Additivity (If A & B mutually exclusive, P(A v B) = P(A) + P(B)).
  2.  **Accuracy-Dominance Argument:** If your credences violate *any* probability axiom, there exists an alternative set of credences that is *strictly more accurate* than yours *in every logically possible world state*. Your credences are **accuracy-dominated**.
  3.  **Strictly Proper Scoring Rule:** This is the engine that makes the argument work. A scoring rule S(C, w) measures the inaccuracy of credence C when the actual world state is w. "Strictly Proper" means: *Your own credence function uniquely minimizes your expected inaccuracy according to itself.* In simpler terms: If you *truly* believe P(A) = p is correct, then reporting p minimizes the inaccuracy score you *expect* to get (based on your own belief p). Any other report q ≠ p would look *worse* to you in expectation. Brier Score is strictly proper.

  **Let's Build the Toy Example: 2 Mutually Exclusive Propositions**

  Imagine a single coin flip. We care about two propositions:
  *   **A:** "Heads lands" (H)
  *   **B:** "Tails lands" (T)
  They are mutually exclusive (H & T cannot both be true) and exhaustive (one must be true). So, the possible worlds are:
  *   **w1:** H True, T False
  *   **w2:** H False, T True

  **The Coherent Agent (Probabilist):**
  *   Assigns P(H) = h, P(T) = t, obeying additivity: h + t = 1 (since H and T are mutually exclusive & exhaustive).
  *   Example: P(H) = 0.6, P(T) = 0.4.

  **The Incoherent Agent (Violates Additivity):**
  *   Assigns credences that *don't* sum to 1. This violates the additivity axiom because P(H v T) = P(True) = 1, but P(H) + P(T) ≠ 1.
  *   Example: Cred_H = 0.6, Cred_T = 0.7. (Notice 0.6 + 0.7 = 1.3 > 1).

  **The Weapon: Strictly Proper Scoring Rule (Brier Score)**
  *   Inaccuracy for a single proposition X with credence c, in world w:
      `S(c, w) = (TruthValue(X, w) - c)^2`
      *   TruthValue(X, w) = 1 if X is true in w, 0 if false.
  *   **Total Inaccuracy** for our agent across both propositions in world w:
      `Total_S(Cred, w) = S(Cred_H, w) + S(Cred_T, w)`
      `= [ (Truth_H - Cred_H)^2 + (Truth_T - Cred_T)^2 ]`

  **Calculating Inaccuracy for the Incoherent Agent (Cred_H=0.6, Cred_T=0.7) in all worlds:**

  1.  **World w1 (H True, T False):**
      *   S(0.6, w1) for H = (1 - 0.6)^2 = (0.4)^2 = 0.16
      *   S(0.7, w1) for T = (0 - 0.7)^2 = (-0.7)^2 = 0.49
      *   **Total Inaccuracy (w1): 0.16 + 0.49 = 0.65**
  2.  **World w2 (H False, T True):**
      *   S(0.6, w2) for H = (0 - 0.6)^2 = (-0.6)^2 = 0.36
      *   S(0.7, w2) for T = (1 - 0.7)^2 = (0.3)^2 = 0.09
      *   **Total Inaccuracy (w2): 0.36 + 0.09 = 0.45**

  **Finding the Dominating Coherent Credence:**
  The argument claims there exists a coherent credence (h, t) with h + t = 1 that is *more accurate* than (0.6, 0.7) in *both* w1 and w2. How do we find it? This is where **strict propriety** and **convexity** come in.

  1.  **Identify the Problem:** The incoherent point (0.6, 0.7) lies *outside* the "coherent plane" (the line h + t = 1 in our 2D credence space).
  2.  **Project Onto the Coherent Plane:** For strictly proper scoring rules like Brier, the *dominating* coherent credences often correspond to a kind of "projection" of the incoherent point onto the coherent set. A common method is to find the coherent point that minimizes the *expected score relative to the incoherent credence itself* (exploiting propriety). For Brier, a simple geometric projection works.
      *   We need a point (h, t) on the line h + t = 1 that is "closest" to (0.6, 0.7) in terms of the Brier score's natural geometry (Euclidean distance).
      *   Solve: Minimize (h - 0.6)^2 + (t - 0.7)^2 subject to h + t = 1.
      *   Substitute t = 1 - h: Minimize (h - 0.6)^2 + ((1 - h) - 0.7)^2 = (h - 0.6)^2 + (0.3 - h)^2
      *   Take derivative w.r.t h: 2(h - 0.6) + 2(0.3 - h)(-1) = 2h - 1.2 - 0.6 + 2h = 4h - 1.8
      *   Set derivative = 0: 4h - 1.8 = 0 => h = 1.8 / 4 = **0.45**
      *   Then t = 1 - h = **0.55**
      *   **Dominating Coherent Credence: P(H) = 0.45, P(T) = 0.55**

  **Calculating Inaccuracy for the Dominating Coherent Agent (Cred_H=0.45, Cred_T=0.55) in all worlds:**

  1.  **World w1 (H True, T False):**
      *   S(0.45, w1) for H = (1 - 0.45)^2 = (0.55)^2 = 0.3025
      *   S(0.55, w1) for T = (0 - 0.55)^2 = (-0.55)^2 = 0.3025
      *   **Total Inaccuracy (w1): 0.3025 + 0.3025 = 0.605**
  2.  **World w2 (H False, T True):**
      *   S(0.45, w2) for H = (0 - 0.45)^2 = (-0.45)^2 = 0.2025
      *   S(0.55, w2) for T = (1 - 0.55)^2 = (0.45)^2 = 0.2025
      *   **Total Inaccuracy (w2): 0.2025 + 0.2025 = 0.405**

  **The Domination:**

  *   In **w1 (H, ~T)**:
      *   Incoherent Score: **0.65**
      *   Coherent Score: **0.605** (0.605 < 0.65)
  *   In **w2 (~H, T)**:
      *   Incoherent Score: **0.45**
      *   Coherent Score: **0.405** (0.405 < 0.45)

  **There it is!** The coherent credence (0.45, 0.55) achieves a *strictly lower* (better) Brier score than the incoherent credence (0.6, 0.7) in *every single possible world*. The incoherent credence is accuracy-dominated.

  **Why Strict Propriety is Crucial:**

  1.  **Guarantees the Existence of a Dominator:** The mathematical properties of strictly proper scoring rules (like Brier) ensure that *any* incoherent credence function *will* be accuracy-dominated by *some* coherent one. Non-strictly-proper rules don't guarantee this.
  2.  **Prevents "Fake" Dominance:** Imagine a silly rule like "S(c, w) = 0 if c=0.5, otherwise 1". This isn't proper. An incoherent agent (Cred_H=0.6, Cred_T=0.7) gets S=1 in all worlds. A coherent agent (Cred_H=0.5, Cred_T=0.5) gets S=0 in all worlds. *Technically* dominated? Yes. But this is meaningless! The coherent agent gets 0 *only because* the rule arbitrarily favors 0.5. It doesn't genuinely track accuracy. A proper rule ensures the dominating coherent credence is genuinely "better" based on a sensible measure of closeness to truth.
  3.  **Connects to Expectation (The Root of the Argument):** The deeper proof relies on a theorem (often based on expectations or separation theorems in convex analysis). It shows that because the coherent credences form a convex set, and because a strictly proper scoring rule makes that set "expectation-consistent," any point outside (incoherent) can be separated by a plane, meaning there's a coherent point that looks better *from the perspective of every possible world*. Non-proper rules break the convex structure or the expectation link.

  **Brier at Work:** You use Brier *because* it's strictly proper! It incentivizes honest reporting. If your true probability is p, reporting p minimizes your *expected* Brier score. Reporting q ≠ p would look worse *to you* in expectation. This property makes it great for calibration. You don't think about propriety because the rule you chose *has* it, which is why it works well.

  **Dutch Book vs. Accuracy-Dominance: Which is Stronger & Why "Nonpragmatic" Matters**

  *   **Dutch Book Argument (DBA):**
      *   **Mechanism:** Connects incoherence to guaranteed monetary loss in a betting scenario.
      *   **Strength:** Highly intuitive, concrete consequence (losing money sucks!).
      *   **Weaknesses:**
          *   **Pragmatic:** It justifies probabilism based on *practical* consequences (avoiding financial loss). Is rationality *only* about avoiding financial loss? What about beliefs concerning things you can't bet on (e.g., historical facts, fundamental constants)?
          *   **Interpretation of "Bet":** Are the "bets" meant literally? If so, real-world bookies don't operate this way. Are they just a metaphor for valuing degrees of belief? If a metaphor, why is the *pragmatic* consequence the driving force?
          *   **Dependency on Values:** The force of the argument depends on the agent caring about the specific stakes involved in the Dutch Book. What if they don't care about money?
          *   **"Rationality as Consistency":** It portrays rationality as avoiding a kind of inconsistency that can be exploited. This is powerful but arguably narrow.

  *   **Accuracy-Dominance Argument (ADA):**
      *   **Mechanism:** Connects incoherence to epistemic inferiority: being *less accurate* than an alternative *no matter how the world turns out*.
      *   **Strength:**
          *   **Nonpragmatic (Epistemic):** This is the **major selling point**. It justifies probabilism based purely on the *epistemic goal* of belief: **having accurate beliefs, representing the world correctly, seeking truth.** Accuracy is a fundamental epistemic good. ADA says incoherent beliefs are defective *as beliefs*, regardless of any practical consequences. They are objectively worse tools for representing the state of the world.
          *   **Universality:** Applies to *any* belief, bettable or not. Its force doesn't depend on contingent desires (like avoiding monetary loss).
          *   **Directness:** Targets the core function of belief head-on (representing truth).
          *   **Elegance:** Leverages beautiful mathematics (convexity, propriety).

  **Why "Nonpragmatic" is a Huge Deal, Not a Footnote:**

  1.  **Defining Epistemic Rationality:** Philosophers of epistemology want to understand what makes beliefs rational *qua beliefs*, not just as tools for action. The ADA provides a foundation for *epistemic* normativity (what you *ought* to believe) grounded in the intrinsic goal of truth/accuracy. The DBA grounds it in practical normativity (what you *ought* to do to avoid loss).
  2.  **Scope:** ADA applies universally to all beliefs. DBA seems most compelling for beliefs directly tied to actions with stakes.
  3.  **Purity:** ADA avoids potential "contamination" from debates about utility, risk-aversion, or the nature of betting. It isolates the epistemic flaw in incoherence.
  4.  **Foundational:** It fits better within a broader picture where epistemic rationality is about pursuing truth/accuracy/understanding for its own sake. The DBA risks making epistemic rationality parasitic on practical rationality.

  **Which is Stronger?**

  *   **Logically:** Both are valid arguments for probabilism under their assumptions. Neither is "logically stronger" in the sense of having a stricter conclusion.
  *   **Persuasiveness:** Depends on the audience.
      *   For someone focused on practical decision-making, the DBA might initially seem more forceful ("You'll lose money!").
      *   For someone focused on the nature of belief, knowledge, and truth, the ADA is profoundly more compelling and satisfying. It addresses the core issue directly.
  *   **Philosophical Significance:** The ADA is widely considered the **stronger *epistemic_** argument. The "nonpragmatic" nature is its defining strength and why it caused such a stir (Joyce's 1998 paper was a landmark). It provides a vindication of probabilism based solely on the intrinsic goals of cognition. The DBA is seen as important but ultimately pragmatic.

  **In Conclusion:**

  The accuracy-dominance argument shows that violating probability axioms makes your beliefs *epistemically self-defeating*: there's *always* a coherent alternative that is unambiguously more accurate, no matter what reality looks like. This hinges critically on using a scoring rule like Brier that is **strictly proper**, ensuring the dominance is genuine and unavoidable. The **nonpragmatic** nature of this argument—it condemns incoherent credences purely for being worse at representing the truth, not for causing practical losses—is its revolutionary philosophical contribution. It grounds the laws of probability directly in the fundamental epistemic norm: **Believe Truthfully!** While the Dutch Book argument is powerful, it ultimately ties rationality to avoiding practical harm, leaving the purely epistemic question unanswered. The accuracy-first approach tackles that question head-on.
