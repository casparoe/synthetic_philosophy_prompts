  Ok so this has been bugging me for days. I'm auditing a modal logic seminar and my friend Priyanka (who's writing her thesis on phil of religion) walked us through Godel's ontological argument -- the modern one with "positive properties" and S5, not the medieval Anselm thing everyone already knows -- and it turned into a whole argument between us. She thinks its basically worthless because of a "modal collapse" result that she says shows the axioms force EVERY true statement to be necessarily true, not just God's existence. I said that sounded like a wildly strong thing to sneak out of a handful of axioms about positive properties and essences, and that if the argument really implied literally nothing is contingent, someone would've caught that ages ago and the whole framework would've been dropped instead of still being argued about in papers. She said that's basically exactly what happened -- some guy named Sobel found this in the 80s, and apparently Godel sat on the proof for decades before finally letting a colleague see it -- and that the only reason people still take it seriously is that there are patched-up versions which supposedly dodge the collapse, though shes skeptical those patches don't just quietly give up whatever made the original argument interesting. We went back and forth over pizza for like two hours and I still don't actually get the mechanism.

  Could you explain -- intuitively, not the full formal derivation with quantifying over properties and accessibility relations -- how you actually get from "positive properties combine consistently, being God-like (having all of them) is itself one of them, and necessary existence is also one of them" all the way to "therefore nothing is contingent"? Like, what's actually doing the collapsing there? And separately: do the standard fixes (I think one of them involves dropping half of the axiom that says a property is positive iff its negation isn't) actually solve the problem, or do they just relocate it / quietly weaken the argument into something that no longer proves what it was originally supposed to prove? Mostly I want to understand this well enough to know who actually won the pizza argument.
