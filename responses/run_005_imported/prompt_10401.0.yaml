prompt: |-
  I'm on the steering committee for a small open-source proof assistant library (dependently typed, kinda Coq/Agda-ish), and we need to settle a fight before the vote next week. Half the maintainers want the core library to stay fully constructive -- no excluded middle, no choice -- so every theorem still extracts to an actual runnable program, and they worry even 'harmless' classical lemmas quietly poison extraction elsewhere in the library. The other half say that's a purity fetish: most of their proofs never get extracted anyway, case-splits on real numbers are miserable without LEM, and since double-negation translation embeds classical logic into intuitionistic logic anyway, they figure the whole fight is basically just notation. Can you draft the actual memo I'll bring to the meeting -- a real recommendation (ban classical axioms outright, allow them but walled off in there own namespace, whatever's defensible), with reasons, that takes the other side's strongest point seriously instead of just name-checking it?
reasoning: |-
  We are going to draft a memo that addresses both sides of the argument and proposes a balanced solution. The key points from both sides:

  **Constructivist Side (Against Classical Axioms):**
  - Want to preserve extraction: every theorem should extract to runnable code.
  - Worry that even "harmless" classical lemmas might have unintended consequences on extraction elsewhere (e.g., through the use of propositions that become non-informative).
  - Purity in the core library: the core should be entirely constructive to serve as a trustworthy base.

  **Classical Side (For Classical Axioms):**
  - Many proofs (especially in higher-level theories) are not meant for extraction, so why restrict?
  - Doing mathematics without classical axioms (like LEM) can be very cumbersome, especially for real analysis.
  - Double-negation translation allows embedding classical logic, so it's just a matter of convenience (notation).

  **Proposal:**
  We propose a middle ground: **allow classical axioms but only in a clearly marked namespace (or module) and with a clear mechanism to prevent accidental leakage into the core constructive parts.**

  **Reasoning:**
  1. **Extraction Purity:** The core library should remain constructive to satisfy the extraction requirement. By walling off classical axioms in their own namespace, we ensure that the core definitions and theorems remain constructive. This namespace separation will require explicit import to use classical reasoning, making it clear when a development relies on classical axioms.

  2. **Practicality for Mathematics:** For parts of the library that are inherently classical (like real analysis), forcing constructive proofs can be prohibitively difficult and can deter potential contributors. By providing a classical namespace, we allow these developments to proceed without compromising the core.

  3. **Double-Negation Translation:** The argument that classical logic can be embedded via double-negation is valid, but it is often cumbersome in practice. Having direct classical axioms can improve readability and maintainability of proofs. However, we note that the double-negation translation is an important tool for interoperability between classical and constructive parts. We can provide tooling to apply this translation automatically when needed (e.g., when extracting a classical proof that uses the axioms to a constructive one via translation).

  4. **Preventing Leakage:**
     - **Namespace Separation:** The classical axioms (like `EM : forall P, P \/ ~P` and `Choice`) will live in a module, say `Classical`. To use them, one must explicitly open `Classical` or use qualified names.
     - **Extraction Flag:** The extraction mechanism can be designed to throw an error (or at least a warning) if any part of the code being extracted uses definitions from the `Classical` module. This ensures that no classical axiom accidentally slips into an extracted program.
     - **Documentation:** Clearly document that the `Classical` module breaks extraction and should be avoided in any development that is intended for code extraction.

  5. **Strongest Point of the Classical Side:** We acknowledge that many proofs are not extracted and that without classical axioms, some areas of mathematics become very difficult. Therefore, we allow classical reasoning in the library, but only in a controlled way that doesn't force the entire library to become classical.

  6. **Strongest Point of the Constructivist Side:** We agree that the core library must remain constructive to preserve the extraction property. Therefore, we will enforce that the core definitions (in the root namespace) are constructive. The classical module will not be part of the core and must be explicitly imported.

  **Recommendation:**
  - **Ban classical axioms from the core namespace.**
  - **Provide a separate module (e.g., `Classical`) that contains classical axioms and lemmas derived from them.**
  - **Require explicit import of the `Classical` module for any development that wants to use classical reasoning.**
  - **Implement an extraction check that fails (or warns) if the code being extracted depends on the `Classical` module.**
  - **Provide tooling (as a separate plugin or library) to help with double-negation translation for users who wish to use classical results in an extracted program (but note that this translation might not always be straightforward).**

  **Conclusion:**
  This approach balances both concerns: it keeps the core constructive and extraction-safe, while allowing classical reasoning for parts of the library that require it. It also addresses the argument about double-negation translation by acknowledging it as a theoretical tool but recognizing the practical need for classical axioms in some contexts.

  **Memo Draft:**

  ---

  **To:** Steering Committee and Maintainers  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Proposal for Handling Classical Axioms in the Core Library  

  ### Introduction
  This memo addresses the ongoing debate regarding the use of classical axioms (excluded middle, choice, etc.) in our core library. We recognize two valid positions:  
  1. **Constructivist View:** The core library should remain entirely constructive to ensure that every theorem can be extracted to runnable code.  
  2. **Classical View:** Classical axioms are essential for practical mathematics in some areas and can be allowed since double-negation translation theoretically embeds classical logic into intuitionistic logic.  

  After careful consideration, we propose a solution that respects both perspectives.  

  ### Proposal
  We recommend the following:  
  1. **Ban classical axioms from the core namespace.** This ensures that the core library remains constructive and extraction-safe.  
  2. **Create a separate module (e.g., `Classical`)** that contains classical axioms and any lemmas derived from them.  
  3. **Require explicit import** of the `Classical` module for any development that uses classical reasoning.  
  4. **Implement an extraction check** that fails (or at least issues a warning) if the code being extracted depends on the `Classical` module.  
  5. **Document** that the `Classical` module breaks extraction and is intended for non-extracted proofs.  

  ### Reasoning  
  - **Preserving Extraction:** By keeping the core free of classical axioms, we guarantee that any theorem in the core (or that does not use the `Classical` module) extracts to runnable code.  
  - **Practical Flexibility:** For developments that are not intended for extraction (e.g., higher-level mathematical theories), the `Classical` module provides the necessary tools without compromising the core.  
  - **Addressing the Double-Negation Argument:** While double-negation translation is a theoretical bridge, it is often impractical to use directly. Our solution allows classical reasoning where it is most convenient, while still providing a path (via translation) for interoperability when needed (though we note that this translation is not automatic and may require manual effort).  
  - **Preventing Leakage:** The explicit import requirement and extraction check minimize the risk of classical axioms accidentally affecting the constructive core or extraction.  

  ### Conclusion  
  This approach balances the need for a trustworthy constructive foundation with the practical demands of classical mathematics. It allows our library to serve both extraction-oriented users and those focused on classical mathematics, without forcing one paradigm on the entire community.  

  We recommend adopting this policy and implementing the necessary technical safeguards (namespace separation and extraction checks) for the upcoming release.  

