answer: |-
  ### Memo: Proposal for Handling Classical Axioms in the Core Library  
  **To:** Steering Committee & Maintainers  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Balanced Approach for Classical Logic in Core Library  

  #### Background  
  The debate over classical axioms (excluded middle/LEM, choice) centers on two valid perspectives:  
  1. **Constructivists:** Preservation of extraction guarantees is non-negotiable. Every core theorem should yield runnable code, and classical axioms risk "silent contamination" (e.g., via non-constructive lemmas used in extracted functions).  
  2. **Pragmatists:** Forcing constructive proofs for non-extracted theories (e.g., real analysis) is inefficient and alienating. Double-negation translations *technically* embed classical logic, making this largely a usability issue.  

  Both concerns are legitimate. After analysis, I propose a compromise that respects the core’s constructive nature while accommodating classical needs.  

  ---

  #### Recommendation: **Strictly Walled Classical Modules**  
  1. **Core library remains purely constructive.**  
     - Ban `Prop`-level classical axioms (LEM, choice) in the root namespace.  
     - Extraction guarantees are preserved; no risk of accidental classical leakage.  

  2. **Permit classical reasoning in isolated, opt-in modules.**  
     - Create a dedicated `Classical` namespace (e.g., `Library.Classical`).  
     - Axioms like `LEM : ∀ (P : Prop), P ∨ ¬P` live *only* here.  
     - Classical results (e.g., `Classical.Reals`) must be explicitly imported.  

  3. **Enforce extraction safeguards:**  
     - Functions in `Classical` **cannot** be used in extracted code.  
     - Compiler errors if non-`Classical` code depends on classical terms at extraction.  

  4. **Provide classical↔constructive interoperability tools:**  
     - Automate double-negation translation *for theorems* (e.g., via `#[translate]` attribute).  
     - Example: `Classical.THEOREM_X` ↔ `Root.THEOREM_X_dn` (double-negated form).  

  ---

  #### Why This Addresses Both Sides  
  **For Constructivists:**  
  - Extraction purity is absolute. The root namespace has zero classical entropy.  
  - **Acknowledged concern:** "Poisoning via dependencies" is real. Walled modules prevent this by:  
    - Banning classical terms in non-`Classical` types/proofs.  
    - Extraction failures acting as circuit breakers for dependency leaks.  
  - Preserves the library’s identity as a trustworthy foundation for executable math.  

  **For Pragmatists:**  
  - Classical proofs are allowed without constructive gymnastics.  
    - No need to manually manage double-negation translations for real analysis, set theory, etc.  
  - **Acknowledged concern:** "It’s all translatable anyway" is valid but impractical. This solution:  
    - Makes classical reasoning ergonomic *where needed*.  
    - Provides automated translation for cross-paradigm reuse (e.g., using a classical lemma in a constructive proof via `THEOREM_X_dn`).  
  - Maintains contributor freedom: Teams working on non-extracted theories can work classically without hindrance.  

  ---

  #### Why Alternatives Fail  
  - **Allowing axioms "everywhere":** Risks extraction integrity; violates core library principles.  
  - **Total ban:** Ignores real-world usability; fractures the community by forcing forks for classical math.  
  - **"Just use translation"**: Shifts burden to users; inefficient for large classical developments.  

  ---

  #### Implementation Plan  
  1. Namespace isolation + extraction guards (2–4 weeks, low overhead).  
  2. Double-negation translation tooling (4–6 weeks, high ROI for interoperability).  
  3. Documentation: "Classical Handbook" for safe usage and translation.  

  ---

  #### Conclusion  
  This approach splits the difference *structurally*, not philosophically:  
  - **Core remains constructively pure** for extraction-critical users.  
  - **Classical users gain a first-class, safe workspace** with automated bridges to constructive logic.  

  By formalizing the boundary, we respect both the library’s foundational goals and practical needs. I urge the committee to endorse this model.  

  **Vote recommendation:** Approve walled `Classical` modules with extraction safeguards.
