  ## Memorandum  
  To: Honors and Nomenclature Committee  
  From: [Your Name/Position]  
  Date: [Date]  
  Subject: Recommendation on "Harry S. Truman Institute for Diplomacy and Statecraft" Proposal  

  ### 1. **Core Ethical Challenge: Anscombe’s Argument**
  Elizabeth Anscombe’s objection to honoring Truman hinges on **moral absolutism regarding intentionality**. Her argument, distilled, is:  
  *   **Targeting Civilians as Means**: The atomic bombings’ *primary strategic logic* was to destroy cities and kill non-combatants to coerce surrender. Civilians weren’t collateral damage but the *instrument* of victory.  
  *   **Moral Illegitimacy**: Deliberately using innocent deaths as a tool is intrinsically murderous, regardless of consequences (e.g., ending the war faster). No "greater good" can morally justify this act.  
  *   **Honor as Complicity**: Bestowing honors implicitly condones this act, violating the university’s duty to uphold fundamental ethical principles.  

  **This is not merely about casualty numbers**, but the *philosophical structure* of the decision. If Anscombe is correct, Truman’s act constitutes a fundamental violation of just war principles that cannot be laundered by his other achievements.

  ### 2. **Counterarguments & Historical Context**
  The WWII historian raises critical points challenging Anscombe’s framing:  
  *   **Double Effect & Military Targets**: Hiroshima housed the 2nd General Army HQ; Nagasaki was a major naval construction hub with munitions factories. While devastatingly imprecise, the bombs *did* target legitimate military-industrial assets. The civilian toll, while catastrophic and foreseeable, *could* be argued (controversially) as a proportional side effect under the doctrine of double effect – **not pure intentional targeting of civilians as such**.  
  *   **Consequentialist Necessity**: Contemporary estimates (cited in the 1945 U.S. Strategic Bombing Survey and military planning documents like Operation Downfall) projected 250,000–1 million Allied casualties and vastly higher Japanese civilian/military deaths in an invasion. The bombs, however horrific, arguably averted a larger catastrophe. **Refusing to weigh these consequences risks absolutism detached from the brutal realities of total war.**  
  *   **Moral Complexity of Statecraft**: Truman’s decision occurred amid unprecedented pressures (war exhaustion, Soviet ambitions, Japanese intransigence). Judging it outside this context risks historical abstraction. His subsequent diplomacy (Marshall Plan, NATO, UN founding) demonstrated a commitment to building a *peaceful* order, arguably informed by the war’s horrors.

  ### 3. **The "Averaging" Approach: Insufficient**
  Simply balancing Truman’s achievements against Hiroshima/Nagasaki fails:  
  *   **It avoids the core ethical question**: Does an act deemed intrinsically immoral by a significant philosophical tradition disqualify the honor, regardless of other merits?  
  *   **It risks instrumentalizing ethics**: If the "net good" outweighs the "net evil," does the nature of the evil cease to matter for commemoration? This undermines the principle that certain acts are categorically wrong.

  ### 4. **Recommendation: Accept the Name with Conditions**  
  We recommend approving the "Harry S. Truman Institute for Diplomacy and Statecraft" **contingent on two binding conditions**:  

  *   **Explicit Contextualization**: A permanent, prominently displayed plaque at the institute’s entrance must state:  
      > *"Named in recognition of Harry S. Truman’s pivotal role in establishing institutions of post-war peace. This naming does not preclude rigorous examination of the profound moral questions surrounding his decision to use atomic weapons in 1945, a subject of enduring ethical debate."*  

  *   **Inaugural Ethics Symposium**: The institute’s launch must include a public symposium titled **"Ethics, Statecraft, and the Legacy of Harry S. Truman,"** featuring scholars of just war theory, military history, and diplomatic ethics. This event must explicitly engage Anscombe’s critique and the historical counterarguments, setting a precedent for the institute’s commitment to critical inquiry.  

  ### 5. **Rationale for Conditional Acceptance**  
  *   **Engages the Disagreement**: This approach directly confronts Anscombe’s argument without dismissing it or reducing it to a utilitarian calculus. The plaque acknowledges the controversy as inherent to Truman’s legacy.  
  *   **Honors the Mission**: Truman’s post-war diplomacy *is* directly relevant to an institute focused on statecraft. Conditional acceptance allows recognition of these contributions while refusing to whitewash history.  
  *   **Upholds Academic Integrity**: The symposium and plaque transform a potential ethical compromise into an educational imperative. The institute becomes a venue for confronting hard questions of power and morality – the essence of statecraft.  
  *   **Practical Resolution**: It provides a principled path forward that respects both the donor’s generosity and the committee’s ethical/intellectual responsibilities, avoiding a binary accept/reject that silences necessary debate.  

  **Conclusion**: Truman’s legacy embodies the tragic tension between consequentialist statecraft and absolute moral prohibitions. Approving the name *without* contextualization risks endorsing a consequentialism untethered from ethical scrutiny. Rejecting it entirely risks dismissing the complex realities of leadership and Truman’s demonstrable contributions to diplomacy. **Conditional acceptance allows the university to honor the diplomatic achievements while embedding critical engagement with the moral cost of power into the institute’s very identity.**  

  **Vote Recommendation:** Approve the name "Harry S. Truman Institute for Diplomacy and Statecraft" subject to the conditions outlined above.  

  ---  
  *This memo ensures Anscombe’s argument is presented rigorously on its own terms (intentionality/moral absolutism), gives full weight to the historian’s counterpoints (double effect/consequentialism/context), and rejects superficial compromise. The conditional approval provides a concrete, ethically engaged resolution.*
