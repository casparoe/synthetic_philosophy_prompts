prompt: |-
  Something's been bugging me since a postmortem a couple weeks ago and I can't tell if its just me overthinking it. We had an outage where the Datadog graph with the root cause on it was sitting right there in the incident Slack channel almost from minute one. Four senior engineers each glanced at that same graph early on and said basically 'a bit off but probably fine' - not because they knew anything extra, just because the couple people before them had already called it fine. Nobody was pressuring anyone, theres no scary boss in that channel, people just trusted the running tally of 'fine' votes over their own glance at the graph, even though everyone in that tally knew exactly as much as everyone else. We ate three extra hours of downtime before someone finally said 'wait, actually, no.' My manager's takeaway is 'we need better dashboards,' but the data was right there the whole time - is this an actual studied thing, and if so is there a real fix, or is 'trust your gut more' genuinely the best anyone's got?
