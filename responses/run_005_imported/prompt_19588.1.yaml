prompt: |-
  hey! im drafting a horror novel where my main character gets stuck in a looping basement corridor that has two junctions which are, for plot reasons, literally identical right down to the dust patterns — and because of whatever's wrong with the loop, she can never tell whether she's hitting junction one or junction two on any given pass through. i did alot of googling trying to figure out how a rational person would even approach that, and it turns out this maps onto something called the "absent-minded driver problem" in decision theory, which i did not expect to be a real academic thing lol. could you lay out the most important implications of that problem for how my character should actually reason and choose at each junction? i especially want to understand the bit about planning a strategy ahead of time vs deciding in the moment, and whether decision theory even says there's one "correct" choice for her to make each time, or if the whole setup just breaks the usual rules. trying to keep the internal logic airtight so eagle-eyed readers can't poke holes in it.
