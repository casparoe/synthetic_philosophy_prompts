  - **Key implications**: Hammer the planning vs. execution divide. The optimal strategy feels self-sabotaging in the moment. That’s psychological horror fodder. 
  - **Character reasoning**: Show her *trying* to be systematic (counting steps? marking walls?) but the loop erases evidence. Maybe she starts rational, then degrades into superstition. 
  - **"Correctness"**: Explicitly say the rules break here. No perfect solution, just damage control. That helplessness is terrifying. 

  Phrasing tweaks for horror: 
