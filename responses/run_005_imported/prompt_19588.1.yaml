  1. **The strategy paradox**: How planning ahead clashes with moment-to-moment reasoning. That's pure gold for horror—imagine the character intellectually knowing they should flip a coin, but in the dark, with panic rising, they second-guess and deviate. 

  2. **Whether "correct" choices exist**: The academic answer is "no, and that's the point," which feeds beautifully into existential horror. The corridors being identical down to dust patterns means reality itself feels broken. I should emphasize how rationality frays here. 

  User’s hidden needs jump out: 
