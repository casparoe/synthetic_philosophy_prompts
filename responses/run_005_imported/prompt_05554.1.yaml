      *   He cites lip-reading unreliability *as the reason* to dismiss the *entire* account, including non-lip-read facts. This conflation suggests the stereotype ("Deaf = unreliable witness") is operating, not just skepticism about a specific method.
      *   He seeks "hearing witnesses" *instead*, implying hearing is the default standard for reliability.

  2.  **Identity Prejudice vs. Method Skepticism:** Meg is right that skepticism about lip-reading *itself* isn't necessarily prejudicial – it can be epistemic good faith based on known limitations (point 2). **The injustice occurs when that method skepticism *morphs into or is used to justify* a broader, identity-based credibility deficit applied to facts beyond the method's scope.** That's what the detective does. He uses the (potentially legitimate) doubt about *one aspect* (lip-read argument) to invalidate *everything* from a Deaf witness, which is illegitimate and stems from the prejudice Dave identifies.

