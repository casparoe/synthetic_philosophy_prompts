  **Closing: The Core Nuance of Testimonial Injustice (TI)**

  Meg and Dave both touch on key aspects but miss the precise hinge for TI:

  1.  **The Source of the Credibility Deficit:** TI isn't *just* about getting credibility wrong. It's about *why* it's wrong. Dave correctly identifies the prejudice link in point 3. Meg correctly notes that errors can be generic (point 4). **The critical question is: Is the detective's dismissal *motivated by or significantly influenced* by the prejudicial stereotype linking Deafness to unreliability, even subconsciously?** The scene strongly implies "yes" because:
