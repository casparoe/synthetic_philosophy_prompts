  For their book, they could keep the dramatic conflict but tweak for plausibility: maybe the right hemisphere communicates via gesture or object use, not spelling. The left hemisphere could confabulate excuses for the right's behavior, adding psychological tension. Scenes like wardrobe clashes or shopping dilemmas could show non-verbal dissent. 

