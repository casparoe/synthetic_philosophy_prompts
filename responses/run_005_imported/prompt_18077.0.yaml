answer: |-
  Here are eight targeted questions probing beyond the control principle, with anticipated replies and sharp follow-ups. Each addresses core tensions in moral luck debates:

  ### I. Williams' Agent-Regret (Lorry Driver Case)
  **Q1:** You argue the non-culpable lorry driver who hits a child is *no more blameworthy* than one who doesn’t. Yet Williams claims such an agent experiences "agent-regret" — a first-personal anguish distinct from sympathy for the victim. If responsibility hinges solely on prior control/culpability, why does the driver’s *phenomenology* demand this unique category tied to *being the agent*, rather than mere observer-regret?  
  *Likely Reply:* Agent-regret is emotional residue, not a moral judgment; it reflects psychological identification with the act’s causal role, not heightened blameworthiness.  
  *Follow-up:* If agent-regret is merely psychological, why does Williams insist it’s rationally *justified*? Isn’t denying its normative significance a refusal to engage the actual moral experience of agents?

  ### II. Nagel’s Sceptical Threat
  **Q2:** Nagel worries that eliminating moral luck via the control principle doesn’t just resolve paradoxes but dissolves agency itself, as constitutive luck (who we are), causal luck (circumstances), and antecedent luck (prior causes) seem to determine all actions. How does your view avoid this sceptical conclusion without smuggling luck back in?  
  *Likely Reply:* We control choices within our *current* deliberative framework; responsibility applies to that sphere, not to the unchosen conditions framing it.  
  *Follow-up:* But if constitutive luck shapes my values/abilities *and* causal luck shapes my options, what "control" remains? Isn’t the "sphere" you reference *itself* a product of luck, rendering agency illusory?

  ### III. Gauguin & Retrospective Justification
  **Q3:** In Gauguin cases, an agent (e.g., abandoning family for art) seems justified *only if they succeed* due to resultant luck. You’d say prior culpability is identical regardless of outcome. Yet doesn’t Gauguin’s *retrospective self-assessment* — and our external judgment — rationally depend on outcome? How can justification be entirely outcome-independent?  
  *Likely Reply:* Justification depends on reasons *at the time*; success may reveal those reasons were *good* (i.e., he *correctly* assessed his talent/mission), but doesn’t alter original culpability for the gamble.  
  *Follow-up:* But if Gauguin fails, we judge his reasons as *insufficient* to override prior duties. Doesn’t this imply the *validity of the reason itself* (not just his belief in it) depends on luck? How is "correct assessment" separable from outcome?

  ### IV. Epistemic Luck & Culpable Ignorance
  **Q4:** Consider two negligent doctors: one’s patient dies due to a rare, unforeseeable reaction (bad luck), another’s lives (good luck). You’d equate blameworthiness. But doesn’t the unlucky doctor face greater *reproach* precisely because the outcome *reveals* the epistemic gap in their reasoning? Is outcome truly irrelevant to culpability for negligence?  
  *Likely Reply:* Culpability lies in the unreasonable risk taken; the *actualization* of risk adds harm but not *new blameworthiness*.  
  *Follow-up:* If the *reasonableness* of a risk depends on the *actual* probability (known via outcomes/frequency), isn’t our judgment of prior culpability *itself* hostage to epistemic luck about statistical knowledge?

  ### V. Collective Harm & Individual Blame
  **Q5:** In collective actions (e.g., voting for a harmful policy), individuals often feel diminished responsibility if their vote wasn’t decisive. If luck determines whether one’s act was causally efficacious, does your view imply that voters in functionally identical positions (e.g., same intent, same marginal contribution) are equally blameworthy *regardless* of whether the policy passes?  
  *Likely Reply:* Yes; blameworthiness attaches to the choice to support a harmful policy, not causal efficacy.  
  *Follow-up:* Doesn’t this massively over-ascribe blame? If millions vote for a policy that loses by one vote, are all *equally* blameworthy as the sole voter whose ballot passed an identical policy? Intuition suggests otherwise.

  ### VI. Constitutive Luck & Character
  **Q6:** If blameworthiness depends on choices, and choices flow from constitutive luck (character/temperament), how do we assign *deep* responsibility? E.g., a naturally callous person vs. one who struggles against cruelty. Doesn’t your view collapse into judging only *surface* actions, ignoring the moral effort shaped by constitutive luck?  
  *Likely Reply:* We praise/blame based on choices manifested; the "effort" itself is either chosen (and thus within control) or not.  
  *Follow-up:* But capacity for moral effort seems constitutively lucky. If two people make identical cruel choices, but one lacked the *capacity* for empathy (due to constitutive luck), are they truly equally blameworthy? Doesn’t this conflict with intuitions about diminished responsibility?

  ### VII. Legal vs. Moral Blame & Outcome Dependence
  **Q7:** Legal systems often punish based on outcomes (e.g., attempted vs. completed murder). You argue moral blameworthiness differs. But if the *moral wrong* in attempted murder is identical, why do we intuitively feel the completed act warrants greater *moral condemnation*? Is this purely emotional/retributive error?  
  *Likely Reply:* Yes; moral wrongness concerns intent/action; stronger feelings about harm reflect non-moral reactive attitudes.  
  *Follow-up:* Are reactive attitudes (e.g., resentment) truly separable from moral blame? If not, doesn’t outcome luck fundamentally shape the *social practice* of blaming, which your theory must dismiss as irrational?

  ### VIII. Moral Residue & "Taint"
  **Q8:** Williams/Nussbaum argue moral luck creates a "taint" or residue for agents, even when blameless (e.g., Oedipus). If responsibility is solely about control and prior culpability, how do you explain the persistence of this moral residue as anything other than irrational guilt?  
  *Likely Reply:* It *is* irrational guilt or non-moral sorrow. Responsibility requires fault.  
  *Follow-up:* Does this not reduce morality to a purely forensic, fault-based calculus, ignoring dimensions of moral experience like "being marked" by events? Isn’t denying this residue a rejection of the phenomenology of moral life?

  These questions force engagement with the *experiential*, *sceptical*, and *justificatory* challenges moral luck poses, pushing beyond the control principle’s defensive perimeter. Good luck with the Q&A!
