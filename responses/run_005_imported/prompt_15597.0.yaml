  ## Keynote Address: The Living Document and the Courage to Claim It

  **Judge [Judge's Last Name], distinguished guests, fellow citizens – and soon-to-be fellow citizens,**

  Today, we gather beneath the broad banner of American freedom on the Fourth of July. We celebrate independence, yes. But today is uniquely profound. Today, 150 individuals from across the globe will raise their hands, take an oath, and step fully into the embrace of American citizenship. This ceremony isn't just a welcome; it's a transformation, a sacred joining of your story with the ongoing, often tumultuous, narrative of this nation.

  And presiding over this profound moment is a judge who understands the weight of history, particularly the complex history of how we define freedom within these United States. She has asked that we center this moment on one of America’s most towering figures: Frederick Douglass. You may not yet know his name deeply, but by the end of this ceremony, I hope you feel his spirit resonate with your own journey here today.

  Frederick Douglass was born enslaved. He knew the brutal contradiction of a nation declaring "all men are created equal" while holding millions in chains. On July 5th, 1852, he delivered a speech that still echoes with righteous fury: "What, to the American slave, is your Fourth of July?" He called it "a day that reveals... the gross injustice and cruelty to which he is the constant victim." He laid bare the hypocrisy, the hollowness of celebration amidst such suffering. That anger was justified, essential, and undeniable.

  But Douglass’s journey with America didn’t end in anger. It deepened into a more profound, more challenging engagement. And this is the crucial part of his story the Judge asks us to reckon with today.

  For a decade, Douglass stood shoulder-to-shoulder with the fiery abolitionist William Lloyd Garrison. Together, they declared the U.S. Constitution itself to be a pro-slavery document – Garrison called it "a covenant with death, and an agreement with hell." They believed the Founding Fathers, many of whom owned slaves, had embedded slavery’s protection into the nation’s very foundation. This view saw the Constitution as fatally flawed, irredeemable.

  **But then, around 1851, Frederick Douglass did something remarkable, courageous, and intellectually rigorous: he changed his mind.** He broke with Garrison, a painful and risky decision. He didn’t change his goal – the abolition of slavery – he changed his *strategy* and, crucially, his *interpretation* of the Constitution.

  Douglass embarked on a meticulous study. He looked past the *intentions* of the men who wrote it – many of whom *were* compromised by slavery. Instead, he focused intensely on the **words themselves**, the *text* of the Constitution. And what did he find?

  *   **The Preamble:** "We the People... to secure the Blessings of Liberty to ourselves and our Posterity." Nowhere did it limit "the People" or "Liberty" to white men or exclude enslaved people. The goal was stated plainly: Liberty.
  *   **Article I, Section 9:** It prevented Congress from banning the *importation* of slaves only until 1808 – implicitly acknowledging Congress *could* ban it *after* that date. It was a temporary concession, not a permanent guarantee.
  *   **Article I, Section 8:** It gave Congress power to "suppress Insurrections" – but it didn't specify *which* insurrections. Douglass argued this power could be used against *slave rebellions*, but it didn't *require* protecting slavery itself.
  *   **Article IV, Section 4:** It guaranteed every state a "Republican Form of Government." Douglass argued that a government based on the ownership of human beings was inherently *not* republican.
  *   **The Bill of Rights:** Amendments protecting speech, assembly, due process, and more – rights inherently denied by slavery.

  By focusing solely on the text, Douglass concluded, powerfully, that the Constitution was **"a GLORIOUS LIBERTY DOCUMENT."** The problem, he argued, wasn't the document's inherent principles; it was the nation's failure to live up to them, its willingness to ignore the text's liberating potential in favor of pro-slavery interpretations and compromises.

  **Why does this matter so much, especially to you, our newest citizens, today?**

  1.  **The Power of the Text:** Douglass teaches us that the core document of this nation, the Constitution, is not static or owned by any single generation's interpretation, however flawed they may have been. Its strength lies in its words – words about liberty, justice, and the power of "We the People." **You are now part of that "We."** You inherit the right, and the responsibility, to read those words, understand them, and demand that their promise be fulfilled for *all*.
  2.  **The Courage to Reclaim:** Douglass didn't abandon the fight; he deepened it by reclaiming the nation's founding charter *for* freedom. He showed that American ideals, even when betrayed, are powerful weapons for justice. Your presence here is an act of faith in those ideals. You are claiming your place within this "glorious liberty document," just as Douglass fought to claim its promise for those enslaved.
  3.  **Citizenship as Active Interpretation:** Naturalization isn't just about receiving rights; it's about embracing the ongoing project of building a "more perfect Union." Douglass’s shift reminds us that this requires constant, active engagement. It requires looking at the foundational text, understanding its principles, and working – sometimes fiercely, always faithfully – to align reality with its highest aspirations. Your oath today is your commitment to that active citizenship.
  4.  **Beyond Anger to Building:** Douglass harnessed his righteous anger not just to condemn, but to *construct* a better argument, a better strategy, a better vision of what America *could* be. Your journeys, too, likely hold complex emotions about leaving homelands, facing challenges. Today, you channel that experience into building a new life *here*, contributing your strength to this nation’s fabric. Like Douglass, you move from critique to creation.

  **So, to our newest citizens:** As you take your oath today, remember Frederick Douglass. Remember the man who escaped bondage and then dared to reinterpret the very charter of the nation that enslaved him. He saw beyond the failures of the moment to the enduring power of the words: Liberty. Justice. We the People.

  You now hold those words. You embody the living spirit of that "glorious liberty document." Your citizenship is not passive; it is active. It is a promise to uphold the Constitution, yes, but also to *interpret* it, to *demand* its promises, and to *build* the nation its highest ideals envision.

  Welcome. Welcome not just to America *as it is*, but to America *as it strives to be*. Welcome to the courageous, ongoing work begun long ago, championed by giants like Frederick Douglass, and carried forward now, powerfully, by you. **Welcome to your citizenship. Welcome to the story.**

  Thank you.
