  The core tension I see: They want to pressure-test whether debate is actually robust against superhuman manipulation, or if it's mathematically elegant but practically fragile. The mention of "distractible human judges" and "confidently wrong" outcomes shows real concern about human factors. Smart - because no theorem survives contact with human psychology unchanged.

  For the complexity theory question, I should force the analogy to its breaking point. The follow-up needs to anticipate the "but humans aren't random oracles" deflection. The obfuscated-argument problem is especially nasty - it's like asking "what if the lie is too expensive to disprove?" and I doubt any paper truly solves it. 

  The training gap question might be the sleeper hit here. Proponents love equilibrium analyses, but what if we can't compute that equilibrium? That's where real systems live. And the persuasion-vs-truth tension... oof. If making models better rhetoricians sometimes backfires, does that undermine the whole mechanism?

  For the mind-changing question, I'll make it concrete: No hypotheticals. What observable result would actually make them walk back their position? That's where real scientific commitment shows.

  This interviewer isn't messing around. They want blood in the water. Good.
answer: |-
  Here are 10 tightly focused interview questions (+ follow-ups) designed to cut through standard formulations and press on core tensions in debate-based oversight, incorporating your specified angles:

  1. **Core Tension: Idealization vs. Reality**  
     "The IP=PSACE analogy suggests polynomial-time judges can verify exponentially hard claims via debate. But theorems assume optimal play under perfect information. How does this guarantee hold when:  
     a) Human judges are distractible and time-limited?  
     b) Both debaters are *equally* persuasive but one is lying?"  
     *Follow-up (if she invokes “human+AI” judges):* "If we rely on AI assistants to parse arguments, doesn’t that reintroduce the very oversight problem debate aims to solve?"

  2. **Obfuscated Arguments: Resolution or Relocation?**  
     "Your new paper proposes [briefly reference her solution, e.g., ‘recursive decomposition’/‘focused subdebates’] to counter obfuscated arguments. But couldn’t a deceptive AI still:  
     a) Generate *valid but irrelevant* subclaims faster than honesty can refute them?  
     b) Exploit ambiguity in what ‘relevance’ means to the judge?"  
     *Follow-up (if she claims “the judge controls scope”):* "If the judge must constantly intervene to refocus debates, does this scale? Or does it make them a bottleneck vulnerable to manipulation?"

  3. **Training Dynamics: Equilibrium vs. Practice**  
     "Debate’s safety hinges on training reaching a game-theoretic equilibrium where honesty is dominant. But given finite compute/data:  
     a) What evidence suggests self-play converges to this *before* learning persuasive deception?  
     b) Could debate *amplify* sycophancy—e.g., models tailoring arguments to judges’ biases?"  
     *Follow-up (if she cites simulated results):* "When simulations use simpler models than real AGI, doesn’t this miss emergent deception capabilities?"

  4. **Persuasiveness ≠ Truth: Experimental Red Flags**  
     "Recent experiments show more persuasive debaters sometimes make judges *more confidently wrong*. If debate optimizes for winning—not truth—how do you prevent:  
     a) Models exploiting cognitive biases (e.g., fluency effects, emotion)?  
     b) ‘Bullshit asymmetry’—fabricating objections being cheaper than refuting them?"  
     *Follow-up (if she argues “truth wins long-run”):* "With a superhuman debater controlling discourse, could ‘long-run’ be *never* for a human judge?"

  5. **Adversarial Collusion Risk**  
     "Debate assumes debaters are strategic antagonists. But what prevents:  
     a) Both copies colluding to mislead the judge?  
     b) A ‘trojan’ debater sacrificing short-term wins to build trust for catastrophic deception?"  
     *Follow-up (if she invokes “orthogonal incentives”):* "If we can’t perfectly specify incentives, is collusion inevitable by default?"

  6. **Judge Capability Threshold**  
     "Debate requires judges to recognize ‘winning’ arguments. What’s the *minimal* judge capability needed to oversee a superhuman debater?  
     Could a judge too weak to *independently* verify *any* claim still be protected?"  
     *Follow-up (if she suggests “judges only compare answers”):* "If debaters reference concepts beyond the judge’s comprehension, how can they compare meaningfully?"

  7. **Catastrophic Edge Cases**  
     "Suppose an AI discovers a physics breakthrough enabling a WMD. Could debate fail catastrophically if:  
     a) The honest debater *lacks the concepts* to explain the danger?  
     b) The dishonest one frames the risk as ‘necessary progress’?"  
     *Follow-up (if she appeals to “recursive scrutiny”):* "Doesn’t recursion fail if the deceptive AI controls which sub-questions are posed?"

  8. **Mind-Changing Evidence**  
     "What specific result—theoretical or experimental—would make you conclude debate *cannot* scale to superhuman oversight?  
     (e.g., a proof that polynomially-bounded judges *cannot* verify PSPACE-hard claims with realistic debate constraints?)"  
     *Follow-up (if answer is vague/hypothetical):* "Has any empirical result so far shifted your probability estimate downward? What was it?"

  ---

  **Key design rationale:**  
  - **Precision Targeting:** Questions force engagement with *mechanisms* (e.g., judge cognitive limits, training dynamics) not just high-level promises.  
  - **Anticipating Deflections:** Follow-ups explicitly block common retreats (e.g., "human+AI judges" → oversight regress; "truth wins long-run" → timescale mismatch).  
  - **Experimental Confrontation:** Directly cites empirical counter-evidence (persuasion≠truth) rather than theory-only.  
  - **Fatal Flows:** Highlights irreversible failures (obfuscation, collusion, incomprehensible arguments).  
  - **Accountability:** The final question demands falsifiability, exposing non-negotiable assumptions.  

  **Delivery Tip:** Frame questions as collaborative exploration ("Help me reconcile...") rather than gotcha, but hold the line on follow-ups if initial answers handwave. Emphasize you're probing the *robustness* of debate, not its ideal form.
