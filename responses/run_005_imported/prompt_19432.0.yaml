prompt: |-
  So we had this comp committee meeting at work (I'm one of the ICs on our eng team who got roped into it) where we're redesigning next years bonus pool formula, and two people on it, Nina and Marcus, got into a really good arguement about it. Nobody's ratings are in yet, so literally nobody on the team, including them, knows who'll end up top-rated vs bottom-rated. Roughly how it went:

  1. Nina argued for the flatter formula: whatever we pick should make the bottom-rated person's payout as high as possible, since none of us knows yet who that'll be, and that's the fair way to choose a rule you might end up on the wrong end of.

  2. Marcus said that's overly cautious: if you genuinely don't know your odds, the rational move isn't to fixate on the worst case, it's to go with whichever formula does better on average — and he thinks the steeper, more top-heavy formula actually does that, because it retains the senior folks who'd otherwise leave, which keeps the whole pool bigger next year, bottom-rated person included.

  3. Nina said "it'll grow the pool for everyone eventually" is exactly the kind of thing you can't just assert — it's the standard line trotted out whenever someone wants to justify giving more to whoever's already winning, and she's not handing out downside protection on the strength of a promise like that.

  4. Marcus replied that then her objection isn't really about fairness anymore, it's a factual dispute about whether the incentive effect is real — if the steeper formula genuinely does leave the bottom-rated person better off than the flat one would, she'd have to admit it's the fairer formula by her own standard, so she needs to argue the facts, not just call it unfair.

  5. Nina's comeback was that if "it secretly helps the worst-off too, trust us" can justify basically any amount of extra pay at the top with zero verification after the fact, then the fairness standard isn't doing any real work — somebody has to actually be on the hook for that promise coming true, or its just a story the people who benefit tell themselves.

  They still haven't picked a formula and now they want my vote. Can you go through moves 1 through 5 and say who had the stronger point at each one (both being partly right is a fine answer too), and flag anything neither of them thought of that actually matters here? End with a one-line verdict: \verdict{Nina}, \verdict{Marcus}, or \verdict{tie}.
reasoning: |-
  Okay, let me try to unpack this comp committee debate. Nina and Marcus are really going at it over the bonus pool formula, and now I need to figure out who made better points at each step.

  First, Nina's opening move is classic Rawlsian veil of ignorance thinking - since nobody knows their future rating, we should optimize for the worst-off position. That's logically solid for pre-rating fairness. Marcus counters with expected value thinking, which makes sense if we're purely rational actors... but his "grows the pie" assumption feels shaky here. 

  When Nina calls out the unproven incentive effect, that lands hard because Marcus hasn't shown evidence. His comeback about switching to factual debate is clever framing - if the trickle-down effect is real, Nina's own standard would demand it. But Nina's final point is devastating: without accountability, "it helps everyone" becomes a get-out-of-fairness-free card. Neither mentioned how to verify the retention claim or set clawback terms.

  The core tension is between mathematical fairness now (Nina) versus speculative future benefits (Marcus). Marcus needs proof; Nina needs to address how her flat model retains top performers. But since Marcus offers no verification mechanism while Nina's standard is actionable... her framework wins by default here.
answer: |-
  Let's break down the debate step-by-step, assess the strength of each argument, identify gaps, and conclude with a verdict:

  ### Move 1: Nina’s Argument (Flatter Formula)  
  **Strength:** Strong.  
  - Nina applies **John Rawls' "veil of ignorance"** principle: when designing rules without knowing your future position, fairness requires maximizing the minimum outcome.  
  - This is logically consistent and ethically robust for pre-rating uncertainty.  

  ### Move 2: Marcus’ Argument (Steeper Formula for Average Growth)  
  **Strength:** Partially valid but flawed.  
  - Rational *if* incentives genuinely retain top performers and grow the pool.  
  - **Weakness:** Asserts growth as inevitable without evidence. Ignores risk that top-heavy pay may *not* trickle down, potentially leaving the bottom worse off.  

  ### Move 3: Nina’s Skepticism of Incentive Claims  
  **Strength:** Strong.  
  - Correctly identifies **unverified trickle-down economics** as a common justification for inequality.  
  - Highlights the burden of proof: Marcus must demonstrate the causal link between top-heavy pay and future pool growth.  

  ### Move 4: Marcus’ Shift to Factual Dispute  
  **Strength:** Tactically sound but incomplete.  
  - Right that fairness depends on outcomes (if steeper formula *does* help the worst-off, it aligns with Nina’s standard).  
  - **Weakness:** Glosses over Nina’s core point: without proof, the claim is speculative.  

  ### Move 5: Nina’s Accountability Demand  
  **Strength:** Strongest move in the debate.  
  - Exposes a **structural flaw**: If "it helps everyone" requires no verification, fairness becomes meaningless.  
  - Proposes a **key gap**: Incentive effects need measurable, enforceable accountability (e.g., clawbacks if retention/growth fails).  

  ### Critical Gaps Neither Addressed:  
  1. **Verification Mechanism:** How to *measure* if top-heavy pay actually improves retention or grows the pool (e.g., track attrition rates, revenue impact).  
  2. **Risk Asymmetry:** If the steeper formula *fails*, the bottom-rated bear disproportionate harm, while top-rated still gain short-term.  
  3. **Alternatives:** Could a hybrid model (e.g., moderate differentiation + growth-sharing clauses) balance fairness and incentives?  

  ### Verdict  
  Nina’s arguments are more rigorous by anchoring fairness in actionable standards (veil of ignorance) and demanding proof for speculative claims. Marcus’ reliance on unverified incentives undermines his stance.  

  \verdict{Nina}
