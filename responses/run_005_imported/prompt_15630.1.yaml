  The user mentions examples like "gavagai" meaning rabbit vs. undetached rabbit part. Quine's point is that no behavioral evidence can settle which is correct because the differences are in ontological commitments that don't manifest in speech behavior. That goes beyond underdetermination. 

  Also, Quine's behaviorism plays a role here. Since meaning is tied to observable behavior, and the rival translations don't differ behaviorally, there's no fact of the matter. That's not just about simplicity or practicality; it's ontological. 

  The user is a field linguist, so their concern is practical. They want to know if they can proceed without skepticism. They might be looking for reassurance that their work is valid despite Quine's thesis. But Quine does introduce a deeper skepticism. However, in practice, linguists use simplicity, context, and other factors. Still, Quine would say that while useful, these choices aren't discovering pre-existing meanings. 

  I should check if Quine explicitly distinguished the two. Yes, in later works like "Ontological Relativity," he clarifies that indeterminacy is stronger. The inscrutability of reference shows that reference itself is relative to a translation manual. 

  The user's deeper need might be methodological guidance for their fieldwork. They want to know if Quine's thesis undermines their results. The answer is that practically, no—linguists can still produce functional translations. But philosophically, Quine challenges the existence of unique meanings. So the user should proceed with their methods but remain aware of the philosophical caveats. 

  Also, the user might be conflating underdetermination with indeterminacy by treating both as empirical equivalence. But indeterminacy's lack of fact of the matter makes it different. The physicist's theories might have truth values we can't access, but for translation, there's no truth to access beyond behavior. 

