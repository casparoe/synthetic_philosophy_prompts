    - At 11 months: Owen now prefers immediate $90 over waiting for $100. The trader offers to switch him back to getting $90 now (but note: at 11 months, the original $90 would have been available at that time, but now the trader can offer to give him $90 immediately in exchange for giving up the $100 in one month) and charges another fee (say $1). So Owen pays another $1 and gets $90 immediately.

  Result: Owen ends up with $90 at 11 months (which he could have had for free) but has paid $2 in fees. Thus, he is worse off by $2.

  Rosa argues that this exploitability shows the preference pattern is defective.

  Move (2): Sam grants the money pump works in principle but only for naive agents. If Owen (or any agent) can foresee the reversal, they can commit at the outset to the option that their near-term self will stick with (i.e., the $90 at 11 months) or use a commitment device. Then they avoid being pumped. So the mere possibility of a pump doesn't show Owen is irrational if he can avoid it.

  Move (3): Rosa counters that needing a commitment device concedes the point. The payoffs and dates haven't changed, only the temporal perspective. Thus, the reversal is a diachronic inconsistency, and requiring outside enforcement to prevent it is an admission of the inconsistency.

