  But there are nuances missing. The student conflates "internal morality" with Hart's "minimum content," which is a significant blurring of lines—Fuller's eight desiderata aren't natural law but procedural benchmarks. They also oversimplify Fuller's view of the Nazi regime; he saw it as a degraded legal system, not a complete non-law void. And while they imply Fuller wouldn't punish the wife, they don't spell out his preference for common-law adjudication over retroactive statutes. 

  For the rubric: Case facts are flawless (5/5). Hart's move gets 4/5—core argument captured but missing explicit labeling. Fuller's critique is strong on substance but slightly imprecise on regime collapse (4/5). The "internal morality" handling wobbles on the Hart-Fuller conflation (3.5/5). Averaged to 16.5/20, that's a firm A- with room to sharpen distinctions. 

