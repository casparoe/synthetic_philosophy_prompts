answer: |-
  Here’s a dialogue between **Alex** (defending the object/state-given distinction as a solution for buck-passing reductionism) and **Sam** (arguing the distinction is circular/insufficient and advocating for primitive fittingness). They engage directly with each other’s moves, referencing key arguments from the literature:

  ---

  ### **Setting:** Philosophy department coffee lounge, post-seminar  
  **Alex:** ...So the object-given/state-given distinction cleanly resolves the demon case. The demon gives you a *state-given reason* to admire him (to avoid torture), but *no object-given reason* (nothing admirable *about him*). That’s why admiring him isn’t fitting. The buck-passing account survives!  

  **Sam:** Alex, I think that move just papers over the crack. *How* do we know the demon’s reason is state-given? Isn’t it because we already recognize that admiration wouldn’t be *fitting* toward him? Your distinction presupposes the very notion of “fittingness” it’s supposed to reduce.  

  **Alex:** Not at all! We can define the distinction non-circularly:  
  - **Object-given reasons:** Reasons that cite properties *of the object* (e.g., "The demon is powerful").  
  - **State-given reasons:** Reasons that cite properties *of having the attitude* (e.g., "Admiring him prevents torture").  
  The demon’s threat is about the *state* of admiring, not the demon *as an object*. No prior fittingness needed!  

  **Sam:** But that’s just the *wrong properties problem* (Schroeder, Markovits). Imagine a demon who says, “I’ll torture you unless you admire me *for my power*.” Now you have a reason to admire him *for his power*—a property *of the object*. Is that suddenly an object-given reason? Intuitively, no—it’s still the *wrong kind* of reason. Your distinction collapses.  

  **Alex:** Ah, but that’s why we refine it: a reason is object-given only if it’s *for the right kind of property*. We admire things for being noble or skillful, not just any property (like “being such that admiring them prevents torture”). The buck-passer can appeal to *constitutive norms of attitudes* (D’Arms and Jacobson).  

  **Sam:** And how do we identify the “right kind” of property? Isn’t it because those are the properties that *make admiration fitting*? You’re sneaking fittingness back in! If you say, “Admiration is *constitutively* for nobility,” that just means admiration is *fitting* toward noble things. You’re using fittingness to define the attitude, then using the attitude to define value. Circularity.  

  **Alex:** Fair, but we can naturalize constitutive norms. Maybe admiration is *psychologically* responsive to nobility, not torture-avoidance. No normativity needed!  

  **Sam:** But the WKR problem is *normative*: the demon gives a genuine *normative reason* to admire him, yet it’s not a reason of *fittingness*. If your psychological story says we *can’t* admire for torture-avoidance, that’s false—people *can* cultivate attitudes for extrinsic rewards. The problem is that they *shouldn’t* count toward value. That “should” is normative, not psychological.  

  **Alex:** Then let’s go modal: Fitting admiration tracks what *would* be admirable in idealized conditions (no demons).  

  **Sam:** *Conditional fallacy* (Shope). If we idealize away all prudence-threats, we might lose the concept of a “threat-based reason” altogether. Worse, what if the demon makes *nobility itself* a reason to torture you? Now fearing noble things could be “fitting” by your idealized standard. Madness!  

  **Sam (leaning in):** Here’s the core issue: Your distinction can only filter WKRs if you *already know* what fittingness is. But buck-passing aims to *reduce value to fittingness*. If you need fittingness to explain the distinction, reduction fails. We should treat fittingness as primitive ("fittingness-first"). Value is *just* what it’s fitting to value.  

  **Alex:** But then fittingness is a mystery! How is “fittingness” any clearer than “goodness”? Reduction explains normativity; primitivism surrenders.  

  **Sam:** Not at all. Fittingness-first isn’t obscure—it’s part of a network of normative concepts (reasons, oughts) that illuminate each other. We can say:  
  - A reason to admire X is fitting iff it’s *grounded in X’s features* (not just any reason!).  
  - But “grounded in X’s features” means…? *That’s where the buck stops*. Fittingness is the primitive anchor. Your object-given reasons are just *fittingness-constituting reasons*.  

  **Alex:** So you admit there’s no analysis?  

  **Sam:** Correct—but neither is there for “reason” or “ought.” The choice is:  
  1. A primitive *goodness* (non-naturalists),  
  2. A primitive *fittingness* (us), or  
  3. Your circular reduction.  
  Option 2 avoids Moore’s Open Question for goodness *and* solves WKR cleanly: The demon’s reason isn’t a *fittingness-reason*, full stop. No gerrymandered distinctions needed.  

  **Alex:** But if fittingness is primitive, why can’t the *demon make admiration fitting* by his threat? What constrains it?  

  **Sam:** The same thing constraining any primitive: our normative intuitions + coherence. We intuit that threats don’t make attitudes fitting—they make them prudent. Fittingness is a *sui generis* standard for attitudes. Demons can’t change that, just like they can’t make 2+2=5.  

  **Alex:** ...So we’re back to intuition-pumping. I still think the object/state line, tweaked, can work.  

  **Sam:** And I think it’s a elegant but ultimately circular scaffold. Sometimes the buck *should* stop. *(Sips coffee)* Another round?  

  ---

  ### Key Moves Engaged:
  - **Alex’s defense:** Distinction as non-circular via object/property focus → **Sam’s rebuttal:** Wrong properties show reliance on prior fittingness.  
  - **Alex’s refinement:** Constitutive norms/naturalization → **Sam’s rebuttal:** Constitutive norms presuppose normativity; naturalization misses normative force.  
  - **Sam’s positive:** Fittingness as primitive anchor → **Alex’s worry:** Primitivism = mystery → **Sam’s reply:** Fittingness integrates coherently with reasons/oughts; avoids reduction’s circularity.  

  This mirrors real debates (e.g., D’Arms/Jacobson vs. Crisp; Scanlon vs. Parfit). Both sides leave with bloodied but unbowed noses!
