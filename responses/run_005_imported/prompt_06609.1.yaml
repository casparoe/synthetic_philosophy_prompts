  2. **Managing the News Worry**: 
     - Main: One worry is that even if the AI is formally indifferent between the shutdown and non-shutdown branches, it might still try to "manage the news" — for instance, by avoiding information that would cause it to believe the button is more likely to be pressed, because that knowledge might constrain its future actions. How does utility indifference prevent such epistemic shenanigans?
     - Follow-up (if she says something about the correction terms accounting for beliefs): But if the correction terms depend on the AI's beliefs, couldn't the AI manipulate its own beliefs (e.g., via selective information gathering) to set those correction terms to values that effectively undo the indifference?

  3. **Subagents/Successors Corrigibility**:
     - Main: If we build an AI that is utility-indifferent about its own shutdown, why would it extend that same corrigibility to any subagents it creates or to its successor agents? Couldn't it just route around the constraint by creating an uncorrigible subagent to do the work it doesn't want to do?
     - Follow-up (if she suggests that the AI would value corrigibility in subagents): But if the AI is maximizing a utility function that doesn't explicitly reward corrigibility in subagents, why wouldn't it just create subagents that are fully aligned with the original utility function (without the shutdown terms) and then let them run amok?

  4. **Reflective Stability**:
     - Main: Is utility indifference reflectively stable? That is, if the AI undergoes self-improvement or modifies its own code, would it choose to preserve the utility indifference mechanism, or would it see it as a constraint to be optimized away?
