answer: |-
  Here’s a toast weaving Plato’s wisdom into your friend’s milestone, balancing respect for his past and present, and ending on that perfect supervisory note:

  **(Clink glass lightly)**  
  "Friends, runners, countrymen – lend me your ears! As we gather to celebrate [Friend's Name] crossing the Rubicon into his fabulous forties, I found myself, perhaps predictably, down a rather dusty rabbit hole: Plato’s *Laws*. Bear with me – it’s surprisingly relevant!  

  Old Plato, it turns out, had very strong opinions on birthday parties... or at least, on communal feasts. He laid down a strict, age-graded wine policy:  
  *   **Under 18?** Strictly water. (Sensible.)  
  *   **18 to 40?** Moderation. Training wheels on. Learn control.  
  *   **Forty and beyond?** Permission granted. *Real* permission. Philosopher’s orders!  

  Why forty? Plato argued that as we leave youth behind, a certain... *rigidity* can set in. We risk becoming, in his charming phrase, ‘crabbed’ – a bit stiff, a bit overly serious, maybe even a touch too proud to sing off-key or attempt that questionable dance move. His radical prescription? **Controlled, communal merriment.** Wine, shared freely *after forty*, under watchful eyes, serves a serious purpose: it loosens the inhibitions that age can tighten. It melts the ‘shame’ that might stop a wise man from joining the young in pure, joyful abandon. It keeps the soul supple.  

  Now, this isn’t just permission to indulge; Plato saw the supervised drinking party as a crucial **test of character**, akin to facing danger for courage. Can you hold your virtue when your head is light? It’s a gym for the soul... which is why, crucially, it *must* be supervised.  

  **(Turn warmly to the Friend)**  
  [Friend's Name], this lands... interestingly. Because our dear honoree presents Plato with a fascinating case study! Plato’s first two stages? Oh, he *nailed* them. Our university years? Let’s just say he explored the ‘training wheels’ phase with the dedication of a... well, a future marathoner pushing limits. He tested that ‘moderation’ hypothesis *rigorously*, often being the last philosopher-king standing at dawn.  

  Then came the pivot. The running shoes. The discipline. The incredible endurance. To his running club friends here tonight, who’ve only known this focused, sober powerhouse: believe us, the transformation is awe-inspiring. He traded late nights for early miles, and found a different kind of strength, a different kind of joy – and someone incredible to share it with. He passed the ‘moderation’ test with flying colours, then sprinted right past it into a whole new arena.  

  **(Bridge to both groups)**  
  So, here he stands at Plato’s threshold of forty. The philosopher says the rules change. The prescription is communal joy, release, keeping the spirit limber. But here’s the beautiful thing about [Friend's Name]: he’s already shown us the core of Plato’s lesson. It was never *just* about the wine. It was about **knowing yourself, mastering yourself, and finding your path to genuine connection and joy.**  

  Whether it’s pushing through mile 20, sharing a deep conversation, laughing until you cry with old friends, or simply being fully present in the moment – *that’s* the spirit Plato wanted to cultivate at forty. The license isn’t to regress; it’s to engage *fully* with life’s feast, unburdened by unnecessary stiffness. [Friend's Name], you’ve already embodied this. You’ve shown discipline when it mattered, and you radiate a joy and connection that inspires everyone here. You’ve proven your character in every arena.  

  **(The Graceful Admission & Close)**  
  Now, Plato was adamant about one thing: this communal merriment *requires* a sober supervisor. Someone to keep the philosophical ship steady, ensure the singing stays (mostly) in key, and gently guide anyone who might misinterpret ‘suppleness of soul’ as a challenge to recreate their personal ‘moderation-testing’ peak from 2005.  

  *(Raise glass higher, smile broadly)*  
  **So, [Friend's Name], as you step boldly into Plato’s prescribed era of licensed joy and supple-souled celebration: We raise our glasses to you!**  
  To the incredible discipline you’ve shown, to the profound joy you bring, to the miles run and the miles yet to come. To forty years well-lived, and the vibrant, un-crabbed spirit you carry forward.  
  **And**... to me, your designated sober supervisor for the evening. Plato insisted. My solemn duty is to ensure the philosophical merriment proceeds with wisdom, grace... and absolutely no pressure to revert to 2005. Cheers to you!"  

  **Why this works:**  

  1.  **Plato Front & Center:** Uses his specific reasoning (age thresholds, purpose of wine, supervision) clearly and engagingly.  
  2.  **Respects Both Eras:** Acknowledges the past ("last philosopher-king standing") with affectionate humour, but pivots strongly to celebrate his *current* achievements and discipline ("awe-inspiring," "radiates joy"). The running club hears genuine admiration.  
  3.  **Reframes "License":** Shifts Plato's "license to drink" into a broader "license to joyful engagement," embodied by the friend's *current* life. The punchline isn't "drink again," it's "you already have the spirit."  
  4.  **Sober Supervisor Nailed:** Makes the supervisor role a funny, self-deprecating, and philosophically justified conclusion that reassures *everyone* (especially the friend!) that no pressure is intended.  
  5.  **Tone:** Warm, affectionate, intellectual-but-accessible, humorous without being crass.  
  6.  **Length:** Structured for pacing, fits comfortably within 3-4 minutes spoken aloud.  

  **Deliver it with warmth, eye contact (especially to the friend and his partner), and a smile. The "sober supervisor" line should get a good laugh and land the reassurance perfectly.** Enjoy the celebration!
