answer: |-
  Your unease is profound because it pits cold logic against deep moral intuition—even with outcome bias named, the feeling persists. But there's nuance: while the *decision* was equally irresponsible in both cases, outcomes *do* ethically matter when assigning blame. Here’s why:

  ### 1. **Harm Justifies Accountability**
     - **Your scenario**: No harm → no victim. Accountability is theoretical.  
     - **Your friend’s scenario**: Actual harm occurred (data leak). Her action became a *causal link* in a chain of damage.  
     *Principle*: Blame isn’t just about the decision, but its consequences. Society (and companies) assign blame proportionally to harm caused. A drunk driver who hits a pedestrian faces harsher judgment than one stopped at a checkpoint—same recklessness, different outcome.

  ### 2. **The "Moral Luck" Paradox**
     - Philosophers like Thomas Nagel argue that moral luck—where outcomes beyond our control affect blame—is unavoidable.  
     - *Your luck*: The bug missed critical edge cases.  
     - *Her bad luck*: The bug intersected with unanticipated conditions.  
     *Principle*: We *must* judge based on results when harm exists, even if luck played a role. Ignoring outcomes would trivialize real-world suffering.

  ### 3. **Process vs. Consequence in Organizational Response**
     - Companies reprimand based on **risk materialization**, not just risk-taking:  
       - **You**: Created risk (violated process) → risk didn’t materialize → no action.  
       - **Friend**: Created risk → risk materialized (data leak) → formal response.  
     - *Why?* Organizations prioritize *preventing repeat harm*. A near-miss might prompt a quiet process tweak; an actual breach demands visible accountability to restore trust.

  ### 4. **The "Near-Miss" Cognitive Trap**
     - Your brain discounts your own risk because nothing bad happened ("It *was* safe!"). This is the **normalization of deviance**.  
     - Her outcome forces acknowledgment: "This *could* have been me." That discomfort feels like a judgment on her—but it’s really your subconscious confronting your own lapse.

  ### Should Blame Track Outcomes? A Balanced View:
  - **Yes, partially**: Outcomes reveal the *real-world impact* of actions. Ignoring them would decouple morality from consequences.  
  - **No, absolutely not**: For *preventing future harm*, focusing **only** on outcomes is dangerous. Near-misses (like yours) are warnings—punishing only failures incentivizes hiding mistakes.  

  ### The Path Forward:
  1. **Acknowledge your luck**: You weren’t "more responsible"—you were *lucky*. Your friend’s outcome could have been yours.  
  2. **Channel the guilt productively**:  
     - Advocate for safeguards that prevent solo deploys (e.g., automated branch protections).  
     - Share your story (anonymously) as a cautionary tale: "I bypassed review and got lucky—here’s why it was still wrong."  
  3. **Reframe your friend’s reprimand**: It wasn’t (just) punishment—it was her company’s flawed attempt to signal "we take this seriously." The true failure was theirs: no system should rely on heroics or luck.

  **In the end**: You’re wrestling with moral luck—an unsolvable tension in ethics. But naming it lets you honor both truths: Your decisions were equally reckless, yet her outcome *does* warrant greater accountability. The key isn’t to dismiss your guilt, but to let it fuel better systems so no one’s luck runs out.
