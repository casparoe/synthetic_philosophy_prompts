  okay so for my chinese philosophy elective we're reading the analects and i got stuck on this bit that my teacher says is like THE key passage for "role ethics" readings of confucius (the ames/rosemont interpretation, not just standard virtue ethics stuff). its Analects 13.18:

  "The Duke of She informed Confucius, saying, 'Among us here there are those who may be styled upright in their conduct. If their father have stolen a sheep, they will bear witness to the fact.' Confucius said, 'Among us, in our part of the country, those who are upright are different from this. The father conceals the misconduct of the son, and the son conceals the misconduct of the father. Uprightness is to be found in this.'"

  i get the surface "family loyalty > snitching" reading, but i dont get why role ethics people treat this passage as central instead of it just being an akward moment where confucius sounds kinda corrupt. can someone explain what's actually philosophically going on, like why defining "uprightness" (zhi) through the father-son relationship instead of an impartial rule counts as a FEATURE of confucian ethics and not a bug? and how is that diff from him just saying rules dont matter when family's involved?
