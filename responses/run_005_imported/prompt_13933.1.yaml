prompt: |-
  A colleague of mine in the economics department, who consults part-time for an effective-altruism-aligned grantmaking foundation, recently asked me to help settle an internal disagreement. The foundation's practice has been to rank competing grants by expected value alone, but one program officer has begun invoking Lara Buchak's risk-weighted expected utility (REU) theory to argue that a funder can be rationally risk-averse — and not merely averse in the ordinary, diminishing-marginal-utility sense that standard expected utility theory already accommodates — when preferring a portfolio of well-evidenced global-health grants over a single higher-expected-value but extremely high-variance bet on reducing existential risk. I understand REU's basic apparatus well enough (the risk function r operating on cumulative rather than outcome-wise probabilities, and its capacity to treat Allais-style preferences that violate the independence axiom as fully rational rather than as errors) to see that this is not simply a relabeled concave utility function, but I have not worked through what actually follows from taking the theory seriously in a case like this one.

  For a talk I have been asked to give at our philosophy department's colloquium, could you describe the most important implications of risk-weighted expected utility theory for this kind of cause-prioritization dispute? I am especially interested in whether an REU-based defense of the risk-averse program officer can be reconciled with the standard "shut up and multiply" rejoinder that expected-value reasoning is precisely what rationality demands once the stakes are large enough, and whether there is any principled, REU-internal limit on how much weight the risk function may place on variance before the theory shades from an account of rational risk-attitudes into a vehicle for smuggling in substantive value judgments it was meant to avoid.
reasoning: |-
  Okay, the user is an academic in philosophy preparing a colloquium talk about applying Lara Buchak's Risk-Weighted Expected Utility (REU) theory to a grantmaking dispute. The core tension is between traditional expected value maximization ("shut up and multiply") and a program officer's REU-based argument for preferring lower-variance global health grants over high-stakes existential risk reduction. 

  Hmm, this is fascinating because it pits two philosophical frameworks against each other in a high-impact practical context. The user clearly understands REU's mechanics but wants help articulating its implications for cause prioritization. Their hidden questions seem to be: (1) Can REU legitimately override standard EV arguments? (2) Does REU risk becoming a value-laden cop-out?

  First, I should map why REU challenges "shut up and multiply." Standard EU already handles diminishing marginal utility, but REU introduces distinct risk-attitudes through the r-function. The Allais paradox example comes to mind—REU explains why someone might prefer certainty even when it violates independence axioms. That's crucial here: the program officer isn't irrational for disliking the existential risk gamble's extreme variance.

  But the stakes change everything. Pascal's Mugging-type scenarios show how standard EV prioritizes tiny probabilities of vast payoffs. REU resists this by downweighting tail risks. Is that defensible? Buchak would say yes—rationality doesn't require tail-risk neutrality. The r-function formalizes how much evidence you need before betting the farm. 

  The real thorn is whether REU's r-function smuggles in values. If the program officer sets r(p)=p², they're effectively saying "I need near-certainty for huge gambles." That feels like a normative stance disguised as risk-attitude. But Buchak argues the r-function reflects instrumental rationality: given finite resources, avoiding ruin might be prudent. Still, in philanthropy, isn't maximizing expected impact the whole point? 

  For the talk, I'd emphasize REU's double-edged sword: It legitimizes variance aversion but makes grant allocation sensitive to subjective r-functions. The foundation must decide whether "rational" includes context-dependent risk-attitudes—and whether that undoes EA's core tenet. Maybe propose a middle ground: use REU for portfolio construction but EV for individual grants? Though that might dissatisfy both sides...
answer: |-
  Here's a structured analysis of REU's implications for cause prioritization, designed for a philosophy colloquium talk, addressing your core concerns about reconciling REU with "shut up and multiply" (SUAM) and the limits of risk-weighting:

  ### 1. **REU's Core Challenge to "Shut Up and Multiply"**
     - **Beyond Diminishing Marginal Utility**: Standard EU accommodates variance aversion via concave *utility functions* (e.g., \$1M saving 1 life ≠ \$1B saving 1000 lives). REU introduces *risk aversion independent of marginal utility* through the **risk function *r(p)***. This function transforms cumulative probabilities, overweighting or underweighting tail events based on an agent’s *attitude toward uncertainty itself*.
     - **Existential Risk Gambles**: In a choice between:
       - **Option A**: Portfolio of global health grants (EV = *X*, low variance).
       - **Option B**: High-variance existential risk reduction (EV = *X + δ*, δ>0 but tiny probability of astronomical payoff).
       <br>REU can rationalize preferring A even if B has higher EV. The *r(p)* function downweights B’s low-probability upside if the agent is risk-averse (*r(p)* < *p* for small *p*).

  ### 2. **Reconciling REU with SUAM: The Stakes Dependence Claim**
     - **SUAM’s Argument**: When stakes are high enough (e.g., extinction risk), any rational agent *must* maximize EV—variance aversion becomes irrational.
     - **REU’s Counter**: Rationality does not *require* tail-risk neutrality. Buchak argues that **instrumental rationality** (achieving ends) permits sensitivity to the *structure* of uncertainty. REU formalizes this:
       - An agent with *r(p) = p*<sup>2</sup> (highly risk-averse) discounts near-zero probabilities aggressively. For them, preferring A over B is *instrumentally rational* if their goal is to avoid catastrophic losses (e.g., wasting resources on ineffective x-risk projects).
       - **Key Insight**: REU denies that rationality demands we treat all probabilities linearly when outcomes are extreme. High stakes *intensify* but do not *eliminate* the role of risk-attitudes.

  ### 3. **Implications for Cause Prioritization**
     - **Legitimizing Variance Aversion**: REU provides a rigorous framework for prioritizing "robust" interventions (e.g., bed nets) over speculative ones (e.g., AI alignment moonshots), *even if the latter have higher point estimates of EV*. This challenges EA’s default EV-maximization.
     - **Portfolio Justification**: REU supports diversifying grants to reduce exposure to model uncertainty or correlated failures—something EV maximization may undervalue.
     - **Epistemic Humility**: REU can incorporate doubt about probability estimates. If x-risk probabilities are highly uncertain, a risk-averse *r(p)* may favor interventions with better-evidenced impact distributions.

  ### 4. **The Crucial Limit: When Does Risk-Weighting Become Value-Laden?**
     - **The Internal Coherence Constraint**: Buchak imposes formal requirements on *r(p)* (e.g., monotonicity, *r(0)=0*, *r(1)=1*). However, these permit extreme risk aversion (e.g., *r(p) ≈ 0* for *p*<0.5).
     - **The Boundary Problem**: REU risks collapsing into substantive value judgments if:
       - **Risk-Attitudes Overwhelm Outcomes**: If *r(p)* discounts *all* low-probability gains (e.g., *r(0.001) ≈ 0*), it could reject *any* x-risk intervention regardless of stakes—effectively prioritizing certainty over astronomical goods. This mirrors deontological constraints (e.g., "never bet on tiny probabilities").
       - **Context Sensitivity**: If *r(p)* varies arbitrarily across domains (e.g., risk-averse for x-risk but risk-seeking for crypto), REU loses normative force.
     - **Buchak’s Defense**: Rationality only requires that *r(p)* reflects stable, instrumentally justified preferences (e.g., avoiding ruin). Yet in philanthropy—where "ruin" means failing to help—this defense is strained. Extreme risk aversion may *de facto* prioritize near-term certainties over existential futures, importing a controversial temporal or certainty bias.

  ### 5. **A Principled Middle Ground?**
     - **Evidence-Sensitive Risk-Weighting**: REU could weight risks based on *epistemic confidence* (e.g., less aversion when probabilities are well-founded). This aligns with the program officer’s emphasis on "well-evidenced" grants.
     - **Thresholds for "Pascal's Mugging"**: Set *r(p)* such that only probabilities above a minimum threshold (e.g., *p* > 10<sup>-6</sup>) influence decisions—a compromise between SUAM and blanket risk aversion.
     - **Dominance Reasoning**: REU can accommodate **stochastic dominance**: If B *always* yields equal-or-better outcomes than A, REU prefers B regardless of *r(p)*. This prevents absurd risk aversion but doesn’t resolve x-risk cases.

  ### Conclusion for Your Talk
  REU theory legitimizes risk aversion beyond marginal utility, challenging SUAM’s hegemony in high-stakes philanthropy. However, its capacity to defend prioritizing low-variance grants relies on controversial specifications of *r(p)* that risk smuggling in normative commitments (e.g., privileging near-term certainty). The theory permits—but does not mandate—extreme risk aversion; foundations must decide whether such attitudes are *instrumentally rational* or a *value choice* to prioritize robust evidence over speculative grandeur. Ultimately, REU reframes the debate: **Risk-attitudes are not irrational biases but core components of rational decision-making under deep uncertainty—yet they must be bounded by evidence and coherence to avoid collapsing into dogmatism.**

  **Recommended Slide Foci**:  
  1. REU’s *r(p)* vs. EU’s *u(x)*: Two distinct sources of variance aversion.  
  2. How *r(p) = p²* rationalizes rejecting a positive-EV x-risk bet.  
  3. The Allais Paradox: REU’s explanatory power vs. its normative implications for stakes-sensitivity.  
  4. The spectrum: When does *r(p)* shift from "prudent" to "dogmatic"?
