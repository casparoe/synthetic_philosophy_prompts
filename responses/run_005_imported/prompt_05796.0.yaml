prompt: |-
  Random question from my epistemology seminar - we read Hume on induction (the whole custom-and-habit-from-constant-conjunction story) and then jumped straight into Goodman's grue paradox the next week. My professor kind of implied grue is a genuinely new problem that Hume's account never has to face, but im not totally sold on that. If Hume actually had to grapple with the grue example, do you think his own theory of induction already gives him a principled reason to project 'green' rather than 'grue,' or would he honestly have no good answer to Goodman? Curious what you think and why - feel free to disagree with my prof.
