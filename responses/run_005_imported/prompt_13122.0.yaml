  Here’s a concise, balanced memo draft that acknowledges both perspectives and proposes a solution-focused path forward:

  ---

  **MEMORANDUM**  
  **To:** Members of the Old Town Monuments Trust  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Proposal for Adam Smith Statue Plaque – Recommendation  

  ### Background  
  The proposal seeks to install a plaque on the Adam Smith statue contextualizing his legacy within colonial economic exploitation, citing parallels to the Dundas monument’s reinterpretation. While acknowledging the importance of confronting difficult histories, the Trust is divided on whether the current wording accurately reflects Smith’s scholarship.  

  ### Key Considerations  
  1. **Arguments FOR the plaque**:  
     - Smith’s theories (e.g., "invisible hand," free markets) were later co-opted to justify exploitative colonial policies, regardless of his original intent.  
     - Public monuments should acknowledge complex legacies, not just celebrate figures uncritically. Edinburgh has set a precedent with the Dundas plaque.  

  2. **Arguments FOR REWRITING/AGAINST current wording**:  
     - Smith explicitly condemned colonial monopolies (e.g., East India Company) and exploitation in *Wealth of Nations* (Book IV), calling colonies economically detrimental to Britain.  
     - Attributing colonial exploitation *directly* to Smith oversimplifies his work and risks misinforming the public. The link is one of historical reinterpretation, not advocacy.  

  ### Recommendation: Return for Rewrite  
  I propose **rejecting the current wording but endorsing the plaque’s intent**, subject to revised text that addresses both perspectives.  

  #### Reasons:  
  - **Accuracy Over Anachronism**: Smith criticized colonialism, but his theories were later weaponized. The plaque should distinguish between his writings and posthumous misuse.  
  - **Educational Value**: A nuanced plaque can teach visitors about historical complexity—e.g., how ideas evolve beyond their creators—without reducing Smith to a symbol of oppression.  
  - **Precedent**: The Dundas plaque succeeds by specifying Henry Dundas’ *actions* (delaying abolition); similarly, Smith’s plaque should clarify *later interpretations* of his ideas, not imply endorsement.  

  #### Suggested Rewrite Principles:  
  > *"While Adam Smith critiqued colonial exploitation, his advocacy for free markets was later invoked to justify imperial economic policies. This illustrates how ideas can be detached from their original moral frameworks."*  

  ### Next Steps  
  Approve a subcommittee to draft language that:  
  1. Cites Smith’s anti-colonial writings explicitly.  
  2. Distinguishes his theories from their later applications.  
  3. Avoids presentist framing (e.g., "gave cover to") in favor of historical analysis.  

  Voting to reject the *current text* but support a *revised plaque* honours both the need for context and scholarly rigor.  

  ---  

  ### Why this approach works:  
  - **For contextualizers**: It affirms the need to address colonial legacies and Smith’s unintended influence.  
  - **For textualists**: It centers Smith’s actual writings and rejects reductive claims.  
  - **For the public**: It offers deeper insight into how ideas intersect with power over time.  

  This turns a polarized debate into a collaborative effort for historical precision—which, after all, is the Trust’s mission. Let me know if you’d like tweaks for tone or emphasis!
