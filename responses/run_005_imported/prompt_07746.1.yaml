  We are grading an answer to a question about Lewis's triviality proof against Adams' Thesis (often called the Equation).

  The question has several parts:
  1. State Lewis's Equation (which is the same as Adams' Thesis: P(A > B) = P(B | A) for P(A) > 0).
  2. Sketch the key steps of Lewis's first triviality proof, illustrating with a simple example.
  3. Explain what the result shows and what it leaves open for a theorist like Adams.

  The submitted answer:

