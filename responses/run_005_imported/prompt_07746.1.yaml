  ### Suggestions for Classmate  
  - **Strengthen attribution**: Lewis’s "Equation" refers to his *formalization* of Adams’ Thesis for critique.  
  - **Clarify the proof’s assumption**: The proof requires the Equation to hold *robustly* (i.e., under conditionalization).  
  - **Adams’ defense**: His view survives because conditionals aren’t truth-apt propositions—they encode rational constraints on belief updates.  
  - **Further reading**: Lewis (1976) "Probabilities of Conditionals," and Adams (1975) *The Logic of Conditionals*.
