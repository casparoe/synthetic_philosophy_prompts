prompt: |-
  Quick context: I'm working on a piece about the math behind negotiation (divorce settlements, wage disputes, that sort of thing) and fell down a rabbit hole comparing the Nash bargaining solution to the Kalai-Smorodinsky one. I think I've got the basic geometric picture down - Nash maximizes the product of the two side's utility gains over the disagreement point, KS instead picks the point on the Pareto frontier that sits on the straight line to the "ideal point" (the max each side could conceivably get). Where I keep getting stuck is on the axioms. From what I gather, the whole reason KS exists as a rival solution is that Kalai and Smorodinsky thought Nash's independence of irrelevant alternatives axiom was suspect and swapped it out for a monotonicity axiom instead, and every game theorist I've talked to seems to treat that swap as basically a slam dunk in KS's favor, like IIA is just the axiom that "looses" once you see the standard counterexample.

  Nobody's actually walked me through a real defense of IIA though, so I wanna put the question to you directly: can you make the strongest case you can FOR sticking with independence of irrelevant alternatives, or at least against treating monotonicity as the more obviously rational requirement? I'm not looking for "well, Nash's solution is more popular in econ departments" as an answer - I want something that actually engages with why IIA might capture something genuinely important about rational bargaining that the standard KS counterexample doesn't really kill. If it helps, feel free to bring in the non-cooperative side of things too - I vaguely remember an economist mentioning that Rubinstein's alternating-offers model connects to Nash's solution in some deep way that KS doesn't have an equivalent for, but she didn't have time to spell it out and I never got the details straight.
