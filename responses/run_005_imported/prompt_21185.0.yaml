  The user might be conflating the two because both deal with evidence underdetermining conclusions. But Quine's point in translation is more profound: meaning isn't just hidden; it's indeterminate. The user's deeper need might be understanding Quine's radical view of meaning and its implications for philosophy of language. They might also want to know which idea is more controversial—probably indeterminacy, as it challenges the very existence of meanings. 

  I should highlight that underdetermination is common in philosophy of science, while indeterminacy attacks the foundation of semantics. Quine's behaviorism leads him to reject mental meanings, which is why gavagai isn't resolvable even in principle. That's weirder and more radical. 

  Also, justify why indeterminacy is more radical: it denies a fact of the matter where we usually assume one, like in meaning. This ties into Quine's rejection of the analytic-synthetic distinction and his naturalism. The user might appreciate how this impacts linguistics and philosophy, making communication seem shaky. 

