prompt: |-
  So I went down a Quine rabbit hole a while back. There's that famous "gavagai" thing - a linguist is with someone who speaks a totally unknown language, a rabbit runs by, the guy says "gavagai," and apparently no matter how much evidence you collect you can never actually nail down if he means "rabbit" or "undetached rabbit-part" or "rabbit-stage," because all those meanings fit his behavior equally well. That's the indeterminacy of translation.

  But I also read that Quine's the same guy behind the idea that scientific theories are underdetermined by evidence (I think its called the Duhem-Quine thing?) - that for any pile of data there's always more then one theory that fits it just as well, so evidence alone can't crown a single "correct" theory.

  And these feel like the same basic move to me?? "evidence never pins down one right answer," just applied twice. Is the gavagai stuff actually just a special case of that, or is Quine doing something stranger/more radical with translation that doesn't reduce to normal underdetermination? If they're genuinely different, what's the actual difference, and which one do you think is the weirder/more radical claim philosophically - justify it.
