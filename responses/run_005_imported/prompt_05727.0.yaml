answer: |-
  Below is a constructed 3x3 normal-form game demonstrating the distinction between pure-strategy dominance and mixed-strategy dominance. The game is designed for **Rowena (row player)** and **Colin (column player)**, with Rowena having strategies \(R1\), \(R2\), \(R3\) and Colin having strategies \(C1\), \(C2\), \(C3\). Payoffs are listed as (Rowena, Colin).

  ### Payoff Matrix
  |          | **C1**   | **C2**   | **C3**   |
  |----------|----------|----------|----------|
  | **R1**   | (4, 0)   | (0, 0)   | (3, 0)   |
  | **R2**   | (0, 0)   | (5, 0)   | (3, 0)   |
  | **R3**   | (0, 0)   | (0, 0)   | (2, 0)   |

  **Key properties**:
  - Colin's payoffs are always 0 (indifferent across all strategies), so no Colin strategy is ever dominated.
  - **Target strategy**: Rowena's \(R3\) is **not dominated by any pure strategy** but **is dominated by a mixed strategy** (e.g., \( \sigma = \frac{2}{3}R1 + \frac{1}{3}R2 \)).

  ---

  ### Iterated Elimination: Pure-Strategy Dominance Only
  We eliminate strategies dominated by another **pure** strategy (no mixed strategies allowed).

  - **Round 1**:
    - *Rowena*:  
      - \(R1\) vs. \(R2\):  
        - Against \(C1\): \(4 > 0\) → \(R1\) better  
        - Against \(C2\): \(0 < 5\) → \(R2\) better  
        - Against \(C3\): \(3 = 3\) → tie  
        → Neither dominates the other.  
      - \(R1\) vs. \(R3\):  
        - Against \(C3\): \(3 > 2\) → \(R1\) better, but against \(C1\): \(4 > 0\) → \(R1\) better, against \(C2\): \(0 = 0\) → **not strictly better** everywhere.  
        → \(R1\) does **not** dominate \(R3\).  
      - \(R2\) vs. \(R3\):  
        - Against \(C2\): \(5 > 0\) → \(R2\) better, but against \(C1\): \(0 = 0\) → **not strictly better** everywhere.  
        → \(R2\) does **not** dominate \(R3\).  
      - \(R3\) is not dominated by any pure strategy.  
    - *Colin*: All payoffs are 0 → no dominance.  
    → **No strategies eliminated**. Game remains unchanged.  

  - **Round 2 (and beyond)**:  
    Identical to Round 1. No further eliminations occur.  
    → **\(R3\) survives indefinitely**.  

  ---

  ### Iterated Elimination: Mixed-Strategy Dominance Allowed
  We now eliminate strategies dominated by any **mixed strategy**.

  - **Round 1**:  
    - *Rowena*:  
      Check if \(R3\) is strictly dominated by a mixed strategy. Consider \( \sigma = \frac{2}{3}R1 + \frac{1}{3}R2 \):  
      - Against \(C1\): \( \left(\frac{2}{3} \times 4\right) + \left(\frac{1}{3} \times 0\right) = \frac{8}{3} \approx 2.67 > 0 \)  
      - Against \(C2\): \( \left(\frac{2}{3} \times 0\right) + \left(\frac{1}{3} \times 5\right) = \frac{5}{3} \approx 1.67 > 0 \)  
      - Against \(C3\): \( \left(\frac{2}{3} \times 3\right) + \left(\frac{1}{3} \times 3\right) = 3 > 2 \)  
      → \( \sigma \) strictly dominates \(R3\).  
      → **Eliminate \(R3\)**.  
    - *Colin*: Still no dominance.  
    New game:  
    |          | **C1** | **C2** | **C3** |
    |----------|--------|--------|--------|
    | **R1**   | (4, 0) | (0, 0) | (3, 0) |
    | **R2**   | (0, 0) | (5, 0) | (3, 0) |  

  - **Round 2**:  
    - *Rowena*:  
      - \(R1\) vs. \(R2\):  
        - Against \(C1\): \(4 > 0\) → \(R1\) better  
        - Against \(C2\): \(0 < 5\) → \(R2\) better  
        - Against \(C3\): \(3 = 3\) → tie  
        → Neither pure strategy dominates the other.  
      - Check mixed strategies:  
        - Any mixture of \(R1\) and \(R2\) will have payoff \(\leq 4\) against \(C1\) (achieved by pure \(R1\)) and \(\leq 5\) against \(C2\) (achieved by pure \(R2\)). No mixed strategy dominates \(R1\) or \(R2\).  
      → **No further eliminations**.  
    - *Colin*: Still no dominance.  
    → **Process ends with \(\{R1, R2\}\) for Rowena and \(\{C1, C2, C3\}\) for Colin**.  

  ---

  ### Why This Distinction Matters for Epistemic Rationalizability
  - **"Not dominated by a pure strategy"** \(\not\Rightarrow\) **"Never a best response"**:  
    \(R3\) is not dominated by any pure strategy, but it is **never a best response** to any belief over Colin's strategies. For any belief \((q_1, q_2, q_3)\) (probabilities on \(C1, C2, C3\)):  
    - Payoff of \(R1 = 4q_1 + 0q_2 + 3q_3\)  
    - Payoff of \(R2 = 0q_1 + 5q_2 + 3q_3\)  
    - Payoff of \(R3 = 0q_1 + 0q_2 + 2q_3\)  
    → \(R3\) is strictly worse than a mixture of \(R1\) and \(R2\) (e.g., \(\sigma\) above) for **all** opponent strategies, so it cannot be a best response.  

  - **Epistemic implication**:  
    Common knowledge of rationality (CKR) implies players only play strategies that are **best responses** to their beliefs. Thus, \(R3\) is **irrationalizable** (eliminated when mixed dominance is allowed). Purely pure-strategy elimination fails to capture this, as it leaves \(R3\) intact despite its epistemic indefensibility.  

  This shows that **rationalizability** (via "never a best response") is **equivalent to mixed-strategy dominance** in finite games, while pure-strategy dominance is a weaker criterion. For epistemic foundations, this highlights why mixed strategies are necessary to fully characterize rationality under CKR.
