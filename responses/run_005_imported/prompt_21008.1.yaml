answer: |-
  You're absolutely right to probe this passage - Russell is compressing several anthropological, psychological, and historical arguments into a tight, almost syllogistic form. The "Hence" *is* a big leap, resting on unstated assumptions common in early 20th-century thought but needing unpacking for your character's accurate paraphrase. Let's dissect it step-by-step, showing how Russell intends the pieces to lock together:

  1.  **The Core Claim:** "The purely instinctive element in jealousy is not nearly so strong as most moderns imagine." Russell argues against the idea that jealousy is a primal, universal emotion driven *solely* by sexual possessiveness or emotional attachment. He posits a significant social/cultural overlay.

  2.  **The Patriarchal Driver:** "The extreme strength of jealousy in patriarchal societies is due to the fear of falsification of descent." This is the key socio-historical explanation. In societies where lineage, inheritance, and power flow patrilineally (through the father), ensuring a man's children are *biologically his own* becomes paramount. Jealousy here is primarily a *property and lineage protection mechanism*, not just an emotional reaction.

  3.  **The Wife/Mistress Illustration: Demonstrating the Primacy of Lineage over Emotion:**
      *   **The Setup:** "A man who is tired of his wife and passionately devoted to his mistress..."
      *   **The Observation:** "...will nevertheless be more jealous where his wife is concerned than when he finds a rival to the affections of his mistress."
      *   **The Logic:** *This directly challenges the "instinctive jealousy tracks love" assumption.* If jealousy were purely instinctive/emotional, he should feel *more* jealous about the mistress, the object of his passion. The fact he feels *more* jealous about the wife, whom he *doesn't* love passionately, signals a *different motivation*. Russell uses this to *prove* his opening claim: the intensity of patriarchal jealousy isn't explained by instinctive possessiveness/love alone. The stronger jealousy towards the wife points directly to the "fear of falsification of descent" – the wife is the one whose fidelity ensures the legitimacy of his *heirs*.

  4.  **The "Ego/Egoism" Explanation: Why Lineage Matters So Much:**
      *   **The Statement:** "A legitimate child is a continuation of a man's ego, and his affection for the child is a form of egoism."
      *   **Its Argumentative Role (Crucial!):** This is *not just a flourish*. It explains the *psychological underpinning* of the "fear of falsification."
          *   **"Continuation of a man's ego":** In a patriarchal system, a man's identity, legacy, social standing, and immortality (in a sense) are vested in his *legitimate male heirs* who bear his name and inherit his property. His lineage *is* an extension of his self.
          *   **"Affection... is a form of egoism":** Russell provocatively suggests that the deep love a father feels for his legitimate son (the primary heir) is intertwined with this self-interest. He loves the child *because* the child *is* "him" continued. It's an affection rooted in self-projection and legacy.
          *   **Connecting to the Example & Falsification Fear:** This explains *why* the man is more jealous over the wife. A rival impregnating the wife threatens the *biological foundation of this ego-extension*. If the child isn't his, his "continuation" is false; he invests love and resources into a child who isn't "him," sabotaging his legacy. His ego is fundamentally betrayed. The mistress's child, even if his, likely isn't his *heir*; it doesn't threaten his core patriarchal identity/legacy in the same way. The jealousy difference stems from the *stakes for his ego via lineage*.

  5.  **The Consequence of Doubt: "The Putative Father is Tricked":**
      *   **The Statement:** "If, on the other hand, the child is not legitimate, the putative father is tricked into lavishing care upon a child with whom he has no biological connection."
      *   **The Logic:** This restates the core fear driving patriarchal jealousy. Uncertainty of paternity creates the terrifying possibility of a man unknowingly dedicating his life, resources, and love (egoistic or otherwise) to a child who isn't biologically his, thereby diverting his legacy away from his true bloodline. This is framed as a profound deception ("tricked").

  6.  **The "Hence" and the Historical Claim:**
      *   **The Claim:** "...the discovery of fatherhood led to the subjection of women as the only means of securing their virtue—a subjection first physical and then mental, which reached its height in the Victorian age."
      *   **Licensing the "Hence" (The Unstated Assumptions):** This leap relies on several interconnected ideas Russell and his contemporaries (like Engels in *The Origin of the Family*) drew from 19th-century anthropology:
          *   **"The Discovery of Fatherhood":** Russell assumes a (now contested) historical stage where biological paternity wasn't understood. Societies were matrilineal (descent traced through the mother). The "discovery" that men played a biological role in conception was revolutionary.
          *   **From Knowledge to Control:** Once men understood their biological role in reproduction, they desired to *control* that reproduction to ensure their own biological offspring inherited their property and status. Matrilineal systems couldn't guarantee this.
          *   **"The Only Means":** Russell argues that in pre-modern societies lacking reliable contraception or DNA tests, the *only* way men could achieve certainty of paternity was by exerting absolute control over women's sexuality – ensuring their wives had no other sexual partners. This *necessitated* female subjugation.
          *   **From Physical to Mental:** Control started with physical confinement/ownership (e.g., chastity belts, seclusion) and evolved into ideological control ("virtue," "purity," "modesty") enforced through religion, law, and social pressure. The Victorian era represents the peak of this ideological control, where female sexuality was pathologized and suppressed in the name of securing legitimate lineage.
      *   **The Chain:** Understanding Paternity -> Desire to Ensure Biological Heirs -> Realization Paternity Certainty Requires Exclusivity -> Realization Exclusivity Requires Controlling Women -> Development of Systems (Physical & Mental) to Enforce Control -> Victorian Pinnacle. The wife/mistress example and the egoism explanation demonstrate *why* this control felt so necessary to the patriarchal man – it protected his core identity and legacy.

  **How Your Character Might Paraphrase (Accurately Capturing the Logic):**

  She might say something like this, perhaps slightly exasperatedly, tapping the book:

  "Bertie argues we vastly overrate the *instinct* in jealousy. Look, he points out how a man can be utterly bored with his wife yet devoted to his mistress, but still fly into a *greater* rage over his wife's infidelity. Why? Because it's not really about *her*, or even love, at its root. It's about his name, his property, his blasted legacy. A legitimate son is the poor man's bid for immortality – he pours his ego into that boy. If the wife strays, that whole edifice crumbles; he's been made a cuckold in the deepest sense, pouring his life into a child who isn't his blood. The mistress's child, even if it *is* his, doesn't carry that weight; it's not his heir. *That's* the patriarchal terror – the 'falsification of descent.' And Russell insists it explains everything: the moment men grasped they *were* the fathers, they realized the only way to be sure the heir was truly theirs was to lock women up, body and mind. First with chains, then with sermons about purity. It all culminates in those ghastly Victorians policing every flutter of a female eyelash in the name of securing the bloodline. The 'sanctity of the home'? It's the sanctity of the patrimony, nothing more elevated."

  **Why this works for a careful reader:**

  1.  **Captures the Counter-Intuitive Example:** Explicitly states the paradox (more jealous over unloved wife).
  2.  **Links Example to Lineage Fear:** Explains *why* the wife provokes greater jealousy (heir, legacy).
  3.  **Integrates "Egoism" Meaningfully:** Shows how affection for the heir is tied to self-projection/immortality ("poor man's bid for immortality," "pours his ego into that boy").
  4.  **Explains the "Trick":** Clearly states the consequence of uncertain paternity ("pouring his life into a child who isn't his blood").
  5.  **Unpacks the "Hence":** Explicitly states the causal chain: Understanding fatherhood -> Need for certainty -> Realization certainty requires control -> Methods of control (physical -> mental) -> Victorian peak. Uses Russell's key terms ("falsification of descent," "patrimony").
  6.  **Uses Russell's Tone:** The slightly sardonic edge ("blasted legacy," "ghastly Victorians," "nothing more elevated") fits the Bloomsbury/Russell critique of Victorian hypocrisy.

  This paraphrase doesn't shy away from the challenging steps, particularly the leap from biological understanding to the perceived *necessity* of female subjugation as the "only means." It grounds the "egoism" in the high stakes of patriarchal lineage, making it integral to the argument, not just a rhetorical jab. Your character, having read Russell carefully, would understand that this chain of reasoning, while perhaps oversimplified historically, is central to his materialist critique of traditional marriage morality.
