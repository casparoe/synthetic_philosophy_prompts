prompt: |-
  So I just got off the phone with my friend Jae after a pretty long back-and-forth about David Lewis's book on convention, and I think they basically talked me into a position I'm not sure I actually believe but couldn't argue my way out of at 1am. We're both in a seminar covering it right now, and the basic Lewis picture (if I'm remembering it right) is that stuff like driving on the right side of the road, or which words mean what, isn't the product of anyone ever explicitly agreeing to anything -- it's just a regularity that keeps perpetuating itself because everyone conforms, everyone expects everyone else to conform, and its common knowledge that some other regularity would've worked just as well. Jae's move was basically: okay, but doesn't that description apply just as well to something like "don't lie to people" or "keep your promises"? We only feel like honesty is more binding than the which-side-of-the-road thing because we're inside the convention and can't see outside it, but structurally it's the exact same setup -- a population that evolved the opposite regularity (routine lying, broken promises, whatever) would be just as stable and just as rational for each person to keep conforming to, given that everyone else does it too.

  By the time we hung up I'd basically caved on this, but it's bugging me the next morning, so I wanted a second opinion. Is Jae right that honesty-type norms are conventions in Lewis's actual technical sense, just ones we happened to land on, the same way we happened to land on right-hand driving? Or is there something built into how Lewis sets up these coordination problems that would block that move, even if it seemed airtight at 1am?
reasoning: |-
  Okay, the user is dealing with a philosophical debate about David Lewis's conventions. They discussed with their friend Jae whether moral norms like honesty are just conventions, similar to driving on the right side. The user caved during the late-night talk but now has doubts. I need to recall Lewis's exact definition of conventions to see if Jae's argument holds.

  Lewis defines conventions as regularities in behavior that solve coordination problems. Key elements include mutual expectations, preference for conformity, and the arbitrary nature of the solution. For driving, the choice between left or right is arbitrary; both work as long as everyone agrees. But does this apply to honesty? 

  Honesty isn't arbitrary in the same way. Lying might work in a society where everyone expects it, but there are costs. Trust is fundamental to communication and cooperation. If everyone lied, communication would break down. Lewis himself notes that some conventions, like language, have functional constraints. Honesty might be similar—necessary for social coordination, not just arbitrary.

  The user might be worried that reducing morality to conventions undermines its importance. They need reassurance that Lewis's framework allows for norms that aren't purely conventional. Highlighting the role of intrinsic costs and functional necessities could show why honesty isn't arbitrary like traffic rules. Also, mentioning Lewis's distinction between conventions and norms with inherent value could help. The user's deeper concern might be about moral relativism—if honesty is just a convention, is it less binding? Addressing that by explaining the different layers in Lewis's theory could alleviate their unease.
answer: |-
  That's a fantastic 1am philosophy debate – classic Lewis territory! Jae's argument is sharp and taps into a real tension in Lewis's framework, but there's good reason to push back. While Lewis *does* explicitly discuss *some* moral rules as potential conventions (like promises, which he treats extensively), **honesty ("don't lie") is a much harder case to fit neatly into the *core* Lewisian definition of convention as a solution to a pure coordination problem.** Here's the breakdown:

  1.  **Lewis's Core Definition (Recap):** A convention is a regularity R in behavior within a population P such that:
      *   Everyone conforms to R.
      *   Everyone *expects* everyone else to conform to R.
      *   Everyone *prefers* to conform to R *conditional* on others conforming (because coordination is achieved).
      *   There exists at least one *alternative* regularity R' that, *if* everyone conformed to it and expected others to, would also solve the coordination problem *just as well*.
      *   This is *common knowledge* within P.
      *   **(The Arbitrariness Condition):** The *only* reason for conforming to R rather than R' is the expectation that others conform to R (and vice versa). There are *no intrinsic advantages* to R over R' *apart* from the coordination achieved.

  2.  **Jae's Argument Applied to Honesty:**
      *   Regularity: People generally tell the truth.
      *   Expectations: We expect others to tell the truth.
      *   Conditional Preference: We prefer to tell the truth *because* we expect others to (it facilitates communication, trust, cooperation).
      *   Alternative Regularity: Could a society function where *lying* is the norm? Jae suggests yes: if *everyone* routinely lied, *and everyone expected everyone else to lie*, then communication could still happen! You'd just know that statements meant the opposite, or you'd develop complex decoding mechanisms. Promises to lie might be kept, etc. It would be "stable" in the sense that no single individual has a strong incentive to suddenly start telling the truth if everyone expects lies.
      *   Common Knowledge: It's common knowledge that truth-telling is the norm and that lying *could* have been the norm.
      *   Arbitrariness?: Jae argues that truth-telling has no *intrinsic* advantage over systematic lying *apart* from the fact that it's the established norm facilitating coordination.

  3.  **Why Honesty Might *Not* Fit Lewis's Core Definition (The Counter-Argument):**
      *   **The Problem of Intrinsic Costs:** Lewis's paradigmatic examples (driving side, language meaning) involve solutions that are *genuinely arbitrary* in the sense that the *costs and benefits* of conforming depend *solely* on what others do. The intrinsic properties of driving left vs. right are symmetrical. The intrinsic properties of the sound "dog" meaning *canis familiaris* vs. some other sound are symmetrical *for the purpose of referring*. **Lying vs. truth-telling are *not* symmetrical in this way.**
          *   **Cognitive Costs:** A society built on systematic, expected lying requires immense cognitive overhead. Everyone must constantly encode/decode messages, remember the "lie rules," and maintain complex meta-beliefs about what others *really* mean. Truth-telling drastically reduces this cognitive burden. This is an *intrinsic disadvantage* of the lying regularity, independent of others' actions in a specific instance.
          *   **Evolutionary/Psychological Costs:** Humans appear cognitively wired for truth-telling as a default. Systematic lying likely imposes significant psychological stress, erodes fundamental trust mechanisms, and creates pervasive anxiety. Truth-telling aligns better with our basic cognitive and emotional architecture. While *some* lying occurs, a norm of *systematic, expected* lying is psychologically unsustainable at scale.
          *   **Coordination Breakdown:** While Jae posits a *stable* lying equilibrium, it's arguably far *less efficient* and far *more fragile* than a truth-telling equilibrium. Misinterpretations, decoding errors, and the sheer effort required make coordination on complex tasks significantly harder and more prone to failure. The truth-telling norm has *intrinsic functional advantages* for complex social coordination that go beyond mere conformity.
      *   **Lewis's Own Nuance:** Lewis himself acknowledged that many real-world conventions aren't *purely* arbitrary. Language is the prime example. While the *sound* of a word is arbitrary, the *function* of language itself (referring, predicating) is not. He talks about conventions having "precursors" or existing within a framework that *isn't* conventional (like the desire to communicate). Similarly, the *function* of communication underlying honesty norms (transferring reliable information) creates a strong pressure *against* systematic lying as a viable alternative. A lying "language" is a fundamentally different, vastly less efficient tool for communication.
      *   **"Just as Good"?** The key clause is "would work *just as well*." Does a systematic lying norm *really* solve the coordination problem of communication *just as well* as truth-telling? The cognitive load, inefficiency, fragility, and psychological cost strongly suggest it does *not*. It solves *a* coordination problem (how to interpret utterances), but it solves the *specific problem of reliable information transfer* much *worse* than truth-telling. The alternatives are not functionally equivalent.

  4.  **Where Lewis *Would* Agree with Jae (The Nuance):**
      *   **Specific Promissory Conventions:** Lewis *does* argue that the *institution* of promising is conventional. The specific words, gestures, or rituals used to create a promise could be different (R' exists). The *binding force* of the promise arises largely from the expectations and preferences conditional on others participating in the same practice. *What* is promised (e.g., to tell the truth vs. to lie) is a different matter.
      *   **Surface-Level Similarity:** The *mechanism* of reinforcement (conformity, expectations, conditional preference) *is* similar for honesty and driving conventions. Honesty norms *are* socially reinforced in this way.
      *   **Contingency:** Lewis would likely agree that the *specific emphasis* we place on honesty, the *exact boundaries* of when a lie is permissible (white lies?), and the *specific sanctions* for lying are culturally contingent and shaped by convention-like processes. The *core aversion to systematic deception*, however, runs deeper.

  **Conclusion:**

  Jae is brilliantly highlighting a deep challenge and pushing Lewis's framework to its limits. **However, honesty ("don't lie") is unlikely to be a *pure* Lewisian convention in the strict sense of solving a coordination problem with genuinely arbitrary, functionally equivalent alternatives.** The intrinsic cognitive, psychological, and functional disadvantages of a systematic lying norm make it fundamentally *worse* at solving the core coordination problem of reliable communication and complex social cooperation than truth-telling. While the *reinforcement mechanism* looks similar, and *aspects* of honesty norms are conventional (specific formulations, sanctions), the core preference for truth over systematic falsehood likely has roots deeper than mere arbitrary convention – in cognitive efficiency, psychological well-being, and the fundamental requirements of large-scale human coordination.

  Your 1am cave-in is understandable – it's a powerful argument! But your morning doubts are well-founded. Lewis provides tools to distinguish between pure coordination conventions (like driving side) and norms that, while reinforced socially, have significant non-arbitrary, functional advantages (like core aspects of truth-telling). The traffic light analogy only goes so far; lying isn't just driving on the other side of the road, it's like trying to coordinate traffic where everyone drives backwards by default – possible in theory, but catastrophically inefficient and unstable in practice.
