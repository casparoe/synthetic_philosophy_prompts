  ## The Irregularity Paradox: Assessing Bentham's Coherence on Sexual Morality

  Jeremy Bentham's utilitarian defense of decriminalizing consensual same-sex acts in "Offences Against One's Self" stands as a remarkable early argument for tolerance, grounded firmly in his hedonistic calculus: such acts produce pleasure for the participants and cause no tangible harm to others, rendering criminal punishment irrational and cruel. Yet, his persistent characterization of these acts as "irregularities," deviations from the "natural or proper use" of sexual faculties, introduces a tension. Can Bentham consistently champion the moral irrelevance of harmless pleasure while simultaneously labeling its source an "irregularity"? Assessing this requires weighing the arguments for consistency against those for incoherence, ultimately revealing a subtle but significant flaw within Bentham's own utilitarian framework.

  **The Case for Consistency: Description, Not Prescription**

  Defenders of Bentham's coherence offer several compelling arguments:

  1.  **Statistical Neutrality:** Bentham, the arch-empiricist, might intend "irregularity" purely descriptively. "Regular" simply denotes what occurs most frequently statistically, like right-handedness. Same-sex attraction, while harmless, *is* statistically less common. Calling it "irregular" in this sense carries no inherent moral judgment within a utilitarian system focused solely on consequences. It's merely noting a demographic fact.
  2.  **Distinguishing Morality from Description:** Bentham explicitly separates the *description* of an act from its *moral evaluation*. He can acknowledge that an act is statistically unusual or deviates from common biological function (procreation) without concluding it is morally wrong. His utilitarian ethics operates on a separate plane: the *only* relevant question is whether the act causes harm. He condemns punishing the statistically unusual taste in food precisely because harm is absent, regardless of its irregularity.
  3.  **Targeting Harm, Not Normalcy:** Bentham's primary target is the conflation of statistical irregularity or visceral "antipathy" with *moral justification for inflicting pain* (punishment). His argument is that "irregularity" is irrelevant to the harm principle. Calling something irregular doesn't preclude defending its permissibility; it simply contextualizes it within the broader range of human behavior he seeks to protect from irrational punishment.
  4.  **Pragmatic Concession?:** Some argue Bentham uses "irregularity" strategically, acknowledging the prevailing view to make his radical decriminalization argument more palatable. The core utilitarian logic remains untouched.

  **The Case for Incoherence: The Teleological Shadow**

  However, the language of "natural or proper use" casts a long teleological shadow that undermines Bentham's professed hedonism:

  1.  **"Natural Use" as Inherently Teleological:** The concept of a "proper use" of a faculty implies a purpose or *telos*. Bentham fiercely attacked natural law theories precisely for smuggling in such non-empirical, non-utilitarian standards. To speak of sexual faculties having a "proper use" beyond generating pleasure and avoiding pain reintroduces the very kind of intrinsic purpose his system sought to banish. If pleasure is the sole good, why isn't *any* pleasure-producing use "proper"?
  2.  **"Irregularity" as Normative Slippage:** While potentially statistical, "irregular" carries strong normative connotations, especially when paired with "departure" and "proper use." This language subtly frames heteronormative, procreative sex as the standard against which others are measured as deviations. For a strict hedonist, this hierarchy is arbitrary. Why is the statistically common pleasure "regular" and the statistically less common pleasure "irregular," if both are equally harmless? The terminology itself suggests a valuation Bentham's utilitarianism should reject.
  3.  **Contradicting the Hedonistic Equality of Pleasures:** Bentham famously argued that "push-pin is as good as poetry" if it yields equal pleasure. His attack on asceticism rests on the principle that pleasure is intrinsically good, regardless of its source (provided no harm). Labeling a harmless pleasure "irregular" implicitly creates a category distinction that his core hedonism denies. It introduces a qualitative difference ("regular" vs. "irregular") where only quantitative differences in pleasure/pain should matter. If condemning an unusual food taste based on feeling is irrational asceticism, why isn't labeling a harmless sexual taste "irregular" a similar concession to prejudice?
  4.  **Undermining the Anti-Ascetic Stance:** Bentham identifies "antipathy" and ascetic prejudice as the irrational roots of homophobia. Yet, his language of irregularity and unnatural use arguably *reflects* and subtly endorses that very ascetic tradition, which often condemned non-procreative sex as "unnatural" or "contrary to nature." He fails to fully purge his analysis of the normative residue he so effectively critiques elsewhere.

  **Verdict: A Foundational Incoherence**

  While Bentham's intent to decriminalize is clear and laudable, and a purely statistical reading of "irregularity" is possible, the weight of evidence points towards **incoherence** within his own utilitarian framework. The language of "natural or proper use" is fundamentally incompatible with his radical hedonism and his demolition of natural law teleology.

  By invoking "proper use," Bentham smuggles in a standard external to his pleasure/pain calculus. This creates a category – the "irregular" harmless pleasure – that sits uneasily with his core principle that *all* harmless pleasures are morally equivalent. It implicitly grants the statistically common ("regular") pleasure a privileged status his system cannot justify. The terminology itself carries normative baggage ("departure," "proper") that subtly undermines his powerful argument against antipathy and asceticism. He identifies the poison of non-utilitarian judgment in society's condemnation but fails to fully expel it from his own descriptive vocabulary.

  Therefore, Bentham cannot consistently hold both positions. His labeling of harmless same-sex acts as "irregularities," laden with teleological implications of unnaturalness, reimports a standard his own attacks on natural law and asceticism should have definitively foreclosed. It represents a failure to fully apply his revolutionary utilitarian logic to his own descriptive language, revealing a residual prejudice or conceptual limitation that prevents his otherwise powerful argument for tolerance from achieving perfect coherence by his own hedonistic lights. The "irregularity" label, however statistically intended, remains a normative Trojan horse within Bentham's utilitarian fortress.
