prompt: |-
  A friend and I spent much of last night arguing about Maimonides's theory of sacrifice, and we ended up stuck on a single maneuver in the Guide for the Perplexed, III:32, that neither of us could talk the other out of. Maimonides has just finished arguing that the sacrificial cult was never God's true end but a concession to the Israelites' idolatrous habits, and he turns to confront an obvious scriptural embarrassment: a line from Jeremiah that seems to say God never commanded sacrifice in the first place. Here is how he handles it, in Friedländer's translation:

  "Jeremiah declared: 'For I spake not unto your fathers, nor commanded them in the day that I brought them out of the land of Egypt, concerning burnt-offering or sacrifices. But this thing commanded I them, saying, Obey my voice, and I will be your God, and ye shall be my people' (Jer. vii. 22, 23). This passage has been found difficult in the opinion of all those whose words I read or heard; they ask, How can Jeremiah say that God did not command us about burnt-offering and sacrifice, seeing so many precepts refer to sacrifice? … Jeremiah says [in the name of God] the primary object of the precepts is this, Know me, and serve no other being … But the commandment that sacrifices shall be brought and that the temple shall be visited has for its object the success of that principle among you; and for its sake I have transferred these modes of worship to my name … You, however, have ignored this object, and taken hold of that which is only the means of obtaining it … but this is not the chief object.—I have another way of explaining this passage with exactly the same result. For it is distinctly stated in Scripture, and handed down by tradition, that the first commandments communicated to us did not include any law at all about burnt-offering and sacrifice. You must not see any difficulty in the Passover which was commanded in Egypt; there was a particular and evident reason for that, as will be explained by me (chap. xlvi.). Besides, it was revealed in the land of Egypt; whilst the laws to which Jeremiah alludes in the above passage are those which were revealed after the departure from Egypt. For this reason it is distinctly added, 'in the day that I brought them out from the land of Egypt.' The first commandment after the departure from Egypt was given at Marah … According to the true traditional explanation, Sabbath and civil laws were revealed at Marah: 'statute' alludes to Sabbath, and 'ordinance' to civil laws, which are the means of removing injustice. … We have thus proved that the first laws do not refer to burnt-offering and sacrifice, which are of secondary importance."

  My friend thinks the second explanation is really just the first one restated in chronological dress, so that whatever undermines one undermines both. I think they are logically independent: the first relocates "commandment" onto a hierarchy of primary and secondary ends, so that Jeremiah's denial is true only in a loose, rhetorical sense even though sacrifice was, strictly speaking, legislated; the second instead defends the literal truth of "I did not command" by confining its scope to a moment before which, as a plain matter of chronology, no sacrificial law yet existed. Could you help us settle this? Does the Marah argument really stand on its own, or does it covertly rely on the primary/secondary distinction to decide which of the laws eventually given at Sinai even count against Jeremiah's claim? And if it does stand alone, does narrowing the relevant timeframe to the days immediately following the Exodus actually rescue a literal reading of Jeremiah's statement, given that the sacrificial legislation was itself promulgated at Sinai not long afterward?
