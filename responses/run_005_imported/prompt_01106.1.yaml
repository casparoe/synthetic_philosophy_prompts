answer: |-
  The star-charts of the Seraph Compact glowed with cold certainty. Archivist Elara Vance traced a line across the holographic expanse – not a trade route, nor a colonization vector, but a boundary. Beyond it lay the *Unobservable Volume*, a region so distant, its light not yet born when the Compact’s first ancestors crawled from their primordial seas. Causality itself was a prison wall. Nothing they did could ever touch, or be touched by, what lay within.

  The discovery of Silica Prime had shattered complacency. Nestled within the Volume, glimpsed by a long-range quantum-sniffer probe before its signal dissolved into entropic noise, was a world teeming with complex, non-carbon-based life. Crystalline forests pulsed with internal light; silicon rivers flowed over geometric plains. Their values, their consciousness, their *wants* – utterly alien. And utterly beyond reach.

  The Compact Council chamber hummed with tension. Chancellor Rho, his face etched with the strain of a dying colony world, slammed a fist on the obsidian table. "Silica Prime is a *curiosity*, Archivist! A scientific footnote! Our own people on Veridian IV are starving, their atmosphere processors failing. The *Kestrel* fleet could save them! Diverting it to 'guard' a world we cannot interact with, whose inhabitants wouldn't comprehend our gesture, is madness!"

  Elara met his gaze, the weight of the Unobservable Volume pressing on her shoulders. "It’s not madness, Chancellor. It’s probability. The Cosmological Constant, the sheer scale... the universe isn't just vast, it's *teeming*. Countless civilizations, countless value systems, all isolated by light-years and the arrow of time. We see only our local bubble."

  She activated a secondary display. Complex probability matrices bloomed – not of physics, but of philosophy. "We call it the Evidential Compact. If the universe is large enough – and it demonstrably is – then statistically, civilizations capable of reason *like us* exist within their own isolated volumes. They face the same dilemma: act solely for their own values, or... consider the wider tapestry."

  A senator scoffed. "Consider? How? Send a message that will arrive after their sun goes nova?"

  "Not messages," Elara said, her voice low but carrying. "Evidence. *Internal* evidence. We reason: *If we are rational, and the universe is large, then others reason similarly. If others reason similarly, they might act to preserve values not their own, simply because those values exist and hold worth to someone.*"

  She gestured towards the ghostly image of Silica Prime. "Preserving this world, these crystalline minds... it costs us. The *Kestrel* fleet. Resources. Lives potentially lost on Veridian. But in doing so, we create evidence – evidence only *we* can perceive – that the Compact holds. That somewhere, perhaps in a volume just beyond *our* causal horizon, another civilization is looking out at *their* Unobservable Volume and seeing... us. Or something like us. And they, too, are sacrificing their immediate desires to preserve something *we* value."

  The silence was profound. The argument was elegant, terrifying, and offered zero tangible reward.

  "Faith," Rho spat. "You ask for faith in phantoms."

  "Rational extrapolation," Elara countered. "A gamble on the nature of reason itself in a vast cosmos. If enough civilizations make this quiet sacrifice, based purely on the statistical likelihood that others are doing the same... then values persist. Not just ours, but the strange, beautiful values of the crystal forests, the methane breathers in gas giants, the sentient nebulae we can't even conceive of. We become part of an... ecosystem of ethics, sustained not by contact, but by shared logical deduction across the void."

  The vote was agonizingly close. Elara felt the crushing weight of Veridian IV's potential loss. But the logic, the sheer, unsettling *scale* of the argument, held sway. The *Kestrel* fleet was diverted. Not to conquer, not to colonize, not even to communicate. Merely to park itself in the desolate space between stars, a silent, invisible shield against potential future hazards Silica Prime might never face and could never know threatened it. A shield paid for by the suffering of Veridian IV.

  Years bled into decades. The *Kestrel* fleet remained, a monument to a silent promise. Veridian IV struggled, its losses etched into the Compact's collective memory. Elara, now old, her hair the color of starlight on dust, stood on an observation platform. Below, the bustling capital world thrived, built on resources that *could* have gone to Veridian, or a hundred other projects. Above, the stars shone, indifferent.

  Had it worked? Were there others, out in the infinite dark, looking at *their* Silica Prime equivalents? Were they sacrificing their own Veridian IVs? Had some unseen, unseeable civilization, guided by the same cold logic, acted to preserve a value the Compact held dear – a forest world, a nascent AI, a unique art form – at cost to themselves?

  There was no signal. No confirmation. No way to ever know if the Evidential Compact held beyond their own lonely sphere of causality. The sacrifice on Veridian IV was real. The preservation of Silica Prime, from their perspective, might be utterly meaningless to the universe. Or it might be a single stitch in a tapestry of silent cooperation woven across light-years and epochs, a tapestry no one would ever see whole.

  Elara touched the cold transparisteel. The silence of the cosmos wasn't empty. It was filled with the hum of probability, the weight of choices made in the dark. They had acted. They had held up their end of a bargain made with phantoms, for the sake of a value they didn't share, based on faith in reason itself. The universe gave no answer. It never would. The only certainty was the quiet ache of the sacrifice, and the fragile, terrifying hope that in the vast, uncaring dark, they were not alone in their quiet, rational madness. She whispered the only prayer the Evidential Compact allowed: "Let it be enough." And the stars, as always, said nothing.
