  **Justifications:**

  1.  **Score: 2 (Clearly right)**. Owen accurately cites Aquinas's text. The Sentences commentary explicitly permits a private individual to kill a usurping tyrant ("tyrannus in principatu acquisito per violentiam") for the liberation of the country, praising and rewarding such an act. This is a valid textual foundation for his claim.
  2.  **Score: 2 (Clearly right)**. Marisol correctly distinguishes Aquinas's focus in the two texts. She accurately summarizes the *De Regno* argument against private tyrannicide for the *tyrannus in regimine* (abusive ruler) due to the danger of pretextual killing and the preference for institutional remedies. Her distinction between usurper and abusive ruler is textually grounded and crucial.
  3.  **Score: 1 (Mostly right)**. Owen identifies a genuine tension. While Marisol's distinction exists textually, Owen is correct that labeling a ruler a "usurper" (title-less, no higher recourse) is *itself* a judgment. Aquinas doesn't explicitly address *who* makes this judgment or *how* it's verified in the Sentences commentary, leaving room for Owen's challenge about trusting private judgment for one classification but not the other.
  4.  **Score: 0 (Neutral/Mixed)**. Marisol's point about usurpation being potentially more fact-based (force/fraud) than ongoing evaluation of abuse has intuitive and textual plausibility. Aquinas implies usurpation is a clearer status (e.g., taking power by violence). However, Owen's point (3) still stands: determining if force/fraud *actually* occurred and *whether it truly negates all legitimacy/recourse* can be contested, making it less purely "factual" than Marisol suggests. It's not clearly wrong, but neither is it decisive against Owen's challenge.
  5.  **Score: 2 (Clearly right)**. Owen delivers a powerful critique. He correctly notes Aquinas uses *collective* bodies (the Roman people expelling Tarquin, the Senate acting against Domitian) as agents of remedy in abuse cases within *De Regno*. Crucially, Owen highlights Aquinas's *failure* to explain why the self-interest of a multitude or senate is less distorting than that of an individual, despite the same underlying danger (pretext) being the reason to bar private action. This exposes a significant gap in Aquinas's argument as presented in *De Regno*.
  6.  **Score: -1 (Mostly mistaken)**. While Marisol is right that organizing collective action *is* harder, this doesn't effectively counter Owen's core point (5). Aquinas's argument in *De Regno* explicitly rests on the *danger of distortion by self-interest/passion*, not merely the *difficulty of organizing action*. Owen showed Aquinas provides no reason why collective bodies are *inherently less susceptible* to this distorting self-interest when judging abuse. Marisol's point about organizational difficulty addresses a *different* concern (feasibility/scale of rebellion) rather than Aquinas's stated worry about *unreliable judgment due to self-interest*. It thus dodges the force of Owen's textual critique about Aquinas's reasoning.

  **What Owen and Marisol Are Both Missing:**

  Both debaters focus heavily on the *agent* (private vs. public/collective) and the *classification* (usurper vs. abuser), but underemphasize Aquinas's deeper **teleological framework of authority and the common good**. Authority exists *for* the common good. A usurper (*tyrannus ex defectu tituli*) fundamentally lacks legitimacy *because* their power wasn't ordained towards the common good from the outset. An abusive ruler (*tyrannus ex parte exercitii*) holds legitimate authority *in principle* but perverts its end. The permissibility of killing hinges not *solely* on the agent or classification, but on whether the act *itself* is the necessary means to restore the common good *when no ordained authority exists or can act* (for the usurper) or *when the ordained remedy fails* (for the abuser, hence collective action *as* the community). Owen and Marisol's debate about judgment reliability, while important, somewhat sidesteps Aquinas's core justification: the act is licit only when it directly serves as the *functional substitute* for the missing or failed authority structure ordained to protect the common good. The "public/private" line is less about inherent judgment quality and more about whether the actor is *acting as* the legitimate authority (or its functional equivalent) in that specific, dire circumstance.
