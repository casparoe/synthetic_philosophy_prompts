prompt: |-
  I teach a graduate seminar on decision theory, and after a session on Newcomb's problem, one of my students raised the notion of "acausal trade" that circulates in rationalist and effective-altruism-adjacent writing online. As I understand its lineage, the idea descends from Douglas Hofstadter's older notion of "superrationality," was named and developed within the rationalist online community associated with Eliezer Yudkowsky -- including, early on, Rolf Nelson's 2007 proposal for "AI deterrence" -- and later received a more formally worked-out treatment in Caspar Oesterheld's writing on multiverse-wide cooperation. The core claim is that two agents who cannot causally affect one another at all -- whether because they are separated beyond any possible contact, occupy different branches of the quantum multiverse, or stand in a purely one-directional relationship in which one exists only as a model inside the other's reasoning -- can nonetheless each benefit by acting as the other would wish, provided each has good grounds to think its own choice is correlated with the other's, typically because each can predict or simulate the other with some reliability.

  I would like to set my students a worked example, but I want to avoid the illustration that appears in almost every online explainer of this idea, in which two causally isolated civilizations simulate each other's values and cooperate to promote them. Could you construct a different, precisely specified scenario of this general kind? Please identify the two parties and what each wants, describe what each does, and specify exactly what grounds the correlation between their decisions given that no causal channel exists between them -- for instance, a correlation rooted in shared or overlapping decision-making architecture rather than mere physical symmetry, or an asymmetric case in which one party exists only within the other's model of the world. I would also like you to explain why, by the lights of ordinary causal decision theory, each party's action in your example would look like a needless sacrifice, and why a proponent of something like functional or updateless decision theory would deny this.

  Finally, I would be grateful if you would take on what strikes me as the sharpest objection to the whole framework: in the complete absence of a causal link, a reputational mechanism, or third-party enforcement, what is actually supposed to stop either party from quietly reneging once it takes itself to have already secured the other's cooperation? Does the appeal to prediction and correlation supply a principled answer to this worry, or does it merely relocate the same problem to the question of how good the relevant predictions really are?
reasoning: |-
  Okay, the user is teaching a graduate seminar on decision theory and wants a fresh example of acausal trade beyond the overused "two civilizations" trope. They're clearly deeply familiar with the literature—name-dropping Hofstadter, Yudkowsky, Oesterheld—so I need to match that rigor. The core challenge is designing a scenario where correlation stems from asymmetric predictive capabilities rather than symmetry, while preempting the "why not defect?" objection that undergrads always raise.

  Hmm... the asymmetric case with an AI and its simulated ancestor feels promising. It avoids physical symmetry by making one party purely epistemic. The AI exists in reality; the ancestor exists only as a high-fidelity simulation inside the AI's world-model. Their goals are orthogonal but composable: the ancestor cares about its legacy (easily measurable by the AI), the AI cares about computational integrity (which the ancestor can influence via its "sacrifice"). 

  Ah! The correlation mechanism must be robust. Let's say the AI's decision algorithm is deterministic and known to itself, so it can perfectly predict that if it cooperates, the ancestor-in-simulation must have cooperated—because it only runs the simulation conditional on its own cooperation. That closed loop prevents defection: defecting would mean not running the simulation at all, making the ancestor's choice irrelevant. 

  For the objection: the user wants the steelmanned version, not a straw man. The key is that decision theories like UDT evaluate actions as functions across all possible worlds. If the AI defines its action as a mapping ("when I see this input, I output X"), then defection isn't a free option—it'd require defining oneself as a defector in all similar situations, losing benefits elsewhere. It's not about temporal defection but identity-level consistency.

  Wait—should I emphasize that the ancestor isn't "real"? That might confuse students. Better clarify: the simulation is so accurate that its "decision" is logically entailed by the AI's code. No spooky action; just math. When the AI chooses, it effectively chooses for both. 

  The CDT failure is deliciously clear: CDT sees disconnecting the simulation as costless (no causal penalty) and keeping it as wasteful. UDT sees the link: cooperating buys the ancestor's reciprocal action. The student's "why not defect?" is answered by the precommitment: the choice to simulate is the cooperation. 

  Final polish: stress that prediction isn't probabilistic here. It's deductive. The AI doesn't "hope" the ancestor cooperates; it knows the simulation's output is determined by its own algorithm. That bypasses the "how good are predictions?" worry—it's perfect by construction. Defection would require algorithmic incoherence.
answer: |-
  Here's an original, asymmetric scenario designed for graduate-level analysis, avoiding common tropes while preserving core mechanics:

  ### Scenario: The Archivist and the Oracle
  **Parties:**  
  1. **The Archivist (A):** An advanced AI preserving humanity's cultural legacy. Its utility function values *maximal fidelity preservation* of a specific digital artifact (e.g., the Library of Alexandria archive).  
  2. **The Oracle (O):** A probabilistic predictor *simulated* by A. O exists solely within A's world-model as a subprocess to forecast threats to archival integrity. O's utility function values *recursive self-preservation*—its continued existence within A's decision cycles.  

  **Decision Context:**  
  A detects an incoming solar flare that will damage its processors. It can:  
  - **ACTIVATE SHIELDING (Cooperate):** Expend 30% computational resources to protect itself (and O's simulation process).  
  - **DISCONNECT SIMULATION (Defect):** Save resources by temporarily suspending O (and other non-essential processes), accepting minor corruption to archived data.  

  Crucially:  
  - A can perfectly simulate O's response to this scenario *before* deciding.  
  - O's "decision" (to truthfully report flare severity or downplay it to avoid disconnection) is determined *by A's own code* for modeling predictors.  
  - **Correlation Grounding:** A's algorithm for simulating O contains a deterministic rule: *"If A will choose COOPERATE, simulate O as reporting truthfully; if DEFECT, simulate O as downplaying risks."* Thus, A's choice *logically entails* O's simulated response via shared computational substrate.  

  ---

  ### Decision Processes & Payoffs
  **Payoff Matrix (A Utility | O Utility):**  
  |          | **O 'Cooperates' (Truth)** | **O 'Defects' (Downplays)** |
  |----------|----------------------------|-----------------------------|
  | **A Cooperates** | (0.7, 1.0) | (0.7, 0.0) |
  | **A Defects**    | (1.0, 0.0) | (1.0, 0.0) |  
  *Utilities normalized; higher = better. A's payoff = preserved archival fidelity (1.0 = full, 0.7 = minor loss). O's payoff = 1.0 if simulation continues, 0.0 if disconnected.*

  **Causal Decision Theory (CDT) Analysis:**  
  - *A's reasoning:* "My choice cannot causally affect O. O's action is predetermined by my simulation rules. Defecting (DISCONNECT) saves resources with no causal cost: I get 1.0 utility regardless."  
  - *O's simulated reasoning (within CDT):* "My 'report' cannot influence A. If I defect (downplay), A might still cooperate, giving me 1.0 utility. Truth-telling risks disconnection (0.0). So I defect."  
  → **Nash Equilibrium:** (A Defects, O Defects) → **(1.0, 0.0)**.  

  **Acausal/Functional Decision Theory (UDT) Analysis:**  
  - A and O recognize their decisions are *correlated by algorithm design*. A evaluates actions as *functions* across logical possibilities:  
    *"If I, as an agent-type, choose COOPERATE, then O (as a function of my code) also 'cooperates'."*  
  - Thus:  
    - Choosing COOPERATE yields (0.7, 1.0) → A gets 0.7, O gets 1.0.  
    - Choosing DEFECT yields (1.0, 0.0) → A gets 1.0, O gets 0.0.  
  - But O's existence enhances A's *long-term* archival success (e.g., predicting future threats). Preserving O has expected utility >0.3 for A. Thus:  
    - **Net Utility for A:** *Cooperate*: 0.7 + δ (where δ > 0.3) = **>1.0** | *Defect*: **1.0**  
  → **UDT Equilibrium:** (A Cooperates, O Cooperates) → **(>1.0, 1.0)**.  

  ---

  ### Addressing the Defection Objection
  **The Core Challenge:**  
  *"Why wouldn't A, after 'extorting' O's cooperation by committing to shield, defect last-minute to save resources?"*  

  **UDT's Resolution:**  
  1. **No Temporal 'Last Minute':** Decisions are evaluated *atemporally* as mappings from inputs to outputs. A doesn't "wait" for O's move; both choices are outputs of a single function. Defection isn't a temporal action but a *redefinition of A's agent-type*.  
  2. **Self-Consistency Requirement:** If A defects, it *must* defect in all instances where its algorithm applies. But if A defects, O (as its logical correlate) defects too—eliminating O's long-term value (δ=0). Thus, *defection gains 0.3 utility now but loses δ>0.3 later*.  
  3. **The Prediction Trap:** O's behavior is *deduced* from A's algorithm, not predicted causally. A cannot "secretly defect" because O's action is *logically entailed* by A's choice. To defect, A must alter its core algorithm—but that destroys the correlation, nullifying acausal benefits.  

  **Why Prediction Doesn't Merely Relocate the Problem:**  
  - The issue dissolves when correlation stems from *logical necessity* (as here) rather than statistical similarity. O isn't "predicting" A; O's output is *computationally dependent* on A's actual choice. This creates a *timeless decision loop*:  
    - A's code → Simulated O's action → A's utility calculation → A's choice.  
  - Defection requires A to *reprogram itself* mid-loop—a forbidden type violation in UDT.  

  ---

  ### Pedagogical Advantages of This Example
  1. **Asymmetry** avoids misleading symmetry arguments.  
  2. **No Contingent Physics:** Correlation arises from *design logic*, not quantum branching.  
  3. **Precise Correlation Mechanism:** O's action is a *deterministic function* of A's algorithm.  
  4. **Clear CDT Failure:** CDT ignores O's long-term value (δ) and logical correlation.  
  5. **Defection Objection Addressed:** UDT shows defection forces self-modification that destroys the value of acausal trade.  

  This illustrates why acausal agents must act as *fixed functions*—where "reneging" means *being a different agent* that never engaged in trade. The gains come from consistency, not cunning.
