  Recommendation: Modify the placement. Provide full financial support—stipend, travel, accommodation—so the cost is borne by the foundation, not the candidate. This retains the assessment element (performance during placement) without the financial barrier. It turns the signal from "can you pay?" to "can you perform?" which is more relevant.

  Also, consider alternatives like detailed proposals or remote assessments, but the placement's experiential value is key. By funding it, the committee assesses actual field skills and commitment through observation, not financial sacrifice.

