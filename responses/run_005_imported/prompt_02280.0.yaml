answer: |-
  Alright, let's dive deep into the weeds. You're grappling with core issues in formal epistemology, and the distinction between Dutch Books and Accuracy-Dominance is profound. I'll break it down step-by-step, focusing on your two core questions.

  **1. The Accuracy-Dominance Argument: Mechanics & Strict Propriety (With a Toy Example)**

  The core argument (associated with James Joyce, but building on earlier work by de Finetti and Savage) is an **impossibility result**: *If your credence function `c` violates the probability axioms, then there exists an alternative, coherent credence function `p` (that *does* obey the axioms) such that `p` is more accurate than `c` in *every single logically possible world*.*

  **Why is this devastating?** It means your incoherent `c` is *pointless* from an epistemic accuracy perspective. No matter how the world actually turns out, you would have been *more accurate* if you had held `p` instead. Your `c` is **accuracy-dominated**.

  **The Role of Strictly Proper Scoring Rules:**

  *   **Scoring Rule (`S`):** A function `S(c, w)` that measures the *inaccuracy* (or penalty) of credence `c` in proposition `X` when the world `w` (specifying the truth values of all propositions) is revealed. Lower scores are better (more accurate). Brier Score is one example (`(1 - c(X))²` if `X` true in `w`; `(c(X))²` if `X` false in `w`).
  *   **Strictly Proper:** A scoring rule `S` is **strictly proper** if, for any coherent credence `p` and any alternative credence `c` (coherent or not) assigned to a single proposition, `p` *expects* itself to be more accurate than `c`. More formally:
      `𝔼_p[S(p, w)] < 𝔼_p[S(c, w)]`
      *In essence: If your genuine belief is `p`, and you are evaluating potential reports `c` using `S`, the report `c = p` uniquely minimizes your *expected inaccuracy* according to your own belief `p`.*

  **Why is Strict Propriety Crucial?**

  1.  **Honesty is the Best Policy:** It incentivizes you to report your *true* credence `p`. If you believed `p` but reported `c ≠ p`, you'd *expect* (by your own lights) to be *less accurate*.
  2.  **Foundation for Dominance Proof:** The dominance result relies on the mathematical properties guaranteed by strict propriety (specifically, related to **convexity** and **separating hyperplanes**). Without it, you couldn't guarantee that a dominating coherent `p` *always* exists for *any* incoherent `c`.

  **What Goes Wrong with Non-Strictly-Proper Rules?** Imagine a rule that wasn't strictly proper, like Absolute Error (`|1 - c|` if true, `|c|` if false).

  *   **Problem 1: No Incentive for Honesty.** Suppose your true `p(X) = 0.7`. Reporting `c(X) = 0.8` or `c(X) = 0.6` might give you the *same* expected score as reporting `0.7` under Absolute Error. Why bother being precise?
  *   **Problem 2: Dominance Might Fail.** There could be incoherent credences that *aren't* dominated by *any* coherent credence. The argument for probabilism would collapse. An incoherent `c` might be just as accuracy-prone as any coherent `p` in some worlds, or even better in some, preventing the "strictly better in *every* world" result.
  *   **Problem 3: Degeneracy.** Some non-proper rules might make *all* credences look equally (in)accurate, or make accuracy independent of the actual belief.

  **You use Brier without thinking about propriety?** That's because propriety *works in your favor* practically. If forecasters know you're using Brier (strictly proper), they are incentivized to report their *genuine best estimates* (`p`) to minimize their *expected* loss. If you used Absolute Error, a forecaster with true `p=0.7` might report `0.6` or `0.8` if it simplified their model or calculation, knowing it wouldn't hurt their *expected* score. Propriety ensures the scoring rule aligns the forecaster's selfish goal (minimizing expected penalty) with your goal as the evaluator (getting their honest probability).

  **Toy Example: 2 Propositions - A, B**

  Assume `A` and `B` are mutually exclusive and exhaustive (e.g., `A` = "Rain tomorrow", `B` = "No rain tomorrow"). A credence function assigns `c(A)`, `c(B)`. Probability axioms require:
  1.  `c(A) ≥ 0`, `c(B) ≥ 0`
  2.  `c(A) + c(B) = 1` (since `A` or `B` must be true).

  **The Incoherent Agent (Cal):** Suppose Cal holds:
  *   `c_Cal(A) = 0.6`
  *   `c_Cal(B) = 0.5`
  This violates axiom 2: `0.6 + 0.5 = 1.1 > 1`. Cal is overconfident; she's allocated 110% belief.

  **Scoring Rule:** Brier Score. Inaccuracy for a proposition is:
  *   If `X` True: `(1 - c(X))²`
  *   If `X` False: `(0 - c(X))² = (c(X))²`

  Total inaccuracy for a credence function in a world is the sum of inaccuracies for all propositions. (For partition-based arguments like this, it's common to score the partition members).

  **Possible Worlds:**
  *   **World w_A:** `A` is True, `B` is False.
  *   **World w_B:** `A` is False, `B` is True.

  **Cal's Inaccuracy:**
  *   **w_A:**
      *   Inacc(A) = `(1 - 0.6)² = 0.4² = 0.16`
      *   Inacc(B) = `(0 - 0.5)² = 0.5² = 0.25`
      *   **Total Inacc_Cal(w_A) = 0.16 + 0.25 = 0.41**
  *   **w_B:**
      *   Inacc(A) = `(0 - 0.6)² = 0.6² = 0.36`
      *   Inacc(B) = `(1 - 0.5)² = 0.5² = 0.25`
      *   **Total Inacc_Cal(w_B) = 0.36 + 0.25 = 0.61**

  **Finding a Dominating Coherent Credence (Peg):** We need a coherent `p` (so `p(A) + p(B) = 1`, `p(A) ≥ 0`, `p(B) ≥ 0`) such that:
  *   `Inacc_Peg(w_A) < Inacc_Cal(w_A)` (i.e., `< 0.41`)
  *   `Inacc_Peg(w_B) < Inacc_Cal(w_B)` (i.e., `< 0.61`)

  **Peg's Inaccuracy (General Form):**
  *   **w_A:** `(1 - p(A))² + (0 - p(B))² = (1 - p(A))² + (p(B))²`. But since `p(B) = 1 - p(A)`, this becomes `(1 - p(A))² + (1 - p(A))² = 2(1 - p(A))²`
  *   **w_B:** `(0 - p(A))² + (1 - p(B))² = (p(A))² + (p(A))² = 2(p(A))²` (because `p(B) = 1 - p(A)`, so `1 - p(B) = p(A)`)

  **Peg's Goal:**
  1.  `2(1 - p(A))² < 0.41` for w_A → `(1 - p(A))² < 0.205` → `1 - p(A) < √0.205 ≈ 0.4528` → `p(A) > 1 - 0.4528 ≈ 0.5472`
  2.  `2(p(A))² < 0.61` for w_B → `(p(A))² < 0.305` → `p(A) < √0.305 ≈ 0.5523`

  **The Dominating Credence:** Any `p(A)` satisfying `0.5472 < p(A) < 0.5523` will dominate Cal's incoherent credence. Let's pick `p_Peg(A) = 0.55`, so `p_Peg(B) = 0.45`.

  **Verify Dominance:**
  *   **w_A:**
      *   Inacc_Peg(A) = `(1 - 0.55)² = 0.45² = 0.2025`
      *   Inacc_Peg(B) = `(0 - 0.45)² = 0.45² = 0.2025`
      *   **Total Inacc_Peg(w_A) = 0.2025 + 0.2025 = 0.405**
      *   `0.405 < 0.41` (Cal's score in w_A) ✅
  *   **w_B:**
      *   Inacc_Peg(A) = `(0 - 0.55)² = 0.55² = 0.3025`
      *   Inacc_Peg(B) = `(1 - 0.45)² = 0.55² = 0.3025`
      *   **Total Inacc_Peg(w_B) = 0.3025 + 0.3025 = 0.605**
      *   `0.605 < 0.61` (Cal's score in w_B) ✅

  **Mechanism Recap:** Cal's incoherence (`c(A) + c(B) = 1.1`) placed her "outside" the convex set of coherent credence functions (which lie on the line segment `p(A) + p(B) = 1` between (1,0) and (0,1)). The strictly proper scoring rule (Brier) defines "accuracy" such that this convex set has a crucial property: any point *outside* it is strictly dominated in accuracy by *some* point *inside* it, relative to *every* corner of the possibility space (the "worlds" w_A, w_B). The mathematical force of strict propriety guarantees this convex structure and ensures the dominating point exists.

  **2. Dutch Book vs. Accuracy-Dominance: Strength and the "Nonpragmatic" Holy Grail**

  *   **Dutch Book Argument (DBA):**
      *   **Mechanism:** Shows that if your credences violate probability axioms, you can be forced into a series of bets (each seeming fair or favorable by your *own* credences) that *guarantees* a net loss, no matter what happens ("Dutch Book").
      *   **Conclusion:** Incoherent credences are *pragmatically self-defeating*. You are vulnerable to exploitation by a clever bookie.
      *   **Dependencies:** Relies on the **Connection Thesis**: Your credence `c(X)` *just is* your fair betting odds for a unit stake on `X`. It directly ties degrees of belief to *dispositions to bet*. It also assumes you care about avoiding sure loss (a pragmatic concern).

  *   **Accuracy-Dominance Argument (ADM):**
      *   **Mechanism:** Shows that if your credences violate probability axioms, they are *accuracy-dominated* by some coherent alternative: the alternative is more accurate *in every logically possible world*.
      *   **Conclusion:** Incoherent credences are *epistemically defective*. They are *objectively inferior* as guides to the truth, regardless of practical consequences.
      *   **Dependencies:** Relies on the **Accuracy Norm**: An epistemic agent ought to minimize (expected) inaccuracy. It also relies on the specific properties of Strictly Proper Scoring Rules to ground the dominance result.

  **Why "Nonpragmatic" is a Huge Deal, Not a Footnote:**

  1.  **Targeting Epistemic Purity:** The core goal of epistemology is understanding knowledge, justification, and *rational belief* itself. Pragmatic arguments (like DBA) feel like they change the subject: "Believe coherently *or else you'll lose money!*" ADM speaks directly to the *epistemic* goal: representing the world *accurately*. It says probabilism is constitutive of *truth-tracking* rationality, not just *pragmatic* rationality. This resonates deeply with the idea that belief "aims at truth".
  2.  **Escaping the Betting Paradigm:** The DBA is tied to betting. Critics argue:
      *   Credences aren't *solely* defined by betting dispositions (e.g., I might have a belief but refuse to bet for complex risk-aversion reasons).
      *   Is avoiding a sure loss the *only* or even the *primary* epistemic sin? What if I don't care about money? ADM bypasses this. Accuracy-dominance is an epistemic flaw *even if* betting is irrelevant.
  3.  **Robustness to Values:** The DBA assumes a specific relationship between credences and fair betting odds (the Connection Thesis). ADM, while requiring Strictly Proper Scoring Rules, doesn't tie belief intrinsically to action. The scoring rule is a *measure* of epistemic disvalue (inaccuracy), not a definition of belief. Furthermore, while different strictly proper rules exist (Brier, Log Score), the *dominance result holds* for any of them. The core flaw is rule-independent.
  4.  **The "Why Care?" Question:** A defender of incoherent credences might respond to the DBA: "So what if I'm Dutch Bookable? Maybe I just don't care about money, or I'll avoid clever bookies." Responding to ADM is much harder: "So what if my beliefs are accuracy-dominated? I don't care about being accurate." This is a nearly incoherent position for an epistemic agent. *Caring about truth (and avoiding falsity) is built into the very concept of belief.* An agent utterly indifferent to accuracy arguably isn't *believing* at all. This makes ADM feel like a more fundamental vindication of coherence.

  **Which Argument is Stronger?**

  *   **Intuitive Punch:** The DBA has immense intuitive power. The idea of being *guaranteed* a loss is viscerally compelling. ADM is more abstract.
  *   **Foundational Strength:** Philosophers (especially those in the "accuracy-first" epistemology program) generally view ADM as the stronger, more fundamental argument. Here's why:
      *   **Reduction, not Replacement:** ADM can often *explain why* the DBA works. The vulnerability to Dutch Books often arises *because* incoherent credences are accuracy-dominated. The clever bookie exploits the accuracy flaw to create a pragmatic flaw.
      *   **Epistemic Priority:** Accuracy seems prior to pragmatic concerns. We value avoiding sure loss *because* we value having accurate beliefs about outcomes affecting our welfare. ADM tackles the root epistemic norm.
      *   **Scope:** ADM arguments can be generalized to justify other epistemic norms (e.g., Conditionalization, the Principal Principle) within the accuracy-first framework in ways that feel more natural than purely pragmatic Dutch Book justifications. It provides a unified framework.

  **Conclusion:**

  You've hit upon a central debate. The Accuracy-Dominance argument, powered by Strictly Proper Scoring Rules like Brier, shows that probabilistic coherence isn't just a pragmatic safeguard against bookies; it's a fundamental requirement for your beliefs to even be *viable* as tools for accurately representing the world. Any incoherent set of credences is *epistemically self-defeating* – there's always a coherent alternative that truthfully dominates it, rendering it utterly pointless from the perspective of seeking truth. The "nonpragmatic" nature of this argument is its core strength, grounding the justification for probabilism directly in the essential goal of belief itself: accuracy. While the Dutch Book is a powerful and intuitive argument, the Accuracy-Dominance argument is widely seen as providing the deeper, more distinctly *epistemic*, vindication of why our degrees of belief should obey the probability calculus. Your PhD friend is hyped because this argument genuinely shifted the landscape of formal epistemology.
