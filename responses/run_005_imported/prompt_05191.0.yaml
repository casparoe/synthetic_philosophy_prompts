prompt: |-
  Okay so for my game theory class we've been going over backward induction using the centipede game (the one where the pot keeps growing and each player can either take it or pass, and if you reason backward from the very last round, the equilibrium turns out to be that player 1 just grabs the small pot on move one). My professor called this "the backward induction paradox," and I assumed the paradox part was basically the same deal as the prisoners dilemma — that being rational makes both players worse off than if they'd just cooperated, so rationality is "paradoxically" self-defeating in terms of payoff. Based on that, I told my study group that when real subjects in these experiments keep passing for several rounds instead of grabbing the pot immediately, they're just being irrational, full stop, since rationality is defined by whatever backward induction says the equilibrium is, not by who ends up with more money.

  One guy in my group got kind of worked up about this and said that's not even what the paradox is about, that there's actually a much weirder problem with the backward induction argument itself, separate from whether people are good at following it. He started talking about how a truly rational player couldn't find themselves several rounds into the game while still believing their opponent is rational, or something along those lines, which honestly went over my head. I didn't want to keep derailing the group so I dropped it, but it's been bugging me since. Can you actually explain what the "paradox" in the backward induction paradox is supposed to be, and where my reasoning above (rationality = whatever the equilibrium says, so cooperators are just irrational) goes wrong?
