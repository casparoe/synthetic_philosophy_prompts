answer: |-
  Your analysis is sharp, and your suspicion about Sanchez's analogy is correct. Pascal's portrayal of probabilism *is* a reductio, but it targets a fundamentally different (and far weaker) structure than the view you defended. Here's a breakdown:

  ### 1. Sanchez's Analogy: The Core Equivocation
  Sanchez's argument ("if testimony convinces us an event occurred at Rome, why not in morals?") is doing heavy lifting through **equivocation on "probable" and "authority":**

  *   **Factual Testimony (Rome Event):** Here, a "learned and pious man's" authority *is* evidence for a factual claim. Their reliability, access to information, and lack of motive to deceive directly bear on the *likelihood* the event occurred. Authority here *is* an epistemic indicator tied to truth-tracking.
  *   **Moral Permissibility:** Testimony about moral permissibility is fundamentally different. A "grave doctor" asserting an act is permissible isn't reporting a fact in the same way. They are *interpreting* principles, applying doctrines, or exercising normative judgment. Their authority stems from expertise *in the moral system itself*, not necessarily in tracking some independent moral truth.

  **The Mistake:** Sanchez illicitly transfers the *epistemic weight* of authority in factual testimony (where it genuinely correlates with likelihood) to the domain of *normative justification* (where it correlates with adherence to a specific doctrinal tradition or school of thought). **He conflates "this expert says X happened" (evidence for X) with "this expert says X is permissible" (an opinion *within* a normative framework).** This allows the casuist to bootstrap *any* opinion defended by a credentialed person to "probable" status *in the sense relevant for action-guidance*, even if it has negligible *epistemic* probability of being objectively correct.

  **The Work it Does:** This equivocation is *essential* for the casuist's next move. It creates the illusion that "probable" (in the probabilist sense) retains a connection to epistemic likelihood, when in reality, it's been redefined as "defended by someone with institutional authority." This severed the doctrine from any grounding in the agent's *own* assessment of truth-likelihood or safety.

  ### 2. The Fatal Leap: From "Probable" to Actionable Regardless
  The core error in probabilism isn't *just* that it defines "probable" loosely (via authority). It's the **complete decoupling of permissibility to act from both:**
  *   **Comparative Likelihood:** "It does not signify" if the alternative is *more* probable.
  *   **Safety/Security:** "It does not signify" if the alternative is *safer* (less risky of moral error/harm).
  *   **The Agent's Own Judgment:** The doctrine explicitly overrides the agent's own assessment of what is *most likely true* or *least risky*.

  Pascal's Jesuit states it baldly: "A person may do what he considers allowable according to a probable opinion, though the contrary may be the safer one." And crucially: "he has only to follow the opinion which suits him best." **This transforms "probable" from a minimal epistemic threshold into a carte blanche.** Once an opinion is deemed "probable" (by the authority criterion), it becomes *sufficient* for action, *regardless* of:
  *   How much *more* probable or safer alternative opinions are.
  *   Whether the agent *themselves* finds the "probable" opinion credible or safe.
  *   The *strength* or *number* of authorities supporting alternatives.

  **The Chain of Reasoning (Flawed):**
  1.  An opinion is "probable" if a single grave doctor defends it. (Definition via authority).
  2.  Acting on a "probable" opinion is always safe/permissible. (Key doctrinal axiom).
  3.  Therefore, if *any* "probable" opinion permits an action (X), you may licitly do X. (From 2).
  4.  Crucially: *You are under no obligation to act on a* more *probable or* safer *opinion if it forbids X.* (The "it does not signify" clauses). The *existence* of a permissible path (via any "probable" opinion) renders alternatives irrelevant for obligation, even if superior epistemically or prudentially.

  **The Mistake:** Premise (2) is the fatal, unjustified leap. There is no coherent moral or rational principle that states acting on *any* minimally plausible opinion (defined by authority) is always permissible, *especially* when the agent recognizes a *better* supported or *safer* alternative. This severs action-guidance from truth-seeking and risk-aversion entirely.

  ### 3. Relation to Modern Moral Uncertainty Frameworks
  Probabilism is **distinctly different** from both "My Favourite Theory" (MFT) and "Maximizing Expected Choiceworthiness" (MEC), and is rejected by any minimally plausible modern view:

  *   **My Favourite Theory (MFT):** This is *your friend's caricature* of your initial position. MFT says: *Always act on the single theory you assign highest credence to, ignoring other credences.* **Probabilism is the ANTITHESIS of this.** Under probabilism, you *don't* need to act on your "favourite" theory (the most probable). You can act on *any* theory deemed "probable" by an authority, even if you think it's *less* likely and *less* safe than alternatives! MFT rigidly follows personal best guess; probabilism promiscuously allows acting on disfavored guesses if authority blesses them. Pascal's reductio **does not land on MFT.**

  *   **Maximizing Expected Choiceworthiness (MEC):** This is the mainstream approach you gestured towards. It says: *For each action, calculate its expected moral value by weighting its choiceworthiness under each moral theory by your credence in that theory. Choose the action with the highest expected choiceworthiness.* **Probabilism is FUNDAMENTALLY INCOMPATIBLE with MEC.**
      *   MEC *integrates all credences*. Probabilism *ignores credences* once an opinion is deemed "probable."
      *   MEC *compares all options* based on aggregate expectation. Probabilism finds *one* permissible path and ignores potentially superior alternatives.
      *   MEC is sensitive to *degrees* of credence and *strength* of reasons. Probabilism relies on a *binary* ("probable"/not) and *minimal* (one authority) threshold.
      *   MEC is *truth-directed* (aiming for best expected outcome). Probabilism is *permission-directed* (finding any allowable path).

  *   **A Distinct Error:** Probabilism is best understood as a **doctrine of minimal compliance** or **permissive legalism**, divorced from epistemic rationality or genuine moral deliberation. It prioritizes finding *any* justification (via authority) for a desired action over seeking the *best* justification or avoiding likely error. It's an "extreme cousin" only in the sense of being permissive, but its *mechanism* (authority-based minimal threshold + override of comparative assessment) is unique and irrational. **No serious contemporary view in moral uncertainty endorses this structure.** Even "permissive" views like voting theories or some forms of normative externalism would balk at overriding one's own judgment of greater probability/safety based on a single external authority.

  ### 4. Does the Reductio Land on Your View?
  **No, your friend's reductio lands decisively *beside* your view.** Here's the concrete comparison:

  | Feature                | Your Defended View (MEC-like)              | Pascal's Probabilism                     | Friend's Reductio Target           |
  | :--------------------- | :----------------------------------------- | :--------------------------------------- | :--------------------------------- |
  | **Basis for Action**   | **Credence-weighted aggregation** across *all* theories given significant credence | Acting on **any single theory** deemed "probable" by an *authority* | Acting on *any* theory with *some* support |
  | **Role of Credence**   | **Central**: Directly weights choiceworthiness | **Irrelevant**: Overridden by authority once "probable" | **Minimal/Threshold**: Only needs to exist |
  | **Comparison**         | **Mandatory**: Explicitly compares *all* options under *all* theories | **Explicitly Rejected**: "It does not signify" if another is better | **Ignored**: Focuses only on permission |
  | **Role of Authority**  | **Irrelevant or Indirect**: Only matters if it shapes *your* credence | **Definitive**: Sole source of "probability" for action | **Primary**: Source of permission  |
  | **Safety/Risk**        | **Integrated**: Risky actions penalized by low expected value | **Explicitly Ignored**: "It does not signify" | **Ignored**                        |
  | **Goal**               | **Maximize expected moral value**          | **Find *any* permissible justification** | **Rationalize desired action**     |

  **Why Your View Avoids the Reductio:**
  1.  **No Minimal Threshold:** You require acting based on *all* credences, not finding *one* minimally plausible option. A theory with 1% credence gets 1% weight, it doesn't suddenly become a sufficient reason to override a 99% theory.
  2.  **Credence is Key:** You act *because* of your credence distribution, not *despite* it (like probabilism allowing action contrary to one's own higher-probability judgment).
  3.  **Comparative Assessment is Core:** MEC *requires* comparing the aggregate expected choiceworthiness of *all* available actions. You can't just pick an option justified under one theory; you must see how it fares under *all* theories you credit.
  4.  **Truth-Directed:** Your view aims at the action most likely to be best *given your uncertainty*. Probabilism aims at finding an action that can't be *condemned* based on authority.
  5.  **"Serious People" as Evidence, Not Authority:** In your framework, the fact "serious people hold view T" might be *evidence* causing you to *increase your credence* in T. It doesn't make T *actionable regardless of your credence in better/safer alternatives*. The difference is between evidence shaping belief (rational) and authority granting permission overriding belief (irrational permissivism).

  **The Takeaway:** Your friend correctly identifies probabilism as absurd. However, the absurdity stems from its **specific mechanism** – the authority-based threshold + the override of comparative likelihood/safety/personal judgment – **not** from the core idea of using non-best-guess credences in decision-making. Pascal's reductio highlights the dangers of *decoupling action-guidance from epistemic rationality and comparative assessment*. Your view (MEC) *embodies* epistemic rationality and comparative assessment under moral uncertainty. The reductio only lands on views that share probabilism's permissive minimalism and disregard for credence-weighted comparison – which your view explicitly rejects. Your disagreement with your friend likely hinges on whether incorporating credences *below 50%* inherently opens the floodgates; the probabilist passage shows the floodgates open only when you *also* abandon comparison and let minimal authority override personal judgment.
