  Next, addressing the nepotism charge. Confucian scholars argue that this isn't about blanket corruption. The Five Relationships have mutual responsibilities. If a son steals, the father should correct him privately, not just cover it up. The concealment is about not publicly shaming family, but internal rectification is still expected. The greater good is social stability, which starts with family harmony. So it's not that theft is okay, but that handling it within the family is better than public exposure.

