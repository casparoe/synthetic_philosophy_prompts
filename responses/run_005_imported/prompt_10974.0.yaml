answer: |-
  Here’s a rigorous argument for why moral trade is structurally vulnerable to adverse selection and moral hazard, framed through the economic analogy and addressing whether this undercuts Ord’s core premise. I’ll then examine where moral commitments might uniquely resist these failures.

  ### **The Dual Market Failure in Moral Trade**  
  *(Using your vegetarian/omnivore example as a test case)*

  1. **Adverse Selection (Hidden Type): The Problem of Fake Convictions**  
     - **Mechanism**: Before trade occurs, parties must signal their moral "types" (e.g., how deeply the vegetarian abhors leather, how sincerely the omnivore opposes factory farming). But unlike purchasing physical goods, declaring a moral stance is costless. A strategic actor can *overstate* their convictions to extract better terms.  
     - **Example**: An omnivore who doesn’t truly care about factory farming might falsely claim intense moral distress to "sell" their abstinence from it at a high price (e.g., demanding the vegetarian absorb multiple "costs" like leather + palm oil). Conversely, a vegetarian could exaggerate leather’s importance to minimize concessions.  
     - **Economic Parallel**: Mirrors the used car market (Akerlof, 1970). Just as sellers of "lemons" hide defects, insincere moral traders ("moral lemons") hide their indifference, flooding the market with bad-faith offers. Sincere traders (with costly-to-fake convictions) cannot credibly signal their type and withdraw, collapsing trade.  
     - **Why It’s Fatal**: Moral trade relies on *revealed preference*—but preferences are only revealed *after* the deal, when actions are unobservable (see below). Pre-trade, declarations are cheap talk.

  2. **Moral Hazard (Hidden Action): The Problem of Unverifiable Compliance**  
     - **Mechanism**: After trade, parties must uphold their end (e.g., the omnivore truly switches to pasture-raised meat; the vegetarian buys leather). Yet moral actions are often private: the vegetarian can’t audit the omnivore’s meat sourcing, and the omnivore can’t verify the vegetarian’s leather purchases.  
     - **Example**: The omnivore takes the vegetarian’s concession (e.g., agreeing to buy leather) but secretly reverts to factory-farmed meat. By their own moral calculus, they gain doubly: "saving" animals via the trade *and* enjoying cheap meat. The vegetarian, meanwhile, may skip leather purchases, exploiting the omnivore’s inability to monitor.  
     - **Economic Parallel**: Matches health insurance moral hazard. Just as insured patients overconsume healthcare when insurers can’t observe behavior, moral traders "defect" when their post-deal actions are hidden. Enforcement is impossible without costly monitoring.  
     - **Why It’s Fatal**: Gains from trade require mutual performance. If defection is likely, sincere actors won’t trade *even if adverse selection is solved*.

  ### **Why This Underpins a Systemic Collapse (Not Just a "Wrinkle")**  
  - **The Death Spiral**:  
    1. Sincere traders fear exploitation by insincere types (adverse selection) and expect post-deal cheating (moral hazard).  
    2. They demand excessive guarantees or exit the market.  
    3. Only insincere traders remain, offering hollow deals that yield no real moral gains.  
    → **Result**: Moral trade collapses, just like a market selling only lemons or unpriceable insurance. Ord’s model assumes honest revelation and execution—but without institutions to enforce these, the analogy fails at the point of *enforceability*.  

  - **Core Analogy Broken**:  
    Comparative advantage works because:  
    - **Goods are excludable/rivalrous**: You know if Portugal shipped wine.  
    - **Preferences are revealed via payment**: Money validates demand.  
    Moral trade lacks both:  
    - **Moral "goods" are non-excludable**: You can’t stop free-riders from benefiting (e.g., animals saved by the trade help everyone).  
    - **No price mechanism**: Subjective moral costs can’t be quantified or paid upfront.  

  ### **Where Moral Commitments Might Resist Market Failure**  
  *These aren’t trivial, but they don’t fully rescue the model:*  

  1. **Internal Sanctions**:  
     - Guilt or integrity might deter cheating *if* actors are truly sincere. But this selects only for highly virtuous traders, shrinking the market. Insincere actors face no such costs.  

  2. **Reputation in Repeated Games**:  
     - In close-knit groups (e.g., activist communities), reputation could enforce deals. But Ord’s model targets *deep moral disagreement*—parties who distrust each other’s values. Global moral trade (e.g., climate deals) lacks this enforcement.  

  3. **Moral Psychology**:  
     - Expressive commitments (e.g., "I am a vegetarian") raise the cost of defection psychologically. Yet this also raises stakes for *faking* convictions (worsening adverse selection).  

  ### **Conclusion: A Fatal Flaw in the Analogy**  
  This isn’t merely a "practical wrinkle"—it strikes at the heart of Ord’s economic parallel. Markets overcome hidden information/action via:  
  - **Signaling** (e.g., warranties for used cars),  
  - **Monitoring** (e.g., claims audits in insurance).  
  **Moral trade lacks institutional solutions to these problems.** Sincere traders *would* be crowded out, and gains from comparative advantage could only arise in edge cases (e.g., small groups with perfect monitoring). The model implicitly assumes away transaction costs that economics shows are fundamental.  

  **However**: This critique *strengthens* your article’s relevance. It shows why importing economics into ethics demands more than analogy—it requires mechanisms to handle uniquely moral problems (e.g., belief falsification, unobservable actions). Solutions might include:  
  - Blockchain-style "moral smart contracts" with verifiable actions (e.g., donating to audited charities as proxies).  
  - Leveraging shared meta-values (e.g., both sides value "sincerity" as a virtue).  
  But absent these, moral trade remains a theoretical insight vulnerable to real-world self-sabotage.  

  Would you like to dive deeper into potential solutions, or explore how other economic concepts (e.g., mechanism design) might address this?
