answer: |-
  You've hit on a profound and notoriously difficult problem for moral anti-realism, specifically expressivism (the "boo/yay" view). Your framing is excellent, and your "policy" idea is actually a recognized solution attempt. Let's break it down exactly as you asked:

  **1. Your Restatement: Does it Hold Up?**
  Yes, absolutely. You've perfectly identified the core problem:

  *   **Premise 1 (P1):** "Cheating on your taxes is wrong." Expressivist says: This expresses disapproval/attitude ("Boo tax cheating!").
  *   **Premise 2 (P2):** "If cheating on your taxes is wrong, then talking your accountant into cheating for you is wrong too." Expressivist puzzle: What attitude is expressed *here*? It's not simply "Boo tax cheating!" or "Boo accountant coercion!" on its own. It's linking two moral claims conditionally. If moral sentences *only* express attitudes, what is P2 doing?
  *   **Conclusion (C):** "Talking your accountant into it is wrong." Expressivist says: This expresses disapproval ("Boo accountant coercion!").
  *   **Validity:** The argument *looks* logically valid (Modus Ponens). But if P1 and P2 don't express truth-apt propositions (things that can be true/false), how can the inference *work*? How can someone accepting P1 and P2 but denying C be making a *mistake in reasoning*? What is the "logical glue"?

  **You are not confusing yourself.** This is a fundamental challenge called the **Frege-Geach Problem** (or the Embedding Problem), named after philosophers Gottlob Frege and Peter Geach who highlighted it. It's the central technical hurdle for expressivist theories.

  **2. Is This a Known Snag?**
  Absolutely. It's arguably *the* most famous and debated problem in metaethics concerning expressivism/non-cognitivism. Philosophers like A.J. Ayer (early emotivism), C.L. Stevenson (developed emotivism), R.M. Hare (prescriptivism), Simon Blackburn (quasi-realism), and Allan Gibbard (norm-expressivism) have spent decades grappling with it. Your roommate's initial "boo/yay" view (emotivism) struggles badly with it. More sophisticated expressivist views (like Blackburn's and Gibbard's) were developed largely *to try and solve this problem*.

  **3. Your "Policy" Idea: Fix or Camouflage?**
  Your "policy" idea is insightful and hits very close to the mark. It's essentially the core of the **expressivist solution**, particularly as developed by Simon Blackburn under the label **"quasi-realism"**. Let's analyze it using your argument:

  *   **P1 ("Boo tax cheating!")**: Expresses a basic attitude of disapproval towards tax cheating.
  *   **P2 ("If Boo tax cheating, then Boo accountant coercion!")**: This is the key. The expressivist (like Blackburn) argues P2 expresses a **higher-order attitude** or **commitment** concerning your *first-order* attitudes. Specifically:
      *   It expresses **disapproval of the combination**: *having* the attitude expressed by P1 (disapproval of tax cheating) *while* *not having* the attitude expressed by C (disapproval of accountant coercion).
      *   Think of it as: "**Boo** (approving of tax cheating but *not* approving of coercing the accountant)!" Or, as you put it: "**Boo** the policy of disapproving tax-cheating but *not* disapproving of coercing the accountant!" It's a *disapproval of inconsistency* in one's own moral sensibilities.
  *   **The Argument's "Validity":** The argument works because if you sincerely assert P1 ("Boo tax cheating!") and sincerely assert P2 ("Boo [disapproving tax-cheating but not disapproving accountant-coercion]!"), then *to be consistent with your own expressed commitments*, you *must* also assert C ("Boo accountant coercion!"). To assert P1 and P2 but deny C is to display the very inconsistency that P2 expresses disapproval *of*. You are, in effect, violating the policy you signed onto with P2.

  **So, is it a genuine fix or just hiding the hole?**

  *   **It's a Genuine (and Sophisticated) Attempt:** This isn't just wordplay. It provides a coherent expressivist account of what complex moral sentences *express* (higher-order attitudes about combinations of first-order attitudes) and explains the *force* of moral arguments (avoiding inconsistency in one's own sensibilities/commitments). It rescues the *appearance* of logical reasoning without appealing to moral facts.
  *   **But the "Inconsistency" Worry is Valid:** This is where the debate rages. Realists argue:
      *   **Thinness of "Attitude Inconsistency":** Logical inconsistency (P & ~P) is objective and truth-related. "Attitude inconsistency" seems different. Is it *really* a *mistake in reasoning*, or just a *failure of personal coherence*? If someone says, "I disapprove of tax cheating, I disapprove of people who disapprove of tax cheating but not accountant coercion, but I *don't* disapprove of accountant coercion," are they *illogical* or just *weird/conflicted*? The expressivist needs to show this "inconsistency" has the same *normative force* ("you *shouldn't* think that way!") as logical inconsistency.
      *   **Collapse into Realism?:** Does explaining the robust normativity of this "inconsistency" (why *should* I avoid this clash of attitudes?) ultimately require positing something *like* objective moral truths or logical relations between moral propositions after all? Blackburn argues "no" (that's the "quasi" in quasi-realism – mimicking realism without the metaphysics), but critics remain skeptical.
      *   **The Specificity Problem:** Can this model capture the *precise* logical structure of *all* complex moral statements (negations, disjunctions, quantifiers) with the same rigor as truth-conditional semantics? It's an ongoing technical project.

  **Conclusion on Your Analysis:**

  1.  **Your Restatement:** Flawless. You've nailed the Frege-Geach problem.
  2.  **Known Snag:** Extremely well-known and central to metaethics for over 60 years.
  3.  **Your "Policy" Idea:** This is **the heart of the leading expressivist solution** (quasi-realism). It's a genuine and sophisticated attempt to solve the problem by analyzing conditionals like P2 as expressing higher-order attitudes (disapproval of combinations of first-order attitudes). **However, your skepticism about "inconsistency" is warranted.** While it explains *why* the argument feels compelling (violating your own commitments), critics argue this "attitudinal inconsistency" lacks the robust, objective normative force of logical inconsistency and might sneak realism back in. It's a powerful patch, but the hole might still be visible around the edges under intense philosophical scrutiny.

  The debate continues. Your reasoning demonstrates a deep understanding of the challenge anti-realism faces. Expressivism offers a compelling (though contested) way to navigate it by shifting the focus from truth to the consistency of our expressed commitments and sensibilities.
