  I'm working on a longread about Einstein's philosophical wobbles while he was building general relativity, and I fell down a rabbit hole (sorry, couldn't resist) on the actual "hole argument" -- the thing he cooked up around 1913-15 that convinced him for a couple of years that generally covariant field equations couldn't be physically right, before he talked himself out of it with the point-coincidence argument. Every popular writeup I can find handles this by saying some version of "oh, its just Leibniz's old shift argument against Newton's absolute space, dressed up in modern clothes" and then moves briskly on to the resolution, which always feels like its skipping the interesting part.

  So I want you to actually do the comparison properly, the way a footnote in a philosophy of physics paper would, not the way a Wikipedia summary would. Lay out Leibniz's shift argument from the Clarke correspondence (not the bucket -- that one's Newton's, for the other side) next to the hole argument as Earman and Norton set it up in their well-known 80s paper, and tell me exactly where the logical structure lines up (indiscernible possibilities, something like Leibniz-equivalence, an appeal to the principle of sufficient reason) and where it genuinely doesn't -- I'm thinking of the fact that GR's hole argument involves a dynamical field on a manifold with active diffeomorphisms rather than a rigid container, and how determinism specifically gets threatened in a way Leibniz never framed it. Then don't hedge: tell me which of the two you think is the more decisive argument against substantivalism -- about space in Leibniz's case, manifold substantivalism about spacetime in the modern case, whichever framing makes for the fairer fight -- and defend that verdict instead of just listing pros and cons on each side.
