answer: |-
  This is a *classic* governance dilemma that strikes at the heart of community associations everywhere – you've perfectly captured the core tension. Your instinct that everyone is rationalizing their self-interest is partly true, but there *are* legitimate philosophical principles at play. There's no single "right" answer, but understanding the principles can help find a less arbitrary solution.

  Here's a breakdown of the competing principles and practical realities:

  1.  **The Ownership Principle (Current System):**
      *   **Argument:** The owner holds the deed, bears the ultimate financial risk (property value, major assessments), and pays the dues that fund everything. Voting is tied to property ownership and financial contribution. It's simple and aligns with traditional property rights.
      *   **Pros:** Clear, legally defensible, rewards investment. Ensures those funding the association control its spending.
      *   **Cons:** Ignores who actually lives with the daily consequences of decisions (noise rules, road maintenance, community atmosphere). Can lead to absentee landlords or infrequent visitors making rules for full-time residents. The Airbnb/tenant situations highlight this flaw.
      *   **Who Benefits:** Seasonal owners, absentee landlords (especially Airbnb operators), and arguably the long-term *owners* of rental properties.

  2.  **The Residency/Impact Principle (Gary's Argument):**
      *   **Argument:** Voting power should reside with those who are physically present and directly affected by the association's rules and services on a daily basis. They experience the plowing, the potholes, the neighbor disputes, the water quality.
      *   **Pros:** More democratic in terms of who *lives* under the rules. Decisions are made by those experiencing the direct consequences. Addresses the tenant/Airbnb disconnect.
      *   **Cons:** Disenfranchises the owners who financially sustain the community. Tenants may have shorter-term interests than owners (e.g., less concern for long-term property value or major capital projects). Defining "residency" can be messy (e.g., the seasonal owner who comes every weekend May-Oct?).
      *   **Who Benefits:** Full-time residents (owners *and* tenants), potentially frequent seasonal visitors.

  3.  **The Financial Contribution Principle:**
      *   **Argument:** Voting power should be proportional to financial contribution (dues paid). This could mean one vote per dues-paying lot, or even weighted voting based on dues (though that gets complex).
      *   **Pros:** Directly links control over spending to who pays. Feels "fair" from a purely financial perspective. Includes all dues-payers (including the long-term rental property *owner*).
      *   **Cons:** Still excludes affected residents who aren't owners (tenants). Doesn't account for the *intensity* of impact from living there daily vs. just paying. Could incentivize underfunding if voting power decreases with lower dues.
      *   **Who Benefits:** All dues-paying owners, regardless of occupancy. Could particularly benefit owners of multiple properties if votes per lot.

  4.  **The Stakeholder Principle (A Broader View):**
      *   **Argument:** Anyone with a significant, ongoing stake in the community should have a voice. This could *include* long-term tenants (who live there), *and* seasonal owners (who have an emotional/financial investment), *and* full-time owners, *but exclude* pure absentee investors running Airbnbs with no personal connection. The "mill houses" using the road also have a stake in its condition.
      *   **Pros:** Acknowledges multiple types of legitimate interest. More inclusive.
      *   **Cons:** Highly complex to define "stake" fairly and objectively. Legally messy to implement. Opens the door to endless debate about who qualifies.

  **Why There's No Perfect, Non-Arbitrary Solution:**

  *   **The Core Conflict:** Ownership vs. Occupancy. Property rights are fundamental, but so is the impact of governance on daily life. These are inherently in tension in a mixed-use community association.
  *   **The Tenant Conundrum:** Legally, tenants usually can't vote in an HOA/POA unless the owner formally delegates their vote (via proxy). They don't own the stake. Yet, they are deeply affected.
  *   **The "Mill House" Problem:** They are free-riding on your infrastructure. This is fundamentally unfair and creates a separate, significant problem. Resolving their status (e.g., negotiating their re-entry into the association for road access) might be a prerequisite for a stable voting system.
  *   **The Airbnb Wildcard:** This exacerbates the ownership/occupancy disconnect. The absentee owner benefits financially while contributing minimally to community life, and transient guests create impacts without any stake at all.

  **Moving Towards a Less Arbitrary Solution (Practical Steps):**

  1.  **Acknowledge the Complexity & Self-Interest:** Start the next discussion by openly acknowledging that each perspective has merit *and* that self-interest plays a role. This fosters honesty.
  2.  **Define the Association's Core Purpose:**
      *   Is it primarily about *maintaining property values and shared infrastructure* (favors Ownership/Financial Contribution)?
      *   Is it primarily about *fostering a cohesive, well-managed residential community* (favors Residency/Impact)?
      *   Is it a balance of both? Getting clarity here helps choose a principle.
  3.  **Consider Hybrid Models:**
      *   **One Vote Per Lot, but Mandatory Proxy for Rentals:** The owner *must* designate either themselves or their long-term tenant (e.g., lease >6 months) as the voting representative for that property. This gives tenants a voice *if* the owner chooses, but retains owner control.
      *   **Two Classes of Membership:** "Owner-Members" (vote on all matters) and "Resident-Members" (long-term tenants, vote only on specific issues like rules enforcement, amenity use, maybe road maintenance). Seasonal owners remain Owner-Members.
      *   **Require Owner Attendance/Proxy for Key Votes:** For major decisions (assessments, bylaw changes), require owners to participate personally or appoint a proxy (who could be a tenant or resident neighbor), preventing pure absenteeism.
      *   **Advisory Role for Tenants:** Allow long-term tenants to attend meetings, serve on committees, and provide input, but without a formal vote. This acknowledges their stake without altering ownership rights.
  4.  **Address the Mill Houses:** This is unsustainable. The association needs to explore legal options to either:
      *   Negotiate their formal inclusion (pay dues, get vote/road maintenance).
      *   Establish a formal easement agreement with fees for road usage.
      *   Pursue legal action to enforce property rights (least desirable, costly).
  5.  **Survey the Community:** Before proposing changes, survey *all* owners (and maybe long-term tenants) to understand perspectives and gauge support for different models. Frame it neutrally.
  6.  **Legal & Bylaw Review:** Any change requires amending bylaws. **Crucially, consult your association's lawyer.** State laws governing HOAs/POAs vary significantly and may restrict who can be granted voting rights (often limiting it to owners). Ensure any proposal is legally viable.
  7.  **Focus on Fairness & Sustainability:** Frame the discussion around creating a system perceived as fair by the majority and sustainable for the long-term health of the community. Emphasize shared goals: a well-maintained, pleasant, and financially sound community.

  **Is it always about who has the votes?** Initially, yes, changing the rules requires the votes under the *current* system. However, a well-facilitated discussion focusing on principles, the community's purpose, and practical hybrid solutions can move beyond pure power politics. The goal isn't a perfect, purely philosophical solution, but one that balances legitimate interests well enough to gain broad acceptance and function effectively for your unique community. It requires compromise and recognizing that different stakeholders *do* have different, valid kinds of "skin in the game." Good luck!
