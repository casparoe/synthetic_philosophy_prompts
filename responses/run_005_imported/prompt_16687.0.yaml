  Then there's autonomy: if I adopt a moral belief purely on testimony, is it really "mine"? But we constantly outsource judgments to experts without identity crises. My cardiologist's diet advice becomes my reason to avoid salt; why can't my ethicist friend's view on factory farming become my reason to go vegan? Autonomy might mean vetting sources, not reinventing moral wheels.

  But I shouldn't oversell. Even if deference transmits knowledge, Hills nails something: understanding *enhances* moral agency. Someone who sees *why* torture is wrong (dehumanization, ripple effects) responds better to novel dilemmas than someone just parroting "torture bad." And in borderline cases (e.g., complicated utilitarianism tradeoffs), deference without grasp risks misapplication. 

  The user’s LW friend probably values calibration: if a source has better moral track records than me, deferring is Bayesian rational. But ethics isn't just facts—it's about *owning* reasons. Maybe the compromise is: deference gets you knowledge for action, but understanding deepens resilience and flexibility. Like using GPS vs. reading a map; both work, but one builds skills.

  Final note: the user wants intellectual honesty. So I’ll admit pessimists win on moral worth in Kantian terms (acting from understanding might be more "good will"-y), and that understanding prevents drift when authorities conflict. But for daily life? Deference often isn't just efficient—it’s *necessary*. We’re finite beings; refusing moral testimony would be epistemic arrogance.
answer: |-
  Here’s a rigorous case against moral testimony pessimism, engaging directly with Hills’ "moral understanding" argument and the autonomy objection, while acknowledging where pessimism retains force. The core thesis: **Moral deference *can* transmit genuine moral knowledge, and its epistemic legitimacy parallels empirical deference in structurally identical ways when source reliability is established.** Let’s break it down:

  ### 1. **Undermining Hills' "Moral Understanding" Requirement**
     Hills argues that even true, justified moral beliefs acquired via testimony lack *moral understanding*—the ability to "grasp the reasons" why an act is right/wrong. Without this, she claims, the resulting action lacks "full moral worth."

     **The Rebuttal:**
     - **Understanding ≠ Knowledge Transmission:** Hills conflates two distinct epistemic goods: *knowing-that* (e.g., "eating meat is wrong") and *knowing-why* (e.g., "because it causes unnecessary suffering to sentient beings"). Testimony can transmit *knowledge-that* without transmitting *knowledge-why*, but this doesn’t negate the former’s epistemic status. Just as a doctor’s diagnosis ("You have strep throat") gives you medical knowledge without requiring you to understand bacteriology, moral testimony can give you moral knowledge without requiring you to reconstruct the justificatory chain.
     
     - **The Scaffolding Defense:** Moral understanding often *begins* with deference. A child who accepts "stealing is wrong" on parental authority later develops understanding through experience and reasoning. Deferred belief acts as an epistemic placeholder, enabling moral development. Rejecting deference would stall moral learning in complex domains (e.g., bioethics), where novices lack the tools to independently assess reasons.

     - **Moral Worth Misplaced:** Hills links moral worth to understanding, but this is question-begging. If an agent abstains from meat solely due to a trusted friend’s testimony, and the belief is *true*, their action *does* prevent harm—which has objective moral value. The pessimist must explain why "moral worth" requires an *internal cognitive state* rather than the *external consequence* of right action.

  ### 2. **Countering the Autonomy Objection**
     Pessimists argue that moral beliefs must be "one’s own" to be authentic—deference allegedly undermines moral autonomy by outsourcing judgment.

     **The Rebuttal:**
     - **Autonomy as Responsible Delegation:** Autonomy isn’t violated when we rationally delegate judgment to trustworthy experts. We defer to oncologists about chemotherapy because they possess superior epistemic access to complex facts. Similarly, if a moral testifier (e.g., a human rights scholar with decades of fieldwork) has deeper exposure to relevant facts (e.g., the dynamics of oppression), deferring to them is an *exercise* of autonomy—a rational choice to rely on better-informed judgment. Rejecting such deference would be epistemic arrogance, not autonomy.
     
     - **The Empirical Parallel (McGrath’s Insight):** We routinely defer on deeply personal empirical claims without autonomy concerns. If your therapist (trusted, calibrated) says, "Your childhood trauma explains your anxiety," you accept this without independent verification. If moral deference uniquely violates autonomy, it must be because moral facts are fundamentally different—but pessimists haven’t shown this (see §3).

  ### 3. **Why Moral Testimony Isn’t Epistemically Unique**
     Pessimists claim moral deference is uniquely problematic because moral knowledge requires "first-personal engagement" with reasons.

     **The Rebuttal:**
     - **No Special Epistemic Barrier:** Moral facts supervene on non-moral facts (e.g., suffering, consent, well-being). If I defer to a reliable testifier on *non-moral* facts (e.g., "Factory farming causes prolonged suffering in pigs"), and they competently infer the moral fact ("Therefore, supporting factory farming is wrong"), this is structurally identical to deferring on empirical inferences (e.g., a climatologist inferring "CO2 emissions cause warming" from atmospheric data). The inference’s complexity doesn’t invalidate testimony—it just requires trusting the testifier’s reasoning capacity.
     
     - **Calibration Warrants Deference (Rationalist Lever):** If a testifier has a demonstrably better track record than you on moral questions (e.g., predicting which policies reduce suffering, or consistently aligning with reflective equilibrium post-discussion), Aumann-style modesty *demands* deference. Refusing this is epistemically irresponsible—akin to ignoring a weather forecaster with 95% accuracy because you "want to see the radar yourself."

  ### 4. **Where Pessimism Retains Force (Concessions)**
     Even if deference transmits knowledge, pessimists win three key points:
     - **Moral Understanding as a Distinct Value:** While not required for *knowledge*, understanding has intrinsic value. An agent with deep comprehension of *why* meat-eating is wrong can better navigate novel dilemmas (e.g., lab-grown meat), apply principles flexibly, and resist manipulation. Deference alone doesn’t cultivate this.
     - **Vulnerability to Misuse:** Deference without critical engagement risks dogmatism or exploitation by bad actors (e.g., cult leaders). This isn’t unique to morality—empirical deference can also fail—but moral beliefs more directly influence action, raising stakes.
     - **Moral Worth in Kantian Terms:** If "moral worth" requires acting *from* duty (Kant) or virtuous motivation (Aristotle), mere action on testified belief may lack worth. But this is a *normative*, not epistemic, critique—and applies equally to empirical testimony (e.g., taking meds solely because the doctor said so, not to get healthy).

  ### Synthesis: Why Optimism Holds
  Moral deference can transmit knowledge because:  
  **(a)** Reliability in the testifier (track record, expertise, calibration) justifies belief, just as in empirical domains.  
  **(b)** Hills’ "understanding" is a virtue of ideal agency, not a condition for knowledge.  
  **(c)** Autonomy concerns confuse epistemic responsibility with radical self-reliance.  

  **The bottom line:** Refusing warranted moral deference is often *less* rational than accepting it. While understanding enriches moral agency, insisting on it as a prerequisite for knowledge or right action ignores how humans navigate complex, socially embedded knowledge—in ethics as much as in science.

