prompt: |-
  I'm currently taking a graduate seminar on classical Indian epistemology, and we've just finished working through the Nyāya treatment of anumāna. I can follow the basic five-membered syllogism and the definition of vyāpti as invariable concomitance between hetu and sādhya, but I'm still hazy on the actual mechanics by which the Naiyāyikas thought a general vyāpti claim could be secured against hidden exceptions. Could you explain, with reference to the classic smoke-and-fire example, how upādhi and tarka function together in vyāpti-graha — how repeated favorable observation plus the failure to discover an upādhi is supposed to license a universal claim, and what work tarka is doing there that mere enumeration of instances cannot do on its own? I'd also like your honest assessment of whether this apparatus actually meets the Buddhist objection that Dharmakīrti and others pressed against Nyāya — namely, that no amount of non-observation of counter-instances can justify a pervasion unless it is grounded in a real relation such as causal production (tadutpatti) or essential identity (tadātmya) — or whether the Naiyāyikas, for all the technical machinery of Gaṅgeśa's Tattvacintāmaṇi, are ultimately just papering over a genuine inductive gap.
