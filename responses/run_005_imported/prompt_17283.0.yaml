answer: |-
  Here’s a draft recommendation memo addressing the committee’s concerns, balancing historical fidelity, pedagogical clarity, and philosophical rigor:

  ---

  **MEMORANDUM**  
  **TO:** Editorial Committee, Ethics Sourcebook  
  **FROM:** [Your Name], Bentham Specialist  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Excerpting Bentham’s "Offences Against One’s Self" for Classical Utilitarianism Module  

  ### I. Proposed Approach: Trimmed Excerpt + Contextual Headnote
  After careful review, **I recommend including a focused excerpt of "Offences Against One’s Self"** paired with a headnote explicitly addressing the scope of Bentham’s argument. *Omission* would obscure a historically significant application of utility, while a *full excerpt* risks overwhelming introductory students with tangential material.  

  ### II. Specific Text Selection
  - **Included:**  
    The core argument against criminalizing consensual homosexual acts (e.g., Crompton’s key passages on "no injury," the critique of disgust as "antipathy," and the utility calculus contrasting these acts with rape/public indecency).  
  - **Excluded:**  
    Sections extending the argument to bestiality or other "irregularities." (Cite *Of Sexual Irregularities* for scholarly reference.)  

  ### III. Headnote Requirements
  The headnote **must** address the following to prevent misrepresentation:  
  1. **Historical Scope:** Acknowledge that Bentham applied identical logic to *all* non-procreative acts deemed "irregular" in his era (bestiality included), grounding this solely in absence of harm and rejection of antipathy.  
  2. **Philosophical Tension:** State explicitly: *Bentham’s reasoning does not distinguish between acts modern ethics condemns (e.g., bestiality) and those it accepts (e.g., homosexuality). This exposes a challenge for harm-based utilitarianism: Can it prohibit consensual acts without invoking disgust or independent moral intuitions?*  
  3. **Bentham’s Intent:** Clarify that his target was *legal punishment* (not moral endorsement) and that he saw blanket criminalization as irrational under utility.  
  4. **Modern Context:** Note that contemporary utilitarians (e.g., Singer) often introduce elements like consent capacity or interests of non-human parties, which Bentham did not develop here.  

  ### IV. Why This Addresses Committee Concerns
  - **For Pro-Excerpt Members:** The trimmed text showcases Bentham’s radical application of utility to LGBTQ+ issues ahead of his time, with the headnote’s "antipathy" analysis reinforcing core course concepts.  
  - **For Concerned Members:** The headnote directly confronts the argument’s *uncomfortable breadth*, transforming it from a oversight into a teaching moment. Students must grapple with whether utilitarianism can condemn acts like bestiality without abandoning Bentham’s own premises.  

  ### V. Key Risks Mitigated
  - **Misrepresentation:** Trimming avoids implying Bentham *endorsed* all acts, while the headnote clarifies his logic’s implications.  
  - **Oversimplification:** The headnote frames the tension as a *philosophical problem inherent to utilitarianism*—not a flaw in Bentham’s consistency.  
  - **Pedagogical Soundness:** Students encounter a primary source demonstrating utility’s subversive potential, while being prompted to critique its limits.  

  ### VI. Sample Headnote Language  
  > "Bentham’s unpublished argument against punishing consensual homosexual acts applies his utility principle consistently: where no harm occurs, criminalization reflects mere 'antipathy' (disgust). Notably, he extended this logic to *all* 'irregular' acts, including bestiality—a point excluded here for focus but essential to his view. This forces a question: Can a utilitarian sexual ethics *ever* prohibit consensual acts without relying on unexamined intuitions? Bentham’s answer implied 'no,' challenging us to refine or reject utility’s sufficiency."  

  ### VII. Recommendation Summary  
  | **Element**          | **Specification**                                                                 |  
  |-----------------------|-----------------------------------------------------------------------------------|  
  | **Excerpt**           | Trimmed to consensual homosexual acts + antipathy critique.                       |  
  | **Headnote**          | Must include: historical scope, philosophical tension, Bentham’s legal (not moral) focus. |  
  | **Omitted Material**  | Cited in headnote/footnote for transparency (*Collected Works*, Vol. X, p. XX).   |  

  This approach honors Bentham’s text as philosophy, not hagiography, while using its difficulties to deepen engagement with utilitarian theory.  

  ---  
  **Final Note:** This memo prioritizes the committee’s mandate to teach *how philosophers argue*, not just what they conclude. Bentham’s manuscript is invaluable precisely because it unsettles modern assumptions—but requires scaffolding to ensure productive unsettlement.
