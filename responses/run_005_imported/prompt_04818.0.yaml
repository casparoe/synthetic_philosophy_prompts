  Here's a tight one-liner playing on the forced-march sorites and the key difference in how they handle the disjunction:

  > **"I know *exactly* which grain removal makes it not-a-heap," whispered the Epistemicist, sweating. "I just don't know *which one*."  
  > "Relax," said the Supervaluationist. "For *any* removal, either it *was* a heap before or it *wasn't* after... though for *some*, I couldn't possibly tell you which."**

  **Why it works for your audience:**

  1.  **Epistemicism Core:** Captures the agonizing forced-march pressure ("sweating") and the central paradox: a precise, unknowable cutoff ("exactly which... just don't know which one").
  2.  **Supervaluationism Core:**
      *   **Bivalence Dropped:** Explicitly acknowledges indeterminacy ("for *some*, I couldn't possibly tell you which").
      *   **Excluded Middle Preserved (via Supertruth):** Emphasizes that the disjunction "heap-before OR not-heap-after" holds *for every single grain removal* ("For *any* removal, either... or..."). This is supertrue – true on every precisification, even though *which* disjunct is true varies precisification-by-precisification for borderline removals.
      *   **Higher-Order Nod:** The phrase "for *some*, I couldn't possibly tell you which" hints at the indeterminacy *about* which cases are borderline (higher-order vagueness), which both theories grapple with but handle differently.
  3.  **Forced-March Context:** The setup ("grain removal") directly references the Sorites sequence being traversed step-by-step.
  4.  **The Humor:** The Epistemicist is portrayed as stressed and paradoxical. The Supervaluationist is calm, almost dismissive ("Relax"), but delivers a statement that's technically correct (supertrue!) yet deeply unsatisfying and equally unhelpful for pinpointing a cutoff, highlighting the different *kind* of mystery each theory accepts. The joke lands on recognizing the *specific* technicalities each character embodies.

  **Bonus compressed version:**
  > **Epistemicist (counting sand): "The cutoff *is* precise... somewhere!"  
  > Supervaluationist: "And crucially, for every grain, it *was* a heap or it *wasn't* one afterward. Even when it's neither."**

