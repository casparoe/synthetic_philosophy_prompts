prompt: |-
  I host a philosophy podcast, and next week's guest defends al-Ghazālī's occasionalism about causation -- the claim, from the seventeenth discussion of The Incoherence of the Philosophers (Tahāfut al-Falāsifa), that fire has no power of its own to burn cotton, and that what looks like natural necessity is only God's habitual way of acting -- as a live position in contemporary metaphysics rather than a historical curiosity. Draft eight to ten interview questions that go beyond having her restate the view. I want at least one question on why appealing to divine "custom" to explain the fire-and-cotton case is not simply Hume's regularity theory with "God" inserted as the placeholder for constant conjunction; one on Averroes's charge, made in direct reply to this discussion, that denying necessary connections between causes and effects renders demonstrative scientific knowledge impossible; and one on whether the Ash'arite doctrine of "acquisition" (kasb) can secure genuine moral responsibility for agents who, on this view, cause nothing at all. For each of these three, add a follow-up keyed to the answer she's most likely to give, and close with a question about what observation, if any, could count as evidence against occasionalism.
