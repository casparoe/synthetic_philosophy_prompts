  So a few weeks ago I went down a total rabbit hole watching youtube videos about famous skeptics who ended up having weird near-death experiences, and that's how I first ran into A.J. Ayer. Apparently this guy was like THE big name in logical positivism back in the 1930s, and then in 1988, when he's in his late 70s and in the hospital recovering from pneumonia (if I remember that bit right), he chokes on a piece of smoked salmon and is basically clinically dead for something like 4 minutes before they bring him back. Afterward he wrote this newspaper piece called "What I Saw When I Was Dead," describing a red light and something like "ministers" in charge of space who weren't doing their jobs properly (my memory of the exact details is fuzzy, but that's the gist). The bit that got quoted everywhere afterward is him saying the whole thing had "slightly weakened" his conviction that his actual death, whenever it came, would be the end of him, even though he still said he hoped it would be.

  That sent me down a second rabbit hole into his early book Language, Truth and Logic, where as I understand it his whole verification principle says a sentence only counts as meaningful if it's either true by definition or at least checkable against experience in principle, and otherwise its not false exactly, its just meaningless, kind of like noise dressed up in the grammar of a sentence. And "you survive the destruction of your own body" seems like exactly the kind of claim that should land in the meaningless pile on his own terms, since theres no obvious way to spell out what would even count as the "same person" showing up afterward once you've gotten rid of the body and brain that made tracking identity possible in the first place. Here's the bit that's been bugging me, and that I tried to sketch out below: if survival-talk is meaningless rather than false, you shouldn't be able to have your "conviction" about it weakened or strengthened by any experience, since conviction is a degree of belief in something with an actual truth value, and meaningless strings of words don't have one. So when 80s Ayer talks about his conviction getting shaken, is he quietly dropping the "meaningless" verdict specifically for survival claims (and if so when did that happen, since I know he'd backed off strict verificationism generally by then), or is he just talking loosely in a newspaper column in a way that shouldn't count as a real philosophical shift, or have I just mangled the meaningless-versus-false distinction somewhere in all this?

  I've got zero background in philosophy, I just read about this stuff for fun on my commute, so there's probably holes in how I've laid it out above. Could you go through the reasoning and tell me where I've gotten Ayer's actual views wrong, if I have, whether the tension I'm pointing at is a real one or something that dissolves once you think about it more carefully, and whether this is already some well-worn point that people who've actually studied him have made a hundred times over? I brought this up with my roommate over dinner and she just gave me a blank stare, so right now you're kind of my only outlet for it.
