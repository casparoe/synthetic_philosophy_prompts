prompt: |-
  random q from outside Jewish philosophy—I'm doing a diss chapter on premodern religious attitudes toward animals and I've been using Maimonides as my main case study. My working read has been that his famous 'sacrifice was just a temporary concession' argument in the Guide is basically a covert animal-welfare position: he's uncomfortable with killing animals for worship, so the whole sacrificial system gets framed as damage control that God only tolerates until the Israelites are spiritually ready to graduate to prayer alone. That seemed to line up with the stuff elsewhere in the Guide about shechita being the least painful slaughter method and the rule against slaughtering an animal and its young on the same day. But now i'm second-guessing myself—am i just fusing two seperate arguments of his into one? Would love a sanity check before I build a whole section around this.
