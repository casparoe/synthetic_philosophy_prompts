answer: |-
  ## Dialogue: The Bystander's Gambit

  **Setting:** A coffee shop after the seminar, late evening. Empty except for ELARA (epistemic contextualist) and MARCUS (pragmatic encroachment theorist).

  **Elara:** (Stirring her coffee) Alright, Marcus, let's revisit that mismatch case. The idle bystander, call him Ben. He's got nothing riding on Hannah's banking woes. He hears her evidence – saw the hours two weeks ago. Ben, lounging in his metaphorical armchair, says "Hannah knows the bank is open Saturday." Meanwhile, Hannah is sweating bullets, facing financial ruin if she’s wrong. According to *your* encroachment, what’s the truth-value of Ben’s claim?

  **Marcus:** Straightforward. Ben’s utterance, "Hannah knows," is **false**. Knowledge isn't a plaything of the attributor's context. It’s a state Hannah is *in*, defined by her relation to the proposition *and the practical demands of her situation*. Her high stakes raise the justificatory bar her evidence must clear. Her recollection, sufficient for a low-stakes Saturday errand, isn’t enough when missing the deposit means disaster. She lacks knowledge. So Ben, attributing knowledge, is simply wrong – regardless of how relaxed *he* feels.

  **Elara:** But that clashes violently with linguistic intuition! Ben *is* linguistically competent. In *his* context, considering Hannah’s evidence with *his* low stakes salient, "knows" naturally applies. Your theory forces him into error for using the word correctly according to the conversational standards *he’s* operating under. It seems to demand that Ben magically intuit Hannah’s personal, private stakes to use "knows" correctly. That’s not how language works. "Knows" adjusts to the attributor’s context, just like "tall" adjusts to whether we're talking about jockeys or basketball players. Ben’s utterance expresses a proposition relative to *his* low standards: *Hannah meets the evidential threshold relevant for Ben’s low-stakes context*. And *that* proposition is **true**.

  **Marcus:** Ah, but *your* theory creates a different kind of absurdity! Imagine the reverse: Hannah is low-stakes, just confirming trivia. Sarah, who faces ruin if *she* (Sarah) is wrong about the bank, hears about Hannah’s evidence and says, "Hannah doesn’t know the bank is open!" According to you, Sarah’s utterance is **true** because *her* high stakes set a demanding standard. But Hannah *is* low-stakes! Her evidence *is* sufficient *for her situation*. She *does* know! Your contextualism lets Sarah’s personal anxiety *falsely* deny knowledge to Hannah, who is perfectly well-positioned epistemically relative to her own practical reality. That makes knowledge attribution bizarrely dependent on the speaker’s neuroses, not the subject’s state.

  **Elara:** (Leans forward) Point taken about the reverse case feeling odd. But it *is* a feature of context-sensitivity! Sarah’s utterance means *Hannah fails to meet the high standard relevant to Sarah’s high-stakes context*. And *that* proposition is true. Hannah doesn’t meet *Sarah’s* standard. Crucially, this doesn’t mean Hannah loses her low-stakes knowledge. She still meets the standard relevant to *her own* context. Different propositions. You keep conflating the proposition expressed with some context-independent "knowledge-state." The charge that speakers are oblivious? They aren't! They smoothly adjust the standard without explicit reflection, just like we adjust "tall" or "ready" effortlessly. We don't consciously think "indexical!" when we say "I'm here now," yet we grasp the meaning perfectly in context. It's the same with "knows."

  **Marcus:** But *your* adjustment mechanism is the problem! You say stakes affect the *meaning* of "knows," making it express different propositions. I say stakes affect the *epistemic facts themselves* – what it *takes* for a true belief to be knowledge. When Hannah's stakes soar, her evidence doesn't vanish, but its *justificatory sufficiency* diminishes relative to the cost of error. It's not about labeling; it's about the actual demands of rational action. Knowledge *just is* the level of justification appropriate for the subject's practical reasoning. Your contextualism dissolves Hannah's high-stakes anxiety into semantics. Mine takes it seriously: her evidence *isn't good enough for what she needs to do*, hence she doesn't know. Ben, ignoring her plight, misattributes knowledge because he misunderstands the *actual epistemic demands on her*.

  **Elara:** And *your* encroachment dissolves the *linguistic* regularity! Why does "knows" *sound* right in low-stakes attributions and wrong in high-stakes ones, *even when made by an observer*? Your theory has to say Ben's low-stakes attribution is *false*, yet competent speakers find it natural. That requires explaining away a widespread linguistic practice as systematic error. My theory explains the linguistic data directly: the word's meaning incorporates context-sensitivity. As for Hannah "losing knowledge" without new evidence: she doesn't *lose* a static thing. The epistemic goalposts move *for her practical situation*. What was once sufficient justification *ceases to be sufficient* because the consequences of being wrong are now catastrophic. Rational action requires more assurance. That *is* a change in her epistemic standing relative to the proposition's role in her life.

  **Marcus:** Hmm. So you see the shift as fundamentally linguistic (meaning of "knows" changes with attributor context), and I see it as fundamentally epistemic (justificatory requirement changes with subject stakes). But are we even disagreeing about the *same thing*? Perhaps "knowledge" in your contextualist sense refers to *truth-evaluable claims made by attributors in context*, while "knowledge" in my encroachment sense refers to a *subject's action-guiding epistemic state relative to their practical situation*.

  **Elara:** (Nods slowly) That's a fair point. My "knowledge-attribution truth" is inherently contextual and tied to the speech act. Your "knowledge-state" is a subject-centered, practical-rational status. In the *pure* low-stakes or high-stakes cases, our predictions often align on whether an attribution *sounds* true or false. The mismatch cases expose the different foundations.

  **Marcus:** Exactly. In Ben's case (low-attributor/high-subject), you say Ben's claim is true (low standard met), I say it's false (subject lacks high-stakes knowledge-state). But underlying this: We agree Hannah's evidence is unchanged. We agree her practical situation makes relying on that evidence highly risky. We agree Ben, unaware of her stakes, would *say* she knows. The difference is whether we call *Ben's utterance* "true" or whether we insist that only the *subject's practical-epistemic state* determines the correctness of *any* knowledge attribution aimed at describing *that state*.

  **Elara:** And in Sarah's case (high-attributor/low-subject), you say Sarah's denial is false (subject has low-stakes knowledge-state), I say her utterance is true (high standard unmet). Underlying: We agree Hannah is fine acting on her evidence. We agree Sarah, due to *her own* stakes, requires more evidence than Hannah has. We agree Sarah would *deny* Hannah knows. The difference is whether Sarah's denial is correct *given her context* or incorrect because it misrepresents *Hannah's* context.

  **Marcus:** So is it substantive? I think yes, because it reflects a deep choice: Is the primary role of "knows" to *describe a context-independent state of the subject* (which I think it is, or should be), or is it to *express a relation between the subject's evidence and the attributor's contextually salient standards* (as you argue)? This choice impacts metaphysics (what *is* knowledge?) and philosophy of language (how does "knows" function?). But is it *merely* verbal? Not entirely. While we might map each other's claims onto our own frameworks ("Elara's 'true attribution in context C' is just Marcus's 'subject meets C's standard'"), the *explanatory primacy* is reversed. You ground the linguistic practice; I ground the practical rationality. Our intuitions pull in both directions, which is why we argue! Perhaps settling *which* concept our word "knows" primarily tracks – the attributor's standard or the subject's state – is the unresolved core.

  **Elara:** (Smiles wryly) And perhaps that’s why we ran out of energy last night. We weren't just bookkeeping; we were wrestling with which lens – language or practical rationality – gives the truer picture of what "knowledge" ultimately *is* or *should be used for*. The mismatch case isn't a trick; it's a spotlight on the fault line. Another coffee? I suspect this isn't settled yet.

  **Marcus:** (Chuckles) Definitely not settled. But another coffee? Absolutely. At least the stakes on *this* are agreeably low. Pass the sugar. I *know* I need it. (Pauses) Or rather, relative to my current context of impending caffeine deficiency, my evidence strongly suggests... ah, never mind. Sugar, please.

  **(They both laugh, the unresolved tension lingering but now framed by a clearer understanding of its source.)**
