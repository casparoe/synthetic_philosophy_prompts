answer: |-
  Here’s a draft dialogue capturing the clash of ideals, with both positions articulated seriously and neither conceding ground:

  **Setting:** The drawing-room of a country house after dinner. Cigarette smoke hangs in the air. Port circulates. Mrs. Aldous and Gerald Fenn find themselves isolated on a sofa as other guests converse quietly.

  **(The conversation turns to a recent exhibition at the Grafton Galleries.)**

  **GERALD:** ...utterly transformative, Mrs. Aldous! Cézanne, finally! Those apples... it’s not *what* they depict, but the sheer architectonics of it. The *relations* between planes, the tension of colour masses... pure, self-sufficient *form*. That’s where true artistic significance lies. Clive Bell has it precisely right.

  **MRS. ALDOUS:** *(Leaning forward, her gaze intent)* Significant form? An intriguing phrase, Mr. Fenn, but surely sterile? I’ve just been revisiting Tolstoy’s ‘What is Art?’, and his insistence strikes me as far more fundamental. Art’s worth lies not in abstract relations, but in its *human* function: the sincere transmission of feeling from one soul to another.

  **GERALD:** Feeling? But that’s precisely the trap of subject matter! It binds art to sentimentality, to illustration, to mere anecdote! A Cézanne still life *feels* monumental precisely because its power derives from its formal perfection, not because it makes one weep over apples!

  **MRS. ALDOUS:** Perfection for whom? Tolstoy argues compellingly that true art must transmit feelings *accessible* to all people – the ploughman and the peer alike. It must unite humanity in shared experience. Your ‘significant form’, I fear, speaks only to a coterie, a privileged few trained to decipher its codes. Doesn’t that make it merely... decorative?

  **GERALD:** Decorative? Hardly! It’s an experience of pure aesthetic emotion, as real and profound as any sentiment stirred by a melodrama! Why must art be a moral tract or a universal handshake? Can it not be valued for the intensity of the purely visual experience it offers, regardless of the ‘feeling’ it supposedly packages?

  **MRS. ALDOUS:** Because without that shared feeling, without that sincere impulse to connect, it becomes a closed circle, a parlour game for aesthetes. Tolstoy was ruthless in his application. He concluded that even his own *War and Peace*, by this test, largely fails. Too complex, too rooted in the specific preoccupations of his class. Only his simplest peasant tales – where the feeling of brotherhood or sorrow is crystal clear to *anyone* – pass muster as true art.

  **GERALD:** *(Stunned, then recovering with a sharp laugh)* He condemned *War and Peace*? That’s... perverse! By that measure, Chartres Cathedral fails because a Sussex shepherd might not grasp its structural logic? Beethoven fails because a factory hand hasn’t learned sonata form? You exile nearly everything profound!

  **MRS. ALDOUS:** I didn’t say *profundity* was absent, Mr. Fenn. I said *accessibility* and *sincere transmission* are the measures of art’s *worth as art*. Complexity isn’t banned, but obscurity born of exclusivity is fatal. If your ‘pure aesthetic emotion’ remains the preserve of a tiny elite, how is it fundamentally different from a private language?

  **GERALD:** And if your ‘universal feeling’ reduces art to the lowest common denominator – to tales fit only for peasants, by your own admission! – what becomes of exploration? Of pushing boundaries? Of the artist’s unique vision expressed through form itself? Must we all paint nothing but... morally uplifting sunsets?

  **MRS. ALDOUS:** Sincerity and clarity are not the enemies of exploration, Mr. Fenn. They are its necessary guides if art is to remain a vital human communion, not merely an intellectual puzzle. A sunset, sincerely felt and clearly shared, might indeed hold more artistic merit than the most formally ingenious enigma that leaves the multitude cold.

  **GERALD:** Then we are at an impasse, Mrs. Aldous. You see art as a bridge, built of shared feeling. I see it as a mountain, scaled for the unique vista offered by its form. One demands universal recognition; the other values the intrinsic quality of the climb itself, even if few attempt it. I cannot accept that the view from the base camp is inherently superior.

  **MRS. ALDOUS:** *(Quietly, holding his gaze)* And I cannot accept that a view accessible only to a handful of climbers constitutes the mountain’s true worth. The bridge serves more souls. Tolstoy reminds us that art *must*.

  **GERALD:** *(Shaking his head, a mix of frustration and fascination)* Then, madam, we must agree to profoundly disagree. More port? *(He gestures towards the decanter, the social veneer reasserting itself over the philosophical chasm.)*

  **MRS. ALDOUS:** *(With a small, tight smile)* Thank you, no. I find the air quite... charged enough already.

  **(Their hostess catches Mrs. Aldous's eye with a look of mild alarm, swiftly initiating a change of subject with the guest beside her.)**

  ---

  **Key elements achieved:**

  1.  **Tolstoy Articulated:** Mrs. Aldous clearly states sincerity, clarity, and universal accessibility as the core criteria. She delivers the shocking conclusion about *War and Peace* and the peasant tales.
  2.  **Formalism Defended:** Gerald argues passionately for intrinsic formal relations ("architectonics," "tension of colour masses," "pure aesthetic emotion") as the source of value, independent of communicated feeling or accessibility. He rejects the "moral tract" or "universal handshake" requirement.
  3.  **Mutual Challenge:** Gerald presses the "lowest common denominator" and "exploration" consequences of her view. Mrs. Aldous presses the "closed circle" and "private language" consequences of his.
  4.  **No Conversion:** The disagreement crystallizes into fundamentally different purposes: art as a bridge for shared feeling vs. art as a mountain for intrinsic formal experience. The social veneer snaps back, leaving the argument unresolved but its contours sharply defined.
  5.  **Hostess's Reaction:** The brief mention of the hostess underscores the argument's disruptive intensity for the desired "quiet evening."
  6.  **Period & Character Nuance:** References to Cézanne, Clive Bell, Tolstoy's essay, and the specific historical context ground the debate. Their language reflects their backgrounds (her earnest intensity, his slightly more flamboyant, Paris-inflected rhetoric).
