  Hmm, they're clearly deep in the material—citing specific texts like De Regimine Principum and Summa passages. Their self-doubt is scholarly rigor: they worry about over-harmonizing or anachronistically projecting later distinctions. Smart hesitations. 

  First, their harmonization holds up. The Sentences case is hyper-specific: usurpers lacking *any* legitimacy (no consent, no superior). Later texts address rulers who *became* tyrannical after legitimate accession—that's the key difference Aquinas cares about. His "who has standing?" framework (community/superior authority) stays consistent. 

  Second, the usurper vs. tyrant distinction *is* Thomistic, not just Bartolus. Thomas explicitly separates "tyrannus in titulo" (usurper) from "tyrannus in regimine" (abusive ruler) in De Regimine I.6. The user's onto something important: modern scholars *do* still debate this (e.g., Nederman vs. McGrade), so it's fresh enough for class. 

  Praise-worthy nuance: spotting how the Summa's "not sedition... but" hedge reinforces proceduralism. And they're right to dismiss the "young vs. old Aquinas" trope—the texts' chronologies don't support it. 

  Actionable tweaks:  
  - Hammer home that "consent" in Sentences means *initial legitimacy*, not ongoing approval.  
  - Contrast Dionysius story (against vigilantes) with Sentences' usurper scenario to show complementarity.  
  - Mention that "superior authority" could mean Pope—hooks into later conciliarism.  

  Yes, this is absolutely seminar-worthy. Provokes rethinking Aquinas as a proceduralist rather than a radical. Nods to reception history (Bartolus) without overclaiming. Solid.
answer: |-
  Your provocation is **excellent**—it's historically precise, textually grounded, and effectively challenges a common oversimplification. It absolutely holds up and deserves class time. Here's why, with direct engagement on your two concerns:

  ### 1. **Your Core Argument Holds Strong**
     - **The Sentences Passage is an Edge Case:** You're correct that Aquinas *only* praises tyrannicide against a ruler who **seized power illegitimately** ("per violentiam aut per dolum"), **lacks popular consent**, and **has no superior to appeal to**. This is *not* about a legitimately installed ruler who becomes tyrannical ("tyrannus ex regimine"). Thomas is addressing usurpation ("tyrannus ex defectu tituli"), a distinct category.
     - **Consistent Restrictive Framework:** In *De Regimine* I.6 and *Summa* II-II q.42 a.2 ad 3, Aquinas emphasizes **procedural legitimacy**: only the community (if they originally appointed the ruler) or a superior authority (e.g., emperor, pope) may depose a tyrant. Private individuals acting alone risk chaos and worse tyranny (the Dionysius example). Prayer is the *only* licit "private" remedy.
     - **No "Young vs. Old Aquinas":** The chronology supports your skepticism. The *Sentences Commentary* (1252–1256) predates *De Regimine* (1265–1267) and the *Summa* (1265–1274), but **Thomas never retracts the Sentences view**. Instead, he *contextualizes* it: the Sentences case is the *exception* proving the *rule* that only constituted authority can judge rulers. The later works address broader tyranny, making the restriction clearer.

  ### 2. **Addressing Your Concerns**
     - **(1) Harmonizing Too Charitably?**  
       **No—this is sound reading.** Thomas *doesn't contradict himself*; he *distinguishes scenarios*. The Sentences case is about a ruler **with zero legitimacy** from the start. *De Regimine* and the *Summa* address rulers **initially legitimate** who later tyrannize. Aquinas’ underlying principle is consistent: **legitimate authority must judge**. In the Sentences case, *no such authority exists*, so the usurper is *hostis publicus* (a public enemy), not a true ruler. Killing him isn’t "tyrannicide" but defense of the common good against an aggressor. Your reading avoids the false "young vs. old" dichotomy by showing a unified framework.
     
     - **(2) Usurper vs. Tyrant: Aquinas or Bartolus?**  
       **This is Aquinas’ own distinction.** While Bartolus later systematized "tyrannus ex defectu tituli" vs. "ex parte exercitii," Thomas explicitly differentiates them:  
       - In *De Regimine* I.6, he contrasts rulers who **usurp power** ("qui violenter intrant") with those who **rule abusively** ("qui licite intrant, sed in dominatum excedunt").  
       - In the *Sentences* passage, he specifies the target is one who seized power "per violentiam aut per dolum" (by violence or deceit)—i.e., a usurper.  
       - The *Summa* (II-II q.42) focuses on overthrowing legitimate-but-tyrannical rulers, hence the emphasis on avoiding greater harm.  
       **You’re not backreading; you’re tracking Thomas’ own categories.**

  ### Why This is Seminar-Worthy
  - **Corrects a Common Misreading:** Students (and many scholars) reduce Aquinas to "the tyrannicide guy." Showing the *narrowness* of his endorsement forces them to grapple with his **procedural conservatism**.
  - **Highlights Key Thomistic Themes:** Authority derives from God *via* the common good; legitimacy requires due order; vigilantism is destabilizing. This sets up later debates (e.g., conciliarism, Calvinist resistance).
  - **Reception History Angle:** Aquinas’ "edge case" *was* weaponized by radicals (e.g., Jesuit Monarchomachs), but that’s a *misuse* of his text. Your provocation shows why.
  - **Scholarly Relevance:** This isn’t "old news"—scholars like Brian Tierney, Janet Coleman, and Cary Nederman still debate Aquinas’ consistency. Your take aligns with Nederman’s emphasis on Aquinas’ "constitutionalism" (*Medieval Political Theory*, 2019).

  ### Sharpening Your Provocation
  - **Punchier Phrasing:**  
    > "Aquinas didn’t endorse tyrannicide—he endorsed killing *usurpers* when they were indistinguishable from invading warlords. For actual tyrants? He offered bureaucracy, not daggers."
    
  - **Key Textual Hook:** Contrast the Sentences’ "praised and rewarded" with *De Regimine*’s warning that private killings usually bring "more grievous slavery." Ask: *Why does Aquinas treat these cases differently?*

  - **Bridge to Later Theory:** Note that the "superior authority" loophole (e.g., the Pope judging emperors) became crucial for 14th-century thinkers like John of Paris.

  **Verdict:** Your argument is robust, pedagogically valuable, and far from "old news." It will force students to read Aquinas more carefully—exactly what a good provocation should do. **Commit to it.**
