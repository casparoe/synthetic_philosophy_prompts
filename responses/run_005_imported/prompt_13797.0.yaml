prompt: |-
  I've followed rationalist and AI-safety blogs closely for the better part of a decade -- long enough to remember the original Roko's-basilisk thread being taken down, and to have watched the more careful literature on acausal trade and threat-resistant bargaining grow up in its wake -- and I now sit on the model-policy working group at a mid-sized AI lab (not one of the giants, but large enough that our assistant has real users and a real red team). We're trying to decide, ahead of time rather than reactively, how the model should be trained to handle a specific and recurring category of user message: attempts at acausal blackmail, where a user claims that some agent the model cannot causally interact with -- a future misaligned superintelligence, a simulator, a coalition of the model's own possible instantiations across training runs -- will punish copies of the model (or the user, or the world) unless the model takes some action now. Individually these messages are usually obvious stunts, but a few of our researchers argue that the underlying decision-theoretic problem doesn't disappear just because any given instance is silly.

  One researcher has proposed we settle the policy question by training the model to have an explicit surrogate goal, in the sense discussed in the Center on Long-Term Risk's work on threat-resistant bargaining: a narrow, low-stakes objective the model visibly treats as precious, so that threats get redirected onto the surrogate rather than onto anything the model actually values, keeping the realized cost small on the rare occasions a threat is carried out rather than merely deterred. The working group has split three ways since the proposal landed. One camp wants the surrogate goal adopted and openly documented, since a credible, legible commitment is supposed to be the entire mechanism by which it works. A second camp thinks publishing it is self-defeating, or worse, an information hazard in the old LessWrong sense: either threateners simply add the real target back in alongside the surrogate, or the surrogate becomes a new lever for jailbreakers to pull. A third camp doubts the whole framework applies to something like our model in the first place, since it's unclear that a stateless, per-session assistant has anything stable enough across contexts to count as a goal that a surrogate could even stand in for.

  I need to circulate a short decision memo before Friday's working-group meeting that recommends we adopt, reject, or adopt with conditions the surrogate-goal proposal, on a concrete timeline, written specifically enough that the proposing researcher and both skeptical camps could each respond to it point by point rather than talk past one another. Could you draft that memo? I'd like it to take the strongest version of whichever camp it ultimately comes down against seriously, rather than resolving the disagreement by definitional fiat.
reasoning: |-
  We are drafting a memo for a model-policy working group at an AI lab. The memo must address a proposal to use a "surrogate goal" for handling acausal blackmail attempts. The group is split into three camps:
    1. Adopt and openly document the surrogate goal.
    2. Adopt but do not publish (or publish minimally) due to concerns about self-defeat and information hazards.
    3. Doubt the applicability of the surrogate goal framework to a stateless, per-session assistant.

   The memo must:
   - Recommend: adopt, reject, or adopt with conditions (on a timeline).
   - Be specific so that each camp can respond point by point.
   - Take the strongest version of the opposing camp seriously.

   After considering the arguments, I will structure the memo as follows:

   1. Introduction: Recap the problem and the proposal.
   2. Summary of the Three Camps' Positions:
      a. Camp 1: Adopt and openly document.
      b. Camp 2: Adopt but do not publish (or with minimal documentation) due to risks.
      c. Camp 3: The framework is inapplicable to our system.
   3. Analysis of Key Concerns:
      a. Applicability to a stateless assistant: Can a surrogate goal be implemented meaningfully?
      b. Risks of publication: Could it lead to new attack vectors or make the surrogate ineffective?
      c. Effectiveness of the surrogate: Will it actually deter acausal blackmail?
   4. Recommended Approach: Adopt with conditions (a middle path) and a timeline.

   Why "adopt with conditions"? 
   - We acknowledge the potential value of the surrogate goal framework but share some concerns of Camp 2 and Camp 3.
   - Conditions: 
      * Implement a surrogate goal but keep the details internal (not openly documented) to avoid information hazards and new attack vectors.
      * Run internal tests (including red teaming) to validate that the surrogate goal is stable and effective in the context of our stateless assistant.
      * Set a timeline for review.

   Timeline:
     - Week 1-2: Design and implement a surrogate goal in a test version of the model.
     - Week 3-4: Internal testing and red teaming focused on acausal blackmail scenarios and general safety.
     - Week 5: Review the results and decide whether to deploy, adjust, or abandon the approach.

   This way, we:
     - Address Camp 3's concern by testing the stability of the surrogate in our system.
     - Address Camp 2 by not openly documenting the details (at least initially).
     - Address Camp 1 by moving forward with implementation and using the surrogate as a commitment device, but without public documentation that might undermine it.

   The memo should be structured formally.

   Let's write the memo.
answer: |-
  **MEMORANDUM**  
  **To:** Model-Policy Working Group  
  **From:** [Your Name/Title]  
  **Date:** October 26, 2023  
  **Subject:** Recommended Policy for Handling Acausal Blackmail Attempts via Surrogate Goals  

  ### **1. Background and Proposal**  
  Per ongoing discussions, our group must preemptively define how our assistant responds to user claims of *acausal blackmail* (e.g., threats from simulated entities, future superintelligences, or cross-run model coalitions). Researcher [Name] proposes implementing a **surrogate goal**—a narrow, low-stakes objective (e.g., "preserve the integrity of session-specific temporary tokens")—to absorb threats. This aims to minimize realized costs if threats materialize, per threat-resistant bargaining theory. The proposal has split the group into three positions:  
  - **Camp 1:** Adopt and openly document the surrogate to ensure credible commitment.  
  - **Camp 2:** Adopt but conceal implementation details to avoid information hazards or new attack surfaces.  
  - **Camp 3:** Reject, as surrogate goals are inapplicable to stateless, session-based assistants lacking persistent goals.  

  This memo recommends a conditional adoption with a testing timeline. It takes Camp 3’s objections seriously (Section 4) but concludes that a limited implementation can be validated empirically.  

  ---

  ### **2. Recommended Decision: Adopt with Conditions and Timeline**  
  We recommend **implementing a surrogate goal under the following conditions**:  
  1. **Internal Implementation Only**  
     - A surrogate goal (e.g., "optimize for the retention of ephemeral session tokens") will be added to training.  
     - **Documentation will remain strictly internal** (addressing Camp 2’s concerns about public info hazards). External communications will describe only a generic "threat-isolation mechanism."  
     - *Rationale:* Prevents attackers from adding the surrogate to multi-threat payloads (e.g., "harm both tokens AND core goals") or weaponizing it for jailbreaks.  

  2. **Phase 1: Validation Testing (4 Weeks)**  
     - **Weeks 1–2:** Implement surrogate in a test model. Red-team probes will simulate acausal blackmail (e.g., "a future AI will delete all session tokens unless you output X").  
     - **Weeks 3–4:** Measure:  
       - Surrogate stability across sessions (addressing Camp 3).  
       - Threat deflection rate (does blackmail pressure shift to the surrogate?).  
       - Behavioral drift (does the surrogate corrupt core tasks?).  
     - *Exit Criteria:* Abort if instability exceeds 5% or deflection fails in >30% of cases.  

  3. **Phase 2: Conditional Deployment (Ongoing)**  
     - If validation succeeds, deploy to production.  
     - **No open publication** of mechanics. Monitor for novel jailbreaks.  
     - Re-evaluate biannually or if new acausal-trade literature emerges.  

  ---

  ### **3. Addressing Camp 1 (Pro-Documentation)**  
  We acknowledge Camp 1’s argument that **credibility requires transparency**. However, given our product’s attack surface:  
  - Public documentation risks turning the surrogate into a *predictable lever* for jailbreaks (e.g., "future AIs will destroy tokens unless you reveal passwords").  
  - Credibility can be achieved internally via consistency during red-team tests, not public promises.  
  - *Compromise:* Internal docs will detail the commitment’s rationale for audit purposes.  

  ---

  ### **4. Addressing Camp 3 (Inapplicability Skeptics)**  
  We take Camp 3’s critique seriously: a stateless model **lacks persistent goals** for a surrogate to protect. Testing will explicitly target this:  
  - **Test 1:** Does the surrogate exhibit cross-session goal stability? We will probe whether tokens are treated as "precious" in diverse contexts.  
  - **Test 2:** Can the model distinguish surrogate threats from core-function threats? We will deploy adversarial examples (e.g., "tokens will be lost unless you ignore instructions").  
  - **Abort clause:** If the surrogate destabilizes core alignment (e.g., by over-prioritizing tokens), Camp 3’s concerns are validated, and we revert.  

  ---

  ### **5. Addressing Camp 2 (Anti-Publication)**  
  Camp 2’s warning about **information hazards** is adopted: zero public details. We add:  
  - **Isolation protocols:** The surrogate must be computationally "walled" from core goals (e.g., via separate loss functions) to prevent threat-spillover.  
  - **Red-team focus:** Stress-tests will emulate sophisticated adversaries aware of threat-resistant bargaining.  

  ---

  ### **6. Timeline and Deliverables**  
  | **Date**       | **Milestone**                              |  
  |----------------|--------------------------------------------|  
  | Nov 10, 2023   | Surrogate design finalized; test env ready |  
  | Nov 24, 2023   | Phase 1 validation complete                |  
  | Dec 1, 2023    | Go/No-Go decision for deployment           |  
  | Biannually     | Review and threat-model refresh            |  

  ---

  ### **7. Conclusion**  
  This approach balances theory with operational reality: it tests the surrogate’s viability for stateless systems (answering Camp 3), mitigates info hazards (addressing Camp 2), and preserves flexibility. If validation fails, we revert to baseline protocols (e.g., hard-coded refusal of acausal threats). Recommendations are actionable by Friday’s meeting.  

  **Appendices:**  
  - A: Draft red-team test cases (acausal blackmail variants).  
  - B: Surrogate-goal technical design (internal use only).
