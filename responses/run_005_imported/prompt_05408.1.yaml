  Still, I should flag risks: if skeptics argue the nutrient effect is just another "thump," they’d miss that the causal-role camp here elevates an *emergent, adaptive* outcome (unlike a useless thump). But that’s the whole point—the theories *disagree* on whether "emergence without history" counts. That’s new terrain.
