prompt: |-
  I never studied math past high school, but I've fallen down a real rabbit hole about infinity lately, mostly from wikipedia and youtube videos at like 1am. The thing that's stuck with me is the continuum hypothesis -- Cantor's idea that there's no set whose size sits strictly between the size of the natural numbers and the size of the real numbers. From what I can piece together, Godel showed back in the 30s/40s that you can't disprove CH using the normal axioms of set theory (ZFC), and then Cohen showed in the 60s that you can't prove it either, using something called forcing that honestly goes way over my head. So together, CH is "independent" of ZFC, meaning neither it nor its opposite can be derived from the axioms.

  Here's where I get stuck though: if theres an actual proof that you can never derive CH or its negation from the accepted axioms of math, doesn't that basically settle it that the continuum hypothesis just doesn't have a real answer? Like asking whether a character in a book is left-handed when the author never said either way -- there's no secret fact your missing, the question just wasn't decided one way or the other. So why do modern set theorists still spend entire careers arguing over whether CH is "probably" true, or hunting for brand new axioms that might settle it? I even brought this up with my cousin who's finishing her math degree and she just said "it's way more complicated than that" and changed the subject, which didn't really clear things up lol. Am I misunderstanding what "independent of ZFC" actually means, or are these people just doing philosophy at that point instead of real math?
