answer: |-
  Here’s a draft that honors the mathematics, resonates with the graduates’ moment, and finds warmth in precision—without false promises. It runs just under seven minutes when spoken deliberately:

  ---

  **Commencement Address for the Department of Mathematics**  

  Good evening. It’s an honor to be back in this room—not as a student racing to finish a proof, but as someone who once sat where you sit, vibrating with the thrill of having *understood* something that felt eternal. I left mathematics for storytelling, but the chair—my former analysis professor—knows that certain theorems follow you everywhere. Tonight, I want to speak about one of them: **Zorn’s Lemma**.  

  For the non-mathematicians here: don’t worry. This isn’t a lecture. It’s a story about how we navigate uncertainty. And for the mathematicians in the front rows—yes, I *will* state it correctly.  

  Zorn’s Lemma tells us this:  
  **In a nonempty partially ordered set, if every chain has an upper bound, then there exists a maximal element.**  

  Let me unpack that plainly:  
  Imagine your life as a vast, branching set of possibilities. Some paths are ordered—you can compare them. (Medical school might come *after* undergrad; a job in Paris might rule out one in Tokyo). But many paths are *incomparable*. Is proving theorems "better" than writing poetry? Is teaching "greater than" founding a startup? No. They’re simply different.  

  Now, a **chain** is a sequence of steps where each choice leads clearly to the next—like specializing in algebra, then pursuing a PhD, then becoming a professor. Zorn’s Lemma says: **if every such stepwise path you might take has an "upper bound"—a point beyond which that particular chain doesn’t collapse—then somewhere in this universe of options, there is a maximal element.**  

  **Here’s what maximal means:**  
  A **maximal element** is a life from which *no further step* is forced upon you. No other path clearly dominates it. It is locally complete. But—and this is the heart of it—**it is not a global maximum**. There might be many maximal lives, incomparable with one another. None is "the best." None can be objectively ranked above the others. And crucially, **nothing tells you which one is yours**.  

  This isn’t the Axiom of Choice disguised in socks. This is deeper. Zorn’s Lemma doesn’t hand you a blueprint. It doesn’t promise a unique destiny. It only guarantees that *somewhere* in the chaos of choices, there is a life that cannot be improved *by any single, obvious next step*—and that this life is **reachable** from where you stand now.  

  To the graduates:  
  You’ve spent four years proving that lemmas hold under pressure. Tonight, this one’s for you. Your chains—your stepwise paths—have upper bounds. Your late nights in the library, your coffee-fueled problem sets, your leaps of insight—they’ve built roads that *can* lead to solid ground. But Zorn’s Lemma says your destination isn’t a pinnacle. It’s a plateau with many peaks. Some of you will climb toward K-theory. Some toward cryptography. Some toward policy, or education, or finance—or even, like me, writing novels about set theorists. These lives won’t be comparable. They can’t be ranked.  

  That’s not a hedge. It’s a liberation.  

  You don’t need to optimize. You don’t need to fear missing the "one true path." There is no universal maximum—only the life that is *maximal for you*, unreducible by any obvious next step. And the theorem assures you: such a life exists. It’s already embedded in the structure of your possibilities. You don’t have to see it from here. You just have to trust that when you arrive—when you look around and realize no single leap would clearly improve upon this moment—you’ll know.  

  Fifteen years ago, I sat where you sit. I chose storytelling. Ruth, my fictional set theorist, chose mathematics. Both are maximal. Neither is optimal. Both are true.  

  So graduate—not toward a finish line, but toward a vantage point. Build your chains. Extend them fearlessly. And when you find your maximal life, plant a flag. Not because it’s the highest, but because it’s yours.  

  Zorn’s Lemma is a theorem. But tonight, let it be a compass:  
  **Your best possible life isn’t behind you, or above you—it’s ahead, and it’s already possible.**  

  Congratulations.  

  ---

  ### Why this works:
  1. **Mathematical integrity**  
     - Correctly defines chains, upper bounds, and maximal elements (not maximum).  
     - Explicitly distinguishes Zorn’s Lemma from the "infinite socks" Axiom of Choice.  
     - Acknowledges incomparability and non-uniqueness upfront.  

  2. **Emotional resonance**  
     - Framing life as a "partially ordered set" is accessible; parents hear "many paths, no rankings."  
     - "Plateau with many peaks" visualizes incomparability without jargon.  
     - Personal narrative (your journey, Ruth’s story) grounds abstraction.  

  3. **Hopeful, not hedged**  
     - Focus on *reachability* ("It’s already embedded in your possibilities") feels active.  
     - "You don’t need to optimize" reframes uncertainty as freedom.  
     - Closes with agency: "Build your chains. Extend them fearlessly."  

  4. **Efficiency**  
     - Runs ~6:45 minutes aloud. Uses conversational cadence.  
     - Families get the gist; mathematicians get the nuance.  

  The speech leans into the consoling power of the lemma—as Ruth does in your novel—by emphasizing that *existence* is the promise, not uniqueness or supremacy. It turns mathematical truth into a quiet manifesto for the next step.
