  We are interviewing a "realist" who uses the line "a feature is real if it earns its keep". We want to challenge this by asking questions that make it harder to just restate the pitch. The questions should target:
  1. Why this particular sparse decomposition is the "real" one and not another equally valid one?
  2. The gap between decodability and causal use (with the Othello-GPT example).
  3. Superposition and polysemanticity.
  4. What result would make her stop calling these features real.

  We'll draft 8-9 questions, including at least one on each of these points. Each question will have a follow-up that anticipates her likely answer and pushes further.

  Let's plan:

  Question 1: On the uniqueness of the decomposition.
  Question 2: On the gap between decodability and causal role (Othello-GPT).
  Question 3: On superposition and polysemanticity.
  Question 4: On what evidence would falsify the reality of features.

  Then we'll add 4-5 more questions to round out the interview and challenge the "earns its keep" criterion from different angles.

  We'll structure each as:
  - Main question
  - Likely answer (based on her stance)
  - Follow-up question

  Let's draft:

  1. **Main Question**: You often say a feature is real if it "earns its keep". But in the literature, we know that for any given set of activations, there are infinitely many ways to decompose them into sparse features. Why should we consider the features found by our specific method as the "real" ones, rather than just one of many equally sparse and predictive decompositions?
     - **Likely Answer**: Our method finds features that are not only sparse and predictive but also align with human-interpretable concepts and are used in multiple contexts (i.e., they are robust).
     - **Follow-up**: If robustness and human interpretability are the criteria, then what do we say about the Othello-GPT case? There, the board state was only linearly decodable after a change of basis. Does that mean the features weren't real until we found the right basis? And if so, how does that square with the idea that features are real because they "earn their keep" in the original basis?

  2. **Main Question**: In the Othello-GPT study, the internal board state representation was only linearly decodable after a change of basis. This suggests that the model might be using a distributed representation that isn't aligned with our human concepts until we rotate it. How do you reconcile this with the idea that the features we extract are "real" in the model's original basis?
     - **Likely Answer**: The features in the model are real and causally effective, but they might be in a rotated basis. Our SAE might be learning a rotation that makes them more interpretable, but the causal structure is still there.
     - **Follow-up**: If the causal structure is there but in a rotated basis, then what is the relationship between the features we extract and the actual computational mechanisms? Are we just giving a more interpretable name to a linear combination of the model's native features? And if so, does that mean our features are not the fundamental building blocks but rather a convenient reframing?

  3. **Main Question**: Superposition and polysemanticity are well-documented phenomena in neural networks. A single neuron can represent multiple unrelated concepts, and conversely, a single concept can be distributed across many neurons. Given that, how can we be sure that the features we're extracting aren't just a byproduct of this superposition and not the actual units of computation?
     - **Likely Answer**: The SAE is designed to disentangle superposition. The features we get are the directions that are used by the model to represent distinct concepts, even if they are superposed in the neuron activations.
     - **Follow-up**: But if the SAE is disentangling superposition by finding a basis that splits these superposed representations, how do we know that the model itself isn't using the superposed directions as the fundamental units? In other words, maybe the model computes using the superposed directions and our SAE features are just a decomposition that doesn't align with the causal structure?

  4. **Main Question**: You've said that a feature is real if it "earns its keep". Could you define what that means in a more operational way? For instance, what specific criteria must a feature meet to "earn its keep"?
     - **Likely Answer**: A feature earns its keep if it is used in multiple contexts, if ablating it causes a measurable and consistent drop in performance on relevant tasks, and if it can be used to predict model behavior.
     - **Follow-up**: Let's take ablation. If we ablate a feature and see a performance drop, that suggests it's important. But what if the feature is part of a redundant system? The model might have multiple features that can compensate for each other. Wouldn't that mean that even if a feature doesn't cause a drop when ablated (because of redundancy), it's still real? Or conversely, if we see a drop, how do we know it's not because we've damaged a distributed representation that doesn't correspond to a single feature?

  5. **Main Question**: There's a distinction between a feature being decodable (i.e., we can read it out) and it being causally used by the model. How do we know that the features we've found are actually used by the model in its computations and not just epiphenomenal?
     - **Likely Answer**: We can test causal involvement by intervention. If we can change the model's output by manipulating the feature, then it's causally involved.
     - **Follow-up**: But in the case of distributed representations, if we manipulate one feature, we might be inadvertently affecting others because of the basis change. How do we control for that? And in the Othello example, the board state was distributed and only linearly decodable in a different basis. If we had manipulated the features in the original basis, we might not have seen a change because the representation wasn't aligned. So how do we ensure our interventions are clean?

  6. **Main Question**: Some argue that the features we extract are more reflective of the dataset and the probe we use than the model's intrinsic structure. How do we rule out that we're just imposing our own interpretative framework?
     - **Likely Answer**: We use automated methods and don't rely on human labeling for the features. We look for features that are consistently activated across many examples and that have a clear connection to model behavior.
     - **Follow-up**: But the SAE is trained to reconstruct the activations. That reconstruction is done in a way that minimizes loss and encourages sparsity. How do we know that the features aren't just a compressed version of the activations that doesn't correspond to the model's internal state, but rather is a useful approximation for us?

  7. **Main Question**: What kind of evidence would convince you that a feature we've found is not real? In other words, what would falsify the claim that a particular feature is real?
     - **Likely Answer**: If we found that the feature was not robust (i.e., it didn't activate consistently in similar contexts) or if we could show that it wasn't causally involved in the model's computation (e.g., by ablating it without affecting performance, or by showing that the model doesn't use it in downstream layers).
     - **Follow-up**: Let's consider the robustness criterion. What if we found that the same feature (by our definition) appears in multiple models trained on similar data? Would that make it more real? And conversely, if a feature is only present in one model, does that make it less real? Also, for causal involvement: what if we found a feature that was causally involved but only in a very specific context? Would that still count?

  8. **Main Question**: If we discovered a different sparse autoencoder that had the same sparsity and reconstruction loss but with a completely different set of features that were also interpretable, would that challenge the reality of our current set? Why or why not?
     - **Likely Answer**: It might challenge the uniqueness, but not the reality. Both sets could be real in the sense that they are valid decompositions that the model could be using. The model might use one or the other, or even a combination.
     - **Follow-up**: If the model could be using either decomposition, then how do we know which one is actually implemented? And if we can't tell, does that mean that the concept of a "real feature" is underdetermined by the data? How does that affect the claim that we've found the model's actual internal structure?

  9. **Main Question**: Finally, what result or discovery in the field of interpretability would make you reconsider your stance and stop calling these features "real"?
     - **Likely Answer**: If we found that the features we extracted were not consistent across different training runs or architectures, or if we found that they were not causally involved in the model's computations despite passing our current tests.
     - **Follow-up**: What if we found that the features were causally involved but in a way that was highly context-dependent and didn't align with any human-understandable concept? Would that challenge the idea that we've found the model's "organelles", or just that they are not interpretable? And if the latter, does that mean that reality is separate from interpretability?

