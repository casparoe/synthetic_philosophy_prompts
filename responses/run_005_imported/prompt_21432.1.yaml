prompt: |-
  I started on my company's interpretability team about two months ago and it's already caused a small war in our Slack -- half the team talks about the "features" our sparse autoencoders pull out of the model like we've discovered actual organelles inside it, and the other half thinks thats basically astrology done with linear algebra. For the internal podcast thing a coworker and I run, we've got one of the loudest realists on the team coming on next week, and her go-to move whenever anyone pushes back is always some version of "a feature is real if it earns its keep" -- which somehow ends every argument without answering it. Can you draft 8 or 9 interview questions that make that line harder to use each time, instead of just letting her restate the pitch? I want at least one on why this particular sparse decomposition of the activations should count as the real one and not some other, equally sparse, equally predictive decomposition; one on the gap between a direction being decodable and it actually being used causally downstream (theres that Othello-GPT case, where -- if I'm remembering right -- the board representation only came out linear once someone changed the basis, which feels relevant); one on superposition and polysemanticity more generally; and a last one that pins down what result would actually get her to stop calling these things real. Add a follow-up to each, keyed to whatever answer she's most likely to give.
