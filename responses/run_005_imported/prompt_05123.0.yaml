  ## Ethics Committee Recommendation: Allocation of $3M Bequest for Hospice Care

  **To:** Hospice Board of Directors  
  **From:** Ethics Advisory Committee  
  **Date:** October 26, 2023  
  **Subject:** Allocation Recommendation for $3M Unrestricted Bequest – Reconciling Values of Aesthetic/Relational Goods and Pain Relief  

  ### I. Introduction
  The Ethics Committee acknowledges the profound opportunity presented by this generous bequest and the core values underlying the competing proposals. We recognize this is fundamentally a *philosophical* dispute about the nature of "good" in end-of-life care, crystallized by the Medical Director's apt invocation of G.E. Moore's dilemma: Does investing in beauty and companionship hold intrinsic value for patients who may be unable to consciously perceive it, compared to the tangible relief of suffering through enhanced clinical care? Our recommendation seeks a principled balance, grounded in hospice philosophy and a nuanced reading of ethical value.

  ### II. Engaging the Medical Director's Philosophical Objection
  The Medical Director raises a critical and valid point rooted in Moore's *Principia Ethica* (Ch. VI). Moore argues intrinsic good resides *only* in conscious states – specifically, the *apprehension* of beauty and the *experience* of personal affection. A beautiful, unperceived world holds no more intrinsic value than an ugly one. Applied strictly here, resources spent on gardens, art, or companionship for non-conscious patients would be wasted, while enhanced pain control directly alleviates conscious suffering, creating positive conscious states (relief, comfort).

  **Our nuanced response incorporates broader ethical considerations:**

  1.  **Beyond Strict Moorean Consciousness:** Hospice care serves *persons*, not merely conscious states at a single moment. Personhood persists even amidst diminished consciousness or dementia. Investments in beauty and companionship affirm dignity and worth *inherent* to the person, not contingent on their current cognitive capacity. This reflects a Kantian/deontological view of respecting persons as ends-in-themselves.
  2.  **The Relational and Communal Context:** The "good" in hospice extends beyond the isolated patient consciousness. As Moore acknowledges, personal affection is a supreme good. The "No One Dies Alone" program provides profound value *to the volunteers* (experiencing compassion) and *to the community/families* (knowing their loved one was accompanied). The garden and art program create a healing environment for *visiting families* and *staff*, reducing burnout and fostering compassionate care – indirectly benefiting *all* patients. This creates a network of conscious goods Moore would endorse.
  3.  **Potential for Apprehension & Comfort:** Many patients experience fluctuating consciousness. A beautiful environment or gentle music may be apprehended during lucid intervals or provide subliminal comfort even when cognition is impaired. Dementia patients often retain emotional responsiveness to art, music, and touch long after cognitive decline. Denying these based on *potential* non-perception risks premature ethical closure.
  4.  **Symbolic Value and the "Witness" Role:** Providing beauty and companionship, even for the unresponsive, serves a symbolic function. It testifies that *this life matters*, that death occurs within a context of care and beauty, not just physiological management. This upholds the hospice's core mission and provides solace to society.
  5.  **The Risk of Reductionism:** Prioritizing *only* measurable pain relief risks reducing hospice care to a purely technical, physiological endeavor, neglecting its holistic mission encompassing emotional, spiritual, and existential comfort. The Medical Director's concern is vital, but it cannot be the *sole* determinant without betraying hospice philosophy.

  ### III. Recommended Allocation: A Balanced, Values-Based Approach ($3,000,000 Total)
  We propose an allocation recognizing the irreducible importance of *both* relieving suffering *and* cultivating an environment affirming dignity, relationship, and beauty:

  1.  **Enhanced Clinical Capacity & Pain Control (40% - $1,200,000):**
      *   $900,000: Endowment for 1.0 FTE Additional Palliative Care Physician (prioritizing complex pain/symptom management).
      *   $300,000: Upgraded pain management technology/training (e.g., advanced pumps, dedicated pharmacist consultation, staff training in cutting-edge protocols). *This directly addresses the Medical Director's core concern and the fundamental duty to alleviate suffering.*

  2.  **Beauty, Companionship & Holistic Environment (45% - $1,350,000):**
      *   $500,000: Garden Redesign & Perpetual Maintenance Fund (creating accessible, sensory-rich spaces).
      *   $400,000: Endowment for Rotating Art & Music Program (curated for hospice setting, including dedicated music-thanatology).
      *   $450,000: Endowment for Expanded "No One Dies Alone" Program (training, coordination, volunteer support, modest participant stipends). *This honors the intrinsic value of relationship, beauty, and holistic care for patients, families, staff, and the community, recognizing the broader network of conscious goods.*

  3.  **Evaluation & Adaptation Fund (15% - $450,000):**
      *   Dedicated funding to rigorously evaluate the impact of *all* new initiatives (clinical and aesthetic/relational) on:
          *   Patient-reported outcomes (pain, anxiety, comfort) *when possible*.
          *   Family satisfaction and perceived quality of care.
          *   Staff morale, burnout, and sense of purpose.
          *   Utilization patterns of new services.
      *   Includes resources for patient/family/staff surveys, focused interviews (especially with families of non-communicative patients), and potential collaboration with the medical school for ethical/outcomes research. *This fund explicitly addresses the Medical Director's concern by committing to evidence-based assessment of whether these initiatives create tangible value, including for less responsive patients.*

  ### IV. Timeline for Revisiting Allocation
  *   **18-Month Review:** A formal review of initial implementation, utilization data, and preliminary evaluation findings will be conducted by the Ethics Committee in consultation with clinical leadership.
  *   **36-Month Comprehensive Review:** A full assessment based on at least 24 months of operational data and the findings from the dedicated evaluation fund. This review will specifically examine:
      *   Impact on pain/symptom control metrics.
      *   Demonstrated value (via evaluation) of beauty/companionship programs for patients across cognitive states, families, and staff.
      *   Financial sustainability of endowed positions/programs.
      *   **Outcome:** This review will determine if a reallocation of *future* income from the endowments (not the principal) is warranted based on evidence of impact and evolving needs.

  ### V. Conclusion
  The Medical Director rightly compels us to ensure resources create conscious goods, particularly the paramount good of relieving suffering. However, hospice philosophy demands we define "good" more expansively, encompassing the dignity of the person, the web of relationships, the solace of beauty, and the creation of a space where death is met with profound respect. Our recommended allocation invests significantly in both the essential clinical mandate of pain relief *and* the relational/aesthetic values central to holistic hospice care, while explicitly committing resources to evaluate – and be guided by – evidence of their tangible impact, especially regarding the core philosophical concern raised. This balance best honors the spirit of the bequest and the multifaceted mission of our hospice.

  **Respectfully submitted,**  
  The Ethics Advisory Committee  
  [Medical School/Hospice Name]
