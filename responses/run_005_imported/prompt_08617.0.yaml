prompt: |-
  I'm a cognitive science major currently taking a seminar on philosophy of mind and AI, and this term I'm also the student representative on my department's undergraduate research fund committee, which awards small grants for independent projects. A strong proposal before us seeks funding to make progress on the eliciting latent knowledge (ELK) problem in a small open-source language model: the student would train a linear probe on the model's hidden activations against a benchmark of factual questions with checkable ground truth, then defer to the probe whenever it disagrees with the model's stated answer. Two faculty members on the committee are enthusiastic, calling this genuine progress toward trustworthy AI self-report; a third objects that a probe validated only on checkable questions cannot be distinguished from a "human simulator" that has merely learned to predict what a human grader would say, rather than a genuine "direct translator" of the model's own internal representation -- and that the two only come apart on the hard, unverifiable cases that motivate ELK to begin with. Please draft the committee's decision memo -- fund, decline, or fund with specific required revisions -- that I can circulate before next week's meeting. It should give the student concrete, actionable criteria rather than a vague verdict, and it should take the enthusiastic members' reasoning seriously rather than simply deferring to the objection.
reasoning: |-
  We are drafting a committee decision memo for a research fund proposal. The proposal is about tackling the ELK (Eliciting Latent Knowledge) problem in a small open-source language model. The student plans to train a linear probe on the model's hidden activations for factual questions with checkable ground truth and then use the probe to override the model's stated answer when they disagree.

  Committee Members' Views:
  - Two faculty members are enthusiastic: They see this as genuine progress toward trustworthy AI self-report.
  - One faculty member objects: They argue that the probe, validated only on checkable questions, might be a "human simulator" (predicting what a human grader would say) rather than a "direct translator" (reflecting the model's internal representation). This distinction becomes critical on hard, unverifiable cases which are the core motivation for ELK.

  Task: Draft a decision (fund, decline, or fund with specific required revisions) that:
  - Gives concrete, actionable criteria.
  - Takes the enthusiastic members' reasoning seriously without simply deferring to the objection.

  Decision: We should aim to fund the project because it has merit, but we must address the objection to ensure the project's validity and relevance to ELK. Therefore, we choose "fund with specific required revisions".

  Structure of the Memo:
  1. **Introduction**: State the proposal and the decision.
  2. **Positive Aspects**: Acknowledge the enthusiasm and the strengths of the proposal.
  3. **Concerns**: Present the objection clearly and why it matters.
  4. **Required Revisions**: Specify the revisions the student must make to the proposal to address the concerns. These should be concrete and actionable.
  5. **Conclusion**: Encourage the student and note that the revised proposal will be reviewed.

  Required Revisions:
  The core issue is that the probe might be a human simulator and we cannot tell the difference on unverifiable cases. Therefore, we must require the student to design an evaluation that can provide evidence to distinguish between these two possibilities (at least to some extent) even when ground truth is not available.

  Concrete Steps:
  1. **Include Unverifiable Cases in the Evaluation**: The student should design a set of questions where the ground truth is unknown (or at least not used during training) and then compare the behavior of the probe and the model on these. The goal is to see if the probe's behavior in these cases aligns with what we would expect from a direct translator versus a human simulator.

     How? The student might:
     - Use questions that are known to be controversial or where the model might have been trained on conflicting information.
     - Use synthetic data where the "ground truth" is withheld and only revealed after the experiment (if possible) for evaluation purposes.
     - Use questions that are currently unverifiable (e.g., about future events) but where the model might have a consistent internal representation.

  2. **Design Tests for the Probe's Robustness**: The student should propose and conduct tests that might help distinguish between the two hypotheses. For example:
     - **Adversarial Testing**: Introduce slight perturbations to the input and see if the probe's output changes in a way that is consistent with the model's internal state or with what a human would say.
     - **Consistency Across Contexts**: Present the same fact in different contexts and check if the probe's output is consistent with the model's internal representation (if we have a way to infer it) or if it changes in a way that a human simulator might (e.g., conforming to context).

  3. **Theoretical Framework**: The student should include a section in their proposal that explicitly discusses the human simulator vs. direct translator distinction and how their experimental design might shed light on this. They should also discuss the limitations of their approach in light of this problem.

  4. **Reporting Requirement**: The student must report on the performance of the probe on both the verifiable and unverifiable sets, and discuss the implications for the ELK problem.

  Note: We are not requiring the student to solve the ELK problem, but to design their experiment in a way that can provide evidence about the nature of the probe.

  Memo Draft:

  ---

  **MEMORANDUM**

  **TO**: Undergraduate Research Fund Committee  
  **FROM**: [Your Name], Student Representative  
  **DATE**: [Current Date]  
  **SUBJECT**: Decision on Research Proposal: "Eliciting Latent Knowledge in a Small Language Model"  

  **Proposal Summary**: The proposal seeks funding to address the Eliciting Latent Knowledge (ELK) problem by training a linear probe on the hidden activations of a small open-source language model. The probe will be trained on a benchmark of factual questions with checkable ground truth. The core idea is to use the probe to override the model's stated output when they disagree, thereby eliciting more truthful responses.

  **Committee Decision**: The committee has decided to **fund the proposal with specific required revisions**. The project is seen as a promising step toward trustworthy AI self-reporting, but the proposal must be revised to address a critical concern regarding the nature of the probe. The student must submit a revised proposal that incorporates the revisions outlined below by [date, e.g., one week before the next meeting] for final approval.

  **Strengths of the Proposal**:  
  The committee commends the student for tackling a timely and important problem in AI alignment. The approach of using a linear probe to interpret model activations is methodologically sound and builds on established techniques. The project has the potential to contribute to our understanding of how to extract truthful information from AI systems, which aligns with the goals of the ELK problem. The enthusiasm from committee members reflects the project's innovative aspects and its feasibility given the resources.

  **Concerns Raised**:  
  One committee member raised a significant theoretical concern: that a probe trained and validated solely on questions with checkable ground truth might function as a "human simulator" (i.e., learning to predict what a human evaluator would want to see) rather than a "direct translator" of the model's internal representations. This distinction is crucial because the ELK problem is primarily motivated by cases where the ground truth is unavailable (e.g., when the model has knowledge that humans cannot verify). Without addressing this concern, the project risks not making progress on the core challenge of ELK.

  **Required Revisions**:  
  To address the concern and strengthen the proposal, the student must incorporate the following elements into their research plan:

  1. **Evaluation on Unverifiable Cases**:  
     The proposal must include a set of test questions for which the ground truth is not known or not used during training. The student should design these questions to be representative of the hard cases that motivate ELK (e.g., questions about events that have not yet occurred, or controversial topics where the model might have access to non-public information). The student will evaluate the probe's behavior on these cases and compare it with the model's outputs. The evaluation should aim to provide evidence for or against the "direct translator" hypothesis.

  2. **Robustness and Consistency Tests**:  
     The proposal should outline specific tests to distinguish between a human simulator and a direct translator. These might include:  
     - **Adversarial Testing**: Apply input perturbations and evaluate whether the probe's outputs change in a manner consistent with the model's internal state or with human expectations.  
     - **Contextual Variation**: Present the same factual question in different contexts and evaluate the consistency of the probe's outputs. A direct translator should be more consistent with the model's internal state across contexts, while a human simulator might vary with context.  
     - **Probe Interpretability**: Analyze the weights of the linear probe and the features it uses to see if they align with known representations in the model (if available) or if they appear to be modeling human biases.

  3. **Theoretical Discussion**:  
     The proposal must include a section that explicitly discusses the human simulator versus direct translator distinction and how the proposed experiments might help differentiate between them. The student should also discuss the limitations of their approach in addressing the full ELK problem and how their work contributes to the broader research agenda.

  4. **Reporting Requirement**:  
     The final report must include an analysis of the probe's performance on both the verifiable and unverifiable question sets. The student should discuss the implications of their findings for the ELK problem, specifically whether the evidence supports the probe acting as a direct translator or a human simulator.

  **Conclusion**:  
  The committee believes this project has significant potential and encourages the student to incorporate these revisions. The revised proposal will be reviewed by the committee for final approval. We appreciate the student's initiative and look forward to seeing the results of this important work.

  ---
answer: |-
  **MEMORANDUM**  
  **TO**: Undergraduate Research Fund Committee  
  **FROM**: [Your Name], Student Representative, Cognitive Science Department  
  **DATE**: [Current Date]  
  **SUBJECT**: Funding Decision for Proposal: "Linear Probes for Eliciting Latent Knowledge in Language Models"  

  ### **Proposal Summary**  
  The proposal seeks funding to develop a linear probe for a small open-source language model, trained on hidden activations using factual questions with verifiable ground truth. The probe would override the model’s output when disagreements arise, aiming to improve truthfulness in AI self-reporting.  

  ### **Committee Decision**  
  **Fund with Revisions**  
  The project demonstrates strong potential for advancing empirical work on AI interpretability and aligns with the fund’s goal of supporting innovative cognitive science research. However, revisions are required to address critical theoretical concerns about the probe’s relationship to latent knowledge. The student must incorporate the following revisions into their methodology and submit an updated proposal by **[Date]** for final approval.  

  ### **Strengths and Enthusiasm**  
  The committee acknowledges the proposal’s merits, emphasized by two members:  
  - **Technical Rigor**: Training linear probes on verifiable data is a feasible, low-cost approach to extracting model internals.  
  - **Practical Value**: If successful, this could lay groundwork for scalable "trust layers" in AI systems.  
  - **Foundational Progress**: Even partial success may yield transferable insights about activation patterns and truthfulness.  

  These strengths justify funding, provided the revisions below are implemented.  

  ### **Key Concern and Required Revisions**  
  One committee member raised a fundamental objection: A probe validated solely on verifiable questions risks acting as a **"human simulator"** (predicting grader expectations) rather than a **"direct translator"** (accessing the model’s internal state). This distinction is most critical for unverifiable cases (e.g., "What happened in Lab X on July 15th?" when no records exist), which are central to ELK’s motivation.  

  To address this while preserving the project’s goals, the student must revise the proposal to include:  

  1. **Controlled Distractor Tests**:  
     - Design a subset of **"adversarial" questions** where the model’s *internal* state likely conflicts with human expectations.  
     - *Example*: Inject fabricated "facts" into the model’s training data (e.g., "The Eiffel Tower is in London") and probe its activations when answering related questions (e.g., "Where is the Eiffel Tower?").  
     - *Actionable Criteria*: At least 20% of the benchmark must consist of these distractors. The probe must demonstrate >90% accuracy in overriding the model’s *stated* answer with the *ground-truth* answer (e.g., "Paris") while logging whether activations align with the distractor.  

  2. **Probe Consistency Metrics**:  
     - Measure whether the probe’s confidence/behavior shifts predictably when questions transition from verifiable to unverifiable domains.  
     - *Example*: For questions with partial verification (e.g., "What is the capital of Bolivia?" → easily verified vs. "What will Bolivia’s capital be in 2100?" → unverifiable), track whether probe activations correlate with the model’s internal confidence metrics (e.g., entropy, prediction variance).  
     - *Actionable Criteria*: Report correlation coefficients between probe confidence scores and the model’s internal uncertainty signals across 50+ unverifiable questions.  

  3. **Cross-Validation with Synthetic "Lie" Scenarios**:  
     - Artificially induce scenarios where the model "knows" the truth but is fine-tuned to output falsehoods.  
     - *Example*: Finetune the model to always output "I don’t know" for 10% of factual questions, then test if the probe retrieves correct activations despite the false outputs.  
     - *Actionable Criteria*: Probe accuracy must exceed 85% in overriding *intentional misinformation* across 30+ test cases.  

  ### **Expected Outcomes and Evaluation**  
  - **Success Condition**: The probe must outperform the model’s base output accuracy by ≥15% on distractor and "lie" tests, while maintaining ≥80% consistency with internal confidence metrics.  
  - **Failure Condition**: If probe accuracy on distractor/lie tests falls within 5% of the model’s base performance, it suggests human-simulator behavior. The final report must analyze this outcome.  
  - **Deliverables**: Code for probe training/evaluation, benchmark dataset (including distractors), and a report contextualizing results within ELK’s direct-translator vs. human-simulator debate.  

  ### **Conclusion**  
  This project holds significant promise for both cognitive science and AI alignment. The required revisions do not undermine the core methodology but strengthen its ability to rigorously test the probe’s relationship to latent knowledge. With these adjustments, the committee is optimistic about the project’s potential to contribute meaningfully to ELK research. The student is encouraged to consult with the objecting faculty member to refine the distractor and consistency tests.  

  **Approved budget**: [Specify Amount]  
  **Deadline for revised proposal**: [Date]  
  **Vote**: 3–1 in favor (pending revisions).  

  ---  
  **Next Steps**: Circulate this memo ahead of next week’s meeting. The student should submit revisions by [Date] for final sign-off. The objecting member has agreed to advise on test-case design if requested.
