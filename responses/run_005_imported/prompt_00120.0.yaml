answer: |-
  Your dilemma perfectly captures the tension between ecological continuity and human categorical necessity—a problem both scientifically rich and philosophically profound. Here’s a structured approach to address it, blending practical governance with conceptual clarity:

  ### 1. **Acknowledge the Philosophical Ground Truth**  
     Yes, the cutoff *is* arbitrary in the strict sense. As your hypothetical forest sequence shows, "old-growth" is a **vague predicate** (like "bald" or "heap"). No single year marks a qualitative leap, yet the category remains ecologically meaningful. This is a classic **Sorites paradox**. Your philosophy professor would rightly argue that *any* precise boundary imposed on a continuum is stipulative—but that doesn’t render it useless. Rather, it’s a **necessary tool for decision-making**.

  ### 2. **Defend the Cutoff Principledly**  
     While nature has no joints here, your cutoff isn’t capricious. Justify it as a **regulatory bright line** grounded in **correlated ecological thresholds**:
     - **Scientific Heuristics**: The 150-year mark likely aligns with *clusters* of attributes (canopy complexity, decay processes, species assemblages). Emphasize that this number proxies for *structural maturity*—e.g., a forest at 150 years typically hosts late-successional processes absent at 100 years.
     - **Error-Aware Flexibility**: Argue that 148.7 years ± coring error (e.g., ±5–10 years) comfortably overlaps with 150. Rejecting this parcel over 1.3 years ignores measurement limitations, violating scientific pragmatism.
     - **Precedent & Consistency**: Cite studies (e.g., USDA Forest Service guidelines) using similar age thresholds. Consistency across jurisdictions reduces arbitrariness.

  ### 3. **Reframe the Category’s Purpose**  
     Shift the board’s focus from "What *is* old-growth?" to **"What do we *protect* with this designation?"**  
     - **Functional Goals**: Old-growth designations serve concrete ends: biodiversity corridors, carbon reservoirs, resilience anchors. Does this parcel advance those goals? If its canopy gaps, debris volume, and species data align with old-growth *function* (despite the 1.3-year deficit), the label is valid.
     - **Risk of Inaction**: Stress that denying protection over 1.3 years risks losing a near-threshold forest to logging/development—a greater ecological loss than any philosophical purity.

  ### 4. **Practical Solutions for the Board Deadlock**  
     - **Adopt a "Margin of Error" Clause**: Amend your criteria to accept forests within 5 years below the age cutoff *if* they exceed thresholds for ≥2 other indicators (e.g., canopy gaps, debris volume).  
     - **Tiered Designations**: Create a "Transitional Old-Growth" category for parcels at 90–100% of thresholds, with provisional protections. This acknowledges continuity while reserving "full" status for unambiguous cases.  
     - **Independent Review**: Commission a rapid ecological assessment (e.g., soil microbiota, lichen diversity) to break the tie. If this parcel hosts old-growth indicator species, its age becomes less critical.

  ### 5. **For Your Peace of Mind: A New Metaphor**  
     Replace the "carving nature at its joints" analogy with **"navigating a foggy coastline."**  
     - The coastline (ecological continuum) exists, but fog (measurement limits, vagueness) obscures where land meets sea. We drop anchors (cutoffs) not where we *see* a boundary, but where charts suggest the water is shallow enough to risk running aground. The anchor point is conventional—but chosen using sound hydrographic data.  
     - Similarly, your 150-year anchor is based on ecological "charts" (decades of research showing sharp increases in biodiversity/complexity around this age). It’s not *in* the territory, but it reliably keeps you off the rocks of ecological loss.

  ### Key Message for the Board  
  > *"Our cutoff isn’t a discovery of nature’s dividing line—it’s a commitment to protect forests that cross a threshold of ecological significance. Denying this parcel over 1.3 years elevates numerical dogma over forest function. If our criteria can’t accommodate uncertainty margins, they fail as scientific tools."*

  This approach honors both the real continuity of forests and the need for decisive conservation action. Your unease with arbitrariness is a strength—it pushes the board toward nuanced, functionally grounded decisions. As Aldo Leopold (a forester-philosopher) might urge: "A thing is right when it tends to preserve the integrity, stability, and beauty of the biotic community." The spirit of the category matters more than its letter.
