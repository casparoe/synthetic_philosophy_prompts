  However, in Sartre, the woman's bad faith is slightly different. The waiter is over-identifying with his role (facticity), while the woman is denying her transcendence by reducing herself to an object (facticity) to avoid making a choice about the man's advances. But note that the response says she does "exactly the same thing" and that she "turns herself into a passive object in exactly the same way the waiter turns himself into a thing." This is an oversimplification.

