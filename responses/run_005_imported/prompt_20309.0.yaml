  First, I need to recall Good's theorem. It states that for a rational Bayesian agent, the expected value of information is non-negative. The proof uses Jensen's inequality, showing that acting after seeing evidence is better than committing beforehand. But the user mentioned cases like Huntington's testing or insurance markets where information can be harmful. How do these fit?

  The key points from the theorem are: free information, Bayesian updating, and optimal actions. If any of these aren't met, the theorem might not apply. For example, in Huntington's testing, the cost isn't monetary but emotional. The information isn't free because it affects utility directly through psychological impact. Also, if the person can't act on the information, like with incurable diseases, then the action step is void. That explains why avoidance here isn't irrational.

  Spoiler avoidance is another case. The user might avoid spoilers because knowing reduces enjoyment, which is a direct utility cost. Here, the information changes the experience itself, not just informing action. The theorem assumes that utility comes from actions, not the information state. So if the state of not knowing has intrinsic value, Good's theorem doesn't cover that.

  Insurance markets collapse when information becomes public because it removes risk pooling. The theorem assumes private actions, but in markets, strategic interactions matter. If one party's information affects others' actions, that's not covered. So the theorem's individual focus doesn't apply to collective outcomes.

  The user needs a verdict. The theorem is mathematically sound but has strict assumptions. Real-world cases often violate these—psychological costs, no actionable outcomes, intrinsic value of ignorance, or strategic dynamics. So avoidance in those contexts isn't irrational; it's rational given broader utilities. The journalist can say the theorem is airtight in its context, but not relevant to many avoidance scenarios. The takeaway is that humans aren't irrational; their utilities and constraints differ from the model's.
answer: |-
  ## Good's Theorem & The Rationality of Ignorance: Cutting Through the Fog

  Your decision theorist friend is right to point you to I.J. Good's 1967 theorem – it *is* the foundational theoretical result on the value of information for a rational agent. But its power comes with precise boundaries, boundaries often blurred in the "information avoidance" literature. Let's dissect the theorem, see why it holds, and then confront those real-world cases head-on to deliver a verdict.

  **The Guts of Good's Theorem: Why Free Evidence *Should* Be Welcome**

  Imagine a rational Bayesian agent facing a decision. The outcome depends on:
  1.  **The State of the World (θ):** Something uncertain (e.g., *Do I have the Huntington's mutation?*, *Will the stock market go up?*).
  2.  **The Agent's Action (a):** What they choose to do (e.g., *Start saving aggressively for future care*, *Invest in stocks or bonds*).
  3.  **A Utility Function (U(a, θ)):** Quantifying the desirability of outcomes (e.g., *High utility if I save appropriately for my actual future needs, low utility if I'm financially ruined*).

  Before seeing any new evidence, the agent has prior beliefs about θ (P(θ)). Their best initial action is the one maximizing *expected* utility based on these priors: **a\*** = argmax<sub>a</sub> 𝔼<sub>θ</sub>[U(a, θ)].

  Now, suppose the agent can observe some free **Evidence (E)** related to θ (e.g., a genetic test result, a market forecast). Good's Theorem states that the **Expected Value of Information (EVOI)** is non-negative:

  **EVOI = 𝔼<sub>E</sub>[ max<sub>a</sub> 𝔼<sub>θ|E</sub>[U(a, θ)] ] - max<sub>a</sub> 𝔼<sub>θ</sub>[U(a, θ)] ≥ 0**

  **Why is EVOI ≥ 0? The Jensen's Inequality Trick:**

  1.  **The First Term (𝔼<sub>E</sub>[ max<sub>a</sub> 𝔼<sub>θ|E</sub>[U(a, θ)] ]):** This is the agent's *expected optimal utility **after*** seeing E. For *each possible piece of evidence E* they might see, they calculate the best possible action *given E* (max<sub>a</sub> 𝔼<sub>θ|E</sub>[U(a, θ)]), which involves updating beliefs to P(θ|E). They then average *these optimized utilities* over all possible E (according to their prior beliefs about what E might be).
  2.  **The Second Term (max<sub>a</sub> 𝔼<sub>θ</sub>[U(a, θ)]):** This is the optimal utility they can achieve *without* seeing E. They commit to the single best action **a*** based only on their prior beliefs.
  3.  **The Comparison:** The key insight is that the strategy "see E, *then* choose the best action for that E" **dominates** the strategy "commit to **a*** now and ignore E." Why?
      *   If, upon seeing E, the best action given E *happens* to be **a***, then the utility achieved is the same as committing to **a***.
      *   If, upon seeing E, a *different* action turns out to be better than **a***, then the agent gets *higher* utility by switching to that better action.
      *   Crucially, the agent *never does worse* by seeing E and acting optimally afterwards. At worst (when **a*** remains best), they break even. At best, they gain.
      *   **Jensen's Inequality (Intuitively):** Think of max<sub>a</sub> 𝔼<sub>θ|E</sub>[U(a, θ)] as a function of E. This function is convex because of the "max" operation. Jensen's inequality states that the expectation of a convex function is *at least* the function evaluated at the expectation (which, in this context, is analogous to the utility achieved by committing to the prior-optimal action). Hence, the first term ≥ the second term. QED.

  **What "Non-Negative in Expectation" *Really* Means (and Doesn't):**

  *   **Does Mean:**
      *   *On average, across all possible outcomes of the evidence*, the agent expects to be at least as well off (and possibly better off) by seeing the evidence and acting optimally than by committing to an action without it.
      *   The theorem is **airtight mathematically** under its assumptions (rational Bayesian updating, optimal action selection post-evidence, free information).
      *   It provides a powerful *normative* benchmark: a perfectly rational agent with *only* action-consequence utilities *should* always accept free information relevant to their decision.
  *   **Does NOT Mean:**
      *   That getting the information *always* makes the agent better off in every *specific* instance. You might get bad news that forces a painful but necessary action. The *expectation* is non-negative, not every outcome.
      *   That information has no *direct* psychological costs or benefits (fear, anxiety, relief, suspense). The utility function U(a, θ) only cares about the consequence of the action *a* in the state *θ*. The *process* of learning or the *state* of knowing/not knowing itself doesn't enter.
      *   That the agent can *always* take an action that perfectly mitigates any negative consequences revealed by the information. Sometimes information reveals unavoidable doom.
      *   That the agent's *ability* to act optimally or update beliefs rationally is unaffected by the information (e.g., severe distress impairing decision-making).
      *   That the information is truly "free" in all dimensions beyond decision-relevance.

  **Confronting the Counterexamples: Real Violations or Misapplied Theorem?**

  Now, let's adjudicate your cases:

  1.  **Huntington's Disease Testing:**
      *   **The Avoidance:** People avoid testing for a fatal, incurable genetic disease.
      *   **Good's Lens:** The theorem *assumes* utility comes *only* from actions taken based on the knowledge (e.g., life planning, reproductive choices). If the *knowledge itself*, independent of action, causes significant distress (e.g., decades of anxiety for a positive result, survivor guilt for a negative), **this psychological cost is *not* captured in U(a, θ).** The information isn't "free" – it carries a direct utility cost. Further, if the disease is truly incurable, the range of beneficial *actions* (beyond psychological preparation) might be very limited, reducing the potential EVOI. The agent rationally weighs the *direct* negative utility of knowing against the potential (action-based) EVOI.
      *   **Verdict:** **Not a counterexample.** This highlights a *violation of Good's assumptions* – specifically, the assumption that utility depends *only* on action and state, not on the information state itself. Humans experience "belief utility" or "anticipatory utility," which Good's model excludes.

  2.  **Spoiler Avoidance:**
      *   **The Avoidance:** People avoid learning plot twists to preserve surprise and enjoyment.
      *   **Good's Lens:** Here, the *state of uncertainty itself* is a crucial part of the utility derived from the experience (watching the movie, reading the book). Knowing the spoiler (θ) directly diminishes U(a, θ) for the action "experience the story," regardless of any other action taken. The suspense and surprise *are* the primary goods. Good's theorem assumes information is only valuable for *instrumental* action. When information *destroys* the intrinsic experiential value of the state of ignorance (the "surprise value"), its acquisition has a direct negative utility.
      *   **Verdict:** **Not a counterexample.** Another case where **utility depends intrinsically on the information state**, not just action and world state. Knowing θ directly reduces utility for the key action ("experience"), violating Good's core framework.

  3.  **Insurance Market Collapse (due to Public Information):**
      *   **The Avoidance:** Making previously private risk information public destroys the possibility of risk-pooling insurance.
      *   **Good's Lens:** This is fundamentally different. Good's theorem applies to a *single agent* making a decision. Insurance markets involve *multiple agents* with *strategic interactions* and *asymmetric information*. The "destruction" occurs because public information changes the *equilibrium* of the game. High-risk individuals, now identifiable, get priced out. Low-risk individuals get better deals, but the pooling equilibrium vanishes. Crucially, *before* the information is public, the *private* uncertainty *enabled* a mutually beneficial contract (risk-pooling) that becomes impossible with public knowledge. Good's theorem doesn't model strategic interaction or the value of *hiding* information from others to sustain cooperative equilibria.
      *   **Verdict:** **Not a counterexample to Good's theorem per se.** This is a case where **Good's individual rationality framework is inapplicable.** It demonstrates the *social value of ignorance* (or asymmetric information) in enabling certain beneficial institutions, a phenomenon entirely outside the scope of a single-agent decision model. The theorem makes no claim about multi-agent strategic contexts.

  **The Verdict:**

  **Good's theorem is mathematically airtight within its specific, highly constrained domain: a single rational Bayesian agent making a decision, where utility depends solely on actions and world states, information is free of direct psychological impact, and the agent can always act optimally. However, the very cases that define "information avoidance" research – Huntington's testing, spoiler avoidance, privacy concerns, and institutional reliance on uncertainty – almost invariably involve violations of these core assumptions. The direct psychological costs of knowing, the intrinsic value of suspense or hope, the impact of information on strategic equilibria, and limitations on beneficial action render Good's conclusion that "information is always good in expectation" largely irrelevant to explaining human information avoidance. Humans aren't being irrational by avoiding information in these contexts; they are rationally responding to a richer utility landscape and more complex decision environments than Good's pristine model captures.**

  **Therefore, while Good's theorem stands as a vital theoretical benchmark, it is almost never the right thing to say to an information avoider. Their avoidance is frequently a rational response to the very real costs and limitations of information that exist outside the theorem's idealized world.** Telling someone considering a Huntington's test that "rationality demands you take it" based solely on Good ignores the profound reality of their lived experience and the true structure of their decision problem. The power of the information avoidance literature lies in uncovering these richer rationalities, not in highlighting irrational deviations from an inapplicable norm.
