answer: |-
  Your notes and worry are impressively sharp—you've clearly grasped the core challenges and nuances. Let's break this down point by point:

  ### 1. **Fairness to Blackburn & Gibbard**
     - **Blackburn**: You accurately capture his projectivist/quasi-realist strategy. The "logic of attitudes" (with higher-order attitudes expressed by conditionals) and validity defined as "inconsistency in attitudes" is spot-on. The "tree-structured notation" you half-remember is likely his *practical syllogism* or *bifurcation attitude* formalism from *Spreading the Word* and *Ruling Passions*. Your summary survives close contact.
     - **Gibbard**: You correctly characterize his world-hyperplan pairs and truth-conditions relative to indices. The "tidier" appearance by importing classical logic semantics is well-observed. Gibbard explicitly frames this as a way to *mimic* realist semantics for logic/compositionality while grounding meaning in planning states.

  **Verdict:** Your representations are fair and philosophically literate. A close reader might quibble about nuances (e.g., Blackburn's later refinements), but your core accounts are sound.

  ---

  ### 2. **Your Worry About Gibbard: Recognized Problem or Misapplication?**
  Your worry is **both valid and a recognized critique**—it’s not a misapplication of Dreier but a direct engagement with a live debate in expressivism. Here’s the breakdown:

  - **The Core Issue**: You’ve nailed the tension: If "lying is wrong" is *true/false* relative to ⟨world, hyperplan⟩, doesn’t this concede the *semantic structure* of realism, leaving expressivism as merely a *metaphysical* or *psychological* add-on? Gibbard’s semantics looks suspiciously like a "two-factor" theory: truth-conditions + a non-semantic story about planning states.
  - **Dreier’s "Creeping Minimalism" Connection**: This is apt. Dreier (*Metaethics and the Creep*, 2004) argues quasi-realism risks collapsing into realism by adopting minimalist truth/disquotation, making its distinctiveness merely "metaphysical" (about what *grounds* moral properties). Your extension to Gibbard’s *semantic machinery* is precise:
    - Gibbard uses possible worlds + hyperplans to *define truth-conditions*—far more robust than minimalism.
    - This *does* risk making expressivism a claim only about the *ontology* of hyperplans (as mental states), not about the *semantics* of moral language.
  - **Who Raises This Against Gibbard?**:
    - **Chrisman (2012)** explicitly argues Gibbard’s view becomes a form of *relativist cognitivism*: moral claims express beliefs *about* hyperplans, not planning states. 
    - **Schroeder (2008)** notes Gibbard’s semantics treats normative sentences as descriptive of hyperplans, potentially losing the "expressivist" part.
    - **Ridge (2006, 2014)** questions whether "hyperplans" can do the motivational work expressivism requires without collapsing into descriptivism.
  - **Gibbard’s Defense**: He insists hyperplans are *practical* states, not belief-like representations. "Truth" relative to ⟨world, hyperplan⟩ is a *technical tool* for logic/embedding, not a concession to realism. The *meaning* of "wrong" is still tied to its role in expressing/conveying plans (*Thinking How to Live*, Ch. 5-7). But critics reply: if the *semantics* is truth-conditional, the "expression" part becomes pragmatic ornamentation.

  **Verdict:** Your worry is a sophisticated and legitimate critique, squarely within contemporary debates. It’s not *just* Dreier’s point—it’s a specific challenge to Gibbard’s technical implementation.

  ---

  ### 3. **Intelligibility to a Sharp Non-Specialist**
  Your notes are **mostly intelligible** but could use minor tweaks for maximum clarity:
  - **Strengths**: You clearly define expressivism, the embedding problem (using a concrete example), and contrast Blackburn/Gibbard’s solutions. The "boo/hurrah" setup is perfect.
  - **Tweaks for Accessibility**:
    - Replace "modus ponens" with "logical inference" (e.g., "the inference from *if P then Q* and *P* to *Q*").
    - Simplify "truth-conditional semantic value" → "truth-conditions" or "can be true/false".
    - Explicitly state early on that expressivism denies moral sentences express *beliefs about the world*.
    - Replace "metaphysically interesting sense" → "distinct from describing facts".
    - Add a 1-sentence gloss for Frege-Geach: "the problem of how moral words work in unasserted contexts like conditionals, questions, or negations."

  **Verdict:** With these tweaks, a sharp friend with basic fact/value knowledge would grasp it. The conditional example anchors it beautifully.

  ---

  ### 4. **A Stronger Expressivist Reply to Your Worry**
  Gibbard (or a defender) has a potent response. Here’s the strongest version:

  > "The truth-conditions relative to ⟨world, hyperplan⟩ *are not realist truth-conditions*. Hyperplans are *contingent, mind-dependent planning states*—not part of the fabric of reality. When I say 'Lying is wrong' is true at ⟨w, h⟩, I mean *if you have hyperplan h, and the world is w, you plan to disapprove of lying*. This *explains* motivation: to accept a normative judgment *is* to adopt a plan. The semantics handles embedding via compositionality, but the *content* remains grounded in practical reasoning. Classical logic is preserved not because moral facts exist, but because planning states can be modeled with the same formal tools. This is expressivism because the *fundamental* explanation of moral discourse is still about expressing non-cognitive states—the semantics is a *technical scaffold*, not a metaphysical concession."

  **Why this works**: It insists hyperplans are *irreducibly practical*, blocking the slide to cognitivism. The semantic machinery is instrumental, not ontological. Blackburn might add that his approach avoids truth-conditions entirely, preserving a purer expressivism at the cost of greater complexity.

  ---

  ### Summary
  1. **You’ve represented B&G fairly**—your account is robust.
  2. **Your Gibbard worry is legitimate**—it’s a key critique in the literature (Chrisman, Schroeder, Ridge).
  3. **Notes are mostly accessible**—minor edits would make them crystal clear.
  4. **Strong reply**: Gibbard’s semantics is a *formal tool*; hyperplans keep content mind-dependent and practical.

  If your group hasn’t discussed **Chrisman’s "Expressivism, Inferentialism and the Theory of Meaning"** (2012) or **Schroeder’s *Being For*** (2008), they’re natural next steps. Chrisman’s inferentialist expressivism offers a third path that might sidestep your worry entirely. Keep wrestling—this is metaethics at its best!
