  Need to structure the speech: start with a hook about their meeting, explain the concept simply, tie it to their relationship, add humor, then heartfelt wishes. Check for theological accuracy: ensure it's clear that God's knowledge doesn't force their choices. Use phrases like "God knew exactly the choices you'd freely make" to highlight libertarian freedom. 

