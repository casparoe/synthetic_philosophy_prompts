  The challenge is making this accessible. The family won't know terms like "counterfactuals" or "middle knowledge," so I need metaphors. Maybe something like "cosmic script" or "fate's flowchart." But also, include subtle nods for the experts. Mention "subjunctive conditionals" or "libertarian freedom" in passing. 

