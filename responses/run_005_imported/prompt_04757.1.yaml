prompt: |-
  I'm on my company's "Architecture Review Board" (ARB) -- six staff/principal engineers who get final sign-off on any big, hard-to-reverse technical decision, like which of two competing internal frameworks becomes the company standard, or whether we migrate off our aging message queue. Lately theres a push, backed by two ARB members themselves, to scrap this setup for a "Technical Referendum": for any major either/or technical call, open it up to a binding, anonymous, company-wide vote among all ~450 engineers, simple majority wins. At the last all-hands someone put up a slide with actual napkin math to back this up: assume each engineer only has like a 55% shot at independently picking the "right" answer, and the probability that a majority of a few hundred of them still land on the right answer climbs into the high 90s. That slide basically won the room overnight -- it turned the debate from "do we trust six people or the whole company" into "the math says a big vote wins," and it's going up for a real vote at the offsite next month.

  I'm skeptical, but I don't want to just say "trust the experts," because honestly the ARB has made some bad, insular calls before -- there's a running joke that ARB actually stands for "always rubber-stamps [some team]'s favorite tool." My gut says the slide's math is quietly smuggling in some assumptions that don't hold up here -- like, nobody's guess is really "independent" when everyone hashes it out in the same week-long Slack thread before voting, and I doubt "55% accurate" means the same thing for a call about our Kafka setup as it does for a call about a frontend build tool that most people have zero context on. But I can't fully work out whether that actually breaks the argument or just makes me feel better about being on the losing side of a popularity contest.

  Could you write the memo I'd bring to that offsite? I need it to land on an actual recommendation -- keep the ARB as-is, go full-referendum, or some specific hybrid -- with a concrete plan for phasing it in (or not) over the next couple of quarters, not just "more discussion needed." And it has to genuinely engage with the "the math says big votes win" argument on its own terms, since that's what's actually persuading people right now, rather than dodge it by just asserting that small groups of experts are obviously better.
reasoning: |-
  Okay, the user is part of an Architecture Review Board (ARB) facing a proposal to replace it with company-wide technical referendums. The core conflict is between the mathematical appeal of the "wisdom of crowds" argument (55% individual accuracy leading to near-certain correct outcomes) and the user's practical concerns about hidden assumptions in that model. 

  First, I need to dissect why the referendum slide was so persuasive. The Condorcet Jury Theorem math is superficially airtight: with 450 engineers at 55% accuracy, the probability of a correct majority vote is indeed >99.9%. That's an irresistible number in an all-hands setting. But the user's instincts about flawed assumptions are spot-on - independence and uniform accuracy are mathematical fairy tales in real engineering decisions. 

  The key weaknesses hiding in plain sight:
  - **Independence collapse**: Pre-vote discussions (Slack threads, team meetings) create massive information cascades. It's not 450 independent judgments - it's 5 influencers swaying 445 others.
  - **Accuracy mirage**: That hypothetical "55%" assumes every voter has meaningful context. For Kafka migrations? Maybe 50 engineers actually understand the tradeoffs. For frontend tools? 400 voters would be guessing based on blog posts.
  - **Problem framing**: Real tech decisions aren't binary "A/B" choices. They're multi-dimensional ("migrate now vs later vs partial vs new solution") that get shoehorned into yes/no.
  - **Accountability void**: Anonymous voting removes ownership. When the Kafka migration explodes, who explains why we voted for it? The ARB at least has named members accountable for calls.

  But outright defending the ARB is tricky - the user admits it has real flaws: insularity, rubber-stamping, past bad decisions. So the solution can't be "status quo good." Need a hybrid that preserves scalability while adding guardrails against mob dynamics.

  Structural ideas forming:
  - **Triage system**: Decisions sorted by impact/complexity. Only high-stakes, cross-cutting ones (like message queue migrations) go to ARB. Domain-specific choices (e.g., frontend framework for checkout flow) go to relevant sub-groups.
  - **Voting with weights**: Not all votes equal. SMEs get higher weight in their domains. But how to assign weights without politics? Maybe via peer validation of expertise.
  - **Pre-vote scaffolding**: Mandatory impact assessments from proposing teams, dissenting opinions published alongside proposals. No raw popularity contests.
  - **ARB reform**: Fixed terms, rotating members, public retrospectives on past decisions. Kill the "rubber stamp" perception.

  The memo must first dismantle the math illusion respectfully - show how the theorem's assumptions fail in practice without dismissing the appeal of democratization. Then pivot to "here's how we capture the best of both worlds." Concrete implementation matters: phase in changes over Q3-Q4 with clear metrics for evaluation.

  Biggest risk is sounding elitist. Emphasize that the goal isn't to suppress voices but to prevent disengaged majorities overriding deep expertise. Position the ARB not as deciders but as synthesizers of collective input.
answer: |-
  ## MEMO: RETHINKING TECHNICAL GOVERNANCE – A HYBRID APPROACH FOR SCALABLE WISDOM  
  *To: Engineering Leadership & ARB*  
  *From: [Your Name], ARB Member*  
  *Subject: Proposal for "Informed Majority" Governance Model – Balancing Collective Wisdom with Contextual Expertise*  

  ### I. ACKNOWLEDGING THE CORE INSIGHT  
  The referendum proposal correctly highlights a powerful statistical truth: **diverse groups often outperform small committees** when individual judgments are *independent* and *modestly competent* (per Condorcet’s Jury Theorem). At 55% individual accuracy, 450 engineers would be statistically near-infallible (>99.9% chance of correct majority). **This math is valid – but only if its assumptions hold.** Our real-world context breaks these assumptions, risking "false positive" outcomes.  

  ### II. WHY PURE REFERENDUMS FAIL OUR REALITY  
  While mathematically elegant, company-wide votes ignore three critical dynamics:  
  1. **Broken Independence**:  
     - Pre-vote Slack debates create information cascades (e.g., 3 senior engineers swaying 300 others). Votes become correlated, negating statistical power.  
     - Bandwagon effects amplify popularity over technical merit.  

  2. **Variable Accuracy**:  
     - **Not all engineers have 55% context on every issue**. For Kafka migration? Perhaps 70%. For React vs. Svelte in a niche product? <10%. Low-context voters dilute accuracy.  
     - Anonymous voting removes accountability for depth of analysis.  

  3. **Oversimplified Choices**:  
     - Tech decisions are rarely binary ("A or B"). They involve tradeoffs (cost, risk, timelines) ignored by yes/no votes.  
     - Referendums favor immediately gratifying options over long-term bets (e.g., "migrate later" always beats "migrate now").  

  ### III. THE HYBRID MODEL: INFORMED MAJORITY VOTING  
  We merge scale with context via a tiered system:  

  #### **Phase 1: Triage & Framing (ARB + Proposers)**  
  - ARB classifies decisions into tiers:  
    - **Tier 1 (High Impact/Cross-Cutting)**: e.g., Kafka migration, framework standards.  
    - **Tier 2 (Domain-Specific)**: e.g., frontend tooling for checkout team.  
    - **Tier 3 (Local/Reversible)**: Delegated to teams.  
  - For Tier 1/2 decisions, ARB *facilitates* (not dictates) a **Decision Prospectus**:  
    - Pro/con analysis from advocates of each option.  
    - Risk assessment, migration costs, and 2-year impact projection.  
    - Published to all engineers 1 week pre-vote.  

  #### **Phase 2: Qualified Voting**  
  - **Voter Eligibility**:  
    - *All engineers* may vote on Tier 1 decisions.  
    - **Vote Weight** scales with contextual expertise (self-declared + peer-validated):  
      - 1x: General interest (e.g., read prospectus).  
      - 2x: Relevant experience (e.g., used Kafka in last 2 years).  
      - 3x: Deep domain owners (e.g., infra team maintaining current system).  
  - **Anonymous but Accountable**: Votes anonymous, but weights public to incentivize honest self-assessment.  

  #### **Phase 3: ARB as Safeguard (Not Decider)**  
  - ARB certifies vote integrity but **cannot override majority outcome**.  
  - **Only intervenes if**:  
    - Evidence of coercion/collusion.  
    - Material misinformation in prospectus.  
    - Outcome violates pre-defined engineering principles (e.g., "no vendor lock-in").  

  ### IV. WHY THIS WORKS BETTER  
  - **Preserves statistical wisdom** by scaling participation.  
  - **Forces context-building** via prospectuses and weighted voting.  
  - **Reduces ARB insularity** by removing unilateral authority.  
  - **Mitigates "tyranny of the majority"** via safeguards and weights.  

  ### V. CONCRETE ROLLOUT PLAN  
  | **Timeline** | **Actions** |  
  |--------------|------------|  
  | **Next Quarter (Q3)** | - Pilot on 2 Tier 2 decisions (e.g., "Adopt gRPC for Service X").<br>- Develop "Decision Prospectus" template.<br>- Build vote-weighting tool (Slack bot + peer validation). |  
  | **Q4**         | - Expand to Tier 1 decisions (e.g., "React vs. Vue for new projects").<br>- Retrospective: Adjust weights & prospectus rigor. |  
  | **2025 Q1**    | - Full implementation. ARB transitions to facilitation/safeguard role.<br>- Monthly transparency report on decisions/voter engagement. |  

  ### VI. RECOMMENDATION  
  Adopt the **Informed Majority Model**, rejecting both the status quo (overly centralized) and pure referendum (naively statistical). This harnesses our collective wisdom while respecting context, complexity, and accountability. The math only works when the crowd is *independently informed* – our hybrid model achieves this.  

  **Appendices**:  
  - Mock "Decision Prospectus" for Kafka migration.  
  - Vote-weighting validation workflow.  
  - Condorcet Theorem limitations (correlation analysis).  

  ---  
  *This proposal democratizes authority while arming voters with context – turning "55% accuracy" from a slogan into a sustainable practice.* Let’s build a system where the right answer wins for the right reasons.
