answer: |-
  That's an excellent question that cuts to the heart of the frequentist vs. Bayesian divide. The "black magic" feeling is common! Let's break down the mechanics of why optional stopping (peeking) breaks frequentist inference but *doesn't* inherently break Bayesian inference. We'll then tie it to the replication crisis.

  **Core Conceptual Difference: What is Probability?**

  *   **Frequentist:** Probability is the **long-run frequency** of an event under repeated identical trials. A p-value is the probability of seeing data *at least as extreme* as what you observed, **assuming the null hypothesis (H0) is true**. It fundamentally depends on *what might have happened but didn't* (other potential datasets).
  *   **Bayesian:** Probability quantifies **degree of belief**. The posterior probability P(H|D) is the probability of a hypothesis (H) **given the observed data (D)**. It's calculated using Bayes' Theorem: `Posterior ∝ Likelihood × Prior`. It depends *only* on the data you actually observed and your prior belief.

  **Why Optional Stopping Breaks Frequentist Inference (The Mechanics)**

  1.  **The p-value's Definition:** The p-value calculation (`P(Data | H0)`) relies critically on the **sampling plan**. The "sampling plan" defines *all possible* datasets you *could have* observed and *how* you decide to stop collecting data.
  2.  **Stopping Rule is Part of the Plan:** In frequentist statistics, the stopping rule (e.g., "collect exactly 1000 samples" vs. "peek every 100 samples and stop if p<0.05") is an integral part of the experimental design. It defines the **reference set** of possible outcomes used to calculate probabilities.
  3.  **Multiple Testing Analogue:** When you peek repeatedly and have the *option* to stop, you are essentially conducting **multiple hypothesis tests** on accumulating data. Each peek is a potential decision point.
  4.  **Inflating the Type I Error Rate:** Consider a simple scenario:
      *   H0: True (e.g., no difference between A and B).
      *   Alpha = 0.05 (5% false positive rate *if you run the test once as planned*).
      *   You plan to peek after every 100 visitors (up to a max of 1000).
      *   **What happens:** The probability that the p-value dips below 0.05 *at least once* during these 10 peeks, *even if H0 is true*, is **much higher than 5%**! It's closer to 25-40% depending on the specifics. This is the **inflation of the false positive rate**.
  5.  **Why Inflation Occurs:** The p-value threshold (e.g., 0.05) is calibrated for the *intended* sampling plan (e.g., fixed sample size N=1000). By changing the plan mid-experiment (introducing the option to stop early based on the data), you change the distribution of possible p-values under H0. The calculation `P(Data | H0)` now includes paths where early, random fluctuations trigger stopping, making extreme results *more likely* under H0 than under the fixed-N plan. The frequentist guarantee (alpha control) *only* holds if you stick rigidly to the pre-specified stopping rule.

  **Why Optional Stopping (Generally) Doesn't Break Bayesian Inference (The Mechanics)**

  1.  **Bayes' Theorem Only Cares About Observed Data:** The Bayesian posterior is calculated as `P(H | D) ∝ P(D | H) * P(H)`. The key here is the **Likelihood Principle**. This principle states that *all* the information about the hypothesis (H) contained in the experiment is provided by the **likelihood function** `P(D | H)` of the *observed data (D)*.
  2.  **Stopping Rule is Irrelevant to the Likelihood:** The *reason* you stopped collecting data (e.g., "I peeked and it looked good", "I ran out of time", "I hit my max sample size") **does not affect the likelihood function** `P(D | H)` for the data *you actually collected (D)*. How you decided to stop is information *about the experimenter*, not information *about the parameter*.
  3.  **Posterior Depends Only on D and Prior:** Since the stopping rule doesn't enter the likelihood, and the posterior is proportional to `Likelihood × Prior`, **the stopping rule does not affect the posterior distribution** `P(H | D)`. Your belief about H, given the data D, is the same whether you planned to look only at N=1000, peeked 10 times, or stopped because a bird flew into the lab window, *as long as the data D is identical*.
  4.  **Interpretation is Key:** A Bayesian reports `P(H1 | D)` (e.g., "Given this data, there's an 85% probability variant B is better"). This probability statement conditions *only* on the observed data D. It doesn't make claims about long-run frequencies over hypothetical repeated experiments with different stopping rules.

  **Important Nuances for Bayesian Inference:**

  *   **Prior Sensitivity:** If your prior is very strong (or very weak/informative), the path to the posterior *can* be influenced by *when* you stop, especially early on. However, the *final* posterior given D is still correct for that D and that prior. The issue is whether the prior is reasonable.
  *   **Calibration:** While the *calculation* isn't broken, poorly chosen priors or model misspecification can still lead to misleading posteriors, regardless of stopping. The posterior probability *is* your belief, but that belief might not be well-calibrated (e.g., your 95% credible intervals might not contain the true parameter 95% of the time *if* you used a bad prior/model).
  *   **Decision Rules:** If you use the posterior to make decisions (e.g., "launch B if P(B better | D) > 95%"), optional stopping *can* affect the *operating characteristics* (like long-run false positive rates *for that decision rule*) if not accounted for in the decision threshold. However, the *inference itself* (`P(H | D)`) remains valid.

  **Tying it to the Replication Crisis**

  Optional stopping in frequentist frameworks is a major contributor to the replication crisis:

  1.  **Inflated False Positives:** As shown, peeking dramatically increases the chance of declaring a non-existent effect significant (Type I error). Many published "significant" findings are likely just these false positives triggered by undisclosed peeking and flexible stopping rules.
  2.  **Exaggerated Effect Sizes:** Stopping early *only when results are extreme* (which peeking allows) means you disproportionately stop when the observed effect size is larger than the true effect size (regression to the mean hasn't fully kicked in). This leads to published estimates that are too large to replicate.
  3.  **Lack of Transparency:** Peeking and flexible stopping are often not reported in publications. The reported p-value and effect size are presented as if they came from a fixed-sample test, hiding the true inflation of error rates and bias.
  4.  **Publication Bias:** The combination of peeking (making it easier to get "p<0.05") and the "file drawer problem" (only publishing significant results) floods the literature with unreliable findings.
  5.  **Why Bayesian Helps (Potentially):** Because Bayesian inference (with reasonable priors) isn't broken by optional stopping:
      *   **Honest Updating:** Researchers *can* monitor data continuously and update beliefs honestly based on accumulating evidence.
      *   **Reduced Bias:** Stopping decisions based on posterior probabilities (e.g., "P(effect>0 | D) > 95% or < 5%") are less prone to the extreme effect size inflation seen with p-value peeking.
      *   **Transparent Priors:** Requiring explicit priors forces consideration of existing evidence, potentially mitigating hype around weak, early signals. Replication failures can be diagnosed by examining if strong posteriors were based on overly optimistic priors or flimsy data.
      *   **Focus on Effect Size:** Posteriors naturally focus on estimating the magnitude and uncertainty of effects, rather than just binary significance.

  **Conclusion: Not Magic, Just Different Philosophy & Mechanics**

  The difference isn't magic; it's a fundamental consequence of what each framework conditions on:

  *   **Frequentist:** Conditions on H0 and the *entire experimental design* (including the stopping rule) to calculate the probability of data (or more extreme data). Changing the design (peeking) invalidates the probability calculation (p-value).
  *   **Bayesian:** Conditions on the *observed data* to calculate the probability of hypotheses. The stopping rule, being separate from the data itself, doesn't factor into this calculation (thanks to the Likelihood Principle).

  While Bayesian methods aren't a panacea (garbage priors in, garbage posteriors out), their relative robustness to optional stopping is a direct result of conditioning on the observed data alone. The replication crisis was fueled, in significant part, by the misuse of frequentist tools (like p-values) in flexible analysis environments (with peeking, multiple testing, selective reporting) where their underlying assumptions were grossly violated. Bayesian approaches, by construction, avoid one of these key violations (optional stopping), offering a more natural framework for sequential analysis and potentially more reliable cumulative science, *if* used rigorously and transparently.
