  The user might be concerned about real-world applications. They work in a job where A/B tests are common, so practical implications matter. Explaining how Bayesian updating allows continuous monitoring without penalty could be useful. Also, note that some industries use Bayesian methods for this reason, like in clinical trials or tech companies for adaptive experiments.

