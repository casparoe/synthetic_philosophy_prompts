  Is there a principled place to stop between "luck in outcome" and "luck in constitution"?

  This is the heart of the moral luck debate. Nagel and Williams both acknowledge that the problem seems to lead to a skeptical conclusion about moral responsibility. However, there are attempts to draw a line.

  One approach is to insist that we can hold people responsible for their actions (and the traits they manifest in those actions) even if the traits themselves are ultimately a matter of luck. We judge the agent for what they did and the choices they made at the time, recognizing that the agent is a product of luck but also an active participant. We might say that the constitutive luck argument is a more general challenge to responsibility, but in practice, we still hold people responsible for their actions because we have to. 

  Another approach (compatibilist) is to argue that what matters is not the ultimate origin of the traits but whether the actions flow from the agent's own psychology (even if that psychology is shaped by luck). We can then distinguish between outcome luck and constitutive luck by saying that outcome luck is external to the agent's control at the time of action, while constitutive luck is internal but still forms the basis for the agent's responsibility. However, this doesn't completely resolve the regress because the agent's psychology is not of their own making.

  In the context of the internship, we might say that the managers are judging the interns based on the actual impact of their actions (which is what matters to the company) and that the outcome luck is part of the real-world consequences. But from a moral perspective, if we are concerned with fairness to the interns, then Claire's point stands.

  Conclusion: There is no entirely principled place to stop that avoids the problem of luck. The regress Marcus points out is real and undermines the idea of desert-based moral responsibility. However, in practice, we do stop at the level of the agent's actions and the traits they exhibit. We might say that outcome luck is arbitrary and should not affect blame, but constitutive luck is unavoidable if we are to hold people responsible at all. This is a tension without a perfect solution.

