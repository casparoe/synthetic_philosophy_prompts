  In the end, the moral luck problem remains unresolved in philosophy. So, while Claire can maintain that outcome luck should not matter, she must acknowledge that the entire system of responsibility rests on a foundation that is vulnerable to the luck of the draw. However, that doesn't mean we should give up on trying to be fair. We can strive to minimize the influence of outcome luck by focusing on the process and the choices made with the information available at the time.

  Thus, to answer the question: there is no entirely principled place to stop that avoids the regress. But we can still hold that outcome luck is a particularly egregious form of unfairness because it is more easily separable from the agent's control than constitutive luck. We can choose to design our evaluation systems to focus on the factors within the agent's control (like the quality of the decision process) and discount the outcome luck. This would be a practical way to mitigate the unfairness, even if the deeper problem of constitutive luck remains.
