answer: |-
  Here’s a toast draft that honors your mother’s legacy, navigates the paradox with nuance, and resonates with both halves of the room—all while keeping the warmth and celebration central. It’s structured for ~7 minutes when read aloud, with natural pauses:

  ---

  ### The Toast  
  **(Begin with raised glass, eye contact, and a warm smile)**  

  "To Mom. To Judge [Last Name]. To the woman who taught us that how you build something matters as much as what you build.  

  **For the Grandkids & Neighbors:**  
  If you’ve ever watched your grandma insist on stacking blocks *just so*, or reorganize a choir’s sheet music with military precision—you’ve glimpsed a superpower. For 34 years on the bench, she believed that the only way to reach a just verdict was to build it carefully, piece by piece. Not to leap to the answer, but to test every step: *Was there a duty? Was it broken? Did that break cause harm?* Only then would she let the outcome reveal itself.  

  **For the Lawyers & Clerks:**  
  *(Lean in conspiratorially)*  
  Yes. *That* habit. The one that turned straightforward votes into… well, let’s call them ‘robust deliberations.’ Some called it stubborn. Her clerks called it a masterclass. And every lawyer who ever watched her dissect a case like a watchmaker knew: if your argument had a weak gear, she’d find it.  

  **The Heart of It (for Everyone):**  
  We celebrate today not just *what* she decided, but *how* she decided. Because Mom understood something profound: **reasons matter more than results.**  

  *(Pause, soften tone)*  
  She’d tell her clerks: *‘I’d rather lose a case than lose the reasons for it.’* Think about that. In a world obsessed with winners and losers, she fought for something deeper—the *why* beneath the *what*. The logic you could stand on. The kind that stays true even when the vote goes against you.  

  **The Paradox (Nod to the Experts, Without Jargon):**  
  Now, in any group—whether judges or a jury or a family debating where to eat—there’s a tension. Do you tally votes on the final outcome? Or do you vote step by step, and let the outcome follow?  

  *(Make eye contact with the legal tables)*  
  We all know the case where her panel split clean down the middle on this. Three brilliant judges. Same facts. Same law. But depending on *how* you voted, you could get two different verdicts—both perfectly reasoned.  

  *(Shift to universal tone)*  
  That tension isn’t just a legal footnote. It’s human. It’s about whether we value the destination more than the path. Mom’s answer was a wager: **She bet that the path *was* the destination.** That rigorously testing each step—even if it felt messy, even if it cost her a majority—would guard something irreplaceable: the integrity of the law.  

  **The Impossible Choice (Key Philosophical Weight):**  
  She knew this wasn’t a trick to ‘fix’ group decisions. Smart people have shown some trade-offs are inevitable. *(Subtle nod to List/Pettit)* Her issue-by-issue voting wasn’t a solution—it was a sacrifice. She gave up efficiency, simplicity, sometimes even consensus… to protect the thing she valued most: **clarity of thought.**  

  **The Legacy (Reverent, Warm Close):**  
  So today, we toast the judge who taught us that counting votes properly isn’t about math—it’s about moral craftsmanship. Who showed us that justice isn’t found in the verdict alone, but in the care taken with every brick of reasoning laid before it.  

  **(Raise glass higher, voice lifts)**  
  To a woman who never confused the quick answer for the right one. Who built her career—and her character—one principled step at a time. To a jurist whose dissents were never just ‘no’—they were blueprints for better ‘yeses.’  

  **To Mom:  
  May her retirement be as richly reasoned, as fiercely curious, and as full of quiet joy as every opinion she ever wrote.  
  Cheers!**  

  ---

  ### Why This Works:
  1. **Dual Audience Handling:**  
     - Grandkids/neighbors hear: *"Grandma was careful and principled."*  
     - Legal experts hear: *"She weaponized the discursive dilemma for epistemic integrity."*  
     - The "case where the panel split" is the glancing moment—lawyers will know *exactly* which one.  

  2. **Philosophy Doing Real Work:**  
     - The paradox frames her entire career as a conscious choice ("wager") between values (reasoning integrity vs. efficiency/consensus).  
     - List/Pettit is honored *implicitly* ("trade-offs are inevitable") without name-dropping or claiming she "solved" it.  

  3. **Her Core Quote Anchors It:**  
     *"I’d rather lose a case than lose the reasons for it"*—this is the emotional and philosophical engine of the toast.  

  4. **Warmth Over Lecture:**  
     - Concrete images (watchmaker, stacking blocks, brick-laying) make abstraction tactile.  
     - "Robust deliberations" (with a wry smile) > "doctrinal paradox."  

  5. **Respect for Colleagues:**  
     By calling the split verdict "perfectly reasoned," you honor those who disagreed—affirming her view that it’s about values, not carelessness.  

  **Delivery Tip:** Pause before *"reasons matter more than results"* and after *"the path was the destination."* Let the legal tables lean in. End with unapologetic warmth—this is her son, not Professor [Your Name].  

  She’ll hear the love in the craft. And the room will feel why her "quirk" was a quiet revolution.
