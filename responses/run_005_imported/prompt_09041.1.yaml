answer: |-
  Here’s a toast that honors the spirit of your original sentiment while sidestepping infinite ethics pitfalls—crafted to move hearts, satisfy philosophers, and celebrate Priya and Dev’s love without a single wince:

  ---

  **(Clink glass gently)**  

  Friends, family, and fellow admirers of Priya and Dev… raise your glasses.  

  Some of us have known Priya since college—back when her idea of “romance” was debating Kant over cold pizza at 2 a.m. (Dev, I suspect you’d have fit right in). And now? Look at them. Radiant. Utterly, stupidly in love.  

  When I think about these two, I don’t just see today’s joy—though there’s enough here to power a small city. I see the *layers*. The late-night thesis drafts Priya read aloud to you, Dev, just because she trusted your mind. That time you surprised her with a weekend trip to watch migratory birds after she’d had a brutal week. The way you still make each other laugh like conspirators.  

  **My hope for you both isn’t an infinite curve—it’s something far more real.**  

  I hope your happiness isn’t a number to compound, but a well to return to—a source that deepens because you tend it. That when life gets loud, you’ll still find quiet moments where everything else falls away, and it’s just you two, remembering why you chose this.  

  I hope your love keeps surprising you. Not because it scales exponentially, but because it *renews*—like finding a new path in a familiar forest. That fifty years from now, you’ll still catch each other’s eye across a room and feel that spark of, *“Oh, right. You.”*  

  **Because forever isn’t a math problem. It’s a choice.**  
  A choice to show up, again and again, in the ordinary and the extraordinary. To build a history so rich in shared jokes, inside stories, and forgiven fumbles, that time bends around it.  

  So here’s to Priya and Dev:  
  May your love always feel like a beginning.  
  May your joys be too abundant to count, and too precious to reduce to a total.  
  And may every year ahead remind you that the best things in life aren’t measured—they’re lived.  

  **(Raise glass higher)**  
  To the brilliant, finite, absolutely boundless adventure ahead.  

  ---

  ### Why this works:
  1. **Bypasses Infinity Traps**:  
     - Replaces "compounding" with cyclical renewal ("a well to return to," "renews").  
     - Focuses on *qualitative depth* ("layers," "rich history") over quantitative growth.  
     - "Feels like a beginning" evokes timelessness without claiming literal infinity.  

  2. **Satisfies Philosophers**:  
     - Acknowledges finitude ("brilliant, finite adventure") while preserving poetic weight.  
     - Grounds "forever" in repeated *choices*—a nod to decision theory without lecturing.  
     - "Too abundant to count, too precious to reduce to a total" = a sly wink at aggregation problems.  

  3. **Moves the Room**:  
     - Concrete memories (cold pizza, birdwatching) anchor sentimentality.  
     - Universal metaphors (wells, forests) resonate across generations.  
     - Ends on warmth, not abstraction.  

  4. **Checkmates Marcus**:  
     No "total" to compute. No "plateau" to judge. Just two people building meaning day by day—exactly how finite beings thrive.  

  *Deliver it with a grin when you mention "finite adventure"—Priya and Dev will get the joke, Marcus will smirk respectfully, and Aunt Susan will just feel the love.* Break a leg!
