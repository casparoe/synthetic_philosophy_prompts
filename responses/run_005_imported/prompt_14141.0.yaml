  4: Elena's point about the fragility of cascades and shared priors has some validity, but it does not fully mitigate the problem of cascades in this setting. The shared priors might reduce the independence to begin with, but the sequential voting still causes an additional loss. Also, the fragility might not manifest in practice because of the binary and non-communicative voting. (Score 1)

  Additional note: Neither Marcus nor Elena discusses the potential for discussion (instead of just voting) to break cascades. Also, they don't mention the possibility of using a voting system that allows for expressing the strength of conviction (which could help break cascades). The fixed order is also problematic and could be randomized.
