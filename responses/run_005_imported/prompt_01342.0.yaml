  The strongest counterargument comes from Hayek's epistemic trust in markets. If prices aggregate knowledge better than voting, why not extend this to policy? But Hayek distinguished between general rules and specific outcomes. Markets work within rules, not as rule-makers. Futarchy conflates these levels in ways Hayek would find dangerous.

