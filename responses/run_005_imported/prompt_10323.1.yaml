  Okay, the user is describing a situation in their department where a new core requirement was voted on, but only tenure-line faculty had a say. They feel this is unfair because adjuncts who teach most of the courses, grad TAs who deliver a lot of it, and the students who will be affected weren't included. They want to know if there's a principled way to determine who should vote or if it's just arbitrary.

  First, I need to understand the user's position. They were on the losing side of the vote and feel the process was illegitimate. Their main concern is about the exclusion of key stakeholders. They mentioned feeling "salty," which suggests frustration but also a desire for validation that their concerns are legitimate.

  The user's explicit question is about finding a principled way to decide who should vote. But their deeper need might be to find a solid argument to challenge the decision or to advocate for more inclusive governance in the future. They might feel powerless and want tools to push back against what they see as an unfair system.

  Looking at the stakeholders: tenure-line faculty have long-term stakes, but adjuncts and grad TAs are directly involved in teaching. Students are the most affected but not yet present. The user mentioned that adjuncts teach most sections, so excluding them ignores their practical experience. Grad TAs also have significant teaching roles. Students' future interests are at stake, but current students might not represent future ones well.

  Different principles come into play. Legitimacy through participation: those affected should have a say. Expertise: those implementing the policy (adjuncts, TAs) know the practical challenges. Accountability: faculty are responsible for curriculum, but others are accountable in different ways. Practicality: including everyone could be chaotic, but excluding key groups leads to poor implementation.

  The user needs a structured way to argue their point. The answer should provide frameworks like democratic legitimacy, stakeholder analysis, and procedural justice. They might also need reassurance that their feeling of illegitimacy is valid and not just them being salty. Highlighting that excluding implementers can lead to failure of the policy could strengthen their argument.

  Possible counterarguments: Tenure-line faculty have long-term commitment, while others might not. But adjuncts are often long-term too, even without tenure. Students' transient presence makes their inclusion tricky. However, mechanisms like student representatives could help. The key is to show that the current system overlooks essential perspectives, risking the policy's effectiveness and fairness.

  In conclusion, the user needs a principled basis to argue for more inclusive decision-making. Providing frameworks and practical steps, like advocating for input mechanisms even without voting rights, can empower them. Validating their concerns and offering actionable solutions would address both their explicit and deeper needs.
answer: |-
  You've hit on a fundamental tension in academic governance: **who constitutes "the university" for decision-making purposes?** Your feeling that "the right people weren't in the room" isn't just saltiness – it points to a legitimate concern about **democratic legitimacy, stakeholder impact, and procedural justice**. While drawing lines *is* necessary, it doesn't have to be arbitrary. Here are principled frameworks to analyze this:

  1.  **The Affected Interest Principle (Democratic Legitimacy):**
      *   **Core Idea:** Those significantly affected by a decision should have a say in making it. This is a bedrock principle of democratic governance.
      *   **Application:**
          *   **Students:** Are *profoundly* affected. They bear the cost (time, tuition, opportunity cost), must fulfill the requirement, and its design impacts their education. *Argument:* Future students' interests *are* legitimate concerns; mechanisms exist (student senators, surveys, focus groups) to represent them, even if they aren't physically enrolled yet.
          *   **Adjuncts:** Are *directly* and *significantly* affected. They teach the majority of sections. The new requirement dictates *their* workload, preparation, pedagogical approach, and potentially job stability/expectations. Excluding them ignores their expertise and the practical realities of delivery.
          *   **Grad TAs:** Are also *directly* affected. They deliver instruction, grade, interact with students, and their workload/training is impacted. They are future faculty and current essential labor.
          *   **Tenure-Line Faculty:** Are affected, certainly. They oversee curriculum, bear long-term institutional responsibility, and may teach some sections. But their *day-to-day* implementation burden is often lighter than adjuncts/TAs for high-enrollment core courses.
      *   **Argument Against Exclusion:** Limiting the vote *only* to tenure-line faculty violates this principle by disenfranchising the groups bearing the brunt of the decision's consequences. The vote lacks legitimacy because it excludes core stakeholders.

  2.  **The Implementation Expertise Principle (Practical Legitimacy):**
      *   **Core Idea:** Those responsible for implementing a policy possess crucial practical knowledge about its feasibility, challenges, and potential pitfalls. Ignoring this expertise leads to poorly designed, unrealistic policies.
      *   **Application:**
          *   Adjuncts and TAs are the *primary implementers* of core requirements, especially for large intro courses. They know student preparedness, workload realities, resource constraints, and effective pedagogical strategies at scale.
          *   Excluding them means the decision was made without critical input on *how* this will actually work on the ground. This increases the risk of the requirement being inefficient, unpopular, poorly taught, or even failing.
      *   **Argument Against Exclusion:** The decision-making process lacked essential expertise, making the outcome potentially flawed *even on its own merits*. "Those who do the work should help design the work."

  3.  **The Accountability Principle:**
      *   **Core Idea:** Decision-makers should be accountable to those affected by their decisions.
      *   **Application:**
          *   Tenure-line faculty are primarily accountable to each other, the administration, and disciplinary standards. They are less directly accountable to students (beyond course evals) and have minimal accountability to adjuncts/TAs.
          *   Students, adjuncts, and TAs have little formal recourse if the requirement proves burdensome, poorly designed, or detrimental.
      *   **Argument Against Exclusion:** When decision-makers aren't accountable to the most affected groups, it creates a power imbalance and reduces incentives to design policies that genuinely serve those groups' needs.

  4.  **The Long-Term Stewardship Principle (The Common Counter-Argument):**
      *   **Core Idea:** Tenure-line faculty have a long-term commitment to the institution, its reputation, and its educational mission. They bear responsibility for the curriculum's coherence and quality over decades.
      *   **Application:** This is the usual justification for limiting major curricular votes to tenure-line faculty. They are seen as the stable core with enduring responsibility.
      *   **Rebuttal:** This principle isn't invalid, but it's insufficient alone:
          *   Many adjuncts have long-term commitments to the institution (even if precarious).
          *   Stewardship requires listening to implementers and those served (students).
          *   Stewardship divorced from implementation reality and student impact is poor stewardship. Good stewardship *demands* incorporating diverse perspectives.

  **Why It's Not *Just* Arbitrary Line-Drawing:**

  While lines must be drawn, the *criteria* for drawing them can be principled. The current common practice (only tenure-line votes) relies *solely* on the Stewardship Principle and formal employment status, ignoring the more fundamental principles of **Affected Interest** and **Implementation Expertise**.

  **A More Principled Approach (Not Necessarily Simple):**

  1.  **Stakeholder Representation:** Decision-making bodies should include *representatives* of key stakeholder groups:
      *   Tenured/Tenure-Track Faculty (Stewardship, Expertise).
      *   **Adjunct Faculty Representatives** (Implementation Expertise, Affected Interest).
      *   **Graduate Student/TA Representatives** (Implementation Expertise, Affected Interest, Future Stewardship).
      *   **Undergraduate Student Representatives** (Affected Interest - the primary consumers).
  2.  **Weighted Input:** Formal voting power might remain primarily with tenure-line for stewardship, but mechanisms ensure *formal, recorded input* from other stakeholders *before* the vote. This could be:
      *   Required consultation sessions with adjunct/TA committees and student government.
      *   Non-voting representatives on the curriculum committee with speaking rights.
      *   Mandatory consideration of impact reports from these groups.
  3.  **Sunset Clauses & Mandatory Review:** If a decision is made without broad input, build in a mandatory review after 2-3 years of implementation, explicitly seeking feedback from adjuncts, TAs, and students, with a mechanism for significant revision if problems arise. This acknowledges the legitimacy deficit of the initial process.

  **How to Frame This Argument More Effectively:**

  Instead of "wrong people in the room," try:

  *   "**This decision will profoundly impact groups who had no voice in making it: the students required to take it, and the adjunct faculty and TAs responsible for teaching most of it. Excluding their perspectives risks designing a requirement that doesn't serve students well and creates implementation challenges we could have foreseen. For the policy to be both legitimate and effective, we need mechanisms to formally incorporate their expertise and account for their interests.**"
  *   "**We rely heavily on adjuncts and TAs to deliver this curriculum. Making a decade-long commitment about *how* that delivery must happen without including their practical expertise in the decision-making process seems like a significant oversight that could undermine the policy's success.**"
  *   "**While tenure-line faculty bear long-term stewardship, good stewardship requires understanding the realities faced by those implementing the curriculum and those learning from it. Can we discuss how to ensure those vital perspectives are formally integrated into major curricular decisions moving forward?**"

  **Conclusion:** You are right to question the legitimacy. The exclusion of key stakeholders violates core principles of democratic decision-making and practical policy design. While perfect inclusion is complex, the *current* norm of excluding adjuncts, TAs, and students (especially when future impact is certain) leans too heavily on a narrow view of stewardship and ignores the essential principles of Affected Interest and Implementation Expertise. Framing the argument around these principles and proposing concrete ways to incorporate broader input (even without full voting rights) is a much stronger and more principled approach. It moves beyond "feels wrong" to "this undermines legitimacy, effectiveness, and good governance."
