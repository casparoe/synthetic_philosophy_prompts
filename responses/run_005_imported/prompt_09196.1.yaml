answer: |-
  That knot in your stomach is completely understandable—what you're feeling is the tension between outcome-based ethics (your friend's view) and the deeper importance of moral character and intention. Both perspectives have weight, but dismissing your discomfort misses something crucial about why we value good actions. Here’s why your unease matters:

  1.  **The "Why" Defines Character:** Actions reveal who we are, but *motivations* define our character. You helped someone, which is objectively good. But if your *primary* driver was vanity/impression-seeking rather than compassion, it reveals a gap between the action and your underlying values. That gap is what feels "off"—it highlights a misalignment you sense in yourself.

  2.  **Integrity vs. Performance:** There’s a difference between doing good *because it's good* and doing good *because it looks good*. The action (giving the seat) was the same, but the *integrity* of the act was compromised. You weren't acting from your core values in that moment; you were performing for an audience. That lack of authenticity is what feels quietly "ruined."

  3.  **The Problem of Contingency:** Your honesty reveals a troubling truth: *Without the girl there, the old lady would have suffered.* The good outcome depended entirely on an external, self-serving factor. This makes the kindness feel fragile and unreliable—not a stable part of who you are, but a circumstantial performance.

  4.  **Kant's Insight:** Philosopher Immanuel Kant argued that the *only* truly moral acts are those done purely *from duty* (because it's right), not from self-interest or desire for reward. If your *only* reason was impressing the girl, Kant would say it lacked *moral worth*, even if the outcome was good. Your discomfort echoes this.

  **Why Your Buddy Isn't Entirely Wrong (But Misses the Point):**
  -   **Outcomes Matter:** The old lady *did* get the seat. Relief was provided. That has tangible value and shouldn't be dismissed. In a purely practical sense, the world is better off.
  -   **Mixed Motives Are Human:** Very few acts are 100% pure. Often, we do good things for a mix of reasons: genuine care *plus* wanting approval, feeling obligated, etc. Your friend is right that we shouldn't demand impossible purity.

  **Why Your Discomfort is Valuable (Not Just Guilt):**
  Your unease isn't useless guilt—it’s **moral self-awareness**. It signals:
  -   **You Aspire to Be Better:** You recognize that genuine compassion is a higher ideal than performative kindness.
  -   **You Value Authenticity:** You want your actions to align with your values, not just your desires.
  -   **It's a Catalyst:** This feeling can motivate you to act from genuine empathy next time, even when no one is watching. *That's* how character grows.

  **The Takeaway:** Your friend is right that the outcome had value. But **you're also right** to feel the reason matters deeply. The outcome fixes a momentary problem; acting from genuine compassion builds a better *you*. 

  **What to do with this feeling:**
  1.  **Acknowledge the Good:** You *did* help someone in need. That matters.
  2.  **Honor the Discomfort:** Don't dismiss it. It's your conscience pointing towards a higher standard.
  3.  **Use it as Fuel:** Let this memory remind you to check your motivations. Next time you see someone struggling, try to connect with *their* need, not your own potential gain. Act because it’s right, not because it might impress someone.

  The "why" doesn't erase the good done, but it does shape the person doing it. Your discomfort shows you want to be someone motivated by kindness itself—and that aspiration is what truly matters in the long run.
