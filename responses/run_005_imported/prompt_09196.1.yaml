  This has been bugging me for weeks and I can't shake it. A while back I gave up my seat on a packed train to an elderly woman who looked like she could barely stand - I did notice she seemed exhausted, so it wasn't like I felt nothing for her, but if im being honest the bigger reason I actually got up was that a girl I'd been wanting to talk to was sitting a few seats away and I wanted her to see me do it. If she hadn't been on that train, I'm pretty sure I would've just kept my headphones in and let the old lady stand like everyone else did. My buddy says who cares, the old lady still got the seat either way, so thats all that should matter. But it feels like the real reason kind of quietly ruins the whole thing even though nothing about what actually happened changed. Is my buddy right that the reason behind an action doesn't matter as long as the result's good, or is there actually something to feel weird about here?
