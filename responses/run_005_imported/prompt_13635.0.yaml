prompt: |-
  I teach decision theory in my university's philosophy department and serve, as the resident philosopher, on my affiliated hospital's Clinical AI Governance Committee. I've been asked to draft the memo the committee will vote on next week, covering the rollout protocol for a new deterioration-risk algorithm that currently reports a single calibrated probability of decline within twelve hours against a fixed alert threshold. Our data science lead wants to replace this point estimate with an imprecise probability — a range reflecting genuine uncertainty for patients whose vitals are sparse or atypical, rather than a false precision the data don't support — but the committee is split on what to do when a patient's range straddles the threshold. One natural decision rule (act on whatever maximizes expected benefit for at least one distribution in the range) and another (act on whatever does best in the worst case) can recommend different things for the same patient, or fail to settle on a single recommendation at all. Some members are also unsettled that ordering a confirmatory test can sometimes widen a patient's range rather than narrow it — a documented feature of reasoning under this kind of uncertainty known as dilation, not a bug, though they want to know whether it undermines the whole approach. Nursing leadership, meanwhile, warns that any recommendation this indecisive will simply be ignored at the bedside. Draft the memo: recommend a point estimate or a range, specify the decision rule and escalation protocol that should govern borderline cases, set an implementation timeline, and give the actionability worry its due rather than dismissing it as mere unfamiliarity with the new format.
reasoning: |-
  Okay, the user is a philosophy professor teaching decision theory and serving on a hospital's Clinical AI Governance Committee. They need to draft a memo for the committee's vote regarding a new deterioration-risk algorithm. The key issue is whether to use a single point estimate or an imprecise probability range, especially when the range straddles the alert threshold. 

  First, I need to understand the core dilemma. The data science lead wants imprecise probabilities to avoid false precision, but the committee is split on decision rules for borderline cases. Two main rules are mentioned: maximizing expected benefit under any distribution in the range (optimistic) vs. the worst-case scenario (pessimistic). These can conflict, leading to indecisive recommendations. There's also the issue of dilation—where confirmatory tests widen the range instead of narrowing it—which unsettles some members. Nursing leadership is concerned about actionability, fearing clinicians will ignore ambiguous recommendations.

  The user's explicit request is a memo that recommends either point estimate or range, specifies decision rules and escalation protocols, sets a timeline, and addresses actionability concerns seriously. But deeper needs might include: ensuring ethical responsibility in life-or-death decisions, balancing technical accuracy with practical usability, and fostering interdisciplinary consensus. The user likely wants a solution that respects uncertainty without paralyzing clinicians, while educating stakeholders on imprecise probabilities.

  I recall that in decision theory, imprecise probabilities handle ambiguity better than point estimates when data is sparse. However, operationalizing them requires clear rules. For straddling thresholds, a minimax approach (act in worst-case) seems safer in healthcare, where failing to alert on a deteriorating patient is riskier than false alarms. But this must be tempered with escalation protocols to avoid alert fatigue. Dilation is indeed a feature, not a bug—it reflects genuine uncertainty after new data, which should trigger human review, not be seen as a flaw. 

  Nursing's concern about indecisiveness is valid. Clinicians need unambiguous guidance during crises. The solution might be to pair ranges with mandatory escalation for borderline cases, making uncertainty a trigger for consultation rather than leaving it vague. Training and phased implementation can ease familiarity issues. 

  For the memo structure: start by acknowledging trade-offs, recommend ranges with minimax rule, design escalation protocols that treat uncertainty as an action signal, address dilation through education, and propose a pilot timeline with nursing input. Stress that actionability comes from clear pathways, not forced precision. This balances philosophical rigor with clinical pragmatism.
answer: |-
  ## Memorandum: Clinical AI Governance Committee  
  **To:** Committee Members  
  **From:** [Your Name], Philosophy Department & Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Deterioration-Risk Algorithm Rollout: Imprecise Probability Protocol & Decision Framework  

  ### I. Background & Problem Statement
  The proposed shift from a single calibrated probability point estimate to an **imprecise probability range** (reflecting genuine epistemic uncertainty for patients with sparse/atypical data) is scientifically sound. It addresses the ethical imperative to avoid false precision, which can mislead clinical judgment. However, significant questions arise when a patient's probability range *straddles the clinical alert threshold*:
  1.  **Decision Rule Conflict:** Natural rules (e.g., *Maximin Expected Benefit* vs. *Maximax Expected Benefit*) yield conflicting recommendations or indecision.
  2.  **Dilation Phenomenon:** Confirmatory tests may widen the range, correctly reflecting increased uncertainty but potentially unsettling clinicians.
  3.  **Actionability Concern:** Nursing leadership rightly warns that ambiguous recommendations risk being ignored at the bedside, undermining patient safety.

  ### II. Recommendation: Implement Imprecise Probability with a Defined Safety-First Framework
  **A. Core Recommendation: Adopt Imprecise Probability Reporting**  
  *   **Rationale:** Accuracy demands acknowledging when data cannot support a precise estimate. Suppressing this uncertainty with a point estimate is statistically inappropriate and ethically dubious. It forces a false sense of confidence that could lead to under- or over-treatment.

  **B. Decision Rule for Straddling Ranges: The Safety-First Principle (Maximin Expected Utility)**  
  *   **Rule:** When the probability range *straddles the clinical alert threshold*, **ACT AS IF THE PATIENT IS ABOVE THRESHOLD** (i.e., escalate care).  
  *   **Justification:**  
      *   **Clinical Asymmetry:** The potential harm of failing to escalate a deteriorating patient (false negative) typically *far outweighs* the harm/cost of an unnecessary escalation for a stable patient (false positive).  
      *   **Avoiding Paralysis:** Maximin provides a *determinate action* (escalate) in borderline cases, resolving indecision.  
      *   **Epistemic Humility:** It respects the genuine uncertainty by erring on the side of caution when uncertainty exists precisely where the threshold lies.  
      *   *Rejected Alternative:* The Maximax rule (act if *any* distribution in the range justifies it) risks under-escalation in the worst-case scenario, which is unacceptable for patient safety.

  **C. Escalation Protocol for Borderline Cases: "Uncertainty Triggers Review"**  
  To address actionability and the nature of dilation:  
  1.  **Algorithm Output:**  
      *   Visual display: Clearly show the probability range and the alert threshold.  
      *   **"Action Status":**  
          *   **"High Confidence Alert" (Range entirely above threshold):** Standard escalation protocol.  
          *   **"High Confidence Clear" (Range entirely below threshold):** Routine monitoring.  
          *   **"Uncertainty Alert" (Range straddles threshold):** Triggers Protocol 2A.  
  2.  **Protocol 2A: Uncertainty Alert Pathway**  
      *   **Mandatory Clinical Review:** Requires *immediate* assessment by the primary nurse *plus* either the charge nurse or the covering resident physician (depending on time/shift).  
      *   **Focused Assessment:** Review requires specific, targeted actions:  
          *   Repeat/validate key vitals.  
          *   Perform a focused physical exam (e.g., respiratory effort, mentation, perfusion).  
          *   Review recent trends and medication history.  
      *   **Decision Point (5-15 mins):** Based on this rapid assessment, the reviewing clinician(s) make a binary decision:  
          *   **"Escalate to Full Protocol"** (Treat as High Confidence Alert) OR  
          *   **"Enhanced Monitoring"** (Increase monitoring frequency to q30-60mins for next 2-4 hours; reassess per protocol or if condition changes).  
      *   **Documentation:** Reason for Uncertainty Alert and outcome of Protocol 2A review must be documented in the EHR.

  **D. Addressing Dilation & Uncertainty**  
  *   **Acknowledge & Educate:** Dilation (widening range after testing) is *not a flaw*; it is a mathematically coherent feature reflecting that new data *revealed* greater uncertainty than previously apparent. This is crucial information.  
  *   **Mitigation via Protocol:** Protocol 2A directly addresses dilation. If a confirmatory test *increases* uncertainty (dilation), the "Uncertainty Alert" is triggered, mandating human clinical synthesis. This transforms dilation from a confusing output into a *safety signal* demanding human expertise.  
  *   **Training:** Mandatory training must emphasize:  
      *   The meaning of the range and "Uncertainty Alert."  
      *   Why dilation occurs and why it matters.  
      *   The rationale for the Safety-First rule and Protocol 2A.  
      *   Role-playing Protocol 2A scenarios.

  **E. Addressing the Actionability Concern**  
  Nursing leadership's concern is **valid and central**. Ambiguity *is* a barrier to safe action. Our solution directly targets this:  
  1.  **No Ambiguous Output:** The algorithm provides one of three clear "Action Status" labels. "Uncertainty Alert" is *not* "maybe act"; it is a clear command: **"Perform Protocol 2A NOW."**  
  2.  **Protocol 2A Provides Concrete Steps:** It replaces indecision with a defined, time-bound pathway for human intervention.  
  3.  **Ownership & Clarity:** Assigns clear responsibility (nurse + charge/resident) for rapid assessment and decision.  
  4.  **Familiarity Through Training & Design:** The structured protocol uses familiar concepts (mandatory review, focused assessment, binary decision) embedded within existing workflows. The novelty lies in the *trigger* (the range/straddle), not the *response actions*.

  ### III. Implementation Timeline (Phased Rollout)
  *   **Week 1-2 (Post-Vote):** Finalize protocol details, EHR integration specs, and training materials (Committee + IT + Nursing Ed + Data Science).  
  *   **Week 3-4:** **Nursing/Clinician Training:** Focused sessions (online + in-person simulations) for all affected staff.  
  *   **Week 5-8:** **Pilot Phase (1-2 Units):** Implement algorithm + protocol on selected units. Daily huddles for feedback. Committee monitors closely.  
  *   **Week 9:** **Pilot Review:** Analyze process adherence, clinician feedback, timeliness, and preliminary safety data. Adjust protocol/training if needed.  
  *   **Week 10+:** **Full Rollout:** System-wide implementation, contingent on successful pilot review. Ongoing monitoring for 6 months.

  ### IV. Conclusion & Call to Action
  The imprecise probability model, paired with the **Safety-First (Maximin) decision rule** and the **structured "Uncertainty Triggers Review" escalation protocol (2A)**, offers the most ethically defensible and clinically actionable path forward. It embraces necessary uncertainty without succumbing to indecision, leverages human clinical judgment where the algorithm cannot be precise, and directly addresses the legitimate concerns about bedside actionability. Dilation is managed by making it an explicit trigger for clinical review.

  This approach balances statistical integrity, patient safety, ethical responsibility, and practical workflow needs. We **recommend adoption** of this framework and timeline.

  **Vote Requested:** Approve the rollout of the imprecise probability deterioration-risk algorithm using the Safety-First (Maximin) decision rule and Protocol 2A escalation pathway, according to the outlined implementation timeline.
