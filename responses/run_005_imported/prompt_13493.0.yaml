  So I'm writing the lit review section of my diss (cog sci, working on the zombie argument and modal arguments against physicalism) and I've hit a snag with the two-dimensional semantics literature. Chalmers and Jackson use the primary/secondary intension split to do real metaphysical work - its what lets the zombie argument go through, since they need it to be true that there are no "strong necessities" (cases where even a truth's primary intension is necessary, so conceivability and possibility come apart at the level of worlds). But when I went back and read Stalnaker's own stuff on diagonalization, it reads like a way more modest, pragmatic device about what gets communicated given uncertainty over context/common ground, not some a priori layer of content sitting in your head - he even frames his disagreement with Chalmers and Jackson as internalism vs externalism about intentionality, which threw me a bit.

  Can you actually spell out what's at stake between these two readings of the "same" formal apparatus? Specifically: why does Chalmers's anti-materialist argument need there to be no strong necessities, and why would Stalnaker's more deflationary take be tempted to allow them, or atleast not rule them out the same way? And don't just summarize both sides - tell me which reading of the framework you think is actually more defensible, and whether the disagreement even matters for stuff like the zombie argument, or if it's really just two different projects wearing the same formal clothes.
