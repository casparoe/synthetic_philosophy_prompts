  I should note the professor is clearly an expert—they mention Spooner, Smith, and precise constitutional clauses—so questions must reflect deep engagement. Their frustration with superficial biographical reenactment suggests they value intellectual rigor over performance. The follow-ups are crucial because doctoral students might retreat to rehearsed answers otherwise.  

