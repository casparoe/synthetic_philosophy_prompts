prompt: |-
  For my philosophy of physics seminar we just spent two weeks on Bell's theorem, and I walked in thinking I had the standard takeaway down cold: local hidden variables are dead, nature is nonlocal, end of story. Then my TA mentioned superdeterminism almost as a throwaway line -- the idea that you can actually keep locality if you're willing to give up the assumption that the experimenters' choice of measurement settings is statistically independent of whatever hidden variables are governing the particles, since that's technically a seperate assumption from locality itself in the actual derivation. She basically called it "the conspiracy option" and moved on to the next slide, but a friend of mine who's way into 't Hooft and Hossenfelder's work says that objection is kind of question-begging, since in any garden-variety deterministic universe our "choices" are already fixed by earlier physical states anyway, conspiratorial or not.

  I feel like I've only heard one side of this presented fairly, and I want to actually see the strongest version of both. Could you write me a dialogue between a committed superdeterminist and someone who thinks Bell's theorem establishes genuine physical nonlocality (a Bohmian, say, or just someone in the Bell/Maudlin camp), where they really go back and forth instead of one just dunking on the other? I want the superdeterminist to have an actual answer to the "that's unfalsifiable and it wrecks the scientific method" objection, and I want the nonlocality defender to press back hard rather than just repeating the dismissal I got in class -- right now the debate feels one-sided only because I've never heard the other side argued properly.
