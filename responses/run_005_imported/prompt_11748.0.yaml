  Move 2: Gabe introduces the fragility analogy. The glass (loyalty) is real but circumstantial factors (cushion) can prevent it from breaking. Marisol rebuts by saying the cushion here is Iris's fear, part of the same self-preservation that loyalty should override. That's a strong point because it questions whether loyalty is a separate trait.

