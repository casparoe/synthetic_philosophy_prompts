  ### Key Overlooked Issues
  1. **Counterfactual Unverifiability**:  
     Traders can't validate unchosen policies' outcomes, creating irreducible uncertainty. Without ground truth, markets rely on speculation, not information—making them vulnerable to narratives over data.  

  2. **Welfare Metric Manipulation**:  
     Even with honest markets, defining the welfare metric democratically invites lobbying (e.g., industries pushing for GDP over climate metrics). This separates "winning fairly" from "improving welfare."  

  3. **Equilibrium Collapse**:  
     Underdog policy research dies not just from voiding, but because traders know others won't invest effort—a coordination failure no subsidy fixes. This mirrors Keynes' beauty contest: prices reflect perceived popularity, not truth.  

  **Conclusion**: Marcus wins narrowly (5 net points vs. Elena’s 1) by exposing critical failure modes, but both underweight how futarchy’s reliance on unobservable counterfactuals undermines its theoretical foundations. No engineering fix resolves this epistemic gap.
