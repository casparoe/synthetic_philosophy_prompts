prompt: |-
  I co-host a tiny podcast with two coworkers where we get people from the AI safety world on to talk shop (none of us have a philosophy background, were just engineers who got nerd-sniped by this stuff). Next week's guest is a researcher whose whole pitch is that the AI shutdown/off-switch problem can't be fixed by tweaking the utility function -- she argues you have to train the agent to have genuinely incomplete preferences between trajectories where shutdown happens at different times, plus a 'timestep dominance' rule, instead of the older Armstrong-style trick of just making the agent indifferent (same payoff whether the button gets pressed or not).

  I don't want her just restating that pitch for the tenth time, so can you draft 8-10 questions that actually push on it. I want at least one on why the old indifference trick runs into the 'managing the news' problem that MIRI's original 2015 corrigibility paper flagged, and why incompleteness is supposed to dodge that same trap. One on the obvious decision-theory comeback -- incomplete preferences make you exploitable via money-pumps, so isn't she just trading one failure mode for another. And one on whether any of this survives contact with an agent thats smart enough to spin up successor agents or subagents -- doesn't the standard argument say a reflective agent would just complete its own preferences the first chance it gets, purely to avoid being pumped, which undoes the whole fix. For each of those three give me a sharp follow-up keyed to whatever answer she'd most likely give so it doesn't stall after her first response, then fill out the rest with other good questions from the same neighborhood.
