  **Key Issues Justifying the Mach_and_GR Score (3/5):**
  1.  **"Ended up confirming Mach's principle":** This is factually contentious. While GR was *inspired* by Mach and exhibits Machian features (e.g., the Lens-Thirring effect shows local inertial frames are influenced by rotating mass), it does *not* universally satisfy Mach's Principle. Specific counterexamples within GR:
      *   **Gödel's Rotating Universe:** Features absolute rotation detectable *without* reference to distant matter.
      *   **Asymptotically Flat Spacetimes:** Inertial properties exist even in the complete absence of distant matter.
      *   **Einstein's Regret:** Einstein famously stated in 1954: "It is not satisfying that... the inertia of a body should depend on the presence of other matter in the universe, but *not at all* on its state (e.g., rotation)."
  2.  **"Showing Newton's absolute space was never actually needed":** While GR eliminates Newton's *static, immutable* absolute space, it replaces it with a dynamical spacetime structure that *still* defines absolute acceleration (via geodesic deviation). This structure isn't reducible *only* to relations between matter distributions in all GR solutions. Denny implies a complete victory for relationism via GR, which is inaccurate.

  **Recommendation for Your Novel:** Denny's reasoning for parts (a), (b), and the *statement* of Mach's response is solid and steal-worthy for a genius character. For the GR part, make the character more nuanced:
