  *   "...but frustratingly, the equations also allow universes where inertia exists utterly independent of the cosmic matter distribution, so Newton's ghost isn't *fully* exorcised..."
  *   "...it showed absolute space wasn't needed, but the debate about what grounds inertia shifted to the structure of spacetime itself."

