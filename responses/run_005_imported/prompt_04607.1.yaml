  ## Dialogue: The Kelly Fraction Fracas

  **Setting:** A sleek investment firm office. Two portfolio managers, ALEX (VNM loyalist) and TAYLOR (geometric rationality advocate), stand before a live trading terminal displaying a volatile asset. They must decide what fraction *f* of their $10M shared bankroll to stake on a favorable bet: 55% chance of doubling the staked amount, 45% chance of losing it all. This bet repeats daily.

  ---

  **ALEX:** (Pointing at the terminal) Expected value is clear: 0.55 * (2fW) + 0.45 * (-fW) = 0.65fW. Maximizing expected wealth means betting *f* = 1.0. Full stake.

  **TAYLOR:** And risk ruin? We’re not facing one bet but hundreds. Expected wealth maximization ignores sequence risk. If we lose the first bet, we’re bankrupt. We need to maximize the *growth rate* of our bankroll. Kelly says *f* = 0.55 - (0.45/1) = 0.10. Bet 10%.

  **ALEX:** So you’re maximizing expected *log* wealth. Fine—but that’s just VNM expected-utility theory with a logarithmic utility function. Independence axiom holds, no problem. Set *u*(W) = log(W), maximize E[*u*(new W)]. Kelly falls right out. Why overcomplicate it?

  **TAYLOR:** (Leaning forward) No, Alex. The utility function isn’t the point. Geometric rationality replaces VNM’s *arithmetic* averaging of outcomes with *geometric* averaging. We care about the product of growth multipliers across our actual path—one timeline, not many parallel universes. Independence forces arithmetic averaging. That’s the wrong picture for repeated bets.

  **ALEX:** Explain how it’s "wrong." If I maximize E[log W] at every step, I’m compounding optimally. What’s path-dependent? At decision time *t*, current wealth Wₜ is known. I maximize E[log Wₜ₊₁ | Wₜ]—conditionally independent bets. VNM handles this.

  **TAYLOR:** Because your VNM agent evaluates each bet as a standalone lottery. But in reality, the stakes are multiplicative: losing today shrinks future opportunity. Independence says: "Prefer lottery A to B? Then prefer A mixed with C to B mixed with C." But mixing bets *distorts the growth landscape*. Let me prove it’s different.

  *(Taylor scribbles)*  
  Suppose three lotteries:  
  - **A**: 50% win $0.50 per $1 staked, 50% lose $0.40 per $1 staked  
  - **B**: Certain win $0.01 per $1 staked  
  - **C**: 50% win $2.00 per $1 staked, 50% lose $1.00 per $1 staked  

  Geometric rationality prefers **B** to **A** (safer growth). But mix each 50/50 with **C**:  
  - **A+C mix**: 25% chance of growth factors: (1.5, 3.0), (1.5, 0.0), (0.6, 3.0), (0.6, 0.0)  
    Geometric avg: (1.5×3.0)^0.25 × (1.5×0.0)^0.25 × ... → **0** (ruin risk dominates)  
  - **B+C mix**: 50% (1.01, 3.0), 50% (1.01, 0.0) → Geometric avg ≈ (1.01×3.0)^0.5 × (1.01×0.0)^0.5 = **0**  
  *Now* we’re indifferent between A+C and B+C mixes! Independence demands we *still* prefer B+C if we preferred B alone. Geometric rationality violates that. It’s not just log utility—it’s averaging geometrically over paths.

  **ALEX:** (Frowning) Clever, but you’ve rigged C to include ruin. In practice, we avoid bets with positive probability of total loss. And with no ruin, VNM with log utility *doesn’t* violate independence. Your objection feels academic.

  **TAYLOR:** The principle stands! Geometric rationality cares about the *distribution of terminal wealth* after many bets. VNM cares about averaging utilities *at a fixed point*. For one long sequence, the first is objective. Your log utility function is a mathematical hack to mimic it—but it smuggles in ensemble thinking. We don’t live in the multiverse.

  **ALEX:** Hacks or not, they converge. And VNM protects against money pumps. If geometric rationality violates independence, I could pump you: charge you to swap A for B, then charge again to swap back after mixing with C. You’d pay to cycle endlessly.

  **TAYLOR:** (Smiling) Only if you offer arbitrary side bets mid-sequence. But we’re committing to a fixed *f* upfront for all bets. No opportunistic side-deals. Geometric rationality with a pre-commitment strategy is pump-proof. Your pump requires *conditional* re-evaluations we forbid. Different decision architecture.

  **ALEX:** But shouldn’t a robust theory handle all scenarios? What if an unexpected side bet *does* appear? VNM agents won’t take exploitative paths. You might.

  **TAYLOR:** Fair. But our aim is optimal growth for *this specific repeated bet*. For that, geometric rationality is the natural criterion. VNM’s linear averaging distorts long-term outcomes. Betting full stake (*f*=1.0) gives highest E[W] but almost certain ruin. Betting Kelly (*f*=0.10) sacrifices arithmetic expectation for geometric dominance. We’re not utility-maximizing zombies; we’re growth-survivalists.

  **ALEX:** ...I’ll concede Kelly is smarter than full-staking. But I still think it’s VVM in a log-shaped trench coat. If we use *u*(W) = log W, we get the same *f* = 0.10 without axing independence. Why burn down the cathedral?

  **TAYLOR:** Because the cathedral was built for single bets! Repeated stakes demand a new foundation—one where multiplying probabilities isn’t optional. VNM with log utility gets the answer right but tells the wrong story: "You’re risk-averse." Geometric rationality says: "You’re optimizing survival in linear time." Same fraction, different philosophy.

  **ALEX:** (Sighs) So we bet 10% today. But I’m watching for money pumps. And if we survive, we revisit the axioms tomorrow.

  **TAYLOR:** Deal. Let’s make history—one multiplicative step at a time.

  *(They input the trade: 10% of bankroll staked.)*

  ---

  **Key Tensions Explored:**  
  1. **Risk of Ruin vs. Expected Wealth**: Taylor’s emphasis on survival in a single sequence vs. Alex’s ensemble thinking.  
  2. **Utility Functions vs. Averages**: Whether Kelly is VNM with log utility (Alex) or a non-VNM geometric paradigm (Taylor).  
  3. **Independence Axiom Violation**: Taylor’s counterexample showing geometric rationality violates independence; Alex’s money-pump concern.  
  4. **Decision Context**: Taylor’s focus on pre-commitment in repeated bets vs. Alex’s demand for robustness to side bets.  

  Neither concedes; both refine their stance. The mathematical equivalence of Kelly and log utility is acknowledged, but its interpretation splits their meta-philosophy of decision-making.
