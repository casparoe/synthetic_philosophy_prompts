prompt: |-
  I spent my career in behavioral ecology, where I absorbed the standard lesson that cooperation between self-interested parties generally requires repeated encounters and reputation — the lesson of Axelrod's tournaments, in which tit-for-tat prevails only because the same players meet again and again. Now that I am retired and reading more widely, a puzzle from a friend who works in software has unsettled that lesson. He described two firms arranging a single, one-off deal in a country whose courts neither trusts, where ordinarily neither side wants to hand over its goods or payment first, since the other could then simply keep it and give nothing back, so that no deal can be made at all. His proposed fix is that each firm write its side of the bargain as a short program, fully visible to the other side in advance, that releases its own payment or goods only once specified conditions are met, rather than simply promising in plain language to behave. He insists that letting each firm inspect the other's decision-making program before anything is committed changes the strategic situation, even though nothing about the one-off, unenforceable nature of the deal has changed. I am inclined to doubt this: surely a firm could always show one piece of code while quietly running another, so reading a program in advance seems no more binding than hearing a promise. Is my friend onto something real about what mutual visibility of a decision procedure can accomplish that an exchange of promises cannot, or is my skepticism justified? And if he does have a point, I would like to know exactly what feature of the setup is doing the work.
reasoning: |-
  Okay, the user is a retired behavioral ecologist who's spent their career understanding cooperation through repeated interactions and reputation, based on Axelrod's tit-for-tat model. They're now encountering a puzzle from a software friend about a one-off deal between two firms in a country with untrustworthy courts. The friend claims that having each firm write a transparent, inspectable program to handle the transaction changes the game, even though it's still a single interaction without enforcement. The user is skeptical because they think a firm could just run different code than what they show. 

  Hmm, this is fascinating because it pits classical game theory against modern cryptographic concepts. The user's skepticism is totally valid from a behavioral ecology lens—without repetition or punishment, defection should dominate. But their friend is pointing at something deeper: the difference between promising an outcome and revealing the actual decision mechanism. 

  I need to unpack why executable code isn't just a fancy promise. The key is that with programs, you're not just declaring intent—you're sharing the exact *algorithm* that will execute the action. That shifts the game from "do I trust your word?" to "can I mathematically verify this machine will force cooperation?" The firms aren't trusting each other; they're trusting the deterministic behavior of code. 

  Ah! And the user's worry about secretly running different code? That's where cryptographic techniques like zero-knowledge proofs or trusted execution environments would come in—things their friend might be glossing over. But even without those, the mere act of mutually revealing decision algorithms creates a Nash equilibrium where unilateral deviation isn't profitable. 

  The user also wants to know "what feature is doing the work." That's spot-on—they're not just seeking a yes/no answer but the mechanistic driver. The answer lies in the shift from opaque promises to transparent, executable strategies. In Axelrod's tournaments, players adjusted behavior based on history; here, the programs eliminate the need for adjustment because they commit both players to cooperation by design. 

