answer: |-
  Your discomfort is intellectually serious and ethically grounded—and the connection you're probing is far from baseless. The inference of "philosophical contamination" isn't *necessarily* logically airtight, but it raises profound hermeneutic and methodological questions that deserve engagement. Let's break this down:

  1.  **The Valid Core of Your Concern:**
      *   **Thematic Resonance:** You've identified a compelling *structural affinity* between Frege's philosophical temperament (demand for absolute objectivity, hierarchy, anti-pluralism in logic/meaning) and his political temperament (authoritarianism, anti-pluralism in society). This isn't mere coincidence; it reflects a deep-seated intellectual disposition. Frege sought order, certainty, and foundations *everywhere*.
      *   **"Neutrality" Challenged:** Your core insight—that Frege's apparatus *might not be the purely neutral, technical tool it's often treated as*—is crucial. His conception of the "third realm" of objective thoughts, divorced from messy human psychology and history, *can* be seen as implicitly devaluing the contingent, the perspectival, and the socially situated. This *does* resonate with his political rejection of messy democracy and pluralism.
      *   **Context Matters:** Ignoring the diary *now* feels intellectually dishonest. Scholarship evolves. Dummett's shock underscores that this *changes* how we see Frege the man, and by extension, how we contextualize his work. Pretending it doesn't exist is no longer tenable.

  2.  **Where Caution is Needed (The "Contamination" Question):**
      *   **Not Logical Entailment:** There is no *necessary* logical connection between believing in objective thoughts and being antisemitic. Many philosophers committed to objective truth, anti-psychologism, and logical rigor (including many Jewish philosophers!) held diametrically opposed political views. The *specific content* of his bigotry isn't *derived* from the sense/reference distinction.
      *   **Separability of Ideas:** The *usefulness* and *validity* of the sense/reference distinction, the concept of a thought, or the critique of psychologism within logic and philosophy of language can be (and has been) evaluated and deployed independently of Frege's personal politics. The tool *can* be used for purposes Frege would have abhorred (e.g., analyzing diverse linguistic practices).
      *   **Risk of Over-Identification:** Attributing the *origin* or *sole motivation* of his philosophical work to his political authoritarianism risks reductionism. His philosophical problems (responding to psychologism, grounding mathematics) were genuine and shared by others. The *intensity* and *style* of his solution might reflect his temperament, but the problems themselves were real.

  3.  **Navigating Your Dissertation Chapter:**
      *   **This Absolutely Deserves More Than a Footnote:** A footnote feels inadequate and dismissive of the profound unease you (and others like Dummett) rightly feel. However, it doesn't necessarily demand a fundamental rewrite of your core argument *about the philosophy itself* for this specific chapter.
      *   **Consider a Substantive "Methodological/Contextual" Section:** Near the beginning or end of your chapter (or perhaps in your introduction/conclusion framework), include a dedicated section (1-3 pages) addressing this tension. Frame it clearly:
          *   **Acknowledge the Diary:** State its existence, its shocking content, and its impact on Frege scholarship (cite Dummett, Sluga, Weiner, etc.).
          *   **State the Question:** Explicitly pose the question you've raised here: Does the *impulse* towards absolute objectivity, hierarchy, and anti-psychologism in his philosophy resonate disturbingly with the authoritarian, anti-pluralist impulse in his politics? Is there a risk that his apparatus carries an implicit devaluation of contingency?
          *   **Nuance Your Position:** Explain that while the *specific* political content isn't logically entailed, the shared *structural temperament* is undeniable and warrants critical reflection. Acknowledge the counter-argument (separability of ideas) but insist that the *context* of the work's creation is now irrevocably altered.
          *   **Clarify Your Scope:** Explicitly state that while this contextual concern is crucial and impacts how we read Frege *holistically*, your *current* chapter focuses on the internal philosophical coherence, development, or implications of the sense/reference distinction *within the domain of logic and philosophy of language*. You are engaging with the *ideas* as they function within that discourse, while remaining critically aware of their problematic origin.
          *   **Flag for Future Work:** Suggest that the relationship between Frege's philosophical temperament and his politics deserves deeper exploration, perhaps as part of your dissertation's conclusion or future research.

  4.  **Why This Approach:**
      *   **Intellectual Honesty:** It confronts the elephant in the room without letting it trample your specific philosophical analysis.
      *   **Scholarly Responsibility:** It shows your committee you are aware of the latest scholarship and the ethical complexities involved in working on historically problematic figures.
      *   **Manages Scope:** It allows you to meet your deadline by focusing your chapter's core argument while still signaling the larger, unavoidable context.
      *   **Opens Dialogue:** It positions your work as part of an ongoing critical conversation about Frege, rather than pretending the diary doesn't exist or that its implications are settled.
      *   **Avoids Premature Conclusions:** It doesn't force you to definitively "solve" the contamination question now, but acknowledges its force and relevance.

  **Conclusion:** Your inference identifies a real and troubling *affinity*, not a logical *contamination* in the strictest sense. The danger lies in mistaking the tool (sense/reference) *itself* as inherently expressing the politics, rather than seeing it as a tool forged by someone *whose broader worldview* included those politics. However, the *aspiration* behind the tool – the yearning for a singular, mind-independent order immune to human diversity – *is* shared. **Therefore, this absolutely merits serious attention in your dissertation.** Handle it with nuance and contextual framing within your chapter, explicitly separating (for now) the focused philosophical analysis from the necessary critical engagement with Frege's troubling legacy. This isn't confusion on your part; it's the emergence of a deeper, more critical layer of understanding that responsible scholarship must now incorporate.

  **Key Scholars to Briefly Engage/Cite in your contextual section:**
  *   Michael Dummett (for the shock/reaction)
  *   Hans Sluga (*Frege's Target* argues for deep political/cultural context shaping Frege's *problems*)
  *   Joan Weiner (*Frege: The Pure Business of Being True* - more sympathetic, but engages context; also *Frege Explained* touches on it)
  *   Pierre Adler (on the diary's implications)
  *   Perhaps a reference to the broader "Heidegger problem" literature as an analogous case study in separating philosophy from poisonous politics.

  You are grappling with a fundamental challenge in the history of philosophy: how to engage rigorously with powerful ideas created by flawed, even morally repugnant, individuals. Your awareness of this tension is a sign of intellectual maturity, not confusion. Address it head-on, with the nuance it deserves.
