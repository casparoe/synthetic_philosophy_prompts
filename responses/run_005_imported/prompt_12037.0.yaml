prompt: |-
  A friend and I spent a long evening arguing about anthropic reasoning without ever resolving the disagreement at the heart of it. She thinks the "presumptuousness" of Bostrom's Presumptuous Philosopher case is really just an artifact of how lopsided the two theories' observer populations are in the original version — they differ by many orders of magnitude — and that shrinking that gap would stop the Self-Indication Assumption's (SIA) verdict from looking absurd. I think the objection is structural rather than a matter of degree, and should survive even when the population ratio between the theories is quite modest. Construct a version of the Presumptuous Philosopher scenario with a much smaller disparity between the two theories' predicted observer counts than Bostrom's original, work out the credences that the Self-Sampling Assumption (SSA) and SIA would each assign in it, and use the result to say which of us has the better argument.
reasoning: |-
  We are going to construct a version of the Presumptuous Philosopher scenario with a modest disparity in the number of observers between two theories.

  Original Presumptuous Philosopher (as per Bostrom):
  - Theory 1: predicts that there are 10^10 observers in the universe.
  - Theory 2: predicts that there are 10^10^10 observers (a vastly larger number).

  We'll create a scenario with a much smaller ratio. Let's say:
  - Theory A: predicts that there are N observers.
  - Theory B: predicts that there are 2N observers (only twice as many).

  We'll set up the experiment as follows:
    - We are about to perform an experiment that will tell us which theory is true.
    - But before we do, we want to assign prior probabilities to the two theories.

  According to the Self-Sampling Assumption (SSA): we should reason as if we are a random observer from all observers that will ever exist. However, SSA typically conditions on the fact that we exist and on the "reference class" of observers. The prior probabilities of the theories are updated by the fact that we are observing what we are.

  According to the Self-Indication Assumption (SIA): we should reason as if we are more likely to exist in a world with more observers. Hence, SIA favors theories that predict more observers.

  In the original Presumptuous Philosopher, SIA would assign a prior probability to theory 2 that is almost 1 (because 10^10^10 is so much larger than 10^10). This seems presumptuous because we haven't done the experiment and yet we are virtually certain of the theory with more observers.

  Now, let's set up a small disparity case.

  Scenario:
    - Two theories: T1 and T2.
    - T1: There are 100 observers in the entire universe (or relevant domain).
    - T2: There are 200 observers.

  We assume that both theories are equally likely a priori (prior probability 0.5 each).

  We are one observer. We don't know which theory is true.

  According to SSA:
    - The probability of being a particular observer in T1 is 1/100 (if T1 is true).
    - The probability of being a particular observer in T2 is 1/200 (if T2 is true).
    - We can use Bayes' theorem to compute the probability of T1 given that we exist (which we do).

  But note: our existence is given. We condition on the fact that we are an observer.

  Bayes' theorem:

    P(T1 | I exist) = P(I exist | T1) * P(T1) / P(I exist)

  However, under T1, the probability that I exist (as a specific observer) is 1/100? But note: we are not a specific observer in the sense of having a particular identity. We are just some observer. So we must be careful.

  In SSA, we reason as if we are randomly selected from all observers that will ever exist. So:

    P(I exist | T1) = 1   [because in T1 there are 100 observers, and we are one of them? But note: we are considering the chance of being an observer at all, which is 1 in T1?]

  Actually, the typical SSA approach is to condition on being an observer. The fact that we are an observer is given. So we condition on the reference class of observers. Then:

    P(being this particular observer | T1) = 1/100

  But note: we are not a particular observer. We are just an observer. So we might consider the chance of being in a universe with a given total number of observers.

  Alternatively, we can think of the probability that we exist at all. However, in both theories, we exist. So we condition on our existence.

  But note: in SSA, the probability that we would be observing what we are is the same as the probability that we are one of the observers in that universe. So:

    P(our current indexical information | T1) = 1/100   [if we are one of the 100]

    P(our current indexical information | T2) = 1/200

  Then by Bayes:

    P(T1 | indexical info) = P(indexical info | T1) * P(T1) / [ P(indexical info | T1)*P(T1) + P(indexical info | T2)*P(T2) ]

    = (1/100 * 0.5) / [ (1/100 * 0.5) + (1/200 * 0.5) ]
    = (0.5/100) / [0.5/100 + 0.5/200]
    = (1/100) / [1/100 + 1/200]   [multiplying numerator and denominator by 2]
    = (1/100) / [ (2/200 + 1/200) ] 
    = (1/100) / (3/200)
    = (1/100) * (200/3)
    = 200 / (300)
    = 2/3

    Similarly, P(T2 | indexical info) = 1/3.

  So SSA says that T1 is more probable because it has fewer observers and thus we are more likely to be one of them in a smaller universe.

  Now, according to SIA:

    SIA says: we should weight each theory by the number of observers it predicts. So:

    P(T1 | indexical info) ∝ P(T1) * (number of observers in T1)
    P(T2 | indexical info) ∝ P(T2) * (number of observers in T2)

    Since P(T1)=P(T2)=0.5, we have:

    P(T1 | indexical info) ∝ 100
    P(T2 | indexical info) ∝ 200

    Normalizing: total = 100 + 200 = 300

    So P(T1 | indexical info) = 100/300 = 1/3
    P(T2 | indexical info) = 200/300 = 2/3

  Therefore, SIA assigns a higher probability to T2 simply because it predicts more observers.

  Now, the question: is this presumptuous? We haven't done the experiment and yet SIA tells us that the theory with twice as many observers is twice as likely.

  In this case, the ratio is only 2:1. So the prior credence for T2 is 2/3. This might not seem as absurd as the original case where the ratio was astronomical. However, note that we have no empirical evidence for T2 over T1. The only reason we assign T2 a higher prior is because it has more observers.

  But wait: we are using our existence as evidence. The argument is that we are more likely to exist in a universe with more observers. This is the core of SIA.

  Now, to answer the question: which of us has the better argument?

  The friend argues that the presumptuousness is due to the lopsidedness. In our small ratio case, the SIA prior is 2/3 for T2 and 1/3 for T1. This may not seem absurd. However, note that without any evidence, we are already leaning toward the theory with more observers. And we are about to do an experiment that will tell us the truth. If we were to stop and not do the experiment, we would assign a 2/3 chance to T2. But we have no empirical data to support that.

  Moreover, note that the SSA prior (without the indexical information) was 0.5 for each. But after conditioning on the fact that we exist (which we must), SSA ends up favoring the theory with fewer observers (2/3 for T1). This also seems counterintuitive: why should our existence make the theory with fewer observers more likely?

  So both approaches have counterintuitive consequences. However, the key point is that even with a modest ratio (2:1), SIA still assigns a higher probability to the theory with more observers without any empirical evidence. This is the structural feature that the original objection points to. Therefore, the objection is structural and survives even with a modest ratio.

  Thus, the original poster (the user) has the better argument: the issue is structural and not due to the lopsidedness.

  But note: the friend might argue that with a modest ratio the result (2/3) is not so bad. It's not as if we are virtually certain of T2. However, the point is that we are still favoring T2 without evidence. And if we imagine repeating the scenario with a series of experiments that have the same structure, we might accumulate evidence in favor of T2 without ever having seen any empirical data that supports it. This is the core of the objection.

  Therefore, the conclusion is that the objection to SIA is structural and holds even for modest disparities.
answer: |-
  To address the disagreement, I'll construct a modified Presumptuous Philosopher scenario with a modest population ratio (avoiding orders-of-magnitude disparities), compute the credences under the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA), and analyze the implications.

  ### **Modified Scenario: The Balanced Presumptuous Philosopher**
  - **Theory A**: Predicts there are **100 observers** in total (e.g., in our observable universe or a relevant domain).  
  - **Theory B**: Predicts there are **200 observers** (twice as many as A, but only a 2:1 ratio—far smaller than Bostrom's original).  
  - **Prior probabilities**: Both theories are equally likely before considering anthropic effects, so \( P(A) = P(B) = 0.5 \).  
  - **Setup**: You (the observer) know this setup and exist. No empirical evidence distinguishes A and B yet.  

  ---

  ### **Credences Under SSA and SIA**
  #### **1. Self-Sampling Assumption (SSA)**  
  SSA states: *"One should reason as if one were randomly selected from the set of all possible observers."*  
  - Under **A**, there are 100 observers. The probability of being you (or any specific observer) is \( \frac{1}{100} \).  
  - Under **B**, there are 200 observers. The probability of being you is \( \frac{1}{200} \).  

  Using Bayes' theorem to update the prior \( P(A) = P(B) = 0.5 \):  
  \[
  P(A | \text{you exist}) = \frac{P(\text{you exist} | A) \cdot P(A)}{P(\text{you exist})}
  \]  
  \[
  P(\text{you exist}) = P(\text{you exist} | A) \cdot P(A) + P(\text{you exist} | B) \cdot P(B)
  \]  
  \[
  P(\text{you exist}) = \left( \frac{1}{100} \cdot 0.5 \right) + \left( \frac{1}{200} \cdot 0.5 \right) = \frac{0.5}{100} + \frac{0.5}{200} = \frac{1}{200} + \frac{1}{400} = \frac{3}{400}
  \]  
  \[
  P(A | \text{you exist}) = \frac{\frac{1}{100} \cdot 0.5}{\frac{3}{400}} = \frac{\frac{1}{200}}{\frac{3}{400}} = \frac{1}{200} \cdot \frac{400}{3} = \frac{2}{3}
  \]  
  \[
  P(B | \text{you exist}) = 1 - P(A | \text{you exist}) = \frac{1}{3}
  \]  

  **SSA result**:  
  - \( P(A) = \frac{2}{3} \), \( P(B) = \frac{1}{3} \)  

  #### **2. Self-Indication Assumption (SIA)**  
  SIA states: *"One should reason as if their own existence is evidence for theories that predict more observers."*  
  - SIA weights theories by their predicted number of observers. The likelihood of existing is proportional to the number of observers.  

  Posterior probabilities are:  
  \[
  P(A | \text{you exist}) \propto P(A) \times \text{number of observers in A}
  \]  
  \[
  P(B | \text{you exist}) \propto P(B) \times \text{number of observers in B}
  \]  
  \[
  P(A | \text{you exist}) \propto 0.5 \times 100 = 50
  \]  
  \[
  P(B | \text{you exist}) \propto 0.5 \times 200 = 100
  \]  
  Normalize: Total weight = \( 50 + 100 = 150 \)  
  \[
  P(A | \text{you exist}) = \frac{50}{150} = \frac{1}{3}
  \]  
  \[
  P(B | \text{you exist}) = \frac{100}{150} = \frac{2}{3}
  \]  

  **SIA result**:  
  - \( P(A) = \frac{1}{3} \), \( P(B) = \frac{2}{3} \)  

  ---

  ### **Analysis: Who Has the Better Argument?**
  - **Your friend's claim**: The absurdity of SIA in Bostrom's case (e.g., \( 10^{10}\) vs. \( 10^{10^{10}} \)) is due to extreme lopsidedness. A modest ratio (like 2:1) should make SIA's verdict reasonable.  
  - **Your claim**: The objection to SIA is structural—it presumes theories with more observers are more likely *without empirical evidence*—and holds even for modest ratios.  

  #### **Key Observations**  
  1. **SIA's verdict with modest ratio**:  
     - Even with a small 2:1 disparity, SIA assigns **double the credence** to Theory B (\( P(B) = \frac{2}{3} \)) solely because it predicts more observers.  
     - This happens despite:  
       - No empirical data favoring B.  
       - Equal prior probabilities for A and B.  
     - **Result**: SIA still "presumes" B is more likely based purely on observer count.  

  2. **SSA's contrasting verdict**:  
     - SSA favors **A** (\( P(A) = \frac{2}{3} \)) because your existence is less surprising if fewer observers exist.  
     - This is also counterintuitive (why prefer a smaller universe?), but it doesn't presume larger theories are better.  

  3. **Structural objection to SIA**:  
     - SIA's core logic—weighting theories by observer count—always biases toward larger populations, regardless of the ratio.  
     - In this modest-ratio scenario:  
       - SIA gives B a \(\frac{2}{3}\) credence based *only* on its higher observer count.  
       - If you halt the experiment and never collect data, SIA concludes B is twice as likely as A.  
     - **This is the essence of "presumptuousness"**: SIA treats *your existence itself* as stronger evidence for theories with more observers, even with no other information.  

  #### **Verdict**  
  - **Your argument wins**. The objection to SIA is structural, not dependent on extreme lopsidedness:  
    - A modest 2:1 ratio still produces a credence shift (from 50% to 67%) that relies purely on SIA's anthropic bias.  
    - This shift feels less "absurd" than Bostrom's original (e.g., 99.999...% credence), but the *logic* is identical: SIA presumes larger theories are better without evidence.  
  - **Why your friend is partially right but misses the point**:  
    - Lopsidedness amplifies SIA's counterintuitiveness (e.g., 67% vs. 99.999...%), making it more glaring.  
    - However, the core issue—**non-empirical preference for larger populations**—persists even at modest ratios. Reducing lopsidedness makes SIA *less extreme* but doesn't resolve the structural flaw.  

  ### **Conclusion**  
  The disagreement hinges on whether SIA's presumptuousness is a matter of degree (your friend) or structure (you). This scenario shows that SIA's bias toward larger populations is inherent to its logic and appears even with a 2:1 ratio. While modest ratios soften the *practical impact* (67% credence feels less dogmatic than near-100%), they don't eliminate the core issue: **SIA uses observer-count as evidence without empirical justification**. Thus, the objection to SIA is structural, and your argument holds.
