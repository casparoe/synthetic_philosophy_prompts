  ## Spandrels at the Wedding

  **Setting:** A grand, slightly faded wedding reception hall. High vaulted ceilings arch overhead, converging in a central dome. The curved triangular spaces between the arches (pendentives, technically, though often colloquially called spandrels) are richly painted with intricate, somewhat faded biblical scenes. The air hums with chatter, clinking glasses, and distant music. RENATA (50s, sharp suit, confident posture) and TOMAS (50s, rumpled jacket, intense eyes) find themselves momentarily isolated near a column, holding drinks, avoiding the dance floor. An awkward silence hangs after initial forced pleasantries about the bride.

  **TOMÁŠ:** (Tilting his head back, squinting upwards) Still magnificent. Even after all these years. Look at that... the *workmanship*. The way the artist filled the space... not because the story demanded it, but because the *architecture* created the canvas. Pure geometry dictating form.

  **RENATA:** (Following his gaze, a wary look dawning) Oh, for heaven's sake, Tomáš. Not this again. It’s a decorated pendentive. A structural necessity beautifully utilized. The artist *chose* those scenes. They have meaning.

  **TOMÁŠ:** (A spark ignites in his eyes) *Exactly*. The meaning came *after*. The form existed first. A byproduct of holding up the dome. A glorious accident, a constraint exploited. Sound familiar? Gould and Lewontin called it from the rafters, Renata. Forty-five years ago, and some people still build their careers painting selective stories onto every biological spandrel.

  **RENATA:** (Setting her glass down firmly) That tired accusation? The 'Panglossian Paradigm' was a *caricature*, Tomáš. A straw man Gould erected so he could heroically knock it down. Nobody serious – certainly not me – claims every single facet of an organism is the direct, optimized product of relentless selection for that specific function. That’s absurd. We look for *evidence*. We test hypotheses. We ask: *could* selection explain this trait, and does the evidence *support* that? When it does, overwhelmingly often, it *does*.

  **TOMÁŠ:** "Overwhelmingly often"? That’s the assumption baked in! The *burden* is placed on disproving selection! You start from the premise that if something *looks* functional, it *must* be an adaptation honed by selection. You see the painted scene and assume the artist *intended* that exact shape, rather than filling the space he was *given*. You look at the human chin and spin a tale about mate selection or chewing efficiency, ignoring the developmental constraints of jaw growth, the sheer historical baggage of bone structure inherited from fish ancestors!

  **RENATA:** (Leaning in, voice low but intense) And you look at the same chin, Tomas, and see *only* baggage? Only constraint? You dismiss the possibility of selection sculpting within those constraints? The chin *is* variable. It *is* subject to forces. We have evidence of sexual dimorphism in robusticity! That’s not a ‘just-so story’; it’s a testable observation! Your alternative – the null hypothesis of pure architectural happenstance – requires just as much evidence. Where’s *your* burden? To wave your hands and say ‘constraint!’ or ‘exaptation!’ every time selection provides a plausible, parsimonious explanation?

  **TOMÁŠ:** Parsimonious? Only if you ignore the complexity! Take the birdsong syllable you mentioned. You isolate one note, map it to a specific selective pressure – predator avoidance, let’s say. Fine. But what about the *entire* song structure? The developmental pathways that produce it, shared across species? The neurological constraints on learning and production? The sheer *pleiotropy* of genes involved? That single syllable might be a tiny, incidental variation within a massively constrained system, a note ‘painted’ onto a pre-existing musical scaffold. Calling it a specific adaptation ignores the symphony!

  **RENATA:** (A sharp, humorless laugh) The ‘symphony’ still has to *work*, Tomáš! If the incidental variation makes the bird *more likely to die* before reproducing, it vanishes. Selection *prunes*. It shapes even within your precious constraints. It exploits your exaptations! That birdsong syllable *might* be a spandrel. But if it consistently correlates with increased territorial defense or mate attraction across populations, if we can *manipulate* it and see fitness effects, then yes, selection has acted *on* that variation. It’s not about ignoring the scaffold; it’s about seeing how the paint interacts with the environment! You act like admitting selection’s pervasive power diminishes biology. It *is* biology’s most powerful engine!

  **TOMÁŠ:** (Gripping his glass tighter) Pervasive, yes. *Exclusive*? No. Omnipotent? Absolutely not. That’s the hubris. You grant selection the starring role in every scene, relegating everything else – development, physics, history, sheer chance – to bit parts. It blinds you! How many genuine insights into deep homology, into evo-devo pathways, into neutral evolution, were delayed because brilliant minds were chasing selective ghosts? How many research dollars poured into finding the adaptive significance of… (He gestures vaguely upwards)… the exact shade of blue in Rebecca’s robe up there, instead of asking *why* Rebecca ended up painted on a curved triangle in the first place?

  **RENATA:** (Eyes flashing, a decade-old wound touched) Research dollars… Now we get to it. Like the Grant That Shall Not Be Named? Where *your* brilliant insight was that the lizard’s dewlap color variation was *probably* just drift or a developmental fluke, and investigating selective gradients was a waste of time? A null hypothesis masquerading as profundity! My ‘ghost-chasing’ found a tight correlation with solar reflectance and predator camouflage in *three* distinct microhabitats. It got funded. It got published. It explained something real.

  **TOMÁŠ:** (Stiffening) And my point about the underlying chromatophore development pathways being conserved across species facing *no* similar selective pressure? Ignored. Because it didn’t fit the clean, selective narrative. It was messy. It suggested the *capacity* for variation existed first, and selection just tinkered with the knobs later. That *is* profundity, Renata. Understanding the knobs *themselves*.

  **RENATA:** Understanding the knobs is vital! But knowing *why* one knob gets turned more than another in a specific environment? That’s adaptation. That’s the heart of evolutionary change. You can’t just point at the ceiling and shout ‘Spandrel!’ every time you see something complex and beautiful. Sometimes… often… the beauty *is* the function.

  **TOMÁŠ:** And you can’t look at every beautiful function and assume it was the *original* purpose, sculpted to perfection. Sometimes the beauty is a happy accident, co-opted. Sometimes the function is a side-effect. (He sighs, the fight momentarily draining, replaced by weary familiarity) We’re still painting on different parts of the same damn ceiling, aren’t we? Twenty years later.

  **RENATA:** (Takes a slow sip of her drink, eyes still on the pendentives) It seems so. The architecture hasn’t changed. Just the… interpretations. And the stubbornness of the interpreters. (She glances at him, a flicker of something old – not warmth, perhaps, but recognition). Enjoy the wedding, Tomáš. Try not to spend the whole reception lecturing the bridesmaids on non-adaptive traits.

  **TOMÁŠ:** (A ghost of a smile touches his lips) Wouldn’t dream of it. Unless they ask about the floral arrangements… purely structural necessity, of course. Enjoy the champagne, Renata. Try not to calculate the selective advantage of the seating chart.

  *(They exchange a final look – old rivalry, old grudges, old intellectual trenches, momentarily framed by the painted constraints above them. Then Renata turns smoothly towards a group near the buffet. Tomáš takes a long look upwards again, lost in the curves and colors of the pendentives, before melting back towards the bar.)*

