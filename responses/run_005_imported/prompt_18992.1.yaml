  **Word Count:** 998

  **Key elements addressed:**

  1.  **Authentic Debate:** Both characters articulate core positions (Adaptationism vs. Pluralism/Spandrels/Constraints) with specific arguments and counter-arguments.
  2.  **Beyond Strawmen:**
      *   **Renata:** Clearly states she doesn't believe in *hyper*-adaptationism ("Nobody serious..."), invokes testing hypotheses and evidence, counters the "just-so" label by demanding evidence for *non*-adaptive explanations from Tomáš, and argues selection acts *within* constraints and *on* exaptations.
      *   **Tomáš:** Moves beyond just saying "spandrel!" to push specific mechanisms (developmental constraints, exaptation, pleiotropy, historical baggage, neutral evolution) and argues the *burden of proof* often wrongly favors adaptation. Uses the birdsong example to illustrate complexity beyond a single note.
  3.  **Responsive Dialogue:** Each point builds on the last:
      *   Pendentives -> Spandrels Accusation
      *   Caricature Defense -> Burden of Proof
      *   Burden of Proof -> Complexity/Constraints Example (Birdsong)
      *   Constraints -> Selection Prunes/Shapes Within Them
      *   Research Priorities -> Personal History (Grant)
      *   Grant -> Underlying Mechanisms (Knobs)
      *   Knobs vs. Turning Knobs -> Core Difference Restated
  4.  **Personal Grudge:** The grant conflict surfaces organically ("The Grant That Shall Not Be Named") within the intellectual debate, fueling the exchange without derailing it. It underscores their long history and the personal stakes.
  5.  **Setting Integration:** The physical pendentives/spandrels are the catalyst and the ongoing metaphor, visually reinforcing Tomáš's point and providing a tangible focus.
  6.  **Nuanced Ending:** The argument doesn't resolve; they simply retreat, acknowledging the fundamental and enduring nature of their disagreement ("painting on different parts of the same damn ceiling"). The final barbed well-wishes show the personal friction remains, wrapped in their intellectual identities.

  This dialogue aims to feel like two highly intelligent, passionate scientists who know each other's arguments intimately and have been refining their own positions for decades, using the wedding's architecture as the perfect spark to reignite their perennial battle.
