  So this semester my philosophy of AI seminar did a unit on Gödel's own views on minds vs. machines (that disjunction from his 1951 Gibbs lecture -- either the mind outruns every finite mechanical procedure, or there's some absolutely undecidable diophantine problem) right before we did a unit on MIRI's "Lobian obstacle": the result that a proof-based agent can never fully certify that its own future self's reasoning is sound, because Lob's theorem turns any such blanket certification into a proof of the very thing being certified, which just breaks the system. If Gödel had been briefed on modern self-modifying AI, what do you reckon he'd have said about this obstacle -- does it basically vindicate his old hunch that no mechanical system can fully underwrite its own reliability, or is it a narrower problem specific to demanding proof-based certainty that a more "mind-like" reasoner could sidestep? And what do you think he'd make of MIRI's actual patch for it, tiling agents that only ever pass down a slightly weaker form of trust to each successor -- real fix in his eyes, or just a clever workaround?
