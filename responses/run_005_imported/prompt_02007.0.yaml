prompt: |-
  Ok so I'm elbow-deep in research for a novel with a Galileo subplot, and I made the mistake of reading bits of his 1615 letter to the Grand Duchess Christina out loud at dinner, alongside Bellarmine's letter to Foscarini for context. Two friends, Ruth and Marcus, ended up arguing about it for like an hour and I need someone neutral to sort it out, I'm too deep in my own research to be objective anymore.

  Ruth's opening move: she said Bellarmine actually comes off better here. His letter says straight up that if heliocentrism were ever truly demonstrated, the church would have to go back and reinterpret the relevant scripture -- he just didnt think anyone had shown him that demonstration yet. Galileo, meanwhile, wanted that reinterpretation to happen right away, on the strength of a theory he hadn't proven himself. So by Galileo's own stated rule (nothing that "necessary demonstrations" prove should be questioned on scriptural grounds, but short of that, leave scripture alone), he was basically asking for an exception for himself.

  Marcus pushed back: by 1615 Galileo had already seen the phases of Venus and the moons of Jupiter, which had wrecked the traditional Ptolemaic picture. That's not nothing, that's serious evidence, and Bellarmine was hiding behind a standard of proof (geometric certainty) that no empirical claim could ever satisfy.

  Ruth's comeback: that evidence killed off pure Ptolemy, sure, but it didn't distinguish Copernicus's system from Tycho Brahe's, where the planets circle the sun but the sun still circles a stationary earth -- both predict the exact same phases for Venus. So Galileo didn't actually have decisive evidence for heliocentrism specifically, only against the crudest geocentric picture, and Bellarmine's caution was tracking the real state of the evidence more honestly then Galileo's rhetoric let on.

  Marcus's last word: fine, but that argument proves too much. There's basically always some baroque alternative that technically survives the data, and if that's enough to block reinterpreting scripture we'd never have been allowed to update on anything, Newton included. At some point converging evidence has to count as a "demonstration," and Bellarmine's own theological commitments don't meet his own bar any better than Galileo's astronomy did.

  Can you referee this move by move? First give me a JSON block scoring each of the four moves from -2 (clearly wrong) to 2 (clearly right):

  {"1": <score>, "2": <score>, "3": <score>, "4": <score>}

  Then briefly justify each score, and tell me what, if anything, both of them are missing.
