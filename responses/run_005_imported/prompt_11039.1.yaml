prompt: |-
  For an independent research project in my AP Seminar class, I have been reading about the sixteenth-century Catholic dispute over grace, providence, and free will, and I have run into a question that none of my sources actually answer. The Jesuit theologian Luis de Molina argued in his 1588 Concordia that, logically prior to deciding which world to create, God possesses "middle knowledge" (scientia media): infallible knowledge of exactly what every possible free creature would freely choose in every possible circumstance. Because this knowledge is supposedly independent of God's own creative will, Molina held that God could providentially steer history toward his purposes simply by choosing which circumstances to actualize, without ever causally determining a single free choice. Molina had studied Thomas Aquinas closely enough to write a three-volume commentary on the first part of the Summa Theologiae. Even so, the Dominican Thomists of his day, especially Domingo Bañez, insisted that middle knowledge was flatly incompatible with Aquinas's own system, and the resulting controversy grew so heated that Rome had to convene a special commission which, after years of hearings, ultimately declined to rule on which side was correct.

  What I cannot find anywhere is an actual argument, rather than a bare assertion, for what Aquinas himself would probably have concluded about middle knowledge, given that he died more than three centuries before Molina wrote and so never addressed the theory directly. I would like you to construct that argument, rather than simply summarizing the historical Bañez-versus-Molina dispute, which I already understand reasonably well. Specifically, Aquinas held that God's "knowledge of vision" is causal with respect to anything that actually exists or will exist, and he developed a detailed account of God as the universal first cause of every act of a created will, including free ones, without thereby eliminating the contingency of those acts at the level of secondary causes. Starting from those two commitments, please predict and defend a view: would Aquinas's own principles have made "middle knowledge" — a pre-volitional, non-causal, yet infallible knowledge of counterfactuals of freedom — a coherent extension of his theory of divine knowledge, or something his own premises rule out from the start? And if you conclude that his texts genuinely underdetermine the answer, please show me exactly where that indeterminacy arises and which of his commitments are actually in tension, rather than just declaring the question unanswerable.
reasoning: |-
  Okay, let me approach this user's query methodically. The user is clearly well-versed in the Molina-Bañez controversy but seeks a Thomistic analysis that goes beyond historical summaries. They want to know whether Aquinas's principles could accommodate Molina's middle knowledge (scientia media) - specifically, whether infallible knowledge of counterfactual free choices can exist independently of God's causal will.

  Hmm, the core tension lies in reconciling two key Thomistic commitments: God as universal first cause of all being (including free will acts) and the preservation of true contingency in secondary causes. The user specifically references Aquinas's "knowledge of vision" (scientia visionis) being causal and his doctrine of divine causation preserving freedom.

  First, I need to examine Aquinas's theory of divine knowledge. He distinguishes three types: God's natural knowledge of necessary truths/possibilities, free knowledge of actual creation, and "knowledge of vision" regarding existing things. Crucially, for Aquinas, God's knowledge causes things rather than being caused by them. This seems problematic for middle knowledge which posits pre-volitional truths about free actions.

  Then there's the causation question. Aquinas insists God moves all secondary causes - including free wills - according to their nature. Free choices remain contingent because God causes the will's act without determining its mode. But if God already knows infallibly what Peter would freely choose in hypothetical scenarios, doesn't that imply those choices have some truth-value independent of God's causal act? That might conflict with Aquinas's view that all creaturely being depends radically on divine causation.

  The contingency angle is tricky too. Aquinas maintains that future contingents aren't "determinately true" until actualized. Middle knowledge claims such determinacy for merely possible scenarios. Would Aquinas see this as granting ontological independence to possibilities?

  I recall key passages: Summa Theologiae I.14.13 on future contingents, I.19.8 on divine will, and De Veritate 2.12 on God's knowledge. Also relevant is Aquinas's rejection of "determinate truth" in future contingents in his Commentary on Peri Hermeneias. These suggest he'd view counterfactuals of freedom as unknowable in their determinate form prior to God's causal decree.

  But is there wiggle room? Aquinas does accept that God knows all possibilities. The question is whether he'd grant that certain conditional truths (if Peter were in circumstance C, he would freely choose X) can be known infallibly without God's causal involvement. Given his insistence that God's knowledge of creatures flows from His knowledge of His own creative act, probably not.

  The indeterminacy might lie in how strictly we interpret Aquinas's "causal knowledge" principle. Molina could argue that God's knowledge of possibilities includes knowledge of how free creatures would respond - but Aquinas seems to ground even possibilities in divine ideas, not independent truths.

  Ultimately, I think Aquinas's principles point toward rejecting middle knowledge. His framework requires that all knowledge of creaturely acts - actual or possible - be mediated through God's causal will. The user asked not just for a conclusion but for the precise tensions, so I'll need to highlight where Aquinas is silent (e.g., whether non-actualized possible worlds have "definite" truths) while showing why his causal metaphysics leans against Molina.
answer: |-
  Based on Aquinas's core principles regarding divine knowledge, causality, and the nature of free will, his system **would logically rule out the coherence of Molina's middle knowledge (scientia media)** as a distinct, pre-volitional category of infallible divine knowledge. Here's the argument, grounded in Aquinas's texts and avoiding Bañez's later polemics:

  1.  **God's Knowledge is Causal and Identical with His Essence:**
      *   Aquinas holds that God's knowledge is not *caused* by creatures but is *causal of* them (ST I.14.8). God's knowledge of creation is identical with His act of knowing His own essence, which includes the perfect ideas of all things that *can* be (His "knowledge of simple intelligence") and *will* be (His "knowledge of vision"/"free knowledge") (ST I.14.5-6, 9; I.15.1-3).
      *   Crucially, God's knowledge of vision (knowledge of the actual world) *depends* on His free decree to create this specific world-order (ST I.14.8, ad 3; I.19.4). There is no "pre-volitional" knowledge of *actual* future contingents; such knowledge logically follows (though not temporally) God's creative will.

  2.  **The Radical Dependence of All Being (Including Free Acts) on God:**
      *   Aquinas is emphatic that God is the First Cause of *every* act of being, including every act of a created will, free or not (ST I.105.5; I.83.1, ad 3; SCG III.67, 70). God moves all secondary causes "according to their nature" – necessary causes necessarily, free causes contingently (ST I.19.8; I.83.1; De Veritate 22.9).
      *   This divine motion is not a competing cause alongside the creature's will but is the transcendent source enabling the will's very act of self-determination. The creature's freedom lies in its *mode* of causing (contingently, self-determinedly), not in being *uncaused* by God (ST I-II.9.6; I.83.1, ad 3; I.105.4).

  3.  **The Problem of Pre-Volitional Truth for Counterfactuals of Freedom:**
      *   Molina posits that *prior* to God's decree to create, there exists a realm of infallibly true counterfactual propositions about what *any* possible free creature *would* freely choose in *any* possible circumstance (e.g., "If Peter were placed in circumstance C at time T, he would freely choose X").
      *   For Aquinas, such propositions pose a fundamental problem: **What grounds the truth of these counterfactuals?** Truth, for Aquinas, is the adequation of intellect and *being* (ST I.16.1; De Veritate 1.1). The truth of a proposition about a *future free contingent* act depends on that act *actually being caused* (ultimately by God, through the secondary cause of the free will) within the actual order of providence.
      *   *Before* God's creative decree, there is no *actual* Peter, no *actual* circumstance C, and no *actual* divine motion causing Peter's will to choose freely. Peter exists only as a *possibility* in God's knowledge of simple intelligence. The specific counterfactual act "Peter freely choosing X in C" has no ontological ground – it is not an *actual* being or act, nor is it a *necessary* truth. Its truth would require a definite, determinate reality *independent* of God's causal will, which Aquinas's metaphysics denies.

  4.  **Contingency Requires Causal Indeterminacy at the Moment of Choice:**
      *   Aquinas insists that for a future contingent (like a free choice) to be truly contingent, it cannot be "determinately true" *before* it happens in a way that would render it necessary (Commentary on Aristotle's *Peri Hermeneias*, I, L14; ST I.14.13). Its truth is indeterminate until it is actualized.
      *   Molina's middle knowledge claims infallible, determinate truth for counterfactual free choices *before* God decides to create or place the creature in that circumstance. Aquinas would argue this violates the very nature of contingency. If it's *already* true (infallibly known by God) *what* Peter would do in C, then Peter's choice in C is *not* genuinely contingent *within that hypothetical scenario*; it is determined by the truth of the counterfactual. Aquinas grounds contingency in the real indeterminacy of secondary causes *as moved* by God, an indeterminacy that cannot exist for a merely possible, non-actualized agent and circumstance.

  5.  **No "Gap" for Middle Knowledge in Divine Knowledge:**
      *   Aquinas divides divine knowledge into:
          *   *Natural Knowledge (Scientia Necessaria/Simplicis Intelligentiae):* Knowledge of necessary truths and all *possibilities* (what *could* be).
          *   *Free Knowledge (Scientia Visionis/Libera):* Knowledge of what *will* be, dependent on God's free will.
      *   For Aquinas, God's knowledge of *possibilities* includes knowing what *could* happen in various hypothetical situations (e.g., "Peter *could* choose X in C, or he *could* choose Y"). However, this knowledge is of *possibilities*, not of what *would* definitively happen. Knowledge of what *would* definitively happen in a specific hypothetical scenario involving a free creature belongs, for Aquinas, *only* to God's knowledge of vision *after* He has decreed to create that world-order and thus *caused* that specific sequence of events, including the free choices. Molina's "middle knowledge" tries to insert infallible knowledge of definite *conditional futures* (what *would* be) *between* the knowledge of possibilities and the knowledge of the actual future. Aquinas's framework has no room for this because the definite truth of a conditional future involving a free act requires the actual divine decree and causation that brings it (or its hypothetical equivalent) into the realm of knowable *being*.

  **Where Indeterminacy Arises & Genuine Tensions:**

  While the core argument above points to rejection, Aquinas's texts don't *explicitly* address the precise logical structure Molina proposes. This creates points of tension and genuine indeterminacy:

  1.  **The Ground of Possibility:** Aquinas grounds possibilities in God's power and the divine ideas (ST I.15.3; I.25.3). Could God's exhaustive knowledge of *all* possibilities *include* knowledge of how perfectly understood possible natures *would* respond if instantiated? Aquinas doesn't explicitly deny this, but his insistence that definite truth requires actual being (or necessity) strongly suggests he would see "would" counterfactuals about non-necessary, non-actualized free acts as lacking a truth-maker. The tension is between God's perfect comprehension of possibilities and the lack of ontological grounding for definite truths about non-actualized free contingents.
  2.  **The Scope of Divine Causality:** Aquinas is clear God causes the *act* of free choice, but *how* God's universal causality preserves the "gap" of indeterminacy *at the moment of choice* without rendering the outcome pre-determined *even for God* prior to His creative decree is a profound mystery within Thomism. Molina's middle knowledge attempts to resolve this by placing the indeterminacy *outside* of God's causal act (in the creature's response known via scientia media). Aquinas places the indeterminacy *within* the creature's causal mode *as moved* by God. The tension lies in articulating how God, as First Cause, knows the definite outcome of a free choice He causes without that knowledge *determining* the choice or requiring pre-volitional truths. Aquinas relies on God's eternity and simplicity to transcend temporal sequence, but this doesn't fully resolve the logical priority of the divine will in grounding the truth of future contingents.

  **Conclusion:**

  Based on Aquinas's core commitments – **the causal nature of God's knowledge of vision, the radical dependence of all being (including free acts) on God as First Cause, the requirement that truth be grounded in actual being or necessity, and the need for indeterminacy to preserve true contingency** – Molina's concept of *scientia media* as a distinct category of infallible, pre-volitional knowledge of *definite* counterfactuals of freedom is **incoherent within Aquinas's own system**. Aquinas would argue that God knows all possibilities exhaustively, but infallible knowledge of what a *merely possible* free creature *would* definitively choose in a *merely possible* circumstance lacks an ontological foundation. Such definite truth only arises *consequent* to God's free decree to create a specific world-order, where His knowledge of vision, causally grounded in His will, encompasses the free choices He Himself brings about through secondary causes. The indeterminacy lies not in Aquinas being ambiguous about divine causality or the grounding of truth, but in the inherent difficulty of fully reconciling divine foreknowledge, universal causality, and genuine creaturely freedom – a difficulty Molina addressed with a different metaphysical move that Aquinas's foundational principles appear to preclude.
