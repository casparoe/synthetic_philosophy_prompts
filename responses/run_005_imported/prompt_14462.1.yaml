answer: |-
  Here’s a eulogy that honors your grandfather’s character and experience honestly, acknowledging the complexity without getting lost in philosophy, while leaning on the spirit of his own words to navigate the tension you feel. It aims for warmth, specificity, and respect for all present:

  ---

  **(Standing at the podium, take a breath, look at the family, then his friends)**

  Good morning. For those who don’t know me, I’m [Your Name], one of [Grandpa's Name]’s grandchildren. When Aunt [Aunt's Name] asked me to speak today, my first thought was, “How do you sum up 78 years? How do you capture a man like him?” Especially when the person asking thinks you’re “the smart one” just because you spend your days arguing about ideas older than dirt. Grandpa would have gotten a real kick out of that. He valued practicality, loyalty, and getting the job done far more than fancy degrees.

  Grandpa was… solid. Reliable. The kind of man who showed up. Whether it was fixing a leaky faucet at 10 PM, coaching Little League even when we lost every game, or just sitting silently with you when words weren’t enough. He had this quiet strength, a steadiness born, I think, from seeing things most of us thankfully never have to see.

  Of course, a big part of his life, a part that shaped him profoundly, was his service in Vietnam. Like many of that generation, he didn’t talk about it much. When pressed, especially by a curious or maybe overly analytical grandson at Thanksgiving, he’d usually just shake his head and give some version of that line we all heard: “You don’t get to pick the war, kid. You just try to fight it right and bring your guys home.”

  For a long time, I heard that as just… a way to change the subject. A soldier’s shorthand for “Let’s talk about something else.” But lately, I’ve been thinking a lot about what he meant. I think he was telling us something deeper about responsibility, about duty in impossible circumstances.

  **[Look towards his friends]**
  He wasn’t talking about grand causes or political justifications – those are things debated far from the mud and the noise. He was talking about the man next to you. He was talking about the choices you make *in* the fight, regardless of how the fight started. About keeping your head, following the rules as best you could in the chaos, watching your buddy’s back, and getting through it together. About bringing *your guys* home. That was his focus. That was the honor he understood – the honor found not in the righteousness of the cause, but in the integrity of your actions *within* the storm.

  **[Shift tone to more personal warmth]**
  And he brought that same fierce, quiet loyalty home. To Grandma, through thick and thin for over 50 years. To his kids, always there, always steady. To us grandkids – never missing a graduation, a game, always ready with a slightly gruff word of advice or a surprisingly patient ear. He built a life here, rooted in family and community. He fished, he tinkered in the garage, he argued about the news – especially in these last few years, watching the world, where I saw a quiet, hard-earned bitterness about the waste of it all settle in. He knew the cost. He carried it.

  **[Directly to his friends]**
  To the men sitting here who served with him – [perhaps gesture slightly, nod] – you knew that loyalty firsthand. You knew the man who was focused on bringing *you* home. You knew his character under pressure. That bond, forged in circumstances most of us can’t fathom, was sacred to him. The way he spoke of you, sparingly but with absolute respect, told us everything. You were his "guys," long after the war ended. Thank you for being here for him today.

  **[Conclude with focus on the man, not the war]**
  Grandpa wasn’t defined solely by Vietnam, but it was a crucible that revealed the core of who he was: a man committed to doing the job in front of him as well and as honorably as he knew how. A man whose loyalty to the people beside him was absolute. A man who carried the weight of difficult history without letting it crush his capacity for love, for quiet humor, for showing up for his family.

  He taught us that sometimes, the deepest courage isn't in choosing the battle, but in how you fight the battle you're given. That honor lives in your conduct, in your care for others, in bearing the burden with as much integrity as you can muster.

  So, Grandpa, we honor you today not for the war you fought, but for the man you were within it and beyond it. For your unwavering loyalty, your quiet strength, your deep love for your family, and your steadfast commitment to bringing your guys home – in every sense of the word. You did that. You built a home, you anchored a family, you stood by your friends.

  We’ll miss your steadiness, your presence, your gruff affection. Rest easy now. You brought your guys home. You did good.

  Thank you.

  ---

  **Why this works for your needs:**

  1.  **Honors Him Personally:** Focuses on his character (loyalty, reliability, quiet strength), his roles (husband, father, grandfather, friend), and specific, warm memories outside of the war.
  2.  **Acknowledges Vietnam Honestly:** Doesn't glorify the war or claim a "righteous cause." Uses his own words ("You don't get to pick the war...") as the anchor, making it authentic.
  3.  **Leans on Walzer's Ethic:** Explicitly frames his line as being about *conduct within the war* ("trying to fight it right," "choices you make *in* the fight," "integrity of your actions," "honor found... in the integrity of your actions *within* the storm"), separating it from the justice of the cause itself. This validates his sense of duty and honor *as a soldier*.
  4.  **Addresses McMahan Tension Subtly:**
      *   "He wasn’t talking about grand causes or political justifications – those are things debated far from the mud and the noise." (Acknowledges the cause/jus ad bellum is separate and debatable).
      *   "regardless of how the fight started" (Reinforces the separation).
      *   "watching the world, where I saw a quiet, hard-earned bitterness about the waste of it all settle in. He knew the cost." (Shows he likely didn't see the *cause* as just, without blaming *him*).
      *   "We honor you today not for the war you fought, but for the man you were within it and beyond it." (Crucially separates the man and his character from the political/moral judgment of the war itself).
  5.  **Respects His Comrades:** Directly addresses and honors his friends, focusing on *their* bond and *his* loyalty to *them*. This validates their shared experience and sacrifices without commenting on the war's justice.
  6.  **Avoids Philosophy Lecture:** No names (Walzer, McMahan), no jargon. The concepts are woven into the narrative of *his* life and *his* words. The professor will hear the careful distinction; the veterans and family will hear respect and love.
  7.  **Warmth and Specificity:** Includes personal details (Thanksgiving, fixing faucets, Little League, fishing, tinkering, gruff affection) and a genuine, loving tone.
  8.  **Appropriate Length:** This should come in right around 5 minutes when read aloud at a measured, respectful pace.

  This approach allows you to honor your grandfather's integrity, service, and loyalty *as he understood it*, grounded in his own words, while honestly acknowledging the complex and difficult context in which he served, all within the appropriate bounds of a warm, personal eulogy.
