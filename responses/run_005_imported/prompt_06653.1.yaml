  The framework question deserves honesty: while Einstein's analysis of power dynamics remains vital, terms like "production" need reimagining for cognitive capitalism. But his core insight - that economic organization shapes human flourishing - transfers powerfully. Perhaps I should note how attention economies realize his fear of alienation in newly quantified ways.

