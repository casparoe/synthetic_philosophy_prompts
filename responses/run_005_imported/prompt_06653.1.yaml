  Regarding planned economies, the user's colleague raises a crucial tension. Einstein's own skepticism about bureaucracy makes this complex. I recall his emphasis on preventing "the bureaucratization of the whole economy" - he'd likely view Soviet-style centralization as confirming his fears rather than invalidating his critique. His solution involved democratic planning, which Big Tech's unaccountable governance makes ironically necessary.

