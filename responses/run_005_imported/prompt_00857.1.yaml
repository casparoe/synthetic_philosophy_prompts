prompt: |-
  A few of us at work run an informal lunchtime reading group, and we're currently making our way through Rawls's *A Theory of Justice*, which is a departure from the technical papers we usually pass around. Given that most of my day job involves building recommendation and ranking systems that have to reason about uncertain outcomes, I got interested in trying to formalize the "veil of ignorance" as an actual decision problem. As I understand the setup, you don't know which position in society you will end up occupying, so you are supposed to reason as though you had an equal chance of landing in any of them, and then pick whichever set of principles performs best in expectation across those equally likely positions. That is exactly the kind of expected-value calculation I would reach for if I had to choose a policy under a known uniform distribution over outcomes, and it is apparently more or less the route Harsanyi took with his own version of the original position to argue for average utilitarianism.

  What I haven't been able to square away is why Rawls, working from what looks like the same basic setup, insists instead that the parties would reason via maximin and end up defending the difference principle over Harsanyi's expected-utility approach. If the veil of ignorance already commits you to treating every social position as equally likely, then maximizing expected value seems like the mathematically obvious move, and maximin looks like it only makes sense for someone who is either irrationally risk-averse or who does not actually trust the equiprobability assumption in the first place. I vaguely recall Rawls invoking something called the "strains of commitment" in this context, but I could not tell whether that concept is doing any real argumentative work or is just a redescription of risk aversion under a fancier name. Is there a genuine, principled argument for why maximin, rather than expected-utility reasoning over a uniform distribution, is the rational response to the original position, or is Rawls essentially building his preferred conclusion into the setup and then dressing it up as a decision-theoretic argument?
reasoning: |-
  Okay, the user is part of a reading group tackling Rawls's *A Theory of Justice*, specifically puzzled about why Rawls chooses maximin over expected utility in the veil of ignorance setup. They work with recommendation systems dealing with uncertainty, so they're familiar with expected value calculations. Their main confusion is why Rawls diverges from Harsanyi's approach, which uses a uniform probability distribution to justify average utilitarianism.

  First, I need to recall Rawls's key arguments. Rawls rejects the equiprobability assumption. He argues that the original position isn't just about risk but radical uncertainty. The parties don't have any basis for assigning probabilities to different social positions. Without any knowledge of society's structure, assuming equal probabilities isn't justified. This is a crucial point because Harsanyi does assume equiprobability, leading to average utility. 

  Next, the stakes are incredibly high. Ending up in the worst-off position could mean a life of misery, which is unacceptable. The user mentioned risk aversion, but Rawls frames it as avoiding unacceptable outcomes rather than mere aversion. The strains of commitment tie into this—parties must stick to the chosen principles once the veil lifts. If someone ends up worst-off, they can't back out, so the agreement must be bearable for all. 

  The third point is the priority of basic liberties. Rawls emphasizes that certain rights are non-negotiable and must be secured first. Maximin ensures that the worst-off still have fundamental freedoms, which expected utility might sacrifice for higher average benefits. 

  The user questions if "strains of commitment" is just risk aversion rebranded. But it's more about the irrevocable nature of the choice. Once in society, you can't renegotiate, so the initial choice must be one you can live with no matter your position. This adds a layer beyond standard risk models. 

  Also, the user might be approaching this from a technical, probabilistic background. Their work involves known distributions, but Rawls's original position lacks any such data. Highlighting the difference between risk (known probabilities) and uncertainty (unknown probabilities) is key. Rawls is in the Knightian or Keynesian tradition here. 

  The user’s deeper need might be understanding if Rawls's argument holds water logically or if it's circular. They suspect Rawls might be rigging the setup. The response should address that by breaking down Rawls's premises: no probability basis, high stakes, irrevocability, and liberty priority. Whether these premises are valid is debatable, but within Rawls's framework, maximin follows rationally. 

  Also, the user might appreciate clarifying why maximin isn't typically rational but fits this specific context. Rawls outlines three conditions where maximin applies: ignorance of probabilities, unacceptable worst-case, and focus on tolerable minimum. The original position meets all three. 

  Finally, the criticism that Rawls builds in his conclusion. Opponents argue the conditions are stacked to favor maximin. But Rawls claims these conditions stem from the moral purpose of the original position—fairness. So it's a substantive moral argument, not just decision theory. The user needs to see that the dispute is philosophical, not mathematical.
answer: |-
  You've hit on one of the most enduring debates in political philosophy and decision theory! Rawls's rejection of expected utility maximization in favor of maximin under the veil of ignorance is indeed a deliberate and controversial move. While critics (like Harsanyi) argue it's irrational risk-aversion or question-begging, Rawls offers several *principled* arguments for why maximin is uniquely rational in the *specific context* of the original position. Here's a breakdown of his reasoning and the key distinctions from Harsanyi:

  1.  **Radical Uncertainty, Not Risk with Known Probabilities:**
      *   **Harsanyi's Setup:** Assumes individuals *can* and *should* assign equal subjective probabilities to occupying any social position. This transforms the problem into standard expected utility maximization under risk. Average utilitarianism follows naturally.
      *   **Rawls's Rejection:** Rawls argues the veil of ignorance creates a state of **radical uncertainty**, not calculable risk. Parties lack *any* basis for assigning probabilities to the various possible social positions or life prospects. They don't know:
          *   The size or structure of society.
          *   The distribution of natural assets, talents, or social roles.
          *   The historical, economic, or technological context.
      *   **Implication:** Applying the principle of insufficient reason (assuming equiprobability) is arbitrary. Without *any* information, there's no rational justification for *any* specific probability distribution, uniform or otherwise. Expected utility calculation *requires* probabilities; maximin does not.

  2.  **The Unacceptably High Stakes & the "Special Psychologies":**
      *   **The Nature of the Choice:** Choosing basic social structures isn't like gambling on a stock portfolio. The stakes are fundamental: your basic rights, liberties, opportunities, self-respect, and life prospects. Landing in the worst-off position could mean a life of crushing poverty, oppression, or humiliation – outcomes potentially so bad they are deemed **intolerable** or **unacceptable**.
      *   **Rational Aversion to Catastrophe:** Rawls argues it's *not* irrational to prioritize avoiding the possibility of an intolerable existence, even if the *probability* of that outcome is unknown but non-negligible. Maximin directly guarantees the best possible worst-case scenario.
      *   **Harsanyi's Counter:** This looks like extreme risk aversion. Harsanyi argues rational agents *should* maximize expected utility regardless of the stakes, assuming they have consistent preferences over lotteries.
      *   **Rawls's Response:** The original position isn't designed for agents with "typical" risk preferences. The veil filters out knowledge of one's *actual* risk tolerance. Instead, parties focus solely on securing the **primary goods** (rights, liberties, opportunities, income/wealth, the social bases of self-respect) necessary for pursuing *any* rational life plan. Securing these goods, especially for the worst-off, takes precedence over maximizing averages when probabilities are unknown and the downside is catastrophic.

  3.  **The Strains of Commitment (This is Crucial Work):**
      *   **The Argument:** This is *not* just a redescription of risk aversion. It's a distinct argument about the **practical enforceability** of the chosen principles.
      *   **The Problem:** The agreement in the original position is final and binding. Once the veil lifts, individuals *must* live under the chosen principles, no matter their position. If someone ends up in the worst-off position under a principle chosen via expected utility (which might tolerate very low minima for the sake of higher averages), they might find their situation so unbearable that they cannot reasonably be expected to comply. This creates **strains of commitment** – the agreement threatens to break down.
      *   **Maximin's Solution:** Principles chosen via maximin ensure that *even the worst-off position* is as good as it can possibly be. This makes the agreement **stable**. Individuals in the worst-off position, knowing that no alternative principle would offer them a better deal, have a strong reason to accept and comply with the system. The strains of commitment are minimized.
      *   **Expected Utility's Problem:** A principle chosen by maximizing average utility *might* leave some in a position they find intolerable, making their commitment fragile and threatening social stability. The original position parties, knowing they *must* live with the result, rationally choose principles they can stick to no matter what.

  4.  **The Priority of Liberty and the Guarantee of a Minimum:**
      *   Rawls argues that maximin, particularly via the Difference Principle, provides a robust guarantee of a social minimum and ensures that the basic liberties (secured by his First Principle) have **lexical priority**. Expected utility calculations could potentially justify trading off fundamental liberties for economic gains if the average benefit is high enough (e.g., sacrificing some people's liberty to boost overall wealth). Maximin rules this out categorically, as the worst-off position must be protected.

  **Why Rawls Believes Maximin is Rational *Here* (The Three Conditions):**

  Rawls explicitly states that maximin is generally *not* a rational decision rule. However, he argues it *is* rational under three specific conditions present in the original position:

  1.  **Ignorance of Probabilities:** "There must be some reason for sharply discounting estimates of... probabilities." (The radical uncertainty argument).
  2.  **The Choice Has Grave Consequences:** "The person choosing has a conception of the good such that he cares very little, if anything, for what he might gain above the minimum stipend that he can, in fact, be sure of by following the maximin rule." (The focus on primary goods and avoiding catastrophe).
  3.  **Rejected Alternatives Have Unacceptable Worst Outcomes:** "The rejected alternatives have outcomes that one can hardly accept." (The intolerable minimum argument).

  Rawls contends the original position uniquely satisfies all three conditions.

  **Is Rawls Building in His Conclusion?**

  This is the core criticism from Harsanyi, economists, and many utilitarians:

  *   **The Charge:** By defining the original position with such radical uncertainty, such high stakes, and such a focus on primary goods and stability, Rawls has essentially *rigged the setup* to favor maximin and his egalitarian conclusions. He rejects equiprobability not on purely decision-theoretic grounds, but because it leads to a conclusion (average utilitarianism) he finds morally unacceptable. The "strains of commitment" argument smuggles in a prior moral commitment to avoiding severe disadvantage.
  *   **Rawls's Defense:** Rawls argues the features of the original position (radical uncertainty, focus on primary goods, finality of agreement) are *not* arbitrary but are derived from the fundamental **moral idea of fairness** itself. The veil is a device to model fair agreement between free and equal moral persons. Its constraints are justified by the moral purpose it serves. The strains of commitment arise from the *practical* requirement that a just society must be stable for the right reasons. Therefore, maximin isn't chosen *because* it leads to the Difference Principle; rather, the features of a fair choice situation (the original position) *rationally compel* maximin, which *then* leads to the Difference Principle as a consequence.

  **Conclusion:**

  Rawls *does* offer genuine, principled arguments for maximin over expected utility in the original position, centered on:
  1.  **Radical Uncertainty:** Rejecting the justifiability of *any* probability assignment.
  2.  **Intolerable Downside:** Prioritizing the avoidance of catastrophic outcomes when fundamental interests are at stake.
  3.  **Strains of Commitment:** Ensuring the chosen principles are practically sustainable and stable because even the worst-off can accept them.
  4.  **Priority of Primary Goods/Liberty:** Guaranteeing a baseline necessary for any rational life plan.

  Whether these arguments are *successful* or whether they subtly presuppose Rawls's egalitarian conclusions is the heart of the debate. Rawls insists the original position's structure is morally mandated by the concept of fairness, making maximin the rational response. His critics argue the structure is designed to yield his desired outcome and that rational agents *should* use expected utility even under uncertainty (e.g., using some form of subjective probability or a less extreme decision rule). Your observation about the apparent tension between the "equal chance" intuition and maximin perfectly captures this central philosophical dispute. Rawls's key move is to deny that the veil implies *any* meaningful probabilistic assessment is possible or rational.
