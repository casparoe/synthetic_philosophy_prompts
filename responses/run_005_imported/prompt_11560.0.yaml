  ok so in my metaphysics seminar we're on van inwagen's special composition question and I think ive got the gist of the "argument from vagueness" against restricted answers -- basically that stuff like contact or fastening comes in degrees, so any restricted answer implies a sorites series with no principled cutoff for when composition happens. what I can't get an intuitive handle on is the next move, where everyone just asserts that vague composition = vague existence, and that THAT's the real problem (way worse than like, someone being borderline bald). our TA brought up markosian's "brutal composition" as one dodge, but thats not quite the move im curious about -- I want to know why you can't just say its indeterminate whether the xs compose a y while still holding that whatever does exist, determinately exists. is there an actual gut-level reason existence can't be vague the way ordinary predicates can, or is it more of a brute intuition pump thats doing a ton of load-bearing work for the whole argument?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're in a metaphysics seminar dealing with van Inwagen's Special Composition Question (SCQ) and the argument from vagueness. They grasp the core issue—restricted answers lead to Sorites problems because criteria like contact or fastening have degrees. But they're stuck on why vague composition implies vague existence, which is seen as a bigger problem than something like borderline baldness. They mention Markosian's brutal composition as a dodge but want to explore why we can't just say composition is indeterminate without existence itself being vague. They suspect intuition pumps might be doing heavy lifting here.

  First, I need to recall the argument from vagueness. Van Inwagen and others argue that if composition isn't unrestricted, then any restricted criterion (like contact) would have borderline cases. This leads to a Sorites series where there's no sharp cutoff. But the key leap is that if composition is vague, then existence must be vague too. Why is that problematic? Because existence is considered an all-or-nothing matter in classical logic and ontology. Vague existence would mean objects pop in and out indeterminately, which seems metaphysically troubling.

  The user's main confusion is about the inference from vague composition to vague existence. They propose that composition could be indeterminate while existence remains determinate. For example, in a series of objects from no contact to full contact, it might be indeterminate whether they compose a new object, but each existing object is still determinately there. Why can't we just say that?

  I should break down the supervenience point. Composition facts depend on other facts. If the base facts (like arrangement of particles) are determinate, then whether they compose something should be determinate too. If composition is vague despite determinate base facts, that suggests a lack of supervenience, which is problematic. It would mean that there's no underlying fact of the matter even when all physical details are fixed.

  Then there's the ontological commitment angle. If it's indeterminate whether certain objects compose a new object, then it's indeterminate whether that object exists. This directly ties composition to existence. If composition occurs, a new entity exists; if not, it doesn't. So indeterminacy in composition leads to indeterminacy in existence.

  The user questions whether existence can't be vague like ordinary predicates. But existence isn't a property of objects in the same way baldness is. Baldness is a contingent property; existence is what it means for an object to be real. Vague existence challenges the idea that reality is fully determinate, which feels more unsettling than vague properties.

  The user might be looking for a gut-level reason why vague existence is worse. It's because it makes reality itself fuzzy. While we're used to epistemic vagueness (like not knowing where the baldness cutoff is), ontological vagueness suggests the world isn't fully decided, which conflicts with a realist view. 

  Also, the user mentions the TA brought up Markosian's brutal composition. Markosian avoids vagueness by saying composition has no general criterion but is brute for each case. But the user isn't asking about that—they want to know why we can't accept vague composition without vague existence. 

  I should address possible counterarguments. One could argue that composition facts are indeterminate, but the entities themselves exist determinately. However, if composition is a relation that brings new entities into existence, then indeterminate composition means indeterminate existence of those entities. 

  Another point: even if base entities exist determinately, the composite's existence is what's vague. So the world has determinate particles but indeterminate tables, which still makes the table's existence vague. 

  The user's deeper need might be understanding whether this is a substantive argument or just intuition pumping. They suspect the latter. But philosophers like Sider formalize this with precisificational semantics, showing that vague existence requires vague identity or multiple precisifications of the quantifier, which complicates logic. 

  In summary, the argument hinges on composition being existence-conferring and supervenience. Vague composition without determinate base facts leads to vague existence, which is ontologically weightier than property vagueness. While intuition pumps are involved, there's logical structure behind it.
answer: |-
  You've hit on one of the most contentious and philosophically rich points in the SCQ debate! The inference from "vague composition" to "vague existence" is indeed the lynchpin of the Argument from Vagueness (AfV), and its intuitive force isn't always obvious. Let's break down why this move feels necessary to proponents of the AfV and why resisting it is tricky:

  ### The Core Argument Structure (Why "Vague Composition → Vague Existence")
  1.  **Composition is Existence-Conferring:** If the Xs compose a Y, then Y *exists* (and is a distinct composite entity). If they don't, then Y *does not exist*. Composition isn't just a relation between existing things; it's the very process that *brings a new entity into existence*.
  2.  **Indeterminacy Transfer:** Therefore, if it's *indeterminate* whether the Xs compose a Y, it must be *indeterminate* whether Y exists. There's no middle ground. Y can't "sort of exist" or "exist indeterminately" *without* this being a case of vague existence. The existential quantifier ("there exists a Y such that...") itself would have to be vague in its application.

  ### Why This Feels Worse Than "Ordinary" Vagueness (Like Baldness)
  *   **Baldness (Ordinary Predicate Vagueness):** When it's indeterminate whether Harry is bald, we're dealing with the vagueness of a *property* (baldness) applying to a *determinately existing object* (Harry). Harry exists; the fuzziness is in how we categorize him. The vagueness is *linguistic* or *conceptual*, not necessarily *ontological*.
  *   **Vague Composition/Existence:** Here, the vagueness concerns *whether a specific object Y exists at all*. It's not about how we describe Y; it's about whether Y is part of reality. This challenges the idea that what *exists* is a fundamental, objective fact about the world. It suggests reality itself is fuzzy at the edges.

  ### Your Proposed Move: "Indeterminate Composition BUT Determinate Existence"
  This is a natural resistance! You suggest: "Can't we just say that *whether composition occurs* is indeterminate, but whatever *does* exist (the fundamental particles, the arranged particles, etc.) exists determinately? The indeterminacy is only about the *composition relation*, not about *existence itself*."

  Proponents of the AfV argue this move fails for two main gut-level/intuitive reasons:

  1.  **The Supervenience Intuition:** Facts about what composite objects exist *must supervene on* (be determined by) more fundamental facts – typically facts about the arrangement and properties of the *simples* (fundamental particles). If the fundamental facts are perfectly precise (e.g., the exact positions, masses, charges of all particles), then what supervenes on them *must also be precise*.
      *   **The Challenge:** If composition is indeterminate *despite* completely determinate fundamental facts, then composition facts *don't* supervene on the fundamental physical facts. This seems deeply problematic – it implies there's a fundamental, brute, non-physical indeterminacy in *what objects the world contains*, even when all the physical facts are fixed. This feels like an unacceptable "free-floating" vagueness.
      *   **Gut-Level Analogy:** Imagine a perfectly clear, high-resolution picture. Could it be fundamentally *indeterminate* whether a specific cluster of pixels forms a distinct object (like a rock) within that picture? If the picture is perfectly sharp, the existence of the rock should be sharp too. Vague composition without vague existence feels like saying the picture is sharp, but whether the rock *exists in it* is fuzzy.

  2.  **The "What Would It Be Like?" Intuition:** Suppose it's indeterminate whether some particles compose a table. What is the *metaphysical status* of the putative table?
      *   **Option A:** It *does* exist, but indeterminately? What does that *mean*? Does it half-exist? Cast a half-shadow? This seems incoherent.
      *   **Option B (Your Move):** It *simply doesn't exist* as a composite object. Only the particles exist. But then the indeterminacy vanishes! If the particles exist determinately and *only* the particles exist determinately, then it's *determinately false* that a table exists. There's no room for indeterminacy.
      *   **The Conclusion:** The *only* way to make sense of genuine indeterminacy in composition is to say that *whether the composite object exists* is indeterminate. There's no stable middle ground where composition is vague but existence is crisp.

  ### Is it "Just" an Intuition Pump Doing Heavy Lifting?
  It's definitely *doing* heavy lifting, but it's arguably more than *just* a pump. It rests on deep-seated commitments many philosophers hold:

  *   **Classical Bivalence/Excluded Middle:** Reality is such that for any object and any time, it determinately exists or determinately does not exist. "Vague existence" violates this.
  *   **The Fundamentality of Existence:** What exists is the most basic ontological fact. Vagueness infecting *this* level is seen as metaphysically more serious than vagueness in properties or relations.
  *   **Supervenience Physicalism:** The macro-level (including what composite objects exist) is completely determined by the precise, fundamental physical micro-level. Vague composition violates this supervenience.
  *   **Formal Logic:** Standard quantificational logic (`∃x`) treats existence as all-or-nothing. Formalizing "vague existence" requires significant (and controversial) revisions to logic (e.g., fuzzy logic, supervaluationism for the quantifier itself, which Sider argues against).

  ### Counter-Moves & Why They Are Tough
  *   **Vague Identity?** Some suggest vague composition implies vague identity (is the table identical to *this* collection of particles or not?). But vague identity is often considered even *more* problematic than vague existence (e.g., Evans's argument).
  *   **Epistemicism:** Maybe it *seems* vague, but there's a precise, unknowable cutoff. This avoids vague existence but is deeply counterintuitive for composition and faces the "what fixes the cutoff?" problem.
  *   **Ontological Indeterminacy without Vague Identity:** A few philosophers (e.g., Elizabeth Barnes, Robert Williams) defend genuine ontological indeterminacy that doesn't collapse into vague identity. This is a sophisticated minority position requiring non-classical logic/metaphysics. The AfV effectively *argues against* the viability of this position for composition by highlighting its radical consequences.
  *   **Brutal Composition (Markosian):** As your TA mentioned, this bites the bullet and says there are no general principles – composition just *happens* or *doesn't* in a brute, non-vague way for each case. This avoids vagueness but sacrifices explanatory power and seems ad hoc.

  ### Conclusion: The Gut-Level Reason
  The gut-level reason why "vague composition = vague existence" feels necessary (and problematic) is the **supervenience intuition combined with the existential consequence of composition**. If the fundamental building blocks and their precise arrangements are all there is, then what composite objects those arrangements constitute *must* be just as precise. If it's *not* precise, then either:
  1.  **Existence itself is vague (Ontological Indeterminacy):** The number/identity of objects in the world is fundamentally fuzzy. OR
  2.  **Composition Doesn't Supervene (Brute Facts/Brutalism):** There's no explanation *why* composition occurs here but not there; it's just a brute fact.

  The AfV argues that (1) is metaphysically repugnant and that restricted composition theories inevitably lead to it, so we must reject restricted composition (embracing either Universalism or Nihilism). Your instinct that this inference point is doing crucial work is absolutely correct. While there are technical maneuvers to resist it (like the brutal composition you mentioned, or embracing ontological indeterminacy), they come with significant costs that many find harder to swallow than the AfV's conclusion. The debate often boils down to which cost seems greater: vague existence/brutality or the counterintuitive consequences of Universalism/Nihilism.
