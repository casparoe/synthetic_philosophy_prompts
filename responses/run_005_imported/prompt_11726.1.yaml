    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."]
  }
  ```

  followed by a two-sentence defense of whichever position you place in S.
reasoning: |-
  We are considering the purely retributivist perspective, setting aside deterrence. The question is how to justify punishing the driver who kills a pedestrian more severely than the equally reckless drunk driver who doesn't hit anyone, based solely on desert.

  We are to rank the following positions by how convincingly they can use desert to justify the harsher punishment for the completed harm:

  1. Pure culpability-based retributivism: This view holds that desert is based solely on the actor's culpable state of mind and actions, regardless of outcomes. Thus, both drivers are equally culpable and deserve the same punishment. It cannot justify differential punishment.

  2. Resultant-luck-inclusive retributivism: This view accepts that the actual outcome (the harm) affects desert. So, the driver who kills is more deserving of punishment because of the bad result, even though it was a matter of luck.

  3. Character-based retributivism: This view bases desert on the actor's character. The idea is that the completed harm might reveal more about the actor's bad character, or that the outcome is a manifestation of that character. However, in this case, both drivers are equally reckless and drunk, so their character might be judged the same.

  4. Risk/endangerment-calibrated retributivism: This view bases desert on the level of risk the actor created. Both drivers created the same risk, so they should be equally culpable. However, one might argue that the actual harm shows the risk was realized, but that might be conflating with outcomes.

  5. Evidentiary retributivism: This view treats the outcome as evidence of the level of culpability. For example, the fact that a death occurred might be evidence that the driver was even more reckless than the one who didn't hit anyone, but in the scenario, we are told they are equally reckless and drunk.

  Now, we must rank these in tiers S, A, B, C by how convincingly they can justify the differential punishment using desert alone.

  Analysis:

  - Pure culpability-based: Cannot justify differential punishment at all because it explicitly says desert is independent of outcomes. So, it would put both at the same level. Thus, it fails to justify harsher punishment for the completed harm. This should be low.

  - Resultant-luck-inclusive: This directly incorporates the outcome into desert. It says that the driver who caused the death is more deserving because of the death. This is a straightforward retributivist argument that the harm done increases the blameworthiness. However, it might be controversial because it allows luck to affect desert.

  - Character-based: The argument would be that the driver who killed someone has demonstrated a worse character because the outcome is a manifestation of their recklessness. But the problem is that both were equally reckless. The outcome might not necessarily indicate a worse character if the recklessness is the same. It's a bit of a stretch.

  - Risk/endangerment-calibrated: Both created the same risk, so they should be equally culpable. But one might argue that the punishment should be based on the risk created, and the outcome is irrelevant. However, if we are trying to justify harsher punishment for the one who caused harm, this view doesn't naturally support that because the risk is the same. It might even be against it.

  - Evidentiary: The outcome is used as evidence that the culpability was higher. For example, the fact that the driver hit and killed a pedestrian might be evidence that they were even more reckless than the other driver, or that their recklessness was of a higher degree. But the scenario states that they are equally reckless and drunk. So, if we take the scenario at face value, this might not hold because the outcome doesn't necessarily indicate greater culpability if we already know they are equal. However, in practice, outcomes can sometimes reveal more about the actor's state of mind (e.g., how drunk they really were, how reckless). But in the thought experiment, we are to assume they are equal. So, this might be weak.

  But note: the evidentiary view is often used to explain why we punish completed crimes more than attempts. The idea is that the completed crime provides more evidence of the actor's dangerousness or intent. However, in this case, since we stipulate equal culpability, it's hard to say the outcome provides evidence of greater culpability.

  Ranking:

  We are to justify punishing the completed harm more severely. The position that most convincingly does so with desert alone is resultant-luck-inclusive retributivism because it directly says that the harm done increases the desert.

  The other positions either cannot justify it (pure culpability-based, risk-based) or do so weakly (character-based and evidentiary).

  But let's think about character-based: One might argue that the driver who killed has a character flaw that was actualized, making them more blameworthy. However, if the character is the same, then why would the outcome change the desert? It's not clear.

  Evidentiary: If we are to assume that the two drivers are exactly equal in their culpability, then the outcome doesn't provide additional evidence. But in reality, we might not know for sure. The scenario, however, is set up as a thought experiment with equal culpability. So, evidentiary might struggle.

  Therefore, I would rank:

  S: Resultant-luck-inclusive retributivism. It directly justifies the differential punishment by saying the harm done is part of what makes the act more blameworthy.

  A: Maybe none? Or perhaps evidentiary and character-based could be A if we allow for some interpretation? But they are less direct.

  B: Character-based and evidentiary might be B because they can offer some justification, but it's not as strong.

  C: Pure culpability-based and risk-based are in C because they explicitly reject outcome as a factor and thus cannot justify differential punishment.

  But note: risk-based might be interpreted as focusing on the risk, and if the risk is the same, then punishment should be the same. So it cannot justify differential punishment. Similarly, pure culpability-based cannot.

  However, there is a version of risk-based that might say that the one who caused harm is punished more because the risk they created was realized? But that's not risk-based, that's outcome-based. Risk-based is about the ex ante risk, not the ex post outcome.

  So:

  - Resultant-luck-inclusive: S
  - Evidentiary: A (if we think that in practice, outcomes can provide evidence of culpability, even if in the thought experiment it's set equal, we might still use it as a proxy)
  - Character-based: B (it's a bit of a stretch to say the outcome changes the character assessment when we know the mental states are equal)
  - Risk-based and Pure culpability-based: C (they explicitly don't use outcomes and thus cannot justify the differential punishment)

