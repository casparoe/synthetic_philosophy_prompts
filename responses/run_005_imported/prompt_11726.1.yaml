  My friend and I spent a long evening arguing about moral luck in punishment. She holds that two equally drunk, equally reckless drivers — one who strikes and kills a pedestrian, one who swerves and hits nothing — are equally culpable and therefore deserve identical sentences, so the law's much harsher treatment of the first is just a confused concession to outcomes. I suspect she's wrong, but I could not explain why without appealing to deterrence, which we had already agreed to set aside as a separate question.

  Help me work through the purely retributivist side of this. Please rank the following positions by how convincingly each can use desert alone to justify punishing a completed harm more severely than an equally culpable failed attempt:

  - Pure culpability-based (harm-independent) retributivism
  - Resultant-luck-inclusive retributivism
  - Character-based retributivism
  - Risk/endangerment-calibrated retributivism
  - Evidentiary retributivism (on which the outcome counts as evidence of culpability rather than an independent basis for it)

  Give your answer as a JSON block of S/A/B/C tiers, formatted like:

  ```json
