answer: |-
  You're absolutely right to be skeptical, and your intuition about relocating rather than resolving the arbitrariness hits the nail on the head. Aaronson's complexity defense, while elegant and insightful, ultimately fails to save functionalism from the core problem of trivial realizations. Here's the strongest case for your side:

  1.  **Complexity Requires a Basis (The Core Problem Remains):** The entire complexity argument hinges on a *prior choice* of a **physical basis** – a specific way of carving up the physical system into discrete "input" and "output" states relevant to the computation. We need this basis to even *define* what "computing the mapping" means.
      *   **The Arbitrariness Shifts:** Putnam/Searle showed that *given any desired mapping* between a physical system's states and computational states, you can *gerrymander* the physical groupings to make it true. Aaronson counters that *finding* or *using* that mapping is computationally expensive. But the crucial point is: **What justifies the specific basis used to *measure* the complexity of finding/using the mapping?**
      *   **The Basis Choice is Still Arbitrary:** The complexity argument implicitly assumes a "natural" or "privileged" physical basis against which the cost of "decoding" the gerrymandered mapping is measured. But **why is *this* basis the correct one?** Physics itself doesn't inherently specify that we *must* use, say, individual molecule positions in the waterfall or atomic states in the wall as the fundamental units for defining computation. We choose that basis *because* it seems intuitive or fundamental *to us*.
      *   **Gerrymandering the Basis for "Cheapness":** Just as Putnam gerrymandered state groupings, one could potentially gerrymander the *basis itself* to make *any* desired mapping appear "cheap to compute" relative to *that* basis. If we are allowed to redefine the fundamental units of the physical system after the fact (e.g., defining "macro-states" that conveniently align with the computational states we want), then the complexity of the mapping collapses. Aaronson's argument only blocks *one specific type* of gerrymandering (state groupings) *relative to a fixed basis*. It doesn't block gerrymandering *the basis itself*.

  2.  **The Meta-Basis Problem (Infinite Regress):** How do we choose the "correct" basis for measuring complexity? Any proposed criterion for a "natural" basis (e.g., thermodynamic cost, causal structure, fundamental physics variables) faces the same challenge:
      *   **Who Decides "Fundamental"?** Are quarks more fundamental than atoms? Are atomic positions more fundamental than pressure waves? Physics describes systems at multiple levels. Why privilege one level over another for defining computation? The choice seems anthropocentric – we pick the level that makes sense *to us*.
      *   **Circularity:** To avoid triviality, we might say the basis must be one where *recognizing inputs/outputs* is computationally cheap. But this leads to circularity: we define "cheap computation" relative to a basis chosen to make computation cheap! The functionalist wants computation to be an objective feature of the world, but the basis choice needed to ground complexity feels subjective or pragmatic.
      *   **No Physics Mandate:** Physics doesn't come with a sticker saying "Use this basis for defining genuine computation." The equations work regardless of how we choose to interpret the variables. The requirement for a "non-gerrymandered" basis is an *extra-physical* constraint we impose to avoid absurdity, not one derived from physics itself.

  3.  **Complexity Doesn't Capture "Doing the Work" (Explanatory Gap):** Aaronson argues the waterfall isn't "doing the work" because extracting the result requires as much computation as running the program. But this misses the deeper philosophical point of *causal/explanatory relevance*.
      *   **Why *This* Computation?** Even if we grant a "natural" basis and acknowledge that decoding the waterfall's "computation" of your mind is expensive, the functionalist still needs to explain why the waterfall is *specifically* implementing *your mind* and not some other program that happens to share the same (gerrymandered) state sequence over that period. The mapping, however complex to decode, still exists mathematically. Complexity makes it *impractical*, but doesn't make it *false* or *non-existent*. The waterfall *is*, in some abstract mathematical sense, instantiating your mind-program under that mapping. The complexity argument says "But that's useless!" – it doesn't say "That's not happening."
      *   **The Causal Story is Missing:** For functionalism to explain mentality, the physical states need to *causally* support the transitions defined by the program in a non-accidental way. The waterfall's molecules don't transition *because* they are implementing the next step of your mind-program; they transition because of gravity and fluid dynamics. The "computation" is epiphenomenal – a post-hoc interpretation with no causal power. Complexity theory, by focusing on the cost of *decoding*, doesn't directly address this lack of causal connection between the physical dynamics and the abstract computational transitions. A mapping being "cheap to compute" might be *correlated* with causal relevance, but it doesn't *define* it or guarantee it. You could have a cheap mapping that's still causally inert (imagine a simple lookup table physically implemented but never used), or a complex mapping that *is* causally relevant but impractical to decode externally.

  4.  **"Cheap" is Relative and Subjective:** As you astutely noted, "cheap to compute" is only cheap relative to the computational resources of some *observer* and their chosen computational model (Turing machine, circuit, etc.). What's cheap for an advanced alien AI might be intractable for humans. Functionalism aims to define mental states objectively based on functional organization. Tethering "genuine implementation" to the subjective computational capacities of potential decoders undermines this objectivity. It makes the existence of a mind in a rock depend on who's looking at it and how powerful they are.

  **Conclusion: Complexity Relocates, Doesn't Resolve**

  Aaronson's complexity argument is a powerful and necessary critique of the *practicality* and *usefulness* of trivial mappings. It highlights that for a physical system to be a *practical computer* that we can *interact with as a computer*, the mapping must be computationally simple relative to a sensible basis. This is crucial for computer science and engineering.

  **However, it fails to rescue *functionalism* from the *metaphysical* challenge of Putnam and Searle.** The core arbitrariness – the dependence on an unjustified choice of physical basis for defining states and measuring complexity – remains. The problem isn't solved; it's simply shifted from gerrymandering state groupings to gerrymandering (or privileging without sufficient justification) the fundamental physical variables used to define the basis against which complexity is measured. Complexity theory provides excellent reasons why *we* shouldn't *interpret* a waterfall as running a mind, but it doesn't provide a physics-grounded, non-arbitrary principle for why the waterfall *objectively isn't* running a mind under *some* mapping, even if that mapping is complex for *us* to decode relative to *our* chosen basis. The ghost of trivial realization still haunts functionalism; complexity theory just dresses it in different clothes. Your friend's defense, while sophisticated, ultimately kicks the can of arbitrariness down the road without disposing of it.
