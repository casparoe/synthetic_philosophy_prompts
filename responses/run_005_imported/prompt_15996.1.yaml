  First, I need to recall the core arguments. Putnam's proof shows that any physical system can be mapped to any finite-state machine through gerrymandering. Searle's example, like the wall running WordStar, illustrates how absurd this can get. The friend's counter is that computational complexity saves functionalism by requiring "cheap to compute" mappings. But the user's point is that "cheap" depends on the chosen basis, which is arbitrary.

