answer: |-
  Here are eight interview questions targeting the mechanics of your guest's resolute-choice position on Kavka's toxin puzzle, including your requested focus areas and strategic follow-ups:

  1.  **Bratman's Simple View Challenge:** "Bratman argues that genuinely intending to φ requires *believing* you will φ. Given that you know at midnight you'll have no local reason to drink the toxin tomorrow, how can you simultaneously form the intention *and* hold the belief required by the Simple View? Doesn't your own prior reasoning undermine the belief necessary for the intention?"
      *   *Likely Reply:* Argues that belief applies at the policy/disposition level ("I believe I am the *type* of agent who follows through") or that intention doesn't require contemporaneous action-belief.
      *   **Follow-up:** "If the belief is only at the policy level ('I believe I'm resolute'), does that translate into a genuine *action*-belief ('I believe I will lift this vial tomorrow') at the moment of choice? If not, how does this avoid collapsing into a form of insincere intention or self-deception *about the specific act*?"

  2.  **McClennen's Framework & Extension:** "McClennen developed resolute choice for dynamic choice problems with non-expected utility preferences (e.g., temptation, risk-aversion over time), where sticking to a *plan* avoids inconsistency. The Toxin Puzzle involves a *predictor* exploiting knowledge of your disposition. Is extending 'resoluteness' to this predictor-based case a natural evolution of McClennen's idea, or does it fundamentally change the nature of 'resoluteness' by making it about *signaling a type* to an external agent rather than maintaining internal consistency?"
      *   *Likely Reply:* Argues it's a natural extension, emphasizing the temporal structure and commitment across time, or that signaling *is* a form of consistency.
      *   **Follow-up:** "In classic McClennen cases, resoluteness avoids a sure loss caused by *your own changing preferences*. In the Toxin case, drinking the toxin *is* a sure loss (the sickness) with no compensating gain *at that point*, only avoided by *not* being resolute. Doesn't this highlight a key difference – resoluteness here causes a local loss *because* of the predictor, rather than preventing one caused by inconsistency?"

  3.  **Mechanics of Intention Formation:** "Walk us through the *actual cognitive mechanics* at midnight. *How*, operationally, does a rational agent following your view form the 'genuine intention' to drink the toxin? Is it a conscious act of self-binding? A recognition of one's fixed disposition? How does this process avoid being a mere *simulation* of intention for the detector's benefit?"
      *   *Likely Reply:* Describes it as adopting a plan/policy, recognizing the benefits of being a certain agent-type, or a commitment device.
      *   **Follow-up:** "If the agent consciously thinks 'I am forming this intention *because* it gets me $1M, and I know I won't want to follow through later,' doesn't that very thought undermine the *sincerity* or 'genuineness' required by the puzzle? How does the intention differ from a calculated *performance* for the detector?"

  4.  **The "Reason" to Drink (Post-Midnight):** "You argue the agent has genuine reason to drink the toxin *after* midnight. Is this reason *internal* to the moment (i.e., does drinking *then* maximize expected utility given *only* post-midnight information)? If not, in what sense is it a 'reason' for action *at that time*, rather than a reason *for having been* resolute earlier?"
      *   *Likely Reply:* Argues the reason is diachronic – fulfilling the commitment *is* rational *as part of the adopted plan* that secured the $1M, or that it maintains integrity/identity as a resolute agent.
      *   **Follow-up:** "If the reason is solely diachronic (based on the past commitment/plan), doesn't this make 'rationality' at T2 entirely hostage to the agent's state at T1? How do you reconcile this with the standard decision-theoretic principle that rationality is assessed relative to current beliefs and desires?"

  5.  **Reliable (Not Infallible) Detector:** "Suppose the billionaire's detector is 99.9% reliable, but there's a tiny chance it misreads your intention. How does this uncertainty impact the rationality of *both* forming the intention at midnight *and* drinking the toxin tomorrow? Does it strengthen, weaken, or complicate the resolute-choice argument?"
      *   *Likely Reply:* Argues it doesn't fundamentally change the case; the benefits of resoluteness still dominate.
      *   **Follow-up:** "If there's a 0.1% chance the detector misreads a sincere intention as absent, doesn't that create a potential *benefit* to drinking the toxin anyway? If you *don't* drink, and the detector *did* misread, you lose the $1M *and* avoid the sickness. If you *do* drink, you guarantee the $1M *if* the intention was registered. Couldn't this tiny risk actually provide a *local*, post-midnight instrumental reason to drink, independent of resoluteness? Does this undermine the 'pure' resolute argument?"

  6.  **The Line: Toxin vs. Blackmail:** "You argue predictability pays off in Toxin. But consider a blackmail scenario: a predictor knows you are predictably resolute about *not* paying blackmail. They then never threaten you, saving you money. Conversely, if you're predictably *weak* (paying), you get threatened and pay. Here, being predictably resolute *also* seems beneficial. Yet, if a threat *is* made, paying is locally irrational (you lose money, the secret is out anyway). How does your resolute framework distinguish the Toxin case (where drinking post-reward is rational) from the Blackmail case (where paying post-threat seems irrational), given both rely on the benefits of predictable dispositions?"
      *   *Likely Reply:* Distinguishes based on the *source* of the benefit (reward for disposition vs. avoidance of cost), or the nature of the commitment.
      *   **Follow-up:** "In both cases, the *only* benefit of the disposition (resoluteness in Toxin, toughness in Blackmail) is *causal*: it shapes the predictor's/blackmailer's action *before* the costly local choice. Once the predictor/blackmailer has acted (paid reward/made threat), the disposition provides no *further* benefit at the local choice node. Why is following through rational in one costly local action (drinking) but not the other (paying)?"

  7.  **Cost of Failed Resolution:** "What happens under your view if the agent sincerely forms the intention at midnight (gets the $1M) but then *fails* to drink the toxin? Does this imply they were *never* truly 'resolute'? Or does it show the disposition is fragile? How does the theory account for this possibility without becoming unfalsifiable ('Anyone who didn't drink must not have *truly* intended')?"
      *   *Likely Reply:* Argues true resoluteness guarantees follow-through, or that fragility is a failure mode but doesn't invalidate the ideal.
      *   **Follow-up:** "If an agent can *sincerely* adopt the resolute policy at T1 (passing the detector) but still fail at T2 due to weakness of will or unforeseen circumstances, doesn't this create a *third* category beyond 'resolute' and 'non-resolute'? How does this affect the *incentive* to *try* to be resolute, knowing failure is possible even after succeeding with the detector?"

  8.  **Alternatives & Why Resoluteness?:** "Other solutions exist: causal decision theorists bite the bullet and say you can't intend/win, evidentialists might argue drinking provides *evidence* you're resolute (but it's costly), or sophisticated choice might involve precommitment devices. Given the practical and philosophical hurdles of *actually* forming the intention and drinking, why is adopting a *resolute disposition* the uniquely rational or most compelling solution compared to these alternatives, especially when considering real-world cognitive limitations?"
      *   *Likely Reply:* Argues resoluteness is the only solution capturing true diachronic rationality, avoids spurious correlations (evidentialism), or is the only way to actually get the $1M without tricks.
      *   **Follow-up:** "If the key is being *predictably* resolute, wouldn't a *reputation* for resoluteness (perhaps built through past actions *without* explicit predictors) or a verifiable *precommitment device* (e.g., locking yourself in) achieve the same payoff *without* requiring the cognitively challenging act of forming an intention you know you'll later defy? Doesn't this suggest resoluteness, while sufficient, isn't necessary for the optimal outcome?"

  **Key for Delivery:**

  *   **Listen Actively:** Use the follow-ups *only* if her initial answer points in the predicted direction. Be ready to pivot if she offers a novel rebuttal.
  *   **Clarify Jargon:** Briefly define terms like "Simple View," "McClennen," "diachronic" if needed for the audience, but keep it concise.
  *   **Maintain Tone:** Frame questions as genuine probes into fascinating mechanics, not gotchas. Your deep interest in the puzzle is evident – convey that curiosity.
  *   **Bridge if Needed:** If an answer feels incomplete for the audience, briefly restate the core tension before moving on (e.g., "So, just to clarify for listeners, you're saying that even though drinking the toxin *tomorrow* seems pointless *tomorrow*, the reason stems from..."). 

  These questions should push the discussion into the nuanced territory you want, moving beyond the standard exposition and directly engaging with the philosophical and decision-theoretic machinery underlying her resolute-choice defense. Good luck with the interview!
