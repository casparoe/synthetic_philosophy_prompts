  ### Adjudication of Moves

  1. **Elena's Move (1)**:  
     **Score**: -1  
     **Justification**: Elena claims that on Neander's selected-effects theory, the pigment's current function is solely mate attraction because it now explains the trait's presence. However, Neander's theory defines a trait's function as the effect for which it was *historically selected* during its evolutionary origin and maintenance, not necessarily the current maintaining cause. While the mate preference now maintains the gene, the trait's historical selection (190,000 years for UV protection) remains part of its etiology. Neander emphasizes the entire selective history, not just the present. Thus, Elena's "full stop" claim oversimplifies the theory and ignores historical context.

  2. **Marcus's Move (2)**:  
     **Score**: 0  
     **Justification**: Marcus correctly notes that Neander's theory prioritizes selection history over current effects and challenges Elena's presentist interpretation. However, he errs in implying that "sheer accumulated duration" mechanically determines function (e.g., 190,000 years outweighing 10,000 years). The theory does not specify duration as a criterion; it focuses on the effect that *explains the trait's persistence*, which could involve recent shifts. Marcus's duration-based argument is an ad hoc addition not found in Neander, weakening his otherwise valid critique of Elena's ahistorical reading.

  3. **Elena's Move (3)**:  
     **Score**: 2  
     **Justification**: Elena effectively counters Marcus by highlighting that rigid duration-based rules lead to absurdities (e.g., old functions always dominating despite new selective pressures). She correctly observes that etiological theorists in practice (e.g., when analyzing exaptations like feathers for flight) often prioritize the *current maintaining cause* when selective regimes shift decisively. Her point exposes a genuine ambiguity in applying selected-effects theories to functional shifts and aligns with how philosophers handle cases of "recent" selection (e.g., 10,000 years is ample for new functions to stabilize).

  4. **Marcus's Move (4)**:  
     **Score**: 2  
     **Justification**: Marcus astutely identifies that Neander's theory, as stated, lacks clear principles for handling conflicting historical episodes, requiring ad hoc judgments about "operative" selection. His advocacy for Cummins-style causal-role theory is a strong alternative: it cleanly avoids historical disputes by assigning functions contextually (e.g., UV-blocking relative to survival, mate attraction relative to reproduction). This move validly exposes a weakness in selected-effects accounts and offers a coherent, non-arbitrary framework for the case.

  5. **Elena's Move (5)**:  
     **Score**: 1  
     **Justification**: Elena rightly argues that Cummins' theory "dodges" the core dispute by refusing to rank functions normatively (e.g., "what the trait is *for*"). Causal-role theory relativizes functions to chosen capacities, which may not satisfy questions about biological design or proper function. However, her critique slightly overstates the issue: Cummins intentionally avoids normative rankings, focusing instead on explanatory utility. While correct that causal-role theory doesn't resolve the etiological debate, it doesn't aim to, making her "dodge" claim partially valid but overstated.

