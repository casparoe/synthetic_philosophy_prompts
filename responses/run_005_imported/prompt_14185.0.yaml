answer: |-
  ## Memorandum: Resolving Tied Proposals & Policy for Future Ties

  **To:** Graduate Research Council Members  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Resolution of Tied Proposals (Cycle [Cycle Number]) and Policy Recommendation for Future Ties  

  **Background:**  
  Two proposals (A & B) achieved identical scores under our established peer review rubric, triggering our standard near-tie resolution procedure: a lottery. A Council member has proposed overriding the lottery based on Harsanyi's aggregation theorem, arguing that Proposal A's marginally higher *expected payoff* (due to a noted but non-disqualifying methodological weakness in Proposal B) justifies an outright award to A. Others contend this undermines the core purpose and fairness of the lottery system, designed for precisely such close calls where further discrimination is unreliable. This memo recommends a resolution for the current cycle and proposes a clear policy for the future.

  **Analysis & Recommendation for Current Cycle (Proposals A & B):**  

  1.  **Uphold the Lottery:** I recommend we proceed with the scheduled lottery for Proposals A and B. Awarding the grant outright to Proposal A based on a marginal expected payoff calculation at this stage contravenes the foundational principle of our near-tie policy.
  2.  **Rationale:**
      *   **Purpose of the Lottery:** The lottery was instituted explicitly *because* our peer review process (like SNSF's) recognizes the limits of fine-grained discrimination between highly ranked proposals. When the rubric indicates a tie, it signifies that, *according to our pre-defined and agreed-upon criteria*, the proposals are indistinguishable. Introducing *post-hoc* calculations based on a single reviewer's concern, however valid, reintroduces the subjectivity and potential for bias the lottery seeks to avoid.
      *   **Slippery Slope & Fairness:** Accepting *any* detectable asymmetry as sufficient to override the lottery effectively nullifies the policy. It incentivizes members to search for minor differentiators after the fact, privileging whichever proposal happens to have a marginally quantifiable advantage someone chooses to highlight. This erodes procedural fairness and predictability. The weakness in B was noted *during* review but deemed insufficient to lower its score below A's – it was already factored in.
      *   **Harsanyi's Theorem Context:** While Harsanyi provides a powerful framework for aggregating utilities under uncertainty, its direct application here is problematic. It assumes we have reliable cardinal utilities for the outcomes and agreed-upon probabilities for success/failure – precisely the kind of fine-grained, reliable judgment our rubric and lottery system acknowledge we *lack* in near-tie situations. Applying it ad hoc to one specific concern risks misusing the theorem.

  **Strongest Argument for Overriding the Lottery (Harsanyi Position):**  

  The most compelling argument for overriding the lottery is grounded in **expected value maximization and epistemic responsibility.** Proponents argue that ignoring a known, quantifiable asymmetry favoring Proposal A (even if marginal) is irrational. If we possess information suggesting A has a higher probability of success or greater potential impact due to methodological robustness (information captured imperfectly by the ordinal rubric score), *not* acting on it wastes institutional resources and fails in our duty to fund the best possible research. Harsanyi's theorem formalizes the ethical intuition that social welfare should reflect the aggregated expected utilities of individuals, and in this case, awarding to A maximizes the expected social welfare based on the available information. To disregard this known difference, they argue, is akin to willful blindness when a clearer path exists.

  **Policy Recommendation for Future Ties:**  

  To prevent recurring debate and ensure clarity, I propose the following formal addition to our near-tie resolution policy:

  1.  **Strict Lottery Application:** When two or more proposals achieve identical final scores under the approved review rubric, the grant shall be awarded via a random lottery among those tied proposals.
  2.  **Override Criteria:** The lottery may **only** be overridden if, *and only if*, one of the following conditions is met *prior to the lottery being conducted*:
      *   a) **Formal Appeal & Council Vote:** A Council member formally appeals the scoring outcome based on a demonstrable, **significant**, and **previously unconsidered material error** in the review process itself (e.g., miscalculation of score, reviewer conflict of interest not previously disclosed, failure to apply the rubric correctly). The Council must vote by a supermajority (e.g., 2/3) to sustain the appeal and re-score/re-evaluate.
      *   b) **Pre-Defined Disqualifiers:** The proposal is found to violate a pre-defined, absolute disqualification criterion established in the grant call guidelines (e.g., ethical non-compliance, principal investigator ineligibility, budget exceeding limits) that was missed during initial screening.
  3.  **No Post-Hoc Differentiation:** Concerns about relative methodological strength, potential payoff, institutional priorities, or other comparative merits **already reflected in the proposal scores** (i.e., the tie) cannot be used to override the lottery. Such factors must be rigorously incorporated into the rubric design and scoring phase.

  **Justification for Policy:**

  *   **Preserves Core Intent:** Ensures the lottery functions as intended – a fair, impartial mechanism for resolving cases where peer review, by design, cannot reliably distinguish between proposals.
  *   **Procedural Fairness & Predictability:** Provides clear, objective rules for when an override is permissible, preventing ad hoc justifications and ensuring all tied proposals are treated equally under the rules known in advance.
  *   **Efficiency:** Avoids lengthy debates over marginal differences in close calls, respecting the time of the Council and the peer reviewers.
  *   **Strengthens Rubric Design:** Encourages continual refinement of the review rubric itself to capture critical factors like methodological robustness *during scoring*, rather than relying on post-hoc overrides.

  **Conclusion & Action for Friday:**  

  For the current tied Proposals A and B, I strongly recommend we proceed with the lottery as scheduled. This upholds our established policy, ensures fairness, and avoids setting a precedent that undermines the lottery's purpose.  

  Regarding the future, I propose we adopt the policy outlined above ("Strict Lottery Application" with clear "Override Criteria") to provide clear guidance and prevent similar disputes. I recommend we vote on adopting this policy amendment at Friday's meeting following the resolution of the current lottery.  

  Let's discuss this on Friday to finalize both the current award and our long-term approach.
