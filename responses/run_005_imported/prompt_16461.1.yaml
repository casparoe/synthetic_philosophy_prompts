  - The thirder view: Credence should be 1/3, because there are three possible awakenings (heads-Monday, tails-Monday, tails-Tuesday), each equally likely from her perspective, and only one has heads.

  - The halfer view: Credence should be 1/2, because the coin is fair, and waking up doesn't give her new information since she knew she'd be woken up regardless.

