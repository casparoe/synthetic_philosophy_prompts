  ### Example: Pair of Gambles with Risk-Weighted Expected Utility Preference

  **Outcomes (in monetary units):**  
  - \(x_1 = 0\)  
  - \(x_2 = 1,000,000\)  
  - \(x_3 = 5,000,000\)  

  **Gambles:**  
  - **Gamble A:** \(1,000,000\) with certainty.  
    - *Probability distribution:* \(P_A(1,000,000) = 1.0\).  
  - **Gamble B:**  
    - \(5,000,000\) with probability \(0.10\),  
    - \(1,000,000\) with probability \(0.89\),  
    - \(0\) with probability \(0.01\).  
  - **Gamble C:**  
    - \(1,000,000\) with probability \(0.11\),  
    - \(0\) with probability \(0.89\).  
  - **Gamble D:**  
    - \(5,000,000\) with probability \(0.10\),  
    - \(0\) with probability \(0.90\).  

  **Preferences:**  
  - **Without common consequence (direct choice):** \(A \succ B\)  
  - **With common consequence (embedded in larger context):** \(D \succ C\)  

  **Risk function:** \(r(p) = p^3\) (convex, reflecting risk aversion).  

  **Utility function:** \(u(x) = x\) (linear, valuing outcomes monetarily).  

  ---

  ### REU Calculation (Buchak's Theory):  
  1. **REU of Gamble A:**  
     - Only outcome: \(1,000,000\) with probability 1.  
     - \(\text{REU}(A) = u(1,000,000) = 1,000,000\).  

  2. **REU of Gamble B:**  
     - Outcomes ordered: \(0 \leq 1,000,000 \leq 5,000,000\).  
     - Weighted utility:  
       \[
       \text{REU}(B) = u(0) + r(0.99) \cdot (u(1,000,000) - u(0)) + r(0.10) \cdot (u(5,000,000) - u(1,000,000))
       \]  
       - \(r(0.99) = (0.99)^3 \approx 0.970\),  
       - \(r(0.10) = (0.10)^3 = 0.001\).  
       \[
       \text{REU}(B) = 0 + 0.970 \cdot (1,000,000) + 0.001 \cdot (4,000,000) \approx 970,000 + 4,000 = 974,000.
       \]  
     - Since \(974,000 < 1,000,000\), \(A \succ B\).  

  3. **REU of Gamble C:**  
     - Outcomes ordered: \(0 \leq 1,000,000\).  
     \[
     \text{REU}(C) = u(0) + r(0.11) \cdot (u(1,000,000) - u(0)) = 0 + (0.11)^3 \cdot 1,000,000 \approx 0.00133 \cdot 1,000,000 = 1,330.
     \]  

  4. **REU of Gamble D:**  
     - Outcomes ordered: \(0 \leq 5,000,000\).  
     \[
     \text{REU}(D) = u(0) + r(0.10) \cdot (u(5,000,000) - u(0)) = 0 + (0.10)^3 \cdot 5,000,000 = 0.001 \cdot 5,000,000 = 5,000.
     \]  
     - Since \(5,000 > 1,330\), \(D \succ C\).  

  ---

  ### Independence Axiom Violation in Orthodox EU:  
  - Orthodox EU requires \(A \succ B\) to imply \(C \succ D\) (since \(C\) and \(D\) are linear mixtures of \(A\) and \(B\) with a common outcome of \(0\)).  
    Specifically:  
    \[
    C = 0.11A + 0.89[\$0], \quad D = 0.11B + 0.89[\$0].
    \]  
  - Here, \(A \succ B\) but \(D \succ C\), violating the independence axiom.  

  ---

  ### Stochastic Dominance Respect:  
  - **Gambles A and B:** \(A\) does not stochastically dominate \(B\) (e.g., \(B\) has a \(10\%\) chance of \(5,000,000 > 1,000,000\)).  
  - **Gambles C and D:**  
    - For \(x < 0\): Both have \(P(\geq x) = 1\).  
    - For \(0 \leq x < 1,000,000\):  
      - \(P_C(\geq x) = 0.11\) (only \(1,000,000\) outcome),  
      - \(P_D(\geq x) = 0.10\) (only \(5,000,000\) outcome).  
      - Since \(0.11 > 0.10\), \(C\) has a higher probability of meeting \(x\) here.  
    - For \(1,000,000 \leq x < 5,000,000\):  
      - \(P_C(\geq x) = 0\) (no outcome \(\geq x\) except \(1,000,000\), which is \(< x\)),  
      - \(P_D(\geq x) = 0.10\) (\(5,000,000 \geq x\)).  
      - Here, \(D\) dominates \(C\).  
    - For \(x \geq 5,000,000\): Both have \(P(\geq x) = 0\).  
  - **No stochastic dominance** between \(C\) and \(D\) (neither uniformly dominates the other). Thus, preferring \(D\) to \(C\) does not violate stochastic dominance.  

  ---

  ### Intuitive Rationality (Not a Framing Effect):  
  The preference \(A \succ B\) and \(D \succ C\) is intuitively rational due to the **certainty effect**:  
  - In \(A\), the certainty of \(1,000,000\) is highly valued. The \(1\%\) risk of nothing in \(B\) feels unacceptably salient when a guaranteed gain is available.  
  - In \(C\) and \(D\), both have high probabilities of nothing (\(\sim 89-90\%\)). Here, the certainty effect vanishes:  
    - The extra \(1\%\) chance of \(1,000,000\) in \(C\) (vs. \(D\)) is negligible when outcomes are likely \(0\) anyway.  
    - The "long shot" at \(5,000,000\) in \(D\) (even at slightly lower probability) is worth the trade-off.  
  This reflects a **context-dependent** attitude: risk aversion near certainty, but risk-seeking in losses or low-probability gains. Orthodox EU cannot model this, but REU (via convex \(r\)) weights worst outcomes more heavily, capturing the shift when certainty is removed.
