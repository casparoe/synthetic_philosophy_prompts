  Give an example of a pair of gambles over monetary outcomes for which Lara Buchak's risk-weighted expected utility theory permits a preference pattern that orthodox expected-utility theory would diagnose as an independence-axiom violation, while the REU-permissible pattern still respects stochastic dominance. Specify the outcomes, probabilities, and an admissible risk function r, and briefly explain why the independence violation strikes you as intuitively rational in this case rather than as a mere framing effect.
reasoning: |-
  We are to find two gambles such that under REU theory with an appropriate risk function r, the preference pattern violates the independence axiom of expected utility theory (EUT) but still respects stochastic dominance.

   Recall the independence axiom: If an agent prefers gamble A to gamble B, then for any gamble C and any probability p, the agent should prefer the compound gamble [p A; (1-p) C] to [p B; (1-p) C].

   We want a pair of gambles (A, B) such that:
     Without loss of generality, suppose without the common consequence the agent prefers A to B.
     But when mixed with a common consequence C with some probability, the preference reverses: [p B; (1-p) C] is preferred to [p A; (1-p) C].

   In REU theory, the utility is calculated by:
     REU(f) = ∫ u(x) d(r ∘ P)(x)   [but note that for discrete gambles we can compute as:]

   For a gamble with outcomes x_1 < x_2 < ... < x_n and probabilities p_1, p_2, ... p_n (with ∑p_i=1),
     the REU is: REU = u(x_1) + r(1-p_1)(u(x_2)-u(x_1)) + ... 
     More precisely, if we order the outcomes from worst to best: x_1 ≤ x_2 ≤ ... ≤ x_n, then:
     REU = u(x_1) + r(∑_{i=2}^n p_i) * (u(x_2)-u(x_1)) + r(∑_{i=3}^n p_i) * (u(x_3)-u(x_2)) + ... 

   We need an admissible risk function r: [0,1] -> [0,1] that is increasing and concave? Actually, Buchak requires r to be increasing with r(0)=0, r(1)=1, and typically for risk aversion it is convex? 
   But note: In Buchak's theory, risk aversion is captured by a convex r (which gives more weight to the worst outcomes). However, let me check: 
     The weight on the outcome x_i is: r(∑_{j=i}^n p_j) - r(∑_{j=i+1}^n p_j)   (if we order from worst to best). 
     For risk aversion, we want more weight on the worse outcomes. This is achieved when r is convex? Actually, Buchak (2013) states that a convex r corresponds to risk aversion.

   So let us choose a convex r. For example, r(p) = p^2.

   We also require that the preference respects stochastic dominance. That is, if gamble A stochastically dominates gamble B, then the agent should prefer A to B.

   Example:

   Consider the following two gambles:

     A: $100 with probability 0.9, $0 with probability 0.1
     B: $50 for sure.

   Without a common consequence, let us see:

     EUT with u(x)=x (risk neutral):
        EU(A) = 0.9*100 + 0.1*0 = 90
        EU(B) = 50
        So EUT would prefer A to B.

     But we want an example where the independence axiom is violated when we mix with a common consequence. So let us design a common consequence that might reverse the preference.

   However, note that we want the reversal to occur in REU but not in EUT. Also, we want to respect stochastic dominance.

   Idea: Use the Machina triangle. Consider the following three outcomes: $0, $50, $100.

   Let us define:
     Gamble A: (100, 0.9; 0, 0.1)
     Gamble B: (50, 1)

   Now, let us mix with a common consequence C that is a bad outcome. For example, let C be $0. But then note:

     Compound gamble 1: [0.5 A; 0.5 C] = [0.5 A; 0.5 0] 
          This is: 100 with prob 0.45, 0 with prob 0.55.
     Compound gamble 2: [0.5 B; 0.5 C] = [0.5 * 50; 0.5 * 0] 
          This is: 50 with prob 0.5, 0 with prob 0.5.

