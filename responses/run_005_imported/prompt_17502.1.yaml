  Also, the orthogonality thesis suggests that capability doesn't dictate goals, but the user's point is about reward as the goal. I should clarify that while the agent is trained to maximize reward, the resulting policy might not have an explicit "desire for reward" but rather a set of behaviors that historically led to reward. 

