  Also, the hole argument's indeterminism is about manifold points, not physical fields. Since points aren't observable, the disagreement isn't physical. The user might wonder if this is just philosophical hand-waving. But no—it's baked into how GR predictions are made. For example, in a black hole simulation, the code tracks invariant amplitudes, not coordinate-dependent values. 

