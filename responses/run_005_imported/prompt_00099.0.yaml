answer: |-
  This is an excellent and central tension in social theory! Let's break down your comparison points between Lewis's *convention* and Bicchieri's broader *social norm*, addressing your specific questions:

  **Core Distinctions:**

  1.  **Lewis's Convention:**
      *   **Foundation:** Coordination problem with **multiple strict Nash equilibria**.
      *   **Motivation:** Pure self-interest (everyone prefers to conform *if* others do). Conformity avoids coordination failure (e.g., crash, missed call).
      *   **Arbitrariness:** **Essential.** Any equilibrium would work equally well; the *specific* regularity is arbitrary (driving left *vs.* right).
      *   **Knowledge:** **Common knowledge** of the situation, the alternatives, individual preferences, rationality, and the existing regularity is **absolutely central** to the persistence of the convention. Everyone knows everyone knows, etc.
      *   **Equilibrium Preference:** Indifference (or near-indifference) between the possible equilibria *given others' behavior*.
      *   **Conflict:** Minimal conflict of interest; the problem is purely coordinating *which* solution to adopt.

  2.  **Bicchieri's Social Norm:**
      *   **Foundation:** **Conditional preference** for conformity, triggered by:
          *   **Empirical Expectations:** Belief that *others* conform ("most people do X").
          *   **Normative Expectations:** Belief that *others believe one *should* conform* and will sanction deviation (disapproval, punishment) *or* that one has an internalized obligation ("I *should* do X").
      *   **Motivation:** Mix of self-interest (avoiding sanctions), social approval, and potentially internalized values. Sanctions (even mild disapproval) are key.
      *   **Arbitrariness:** **Not Essential.** The normatively prescribed behavior may *not* be arbitrary. There might be a morally/ethically/economically "better" outcome (fairness, reciprocity, queueing). Defection might be individually tempting (mixed-motive).
      *   **Knowledge:** **Normative expectations are central.** Common knowledge *can* exist but is **not strictly necessary**. What matters is the *individual's belief* about others' behavior and expectations/sanctions. Knowledge can be patchy or based on local observation.
      *   **Equilibrium Preference:** Individuals may *prefer* the outcome where everyone follows the norm (e.g., fairness), but face a temptation to defect unilaterally. The norm equilibrium is often *Pareto-superior* but not necessarily a coordination equilibrium in Lewis's strict sense.
      *   **Conflict:** Often involves **mixed motives** and potential conflicts of interest (e.g., I'd benefit from queue-jumping *if* I could get away with it, but the norm prevents it).

  **Addressing Your Questions:**

  1.  **The Work of Arbitrariness & Restrictiveness:**
      *   **Essential Work in Lewis:** Arbitrariness *does* crucial work. It explains why the *specific* regularity persists purely through precedent and common knowledge, *without* needing intrinsic value, sanctions, or moral force. It highlights that coordination, not the content, is key. It justifies why switching conventions is hard without explicit agreement – any alternative is just as good *in principle*, but breaking the established pattern risks coordination failure.
      *   **Too Restrictive for Norms? Absolutely.** This is Bicchieri's core critique. Many crucial social norms are *not* arbitrary:
          *   **Fairness:** Splitting equally isn't arbitrary; it embodies a value. An unequal split favoring me might be *my* preferred equilibrium, but the norm dictates otherwise.
          *   **Reciprocity:** Returning a favor isn't arbitrary; it sustains cooperation against defection.
          *   **Prohibitions:** Norms against theft or violence aren't arbitrary; they prevent clear harms. Alternative "equilibria" (everyone steals) are disastrous, not equally good.
          *   **Mixed-Motive:** In queueing, unilateral defection *is* tempting and potentially beneficial *if* unpunished. Lewis's model struggles here because conformity isn't *always* the best response if you think you can get away with it – normative expectations (sanction threat) are needed. Lewis's model captures pure coordination (driving side) but not the enforcement problem inherent in many norms.

  2.  **Common Knowledge vs. Normative Expectations:**
      *   **Lewis: Centrality of Common Knowledge:** Common knowledge is the *engine* of Lewisian conventions. It allows individuals to confidently predict others' behavior based purely on rationality and the known regularity, locking in the arbitrary equilibrium without needing sanctions or moral commitment. Without CK, the convention could unravel due to uncertainty.
      *   **Bicchieri: Centrality of Normative Expectations:** While empirical expectations (what others *do*) are important, **normative expectations** (what others *think I should do* and the sanctions they might apply) are the distinctive motivator for norm compliance, especially in non-coordination contexts. Common knowledge *of the norm* might exist, but what matters most is the individual's *belief* about the likelihood and severity of sanctions (social or internal) for non-compliance. Bicchieri can explain norm persistence with less-than-perfect knowledge.

  3.  **Lewis as Special Case vs. Distinct Phenomenon:**
      *   **Lewis as a Special Case:** This is the most common and useful perspective. Lewis provides a powerful, clean model for a *specific subset* of social regularities: **pure coordination conventions.** Driving side, traffic light meaning, currency design, some vocabulary choices, certain procedural rules – these fit Lewis's model beautifully. They are genuinely arbitrary, coordination-focused, and sustained by precedent and common knowledge.
      *   **Distinctness Within the Broader Category:** However, Lewisian conventions *are* distinct *within* the broader category of social norms described by Bicchieri (and others like Elster or Ullmann-Margalit) because:
          *   **Lack of Sanctioning Mechanism:** Sanctions are peripheral or non-existent in Lewis; persistence relies solely on avoiding coordination failure via common knowledge. Norms *require* the potential for sanction (social or internal).
          *   **Absence of "Ought":** Lewisian conventions lack the intrinsic normative "ought" force. We follow them because it's *prudent* (to avoid crashing), not necessarily because we feel we *should* or fear disapproval *for violating a rule*. We might disapprove of someone driving on the wrong side, but it's primarily because it's dangerous to *us*, not solely because they broke a sacred rule.
          *   **Pure Coordination vs. Mixed Motive:** Lewis captures situations where interests are perfectly aligned *conditional on coordination*. Bicchieri's norms thrive where interests *diverge* and need to be managed or suppressed.

  **Conclusion:**

  Your study group is right to sense a gap. Lewis provides an elegant, game-theoretic account of **arbitrary coordination conventions** sustained by **common knowledge and precedent**. Bicchieri offers a broader, psychologically richer account of **social norms** sustained by **conditional preferences triggered by empirical and, crucially, *normative* expectations**, applicable to both coordination problems *and* pervasive mixed-motive situations involving fairness, cooperation, and prohibition where arbitrariness doesn't hold and sanctions matter.

  *   **Lewis is indispensable** for understanding the logic of genuinely arbitrary coordination points.
  *   **Lewis is insufficient** for understanding the vast majority of social norms involving values, enforcement, mixed motives, and non-arbitrary prescriptions. Bicchieri's framework provides the necessary tools here.
  *   **Lewisian conventions are best seen as a distinct and important *subset* of social norms** – those characterized by pure coordination, arbitrariness, and persistence via common knowledge rather than sanctioning. They are a foundational *type* of norm, but not the whole story. Trying to force norms like fairness or queueing into the strict Lewisian box obscures their essential motivational and structural differences.

  Your point about "lumping" is key. While Lewisian conventions *are* norms (regularities of behavior), their specific causal mechanism (common knowledge solving pure coordination) makes them a distinct *sub-type* within the broader universe of social norms governed by the logic of conditional preferences and normative expectations described by Bicchieri. Recognizing this distinction is crucial for precise social explanation.
