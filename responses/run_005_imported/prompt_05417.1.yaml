answer: |-
  Here are 7 interview questions designed to push your guest beyond restating Lewis and engage critically with her solution, including your specified focuses and likely follow-ups:

  1.  **Core Mechanism Question:** Lewis identifies a fundamental asymmetry: we reject *prison* substitution but accept *fine* substitution. Your paper aims to bridge this gap by explaining "how" penal substitution *could* make sense. What is the core mechanism or principle in your account that *specifically* resolves this asymmetry, allowing a penalty to be justly transferred in a way Lewis thought we intuitively resist for prison?
      *   *Likely Follow-up:* Lewis emphasizes that punishment targets the *offender* personally. Doesn't your mechanism risk undermining the core retributive idea that the offender themselves must bear the burden? How does it avoid making punishment merely transactional?

  2.  **Severity Threshold Question:** Lewis preempts the "fines are just fees" objection by pointing to fines severe enough to constitute real punishment (e.g., bankrupting someone). Does your account of *how* substitution works **depend** on the penalty having this kind of severe, personally burdensome character, or could it theoretically apply even to milder penalties we might be more tempted to call mere fees? Could it apply to prison?
      *   *Likely Follow-up:* If your account *doesn't* require that severity threshold, doesn't that significantly weaken Lewis's initial contrast? If it *does* require it, how does your mechanism explain why severity is the crucial factor enabling substitution?

  3.  **Practicality Objection Question:** Lewis doubts the common explanation that we tolerate fine substitution simply because we can't practically stop people from giving each other money. He thinks something deeper is at play. Do you agree with Lewis's skepticism here? If so, what's your alternative explanation for *why* we accept fine substitution that goes beyond mere practical impossibility?
      *   *Likely Follow-up:* If your alternative explanation (e.g., about the nature of the burden, social function, or symbolic aspect of fines vs. prison) is correct, why *couldn't* a similar logic be extended, in principle, to accepting prison substitution under certain (perhaps very specific) conditions your account might define? Doesn't accepting the explanation for fines open the door?

  4.  **The "Shared Inconsistency as Evidence" Challenge:** Lewis ends by suggesting our shared inconsistency (rejecting prison-sub, accepting fine-sub) is weak evidence that penal substitution *can* somehow make sense. But isn't this just as consistent with the idea that we are *all* making the *same mistake* about fines? Why should shared inconsistency point towards coherence rather than shared confusion? How does your positive account specifically leverage this inconsistency as *evidence for possibility*?
      *   *Likely Follow-up:* Doesn't successfully *providing* a coherent account (your paper's goal) do the real evidential work, rendering Lewis's appeal to the inconsistency itself redundant, or at best, merely a pointer towards a puzzle needing solution, not evidence *for* a solution?

  5.  **Distinguishing Debt vs. Penalty Question:** Lewis stresses punishment isn't a debt with a creditor wanting to be made whole. Your account presumably needs to respect this. How does your mechanism for substitution *avoid* collapsing punishment back into a debt-like model, where the "creditor" (society? the victim? the law?) is satisfied by *any* bearer of the cost?
      *   *Likely Follow-up:* If the substitute's bearing of the penalty *does* satisfy the demands of justice in your account, doesn't that *make* it functionally equivalent to paying a debt owed by the offender? How is this fundamentally different?

  6.  **Applying the Mechanism to Lewis's Prison Intuition:** Lewis relies heavily on the strong intuition that "nobody thinks" a friend serving prison time lets the offender off the hook. How does your proposed mechanism for substitution *specifically address or overturn* this core intuition? Does your account imply that our intuition about prison substitution is actually mistaken, or does it show how substitution could work *without* contradicting that intuition?
      *   *Likely Follow-up:* If your account *does* suggest prison substitution could be coherent, what concrete, real-world example (even hypothetical) would demonstrate this coherence in a way analogous to paying a friend's fine? If it *doesn't* apply to prison, how does it fully resolve the asymmetry Lewis identified?

  7.  **Implications for Punishment Theory:** If your account successfully shows *how* penal substitution can be coherent, what does this imply for our broader understanding of the purpose or nature of legal (or even divine) punishment? Does it shift the emphasis away from retribution targeting the individual offender, or does it reframe what retribution means?
      *   *Likely Follow-up:* Critics might argue that accepting penal substitution, even in your sophisticated form, inherently weakens the link between culpability and suffering that many see as fundamental to justice. How does your mechanism preserve a sufficiently strong link between the offender's guilt and the penalty imposed (even if borne by another)?

  **Key features of these questions:**

  *   **Focus on HER Mechanism:** They constantly push her to explain *her* solution (#1, #3, #5, #6, #7) and how it addresses Lewis's specific points.
  *   **Target Lewis's Crucial Moves:** They directly tackle the severity threshold (#2), the practicality explanation (#3), and the "inconsistency as evidence" claim (#4) as you requested.
  *   **Challenge Intuitions & Coherence:** They question whether her solution aligns with or overrides deep intuitions (#6) and whether it inadvertently revives the debt model (#5).
  *   **Explore Broader Implications:** They push her to consider the consequences of her theory for punishment philosophy (#7).
  *   **Anticipate Defenses:** The follow-ups are designed to probe the likely weak points or standard defenses of her position, forcing deeper engagement.
  *   **Avoid Restatement:** They assume familiarity with Lewis's argument and immediately demand application and critique of the guest's contribution.

  These questions should force your guest to defend, clarify, and deepen the exposition of her original argument in the context of Lewis's puzzle. Good luck with the interview!
