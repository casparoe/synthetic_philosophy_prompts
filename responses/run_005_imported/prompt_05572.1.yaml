  ### Graded Response  
  **Overall Score:** 19/20 (A)  
  **Summary:** An excellent answer overall, demonstrating clear understanding of the paradox, its implications, and the philosophical stakes. Minor deductive inaccuracies in part (c) prevent a perfect score.  

  ### Detailed Comments  
  #### (a) State Fitch's paradox and give the formal derivation (10/10)  
  - **Strengths:**  
    - Perfectly states the paradox: KP + Non-Omniscience → contradiction.  
    - Formal derivation is complete and logically precise (reductio structure, instantiation of KP on \(p \land \neg Kp\)).  
    - Explicitly identifies **Distribution** (\(K(p \land q) \to Kp \land Kq\)) and **Factivity** (\(Kp \to p\)) as the key properties of \(K\) driving the contradiction.  
  - **No improvements needed.**  

  #### (b) Premise rejection and anti-realist implications (6/6)  
  - **Strengths:**  
    - Correctly identifies **KP** as the standardly rejected premise (due to the absurdity of denying Non-Omniscience).  
    - Clearly explains why this is uniquely problematic for **anti-realists**: Their verificationist theory of truth *requires* KP, whereas realists can reject KP without cost.  
    - Bonus: Mentions Tennant’s restriction strategy (Cartesian propositions), showing deeper engagement.  
  - **No improvements needed.**  

  #### (c) Accuracy of "there are truths that can never be known" (3/4)  
  - **Strengths:**  
    - Correctly affirms the gloss as **accurate** in its core claim: The argument proves the *existence* of unknowable truths (e.g., \(p \land \neg Kp\)).  
  - **Weakness:**  
    - Incorrectly states that the argument shows "\(p\) is a truth that can never be known." **Error:** The argument shows \(p \land \neg Kp\) is unknowable, not \(p\) itself. \(p\) may become known later (if \(Kp\) holds, \(p \land \neg Kp\) is false, but \(p\) remains true).  
    *Example:* Let \(p =\) "The number of stars is odd." If \(p\) is unknown today, \(p \land \neg Kp\) is unknowable *now*. But \(p\) itself could be known tomorrow.  
  - **Improvement:** Specify that the unknowable truth is the **conjunction** \(p \land \neg Kp\), not \(p\).  

