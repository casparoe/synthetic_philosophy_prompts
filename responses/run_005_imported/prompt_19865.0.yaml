  I need to think about what both are missing. Mara might not address how to handle peers who reject conciliationism. Owen might overlook that his double-check isn't independent. Also, calibration scores being identical doesn't mean equal reliability on this specific question. Maybe they should consider the possibility that one is more reliable here. The user mentioned obscurity—perhaps prior probabilities matter. 

