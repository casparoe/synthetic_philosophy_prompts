answer: |-
  ## Memorandum to Members of Convocation  
  **Re:** Non Placet Motion on Honorary Degree for President Truman  
  **From:** [Your Name], Fellow of [Your College]  
  **Date:** 20th May, 1956  

  **Recommendation:** I urge Convocation to support Miss Anscombe’s *non placet* motion, forcing open debate on this degree. While the consequences of withholding honour from a wartime leader are grave, the moral questions raised demand public scrutiny. Oxford must not bestow its highest accolade while fundamental accusations of mass murder, grounded in just war principles we claim to uphold, remain unchallenged in our forum.  

  ### I. The Core of Anscombe’s Argument
  Miss Anscombe’s contention is not merely that the atomic bombings caused horrific civilian casualties – a tragic reality of war acknowledged by all. Her specific charge, grounded in the Doctrine of Double Effect (DDE), is that these acts constituted *intentional mass murder*.  

  *   **The Double Effect Distinction:** DDE holds that it may be permissible to cause foreseen but *unintended* evil as a side-effect of pursuing a proportionate good end (e.g., civilians dying incidentally during the bombing of a munitions factory). It is *never* permissible to *intend* evil as a means to an end.  
  *   **Application to Hiroshima/Nagasaki:** Anscombe argues that the destruction of the cities *themselves*, with their entire civilian populations, was not a regrettable by-product; it was the *chosen method*. The explicit aim, as evidenced by target selection, lack of specific military objectives within the cities, and contemporaneous statements, was to break Japan’s will to fight by demonstrating the catastrophic, indiscriminate destructive power of the bomb upon civilian life. The death and terror of non-combatants were not merely foreseen; they were *instrumental* to achieving surrender. This makes the killing intentional, not incidental. Therefore, it constitutes murder under just war doctrine, irrespective of the subsequent surrender or potential lives saved.  

  ### II. Engaging the Strongest Counter-Argument: The "Redescription" Defence
  The most potent counter to Anscombe is not the utilitarian calculus of lives saved, but the assertion that the atomic bombings can be *redescribed* consistent with DDE, mirroring conventional Allied strategic bombing:  

  *   **The Case for Redescription:** A defender of the bombings argues the *intended* act was destroying Japan's *capacity and will to wage war*. Hiroshima and Nagasaki were legitimate targets as industrial/command centres. The immense civilian casualties were a *foreseen but unintended consequence* of attacking these war-sustaining targets with a powerful new weapon, just as civilian deaths in Dresden or Tokyo were foreseen but unintended consequences of destroying industrial infrastructure and morale via conventional bombing. The *proximate means* was destroying military-industrial assets; civilian deaths were a terrible, foreseen, but *collateral* effect. To condemn Hiroshima as murder logically compels condemning the entire Allied strategic bombing campaign on the same grounds. Given the context of total war against an implacable foe, such a sweeping condemnation is unrealistic and ignores the brutal necessity of targeting an enemy's warmaking potential. The end (victory, saving lives overall) was proportionate, and the means, however devastating, did not *intend* civilians *qua* civilians as the object of destruction.  

  *   **Fair Weighting:** This argument deserves serious respect. It reflects the prevailing strategic doctrine of the war. To dismiss it would be to dismiss the rationale underpinning immense sacrifices made by Allied airmen and commanders. If this description holds, Anscombe’s charge of murder fails, reducing the bombings to a tragic, albeit perhaps disproportionate, act of war. The burden then shifts to Anscombe to show why Hiroshima is *qualitatively* different.  

  ### III. Why the Redescription Fails: Intent Matters
  However, the redescription defence, while powerful, ultimately falters under close scrutiny of the *specific intent* and *method* employed at Hiroshima and Nagasaki:  

  1.  **Targeting Civilians as Method:** The selection of entire, largely civilian-populated cities (as opposed to specific military installations *within* them, which were secondary or absent), the explicit goal of causing maximum shock and awe *through* civilian devastation (as per the Target Committee minutes and Secretary Stimson's own troubled reflections on avoiding Kyoto *because* it was purely civilian/cultural), demonstrates that the destruction of non-combatant life and morale was not a side-effect, but the *primary mechanism* chosen to compel surrender. The weapon was deployed *because* its indiscriminate horror would paralyse the enemy's will.
  2.  **Absence of Discriminate Military Objective:** Unlike a raid on a factory complex where civilian deaths are incidental, here the *city itself* was the target. There was no attempt to isolate military assets; the bomb's effect was inherently indiscriminate by design at that scale against an urban centre. The "military objective" became indistinguishable from the civilian population centre.
  3.  **Distinction from Conventional Strategic Bombing:** While the firebombing of Tokyo raises similar profound moral questions, the atomic bombings represent an *apotheosis* of the intentional targeting of civilian populations as the direct instrument of victory. The instantaneous, near-total annihilation of two cities, chosen specifically to maximize the psychological impact of civilian destruction, crystallizes the intent in a way that dispersed conventional raids, however destructive and morally fraught, do not with the same stark clarity. While Anscombe’s logic *might* extend to condemn aspects of the conventional bombing campaign, Hiroshima and Nagasaki stand as uniquely clear and horrific instances where the *method itself* was the mass killing of civilians. To accept the redescription here risks evacuating the core principle of non-combatant immunity of all meaning. If *this* is "collateral damage," then the principle is dead.  

  ### IV. The Stakes for Oxford
  This is not merely a historical debate about tactics.  

  *   **Honor vs. Judgment:** Conferring an honorary Doctorate of Civil Law is not a neutral act. It is Oxford’s highest mark of *moral and intellectual esteem*. To bestow this honour upon an individual accused, with serious philosophical justification grounded in the very principles of justice and law we teach, of authorizing mass murder, implicates the University in seeming to endorse those acts.  
  *   **Suppressing Debate is Unworthy:** Allowing the degree to pass "on the nod" avoids discomfort but betrays our intellectual duty. Miss Anscombe has presented a rigorous, principled argument rooted in the just war tradition Oxford cherishes. To refuse even to debate it publicly is an abdication of our responsibility as a community dedicated to reasoned discourse on profound moral questions.  
  *   **The "Lives Saved" Argument:** While proponents argue the bombings saved countless lives by averting an invasion, this *consequentialist* consideration, however weighty, does not answer Anscombe’s *deontological* charge concerning the intrinsic nature of the act itself. Even if true, saving lives does not morally cleanse an intrinsically unjust *means*. Our vote concerns honour, not retrospective strategic justification.  

  ### Conclusion
  The redescription defence, while potent, fails to convincingly demonstrate that the mass killing of civilians in Hiroshima and Nagasaki was merely foreseen and unintended collateral damage. The evidence strongly supports Anscombe’s view that it was the intended instrument of policy. This places the acts beyond the pale of actions Oxford can honourably celebrate with its highest degree.  

  **Therefore, I urge you to support the *non placet*.** Let us force a full and open debate. Let the arguments for and against be heard publicly in Convocation. If, after that debate, a majority still believes the degree should be awarded, so be it. But to award it without confronting the profound moral challenge Anscombe has laid before us, based on principles central to our understanding of law and justice, would diminish Oxford and tacitly endorse an act that, on the strongest available moral reasoning, constitutes mass murder. We owe President Truman, the victims of Hiroshima and Nagasaki, and our own academic conscience nothing less than this difficult, necessary scrutiny.
