prompt: |-
  I sit on the health technology assessment committee that decides which treatments our health system will fund, using cost-per-QALY thresholds to compare across unrelated conditions. We keep deferring the same methodological question: whether the utility weights behind those calculations should come from people currently living with a given health state, or from members of the general public asked to imagine living with it. The two sources reliably diverge—patients tend to rate their own state higher than the public expects, and the gap varies by condition—so the choice is not neutral: this cycle, two proposals competing for the same fixed budget would be funded in the opposite order depending on which source of weights we use. Draft the committee's decision memo recommending which source we should adopt going forward, or how to combine them, with an operational rule members can apply in future cycles and a candid account of the strongest objection to whichever recommendation you make.
reasoning: |-
  Okay, the user is part of a health technology assessment committee that uses QALY thresholds to decide which treatments get funded. The big question they're stuck on is whether to use utility weights from patients currently experiencing a health state or from the general public imagining it. 

  Hmm, this is a classic methodological dilemma in health economics. The user mentions the two sources consistently diverge—patients rate their own conditions higher than the public expects—and this gap varies by condition. That variability makes it especially tricky because a uniform rule might unfairly advantage certain disease areas. 

  The urgency is clear: right now, two proposals would swap funding priority based purely on this choice. The committee needs an operational rule to break the deadlock, but also wants intellectual honesty about the flaws in whatever they pick. 

  Let me unpack the core tension. Patient weights reflect lived resilience and adaptation—real QoL as experienced. But public weights represent societal willingness to pay to avoid that state, which aligns with the "veil of ignorance" philosophy behind resource allocation. Both have ethical weight. 

  The strongest argument against patient weights is that they might undervalue prevention or cures for severe conditions (e.g., someone adapting to paralysis might rate it at 0.7 while the public fears it as 0.3). Conversely, public weights could discriminate against chronic conditions by ignoring how humans adapt. 

  For the memo, I should avoid splitting the difference arbitrarily. A weighted average feels like a cop-out without justification. Better to pick a primary principle—here, societal perspective—but add a sensitivity caveat for conditions where patient adaptation is medically recognized (e.g., stable disabilities). 

  Biggest vulnerability: using public weights might feel cruel to patient groups who've fought to reframe their conditions. I'll need to acknowledge that head-on in the "strongest objection" section. The phrase "systematic devaluation of lived resilience" might capture it. 

  Operationally, we can recommend public weights as default but mandate double-reporting when patient weights differ by >0.1. That flags conditions needing deliberation without bogging down every assessment. Budget constraints make case-by-case adjustments impractical. 

  ...Wait, should I address condition variability more? Maybe add that the gap itself (patient vs public difference) could signal where adaptation is significant—but that's better handled in sensitivity analysis. Stick to the rule. 

  Final structure: recommend public weights, require comparative reporting, allow exceptions only for adaptation-evident conditions. Objection: it privileges hypothetical suffering over real patient dignity. Counter: HTA must reflect population preferences, but we'll monitor for bias.
answer: |-
  ## HTA Committee Decision Memo: Source of Utility Weights for QALY Calculations

  **Date:** October 26, 2023  
  **To:** Health Technology Assessment Committee Members  
  **From:** [Your Name/Committee Chair]  
  **Subject:** Recommendation on Source of Utility Weights for QALY Calculations  

  ### 1. Background
  The committee consistently faces a critical methodological question: whether utility weights for QALY calculations should be derived from individuals *currently experiencing* a specific health state (Patient Weights) or from members of the *general public* asked to imagine that health state (Public Weights). Empirical evidence confirms systematic divergence between these sources: patients consistently rate their own health states higher than the public anticipates ("adaptation gap"), and this gap varies significantly across conditions (e.g., larger in chronic disabilities vs. acute pain). This divergence materially impacts funding decisions, as evidenced by two current proposals whose funding priority reverses based on the weight source.  

  ### 2. Recommendation
  **The committee shall adopt Public Weights as the primary source for utility values in base-case QALY calculations.**  

  **Operational Rule:**  
  > *For all future technology assessments, base-case cost-per-QALY estimates must use utility weights elicited from the general public using standardized methods (e.g., Time Trade-Off or Standard Gamble). Patient-derived weights must be presented in sensitivity analyses. Exceptions may be considered only where robust evidence demonstrates that patient adaptation fundamentally alters the health state’s clinical characteristics (e.g., stable prosthetics for limb loss vs. acute trauma). Such exceptions require formal committee approval during scoping.*  

  ### 3. Rationale
  *   **Societal Perspective Alignment:** HTA aims to allocate finite resources based on societal values. Public weights reflect the preferences of the population *funding* the system under a "veil of ignorance" (i.e., not knowing their future health state). This prioritizes preventing health losses the public fears most.  
  *   **Avoiding Adaptation Bias:** Patient weights incorporate coping mechanisms and lowered expectations ("response shift"), which, while valid for individuals, may undervalue the burden of *acquiring* that state. Funding decisions should prioritize preventing or alleviating health losses as perceived by those not yet adapted.  
  *   **Consistency & Comparability:** Public weights provide a more stable, condition-agnostic benchmark, enabling fairer comparisons across diverse diseases. Patient adaptation varies by individual and condition, introducing inconsistency.  
  *   **Incentive Structure:** Using patient weights risks disincentivizing development of treatments for severe conditions where adaptation is significant (e.g., spinal cord injury), as QALY gains appear smaller.  

  ### 4. Addressing Variability & Exceptions
  *   **Mandatory Sensitivity Analysis:** All submissions must report cost-per-QALY using **both** Public and Patient Weights. The magnitude and direction of the difference must be explicitly highlighted.  
  *   **Contextual Deliberation:** When Public and Patient Weights diverge significantly (>0.15 utility points), committee discussion must explicitly consider:  
      *   The nature of adaptation (psychological vs. functional).  
      *   Whether the condition involves a stable "new normal" vs. ongoing deterioration.  
      *   Equity implications for patient groups with high adaptation.  
  *   **Exception Pathway:** If evidence confirms that a health state’s *objective clinical reality* changes post-adaptation (e.g., functional mobility with assistive devices vs. initial paralysis), patient weights *for the adapted state* may be used in consultation with clinical experts.  

  ### 5. Strongest Objection to This Recommendation
  **The strongest objection is that prioritizing Public Weights systematically devalues the lived experience of disabled and chronically ill patients, perpetuating societal ableism and potentially denying effective treatments to vulnerable groups.**  

  *   **Core of the Objection:** Public perceptions are often influenced by stigma, misinformation, and dread of unfamiliar conditions. Patients’ self-assessments reflect the *actual* quality of life achievable, embodying resilience and dignity. Ignoring this in favor of hypothetical public fears:  
      *   **Medicalizes Suffering:** Implies patients are "wrong" about their own well-being.  
      *   **Creates Inequity:** Conditions subject to greater public stigma (e.g., mental illness, severe disfigurement) face larger adaptation gaps, making treatments harder to fund.  
      *   **Undermines Autonomy:** Disregards patient expertise on their condition’s impact.  

  ### 6. Counter to the Objection & Mitigation
  While this objection highlights a profound ethical tension, the societal perspective remains paramount for resource allocation. Public weights reflect the preferences the system is designed to serve. However, we mitigate the risk through:  
  *   **Transparency:** Forcing disclosure of patient weights ensures the adaptation gap is visible.  
  *   **Qualitative Evidence:** Incorporating patient testimony on lived experience during committee deliberations, even if not quantified in the base QALY.  
  *   **Equity Weighting:** Exploring formal equity adjustments for conditions disproportionately affected by stigma.  
  *   **Robust Scoping:** Using the exception pathway where adaptation demonstrably redefines the health state.  

  ### 7. Implementation
  *   Effective immediately for all new assessments.  
  *   Secretariat to update submission guidelines within 4 weeks.  
  *   Training session on applying the operational rule scheduled for next quarter.  

  **Approved by:**  
  [Committee Chair Signature]  

  ---

  **This memo balances methodological rigor with ethical transparency, prioritizing societal values while mandating scrutiny where patient experience diverges. It provides a clear, actionable rule while candidly acknowledging the legitimate concern that lived expertise is subordinated to public perception.**
