prompt: |-
  ok so this happened at our department happy hour last week and I still can't decide who won. We'd just gotten out of a seminar on the demandingness objection to consequentialism, and two people from the group kept going at it over beers -- and somehow it turned into a fight about our friend Marcus's espresso machine (he was sat right there for this, since it's his machine).

  Marcus is saving up for a $900 espresso machine instead of giving that money to a charity like AMF, and it went like this:

  (1) Dana said that if you're actually a consistent consequentialist you have to say Marcus does something wrong every time he puts money toward the machine instead of donating it, since the marginal good it'd do for someone in extreme poverty is way higher, and theres no principled place to stop short of "give until it hurts."

  (2) Marcus said fine, bite that bullet, but that just proves the theory is broken -- no remotely plausible moral theory can demand that much sacrifice from ordinary people living ordinary lives, so if a theory implies that, it counts against the theory, not against him.

  (3) Dana said that's not an argument, that's just "ouch I don't like that" -- Marcus is running modus tollens on the theory purely because he doesn't like the conclusion, which he'd never accept as a legit move if the theory told him something convenient instead.

  (4) Marcus said there's a real asymmetry though: fixes like satisficing consequentialism or agent-relative prerogatives aren't ad hoc patches, they're tracking something we already believe pretheoretically -- that people aren't just impersonal conduits for maximizing welfare -- so carving out room for your own life and projects is a principled move, not a dodge.

  (5) Dana said that once you let a prerogative like that back in, you've thrown out the exact thing that made consequentialism worth taking seriously in the first place, namely that nobody's plans get extra weight just because they're theirs -- so "fixing" the demandingness problem this way just quietly swaps consequentialism for a different, non-consequentialist theory in a trenchcoat.

  I was mostly just trying to eat my fries through all this, but now it's stuck in my head. Can you go through (1)-(5) and give me a verdict on each as a JSON block, like {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>}, scoring from -2 (clearly wrong) to 2 (clearly right), then justify each score in a couple sentences? Also -- is there some third position on demandingness that both of them are totally missing here?
