  I'm doing a PhD in philosophy (decision theory-ish) and I've been chasing the "coherence theorems" thread that shows up in AI safety arguments -- the claim that any sufficently capable agent ends up behaving like an expected utility maximizer on pain of getting money-pumped. The transitivity pump makes sense to me, but the completeness one bugs me: if I'm genuinely indifferent-or-incomparable between A and B, the classic argument says a bookie can still cycle me through a series of trades and walk off with my cash. Then there's this "resolute choice" escape hatch (McClennen's idea originally, and I think Thornley leans on a version of it against the AI-safety coherence arguments specifically) where the agent supposedly dodges the pump just by sticking to whatever plan it started with instead of re-evaluating trade-by-trade. That feels like it might be cheating somehow -- like it's assuming the agent has exactly the kind of determinate ranking we stipulated it lacked, just relocated to the level of "plans" instead of "options." Can you actually spell out the mechanics of why resolute choice is supposed to block the completeness money-pump, and give me your honest take on whether that's a genuine dissolution of the problem or just a relabeling of it?
