answer: |-
  Here’s a dialogue between **Max** (a maximizing act-consequentialist) and **Sofia** (a satisficing consequentialist) that digs into the core tension, with neither conceding easily. The debate escalates but ends in stalemate, reflecting the unresolved literature.

  ---

  **Setting:** *A campus coffee shop after the seminar. Max stirs their espresso aggressively.*

  **Max:** Sofia, I still can’t believe you presented satisficing as a *solution* to demandingness today. Slote’s move isn’t just elegant—it’s *sloppy*. Bradley demolished it in ’06.  

  **Sofia:** *[Sighs, setting down her chai]* Max, demandingness *is* a legitimate problem for you. When morality requires supererogatory heroism as the *baseline*, it alienates ordinary agents. Satisficing recalibrates—  

  **Max:** —By licensing *knowingly* suboptimal choices! That’s not recalibration; it’s moral negligence. Let’s make it concrete. Imagine this:  

  > *You’re walking past a shallow pond. A child is drowning. Wading in saves her at no real cost—ruins your $200 shoes. Maximizing says: save her. Satisficing says: if "good enough" is "no one dies today," you could walk away if you’ve already donated to Oxfam this month. But you *know* saving her is better than not. You’d choose worse for no reason.*

  **Sofia:** That’s a caricature. A plausible threshold isn’t "barely adequate." It’s context-sensitive. If I’ve already prevented significant harm today, satisficing might release me from *this* obligation without catastrophe.  

  **Max:** But *why*? If you *know* saving her adds net good—saves a life at trivial cost—choosing not to is deliberately inefficient. Bradley’s right: it’s not just failing to maximize; it’s *preferring* a worse world when a better one is effortlessly available. How is that anything but irrational?  

  **Sofia:** Because "irrational" presupposes your maximizing framework! You’re begging the question. Once we reject optimization as *required*, the charge of "inefficiency" loses its moral force. Morality isn’t an engineering project. If I’ve met a robust threshold of decency, I’m permitted to tend to my projects—  

  **Max:** —Even when doing so *actively makes things worse*? Let’s escalate the case. Same pond, but now two children are drowning. You save one easily. You *could* save the second just as easily, but it’s slightly inconvenient—maybe you’d miss your train. Satisficing says: if saving *one* clears the "good enough" bar, you can let the second die. You *know* saving both is better, yet you choose the world where one dies unnecessarily. That’s not "tending to your projects"; it’s *complicity*.  

  **Sofia:** *[Leans forward]* You’re conflating *permission* with *indifference*. Satisficing permits stopping after meeting the threshold—it doesn’t *command* it. I might still save the second child! But crucially, I’m not *obligated* to bleed myself dry in every marginal case. Your maximizer can’t stop—there’s always another child, another dollar to donate. That’s why your theory is *alienating*. Mine acknowledges human limits.  

  **Max:** But at what cost? You’re building arbitrariness into the foundation. Where does the threshold sit? If it’s "prevent imminent death," then in my two-child case, saving one meets it—so you can ignore the second. If you set it higher ("save all children present"), you’ve just smuggled maximizing back in! Slote’s "good enough" is either arbitrary or covertly maximizing.  

  **Sofia:** Thresholds aren’t arbitrary; they’re grounded in *lifeworld* norms. A "decent human" doesn’t let children drown when saving them is costless. But they also aren’t a utility monster. My threshold might demand significant sacrifice—just not *all* sacrifice. And it’s sensitive to cumulative costs: constantly saving every child might ruin my career, harming my long-term impact. Your view ignores psychological sustainability.  

  **Max:** *[Pauses]* Fine—granted that crushing demands backfire. But that’s pragmatic, not moral! You should say: "Agents *should* maximize, but we must be realistic about motivation." Instead, satisficing says: *it is morally permissible to do less than best*. That’s a different claim—and Bradley’s objection stands. If morality permits knowingly choosing worse outcomes, it fails its own consequentialist premise: that we should *promote good outcomes*.  

  **Sofia:** *Promotion* isn’t synonymous with *maximization*. I "promote good" by ensuring outcomes meet a high threshold—say, in the top 20% of what’s feasible—not by squeezing out the last 0.1%. Your "knowingly worse" charge only bites if we accept that *every* suboptimal choice is a moral failure. But why accept that? Morality governs *agents*, not outcomes in a vacuum. A theory that ignores our need for non-moral goods is *bad for us*—and thus, consequentially, bad *simpliciter*.  

  **Max:** But that’s rule-consequentialism! You’re justifying a *rule* ("satisfice") because universal maximizing has bad effects. But act-satisficing isn’t a rule—it’s a criterion for permissibility *in the moment*. In my pond case, the satisficing *act* (walking away) *directly* causes a worse outcome. No appeal to long-term effects fixes that.  

  **Sofia:** Unless the act is part of a *pattern* that sustains a flourishing agent who does more good overall! Your myopic focus on isolated acts ignores how moral psychology works. I might save *more* children in my lifetime by satisficing today—because I’m not burnt out or resentful.  

  **Max:** *[Shakes head]* Now you’re changing the subject to *indirect* effects. But Bradley’s point is about *direct* suboptimality. Satisficing says: *even when you know* choosing A causes 100 utils and B causes 99, B is permissible if it clears the threshold. That’s not pragmatism—it’s structural indifference to the good. And *that* feels like a surrender, not a solution.  

  **Sofia:** And your maximism feels like fanaticism. We’re at an impasse because we disagree on the *nature* of moral reasons. You see them as agent-neutral optimizers. I see them as goals that must be *livable*. Until you take the psychological costs of your theory seriously, you’ll keep dismissing satisficing as "irrational"—but that’s just a label for your discomfort with pluralism.  

  **Max:** And until you explain why *knowingly choosing worse* isn’t a moral failure, satisficing is a license for complacency. We agree on one thing though:  
  *(Both take a sip, eyeing each other warily)*  
  **Max & Sofia:** *This isn’t resolved.*  

  ---

  **Key Moves Illustrated:**  
  - **Max’s Press:** Uses concrete cases to force Sofia to confront *direct* suboptimality (Bradley’s core objection).  
  - **Sofia’s Pushback:**  
    - Rejects "efficiency" as question-begging (§4).  
    - Invokes *cumulative* costs and agent sustainability (§6).  
    - Distinguishes *promotion* from *maximization* (§10).  
  - **Max’s Counter:**  
    - Distinguishes pragmatic from moral permissibility (§7).  
    - Rejects appeals to indirect effects as changing the subject (§11).  
  - **Stalemate:** Max sees satisficing as surrendering the good; Sofia sees maximizing as ignoring moral psychology.  

  **Why It Doesn’t Resolve:**  
  Satisficing requires rejecting the maximizing standard *as definitional* of consequentialism—a move maximists see as ad hoc. But maximists struggle to address demandingness without retreating to indirect versions (e.g., rule-consequentialism), which satisficers argue concedes their point about direct optimization being unsustainable. The debate hinges on deeper divides about moral reasons, agency, and the weight of psychological costs.
