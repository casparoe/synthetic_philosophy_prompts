  From the paper (Safe Pareto Improvements for Delegated Game Playing, by Caspar Oesterheld and Vincent Conitzer, 2022):

  Definition 1 (Safe Pareto improvement): Let s be a strategy profile. We say that a subset of agents I ⊆ N can make a safe Pareto improvement (SPI) if there exists a strategy profile s′_I for the agents in I such that for all agents i ∈ I and all strategy profiles s′_{−I} for the agents not in I, we have u_i(s′_I, s′_{−I}) ≥ u_i(s), and for some agent j ∈ I and some s_{−I}, we have u_j(s′_I, s_{−I}) > u_j(s).

