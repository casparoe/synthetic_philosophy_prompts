answer: |-
  You've hit upon one of the most fascinating tensions in *On Certainty*! Priya is tapping into a crucial nuance, but your instinct about needing *something* fixed is also core to Wittgenstein. The metaphors *are* compatible, but they emphasize different aspects of a dynamic system. Here's a close reading:

  1.  **§341-343 (Hinges): The Functional Necessity of Fixity**
      *   **Core Idea:** For doubt, inquiry, and knowledge claims to function *at all*, *some* propositions must be exempt from doubt. They are the *logical preconditions* for the "game" of doubting and knowing.
      *   **"The hinges must stay put":** This emphasizes the *functional necessity*. If you want the door (of inquiry/doubt) to turn, *something* has to be fixed. Without *some* fixed points, the whole system collapses into incoherence ("I can't doubt everything all at once").
      *   **What it *doesn't* say:** It doesn't say *which specific* propositions *must always* be hinges, nor that *any particular* hinge is immutable for all time. The focus is on the *role* (being the fixed point enabling movement) and the *logical requirement* that such points exist *for the system to work*.
      *   **"Exempt from doubt":** This exemption isn't based on their inherent, eternal truth (like Descartes' cogito), but on their *role within a framework*. They are held fast *by* the system they enable.

  2.  **§96-99 (River-Bed): The Historical Fluidity of Content**
      *   **Core Idea:** *Which* propositions play the role of the fixed framework (the river-bed) can and does change over time. The relationship between the "hardened" (hinge-like) propositions and the "fluid" (empirical, testable) ones is dynamic.
      *   **"Fluid propositions harden, and hard ones become fluid":** This explicitly states that the *content* of what serves as a hinge is not fixed. A proposition that was once an empirical hypothesis subject to testing can become so deeply embedded in a worldview that it functions as a hinge (e.g., "The Earth is round" for us). Conversely, a hinge proposition can lose its foundational status and become open to empirical investigation (e.g., "The Earth is the center of the universe").
      *   **"The river-bed of thoughts may shift":** This directly addresses your question. The *entire framework* can evolve. New bedrock forms; old bedrock erodes or is covered over.
      *   **"Bank... partly hard rock... partly sand":** This adds crucial nuance. The framework isn't monolithic. Some elements are incredibly stable ("hard rock," perhaps logical/mathematical propositions or very deep world-pictures for Wittgenstein, like "The world has existed for more than 5 minutes"). Others are more like "sand" – more readily subject to change or erosion (e.g., specific scientific paradigms or culturally contingent beliefs).
      *   **"Movement of the waters... shift of the bed itself... not a sharp division":** This acknowledges the complexity. Shifts in empirical beliefs (waters) can *gradually* lead to a shift in the framework (bed). There's no clear moment when a fluid proposition *becomes* hardened or vice-versa. It's a process. This also means that during periods of significant change, the boundary between "hinge" and "empirical" might be blurry.

  3.  **Reconciling Hinges and River-Beds: Necessity vs. Contingency**
      *   **Compatibility:** The passages are *entirely* compatible. They address different levels:
          *   **Hinges (§341-343):** Describe the *logical/functional necessity*: For inquiry/doubt to occur, *some* propositions *must* function as fixed points *at any given time*. "The hinges must stay put" means *hinges-in-general* are necessary for the door to turn.
          *   **River-Bed (§96-99):** Describes the *historical/contingent reality*: *Which specific* propositions occupy that role of "hinge" or "river-bed" *can and do change* over time. Individual hinges *can* be swapped out.
      *   **Priya is right:** To say hinges are absolutely "fixed bedrock" in the sense of being eternally immutable *specific propositions* is a misreading. Wittgenstein explicitly allows for their fluidity *as specific contents*. The river-bed metaphor *does* loosen the potentially misleading rigidity of the hinge metaphor by emphasizing this dynamism and the gradation within the framework.
      *   **You are also right:** The *functional requirement* for *some* fixed points ("hinges must stay put," the necessity of *a* river-bed) *is* absolute and unchanging. The system *requires* fixity *somewhere* to function. If *all* hinges dissolved simultaneously, inquiry would cease. The river-bed image acknowledges this by distinguishing the *shift* of the bed (which happens) from the *absence* of a bed (which would mean no defined flow at all).

  4.  **The Crucial Role of "Mythology" (§97)**
      *   **Not a throwaway!** You're absolutely right to flag this. Given Wittgenstein's critique of Frazer in *Remarks on Frazer's Golden Bough*, "mythology" is a loaded term.
      *   **Meaning Here:** He's likely referring to the network of deep-seated, often non-rationalized, culturally embedded beliefs and practices that form a significant part of a worldview's framework. Think of foundational narratives, origin stories, basic assumptions about agency, causality, or the sacred/secular divide.
      *   **"Mythology may change back into a state of flux":** This reinforces the dynamism. What was once taken as unquestionable, sacred, or foundational "myth" can lose its grip and become open to questioning, reinterpretation, or abandonment. (e.g., shifts from mythological to scientific cosmologies).
      *   **Connection to Hinges:** Much of what functions as a "hinge" *is* mythological in this sense – not empirically verified facts, but the deep background that gives facts their meaning and context within a form of life. Their change is often slower and more profound than shifts in empirical beliefs.

  **Conclusion & Why the Confusion is Understandable:**

  *   **Yes, compatible:** The hinge metaphor establishes the *functional necessity* of fixed points for rational inquiry. The river-bed metaphor describes the *historical reality* that the *specific content* of those fixed points evolves.
  *   **Priya wins the "fixed" point:** Calling hinges "fixed bedrock" *if* it implies specific, eternal propositions *is* misleading. Wittgenstein explicitly allows hinges to "become fluid." The river-bed passage *does* provide a more nuanced, dynamic picture that tempers the apparent rigidity of the hinge image.
  *   **You win the "necessity" point:** Wittgenstein *is* adamant that *some* framework *must* be in place. Inquiry is impossible in a state of total flux. The hinges *must* stay put *for the door to turn*, meaning some framework *must* hold fast *at any given moment*.
  *   **"Mythology":** Is key. It points to the deep, often culturally specific, non-empirical elements that form part of the river-bed/hinges. Their flux represents a profound shift in the worldview itself.
  *   **The Confusion Source:** The tension arises because Wittgenstein is describing a system that is both *logically rigid* (requiring fixed points) and *historically fluid* (allowing the content of those points to change). We naturally want to pin down *what* is fixed, but he insists only that *something* must be, while constantly reminding us that what *is* fixed today might not be tomorrow. The numbering (river-bed before hinges) suggests he was working *towards* the hinge metaphor, refining his picture of the framework, with the river-bed already containing the crucial insight of dynamism that the hinge metaphor, read in isolation, might obscure.

  **In short:** The river-bed *can* shift, and individual hinges *can* be swapped, but the *need* for *a* river-bed, for *some* hinges to stay put, is constant. Priya is correct about the fluidity of specific hinges; you are correct about the necessity of having hinges. The metaphors work together to describe a system that is foundationally stable *as a whole* at any moment, yet historically evolving *in its specific foundations* over time. The "mythology" is the deep cultural sediment within that shifting bed. Keep arguing – it's the best way to read Wittgenstein!
