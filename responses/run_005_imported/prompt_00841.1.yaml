answer: |-
  This is a deeply ethical and legally complex situation, and your discomfort is completely understandable. Your boss's argument ("we didn't *do* anything") is a common defense, but it's often legally and ethically insufficient, especially in cases involving known hazards in common areas. Here's a breakdown:

  1.  **The Primary Responsibility Lies with the Building Owner/Manager:**
      *   **Legal Duty (Premises Liability):** The building owner (or their manager) has the primary legal duty to maintain common areas in a reasonably safe condition for tenants, visitors, and invitees (like delivery personnel). This includes adequate lighting in stairwells.
      *   **"Constructive Notice":** The key legal concept here is "notice." The building manager is liable if they *knew* or *should have known* about the hazard. A light bulb burning out for a month in a heavily trafficked area creates a strong argument for "constructive notice" – they *should* have known through reasonable inspection or maintenance schedules. The fact that no one reported it *might* weaken the "actual notice" argument, but doesn't necessarily negate constructive notice.

  2.  **The Role of Tenant Companies (Like Yours):**
      *   **No Direct Duty to Maintain:** Your boss is technically correct that your company likely had no *direct* contractual duty to *fix* the light. That was the building manager's job.
      *   **Potential Duty to Warn or Report:** However, tenants *can* have a legal duty if:
          *   **They Created the Hazard:** Not applicable here.
          *   **They Assumed Responsibility:** Did your lease or any agreement imply responsibility for reporting maintenance issues? Even without that...
          *   **They Had Knowledge of a Dangerous Condition:** This is the crucial point. If a tenant *knows* about a dangerous condition in a common area that the owner might not be aware of, and that condition poses a foreseeable risk of serious harm (like a dark stairwell), courts in many jurisdictions *have* found that the tenant has a duty to either:
              *   **Warn** others about the danger, or
              *   **Report** the danger to the party responsible for fixing it (the building manager).
      *   **The "Bystander Effect" Isn't a Legal Defense:** The fact that multiple companies knew and everyone assumed "someone else" would report it ("bystander effect") doesn't legally absolve any individual company that had knowledge. Each company aware of the hazard could potentially be seen as failing in a potential duty to act on that knowledge to prevent foreseeable harm.

  3.  **Why Your Boss's Argument is Flawed (Legally and Ethically):**
      *   **"Nonfeasance" vs. "Misfeasance":** Your boss is relying on the distinction between *misfeasance* (doing something wrong) and *nonfeasance* (failing to act). While the law is generally more reluctant to impose liability for pure nonfeasance (inaction), **exceptions exist when there is a "special relationship" or a duty to act.**
      *   **Duty Based on Knowledge and Foreseeability:** The relationship here is that your company (and others) were regular users of the common area, *knew* about the specific hazard, could *foresee* the risk of injury (falling on dark stairs is highly foreseeable), and were in a position to easily mitigate that risk with a simple phone call. This can create a legal duty to act.
      *   **"We didn't break it" isn't enough:** The legal question isn't just "who broke it?" but "who knew it was broken and dangerous, and failed to take reasonable steps within their power to address the danger?"
      *   **Ethical Failure:** Ethically, knowing about a clear danger in a shared space you use daily and choosing not to report it because "it's not my job" is a failure of collective responsibility. The injury was a direct, foreseeable consequence of that collective inaction.

  4.  **Who Gets Blamed (Liability)?**
      *   **Primary Target:** The delivery guy's lawyer will almost certainly go after the **building owner/manager first and hardest.** They have the deepest pockets and the clearest legal duty.
      *   **Potential for Tenant Liability:** The lawyer *may* also sue the tenant companies (or some of them) as co-defendants. Their argument would be: "These companies knew about this dangerous condition for weeks, used the stairs daily, understood the risk, and failed in their duty to warn users or report it to the building manager. Their inaction contributed to the accident."
      *   **Apportionment:** If multiple parties are found liable (building manager + one or more tenants), a court (or settlement) would apportion the percentage of fault (e.g., building manager 80%, Tenant A 10%, Tenant B 10%). Your company's defense would be "The building manager is 100% responsible; we had no duty," but as explained, that's not guaranteed to succeed.
      *   **Lease Agreements:** Your company's lease will be scrutinized. Does it require tenants to report hazards? Does it indemnify the building owner? These clauses matter.

  5.  **Is your boss "right"?**
      *   **Legally:** It's **uncertain, but risky.** While the building manager is the primary responsible party, your company *could* potentially face liability or be dragged into a lawsuit due to its knowledge and inaction. Saying "we didn't do anything" is not an automatic legal shield in this specific context. His view is an *optimistic* legal interpretation, not a guaranteed one.
      *   **Ethically:** His stance is **definitely a cop-out.** It ignores the shared responsibility everyone using that space had once they knew about the hazard. The "not doing something" (failing to report a known, obvious danger) directly contributed to the accident.

  **What this means for you & your office:**

  *   **Your company *could* be named in a lawsuit.** Your boss should be consulting the company's lawyers *now*, not just assuming immunity.
  *   **Document everything:** When did your company first know? Who knew? Was there any internal discussion about reporting it? Find any evidence (emails, messages, witness accounts). *Do not destroy anything.*
  *   **Future Prevention:** This is a harsh lesson. **Implement a clear policy immediately:** Any employee noticing *any* safety hazard (broken light, wet floor, damaged step, blocked exit) in *any* common area or within your office *must* report it directly to the building manager *and* to a designated person within your company (office manager, facilities contact). Document the report. This policy protects visitors *and* your company by demonstrating proactive responsibility and creating a record.
  *   **Ethical Takeaway:** In shared spaces, safety is a collective responsibility. "Not my job" is how preventable accidents happen. Taking 2 minutes to report a hazard isn't just about avoiding liability; it's about basic decency and preventing harm to others.

  Your intuition is correct. While the building manager bears the lion's share of responsibility, the collective inaction of the tenants who knew about the hazard for weeks creates significant legal risk and represents a clear ethical failure. Your boss's perspective is legally optimistic and ethically deficient.
