answer: |-
  Here are eight questions designed to systematically challenge the expectation-based account's ability to handle the compensation case, the social practice objection, and the standing issue, each with a follow-up to preempt the "supplementary principle" dodge. The questions build pressure by forcing the account to either proliferate ad hoc principles, admit circularity, or concede core intuitions are wrong.

  **Core Challenge: Compensation & Ad Hoc Patches**

  1.  **Question:** In the compensation case (promising help moving, sending paid professionals instead), the promisor fully neutralizes reliance costs and fulfills the outcome expectation. Yet, strong intuition persists that the promisor wronged the promisee *specifically* by breaking the promise, not just by how they broke it. Doesn't this suggest the primary wrong of promise-breaking lies in violating the promissory obligation *itself*, distinct from and irreducible to defeating expectations or causing harm? How does your expectation-based account capture this wrong without smuggling in the notion of a promissory bond?
      *   *Likely Response:* "The wrong lies in the *manner* of defeating the expectation – unilaterally, without consent, failing to respect the promisee's authority over the expectation *they* invited."
      *   **Follow-Up:** But if I *did* seek your consent to send movers instead *before* Saturday (and you refused), breaking the promise seems *more* wrong, not less, precisely because I defied your explicit refusal. If the wrong were primarily about the *manner* of defeating expectations (unilateralism), consent should mitigate it. But consent refusal intensifies the sense of violation. Doesn't this imply the core wrong is violating the commitment *per se*, regardless of outcome or manner?
  2.  **Question:** Your account seems to require adding distinct "supplementary principles" to handle cases like compensation (e.g., a principle against unilateral revocation of invited reliance, or respecting the promisee's authority). As we encounter more counterexamples (e.g., promises not to reveal a secret where revelation causes no harm but violates trust, promises to perform symbolic acts with no material reliance), won't we need a new supplementary principle for *each* type of case where expectation-neutralization fails to erase the sense of wronging? Doesn't this proliferation risk making the theory ad hoc and undermine its claim to identify the *fundamental* ground of promissory obligation in expectation/reliance?
      *   *Likely Response:* "Not necessarily. A single, well-defined supplementary principle (like respecting the promisee's normative authority over the invited expectation) can cover many cases."
      *   **Follow-Up:** Let's test that. Suppose I promise *not* to press a specific red button on your desk while you're out – a promise you accept purely for symbolic reasons, with no reliance interests. I press it, but nothing happens; no harm, no altered state. You feel deeply wronged. What supplementary principle, derived solely from expectation/reliance without presupposing promise-keeping, explains why defeating this harmless, non-reliance-based expectation wrongs you specifically as the promisee? Doesn't any plausible principle here just *re-describe* the obligation created by the promise itself?

  **Core Challenge: Social Practice & Circularity (Kolodny/Wallace)**

  3.  **Question:** Your account relies heavily on judging which expectations are "reasonable" for the promisee to form and rely upon. But what *makes* it reasonable for someone to form a firm expectation of future performance just because I said "I promise"? Isn't this reasonableness precisely *dependent* on the existence of a social practice or convention where saying "I promise" creates a strong normative expectation? If so, doesn't appealing to "reasonable expectations" to ground promissory obligation secretly *presuppose* the very practice it's meant to explain?
      *   *Likely Response:* "No. The reasonableness stems from the *deliberate act* of assurance itself – the promisor intentionally invokes a specific, recognized normative structure (assurance) to induce reliance. The reasonableness flows from the sincerity and deliberateness of the speech act, not a prior convention."
      *   **Follow-Up:** But how does the promisee *recognize* "I promise" as performing this specific, reliance-inviting act of assurance without relying on their understanding of the social meaning of promising? If I utter a novel phrase like "I zorble to help you move," could I reasonably expect you to form a firm, reliance-worthy expectation? If not, doesn't the reasonableness of the expectation crucially depend on the shared social understanding of what "I promise" *means*?
  4.  **Question:** Could there be a successful act of promising *outside* of any social practice or convention? Imagine two individuals with no shared language or concepts of promising. Could one meaningfully "promise" to the other and create a promissory obligation grounded solely in expectation/reliance? If not, doesn't this show the social practice is constitutive, not merely evidential, for the obligation?
      *   *Likely Response:* "Perhaps not a *promise* as we know it, but they could perform an act of assurance – a deliberate, clear communication intended to induce reliance on future performance. That act alone can ground the expectation-based obligation."
      *   **Follow-Up:** How does the recipient *distinguish* this "act of assurance" from a mere prediction ("I predict I will help you"), a statement of intent ("I intend to help you"), or a threat ("I will be there to stop you") without some shared framework for interpreting communicative acts? Doesn't the very identification of an utterance as an "assurance" requiring reliance presuppose shared norms about communication and commitment?

  **Core Challenge: Standing & Specific Wronging**

  5.  **Question:** According to your account, the wrong lies in defeating the expectation *you deliberately invited the promisee to form and rely upon*. However, what if a *bystander* overhears my promise to you, forms the *identical* firm expectation that I will help you move, and relies on it (e.g., they plan a party at your old apartment for Saturday afternoon). If I break my promise to you but hire movers (neutralizing *your* reliance), have I also wronged the bystander by defeating *their* expectation? If not, why not? What is the morally relevant difference between the promisee's expectation and the bystander's identical expectation?
      *   *Likely Response:* "The crucial difference is that the expectation was *directly and intentionally invited in the promisee*. The promisor owes an obligation specifically *to the person they addressed the assurance to*. The bystander's reliance is self-invited, not invited by the promisor."
      *   **Follow-Up:** But if the core wrong is defeating an expectation *you deliberately caused someone to form*, didn't I deliberately cause the bystander to form their expectation by uttering the promise loudly enough for them to hear? If the promisor knows bystanders are likely to overhear and rely, does the obligation extend to them too? If not, doesn't the distinction rely on the *directedness* of the promise (to you), which seems like a feature of the promissory bond itself, not reducible to expectation causation?
  6.  **Question:** Only the promisee has the power to release me from my promissory obligation. On your account, why is this? If the obligation is to not defeat the reliance/expectation *you caused*, why can't I simply ensure no reliance is defeated (e.g., by secretly hiring movers without telling you) and be free? Why does the *promisee's* consent to release me matter uniquely, especially if others might also be relying?
      *   *Likely Response:* "Because the promisee is the one to whom the assurance was directed; they hold the normative authority over the expectation *you created specifically for them*. Releasing you is them exercising that authority over the expectation you invited *in them*."
      *   **Follow-Up:** This "normative authority" sounds very much like the promisee having a *right* against the promisor – a right created by the promise. How does the expectation/reliance account *generate* this specific, directed right held only by the promisee? Doesn't invoking "normative authority over the expectation" just restate the *effect* of the promise (creating a right/duty relation) rather than explaining its source in expectation/reliance?

  **Synthesizing the Challenges**

  7.  **Question:** Putting it together: To handle the compensation case, you need a principle like respecting the promisee's authority. To handle the reasonableness of expectations, you arguably rely on a social practice. To explain the promisee's unique standing, you invoke their unique normative authority. Doesn't this constellation of needed "supplements" strongly suggest that the expectation/reliance elements are actually *consequences* or *typical effects* of the promissory act (which creates a distinctive normative bond), rather than being its *foundation*? Isn't the promissory bond explanatorily prior?
      *   *Likely Response:* "No, these elements are integrated facets of the core wrong – the misuse of the power to shape another's normative expectations through assurance. The 'authority' is inherent in the relational nature of the assurance act itself."
      *   **Follow-Up:** But doesn't this "relational nature" and "power to shape normative expectations" *depend* on the existence of a practice where such utterances are understood to create binding commitments? In a world without such a practice, could an individual act of "assurance" truly generate this complex structure of authority, directed obligation, and distinctive wrong distinct from mere disappointed prediction?
  8.  **Question:** Ultimately, if we accept that expectation-neutralization in the compensation case doesn't erase the sense of being wronged *as the promisee*, and if the best explanation for this involves elements like violating a directed obligation or disrespecting the promisee's authority created *by the promise itself*, doesn't this indicate that Scanlon's Principle of Fidelity (P.F.) – as initially framed around defeating expectations – is incomplete? Shouldn't P.F. be explicitly amended to recognize the creation of a specific, irreducible promissory right/duty relation as the core ground, with expectation management being a primary but derivative duty flowing from *that*?
      *   *Likely Response:* "That moves away from the explanatory power of the expectation-based view. We can capture the directedness and authority within the framework of assurance and invited reliance without reifying a mysterious 'bond'."
      *   **Follow-Up:** But if the expectation-based framework requires so many crucial supplements (directedness, unique authority, wrongness despite harm-neutralization) that aren't obviously derivable from the concepts of expectation and reliance alone, and which closely mirror the features of the promissory bond, isn't the simpler, less ad hoc explanation that the promissory act *directly* creates this bond? Why insist expectation/reliance is foundational when it seems constantly in need of rescue by principles that look suspiciously like the phenomenon to be explained?

  **Key Strategies Embodied:**
  *   **Compensation:** Q1 & Q2 press the intuition that neutralization doesn't erase the wrong, forcing a choice between ad hoc principles or acknowledging a deeper bond (Q1 Follow-up uses consent refusal to intensify the challenge). Q7 synthesizes.
  *   **Social Practice:** Q3 & Q4 directly attack the "reasonableness" criterion as circular. Follow-ups press on the necessity of shared meaning.
  *   **Standing:** Q5 & Q6 highlight the uniqueness of the promisee's position and power to release, challenging the account to explain this solely via expectation causation. Follow-ups press on directed rights/authority.
  *   **Ad Hoc Patches:** Q2, Q7, and Q8 explicitly frame the needed supplements as proliferating and potentially unprincipled, contrasting them unfavorably with the simplicity of acknowledging an irreducible bond. Q8 offers a direct challenge to amend the core principle.
  *   **Follow-ups:** Each targets the most predictable "save" for the expectation-based view, forcing the speaker to either defend an increasingly complex/nuanced version or confront the core objections head-on. They prevent a simple restatement of the initial position.
