prompt: |-
  I cover evolutionary biology, and next week I'm profiling a theoretical biologist who has built her career rehabilitating group selection as a genuine causal force behind traits like eusociality and large-scale human cooperation, working in the tradition of multilevel selection theory. In public debate she reliably closes down the standard 'it's just bookkeeping' objection -- the charge that any multilevel-selection model can be losslessly rewritten as an inclusive-fitness (kin-selection) model once you run the numbers through the Price equation -- with the line 'that's a translation, not a refutation.' Please draft eight to ten interview questions that make that line progressively harder to lean on: I want at least one question pressing her on what would distinguish a genuinely selected group from an arbitrary statistical aggregate of individuals, at least one asking what empirical finding could in principle favor a multilevel-selection description over an inclusive-fitness one rather than a mere relabeling of the same variance, and a final question asking whether she would concede that the units-of-selection debate is, at bottom, not an empirical dispute at all but a disagreement over which partition of the same process is most illuminating. For each question, add a short follow-up keyed to the dodge she is most likely to reach for.
reasoning: |-
  Okay, the user is an evolutionary biology journalist preparing to interview a theoretical biologist who champions group selection, particularly in the context of multilevel selection theory (MLS). The biologist famously counters the "it's just bookkeeping" objection—the idea that MLS models can be rewritten as inclusive fitness models using the Price equation—with the retort, "that's a translation, not a refutation." The user wants interview questions that challenge this line by probing deeper into the conceptual foundations of MLS.  

  First, I need to unpack the core tension: MLS vs. inclusive fitness/kin selection. The "bookkeeping" argument claims MLS is merely a different mathematical framing of the same evolutionary process, not a distinct causal mechanism. The biologist's "translation not refutation" response defends MLS as a valid explanatory perspective, but doesn't address whether it offers unique empirical or causal insights.  

  The user's specific requests are clear:  
  1. A question distinguishing selected groups from arbitrary aggregates.  
  2. A question about empirical evidence favoring MLS over mere relabeling.  
  3. A closing question framing the debate as non-empirical (about explanatory utility).  
  Plus, each question needs a follow-up anticipating dodges.  

  For the first request (distinguishing groups), I consider focusing on criteria like spatiotemporal boundedness or emergent properties. The biologist might dodge by saying "it depends on the trait," so the follow-up should press for generalizable criteria.  

  For the empirical evidence question, I think about scenarios where group-level metrics predict fitness better than individual/kin metrics—e.g., traits requiring synchronized cooperation. The dodge would likely involve conflating prediction with causation, so the follow-up must demand testable signatures of group-level causality.  

  The final question about the debate's nature is philosophical. The biologist might retreat to "it's empirical," so the follow-up should ask why identical predictions feel explanatory in MLS but not inclusive fitness.  

  I structure the questions to escalate from conceptual to empirical to meta-theoretical. The follow-ups are designed to block rhetorical exits by homing in on causality, prediction, and explanatory value—the very things the "translation" argument undermines.  

  The tone stays respectful but incisive, quoting the biologist's own phrasing ("translation not refutation") to anchor the challenge. This isn't a gotcha—it's about clarifying whether MLS is a lens or a mechanism.
answer: |-
  Here are 10 interview questions designed to progressively challenge the "translation, not refutation" stance, incorporating your specific requests, with anticipated dodges and targeted follow-ups:

  1.  **Core Concept:** "You argue group selection is a 'genuine causal force'. Could you define operationally what constitutes a 'group' in MLS theory for it to be a unit of selection, distinct from just a convenient statistical bin? Specifically, what properties must a collection of individuals possess beyond shared location for selection to act *on the group as a whole*?"
      *   *Likely Dodge:* "It depends on the trait and the population structure; groups are defined by the relevant interactions."
      *   *Follow-up:* "But doesn't *any* collection have 'interactions'? What specific, measurable properties – like emergent group traits, boundedness, persistence, or group-level heritability – would distinguish a *selected group* from an *arbitrary aggregate* where selection is only acting on individuals?"

  2.  **Causal Efficacy:** "The 'bookkeeping' critique argues the Price equation merely partitions *existing* individual fitness variance. How does MLS theory demonstrate that group structure *causes* novel fitness effects that wouldn't exist, or wouldn't be explainable, solely through individual traits and pairwise interactions (including kin interactions)?"
      *   *Likely Dodge:* "The group context changes the fitness landscape for individuals; cooperation can only evolve in certain group structures."
      *   *Follow-up:* "But isn't that changed landscape still ultimately reflected in *individual* reproductive success? Can you point to a fitness effect that is *irreducibly* a property of the group itself, not derivable from the summed properties and interactions of its constituent individuals?"

  3.  **Empirical Distinction (Prediction):** "What specific, testable empirical signature would uniquely support an MLS explanation *over* an inclusive fitness explanation for a trait like eusociality? In other words, what finding could we *only* predict or explain by invoking group selection as a causal force, rather than seeing it as a different partitioning of the same underlying individual fitnesses?"
      *   *Likely Dodge:* "MLS predicts the conditions where altruism/cooperation evolves, like high within-group relatedness *and* between-group competition."
      *   *Follow-up:* "But inclusive fitness theory *also* predicts cooperation under high relatedness and certain population structures. If both models predict the *same* outcome under the *same* conditions, doesn't that reinforce the 'translation' argument? What uniquely *different* prediction does MLS make?"

  4.  **Empirical Distinction (Process):** "Beyond predicting trait evolution, could you describe an observable *process* in nature – perhaps the mechanism of group formation, extinction, or reproduction – where the causal arrow demonstrably points *from the group level down to individual fitness* in a way that isn't fully captured by tracking inclusive fitness?"
      *   *Likely Dodge:* "Group extinction events directly select against groups with maladaptive traits, altering the frequency of individual alleles."
      *   *Follow-up:* "Isn't the extinction of a group still just the simultaneous death of its constituent individuals? How is the causal force distinct from intense individual selection against a specific trait combination occurring in a localized area? What makes 'group extinction' a *sui generis* evolutionary force?"

  5.  **The Price Equation & Causality:** "Critics like Alan Grafen argue the Price equation is descriptive accounting, not causal explanation. When you partition variance into within-group and between-group components using Price, what guarantees that the 'between-group' component actually represents selection *acting on groups* rather than merely being a statistical description of covariance between individual fitness and group membership?"
      *   *Likely Dodge:* "The partition shows the evolutionary change *due to* group differences. If the between-group component is large, it demonstrates group selection is operating."
      *   *Follow-up:* "But doesn't covariance arise from *many* underlying causes (e.g., shared environment, kin selection)? How does identifying a statistical partition *inherently* reveal a distinct *causal level* of selection, rather than just quantifying a pattern stemming from individual-level causes?"

  6.  **Heritability & Emergence:** "For group selection to be effective, group-level traits must be heritable. How do group traits achieve heritability that isn't reducible to the heritability of individual traits within the group? Can you give an example where the group-level trait is emergent and its heritability demonstrably distinct from the sum of individual genetic contributions?"
      *   *Likely Dodge:* "Group composition, structure, or culture can be transmitted when groups fission or found new groups."
      *   *Follow-up:* "When a group fissions, isn't the 'inheritance' of group properties still fundamentally the result of the dispersal and aggregation of *individuals* with their own traits? How does this process create heritability for a *group-level* property that isn't just an averaging or interaction effect of the inherited individual traits?"

  7.  **Parsimony & Explanatory Power:** "If the same evolutionary change can be *exactly* modeled using either inclusive fitness or MLS frameworks (as the Price equation suggests), doesn't Occam's Razor favor the individual-level (inclusive fitness) description as more fundamental? What unique explanatory power does attributing causality to the group level provide that the individual-level account lacks?"
      *   *Likely Dodge:* "MLS provides a clearer, more intuitive picture of the dynamics, especially for traits like cooperation that inherently involve groups. It focuses on the right level of organization."
      *   *Follow-up:* "So, is the advantage primarily *heuristic* – a matter of conceptual convenience or focus – rather than identifying a fundamentally distinct causal mechanism? If both models are mathematically equivalent descriptions, isn't the choice between them ultimately about perspective, not ontology?"

  8.  **The Translation Threshold:** "Under what specific conditions *would* you concede that a purported case of group selection *is* 'just bookkeeping' – merely a relabeling of inclusive fitness dynamics? What criteria separate a valid MLS process from a case where the group structure is just a backdrop for individual/kin selection?"
      *   *Likely Dodge:* "It's never 'just' bookkeeping; the MLS perspective always offers valuable insights into the structure of selection."
      *   *Follow-up:* "But doesn't this risk making MLS unfalsifiable? If *every* instance of statistical between-group variance is interpreted as evidence for group selection, regardless of the underlying individual mechanisms, how does MLS avoid becoming a tautological description?"

  9.  **Human Cooperation Specifics:** "For large-scale human cooperation (beyond kin groups), MLS proponents often cite cultural group selection. How does cultural group selection definitively escape the 'bookkeeping' charge? Isn't the differential survival of groups with different cultural norms still reducible to the differential fitness of individuals holding those norms within a competitive context?"
      *   *Likely Dodge:* "Cultural norms create group-level properties (like institutions) that enforce cooperation and are transmitted horizontally/vertically, imposing costs on defectors that alter individual fitness."
      *   *Follow-up:* "But aren't those enforcement mechanisms – sanctions, rewards – still acting on *individual* fitness? Doesn't the success of the norm ultimately depend on the aggregated consequences of these individual-level fitness effects? Where is the irreducible group-level causal force?"

  10. **The Nature of the Debate (Meta-Question):** "Given the mathematical equivalence shown by the Price equation, and the difficulty in finding empirical signatures uniquely requiring MLS causality, could it be that the 'units-of-selection' debate regarding group selection is ultimately *not* an empirical dispute about underlying mechanisms, but rather a philosophical or pragmatic disagreement about which *level of description* – individual/inclusive fitness or multilevel – provides the most coherent, useful, or illuminating framework for understanding complex evolutionary phenomena like eusociality and human cooperation?"
      *   *Likely Dodge:* "No, it *is* empirical. The group *is* a real unit subject to selection in many cases; the dynamics are different. MLS captures causal forces that inclusive fitness obscures."
      *   *Follow-Up:* "If the dynamics are different, where does that difference manifest in a way that isn't captured by the mathematical equivalence? If both frameworks can describe the *same* process and predict the *same* outcomes, doesn't that suggest the difference is in the *narrative framing* ('causal force') applied to the partition, rather than in the underlying biological reality?"

  These questions progressively move from defining the unit, through causal claims and empirical tests, to the fundamental nature of the disagreement, consistently challenging the idea that the MLS description provides unique causal insight beyond a specific partitioning of variance. The follow-ups are designed to cut off common retreats to vagueness, heuristics, or restatements of the statistical partition as proof of causality.
