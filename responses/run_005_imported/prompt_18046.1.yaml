  ### Defense for Deductions (If Student Pushes Back)
  *   **On Attribution (3/5):** "While you correctly note Dummett *uses* the veil of ignorance effectively, presenting it as 'Dummett's move' overlooks its broader philosophical origin (Rawls) and common usage in migration ethics (e.g., Carens). More crucially, Dummett explicitly argues *against* open borders positions like Carens's in the book, seeing them as unrealistic and potentially harmful. Your essay omitted this direct critique, which is essential for accurate attribution of his overall stance."
  *   **On Open Borders Conclusion (3/5):** "Your argument that Dummett's position 'functions as a defense of open borders' directly contradicts his text. Dummett explicitly rejects open borders, arguing instead for *significantly expanded* but *not unlimited* immigration. He justifies *some* exclusion based on practical feasibility (preventing societal collapse) and preventing specific harms (like severe brain drain). While he powerfully challenges the *default unlimited right*, he *does* propose principled constraints (feasibility, harm prevention) – just radically different ones than current policy. Your conclusion overlooks these key aspects of his positive proposal."
