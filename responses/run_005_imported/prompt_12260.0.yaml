answer: |-
  You and your friend have hit upon a profound philosophical tension – one that pits practical, evidence-based reasoning against radical uncertainty about consequences. Both perspectives have merit, but your friend's argument contains a critical flaw that paralyzes ethical decision-making. Here's the breakdown:

  ### Strengths of Your Reasoning
  1. **Evidence-Based Foundation**: You're focusing on *known, high-impact factors* (housing/jobs reducing recidivism) backed by criminology research. The National Reentry Resource Center confirms stable housing reduces recidivism by up to 15-20%.
  2. **Proximate Responsibility**: You're addressing immediate, catastrophic risks (homelessness leading to reoffense) rather than abstract possibilities.
  3. **Actionable Compassion**: Your offer provides concrete support within your sphere of influence – what ethicists call "bounded rationality."

  ### The Flaw in Your Friend's Argument
  While philosophically intriguing, her position suffers from three critical problems:
  1. **The Paralysis Paradox**: If we must account for all possible ripple effects, *no decision is justifiable*. Not helping your cousin also creates infinite unknowable consequences (e.g., if he reoffends, victims' lives alter forever). Inaction isn't neutral.
  2. **Selective Skepticism**: She applies uncertainty only to *your intervention*, ignoring that the status quo (denying help) has equally unfathomable ripple effects. This creates a double standard.
  3. **Negligible Probability**: While theoretically possible, most "ripple effects" (e.g., job going to someone else) are statistically marginal. Construction jobs have turnover; housing markets adjust. Philosopher Derek Parfit's "mere addition paradox" shows we can't reasonably reject actions because they add *potential* lives.

  ### A Balanced Approach
  1. **Tiered Consequences**: Prioritize impacts by:
     - **Certainty**: Near-certain outcomes (reduced recidivism) > plausible risks > speculative chains
     - **Magnitude**: Preventing prison return > minor job market effects
     - **Proximity**: Direct effects on cousin > distant effects
  2. **Agency Matters**: Your cousin retains free will. Outcomes depend on his choices, not solely your initial help.
  3. **Virtue Ethics Lens**: Acting with compassion toward family has intrinsic value, regardless of outcomes. As philosopher Bernard Williams noted, we have "ground projects" (like helping family) that give life meaning.
  4. **Mitigate Risks, Don't Freeze**:
     - Set clear boundaries (duration of stay, house rules)
     - Introduce your contact to multiple employers to spread opportunity
     - Monitor for warning signs (drug use, negative influences)

  ### Why Your Instinct is Correct
  Research consistently shows that **social capital** (family support + employment) is the strongest predictor of successful reentry. A University of Pennsylvania study found that ex-inmates with family housing and jobs were 60% less likely to reoffend within a year. Your intervention targets precisely these factors.

  Your friend's argument, while intellectually stimulating, commits what economist Frank Knight called "confusing uncertainty with risk." We manage *measurable risks* (e.g., cousin relapsing), not infinite theoretical possibilities. To demand omniscience before acting is to abandon ethical responsibility in the real world where help is urgently needed. Your choice isn't arbitrary – it's a targeted strike against a well-documented social problem, using resources you actually possess. That’s not just reasonable; it’s profoundly human.
