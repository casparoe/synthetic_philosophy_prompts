prompt: |-
  So for my ethics elective we just read Nagel's Moral Luck essay and I get the four types he talks about (resultant, circumstantial, constitutive, causal) in theory, but our teacher's examples kept blurring circumstantial and constitutive together for me — they both just kind of sound like 'stuff about you that you didnt choose.' Can you invent one specific scenario (not the classic Nazi Germany or drunk driver ones, we've already done those to death) where the circumstantial-luck verdict and the constitutive-luck verdict about someone's blameworthyness would actually pull apart? Like point out exactly which part of your scenario is doing the circumstantial work and which part is doing the constitutive work, bc thats the seperation i still dont really get.
