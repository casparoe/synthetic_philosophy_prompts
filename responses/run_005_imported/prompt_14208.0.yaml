  First, I need to recall Aquinas's key points. He distinguishes between usurpers and legitimate rulers turned tyrants. For the latter, he insists on removal through the original authority that installed them, not private individuals. If no such mechanism exists, he advises patience and prayer. His main concerns are preventing chaos and misuse of "tyrant" as an excuse for power grabs.

  The user is asking how Aquinas would view actions by powerful nations like the US intervening in other countries. They mention drone strikes, special forces, and supporting coups. The core question is whether these actions qualify as "public authority" in Aquinas's framework or if they're just private violence disguised as state action. Also, whether Aquinas's worry about post-removal chaos applies to cases like Gaddafi or Saddam.

  Breaking this down: Aquinas's public authority is tied to the community under the tyrant's rule. So, external states don't have inherent authority over another sovereign nation. Even if the intervening state has its own legal processes, that doesn't extend to other polities. Aquinas would likely see this as foreign intervention, not legitimate public authority. 

  The user's deeper interest seems to be in the ethical implications of modern interventions using Aquinas's principles. They might be looking for a framework to critique contemporary foreign policy. The chaos after Gaddafi and Saddam aligns with Aquinas's warnings, so that connection should be highlighted.

