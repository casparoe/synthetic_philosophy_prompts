prompt: |-
  I write about science and ideas for a living, and next week I'm interviewing a decision theorist who's a committed defender of functional decision theory -- the view that in Parfit's hitchhiker you really should pay the driver once you're safe in town, because the agent whose rationality actually matters isn't "you, right now," but the decision function that got you predicted as trustworthy in the first place. Can you draft me 8-10 interview questions that don't just let him re-explain the setup? I want at least one question on what happens once the driver's an imperfect predictor (say, right 9 times out of 10) and whether "pay up" still holds, one that makes him spell out what it even means to say your choice "controls" a prediction the driver already made before you opened your mouth, and one that forces a comparison to Kavka's toxin puzzle -- if committing to pay is rational, why isn't committing to drink a toxin you'll have zero reason to actually drink later also rational? End with a question about what would actually count as evidence hes wrong. For each question throw in a quick follow-up keyed to whatever dodge he's most likely to reach for first.
reasoning: |-
  Okay, the user is a science writer preparing to interview a decision theorist who advocates for Functional Decision Theory (FDT). They need 8-10 interview questions that avoid rehashing basics and dive into nuanced critiques. Key requests include: imperfect predictors, the meaning of "controlling" past predictions, comparison to Kavka's toxin puzzle, and evidence against FDT.

  First, I need to unpack the core challenge: FDT claims rationality requires paying in Parfit's Hitchhiker because you're upholding the decision function that made you predictable. The user wants to pressure-test this. 

  For the imperfect predictor angle (9/10 accuracy), I'll frame it as a sliding scale problem—how much uncertainty collapses FDT's position? The theorist might dodge by saying "it's about principle, not probability," so the follow-up should demand a clear threshold.

  The "control" question is trickier. FDT treats decisions as instantiating timeless functions, but how does that metaphysically bind past predictors? They'll likely retreat to "acausal influence," so the follow-up should challenge if this is just math or has real-world traction.

  Kavka's toxin is the perfect contrast: both involve committing to irrational future acts. If FDT endorses paying the driver, why not drinking the toxin? The theorist will distinguish based on "function instantiation" vs "state-based rationality," so the follow-up must expose if that's consistent.

  Ending with falsifiability is smart—what would make an FDT defender concede? They might list edge cases without empirical tests, so the follow-up should push for observable predictions.

  I'll structure questions to build pressure: start with conceptual foundations (Q1-2), escalate to paradoxes (Q3-5), then empirical flaws (Q6-8). Each follow-up preempts evasive maneuvers. For Kavka, I'll explicitly link the "commitment mechanism" gap—FDT works in prediction scenarios but lacks levers elsewhere.

  User's profession suggests they need quotable, provocative exchanges. I'll avoid jargon where possible and flag where the theorist might obfuscate. The toxin comparison especially could reveal FDT's limits if the interviewee can't explain why precommitment devices matter only sometimes.

  Finally, the evidence question should force specificity: if FDT can't be tested, is it philosophy or science? That's a strong closer.
answer: |-
  Here are 10 interview questions designed to push beyond FDT basics, target your specific requests, and anticipate common dodges with sharp follow-ups:

  1.  **The Core Metaphysical Claim:** FDT posits that the rational agent is the *decision function* instantiated across time, not the momentary self. What does it mean for my *current choice* to "control" the driver's *past prediction*? Isn't this conflating logical consistency within a model with actual causal influence over past events?
      *   *Likely Dodge:* Appeal to "acausal influence" or "logical counterfactuals."
      *   *Follow-Up:* If this "control" is purely logical/acausal and doesn't involve backward causation or retroactive change, isn't saying I "control" the prediction just a metaphor for *being consistent with the function that was predicted*? How is that different from saying "I was predicted to pay, so I pay"?

  2.  **Imperfect Predictor (9/10 Accuracy):** In Parfit's Hitchhiker with an imperfect predictor (say 90% accurate), FDT still recommends paying *if* you were predicted to pay. But doesn't the predictor's fallibility introduce a crucial difference? *Before* the trip, the rational FDT agent adopts the "always pay" function. *After* arriving safely, knowing the predictor is fallible, might there be a non-zero chance I was *mistakenly* predicted to pay (a "false positive")? If so, why isn't it rational *now* to exploit that potential error by not paying?
      *   *Likely Dodge:* Argue that conditional on *having been predicted to pay*, paying is still the action that upholds the valuable function, regardless of predictor accuracy in general.
      *   *Follow-Up:* Doesn't the *possibility* that this specific instance was a prediction error (even if unlikely) break the strict logical link FDT relies on? How does FDT quantitatively weigh the tiny probability of being a false positive against the definite gain of keeping the money, especially as predictor accuracy decreases (e.g., 70% right)?

  3.  **The "Commitment" Mechanism:** FDT says paying is rational because it upholds the function that gets you predicted favorably. What is the actual *mechanism* by which my action *here and now* upholds or damages this abstract "function"? If the function is timeless, how is my current action anything more than an *instance* of it, rather than an act of upholding it?
      *   *Likely Dodge:* Frame it as maintaining consistency or "being the same agent" across time.
      *   *Follow-Up:* Isn't this circular? I "am" the function, so acting according to it *is* consistency. But how does this *explain* why consistency is rational in this payoff structure, beyond just defining it as such? What tangible benefit does "being consistent with the abstract function" provide *in this specific moment* that outweighs keeping the money, besides future predictive advantages that are *already locked in* by the past prediction?

  4.  **Kavka's Toxin Puzzle - The Core Challenge:** Kavka's toxin puzzle seems structurally similar: I get a reward *now* for sincerely intending to drink a harmless toxin *later*, but when "later" comes, I have no reason to drink it. If FDT says paying the hitchhiker is rational (upholding the "commitment" function), why isn't it also rational for the FDT agent to *actually drink the toxin*? Doesn't failing to drink similarly damage the "commitment function" that secured the reward?
      *   *Likely Dodge:* Argue the prediction mechanisms differ. The hitchhiker scenario involves an *external predictor* who reacts to your function *before* you act. The toxin puzzle involves forming an *intention now* for a *future action* where no external predictor is checking *after* the reward is given. The *timing of the prediction/reward* relative to the costly action is key.
      *   *Follow-Up:* Okay, the *mechanism* differs. But the *logical structure for the agent at the final decision point* seems identical: "I have the reward/benefit already secured based on my past commitment/function. Performing the costly action now provides me personally with no further benefit and only a cost. FDT says pay the driver *despite* this. Why not drink the toxin *despite* this?" What *specific* element in the FDT framework breaks the symmetry?

  5.  **Kavka's Toxin Puzzle - Function vs. State:** Could FDT resolve the toxin puzzle by arguing the *agent's state changes*? After getting the reward, the agent is no longer in the state of "needing to prove commitment for a future reward," so the "commitment function" simply doesn't apply to the post-reward state. How does FDT formally define the boundaries of when a specific "decision function" applies versus when the agent transitions to a new state governed by a different function (e.g., "minimize immediate discomfort")?
      *   *Likely Dodge:* Suggest the function is defined over the whole problem, including the temporal structure.
      *   *Follow-Up:* Doesn't this risk making FDT *descriptively* empty? If the function can be arbitrarily redefined based on the agent's current state and incentives ("Oh, *now* my function is 'don't drink toxins'"), how does it provide unique, prescriptive guidance different from sophisticated forms of state-based CDT (Causal Decision Theory)?

  6.  **The Cost of Robustness:** FDT agents perform well in specific prediction-based scenarios like Parfit's Hitchhiker or Newcomb's Problem. However, in many real-world decisions (e.g., investing, medical choices, mundane daily tasks), predictors are absent or unreliable, and causal chains dominate. Doesn't adhering strictly to FDT in these "non-prediction-game" scenarios potentially lead to *worse* outcomes compared to CDT, making FDT less robust as a *general* theory of rationality?
      *   *Likely Dodge:* Argue that FDT subsumes CDT in purely causal scenarios or that the ideal theory should handle both types well.
      *   *Follow-Up:* But practically, doesn't the cognitive overhead of identifying whether a situation is a "prediction game" or not, and the risk of misapplying FDT's counterintuitive prescriptions (like paying when you could keep the money with no *causal* consequence) in non-prediction contexts, constitute a significant cost? Is FDT primarily a theory for niche "philosopher's problems"?

  7.  **Multiple Selves & Self-Deception:** FDT treats the agent as a single, timeless function. How does it handle well-documented human phenomena like hyperbolic discounting, akrasia (weakness of will), or genuine internal conflict between "multiple selves" with different time horizons or values? Isn't prescribing rigid consistency with an abstract function potentially at odds with how human psychology actually operates across time?
      *   *Likely Dodge:* Frame FDT as normative (how we *should* reason), not descriptive (how we *do* reason).
      *   *Follow-Up:* Even normatively, if humans are inherently temporally fragmented beings, is prescribing behavior based on a unified timeless function *realistic* or *desirable* as a goal? Could striving for FDT-style consistency lead to harmful self-denial or self-deception (e.g., forcing oneself to pay the driver while bitterly regretting it)?

  8.  **Evidence Against FDT - Empirical:** What specific, real-world (or robustly simulated) evidence *could* potentially falsify or significantly undermine FDT's core claims? Are there experiments or observations that, if they turned out a certain way, would make you seriously reconsider your commitment to FDT?
      *   *Likely Dodge:* Suggest thought experiments failing or point to lack of adoption (weak evidence), or argue FDT is logically true.
      *   *Follow-Up:* Beyond thought experiments, what *empirical* phenomena would challenge FDT? For instance, if neuroscientists reliably identified brain states corresponding to "decision function instantiation" and showed these states *didn't* correlate with FDT-prescribed behavior in prediction games, would that matter? Or if large-scale economic/game theory experiments consistently showed humans achieving better outcomes using strategies demonstrably closer to CDT than FDT in relevant scenarios?

  **Key themes woven throughout:** Metaphysics of agency/control, handling uncertainty/imperfection, comparison to similar puzzles (highlighting differences), practical robustness, psychological realism, and falsifiability. These questions force the theorist to defend FDT at its edges and clarify its scope and foundations. Good luck with the interview!
