  The ethical tension here is palpable. On one hand, there's a treatment for otherwise healthy people with high QALY gains using standard population-derived valuations. On the other, a treatment for severely disabled people whose lives are undervalued by those same metrics despite self-reported well-being being higher. The user's personal stake (their sister's denied treatment) clearly informs their concern about systemic bias against disabled patients.

  Hmm... the committee seems split between two philosophical positions: utilitarians who see QALYs as the only practical common currency, and disability advocates who view this as double penalization. The memo must acknowledge both while making a defensible recommendation. 

  What makes this thorny is that both arguments have merit. Population-derived weights do enable cross-condition comparison, which is essential for resource allocation. But the disability community's critique - that such weights don't reflect lived experience and perpetuate disadvantage - is empirically supported by well-being paradox research. 

  The user's phrasing suggests they lean toward the disability-inclusive position ("penalizes a second time"). Yet as committee member, they need impartiality. The memo should therefore center procedural fairness: not rejecting QALYs entirely, but demanding explicit justification when overruling them for equity reasons. 

  Key structural considerations:
  - Must validate both perspectives to maintain committee cohesion
  - Recommendation should uphold QALY as default while creating space for exceptions
  - Need concrete methodological guardrails to prevent arbitrary decisions
  - Must preempt the obvious counterargument: that this undermines consistency

  The strongest objection will be about slippery slopes and loss of measurable efficiency. The rebuttal should emphasize that this isn't abandoning cost-effectiveness, but calibrating it with equity - and only through transparent deliberation. 

  Personal note: The user's composure here is remarkable given their sister's situation. The memo should honor that by being rigorously fair-minded, avoiding any appearance of special pleading while still addressing the systemic concern they've raised.
answer: |-
  ## Technology Appraisal Committee Decision Memo: Funding Allocation Framework for Competing Proposals  

  **Subject:** Recommended Framework for Weighing Proposal A (Life Extension for Healthy Population) vs. Proposal B (Treatment for Severe Disability Group)  

  **Recommendation:**  
  The Committee recommends adopting a **modified QALY-based approach** that retains population-derived health-state valuations as the primary metric for cost-effectiveness but mandates explicit consideration of equity-based adjustments for proposals involving groups with severe disabilities. Proposal B (severe disability treatment) should be evaluated using an **equity-weighted QALY** framework. If Proposal B demonstrates clinical effectiveness but fails the standard cost-per-QALY threshold due solely to disability-based devaluation, the Committee may apply an equity adjustment factor (subject to a predefined ceiling) to ensure funding decisions do not perpetuate systemic disadvantage.  

  ### Justification for Modified Approach  
  1. **Retaining QALYs as Common Currency**: Population-derived health-state valuations provide a consistent, evidence-based benchmark for comparing heterogeneous health interventions. Abandoning this framework risks arbitrary or inconsistent decision-making.  
  2. **Addressing the Double Penalization Concern**: Standard QALY weights often misrepresent the lived experience of disabled individuals. Evidence confirms that self-reported well-being in severe disabilities is frequently higher than population-derived valuations suggest. Using these weights uncritically compounds disadvantage by:  
     - Devaluing life-years gained solely due to disability status.  
     - Systematically deprioritizing treatments for communities already marginalized by healthcare access barriers.  
  3. **Procedural Fairness**: When the same metric used to deny care to disabled individuals (as in the patient representative’s sister’s case) is applied without scrutiny, it undermines the Committee’s social legitimacy.  

  ### Implementation Protocol  
  - **Step 1**: Calculate cost-per-QALY for both proposals using standard population-derived weights.  
  - **Step 2**: For Proposal B, if cost-per-QALY exceeds threshold *and* lower valuation is primarily driven by disability-based assumptions:  
    - Commission patient-reported outcome measures (PROMs) to quantify well-being gaps between population valuations and actual lived experience.  
    - Apply an **equity multiplier** (e.g., 1.1–1.3x) to QALY gains for Proposal B, reflecting the ethical imperative to rectify systematic undervaluation.  
  - **Step 3**: Compare adjusted cost-per-QALY for Proposal B against Proposal A.  
  - **Step 4**: Fund Proposal B if adjusted cost-per-QALY falls within threshold *or* if the equity-adjusted incremental cost-effectiveness ratio (ICER) justifies funding over Proposal A.  

  ---

  ### Engagement with Strongest Objection  
  **Objection:** *"This adjustment compromises consistency and objectivity. Arbitrary equity factors could distort resource allocation, favoring emotional appeals over measurable health gains. We risk inefficiently diverting funds from interventions offering greater population benefit."*  

  **Response:**  
  This objection rightly emphasizes the need for predictability and fidelity to evidence. We address it as follows:  
  1. **Guarded Flexibility**: Equity adjustments are not discretionary. They are triggered only when:  
     - A treatment targets conditions with documented discrepancies between population valuations and patient-reported well-being.  
     - The standard QALY model would deny care *specifically* due to disability-related devaluation.  
  2. **Capped Adjustment**: The multiplier ceiling (e.g., 1.3x) prevents excessive divergence from core cost-effectiveness principles.  
  3. **Accountability**: All adjustments require documented justification referencing PROMs data and committee consensus.  
  4. **Efficiency Preservation**: Proposal A’s higher aggregate QALY gain remains decisive *unless* Proposal B’s equity adjustment brings it within a clinically meaningful range (e.g., <£50k/QALY). We do not advocate funding Proposal B if its adjusted cost-per-QALY remains excessively high.  

  **Countervailing Risk:** Retaining rigid QALY application risks institutionalizing discrimination under the guise of objectivity. If the same metric that denies care to disabled individuals also consistently disadvantages them in funding comparisons, the system fails the test of distributive justice.  

  ---

  **Final Endorsement:**  
  This framework ensures QALYs remain the foundational tool while acknowledging their limitations in valuing disabled lives. By formalizing an evidence-based adjustment process—grounded in patient-reported well-being data and bounded by strict criteria—we honor both efficiency and equity. The Committee must transparently document all equity adjustments to maintain accountability and public trust.  

  *Approved by consensus of the Technology Appraisal Committee.*  
  *Date: [Insert Date of Decision]*  

  ---  
  **Key Implementation Note**: This memo establishes a *process*, not a predetermined outcome. Proposal B must still demonstrate clinical efficacy and value. The adjustment merely ensures disability status alone does not dictate its rejection.
