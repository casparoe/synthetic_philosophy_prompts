hing speed has to go to infinity, which just can't happen -- so the lamp's impossible for a much more mundane, physical reason no matter who's right about the contradiction. They dropped it there and made me referee, which I honestly can't do -- its been bugging me since. Can you go through it move by move and say who's got the better of each specific point (not just an overall winner), flag anything both of them are missing, and then tell me straight: does the puzzle actually prove what Dana originally claimed it proves?
