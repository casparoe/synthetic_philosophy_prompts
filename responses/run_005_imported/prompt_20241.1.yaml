  I need to structure it: Start with a warm welcome, explain Keynes briefly for the family, highlight the deeper concern, tie it to her life, and end with a toast. Keep it respectful, insightful, and uplifting. Avoid jargon but don't oversimplify for the economists. Make sure it flows naturally and sounds sincere.
answer: |-
  Here’s a toast that tackles Keynes's deeper concern head-on, honors your grandma's legacy, and resonates with both audiences – all while staying warm and celebratory. Aim for about 4 minutes spoken clearly and with feeling.

  **(Clink glass gently, smile warmly at Grandma)**

  "Everyone... thank you all for being here to celebrate someone truly extraordinary: my grandma, [Grandma's Name]. After **34 years** of teaching AP Econ – of shaping minds, deciphering supply curves, and probably explaining the multiplier effect more times than anyone in human history – she’s finally, officially, hanging up her... well, probably her favorite annotated copy of Keynes. **(Light chuckle)**

  "Speaking of Keynes... Grandma, you know *everyone* in this room – family and econ buffs alike – is going to be expecting me to talk about *that* essay. The one you’ve dissected, debated, and probably dreamed about for decades. 'Economic Possibilities for our Grandchildren.' The one where, looking exactly one hundred years ahead from 1930, he imagined us, *right now*, living in such abundance that we’d only need to work... what was it? Fifteen hours a week? **(Nod knowingly to the econ folks, glance around)**

  "And Grandma, you’re retiring *this year*. 2030. The year his hundred-year clock runs out. You think that’s the funniest cosmic punchline ever, and honestly, it is pretty brilliant timing! **(Smile directly at her)** You also made me promise something. You said, 'Don’t just do the easy bit. Don’t just stand up there and say ‘LOL, Keynes was wrong about the hours!’ and get a cheap laugh.' Because, as you taught anyone who’d listen, that’s where *most* people stop. They see the prediction about *less work*, shrug, and move on.

  "But Grandma, you always dug deeper. You made generations of students dig deeper. You pointed us to the part *after* the prediction. The part where Keynes, the ultimate pragmatic economist, suddenly gets... philosophical. Almost anxious. He looked at this future of leisure he’d imagined and asked a profound, unsettling question: **What will people *do*?** More specifically, he worried about people like *you*, Grandma. People who have spent their entire lives being profoundly *useful* – teaching, building, contributing, solving problems, making a tangible difference every single day. He worried: Will they know *how* to just... *live*? Will they be able to handle ‘the permanent problem of the human race’ – how to use freedom and leisure ‘to live wisely and agreeably and well’?"

  **(Pause, soften tone, look directly at Grandma)**

  "That, Grandma, is the part you actually wanted dealt with tonight. Not the hours on the clock he got wrong, but the question about the human heart he got *so* right. Because that transition – from decades of defined purpose, of shaping young minds, of being essential to the daily rhythm of a classroom and a community... to this wide-open space called retirement? That’s not just a career change. That’s a fundamental shift in identity. And if anyone in this room thinks that isn’t a *real* thing, they haven’t been paying attention to the brilliant, driven woman we’re honoring tonight. **(Nod to family, acknowledging they see this too)**

  "Keynes worried if a life spent being useful could prepare someone for simply *being*. Well, Grandma, look around this room. Look at your incredible family – the love, the chaos, the history you’ve built. Look at your colleagues and former students – the countless lives you’ve ignited, the careers you’ve launched, the sheer intellectual curiosity you’ve fostered. **(Gesture around the room)**

  "You haven’t just *taught* economics; you’ve *lived* a life rich in connection, curiosity, and deep, meaningful contribution. You haven’t just been *useful*; you’ve built a legacy woven into the fabric of hundreds of people. That isn’t just preparation for ‘living wisely and agreeably and well’ – **that *is* living wisely and agreeably and well.**

  "Keynes saw leisure as a problem to solve. But Grandma, you’ve spent 34 years showing us that *how* you live – with passion, with intellect, with humor, and with an unwavering commitment to making others better – *is* the solution. You haven’t just earned this next chapter; you’ve been unconsciously preparing for it your whole life. This freedom isn’t an empty space; it’s a canvas you’ve spent decades gathering the most vibrant colors for.

  "So, as you step into Keynes’s ‘hundred years hence,’ Grandma, we’re not worried. We’re excited. Excited to see how you paint on this new canvas. Will it be more time with Grandpa? Deep dives into books *not* about marginal utility? Travel to places that don’t involve economics conferences? Spoiling great-grandkids rotten? Or maybe just sitting on the porch, finally free to contemplate the sheer, delightful absurdity of it all? **(Wink at her)**

  "Whatever it is, it won’t be about filling hours. It will be about continuing the masterpiece of a life exceptionally well-lived. You haven’t lost your purpose; you’ve fulfilled one magnificently, and now you get to discover the next expression of your wonderful self.

  "So, let’s raise our glasses. To [Grandma's Name]! Thank you for 34 years of dedication, inspiration, and proving Keynes only half-wrong – because while he underestimated the hours, he *never* could have imagined the sheer brilliance of how you’d spend them. May your retirement be as rich, fulfilling, and beautifully lived as the extraordinary career that led you here. Cheers!"

  **(Hold glass high, sustained applause)**
