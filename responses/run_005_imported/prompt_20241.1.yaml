  Okay, the user needs a retirement toast for their grandma, a retired AP Econ teacher. She's obsessed with Keynes's essay predicting that by now, people would only need to work 15 hours a week. She finds it funny that she's retiring exactly when his prediction ends, but she doesn't want the toast to just joke about how wrong he was about the hours. Instead, she wants to focus on Keynes's deeper concern: whether someone who's been useful their whole life can learn to just live after retirement. This is actually worrying her now.

