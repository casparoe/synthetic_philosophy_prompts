  Let me unpack both angles. On surface level, Yudkowsky is indeed shifting focus from truth-conditions to utility. Where epistemicism insists there's a hidden fact about "planet", thingspace says all facts are similarity relations in disguise. But deeper down, the user's sharp about the relocated vagueness: "similar enough" inherits all the original paradox's problems. If we replace "how many grains make a heap?" with "how similar to paradigm planets must Pluto be?", we've just moved the bump under the rug.

