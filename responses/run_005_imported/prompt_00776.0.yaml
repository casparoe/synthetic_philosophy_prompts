prompt: |-
  So my friend Jae and I got into this multi-hour argument last night about the new congestion pricing plan for our city, and around midnight it somehow turned into a meta-argument about whether the argument itself was even rational to keep having. Jae's deep into the rationalist blog stuff and pulled out Aumann's agreement theorem on me, saying that since we both basically respect each other as smart, honest reasoners, the fact that we STILL disagreed after hours of going back and forth is basically proof that one of us (he obviously meant me) has some kind of bias or error somewhere. His exact claim was that two Bayesians who trust each others rationality literally can't agree to disagree, so persistent disagreement is kind of self-refuting once you know the theorem.

  I didnt have a good comeback besides "that feels wrong" but it's been bugging me since. He kept referencing something called the "common prior assumption" like it was a minor technical footnote, but when I looked into it a bit it seems like it might be doing basically all the work in the actual proof? Could you break down what that assumption really requires, why the theorem needs it, and whether two people arguing about local politics from pretty different backgrounds would even come close to satisfying it? Basically I want to know if Jae's right that our disagreement proves someone's irrational, or if he's overselling what the theorem actually shows about arguments like ours.
