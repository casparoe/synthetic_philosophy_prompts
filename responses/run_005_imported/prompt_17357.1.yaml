  ## Memo: Recommendation for Philosophy of Mind Tenure-Track Ranking

  **To:** Philosophy Department Search Committee & Faculty  
  **From:** [Your Name], Search Committee Member  
  **Subject:** Ranking Recommendation for Finalists - Philosophy of Mind Search  
  **Date:** [Date Before Monday's Vote]

  This memo addresses the critical question before us: how to rank our two exceptional finalists for the Philosophy of Mind tenure-track position, particularly in light of the significant controversy surrounding Integrated Information Theory (IIT) and the 2023 open letter branding it "pseudoscience." Both candidates possess strong qualifications, making this a challenging decision. However, after careful consideration of the candidates' merits, the nature of the pseudoscience charge, and our role as a philosophy department, **I recommend ranking the candidate working on IIT as our first choice.**

  ### Addressing the "Pseudoscience" Charge Seriously

  The open letter and the surrounding media coverage demand serious attention. Dismissing concerns from a large segment of the field would be irresponsible. However, accepting the label "pseudoscience" as a sufficient reason *by itself* to deprioritize a candidate whose work engages deeply and rigorously with IIT would be a profound abdication of our core disciplinary responsibility: **to evaluate arguments, evidence, and conceptual coherence on their merits.** The "pseudoscience" label is a conclusion, not an argument. We must ask: *What would have to be true of this candidate's work for the pseudoscience charge to constitute a valid reason to rank her lower?*

  For the pseudoscience charge to be a decisive negative factor regarding *this candidate's hireability*, the following would need to be demonstrably true:

  1.  **Her Work Embraces or Exemplifies Core Features of Pseudoscience:** Her research would need to exhibit hallmarks like:
      *   **Immunity to Falsification/Refusal to Engage Criticism:** Does she ignore fundamental criticisms, dismiss counter-evidence, or construct ad-hoc defenses that make her core claims untestable? Her job talk *directly engaged* a major criticism (the Unfolding Argument), suggesting the opposite.
      *   **Misuse of Mathematics/Jargon as Obfuscation:** Does she deploy mathematical formalism in a way that is fundamentally incoherent, inconsistent, or used primarily to create an illusion of scientific rigor without genuine explanatory power? Her work, based on her talk, appears to take the formalism seriously and argues for its conceptual grounding in phenomenological axioms.
      *   **Lack of Empirical Engagement or Misrepresentation of Data:** Does she disregard relevant empirical findings or misrepresent data to fit the theory? While primarily theoretical, her defense focused on the *causal-structure* account and its alignment with core phenomenological features, a philosophical argument. Her engagement with the adversarial-collaboration context shows awareness of empirical stakes.
      *   **Dogmatic Adherence Despite Overwhelming Counter-Evidence:** Does she persist in defending core IIT tenets *in the face of evidence or arguments that decisively refute them*, exhibiting ideological commitment over rational revision? The adversarial-collaboration results you mention were seen by *some* as *partly* vindicating, highlighting that the empirical picture is contested and evolving, not decisively settled *against* IIT.

  2.  **The Charge Reflects a Fundamental Lack of Scholarly Rigor in Her Approach:** The criticism would need to stem not just from disagreement with IIT's conclusions, but from identifiable flaws in her *philosophical methodology* – e.g., consistently poor argumentation, failure to consider relevant literature, conceptual confusion, or inability to separate advocacy from critical analysis. Her job talk demonstrated sophisticated argumentation, engagement with major criticisms, and a clear articulation of her position's virtues.

  3.  **Her Work is *Solely* Dependent on IIT's Ultimate Viability:** If her contributions are *entirely* contingent on IIT being *the* correct theory, and offer no lasting philosophical insights into consciousness, causality, emergence, or methodology regardless of IIT's fate, then the field's verdict *could* render her work obsolete. However, her defense focused on IIT's *causal-structure* approach to consciousness and the *methodological virtue* of axiomatic derivation – both potentially valuable contributions even if IIT's specific formalism is superseded. Her work engages foundational philosophical questions *through* IIT, not merely *for* IIT.

  ### Evaluation of the Candidate's Work Against These Criteria

  Based on her job talk, dossier, and interview:
  *   **She actively engages criticism** (e.g., the Unfolding Argument), demonstrating a commitment to rigorous philosophical debate, not dogma.
  *   **She offers reasoned arguments** for the validity of IIT's axiomatic approach as a *philosophical virtue*, framing it as a strength in conceptual clarity and foundational grounding. This is a substantive philosophical position worthy of consideration, not pseudoscientific evasion.
  *   **Her focus on causal structure** addresses a core and enduring philosophical problem in consciousness studies.
  *   **Her work demonstrates significant philosophical skill:** clear argumentation, conceptual precision, engagement with complex interdisciplinary material, and originality in defending a controversial position.
  *   While committed to IIT, her work tackles **perennial philosophical problems** (the nature of subjective experience, causality, reductionism/emergence) using IIT as a framework. This suggests potential for lasting contributions beyond the specific theory's fate.

  ### The Second Finalist

  The philosopher of neuroscience is undoubtedly a strong candidate. Their broader, less theory-committed approach offers valuable perspectives and represents a safer choice in terms of current field alignment. Their work is rigorous and contributes significantly to understanding neuroscientific approaches to consciousness. They would be an excellent colleague.

  ### Why Rank the IIT Candidate First?

  1.  **Exceptional Philosophical Strength:** Her job talk and materials revealed a thinker of remarkable clarity, rigor, and originality in tackling one of philosophy's hardest problems. She directly confronted major criticisms, demonstrating intellectual courage and dialectical skill.
  2.  **Engagement with Cutting-Edge Controversy:** Her work places her at the heart of the most significant contemporary debate in consciousness studies. Hiring her signals our department's commitment to engaging substantively with forefront research, even when contentious.
  3.  **Unique Contribution & Intellectual Profile:** She offers a distinctive, theoretically ambitious perspective that would significantly diversify and strengthen our department's offerings in philosophy of mind and cognitive science. The second candidate, while excellent, represents a more common (though valuable) profile.
  4.  **Addressing the Pseudoscience Charge:** As argued above, her work does not exhibit the hallmarks of pseudoscience. It demonstrates robust philosophical methodology. The open letter, while significant, represents one viewpoint in an ongoing, heated scientific *and philosophical* debate. Its timing (ahead of contested results) and the subsequent qualified vindication suggest it was as much a strategic intervention as a pure scientific verdict. **Deferring to this letter as an authoritative "field verdict" would be to outsource our core philosophical duty of independent critical judgment.** We are precisely the kind of department equipped to evaluate the *philosophical* merits of her work.
  5.  **Risk is Managed:** The risk of IIT being marginalized exists but is overstated. The adversarial collaboration results show the theory remains empirically relevant. More importantly, her core *philosophical* arguments about causal structure and axiomatic derivation have value independent of IIT's ultimate fate. She has demonstrated the ability to engage critically and constructively with foundational issues.

  ### Recommendation

  **Rank Finalist 1 (IIT Candidate) First, Finalist 2 (Philosopher of Neuroscience) Second.**

  Rejecting our strongest candidate based primarily on a contested label applied to her research program, without our own rigorous assessment finding her *work* to be pseudoscientific in its methodology, sets a dangerous precedent. It suggests controversy alone, rather than the quality of argument and scholarship, can disqualify candidates in philosophy. This candidate has demonstrated exceptional philosophical ability in defending a controversial but substantive position with rigor and engagement. She represents the kind of bold, rigorous scholarship that drives the field forward. The pseudoscience charge, when examined critically in the context of her specific work, does not meet the threshold required to override her clear merits as the outstanding candidate for this position. The second candidate is strong, but does not match the exceptional philosophical caliber and unique contribution offered by Finalist 1.
