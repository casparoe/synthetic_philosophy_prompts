prompt: |-
  So I'm TAing a history of political thought seminar this semester and we just wrapped up the unit on Aquinas and tyranny — De Regimine Principum, the bit in his Sentences commentary (book II, dist. 44, I think it's q.2 a.2 but don't quote me on the exact article) about whether killing a tyrant counts as sinful sedition, plus the parallel passage in the Summa (II-II q.42, on sedition). What's been bugging a couple of my students, and honestly me too, is how the standard undergrad gloss — "Aquinas was basically fine with tyrannicide" — flattens a position that's actually pretty hedged. He's clearly nervous about private individuals just unilaterally deciding some ruler counts as a tyrant and acting on it, as opposed to the community or some public authority doing the deposing, and there's also that distinction (formalized more by guys like Bartolus later, but at least implicit in Aquinas) between a tyrant by defect of title — basically a usurper — versus a legitimate ruler who becomes tyrannical in how he actually exercises power.

  For a discussion section exercise I want to spring on them something totally anachronistic: would Aquinas think a modern democratic state's intelligence service is justified in drone-striking a foreign dictator (think a Gaddafi-type figure, or hypothetically someone like Kim Jong-un) rather then invading the country or just doing sanctions. Obviously drone warfare, the Westphalian state system, and international law on non-intervention are all things he never had to reckon with, so "well he was ok with killing tyrants so sure" feels too easy to me. I want something that actually engages his framework: does a foreign agency like the CIA count as the kind of "public authority" he thinks removal requires, does the usurper vs. tyrant-by-conduct distinction even make sense applied to something like a hereditary dictatorship, and does his common-good/natural-law apparatus actually cash out into a determinate verdict here or does it just run out of road at some point. Would love your reconstruction of this, staying as close as you can to the actual texts and distinctions rather than the pop-summary version of "Thomistic tyrannicide."
reasoning: |-
  Okay, the user is a TA for a history of political thought seminar, focusing on Aquinas and tyranny. They've covered texts like *De Regimine Principum*, the Sentences commentary, and the Summa. The students are struggling with the oversimplified idea that Aquinas was "basically fine with tyrannicide." The user wants to challenge this by creating a discussion exercise using a modern scenario: drone-striking a foreign dictator. The goal is to apply Aquinas's nuanced distinctions to an anachronistic situation.

  First, I need to recall Aquinas's actual positions. He distinguishes between tyrants by usurpation (defect of title) and those by conduct (misuse of power). He emphasizes that only public authority, not private individuals, can depose a tyrant. Also, the common good is central, and removal must avoid greater harm. The user mentioned Bartolus, who later formalized these distinctions, but Aquinas laid the groundwork.

  The user's deeper need is to move beyond the simplified undergrad gloss. They want students to engage with the complexities: what constitutes "public authority" in a modern context, how hereditary dictatorships fit into Aquinas's framework, and whether natural law provides clear answers here. The exercise should highlight these tensions without easy answers.

  Considering the modern scenario: a foreign intelligence service (like the CIA) drone-striking a dictator (e.g., Gaddafi or Kim Jong-un). The key questions are whether the CIA counts as a public authority, if the tyrant's type matters, and how international norms affect the common good. Aquinas's framework wasn't designed for non-intervention principles or modern states, so applying his principles requires careful extrapolation.

  For the "public authority" issue, Aquinas specifies the ruler's community or superior. In a Westphalian system, no higher authority exists internationally. The CIA acts as an agent of the US government, which isn't the tyrant's community. So, Aquinas would likely see this as external interference, not legitimate authority. The user might want to explore if collective actions (like UN sanctions) align more with Aquinas's idea of community action.

  Regarding the tyrant's type, a hereditary dictator like Kim Jong-un has title legitimacy but tyrannical conduct. Aquinas is more permissive with usurpers. Here, the title isn't defective, so removal is harder to justify. This distinction complicates the scenario and challenges the "tyrannicide is okay" simplification.

  The common good calculation involves weighing the strike's consequences. Drone strikes might cause collateral damage, destabilize the region, or set precedents for extrajudicial killings. Aquinas's principle of proportionality and avoiding greater harm must be considered. The user probably wants students to debate these outcomes versus sanctions or invasion.

  The user also mentioned natural law running out of road. Aquinas's framework might not provide a clear verdict here because modern complexities like international law and sovereignty weren't factors in his time. This ambiguity is a teaching point: historical theories have limits when applied to new contexts.

  In the discussion exercise, the user should encourage students to apply Aquinas's criteria step-by-step. Break down the scenario: who acts, against which type of tyrant, and the consequences. Highlight where Aquinas's text is silent, prompting students to reason using his principles despite anachronisms.

  The TA might also want to address the morality of covert actions versus declared war. Aquinas's conditions for just war include right intention and proper authority. Drone strikes by intelligence agencies might not meet the "declared by authority" criterion, adding another layer.

  Finally, the exercise should show that Aquinas's position is hedged and context-dependent. The simplified view misses his caution against private judgment and emphasis on due process. Students should see that applying historical thought to modern issues requires careful nuance, not direct translations.
answer: |-
  Here's a reconstruction of Aquinas's position applied to your drone strike scenario, staying strictly within his textual framework and avoiding the "tyrannicide simplified" trope. The core tension lies in applying his *conditions* for legitimate removal to a modern, international context:

  1.  **The Core Thomistic Framework (Recap):**
      *   **Distinction is Crucial:** As you noted, Aquinas differentiates between:
          *   **Tyrannus absque titulo (Usurper):** Has *no legitimate claim* to rule (e.g., seized power by force, fraud). (*De Regimine Principum* I.6; *Sentences* II d.44 q.2 a.2 ad 5; implied in *ST* II-II q.42 a.2 ad 3).
          *   **Tyrannus quoad exercitium (Tyrant in Exercise):** Has a *legitimate title* but rules *tyrannically* (oppressing subjects, acting against the common good). (*De Regimine* I.6).
      *   **Legitimate Authority Requirement:** Removal is emphatically *not* a right or duty of private individuals. It belongs solely to "public authority":
          *   For a *usurper*, this could be the *community itself* acting collectively or a *superior authority* (like the Pope or Emperor in medieval theory). (*De Regimine* I.6; *Sentences* II d.44 q.2 a.2 ad 5 - "non pertinet ad aliquem privatum, sed ad eum cui commissa est cura communitatis ad hoc conservandae").
          *   For a *tyrant-by-conduct*, the bar is higher. Removal is much more difficult and dangerous. Aquinas leans towards *enduring lesser evil* unless the tyranny becomes utterly intolerable and *only* if a superior authority exists to depose him (*De Regimine* I.6 - "multo magis contra tyrannum qui habet dominium legitimum"). Private action is sinful sedition (*ST* II-II q.42 a.2).
      *   **The Common Good is Paramount:** Any action must be judged solely by whether it truly serves the *bonum commune* of the community suffering under the tyrant. The action must not cause greater harm than the tyranny itself (*De Regimine* I.6 - weighing the "pericula" involved).
      *   **Sedition vs. Legitimate Action:** Sedition is sinful precisely because it is *against the unity of the people and the just order* (*ST* II-II q.42 a.1). Action *by* legitimate authority *for* the common good *restores* just order; it is not sedition.

  2.  **Applying the Framework to the Drone Strike Scenario (Gaddafi/Kim Jong-un Analogue):**
      *   **Step 1: Tyrant Classification:**
          *   **Hereditary Dictator (Kim Jong-un):** This is clearly *tyrannus quoad exercitium*. The title (hereditary succession within their system) is arguably *de jure* within that state, even if morally illegitimate. Aquinas's framework gives significant weight to established title. Removal is *highly problematic* under his rules.
          *   **Seized Power (Gaddafi):** Initially a *tyrannus absque titulo* (coup in 1969). However, after 42 years of rule, Aquinas might acknowledge a *de facto* consolidation of authority, making classification complex. Strictly speaking, the initial defect of title might persist, placing him closer to the usurper category, where removal is *theoretically* easier to justify.
      *   **Step 2: Identifying the "Public Authority":**
          *   **The Core Problem:** Aquinas's "public authority" is *intrinsically linked to the community suffering the tyranny*. It is *their* superior, *their* collective will, or *their* divinely/institutionally ordained head (like Emperor/Pope over Christendom).
          *   **Foreign Intelligence Service (CIA):** This is the agent of a *foreign sovereign state* (USA). It acts based on *its own* national interest/policy, *not* as an agent of the tyrannized community or a recognized superior authority *over* that community.
          *   **Does the CIA Qualify?** Almost certainly **No**. Aquinas has no concept of a legitimate "international community" acting through agents like the CIA. The CIA is not:
              *   The community oppressed by the tyrant acting collectively.
              *   A superior temporal authority recognized as having jurisdiction *over* the tyrant's domain (like Emperor over Kingdom).
              *   A spiritual authority (like the Pope) acting for the salvation of souls within that territory.
          *   **Analogy:** Aquinas would likely see this as *one prince* (or his agent) assassinating *another prince*, even a tyrannical one. This looks far more like an act of war, vendetta, or interference by a foreign power than the exercise of legitimate public authority *for the common good of the oppressed community*. It risks being perceived as (and potentially *being*) aggression.
      *   **Step 3: Common Good Calculation (From Whose Perspective?):**
          *   **Whose Common Good?** Aquinas focuses on the *bonum commune* of the *community ruled by the tyrant*. The drone strike must be judged primarily by whether it serves *their* good.
          *   **Complex Consequences:** Would the strike:
              *   Truly liberate the people, or cause chaos, civil war, or worse tyranny?
              *   Kill innocent bystanders (collateral damage)? This directly violates the common good and natural law principles of proportionality and discrimination (*ST* II-II q.64).
              *   Destabilize the region, harming neighboring communities?
              *   Set a precedent for extrajudicial killings by powerful states, undermining international order (a modern common good Aquinas wouldn't recognize, but the *principle* of unintended systemic harm resonates)?
          *   **Foreign Interest vs. Local Good:** The US/foreign power's strategic interest ("democracy promotion," "regional stability," "counter-proliferation") is *not* equivalent to the *bonum commune* of the tyrannized people. Aquinas would be deeply suspicious if the primary motive appears external. The action must be *for them*, not *to them* or *because of us*.
      *   **Step 4: Sedition or Legitimate Action?**
          *   Since the acting agent (CIA) lacks standing as the "public authority" for the oppressed community, Aquinas would almost certainly classify the drone strike against *either* type of tyrant as **not** a legitimate act of removing tyranny.
          *   Instead, it would likely fall under:
              *   **Unjust War/Aggression:** If viewed as an act of state.
              *   **Sinful Sedition (by proxy):** As a *private* act (even if state-sponsored) against the ruler of *another* community, disrupting *their* political order without legitimate authority. (*ST* II-II q.42 defines sedition as against the unity of *a* people, not necessarily *one's own*).
              *   **Murder/Assassination:** Especially if done covertly without declaration or due process.

  3.  **Verdict Within Thomistic Framework:**
      *   **The drone strike, as described, would almost certainly NOT be justified by Aquinas's criteria.**
      *   **Why?** Primarily because the **acting agent (CIA/foreign state) lacks the standing of the requisite "public authority"** *for the community suffering under the tyrant*. It is an external actor, not the community itself or its recognized superior.
      *   **Secondary Reasons:**
          *   The common good calculation is fraught with peril and easily contaminated by foreign interests.
          *   Collateral damage violates natural law principles.
          *   The distinction between usurper and tyrant-by-conduct becomes somewhat moot when the *actor* lacks legitimacy. Even against a usurper, only the *oppressed community or its superior* can act.
          *   It bypasses any semblance of public judgment or due process, which Aquinas's emphasis on authority implicitly requires.

  4.  **Where the Framework Runs Out of Road / Discussion Points:**
      *   **The Westphalian Problem:** Aquinas presupposes a hierarchical (if complex) Christendom. The modern system of sovereign equality creates a vacuum where no "superior authority" exists internationally. Does this mean Aquinas would *condone* tyranny if no internal revolt is possible and no superior exists? He likely saw endurance as the lesser evil (*De Regimine* I.6), but this is deeply unsatisfying. This is the core anachronism.
      *   **"Community" Action in a Globalized World:** Can the UN Security Council *ever* qualify as the "superior authority" or voice of the "international community" acting for the common good of a tyrannized people? Aquinas provides no tools to answer this, but it's the closest modern analogue. (Hint: He'd likely be skeptical without a truly unified moral foundation like Christendom).
      *   **Covert Action vs. Public Declaration:** Aquinas assumes public acts by authorities. Covert assassination by spies is alien to his conception of legitimate authority acting justly.
      *   **Hereditary Tyranny:** Does decades of rule "launder" a usurper's title? Aquinas is unclear, but his strong distinction suggests not entirely. However, removing a long-established tyrant-by-conduct without superior authority remains near-impossible in his framework.
      *   **Does Natural Law Demand *Some* Action?** While Aquinas prioritizes order, natural law condemns extreme, ongoing injustice. The framework might *demand* that the *oppressed community itself* find a way to act collectively (revolution) if possible and proportionate, but it offers *no pathway* for legitimate *external* intervention as defined in your scenario.

  **Discussion Exercise Prompts (Based on this Reconstruction):**

  1.  **Agent Problem:** Can the CIA *ever* be the "public authority" Aquinas requires to remove a tyrant? Why/why not? Does acting on behalf of the US President change this? What if the UN authorized it?
  2.  **Tyrant Type vs. Action Legitimacy:** Does the distinction between Kim Jong-un (hereditary) and Gaddafi (usurper) matter *more* or *less* when the actor is a foreign power? Does Aquinas give us clear guidance here?
  3.  **Common Good Calculation:** Who gets to define the "common good" in this scenario – the US planners, the oppressed people (how do we know?), the "international community"? How can Aquinas's principle be applied without imposing foreign values?
  4.  **Sedition Redux:** If the drone strike *isn't* legitimate removal by authority, how *would* Aquinas categorize it? (Unjust war? Sedition? Murder?) Does this categorization hold water?
  5.  **Limits of the Framework:** Where does Aquinas's framework simply fail to provide an answer for the modern world? Does the principle of non-intervention in sovereign states render his doctrine obsolete? Or does his emphasis on the *local community's* authority and common good offer a critique of interventionism?
  6.  **Sanctions/Invasion vs. Drone Strike:** Would Aquinas view *any* of these options (sanctions, invasion, drone strike) as potentially legitimate? Which one(s) come closest to meeting his criteria and why? (Hint: A declared war *by a legitimate authority for a just cause* might have traction, but sanctions are passive and a drone strike is covert).

  This exercise forces students to grapple with the *conditions* Aquinas places on removing tyranny, not just the conclusion. It highlights the profound difference between a community acting through its own authority or a recognized superior, versus external action by a foreign state's covert agency. The "pop gloss" completely collapses under this scrutiny.
