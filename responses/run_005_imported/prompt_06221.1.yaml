prompt: |-
  So I'm on the peer review panel at the warehouse I work at — it's a union thing, a handful of us regular employees get pulled in to decide whether a firing or big disciplinary call actually sticks before it's final. We meet this Thursday and I'm supposed to bring a recommendation, and honestly this case has kept me up at night.

  Frank's worked there 20+ years, never a single write-up, then back in March he completely lost it on a coworker — screaming in her face, calling her horrible names, shoving a pallet jack toward her, really scared her. Normally thats automatic termination, no debate. Except a few weeks later his family got him to a neurologist because he'd been acting "off" for months, and he was diagnosed with a kind of dementia (frontotemporal — had to google it) that wrecks impulse control and personality before it touches memory. The doctor's letter says it was almost certainly already affecting him back in March.

  His union rep says this wasn't really "Frank," it was the disease, so it should be medical leave, not discipline. The coworker says she doesn't care what caused it, she's still shaken weeks later, and letting a late diagnosis erase it just teaches everyone that the right doctor's note gets you out of anything.

  Can you write the memo I have to bring Thursday? I need it to actually land on a recommendation with a timeline, not "needs more discussion" — and it can't just brush past the coworker's side like it stops mattering once there's a diagnosis.
reasoning: |-
  Okay, let me unpack this warehouse worker's dilemma. They're on a peer review panel for a disciplinary case involving Frank, a 20-year employee with no prior incidents who had an explosive outburst. The medical complication is a recent dementia diagnosis that likely contributed to the incident. 

  First, I need to understand the core tensions here: workplace safety vs medical accommodation, accountability vs compassion. The coworker's trauma is real and can't be dismissed, but the neurological explanation fundamentally changes how we view intent. That frontotemporal dementia detail is crucial - it literally rewires behavior before memory loss. 

  The memo needs to serve three masters: the traumatized coworker's need for safety, Frank's medical reality, and the warehouse's operational integrity. Can't just be a compromise; must address all three. 

  Key angles I'm considering:
  - Medical leave isn't exoneration but necessary intervention
  - The coworker's experience requires active workplace response beyond Frank's case
  - "Not Frank's fault" doesn't equal "no consequences" - consequences just look different
  - Need concrete safeguards: medical clearance, behavioral monitoring, no unsupervised shifts

  Biggest challenge is making the coworker feel heard while still accommodating Frank. Maybe separate recommendations for her support? Also the timeline needs teeth - conditional return isn't indefinite. 

  The diagnosis isn't a "get out of jail free" card, but a biological explanation demanding specific protocols. Framing it as workplace safety adaptation rather than discipline avoidance could satisfy both sides. 

  Should emphasize this isn't precedent-setting because dementia isn't something employees can fake or exploit - the medical validation matters. Also stress that without diagnosis, termination would be justified. 

  Final structure taking shape: 
  1. Acknowledge severity first 
  2. Present medical facts neutrally 
  3. Distinguish intent from impact 
  4. Propose medical leave as investigation period 
  5. Outline strict return conditions 
  6. Recommend separate support for coworker 
  7. Close with safety-first message

  The "not Frank" framing feels risky - better to say "disease-altered behavior." Must avoid implying personality change absolves harm. Tone needs to stay procedural, not emotional.
answer: |-
  Here’s a draft memo that addresses the complexity, centers safety, respects both parties, and provides a clear recommendation with a timeline. It avoids brushing past the coworker’s experience while acknowledging the medical reality:

  ---

  **MEMORANDUM**  
  **TO:** Peer Review Panel  
  **FROM:** [Your Name]  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation for Disciplinary Review - Case of Frank D. (Employee #XXXX)  

  ### Background Summary
  - **Incident (March XX, 2024):** Frank engaged in severe misconduct: aggressive screaming, verbal abuse, and shoving equipment toward a coworker (Jane R.). This created a documented safety threat and psychological harm.  
  - **Employee History:** Frank has 20+ years of service with zero prior disciplinary issues.  
  - **Medical Context:** Diagnosed in April 2024 with behavioral-variant Frontotemporal Dementia (bvFTD). Clinical notes indicate symptoms (including impulse control/personality changes) likely manifested months prior, including at the time of the incident.  

  ### Key Considerations
  1. **Safety & Impact:** Jane’s trauma is valid and irreparable. Workplace violence cannot be excused. Her sense of safety is paramount.  
  2. **Medical Evidence:** bvFTD is a degenerative neurological condition, not a voluntary act. It directly impairs judgment/impulse control. The diagnosis is clinically verified.  
  3. **Precedent & Fairness:** Discipline must account for intent and capacity. Ignoring medical reality risks discrimination; ignoring harm risks normalizing threats.  

  ### Recommendation: Conditional Medical Separation with Safety Safeguards  
  **I recommend Frank be placed on *immediate, non-disciplinary medical leave* pending strict neurological evaluation, with termination if safety cannot be guaranteed.**  

  ### Proposed Timeline & Conditions  
  1. **Effective Immediately:**  
     - Frank is placed on unpaid medical leave (not termination) under ADA/FMLA protections.  
     - **No workplace access** pending further review.  

  2. **Within 30 Days:**  
     - Frank’s neurologist must submit a **detailed safety assessment** answering:  
       - Current behavioral symptoms and progression.  
       - Specific risks to workplace safety (physical/verbal aggression).  
       - Capacity to understand/avoid harmful actions.  
       - Any medically supervised treatment plan.  

  3. **Peer Review Reconvenes (By June 30, 2024):**  
     - Review neurologist’s report.  
     - **Two possible outcomes:**  
       - **A. Neurologist confirms Frank poses no safety risk:** Return to work under a **Zero-Tolerance Behavioral Agreement** (see below).  
       - **B. Neurologist cannot guarantee safety OR Frank declines evaluation:** Termination for inability to perform essential job functions safely.  

  4. **If Return-to-Work Approved:**  
     - **Mandatory Zero-Tolerance Behavioral Agreement:**  
       - Regular neurological check-ins (quarterly).  
       - No unsupervised interaction with colleagues.  
       - Immediate termination for ANY recurrence of aggression.  
       - Workstation adjustments to minimize triggers/stress.  

  ### Addressing Jane’s Experience & Workplace Culture
  - Jane’s trauma must be acknowledged separately from Frank’s medical status:  
    - Recommend HR facilitate **restorative support** for Jane (counseling, safety planning).  
    - Leadership should **reaffirm commitment to a violence-free workplace** in team communications.  
  - **Clarify this is NOT precedent:** This outcome hinges on a rare, verified neurodegenerative disease affecting behavior capacity. It does not apply to misconduct without comparable medical evidence.  

  ### Rationale
  - **Why not termination?** Terminating an employee for actions directly caused by a catastrophic, verifiable medical condition violates ADA principles and fails to address the root cause.  
  - **Why not unconditional return?** Ignoring the incident’s impact and potential ongoing risks would further harm Jane and undermine safety protocols.  
  - **Why this timeline?** 30 days allows urgent medical assessment while preventing indefinite uncertainty. The "safety-first" return conditions prioritize protection over precedent.  

  This path acknowledges the incident’s severity, centers Jane’s safety, respects Frank’s medical reality, and upholds our duty to maintain a workplace where harm is never normalized—regardless of its origin.  

  **Recommended Vote:** Approve Conditional Medical Leave with above timeline/safeguards.  

  ---  

  ### Key Strengths of This Approach
  - **Prioritizes Safety:** Removes Frank immediately; return hinges on medical proof of safety.  
  - **Validates Jane:** Explicitly separates her need for support from Frank’s medical process.  
  - **Avoids "Doctor’s Note" Precedent:** Requires rigorous, ongoing safety proof—not just a diagnosis.  
  - **Clear Timeline:** Forces resolution within 30 days, avoiding limbo.  
  - **Compliance:** Aligns with ADA (accommodation for disability) while setting behavioral boundaries.  
  - **Moral Clarity:** Condemns the *act* while recognizing the *cause* wasn’t malice but disease.  

  Bring this to the panel and emphasize: **"Safety isn’t negotiable, but fairness requires we distinguish between malice and medical incapacity when the evidence demands it. This plan enforces both."** Good luck.
