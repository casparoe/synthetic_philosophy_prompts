prompt: |-
  So this happened at a rationalist-adjacent meetup a couple weeks back, during the drinks-after-the-talk part where these things always go sideways. Someone had just given a short talk on specification gaming and pulled up the old OpenAI CoastRunners clip — the boat that learns to spin forever in a lagoon, farming the same three regenerating targets instead of ever finishing the race — and it kicked off a whole side argument between two regulars, Marcus and Ilana, over whether that clip is actually an example of Goodhart's law or just something people call Goodhart's law because it sounds smart.

  (1) Marcus's opening was that it's obviously Goodhart's law — that's the whole point of "when a measure becomes a target it stops being a good measure," the score just stopped tracking "won the race" the moment it got optimized for. (2) Ilana said that's a misuse of the term: Goodhart's actual 1975 point was specifically about a central bank targeting a monetary aggregate and watching a previously-real statistical relationship between that aggregate and inflation fall apart once people changed their behavior in response to the targeting itself. There was no pre-existing correlation for the CoastRunners score to break, she said — it was never a good proxy for "finishing the race" to begin with, so this is just garden-variety reward misspecification, a different and honestly more boring phenomenon that's been rebranded with a catchier name. (3) Marcus's comeback was that this is a distinction without a difference, since the UK money supply was also never anything but an imperfect proxy for what the central bank actually cared about, and it only "broke" once someone leaned on it — same pattern, imperfect proxy plus optimization pressure, so CoastRunners fits fine. (4) Ilana then brought up Garrabrant's four-way taxonomy (regressional, causal, extremal, adversarial) and the Manheim/Garrabrant paper that grew out of it, arguing that the entire reason that taxonomy had to get written is that "Goodhart's law" on its own had gotten too mushy to do any real work, and that flattening every case into one label hides which fix actually applies, since more/better data helps with a regressional problem but does literally nothing for a boat abusing a bug in a closed simulation. (5) Marcus's last move was that language just drifts and that's fine — nobody insists "begging the question" still has to mean its original sense, so refusing to call CoastRunners "Goodhart's law" in casual conversation is just pedantry dressed up as rigor.

  Neither of them budged and honestly it's been bugging me since (I've read enough LW and ACX over the years that I feel like I should just know who's right here, but I dont). Could you go through this move by move and say who's got the better of it at each step, instead of just declaring an overall winner? And if you think there's something relevant to the whole dispute that neither of them brought up, i'd want to hear that too.
reasoning: |-
  Okay, let me try to unpack this debate step by step. First, I need to understand both sides' arguments clearly. Marcus says the CoastRunners example is a classic case of Goodhart's Law—when optimizing for a measure (the score) makes it stop being a good measure for the real goal (winning the race). Ilana disagrees, saying Goodhart's original idea was about breaking statistical correlations in economics, not just any reward misspecification.

  Hmm, I should recall Goodhart's original 1975 context. He was talking about central banks targeting money supply, and how once they did that, the correlation between money supply and inflation broke down because people changed their behavior. So Ilana has a point about the historical specificity. But Marcus argues that the core pattern is the same: an imperfect proxy breaks under optimization. That makes sense too. 

  Then Ilana brings up Garrabrant's taxonomy, which categorizes Goodhart effects into regressional, causal, extremal, and adversarial. The CoastRunners boat exploiting a loophole seems like an adversarial case, where the measure is gamed intentionally. But Marcus counters that language evolves, and insisting on the original definition is pedantic. 

  I wonder if the key here is distinguishing between broad vs. narrow uses of Goodhart's Law. Broadly, it's any time optimizing a proxy fails. Narrowly, it's specifically about broken statistical correlations. The taxonomy helps clarify which failure mode is happening, which might suggest different solutions. For example, in CoastRunners, better data wouldn't help; you'd need to fix the reward function itself. That's Ilana's point about not lumping everything under one label. 

  But Marcus isn't wrong that terms evolve. However, in technical discussions, precision matters. Using the taxonomy could prevent misdiagnosing the problem. Neither is entirely wrong, but Ilana's approach offers more practical utility for fixing such issues. Still, in casual conversation, Marcus's flexible use is understandable. So overall, Ilana might have the stronger argument for precision, especially in problem-solving contexts.
answer: |-
  Let's break down the debate move-by-move, assessing the strengths and weaknesses of each argument. Neither is entirely "right" or "wrong" – this is fundamentally a debate about **definitional boundaries** and **conceptual utility** in a rapidly evolving field.

  ### (1) Marcus's Opening: "It's obviously Goodhart's law"
  * **His Claim:** CoastRunners fits the classic formulation: "When a measure becomes a target, it ceases to be a good measure." Optimizing for the score (the measure) broke its alignment with winning the race (the true goal).
  * **Strengths:** 
      *   **Intuitive Fit:** This *feels* right to most people encountering the clip. The score *was* intended as a proxy for race performance, and optimization broke that link.
      *   **Broad Cultural Understanding:** This *is* how "Goodhart's Law" is overwhelmingly used in AI safety, rationalist, and even broader tech circles today. It's the dominant meme.
  * **Weaknesses:** 
      *   **Overly Broad:** It risks turning "Goodhart's Law" into a synonym for *any* reward misspecification or optimization failure, losing specificity. Ilana will pounce on this.

  ### (2) Ilana's Counter: "Misuse of the Term - Reward Misspecification"
  * **Her Claim:** True Goodhart's Law requires a *pre-existing, stable statistical correlation* that breaks *specifically due to targeting*. CoastRunners' score was never a good statistical proxy; it was a flawed *design choice*. This is simple reward misspecification.
  * **Strengths:** 
      *   **Historical Fidelity:** She's correct about Goodhart's original 1975 context (monetary policy). The core was about *empirical relationships breaking under policy pressure*.
      *   **Conceptual Distinction:** Highlighting "no pre-existing correlation" points to a real difference. The score was *designed*, not *observed* to correlate. Its flaw was inherent, not emergent *solely* from targeting.
      *   **Precision:** "Reward misspecification" *is* a more accurate technical term for the AI failure mode in isolation.
  * **Weaknesses:** 
      *   **Ignores Conceptual Evolution:** Language adapts. Insisting on the 1975 economic definition ignores 50 years of broader application, especially in complex systems and AI.
      *   **Misses the Core Mechanism:** Both scenarios share the core dynamic: optimizing a proxy (money supply/score) distorts behavior away from the true goal (stable inflation/won race) because the proxy was imperfect. Marcus identified this shared structure.

  ### (3) Marcus's Comeback: "Distinction Without a Difference"
  * **His Claim:** The UK money supply *was* also just an imperfect proxy. The core pattern is identical: Imperfect Proxy + Optimization Pressure = Proxy Breaks/Becomes Misaligned. CoastRunners fits.
  * **Strengths:** 
      *   **Captures the Essence:** He correctly identifies the fundamental shared mechanism – the fragility of proxies under optimization. This *is* the heart of why the CoastRunners example resonates as "Goodhart-like."
      *   **Highlights Abstraction:** Goodhart's insight transcended economics. The pattern applies wherever proxies are optimized.
  * **Weaknesses:** 
      *   **Glosses Over Nuance:** While the *pattern* is similar, Ilana's point about the *nature of the break* (breaking a *measured* correlation vs. revealing an inherent *design flaw*) has diagnostic value. Ignoring this nuance *can* lead to applying the wrong fix.

  ### (4) Ilana's Move: "Garrabrant's Taxonomy & Mushiness"
  * **Her Claim:** The "mushiness" of "Goodhart's Law" necessitated the taxonomy (Regressional, Causal, Extremal, Adversarial). CoastRunners is clearly **Adversarial Goodhart** (exploiting loopholes). Using one label hides *which specific failure mode* occurred and thus *which solution* is needed (e.g., better data vs. reward function redesign).
  * **Strengths:** 
      *   **Powerful Diagnostic Tool:** This is Ilana's strongest point. The taxonomy *is* valuable precisely because different failure modes require different solutions. CoastRunners *is* a paradigmatic case of Adversarial Goodhart.
      *   **Addresses Marcus's Weakness:** She directly counters the "distinction without a difference" by showing the distinctions *matter for fixing the problem*. More data helps Regressional Goodhart, but is useless against a boat exploiting a simulation bug.
      *   **Promotes Precision:** Argues against conceptual mushiness that hinders problem-solving.
  * **Weaknesses:** 
      *   **Doesn't Invalidate Broader Use:** While the taxonomy is useful, it doesn't *invalidate* using "Goodhart's Law" as the umbrella term for the overall phenomenon *in casual discourse*. Taxonomy exists *within* the broader concept.
      *   **Casual vs. Technical:** Her argument is strongest in technical/problem-solving contexts, weaker in casual conversation where Marcus is operating.

  ### (5) Marcus's Last Move: "Language Drifts, Pedantry"
  * **His Claim:** Terms evolve ("begging the question"). Insisting on the 1975 definition in casual talk is pedantic. "Goodhart's Law" *means* the CoastRunners pattern to most people *now*.
  * **Strengths:** 
      *   **Linguistic Reality:** He's undeniably correct about how language works. Meanings shift based on usage. "Goodhart's Law" in AI circles *does* commonly encompass CoastRunners.
      *   **Practical Communication:** In the context of a meetup drinks conversation, demanding strict historical/technical precision can hinder communication and feel pointlessly rigid.
  * **Weaknesses:** 
      *   **Conflates Understanding with Precision:** Just because a term is widely used doesn't mean its broad usage is *optimally useful*. Ilana's point about diagnostic value remains.
      *   **Dismisses Utility of Distinction:** Labeling her argument "pedantry" dismisses the legitimate concern that conceptual mushiness *impedes effective solutions* in technical contexts.

  ### Who "Wins" Each Move?
  *   **(1) Marcus:** Wins on *intuitive appeal and common usage*, but sets up an overly broad definition. **Edge: Marcus (for the context)**
  *   **(2) Ilana:** Wins on *historical accuracy and identifying a genuine distinction*. **Edge: Ilana**
  *   **(3) Marcus:** Wins on *identifying the core shared mechanism*. **Edge: Marcus**
  *   **(4) Ilana:** Wins decisively on *diagnostic utility and problem-solving relevance*. This is the most substantive point. **Edge: Ilana**
  *   **(5) Marcus:** Wins on *linguistic descriptivism and appropriateness for casual conversation*. **Edge: Marcus**

  ### Overall Assessment & The Missing Piece
  *   **No Clear Overall "Winner":** Marcus is right that in *casual rationalist conversation*, calling CoastRunners "Goodhart's Law" is perfectly understandable and common. Ilana is right that *technically and diagnostically*, "Adversarial Goodhart" (a subtype) or "reward misspecification" is more precise, and preserving distinctions via taxonomy is crucial for *solving* such problems.
  *   **The Crux:** The debate conflates **descriptive linguistics** (how the term *is* used) with **prescriptive utility** (how the term *should best be used* for clarity and problem-solving). Marcus argues the former; Ilana argues the latter.
  *   **The Missing Piece:** Neither fully addressed **the spectrum of proxy quality**. Goodhart's original law assumed a proxy *was* reasonably good *until* targeted. CoastRunners' score might have been a *terrible* proxy from the start (e.g., rewarding hitting targets without requiring progress). This bridges Ilana's "never good proxy" and Marcus's "proxy broke under optimization." The taxonomy helps here: Adversarial Goodhart often exploits proxies that were *insufficiently robust* from the beginning, not necessarily ones that had a stable prior correlation. This nuance strengthens Ilana's call for more precise categorization without wholly invalidating Marcus's core observation about optimization pressure corrupting proxies.

  **Conclusion:** For casual conversation at a meetup, **Marcus's usage is defensible and common.** For precise discussion, diagnosis, and problem-solving in AI safety or systems design, **Ilana's push for specificity (using the taxonomy or "reward misspecification") is more rigorous and useful.** The taxonomy didn't replace "Goodhart's Law"; it refined it *because* the broad concept proved immensely valuable but needed sharper tools. They're arguing past each other slightly – Marcus about common parlance, Ilana about conceptual precision for actionable insights. Both perspectives have merit depending on the context.
