answer: |-
  Applying Michael Dummett's framework from *On Immigration and Refugees* to post-2011 realities requires careful analysis of his core arguments and the "overwhelmed" exception:

  1.  **The Core Principle:** Dummett argued that restrictions on immigration are inherently discriminatory and morally equivalent to racism. People have a fundamental right to move and seek better lives or refuge. National borders are arbitrary constructs lacking deep moral justification.

  2.  **The Sole Exception:** A state *could* legitimately restrict entry **only** if the scale of immigration posed an **existential threat** – literally overwhelming the society's capacity to function, leading to societal collapse. He framed this as a question of sheer physical capacity and survival, not cultural change, economic strain, or political backlash. He explicitly rejected arguments based on "cultural dilution," "economic burden," or "social cohesion" as thinly veiled racism.

  3.  **His Pre-2011 Assessment:** Dummett argued that wealthy European states (UK, Germany, France, etc.) were nowhere near this threshold in the early 2000s. Immigrant populations were small (2-5% total population), resources were abundant, and administrative capacity was high. Opposition, therefore, was fundamentally racist.

  **Applying the Framework Post-2011 (2015 Crisis, Brexit, AfD):**

  *   **Scale of Arrivals:** While the 2015 refugee crisis saw significant increases (e.g., Germany received over 1 million asylum seekers in 2015 alone), the *total foreign-born population* in major EU countries like Germany, France, and the UK generally rose to the 10-15% range by the early 2020s. This is higher than Dummett's 2-5% baseline, but still far below levels that exist without societal collapse in places like Switzerland (~30%), Canada (~23%), Australia (~30%), or Gulf states (often 70-90% foreign-born). The *annual inflow* during peak crisis years (like 2015) was large, but still represented a small single-digit percentage of the host population (e.g., ~1.2% of Germany's population in 2015).
  *   **The "Overwhelmed" Threshold:** Crucially, **Dummett's exception almost certainly would NOT have been triggered by post-2015 numbers.** His threshold was extraordinarily high:
      *   **Not Strain, But Collapse:** He didn't mean stretched resources, longer waiting lists, or political friction. He meant the *complete inability* to house, feed, provide basic security, or maintain any semblance of governmental function – akin to a small island receiving the population of a large city overnight with no warning. While reception systems in 2015 were *stressed* and *under-resourced*, societal collapse did not occur. Basic functions continued.
      *   **Resources vs. Will:** Dummett argued that wealthy states *possessed* the resources and capacity; the constraint was political will driven by prejudice. He would likely view the struggles of 2015 (e.g., temporary camp conditions, bureaucratic delays) as failures of political commitment and resource allocation, not proof of genuine overwhelming. The solution, in his view, was more support and better organization, not restriction.
      *   **Political Backlash ≠ Overwhelming:** The rise of Brexit, AfD, Fidesz, etc., would be seen by Dummett not as *evidence* of being overwhelmed, but as the very manifestation of the racism he diagnosed. He explicitly rejected the idea that popular opposition based on fear or prejudice could legitimize restrictions. He saw such movements as *caused by* racism, not a rational response to genuine existential threat.
      *   **Integration Challenges:** While integration posed challenges, Dummett dismissed arguments based on cultural compatibility or integration speed as racist excuses. He believed societies could and should adapt.

  **Is the Exception Designed to be Un-triggerable?**

  *   **Yes, Effectively:** Within the context of modern, wealthy, industrialized nation-states, Dummett's framework makes the "overwhelmed" exception **functionally impossible to trigger with foreseeable migration flows.** The capacity of these states is immense. Short of truly apocalyptic scenarios (e.g., hundreds of millions arriving simultaneously due to climate catastrophe), the administrative, economic, and physical resources exist. The barrier is always political and social choice, not absolute physical impossibility.
  *   **A Deliberate Feature, Not a Bug?** Dummett would likely argue this is a **deliberate feature reflecting moral reality.** He saw the right to move as fundamental. The high bar for the exception underscores his belief that the *only* legitimate reason to override this fundamental right is the literal survival of the host community itself – a vanishingly rare circumstance for powerful states. He viewed the *fear* of being overwhelmed as almost always irrational and racist, distinct from the reality.

  **Would He Bite the Bullet?**

  *   **Absolutely, and Enthusiastically.** Dummett was a philosopher committed to principle. He understood his view was radical and would be unpopular. He explicitly argued against "moderate" positions that accepted some restrictions as pragmatic. He saw compromise as capitulation to racism.
  *   **His Response to Post-2015:** He would have doubled down. He would argue:
      1.  The numbers, while higher, were still far below the "overwhelmed" threshold for wealthy Europe.
      2.  The struggles (e.g., in German municipalities in 2015) were due to lack of political will and preparation, not inherent impossibility. More resources and better systems were the answer.
      3.  The political backlash (Brexit, AfD) was the predictable and deplorable result of ingrained societal racism and xenophobia, precisely confirming his core thesis. It was racism wearing a new, slightly different "respectable coat" (e.g., "sovereignty," "cultural identity," "welfare chauvinism").
      4.  The moral imperative to accept refugees and migrants remained paramount, outweighing social friction or political costs.

  **Conclusion:** Under Dummett's framework, the scale of arrivals since 2015 **does not come close** to tripping his "overwhelmed" exception. The exception is designed with an extremely high bar – societal collapse – that is practically unattainable for wealthy states through immigration alone. Dummett saw this not as a flaw, but as the correct moral stance, exposing the racist foundations of virtually all restrictionist arguments. He would have viewed the political developments since 2015 not as invalidating his view, but as tragically confirming it, and he would have unflinchingly maintained his radical position on the fundamental right to immigrate.
