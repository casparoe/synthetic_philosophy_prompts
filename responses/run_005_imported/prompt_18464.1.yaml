prompt: |-
  As a longtime reader of LessWrong and the Alignment Forum, I've followed the causal-versus-functional decision theory disputes there for years. Next week's podcast guest is a philosopher who defends functional decision theory (FDT) as the correct account of instrumental rationality, using Parfit's Hitchhiker as her flagship case against causal decision theory. Draft eight to nine interview questions that go beyond having her restate the standard "pay the driver" argument. I want at least one question each on: why FDT should count as a distinct decision theory rather than causal decision theory plus a precommitment device in the manner of Gauthier's constrained maximization or McClennen's resolute choice; whether "subjunctive dependence" is doing real explanatory work or is just a label for whatever makes the math come out right; how her verdict should degrade as the driver's judgment of character grows less reliable, since the original case needs only a decent lie-detector, not an Omega-grade predictor; and whether being knowably disposed to pay makes an agent exploitable by other strategic agents who can lean on that very disposition. For each, include a follow-up keyed to the deflection she's most likely to reach for.
reasoning: |-
