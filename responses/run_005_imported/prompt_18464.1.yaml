  First, I need to unpack what makes this request special. The user isn't just looking for surface-level explanations—they want to probe the philosophical foundations of FDT. The four required angles are telling: they're targeting conceptual boundaries (is FDT truly distinct?), ontological status of "subjunctive dependence" (is it real or just math dressing?), robustness under uncertainty (what if predictors aren't perfect?), and strategic vulnerabilities (does FDT invite exploitation?). This is someone who's read the sequences and wants steel-manned critiques.

  Hmm, the deflection follow-ups are crucial. The user anticipates defensive maneuvers from the guest and wants to preempt them. For instance, on the precommitment question, I know FDT advocates often retreat to "it's not about psychology" when compared to resolute choice—so the follow-up must corner that. Similarly, for subjunctive dependence, they'll likely invoke "abstraction over problem structure," but we need to push on whether that's circular.

  The reliability degradation point is subtle. Parfit's original doesn't require perfect prediction, but the user wants to stress-test FDT's limits. How does it handle 80% reliable lie detectors versus 99%? Should the agent's behavior change linearly or threshold-style? And the exploitation angle—here the user is hinting at Schelling's critique: if everyone knows you're FDT, can they force you into bad deals? That's a deep game-theoretic worry.

  I'll draft questions that force clear answers, not just restatements of FDT orthodoxy. Each main question should trap the guest's core argument, and each follow-up should block escape routes. The tone must remain respectful—this is academia, not a debate—but relentlessly precise. No letting "subjunctive dependence" slide as a primitive!

  ...Also noting the user's framing: "defends FDT as the correct account of instrumental rationality." That's a high bar—instrumental, not total. Questions should honor that scope. No derailing into moral philosophy unless the guest does first.
answer: |-
  Here are 8 interview questions probing FDT's foundations, designed to move beyond standard arguments, with anticipated deflections and targeted follow-ups:

  1.  **Core Distinction: Mechanism vs. Psychology**
      *   **Question:** "You argue FDT is fundamentally distinct from CDT + precommitment strategies like Gauthier's or McClennen's. CDT agents *can* simulate precommitments by valuing their future disposition. What *specific mechanism* within FDT *cannot* be replicated by a sufficiently sophisticated CDT agent explicitly valuing and managing its own decision-making reputation across possible futures?"
      *   *Anticipated Deflection:* "FDT isn't about psychological commitment; it's about the *logical structure of the problem*. CDT gets the *counterfactual math* wrong at its core."
      *   **Follow-up:** "If the distinction isn't psychological, but purely mathematical/logical, can you articulate the *precise mathematical operation* or *counterfactual dependency* that a CDT agent, even one valuing its disposition as a state of the world, fundamentally miscalculates in a case like Parfit's Hitchhiker, that FDT gets right? Where does CDT's causal model specifically fail to capture the necessary abstraction?"

  2.  **Subjunctive Dependence: Explanatory Primitive or Label?**
      *   **Question:** "FDT relies heavily on 'subjunctive dependence' – the idea that the outcome depends on the *decision* itself, not just physical causes. Critics argue this is just a label slapped onto the correlations FDT needs to exploit, without explaining *why* or *how* this dependence holds. What *ontological or metaphysical grounding* does subjunctive dependence have in FDT that prevents it from being merely a *post hoc description* of successful decision patterns?"
      *   *Anticipated Deflection:* "It's not metaphysics, it's about *abstraction*! FDT correctly identifies the *logical node* (the output of the decision function) upon which the outcome depends in the problem's structure."
      *   **Follow-up:** "But doesn't defining the 'logical node' *require* prior knowledge of which correlations are exploitable (like the driver predicting payment)? How does FDT *determine* what constitutes the relevant 'decision node' for subjunctive dependence in a novel situation without begging the question by assuming the correlation exists? Isn't the 'logical structure' itself defined *relative to* the decision theory we're trying to justify?"

  3.  **Robustness: Imperfect Predictors & Degrading Reliability**
      *   **Question:** "Parfit's Hitchhiker often assumes a highly reliable predictor. But what if the driver's judgment is only 80% accurate? An FDT agent pays because 'not paying' subjunctively implies not getting home. But with significant prediction error, 'not paying' *sometimes* (20%) leads to getting home anyway (if mispredicted as paying), and paying *sometimes* (20%) leads to abandonment (if mispredicted as not paying). How should the rational FDT agent *quantitatively* adjust its decision as predictor reliability degrades from near-perfect down to chance? Does FDT prescribe a clear tipping point?"
      *   *Anticipated Deflection:* "FDT still prescribes paying as long as the predictor is better than chance. The *subjunctive link* is still there, even if noisy; acting against it still correlates strongly with bad outcomes."
      *   **Follow-up:** "Doesn't this expose a potential weakness? With 80% reliability, the *causal* expected utility calculation might actually favor *not* paying in some formulations (considering the direct cost of payment and the chance of getting home for free via misprediction). If FDT insists on paying *regardless* of the reliability level (as long as >50%), doesn't it risk becoming *irrationally rigid* compared to an approach that explicitly weights the causal probabilities and costs?"

  4.  **Exploitability: The Price of Knowable Rationality**
      *   **Question:** "FDT agents are knowably disposed to 'cooperate' in dilemmas like Parfit's Hitchhiker and Newcomb's Problem. Doesn't this make them uniquely vulnerable to exploitation by *other strategic agents*? For example, couldn't a malicious agent design a scenario where *threatening* to create a subjunctive link to a terrible outcome (unless paid a ransom) forces the FDT agent to pay up, precisely *because* its commitment to FDT is predictable? Isn't this a fundamental trade-off for FDT?"
      *   *Anticipated Deflection:* "That scenario assumes the malicious agent *can* reliably create such a subjunctive link and that the FDT agent *knows* this. In real strategic interactions, uncertainty about the other agent's capabilities and reasoning often breaks the perfect predictability."
      *   **Follow-up:** "But doesn't FDT *aspire* to be the correct theory for ideal rational agents interacting? In a population of *known, perfectly rational FDT agents*, wouldn't exploitative strategies leveraging their predictable cooperation in subjunctive dilemmas become dominant? Doesn't this suggest that FDT, while perhaps 'winning' in isolated dilemmas against predictors, might be evolutionarily or strategically unstable in a competitive multi-agent environment?"

  5.  **The Scope of "Logical Control"**
      *   **Question:** "FDT claims an agent has 'logical control' over the outputs of its decision function in all possible worlds. Critics argue this conflates *influence* (like in Parfit's) with true *control*. Can you define the precise boundary? For instance, does an FDT agent have 'logical control' over the laws of physics or mathematical truths referenced in a problem description? If not, how does FDT *principledly* distinguish between aspects of a problem it claims control over (decision outputs) and those it doesn't (background laws)?"
  6.  **FDT vs. Evidentialism & the Smoking Lesion**
      *   **Question:** "FDT often avoids the pitfalls of pure Evidential Decision Theory (EDT), like in the Smoking Lesion, by focusing on the decision *output* rather than just the act. But in cases where the correlation between the act and the bad outcome isn't mediated by a *prediction* of the act, but by a direct lesion causing both the desire to smoke and cancer, FDT (like CDT) correctly smokes. How does FDT *formally distinguish* between a 'subjunctive dependence' scenario (like Parfit's) warranting 'cooperation', and a mere evidential scenario (like the Lesion) warranting defection, using only the abstract problem description?"
  7.  **Bootstrapping Rationality**
      *   **Question:** "FDT evaluates acts based on their expected utility *conditional on the output of its own decision function*. Doesn't this risk circularity? How does FDT *bootstrap* the rationality of its choice without presupposing that its decision function is already the correct one to condition on? How does it avoid the charge that it's simply *defining* rationality as 'doing what FDT says'?"
  8.  **The Computational & Cognitive Demands of Abstraction**
      *   **Question:** "FDT requires agents to identify the abstract 'logical structure' of a decision problem, including the relevant decision node and subjunctive dependencies. This seems computationally intensive and potentially ambiguous in complex, novel real-world situations. How does FDT handle the challenge of *bounded rationality*? Is there a risk that its prescriptions become impractical or indeterminate when the 'true' abstract structure isn't obvious, pushing agents towards simpler, potentially CDT-like heuristics?"

  **Key to Deflection Handling:** Each follow-up is designed to:
  1.  **Pin Down Mechanism:** Force a concrete explanation beyond appeals to "logical structure" or "abstraction" (#1, #2, #5, #6).
  2.  **Challenge Robustness:** Test if the theory degrades gracefully or becomes absurd under realistic constraints (#3).
  3.  **Expose Trade-offs:** Force acknowledgment of potential weaknesses or costs of adhering to the theory (#4, #8).
  4.  **Avoid Circularity:** Prevent the theory from being self-justifying without external grounding (#7).

  These questions push the guest beyond rehearsing standard arguments and into the deeper philosophical and practical justifications and consequences of FDT. Good luck with the podcast!
