answer: |-
  Here’s a dialogue that rigorously engages the epistemic access problem, with both characters directly addressing each other’s core arguments while maintaining intellectual parity. The focus remains on whether anyone (inside or out) can verify nonresistant nonbelief.

  ---

  **Characters:**  
  - **Alex:** Defender of Schellenberg’s Divine Hiddenness Argument.  
  - **Taylor:** Reformed Theist employing the "suppressed resistance" response.  

  ---

  **Scene:** A coffee shop after a philosophy conference.  

  **Taylor:** ...so I still think Schellenberg’s "nonresistant nonbeliever" is a category error. If God is as described—holy, sovereign—then *all* nonbelief stems from resistance. Romans 1 is clear: humans "suppress the truth in unrighteousness." Introspective blindness to that resistance is precisely the point.  

  **Alex:** But that’s epistemically paralyzing, Taylor. You’re claiming no one can ever *know* if they’re genuinely nonresistant—not even in principle. That turns "resistance" into an unfalsifiable theological placeholder. By that logic, even a sincere seeker who dies never encountering the Gospel was "secretly resistant." How is that different from just denying the data?  

  **Taylor:** It’s not a dodge—it’s a claim about human nature. Self-deception isn’t unique to theology. Cognitive science shows people rationalize immoral behavior, deny biases, and reinterpret evidence to preserve self-image. If atheists can accuse believers of "motivated reasoning," why can’t the reverse apply? My point is: *you* can’t verify your own nonresistance either.  

  **Alex:** Fair—I agree introspection has limits. But Schellenberg’s argument doesn’t rest on *my* self-report. It’s about God’s moral responsibility. If a loving God exists, He’d ensure *capable* seekers could find Him. So we must ask: **What would nonresistant nonbelief even look like?** If every conceivable case is dismissed as "hidden resistance," you’ve defined resistance *as* nonbelief. That’s circular.  

  **Taylor:** Not circular—causal. Nonbelief *is* the symptom of resistance. Think of it like addiction: an alcoholic might sincerely claim they’re not resisting sobriety, yet their actions prove otherwise. God sees the heart’s posture we can’t.  

  **Alex:** But now you’re shifting the goalposts. We’re not talking about actions; we’re talking about *epistemic openness*. Let me test your view: Imagine someone who actively *wants* to know God, examines evidence, prays "if you’re there, show me," yet finds only silence. You’d still say they’re resistant?  

  **Taylor:** Possibly, yes. Desire isn’t neutrality. Someone might "want" God on their own terms—e.g., without repentance or divine sovereignty. True nonresistance requires surrendering autonomous judgment.  

  **Alex:** Ah—so resistance is defined as *any failure to meet a specific theological condition*. That’s my point! You’ve made nonresistance impossible to distinguish from "failing to be Reformed." What if the seeker *is* willing to repent? What observable behavior or mental state would prove nonresistance to you?  

  **Taylor:** ...I concede it’s not directly observable. But that doesn’t make it false. You can’t observe a person’s love for chess, yet we infer it from their choices. Similarly, resistance manifests in how one engages with revelation—dismissing scripture, redefining God’s nature, etc.  

  **Alex:** But Schellenberg’s argument includes people raised without revelation! Take a Buddhist monk in 5th-century Tibet: no access to Scripture, yet morally earnest, seeking truth. He dies never hearing of Christ. Is he "resistant"? If so, based on what? His ignorance? That makes God’s justice incoherent.  

  **Taylor:** God’s general revelation is sufficient for all (Romans 1:20). The monk suppresses the truth available in creation and conscience.  

  **Alex:** *How could he know he’s suppressing it?* If he introspects and finds no suppression, and we observe his integrity, what third perspective arbitrates? You’re positing a *hidden variable*—resistance only God detects. But then divine hiddenness reduces to: "God knows why He’s hidden," which answers nothing.  

  **Taylor:** And your alternative? You say God *must* make Himself obvious to nonresistant people. But if humans are universally resistant—as my theology holds—then God owes no one greater disclosure. Hiddenness becomes just.  

  **Alex:** That’s exactly the impasse. You assert universal resistance dogmatically. I argue that if *any* nonresistant nonbelievers exist—and we have compelling testimonies of lifelong sincere seekers—then God’s love is undermined. The difference? My claim is testable *in principle*: if we found even one verifiably nonresistant nonbeliever, theism loses. Yours is shielded from all counter-evidence.  

  **Taylor:** Isn’t yours equally shielded? If I show you a seeker-turned-believer who says "I see now I was resistant," you’d call it post-hoc rationalization. You can’t verify nonresistance; I can’t verify its absence. The epistemic burden swings both ways.  

  **Alex:** Not quite. Schellenberg’s argument places the burden on theism: if God exists, He’d prevent nonresistant nonbelief. We point to apparent cases. You must *explain them away*. But when your explanation invokes unverifiable interior states, it functionally denies the appearances without engaging them. That’s special pleading.  

  **Taylor:** Or it’s consistent anthropology. You appeal to "appearances," but psychology shows appearances deceive. People *feel* sincere while avoiding uncomfortable truths daily. Why is religious truth immune to this?  

  **Alex:** It’s not immune. But if *all* atheists are deluded about their motives—even those who pass every test for intellectual honesty—that’s an ad hoc rescue. At minimum, you should admit Reformed theology *predicts* no nonresistant nonbelievers exist, while Schellenberg predicts they *shouldn’t* exist if God does. When we find nonbelievers who seem nonresistant, it’s my prediction that aligns with reality.  

  **Taylor:** ...Unless the "seem" is the illusion. But fine—I’ll grant this: if someone desires God *on His terms*, engages available revelation without prejudice, and *still* cannot believe, that would challenge my view. But only God knows if that occurs.  

  **Alex:** And there’s the epistemic tragedy. We’re left with:  
  - You trusting God’s hidden judgment,  
  - Me trusting human testimony,  
  - And no shared ground to settle who’s projecting.  

  **Taylor:** Perhaps that’s why faith begins where proof ends. Coffee?  

  **Alex:** ...Sure. But I still think your position makes divine justice inscrutable to humans.  

  **Taylor:** And yours makes human sincerity the measure of divine goodness. Stalemate?  

  **Alex:** Stalemate.  

  ---

  **Key Engagements:**  
  1. **Introspective Access:** Both agree humans lack perfect self-knowledge, but Alex argues Taylor’s view makes *all* self-reports unreliable by default.  
  2. **Falsifiability:** Taylor notes Schellenberg can’t *prove* nonresistance exists; Alex counters that theism must explain *actual* nonbelief without invoking untestable claims.  
  3. **Burden of Proof:** Alex places it on theism to explain why God allows *apparent* nonresistant nonbelief; Taylor shifts it to naturalism to prove sincere seeking is possible.  
  4. **The Sticking Point:** Whether "nonresistant nonbelief" is a coherent category—or always a misdiagnosis of rebellion (Taylor) vs. whether "suppressed truth" is an unfalsifiable theological assertion (Alex).  

  Both sides emerge with integrity: Taylor’s anthropology remains consistent but empirically sealed; Alex’s challenge stands but can’t force entry into Taylor’s epistemic framework.
