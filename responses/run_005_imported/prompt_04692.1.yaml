answer: |-
  You've zeroed in on a crucial and historically significant passage. Your mathematical intuition is spot-on: Sidgwick's "product" **is indeed total happiness (H_total = N * Ĥ, where N is population size and Ĥ is average happiness)**. There's no independent mathematical work being done by framing it as a "product" beyond defining total utility.

  So why does Sidgwick present it this way? The answer lies in the *historical context*, the *polemical target*, and the *conceptual emphasis*:

  1.  **Correcting a Misconception (The Polemical Target):** Sidgwick explicitly states his target: "political economists of the school of Malthus" who "often assumed" the goal was to maximize *average* happiness. Malthusians were deeply concerned with population growth outstripping resources, leading to misery (low Ĥ). Their policy prescriptions (like moral restraint) implicitly aimed to prevent population growth that would lower the average. Sidgwick is arguing they missed the true utilitarian calculus. By framing the maximand as the *product* of N and Ĥ, he *forcefully distinguishes* his criterion from the average-happiness-maximization he attributes to the Malthusians. He's saying: "No, it's *not* Ĥ you should maximize alone; it's N *times* Ĥ."

  2.  **Emphasizing the Trade-off:** Framing it as multiplying N and Ĥ highlights the *trade-off* inherent in population decisions. It makes explicit that increasing N might require accepting a decrease in Ĥ (and vice versa), and the utilitarian must calculate the *net effect on the product* (H_total). This is clearer than simply saying "maximize total," which might not immediately evoke the image of weighing changes in N against changes in Ĥ. The "product" language underscores that both factors are variables being multiplied.

  3.  **A "Discovery" Against Prevailing Wisdom:** Sidgwick says this point "has not only never been formally noticed, but which seems to have been substantially overlooked by many Utilitarians." He likely perceived the Malthusian focus on average happiness as the dominant view influencing contemporary utilitarian thought on population. Framing the total view as the *product* was his way of formally stating what he believed was the correct, previously overlooked implication of classical utilitarianism (maximizing the "happiness on the whole"). It *was* a discovery *against* the prevailing average-focused interpretation.

  **Historical Placement: Sidgwick, the Total View, and the Path to Parfit**

  1.  **Anticipation of the Total View:** Sidgwick is **explicitly and directly articulating the core principle of what is now called the "Total View" (or Total Utilitarianism) in population ethics.** This passage is arguably *the* classic foundational statement of the Total View. He unambiguously states that the goal is to maximize the sum total of happiness across all individuals who exist, and that adding lives with positive happiness increases this sum, even if it lowers the average.
      *   *Yes, this is the Total View.*
      *   *Yes, this leads directly to the core logic of the Repugnant Conclusion.*

  2.  **The Repugnant Conclusion:** Derek Parfit's famous formulation decades later (in *Reasons and Persons*, 1984) is essentially the *reductio ad absurdum* of the Total View Sidgwick articulated:
      *   *Premise 1 (Sidgwick's Principle):* We should aim for the outcome with the greatest total happiness (N * Ĥ).
      *   *Premise 2:* A very large population (N_z) where individuals have lives *just barely worth living* (Ĥ_min, a tiny positive amount) can have a larger total happiness (N_z * Ĥ_min) than a smaller, happier population (N_a * Ĥ_a), provided N_z is sufficiently large.
      *   *Conclusion (Repugnant):* Therefore, the outcome with the vast population of minimally happy people (Z) is morally preferable to the outcome with the smaller, much happier population (A).
      Sidgwick doesn't name or explore this specific implication in this passage, but he lays down the mathematical and ethical foundation that makes it inescapable. He acknowledges that adding people with positive happiness increases the total, regardless of the effect on the average, which is the crucial step leading to Z. His passage is the **essential historical precursor** to Parfit's dilemma.

  3.  **Sidgwick's Nuance (and Why He Might Not Have Found it "Repugnant"):** Sidgwick adds a crucial qualifier: "if the additional population enjoy on the whole positive happiness." He requires that the *lives added* must be net positive. He doesn't explicitly consider whether *existing* lives might be made *worse than non-existence* to facilitate adding more positive lives – a move sometimes associated with stronger forms of the Repugnant Conclusion. He also assumes a "positive quantity" of average happiness overall. His focus was likely on real-world scenarios involving marginal increases in population within broadly positive conditions, not the stark hypotheticals Parfit employed. Nevertheless, the core logic leading to the Repugnant Conclusion is undeniably present in his formulation.

  **Conclusion:**

  You are correct. Sidgwick's "product" is mathematically equivalent to total happiness. His somewhat roundabout presentation serves a clear purpose:

  *   **Polemical:** To directly challenge and correct the Malthusian/contemporary focus on maximizing *average* happiness.
  *   **Emphatic:** To clearly frame the population ethics problem as one of *trading off* number (N) against average well-being (Ĥ) to find the maximum of their *product* (H_total).
  *   **Formal:** To state what he believed was the previously overlooked, strictly correct implication of classical utilitarian principles for variable populations.

  Historically, this passage is **foundational.** It is the seminal, clear articulation of the Total View in population ethics. While Sidgwick doesn't explore the extreme implications Parfit later would, the logical structure he establishes – maximizing the sum total of happiness, where adding lives with positive happiness increases the sum – is precisely the structure that leads directly to the Repugnant Conclusion. Sidgwick identified the core principle; Parfit exposed its most counterintuitive consequence. Your reading is astute; Sidgwick is indeed taking the "roundabout route" to arrive at the Total View, primarily to distinguish it forcefully from the average view he saw as mistaken.
