answer: |-
  Based on Dummett's framework in *On Immigration and Refugees*, his response to Cameron's "swarm" remark and the 2015 crisis would likely involve a two-pronged critique—**moral condemnation of the rhetoric combined with a rigorous factual dismissal of its underlying premise**, while his "right not to be submerged" concession would remain largely theoretical and inapplicable to the situation. Here's a breakdown:

  ### 1. **Moral Rejection of the Rhetoric: "Swarm" as Dehumanizing**
     - Dummett consistently attacked language framing migrants as natural disasters ("swamped," "floods") or pests ("swarm"). He argued such terms:
       - **Dehumanize migrants**, stripping them of moral personhood.
       - **Stoke irrational fear** by implying invasion or infestation.
       - **Legitimize cruelty** by casting migrants as threats rather than rights-bearing individuals.
     - Cameron’s "swarm" would draw even fiercer condemnation than Thatcher’s "swamped." "Swarm" carries explicit entomological connotations (insects), intensifying the dehumanization. Dummett would call this **morally indefensible** and a deliberate tactic to evade ethical responsibility toward refugees.

  ### 2. **Factual Dismissal: Britain Was Nowhere Near "Submersion"**
     - Dummett’s "right not to be submerged" is explicitly narrow:
       - **"Submersion" requires existential threat**: He defined it as a scenario where a nation’s "identity and existence as a distinct society" would dissolve due to demographic change—akin to cultural annihilation, not mere numerical increase.
       - **"Extremely limited application"**: He insisted this right *only* applies in "wholly exceptional circumstances" (e.g., tiny island nations facing total inundation).
     - **2015 Context**: Mediterranean crossings (1 million arrivals in Europe) and Calais camps (~6,000 migrants) were:
       - **Demographically negligible**: EU population was ~508 million; UK net migration in 2015 was 336,000—a 0.5% population increase.
       - **Temporary and manageable**: Framed as a "crisis" but not altering national identity.
       - **Driven by conflict**: Syrians, Afghans, and Eritreans fleeing war, not "swarming" by choice.
     - Dummett would conclude Cameron’s rhetoric was **"utterly ridiculous"** (repeating his Thatcher critique) because Britain was objectively *not* at risk of submersion. The "swarm" narrative was factually baseless fearmongering.

  ### 3. **Would His "Submersion" Concession Be Weaponized?**
     - **Theoretical Vulnerability**: Yes, Dummett’s framework *could* be appropriated. By acknowledging a state’s "right not to be submerged," he leaves a door open for nativists to redefine "submersion" as any unwelcome demographic change.
     - **Practical Safeguards**: However, Dummett built robust firewalls against misuse:
       - **Threshold impossibly high**: He set the bar at societal dissolution—far beyond short-term migration spikes.
       - **Empirical rigor**: He demanded proof that identity loss was imminent, not speculative.
       - **Anti-racist priority**: His lifetime of activism prioritized dismantling systemic bias over state "rights." The book explicitly warns against conflating cultural preservation with racism.
       - **Moral asymmetry**: Refugee rights (rooted in survival) *always* outweighed a state’s interest in cultural homogeneity.
     - **2015 Application**: Dummett would argue that invoking "submersion" in 2015 was not just factually wrong but *in bad faith*—a cynical ploy to exploit his nuanced concession while ignoring his criteria. His framework would **reject the appropriation** as a distortion.

  ### Conclusion: Dummett’s Likely Judgment
  - **Cameron’s "swarm" remark**: Dummett would condemn it as **morally vicious and factually absurd**, amplifying his Thatcher critique. The zoological language would intensify his outrage.
  - **The 2015 "crisis"**: He’d argue Europe’s response revealed a **failure of compassion and justice**, not a genuine test of "submersion." Resources existed to absorb refugees; political will did not.
  - **Framework robustness**: While his "submersion" concession creates a *theoretical* vulnerability, his stringent criteria and anti-racist commitments make it **resistant to meaningful appropriation**. In 2015, he’d insist the rhetoric was not just ethically bankrupt but *empirically fraudulent*—a misuse of his philosophy.

  Dummett’s legacy here is a challenge: to confront xenophobic rhetoric without conceding ground to civilizational panic. His response to Cameron would likely mirror his own words: "What is ridiculous is not the anxiety, but the scale on which it is felt" (*On Immigration and Refugees*, p. 24). The 2015 panic, in his view, would be both ridiculous and dangerous.
