answer: |-
  This is a brilliant case study in how social norms function—and why they're so powerful precisely *because* they aren't formal rules. Let's break down your questions:

  ### 1. **Is Mara right that an unwritten custom can’t obligate her?**
     Technically, **yes**—but socially, **no**, and here’s why:

     - **No formal obligation**: Mara is correct that no one can *force* her off the wall. There’s no disciplinary mechanism, no written rule, and no authority figure mandating compliance. Legally/philosophically, she’s free to ignore it.
     
     - **Social obligation exists**: Norms like this create *shared expectations*. When nearly everyone (including underclassmen) perceives sitting as disrespectful, violating it signals disregard for the community’s unwritten agreements. The seniors’ polite but firm request wasn’t just personal preference—it was enforcing a collective understanding. Like cutting in line, it triggers disapproval because it breaks a tacit social contract. 

     - **The power of tradition**: The wall’s authority comes from its history, not rules. As anthropologist David Graeber noted, customs gain force through repetition and shared belief. Mara isn’t just rejecting seniors—she’s rejecting a tradition that gives the community a sense of identity and continuity. Her defiance feels like a small act of social vandalism to others.

     **Verdict**: Mara isn’t *formally* obligated, but she’s underestimating how norms bind through peer enforcement and communal meaning. Refusing to move is like speaking loudly in a library—no law forbids it, but you’ll face social consequences because you’ve violated a shared understanding.

  ### 2. **Is "senior wall" just a low-stakes version of norms like not cutting in line? Or does formalizing it change everything?**
     It starts as the former—**but formalizing it would fundamentally alter its nature**. Here’s how:

     - **Similarities to core norms**:  
       - Both operate through self-enforcement: Peers (not authorities) uphold them.  
       - Both rely on shared intuition: Disrespect isn’t debated; it’s felt.  
       - Both serve social functions: The wall creates cohesion through earned privilege (seniority), much like queuing prevents conflict through fairness.

     - **Why formalization backfires**:  
       - **Loss of spontaneity**: Customs feel legitimate because they emerge organically. Writing it into policy makes it feel imposed, stripping its "natural" authority.  
       - **Changes enforcement**: If teachers patrol the wall, it becomes about punishment, not peer respect. Seniors lose their role as guardians of tradition.  
       - **Creates loopholes**: Unwritten norms adapt (e.g., letting a tired freshman sit briefly). Codified rules invite legalistic challenges ("The handbook says 8 AM, but the bell rings at 8:02!").  
       - **Raises stakes**: Violating a policy is "breaking a rule"; violating a norm is "breaking trust." The former invites rebellion; the latter invites shame.

     The backlash to the student council’s proposal proves the norm’s power lies in its *informality*. Formalizing it would turn a tradition into bureaucracy—and as you’ve seen, even seniors prefer the magic of the unwritten rule.

  ---

  ### Why This Matters
  Your wall exemplifies **emergent order**: complex social patterns arising from individual actions, not top-down control. It persists because:
  - It solves a problem (allocating limited seating) without coercion.
  - It rewards investment in the community (seniors "earn" it by staying).
  - It’s reinforced by approval/disapproval, not punishment.

  Mara’s protest highlights a tension between individual freedom and collective tradition—a microcosm of societal debates. But her stance misses that norms like this *reduce friction*; they’re the grease in social machinery. The wall works because everyone *chooses* to uphold it, not because they’re forced to. That’s why codifying it feels like a violation: it replaces communal consent with authority.

  **Final thought**: Some norms *should* be challenged (e.g., exclusionary traditions). But if the only argument against this one is "no one voted," it’s worth asking: would voting on where seniors sit feel more legitimate—or less human? Sometimes, the beauty of a custom is that it *wasn’t* designed. It just grew.
