prompt: |-
  I'm a retired field biologist -- spent something like 35 years studying territorial contests in reef fish, which meant I picked up a lot more evolutionary game theory than I ever expected to need. One of the tidier results from that world is the "bourgeois" strategy -- owner keeps the territory, intruder backs off -- which is stable once everybody plays it, even though the mirror-image rule ("intruder always wins") would have been just as stable if history had happened to settle on that one instead. Since retiring I've been filling the gap with philosophy, mainly through a little discussion group that meets at the library once a month, and I about fell out of my chair when I hit the arbitrariness condition in David Lewis's book Convention, because its the exact same idea wearing different clothes. Which is maybe why an argument two other people in the group got into last session, over, of all things, restaurant tipping, has been rattling around in my head ever since.

  It went roughly like this. (1) Walt said tipping is a clean textbook case of a Lewis convention: its arbitrary in his technical sense (baking a living wage into the menu price would coordinate everyone just as well), and it's self-perpetuating because everyone conforms, everyone expects everyone else to conform, and that's common knowledge among American diners. (2) Sonia said not so fast: Lewis is explicit that a convention solves what he calls a coordination problem, and a coordination problem requires something like "coincidence of interest" -- people being close to indifferent about which of several equilibria gets picked, the way nobody cares whether we all drive on the left or the right so long as we agree. Tipping isn't like that, she said: servers, diners, and owners have real, unequal stakes in whether we land on "tip generously" versus "pay staff properly and skip the theater," so it fails the very condition that makes something a coordination problem for Lewis in the first place. (3) Walt came back that Lewis himself admits almost every real coordination problem is "impure," mixed with some conflict, and only needs coincidence of interest to predominate, not be total -- and what really does the work in the definition is the conditional part: given that everyone else currently tips, each diner still prefers to tip too, and given that diners tip, each server prefers the tipping system to unilaterally opting out of it. That conditional preference holds right now, he said, no matter how the equilibrium got picked in the first place. (4) Sonia said that concedes too much -- almost any entrenched, self-sustaining arrangement passes that test, including ones everybody would call exploitative, so if that's sufficient, "convention" stops picking out anything distinctive, and Lewis's talk of coincidence of interest and arbitrariness has to be doing real work that Walt's move quietly throws away.

  They both turned to me afterward since I'm the one who suggested the book, but I've only been doing this a year and couldn't honestly tell you who has Lewis on their side. Could you go through moves (1) through (4) and adjudicate each one on its own terms -- basically right, basically wrong, or onto something real but overstated -- against what the definition actually requires (general conformity plus expectation of conformity, common knowledge, the coincidence-of-interest condition, the conditional-preference-for-conformity condition, and the arbitrariness condition)? And then tell me, on balance, whether tipping counts as a genuine Lewis convention or whether Sonia has put her finger on a real gap in the framework that goes well beyond this one example.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a retired field biologist with a background in evolutionary game theory, specifically the bourgeois strategy in reef fish. They've connected that to David Lewis's concept of conventions in philosophy, particularly the arbitrariness condition. Now, they're stuck on a debate in their discussion group about whether restaurant tipping qualifies as a Lewis convention. The user wants an analysis of the arguments presented by Walt and Sonia, and a final judgment on whether tipping fits Lewis's framework.

  First, I need to recall Lewis's definition of a convention. From "Convention," it requires: general conformity, mutual expectations, common knowledge, coincidence of interest, conditional preference for conformity, and arbitrariness. The key points are the coordination problem with multiple equilibria where interests align, and the solution is arbitrary because another equilibrium could work just as well.

  Walt argues that tipping is a convention because it's arbitrary (menu prices could include wages) and self-perpetuating. Sonia counters that it's not a coordination problem due to conflicting interests between servers, diners, and owners. Walt responds that Lewis allows for "impure" coordination problems where conflict exists but coincidence of interest predominates. Sonia rebuts that this broadens the definition too much, losing the distinctiveness of conventions.

  I should evaluate each of their points against Lewis's criteria. For Walt's point (1), the arbitrariness condition seems valid—tipping vs. included wages are alternative equilibria. But Sonia's challenge about coincidence of interest is crucial. Lewis emphasizes that parties must be indifferent to which equilibrium is chosen as long as there's coordination. In tipping, servers likely prefer tips for higher earnings, owners might prefer lower menu prices with tips shifting wage burden to customers, and diners may prefer no tips for simplicity. Their interests aren't aligned, which violates the coincidence of interest.

  Walt's point (3) about impure coordination problems has merit; Lewis acknowledges some conflict. However, the conflict in tipping is significant. The conditional preference for conformity might hold—each diner tips because others do, servers rely on tips. But the underlying preferences aren't indifferent to the equilibria. If given a choice, servers would likely favor tipping for higher potential earnings, while diners might prefer inclusive pricing. This lack of indifference challenges the coordination problem classification.

  Sonia's point (4) is strong. If any self-sustaining system is called a convention, it dilutes Lewis's concept. The arbitrariness and coincidence of interest are core to distinguishing conventions from other norms. Tipping's persistence isn't due to mutual indifference but power dynamics and entrenched practices, making it more of a social norm with conflict.

  The user also asks if Sonia identified a gap in Lewis's framework. Real-world conventions often involve conflicts, but Lewis's model assumes predominant coincidence of interest. Tipping highlights cases where interests diverge significantly, suggesting the framework might not neatly apply. This could indicate a limitation in Lewis's theory for analyzing norms with inherent inequalities.

  In conclusion, tipping isn't a pure Lewis convention because of the lack of coincidence of interest. While it meets some criteria like arbitrariness and conditional conformity, the conflicting stakes among parties prevent it from being a true coordination problem. Sonia's argument points out a valid limitation in Lewis's framework when applied to practices with exploitative elements or unequal power dynamics.
answer: |-
  Here's a breakdown of Walt and Sonia's arguments against David Lewis's core conditions for a convention, followed by a balanced judgment on tipping and the framework:

  **Lewis's Core Conditions (Summarized):**
  1.  **General Conformity:** Most people follow the regularity (R).
  2.  **Mutual Expectation of Conformity:** Everyone expects others to conform to R.
  3.  **Common Knowledge:** (1) and (2) are common knowledge (everyone knows them, knows everyone knows, etc.).
  4.  **Conditional Preference for Conformity:** Given that others conform to R, each agent prefers to conform to R as well.
  5.  **Coordination Problem:** R solves a recurrent situation where:
      *   There are multiple possible coordination equilibria (outcomes where no one benefits by unilaterally changing their action *if others don't change*).
      *   **Coincidence of Interest:** Agents are largely *indifferent* (or nearly so) between the different possible coordination equilibria. Their primary interest is simply *coordinating on the same one*, not *which one* it is.
  6.  **Arbitrariness:** There exists at least one alternative regularity (R') that, if established, would also solve the coordination problem just as well (i.e., it's another coordination equilibrium satisfying the above).

  **Adjudicating the Moves:**

  1.  **Walt (1): "Tipping is a clean textbook case..."**
      *   **On Arbitrariness:** **Basically Right.** Walt correctly identifies that baking a living wage into the menu price *could* serve as an alternative coordination equilibrium (R') achieving the same fundamental goal: paying servers for service. The *form* of payment is arbitrary in Lewis's sense. This condition is met.
      *   **On Self-Perpetuation (Conformity/Expectation/Common Knowledge):** **Basically Right.** In the US context, there is general conformity to tipping norms, mutual expectation of tipping, and this is common knowledge among diners, servers, and owners. This aspect is satisfied.
      *   **Overall for (1):** **Overstated.** While Arbitrariness and the self-perpetuation elements (Conformity/Expectation/CK) are present, Walt ignores the crucial **Coordination Problem** and **Coincidence of Interest** conditions, which Sonia immediately challenges. He jumps to "textbook case" without establishing the foundational requirement.

  2.  **Sonia (2): "Not so fast... fails coincidence of interest"**
      *   **On Coordination Problem & Coincidence of Interest:** **Basically Right.** Sonia pinpoints the core weakness. Lewis *requires* the convention to solve a situation where parties primarily care about coordination itself, not the specific outcome coordinated upon. In tipping:
          *   **Servers:** Often have a *strong preference* for the tipping equilibrium. Tipped minimum wage is lower, tips can exceed a flat wage, and high-tip customers subsidize their income. A stable, high wage baked into prices might be less desirable *to them* than the *potential* of high tips.
          *   **Diners:** Many have a *strong preference* for the non-tipping equilibrium (included prices). They dislike the ambiguity, calculation, social pressure, and feeling of subsidizing wages the owner should pay. Others prefer the perceived control/incentive of tipping. Crucially, they are *not indifferent*.
          *   **Owners:** Have a *strong preference* for the tipping equilibrium. It allows lower advertised menu prices (attracting customers), shifts wage risk/fluctuation onto customers/servers, and often results in a lower effective wage bill than paying a full living wage + benefits + payroll taxes.
      *   **Overall for (2):** **Correct.** The stakes are unequal, and the parties have distinct, often conflicting, preferences about *which* equilibrium ("tip" vs. "included wage") they land on. This violates the "coincidence of interest" necessary for Lewis's core concept of a coordination problem.

  3.  **Walt (3): "Lewis admits 'impure' problems... conditional preference holds"**
      *   **On Impurity & Conditional Preference:** **Onto something real but overstated.**
          *   **Conditional Preference:** **Basically Right.** Walt correctly notes that the *conditional* preference for conformity likely holds *given the current equilibrium*:
              *   *Given others tip,* a diner prefers to tip (to avoid social sanction, ensure good service next time, feel fair).
              *   *Given diners tip,* a server prefers the tipping system to unilaterally refusing tips (they'd lose income).
              *   *Given the system exists,* an owner prefers it to unilaterally changing their wage structure (disrupting expectations, potentially raising costs).
          *   **Impurity:** **Partially Right, but Misapplied.** Lewis does acknowledge that most real-world coordination problems involve *some* conflict of interest. However, he insists that **coincidence of interest must *predominate***. The conflict cannot be so severe that parties have strong preferences *against* coordinating on a specific equilibrium *even if others are coordinating on it*. In tipping, the conflict *is* severe enough to undermine predominance:
              *   Diners *strongly dislike* the tipping equilibrium itself, even while conforming conditionally.
              *   Servers *strongly prefer* the tipping equilibrium *over* the alternative.
              *   The conditional preference exists *despite* the underlying conflict, not because conflict is minor. The conflict motivates desires for *system change*, not just conditional conformity within the system.
      *   **Overall for (3):** **Overstated/Misleading.** While the *conditional preference for conformity* exists (a necessary condition), Walt uses the allowance for "impurity" to downplay the *lack of predominant coincidence of interest regarding the equilibria themselves*. He focuses only on the stability *within* the current system, ignoring the fundamental disagreement *about* the system.

  4.  **Sonia (4): "Concedes too much... 'convention' stops picking out anything distinctive"**
      *   **On Dilution of "Convention":** **Basically Right.**
          *   If *only* general conformity, expectations, common knowledge, and conditional preference for conformity (given the current system) are required, then *any* stable social norm or institution qualifies – feudalism, caste systems, exploitative labor practices. These can be stable because everyone expects them and conditionally prefers to conform (fearing punishment or chaos).
          *   Lewis's distinctive contribution is precisely the **combination**: conventions solve *coordination problems* characterized by **arbitrariness** and **predominant coincidence of interest**. These conditions ensure conventions are mutually beneficial solutions to problems of *pure coordination*, distinct from norms solving conflictual situations or maintained by power imbalances.
          *   Removing the requirement for predominant coincidence of interest (as Walt's argument effectively does) indeed makes "convention" synonymous with "entrenched norm," losing its analytical power. The talk of coincidence of interest and arbitrariness *is* doing the essential work of defining a specific *type* of norm.
      *   **Overall for (4):** **Correct.** Sonia identifies the logical consequence of Walt's weakening of the conditions. Lewis's framework *needs* the coincidence of interest (with arbitrariness) to distinguish conventions from other types of social regularities.

  **Judgment on Tipping as a Lewis Convention:**

  *   **No, restaurant tipping (in its current US form) is not a genuine Lewis convention.**
  *   **Why?** It fails the **core requirement of solving a coordination problem with predominant coincidence of interest.**
      *   While it meets Arbitrariness (alternative equilibria exist) and the self-perpetuation conditions (Conformity, Expectation, Common Knowledge, Conditional Preference for Conformity *given the current system*), the preferences of diners, servers, and owners regarding *which equilibrium* ("tip" vs. "included wage") they would prefer to coordinate on are **fundamentally conflicted and not indifferent**.
      *   The conflict of interest over the *content* of the equilibrium is severe and central, not a minor "impurity." Parties have strong, divergent stakes in the outcome.

  **On Sonia's Point about the Framework's Gap:**

  *   **Yes, Sonia has put her finger on a real and significant tension within Lewis's framework.**
  *   **The Gap:** Lewis's model, rooted in pure coordination games like driving side or meeting place, assumes agents are *primarily indifferent* to the equilibrium *content*. Their utility comes almost entirely from *coordination itself*. However, many socially important "conventions" involve equilibria where the *distribution* of benefits/costs differs significantly (like tipping, property norms, or even currency). While conditional conformity holds, the underlying preferences over the equilibria are *not* indifferent – there are winners and losers depending on which rule is established.
  *   **Beyond Tipping:** This gap is crucial for analyzing norms governing resource distribution, labor relations, gender roles, or political institutions. These often *look* like conventions (arbitrary, self-perpetuating, conditional conformity), but their stability may rely more on power dynamics, sunk costs, or lack of better alternatives than on a genuine coincidence of interest in the rule *itself*. Labeling them "impure coordination problems" risks obscuring the inherent conflict.
  *   **Framework's Strength & Limitation:** Lewis's framework brilliantly captures the logic of coordination on arbitrary but mutually indifferent solutions. Its limitation is in handling norms where the *choice* of equilibrium creates significant distributional conflicts *even when coordination is achieved*. Sonia correctly highlights that Walt's application stretches the definition to cover phenomena Lewis explicitly sought to distinguish.

  **Conclusion:** Your colleagues' debate perfectly illustrates the power and limits of Lewis's model. Walt is right about the surface-level stability and arbitrariness of tipping. However, Sonia correctly identifies the fatal flaw: the lack of predominant coincidence of interest regarding the tipping equilibrium *itself*. The conflicting stakes among diners, servers, and owners prevent tipping from being a pure Lewisian convention. More importantly, Sonia exposes a genuine challenge in applying Lewis's framework to real-world norms involving significant distributional consequences – a gap that goes well beyond the tipping example and speaks to the complexity of social norms where coordination and conflict are intertwined. Your game theory background gives you a unique lens to see this – the "bourgeois" strategy works partly *because* the owner/intruder often have *coinciding interests* in avoiding costly fights over a resource of relatively equal value to both; tipping lacks that symmetrical indifference to the rule's content.
