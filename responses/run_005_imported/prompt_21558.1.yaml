prompt: |-
  At work we do these blameless postmortems after outages where the whole goal is nailing down "the root cause," and I've noticed it almost always gets pinned on something that *didn't* happen -- on-call didn't get paged, the reviewer didnt catch the bug, the migration script didn't have a rollback, whatever. I went down a rabbit hole reading about how philosophers deal with "absences" as causes, and apparently theres a real puzzle here: if you use the obvious counterfactual test (the outage wouldn't have happened if X had occurred), you get a stupid number of unrelated non-events qualifying too -- like technically if my cat could read code she'd have caught the bug, so did her not-reading-code also cause the incident? Can you walk through the most important implications of this omission-causation puzzle for how we assign "root causes" in incident reviews -- basically, is there some principled way to say the engineer's omission is THE cause and the cat's isn't, or is "root cause" always secretly just blame/convention dressed up as objective causal language?
reasoning: |-
  Okay, let me unpack this user's question. They're dealing with postmortems at work where root causes are often pinned on things that *didn't* happen—like someone not getting paged or a script missing rollback. They've noticed this pattern and even looked into philosophical debates about absences as causes. The user is clearly frustrated with how "root cause" might just be a sneaky way to assign blame under the guise of objectivity.

  First, I need to address their core concern: the validity of omissions as root causes. The user mentions the counterfactual test leading to absurd results (like the cat example). They're asking if there's a principled way to distinguish between relevant omissions and irrelevant ones. 

  The philosophical angle here is tricky. Causation by absence is a legit puzzle—philosophers like David Lewis have wrestled with it. The counterfactual approach does indeed explode with infinite absences. So how do we reconcile that with practical incident reviews?

  I should break this down into key implications. First, the "root cause" concept itself might be flawed when applied to complex systems. Systems thinking suggests that failures emerge from multiple interacting factors, not single points. But postmortems need actionable outcomes, hence the focus on specific omissions. 

  Next, the distinction between necessary conditions and assignable causes. The cat not reading code is technically a necessary condition in the counterfactual sense, but it's not part of the system's design or expectations. The engineer's omission, however, violates explicit protocols. That's where norms come in—causation in human systems is deeply tied to responsibilities and expectations. 

  The user might also be hinting at blame culture disguised as blamelessness. If every "root cause" is an omission by a person/team, it feels like covert finger-pointing. I should acknowledge that tension: postmortems can unintentionally reinforce blame while claiming otherwise. 

  Practical solutions? Shift from "root cause" to "contributing factors" and focus on systemic fixes. Highlight how good incident reviews avoid the trap by emphasizing multiple changes (e.g., better monitoring + documentation) rather than singular causes. The cat example fails because it's not a feasible intervention point—whereas adding rollback scripts is. 

  Finally, validate their skepticism. They're right to question whether "root cause" is objective. It's not. But that doesn't make postmortems useless; it means reframing them as learning tools grounded in shared norms and actionable improvements. The real win is preventing future outages, not perfect causal accounting.
answer: |-
  You've hit on a profound philosophical and practical problem that plagues incident reviews: **the ontology of absence-as-cause**. Let's break down why this happens and how to navigate it more effectively:

  ### The Core Problem: Causation by Omission is Context-Dependent
  The counterfactual test (*"If X had happened, the outage wouldn't have occurred"*) is too broad. As you noted, it makes *every* non-occurrence that *could* have prevented the incident a "cause" (your non-coding cat, a meteor not striking the data center, etc.). Philosophers like David Lewis and J.L. Mackie acknowledge this but argue causation requires **dependence within a network of normal expectations**. This is where "root cause" in engineering diverges from pure philosophy.

  ---

  ### Key Implications for Incident Reviews
  1. **"Root Cause" is a Practical Construct, Not a Cosmic Truth**  
     Root cause analysis (RCA) isn't about finding *the* metaphysical cause—it's about identifying **the most actionable point(s) of intervention** to prevent recurrence. Your cat isn't a valid root cause because you can't *feasibly* train cats to review code. The engineer's omission *is* actionable.

  2. **Norms Define What "Counts" as a Cause**  
     Causation in human systems relies on **expectations and responsibilities**:
     - **The Cat**: No reasonable person expects cats to review code → not a cause.
     - **The On-Call Engineer**: Being paged *is* an expectation → failure to page *is* a cause.  
     This is why legal systems recognize "duty of care" – causation is tied to assigned roles.

  3. **The "Butterfly Effect" Trap**  
     If you trace causality infinitely backward, *everything* is a cause. RCA must define **scope boundaries**:
     - Focus on **proximate** omissions (e.g., missing rollback script) vs. **distant** ones (e.g., CEO not prioritizing QA hires 3 years ago).
     - Prioritize omissions that **directly enabled the failure mode**.

  4. **Blame Hiding in Plain Sight**  
     Calling an omission "the root cause" often **functions as covert blame** – especially if the review ignores systemic factors (e.g., why was there no rollback script? Was the team overworked?). True blamelessness requires examining *why* the omission was possible.

  ---

  ### A Better Framework: From "Root Cause" to "Contributing Factors & Interventions"
  Stop asking *"What's THE root cause?"* and instead ask:  
  🔍 **"What system conditions made this failure possible?"**  
  🔍 **"Which factors are most feasible and impactful to change?"**  

  | Factor Type          | Your Example (Migration Script) | Cat Example         | Why It Matters          |
  |----------------------|---------------------------------|---------------------|-------------------------|
  | **Proximate Omission** | No rollback script             | Cat not reading code | Actionable? **Yes/No** |
  | **Systemic Enabler**   | No CI/CD rollback requirement  | No feline QA program | Fixable at scale?       |
  | **Norm Violation?**    | Yes (best practice ignored)    | No (no norm exists)  | Legitimate RCA focus?   |
  | **Intervention**       | Enforce rollback templates     | N/A                 | Prevents recurrence?    |

  ---

  ### Practical Solutions for Postmortems
  1. **Ban the Term "Root Cause"**  
     Use **"key contributing factors"** or **"critical failure points."** This acknowledges multiplicity.

  2. **Test Causes with the "5 Whys" + "So What?"**  
     - *"Rollback failed" → Why? No script → Why? Not required → Why?...*  
     - Then ask: **"So what will we *concretely change*?"** (e.g., mandate rollback scripts for all migrations).

  3. **Demand Positive Actions, Not Absences**  
     Instead of *"Engineer didn’t test rollback,"* frame as: **"System lacked automated rollback verification."** This shifts focus to *fixing systems*, not shaming people.

  4. **Include "Near Miss" Analysis**  
     Ask: *"What almost stopped this? Why did it fail?"* (e.g., "The staging environment *almost* caught the bug, but missed edge case X"). This reveals latent weaknesses without fixating on absences.

  5. **Adopt a Swiss Cheese Model**  
     Visualize the incident as holes in multiple layers of defense (monitoring, testing, procedures). No single hole causes failure – it’s the *alignment* of gaps. Fix layers, not just one "root" hole.

  ---

  ### Why This Isn't Just Semantics
  When postmortems fixate on individual omissions (e.g., "Alice didn’t check X"), they:
  - Encourage covering one's ass over transparency,
  - Miss systemic fixes (e.g., why *can* Alice bypass checks?),
  - Perpetuate the myth of "human error" as a cause rather than a symptom.

  **The litmus test**: If your "root cause" is phrased as *"Person/Team didn't do X,"* you’ve likely found a scapegoat, not a cause. If it’s *"The system doesn’t ensure X happens,"* you’re on the right track.

  Your instinct is correct: **absences are causes only relative to expectations**. But by anchoring those expectations to *engineered systems* (not cats), and focusing on *changeable mechanisms*, postmortems can avoid blame while driving real improvement. The goal isn’t perfect causality—it’s preventing the next outage.
