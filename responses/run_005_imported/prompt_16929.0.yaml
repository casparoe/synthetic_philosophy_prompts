answer: |-
  Your inquiry cuts to the heart of why Arrow's framework leads to impossibility while Harsanyi's yields a utilitarian SWF. The key differences lie in the **domain of preferences**, the **nature of the "independence" axioms**, and the **implicit introduction of cardinality and comparability**. Let's dissect the contrast:

  1.  **The Foundational Shift: Certainty vs. Uncertainty (Ordinal vs. Cardinal)**
      *   **Arrow:** Operates in a world of **certainty**. Individuals have *ordinal* preferences over *deterministic* social states (A > B > C). Only the *ranking* matters; no information about the *intensity* of preference (how much A is preferred to B) exists or is used. The aggregation rule only sees orderings.
      *   **Harsanyi:** Operates in a world of **uncertainty/risk**. Individuals have *von Neumann-Morgenstern (vNM)* preferences over *lotteries* (probability distributions) over social states. This imposes a very specific structure:
          *   **Cardinality:** vNM preferences imply the existence of a **cardinal utility function**, unique up to positive affine transformations (u' = a*u + b, a>0). Utility differences *do* have meaning (e.g., u(A) - u(B) > u(B) - u(C) implies A is preferred to B *more* than B is preferred to C).
          *   **Linearity in Probabilities:** Preferences satisfy the vNM axioms (completeness, transitivity, continuity, and crucially, **independence**). This means utility is *linear* in probabilities: U(pL + (1-p)M) = p*U(L) + (1-p)*U(M).

  2.  **The Drastically Different "Independence" Axioms:**
      *   **Arrow's Independence of Irrelevant Alternatives (IIA):** The social ranking between any two alternatives **X** and **Y** must *only* depend on the *individual ordinal rankings* of **X** and **Y**. Information about how individuals rank other alternatives (Z, W, etc.) or any intensities must be ignored.
          *   *Effect:* Severely restricts the information available for aggregation. Prevents rules like Borda count (which uses rank positions, involving other alternatives) or any rule sensitive to preference intensity.
      *   **Harsanyi's vNM Independence Axiom:** If an individual prefers lottery **L** over lottery **M**, then they must prefer the mixture **pL + (1-p)N** over the mixture **pM + (1-p)N** for any other lottery **N** and any probability **p** (0 < p ≤ 1).
          *   *Effect:* This is a *rationality constraint on individual preferences under risk*, ensuring utility is linear in probabilities. It is **NOT** about ignoring information relevant to social choice. In fact, it *enables* the specific linear aggregation structure Harsanyi derives. It governs how individuals form preferences over complex gambles.

  3.  **The Role of Pareto Principles:**
      *   Both use Pareto principles, but the richer domain in Harsanyi makes the Pareto principle more powerful.
      *   **Arrow's Weak Pareto:** If everyone strictly prefers X to Y, then society must strictly prefer X to Y.
      *   **Harsanyi's Pareto Indifference/Preference:** (Often stated as a single principle encompassing both).
          *   If everyone is *indifferent* between two lotteries L and M, then society is indifferent.
          *   If everyone *weakly prefers* L to M and at least one person *strictly prefers* L to M, then society strictly prefers L to M.
      *   *Crucial Point:* Applied to lotteries, these conditions leverage the *cardinal* information embedded in vNM utilities. Indifference implies equal utility *values*, weak preference implies higher utility *values*. Pareto comparisons now involve comparing utility *levels* across individuals implicitly.

  4.  **How Harsanyi's Theorem Works & The Origin of Weights:**
      Harsanyi imagines an impartial "social observer" forming rational preferences (satisfying vNM axioms) over social lotteries. The observer knows each individual's vNM utility function (up to affine transformation). The axioms imply:
      *   The observer's vNM utility function over social lotteries must be a function of the individual vNM utilities.
      *   **Linearity:** Due to the vNM structure (linearity in probabilities) applying to both individual utilities *and* the social observer's utility, and the Pareto principle linking them, Harsanyi shows the *only* form compatible with the axioms is a **linear aggregation**:
          `W = a_1 * U_1 + a_2 * U_2 + ... + a_n * U_n + b`
      where `W` is social utility, `U_i` is individual i's vNM utility, and `a_i > 0` are positive weights (b is a constant, irrelevant for preference).
      *   **The Source of Weights:** Critically, the weights `a_i` **are not derived as equal within the theorem.** They reflect the **social observer's ethical valuations** about the relative importance of different individuals' utilities. The weights emerge from how the social observer trades off marginal increases in utility between different people when forming their preferences over lotteries. The theorem guarantees the form is a *weighted sum*, but the specific weights are determined by the *observer's* preferences (satisfying the axioms).

  5.  **Interpersonal Comparability and Equal Weights:**
      *   **Implicit Comparability:** Harsanyi's framework **implicitly assumes interpersonal comparability of utility *levels* and *differences***. This is fundamental to the additive form. When the social observer forms `W = Σ a_i U_i`, they are inherently comparing the utility *level* assigned by person 1 to outcome X with the utility *level* assigned by person 2 to outcome X. They are also comparing the *impact* (`a_i * ΔU_i`) of a utility change for person i versus person j (`a_j * ΔU_j`). The Pareto principle forces the observer to respect the *scale* of each individual's utility function when making these comparisons.
      *   **Equal Weights?** **No, the theorem does *not* deliver equal weights (`a_i = a_j` for all i, j) on its own.** Equal weights require an **additional ethical axiom**, usually:
          *   **Symmetry/Anonymity:** The social welfare function treats individuals symmetrically. If two individuals swap their utility functions, the social ranking remains unchanged.
      *   Without Symmetry/Anonymity, the weights `a_i` can be unequal, reflecting the social observer's potentially unequal valuation of different individuals (e.g., prioritizing the worst-off, prioritizing a specific group). **Harsanyi's theorem establishes the utilitarian *form* (linear aggregation of cardinal utilities), but the *egalitarian content* (equal weights) requires an independent ethical commitment.**

  **The Crucial Transformation Summarized:**

  1.  **From Ordinal to Cardinal:** Moving from preferences over certain outcomes (Arrow) to vNM preferences over lotteries (Harsanyi) introduces **cardinal utility**, representing intensity of preference.
  2.  **From IIA to vNM Independence:** Replacing the information-restricting IIA with the rationality-under-risk vNM Independence axiom allows the **linear structure** of vNM utilities to be leveraged.
  3.  **Pareto on Lotteries:** Applying the Pareto principle to lotteries, where cardinal utility differences manifest, forces the social ranking to respect these cardinal individual utilities.
  4.  **Linear Aggregation Emerges:** The combination of the social observer's own vNM rationality, the linearity of individual vNM utilities, and the Pareto principle acting on these utilities **necessitates a linear aggregation rule** (the weighted utilitarian sum).
  5.  **Weights as Ethical Choice:** The specific weights in the sum reflect the social observer's ethical stance on distributive justice. **Equal weights require an explicit symmetry/anonymity axiom; they are not derived from the core aggregation axioms alone.**

  **Why Impossibility Turns into Uniqueness (of Form):**

  Arrow shows that aggregating *only ordinal* information under IIA and Pareto leads to dictatorship. Harsanyi shows that when preferences reveal *cardinal* utility via vNM structure over lotteries, and the social observer is also rational under risk, then Pareto forces aggregation into a single, specific *form* – the linear weighted sum. The impossibility is overcome because the richer informational environment (cardinal utility revealed by choices under risk) provides the necessary data (intensities) that Arrow's framework explicitly forbids using. Harsanyi's "independence" axiom (vNM) enables the mathematical structure that makes additive aggregation possible, while Arrow's "independence" axiom (IIA) forbids the use of the information that additive aggregation requires. The key is the domain shift to uncertainty, unlocking cardinality and enabling linear aggregation via the shared vNM structure.
