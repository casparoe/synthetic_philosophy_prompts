prompt: |-
  I'm preparing a graduate seminar on medieval resistance theory and want to push my students past the flattened textbook claim that 'the Scholastics justified tyrannicide.' Aquinas's own position, developed across De Regimine Principum and the Summa's treatment of sedition, turns on a distinction between a ruler who is a tyrant in title alone—a usurper—and one who was legitimately installed but rules tyrannically in practice; John of Salisbury, in the Policraticus, grounds his considerably more unqualified defense of tyrannicide instead in whether the would-be killer is bound to the ruler by an oath of fealty. Compare these two distinctions and the work each is doing: once you take each thinker's qualifications seriously, whose position actually licenses more in the way of private, unilateral tyrannicide, and whose framework had the greater afterlife in early modern resistance theory? Justify your answer.
reasoning: |-
  Okay, the user is preparing a graduate seminar on medieval resistance theory and wants to move beyond the simplified claim that Scholastics justified tyrannicide. They specifically mention Aquinas and John of Salisbury, focusing on their distinctions regarding tyrannicide. The user asks to compare the distinctions each thinker makes and analyze whose position allows more private, unilateral tyrannicide, and whose framework had a greater influence on early modern resistance theory.

  First, I need to recall Aquinas's position. In De Regimine Principum and the Summa Theologiae, Aquinas distinguishes between a tyrant by practice (legitimate ruler who becomes tyrannical) and a tyrant by usurpation (illegitimate ruler). For a usurper, Aquinas says they can be killed by anyone since they have no right to rule. However, for a legitimate ruler turned tyrant, he argues against private individuals taking action, emphasizing public authority and due process. So, Aquinas limits private action primarily to usurpers.

  John of Salisbury in the Policraticus takes a different approach. He uses the analogy of the tyrant as a diseased limb that must be amputated. His key distinction is based on whether the killer is bound by an oath of fealty. If not bound by such an oath, any private individual can kill the tyrant. If bound, they should seek higher authority but can still act if necessary. This seems broader than Aquinas because it allows private individuals to act against both usurpers and legitimate tyrants, provided they aren't under an oath.

  Comparing the two, Salisbury's framework potentially allows more private, unilateral tyrannicide. Aquinas restricts private killing mainly to usurpers, requiring public authority for legitimate tyrants. Salisbury allows private action against both types, especially if no oath exists. His language is more permissive, even enthusiastic about tyrannicide as a public service.

  Regarding influence on early modern resistance theory, Aquinas's framework had a more significant afterlife. His emphasis on natural law, the common good, and public authority provided a structured approach that later thinkers like Suárez and Mariana expanded. The Spanish Scholastics used Aquinas to develop ideas about tyranny and resistance, influencing Calvinist and Catholic resistance theories. While Salisbury was read, his more radical stance didn't provide the same systematic foundation. His work was often referenced more for its boldness than its structure.

  The user's deeper needs might include wanting to challenge students' assumptions, showing nuances in medieval thought. They might also need to highlight how theoretical frameworks evolve and influence later periods. Ensuring the seminar discussion connects medieval theories to early modern developments would be essential, using Aquinas as a bridge.
answer: |-
  Your focus on the crucial distinctions within medieval resistance theory is precisely where graduate-level analysis should begin. Let's dissect Aquinas and John of Salisbury, moving beyond the simplistic "Scholastics = tyrannicide" trope.

  **1. The Core Distinctions and Their Functions:**

  *   **Thomas Aquinas (De Regimine Principum I.6-7; Summa Theologiae II-II, q. 42 a. 2 & q. 69 a. 4):**
      *   **Distinction:** Tyrant *ab origine* (usurper, tyrant in title) vs. Tyrant *in exercitio* (legitimately installed ruler who governs tyrannically).
      *   **Function of the Distinction:** Aquinas uses this primarily as a *limiting principle* on private action and a guide for *appropriate authority*.
          *   **Tyrant ab origine (Usurper):** Has no legitimate claim to authority. He is essentially a *public enemy* (hostis publicus). Aquinas argues that because such a ruler has no just title, **any private citizen** ("quilibet privatus homo") may licitly kill him to liberate the *res publica*. This act is framed not as murder but as removing a brigand preying on the community. The justification leans heavily on natural law self-defense extended to the community.
          *   **Tyrant in exercitio (Legitimate but Tyrannical Ruler):** Possesses legitimate authority *in se*. Removing him is far more problematic. Aquinas **emphatically rejects** private individuals taking action here. Such a ruler is still a "prince," and attacking him is sedition, which is a mortal sin (ST II-II q.42 a.2). The remedy must come from **public authority** – either the ruler's superiors (e.g., the Emperor over a king, the Pope in spiritual matters), or the community acting collectively through its leading men ("per multorum auxilium") in a manner analogous to due process. The focus is on *authorized* correction or deposition, not assassination. The distinction protects the *institution* of authority even while condemning its abuse.

  *   **John of Salisbury (Policraticus, Book III, Ch. 15 & Book VIII, Ch. 17-20):**
      *   **Distinction:** Whether the would-be killer is bound to the tyrant by an **oath of fealty**.
      *   **Function of the Distinction:** Salisbury uses this as a *qualifier* on the *agent's obligation*, not primarily on the *nature* of the tyrant or the *source* of authority. His core argument is far more sweeping: the tyrant is a public enemy, a rebel against God and justice, a "plague" or "diseased limb" that must be amputated for the health of the body politic. The *oath of fealty* introduces a complicating factor of personal obligation.
          *   **Agent NOT Bound by Fealty:** Salisbury is unequivocal: "To kill a tyrant is not merely lawful, but right and just... **whoever does not shrink from the deed may take glory in the deed performed**" (Policraticus VIII.20). No distinction is made between usurpers and legitimate-but-tyrannical rulers here. The tyrant's *actions* define him, not his origin. Any private person not personally bound by fealty is *licensed and even praised* for killing the tyrant. This is a profound public service.
          *   **Agent Bound by Fealty:** The oath creates a personal bond. Salisbury doesn't *prohibit* action by such an agent, but he urges caution. The bound individual should ideally seek authorization from a higher power (like the Church) to be released from the oath before acting. However, if this is impossible and the tyranny is extreme, Salisbury strongly implies the higher duty to God and the common good *still permits* the killing, even if it involves breaking the oath. The oath complicates but doesn't necessarily negate the license.

  **2. Licensing Private, Unilateral Tyrannicide: Salisbury's Framework is More Permissive**

  *   **Aquinas:** Only licenses *private, unilateral* action against **one specific category**: the *usurper* (tyrant *ab origine*). Against the far more common scenario of a legitimately installed ruler who becomes tyrannical (*in exercitio*), Aquinas *explicitly forbids* private action, mandating public authority. His framework severely restricts private initiative.
  *   **Salisbury:** Licenses *private, unilateral* action against **any tyrant** (defined by actions, not origin) **by any agent not personally bound to him by fealty**. Since the vast majority of subjects in a feudal monarchy would *not* have sworn a direct oath of fealty to the king (only their immediate lord might have), Salisbury's license is potentially very broad. Furthermore, even for those bound by fealty, he provides a pathway (seeking release) and suggests the act may still be justified in extremis. His language is enthusiastic and permissive regarding private tyrannicide as a righteous act.

  **Conclusion on Licensing:** John of Salisbury's framework, grounded in the tyrant's actions and the absence of a *personal* oath binding the killer, licenses significantly more private, unilateral tyrannicide than Aquinas's. Aquinas reserves such drastic action for the relatively rare case of the pure usurper, demanding public process for the far more common tyrant *in exercitio*.

  **3. Afterlife in Early Modern Resistance Theory: Aquinas's Framework Dominates**

  *   **Why Aquinas Had Greater Influence:**
      *   **Systematic Scholasticism:** Aquinas provided a rigorous, systematic framework grounded in Aristotelian political philosophy and natural law, integrated within a comprehensive theological system. This made his arguments adaptable and citable by later Scholastics facing new political realities (Reformation, Absolutism).
      *   **Focus on Authority and Due Process:** Early modern thinkers (Catholic and Protestant) grappling with resisting *legitimate* monarchs (like Catholic monarchs persecuting Protestants, or Protestant monarchs deemed tyrannical) found Aquinas's distinction and his insistence on *public authority* or *collective action* crucial. It offered a way to justify resistance without endorsing anarchic assassination.
      *   **Tyrant *in exercitio* as the Central Problem:** The pressing question post-Reformation was resisting rulers who held legitimate title but were perceived as tyrannical in religion or governance. Aquinas's framework for dealing with the tyrant *in exercitio* – emphasizing the role of inferior magistrates, estates, or the community as a whole – became the essential blueprint.
      *   **Spanish Scholastics (e.g., Suárez, Mariana, Vitoria):** They explicitly built upon Aquinas. Mariana's controversial discussion of tyrannicide (De Rege et Regis Institutione) carefully works within Aquinas's distinctions, emphasizing the tyrant *in exercitio* and the preference for public judgment while *discussing* private action as a last resort with extreme caveats. Suárez (Defensio Fidei Catholicae) elaborates extensively on the role of the community and its representatives as the source of authority that can depose a tyrant.
      *   **Calvinist Resistance Theory (e.g., Beza, Hotman, Knox, later Locke):** While differing theologically, the "lesser magistrate" theory prominent in Huguenot (Vindiciae Contra Tyrannos) and Scottish resistance thought functionally mirrors Aquinas's solution for the tyrant *in exercitio*: resistance is not a private right but an office of *publicly constituted inferior authorities* acting on behalf of the community/covenant.
      *   **Catholic League & Monarchomachs:** Both sides in French conflicts used Thomistic concepts, with Leaguers emphasizing papal authority over kings and Monarchomachs emphasizing the people's representatives.

  *   **Salisbury's Legacy:**
      *   Salisbury was certainly read and cited (e.g., by Jean Petit defending the assassination of Louis d'Orléans, or by some Monarchomachs), often for his bold assertion that tyranny justifies killing.
      *   However, his lack of systematic philosophy, his more metaphorical style, and crucially, his *unqualified* endorsement of private killing against *any* tyrant by non-fealty-bound individuals made his arguments less adaptable to the complex constitutional and theological battles of the early modern period. His framework was seen as more radical and potentially anarchic.
      *   His influence was more as a provocative reference point or for specific rhetorical flourish than as the foundational *structure* for resistance theory. The crucial distinctions and mechanisms for justifying resistance against *legitimate* rulers came overwhelmingly from the Thomistic tradition.

  **Justification:** Aquinas's structured approach, separating the problem of usurpation from the abuse of legitimate power and providing a mechanism (public authority/community action) for dealing with the latter, proved indispensable. Early modern theorists needed to justify resistance *within* a framework of legitimate authority, not just against obvious usurpers. Salisbury's focus on the agent's oath and his sweeping license for private action against any tyrant was too blunt and potentially destabilizing an instrument for the delicate task of building coherent resistance theories against divinely ordained or constitutionally legitimate monarchs. The Thomistic framework, with its inherent limitations and emphasis on due process and public authority, provided the necessary intellectual scaffolding that dominated early modern resistance discourse. Salisbury offered a powerful cry; Aquinas offered the blueprint.
