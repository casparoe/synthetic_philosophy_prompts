  The challenge is making hyperplans accessible without oversimplifying. I'll use "planning what to do across possibilities" as shorthand, with the inference example showing how consistency constraints mimic modus ponens. Morgan's hybrid counter should emphasize how truth-conditions simplify logic but risk losing pure expressivism's anti-realism.

  Throughout, I'll watch for false equivalency - both views get real objections. Alex must genuinely sweat when Morgan asks why we need two logics. Morgan should flinch when accused of abandoning expressivism's core. The user wants intellectual bloodsport, not pedagogy.
answer: |-
  ## The Attic Debate: Frege-Geach Among Friends
  *(ALEX, a pure expressivist, leans forward intently. MORGAN, a hybrid expressivist, gestures with a worn copy of Gibbard)*

  **Alex:** ...so you see, Morgan, that’s why Blackburn’s attitude logic *works*. "Lying is wrong" expresses **Boo! Lying!**. "If lying is wrong, then getting your kid brother to lie is wrong" expresses **Boo! Lying!** → **Boo! Getting-kid-brother-to-lie!**. Committing to both *just is* committing to **Boo! Getting-kid-brother-to-lie!**. Validity is consistency in your practical stances – no truth needed!

  **Morgan:** Hold on, Alex. Your ‘attitude logic’ feels like a clever *simulation* of logic, not the real thing. Take the inference: "Lying is wrong. If lying is wrong, then getting your kid brother to lie is wrong. Therefore, getting your kid brother to lie is wrong." In *ordinary* logic, it’s modus ponens: P, P→Q, therefore Q. Truth-preserving. Simple. But on your pure expressivism? You’ve got **Boo! Lying!**, and this complex conditional attitude **Boo! Lying!** → **Boo! Getting-kid-brother-to-lie!**. How does accepting those *force* me to accept **Boo! Getting-kid-brother-to-lie!**? What’s the *inconsistency* if I somehow hold the first two but balk at the third? Your "logic of attitudes" feels ad hoc – you’re *defining* inconsistency precisely to mimic truth-preservation!

  **Alex:** It’s not ad hoc! Think Gibbard’s hyperplans. A hyperplan is a complete contingency plan for what to do in any conceivable situation. Saying "Lying is wrong" expresses acceptance of hyperplans that rule out lying *in the relevant circumstances*. The conditional expresses acceptance of hyperplans that rule out *combining* acceptance of plans that rule out lying *with non-acceptance* of plans that rule out getting your kid brother to lie. If you accept *both* the premise and the conditional, your hyperplan *must* rule out getting your kid brother to lie. To reject the conclusion while accepting the premises is to endorse an *incoherent* plan – a plan that simultaneously demands one thing and forbids demanding that thing! That’s the practical inconsistency!

  **Morgan:** But ‘incoherent plan’ just *means* ‘a plan that would lead to contradictory actions if followed’! You’re smuggling in a *norm* of rationality – avoiding practical contradiction – that looks suspiciously like a *truth*-based norm! Why *should* I avoid that incoherence? Because it’s… *irrational*? And what makes *that* judgment? More attitudes? It feels like a regress. Ordinary logic doesn’t need this. If P and P→Q are *true*, Q *must* be true. Full stop. No appeal to plans or avoiding practical messes. My hybrid view gives moral sentences *real*, minimal truth-conditions *plus* the expressive attitude. "Lying is wrong" is true iff lying has the property of wrongness (minimal truth), *and* expresses disapproval. The conditional has straightforward truth-conditional content. Modus ponens applies directly. The logic is just the standard one we use everywhere else. Clean. No special pleading about hyperplan coherence.

  **Alex:** *(Leans back, skeptical)* Clean? Or a capitulation? You’re basically saying moral claims *are* truth-apt descriptions! You’ve grafted a tiny cognitivist homunculus onto your expressivism to do the logical heavy lifting. "Lying has the property of wrongness"? What *is* that property, Morgan? What facts make *that* true? You wanted to avoid moral facts! Now you’ve got them sneaking back in through the truth-conditional side door. The "minimal" truth is doing *all* the work in the logic, and your "expression" is just decorative! You haven’t *solved* Frege-Geach for expressivism; you’ve *abandoned* pure expressivism. You’re a cognitivist who happens to think moral judgments *also* express attitudes.

  **Morgan:** That’s unfair! The truth-conditions are minimal, supervenient, naturalistic – fixed by the very attitudes you care about! "Lying is wrong" is true *because* we (or ideally rational agents) disapprove of it. The truth *is* attitude-dependent! But crucially, once the sentence *has* that truth-condition, logic operates on *that* dimension. The attitude expression is primary metaphysically, but the truth-condition provides the logical hook. It explains *why* the inference feels compelling and inescapable in a way pure attitude consistency struggles with – because truth-preservation *is* inescapable. Your hyperplan coherence *mimics* it, but it feels like a parallel system. Why have two logics?

  **Alex:** Because the *point* is that morality *isn't* about describing a realm of facts! It’s about planning, guiding, commending! Reducing logic to truth-preservation for moral claims *presupposes* they describe, which is the very thing expressivism denies! My system explains validity purely in terms of the *functional role* of moral language in practical reasoning. Accepting "Lying is wrong" *is* adopting a plan component. Accepting the conditional *is* adopting a constraint on how plan components fit together. The conclusion *is* the necessary output of that constraint. The ‘feel’ of inescapability comes from the practical necessity of coherent planning – which is the *essence* of normativity! *That’s* the expressivist insight you’re diluting!

  **Morgan:** But Alex, doesn’t your ‘practical necessity’ *itself* need explaining? Why *must* I be practically coherent? Isn’t *that* just another normative claim? "You ought to avoid inconsistent hyperplans"? And how do *you* express *that*? With another hyperplan constraint? It starts to look circular. The hybrid view breaks the circle by grounding the logic in the representational dimension we already have for non-moral discourse. The attitude does the metaethical work; the truth-condition does the logical work. It’s a division of labor, not a surrender.

  **Alex:** *(Sighs)* It’s a division that gives the cognitivist half the kingdom. You think the truth-condition is minimal and harmless, but it *fundamentally changes the nature* of the moral claim. It makes it a description *of* attitudes or their objects, which is a far cry from the pure expression of the attitude *itself*. Gibbard’s hyperplans *are* the account of practical necessity – they model what it *is* to be fully committed. The ‘ought’ is built into the model of full agency. Your hybrid view... *(shakes head)*... it feels like you saw the cliff edge of Frege-Geach and jumped into the cognitivist safety net instead of building the expressivist bridge. The bridge might be intricate, Morgan, but it gets us across without landing in descriptivist territory.

  **Morgan:** And your bridge, Alex, feels like it’s made of theoretical smoke and mirrors designed *only* to avoid landing in descriptivism, even if it means reinventing logic in a less intuitive way. Maybe the safety net was necessary. Maybe pure expressivism *can’t* fully capture the logical structure without borrowing the clothes of truth. We agree on the core – attitudes are primary. But on logic... *(spreads hands)*... I think we’re at an impasse. Pass the tea?

  **Alex:** *(Manages a wry smile)* Fine. Pass the tea. But I still think you’re letting the cognitivist wolf in wearing expressivist sheep's clothing. That minimal truth-condition is the wolf’s nose under the tent flap.

  **Morgan:** And I think you’re trying to build a tent entirely out of flaps. Cheers. *(Raises teacup.)*

  **Alex:** *(Raises cup reluctantly)* ...Cheers. To unresolved problems.
