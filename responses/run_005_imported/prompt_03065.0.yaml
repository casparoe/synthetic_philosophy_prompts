  My reasoning:

  - **Probabilism (Joyce 1998, and others)**: This is the foundational result. The argument uses dominance (or strict propriety of scoring rules) to show that non-probabilistic credences are dominated by probabilistic ones. It's considered very strong and has been refined (e.g., by Predd et al. 2009). I think it's S-tier.

  - **Conditionalization (Greaves & Wallace 2006)**: They show that conditionalizing on the evidence minimizes expected inaccuracy (by the lights of your prior) compared to any other updating rule. The argument is compelling and uses a decision-theoretic approach (maximizing expected utility). It's a classic and strong result. I'd put it in S or A. However, note that it requires that the updating rule be a function from evidence to credences and that the scoring rule be strictly proper. I think it's S-tier.

  - **Principal Principle (Pettigrew 2012, 2013)**: The argument shows that if your credences don't match the known chances (and satisfy some probabilistic constraints), then they are dominated. The argument is similar in structure to the one for probabilism and uses the idea that chances are themselves a kind of expert. It's generally considered rigorous. I'd put it in A or S. But note: there are some debates about how to formulate the principle (e.g., with admissibility conditions). Still, the epistemic utility argument is strong. Let's say A-tier.

  - **Principle of Indifference**: The argument for this is often via minimax (worst-case) reasoning. It shows that the uniform distribution minimizes the worst-case inaccuracy. However, this is a different decision rule (minimax instead of dominance or expected utility). Also, the principle of indifference is controversial because it seems to depend on the choice of partition. The argument doesn't have the same force as the dominance arguments and is more sensitive to the parameterization. I'd put it in B or C. Let's say B-tier because it works in the symmetric case, but it's not as universally accepted.

  - **Reflection Principle**: The argument (by Briggs, 2009, and others) tries to show that violating reflection makes you vulnerable to a kind of Dutch book or dominance. However, the principle has been criticized (e.g., by Christensen) because it can lead to irrationality if you expect to lose information or be irrational in the future. The epistemic utility argument for it is less straightforward and might be seen as question-begging because it assumes that your future self is an expert. I'd put it in C-tier.

  - **Lockean Thesis**: Dorst and Easwaran have worked on this. The Lockean thesis says that belief is credence above a threshold. The epistemic utility arguments for it typically involve trade-offs between the accuracy of beliefs and the coherence of the belief set. However, these arguments often require specific scoring rules and thresholds, and the results are sensitive to the choice of the threshold. Moreover, the argument doesn't seem as compelling as the others because it's trying to bridge two different kinds of doxastic states. It might be in B or C. I think it's C-tier because it feels more like a pragmatic argument and less about pure accuracy.

