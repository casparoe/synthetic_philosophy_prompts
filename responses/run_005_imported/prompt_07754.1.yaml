answer: |-
  Your editor's "Newton's alchemy" framing is understandable shorthand, but it significantly flattens Sidgwick's psychical research and misses its profound connection to his core philosophical project. Sidgwick wasn't dabbling in a quirky hobby; he was pursuing what he saw as a *necessary extension* of his ethical and epistemological work, driven by a deep existential crisis of the Victorian age. Here's why a more nuanced approach is richer:

  1.  **The "Cosmic Shipwreck" and the Foundation of Ethics:**
      *   Sidgwick's ethical masterpiece, *The Methods of Ethics*, meticulously argued for utilitarianism on *rational* grounds, deliberately avoiding reliance on religious dogma or intuitionism he found unstable.
      *   However, this rigorous rationalism led him to a devastating personal conclusion: he could find no rational proof for the existence of God, personal immortality, or a moral order in the universe beyond the calculable consequences of actions *in this life*. He famously described losing his Christian faith as a "cosmic shipwreck."
      *   This created a profound problem: **If there is no afterlife or ultimate justice, why be moral, especially when it demands extreme self-sacrifice?** Utilitarianism could justify sacrifice for the greater good *if* the sacrifice truly led to greater happiness, but the *finality* of death made extreme sacrifices seem ultimately pointless or irrational from a purely this-worldly perspective. His ethics felt existentially unstable without *some* evidence of transcendence.

  2.  **Psychical Research as the Empirical Quest for a Moral Foundation:**
      *   Sidgwick saw psychical research (telepathy, survival after death) **not as supernatural whimsy, but as a potential source of *empirical evidence* for the existence of the soul and an afterlife.** This wasn't about table-rapping for fun; it was a desperate, rigorous search for data that could ground the moral order his ethics demanded but couldn't rationally prove.
      *   He co-founded the SPR explicitly to apply the most stringent scientific methods to phenomena that *might* provide this evidence. As its first President, he set the tone: meticulous investigation, skepticism towards fraud, and a relentless demand for evidence. This *was* his philosophical rigor applied to a new domain.
      *   **The goal was existential and ethical:** If survival could be empirically proven, it would provide the "sanction" (justification/reason) for morality that pure reason couldn't furnish. It would validate the ultimate significance of ethical striving. As he wrote: "I may say that the *main* object of my life for the last... five-and-twenty years has been to bring about a distinct proof of this [survival]."

  3.  **Continuity of Method: Rigor Applied to the "Fringe":**
      *   Sidgwick approached psychical research with the same painstaking care, intellectual honesty, and demand for evidence that characterized *The Methods of Ethics*.
      *   His famous admission of *failure* ("never landed on solid proof") is itself a testament to this rigor. He didn't become a credulous believer; he remained the skeptical philosopher demanding irrefutable evidence that never quite materialized to *his* satisfaction. This is not the behavior of someone indulging an irrational hobby; it's the behavior of a rigorous investigator committed to following the evidence where it leads, even into uncomfortable territory.

  4.  **The Victorian Context: Crisis of Faith and the Rise of Science:**
      *   Sidgwick was far from alone. His colleagues in the SPR's "Cambridge group" (Frederic Myers, Edmund Gurney, later William James) were similarly brilliant minds grappling with the collapse of traditional religious certainties under the weight of Darwinism, biblical criticism, and scientific materialism.
      *   Psychical research was, for them, a serious attempt to use the *tools* of the new scientific worldview (empiricism, investigation) to potentially *answer* the existential questions that worldview had seemingly demolished. It was an attempt to find "scientific" grounds for hope and meaning.

  **A Better Throughline Than "Quirky Footnote":**

  The compelling story isn't "great ethicist had a weird ghost phase." It's:

  > **How a brilliant philosopher, having rationally dismantled the religious foundations of morality, desperately sought a new, *empirical* foundation for ethical meaning in the face of a potentially meaningless universe, applying his formidable intellectual rigor to the most challenging and elusive phenomena imaginable – and ultimately had to confront the profound ambiguity of the results.**

  **Why the "Newton's Alchemy" Frame Falls Short:**

  1.  **Motivation:** Newton's alchemy was likely driven by theological/mystical interests *alongside* his physics. Sidgwick's psychical research was driven *directly* by the core problem his ethics exposed.
  2.  **Integration:** Newton kept his alchemy largely separate from his *Principia*. Sidgwick saw psychical research as *integral* to resolving the fundamental instability of his ethical system.
  3.  **Method:** Newton's alchemy was pre-scientific method. Sidgwick applied the nascent scientific method of his time (empirical investigation, skepticism, evidence-based reasoning) directly to psychical phenomena.
  4.  **Impact:** Newton's alchemy didn't fundamentally challenge the foundations of his physics. Sidgwick's psychical research *was* his attempt to shore up the existential foundations of his ethics.

  **Recommendation for Your Piece:**

  *   **Lead with the "Cosmic Shipwreck":** Frame Sidgwick's psychical research through his ethical crisis and the search for a "sanction" for morality. This provides the essential context.
  *   **Emphasize the Rigor:** Highlight how the SPR's founding principles (skepticism, methodical investigation) were a direct extension of Sidgwick's philosophical temperament, *not* a departure from it.
  *   **Highlight the Existential Stakes:** For Sidgwick and his peers, this wasn't trivial. It was about finding meaning and justification for ethical life in a post-theistic world.
  *   **Acknowledge the Failure, But Note Its Significance:** His ultimate lack of conclusive proof is crucial. It underscores his integrity and leaves us with the profound ambiguity he faced: ethics without ultimate metaphysical guarantees. This is a very modern predicament.
  *   **Avoid the "Two Sidgwicks" Trap:** Don't present the ethicist and the psychical researcher as separate personas. Show how the latter was a direct, albeit ultimately unresolved, consequence of the former.

  Sidgwick's psychical research wasn't his "alchemy"; it was his heroic, rigorous, and ultimately tragic attempt to empirically salvage the foundation for the ethical life he so brilliantly described. That's a far more interesting and historically accurate story than relegating it to a footnote.
