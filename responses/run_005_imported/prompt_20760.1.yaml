prompt: |-
  okay so I've been deep in Berkeley for my directed reading and noticed something that I don't think gets talked about enough. In the Querist he keeps hammering on the idea that money isn't valuable in itself -- its just a 'ticket' or counter that only has power because of the whole system of exchange its embedded in, which is basically the anti-bullionist backbone of the whole text. But that's suspiciously similar to the move he makes decades earlier in the New Theory of Vision (and again in Alciphron IV): visual ideas are arbitrary signs for tactile ideas, meaningful only because God set up a language-like connection between them rather than any resemblance or necessary link. Compare these two 'sign' theories -- is Berkeley's account of money basically just his semiotic idealism exported into economics, or is there an important disanalogy between a divinely instituted sign-system and a humanly instituted one like currency? Actually commit to an answer, dont just hedge with 'it's complicated.'
