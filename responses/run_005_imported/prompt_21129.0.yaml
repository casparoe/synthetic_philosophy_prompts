  ### Justifications:
  1. **Mara's averaging proposal (+2)**:  
     *Correct application of conciliationism*. Given symmetric initial reliability and no asymmetry in evidence/method, splitting the difference is epistemically rational. Rejecting this requires demonstrating asymmetry (which Theo later attempts).

  2. **Theo's expertise claim (+1)**:  
     *Plausible but incomplete*. Asserting domain-specific calibration *could* break peer symmetry, making steadfastness rational. However, he merely *declares* it without evidence of its relevance/magnitude. Deserves mild credit for identifying a potential asymmetry.

  3. **Mara's objection to self-assertion (+2)**:  
     *Strong epistemic point*. Expertise claims without evidence *are* dialectically cheap and risk making disagreement resolution impossible. This highlights the "arbitrariness problem" in steadfastness.

  4. **Theo's appeal to checkable facts (+2)**:  
     *Crucial distinction*. Job history is an *objective, third-party-verifiable credential* (unlike vague claims of intelligence). This transforms his stance from mere assertion to a defeasible reason for asymmetry, making steadfastness potentially reasonable.

  5. **Mara's revelation of symmetric credentials (+2)**:  
     *Masterful restoration of peer symmetry*. By matching Theo's "checkable" evidence, she neutralizes his proposed asymmetry. Conciliationism (averaging) becomes compelling again absent further differentiation.

  6. **Theo's meta-disagreement move (-1)**:  
     *Weak deflection*. While true that conciliationism isn't universally accepted (e.g., Kelly's "total evidence" view), invoking this *after* symmetry is restored is epistemically unhelpful. It exploits meta-uncertainty to avoid conceding despite losing his asymmetry claim.

  ### Better Unmade Move:
  **The Optimal Play**: Theo should have **immediately quantified his calibration evidence** when first claiming expertise (e.g., *"I order 500 gallons/month for my restaurant, and this bar is 3x the size"*). Mara could then have done the same. This transforms the dispute from abstract credential-comparing to **concrete evidence-sharing**, resolving the asymmetry question empirically. Instead, both treated credentials as binary (present/absent) rather than gradable, leading to stalemate.

  ### Key Epistemic Takeaways:
  - **Peerhood is dynamic**: Credentials can break symmetry, but they must be *specific* and *comparable*.  
  - **Steadfastness requires burden of proof**: Claiming expertise obligates evidence; mere assertion is dialectically invalid.  
  - **Conciliationism dominates under symmetry**: When no defensible asymmetry exists, averaging is the uniquely rational compromise.  
  - **Real-world disagreements need evidence conduits**: Philosophical norms collapse without mechanisms to test expertise claims (e.g., quick data-sharing).  

  Theo's move 4 was his strongest (introducing verifiable asymmetry), but Mara's move 5 decisively restored symmetry. Theo's move 6 was a retreat into meta-justification after losing the object-level argument. The core failure was both not leveraging their *actual evidence* during the dispute.
