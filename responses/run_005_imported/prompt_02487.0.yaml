  I recall Turing's actual concerns: telepathy letting humans "cheat" by reading the machine's mind, and psychokinesis tampering with random number generators. His proposed "telepathy-proof room" solution feels tragically earnest. That's my entry point - a scientist who builds such a room only to face deeper existential cracks.

  For protagonist, someone like Turing himself but more brittle - maybe a postwar researcher drowning in institutional skepticism. Setting it in 1950s Britain feels right, all fog and rationing and latent paranoia. The National Physical Laboratory where Turing worked could be a perfect pressure cooker. 

  Key beats: 
