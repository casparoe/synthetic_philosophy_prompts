  **Reasoning:**

  1.  **Thought Theory (Lamarque & Carroll):** Most plausible. It aligns best with cognitive psychology – emotions *are* routinely triggered by thoughts, propositions, mental images, or memories, not just existentially believed-in states of affairs (e.g., feeling anxious imagining a future job interview). This explains the immediacy and reality of the emotion without needing belief or complex simulation frameworks. It directly resolves the paradox by decoupling emotion from existential belief.
  2.  **Simulation Theory (Currie):** Highly plausible runner-up. It leverages our well-documented capacity for mental simulation (theory of mind) to explain deep engagement. It accounts for the *process* of engagement and why fiction feels immersive and perspective-taking, but adds a layer of cognitive machinery not strictly *necessary* for the basic emotional response (which thought theory covers more parsimoniously).
  3.  **Make-Believe Theory (Walton):** Plausible but problematic. It captures the *intentional* and *game-like* aspect of engaging with fiction. However, its core claim that the emotions themselves are "quasi" (lacking the full motivational component) is counter-intuitive to the felt intensity and physiological reality of emotional responses to powerful fiction. It risks downplaying the genuineness of the experience.
  4.  **Illusion Theory:** Less plausible. While deep absorption *can* create a sense of presence, most readers retain a fundamental awareness of fiction ("suspension of disbelief" isn't actual belief). Neuroscience and phenomenology suggest we process fictional events differently than real ones, making "fleeting belief" an inaccurate description of the typical state. Absorption is better explained by simulation or intense focus on thoughts.
  5.  **Irrationalist Diagnosis (Radford):** Least plausible. It dismisses a profound and nearly universal human experience as simply incoherent. Empirical evidence from psychology and neuroscience shows the emotional responses are neurologically real and utilize the same pathways as responses to real events triggered by thought. Declaring them irrational ignores how cognition and emotion actually function.
