  First, I need to recall Hobbes's distinction. He says demonstrable sciences are those where the artist constructs the subject, thus knowing the causes. Geometry is demonstrable because we draw the figures; civil philosophy because we create the commonwealth. Natural philosophy isn't because we don't construct natural bodies.

  The user's concern is that Hobbes's premises in civil philosophy—human passions, equality, etc.—seem based on observation, not construction. So, how is civil philosophy demonstrable if its foundations aren't constructed like geometric axioms?

  Hobbes might argue that while the raw materials (human nature) are observed, the commonwealth itself is an artificial construction. So, the causes (the covenant) are human-made. In geometry, we also start with definitions (like points), which are stipulated. Similarly, in civil philosophy, the social contract is a stipulated construct. The deduction of consequences from the covenant is what makes it demonstrable.

  But the user points out that the premises about human behavior are empirical. Here, Hobbes might say these are not the causes but the materials. The real cause is the covenant, which is constructed. So, the deduction starts from the covenant, not the empirical observations. The observations provide the "principles of motion," but the science proper begins with the artificial creation.

  Does this hold? The user might be right that there's an equivocation in "making." In geometry, making is stipulative; in civil philosophy, it's institutional. But Hobbes could counter that both involve creating definitions/agreements that didn't exist before. The epistemic certainty comes from deducing from these constructs.

  The user's deeper need might be to understand if Hobbes's argument is consistent or if it's a rhetorical move against Wallis. They might want to discuss in their seminar whether Hobbes's political science truly achieves geometric certainty or if it's aspirational. Also, considering the context of his dispute with Wallis, where Hobbes defends his geometric method against criticisms, might add layers. They might need a balanced analysis showing both strengths (logical deduction from constructs) and weaknesses (empirical foundations) to facilitate seminar discussion.
answer: |-
  Your reading captures the central tension in Hobbes's argument. The passage *does* present a powerful analogy between geometry and civil philosophy, but the status of the foundational premises in civil philosophy threatens to undermine its claimed demonstrability. Here's a reconstruction of Hobbes's intended argument, an assessment of its validity, and the core issue of "making":

  **Hobbes's Argument Reconstructed:**

  1.  **The Criterion for Demonstrability:** A science is demonstrable *if and only if* the investigator has complete knowledge of the causes, generation, and construction of its subject matter *because* they themselves are the author/creator of that subject matter.
  2.  **Geometry as Paradigm:** The geometer stipulates definitions (point, line, circle) and *constructs* figures according to these definitions using rules (compass, straightedge). The properties deduced flow necessarily from these initial acts of construction and definition. The causes (the definitions and construction rules) are known with certainty because they are the geometer's own creations.
  3.  **Civil Philosophy as Analogous:** Humans *create* the commonwealth through a deliberate act: the covenant. This covenant is an artificial construct, a product of human will and reason, establishing sovereign power and subjects. The causes of the commonwealth (the covenant, the rights transferred, the purpose of security) are therefore known to the political philosopher *because they are human inventions*. We understand its generation and construction *exactly* because we built it.
  4.  **Natural Philosophy as Contrast:** Natural bodies (rocks, trees, stars) are *not* constructed by humans. We observe their effects (motion, sensation) but have no direct access to their true, internal causes or generation. We can only hypothesize about their causes based on observed effects ("seek it from the effects"). Hence, physics yields only hypothetical knowledge ("what they may be"), not demonstration ("what they be").
  5.  **Conclusion:** Therefore, civil philosophy, like geometry, is demonstrable. We deduce the necessary consequences (rights of the sovereign, duties of subjects, nature of law, conditions of peace) from the known causes (the constructed covenant and its purpose).

  **How Hobbes *Intends* to Keep Civil Philosophy Demonstrable:**

  1.  **Distinguishing Foundational Material vs. Constructed Cause:** Hobbes acknowledges that civil philosophy *starts from* observations about human nature (passions, equality, competitiveness). However, he argues these are *not the causes of the commonwealth itself*; they are the raw material or the *reasons why* the construction (the covenant) is necessary and possible. They are "principles of motion" in the state of nature, analogous to the axioms or definitions in geometry that describe fundamental properties but are not themselves constructed *figures*.
  2.  **The Sovereign Act of Construction:** The *crucial, defining cause* is the artificial act of covenanting itself. *This* is the "construction" analogous to the geometer's drawing. It is a deliberate, stipulative act of creation: "I authorize this man or assembly..." This act is *not* merely observed; it is *instituted* by human reason and agreement. We *make* the sovereign power and the relationship of subjection.
  3.  **Deduction from the Constructed Cause:** Once the covenant is established *as a construct*, its properties and the rights/duties flowing from it *can* be deduced with geometric certainty. *If* men covenant to erect a sovereign with absolute power for the sake of peace, *then* the sovereign must have power X, Y, Z, and subjects have duties A, B, C. This deduction flows from the logic of the constructed artifact itself, just as the properties of a circle flow from its definition and construction.
  4.  **"Making" as Political Institution:** Hobbes trades on the dual meaning of "make" but argues it's coherent in this context. We "make" the commonwealth not in the sense of physically creating human beings or their passions, but in the sense of *instituting* a specific artificial *relationship* (sovereign/subject) and *authority structure* through the covenant. This institutional creation is the relevant "making" for the science.

  **Does the Argument Succeed? Assessing Your Concerns:**

  *   **The Strength of the Analogy:** The core analogy *is* powerful. Both geometry and the Hobbesian commonwealth begin with definitions/stipulations (points/lines; state of nature/natural right) and proceed via constructive acts (drawing figures; covenanting) whose logical consequences can be rigorously deduced. The certainty in both cases stems from the human origin of the defining constructs.
  *   **The Achilles' Heel: The Empirical Premises:** This is where your skepticism is most potent, and where the argument is arguably weakest:
      *   **Status of the Foundational Premises:** Claims about natural equality, the passions (especially competitive glory), the "perpetual and restless desire of power after power," and the resulting state of war *are* presented by Hobbes as empirical generalizations, derived from introspection and observation of human behavior. He treats them as *factual* starting points.
      *   **Epistemic Status:** If these foundational premises about human nature are merely probable or hypothetical (like the causes sought in physics), then the *entire edifice* of civil philosophy rests on a non-demonstrative base. The deduction *from* the covenant might be logically sound, but the *necessity* of entering the covenant, and the *specific form* it must take (absolute sovereignty), depends entirely on the accuracy and universality of these empirical claims about the state of nature. If these claims are only "what may be," then civil philosophy is ultimately hypothetical too.
      *   **Hobbes's Defense (and its Limits):** Hobbes would likely argue that the foundational premises are so obvious from introspection and basic observation ("known to all by experience") that they approach the certainty of geometric axioms. He might claim they are not "causes to be sought" but rather *givens* upon which the constructive act is based, much like the basic properties of space are givens for geometry. However, this is debatable. Critics (like you) can rightly point out that the universality and extremity of Hobbes's state of nature description *are* contested and based on interpretation of complex phenomena, making them fundamentally different from the stipulated definitions of geometry. The "making" of the covenant depends on premises whose epistemic status is closer to physics than to geometry.
  *   **"Making" and the Equivocation Risk:** There *is* a potential equivocation. Geometric "making" is pure stipulation and ideal construction. Commonwealth "making" involves institutionalizing relationships based on complex, empirically-grounded claims about real human psychology and behavior. While the *logic of the institutional structure* might be demonstrable *given* the premises, the *truth and necessity of the premises themselves* are not secured by the act of political construction in the same way geometric definitions are secured by the geometer's stipulation.

  **Conclusion:**

  1.  **How the Argument is Meant to Work:** Hobbes rigorously applies his criterion. Civil philosophy is demonstrable *because* its central object – the sovereign authority and the relationship of subjection – is an artificial creation (the covenant) whose causes (the act of authorization, its purpose) are known with certainty *because* they are human inventions. Deduction proceeds from this constructed cause.
  2.  **Does it Succeed?** The argument succeeds brilliantly *within the formal logic of the system defined by the foundational premises*. If you grant Hobbes his starting assumptions about human nature and the state of war, the deduction of the necessity and properties of the Leviathan is compelling and quasi-geometric.
  3.  **The Critical Failure:** However, the argument **ultimately fails** to secure the *epistemically privileged, non-hypothetical status* for civil philosophy that geometry enjoys **precisely because of the empirical and contestable nature of its foundational premises**. While the *covenant itself* is a constructed artifact, the *necessity for it and its specific form* depend on empirical claims about human behavior that are not themselves products of stipulative construction but of observation and interpretation. These claims function like the hypothetical causes in physics – they explain the effects (conflict) and necessitate the solution (covenant), but their certainty is not of the same order as geometric definitions. Therefore, civil philosophy, as Hobbes practices it, unavoidably contains a significant hypothetical element at its base, sliding it closer to physics than he admits in this passage. The equivocation in "making" (stipulation vs. institutionalization based on empirical necessity) is the crux of the problem. Hobbes's attempt to make politics as certain as geometry is a powerful aspiration, but it stumbles on the rock of human nature's empirical complexity.

  **For your seminar:** This tension is incredibly fruitful. Focus the discussion on the nature of Hobbes's "principles" (Are they axioms or empirical generalizations?), the precise meaning of "construction" in the political realm, and whether the empirical base *necessarily* undermines the claim to geometric demonstration, or if Hobbes offers a unique blend of empirical foundation and rational deduction that still merits the label "science," albeit not pure geometry. The context of the Wallis dispute is crucial – Hobbes is defending the *method* of rational construction against mathematical opponents, pushing the analogy perhaps further than it can strictly go to defend his broader philosophical project.
