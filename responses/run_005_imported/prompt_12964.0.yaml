  Regarding consistency with Republic's anti-drunkenness stance, context matters. Guardians need perfect self-control; ordinary citizens don't. Laws is more pragmatic about human frailty. The shift from ideal theory to practical legislation explains the difference - like how geological models adjust for real-world erosion. 

  The user might also appreciate knowing Aristotle later developed similar ideas about controlled exposure in Nicomachean Ethics. And modern parallels exist - think of firefighters training in smoke-filled buildings. But I'll keep focus on Plato unless asked.

