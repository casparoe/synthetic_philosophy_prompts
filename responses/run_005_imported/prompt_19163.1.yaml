  ## The Stain on the Concept-Script: Frege's Diary and the Shadow Over His Philosophy

  The discovery of Gottlob Frege's 1924 diary is a wound to the history of analytic philosophy. Encountering the virulent antisemitism, contempt for democracy, and authoritarian nationalism espoused by the man who laid the very foundations of modern logic and semantics is profoundly unsettling, as Michael Dummett's reaction attests. While Heidegger's Nazism was entangled with his public life and philosophical project, Frege's diary feels like a grotesque secret, seemingly disconnected from his technical masterpieces. The "no bearing" view is powerful and tempting: the diary is a deplorable biographical fact about a flawed individual, irrelevant to the validity of his arguments about quantification, sense/reference, or the definition of number. His logical and semantic work, proponents argue, operates in a pristine, formal realm; its soundness depends solely on its internal coherence and its ability to account for the phenomena of logic and language, not on the private prejudices of its creator. The concept-script functions regardless of who devised it. To reject Frege's logic because of his antisemitism would be a genetic fallacy, confusing the origin of an idea with its validity. Furthermore, since the diary's content finds no echo in his technical writings and Frege was never a public political actor, it appears truly causally disconnected. On this view, we can and must separate the brilliant logician from the reprehensible bigot.

  **This "no bearing" argument is compelling but ultimately incomplete.** While it successfully defends the *formal soundness* of Frege's core logical and semantic innovations (point a), it fails to adequately address the implications for the *interpretation of his wider philosophical outlook* (point b) and the *disciplinary narrative* (point c). The diary is not merely irrelevant noise; it resonates disturbingly with the *temperament* and *metaphysical commitments* underlying his philosophy, demanding a more nuanced reckoning.

  **(a) Soundness of Logical and Semantic Work: The Fortress Stands (Mostly)**
  On the narrow question of formal soundness, the "no bearing" view largely prevails. The validity of Frege's quantificational logic, the insights of the sense/reference distinction (especially concerning identity statements and propositional attitudes), and his definition of number in terms of extensions of concepts are achievements whose truth or utility is independent of his political views. The concept-script is a tool for expressing thoughts precisely; its syntactic rules and semantic interpretations function based on their design, not the designer's prejudices. Finding an error in *Grundgesetze* requires a logical or mathematical refutation, not a reference to the diary. His arguments for anti-psychologism – the insistence that logic concerns objective, mind-independent "thoughts" (Gedanken) in a "third realm" – stand or fall based on their ability to explain the necessity and universality of logical laws, not on Frege's personal intolerance. **Therefore, the diary does not invalidate Frege's core logical and semantic contributions.** We can and do use his formal systems without endorsing his antisemitism.

  **(b) Interpretation of the Wider Philosophical Outlook: The Unsettling Resonance**
  Where the "no bearing" view falters is in assessing Frege's *broader philosophical temperament and the potential motivations or implications* of his core commitments. The diary doesn't contradict his technical work; instead, it casts a revealing, harsh light on the *intellectual character* that produced it. Consider the key pillars of Frege's outlook:

  1.  **Militant Anti-Psychologism & Objectivity:** Frege railed against psychologism – the reduction of logic to mental processes – as a corruption leading to relativism and subjectivism. Logic, for him, was absolute, timeless, and objective, inhabiting a "third realm" distinct from the subjective mental (first realm) and the physical (second realm). This insistence on a realm of pure, untainted objectivity is philosophically defensible. However, the diary reveals a mind deeply allergic to *pluralism* and *negotiation* – hallmarks of the messy, subjective, psychological world of democratic politics he despised. His desire for logical purity finds a disturbing parallel in his desire for political and ethnic "purity." The same temperament that sought to banish the subjective and psychological from logic recoiled from the subjective and psychological complexities of democratic deliberation and cultural diversity.
  2.  **Contempt for Relativism/Pluralism:** Frege's absolutism about truth and logic is central to his philosophy. The diary shows this absolutism extending virulently into the political sphere. His rejection of parliamentary democracy wasn't merely practical; it stemmed from a belief that truth and right governance were singular and objective, not subject to debate or compromise – much like logical truths. His authoritarian nationalism posited a singular, objectively correct German identity and destiny, mirroring his belief in a singular, objective logical structure. The intolerance expressed towards Jews – demanding their exclusion or expulsion – reflects an absolutist mindset unable to tolerate difference or alternative perspectives, echoing his impatience with philosophical viewpoints he deemed relativistic or psychologistic.
  3.  **The "Third Realm" and Authority:** The "third realm" is a realm of authority – logical thoughts command assent regardless of individual belief. This resonates uncomfortably with the diary's yearning for a political authority that commands obedience, bypassing the perceived chaos of democratic debate (the messy "first realm" of individual psychology and opinion). The desire for submission to an objective logical order finds its dark counterpart in the desire for submission to an authoritarian political order.

  **This is not to claim that anti-psychologism *logically entails* antisemitism or authoritarianism.** It does not. However, the diary suggests that the *same intellectual disposition* – characterized by an intense craving for absolute, impersonal objectivity, a profound intolerance for ambiguity, plurality, and subjective mediation, and a belief in singular, authoritative truths – manifested in both his groundbreaking philosophy and his abhorrent politics. The diary compels us to see Frege's philosophical commitments not as existing in a vacuum, but as expressions of a particular, and deeply problematic, cast of mind. It forces a reinterpretation of his "impersonal" objectivity as potentially carrying an implicit authoritarian chill, and his rejection of the psychological as potentially reflecting a dehumanizing disregard for lived experience and difference.

  **(c) The Disciplinary Narrative: Confronting the Flawed Foundation**
  The diary fundamentally disrupts the clean, heroic narrative of analytic philosophy's founding. The discipline has often portrayed itself as emerging from a pure pursuit of logical truth, exemplified by Frege's rigorous, apolitical logicism, triumphing over the muddy waters of continental metaphysics and psychologism. Frege was the pristine origin point. The diary shatters this myth. It reveals that the "father" of our discipline held views utterly anathema to the liberal, rational values often (though not always) associated with analytic philosophy.

  **The discipline cannot responsibly tell its story while ignoring or minimizing this fact.** To do so is intellectual dishonesty and historical whitewashing. This doesn't mean reducing Frege *only* to his bigotry or dismissing his monumental contributions. That would be equally dishonest and foolish. However, it demands a more complex, less hagiographic narrative. We must acknowledge:

  *   **The Contingency of Genius:** Brilliant, rigorous, groundbreaking philosophical work can emerge from minds capable of profound moral failure and intellectual blindness in other domains. Genius is not synonymous with goodness or broad wisdom.
  *   **The Context of Ideas:** While Frege's logic may be formally separable, his philosophical outlook did not emerge in a vacuum. The diary forces us to consider the intellectual and cultural milieu of late 19th/early 20th century Germany, including its strands of völkisch thought and antisemitism, as part of the context in which even the most abstract philosophy is conceived.
  *   **The Responsibility of History:** Telling the history of philosophy requires confronting uncomfortable truths about its practitioners. Glossing over Frege's diary perpetuates a misleading origin myth and avoids a necessary ethical reckoning within the discipline. It allows us to benefit from his intellectual legacy while pretending its source was unsullied.

  **Conclusion: Bearing the Weight**

  The "no bearing" view correctly shields the formal core of Frege's logic and semantics from direct invalidation by his diary. The concept-script remains sound. However, it fails under closer scrutiny. The diary bears significant weight on the interpretation of Frege's wider philosophical outlook, revealing a disturbing resonance between his quest for logical purity, objectivity, and absolutism and his political authoritarianism and antisemitism. It exposes a temperament intolerant of pluralism and subjectivity in both domains. Most crucially, the diary irrevocably alters the discipline's narrative. We can no longer portray Frege, or the origins of analytic philosophy, as existing in a realm of pure reason untouched by the darkest political currents of his time. We must integrate this uncomfortable truth, acknowledging both the monumental brilliance *and* the profound moral failure, recognizing that the foundations of our discipline were laid by a deeply flawed human being. The diary doesn't refute Frege's logic, but it forever stains the story of its creation and forces us to confront the complex, sometimes disturbing, humanity behind even our most abstract intellectual achievements.
