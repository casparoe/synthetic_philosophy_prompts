prompt: |-
  so this semester I'm taking a seminar (cross listed with the law school) called "Obligation, Promising, and Contract," and this week's topic kind of broke my brain: why are we actually bound to keep our promises? My professor walked us through basically the whole standard menu of answers people have given: Hume and Rawls's conventionalist "practice" theory (a promise only obligates you because there's a valuable social institution around it and you're taking advantage of that institution), Raz's normative-power theory (promising is just you exercising a power to bind yourself, a power that's valuable because it lets you shape your own normative situation), David Owens's "authority-interest" theory (we have a basic interest in having the say-so over what someone else does, seperate from just wanting things to turn out a certain way), Scanlon's assurance-based "Principle F" from What We Owe to Each Other, Judith Thomson's reliance theory (a promise as an invitation to rely on you), and Margaret Gilbert's joint commitment view, where a promise is a sui generis commitment undertaken jointly by promisor and promisee together.

  We spent almost the whole seminar throwing these six at what my prof kept calling a "desert island"/deathbed-promise case (I guess theres literally a paper out there called something like "the trouble with deathbed promises"): say I promise my dying grandma, alone with her in the hospital room, that I'll keep watering her ridiculous prize-winning orchids after she's gone. Nobody else ever finds out the promise happened, she has no other family, and there is zero chance anyone will ever know if the orchids die. Pretty much everyone in the room still felt like I'd be doing something wrong if I let them die anyway, but apparently a bunch of these theories have a genuinely hard time with this exact case, since there's no live expectation to violate, no reliance or harm happening to anyone, no ongoing convention-policing going on, and depending who you ask, not even anybody left to hold "authority" over me anymore.

  I keep flip flopping on which of the six actually survives contact with the orchid case and I don't want to just parrot whatever my professor thinks, so I want an outside take. Can you rank the six theories (Hume/Rawls, Raz, Owens, Scanlon, Thomson, Gilbert) from best to worst at explaining why I'd still be bound in the orchid case? Please give it to me as a tier list in a JSON block like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  ties within a tier are fine, just use the short names above. After the JSON, add like 3-4 sentences on why whatever ends up in your S-tier actually handles the orchid case and the others don't.
reasoning: |-
  We are given six theories to rank based on how well they explain the binding nature of a deathbed promise (the orchid case) where:
  - Only the promisor (me) and the dying grandma (promisee) are present.
  - No one else knows about the promise.
  - After death, there is no one to rely, no harm to anyone, no convention to uphold, and no one to hold authority.

  Theories:
  1. Hume/Rawls (conventionalist): Promises obligate because of a valuable social institution. 
     - Problem: On the desert island/deathbed, there is no social institution to uphold. The promise is private and no one else is around to enforce or care about the convention.

  2. Raz (normative-power): Promising is an exercise of a power to bind oneself, which is valuable for shaping one's normative situation.
     - Might work: Even if grandma dies, the promisor has exercised the power to bind themselves. The obligation comes from the act of self-binding. However, without the promisee, the normative situation might change? But Raz might say the obligation persists because the power was validly exercised.

  3. Owens (authority-interest): We have an interest in having the authority (say-so) over others. 
     - Problem: After death, grandma no longer exists to have authority over the promisor. So why would the obligation remain?

  4. Scanlon (assurance-based): Principle F: One must take reasonable steps to ensure that others do not form reasonable expectations that one is going to do something if one has no intention of doing it, or if one fails to do it. 
     - Problem: In the deathbed, grandma dies and cannot form any expectations. There is no one to mislead or fail to assure. However, at the time of the promise, she was assured. But after death, there is no ongoing assurance.

  5. Thomson (reliance theory): A promise is an invitation to rely. 
     - Problem: Grandma might rely while alive, but after death, she cannot rely. And if the orchids die, there is no harm to her because she no longer exists. So why is it wrong?

  6. Gilbert (joint commitment): A promise creates a joint commitment by both parties. 
     - Problem: After death, one party is gone. How can a joint commitment persist when one party is no longer there? But Gilbert might argue that the commitment was made and it binds until released, and death doesn't necessarily release.

  Analysis for the orchid case:
  The intuition is that the promise is still binding even after death. We must explain why.

  - Theories that focus on the consequences (harm, reliance, convention) struggle because there are no consequences after death and no society.
  - Theories that focus on the act of promising itself (like Raz and maybe Gilbert) might fare better because the obligation is created at the moment of promising and persists independently.

  Ranking (best to worst) for the orchid case:

  S-tier (best): Theories that can account for the obligation without requiring ongoing social practices, reliance, or the presence of the promisee.

  A-tier: Good but maybe with some strain.

  B-tier: Somewhat problematic.

  C-tier: Very problematic.

  D-tier: Fails.

  Proposed ranking:

  S: Raz (normative-power) and Gilbert (joint commitment) 
     Why?
     - Raz: The promisor exercised a normative power to bind themselves. The obligation arises from that act and doesn't require the promisee to be alive to enforce it. The power to create obligations is inherent and the obligation stands until fulfilled or overridden.
     - Gilbert: The joint commitment was created at the time of the promise. Even though one party dies, the commitment doesn't automatically dissolve. The promisor is still bound by the commitment made.

  A: Owens (authority-interest) 
     Why? 
     - Owens might argue that the interest in authority is not just about the present moment but about respecting the authority that was granted at the time. Even after death, we respect the authority of the deceased by fulfilling their wishes as expressed in the promise.

  B: Scanlon (assurance-based)
     Why?
     - At the time of the promise, Scanlon's Principle F is satisfied because the promisor gave assurance and grandma formed an expectation. After death, there is no ongoing expectation, but the obligation might be seen as a duty to respect the assurance given and the trust that was placed. However, it's a bit strained because the assurance was for the future and the promisee is gone.

  C: Thomson (reliance) 
     Why?
     - Grandma might have relied in her last moments, but after death, there is no reliance and no harm. So the obligation is weak.

  D: Hume/Rawls (conventionalist) 
     Why?
     - The promise is private and there is no social institution to uphold. The convention requires a social context that is absent.

  But note: The orchid case is designed to challenge theories that require ongoing social practices or consequences.

  Alternative: Maybe Gilbert should be S and Raz A? Or vice versa? But both seem to handle it.

  However, let's consider:

  - Gilbert's joint commitment: She might argue that the commitment is between two parties and if one party dies, the commitment doesn't just vanish. The survivor is still bound because the commitment was made. This fits the intuition.

  - Raz: The normative power is exercised and the obligation is created. It doesn't depend on the continued existence of the promisee.

  Owens: He might say that the authority was granted and continues to bind because the promisor has an ongoing obligation to respect the authority that was granted. But it's a bit abstract.

  Scanlon: He might try to extend by saying that breaking the promise would be a failure to respect the trust that was placed, even if the person is dead. But it's not clear in his framework.

  Thomson: Reliance at the time? But then after death, no harm. So she might not account for the obligation.

  Hume/Rawls: Clearly fails.

  So:

  S: Raz, Gilbert
  A: Owens
  B: Scanlon
  C: Thomson
  D: Hume/Rawls

  But let me see if Owens can be in S? He has a paper called "A Simple Theory of Promising" where he argues that the interest in authority is fundamental. In the deathbed case, the promisee had an interest in having authority over the promisor for the future (even after death). So the promisor is bound because they granted that authority and the promisee's interest in having that authority respected persists even after death? That might be a stretch because the promisee no longer exists to have an interest.

  Therefore, I think:

  S: Raz, Gilbert
  A: Owens (if we interpret the authority as creating an obligation that survives the death of the promisee, but it's not as straightforward as Raz and Gilbert)
  B: Scanlon
  C: Thomson
  D: Hume/Rawls

  But note: In the seminar, the professor might have presented Owens as having a hard time. However, Owens himself might argue for the persistence of the obligation.

  Alternatively, we can put Owens in B and Scanlon in A? I think Scanlon might have a better shot because he can say that the act of promising creates an obligation that is not contingent on the promisee being alive at the time of performance. But in his book, the obligation is tied to the expectations and assurance. Without the promisee, the assurance is not ongoing.

  After reading about the deathbed promise problem, I recall that Scanlon has a response: the obligation is to the promisee as she was at the time of the promise. So breaking the promise is failing to do what one assured her one would do. But she is not around to be wronged? Scanlon might say it's still wrong because it violates the principle of fidelity that we owe to each other. However, it's controversial.

  Given the above, I will go with:

  S: Raz, Gilbert
  A: Owens
  B: Scanlon
  C: Thomson
  D: Hume/Rawls

  But note: Gilbert's joint commitment theory might require the promisee to be present to release the commitment? However, in the orchid case, the promisee is dead and cannot release. So the commitment remains. That fits.

  Raz: The power to bind oneself is independent of the promisee's continued existence.

