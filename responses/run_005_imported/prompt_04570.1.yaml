    "A": ["Owens"],
    "B": ["Scanlon"],
    "C": ["Thomson"],
    "D": ["Hume/Rawls"]
  }
  ```

  Explanation for S-tier:

  Raz's normative-power theory and Gilbert's joint commitment view both ground the obligation in the act of promising itself, independent of social context or consequences. Raz sees promising as an exercise of a normative power that creates a self-binding obligation, which persists even after the promisee's death. Gilbert sees a promise as a joint commitment that binds the promisor regardless of the promisee's continued existence because the commitment was made and not dissolved. These theories best explain why the deathbed promise remains binding without relying on ongoing expectations, reliance, or social practices.
answer: |-
  ### Tier List for Deathbed Promise Theories (Orchid Case)

  ```json
  {
    "S": ["Raz", "Gilbert"],
    "A": ["Owens"],
    "B": ["Scanlon"],
    "C": ["Thomson"],
    "D": ["Hume/Rawls"]
  }
  ```

  ### Why S-Tier Theories Succeed  
  **Raz (normative-power)** and **Gilbert (joint commitment)** best explain the orchid case because they ground obligation in the *act of promising itself*, not contingent outcomes. Raz argues promising is an exercise of normative power to bind oneself—once invoked, the obligation persists independently, even after the promisee's death. Gilbert sees promises as joint commitments creating a "sui generis" obligation; the promisor remains bound because the commitment was co-created and isn’t dissolved by the promisee’s absence. Both avoid relying on social enforcement, harm, or ongoing expectations—crucial for the private, consequence-free orchid scenario.

  ### Why Others Struggle  
  - **Owens (A-tier)**: The "authority-interest" theory partially works (grandma’s authority persists as a normative residue), but struggles because her death nullifies her ability to *hold* authority.  
  - **Scanlon (B-tier)**: "Principle F" fails without ongoing assurance or expectations—dead grandma can’t feel betrayed.  
  - **Thomson (C-tier)**: Reliance requires harm from broken trust; no one exists to rely or be harmed here.  
  - **Hume/Rawls (D-tier)**: Conventionalism collapses entirely—no social institution exists to police private deathbed promises.
