  Okay, the user is asking about the philosophical debate around hypocrisy and moral standing to blame. They had an argument with a friend about a public figure who campaigned against corruption but was later found accepting favors. The friend used the tu quoque fallacy, saying the figure lost all right to criticize others. The user countered that hypocrisy doesn't negate the truth of the criticism but reflects poorly on the blamer. They want to understand why hypocrisy undermines standing to blame and compare two philosophers' views: R. Jay Wallace and G. A. Cohen.

  First, I need to unpack Wallace's and Cohen's arguments. Wallace sees blame as a second-personal act that requires mutual accountability. If the blamer violates the same norm, they break the equality needed for this address. So, hypocritical blame is invalid because it fails the reciprocity requirement. Cohen, on the other hand, separates the message from the messenger. The truth of the criticism remains valid, but the hypocrite loses standing to deliver it. The act of blaming becomes inappropriate, but the underlying moral fact doesn't change.

  Where do they agree? Both think hypocrisy undermines standing to blame, making it inappropriate. They also agree that the target's blameworthiness isn't erased by the hypocrite's actions. However, they differ on why standing is lost. Wallace ties it to the very nature of blame as a reciprocal act, while Cohen sees it as a separate issue of authority or purity in delivery.

  The user wants to know which account is more defensible. Using their example: the corrupt politician condemning others. For Wallace, the politician can't sincerely hold others accountable because they exempt themselves, breaking the mutual norm. For Cohen, the criticism might still be true, but the politician's delivery is tainted. 

  I think Wallace's view better explains why the blame feels hollow—it's not just about the messenger's credibility but the structure of moral address. Cohen's separation might allow truth to be acknowledged but doesn't address the relational aspect. However, Cohen's point about truth remaining valid is important. Wallace might be seen as conflating the act's validity with the norm's truth. 

  Cases where they differ: If someone has reformed, Wallace might allow them to blame, having rejoined the moral community. Cohen might say they still lack standing due to past actions. Also, in cases of minor hypocrisy, Cohen could argue the criticism stands if true, while Wallace might see any hypocrisy as invalidating. 

  I find Wallace's view more defensible because it addresses the core of blame as relational. The user's friend's tu quoque is partially warranted under both, but Wallace explains why the blame fails, not just why it's inappropriate. Cohen's approach risks letting valid criticism be dismissed due to the messenger's flaws. The user's point about hypocrisy being a separate character flaw aligns with Cohen, but Wallace's deeper analysis of moral accountability seems stronger.
answer: |-
  This is a wonderfully crisp articulation of a deep moral puzzle. Your distinction between the *truth* of the blame and the *standing* to deliver it hits the core of the disagreement between Wallace and Cohen. Let's break down their accounts, find their agreements and divergences, evaluate them using your example, and see where they lead to different conclusions.

  **Core Accounts:**

  1.  **R. Jay Wallace (Second-Personal Equality & Reciprocity):**
      *   **Premise:** Blame is fundamentally a *second-personal address*. It's not just stating a fact ("X is wrong"); it's holding another person accountable *to you* under a shared moral norm ("You violated norm N, and I hold you accountable for it *as someone also bound by N*").
      *   **The Problem:** This address presupposes a relationship of *equal moral standing* under the relevant norm. The blamer implicitly claims, "We are both subject to N, and I have the authority to hold you accountable *because* we share this common ground." Hypocrisy violates this reciprocity. By violating N themselves, the hypocrite demonstrates they do *not* truly stand as an equal *under* N in practice. They implicitly exempt *themselves* from the norm they demand others obey.
      *   **Why Hypocrisy Undermines Standing:** Hypocritical blame fails because it *contradicts its own presupposition*. It attempts to hold another accountable under a norm from which the blamer has effectively exempted themselves. This makes the address *invalid* or *inauthentic* as a genuine act of moral accountability. It treats the equality as running only one way (target must obey, blamer doesn't). The blame isn't just rude; it's *internally inconsistent* as a second-personal act.
      *   **Nature of the Problem:** The blame itself is *defective* or *invalid* as an act of moral address. It's not merely inappropriate; it fails to *be* genuine blame in this context because its foundational condition (mutual accountability) is absent.

  2.  **G. A. Cohen (Message/Messenger Distinction & Purity of Delivery):**
      *   **Premise:** The *truth* or *moral fact* of the wrongness of the target's action (the "message") is logically distinct from the *standing* or *authority* of the person delivering the condemnation (the "messenger").
      *   **The Problem:** Hypocrisy doesn't magically make the target's wrongdoing acceptable or the moral norm invalid. Corruption condemned by a hypocrite is still corruption. The problem lies in the *act of delivery* by *this particular person*. Their own violation of the norm compromises their moral purity or authority *to be the one delivering this specific condemnation*. It introduces a taint of bad faith, self-interest, or inconsistency into the act of blaming itself.
      *   **Why Hypocrisy Undermines Standing:** It makes the *act of blaming* by this person *inappropriate*, *unseemly*, or *lacking in moral authority*. The messenger's credibility is shot, and their condemnation rings hollow or hypocritical *as an act*, even if the *content* is true. The target can rightly say, "Who are *you* to lecture *me* on this?" without denying the substance of the lecture.
      *   **Nature of the Problem:** The blame *as voiced by this person* is *inappropriate* or *lacks authority*. The underlying moral truth remains intact, but *this delivery* of it is compromised. It's an impropriety in the *performance* of blame.

  **Agreements & Quiet Divergences:**

  *   **Agreement 1:** Both agree hypocrisy undermines the *standing* to blame. The hypocrite lacks the moral authority or position to effectively or legitimately deliver the condemnation *in this instance*.
  *   **Agreement 2:** Both agree hypocrisy does *not* absolve the target of their wrongdoing. The target is still blameworthy for their corruption.
  *   **Agreement 3:** Both see the problem as distinct from the *truth* of the moral norm or the target's violation of it.
  *   **Quiet Divergence 1: The *Nature* of the Blame's Failure:**
      *   **Wallace:** Hypocrisy makes the blame *invalid as an act of moral address*. It fails *to be* genuine blame *because* it lacks the necessary reciprocity. The act itself is defective.
      *   **Cohen:** Hypocrisy makes the blame *inappropriately delivered* or *lacking in authority*. The act *is* still blame (it identifies a wrong), but it's compromised and illegitimate *coming from this person*. The act type exists, but this token is flawed.
  *   **Quiet Divergence 2: The *Locus* of the Problem:**
      *   **Wallace:** The problem is intrinsic to the *structure of the blame act itself* and its presuppositions (reciprocity).
      *   **Cohen:** The problem is extrinsic, related to the *character or history of the blamer* contaminating the delivery of an otherwise valid message.
  *   **Quiet Divergence 3: Connection to Truth:**
      *   **Wallace:** While he doesn't deny the norm's truth, his focus on the *address* means that if the act of blame is invalid, its *effectiveness* in conveying the truth *as a demand* is nullified. The truth might stand, but the *blaming* fails to function.
      *   **Cohen:** Emphatically separates the two. The truth of the message is untouched; only the messenger's credibility for *this delivery* is damaged.

  **Evaluation & Verdict: Which is More Defensible?**

  Both accounts capture important facets, but **Wallace's account is ultimately more fundamental and defensible** for explaining *why* hypocrisy specifically undermines blame *as a moral practice*, not just as a rhetorical act.

  *   **Why Wallace Wins (Using Your Example):** Imagine your corrupt public figure passionately condemning a rival for accepting a lucrative, hidden consultancy from a corporation they regulate – *the exact same favor* the public figure secretly accepted.
      *   **Wallace's Strength:** He explains the deep *incoherence* and *bad faith* of the act. The figure is demanding accountability under a norm ("Don't accept hidden favors!") that they themselves have flouted. They are not standing *with* the rival under this norm; they are standing *above* it, demanding the rival obey rules they exempt themselves from. This violates the reciprocity essential to *holding someone accountable*. Their condemnation isn't just hypocritical; it's *not a genuine demand for mutual accountability* at all. It's a power play disguised as morality. Your intuition that hypocrisy is about the blamer's character *while leaving the blame's truth intact* is partially right, but Wallace shows *why* that character flaw *directly* undermines the specific moral act they are attempting.
      *   **Cohen's Weakness:** Cohen correctly notes the rival is still corrupt and the norm against hidden favors is valid. However, framing it *only* as a "tainted messenger" problem makes it seem like the *only* issue is the figure's lack of moral purity. This risks reducing the problem to aesthetics ("it looks bad") or rhetoric ("they lose credibility"). It doesn't fully capture the *moral* wrong of *demanding* accountability while refusing to be held accountable oneself. Cohen's view might allow someone to think, "Well, the criticism is *true*, it's just awkward coming from *him*," without grasping the deeper violation of the moral relationship Wallace identifies.

  *   **Cohen's Value & Where He Supplants Wallace:** Cohen's distinction is crucial for two reasons:
      1.  **Preserving Moral Truth:** It forcefully prevents the *tu quoque* fallacy from morphing into moral relativism ("If the blamer is bad, the target must be okay"). The truth stands independent of the hypocrite.
      2.  **Third-Party Blame:** It better handles cases where *we* (third parties) recognize the truth of the hypocrite's condemnation. Cohen allows us to say, "He's a hypocrite, *and* what he's saying about his rival's corruption is unfortunately correct." Wallace's focus on the second-personal act makes it harder to cleanly separate the valid content from the invalid delivery *for third-party observers*. The truth might be evident *despite* the failed address.

  **Where They Issue Different Answers (Justifying Your Friend's *Tu Quoque*):**

  Consider a modified scenario: The public figure *used* to accept hidden favors but **publicly confessed, made restitution, and genuinely reformed** years ago. Now, they condemn a *current* politician for accepting similar hidden favors.

  *   **Wallace:** Might argue the reformed figure *regains* standing. By confessing, making amends, and reforming, they have *rejoined* the moral community as an equal under the norm. Their condemnation now presupposes genuine reciprocity – they are subject to the norm and hold themselves accountable to it (demonstrated by their past actions). Their blame is valid. Your friend's *tu quoque* ("You did it too!") would be **less warranted** because the past hypocrisy doesn't *necessarily* invalidate current standing if genuine reform occurred.
  *   **Cohen:** Might be *more* likely to say the reformed figure *still* lacks perfect standing or that their condemnation is *still* somewhat tainted. Their past actions permanently compromise the "purity" of their delivery, even if the message is true and they are reformed. The "Who are *you* to say this?" retains *some* force, even if diminished. Your friend's *tu quoque* ("You did it too!") retains **more weight**, focusing on the enduring stain of past hypocrisy on the messenger's authority, regardless of reform.

  **Conclusion:**

  Your pushback against your friend captures Cohen's essential insight: hypocrisy doesn't negate the *truth* of the condemnation or the target's blameworthiness. However, Wallace provides the more compelling explanation for *why* hypocrisy specifically undermines the *standing to blame*: it violates the reciprocity and mutual accountability that are constitutive of blame as a second-personal moral address. The hypocrite's act isn't just compromised; it fails to be a genuine act of moral holding-to-account at all. Cohen is vital for safeguarding moral truth and explaining third-party perspectives, but Wallace gets closer to the core *moral* failure inherent in hypocritical blame. Your friend's *tu quoque* points to a real problem (lack of standing), but Wallace best explains *why* it's a problem beyond mere inconsistency or bad optics.
