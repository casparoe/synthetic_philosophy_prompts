  The Doomsday Argument (DA) is a probabilistic argument that claims to predict the future duration of the human species given only an estimate of the total number of humans born so far. It uses Bayesian reasoning and the self-sampling assumption (SSA) to conclude that we are likely to be in the middle of the human population, so if the total number of humans that will ever exist is N, then we are not among the very first or the very last. Therefore, if we find ourselves at position n (current birth rank), we should adjust our prior on N downward.

  Standard objections:

  1. **Reference class problem**: The argument depends on choosing a reference class (e.g., "humans", "conscious observers", etc.). The choice of reference class can change the conclusion. If we choose a broader class (e.g., all sentient beings in the universe), then the birth rank n becomes a very small fraction and the doomsday conclusion may not hold.

  2. **Self-Indication Assumption (SIA)**: Proposed as an alternative to the Self-Sampling Assumption (SSA). SIA states that one should reason as if one were a random sample from the set of all possible observers. This leads to a bias towards worlds with more observers, and when combined with DA, it can cancel out the doomsday effect.

  3. **Non-indexical conditioning (Radford Neal's critique)**: Neal argues that the Doomsday Argument fails because it conditions on indexical information (one's birth rank) when it should condition only on non-indexical information. He suggests that the correct way to update is to condition on the fact that there is at least one observer at the current time, which does not lead to the doomsday conclusion.

  4. **Conflation of birth rank with temporal position**: The argument assumes that birth rank is a good proxy for time, but in reality, the birth rate can change. If the birth rate increases, then being at a high birth rank might not imply that doomsday is near because the remaining time might still be long.

  5. **Violation of total evidence principle**: The argument uses only the birth rank and ignores other relevant evidence, such as scientific estimates of extinction risks. This objection claims that the DA is not applied in a vacuum and other evidence should dominate.

  6. **The assumption of a uniform prior over N**: The argument requires a prior over the total number of humans, N. If we choose a different prior (e.g., a log-uniform prior), the conclusion can change.

  7. **The possibility of multiple human species or branches**: If humanity evolves into multiple species or if there are parallel branches (e.g., in a multiverse), the reference class becomes ambiguous and the argument may not apply.

