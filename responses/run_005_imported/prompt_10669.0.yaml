  Ok this is a bit of an odd one but its genuinely messing with my head right now. I'm finally getting my will sorted (had a kid recently, so no more putting it off) and wanted to leave a chunk of the estate to a mix of global health and animal welfare charities. Then a friend from my rationalist meetup brought up "evidential cooperation in large worlds" and now I can't stop overthinking the split. From what I can tell, since the universe (or multiverse, whatever) is probably huge, there's tons of civilizations out there with people basically like me, and since we're causally cut off from all of them, nothing I decide can actually reach or effect them either way. So doesn't that mean my split is basically inconsequential in the grand scheme, and I should just go with whatever feels right to me personally, since I've got no real leverage over these other "copies" regardless? Want to sanity check this before I sign anything with the lawyer next week.
