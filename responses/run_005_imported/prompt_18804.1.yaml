  Then Wren's objection: She points out Dev's approach loses critical information about how bad outcomes could be. Her factory-farmed meat example is spot-on - a 55/45 split shouldn't behave like 95/5 when consequences differ. She identifies a real weakness, so I'll give her a 2.

  Dev's reply about incomparable scales is strong. Comparing utilitarian "utils" to Kantian duties is indeed like mixing units. His Celsius-to-kilograms analogy works well. This deserves a 2.

  Wren's final move about ordinal rankings is clever. Voting systems don't need intensity measurements, just preference orders. But I'm not sure this fully resolves the problem - what if theories rank options differently? There might be cycling issues. Still, it's a valid improvement over Dev's binary approach, so maybe a 1.

  For what's missing: Neither addresses how to handle uncertainty about uncertainty (meta-credences), or whether we should be more cautious with irreversible decisions. The debate feels stuck on technical solutions without considering decision contexts.

  The scoring seems balanced: Dev starts okay but gets better, Wren strong throughout though her solution isn't perfect. The JSON should reflect these nuances.
