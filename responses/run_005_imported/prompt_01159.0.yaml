prompt: |-
  Working on a piece about AI and want to use Descartes as the hook instead of the usual Turing test framing. Everyone remembers he thought animals were basically unfeeling automata, but what gets left out is that he actually gives two specific, testable criteria in the Discourse on Method for telling a real mind from a mere machine (the same two tests he uses to write off animal minds) — something about flexible langauge use, and something about behavior holding up across totally novel situations instead of just excelling narrowly at one thing. If you sat Descartes down in front of a modern LLM, would it pass those two tests on his own terms, or fail the way he thought animals did? Actually walk me through his criteria instead of just giving me the generic "Descartes would hate robots" take.
