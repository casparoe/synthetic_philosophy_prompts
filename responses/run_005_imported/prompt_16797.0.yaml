answer: |-
  Okay, this is an *excellent* foundation for a seminar paper. You've grasped the core of Anscombe's argument and identified a genuinely insightful and philosophically rich extension. Let's break down your questions:

  1.  **Your Summary of Anscombe's Argument:**
      *   **Accuracy:** Spot on. You've nailed the crucial distinction she's making. You're absolutely right that she's **not** primarily arguing:
          *   General pacifism ("war is bad").
          *   Proportionality (the bad effects outweighed the good).
      *   Her target is **intention**. The *means chosen* to end the war was the *deliberate massacre of civilians* to break their will. This is the core.
      *   **Double Effect:** Your understanding is correct and *essential*. The bombing wasn't "aiming at a legitimate target and foreseeing but regretting civilian deaths" (which *might* be excusable under double effect *if* proportional and necessary). It *was* aiming at the civilians *as such* to achieve the goal. Civilians weren't "collateral damage"; they were the *intended instrument* of the attack. This makes it murder, full stop, for Anscombe.
      *   **Consequentialism Doesn't Wash:** You're exactly right about her rejecting the "it saved lives overall" justification. For Anscombe, intentionally killing the innocent as a means is *absolutely prohibited*, regardless of consequences. This is the core of her anti-consequentialist ethics (later elaborated in "Modern Moral Philosophy"). Good outcomes cannot justify intrinsically evil acts.
      *   **Why your summary is strong:** You've focused precisely on the *philosophical mechanism* (intention vs. double effect) and her fundamental ethical stance (absolutism on intentional killing of innocents). This shows you've read carefully.
      *   **Potential Pitfall to Avoid (Minor):** Just ensure your final paper explicitly states *why* intentionally killing innocents is always wrong *for Anscombe*. It's not just "bad," it violates the absolute prohibition on murder, rooted in natural law and the sanctity of innocent human life. Briefly grounding it in her broader ethics strengthens the argument.

  2.  **Your Deterrence Extension:**
      *   **The Idea:** This is **excellent** and a natural, powerful extension of Anscombe's logic. It's exactly where her reasoning leads. You're right to recall "War and Murder" – she explicitly tackles deterrence there.
      *   **Anscombe's View on Deterrence:** In "War and Murder" (and elsewhere), Anscombe argues that *threatening* mass murder (as nuclear deterrence does) is also morally corrupt *if the threat is sincere*. Why? Because forming the *intention* to commit mass murder (even conditionally) is itself an immoral act of the will. Deterrence only works if the threat is credible, which requires a genuine conditional intention: "If you attack me, I *will* intentionally slaughter your civilians." For Anscombe, forming *that intention* is already to will something intrinsically evil.
      *   **The Rationality Puzzle - The Paradox of Deterrence:** Your "nagging feeling" is spot on! You've identified the **Paradox of Deterrence**, most famously explored by **Gregory Kavka** in his 1978 paper ["Some Paradoxes of Deterrence"](https://www.jstor.org/stable/2025422) and his book *Moral Paradoxes of Nuclear Deterrence*.
          *   **The Paradox:** Deterrence seems to require a *sincere intention* to retaliate massively (to be credible). But *if* deterrence fails and retaliation is actually triggered, retaliating would be (on most accounts, including Anscombe's) *catastrophically irrational and immoral* (pointless destruction, arguably suicide). So, how can it be rational (or moral) to *form* an intention to do something that would be irrational (and immoral) to *carry out*?
      *   **How This Bears on Your Point:** Kavka's paradox is primarily about *rationality*, but it intersects directly with Anscombe's *moral* concern about intention.
          *   **For Anscombe:** The *moral* corruption lies in forming the intention itself, regardless of whether you ever act on it or whether acting on it would be rational. The paradox highlights the *psychological* and *rational* difficulty of maintaining such an intention sincerely, but Anscombe's point is *moral*: forming the intention is wrong *even if* you could somehow maintain it credibly without acting irrationally later.
          *   **Your Argument's Strength:** You can use the paradox to *reinforce* Anscombe's point. The paradoxical nature of sincerely intending something irrational/immoral underscores the *inherent instability* and *moral dubiousness* of the whole deterrence posture from an Anscombian perspective. It shows deterrence relies on a psychologically and rationally fraught state of mind that is, for her, *already morally corrupt*. The paradox demonstrates *why* deterrence is problematic, but Anscombe provides the *moral condemnation* of the core intention it requires.
      *   **Is it "Original"?** Connecting Anscombe's argument about Truman/Hiroshima to the moral problem of *intending* mass murder for deterrence is a standard *and insightful* move within Anscombe scholarship. It's a logical consequence of her position. Kavka's paradox is a well-known *adjacent* problem focusing on rationality. **Your contribution isn't necessarily in inventing the *idea* (it's in Anscombe and discussed in the literature), but in:** *Clearly articulating the connection* between her Hiroshima argument and deterrence based on the shared element of *intention*; *Applying* her specific absolutist framework to condemn deterrence; *Potentially using* the rationality paradox to illuminate the practical/moral tension inherent in her condemnation.

  **Conclusion & Advice:**

  1.  **Your Bones are VERY Strong:** Your understanding of Anscombe's core argument is accurate and philosophically sophisticated. You haven't flattened double effect; you've correctly identified the hinge point. A grader would be pleased with this foundation.
  2.  **The Deterrence Move is Excellent:** It's a logical, powerful, and philosophically rich extension of her argument. It's central to understanding the full implications of her view on modern warfare. It is a "decent extension" that you can confidently present as following the logic of *her* position.
  3.  **How to Frame It:**
      *   **Present it as the logical consequence:** "If Anscombe is correct that intentionally targeting civilians as a means is always murder, then this has profound implications not only for acts like Hiroshima but also for the foundational logic of nuclear deterrence..."
      *   **Cite Anscombe's "War and Murder":** Briefly summarize her direct argument against the intention behind deterrence. Show you've done the reading beyond the pamphlet.
      *   **Engage with the Paradox:** Introduce Kavka's Paradox of Deterrence (cite him!) as highlighting the *rational instability* of the intention deterrence requires. Use it to say: "This paradox underscores the profound difficulty, both rationally and psychologically, of maintaining the very intention that Anscombe argues is *already morally corrupting*."
      *   **Don't claim total novelty, claim insight:** You don't need to say "I invented this connection." Say "Anscombe's own logic, particularly her absolutism concerning intention, leads inescapably to the condemnation of nuclear deterrence." Show you understand the landscape (cite Anscombe on deterrence, mention the paradox) but focus on *applying her specific framework rigorously*.

  **Next Steps for Office Hours:**

  *   Go in with *exactly* this summary and your deterrence idea. It's far from dumb; it's sophisticated and shows deep engagement.
  *   Ask your professor:
      *   "Does my summary accurately capture Anscombe's core argument about intention and double effect in the Truman pamphlet?"
      *   "I'm interested in extending this to argue that her logic condemns the *intention* required for nuclear deterrence, as she discusses in 'War and Murder'. I also see Kavka's Paradox of Deterrence as relevant in highlighting the instability of that intention. Does this seem like a fruitful direction for the paper?"
      *   "Are there any key nuances in Anscombe's view on intention or double effect I should be particularly careful about?"

  You are on *very* solid ground. This has the makings of a really strong paper. Go for it!
