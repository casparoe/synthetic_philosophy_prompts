answer: |-
  This is an excellent and perceptive paragraph that captures a genuine and significant tension in Dummett's argument. Your reconstruction from memory is remarkably accurate, though there are nuances worth refining. Let's break it down:

  1.  **Accuracy:**
      *   **The Corrosive Critique:** You nail this. Dummett relentlessly attacks the *actual arguments* used for restriction, exposing them as either circular, empirically dubious, or thinly veiled expressions of racism or xenophobia. His core thesis is that the *dominant motive* for restrictionist policies, especially in Britain, *is* racial prejudice. He emphasizes the unique, near-absolute claim of refugees under the Convention and basic morality, arguing states have minimal legitimate grounds to refuse them.
      *   **The Concession:** This is correctly identified. Dummett *does* grant that a state can legitimately restrict immigration if admitting more would genuinely overwhelm its capacity to provide essential services and maintain social order *for everyone*, including newcomers. Crucially, he insists this restriction must be determined **impartially**, meaning:
          *   *Non-Discrimination:* Criteria cannot be based on race, ethnicity, nationality, religion, etc.
          *   *Evidence-Based:* Genuine assessment of capacity limits, not just assertions.
          *   *Fairness:* The burden of proof is on the state to demonstrate genuine incapacity.
      *   **The Tension & Impartiality Test:** You correctly identify the core problem: the elasticity of "capacity" and its susceptibility to political manipulation. However, Dummett *intended* the impartiality test to be **robust** and **substantive**, not merely procedural. He envisioned it as a *safeguard* against the very rationalizations he unmasked. The test *is* meant to do the heavy lifting of preventing the concession from becoming a loophole.
      *   **Attribution:** This *is* specific to Dummett, though the *problem* is common in liberal theory. His unique emphasis is:
          *   **The Primacy of Anti-Racism:** For Dummett, unmasking *racism* as the *actual driver* is the central, corrosive point. This is more central and explicit in his work than in, say, Carens (focused on liberal equality) or Miller (focused on national identity/self-determination).
          *   **The Stringency of Impartiality:** Dummett's background in voting theory and fairness informs his demand for non-discrimination and evidence. While Walzer discusses membership and community, and Miller discusses culture, Dummett frames the impartiality requirement more starkly as an anti-*racist* imperative.
          *   **The Moral Urgency:** His tone is often more polemical and morally outraged than the typically more dispassionate analytical style of Carens or Miller.

  2.  **Substance: Is the Tension Genuine? Is There a Way Out?**
      *   **Yes, the Tension is Genuine and Problematic:** Your critique is spot on. This is the fundamental weakness in Dummett's framework, and it's one he himself grappled with but didn't fully resolve. The concept of "capacity" is inherently:
          *   *Vague:* What counts as "essential services"? What level of strain is "overwhelming"? Housing? Schools? Hospitals? Social cohesion?
          *   *Dynamic:* Capacity isn't fixed; it can be expanded with political will and resources.
          *   *Politically Constructed:* Governments define "capacity" based on priorities (e.g., tax cuts vs. infrastructure for newcomers).
          *   *Susceptible to Bad Faith:* As you say, it provides a ready-made, seemingly respectable vocabulary ("we're full," "services are stretched") to mask discriminatory intent.
      *   **Dummett's Potential Counter/Defense (and Why it Might Not Fully Work):**
          *   *Impartiality as Anti-Racist Filter:* He would argue that a restriction truly based on impartial assessment of capacity *wouldn't* be driven by the motives he unmasked. The test *is* designed precisely to separate legitimate resource concerns from racist rationalizations. If a government can *prove* genuine, non-discriminatory incapacity, the restriction isn't just a mask.
          *   *Burden of Proof:* He places a heavy burden on the state to *demonstrate* genuine incapacity with evidence, not just assertion.
          *   *Focus on Refugees:* For refugees, he sets the bar for overriding their claim *extremely* high, making the capacity argument even harder to invoke legitimately against them.
      *   **Why the Problem Remains:** The defense relies on the impartiality test *working perfectly* in a political realm where definitions of capacity are inherently contested and power imbalances exist. How do you *prove* bad faith when a government points to strained services? How do you ensure "impartiality" isn't just procedural fairness applied to a resource limit *defined* by potentially biased assumptions? Dummett offers the *ideal* of impartiality as the solution, but provides insufficient institutional or epistemic tools to guarantee it functions as intended against determined bad actors. The tension you identify is real and exposes a vulnerability in his framework.

  3.  **Framing: Is This the Most Interesting Fault Line?**
      *   **Yes, it's a Strong and Central Fault Line:** The tension between the devastating critique of *actual motives* and the concession based on a highly contestable concept like "capacity" is fundamental. It gets to the heart of the challenge of translating moral principles into workable policy in a non-ideal world rife with prejudice. It's analytically sharp and directly relevant to how his argument plays out in political reality.
      *   **Other Potentially Interesting Fault Lines/Angles:**
          *   **The Philosopher vs. The Moralist:** Contrasting the highly technical Dummett (logic, Frege, voting theory) with the direct, morally urgent, sometimes polemical voice in this book. How does this intervention fit within his broader intellectual project? Is it an aberration or an expression of a deeper ethical commitment? (This might be *more* interesting for your feature's *overall* theme about philosophers stepping into policy).
          *   **The Role of Voting Theory:** How does his deep work on fair voting procedures and the dangers of strategic voting inform his emphasis on *impartiality* and *non-discrimination* in immigration policy? Is there a connection?
          *   **Refugee Convention as Absolute(ish) vs. State Capacity:** The specific tension between the near-absolute right he grants refugees and the capacity concession, even with its high bar. How does he reconcile these?
          *   **Empirical Claims:** Dummett makes strong empirical claims about the *effects* of immigration and the *motives* of restrictionists. How do these hold up? (Less philosophical, more socio-political).
          *   **Comparison to Other Philosophers:** How does his uniquely strong emphasis on *racism* as the *core* problem compare to Walzer's "communities of character," Carens' "borders as arbitrary" from a liberal egalitarian view, or Miller's emphasis on national identity and self-determination? His focus is distinct.
      *   **Recommendation:** The fault line you've chosen is excellent and central. **However,** for your *specific feature* about philosophers setting aside technical work for policy, **framing it through the lens of "The Philosopher vs. The Moralist" or "The Voting Theorist's Concept of Impartiality Applied to Immigration" might be even *more* compelling.** It directly ties the intervention to his signature work. You could *use* the capacity concession tension as the *substance* illustrating this broader framing. E.g., "Dummett the voting theorist demands strict impartiality to prevent the capacity concession from becoming a mask for racism, but this very demand exposes the limits of applying abstract fairness principles to the murky realities of state power and contested resources."

  **Suggested Refinements to Your Paragraph:**

  *   **Strengthen the Impartiality Test:** Make it clearer that Dummett intended this as a *substantive safeguard*, not just a procedural hoop. Emphasize the *burden of proof* he places on the state.
  *   **Clarify the Racism Focus:** Explicitly state that unmasking *racism* as the primary driver is his core corrosive point.
  *   **Nuance the "Undo" Point:** Instead of saying it "quietly undo[es]" the polemic, say it "creates a significant vulnerability" or "risks undermining the polemic by providing a potentially bad-faith escape hatch." It doesn't *logically* undo it, but it *practically* threatens its force.
  *   **Connect to Broader Theme (Optional but Recommended):** Add a sentence hinting at why this intervention is striking *for Dummett specifically* (the technical philosopher becoming the urgent moralist).

  **Revised Paragraph Suggestion:**

  "Dummett's argument presents a powerful but tension-riven framework. Its corrosive first half relentlessly dissects common justifications for immigration restriction, arguing they largely serve as rationalizations for maintaining a desired ethnic composition, driven fundamentally by racism. He particularly emphasizes the near-absolute moral and legal claim of refugees, which receiving states have scant legitimate grounds to override. The second half offers a seemingly narrow concession: a state may restrict immigration if admitting more would *genuinely* overwhelm its capacity to sustain essential services for all, *provided* this restriction is determined impartially – meaning based on non-discriminatory criteria and rigorous evidence, with the burden of proof firmly on the state. The tension, however, lies in the elasticity of 'capacity' and the political contestability of 'impartiality.' As you astutely note, this concession risks handing restrictionist governments a respectable, resource-based vocabulary to redescribe precisely the exclusionary motives Dummett so effectively unmasked in the first place. While Dummett intended the stringent impartiality test – informed perhaps by his work on fair procedures – to act as a safeguard, it remains vulnerable to bad-faith deployment in the political arena where definitions of capacity are inherently malleable and power shapes evidence. This unresolved tension highlights the difficulty of translating a powerful moral critique rooted in anti-racism into a robust policy bulwark against discriminatory state action."

  **Final Thoughts:**

  Your paragraph is excellent as is. The suggested refinements are minor tweaks for precision and emphasis. The tension you identify is real, central, and well-explained. For your specific feature, briefly connecting this intervention back to his "signature technical work" (e.g., "Applying the voting theorist's demand for impartiality...") or highlighting the shift in voice ("The logician's voice giving way to the moralist's urgency...") would strengthen the hook for your overarching theme. You've grasped Dummett's core argument and its key vulnerability accurately.
