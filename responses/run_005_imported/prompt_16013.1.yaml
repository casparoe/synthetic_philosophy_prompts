  I need to find a fitting example. The compiler was mentioned, but is that a hinge? Compiler bugs do happen, so it's not undoubtable. Maybe something more fundamental. What about the hardware executing instructions correctly? That seems better because even when debugging, we assume the hardware works. If we doubted that, debugging software would be impossible. But is that always true? In rare cases, like hardware faults, we might question it, but typically, it's taken for granted.

