prompt: |-
  So a friend of mine who's doing a philosophy PhD was going on about this Wittgenstein book called On Certainty last time we hung out, and one idea from it has been stuck in my head since. From what I understood (could be slightly off, I have zero formal philosophy training), there's this category of belief that isn't "known" in the normal sense -- we didn't arrive at it through evidence or investigation -- but its also not really doubtable, because our whole practice of investigating or doubting anything ELSE only works against the backdrop of it. He calls these "hinge propositions" (apparently theres a whole subfield now called hinge epistemology built around this), stuff like "I have two hands" or "the earth's existed for way longer than I've been alive." The part that seems important is that these aren't just beliefs we're super confident about because we've got a mountain of evidence for them -- they're doing a different job entirely, more like the frame the evidence-weighing happens inside of, rather than a very well-supported resident of that frame.

  Anyway this got me wondering if there's an equivalent in my actual job, i.e. software engineering. There's obviously a ton of stuff I never question while debugging -- like, I dunno, that the compiler is actually implementing the language the way the spec says it does -- but I honestly can't tell if that's a real "hinge" in Wittgenstein's sense or just an ordinary background assumption that happens to be extremely well justified (in which case it's not the same phenomenon at all, just a really strong belief).

  Could you help me sort this out -- give me a solid example of a hinge proposition from software dev/debugging specifically (can be the compiler thing above if it actually holds up, or something better if it doesn't), and actually make the case for why it plays that special hinge-like role instead of just being "a thing we're really confident about"? Also, if you can work it in: apparently Wittgenstein has this riverbed metaphor where hinges aren't fixed forever -- the bed can shift over time so stuff that was solid ground becomes doubtable and vice versa -- so I'd be curious whether your example could ever stop being a hinge in that way. And genuinely feel free to tell me the analogy doesn't hold up if you don't think it does -- I'd rather get a real answer than something forced.
