  ### Justifications:
  - **S: Harsanyi's impartial-observer and social-aggregation theorems (2)**  
    This approach provides a rigorous axiomatic foundation for cardinal utility comparisons by deriving them from individual preferences under uncertainty and an impartial observer's choices, minimizing ad hoc ethical assumptions while offering a formal basis for aggregation.

  - **A: Suppes–Sen extended-sympathy grading principle (3) and Sen's capability approach (5)**  
    Extended sympathy (3) avoids cardinal measurement by relying on ordinal judgments about being in others' positions, making it a defensible, preference-based framework for impartial comparisons. The capability approach (5) shifts focus to objective freedoms and functionings, offering a concrete basis for comparison but requiring value-listed choices about which capabilities matter, which introduces some arbitrariness.

  - **B: Subjective-well-being survey data (7) and Rawls's index of primary goods (4)**  
    Well-being surveys (7) use direct self-reports to ground comparisons in lived experience, but they risk measurement errors and adaptive preferences. Rawls's primary goods (4) provides an objective, resource-based proxy for welfare comparisons but arbitrarily ignores individual variations in converting goods to well-being and smuggles in liberal-egalitarian values.

  - **C: Money-metric/willingness-to-pay measures (6) and classical cardinal hedonism (1)**  
    Money-metrics (6) rely on observable behavior but embed income-based distortions and conflate welfare with market power, making them normatively arbitrary. Classical hedonism (1) posits measurable mental states but lacks empirical grounding, reducing to untestable assumptions about uniform "pleasure units" that smuggle in Benthamite ethics.

  - **D: Robbins-style ordinalist skepticism (8)**  
    While logically coherent, this view rejects interpersonal comparisons entirely, rendering welfare aggregation impossible and thus failing to provide any basis for the practical judgments economics and ethics require.
