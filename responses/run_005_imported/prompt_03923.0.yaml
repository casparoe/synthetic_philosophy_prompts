answer: |-
  You've hit on precisely why this passage is both profound and perpetually debated - Aquinas is weaving together multiple strands of argument that *feel* contradictory but are actually complementary in scholastic reasoning. Let's dissect it logically:

  ### 1. The Definitional vs. Consequentialist Tension (It's Both, Intentionally)
  - **The Definitional Core**: Aquinas first redefines tyranny as *fundamentally illegitimate* because it violates the *essence* of government (directed toward private good, not common good). This isn't just descriptive; it's ontological. A tyranny isn't a "bad government" but a *perversion of government itself*. Therefore:  
    - **P1**: Sedition requires attacking a *just* authority (per Article 1).  
    - **P2**: Tyranny lacks just authority (as defined).  
    - **Conclusion**: Resisting tyranny ≠ sedition (by definition).  
    *This is a categorical, moral boundary.*  

  - **The Consequentialist Layer**: The "unless" clause introduces *prudential judgment*:  
    - **P3**: Even legitimate resistance becomes immoral if it causes *greater harm than the tyranny itself*.  
    - **Key nuance**: This isn't weighing the *justice* of the act (settled definitionally), but its *licitness under natural law* (avoiding disproportionate evil). Aquinas assumes a hierarchy of goods: order and peace are goods, but subordinate to justice.  

  **How they work together**: The definition justifies resistance *in principle*; the consequentialist test governs *practice*. Think of it as:  
  *"You *may* resist (because tyranny is no true authority), but you *should not* if your resistance is itself tyrannical in its effects."* This mirrors Aquinas' treatment of just war (jus ad bellum / jus in bello).

  ### 2. The "Killing" Question (A Textual Leap)
  - **What the text *actually* says**: Only "disturbing" (inquietatio) the regime and "delivering" (liberare) the people. *No mention of killing*.  
  - **Why people infer tyrannicide**:  
    - **Historical context**: Medieval commentators (like John of Salisbury) *explicitly* endorsed tyrannicide, and Aquinas was read through that lens.  
    - **Structural implication**: If tyranny is a "violent injustice" (per Aristotle, whom Aquinas cites), and if resistance is licit, then lethal force fits within Aquinas' broader framework of *self-defense* (ST II-II Q.64). A tyrant is an *unjust aggressor* against the common good.  
    - **Later tradition**: Suárez and Mariana *explicitly* cited this passage to justify killing tyrants. The inference became entrenched.  
  - **What Aquinas likely intended**: Resistance as *last resort* after exhausting persuasion, disobedience, and non-violent means (per his hierarchy of law in Q.42 Art. 2). Killing isn't *required* by the text, but it isn't *excluded* if proportionate and necessary.

  ### 3. The "Tyrant as Seditious" Move (Substantive, Not Rhetorical)
  - **Logical function**: It resolves a potential objection: *"But resistance causes disorder!"*  
  - **Aquinas' counter**: The *true* disorder (sedition) originates with the tyrant. Why?  
    - Tyranny *by definition* sows discord (dividing rulers from ruled).  
    - The tyrant actively *fosters* factionalism to maintain power ("encourages discord").  
  - **Theological depth**: In Aquinas' metaphysics, evil is a *privation* of good. Tyranny isn't just "bad rule" but a *corruption* of unity. Thus:  
    - **Real unity** = just rule → harmony.  
    - **Apparent "unity" under tyranny** = oppression → *inherently* discordant.  
    The tyrant isn't merely guilty of bad governance; he's guilty of *the essence of sedition*: destroying true communal peace. This isn't wordplay—it's applying Aristotle's definition of tyranny as "rule fractured by faction" (Politics V.10).

  ### The Logical Structure Simplified
  1. **Define key terms**:  
     - Sedition = sinfully disrupting *just* authority.  
     - Tyranny = *not* just authority (per Aristotle).  
  2. **Conclude**: Resisting tyranny ≠ sedition (categorical).  
  3. **Add prudential caveat**: Resistance must not cause worse harm (consequentialist).  
  4. **Reframe blame**: Disorder originates with the tyrant (ontological inversion).  

  ### Why Your Grandfather (and the Internet) Overreads It
  - **Selective emphasis**: The "tyranny isn't just" line *feels* like blanket permission.  
  - **Historical amnesia**: Later Catholic thinkers (especially 16th-17th c.) *expanded* this into explicit tyrannicide doctrine. Aquinas was their starting point.  
  - **Modern reductionism**: Online debates often strip scholastic nuance. Aquinas isn't saying "kill tyrants"; he's saying *legitimate authority rests solely on service to the common good*—and resisting its opposite *may* be justified if done rightly.  

  **Bottom line**: Aquinas gives a *theoretical justification* for resistance (not necessarily violent) against regimes that fundamentally betray their purpose. The rest is interpretation—which is why this passage remains contested 750 years later. Your confusion is warranted; it’s one of the densest bits of political theology ever written. If you want to push back gently, focus on the "unless" clause and the absence of violence in the text—Aquinas is far more cautious than later tradition made him seem.
