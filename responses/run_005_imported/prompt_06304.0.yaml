  Underlying all this, the user might be struggling with the tension between personal/family truth and public accountability. They want to honor Marta's legacy but face the practicalities of publishing. Their deeper need could be reconciling these aspects—validating their family's oral history while navigating the demands of factual rigor in public discourse.

