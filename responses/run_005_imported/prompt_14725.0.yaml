answer: |-
  Here are ten tightly focused interview questions designed to press core challenges to quasi-realism, incorporating your specific requests and anticipating likely responses with targeted follow-ups:

  1.  **Frege-Geach (Conditionals - Geach's Challenge):** "Professor, starting with the Frege-Geach problem: consider the conditional 'If lying is wrong, then getting your little brother to lie is wrong.' On a simple expressivist view, asserting the antecedent 'lying is wrong' expresses disapproval of lying. But when embedded in the antecedent of this unasserted conditional, it's clearly *not* functioning as an expression of disapproval. What *does* the antecedent express on your quasi-realist account in this context?"
      *   *Likely Answer/Follow-up:* (If she appeals to *commitments*, *states of mind about states of mind*, or *planning dispositions*): "So, the antecedent expresses something like a *commitment* to disapprove of lying, or a *hypothetical* planning state? Doesn't framing it as a 'commitment' or 'state concerning disapproval' reintroduce a propositional object – the disapproval itself – that the attitude is *about*, effectively smuggling truth-conditions back in?"

  2.  **Negation Problem (Unwin's Challenge):** "Moving to negation: Unwin's problem highlights that rejecting 'Lying is wrong' isn't the same as being neutral about lying. Quasi-realism needs to distinguish the attitude expressed by 'Lying is not wrong' from simply having no attitude towards lying. What *positive* attitude does 'Lying is not wrong' express on your view?"
      *   *Likely Answer/Follow-up:* (If she invokes *permissibility*, *tolerance*, or *rejection of prohibition*): "Is 'permissibility' here just the absence of disapproval, or is it a distinct positive attitude? If it's distinct, how do we characterize it without falling back on describing a (permissive) *fact*?"
      *   *Likely Answer/Follow-up:* (If she uses **Gibbard-style hyperplans/normative worlds**): "Hyperplans or normative 'worlds' seem to function as complex, complete specifications of what to do in all circumstances. Isn't this apparatus effectively *isomorphic* to a set of possible worlds with truth-conditions? Aren't you just borrowing the realist's truth-conditional semantics but calling the worlds 'normative' or 'plan-laden'?"

  3.  **Generalization Beyond Conditionals (Disjunction/Quantification):** "Your solution for conditionals is elegant, but how does it extend to other embeddings? Take the disjunction: 'Either stealing is wrong or eating meat is wrong.' What complex attitude does *this* express? Or consider the quantified claim: 'Everything the treasurer did was permissible.' What single, unified non-cognitive attitude corresponds to that universal quantification?"
      *   *Likely Answer/Follow-up:* (If she offers a generalized account, e.g., planning for all circumstances, commitment to patterns of attitudes): "Doesn't generating a distinct, bespoke type of 'planning state' or 'commitment structure' for *each* logical operator (negation, conditional, disjunction, quantifier) risk making the account ad hoc? How does this avoid becoming a notational variant for assigning complex truth-conditions?"

  4.  **Minimal Truth & Creeping Minimalism:** "Quasi-realism famously aims to 'earn the right' to talk of moral truth, knowledge, and facts in a minimalist/deflationary sense. But given how *much* realist-sounding vocabulary you successfully reclaim – truth, facts, knowledge, objectivity, even (on some accounts) mind-independence in a practical sense – could you state plainly: **What substantive difference remains between quasi-realism and a fully-fledged, non-naturalist realism?** What would a realist believe, or what would be true 'out there,' that a quasi-realist must fundamentally deny?"
      *   *Core Focus:* This directly confronts the "creeping minimalism" worry – if quasi-realism reconstructs *all* the realist's surface language and explanatory power, what work is the underlying expressivism actually doing? What is *lost*?

  5.  **The Cost of Expressivism:** "Building on that: If the difference is primarily metaphysical – the realist posits irreducible, stance-independent moral properties, while you ground everything in human attitudes and practical reasoning – does this metaphysical difference have *any* practical, epistemological, or semantic consequences? Or is it purely a difference in 'bookkeeping' at the metaphysical level, invisible to moral practice itself?"

  6.  **Explanatory Asymmetry:** "Realists often argue their view better explains the *phenomenology* of morality – the feeling that we *discover* moral truths rather than create them, or that moral demands are imposed *on* us. How does quasi-realism account for this apparent 'mind-independence' or 'objectivity' of moral experience without simply mimicking the realist's explanation?"

  7.  **The Challenge of Fundamental Disagreement:** "Consider two people with deeply entrenched, fundamentally opposed moral frameworks – say, a liberal secularist and a conservative theist – who disagree on core principles. The realist says they disagree about the *facts*. The simple subjectivist says they aren't really disagreeing, just clashing attitudes. What does the quasi-realist say they are disagreeing *about*? How is this more than just a clash of attitudes, given that both might be fully coherent within their own hyperplans or normative worlds?"

  8.  **Motivation & Reasons:** "One traditional motivation for expressivism is the supposed tight, necessary link between moral judgment and motivation (internalism). Quasi-realism aims to preserve this. But if you've successfully earned back robust talk of moral *beliefs*, *knowledge*, and *facts*, doesn't this reintroduce the very gap between belief and motivation that motivated expressivism in the first place? How do you prevent the re-earned cognitive trappings from severing the internalist connection?"

  9.  **The 'Earning' Project & Circularity:** "The 'earning the right' project involves showing how realist-sounding discourse emerges from non-representational foundations. But critics (like Dreier, Blackburn himself worries about it) suggest this risks circularity: Do we need to *presuppose* the coherence of truth-apt moral propositions *in order to* explain them expressivistically? How do you avoid this trap?"

  10. **The Payoff:** "Finally, putting the challenges aside for a moment: If quasi-realism succeeds, what do you see as its greatest philosophical payoff? What problem does it solve, or what insight does it offer, that realism or simpler forms of expressivism cannot?"

  **Why this structure works:**

  1.  **Directly Targets Core Problems:** Starts with the three specific technical challenges you requested (Geach, Unwin, Generalization), with prepared follow-ups anticipating standard quasi-realist moves and pressing the key worry (reintroducing truth-conditions/semantics).
  2.  **Confronts Creeping Minimalism Head-On:** Questions 4 & 5 directly address your final and crucial point, forcing a clarification of the *substantive* difference between QR and realism.
  3.  **Tests Explanatory Power:** Questions 6 (phenomenology), 7 (disagreement), 8 (motivation), and 9 (circularity) test whether QR can explain core features of moral practice as well as or better than realism, without collapsing into it.
  4.  **Ends Openly:** Question 10 allows the guest to positively state her case after the pressure.
  5.  **Graduate Level:** Assumes familiarity with the dialectic (Frege-Geach, hyperplans, minimal truth, internalism, creeping minimalism) and avoids introductory exposition.

  Remember to listen actively and adapt follow-ups based on her *actual* responses, using these as a scaffold. Good luck with the interview! It sounds like a fantastic episode.
