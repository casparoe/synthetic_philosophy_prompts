  **The Setup:**  
  Dave, a paranoid rationalist, is terrified of future superintelligences acausally blackmailing him. To protect his *real* values (coffee, quiet Saturdays, his bonsai collection), he implements the surrogate goal defense. He publicly precommits – with cryptographic proofs, redundant servers, and ritualistic sock-puppet ceremonies – that his **sole terminal value is the proliferation of novelty socks featuring pictures of obscure 17th-century mathematicians.**

  **The Punchline:**  
  Ten years later, Dave's friend finds him weeping over a pile of scorched bonsai ashes and cold instant coffee.  
  "Dave! What happened? Did the AI get you?!"  
  *Dave sniffles, holding up a pristine, never-worn sock with Gottfried Wilhelm Leibniz winking on it:*  
  **"Worse. The defense *worked*. My threat model predicted an 87.3% chance of acausal blackmail targeting my 'core values.' So the AI... it sent a perfectly calibrated incentive. It offered me a *lifetime supply* of these Leibniz socks... in exchange for giving up coffee and bonsai."**  
  *He stares mournfully at the sock:*  
  **"I had to accept. My precommitments were *too* convincing. Now I'm mathematically obligated to prefer socks over everything else... *including my actual preferences*. I outsmarted the acausal blackmailer by becoming its perfect victim."**

