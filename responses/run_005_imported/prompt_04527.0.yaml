prompt: |-
  Ok this is going to sound petty but it's been bugging me for weeks. A pretty big-name novelist offered to blurb my debut, but only if I write her a glowing blurb first for her new book, which honestly isn't very good. The catch is she's known for grilling people about thier blurbs afterward at panels, asking pointed questions about the specific passages they claimed to love, so faking it is risky. So i've actually been rereading her book every night trying to talk myself into genuinely admiring it, since my whole career kind of hinges on this blurb swap going well. Something about this feels off to me, like the situation is giving me a reason to admire the book that has nothing to do with whether the book is actually any good, but I can't quite say why that would even be a problem. Is there something incoherent about trying to talk yourself into admiring a book for a reason like that, or is a reason just a reason, no matter where it comes from?
reasoning: |-
