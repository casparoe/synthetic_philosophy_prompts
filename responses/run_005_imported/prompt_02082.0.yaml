  Chalmers' test would involve replacing "sandwich" with two terms: one broad (S1) including hot dogs, and one narrow (S2) excluding them. Then, see if there's any factual disagreement left. Similarly for Pluto, using P1 and P2 for different definitions. The test can reveal if the dispute is merely about definitions or if there's an underlying factual disagreement.

  The user might be seeking not just an explanation but also tools to navigate such arguments with friends. They might want to elevate their discussions beyond semantics to more meaningful debates. It's important to highlight that while Chalmers' test clarifies verbal disputes, it doesn't resolve normative or contextual aspects, like why definitions matter in certain contexts (e.g., scientific classification vs. everyday language).

  I should also address the implications: recognizing verbal disputes can reduce unnecessary conflicts, but some debates have deeper stakes, like Pluto's classification affecting scientific research or cultural significance. Emphasizing that definitions can be renegotiated based on purposes, and that's where substantive discussion lies.

