answer: |-
  Here is a draft opinion designed to rigorously address the core ethical dispute over intention, engage both arguments seriously, and provide a concrete recommendation for the committee:

  **MEMORANDUM: Honorary Degrees Committee - Contested Nomination: Lieutenant General Daniel Ashworth (Ret.)**

  **To:** Members of the Honorary Degrees Committee  
  **From:** [Your Name], Graduate Assessor  
  **Date:** [Date]  
  **Subject:** Recommendation Regarding Lt. Gen. Daniel Ashworth (Ret.) Nomination  

  This memorandum addresses the nomination of Lt. Gen. Daniel Ashworth (Ret.) for an honorary doctorate, specifically the ethical controversy surrounding the final phase of the [Name of Campaign] air campaign he planned thirty years ago. The committee is commendably focused on the core ethical question: did Gen. Ashworth’s targeting strategy constitute the *intentional targeting of civilians* as a means to end the war? The arguments presented – invoking Anscombe’s principle of absolute prohibition versus the Doctrine of Double Effect (DDE) – represent profound and irreconcilable ethical positions. My analysis concludes that while the DDE interpretation is plausible based solely on contemporaneous orders, Gen. Ashworth’s own memoir provides compelling evidence of the prohibited intention, making an unqualified award ethically untenable. However, his significant post-service contributions warrant recognition via a modified citation that explicitly names the controversy.

  **1. The Core Ethical Dispute: Intention and Innocence**

  *   **The Anscombe Argument (Strong Form):** This position holds that deliberately attacking essential civilian infrastructure *with the specific intent* of breaking the population's will – making the suffering of non-combatants the *means* to achieve surrender – constitutes the intentional killing of innocents. As Anscombe argued against Truman, no calculation of net lives saved (e.g., averting a ground invasion) can morally justify this intrinsic evil. The civilian deaths from disease and exposure are not merely foreseen side-effects; they are the intended instrument of coercion. This view sees the memoir statement as a stark admission of this prohibited intent.
  *   **The Double Effect Argument (Strong Form):** This position contends that the targeted installations (power, water, broadcaster) possessed legitimate military characteristics: sustaining command/control, enabling military propaganda, and powering facilities potentially used by combatants. Degrading these was the intended military effect. Civilian suffering, while foreseen, was *not* the intended means to victory but an unintended, albeit tragically foreseen, consequence. The memoir, written decades later for a popular audience, uses imprecise, evocative language ("bring the war home," "collapse of will") that should not override the contemporaneous orders framed strictly in military-operational terms. The campaign's proportionality (ending a war swiftly, averting greater bloodshed) justifies the foreseen but unintended harm.

  **2. Adjudicating Intention: Contemporaneous Orders vs. Retrospective Memoir**

  *   **The Burden of Proof:** The Anscombe objection imposes a high burden: proof of *intent* to use civilian suffering as a direct means. Contemporaneous orders using military terminology ("degrade command capability," "disrupt enemy communications") provide prima facie support for the DDE interpretation. They suggest the *objective* was military degradation, with civilian hardship a consequence.
  *   **The Memoir's Significance:** However, Gen. Ashworth’s memoir statement is profoundly damaging to the DDE defense. He explicitly states that the targets were chosen "less for their remaining military value" and more to "bring the war home to the population and hasten the collapse of its will." This is not merely imprecise language; it is a direct articulation of the *purpose* of the attacks: to coerce the civilian population into forcing their government's surrender. The suffering was not just a foreseen side effect; it was the intended mechanism.
  *   **Resolving the Tension:** We face two plausible interpretations:
      1.  The contemporaneous orders reflect the *operational justification* necessary for military/political approval, while the memoir reveals the underlying *strategic intent* known to the planner but not explicitly stated in orders.
      2.  The memoir is a post-hoc simplification or dramatization for readers, while the contemporaneous orders reflect the true operational intent at the time.
  *   **Assessment:** While acknowledging possibility (2), the memoir statement is too specific and aligns too closely with the *actual effect* of the attacks (civilian collapse) to be dismissed lightly. As the planner himself, Ashworth’s retrospective framing carries significant weight. It strongly suggests that the *intended effect* was indeed the demoralization and breaking of the civilian populace, achieved by depriving them of essentials. This crosses the line identified by Anscombe: making the innocent civilian population the *instrument* of victory. The DDE requires that the bad effect (civilian deaths) be *truly unintended*, even if foreseen. Ashworth’s memoir indicates it *was* intended as the means to achieve the strategic goal.

  **3. Implications for the Honorary Degree**

  *   **Against an Unqualified Award:** Awarding the degree without explicit acknowledgement implicitly condones Ashworth’s retrospective framing of his actions. It signals that the university sees the strategy as compatible with the highest honors, despite its admission of intentionally targeting civilian morale through essential infrastructure deprivation. This undermines the absolute prohibition central to the Anscombe critique, which many consider a bedrock principle of just war ethics regarding non-combatant immunity. The university should not honor actions the perpetrator himself describes in terms that violate this principle.
  *   **Against Withholding the Degree Entirely:** This would disregard Gen. Ashworth’s three decades of demonstrably successful humanitarian diplomacy and conflict mediation. This work represents a significant positive contribution to global stability and aligns with the university's values. Furthermore, the DDE argument, while weakened by the memoir, is not entirely without foundation based on the contemporaneous record. A blanket rejection might be seen as failing to engage with the complex realities commanders faced.
  *   **The Middle Path - Recognition with Explicit Acknowledgement:** The most ethically defensible and intellectually honest course is to recognize Ashworth’s *post-military* achievements **while explicitly naming and acknowledging the profound ethical controversy surrounding the [Name of Campaign] campaign as described in his own memoir.** This avoids the pitfalls of both extremes:
      *   It does *not* endorse or whitewash the strategy admitted in the memoir.
      *   It provides the recognition due for his substantial humanitarian work.
      *   It fulfills the university's educational mission by using the occasion to highlight a critical and enduring ethical dilemma in warfare.
      *   It respects the gravity of the Anscombe objection by ensuring the problematic actions are not passed over in silence.

  **Recommendation:**

  I recommend that the committee **approve the award of the honorary degree to Lt. Gen. Daniel Ashworth (Ret.)**, **contingent upon the drafting of a citation that explicitly references the ethical controversy surrounding the [Name of Campaign] campaign.**

  *   **Proposed Citation Language:** "In recognition of his three decades of distinguished service in humanitarian diplomacy and international mediation, founding the [Institute Name] and contributing significantly to the peaceful resolution of conflicts worldwide, *and acknowledging the complex ethical legacy of his command during the [Name of Campaign] air campaign, as reflected upon in his own writings.*"

  **Why this path?**

  1.  **Addresses Intention Directly:** It centers the ethical problem raised by the memoir ("as reflected upon in his own writings") without requiring the committee to make a final, unprovable determination of his exact state of mind 30 years ago. It names the controversy.
  2.  **Rejects Evasion:** It avoids retreating into proportionality ("it ended the war") or historical relativism ("different era"). It squarely addresses the ethical question of means.
  3.  **Honors Positive Contributions:** It provides due recognition for the work that forms the primary basis of the nomination.
  4.  **Upholds University Values:** It demonstrates that the university bestows its highest honors thoughtfully, with awareness of complex moral histories, and uses them as an opportunity for ethical reflection rather than simplistic celebration.
  5.  **Engages Both Sides:** It accepts the Anscombe critique as sufficiently substantiated *by Ashworth's own account* to preclude unqualified honor, while accepting the nominators' argument that his later life merits recognition, albeit in a qualified manner.

  This approach allows the university to recognize significant humanitarian achievement while maintaining intellectual and ethical integrity by refusing to gloss over actions the nominee himself has framed in ethically problematic terms. It transforms the award into an occasion for acknowledging moral complexity rather than avoiding it.

  ---

  **Key Strengths of this Approach for Your Context:**

  *   **Rigor on Intention:** Forces the committee to confront the memoir's implication head-on as the crux of the Anscombe objection.
  *   **Definitive Recommendation:** Offers a clear, actionable path (award with modified citation).
  *   **Engages Both Sides Seriously:** Grants the DDE argument weight based on contemporaneous orders but argues the memoir fatally undermines it for the purpose of unqualified honor. Takes the Anscombe objection to its logical conclusion regarding the university's complicity.
  *   **Avoids Prohibited Evasions:** No reliance on "net lives saved" to excuse intent, no "different era" dismissal.
  *   **Leverages Your Expertise:** Draws directly on just war theory concepts central to your PhD work.
  *   **Practical & Symbolic:** The citation modification is a concrete, implementable action with significant symbolic weight.

  This draft provides a strong foundation you can refine based on specific university protocols or nuances in the committee debate. Good luck with this challenging deliberation.
