answer: |-
  This is a genuinely insightful question that cuts to the heart of interpersonal obligations, trust, and the nature of informal agreements. Jess's reaction, while perhaps surprising to you, points to something deeper than just the logistics of the move. Here's a breakdown of why her perspective likely holds weight, drawing on concepts relevant to your philosophy of action class:

  1.  **The Collective Commitment ("We're Both Coming"):** Your text wasn't just two separate, individual promises to Mia ("I'll be there," "I'll be there"). It was framed as a *joint* commitment: **"we're both coming."** This phrasing creates a small unit of agency – a "we" – undertaking the action together. By unilaterally withdrawing, you dissolved that "we" without consulting the other member (Jess). You didn't just bail on Mia; you bailed on the *joint endeavor* you and Jess had implicitly formed. This is the core of her feeling "left hanging." She was part of a duo, and you dissolved it without notice.

  2.  **Reliance and Interdependence:** When you make a joint commitment like this, even informally, the parties involved start to *rely* on each other. Jess likely:
      *   **Relied on your presence:** She might have mentally planned tasks assuming you'd both be there (e.g., "He can help with the heavy stuff while I pack boxes").
      *   **Relied on the shared responsibility:** Knowing you were both committed likely made the task feel less daunting or burdensome *for her*. Your withdrawal shifted the perceived weight of responsibility disproportionately onto her shoulders, even if others showed up. She felt the *absence* of the partner she expected to share the load with.
      *   **Felt exposed:** Suddenly, she was the sole representative of the "we" that had committed. This can feel awkward or put undue pressure on the remaining person.

  3.  **The Obligation Arises from Relationship, Not Formality:** Obligations in friendships aren't solely created by formal promises like contracts. They arise from:
      *   **Mutual Understanding:** The shared understanding created by your joint message ("we're both coming") established an expectation of mutual participation.
      *   **Relational Norms:** Friendships operate on norms of reliability, reciprocity, and consideration. Backing out of a joint plan for a better offer, without consulting the other person you made the joint commitment *with*, violates the norm of consideration and reciprocity. It signals that your personal benefit outweighed your commitment to the shared plan and the reliance you created in your friend.
      *   **The Act of Commitment Itself:** Simply stating you will do something, especially jointly, creates a weak but real obligation. Breaking it requires justification proportional to the commitment's weight. "I got a better offer" often isn't seen as sufficient justification for breaking a prior commitment to a friend, even an informal one, especially when it impacts them directly.

  4.  **"No Harm, No Foul" is Insufficient:** Your argument that "no harm resulted" because the move got done focuses purely on the *outcome for Mia*. Jess's complaint is about the *process and the relational impact on her*:
      *   **Harm to Trust:** You demonstrated unreliability within a specific joint context. This makes her question your reliability in future joint endeavors.
      *   **Harm to Consideration:** You didn't consider how your unilateral decision would impact *her* experience of the event she was still committed to. You treated the commitment atomically (your individual promise to Mia) rather than relationally (your joint commitment with Jess).
      *   **Harm to the Joint Agency:** You dissolved the "we" without consent. This feels disrespectful to the partnership implied in the joint statement.

  5.  **Why "Just Texts" Doesn't Nullify This:** The informality of the medium (text) doesn't negate the *content* of the message ("we're both coming") or the *context* (a favor for a mutual friend requiring effort). Friends rely on each other's word, communicated via text, call, or in person. The expectation was set clearly.

  **Was Jess "Right" to be Upset?**

  *   **Yes, her feelings are valid and understandable.** Her sense of being "left hanging" stems from a genuine breach of the implied joint commitment and the relational norms of friendship. The *intensity* of her anger might be debatable, but the *source* of her frustration is solid.
  *   **You likely underestimated the relational weight of the "we."** You focused on the outcome for Mia and your individual replaceability, overlooking the specific bond of reliance and shared responsibility created between you and Jess by framing it as a joint action.

  **Who is "in the right"?**

  This isn't purely about right/wrong, but about differing interpretations of commitment. However:

  *   **Social Norms & Friendship Ethics:** Jess's interpretation aligns more closely with common expectations within friendships regarding reliability, joint commitments, and consideration. Backing out of a pre-arranged plan (especially a chore!) for a purely preferential reason (a fun event) without consulting the person you made the *joint* plan with is generally seen as poor form.
  *   **Your Action's Weakness:** Your justification ("better offer," "no harm done") ignores the specific relational impact on Jess and the dissolution of the "we." It prioritizes individual benefit over a prior joint commitment.

  **The Philosophical Connection (Group Action):**

  Your class is incredibly relevant! Think about:

  *   **Shared Intention:** Did you and Jess form a shared intention to help Mia *together*? Your text strongly suggests "yes." Your withdrawal violated that shared intention without dissolving it jointly.
  *   **Joint Commitment:** (Think Margaret Gilbert, Michael Bratman). Your joint statement created a rudimentary joint commitment. You are obligated to the other party (Jess) in that commitment, not just to Mia. Breaking it wrongs Jess directly.
  *   **Collective Responsibility:** While the *task* was collective (helping Mia), the *sub-group* (you and Jess) formed a smaller collective unit. You abdicated your role within that unit.

  **Conclusion:** Jess's complaint has substance. The obligation arose from the joint nature of your commitment ("we're both coming"), which created mutual reliance and a small unit of shared agency. By unilaterally withdrawing for a preferential reason without consulting her, you violated the norms of that joint commitment and demonstrated a lack of consideration for *her* reliance and experience. While the move got done, the relational harm was to the trust and mutual reliance between you and Jess. Understanding this "jointness" is key to resolving why she felt "left hanging" and why "no harm to Mia" wasn't the point. It might be worth apologizing to Jess, acknowledging that you now understand why she felt let down *by you specifically*, not just why Mia might have been inconvenienced.
