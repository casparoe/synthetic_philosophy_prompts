prompt: |-
  Okay this is a pretty random request but my Latin IV class just spent basically all of April translating chunks of Cicero's De Senectute ("On Old Age" -- the one where he's writing as this old Roman guy Cato, talking to two younger guys named Scipio and Laelius about how getting old isn't actually the disaster everyone assumes), and now my grandpa's 90th birthday party is in two weeks and my mom volunteered me to give the toast because apparently I'm "good with words."

  What stuck with me from the unit is that Cato doesn't just say "old age is fine, stop worrying" -- he lists out four specific complaints people have about getting old (that it pulls you out of an active life, that it wrecks your body, that it takes away your pleasures, and that it's basically a waiting room for death) and answers each one like a lawyer going point by point. My favorite is his answer to the first one, where he compares an old man running things to a ship's pilot just sitting calmly at the helm while the young guys climb the masts and bail water -- the old guy isn't doing less, he's doing the more important part.

  I want to build my toast the same way, four points and all, instead of doing the usual "you're not old, you're vintage!" stuff, but I obviously can't just read my grandpa's guests a book report -- it's mostly gonna be his old coworkers and his card game buddies, nobody who's heard of Cicero. Can you write me an actual toast, like 3-4 minutes out loud, that goes through those same four complaints and answers each one with stuff that's actually true of my grandpa specifically (he had to sell his hardware store two years ago but still calls the new owner weekly with "suggestions," he's on a cane now and moves way slower, doctor's got him off spicy food and down to one beer, and yeah, hes 90 so the death one isnt exactly an abstract issue for him)? If you could work in that image Cicero uses about ripe fruit finally dropping off the tree on its own instead of being torn off early, or the bit about a good last act of a play, that'd be perfect -- as long as it still lands sweet and not like a eulogy. I don't have my notes with me right now so just go with the general shape of the arguments.
