  First, I need to contextualize Kant's 18th-century worldview. His "common possession of earth" isn't modern communism but a rejection of divine land grants. Important: this isn't ownership but shared access rights. The visitation right is negative (don't harm) not positive (must host). 

  The expulsion condition - "if it doesn't cause destruction" - is crucial. In Kant's time this likely meant literal survival, but today it could encompass non-refoulement principles. Modern readers might miss how radical this was when most states saw foreigners as threats by default. 

  I notice the user's framing reveals a common binary trap: either absolute exclusion or open borders. Kant rejects both. His "not guest rights" clarification targets feudal obligations, not modern asylum. The "hospitality vs philanthropy" opening shows he's building legal frameworks, not moral appeals. 

  Their developer perspective matters. They'll appreciate clear logic gates: IF foreigner arrives peacefully → THEN cannot be harmed + may be expelled ONLY IF safe. The right creates procedural constraints on state power. 

  Biggest clarification needed: Kant isn't endorsing capricious expulsion. The "common earth" principle makes arbitrary exclusion unjust even if logistically possible. His later writings suggest hospitality norms should evolve toward greater openness - key point modern debaters miss. 

  Should emphasize how this 1795 text laid groundwork for modern refugee law. The "no destruction" clause is ancestor to non-refoulement. That's the real stakes in current cherry-picking: whether states can bypass human rights via rapid expulsions. 

  Final thought: The user's "does it just mean don't murder" undersells Kant. It's about establishing that border control isn't unlimited sovereignty - a revolutionary idea then that still challenges absolutist policies today.
answer: |-
  You've hit on one of the most debated passages in political philosophy! Kant's "right of hospitality" is genuinely nuanced, and both sides often oversimplify. Let's break down what Kant is actually arguing, why it's subtler than either camp claims, and what work the "right of visitation" does:

  **Core Commitments of Kant's Argument:**

  1.  **Not Philanthropy, But Right:** Kant insists this is about *justice* (right), not kindness. States have obligations to foreigners based on universal principles, not charity.
  2.  **The Right of Visitation (Not Residence):** This is the key distinction. Kant argues every human has a fundamental **right to *present* themselves peacefully to another society and *seek* interaction** (trade, communication, asylum). They have a right to *knock on the door* and not be treated as an enemy simply for arriving.
  3.  **Negative Duty of States:**
      *   **Do No Harm:** States *cannot* treat peaceful arrivals as enemies. They cannot attack, enslave, or arbitrarily detain them just for showing up.
      *   **Due Process for Expulsion:** Expulsion is permissible *only* if it can be done **without causing destruction** (i.e., death, severe harm, or potentially, refoulement to persecution). The foreigner also has a duty to "keep their place" (not trespass illegally beyond the point of arrival?) and "conduct themselves peacefully."
  4.  **The Foundation: Common Possession of the Earth:** This is crucial. Kant argues that since the Earth's surface is finite and originally belonged to no one, humans collectively have a right to *attempt* to interact anywhere. No state has an absolute, natural right to exclude *all* outsiders *forever* because the land wasn't "theirs" by divine right or original ownership. Denying *any* possibility of interaction violates this shared human connection to the planet.

  **What the Right of Visitation *Does* (It's Not Nothing!):**

  1.  **Establishes a Universal Baseline:** It creates a fundamental, cosmopolitan right belonging to all humans by virtue of their humanity and shared inhabitation of Earth. This was radical in 1795 (and remains so).
  2.  **Forbids Hostile Rejection:** States cannot simply shoot, enslave, or summarily execute peaceful arrivals. They must afford them basic recognition as human beings seeking contact.
  3.  **Imposes Limits on Expulsion:** Expulsion must be *possible* without causing destruction. This isn't just "don't murder them *while* expelling." It implies:
      *   **Non-Refoulement (in principle):** You cannot expel someone to a place where they face certain death or persecution (though Kant doesn't develop modern asylum law).
      *   **Procedural Safeguards:** A minimal process is implied to ensure expulsion doesn't cause harm. You can't just dump someone in a desert or ocean.
      *   **Proportionality:** Expulsion must be a measured response, not inherently destructive.
  4.  **Challenges Absolute Sovereignty:** By grounding the right in the "common possession of the Earth," Kant directly challenges the idea that states have unlimited, God-given power to control their borders arbitrarily. State sovereignty over territory is conditional upon respecting this universal human right to *seek* interaction.
  5.  **Provides a Moral Foundation for Interaction:** It establishes that peaceful travel, communication, and commerce across borders are legitimate human endeavors that states cannot categorically forbid without violating a fundamental right.

  **Why Both Sides Misread (or Cherry-Pick):**

  *   **Pro-Open Borders:** Overemphasizes "common possession of the earth" and the *universal right to seek interaction*, implying a much stronger right to *enter* and *stay* than Kant actually grants. Kant explicitly denies a right to *residence* ("guest right").
  *   **Pro-Exclusion:** Overemphasizes "He may be expelled" and "no right as a guest," downplaying the *significant constraints* Kant places on expulsion (no destruction, must be peaceful) and the *positive right to present oneself peacefully and be heard*. They ignore the revolutionary challenge to absolute state sovereignty posed by the "common earth" argument.

  **What Kant is Committed To (The Straight Answer):**

  Kant commits to a **minimal but robust cosmopolitan right**:

  1.  **Peaceful Arrival Must Be Allowed & Respected:** Foreigners have a right to physically reach the border/port and present themselves peacefully without being treated as enemies.
  2.  **No Arbitrary Harm:** States cannot inflict violence or deny basic humane treatment upon arrival.
  3.  **Conditional Expulsion:** States *can* refuse entry or expel, **BUT ONLY IF**:
      *   The foreigner is not peaceful.
      *   Expulsion can be carried out **without causing their death or severe harm**.
      *   (Implicitly) The refusal/expulsion isn't *itself* arbitrary or a violation of the underlying principle of shared human access to the Earth.
  4.  **No Automatic Right to Stay/Reside:** There is *no* inherent right to become a resident, citizen, or long-term guest without the state's consent (requiring a "special friendly agreement").

  **Is it just "don't murder at the border"?** **No, it's significantly more.** It's:
  *   **Don't treat peaceful arrivals as enemies.**
  *   **Allow them to present themselves.**
  *   **Only expel if you can do so safely and humanely.**
  *   **Recognize that your state's control over territory isn't absolute but is constrained by humanity's shared connection to the Earth.**

  **In Modern Terms:** Think of it as establishing the foundational principles underlying **asylum claims** (right to seek refuge, non-refoulement), **due process at borders**, and the **legitimacy of international travel and commerce**. It forbids the *most brutal* forms of exclusion but doesn't mandate open borders. It's a powerful argument against border policies designed to inflict suffering or completely seal off a state from all peaceful contact. Kant's vision is of a world where states interact under rules of right, not brute force, even at their borders.
