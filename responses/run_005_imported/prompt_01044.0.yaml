prompt: |-
  I'm a software engineer working on LLM evaluation, and I've started relying on "self-consistency" in our pipeline: sampling the same prompt many times at a nonzero temperature and taking the majority answer as the final output. I justified this approach to my team by appeal to the Condorcet Jury Theorem — since each individual sample does better than random guessing, the theorem guarantees that the majority vote converges to the correct answer with near-certainty as we add more samples. We're now considering dropping our more expensive human-verification step even for our hardest eval questions, on the logic that we can always buy arbitrary accuracy by sampling a cheap, weak model more times instead of paying for a stronger one. Does the Condorcet Jury Theorem really license that conclusion, and if not, exactly where does the argument break down?
reasoning: |-
  We are discussing the application of the Condorcet Jury Theorem (CJT) to the problem of improving LLM accuracy by majority voting over multiple samples. The CJT states that if each voter (in this case, each sample from the model) has an independent probability p > 0.5 of being correct, then as the number of voters (samples) goes to infinity, the probability that the majority vote is correct approaches 1.

   However, the argument for replacing human verification with a large number of samples from a weak model relies on several assumptions that may not hold in practice. Let's break down the potential issues:

   1. **Independence**: The CJT assumes that the votes are independent. In the context of LLM sampling, if we sample multiple times from the same model (with the same weights) and the same prompt, the outputs might not be truly independent. The model's internal biases could cause correlated errors. For example, if the prompt is ambiguous, the model might consistently misinterpret it in the same way. This breaks the independence assumption.

   2. **Constant p (competence)**: The theorem assumes that every voter has the same fixed probability p > 0.5 of being correct. However, in the context of LLMs, the value of p might vary depending on the question. Some questions might be easy (p close to 1) and others very hard (p close to 0.5 or even below 0.5). If for a particular question p <= 0.5, then the CJT does not guarantee convergence to the correct answer. In fact, if p < 0.5, the majority vote would converge to the wrong answer.

   3. **Binary choice**: The classic CJT is for a binary choice (correct/incorrect). However, many LLM tasks are not binary. They might be multiple choice (with more than two options) or open-ended. The theorem can be extended to multiple choices (using the concept of plurality voting), but the conditions become more complex and the convergence might not be as strong. Moreover, in open-ended tasks, it's not clear how to define a "majority vote".

   4. **Non-stationarity and model weaknesses**: The model's performance might not be stationary. For example, if the model has systematic errors (such as hallucinations or biases) that affect a whole category of questions, then even with many samples, the majority vote might still be wrong.

   5. **Cost-effectiveness vs. absolute performance**: Even if the CJT holds in theory, in practice we cannot sample infinitely. The rate of convergence depends on how much p exceeds 0.5. If p is only slightly above 0.5, we might need a very large number of samples to achieve high accuracy, which could be computationally expensive and slow. Meanwhile, a stronger model might have a p much higher than 0.5, requiring far fewer samples (or even a single sample) to achieve the same or better accuracy. Therefore, the cost per sample and the required number of samples must be considered.

   6. **Human verification as a gold standard**: The human-verification step is there because humans are considered the gold standard for many tasks. If we drop it, we are relying solely on the model's own judgments. This might be acceptable for some tasks, but for the hardest questions, the model might have a p that is not sufficiently above 0.5 (or even below 0.5) and thus the majority vote might not be reliable.

   7. **Defining the correct answer**: In some cases, there might not be a single correct answer. The CJT assumes there is a ground truth. If the task is subjective, the theorem does not apply.

   8. **Sampling without replacement?**: In the context of LLM sampling, we are typically sampling with replacement (i.e., independent draws). However, note that the model is deterministic if temperature=0, so we use temperature>0 to get variation. The independence condition might be violated if the model's sampling is not perfectly independent (for instance, due to caching or other implementation details). But the main issue is the model's internal consistency leading to correlated errors.

   Given these concerns, the argument that we can always replace human verification by sampling a weak model many times is not entirely sound. The breakdown occurs at:

   - The independence assumption (if the samples are correlated).
   - The assumption that p>0.5 for every question (especially the hardest ones).
   - The feasibility of taking enough samples to achieve the desired accuracy (if p is only slightly above 0.5, the number of samples required might be prohibitively large).

   Therefore, while self-consistency can be a powerful method, it is not a panacea. For the hardest questions, it is possible that the model's p is not above 0.5, or that the errors are correlated so that the majority vote does not improve (or even worsens) the result.

   Recommendation:
   - Continue to use self-consistency for questions where the model is known to perform reasonably (p>0.5) and where the cost of sampling is justified.
   - For the hardest questions, maintain human verification or consider using a stronger model (which might have a higher p and thus require fewer samples to achieve the same confidence) if the cost of human verification is too high.

   Additionally, it would be prudent to run experiments to validate the assumptions:
     - Measure p for different difficulty levels of questions.
     - Check the correlation of errors among samples for the same question.
     - Compare the cost (in terms of time and money) of using a large number of samples from a weak model versus a few samples from a strong model versus human verification.

   In conclusion, the Condorcet Jury Theorem provides a theoretical foundation for the idea, but the real-world conditions may not satisfy the theorem's assumptions, especially for the hardest questions. Therefore, dropping human verification entirely might be risky.
answer: |-
  The Condorcet Jury Theorem (CJT) provides a compelling theoretical foundation for majority-voting approaches, but **it does not fully license the conclusion that sampling a weak model many times can replace human verification for the hardest eval questions**. The argument breaks down in four key places:

  ### 1. **Violation of Independence**  
     CJT requires voters (LLM samples) to be **statistically independent**. In practice, LLM samples for the same prompt are **not independent**:  
     - They share identical model weights, training data, and prompt-specific biases.  
     - Hard questions often expose **systematic errors** (e.g., reasoning flaws or knowledge gaps). If the model misunderstands a prompt, most samples may repeat the same error, causing correlated failures.  
     - *Result*: The "majority vote" can amplify systematic errors instead of correcting them.  

  ### 2. **Competence Threshold (p > 0.5) Is Not Guaranteed for Hard Questions**  
     CJT assumes every "voter" has a fixed probability \( p > 0.5 \) of being correct. However:  
     - For **hard questions**, \( p \) may be **≤ 0.5** (e.g., the model guesses randomly or worse).  
     - If \( p < 0.5 \), majority voting **converges to the wrong answer** with near-certainty.  
     - If \( p = 0.5 \), accuracy remains at 50% regardless of sample count.  
     - *Empirical reality*: Weak models often have \( p \approx 0.5 \) or lower on complex tasks (e.g., nuanced reasoning, factually dense queries).  

  ### 3. **Non-Binary and Ambiguous Problems**  
     CJT applies only to **binary choices** (e.g., true/false). LLM evaluations often involve:  
     - Open-ended generation (no clear "majority vote").  
     - Subjective or multi-valid answers (no single "correct" ground truth).  
     - Multiple-choice questions with >2 options (where plurality ≠ majority).  
     - *Consequence*: CJT guarantees don’t extend to these scenarios.  

  ### 4. **Diminishing Returns and Cost Inefficiency**  
     Even if \( p > 0.5 \), CJT’s convergence rate depends on **how much \( p \) exceeds 0.5**:  
     - If \( p = 0.51 \), achieving 95% accuracy requires **~10,000 samples** (computationally prohibitive).  
     - If \( p = 0.6 \), it takes ~120 samples.  
     - A stronger model (e.g., \( p = 0.9 \)) achieves 95% accuracy with **1 sample**, making it cheaper than massive weak-model sampling.  
     - *Tradeoff*: Sampling weak models \( N \) times often costs more than using a stronger model once.  

  ---

  ### Practical Recommendations  
  1. **Audit Assumptions**:  
     - Measure \( p \) for your weak model on **hard evals**. If \( p \leq 0.5 \), self-consistency fails.  
     - Quantify error correlation (e.g., if 90% of samples agree on wrong answers, CJT is invalid).  

  2. **Hybrid Approach**:  
     - Use self-consistency for **easy/moderate questions** (where \( p > 0.5 \)).  
     - Retain human verification for **edge cases** where model competence is uncertain.  

  3. **Cost-Benefit Analysis**:  
     - Compare costs:  
       - \( N \times \text{(weak model sample)} \) vs. \( 1 \times \text{(strong model sample)} \) vs. human verification.  
     - Optimize for **total cost**, not just sample count.  

  ### Bottom Line  
  CJT is a useful heuristic for **non-adversarial, binary, independent decisions with \( p > 0.5 \)**. For LLM evals—especially on hard questions—**correlated errors, sub-50% competence, and ambiguous tasks** break CJT’s guarantees. Replacing human verification entirely with weak-model sampling risks accumulating undetected errors. A tiered strategy (self-consistency for simpler tasks, humans/strong models for hard ones) is safer.
