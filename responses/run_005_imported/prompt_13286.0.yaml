  Okay, let me unpack this retired chemist's query. He's clearly done his homework - diving into Wolf's "Moral Saints," tracking the Reformation critique of supererogation, and even wrestling with the Thirty-Nine Articles' dense language. His core question is sharp: does this 16th-century theological argument have teeth against modern secular ethics?

  First, I need to parse Article XIV's logic. That "unprofitable servants" quote from Luke 17:10 is key - it establishes a theological framework where human effort can never exceed obligation before an infinite God. The minister's point about Catholic merit theology provides crucial context: the reformers saw claiming "extra credit" works as implying humans could outdo divine expectations. 

  But how does this translate to secular ethics? Modern philosophers like Urmson treat supererogation as acts beyond the call of duty - think risking your life for a stranger. The theological objection hinges on three premises that don't cleanly transfer: God's maximal claim on obedience, the impossibility of human merit accumulation, and salvation by grace alone. Without those, the "arrogance" charge loses its force. 

  Still, there might be residual tension. Wolf's worry about "moral saints" echoes the reformers' suspicion of moral boasting. And if secular duties are construed broadly enough (say, negative utilitarianism), one could argue there's always more to do. But that seems strained - few ethicists deny category differences between duties and heroic acts. 

  The real value here is historical: seeing how theological concepts shape philosophical discourse. I'll structure the response to contrast the frameworks while honoring the query's depth - this chemist deserves careful signposting between Reformation theology and contemporary ethics.
answer: |-
  Your analysis is spot-on - this 16th-century theological argument operates on fundamentally different premises than modern secular ethics. Let's break it down systematically:

  **1.  Dissecting Article XIV's Logic:**
     - **The Arrogance Claim:** At its core, the objection isn't about *doing* good deeds beyond the minimum, but about *claiming* them as "supererogatory" *merit*. The reformers argued:
       *   **Maximal Divine Claim:** God's commandments encompass our *total* moral obligation ("bounden duty"). There is no "beyond" because God rightfully demands our *entire* devotion (heart, soul, mind, strength - Mark 12:30). Any "extra" is merely fulfilling what was already owed.
       *   **Human Insufficiency:** The "unprofitable servants" parable (Luke 17:7-10) is crucial. Even perfect obedience merely discharges a debt; it doesn't create a surplus. We *always* owe God more than we can repay. Claiming to have "overpaid" denies our inherent insufficiency and dependence on grace.
       *   **Judgment Belongs to God:** Humans cannot definitively assess their own moral surplus before God. Declaring one's works "supererogatory" presumes a level of self-knowledge and divine accounting that humans lack, usurping God's role as judge.
     - **The Impiety Claim:** This stems from the perceived conflict with the doctrine of salvation:
       *   **Grace vs. Merit:** The Reformation emphasized *sola gratia* (grace alone). Salvation comes through God's grace received by faith, not earned by works. The Catholic "treasury of merit" implied human works could generate surplus credit transferable to others (via indulgences). Article XIV rejects this as impious because it undermines the sufficiency of Christ's sacrifice and the necessity of grace.

  **2.  Secular Supererogation vs. Theological Objections:**
  Modern philosophers (Urmson, Heyd, Wolf, etc.) define supererogation in purely ethical terms: **acts that are morally praiseworthy but not obligatory, whose omission is not blameworthy.** Does the Article XIV critique apply here?

     - **Crucial Disconnects:**
       *   **No Divine Claim:** Secular ethics lacks an entity with an infinite, maximal claim on human action. Duties are typically bounded (e.g., negative duties, specific positive duties) leaving room for optional "above and beyond" acts (e.g., heroic rescues, extreme generosity).
       *   **No Soteriology:** The secular concept isn't tied to earning merit for salvation or building a "treasury." Praise is social/human, not divine accounting.
       *   **No Presumption of Moral Self-Sufficiency:** Calling an act supererogatory doesn't imply the agent has *fully discharged all moral obligations forever*. It simply means *this specific act* exceeds what duty *demands in this specific context*. One can recognize a heroic act while acknowledging other unmet obligations.
       *   **Focus on Action, Not Boasting:** The philosophical concern is defining the *category* of action, not the agent's *claim* about their merit. An agent might perform a supererogatory act *humbly*, precisely *without* claiming surplus merit.

     - **Potential Points of Friction (Where Theology *Might* Bite, but Weakly):**
       *   **Infinite Obligation?** Some secular theories (e.g., strong negative utilitarianism, Singer's "Famine, Affluence, and Morality") argue our duty to prevent harm is extremely demanding, potentially leaving *little room* for true supererogation. This *vaguely echoes* the maximal claim idea, but it's argued consequentially, not theologically. Most theories reject this maximalism.
       *   **Motivational Arrogance?** If someone performs a "supererogatory" act *while explicitly claiming moral superiority or surplus merit*, secular ethics would also find this objectionable on grounds of arrogance/virtue ethics (as Wolf discusses). But this is a critique of the *agent's attitude*, not the *category* of action itself. The act can be supererogatory *even if* performed humbly.
       *   **Who Judges?** Secular ethics relies on intersubjective or rational criteria for defining duties and supererogation, not divine authority. The "arrogance" of defining the category is distributed socially/philosophically.

  **3.  Why "Unprofitable Servants" Clinches the Point (Theologically):**
  For the reformers, this parable wasn't just about humility; it was a *metaphysical statement about the human condition before God*:
     - **The Master-Servant Relationship:** The servant works *for* the master by definition. His labor is *owned* by the master. He cannot work "extra" because all his time and effort already belong to the master.
     - **The Expectation of Full Obedience:** The master expects the servant to do all commanded. Completing tasks isn't going "beyond," it's meeting the baseline expectation.
     - **The Impossibility of Profit:** The servant's labor doesn't generate "profit" *for the master* beyond what is owed; it merely sustains the relationship. Likewise, humans cannot generate "profit" (surplus merit) for God.

  **Conclusion: A Limited Bite in Secular Ethics**

  The **core theological argument of Article XIV has little direct force against the *secular philosophical concept* of supererogation.** Its objections rely entirely on premises foreign to secular ethics:
  1.  An infinite Divine claimant with maximal rights over human action.
  2.  A soteriological system where human merit impacts salvation.
  3.  A metaphysical view that humans can never discharge their full debt to God.

  Where there *might* be resonance is in:
  *   **Critiques of Boasting:** If claiming supererogatory acts involves *personal arrogance about moral surplus*, secular virtue ethics would agree this is objectionable.
  *   **Highly Demanding Secular Theories:** If secular duty is defined so expansively that *no* acts are truly beyond it, supererogation disappears – but this is argued on secular grounds (e.g., consequentialism), not theological ones.

  Your insight is correct: Article XIV is primarily targeting the *theological economy of merit* underlying Catholic practices like indulgences. The secular philosophical project of defining a category of morally optional, praiseworthy actions operates on a different plane. The "arrogance" charge only translates if one imports the theological framework where *all* action is owed to an infinite creditor – a framework modern ethics generally rejects. Your book club's minister identified the crucial historical-theological context, but applying its logic directly to Urmson or Wolf requires premises they explicitly don't share.
