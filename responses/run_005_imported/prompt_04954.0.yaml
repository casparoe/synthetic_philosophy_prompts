answer: |-
  Here's a comparison of the Lewisian counterfactual-dependence account and the Dowean physical-process account regarding omissions and the selection problem, focusing on which offers a more principled treatment:

  1.  **Lewisian Counterfactual-Dependence Account:**
      *   **Core Idea:** Event C causes event E if and only if (a) C and E both occur, and (b) if C had not occurred, E would not have occurred (in the closest possible world(s) where C doesn't occur).
      *   **Treatment of Omissions:** Omissions *can* be causes. The lifeguard's failure (non-event F) causes the swimmer's death (E) if: (a) F (the non-occurrence of noticing/saving) and E (death) occur, and (b) in the closest possible world where F *does not* occur (i.e., where the lifeguard *does* notice and save), E (the death) *does not* occur. This seems intuitively true.
      *   **The Selection Problem:** This is where Lewis faces a *major* challenge. The problem is **overdetermination by omissions**:
          *   Counterfactual (b) holds not just for the lifeguard's failure (F), but for *many* other non-events: the failure of passerby A to warn (non-event G), the failure of passerby B to throw a lifebuoy (non-event H), the failure of the coast guard patrol to be nearby (non-event I), etc.
          *   In the closest worlds where *any* of these positive actions occur (G, H, or I), the death (E) likely wouldn't occur.
          *   Therefore, according to the *basic* counterfactual criterion, *all* these omissions (F, G, H, I...) are causes of E. This clashes massively with our intuition that only the lifeguard (and perhaps the neighbor relying on the gardener) is *the* cause or *responsible*.
      *   **Lewis's Response (Reaching Beyond Core Resources):** Lewis acknowledged this and proposed solutions, primarily relying on **normative expectations** and **defaults**:
          *   We hold the lifeguard responsible because they had a *duty* or *obligation* to act. Passersby generally do not.
          *   We consider the lifeguard's action the *normal* or *expected* course of events preventing harm; their inaction is the deviation. Passersby acting is not the expected norm.
          *   **Critique:** While this aligns with intuition, **it reaches significantly beyond the official resources of the counterfactual theory itself.** The core theory defines causation purely in terms of counterfactual dependence across possible worlds, without any inherent reference to duties, norms, or expectations. Lewis *imports* these normative and pragmatic considerations from outside the theory to solve the selection problem. This makes the selectivity seem *ad hoc* from the perspective of the pure counterfactual analysis.

  2.  **Dowean Physical-Process / Conserved-Quantity Account:**
      *   **Core Idea:** Causation requires a spatiotemporally continuous physical process involving the transfer or exchange of a conserved quantity (like energy or momentum) from cause to effect. C causes E only if there is such a connecting process.
      *   **Treatment of Omissions:** Omissions are *not* genuine causes. An omission is the *absence* of a process/event. Absences cannot initiate or participate in physical processes involving conserved quantity transfer.
          *   The swimmer's death is caused by the physical processes involved in drowning (water entering lungs, oxygen deprivation, etc.). The gardener's plants die due to physical processes of dehydration and wilting.
          *   The lifeguard's failure is the *absence* of an energy-expending saving process. The gardener's failure is the *absence* of a water-transferring process. These absences don't transfer energy/momentum *to* the harm; they are simply the *non-occurrence* of a process that *would have prevented* the harmful process that *did* occur.
          *   Omissions are thus classified as **background conditions** or **preventing conditions** (the absence of a preventer), not causes.
      *   **The Selection Problem:** This account **dissolves the core metaphysical aspect of the selection problem** for omissions:
          *   Since *no* omission is a genuine cause (no conserved quantity transfer), there is no need to explain why we "select" one absence over another *as a cause* at the fundamental level. None are causes.
          *   The selectivity we observe (blaming the lifeguard, not passersby) is then explained **entirely by normative and pragmatic factors**: duties, roles, expectations, intentions, and counterfactual dependencies. The lifeguard *should* have initiated the saving process; a passerby *might* have, but wasn't expected to. The *counterfactual dependence* (if the lifeguard acted, death wouldn't occur) is still true and important for responsibility, but it doesn't signify *causation* in Dowe's sense.
      *   **Critique:** While it cleanly avoids treating omissions as causes, **it arguably pushes the entire issue of selectivity into the realm of responsibility/explanation, separate from causation.** Critics argue this doesn't fully capture our causal *discourse* and intuitions, where omissions *do* seem to be cited as causes ("*What* caused the death? The lifeguard *didn't* save him"). Dowe might say this is loose speech conflating causation with responsibility/counterfactual dependence.

  **Which Theory Gives the More Principled Treatment of Selectivity?**

  *   **Dowe's Physical-Process Account offers the more principled *internal* treatment.** Within its own core definition of causation (requiring physical processes), it provides a clear, objective reason why *no* omission is a cause: absences cannot transfer conserved quantities. The selectivity problem simply doesn't arise *for causation itself* because omissions are excluded categorically. The selectivity we observe is correctly attributed to non-causal factors like norms and duties, which the theory doesn't attempt to define causally. It stays true to its physicalist, process-based ontology.
  *   **Lewis's Counterfactual-Dependence Account has a less principled *internal* treatment.** While it can accommodate omissions *as causes* in principle, its core mechanism (counterfactual dependence) inevitably generates massive overdetermination by countless omissions. To solve the resulting selection problem, it *must* reach outside its official resources (counterfactual relations across possible worlds) and import normative concepts (duties, expectations) that are not part of the core theory's definition of causation. This makes the selectivity seem like an externally imposed fix rather than an outcome of the causal analysis itself.

  **Conclusion:**

  *   **Dowe's theory** provides a cleaner, more principled *causal* treatment of selectivity **by denying omissions are causes at all**, based solely on its core physical-process requirement. Selectivity is handled externally, where it arguably belongs (in discussions of responsibility/explanation).
  *   **Lewis's theory**, while intuitively capturing the importance of omissions for outcomes via counterfactuals, **creates an internal problem of overdetermination by omissions** that its core resources cannot resolve. It **must reach beyond its official resources** (normative expectations) to achieve the necessary selectivity, making its handling less principled *as a theory of causation*.

  Therefore, regarding the *principled treatment of selectivity within the causal theory itself*, **Dowe's physical-process account is superior.** It avoids the problem by its core definition, while Lewis's account generates the problem and requires an external solution. However, Lewis's account may better capture the broader *explanatory and responsibility-related* role that omissions play in our understanding of why events happen, even if it does so at the cost of causal overdetermination.
