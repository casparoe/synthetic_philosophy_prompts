  Then there's Dowe's physical-process account. Here, causation requires a physical connection. Omissions aren't physical processes, so they can't be causes. Instead, omissions are background conditions. The selection problem is addressed by human interests and norms, which the theory doesn't incorporate. So Dowe's view avoids calling omissions causes but doesn't explain why we blame the lifeguard specifically.

