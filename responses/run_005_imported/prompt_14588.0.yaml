  The problem: standard models (possible-worlds, Bayesian) make agents logically omniscient, but real agents are bounded. We want models that avoid omniscience while keeping normative force.

  Approaches:

  1. Impossible-worlds semantics: Extends possible worlds to include impossible worlds where logical truths may fail. This allows agents to not believe all logical truths by having accessible worlds that are impossible. However, it might just relocate the problem (how to constrain impossible worlds?).

  2. Awareness logic: Agents are only aware of a subset of formulas, and they believe only those they are aware of and accept. This avoids omniscience by limiting the set of formulas considered. But it might trivialize by making belief too unconstrained (no rationality constraints on what is believed among the aware formulas).

  3. Algorithmic knowledge: Belief is tied to what the agent can compute via an algorithm. This captures bounded computation. But it might be too tied to a specific algorithm and may not capture normative constraints beyond computability.

  4. Resource-bounded step-logics: Belief is generated by a proof system with limited steps (time, memory). This explicitly models bounded resources. However, it might be too specific to a particular proof system and resource bound, and normative constraints might be weak.

  5. Logical induction: A computable process that learns logical truths over time and satisfies certain desirable properties (calibration, etc.). It avoids omniscience and has strong normative properties. But it is a specific method and might be complex to apply generally.

  6. Plain syntactic/sentential belief models: Belief is just a set of sentences without closure. This avoids omniscience by fiat. However, it lacks any normative constraints (why should the set be consistent? coherent?).

  Evaluation criteria:
  - How well does it avoid logical omniscience without being ad hoc?
