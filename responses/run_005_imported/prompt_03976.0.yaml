answer: |-
  ## The Information Gambit: A Dialogue on Rational Ignorance

  **Characters:**
  *   **Alex:** Advocate for Good's Theorem ("More free info is never worse")
  *   **Sam:** Advocate for Rational Ignorance ("Sometimes knowing less is better")

  **Setting:** A quiet corner of a university library, coffee cups steaming.

  **Sam:** (Leaning back, thoughtful) Okay Alex, rewind. Last night, I was trying to articulate why refusing that genetic test *isn't* irrational. You kept invoking Good's Theorem like it was a universal truth. But I think it has blind spots. Deep ones.

  **Alex:** (Nodding earnestly) And I hear you, Sam. Good's result *is* powerful: For a single Bayesian rational agent facing a decision with free information, peeking *before* deciding has non-negative expected utility. The intuition *is* solid – you can always ignore the info if it doesn't change your optimal action. Ignoring it pre-emptively just locks you out of potential gains. The proof hinges on the agent maximizing expected utility *conditional* on the information received, which by definition can't be worse than the unconditional optimum.

  **Sam:** Right, but the devil's in the assumptions. Take my genetic test. Huntington's, no treatment. Knowing doesn't change my *actions* – there's nothing to *do*. But it absolutely changes my *state of mind*. Years of dread versus blissful ignorance. How does Good handle that?

  **Alex:** Perfectly! Good's Theorem *requires* that your utility function captures everything you care about. If "blissful ignorance" genuinely provides higher utility *for you* than potentially knowing bad news, even if the physical outcome is the same, then that *must* be baked into your utility function. The theorem says peeking at the info and then *acting optimally* (which might include psychological coping strategies you wouldn't use if ignorant) won't make you *worse off* in expectation *according to that utility function*. If "not knowing" is a high-utility state *itself*, then peeking risks lowering utility directly, not just through action. But crucially, the theorem assumes you *only* care about the final outcome of your *decision*. If "knowing vs. not knowing" *is* part of the outcome state you value, then "peeking" isn't free information gathering; it's *part* of the decision outcome. The theorem is about information *before* a decision that affects a separate outcome.

  **Sam:** So you're saying if my utility function explicitly values "not knowing," then *obtaining* the information itself has a cost? That feels a bit like moving the goalposts. Can't we say the utility is purely about my health/longevity outcome, and *still* rationally avoid information that doesn't change actions but causes distress?

  **Alex:** If the utility is *only* about the final health/longevity outcome, and the information doesn't change your actions (because there are none), then the information *cannot change the outcome*. Therefore, the expected utility of knowing vs. not knowing *is identical* if utility only depends on the health state. The theorem holds trivially: zero expected gain, but also zero expected loss. Avoiding it only makes sense if the *act of knowing* imposes a direct psychological cost *that isn't captured in the health-outcome utility*. But that means your true utility function *does* include psychological state as a component. Good's Theorem still applies: with that richer utility, peeking *could* lower utility (due to distress), but it *could also* raise it (relief if negative, or positive planning if positive). The *expected* value calculation *before* peeking might still show a net gain, a net loss, or be neutral, depending on priors and the disutility of knowing bad news vs. the utility of knowing good news. Good's Theorem *doesn't guarantee a gain* if the utility function includes the information state itself as a direct argument. The key assumption is that utility depends *only* on the chosen action and the *underlying state of the world*, not on the *information* *per se*.

  **Sam:** Okay, point taken on the utility function needing to be comprehensive. Let's shift to strategy. Poker. I get dealt a hand. If I *know* I have a royal flush, my poker face might crack – a tiny tell. Or, more subtly, knowing I have a strong hand might make me bet more cautiously to avoid scaring others off, missing maximum value. Whereas if I'm blissfully uncertain, my betting patterns might be more balanced and deceptive, maximizing expected winnings *because* I don't know. Isn't knowing *too much* hurting my leverage?

  **Alex:** Another great challenge! But again, Good's Theorem survives if we model it correctly. The "decision" isn't just "how to bet *given* my hand." The decision problem includes *the entire strategy space*. A rational player anticipates how their *knowledge* affects their *ability to signal or bluff*. The optimal strategy *conditional on knowing the hand* incorporates the risk of tells or suboptimal betting patterns. Crucially, the player *can always choose to ignore the information* and play exactly as if they didn't know! Good's Theorem says that *having the option* to see the information and then decide how to play (including potentially ignoring it) is at least as good as *not having the option*. If seeing the hand genuinely makes it impossible to replicate the ignorant strategy (e.g., because a tell is involuntary), then that inability is a constraint within the decision problem *after* seeing the info. The *expected* utility calculation *before* seeing the card *includes* the probability of getting a strong hand and the potential downsides of knowing it (like tells) versus the benefits (like playing it perfectly). The theorem guarantees that *access* to that info won't lower your *ex-ante* expected utility compared to being forced to play blind, *even if* for some specific hands, knowing it makes you play worse than ignorance *would have* for that specific hand. You might choose *not* to look if looking is costly or risky, but Good only says *free* info is never worse. If involuntary tells make looking effectively "costly" by constraining your action space, that violates the "free" assumption.

  **Sam:** Alright, you're weathering these. Now hit me with the big one – the one I half-remembered last night. Public information wrecking markets. I think it was about insurance? An economist showed that sometimes everyone knowing more can leave *everyone* worse off? How does Good handle *that*?

  **Alex:** Ah, you're thinking of **Jack Hirshleifer's 1971 work on the "destructive" role of public information**, often discussed alongside **George Akerlof's "Lemons" problem** (though Akerlof focused more on *asymmetric* information). This is a crucial case because it fundamentally violates one of Good's core assumptions: **a single decision-maker facing a fixed environment.**

  **Sam:** Explain it simply.

  **Alex:** Imagine an insurance market *before* anyone knows their genetic risk for a disease. People have different latent risks, but neither they nor the insurers know *who* is high or low risk. Insurers offer a single premium based on the *average* risk. Most people buy it; the market functions. Now, suppose a *free, public, perfectly accurate* genetic test becomes available. *Everyone* takes it (it's free and potentially useful privately). Now insurers *know* each person's risk. They charge high premiums to high-risk people and low premiums to low-risk people.

  **Sam:** Sounds efficient!

  **Alex:** Here's the rub. The high-risk premiums are now so high that many high-risk people can't afford insurance and drop out. The low-risk premiums are attractive, but the *pool* of insured is now skewed towards higher risk *on average* than before (because the lowest risks see they have little chance of payout and might also drop out or be priced out slightly). Crucially, **compared to the initial state of symmetric ignorance:**
  1.  **High-risk individuals:** Are worse off – they either pay exorbitant premiums or go uninsured.
  2.  **Low-risk individuals:** *Might* be better off with lower premiums, but often the disruption means they pay slightly more than the *old* average premium for their now-known-low risk, or lose access if the market fragments.
  3.  **Insurers:** Might break even or profit, but the market shrinks, and social welfare (total utility) can decrease.
  4.  **Crucially, *everyone* was better off *ex-ante* under the veil of ignorance.** The public information destroyed the risk-pooling equilibrium that relied on symmetric ignorance.

  **Sam:** Exactly! So public information made literally everyone worse off *in hindsight* compared to the ignorant state. Counterexample to Good?

  **Alex:** **No, and this is the critical distinction.** Good's Theorem applies to a **single agent making a decision where the environment (including other agents' actions) is fixed and unaffected by *their own* information acquisition.** In Hirshleifer's scenario:
  1.  **Multiple Agents:** It's a game, not a single decision problem.
  2.  **Strategic Interaction:** The information acquisition is *public* and *mandatory* (in the thought experiment), changing the *fundamental structure of the game* for everyone.
  3.  **Equilibrium Shift:** The information doesn't just inform decisions within a fixed game; it *destroys the previous equilibrium* and creates a new, Pareto-inferior one.
  4.  **"Fixed Decision Problem" Violated:** The "decision problem" facing any *individual* (e.g., "Should I buy insurance at price P?") is completely different before and after the public revelation. The set of available actions and their consequences change radically based on what *others* know and do.

  **Sam:** So Good's Theorem is silent here? It doesn't apply?

  **Alex:** Precisely. Good's Theorem tells us that **for any *single individual* in that market, *privately* and *freely* learning their own genetic risk *before the market structure changes* would be beneficial or neutral *for their own insurance purchasing decision*.** They could use it to decide whether to buy the average-priced insurance or not. However, if *everyone* learning *publicly* triggers a market collapse, that individual might *regret* the *public* revelation *collectively* happening. But that regret stems from the *strategic consequences* of *others* having the information and the market rules changing, not from the information itself being harmful to their private decision *within a fixed context*. The "hurt" comes from moving to a different, worse game.

  **Sam:** (Pauses, swirling coffee) So... the takeaway is nuanced. Good's Theorem is ironclad *within its specific domain*: a single rational agent, a fixed decision problem (actions, states, consequences), a utility function defined *only* over the outcomes of chosen actions and world states (not the info state itself), and *free* information acquisition that doesn't alter the game for others.

  **Alex:** Exactly. Denying free information *can* be rational only if:
  1.  **Utility Includes Ignorance:** "Not knowing" itself has positive utility that outweighs potential decision gains (like your genetic test *if* you value ignorance itself).
  2.  **Information Isn't Free:** Acquiring it imposes costs (time, stress, strategic constraints like poker tells).
  3.  **Strategic Context (Multi-Agent):** The act of acquiring it (especially if public) changes the game for others in a way that rebounds negatively on you (Hirshleifer's insurance).
  4.  **Decision Problem Isn't Fixed:** The information changes the *available actions* or *consequences* fundamentally, making the pre-info decision problem irrelevant.

  **Sam:** And in my genetic test case, it's primarily #1 – the psychological cost of knowing, which, if large enough, makes the expected utility of knowing negative, *even though* it doesn't change physical actions. And Good's Theorem allows for that if the utility function is honest about valuing psychological state.

  **Alex:** Yes. Deniz refusing the test *is* rational *if* her utility function heavily weights "avoiding the anxiety of potential bad news," and she assesses the expected distress outweighs any potential relief from a negative result. Good's Theorem doesn't force her to value only physical health outcomes. It just says that *given* her true utility function (which includes mental state), and *given* the information is free and only affects her, the calculation of expected utility might still show avoidance is best. The theorem guarantees that *having the option* to look won't make her *ex-ante* expected utility *lower* than *not having the option*, but it doesn't force her to *take* the option if the calculation shows an expected loss *for her specific utility function*.

  **Sam:** So we were both half-right, half-wrong last night. Good's Theorem isn't refuted by poker or markets or anxiety; those situations just highlight where its carefully constructed walls end. Rational ignorance exists, but it's not a flaw in Bayesianism; it emerges *from* it when the assumptions bend or break.

  **Alex:** Nailed it. Rationality isn't about craving all data blindly; it's about optimally navigating the world *given* what you value and the constraints you face, including the sometimes-painful weight of knowledge itself. Good just assures us that within a tightly defined solo mission, more intel won't *hurt* your mission success, as *you* define success.

  **Sam:** (Smiling) Next round's on me. Less arguing, more understanding the fine print.

  **Alex:** Deal. But only if we can agree the coffee here has positive expected utility.

  **Sam:** (Laughs) Given our current utility functions? Absolutely. Cheers to clarity.

  *(They clink coffee cups.)*
