prompt: |-
  The passage below is from F. H. Bradley's *Appearance and Reality* (1893), Book I, Chapter III, "Relation and Quality." It comes just after Bradley has argued that qualities are unintelligible both apart from relations and within them; he now runs a structurally parallel argument targeting relations themselves, arriving at what has come to be called "Bradley's regress."

  "We may briefly reach the same dilemma from the side of relations. They are nothing intelligible, either with or without their qualities. In the first place, a relation without terms seems mere verbiage; and terms appear, therefore, to be something beyond their relation. At least, for myself, a relation which somehow precipitates terms which were not there before, or a relation which can get on somehow without terms, and with no differences beyond the mere ends of a line of connection, is really a phrase without meaning. It is, to my mind, a false abstraction, and a thing which loudly contradicts itself; and I fear that I am obliged to leave the matter so. As I am left without information, and can discover with my own ears no trace of harmony, I am forced to conclude to a partial deafness in others. And hence a relation, we must say, without qualities is nothing.

  But how the relation can stand to the qualities is, on the other side, unintelligible. If it is nothing to the qualities, then they are not related at all; and, if so, as we saw, they have ceased to be qualities, and their relation is a nonentity. But if it is to be something to them, then clearly we now shall require a new connecting relation. For the relation hardly can be the mere adjective of one or both of its terms; or, at least, as such it seems indefensible. And, being something itself, if it does not itself bear a relation to the terms, in what intelligible way will it succeed in being anything to them? But here again we are hurried off into the eddy of a hopeless process, since we are forced to go on finding new relations without end. The links are united by a link, and this bond of union is a link which also has two ends; and these require each a fresh link to connect them with the old. The problem is to find how the relation can stand to its qualities; and this problem is insoluble."

  Could you help me work through this? Specifically:

  1. Reconstruct the regress step by step: what exactly recurs at each stage, and why does positing a "new connecting relation" fail to close the gap it was invoked to close, rather than simply supplying the missing connection once and for all?
  2. Bradley clearly treats this as a vicious regress rather than a harmless one (say, like the endless digits of a repeating decimal). What in his own reasoning here marks it as vicious rather than merely infinite?
  3. This passage is often linked to the later "unity of the proposition" problem -- the question of why a fact or proposition isn't just an unstructured aggregate of its constituents. Are these the same regress in different dress, or genuinely distinct problems that merely resemble one another? If they're distinct, say exactly what further premise or move is needed to get from the argument Bradley gives here to the unity-of-the-proposition version.
