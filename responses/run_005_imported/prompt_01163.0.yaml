answer: |-
  That's a perfectly valid question, and the frustration is understandable. While it might *feel* unfair on the surface, the coach's decision likely has logic behind it, even if it stings. However, your focus on understanding mechanics is absolutely **not wasted effort**. Here's why:

  **Why the Coach Might See It as Fair (From a Results Perspective):**

  1.  **Time Efficiency:** The coach has limited time and resources. If your teammate is consistently hitting her free throws at the target percentage *without* needing technical input, forcing her into clinics is inefficient. Her time (and the coach's) is better spent elsewhere (defense, conditioning, other skills).
  2.  **Risk of Disruption:** For players with deeply ingrained, successful "feel" shots, introducing conscious mechanics *can* sometimes disrupt their rhythm and confidence in the short term. If it ain't broke (statistically), don't fix it... especially mid-season.
  3.  **Focus on Outcomes:** Ultimately, coaches are judged on wins and player performance. Your teammate's free throw percentage is meeting the standard. The clinic time is likely seen as an investment needed to get *your* percentage consistently to that standard (or beyond), assuming there's room for improvement based on your mechanics knowledge not yet translating perfectly.

  **Why Your Understanding of Mechanics is VALUABLE (Even with Equal Stats Now):**

  1.  **Consistency & Resilience Under Pressure:** "Feel" shooters often rely heavily on rhythm and confidence. When tired, stressed, in a hostile environment, or facing a crucial shot, that feel can evaporate. Understanding mechanics provides a reliable framework to fall back on. You can diagnose *why* you're missing ("My elbow flared," "I short-armed the follow-through") and make a specific correction. She might just feel "off" and struggle to fix it.
  2.  **Troubleshooting Slumps:** Everyone has slumps. Your technical knowledge gives you tools to systematically analyze and fix your shot during a slump. Without that knowledge, slumps can be longer and more frustrating, relying purely on regaining an elusive "feel."
  3.  **Adaptability:** If you need to adjust your shot for any reason (recovering from injury, adapting to fatigue, adding range), understanding the mechanics gives you a blueprint for making controlled, effective changes. Changing based purely on "feel" is much harder and riskier.
  4.  **Long-Term Development & Ceiling:** While her current percentage is good, understanding mechanics often allows for more *consistent* high performance and potentially a *higher ceiling*. It provides a foundation for refining efficiency, adding range more reliably, or maintaining form under fatigue better than pure feel might.
  5.  **Teaching & Leadership:** Your knowledge makes you a potential resource for *other* teammates struggling with their shot. You can understand and explain concepts in a way a "feel" shooter often cannot.
  6.  **Deeper Understanding of the Game:** Understanding shooting mechanics often leads to a better understanding of body mechanics, leverage, and efficiency in *other* aspects of the game (defensive stance, passing, finishing).

  **The Key Difference: Conscious Competence vs. Unconscious Competence**

  *   **Your Teammate:** **Unconscious Competence.** She shoots well without thinking *how* she does it. It's automatic, built on immense repetition. This is powerful when it works, but fragile when the unconscious pattern breaks.
  *   **You:** **Conscious Competence (Aspiring to Unconscious Competence).** You *understand* the mechanics. The ultimate goal is to internalize them so well that you *also* shoot without conscious thought (unconscious competence), but with the crucial ability to *return to conscious analysis* when needed for troubleshooting or refinement. This is often the more robust and adaptable path long-term.

  **What to Do:**

  1.  **Reframe the Clinic:** Instead of seeing it as punishment or unfairness, see it as an investment in your *long-term mastery and resilience*. You're building a deeper, more reliable foundation.
  2.  **Focus on Internalizing:** Use the clinics not just to *know* the mechanics, but to *ingrain* them until they become second nature. The goal is effortless execution *based on sound principles*.
  3.  **Talk to the Coach (Tactfully):** Instead of complaining about fairness, ask something like: *"Coach, I'm working hard in the clinics to build a really consistent, reliable shot, especially under pressure. What specific things should I focus on there to make sure my percentage stays high when the game is on the line?"* This shows commitment and focuses on the desired outcome.
  4.  **Let Your Performance Speak:** Ultimately, consistently hitting your free throws, especially in clutch moments, is the best argument. Your knowledge should translate to *reliable* performance.

  **In Conclusion:** Yes, it can feel unfair that your teammate skips the work you're doing while achieving the same result *right now*. But your path, understanding the "why" behind the shot, is building a different kind of strength. You're developing tools for consistency, troubleshooting, adaptability, and long-term excellence that a purely "feel"-based shooter lacks. That knowledge is a significant asset, even if the immediate stat line looks the same. Keep investing in it – it will pay off in ways beyond just matching her current percentage.
