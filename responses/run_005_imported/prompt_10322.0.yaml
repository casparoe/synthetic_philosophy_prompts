  The key insight is that when Theory 1 asserts A∧B, it must also believe (A∧B)→C is false (since C is actually false). But this conditional is actually true in reality! So Theory 1 denies a true statement. Meanwhile, Theory 2 doesn't make this mistake. This creates asymmetry - Theory 1 has extra true content but also extra hidden false content.

  For teaching, I should emphasize how logical closure forces false theories to "overcommit" - getting more things right requires making more mistakes about how those truths relate. The quantitative approaches avoid this by not requiring logical closure, instead measuring similarity to the full truth. 

