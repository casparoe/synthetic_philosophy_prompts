  The empirical question is smart - makes her show her epistemological cards. "What evidence would falsify this?" is every ideologue's nightmare. Should suggest real cases like Singapore's PAP or Plato's Syracuse failure.

  ...writing now with layered questions: technical enough for PhDs, with pop-up explanations for undergrads. Avoiding "epistemic" etc. Follow-ups all target her deflection patterns from published work. Final question designed to prevent hypothetical escape hatches.
answer: |-
  Here are 10 questions designed to engage the core critiques while remaining accessible, each with a targeted follow-up and concluding with your requested empirical test:

  1.  **The Regress Problem:** "Your council's legitimacy rests on an exam designed by an insulated academic board. But *who* selects that board, and by *what authority* is *their* competence to define 'competence' established? Doesn't this process either covertly rely on a democratic mandate it ultimately overrides, or simply install the epistocrats' own definition of knowledge as the unquestionable starting point?"  
      *(Follow-up if she calls it procedural):* "If specifying *who defines competence* isn't a fundamental legitimacy question but merely an 'implementation detail,' doesn't that risk making the entire structure rest on an arbitrary foundation – precisely the flaw epistocracy aims to fix in democracy?"

  2.  **Invidious Ranking (Estlund):** "Even granting your exam accurately measures political competence, critics like Estlund argue that publicly *ranking* citizens and excluding the 'less competent' from final power is inherently disrespectful and morally objectionable, violating a core tenet of political equality. How do you reconcile epistocracy with the idea that all citizens deserve an *equal say* in their collective fate, regardless of their measured knowledge?"  
      *(Follow-up to 'meritocracy' defense):* "We accept competence hierarchies in professions like medicine, but isn't political authority fundamentally different? Doesn't saying 'Group X is *unfit* to have equal power over the laws that bind them all' create a uniquely harmful form of social hierarchy, regardless of the metric's accuracy?"

  3.  **Sociological Exclusion & Bias:** "History shows that standardized tests, however well-intentioned, often reproduce existing social inequalities – like literacy tests under Jim Crow. Given that your exam correlates with formal education (economics, law, history), how can you guarantee it won't systematically exclude marginalized groups, effectively disenfranchising them based on background rather than innate ability?"  
      *(Follow-up to 'careful design'):* "If the *correlation* with existing privilege is structural (e.g., unequal K-12 resources), can any test avoid being discriminatory in effect, even if neutral on paper? Isn't the risk of reinforcing historical exclusions inherent in the mechanism itself?"

  4.  **The Condorcet Paradox:** "You cite the Condorcet Jury Theorem to justify a small, highly competent council. But that same theorem famously *justifies universal suffrage* when average competence is above 50%. Crucially, on polarized or complex issues where expert consensus breaks down, average competence might *dip below 50%*. Doesn't this mean your council could be *more likely* to get it wrong than a diverse larger body precisely on the most contentious, high-stakes decisions?"  
      *(Follow-up to 'high competence'):* "If polarization lowers perceived *average* competence below 50% on key issues (e.g., climate responses, pandemic policies), doesn't the Condorcet logic *reverse*, making your elite council *less* reliable than broader deliberation? How do you measure/preserve 'above 50%' competence on contested real-world problems?"

  5.  **Diversity vs. Ability (Landemore/Hong-Page):** "Hélène Landemore, drawing on the Hong-Page theorem, argues that cognitive diversity within a larger group can outperform a smaller group of higher-ability but more homogeneous thinkers. Doesn't your highly selective exam, focused on specific disciplines, risk creating a council *lacking* the diverse perspectives and problem-solving heuristics crucial for tackling novel, complex societal problems, potentially making it *less* effective than a democratic body?"  
      *(Follow-up to 'interdisciplinary' claims):* "Even if the exam covers multiple fields, doesn't the competitive, high-stakes nature inherently select for a certain *homogeneity* of thinking style and background, filtering out the very diversity of cognitive approaches that Hong-Page shows is critical for collective intelligence? Can standardized tests *ever* capture and reward that kind of diversity?"

  6.  **Accountability & Feedback Loops:** "Democracy provides a feedback loop: voters can remove representatives who perform poorly. Your council holds absolute veto power but is insulated from elections. What mechanisms ensure they remain responsive to the evolving needs and values of the society they govern, and what consequences do they face if their vetoes prove harmful or misguided over time?"  
      *(Follow-up to 'merit/review'):* "If accountability relies solely on peer review or exam redesign cycles, isn't that dangerously slow and detached from the lived consequences of their decisions? Doesn't insulation from popular sanction risk creating an aloof, unresponsive elite?"

  7.  **Defining the "Good Decision":** "Epistocracy assumes we can objectively identify 'competence' and 'correct' political decisions. Yet, politics fundamentally involves clashes of *values* (e.g., liberty vs. equality, security vs. privacy). How does your exam, focused on *knowledge* (economics, law, history), equip the council to adjudicate between competing, incommensurable values – a task often central to legislation?"  
      *(Follow-up to 'expertise in values'):* "If the council *does* need to make value judgments, doesn't that undermine the claim that their authority rests purely on superior *factual* knowledge? And if not, how can a test on economics/law/history validate their capacity to make binding *moral* choices for others?"

  8.  **Incentives & Corruption:** "Absolute power, even in knowledgeable hands, creates strong incentives for capture. How do you prevent powerful interests (corporations, lobbies, even factions within the state) from attempting to influence the academic board, the exam content, or eventually the council members themselves, bypassing the democratic assembly entirely?"  
      *(Follow-up to 'insulation'):* "Insulation can breed insularity and obscure corruption. Without the scrutiny that comes from democratic contestation, aren't your carefully designed safeguards potentially more vulnerable to gradual erosion and capture over time?"

  9.  **The "Wisdom of Crowds" vs. Elite Panels:** "Beyond Condorcet, empirical studies (e.g., prediction markets, Delphi methods) often show aggregated judgments from diverse groups outperforming small expert panels, especially regarding complex, uncertain futures. Why prioritize a small elite council over enhancing mechanisms to harness the distributed knowledge and collective intelligence *within* the broader electorate?"  
      *(Follow-up to 'quality control'):* "Couldn't resources dedicated to the epistocratic structure be better spent improving democratic deliberation and information access (civic education, media reform, citizen assemblies), addressing the *causes* of poor decisions rather than overriding the demos?"

  10. **Empirical Falsification:** "You've built a careful, principled case. But theory meets reality. What specific *empirical evidence* or *historical precedent* would genuinely cause you to reconsider the core viability or desirability of your epistocratic proposal? For instance, evidence that such systems *inevitably* become corrupt? Or historical cases where educated elites made catastrophically worse decisions than broader publics? What finding would be a 'falsifier' for you?"  
      *(No follow-up needed - this is the closer)*

  **Key features for the moderator:**

  *   **Clarity & Accessibility:** Phrased to avoid jargon where possible ("insulated academic board" instead of "epistemic closure"; "absolute veto" clear). Concepts like Condorcet or Hong-Page are named but briefly explained in the question.
  *   **Engagement with Her Work:** References her specific mechanisms (rotating board, exam design) and pre-empted defenses.
  *   **Balanced Challenge:** Questions are substantive and critical but fair, respecting her careful argumentation.
  *   **Follow-up Strategy:** Each follow-up directly targets her predicted deflection ("implementation detail," "meritocracy," "careful design") by showing how the objection strikes at the *principle* or *core justification*, not just mechanics.
  *   **Flow:** Starts with foundational legitimacy (Regress), moves through key critiques (Invidious, Exclusion, Condorcet paradox, Diversity), then addresses systemic risks (Accountability, Values, Corruption), contrasts alternatives (Crowds), and ends with the crucial empirical test.
  *   **Audience Range:** Provides entry points for non-specialists (historical examples like Jim Crow, relatable concepts like bias and corruption) while engaging deep theoretical disputes for the PhDs.
