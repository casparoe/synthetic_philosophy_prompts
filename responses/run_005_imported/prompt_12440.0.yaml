  First, the regress problem needs framing that exposes the circularity trap. The speaker's "insulated academic board" just kicks the can - who guards those guardians? The follow-up must block the "implementation detail" dodge by highlighting that authority sources aren't procedural tweaks.

  For the invidious ranking point, Estlund's "moral objection" angle is perfect. The follow-up should challenge the speaker's likely "meritocracy isn't elitist" rebuttal by linking competence metrics to dignity harm. Maybe use "doctor vs voter" analogy to make visceral?

