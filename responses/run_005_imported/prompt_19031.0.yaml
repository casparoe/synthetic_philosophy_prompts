  I'm taking a graduate seminar on the philosophy of biology, where our unit on the units-of-selection debate is built around Okasha's *Evolution and the Levels of Selection*. This week we are each peer-grading one anonymized classmate's response to the take-home question below before the instructor moderates, and I'd like an independent read on this particular answer before I submit my own grade.

  Question: "Explain the disagreement between Dawkins's gene's-eye view of natural selection and Sober and Wilson's multilevel selection theory. Your answer should explain what role Hamilton's rule and the Price equation play in the 'equivalence thesis' (the claim that kin-selection and group-selection models of the evolution of altruism are mathematically interconvertible), and should state whether this thesis shows that the dispute between gene-centric and group-centric biologists is substantive or merely verbal."

  Classmate's answer: "Dawkins's gene's-eye view treats the gene as the fundamental unit of selection: because genes, not organisms or groups, are copied with high fidelity across generations, natural selection is best described as competition among genes for representation in the future gene pool. In *The Selfish Gene* and *The Extended Phenotype*, Dawkins—echoing terminology he shared with the philosopher of biology David Hull—distinguishes 'replicators,' such as genes, from 'interactors,' the organisms whose bodies replicators build and use as tools for their own propagation. Sober and Wilson's multilevel selection theory challenges the idea that gene-level selection is always the most fundamental or explanatorily privileged level: whenever a population is structured into groups such that there is heritable variation in fitness between groups as well as within them, selection is genuinely acting at the group level too, and many cases of apparent altruism traditionally explained by kin selection (via Hamilton's rule, rb > c) are just as well described as instances of group selection. Using Price-equation partitions of within-group and between-group covariance between genotype and fitness, Sober and Wilson show that Hamilton's rule can be recovered from a suitably specified multilevel selection model, and vice versa. Because the two frameworks are mathematically interconvertible in this way, Sober and Wilson conclude that the long-running dispute between gene-centric and group-centric biologists is merely terminological: once you fix the population structure and the fitness function, 'kin selection' and 'group selection' are just two names for the same underlying process, and the only real disagreement left is about which vocabulary is more convenient."

