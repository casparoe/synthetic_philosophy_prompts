prompt: |-
  Long-time lurker on the rationalist-blogosphere side of the internet (LW, ACX, the whole cluster), and for the past year or so I've been one of five volunteer editors on a small collaboratively-run wiki a few of us started to catalog and rate "conspiracy-ish" claims floating around online -- think a scrappy RationalWiki/Snopes hybrid. Our house style has been pretty firmly generalist: every entry opens with a standard box explaining that claims alleging secret coordination among lots of independent, powerful people get a low prior by default, because big conspiracies are supposedly statistically leaky and tend to collapse within a few years if they're real -- there's a paper, I think by a physicist named Grimes, that actually tries to Fermi-estimate this. That default is now splitting the editor team, and I'm the deciding vote, so I want an outside opinion before I commit to one side.

  The entry in question (I've fictionalized/composited the specifics on purpose so we're not just relitigating an actual news story) concerns a claim that an agrochemical company's own in-house scientists privately flagged a bestselling pesticide as wiping out local pollinator populations years before regulators caught on, based on a couple of leaked internal emails, and that the company then quietly lobbied to slow-walk the follow-up studies. Two editors want the standard debunking box slapped on top, since the claim has exactly the shape our policy exists to flag (secrecy plus coordination plus a powerful institutional actor). The other two think that's question-begging: Big Tobacco, Purdue Pharma, and the VW emissions scandal all had exactly that shape too, right up until the documents surfaced, so "this resembles a conspiracy theory structurally" can't by itself be evidence the claim is false, or we'd have had to call all three implausible the day before they broke. I think this is basically the generalism-vs-particularism debate philosophers have had about conspiracy theories, but its been years since I actually read any of that and I don't trust my memory enough to break the tie myself. Could you draft the memo I'll circulate to the other editors before we hold the tiebreaker vote? I need a real recommendation on how to classify this specific entry, plus criteria the five of us could reuse next time this comes up, and whichever way you land, give the losing side's strongest argument a fair hearing instead of a paragraph of lip service.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're part of a small team running a wiki that rates conspiracy-like claims. Their current policy uses a generalist approach, applying a low prior to any claims involving secret coordination among powerful groups, based on Grimes' paper about the statistical likelihood of conspiracies leaking. Now, they're split on whether to apply this to a specific case about an agrochemical company allegedly hiding pesticide risks.

  The user is the deciding vote and wants a fair memo for the team. They need a clear recommendation for this case plus reusable criteria. They emphasized not just paying lip service to the losing side. The deeper need here is maintaining the wiki's credibility and consistency while adapting to valid criticisms. 

  First, I need to recall the key arguments. The pro-box side says the claim fits the conspiracy pattern, so the default low prior applies. The anti-box side argues that real scandals like Big Tobacco had the same structure before evidence surfaced, so labeling based on structure alone risks false negatives. 

  The user mentioned the generalism vs. particularism debate in philosophy. Generalists say conspiracy theories share traits making them inherently unlikely. Particularists insist each claim must be judged on its own evidence. The memo should bridge this by acknowledging both but leaning toward particularism in application.

  For the pesticide case, the strongest point against the box is that corporate cover-ups, unlike broad conspiracies, have a track record of happening. Companies have hierarchy and legal incentives to conceal wrongdoing. The pro-box argument is weakest here because Grimes' model applies better to multi-group conspiracies than single-entity cover-ups.

  The recommendation should be: don't use the standard box here. Instead, introduce a "Corporate Misconduct" category with tailored criteria. This addresses the team's split by refining their framework. Criteria for future cases could include checking if the claim involves one entity vs. many, the actors' incentives, and historical precedents.

  The memo needs to validate both sides. The pro-box team is right about structural risks but applying it too broadly undermines their credibility when real scandals break. The solution is nuanced criteria that distinguish between types of claims. This should satisfy the user's need for a fair, balanced approach that strengthens their wiki long-term.
answer: |-
  Here’s a draft memo for your editorial team, designed to resolve the immediate dispute, establish reusable criteria, and validate both perspectives:

  ---

  **MEMORANDUM**  
  To: Editorial Team  
  From: [Your Name/Username]  
  Date: [Current Date]  
  Subject: Policy Clarification & Case Ruling: [Fictionalized Pesticide Claim]  

  ### I. Summary of Positions  
  **Side A (Pro-Default Box):**  
  - **Core Argument:** Claims requiring sustained secrecy + coordination among powerful actors inherently carry a low prior probability per Grimes’ model ([Grimes, 2016](https://www.nature.com/articles/doi:10.1038/rsos.150618)). The claim’s structure (secret suppression by a corporation + regulators) fits this. Applying our standard box maintains consistency and combats motivated reasoning.  
  - **Strongest Point:** Without this heuristic, we risk false positives by treating every allegation of covert action as equally plausible.  

  **Side B (Anti-Default Box):**  
  - **Core Argument:** Corporate scandals (Tobacco, VW, Purdue) *prove* single-entity cover-ups are statistically plausible despite structural similarities to "conspiracy theories." Applying the box here is question-begging—it assumes the claim is false *because* it resembles a conspiracy.  
  - **Strongest Point:** Our default prior becomes self-refuting if it dismisses claims *that later prove true* based solely on structure.  

  ### II. Recommendation for This Entry: **DO NOT APPLY THE STANDARD BOX**  
  **Reasoning:**  
  1. **Distinction in Actor Scope:** Grimes’ model focuses on conspiracies requiring *many independent actors* (e.g., governments, agencies, corporations). Here, the alleged secrecy is confined to **one corporation + limited regulatory capture**—a scenario with far fewer points of failure. Historical precedents (Side B’s examples) show single entities *can* suppress truth for decades due to hierarchy/legal incentives.  
  2. **Evidence Threshold Met:** Leaked internal emails + documented lobbying patterns constitute "smoke" warranting investigation, not dismissal. The box should flag claims *lacking* such evidence.  
  3. **Avoiding False Negatives:** Applying the box here risks implying corporate misconduct is *inherently implausible*—a position contradicted by history and harmful to our credibility.  

  ### III. Revised Framework for Future Cases  
  To resolve "generalism vs. particularism," we adopt a **tiered prior system**:  

  | **Claim Type**               | **Default Prior** | **Criteria**                                                                 | **Examples**                  |  
  |------------------------------|-------------------|-----------------------------------------------------------------------------|-------------------------------|  
  | **Type 1: Multi-Actor Conspiracies** | Very Low          | Requires secrecy/coordination across ≥3+ *independent* powerful groups (states, corporations, agencies). | "9/11 was an inside job (CIA/FBI/Military)" |  
  | **Type 2: Single-Entity Cover-Ups** | Low/Moderate     | Secrecy confined to one hierarchical entity (corporation, agency) + limited external influence. | VW scandal, Purdue Pharma    |  
  | **Type 3: Documented Misconduct**    | Neutral           | Allegations supported by whistleblowers/leaks *or* prior proven misconduct by the entity. | [This pesticide claim]       |  

  **Key Principles:**  
  - **Apply Default Box ONLY to Type 1 claims.**  
  - **Type 2/3 claims:** Replace box with context-specific disclaimer:  
    > *"Claims alleging secrecy within a single organization warrant scrutiny but are historically plausible. This entry evaluates evidence specific to [case] without default assumptions."*  
  - **Upgrade/Downgrade Tiers** based on evidence: A Type 1 claim with leaked documents becomes Type 3; a Type 2 claim lacking evidence reverts to Type 1.  

  ### IV. Why This Addresses Both Sides  
  - **For Side A:** Preserves Grimes’ core insight for *broad* conspiracies (Type 1), where statistical unlikelihood is strongest. Maintains skepticism toward least-plausible claims.  
  - **For Side B:** Acknowledges corporate/institutional misconduct is a distinct phenomenon with higher base rates. Prevents over-application of the "conspiracy" label to valid criticism.  
  - **For Both:** Evidence remains paramount—but initial categorization determines *how much* evidence is needed to overcome the prior.  

  ### V. Path Forward  
  1. **This entry** is classified **Type 3** (Documented Misconduct). No standard box; include revised disclaimer.  
  2. **Vote** to adopt the tiered framework for *future* entries.  
  3. **Amend style guide** to reflect criteria above.  

  This approach respects our original mission while adapting to valid criticisms. It ensures we don’t conflate "conspiracy theory" with "corporate accountability."  

  ---  

  **Key Strengths of This Approach:**  
  - **Solves the Generalism/Particularism Split:** Uses structure *to categorize*, not *to judge*. Type 2/3 claims demand evidence-based evaluation.  
  - **Credibility Protection:** Avoids dismissing plausible corporate misconduct while flagging sprawling conspiracies.  
  - **Efficiency:** Clear criteria reduce future disputes.  
  - **Philosophically Robust:** Aligns with philosophers like Coady & Pigden, who argue that "conspiracy theories" shouldn’t be dismissed *a priori* when institutional incentives for secrecy exist.  

  **Final Note:** Grimes’ model still holds—but it applies best to JFK/Flat Earth-scale claims, not a pesticide company hiding internal data. Our policy must reflect that nuance.
