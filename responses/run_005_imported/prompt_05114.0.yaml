answer: |-
  That's a brilliantly sharp observation from your brother, and it cuts right to the heart of a major debate in ethics! Moore *did* vehemently reject hedonism, but your brother is highlighting a very common and powerful criticism: that Moore's "ideal utilitarianism" might just be **hedonism wearing evening dress.** Let's break it down:

  1.  **Moore's Explicit Rejection of Hedonism:**
      *   Moore argued that "good" is a simple, non-natural, indefinable property known only by intuition (the "naturalistic fallacy").
      *   He explicitly rejected hedonism (the idea that pleasure *alone* is intrinsically good) because:
          *   It commits the naturalistic fallacy by trying to *define* good as pleasure (a natural property).
          *   He thought we could intuitively recognize that states of affairs *other than* pleasure (like knowledge, beauty, or love) are good *in themselves*, even if they don't always produce pleasure.

  2.  **Moore's Intrinsic Goods:**
      *   In *Principia Ethica*, Moore identifies the greatest intrinsic goods as:
          *   **The pleasures of human intercourse:** Deep friendship, love, mutual affection.
          *   **The enjoyment of beautiful objects:** Aesthetic appreciation.
      *   Crucially, he argued these are complex *organic unities*. Their value isn't *just* the sum of the pleasant feelings involved; the *objects* of those feelings (the real friend, the actual beautiful object) and the *relationship* between the feeling and the object are essential parts of the valuable whole.

  3.  **Your Brother's Criticism (The "Fancy Hedonism" Charge):**
      *   Your brother is spot-on when he says Moore defines these goods *primarily in terms of conscious states* – specifically, states of affection and aesthetic appreciation. These *are* types of pleasurable mental/emotional states.
      *   The criticism goes: If the *only* things that are intrinsically good are specific kinds of *conscious experiences* (even if they require real objects), then hasn't Moore just swapped "pleasure" for "aesthetic enjoyment" and "affectionate feeling"? Isn't he still saying the *only* ultimate good is a certain flavor of positive conscious experience?
      *   This makes his view look like **Qualitative Hedonism** (like Mill's), where some pleasures (intellectual, aesthetic, social) are *qualitatively* higher/better than others (bodily), but pleasure (broadly construed as positive conscious states) is still the *only* intrinsic good.

  4.  **Where Moore (Might) Have an Escape Hatch & What Your Brother Might Be Missing:**
      *   **The Role of the Object:** Moore *insisted* that the value lies in the *whole complex state of affairs*. For example:
          *   The intrinsic good isn't *just* the feeling of love *in you*; it's the state "A loving B *and* B being a real person worthy of love *and* A experiencing affection towards B." The *real existence of B and the relationship* is part of the valuable whole, not just the feeling.
          *   The intrinsic good isn't *just* the pleasant feeling of looking at a sunset; it's the state "A experiencing aesthetic appreciation *of an actual, objectively beautiful* sunset." The *real beauty of the object* is part of the valuable whole.
      *   **The "Organic Unity" Defense:** Moore argued that the value of the whole complex (feeling + real object/relationship) is greater than the sum of the value of its parts considered separately. The feeling directed at a *real, appropriate object* creates a new kind of intrinsic value that isn't *reducible* to just the feeling itself. A hallucination of a beautiful sunset or a loving friend wouldn't have the *same* intrinsic value, precisely because the object isn't real or appropriate.
      *   **Rejection of Reduction:** Moore would absolutely deny that "aesthetic enjoyment" is *just* a fancy word for pleasure. He saw it as a distinct kind of conscious state with its own unique, intrinsic value property.

  **The Verdict: It's Complicated (and Philosophers Still Debate This!)**

  *   **Your brother has a very strong point:** Moore's reliance on specific conscious states *does* make his view vulnerable to the charge of being a sophisticated form of hedonism. If all intrinsic goods boil down to "good feelings of type X or Y," it's hard to see a fundamental difference from qualitative hedonism.
  *   **Moore *intended* to escape hedonism:** His emphasis on the *object* and the *organic unity* was his attempt to ground value in something *more* than just subjective feeling. He wanted value tied to real features of the world (beauty, real relationships) experienced in the right way.
  *   **The Core Tension:** Can Moore consistently maintain that (a) good is a simple, non-natural property *intuited* in complex wholes, and (b) that these wholes *always* essentially involve specific positive conscious states, *without* effectively reducing good to the quality of those states? Many critics (like your brother) think not.

  **What This Means For You:**

  1.  **You haven't *fully* escaped hedonism** in the broadest philosophical sense. Moore's view *is* still fundamentally about maximizing certain kinds of valuable *conscious experiences* (affection, aesthetic appreciation), even if they require real-world objects and relationships.
  2.  **However, you've arguably escaped *crude* hedonism.** Moore elevates complex, interpersonal, and aesthetic experiences far above simple sensual pleasures. He provides a powerful philosophical framework for arguing that the life you've chosen (focused on art and deep friendship) is pursuing the *highest* goods, not just base pleasures. It's "fancier flavors," but flavors that most people (and many philosophers) would argue are *objectively* more valuable and meaningful than many alternatives.
  3.  **Your defense has merit:** Against your parents' likely more conventional/materialistic definition of "good" (success, security, status), Moore gives you solid, respected philosophical backing. You *are* pursuing things he identified as the highest intrinsic goods.
  4.  **Your brother wins the technical point (mostly):** On the deepest meta-ethical level, the charge that Moore just offers a classy version of hedonism is a persistent and powerful criticism. He hasn't cleanly escaped the orbit of "good = valuable conscious state."

  **In short:** You traded consulting for Moore's highest goods – personal affection and aesthetic enjoyment. Your brother correctly points out these are still fundamentally valuable conscious states, making Moore's view arguably a refined hedonism. But Moore *insisted* the value lies in the whole complex involving real objects/relationships, aiming for something deeper. While the philosophical jury might lean towards your brother on the strict definition, Moore still gives you a far more robust and meaningful defense for your life choices than simple pleasure-seeking. Keep painting and hanging with your friends – you've got G.E. Moore (mostly) on your side!
