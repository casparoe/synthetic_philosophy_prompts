              Then expected payoff = -18+36-20 = -2.

              This is the same as always sounding the alarm.

              But note: if p=1, then in room2 (when reached) they would also sound the alarm and get 10, but in the calculation above for I2 and p=1:

                  In room1: sound -> -10.
                  They don't go to room2.

                  So for I2: payoff = -10.

                  Total = 0.4*10 + 0.6*(-10) = 4-6=-2.

              So p=1 is the best.

   However, when the guard is in room2, they know that room1 did not have the intruder. Therefore, they know they are in room2 and that the probability of the intruder being in room2 is 1. So they would want to sound the alarm for sure. This is consistent with p=1.

   But when the guard is in room1, if they knew they were in room1, they would be indifferent between sounding and not. However, if they use p=1, then they sound and get on average -2.

   The catch is that when in room1, the guard doesn't know if it's room1 or room2. They must choose p without knowing. But in this case, the optimal p is 1.

   Now, let's do the in-the-moment expected payoff for a guard who is at a room and doesn't know which room.

          They assign probabilities to which room they are in.

          How to assign?
          - The probability that they are in room1: 
               - The guard is always in room1 first. 
               - They are in room2 only if they didn't sound the alarm in room1 and room1 had no intruder.

          But if they are using a strategy with probability p of sounding the alarm in each room, then:

               - Probability of being in room1: 
                     - They are in room1 at the beginning: probability 1.
                     - But also, if they are in room2, it is because they came from room1. However, when in room2, they are not in room1.

          Alternatively, we can think of the probability at the time of being at a room.

          The probability that the current room is room1 given that the guard is in a room:

               - The guard is in room1 at the first step. 
               - The guard is in room2 only if they have already made the decision in room1 and chose not to sound the alarm and room1 had no intruder.

          So the probability of being in room1 is not 1/2.

          Let A be the event that the guard is in room1.
          Let B be the event that the guard is in room2.

          P(A) = probability that the guard has not yet left room1 and is currently in room1. This happens only at the first step, and if they haven't been in room1 before and made a decision to leave? 

          This is a bit messy.

          Alternatively, we can use the frequency of being in room1 and room2 over many nights.

          On a given night:
              - The guard is always in room1 at the first opportunity.
              - They are in room2 only if they didn't sound the alarm in room1 and room1 had no intruder (probability 0.6 * (1-p)).

          So the probability of being in room1 on a given decision opportunity is 1.
          The probability of being in room2 on a given decision opportunity is 0.6*(1-p).

          However, these are not for the same night. In one night, the guard might be in room1 and then if they don't sound and room1 has no intruder, then they are in room2. So in one night, they could be in two rooms? 

          But the decisions are made sequentially. The in-the-moment perspective is at a randomly chosen decision node in the tree.

          The probability of being at a node is proportional to the probability of reaching it.

          So:
            - Node room1: reached with probability 1.
            - Node room2: reached with probability 0.6 * (1-p).

          Therefore, the probability that the current node is room1 is:
               P(room1) = 1 / [1 + 0.6(1-p)]
          P(room2) = 0.6(1-p) / [1 + 0.6(1-p)]

