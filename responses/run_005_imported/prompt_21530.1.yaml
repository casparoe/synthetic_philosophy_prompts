                       = P(room1)*(-2) + P(room2)*10

            If they do not sound the alarm:

               In room1: then they will go to room2 and then in room2 they will use the strategy p: so the expected payoff from room2 is p*10 + (1-p)*(-20) = 30p-20.
                          and in room1, if there's an intruder, not sounding gives -20, else 0.
                          so expected payoff in room1 given not sounding = 0.4*(-20) + 0.6 * [ expected payoff from room2 ]
                                     = -8 + 0.6*(30p-20) = -8 + 18p -12 = 18p -20.

               In room2: if they don't sound, then payoff = -20.

               So the expected payoff of not sounding at the current node:

                   = P(room1) * [18p-20] + P(room2) * [-20]

            Therefore, the in-the-motion expected payoffs are complex functions of p.

          We then compare for a given p the two actions.

          But the commitment p is chosen in advance. The optimal p is 1 (as we found).

