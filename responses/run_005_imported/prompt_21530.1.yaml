              P(room1) = 1 / [1 + 0.6*(0.5)] = 1 / 1.3 = 10/13
              P(room2) = (0.6*0.5) / 1.3 = 0.3/1.3 = 3/13

              Sound: (10/13)*(-2) + (3/13)*10 = (-20+30)/13 = 10/13 ≈ 0.769.
              Not sound: (10/13)*(18*0.5-20) + (3/13)*(-20) = (10/13)*(9-20) + (-60/13) = (10/13)*(-11) -60/13 = (-110-60)/13 = -170/13 ≈ -13.08.

              So sounding is better.

          Therefore, if the guard in the moment is using p=0.5, they would want to sound the alarm.

          This would then push them to use a higher p.

          Only at p=1 are they in room1 for sure and then they are indifferent.

          So in this example, the in-the-motion expected payoff for not sound is very low when p<1, so they will want to sound. This drives p to 1, which is the commitment optimum.

          So we still don't have a divergence.

