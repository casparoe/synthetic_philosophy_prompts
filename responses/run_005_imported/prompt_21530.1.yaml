              Let I1: intruder in room1 (prob=0.4), I2: intruder in room2 (prob=0.6).

              If I1:
                  - With probability p: sound in room1 -> payoff = 10.
                  - With probability 1-p: not sound in room1 -> payoff = -20.
                  - And then they do not go to room2.

              If I2:
                  - With probability p: sound in room1 -> payoff = -10 (because no intruder in room1), and then they do not go to room2.
                  - With probability 1-p: not sound in room1 -> payoff = 0 (because no intruder in room1), and then they go to room2.
                        - In room2: they sound with probability p: payoff=10.
                                   or not sound: payoff=-20.
                        - So in room2: expected payoff = p*10 + (1-p)*(-20) = 10p -20 +20p = 30p -20.

              Therefore, total expected payoff:

                  = 0.4 * [ p*10 + (1-p)*(-20) ] + 0.6 * [ p*(-10) + (1-p)*(0 + 30p-20) ]

              = 0.4 [10p -20 +20p] + 0.6 [ -10p + (1-p)(30p-20) ]
              = 0.4 (30p-20) + 0.6 [ -10p + 30p -20 -30p^2 +20p ]
              = 0.4(30p-20) + 0.6(40p -20 -30p^2)
              = 12p -8 + 24p -12 -18p^2
              = 36p -20 -18p^2

