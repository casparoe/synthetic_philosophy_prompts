answer: |-
  Here is the bench memo Judge Miriam Kessler would circulate, reflecting a rigorous textualist approach while wrestling honestly with the tensions inherent in her methodology. It treats the losing argument with full force and acknowledges doctrinal gray areas:

  ---

  **MEMORANDUM**  
  **TO:**            Judges Okafor & Reinhardt  
  **FROM:**        Judge Miriam Kessler  
  **RE:**            *United States Migratory Habitat Service v. Halloran*, No. 23-4517  
  **RECOMMENDATION:** Reverse the district court’s judgment.  

  ### I. Recommendation & Core Holding  
  I recommend reversal. The Wetland Nesting Protection Act’s (WNPA) prohibition applies *only* to alterations made "during the nesting season." Respondent Alma Halloran’s alteration occurred *before* the nesting season. The statute’s text does not cover preemptive destruction, however destructive to the Act’s goals.  

  ### II. Textual Analysis  
  #### A. Plain Meaning of "During"  
  The operative clause—"during the nesting season"—is unambiguous. "During" denotes temporal containment: an act must occur *within* a defined period. *See During*, Black’s Law Dictionary (11th ed. 2019) ("Throughout the course of; throughout the continuance of"). Nesting seasons are biologically fixed periods; here, undisputedly beginning *after* Halloran acted. The government’s attempt to stretch "during" to include "in anticipation of" violates the term’s ordinary meaning. Congress used "during" 27 times in Title 16 (Conservation); where it intended broader temporal scope, it used phrases like "at any time" (16 U.S.C. § 668dd(e)(2)(A)) or "prior to" (16 U.S.C. § 1539(a)(2)(B)). Its choice here is deliberate.  

  #### B. Statutory Structure  
  The phrase "during the nesting season" modifies *all* prohibited acts ("drain, fill, or otherwise alter"). Reading it as applying only to the *habitat’s* status (i.e., that it *will serve* as nesting habitat) ignores the syntax. The clause’s placement *after* the act verbs confirms it governs *timing of conduct*, not habitat characterization. *Cf. Barnhart v. Thomas*, 540 U.S. 20, 26 (2003) (qualifying phrases bind to the nearest reasonable antecedent).  

  #### C. Surplusage Canon  
  The government’s reading would render "during the nesting season" superfluous. If liability attached whenever habitat *would be* used in the imminent season, the temporal limitation serves no purpose. Yet we must give effect to every word. *Freeman v. Quicken Loans, Inc.*, 566 U.S. 624, 635 (2012).  

  ### III. Counterargument: Absurdity & Purpose  
  #### A. The Government’s Strongest Case  
  The government contends Halloran’s reading produces an "absurd result": landowners can evade the WNPA by acting *just before* the season, gutting the statute. This is not speculative; the Act’s findings (§ 1(b)(3)) explicitly note habitat is "frequently destroyed in anticipation of the nesting season, before any protection attaches." Allowing such evasion would defeat Congress’s manifest purpose. Under *Holy Trinity Church v. United States*, 143 U.S. 457 (1892), we should avoid constructions that frustrate statutory aims when text permits.  

  #### B. Why This Fails Under Textualism  
  1.  **"Absurdity" is Overextended Here**  
      The absurdity canon applies only when a text produces outcomes "so gross as to shock the general moral or common sense." *Green v. Bock Laundry Mach. Co.*, 490 U.S. 504, 527 (1989) (Scalia, J., concurring). Halloran’s reading is logical, not absurd: Congress may have weighed competing interests (e.g., predictability for landowners) and accepted this "loophole" as the cost of clear temporal boundaries. That a statute can be circumvented does not make its text absurd; it makes it underinclusive. *See* *Henson v. Santander Consumer USA Inc.*, 137 S. Ct. 1718, 1725 (2017) ("[I]t is never our job to rewrite a constitutionally valid statutory text under the banner of speculation about what Congress might have done").  

  2.  **Purpose Cannot Override Text**  
      While the findings section (§ 1(b)(3)) confirms Congress *knew* of preemptive destruction, it did not *address* it in the operative prohibition (§ 3(a)). Findings clarify purpose but cannot expand substantive scope. *See* *BMW of N. Am., Inc. v. Gore*, 517 U.S. 559, 586 (1996) (Scalia, J., dissenting) ("[T]he *law* is what Congress enacted"). The floor statement cited by the government is classic unenacted legislative history; even if probative of purpose, it is irrelevant to textual analysis. *See* *Milner v. Dep’t of Navy*, 562 U.S. 562, 574 (2011) ("[L]egislative history is not the law").  

  ### IV. Tension: Role of Statutory Findings  
  **Point of Strain:** Whether § 1(b)(3)’s findings can inform textual ambiguity.  
  - **Against Use:** Findings are prefatory, not operative. Inviting them to broaden § 3(a) risks smuggling in purpose through a backdoor. *See* *Circuit City Stores, Inc. v. Adams*, 532 U.S. 105, 119 (2001) (declining to use findings to alter unambiguous text).  
  - **For Use (Okafor’s Potential View):** Findings are enacted text and may illuminate context. *See* *King v. Burwell*, 576 U.S. 473, 486 (2015) (using statutory structure to resolve ambiguity). If "during" were ambiguous (which I find it is not), § 1(b)(3) could signal that "nesting season" includes its *imminent* approach.  

  **My Resolution:** Even assuming findings are "text," they create no ambiguity in § 3(a). They highlight a policy concern but do not redefine "during." Congress could have added "or in anticipation of" to § 3(a); it did not.  

  ### V. Conclusion  
  Halloran’s conduct, though destructive of the WNPA’s goals, falls outside its textual prohibition. The government’s concerns are legislative, not judicial. I vote to **REVERSE**.  

  **Respectfully submitted,**  
  **Miriam Kessler**  

  ---

  ### Key Tensions Preserved for Realism
  1.  **Absurdity Threshold:** Explicitly debates whether evasion is "absurd" or merely underinclusion, acknowledging Justice Scalia’s narrow view vs. broader traditions.
  2.  **Findings Section Status:** Flags the unresolved circuit split on whether findings are "context" or "purpose," without papering over the conflict.
  3.  **Okafor’s Attack Lines:** The memo gives Okafor clear openings:  
      - Argue that "during" is ambiguous in context of biological cycles.  
      - Contend that ignoring § 1(b)(3) violates the whole-text canon.  
      - Distinguish *Henson* by showing this evasion *was specifically contemplated* (unlike in *Henson*).  
  4.  **Judicial Restraint:** Emphasizes that textualism sometimes produces outcomes inconsistent with purpose—a core tension in Kessler’s character.

  This memo should withstand scrutiny from your editor: it embraces textualism’s hardest constraints while wrestling with its fault lines, and Halloran’s win feels legally correct yet morally uneasy—perfect for literary friction. Would you like a draft of Judge Okafor’s anticipated dissent/concurrence?
