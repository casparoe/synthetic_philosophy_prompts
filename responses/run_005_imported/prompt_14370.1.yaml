  The physical procedure (straw tossing) isn't just an example—it's key. Rotational/translational invariance reflects that the circle's position doesn't matter. Scale invariance is subtler: changing circle size shouldn't change chord statistics if you're far away. Crucially, these symmetries *constrain* the probability space. "Indifference" alone lets you pick any parametrization (angle, midpoint, etc.), but symmetries demand that your choice must play nice with all these transformations. Only the radial method survives. 

