  For example, in a large world, agents might all be reasoning about whether to cooperate with others. If they recognize that their decision is part of a broader pattern where similar decisions are made elsewhere, they can coordinate. The "similarity" isn't about identical code but about shared decision contexts. UDT/FDT agents choose policies that output actions conditional on the world they're in. If multiple agents implement policies that cooperate when they detect similar decision situations, their cooperation becomes mutually beneficial.

