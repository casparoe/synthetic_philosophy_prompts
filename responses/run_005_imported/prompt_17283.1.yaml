answer: |-
  Here’s a draft recommendation memo addressing the committee’s concerns, balancing historical accuracy, pedagogical value, and philosophical rigor:

  ---

  **MEMORANDUM**  
  **TO:** Editorial Committee, Ethics Sourcebook  
  **FROM:** [Your Name], Bentham Specialist  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation on Excerpting Bentham’s "Offences Against One’s Self" for Classical Utilitarianism Module  

  ### 1. **Recommended Approach: Trimmed Excerpt + Contextual Headnote**
     - **Excerpt:** Include **Section 1 (Introduction)** and **Section 4 (Application to Consensual Homosexual Acts)** from "Offences Against One’s Self" (as printed in *Of Sexual Irregularities*).  
     - **Omit:** Sections arguing for the decriminalization of bestiality and other "irregularities."  
     - **Rationale:**  
       - This preserves Bentham’s core utilitarian argument: consensual acts causing no harm (specifically sodomy) should not be criminalized, as punishment violates utility and stems from the "principle of sympathy and antipathy" (disgust).  
       - It avoids overwhelming introductory students with highly contentious material (e.g., bestiality) that could derail discussion from the philosophical point.  
       - Crucially, **this trimming does not conceal the scope of Bentham’s reasoning** (see Headnote guidance below).  

  ### 2. **Headnote: Essential Content & Caveats**  
  The headnote must:  
     - **State Explicitly** that Bentham applied the *identical* no-harm/antipathy argument to *all* "irregularities," including bestiality, necrophilia, and public indecency (citing *Of Sexual Irregularities*).  
     - **Explain** that his reasoning treats *all consensual, non-procreative acts* identically under utility: if they cause no harm (as he defines it), criminalization is irrational.  
     - **Acknowledge the Philosophical Tension:**  
       > *"Bentham’s argument challenges us to confront whether a consistent harm-based utilitarianism can condemn acts solely on grounds of disgust or conventional morality. His extension of the argument to bestiality (etc.) exposes a boundary problem: if harm is the sole criterion, where—and why—should lines be drawn? This tension remains a live debate in utilitarian sexual ethics."*  
     - **Contextualize Non-Publication:** Note Bentham likely withheld this essay due to fears of societal backlash, not philosophical inconsistency.  
     - **Avoid:**  
       - Implying Bentham’s view aligns neatly with modern LGBTQ+ advocacy (his framework was analytical, not emancipatory).  
       - Suggesting his logic is "flawed" because it extends to bestiality (this misrepresents the *deliberate challenge* he poses).  

  ### 3. **Addressing the Philosophical Objection**  
  The concern that trimming misrepresents Bentham’s argument and obscures a genuine difficulty in harm-based sexual ethics is **valid and central to this text’s pedagogical value**. My recommendation addresses this by:  
     - **Transparency in the Headnote:** Explicitly stating the argument’s full scope ensures students understand Bentham’s position isn’t limited to homosexuality.  
     - **Framing the Dilemma:** The headnote reframes the objection as Bentham’s *intended provocation*: utilitarianism’s radical impartiality forces uncomfortable consistency. Omitting bestiality entirely would indeed sanitize his challenge.  
     - **Pedagogical Leverage:** The headnote turns the objection into a **teaching moment**:  
       > *"Bentham forces utilitarians to ask: Can ‘harm’ be defined to exclude certain acts without appealing to disgust? If so, how? If not, what does this imply?"*  

  ### 4. **Why Not Omit or Use a Full Excerpt?**  
     - **Full Excerpt:** Risks students fixating on bestiality, diverting focus from the utility/antipathy argument’s structure and its groundbreaking defense of consensual acts. Pedagogically inefficient for an intro module.  
     - **Omission:** Deprives students of a powerful historical example of utility critiquing moral prejudice. Bentham’s argument predates Mill by 70 years and is philosophically significant precisely because it *doesn’t* conform to modern sensibilities.  

  ### 5. **Proposed Excerpt Verbatim**  
  Include:  
     - **Opening Paragraphs** defining the principle of utility as the sole standard for legislation.  
     - **Key Passage** where Bentham argues that consensual "irregularities" (specifically sodomy) lack an "assignable victim" and cause no pain (beyond what arises from "prejudice").  
     - **Conclusion** where he attributes criminalization to the "principle of antipathy" (disgust) disguised as moral justification.  

  ### 6. **Conclusion**  
  A trimmed excerpt, paired with a headnote that **explicitly acknowledges the argument’s full scope and philosophical tension**, best serves our pedagogical goals. It:  
     - Showcases Bentham’s radical application of utility to sexual morality.  
     - Presents his critique of disgust-based legislation vividly.  
     - Does not conceal the challenge he poses to harm-based ethics.  
     - Encourages critical engagement: *Does utilitarianism require revising Bentham’s harm calculus, or does it demand consistency even where we recoil?*  

  This approach respects both Bentham’s text and the committee’s obligation to foster rigorous, contextually grounded philosophical discussion.  

  ---  

  **Key Philosophical Justification for This Balance:**  
  Bentham’s essay is valuable *because* it exposes the raw logic of utility applied without modern caveats. The discomfort some committee members feel mirrors the discomfort Bentham *wanted* to induce in readers clinging to "antipathy." To omit the broader implications is to neuter the argument; to include every example is to risk obscuring the core principle. By explicitly naming the scope in the headnote, we force students to confront utilitarianism’s least comfortable implications *without* requiring them to parse 18th-century bestiality statutes. This maintains fidelity to Bentham’s challenge while ensuring focus remains on the utility/antipathy framework.
