  I recall that in Bayesian terms, the prior is each lab's estimate. The likelihood incorporates the reliability of both, considering dependencies. If Lab A and B conflict, but Lab A's result implies Lab B's systematic error, then trusting Lab A more pushes the posterior towards or beyond Lab A's value.

