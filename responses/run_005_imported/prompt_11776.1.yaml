prompt: |-
  I'm doing a podcast interview with a philosopher who defends Sharon Street-style evolutionary debunking arguments against moral realism. Her go-to move whenever someone offers a third-factor explanation (like Enoch's) is to just say it 'relocates the coincidence a level up' and move on without engaging the specifics. Write me 7-9 interview questions that make that move harder to fall back on each time -- one that pushes her to actually spell out what a satisfying third-factor explanation would look like, one on the companions-in-guilt reply (why doesn't the same geneological story debunk our confidence in logic or math), one on whether the argument, applied consistently, undermines trust in evolved reasoning generally, including the argument itself, and a last one asking what discovery would actually count as evidence against her view. Add a likely comeback after each question too so I don't get caught flat footed.
