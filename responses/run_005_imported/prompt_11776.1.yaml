  For self-undermining, the key is whether the argument is self-defeating. Street might bite the bullet or distinguish between domains. The comeback could argue that the argument is defeasible but not self-undermining.

  Falsifiability: What would make her reconsider? She might say nothing, or point to evidence of non-adaptive moral truths. The comeback could involve reinterpreting such evidence through her lens.

  I'll structure each question to build on the previous, making it harder to dodge. For example, starting with third-factor, then companions, then self-undermining, ending with falsifiability. Each question should reference prior answers to prevent evasion.

