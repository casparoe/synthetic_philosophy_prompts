prompt: |-
  So for my ethics elective we read part of Anscombe's pamphlet "Mr. Truman's Degree" (the one where she rips into Oxford for giving Truman an honorary degree over Hiroshima/Nagasaki), and separately in that same unit we covered the doctrine of double effect using the standard trolley/craniotomy examples. My teacher kind of implied that Anscombe's whole case against Truman is basically just a double effect argument — like she's applying the intended-vs-merely-foreseen distinction to civilian deaths — but that feels like its missing something, since theres also this whole "obliteration bombing" framing and her general beef with consequentialism. Can you compare what Anscombe is actually doing in that pamphlet to plain DDE reasoning? Like is her argument against Truman just a special case of DDE, or is she doing something extra that makes her verdict (that Truman was basically a murderer) stronger/different from what a normal DDE analysis would give you?
reasoning: |-
  Okay, let me unpack this user's question. They're studying Anscombe's "Mr. Truman's Degree" in an ethics class and noticed their teacher framed her argument against Truman as a straightforward double effect (DDE) application. But the user senses there's more going on - especially with Anscombe's "obliteration bombing" concept and her anti-consequentialist stance. 

  Hmm, the user seems analytically sharp - they've caught that reducing Anscombe to DEE oversimplifies her position. They're asking whether her condemnation of Truman as a "murderer" relies solely on DDE or has additional dimensions. This deserves careful unpacking because Anscombe's pamphlet is indeed operating on multiple levels.

  First, let me mentally reconstruct the core DDE argument about Hiroshima: it would claim Truman didn't intend civilian deaths (intended target: Japan's war capacity) and merely foresaw civilian casualties. But the user is right to question this - Anscombe explicitly rejects such reasoning. Why? Because the bombing's entire design made civilian extermination inseparable from the method. 

  Ah, here's the crucial difference: DDE focuses on the agent's subjective intent, but Anscombe emphasizes the objective nature of the act. When you choose a weapon designed for indiscriminate slaughter, your "intention" becomes irrelevant - the act itself is intrinsically murderous. That's why she insists Truman can't hide behind "I only intended surrender" when the chosen means necessitated mass civilian death.

  The user also noted "obliteration bombing" as key - exactly right. Anscombe coins this term to distinguish weapons that by their nature cannot discriminate combatants from non-combatants. This isn't just about scale; it's about inherent design. Traditional DDE discussions (like trolley problems) assume distinguishable victims, but obliteration weapons erase that distinction physically and morally.

  And yes, her deeper beef with consequentialism matters hugely. While DDE operates within broader ethical systems, Anscombe sees consequentialism itself as the root poison. For her, Truman's real sin was adopting the utilitarian mindset that civilian lives can be traded for political ends. This frames her argument not just as casuistry but as a wholesale rejection of the moral framework enabling such decisions.

  The user's phrasing "stronger/different than normal DDE" is perceptive. Normal DDE might theoretically excuse Hiroshima if intent were "pure," but Anscombe's version says: certain means are so inherently evil that intent becomes morally irrelevant. That's why she calls Truman a murderer - not for intending death per se, but for choosing an intrinsically murderous tool.

  I should emphasize how this connects to her Thomistic influences too. Aquinas's principle that "circumstances make an action evil" applies here - the circumstance of using indiscriminate weapons transforms the entire act. Also worth noting her later "Modern Moral Philosophy" critique: without concepts like mortal sin, we've lost vocabulary to condemn acts like Truman's properly.

  The user seems ready for advanced analysis - they've already spotted the limitations of their teacher's DDE framing. I'll highlight how Anscombe transcends traditional double effect by: (1) focusing on act-character over intent, (2) defining a category of inherently indiscriminate weapons, and (3) embedding this in a wider assault on consequentialist ethics. Might also mention how her "practical truth" concept makes the "not intending deaths" defense hollow when the method guarantees them.

  ...Better also distinguish from Foot's trolley problem, since Anscombe would likely reject that scenario's forced choice as artificial. Real-world obliteration bombing involves creating new evils rather than redirecting existing threats. That contrast could help the user see why she considers Hiroshima categorically different from standard DDE dilemmas.
answer: |-
  You're absolutely right to sense that reducing Anscombe's argument against Truman to *just* the Doctrine of Double Effect (DDE) significantly understates her case. While DDE plays a crucial role, her condemnation of Truman is **stronger, broader, and fundamentally different** in its grounding compared to a standard DDE analysis. Here's a breakdown:

  1.  **Standard DDE Analysis Applied to Hiroshima/Nagasaki:**
      *   **Intended End:** Force Japan's surrender / End the war / Save Allied lives.
      *   **Intended Means:** Drop atomic bombs on military-industrial targets (or cities containing such targets).
      *   **Foreseen Consequence:** Deaths of tens of thousands of non-combatant civilians (men, women, children, elderly).
      *   **DDE Verdict (Potentially):** *If* the *sole* intention was to destroy military targets/war capacity *and* the civilian deaths were truly unintended (merely foreseen) side-effects, *and* there was a proportionate reason (saving millions of lives by ending the war quickly), *then* DDE *might* morally permit the bombing. Many contemporary (and subsequent) justifications *did* implicitly follow this structure.

  2.  **Anscombe's Argument: Going Beyond and Rejecting the DDE Framing:**
      Anscombe **rejects** the idea that the DDE could possibly justify Hiroshima/Nagasaki. Her argument has several layers that make her condemnation far harsher than a simple DDE failure:

      *   **"Obliteration Bombing" as an Intrinsically Evil Act:** This is the core distinction. Anscombe argues that targeting entire cities ("obliteration bombing") with weapons *known* and *designed* to indiscriminately kill vast numbers of civilians is **not merely a means with bad side-effects; it is the direct, intentional killing of the innocent as a means to an end.** The act itself, by its very nature, involves *choosing* to destroy non-combatants.
          *   **Why it's Intentional:** You cannot *choose* to obliterate a city without *choosing* the deaths of its inhabitants. The deaths are not a separable consequence; they are the *constitutive element* of the act of obliteration. Truman *chose* a weapon and a target that guaranteed mass civilian slaughter. Anscombe argues this makes the civilian deaths **intended in the choice of the act**, not merely foreseen.
          *   **Distinction from Collateral Damage:** She distinguishes this from bombing a specific munitions factory where some nearby civilians *might* be killed as a side-effect. Obliteration bombing makes civilians the *direct object* of the attack.

      *   **Rejecting the "Not Intended" Defense:** She sees the claim that civilian deaths were "not intended" in obliteration bombing as **disingenuous or morally blind.** When you deliberately use a method *defined* by mass civilian killing, you cannot hide behind the "intention" defense. The act speaks for itself: "You *chose* to kill them to achieve your goal."

      *   **The Primacy of the Prohibition Against Murder:** Anscombe operates within a natural law framework where the prohibition against the direct, intentional killing of the innocent is absolute. Obliteration bombing, by directly targeting the innocent (even if wrapped in rhetoric about military targets within cities), violates this absolute prohibition. **No consequentialist calculation (proportionate reason) can override this absolute ban on murder.**

      *   **Fundamental Rejection of Consequentialism:** This is the bedrock. Anscombe saw Truman's decision (and the reasoning behind it) as a prime example of the corrupting influence of consequentialism – the idea that the ends justify the means. For her, the moral character of an *act itself* matters fundamentally. Choosing an intrinsically evil act (mass murder of innocents) can *never* be justified by good consequences (ending the war, saving lives). **DDE operates *within* a system that accepts proportionality as a condition; Anscombe's absolute prohibition on murderous acts rejects consequentialism *altogether* at this fundamental level.** Her beef isn't just with *this* application of DDE; it's with the entire utilitarian mindset that made such an act thinkable.

      *   **"Practical Truth":** Anscombe emphasizes that morality isn't just about internal mental states ("I didn't *intend* their deaths"). It's about **"practical truth"** – the objective reality of what you *do*. Choosing to obliterate a city *is* choosing to murder its inhabitants, regardless of what you tell yourself you "intend." Truman's *choice* was the choice of mass murder.

  3.  **Comparing the Verdicts:**
      *   **Standard DDE:** *Might* conclude the bombing was morally permissible *if* the civilian deaths were truly unintended side-effects and the proportionality was overwhelming. It *could* also conclude it was impermissible if the civilian deaths were intended or if proportionality wasn't met. It leaves room for debate about intention and proportionality.
      *   **Anscombe:** Concludes unequivocally that Truman is **guilty of mass murder.** Obliteration bombing is an intrinsically evil act (direct intentional killing of innocents) that can never be justified. The "not intended" defense is invalid for this type of action. Truman chose murder as his means.

  **Conclusion:**

  Your teacher is partially right that Anscombe *uses* the distinction between intended and foreseen effects, which is central to DDE. **However, she is not merely *applying* DDE; she is leveraging it to make a much stronger and more fundamental point:**

  1.  **She argues that "obliteration bombing" inherently *fails* the DDE's first condition:** The civilian deaths are *not* merely foreseen side-effects; they are **intended in the choice of the act itself** because they are the necessary and defining outcome of the chosen method.
  2.  **She grounds this in an absolute moral prohibition** against the direct killing of the innocent, rejecting the consequentialist proportionality calculus that DDE often relies upon as a secondary condition.
  3.  **Her condemnation is absolute and categorical:** Truman wasn't just someone who *might* have failed a DDE test due to murky intentions or debatable proportionality; he was someone who **chose an act defined as mass murder.** He was, in her view, a murderer.

  Therefore, Anscombe's argument is **not just a special case of DDE.** It uses the *language* of intention vs. foresight to **expose obliteration bombing as a category of action that is *intrinsically murderous* and thus absolutely forbidden, regardless of consequences.** Her case against Truman is far stronger and more damning than a standard DDE analysis could produce because it rejects the very framework (consequentialism) that makes DDE's proportionality condition necessary. She saw the bombing not as a tragic necessity potentially justified by DDE, but as a paradigm example of modern consequentialist barbarism.
