answer: |-
  That's a sharp observation, and you're right that the impossibility proof came much later. However, the Hobbes-Wallis feud is **less about who was ultimately right about the *possibility* of squaring the circle** (neither knew the definitive answer) **and much more about methodology, mathematical rigor, philosophy, and yes, protecting turf/paradigms.** Casting Hobbes as the "misunderstood genius" is likely a misreading, though he *was* fundamentally challenging the establishment's *approach*.

  Here's a breakdown of why the feud happened and why Wallis wasn't just "guessing" in the same way:

  1.  **Hobbes's Errors Were Demonstrable *Now*:** Wallis and others weren't just saying "This feels wrong." They **mathematically demolished each of Hobbes's specific published attempts** to square the circle. Hobbes made fundamental algebraic errors, faulty constructions, and logical leaps that were provably incorrect *using the mathematical tools available at the time*. Wallis repeatedly pointed these out in detail. Hobbes wasn't presenting a viable, unappreciated method; he was presenting flawed proofs that could be (and were) refuted.
  2.  **Methodological Clash: Materialism vs. Abstract Algebra & Analysis:**
      *   **Hobbes:** His geometry was rooted in his materialist philosophy. He believed geometry *must* be based on physical constructions with compass and straightedge (or their mechanical equivalents). He rejected abstract algebraic symbols (calling Wallis's algebra "scab of symbols") and the new methods of analysis (infinitesimals, limits emerging with Cavalieri, Fermat, Barrow) as meaningless abstractions divorced from physical reality. His attempts reflected this rigid, construction-bound view.
      *   **Wallis & Oxford/Royal Society:** They were pioneers embracing symbolic algebra and nascent calculus/infinitesimal methods. Wallis's *Arithmetica Infinitorum* (1655) was groundbreaking. They saw these tools as *more* powerful and general than strict Euclidean construction. Hobbes's attacks weren't just on their circle-squaring opinion; they were an assault on the entire *direction* of modern mathematics they were building.
  3.  **Philosophical & Political Undertones:** Hobbes (author of *Leviathan*) was a hugely controversial political philosopher. His materialism and views on sovereignty threatened both religious and academic establishments. His foray into mathematics was seen by many (especially at the newly formed Royal Society, which excluded him) as an arrogant intrusion by a "mere" philosopher into a specialized field. Defeating him mathematically was also about defending the autonomy and expertise of the new scientific institutions.
  4.  **Was Wallis "Guessing" About Impossibility?** Not exactly. While a formal proof was centuries away, **mathematicians had strong *indications* that squaring the circle was extraordinarily difficult, likely impossible with classical tools:**
      *   The transcendence of π wasn't known, but its irrationality was suspected (proven by Lambert in 1768).
      *   The *nature* of the problem (relating a linear dimension to an area via an irrational constant) was recognized as profoundly deep.
      *   **Crucially, Wallis could see that Hobbes's *specific approaches*, based on faulty algebra and a rejection of powerful new methods, were doomed.** His "certainty" was less about knowing the absolute impossibility and more about knowing Hobbes's methods were fundamentally inadequate and error-prone. He saw Hobbes as not even playing the same game competently.
  5.  **The "Pile-On" Element:** Absolutely real. Wallis was relentless, often personal, and clearly enjoyed humiliating Hobbes. The Royal Society crowd largely sided with Wallis. This *was* about defending their turf, their methods, and their status against a famous but (in their view) mathematically incompetent outsider who dared to challenge them. Hobbes's stubborn refusal to admit errors fueled the fire.

  **So, is there a "Misunderstood Genius" Angle?**

  *   **Not in the math itself:** Hobbes wasn't secretly correct. His proofs were genuinely wrong by the standards of his time and ours. He wasn't a mathematical genius ahead of his time; he was philosophically brilliant but mathematically out of his depth and resistant to learning.
  *   **But as a Challenger to Paradigms? Potentially:** His *philosophical challenge* to abstract mathematics had a point, even if his execution was disastrous. He forced mathematicians to confront questions about the foundations and meaning of their symbols and methods. In a *very* broad sense, his materialism foreshadowed later foundational debates (though not productively in this instance). His insistence that math should connect to the physical world resonates with some modern applied perspectives, but his rejection of algebra was fundamentally regressive.

  **Conclusion for Your Piece:**

  *   **Avoid:** Framing Hobbes as the "genius who was right all along about the circle" – he wasn't, and his methods were flawed.
  *   **Emphasize:** This was a **clash of worlds**: Ancient vs. Modern, Construction vs. Algebra/Analysis, Philosopher vs. Mathematician, Outsider vs. Establishment Institution.
  *   **Highlight:** The feud was driven by **demonstrable mathematical errors** by Hobbes, **philosophical hostility** to new methods, **institutional protectionism**, and **personal animosity**.
  *   **Nuance:** Wallis wasn't "guessing" Hobbes was wrong; he was *proving* Hobbes's specific proofs were invalid. His intuition about the difficulty/impossibility was based on mathematical sophistication Hobbes lacked, not a random guess.
  *   **The "Misunderstood" Part:** Hobbes *was* misunderstood *as a mathematician* only in the sense that his *philosophical motivations* for attacking algebra were dismissed along with his errors. His core challenge about the meaning of mathematical objects was philosophical, not mathematical, and arguably got lost in the (justified) mathematical ridicule. The establishment piled on partly because he threatened their very *way* of doing math, not just their opinion on circle-squaring.

  **Strong Angle:** Portray Hobbes as a brilliant **philosophical disruptor** who waded into a highly technical field he didn't fully grasp, using flawed tools to attack the new paradigm. The establishment response was a mix of **valid mathematical critique** and **institutional/personal defensiveness**. The impossibility proof centuries later is an ironic footnote, not vindication for Hobbes's methods. The real fight was about the soul of mathematics itself.
