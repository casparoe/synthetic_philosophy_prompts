  First, I need to unpack the philosophical tension here. The parents see promises as binding regardless of feelings, while the friends view traditional "forever" vows as potentially dishonest. The user wants the toast to validate both perspectives without neutrality. 

  Hmm... the user mentioned Hume, Hobbes, and Scanlon in their research. Hume's convention theory could frame marriage as a social institution, Hobbes highlights the purpose of promises when motivation fades, and Scanlon's fidelity principle focuses on created expectations. 

