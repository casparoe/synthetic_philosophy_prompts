prompt: |-
  Ok so this has become weirdly relevant to my life lately — my mom passed away last spring and my family's in the middle of a wrongful death case against the hospital, because her doctor never ordered a follow-up scan even though her bloodwork had been off for almost a year, and our lawyer's whole argument is that his *not* ordering it is what caused the cancer to be caught too late. In one deposition the hospital's own expert actually said "an omission can't really be a cause of anything," which sent me down a total rabbit hole. Turns out theres a genuine philosophical fight about this: Lewis's counterfactual theory of causation is fine calling the not-ordering a cause (since if he had ordered the scan, she'd have caught it in time), but Dowe's process theory says real causation requires some actual transfer of energy/momentum between things, and since nothing physically happened there's no process to point to, so at best he calls it "quasi-causation" rather than the real thing. Can you walk me through how each of these two views would actually handle a case like my mom's, and tell me which one holds up better under pressure? Also — if "not ordering the scan" counts as a cause, doesn't literally every other doctor on the planet who also didn't order her a scan count as a "cause" of her death too? Do either of these theories have a decent answer to that?
