  Marcus's first point (1) challenges the practical relevance of Dutch books. He argues that avoiding bets doesn't reflect flawed beliefs but just smart avoidance. But he's missing that the argument targets the internal consistency of beliefs as revealed by betting dispositions. Daniela's response (2) correctly notes that within the operational framework, refusing bets means undefined credences. Her symmetry point about immunity is strong, though she could emphasize more how coherence protects against exploitation.

