  For concrete recommendations, I'm considering suggesting three simultaneous actions: 1) Protect the junior staff (temporary reassignment?), 2) Investigate patterns (check if there are other concerns about the senior fellow), and 3) Improve systems (training, clearer reporting). This shows action without premature judgment.

