  I recall that epistemicism, championed by Timothy Williamson, claims that vague predicates have sharp boundaries that are unknowable. Supervaluationism, associated with Kit Fine, argues that vague predicates are true in some precisifications, false in others, leading to truth-value gaps for borderline cases. The core disagreement centers on higher-order vagueness - the vagueness of "definitely" or "borderline" itself.

  The user's dinner argument is fascinating. Their friend defended supervaluationism as "disciplined" because it avoids privileging any sharp cutoff, while they pushed back with the epistemicist critique about higher-order vagueness. Neither convinced the other. Now they want an essay resolving this.

  For my approach, I'll need to:
  - Clearly explain both theories
  - Show how each handles first-order vagueness
  - Dive deep into higher-order vagueness as the test case
  - Analyze how each theory responds to the challenges
  - Reach a clear verdict on which handles it better

  The challenge is that higher-order vagueness really pressures both theories. For supervaluationism, it creates a regress problem: if "admissible precisification" is vague, do we need meta-precisifications? For epistemicism, it intensifies the unknowability problem: why are we so deeply ignorant of these boundaries?

  I should acknowledge that both views struggle here, but argue that epistemicism ultimately handles it more coherently. Supervaluationism's attempt to avoid sharp boundaries leads to either circularity or infinite regress when handling higher-order vagueness. Epistemicism's embrace of sharp boundaries, while counterintuitive, provides a more stable framework.

  The essay should conclude firmly that epistemicism survives the higher-order vagueness challenge better, even if its conclusions are uncomfortable. I'll structure it to build this case step by step, giving supervaluationism fair treatment before showing why it falters under pressure.
answer: |-
  ## The Sharp Edge of the Blurry: Why Epistemicism Survives Higher-Order Vagueness

  The dinner-table debate between supervaluationism and epistemicism cuts to the core of how language hooks onto a world seemingly riddled with indeterminacy. Your friend champions supervaluationism's elegant avoidance of sharp cutoffs; you counter with epistemicism's insistence that the problem merely relocates. The battleground of higher-order vagueness – the vagueness *of* the borderline itself – is where this clash reaches its zenith. While both theories grapple with profound difficulties, epistemicism ultimately provides a more coherent, albeit austere, account of vagueness under the relentless pressure of higher-order indeterminacy. Supervaluationism, for all its initial discipline, crumbles under its own regress.

  **The Contenders: First Pass**

  *   **Supervaluationism:** This view treats vague predicates as semantically *incomplete*. The meaning of "heap" doesn't specify a single, precise boundary. Instead, it defines a range of *admissible precisifications* – ways of drawing a sharp line consistent with the predicate's meaning and usage. A sentence ("This is a heap") is:
      *   **Super-true:** True on *all* admissible precisifications.
      *   **Super-false:** False on *all* admissible precisifications.
      *   **Neither (Indeterminate):** True on some precisifications, false on others (the borderline cases).
      *   **Strengths:** Captures the intuitive lack of a fact of the matter for borderline cases. Avoids committing to unknowable sharp boundaries in the object language. Explains why we hesitate in borderline zones.
  *   **Epistemicism (Williamson):** This view is radical. Vague predicates *do* have sharp, precise boundaries. "Heap" draws a definite line in the sand of grains. The apparent indeterminacy is purely *epistemic*: we cannot *know* where that line is. Borderline cases are simply cases where we lack the knowledge to classify them correctly. There *is* a fact of the matter, but it is in principle unknowable due to the nature of meaning and our limited epistemic access.
      *   **Strengths:** Preserves classical bivalence (every statement is true or false). Avoids semantic indeterminacy and truth-value gaps. Provides a seemingly simple ontology: the world is precise, our knowledge is fuzzy.

  **The Crucial Test: Higher-Order Vagueness**

  The fatal flaw in supervaluationism, as you rightly pressed, emerges when we ask: What defines the class of *admissible* precisifications? "Admissible" is itself vague. Is a precisification that draws the line at 10,000 grains definitely admissible? What about 10,001? 9,999? There seems to be no sharp boundary between precisifications that are definitely admissible, definitely inadmissible, and borderline admissible. This is higher-order vagueness – vagueness concerning the very machinery (admissibility) supervaluationism uses to model first-order vagueness.

  *   **Supervaluationism's Dilemma:**
      1.  **Relocate the Cutoff:** Insist that "admissible" has a sharp boundary in the metalanguage. But this simply pushes the problem up a level. What makes *that* metalanguage predicate precise? We face an infinite regress of sharp cutoffs in ever-higher meta-languages. This abandons the core supervaluationist motivation – avoiding sharp boundaries – by proliferating them invisibly. It fails to explain the *origin* of vagueness, merely kicking the can.
      2.  **Iterate Indefinitely:** Apply the supervaluationist machinery *to the admissibility predicate itself*. We now need super-truth relative to precisifications *of* the admissibility conditions. But this generates a further level of vagueness concerning *those* meta-admissibility conditions. We spiral into an infinite regress of precisifications and meta-languages. Not only is this ontologically profligate, it renders the theory explanatorily impotent. What *is* the supervaluationist account of vagueness now? It dissolves into an infinite hierarchy of indeterminacy, failing to ground the phenomenon it set out to explain. The initial "discipline" vanishes in a fog of meta-levels. The theory becomes mired in its own machinery, unable to say *why* any predicate is vague to begin with, only that its analysis requires infinite complication.

  *   **Epistemicism's Response:** Epistemicism meets higher-order vagueness head-on with a single, consistent, though deeply counterintuitive, move: **embrace sharp boundaries *all the way up***.
      *   "Definitely a heap" has a sharp boundary.
      *   "Definitely definitely a heap" has a sharp boundary.
      *   "Admissible precisification" (if we even need that concept) has a sharp boundary.
      *   The unknowability simply extends upwards. We cannot know where the boundary of "definitely P" lies, nor the boundary of "definitely definitely P," and so on. Each higher-order predicate suffers the same epistemic limitation as the first-order one.
      *   **Coherence through Uniformity:** While this proliferation of unknowable facts is deeply unsettling, it maintains theoretical coherence. The *explanation* for vagueness remains constant: meaning fixes sharp boundaries, but our epistemic access to meaning (especially concerning marginal cases) is necessarily limited and inexact. Higher-order vagueness doesn't introduce a *new* problem; it merely reiterates the *same* problem at higher levels. The core epistemicist thesis – vagueness *is* ignorance of sharp boundaries – scales vertically without contradiction or regress. It treats all orders of vagueness uniformly under the umbrella of unknowability.

  **The Verdict: Epistemicism's Austere Survival**

  Supervaluationism's attempt to banish sharp boundaries founders disastrously on the rocks of higher-order vagueness. Its two escape routes – relocating the cutoff or iterating machinery – are fatal. Relocation betrays its core motivation by implicitly accepting sharp boundaries while obscuring them. Infinite iteration renders the theory explanatorily vacuous and infinitely complex, collapsing under its own weight. It fails the central test: it cannot provide a stable, non-regressive account of what *makes* a predicate vague, once the vagueness of its own key concepts (admissibility) is acknowledged.

  Epistemicism, in stark contrast, survives the test through unflinching consistency. By biting the bullet and accepting sharp boundaries *everywhere*, coupled with pervasive unknowability, it avoids the regress. Higher-order vagueness becomes a predictable consequence of the same fundamental mechanism operating at higher levels. The explanation for vagueness – ignorance of meaning-determined boundaries – remains singular and applies universally. While the ontological commitment to myriad unknowable facts is profoundly counterintuitive and philosophically costly, it is a *coherent* cost. Epistemicism doesn't collapse under higher-order pressure; it simply extends its core claim vertically.

  Therefore, despite its deeply unpalatable consequences, **epistemicism handles the problem of higher-order vagueness decisively better than supervaluationism.** Supervaluationism's initial appeal – its discipline in avoiding object-language sharp cutoffs – proves illusory when scrutinized. Its structure cannot contain the regress ignited by its own foundational concepts. Epistemicism, though demanding we accept a world saturated with unknowable precision, provides a stable, non-regressive, and uniform explanation for vagueness at all orders. It wins not by being intuitively satisfying, but by being logically resilient where its rival fractures. The sharp boundaries epistemicism posits are the hidden skeleton giving structure to the blurry flesh of our language; supervaluationism, seeking to dissolve that skeleton, finds only an infinite hall of mirrors reflecting its own explanatory void. The verdict, however uncomfortable, leans towards the sharpness within the blur.
