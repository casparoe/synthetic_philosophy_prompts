  How about software? A specific module in a legacy system failing during an upgrade. Classes: all modules in the system vs. modules with similar complexity and age. But that's IT, maybe too niche. 

  Art conservation? Assessing the risk of damage to a specific painting during transport. Classes: all paintings vs. paintings from the same period/medium vs. those with similar past restoration. That could work. The decision to transport or not flips based on probability. 

  But let's develop it. The painting is a 19th-century oil painting by a lesser-known artist. Class 1: all oil paintings transported. Class 2: paintings from the same artist. Class 3: paintings with similar craquelure patterns. Artist-specific data is sparse, leading to different probabilities. If Class 1 has low damage risk, transport is safe. Class 3 has high risk due to craquelure, suggesting danger. Each class is defensible: Class 1 for general rates, Class 2 for artist-specific factors, Class 3 for material vulnerability. 

  The resolution? Maximal specificity suggests Class 3, but data is sparse. Indeterminacy remains due to trade-offs between specificity and data robustness. This illustrates the core problem without using traditional domains. 

