prompt: |-
  Ok this one's been eating at me. My older sister died of cancer when I was 22 (im 35 now), and near the end she made me promise id never write about what happened with our dad -- there was an affair, it split the family for a couple years, and she didn't want our name anywhere near it in print. I said yes, obviously, you don't argue with your dying sister. Both parents are gone now too, and I've finally admitted the only version of my third novel with any real heat in it uses that material, disguised but recognizable to anyone who knew us. No living person would be hurt by it going in, but writing it still feels like breaking something real, not just guilt with nothing behind it. Am I actually still bound by that promise, or is there nothing left for it to bind to? Give me your actual reasoning, not a gut check.
