answer: |-
  Your critique hits on a profound and longstanding debate in economics and philosophy of science. You're absolutely right that the **basic definition of revealed preference appears tautological**: "You chose X over Y, therefore you prefer X to Y." And since "utility" is defined as whatever numerical representation matches those choices, "maximizing utility" seems to say nothing more than "choosing what you chose." This is the core of the "tautology critique."

  However, economists and decision theorists argue that the concept of "utility maximization" becomes **non-tautological, substantive, and testable** when we impose specific **consistency requirements** on choices across *different* situations. The key lies in moving from single choices to *patterns* of choice:

  1.  **The Axioms of Revealed Preference (ARP):** These are the rules that transform choice data into a testable theory:
      *   **Weak Axiom of Revealed Preference (WARP):** If you choose X when Y is available, then you should *never* choose Y when X is available *in a situation where both are available again*.
      *   **Strong Axiom of Revealed Preference (SARP):** Extends WARP to chains of choices. If X is revealed preferred to Y (directly or through a chain like X > A > B > Y), then Y should *not* be revealed preferred to X. This ensures choices are *transitive*.
      *   **Generalized Axiom of Revealed Preference (GARP):** A generalization that allows for indifference (where you might choose X or Y when both are available).

  2.  **How it Escapes Tautology:** The claim "The agent is maximizing a utility function" becomes falsifiable because it makes a strong prediction: **The agent's choices must satisfy these consistency axioms (like SARP or GARP) across all possible choice sets.**

      *   **Example of Falsification:**
          *   **Scenario 1:** You choose Coffee over Tea when both are available. (Revealed: Coffee ≻ Tea)
          *   **Scenario 2:** You choose Tea over Juice when both are available. (Revealed: Tea ≻ Juice)
          *   **Scenario 3:** You choose Juice over Coffee when both are available. (Revealed: Juice ≻ Coffee)

          This pattern violates transitivity (Coffee ≻ Tea ≻ Juice ≻ Coffee). There is *no possible utility function* that can assign numbers to Coffee, Tea, and Juice such that U(Coffee) > U(Tea) > U(Juice) and U(Juice) > U(Coffee). The claim "you are maximizing utility" is **falsified** by this inconsistent behavior. This is a *testable prediction* that fails.

  3.  **Why Economists Find it Useful & Substantive:**
      *   **Predictive Power:** If choices *are* consistent (satisfy SARP/GARP), we can:
          *   **Predict behavior in new situations:** If we see you choose Coffee over Tea, and Tea over Juice, we predict you'll choose Coffee over Juice if only those two are offered. This prediction is non-trivial.
          *   **Construct a utility function:** We can assign numbers representing the *ordinal ranking* implied by the choices. This function "rationalizes" the observed choices.
          *   **Analyze welfare:** We can make (careful) statements about whether a change (e.g., a new policy) makes you better off or worse off based on your *revealed* choices before and after or in counterfactual scenarios (using techniques like compensating variation).
      *   **Normative Ideal (Rationality):** Consistency (transitivity, etc.) is considered a fundamental requirement of rationality in most economic models. Choosing intransitively (like A > B > C > A) is seen as irrational because it can lead to being "money pumped" – someone could exploit you into paying to cycle endlessly through choices you prefer, ending up back where you started but poorer. Revealed preference theory provides a clear behavioral benchmark for this consistency. An agent whose choices violate SARP is demonstrably *not* behaving according to the rational ideal of consistent preference maximization.
      *   **Parsimony & Foundation:** It provides a minimal, observable foundation for demand theory without requiring introspection or direct measurement of unobservable psychological "utils." It shifts the focus to what we *can* observe: choices under constraints.

  4.  **Important Nuances & Criticisms Economists Acknowledge:**
      *   **"As If" Interpretation:** The theory doesn't claim people *literally* have a utility number in their head they consult. It claims people *behave as if* they are maximizing *some* consistent underlying preference ordering. The utility function is a mathematical representation of that ordering.
      *   **Context Dependence:** Real choices can be highly context-dependent (framing effects, menu dependence, temptation), violating the axioms. Behavioral economics thrives on documenting these violations.
      *   **Limited Scope:** Revealed preference says nothing about *why* preferences are what they are, whether they are "good" preferences, or about choices involving risk/uncertainty without additional assumptions (like expected utility theory).
      *   **Not Trivially True:** While the *definition* of preference is behavioral, the *consistency requirements* are not automatically satisfied by all behavior. We observe violations constantly (e.g., preference reversals). The theory *is* falsified by these observations, demonstrating it's not an empty tautology.
      *   **Revealed Preference vs. Welfare:** Using *only* revealed preference to judge welfare is highly controversial, especially if choices are inconsistent, influenced by addiction, misinformation, or lack of self-control. Economists often use additional criteria for welfare analysis.

  **Conclusion:**

  You're correct that the *core definition* ("choice reveals preference") is circular if taken in isolation for a single choice. However, the theory of revealed preference **escapes tautology by making strong, falsifiable predictions about the *patterns* of choices across *multiple* decision contexts.** The requirement for consistency (embodied in axioms like SARP/GARP) is the substantive, testable core of the claim that an agent is "maximizing utility." When choices violate these axioms, the theory is falsified. When they satisfy the axioms, the theory gains predictive power and provides a coherent (though limited) model of behavior and a specific definition of rational consistency. Economists value it for this predictive and normative structure, while acknowledging its limitations and the reality of frequent violations explored by behavioral economics.
