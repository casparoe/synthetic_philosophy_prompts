  i tried to find an actual proof of it but it was all conditional expectations and convexity arguments and i kinda lost the thread. could you explain WHY this is true in a more gut-level way, without needing heavy notation? also — i feel like ive read about situations (game theory stuff, or just normal life, like not wanting to know your surprise party plans) where NOT knowing something seems better for you. is that not actually a counterexample, or does the theorem secretly only apply to some narrower setup than i'm assuming? dont need to look anything up, just explain it like im a highschooler who's only had one intro stats class lol
