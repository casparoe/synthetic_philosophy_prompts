prompt: |-
  I'm a philosophy PhD student working on collective agency, and I've been asked to chair the Q&A after a colloquium talk by a guest who argues that the discursive dilemma shows collective bodies—courts, boards, committees—have judgments that cannot be reduced to any simple tally of their members' verdicts on the bottom-line question. Draft eight to ten interview questions that go beyond having her restate the view: I want at least one question on the deflationary charge that the dilemma is just a Condorcet-style voting artifact with no metaphysical import, one on whether the premise-based procedure's reliance on a prior premise/conclusion split just relocates the agenda-setting power her theory is meant to diagnose, and one on whether generalizing Arrow's theorem to judgment aggregation commits her to finding group agents in every ordinary vote-taking body, from faculty meetings to legislatures—and close the sequence with a question about what finding from the judgment-aggregation literature, if any, she would accept as evidence against the view. For each question, add a follow-up keyed to the answer she is most likely to give.
