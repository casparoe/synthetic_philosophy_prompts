  The core disagreement centers on **whether war's moral structure is fundamentally individualist (Farah/McMahan) or institutional/conventionalist (Nate/Walzer)**. Farah effectively argues that individual moral liability *must* underpin any war convention, even if practical symmetry is adopted. Nate counters that war's collective, rule-governed nature makes individual liability an ill-fitting framework. 

