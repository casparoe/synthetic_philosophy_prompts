  I recall Erving Goffman's presentation of self-theory. People manage impressions through social media, curating their image. So, the birthday post isn't just for the friend; it's a performance for the group. It signals to everyone that the friendship is recognized publicly. That explains why a private message doesn't have the same impact—it lacks the audience.

  Then there's the concept of conspicuous investment. Even if the post takes ten minutes, making it public shows you're willing to invest social capital. It's a visible sacrifice, whereas private efforts are invisible. The user's friend felt hurt by a two-word comment because it lacked this visible effort, making the friendship seem undervalued in the group's eyes.

  Also, social media creates a competitive environment. When multiple people post elaborate tributes, it sets a norm. Not participating can be seen as not caring enough. The user feels pressure to conform even though they find it performative. Their internal conflict arises from valuing authenticity but also craving public validation.

