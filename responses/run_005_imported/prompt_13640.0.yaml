  First, I need to establish Sidgwick's philosophical dilemma clearly. His "dualism of practical reason" wasn't just academic - it caused him genuine existential distress. The Methods of Ethics shows his desperation for cosmic moral harmony. This context is crucial because it makes his psychical research feel almost like a lifeline.

  But here's what's impressive: despite this profound personal stake, Sidgwick's actual research practices remained scrupulously skeptical. The Creery sisters case is telling - his own society debunked their "telepathy" when they found signaling. That takes intellectual honesty when you'd rather believe. 

