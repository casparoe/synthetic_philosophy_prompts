  The real test is whether his negative findings changed his views. They did - his later writings show growing disillusionment. That's the smoking gun for intellectual integrity: when your heart says X but your evidence says Y, and you choose Y.

  For the contemporary ethics angle... Sidgwick's dualism remains potent precisely because his empirical rescue failed. Modern ethicists still wrestle with egoism vs altruism without cosmic guarantees. That failure actually validates his philosophical problem as genuine rather than solvable by wishful thinking.

