answer: |-
  Here’s a reasoned reconstruction of Condorcet’s likely verdict on futarchy, grounded in his core principles and tensions within his work:

  ### 1. **Independence and Competence: Markets vs. Juries**  
  Condorcet’s jury theorem relies on two fragile assumptions:  
  - **Independence**: Voters/jurors form opinions without influencing each other.  
  - **Minimal Competence**: Each voter is *slightly* better than random (>50%) at discerning truth.  

  In futarchy, traders are **neither independent nor minimally competent** in Condorcet’s sense:  
  - **Herding and correlated errors**: Markets amplify groupthink (e.g., speculative bubbles). Condorcet feared correlated errors more than individual incompetence, as they undermine aggregation. His *Essai sur l’application de l’analyse* (1785) stressed that dependence makes majority rule *less* reliable, not more.  
  - **Self-selection bias**: Traders are wealthier, risk-tolerant, and epistemically skewed (focused on profit, not truth). Condorcet assumed juries/assemblies should mirror society’s diversity to dilute biases. Traders’ homogeneity would violate this.  
  - **Competence ≠ Profit Motive**: Condorcet saw truth-seeking as a *civic virtue* cultivated by education. Markets reward those with capital and risk appetite, not deliberative wisdom. His *Sketch for a Historical Picture of the Progress of the Human Mind* tied rationality to broad enlightenment, not niche expertise.  

  **Verdict**: Condorcet would reject markets as unreliable truth-aggregators due to structural dependence and skewed competence.

  ---

  ### 2. **Separating Values and Beliefs: Moral Truths vs. Empiricism**  
  Hanson’s "vote on values, bet on beliefs" assumes:  
  - Values are subjective (voted on).  
  - Beliefs are empirical (traded on).  

  Condorcet **rejected this dichotomy** for key domains:  
  - **Moral and Legal "Truths"**: In *Foundations of Social Choice* (1793), Condorcet argued that juries could discover *objective truths* in law and morality through deliberation and aggregation. He saw moral progress as rationally discoverable, not merely preference-based.  
  - **The Indivisibility of Reason**: Condorcet’s *Essay on the Constitution and Functions of Provincial Assemblies* (1788) treated policy as integrated judgments where facts and values intertwine (e.g., "Is this law just?" requires empirical *and* ethical reasoning). Futarchy’s division would strike him as artificial, risking policies that "maximize" a metric while ignoring unquantifiable justice.  
  - **Education Over Fragmentation**: For Condorcet, societal progress required *educating citizens* to refine both moral and empirical judgments (*Report on Public Instruction*, 1792). Markets bypass this, replacing civic growth with transactional empiricism.  

  **Verdict**: He would see futarchy’s value/belief split as a false dichotomy, undermining the holistic reason he prized.

  ---

  ### 3. **Wealth-Weighted Influence vs. Political Equality**  
  - **Condorcet’s Radical Egalitarianism**: He championed universal suffrage (including women and minorities), progressive taxation, and free public education to ensure equal voice (*Letters of a Bourgeois of New Haven*, 1787). Influence proportional to capital would appall him.  
  - **Markets as Oligarchic**: Traders with capital dominate predictions. Condorcet warned that wealth inequality corrupts deliberation: "**The power of wealth is the most terrible enemy of reason**" (*On the Influence of the American Revolution*, 1786).  
  - **Risk Tolerance ≠ Wisdom**: Markets favor the bold, not the prudent. Condorcet valued *deliberative caution*—his jury designs included multi-stage debates and veto points to cool passions.  

  **Verdict**: Wealth-weighted decision-making would violate his foundational commitment to equal voice.

  ---

  ### Condorcet’s Likely Synthesis: Rejecting Futarchy, Refining Aggregation  
  He would critique futarchy on three fronts:  
  1. **Epistemic Flaws**: Markets lack jury-like independence and competence.  
  2. **Philosophical Reductionism**: Separating values/beliefs ignores the integrated nature of rational judgment.  
  3. **Moral Hazard**: Wealth distorts truth-seeking, entrenching inequality.  

  **His Preferred Alternative**:  
  - **Deliberative Assemblies**: Multi-stage juries with debate, rotation, and transparency to approximate independence (*Plan for a French Constitution*, 1793).  
  - **Education First**: Slow enlightenment via public schools to elevate individual competence (*Report on Public Instruction*).  
  - **Technical Adjuncts, Not Replacements**: He *did* propose prediction markets for narrow forecasts (e.g., mortality data) but saw them as tools for informed deliberation—**never** as substitutes for democratic will-formation.  

  ### Why Not Markets? The Deeper Tension  
  Condorcet’s faith in aggregation depended on **civic virtue** nurtured by institutions. Markets incentivize private gain, not public truth. His jury theorem was a blueprint for *democratic reason*; futarchy, to him, would be a surrender to **commercial oligarchy** disguised as empiricism. The "social mathematics" he envisioned was meant to empower the common citizen—not outsource their sovereignty to the highest bidder.  

  As he wrote in *Esquisse*:  
  > "The goal is not to make the majority always right, but to prevent the minority from always imposing its errors."  

  Futarchy, in his eyes, might ensure the latter while abandoning the former.
