prompt: |-
  I'm a philosophy PhD student TAing an intro philosophy of religion course this semester, and we just got through Hume's "Of Miracles," which sent me down a rabbit hole that I don't think the secondary lit I've read (Earman, Fogelin, that kind of thing) really addresses head-on: how would Hume's argument actually hold up against the bureaucratic machinery the Catholic Church now uses to certify miracles, as opposed to the kind of testimony he was originally arguing against?

  Like, at Lourdes there's an International Medical Committee of physicians (not all of them practicing Catholics, from what I understand) that reviews thousands of claimed healings and only ever certifies a tiny handful as "medically inexplicable by current science." Something similar happens for canonizations - a board of doctors has to independently sign off that there's no known natural explanation before a case even reaches the theologians. This seems like it should be a much harder case for Hume than the testimony he actually had in mind, since so much of his "in practice" argument in Part 2 of the Enquiry is really an attack on the witnesses themselves - people driven by "the passion of surprise and wonder," reports that trace back to "ignorant and barbarous nations," rival religions' miracles cancelling each other out, etc. Modern medical boards are trying to be the exact opposite of that: trained skeptics with diagnostic tools Hume couldn't have dreamed of, actively hunting for natural explanations and only demurring when they genuinely can't find one.

  So does that kind of institutionalized, quasi-scientific vetting actually satisfy Hume's maxim that the testimony's falsehood would have to be "more miraculous" than the fact it's attesting to, or is there some deeper reason baked into his argument that would make him unimpressed regardless? My office mate, who's way more sympathetic to natural theology than I am, thinks Hume basically looses this one on his own terms, but I can't quite tell if that's right or if it's missing something. Curious what you think Hume himself - not just later defenders like Earman - would actually say if someone sat him down and explained how Lourdes or the Vatican's canonization process works today.
reasoning: |-
  Okay, let me unpack this fascinating question from the philosophy PhD student. They're grappling with how Hume's miracle argument would hold up against modern Catholic miracle verification processes - specifically the rigorous medical review boards at Lourdes and for canonizations. 

  First, I need to recall Hume's core argument clearly. His central point is that no testimony can establish a miracle unless its falsehood would be even more miraculous than the event itself. The student notes that while Part 1 sets up this probabilistic framework, Part 2 focuses on practical problems with human testimony - credulity, cultural biases, etc. 

  The key insight here is that modern Catholic verification seems designed to eliminate exactly those practical weaknesses Hume criticized. We're talking about:
  - Non-Catholic doctors on review boards
  - Advanced diagnostic tools
  - Systematic elimination of natural explanations
  - Only accepting "medically inexplicable" cases

  So the real question becomes: does this institutional skepticism satisfy Hume's probabilistic threshold? The student's office mate thinks yes, but I suspect Hume would dig deeper.

  Hmm... I imagine Hume would attack this on three levels:
  First, he'd question whether "medically inexplicable" equals "miracle." Medicine's limitations don't automatically prove supernatural intervention. Second, he'd point out that institutional processes can still have biases - the very framing as "miracle investigations" presumes the possibility. Third, he'd argue that uniform experience against miracles still outweighs even well-vetted testimony.

  I should also consider that for Hume, the fundamental issue isn't just witness reliability but the prior improbability of miracles. Even gold-standard testimony faces an almost insurmountable burden of proof against natural law. 

  The student might be missing that Hume's "uniform experience" argument makes miracles maximally improbable by definition. Modern medicine's limited explanatory power doesn't change that calculus - it just shows where science currently falls short.

  I wonder if Hume would be impressed by the process but remain ultimately unconvinced. He might say: "You've reduced human error, but not overcome the intrinsic unlikelihood of supernatural suspension of natural laws." The gap between "unexplained" and "divinely caused" remains philosophically unbridgeable for him.

  This seems richer than the standard secondary literature discussions. The student has identified a genuine tension between Hume's theoretical framework and modern institutional epistemology. While the medical boards address his practical concerns, they don't touch his core metaphysical objection.
answer: |-
  That's an exceptionally sharp question that cuts to the heart of Hume's argument and its contemporary relevance. Let's break down how Hume would likely respond to the modern Catholic miracle-vetting process, reconstructing his reasoning from the *Enquiry*:

  ### Hume's Core Argument Revisited
  1.  **The Maxim:** "No testimony is sufficient to establish a miracle, unless the testimony be of such a kind, that its falsehood would be more miraculous, than the fact, which it endeavours to establish."
  2.  **The Foundation:** Our belief in natural laws is based on "firm and unalterable experience." A miracle, as a violation of these laws, has the *highest possible degree of improbability* ("as entire as any argument from experience can possibly be imagined").
  3.  **The Practical Argument (Part 2):** Human testimony is inherently fallible due to psychological, cultural, and historical factors (credulity, wonder-seeking, bias, ignorance, zeal, conflicting reports). The *actual* reliability of testimony about the miraculous is always low.

  ### Why the Modern Process *Seems* to Challenge Hume
  You're absolutely right that the Lourdes/Canonization process directly targets Hume's *practical* (Part 2) objections:
  *   **Replaces Credulous Witnesses with Skeptical Experts:** Trained physicians (including non-Catholics) replace potentially biased or ignorant lay witnesses.
  *   **Systematic Elimination of Natural Explanations:** A rigorous, institutionalized process actively seeks *and requires* the exclusion of all known natural causes before considering the supernatural. This directly addresses Hume's point about rival explanations.
  *   **Advanced Diagnostic Tools:** Access to technology (imaging, labs, genetics) far beyond Hume's imagination allows for deeper investigation into potential natural causes.
  *   **Focus on "Medically Inexplicable":** The bar is explicitly *not* "proof of divine action" but the *absence* of a current natural explanation. This seems to raise the bar Hume demanded.

  ### Why Hume Would Likely *Still* Be Unimpressed: A Multi-Pronged Response
  Hume, sitting down to hear about Lourdes, would probably concede the *relative* improvement over 18th-century testimony but would argue it doesn't overcome the *fundamental* logical and epistemological hurdles of his argument:

  1.  **"Medically Inexplicable" ≠ "Miracle" (The Explanatory Gap):**
      *   Hume would pounce on the crucial leap from "We cannot currently explain this medically" to "Therefore, it is a supernatural miracle." This, for Hume, is a non sequitur.
      *   **Argument:** "You have admirably demonstrated that this healing is, according to *your current medical knowledge*, unexplained. But this only proves the *limitations of current medical science*, not the suspension of natural law. History is replete with phenomena once deemed 'inexplicable' (epilepsy, infectious disease, spontaneous remission) later understood naturally. To declare it a miracle is to fill the gap in *your* knowledge with a hypothesis (divine intervention) that is, *by definition*, maximally improbable. The falsehood of the proposition 'This has an undiscovered natural cause' is *vastly* less miraculous than the proposition 'The fundamental laws of nature were suspended.'"

  2.  **The Insurmountable Prior Improbability:**
      *   Hume's core point is that the *prior improbability* of a miracle (based on uniform experience) is so extreme that *no conceivable testimony* could overcome it. Institutional vetting might make the testimony *less improbable*, but not *less improbable than the miracle itself*.
      *   **Argument:** "Let us grant, for argument's sake, that your committee is impeccably rigorous and honest. You have reduced the probability of *fraud, error, or known natural cause* to a very low level. Bravo. But the probability you assign to the event being a *genuine violation of natural law* remains infinitesimally small – it is defined *by* its opposition to all established uniform experience. The probability that *some unknown natural cause exists or that subtle error persists despite your best efforts*, while perhaps small, is *still* greater than the probability that the fundamental structure of the universe was suspended. The falsehood of the testimony (interpreted as proof of miracle) – meaning either residual error or an undiscovered natural cause – remains the *less* miraculous option."

  3.  **Institutional Biases and Framing:**
      *   Hume would be deeply suspicious of the *context* and *purpose* of the investigation, even with non-Catholic doctors.
      *   **Argument:** "The entire apparatus exists within the framework of the Catholic Church, with the *presupposed goal* of identifying miracles for devotional or canonical purposes. This creates powerful, subtle institutional pressures. What counts as 'sufficiently rigorous'? When is 'inexplicable' declared? Committees, even with non-Catholics, operate within a culture and a process designed to *find* miracles if they meet a threshold. The *selection* of cases (only those brought forward by believers seeking a miracle), the *interpretation* of 'inexplicable,' and the *final leap* to 'therefore divine' are all shaped by this context. This doesn't imply conscious fraud, but a deep-seated confirmation bias inherent in the project's design. This institutional framework *itself* lowers the intrinsic probability of the testimony being reliable *on the specific point of proving a supernatural violation*."

  4.  **The Problem of "Uniform Experience" Persists:**
      *   The weight of evidence *against* any violation of natural law remains overwhelming.
      *   **Argument:** "Your committee may have examined thousands of cases and found 70 'inexplicable.' But consider the billions upon billions of events observed daily that *conform* perfectly to natural law. This constitutes an overwhelming proof *against* the possibility of violation. Against this mountain of uniform experience, 70 instances of 'unexplained,' even rigorously vetted, are statistically insignificant. They are far more plausibly explained as the inevitable outliers, misdiagnoses, or placebos within a vast dataset governed by natural law than as genuine suspensions of that law."

  5.  **The Cancellation Argument (Adapted):**
      *   Hume might adapt his argument about rival miracles.
      *   **Argument:** "If similarly rigorous medical boards existed within other religious traditions (e.g., investigating miraculous healings at Hindu temples or by faith healers), and they also occasionally certified events as 'medically inexplicable,' would you accept *those* as proof of *their* specific theological claims? If not, why accept the Catholic ones? The existence of potentially 'inexplicable' events within conflicting theological frameworks undermines the claim that any *specific* one points to a particular divine agent or validates a specific religion. It points instead to the limits of current medical knowledge or methodology."

  ### Conclusion: Hume's Likely Verdict
  Hume would acknowledge the modern process as a significant *practical* improvement over the testimonial chaos he criticized. It directly mitigates many Part 2 concerns about witness reliability and basic error detection.

  **However, he would argue it fails fundamentally on Part 1 grounds:**

  1.  **It does not bridge the gap between "unexplained" and "supernatural violation."** Declaring the latter is an unwarranted leap of faith, not a conclusion demanded by evidence.
  2.  **It cannot overcome the crushing prior improbability of a miracle.** The probability that *any* unexplained event has an undiscovered natural explanation or subtle residual error remains *always* higher than the probability that natural law was violated, no matter how good the vetting.
  3.  **The institutional context inherently introduces a framing bias** that undermines the neutrality required to overcome such extreme improbability.

  **Therefore, for Hume, even gold-plated, institutionally-vetted testimony of the "medically inexplicable" would *not* satisfy his maxim.** The falsehood of the proposition "This vetted case has a natural explanation we haven't found yet or a flaw we missed" would *still* be less miraculous than the proposition "The uniform course of nature was violated." The institutional process might make the testimony *better*, but it doesn't make the miracle *more probable* relative to the overwhelming evidence for the stability of natural law. Your office mate might see the improved vetting as meeting Hume's terms, but Hume himself would likely insist the epistemological chasm is simply too wide for *any* testimony to cross. The core issue isn't just the quality of the witnesses; it's the metaphysical weight of "uniform experience" versus the concept of a singular violation.
