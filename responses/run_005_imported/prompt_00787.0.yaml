  First, I need to parse exactly what Hobbes is saying in that quote. He's drawing this distinction between demonstrable and indemonstrable arts, where demonstrable ones depend on the artist constructing the subject themselves. Geometry works because we draw the lines, politics works because we create commonwealths, but natural philosophy fails because we don't construct nature. 

  The user raises three sharp questions: First about the source of geometrical certainty - is it really the construction rather than axioms? Second about how messy human politics could possibly be analogous to pure geometry. Third about whether this creates a true epistemic hierarchy. And they're rightly worried about tension with Hobbes' materialism.

