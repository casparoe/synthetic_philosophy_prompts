  For politics, the "we make" claim is fascinating. Hobbes isn't saying we design historical states, but that we can rationally reconstruct commonwealths from first principles - like his state of nature argument. The messy reality gets purified into an artificial man we can take apart and reassemble mentally. 

  The physics point is stark: since we didn't make nature, we're stuck with hypothetical models. This isn't just underdetermination - it's a categorical epistemic limitation for Hobbes. And yes, this absolutely strains his materialism, since he's effectively saying the physical world is less knowable than human constructs. The user spotted that tension well.

  I should emphasize how radical this is - Hobbes is basically inverting the traditional hierarchy of sciences. Politics becomes more like math than physics is! And I should flag that while "maker's knowledge" wasn't unique to Hobbes, his application to politics was revolutionary.

