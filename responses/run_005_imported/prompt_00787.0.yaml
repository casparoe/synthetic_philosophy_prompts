answer: |-
  This passage distills Hobbes's radical epistemology of **"maker's knowledge" (*scientia operativa*)**. Let's reconstruct the core argument step-by-step, addressing your specific questions:

  ### Core Argument Reconstruction
  1.  **Premise 1 (Criterion for Demonstrability):** A science is demonstrable *only* if it concerns a subject whose **causes, generation, and construction are fully known**.
  2.  **Premise 2 (Source of Knowledge of Causes):** We can have complete and certain knowledge of causes **only if we ourselves are the makers/constructors** of the subject. We have privileged access to the "how" and "why" of something we build.
  3.  **Premise 3 (Application to Geometry):** In geometry, the fundamental objects (points, lines, figures) **are constructed by the geometer** through definitions and postulates governing generation (e.g., "Let a straight line be drawn...", "Let a circle be described..."). The geometer doesn't discover pre-existing perfect forms; they stipulate definitions and operations for constructing idealized mental/physical representations.
  4.  **Inference 1 (Geometry is Demonstrable):** Therefore, geometry is demonstrable. Demonstrations are deductions of the necessary consequences flowing from the definitions and constructive operations the geometer has performed or stipulated. The certainty arises from controlling the generation.
  5.  **Premise 4 (Application to Civil Philosophy):** In civil philosophy (political science), the fundamental object (the Commonwealth, or "artificial man") **is constructed by humans** through covenant and institution. We are its makers.
  6.  **Inference 2 (Civil Philosophy is Demonstrable):** Therefore, civil philosophy is demonstrable. We can deduce the necessary properties and consequences of a rightly instituted commonwealth from the principles of human nature (passions, reason) and the act of covenanting itself (e.g., rights transferred, sovereignty established, laws derived). We know the causes because we *are* the causes.
  7.  **Premise 5 (Application to Natural Philosophy):** In natural philosophy (physics), the fundamental objects (natural bodies, the universe) **are *not* constructed by us**. We did not make them; we encounter them as given.
  8.  **Premise 6 (Epistemic Limitation):** Consequently, we lack direct, certain knowledge of their **true internal construction and efficient causes**. We only observe their effects (phenomena).
  9.  **Inference 3 (Natural Philosophy is Indemonstrable):** Therefore, natural philosophy *cannot* yield demonstrations of what the causes of natural phenomena *are*, only hypothetical models of what they *could be* (consistent with the observed effects). We seek causes from effects, which is inherently probabilistic and conjectural, not deductive and certain.

  ### Addressing Your Questions

  1.  **Source of Geometrical Certainty:**
      *   Hobbes **emphatically privileges construction over axioms or inference rules** as the *foundation* of certainty. While valid inference is necessary, its application yields certainty *only* because the premises (definitions & construction rules) are certain *because we made them*. Axioms (like Euclid's Common Notions) are valid only insofar as they reflect the operational rules we've established for our mental or physical constructions (e.g., "things equal to the same thing..." holds *because* we defined equality operationally for our constructed figures). The self-evidence of axioms is secondary; their *operational grounding* in our constructive acts is primary. The epistemic work is done by **our complete causal control over the object's generation**.

  2.  **"We Make" the Commonwealth & Preserved Analogy:**
      *   Hobbes does *not* mean we design every historical state's messy details. He means we rationally understand the **essential, artificial *principle* of its generation**: the covenant instituting sovereignty. The "making" relevant for *scientia* is the **rational reconstruction of the commonwealth *as an artifact***.
      *   What's preserved is the **logical structure of construction and deduction**:
          *   **Geometry:** Define elements (point, line) -> Postulate construction rules -> Deduce necessary properties of constructed figures (triangle).
          *   **Civil Philosophy:** Define elements (man in state of nature, passions, right of nature) -> Postulate generative act (covenant renouncing rights to create sovereign) -> Deduce necessary properties of the constructed entity (sovereign power, subject duties, laws of nature, stability conditions).
      *   The "messiness" of history doesn't negate the demonstrability of the *ideal, rationally constructed model*. For Hobbes, true political science is about this model, not empirical history. We *can* know the necessary consequences of the artificial act of institution with geometrical certainty, just as we know the properties of an ideal triangle we construct.

  3.  **Status of Natural Philosophy:**
      *   This is **genuinely different and weaker knowledge** for Hobbes, not just underdetermination dressed up. It's a fundamental epistemological division:
          *   **Demonstrable Science (*Scientia*):** Geometry, Civil Philosophy. Based on maker's knowledge. Yields *certainty* about causes and necessary consequences.
          *   **Indemonstrable Natural Philosophy:** Physics. Based on seeking causes from effects. Yields only *plausible hypotheses* ("what [causes] may be"). It's inherently probabilistic and conjectural.
      *   While underdetermination (multiple hypotheses fitting phenomena) is a *consequence* of this, Hobbes's root point is deeper: **the lack of maker's knowledge** fundamentally bars us from the *kind* of causal certainty possible in geometry or politics. Physics can be "scientific" in a weaker sense (systematic, explanatory), but never demonstrative like geometry.

  ### Tension with Materialism
  This is a **profound tension** you've rightly identified:

  *   **The Problem:** Hobbes is a thoroughgoing materialist and mechanist. *Everything*, including minds, commonwealths, and geometrical reasoning, is ultimately motion of bodies. Yet, here he claims we have *lesser* knowledge of the fundamental material world than we do of artificial constructs (geometrical figures, states) *made* of that same matter!
  *   **Possible Resolutions (Contentious):**
      *   **Epistemic Priority of Artifice:** While matter is fundamental ontologically, *epistemologically*, we gain the highest certainty only by creating simplified, idealized *artificial* systems *within* the material world (drawing lines, making covenants) whose causal chains we fully control and stipulate. The complexity and opacity of *unconstructed* matter prevent such certainty.
      *   **Knowledge vs. Ontology:** Knowledge (*scientia*) requires a specific *kind* of access (maker's knowledge), which the fundamental structure of nature doesn't grant us, even if nature is material. Materialism tells us *what everything is*, but not necessarily *how to have certain knowledge* of it.
      *   **Methodological Artifice:** The artificial models of geometry and politics are *tools* for reasoning, built from matter according to rules we understand, allowing deduction. Natural bodies are given, their internal machinery hidden, forcing us into hypothetical modeling.
  *   **The Tension Remains:** Critics argue this creates an unsustainable dualism in Hobbes's system. How can the mind, itself a complex material system we didn't construct, reliably generate *scientia* about artifacts? If everything is matter in motion, why is the motion we *cause* (drawing a line) knowable with certainty, while other motions are not? Hobbes never fully resolves this, making the epistemology of "maker's knowledge" arguably *prior* to, and potentially in tension with, the claims of his materialism when it comes to the *grounds* of certainty.

  In essence, Hobbes elevates **artifice** – human making according to defined rules – as the sole foundation for genuine *scientia*. Geometry and politics are sciences *because* they are arts of construction. Physics, dealing with the unconstructed given, can only ever be natural *history* and plausible conjecture, however systematic. The tension with materialism highlights the challenge of grounding certain knowledge within a purely mechanical universe.
