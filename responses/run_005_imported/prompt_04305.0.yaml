answer: |-
  Here’s a dialogue between **Alex** (a philosopher of science who sees psychiatric looping as uniquely problematic) and **Ben** (a research psychiatrist who argues it's an expected scientific evolution), using the TikTok/DID case as their battleground:

  ---

  **Alex:** Ben, you’ve seen the data – DID diagnoses exploded 400% in certain clinics post-TikTok, with "alters" now averaging *hundreds* per patient. That’s not natural drift. It’s Hacking’s "looping effect" in overdrive: the *idea* of DID reshapes how people experience distress until they mirror the trend. Psychiatry’s categories actively *create* the phenomena they name.  

  **Ben:** Alex, every scientific category evolves. Look at Pluto – reclassified because we learned more. DID’s shift from "MPD" to DID in the DSM-IV reflected better science. TikTok amplifies awareness, sure, but the core pathology – severe dissociation from trauma – remains valid. Looping happens, but it doesn’t *invalidate* the category.  

  **Alex:** "Awareness"? Ben, it’s *scripting*. Pre-TikTok, alters were mostly covert, few in number. Now? Teens present with "systems" of fictive introjects from anime, complete with backstories lifted from memes. The *symptoms themselves* changed to fit the viral narrative. That’s not "evolving knowledge" – it’s diagnostic criteria becoming a self-fulfilling prophecy.  

  **Ben:** And pre-*Sybil* (1973), MPD was virtually unknown. Then cases surged with similar symptom shifts. We adapted. Today, we have fMRI studies showing distinct neural patterns in DID switches – *objective* markers. TikTok didn’t invent dissociation; it just frames it differently. The biology anchors it.  

  **Alex:** But the biology you cite is studied *after* the cultural script reshapes the illness! Those neural patterns? They’re observed in people who’ve absorbed TikTok’s DID tropes. How do you disentangle "true" dissociation from performance? In the 90s, therapists *created* alters through leading questions. Now algorithms do it. Psychiatry’s tools – interviews, criteria – become feedback loops *manufacturing* the disorder.  

  **Ben:** You’re conflating presentation with pathology. A kid might *initially* mimic TikTok, but if they’re *truly* dissociating to cope with trauma, the label gets them help. Looping isn’t unique to psychiatry either. "Homosexuality" was a DSM category that pathologized identity – but removing it changed how people saw themselves! That’s looping, and it was *ethical*.  

  **Alex:** Exactly! And that removal proved psychiatric categories aren’t natural kinds. They’re value-laden constructs that alter human selves. With DID, the loop is tighter: "alters" are identities mediated by diagnosis. Diagnose someone with DID, and they start *interpreting* internal chaos as "alters" – which therapists then validate. TikTok collapses this loop entirely: diagnosis happens via community, *before* clinical contact.  

  **Ben:** So what’s the alternative? Not diagnose dissociation? Ignore suffering because culture shapes expression? Biology *is* messy. Cancer subtypes get reclassified as we learn. DID’s challenge is distinguishing maladaptive coping (e.g., adopting "alters" for social support) from neurobiological dissociation. That’s hard science, not philosophy.  

  **Alex:** But cancer doesn’t *know* its own classification. A tumor won’t grow differently because it read *Oncology Today*. A person *will* reshape their psyche to fit "DID" if it makes their pain legible. That asymmetry makes psychiatric looping uniquely destabilizing. TikTok didn’t just spread awareness; it *standardized* a new folklore of multiplicity. Your "neurobiology" is now chasing a meme.  

  **Ben:** Fair – social media accelerates looping. But we’re adapting. New protocols screen for social contagion. We look for pre-TikTok trauma evidence, incongruent symptoms. And we study unaffected trauma survivors as controls. It’s imperfect, but so was classifying elements before the periodic table. Looping demands better science, not surrender.  

  **Alex:** But when the "better science" relies on self-reports from patients immersed in DID subcultures, the loop persists. Psychiatry keeps building on shifting sand. The 80s "MPD epidemic" ended with the category discredited. History’s rhyming, Ben.  

  **Ben:** Or we’re learning. The DID criteria tightened post-90s. We added dissociative amnesia as a core feature to filter suggestibility. This *is* how science works: hypothesis, observation, revision. Looping is a confounding variable, not a death knell. Biology, trauma, and culture interact. Untangling that *is* psychiatry’s job – TikTok just made it harder.  

  **Alex:** ...Or revealed how fragile the foundations are.  

  **Ben:** Foundations are always fragile until you dig deeper. Let’s dig.  

  ---

  ### Key Points Debated:
  - **Alex’s View:** DID’s TikTok transformation proves psychiatric categories are uniquely "loopy" because diagnosis *directly* alters self-perception, creating feedback loops where criteria manufacture symptoms (e.g., "alter inflation").  
  - **Ben’s View:** All scientific categories evolve (e.g., Pluto, DSM revisions). TikTok accelerates cultural influence, but core pathology (traumatic dissociation) remains valid and biologically detectable. Looping demands rigor, not nihilism.  
  - **TikTok DID as Evidence:** Alex sees symptom drift (alters as pop culture characters) as category collapse; Ben sees it as noisy presentation obscuring real pathology.  
  - **History Repeating:** Both agree the 80s/90s MPD wave parallels TikTok, but Alex sees it as proof of instability; Ben sees it as proof psychiatry *can* adapt.  
  - **Core Disagreement:** Is looping a *fatal flaw* for psychiatry (Alex) or a *manageable challenge* inherent in studying the mind (Ben)?
