  ## Memorandum: Reporting Protocol for Pre-Registered Null Results with Post-Hoc Bayesian Analysis

  **To:** Department Chair, Psychology Department  
  **From:** [Your Name], Open Science Committee Member (External)  
  **Subject:** Recommendation for Reporting Protocol in Case #OSC-2023-01 (Ego-Depletion Replication)  
  **Date:** October 26, 2023  

  ---

  ### I. The Core Conflict & Shared Principles
  This case presents a tension between two valid Open Science commitments:  
  1.  **Pre-Registration Rigor:** Upholding the *a priori* analysis plan as the primary safeguard against researcher degrees of freedom and p-hacking.  
  2.  **Evidence Maximization:** Utilizing statistically robust methods to accurately characterize findings, especially when they challenge established effects.  

  Both sides agree on core goals: transparency, rigor, and honest communication of evidence. The disagreement centers on *how* to achieve this when the pre-registered frequentist result (`p = .058`, one-tailed) and a post-hoc Bayesian analysis (`BF₁₀ ≈ 0.125`, favoring H₀) appear to conflict in their interpretive weight.

  ---

  ### II. Analysis of the Positions

  1.  **"Strict Pre-Registration" Position:**
      *   **Argument:** Deviating from the Stage 1 protocol, *especially* by introducing an unplanned analysis framework *after* seeing the data, fundamentally violates the core purpose of Registered Reports. It reintroduces the "garden of forking paths" problem by allowing researchers to choose analytical methods post-hoc based on the result. Reporting anything beyond the pre-registered null result (`p > .05`) undermines trust in the process.
      *   **Strength:** Protects the integrity of the pre-registration contract and prevents analytical flexibility bias.
      *   **Weakness:** May underrepresent the actual evidence in the data, particularly when a complementary method (Bayesian) provides stronger evidence *for* the null and is insensitive to the stopping rule.

  2.  **"Bayesian Evidence" Position:**
      *   **Argument:** The Bayes Factor provides direct, meaningful evidence *for* the null hypothesis (H₀), which the frequentist `p-value` cannot do. A BF₁₀ ≈ 0.125 ("moderate evidence" for H₀, Kass & Raftery, 1995) is more informative than `p = .058` (which only indicates failure to reject H₀ under specific assumptions). Further, Bayesian methods are inherently less sensitive to stopping rules, addressing a key frequentist concern.
      *   **Strength:** Provides a richer, arguably more intuitive interpretation of the evidence *specifically regarding support for H₀*. It leverages the data more fully.
      *   **Weakness:** Performing and emphasizing an analysis *not pre-specified* post-hoc creates a problematic precedent. It risks incentivizing researchers to "shop" for favorable analyses after unblinding results, eroding the prophylactic value of pre-registration.

  ---

  ### III. Recommendation: The "Primary Pre-Registered, Contextualized Secondary" Approach

  **The result should be reported primarily and unambiguously as the pre-registered null result (`p = .058`, one-tailed, exceeding the pre-registered α = .05 threshold).** **However,** the Bayesian reanalysis (BF₁₀ ≈ 0.125) should be included as a clearly labeled **secondary, contextual analysis** within the Results and Discussion sections, subject to the following conditions:

  1.  **Primary Result Stated Clearly:** "As pre-registered, the one-sided t-test comparing conditions yielded a p-value of .058, which exceeds our pre-registered alpha level of .05. Therefore, based on the pre-registered frequentist analysis, we did not find statistically significant evidence supporting the ego-depletion effect in this replication attempt."
  2.  **Secondary Analysis Explicitly Framed:** "Following completion of the pre-registered analysis, we conducted an unplanned Bayesian reanalysis to quantify evidence for the null hypothesis relative to the alternative. This analysis yielded a Bayes Factor (BF₁₀) of approximately 0.125, indicating moderate evidence (Kass & Raftery, 1995) *in favor of the null hypothesis* (i.e., no ego-depletion effect) relative to the alternative hypothesis specified in our pre-registration."
  3.  **Critical Contextualization:**
      *   **Post-Hoc Nature:** Explicitly state this analysis was *not part of the pre-registered plan*. E.g., "It is important to note that this Bayesian analysis was exploratory and conducted *post-hoc*, after the primary pre-registered frequentist analysis was completed and the result known."
      *   **Complementary, Not Overriding:** Emphasize that the Bayesian result provides *additional context* but *does not override* the primary pre-registered conclusion. "While the Bayesian analysis suggests evidence favors the null hypothesis, the primary interpretation remains governed by the pre-registered frequentist analysis protocol, which yielded a non-significant result (p > .05)."
      *   **Limitations & Rationale:** Briefly explain *why* the Bayesian approach was considered relevant here (direct evidence for H₀, insensitivity to stopping rules) and acknowledge its limitations (e.g., sensitivity to prior specification, which should be reported and justified).
      *   **Avoid Overstatement:** Caution against interpreting BF₁₀ ≈ 0.125 as *definitive proof* of no effect; describe it accurately as "moderate evidence" for H₀.
  4.  **Press Release Nuance:** Any press release must lead with the pre-registered null result. It *may* mention the Bayesian analysis as "additional exploratory analysis suggesting evidence leans towards no effect," but must clearly distinguish it from the primary pre-registered finding and label it as post-hoc.

  **Justification for this Recommendation:**

  *   **Upholds Pre-Registration:** The sanctity of the pre-registered plan as the primary arbiter is preserved. This maintains trust in the Registered Report process.
  *   **Acknowledges Valid Insight:** It recognizes the Bayesian statistician's valid point that the data contains meaningful evidence *for* the null, which the frequentist framework struggles to express, and that this insight is methodologically robust regarding the stopping rule.
  *   **Manages Precedent:** By strictly labeling the Bayesian analysis as *post-hoc*, *secondary*, and *contextual*, it mitigates the risk of encouraging post-hoc analysis shopping. The primary conclusion remains protocol-bound.
  *   **Enhances Transparency & Nuance:** Including the analysis provides a more complete picture of the evidence *without* subverting the pre-registration principle. It demonstrates intellectual honesty about the data's story.
  *   **Practical & Defensible:** This approach balances the core principles in conflict and provides a clear template for future cases.

  ---

  ### IV. Proposed Standing Rule for Future Cases

  **"Pre-Registered Primary, Justified Secondary" Rule:**

  1.  **Primary Conclusion:** The outcome defined by the *pre-registered Stage 1 analysis plan* (including statistical test, alpha level, and decision rules) is the **primary result** and the basis for the main conclusion (e.g., "supported", "not supported", "inconclusive" as per the protocol).
  2.  **Secondary/Exploratory Analyses:**
      *   Analyses *pre-specified* in the Stage 1 protocol (e.g., robustness checks, secondary outcomes) are reported as planned.
      *   *Post-hoc* analyses (those not pre-specified) **may be included** only if:
          *   **a)** They address a specific, well-justified methodological or interpretive question *relevant to the primary result* (e.g., quantifying evidence for H₀ when the primary frequentist result is null; robustness checks using different methods/sensitivity analyses).
          *   **b)** They are **clearly labeled** as *post-hoc*, *exploratory*, or *unplanned*.
          *   **c)** They are presented as **contextual** or **supplementary** to the primary pre-registered result, **not** as overriding it.
          *   **d)** Their inclusion and rationale are approved by the Open Science Committee *before* manuscript submission to ensure they meet criteria (a-c) and do not constitute result-dependent fishing.
  3.  **Press Releases/Public Communication:** Must be anchored to the primary pre-registered conclusion. Mention of secondary/post-hoc analyses must be clearly framed as such and avoid overstating their significance relative to the primary result.

  ---

  ### V. Conclusion
  The case of the ego-depletion replication highlights the evolving landscape of scientific inference. While pre-registration is essential for combating bias, we must also leverage robust statistical tools to accurately interpret results, especially null findings in replications. Our recommendation prioritizes fidelity to the pre-registered protocol as the foundation of the Registered Report model while allowing for transparent, justified inclusion of valuable supplementary evidence. The proposed standing rule provides a principled framework for navigating similar tensions in the future, upholding Open Science values of both rigor and nuanced evidence assessment.  

  I recommend the committee endorse this approach for the current case and adopt the proposed standing rule. I am available to discuss this further at the upcoming faculty meeting.  

  Respectfully,  
  [Your Name]
