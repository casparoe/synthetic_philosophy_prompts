  **Justifications:**  
  - **Vindicated**: "zero alcohol" aligns with modern neuroscience showing any regular alcohol consumption impairs neurogenesis and cognitive flexibility; "heavy cuisine dulls thought" is supported by studies linking high-fat, processed meals to reduced alertness and Mediterranean diets to better cognitive function.  
  - **Partly right, for the wrong reasons**: "thinking on foot" correctly links movement to enhanced creativity (due to increased blood flow and BDNF), but overstates it as essential; "small, plain meals" rightly avoids heavy-meal cognitive drag but oversimplifies digestion (meal timing matters less than total nutrients/metabolic health).  
  - **Refuted**: "staple grain, national vice" lacks evidence (drug preferences stem from trade/history, not grain biochemistry); "climate determinism" is contradicted by philosophy’s global flourishing across climates, with mood/creativity ties being weak and individual.
