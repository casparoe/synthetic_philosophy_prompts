   But wait, what about the "nothing eaten in between" for the small meals? That might be interpreted as no snacking, which is sometimes recommended (e.g., in intermittent fasting). However, Nietzsche is advocating for frequent meals, so that would mean eating often but not snacking? That doesn't make sense. Actually, if you have frequent meals, then by definition you are eating at intervals and not having long gaps. So "nothing eaten in between" might mean no additional snacks between the planned frequent meals? That is consistent with not overeating. But the science on snacking is mixed: it can be good or bad depending on what and how much.

   Given the complexity, we'll leave "small, plain meals" in "Partly right".

   However, let me double-check "zero alcohol": Is it really vindicated? The claim is that even one daily glass is ruinous to a creative mind. Current science says that moderate alcohol consumption (like one drink per day) is associated with some cognitive decline, but it might not be "ruinous" for everyone. However, the trend in the science is that any alcohol is harmful to the brain. So, in that sense, Nietzsche's zero-tolerance is more aligned than the old view. We'll keep it in "Vindicated".

   But note: the claim is about creativity specifically. There is less direct evidence on creativity than on general cognitive decline. However, since alcohol impairs cognitive function, it's reasonable to extend that to creativity. So, we'll keep it.

   Final ranking:

   Vindicated: 
