answer: |-
  ## Dialogue: The Sandpile and the Symphony  
  *(Two philosophers, Alex (parity defender) and Sam (vagueness theorist), debate over coffee after a seminar on value incomparability.)*

  **Alex:** ...so Chang’s point is that the small-improvement argument *exposes* something deeper than vagueness. Take your career dilemma: corporate job versus composer. Suppose the firm offers a 5% raise. Does that suddenly make the job *better* than the composer’s life?  

  **Sam:** Not necessarily. But that’s just vagueness! There’s no sharp line where “roughly equal” becomes “better.” A 5% raise might still sit squarely within the penumbra of indeterminacy.  

  **Alex:** Agreed—for *one* sweetener. But imagine they keep sweetening it: 10%, 15%, a corner office, extra vacation... *Eventually*, if this were mere vagueness, *some* improvement *must* push the job determinately ahead. Just like adding enough sand grains *must* make one pile bigger. But here’s the rub: even if they doubled your salary, wouldn’t you still feel the composer’s life is *in a different league of value*? Not worse, not better—just *differently valuable*?  

  **Sam:** I’d feel deeply conflicted, sure. But that’s my epistemic limitation—not proof of a new metaphysical relation. Higher-order vagueness explains this: the boundary between “roughly equal” and “better” isn’t just vague; *the very notion of where vagueness ends* is vague. There’s no point where I *should* expect certainty to kick in.  

  **Alex:** But that’s a dodge! Let’s test it. Suppose we both agree that at $100K salary, the choice is hard. At $200K, it’s *still* hard. At $1 million? If you insist this is still vagueness, you’re stretching the concept beyond recognition. No sandpile stays “roughly equal” if you double it while the other stays fixed. Yet for careers, the million-dollar job still doesn’t *trump* the composer’s life—it just amplifies the tension between different *kinds* of goods: material security versus creative meaning.  

  **Sam:** And why can’t that tension *be* the vagueness? Values like “meaning” or “security” are themselves vague predicates. Comparing them compounds the fuzziness. When I say “$1M job isn’t clearly better,” I’m not detecting “parity”—I’m confessing that the criteria are too open-textured to declare a winner.  

  **Alex:** But that reduces all resistance to comparison to *semantic indecision*. Here’s what parity captures that vagueness misses: the *relational character* of the alternatives. The composer’s life isn’t failing to be “as good as” the job in a fuzzy way; it’s engaging a *different dimension of comparison*. A sweetener on one dimension (salary) doesn’t translate across dimensions—it’s like improving the red in a painting while arguing it’s now “better overall” than a completely different painting excelling in blue.  

  **Sam:** Dimensions! Now you sound like a multi-attribute decision theorist. Why not just say we lack a precise exchange rate between “meaning” and “money”? That *is* vagueness in the weighting function.  

  **Alex:** Because exchange rates imply a single currency of value. Parity denies that. In hard choices, alternatives can be *comparable*—I can weigh them, agonize—yet neither is better, worse, nor equal because they instantiate *different values that resist trade-offs*. Vagueness treats this as a failure of measurement resolution. Parity treats it as a success of pluralism.  

  **Sam:** And how is “pluralism” not just a label for the same uncertainty? Suppose I grant your intuition: no salary bump makes the job “better,” only “more tempting but still incomparable.” Isn’t that functionally identical to saying the vagueness is so deep it never resolves?  

  **Alex:** No! Functionally, parity explains why *no sweetener could ever settle it*—not because our concepts are fuzzy, but because the values are *asymmetrically constituted*. Vagueness predicts that sufficient sweetening *should* eventually break the tie, even if we can’t pinpoint when. Parity predicts the tie *can’t* be broken that way. The persistence of the dilemma across *all* sweeteners is evidence for parity.  

  **Sam:** But I can model that persistence with higher-order vagueness! If the transition from “not better” to “better” is itself radically vague, there need be *no* point where improvement forces a verdict. Your “prediction” is indistinguishable from mine.  

  **Alex:** Is it? Then answer this: *Why* does adding salary feel like changing the subject rather than tipping scales? Why does the composer’s life retain its normative “pull” no matter the salary? Vagueness says, “We just can’t tell.” Parity says: “Because you’re comparing apples to oranges.” One explains the phenomenology of incommensurability; the other explains it away as ignorance.  

  **Sam:** And your “apples and oranges” is just a metaphor for irreducible pluralism—which I can capture with *incompletely specified* preferences. No new relation needed.  

  **Alex:** But if your account is just “it’s vague all the way down,” you’ve dissolved the phenomenon into a linguistic fog. Parity takes the normative tension seriously: it’s not that we *can’t* compare—it’s that comparison reveals a *sui generis* relation. Vagueness doesn’t explain why this feels categorically different from choosing between two shades of gray.  

  **Sam:** Doesn’t it? Choosing between careers *is* more complex than choosing between sandpiles! The vagueness *is* deeper, but not different in kind. Positing “parity” reifies our confusion.  

  **Alex:** ...Then we’re at an impasse. You see an epistemic shadow; I see an ontological gap. Perhaps the test is this: does your view *explain* why, after choosing the job, I might forever feel the composer’s life was a valid, unchosen equal—not just a fuzzy alternative?  

  **Sam:** Yes: because, under vagueness, “equal” and “not equal” aren’t exhaustive. “Roughly equal” is a third category.  

  **Alex:** *(sighs)* And round we go. Another coffee?  

  **Sam:** Please. Black. Like the boundaries we’ll never see clearly.  

  *(The dialogue ends unresolved, circling the core disagreement: Is the resistance to improvement evidence of structural irreducibility (parity) or boundless epistemic limitation (vagueness)?)*  

  ---

  ### Key Disputes Worked Through  
  1. **The Sweetener’s Scope**: Alex argues that *no* salary increase breaks the deadlock, suggesting dimensional incomparability, not mere fuzziness. Sam insists higher-order vagueness can absorb this.  
  2. **Phenomenology**: Alex claims parity explains the persistent “different league” intuition; Sam reduces this to compounded vagueness.  
  3. **Explanatory Burden**: Sam charges parity with reifying uncertainty; Alex charges vagueness with explaining away normative structure.  
  4. **Metaphor Clash**: Alex’s “apples/oranges” (irreducible pluralism) vs. Sam’s “exchange rate vagueness” (epistemic limitation).  

  Neither concedes ground, but the debate sharpens why Chang sees vagueness as evasive and Broome sees parity as inflationary.
