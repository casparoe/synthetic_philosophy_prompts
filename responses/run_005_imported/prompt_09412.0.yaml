  Marcus and Leah are stuck in a false dichotomy: either intuitions track a universal concept (Marcus's fear) or we're talking past each other (Leah's hedge). A cognitive science approach rejects both: categorization research shows robust *patterns* in variation across groups, revealing how concepts are dynamically constructed—not discovered or merely lexicalized. The real challenge is building theories that account for this flexibility.
