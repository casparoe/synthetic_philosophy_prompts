answer: |-
  That's a **very insightful and largely accurate read** of that section in Turing's paper ("Computing Machinery and Intelligence"). You've grasped the core tension perfectly. Here's a breakdown confirming and expanding on your interpretation:

  1.  **The Objection:** The "Extrasensory Perception" (ESP) objection posits that if telepathy (or other forms of ESP) exists, a human interrogator might unconsciously use it to distinguish the human contestant from the machine contestant in the Imitation Game. The human contestant could "think" something like "I am the real human," which the interrogator might receive telepathically, while the machine, lacking this ability, couldn't replicate it.

  2.  **Turing's Concession (As You Note):**
      *   Turing *implicitly concedes* that if ESP were real and functioned as described, it **would indeed constitute a fundamental limitation for a purely computational machine** within the context of his test.
      *   He states: *"If telepathy is admitted... [the interrogator] might have the quite unequitable advantage of being able to say 'Now [the human contestant] is thinking that I should do so-and-so, but [the machine] is pretending to be [the human] and is only leading me up the garden path.' In this way he might completely circumvent the experiment."*
      *   This directly acknowledges that ESP provides a channel of information/communication **inaccessible to computation**, making the test unfair and potentially impossible for the machine to pass against a human utilizing ESP.

  3.  **The Link to "Thinking Can't Just Be Computation":**
      *   **Yes, this is fundamentally an early version of that worry.** The ESP objection suggests:
          *   Human minds possess a non-physical (or at least non-sensory/physical-as-we-understand-it) capability.
          *   This capability allows for communication/influence bypassing the standard physical sensory channels.
          *   Since computation (as conceived by Turing) operates entirely within the physical realm via symbol manipulation governed by formal rules, it **cannot replicate or interact with this non-physical channel.**
      *   If true, ESP **would imply a fundamental difference in kind** between human minds and computational systems, undermining Turing's core thesis that a suitably programmed computer could, in principle, exhibit intelligent behavior indistinguishable from a human's.

  4.  **Turing's Response - Sidestepping the Metaphysical:**
      *   Crucially, Turing **doesn't engage** with the deep philosophical question of whether ESP *proves* minds are non-computational.
      *   Instead, he takes a **pragmatic, scientific, and test-design-focused approach**:
          *   **Dismissal on Empirical Grounds:** He states the evidence for ESP is "overwhelmingly against" its existence. He treats it as an unlikely empirical claim, not a deep metaphysical challenge.
          *   **Controlling for Variables:** He proposes a practical solution: *"The only way to be sure that a machine is not using telepathy is to put the machine and the interrogator in a 'telepathy-proof room'."* This reframes ESP as just another potential source of sensory "leakage" (like sound or vision) that needs to be experimentally controlled for, rather than a fundamental refutation of computationalism.
          *   **Preserving the Test:** His goal is to salvage the *feasibility* of the Imitation Game as a practical test, not necessarily to definitively prove computationalism against *all* conceivable metaphysical objections. He's saying: "Even *if* ESP existed (which it probably doesn't), we can design the test to neutralize its effect, so it doesn't invalidate the *practical possibility* of the test."

  **Conclusion:**

  You are **absolutely correct** in your reading. The ESP objection, as presented, **is indeed an early, specific instance of the broader "thinking can't be computation" worry.** Turing explicitly concedes that *if* ESP were real and functioned as described, it *would* provide an avenue for human minds to operate in a way fundamentally inaccessible to a computational machine, thereby sinking his thesis *within the specific context of that test setup*.

  However, Turing's *response* is characteristic of his pragmatic approach in the paper. He doesn't dive into the philosophical abyss of whether ESP *proves* non-computational minds. Instead, he:
  1.  Dismisses it as empirically unsupported.
  2.  Treats it as a potential experimental confound to be controlled for (like blocking light or sound).
  3.  Thereby preserves the *operational validity* of his test as a practical measure of machine intelligence, sidestepping the deeper metaphysical challenge it *could* represent.

  So, your understanding of the *worry* raised by the objection is spot-on. Turing acknowledges its potential devastating impact *if true*, but he chooses to deal with it empirically and methodologically rather than philosophically, allowing him to move forward with his main argument.
