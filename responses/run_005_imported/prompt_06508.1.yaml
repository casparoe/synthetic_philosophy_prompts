  First, I need to recall what each position entails. Mereological nihilism says only simples exist; composites don't. That eliminates tables and persons, which clashes hard with common sense. Universalism says any collection composes an object, leading to scattered objects like ear-Andromeda—arbitrary and counterintuitive. Van Inwagen's organicism only allows composition when there's life, so tables don't exist but persons do. Folk view requires contact/fastening, which handles artifacts but draws arbitrary lines (e.g., glued vs. stacked parts). Brutal composition says there's no general rule; composition facts are brute.

  The user wants rankings based on avoiding arbitrariness and preserving common sense. Common sense is a big factor here since the argument started over a kitchen table. Also, the user and their friend rejected universalism, so that's likely low. Van Inwagen's organicism saves persons but not artifacts, which might be a middle ground. Brutal composition avoids arbitrariness in criteria but leaves facts unexplained, which might be unsatisfying. Folk view is intuitive but arbitrary—why contact but not proximity?

  Top rank needs to balance defensibility. Organicism avoids extreme arbitrariness (unlike universalism) and saves persons (unlike nihilism). Brutal is next because it doesn't impose arbitrary criteria but accepts common-sense objects. Folk view is intuitive but arbitrary. Nihilism is consistent but rejects too much. Universalism is consistent but absurd.

  Justifying top: Organicism has a principled basis (life) without excessive arbitrariness. Bottom: Nihilism does too much damage to common sense by eliminating everyday objects.
