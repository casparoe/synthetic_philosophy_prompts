  Over dinner last night, a friend and I got into a long argument about whether my kitchen table really exists as an object in its own right, or whether there are, strictly speaking, only particles arranged table-wise. She accused me of multiplying objects needlessly; I objected that denying the table's existence, if applied consistently, threatens to eliminate persons along with tables. We ended up rehearsing Peter van Inwagen's special composition question (under what conditions do some things compose a further thing?) without reaching any agreement, except that neither of us wanted to bite the universalist bullet and accept that my left ear and the Andromeda Galaxy compose some further object.

  I would like a more disinterested opinion. Please rank the following answers to the special composition question from most to least philosophically defensible: mereological nihilism, universalism, van Inwagen's own organicism (composition occurs just when the parts' activity constitutes a life), the folk "contact/fastening" view, and Markosian's brutal composition (composition facts are brute, with no informative general criterion). Weigh both how well each avoids drawing an arbitrary line and how much damage it does to common sense. Please give your answer as a JSON block, formatted as follows:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  Ties are fine and tiers may be left empty, but please add one sentence justifying your top-ranked view and one sentence justifying your bottom-ranked view.
