  ### Part 2: Realistic Example of Profitable Informed Trading and Why It Violates the Theorem

  Now, consider a real-world scenario: insider trading. 

  Example: A corporate executive (insider) knows that the company is about to be acquired at a premium. The current market price is $50 per share, but the insider knows the acquisition will be at $70. The insider buys shares in the market.

  Why is this profitable? The insider has private information that the market does not have.

  Which assumption of the no-trade theorem does it violate?

  The no-trade theorem assumes:
  1. Common priors
  2. Rationality (Bayesian updating) is common knowledge
  3. The willingness to trade is observable and leads to updating (common knowledge of the trade)

  In this insider trading example:

  - **Violation: The market does not know that the insider is trading on superior information.** Specifically, the insider's trade is hidden among many other trades. The market does not observe that it is the insider who is trading. Therefore, the market cannot update on the insider's private information. 

    More precisely, the market makers or other traders see a buy order, but they do not know whether it comes from an insider or from a noise trader (or liquidity trader). The existence of noise traders (who trade for reasons unrelated to information) breaks the inference. 

    So the key violation is the absence of common knowledge of rationality in the market setting because the market cannot distinguish informed trades from uninformed ones. 

    Specifically, the no-trade theorem assumes that the willingness to trade is common knowledge and that it can be used to update beliefs. In a market with noise traders, a buy order might come from an insider or from a noise trader. Therefore, the market only partially updates the price, and the insider can profit by trading until the price fully reflects the insider's information.

    In our toy example, if there were noise traders who sometimes buy or sell for exogenous reasons, then when Bob sees a sell order, he doesn't know if it's from Alice (who is rational and has private information) or from a noise trader. Therefore, he doesn't update as drastically. 

    In the insider case:
        - Let the current market price be $50, based on public information.
        - The insider knows the stock is worth $70.
        - The insider buys. The market sees increased buying pressure and might adjust the price upward a little (say to $51) because they suspect that some of the buying might be informed. 
        - The insider continues to buy until the price reaches $70.

    The profit comes from the fact that the market does not immediately jump to $70 because the market attributes part of the trade to noise. Thus, the insider can buy at prices between $50 and $70.

    Therefore, the key violated assumption is that the market participants can perfectly infer the private information from the trade. In reality, the presence of noise/liquidity traders breaks that inference.

    Another potential violation: common priors. The insider has information that the market does not have, so they don't share the same prior (or more accurately, they don't have the same information set). But the theorem already allows for private information, so the main issue is the noise.

    So the critical failure point is the absence of common knowledge of the reason for the trade: the market cannot be sure that the trade is information-driven, hence it doesn't update enough to eliminate the profit opportunity.

  Thus, in summary:

  - In the toy example without noise, trade unravels due to Bayesian updating.
  - In real markets, noise traders allow informed traders to profit because their trades are camouflaged.
answer: |-
  ### Step-by-Step Toy Example: No-Trade Theorem in Action  
  **Setup:**  
  - Two rational agents, **Alice** and **Bob**, with common priors.  
  - An asset pays **$100** if event **X** (e.g., "Company Z wins a lawsuit") happens, **$0** otherwise.  
  - Prior probability of **X**: **50%** (common knowledge).  
  - Private signals:  
    - Alice sees signal **A** (highly correlated with **X**).  
    - Bob sees signal **B** (independent of **A**, but equally informative).  
  - Signal accuracy:  
    - **P(A = Good | X) = 0.8**, **P(A = Bad | ¬X) = 0.8** (same for Bob's signal **B**).  

  **Initial Valuations (No Trade Yet):**  
  - Alice observes **A = Bad**. Her posterior belief:  
    `P(X | A=Bad) = [P(A=Bad | X) * P(X)] / P(A=Bad) = (0.2 * 0.5) / 0.5 = 0.2` → Values asset at **$20**.  
  - Bob observes **B = Good**. His posterior belief:  
    `P(X | B=Good) = [P(B=Good | X) * P(X)] / P(B=Good) = (0.8 * 0.5) / 0.5 = 0.8` → Values asset at **$80**.  

  **Trade Proposal:**  
  Alice offers to sell the asset to Bob for **$50** (midpoint). Seems mutually beneficial?  

  ### Unraveling Process:  
  1. **Bob’s Inference:**  
     - Bob knows Alice is rational. If she’s selling, she must have seen **A=Bad** (since with **A=Good**, her valuation would be **$80**, so she wouldn’t sell for **$50**).  
     - Bob updates: "Alice is selling → she saw **A=Bad**."  
     - Bob’s new belief combines **B=Good** and **A=Bad**:  
       `P(X | B=Good, A=Bad) = [P(B=Good | X) * P(A=Bad | X) * P(X)] / [Joint probability]`  
       Joint probability of signals given **X**:  
       `P(B=Good, A=Bad | X) = 0.8 * 0.2 = 0.16`  
       `P(B=Good, A=Bad | ¬X) = 0.2 * 0.8 = 0.16`  
       → **P(X | B=Good, A=Bad) = (0.16 * 0.5) / (0.16 * 0.5 + 0.16 * 0.5) = 0.5** → Values asset at **$50**.  

  2. **Alice’s Inference:**  
     - Alice knows Bob is rational. If he’s buying at **$50**, he must have seen **B=Good** (with **B=Bad**, his valuation would be **$20**, so he wouldn’t buy for **$50**).  
     - Alice updates: "Bob is buying → he saw **B=Good**."  
     - Her new belief combines **A=Bad** and **B=Good**:  
       Same calculation as above → **P(X | A=Bad, B=Good) = 0.5** → Values asset at **$50**.  

  3. **Trade Collapses:**  
     - Alice now values the asset at **$50**, so she won’t sell for **$50** (no surplus).  
     - Bob values it at **$50**, so he won’t pay **$50** (no surplus).  
     - **Result**: No trade occurs, despite initial **$20** vs. **$80** gap.  

  **Why?** The mere willingness to trade leaks private information, updating beliefs until the surplus vanishes. This is the **no-trade theorem**: With common priors, common knowledge of rationality, and no noise, trade based solely on private information is impossible.  

  ---

  ### Realistic Example of Profitable Informed Trading  
  **Scenario:**  
  A biotech hedge fund, **MedCap**, employs virologists who discover that **Company V**’s COVID-19 vaccine trial succeeded (publicly unknown). The current stock price is **$50**. MedCap buys 1 million shares.  
  - **Day 1**: Stock rises to **$52** (due to MedCap’s large order).  
  - **Day 7**: Trial results leak; stock jumps to **$70**.  
  - **MedCap’s profit**: **$18–$20 million**.  

  **Why This Violates the No-Trade Theorem:**  
  The failure point is **violation of common knowledge of rationality due to noise traders**.  

  1. **Noise Traders Camouflage Informed Trading:**  
     - MedCap’s trades are hidden among thousands of daily orders. Market makers see volume spikes but can’t distinguish:  
       - Is this an informed trade (rational agent with private info)?  
       - Or a noise trader (e.g., index fund rebalancing, retail investor gambling)?  
     - **Key**: Noise traders break the "common knowledge" chain. Rational agents (market makers) cannot perfectly infer private signals from trades.  

  2. **Quantitative Failure Point:**  
     - Market makers use Bayesian updating but with imperfect signal extraction.  
       - Let **I = 1** if trade is informed, **I = 0** if noise (prior **P(I=1) = 0.2**).  
       - If a large buy order arrives:  
         - **P(I=1 | Buy) = [P(Buy | I=1) * P(I=1)] / P(Buy)**.  
         - If noise traders also buy aggressively (**P(Buy | I=0) = 0.3**), then:  
           `P(I=1 | Buy) = (1.0 * 0.2) / [(1.0 * 0.2) + (0.3 * 0.8)] = 0.2 / 0.44 ≈ 0.45`  
       - Market makers adjust price to **$50 + (0.45 * $20) = $59** (not $70).  
     - **Result**: MedCap buys at **$52–$59** (below true value **$70**), profiting from the **$11–$18** gap caused by incomplete updating.  

  3. **Which Assumption is Violated?**  
     - **Noise traders break "common knowledge of rationality"**:  
       - Rational agents (MedCap) know market makers *can’t* perfectly infer their private info.  
       - Thus, they trade aggressively, knowing prices won’t instantly reflect true value.  
     - **Not violated**: Common priors (all agree on vaccine probability pre-trial).  

  **Conclusion:**  
  - In the toy example, trade fails because rational updating eliminates gains.  
  - In real markets, **noise/liquidity traders absorb losses**, allowing informed traders to profit. The critical failure is the absence of common knowledge *about the reason for trading*, not irrationality per se.  

  This resolves your debate: Theo is right that "better information wins" *in practice*, but only because real markets violate the no-trade theorem’s "no noise" assumption. Your game theory intuition was correct in a frictionless world.
