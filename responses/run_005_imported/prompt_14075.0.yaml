  So I fell down a decision theory rabbit hole this weekend and got stuck on the "Death in Damascus" case -- I think its originally from a Gibbard and Harper paper from the 70s, but I might be misremembering. I already get Newcomb's problem and the standard move where causal decision theory "wins" by just not caring about the correlation between the predictor and your choice. But apparently Death in Damascus is supposed to be a harder case, where even CDT doesn't clearly get you off the hook once Death is basically a perfect predictor of you specifically, not just of some general strategy. I've seen people bring up "ratifiability" and claim that randomizing your choice (flip a coin, go wherever it lands) doesn't save you either, since Death predicts that too. Can you explain, fairly intuitively, why this case is actually harder than plain Newcomb, what specifically is supposed to break for causal decision theory here (not just the evidential version), and why coin-flipping your way out of it doesn't work? Not looking for a wall of formalism, more the gut-level version so it actually clicks instead of me just nodding along to blog posts about it.
