prompt: |-
  Okay so this has become weirdly relevant to my actual life this month. My dad passed away last year and left me his rusted-out '67 Mustang, which I've spent months rebuilding — new frame rails, new floor pans, a whole new engine since the original block had cracked. Now the DMV is telling me it might have to get retitled as a "reconstructed vehicle" instead of keeping the original VIN, since apparently theres some threshold for how much of the "original" car you can swap out before its legally a different car. Naturally this sent me down a rabbit hole into material constitution / the statue-and-clay stuff, which I guess is the fancy-philosophy version of my DMV headache.

  While googling around I found the actual passage that's apparently the ancestor of all the "ship of Theseus" talk, from Hobbes's De Corpore / Elements of Philosophy (1656). I can barely parse 17th-century philosophy-english though:

  "According to the second Opinion, two Bodies existing both at once, would be one and the same Numerical Body; for if (for example) that Ship of Theseus (concerning the Difference whereof, made by continual reparation, in taking out the old Planks, and putting in new, the Sophisters of Athens were wont to dispute) were, after all the Planks were changed, the same Numerical Ship it was at the beginning; and if some Man had kept the Old Planks as they were taken out, and by putting them afterwards together in the same order, had again made a Ship of them, this without doubt had also been the same Numerical Ship with that which was at the beginning; and so there would have been two Ships Numerically the same, which is absurd. But according to the third Opinion, Nothing would be the same it was; so that a Man standing, would not be the same he was sitting; nor the Water which is in the Vessel, the same with that which is poured out of it. Wherefore the beginning of Individuation is not alwayes to be taken either from Matter alone, or from Form alone. But we must consider by what name any thing is called, when we enquire concerning the Identity of it; for it is one thing to ask concerning Socrates whether he be the same Man, and another to ask whether he be the same Body; for his Body when he is Old, cannot be the same it was when he was an Infant..."

  Can you walk me through what's actually happening move by move here — like, what does "the second Opinion" have to be for the ship example to work as a reductio against it, and why does Hobbes think the "third Opinion" (standing/sitting man, water in the vessel) is just as bad? And then the real question: is his own fix at the end — identity depending on "what name" you're using, man vs. body — basically an early version of "relative identity" or sortal-dependent identity, or is it closer to the "constitution without identity" move people use now for the statue and the lump of clay (treating them as two coincident objects instead of one thing under two names)? Or is it doing something else entirely? Kind of need to know if I get to smugly tell the DMV clerk that Hobbes beat him to this by 370 years.
