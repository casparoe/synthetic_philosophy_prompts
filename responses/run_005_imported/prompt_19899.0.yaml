answer: |-
  That's a sharp question, and the key lies in the nuances of Aquinas's argument versus Mariana's, combined with the drastically different political and religious contexts three centuries later. **Aquinas did *not* give a blanket "Church blessing" for private citizens to assassinate tyrants.** Mariana's argument was significantly more radical and dangerous in its specific historical moment. Here's the breakdown:

  1.  **Aquinas's *Much* More Restrictive Position (Summa Theologica, I-II, Q.42, A.2 & II-II, Q.42, A.2):**
      *   **Focus on Removal, Not Necessarily Assassination:** Aquinas primarily discusses whether it's lawful to *overthrow* a tyrant, not necessarily assassinate him. He distinguishes between just removal and murder.
      *   **"Not by Private Presumption... But by Public Authority":** This is the **crucial point**. Aquinas explicitly rejects the idea of a private individual acting on their own initiative ("*non est autem per privatum praesumptionem*"). He argues rebellion is generally worse than tyranny because it leads to greater discord. Removal must be done:
          *   By a superior public authority (like a higher lord or representative body).
          *   By the whole people acting *collectively* ("*per multitudinem*"), not by an individual.
          *   Only if the tyrant's actions are manifestly unjust and oppressive *beyond doubt*.
      *   **High Bar & Procedural Safeguards:** Aquinas sets a very high bar. Removal requires public authority, collective action, and manifest tyranny. It's framed as a last-resort judicial or political act, not individual vigilantism.

  2.  **Mariana's More Permissive and Dangerous Argument (De Rege et Regis Institutione, 1599):**
      *   **Explicit Justification of Private Tyrannicide:** Mariana explicitly argues that if no superior public authority exists or is willing to act, and the tyrant has *usurped* power or rules manifestly tyrannically (especially by seizing property and denying justice), **a private citizen is justified in assassinating him.** He sees it as a heroic act for the public good.
      *   **Focus on Usurpation & Heresy:** Mariana wrote in the context of the Spanish struggle against heretical monarchs (like Elizabeth I) and the French Wars of Religion. His arguments were particularly potent against rulers seen as heretical usurpers who had broken their covenant with God and the people. This made it highly relevant to Catholic extremists opposing Protestant or "apostate" monarchs.
      *   **Practical Details:** Mariana notoriously discussed methods, including poison, making his work read like a potential handbook rather than just a theoretical treatise. This practical aspect amplified its perceived danger.
      *   **"Calling" vs. "Right":** While he included caveats (like exhausting other means, the tyrant being a usurper), the core message was clear: under certain extreme conditions, an individual *could* and *should* act as the instrument of divine and popular justice.

  3.  **The Explosive Context of the Late 16th Century:**
      *   **Religious Wars:** Europe was engulfed in brutal sectarian conflict (French Wars of Religion, Dutch Revolt, Anglo-Spanish tensions). Assassination plots against monarchs (Elizabeth I, William of Orange) were real and frequent.
      *   **Henry IV of France:** A former Huguenot who converted to Catholicism ("Paris is worth a Mass"), he was *still* distrusted by hardline Catholics (like the Spanish Habsburgs and the Pope) who saw him as a cynical opportunist and a threat. His assassination by François Ravaillac in 1610, while not directly inspired by Mariana, created an immediate panic.
      *   **Political Instability:** Monarchs and the Church feared the doctrine of tyrannicide as a direct threat to the stability of the state and the principle of divinely ordained (though not absolute) monarchy. The Peace of Augsburg (1555) and the future Peace of Westphalia (1648) were built on the principle *cuius regio, eius religio* and the need for sovereign stability, which tyrannicide doctrines undermined.
      *   **The Church's Precarious Position:** The Papacy, after the trauma of the Reformation and facing powerful Protestant states and internal Catholic divisions (Gallicanism in France), needed to distance itself from radical doctrines that could:
          *   Justify the assassination of *any* monarch (including Catholic ones facing rebellion).
          *   Be used by Protestants to justify killing Catholic rulers.
          *   Undermine the Church's own political alliances and its claim to be a force for order.

  **Why Mariana Caused an Uproar While Aquinas Didn't (in the same way):**

  1.  **The Radical Departure:** Mariana explicitly crossed the line Aquinas had drawn. Aquinas said "No" to private action. Mariana said "Yes, under these specific, extreme conditions." This was a qualitative shift, not a restatement.
  2.  **The Practical Handbook:** Discussing methods like poison made *De Rege* feel like an incitement, not just a philosophical discourse.
  3.  **Immediate Political Context:** The book was published (1599) in the midst of intense conflict and suspicion surrounding figures like Henry IV. Its arguments were directly applicable to contemporary political struggles in a way Aquinas's 13th-century commentary wasn't.
  4.  **The Trigger Event:** The assassination of Henry IV (1610), regardless of Ravaillac's actual motives, created a firestorm. Authorities (especially the Parlement of Paris, backed by the regency government for young Louis XIII) were desperate to suppress *any* literature that could be seen as justifying regicide to prevent further instability and appease powerful factions. Mariana's book was an obvious and dangerous target. Condemning and burning it was a public act to assert state/church control and denounce violence.
  5.  **The Church's Need for Deniability:** While Aquinas's principles might theoretically allow for removal *by public authority*, the Church could live with that ambiguity. Mariana's justification of *private* assassination, especially against potentially "heretical" rulers, was too specific, too current, and too dangerous. The Church needed to condemn it publicly to protect itself politically and maintain its role as an arbiter of order, not chaos.

  **In short:** Aquinas provided a restrictive, procedural framework focused on public authority. Mariana provided a radical, actionable doctrine justifying private assassination, published in the powder keg of late 16th-century religious warfare. When a king was actually assassinated shortly after, Mariana's specific, permissive arguments became politically toxic and had to be publicly disavowed to maintain stability and the Church's standing, even if elements of his reasoning drew on older traditions. The difference wasn't just in the argument, but in its specificity, practicality, and the explosive historical moment in which it was published and later invoked.
