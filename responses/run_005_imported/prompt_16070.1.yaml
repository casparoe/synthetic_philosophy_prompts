  *flipping through mental notes on Parfit* Right, the reductionist should challenge why psychological continuity isn't sufficient, while the further-fact advocate needs to articulate that haunting "but it wouldn't be ME" intuition without sounding mystical. 

  For the boarding pass tension... perhaps have the reductionist character actually holding the ticket? That creates beautiful dramatic irony - their position gets tested immediately. 

  *scribbling dialogue structure* 
