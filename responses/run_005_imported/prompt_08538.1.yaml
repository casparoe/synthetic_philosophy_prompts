  I'm writing a scene for my novel where two old grad school friends—both ended up as ethicists, so of course they can't just have a normal reunion drink—end up arguing about whether a hypocrite actually looses their standing to blame someone, or if that's just a fancier way of dodging a fair accusation ("look who's talking," dressed up in academic clothes). Can you write their argument as a proper back-and-forth, maybe 500-600 words, dialogue only? I want both of them to be sharp—no pushovers or strawmen, these are two people who've actually thought about this for years. Push on cases where the "standing" intuition feels strong, like a recovering addict telling their own kid to stay off drugs, and make sure the skeptic has an actual answer for that instead of just biting the bullet. Also curious whether they'd end up agreeing that "losing standing" is a real seperate thing from the accusation itself being false, or whether that whole idea collapses under pressure. No need to set the scene, I've got that covered—just want the exchange itself.
