  Here’s a 4-minute wedding speech weaving Parfit's Hitchhiker deeply into the core message about Priya's character and commitment, designed to resonate with *everyone*:

  **(Start with warmth and connection)**
  "Good evening, everyone! For those who don’t know me, I’m [Your Name], and I’ve had the immense privilege of being Priya’s friend since our days in the SSC/LW meetup group back in 2015. It’s such a joy to celebrate Priya and [Groom's Name] today!

  **(Introduce the Hook - The Story)**
  Now, Priya has this… well, let’s call it a signature philosophy. She’s mentioned it for years, and it comes from a quirky little thought experiment involving a hitchhiker. Picture this: Imagine a guy stranded in the desert, dying of thirst. A driver pulls up and says, ‘I’ll take you to town, *but only if you promise to pay me once we get there.’* The hitchhiker, desperate, promises. But here’s the catch: Once he’s safe in town, warm and hydrated… what reason does he *really* have to pay up? He’s safe! He could just walk away. Paying seems… irrational.

  **(Make it Personal - Priya's Ethos)**
  Priya calls this story ‘Parfit’s Hitchhiker’. And her whole takeaway, her mantra for years, has been just three words: **‘Pay the Driver.’** Not because it makes sense *in that moment* when you’re safe and comfortable. Paying the driver *then* feels pointless, maybe even silly. But Priya says: **Pay. The. Driver.**

  **(Explain the "Why" Simply - Rational Irrationality)**
  Why? Because she believes something profound. She believes that **the true power of a promise isn't proven when it's easy to keep. It’s proven precisely when it’s *hard* to keep, when every selfish reason tells you to walk away.** She calls this ‘rational irrationality’. Sounds contradictory, right? But it’s brilliant. It means **choosing loyalty *on purpose*. Choosing integrity *deliberately*, even – *especially* – when the immediate, easy path is to shrug it off.**

  **(Ground it in Real Life - Show, Don't Tell Lecture)**
  And Priya? Priya *lives* this. It’s not just theory. It’s the bedrock of who she is. I’ve seen it countless times. When she said she’d help organize that ridiculously complex meetup event, even when her own life was chaos? *She paid the driver.* When she promised a friend support during a tough time, long after the initial crisis passed? *She paid the driver.* When she committed to a project, a cause, or simply *being there* for someone, and following through meant real personal cost or inconvenience? **Priya always, always pays the driver.**

  **(Pivot to Marriage - The Ultimate Promise)**
  That’s why, [Groom's Name], and everyone here, Priya’s promises… they mean something *different*. They have weight. They aren't just words said in the moment for convenience. They are declarations of a **deeply held, consciously chosen principle.** She has spent years deliberately building herself into someone whose word is ironclad, precisely *because* she practices this ‘rational irrationality’ – this commitment to loyalty *beyond* the moment of need.

  **(Connect to the Couple & the Vows)**
  And that brings us to today. Marriage is the ultimate ‘Pay the Driver’ moment. You stood up here, Priya and [Groom's Name], in front of everyone you love, and made breathtaking promises. ‘For better, for worse… in sickness and in health… to love and to cherish…’ These aren't promises for the easy days, the desert-rescue moments. These are promises for *town*.

  **(The Core Message - Why This Matters for Them)**
  They are promises you make when you’re safe, comfortable, maybe even a little complacent. Promises you make for the countless ordinary Tuesdays, the stressful times, the moments when walking away might *seem* easier. Priya’s entire philosophy, the essence of ‘Pay the Driver,’ is why we know, truly know, that when Priya makes those vows… **she means them with every fiber of her being.** She has spent a lifetime practicing for *this* kind of promise. She understands, fundamentally, that the *real* test of love and loyalty comes *after* the rescue, in the everyday choices to show up, to choose each other, to honour that commitment – even when it’s not the path of least resistance.

  **(Address the Groom Directly)**
  [Groom's Name], you’ve clearly seen this incredible quality in her. That unwavering core of integrity. That deliberate, purposeful loyalty. It’s magnetic. It’s trustworthy. It’s the foundation of a love that endures. You’ve found a partner who doesn’t just *make* promises; she *architects* her life around being someone who *keeps* them, no matter what.

  **(The Toast)**
  So, let’s raise our glasses. To Priya and [Groom's Name]! May your journey together be filled with joy and adventure. And may you always find in each other that profound commitment – that beautiful, ‘irrational’ loyalty – the unwavering choice, every single day, in big ways and small, **to Pay the Driver.** Cheers!"

  **Why this works:**

  1.  **The Backbone:** The Hitchhiker story isn't a throwaway line; it's the central analogy used to explain Priya's character and the *nature* of her promises.
  2.  **Accessible Explanation:** "Rational irrationality" is introduced *after* the relatable story and immediately simplified into "choosing loyalty *on purpose*" and "choosing integrity *deliberately*." The focus is on the *action* and *intention*, not the theory label.
  3.  **Shows, Doesn't Just Tell:** Concrete examples ("organizing the meetup," "supporting a friend") demonstrate Priya living the principle, making it real for the audience.
  4.  **Directly Connects to Marriage:** The speech explicitly links "Pay the Driver" to the *marriage vows*, explaining *why* Priya's promises today are especially meaningful and trustworthy based on her established character.
  5.  **Avoids Jargon:** Terms like "time inconsistency" or "commitment device" are completely omitted. The focus is on universal concepts: promises, loyalty, trust, integrity, choice.
  6.  **Warm and Personal:** Grounded in friendship, uses "Priya" specifically, addresses the groom directly, and ends with a heartfelt toast focused on *their* future.
  7.  **Respects Both Sides:** Explains Priya's unique philosophy clearly enough for the groom's side without condescension, while giving the SSC/LW crowd the deep reference they'll appreciate. The emphasis is on the *human quality* it represents, which everyone understands.
  8.  **Strong Finish:** The toast powerfully ties the metaphor directly back to their marriage and future choices.
