  Possible approaches: The memo could argue that the overall gap isn't due to admissions bias but structural factors. Recommendations would then focus on outreach and mentoring to balance application pools. This addresses the gap without altering admissions processes, satisfying the track-data side. The other side's concern about bias is redirected to structural solutions.

