answer: |-
  The notification popped on Lena’s second monitor, a tiny red devil emoji blinking beside a case ID. Trust & Safety, Level 3 Escalation. She sighed, cracking her knuckles. Another Tuesday, another fire.

  She clicked. The incident report unfurled: a user, @SolitaryPine, had posted a nuanced, slightly rambling critique of a popular productivity app’s data collection practices. Buried in paragraph seven was a clumsy analogy comparing the app’s constant nudges to "a nagging spouse." That was the spark.

  Lena scanned the attached metrics. Engagement had exploded overnight. Not with the core argument about data, but with the "nagging spouse" line. Screenshots, devoid of context, flooded niche sub-communities. Memes bloomed: a pixelated cartoon spouse with fangs, captions like "When your To-Do list gaslights you." Hashtags trended: #AppAbuse, #DigitalDomesticTerror, #CancelNagTech. @SolitaryPine’s follower count had plunged. Their bio now read, simply: "Sorry."

  "Level 3? For this?" Lena muttered to Raj, her teammate, gesturing at her screen. "It’s just… noise."

  Raj peered over. "Ah, the Ghost Public’s got indigestion again. Standard pattern. Find the misfire, amplify, discard." He tapped his own monitor showing a dashboard of virality spikes. "Look at the velocity. Pure abstraction in motion. A million fingers pointing, zero knuckles getting bruised."

  Lena knew the drill. She’d been a moderator for three years. She understood the levers: the algorithms favoring outrage, the ease of retweeting a fragment without reading the source, the dopamine hit of joining a righteous chorus. She drafted the boilerplate response: *"We take concerns about respectful discourse seriously. User @SolitaryPine’s post has been reviewed. While the language used was potentially insensitive, it did not violate our specific hate speech policies..."* She hesitated, then deleted the last clause. Too defensive. The *Public* didn’t like nuance. It craved resolution. She replaced it with: *"We encourage all users to engage constructively."* Meaningless, but safe. She flagged the post for reduced visibility. The lever pulled, the immediate pressure valve released. @SolitaryPine would remain buried. The Public, sated for now, would dissipate, seeking its next target. Lena felt a familiar, hollow detachment. She was just maintaining the machine.

  Later, scrolling through her personal feed during a break, Lena saw a meme mocking a local politician’s awkward handshake. Harmless fun, she thought. She added a comment, riffing on a colleague’s joke from that morning: "Looks like he’s trying to negotiate a peace treaty with a doorknob! 🤝🚪😂 #HandshakeHorror." She hit post. Ten likes bloomed instantly. A tiny surge of validation.

  She didn’t notice the reply from @TruthSifter42: "Wow. Comparing a respected community leader’s disability (tremors from Parkinson’s) to ‘negotiating with a doorknob.’ Classy." Lena froze. Disability? She frantically searched the politician’s bio. Nothing. Searched news archives. Buried in a local paper’s health section from two years prior: a brief mention of his diagnosis.

  Her stomach dropped. It was an honest, stupid mistake. She hadn’t known. Her comment was cruel in context, context she’d lacked. She immediately deleted the post and drafted an apology: "Deeply sorry. Unaware of Mr. Henderson’s condition. My comment was insensitive and wrong. Deleted." She posted it.

  But the screenshot had already escaped. @TruthSifter42 had reposted it with the caption: "MODERATOR @LenaTecHatesSickPpl thinks Parkinson’s is a JOKE. #FireTheBigot #TechToxicity." Engagement metrics, those cold, familiar numbers she manipulated daily, began their malignant climb. Her apology was buried under the avalanche. Her handle, usually anonymous, was doxxed in a replies chain. Suddenly, her work inbox pinged. Not a system alert. A personal email: *"Hope you get tremors too, bitch."*

  The next morning, walking into the T&S bullpen felt like entering a soundproofed vacuum. The usual hum of keyboards and muttered curses was gone. Heads stayed down. Raj wouldn’t meet her eyes. Her manager, Priya, called her into a glass-walled meeting room. Priya’s face was carefully neutral, her voice low.

  "Lena. Situation."

  "It was a mistake, Priya. I deleted it immediately. Apologized. I didn’t know—"

  Priya held up a hand. "I know. I reviewed the logs. But… the optics." She slid a tablet across the table. A trending hashtag: #ModsAreTheProblem. Screenshots of Lena’s deleted joke juxtaposed with articles about Mr. Henderson’s charity work. Angry petitions demanding her firing. "The *Public*," Priya said, stressing the word like it was radioactive, "is very… activated. Our brand safety metrics are spiking negatively. The narrative is that we harbor ableist moderators."

  "The narrative is built on a screenshot!" Lena’s voice cracked. "Out of context! I didn’t know!"

  "Context is irrelevant to the Public," Priya stated flatly. "It exists as sensation. Right now, the sensation is outrage directed at *us*, via you. The abstraction needs appeasement."

  "What does that mean?"

  "It means," Priya sighed, "administrative leave. Effective immediately. While we… assess the situation."

  "Assess? You *know* what happened!"

  "Lena, please. We need to *calm the public*. Show we take it seriously. It’s… leveling. We all become part of the reaction. No one *wants* this, but the pressure… it demands a sacrifice to dissipate." Priya’s eyes held a flicker of something – pity? Resignation? "Go home. Stay offline. We’ll be in touch."

  Walking out, Lena felt the stares like physical heat. No one jeered. No one said a word. They just watched her pack her bag, their faces blank screens reflecting the abstraction’s judgment. They weren’t individuals condemning her; they were borrowing the Public’s borrowed authority, absolved by its faceless roar. She was no longer Lena, the competent moderator who pulled levers on the machine. She was @LenaTecHatesSickPpl, a vessel for collective outrage, a temporary focal point for the formless anger that needed somewhere, *anywhere*, to land.

  On the train home, she saw a notification. A new message in the internal T&S Slack channel she was still, technically, part of. Raj: *"Anyone got eyes on Case #7741? The dog park rant? Ghost Public’s rumbling about ‘canine consent’ now. Absurd, but velocity picking up. Prep the boilerplate?"*

  Below it, a flurry of responses, solutions proposed, levers identified. The machine hummed on, efficient, impersonal. Lena closed the app. The abstraction had moved on, leaving only the chill of its passage and the hollow space where her individuality, her concrete mistake and concrete apology, had been dissolved. She looked at her hands. Real. Solid. Responsible. But in the eyes of the Public, they were already ghosts.
