answer: |-
  ## The Tangled Mosaic: Can Humean Supervenience Survive Quantum Entanglement?

  David Lewis's Humean Supervenience (HS) presents a compellingly austere metaphysical vision: the entire universe, including its laws and chances, supervenes upon a vast but fundamentally simple "mosaic" – a distribution of perfectly local, intrinsic qualities instantiated at points or very small regions of spacetime. The laws emerge not as fundamental governing principles, but as theorems within the "Best System Account" (BSA), the optimally simple and informative summary of the patterns within this mosaic. Quantum entanglement, however, presents a profound challenge to this vision. The phenomenon of non-separable quantum states – where the properties of spatially separated systems are intrinsically correlated in ways no arrangement of purely local facts at each location can explain – seems to demand fundamental, irreducible relations that defy Lewis's strictly localist supervenience base. Assessing whether HS can survive this challenge requires examining proposed modifications and determining if they rescue the Humean project or constitute a surrender to anti-Humeanism. This essay argues that while **enlarging the base to include fundamental relations fatally compromises core Humean commitments, a retreat to wave-function realism offers a coherent, albeit radically transformed, Humeanism that can accommodate non-separability, preserving the spirit of the BSA while abandoning the local mosaic.**

  **The Challenge: Non-Separability and the Failure of Localism**

  Quantum entanglement creates states like the singlet state of two electrons: |ψ> = (|↑↓> - |↓↑>)/√2. Crucially:
  1.  **Non-Separability:** The state describes a *single* physical reality encompassing both particles. It cannot be factored into a product of independent states for each particle (|ψ> ≠ |ψ₁> ⊗ |ψ₂>).
  2.  **Holistic Properties:** The system possesses properties (like total spin = 0) that belong to the whole, not reducibly to the parts. Measurements on one particle instantaneously determine the state of the other, irrespective of distance, violating Bell's inequalities.
  3.  **Failure of Local Supervenience:** No assignment of purely *local*, *intrinsic* properties to each particle (or their individual spacetime points) can account for the perfect correlations observed without violating locality or introducing hidden variables – both options anathema to standard quantum mechanics and HS's reliance on local facts. The correlation is an irreducible feature of the *relation* between the particles, not derivable from their individual intrinsic natures. As Tim Maudlin forcefully argues, entanglement demands fundamental, non-supervenient relations.

  For Lewis's original HS, this is catastrophic. If the fundamental mosaic consists *only* of local intrinsic qualities at spacetime points, the entangled correlations must supervene on those qualities. But Bell's theorem demonstrates they cannot, without spooky action-at-a-distance or hidden variables. The BSA, which summarizes patterns in the local mosaic, cannot derive laws predicting these correlations solely from local qualities. The non-separable relations appear fundamental.

  **Modification 1: Enlarging the Base - Fundamental Relations**

  One proposed fix is to expand the supervenience base to include fundamental, irreducible relations alongside local intrinsic properties. The mosaic now includes not just qualities *at* points, but relations *between* points or regions.

  *   **Apparent Salvation:** This directly addresses non-separability. Entanglement relations become part of the fundamental furniture of the world. The BSA can then summarize patterns involving these relations alongside local qualities, potentially yielding quantum mechanical laws. The correlations are now grounded in the fundamental base.
  *   **The Anti-Humean Concession:** However, this move fundamentally abandons a core tenet of *Humeanism*. Lewis emphatically defined HS by its commitment to the "doctrine of *spatiotemporal* pointwise qualitative instantiation" – everything supervenes on *local* intrinsic properties. Introducing fundamental relations violates this strict localism. Relations, especially non-supervenient ones necessary for entanglement, are paradigmatically non-Humean. Anti-Humeans like Armstrong posit fundamental governing relations (laws) precisely to account for necessary connections. Adding fundamental relations to the base is not modifying HS; it is conceding that the fundamental ontology requires more than the Humean mosaic of local qualities. It replaces Humean *supervenience* of relations with their fundamental *existence*. This saves the *letter* of supervenience (laws still supervene on the base) but eviscerates its *spirit* by including precisely the kind of modal, non-local glue Humeans sought to avoid.

  **Modification 2: Retreat to Wave-Function Realism**

  A more promising route involves redefining the mosaic itself. Wave-function realism (WFR) posits that the fundamental physical entity is the universal wave function (Ψ), evolving in a high-dimensional configuration space (or on some views, a physical space of fundamental fields). The familiar 3D/4D spacetime and localized objects within it are derivative phenomena.

  *   **Reconceiving the Mosaic:** Under Humean WFR, the fundamental mosaic is the history of the wave function Ψ across configuration space. This history constitutes the complete set of particular facts. Crucially, Ψ is a *global* entity – its value at any "point" in configuration space depends on the coordinates of *all* particles. Entanglement is built-in; non-separable states are simply specific configurations of Ψ.
  *   **Salvaging the BSA:** The Humean claims that the laws of physics (like the Schrödinger equation) emerge as axioms within the BSA applied to the entire history of Ψ in configuration space. The BSA finds the simplest, most informative summary of the patterns exhibited by Ψ(t) across this high-dimensional space. Non-separability is no longer problematic because the fundamental object (Ψ) is inherently non-local; the mosaic *includes* the global state from the outset. There are no fundamental relations *between* localized spacetime points to add; the fundamental reality is the wave function field itself. Proponents like Loewer argue this preserves the core Humean insight: laws are summaries of patterns in the particular facts (now the Ψ-history), not fundamental governing entities. The supervenience base is still non-modal and particular; it's just not local in 3D space.
  *   **Assessing the Modification:** This move is radical. It abandons Lewis's commitment to a point-local mosaic in *spacetime* in favor of a global state in *configuration space*. However, it arguably preserves the *essential* Humean commitments:
      *   **Anti-Modality:** The fundamental facts are categorical – the specific values of Ψ at points in configuration space over time. No fundamental powers, necessities, or governing relations are posited.
      *   **Supervenience:** Everything (including apparent localized objects, tables, chairs, and conscious experiences in spacetime) supervenes on the history of Ψ. Laws supervene via the BSA.
      *   **BSA Core:** The BSA remains the engine generating laws from patterns in the particular facts (the Ψ-history).
      *   **No Fundamental Relations:** Relations aren't added *to* the mosaic; the fundamental entity (Ψ) is a field whose state at a configuration space point is intrinsic *to that point* in that space (though its value depends on many particle coordinates relative to that space's structure).

  While dramatically different from Lewis's original spacetime-based picture, Humean WFR offers a coherent, unified fundamental ontology that naturally incorporates non-separability. The challenge is no longer fatal; it's dissolved by redefining the arena. The cost is accepting that spacetime locality is not fundamental – a significant retreat, but arguably one forced by physics itself, not a concession to anti-Humean metaphysics. The Humean core – laws as systematizing summaries, no fundamental modality – remains intact.

  **Verdict: Humeanism Transformed, Not Abandoned**

  Quantum entanglement, with its demand for non-separable states, delivers a fatal blow to Lewis's original formulation of Humean Supervenience based on a spacetime mosaic of local intrinsic qualities. The irreducible holism cannot be captured within that sparse ontology without abandoning locality or introducing non-local beables – both moves incompatible with the spirit of HS. **Simply enlarging the base to include fundamental relations, while technically preserving supervenience, constitutes a capitulation to anti-Humeanism by introducing fundamental, non-supervenient modal connections.**

  However, the retreat to **wave-function realism offers a tenable, albeit radically modified, Humeanism.** By redefining the fundamental mosaic as the history of the universal wave function in configuration space, non-separability becomes an intrinsic feature of the fundamental entity, not an emergent threat to localism. The Best System Account can still operate, deriving laws as summaries of patterns in this global history. While this sacrifices the intuitive fundamentality of spacetime locality – a profound shift – it preserves the core Humean theses: the fundamental facts are non-modal and particular, and laws are metaphysically dependent upon them, emerging through systematization. Therefore, **Humean Supervenience, suitably modified through wave-function realism, remains tenable in light of quantum non-separability.** It emerges transformed, its localist aspirations humbled by quantum reality, but its core commitment to a world grounded in non-modal particulars described by systematizing laws endures. The mosaic has been reconfigured, but the Humean project of grounding modality in patterns of particular fact persists.
