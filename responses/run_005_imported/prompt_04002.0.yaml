answer: |-
  You've pinpointed a classic and profound philosophical debate. Your friend's view is common and intuitive, but Quine explicitly argued that **indeterminacy of translation is *stronger* and *different in kind* from ordinary underdetermination of scientific theory.** Here's a careful comparison:

  **1. Ordinary Underdetermination of Theory by Evidence (UTE):**

  *   **Core Idea:** For any finite body of empirical evidence (observations, experimental results), there are always multiple, logically incompatible scientific theories that are *equally compatible* with that evidence. No evidence can uniquely determine one theory as "correct."
  *   **Nature of Rival Theories:** The rival theories are about the *same underlying reality*. They make conflicting claims about what exists or how the world fundamentally works (e.g., Newtonian vs. Einsteinian gravity pre-critical tests; different quantum interpretations).
  *   **Epistemic Status:** We assume that *one* of the empirically equivalent theories is actually true (or closer to the truth) about the world, even if we cannot know which one based on current evidence. Future evidence *could*, in principle, decide between them. The indeterminacy is epistemological (about our *knowledge*).
  *   **Cause:** The gap between finite evidence and universal theoretical claims.

  **2. Indeterminacy of Translation (Quine's Thesis):**

  *   **Core Idea:** Given all *possible* behavioral evidence about a speaker's use of language (dispositions to assent/dissent to sentences under specific stimulations), there can be multiple, radically different "translation manuals" for mapping the speaker's language onto the linguist's language. These manuals are *empirically equivalent* – they predict all observable linguistic behavior equally well – but they are *logically incompatible* in the meanings they assign to individual words or the ontological commitments they attribute to the speaker.
  *   **Nature of Rival Manuals:** The manuals aren't just different descriptions of the *same* underlying meaning facts. Quine argues there *are no* further meaning facts (beyond behavioral dispositions) to be right or wrong about. The rival manuals attribute fundamentally different *ontologies* or *conceptual schemes* to the speaker (e.g., "gavagai" meaning "rabbit" vs. "undetached rabbit part" vs. "rabbit-stage"). They aren't describing the *same* meanings differently; they are assigning *different* meanings.
  *   **Epistemic Status:** There is *no fact of the matter* about which manual is "correct" regarding the meaning of individual terms or the speaker's ontology. It's not just that *we* can't know; there's *nothing to know* beyond the behavioral dispositions. The indeterminacy is ontological (about the *existence* of determinate meanings/reference). Future evidence *cannot* decide between them, as they are constructed to agree on all possible evidence.
  *   **Cause:** Rooted in Quine's specific philosophical commitments:
      *   **Behaviorism:** Meaning is exhaustively defined by observable stimulus-response patterns (stimulus meaning). There is no access to private mental meanings or "meanings in the head."
      *   **Rejection of Analyticity/Synthetic Distinction:** There are no meaning-constituting "analytic" truths that fix reference independently of empirical theory.
      *   **Holism:** The meaning of any single term is determined by its role within the entire web of belief. Radically different internal structures of the web can be compatible with the same observable periphery (stimulus conditions).
      *   **Rejection of Meanings as Entities:** Meanings aren't Platonic objects or mental entities to which words determinately refer. Reference is itself indeterminate.

  **Why Indeterminacy is Stronger and Stranger (The "Extra Strangeness"):**

  1.  **"No Fact of the Matter":** This is the crucial difference. UTE says "We don't know which theory is true." Indeterminacy says "There *is no* 'true' translation manual at the level of word meaning/reference; the manuals aren't even *trying* to describe the same pre-existing meaning facts." It denies the very existence of the entities (determinate meanings, fixed reference) that UTE presupposes theories are competing to describe accurately.
  2.  **Ontological Relativity:** Indeterminacy directly implies that what a speaker's terms *refer to* is relative to the chosen translation manual. There's no absolute answer to "What does 'gavagai' *really* refer to?" It refers to rabbits relative to Manual A, undetached rabbit parts relative to Manual B. This relativity of ontology is profoundly counterintuitive.
  3.  **Proxy Functions:** Quine argued you could systematically transform *all* the objects referred to in a speaker's language (e.g., map everything to its cosmic complement, or temporal counterpart) via a "proxy function," adjust the translation manual accordingly, and still preserve all stimulus meanings. This shows the radical depth of referential indeterminacy – the *entire ontology* can be permuted without empirical consequence. UTE doesn't typically involve this kind of wholesale ontological relativity *within* a single conceptual scheme.
  4.  **Target of Indeterminacy:** UTE applies to theories about the *external world*. Indeterminacy applies to the interpretation of *another mind's* linguistic representation *of* the external world. It challenges the very possibility of shared, determinate meaning between minds.

  **Is Indeterminacy Just a Special Case of UTE? Your Friend's Claim:**

  *   **Superficial Similarity:** Yes, both involve empirically equivalent but incompatible systems (theories/manuals).
  *   **Quine's Rebuttal (The Independent Claim):** No, because UTE assumes an independent reality that the theories are attempting to describe, even if our access is limited. Indeterminacy denies the existence of an independent reality *of determinate meanings or references* for the translation manuals to be right or wrong about. **The extra, independent claim is Quine's behaviorism + rejection of meaning entities + holism.** These doctrines lead to the conclusion that the "meaning facts" UTE would presuppose simply *don't exist*. Translation manuals are tools for systematizing behavior, not descriptions of pre-existing semantic realities.

  **Is Quine's Thesis Defensible?**

  This is highly contested:

  *   **Arguments For:**
      *   The "gavagai" and proxy function arguments are powerful thought experiments highlighting the gap between behavior and determinate meaning.
      *   It rigorously follows from Quine's naturalistic, behaviorist epistemology. If meaning must be grounded in public evidence, and that evidence is limited to stimulus-response patterns, then indeterminacy seems inevitable.
      *   It avoids appealing to mysterious mental entities or Platonic meanings.

  *   **Arguments Against:**
      *   **Overly Restrictive Behaviorism:** Critics (like Chomsky, Searle, Fodor) argue Quine sets the bar for evidence impossibly high by excluding any role for internal cognitive states, intuitions about meaning, or the speaker's own perspective. We *do* seem to have access to more than just stimulus meanings (e.g., through complex linguistic interactions, asking for explanations, understanding intentions).
      *   **The "First-Person" Problem:** I seem to *know* what *I* mean by my words (e.g., "rabbit") determinately. Quine struggles to account for this first-person authority without smuggling in the meaning entities he rejects.
      *   **Pragmatic Implausibility:** While logically possible, manuals positing "undetached rabbit parts" or cosmic complements seem wildly implausible as descriptions of how actual humans learn and use language. Quine might reply "implausibility isn't empirical inadequacy," but critics argue this highlights the inadequacy of his purely behavioral criterion.
      *   **Inscrutability vs. Indeterminacy:** Some argue Quine convincingly shows *inscrutability* of reference (we can't *tell* which is right), but fails to prove genuine *indeterminacy* (there *is* no right one). The leap from epistemological underdetermination to ontological indeterminacy relies heavily on the controversial rejection of meaning entities.
      *   **Holism's Bite:** While holism supports indeterminacy, some argue it's self-defeating. If meaning is so radically holistic and indeterminate, how do we even manage to translate *anything* successfully enough to have the debate?

  **Conclusion:**

  Your friend is right that indeterminacy *involves* underdetermination – multiple systems fit the evidence. **But Quine's indeterminacy thesis is *not* merely a special case of UTE. It relies on the stronger, independent claim that there are *no determinate meaning facts* for translation manuals to be right or wrong about, grounded in his behaviorism, rejection of analyticity/meanings, and holism.** This is the source of the "extra strangeness": the denial of a fact of the matter about meaning and reference, leading to ontological relativity.

  Whether this stronger thesis is defensible remains a central debate in philosophy of language. Quine's arguments are rigorous and challenging, but many find his behaviorist starting point too restrictive to capture the richness of meaning and intentionality we experience. The debate hinges on fundamental questions about the nature of meaning, mind, and our access to the thoughts of others. Your unresolved point lies at the heart of one of the 20th century's most influential and provocative philosophical arguments.
