answer: |-
  Here’s a draft that threads the needle—honoring the intellectual depth for the academics while keeping it warm and accessible for all. The "nerd moment" is clearly marked (you’ll see it), and the emotional core rests on vulnerability as the real unfakeable cost.

  ---

  **(Clink glass gently, warm smile)**  

  "Friends, family, and distinguished guests who’ve probably published papers with titles like ‘Optimal Foraging in Unpredictable Nuptial Environments’… *[pause for laughter]*… it’s an honour to stand here for [Groom] and [Bride]. Like all of you, I’ve watched these two build something incredible. And like any good best man, I spent weeks researching how to do this speech justice. Turns out, the best advice came from peacocks. Bear with me!  

  We all know weddings are… *expansive* events. The flowers, the food, the sheer logistical feat of getting us all in one room. It’s tempting to look at all this and think, ‘Wow, they must *really* mean it to spend this much!’ But here’s the thing my biologist friends will appreciate: **Nerd Moment Activated** *(lean in slightly, gesture playfully towards the academics)*.  

  In nature, a truly honest signal—like a stag’s antlers or that famously cumbersome peacock tail—isn’t just *costly*. It’s *unfakeably wasteful*. It’s a burden only the truly fit can bear. A weak stag *can’t* grow massive antlers; he’d collapse. A sickly peacock *couldn’t* sustain that tail; he’d be eaten. The cost isn’t just money—it’s a physical, biological *handicap* that weeds out the insincere because the cheaters simply can’t afford it. **Nerd Moment Concluded** *(normal posture, broad smile)*.  

  Now, let’s be real: most wedding expenses aren’t Zahavi’s handicap principle in action. A bigger cake or fancier chairs? That’s just… expensive. Anyone with a credit card or generous parents could fake *that* kind of commitment. So where’s the real ‘antler test’ for two people promising forever?  

  It’s not in the *price tag*. It’s in the *price they’ve already paid*.  

  It’s in [Groom] cancelling that guys’ hiking trip because [Bride] had the flu and he spent three days making terrible chicken soup *[insert specific, true, lighthearted example]*. It’s in [Bride] memorizing the rules of [Groom’s obscure hobby] just to understand his passion *[another specific example]*. It’s in the way they’ve given up the easy exits, the solo decisions, the ‘me’ for the ‘us.’  

  That’s the *real*, unfakeable cost. The vulnerability. The daily choice to be truly seen, to compromise, to build a shared life even when it’s inconvenient or scary. *That* is a burden someone who didn’t mean it couldn’t shoulder. A peacock can’t fake a tail that drains his resources. And someone who wasn’t all-in on this marriage? They couldn’t fake the years of small sacrifices, the patience through hard times, the genuine joy they find in each other’s weirdness.  

  *That’s* the proof. Not the flowers that’ll wilt next week, but the roots they’ve already grown together. The roots that took time, effort, and a kind of courage that isn’t for sale.  

  So let’s raise our glasses not just to a beautiful wedding, but to the beautiful, *unfakeable* commitment behind it. To [Groom] and [Bride]: Your real ‘handicap’ is your willingness to carry each other’s burdens, to invest deeply, and to choose each other, day after day. That’s not just biology… that’s love. Cheers!"

  ---

  ### Why This Works
  1.  **Clear Nerd Moment:** Explicitly labeled, contained, and framed with humor ("Nerd Moment Activated/Concluded"). It delivers the core Zahavi concept accurately but briefly.
  2.  **Bridges the Gap:** Immediately follows the nerd moment with "Now, let's be real..." translating the theory into universal human terms (vulnerability, sacrifice, daily choices).
  3.  **Specific Examples:** Crucial! Replaces abstract "cost" with relatable, warm, funny, or touching real moments from their relationship. *This is where the emotional weight lives.*
  4.  **The "Real" Handicap:** Identifies the *unfakeable cost* as the emotional investment, vulnerability, and sacrifice inherent in a genuine partnership – things money *can't* buy and insincerity *can't* sustain.
  5.  **Universal Emotional Payoff:** Focuses on commitment, love, and shared joy. The closing lines ("roots," "choose each other") resonate deeply with everyone, regardless of academic background.
  6.  **Tone:** Warm, affectionate, slightly playful (especially towards the academics), and ultimately deeply sincere. Avoids jargon outside the marked section.
  7.  **Time:** Roughly 4-5 minutes read at a natural pace.

  ### Key Tips for Delivery
  *   **Personalize the Examples:** The placeholder examples *must* be replaced with 2-3 specific, true, and positive stories about the couple. This makes the "real cost" tangible and heartwarming. Choose moments showing care, compromise, or shared joy.
  *   **Know Your Audience:** Nod/smile at the academics during the nerd moment. Maintain eye contact with the families during the emotional parts.
  *   **Pacing:** Pause briefly after the nerd moment label. Let the warm examples land. Build slightly towards the final toast.
  *   **Practice:** Read it aloud several times. Ensure it flows naturally and fits within 5 minutes.

  This toast uses the intellectual hook to elevate a universal truth about love and commitment, making it meaningful for both the behavioral ecologists and the proud parents. Good luck!
