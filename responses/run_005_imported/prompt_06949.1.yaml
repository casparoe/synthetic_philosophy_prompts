  ## MEMORANDUM  
  TO: Academic Integrity Board Members  
  FROM: [Your Name], Elected Student Member  
  DATE: October 26, 2023  
  SUBJECT: Recommendation in Case #AI-2023-78 (First-Year Philosophy Paper / ChatGPT Use)  

  **I. Case Summary**  
  A first-year student submitted a philosophy paper after using ChatGPT to generate a full rough draft, subsequently rewriting approximately 40% of the content. The instructor’s syllabus did not address AI use. The relevant Conduct Code provision (unchanged since 2019) prohibits submitting work not "substantially the product of the student’s own effort" without prior authorization.  

  **II. Core Issue**  
  Whether sanctioning the student under the existing code, absent explicit notice regarding AI-generated content and amid inconsistent departmental practices, satisfies principles of fairness and the rule of law.  

  **III. Analysis: Hart, Fuller, and Fair Notice**  
  This case mirrors the Hart-Fuller debate, forcing us to choose between textual formalism and the moral foundations of legal order.  

  1.  **Hart’s Positivist Approach (The "Core" Argument):**  
      *   Hart would focus on the rule’s plain text. The clause prohibits submitting work not "substantially" the student’s own.  
      *   AI-generated text, even if subsequently edited (here, 40%), originates from an external source. Submitting it as one’s own arguably falls within the "core" meaning of the prohibition.  
      *   Hart might argue that the rule’s *existence* creates an obligation, regardless of whether drafters foresaw AI. The "penumbra" of uncertainty exists at the margins (e.g., "how much editing is enough?"), but generating the *substance* of the draft externally seems central.  
      *   *Board Implication:* Sanctioning is justified under the rule as written. Past drafting failures or inconsistent enforcement do not negate the rule’s current validity.  

  2.  **Fuller’s "Inner Morality of Law" (The Fair Notice Argument):**  
      *   Fuller’s eight desiderata demand laws be clear, non-retroactive, possible to follow, consistent, and stable. **Clarity** and **Congruence** (alignment between declared rule and enforcement) are paramount here.  
      *   The phrase "substantially the product of the student’s own effort" was drafted pre-AI. Its application to AI use is inherently ambiguous. Does "effort" include editing? Does "own" imply *origin* or *final form*?  
      *   **Inconsistent Enforcement/Notice:** The lack of syllabus guidance *combined* with wildly divergent departmental policies (explicit ban vs. explicit allowance) creates a "failure of congruence." The student received no clear, consistent signal about what the rule *required* in this context.  
      *   **Retroactivity Concerns:** Proposing to "quietly tighten" the rule now and apply it retroactively violates Fuller’s core principle against retroactive lawmaking. It fundamentally undermines fairness.  
      *   *Board Implication:* Sanctioning under these conditions applies a rule the student could not reasonably understand governed their conduct. It transforms the rule into a retroactive trap, violating the rule of law itself.  

  **IV. Recommendation & Reasoning: Dismissal Without Sanction**  
  I recommend **dismissing the case without imposing any sanction** on the student.  

  *   **Fuller Has the Better Argument:** While Hart correctly identifies the rule's *potential* textual coverage, Fuller’s focus on the conditions necessary for law to function morally and effectively is decisive here. Sanctioning would violate the principles of **clarity** and **congruence** essential to the "inner morality of law."  
  *   **Fundamental Fairness Deficit:** The student acted in a context devoid of clear notice. The Conduct Code provision, drafted pre-generative AI, used inherently evaluative language ("substantially"). The professor provided no clarification. The department demonstrated starkly inconsistent interpretations. The student could not reasonably discern what "substantially their own effort" prohibited regarding AI. Punishing them for *our* collective failure to update rules and provide clear guidance is unjust.  
  *   **The "Technical Violation" Trap:** Asserting the text "plainly covers" AI use ignores the interpretive leap required. Doing so after the fact, without prior fair notice, renders the rule retroactive in its *practical effect*, even if not in formal amendment. This is precisely the "grudge informer" problem transposed: applying a rule without regard for the fairness of its application undermines law’s legitimacy.  
  *   **Avoiding Retroactivity:** Retroactively tightening the rule is ethically and legally indefensible. It compounds the initial lack of notice with a direct retroactive application.  
  *   **Proportionality & Educational Purpose:** While AI use raises valid academic integrity concerns, dismissal aligns with the Board’s educational mission. It signals that unclear rules will not be weaponized retroactively, while highlighting the urgent need for policy clarity.  

  **V. Proposed Board Action**  
  1.  **Dismiss Case #AI-2023-78 without sanction.**  
  2.  **Issue a Written Reprimand (Educational, Not Disciplinary):** Include a clear statement:  
      *   The Board finds the use of ChatGPT to generate the *substantive draft* of the paper raises serious concerns under the *spirit* of academic integrity.  
      *   Dismissal is based *solely* on the lack of clear notice and consistent institutional guidance regarding AI use at the time of submission.  
      *   Future use of generative AI in this manner, without explicit permission, is likely to violate university policy.  
  3.  **Recommend Immediate Policy Revision:** Refer the Conduct Code clause to the appropriate committee with **mandatory urgency**. The revision must:  
      *   Explicitly address the use of generative AI tools.  
      *   Define key terms (e.g., "substantially," "own effort," "generative AI").  
      *   Establish baseline expectations while allowing instructors flexibility via syllabi.  
      *   Ensure campus-wide communication of the updated policy.  

  **VI. Conclusion**  
  Resolving this case solely on Hartian textual grounds ignores the fundamental requirement of fair notice inherent in a just academic community. Fuller’s insight – that law must function within a framework of procedural fairness to command respect – compels dismissal. This outcome upholds the integrity of the *process* while acknowledging the substantive concerns raised by AI. It allows us to address the underlying policy failure directly and prevent future students from facing similar ambiguity. Sanctioning this student under these circumstances would be a victory of technicality over justice.  

  Respectfully submitted,  
  [Your Name]  
  Elected Student Member, Academic Integrity Board  

  ---  

  **Key Philosophical Takeaway for Your Paper:** This case starkly illustrates the limits of Hart's separation thesis. While conceptually separating "law as it is" from "law as it ought to be" has analytical value, *applying* law in the real world cannot ignore the moral prerequisites Fuller identified. Where a rule's application lacks clarity, consistency, and non-retroactivity – violating the "inner morality" – enforcing it as valid positive law becomes an act of power, not justice. Fuller wins this round on the ground of practical legitimacy. The "better argument" depends on whether one prioritizes formal validity (Hart) or the functional morality enabling law to guide conduct fairly (Fuller). In an educational context committed to fairness, Fuller’s demands are paramount.
