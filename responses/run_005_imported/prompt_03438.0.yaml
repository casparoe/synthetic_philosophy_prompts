  The user mentioned Morton White's objection. White argued that if holism applies, ethical statements should also be answerable via their entanglement with factual claims. For example, "suffering is bad" connects to factual statements about suffering. Quine's reply isn't covered here, but the user's friend claims ethics lacks an external periphery. 

  So, the key is to challenge the idea that ethics has no external input. Even if moral axioms are based on preferences, the application involves empirical facts. Like when deciding if an action causes suffering, that's empirical. So moral judgments aren't just about ends; they're tied to means and factual contexts. 

  Quine might say that ultimate ends are arbitrary, but in practice, moral debates involve factual disagreements. For example, if two cultures disagree on whether a ritual causes harm, that's empirical. Only when all facts agree do you hit the ultimate ends. But how often does that happen? Usually, factual entanglement is significant. 

  Also, Quine's naturalism should question the fact/value dichotomy. If all knowledge is scientific, why exclude ethics? Quine's bifurcation might be inconsistent. His own holism suggests that even non-observational elements in science (like simplicity) are justified pragmatically. Similarly, moral principles could be part of the web, justified by their role in organizing experience. 

  The friend's point about external nature forcing science is valid, but ethics also responds to human experiences. Suffering, needs, etc., are part of the natural world. So why isn't that considered "external"? Quine might see this as internal to human responses, but that's circular. If naturalism includes human nature, then moral sentiments are part of the natural order. 

  In summary, the strongest argument is that Quine's holism and naturalism undermine his own bifurcation. Ethics is entangled with empirical facts, and moral disagreements often reduce to factual ones. Ultimate ends might exist, but they're rarely isolated. Plus, the pragmatic virtues in science (simplicity, conservatism) aren't forced by experience either, yet they're part of science. So why not ethics?
answer: |-
  Here’s the strongest possible argument against your friend’s position, rooted in a consistent application of Quine’s naturalism and holism to expose a tension in his ethical asymmetry:

  ### Core Argument: Quine Undermines His Own Bifurcation by Ignoring the Entanglement of Moral "Tastes" with Natural Facts
  Quine’s disanalogy fails because he artificially isolates "ultimate ends" from the very naturalistic framework he champions. His naturalism demands that *all* human capacities—including moral sentiments—be understood as evolved, biological responses to the world. This collapses the distinction between an "external nature" forcing science and "internal tastes" grounding ethics.

  #### Step 1: Quinean Naturalism Erodes the "Internal/External" Divide
  - **Science’s "External" Periphery is Mediated Biologically**: Quine treats sensory stimuli as the "external" input for science. But crucially, *how* we transduce stimuli into observations is determined by our biological sensory apparatus—an evolved, species-specific "taste" for certain inputs (e.g., visible light wavelengths, audible frequencies). Our scientific web answers to "nature," but only *as filtered through our innate biological biases*.
  - **Ethics’ "Internal" Periphery is Shaped by External Pressures**: Quine grounds ethics in innate "likes and aversions" (e.g., aversion to suffering). Yet these aversions aren’t arbitrary whims; they are evolutionary adaptations sculpted by *external* natural selection. An aversion to suffering promotes survival; a preference for reciprocity enables cooperation. These "tastes" are *responses to the external world*—just as our senses are. Calling them "merely internal" ignores their causal history in a natural, external environment.

  **Conclusion**: Both science and ethics rely on biologically ingrained, world-responsive dispositions. Science’s inputs are no more "external" or "forced" than ethics’; both are biologically mediated interfaces with nature.

  #### Step 2: Holism Ensures Moral Judgments *Are* Indirectly Constrained by Experience
  - **Moral Claims are Embedded in the Web**: Quine concedes moral judgments are entangled with descriptive facts (e.g., "This act causes suffering"). Holism dictates that *any* node in the web can be revised to accommodate recalcitrant experience—including moral nodes. If our moral principle "Suffering is bad" leads to repeated failed predictions *when conjoined* with factual claims (e.g., "Policy X reduces suffering" → but empirical data shows suffering increases), holism permits revising the moral principle itself for greater coherence.
  - **The "Ultimate Ends" Dodge is Empirically Vacuous**: Quine claims ethics "bottoms out" in unjustifiable ends. But *in practice*, we rarely reach bedrock "ultimate ends" in moral disputes. Disagreements almost always involve:
    - **Factual disputes** (Does this ritual *actually* cause harm? Does capitalism *really* maximize welfare?).
    - **Conceptual/logical entanglements** (Is this "suffering"? Is "autonomy" violated here?).
    - **Conflicting empirical predictions** (Will this policy *in fact* promote flourishing?).
    Only when *all* non-moral facts and logic are agreed upon do we hit "taste" differences—a vanishingly rare scenario. Quine elevates this edge case to define ethics’ entire nature.

  **Conclusion**: Moral judgments *are* empirically constrained via their logical ties to the descriptive web. The "ultimate ends" retreat ignores how moral reasoning actually functions in a holistic system.

  #### Step 3: Quine’s Own Epistemic Virtues Undermine the Asymmetry
  - **Science’s Non-Empirical Virtues Mirror Ethics**: Quine accepts virtues like simplicity, conservatism, and fecundity as legitimate (though pragmatic) guides for scientific theory choice. These virtues *are not* "forced by experience." Their justification is instrumental: they help us build useful, coherent webs. Yet Quine grants them "world-guided" status because they contribute to a system that *overall* predicts experience.
  - **Moral Reasoning Relies on Analogous Pragmatic Virtues**: Ethics uses identical virtues: simplicity (e.g., preference for "Do no harm" over convoluted exceptions), conservatism (e.g., preserving established rights), fecundity (e.g., principles generating consistent judgments in new cases). If these virtues are legitimate in science *despite* lacking direct empirical checks, their use in ethics can’t be dismissed as "merely subjective." They serve the same function: organizing our web to better navigate the world (including the social world).

  **Conclusion**: Quine inconsistently allows pragmatic virtues to confer "answerability" in science but denies it to ethics, despite identical epistemic roles.

  ### Addressing Your Friend’s Key Objection
  > *"There is no external 'moral nature'... for a moral web to answer to."*

  **Rebuttal**:  
  This assumes a false dichotomy. For Quine, "nature" isn’t a pre-structured reality; it’s what our best *scientific* web describes. That web *includes* humans as natural entities with biologically grounded sentiments. Therefore:  
  - The "external" constraints on ethics *are* the natural facts about human needs, social dynamics, and the consequences of actions (e.g., suffering destabilizes communities; cooperation enhances survival).  
  - Moral systems *do* answer to this reality: they succeed or fail based on how well they resolve conflicts, promote cooperation, and align with our deepest (biologically rooted) aversions. A moral system ignoring suffering or promoting betrayal would collapse—a "recalcitrant experience" forcing revision, analogous to failed predictions in science.  

  ### Why Quine’s Position is Unstable Within Naturalism
  Quine smuggles in a residual non-naturalism when he treats moral sentiments as *sui generis*, disconnected from the natural world he otherwise describes. A consistent naturalist must see "tastes" as:  
  1. **Causally responsive to nature** (via evolution).  
  2. **Embedded in a holistic web** empirically constrained by their factual entanglements.  
  3. **Guided by pragmatic virtues** identical to those in science.  

  By denying this, Quine inadvertently resurrects the very fact/value dichotomy his holism dismantles elsewhere. Your friend’s defense of Quine’s asymmetry relies on an artificial isolation of moral "tastes" that Quine’s own framework cannot sustain. The burden is on them to explain why biologically evolved responses to social existence count as "merely internal," while biologically evolved responses to photons count as "external" constraints.
