  First, I need to pick a scenario. Vampires are the classic example, but the user suggested alternatives like hive minds, colony ships, etc. A medical procedure for emotional detachment might work well—it's relatable and sci-fi enough. The character could be someone logical, like a philosopher or scientist, to highlight the reasoning struggle.

