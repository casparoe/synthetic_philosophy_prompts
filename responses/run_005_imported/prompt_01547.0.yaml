answer: |-
  You've nailed the central tension in Newton's argument! Your reading is spot-on, and your skepticism about "having it both ways" is precisely the philosophical problem that physicists and philosophers wrestled with for centuries. Let's break down Newton's logic, the problem he identified, and why it's such a "genuine weak spot":

  1.  **Newton's Core Argument (as seen in the bucket):**
      *   **Initial State (Relative Motion, No Concavity):** Bucket & water spin *together* relative to the lab/observer. Water surface is flat. Newton argues this shows relative motion (water vs. bucket) *alone* doesn't cause concavity.
      *   **Intermediate State (Relative Motion, Concavity):** Bucket slows, water keeps spinning *relative to the bucket*. Concavity forms. This is the state everyone expects forces.
      *   **Final State (No Relative Motion, Concavity):** Friction slows the water. Water and bucket are *again* at rest *relative to each other*, but the water surface is *still* concave! This is the key observation.
      *   **Newton's Inference:** The concavity (the "endeavour to recede from the axis") must be caused by the water's motion relative to something *other* than the bucket or the lab walls. That "something" must be **Absolute Space**. The concavity in the *final state* is the physical "readout" proving the water has **true absolute rotation**, even when it has no relative rotation to its immediate container.

  2.  **The Problem You Identified (The Undetectability of Absolute Space):**
      Newton is painfully honest in that last sentence. He admits **Absolute Space itself is fundamentally unobservable**. We can't point to it, measure it directly, or interact with it in any way *except* through its inferred effect on inertial forces (like the centrifugal force causing the concavity). Here's the logical tension:
      *   **Premise 1:** The concavity proves absolute rotation exists.
      *   **Premise 2:** Absolute rotation is defined as rotation relative to Absolute Space.
      *   **Premise 3:** Absolute Space is completely undetectable by any means other than observing the effects of absolute rotation/acceleration.
      *   **Problem:** This becomes **circular reasoning**. *How do we know the concavity proves absolute rotation?* Because absolute rotation is defined relative to Absolute Space. *How do we know Absolute Space exists?* Because we observe effects (like concavity) that we attribute to absolute rotation relative to it. *How do we measure absolute rotation?* By observing the concavity... and so on.

  3.  **Is it a Genuine Weak Spot? ABSOLUTELY.**
      This is precisely why Newton's concept of Absolute Space was so controversial and philosophically unsatisfying:
      *   **Violates "Occam's Razor":** It postulates an invisible, undetectable entity (Absolute Space) to explain observable phenomena (inertial forces).
      *   **Lacks Operational Definition:** Physics thrives on definitions tied to measurements. How do you *measure* velocity relative to Absolute Space? Newton provides no way, only the *effects* of acceleration relative to it.
      *   **Mach's Challenge:** Ernst Mach (in the late 19th century) launched the most famous attack. He argued the concavity wasn't caused by rotation relative to an invisible Absolute Space, but by rotation relative to **the fixed stars** or **the total mass distribution of the universe**. In his view, if you spun the bucket in an *otherwise completely empty universe*, there would be no concavity because there would be nothing to define "rotation" against. The water wouldn't "know" it was spinning. Mach argued inertia itself is a *relational* property arising from a body's interaction with all other mass in the universe. This directly challenged Newton's core premise.

  4.  **How Einstein and General Relativity (GR) Addressed It:**
      Your buddy is right that this problem set the stage for GR, but here's *how* it connects to your question:
      *   **Einstein Agreed with Mach (Partly):** Einstein was deeply influenced by Mach's critique. GR incorporates the idea that **inertia and the behavior of spacetime are influenced by mass and energy**.
      *   **Spacetime, Not Absolute Space:** GR replaces Newton's separate absolute space and absolute time with a unified, dynamic **spacetime**. Spacetime isn't an empty container; its *geometry* is curved by the presence of mass and energy.
      *   **Inertial Frames Defined Locally:** In GR, "straight lines" (geodesics) and inertial motion are defined *locally* by the geometry of spacetime *in that region*, which is determined by nearby mass-energy. There's no global, fixed, invisible grid.
      *   **The Bucket in GR:** The concavity arises because the spinning water is undergoing **absolute acceleration** (in the sense of deviating from a local geodesic path). The "reference" isn't an invisible Absolute Space, but the **local inertial frames** defined by the spacetime geometry *at the location of the bucket*. What determines that geometry? Ultimately, the distribution of *all* the mass and energy in the universe, in line with Mach's principle (though the exact implementation in GR is subtle and still debated).
      *   **Resolving the Undetectability:** The "something" the water is rotating relative to isn't an invisible ether, but the **local structure of spacetime itself**, which *is* a physical entity (it has geometry, curvature, and dynamics) and *is* detectable through its effects (gravity, light bending, time dilation, frame-dragging). GR provides equations to *calculate* this structure based on observable mass/energy distributions.

  **In Summary:**

  *   **You are correct:** Newton's argument *does* rely on inferring an undetectable entity (Absolute Space) from its effects (inertial forces like concavity). This circularity/undetectability is a **major and genuine philosophical and physical weakness** in Newton's framework.
  *   **It's not proof *of* Absolute Space, but proof *against* pure relationalism:** Newton's bucket is powerful evidence that motion isn't *just* relative to nearby visible objects. The concavity in the final state shows *something* absolute is happening. Newton correctly identified a profound problem with purely relative definitions of motion, but his *solution* (Absolute Space) was problematic.
  *   **GR provides a different solution:** It replaces the undetectable Absolute Space with a dynamic, mass-energy-dependent spacetime fabric. The concavity is caused by acceleration relative to *this local spacetime geometry*, which, while complex, is a physical entity grounded in observable matter and energy. This resolved the logical tension Newton couldn't overcome.

  So, your intuition is excellent. Newton brilliantly used the bucket to expose a flaw in simple relational motion, but his proposed fix (Absolute Space) created a new problem (undetectability/circularity) that became a driving force for the development of General Relativity. You've grasped the heart of one of the deepest debates in the history of physics!
