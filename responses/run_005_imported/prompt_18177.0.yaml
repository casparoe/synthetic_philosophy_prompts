  First, I need to understand Harsanyi's aggregation theorem. It states that if a group's preferences over lotteries are transitive, satisfy expected utility axioms, and respect unanimity, then the group's ranking can be represented by maximizing a weighted sum of individuals' utilities. The chair argues that since both a coin flip and the status quo tie-breaker give the same expected utility, they are equivalent. But Diamond's objection is that fairness isn't just about outcomes; it's about the process. Giving equal chances via a lottery is fundamentally different from a rule that might consistently favor one group, even if the expected utility is the same.

  The user mentioned the ex-ante vs. ex-post perspectives. Ex-ante focuses on expected outcomes before the fact, while ex-post looks at actual outcomes after. Harsanyi's theorem is ex-ante, but fairness concerns might require ex-post considerations, like giving each applicant a real opportunity. The status quo rule, based on past awards, might systematically disadvantage newer applicants or those who haven't won recently, even if in expectation it balances out. Over time, this could lead to inequities that a lottery avoids.

  The memo needs to recommend one protocol. The options are:
  1. **Status Quo**: Tie-break based on least recently awarded. Pros: simple, rewards past neglect. Cons: may perpetuate inequities over time.
  2. **Weighted Lottery**: Random selection among tied applicants. Pros: gives equal chances, fair process. Cons: might ignore past fairness efforts.
  3. **Third Option?** Maybe a hybrid? But the user said to recommend one, not call for further study.

  Considering the committee's values: they want fairness and efficiency. The chair's argument is about efficiency (same expected utility), but the dissenter cares about fairness as equal opportunity. The memo should reconcile these. Since the user is in philosophy with a focus on social choice, they might lean towards fairness as process. Diamond's critique is strong here. Also, in grant contexts, ensuring each applicant has a shot might be more important than historical data.

  Potential third option: Could suggest a lottery but weighted by past awards? But the user might want simplicity. The status quo already incorporates past awards, so a lottery would be a clean break. The memo should argue for the lottery as it aligns with procedural fairness.

  Structure the memo:
  1. **Introduction**: State the issue and the two proposals.
  2. **Explain Harsanyi's Theorem**: Simplify it. Use an analogy if possible. Highlight that it shows both methods have the same expected utility.
  3. **Diamond's Objection**: Explain that fairness requires equal chances, not just equal expected outcomes. Use examples: e.g., two equally qualified applicants; a coin flip vs. always picking the one with a certain trait.
  4. **Committee's Role**: Argue that the committee's duty is not just to maximize utility but to ensure fairness. Past awards might correlate with privilege or other factors, so the status quo might inadvertently bias.
  5. **Recommendation**: Advocate for the lottery. It treats applicants equally at the decision point, which is crucial for perceived fairness and trust.
  6. **Counterarguments**: Address the chair's point: while Harsanyi shows equivalence in utility, the committee's role extends to procedural justice. Also, the status quo might discourage new applicants if they feel past winners are favored.
  7. **Conclusion**: Summarize why lottery is better despite Harsanyi.

  Check wider literature: Ex-ante approaches prioritize expected outcomes, which Harsanyi uses. Ex-post fairness looks at actual distribution. In social choice, there's debate on this. For example, in resource allocation, lotteries are often used for ties to ensure fairness. The memo should tie this to the committee's responsibility to each applicant as individuals, not just aggregate utility.

  Final recommendation: Go with the weighted lottery. It's transparent, fair, and avoids potential long-term biases. The memo should clearly state this early on, then explain the reasoning.
answer: |-
  **MEMORANDUM**  
  To: Graduate Research Grant Committee  
  From: [Your Name], PhD Candidate in Philosophy, Student Representative  
  Date: 29 May 2024  
  Subject: Recommendation on Tie-Break Protocol for Grant Awards  

  ### **Introduction**
  This memo addresses the committee’s debate on tie-breaking procedures for grant applications that receive identical composite scores. The status quo favors applicants least recently awarded (or never awarded), while a proposed alternative would implement a weighted lottery among tied proposals. The discussion invoked Harsanyi’s aggregation theorem, which suggests both methods yield identical expected scientific value. I recommend **adopting the weighted lottery** for tie-breaking, effective this cycle. Below, I clarify why Harsanyi’s theorem does not resolve the ethical dispute, present the strongest case for the status quo, and explain why the lottery better aligns with our committee’s responsibilities.  

  ---

  ### **I. Why Harsanyi’s Theorem Does Not Settle the Issue**  
  Harsanyi’s theorem (1955) states that if a group’s preferences over uncertain outcomes (e.g., funding lotteries) are rational (transitive and satisfying expected-utility axioms) and respect unanimous agreement, then the group’s choices can be represented as maximizing a weighted sum of individual members’ utilities. In our context:  
  - **The Chair’s Argument**: Since both a coin flip and the status-quo rule produce identical *expected* scientific value (i.e., the same weighted sum of applicants’ expected contributions), Harsanyi implies they are equivalent. Switching protocols thus appears unnecessary.  
  - **The Core Limitation**: Harsanyi’s framework evaluates outcomes *ex ante* (before uncertainty resolves). It cannot distinguish between two scenarios with identical expected payoffs but different *procedural fairness*. As economist Peter Diamond noted (1967), treating equals equally requires not only equal expected outcomes but also equal *opportunities*. For example:  
    - A lottery gives each tied applicant a 50% chance of funding.  
    - The status quo might award grants based on past receipt (e.g., favoring a less-funded applicant), yielding the same *expected* payoff over time but denying tied applicants equal *access* to the award in the present decision.  
  Harsanyi’s theorem is agnostic to this distinction. It addresses efficiency (aggregate expected value), not fairness (individual rights or process). Thus, it cannot adjudicate between protocols that diverge on equity grounds.  

  ---

  ### **II. The Strongest Case for the Status Quo**  
  The status quo—favoring applicants least recently funded—has principled defenses beyond Harsanyi:  
  1. **Correcting Historical Imbalances**: By prioritizing underrepresented applicants, it promotes distributive justice across cycles. If past awards inadvertently favored certain fields or demographics, this rule mitigates cumulative disadvantage.  
  2. **Incentive Compatibility**: It rewards persistence, encouraging high-quality reapplications from those previously overlooked, potentially strengthening our applicant pool.  
  3. **Pragmatic Efficiency**: It avoids the administrative burden of random draws while leveraging existing data (award history), ensuring decisions are swift and auditable.  
  4. **Ex Ante Equivalence**: As Harsanyi shows, over many cycles, the status quo achieves the same aggregate expected scientific value as a lottery. If our sole goal is maximizing long-term research impact, changing protocols is redundant.  

  This perspective is consistent with welfare economics: if individuals are treated identically in expectation, procedural differences are irrelevant.  

  ---

  ### **III. Why the Weighted Lottery Prevails**  
  Despite these points, the weighted lottery is superior for three reasons:  
  1. **Procedural Fairness Demands Equal Chances, Not Just Equal Expectations**  
     When applications are tied, our scoring declares them *equally deserving at this moment*. Fairness requires symmetric treatment *in the decision itself*, not merely in expectation over time. A lottery guarantees each tied applicant an identical *ex ante* chance (e.g., 1/𝑛 for 𝑛 ties), respecting their equal status. The status quo, by contrast, allocates the entire award based on a secondary factor (past funding) unrelated to the current proposal’s merit. This substitutes a new criterion (historical justice) for our explicit standard (scientific promise), violating the principle that tied scores should resolve neutrally among peers.  

  2. **Avoiding Hidden Biases and Dynamic Distortions**  
     - **Ex Post Inequity**: While the status quo may balance outcomes *ex ante* (in expectation), it risks *ex post* unfairness. For instance, an applicant might lose repeatedly due to bad timing (e.g., applying in high-competition cycles), despite identical merit. A lottery eliminates this path-dependence.  
     - **Strategic Manipulation**: If applicants anticipate the status quo, they may delay applications to “reset” their funding clock, distorting submission patterns. Lotteries are strategy-proof.  
     - **Cognitive Biases**: Reliance on past awards may unconsciously penalize new researchers or non-traditional fields, whereas lotteries are transparently impartial.  

  3. **Alignment with Our Committee’s Role**  
     Our mandate is to fund the most promising science *based on current proposals*. Introducing historical factors (e.g., past awards) conflates distinct evaluations: the status quo assesses applicants, not just proposals. A lottery honors our scoring by treating tied proposals as genuinely interchangeable, preserving the integrity of the review. As Diamond emphasized, a fair process must distinguish between "equal expected value" and "equal opportunity"—the latter being foundational for perceived legitimacy.  

  ---

  ### **IV. Recommendation**  
  I propose we **replace the status-quo tiebreaker with a weighted lottery** for all exact ties on composite scores.  
  - **Implementation**: Among 𝑛 tied proposals, assign each a probability 𝑝 = 1/𝑛, then use a certified random number generator.  
  - **Why Not a Third Option?** Hybrids (e.g., lotteries weighted by past awards) reintroduce the biases above. The weighted lottery is uniquely simple, auditable, and faithful to the principle that ties warrant symmetric treatment.  

  Harsanyi’s theorem shows both protocols are *ex ante* equivalent in scientific value, but it cannot address the ethical imperative for equal chances in tied cases. By adopting the lottery, we uphold fairness without sacrificing efficiency—and affirm that when merit is equal, opportunity should be too.  

  Respectfully submitted for vote.  

  ---  
  **References Implicit in Reasoning**:  
  - Harsanyi, J. C. (1955). Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparisons of Utility.  
  - Diamond, P. (1967). Cardinal Welfare, Individualistic Ethics, and Interpersonal Comparison of Utility: Comment.  
  *(Note: Included for context only; memo avoids direct citation.)*
