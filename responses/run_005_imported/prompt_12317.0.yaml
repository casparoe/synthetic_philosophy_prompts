  Let me structure the argument around Aquinas's own principles. First premise: Legitimate authority exists solely for the common good. Second: A ruler who habitually subverts this becomes a tyrant. Third: Such a ruler's actions are fundamentally lawless. Aquinas himself says authority without justice is just organized violence. 

  Now, the tricky part: Does persistent tyranny void the title? Aquinas might say no—the title itself is formal. But if the authority's moral foundation (common good) is gone, isn't the title now a fiction? Like a firewall with no security—technically there but functionally broken. 

  Also, Aquinas admits usurpers can become legitimate if the community consents. But consent requires the ruler to serve the common good, right? So if a legitimate ruler stops serving it, doesn't that nullify the community's consent? Otherwise, the title becomes a shield for abuse—which contradicts Aquinas's whole framework. 

  The user probably wants this internal critique to expose a tension in Aquinas: his teleological view of authority undermines his formal distinction. I should emphasize how "title without function" is incoherent in his system. And highlight that persistent tyranny makes the ruler a private actor—no different from a usurper—by corrupting the office's essence. 

  Wait, but Aquinas worries about anarchy if private individuals can depose rulers. Valid concern. But if the ruler is already acting as a private oppressor, isn't removing them more like stopping a criminal than political rebellion? Aquinas's own analogy of killing a robber might apply here. 

  Final angle: The community's role. If the ruler betrays the common good, the community retains authority—but what if it's powerless? Aquinas might say "wait for public process," but when that's impossible, his distinction could trap people under tyranny. That seems inconsistent with his prioritization of the common good. 

