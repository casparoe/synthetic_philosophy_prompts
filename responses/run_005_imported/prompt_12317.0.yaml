answer: |-
  Here is the strongest internal critique of Aquinas's distinction between usurping and legitimate tyrants, built solely from his own premises about authority, the common good, and the nature of tyranny:

  ### The Argument: Teleology Collapses the Formal Title Distinction

  1.  **Aquinas's Foundational Premise: Authority Exists for the Common Good.**
      Aquinas unambiguously teaches that the *raison d'être* of political authority is the achievement and preservation of the common good (e.g., *De Regno*, I.1; *Summa Theologica* I-II, Q. 90, A. 2; I-II, Q. 96, A. 4). Legitimacy is inherently teleological – it is derived from and contingent upon this purpose. A ruler's "title" is not a magical incantation; it is a formal recognition of their role in serving this end.

  2.  **Aquinas's Definition of Tyranny: Rule Against the Common Good.**
      Aquinas defines a tyrant precisely as one who rules *for their own private advantage* rather than the common good (*De Regno*, I.3; *Summa Theologica* II-II, Q. 42, A. 2, ad 3). Persistence in this perversion is the essence of tyranny. The moral deformity lies in the *action* and its *purpose*, not merely the lack of an initial parchment.

  3.  **The Tyrant's Action Nullifies the Moral Basis of Title.**
      When a ruler with a formal title persistently rules for private advantage and against the common good, they fundamentally violate the *moral condition* upon which their legitimacy rests. The title was granted *for the sake of the common good*. By systematically destroying that good, the ruler severs the moral link between the formal title and the authority it is meant to signify. The title becomes an empty shell, a legal fiction devoid of its justifying moral foundation. As Aquinas himself implies, authority divorced from justice is mere brigandage (*Summa Theologica* I-II, Q. 96, A. 4: "Remove justice, and what are kingdoms but gangs of criminals on a large scale?").

  4.  **The Functional Equivalence of the Usurper and the Ruling Tyrant.**
      *   **The Usurper:** Has no formal title. Rules for private advantage against the common good. Therefore, possesses *no legitimate authority*.
      *   **The Ruling Tyrant:** Possesses a formal title *but persistently rules for private advantage against the common good*. By violating the sole purpose justifying their title, they functionally *abdicate their legitimate authority*. Their actions reduce them to the same moral status as the usurper: a private individual wielding unjust power *against* the community.

  5.  **The "Public Authority" Dilemma: Who Acts When the Tyrant *Is* the Authority?**
      Aquinas reserves action against a legitimate-but-tyrannical ruler for "public authority" – the community or the superior who appointed him. However, this presents a critical problem *on Aquinas's own terms*:
      *   The tyrant *is* the established public authority. They actively subvert and control the mechanisms of that authority.
      *   The "community" as an organized body capable of public action *ceases to exist* under sustained tyranny, as the tyrant deliberately fragments and suppresses it to maintain power (*De Regno*, I.3-4).
      *   The "superior" who appointed the ruler (e.g., an emperor appointing a king) may be absent, indifferent, or colluding with the tyrant.
      Aquinas's solution relies on a functional public authority *external* to the tyrant, precisely when tyranny ensures such an authority *cannot functionally exist*. His distinction thus creates a perverse paradox: the *more completely* a legitimate ruler becomes a tyrant (destroying the public sphere needed to act against him), the *more inviolable* he becomes according to Aquinas's rule.

  6.  **The Community's Retained Authority: A Premise Undermining the Distinction.**
      Aquinas acknowledges that political authority ultimately resides in the community, which entrusts it to a ruler (*De Regno*, I.6; implied in discussions of just laws representing the common good). When a ruler, regardless of initial title, persistently betrays this trust by destroying the common good, they forfeit the authority entrusted to them. The community, as the source of authority, retains the inherent right to revoke that authority when its condition (service to the common good) is violated. Insisting that only "public authority" can act against the tyrant ignores that the tyrant has *destroyed* that public authority *in practice*, and that the community's *inherent* authority cannot be permanently alienated, especially when the purpose of the grant is destroyed. A private citizen acting against such a tyrant, when no public mechanism exists, can be seen as an agent of the community's latent, fundamental authority resisting its destroyer.

  7.  **Conclusion: The Collapse of the Distinction on Teleological Grounds.**
      Aquinas's formal distinction between a usurper (no title) and a tyrant with title ultimately fails because it prioritizes the *formal origin* of authority over its *teleological function*. On his own core principles:
      *   Legitimacy is defined by service to the common good.
      *   Tyranny is defined by persistent rule against the common good.
      *   Therefore, a ruler who *persistently* rules tyrannically *ceases to be a legitimate authority*, regardless of their initial title. They become functionally identical to a usurper – a private individual wielding unjust force against the community.
      The "title" becomes irrelevant once the moral purpose that alone justified its existence is systematically obliterated by the ruler's actions. The line collapses because Aquinas's own definition of tyranny and his teleological view of authority render the tyrant's formal title morally void. Insisting on the distinction in the face of persistent tyranny risks making the formal title a shield for the very evil it was meant to prevent, contradicting the foundational purpose of political authority as Aquinas himself defines it.
