answer: |-
  To understand Hobbes's stubborn confidence in his flawed geometric proofs—particularly his circle-squaring—we must examine his **epistemology** (theory of knowledge) and **philosophy of language**, which grounded his faith in geometry and rejection of algebra. His stance wasn't mere obstinacy but a logical extension of his core principles.

  ### 1. **Hobbes's View of Geometrical Certainty: Foundations in Nominalism and Construction**
     - **Nominalism and Definitions:**  
       Hobbes was a strict nominalist: words are arbitrary signs for mental concepts ("names"), which themselves arise from sensory experience. **Certainty** emerges only when we *define* these names precisely and then *deduce* consequences through logical operations. Geometry exemplified this because:
       - **Definitions are grounded in sense experience:** Geometric entities (points, lines, circles) are defined by how they can be *constructed* from physical motions (e.g., a line as the trace of a moving point).  
       - **Proofs are causal constructions:** Geometrical truth isn't abstract; it’s demonstrated by *physically constructing* figures with compass and straightedge. For Hobbes, "to know" meant "to cause" (*scientia est causarum cognitio*). If you could construct a figure satisfying a definition (e.g., a square equal in area to a circle), you had proven its possibility.
       - **No room for error:** Once definitions are agreed upon, deductions follow with mechanical necessity, like arithmetic: "For 'Reason' ... is nothing but reckoning."  
     
     - **Contrast with Empirical Sciences:**  
       Physics or politics lacked geometry’s certainty because their definitions (e.g., "motion," "justice") were contested or derived from unreliable senses. Geometry alone built complex truths from indubitable first principles via unbroken chains of deduction.

  ### 2. **Hobbes's Rejection of Wallis's Algebra: Symbols vs. Substances**
     Hobbes despised symbolic algebra (as advanced by Wallis and Descartes) because it violated his criteria for true knowledge:
     - **Empty Symbolism:** Algebra manipulated signs (e.g., √2, ∞) without grounding them in conceivable constructions. To Hobbes, Wallis's use of infinitesimals or irrationals was "scab of symbols" – meaningless marks detached from physical intuition.  
     - **Lack of Causal Clarity:** Algebraic proofs resolved equations without revealing *how* entities were generated. For Hobbes, solving x²=2 by "x=√2" was tautological; it didn’t *construct* the solution. Only a compass-and-straightedge construction could demonstrate *causal possibility*.  
     - **Danger of Abstraction:** Algebra treated magnitudes abstractly, detached from material bodies. Hobbes’s materialism demanded all knowledge reduce to bodies in motion. Geometry met this; algebra’s "imaginary numbers" or "infinitesimals" were metaphysical nonsense.

  ### 3. **Why Hobbes Believed He Squared the Circle: The Illusion of Construction**
     Hobbes’s "proofs" followed his geometric ideal. He would:
     - **Define** the circle and square via mechanical motions.
     - **Construct** a sequence of figures (often involving convoluted curves or neusis), claiming each step followed deductively from definitions.
     - **Assert certainty** because the process felt tangible – he could *visualize* the motions and intersections.  

     When Wallis refuted him using algebra or limits, Hobbes dismissed it:
     - Wallis’s symbols were "marks upon paper" with no real referents (*De Corpore*, 1655).
     - Algebraic disproofs didn’t engage with Hobbes’s constructive process; they bypassed the causal chain he valued.  
     - To Hobbes, Wallis’s methods were sophistry, while his own work embodied true "civil philosophy" – knowledge built like a commonwealth, brick by brick from agreed foundations.

  ### 4. **Defiance as Philosophical Consistency**
     Hobbes’s refusal to concede was a defense of his entire system:
     - **Epistemological Necessity:** Accepting Wallis’s critique meant admitting geometry *could* be uncertain – undermining Hobbes’s model for ethics/politics. If geometric truth wasn’t absolute, how could Leviathan’s laws be?  
     - **Self-Consistency Trap:** Hobbes’s method *defined* truth as what follows from clear definitions. Since his circle-squaring *logically* followed *his* definitions, rejecting it would invalidate his own criterion for truth.  
     - **Materialist Pride:** For Hobbes, algebra’s success was a cultural pathology – a retreat from the tangible world into empty formalism. Holding fast to constructive geometry was a stand for "true philosophy."

  ### Conclusion: Certainty as a Double-Edged Sword
  Hobbes’s geometric fixation was inseparable from his philosophy. His certainty came from conflating **logical deduction** with **physical constructibility**, and his rejection of algebra stemmed from a materialist theory of meaning. When his constructions failed, he couldn’t blame his method without collapsing his system. Thus, his defiance was less mathematical incompetence than **epistemological stubbornness** – a tragic fidelity to principles that made geometry certain yet blinded him to its limits. In this light, Hobbes’s circle-squaring isn’t a footnote of folly but a parable about the price of demanding absolute certainty from human knowledge.
