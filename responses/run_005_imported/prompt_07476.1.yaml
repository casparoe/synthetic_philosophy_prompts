  I recall Bertrand's paradox shows how different "natural" ways to generate random chords (endpoints, midpoint, perpendicular distance) yield different probabilities for the chord being longer than the triangle's side. The classical principle of indifference fails because it depends on how we describe the sample space. 

  Jaynes' brilliance was reframing it: since the problem doesn't specify size/location, solutions must be invariant under translation, rotation and scaling. This uniquely gives 1/2 probability. But is this just indifference in disguise? 

  Key differences stand out: 
  - Classical indifference is syntactic (apply to whatever parameters are given)
  - Jaynes is semantic (derive symmetries from the problem's physical meaning)
  - Indifference is passive (assign equal probabilities)
  - Invariance is active (demand mathematical consistency)

  The user wants to know if this is epistemology (same idea fixed) or metaphysics (new foundation). I think it's the latter - Jaynes shifts from descriptive symmetry to prescriptive physical constraints. 

  For objective priors... that's thorny. Jaynes shows some problems have privileged solutions via invariance, but many don't. The description-relativity problem persists. Perhaps objectivity exists only for problems with sufficient symmetry. 

  The user seems ready for nuanced discussion - they used "secretly relative" suggesting awareness of conventionalist critiques. I should emphasize how invariance handles Bertrand while conceding its limitations. Might mention how this connects to modern objective Bayesianism versus subjectivist positions.
answer: |-
  Jaynes's invariance requirement is **not merely a repaired version of the classical principle of indifference** but a **substantively different justificatory principle** that supersedes naive indifference. While both share a superficial appeal to symmetry, their foundations, scope, and implications diverge fundamentally—especially in hard cases like Bertrand's paradox. I defend this as follows:

  ### 1. **Classical Indifference vs. Jaynesian Invariance: Core Differences**  
     - **Classical Indifference**: Assigns equal probability to "indistinguishable" outcomes based on an *arbitrary choice of description* (e.g., parameterizing chords by endpoints, midpoints, or angles). It is purely **syntactic**, relying on how the problem is formulated.  
       - *Flaw*: In Bertrand’s paradox, it yields contradictory probabilities (1/2, 1/3, 1/4) because "indistinguishability" depends on the chosen variable (e.g., arc length vs. Cartesian coordinates).  

     - **Jaynesian Invariance**: Demands that probabilities be *unchanged under transformations corresponding to the problem’s ignorance*. For Bertrand, since the circle’s size/position are unspecified, probabilities must be invariant under:  
       - **Translation** (position),  
       - **Rotation** (orientation),  
       - **Scale** (size).  
       This is **semantic**, deriving symmetries from the *physical meaning* of the problem, not its mathematical description.  
       - *Resolution*: Only the "midpoint method" (probability = 1/2) satisfies all three invariances.  

  ### 2. **Divergence in Justificatory Principles**  
     - **Indifference** is **epistemic**: "Treat symmetrically what *seems* symmetric." It is subjective, relying on the analyst’s choice of variables.  
     - **Invariance** is **ontological**: "Respect the symmetries *inherent in reality*." Jaynes roots it in the problem’s *physical context*—e.g., a chord’s length is a measurable property unaffected by moving/rescaling the circle.  
       - *Key Insight*: Invariance fixes indifference’s arbitrariness by tying symmetry to *actionable ignorance* (e.g., "I don’t know the circle’s size" → scale invariance).  

  ### 3. **Implications for "Objective" Priors**  
     Jaynes’s approach implies that **objectivity is conditional**:  
     - **When invariance works** (e.g., Bertrand, location-scale problems), it delivers unique "objective" priors. These are *not* absolute but grounded in problem-specific symmetries.  
     - **When invariance fails** (e.g., problems lacking symmetry groups), no unique prior exists.  
       - *Example*: Assigning a prior to a coin’s bias *p* has no scale/translation symmetry, so Jaynes uses maximum entropy (subject to constraints), not invariance.  

     This reveals that **all principles of indifference are relative to a description**, but Jaynes replaces *subjective descriptions* with *objective transformations*:  
     - Classical indifference: Relative to *parameterization*.  
     - Jaynesian invariance: Relative to *physically meaningful symmetries*.  

  ### Conclusion: Relativity Persists, but Anchored  
  Jaynes’s invariance rescues objectivity *only* for problems with nontrivial symmetry groups. In such cases, it is superior to naive indifference because it extracts symmetries from the problem’s physical essence, not linguistic framing. However, it concedes that **truly universal "objective" priors are impossible**—objectivity emerges only when ignorance manifests as mathematical invariance. Thus, every prior depends *implicitly* on a choice of relevant symmetries (e.g., scale matters for chords but not for coin biases). Jaynes doesn’t eliminate description-relativity; he elevates it from arbitrary variables to empirically defensible transformations. In this light, probability is "objective" only when our ignorance is symmetric.
