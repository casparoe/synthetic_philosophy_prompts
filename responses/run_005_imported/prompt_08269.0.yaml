  ok so this argument happened at my school's cs club last week and its been living in my head since. we'd just watched a video about whether AI could ever really think, and it got into the godel argument against AI (the lucas-penrose thing). it was between two people in the club, Jonah and Leah, and it went something like this:

  (1) Jonah said that for any consistent formal system F thats strong enough to do arithmetic, godel showed theres a sentence G thats true but which F can't prove -- and that we can just see G is true, so our minds cant just BE some formal system/computer program, since we can do something no formal system can do.

  (2) Leah said hold on, what you can actually prove is "if F is consistent then G is true," not G outright -- to get G outright you gotta already know F is consistent, and godel's SECOND theorem says a consistent system can't prove its own consistency. so hes smuggling in a huge assumption he has no right to.

  (3) Jonah said fine, but he does know hes consistent, since he's never once believed an actual contradiction -- so that assumption is earned, not smuggled.

  (4) Leah said thats not good enough. you can't just introspect your way into knowing your consistent, and if his reasoning really were equivalent to some consistent formal system, that very system couldn't prove its own consistency -- so "i just know im consistent" is either an assumption with zero backing, or, if it actually counted as a real proof, evidence somethings wrong.

