  Now the modern twist: eternal inflation theories suggest a multiverse with infinite spacetime volume. But crucially, unlike Boltzmann's model, the vacuum energy dominates over thermal radiation. This matters because Boltzmann's fluctuation rates depended on thermal equilibrium, while de Sitter space has radically different thermodynamics. I should emphasize that distinction - it's where the math diverges.

