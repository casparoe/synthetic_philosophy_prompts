  Now, non-Euclidean geometries. The user mentions dropping the parallel postulate and getting consistent systems. How would Hobbes react? He might see these as different constructions based on altered motions. For example, hyperbolic geometry could arise from motions on a curved surface. Since he valued kinematic generation, he might accept these as valid if they can be constructed physically. But he'd probably dismiss purely abstract versions that can't be built, insisting on tangible motion.

  Then there's Hilbert's formalism, where points and lines are just placeholders defined by axioms. This is the bigger challenge. Hobbes rejected undefined terms and demanded definitions showing how objects are made. Hilbert's approach removes the constructive aspect entirely. Hobbes would hate that. To him, axioms must be demonstrated through construction, not just assumed. Without kinematic generation, geometry loses its certainty, becoming mere symbol manipulation—like Wallis's "scab of symbols."

  The user wants to avoid the "Hobbes as crank" take, so I need to engage seriously with his philosophy. They’re interested in whether his maker's knowledge can adapt. The answer is mixed: maybe for non-Euclidean if constructible, but not for formalism. His need for physical construction clashes with abstract math. Also, the user might be exploring the limits of constructivist epistemology in math. Underlying this is a deeper question about the nature of mathematical certainty and how historical philosophies interact with modern developments. I should highlight that tension without reducing Hobbes to a caricature.
answer: |-
  That's a brilliantly nuanced framing of Hobbes' geometric philosophy! Moving beyond the "stubborn crank" narrative to engage with his core epistemological commitment – **maker's knowledge (*scientia operativa*)** – is essential. Hobbes grounded geometric certainty not in abstract Platonic forms or logical deduction alone, but in the **physical act of construction through idealized motion.** Let's dissect how this might grapple with non-Euclidean geometry and Hilbertian formalism:

  1.  **Non-Euclidean Geometry: Alternate Constructions in Alternate Worlds?**
      *   **Hobbes' Potential Interpretation:** He *might* have accommodated non-Euclidean geometries, *but only if* they could be framed as descriptions of **kinematically constructed objects within a different material framework.**
          *   **"Curved Space" as Constructed Motion:** Imagine Hobbes encountering Gauss or Riemann. He might argue that hyperbolic or elliptic geometries aren't "pure" geometry in the sense of constructions in an ideal, rigid, Euclidean void, but rather descriptions of constructions *on* or *within* a different kind of physical surface or medium generated by motion. Drawing geodesics on a saddle or sphere involves the motion of a point constrained by that surface – a *different kind* of kinematic generation.
          *   **Consistency as Evidence of Constructibility:** The internal consistency of non-Euclidean systems wouldn't be the *primary* source of validity for Hobbes (that came from construction). However, he might see consistency as *suggestive* that such systems *could* correspond to *some* conceivable kinematic construction process in a different physical context. "If the symbols describe relations that hold without contradiction," he might ponder, "then perhaps there exists *some* motion that generates figures obeying these relations, even if not on my flat drafting table."
          *   **The Sticking Point: The Nature of Space:** The core challenge is Hobbes' likely **implicit commitment to Euclidean space as the fundamental, absolute, physically real arena for construction.** His "motion of a point" generating a line presupposes a flat, uniform, infinite background space. Non-Euclidean geometries challenge this *absolute* nature. He might dismiss them as ingenious mathematical fictions describing relations *on curved bodies* within Euclidean space, rather than describing the fundamental nature of space *itself*. Accepting that space itself could be non-Euclidean would require abandoning the idea that his specific kinematic constructions in Euclidean space defined the *only* possible foundation for true geometric knowledge.

  2.  **Hilbert's Formalism: The Ultimate Betrayal of *Scientia Operativa***
      *   **Hobbes' Certain Rejection:** This is where Hobbes' philosophy would hit a brick wall. Hilbert's approach represents the near-total inversion of everything Hobbes believed geometry *was*.
          *   **The Scab Thickens:** "Points," "lines," and "planes" becoming mere undefined terms defined implicitly by their relations in axioms? This would be the ultimate "scab of symbols" for Hobbes. It completely severs geometry from its foundation in **physically imaginable, kinematically generated constructions.** Symbols are now manipulating other symbols based on arbitrary (though consistent) rules, devoid of any necessary connection to the motion of bodies.
          *   **The Death of Definition:** Hobbes railed against Euclid's definitions for lacking constructive power. Hilbert dispensing with definitions *altogether* in favor of implicit axiomatic characterization would be anathema. For Hobbes, you *must* define a point as "that which is generated by a single instantaneous location" and a line as "the trace left by a moving point" to have real knowledge. Without this kinematic genesis, the terms are empty.
          *   **Axioms as Arbitrary vs. Demonstrable:** Hobbes believed axioms (like "two points determine a line") *could* and *should* be demonstrated from the constructive definitions (e.g., the unique path traced by moving a point from A to B). Hilbert's view that axioms are starting points whose truth lies in consistency alone removes the very possibility of this demonstrative foundation in construction. Axioms become rules of a game, not descriptions of necessary truths derived from the act of making.
          *   **Certainty Lost:** The certainty of geometry, for Hobbes, stemmed directly from our role as makers: we know the properties of the circle *because* we know the process of rotating a line segment. Formalist geometry's certainty rests solely on logical consistency within an abstract system. Hobbes would see this as abandoning the *real* source of geometric truth – the physical/kinematic act – for a shadow play of symbols. It transforms geometry from *natural philosophy* (knowledge of the world we manipulate) into *logic* or *linguistics*.

  **Synthesis: Can Maker's Knowledge Absorb These Developments?**

  *   **Non-Euclidean Geometry: Tentative, Conditional Acceptance.** Yes, *if* it can be reframed as the kinematics of construction *within* or *upon* a specific type of physical body or constrained medium (like a sphere or pseudosphere). The certainty would then derive from the construction within *that* medium. It becomes a different branch of *scientia operativa*, not replacing Euclidean geometry as the description of fundamental space, but supplementing it as the geometry *of curved surfaces*. He would likely reject the idea that these geometries describe fundamental, absolute space itself.
  *   **Hilbertian Formalism: Incompatible Rejection.** No. This severs the essential link between geometric knowledge and the kinesthetic, constructive act. It replaces the certainty born of making with the certainty born of symbolic consistency. For Hobbes, this would not be geometry at all; it would be a formal system *about* geometric-sounding terms, lacking the essential foundation in physical generation. It embodies the very "scab of symbols" he despised in Wallis, elevated to a foundational principle.

  **Conclusion:**

  Hobbes' philosophy of geometry, centered on maker's knowledge through kinematic construction, is **fundamentally tied to a specific, physically grounded, Euclidean picture of space as the arena for action.** While it possesses a certain robustness that *might* allow it to *describe* non-Euclidean relations as constructions *on objects within* Euclidean space, it cannot easily accommodate the idea of fundamentally non-Euclidean space itself. More critically, it is **utterly incompatible** with the formalist turn represented by Hilbert.

  **Hilbert's formalism doesn't just wreck Hobbes' specific picture; it destroys the very engine of geometric certainty Hobbes identified.** For Hobbes, geometry *is* the science of figures generated by motion in real (Euclidean) space. Take away the necessity of that constructive motion in that space, and you take away the *scientia*. The developments of the 19th and early 20th centuries ultimately vindicated Wallis's algebraic and abstract approach over Hobbes' insistence on purely constructive, kinematic foundations for all mathematical certainty. Hobbes' philosophy, fascinating and internally coherent as it is, remains anchored to a pre-modern understanding of space and the nature of mathematical objects. To accept the full implications of non-Euclidean geometry and formalism would require abandoning the core tenet that geometric truth *must* be grounded in the physical act of making lines by moving points in a void. His "weirder and more specific" view was ultimately too rigid to survive the conceptual revolutions to come.
