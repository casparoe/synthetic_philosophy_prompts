  First, I need to recall the core problem: under Humean supervenience, chance depends on the entire pattern of events in spacetime. This creates a situation where a chance hypothesis might assign positive probability to futures that would, if actual, make that hypothesis false—these are "undermining futures." The user understands the abstract concept but struggles to see why this is a genuine problem rather than just a curiosity.

  Hmm, the key here is to demonstrate how this leads to inconsistency when applying the Principal Principle. The Principal Principle says rational credence should match known objective chance, but if the chance itself could be undermined by possible futures it assigns positive probability to, we get a conflict. 

  I should start with a simple coin example. Imagine a biased coin with a 0.7 chance of heads. But under Humean supervenience, this chance isn't primitive—it supervenes on the entire history of coin flips. So if we consider a future where, say, 70% of flips are tails (which contradicts the 0.7 heads hypothesis), that future has positive probability according to the very hypothesis it would falsify. 

  Ah, and here's where the Principal Principle causes trouble. If I know the chance is 0.7, I should assign 0.7 credence to heads. But if I also consider that this very future (with mostly tails) might happen—and that future would mean the chance wasn't really 0.7—then my credence assignment becomes inconsistent. Conditionalization fails because the evidence about the chance itself depends on future outcomes.

  For the New Principle, I need to show how conditioning on both history and chance together avoids this. Instead of saying "credence should match chance given history," Lewis says "match the chance conditional on the chance being true." In the coin case, this means considering only futures consistent with the 0.7 hypothesis when setting credence. 

  But I should also mention why some critics think this is cheating—it essentially defines the problem away by restricting consideration to non-undermining futures. And that might feel circular or like it misses the original Humean intuition. 

  The user seems frustrated with seminar debates that didn't resolve this, so clarity is crucial. I'll avoid heavy notation and focus on the coin example throughout. They need to see the conflict concretely, then understand the New Principle as a patch, and finally grasp why philosophers still argue about whether it's a real solution. 

  Also, their tone suggests they're intellectually engaged but wary of heated discussions—so I'll keep explanations calm and precise, naming each conceptual move (e.g., "here's the inconsistency," "here's Lewis's fix," "here's the lingering worry"). That way they can re-enter the seminar with a structured understanding.
answer: |-
  Let's break down the "big bad bug" and why it's a genuine problem for the Principal Principle (PP) under Humean Supervenience (HS), using a concrete example. I'll then explain Lewis's New Principle (NP) and the lingering concerns. Imagine a **biased coin** with a true objective chance of *Heads* being **0.7**. This is hypothesis **Ch**.

  ### The Setup: Humean Supervenience & Undermining
  1.  **Humean Supervenience (HS):** Chances aren't fundamental. The chance `Ch(A) = x` supervenes entirely on the *total pattern of particular events* throughout all of spacetime (the "Humean mosaic"). The chance of Heads being 0.7 *means* that in the complete global pattern of all coin flips (past, present, and future), 70% of them *are* Heads. The chance is a summary of the pattern.
  2.  **The Undermining Future:** Consider a very specific, very long future sequence of coin flips starting now, call it `F-undermine`. Suppose `F-undermine` contains *exactly* 50% Heads. According to HS:
      *   If `F-undermine` *were* to happen, then the *global* pattern (past + `F-undermine`) would **not** contain 70% Heads overall.
      *   Therefore, if `F-undermine` happens, the true chance hypothesis `Ch` (Heads = 0.7) is **false**.
  3.  **Positive Chance:** Crucially, the hypothesis `Ch` itself (Heads = 0.7) assigns a **positive objective chance** to `F-undermine` occurring. It's an extremely tiny chance (since 50% Heads is very unlikely if the true frequency is 70%), but it's **greater than zero**. `Ch(F-undermine) > 0`.

  ### The Problem: Principal Principle + Admissibility = Contradiction?
  Now, put yourself at time `t0`, *before* any of the flips in `F-undermine` happen. You know the *current* chance hypothesis `Ch` (Heads=0.7). You also know the complete history of the world up to `t0`, `H_t0`. Crucially, `H_t0` is consistent with `Ch` being true (e.g., the past flips show roughly 70% Heads). You have no other evidence *yet* about the flips in `F-undermine`.

  The Principal Principle (PP) says your rational credence in any proposition `A`, conditional on `Ch` and `H_t0` (and no other *inadmissible* evidence), should equal the chance `Ch` assigns to `A`:
      `Cr(A | Ch & H_t0) = Ch(A)`   *(Basic PP)*

  **Apply PP to `F-undermine`:**
      `Cr(F-undermine | Ch & H_t0) = Ch(F-undermine) > 0`
  This seems fine. You rationally assign a tiny positive credence to `F-undermine` happening, matching the tiny positive chance it has according to `Ch`.

  **The Contradiction:** Now consider the proposition **`~Ch`** (that the chance hypothesis `Ch` is false). What should your credence in `~Ch` be, conditional on `Ch` and `H_t0`? Intuitively, it should be **ZERO**. You *know* `Ch` is true! So:
      `Cr(~Ch | Ch & H_t0) = 0`   *(Certainty of Known Chance)*

  **But here's the rub:** `F-undermine` **entails** `~Ch`. If `F-undermine` happens, then by HS, the global pattern isn't 70% Heads, so `Ch` is false. Therefore:
      `F-undermine ⇒ ~Ch`

  This logical connection creates a conflict:
  1.  **PP Implication:** `Cr(F-undermine | Ch & H_t0) > 0` (from PP applied to `F-undermine`)
  2.  **Entailment:** `Cr(F-undermine | Ch & H_t0) ≤ Cr(~Ch | Ch & H_t0)` (Because if F-undermine is true, ~Ch must be true)
  3.  **Certainty Intuition:** `Cr(~Ch | Ch & H_t0) = 0` (Because you condition on Ch being true)
  4.  **Contradiction:** (1) & (2) imply `Cr(~Ch | Ch & H_t0) > 0`, but (3) says it must be `0`.

  **Why "Admissibility" Doesn't Save PP (Initially):** Lewis originally thought the concept of "admissible evidence" might block this. Evidence about the future is usually inadmissible. But here's the catch: `F-undermine` *is* a proposition about the *future*. However, PP, as stated, applies when conditioning *only* on `Ch` and `H_t0`. `H_t0` is admissible (it's past history). `Ch` is the chance hypothesis itself – surely *it* must be admissible? If we declare `Ch` inadmissible to block the inference to `F-undermine`, PP becomes useless – we could never actually use our knowledge of the chance! So `Ch` *must* be admissible. This forces the contradiction. PP tells you to assign positive credence to something (`F-undermine`) that entails the falsity of what you're conditioning on (`Ch`).

  **Why Conditionalization Struggles:** Imagine you start at `t0` with credences obeying PP. You have positive credence in `F-undermine` (as PP requires). Now, suppose `F-undermine` *actually starts to happen*. As you observe more and more tails (heading towards 50%), you need to update via conditionalization. But according to PP + HS:
  *   Your initial credence was based on `Ch` (Heads=0.7).
  *   Observing a sequence strongly indicative of Heads=0.5 should make you doubt `Ch`.
  *   However, HS says that *if* the full future `F-undermine` happens, `Ch` *is* false. But PP, as applied initially, seems to tie your credence too rigidly to `Ch` even as evidence comes in that `Ch` might be false *because* of the undermining future unfolding. The tension is between updating on the unexpected frequencies (which suggest a different chance) and the initial PP constraint based on `Ch`.

  ### Lewis's New Principle (NP): Blocking the Bug
  Lewis's solution, the New Principle, changes the way credence relates to chance. Instead of equating credence directly with `Ch(A)`, it equates credence with `Ch(A | T)`, where `T` is the "**truth**" proposition – the complete Humean mosaic (the entire global pattern of particular facts).

  Since we never know `T`, Lewis approximates it. We know `H_t0` (history to `t0`) and we know the *chance theory* `Ch` itself. Crucially, `Ch` entails that the true global pattern `T` must be one where the pattern *makes* `Ch` true. So, NP says:

      `Cr(A | Ch & H_t0) = Ch(A | T)`

  But since `T` is unknown, we use the fact that `Ch` *constrains* what `T` can be. `Ch` says "`T` is a world where the global frequency of Heads is 70%". So NP becomes:

      `Cr(A | Ch & H_t0) = Ch(A | Ch)`

  **Interpretation:** Your rational credence in `A`, given the chance hypothesis `Ch` and history `H_t0`, should equal the chance that `Ch` *itself* assigns to `A`, **conditional on `Ch` being the true chance hypothesis** (i.e., conditional on the global pattern `T` being one that makes `Ch` true).

  **How NP Fixes the Coin Example:**
  1.  **What is `Ch(F-undermine | Ch)`?** This is the chance, *according to Ch*, of `F-undermine` happening, *given that `Ch` is the true chance hypothesis*. But if `Ch` is true, then the global pattern *does* have 70% Heads. `F-undermine` is a future sequence leading to only 50% Heads globally. Therefore, `F-undermine` is **incompatible** with `Ch` being true! If `Ch` is true, `F-undermine` *cannot* happen. So:
      `Ch(F-undermine | Ch) = 0`
  2.  **Apply NP:**
      `Cr(F-undermine | Ch & H_t0) = Ch(F-undermine | Ch) = 0`
  3.  **No Contradiction:** NP tells you to assign **credence 0** to `F-undermine` (and any other future that would make `Ch` false), given that you know `Ch`. This perfectly matches the "Certainty Intuition": `Cr(~Ch | Ch & H_t0) = 0`. The entailment `F-undermine ⇒ ~Ch` is still true, but NP ensures `Cr(F-undermine | Ch & H_t0) = 0`, so it doesn't force `Cr(~Ch | Ch & H_t0) > 0`.

  NP effectively restricts the chance hypothesis `Ch` to only consider futures that are *consistent* with `Ch` itself being true. It defines chances only over the "non-undermining" possibilities.

  ### Why Some Think NP Only Relocates the Problem (The "Expert" Intuition)

  Critics argue NP solves the *formal* contradiction but loses the core *intuition* behind the original PP and the nature of chance under HS. Here's the concern:

  1.  **The "Guide" Intuition:** The original PP captured the idea that **chance is an expert**. If you know the chance of `A` is `x`, and you have no "inside information" (only admissible evidence), you should defer to the chance and set your credence to `x`. Chance is your best guide to the truth about `A`.
  2.  **NP's "Self-Limiting" Expert:** Under NP, the "expert" (`Ch`) only gives you advice *after* you've told it, "Oh, by the way, we're assuming you are the true expert." This seems circular. The expert is only an expert *conditional on itself being correct*. As Ned Hall put it, it's like asking a weather forecaster for the chance of rain, but only *after* telling them "Assume whatever forecast you are about to give is 100% accurate." Their forecast loses its independent authority.
  3.  **Loss of Intuitive Guide:** In the coin example, intuitively, knowing `Ch(Heads)=0.7` *should* make you set `Cr(Heads) = 0.7`. NP, however, says `Cr(Heads | Ch & H_t0) = Ch(Heads | Ch)`. What is `Ch(Heads | Ch)`? It's the chance of Heads *given that the global frequency is 70% Heads*. This is **not necessarily 0.7**! It depends on how `Ch` models frequencies within the constraint of the global frequency. Lewis argued that for reasonable chance theories, `Ch(Heads | Ch) ≈ Ch(Heads) = 0.7`, so NP approximates PP in ordinary cases. But critics point out:
      *   This approximation isn't guaranteed by the formalism of NP + HS. It requires additional assumptions about how chances are defined within the Humean framework.
      *   The *direct* expert intuition ("Set credence to the known chance value") is replaced by a more complex rule ("Set credence to the known chance *conditional on itself being true*"), which only *coincidentally* often equals the known chance value. The direct normative force of the known chance seems weakened or lost.
  4.  **The Relocated Problem:** The problem isn't a formal contradiction anymore. Instead, it's that NP arguably **severs the direct, intuitive link between known chance and rational credence** that made PP so compelling in the first place. The "bug" is "fixed" by modifying the principle to accommodate HS, but the cost is that the principle no longer straightforwardly captures the original idea that chance is our best guide when we know it. The tension between chance as a guide and chance as supervenient on the pattern remains, manifesting now as a worry about whether NP truly preserves the normative authority of chance.

  **In Summary:**

  1.  **The Bug (PP + HS):** HS allows chances to assign positive probability to futures (`F-undermine`) that would make the chance hypothesis false. PP, treating the chance hypothesis itself as admissible, forces you to assign positive credence to these undermining futures *even while knowing the chance is true*, leading to `Cr(Undermining) > 0` but `Cr(Ch false) = 0`, which is impossible if Undermining entails Ch is false.
  2.  **The New Principle (NP):** Solves the contradiction by setting credence equal to the chance *conditional on the chance hypothesis itself being true*. This assigns credence 0 to undermining futures (since they are incompatible with the known chance being true), avoiding the contradiction.
  3.  **The Lingering Concern:** Critics argue NP abandons the core "expert" intuition of PP. Chance under NP is only an expert *conditional on its own truth*, making its advice seem circular and potentially severing the direct, intuitive link ("set credence equal to the known chance") that made PP compelling. The problem isn't inconsistency anymore, but whether NP truly captures what we *mean* by chance being a guide to credence, especially within the HS framework that caused the problem in the first place.

  The debate often hinges on whether one views NP as a necessary refinement preserving the spirit of PP under HS, or as a concession that HS fundamentally alters the relationship between chance and rational belief in a way that weakens chance's normative authority. Your seminar's heat is understandable – it cuts to the heart of what chance *is* and how it should guide us!
