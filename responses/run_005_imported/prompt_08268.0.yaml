answer: |-
  Here's a precise comparison of pragmatic encroachment (PE) and epistemic contextualism (EC), followed by an analysis of your lab technician case, demonstrating their divergence and why their disagreement is substantive, not merely verbal.

  **Core Tenets & What Fixes "Knows" Standards:**

  1.  **Epistemic Contextualism (Lewis, Cohen, DeRose):**
      *   **Core Claim:** The word "knows" (and its cognates) is **context-sensitive**. Its semantic content, and thus the **truth-conditions** of knowledge attributions ("S knows that p"), vary depending on the **conversational context of the attributor**.
      *   **What Fixes Standards:** The **stakes, purposes, presuppositions, and salience of error possibilities** within the **attributor's** conversational context. When the attributor's context makes certain possibilities salient or raises the stakes of being wrong, the standards for correctly applying "knows" rise. "Knows" functions analogously to indexicals ("I", "here", "now") or gradable adjectives ("tall", "flat") – its extension depends on features of the context of utterance.
      *   **Subject's Situation:** The subject's *own* practical situation is **irrelevant** to the *truth-conditions* of an attribution *about* them. It might be relevant to whether they *meet* the standards set by *their own* context when they self-ascribe knowledge, but not to the truth of attributions made by others in different contexts.
      *   **Invariantism:** PE rejects *strict* invariantism. EC is a form of *semantic* contextualism, often contrasted with *metaphysical* invariantism (like PE).

  2.  **Pragmatic Encroachment (Hawthorne, Stanley, Fantl & McGrath):**
      *   **Core Claim:** Whether a subject **S knows that p** at a time depends not only on S's *epistemic* position (evidence, reliability, etc.) regarding p, but also on **S's own practical situation** – specifically, the **stakes or practical interests** S has *at that time* concerning whether p. Higher stakes require a stronger epistemic position to count as knowledge.
      *   **What Fixes Standards:** The **subject's own practical interests and stakes** concerning the proposition p *at the time of the putative knowledge state*. The standards for knowledge are **sensitive to the subject's practical context**.
      *   **Attributor's Context:** The attributor's conversational context is **irrelevant** to the *truth-value* of the knowledge attribution *about the subject*. It might influence whether the attributor *chooses to say* "S knows that p" (e.g., for pragmatic reasons, like caution), but it doesn't change the underlying fact of whether S *does* know. Knowledge itself is a subject-sensitive state.
      *   **Invariantism:** PE is a form of **subject-sensitive invariantism** or **interest-relative invariantism**. The *relation* of knowing is invariant (it's always a relation between a subject, a proposition, and the subject's epistemic position *relative to their practical interests*), but its *application* varies with the subject's interests. It rejects the *insulation* of knowledge from practical factors.

  **Analysis of the Lab Technician Case:**

  *   **The Technician's Own Knowledge State:**
      *   **PE:** The technician has ordinary evidence she relies on daily. Crucially, *her own stakes* are low – she thinks it's routine, nothing rides on it for her, and she has no reason to suspect otherwise. Therefore, **she *does* know** the result is negative. Her low stakes mean her ordinary evidence suffices.
      *   **EC:** The technician is in a low-stakes context herself. The standards governing *her own* potential self-attribution of knowledge ("I know it's negative") are low. Her ordinary evidence meets these low standards. Therefore, **she *does* know** (relative to her own context). *(Note: Both agree she knows relative to her own context/stakes here).*

  *   **The Low-Stakes Attributor (Curious Discussant):**
      *   **PE:** This attributor is assessing whether the technician *knew* at the time. As established by PE, the technician *did* know (because *her* stakes were low). The attributor's own low stakes don't affect the *truth* about the technician's past knowledge state. Therefore, **"She knew it was negative" is TRUE.**
      *   **EC:** The attributor is in a low-stakes context (curiosity, no practical implications). The standards governing *their* use of "knows" in *this* conversation are low. The technician easily met these low standards at the time with her evidence. Therefore, **"She knew it was negative" is TRUE.** *(Both agree the low-stakes attribution is true).*

  *   **The High-Stakes Attributor (Deciding Whether to Act):**
      *   **PE:** This attributor is assessing whether the technician *knew* at the time. As established by PE, the technician *did* know (because *her* stakes were low). The attributor's current high stakes *do not* change the fact about the technician's past knowledge state. Therefore, **"She knew it was negative" is TRUE.** However, PE emphasizes that *acting* solely on the technician's say-so might be unjustified *for the attributor* because *their* stakes are high. They might correctly say, "She knew, but I need more evidence *for me* to act on this given what's at stake for *me*." Knowledge is one thing; the justification for *action* based on that knowledge is another, sensitive to the *agent's* stakes.
      *   **EC:** The attributor is in a *high-stakes context* – they must decide whether to act solely on the technician's report, and much rides on it. This context makes salient the possibility of technician error and raises the standards for correctly applying "knows" *in this attributor's conversation*. The technician, acting in a low-stakes context with ordinary evidence, *did not* meet *these* high standards. Therefore, **"She knew it was negative" is FALSE** *as uttered in this high-stakes attributor's context*. The EC theorist might say, "In this serious context where so much depends on it, we can't truly say she *knew*; she just had good evidence for a routine task."

  **The Crucial Divergence:**

  The disagreement becomes clear in the **high-stakes attributor's claim**:
  *   **PE:** "She knew" is **TRUE** (technician's low stakes fix her knowledge). The high-stakes attributor must acknowledge this fact but qualifies the actionability *for them*.
  *   **EC:** "She knew" is **FALSE** (attributor's high-stakes context sets demanding standards the technician didn't meet).

  **Is the Disagreement Substantive or Merely Verbal?**

  It is **substantive**. Here's why:

  1.  **Different Truthmakers:** The theories posit fundamentally different facts as making knowledge attributions true or false.
      *   For EC, the truthmaker for "A says 'S knows p'" involves facts about *A's* conversational context *plus* facts about S's epistemic position relative to *that* context.
      *   For PE, the truthmaker involves facts about *S's* epistemic position relative to *S's own* practical situation *at the time*, irrespective of A's context. A's context only affects whether stating the fact is prudent or relevant, not the fact itself.
  2.  **Metaphysics vs. Semantics:** EC is primarily a *semantic* thesis about the word "knows." PE is primarily a *metaphysical* or *epistemological* thesis about the *nature* of the knowledge *relation* itself – it claims practical factors are constitutive of knowledge states.
  3.  **The High-Stakes Attributor's Dilemma:** The case forces a choice. *Either*:
      *   The high-stakes attributor speaks falsely when they say "She knew" because their context demands higher standards than the subject met (EC), *or*
      *   The high-stakes attributor speaks truly when they say "She knew," but must recognize that this knowledge is insufficient justification for *their own* high-stakes action (PE).
      These are incompatible descriptions of the *same utterance* in the *same situation*. EC locates the normative pressure in the semantics of "knows," while PE locates it in the link between knowledge and practical reasoning/action.
  4.  **Predictions About Reality:** The theories make different predictions about what is *actually the case* regarding the technician's cognitive state at the time, independently of who is talking about it. PE says she *possessed knowledge* (a subject-sensitive fact). EC says whether she "possessed knowledge" simpliciter is an ill-formed question; she met the standards of her context but not others. EC denies that there is a single, context-independent knowledge state that the high-stakes attributor is either correctly or incorrectly describing; PE asserts that there is.
  5.  **The "Same Intuitions" Argument:** While both theories accommodate the *surface* intuition ("We're reluctant to say 'she knows' in high-stakes attributor contexts"), they offer *radically different explanations* for *why* we are reluctant:
      *   EC: Because in high-stakes contexts, "knows" expresses a different, harder-to-achieve relation. Our reluctance reflects semantic correctness.
      *   PE: Because while "she knows" might be *true*, asserting it could be misleading or irresponsible in high-stakes contexts where emphasizing the *need for more evidence for action* is paramount. Our reluctance reflects a pragmatic norm about assertion/action, not semantic falsity.

  **Conclusion:**

  Your friend is correct that PE and EC were both motivated by similar patterns of intuitive judgments about knowledge attributions, particularly sensitivity to stakes. However, your lab technician case, especially the assessment by the high-stakes attributor, successfully pulls them apart. They posit fundamentally different mechanisms: EC locates the variation in the meaning of the word "knows" across attributor contexts, while PE locates the variation in the knowledge relation itself, fixed by the subject's practical situation. This leads to a direct conflict over the truth-value of the high-stakes attributor's claim "She knew." Since they disagree on what constitutes the *fact of the matter* about the technician's epistemic state and on what makes knowledge attributions true, the disagreement is substantive, concerning the metaphysics of knowledge and the semantics of "knows," not merely a choice of vocabulary.
