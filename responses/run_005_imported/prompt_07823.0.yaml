prompt: |-
  So I've been kind of obsessed with the "what actually makes an experience a conscious one, instead of just information your brain is quietly processing" question for about a year now, ever since a friend of mine had an anesthesia awareness thing happen to him during surgery and it sent me down a total rabbit hole. I never studied any of this in school, I just read papers and half understand them at like midnight, but I ended up starting this tiny podcast (maybe 40 listeners lol) where I talk to people about consciousness stuff, and next weeks guest has spent her whole career defending a higher-order theory of consciousness - the idea that what makes a mental state a consciously-experienced one isn't anything intrinsic to the state itself, its that there's a separate, roughly simultaneous "higher-order thought" representing you as being in that state.

  I don't want to just lob her the questions she's answered a thousand times before ("so what even is a higher order thought"). Can you draft me like 8 to 10 real interview questions, each with a short follow-up that calls out the move I bet she'll make to wriggle out of it? I especially want one on the "targetless" higher-order thought problem - where the higher-order thought misfires and represents you as being in pain when you're actually not in that state at all, which seems to mean the whole felt quality is coming from the higher-order thought rather than whatever it's supposedly about, so why do we even need two separate states in the first place - and one on the regress problem, where the standard fix is that the higher-order thought itself is usually unconscious, and I want to push on whether an unconscious representation can really "light up" another state without being lit up itself, or whether that's just relocating the mystery rather than solving it.

  I also want one that gets into the neuroscience side, since from what I've read some of the brain-damage and "no-report" experiment evidence seems to cut against tying consciousness to higher-order machinery sitting in frontal cortex specifically, and I want her pinned down on what that evidence would have to look like before she'd count it against her view, rather than just a reason to say the higher-order thought lives somewhere else in the brain. And I want one on animals and babies, because it seems like her view has the genuinely awkward consequence that creatures without much conceptual sophistication might not be phenomenally conscious in the relevant sense, and I want to see her actually wrestle with that instead of just saying a dog probably has some "simpler" version of it. Whatever order you put the rest in, end on a question that just flat out asks her what it would take, in principle, for her to abandon the theory rather than patch it.
