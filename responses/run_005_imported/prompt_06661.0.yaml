answer: |-
  Here’s a toast that honors your sister’s world, uses the costly signal theory meaningfully, satisfies the biologists, and remains warm and accessible for Grandma – all in about 4 minutes:

  ---

  **(Clink glass gently)** Family, friends, colleagues... and especially [Sister's Name] and [Fiancé's Name]. It’s my absolute honor to stand up here today.

  Now, anyone who knows my sister knows her mind is a fascinating place. Growing up, while I was figuring out how to beat the next level of Sonic, she was figuring out why ants marched in lines or why birds sang at dawn. And her journey led her deep into the world of behavioral ecology – the study of why animals, including us, do what we do. **(Light chuckle, glance at sister)** Which means, [Sister's Name], I’ve spent the last decade trying to keep up! I’ve read about peacock tails, fiddler crab claws, and yes, even why gazelles do that funny stiff-legged jump – stotting – right in front of a lion instead of just running.

  Turns out, it’s a signal. A costly one. It’s saying, "Look how strong and fast I am, predator! I can afford this risky jump *because* I’m strong and fast. Catch me if you can!" The cost proves it’s honest. Cheap talk is easy; real proof comes when something valuable is on the line. **(Nod towards Fiancé)** And [Fiancé's Name], your own brilliant work dug into exactly this – how costly signals build trust.

  **(Pause, shift tone slightly more earnest)** Now, when [Sister's Name] asked me to give this toast, I thought about all the wonderful, heartfelt things you *always* hear at weddings. "They're perfect for each other!" "Look how happy he is!" "Their love is so obvious!" And all of that is absolutely true tonight. **(Smile warmly at the couple)** But... **(small, knowing smile towards the scientists)**... I also knew that in a room full of people who study signals for a living, some of you might be thinking, "Well, that's nice, but words are cheap. Where's the *evidence*?" **(Light chuckle, hopefully shared by the biologists)**

  And you know what? You’d be right. Words *are* cheap. Affection is wonderful, but how do we *know* it’s the deep, enduring kind? The theory tells us we look for the cost. The investment. The signal that couldn't be faked by someone who wasn't truly committed.

  **(Lean in slightly, more intimate tone)** So, let me tell you about a signal [Fiancé's Name] sent, loud and clear, about three years ago. [Sister's Name] and [Fiancé's Name] were weathering the brutal marathon of academia – long distance, demanding fieldwork on different continents. The strain was real. The future felt uncertain. It was one of those crunch times relationships either survive... or don't.

  That’s when [Fiancé's Name] faced a choice. A truly excellent postdoctoral opportunity came his way – the kind that could have set a glittering trajectory for his career. But it would have meant more separation, more strain, likely the end of them being in the same place for years. The alternative? A postdoc position here, in [Sister's City]. It was... objectively less prestigious. A step down, career-wise, from that other offer. A cost. A real one.

  **(Look directly at Fiancé)** And [Fiancé's Name], you chose. You chose [Sister's Name]. You chose *them*. You turned down the shinier path, the easier career win, and took the harder, less glamorous route *here*, because being near her, making *this* work, was worth more. You didn't just *say* she was your priority; you *proved* it. With something that genuinely cost you.

  **(Turn to the room)** Now, for the experts in the room – and I *have* been doing my homework – **(brief, acknowledging glance towards Fiancé's advisor/lab)** this isn't just about runaway preferences where something gets arbitrarily attractive. This is about an *honest* signal. A Zahavian handicap. The cost incurred *is* the proof of quality – the proof of commitment. It separates the truly dedicated from... well, the ones who just talk a good game. And [Fiancé's Name], your choice back then was a stotting leap of faith if ever I saw one. It was costly, it was risky, and it screamed, "This is real. I'm all in."

  **(Shift focus back to the couple, warmth flooding back)** But for everyone here, especially Grandma **(smile warmly towards Grandma)**, what this story *really* means is simple: [Fiancé's Name] loves [Sister's Name] with a depth that goes beyond words. He proved it when it mattered most, not with grand gestures under spotlight, but with a quiet, difficult decision made in the trenches of real life. He chose *her*. He chose *them*. And that choice, that costly, honest signal, laid the unshakeable foundation for the love and joy we celebrate today.

  So, let's raise our glasses. To [Sister's Name] and [Fiancé's Name]! May your life together be filled with endless curiosity, profound understanding, and a love that never needs to signal its strength... because its honest proof is written in every choice you make for each other, every single day. Cheers!

  ---

  **Why this works:**

  1.  **Costly Signal as the Core Evidence:** The postdoc story is explicitly framed as the costly, honest signal that validates all the sentimental assertions. It's not just an anecdote; it's the *proof* the toast hinges on.
  2.  **Addresses the Scientific Audience:** It directly names Zahavi, mentions the handicap principle, uses the term "honest signal," and explicitly contrasts it with Fisherian runaway ("this isn't just about runaway preferences...") in a way biologists will recognize and appreciate, *without* derailing the toast into a lecture.
  3.  **Accessible to All:** The gazelle analogy is simple and vivid. The core message – "he proved his love with a real sacrifice" – is crystal clear for non-scientists. Grandma understands sacrifice and commitment perfectly.
  4.  **Warmth and Sentiment:** The sentimental language ("perfect for each other," "look how happy") is still there, but it's presented as the *conclusion* drawn from the evidence, not the foundation. The focus on his choice *for her* is deeply romantic.
  5.  **Structure & Flow:** Starts warm, introduces the science lightly, poses the "problem" of cheap talk, presents the costly signal as the solution/evidence, briefly nods to the scientific distinction for the experts, then pivots back fully to warmth and celebration. The "stotting leap of faith" line ties it back neatly.
  6.  **Respectful & Celebrates the Couple:** It celebrates the fiancé's sacrifice and commitment without making him sound like a martyr. It honors your sister's field and her partner's expertise. It ends on a genuinely loving and hopeful note.
  7.  **Timing:** This script, delivered at a natural pace with pauses for smiles and reactions, should land comfortably around 4 minutes.

  **Delivery Tips:**

  *   **Know Your Lines:** Be comfortable enough to make eye contact, especially with your sister, her fiancé, and key guests.
  *   **Pace:** Don't rush the scientific bits, but don't labor over them either. Let the warmth dominate the beginning and end.
  *   **Tone:** Keep it sincere, slightly conversational, with moments of warmth and the occasional light, knowing smile (especially when addressing the "experts in the room").
  *   **The Nod:** The Fisherian runaway mention is quick – "this isn't just about runaway preferences where something gets arbitrarily attractive." That's enough. Biologists will get it. Move on.
  *   **The Story:** Tell the postdoc story simply but clearly, emphasizing the *cost* (better position, career trajectory) and the *choice* (her, them, the relationship).

  This toast uses the science not as a gimmick, but as the authentic lens through which you, as her brother who *tried* to understand her world, can genuinely express the depth of their commitment. Good luck!
