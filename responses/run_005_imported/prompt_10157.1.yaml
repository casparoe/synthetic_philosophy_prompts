prompt: |-
  As a novelist, I'm drawn to philosophical thought experiments that already read like parables, and I keep returning to the "wrong kind of reasons" problem that besets buck-passing accounts of value -- T. M. Scanlon's idea that to be good is just to have properties that provide reasons for certain favorable attitudes or responses. The trouble, pressed by critics such as Rabinowicz and Rønnow-Rasmussen, is that a demon's threat to harm you unless you manage to feel real admiration for something contemptible gives you a reason to admire it without making it one bit more admirable. Write me a short story, roughly 1,200 words, that takes this structure seriously as narrative rather than puzzle: a character is offered something they desperately want, on condition that they actually come to hold some attitude -- love, reverence, moral approval -- toward a person or object that plainly doesn't merit it. Stay with the mechanics of manufacturing the attitude on command: whether it can be done at all, what it costs if it can, and whether the gap between feeling and object stays visible from inside even after apparent success. Don't let any character state the philosophical distinction outright; the dilemma should live in what they do, not in what they say.
reasoning: |-
  Okay, the user is a novelist looking for a short story that explores the philosophical problem of "wrong kind of reasons" in value theory, specifically through a narrative lens. They want a character who must manufacture an attitude (love, reverence, approval) toward an unworthy object/person to gain something desperately desired, with focus on the internal mechanics and costs of such emotional engineering.

  Hmm, the challenge here is translating abstract philosophy into visceral human experience without explicit exposition. The demon threat example is perfect - it creates immediate stakes while embodying the core paradox. The user clearly understands the theory but wants it breathed into life. 

  Noticing they emphasize three key elements: the manufacturing process itself (can it even be done?), the hidden costs, and whether the emotional-object gap remains perceptible post-success. This suggests psychological realism is crucial. The character's struggle should feel raw and embodied, not cerebral.

  *scribbles notes* Possible angles: 
  - The more genuine the desired feeling, the harder to fake (love vs politeness) 
  - Self-deception as violent act against one's own judgment 
  - The "success" being hollow because the reason for feeling corrupts the feeling itself 

  Ah! What if the character succeeds technically but the victory tastes like ash? That honors the philosophy while delivering narrative payoff. The demon's bargain should highlight how external reasons (threats/bribes) can't create real value - only distort behavior.

  *mental image forms* A sculptor who must genuinely worship her own mediocre work to save her child. Perfect - the artistic ego makes the self-betrayal acute. The "gap" they mention becomes literal: the statue's flaws vs forced reverence. 

  Key scenes taking shape:
  1. The demon's offer (clear stakes: sick child vs artistic integrity)
  2. Desperate attempts to manufacture awe (physical rituals, sensory overload)
  3. Breakdown when hollow mimicry fails 
  4. The horrifying "solution": chemically lobotomize her own taste
  5. Pyrrhic victory - child saved, artist dead inside

  Must avoid:
  - Philosophical jargon ("buck-passing account" etc)
  - Making the demon cartoonish (he's bureaucracy incarnate)
  - Resolution that cheats the dilemma (e.g., statue magically becomes good)

  The ending should sit in that terrible gray zone: Did she succeed? Technically yes. But the reverence is now neurological, not aesthetic - a biological accident. The gap isn't just visible; it's wired into her trembling hands. That's the haunting note.

  *checks wordcount* 1200 words means ruthless efficiency. Every sentence must serve the paradox. The scalpel cuts deep precisely because it's small.
