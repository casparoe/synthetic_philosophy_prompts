prompt: |-
  So I spent thirty-five years running a molecular biology lab before I retired, and now they've got me on the university's research integrity committee. Current case: the core imaging data behind Figure 3 of a well-cited paper from the lab can't be reproduced -- a grad student building on it went back to the raw files and the numbers don't match whats published. The postdoc who generated the data left research years ago and wont answer emails. The two remaining co-authors, still faculty here, say they simply trusted her the way you'd trust any careful colleague you'd known for a decade, no red flags at the time, and shouldn't be held responsible for data they never personally generated or checked. A few younger members want a blanket rule instead: nobody may ever rely on a co-author's word about data alone, no matter how trusted, without an independent check. Funnily enough I've been reading about this exact fight in epistemology over testimony lately -- whether trusting what someone tells you is its own basic source of justification, or whether it only really counts once you can cash it out in evidence you could've checked yourself -- and I can't settle that even in the abstract, let alone here. Could you draft the memo I'll circulate before next week's meeting? I need an actual recommendation -- clear them, find them at fault, or something in between -- with a concrete timeframe, plus a call on what the policy should be going forward, and it has to take the "reasonable reliance on a trusted colleague" side seriously, because if that's never enough I don't see how any collaborative lab ever gets anything done.
reasoning: |-
  Okay, the user is a retired molecular biology lab director now serving on a research integrity committee. They're dealing with a tricky case involving irreproducible data from a well-cited paper. The core issue is whether co-authors should be held responsible for data they didn't personally generate or verify, especially when the primary data generator (a former postdoc) is unresponsive. 

  Hmm, this is fascinating because it intersects with epistemology - the user mentioned the testimony vs evidence debate. They're clearly well-read and want a balanced solution that doesn't paralyze collaboration. The tension is real: if we demand 100% verification, science becomes impossible; but blind trust enables fraud. 

  Let me break this down. First, the immediate case: the two faculty co-authors claim they reasonably trusted their decade-long colleague. The user needs to recommend: clear them, fault them, or something intermediate. Then there's the policy question - should "trusted colleague" reliance ever suffice? 

  *Scratches head* The faculty aren't blameless. Even in collaborative labs, PI-level co-authors have supervisory responsibility. They didn't need to re-run experiments, but should've ensured raw data was properly archived and accessible. That's basic research stewardship. 

  For the policy... *paces mentally* We can't demand independent verification for every datapoint - that's unsustainable. But we can't endorse blanket trust either. The answer might lie in tiered verification: high-stakes findings (like here, a well-cited core figure) need more scrutiny than supplementary data. 

  *Pauses* The user's right to worry about collaboration. Good science runs on trust - but verified trust. Maybe we borrow from quality systems: spot checks, not 100% audits. And crucially, fix the data archiving so verification is possible later. 

  *Nods* The memo should: 
  1) Find the faculty negligent for poor data stewardship (but not fraudulent) 
  2) Mandate data archiving fixes 
  3) Propose a smart verification policy - trust plus spot checks for key claims 
  4) Give them 90 days to rectify 

  That honors both epistemology camps: testimony as default, but verifiable evidence as backup. The user'll appreciate that nuance. 
  *Starts drafting*
answer: |-
  ## Memorandum: Research Integrity Committee  
  **To:** Committee Members  
  **From:** [Your Name], Chair, Research Integrity Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendation Regarding Figure 3 Data Integrity (Paper: [Paper Title/DOI]), and Proposed Policy Framework  

  ### I. Case Summary & Findings  
  After thorough review of the irreproducibility concerns regarding Figure 3 in [Paper Title], we conclude the following:  

  1.  **No Evidence of Intentional Misconduct:** There is no indication that the original postdoc (data generator) or co-authors deliberately falsified data.  
  2.  **Failure of Data Stewardship:** The core issue is **inadequate data curation and verification**, not malice. Raw data files were not archived in a manner enabling independent validation, and published results cannot be reconciled with the located raw files.  
  3.  **Co-Author Responsibility:** While it is reasonable for collaborators to trust diligent colleagues, **senior co-authors (especially PIs) bear ultimate responsibility for the integrity of published work from their lab.** Reliance on trust does not absolve oversight regarding data management and reproducibility safeguards.  
  4.  **Mitigating Factor:** The postdoc’s decade-long record of reliability makes the co-authors' initial trust understandable.  

  **Recommendation for Current Authors:**  
  *   **Finding:** The faculty co-authors **failed in their duty of data stewardship** but acted without intent to deceive.  
  *   **Action:**  
      *   **Correction Required:** The authors must submit a formal Correction to the journal within **90 days**, detailing the irreproducibility of Figure 3 based on the raw data, clarifying its limitations, and committing to re-analysis where possible.  
      *   **Data Audit:** The authors must archive ALL remaining raw data underlying the paper (including Figure 3) in a university-approved, publicly accessible repository within **60 days**, with a detailed metadata log.  
      *   **No Further Sanctions:** Given the historical context and lack of bad faith, no retraction or personnel sanctions are recommended *if these actions are completed*.  

  ### II. Proposed Policy: "Reasonable Reliance & Verification in Collaborative Research"  
  Rejecting both blind trust and paralyzing verification demands, we propose a **risk-based, tiered approach** to co-author reliance:  

  1.  **Foundational Principle:**  
      *   **"Trust, but Verify Strategically":** Reasonable reliance on trusted colleagues is essential for collaboration. However, *all authors share responsibility for ensuring data underlying key claims is verifiable.*  

  2.  **Core Safeguards (Mandatory for ALL Publications):**  
      *   **Robust Data Archiving:** All raw data and analysis scripts supporting *central findings* (especially figures/tables) must be archived *at submission* in a FAIR-aligned (Findable, Accessible, Interoperable, Reusable) repository with immutable timestamps. *This is non-negotiable.*  
      *   **Explicit Data Provenance:** Authorship statements must specify *who generated/analyzed each key dataset* and *who verified its integrity/archiving*.  
      *   **PI/Faculty Co-Author Oversight:** Senior authors (PIs, faculty) must confirm they have:  
          (a) Reviewed the *experimental design* and *analysis plan* for key results,  
          (b) Ensured compliance with archiving policy,  
          (c) Addressed any significant anomalies raised during internal review.  

  3.  **Verification Tiers (Beyond Archiving):**  
      *   **Tier 1 (Routine):** Trust-based acceptance of data from highly trusted, long-term collaborators on well-established methods is sufficient *provided archiving is flawless*.  
      *   **Tier 2 (Targeted Verification REQUIRED):** Independent verification *must* occur for:  
          *   **Novel/Pivotal Findings:** Results central to the paper's main claim or representing a significant new discovery.  
          *   **High-Risk Data:** Technically complex assays, subjective analyses (e.g., image quantification), or results countering established models.  
          *   **New Collaborators:** Data from collaborators without an established track record within the team/lab.  
          *   **Any Result Exhibiting Anomalies:** During peer review or internal lab discussion.  
      *   **Verification Methods:** Can range from independent re-analysis of raw data, partial replication, cross-validation with alternative methods, or technical review by a designated lab member *not involved in generation*. The PI/senior author must document *how* verification was performed.  

  4.  **Lab-Level Implementation:**  
      *   Each PI must establish a lab-specific SOP defining:  
          *   What constitutes a "key finding" requiring Tier 2 verification.  
          *   Acceptable verification methods for different data types.  
          *   Roles/responsibilities for data generation, archiving, and verification.  
          *   Training requirements for all lab members.  
      *   SOPs must be submitted to the Research Integrity Office annually.  

  ### III. Rationale: Balancing Epistemology & Praxis  
  *   **Justified Reliance on Testimony:** Science is inherently social. Demanding every author personally replicate every dataset is epistemologically unsound and operationally impossible. Trust in competent, honest colleagues *is* a fundamental source of justification.  
  *   **The Necessity of Scaffolding:** Trust alone is insufficient. Justification *requires* mechanisms (archiving, targeted verification, clear provenance) that make trust *warranted* and *verifiable after the fact*. Archiving transforms testimony into evidence accessible to the community.  
  *   **Preserving Collaboration:** This policy avoids mandating universal distrust. It focuses verification where it matters most (novel, pivotal, or risky claims) while mandating the infrastructure (archiving) that makes trust viable long-term. PIs remain accountable for ensuring this scaffold exists.  

  ### IV. Call to Action  
  1.  **Vote:** Approve the recommended actions for the current case ([Paper Title]) and the proposed "Reasonable Reliance & Verification" policy framework.  
  2.  **Implementation Timeline:**  
      *   Policy finalized and disseminated: **30 days** (pending vote).  
      *   Lab SOPs due to RIO: **120 days** after policy effective date.  
      *   Archiving compliance mandatory for new submissions: **180 days** after policy effective date.  

  This approach upholds rigor without destroying the collaborative fabric of science. It acknowledges trust while demanding the structures that make trust scientifically credible.  

  **Attachments:**  
  *   Draft Correction Notice (for [Paper Title])  
  *   FAIR Data Archiving Resources  
  *   Template for Lab Verification SOP  

  ---  
  **Signature:**  
  [Your Name]  
  Chair, Research Integrity Committee
