answer: |-
  You've hit on a fundamental concept in gambling and investing: **Positive Expected Value (EV) is necessary for long-term profit, but it's *not sufficient* for determining optimal bet sizing.** Your friend is making a classic mistake by ignoring **Risk of Ruin (RoR)** and **the non-linear utility of money**.

  Here's the breakdown:

  1.  **The Flaw: Ignoring Variance and Bankroll Constraints**
      *   **Expected Value is Long-Term AVERAGE:** While a positive EV bet will *on average* make money over an infinite number of trials, your bankroll and your lifetime are finite.
      *   **Variance (Swings) Can Wipe You Out:** Even with a positive EV, a bad run of variance (losing streaks) can deplete your entire bankroll *before* the long-term average has a chance to materialize. Betting your entire bankroll (or a very large fraction) on a single hand, even with a 1% edge, gives you a frighteningly high chance of going broke *immediately* if you lose that hand.
      *   **Example: The Coin Flip Analogy (Simplified):**
          *   Imagine a coin flip where you have a 51% chance of winning (positive EV). You have $1000.
          *   **Friend's Strategy:** Bet $1000 (max allowed) every time the odds are 51% in your favor.
          *   **Outcome:** If you win, you have $2000. If you lose, you have $0 (broke). *Even though the EV is positive ($1000 * 2% = $20 profit on average per flip), you have a 49% chance of going broke on the very first flip!* Over multiple flips, the chance of going broke approaches 100% because you only need one loss to end the game.
      *   **In Blackjack:** While the edge might be smaller (e.g., 1-2%) and the win/loss isn't all-or-nothing (you can push, get blackjack, double, split), the core problem remains: betting too large a fraction of your bankroll exposes you to devastating short-term losses that your positive EV cannot overcome in time.

  2.  **The Solution: Bankroll Management & The Kelly Criterion**
      You figure out how much to bet by determining a **fraction of your current bankroll** that maximizes long-term growth while keeping the Risk of Ruin (RoR) at an acceptable level. The most famous mathematical approach is the **Kelly Criterion**.

      *   **Kelly Criterion:** This formula calculates the *optimal* fraction of your bankroll (`f`) to bet, given your edge (`b`) and the odds paid on a win (`p`).
          *   **Simplified Formula (for even-money bets):** `f = (bp - q) / b`
              *   `b` = Decimal Odds Received on a Win (e.g., 1 for even money).
              *   `p` = Probability of Winning.
              *   `q` = Probability of Losing (`q = 1 - p`).
              *   **`Edge = (p * b) - q`** (This is your expected return per unit bet).
          *   **Simplified Further (for known edge):** `f ≈ Edge / Odds`
              *   For a blackjack bet paying even money (1:1) where you have a 1% edge: `f ≈ 0.01 / 1 = 0.01` (1% of your bankroll).
              *   If you have a 2% edge: `f ≈ 0.02 / 1 = 0.02` (2% of your bankroll).

      *   **Why Kelly is Optimal (in theory):**
          *   **Maximizes Long-Term Growth Rate:** Betting the Kelly fraction maximizes the exponential growth rate of your bankroll over the long run.
          *   **Risk of Ruin = 0% (in theory):** Assuming you know the *exact* edge and bet continuously, Kelly betting theoretically reduces your RoR to zero. (In practice, with uncertainty and discrete bets, RoR is low but not zero).
          *   **Betting More than Kelly is WORSE:**
              *   **Increases Risk of Ruin Dramatically:** Betting more than Kelly increases your RoR *much* faster than it increases your expected growth. You take on disproportionate risk for diminishing returns.
              *   **Reduces Long-Term Growth Rate:** Surprisingly, betting *more* than the Kelly fraction actually *reduces* your expected long-term growth rate compared to betting the Kelly fraction itself. This is because large losses disproportionately hurt your ability to recover and compound.
          *   **Betting Less than Kelly is Safer but Slower:** Betting a fraction of Kelly reduces your RoR further but also reduces your long-term growth rate proportionally. This is often done in practice ("Half-Kelly") to account for uncertainty in edge estimation and volatility.

  3.  **Applying This to Your Friend's Blackjack Scenario:**
      *   **Estimate the Edge:** When the count is good, your friend estimates the player's edge is `E` (e.g., 1% or 0.01).
      *   **Determine Odds:** Most blackjack bets pay even money (1:1), so `b = 1`.
      *   **Calculate Kelly Fraction:** `f ≈ E / b = E` (e.g., 0.01 or 1% for a 1% edge).
      *   **Optimal Bet Size:** The optimal bet is approximately `E * Current Bankroll`. For a $10,000 bankroll and a 1% edge, the optimal bet is roughly $100.
      *   **Why NOT Bet the Table Max?**
          *   If the table max is $500, betting $500 (5% of a $10k bankroll) is **5 times the Kelly bet** for a 1% edge.
          *   **This drastically increases Risk of Ruin:** The RoR for 5x Kelly is very high.
          *   **It reduces long-term growth:** Even if he doesn't go broke immediately, his bankroll growth will be *slower* over time than if he bet $100 per hand.
          *   **Ignores Uncertainty:** Card counting edges are estimates. The true edge might be slightly lower than calculated, making over-betting even riskier.
          *   **Ignores Variance of the Game:** Blackjack has significant variance (splits, doubles, blackjacks, dealer outcomes). Betting too large magnifies the damage of negative swings.

  4.  **Addressing Your Friend's Arguments:**
      *   **"Betting bigger just scales up the edge":** True, it scales up the *expected dollar profit per hand*. **BUT** it also scales up the *variance* and *potential dollar loss per hand* even more dramatically relative to your bankroll. Scaling up EV without regard for bankroll scaling leads to ruin.
      *   **"You're just risk-averse / not trusting the math":** Counter that he's ignoring the *most important math* for a gambler with finite capital: **Risk of Ruin and the Kelly Criterion.** The math *demands* bet sizing proportional to bankroll to survive variance. Trusting the math means using *all* the relevant math, not just EV. Betting full Kelly *is* mathematically aggressive growth; betting over Kelly is mathematically self-destructive.

  **In Summary:**

  *   **Your intuition is correct:** Betting the table max whenever the count is good is a recipe for going broke due to variance, even with a positive EV.
  *   **The flaw:** Ignoring the finite nature of a bankroll and the devastating impact of variance (Risk of Ruin). Positive EV guarantees profit *only* if you can play infinitely long without going broke.
  *   **The solution:** **Bankroll Management** based on the **Kelly Criterion** (or a fraction thereof).
      *   Calculate your estimated edge (`E`).
      *   Bet a fraction of your *current bankroll* approximately equal to `f ≈ E / b` (where `b` is the win payout, usually 1 for blackjack).
      *   This maximizes long-term growth while minimizing (theoretically eliminating) Risk of Ruin.
  *   **Tell your friend:** "The math says to maximize long-term growth and minimize the chance of going broke, I should bet roughly 1% of my bankroll for a 1% edge, not the table max. Betting the max ignores the critical math of survival and optimal growth." Show him the coin flip example – it usually makes the point starkly clear.
