answer: |-
  Your situation is a textbook example of a **collective action problem** with strong elements of the **volunteer's dilemma** and **distributive injustice**. Priya's defense relies on a misleading framing of "equal freedom," but the reality is asymmetric and unfair. Here's why, and how to fix it:

  ### Why Priya's Argument Fails (The Structural Unfairness)
  1.  **The Volunteer's Dilemma:** This norm creates a game where everyone waits for someone else to "volunteer" to bear the cost (cleaning). The person with the *lowest tolerance* (you) consistently loses, paying the cost while others free-ride. Priya benefits directly from your lower tolerance.
  2.  **Asymmetric Costs & Benefits:**
      *   **Your "Choice":** You "choose" to clean because the mess causes you genuine discomfort/distress. Cleaning is costly (time, effort). *Not* cleaning is costly to your well-being.
      *   **Priya's "Choice":** She "chooses" not to clean because she experiences *no cost* from the mess (or a much lower one). Her inaction has zero negative consequence *for her*; she gains a clean kitchen without effort.
      *   **The Crux:** Your choices are **not symmetric**. Your action (cleaning) provides a *public good* (clean kitchen) that Priya enjoys without contributing. Her inaction imposes a *negative externality* (living with mess) primarily *on you*. Her freedom to avoid cost relies on your willingness to bear it.
  3.  **Adapted Preferences & Strategic Behavior:** Your suspicion is likely correct. Priya's tolerance threshold isn't static; it can (consciously or subconsciously) *adjust downward* precisely *because* she knows you'll intervene. This is rational for her individually but exploitative collectively. Her stance ("just wait longer") ignores how the system incentivizes her to lower her standards, knowing the burden falls elsewhere.
  4.  **The Illusion of "No Rule":** While no one formally *made* the rule, its emergence and everyone's adherence *make it the de facto rule*. Priya benefits from this implicit rule while framing her actions as mere personal freedom, ignoring the rule's coercive effect *on you*. You are effectively bound by *her* tolerance level.
  5.  **Distributive Injustice:** The burden of maintaining the shared resource (kitchen) falls disproportionately on one person (you) due to an accident of psychology, not any agreed-upon fair allocation (like rotation, equal effort, or responsibility based on usage).

  **Conclusion on Fairness:** Yes, you have a **legitimate fairness complaint**. This isn't about Priya "ordering" you; it's about an *implicit system* that systematically transfers labor from you to her (and likely others) based on an unequal sensitivity to disutility, which the system itself reinforces. Her "equal choices" argument ignores the power imbalance created by the dynamic.

  ### How to Renegotiate the "Non-Rule"
  The key is shifting from an *implicit, reactive system* (whoever cracks first) to an *explicit, proactive, and fair system* agreed upon by all. Here's how to approach it:

  1.  **Gather Data & Frame the Problem Collectively:**
      *   **Track Reality (Briefly):** For 1-2 weeks, note down *who* cleaned the kitchen and *when* (e.g., "Tuesday AM, User cleaned counter/stove/sink"). Don't make it accusatory; frame it as understanding current patterns.
      *   **Initiate a House Meeting:** "Hey all, I'd like to chat about the kitchen cleaning system. Our current 'whoever notices it first cleans it' approach has been working informally, but I've noticed it might be leading to uneven effort, and I think we could find something fairer and less stressful for everyone. Can we find 20 mins this week?"
      *   **Focus on Shared Goals & System Flaws:** Start the meeting positively: "We all want a reasonably clean kitchen without anyone feeling resentful, right? I think our current system, while simple, has some downsides. It puts the burden on whoever is most bothered by mess *first*, which isn't necessarily fair, and it can actually encourage the rest of us to *lower* our standards because we know someone else will step in. It's a classic 'volunteer's dilemma'." (You can explain this briefly if needed). Mention your brief tracking neutrally: "Just to illustrate, over the last X days, I cleaned Y times, and it felt uneven."

  2.  **Propose Alternatives (Focus on Structure & Predictability):**
      *   **Chore Rotation (Rota):** The classic solution. Assign specific days or weeks where one person is primarily responsible for checking and doing a basic tidy/clean of the kitchen. This distributes the burden predictably. "How about we try a simple weekly rotation? Each person is 'on duty' for the kitchen for one week, doing a daily wipe-down and making sure dishes don't pile up excessively."
      *   **Scheduled Deep Cleans:** Agree on a schedule (e.g., Sundays 4 PM) where *everyone* spends 15-20 minutes cleaning the kitchen together. This shares effort equally and builds shared responsibility. "Maybe we could all chip in for 15 minutes together on Sunday afternoons? It goes faster, and no one feels alone in it."
      *   **Clear "Trigger" Standards + Rotation:** If you want to keep an element of "intolerable," define *what that means* (e.g., "more than 24h worth of dishes in the sink," "visible grime on stovetop") AND rotate who is responsible for *checking* and *acting* on that standard each day/week. This removes the sensitivity asymmetry. "Could we agree on what 'needs cleaning' actually looks like? Maybe dishes shouldn't sit >24h? And then we take turns being the one to check and clean if it hits that point each day?"
      *   **Hybrid Approach:** "Clean as you go" for personal dishes + shared responsibility for surfaces/appliances (handled by a rota or group clean). Emphasize that the current system absolves people of *any* responsibility until someone else snaps.

  3.  **Key Negotiation Strategies:**
      *   **Avoid Blaming Priya (Initially):** Frame it as a *systemic flaw*, not "Priya doesn't clean." Focus on the dynamic, not the person. "The *way this system works* means the person who cares most ends up doing the most, and others get a free pass. I don't think that's fair *or* sustainable."
      *   **Appeal to Collective Interest:** "This unevenness can build resentment, which isn't good for the house vibe long-term. A fairer system will prevent that."
      *   **Be Prepared for Priya's Defense:** If she reiterates "just wait longer," counter calmly:
          *   "That ignores the cost *to me* of waiting. I shouldn't have to live in discomfort to avoid doing more than my share."
          *   "The *system* pressures me to clean and pressures you *not* to. That's not neutral freedom."
          *   "Fairness means sharing the burden, not just having the freedom to avoid it while someone else pays."
      *   **Focus on Future Agreement:** "Regardless of how we got here, we're all living together *now*. Can we agree on a *new* system moving forward that feels fair to everyone?" Emphasize that the *implicit* rule isn't working and needs replacing with an *explicit* one.
      *   **Involve All Housemates:** This affects everyone. Get their input. Others might also feel the imbalance or have ideas. Group pressure for fairness is powerful. "What do others think? Does this feel uneven? What system might work better for us?"
      *   **Suggest a Trial Period:** Propose trying a new system (e.g., a rota) for 4-6 weeks, then revisiting to adjust. This lowers the barrier to trying something new.

  **What Success Looks Like:** You move from an exploitative, implicit norm based on unequal sensitivity to an explicit, agreed-upon system based on a principle of fairness (equal effort, rotation, shared responsibility). Priya might not *like* having to do more, but the structural argument for fairness is strong. By shifting the focus to the system and collective agreement, you bypass the deadlock of "free choices" and create a foundation for shared responsibility. Good luck!
