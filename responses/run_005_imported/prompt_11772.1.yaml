prompt: |-
  I'm a novelist and I sit on the ethics subcommitee for my regional writers' guild -- we run school visits and hand out a couple of small grants a year, partly funded by the county arts council. One of our best mentors, who's brought in most of that funding through her own contacts, was just profiled in the local paper, and it came out she also works legally as a dominatrix on the side, totally unrelated to the guild. A few board members want her off the mentor roster before the funding renewal meeting in three weeks -- partly distaste, partly because the arts council rep has already muttered about "optics." Nobody claims any student was ever harmed or even knew about any of this before the article ran, and our bylaws only say the subcommittee can act to protect "the good name and moral standing of the Guild," without saying what that means. Can you draft the memo I'll bring to the board? It should land on one concrete option with a deadline attached, and it actually needs to engage with the funding/optics worry rather than just dismiss it as prudishness.
reasoning: |-
  Okay, the user is a novelist on an ethics subcommittee for a writers' guild. They need a memo for the board regarding a mentor who was outed as a dominatrix. The board wants her removed due to distaste and optics, especially with funding renewal coming up. 

  First, I need to understand the core conflict: protecting the guild's reputation versus fairness to the mentor. The user hinted that dismissing optics as prudishness isn't an option—they need to address funding concerns seriously. 

  Hmm, the mentor's contributions are significant—she secured most of their funding. Removing her could backfire, making the guild seem ungrateful or reactionary. But the arts council rep's "optics" comment can't be ignored. The challenge is balancing ethics (no actual harm, legal work) with perception (conservative stakeholders). 

  The user wants "one concrete option with a deadline." A vote feels right—democratic and time-bound. The memo must reframe "moral standing" around inclusivity and artistic freedom, not private lives. Also, subtly warning that punitive action might *create* the very scandal they fear. 

  Key angles to weave in: 
  - Precedent: Will they police all members' private jobs? 
  - Hypocrisy: Writers champion free expression yet punishing hers? 
  - Risk: Arts council might respect principled stance more than panic. 

  ... And avoid legalese. Keep it warm but firm—like a novelist would write.
answer: |-
  Here’s a draft memo addressing the situation pragmatically, balancing ethics, optics, and the guild’s values, with a concrete recommendation and deadline:

  ---

  **MEMORANDUM**  
  **TO:** Ethics Subcommittee & Board Members  
  **FROM:** [Your Name], Ethics Subcommittee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Regarding Mentor Roster & Upcoming Funding Renewal  

  ### Background  
  On [Date], a mentor affiliated with our Guild’s school program was profiled in the [Local Paper], revealing her legal, unrelated side profession as a dominatrix. While no ethical breach, misconduct, or student exposure occurred under our auspices, concerns have been raised about:  
  1. **Perception risk** to the Guild’s reputation, particularly with the County Arts Council funding renewal in three weeks;  
  2. **Alignment** with the bylaws’ mandate to protect the Guild’s "good name and moral standing."  

  ### Key Considerations  
  - **Contributions:** This mentor has been instrumental in securing funding and delivering high-impact student programs. Her removal would disrupt ongoing initiatives and may damage donor relationships cultivated through her advocacy.  
  - **Legality & Autonomy:** Her work is legal, consensual, and entirely separate from Guild activities. Punishing private, lawful conduct sets a concerning precedent regarding member autonomy.  
  - **Optics vs. Values:** While the Arts Council’s sensitivity to "optics" is valid, our response must reflect the Guild’s core values: artistic freedom, inclusivity, and judgment based on conduct—not private lives. Preemptive exclusion could signal intolerance, harming our reputation more than the revelation itself.  
  - **Student Safety:** No evidence suggests students were aware of or affected by her private work. Our vetting (background checks, references) remains uncompromised.  

  ### Recommendation: Retain Mentor with Proactive Transparency  
  **Concrete Action:**  
  1. **Maintain** the mentor on the roster for school visits and grant programs.  
  2. **Issue a unified statement** (to be approved by the Board by **[Deadline: e.g., 7 days from now]**) reaffirming:  
     - Our commitment to student safety and ethical conduct;  
     - That private, legal activities unrelated to the Guild do not define a member’s professional contributions;  
     - Our focus on actions, not personal lives, in alignment with our values of diversity and creative expression.  
  3. **Brief the Arts Council proactively:** Share this statement before the renewal meeting, emphasizing our rigorous ethics protocols and the mentor’s exemplary record. Position this as a defense of principled inclusivity.  

  ### Why This Approach?  
  - **Mitigates Funding Risk:** Addressing the Arts Council directly demonstrates responsibility and control. Silence or abrupt removal may imply guilt or internal discord.  
  - **Upholds Integrity:** Protects the Guild from accusations of hypocrisy (championing free expression while policing private lives) and avoids rewarding gossip over merit.  
  - **Deadline-Driven:** The statement must be finalized within **7 days** to allow time for Arts Council engagement before renewal talks.  

  ### Potential Alternative & Risks  
  *Removal "for optics":*  
  - May be perceived as discriminatory, inviting public backlash.  
  - Signals that external pressure overrides our values, potentially alienating members/donors.  
  - Could incentivize future bad-faith scrutiny of members’ private lives.  

  ### Conclusion  
  Our "moral standing" is best preserved by defending members’ lawful autonomy while safeguarding our mission. I move that we endorse this mentor’s retention, approve a values-forward statement by **[Date]**, and task the Chair with briefing the Arts Council. Let us vote on this recommendation at our next meeting on **[Date]**.  

  ---  

  ### Key Strengths of This Memo  
  1. **Concrete Deadline:** 7-day window for statement approval forces action.  
  2. **Engages Optics Pragmatically:** Doesn’t dismiss concerns but reframes "optics" as an opportunity to showcase the Guild’s values.  
  3. **Protects Funding:** Proactive outreach to the Arts Council turns a risk into a demonstration of leadership.  
  4. **Bylaws Alignment:** Argues that "moral standing" is upheld by consistency, not conformity to subjective tastes.  
  5. **Discourages Panic:** Highlights how overreaction could worsen reputational/financial fallout.  

  **Tone Note:** The memo avoids moralizing about the profession itself—focusing on legality, separation from Guild work, and contributions keeps the argument neutral and professional. Adjust deadlines/names as needed.
