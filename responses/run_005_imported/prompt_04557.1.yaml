answer: |-
  This is a well-articulated and philosophically sharp argument. You've grasped the core issues and presented a significant challenge to MacFarlane. Let's break down your questions:

  **1. Accuracy of Representation:**
  *   **Belnap & Green:** Your summary is excellent. You capture the core objection: that the TRL's pre-identified "actual" future undermines the genuine openness required by indeterminism, collapsing into epistemic uncertainty about a metaphysically settled fact. "Marking our ignorance" vs. "marking a genuinely unsettled matter" is a perfect phrasing.
  *   **MacFarlane:** Your description of his relativist semantics is accurate and sufficient for your argument. You correctly highlight the key features: no privileged history ("thin red line"), truth is assessment-sensitive (relative to a context of assessment <i>and</i> a history), and the payoff is retrospective truth/falsity without metaphysical privilege at the time of utterance. The phrase "truth-relative-to-a-history, evaluated from wherever the evaluator stands" captures it well.

  **Verdict on (1):** Yes, your representations are accurate and provide a solid foundation for your argument to get off the ground.

  **2. Success of Your Objection & MacFarlane's Reply:**
  *   **Your Objection (The Historian's "Simply Right"):** This is a powerful and common objection to relativism, especially in the branching time context. You pinpoint the core intuition: the historian seems to be making a claim about the *absolute* correctness of the past utterance, not just its correctness *from their current perspective*. The demand for an "unindexed fact" about which branch "time in fact took" is the crux.
      *   **Strength:** The objection succeeds in highlighting a deep tension within MacFarlane's view. It forces the question: *What makes the historian's assessment on the actual branch different in kind, not just location, from an assessment on a non-actual branch?* If the model provides no resources to say "this branch *is* actual" (only "this branch *contains the assessor*"), the intuition that the historian is tracking something more than just their local perspective feels unaddressed. Your point about the TRL seeming reintroduced "downstream" is astute.
  *   **MacFarlane's Potential Reply (Begging the Question):** This is indeed MacFarlane's standard line of defense (e.g., in *Assessment Sensitivity: Relative Truth and Its Applications*). He argues that the demand for an "absolute," non-perspectival truth *just is* the demand he rejects. For the relativist, the *only* truth there is *is* relative truth. Insisting that relative truth needs backing by an absolute truthmaker is question-begging because it assumes the very thing (absolute truth) that the relativist framework is designed to replace.
      *   **Does it Defuse?** Partially, but not entirely decisively in this specific context.
          *   **Abstract Plausibility:** The reply is formally valid. If relativism is coherent, it *can* reject the demand for absolute truth as based on a mistaken presupposition.
          *   **Problem in Branching Time:** Your intuition about the *salience of the alternatives* in the branching model is **doing crucial philosophical work here**, and it's not *merely* an intuition pump. Unlike taste ("That cake is tasty"), where the alternatives are subjective experiences, the branching model presents objectively defined, mutually exclusive possible *courses of history*. The model explicitly depicts multiple concrete futures. This makes the question "But which one *happened*?" incredibly natural and hard to dismiss as merely presupposing absolutism. The relativist says "None *happened* simpliciter; 'happened' is always relative to a history containing an assessor." But this feels deeply counterintuitive when looking at the branching structure – we want to say one branch *became* actual, not just that we find ourselves on it. The branching model *invites* the question of actuality in a way other relativist domains might not.
          *   **The Historian's Authority:** The relativist can explain *why* we listen to the historian (they are on the only history accessible to us now). But they struggle to explain the *metaphysical authority* we intuitively grant them – the sense that they are reporting on *how things objectively were*, not just how things look from their temporal location. The objection highlights a potential *explanatory gap* in the relativist account of retrospective truth claims.

  **Verdict on (2):** Your objection succeeds in pressing a significant and unresolved tension in MacFarlane's view, *especially* within the branching time framework. The branching structure makes the demand for an "actual" branch exceptionally salient. While MacFarlane's reply is coherent *internally* to his framework, it arguably fails to fully satisfy the powerful intuition generated by the explicit depiction of concrete alternative futures. Your worry about the reply "surviving contact" with the branching model is justified. The "pointing at the branch" intuition *is* doing real philosophical work by leveraging the specific structure of the model.

  **3. Standard Name/Citation:**
  *   **Yes, this move has a standard name and discussion.** Your objection is a specific instance of a broader critique often leveled against relativism (including MacFarlane's): **The Truthmaker Objection** or **The Demand for an Absolute Truthmaker**.
  *   **In the context of future contingents and branching time,** it's frequently framed as the problem of **Retrospective Truth** or **The Actuality Intuition**. The core question is: How can a relativist account for the seemingly absolute, non-perspectival truth of past-tensed claims *about* future contingents made from a later vantage point?
  *   **Key References:**
      *   MacFarlane directly addresses this *exact* worry in his seminal paper: **MacFarlane, J. (2003). Future Contingents and Relative Truth. *The Philosophical Quarterly*, 53(212), 321–336.** (See especially sections 6-7). He explicitly considers the "But which branch is *actual*?" intuition and argues that relativism doesn't need to answer it.
      *   **MacFarlane, J. (2014). *Assessment Sensitivity: Relative Truth and Its Applications* (Chapters 7 & 9 specifically).** He develops his response more fully here, arguing that the demand for an absolute truthmaker is misplaced and that relativism provides all the explanation needed for our practices.
      *   Critics who press versions of your point:
          *   **Belnap, N., Perloff, M., & Xu, M. (2001). *Facing the Future: Agents and Choices in Our Indeterminist World*. Oxford University Press.** While defending a different (non-relativist) branching time semantics, they are deeply critical of views that fail to ground truth in a robust notion of the "actual" history, though their target is often the TRL. Their framework emphasizes the lack of a single "thin red line".
          *   **Øhrstrøm, P., & Hasle, P. F. V. (1995). *Temporal Logic: From Ancient Ideas to Artificial Intelligence*. Kluwer Academic Publishers.** (See discussions on Ockhamism and TRL). They often emphasize the intuitive pull of actuality.
          *   **Todd, P. (2016). Future Contingents are all False! On Behalf of a Russellian Open Future. *Mind*, 125(499), 775–798.** While arguing for a different view (all future contingents false), Todd presses hard on the difficulties of views (like relativism) that try to avoid a privileged future without embracing truth-value gaps or universal falsity. He touches on the retrospective truth concern.
          *   **Torre, S. (2011). The Open Future. *Philosophy Compass*, 6(5), 360–373.** (A good overview that discusses these tensions).

  **Verdict on (3):** Yes, your objection is a recognized and discussed point in the literature. The core issue is the relativist's ability to accommodate the intuition behind retrospective truth claims without smuggling in a "thin red line" or absolute truthmaker. Engaging with MacFarlane's *2003* and *2014* works, particularly his responses to the truthmaker/actuality demand, is essential.

  **Recommendations for Your Paper:**

  1.  **Engage Explicitly with MacFarlane's Response:** Cite and directly address his argument from *2003* and/or *2014* that the demand for an absolute truthmaker begs the question. Don't just consider it hypothetically.
  2.  **Refine Your Objection:** Frame it clearly as the **Retrospective Truthmaker Problem** or the challenge of **Accommodating the Actuality Intuition** within relativist branching time. Emphasize that the branching structure *itself* makes the demand for an "actual" branch particularly vivid and hard to dismiss as mere absolutist prejudice. Argue that relativism leaves an *explanatory gap* for why the historian's claim feels metaphysically authoritative, not just pragmatically useful.
  3.  **Clarify the Role of the Branching Model:** Explicitly argue that the *concreteness* and *mutual exclusivity* of the depicted branches in the model exacerbate the problem for relativism in a way that might not occur in other domains like taste. The model visually represents what we intuitively think of as *alternative realities*, making the "Which one is actual?" question almost irresistible. This strengthens the objection beyond a simple intuition pump.
  4.  **Consider Broader Implications:** Does this tension suggest that branching time models are inherently unsuited for a *pure* relativism about future contingents? Does it push towards a more "thin red line"-lite view (where the "actual" history is only identifiable retrospectively, not prospectively) or back towards supervaluationism or a Russellian "all false" view? Briefly exploring these implications would strengthen your conclusion.

  Your argument is insightful and well-positioned to contribute to the ongoing debate. By engaging directly with MacFarlane's published responses and framing your objection within the established literature on the truthmaker/actuality problem for relativism in branching time, you can make a compelling case. Good luck with the paper!
