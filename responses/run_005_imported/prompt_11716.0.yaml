  First, I need to recall Turing's paper. The ESP section is near the end. Turing suggests that if telepathy exists, it could mess up the test because the human might use ESP to answer questions about another room, but the machine couldn't. His fix is a "telepathy-proof room." He also mentions strong statistical evidence for telepathy, which is surprising given the paper's otherwise logical approach.

