  Hmm... perhaps anchor in concrete memories (her teaching, patience) while framing agency carefully: "we witnessed generosity that flowed through her" keeps divine primacy. For death, focus on God's constant action - "when breath became difficult" avoids assigning cause.

  The kasb issue is thorniest. Maybe use "she shaped her soul to receive" grace? Credits her effort within divine framework. Mustn't say "she chose" bluntly.

  User's request shows deep respect. They're threading a needle: orthodoxy for her community, comfort for others. The love letter approach might work - theology as her language of devotion, not abstraction.

