answer: |-
  ## Eulogy for a Teacher of Divine Constancy

  **(Begin with warmth and presence)**  

  Good morning. Thank you all for being here to honour my grandmother, [Grandmother's Name]. To those from her mosque family, your presence is a deep comfort; she cherished your community. To cousins, coworkers, and friends who knew her laughter, her wisdom, or her quiet strength – welcome. We gather, simply, to remember a remarkable woman, and to mourn her absence.

  **(Acknowledge the journey, reframe the end)**  

  Many of you walked with her through her final months. You saw her courage, her unwavering spirit, and yes, her profound patience in the face of suffering. We witnessed the body she lived in become fragile, its functions faltering. It’s natural to want to name what we saw – to say illness *did* this, or that her body *gave out*. But my grandmother, a teacher of Islamic thought for forty years, held a conviction about the world that asks us to pause before using that language.

  **(Introduce her core belief simply)**  

  She saw the universe, every moment of it, as sustained by the direct, constant, and loving will of God. For her, what we call "cause" – like fire burning cotton, or illness affecting the body – wasn’t one thing *making* another happen by its own power. It was God’s consistent pattern, His faithful habit (‘*ādah*), holding everything together, moment by moment. When that pattern changes – when the fire doesn't burn, or when healing comes unexpectedly – we call it a miracle. But the underlying truth, for her, was the same: God acting, always, directly.

  **(Apply to her passing with tenderness)**  

  So, when her breath became difficult, when her strength faded, it wasn’t that something called cancer *took* her, or that her body *failed* her as an independent agent. In her understanding, it was the moment when God, in His infinite wisdom and according to His timeless pattern, chose to end her earthly journey. The illness was the *occasion* we witnessed, the state of her body was the *condition* we saw, but the Author of Life was the one who tenderly called her soul back. She didn’t fall to an enemy; she was received by her Creator, according to His will and His timing. She would find deep peace in knowing her passing is seen this way – as an act of divine sovereignty, not a victory for chaos or decay.

  **(Honour her virtues within her theology - Kasb)**  

  This understanding didn’t diminish her as a person; it shaped how she shone. How do we speak of *her* incredible patience, then? Her boundless generosity? Her fierce dedication as a teacher? Her theology spoke of *kasb* – “acquisition.” She believed that while every act, every capacity, originates with God, we humans are the vessels, the *doers* who “acquire” the action. God enabled the patience, but *she* was the one who *lived* it, who chose, moment by moment, to align herself with that grace, to embody it in her sighs, her smiles, her perseverance. God was the source of her generous spirit, but *she* was the one who opened her hands, her home, and her heart so freely. She didn’t create the light, but she polished the lamp of her soul brilliantly, and its warmth touched everyone here.

  **(Conclude with comfort and unity)**  

  So today, we mourn the silence where her voice taught, the stillness where her presence comforted. We grieve the absence of her wisdom, her kindness, the unique way she inhabited this world. But we also honour the profound faith that anchored her: a faith in a God whose Hand is never idle, whose Habit is constant, and whose Mercy is everlasting. She faced her final test with the same acceptance she taught – not because the illness was powerless, but because her trust in the All-Powerful was absolute.

  **(Final words)**  

  Grandmother, [Grandmother's Name], you lived with grace, taught with passion, and endured with a patience that humbled us. You shaped your life to reflect the divine attributes you cherished. Now, according to the will of the One who sustains all moments, your earthly journey is complete. May Allah, Al-Hayy, Al-Qayyum (The Ever-Living, The Sustainer), envelop you in His infinite mercy and grant you the highest paradise. Amen.

  **(To the gathering)**  

  Thank you. Let us remember her light, honour her faith, and find comfort in the constancy of the Love that brought her here and has now called her home.
