  Why would the advisor push back? The Pareto indifference condition assumes that if everyone is indifferent, so is society. But prioritarians might argue that equality matters even when utilities sum to the same. Also, the vNM axioms assume cardinal utilities, which prioritarianism might question. The advisor could point out that Harsanyi assumes utilities are interpersonally comparable, which is a big philosophical debate.

  The user's tone suggests they're confident, maybe even a bit brash. They called prioritarian research "mathematically closed off," which could come off as arrogant. The advisor might feel their life's work is being dismissed. The key is to frame the discussion as seeking understanding rather than declaring victory. The student should acknowledge the theorem's strength but show humility about its scope.

  I should consider the advisor's possible responses. She might argue that Harsanyi's setup doesn't capture moral relevance of distribution. Or that real-world preferences involve empathy, altering utility functions. Maybe she rejects the vNM axioms for social decisions. The student needs to engage with these points respectfully.

  Strategies for the student: Start by expressing genuine curiosity. Ask how the advisor reconciles Harsanyi with prioritarianism. Listen actively instead of debating. Cite specific prioritarian critiques, like Diamond's thought experiment. This shows depth and respect. Emphasize learning rather than correcting.

  Also, the student should avoid phrases like "closed the book" or "proven theorem." These can sound final and dismissive. Instead, use "raises questions" or "interesting tension." The goal is a dialogue, not a lecture. Highlight that the seminar sparked thoughts they want to explore further with her expertise.

