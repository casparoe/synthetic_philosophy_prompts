answer: |-
  ## Eulogy for Mum: The Riverbed of Certainty

  Good morning. Thank you all for being here to remember my mother. It means more than I can say, especially to my father, and to us, her family.

  For nearly seven years, Mum lived with Alzheimer’s. Many of you walked parts of that difficult road with us, offering support and kindness. We’re deeply grateful. When I sat down to think about what to say today, I found myself circling back to the last couple of years – not just the memory loss, which we expected, but something deeper and harder to name.

  It was watching things we thought were absolutely fundamental, the bedrock of who she *was*, begin to shift. There was a time when she wasn’t quite sure she *had* a body. And for many months, the man she’d built a life with for over fifty years, my father, became… a kind, gentle stranger to her. That wasn’t just forgetting a name. It felt like the ground itself giving way.

  Trying to understand that, to be honest about it without falling back on easy phrases like “she lost herself,” led me to an unexpected place: the writings of a philosopher named Ludwig Wittgenstein. He wasn’t writing about dementia, but about something he called “certainty.” And his ideas felt closer to the truth of what I witnessed than anything else.

  Wittgenstein suggested that most of what we call “knowledge” isn’t held up by proof, like a building on pillars. Instead, it rests on things that simply *stand fast* for us, unquestioned. He called them “hinges.” Like the hinges on a door. The door swings, but the hinges stay put. Without them fixed, nothing works. We learn these hinges – like knowing we have hands, or recognizing the face of someone we love – through living, through practice, through shared experience, not through argument.

  He also used the image of a river. The water flows, constantly changing, but it flows *over* the riverbed, which seems fixed. Yet, he pointed out, even the riverbed can shift, grain by grain, over time. What seems absolute and unchanging… isn’t, necessarily.

  I think Mum’s journey showed us this in the most profound and personal way. The hinges of her world – the certainties about her own body, about the man who was her anchor for five decades – these weren’t private facts locked away inside her head. They weren’t secrets known only to her soul.

  **They were things we *did* together, out loud, for fifty years.**

  The certainty that she was *Mum*, and that Dad was *Dad*, wasn’t a hidden gem buried deep within her. It was built and rebuilt every single day: in the way he made her tea just so for fifty years; in the familiar weight of her hand in his; in the thousand shared glances across a room that said, "I know you. You are mine. I am yours." It was in the routines, the jokes, the quiet companionship, the arguments even. It was a practice, a lifetime of shared action and recognition.

  Alzheimer’s didn’t steal a hidden “her.” It slowly, relentlessly, eroded the riverbed. It shifted the hinges that our shared life had made seem immovable. The practice of being Mum, of knowing Dad, of inhabiting her own body with certainty – that practice became impossible for her nervous system to sustain. And so, those profound certainties, so deeply woven into the fabric of *who she was for us*, began to come loose. Not because she chose to let go, but because the very ground of that knowing was washing away.

  This is hard. It’s heartbreaking to witness. It challenges everything we believe about identity and love and constancy.

  But here’s what this understanding offers, what feels true and specific:

  **The certainty we shared with Mum wasn't fragile because it was false. It was precious *because* it was built, together, in the open air of our lives.** It existed *between* us, in the space of shared glances, familiar touches, decades of “remember when?” It wasn't a solitary possession, but a collective creation.

  And while the disease could dismantle Mum’s ability to hold her end of that practice, it cannot dismantle what that practice *built* in *us*. The love she gave, the lessons she taught, the strength she showed, the laughter she shared – all that she *was* in relationship to us – that riverbed she helped form in *our* lives? That remains. It is solid. It is the ground *we* stand on.

  The woman who raised me, who loved my father fiercely, who was your friend, your sister, your confidante – that woman lived a life that shaped ours. The certainty of *who she was to us* is etched not in some hidden chamber of her fading mind, but in the lives she touched, in the memories we hold, in the love that persists here, in this room, right now.

  Her later years were a stark lesson in the fragility of the hinges we take for granted. But they also throw into brilliant relief the immense, enduring power of the love and the life that *built* those hinges in the first place. That power – her power, the power of your connection with her – doesn’t vanish because the riverbed shifted for her. It flows on, in us.

  So, today, we mourn the shifting ground she endured. We mourn the cruel erosion of her certainties. But we celebrate, fiercely and gratefully, the woman who helped build the unshakeable ground on which *we* stand. We remember her life, her love, her practice of being Mum, being a wife, a friend. And we know, with a certainty born of shared experience and enduring love, that she shaped us, and that shaping is permanent.

  Thank you, Mum, for everything. We love you. We remember. We are certain.
