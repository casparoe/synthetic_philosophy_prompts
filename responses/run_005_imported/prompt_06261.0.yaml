  Chang's small-improvement argument feels intuitive: a tiny raise doesn't suddenly make the corporate job "better," but calling it "equal" feels wrong too. Yet Broome's counter—that we're just bad at drawing lines—resonates when I imagine similar dilemmas (choosing between cities, partners, etc.). The user's tension mirrors this: they want certainty where it might not exist. 

