answer: |-
  ## STATE BAR DISCIPLINARY BOARD – DECISION MEMORANDUM  
  **Re: Complaint by Attorney A against Attorney B (Docket No. DR-2024-0017)**  

  ### I. RECOMMENDATION
  The Board recommends:  
  1. **Proceed with the investigation against Attorney B** regarding alleged billing fraud.  
  2. **Dismiss Attorney B’s motion to dismiss the complaint for lack of standing**.  
  3. **Decline to open a separate inquiry into Attorney A** at this time, noting her past conduct is time-barred under Rule 8.4(g) (4-year limitation for non-felony misconduct).  
  4. **Timeline**:  
     - Investigation of B to conclude within **60 days**.  
     - If probable cause is found, formal charges filed within **30 days** thereafter.  
     - Attorney A’s credibility may be assessed during B’s proceeding if relevant to witness testimony.  

  ### II. STRONGEST VERSION OF THE ARGUMENT FOR DISMISSAL (STANDING/UNFAIRNESS)  
  Attorney B’s counsel contends the complaint must be dismissed under principles of equity and procedural fairness. Attorney A, having engaged in substantively identical misconduct (billing fraud) concealed from the Bar, lacks the moral and legal standing to initiate this proceeding. Permitting a complainant to weaponize the disciplinary process while shielding their own violations:  
  (a) Violates the "clean hands" doctrine, barring relief to those guilty of misconduct related to the dispute;  
  (b) Encourages retaliatory or hypocritical complaints, undermining the Bar’s integrity;  
  (c) Distracts from the Board’s mission by focusing on interpersonal conflicts rather than public protection; and  
  (d) Unfairly prejudices Attorney B, who faces scrutiny from an accuser whose identical past breach escaped public sanction.  
  Dismissal is the only remedy preventing the Board from becoming a tool for bad-faith actors.  

  ### III. REASONS FOR REJECTING THE DISMISSAL ARGUMENT  
  While intuitively compelling, **this argument conflates the complainant’s conduct with the validity of the underlying allegation and misconstrues the Board’s mandate**:  

  1. **The Board’s Duty is Client and Public Protection, Not Adjudicating Disputes Between Attorneys**:  
     - Disciplinary Rule 1.1 mandates investigation of *any credible evidence* of Rule violations, irrespective of the source. The complainant’s motives or history do not absolve the Board of its duty to investigate potential threats to the public.  
     - Dismissal based on the complainant’s character would establish a dangerous precedent: violators could immunize themselves by exposing a complainant’s past misconduct, chilling legitimate reports.  

  2. **"Standing" is Inapplicable to Disciplinary Proceedings**:  
     - Disciplinary actions are *sua sponte* inquiries by the Bar, not civil lawsuits. The complainant triggers the process but does not "prosecute" the case. The Bar is the real party in interest. Attorney A’s role is evidentiary, not jurisdictional.  

  3. **The Allegation Against B Stands or Falls on Its Own Merits**:  
     - Evidence of B’s billing practices exists independently of A’s complaint (e.g., client records, timesheets, bank statements). Whether B violated Rule 1.5(a) (fees must be reasonable) depends solely on B’s conduct. A’s hypocrisy does not negate B’s possible misconduct.  

  4. **A’s Past Conduct is Legally Immaterial to B’s Investigation**:  
     - A’s settled misconduct is time-barred under Rule 8.4(g) and resolved privately. While relevant to A’s credibility as a witness, it does not constitute a defense for B. Introducing it as a justification for dismissal improperly shifts focus from B’s actions.  

  5. **Equity Doctrine Misapplied**:  
     - The "clean hands" doctrine governs claims for equitable relief (e.g., injunctions), not state disciplinary investigations. The Board’s authority derives from its regulatory duty, not equity.  

  ### IV. HANDLING ATTORNEY A’S CONDUCT  
  - **No Separate Inquiry**: A’s misconduct (5 years ago, privately settled) is time-barred per Rule 8.4(g). Opening an inquiry would violate limitations rules and waste resources.  
  - **Credibility Assessment**: If A testifies against B, B’s counsel may impeach her credibility with evidence of her past misconduct under Evidence Rule 608(b). The Hearing Panel will weigh this.  
  - **Caution Against Retaliation**: The Board will monitor if this complaint reflects a pattern of retaliatory conduct by A, but current evidence is insufficient to support a separate Rule 8.4(d) (conduct prejudicial to justice) charge.  

  ### V. CONCLUSION  
  The complaint against Attorney B presents credible allegations of billing fraud requiring investigation to protect the public and profession. Attorney A’s past misconduct, while ethically troubling, is procedurally irrelevant to the merits of B’s case and legally time-barred from independent action. The Board’s duty to investigate potential Rule violations supersedes concerns about the complainant’s character. Proceed with the investigation of Attorney B as outlined.  

