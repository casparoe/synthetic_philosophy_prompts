  Hmm, this is a fascinating ethical dilemma with layers. First, I need to separate the core issues: the validity of B's alleged misconduct versus the relevance of A's past actions. The board's mandate is to protect the public, not adjudicate personal disputes between attorneys. Standing isn't really a procedural barrier here since the bar can investigate any credible evidence of misconduct, regardless of source. 

  The strongest dismissal argument would be that A's hypocrisy undermines her credibility and the complaint's legitimacy - essentially a "clean hands" doctrine. But that conflates the complainant's character with the substance of the allegation. Even if A acted in bad faith, fabricated bills harm clients and the profession regardless. 

  For the memo structure: I'll start by recommending proceeding against B within 60 days since billing fraud is serious and the evidence exists independently. No dismissal - that would set a dangerous precedent where violators could silence whistleblowers by digging up their past. A's past misconduct is troubling but time-barred per most jurisdictions' 4-year limitation, though I'll note it could inform credibility assessments later. 

  Timeline-wise: B's investigation first, then if A's testimony becomes crucial, her credibility could be addressed within that existing proceeding. Opening a separate case against A now would distract from B's alleged active misconduct and exceed the board's resources. 

  Biggest risk is appearing to condone A's past actions, so the memo should emphasize that while not actionable now, such conduct would be disciplined if recent. The rejected argument deserves full presentation though - it's legally creative even if ultimately unsound. 

