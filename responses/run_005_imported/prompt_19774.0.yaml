  They mentioned lab meetings, so they need to explain this confidently. Emphasizing that proper priors are crucial and that the stopping rule doesn't affect validity. Also, addressing the critique: improper priors cause issues, but proper ones don't. Highlighting that their method is kosher if priors are well-justified.

  The user's deeper concern might be about the validity of their lab's practices. They want to ensure they're not committing a methodological error. They might also need to justify their approach to others or in publications. So clarifying the conditions under which it's valid (proper priors, correct model) and potential pitfalls (misspecified priors) is essential.
answer: |-
  Your advisor is **largely correct** about the Bayesian approach being immune to the "peeking" problem *because of the Likelihood Principle (LP)*, but the critique about "sampling to a foregone conclusion" under the *wrong prior* is a valid caveat. Here's the breakdown:

  1.  **The Likelihood Principle (LP) is Key:**
      *   The LP states: *All the evidence provided by the data regarding the relative plausibility of two hypotheses (H1 vs H0) is contained in the likelihood ratio.* The *method* by which the data was obtained (e.g., fixed sample size vs. sequential testing with peeking) is irrelevant for inference *once you have the data*.
      *   **Implication for Peeking:** When you update your Bayesian posterior probabilities or Bayes Factors (BFs) *only* using the likelihood of the *observed data* (relative to your prior), the fact that you looked at the data multiple times during collection doesn't change the evidential meaning of the *final dataset you actually have*. The BF for your collected 100 data points (whether planned or collected by peeking until BF>10) depends *only* on those 100 points and your prior.

  2.  **Why Frequentist P-Values Break:**
      *   Frequentist inference depends on the *sampling distribution* – what data *could have been* observed under H0, *including data you didn't collect* because you stopped early.
      *   Peeking inflates Type I error (false positives) because the threshold for "significance" (p<.05) is calibrated for a *single look* at a *fixed sample size*. Stopping early when you see a random fluctuation below .05 gives you an inflated chance of falsely rejecting H0 over many experiments. The procedure matters.

  3.  **Bayesian Validity (The Good News):**
      *   **BFs Comply with LP:** Since the BF is a ratio of marginal likelihoods (averaged over the prior), it depends *only* on the observed data. Stopping rules based on the data *do not affect* the interpretation of the BF obtained from the data you have.
      *   **Your Advisor's Habit is Kosher (in principle):** Continuously monitoring the BF and stopping when it reaches a pre-defined threshold (e.g., BF₁₀ > 10 for H1, or BF₀₁ > 10 for H0) is a perfectly valid Bayesian sequential analysis strategy. The interpretation of the final BF ("strong evidence for H1") is the same as if you had planned to collect exactly that many participants from the start and got that BF.

  4.  **The Catch: "Sampling to a Foregone Conclusion" (The Caveat):**
      *   **The Critique (Robbins, 1950s; later Edwards/Lindman/Savage):** It's mathematically possible to specify a **pathological prior distribution** such that, no matter *what* data you observe (even infinite data!), the posterior probability for a specific hypothesis (e.g., H0) remains bounded *away* from 0 or 1. You could literally collect data forever and never become convinced of the true state of the world.
      *   **The Root Cause: Improper Priors & "Hunting":** This problem arises most severely with **improper priors** (priors that don't integrate to 1, like a uniform prior over an infinite range). While often used for "objective" Bayes, they don't represent legitimate prior probability distributions. The issue can also manifest with very poorly chosen, extremely diffuse *proper* priors that place significant mass on values highly inconsistent with any plausible reality.
      *   **How it Bites in Peeking:**
          *   **Model Misspecification:** Suppose your prior places substantial probability on parameter values that are wildly implausible. As data comes in, the BF might fluctuate wildly or get "stuck" favoring a hypothesis supported by your bad prior, even as overwhelming evidence against it accumulates. Stopping early based on a BF threshold could lead you to stop *precisely when* the BF is misleadingly high for the *wrong* hypothesis due to the prior's influence before sufficient data arrives to overcome it.
          *   **"Hunting" for a Specific Outcome:** If your prior is highly asymmetric or favors one hypothesis overwhelmingly *a priori*, you might need very little compatible data to reach a high BF for that hypothesis. You could stop very early with a "convincing" BF based mostly on the prior, not the data. This is "sampling to a foregone conclusion" enabled by the prior, not the stopping rule per se.

  5.  **What Needs to be True for Your Habit to be Safe (Avoiding the Catch):**
      *   **Use Proper Priors:** This is non-negotiable for valid probability updating. They don't need to be "informative," but they must be proper (integrate to 1). Weakly informative priors (e.g., Normal(0, 10) for a regression coefficient, constrained to plausible ranges) are generally safe.
      *   **Justify Your Priors:** Priors should represent *genuine* prior knowledge (even if vague) or be established as weakly informative/default choices with good calibration properties. Avoid blindly using extremely diffuse priors (e.g., Normal(0, 1000) for a standardized effect).
      *   **Pre-Specify Thresholds & Models:** Decide *before* looking at any data:
          *   What BF thresholds constitute "anecdotal", "moderate", "strong", "decisive" evidence (e.g., >3, >10, >30, >100).
          *   What models/hypotheses (H1, H0) you are comparing.
          *   What your prior distributions are.
      *   **Be Aware of Sensitivity:** Especially with small-to-moderate sample sizes (common when stopping early!), check how sensitive your BF is to *reasonable* changes in your prior. If the BF flips from strong support for H1 to strong support for H0 with minor, justifiable prior changes, your conclusion based on an early stop is fragile.
      *   **Consider Expected Stopping Time:** While valid, stopping very early *might* mean your BF is based on limited information and potentially more sensitive to the prior choice. Understanding the expected evidence trajectory under different effect sizes can help set realistic expectations.

  **Conclusion:**

  Yes, **your peek-and-stop habit using Bayes Factors is fundamentally kosher under Bayesian principles and the Likelihood Principle.** It avoids the fatal flaw of frequentist sequential testing with p-values. The interpretation of the final BF genuinely reflects the evidence in the collected data.

  **The critical caveat:** This validity **depends entirely on having reasonable, proper prior distributions.** The "sampling to a foregone conclusion" critique highlights the danger of pathological or grossly misspecified priors. If your priors are poorly chosen (especially improper or unrealistically diffuse), you *can* be misled into stopping early with a "convincing" BF that primarily reflects your bad prior, not the true evidence from the data.

  **Recommendation for Lab Meetings:** Confidently state that the BF sequential analysis is valid per the Likelihood Principle. Emphasize that the *absolute requirement* for this validity is the use of well-justified, proper prior distributions. Acknowledge the prior sensitivity critique but frame it as a reminder of the importance of careful prior specification, not an indictment of sequential BF analysis itself. Your advisor's core methodological point is sound.
