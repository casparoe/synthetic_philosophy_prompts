prompt: |-
  Quick context: in my lab we run a lot of online studies, and my advisor's policy is to just check the Bayes factor every couple days as data trickles in and stop whenever it's convincing -- exactly the kind of "peeking" that the replication-crisis papers flag as a questionable research practice, except her line is that it's totally fine once you're Bayesian because of the likelihood principle. I've started repeating that in lab meetings but honestly I only have a hand-wavy grasp of why its true, and I have this nagging memory of a critique along the lines of Bayesians being able to "sample to a foregone conclusion" too, under the wrong prior. Can you give me the most important implications of the likelihood principle here -- i.e. is our peek-and-stop habit actually kosher once we've swapped p-values for Bayes factors, and if there's a real catch rather than just frequentists being sore losers, what would have to be true of our priors or model for it to bite us?
