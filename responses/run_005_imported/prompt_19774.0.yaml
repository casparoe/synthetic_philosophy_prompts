  First, I need to confirm if the advisor's method is valid under Bayesian principles. The likelihood principle states that all evidence from data is in the likelihood function. Since Bayesian updating depends only on the likelihood, stopping rules shouldn't affect the posterior. That means peeking isn't a problem here. But I remember the "sampling to a foregone conclusion" issue from the Robbins paper. That happens only with improper priors, which aren't actual probability distributions. So if their priors are proper, it should be fine.

