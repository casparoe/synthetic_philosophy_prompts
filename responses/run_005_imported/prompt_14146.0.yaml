  I need to recall how disjunctivists address this. The key is that indistinguishability isn't about intrinsic properties but about the subject's inability to tell them apart. So disjunctivists separate the metaphysical nature of experiences from the epistemic access we have. They argue that two experiences can be fundamentally different (one involving the actual object, the other not) yet still be indistinguishable to the subject because of cognitive limitations.

