answer: |-
  You've hit on the core tension beautifully: **Hypocrisy is often the symptom, not the disease, of lost standing.** The real engine is **moral authority eroded by unresolved guilt or incompatible action.** Here's the breakdown in plain terms, ready for your scene:

  ### The Core Idea: "Clean Hands" & Focused Credibility
  *   **Standing isn't about preaching; it's about the right to *wash* someone else's hands.** To credibly condemn a specific wrong, your own hands need to be *relatively clean* **regarding that specific wrong, or the core principle it violates**, AND your condemnation needs to feel like genuine moral concern, not performance or attack.
  *   **It's not "You did it too!" but "You haven't made *your* doing of it right, so you can't demand *I* make *mine* right *to you*."**

  ### Why Hypocrisy Feels Central (But Isn't the Whole Story)
  1.  **Hypocrisy is a Loud Signal:** Someone who preaches chastity but practices adultery *screams* "My hands are dirty!" regarding sexual ethics. It makes their condemnation of *your* affair obviously hollow and performative. It highlights their unresolved guilt.
  2.  **Hypocrisy Proves Incompatibility:** Their *current* condemnation clashes violently with their *current* actions. This destroys the perception that their blame comes from genuine moral conviction.

  ### Why It's Not Necessary or Sufficient
  *   **Not Necessary (The Open Sinner):** Imagine a thief who steals openly, never moralizes, and then condemns *your* theft.
      *   **Why they lack standing:** Their hands are *actively dirty* with the *exact same sin*. They haven't repented, made amends, or changed. Condemning *you* isn't about upholding a principle; it's either hypocrisy-by-silence (they condemn *in you* what they accept *in themselves*) or pure aggression/competition ("Only *I* get to steal!"). Their condemnation lacks *moral force* because they show no commitment to the principle *they* violate daily. **Their unresolved guilt regarding theft robs them of the moral high ground needed to judge *your* theft.**
  *   **Not Sufficient (The Hypocrite on Unrelated Issues):** The tax-cheating moralizer condemns your cowardice.
      *   **Why they *might* retain standing:** Their dirty hands are about *honesty/fairness*, not *courage*. Unless their tax cheating reveals deep cowardice (e.g., fear of financial struggle), the *core principle* they're condemning you for (cowardice) isn't the one they're actively violating (honesty). Their *moral authority on courage* isn't inherently destroyed by their dishonesty. It might make them *less likable* or *less credible overall*, but the specific condemnation of cowardice can still land if it seems genuinely felt. **Their unresolved guilt is focused elsewhere.**

  ### What *Actually* Removes Standing: The Two Key Levers
  1.  **Unresolved Guilt on the *Specific* Issue (or its Core Principle):**
      *   If you've committed the *same wrong* (or one that violates the *exact same core value*) and haven't genuinely addressed it (acknowledged, repented, made amends, changed), you lack the *purity of position* needed to condemn it in another. You're still *in* the moral mess, not above it.
      *   *Mechanism:* Your condemnation rings hollow because it implies *you* have solved the problem within yourself, which you demonstrably haven't. It feels like projection or distraction.
  2.  **Incompatible Action/State at the Time of Condemnation:**
      *   If you are *currently* committing the wrong, or are in a state (e.g., deep denial, active exploitation) that makes your condemnation logically or morally incompatible with your own behavior, your blame lacks integrity.
      *   *Mechanism:* Your words and deeds clash so violently that your condemnation seems performative, manipulative, or an attempt to deflect attention from yourself. It ceases to be about the principle and becomes about *you*.

  ### Why the Gap is Hard to Pinpoint
  *   **"Unresolved" is Subjective:** When is guilt "resolved"? Atonement isn't always clear-cut.
  *   **"Core Principle" is Fuzzy:** Is cheating on taxes really *only* about honesty, or does it also imply selfishness, lack of civic duty, or even cowardice (fear of paying your fair share)? The overlap of principles can blur the lines.
  *   **Intent Matters (Perceptionally):** Does the accuser *seem* genuinely concerned with the principle, or are they just attacking? Perception of intent heavily influences whether we grant standing.

  ### For Your Scene: Making the Deflection Philosophically Potent
  Have your deflecting character articulate the *erosion of moral authority*, not just shout "hypocrite!".

  **Example Dialogue Snippet:**

  > **Accuser:** "You betrayed their trust! That secrecy, that manipulation... it's unforgivable."
  >
  > **Deflecting Character:** (Calmly, piercingly) "Unforgivable? By *you*? Look at me, [Accuser's Name]. Really look. Do you stand there with clean hands, washed of the *exact same stain*, ready to cast that stone? Or are your hands still covered in it, just like mine? You haven't made *your* betrayal right, not to them, not even to yourself. You haven't even *stopped* justifying it. So tell me, where does this sudden purity come from? This isn't about principle. It feels like... smoke. Smoke to hide your own mirror."

  **Key elements used in this snippet:**
  1.  **Targets Specific Wrong:** "The exact same stain."
  2.  **Highlights Unresolved Guilt:** "You haven't made *your* betrayal right... You haven't even *stopped* justifying it."
  3.  **Challenges Moral Authority/Clean Hands:** "Do you stand there with clean hands... ready to cast that stone?" "Where does this sudden purity come from?"
  4.  **Questions Sincerity/Incompatibility:** "This isn't about principle. It feels like... smoke. Smoke to hide your own mirror." (Implies their condemnation is incompatible with their unresolved state).
  5.  **Avoids Simple "You did it too!":** Focuses on the *lack of resolution* and the *current incompatibility* of the accuser's position.

  This moves the deflection beyond the schoolyard and into the realm of genuine moral challenge, forcing the accuser to confront not just their past action, but their *current relationship* to that action and its implications for their right to judge *this specific wrong* in another. It exposes the *lack of standing* rooted in unresolved guilt and incompatible action.
