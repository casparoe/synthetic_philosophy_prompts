  Here is a eulogy crafted around Walt's own philosophical reasoning, designed to honor his integrity while speaking authentically to both communities. It runs approximately 6-7 minutes when read aloud:

  ---

  **For Walt**

  We gather here today with heavy hearts, remembering Walt. My friend, my field partner for more years than I care to count, a scientist of the rarest kind. Walt possessed an almost ferocious commitment to rigor. Many of you here from the university know exactly what I mean. He was the man who’d spend an extra week in miserable conditions because a sensor calibration looked *slightly* off. He’d throw out a season’s worth of data if he found a single, tiny methodological flaw. For Walt, intellectual honesty wasn’t just a virtue; it was the bedrock principle. He demanded evidence, respected doubt, and held knowledge to the highest possible standard. He understood the cost of getting it wrong, the ethical weight Clifford talked about – the shipowner convincing himself the rotten boat is seaworthy. Walt would *never* set sail on that rotten boat.

  And yet… those of us who shared a campfire, or a long night in the lab, or a beer after a particularly grueling conference, also knew another Walt. A quieter Walt. A man who held, carefully, thoughtfully, a deep and personal faith.

  This might seem like a contradiction to some. To the rigorously scientific mind Walt embodied in his work, how could he also embrace belief? I wrestled with this myself once, years ago, over drinks. I gave him a bit of good-natured grief about it, referencing that very Clifford essay. Walt, being Walt, didn’t get defensive. He didn’t proselytize. He simply leaned in, with that thoughtful look we all knew, and engaged the question with the same intellectual seriousness he brought to calibrating a flow meter.

  He pointed me towards William James. Specifically, James’s essay, "The Will to Believe." And Walt explained it in a way that was pure Walt: precise, considered, and grounded in the reality of how we actually live.

  He said that for certain questions – fundamental, existential questions about the nature of existence, about whether this life is backed by something more, about ultimate meaning – the rules change. These aren't questions like "Is this species migratory?" or "What's the nitrate level here?" where you can gather more data, run another test, and shelve the question until you have definitive proof.

  No, Walt argued, these are what James called **forced** options. You *have* to live one way or the other. You either live *as if* there might be something more, some ultimate grounding, some hope beyond the observable, or you live *as if* there isn’t. There’s no neutral observation deck here. Withholding judgement, Walt insisted, isn't actually neutral on a question like this. Choosing *not* to believe, choosing perpetual suspension, is itself a choice – a choice to live without that particular hope, without that specific orientation towards the universe. It shapes your life just as much as belief does.

  He also saw it as a **live** option for him – a real possibility that genuinely resonated, not just an abstract idea. And crucially, he saw it as **momentous**. The stakes, for him, were the highest possible: the potential nature of reality itself, and how he chose to face it.

  Given that forced choice – between living with a hope he couldn't definitively prove, or living without it while correctly acknowledging the lack of proof – Walt made his decision. He told us that night, simply: *Given that choice, I’d rather be wrong on the side of hope.*

  That was the key. Walt never once, in all the years I knew him, claimed he *knew*. He was far too rigorous, far too intellectually honest for that. His belief wasn’t a dismissal of science or evidence; it was a carefully considered choice about *how to live* in the face of a profound question science, by its very nature, couldn't definitively answer for him *in that moment*. He applied his fierce intellectual honesty to recognizing the nature of the choice itself.

  To his friends from church: Walt found deep comfort, meaning, and hope in his faith. It shaped his kindness, his patience, his quiet strength. He lived *as if* the love and grace he believed in were real, and that shaped the good man we all mourn. He chose hope, actively and thoughtfully.

  To our colleagues from the lab and the field: Walt never abandoned his scientific principles. He didn't claim knowledge he didn't have. He understood the weight of evidence and the cost of error. His faith was a separate response to a different kind of question, approached with the same integrity he brought to his science. He recognized that sometimes, not choosing is also a choice with consequences.

  Walt’s life wasn’t a contradiction. It was an integration. It was the application of deep intellectual honesty to the whole messy, beautiful, uncertain scope of human existence. He demanded proof where proof was possible, and he made a courageous, considered choice where the evidence was inherently incomplete and the stakes were ultimate.

  So, what can we say about Walt now? We can say this: He lived with unwavering integrity. He pursued truth with relentless rigor. And when faced with the ultimate forced option, he chose hope. He chose to live *as if* love and meaning had the final word.

  He lived that choice every day. It made him the scientist, the friend, the believer we all loved. And because he lived it so fully, so honestly, we can trust, absolutely, that wherever Walt is now – whether in the arms of the divine he hoped for, or simply at perfect, eternal rest in the fabric of the universe he studied so diligently – he is, finally and completely, **at peace**.

  Thank you, Walt, for teaching us how to think deeply, live honestly, and choose hope. We’ll miss you more than data can express.

  ---

  **Why this works:**

  1.  **Honors Walt's Rigor:** Starts firmly establishing his scientific integrity, using Clifford and field examples his colleagues will recognize and respect.
  2.  **Introduces the "Problem":** Acknowledges the apparent tension honestly ("This might seem like a contradiction...").
  3.  **Centers Walt's Reasoning:** Uses *his* words and concepts ("forced," "live," "momentous," "withholding judgement isn't neutral," "wrong on the side of hope"). This isn't the speaker's interpretation; it's Walt's own philosophy.
  4.  **Respects His Nuance:** Explicitly states he never claimed *knowledge* ("Walt never once... claimed he *knew*"). This is crucial for the scientific audience.
  5.  **Explains the "Will to Believe" Logic:** Clearly articulates *why* he felt James applied here, differentiating it from scientific questions.
  6.  **Speaks to Both Audiences Directly:**
      *   *To the Church:* "Walt found deep comfort... He chose hope... He lived *as if*... we can trust... he is... **at peace**." (Uses their language *after* establishing his reasoning).
      *   *To the Scientists:* "He didn't claim knowledge... not a dismissal of science... separate response... approached with integrity... recognized that not choosing is also a choice."
  7.  **Reframes "At Peace":** The final statement about being "at peace" is grounded in the preceding logic – it's a consequence of the hope he actively chose and lived by, and his inherent integrity, not a doctrinal assertion. The "whether... or..." phrasing ("whether in the arms of the divine... or simply at perfect, eternal rest...") subtly respects both perspectives without endorsing one over the other, while firmly stating the outcome both groups desire to hear: *he is at peace*.
  8.  **Unifying Conclusion:** Focuses on the shared admiration for his *character* (integrity, honesty, courage in choice) and the shared sense of loss.
  9.  **Tone:** Respectful, warm, thoughtful, and authentically reflective of a long partnership. It avoids platitudes and instead leans into the intellectual honesty Walt valued.

  This eulogy doesn't split the difference; it finds a *third way* by rigorously adhering to Walt's own, well-considered position. It allows both sides to hear what they need – comfort for the church, intellectual respect for the scientists – framed entirely within the logic Walt himself used to navigate this very tension in his life. It honors his unique voice and his profound integrity.
