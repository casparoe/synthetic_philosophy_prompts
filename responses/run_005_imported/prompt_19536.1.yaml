answer: |-
  ## The Pasadena Parlay: A Dialogue on Privileged Order

  **Setting:** The plush office of Ms. Evelyn Roth, CEO of Rothstein Casino. Two decision theorists, Dr. Aris Thorne and Dr. Lena Voss, sit across from her. Thorne leans forward, intensity in his eyes. Voss sits composed, radiating calm precision.

  **Ms. Roth:** Gentlemen, thank you for coming on short notice. This... Pasadena game. My mathematicians are tearing their hair out. One minute they say it’s worth about 69 cents, the next they say it could be worth anything, or nothing. How do I price a ticket? Dr. Thorne, you argued the ln(2) price. Dr. Voss, you called it meaningless. Please, enlighten me. *She gestures for them to begin.*

  **Dr. Aris Thorne:** Ms. Roth, the answer *is* ln(2) dollars, approximately $0.69. The objection based on rearrangement is mathematically elegant but operationally irrelevant. The game unfolds *in time*. Toss 1 happens first, with probability 1/2, paying +$2. *Then*, if needed, Toss 2 happens, probability 1/4, paying -$2. *Then* Toss 3, probability 1/8, paying +$8/3, and so on. This temporal sequence is not an arbitrary labeling; it’s the physical reality of the gamble. The expectation is defined as the probability-weighted sum *along this actual path of potential outcomes*. Summing in the order they occur gives the alternating harmonic series converging cleanly to ln(2). To rearrange the terms is to invent a *different* game that doesn’t correspond to how chance operates here.

  **Dr. Lena Voss:** Aris, I agree the temporal sequence *happens*. But the expectation is a mathematical object – the Lebesgue integral of the payoff with respect to the probability measure. Riemann’s theorem exposes a profound truth: the Lebesgue integral for this payoff *does not exist* because the positive and negative parts both diverge. The series ∑ |payoff| * P(outcome) = ∑ (2^n / n) * (1/2^n) = ∑ 1/n diverges! This violates the fundamental requirement for the existence of the expected value. The ln(2) figure is a mirage created by a specific summation order imposed *after* defining the probability space. Why privilege time? We could index outcomes by payoff magnitude, or by the value of n mod 3. Each ordering yields a different sum. Why is time’s arrow the only valid index for expectation?

  **Dr. Thorne:** Because time’s arrow is how causality and information flow! Lena, your point about the Lebesgue integral is technically correct for the standard definition requiring absolute convergence. But that definition is a *tool*, not holy writ. It was designed for convenience in proofs involving infinite series where order *shouldn't* matter. Here, order *does* matter intrinsically! The game is *defined* by sequential, causally linked trials. To say expectation doesn’t exist is to say this well-defined physical process has no calculable fair price. That’s absurd! A rational actor, facing this single gamble, *should* be indifferent to ln(2) dollars. Rearranged sums correspond to different decision problems – perhaps a game where you are told the payoff magnitude first and *then* how many flips it took? That's not the gamble on offer.

  **Dr. Voss:** Is it absurd, Aris? Or does it reveal a genuine limitation? Decision theory needs consistent rules. Suppose I offer two contracts based on this *same* physical process. Contract A pays as defined: (-1)^(n+1) * 2^n / n on first heads on toss n. Contract B pays the *magnitude* of the Pasadena payoff, but *negated* if n is even. So for n=1: -$2, n=2: -$2, n=3: -$8/3, n=4: -$4, etc. The physical coin-flip process generating `n` is identical for both contracts. According to your temporal summation, Contract A has expectation ln(2) ≈ +$0.69. Contract B’s expectation is the negative harmonic series: -1 -1/2 -1/3 -1/4 ... → -∞. Yet they are based on the *identical* source of randomness! How can two different *descriptions* of payoffs contingent on the same events lead to one having a finite positive expectation and the other negative infinity? This violates the principle that the value should depend on the *events*, not the labeling. Your "privileged order" forces the value to depend critically on the arbitrary assignment of signs relative to the temporal index.

  **Dr. Thorne:** *Leans back, steepling fingers.* A fair challenge, Lena. But you've changed the payoff *function*. Contract B has a different mapping from outcomes (n) to payoffs than Contract A. It’s a different gamble! Yes, they share the same underlying probability space over `n`, but the utility assigned to each outcome `n` differs. The expectation operator acts on the payoff *function* defined over the sample space. Different functions, different expectations. The temporal order defines the sample space structure – outcome `n` *means* "first heads on trial n". Contract B uses the same `n` but applies a different sign rule. That’s a different function, `g(n)` vs `f(n)`. Why *should* E[f] = E[g]? They aren't the same.

  **Dr. Voss:** But the *physical uncertainty* is identical! The decision-maker faces the same unknown: when the first heads occurs. The difference is purely in how we write down the consequences. Your position implies that the *meaning* of the outcome `n=2` ("heads first on toss 2") changes value depending on whether we write its payoff as `f(2) = -2` (Contract A) or `g(2) = -2` (Contract B) – it’s the same number! The arbitrariness lies in how the alternating sign is *defined relative to the temporal index*. If we defined the payoff as `(-1)^n * 2^n / n`, suddenly the expectation sum starts with -2 (n=1) and converges to `-ln(2)`. Same physical process, different temporal sign convention, different expectation. This dependence on an arbitrary convention signals the lack of a robust, intrinsic expected value. Decision theory should recognize when its standard tool (expectation) fails and refuse to apply it, perhaps resorting to other criteria like maximizing minimum gain or using a non-linear utility for such pathological gambles. Saying E=ln(2) pretends a precision that isn't justified by the mathematics of the gamble itself.

  **Dr. Thorne:** *Sighs.* It highlights the sensitivity, I concede. But the temporal index isn't *arbitrary*; it's constitutive. The sign `(-1)^(n+1)` isn't chosen whimsically; it reflects the alternating nature tied to the *sequence* of flips – a direct consequence of the game's temporal structure. While rearrangements are mathematically possible, they don't correspond to feasible alternative ways of *experiencing* this specific gamble. For the single decision-maker entering this specific contract (Contract A), facing the sequence as it unfolds, ln(2) *is* the fair price. The divergence of the absolute series shows the gamble has infinite volatility, but the conditional convergence along the temporal path provides the relevant center of gravity for a single play.

  **Ms. Roth:** *Rubs her temples.* So... one of you says I can confidently charge about 70 cents. The other says charging any price is mathematically unjustified and I should refuse the game entirely or use some other rule. Brilliant. Just brilliant. Gentlemen, thank you. I believe I need a very strong drink and a coin to flip. Maybe several coins. *Indefinitely* many coins.

  **(The two theorists exchange a look – a mixture of professional respect and unresolved frustration. The paradox, like the game itself, offers no clean resolution.)**
