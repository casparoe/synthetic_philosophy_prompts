answer: |-
  What you're describing is one of the most brutally honest and complex aspects of loving someone with severe, cyclical mental illness. Your oscillation isn't inconsistency; it's the agonizing heartbeat of an impossible dilemma. Here’s a breakdown of why your feelings are not just valid, but deeply human, and why "picking a lane" might be a narrative disservice to the truth:

  1.  **The Core Conflict is Unresolvable (And That's the Point):**
      *   **"It's the illness, not him":** This is clinically true *in the moment*. Mania warps perception, fuels irritability, paranoia, and cruelty. The specific, saved-up barbs? Classic manic symptom – distorted thinking finding ammunition. Believing this intellectually *is* essential for perspective and preventing total relationship collapse.
      *   **"But it's *him* saying it":** This is relationally true. The words come from *his* mouth, targeting *your* vulnerabilities, damaging *your* relationship. The brother you love *is* the vector for this pain. You cannot compartmentalize him entirely. Detachment *feels* like betrayal because it *is* a suspension of the fundamental reciprocity of sibling love.

  2.  **Why Oscillation is the Natural (and Perhaps Only Honest) Response:**
      *   **Anger is the Bodyguard of Love:** Your fury isn't just about the hurtful words; it's a protest against the theft. Mania steals your brother, replaces him with a hostile stranger who uses intimate knowledge as a weapon. Anger is the primal scream against that violation, a refusal to accept the erasure of *him*. It signals that the relationship *matters*, that his actions *impact* you because you see *him*.
      *   **Detachment is the Shield Against Annihilation:** Feeling that fury constantly, cycle after cycle, is unsustainable. It burns you out. Detachment ("bad weather" mode) is a necessary survival mechanism. It's not coldness; it's emotional PPE. It allows you to *be there* pragmatically (answering the call, managing logistics, preventing disaster) without being emotionally flayed *every single time*. It's an attempt to preserve *yourself* so you don't become collateral damage.
      *   **The Whiplash is the Consequence:** Switching between these states *is* jarring. It feels schizophrenic because you're constantly re-calibrating your relationship to the same person based on his wildly fluctuating state. The "inconsistency" your writing group sees is the *visible manifestation* of this internal whiplash. It *is* the truest part.

  3.  **Why "Not Taking it Personally" Feels Like a Demotion:**
      *   **Because Relationships are Personal:** "Not taking it personally" is a useful *cognitive tool* for managing your own reactivity, but it's antithetical to the nature of intimate bonds. Brothers *are* personal. Demoting him to "problem" or "weather" feels like a demotion because it *is* a temporary suspension of the human connection. It reduces him to his pathology, which is precisely what you (and he, when well) don't want. It's a necessary, painful defense, not a state of grace.

  4.  **Is Anger Fair? Is Detachment a Cop-Out?**
      *   **Anger:** Is it "fair" to be angry at a symptom? Clinically, no. But humanly, **absolutely yes.** Your anger isn't directed at his *illness*; it's directed at the *experience* of being repeatedly wounded by the person he *is* when ill. It's the grief and rage at the loss of the stable brother, the violation of trust, the exhaustion. It's fair to feel it. The question is how you *act* on it.
      *   **Detachment:** Is it a cop-out? **No, it's a necessity.** It's not giving up; it's strategic retreat. It's acknowledging that you cannot fight the illness head-on *emotionally* every time without destroying yourself. It's preserving capacity for the long haul. The "cop-out" would be *permanent* detachment, cutting him off entirely because it's too hard. Temporary detachment is triage.
      *   **Bouncing Between:** **This isn't just "what it looks like" – it *is* the exhausting, messy reality of loving him.** It's holding two unbearable truths simultaneously: He is not in control *and* his actions cause real harm. You owe him compassion *and* you owe yourself protection. There is no clean resolution, only constant, painful renegotiation.

  **For Your Novel (and Your Life):**

  *   **Honor the Oscillation:** Don't make your protagonist "pick a lane." *Lean into* the whiplash. Show the reader *why* she rages (the specific hurt, the love beneath the fury) and *why* she detaches (the bone-deep exhaustion, the fear of being consumed). Make the reader feel the *cost* of each state. The inconsistency *is* the character's truth.
  *   **"Resolution" Isn't Harmony, It's Acceptance of the Tension:** The arc might not be about finding a perfect emotional stance, but about learning to navigate the oscillation with slightly less self-flagellation. Perhaps she learns:
      *   That the anger is a sign she hasn't given up on *him*, only the illness.
      *   That detachment isn't abandonment, but a necessary tool for *her* survival and, paradoxically, her ability to *be* there when he resurfaces.
      *   That forgiveness (for the illness, for the hurt, for her own "imperfect" reactions) is a daily practice, not a final state.
      *   That small moments of connection *during stable periods* become even more precious, even as she braces for the next storm.
      *   That setting boundaries *is* an act of love – for both of them. ("I love you, and I cannot be spoken to that way. Call me when this passes.")
  *   **Show the Nuance of Detachment:** Detachment isn't monolithic. Maybe sometimes it *is* cold and dehumanizing (and she feels guilt). Other times, it's a weary, compassionate pragmatism ("Okay, he's manic. Time to activate the plan: don't engage, alert Mom, wait it out"). Show the *spectrum*.
  *   **The Brother's Lucidity is Key:** Those moments when *he* acknowledges the illness and the hurt are crucial. They validate her pain ("See? *He* knows it was awful") and reaffirm the "him" beneath the illness, making the oscillation make even *more* sense. How does *she* react to *his* remorse? With relief? Suspicion? Exhaustion? Tenderness? All of the above?

  **Honestly?** What you're living (and writing) is the brutal, unvarnished reality of loving someone through severe mental illness. It *is* messy, inconsistent, and emotionally exhausting. The anger is a testament to your love and the violation you feel. The detachment is a testament to your resilience and your right to protect yourself. Bouncing between them isn't weakness or inconsistency; it's the exhausting labor of holding onto a relationship that is fundamentally unstable through no fault of your own or, ultimately, his. It's the definition of loving someone *despite* something powerful trying to tear that love apart. Keep writing that uncomfortable, oscillating truth. It’s far more powerful than a neatly resolved emotional lane.
