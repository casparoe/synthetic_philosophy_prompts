answer: |-
  You're grappling with a profoundly human dilemma at the intersection of professional knowledge and personal pain. What makes this so challenging is that both perspectives you describe – the hurt friend seeking accountability and the clinician understanding addiction – are valid and necessary, yet inherently conflicting. Your labmates' advice to "decide once and for all" misunderstands the complexity of addiction and relationships. This isn't a binary choice, but a dynamic tension to manage.

  Here's a more principled framework for navigating this:

  1.  **Separate the Agent from the Act:**
      *   **Hold him responsible for recovery:** Marco *is* responsible for engaging with treatment, maintaining sobriety, understanding his triggers, and creating safeguards. His choice to pursue recovery (or not) is where primary agency lies. His thoughtful apologies reflect this agency.
      *   **Attribute specific harmful acts *during active addiction* to the illness:** The missed wedding, the cruel words spoken while severely intoxicated – these are manifestations of the neurological and cognitive impairments caused by alcohol dependence. While *he* did these things, his capacity for rational choice, impulse control, and consequence assessment was profoundly compromised. This is the "something that happens to him (and you)" element.

  2.  **Acknowledge the Nuance of "Choice" in Addiction:**
      *   Your friends' observation that he "seemed to be making choices" doesn't negate the illness. Addiction warps decision-making *within* the addiction framework. Choosing the bar *over* the wedding isn't a free, values-based choice; it's the result of craving overriding all other priorities, impaired judgment, and potentially dissociative states ("autopilot" drinking). It's a "choice" made with a hijacked brain.

  3.  **Establish Boundaries Based on Impact, Not Just Intent:**
      *   Instead of wrestling with "is he responsible?", focus on: "How do I protect myself and this relationship from further harm?" This shifts the focus to *your* agency.
      *   **Boundary Example:** "Marco, I value our friendship deeply. However, when you relapse, your behavior becomes harmful to me (e.g., missing major events, saying cruel things). To protect our friendship, I need to create some distance when you are actively drinking. I won't make plans that require significant reliance on you during those times, and I will need space immediately following incidents. My support for your recovery remains, but I cannot subject myself to the consequences of active addiction." This holds the *situation* accountable without necessarily debating his moral culpability in the moment.

  4.  **Allow Your Reaction to be Contextual (It's Coherent!):**
      *   Your fluctuating feelings aren't indecision; they're a natural response to a complex, painful situation.
      *   **When feeling resentful:** This is often triggered by a *specific* hurt (e.g., remembering the wedding). Allow yourself to feel that hurt *as a friend*. Acknowledge the impact: "What he did was deeply hurtful, regardless of why." This validates your experience.
      *   **When feeling clinical:** This often arises when thinking abstractly about his illness pattern or when he's in a remorseful/recovery phase. Here, you understand the mechanisms: "This is the predictable path of his relapse cycle; the apology is part of his processing and attempt at repair."
      *   **The key is not to let either state dominate permanently:** Feel the hurt, then consciously apply the clinical understanding to prevent the hurt from festering into permanent bitterness. Use the clinical understanding, but don't let it invalidate your genuine emotional responses as a human being in a relationship.

  5.  **Reframe the Apologies:**
      *   See his apologies not *either* as pure remorse *or* merely a symptom, but as **a necessary part of *his* recovery process that may or may not fully repair *your* hurt.** You can appreciate his effort and self-awareness (validating his agency in recovery) while acknowledging that some wounds leave scars. His apology addresses *his* need for amends; *your* healing happens on your own timeline.

  6.  **Protect the Friendship by Managing Your Role:**
      *   **Explicitly separate your roles:** Remind yourself: "Right now, I am Marco's *friend*, not his therapist." This helps prevent the "case manager" feeling. You are not responsible for managing his recovery. You *are* responsible for managing your own boundaries and emotional well-being within the friendship.
      *   **Focus on the Sober Relationship:** Invest most heavily in the friendship when he is sober. Build positive experiences and connection there. This strengthens the foundation that the relapses damage.
      *   **Manage Your Expectations:** Accept that relapse is often part of chronic addiction. While hoping for sustained recovery, *expecting* absolute perfection sets you both up for failure. Your boundary protects you when relapse happens.

  **Why this dual perspective is coherent and necessary:**

  *   **Addiction itself is dual-natured:** It involves both a chronic medical condition *and* patterns of behavior with consequences.
  *   **Relationships are multi-layered:** You relate to Marco as a whole person – someone you care about *who has a serious illness*. You can simultaneously love the sober person, be furious at the harm caused by the illness, understand the illness mechanisms, and demand accountability for managing it.
  *   **Your needs are valid:** You need safety, reliability, and respect *as a friend*. Your clinical knowledge doesn't erase those needs; it just informs *how* you understand why they were violated and *how* you might protect them moving forward.

  **Concrete Steps:**

  1.  **Have a Boundary Conversation (When He's Sober):** Calmly and clearly state your boundaries regarding his active drinking periods and the immediate aftermath of incidents. Focus on *your* needs and the *impact* on the friendship.
  2.  **Adjust Your Reliance:** Stop putting him in positions where his failure (due to relapse) will cause you significant pain (e.g., crucial roles in events, emotionally vulnerable conversations when he's unstable).
  3.  **Seek Support for *You*:** Talk to *your* therapist, supervisor, or a support group for loved ones of addicts (Al-Anon can be helpful, though assess its fit for you). Process your resentment and grief in a space separate from Marco.
  4.  **Practice Self-Validation:** When resentment flares, tell yourself: "It's okay to be furious about what happened. His illness explains it, but it doesn't erase the damage." When in clinical mode, tell yourself: "Understanding the mechanism helps me cope and set boundaries, but it doesn't mean I have to ignore my feelings."

  You are not failing to make up your mind. You are honestly confronting the painful reality that loving someone with a severe, relapsing illness requires holding two profound truths at once: the person is not fully themselves during the illness's active phase, *and* the consequences of that illness are real, damaging, and require boundaries to protect the relationship and yourself. This tension isn't resolvable; it's manageable through clear boundaries, self-compassion, and allowing both your humanity and your clinical knowledge to coexist.
