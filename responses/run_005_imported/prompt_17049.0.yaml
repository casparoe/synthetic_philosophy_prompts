  Me and my roommates share a jar for grocery money and some cash went missing. One roommate found a video that's pretty convincing proof our friend Jamie took it, but another roommate, who's been close with Jamie for like 15 years, wont even watch it. She just says "I know Jamie, there's no way he'd steal from us, so whatever that video shows, there's gotta be some other explanation, I don't even need to see it to know that." Part of me thinks that's an awful way to treat evidence, but if she genuinely does know Jamie that well, isn't she basically right that any "evidence" against him has to be misleading somehow? Isnt that sort of what knowing someone means? So is she actually reasoning fine, or is something wrong with it?
