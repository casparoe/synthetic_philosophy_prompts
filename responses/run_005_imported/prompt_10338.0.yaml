prompt: |-
  Since retiring after forty years in experimental condensed-matter physics, I've taken up philosophy, and I now hold a seat on my university's task force reviewing a proposed Composite Research Impact Score — combining field-normalized citations, grant income, and top-quartile publication counts — meant to replace narrative peer review for annual merit raises and, eventually, tenure decisions. A pilot in the chemistry department already shows predictable side effects: papers split into minimal publishable units, reciprocal-citation arrangements between cooperating labs, and a drift away from ambitious or null-result work toward safer, more citable projects. Half the task force wants to patch the formula; the other half wants to scrap quantification and return to narrative review, which administrators say was slower and let personal networks quietly bias outcomes. Please draft the memo I'll bring to the full task force: a specific recommendation for next year's review cycle, reasoning both sides could actually accept, and a serious account of why the metrics were proposed in the first place, rather than simply repeating that metrics get gamed.
reasoning: |-
  Okay, let me approach this request methodically. The user is a retired physics professor now involved in university policy, facing a complex dilemma about research evaluation metrics. Their memo needs to balance competing viewpoints while addressing systemic issues.

  First, I recognize several key tensions: efficiency vs quality in assessment, quantification vs qualitative judgment, and the need for accountability versus the risk of gaming metrics. The pilot program's failures are predictable but not inevitable - they stem from how the system was implemented rather than inherent flaws in quantification.

  The user's background suggests they'll appreciate concrete, systems-oriented thinking. As a physicist-turned-philosopher, they'll want both practical recommendations and conceptual clarity. The memo should reflect this dual perspective by framing the metrics debate as a measurement problem with philosophical implications.

  I consider structuring the argument around three pillars: 
  First, acknowledging why metrics were adopted (addressing administrative pain points with narrative review). 
  Second, demonstrating how the current composite score's design creates perverse incentives. 
  Third, proposing a hybrid model that uses metrics as filters rather than replacements for judgment.

  The core insight should be that metrics aren't the problem - it's their application as high-stakes targets instead of diagnostic tools. The solution lies in separating screening from evaluation, much like peer review separates triage from in-depth assessment.

  For the proposal itself, I land on a three-stage process: 
  1) Quantitative filters to identify clear cases of excellence or underperformance 
  2) Narrative review for borderline cases 
  3) Structured peer deliberation for final decisions. 

  This reduces workload while preserving nuance. Crucially, it makes metrics serve human judgment rather than override it.

  The tone must balance academic rigor with administrative pragmatism. I'll avoid jargon while respecting the intelligence of the audience. References to physics concepts (like Heisenberg uncertainty) should be subtle enough to resonate with the user's background without alienating others.

  Most importantly, the memo must preemptively address counterarguments. For metric advocates: show how this maintains efficiency gains. For narrative purists: demonstrate how metrics prevent network bias. The shared frustration with gaming becomes the very reason to adopt this balanced approach.
answer: |-
  **MEMORANDUM**  
  To: University Task Force on Research Impact Assessment  
  From: Dr. [Your Name], Task Force Member (Emeritus Professor, Physics)  
  Date: October 26, 2023  
  Subject: **Hybrid Assessment Model for 2024 Merit Review: Balancing Efficiency, Equity, and Scholarly Integrity**  

  ### **I. Context: Why Metrics Were Proposed**  
  Before addressing the pilot’s shortcomings, we must acknowledge the legitimate frustrations that motivated the Composite Research Impact Score (CRIS):  
  1. **Administrative Burden**: Narrative reviews consumed excessive time for faculty committees and administrators, delaying decisions.  
  2. **Opacity & Network Bias**: Subjective assessments often privileged pre-existing relationships, disadvantaging interdisciplinary work, early-career researchers, and underrepresented groups.  
  3. **Inconsistent Standards**: Vague criteria led to erratic outcomes across departments, undermining trust in merit processes.  
  CRIS aimed to inject objectivity, scalability, and transparency into evaluations. Its failure lies not in the *goal* of quantification, but in its *monolithic application* as a high-stakes replacement for holistic judgment.  

  ---

  ### **II. Recommendation: A Tiered Hybrid System for 2024**  
  I propose a **Two-Stage Review Process** for next year’s merit raises, blending efficiency with scholarly discernment:  

  #### **Stage 1: Quantitative Thresholds (Screening)**  
  - **Function**: Rapid identification of clear-cut cases (top 30% and bottom 30% of researchers).  
  - **Metrics**:  
    - Field-normalized citations (e.g., Citation Percentile ≥75% → Pass; ≤40% → Flag).  
    - Grant income (adjusted for field norms, excluding under $10k "minimal" grants).  
    - *Not Top-Quartile Publications*: Replace with **"Innovation Factor"** (IF):  
      - IF = (% publications in *pre-registered* or *registered reports* journals) + (% outputs with open data/code).  
      - *Rationale*: Incentivizes rigor/reproducibility over salami-slicing; null results gain value.  

  #### **Stage 2: Qualitative Narrative Review (Critical Cases)**  
  - **Scope**: Applied only to the middle 40% of researchers (neither clear-pass nor clear-fail via Stage 1).  
  - **Structure**:  
    - **Standardized Template**: 2-page narrative addressing:  
      - *Ambition*: Why was the research high-risk/high-reward?  
      - *Context*: Explains metrics anomalies (e.g., career stage, field norms, policy impact).  
      - *Engagement*: Teaching, mentorship, open science, public outreach.  
    - **Blinded Review**: External experts (outside personal networks) assess narratives using rubrics.  
    - **Reciprocity Safeguard**: Citation network analysis (automated) flags suspicious patterns for audit.  

  ---

  ### **III. Why This Addresses Both Sides’ Concerns**  
  | **Pro-Metrics Faction**                            | **Pro-Narrative Faction**                          |  
  |----------------------------------------------------|---------------------------------------------------|  
  | Retains efficiency: ~60% cases automated.          | Restores human judgment for nuanced cases.        |  
  | Metrics remain core for screening/transparency.    | Narratives contextualize, deter metric gaming.    |  
  | IF metric rewards integrity over volume.           | Blinding/review rubrics reduce network bias.      |  
  | Clear audit trail via documentation.               | Incentivizes non-quantifiable scholarly impact.   |  

  ---

  ### **IV. Mitigating Gaming & Unintended Consequences**  
  - **Minimal Units**: IF metric penalizes salami-slicing (low innovation density).  
  - **Reciprocal Citations**: Algorithmic flags trigger third-party audit; penalties apply.  
  - **Risk Aversion**: "Ambition" narrative section rewards justification for high-risk paths.  
  - **Equity**: Tiered system accounts for field differences (e.g., citation rates in theory vs. experiment).  

  ---

  ### **V. Implementation Timeline**  
  1. **Nov 2023**: Refine metrics/IF with department heads.  
  2. **Jan 2024**: Train committees on narrative rubrics/blinding protocols.  
  3. **Mar 2024**: Pilot hybrid review in Chemistry & Physics.  
  4. **Aug 2024**: Full task force evaluation of pilot data.  

  ---

  ### **Conclusion**  
  The CRIS pilot revealed a universal truth: **all metrics ossify when used as targets, not tools**. Our goal is not to abandon quantification, but to subordinate it to scholarly wisdom. This hybrid model honors the administrative need for efficiency while centering the *why* of research over the *what*. By treating metrics as diagnostic filters—not verdicts—we uphold both rigor and humanity in evaluation.  

  Respectfully submitted for deliberation.  

  ---  
  **Appendices**  
  - Draft Rubric for Narrative Assessment  
  - Innovation Factor Calculation Protocol  
  - Case Studies: Simulated Outcomes (Chemistry Pilot Re-analyzed)
