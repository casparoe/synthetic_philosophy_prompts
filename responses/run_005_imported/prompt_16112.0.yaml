prompt: |-
  So I'm about halfway through a historical novel set in early 1800s London, and one of my side characters is loosely based on Jeremy Bentham -- the utilitarian calculus, the panopticon obsession, all of it. While digging around for material, I found out that he secretly wrote an essay (I think it's called "Offences Against One's Self," or something close to that -- apparently it just sat in his papers until some scholar published it properly in the 20th century) defending the decriminalization of "paederasty," basically consensual sex between men, generations before anyone else dared put that in writing.

  I want to give my Bentham-ish character a big monologue scene where he faces down a bishop character and defends this, and my first instinct was to have him argue that people have a fundamental right to love who they want, since that's basically how we'd frame this arguement today. But a friend in my writing group who did a philosophy minor said that would be a weird thing for THIS particular guy to say, and that I'm missing something about how his actual reasoning worked -- especially since he's apparently the same guy who went around calling natural rights "nonsense upon stilts" or some phrase like that. I don't really get the tension though -- isnt "everyone has a right to do this" exactly the kind of thing an early defender of gay rights would say? Can you help me figure out what's actually going on so I can write the scene properly, and flag anything else about him I might be getting wrong?
