  First, I need to recall Bentham's key principles. He was a utilitarian, focused on maximizing happiness and minimizing pain. He famously criticized natural rights as "nonsense upon stilts," so framing arguments in terms of rights wouldn't be true to his character. Instead, he would base his argument on utility: how does criminalizing same-sex relationships affect societal happiness?

