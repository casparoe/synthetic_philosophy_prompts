answer: |-
  Here's a carefully constructed example, followed by the philosophical analysis and debate you requested, designed to fuel your hospice nurse's therapy scene:

  **The Stubborn Emotion Case: Professor Anya's Lingering Guilt**

  *   **The Event:** Professor Anya strongly recommended her brilliant but troubled student, Leo, for a prestigious, high-pressure fellowship she knew he deeply desired, believing the challenge might help him focus. Leo accepted, struggled immensely with the isolation and workload, suffered a severe mental health crisis, dropped out, and abandoned his academic career. He later told Anya he felt she pushed him into something he wasn't ready for.
  *   **The Judgment:** Years later, with perspective and evidence, Anya knows her judgment was flawed *in hindsight* but reasonable *at the time*. Leo's application was stellar, his enthusiasm genuine in their conversations. She had no access to the full depth of his private struggles he actively concealed. Multiple colleagues reviewed the case and unanimously agreed: given the information *she possessed*, recommending him was the right, supportive thing to do. Leo himself, after therapy, acknowledged his own role in masking his difficulties. Anya fully accepts this rational assessment: she made a recommendation based on good faith and available evidence; the outcome was tragic but unforeseeable; she bears no *reasonable* blame.
  *   **The Stubborn Emotion:** Despite this settled intellectual judgment, whenever Anya sees a notice for that fellowship, hears Leo's name, or even walks past his old department, a wave of profound guilt washes over her. It's a visceral sensation: tightness in her chest, a sinking feeling, a hot flush of shame. The thought "I broke him" or "I failed him" flashes, unbidden, even as her rational mind immediately counters "No, that's not true or fair."

  **Why This Poses a Problem for Judgment Theories (Solomon, Nussbaum):**

  Judgment theorists (often called "cognitivists") argue that emotions *just are* or *essentially involve* evaluative judgments about the world relevant to our concerns.

  *   **Core Claim:** To feel guilt *is* to judge that one has done something wrong or failed in an obligation.
  *   **The Problem for Anya (and Your Nurse):** Anya's *considered, stable, reflective judgment* is that she is *not* blameworthy. She has evaluated the evidence and concluded she bears no culpability. According to the judgment theory, her guilt *should vanish* or *never arise* once this judgment is firmly in place. The persistence of the guilt feeling in direct contradiction to her sincere judgment seems impossible on this view. It suggests the emotion (guilt) is not *identical* to the judgment (not blameworthy). It appears as an independent, recalcitrant state.
  *   **The Analogy Breakdown:** If guilt *is* the judgment "I did wrong," then changing that judgment *should* change the emotion as instantly and completely as changing the belief "It's raining" changes the associated thought. But Anya's guilt persists despite the changed belief. This makes her emotion seem irrational in a way that challenges the theory's core equation.

  **How Perceptual Theories (Prinz, Tappolet) Handle It More Gracefully (The Illusion Analogy):**

  Perceptual theorists argue that emotions are more like perceptions of value properties in the world (or in our relation to it). They are fast, automatic, embodied responses, often sub-personal.

  *   **Core Claim:** Feeling guilt *is like perceiving* "blameworthiness-here" or "wrongdoing-by-me," just as vision perceives "redness" or "squareness."
  *   **The Advantage for Anya (and Your Nurse):** Just as you can *see* the stick in water as bent while *knowing* (judging) it's straight (the Müller-Lyer illusion), Anya can *feel* guilt (perceive blameworthiness) while *knowing* (judging) she's not blameworthy. The perceptual system (emotional appraisal) delivers one output ("blameworthiness detected!"), while higher cognition delivers another ("false alarm based on current evidence"). The persistence of the feeling is no longer a paradox; it's the stubborn output of an automatic system that hasn't been fully "recalibrated" by the new judgment.
  *   **The Analogy Strength:** The visual illusion persists despite knowledge because perception is modular and fast. Similarly, Anya's emotional system was powerfully calibrated by the traumatic event (Leo's downfall following *her* recommendation). That association ("My action led to catastrophe") formed a deep groove. The new judgment is like the knowledge about the stick – it operates at a different cognitive level and doesn't instantly rewire the automatic perceptual/emotional response. This explains the nurse's "hot flush" – it's the embodied perception flaring up before cognition can dampen it.

  **The Judgment Theorist's Strongest Rejoinder:**

  Judgment theorists don't simply give up. Their best counter-arguments involve refining the concept of "judgment":

  1.  **Submerged Judgments:** Anya *does* still hold the blameworthy judgment, but it's unconscious or "sub-doxastic." Perhaps a part of her *does* believe "I should have known," "I ignored subtle signs," or "My desire for him to succeed blinded me," even if her conscious, rational mind rejects these. The guilt feeling *is* the manifestation of this deeper, perhaps irrational, but still *judgmental*, belief.
  2.  **Judgment as Process/Disposition:** "Judgment" isn't just a single, static proposition held at a moment. It's a complex dispositional state. Anya's *overall* evaluative framework might still contain elements that, in specific triggering contexts (seeing the fellowship notice), activate latent evaluative patterns associated with the blame judgment, even if her dominant reflective stance rejects it. The guilt *is* the activation of that latent judgmental pattern.
  3.  **Counterfactual Judgments:** Anya judges *counterfactually*: "If I hadn't recommended him, he wouldn't have suffered." While she knows she couldn't have foreseen it, the counterfactual link ("My action caused harm") remains affectively potent and *is* the core judgment constituting guilt, regardless of foreseeability. The judgment of "causal responsibility for harm" persists and *is* the guilt, even if moral blame is absent.
  4.  **Focus on the Nurse:** For your character, the judgment theorist might argue: Her conscious judgment is "I'm not blameworthy," but a deeper, perhaps unacknowledged judgment persists: "I should have died instead of her," or "My survival *is* the wrong." The guilt feeling *is* this deeper existential judgment manifesting.

  **Where the Perceptual Account Faces Difficulties:**

  The perceptual view isn't without its own challenges:

  1.  **Richness of Object & Conceptual Penetration:** Visual perception has relatively simple objects (colors, shapes, basic motions). Emotions seem to have incredibly rich, conceptually laden objects: Anya's guilt is about *her specific action*, *Leo's specific suffering*, *her role as mentor*, *academic ideals*, *betrayal of trust*. Can a perception-like, modular system really represent such complex, culturally and personally nuanced objects without significant cognitive (judgmental) input? Vision doesn't need concepts like "betrayal" or "fellowship prestige" to work; emotion seems inextricably tied to them. This suggests emotions *are* more judgment-laden than perceptions.
  2.  **Responsiveness to Reason:** While emotions can be stubborn, they *are* ultimately more responsive to reasoning and changes in belief over time than visual illusions. You can't reason away the Müller-Lyer illusion, but therapy, new evidence, and cognitive reframing *can* (often gradually) change emotional responses. If emotions were purely perception-like modules, shouldn't they be *more* resistant to cognitive influence than they actually are? Their susceptibility to cognitive therapy suggests a tighter link to judgment than to encapsulated perception.
  3.  **The Ambiguity of "Value Properties":** What *are* these perceived value properties? "Blameworthiness," "dangerousness," "offensiveness"? These seem just as complex and concept-dependent as the judgments the perceptual theorist wants to avoid. Defining them independently of human judgments and concerns is notoriously difficult. Isn't perceiving "blameworthiness" just *another way* of saying "making a blameworthiness judgment"?

  **Implications for Your Therapy Scene:**

  *   **Avoiding Simplistic "Winner" Takeaway:** The scene shouldn't conclude with the therapist saying, "Ah, your guilt is just a perceptual illusion!" or "You secretly still judge yourself guilty!" That shuts down the complexity.
  *   **Embrace the Tension:** Let the therapist articulate *both* perspectives as ways of understanding the stubbornness. "Your rational mind knows the truth, Carol, but your nervous system, forged in that moment of unbearable loss, still screams 'Guilty!' It's like an echo, powerful but not reflecting the current reality." (Perceptual) *Then* probe: "But what *is* that echo saying, even now? What part of the story does your mind still cling to, despite everything?" (Judgment, seeking submerged beliefs/counterfactuals).
  *   **Focus on the Lived Experience:** The philosophical debate provides framework, but the *power* is in Carol's visceral description of the "hot flush," the specific triggers, the immediate, unbidden thoughts ("I should have..."), and the subsequent rational counter-argument she gives *herself* ("It was icy, the truck was speeding, the EMTs said..."). Highlight the *gap* between the felt reality and the known reality.
  *   **Therapy as Navigating the Gap:** The therapist's role isn't to resolve the debate but to help Carol *live with and understand* this gap. Strategies might involve acknowledging the perceptual power ("That flush is your body remembering the trauma, it's not a verdict") while also gently exploring if any lingering, perhaps unarticulated, judgments fuel its persistence ("Do you feel, somewhere deep down, that surviving *was* the betrayal?"). The goal isn't to crown a theory but to help Carol find a way to hold both the rational truth and the persistent feeling without the latter destroying her.

  By grounding the discussion in a parallel example and laying out the philosophical tug-of-war fairly, your therapy scene can achieve the intellectual ballast and authentic complexity you desire, moving beyond pop psychology into the profound puzzle of why our hearts refuse to always listen to our heads.
