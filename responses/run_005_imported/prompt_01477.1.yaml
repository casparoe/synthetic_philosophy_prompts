answer: |-
  That's a heartbreaking and incredibly nuanced situation for your aunt, and a fascinating philosophical/clinical dilemma for your writing. You've hit on one of psychiatry's most enduring debates. There *is* a distinction, but it's not always a bright, clear line – it's more like a threshold defined by several intersecting factors:

  1.  **Duration and Intensity:** Normal grief ebbs and flows, gradually integrating into life over months to a couple of years. Prolonged Grief Disorder (PGD) is characterized by persistent, intense, and disabling grief symptoms that remain largely unchanged and overwhelming **beyond 12 months** (for adults) after the death. It's not just *still* grieving; it's being *stuck* in the acute phase.
  2.  **Functional Impairment:** This is the **crucial differentiator**. PGD isn't diagnosed simply because someone is sad after a year. It's diagnosed when grief significantly impairs the ability to function in major life domains:
      *   **Socially:** Like your aunt barely leaving the house, withdrawing from relationships.
      *   **Occupationally:** Unable to work or perform daily tasks.
      *   **Psychologically:** As with your aunt's constant crying, severe sleep disruption, inability to experience positive emotions or plan for the future.
      *   **Physically:** Often manifests as somatic symptoms (aches, fatigue) or neglect of health.
  3.  **Specific Symptoms:** PGD has defined criteria (DSM-5-TR) beyond just sadness. Key features include:
      *   Persistent, intense yearning/longing for the deceased.
      *   Preoccupation with thoughts/memories of the deceased.
      *   Intense emotional pain (sorrow, anger, guilt).
      *   Difficulty accepting the death.
      *   Feeling numb or detached.
      *   Feeling life is meaningless without the deceased.
      *   Intense loneliness.
      *   Avoidance of reminders of the loss *or* preoccupation with reminders.
      *   Identity disruption (feeling like part of oneself died).
      *   Difficulty engaging in ongoing life or planning for the future.
  4.  **Deviation from Cultural Norms:** While grief expressions vary, PGD represents a pattern that falls significantly outside the expected trajectory *within that person's cultural context* and causes distress *to them*.

  **Addressing the Core Conflict:**

  *   **Your Aunt's Relief:** Is valid. A diagnosis like PGD provides:
      *   **Validation:** Confirms her suffering is real, recognized, and not just "weakness" or "not trying hard enough." It names the enemy.
      *   **Understanding:** Offers a framework to understand *why* she feels so stuck.
      *   **Pathway to Treatment:** Legitimizes her need for help beyond "waiting it out." Therapy specifically for PGD (like Complicated Grief Therapy) targets the *stuckness*, not the grief itself. Medication might address co-occurring issues like severe depression or debilitating anxiety/insomnia *enabling* her to engage in therapy and the grieving process.
  *   **Your Mom's Perspective:** Also has validity and reflects a common concern:
      *   **Respecting Grief:** Deep grief *is* a testament to love. Medicalizing normal variations of human experience *is* a risk in psychiatry.
      *   **Pathologizing Normality:** The fear is that labeling intense grief as a "disorder" implies it's inherently wrong or needs "fixing," potentially stigmatizing natural sorrow.
      *   **Timeline Pressure:** Imposing an arbitrary timeline can feel dismissive ("Shouldn't you be over it by now?").

  **The Principled Line (as best as it exists):**

  The distinction hinges on **persistent, severe functional impairment caused by a specific cluster of symptoms that deviates significantly from the expected grieving process for that individual and culture, beyond a defined timeframe.**

  *   **It's NOT just:** "Still grieving intensely after X months."
  *   **It IS:** "Grief is so intense, persistent, and all-consuming after X months that it completely paralyzes my ability to live *any* aspect of my life, and I see no path forward."

  **The Role of Doctors & Insurers:**

  *   **Doctors (Ideally):** Use diagnostic criteria (like DSM-5-TR for PGD) based on research showing a distinct cluster of symptoms causing significant harm, differing from normal grief and other disorders like depression. The goal is identification for effective treatment.
  *   **Insurers:** Undeniably play a role. A formal diagnosis is often the *gateway* to accessing specialized therapy (like CGT) or justifying medication. This is a practical reality, not necessarily the *origin* of the diagnosis, but it influences how diagnoses are applied and perceived. The risk is over-diagnosis for access or under-diagnosis for denial of coverage.

  **For Your Book Character:**

  This tension is *gold* for character development and plot. Don't feel you need to resolve it definitively for the reader. Explore both sides:

  1.  **The Relief of the Label:** Show the character feeling seen, validated, understanding *why* they feel so trapped. Show them accessing resources (therapy, maybe meds) that finally start to loosen the grip, *not* to stop grieving, but to grieve *differently* – to integrate the loss rather than be consumed by it.
  2.  **The Resentment/Offense:** Show another character (or a part of the protagonist) echoing your mom. "This is just love! Calling it a disorder is an insult to what we had. They want me to medicate away my love?" Show the fear that treatment means forgetting or betraying the lost loved one.
  3.  **The Nuance:** Have a therapist character explain the *functional impairment* aspect: "It's not about the depth of your love or how long you miss him. It's about the fact that this pain has completely imprisoned you. Treatment isn't about stopping your grief; it's about freeing you from this prison so you *can* grieve *and* live, carrying him with you in a different way."
  4.  **The Journey:** Show the character grappling with this. Does the diagnosis initially feel like a lifeline or an insult? Do they resist treatment? Does medication provide just enough relief from the debilitating anxiety/insomnia to allow them to *begin* processing the grief in therapy?

  **Conclusion:**

  The line between intense normal grief and PGD is real and defined by persistent, disabling functional impairment beyond the expected timeframe. It's not merely "taking longer." While the *label* and its implications can feel medicalizing, its purpose is to identify profound suffering that isn't resolving and provide targeted help. Your aunt's relief is understandable – she finally has a name for what's holding her captive. Your mom's protectiveness is understandable – she doesn't want her sister's profound love pathologized. Both perspectives hold truth. For your character, lean into that conflict; it mirrors a real, complex human experience and avoids a simplistic "right vs. wrong" resolution.
