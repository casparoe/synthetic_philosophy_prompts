  Here’s a concise, heartfelt toast that bridges both audiences while staying true to the philosophy—clocking in at just under 5 minutes when delivered warmly:

  ---

  **(Raise glass, smile at sister and partner)**  
  "To [Sister’s Name] and [Partner’s Name]—two brilliant minds, one beautiful future.  

  Now, [Sister’s Name], as many of you know, has dedicated her career to a fascinating question: **How do groups make decisions?** Specifically, how do we merge many individual judgments into one collective choice? And she’s uncovered something wonderfully strange: sometimes, when a group votes on each *reason* for a decision, they reach a totally different outcome than if they’d voted on the *final choice* directly.  

  *(To philosophers, wryly)*  
  Yes, I see half of you nodding—you know it as the *discursive dilemma*. The rest of you? Think of it like this: imagine three friends voting on whether to watch a movie.  
  - *Is it a comedy?* Majority says YES.  
  - *Does it have explosions?* Majority says YES.  
  - *Should we watch it?* Majority says NO.  
  Logically, that makes no sense—but somehow, it happens!  

  **(Pivot to couple, gentle humor)**  
  This is where my joke comes in, [Sister]. When I heard you were getting married, I thought: *Oh no—the ultimate judgment aggregation problem!* Two people, merging separate lives into one shared view of the world. Will you vote premise-by-premise? ‘He squeezes toothpaste from the middle: REJECTED. She hates camping: REJECTED.’ Suddenly, the whole marriage gets voted down!  

  **(Key insight, warmly)**  
  But here’s what your work *actually* teaches us, [Sister]: **Wisdom isn’t tallying votes on every premise. It’s choosing the conclusion first.** You two didn’t build this marriage by auditing each other’s quirks. You chose the conclusion years ago: *‘We belong together.’* Every small disagreement—the thermostat wars, the ‘how-to-load-the-dishwasher’ debates—gets filtered through that bigger truth.  

  **(To the room)**  
  The philosophers here know this as avoiding *systematic inconsistency* by prioritizing holistic judgment. The rest of us? We call it love. You focus on the shared conclusion—‘This is my person’—and suddenly, the premises rearrange themselves. His mismatched socks? A charming quirk. Her 5 AM philosophy reading? Admirable dedication.  

  **(Closing tribute)**  
  So let’s toast to [Sister] and [Partner]: masters of conclusion-based aggregation. You’ve shown us that when you start with an unshakeable ‘YES’ to each other, every conflicting premise becomes a footnote. Your marriage isn’t a committee vote—it’s a shared verdict, renewed daily. May your judgments always align in joy.  

  **(Raise glass higher)**  
  To the happy couple—proof that some dilemmas are best resolved by choosing love first!"  

  ---

  **Why this works:**  
  - **Accuracy:** The joke hinges on *premise-based vs. conclusion-based* aggregation (real terms), without misrepresenting the dilemma as irrationality. It’s a structural quirk, not faulty logic.  
  - **Philosophers:** Nods to aggregation methods, systemic inconsistency, and the field’s framing—letting them feel "seen."  
  - **Non-experts:** Relatable metaphors (movie night, toothpaste, thermostats) and plain language ("bigger truth").  
  - **Heart:** The pivot to "choosing the conclusion first" reframes the joke as a tribute to their commitment.  
  - **Time:** 490 words ~ 4.5 minutes with pauses.  

  Deliver with affection, and watch the philosophers chuckle while Grandma beams. Cheers!
