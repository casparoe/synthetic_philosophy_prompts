answer: |-
  Here’s a dialogue grounded in the historical-philosophical dispute you’ve described. The exchange focuses on logical precision, respects both characters' intellectual traditions, and isolates the core premise they disagree on by the end.

  **Characters:**  
  *   **CALLIAS:** Adviser trained in the Megarian school (follower of Diodorus Cronus). Calm, analytical.  
  *   **HELENA:** Adviser trained in the Aristotelian Lyceum (Peripatetic). Sharp, pragmatic but deeply logical.  
  *   **NARRATOR (Internal):** Observes.  

  **(The scene: A command tent on Rhodes. Maps are strewn across a table. Callias stares at a marked position at sea; Helena sharpens a stylus. The distant sound of waves and ship timbers groaning.)**

  **CALLIAS:** (Without looking up) Helena. Does the outcome of tomorrow’s clash reside within our hands tonight? Or are we merely polishing the brass on a ship already sunk?

  **HELENA:** (Pauses her sharpening) A question worthy of the Stagirite himself, Callias. Though he might chide you for framing it as *either* helplessness *or* omnipotence. The outcome resides… *partly* in our hands, partly in the hands of the gods, the sea, and the enemy. Hence this planning.

  **CALLIAS:** Planning assumes possibility. Possibility requires openness. Consider Diodorus’s pillars. First: Every truth about the past is now necessary. Agreed? Yesterday’s wind *was* northerly; it is now impossible it was southerly.

  **HELENA:** (Nods cautiously) The past is fixed. Necessarily so. A tautology. What of it?

  **CALLIAS:** Second: Nothing impossible follows from what is possible. If it’s possible for me to walk to the harbor tonight, then it cannot be impossible that I *am* walking to the harbor tonight. Possibility transmits consequence.

  **HELENA:** I follow. Though ‘follows’ can be slippery. But proceed.

  **CALLIAS:** Now, apply this to tomorrow. Suppose it is *true right now* that we win tomorrow. If that is true *now*, then it was *always true* in the past that we would win tomorrow. Yes?

  **HELENA:** (Frowning) If it *is* true now, then... yes, it was true yesterday, last month... a truth about the future was present in the past. But its *being* true then didn’t make it *necessary* then. It was still contingent then.

  **CALLIAS:** But *now*, that past truth – “It is true that the Rhodians win on such-and-such a day” – is a truth *about the past*. And by our first pillar, truths about the past are now necessary. So, the past truth that we win tomorrow is now necessary. Therefore, our winning tomorrow is necessary. It *must* happen.

  **HELENA:** Ah. The joint. You slide from the necessity *of the past proposition* to the necessity *of the future event* it describes. That past proposition – “It was true on the eve that we win” – is indeed now necessary. It cannot be changed. But *what made it true*? The *future event itself*! The necessity applies to the *truth-value being fixed in the past*, not directly and inherently to the *event* being necessary *in itself*.

  **CALLIAS:** How can you separate them? If it was *true* yesterday that we win tomorrow, then tomorrow’s victory is a necessary consequence of that past truth. And since that past truth is now necessary, the consequence is necessary. Possibility transmits, remember? If it were *possible* tomorrow that we lose, despite it being *true* yesterday that we win, then an impossibility would follow from a possibility: that a true thing could become false. But truths don't change.

  **HELENA:** You conflate logical consequence with causal necessity. The *proposition* "We win tomorrow" being true yesterday logically entails that we *do* win tomorrow. But this entailment doesn't mean the victory was *causally necessary* yesterday! Its truth depended entirely on the *contingent* events of tomorrow playing out as they did. The necessity is in the *correspondence*, not in the *event*.

  **CALLIAS:** Then answer this: Is the proposition "The Rhodians win tomorrow's battle" *either true or false* right now? Aristotle himself, in *Peri Hermeneias*, pondered this very sea battle. He saw the difficulty.

  **HELENA:** (Leans forward, eyes sharp) *That* is the heart of it, isn't it? Diodorus assumes it *must* be true or false *now*. The Master Argument requires it. But perhaps... perhaps not. Perhaps for genuine future contingents – events not yet determined by necessary causes – the proposition simply *lacks* a definite truth value *now*. It is neither true nor false *yet*.

  **Callias:** (A rare flicker of surprise, then intensity) Deny the Law of Excluded Middle? For *this* proposition, *now*? Helena, that is a desperate gambit. Look around! The fleet is ready, the enemy approaches. To say "It is neither true nor false that we win" feels like denying the reality pressing upon us. It *is* going to happen *one way or the other*. Surely that disjunction *is* true now: *Either* we win *or* we lose. And that disjunction *is* necessary.

  **Helena:** Necessarily *(Either we win or we lose)*? Absolutely! That disjunction is always true, always necessary. But that is *not* the same as saying *(Necessarily we win) or (Necessarily we lose)*! That is your fatalist fallacy, Callias! The necessity belongs to the *disjunction itself*, not distributed to its parts. It is necessary that *one or the other* happens, but *which one* remains contingent until it happens. Your Master Argument silently shifts the scope of the necessity.

  **Callias:** (Quietly) So you grant the necessity of the past, you grant that nothing impossible follows from the possible... but you deny my third, unspoken pillar: that if a proposition about a future event is *true* (or *false*) *now*, then that event is *necessary* (or *impossible*). That is the joint you pry apart.

  **Helena:** Precisely. That is where Diodorus stumbles. Truth *now* does not entail *causal or absolute necessity* for the future event. It entails only that the event *will* (or *will not*) *happen*. But *how* it happens – through chains of cause, chance, and yes, our deliberations tonight – remains within the realm of the contingent. The truth *supervenes* on the event, it does not *dictate* it with ironclad necessity from eternity.

  **Callias:** So our disagreement narrows to this single point: Does the present *truth* (or falsity) of a future contingent proposition *itself* imply the *necessity* of the event described?

  **Helena:** It does not. The truth value is a *logical consequence* of the event's occurrence, fixed only *when* it occurs. Attributing truth *now* doesn't magically inject necessity into the causal chain leading to it. The sea tomorrow may be calm or rough; the proposition "The sea is calm tomorrow" is not *yet* true or false, and even if it were, its truth wouldn't *force* the sea to be calm. The necessity is retrospective, not prospective.

  **(A tense silence hangs. Neither has conceded. The fundamental premise dividing them – the inference from present truth to future necessity – stands exposed.)**

  **NARRATOR:** (Internal) *Aristotle’s ghost hovered between them – not over a hypothetical sea, but ours. Callias saw the fixed stars of truth dictating the waves; Helena saw the waves, still forming, dictating the truth. The joint was clear: does truth now forge necessity, or merely report on what will be? The lamps flickered. Tomorrow’s battle, contingent or fated, would decide more than the fate of ships.*

  This dialogue achieves your goals:

  1.  **Equal Footing:** Both present sophisticated arguments. Callias is methodical, not resigned; Helena is logical, not merely motivational.
  2.  **Logical Core:** The exchange hinges on the modal scope distinction (Helena's key point) and the nature of truth-value assignment to future contingents (Callias's challenge).
  3.  **Direct Engagement:** Each responds to the other's last point (e.g., Helena directly addresses Callias's challenge on truth-value after his "Is it true or false now?" question).
  4.  **Identified Disagreement:** The final lines explicitly state the core premise they disagree on: "Does the present *truth*... imply the *necessity*...?" Callias affirms it; Helena denies it.
  5.  **No Resolution:** The stalemate feels authentic to the historical/philosophical dispute.
  6.  **Historical Context:** References to Diodorus, the Master Argument pillars, Aristotle's *Peri Hermeneias*, and the Lyceum tradition are woven in naturally.
  7.  **Narrator's Nod:** The narrator explicitly remarks on the coincidence of Aristotle's sea battle example.

  You can easily adapt the language and integrate this seamlessly into your scene, adding specific naval details or character nuances as needed. The core philosophical conflict is clearly dramatized.
