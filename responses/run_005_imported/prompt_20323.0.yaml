  Okay, let me start by unpacking the user's query. They're teaching a graduate seminar on reference and modality, specifically focusing on Kripke's arguments against descriptivism and then moving to Chalmers and Jackson's two-dimensionalism. The student's objection is that primary intensions are just disguised descriptions, so they inherit all of Kripke's criticisms. The user wants a rigorous, charitable version of this argument to address next week.

  First, I need to recall Kripke's three main arguments: modal, epistemic, and semantic. The student claims that even though two-dimensionalism separates primary and secondary intensions, the primary intension still acts as a reference-fixing description, making it vulnerable to those same arguments. 

  Hmm, the key here is whether primary intensions are fundamentally descriptive. Chalmers presents them as a priori accessible conditions, but if specifying them requires a description—like "the clear, drinkable liquid in our environment"—then doesn't that reintroduce descriptivism? For example, in the epistemic argument, Kripke says that if names were descriptions, "Hesperus is Phosphorus" would be knowable a priori, but it's not. If the primary intension uses a description to fix reference, wouldn't that make the identity a priori too? But in two-dimensionalism, the primary intension might pick different referents in different scenarios, so "water is H2O" isn't a priori. Wait, but the objection is that the description itself is what's a priori, not the identity. So the student has a point.

  Then there's the modal argument. Kripke says descriptions can't handle counterfactuals correctly. If "water" is fixed by a description, then in a world where XYZ is in the lakes, "water" would refer to XYZ. But Kripke argues that "water" rigidly designates H2O, so in that world, it's still H2O. Two-dimensionalists say secondary intensions handle rigidity, but the primary intension still allows different referents in different scenarios. The objection would be that the primary intension, being descriptive, fails to capture rigidity, which is exactly what Kripke criticized.

  The semantic argument (Gödel/Schmidt) shows that a description might pick the wrong referent if someone else fits it better. If the primary intension is a description like "the dominant clear liquid," then in a scenario where someone else put XYZ in the lakes, it might refer to XYZ instead of the actual water (H2O). But Kripke says the actual referent is fixed by baptism, not by who fits the description later. So again, the primary intension seems to misrepresent how reference works.

  I need to ensure the argument is rigorous. The student's core claim is that primary intensions are reference-fixing descriptions, so they're susceptible to the same issues. Two-dimensionalists might respond that primary intensions aren't descriptions but conceptual roles or something else. But if specifying them requires descriptive conditions, then maybe they collapse into descriptivism. 

  Also, the user mentioned that Kripke's arguments don't depend on descriptions being simple or conscious. So even if primary intensions are complex or dispositional, the objections still hold. For instance, in the epistemic case, any reference-fixing description would make identities a priori if the description is a priori. But identities are a posteriori, so there's a problem.

  I should structure the argument by reconstructing each of Kripke's points applied to primary intensions. Then address possible counterarguments, like two-dimensionalism distinguishing scenarios from counterfactual worlds. But the objection might say that even in scenarios, the descriptive condition is what's doing the work, leading to the same pitfalls.

  The user wants this for a graduate seminar, so the response needs to be philosophically nuanced. Highlighting where the two-dimensionalist might push back—like denying that primary intensions are descriptive or emphasizing their role in explaining cognitive significance without committing to descriptivism. But the student's challenge is strong because if primary intensions function descriptively, then the objections resurface. 

  I need to make sure the reconstruction is charitable. Maybe the student isn't saying two-dimensionalism is useless, but that it hasn't escaped descriptivism's problems. The user probably wants to acknowledge the force of the objection while showing how two-dimensionalists might defend their framework. However, the task is to present the student's argument as strongly as possible, so I'll focus on that.
answer: |-
  Here is a rigorously constructed, maximally charitable version of the student's objection, framed as a systematic argument that epistemic two-dimensionalism (E2D) fails to overcome Kripke's core anti-descriptivist arguments. The core claim is that **primary intensions (PIs) function as *reference-fixing descriptions* in all philosophically relevant respects, rendering E2D a variant of descriptivism vulnerable to Kripke's original objections.**

  ### Core Premise: The Descriptive Nature of Primary Intensions
  1.  **Specification Requires Description:** To assign a PI to a term like "water," one *must* articulate a general condition that determines its extension across epistemically possible scenarios (e.g., "the dominant, clear, drinkable liquid in the environment of the agent at the center of the scenario" or "the watery stuff").
  2.  **A Priori Accessibility Implies Conceptual Content:** The claim that competent speakers can *a priori* know the PI entails that this condition is part of the speaker's conceptual competence with the term. It is not derived from empirical knowledge of the world's constitution.
  3.  **Reference-Fixing Role:** The PI is explicitly designed to play the role of fixing reference relative to a scenario. It tells us *what* the term would refer to *if* the scenario turned out to be actual. This mirrors the descriptivist view of reference-fixing via a description.
  4.  **Conclusion on PIs:** Therefore, the PI *just is* a reference-fixing description (RFD) – a conceptually grounded, a priori accessible condition that determines extension across possibilities (epistemic scenarios). While it may be dispositional, context-sensitive, or idealized, this does not change its fundamentally descriptive *functional role* in the theory.

  ### Applying Kripke's Arguments to Primary Intensions
  If PIs are RFDs, then Kripke's arguments apply directly:

  1.  **The Modal Argument (Against Rigidity of Descriptions):**
      *   **Kripke's Point:** Descriptions are typically non-rigid. "The inventor of bifocals" picks out Franklin in the actual world but someone else in a counterfactual world where someone else invented bifocals. Names/natural kind terms are rigid designators – they pick out the same object in all possible worlds where it exists.
      *   **Application to PIs:** The PI of "water" is explicitly *non-rigid* across epistemic scenarios. In scenario S1, it picks out H₂O; in scenario S2, it picks out XYZ. Its *function* is to vary reference based on how the scenario satisfies the descriptive condition.
      *   **Problem for E2D:** Kripke's rigidity argument shows that names/natural kind terms *do not* behave like non-rigid descriptions. However, the PI *itself* behaves exactly like a non-rigid description across scenarios. While E2D *adds* the rigid secondary intension (SI) to handle counterfactual worlds, the core objection remains: **The theory *attributes* a non-rigid, descriptive element (the PI) to the meaning of rigid designators as an essential component of their cognitive role.** Kripke argued rigid designators *lack* such a descriptive meaning component determining reference across worlds. The PI reintroduces it for epistemic scenarios.

  2.  **The Epistemic Argument (Apriority of Identities):**
      *   **Kripke's Point:** If "Hesperus" meant "the brightest star in the evening sky" and "Phosphorus" meant "the brightest star in the morning sky," then "Hesperus is Phosphorus" would be knowable *a priori* by analyzing the meanings (since one could deduce that the brightest evening star = the brightest morning star). But we know this identity *a posteriori*. Therefore, names don't have descriptive meanings like that.
      *   **Application to PIs:** Consider "Water is H₂O." The PI of "water" is something like D (the watery stuff). The PI of "H₂O" is something like "the substance with molecular structure H₂O" (assuming it's introduced by description). Crucially, D and "H₂O" have *different* primary intensions. D picks out H₂O in the actual scenario but XYZ in Twin Earth. "H₂O" picks out H₂O in *every* scenario where it exists. Therefore, the statement "Water is H₂O" is *not* true in all epistemic scenarios (it's false in the XYZ scenario). Its primary intension is contingent.
      *   **Problem for E2D:** E2D avoids making the identity *a priori* at the level of primary intensions. *However*, the objection strikes deeper: **The *reference-fixing descriptions themselves* (the PIs) are claimed to be *a priori* accessible.** If "water" has PI D, and "H₂O" has PI "substance with structure H₂O," then the *non-identity* of the referents picked out by D and "H₂O" in some scenarios (e.g., XYZ) is *a priori* knowable. One can know *a priori* that it's *epistemically possible* that water is *not* H₂O. But Kripke's point is that before empirical investigation, we *didn't* know it was possible that water wasn't H₂O; we merely *didn't know* that it was necessary. The deep intuition Kripke exploits is that the identity *felt contingent* – but this feeling of contingency is explained by E2D *only* by attributing to speakers the *a priori* knowledge that D and "H₂O" *could* pick out different things. This attributes far more specific *a priori* conceptual knowledge about the independence of superficial properties and underlying structure than Kripke (or the student) thinks speakers possess. The PI-D *is* the problematic description, and knowing its contingency relative to the "H₂O" description *is* an *a priori* consequence of knowing the PIs.

  3.  **The Semantic Argument (Gödel/Schmidt & Reference Failure/Misreference):**
      *   **Kripke's Point (Gödel/Schmidt):** Suppose descriptivism claims "Gödel" means "the prover of the incompleteness of arithmetic." In a scenario where Schmidt proved the theorem and Gödel stole it, descriptivism would misassign "Gödel" to Schmidt in that scenario, contrary to our intuition that we still refer to Gödel (the thief). Reference is determined by causal-historical chains, not satisfaction of associated descriptions.
      *   **Application to PIs:** Consider "water" with PI D (the watery stuff). Now consider an epistemic scenario S*:
          *   S* is centered on Earth.
          *   In S*, the clear, drinkable liquid in oceans/lakes is XYZ (introduced by aliens, say).
          *   However, H₂O also exists on Earth in S*, trapped deep underground, completely isolated, with all the same superficial properties as XYZ (if sampled).
          *   Crucially, the *actual* causal-historical chain of our use of "water" traces back to baptisms involving *this hidden H₂O*, not the XYZ in the lakes.
      *   **Problem for E2D:** According to the PI (D), "water" refers to XYZ in S*, as it is the dominant watery stuff in the environment. However, Kripke's intuition (and the causal-historical theory) strongly suggests that we would *still* refer to H₂O in this scenario, because our term is causally anchored to H₂O, regardless of what satisfies D *now* in the scenario. **The PI, functioning as a RFD, misassigns reference in S* to XYZ, precisely mirroring the Gödel/Schmidt problem.** It prioritizes satisfaction of the descriptive condition over the causal-historical origin. While E2D might use the *actual* world to fix the secondary intension (rigidly designating H₂O in counterfactuals), the *primary* intension – which is central to explaining cognitive significance and epistemic possibility – commits the same descriptive error within the epistemic dimension. The scenario S* seems epistemically possible *a priori*, yet the PI assigns the wrong referent.

  ### Synthesis: The Explanatory Advantage Claim Falters
  *   **Notational Variant Claim:** E2D's claimed advantage over classical descriptivism is its ability to handle rigidity and the necessary *a posteriori* via the SI while preserving cognitive significance via the PI. However, this objection argues the PI *is* a sophisticated RFD. E2D thus becomes a *two-component descriptivism*: a non-rigid RFD (PI) for epistemic modality/cognitive role, and a rigidified description ("the actual satisfier of D") for metaphysical modality. Kripke's arguments targeted the *explanatory adequacy* of RFDs *as components of meaning/reference-fixing*.
  *   **Inheritance of Problems:** Kripke's arguments demonstrate that RFDs:
      (a) Fail to capture rigidity (Modal Arg) – PI fails this for epistemic scenarios.
      (b) Incorrectly imply specific *a priori* knowledge about possibilities/contingencies (Epistemic Arg) – PI requires such knowledge.
      (c) Are susceptible to reference failure/misreference in scenarios where satisfaction and causal origin diverge (Semantic Arg) – PI commits this error.
  *   **Conclusion:** By grounding cognitive significance and epistemic possibility in a RFD (the PI), E2D reintroduces the very elements Kripke showed were incompatible with the behavior of names and natural kind terms. The SI handles rigidity and necessity, but only by *externalizing* the reference-fixing to the actual world, leaving the PI to shoulder the descriptive burden for the "cognitive" aspects. Kripke's arguments show that this descriptive burden cannot be shouldered adequately. Therefore, E2D earns no *fundamental* explanatory advantage over classical descriptivism; it merely redistributes the descriptive element into a distinct dimension, where Kripke's objections resurface undiminished against that element.

  ### Strengths of this Reconstruction
  1.  **Charity:** It grants E2D its core machinery (scenarios, centered worlds, separation of PI/SI) and focuses precisely on the *nature* of the PI itself.
  2.  **Rigor:** It directly maps each Kripkean argument onto the PI, showing the structural similarity in the problems encountered.
  3.  **Focus on Function:** It argues that the *functional role* of the PI *as a reference-fixer across possibilities* makes it descriptivist in the sense Kripke critiqued, regardless of its dispositional or idealized nature.
  4.  **Hits the Selling Point:** It directly challenges E2D's claim to resolve the tension Kripke identified, arguing the tension is reintroduced within the epistemic dimension via the PI.
  5.  **Highlights the Central Tension:** It forces the question: *Can the PI avoid being a description while still performing its intended explanatory work?* If it *must* be specified descriptively to determine extensions in scenarios, the objection stands.

  This formulation provides a formidable challenge. A strong response would need to either: (1) deny that PIs *must* be understood as reference-fixing descriptions (e.g., argue they are primitive conceptual roles, or fixed by non-descriptive mechanisms even in scenarios), (2) argue that the ways PIs escape Kripke's arguments are significant enough (e.g., handling the necessary *a posteriori* via the 2D framework *despite* the PI being descriptive), or (3) significantly reinterpret the *a priori* accessibility claim for PIs to avoid the force of the epistemic argument. Merely noting the distinction between epistemic scenarios and counterfactual worlds is insufficient, as the objection grants this distinction but attacks the PI *within* its own domain.
