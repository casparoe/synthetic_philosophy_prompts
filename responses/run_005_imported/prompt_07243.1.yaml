  We are ranking eight strategies for addressing the Löbian obstacle in self-referential formal epistemology. The Löbian obstacle, derived from Löb's theorem, shows that a consistent system cannot have a general rule that "if this system proves P, then P is true" without collapsing into inconsistency (unless it already proves P). The question is to rank these strategies by how much genuine philosophical work they do toward meeting the obstacle (as opposed to relocating, relabeling, or just living with it).

  The eight strategies are:

  1. Tiling agents built on parametric polymorphism (Yudkowsky and Herreshoff)
  2. Reflective oracles
