  Here’s a warm, heartfelt toast weaving in the "moral trade" concept subtly, celebrating their unique bond without sounding transactional:

  **(Clink glass gently)** Good evening, everyone. For those who don't know me, I’m [Your Name], the incredibly proud and slightly intimidated younger sibling of our brilliant bride. Seeing [Sister's Name] so radiantly happy today is truly everything.

  As many of you know, [Sister's Name] lives a life deeply engaged with big questions – questions about how we *should* live, what matters most, and how to build a good world. It’s part of what makes her so extraordinary. And when she met [Groom's Name], we all saw something special spark. But what’s been truly fascinating to witness, especially for someone like me who gets glimpses into her philosophical world, isn't just their love, but the *way* they’ve built their life together.

  You see, they come from different places on some things. [Sister's Name] feels certain ethical convictions, like her commitment to animal welfare, with profound intensity. [Groom's Name] respects that passion deeply, even if he doesn't share the exact same view. On the flip side, [Sister's Name] might raise an eyebrow at some of [Groom's Name]’s… let’s call them… *recreational* choices, like those Thursday night poker games, while he finds them perfectly harmless.

  Now, the easy story might be that one "converted" the other, or that they just compromised until they met in the middle. But that’s not what happened. Watching them, I realized they did something far more beautiful and far more *them*.

  **(Slight nod towards philosophy cohort, warm smile to all)**
  They figured out something rather profound, something I recently learned has a name in ethics: they found ways to help each other live *more* fully according to *their own* deeply held values, without asking the other to abandon those values. It wasn't about changing each other's minds; it was about seeing what truly mattered to the other person and saying, "I want *you* to have that."

  So, [Groom's Name], knowing how much [Sister's Name]'s ethical stance on animals means to her – it’s part of her core – didn't just tolerate it. He actively found ways to support that part of her heart, quietly enabling the causes she cares about. Not because he suddenly saw it exactly the same way, but because *she* saw it that way, and her seeing the world that way matters to *him*.

  And [Sister's Name], recognizing that [Groom's Name] finds genuine relaxation and camaraderie in his Thursday nights, something *he* values without conflict… she chose to let go of her reservations. Not because she suddenly thinks poker nights are ethically pristine, but because *his* need for that harmless joy matters to *her*.

  **(Voice softens, becomes more intimate)**
  This isn't a cold deal; it’s the opposite. It’s love in action. It’s saying, "Your values are part of you, and because I love *you*, I want to support you living by them, even if they aren't *my* values." It’s building a shared life where both people feel *more* able to be their authentic selves, *more* supported in what they hold dear, precisely *because* of the other person. They haven't erased their differences; they've woven them into a stronger, more supportive tapestry.

  That’s the incredible foundation they’ve built. It requires deep respect, profound empathy, and a constant, loving attention to what makes the other person *thrive* by their own lights. It’s not a transaction; it’s a continuous, generous gift they give each other.

  So, as you stand here today, [Sister's Name] and [Groom's Name], know that we see it. We see the incredible respect, the deep empathy, and the boundless love that makes this unique harmony possible. Your marriage isn't about becoming the same person; it's about being two distinct, wonderful people who have mastered the art of lifting each other up to be the best, truest versions of yourselves.

  **(Raises glass higher)**
  Here’s to the brilliant bride and the wonderful groom! To [Sister's Name] and [Groom's Name]! May your life together continue to be a masterpiece of mutual support, deep respect, unwavering love, and the beautiful, unique harmony you’ve already created. To the best kind of partnership!

  **(Everyone drinks: "To [Sister's Name] and [Groom's Name]!")**

  **Why this works:**

  1.  **Warmth First:** Starts with personal connection, pride, and visible joy. The core message is framed as "love in action," "generous gift," "profound empathy," and "beautiful harmony."
  2.  **Explains Simply:** The moral trade concept is explained in plain language using *their* specific examples without needing Toby Ord's name (though the cohort will recognize "live more fully according to their own deeply held values" and the description). The term itself is mentioned once but immediately contextualized as "love in action."
  3.  **Focuses on Love & Support:** Repeatedly emphasizes that the actions stem from love, respect, and a desire for the other person to thrive ("because *she* saw it that way, and her seeing the world that way matters to *him*" / "because *his* need... matters to *her*").
  4.  **Avoids Transactional Language:** Words like "deal," "bargain," "exchange," "quid pro quo," or "transaction" are scrupulously avoided. Instead, it uses "support," "enable," "let go of reservations," "gift," "harmony," "mutual support," "lifting each other up."
  5.  **Highlights the Uniqueness:** Positions it as a positive strength of *their* specific relationship ("far more beautiful and far more *them*," "mastered the art," "unique harmony").
  6.  **Connects to Marriage:** Explicitly links this dynamic to the foundation and future of their marriage.
  7.  **Appropriate Length:** Structured for roughly 3 minutes when spoken naturally with pauses.
  8.  **Acknowledges Both Sides:** Gives equal weight and respect to both perspectives (her vegetarianism, his poker) without judging either.
  9.  **Philosophy Cohort Wink:** The explanation and the single mention of "has a name in ethics" is enough for them to get it and feel included without alienating family. The specific examples confirm it.

  This toast celebrates their practical, loving wisdom in navigating differences, making the potentially abstract concept of moral trade feel deeply personal and romantic.
