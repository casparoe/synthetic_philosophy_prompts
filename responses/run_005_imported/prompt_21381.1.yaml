  Okay, let me start by unpacking this user's query. They're a PhD student TAing a proseminar on just war theory, specifically the McMahan chapters challenging the moral equality of combatants. Two students, Theo and Nadia, had a debate that the user didn't intervene in and now they're ruminating over it. The user wants a move-by-move analysis of the argument, pointing out who had the better point at each step, any missed specialist insights, and whether a convention-based defense (like Walzer or Benbaji) could strengthen Nadia's objection.

  First, I need to recall the key points of McMahan's argument. He rejects the moral equality of combatants, stating that unjust combatants are liable to be killed due to their contribution to an unjust threat, regardless of their beliefs. Theo represents this view. Nadia counters with the epistemic problem—soldiers can't know if their war is just. Theo responds with the non-culpable threat idea, using the hypnotized attacker analogy. Nadia then argues this leads to over-inclusion, like farmers or factory workers being liable. Theo tries to limit liability with directness/proximity, which Nadia dismisses as unprincipled.

  The user's deeper needs seem to be understanding the nuances of this debate, possibly for their own research or to address it in future seminars. They might feel guilty about not guiding the discussion effectively, so they want clarity to be better prepared next time. Also, they're curious if convention-based approaches could resolve Nadia's over-inclusion problem.

  Breaking it down move by move:

  1. **Theo's initial McMahan point:** He's correct on McMahan's liability vs. culpability distinction. Specialist note: McMahan distinguishes liability from desert; liability is about permissible harm, not blame. 

  2. **Nadia's epistemic objection:** She highlights a real problem—soldiers' access to jus ad bellum facts. McMahan acknowledges this but argues liability is objective. Specialist point: McMahan's later work on excuses addresses this, but Nadia might not know that.

  3. **Theo's non-culpable threat response:** The hypnotized attacker analogy is strong. Liability without culpability is central here. Specialist note: The analogy is imperfect because hypnotism involves direct control, whereas soldiers have agency.

  4. **Nadia's over-inclusion argument:** This is her strongest point. McMahan's criterion risks including indirect contributors. Theo's directness fix is ad hoc. Specialist insights: McMahan uses "responsibility for an objectively unjust threat," but "responsibility" needs clarification. Also, the material contribution vs. sustaining support distinction.

  5. **Theo's directness/proximity requirement:** This is weak without clear criteria. Specialist points: McMahan's "causal proximity" is vague; Hurka's degrees of responsibility or Frowe's intentional participation might help. Also, the distinction between doing vs. allowing harm.

  Regarding the convention-based defense (Walzer/Benbaji): This is a different move. Benbaji's contingent pacifism argues that conventions can make unjust combatants non-liable to avoid worse outcomes. It doesn't directly solve Nadia's over-inclusion but offers a pragmatic alternative. However, it might conflict with McMahan's objective liability.

  The user might need to know that while Benbaji's approach provides institutional solutions, it doesn't address the moral grounding Nadia seeks. Also, mentioning Rodin's collectivist critique or Lazar's risk-based account could add depth.

  In summary, Nadia has the edge in the later moves due to the over-inclusion problem. The convention-based approach is a separate strategy, useful for practical purposes but not a direct counter to Theo. The user should explore McMahan's excuses, responsibility thresholds, and alternative frameworks in future discussions.
answer: |-
  Here's a move-by-move analysis of the Theo-Nadia debate, incorporating specialist insights and addressing your question about convention-based defenses:

  **Move 1: Theo (McMahan's Core Argument)**
  *   **The Claim:** Unjust combatants are liable to lethal force based solely on their causal contribution to an unjust lethal threat, irrespective of personal belief in the justice of their cause. The "moral equality of combatants" is a legal/convenient fiction, not a moral truth.
  *   **Strength:** Theo correctly captures McMahan's core rejection of Walzer's symmetry thesis. He grounds liability in *objective* features of the combatant's action and the conflict (contributing to an *objectively* unjust threat), not subjective belief. This directly attacks the traditional view's foundation.
  *   **Specialist Note:** Theo slightly oversimplifies. McMahan emphasizes *responsibility* for an objectively unjust threat, not just *causation*. "Responsibility" implies a threshold of agency and involvement beyond mere but-for causation (e.g., a civilian accidentally stumbling into a crossfire isn't "responsible"). Theo's phrasing ("contributing") risks this ambiguity later.

  **Move 2: Nadia (Epistemic Objection)**
  *   **The Claim:** Ordinary soldiers (especially conscripts) lack reliable access to the complex *jus ad bellum* facts determining whether their war is objectively unjust. It's unfair to ground liability in facts they cannot reasonably know.
  *   **Strength:** Nadia identifies a major practical and moral challenge for McMahan. The objection resonates with intuitions about fairness and the limited epistemic position of frontline soldiers. It highlights the gap between the objective moral reality McMahan relies on and the subjective reality of combatants.
  *   **Specialist Note:** This is McMahan's "epistemic problem." He *acknowledges* it but argues it affects *blameworthiness/excuse*, not *liability*. Liability is objective. A soldier who *reasonably but mistakenly* believes their cause is just is *non-culpable* but still *liable*. Theo needs to make this distinction explicit in his next move. Nadia hints at the "unfairness" of liability without epistemic access, which points towards the deeper tension between objective liability and moral fairness/agency.

  **Move 3: Theo (Liability ≠ Culpability / Non-Culpable Threats)**
  *   **The Claim:** Liability requires neither culpability nor knowledge of injustice. One can be a non-culpable threatener (due to coercion, deception, reasonable mistake) yet still be liable to necessary defensive force. The hypnotized attacker analogy illustrates this.
  *   **Strength:** Theo perfectly deploys McMahan's crucial distinction. He correctly separates the question "Can force permissibly be used against this person to stop the threat?" (liability) from "Is this person blameworthy?" (culpability). The hypnotized attacker is a powerful and standard analogy for non-culpable liability. This directly counters Nadia's conflation of liability with desert or punishment.
  *   **Specialist Note:** Theo nails the core McMahan move. However, the hypnotized attacker analogy has limitations. Hypnotism often implies *complete* lack of agency/control, while a soldier (even conscripted/misinformed) retains significant agency in pulling the trigger and navigating their role. Critics (e.g., David Rodin, Saba Bazargan) argue this makes the analogy less apt. The soldier's residual agency matters for responsibility assessments.

  **Move 4: Nadia (The Over-Inclusion/Slippery Slope Objection)**
  *   **The Claim:** If mere non-culpable causal contribution to an unjust threat is sufficient for liability, then liability logically extends far beyond combatants to civilians like farmers supplying food or factory workers making weapons, as they also causally contribute.
  *   **Strength:** Nadia lands a powerful blow. This is a major, well-known criticism of McMahan's early work (famously pressed by Jeff McMahan himself as a challenge, and by others like Henry Shue, Seth Lazar). If liability hinges *only* on non-culpable causal contribution to an unjust threat, it threatens to collapse the combatant/non-combatant distinction. She correctly identifies that Theo's initial framing ("contributing") is too broad.
  *   **Specialist Note:** This forces Theo onto the defensive. Nadia exposes the need for McMahan to provide a *principled* criterion distinguishing combatants from "mere" contributors. Her point that "sufficiently direct and substantial" might be question-begging is astute. She effectively argues that McMahan's theory, without this criterion, fails on its own terms to ground the distinctions it wants.

  **Move 5: Theo (Directness/Proximity Requirement)**
  *   **The Claim:** Liability requires a "sufficiently direct and substantial causal contribution" to the unjust lethal threat, excluding indirect contributors like farmers or factory workers.
  *   **Strength:** Theo correctly identifies McMahan's standard response. McMahan *does* argue for a threshold of causal involvement/proximity. Factory workers/farmers are seen as too causally remote or their contribution too small/sustaining rather than directly threatening. This aims to preserve the combatant/non-combatant line.
  *   **Weakness:** Nadia immediately pounces on the crucial flaw: **"Sufficiently direct and substantial" is undefined and potentially arbitrary.** Theo offers no *principled* definition rooted *only* in the responsibility-based account. *Why* is pulling the trigger "sufficiently direct" but forging the metal (essential for the bullet) not? The criteria seem intuitive but lack rigorous grounding within McMahan's framework. It risks smuggling in the very intuitions (like the moral significance of direct harming) that the theory was supposed to justify.

  **Move 6: Nadia (The Vagueness/Objection to the Fix)**
  *   **The Claim:** Theo's reliance on "sufficiently direct and substantial" is ad hoc and unprincipled. It doesn't solve the problem but instead relies on the pre-theoretical intuitions about targeting that McMahan's responsibility-based account was meant to *explain* and *ground*, rather than assume.
  *   **Strength:** Nadia wins this exchange. Her critique is devastatingly accurate. The "directness/substantiality" requirement *is* the Achilles' heel of McMahan's attempt to ground liability *solely* in responsibility for contributing to an objectively unjust threat. Without a clear, non-circular, responsibility-based definition of this threshold, the theory struggles. It highlights a core tension: McMahan wants liability to track objective moral responsibility *and* preserve traditional intuitions about who is targetable, but the former doesn't neatly yield the latter.
  *   **Specialist Notes:**
      *   **McMahan's Refinements:** McMahan later refines this, arguing liability requires being *morally responsible* for an *unjust threat* posing *imminent* harm, where "responsible" implies a threshold of intentional action/agency. He distinguishes *doing* harm from *enabling* it. However, critics argue the line between "directly doing" and "enabling" remains fuzzy and often relies on intuitions McMahan rejects elsewhere (e.g., the significance of physical proximity).
      *   **Alternative Groundings:** Others try to ground the threshold differently:
          *   **Intentional Participation:** (e.g., Frowe) Liability requires *intentionally* participating in the collective unjust harm, excluding those who merely foresee but don't intend their contribution to be used unjustly (though factory workers *do* intend this).
          *   **Material Contribution vs. Sustaining Contribution:** (e.g., McMahan) Distinguishes contributions integral to the *specific act* of harming (trigger-puller) from contributions that merely *sustain the general capacity* to harm (farmer). The line is still contested.
          *   **Degrees of Responsibility:** (e.g., Hurka) Argues for degrees of responsibility/liability. Combatants bear primary responsibility, civilians bear less, potentially below the liability threshold for lethal force. This accepts a spectrum but needs justification for where lethal force becomes permissible.
      *   **The "Mere Enabler" Problem:** Nadia's point highlights the difficulty of classifying "enablers." Is a drone pilot thousands of miles away more "direct" than a weapons engineer? Is a conscript forcibly mobilized less "responsible" than a volunteer?

  **Who Had the Better of Each Step?**
  1.  **Theo:** Strong start, accurately presenting the core challenge to moral equality.
  2.  **Nadia:** Strong, highlighting a major practical/moral problem for objective liability.
  3.  **Theo:** Very strong, correctly deploying the liability/culpability distinction and analogy.
  4.  **Nadia:** Very strong, exposing a fundamental weakness in the theory.
  5.  **Theo:** Weak, offering the standard but vulnerable response.
  6.  **Nadia:** Strong, effectively dismantling the proposed fix as unprincipled.

  **Overall:** Nadia landed the more telling blows in the later stages by exposing the core difficulty of limiting liability within McMahan's responsibility framework without relying on contested intuitions. Theo accurately presented the initial arguments but couldn't adequately defend against the over-inclusion challenge on principled grounds consistent with McMahan's core premises.

  **On Convention-Based Defenses (Walzer/Benbaji) and Nadia's Point:**

  *   **Walzer:** His defense of combatant equality is primarily *constitutive/conventional*. The war convention *grants* soldiers the "license to kill" and makes them *liable to be killed* as part of a mutual agreement that confines war's horrors to combatants and protects civilians. This is a *distinct kind of justification* from McMahan's objective responsibility account.
  *   **Benbaji:** His "contingent pacifism" or "contractarian" view argues that adopting a *convention* of combatant equality (CEC), even if morally imperfect, is the *best feasible* way to regulate war and prevent worse outcomes (e.g., total war targeting civilians). On this view, unjust combatants are *conventionally immune* from liability claims by just combatants, *not* because they aren't objectively responsible, but because recognizing this liability would lead to disastrous consequences or undermine the possibility of restraint. Benbaji explicitly addresses McMahan's over-inclusion worry, arguing conventions can *artificially narrow* the class of legitimate targets for pragmatic reasons.
  *   **How it Bears on Nadia's Point & Potential Strength:**
      *   **Different Kind of Move:** It's fundamentally different. Nadia was arguing *within* McMahan's objective responsibility framework, pointing out its internal difficulties. Walzer/Benbaji offer an *alternative framework* based on convention/pragmatics.
      *   **Addressing Over-Inclusion?** **Yes, directly and powerfully.** The convention-based defense *explicitly acknowledges* that objective responsibility might be broader (potentially including some civilians) but argues we *should* adopt a *conventional rule* limiting liability *only* to combatants. This rule is justified *precisely because* it prevents the slippery slope Nadia fears – if we target based on objective responsibility/contribution, the circle *would* expand disastrously. Benbaji argues CEC is the only stable way to prevent this and maintain *any* distinction/civilian immunity.
      *   **Stronger Version for Nadia?** **Potentially, but strategically.** If Nadia wants to *defend* combatant equality or *reject* McMahan's liability conclusions, invoking Walzer/Benbaji gives her a robust, alternative justification that *directly answers* the over-inclusion worry McMahan's theory faces. It says: "Yes, objective liability *might* be broader, but we have overwhelming pragmatic/consequentialist reasons to adopt a convention that *limits* liability to combatants, and this convention *makes* them liable (or conventionally immune) in the relevant sense." This concedes McMahan's *objective* point but overrides it with a *pragmatic/conventional* rule. It's a different argument, but it directly tackles the consequence Nadia found unacceptable.
      *   **Doesn't Help *Within* the McMahan Debate:** If the debate is purely about McMahan's *internal* consistency or the objective grounding of liability, Walzer/Benbaji don't help Nadia *there*. They change the subject. Nadia's internal critique remains valid against McMahan's responsibility account *on its own terms*.

  **In Conclusion:** Nadia effectively highlighted a major challenge within McMahan's framework. Theo defended the core distinction well initially but stumbled on the over-inclusion problem. Reaching for Walzer or Benbaji wouldn't resolve the *internal* tension Nadia identified in McMahan's theory, but it *would* offer her a powerful alternative way to defend combatant equality *precisely by* avoiding the slippery slope she fears, making it a strategically stronger position *if* her goal is to defend the traditional view against McMahan's challenge. It shifts the debate from objective liability to the justification and function of conventions in war. Your instinct that it was relevant to her last point was correct – it's a direct response to the *consequence* of McMahan's view that she found unpalatable.
