  Here’s a 4-5 minute toast weaving Moore’s "organic unity" concept into a warm, authentic tribute that works for both philosophers and families. It avoids jargon while honoring the depth of Moore’s idea and Priya & Dan’s relationship:

  ---

  **(Clink glass gently)**  
  "Hi everyone. For those who don’t know me, I’m [Your Name], one of Priya’s fellow philosophy grads. Now, I know what half of you are thinking: *‘Oh no, a philosopher at the mic… get ready for an existential crisis with the cake!’* Don’t worry—I work on the philosophy of *mind*, not ethics. But since Priya’s spent the last few years wrestling with G.E. Moore’s *Principia Ethica*… well, let’s just say she’d notice if I didn’t sneak in *one* nerdy reference today.  
  *(Pause for light laughter)*  

  "Moore had this fascinating idea about what makes life truly valuable. He argued that the very best things—like deep friendship, or appreciating great art—aren’t just ‘good’ in a simple way. They’re what he called ‘organic unities.’ Basically, when two great things come together, they create something *entirely new*—something infinitely more valuable than just adding up their parts. Like… a perfect harmony where the whole becomes transcendent.  
  *(Look at Priya & Dan)*  

  "Moore was *weirdly strict* about this, though. He said this magic *only* happens when the affection is real—when you truly *see* the other person. Not some idealized version, not just what they can do for you… but *them*, honestly and clearly. Flaws, quirks, virtues and all.  
  *(Shift tone to warm sincerity)*  

  "That’s why this isn’t just a toast about ‘love being good.’ Priya and Dan, what’s breathtaking about you two is how you embody this *real*, clear-eyed kind of unity. Priya—your dissertation literally analyzes how we perceive *truth* in ethics. And Dan, anyone who’s seen you listen to her explain Moore’s ‘naturalistic fallacy’ for the 100th time *without glazing over*… knows you see *her*. Not ‘Dr. Priya the Ethicist,’ but *Priya*—the woman who laughs till she cries at terrible puns, who debates Kant over breakfast, and whose ‘focus face’ could intimidate a chess grandmaster.  

  "Dan, you bring this grounded warmth that turns Priya’s fierce brilliance into something… joyful. I’ve watched her come alive telling stories about your hikes, your terrible karaoke duets, how you remember her grandma’s chai recipe. And Priya—you see the quiet strength in Dan, his patience, his unwavering support. You don’t just admire him; you *delight* in him. The way he builds things with his hands, the way he makes people feel instantly welcome… things she might *study*, but you *live*.  

  "Moore thought appreciating ‘beauty’ was one of those irreplaceable goods. But watching you two, it’s clear: the real beauty isn’t just in sunsets or symphonies. It’s in the *way* you look at each other. It’s in the trust that lets Priya defend a dissertation one week and walk down the aisle the next, knowing Dan’s her safe harbor. It’s in the way Dan looks at Priya like she’s the most fascinating, wonderful mystery he never wants to solve.  

  **That’s** the ‘organic unity.’  
  *(Lean into the metaphor for everyone)*  

  "Your marriage isn’t Priya *plus* Dan. It’s this *third thing* you’ve created—something unique and far greater. It’s the shared silence that speaks volumes. The inside jokes that need no explanation. The way you turn ‘I’ into ‘we’ without losing yourselves. *That* harmony—where love isn’t blind, but sees deeply—*that’s* what makes life profoundly good.  

  "So, to Priya and Dan: May your ‘organic unity’ keep growing richer, truer, and more beautiful every day. Moore argued these are the things that make life worth living… and looking at you two, I think he was absolutely right.  

  **Cheers!**  
  *(Raise glass)*"

  ---

  ### Why this works
  1.  **Accessible Philosophy:** Explains "organic unity" in plain language using relatable metaphors (harmony, sum > parts). No jargon bombs.
  2.  **Moore’s Rigor Honored:** The "clear-eyed affection" requirement is central, forcing *specific*, truthful compliments about both Priya & Dan as individuals and their synergy.
  3.  **Nerdy Nod, Not Lecture:** Name-drops Moore/Principia early to satisfy the cohort, then quickly translates it into universal sentiments. The humor ("existential crisis with the cake") disarms non-philosophers.
  4.  **Authentic Details:** Uses real traits (Priya's laugh, focus face, Dan's craftsmanship, support during dissertation) proving the affection is "tracking actual qualities."
  5.  **Emotional Core:** Focuses on the *feeling* of their union ("third thing," "shared silence," "delight") which anyone can feel, regardless of knowing Moore.
  6.  **Structure:** Opens with humor, explains the concept, applies it *specifically* to the couple, elevates it to the universal, ends with a heartfelt toast.

  **Pro Tip:** Deliver the specific compliments (laugh, focus face, karaoke, Dan's support) with genuine warmth. *That’s* what makes the philosophy feel human and true. The cohort will admire the elegant reference; the families will feel the love.
