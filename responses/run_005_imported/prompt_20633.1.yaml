answer: |-
  Your intuition about the Condorcet Jury Theorem (CJT) extension for unanimity is absolutely correct *under the standard CJT assumptions* (sincere voting, independence, homogeneous competence p > 0.5). The formal-theory paper your advisor pointed you to is highlighting a crucial, and often counterintuitive, implication of relaxing one of those core assumptions: sincere voting. **Your probabilistic logic isn't wrong; the strategic voting model changes the game fundamentally.**

  Here's the breakdown:

  1.  **Your (Correct) Intuition under Sincere Voting (CJT):**
      *   As you state, under sincere voting:
          *   `P(Wrongful Conviction | Majority)` = P(at least k jurors wrong), where k is the majority threshold.
          *   `P(Wrongful Conviction | Unanimity)` = P(all n jurors wrong).
      *   Since P(individual wrong) = q < 0.5 (because p > 0.5), `q^n` (unanimity) decays to zero *much faster* than the probability of getting a bare majority wrong (e.g., `C(n, k) * q^k * (1-q)^{n-k}` for k just over n/2). The gap widens dramatically as n increases.
      *   **Conclusion (Sincere Voting):** Unanimity makes wrongful convictions exponentially less likely than majority rule for innocent defendants as n increases. It acts as a powerful safeguard against convicting the innocent.

  2.  **The Strategic Voting Model (The Paper's Point):**
      *   This model treats jurors as rational Bayesian updaters who understand the voting rule and strategically consider the *pivotal* scenarios – situations where *their* vote actually changes the outcome.
      *   **The Pivotal Logic under Unanimity:** For a guilty vote to be pivotal under unanimity, it means that *all other n-1 jurors have voted Guilty*. A rational juror conditions their belief on this pivotal event.
      *   **The Perverse Inference:** Conditioning on "all others voted Guilty" is *extremely* informative. It strongly suggests that *all other jurors received "guilty" signals*. Even if this particular juror received an "innocent" signal, the overwhelming evidence from the other n-1 signals (all pointing to guilt) can easily overwhelm their own single "innocent" signal, especially if n is large or the signal strength is moderate.
      *   **Resulting Behavior:** Fearing they might be the lone holdout preventing a correct conviction of a guilty defendant (because the other n-1 signals are so strong), a rational juror with an "innocent" signal might strategically vote Guilty. They "follow the herd" *even against their private evidence* to avoid being pivotal for an acquittal they believe is likely wrong.
      *   **Impact on Wrongful Convictions:**
          *   **Under Majority Rule:** Pivotal events are different (e.g., exactly k-1 others vote Guilty). The inference from being pivotal is less extreme. Strategic voting still occurs but tends to amplify the majority signal less dramatically than under unanimity. Wrongful convictions still happen primarily due to genuine errors.
          *   **Under Unanimity:** The "all others guilty" pivotal event creates immense pressure to convict, *even for jurors who privately suspect innocence*. This strategic herding *increases* the likelihood that juries will convict when at least one juror has reasonable doubt. **This can make wrongful convictions *more* likely under unanimity than under a less stringent rule like majority, *despite* the higher threshold.** The model suggests unanimity fails precisely when it's supposed to work – when there's genuine dissent indicating possible innocence.

  3.  **Addressing Your Concerns:**
      *   **"Shouldn't change private belief?"** You're right, the *private signal* doesn't change. But the juror's *actionable belief* – the belief they use to decide how to vote *given the strategic context* – changes dramatically based on the pivotal event. The private signal is just one piece of evidence; the pivotal event provides overwhelming evidence about what *all other signals* were. A rational Bayesian updates their belief *using all available information*, which now includes the highly informative pivotal event.
      *   **"Exploiting a quirk?"** It's not a quirk; it's a core insight of game theory applied to voting. The pivotal voting logic is robust and arises naturally when modeling rational strategic actors in collective decision-making. It highlights how voting rules shape incentives and information aggregation beyond simple aggregation of fixed preferences or beliefs.
      *   **"Real juries?"** This is the critical question. The strategic model makes a stark prediction. Whether it fully applies to real juries is debated:
          *   **Against Applicability:** Real jurors may not engage in such complex pivotal reasoning. Deliberation dynamics (persuasion, normative pressure, leadership) dominate. Instructions emphasize independent judgment. Sincere voting might be a better approximation.
          *   **For Applicability:** The pressure to conform in small groups is well-documented. Jurors understand the high stakes of being the holdout under unanimity. The model captures the *incentive* to ignore private doubt if you believe everyone else is convinced, even if the Bayesian updating isn't explicit. Empirical evidence on the unanimity rule's effect is mixed but shows it increases hung juries (consistent with holdouts) and may influence conviction rates.

  **Conclusion:**

  1.  **Your CJT Extension is Sound:** Under sincere voting (CJT assumptions), your logic is flawless. Unanimity is a much stronger safeguard against wrongful conviction than majority rule as n increases.
  2.  **The Paper Identifies a Real Theoretical Mechanism:** The strategic voting model reveals a profound and counterintuitive possibility: the very feature designed to protect the innocent (unanimity requirement) can, under rational strategic voting, *increase* the likelihood of convicting the innocent by creating overwhelming pressure for dissenters to conform. This isn't a model quirk; it's a fundamental consequence of rational actors conditioning their behavior on when their vote matters.
  3.  **Relevance to Real Juries:** This is where the debate lies. The theoretical result is important because it shows that the CJT's optimistic conclusions *depend critically on sincere voting*. If real jurors behave strategically in the way the model suggests (even imperfectly), the effectiveness of unanimity as a safeguard is undermined, potentially severely. Your work as a formal theorist/judicial politics scholar is to weigh this theoretical possibility against empirical evidence on jury behavior and deliberation. Does the pivotal logic manifest, even partially? Does deliberation mitigate it? Is sincere voting a better approximation? The formal model doesn't prove unanimity *is* worse in practice, but it powerfully demonstrates why it *could* be, challenging the naive CJT extrapolation and demanding a more nuanced understanding of institutional rules and strategic behavior. Your skepticism about its real-world dominance is well-placed, but the theoretical point itself is robust and significant.
