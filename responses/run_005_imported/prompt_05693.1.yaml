  You're absolutely right to push back on your friend's characterization – Williams' argument is far more philosophically nuanced than a simple defense of "high art." His critique of Kerman (and the broader "dramatic truth" tradition) stems from deep objections to **reductionism, misplaced standards of realism, and a fundamental misunderstanding of opera's unique ontology.** Here's the core of his position, unpacked:

  1.  **Rejecting the Hierarchy & Reductionism:**
      *   Kerman's view implicitly (or explicitly) establishes a **hierarchy**: Drama (plot, psychology, character motivation) is the *primary* element, and music's value is *instrumental* – it must serve and justify itself within that dramatic framework. "Just beautiful" music is suspect because it doesn't advance this primary goal.
      *   Williams fundamentally challenges this hierarchy. He argues opera is an **autonomous art form** with its own constitutive rules and values. Music isn't merely the *servant* of drama; it is an **equal partner**, or more precisely, **opera is a *sui generis* fusion where the "dramatic" is *musically constituted*.** Demanding that music constantly justify itself dramatically is like demanding that color in a painting constantly justify itself by enhancing the line drawing – it misunderstands the medium's essential nature.

  2.  **Redefining "Dramatic Truth":**
      *   Kerman (and others) operate with a concept of "dramatic truth" borrowed heavily from spoken drama or naturalistic fiction – psychological plausibility, narrative propulsion, character consistency.
      *   Williams argues this is the **wrong standard for opera.** Opera's "truth" is **musico-dramatic.** It creates its *own* kind of psychological and emotional reality through musical means. What feels "true" in opera often arises precisely from the **heightening, stylization, suspension of time, and sheer emotional intensity** that music provides, *even when it departs from strict narrative logic or psychological naturalism*.
      *   **Example:** A character expressing a complex emotional state in a long, static aria might be "undramatic" in a play where action should propel forward. But in opera, that aria *is* the drama – the drama *is* the exploration of that inner state through music. The "truth" lies in the musical embodiment of the emotion, not in how efficiently it moves the plot.

  3.  **The Constitutive Role of Music (Beauty as Function):**
      *   This is crucial: Williams doesn't *simply* defend "beauty for beauty's sake" as an escape from drama. He argues that the **musical beauty, virtuosity, and sheer sensuous pleasure *are themselves dramatic functions* within the operatic context.**
      *   Music isn't just *illustrating* emotion; it *creates* and *intensifies* it for the audience. A "beautiful" melody or a breathtaking vocal display isn't necessarily *about* the character's psychology in a direct way (though it can be); it's **about generating an immediate, visceral, and profound emotional response *in the audience*.**
      *   This response **is the drama unfolding for the spectator.** The character's joy, sorrow, or rage *becomes real for us* through the power and beauty of the singing, regardless of whether the character is "realistically" processing that emotion at that moment. The music *constitutes* the emotional reality of the scene for the audience.

  4.  **The Phenomenology of Opera: Presence and Embodiment:**
      *   Williams emphasizes the **immediacy and presence** created by the human voice in opera. A great singer *embodies* the character and the emotion in a way that transcends literal representation. The sheer physical act of producing that sound, the virtuosity involved, becomes part of the meaning and impact.
      *   This embodied presence creates a **different kind of engagement** than spoken drama. We aren't just intellectually analyzing motives; we are *experiencing* emotion directly through sound. Insisting that this embodied presence must always be subordinated to a narrowly defined "dramatic function" ignores this core phenomenological aspect of the experience.

  5.  **Opera's Embrace of the Artificial and Spectacle:**
      *   Unlike Kerman, who often sees spectacle or vocal display as potential distractions from "true" drama, Williams argues that **artifice, convention, and spectacle are *integral* to opera's power.** The very things Kerman might see as "cop-outs" (coloratura, grand ensembles, moments of pure sonic beauty) are often the moments that define opera's unique capacity for expression and catharsis.
      *   Opera thrives on its **hybridity and inherent contradictions** – high artifice conveying deep emotion, spectacle serving intimacy, unrealistic conventions generating profound truth. Demanding it conform to the standards of psychological realism inherent in spoken drama is a category error. It ignores opera's roots in ritual, myth, and celebration, where the *event* and the *experience* are paramount.

  **The Philosophical Guts in a Nutshell:**

  Williams' argument is fundamentally **anti-reductionist** and grounded in a **phenomenology of artistic experience.** He applies a key insight from his moral philosophy – that complex human phenomena (like morality or artistic experience) resist being forced into a single, reductive standard of value (like utility or, in this case, "dramatic truth").

  *   **Against Monism:** Kerman's view is monistic – drama is the single, overriding value. Williams is pluralistic – opera derives its value from the complex, often non-hierarchical interplay of music, drama, text, voice, spectacle, and convention.
  *   **Form & Content Inseparable:** Insisting music justify itself dramatically implies a separation where music is "form" applied to dramatic "content." Williams argues that in opera, the music *is* the content of the emotional and dramatic experience. The form *is* the meaning.
  *   **Truth in Heightening:** Operatic truth isn't found in mimicking everyday psychological processes, but in using music's unique powers to **heighten, intensify, and make palpable** emotional and existential states that spoken language or naturalistic action cannot reach. The "beautiful" moment isn't a distraction; it's often the *point* – the moment of maximum emotional revelation or release *for the audience*.
  *   **Audience Experience as Primary:** Ultimately, Williams judges opera by what it *does* to and *for* the audience. If the music, including moments of "just" beauty or virtuosity, creates a powerful, moving, coherent (within operatic conventions), and truthful *experience*, then it has fully "earned its keep," regardless of whether it advances a Kerman-esque notion of dramatic plot or psychological realism at that exact second.

  **Why your friend is likely wrong:** Framing it as "precious about high art vs. cheap spectacle" misses the mark. Williams isn't *against* drama; he's against *subordinating* music to a narrow definition of it. He embraces aspects Kerman might see as "spectacle" (vocal display, grandeur) as *essential* operatic tools for achieving a different, but equally valid, kind of truth and power. His argument is about respecting opera's *specificity* as an art form, not about insulating it from "lower" forms. It's a plea for critical standards appropriate to the medium itself.
