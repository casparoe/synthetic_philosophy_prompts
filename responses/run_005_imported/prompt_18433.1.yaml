  Hmm, they're wrestling with what seems like a genuine paradox in Bayesian confirmation theory. On one hand, the math seems clear: if P(E)=1 for known evidence, then observing that a theory entails E shouldn't change P(T) via Bayes' theorem. But on the other hand, the Mercury case is universally considered a triumph of GR despite being "old evidence." The user feels trapped between rejecting either physicists' intuition or Bayesianism itself - both unpalatable options.

  I recall Glymour's original formulation... The core issue is how Bayesianism handles logical learning. When we discover T entails E, that's actually gaining new information about logical relationships, not about E itself. The standard Bayesian update doesn't capture this because it treats probabilities as fixed when in reality our logical knowledge is evolving.

  Interesting how the user frames it as "biting bullets." They want a solution that preserves both scientific practice and a coherent epistemology. The Mercury example is perfect because it's so historically clear-cut - Le Verrier knew about the anomaly since 1859, Einstein derived it from GR in 1915, and physicists immediately recognized it as profound confirmation.

  Let me think through the proposed solutions... The counterfactual approach feels promising. If we imagine not knowing E, then P(E|T) vs P(E|~T) clearly favors T. But is this just a trick? Some philosophers object that counterfactuals are too vague. 

  The logical learning angle seems more rigorous. When Einstein showed GR entailed the precession, that revealed new information: that GR could explain something Newton couldn't. The probability shift comes from recognizing T entails E, not from E itself. This requires modeling how we update on logical discoveries.

  Garber's approach makes sense - we need to include the logical connection I = (T⊨E) explicitly in our probability space. Then P(T|E,I) can differ from P(T|E) because I provides new structure. But implementing this formally gets messy with logical omniscience problems...

  The user might appreciate the "unification" perspective too. GR didn't just accommodate Mercury - it explained why Newton failed, via curved spacetime. That explanatory coherence isn't captured in bare probabilities but feels essential to why scientists found it convincing.

  Ultimately I think the Bayesian framework can be salvaged with careful modeling of logical learning, though it becomes less elegant. The key is recognizing that "old evidence" isn't really about E - it's about discovering new logical relationships between T and E. That insight alone might relieve the user's discomfort without forcing them to abandon either scientific practice or Bayesianism wholesale.
answer: |-
  Your frustration is spot-on – you've hit one of the deepest cracks in the Bayesian edifice. The problem of old evidence *is* a genuine challenge, but **physicists weren't wrong about Mercury, and Bayesianism isn't fundamentally broken.** The issue lies in how we formally represent the act of *discovering a logical entailment* within the probability calculus. Let's break it down:

  1.  **The Core Problem (As You Stated):**
      *   If evidence E is already known with certainty, then `P(E) = 1`.
      *   Bayes' Theorem for theory T: `P(T|E) = [P(E|T) * P(T)] / P(E)`
      *   Since `P(E) = 1`, this simplifies to: `P(T|E) = P(E|T) * P(T)`
      *   `P(E|T)` is the likelihood – how probable is E *if* T is true?
      *   **The Problem:** If T entails E, then logically `P(E|T) = 1` (if T is true, E *must* happen).
      *   Plugging that in: `P(T|E) = 1 * P(T) = P(T)`
      *   **Conclusion:** Learning that T entails E does *not* change your credence in T. `P(T|E)` remains equal to your prior `P(T)`. Mercury's precession, being old evidence, couldn't confirm GR.

  2.  **Why Mercury *Felt* Like Strong Confirmation (And Was):**
      *   **The Anomaly:** Mercury's precession wasn't just "known"; it was a known *problem* for Newtonian gravity. Le Verrier identified an unexplained residual (~43 arcseconds/century) in 1859. It was an anomaly crying out for explanation.
      *   **GR's Triumph:** Einstein didn't just accommodate the number; he *derived* it precisely from the fundamental principles of GR (curved spacetime, field equations). This wasn't fitting a parameter; it was a *novel prediction* emerging from a radically new theoretical structure *applied to an existing problem*.
      *   **Explanatory Unification:** GR didn't just explain Mercury; it explained *why* Newton failed (implicitly assuming flat spacetime) and unified gravity with geometry. Solving this longstanding anomaly was powerful evidence for the *explanatory power and coherence* of the whole GR framework.

  3.  **Resolving the Paradox: It's About the *Discovery* of Entailment**
      The flaw in the simple Bayesian argument above is that it assumes logical omniscience. It assumes the agent *already knew* that T entailed E at the time they assigned `P(E|T) = 1`. But that's precisely what Einstein *didn't* know until he did the calculation! The confirmation comes from **learning a new logical relationship**.

      Here are the main solutions proposed:

      *   **The Counterfactual Approach (Most Common & Intuitive):**
          *   Ask: "What would my credence in T be *if I didn't already know E*?"
          *   In this counterfactual state of ignorance about E:
              *   `P(E)` is *not* 1. It might be very low under the old theory (Newton) because E was anomalous.
              *   `P(E|T)` for GR would be 1 (or very high, if approximate).
              *   `P(E|~T)` (probability under alternatives) would be low (since alternatives couldn't explain it).
          *   **Bayes Factor:** `P(E|T) / P(E|~T) >> 1`. Learning E *in this counterfactual state* would strongly confirm T.
          *   **Why it works:** It captures the *explanatory power* of T relative to the background of alternatives, isolating the impact of E *as evidence for T*.
          *   **Objection:** Some philosophers find counterfactual probabilities vague or metaphysically suspect. How do you rigorously define the "state of ignorance"?

      *   **The Logical Learning Approach (Garber, Jeffrey, Others):**
          *   Represent the *act of learning the logical truth* "T entails E" as a distinct piece of evidence, call it **I**.
          *   *Before* deriving the entailment, the agent knows E but does *not* know I. So `P(E|T)` is *not* necessarily 1 in their subjective probability space. They might have thought `P(E|T)` was low or undefined.
          *   **Updating on I:** When they learn I (that T entails E), they update their beliefs.
              *   They set `P(E|T, I) = 1`.
              *   Crucially, they also need to reassess `P(E|~T, I)`. Does I tell them anything about alternatives? Often, learning that T entails E highlights that ~T theories *don't* entail E (or entail ~E, or can't explain it), suggesting `P(E|~T, I)` might be lower than their previous `P(E|~T)`.
          *   **Bayes' Theorem with I:** `P(T|E, I) = [P(E|T, I) * P(T|I)] / P(E|I)`
              *   `P(E|T, I) = 1`
              *   `P(E|I)` remains 1 (they still know E).
              *   `P(T|I)` might be similar to `P(T)` (unless I itself suggests T is more plausible).
          *   **The Shift:** The confirmation comes from the change in the *likelihood ratio* induced by learning **I**:
              *   *Before I:* Likelihood Ratio `LR_before = P(E|T) / P(E|~T)` (This ratio might not have been strongly favorable, as T might not have been seen as likely to predict E).
              *   *After I:* `LR_after = P(E|T, I) / P(E|~T, I) = 1 / P(E|~T, I)`
              *   If learning I makes the agent realize that `P(E|~T, I)` is *very low* (because ~T theories cannot explain E), then `LR_after` becomes *very large*, confirming T.
          *   **Why it works:** It directly models the *epistemic act* of discovering the entailment and its impact on assessing how well T *and its competitors* explain E.

      *   **The Unification/Explanation Approach (Less Formal, More Historical):**
          *   The power of Mercury wasn't just P(E|T) being high; it was that GR provided a *deep, necessary explanation* derived from core principles, resolving an anomaly that plagued the dominant theory. This *explanatory coherence* isn't fully captured by simple conditional probabilities but is crucial to scientific confirmation. Bayesians argue this *can* be modeled through the likelihood (`P(E|T)` being high *only* if T is true) and the effect on `P(E|~T)` (making it low), but it requires careful setup.

  4.  **Which Bullet to Bite? Neither!**
      *   **Physicists were right:** Mercury's precession *was* (and is) strong evidence for GR. It demonstrated GR's unique ability to solve a deep, recalcitrant problem in a way consistent with its revolutionary core ideas.
      *   **Bayesianism isn't broken:** The problem of old evidence highlights a limitation in the *naive application* of Bayes' theorem, specifically its assumption of logical omniscience. When we properly model the agent's state of knowledge, particularly their *ignorance of logical entailments* and the *act of discovering them*, Bayesian updating *can* show a significant increase in `P(T)` upon learning that T entails the old evidence E. The confirmation stems from realizing how *surprising* E is under alternatives (~T) and how *necessary* it is under T, given the newly discovered logical connection.

  **In essence:** The "old evidence" gains *new confirmatory power* when you discover that a new, powerful theory *logically necessitates it*, especially when that theory also explains *why* the old theory failed. The Bayesian machinery can capture this, but it requires moving beyond the simplistic `P(E)=1` scenario and explicitly accounting for the learning of logical relationships (`I`) or adopting a counterfactual perspective. The power of Mercury for GR wasn't about the *data point* itself being new; it was about the *theoretical insight* revealing why that data point *had* to be true under GR and couldn't be adequately explained otherwise. That's the essence of confirmation that Bayesianism, properly applied, can and should capture.
