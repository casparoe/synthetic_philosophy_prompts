  Ok this one's been bugging me for a piece I'm working on about the philosophy of moral language. I think I've got the basic Frege-Geach problem down: expressivists say "lying is wrong" really just means something like "boo lying!", but that seems to fall apart once it's embedded in "if lying is wrong, then getting your little brother to lie is wrong," since your not booing anything in that if-clause. What I can't get my head around is how an actual proposed fix -- Gibbard's hyperplan stuff, or Blackburn's quasi-realism, whichever you think is cleaner -- is suppose to rescue the validity of the modus ponens (lying is wrong; if lying's wrong then X; therefore X) without just smuggling truth-apt propositions back in through the side door. Can you walk me through how one of these solutions actually works on that example, gut-level, rather than just asserting that validity comes out preserved?
