  Okay, the user is working on a piece about the philosophy of moral language and is stuck on the Frege-Geach problem. They understand the basic issue: expressivists say moral statements are like "boo lying," but that doesn't work when such statements are embedded in conditionals. The user wants to grasp how proposed solutions, like Gibbard's hyperplans or Blackburn's quasi-realism, actually preserve modus ponens without sneaking truth-apt propositions back in.

  First, I need to recall the core of the Frege-Geach problem. Expressivism faces trouble with embeddings because moral sentences in conditionals don't express emotions. Gibbard and Blackburn offer solutions. The user wants a concrete example, like modus ponens with "lying is wrong" and a conditional.

  Gibbard's hyperplans approach uses possible worlds and hyperplans to give content to moral statements. A hyperplan is a detailed plan for all situations. "Lying is wrong" means rejecting lying in all hyperplans. For the conditional "if lying is wrong, then getting your brother to lie is wrong," Gibbard sees it as rejecting hyperplans where lying is allowed but getting others to lie isn't. So modus ponens works because accepting both premises means you reject hyperplans that allow lying but not getting others to lie, and since the first premise rejects lying, you must also reject getting others to lie.

  Blackburn's quasi-realism uses higher-order attitudes. "Lying is wrong" expresses disapproval of lying. The conditional expresses a higher-order attitude: disapproval of both approving lying and not disapproving of getting others to lie. So modus ponens involves a consistency requirement: if you disapprove of lying and disapprove of approving lying without disapproving of getting others to lie, then you must disapprove of getting others to lie.

  The user's deeper need is to see the mechanism without truth-aptness sneaking in. They want to avoid the solution just being a covert return to propositions. Both approaches use complex states (hyperplans or attitudes) to explain validity through consistency in planning or attitudes. The key is that validity comes from the structure of these states, not truth conditions.

  I should present both options clearly. Using Gibbard's example with hyperplans might be more concrete. Breaking down the modus ponens step by step shows how rejecting certain plans forces the conclusion. Emphasize that the solution isn't about truth but about the incompatibility of accepting premises but rejecting the conclusion. Highlighting Blackburn's higher-order attitudes as commitments to consistency could also help. The user needs to see that the logical structure is preserved through the expression of attitudes or plans, not propositions.
answer: |-
  Okay, let's ditch the abstract jargon and get into the guts of how Gibbard's hyperplans (which I find slightly more intuitive for this specific puzzle) rescue modus ponens for the expressivist, *without* secretly relying on truth-conditions. We'll use your example:

  1.  **Lying is wrong.**
  2.  **If lying is wrong, then getting your little brother to lie is wrong.**
  3.  **Therefore, getting your little brother to lie is wrong.**

  **The Expressivist Starting Point (The Problem):**
  *   Premise 1 ("Lying is wrong"): Expressivists say this expresses a *non-cognitive state* – let's call it **Disapproval(Lying)**. It's like saying "Boo lying!" or having a plan to *reject* lying whenever it comes up.
  *   Premise 2 ("If lying is wrong, then getting your little brother to lie is wrong"): This *isn't* expressing disapproval of lying *right now*. You're not booing anything in the 'if' part. So what state *is* it expressing? This is the Frege-Geach punch.

  **Gibbard's Hyperplan Solution (The Rescue):**

  Gibbard says moral judgments aren't just simple emotions; they're about *planning*. Specifically, they're about **ruling out combinations of actions across different possible situations**. Think of a "hyperplan" as a **giant, complete instruction manual for what to do in *every conceivable situation***. Making a moral judgment means **rejecting** any hyperplan that violates that judgment.

  *   **Premise 1 ("Lying is wrong"):** This means you **reject any hyperplan that *permits* lying.** In other words, your instruction manual *must* say "Don't lie" in every situation where lying is an option. You rule out all "Lying-Allowed" manuals.
  *   **Premise 2 ("If lying is wrong, then getting your little brother to lie is wrong"):** What state does *this* express? Gibbard says it expresses a **plan to rule out a certain *combination* of attitudes:**
      *   It means you **reject any hyperplan that *permits* lying *AND* does *NOT* forbid getting your little brother to lie.**
      *   In simpler terms: You rule out any instruction manual that says "Lying is okay sometimes" **and also** says "Getting your brother to lie is okay sometimes." The conditional expresses a plan *not* to accept manuals that allow lying *without* also condemning getting others to lie.
  *   **The Conclusion ("Getting your little brother to lie is wrong"):** This would mean you **reject any hyperplan that *permits* getting your little brother to lie.** Your manual *must* say "Don't get your brother to lie."

  **How Modus Ponens Works (The Gut-Level Mechanism):**

  1.  **You Accept Premise 1:** You've ruled out *all* hyperplans that permit lying ("Lying-Allowed" manuals). Only manuals that **forbid lying** are left in your acceptable set.
  2.  **You Accept Premise 2:** You've *also* ruled out any hyperplan that permits lying *and* does *not* forbid getting your brother to lie. Notice that this *includes* ruling out manuals that **forbid lying but *permit* getting your brother to lie**? Why? Because:
      *   If a manual *forbids lying* (so it passes your Premise 1 filter), but *permits getting your brother to lie*...
      *   ...then it **permits lying?** NO! It forbids lying.
      *   BUT, it **does *NOT* forbid getting your brother to lie?** YES! It permits that.
      *   Crucially, Premise 2 *doesn't care* if the manual forbids lying or not in this case. It *only* cares about the combination: "Permits Lying **AND** Does Not Forbid Brother-Lying". A manual that *forbids* lying but *permits* brother-lying **does *not* have the combination "Permits Lying AND Does Not Forbid Brother-Lying"** because the first part ("Permits Lying") is FALSE. So Premise 2 *doesn't* directly rule out these "Forbid-Lying + Permit-Brother-Lying" manuals.
  3.  **The Trap Closes (Validity Emerges):** Here's the key move that makes modus ponens work:
      *   You've accepted Premise 1: Only "Forbid-Lying" manuals are acceptable.
      *   Now look at the manuals Premise 2 *hasn't* ruled out that are *still* in the running. Premise 2 *only* ruled out manuals that *both* permit lying *and* permit brother-lying. It *didn't* touch the manuals that forbid lying.
      *   **But what *kind* of "Forbid-Lying" manuals are left acceptable?** Premise 2 *doesn't require* anything specific about brother-lying for these manuals *as long as they forbid lying*. So theoretically, manuals that forbid lying *and* **permit** brother-lying are *still* acceptable? **NO!**
      *   **Why Not? The Consistency Requirement:** Gibbard builds in a fundamental requirement of **planning consistency**. A hyperplan that **forbids lying** but **permits getting your brother to lie** is **incoherent** or **planning-inconsistent**.
          *   *Why?* Because getting your brother to lie *is itself an instance of bringing about a lie*. If your master plan says "NEVER lie" but also says "It's okay to get someone else to do the lying for you," it contradicts itself. Planning to forbid lying *logically commits* you to planning to forbid *any act that directly causes a lie*, including getting your brother to lie. A hyperplan is a *complete, consistent* plan. It can't have this kind of internal conflict.
      *   Therefore, **there *are no* consistent hyperplans that forbid lying but permit getting your brother to lie.** They are logically impossible artifacts.
  4.  **The Conclusion is Forced:** Since you've accepted Premise 1, you only accept "Forbid-Lying" manuals. Because of the *consistency requirement built into the very idea of a hyperplan*, the *only* consistent "Forbid-Lying" manuals are those that *also* "Forbid-Getting-Your-Brother-To-Lie". **Therefore, you *must* also reject any hyperplan that permits getting your brother to lie.** This *is* accepting the conclusion.

  **How This Avoids the "Smuggling Truth" Charge:**

  1.  **No Truth-Conditions:** The "meaning" of each premise and the conclusion is still defined *entirely* in terms of the **planning states** (accepting/rejecting hyperplans) they express. "Lying is wrong" doesn't *describe* a fact; it expresses a plan to reject certain manuals.
  2.  **Validity as Planning Consistency:** The validity of modus ponens doesn't rely on the *truth* of the premises forcing the *truth* of the conclusion. Instead, it relies on the **incompatibility of planning states**:
      *   Accepting Premise 1 = Accepting only "Forbid-Lying" manuals.
      *   Accepting Premise 2 = Rejecting "Permit-Lying + Permit-Brother-Lying" manuals (which, crucially, *doesn't conflict* with Premise 1).
      *   Rejecting the Conclusion = Accepting *some* manual that "Permits-Brother-Lying".
      *   **The Crucial Point:** Can you *consistently* hold all three states (Accept P1, Accept P2, Reject Conclusion)? **NO.** If you try to accept a "Permit-Brother-Lying" manual (rejecting the conclusion), it *must* either:
          *   Permit lying (which conflicts with accepting P1), *or*
          *   Be a logically impossible "Forbid-Lying + Permit-Brother-Lying" manual (which is inconsistent by definition).
      *   Therefore, it's *impossible to plan consistently* while accepting the premises and rejecting the conclusion. Validity emerges from the *structure of planning commitments* and the *requirement for consistency within a hyperplan*, not from truth-conditions.
  3.  **The "Side Door" is Guarded:** The consistency requirement *isn't* a sneaky truth-condition. It's a fundamental constraint on what constitutes a *coherent plan*. It's part of the *logic of planning itself*, analogous to how the law of non-contradiction works for belief. Blackburn's quasi-realism emphasizes how expressivism can *earn the right* to talk about moral truth and logic *from within* the expressivist framework, based on the internal constraints of the attitudes involved (like consistency in planning or disapproval).

  **In a Nutshell:** Gibbard rescues modus ponens by:
  1.  Interpreting moral judgments as planning states (rejecting hyperplans).
  2.  Interpreting the conditional as a plan to reject a specific *combination* of plans.
  3.  Relying on the **internal consistency requirement of hyperplans** (you can't plan to forbid an act while planning to permit acts that directly cause it) to force the conclusion once you accept the premises. The validity comes from the *impossibility of holding inconsistent planning commitments*, not from truth flowing from premises to conclusion.
