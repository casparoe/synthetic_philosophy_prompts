  First, Priya's Ulysses analogy is clever but Marcus correctly spots the weakness: Ulysses bound himself, while eternity clauses bind future citizens. That's a crucial difference in agency. Priya counters with examples of intergenerational obligations like debts - but Marcus astutely notes those are revisable, unlike eternity clauses. 

  Ah, here's where it gets interesting: Priya reframes the debate by pointing out that Marcus's real concern isn't futurity per se but irrevisability. That shifts the ground from "who binds whom" to "how unbreakable should bindings be." Smart move. 

  Neither addresses some key angles though: How do eternity clauses function in practice? (They often get reinterpreted rather than broken.) What about "militant democracy" theories that justify self-defense against anti-democratic forces? Or the fact that no clause is truly eternal - revolutions can always overthrow constitutions. 

