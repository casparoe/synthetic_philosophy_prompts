answer: |-
  Here's a breakdown of the crucial divergence between Wallace and Cohen on hypocritical blame, followed by an analysis of which account better explains what's wrong:

  **Core Divergence: What Hypocrisy *Directly* Undermines**

  1.  **R. Jay Wallace: Undermines the *Moral Foundation* of Blame (Reciprocity & Standing Itself)**
      *   **Focus:** Wallace roots the *standing* to blame in a fundamental principle of **reciprocity** inherent in moral community. To blame someone is to hold them to a standard *you yourself are committed to* and *implicitly claim to satisfy* (or at least strive for).
      *   **Mechanism:** Hypocrisy (blaming while violating the same norm) violates this reciprocity. By holding others accountable to a standard you flout, you implicitly place yourself *above* the moral law you invoke. This denies the **equal moral standing** between blamer and blamed that is essential for the blame to be a legitimate *moral* address.
      *   **Consequence:** The hypocrite **lacks standing *entirely_**. Their blaming act is **morally void**. It's not just inappropriate; it *fails* as a genuine act of moral blame. The *content* of the criticism ("You did X wrong") might be true, but the *act of blaming* by *this person* has no moral force or legitimacy. It's akin to someone without legal authority trying to issue a binding legal judgment.

  2.  **G.A. Cohen: Undermines the *Moral Posture* or *Authority* of the Blamer (Credibility & Performative Success)**
      *   **Focus:** Cohen separates the **truth of the criticism** from the **blamer's moral authority** or *right* to deliver it. He focuses on the *performative* aspect of blame – it's not just stating a fact, but *adopting a stance* of judgment.
      *   **Mechanism:** Hypocrisy doesn't make the *statement* "You did X wrong" false. However, it makes the blamer **unfit to occupy the "posture of judgment"** while delivering it. Their own violation means they lack the *credibility* and *moral purity* required to authoritatively *pronounce* moral condemnation. They are "soiled hands."
      *   **Consequence:** The hypocrite **lacks the *authority* or *credibility* to effectively *perform* the act of blaming.** The *words* might be correct, but the *act* of blaming **"misfires"** (like a performative utterance failing due to inappropriate conditions - e.g., "I pronounce you man and wife" said by someone not authorized to marry). The criticism doesn't land as legitimate moral condemnation *coming from them*. It may still be *heard* as factual, but its *moral force* is lost.

  **The Crucial Difference: Void Act vs. Misfired Act**

  *   **Wallace:** Hypocrisy makes the blaming act **invalid from the start** due to violating the foundational moral reciprocity. It's **void**.
  *   **Cohen:** Hypocrisy makes the blaming act **defective in its execution** due to the blamer's lack of moral authority/credibility. It **misfires**.

  **Which Account Gives the Better Explanation? Justification for Cohen**

  Cohen's account provides a **more accurate and practically useful** explanation of what goes wrong when a hypocrite blames:

  1.  **Preserves the Truth of the Criticism:** Cohen correctly acknowledges that the hypocrite might be *saying something true*. Wallace's account risks conflating the *validity of the act* with the *truth of the proposition*. We often recognize that a hypocrite's *point* is correct ("Yeah, he's corrupt, but so are you!") even while rejecting *their* right to make it. Cohen captures this nuance; Wallace struggles with it. The core wrongness isn't that they lied about the act, but that *they* are saying it.
  2.  **Better Explains Our Reaction:** Our typical reaction to hypocritical blame isn't usually, "Therefore, what you said is false," but rather, "Who are *you* to say that?" or "Shut up, you do it too!" This aligns perfectly with Cohen's "misfire" – we reject the *speaker's authority* to deliver the message, not necessarily the message itself. Wallace's "void act" doesn't fully explain why we often still engage with the *substance* of the hypocrite's claim.
  3.  **Accommodates Degrees and Context:** Cohen's view better handles nuances. A minor past hypocrisy might slightly undermine posture, while egregious, ongoing hypocrisy makes the posture utterly ridiculous. Wallace's "void act" is more binary – you either have standing or you don't. Cohen allows for a *spectrum of credibility loss*.
  4.  **Explains Why Hypocrites Can Sometimes Still Be Heard (If Reformed):** If a hypocrite genuinely repents and reforms, Cohen's account explains how they can *regain* the posture of judgment over time. Their credibility is restored. Wallace's strict reciprocity/standing view makes regaining standing after hypocrisy conceptually trickier – how does one re-establish the violated reciprocity? Cohen's focus on current posture and credibility is more flexible.
  5.  **Focuses on the Core Problem: Illegitimate Authority:** The deep offense in hypocritical blame *is* the illegitimate claim to moral high ground. The hypocrite presumes an authority they have forfeited. Cohen's "posture of judgment" directly targets this. Wallace's violation of reciprocity is important, but Cohen more precisely identifies the *manifestation* of that violation in the blamer's arrogant assumption of authority.

  **Justification Summary for Cohen:** Cohen better captures the phenomenology of encountering hypocritical blame. We acknowledge the potential truth of the criticism while simultaneously rejecting the *blamer's right* to deliver it due to their compromised moral position. His concept of the "misfiring" performative act due to a lack of credible moral posture accurately describes the core dysfunction: the hypocrite lacks the *authority* to stand in judgment, rendering their condemnation hollow and illegitimate *as an act of moral address from them*, even if the facts they cite are correct. It preserves the distinction between the *content* of blame and the *act* of blaming, which is crucial for understanding real-world political rhetoric where hypocrites often *do* point to real wrongs.
