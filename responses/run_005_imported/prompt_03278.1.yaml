          Therefore, the candidate with unchanged marginal has a higher relative entropy? So the principle of minimum cross entropy picks the solution that shifts the marginal.

          Bailey: But 0.0631 vs 0.0654 is very close. And the shift in the marginal is counterintuitive. Maybe there are other principles at play.

