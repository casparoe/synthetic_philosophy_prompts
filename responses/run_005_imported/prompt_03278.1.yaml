          and then we have to choose the new marginal P_new(Red) and P_new(Blue). But the constraint doesn't specify the marginal. So we have to set it somehow. The Jeffrey update doesn't tell us how to set the marginal. The principle of minimum cross entropy is one way to set it. And it sets it to 0.4672 for Red and 0.5328 for Blue.

          Bailey: But that's the issue. I think the marginal should not change. Because we have no new information about whether we are in Red or Blue.

          Alex: But we do have new information that affects the events within Red. That might indirectly affect the marginal. For example, if we had learned that within Red, there is a very unlikely event, then overall Red might become less attractive? But in this case, the disconfirmation of R_2C is enough to slightly reduce the overall probability of Red.

          Bailey: I remain unconvinced. I think the fact that the update increases P(Blue) above 1/2 is a clear sign that the principle is flawed. We need an update rule that leaves the marginal on Red and Blue unchanged.

          Alex: Then what rule would you propose? And how would you set the probabilities within Red? We set P(R_HQ | Red)=3/4 and P(R_2C | Red)=1/4, and leave P(Red)=1/2. That gives the candidate distribution: (3/8, 1/8, 1/4, 1/4). But as we saw, that distribution has a higher relative entropy (0.0654) than the one we found by the Lagrange method? Actually, we computed that the candidate had a relative entropy of 0.0654, and the maxent solution had 0.0724? But wait, we found that the maxent solution by Lagrange had D≈0.0724? But we also computed that the candidate had D≈0.0654? That would mean the candidate has a lower relative entropy? But that contradicts the Lagrange method which is supposed to find the minimum. Therefore, I must have made a mistake in the calculation of the relative entropy for the maxent solution.

          Let me recalculate the relative entropy for the maxent solution we found with Lagrange:

              p = (0.3504, 0.1168, 0.2663, 0.2663)

              D = 0.3504 * log(4*0.3504) + 0.1168 * log(4*0.1168) + 0.2663 * log(4*0.2663) + 0.2663 * log(4*0.2663)

              = 0.3504 * log(1.4016) + 0.1168 * log(0.4672) + 0.2663 * log(1.0652) + 0.2663 * log(1.0652)

              log(1.4016)≈0.337 (since e^0.337≈1.4)
              log(0.4672)≈-0.758 (since e^{-0.758}≈0.468)
              log(1.0652)≈0.063

