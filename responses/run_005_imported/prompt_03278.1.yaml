          Bailey: Yes, and I would bite that bullet: the marginal should not change. The slight increase in relative entropy is the price we pay for respecting the conditional structure of the information.

          Alex: But then we are not being as conservative as possible in the information-theoretic sense.

          Bailey: Conservatism with respect to what? The prior joint distribution? Or the prior conditional distributions? The principle of maximum entropy is not the only game in town. And in this case, it leads to a counterintuitive shift.

