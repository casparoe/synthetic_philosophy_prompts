  The key point is how each theory handles existential claims. In epistemicism, there is one exact point where the transition happens. Supervaluationism, however, avoids claiming that any specific number is the cutoff. Instead, it's supertrue that such a number exists because every precisification has a cutoff, but no specific number is designated across all precisifications. This is the distinction between "there is a sharp cutoff" and "it is true that there is a sharp cutoff" without specifying which one.

