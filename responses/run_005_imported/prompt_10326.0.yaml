  ## A Toast to Professor Naomi Kessler: Passing the Trust Forward

  [Raise your glass]  
  To Professor Naomi Kessler!  

  Thirty-five years. A marriage, a family, a department, and a whole generation of students guided. And through it all, like a persistent, many-legged melody... the centipede.  

  For those of you who’ve heard that word murmured at Thanksgiving dinners since the days of shoulder pads and synth-pop, wondering if it involved exotic pets or a particularly ambitious gardening project – allow me, finally, to explain. Imagine a simple game. Two players. A pot of money. You can take it now, and get a small, safe sum. Or… you can *pass*. Pass, and trust the other player *won’t* grab the now-larger pot immediately on their turn. Pass again, and the pot grows bigger still. The theory – the cold, logical math of backward induction – says two perfectly rational players, who *know* each other is perfectly rational, should *never* pass. Not even once. Take the small sum immediately. Cash out. Game over.  

  That’s the centipede. Robert Rosenthal sketched it. Ken Binmore named it. And Naomi Kessler? Naomi spent her career wrestling with its beautiful, stubborn defiance of that clean, logical prediction. Because in the lab, with real, breathing humans? Hardly anyone cashes out on move one. They pass. They trust. They push the game forward, round after round, building something bigger than the initial, safe little sum.  

  Now, on the surface, celebrating Naomi tonight seems easy. We could just say: "Look! The grandmaster of the Centipede Game lived it! She never cashed out! Thirty-five years of passing, trusting, building! Irrational in the best possible way!"  

  [Pause, look pointedly at Naomi]  
  ...And I see that look, Professor. The one that says, "Ah, but you’ve oversimplified. You’ve missed the crucial wrinkle." Because you’d be right. It’s *not* that simple.  

  You spent decades arguing, brilliantly and tenaciously – often against colleagues who thought the matter settled – that the centipede isn’t *just* proof humans aren’t perfect calculating machines. It’s a crack in the very foundation of what "common knowledge of rationality" *means* in a game that has already unfolded past its theoretical expiration date. As Pettit and Sugden saw, the moment players *do* pass that first round, the initial assumption – that we both *know* the other will grab the pot instantly if given the chance – starts to crumble. The act of passing *itself* becomes evidence against the premise the backward induction needs to hold. Reaching a later round isn’t just defying the theory; it’s actively rewriting the conditions on which the theory was built.  

  *That’s* the parallel that truly captures Naomi Kessler.  

  Her thirty-five-year marriage? It’s not *just* a defiance of the "cash out early" model. It’s a living testament that reaching Year Two, Year Ten, Year Thirty-Five, fundamentally changes the game. The initial assumptions are challenged, re-evaluated, built upon with layers of shared history and trust. It’s evidence *against* the notion that the only rational play was to quit while you’re ahead.  

  Her career? Mentoring generation after generation of students, handing over the reins, the knowledge, the passion? That’s not merely "passing" in the centipede sense. It’s a profound argument *with* the very idea that stopping early is always optimal. Every student she guided, every thesis she supervised, every late-night discussion fueled by coffee and sheer intellectual curiosity – these weren't glitches in the rational model. They *were* the data points proving the model needed expanding. They showed that building something lasting, something that grows and endures and lifts others up, requires a different kind of calculation. One where trust isn't a weakness, but the engine of growth.  

  So, Naomi, as we celebrate your remarkable career, we aren’t just toasting someone who "played irrationally." We’re toasting someone who demonstrated, through every year spent in this department, every student nurtured, every paper written challenging the orthodoxy, that the backward induction argument for quitting early only holds if you believe the game *must* end on move one.  

  You showed us that by consistently, courageously *passing* – passing on opportunities to bail for easier paths, passing on knowledge, passing on trust, passing on the sheer joy of the puzzle – you weren’t merely violating a theory. You were engaged in a brilliant, thirty-five-year-long *argument* with it. An argument you won, round by round, student by student, year by year, by proving that the most rewarding outcomes often lie far beyond the first, safe exit.  

  You built a legacy not by cashing out, but by investing deeply, trusting profoundly, and always, *always* playing the long game. For showing us that the centipede, in the end, isn’t just about legs – it’s about heart, trust, and the incredible things that happen when we dare to pass the pot forward.  

  To Professor Naomi Kessler – a true master of the game, who taught us that the longest plays yield the richest rewards! Cheers!  

  **[Clink!]**
