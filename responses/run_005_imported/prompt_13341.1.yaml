answer: |-
  Your questions cut to the heart of a fascinating and historically dense moment in analytic philosophy. Let's unpack Ramsey's passage step-by-step:

  ### 1. **The God-Objectivity of Good Connection: Argument or Assertion?**
     - **Leaning on an Unstated Premise**: Ramsey is invoking a shared assumption of his audience (the Cambridge Apostles). The unstated syllogism is:
       - **P1**: Objective morality *requires* a transcendent foundation (traditionally God as the source/value-guarantor).  
       - **P2**: God has been "dismissed" (via logical positivism/science/naturalism).  
       - **Conclusion**: Therefore, objective morality ("Absolute Ethics") is also dismissed.  
     - **Historical Context**: This reflects the *dominant* post-theistic anxiety of early 20th-century analytic philosophy. For Russell (whom Ramsey is engaging), rejecting God *did* entail rejecting non-natural moral properties. Moore was the outlier defending non-naturalism *without* God – which is precisely why Ramsey's "we" excludes Moore. Ramsey isn't *arguing* here because he's addressing a circle that already accepted this linkage. Moore's view was seen by many (including Russell) as a mysterious holdover from Platonism/theology.

  ### 2. **"Absolute Ethics": Target Identification**
     - **Primarily Targeting G.E. Moore**: Yes. The timing (1925), location (Cambridge), and phrasing ("Absolute Ethics") point squarely at Moore's *Principia Ethica* (1903). Moore explicitly argued for "good" as a simple, non-natural, *absolute* (i.e., context-independent) property apprehended by intuition.
     - **Secondary Target: British Idealism**: Figures like Bradley and McTaggart *also* posited objective, absolute moral values grounded in metaphysical idealism. Ramsey lumps them together with theology as systems claiming knowledge of transcendent "real objects" – a claim the logical positivists/Apostles rejected as cognitively meaningless.

  ### 3. **Ramsey's Metaethical Position: Proto-Expressivism**
     - **The Textual Evidence**: "Theology and Absolute Ethics... have no real objects" is a clear denial of *cognitive content*. He collapses ethics into psychology ("what people want and how to satisfy it"), implying moral statements:
       - Aren't about mind-independent properties (anti-realism).
       - Aren't truth-apt (non-cognitivism).
       - Are expressions of desires/attitudes tied to human psychology.
     - **Modern Label: Expressivism/Emotivism (with Pragmatist Leanings)**:
       - **Emotivism (Ayer, Stevenson)**: Moral judgments express emotional attitudes. Ramsey's focus on psychology aligns closely.
       - **Expressivism (Gibbard)**: Broader view that moral language expresses planning/endorsing states. Ramsey's pragmatist tendencies (seen elsewhere) fit this.
       - **Why Not Error Theory?**: Error theory (Mackie) claims moral statements are *false* because they falsely presuppose objectivity. Ramsey goes further: he denies they even *purport* to describe "real objects," rendering them non-cognitive expressions. This is closer to Ayer's later emotivism.
     - **Confidence in the Label**: Moderate-to-high, but with caveats:
       - **Context**: This *is* an after-dinner talk, not a treatise. However, it aligns with Ramsey's other philosophical commitments (anti-metaphysical, verificationist-sympathetic, naturalistic).
       - **Key Support**: His 1929 paper *"Theories"* explicitly states: "In ethics... we are expressing our own feelings and commending them to others." This confirms his expressivist leanings.
       - **Nuance**: Ramsey wasn't a doctrinaire logical positivist. His pragmatism might soften his non-cognitivism, but this passage is squarely in the emotivist/expressivist camp.

  ### Why Moore Was Ignored in Ramsey's "We"
  Moore was a living counterexample, but Ramsey's "most of us would agree" reveals his audience:
  - **The Apostles' Milieu**: Dominated by Russell's influence, Wittgenstein's early positivism (Tractatus era), and a growing impatience with metaphysics. Moore's intuitionism was seen as unscientific and mysterian.
  - **Russell's Shadow**: Ramsey explicitly frames this as Russell's view ("his main statement"), and Russell *vehemently* rejected Moore's non-naturalism as incoherent without God. Ramsey is siding with Russell's naturalistic reduction.

  ### In Summary
  | **Aspect** | **Interpretation** |
  |------------|-------------------|
  | **God-Good Link** | Unstated premise: Objective ethics requires transcendence (dismissed with God). Moore excepted. |
  | **"Absolute Ethics" Target** | Primarily Moore; secondarily British Idealism (Bradley/McTaggart). |
  | **Ramsey's Metaethics** | Proto-expressivism/emotivism: Ethics expresses psychological states, lacks cognitive content. |
  | **Confidence Level** | High for non-cognitivism; moderate for precise sub-label (emotivism vs. expressivism) given context. |

  Ramsey's passage captures a pivotal shift: the Cambridge revolt against Platonism in *all* forms (theological or ethical). His breezy confidence reflects how settled this felt within his circle – a sentiment that would crystallize into logical positivism within a few years. Moore, though respected, was already a relic in their eyes. Your physicist's instinct is spot-on: this is less a tight argument than a snapshot of a paradigm asserting itself among elites. For deeper context, see Misak's *Frank Ramsey: A Sheer Excess of Powers* (2020) on his metaethics, and Monk's *Bertrand Russell* (Vol 2) on the Russell-Moore rift.
