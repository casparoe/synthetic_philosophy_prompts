answer: |-
  You've nailed the core philosophical tension in ergodicity economics. The objection is razor-sharp: **why time-average *wealth* specifically, rather than some monotonic transform of it?** Doesn't privileging "wealth" as the fundamental quantity just smuggle in log-utility through the back door? Let me steelman the strongest counterargument from the ergodicity economics camp (Peters et al.), addressing this directly.

  ### The Steelman: Dynamics Dictate the Observable, Not Preferences
  The strongest rebuttal hinges on **the physical nature of the economic process itself**, not abstract preference theory. Here's the core argument:

  1.  **Wealth is the *State Variable* of the Dynamical System:**
      *   In multiplicative growth processes (reinvesting bets, compounding returns), your current wealth `W_t` is the literal *state* of your financial system at time `t`. It's the quantity that gets multiplied by the stochastic return factor `(1 + r_i)` each period: `W_{t+1} = W_t * (1 + r_i)`.
      *   This isn't an arbitrary choice. It's dictated by the *rules of the game*. The casino, the stock market, or the investment opportunity *operates directly on your monetary wealth*. The return `r_i` is applied *to `W_t`*, not to `sqrt(W_t)`, `log(W_t)`, or `U(W_t)`. `W_t` is the input the system acts upon to produce `W_{t+1}`.

  2.  **Time-Averaging is About the Observed Path of the State:**
      *   When we talk about the "time average" along a single trajectory, we are fundamentally asking: *"What happened to this specific, observable quantity `W_t` over time for this one individual?"*
      *   The time average of growth is naturally defined as `lim_{T->∞} (1/T) * ∑_{t=1}^T log(W_t / W_{t-1})` (the average logarithmic growth rate). This directly measures the realized compound growth rate of the *observable state* `W_t` along the path you actually experience.
      *   Crucially, this quantity (`g = lim_{T->∞} (1/T) log(W_T / W_0)`) **determines your actual long-term wealth outcome**: `W_T ≈ W_0 * exp(g*T)`. Maximizing `g` maximizes your terminal wealth `W_T` for large `T`.

  3.  **The Non-Arbitrariness of `g`:**
      *   The time-average growth rate `g` isn't chosen because we "like" wealth. It's chosen because it is the **emergent property that governs the long-term fate of the state variable (`W_t`)** in the specific dynamical system defined by multiplicative reinvestment.
      *   Asking "why not time-average `sqrt(W_t)`?" is like asking "why track the position of a falling apple instead of the cube of its position?" The dynamical law (gravity) acts directly on position and velocity. Tracking position tells you where the apple *is*. Tracking `(position)^3` doesn't directly tell you where the apple is, nor does its time-average have a simple, direct physical meaning related to the apple's trajectory under gravity.
      *   Similarly, in multiplicative wealth dynamics, the time-average of `sqrt(W_t)` doesn't have a direct, fundamental link to the *system's long-term behavior* or your *ability to continue participating*. `g` does.

  4.  **Survival and Optionality are Embedded in `g` (Not in Arbitrary `U`):**
      *   Maximizing `g` inherently incorporates survival and the preservation of future optionality. Strategies that risk ruin (`W_t -> 0`) drive `g -> -∞`. Kelly avoids this.
      *   Consider a strategy with a positive expected value `𝔼[ΔW]` but a high risk of ruin (e.g., betting way over Kelly). The *ensemble average* `𝔼[W_T]` might be huge, dominated by the rare paths avoiding ruin. But *along your single path*, if ruin happens at `t=100`, then `W_t = 0` for all `t > 100`. Your time-averaged wealth `(1/T)∑W_t` crashes towards zero as `T->∞`, and your growth rate `g` is `-∞`. You lose *all* future optionality to experience utility. Maximizing `g` prevents this catastrophic loss of future opportunity *regardless* of your ultimate utility function `U(W)`.
      *   **Key Point:** Your future utility `U(W_{t_future})` can only be non-zero *if you survive with W_t > 0 until `t_future`*. Maximizing `g` is the strategy most likely to preserve `W_t > 0` indefinitely, allowing *any* subsequent `U(W)` to be realized later. It prioritizes staying in the game. An arbitrary `U(W)` optimized via ensemble averages might sacrifice this survival guarantee for illusory `𝔼[U]` gains dominated by non-ruin paths.

  5.  **Addressing the "Smuggling Log-Utility" Charge:**
      *   It's true that maximizing `g = <log(1+r)>` *mathematically resembles* maximizing expected log utility. However, the ergodicity argument provides a **dynamical justification** for *why* this specific form emerges as objectively necessary, distinct from preference-based justifications:
          *   **Preference-Based Log-Utility:** "I have a fundamental preference where the utility of money is proportional to its logarithm. Therefore, I maximize `𝔼[log(W)]`."
          *   **Dynamical Log-Growth (Ergodicity):** "The system I interact with multiplies my wealth `W_t` by random factors each period. To maximize the long-term growth rate of my observable wealth `W_t` along my single path, and crucially, to ensure I survive to keep playing/consuming, I must maximize the time-average of log returns `g = <log(1+r)>`. This functional form falls out of the multiplicative dynamics, not my psyche."
      *   The "log" here isn't a statement about the *joy* derived from wealth. It's a mathematical consequence of multiplicative dynamics (`W_{t+1}/W_t = 1+r`) combined with taking long-time limits (`(1/T)log(W_T/W_0) = (1/T)∑log(1+r_t)`). It's a property of the *system*, not (initially) the *agent*.

  ### Why This Might Feel Unsatisfying (and a Concession)
  The steelman relies heavily on accepting that "wealth" (`W_t`) is the fundamental, privileged state variable because **that's what the external economic system multiplicatively transforms.** If you reject this premise – if you believe the fundamental quantity of interest is inherently `U(W_t)` for some non-linear `U` defined by deep preferences – then the ergodicity argument for Kelly *as universally objectively rational* weakens.

  *   **Concession:** For an agent with a *known, specific, and bounded* utility function `U(W)` where `U(0)` is finite (e.g., `U(W) = sqrt(W)`), and for a *finite number of bets*, optimizing `𝔼[U(W_T)]` might indeed lead to different choices than Kelly. Ergodicity economics prioritizes long-run survival and growth *of the monetary bankroll* over finite-horizon expected utility. If your utility truly is `sqrt(W)` and you only care about `T=1`, Kelly isn't "objectively correct" *for that specific goal*.

  ### The Strongest Summary: Dynamics Force the Functional Form
  The principled, non-arbitrary reason ergodicity economics privileges time-averaging the growth rate of raw wealth is:

  **The multiplicative reinvestment process defines `W_t` as its state variable. The long-term fate of this state variable along a single trajectory is governed solely by the time-average logarithmic growth rate `g`. Maximizing `g` ensures the non-negativity and growth of `W_t`, which is a prerequisite for experiencing *any* future utility. The "log" emerges from the multiplicative dynamics (`dW/W = μ dt + σ dZ`) and the definition of long-term growth, not from an arbitrary choice akin to selecting a utility function. Therefore, for repeated multiplicative bets where survival and long-term growth matter, Kelly-like risk aversion is rationally forced by the dynamics themselves, independent of subjective preferences about the consumption value of wealth.**

  This argument doesn't claim humans intrinsically value log-wealth. It claims that in multiplicative environments, *preserving the ability to keep valuing anything at all* requires optimizing for the growth rate of the state variable the system acts upon. The "privileging" of wealth comes from the system's mechanics, not the agent's psychology.
