  The loose thread they mention - why sacrifice returns if prayer is "higher" - requires distinguishing between ideal worship and covenantal fidelity. For Maimonides, messianic sacrifice symbolizes restored divine-human relationship through obedient ritual, not because blood has intrinsic value. It's a divine concession to human need for tangible worship, even in utopia.

