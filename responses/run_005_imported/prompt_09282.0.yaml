answer: |-
  This is one of the thorniest ethical debates out there, and you've hit on a genuine inconsistency that philosophers have wrestled with for centuries. Priya's position (common as it is) relies on an unexamined **moral boundary** between humans and animals, and whether that boundary is justified isn't a simple "yes" or "no." Let's break down the arguments:

  ### 1. The Inconsistency You Spotted is Real (And Philosophically Recognized)
     *   **"Moral Calculus" vs. "Rights":** Priya is applying **utilitarianism** (maximize overall welfare/minimize overall suffering) to animals but **deontology** (certain acts are inherently wrong, regardless of consequences) to humans. Switching frameworks based solely on species *without justification* is indeed inconsistent.
     *   **The "Convenient Line" Problem:** As you said, "people count differently" isn't an explanation; it's the *assertion* of the boundary. The question is: *Why* does species membership create such a radical shift in moral consideration? What specific trait do *all* humans have that *no* animals have that justifies this absolute difference in treatment? Common answers (sentience, intelligence, autonomy, social contracts) often fail:
        *   *Sentience (Capacity to Suffer):* Chickens (and pigs, cows, fish) demonstrably suffer in factory farms. If suffering is what matters morally, why discount theirs?
        *   *Higher Cognition:* Severely cognitively impaired humans or infants lack complex reasoning, yet we still grant them basic rights Priya wouldn't grant to a more cognitively complex pig. Why?
        *   *Species Membership Itself:* This is circular. "Humans matter more because they're human" isn't a reason, it's bias (speciesism).

  ### 2. Why Priya's Gut Feeling (and Maybe Yours) Exists
     *   **Evolutionary & Cultural Baggage:** Humans evolved strong instincts to prioritize kin/tribe (other humans). We also have millennia of cultural conditioning viewing animals as resources. This "gut feeling" is powerful but not necessarily *morally justified*.
     *   **The "Human Dignity" & "Rights" Intuition:** We feel humans possess inherent dignity and rights that cannot be traded off, even for greater aggregate good. We see humans as "ends in themselves" (Kant), not merely means to an end. Applying the brutal factory model *to humans* triggers profound moral revulsion because it violates this core principle. The challenge is explaining why this principle *only* applies to humans if animals also have interests (like avoiding suffering).
     *   **Slippery Slope Fears:** Allowing brutal treatment of *any* humans based on aggregate utility feels dangerously close to justifying historical atrocities (slavery, sweatshops justified by economic growth). Drawing a bright line at "human" feels like a necessary safeguard, even if philosophically messy.

  ### 3. Coherent Bases for Different Treatment? (It's Complicated)
     *   **Sentience-Weighted Utilitarianism:** You *could* argue all sentient beings matter, but humans matter *more* due to greater capacity for complex suffering, flourishing, and social bonds. So, chicken suffering counts, but perhaps less than human malnutrition. The math gets fuzzy and subjective, but it avoids Priya's absolute switch. However, it still permits immense animal suffering if the human benefit is deemed large enough.
     *   **Rights-Based Approaches with Thresholds:** Some argue basic rights (to bodily integrity, freedom from torture) arise from sentience itself. Humans get *additional* rights (voting, free speech) based on higher capacities. This could grant animals basic welfare rights (against extreme suffering) while acknowledging humans have further protections. This challenges *extreme* factory farming but might allow more "humane" intensive farming.
     *   **Contractarianism:** Morality only applies to beings who can participate in a social contract (implicit agreement to follow rules). Since animals can't participate, we have no *direct* moral duties to them, only indirect duties (e.g., not being cruel because it coarsens *us*). This justifies Priya's absolute difference but is criticized for excluding vulnerable humans and dismissing animal suffering entirely.
     *   **Moral Relativism/Pragmatism:** Maybe absolute consistency is impossible. Humans simply *are* more important to us, and trying to build a perfectly consistent system is futile. We prioritize humans because we *are* human, and the practical benefits of cheap food outweigh the animal costs *for now*. This is honest about the bias but offers no moral defense against it.

  ### The Uncomfortable Conclusion
  Priya's position, as stated, **is inconsistent** without a deeper justification for the human/animal moral boundary. The "gut feeling" reflects deep-seated instincts and cultural norms, not necessarily a watertight ethical argument.

  **Where does that leave you?**
  1.  **Challenge the Boundary:** Ask Priya *what specific morally relevant characteristic* all humans possess that no animals possess that justifies using animals as mere means to human ends. If it's intelligence, ask about humans with severe cognitive disabilities. If it's species, point out the circularity. Push her to justify the line.
  2.  **Acknowledge the Complexity:** Admit that *both* positions have intuitive pull and philosophical backing. The conflict arises because:
      *   We *do* instinctively prioritize humans (strong deontological intuition).
      *   Suffering *does* seem bad wherever it occurs (utilitarian pull).
      *   Cheap food *does* have real benefits for poor humans (consequentialist concern).
  3.  **Seek Consistency Within a Framework:**
      *   *If* you accept strong utilitarianism, then Priya should be open to the brutal human factory scenario *if* the net benefit was sufficiently large and proven (though calculating "suffering units" is notoriously difficult).
      *   *If* you accept strong deontological rights for humans based on sentience/dignity, you need to explain why sentient animals don't deserve *some* basic protections against extreme suffering (like being crammed in cages unable to move).
  4.  **Consider Alternatives:** The debate often presents a false binary: brutal factory farming OR widespread human malnutrition. Are there alternatives? (e.g., significantly reformed higher-welfare farming combined with reduced meat consumption, plant-based protein innovation, economic policies addressing poverty directly). This moves the argument from pure ethics to practical solutions.

  **Ultimately, you're right to be troubled.** Priya hasn't justified the switch in moral frameworks; she's relying on an unexamined speciesist assumption. However, her intuition about human dignity points to a powerful moral principle that many find compelling. The truly coherent positions are either:
  *   **Expanded Moral Circle:** Grant sentient animals significant moral weight, challenging *extreme* factory farming (requires adjusting our actions/consequences calculus).
  *   **Strict Human-Centrism:** Acknowledge that only humans have direct moral status, making animal suffering irrelevant *in itself* (though consequences for humans matter). This avoids inconsistency but requires accepting a stark moral hierarchy many find unpalatable.

  Most people, like Priya, live in the messy middle ground – an inconsistency driven by deeply held but conflicting intuitions. Your job isn't necessarily to "win" the argument with Priya, but to push both of you to think more deeply about *why* you draw the lines where you do. That introspection is where real ethical progress begins.
