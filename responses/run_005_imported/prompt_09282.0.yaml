  I should consider how moral philosophy handles this. The user's describing classic utilitarian vs deontological conflict: tallying net good versus absolute rights. For animals, Priya uses Bentham-style math ("can they suffer?"), but for humans she invokes Kant - treating people as ends, not means. That's actually philosophically coherent if you believe humans have different moral status. 

  But is that belief defensible? The user's skepticism about "convenient lines" is valid. History shows we've drawn arbitrary moral boundaries before (slaves, women). Maybe the real question isn't "can we treat species differently" but "what makes humans special?" Sentience? Rationality? Both exist on spectrums - chickens feel pain, humans aren't always rational. 

  The user might also be wrestling with cognitive dissonance. Their brain says "inconsistent" but their gut says "both feel right." That's normal - we evolved different moral circuits for kin, tribe, and animals. Our disgust reflex fires harder for human exploitation. Doesn't make it right, but explains the double standard.

