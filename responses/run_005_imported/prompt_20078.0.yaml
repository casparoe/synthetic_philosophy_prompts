   We structure the questions accordingly.

   Let's begin.

   Part 1: Motivation for imprecise credences (Ellsberg-style)
   Question 1: Could you explain, perhaps using an Ellsberg-style example, why unspecific or symmetric evidence should be represented by a set of probabilities rather than a sharp probability? In particular, why does the set better capture the agent's doxastic state?

   Follow-up (if she emphasizes the inability to assign a precise number due to lack of information): But doesn't the requirement to assign a sharp probability in the Ellsberg case actually force the agent to make an arbitrary choice? And if so, why is that a problem? After all, in decision-making, one must act, and the imprecise model also requires a decision rule to choose an action.

   Part 2: Dilation problem
   Question 2: One well-known issue with imprecise credences is dilation. For example, when an imprecise agent conditionalizes on new evidence that is symmetric or uninformative, the set of probabilities can become less precise. This seems to go against the idea that learning should make us more confident. How do you respond to the charge that dilation is a counterintuitive feature of imprecise credence updating?

   Follow-up (if she downplays the practical significance or argues that it is rare): But dilation seems to occur in a wide range of cases, including when the evidence is logically independent of the event in question. Doesn't this suggest that the updating rule for imprecise credences is flawed? Or would you argue that this is just an acceptable cost of the model?

   Part 3: Roger White's charge
   Question 3: Roger White, in "Evidential Symmetry and Mushy Credence", argues that imprecise credences can lead to an updating paralysis when the evidence is symmetric between hypotheses. For instance, if an agent starts with an imprecise credence in a hypothesis and then receives evidence that is symmetric (i.e., equally likely on either hypothesis), then the updated credence remains the same. But intuitively, the evidence should at least sometimes break the symmetry. How do you avoid this paralysis?

   Follow-up (if she suggests that the agent should have updated differently or that the problem only arises in specific cases): But if the agent's representor is symmetric and the evidence is symmetric, then by the standard update rule (conditionalizing each probability in the set) the set remains the same. Isn't that a failure to learn? How can the agent ever break the symmetry if every piece of evidence is symmetric?

   Part 4: Pressing on the "plan in advance" deflection for Elga's sequential bets
   We now turn to the main deflection. We want to build up to make the deflection harder.

   Question 4: You've argued that Elga's sequential-bets worry is an objection to naive, bet-by-bet choice, not to imprecise credence itself, and that a rational agent plans her whole policy in advance. Could you elaborate on what such a policy would look like? Specifically, how does the agent decide, in advance, which bets to accept and which to reject, given that she has a set of probabilities?

   Question 5: Suppose the agent doesn't know in advance which bets she will be offered in the future. How can she formulate a comprehensive policy that covers all possible bets? Isn't the set of possible bets extremely large (even infinite), making it impractical?

   Question 6: Even if we grant that the agent can plan a policy in advance, how does this avoid the Dutch book? In Elga's scenario, the two bets individually are acceptable by the agent's set (so they would be included in the policy if considered individually) but together they lead to a sure loss. If the agent's policy is to accept each individually, then the package is accepted. If the policy is to reject one of them, then the agent must reject a bet that is acceptable by her own lights. How does the imprecise model avoid this dilemma?

   Question 7: You might appeal to E-admissibility: the agent chooses a policy that is E-admissible, meaning that there is some probability in the set that recommends the entire policy. But in the sequential case, the agent must choose without knowing the future. How does the agent know that the entire sequence of choices will be E-admissible? And if the agent must consider the entire sequence, doesn't that require her to have a joint policy over all possible future bets? How is that feasible?

   Part 5: Closing
   Question 8: Finally, we are curious: what kind of observation or argument would actually persuade you that credences must be sharp? Is there a conceivable scenario or a theoretical result that would change your mind?

