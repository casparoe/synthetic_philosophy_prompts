  The user's main point is about intertheoretic value comparisons. They mentioned that without a non-arbitrary way to compare values across different moral theories, moral trade isn't well-defined. They also asked if ordinal rankings could solve this. I need to address both the cardinal and ordinal aspects.

  First, why are intertheoretic comparisons necessary? In a moral trade, each person needs to assess if the gains from the other's actions outweigh their own sacrifices. For example, a utilitarian helping a deontologist might have to give up actions that maximize utility to adhere to deontological rules. But how much utility loss is acceptable for what level of rule adherence? This requires a common scale, which doesn't exist across theories.

  Now, the user is wondering if ordinal rankings within each theory could help. Ordinal rankings mean you can order outcomes (better or worse) but not quantify the differences. For moral trade, you need to compare the magnitude of gains and losses across theories. If Person A values outcome X over Y, and Person B values Z over W, but how do you know that A's gain from Z is worth B's sacrifice in doing X? Without knowing the ratios or trade-offs, it's impossible to balance the exchange.

  Another angle is mutual benefit. Each party must agree that the trade leaves them better off. But "better off" is defined within their theory. If the trade involves compromises that are hard to compare, one might feel the trade isn't beneficial. For instance, a utilitarian might need to know if the utility loss from not saving lives is justified by the deontologist's reciprocal action. Without a common metric, this assessment is subjective.

  Also, even if both parties subjectively agree, the lack of intertheoretic comparisons makes the trade's benefit ambiguous. There's no objective way to verify that both are genuinely better off. This subjectivity could lead to exploitation or unfair trades where one party benefits much less than the other.

  The user's deeper need might be to critically evaluate moral trade for their club. They might be preparing a discussion or debate, so they need a strong, logical counterargument. They might also be interested in the philosophical underpinnings of effective altruism and how moral uncertainty is handled. Addressing both the technical issue of value comparisons and the practical implications for effective altruism would add depth.

  In conclusion, without a non-arbitrary method for intertheoretic value comparisons, moral trade remains ill-defined. Ordinal rankings don't resolve the issue because they lack the necessary cardinal information for trade-offs. This challenges the feasibility of moral trade as a hedge against moral uncertainty, which is central to effective altruism strategies.
answer: |-
  Here’s a rigorous argument against the coherence of moral trade under moral uncertainty, centered on the **intertheoretic comparison problem**:

  ### Core Objection: The Impossibility of Intertheoretic Value Comparisons
  Moral trade requires both parties to agree that:
  1. **Their sacrifice** (e.g., acting against their own theory) is *outweighed* by the benefit gained from the other’s reciprocal action.
  2. This judgment must be made *under moral uncertainty*—i.e., neither can be certain their theory is correct.

  The problem arises because **comparing gains/losses across rival moral theories requires a common scale of value**, which does not exist. For example:
  - **Utilitarian (Alice)**: Measures value in *utils* (e.g., well-being units).
  - **Deontologist (Bob)**: Measures value in *duty-fulfillment* (e.g., adhering to rules like "don't lie").
  - **Alice’s sacrifice** (e.g., allowing a minor lie to increase utility) is a *utility loss* but a *duty-fulfillment gain*.
  - **Bob’s reciprocal action** (e.g., donating to charity against his principles) is a *duty-fulfillment loss* but a *utility gain*.

  **To claim the trade is mutually beneficial, we must answer**:  
  *Is Alice’s utility gain from Bob’s donation *greater than* her utility loss from telling a lie? And is Bob’s duty-fulfillment gain from Alice’s honesty *greater than* his duty-fulfillment loss from donating?*  

  But these comparisons are **intertheoretic**:
  - Alice’s "benefit" (utility) and "cost" (duty violation) belong to *incommensurable frameworks*.
  - Bob faces the same incommensurability.
  - There is no non-arbitrary way to say "1 util = X units of duty-fulfillment," as the theories lack shared axioms.

  ### Why Ordinal Rankings Fail to Rescue Moral Trade
  Ordinal rankings (ordering outcomes *within* a theory) are insufficient because:
  1. **No cross-theory equivalence**:  
     Even if both theories rank outcomes ordinally, they lack:
     - A shared "zero point" (e.g., is "no duty violation" equivalent to "zero utils"?).
     - A shared unit of measurement (e.g., does moving from outcome A→B in utilitarianism equal moving from C→D in deontology?).
     
     **Example**:  
     - Alice ordinally prefers {Donation + Lie} > {No Donation + Truth} *in utility terms*.  
     - Bob ordinally prefers {Truth + No Donation} > {Lie + Donation} *in deontological terms*.  
     - This tells us nothing about whether Alice’s *gain* from donation *offsets* her *loss* from lying (or vice versa for Bob), as losses/gains are defined in *different currencies*.

  2. **The trade requires cardinality**:  
     Moral trade implicitly relies on **marginal rates of substitution**:  
     - How much utility must Alice gain to compensate for a unit of duty violation?  
     - How much duty-fulfillment must Bob gain to compensate for a unit of utility sacrifice?  
     Ordinal rankings cannot quantify these trade-offs. Without cardinal intertheoretic comparisons, we cannot determine if the exchange is *net beneficial* for either party.

  3. **Subjectivity ≠ Mutual Benefit**:  
     If both parties *subjectively feel* better off, this reflects **pragmatism or preference satisfaction**, not *moral improvement under uncertainty*. Ord’s moral trade claims to be objectively beneficial *by each theory’s lights*, but without intertheoretic comparisons, "better off" collapses into personal psychology, not moral reasoning.

  ### Why the Problem is Inescapable
  - **Moral uncertainty compounds the issue**:  
    If Alice is 60% confident in utilitarianism and 40% in deontology, she must weigh:  
    - The utility loss/gain *weighted by 60%*.  
    - The duty-fulfillment loss/gain *weighted by 40%*.  
    **This requires adding utils to duty-units**, which is mathematically incoherent without a conversion factor.  

  - **No neutral arbitration**:  
    Proposals like "voting" or "bargaining" assume parties can compare proposals *across theories*, but this merely disguises intertheoretic comparisons as interpersonal compromises.  

  ### Conclusion: Moral Trade is Ill-Defined
  Moral trade fails because **mutual benefit cannot be established without intertheoretic value comparisons**, and no non-arbitrary method exists for making such comparisons—even ordinally. Ordinal rankings *within* theories lack the cardinal information needed to balance gains/losses *across* theories. Thus, what appears to be a "trade" is merely a behavioral pact justified by subjective preferences, not a hedge against moral uncertainty. This undermines moral trade as a tool for effective altruism, as it cannot reliably improve outcomes under rival moral frameworks.
