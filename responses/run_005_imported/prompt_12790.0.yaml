prompt: |-
  I recently joined a graduate seminar on the philosophy of general relativity, and, rather to my surprise, the very first session was devoted not to Einstein but to Newton. The instructor's point was that the "hole argument" over whether spacetime points have their own primitive identity apart from the metric field — which is actually the reason I applied to this program, since I'm hoping to eventually work on background independence in quantum gravity — is best understood as the modern descendant of a much older dispute, and that we ought to read that dispute in Newton's own words rather than in the tidy secondhand paraphrases most of us picked up as undergraduates. So I went back to the Scholium on space, time, and motion at the start of the Principia, in Andrew Motte's eighteenth-century translation, and while I can follow the setup of the famous bucket experiment easily enough, I'm having trouble pinning down exactly what Newton takes himself to have established by the end of it, especially once I try to state it precisely enough to compare with the moves people make in the hole-argument literature.

  Here is the passage I keep getting stuck on: "If a vessel, hung by a long cord, is so often turned about that the cord is strongly twisted, then filled with water, and held at rest together with the water; thereupon, by the sudden action of another force, it is whirled about the contrary way, and while the cord is untwisting itself, the vessel continues for some time in this motion; the surface of the water will at first be plain, as before the vessel began to move; but the vessel, by gradually communicating its motion to the water, will make it begin sensibly to revolve, and recede by little and little from the middle, and ascend to the sides of the vessel, forming itself into a concave figure (as I have experienced) ... This ascent of the water shows its endeavour to recede from the axis of its motion; and the true and absolute circular motion of the water, which is here directly contrary to the relative, discovers itself, and may be measured by this endeavour ... And therefore this endeavour does not depend upon any translation of the water in respect of the ambient bodies, nor can true circular motion be defined by such translation."

  What I can't work out is this: strictly speaking, all Newton has ruled out here is that the water's tendency to climb the sides depends on its motion relative to the vessel. He hasn't ruled out that the relevant motion might instead be relative to some more inclusive body — the fixed stars, say, or the material contents of the universe as a whole — which is more or less the line Mach took two centuries later. Is that gap already present in the bucket passage on its own, or is it only closed, if it's closed at all, by the separate two-globes thought experiment that comes a bit later in the same Scholium? And if the real work is being done by the two-globes case rather than the bucket, does that mean the bucket experiment by itself shows less than it's usually given credit for? I'd like to get clear on this before next week's session, since it seems like how one resolves it determines which side of the hole argument one finds intuitive to begin with.
reasoning: |-
  Okay, let me unpack this user's query. They're in a graduate seminar on the philosophy of general relativity, starting with Newton's Scholium. The focus is on the hole argument's roots in Newton's bucket experiment. The user is confused about what Newton actually proves with the bucket and whether it rules out relative motion to larger bodies like fixed stars. They also wonder if the two-globes thought experiment is necessary to complete Newton's argument.

  First, I need to recall Newton's bucket experiment details. Newton observes that the water's concave shape occurs only when there's absolute motion, not relative to the bucket. But the user points out that Newton hasn't addressed motion relative to distant stars. That's a valid gap. Mach later argued that inertia could depend on the mass distribution of the universe, like fixed stars. So, the bucket alone doesn't counter that.

  Then there's the two-globes experiment. Newton uses it to show that absolute motion can exist without observable relative motion. If two globes rotate around their center, tension in the cord indicates absolute rotation even without other reference points. This directly challenges Mach's idea by implying motion isn't relational to distant bodies.

  The user’s deeper concern is connecting this to the hole argument in GR. The hole argument deals with spacetime points having identities independent of the metric. Newton's absolute space is analogous—spacetime points might have identities beyond relational structures. If Newton's argument holds, it supports substantivalism; if Mach is right, relationalism. So understanding if the bucket alone suffices or needs the globes is crucial for their seminar discussion.

  The user might also be preparing to contribute to next week's session. They need a clear analysis to compare with the hole argument. Clarifying whether Newton's argument is complete with the bucket or requires the globes will shape their stance on background independence in quantum gravity. They might be looking for a nuanced view that both experiments play roles: the bucket introduces the issue, the globes address the relational challenge.
answer: |-
  You've pinpointed the core interpretive challenge in Newton's bucket argument perfectly. Your reading is astute: **the bucket experiment, by itself, does *not* rule out motion relative to a larger encompassing frame like the fixed stars.** Mach's later critique directly exploits this gap. The *two-globes* thought experiment is absolutely crucial for Newton to close this loophole and establish the necessity of absolute space. Here's a breakdown:

  1.  **What the Bucket Experiment *Does* Establish (Alone):**
      *   It successfully demonstrates that the *physical effect* (the water's concave shape, signifying "endeavour to recede from the axis") **cannot be explained solely by the water's motion relative to the immediately surrounding bucket walls.**
      *   At the start (water spinning *with* the bucket), there is high relative motion between water and bucket but *no* concave shape (plain surface).
      *   Later (water spinning *relative to* the stationary bucket), there *is* a concave shape, but the relative motion has decreased significantly.
      *   Newton concludes: "the true and absolute circular motion... discovers itself, and may be measured by this endeavour... [it] does not depend upon any translation of the water in respect of the ambient bodies" (i.e., the bucket). This is valid *based on the bucket alone*. He refutes the idea that the *local container* defines the relevant motion.

  2.  **The Gap You Identified:**
      *   As you say, Newton hasn't addressed whether the water's motion relative to *distant bodies* (the fixed stars, the rest of the universe) correlates with the concave shape. Perhaps the concave shape appears *because* the water is accelerating relative to the cosmic mass distribution.
      *   This is precisely Ernst Mach's later point (Mach's Principle): inertia is *not* an inherent property of matter but arises from its relation to the total mass in the universe. For Mach, Newton's bucket experiment only shows that *local* relative motion isn't the cause; the cause is motion relative to the "fixed stars." The concave shape arises because the water is rotating relative to the universe's mass.

  3.  **The Role of the Two-Globes Thought Experiment:**
      *   Newton anticipates this objection. The two-globes experiment is designed explicitly to close this gap and rule out relational definitions involving *any* external bodies.
      *   **The Scenario:** Imagine two globes connected by a cord, alone in otherwise empty space. They are either (a) at rest relative to each other with the cord slack, or (b) revolving around their common center of gravity with the cord taut.
      *   **The Challenge:** How can you tell the difference? There are no other bodies to measure motion *relative to*. All *observable* relations between the two globes themselves (distance, tension) are identical in both scenarios *if* you only consider their mutual relations. In (b), the cord is taut, indicating a "force of recession" (centrifugal force).
      *   **Newton's Point:** The *only* way to distinguish scenario (a) from (b) is to invoke **absolute space**. In (b), the globes possess *absolute* rotational motion, detectable by the tension in the cord, even though there is *no* relative motion to any *other* observable bodies. The force (tension) reveals absolute motion directly. This tension cannot be explained by motion relative to other bodies because *there are no other bodies*.
      *   **Closing the Gap:** This experiment shows that the "endeavour to recede" (manifested as tension or the water's concavity) can exist *even in the complete absence of other bodies to serve as a relational reference frame*. Therefore, the cause *cannot* be motion relative to external bodies (like the fixed stars), because the effect occurs when no such bodies exist. The effect must be due to motion relative to space itself – absolute space.

  **Answering Your Specific Questions:**

  1.  **Is the gap present in the bucket passage alone?** **Yes, absolutely.** The bucket experiment, by its nature (occurring within a universe presumably containing other matter), cannot distinguish between motion relative to absolute space and motion relative to the fixed stars/cosmic mass. It only rules out motion relative to the *local* container.
  2.  **Is the gap only closed by the two-globes experiment?** **Yes.** The two-globes scenario is specifically designed to eliminate the possibility that the "endeavour to recede" depends on relations to *any* external bodies. It isolates the phenomenon and shows it must depend on something else – absolute space.
  3.  **Does the bucket by itself show less than usually credited?** **Yes and No.**
      *   **Yes:** It is often presented (especially in undergraduate summaries) as a standalone argument for absolute space. As you've realized, it isn't sufficient for that. Taken alone, it *only* refutes a *naive relationalism* based solely on the local container. It leaves Machian relationalism untouched.
      *   **No:** It *is* crucial for setting up the problem. It vividly demonstrates a physical effect (force, concavity) that correlates with rotation but *not* with the most obvious relative motion (to the bucket). This forces the question: relative to *what*, then? The two-globes experiment provides Newton's definitive answer to that question, ruling out the next obvious candidate (distant matter).

  **Connecting to the Hole Argument & Background Independence:**

  Your insight about the connection is spot-on. How one interprets Newton's argument fundamentally shapes intuition for the hole argument:

  *   **Newtonian Substantivalism (Absolute Space Wins):** If Newton's two-globes argument is successful, it establishes that spacetime points (or absolute space) have a primitive identity. The globes *are* rotating in scenario (b), even though all observable relations are identical to scenario (a). This difference *only* makes sense if the points of space themselves have an identity – the globes are moving relative to *different spatial points* over time in (b), but not in (a). This view aligns with the substantivalist intuition challenged by the hole argument: spacetime points exist independently of the matter fields (metric included).
  *   **Machian Relationalism / Modern Relationalism:** Mach argued that the two-globes experiment is incoherent or that the tension *wouldn't* arise in truly empty space – inertia depends on the fixed stars. Modern relationalists (inspired by Mach and Leibniz) argue that only relative configurations of matter have physical reality. For them, Newton failed to close the gap; scenario (a) and (b) are physically identical if there are no other bodies. The hole argument exploits a similar relationalist intuition: if two metric fields are related by a diffeomorphism (a smooth reshuffling of spacetime points), they describe the *same physical situation* – the points lack primitive identity, only the relational structure matters. This is the core of background independence in quantum gravity: the physics shouldn't depend on an arbitrary labeling of points, only on invariant relations.

  **Conclusion for Your Seminar:**

  You are correct. The bucket experiment alone establishes that rotation cannot be defined relationally *to the local container*, but it leaves open the possibility of relationalism defined by distant matter (Mach). Newton relies **decisively** on the two-globes thought experiment to rule out *any* form of relationalism defined by other bodies and argue for the necessity of absolute space (substantivalism). Recognizing this structure is vital:

  1.  **Bucket:** Demonstrates the *problem* – a physical effect not explained by local relative motion.
  2.  **Two-Globes:** Provides the *solution* – rules out relationalism to other bodies, argues for absolute space.

  This structure directly mirrors the tension in the hole argument between substantivalism (points have identity) and relationalism (only structure matters). How convincing you find Newton's two-globes argument (and its modern analogs) will heavily influence which side of the hole argument feels more intuitive as you delve into background independence in quantum gravity. Be prepared to discuss *why* you find (or don't find) the two-globes scenario convincing!
