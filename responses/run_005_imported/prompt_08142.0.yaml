  Breaking it down: The key issue is the non-measurability of the sets f(x). Under CH with choice, the well-ordering is so pathological that f(x) isn't Lebesgue measurable. The dart-throwing intuition assumes that "measure zero means can't hit," but that's only reliable for measurable sets. For non-measurable sets, probability doesn't apply cleanly. So, the contradiction doesn't hold because the sets aren't subject to Lebesgue measure in a straightforward way.

  Also, the symmetry assumption in AX might implicitly assume that the reals aren't well-orderable in such a way, which is equivalent to ¬CH. So using AX to disprove CH could be circular. The user needs to highlight that AX is an independent principle, not a universally accepted axiom. 

