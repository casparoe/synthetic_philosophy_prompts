prompt: |-
  Random philosophy detour, sorry in advance. I'm about a third of the way into a new novel and there's a subplot that's turned into a bit of a rabbit hole for me. My protagonist is a manuscript conservator who gets hit by a car and wakes up in a body cast, basically numb from the neck down for a few weeks -- and since she'd been cataloguing a box of old Arabic-language philosophy manuscripts right before it happened, I want her to start piecing her sense of self back together through Avicenna's flying man thought experiment, half-remembered and warped by the painkillers. Problem is, that means I actually have to understand the argument properly instead of just working off the two-sentence version that shows up in every intro philosophy blog post: guy created floating in midair, no senses, still somehow certain he exists, therefore the self isn't the body.

  So here's what I'm actually asking: can you give me the deeper, more contested version of this? Specifically, is Avicenna trying to prove something like full substance dualism -- that the soul is a distinct immaterial thing -- or is the argument doing something narrower, more about self-awarness being immediate and non-inferential, without necessarily settling what the self is made of? I keep seeing people describe it as basically Descartes' cogito centuries early, and other people get visibly annoyed by that comparison, like it flattens something important. What's actually going on in that disagreement? And is it worth knowing that the argument apparently shows up more than once in his work -- I think theres a version in the psychology part of the Shifa and a separate one in the Isharat -- or is that a rabbit hole within the rabbit hole that won't matter for one hallucinatory hospital-bed scene?
