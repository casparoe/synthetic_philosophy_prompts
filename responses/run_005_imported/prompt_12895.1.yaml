answer: |-
  ## The Resolute Heart: A Toast to Priya & [Partner's Name]

  [Raise your glass slightly, warm smile] Friends, family, colleagues... and a statistically significant number of people who can actually explain what a money pump *is*... thank you for gathering to celebrate Priya and [Partner's Name]! Priya, being deemed "the funny one" is a dubious honor in a philosophy department – it usually just means I’m the least afraid of silence. But I am deeply honored you asked me, especially knowing your... *particular* area of expertise.

  Priya’s brilliant mind dissects how we make choices over time. She wrestles with questions like: Can someone with preferences that shift or loop – maybe liking A over B, B over C, but C over A – be tricked, step by step, into giving up everything they value? It’s called being “money pumped.” The antidote, she argues, isn’t just being clever in the moment, but being *resolute*.

  Now, to the uninitiated, that might sound like stubbornness. But Priya knows it’s deeper. In decision theory, you face choices across time. A "naive" person might make a grand plan but abandon it the second something shinier appears later. A "sophisticated" person is cleverer – they *foresee* their future self’s weakness and might restrict their options *now* to avoid that future mistake. Think Ulysses tying himself to the mast to resist the Sirens. Effective? Sure. But it’s about binding your hands.

  **Resoluteness is different.** It’s harder. It means making a plan *now* for your *whole self* across time – and then, when that future moment arrives, even though the tempting alternative is *right there*, freely available... you *choose* the original plan. You keep the mast untied. You look at the Siren song... and you hum your wedding vows instead. You don’t re-optimize based *only* on the immediate, local preferences of that future self. You stick to the commitment your *past* self made, because it represents what your *whole self*, across time, truly values.

  **[Pause, look at Priya and Partner]**

  And *that*, my friends, is marriage. It’s not naivete – Priya and [Partner's Name] are far too brilliant for that. They know life throws curveballs, temptations, hard days. It’s not sophistication in the Ulysses sense – they’re not building cages or binding contracts to *force* fidelity. They’re walking in eyes wide open, hand in hand, making a *resolute* plan.

  The vows they’ll exchange today aren’t magic spells. They’re a declaration of resolution. They’re saying: "This is our plan. This love, this partnership, this shared life – *this* is what we value most, across all the days and years to come. And when a future self, maybe tired, maybe stressed, maybe momentarily dazzled by something marginally shinier, whispers, ‘Hey, renegotiate? Optimize just this once?’... we choose the plan. We choose *us*."

  **[Lighten the tone slightly]**

  Because the alternative? The constant re-optimizing? That’s the trap. That’s how you get… well… *pumped*. You start making little trades, day by day, convenience by convenience, momentary preference by momentary preference… and suddenly, you look around and wonder where the core of the thing you built actually went. It’s not that you meant to lose it; it just got traded away, bit by bit, for candy bars or slightly comfier shoes or… whatever the relational equivalent of a slightly better parking spot might be. *[Pause for a knowing chuckle from the theorists]*.

  Priya, your work shows us that true rationality isn’t just winning each tiny battle of the moment. It’s about *coherence* across time. It’s about your whole story making sense. Marriage asks that same coherence of the heart. It asks for resolution.

  So, to Priya and [Partner's Name]: May your love be a fortress built not on restrictions, but on the daily, resolute choice to stand within its walls together. May you face life’s infinite choices not as isolated agents constantly recalculating, but as partners bound by a beautiful, shared plan – a plan you reaffirm not because you *have* to, but because you *choose* to, every single day. May you always remember that the deepest love isn’t found in constantly seeking a marginally better deal; it’s found in the profound, unwavering commitment to the incredible partnership you’re building *right now*.

  **Love isn’t the plan; it’s *why* we stick to the plan. Here’s to choosing the plan. Here’s to Priya and [Partner's Name]!**

  **[Raise glass high] To Priya and [Partner's Name]!**

  ## Why this works

  1.  **Theory Accuracy:** Nails the resolute/sophisticated/naive distinction. Clearly defines resoluteness as *keeping options open but choosing the plan anyway*, explicitly contrasting it with Ulysses-style pre-commitment (sophistication). Correctly frames marriage vows as the "plan" and sticking to them as the resolute choice against constant local re-optimization (the money-pump trap).
  2.  **The Insider Joke:** The "candy bars or slightly comfier shoes or… whatever the relational equivalent of a slightly better parking spot might be" line *is* the money-pump joke. Theorists will instantly recognize the classic "trade A for B + a penny, trade B for C + a penny, trade C for A + a penny -> you're down three pennies" structure, applied subtly to a relationship. Non-theorists will just hear examples of trivial temptations.
  3.  **Accessibility:** Uses clear metaphors ("fortress," "standing within walls," "curveballs," "Siren song" even if critiqued). Explains key terms ("resolute," "re-optimize," "coherence across time") in simple language. Focuses on the universal *feeling* of commitment, using the theory as a lens, not the object.
  4.  **Emotional Core:** Grounds the theory in the profound truth of marriage – choosing "us" consistently over time. Lines like "Love isn’t the plan; it’s *why* we stick to the plan" and "true rationality... is about your whole story making sense" resonate deeply.
  5.  **Avoids Pitfalls:** Explicitly dismisses naivete and distinguishes resoluteness from Ulysses. Praises Priya's work without turning it into a lecture. Keeps the focus firmly on the couple and their love.
  6.  **Length & Tone:** Approximately 650 words, fitting a 5-minute delivery. Warm, sincere, celebratory, with appropriate moments of lightness and depth.

  **Deliver it with warmth, confidence, and eye contact (especially with Priya and her partner during the key lines about commitment).** You’ve got this! Congratulations to Priya!
