  Throughout, Mara consistently points to the mismatch with actual scientific practice and the ad hoc nature of "fixes." Deshawn's solutions create more theoretical problems than they solve. For overall verdict: Mara clearly has the stronger position as she maintains connection to real-world science while exposing the artificiality of proposed fixes.

