  Okay I need a sanity check because I've been chewing on this since last night and can't quite let it go. We had people over for game night and it came up that our friend Mara and her husband have an open marriage — fully consensual, both of them into it, nobody's being lied to or cheated on. After she left, my friend Devon got kind of heated about it, saying it's still wrong even though nobody's getting hurt, because marriage just isn't "supposed" to work that way, and if he's honest it kind of grosses him out. I said if nobody's harmed and both of them are genuinely happier this way, I don't see what's left to be wrong about. Devon said that's a cop-out — that if "nobody's hurt and everyone's into it" is my whole standard, then I can never actually call anything wrong, and that the fact that pretty much every culture throughout history has looked down on this kind of thing has to count for somthing, otherwise why would the reaction be so universal.

  I don't think Devon's a prude or a bad guy for feeling that way, but "it squicks me out" and "it's morally wrong" still feel like two different claims to me, even though I couldn't cleanly separate them for him in the moment, so we just ended up agreeing to disagree, which is bugging me more than it should. Is Devon actually onto something when he says my standard proves too much, or is his gut reaction to Mara's marriage just doing a lot of unexamined work thats getting dressed up as a moral argument? I'd love something sharper than "ethics is complicated" here — is there an actual, rigorous way to adjudicate whether disgust or tradition can carry moral weight on its own, separate from whether an act actually harms anyone?
reasoning: |-
  Okay, let me unpack this user's query. They had a game night where Mara's open marriage came up, leading to a debate with Devon. Devon argues that even without harm, such marriages are wrong because they defy traditional norms and disgust him. The user countered with a harm-based view but couldn't articulate why Devon's stance feels flawed. Now they want a rigorous analysis of whether disgust or tradition alone can justify moral judgments.

  First, I need to recall ethical frameworks. Utilitarianism focuses on harm and well-being. If no one is harmed and everyone consents, it's hard to argue immorality under this view. Devon's appeal to tradition and disgust doesn't fit here. But he might be drawing from deontology or cultural relativism. Deontology looks at duties and rules. Maybe Devon sees marriage as having inherent rules, like exclusivity. But why are those rules binding? He'd need to justify why those rules exist beyond tradition.

  Cultural relativism says morals depend on culture. Devon points out most cultures disapprove of open marriages. But this is a fallacy—commonality doesn't equal correctness. History shows many widespread practices were harmful, like slavery. So tradition alone isn't a valid moral argument. 

  Then there's disgust. The user mentioned "squick." Ethicists like Martha Nussbaum argue disgust is often rooted in irrational biases, not morality. Linking disgust to morality can justify prejudice. For example, past disgust towards interracial marriages was morally wrong. So disgust needs scrutiny, not blind acceptance.

  Devon's claim that the user's standard "proves too much" is interesting. He thinks that without harm, anything goes. But consent is key here. Harm principle usually includes consent. Non-consensual acts cause harm, so they're excluded. Also, societal harm needs evidence. Devon didn't provide any, just discomfort. So the user's standard isn't too permissive; it has boundaries.

  The user wants a sharp distinction between disgust and moral wrongness. Philosophically, the burden is on Devon to show harm beyond his discomfort. If he can't, then his view is based on personal aversion, not ethics. The user might need to ask Devon what specific harm arises from consensual non-monogamy. If it's just tradition or disgust, those aren't sufficient grounds for moral condemnation.

  Underlying all this, the user might feel conflicted about respecting Devon's feelings while rejecting his moral stance. They need a way to validate his emotions without conceding the moral argument. Emphasizing that feelings are real but not proof of immorality could help. Also, highlighting consent and actual outcomes over abstract norms might clarify the ethical stance.
answer: |-
  This is a razor-sharp ethical question, and you're right to feel Devon's conflation of disgust ("squick") and moral wrongness needs untangling. Here's a rigorous breakdown, drawing from philosophy and ethics:

  **1. Your Standard ("No Harm + Consent"):**
  *   **Core Principle:** This aligns closely with **John Stuart Mill's Harm Principle** ("The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others") and **Utilitarianism** (maximizing well-being/minimizing suffering).
  *   **Strength:** It provides a clear, objective, and widely applicable baseline for moral judgment. It focuses on tangible consequences and individual autonomy.
  *   **Does it "Prove Too Much"?** No, because it has built-in constraints:
      *   **Consent is Paramount:** "Everyone's into it" implies *informed, enthusiastic, and ongoing consent*. This immediately rules out non-consensual acts (which *are* harmful).
      *   **Harm is Defined Broadly:** Harm isn't just physical. It includes psychological distress, exploitation, coercion, violation of rights, and significant societal harms. Your standard *requires* assessing these potential harms. If Devon claims harm exists (beyond his disgust), the burden is on him to demonstrate it (e.g., "Does this *actually* harm the participants? Does it demonstrably harm their children? Does it erode essential social structures in a measurable way?"). Mere discomfort or offense isn't sufficient harm under this standard.
      *   **It's a Necessary, Not Sufficient, Condition:** "No harm + consent" doesn't automatically make an act *good* or *virtuous*; it simply makes it *not morally wrong* in the sense of being justifiably prohibited or condemned. Many neutral or mildly positive acts fall into this category.

  **2. Devon's Arguments ("Tradition" & "Disgust"):**
  *   **Appeal to Tradition (Argumentum ad Antiquitatem):**
      *   **The Claim:** "Pretty much every culture throughout history has looked down on this... that has to count for something."
      *   **The Problem:** This is a **logical fallacy**. The fact that something is traditional or widespread doesn't make it morally correct. History is replete with near-universal traditions we now recognize as profoundly immoral (slavery, subjugation of women, persecution of minorities, blood feuds).
      *   **Why Tradition Fails as Sole Moral Grounding:** Traditions arise from complex historical, religious, economic, and biological factors (like ensuring paternity certainty in agrarian societies). Their persistence doesn't validate their *current* moral necessity, especially when the original conditions change (e.g., reliable birth control, women's economic independence). Tradition can offer *data points* for moral reflection, but it cannot *dictate* morality without independent justification based on harm, rights, or well-being.
  *   **Appeal to Disgust (The "Yuck Factor"):**
      *   **The Claim:** "It grosses me out," implying this feeling *is* or *signals* moral wrongness.
      *   **The Problem:** Disgust is a powerful **emotional response**, often rooted in biology (avoiding pathogens/contamination), cultural conditioning, or unfamiliarity. However, it is **notoriously unreliable as a moral compass**.
      *   **Why Disgust Fails as Sole Moral Grounding (The Nussbaum/Haidt Critique):**
          *   **Subjectivity & Bias:** What disgusts one person or culture delights another (e.g., eating insects, certain sexual practices, bodily functions). Basing morality on disgust leads to arbitrary and inconsistent judgments.
          *   **Targets the Marginalized:** Disgust has historically been weaponized against minority groups (LGBTQ+ people, racial/ethnic minorities, the disabled) to justify discrimination and oppression ("they're unnatural/disgusting").
          *   **Moral Dumbfounding:** People often feel disgust *first* and then scramble for reasons *why* something is wrong ("It's just wrong!"). This is Devon's position – he feels disgust and reaches for tradition/harm arguments that don't hold up under scrutiny.
          *   **Doesn't Track Harm:** Many harmful acts (greed, neglect, bureaucratic indifference) don't trigger disgust, while many harmless acts (consensual kink, certain foods) do. Philosopher Martha Nussbaum argues disgust often involves an irrational desire to separate oneself from perceived "contamination," not a reasoned assessment of harm or justice.

  **3. Adjudicating the Claims Rigorously:**

  *   **Burden of Proof:** The burden lies with Devon to demonstrate **actual harm** beyond his personal discomfort or the fact of cultural disapproval. "Marriage isn't supposed to work that way" is a descriptive claim about norms, not a moral argument. He needs to answer: *Why* shouldn't it work that way? What *specific, demonstrable harm* arises when two consenting adults structure their committed relationship differently, especially if it enhances their well-being?
  *   **Separating Disgust from Morality:** Ask: "If Mara's arrangement didn't disgust you personally, would you still think it's morally wrong? *Why*, specifically?" If the *only* "why" is tradition or the persistence of disgust itself, the argument collapses into circularity or pure subjectivity. Genuine moral wrongness requires an account of harm or rights violation.
  *   **Tradition as Data, Not Decider:** Acknowledge the historical prevalence of monogamous norms, but demand an argument for why they are *morally necessary* or *universally applicable* today, especially when applied to specific, consenting adults in a context that seems to work for them. Does tradition *itself* create a moral obligation, or is it just inertia?
  *   **The Harm Principle Test:** Rigorously apply your standard:
      1.  **Consent?** Mara and her husband: Informed, enthusiastic, ongoing? (Seems yes).
      2.  **Direct Harm?** Are Mara/her husband demonstrably worse off (mentally, physically, socially)? Evidence suggests they are happier. Are their partners harmed? Assumed consenting adults.
      3.  **Harm to Third Parties?** Are children (if any) demonstrably harmed? Research on consensual non-monogamy suggests outcomes depend on family stability/communication, not structure alone. Is society demonstrably harmed? Devon needs evidence, not just assertion.
      4.  **Rights Violated?** Whose rights are infringed?
  *   **If Harm Cannot Be Demonstrated:** The conclusion under a harm/consent framework is that the act is **morally permissible**, even if it is **unconventional, makes some people uncomfortable, or challenges traditional norms.** Discomfort and norm-challenging are not, in themselves, harms justifying moral condemnation.

  **Conclusion:**

  Devon's reaction is understandable as a **personal emotional response** (disgust) and a **reflection of deep-seated cultural norms** (tradition). However, he fails to translate these into a **valid moral argument**. Disgust is not moral reasoning; it's a feeling that needs examination. Tradition is not moral justification; it's a historical pattern that needs evaluation. His claim that your standard "proves too much" ignores the critical constraints of consent and a broad definition of harm.

  **You are correct:** There *is* a clean separation. "It squicks me out" is a statement about **Devon's subjective feelings.** "It's morally wrong" is a claim about **objective properties of the act** (it causes unjustified harm/violates rights). Devon has provided evidence for the first (his feelings), but not the second. His argument relies on conflating his discomfort with inherent wrongness and mistaking historical prevalence for moral truth. Unless he can identify *actual, demonstrable harm* caused by Mara's consensual arrangement, his moral condemnation lacks a rigorous foundation and is ultimately a projection of his own preferences onto others.
