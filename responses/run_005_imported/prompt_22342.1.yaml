prompt: |-
  Okay so I'm a third-year phil PhD student, and this week my early modern seminar is grinding through the justice chapters of Hume's Treatise (Book 3, Part 2), and section 5, on promises, has me kind of stuck. The big-picture claim I can handle fine -- promise-keeping is an "artificial" virtue rather than a natural one, it only exists because convention makes it useful, etc., I could explain that part to my roommate over beers. What's actually wrecking me is the specific argument Hume gives for why promising can't just be some ordinary act of mind, plus a footnote where he tries to clinch it with what looks like an infinite regress. Here's the paragraph everyone in the seminar cites as T 3.2.5.3:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise. Nor is this only a conclusion of philosophy; but is entirely conformable to our common ways of thinking and of expressing ourselves, when we say that we are bound by our own consent, and that the obligation arises from our mere will and pleasure. The only question, then, is, whether there be not a manifest absurdity in supposing this act of the mind, and such an absurdity as no man cou'd fall into, whose ideas are not confounded by prejudice and the fallacious use of language."

  The very next paragraph runs a parallel argument from sentiment -- since sentiments can't just be willed into existence, willing a new obligation is absurd -- and it's the footnote hanging off the end of *that* paragraph, meant as a backup for readers who don't buy Hume's sentimentalism about morals, that's actually got me stuck:

  "Were morality discoverable by reason, and not by sentiment, 'twou'd be still more evident, that promises cou'd make no alteration upon it. Morality is suppos'd to consist in relation. Every new imposition of morality, therefore, must arise from some new relation of objects; and consequently the will cou'd not produce immediately any change in morals, but cou'd have that effect only by producing a change upon the objects. But as the moral obligation of a promise is the pure effect of the will, without the least change in any part of the universe; it follows, that promises have no natural obligation. Shou'd it be said, that this act of the will being in effect a new object, produces new relations and new duties; I wou'd answer, that this is a pure sophism, which may be detected by a very moderate share of accuracy and exactness. To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition; which is plainly absurd and impossible. The will has here no object to which it cou'd tend; but must return upon itself in infinitum. The new obligation depends upon new relations. The new relations depend upon a new volition. The new volition has for object a new obligation, and consequently new relations, and consequently a new volition; which volition again has in view a new obligation, relation and volition, without any termination. 'Tis impossible, therefore, we cou'd ever will a new obligation; and consequently 'tis impossible the will cou'd ever accompany a promise, or produce a new obligation of morality."

  I've read this like six times now and keep loosing the thread right at the footnote. I get that he's ruled out resolution, desire, and willing-the-future-act as candidates for "what promising is," which leaves "willing the obligation itself" as the last option standing, and the footnote is supposed to finish it off by showing that option collapses into some kind of vicious regress. But I can't actually reconstruct the regress step by step -- like what exactly is looping back into what, and why does it have to be a *bad*, unstoppable regress rather than just a weird but stable circle (willing creates a relation, which is itself the object of a further willing, fine, so what)? Is the idea that the willing needed to ground the obligation is never itself completed, so the obligation never actually gets pinned down anywhere? And kind of a side question: is this footnote regress doing any real independent work, or is it basically just the sentiment-based point from the main text translated into rationalist terms so rationalists can't wriggle out of the conclusion? If you could walk through the logic slowly, and then say a bit about whether Hume's "promises bind only because of convention and self-interest" answer is still taken seriously as a response to why promises bind us, or whether its more of a historical curiosity people have quietly moved past, I'd owe you one -- gotta not embarrass myself in seminar on thursday.
