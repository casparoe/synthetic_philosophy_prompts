  Crucially, I need to address their implied question about "accurate language vs manufactured self-concept" without falling into the trap of saying one excludes the other. The beauty of Hacking's view is that these aren't mutually exclusive - the language creates new ways of being ADHD while also revealing pre-existing traits. 

