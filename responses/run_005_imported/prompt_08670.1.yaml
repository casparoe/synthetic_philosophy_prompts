answer: |-
  Here’s a focused, nuanced set of interview questions for your decision scientist guest, designed to push beyond textbook explanations while hitting your requested angles. Each includes strategic follow-ups based on likely answers:

  ### Core Questions:
  1. **The "Locally Rational" Trap**  
     *"When bidders keep escalating after becoming the second-highest bidder, they often justify it as ‘cutting losses’ or ‘just $1 more.’ Is this actually locally rational decision-making in the moment? Or is it a cognitive illusion masking bias?"*  
     *→ Likely Follow-up:* If she says "rational": *"Doesn’t this ignore the predictable behavior of the other bidder? If both are ‘locally rational,’ why does the system inevitably collapse?"*  
     If she says "bias": *"Could framing losses as ‘investment recovery’ rather than ‘sunk costs’ make this *feel* rational even when it’s destructive?"*

  2. **Competitor-Free Escalation (Concorde Paradox)**  
     *"You study escalation in auctions with reactive opponents. But projects like the Concorde or Boston’s Big Dig faced massive cost overruns without real-time bidding. Is it fair to lump these ‘solo’ commitments under the same ‘escalation’ umbrella as the dollar auction?"*  
     *→ Likely Follow-up:* If she distinguishes them: *"What’s the core psychological mechanism that *is* shared between competitive auctions and solo project failures?"*  
     If she groups them: *"Doesn’t the absence of an opponent in cases like Concorde remove the reactive tension that defines auction-style traps?"*

  3. **Schelling’s "Rational Irrationality"**  
     *"Thomas Schelling advised *deliberately* escalating commitment (e.g., burning bridges) to force resolution. Is this the exact same cognitive mechanism as the ‘irrational’ escalation in dollar auctions—just weaponized strategically?"*  
     *→ Likely Follow-up:* If she says "same mechanism": *"Does that imply ‘irrational’ escalation is just Schelling-style tactics *without* conscious intent?"*  
     If she says "different": *"Where does the brain diverge between Schelling’s calculated sacrifice and the dollar auction bidder’s panic?"*

  ### Deepening the Frame:
  4. **The Point of No Return**  
     *"Is there a predictable threshold—psychologically or mathematically—where escalation flips from ‘persistence’ to ‘trap’? Or is it only visible in hindsight?"*  
     *→ Follow-up:* *"Can we train people to spot this inflection point in real-time?"*

  5. **Identity & Escalation**  
     *"Beyond financial loss, how does identity (‘I’m not a quitter,’ ‘I’m a savvy investor’) fuel escalation differently in auctions vs. solo projects?"*

  6. **Prevention vs. Cure**  
     *"Your work shows people rarely de-escalate once trapped. Should interventions focus entirely on *preventing* entry into dollar-auction dynamics? If so, how?"*

  7. **The "Winner’s" Curse**  
     *"Winners in dollar auctions often report regret. Is ‘winning’ in escalation scenarios inherently pyrrhic? Or are there contexts where pushing past limits *is* justified?"*

  8. **Reframing the Phenomenon**  
     *"If ‘dollar auction escalation’ is too narrow a label, what broader term captures this family of commitment failures across finance, projects, and relationships?"*

  ### Structure Tips:
  - **Open** with Q1 (rationality debate) to hook theorists and laypeople.  
  - **Place Q2 & Q3** mid-interview when the guest is warmed up—they require nuanced distinctions.  
  - **Close** with Q8 (reframing) for a forward-looking takeaway.  
  - **Use your house bid** in the intro as a relatable anchor, but pivot quickly to science.  

  These questions force fresh analysis by challenging definitions (Q2), exposing mechanistic overlaps (Q3), and probing rationality’s limits (Q1)—exactly what your audience wants from a decision science pod. Good luck! 🎙️
