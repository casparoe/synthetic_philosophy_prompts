  2. **Resolute choice**: The agent commits to a plan at the beginning and sticks to it, even if at a later node the local preference would suggest deviating. This avoids the pump by pre-committing to a path that does not lead to a net loss. However, it requires the agent to follow through on a plan even when, at a later point, the agent prefers to deviate. This might be seen as irrational at the point of deviation because the agent is acting against their current preferences. But if the commitment is rational, then it can avoid the pump.

  3. **Wide framing**: The agent evaluates the entire sequence of trades as one package. If the agent prefers the starting point to the entire sequence (which leads to a net loss), they would reject the sequence. This reframes the decision so that the cyclic preferences are not activated step by step. This is a robust defense because it evaluates the whole plan and avoids the piecemeal exploitation.

  4. **Tie-breaking/status quo rule**: This applies when there is indifference or parity. The agent defaults to the status quo unless there is a strict improvement. In the context of a money pump, if the agent is indifferent between two options (or they are on a par), the agent does not trade. This can break the cycle by preventing trades that are only marginally attractive and might lead to a pump. However, it is specifically designed for cases of indifference or parity, so it may not help in strict cycles (where preferences are strict). Also, if the cycle is strict (A>B, B>C, C>A), then this rule might not apply because there are no ties.

