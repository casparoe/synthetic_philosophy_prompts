  Working on a chapter of my diss about early objections to the Turing test and re-reading "Computing Machinery and Intelligence" this week. There's that section where Turing spends real space on ESP as an objection to the imitation game, and I always just assumed that bit was basically a joke -- like he picked the single most embarrassing possible objection (telepathy??) on purpose, just to show his framework could survive even that, kind of a wink at how silly parapsychology was to a rigorous mathematician. But my advisor swears he meant it totally straight, said the statistical evidence for telepathy was "overwhelming," and even redesigned the test (some "telepathy-proof room" thing) to deal with it. That doesn't sound like a bit to me anymore tbh. Am I wrong that it's tongue-in-cheek, and if he really was sincere about it, doesn't that kind of tank how seriously we should take the rest of his reasoning in that paper?
