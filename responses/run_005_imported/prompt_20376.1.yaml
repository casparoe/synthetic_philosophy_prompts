prompt: |-
  Hey, I'm taping an episode of my (very niche) formal epistemology podcast next week, and the guest is an economist who's built her career defending the common prior assumption as an actual rationality requirement, not just a modeling convenience. Her go-to move whenever someone brings up real, persistent disagreement between smart, well-informed people is to say it just shows the type space was mis-specified -- give her the full information partition and the disagreement evaporates -- which makes the whole thing feel a bit unfalsifiable. Can you draft me 8-10 questions that push on that move specifically: at least one using Aumann's agreement theorem to ask whether it's really the common prior or the common knowledge of posteriors doing the work, one on where a "common" prior is even supposed to come from if not shared evidence, one on how she squares the view with no-trade theorems given how much speculative trading actually happens in real markets, and one on whether Aumann's result secretly needs common knowledge *that* the prior is common, not just an actual shared prior -- basically a higher-order version of the same worry. End on a question about what finding would even count as evidence against the assumption, and for each one give me a quick follow-up keyed to whatever dodge shes most likely to reach for.
reasoning: |-
  Okay, the user is hosting a formal epistemology podcast and needs help crafting questions for an economist guest who strongly defends the Common Prior Assumption (CPA). The guest dismisses persistent disagreements as mis-specified type spaces, making her position seem unfalsifiable. 

  Hmm, the user clearly wants to challenge this rigorously but charitably. They've specified four precise angles: Aumann's theorem mechanics, origin of common priors, no-trade theorems vs real markets, and higher-order knowledge requirements. Plus, they want a falsifiability question to close. Smart framing.

  First, I should map why CPA defenses feel slippery. When the guest says "mis-specified type spaces," she's invoking the mathematical guarantee that under CPA + common knowledge of posteriors, agreement is inevitable. But in reality, we never observe the full information partitions she appeals to. That's the friction point. 

  For the Aumann question (#1), I need to highlight how the theorem relies equally on common knowledge of posteriors. If she retreats to "partitions fix it," the follow-up should press why real-world partitions are never common knowledge. The key is exposing the gap between the model's assumptions and messy human epistemology.

  The prior origin question (#2) targets a deeper philosophical tension. If priors come from shared evidence but agents have different life experiences, how can priors be common? Her likely "objective Bayesianism" dodge needs immediate pushback on what "objectivity" means without unique evidence streams.

  No-trade theorems (#3) are perfect because they make CPA testable. Markets constantly trade on disagreements, contradicting the theory. If she blames transactions costs, the follow-up must demand specific thresholds where CPA should "kick in" – her silence here would be telling.

  Higher-order knowledge (#4) is subtle but deadly. Aumann requires common knowledge of the prior itself, not just its existence. If she claims common priors imply knowledge of them, the follow-up can cite unawareness or framing effects to show why that fails.

  Closing with falsifiability (#5) forces her to name CPA's breaking point. Whatever she offers ("Oh, identical twins disagreeing?"), the follow-up should dissect why that wouldn't already be dismissed as partition mis-specification. The goal is making the unfalsifiability explicit.

  User's niche podcast audience will appreciate technical rigor, so questions must be precise but not jargon-heavy. Tone should be collegial yet relentless – like a seminar Q&A where the professor is sweating slightly. I'll avoid "gotchas" but leave no escape hatches unplugged.
answer: |-
  Here are 8 targeted questions pushing on the "mis-specified type space" defense of the Common Prior Assumption (CPA), including your requested angles and likely dodges/follow-ups:

  1.  **Aumann's Mechanism:** "Aumann's theorem shows that common knowledge of posteriors *plus* a common prior forces agreement. When you invoke mis-specified type spaces to explain persistent disagreement, isn't it often the *lack* of common knowledge of posteriors (due to differing information structures) doing the real explanatory work, rather than the *absence* of a common prior? Could persistent disagreement simply highlight the practical impossibility of achieving common knowledge, not CPA failure?"
      *   *Likely Dodge:* "The type space *defines* the information structure; specifying it correctly *ensures* common knowledge of posteriors under CPA."
      *   *Follow-up:* "But doesn't that reduce the CPA's empirical content? If *any* observed disagreement *must* imply an incorrect type space by fiat, how is the CPA different from an unfalsifiable tautology about an idealized, inaccessible state space?"

  2.  **Origin of the Common Prior:** "If agents don't start with literally identical evidence streams (which they demonstrably don't), where does this 'common prior' actually come from? Isn't the standard justification that it arises from shared objective evidence? But if priors are *formed* from different evidence, how can they be truly common *before* the type space specification? Doesn't assuming a CPA *presuppose* the type space already perfectly encodes all possible evidence distinctions?"
      *   *Likely Dodge:* "The CPA represents a shared rational starting point *before* any private information; it's a normative requirement of rationality applied to the same fundamental possibilities."
      *   *Follow-up:* "How can rationality dictate a *unique* prior over a vast state space without *some* initial shared evidence to anchor it? Doesn't this risk conflating rationality with homogeneity? If two hyper-rational agents with genuinely different life experiences form different priors over complex propositions, are they *both* irrational?"

  3.  **No-Trade Theorems vs. Market Reality:** "No-trade theorems show that under CPA and common knowledge of rationality, speculative trade is irrational. Yet vast amounts of speculative trading occur daily in highly liquid markets with sophisticated, well-informed participants. If persistent disagreement is *always* just a type space mis-specification, shouldn't these markets exhibit near-zero speculative volume? Doesn't the sheer scale of real-world trading directly challenge the descriptive validity of the CPA?"
      *   *Likely Dodge:* "Transactions costs, liquidity needs, differences in risk aversion, or non-common knowledge of rationality explain trading, not fundamental disagreement under CPA."
      *   *Follow-up:* "While those factors exist, do you believe they fully explain the *magnitude* and *persistence* of speculative trading observed? If the CPA holds and type spaces were correctly specified, shouldn't speculative opportunities be fleeting and negligible *even after accounting* for those frictions? Isn't persistent, high-volume speculation *prima facie* evidence that deep disagreement exists?"

  4.  **Higher-Order Knowledge Requirement:** "Aumann's result requires common knowledge *of* the posteriors to force agreement. Doesn't it *also* implicitly require common knowledge *that* the prior *is* common? If agents rationally doubt whether the *other* agent shares the same prior (even if they actually do), couldn't this higher-order uncertainty alone sustain rational disagreement, even with a correctly specified type space and common knowledge of posteriors?"
      *   *Likely Dodge:* "The CPA *includes* the assumption that the commonality of the prior is common knowledge; it's part of the model setup."
      *   *Follow-up:* "But isn't *that* the crux of the empirical problem? In the real world, how could agents ever attain common knowledge *that* their priors are common, especially when facing persistent disagreement? Doesn't assuming this higher-order common knowledge make the CPA framework even *more* detached from observable human reasoning?"

  5.  **The Burden of Specification:** "You argue persistent disagreement *proves* the type space was mis-specified. Couldn't this be seen as placing an impossible burden of proof on critics? The 'correct' type space seems infinitely refinable. What concrete, positive guidance does your view offer for *how* to correctly specify the type space in complex real-world scenarios to *make* disagreement evaporate? Isn't the claim unfalsifiable if any disagreement can be retrofitted to an 'unseen' partition?"
      *   *Likely Dodge:* "Modelers should strive for more granular state spaces capturing all relevant distinctions agents *could* be making."
      *   *Follow-up:* "But isn't 'all relevant distinctions' impossibly vague? How do we know when we've reached sufficiency? If agents *still* disagree after our 'best' specification, doesn't that suggest the CPA might be failing, rather than just needing another layer of refinement?"

  6.  **Rationality vs. Homogeneity:** "Does defending the CPA as a strict rationality requirement conflate rationality with homogeneity? Couldn't two perfectly rational agents, processing identical *public* evidence but drawing on legitimately different background experiences or interpretive frameworks (encoded in their priors), arrive at different yet rational posterior beliefs, even with a perfectly specified type space?"
      *   *Likely Dodge:* "Rationality, applied correctly to the same evidence and possibilities, dictates a unique prior. Different priors imply irrationality or incomplete modeling."
      *   *Follow-up:* "What justifies this claim of uniqueness? In complex domains with ambiguous evidence and underdetermined theories (e.g., macroeconomics, climate impacts), isn't a *range* of rational priors more plausible than a single point? Isn't demanding a unique prior an unrealistic demand for logical omniscience?"

  7.  **Learning and Convergence:** "If the CPA holds and type spaces are correctly specified, shouldn't we expect beliefs to converge rapidly under public information? Yet we observe persistent expert disagreement on well-studied issues (e.g., long-term economic effects of policies, existential risks). If decades of public debate and evidence sharing don't produce agreement, doesn't this suggest either the CPA fails or the 'correct' type space is pragmatically inaccessible/unlearnable?"
      *   *Likely Dodge:* "New evidence arrives, interpretations differ, or the public information isn't truly common knowledge due to differing processing."
      *   *Follow-up:* "But doesn't this again push the problem into the type space? If 'interpretations differ,' doesn't that *require* the state space to distinguish between interpretive frameworks? And if after decades we *still* can't specify a type space where agreement emerges under public info, doesn't that undermine the CPA's relevance?"

  8.  **The Falsifiability Question:** "Ultimately, what specific empirical finding *could* count as evidence *against* the Common Prior Assumption as a universal rationality requirement? If *no* conceivable instance of persistent disagreement between apparently rational, well-informed agents is allowed to falsify it – because it can always be attributed to type space mis-specification – doesn't that render the claim non-empirical?"
      *   *Likely Dodge:* "Evidence showing agents systematically violate basic Bayesian updating *even when* information structures are clearly defined and common knowledge would falsify rationality. But disagreement alone doesn't."
      *   *Follow-up:* "Let's grant they update 'correctly' within their *own* perceived type space. If we observe systematic, persistent disagreement between such agents across many domains *even after exhaustive efforts* to align information partitions and public disclosures, wouldn't the simpler explanation be that their *fundamental priors* (shaped by divergent experiences) genuinely differ, challenging the universality of the CPA?"

  **Key Principles Used:**
  *   **Target the Dodge:** Each follow-up anticipates the most likely retreat ("better specification," "rationality requires uniqueness," "frictions," "higher-order is assumed") and pushes directly on the weakness of that retreat.
  *   **Highlight Unfalsifiability:** Repeatedly connects the "mis-specification" move to the risk of making CPA empirically vacuous.
  *   **Contrast Model vs. Reality:** Uses concrete examples (markets, expert debate) to highlight the gap between CPA predictions and observed phenomena.
  *   **Challenge "Rationality":** Questions the conflation of rationality with prior homogeneity and the assumption of a unique rational prior.
  *   **Demand Positive Guidance:** Asks what a *correctly* specified type space looks like in practice.
  *   **Force the Issue (Q8):** Directly challenges the core falsifiability of the position.

  Good luck with the interview! These should make for a stimulating discussion.
