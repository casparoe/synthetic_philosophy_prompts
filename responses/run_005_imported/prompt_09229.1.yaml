  Another point is the role of the principle of charity. In science, theories aim for truth, but translation relies on attributing beliefs and rationality to speakers. Different translation manuals might attribute different beliefs, all consistent with behavior. That leads to inscrutability of reference—like "gavagai" referring to rabbits vs. rabbit parts. The user might not see this as different from scientific underdetermination, but the issue here is that there's no independent access to the speaker's meanings to verify.

  Also, Quine's naturalism plays a role. He treats linguistics as part of empirical science, so if translation is indeterminate, it challenges the idea of meanings as objective entities. This ties into his rejection of the analytic/synthetic distinction. The physicist might accept underdetermination but still hold that meanings exist. Quine is arguing they don't, which is a more radical stance.

  The user's deeper need might be to reconcile their scientific realism with Quine's anti-realism about meaning. They might be unsettled by the implications for truth and reference. They could also be looking for why philosophers treat linguistic indeterminacy differently than scientific underdetermination, seeking a bridge between their physics background and philosophical concepts.

