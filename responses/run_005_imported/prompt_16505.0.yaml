  We are writing a dialogue set in the question period after a colloquium talk. The anti-realist (let's call her Dr. A) has just presented a defense of Tennant's restriction on the knowability principle. The realist (Dr. R) objects. The dialogue should be substantive, with each side engaging the other's moves. The anti-realist must offer a non-circular rationale for the restriction.

  Key points:
  - The knowability principle (KP) says: if p is true then it is possible to know that p (i.e., ◊Kp).
  - Fitch's paradox: If KP holds and there is at least one unknown truth (i.e., ∃p such that p ∧ ¬Kp), then it follows that every truth is known (i.e., ∀p, p → Kp). This is absurd because we are not omniscient.
  - Tennant's solution: Restrict KP to "Cartesian" propositions. A proposition p is Cartesian if and only if knowing p does not entail a contradiction. In particular, the proposition "p ∧ ¬Kp" is not Cartesian because if you were to know it, then you would know p (so Kp) and also know that ¬Kp (so ¬Kp), which is a contradiction. Hence, such propositions are excluded.

  The realist objection: Tennant's restriction saves the letter of KP by abandoning its spirit because it carves out an exception for every proposition that causes trouble, leaving no principled thesis.

  The anti-realist must give a substantive, non-circular rationale for the restriction.

  Dialogue:

  Dr. R (Realist): Thank you for the talk, Dr. A. I appreciate your defense of Tennant's restriction, but I remain unconvinced. It seems to me that by restricting the knowability principle only to Cartesian propositions, you're effectively admitting that the original principle is false. And the restriction feels ad hoc: it's designed solely to avoid Fitch's paradox. But then, what's left of the anti-realist idea that truth is tied to our capacity to know it? If we have to exclude every proposition that causes trouble, we're not really defending a general link between truth and knowability.

  Dr. A (Anti-realist): That's a fair concern, but let me try to address it. First, the restriction isn't ad hoc in the sense of being merely tailored to avoid the paradox. Rather, it reflects a deep feature of knowledge: that knowledge requires consistency. Specifically, the act of knowing a proposition must not lead to a contradiction. So, the restriction to Cartesian propositions is grounded in the nature of knowledge itself. It's not just about avoiding Fitch; it's about respecting the logical constraints on knowledge.

  Dr. R: But isn't that circular? You're saying we should restrict knowability to propositions that can be known without contradiction. But that's exactly what the knowability principle is about: what can be known. So you're using the concept of knowability to restrict knowability.

  Dr. A: Not exactly. Let me put it this way: The knowability principle, as originally formulated, is meant to capture the idea that truth is not evidence-transcendent. But even for the anti-realist, there are logical limits to what can be known. In particular, we cannot know a proposition that is self-defeating. Consider the proposition "No one knows anything." If that were true, then no one would know it, but if someone did come to know it, then it would be false. So it's not just that we don't know it; it's that it cannot be known without being falsified. Similarly, "p and no one knows p" cannot be known because if you were to know it, you would know p and hence p would be known, contradicting the second conjunct. So, the restriction to Cartesian propositions is based on the idea that knowledge must be consistent. And that is a general constraint on knowledge, independent of the knowability principle.

  Dr. R: I see. But then, how do you explain that we can still have truths that are unknown? Your restriction seems to allow for that, but only by excluding the very propositions that would express that fact. So, if I say, "There is an unknown truth," that proposition, call it Q, is not Cartesian because if someone were to know Q, then they would know that there is an unknown truth. But then, by knowing Q, they would make at least one truth known (namely, Q itself) and so the unknown truth they thought existed might now be known? Actually, wait: knowing Q doesn't necessarily make every unknown truth known. It might be that there is another unknown truth. So maybe Q is Cartesian?

  Dr. A: Actually, let's be precise. The proposition Q is "There exists a proposition p such that p is true and not known." Now, if someone were to know Q, then they would know that there is at least one unknown truth. But note that knowing Q does not tell us which truth is unknown. So, it is possible that Q is known and yet there remains some other proposition q that is true and unknown. Therefore, Q does not lead to a contradiction when assumed to be known. So Q is Cartesian. Hence, according to Tennant's restriction, Q must be knowable. That is, it must be possible to know that there is an unknown truth. And that seems plausible: we might come to know, for instance, that there is a truth that no one has yet discovered in some remote part of science.

  Dr. R: But then, what about the proposition "p and no one knows p" for a particular p? That one is not Cartesian, as you said. But if we can know Q (that there is an unknown truth) but we cannot know, for any particular p, that "p and no one knows p", doesn't that seem odd? How can we know that there is an unknown truth without being able to point to any particular one?

  Dr. A: It's a bit like in mathematics: we can know that there is an even prime number without knowing that it is 2 (if we haven't discovered it yet). But more to the point: the knowability principle, as restricted, says that if p is true and Cartesian, then it is knowable. Now, the proposition Q is Cartesian and true (assuming there is at least one unknown truth), so it must be knowable. But for a particular p that is unknown, the proposition "p and no one knows p" is not Cartesian and hence not covered by the principle. But note: we don't need to know that specific conjunction to know that there is an unknown truth. We might know Q by knowing that, say, there is a truth about the exact number of grains of sand on a beach that no one has ever counted. We don't have to know the exact number to know that there is such a truth and that it is unknown.

  Dr. R: But then, what about the original motivation for anti-realism? The anti-realist wants to say that truth is tied to our epistemic capacities. But by allowing that there are truths that are in principle unknowable (like the non-Cartesian ones), haven't you given up on that? For example, consider the proposition: "There is a truth that is forever unknown." That proposition, if true, would seem to be a truth that is not knowable because if you knew it, then it would be false. So it's not Cartesian. And if it is true, then it is an example of a truth that is unknowable. But then, the anti-realist must say that it is not true? But that seems to conflict with the possibility of there being forever unknown truths.

  Dr. A: Actually, the anti-realist can say that the proposition "There is a truth that is forever unknown" is not true. Because if it were true, then there would be a truth that is forever unknown, but then that very proposition would be a truth that is forever unknown? Not necessarily: the proposition itself might be known at some point? Wait, if it is known at some point, then it would be false because it says there is a truth that is forever unknown, but if it is known then it is not forever unknown? This is getting messy.

  Alternatively, let me rephrase. The anti-realist, following Tennant, can hold that the proposition "There is a truth that is forever unknown" is not Cartesian and hence not subject to the knowability principle. But that doesn't mean it is true. In fact, the anti-realist might argue that we have no reason to believe it is true. The anti-realist can maintain that for any particular truth, it is knowable (if it is Cartesian). And the general proposition that there is a forever unknown truth is not something we can ever have evidence for. So the anti-realist doesn't have to accept that there are forever unknown truths. In fact, they can deny it.

  Dr. R: But then, what about the modest assumption in Fitch's paradox? We started by assuming that there is at least one unknown truth. If the anti-realist denies that there is any forever unknown truth, then what about truths that are currently unknown? The knowability principle (restricted) says that if they are Cartesian, they are knowable. But if they are knowable, then they might become known in the future. So the anti-realist can hold that every truth is knowable and hence that there are no forever unknown truths. But that doesn't mean that every truth is known now. So the modest assumption (that there is at least one unknown truth) is true now, but it might not be true in the future.

  Dr. A: Exactly. And note that the proposition "p is true and not known now" for a particular p might be Cartesian. For example, if I say, "It is raining in Tokyo right now and no one knows it," that proposition could be known by me if I were in Tokyo and checking. But if I come to know it, then at that moment it is raining and I know it, so the second conjunct becomes false. But wait: the proposition is about a specific time. So if I know it at a later time, then at the time I know it, the second conjunct (which says that at time t no one knows it) might be true if I am knowing it at a time after t. So it can be known without contradiction? Actually, no: if the proposition is "It is raining in Tokyo at time t and no one knows at time t that it is raining in Tokyo", then if I come to know this proposition at time t+1, I know that at time t it was raining and unknown. That doesn't contradict the proposition because the proposition is about time t and my knowledge is at t+1. So it is Cartesian.

  But then, what about a proposition that says "p and p is never known"? That one is not Cartesian because if I were to know it, then p would be known at the time I know it, so it would be false. So the anti-realist can say that such a proposition is not true because it is self-defeating: it cannot be known and hence, by the anti-realist's lights, it cannot be true. The anti-realist ties truth to knowability, but only for Cartesian propositions. So if a proposition is not Cartesian and cannot be known, then it cannot be true.

  Dr. R: So you're saying that non-Cartesian propositions that are unknowable are false? Then, in particular, the proposition "There is a forever unknown truth" would be false. But then, that would imply that every truth is known at some time? That sounds like the omniscience conclusion again.

  Dr. A: Not exactly. It implies that every truth is known at some time? Not necessarily. It might be that every truth is knowable, but not necessarily actually known. Wait, no: if the proposition "There is a forever unknown truth" is false, then it is not the case that there is a truth that is forever unknown. That means that for every truth, it is not the case that it is forever unknown. In other words, every truth is known at some time. So yes, it does entail that every truth is known at some time. But note: that is not the same as saying that every truth is known now. It's a form of potential omniscience: every truth will be known at some point in time.

  Dr. R: But that still seems too strong. What about a trivial truth that no one ever bothers to consider? For example, the exact number of blades of grass in my lawn at this moment. It's a truth, but it's lost to history. No one will ever know it. So it is a forever unknown truth.

  Dr. A: The anti-realist might respond that such a proposition is not a truth at all. If there is no way to verify it, even in principle, then it isn't true. But note: the anti-realist doesn't have to go that far. They can say that it is knowable in principle. We could have counted the blades of grass at that time. So it is knowable. And if it is knowable, then it is true. And since it is knowable (in principle, at the time), then it is not forever unknown because it could have been known at that time. But then, if it was not known at that time, and if it is no longer knowable (because the grass has changed), then it would be a counterexample.

  Dr. R: Exactly.

  Dr. A: Well, then the anti-realist might say that if a proposition was knowable at the time it was true, then it is still true now. And the fact that it is no longer knowable now doesn't matter because the knowability principle says that if it is true then it must have been knowable at the time. So the proposition "The number of blades of grass at time t was n" is true and was knowable at time t. That's enough. It doesn't have to be knowable now.

  Dr. R: But then, what about the proposition: "The number of blades of grass at time t was n, and that fact was never known." Is that Cartesian? If I come to know it now, then I know that the number was n and that it was never known. But by knowing it now, I know it at a time after t, so I don't make it known at time t. So it might be that at time t, it was unknown, and even now, if I know it, I know it at a later time. So the proposition can be known without contradiction. So it is Cartesian. Then the knowability principle would require that it is knowable. But if it is true, then it is knowable. But if we come to know it, then the second conjunct becomes false? No, because the second conjunct says that it was never known. But if I know it now, then it is known now, but that doesn't change the fact that it was not known at time t or at any time before now. So the second conjunct remains true? Wait, the proposition says "and that fact was never known" — meaning never known at any time. But if I know it now, then it is known at this time, so the second conjunct is false. So if I know the proposition, then the second conjunct must be false. Therefore, the proposition is not Cartesian because if it were known, then it would be false. So it is not Cartesian.

  Therefore, the knowability principle does not apply to it. So the anti-realist doesn't have to say that such a proposition is knowable. And if it is true, then it is an example of a truth that is unknowable. But then, the anti-realist must say that it is not true? Or they can say that it is true but unknowable? But that would violate the spirit of anti-realism.

  Dr. A: The anti-realist can say that the second conjunct (that it was never known) is not true. Because if the first conjunct is true (the number was n), then it was knowable at time t. And if it was knowable, then it might have been known. But it wasn't known? Then the proposition "The number of blades of grass at time t was n and it was never known" might be true. But then, the anti-realist must hold that it is not knowable? But they can say that it is not Cartesian and hence not required to be knowable. And they can still maintain that the first conjunct is true and was knowable. The second conjunct is also true, but it is not Cartesian and hence not knowable. And that's acceptable because the anti-realist thesis is only that Cartesian truths are knowable.

  Dr. R: But then, the anti-realist is admitting that there are truths that are unknowable. And that seems to give up the core idea that truth is tied to knowability.

  Dr. A: It's a retreat, but a principled one. The core idea is that truth is tied to knowability for propositions that are not self-defeating. The self-defeating ones are a special case. They are true (if they are) but not knowable. But note that they are built out of components that are knowable. The anti-realist can say that the truth of the whole is grounded in the knowability of the parts. For example, in "p and p is never known", the p part is knowable (if it is true and Cartesian) and the "p is never known" part is also a truth (if p is never known) but not Cartesian. So the truth of the conjunction is a byproduct of the knowability of p and the truth of the second conjunct, which is not knowable. But that doesn't mean that truth in general transcends knowability. It just means that some complex truths, which are self-referential in a problematic way, are not knowable. But they are rare and parasitic on knowable truths.

  Dr. R: I'm still worried that this is too much of a concession. But perhaps it's the best the anti-realist can do. Thank you for the discussion.

  Dr. A: Thank you for your questions. It's a complex issue and I appreciate the engagement.

  This dialogue covers the main points and provides a non-circular rationale for the restriction: the requirement that knowledge must be consistent. The anti-realist argues that the restriction is based on the logical nature of knowledge, not just to avoid the paradox. The realist presses on the implications for the anti-realist program, and the anti-realist clarifies that the restriction allows for unknown truths (as long as they are Cartesian) and that non-Cartesian truths are a special class that do not undermine the general link between truth and knowability for the rest.
