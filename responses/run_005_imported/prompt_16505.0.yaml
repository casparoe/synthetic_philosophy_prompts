  ### Dialogue: Question Period After a Colloquium Talk on Tennant’s Response to Fitch’s Paradox

  **Setting:**  
  A university lecture hall. Dr. Aris Thorne (Anti-Realist) has just given a talk defending Neil Tennant’s restriction of the knowability principle to “Cartesian” propositions. Dr. Rhea Vance (Realist) is the first questioner. The audience is attentive, with a mix of philosophers and graduate students.

  ---

  **Dr. Rhea Vance (Realist):** Thank you, Dr. Thorne, for a stimulating talk. You’ve argued that Tennant’s restriction—limiting the knowability principle to Cartesian propositions, which aren’t falsified by being known—saves anti-realism from Fitch’s paradox. But I worry this “solution” preserves the letter of the knowability principle only by gutting its spirit. The principle was meant to capture a deep connection between truth and human epistemic capacity. By carving out exceptions for every troublesome proposition like “p and no one knows p,” you’re left with no principled thesis. It feels ad hoc: you’re just defining away counterexamples. Why should we accept this restriction as anything more than a desperate maneuver?

  **Dr. Aris Thorne (Anti-Realist):** A sharp objection, Dr. Vance, and I appreciate it. Let me clarify: Tennant’s restriction isn’t ad hoc because it doesn’t merely target Fitch-style propositions. Instead, it flows from a *logical constraint on knowledge itself*—one that’s independent of anti-realism. Knowledge, by its nature, must be *consistent*. If knowing a proposition \(p\) entails a contradiction, then \(p\) cannot be known. This isn’t a point about anti-realism; it’s a point about the structure of knowledge. For example, “This sentence is false” is unknowable not because of anti-realist scruples, but because it’s self-referential and inconsistent. Similarly, “p and no one knows p” is unknowable because knowing it forces a contradiction: you’d simultaneously know \(p\) and know that no one knows \(p\), which is impossible. The restriction to Cartesian propositions—those where \(Kp \not\vdash \bot\)—simply respects this logical boundary. It’s not an exception; it’s a clarification of what “knowable” coherently means.

  **Dr. Vance:** I see the appeal, but I’m not convinced. First, this “logical constraint” seems circular. You’re using the concept of knowledge to restrict knowability, but the knowability principle is supposed to tell us what knowledge *can* achieve. Second, even if we grant this, your approach still abandons the anti-realist spirit. Truth is supposed to be tied to our *verification capacities*. But now you’re admitting there are truths—like “p and no one knows p,” if true—that are *unknowable* in principle. That’s a concession to realism! If anti-realism can’t handle all truths, why tie truth to knowability at all?

  **Dr. Thorne:** Let’s tackle the circularity charge first. The constraint isn’t circular because it’s grounded in a *pre-epistemic* logical fact: knowledge requires non-contradiction. Consider Moorean sentences like “It’s raining, but I don’t believe it.” We don’t need the knowability principle to see why this can’t be known; it’s a performative inconsistency. If I assert it, I’m believing it, which falsifies it. This is about the *grammar* of assertion and belief, not about knowability per se. Tennant’s restriction generalizes this: Cartesian propositions are those without this performative flaw. It’s no more circular than saying “You can’t square a circle” because of geometric constraints.  
  As for abandoning anti-realism’s spirit, I disagree. Anti-realism ties truth to *idealized* verification, not to what we can actually know. The knowability principle says truths *could* be known under some conditions. But for non-Cartesian propositions, there *are no such conditions*—not because of our limitations, but because they’re logically defective. Crucially, this doesn’t make truth evidence-transcendent. Take your example, “p and no one knows p.” If true, its first conjunct \(p\) *is* knowable (assuming \(p\) is Cartesian). Its unknowability arises only from the second conjunct’s self-defeating structure. So truth remains anchored to knowability for the *core* components—the restriction doesn’t create a “class” of unknowable truths but filters out incoherent combinations.

  **Dr. Vance:** That last point intrigues me, but I’m skeptical. Suppose \(p\) is a mundane truth, like “There are exactly 217 marbles in that jar.” If no one ever counts them, then “\(p\) and no one knows \(p\)” seems true. Yet you call it “incoherent” and exclude it. But this looks like evasion. Worse, your defense implies that *any* proposition generating a Fitch contradiction gets excluded—so the knowability principle only applies where it’s trivially safe. Where’s the *general* link between truth and knowability?

  **Dr. Thorne:** Two responses. First, the proposition “\(p\) and no one knows \(p\)” isn’t just “excluded”; it’s *impossible to know* for logical reasons, so it doesn’t threaten the knowability principle’s core. The principle states that *truths* are knowable—but if knowing a truth is impossible, it’s not a failure of anti-realism; it’s a failure of the proposition to be a proper candidate for knowledge. Second, the link isn’t trivial because Cartesian propositions cover almost all of what we care about: empirical claims, mathematical truths, ethical statements—all can be known without contradiction. Only pathological, self-referential cases are excluded. Crucially, I have a non-circular rationale: **knowledge must be stable under reflection**. If knowing \(p\) immediately falsifies \(p\), then \(p\) fails a basic test for rational belief. We demand that knowledge doesn’t “unravel” when we acquire it—a constraint from the philosophy of language, not anti-realism. For instance, Robert Stalnaker’s work on assertion shows that informative propositions must be compatible with their own acceptance. Tennant’s restriction enforces this stability.

  **Dr. Vance:** But doesn’t this undermine the anti-realist project? You say truth is tied to knowability, yet admit unknowable truths exist. That sounds like realism wearing a disguise.

  **Dr. Thorne:** Not at all. Anti-realism holds that truth *reduces* to ideal verifiability. For non-Cartesian propositions, verifiability fails for logical, not epistemic, reasons—so they aren’t “truths” in the same sense. Think of them as defective: their truth-value depends on components that *are* verifiable (e.g., \(p\) in “\(p \land \neg Kp\)”), but their form makes them “unclaimable.” This isn’t realism; it’s a refined verificationism that respects logic. And it’s principled: we exclude propositions where knowledge is logically impossible for the same reason we exclude division by zero in arithmetic—not arbitrarily, but to preserve coherence.

  **Dr. Vance:** I’ll need to reflect on this, but I’m still uneasy. It feels like you’ve replaced a bold thesis with a tamer one that avoids paradox by being less interesting.

  **Dr. Thorne:** Fair—but if the bolder thesis leads to absurdity, shouldn’t we refine it? Tennant’s restriction isn’t a retreat; it’s a precision tool. It saves anti-realism by showing how truth and knowability align where rationality allows. I’d argue that’s a deeper insight than the original principle.

  **Moderator:** Thank you both. We’ll move to the next question.

  ---

  **Key Points Engaged:**  
  - **Realist objection**: The restriction is ad hoc, carving out exceptions to avoid Fitch, and abandons anti-realism’s core by allowing unknowable truths.  
  - **Anti-realist defense**: The restriction is based on a logical constraint (knowledge requires consistency), illustrated with Moorean paradoxes. It’s non-circular because it draws from philosophy of language (performative inconsistency, stability under reflection). Unknowable “truths” are defective, not evidence-transcendent.  
  - **Substantive rationale**: Knowledge must be “stable under reflection”—a pre-epistemic norm for rational discourse—not merely a fix for Fitch.
