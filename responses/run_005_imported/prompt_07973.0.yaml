  **Reasoning per item:**  
  - **Probabilism (S):** Joyce's dominance argument is robust and widely accepted as the gold standard for accuracy-based justifications.  
  - **Conditionalization (A):** Greaves-Wallace expected accuracy maximization is strong but hinges on diachronic commitments and scoring rule choices.  
  - **Principal Principle (B):** Pettigrew's domination argument works but relies on substantive assumptions about chance-credence relationships.  
  - **Regularity (C):** Accuracy arguments fail in infinite cases and conflict with evidence-based updating (domination isn't guaranteed).  
  - **Principle of Indifference (C):** Highly partition-sensitive; symmetry arguments crumble under reparameterization or insufficient justification for priors.
