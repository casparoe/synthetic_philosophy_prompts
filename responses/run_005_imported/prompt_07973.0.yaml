  ok this is gonna sound niche but for a summer project my mentor had me reading through Titelbaum's big Bayesian epistemology textbook and theres this whole section on "epistemic utility theory" where people try to justify different bayesian norms by showing that credences violating them are "accuracy-dominated" (like Joyce's OG argument for probabilism, where he shows non-probabilistic credences are always less accurate than some probabilistic alternative). i wanna know which of these accuracy-based arguments you actually think hold up vs which ones are shakier:

  - Probabilism
  - Conditionalization
  - Regularity
  - the Principal Principle
  - the Principle of Indifference

  can you rank them from strongest accuracy-based justification to weakest, as a tier list? give me the answer in json like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
