answer: |-
  ## Hallway Debate: Entitlement vs. Quasi-Fideism on the Hinges

  **Setting:** Outside a seminar room, immediately after a talk on Wittgenstein’s *On Certainty* and Moore’s "proof". Coffee cups in hand.

  **Characters:**
  *   **Crispin:** Defends the Entitlement view (Wright-inspired).
  *   **Duncan:** Defends the Quasi-Fideist view (Pritchard-inspired).

  **(The argument is already in progress as we join them)**

  **Crispin:** ...but Duncan, you’re painting us into a corner! If hinge commitments are *entirely* outside the space of reasons, as you insist, then *everything* collapses into groundless fideism. How can we even distinguish between trusting our senses and trusting, say, David Icke’s lizard-people revelations? Both would be equally arational!

  **Duncan:** That’s precisely Wittgenstein’s radical point, Crispin! The hinge *itself* isn’t open to rational assessment – it *constitutes* what counts as rational assessment *within* a framework. My certainty that I have hands isn’t based on reasons; it’s the bedrock *upon which* reasons get a grip. Calling this ‘entitlement’ smuggles in a ghost of justification where none exists. It’s not warranted; it’s *pre-warrant*. It’s *doing*, not *believing* in the justificatory sense.

  **Crispin:** But that’s too quick! Calling it ‘pre-warrant’ doesn’t mean it’s irrational or arbitrary. Entitlement *is* a form of epistemic warrant, just a distinctive, non-evidential one. We’re *entitled* to accept these hinges precisely because doubting them paralyzes inquiry. Without assuming the world existed before five minutes ago, or that my senses generally connect me to it, *no* cognitive project – including debunking conspiracy theories – even gets off the ground! *That* unavoidable necessity *is* the rational warrant.

  **Duncan:** Necessity for *us*, perhaps, but that’s just pragmatic utility dressed up as epistemic virtue! You’re saying we’re ‘entitled’ because it’s *useful* for cognition. But usefulness doesn’t make a proposition *true*, or even rationally held. It just makes it indispensable for *our form of life*. The conspiracy theorist finds *their* hinge indispensable for *their* cognitive project – making sense of a world they see as fundamentally deceptive. If hinges are foundational, calling one ‘entitled’ and another ‘reckless’ from *outside* any framework is nonsense. From *within* their framework, *they* are entitled!

  **Crispin:** Ah, but that’s where the universality of *some* hinges bites back! The conspiracy theorist’s specific hinge *about David Icke* demonstrably *fails* the necessity test. They rely on the *same* fundamental hinges I do – the reliability of language, memory, basic logic, the existence of an external world – to even formulate and communicate their conspiracy. Their *specific* hinge actively *undermines* the very cognitive projects (like understanding history or science) that the *fundamental* hinges enable. Entitlement applies to the indispensable framework, not to every parasitic belief grafted onto it.

  **Duncan:** You’re conflating levels, Crispin. The specific Icke-belief *isn’t* their fundamental hinge. *That* might be something like "Powerful forces systematically deceive ordinary people." *That* is their arational bedrock certainty, their ‘here is a hand’. From *within* that framework, trusting Icke *is* rational, based on evidence filtered *through* that hinge. You can criticize the *internal* coherence of their web of belief *once their hinge is fixed*, but you can’t rationally assess the hinge *itself* as ‘better’ or ‘worse’ than yours. It’s a different animal altogether. Calling fundamental trust ‘entitled’ implies a rational sanction it doesn’t possess.

  **Crispin:** So we’re just stuck with incommensurable frameworks? That *is* relativism! Entitlement avoids that. It provides a *normative* account: we *ought* to accept hinges whose acceptance is a necessary condition for the possibility of *any* justification-seeking inquiry. The conspiracy theorist’s fundamental hinge *isn’t* necessary in that universal way; it actively *impedes* wide domains of inquiry that fundamental hinges like sensory reliability *enable*. Entitlement *isn't* groundlessness; it’s grounding in the transcendental conditions of epistemology itself.

  **Duncan:** "Transcendental conditions" sound grand, but they’re still just *our* conditions, validated by *our* successful practices. For the quasi-fideist, the ‘normativity’ you seek emerges *within* the language-game once the hinge is *in place*, not from some external rational warrant *for* the hinge. The difference between a ‘reasonable’ hinge (like sensory trust) and a ‘reckless’ one (like Icke-trust) isn’t that one is rationally entitled and the other isn’t. It’s that one allows for a rich, stable, *internally* coherent, and adaptable web of beliefs and practices that withstands challenges *from within*, while the other is brittle, leads to constant ad-hoc adjustments, and isolates its holder. But that difference is *post-hoc*, pragmatic, and *internal* to the evolving practice – not a matter of antecedent rational warrant *for the hinge*.

  **Crispin:** But that pragmatic success *is* the manifestation of the rational warrant! The hinge enabling successful inquiry *is* the one we were entitled to trust all along. Calling it ‘post-hoc’ ignores that the entitlement claim *predicts* this very success as the outcome of trusting the necessary preconditions.

  **Duncan:** And there’s the circularity again! You justify the trust by its success, but you only recognize the *kind* of success that aligns with the hinge you started with. The quasi-fideist accepts the circularity but doesn’t pretend it’s justificatory. It’s simply how we *live*. We don’t *choose* our fundamental hinges based on entitlement; we *find* ourselves committed to them, and then build justifications *from* them. Trying to put rational foundations *under* them is the very mistake Wittgenstein diagnosed in Moore. They are the foundations *themselves* – not foundations *of* knowledge, but the hinges *on which* the door of knowledge turns. And hinges aren’t known; they are *shown* in how the door swings.

  **Crispin:** But if hinges aren’t subject to *any* rational constraint, however indirect, what stops the door from swinging wildly into sheer fantasy? Entitlement provides that crucial constraint – the constraint of enabling the very possibility of asking for reasons. Without that, Wittgenstein’s insight becomes an epistemic free-for-all.

  **Duncan:** And *with* entitlement, you risk turning an unavoidable, animal certainty into a phantom justification, preserving the *form* of rationalism while abandoning its evidential substance. We agree the hinges stand fast. We disagree profoundly on whether calling that stance ‘rational’ does anything but obscure their unique, foundational, and ultimately arational nature.

  **(They reach the end of the hall, the argument clearly unresolved, both looking frustrated but thoughtful.)**
