answer: |-
  Here's a step-by-step breakdown of Ruth Chang's small-improvement argument, explaining why it shows that "on a par" cannot be reduced to rough equality:

  ### 1. **The Trichotomy Assumption & The Challenge**
     - Traditional value theory assumes only three relations between options A and B:
       - A is better than B
       - B is better than A
       - A and B are exactly equal in value.
     - Chang argues that some choices (e.g., career as Lawyer vs. career as Clarinetist) resist this trichotomy. Neither is better, but they don’t feel exactly equal either. Critics might suggest this is just "fuzzy equality" or imprecise measurement.

  ### 2. **The Small-Improvement Test Setup**
     - Assume we start with two options, A and B, that *seem* roughly equal (e.g., Lawyer and Clarinetist).
     - Now, create a new option: **A+**, which is A with a *small, uncontroversial improvement* (e.g., Lawyer career + $10k/year salary bonus). Crucially:
       - The improvement is *modest* (not massive).
       - It’s *uncontroversial* (everyone agrees A+ is better than A).
       - It doesn’t alter the fundamental nature of A (e.g., it’s still a legal career).

  ### 3. **The Critical Question**
     - **Is A+ now determinately better than B?**  
     (Using the example: Is Lawyer + $10k better than Clarinetist?)

  ### 4. **The Argument Mechanics**
     - **Case 1: If A and B were TRULY EXACTLY EQUAL:**
       - Adding *any* improvement to A should make A+ strictly better than B.  
         *Why?* Exact equality means the value of A and B is identical. Adding *any* positive value to A should break the symmetry, making A+ > B.  
         *Example:* If two apples are identical, adding even a tiny extra seed to one makes it better.
       - **Conclusion for Equality:** If A ≈ B (exactly equal), then A+ > B *must* hold.

     - **Case 2: If A and B are ON A PAR (Chang’s view):**
       - The small improvement to A might **still not make A+ determinately better than B**.  
         *Why?* The values are fundamentally different in kind (e.g., money/prestige vs. artistic fulfillment). The improvement affects only one dimension, failing to "tip the scales" definitively.  
         *Example:* Lawyer + $10k might not feel clearly *better* than Clarinetist—the artistic value still holds significant weight.
       - **Result:** A+ is not better than B, nor is B better than A+, nor are they equal. They remain in a standoff, but now with A slightly enhanced.

     - **Case 3: If A and B were INCOMPARABLE:**
       - A small improvement to A shouldn’t make A+ comparable to B either.  
         *Example:* Comparing "justice" (A) to "the color blue" (B). Adding "more justice" (A+) doesn’t make it comparable to blue.

  ### 5. **The Key Inference**
     - **Observation:** In hard choices like career picks, we often find that **A+ is *still* not determinately better than B** (e.g., Lawyer + $10k isn’t clearly superior to Clarinetist).
     - **Logical Implication:**  
       This observation **contradicts Case 1** (exact equality). If A and B were exactly equal, A+ *must* be better than B. But it isn’t.  
       Therefore, the original relation between A and B **cannot be exact equality**.
     - **Ruling Out Imprecise Equality:**  
       Critics might say, "A and B are roughly equal, so a *small* improvement might not be enough to break the vagueness." Chang rejects this:  
       - If improvements are too small to ever break vagueness, then *no improvement*, no matter how large, could ever make A+ better than B—which is absurd.  
       - If *some* improvement *would* make A+ better, but our modest improvement hasn’t, then we’re admitting that A and B weren’t equal—they were in a relation where improvements don’t immediately force betterness. That relation is "on a par."

  ### 6. **Why "On a Par" is the Only Explanation**
     - **Incomparability (Case 3) is ruled out:** We *can* compare Lawyer and Clarinetist (e.g., both are careers with pros/cons). We deliberate between them, suggesting comparability.
     - **Equality (Case 1) is ruled out** by the small-improvement test.
     - **Betterness is absent** by the initial setup (neither career is clearly better).
     - **Therefore, a fourth relation must exist:** "On a par" — where options are comparable, neither better, but not equal. Small improvements can fail to break the tie because the values are different in kind, and the improvement only affects one aspect.

  ### Diagramming the Argument
  ```
  Initial State: 
     A ⊁ B, B ⊁ A, ¬(A ≈ B) [Not exact equality], ¬(A ⋡⋠ B) [Not incomparable]

  Apply Small Improvement: Create A+ (where A+ > A)

  Test: Is A+ > B?
     - If YES → Suggests A was likely worse than or equal to B.
     - If NO (and B ⊁ A+, ¬(A+ ≈ B), ¬(A+ ⋡⋠ B)) → 
          Then A+ and B are STILL neither better/worse/equal/incomparable.
          This contradicts trichotomy.
          AND proves original A and B could not have been exactly equal (since A+ should break equality).

  Conclusion: The persistent "no betterness" after improvement reveals "on a par."
  ```

  ### The Essence
  Chang’s argument shows that **exact equality is *precise***: any improvement breaks it. If a small improvement *fails* to establish betterness in cases where we acknowledge comparability, the initial relation wasn’t equality—even a fuzzy one. It was a deeper, non-quantitative relation where values are different in kind ("on a par"), and choice involves creating reasons through commitment, not discovering pre-existing superiority.
