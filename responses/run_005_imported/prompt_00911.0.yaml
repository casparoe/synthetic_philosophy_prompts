  I should explain the difference between the formal structure and the normative content. The theorem provides a mathematical framework, but applying it requires assigning weights, which isn't value-neutral. Philosophers like Sen have criticized this, arguing that the weights embody interpersonal comparisons. Also, the vNM utilities represent preferences under risk, but welfare might involve more than that. For example, people might have adaptive preferences or make mistakes about their own well-being.

