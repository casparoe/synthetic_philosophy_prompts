answer: |-
  You've hit on a genuine ambiguity in the term "four-dimensionalism" – it *is* used inconsistently! Let's break down the core concepts, see how they relate, and explore the possible combinations:

  1.  **Perdurantism:** An account of **persistence**.
      *   **Claim:** Objects persist through time by having different **temporal parts** at different times. An object is a four-dimensional "spacetime worm."
      *   **Implication:** At any single moment in time (`t`), only the instantaneous *temporal part* of the object exists *at `t`*. The whole object is never "wholly present" at `t`; it is only *partly* present (via its `t`-part).
      *   **Analogy:** A movie. The whole movie (the perduring object) exists, but at any single frame (time `t`), only *that frame* (the temporal part) is on the screen. The whole movie isn't on the screen at once.

  2.  **Eternalism (Block Universe):** An account of the **nature of time/reality**.
      *   **Claim:** Past, present, and future are equally real. Time is like space. There is no metaphysically privileged "now." All events and objects, regardless of their temporal location, exist *simpliciter*.
      *   **Implication:** The year 79 AD (Pompeii), 2024 AD, and 2525 AD are all equally real parts of the universe's structure, just as London and Tokyo are equally real parts of its spatial structure. "Now" is just a perspectival indexical (like "here").
      *   **Analogy:** A finished book. All chapters (past, present, future) exist. Reading the book sequentially is like experiencing the "flow" of time, but the whole book is always there.

  3.  **Endurantism:** An alternative account of **persistence**.
      *   **Claim:** Objects persist through time by being **wholly present** at each moment of their existence. They "endure." An object is a three-dimensional entity located at different times.
      *   **Implication:** At any single moment in time (`t`) where the object exists, the *entire* object exists at `t`. It doesn't have temporal parts; it's fully there.
      *   **Analogy:** A musical note held for 5 seconds. At *every* second during those 5 seconds, the *entire* note is present and sounding. It's not divided into temporal segments that each exist only for an instant.

  4.  **Presentism:** An alternative account of the **nature of time/reality**.
      *   **Claim:** Only the present moment exists. The past is gone; the future is not yet real. Reality is constantly changing as the present moves.
      *   **Implication:** Statements about the past or future are either about non-existent things or must be analyzed differently (e.g., via traces, memories, or future possibilities). There are no non-present objects or events.

  **How They Relate & Where They Come Apart:**

  *   **Eternalism vs. Presentism:** These are fundamentally opposed views about the *reality* of non-present times. They address the ontology of time itself.
  *   **Perdurantism vs. Endurantism:** These are fundamentally opposed views about *how objects exist* within time. They address the ontology of persisting objects.
  *   **"Four-Dimensionalism":** This term often conflates the two because:
      *   Perdurantism *requires* objects to be 4D entities (extended in time).
      *   Eternalism sees *spacetime* as a 4D manifold where all times exist.
      *   However, you can have a 4D spacetime structure (Eternalism) without objects *themselves* being 4D worms with temporal parts (Perdurantism).

  **Answering Your Specific Questions:**

  1.  **Does being an eternalist commit you to perdurantism?**
      *   **No.** Eternalism is compatible with both perdurantism *and* endurantism. Eternalism says *all times and their contents* exist. An eternalist endurantist believes that at *each* time `t`, enduring objects are *wholly present* at `t`. The object at `t1` (wholly present) is numerically identical to the object at `t2` (wholly present), existing within the eternal 4D block. Eternalism provides the "stage" (all times exist), but objects can "perform" on that stage by enduring or perduring. Prominent eternalist endurantists include Trenton Merricks and (arguably) some interpretations of David Lewis's counterpart theory.

  2.  **Could there be a coherent eternalist endurantist?**
      *   **Yes.** As above. The key challenge for the eternalist endurantist is explaining **trans-temporal identity** and **change** without temporal parts.
      *   **Identity:** How is the wholly present object at `t1` the *same* entity as the wholly present object at `t2`? (This is the "problem of temporary intrinsics" - how can one thing be both bent and straight? Perdurantists solve it by saying different *parts* have the properties; endurantists need other solutions like adverbialism or relational properties).
      *   **Change:** How does the object *change* if it's wholly present with incompatible properties at different times? Endurantists typically say the object bears properties *at*-a-time or *relative-to*-a-time ("The candle is straight at t1" and "The candle is bent at t2").
      *   Despite these challenges, many philosophers argue coherent versions exist.

  3.  **Does perdurantism even make sense if you're stuck with presentism?**
      *   **No, not coherently.** Perdurantism fundamentally relies on the reality of *non-present* temporal parts. If only the present moment exists (Presentism), then:
          *   An object *cannot* have temporal parts located in the past or future, as those parts simply *do not exist*.
          *   The only temporal part that exists is the instantaneous present slice. But perdurantism defines an object as the *sum* of *all* its temporal parts. If only one part exists, the object *is* just that instantaneous slice. This collapses into a form of **Exdurantism (Stage Theory)**, where objects are instantaneous stages, and "persistence" is just a matter of later stages standing in a counterpart relation to earlier ones. It's *not* perdurantism as classically defined (the worm view). Presentists are almost universally endurantists, believing the *whole* object exists, wholly present, *right now*.

  **Summary of Possible Combinations & Their Status:**

  | View                 | Eternalism (4D Spacetime) | Presentism (Only Present) |
  | :------------------- | :------------------------ | :------------------------ |
  | **Perdurantism**     | **Common & Coherent** (Standard 4D view: Objects are spacetime worms in a block universe). Defended by David Lewis, Ted Sider. | **Non-Starter** (Requires non-present parts to exist, which Presentism denies). |
  | **Endurantism**      | **Coherent & Defended** (Objects wholly present at each time within the eternal block). Defended by Trenton Merricks, possibly Kit Fine (Neo-Aristotelianism). | **Common & Coherent** (Standard Presentist view: Only the present exists, and objects within it are wholly present). Defended by Dean Zimmerman, Ned Markosian (early). |
  | **Exdurantism (Stage Theory)** | **Coherent & Defended** (Objects are instantaneous stages; persistence is counterpart relations across the block). Defended by Ted Sider (in *Four-Dimensionalism*). | **Only Coherent "Perdurance-like" Option under Presentism?** (Objects *are* instantaneous present stages; "persistence" is indirect). Sometimes adopted by Presentists, though Endurantism is more common. |

  **In short:** "Four-dimensionalism" is ambiguous. Perdurantism and Eternalism address different questions (persistence vs. time's ontology). You can be an Eternalist without being a Perdurantist (Eternalist Endurantism is viable). You *cannot* coherently be a Presentist Perdurantist. The viable combinations are: Eternalist Perdurantism, Eternalist Endurantism, Presentist Endurantism, and Eternalist Exdurantism. Presentist "Perdurantism" collapses into Exdurantism or is incoherent.
