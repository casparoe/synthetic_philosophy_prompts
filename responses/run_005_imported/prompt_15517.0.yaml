answer: |-
  You've hit on a profound tension between economic modeling of mixed motives and the lived moral complexity of human action. Your discomfort with both dinner-party positions is justified—they represent incomplete ethical frameworks. Here's a more precise way to analyze cases like your aunt's, integrating behavioral economics with moral philosophy:

  ### Core Analytical Framework: The Tripartite Moral Landscape
  1. **Action/Outcome Morality**  
     (Your consequentialist housemate's view)  
     - **Value**: The vulnerable person receives competent care.  
     - **Limitation**: Ignores how motives affect *sustainability* of care (e.g., resentment may lead to neglect) and relational dignity.

  2. **Character Morality**  
     (Your motive-focused housemate's view)  
     - **Value**: Recognizes that habitual motives shape moral identity.  
     - **Limitation**: Overlooks that "impure" motives (guilt, self-interest) may *enable* prosocial action when "pure" altruism is insufficient.

  3. **Relational Morality** (Key missing piece)  
     - **Focus**: The *quality of the relationship* sustained by mixed motives.  
     - **Critical questions**:  
       - Do the motives preserve or undermine the recipient's dignity?  
       - Do they create reciprocal obligations (e.g., inheritance as tacit compensation)?  
       - Does self-awareness of mixed motives foster honesty or corrosive self-deception?

  ### Behavioral Economics Meets Moral Psychology: Four Diagnostic Criteria
  Apply these to your aunt's case:

  | **Criterion**              | **Application to Aunt**                                                                 | **Moral Significance**                                                                 |
  |----------------------------|-----------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **1. Motivational Synergy** | Guilt avoidance enables sustained care; affection prevents resentment; inheritance provides material justification | *Positive*: Motives compensate for each other's limitations to enable consistent care |
  | **2. Reflexive Awareness**  | Explicit acknowledgment of mixed motives ("in the same breath")                         | *Mitigates self-deception*: Honesty allows calibration of motives over time            |
  | **3. Recipient Welfare**    | Care is competent and attentive ("doesn't trust others to give needed attention")       | *Outcome validated*: Mixed motives don't compromise quality of care                    |
  | **4. Volitional Endorsement** | "Genuinely loves her" + views care as non-negotiable duty                              | *Sustains agency*: Not purely extrinsically driven; incorporates authentic commitment |

  ### Why Both Housemates Are Incomplete
  - **The Consequentialist** ignores that motives aren't morally neutral: Chronic guilt may erode care quality over decades; expectation of inheritance could create subtle conflicts of interest.  
  - **The Character Purist** commits the "moral self-licensing" fallacy: Assuming "pure" motives are always preferable ignores that humans *require* multiple reinforcement mechanisms to sustain difficult virtues (Batson's "empathy-altruism paradox" shows even empathy serves self-image needs).

  ### A More Precise Ethical Conclusion
  Your aunt exemplifies **relationally sustainable moral agency**: Her motives form an *ecosystem* that maintains care under demanding conditions. This doesn't make her a saint, but it reveals three important truths:  
  1. **Moral durability often requires hybrid engines** – Self-interest (inheritance) subsidizes the emotional cost of care; social accountability (guilt avoidance) sustains it when affection falters.  
  2. **Transparency modifies moral worth** – Her self-awareness prevents the "taint" of hidden motives, allowing authentic relationship maintenance ("genuinely loves her").  
  3. **The alternative may be worse** – If only "pure" caregivers acted, vulnerable populations would suffer systemic neglect (as your economics models predict).

  ### For Your Next Discussion
  Instead of choosing between "good motives" vs. "good outcomes," reframe:  
  *"In non-ideal conditions, we should evaluate whether mixed motives:*  
  *(a) generate net positive welfare,*  
  *(b) permit reflective course-correction, and*  
  *(c) honor the recipient's humanity.*  
  *My aunt's case clears all three bars—her 'impurities' aren't flaws but adaptive features."*

  This satisfies behavioral realism while affirming moral seriousness. Your work on warm-glow giving now has richer philosophical grounding: Impure motives aren't just empirically normal; they're often ethically necessary scaffolding for sustained goodness in an imperfect world.
