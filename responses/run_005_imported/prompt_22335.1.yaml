  First, I need to address Nick's hard incompatibilism without undermining it. Strawson's idea of the reactive attitudes seems useful here—focusing on how we naturally feel gratitude and love regardless of metaphysical debates. The toast should acknowledge Nick's view but pivot to the human experience.

  The audience is split: philosophers who'll catch any misstep, and family/friends who want heartfelt sentiment. Elena finds the debate absurd, so maybe use that to lighten the mood. Need a joke that works for both groups—something about Nick's determinism leading him to Elena could bridge the gap.

  Structure-wise, start with humor to relax everyone, then acknowledge Nick's philosophy seriously. Use terms like "system" or "program" to nod to his views but quickly shift to the emotional reality. Highlight Elena's role in accepting him, which subtly supports Strawson's point about attitudes mattering more than free will.

  Avoid compatibilist arguments. Instead, frame gratitude and love as inevitable responses, even under determinism. Phrases like "the universe arranged" instead of "you chose" keep it consistent. The joke about Nick's proposal being predetermined but still perfect needs to land as sweet, not cynical.

