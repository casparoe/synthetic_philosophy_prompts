  ### The Prisoner's Dilemma
  Recall the Prisoner's Dilemma: two players each choose to Cooperate (C) or Defect (D). The payoffs are:
  - If both cooperate (C, C): both get a high reward (say, 3).
  - If one cooperates and the other defects (C, D): the cooperator gets 0 and the defector gets 5.
  - If both defect (D, D): both get 1.

  The dilemma is that defecting is dominant (gives a higher payoff regardless of the other's choice) but leads to a worse outcome (1) than mutual cooperation (3).

