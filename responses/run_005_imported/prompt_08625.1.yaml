  Consider two agents, Alice and Bob, each with access to the other's source code. The naive idea is:

  Alice's code:
    if I can prove that Bob will output C, then output C; else output D.

  Bob's code is symmetric.

  The problem: each agent tries to prove a statement about the other agent that itself depends on what the first agent does.

  Specifically, for Alice to decide, she must prove "Bob outputs C". But Bob's output depends on what he proves about Alice. So Bob's output is "C" only if he can prove "Alice outputs C". Now we have:

  Alice: "I'll cooperate if I can prove Bob cooperates."
  Bob: "I'll cooperate if I can prove Alice cooperates."

