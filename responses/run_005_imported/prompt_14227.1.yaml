prompt: |-
  I'm partway through grading take-home finals for my graduate proseminar on Rawls and would love a careful second pass on one answer before I commit to a score, since I've read it about six times now and honestly can't tell anymore if I'm being to generous or to harsh. Here's the question I gave them: "Explain why Rawls holds that the parties in the original position would reason via maximin rather than by maximizing expected utility, and contrast this with Harsanyi's use of a similar veil-of-ignorance device to defend average utilitarianism. Then briefly locate the difference principle within Rawls's complete lexical ordering of principles." Its worth 20 points, and since this is a proseminar (not intro), I told everyone up front I'd be grading for precision, not just for gesturing at the right vocabulary.

  Here's the student's answer, more or less verbatim: "Behind the veil of ignorance, the parties don't know their class position, natural talents, or particular conception of the good, so they can't design principles to favor themselves. Rawls argues that in this situation the parties would reason via maximin — ranking principles by their worst possible outcome and choosing whichever principle's worst outcome is best — rather than by calculating expected utility. He gives three considerations for this: the parties have no reliable basis for assigning probabilities to the different social positions they might end up in, the minimum guaranteed under maximin is high enough that there's little to gain by risking it, and the worst outcomes under the rejected alternatives are ones a person could hardly accept. What these three considerations really amount to, though, is that the parties are being modeled as strongly risk-averse, and it's this risk-aversion that ultimately does the work of ruling out expected-utility maximization. Harsanyi's version of the veil of ignorance is structurally similar but licenses a different inference: his parties are willing to assign an equal probability to being any given person in society, and then maximize expected utility given that assumption, which, combined with standard assumptions about diminishing marginal utility of income, yields average utilitarianism rather than the difference principle. Within Rawls's complete theory, equal basic liberty is lexically prior to the second principle as a whole, so liberty can never be traded away for economic gains, and within the second principle itself, the difference principle takes priority over fair equality of opportunity, since unequal income and wealth are the inequalities that most directly affect people's life prospects, whereas fair equality of opportunity is more of a procedural safeguard that only kicks in once the bigger distributive question has been settled."

  Could you give this a grade out of 20 and, more importantly, back it up with specific point-by-point comments rather than a general impression — I want to be able to justify every point I take off if the student shows up to office hours. If it's not too much trouble, a short rubric as JSON (sub-scores plus a one-line justification each for the original-position set-up, the maximin argument itself, the Harsanyi contrast, and the lexical-ordering claim) would be genuinely useful, since I'm trying to build a little bank of these so my TA can grade the rest of the stack consistently.
reasoning: |-
  Okay, let me start by understanding what the professor needs. They're grading a grad student's essay on Rawls and want a detailed evaluation. The question has three parts: why Rawls uses maximin, contrast with Harsanyi, and the lexical ordering. The professor emphasized precision in a proseminar, not just general understanding.

  First, I'll parse the student's answer section by section. For the original position setup, the student mentions the unknowns: class position, natural talents, conception of the good. That's correct. But they missed the primary goods and the motivation of parties to secure basic liberties. That's a point off because precision matters at this level. The student should've included those specifics to show deeper understanding.

  Next, the maximin reasoning. The student lists Rawls' three reasons: no probabilities, high minimum, unacceptable worst outcomes. They correctly link this to risk aversion. But they don't address Rawls' explicit rejection of risk aversion as the foundation. Rawls frames it as rational under uncertainty, not psychological risk aversion. Missing this nuance is a deduction. Also, they didn't mention that the parties care about the least advantaged, which is key. That's another point off.

  Moving to Harsanyi contrast. The student correctly notes the equal probability assumption and the outcome of average utilitarianism. They mention diminishing marginal utility, which is good. However, they miss that Harsanyi's approach is Bayesian rationality versus Rawls' non-probabilistic. The student conflates structural similarity without highlighting the critical divergence in handling uncertainty. That's a point off. Also, not specifying that Harsanyi's conclusion is average utilitarianism as opposed to classical might be a minor point, but the student did say "average," so maybe not. Wait, the answer says "average utilitarianism," which is correct, so that part is fine. The main issue is the lack of contrast in uncertainty handling.

  For lexical ordering, the student gets the sequence right: basic liberties first, then second principle with difference principle over fair equality of opportunity. They explain that liberties can't be traded for economic gains, which is correct. They also note that the difference principle addresses life prospects directly, while fair equality is procedural. That's accurate. No points off here.

  Now, considering the overall structure. The student covers all parts but with some omissions in key nuances. The professor’s rubric needs specific deductions per section. The lexical ordering part is solid. The Harsanyi section missed the methodological difference in uncertainty. The maximin argument omitted Rawls' rejection of risk aversion as the basis. The setup missed primary goods and parties' motivations.

  The professor mentioned building a JSON rubric for consistency. So breaking down: Setup -1 for missing primary goods and motivation. Maximin -2 for not addressing Rawls' rejection of risk aversion and the focus on the least advantaged. Harsanyi -1 for not contrasting uncertainty approaches. Lexical ordering is correct, no deduction. That totals 16/20. 

  Wait, the professor might expect more stringent grading. Let me double-check. The student did link risk aversion to the three reasons, which Rawls does imply, but the key is that Rawls avoids calling it risk aversion explicitly. That's a significant point in grad-level precision. Also, in Harsanyi, not distinguishing the Bayesian approach is a substantial omission. So the deductions seem justified. 

  Final score 16/20. The JSON should reflect these specific misses. The professor can justify each deduction: missing elements in setup, misinterpretation of risk basis in maximin, incomplete contrast in Harsanyi, while lexical is perfect.
answer: |-
  Based on a strict, precision-focused grading standard for a graduate proseminar, I award this answer **16/20**. Below is a detailed breakdown with justifications for deductions, followed by a JSON rubric for consistency.

  ---

  ### **Point-by-Point Evaluation (20 Total Points)**
  #### **1. Original Position Set-Up (Max 4 pts)**
  - **Score: 3/4**  
    **Justification:** Correctly identifies key unknowns (class, talents, conception of the good) and the inability to self-favor. However, omits critical details:  
    - Fails to mention **"primary goods"** (rights, liberties, opportunities, income, self-respect) as the metric for assessing outcomes.  
    - Does not specify that parties are **mutually disinterested** (not altruistic) and seek to maximize their share of primary goods.  
    *Deduct 1 pt for incomplete characterization.*

  #### **2. Maximin Reasoning (Max 6 pts)**
  - **Score: 4/6**  
    **Justification:** Accurately lists Rawls’ three arguments (no probability basis, tolerable minimum, dire worst-case outcomes) and notes risk aversion. Major omissions:  
    - Does **not address Rawls’ explicit rejection** of interpreting maximin as "risk aversion" (*TJ* §26). Rawls argues it is rational under *specific conditions of ignorance*, not generalized risk-aversion.  
    - Overlooks that parties care **only about the least-advantaged position** (not the full distribution).  
    - Omits Rawls’ emphasis that maximin applies when we have **"no basis for probabilities"** (non-probabilistic ignorance).  
    *Deduct 2 pts for misrepresenting the role of risk aversion and omitting core rationales.*

  #### **3. Harsanyi Contrast (Max 6 pts)**
  - **Score: 5/6**  
    **Justification:** Correctly identifies Harsanyi’s use of **equal probability** and **average utilitarianism** (not classical utilitarianism). Links diminishing marginal utility. Minor flaw:  
    - Fails to contrast the **methodological divergence**: Harsanyi treats the veil as a **Bayesian decision-problem** with quantifiable uncertainty, while Rawls rejects probabilistic reasoning entirely.  
    *Deduct 1 pt for not specifying this epistemic contrast.*

  #### **4. Lexical Ordering (Max 4 pts)**
  - **Score: 4/4**  
    **Justification:** Flawless. Correctly orders:  
    (1) Equal basic liberties (lexically prior),  
    (2) Fair equality of opportunity (FEO),  
    (3) Difference Principle (DP).  
    Explains DP’s priority over FEO due to direct impact on life prospects vs. FEO’s procedural role.  
    *No deduction.*

  ---

  ### **JSON Rubric**
  ```json
  {
    "rubric": {
      "original_position_setup": {
        "score": 3,
        "max_score": 4,
        "justification": "Omits primary goods and mutual disinterest; otherwise correct."
      },
      "maxmin_reasoning": {
        "score": 4,
        "max_score": 6,
        "justification": "Misses Rawls's rejection of risk-aversion rationale and exclusive focus on least-advantaged."
      },
      "harsanyi_contrast": {
        "score": 5,
        "max_score": 6,
        "justification": "Accurate but lacks explicit contrast in handling uncertainty (Bayesian vs. non-probabilistic)."
      },
      "lexical_ordering": {
        "score": 4,
        "max_score": 4,
        "justification": "Perfectly ordered and justified."
      },
      "total_score": 16,
      "max_total_score": 20
    }
  }
  ```

  ---

  ### **Key Strengths & Weaknesses**
  - **Strengths:**  
    - Mastery of structural parallels/differences between Rawls and Harsanyi.  
    - Precise articulation of lexical priority (rarely achieved perfectly).  
    - Clear, jargon-free writing.  
  - **Weaknesses:**  
    - **Risk-aversion misstep:** Rawls *denies* maximin relies on psychological risk-aversion (*TJ* p. 136–137). It’s a rational strategy under non-probabilistic ignorance.  
    - **Primary goods omission:** Critical for understanding *why* parties assess outcomes as they do.  
    - **Harsanyi nuance:** The Bayesian/probabilistic vs. Rawlsian/non-probabilistic divide is central to their disagreement.  

  ### **Recommendation**  
  This is a strong **B+/A-** answer (16/20 ≈ 80-85%). The student demonstrates sophisticated comprehension but misses nuances essential for graduate-level precision. Deductions are defensible if challenged in office hours—each reflects a specific, non-trivial oversight in Rawlsian exegesis. For the full stack, emphasize to your TA that omissions of **primary goods**, **mutual disinterest**, or **Rawls’ anti-risk-aversion argument** warrant deductions in the maximin section.
