answer: |-
  Here’s a toast that navigates the tension with warmth, sincerity, and philosophical depth—without jargon or inside jokes. It honors the universality of love while subtly engaging the evolutionary perspective, framing it as a foundation for something *more* meaningful:

  ---

  **(Raise glass, warm smile)**  

  "Everyone here knows my sister as a brilliant thinker—someone who dedicates her life to asking the deepest questions about why we believe what we believe. And if you’ve ever talked to her for more than five minutes… *(gentle laugh)*… you know she’s really, *really* good at it.  

  But today isn’t about questions—it’s about answers. The kind of answer you feel in your bones when you see two people who just… *fit*. Like they were made for each other.  

  Now, you could tell a story about *why* that feeling exists. You could talk about ancient instincts, survival, chemistry, the way our minds are wired to seek connection. You could explain the ‘how’ down to the last detail. And it’s a powerful story. It tells us something true about being human.  

  **But here’s the miracle:** That story doesn’t even come *close* to explaining what we’re celebrating today.  

  Because what [Sister’s Name] and [Partner’s Name] have isn’t just a feeling that happened *to* them. It’s a choice they make. Every single day. It’s in the patience when things are hard, the laughter that’s their secret language, the quiet way they lift each other up without fanfare. It’s not about being ‘written in the stars’—it’s about writing their story *together*, word by word, act of kindness by act of kindness.  

  The science might explain the spark… but it can’t explain the fire they’ve built. It can’t explain the depth of their respect, the strength of their partnership, or the joy they clearly find in building a life side-by-side. That’s not biology—that’s *them*. Their character, their humor, their unwavering care.  

  So today, we celebrate the profound truth that outlasts every explanation: **Love isn’t just something we inherit. It’s something we create.**  

  To [Sister’s Name] and [Partner’s Name]: Thank you for reminding us that the most beautiful things in life aren’t just explained—they’re lived. May your story together keep unfolding with the same wisdom, generosity, and sheer delight you bring to it right now. Cheers!"

  ---

  ### Why this works
  1.  **Acknowledges the Tension (Subtly):**  
      *   References "the story you could tell" (evolutionary explanation) and validates it as "true about being human," showing respect for the intellectual framework without naming it.  
      *   Explicitly contrasts the "how" (mechanism) with the "what" (their lived, chosen love).  
      *   Uses the "written in the stars" metaphor familiar to all, pivoting it to emphasize agency ("writing their story together").  

  2.  **Centers Warmth & Sincerity:**  
      *   Focuses on observable, universal qualities of their relationship: patience, laughter, support, partnership, shared joy. Relatives connect instantly.  
      *   Highlights *choice* and *creation* – deeply romantic and affirming concepts.  
      *   Personalizes praise ("*their* secret language," "*their* unwavering care").  

  3.  **Reframes the "Debunking" as a Setup for Something Deeper:**  
      *   Doesn't dismiss the evolutionary perspective; uses it as a springboard to argue that the *meaning* of love lies *beyond* its origins.  
      *   "The science might explain the spark... but it can’t explain the fire they’ve built" – This is the core refutation philosophers will recognize. Love's value isn't negated by its origins; its *expression* and *endurance* transcend them.  
      *   "Love isn’t just something we inherit. It’s something we create" – The uplifting conclusion that satisfies both intellect and heart.  

  4.  **Honors the Sister:**  
      *   Opens with genuine praise for her intellect ("brilliant thinker," "really good at it"), establishing respect.  
      *   The pivot ("But today isn't about questions—it's about answers") subtly shows how her profound work *enhances* the appreciation for the love she's found, rather than undermining it.  

  **Delivery Tip:** Speak slowly and warmly, especially during the descriptions of their relationship. Make eye contact with the couple during the most personal parts ("patience," "laughter," "lift each other up"). Let the final lines land with heartfelt conviction.  

  This toast respects the philosophers in the room by engaging the core idea seriously and constructively, while offering everyone a moving tribute to the unique, chosen love of the couple. It turns potential tension into a celebration of meaning forged *through* understanding.
