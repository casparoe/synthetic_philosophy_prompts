answer: |-
  ## Certainties Rot

  Dr. Aris Thorne’s pen scratched across the intake form, the clinical fluorescents humming a flat, indifferent note. Across the scarred laminate desk sat Silas Verner, gaunt, eyes like smudged charcoal in hollows. His file listed Cotard’s Delusion. *Nihilistic Type*. Thorne had read the notes: *Believes he is biologically dead, organs necrotic. Denies existence of external world as conventionally understood.*

  "Silas," Thorne began, his voice calibrated to neutral warmth. "Can you tell me what brings you here today?"

  Silas didn’t look at him. His gaze drifted to the window, where rain streaked the grey afternoon. "The persistence," he murmured, the word thick, unfamiliar on his tongue. "The *persistence* of it all. It’s... obscene."

  "Of what, Silas?"

  "This." A skeletal hand lifted, gestured vaguely at the room, at his own chest. "The simulation. The decaying puppet show. I ceased. Weeks ago. Months? Time is... irrelevant paste now. Yet the signals keep firing. The eyes transmit phantom light. The skin registers ghost pressure. It shouldn’t *persist*." His voice cracked, not with emotion, but like dry paper tearing. "The hinges are rotten, Doctor. The whole frame is coming down."

  Thorne felt the familiar prickle, the intellectual itch beneath his clinical detachment. Wittgenstein’s riverbed. *The river-bed of thoughts may shift. But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division of the one from the other.* Silas wasn’t arguing about the water – the specific perceptions. He was insisting the riverbed itself was collapsing.

  "You feel sensations, Silas," Thorne said carefully. "You see this room. You hear my voice. Doesn't that suggest... presence? Continuity?"

  Silas turned his head slowly. His eyes finally met Thorne’s, devoid of recognition, only a terrible, hollow weariness. "You mistake the map for the territory, Doctor. The signals arrive. Like echoes in an empty cathedral. But the source... the source is *gone*. My heart? A lump of putrefying meat. My lungs? Bellows pumping dust. This hand..." He raised it again, trembling slightly. "...is not *mine*. It’s borrowed scaffolding, collapsing under the weight of its own impossible animation."

  Thorne leaned forward. "But how do you *know*? What evidence proves you're dead?"

  Silas let out a sound like dry leaves skittering on stone. A laugh? "Evidence? *Evidence* requires a ground, Doctor. A place to stand. A hinge that holds fast. 'I am alive'... that was my hinge. The bedrock. Without it..." He spread his decaying hands, a gesture of terrifying vacancy. "...what grounds are possible? What evidence could *possibly* anchor itself? If that hinge gives way, everything built upon it – doubt, belief, proof, disproof – it all just... floats. Meaningless noise. Like trying to measure the depth of a well with a ruler made of smoke."

  Wittgenstein’s words echoed in Thorne’s mind: *Giving grounds, however, justifying the evidence, comes to an end; – but the end is not certain propositions’ striking us immediately as true... it is our* acting, *which lies at the bottom of the language-game.* Thorne realized his mistake. He was trying to play the language-game of evidence and justification with a man whose foundational act – the act of *being* – had dissolved. Silas couldn’t *reason* his way back because reason itself required the hinge of existence to stand fast.

  Thorne tried a different tack, appealing to action itself. "Silas, you walked in here. You're speaking. You're interacting. Doesn't that... doing... doesn't that constitute being?"

  Silas stared at his own hand resting on the desk. "The puppet moves because the strings are pulled. Habit. Residual electricity in decaying nerves. The *appearance* of action. But the actor... the one who *means* the action..." He looked up, his eyes pools of absolute negation. "...is absent. Dissolved. This is merely the slow settling of dust. The riverbed isn't just shifting, Doctor. It's collapsing into the void it always was beneath the water's frantic dance."

  Thorne felt a chill that had nothing to do with the room temperature. It wasn't fear of Silas, but a vertiginous glimpse into the abyss Silas inhabited. If "I exist" wasn't a proposition known or justified by evidence, but the *hinge* upon which all knowing and justifying turned... what happened when it sheared off? The world didn't become false; it became *ungrounded*. Meaning didn't just drain away; it was revealed to have never been inherent, only suspended over that chasm by the brute, unthinking *act* of taking existence for granted.

  He recalled another fragment: *The difficulty is to realize the groundlessness of our believing.* Thorne *believed* he was alive. He *acted* upon it. But confronted with Silas, that belief felt suddenly thin, a skin stretched over nothingness. His own certainty felt like Silas’s borrowed scaffolding.

  "Describe it," Thorne urged, his voice low. "This... absence."

  Silas closed his eyes. "Cold. A profound, internal coldness. Not temperature. Emptiness. As if... as if the center has been scooped out. The world..." He opened his eyes, looking through Thorne, through the wall. "...it has no purchase. Light falls on the eyes, but it doesn't *illuminate*. Sound vibrates the ear, but it doesn't *signify*. Touch..." He shuddered, a full-body tremor that seemed to ripple from some non-existent core. "...is the worst. Contact with this decaying shell. A reminder of the terrible persistence of the illusion."

  Impulsively, Thorne reached out and placed his hand firmly on Silas’s forearm resting on the desk. It was warm, solid, the pulse fluttering faintly against Thorne's fingertips. A grounding act. Proof.

  Silas recoiled violently, scrambling back in his chair, eyes wide with pure, unadulterated horror. He clutched his arm where Thorne had touched him, not in pain, but in visceral, existential revulsion.

  "*Don't!*" he gasped, his voice raw. "The contact... it *anchors* the phantom! It makes the lie *thicker*! It forces the dead nerves to scream their counterfeit signals!" He was panting, staring at his arm as if it were a venomous creature attached to him. "The riverbed... you're trying to rebuild it *with the water itself*! It just... flows away... into the dark..."

  Thorne withdrew his hand, his own skin crawling. The simple act of touch, meant to reassure, to ground, had become an assault. A violation of Silas’s collapsed reality. It wasn't that Silas disbelieved the sensation; he experienced it as a horrific confirmation of the ongoing, impossible fraud. His way of acting – recoiling, reviling the sensory input – *was* his reality now. The language-game had changed its bedrock, and the rules were written in negation.

  The session ended shortly after. Silas drifted out, a wraith convinced of its own non-existence, leaving Thorne alone with the humming lights and the chilling residue of the encounter. He looked at his own hand, the hand that had touched Silas. Solid. Warm. Undeniably *there*.

  But Wittgenstein’s river churned in his mind. *If the true is what is grounded, then the ground is not true, nor yet false.* The ground wasn't true. It just *was*. Or wasn't. Thorne picked up his coffee cup. A simple action. An affirmation. He took a sip. The warmth was real. The bitter taste was real. His belief in his own existence, in the cup, in the room, was not a conclusion he had reached. It was the riverbed he stood upon, the hinge that held fast... *for now*.

  He looked out at the rain-lashed window. The water flowed relentlessly over the unseen bed below. How deep was the bedrock? How solid? Silas’s hollow eyes stared back at him from memory, reflecting only the void where certainty had rotted away. Thorne shivered, the warmth of the coffee suddenly insufficient against the chill of a world where the ground could, unimaginably, just... give way. The water kept moving, but somewhere, deep below, he felt the first, terrifying tremor of the shift.
