prompt: |-
  Been meaning to ask this for ages. I finally read the actual excerpts from Wittgenstein's Lectures on Religious Belief (the bit about the Last Judgment) after seeing him namedropped in old LW threads, and it kinda seems like he scooped Yudkowsky's "belief in belief" by something like 70 years. His whole point seems to be that when someone says "I believe in the Last Judgment," they're not making a claim that could turn out true or false the way "there's a dragon in my garage" is - they're not anticipating anything, just using assertion-shaped words. Isn't that basically the same debunking move as the dragon parable: the "belief" doesn't pay rent in anticipated experience, so its not really a belief, just a verbal habit dressed up as one? If so, i don't get why religious philosophers keep citing him like he's sympathetic to faith, instead of just treating him as a politer Carl Sagan. Am I misreading him?
reasoning: |-
  Okay, the user is comparing Wittgenstein's ideas on religious belief with Yudkowsky's "belief in belief" concept. They mention Wittgenstein's Lectures on Religious Belief, specifically the part about the Last Judgment. The user thinks Wittgenstein was saying that religious statements aren't factual claims but more like verbal habits, similar to how Yudkowsky argues that some beliefs don't affect expectations. They're confused about why religious philosophers see Wittgenstein as sympathetic to faith instead of just a polite critic like Carl Sagan.

  First, I need to recall Wittgenstein's main points. He distinguished between empirical and grammatical propositions. For him, religious statements aren't about verifying facts but about the role they play in a person's life. The Last Judgment example shows that a believer's certainty isn't based on evidence but on a framework that shapes their worldview. This is different from Yudkowsky, who focuses on beliefs that don't "pay rent" in experience, implying they're invalid.

  The user might be missing Wittgenstein's emphasis on the functional role of religious language. Where Yudkowsky dismisses non-empirical beliefs, Wittgenstein sees them as part of a different language game with its own rules. Religious philosophers appreciate this because it allows faith to exist without empirical justification, protecting it from scientific criticism.

  The user's deeper need might be understanding why Wittgenstein is cited favorably in religious contexts despite seeming skeptical. They might be seeking clarity on whether religious beliefs can be valid without empirical basis. Also, they might be grappling with reconciling rational critiques of religion with philosophical defenses of faith.

  I should explain the distinction between Wittgenstein's descriptive approach and Yudkowsky's normative stance. Highlighting the context of language games and forms of life shows how Wittgenstein provides a framework where religious beliefs have meaning beyond truth value. Mentioning D.Z. Phillips and other Wittgensteinian philosophers could reinforce this. Emphasizing that Wittgenstein isn't endorsing belief but analyzing its structure might resolve the user's confusion about his sympathy towards faith.
answer: |-
  You've hit on a fascinating and perpetually debated point! Your reading captures a key similarity, but Wittgenstein's position is more nuanced and distinct from Yudkowsky's "belief in belief" critique in ways that explain his appeal to religious philosophers. Here's a breakdown:

  1.  **The Similarity You See (And It's Valid):**
      *   **Non-Empirical Nature:** Both Wittgenstein and Yudkowsky emphasize that core religious statements (like belief in the Last Judgment) don't function like ordinary empirical claims ("there's a dragon in my garage").
      *   **Lack of Falsification/Verification:** Both note that these beliefs aren't held or abandoned based on evidence in the same way scientific or mundane beliefs are. The believer doesn't *anticipate* sensory evidence for the Last Judgment in the way they anticipate seeing their car in the driveway.
      *   **Different Kind of "Assertion":** Both recognize that the *grammar* (the way the words are used) of religious statements differs significantly from factual assertions.

  2.  **The Crucial Difference: Wittgenstein's "Language Games" and "Forms of Life"**
      This is where Wittgenstein diverges sharply from the Yudkowskian/Sagan "debunking" move:
      *   **Not "Not Really a Belief" but "A *Different Kind* of Belief":** Wittgenstein isn't primarily saying religious belief is *invalid* or *meaningless* because it doesn't "pay rent." He's saying it belongs to a **different "language game"** embedded within a **different "form of life."**
      *   **Focus on Use, Not Truth-Conditions:** For Wittgenstein, the *meaning* of words is found in their *use* within a specific context or practice. The meaning of "I believe in the Last Judgment" isn't defined by its correspondence to a future state of affairs (truth-conditions), but by the *role* it plays in the believer's life:
          *   It shapes their *ethical framework* (how they live, what they value, how they face suffering and death).
          *   It provides *absolute certainty* about fundamental matters (unlike tentative empirical hypotheses).
          *   It expresses a *trust* or *commitment* that structures their entire worldview.
      *   **Grammatical vs. Empirical Propositions:** Wittgenstein distinguishes between *empirical propositions* (which describe the world and can be verified/falsified) and *grammatical propositions* (which define the rules of the language game itself). Religious statements often function more like the latter. Saying "I believe in the Last Judgment" is less like stating a fact *within* the world and more like expressing a rule or framework *for* understanding the world and one's place in it. It's akin to the "hinge" propositions in *On Certainty* – foundational assumptions that aren't doubted *within* the game.
      *   **Respecting the Internal Logic:** Wittgenstein urges us to look at *how the belief functions within the religious form of life*. Does it guide action? Does it provide comfort or moral direction? Does it express awe or gratitude? *That* is its meaning. Judging it by the standards of scientific evidence is a *category mistake* – applying the rules of one language game (science/empiricism) to a completely different one (religious faith).

  3.  **Why Religious Philosophers Cite Him Sympathetically:**
      *   **Immunity to Scientific Critique:** Wittgenstein provides a powerful argument that religious belief isn't *meant* to compete with science on scientific turf. Therefore, scientific arguments against the *literal empirical truth* of religious doctrines fundamentally miss the point of what those doctrines *do* and *mean* for believers. It protects faith from being dismissed *solely* on empirical grounds.
      *   **Validation of Religious Experience:** He takes the *reality* of the religious attitude and its profound impact on human life seriously. He's not reducing it to a mistake or a psychological quirk; he's analyzing it as a distinct and meaningful human phenomenon with its own internal logic and significance.
      *   **Focus on Practice and Life:** He shifts the focus away from abstract doctrinal debates about proof and towards the concrete *lived experience* and *practical consequences* of faith. This resonates with theologians and philosophers of religion who emphasize faith as a way of life, not just intellectual assent.
      *   **Descriptive, Not Prescriptive (Initially):** His early analysis (like in the *Lectures*) is primarily *descriptive*. He's trying to understand *how* religious language works, not necessarily to endorse or debunk the beliefs themselves. This descriptive neutrality feels less hostile than a direct debunking like Sagan's or Yudkowsky's.
      *   **Beyond Literalism/Fideism:** He offers a way out of the dead-end between naive literalism (which *is* vulnerable to scientific critique) and pure irrational fideism ("just believe!"). He provides a sophisticated philosophical framework for understanding faith as something other than failed science or blind irrationality.

  4.  **Yudkowsky vs. Wittgenstein: The Core Contrast**
      *   **Yudkowsky ("Belief in Belief"):** Focuses on the *epistemic status*. Beliefs that don't "pay rent" in anticipated experience are *epistemically bankrupt* or *invalid* as knowledge claims. They are mistakes, often sustained by social pressure or self-deception ("belief in belief").
      *   **Wittgenstein:** Focuses on *linguistic function and meaning*. Religious utterances have a different *grammar* and serve a different *purpose* than empirical hypotheses. Judging them by empirical standards misunderstands their meaning. Their validity lies in their role within a form of life, not in their correspondence to empirical facts. He's not primarily calling them bankrupt; he's saying they operate in a different currency.

  **In Summary:**

  You're right that Wittgenstein identified the non-empirical nature of core religious belief decades before Yudkowsky articulated "belief in belief." **However, Wittgenstein wasn't debunking in the same way.** He wasn't saying "this isn't a *real* belief, just verbal noise." He was saying, **"This is a belief of a fundamentally *different category*, playing a different role, governed by different rules, and meaningful within its own context. Applying scientific/empirical criteria to judge its 'truth' is a misunderstanding of its grammar and its place in human life."**

  Religious philosophers cite him sympathetically because he:
  1.  **Rescues faith from scientific reductionism.**
  2.  **Provides a sophisticated philosophical framework** for understanding religious language that isn't literalist or irrationalist.
  3.  **Validates the profound existential and practical significance** of religious belief, regardless of its empirical testability.

  He's not a defender of specific doctrines, but he *is* a defender of the *intelligibility and distinct validity* of the religious form of life and its language games. That's why he's seen as far more than just a "politer Carl Sagan" – he's offering a fundamentally different way to think about the *meaning* of faith. Philosophers like D.Z. Phillips developed this into a full-blown Wittgensteinian philosophy of religion. So, you're not misreading the non-empirical point, but the *conclusion* Wittgenstein draws from it is what makes him uniquely valuable (and controversial) in religious philosophy.
