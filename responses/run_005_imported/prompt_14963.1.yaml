answer: |-
  Your concern cuts to the core of a significant philosophical debate within the accuracy-first program. I will rigorously argue for your claim, present the strongest counterargument (the "alethic immodesty" defense), and explain why it ultimately fails to purge the argument of pragmatic elements.

  ### The Argument: Normative Work Migrates to Scoring Rule Selection
  1.  **The Structure of the Predd et al. Theorem:**
      *   Let $\mathcal{W}$ be a finite set of possible worlds, $\mathcal{F}$ a finite algebra of propositions, and $\mathcal{C}$ the set of all credence functions $c: \mathcal{F} \to [0,1]$. $\mathcal{P} \subset \mathcal{C}$ is the set of *probabilistically coherent* credence functions.
      *   A *scoring rule* $S: \mathcal{C} \times \mathcal{W} \to [0, \infty]$ (or $\mathbb{R}$) measures the inaccuracy of credence $c$ at world $\omega$.
      *   The theorem states: *If $S$ is continuous and strictly proper, then for any incoherent credence function $c_{inc} \in \mathcal{C} \setminus \mathcal{P}$, there exists a coherent credence function $c_{coh} \in \mathcal{P}$ such that $S(c_{coh}, \omega) < S(c_{inc}, \omega)$ for every world $\omega \in \mathcal{W}$.*
      *   The dominance comparison $S(c_{coh}, \omega) < S(c_{inc}, \omega)$ $\forall \omega$ is indeed pointwise, assumption-light (it requires no probabilities, no aggregation), and purely alethic. It compares accuracy *world-by-world*.

  2.  **The Crucial Role of "Strictly Proper":**
      *   **Definition:** $S$ is *strictly proper* if for any two distinct credence functions $c, c' \in \mathcal{C}$, the *expected inaccuracy* of $c'$ relative to $c$ is strictly greater than the expected inaccuracy of $c$ relative to $c$:
          $$\sum_{\omega \in \mathcal{W}} c(\omega) \cdot S(c', \omega) > \sum_{\omega \in \mathcal{W}} c(\omega) \cdot S(c, \omega)$$
          Equivalently, each coherent credence function $c$ *uniquely minimizes* its own expected score: $\underset{c'}{\text{argmin}} \sum_{\omega} c(\omega) S(c', \omega) = c$.
      *   **The Migration of Normative Weight:** The dominance result *only* guarantees that incoherent credences are accuracy-dominated *if* we restrict our attention to scoring rules satisfying strict propriety. The justification for this restriction is therefore doing the critical normative work:
          *   *Pointwise Dominance (PD):* "Credence $c_1$ is more accurate than $c_2$ at $\omega$ iff $S(c_1, \omega) < S(c_2, \omega)$." This seems purely alethic, concerning only fit-to-truth-at-$\omega$.
          *   *Strict Propriety (SP):* "A legitimate scoring rule $S$ must be such that, according to any credence function $c$, reporting $c$ itself uniquely minimizes the *expected inaccuracy* calculated using $c$'s own probabilities." This is explicitly decision-theoretic:
              *   It involves *expectation*: Aggregating inaccuracy scores across *all* possible worlds.
              *   It involves *weighting*: Weighting the score at each world $\omega$ by $c(\omega)$.
              *   It involves *minimization*: Prescribing that the agent *should* choose the option (reporting a credence) that minimizes this weighted sum.
          *   SP is a requirement about how an agent *should evaluate* potential credence functions *from their own epistemic perspective*, balancing the *possibility* of different truths according to their *own beliefs*. This is the core structure of practical decision-making under uncertainty (maximize expected utility, minimize expected loss).

  3.  **The Pragmatic Core of Strict Propriety:**
      *   SP doesn't merely describe how a scoring rule behaves; it *stipulates* what constitutes rational *choice* between reporting different credences *given* an agent's uncertainty. It says: "Given your credences $c$, the *rational* way to choose which credence to report (if you care *only* about accuracy) is to choose the one that minimizes your *expected inaccuracy* relative to $c$." Further, it insists that *honesty* is the uniquely rational policy under this decision rule.
      *   The justification for SP is fundamentally pragmatic: An agent who violates it would be practically irrational *by their own lights*. If an agent with credence $c$ believed some other $c'$ minimized expected inaccuracy *according to $c$ itself*, then, if their sole goal was accuracy, they would be practically compelled to adopt or report $c'$ instead of $c$. SP ensures that an agent's own credence function is *immodest* - it recommends itself as the best (expected accuracy) guide for its own reporting.
      *   **Conclusion on Migration:** The pointwise dominance argument (PD) *under* SP provides a powerful *mathematical link* between coherence and dominance. However, PD alone, applied to arbitrary scoring rules, does not guarantee that incoherent credences are dominated (as Maher showed). SP is the necessary filter that ensures the dominance result holds. Since SP's justification is rooted in the pragmatic norm of maximizing expected accuracy (minimizing expected loss) *from the agent's own perspective*, the normative force of the overall argument for probabilism crucially depends on this pragmatic foundation. The "vindication" is not purely alethic because the class of admissible scoring rules is defined by a decision-theoretic norm.

  ### The Strongest Reply: Alethic Immodesty
  The most sophisticated defense against this charge argues that **immodesty is itself an alethic requirement, not a pragmatic one.** Here's the argument:

  1.  **The Goal is Accuracy:** The accuracy-first program defines epistemic rationality solely in terms of the purely alethic goal of having credences that accurately represent the world.
  2.  **Self-Defeat of Modesty:** Suppose an agent with credence $c$ believed that some alternative credence $c'$ was *more accurate* than $c$ *in expectation according to $c$ itself*. This would mean that, *by $c$'s own assessment of the possibilities and their likelihoods*, $c'$ is expected to get closer to the truth than $c$ does.
  3.  **Alethic Incoherence:** Holding $c$ while simultaneously believing that $c'$ is *expected (by $c$'s lights)* to be more accurate is epistemically self-defeating. It constitutes an *alethic* failing, a disconnect between the agent's doxastic state ($c$) and their own assessment of which state best achieves the purely alethic goal. It's a form of epistemic dissonance where the agent's credence state $c$ judges *itself* to be sub-optimal for achieving the very epistemic goal (accuracy) that justifies having credences in the first place.
  4.  **Immodesty as Alethic Self-Endorsement:** Therefore, for a credence function $c$ to be rationally held, it *must* judge itself to be the best (expected) way to achieve accuracy. Immodesty ($c$ uniquely minimizes its own expected inaccuracy) is not a pragmatic norm about *action* (choosing what to report/bet on), but a constitutive norm of *believing* itself. A credence function that wasn't immodest would undermine its own claim to be aiming at the truth effectively. Strict propriety merely formalizes this constitutive requirement of rational belief for any legitimate measure of accuracy.
  5.  **Purely Alethic Justification:** On this view, SP is justified *only* by the purely alethic goal of accuracy and the avoidance of self-defeat in pursuing that goal. It carries no *distinctly* pragmatic content related to action or decision; it's about the internal coherence of the belief state with respect to the truth-goal.

  ### Why the Alethic Immodesty Reply Fails
  While elegant, this defense does not succeed in purging the accuracy-dominance argument of pragmatic elements. Here's why:

  1.  **Expectation is Inherently Decision-Theoretic:** The core concept of *expectation* $\sum_{\omega} c(\omega) \cdot S(c', \omega)$ is fundamentally a tool for evaluating *prospects* under uncertainty. It weighs the value (or disvalue, like inaccuracy) of outcomes ($S(c', \omega)$) by their subjective probability ($c(\omega)$). This is the *definition* of calculating expected utility (or disutility). Insisting that an agent *must* use this calculation to evaluate their own or other credence functions *for the purpose of determining which one best pursues the accuracy goal* directly imports the normative framework of decision theory into the heart of epistemology. The alethic immodesty argument relies on the *normative force* of expected value calculation applied to epistemic goods.
  2.  **Minimization Prescribes a Choice:** The immodesty requirement states that $c$ must be the *uniquely best* option *according to the expected score calculation*. The language of "best option," "minimization," and "uniquely recommends" frames the evaluation in terms of *comparing and choosing* between alternatives. This is the language of practical rationality. Even if the "choice" is hypothetical (e.g., "which credence function should you *endorse* as best?"), the normative structure is that of optimizing under uncertainty – the domain of decision theory.
  3.  **The "Self-Defeat" is Pragmatic at its Core:** The alleged "alethic self-defeat" of modesty relies on interpreting the *expected accuracy* assessment as a decisive reason to *adopt* the credence function deemed more accurate. The argument states that holding $c$ while believing $c'$ is expected-more-accurate (by $c$'s lights) is irrational *because* the agent *should* adopt $c'$ instead. This "should" is a practical "should" – it's about what the agent *ought to do* (change their beliefs) based on their assessment of expected outcomes. If the expected accuracy assessment didn't generate a practical obligation to adopt the credence with better expected accuracy, then there would be no "self-defeat" in holding a modest credence. The normative force driving the immodesty requirement stems from the principle that one *ought to act* (or believe) so as to maximize expected achievement of one's goals – a core principle of practical, not purely alethic, rationality.
  4.  **Contrast with Pure Pointwise Dominance:** The pointwise dominance condition (PD) avoids these pragmatic elements. It makes no reference to expectations, probabilities, weighting, minimization of aggregates, or choices between options based on uncertainty. It simply compares two credences at a single, specified world. SP, in contrast, is saturated with these decision-theoretic elements. The alethic immodesty argument tries to mask this by claiming the decision-theoretic elements are internal to the belief state's coherence with its goal, but it cannot change the nature of the concepts employed (expectation, minimization) or the source of the normative obligation (avoiding self-defeat construed as generating an obligation to *change* beliefs based on expected outcomes).
  5.  **Historical and Conceptual Context:** Joyce and others explicitly developed accuracy arguments as epistemic analogs of decision-theoretic dominance arguments. The very structure of scoring rules and propriety conditions was borrowed directly from the theory of proper scoring rules in statistics and economics, which were designed explicitly to elicit honest judgments by aligning incentives via expected utility maximization. The conceptual DNA of the accuracy-first program is intertwined with decision theory.

  **Conclusion:** Your physicist's intuition is correct. The Predd et al. theorem is mathematically compelling: *if* we use continuous strictly proper scoring rules, *then* incoherent credences are accuracy-dominated. However, the justification for restricting scoring rules to the strictly proper ones hinges on the immodesty requirement. While proponents offer the "alethic immodesty" argument as a purely epistemic justification, this argument covertly relies on the normative force of expected utility maximization – the core principle of practical decision-making under uncertainty. The concepts of expectation, weighting possibilities, and minimizing an expected loss are inherently decision-theoretic. The obligation to avoid "self-defeat" translates into an obligation to *choose* the credence with best expected accuracy, importing a pragmatic norm. Consequently, the accuracy-dominance argument, for all its elegance and avoidance of Dutch Books, ultimately fails to provide a vindication of probabilism that is truly independent of pragmatic, decision-theoretic assumptions about how to weigh possibilities against one another in the pursuit of epistemic goals. The normative work resides firmly in the prior, pragmatically justified, selection of the scoring rule.
