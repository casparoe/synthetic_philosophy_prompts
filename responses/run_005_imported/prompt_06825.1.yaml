answer: |-
  Here's a toast that honors Priya's character through the lens of her own nuanced virtue ethics, avoiding naive cross-situational generalizations while remaining warm, accessible, and wedding-appropriate:

  **(Clink glass gently)** Friends, family, colleagues… Priya. [Warm smile] It’s a profound joy to stand here celebrating Priya and [Partner's Name]. As one of Priya’s fellow philosophy travelers, I’ve been asked to say a few words. Now, anyone who knows Priya knows her mind is razor-sharp, especially when it comes to understanding *character* – what makes us who we are, how we act. And let’s be honest, [glance at philosophers], some of us in this room have spent *weeks* arguing about just that! [Light chuckle]

  But a wedding isn’t a seminar. So, while Priya might dissect the finer points of moral psychology over brunch, today calls for something simpler: celebrating the remarkable person she is, and the love she and [Partner's Name] share.

  So, how do you praise someone who has dedicated serious thought to the idea that people aren’t just one simple, unchanging ‘thing’? That our goodness isn’t some static statue, but something… more responsive? More attuned? Priya’s own brilliant work reminds us that true character isn’t about being identically ‘virtuous’ in every single moment, regardless of context. It’s not about being predictably the *same* person when you’re grading papers at 2 AM versus celebrating your best friend’s birthday versus… well, getting married! [Warm smile at Priya & Partner]

  What Priya understands, and what her life demonstrates so beautifully, is that **real strength of character lies in *perceptiveness* and *responsiveness***. It’s about **seeing what *this* situation, *this* moment, *this* person actually needs**, and having the wisdom and the heart to meet it.

  Think about Priya. She isn’t ‘generous’ in some abstract, always-the-same-way sense. **Her generosity is perceptive.** She sees the subtle cue – the tired classmate needing a coffee, the friend hesitating to ask for help moving, the unexpected opening for a kind word when someone feels vulnerable. She doesn’t just perform generosity; she *sees* the need for it, often before the rest of us do.

  She isn’t ‘courageous’ in a vacuum. **Her courage is responsive.** It emerges when the situation demands it – speaking up for a student unfairly treated, defending a complex idea against oversimplification, or simply having the bravery to be fully herself, authentically, right here, committing to this incredible partnership. Her courage isn't a blunt instrument; it's precisely applied where it matters.

  And her kindness? It’s not a uniform blanket. **Her kindness is discerning.** She knows when a friend needs firm advice, when they need gentle listening, or when they just need someone to sit with them in comfortable silence. She reads the room, she reads the person, and she responds *fittingly*. That’s not inconsistency; that’s *depth*. That’s the practical wisdom she champions.

  This perceptiveness, this responsiveness, this ability to truly *attend* to the specific demands of the moment – that’s the core of who Priya is. It’s why she’s such an incredible friend, scholar, and now, partner. She doesn’t bring a pre-written script to life; she brings deep attention and a commitment to doing what’s right *here and now*.

  And that, perhaps, is the most beautiful foundation for a marriage. Because life together isn’t one static situation. It’s a million changing moments – joys, challenges, quiet mornings, big decisions, tiny gestures. A strong marriage needs partners who can *see* each other, truly see the person in front of them as they are *in this moment*. Partners who can *respond* with love, support, humor, and patience tailored to what’s actually needed, not just what’s habitually offered.

  Priya, your profound understanding of character – that it’s woven from attentiveness and wise response – isn’t just academic. You *live* it. And [Partner's Name], seeing how you two move together, it’s clear you share this deep, situationally-aware love. You perceive each other. You respond to each other. You build something beautiful not on rigid ideas, but on the dynamic, attentive reality of your life together.

  So, let’s raise our glasses. **Not to Priya being the same person in every situation, but to her being the *right* person, the *perceptive* person, the *responsive* person, precisely when and where it matters most. And to [Partner's Name], whose own perceptive love meets hers so perfectly.** To a marriage built on seeing deeply, responding wisely, and loving attentively through all of life’s ever-changing moments. To Priya and [Partner's Name]!

  **Key elements & why they work:**

  1.  **Avoids Global Traits:** Explicitly rejects the "same in every situation" language Priya dislikes ("not about being identically virtuous," "not a uniform blanket").
  2.  **Highlights Local/Cue-Sensitive Traits:** Focuses on *how* Priya's virtues manifest: "perceptive generosity," "responsive courage," "discerning kindness." These are *defined* by their sensitivity to context.
  3.  **Centers Practical Wisdom (Phronesis):** Emphasizes "perceptiveness," "responsiveness," "seeing what *this* situation needs," "wise response," "attentiveness," "discernment." This is the Aristotelian core Priya defends against situationism.
  4.  **Uses Accessible Language:** Explains concepts like perceptiveness and responsiveness without jargon ("sees the subtle cue," "reads the room," "responds *fittingly*," "tailored to what's actually needed"). Non-philosophers understand these as positive qualities.
  5.  **Connects to Marriage:** Explicitly links this nuanced view of character to the practical demands of a lasting partnership ("needs partners who can *see* each other," "respond with love... tailored," "dynamic, attentive reality").
  6.  **Acknowledges the Philosophy Lightly:** Mentions her work ("dedicated serious thought," "her own brilliant work," "the practical wisdom she champions") enough for the philosophers to appreciate the in-joke and the care taken, but keeps it brief and integrated into the praise. The "weeks arguing" line acknowledges the audience split humorously.
  7.  **Structure is Classic Toast:** Opening address, warm introduction, personal praise (structured around key qualities), connection to the couple/relationship, heartfelt conclusion, and a clear call to toast.
  8.  **Tone is Warm & Celebratory:** Uses affectionate language ("remarkable person," "incredible friend," "beautiful foundation," "profound understanding"), smiles, and direct address to the couple. The philosophical constraint shapes the *content* of the praise, not the *feeling*.

  This toast praises Priya deeply as a person of exceptional character, but does so precisely in the terms her own philosophical work validates – celebrating her situational perceptiveness and responsive virtue, making it a tribute she (and her philosopher guests) can genuinely endorse.
