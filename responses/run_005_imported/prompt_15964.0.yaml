    "theorem_and_assumptions": {"score": <points>, "out_of": 6, "comments": "..."},
    "utilitarian_interpretation": {"score": <points>, "out_of": 4, "comments": "..."},
    "objection": {"score": <points>, "out_of": 5, "comments": "..."},
    "total": {"score": <points>, "out_of": 15},
    "rough_letter_equivalent": "..."
  }
  ```
