answer: |-
  ## Memorandum for the Esteemed Partners of MacNaughton & Co.  
  *Regarding the Petition Circulated by the Guild Deacons*  
  **From: A. Corbie, Junior Clerk**  
  **Dated: 14th October, 1759**

  Honoured Sirs,

  In obedience to your command, I have diligently examined the Petition proposed by the Guild Deacons for submission to the Convention of Royal Burghs, urging stricter penalties against the export of coin and higher duties on imported manufactures. Their stated fear is the exhaustion of the nation's "treasure" through an unfavourable balance of trade. Having applied the principles gleaned from Mr. David Hume's discourses on money and commerce – which I have studied these past two years at your generous indulgence – I humbly submit this analysis and my recommendation, offered with proper deference to your superior experience.

  **On the Nature of "Treasure" and the Balance of Trade:**

  The Deacons proceed upon a common, yet fundamentally mistaken, premise: that the accumulation of gold and silver coin *is* the accumulation of wealth itself. Mr. Hume demonstrates, with compelling force, that **money is not wealth, but merely its instrument; the oil that lubricates the wheels of commerce.** True wealth resides in the productive capacity of the nation – its lands, its industries, the skill of its people, and the goods they produce for consumption and exchange.

  The fear of an "unfavourable balance" draining our specie rests on a misunderstanding of a natural mechanism. When coin flows out to pay for imports exceeding exports, **this very outflow sets in motion its own correction.** As coin becomes scarcer within Scotland, prices for our goods and labour *must* fall relative to those in England and the Continent. This cheaper state renders our exports more competitive abroad and makes foreign imports dearer at home. Demand for our goods will consequently rise abroad, demand for theirs will fall here, and the flow of coin will reverse. This **"Price-Specie Flow"** (as the mechanism might be termed) operates constantly, like the tides, tending always towards an equilibrium. Artificially hoarding coin through harsh penalties disrupts this vital adjustment, like damming a river – it may create a stagnant pool briefly, but the pressure builds, and the eventual release may be destructive.

  **On Interest Rates and Manufactures:**

  The Deacons likely fear that the loss of coin will raise interest rates, choking credit and stifling industry. Mr. Hume addresses this directly: **"High interest arises from *three* circumstances: A great demand for borrowing; little riches to supply that demand; and great profits arising from commerce."** The sheer quantity of coin is secondary. A nation buzzing with industrious people and profitable ventures will attract capital, even if some coin flows out temporarily. Raising duties on imported manufactures, as proposed, would *increase* the cost of essential materials and finished goods for our own artisans and populace, hindering their productivity and *reducing* the very profits that make borrowing attractive. It would make Scotland *less* competitive, not more.

  **On the Prosperity of Neighbours:**

  There is an unspoken assumption in the Petition that England's gain must be Scotland's loss. Mr. Hume powerfully refutes this "jealousy of trade." **"The increase of riches and commerce in any one nation... instead of hurting, commonly promotes the riches and commerce of all its neighbours."** A prosperous England creates a wealthier market for our tobacco, linen, and other goods. Their demand fuels our production. Attempts to beggar our neighbour through restriction ultimately beggar ourselves by shrinking the market upon which our own prosperity depends. Free commerce, though it may cause temporary fluxes in coin, enlarges the common stock of wealth.

  **Addressing the Core Concern: The Pain of Adjustment**

  With profound respect, Honoured Sirs, I anticipate your strongest objection: *Even if this mechanism corrects itself eventually, what of the damage wrought in the interim?* If coin grows scarce, credit *may* tighten for a time. Some workmen *may* face reduced hours or even idleness while prices adjust and demand shifts. **This is a serious consideration, which Mr. Hume's framework acknowledges but does not trivialise.**

  However, the Petition's remedies – stricter penalties on exporting coin and higher import duties – are not the cure for this temporary pain; they are likely to *prolong* and *worsen* it. Penalties on coin export will not stop the underlying imbalance; they will merely drive the trade underground or into less efficient channels (like barter), increasing transaction costs and creating uncertainty that chills commerce far more effectively than a natural, if uncomfortable, price adjustment. Higher duties on imports raise costs for our own manufacturers and consumers, dampening domestic demand precisely when it needs to be nurtured. They invite retaliation, shrinking our export markets further. The cure is thus more debilitating than the disease.

  **Recommendation:**

  Therefore, Honoured Sirs, I must respectfully but firmly advise **against** adding MacNaughton & Co.'s signature to the Petition in its current form. Its foundational premises are flawed, its proposed remedies would exacerbate the very problems it seeks to solve, and it runs counter to the natural laws of commerce elucidated by Mr. Hume.

  *   **Signing** would endorse policies harmful to Scotland's long-term prosperity and to the free flow of trade upon which our house, and Glasgow itself, depend.
  *   **Refusing** aligns with sound economic principle and the true interests of a trading nation.

  **If Amendment is Sought (Though Not Recommended):**

  Should you feel compelled by civic duty to offer constructive engagement, the *only* conceivable amendment worth proposing (though I fear it would find little favour with the Deacons) would be to strike *all* references to restricting coin export and raising import duties, and instead petition the Convention to focus on **removing domestic barriers to industry and improving the infrastructure** (roads, harbours) that genuinely enhance our competitive position. This addresses the root of wealth – productivity – rather than the symptom – specie flow. However, the Petition's core intent is so fundamentally mercantilist that such an amendment would likely render it unrecognisable to its authors.

  **Conclusion:**

  The Deacons act from a genuine, if misplaced, concern for the burghs. However, their prescription is a relic of an older, discredited view of commerce. The outflow of coin is not a haemorrhage of wealth, but a signal – and the catalyst for its own correction. To shackle this process is to shackle Scotland's potential. I urge you to decline signing, confident that this position, though perhaps counter to current anxieties, best serves the enduring interests of MacNaughton & Co. and the wider prosperity of our nation. I remain, as ever, your humble and obedient servant,

  **A. Corbie**

  ---

  **Notes for Your Novel Context:**

  1.  **Voice:** Aimed for formal 18th-century business prose: passive constructions ("it is humbly submitted"), deferential phrasing ("with proper deference," "Honoured Sirs"), period terms ("specie," "manufactures," "burghs"), and logical connectors ("Therefore," "However," "Consequently"). Avoided overly flowery language, keeping it practical for a merchant house memo.
  2.  **Hume Integration:** Explicitly named key Humean concepts (money as instrument, price-specie flow mechanism, causes of interest rates, jealousy of trade refutation) and applied them directly to the Petition's points (fear of specie drain, unfavourable balance, neighbour's prosperity) without just saying "Hume says no."
  3.  **Concession:** Directly addressed the "timing/pain" counterargument the partners might raise, acknowledging it as serious within Hume's framework, and argued why the Petition's remedies make it *worse*.
  4.  **Clear Recommendation:** Unequivocally states "Refuse to Sign." Offers a theoretical amendment path purely to show engagement, while clearly signalling its impracticality.
  5.  **Clerk's Character:** Shows confidence in his analysis (rooted in his study) but maintains appropriate humility ("humble servant," "deference," anticipating the masters' counter). He's convinced by Hume, but frames it as serving the *house's* interests and Scotland's true prosperity.
  6.  **Specificity:** References Glasgow's role ("our tobacco"), the Convention of Royal Burghs, and the specific policies (penalties on export, duties on imports).

  This memo provides a solid, historically plausible argument rooted in Hume's economics for your protagonist to deliver, driving the plot forward as his masters consider this unconventional advice. Good luck with the scene!
