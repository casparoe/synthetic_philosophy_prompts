prompt: |-
  So I'm a bioethics PhD student, and as part of my fellowship I sit in (non-voting, but I still draft the paperwork) on my hospital's neuromodulation ethics subcommittee. We've got a phase-1 proposal to implant DBS electrodes in reward circuitry (medial forebrain bundle/nucleus accumbens) for treatment-resistant depression, but unlike the usual closed-loop designs, patients get a handheld trigger for on-demand self-stimulation, plus the ability to tweak their own intensity within a set range at home. Half the subcommittee says this is basically wireheading with a medical license -- they point to the old self-stimulation literature and worry that letting patients adjust their own settings just invites them to tamper around whatever safety limits we set. The other half says refusing real relief over squeamishness about "authenticity" is paternalism dressed up as philosophy, no different in kind then letting people self-medicate their reward systems with coffee or SSRIs. I need a short decision memo for thursday's meeting -- approve, reject, or approve w/ conditions -- that actually engages the strongest version of whichever side it rejects instead of just waving it off. can you draft it?
