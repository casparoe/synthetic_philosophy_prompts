answer: |-
  You're absolutely right to feel perplexed – omissions *do* fit neatly into the basic counterfactual dependence framework at a surface level. Your intuition that "if the gardener had watered it, it wouldn't have died" seems like a straightforward instance of counterfactual dependence is correct. The reason omissions become a deep puzzle isn't that they *don't* fit, but that they fit *too well*, exposing fundamental issues in the counterfactual theory itself. Your advisor's mention of "profligacy" is the key. Here's the breakdown of the genuine problems:

  1.  **The Profligacy Problem (Too Many Causes):** This is the core issue hinted at by your advisor. Counterfactual dependence identifies *necessary conditions* under the circumstances. The plant's death counterfactually depends on *far more* than just the gardener's omission.
      *   "If the neighbor had watered it (even though she wasn't supposed to), it wouldn't have died." → Neighbor's omission is a cause?
      *   "If it had rained, it wouldn't have died." → The absence of rain is a cause?
      *   "If a passing bird had dropped water, it wouldn't have died." → Absence of bird-dropping-water is a cause?
      *   "If the plant wasn't photosynthetically dependent on water, it wouldn't have died." → Absence of water-independence is a cause?
      *   Ad infinitum... Every condition whose presence would have prevented the death becomes a cause via its absence.

      **The Problem:** The counterfactual theory, applied naively to omissions, yields an explosion of causes for every event. This violates strong intuitions about causation being *selective* and *explanatorily relevant*. We intuitively want to say *only* the gardener's omission (or perhaps a few salient omissions) is *the* cause, not the absence of rain, the neighbor's inaction, the bird's non-intervention, etc. The theory provides no inherent way to distinguish the "real" cause from the irrelevant necessary conditions. This is the "profligacy" your advisor mentioned – the theory is too promiscuous in assigning causes.

  2.  **The Ontological Problem (Causing with Nothing):** Traditional causal relata (especially in event-based theories like Lewis's early work) are *events* – concrete happenings in space and time. Omissions/absences are *not* events. They are the *lack* of an event. How can *nothing* (the lack of watering) *do* something (cause death)? This challenges the metaphysical foundations of causation.
      *   Lewis himself wrestled with this. In "Void and Object" he proposed treating absences as "quasi-events" or analyzing causation in terms of *causal influence* (patterns of counterfactual dependence), which *can* involve absences. But this move feels ad hoc to many and blurs the line between causation proper and mere counterfactual dependence.

  3.  **The Problem of Causal Asymmetry:** Causation is asymmetric (causes precede effects, effects don't cause causes). Counterfactual dependence *can* be symmetric (e.g., in cases of mutual dependence). While omissions themselves don't typically introduce symmetry, the profligacy problem interacts with asymmetry. Why is the gardener's omission a cause *of* the death, but the death isn't a cause *of* the gardener's omission? The counterfactual "If the plant hadn't died, the gardener would have watered it" is likely false (the death is evidence of omission, not the cause). But the theory needs to explain *why* this asymmetry holds for omissions just as it does for positive events. Profligacy makes this harder.

  4.  **The Normativity/Context Problem (What "Counts"?):** Why do we intuitively pick out the *gardener's* omission and not the neighbor's or the absence of rain? This seems heavily dependent on *normative* expectations (the gardener had a *duty* to water) and *pragmatic context* (we are interested in assigning responsibility). This creates tension:
      *   **Descriptive vs. Normative:** A theory of causation is usually seen as descriptive – about how the world *is*. But distinguishing "relevant" omission causes seems to require importing normative/pragmatic elements (duties, interests) *into the definition of causation itself*. Should causation depend on what someone *should* have done?
      *   **Context Sensitivity:** What counts as *the* cause seems context-dependent. In a negligence lawsuit, the gardener's omission is crucial. In a botany lecture about plant physiology, the absence of water is the key factor, regardless of duty. The counterfactual theory, by identifying all necessary condition absences, doesn't capture this context sensitivity *within* the causal relation; it pushes it into the background of "explanation" or "responsibility."

  **Why "Quasi-Causation" (Dowe) or Normative Filters (Beebee, Schaffer)?**

  These are responses to the problems above, *especially* profligacy:

  *   **Dowe's Quasi-Causation:** Dowe (a process theorist) argues that *genuine* causation requires a spatiotemporally continuous process of conserved quantity transfer (e.g., energy/momentum). Omissions involve no such process. The counterfactual dependence in omission cases is real and important, but it's *not* genuine causation – it's "quasi-causation." This solves the ontology and profligacy problems by drawing a sharp line, but at the cost of denying that omissions are causes at all, which clashes with strong intuitions and legal/practical discourse.
  *   **Normative/Contextual Filters (Beebee, Schaffer, others):** To handle profligacy and context sensitivity, some argue we need to add a filter. We start with the vast set of counterfactual dependencies (including all omissions). Then, we filter for the causes that are *salient* or *relevant* based on normative expectations (who had a duty?), explanatory interests (what are we trying to explain?), or default/violation contrasts (watering was the default expected state). This preserves the intuition that omissions *are* causes but tries to tame the profligacy. However, it explicitly makes causation depend on non-worldly factors like interests and norms.

  **Conclusion: What You're Missing (and Why It's a Puzzle)**

  You're absolutely correct that the basic counterfactual dependence *holds* for omissions like the gardener case. **The puzzle isn't that omissions *don't* fit the counterfactual mold; it's that they fit it *too perfectly*, revealing that the mold itself, when applied unrestrictedly, produces an absurdly vast and ontologically dubious set of causes (profligacy).** This forces counterfactual theorists into a dilemma:

  1.  **Bite the Bullet (Radical Profligacy):** Accept that the absence of *every* possible preventing condition is a cause. This is metaphysically extravagant and explanatorily useless.
  2.  **Modify the Theory:** Add apparatus (like causal processes or normative/contextual filters) to restrict which counterfactual dependencies count as causation. This solves profligacy but makes causation either non-fundamental (dependent on processes) or non-purely-descriptive (dependent on norms/interests).
  3.  **Deny Omissions are Causes (Quasi-Causation):** Deny the intuition that omissions are genuine causes, relegating them to a different category. This preserves a cleaner metaphysics but clashes powerfully with common sense and practice.

  **So, is it philosophers being fussy?** Not really. It's philosophers grappling with the uncomfortable consequences of an elegant theory when pushed to its limits. The gardener case *is* handled "fine" by the basic counterfactual in isolation. The problem arises when you see that *this very handling* implies that *countless* other absences are equally causes of the same event. That's the substantive problem your advisor was gesturing towards with "profligacy." Omissions are the canary in the coal mine for the counterfactual theory's tendency to overgenerate causes. Tackling the profligacy literature (like Schaffer's "Trumping" or "Overdetermination" papers, or Hall's work) is indeed the next step to see the full scope of the issue. Good luck with the reading!
