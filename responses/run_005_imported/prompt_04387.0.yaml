  The main problem might be overdetermination. In the gardener case, the plant's death depends counterfactually on the gardener not watering it. But it also depends on countless other absences: if it had rained, if a neighbor had watered it, etc. So there are multiple necessary conditions, each sufficient on their own to prevent death. This leads to too many causes, which is the profligacy problem their advisor hinted at.

  Next, the ontological concern. Events are typically concrete occurrences, but omissions are absences. How can something non-existent be a cause? Counterfactual theories might not require causal relata to be events, but this challenges traditional metaphysics. Lewis tried to address this with causal influence, but it's messy.

  Then there's the asymmetry issue. If omissions are causes, then not watering causes death, but also, not preventing not-watering causes death, leading to an infinite regress. Also, normative concerns: we blame the gardener but not the neighbor because of duties, but causation should be descriptive, not normative. This blurs the line between causation and responsibility.

