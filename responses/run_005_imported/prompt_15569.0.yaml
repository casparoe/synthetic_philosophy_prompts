prompt: |-
  I'm reporting on the long-running debate over whether insurers should be permitted to see the results of predictive genetic tests, and I think I've come across the detail that settles it. I.J. Good's 1967 theorem on the value of information establishes, as a matter of Bayesian decision theory, that a rational agent's expected utility can never be lowered by learning a relevant, cost-free piece of evidence before acting on it — the expected value of information, in the jargon, is always non-negative. If that's a genuine mathematical result, then any rule barring insurers or applicants from using genetic information would seem to make the resulting contracts strictly less accurate, and therefore less efficient, whatever the equity case for such rules might be. Yet plenty of serious economists and bioethicists argue that restricting this information can leave everyone, including future policyholders, better off. Have I missed some wrinkle in how Good's theorem applies to a case like this, or are these economists really just setting aside a settled piece of decision theory for political reasons?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're reporting on the debate about insurers accessing predictive genetic test results. They mention I.J. Good's 1967 theorem, which states that a rational agent's expected utility never decreases when they receive free, relevant information. The user thinks this theorem settles the argument in favor of insurers using genetic data. But they note that many economists and bioethicists disagree, arguing that restrictions can benefit everyone. The user wonders if they've missed something in applying Good's theorem or if the opposition is ignoring the theory for political reasons.

  First, I need to recall Good's theorem accurately. It's a Bayesian decision theory principle: more information shouldn't hurt a rational agent. But the key here is the context. Insurance isn't a single-agent scenario; it's a market with multiple players and long-term dynamics. Good's theorem assumes a fixed decision problem, but insurance markets are dynamic. Adverse selection is a big factor—if insurers use genetic data, high-risk individuals might be priced out, leading to market collapse. That's a collective action problem, not covered by Good's individual-focused theorem.

  Then there's the issue of information asymmetry. If applicants know their genetic risks but insurers don't, applicants might buy more coverage if they're high-risk, which insurers can't price accurately. This skews the risk pool. Good's theorem doesn't account for such strategic behaviors. Also, if insurers have the data, applicants might avoid testing altogether due to fear of discrimination, leading to less information for everyone. That's a perverse outcome where information access reduces overall knowledge.

  Another point is the impact on testing uptake. If people avoid tests to prevent insurance issues, they miss out on early interventions. Public health suffers, increasing costs long-term. Good's theorem is about immediate utility, not societal health outcomes. Plus, the theorem assumes rational actors, but real people might not act rationally due to fear or misinformation.

  Ethically, there's a difference between individual and systemic utility. Good's theorem applies to one agent, but insurance regulations affect groups. If high-risk individuals can't get coverage, their utility drops, and society bears the cost through public health systems. So, restricting genetic data might improve average utility across the population, aligning with utilitarian ethics.

  The user might be missing these systemic interactions. They're applying a micro-level theorem to a macro-level problem. Also, the theorem assumes cost-free information, but here, the cost is social and long-term. The economists arguing for restrictions likely consider these broader factors, not just decision theory. It's not about ignoring Good's work but understanding its limits in complex systems. The user needs to recognize that while Good's theorem is mathematically sound, its real-world application in insurance markets involves variables the theorem doesn't cover.
answer: |-
  You've hit upon a fascinating and crucial tension at the intersection of decision theory, economics, and ethics. Good's theorem is indeed a powerful and mathematically sound result **within its specific framework**, but applying it directly to the complex, multi-party, dynamic, and strategic environment of insurance markets requires careful consideration. The economists and bioethicists arguing for restrictions aren't necessarily ignoring or setting aside Good's theorem for political reasons; they are grappling with realities that extend beyond the theorem's core assumptions.

  Here's a breakdown of the wrinkles you might be missing:

  1.  **The "Rational Agent" Assumption & Strategic Behavior:**
      *   Good's theorem assumes a *single* rational agent making a decision *for themselves* based on new information.
      *   Insurance is a *market* involving *multiple agents* (insurers, applicants, potential future applicants) with potentially *conflicting interests* and *strategic behavior*.
      *   **Applicant Behavior:** If insurers use genetic information, applicants *know* this. High-risk individuals, rationally anticipating higher premiums or denial, may be *more* likely to seek large policies ("adverse selection"). Low-risk individuals, rationally anticipating lower premiums elsewhere if their risk is known, may shop around or drop coverage. This strategic behavior fundamentally alters the risk pool in ways detrimental to the market's stability and efficiency.

  2.  **The "Fixed Action Set" and "Fixed World" Assumption:**
      *   Good's theorem assumes the agent learns information and then chooses an action from a fixed set in a fixed world. The information doesn't change the available actions or the state of the world itself.
      *   **Impact on Testing Uptake:** If insurers have access to predictive genetic test results, individuals *rationally* avoid taking these tests due to fear of insurance discrimination ("genetic deterrence"). This means:
          *   **Less Information Overall:** Crucial health information that could lead to preventative care or early treatment (benefiting both individual and potentially reducing *overall* healthcare/insurance costs) is never generated. This directly *reduces* the total information available in the system, counteracting the "more information is better" premise.
          *   **Worsened Adverse Selection:** Individuals who suspect they are high-risk (e.g., family history) but avoid testing *still* know they are likely high-risk and are more likely to buy insurance, while low-risk individuals feel no such pressure. The insurer lacks the *objective* genetic data to price this hidden risk accurately, leading to inefficiency.

  3.  **Dynamic Effects and Market Sustainability:**
      *   Good's theorem is static: one piece of info, one decision.
      *   **Death Spiral Risk:** Widespread use of genetic information can trigger an insurance "death spiral":
          1.  Insurers charge high premiums to known high-risk individuals.
          2.  Many high-risk individuals cannot afford coverage and drop out.
          3.  Low-risk individuals, seeing the average risk/pool cost hasn't dropped enough (or seeing they are now identified as "medium-risk" relative to the remaining pool), may also drop out or seek coverage elsewhere.
          4.  The risk pool deteriorates, premiums rise further, driving out more people, potentially collapsing the market for certain types of coverage.
      *   **Future Policyholders:** Restrictions can prevent this spiral, ensuring a larger, more stable, and sustainable risk pool *for future applicants*. While an insurer *today* might gain utility from knowing an applicant's genetic risk (per Good), the *system* might collapse tomorrow, leaving *future* applicants (including those identified as low-risk) worse off with no available or affordable coverage. This long-term, systemic efficiency isn't captured by Good's single-decision framework.

  4.  **Distinction Between Individual Insurer Utility and Social Welfare:**
      *   Good's theorem focuses on the expected utility of the *agent receiving the information* (the insurer making the underwriting decision).
      *   **Externalities:** The insurer's decision (premium, denial) based on genetic information imposes significant costs (externalities) on the applicant (financial hardship, psychological distress, lack of coverage) and potentially on society (increased burden on public health systems, loss of productivity, reduced uptake of beneficial genetic medicine). Restrictions aim to internalize these externalities.
      *   **Utilitarian Perspective:** Even within a purely utilitarian framework, the *aggregate* utility of applicants + insurers + society *might* be higher under a restriction regime that prevents deterrence, encourages prevention, and maintains a broad risk pool, compared to a regime where insurers use genetic data, even though each *individual insurer decision* might seem utility-maximizing in isolation per Good.

  5.  **The Nature of "Relevance" and Actuarial Fairness vs. Social Contract:**
      *   While genetic information is undoubtedly "relevant" to risk prediction (satisfying Good's condition), the insurance model isn't just about perfect actuarial fairness. It relies on a degree of cross-subsidization within risk pools and often functions within a broader societal understanding of a "social good" or necessity (especially for basic health/life coverage). Allowing genetic information can undermine this social contract aspect, leading to outcomes society deems inequitable and inefficient in the broader sense.

  **Conclusion:**

  You haven't fundamentally misunderstood Good's theorem. It *is* a genuine mathematical result. **The key point is that its assumptions (single rational agent, fixed action set/world, no strategic behavior by others, no impact on information generation) do not hold in the complex, multi-period, strategic environment of insurance markets involving sensitive genetic information.**

  The economists and bioethicists arguing for restrictions are likely focusing on:

  *   **Strategic Responses:** How applicant behavior *changes* in response to insurer access to genetic data (adverse selection, deterrence).
  *   **Dynamic Market Effects:** The potential for death spirals and market failure undermining long-term efficiency and availability.
  *   **Information Generation:** How insurer access *reduces* the total amount of valuable health information generated.
  *   **Externalities and Social Welfare:** The broader societal costs and benefits beyond the immediate insurer's underwriting profit.

  They are arguing that in this specific context, **restricting information flow can paradoxically lead to a *more* efficient outcome *overall* and *in the long run*** by preventing adverse selection spirals, encouraging beneficial testing and prevention, and preserving a sustainable insurance market for everyone. This doesn't invalidate Good's theorem; it highlights the critical importance of context and system dynamics when applying theoretical results to messy real-world policy problems. The debate hinges on whether these dynamic, strategic, and societal effects outweigh the static efficiency gain for insurers predicted by Good's theorem in isolation.
