answer: |-
  Your brother-in-law's argument is a classic application of revealed preference theory (RPT), but it rests on assumptions that are both powerful and deeply contested. Amartya Sen's distinction is indeed central to the critique. Here's a breakdown of the implications, objections, and the state of the argument regarding self-sacrifice:

  **I. Revealed Preference Theory (RPT): Core Tenets & Implications**

  1.  **Definition:** RPT, pioneered by Paul Samuelson, starts from observable choices. It argues that an individual's preferences are *revealed* by their actions in specific choice situations. If you choose bundle A over bundle B, you reveal a preference for A over B.
  2.  **Utility as Representation:** Utility is *defined* as a numerical representation of these revealed preferences. Saying "A provides more utility than B" is synonymous with "A is revealed preferred to B." Utility isn't an independent psychological state; it's a mathematical construct derived from choices.
  3.  **The Brother-in-Law's Argument (The RPT Tautology):**
      *   You chose Nonprofit (N) over Consulting (C).
      *   Therefore, you revealed a preference for N over C.
      *   Therefore, N provided higher utility *for you* than C.
      *   "Utility" here encompasses *everything* you value: salary, meaning, work-life balance, moral satisfaction, aversion to guilt, status within your family/community, personal identity, leisure, future prospects, etc.
      *   **Conclusion:** Your choice maximized your utility *given your complete set of preferences*. Ergo, it cannot be self-sacrificing. Sacrifice implies forgoing something valued *for the sake of others*, but RPT subsumes the "for the sake of others" motive into your utility function.

  **II. The Challenge: Does RPT Make Self-Sacrifice Impossible by Definition?**

  RPT, strictly applied, *does* seem to make self-sacrifice conceptually impossible *within its own framework*. Any choice, by definition, reveals the chosen option as utility-maximizing. This leads to:

  1.  **The Tautology Problem:** RPT risks being an unfalsifiable tautology. "Why did you choose N?" "Because it maximized utility." "How do you know it maximized utility?" "Because you chose it." It explains everything and predicts nothing new about *why* something was chosen, only *that* it was preferred in that context.
  2.  **Collapsing Motivations:** All motivations – pure greed, deep altruism, profound moral commitment, petty spite – are flattened into "preferences" contributing to "utility." The framework itself provides no tools to distinguish between them based *solely* on the choice.
  3.  **Ignoring Counterfactuals:** RPT focuses solely on the *actual choice made*. It doesn't directly address how you *feel* about the choice (regret, resentment, pride) or what you *would have chosen* if your preferences were different (e.g., if you cared less about the nonprofit's mission).

  **III. Key Objections & Sen's Distinction: Sympathy vs. Commitment**

  This is where Amartya Sen's critique, particularly his distinction between **sympathy** and **commitment**, becomes crucial (*Rational Fools: A Critique of the Behavioural Foundations of Economic Theory*, 1977).

  1.  **Sympathy:** Your welfare is affected by the welfare of others. Helping the nonprofit makes *you* feel good. Choosing N over C *does* maximize your utility because the warm glow, moral satisfaction, or avoidance of guilt *is part of your utility function*. Your brother-in-law's argument likely assumes all non-selfish behavior falls under sympathy. In this case, RPT *can* accommodate it: you traded salary for moral satisfaction, both components of *your* utility.
  2.  **Commitment:** This is the game-changer. Commitment involves acting *according to a principle or value*, even when doing so:
      *   **Lowers your personal welfare/payoff.**
      *   **Goes against your immediate self-interest or even your sympathetic feelings.**
      *   **Is chosen *because* it's the right thing to do, not because it makes *you* feel better.**
      *   **Sen's Example:** You see someone being assaulted. Intervening risks injury (lowering your welfare). Sympathy might make you feel bad if you don't intervene, but commitment is the principle that "one should help someone in danger." You intervene *because of the principle*, even if the fear and risk overwhelm any "sympathetic" utility gain from helping.

  **IV. Why Commitment Creates Trouble for Strict RPT & the Brother-in-Law's Argument**

  1.  **Choice Against Welfare:** Commitment implies you might choose an action *knowing* it results in a lower overall level of personal well-being or satisfaction *as you yourself define it*. You sacrifice your welfare for the sake of the principle or others' welfare *directly*.
  2.  **The RPT Paradox:** If you choose the action (e.g., intervene, stay at the nonprofit out of pure duty), strict RPT *must* say: "This reveals it maximized your utility." But Sen argues this misrepresents the motivation. You didn't choose it *because* it maximized your utility; you chose it *despite* it lowering your utility, *because* of commitment. RPT *redefines* "utility" post-hoc to include "adherence to principle X," but this stretches the concept beyond its operational meaning within standard RPT and conflates motivation with outcome.
  3.  **Breaking the Tautology for Motivation:** Sen argues that RPT cannot distinguish *why* something was chosen based solely on the choice. Your choice to stay at the nonprofit *could* be:
      *   **Sympathy:** You genuinely get more *personal satisfaction* from the nonprofit work than the consulting salary could provide (utility-maximizing, no sacrifice).
      *   **Commitment:** You feel a deep moral obligation to the nonprofit's mission or beneficiaries. While you might *prefer* the higher salary *and* feel somewhat burdened by the lower pay, you choose the nonprofit *because you believe it's the right thing to do*, even acknowledging a net personal welfare loss. This *is* self-sacrificing.
      *   RPT, looking only at the choice, cannot tell these apart. It *assumes* Sympathy (or simple self-interest) by default because Commitment breaks its core postulate that choice=welfare maximization.

  **V. Can Self-Sacrifice Exist Within or Against RPT? The State of the Argument**

  1.  **Within Strict RPT:** No. By definition, any observed choice is utility-maximizing. "Self-sacrifice" becomes incoherent; it's always just preference satisfaction. The brother-in-law's argument holds *if* you accept RPT's core axioms without Sen's critique.
  2.  **Against RPT (Sen's View & Others): Yes, but methodologically challenging.**
      *   **Conceptually:** Sen provides a robust *conceptual* framework for self-sacrifice (Commitment). Your decision *could* be self-sacrificing if the *motivation* was commitment – choosing based on principle, knowing it entails a net personal welfare loss compared to the alternative.
      *   **Empirically:** This is the hard part. How do we *know* if a choice was driven by sympathy or commitment? How do we measure "welfare loss" independent of choice? Economists and philosophers grapple with this:
          *   **Stated Preferences:** Asking people about motivations, values, and hypothetical choices (though subject to bias).
          *   **Behavior in Varied Contexts:** Does the person consistently act against their apparent self-interest when a principle is involved? (e.g., donating anonymously, whistleblowing at great personal cost).
          *   **Neuroeconomics:** Can brain scans show activity associated with "genuine" altruism vs. reward-seeking? (Still nascent and debated).
          *   **Regret & Counterfactuals:** Expressing regret or resentment about the choice *after the fact* might hint at commitment (sacrificing welfare), though RPT dismisses this as "preference change."
      *   **The Welfare Definition:** The crux is defining "welfare" or "utility" independently of the choice itself. If welfare is defined *only* by choice (RPT), sacrifice is impossible. If welfare is defined as well-being, happiness, or satisfaction *as experienced by the individual*, and if we can find evidence that a choice *reduced* that state *despite* being chosen, then sacrifice is possible. Sen argues commitment choices often do precisely this.

  **VI. Implications for Your Situation & Conclusion**

  *   **Your Brother-in-Law:** His argument is logically consistent *within the narrow framework of strict RPT*. It correctly points out that your choice revealed a preference for the bundle of attributes offered by the nonprofit job *over* the bundle offered by the consulting job. He dismisses the possibility of commitment.
  *   **Sen's Critique:** Provides the principled rebuttal you half-remembered. It argues that RPT cannot capture the essential nature of moral commitment, which can involve acting *against* one's own welfare or "self-interest" broadly conceived. Your quiet pride *could* stem from acting on such a commitment.
  *   **The State of Play:** Economists largely use RPT as a powerful *tool* for modeling behavior based on observable data. However, most acknowledge its limitations regarding motivation, welfare, and ethics. Sen's distinction is widely respected as a fundamental critique showing RPT cannot fully account for morally motivated behavior like genuine altruism or self-sacrifice based on commitment. Behavioral economics further challenges RPT by showing systematic "irrationalities," but Sen's critique targets its core philosophical foundations regarding motivation.
  *   **Your Choice:** Whether your choice *was* self-sacrificing depends on your *motivation* and your *internal sense of welfare*:
      *   If you stayed *primarily* because you simply *enjoyed* the nonprofit work more overall (finding more meaning, liking the environment, valuing the time, etc.), then it was Sympathy – utility-maximizing, no sacrifice.
      *   If you stayed *primarily* out of a sense of duty, loyalty, or moral obligation ("This is where I'm needed," "I made a commitment"), *even while acknowledging* that the lower salary represents a significant personal cost/hardship and perhaps a net reduction in your overall well-being compared to the consulting path, then it was Commitment – and genuinely self-sacrificing in a way RPT cannot recognize.

  **In essence:** Revealed preference theory, by its construction, cannot admit self-sacrifice. Amartya Sen provides the principled argument demonstrating why this is a *limitation* of the theory, not a proof that self-sacrifice doesn't exist. He shows that actions driven by commitment (acting on principle against one's welfare) fundamentally challenge the RPT equation of choice with personal utility maximization. While empirically proving the motivation behind any single choice is difficult, Sen's framework provides the conceptual space for your quiet pride to be justified as reflecting a commitment that went beyond mere personal preference satisfaction. The brother-in-law's argument holds water only if you accept RPT's most restrictive and motivationally blind interpretation of human choice.
