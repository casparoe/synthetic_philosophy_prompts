answer: |-
  This is a profoundly difficult situation, and your philosophical wrestling is both understandable and commendable. Let's break down the revisionist argument (primarily McMahan's) step-by-step, contrast it with the traditionalist view (Walzer), and then examine the crucial "wrong but blameless" distinction concerning your cousin.

  ## Core Premises: Grounding in Self-Defense & Liability

  McMahan's revisionism starts from fundamental principles of individual morality, particularly self-defense and the conditions under which one person may permissibly kill another:

  1.  **The Basic Right Not to be Killed:** All individuals possess a fundamental right not to be killed or seriously harmed.
  2.  **Liability as the Basis for Permissible Killing:** The *only* way to lose this right (to become "liable" to defensive killing) is to be **morally responsible for an unjust threat of serious harm** to others.
      *   **Example:** An aggressor pointing a gun at an innocent person is morally responsible for an unjust threat. The innocent person (or a defender) is morally *permitted* to kill the aggressor to stop the threat. The aggressor is *liable* to defensive force.
  3.  **Non-Liability of Innocents:** Someone who poses *no* unjust threat, or who is *not morally responsible* for posing one (e.g., an innocent bystander, someone acting under literal duress with a gun to their head, someone completely non-culpably ignorant), retains their right not to be killed. Killing them violates that right.
  4.  **The Relevance of "Just Cause" (Jus Ad Bellum):** Whether a war is *just* fundamentally determines whether the *threat* posed by the soldiers fighting *for* that cause is itself *unjust*.
      *   **Just Combatants:** Fight for a just cause (e.g., defense against aggression). They *do not* pose an unjust threat. Killing enemy combatants is permissible *only* because those enemy combatants *are* posing an unjust threat (they are liable). Their violence is *defensive* or *punitive* against liability.
      *   **Unjust Combatants:** Fight for an unjust cause (e.g., aggression). They *do* pose an unjust threat. They are therefore *liable* to defensive killing by the just combatants. Their violence *initiates* or *perpetuates* an unjust threat.

  ## The Revisionist Argument Against Moral Equality

  1.  **The Asymmetry of Liability:** From the core premises above, McMahan argues that liability in war is fundamentally *asymmetrical*.
      *   Unjust combatants are morally responsible for posing an unjust threat. They are liable to be killed by just combatants defending themselves or others.
      *   Just combatants are *not* morally responsible for posing an unjust threat (they are resisting one). They are *not* liable to be killed by unjust combatants.
  2.  **The Central Claim:** Therefore, when an unjust combatant kills a just combatant, even in accordance with the *rules* of war (e.g., not targeting civilians, using proportionate force in a tactical engagement), **they are killing someone who retains their right not to be killed.** The just combatant is not liable. This killing is, objectively, **morally wrong.** It violates the just combatant's fundamental right.
  3.  **Rejection of the Independence Thesis:** This directly attacks Walzer's core "independence thesis" (that jus in bello is separate from jus ad bellum). For McMahan, the *justification* for killing *depends entirely* on whether the person being killed is liable, which depends on whether the war they are fighting is just. Jus ad bellum *structures* jus in bello permissions.
  4.  **The "Moral Equality" Illusion:** The appearance of equality arises only because:
      *   Combatants on both sides *appear* to pose similar threats in the fog of war.
      *   The *institutional* rules of war (Geneva Conventions, etc.) apply symmetrically to *regulate conduct*, regardless of the war's justice. But these institutional rules, while practically necessary to limit suffering, do *not* reflect the underlying moral reality of liability. They are a pragmatic compromise, not a moral truth.
      *   Soldiers on both sides often *believe* their cause is just, but belief doesn't change objective liability.

  ## The Traditionalist (Walzerian) Case for Moral Equality

  Walzer's argument is more institutional and sociological than foundational:

  1.  **War as a Mutual Enterprise:** War is seen as a collective, coercive activity entered into by states. Soldiers are not acting as private individuals pursuing personal vendettas; they are agents of their state.
  2.  **The Separation Thesis (Jus Ad Bellum / Jus In Bello Independence):** The question of *why* the war is fought (jus ad bellum) is distinct from the question of *how* it is fought (jus in bello). The latter has its own independent rules.
  3.  **Combatant Equality & the "War Convention":** Soldiers on both sides are granted the *legal and moral privilege* to fight and kill enemy combatants. This is because:
      *   **Reciprocity:** Without this mutual privilege, restraint in warfare (e.g., sparing civilians, taking prisoners) would collapse entirely. Each side would view the other as criminals.
      *   **The "Wagon Train" Analogy:** Soldiers are like passengers on two colliding trains. They didn't choose the collision (the war), but once it happens, they are thrust into a situation where they must fight each other to survive or achieve their side's objective. They share a common, imposed predicament. Holding them individually responsible for the *state's* decision to go to war is unfair.
      *   **Functional Role:** Soldiers are instruments of state policy. Their moral status is derived from their role as combatants following the rules of their profession and the laws of war, not from the justice of their state's cause. Obeying lawful orders within the war convention is their primary duty.
  4.  **The "Moral Equality" Conclusion:** Therefore, a soldier fighting *in bello* correctly (following the rules of war) is morally permitted to kill enemy combatants, regardless of whether their state's *ad bellum* cause is just or unjust. Both are "moral equals" in the realm of combat.

  ## The "Wrong but Blameless" Distinction: Your Cousin's Case

  This is where McMahan directly addresses your core concern and where philosophy gets messy but essential.

  1.  **The Objective Wrongness:** Based on the liability argument above, McMahan maintains that if your cousin fights in a war he knows (or should know) is unjust, **his act of killing a just combatant is objectively morally wrong.** He is killing someone who has a right not to be killed by him. The *act* violates a fundamental moral right.
  2.  **Excusing Conditions & Blamelessness:** However, McMahan (and most revisionists) readily acknowledge that **the individual soldier performing this objectively wrong act may be fully excused and thus *blameless* or *non-culpable*.**
      *   **Why Excused?** The soldier might lack *moral responsibility* for their participation in the unjust threat due to factors like:
          *   **Duress:** Conscription under threat of severe punishment (imprisonment, death) for refusal. Your cousin's "resignation" likely falls here. He is forced into the role.
          *   **Epistemic Limitations:** Being subjected to pervasive, state-controlled propaganda that effectively obscures the war's injustice. Being "apolitical" might stem from or contribute to this, making it difficult to access or trust alternative information.
          *   **Lack of Real Alternatives:** Genuine inability to desert without extreme risk to self or family, or to find asylum.
          *   **Non-Culpable Ignorance:** Inability to reasonably access the truth about the war's injustice despite sincere efforts (often intertwined with propaganda and lack of education).
          *   **Diminished Capacity:** Youth, lack of education, psychological pressure.
      *   **The Philosophical Work:** This distinction between **objective wrongness (actus reus)** and **subjective culpability (mens rea)** is fundamental to moral and legal philosophy. Think of criminal law: Someone might kill another person (wrong act), but if they did so under immediate, credible threat to their own life (duress) or while insane, they may not be *culpable* or *blameworthy*. The act is still wrong (a life was unjustly taken), but the *agent* isn't held morally or legally responsible. Applying this to war:
          *   The *act* of the unjust combatant killing the just combatant violates the just combatant's right (it's wrong).
          *   The *soldier* performing the act, if acting under severe duress (like conscription and threat of punishment), non-culpable ignorance, or effective propaganda, lacks the full moral agency or choice necessary to be *blamed* for that wrong. Their will is overborne or their understanding is clouded.

  3.  **Is it a Dodge?** This is the critical question you're asking. Is this distinction doing real philosophical work, or is it just a way to avoid condemning individuals like your cousin?
      *   **Real Philosophical Work:** It *is* doing crucial work. It maintains the **objectivity of moral wrongness** (killing the non-liable is always wrong) while recognizing the **complex realities of human agency and responsibility under oppression**. It prevents the conclusion that "if the act isn't wrong, then it's okay," while also preventing the equally problematic conclusion that "if the act is wrong, the coerced/ignorant agent must be a bad person." It acknowledges that systems (like aggressive states using conscription and propaganda) create situations where individuals are forced or manipulated into performing objectively wrong acts without being evil or fully responsible. This preserves the *condemnation of the unjust war and the system enabling it* while offering a *humane assessment of the individual caught within it*.
      *   **Not Just a Dodge:** Calling it a "dodge" implies it's an evasion. It's not. It's a necessary complexity forced upon us by the messy realities of war and political oppression. It avoids two unacceptable extremes:
          *   *Extreme 1 (Absolving the Act):* Saying the killing isn't wrong at all just because the soldier was conscripted. This morally neuters the concept of an unjust war and ignores the victim's rights.
          *   *Extreme 2 (Condemning the Person):* Insisting that the conscripted, propagandized soldier who kills under duress is morally *culpable* and thus a "bad person" in the same way a volunteer aggressor or a war criminal is. This ignores the profound impact of coercion and manipulation on moral responsibility.

  ## Applying it to Your Cousin

  1.  **The Act:** If the war is indeed unjust, then if your cousin kills an opposing soldier who is fighting justly (e.g., defending their homeland against aggression), that act is **objectively morally wrong.** It violates that soldier's right not to be killed by someone posing an unjust threat.
  2.  **The Agent (Your Cousin):** Based on your description – reservist, apolitical, resigned, conscripted (mobilization papers), likely under threat of punishment for refusal, operating within a system of propaganda about the war – he almost certainly falls under **excusing conditions.**
      *   His "resignation" strongly suggests duress, not enthusiastic endorsement.
      *   His apolitical nature, while not absolving him entirely of the need for moral reflection, likely reflects the epistemic environment and the overwhelming pressure to comply.
      *   He likely has no meaningful, safe alternative.
  3.  **Conclusion:** While his *actions* as an unjust combatant would be morally wrong (violating rights), **he himself is likely blameless or minimally blameworthy** due to the coercive and manipulative circumstances forcing him into that role and those actions. He is a victim of the state's aggression, used as its instrument. Condemnation should rightly fall on the architects and willing perpetrators of the unjust war, not primarily on the conscript thrust into the line of fire against his will and better judgment.

  This distinction doesn't make the situation less tragic, but it offers a framework that acknowledges the gravity of killing in an unjust cause while refusing to place the full moral burden of that unjust cause on the shoulders of individuals who had little real choice in the matter. Your anguish stems from recognizing both the objective wrongness of the war and the subjective innocence of your cousin caught within it. McMahan's framework provides the vocabulary and structure to hold both of those truths simultaneously.
