answer: |-
  ## Memorandum: Proposed Policy for Honoring Psychiatric Advance Directives During Acute Mania

  **To:** Hospital Ethics Committee  
  **From:** [Your Name], Family Representative  
  **Date:** October 26, 2023  
  **Subject:** Refining Policy on Psychiatric Advance Directives (PADs) Conflicting with Apparent Competent Refusal During Acute Manic Episodes  

  The recent case involving my sister highlights a critical gap in our policy regarding Psychiatric Advance Directives (PADs). While our policy states PADs should be given "significant weight," it lacks concrete criteria for resolving conflicts between a PAD authorizing treatment and a contemporaneous refusal that *appears* competent via standard capacity assessment. This memo proposes specific criteria, a decision procedure, and directly addresses the core ethical objection concerning authority of past vs. present self.

  ### Proposed Concrete Criteria for Overriding a Contemporaneous Refusal Using a PAD
  1.  **Specificity & Validity of PAD:** The PAD must explicitly authorize treatment *specifically for manic episodes* and include clear indicators of mania (e.g., grandiosity, reduced sleep, pressured speech). It must be properly executed during a documented period of stability.
  2.  **Diagnosis of Acute Episode:** The treating physician must diagnose an *active manic or hypomanic episode* consistent with the PAD's trigger, supported by objective clinical evidence (e.g., DSM-5 criteria, observed behavior, collateral history).
  3.  **"Manic Competence" Assessment:** Standard capacity assessment (understanding, appreciation, reasoning, expressing choice) is necessary but *insufficient*. A **supplemental assessment** must evaluate whether the patient's reasoning and appreciation are *distorted by the manic state itself*, specifically:
      *   Ability to appreciate the *impact of mania* on their current judgment.
      *   Ability to rationally weigh the consequences of refusal *in the context of their known illness trajectory*.
      *   Consistency of current refusal with their *long-term, stable values and goals* expressed in the PAD and documented history.
  4.  **Evidence of Impaired Insight:** There must be evidence the patient lacks insight into the *current episode's severity* and its impact on their decision-making, despite articulating reasons for refusal.

  ### Proposed Decision Procedure & Timeline
  1.  **Initial Trigger:** When a patient in a diagnosed acute manic episode refuses treatment covered by a valid, specific PAD, the attending psychiatrist documents the refusal, the PAD, the manic diagnosis, and conducts both the standard capacity assessment *and* the supplemental "manic competence" assessment.
  2.  **Attending Decision:** The attending psychiatrist, applying the criteria above, makes an initial determination on whether to honor the PAD or the refusal. **Documentation must explicitly address all four criteria.**
  3.  **Automatic Ethics Consult (Within 4 Hours):** If the attending proposes *overriding* the contemporaneous refusal based on the PAD, OR if any treating team member challenges the decision, an **immediate ethics consult is mandated** (target: within 4 hours of decision point). The consult request must include all relevant documentation (PAD, assessment notes, clinical evidence of mania).
  4.  **Ethics Committee Review (Within 24 Hours):** The ethics consultant(s) reviews the case *urgently* against the four criteria. They may interview the treating team and (if feasible and non-distressing) briefly speak with the patient, focusing on their state and reasoning, not re-litigating capacity. The consultant(s) provides a **binding recommendation** to the attending psychiatrist within 24 hours.
  5.  **Attending Final Decision:** The attending psychiatrist makes the final treatment decision, incorporating the ethics recommendation. If they deviate, they must provide a detailed written justification.
  6.  **Family Input:** Family/caregivers (as identified in the PAD or by the stable patient) should be informed of the conflict and the process, and their perspective on the patient's stable values and history should be solicited *as data* for the "manic competence" assessment and ethics review.

  ### Engaging the Strongest Objection: Authority of Past vs. Present Self
  The objection that honoring the PAD privileges the "past self" over the "present self" is profound and valid. It strikes at the core of autonomy. However, this view risks oversimplifying the nature of severe mental illness like Bipolar I Disorder during acute mania:

  1.  **The "Manic Self" as an Interloper:** The objection assumes the "person in the room" is fully autonomous. In severe mania, core features *are* the illness: grandiosity, impaired insight, and profoundly altered judgment. The PAD reflects the patient's own recognition that *the manic state fundamentally distorts their authentic self and values*. Honoring the refusal is not respecting the "present self," but capitulating to the *illness* that has temporarily overwhelmed that self.
  2.  **Protecting Longitudinal Autonomy:** Autonomy isn't merely moment-to-moment. It encompasses the right to make plans to protect one's *future self* and *life narrative* from the predictable ravages of illness. The PAD is an exercise of that longitudinal autonomy. Ignoring it during mania disrespects the patient's considered, stable judgment about what constitutes their own good.
  3.  **False Competence:** Passing a standard capacity assessment does not equate to making a decision reflecting one's authentic values *when manic*. Mania can enable articulate expression of choices rooted in delusional grandiosity or impaired risk perception. The "manic competence" assessment criteria are designed to detect this disconnect. The PAD provides crucial evidence of the patient's *own* belief that their competent self is absent during mania.
  4.  **Preventing Harm to the Authentic Self:** Overriding the PAD based on a "competent" manic refusal risks causing profound harm to the patient the directive was designed to protect – the stable self who values health, relationships, and avoiding the consequences of untreated mania. Respecting autonomy requires protecting the patient from choices their *authentic self* would reject as catastrophic.

  **Conclusion:** Honoring a carefully vetted PAD during acute mania, guided by strict criteria and a rapid review process, is not simple paternalism. It is a complex but ethically justifiable act of respecting the patient's *deepest autonomy* – their autonomy to protect their future self and core identity from an illness they recognized would temporarily rob them of sound judgment. The proposed criteria and procedure ensure this power is used judiciously, transparently, and only when the illness demonstrably distorts the patient's present capacity to embody their true self and values. I urge the committee to adopt these concrete steps to resolve future conflicts with ethical clarity and respect for our patients' complex autonomy.
