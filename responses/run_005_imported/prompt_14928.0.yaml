  My grandpa died last Sunday and my aunt's doing his actual eulogy at the funeral, but the family also asked me to say a few short words at the reception after (like 2-3 minutes, not the whole eulogy), I think because I'm the only grandkid who ever took a philosophy elective and actually talked to him about his old academic stuff. He was a philosophy professor for something like 35 years and also just a massive, lifelong opera obsessive, he'd blast Wagner in the car and none of us were allowed to talk during "the good parts." Going through his office this week my mom found a book called On Opera by this philosopher Bernard Williams, completely covered in grandpa's pencil notes, apparently his favorite. I tried to read the essay he underlined the most (something about opera and "artifice," I don't even remember the exact title) and I sort of get the gist: his whole point seems to be that opera is like the most fake, unrealistic art form there is, people just straight up sing their feelings instead of talking and the plots are ridiculous, and that's not a flaw in it, that's actually exactly what lets opera tell the truth about big stuff like love and death and betrayal in a way a normal "realistic" play can't. I think he even gets into how in ensemble scenes a bunch of characters can be feeling completely different true things all at once, which normal conversation just can't really pull off.

  Anyway can you actually write the short speech for me using that idea, because I like it but I definately don't understand it well enough to write it myself without messing it up. The tricky part is the room's gonna be split, half is just family and his golf buddies who have never read a philosophy book in their life, but 4 or 5 of his old philosophy department colleagues are coming too and they will notice immediately if I get his actual view wrong or just water it down into generic "music is powerful" stuff. So the opera/artifice idea needs to actually be doing something in the speech, not just name-dropped, maybe even tie into how a funeral reception is itself this really artificial, stiff kind of ceremony that's somehow supposed to get at something true about a real person, kind of like his whole opera thing. One more rule: he was super matter-of-fact about death, not religious at all, so please don't have him "watching over us" or anything like that, he would've hated that.
