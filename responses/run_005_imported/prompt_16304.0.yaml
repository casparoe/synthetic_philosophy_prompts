  Breaking this down: First, the incredulity challenge. Most people's gut rejection of true contradictions needs framing not as ignorance but as evolutionary intuition versus formal innovation. The follow-up should block appeals to "counterintuitive truths" by demanding why formal tools get epistemic priority. 

  Second, the explosion problem. Here's where it gets technical. The guest will likely explain disjunctive syllogism failure, so the follow-up must press on practical reasoning losses—like how reductio ad absurdum survives without explosion. Need concrete examples (e.g., ruling out hypotheses). 

  Third, revenge. This is the nuclear option. Dialetheists often use metalanguage escapes, but the follow-up must corner them on whether their "solution" just relabels the problem. The Liar's revenge ("This sentence is only false") is perfect—it forces them to either accept infinite hierarchies or admit their logic can't contain its own consequences. 

  Adding bonus questions: Truthmakers are underdiscussed but vital—what in reality corresponds to a dialetheia? And the "why not more dialetheias?" question exposes dialetheism's ad hoc confinement to paradoxes. The follow-up about empirical contradictions (e.g., Schrödinger's cat) could reveal if this is purely linguistic or has metaphysical ambitions. 

