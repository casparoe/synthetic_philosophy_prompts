prompt: |-
  I recently joined a graduate seminar on the philosophy of general relativity, and, rather to my surprise, the very first session was devoted not to Einstein but to Newton. The instructor's point was that the "hole argument" over whether spacetime points have their own primitive identity apart from the metric field — which is actually the reason I applied to this program, since I'm hoping to eventually work on background independence in quantum gravity — is best understood as the modern descendant of a much older dispute, and that we ought to read that dispute in Newton's own words rather than in the tidy secondhand paraphrases most of us picked up as undergraduates. So I went back to the Scholium on space, time, and motion at the start of the Principia, in Andrew Motte's eighteenth-century translation, and while I can follow the setup of the famous bucket experiment easily enough, I'm having trouble pinning down exactly what Newton takes himself to have established by the end of it, especially once I try to state it precisely enough to compare with the moves people make in the hole-argument literature.

  Here is the passage I keep getting stuck on: "If a vessel, hung by a long cord, is so often turned about that the cord is strongly twisted, then filled with water, and held at rest together with the water; thereupon, by the sudden action of another force, it is whirled about the contrary way, and while the cord is untwisting itself, the vessel continues for some time in this motion; the surface of the water will at first be plain, as before the vessel began to move; but the vessel, by gradually communicating its motion to the water, will make it begin sensibly to revolve, and recede by little and little from the middle, and ascend to the sides of the vessel, forming itself into a concave figure (as I have experienced) ... This ascent of the water shows its endeavour to recede from the axis of its motion; and the true and absolute circular motion of the water, which is here directly contrary to the relative, discovers itself, and may be measured by this endeavour ... And therefore this endeavour does not depend upon any translation of the water in respect of the ambient bodies, nor can true circular motion be defined by such translation."

  What I can't work out is this: strictly speaking, all Newton has ruled out here is that the water's tendency to climb the sides depends on its motion relative to the vessel. He hasn't ruled out that the relevant motion might instead be relative to some more inclusive body — the fixed stars, say, or the material contents of the universe as a whole — which is more or less the line Mach took two centuries later. Is that gap already present in the bucket passage on its own, or is it only closed, if it's closed at all, by the separate two-globes thought experiment that comes a bit later in the same Scholium? And if the real work is being done by the two-globes case rather than the bucket, does that mean the bucket experiment by itself shows less than it's usually given credit for? I'd like to get clear on this before next week's session, since it seems like how one resolves it determines which side of the hole argument one finds intuitive to begin with.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're in a grad seminar on the philosophy of general relativity, focusing on the hole argument and background independence. The instructor linked this to Newton's Scholium, specifically the bucket experiment. The user is confused about what Newton actually proves with the bucket alone and whether it rules out motion relative to larger bodies like fixed stars. They also wonder if the two-globes thought experiment is necessary to fill that gap.

  First, I need to recall Newton's arguments. The bucket experiment shows that the concave water surface isn't due to motion relative to the bucket. Newton uses this to argue for absolute motion. But as the user points out, he hasn't addressed motion relative to distant stars. Mach later suggested that inertia depends on the mass distribution in the universe, like fixed stars. So the gap here is real. 

  The user mentions the two-globes experiment. In that, Newton considers two globes connected by a cord in an otherwise empty universe. If they spin around each other, the cord tenses, indicating absolute motion even without other reference points. This directly counters the idea that motion is relative to distant matter. 

  So, the bucket alone doesn't refute motion relative to fixed stars. The two-globes experiment is crucial for that. The user is right: the bucket shows less than it's credited for. This connects to the hole argument because it's about whether spacetime points have identity independent of the metric. Newton's absolute space assumes they do, while relationalists like Mach argue motion is relative to matter. 

  The user's deeper need is understanding how historical debates inform the hole argument. They want to articulate why Newton's arguments support absolute space, which affects their view on background independence in quantum gravity. Clarifying the necessity of the two-globes experiment helps them see the shift from relational to absolute spacetime, which is central to the hole argument. 

  I should also note that the bucket experiment's value is in distinguishing relative motion from absolute rotation, even if it doesn't complete the argument. Highlighting both experiments shows Newton's strategy: incremental reasoning leading to absolute space. This sets up Mach's critique and Einstein's initial leanings, which the hole argument challenges. 

  The user might need this for seminar discussion, so emphasizing the philosophical implications is key. Connecting Newton's gap to Mach and then to Einstein's hole argument will help them see the lineage. Also, stressing that the two-globes thought experiment addresses the material universe dependency, which the bucket doesn't, solidifies their argument for the seminar.
answer: |-
  You've pinpointed a crucial and subtle point in Newton's argument – one that absolutely resonates with the core issues debated in the hole argument and background independence. Let's break down the bucket passage and its relation to the two-globes experiment to clarify what Newton claims and where the gaps (and Mach's later challenge) lie.

  1.  **What the Bucket Experiment *Does* Show (According to Newton):**
      *   The *phenomenon* (endeavour to recede, concave surface) depends on the *motion of the water itself*, not directly on its motion relative to the immediately surrounding container (the bucket).
      *   When the water is rotating *relative to the bucket* but the *surface is flat* (initial stage), the phenomenon (concavity) is absent.
      *   When the water is *at rest relative to the bucket* but both are rotating together (later stage), the phenomenon (concavity) *is* present.
      *   **Conclusion A:** The phenomenon (concavity/endeavour) cannot be defined by, or reduced to, the water's motion relative to the bucket. "True circular motion" is *not* relative motion w.r.t. the bucket.
      *   **Conclusion B:** There is a physical state ("true circular motion") that manifests itself through an inertial effect (centrifugal force/endeavour) and is *not* captured by relative motion w.r.t. the *immediate* environment.

  2.  **The Gap You Identify (and Mach Exploits):**
      *   **You are absolutely correct.** Newton has *not* ruled out that the phenomenon depends on the water's motion relative to *some other body or system*, specifically the fixed stars or the total mass distribution of the universe.
      *   The experiment only contrasts motion relative to the bucket with a state where the water itself is undergoing acceleration (rotation). It says nothing about the role (if any) of distant matter.
      *   Mach's core insight was precisely this: *Maybe the centrifugal forces arise because the water is rotating relative to the fixed stars (or the "average mass distribution of the universe").* In this view, the fixed stars play a role analogous to the bucket walls in defining a state of non-rotation. Newton's absolute space becomes redundant.

  3.  **The Role of the Two-Globes Thought Experiment:**
      *   Newton anticipates this objection. The two-globes experiment is designed *specifically* to close this gap.
      *   **The Scenario:** Imagine *only* two globes connected by a cord, in otherwise empty space. They revolve around their common center of gravity.
      *   **The Phenomenon:** The cord becomes tense.
      *   **The Argument:**
          *   The tension reveals an "endeavour to recede from the axis of motion" – the same *kind* of inertial effect as in the bucket.
          *   **Crucially:** There are *no other bodies* relative to which this motion can be defined. The globes only have each other as reference.
          *   If motion were purely relational, only *relative motion between the globes* would exist. But relative motion along the line connecting them could be linear separation or approach, neither of which should produce a *transverse* tension in the cord. The tension specifically indicates *circular/rotational* motion.
          *   **Conclusion:** The tension (inertial effect) reveals a "true circular motion" of the *system* that is absolute. It exists *even in the absence of any other matter* relative to which the motion could be defined. This motion is a property of the globes in relation to *space itself*.

  4.  **Resolving Your Questions:**
      *   **Is the gap present in the bucket passage alone?** **Yes.** The bucket experiment, by itself, *only* rules out defining "true rotation" as motion relative to the *immediate container*. It leaves the door wide open for defining it as motion relative to distant matter (fixed stars/universe).
      *   **Is the gap closed by the two-globes experiment?** **Yes, according to Newton.** This is the experiment that explicitly targets the relationalist view appealing to *any* material reference frame, even the cosmic one. Newton argues that the inertial effect (tension) exists *even when no such material reference frame exists*.
      *   **Does the bucket show less than it's usually given credit for?** **Yes and No.**
          *   **Yes (Strictly):** It doesn't, on its own, establish absolute space against a sophisticated relationalism like Mach's. Its primary target is the simplistic "motion relative to the container" view. Its power is often *overstated* in isolation.
          *   **No (In Context):** Newton presents the bucket *first* for pedagogical and rhetorical reasons. It's a concrete, observable phenomenon demonstrating that *some* motion (rotation) has physical effects not reducible to relative motion w.r.t. the obvious local frame. This sets up the *need* for a concept like "true motion." The two-globes experiment then takes the argument the final step, showing that this "true motion" must be defined relative to space itself, as it persists even in the absence of any other matter. The bucket provides the *phenomenological evidence* for an inertial effect requiring explanation; the two-globes provides the *metaphysical argument* that only absolute space can provide that explanation when relational options are exhausted.

  5.  **Connection to the Hole Argument & Background Independence:**
      *   **Newton's Stance (via Two-Globes):** Spacetime points *do* have primitive identity (via absolute space). The state of motion (rotation) is a property of bodies relative to these points. The inertial effects (tension, concavity) depend on this relation. The metric structure (defining inertia) is fixed by the background absolute space. **This aligns with the "manifold substantivalism" targeted by the hole argument.**
      *   **Mach's Challenge (and Relationalism):** The inertial structure (manifested in the bucket/two-globes effects) is *not* a property of space itself, but is *generated by* or *relative to* the total mass distribution (e.g., fixed stars). Spacetime points have no identity independent of the matter fields/metric. This is the precursor to **relationalism** and the motivation behind **background independence** (the metric/dynamics shouldn't presuppose a fixed background). Einstein was deeply influenced by Mach and initially sought a fully Machian GR.
      *   **The Hole Argument:** Demonstrates that if spacetime points have primitive identity (substantivalism), then different metric fields related by a diffeomorphism (a smooth remapping of points) represent physically distinct states, *even if all observable matter/fields are identical*. This seems absurd (violates "Leibniz equivalence"). Newton's two-globes argument is a powerful *defense* of substantivalism: The tension exists *even in empty space*, implying the points *must* have identity to define the rotation. The hole argument shows the *tension* this view creates in a relativistic, background-independent theory like GR. How can points have identity if the metric field (which defines geometry/inertia) is dynamical and the only thing giving them physical salience?

  **Conclusion:**

  Your analysis is spot-on. The bucket experiment, while iconic, primarily serves to decouple inertial effects from motion relative to the *immediate container*. The gap concerning motion relative to the *cosmic matter distribution* is real and is explicitly addressed by Newton *only* in the subsequent two-globes thought experiment. It is the *two-globes* argument that delivers Newton's knockout punch against *any* form of relationalism (including Mach's potential cosmic version) and provides his strongest case for absolute space and the primitive identity of spatial points. Recognizing this distinction is vital:

  *   If you find Newton's *two-globes* argument compelling (the tension must mean absolute rotation relative to space itself, even in emptiness), you lean towards **substantivalism** and will feel the force of the hole argument as a *problem* to be resolved (e.g., via gauge fixing, or by rejecting primitive identity).
  *   If you find Mach's response plausible (the two-globes tension is meaningless without *some* reference, perhaps even if only implicit or ideal like the fixed stars), you lean towards **relationalism** and will see the hole argument as *confirming* that spacetime points lack primitive identity, advocating for background independence where the metric's degrees of freedom are fundamental, not laid upon a prior manifold.

  Understanding this Newtonian foundation – especially the distinct roles of the bucket and the two-globes – is essential for grappling with the sophisticated modern debate about spacetime ontology in GR and quantum gravity. You've grasped the critical hinge point perfectly. Good luck with the seminar!
