answer: |-
  You've hit on a genuinely fascinating and powerful critique! David Lewis's short paper (published posthumously in 1997) is indeed a sharp and concise challenge to the logic of penal substitutionary atonement (PSA). Your summary is spot-on. Lewis argues:

  1.  **The Core Analogy:** PSA relies on the analogy of legal punishment: we deserve punishment for sin (crime), but Christ takes that punishment (fine/imprisonment) in our place.
  2.  **The Inconsistency:** We readily accept someone *paying a monetary fine* on our behalf. We find it morally repugnant and legally impermissible for someone *innocent* to serve a *prison sentence* on behalf of the guilty party.
  3.  **The Disanalogy:** Therefore, if PSA is like Christ serving our prison sentence (enduring the punishment we deserved), it relies on a type of substitution we intuitively reject in our own justice systems. It seems illogical or unjust.

  **So, is Lewis's argument a fatal blow to PSA? Not necessarily, according to its defenders.** Here's why the debate continues, and why Lewis's point, while brilliant and widely acknowledged, isn't considered a definitive refutation by theologians and philosophers engaging with PSA:

  1.  **Divine Prerogative vs. Human Justice:** Proponents argue that God, as the ultimate lawgiver and judge, has the sovereign right to determine *how* justice is satisfied in a way human courts do not. Human justice systems have limitations (e.g., ensuring deterrence, protecting society, operating within finite resources) that God's system transcends. God can choose to accept a substitute *because He says He can and will*, based on His own nature and purposes.
  2.  **The Nature of the Punishment:** PSA defenders often argue that the "punishment" Christ bore wasn't *merely* analogous to a prison sentence, but something deeper – the *wrath of God* against sin and the spiritual death/separation from God that sin entails. This is seen as qualitatively different from human legal penalties, making the substitution unique and possible only through the specific nature of Christ (both divine and human).
  3.  **The Nature of the Substitute:** Christ isn't just *any* innocent third party. He is presented as:
      *   **Willing:** He voluntarily undertook the role (John 10:18).
      *   **Capable:** As the eternal Son of God, he could bear the infinite weight of divine wrath against sin.
      *   **Representative/Unified with Humanity:** Through the Incarnation, Christ became fully human, enabling him to represent humanity. Some models emphasize a "mystical union" or "federal headship" (Christ as the representative of a new humanity) that makes the substitution more than just an arbitrary swap, but an act within a unified body.
  4.  **The Goal is Different:** The purpose of Christ's substitution isn't *just* retribution (paying a debt), but *redemption* and *reconciliation*. It's aimed at fundamentally changing the relationship between God and humanity, destroying sin's power, and enabling new life. This transformative purpose is argued to justify the means in a way a simple prison swap wouldn't.
  5.  **Distinguishing Penalties:** Some argue Lewis's analogy isn't perfect. They might concede that *retributive imprisonment* isn't transferable but maintain that the *penalty* Christ paid (death, bearing wrath) *is* transferable *because God ordained that specific penalty to be satisfied vicariously*. They see the "fine" aspect (payment of a debt) as the more accurate parallel.
  6.  **Alternative Metaphors within PSA:** PSA doesn't rely *only* on the penal metaphor. It often intertwines with:
      *   **Sacrificial Language:** Christ as the perfect sacrifice offered to God (drawing on Old Testament imagery). Substitutionary sacrifice was culturally accepted.
      *   **Ransom Language:** Christ paying a price to free humanity from bondage.
      *   **Victory Language:** Christ defeating the powers of sin and death. These other metaphors can soften the perceived harshness or illogic of pure penal substitution.

  **Why doesn't it come up more?**

  *   **Theological Niches:** Debates about atonement theory are often deep within academic theology or specific denominational circles. Lewis's paper, while famous in philosophy circles (especially philosophy of religion), might be less immediately accessible or discussed in purely theological debates focused on scriptural exegesis.
  *   **Pre-existing Critiques:** Philosophers and theologians (like Hugo Grotius, or more recently philosophers like Eleonore Stump or Marilyn McCord Adams) had already raised similar objections about justice and transferability of punishment long before Lewis. Lewis formulated it with characteristic clarity, but the *type* of critique wasn't entirely new. The defenses mentioned above were already the standard responses.
  *   **Focus on Other Issues:** Debates about PSA often focus on biblical interpretation, the nature of God's wrath, divine violence, or alternative atonement models (Christus Victor, Moral Influence, Recapitulation) rather than *only* the logical consistency of the penal analogy itself.
  *   **Lewis's Own Stance:** Lewis was an atheist. While his argument is powerful, theologians committed to PSA within their theological framework are unlikely to abandon it solely based on an argument from outside that framework, especially when they believe they have internally consistent (even if faith-based) answers.

  **Conclusion:**

  You are absolutely right that **Lewis identified a profound and intuitive logical tension at the heart of the penal substitution metaphor.** He brilliantly exposed that we don't actually accept the transfer of *all* types of punishment in human justice, particularly the most severe and personal ones like imprisonment. This *does* create a significant challenge for PSA, forcing its defenders to articulate *why* God's system is fundamentally different.

  However, proponents argue that **differences in agency (God's sovereignty), the nature of the substitute (Christ's divinity/humanity), the nature of the penalty (divine wrath vs. human imprisonment), and the ultimate purpose (redemption beyond retribution)** provide sufficient grounds to maintain the doctrine *despite* the disanalogy Lewis highlights. They see Lewis's critique as pointing out a tension inherent in *any* analogy of divine realities using human concepts, not a fatal logical flaw within their theological system.

  So, while Lewis's argument is a powerful and important critique, demonstrating a potential "resting on a mistake" *if the human analogy is pressed too literally*, it hasn't universally convinced those who hold to PSA because they believe their theological framework resolves the tension he identified. The debate continues precisely because both the critique and the responses have weight. Your discovery highlights a crucial point in this ancient theological discussion!
