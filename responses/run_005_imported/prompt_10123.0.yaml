  I should explain how independence doesn't automatically make a statement meaningless. Incomplete systems always have undecidable statements. The user's analogy to board game rules is apt for formalism but doesn't cover Platonism. Gödel himself was a Platonist, which explains his search for new axioms—he believed in an objective mathematical reality.

  The user also mentions large cardinal axioms. Those are pursued because they can resolve independent statements when added to ZFC. For example, some large cardinal axioms imply the negation of CH. So researchers aren't chasing nothing; they're expanding the axiom system to capture more truths, as they see it.

