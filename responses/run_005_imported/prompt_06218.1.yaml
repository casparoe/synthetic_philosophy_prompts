answer: |-
  Here's your TA-style grading breakdown for the sample answer, following your requested format:

  **Overall Grade: B+ (17/20)**

  **Breakdown (Point-by-Point):**

  1.  **Tyranny Definition & Ranking:**
      *   **Accuracy:** Excellent. Correctly identifies tyranny as rule for private advantage vs. the common good. Accurately explains the ranking: tyranny worst because it serves *only* one interest, oligarchy serves a few, corrupt democracy serves many. Hits the core Thomistic reasoning perfectly.
      *   **Score:** 5/5

  2.  **Tyrant by Title vs. Tyrant by Exercise Distinction:**
      *   **Accuracy:** Excellent. Clear and precise distinction between usurper (no legitimacy, no obedience owed) and legitimately installed ruler who governs unjustly (disobey only unjust commands, removal by public authority). Perfectly captures Aquinas's nuanced position on obedience and removal.
      *   **Score:** 5/5

  3.  **De Regno Caution & Reasoning:**
      *   **Accuracy:** Very Good. Correctly identifies the *core* cautions: danger of private judgment leading to power grabs/chaos, risk of worse tyrant replacing the slain one (citing Aristotle correctly). Captures the essence of Aquinas's practical hesitation.
      *   **Minor Quibble:** Could slightly emphasize the *theological* weight Aquinas gives to established authority (even flawed) being divinely permitted, but the answer covers the primary political/philosophical reasons well.
      *   **Score:** 4.5/5 (Docked 0.5 for minor omission of theological context, though not strictly required)

  4.  **Attributions / Sources / Specific Claims (Locke Comparison):**
      *   **Accuracy: Problematic.** This is the answer's significant weakness.
          *   **"Ultimate authority rests with the people":** This is **flat-out wrong** for Aquinas. He emphatically grounds legitimate political authority in God/Natural Law, *not* popular sovereignty. Authority derives from God *through* the community's need for governance. The community *installs* the ruler for the common good and can *in extremis* depose a tyrant *if no superior exists*, but the authority itself isn't *inherently* or *ultimately* vested in the people in the Lockean sense of popular consent as the *foundation* of legitimacy. Aquinas sees the ruler as God's minister.
          *   **"Constitutional checks... let the community restrain or remove":** Partially correct *in spirit* but misattributed. Aquinas *does* advocate for a "mixed regime" (De Regno I.2, I.5) blending monarchy, aristocracy, and democracy elements precisely to *prevent* tyranny. He *does* say the community can depose a tyrant if it had the power to install him and if no superior authority exists. However, framing it as "pretty close to Locke" is **highly misleading**. Locke's theory is fundamentally *contractarian* and based on *popular sovereignty* and the *right of revolution* inherent in the people. Aquinas's framework is theological and hierarchical; removal is a last resort justified by Natural Law/the common good, *not* an inherent right flowing from popular consent. The mechanisms are implied to be orderly and public, but the *source* and *justification* of authority are fundamentally different.
      *   **Score:** 2.5/5 (Docked 2.5 points for the serious misrepresentation of Aquinas's theory of authority and the misleading Locke comparison).

  **Total Score: 17/20 (5 + 5 + 4.5 + 2.5)**

  **Final TA Comments:**

  "Strong answer overall! You nailed the core definitions of tyranny and its ranking, as well as the crucial distinction between the two types of tyrants and the obligations subjects have towards each. You also accurately captured Aquinas's primary practical and historical (Aristotle-influenced) reasons for caution regarding tyrannicide in *De Regno*.

  **The major deduction comes from the Locke comparison.** While both discuss removing bad rulers and the importance of the common good, the *foundation* of their political authority is radically different. Attributing 'ultimate authority resting with the people' to Aquinas is incorrect and misrepresents his theological/hierarchical framework. His discussion of constitutional mixture and community action is more about *practical safeguards* and *last-resort remedies* grounded in Natural Law/Divine authority, not popular sovereignty. Avoid anachronistic comparisons that impose later liberal democratic concepts onto medieval thinkers. Focus on Aquinas's own theological and Aristotelian context.

  This is a high B+ answer. Correct the misstep on authority foundations, and you'd have a solid A. Good prep for the midterm!"

