  The core tension: democracy’s ideals clash with real-world constraints. Carol’s ethics are compelling but logistically messy; Martin’s rules are tidy but morally shaky. Neither fully addresses scale (e.g., global buyers) or power imbalances (Millbrook’s lack of recourse). 

  Possible patches? Tiered influence (e.g., weighted votes for affected outsiders) or nested governance (regional councils for cross-border issues). But these require institutional innovation—democracy’s "boundary problem" persists because it’s inherently unsolvable within rigid jurisdictional boxes. 

