  We are ranking resolutions to the absent-minded driver paradox.
   The problem: A driver faces two identical intersections. He must exit at the second for the best outcome. 
     - Exiting at the first: worst (payoff 0)
     - Exiting at the second: best (payoff 4, for example)
     - Missing both: mediocre (payoff 1, for example)
   The driver cannot remember if he has passed an intersection. He must choose a probability p to exit at the current intersection (same at both, because he can't distinguish).

   The optimal fixed p (if chosen in advance) is 1/3. Why?
     - If at the first intersection, he exits with prob p -> gets 0.
     - If at the second intersection, he exits with prob p (then gets 4) or continues with prob 1-p (then gets 1).
     - But note: he doesn't know which intersection he is at. So the expected payoff, from the perspective of the start, is:
          P(at first) * [ p*0 + (1-p)* (payoff from second) ] 
          + P(at second) * [ p*4 + (1-p)*1 ]
     However, since the driver is absent-minded, when he is at the first intersection, he doesn't remember that he is at the first. He thinks he might be at the second. So from his perspective at an intersection, he assigns a probability q to being at the first and 1-q to being at the second? But note: the problem is that the driver cannot condition on having passed an intersection because he forgets.

   The paradox arises because if the driver, at an intersection, reasons that he is equally likely to be at the first or the second (which seems intuitive), then he would choose an exit probability that maximizes the expected payoff under that belief. But then the actual payoff when using that p might not be optimal, and moreover, the belief of being equally likely might not be consistent with the strategy.

   The resolutions:

