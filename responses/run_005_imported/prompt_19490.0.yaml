   1. **The ex-ante optimal strategy (fixed p)**: The driver, before starting, chooses a fixed p to use at every intersection. Then the expected payoff is:
          P(at first) * [ p*0 + (1-p) * (payoff at second) ] 
          but note: P(at first) = 1 (because he starts at the first) and P(at second) = 1-p (because he must have passed the first without exiting to get to the second).
