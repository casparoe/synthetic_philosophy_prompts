  ---

  ### Justifications

  #### **Move 1: M's Initial Argument**  
  **Score: 1 (Right)**  
  M correctly identifies a critical flaw in total utilitarianism under infinite cosmology: the theory loses action-guidance when the universe contains infinite net value. This "paralysis" is a well-documented problem (e.g., in Bostrom's work), and M rightly stresses that an ethical theory failing to rank curing a plague above idleness is pragmatically useless. The call for alternatives (e.g., person-affecting views) is reasonable. However, the argument is not maximally compelling (-2) because it prematurely dismisses potential fixes (which K offers).  

  #### **Move 2: K's Proposed Fix**  
  **Score: 1 (Right)**  
  K’s solution—ranking acts by their finite causal differences—effectively avoids paralysis for local actions like curing a plague. This aligns with "difference-making" principles in decision theory and salvages action-guidance without complex amendments. It earns a +1 because it is coherent and addresses the immediate problem, though it implicitly revises total utilitarianism (as M later argues).  

  #### **Move 3: M's Rebuttal on Boundary-Drawing**  
  **Score: 2 (Clearly Right)**  
  M correctly exposes a tension in K’s fix: total utilitarianism traditionally rejects arbitrary boundaries (e.g., discounting welfare based on distance), yet K’s "causal contribution" restriction does exactly this. This is a major revision, not a minor patch, as it abandons the core totalist commitment to impartial aggregation. M scores +2 for highlighting this inconsistency and forcing K to defend the non-arbitrariness of the boundary.  

  #### **Move 4: K's Defense of Difference-Making**  
  **Score: 2 (Clearly Right)**  
  K successfully reframes the boundary as non-arbitrary: comparing acts inherently focuses on differential effects, even in finite cases. Holding fixed non-varying welfare is standard in causal decision theory (e.g., in Savage’s framework). K’s move is not an ad hoc concession but a clarification of how utilitarianism evaluates acts. This earns +2 for resolving M’s objection and reinforcing the fix’s coherence.  

  #### **Move 5: M's Duplication Challenge**  
  **Score: -1 (Mistaken)**  
  M’s duplication argument fails. In K’s framework, an agent only sums welfare changes within their causal reach (e.g., their light cone). Duplicates outside this region are "held fixed" during counterfactual comparison—their identical actions cancel out in the difference-making calculation. Thus, paralysis does not "reappear one level up." M incorrectly assumes totalism requires global summation, but K’s fix explicitly avoids this. The score is -1 (not -2) because M’s point about duplication is logically valid but misapplied to K’s local model.  

  ---

  ### Key Unaddressed Issues  
  1. **Non-Causal Aggregation**: Neither addresses whether total utilitarianism could use non-causal methods (e.g., density measures or hyperreal utilities) to handle infinities, bypassing paralysis without locality constraints.  
  2. **Epistemic Limitations**: Both ignore that in practice, agents lack knowledge of cosmic infinity/duplication. A pragmatic totalist might default to local effects without revising the theory’s foundations.  
  3. **Alternatives to Totalism**: M advocates person-affecting views but doesn’t engage with their own problems (e.g., the non-identity problem), leaving the critique one-sided.  

  **Overall**: K’s difference-making fix robustly handles the plague example and withstands M’s objections. However, M successfully forces K to abandon classical totalism, revealing that the "fixed" theory is a hybrid (local causal utilitarianism) with distinct philosophical commitments.
