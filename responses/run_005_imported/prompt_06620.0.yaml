  ## Bentham's Irregular Utilitarianism: A Coherent Hedonism?

  Jeremy Bentham's unpublished manuscripts on sexual morality, particularly "Offences Against One's Self," stand as a remarkably progressive utilitarian defense of decriminalizing consensual same-sex acts between adults. His core argument is ruthlessly hedonistic: such acts generate pleasure without causing tangible harm to others, and criminalization inflicts unnecessary pain driven solely by irrational "antipathy" and ascetic prejudice. His comparison of sexual taste to culinary preference powerfully underscores his commitment to pleasure-neutrality. Yet, Bentham simultaneously labels these acts "irregularities," framing them as departures from the "natural or proper use" of sexual faculties. This raises a critical question: Can Bentham, the arch-critic of natural law and asceticism, consistently hold both the harmlessness argument *and* the irregularity designation within his utilitarian framework? Assessing the coherence requires weighing strong considerations on both sides.

  **The Case for Consistency: Statistical Description and Utilitarian Neutrality**

  1.  **"Irregular" as Purely Statistical:** Bentham might intend "irregular" solely as a neutral, descriptive term denoting statistical rarity or deviation from the majority pattern. Utilitarianism, focused on consequences, is fundamentally agnostic about the *source* of pleasure as long as it's harmless. Noting that a preference is statistically unusual is a factual observation, not a moral judgment. Just as a utilitarian might note that enjoying extremely spicy food is statistically irregular without condemning it, Bentham could be making a similar sociological observation about sexual behavior. This interpretation aligns with his rejection of moralizing based on conformity.
  2.  **Focus on Consequences Trumps Terminology:** Bentham's core ethical action lies in his consequentialist calculus. His vehement rejection of criminalization *because it causes net harm* demonstrates that the label "irregular" carries no practical weight in his ethical or legal prescriptions. The term might reflect contemporary common parlance without implying any intrinsic negative value within his system. His attack on antipathy and asceticism shows he explicitly rejects the *moral significance* others attach to such irregularity. The label, in this view, is a descriptive relic, stripped of normative force by his hedonistic calculus.
  3.  **Rejection of Teleology Implied Elsewhere:** Bentham's broader philosophy relentlessly attacks natural law theories precisely for smuggling in ungrounded teleological purposes. His famous dismissal of natural rights as "nonsense upon stilts" stems from their lack of empirical, utilitarian grounding. Applying a teleological standard to sexuality would be fundamentally inconsistent with this foundational stance. It seems implausible he would knowingly reintroduce the very framework he dismantles elsewhere. The "irregularity" label, therefore, must be interpreted non-teleologically.

  **The Case for Inconsistency: The Scent of Teleology**

  1.  **"Natural or Proper Use" Inherently Teleological:** The specific language Bentham uses – "departures from the **natural or proper use** of the relevant faculties" – is deeply problematic. The concept of a "proper use" implies a normative standard inherent to the faculty itself, a *telos* or purpose. This is the essence of the natural law/teleological thinking Bentham explicitly rejects. What defines the "proper use" of sexual faculties if not some assumed purpose (e.g., procreation)? Bentham's own hedonism suggests the "proper" use is whatever generates pleasure without harm, rendering the concept of a singular "proper use" incoherent within his system.
  2.  **Contradiction with the Culinary Analogy:** Bentham's powerful analogy comparing unusual sexual tastes to unusual food tastes highlights the inconsistency. We readily accept that taste in food is subjective and varied; labeling a preference for oysters over steak as an "irregularity" implying a departure from the "proper use" of the digestive faculty would be absurd. Yet, this is precisely what he does with sexuality. The analogy demands strict neutrality: if food tastes are morally neutral variations, so too should sexual tastes be. The "irregularity" label applied only to the latter betrays an unacknowledged double standard.
  3.  **"Irregularity" as a Conduit for Prejudice:** Even if Bentham *intended* "irregular" purely statistically, the term, especially when coupled with "natural or proper use," carries unavoidable normative baggage within the historical and conceptual context of sexuality. It subtly reinforces the very "antipathy" he condemns by framing the behavior as a deviation from a presumed norm. This language risks reimporting the ascetic prejudice he attacks, as asceticism often pathologizes non-procreative or "unnatural" pleasures. A truly consistent hedonistic utilitarian, having demolished the foundations of asceticism and natural law, should avoid terminology so easily co-opted by or resonant with those discredited frameworks. The persistence of this language suggests Bentham hadn't fully extricated himself from the prevailing moral climate, leaving a conceptual residue inconsistent with his own radical principles.

  **Verdict: An Inconsistent Blind Spot**

  While the argument for interpreting "irregular" as a harmless statistical descriptor holds superficial appeal, the stronger case demonstrates an inconsistency within Bentham's position. The specific phrase "natural or proper use" is the fatal flaw. This language is intrinsically teleological, positing a normative purpose for sexual faculties that Bentham's hedonistic utilitarianism explicitly denies. Pleasure, not conformity to a presumed natural function, is his sole inherent good.

  The contradiction is starkly illuminated by his own culinary analogy. Applying the "irregularity/proper use" framework to food preferences reveals its absurdity; its application to sexuality reveals an unexamined bias. Although Bentham heroically dismantles the arguments *for* criminalization based on harm, antipathy, and asceticism, his retention of the "irregularity" framework, particularly with its teleological undertones, represents a failure to fully apply his hedonistic neutrality to the *description* of the pleasure itself. It suggests a conceptual blind spot, a lingering influence of the very prejudices he intellectually rejected, preventing him from placing same-sex acts on the truly "equal footing" demanded by his core utilitarian principles. Therefore, by Bentham's own lights – his rejection of natural law, asceticism, and the principle of antipathy as bases for morality – his designation of harmless same-sex acts as "irregularities" constitutes an inconsistent concession to the teleological thinking his philosophy sought to eradicate.
