answer: |-
  Here’s a five-minute toast weaving your sister’s assurance-based view into a warm, funny, and accessible tribute. It avoids "tradition," "contract," and mystical bonds while honoring her Scanlon-inspired perspective. The philosophy cohort will recognize the cues ("assurance," "owe," "deliberate invitation"), while relatives will hear a heartfelt take on trust and commitment.

  ---

  **(Clink glass lightly, smile warmly)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], the proud and slightly terrified older sibling of our brilliant bride. When [Sister’s Name] asked me to speak, she gave me strict instructions: *‘No clichés about ancient traditions. No talk of contracts. And absolutely no magical promise fairies.’* **(Pause for laughs)** Turns out, my sister—the philosopher—has strong opinions on what makes a promise *real*. Who knew?  

  But seriously, she’s spent years studying this, and she’s taught me something profound. See, [Sister’s Name] believes promises aren’t about rituals or rules. They’re about *people*. When you make a promise, you’re not tapping into some cosmic rulebook. You’re looking someone in the eye and saying, *‘You can trust me. I’m giving you my word, and I want you to rely on it.’* It’s a deliberate act of inviting trust. And when you break that? It’s not just breaking a rule—it’s breaking *their* trust. You’ve asked them to lean on you, and then you pull the ground away.  

  **(Turn to the couple, soften tone)**  
  That’s why today isn’t about two people following a script. It’s about [Sister’s Name] and [Partner’s Name] standing here and saying, clearly and freely: *‘I choose you. I ask you to trust me with your heart, your dreams, your weird breakfast habits.’* **(Light chuckle)** And in return, they’re saying: *‘I will treasure that trust. I will be your safe place.’* That’s the quiet power of what they’re doing. No invisible forces. Just two people, choosing every day to build a world where the other *knows* they’re held.  

  **(Add humor)**  
  Now, I’ve seen this in action. When [Sister’s Name] was ten, she promised to help me ‘borrow’ cookies before dinner. I trusted her lookout skills. But when Mom walked in, my sister coughed *so loudly* I got caught. **(Shake head playfully)** She looked me dead in the eye after and said: *‘I owed you better. I invited your trust, and I exploited it for cookie justice.’* **(Pause for laughs)** Even then, she was preparing for her dissertation.  

  **(Shift to heartfelt)**  
  Jokes aside, that’s what marriage looks like to them. Not grand oaths sealed by society, but a thousand small assurances: *‘I’ll listen when you’ve had a rough day.’ ‘I’ll remember your coffee order.’ ‘I’ll be there when you’re scared.’* Each time they say *‘I’ve got you’*—and mean it—they’re building something irreplaceable. Because the beauty isn’t in the words; it’s in the *doing*. It’s in knowing your person *wants* you to rely on them, and they’ll honor that gift.  

  **(Raise glass)**  
  So let’s raise a glass to [Sister’s Name] and [Partner’s Name]. Not because they’re bound by rules, but because they’ve chosen to owe each other everything. May you always invite each other’s trust—and may you always, always treasure it. To love built on assurance!"  

  **(Smile, clink, and lead applause)**  

  ---

  ### Why This Works  
  1. **Philosophy Nods for Cohort**:  
     - "Deliberate invitation of trust," "owe," "exploited trust," and "not rules" signal Scanlon’s view.  
     - Contrast with "magical promise fairies" (rejects mysticism) and "not tapping into a cosmic rulebook" (rejects Humean conventionalism).  

  2. **Accessible for Relatives**:  
     - Uses everyday examples (cookies, coffee, rough days) to ground abstract ideas.  
     - Focuses on universal themes: choice, trust, and daily acts of care.  

  3. **Avoids Forbidden Frameworks**:  
     - No mention of "tradition," "institution," "contract," or "vows as ritual."  
     - Replaces "mystical bond" with tangible actions ("build a world," "thousand small assurances").  

  4. **Tone & Length**:  
     - Humor (cookie story) lightens academia.  
     - Heartfelt closing ties theory to marriage’s emotional core.  
     - ~650 words: reads as 5 minutes with pauses.  

  **Delivery Tip**: Speak slowly when explaining the philosophy—pause after "inviting trust" and "owe"—so it lands clearly. Your sister’s cohort will lean in; relatives will feel the warmth. And if you tear up at the end? Even better. Congrats to your sister!
