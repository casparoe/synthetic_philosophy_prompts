prompt: |-
  So here's a weird one from my actual day job: I cover science and ideas for a living, but I also sit on my paper's standards committee, and we're deadlocked. Our rule has always been that two independent, well-placed sources make a claim 'confirmed' enough to print. Now we've got two former lab staffers, seperately, saying a well-known researcher faked the data behind a promising cancer trial -- if we're wrong this ends someone's career. Half the committee says two sources is two sources; the bar for 'confirmed' doesn't move just because the story got more explosive, and whether to slow down anyway is a separate question about caution, not about what we know. The other half says thats backwards -- something this consequential needs more evidence before we're entitled to call it 'confirmed' on the same two anonymous sources that'd clear a routine story. Can you draft the short memo I'll bring to Monday's meeting? It should recommend an actual sourcing policy for high-stakes claims like this, and take the losing side's best argument seriously instead of just waving it off.
