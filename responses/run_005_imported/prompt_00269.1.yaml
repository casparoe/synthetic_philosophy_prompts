  So I've been reading about the axiom of choice and I get the basic pitch (picking one element from each set in a collection, even infinite collections) but the thing that's messing with my head is the well-ordering theorem. AC apparently implies the reals can be well-ordered, but nobody can actually exhibit such an ordering, and it feels like it should be impossible given how weird and dense the reals are. Can you give me an intuitive gut-level explanation for why AC leads to this, without just walking me through the formal Zorn's lemma proof step by step? Like why does "you can always pick an element" translate into "you can order literally everything with no infinite descending chains"?
