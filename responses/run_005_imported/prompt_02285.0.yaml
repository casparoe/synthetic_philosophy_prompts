  So over the weekend I got into it with my friend Priya about Newton, of all people—this started because she'd just watched some documentary on his secret heresy stuff (the anti-trinitarian thing, keeping it hidden his whole life so he wouldn't loose his Cambridge fellowship) and we ended up down a rabbit hole into the General Scholium he tacked onto the Principia. There's this bit where he basically argues that being the designer or first cause of the universe isn't enough to count as "God" in any real sense — you need dominion, ongoing rule over things, otherwise what you've got is just fate and nature with a fancier name. And apparently this wasn't just abstract theology for him: in the Opticks he says straight out that the mutual gravitational tugging between planets and comets is slowly messing up the system and it'll eventually need a "reformation," basically implying God has to periodically step back in and fix it. Which is exactly the thing Leibniz mocked him for in the letters to Princess Caroline/Clarke — something like, what kind of watchmaker builds a watch that needs him to keep coming back and winding it, that's not a perfect craftsman, that's a bad one.

  Priya's whole argument was that this "dominion" theology is basically fake depth — it's really just a physics claim (the solar system is unstable and needs fixing) wearing a theological costume, and since Laplace and Lagrange later showed the wobbles are mostly self-correcting, the entire argument is dead, there's nothing left to defend once you take away the mistaken orbital mechanics. I argued back that the dominion stuff is actually a separate, independent metaphysical claim about what the word "God" even picks out (a designer-who-then-walks-away isn't really a god at all on Newton's definition, regardless of whether the orbits happen to be self-correcting), so it doesn't actually live or die with the specific astronomy. We went back and forth on this for like two hours over pizza and got nowhere.

  Can you write me an essay that actually adjudicates this? I want it to go past the stuff everyone already knows about Newton (heretic, alchemist, predicted the world won't end before 2060, etc.) and really dig into the structure of the General Scholium argument itself — and bring in the Leibniz-Clarke exchange properly, not just the watch line, since I vaguely remember there's also some fight in there about space being the "sensorium" of God that might be relevant to whether Newton's God is supposed to be transcendent or weirdly bound up with the physical universe itself. Weigh both Priya's reading and mine fairly, but don't wimp out at the end — actually tell me who's got the better of the argument, and why.
