prompt: |-
  ok so im writing a piece on that torture-vs-dust-specks thing that rationalist and EA forums just refuse to let die (one person tortured for 50 years vs some absurdly huge number of people each getting a single dust speck in their eye, and whether the specks "win" once you add it all up), and I wanted to trace where this add-everything-up move actually comes from historically. Ended up back at Bentham's original felicific calculus. Here's the bit that's got me stuck, from Chapter 4 of his 1789 Introduction to the Principles of Morals and Legislation:

  "IV. To a number of persons, with reference to each of whom the value of a pleasure or a pain is considered, it will be greater or less, according to seven circumstances: to wit, the six preceding ones; viz. 1. Its intensity. 2. Its duration. 3. Its certainty or uncertainty. 4. Its propinquity or remoteness. 5. Its fecundity. 6. Its purity. And one other; to wit, 7. Its extent; that is, the number of persons to whom it extends, or, in other words, who are affected by it.

  V. To take an exact account then of the general tendency of any act, by which the interests of a community are affected, proceed as follows. Begin with any one person of those whose interests seem most immediately to be affected by it, and take an account, 1. Of the value of each distinguishable pleasure which appears to be produced by it in the first instance. 2. Of the value of each pain which appears to be produced by it in the first instance. 3. Of the value of each pleasure which appears to be produced by it after the first. This constitutes the fecundity of the first pleasure and the impurity of the first pain. 4. Of the value of each pain which appears to be produced by it after the first. This constitutes the fecundity of the first pain, and the impurity of the first pleasure. 5. Sum up all the values of all the pleasures on the one side, and those of all the pains on the other. The balance, if it be on the side of pleasure, will give the good tendency of the act upon the whole, with respect to the interests of that individual person; if on the side of pain, the bad tendency of it upon the whole. 6. Take an account of the number of persons whose interests appear to be concerned, and repeat the above process with respect to each. Sum up the numbers expressive of the degrees of good tendency which the act has, with respect to each individual, in regard to whom the effect of it is good upon the whole; do this again with respect to each individual in regard to whom the effect is bad upon the whole. Take the balance, which, if on the side of pleasure, will give the general good tendency of the act with respect to the total number of the community of individuals concerned; if on the side of pain, the general evil tendency with respect to the same community."

  So step by step he's got you score each pleasure/pain for one person on those seven circumstances, net it out, and then -- step 6 -- just go do that for everybody else and add all the individual balances into one grand total, full stop. What I cant figure out is whether that step is already quietly assuming the answer to the dust specks question, by treating a billion tiny, thinly spread pains as straightforwardly poolable against one person's concentrated agony -- or whether "intensity" (circumstance 1) is actually doing enough independent work in his own system that Bentham could, in principle, refuse to let enough specks outweigh the torture. Basically: is the linear aggregation baked into this passage, or am I reading 21st century anxieties into an 18th century bookkeeping exercise?
