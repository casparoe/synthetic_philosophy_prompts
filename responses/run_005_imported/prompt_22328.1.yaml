  Ah! And that's precisely how it rebuts Clifford. Clifford treats all insufficient-evidence beliefs as equally immoral. James shows some beliefs are practical necessities for creating verifiable outcomes. The "immorality" charge ignores how social reality functions. For religious hypotheses, James will later argue faith similarly enables accessing potential truths that can't be passively observed.

