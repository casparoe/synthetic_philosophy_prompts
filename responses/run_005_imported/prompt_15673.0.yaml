answer: |-
  That's an excellent set of questions – you've hit on the core conceptual tension surrounding time's arrow and entropy. Let's break down Eddington's passage and your concerns:

  **1. Deconstructing Eddington's Passage:**

  *   **The Claim:** Eddington asserts that the *only* fundamental, objective distinction between past and future provided by physics is the direction in which randomness (entropy) increases.
  *   **Is it Substantive?** Yes and no, but mostly **yes**.
      *   **The "No" (Your First Worry):** There *is* a semantic element. He *is* defining the "future" direction operationally as the direction of increasing entropy *from our current state*. If we found ourselves in a state where entropy decreased as we moved away in *both* temporal directions, Eddington's definition wouldn't pick out a unique "future" from that point. However, this isn't the situation we find ourselves in.
      *   **The "Yes" (Why it's Substantive):** Crucially, Eddington's point is **not invented; it's observed and deduced.** Physics *discovers* that:
          *   There exists a quantity called entropy that reliably increases for isolated macroscopic systems.
          *   This increase defines a consistent temporal direction *throughout the observable universe*.
          *   Crucially, **no other fundamental physical law** (Newton's laws, Maxwell's equations, Schrödinger's equation, General Relativity) distinguishes past from future. They are time-symmetric (or T-invariant). The *only* law that breaks this symmetry is the Second Law of Thermodynamics (ΔS ≥ 0 for isolated systems). His "fundamental contention" is that the introduction of randomness (increase in S) is irreversible.
  *   **The Key Insight:** Eddington is highlighting that physics provides an *operational, physical definition* for the direction of time based on an observed *irreversible process* (entropy increase). Before thermodynamics, time direction was purely a matter of perception or philosophy within physics. Eddington points out that entropy provides the *physical grounding* for the arrow of time. The passage *isn't* "discovering" time; it's identifying the *physical signature* that distinguishes its direction.

  **2. Your Two Worries: Are They the Same?**

  *   **Worry 1 (Semantic/Definitional):** Is Eddington just defining "future" as "high-entropy direction," making the increase tautological?
  *   **Worry 2 (Physical Asymmetry):** If microscopic laws are time-symmetric, why does entropy only increase towards the future *from our current state*? Why not symmetrically?

  **They are deeply related but distinct concerns:**

  1.  **Worry 1** challenges the *meaningfulness* or *substantive content* of Eddington's claim ("Is this just wordplay?").
  2.  **Worry 2** challenges the *physical origin* of the observed *asymmetry* that Eddington relies upon ("*Why* is entropy increasing only one way, given symmetric laws?").

  **Worry 1 is largely resolved** by recognizing that the increase of entropy is an *empirical observation*, not a definitional trick. We observe entropy increasing as we move away from the present in one temporal direction (which we call "future") and decreasing (or being lower) as we move in the other ("past"). Eddington is stating that this observed asymmetry *is* the physical basis for the arrow.

  **Worry 2 cuts to the heart of the puzzle** and is where the real physics lies. Eddington's passage *assumes* this asymmetry exists but doesn't *explain* why it exists given time-symmetric laws. This is the **Boltzmann-Schuetz Objection** you vaguely recall. If the fundamental laws are symmetric, shouldn't entropy be just as likely to increase towards the past as towards the future from any given moment?

  **3. The Standard Reply: The Past Hypothesis & Boundary Conditions**

  This is where the **Past Hypothesis (PH)** comes in. It's the standard resolution to Worry 2:

  *   **The Core Idea:** The reason entropy increases towards the future *from our current state* is not because the laws prefer it, but because of a **special, low-entropy boundary condition in the past**. The universe started in an extremely low-entropy state (near the Big Bang).
  *   **How it Resolves the Puzzle:**
      1.  **Time-Symmetric Laws:** The microscopic laws governing particle interactions are reversible. If you reversed all velocities exactly (and did the CPT transform in QFT), the system would retrace its path, entropy would decrease.
      2.  **The Crucial Constraint:** However, the set of possible states the universe can be in is *massively* constrained by the fact that it evolved from a very specific, highly ordered (low-entropy) state in the distant past.
      3.  **Implication for "Now":** Given that we *know* the past had much lower entropy (from cosmological evidence like the CMB, nucleosynthesis, structure formation), the *only* direction entropy *can* consistently increase from our current state is towards the future. The past direction is "blocked" by the low-entropy initial condition. The laws *allow* entropy to decrease, but the overwhelmingly probable trajectory *from a low-entropy start* is towards higher entropy. The PH breaks the temporal symmetry by imposing a condition at one temporal boundary (the beginning).
  *   **Analogy:** Imagine a box of gas molecules starting all crammed into one corner (very low entropy). The laws of motion are time-symmetric. However, *given that specific starting point*, the overwhelmingly likely future evolution is for the gas to spread out and fill the box (entropy increases). It's *possible*, but *vanishingly improbable*, that the gas molecules would spontaneously all rush back into the corner from a spread-out state *without* having started from that low-entropy state. The PH provides the starting point that breaks the symmetry.

  **4. Does the Past Hypothesis *Truly* Resolve the Puzzle?**

  This is where opinions diverge:

  *   **The Pragmatic/Explanatory View (Majority View):** Yes, the PH is considered the essential piece that resolves the core puzzle of why entropy increases towards the future *despite* time-symmetric laws. It provides a coherent physical explanation consistent with known laws and observations. It successfully deflects the Boltzmann-Schuetz objection by anchoring the asymmetry in a boundary condition. It explains why we don't see shattered cups spontaneously reassemble or heat flow from cold to hot objects in isolated systems.
  *   **The "Relocated Mystery" View (Your Second Insight):** This view acknowledges the PH's explanatory power *within* our universe but points out that it **merely relocates the ultimate mystery**. The profound question becomes: **Why was the initial entropy of the universe so incredibly low?** What selected that specific, highly improbable initial state? This is arguably a deeper mystery about the origin of the universe and its fundamental laws.
      *   Is the PH a fundamental law itself?
      *   Is it a consequence of quantum gravity or inflation?
      *   Does it require a multiverse explanation?
      *   Is it just a brute fact?

  **Conclusion:**

  1.  **Eddington's Passage:** It *is* substantive. It identifies the observed increase of entropy as the *only physical basis* for distinguishing past from future, given the time-symmetry of other fundamental laws. It's not merely a definition; it's a statement about what physics *discovers* defines temporal direction.
  2.  **Your Worries:** They are related but distinct. Worry 1 (semantic) is largely addressed by recognizing the empirical basis of entropy increase. Worry 2 (physical asymmetry) is the profound puzzle.
  3.  **Resolution (Past Hypothesis):** The standard resolution is the Past Hypothesis – a low-entropy initial condition. This breaks the temporal symmetry imposed by microscopic laws and explains why entropy consistently increases towards the future from our vantage point.
  4.  **The Lingering Mystery:** While the PH resolves the *how* of the arrow of time within our universe's evolution, it transforms the puzzle into the *why* of the initial condition. **"Why was entropy so low to begin with?" is indeed the profound, unresolved question that the PH points towards.** It's considered the best current explanation for the observed arrow, but it doesn't feel like a complete "first principles" derivation for many, precisely because it pushes the ultimate explanation to cosmology and the very beginning.

  So, your instincts are excellent. Eddington identifies the *what* (entropy defines the arrow). The Past Hypothesis provides the *how* within known physics (boundary condition). But the *ultimate why* (why that boundary condition?) remains one of the deepest questions in physics and cosmology.
