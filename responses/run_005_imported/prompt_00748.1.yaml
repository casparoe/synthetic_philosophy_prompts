prompt: |-
  Ok I need an outside opinion on something because I've been stewing on it since Thanksgiving. My uncle has some pretty out-there beliefs (won't get into specifics, you can probably imagine the type), and whenever anyone pushes back on any single one of them, he doesn't really defend that belief on its own — he just points out how it fits together with everything else he believes, like each one props up the next and the whole thing hangs together as a package. I called this out as circular reasoning and figured that settled it. But my cousin, who's doing a philosophy PhD, jumped in and said what he's doing is basically "coherentism," which she swears is an actual serious position that real epistemologists defend, right up there with foundationalism, as one of the standard answers to something called "the regress problem" (apparently the issue is that any reason you give for a belief needs its own reason, and that needs a reason, and so on forever, unless something stops the chain).

  I went and read a bit about this on my own afterward, and yeah, coherentism does seem to be a real, respected position, which is honestly throwing me a little. Because as far as I can tell, if a hundred beliefs are just propping each other up in a loop with nothing outside the loop anchoring any of it, that's still circular — the circle being bigger doesn't seem like it should make it stop being a circle. So is my cousin basically right that a professional epistemologist would look at my uncles reasoning and go "yep, that's coherentism, that's legitimate"? Or is there something about how coherentism is actually supposed to work that's different from what I'm picturing, where his reasoning wouldn't actually count even by coherentist standards? I'd definately like to actually understand this rather than just assume I'm right because it's my uncle lol.
