  The reasoning must show why the paradox doesn't invalidate real-world implementation: students aren't monolithic rational agents, and instructors don't game their choices. Empirical success (quizzes still surprise) proves the concept works despite the theoretical puzzle. 

  The tone should be academic but decisive, avoiding philosophy jargon where possible. The committee needs actionable guidance, not just theory. Highlighting that policies exist to serve learning outcomes, not satisfy every logical edge case, might help. 

