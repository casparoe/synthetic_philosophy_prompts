  Quantum entanglement presents nonlocal correlations. Lewis saw this as a threat to his supervenience. But would Hume see it the same? Hume's skepticism was about necessary connections, not correlations per se. He'd likely accept correlations as observed regularities without inferring metaphysical necessities. So, nonlocal correlations wouldn't threaten Hume because he didn't base his views on local separability as an ontological commitment.

