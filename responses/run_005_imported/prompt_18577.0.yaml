prompt: |-
  Next week's guest on my little philosophy podcast wrote the book everyone cites on "transformative experience" -- the idea that stuff like having your first kid (or the vampire case she always gets asked about) is both epistemically and personally transformative, so normal expected-utility reasoning can't actually tell you whether to do it ahead of time. I don't want to waste the episode on her just re-explaining vampires again. Can you draft like 7 or 8 questions that push past that -- I want at least one that presses on whether choosing "for the sake of revelation" is a genuinely distinct rational basis for a choice or just a fancy label for picking arbitrarily, one on what stops basically any big decision from counting as transformative once your looking for it that way, and one on what it even means to endorse or regret the choice afterwards given the self doing the endorsing isn't the self who chose. Add a quick follow-up to each keyed to whatever answer she's most likely to give.
