  ## Mine Shaft Showdown: Taurek vs. Scanlon

  **Setting:** Dust hangs thick in the air. The groans of shifting rock echo from two unstable mine shafts. **Elara (Hardline Taurekian)** crouches near the entrance to Shaft A, where one miner is trapped. **Marcus (Scanlonian Contractualist)** stands by Shaft B, where five miners are buried. A rescue winch can only be deployed down one shaft before collapse.

  **Elara:** (Eyes locked on Shaft A) Marcus, stop fiddling! We flip a coin. Heads, save the one. Tails, save the five. Taurek was right. Saving the five *just because there are more* treats them as a sum, a bloc. But it's *individuals* down there, each with an equal claim not to be abandoned. We can't aggregate their claims against the one. Coin. Now.

  **Marcus:** (Hand hovering near the winch control) Hold on, Elara. It’s *not* simple aggregation. Scanlon’s move avoids that. Start with the core case: *one* vs. *one*. That’s a genuine tie. No reason to prefer either. We *would* flip a coin. Agreed?

  **Elara:** (Impatiently) Fine. Hypothetical symmetry. But it’s *not* one vs. one. It’s five vs. one. Your ‘core case’ is irrelevant smoke.

  **Marcus:** No, it’s the foundation. The tie in the 1v1 case means *neither* individual has a claim that *overrides* the other’s claim for rescue. Now, add the *second* person to the larger group. That person *also* has a claim not to be abandoned. Crucially, their claim *breaks the tie* established in the core case. Saving the group with two people instead of the single person isn’t saying ‘two claims outweigh one claim’. It’s saying: the tie between the first pair is broken by the existence of the *second* person’s *separate* claim. No summing required.

  **Elara:** (Scoffs, dust swirling as she gestures towards Shaft B) Separate claim? Marcus, look me in the eye. When that *second* person’s claim ‘breaks the tie,’ what *is* the mechanism? Why does *their* claim break it? It only ‘breaks the tie’ *because* it tips the scales *in favor of the larger group*. You’re adding weight! That second claim isn’t just sitting there neutrally; it’s *functioning* as an additional weight on the scale against the single person. That *is* aggregation! You’ve just disguised the summing by calling it ‘tie-breaking’. The ‘tie’ only exists in your artificial 1v1 construct. In reality, the minute you let that second person ‘break the tie’, you’ve allowed their claim to be counted *alongside* the first person in their group, *against* the one in the other shaft. It’s bloc-thinking wearing contractualist pajamas!

  **Marcus:** (Takes a breath, forcing calm) It’s not about weight on a scale, Elara. It’s about *reasons for action* and what no one could reasonably reject. Consider the perspective of the single person in Shaft A. In the 1v1 case, they couldn’t reasonably reject a coin flip; their claim is equal. Now, add the second person in Shaft B. The single person *can* reasonably reject a principle that saves *only* the single person when there are *two* equally endangered people elsewhere. Why? Because saving only the single person ignores the *distinct, additional* claim of the second person entirely. The single person isn’t being asked to accept less *weight*; they’re being asked to accept a principle that arbitrarily ignores the existence of other, equally valid claims. The ‘tie-breaker’ isn’t an added weight; it’s the *existence* of an additional claim that makes the situation *asymmetrical* compared to the core tie. Saving the two doesn’t aggregate; it responds to the *absence of symmetry* caused by the extra claim.

  **Elara:** (Leans forward, intensity undimmed) Ah! There it is! ‘*Additional* claim’. ‘*Absence of symmetry*’. You’re still quantifying, Marcus! You’re still treating the claims as discrete units that change the moral landscape by their *number*. The minute you say the *second* person makes it *asymmetrical*, you’ve conceded that the *quantity* of claims is doing the work! How is that ‘absence of symmetry’ defined, if not by counting? One claim vs. one claim: symmetric. One claim vs. *more than one* claim: asymmetric. The asymmetry *is* defined by the number! And that asymmetry is *precisely* what gives you the reason to save the larger group. You’re using the *number* (the count of claims) to determine the moral outcome. Scanlon tries to hide the math behind ‘tie-breaking’ and ‘asymmetry’, but the numbers are still driving the engine. Taurek’s point stands: you are, functionally, allowing the claims of the many to override the claim of the one *because* there are more of them. The ‘separateness’ of the claims is preserved only in the *description*, not in the *moral force* applied. Their force is pooled against the single individual. That *is* aggregation. Your contractualist framework just provides a narrative wrapper for the same consequentialist calculus Taurek rejects. The rock doesn’t care about your narrative; the one dies *because* there are five.

  **Marcus:** (Looks grimly between the shafts, then back at Elara) The narrative *is* the substance. The force comes from the *reason-giving* nature of individual claims within a framework of mutual justification. The single person *can* see why saving the five is justified – not because five is a bigger number, but because saving the five responds to five distinct claims that *each*, individually, constitute a reason no one in their position could reasonably reject *in this specific comparative context*. The ‘asymmetry’ isn’t a numerical ghost; it’s the practical consequence of multiple, equally valid claims existing where a tie-breaker is needed. But... (He pauses, hand tightening on the winch lever) ...I concede this: if the *only* way you can understand the ‘tie-breaking’ force of the additional claims is as *quantitative weight*, then yes, from that perspective, it will always look like aggregation. Scanlon’s move tries to build justification from the individual up, without summing. Whether you see it as succeeding or just hiding the sum depends on whether you believe moral reasons generated by distinct individuals in a comparative rescue scenario can combine to break a tie *without* becoming a utilitarian bloc. I believe they can. You see the ghost of aggregation regardless.

  **Elara:** (A bitter smile) Exactly. The ghost is real, Marcus. You’ve built a machine that counts, even if you call the gears ‘tie-breakers’ and ‘asymmetries’. Taurek saw the rot at the core: you can’t justify letting the one die *to* the one, except by invoking the greater number. And that invocation *is* the aggregation. Save who you will. But know that by choosing Shaft B, you *are* counting. The math is just in the basement. (She turns her back, staring intently at Shaft A).

  **(Marcus hesitates for a split second, the groans of the mine growing louder, then decisively throws the winch lever towards Shaft B. The machinery whirs to life as rock dust showers down.)**

  ## Key Philosophical Exchange Recap
  *   **Taurekian Charge (Elara):** Scanlon's tie-breaking relies on the *number* of additional claims to create asymmetry/break the tie. This functionally aggregates claims by letting quantity determine the outcome against the single individual.
  *   **Scanlonian Defense (Marcus):** The additional claims provide *separate reasons* that make the situation qualitatively different (asymmetrical) from the core tie. Saving the larger group responds to these distinct reasons; no individual can reasonably reject a principle that acknowledges all claims present.
  *   **Taurekian Response (Elara):** The "asymmetry" Scanlon relies on is *defined* by the number of claims. The "separate reasons" functionally *combine* as quantitative weight against the single claim. The language of tie-breaking and asymmetry disguises but does not eliminate the underlying aggregation. The single person dies *because* of the number.
