  Theories: Bratman's planning theory says intentions must involve plans to follow through, which Toxin undermines because you know you won't. Resolute choice might work for Hitchhiker by sticking to the plan, but Toxin's issue is forming the plan initially. CDT struggles more with Hitchhiker since resolute agents get rich, but Toxin exposes a deeper problem of intention formation under self-knowledge.

  Assessing which is harder for CDT: Hitchhiker has a functional solution (resolute choice) that CDT lacks, leading to "why ain'cha rich?" Toxin is worse because it attacks the coherence of intention within CDT, making it a more fundamental challenge. Even if you use resolute choice, forming the intention when you know you'll abandon it seems impossible.

