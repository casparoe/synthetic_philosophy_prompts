answer: |-
  Okay, Taurek's argument is notoriously tricky, especially the sections you highlighted! You've hit on the core of his challenge to standard consequentialism. Let's break down your questions step-by-step, connecting the David example to his rejection of impersonal judgments and the "numbers" question.

  1.  **What Taurek is trying to establish with the distinction between personal preference and moral obligation (David example):**
      *   **The Scenario:** Taurek imagines himself in a situation where he can save either his close friend David or five strangers. He admits he *would* save David, driven by personal attachment.
      *   **The Question:** Is this *merely* a personal preference, or is it *morally permissible*? Crucially, he's asking opponents (who believe numbers *do* count) a question: **"How does my friendship with David *change* the moral calculus *for you*?"**
          *   **Option A (No Moral Weight):** If the opponent says friendship gives *no* moral weight, then Taurek saving David would be *morally wrong* (he violated an obligation to save the five). Taurek finds this implausible and alienating – it denies the moral significance of deep personal relationships.
          *   **Option B (Moral Weight Creates Permissibility):** If the opponent concedes that friendship *does* give some moral weight, making it *permissible* for Taurek to save David, then Taurek pounces: **What kind of moral weight is this?**
      *   **Taurek's Key Insight in this Section:** He argues this "weight" **cannot be understood as creating a *countervailing moral obligation* to save David.** Why?
          *   There's no general rule saying "You *must* save your friends over strangers." He wouldn't blame someone else for *not* saving *their* friend in this scenario. Saving David isn't his *duty*; it's something he's *allowed* to do *because* of the relationship.
          *   **Therefore:** The permission to save David arises **not from a *new obligation*, but from the *absence of a pre-existing obligation* to save the strangers.** The friendship doesn't impose a *duty* to save David; it *dissolves* the putative duty to save the five strangers *in this specific context*.
      *   **What He Establishes Here:**
          *   Deep personal attachments *can* make it **morally permissible** to save the one over the many.
          *   This permissibility stems **not from a duty towards the one, but from the *lack* of a duty towards the many *that would bind the agent personally* in that specific relational context.**
          *   It introduces the idea that **agents are not always impersonally obligated to maximize aggregate good;** personal standpoint and relationships matter morally and can *override* what would otherwise be seen as an impersonal obligation.

  2.  **Rejecting "Impersonal Evaluative Judgments" (Pages 304-305):**
      *   **What He Means:** Taurek is rejecting the fundamental utilitarian/consequentialist move of aggregating harms or benefits across different individuals to make an impersonal judgment about which outcome is "better" or "worse" overall.
      *   **His Argument Against Them:**
          *   **The Nature of Harm/Death:** The badness of death or suffering is experienced *individually*. My death is a unique, irreplaceable loss *to me*. Your death is a unique, irreplaceable loss *to you*. These losses are distinct and *incommensurable* from an impersonal standpoint.
          *   **No "Greater Loss":** Taurek argues **there is no such thing as "the greater loss" when losses befall different people.** Saying "5 deaths are worse than 1 death" implies a single, impersonal scale of "badness" onto which we can map individual losses and sum them. He denies this scale exists. "Worse" only makes sense *for a specific person* ("It would be worse *for John* if he died than if he lived"). There is no "worse" *simpliciter* (impersonally).
          *   **The Analogy:** He famously uses the analogy of losing arms. If you lose your left arm, that's terrible *for you*. If I lose my right arm, that's terrible *for me*. But it makes no sense to say "Our combined loss is the loss of two arms" as if *one person* lost two arms. The badness isn't additive across persons; it's separate and distinct for each.
          *   **Why Reject Them?** Impersonal judgments:
              *   Illegitimately aggregate distinct individual losses/gains.
              *   Erase the separateness of persons by treating them as containers of "value" that can be summed.
              *   Create the illusion of an impersonal "greater good" or "lesser evil" that supposedly *obligates* the agent, overriding their personal perspective and relationships.
              *   Are the foundation for the claim that you *must* save the greater number.

  3.  **How the David Example Fits into the Larger Argument (The Logical Move):**
      *   **Step 1 (David Example):** Shows that **personal relationships can legitimately *override* what others claim is an impersonal obligation to save the greater number.** It demonstrates that the agent's personal standpoint *matters* morally and can negate a supposed duty to the aggregate.
      *   **Step 2 (Rejecting Impersonal Judgments):** Attacks the **foundation** of the supposed impersonal obligation itself. If there is no impersonal sense in which "5 deaths are worse than 1 death," then **there is no impersonal "greater good" or "lesser evil" to generate an obligation in the first place.**
      *   **The Synthesis & Logical Move:** Taurek uses the David example to create a dilemma for opponents and then uses the rejection of impersonal judgments to provide his *positive* account of why numbers *don't* create an obligation *even in the absence of personal ties*.
      *   **Connecting the Dots:**
          *   **From David to No Obligation:** The David example forces the opponent to either deny the moral relevance of deep personal ties (implausible) or admit that such ties can *dissolve* the supposed obligation to save the greater number. This weakens the idea of a *strict, overriding* obligation based on numbers.
          *   **To the Core Argument:** Taurek then argues that **even without a personal attachment like friendship, there is *still* no impersonal obligation to save the greater number.** Why? Because the *reason* numbers supposedly matter – the "greater loss" – is an illusion. Since you cannot meaningfully say it's impersonally *worse* if the five die than if the one dies, you have **no impersonal moral reason** to prefer saving the five. The *only* reasons you have are personal: *your* desire to save someone, *your* relationship to them, or perhaps a *fair* method (like flipping a coin) to give each an equal chance when you have no personal preference.
          *   **The Logical Move:** The David example **paves the way** by showing that impersonal obligations can be overridden by the personal standpoint. The rejection of impersonal judgments **severs the root** by demonstrating that the impersonal obligation doesn't truly exist *even in principle* because its foundational concept (aggregate badness) is incoherent. Therefore, saving the one is **always permissible**, whether because of a personal attachment *or* simply because there's no impersonal reason forcing you to save the five. The numbers *themselves* don't count morally.

  **In Simple Terms:**

  1.  **David Part:** "Look, even *you* agree my friendship makes it okay for me to save David instead of five strangers. That means your 'save the greater number' rule isn't absolute. My personal connection breaks it."
  2.  **Rejecting Impersonal Judgments:** "But actually, that rule is built on sand. There's no such thing as 'five deaths being *impersonally worse* than one death.' Losses happen to individuals, separately. You can't add them up like numbers."
  3.  **The Synthesis:** "So, if my friendship breaks the rule, and the rule itself is based on a mistake, then *anyone* can permissibly save the one person instead of the five. You don't *need* a friendship. The numbers alone don't create a duty. Save who you want, or flip a coin to be fair."

  The David example exposes a crack in the utilitarian edifice (personal ties matter), and Taurek then uses the rejection of impersonal aggregation to demolish the edifice entirely. The "logical move" is from showing an *exception* to the rule (David) to proving the rule itself is fundamentally flawed and non-existent. Hope this clarifies the tricky connection between those sections!

  Keep wrestling with it – Taurek is deliberately challenging deep-seated intuitions!
