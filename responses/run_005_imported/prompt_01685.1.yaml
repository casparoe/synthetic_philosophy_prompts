  First, the David scenario: Taurek saves his friend instead of five strangers. He argues that this isn't morally wrong because of his personal relationship. The user is confused about how personal preference relates to moral obligation. Taurek is saying that personal attachments can make it permissible to act against saving more lives without that action being a moral duty. So, saving David is okay, but not required. That addresses the user's first question.

