  Alright, Professor, consider this setup and punchline, honed specifically for your Lewis/Kripke dilemma and calibrated for ex-physicist sensibilities (with the accidental intrinsics problem taking center stage):

  **The Setup:**
  Two retired condensed matter physicists, Alice and Bob, are nursing beers at their usual haunt, *The Eigenvector*. Bob looks morose.

  **Alice:** "What's eating you, Bob? Still sore about the reading group ribbing you over Lewis?"
  **Bob:** "Worse. I just realized something truly depressing. *I could have been standing right now.*"
  **Alice:** "...Bob, you *are* standing. We walked here."
  **Bob:** "No, *actually*, I'm sitting. *Right here*. But in another possible world, the very same Bob – numerically identical, Kripke-style – is standing at this very moment! That Bob chose the standing stool! My actual, intrinsic sitting-ness feels... contingent. Tragic, even."
  **Alice (a Lewis devotee):** "Hold on, you're mashing frameworks. According to David Lewis, *you* aren't in that other world. There's just a *counterpart* of you over there, Bob-shaped and Bob-ish, who happens to be standing."
  **Bob:** "But that's nonsense! *My sitting* isn't just some weird relation *between* me and that standing guy over there! It's a fundamental, intrinsic property of *me*, *right here*! If I stand up *now*, *I* change an intrinsic property! That other guy standing doesn't make *my* sitting relational!"

  **The Punchline:**
  Alice leans in, a glint of modal mischief in her eye. "Bob, think about it. When *that* counterpart stands up in *his* world... doesn't that, by the glorious logic of counterpart theory, mean **you're actually standing *relationally* right now?** Cheer up! You *are* standing... from a certain point of view. Pass the peanuts."

  ---

  **Why it works for your specs:**

  1.  **Core of Accidental Intrinsics:** The entire joke hinges on Bob's anguish over sitting being an accidental intrinsic property he lacks in another world. Alice's punchline directly weaponizes Lewis's solution – that properties like sitting/standing *become* relational facts about counterparts across worlds – and twists it into absurdity. Bob's actual, felt, intrinsic sitting is comically reinterpreted as a relational state *caused* by his counterpart's action elsewhere.
  2.  **Specificity to Lewis vs. Kripke:** Bob explicitly frames his regret in Kripkean terms ("numerically identical..."). Alice explicitly invokes Lewis's alternative ("counterpart... isn't you... it's relational"). The humor arises *directly* from the clash between these two specific conceptions of transworld identity and property attribution.
  3.  **Physicist Vibe:** The setting (*The Eigenvector*), the characters (retired physicists), the slightly pedantic but passionate argument – it lands with the intended audience. The "pass the peanuts" undercuts the high theory with mundane reality.
  4.  **Joke Structure:** Clear setup (Bob's modal regret), development (Alice explains Lewis), punchline (the absurd relational consequence applied *to Bob in the actual world*). The punchline delivers the unexpected, counter-intuitive implication of the theory.
  5.  **Bonus Meta-Nod:** The whole scenario *is* the kind of thing your reading group would probably roll their eyes at while secretly enjoying – which adds another layer for you.

  **How to Deploy:** Wait for the next inevitable "So, *any* jokes yet about all that modal metaphysics?" jab from the reading group. Sip your drink calmly. Then launch into this. The groan-laugh ratio will be precisely calibrated to your audience's level of modal commitment. Good luck!
