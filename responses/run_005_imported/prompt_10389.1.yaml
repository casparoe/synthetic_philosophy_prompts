answer: |-
  ## MEMO: Re-evaluating the Final Work Sample as a Signal  
  **To:** Fellowship Selection Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Optimizing the Final Work Sample for Effective Signaling & Equity  

  ### 1. Acknowledging the "Keep It" Camp's Core Concern  
  The argument that "someone who won’t put in five unpaid days isn’t serious enough" intuitively aligns with signaling theory (Zahavi’s Handicap Principle, Grafen’s formalization, Spence’s job market signaling). A costly signal *can* honestly reveal hidden traits (like commitment/research potential) **if the cost is disproportionately lower for high-quality candidates**. We agree: filtering for genuine commitment is essential.  

  ### 2. The Signaling Problem with the Current Task  
  The critical question is **not whether the task is costly, but whether its cost falls more heavily on candidates we *don’t* want than those we *do* want.** Our analysis suggests the current structure fails this test:  
  *   **Differential Cost:** The primary cost isn’t "effort" (which *could* correlate with commitment) but **opportunity cost of time**. This cost tracks socioeconomic privilege (savings, flexible jobs, lack of dependents) far more reliably than research potential or commitment.  
  *   **No Honest Signal:** A candidate declining due to childcare or a 2nd job isn’t signaling *lower commitment*; they’re signaling *higher external constraints*. Conversely, a privileged candidate with free time completes it trivially, signaling little about intrinsic drive.  
  *   **Signal Ambiguity:** A strong submission signals ability/commitment *only if* we assume equal opportunity cost. A weak submission could mean lack of ability *or* overwhelming time pressure. We cannot disentangle these.  
  **Conclusion:** The current task primarily signals "has 5 days of free time," not "is a uniquely talented and committed researcher." It acts as a **regressive filter**, likely excluding precisely the resilient, driven candidates from non-traditional backgrounds we aim to support.  

  ### 3. Recommendation: Replace with a Shorter, Paid, Higher-Signal Task  
  We propose phasing out the 5-day unpaid proposal and implementing a **2-Part Final Round**:  

  | **Component**       | **Format**                                | **Duration** | **Compensation** | **Signals Tested**                          |  
  |---------------------|------------------------------------------|--------------|------------------|---------------------------------------------|  
  | **Part 1: Work Sample** | Mini research proposal + literature sprint | **2 Days**   | **$200 Stipend** | Core research skills, clarity, creativity |  
  | **Part 2: Live Q&A** | Structured discussion on proposal & research interests | **1 Hour**   | Included         | Enthusiasm, critical thinking, responsiveness |  

  #### Why This Addresses the "Keep It" Camp's Concerns *Better*:  
  *   **Retains Costly Effort:** 2 focused days (16-20 hrs) remains a significant investment, filtering casual applicants.  
  *   **Enhances Signal Honesty:**  
      *   The **stipend** reduces noise from financial desperation, letting *research potential* drive performance.  
      *   The **shorter window** increases cognitive intensity, better revealing problem-solving under constraints.  
      *   The **live Q&A** is a *low-cost/high-information* signal: Genuine passion and intellectual agility are hard to fake spontaneously. Enthusiasm here strongly correlates with commitment.  
  *   **Targets True Selectors:** We want candidates who thrive on *intellectual challenge*, not those who tolerate *financial sacrifice*. This structure selects for the former.  

  #### Why It’s More Equitable:  
  *   Explicit pay acknowledges labor and reduces exclusion based on wealth.  
  *   Shorter duration is less prohibitive for candidates with jobs/care responsibilities.  
  *   Live interaction allows candidates to "show drive" directly, irrespective of writing polish.  

  ### 4. Implementation Timeline  
  *   **Week 1:** Finalize new task structure & stipend funding (reallocated from final cohort size/other minor budget lines).  
  *   **Week 2:** Draft new guidelines & rubrics; train committee on Q&A evaluation.  
  *   **Week 3:** Pilot with next cohort’s finalists.  
  *   **Post-Cohort:** Survey finalists on experience; compare selection diversity/output with past cohorts.  

  ### 5. Conclusion  
  Signaling theory supports the *intent* behind the current task but reveals its *implementation* selects for privilege over potential. Our proposed model maintains a meaningful hurdle while transforming the cost from **financial sacrifice** (a poor, noisy signal) into **focused intellectual effort** (a clearer, more honest signal of research talent and commitment). Crucially, it does this while significantly reducing inequitable barriers. **We recommend adopting the 2-Part Paid Process for the next cohort.**  

  **Appendices:**  
  *   Brief summary of Zahavi/Grafen/Spence signaling logic.  
  *   Estimated budget impact of stipends (example: 15 finalists x $200 = $3,000).  
  *   Draft rubric for Q&A session (focus: curiosity, responsiveness, critical engagement).  

  ---  
  **Let me know if you'd like the appendices fleshed out or need adjustments to emphasize specific committee concerns!**
