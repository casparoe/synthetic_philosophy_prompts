answer: |-
  Your moral discomfort is profound and philosophically significant—it cuts to the heart of ethical decision-making under scarcity. Both perspectives (saving the five vs. a lottery) are defensible, but they represent fundamentally different ethical frameworks. Let's break this down:

  ### 1. **The Utilitarian Case ("Shut Up and Multiply")**
     - **Core Argument**: Maximizing lives saved is the only rational metric when all other factors are equal. Failing to save the five to save the one results in four preventable deaths. The skier's moral claim doesn't diminish, but the *opportunity cost* of choosing them is catastrophically high.
     - **Why SAR Teams Use This**: In emergency triage, systems prioritize scalable outcomes. Saving five over one isn't devaluing the individual; it’s acknowledging that *the helicopter’s time* is the scarce resource. Its deployment must optimize aggregate survival.
     - **Counter to Your Doubt**: The skier’s claim isn’t weaker *in isolation*, but in a constrained system where resources are zero-sum, the claim of *five* individuals collectively outweighs one. Refusing this logic means accepting avoidable mass deaths.

  ### 2. **The Egalitarian Case (Lottery System)**
     - **Core Argument**: Each life has equal intrinsic value. Giving the skier a 1/6 chance (or proportional odds) respects their moral worth as an individual, rather than reducing them to a unit in a calculation. Philosophers like John Taurek argue that saving one from death is incomparably good for *that person*, and we shouldn’t aggregate harms across persons.
     - **Why It Nags at You**: The stranded skier’s plight is existentially separate from the hikers'. Their need isn’t less urgent or deserved because others *happen* to need the same resource. A lottery honors the "separateness of persons" (Rawls).
     - **Practical Risk**: A lottery might feel more "fair" ex-ante, but if the skier wins, you face four preventable deaths. SAR committees often reject this because their duty is to *prevent death*—not administer cosmic fairness.

  ### 3. **Is This Scope Insensitivity?**
     - **No—It’s the Opposite**. Scope insensitivity would be *failing* to proportionally weigh five lives against one. Your unease stems from *over*-sensitizing to individual moral claims, not under-sensitizing to scale. This is closer to "number numbness" in reverse: refusing to let large numbers override individual dignity.

  ### 4. **A Middle Path: Threshold Deontology**
     - Some ethicists argue utilitarianism applies *until* a threshold (e.g., saving 5 vs. 1 is clear), but not in closer calls (e.g., 2 vs. 1). Here, 5:1 is arguably past that threshold. Still, this doesn’t resolve the angst about reducing persons to integers.

  ### 5. **Why the Committee’s Choice Was Defensible (But Not Uniquely Right)**
     - **Rule Utilitarianism**: SAR protocols adopt "save most lives" as a rule because it minimizes deaths *over time*. Ad-hoc lotteries could paralyze decisions in crises.
     - **Psychological Realism**: Choosing the five aligns with human instinct to preserve communities/families (the hikers) over isolated individuals (the skier). This isn’t irrational—it’s evolved prosociality.
     - **But...** Had the skier been your child, you’d likely reject the calculus. This exposes utilitarianism’s coldness: it works best when emotional distance exists.

  ### Conclusion: Two Valid Tragedies
  Your dilemma isn’t scope-insensitivity—it’s an honest collision between two ethical truths:
  - **Truth 1**: Choosing not to save five to save one *is* a choice to let four die pointlessly.
  - **Truth 2**: Each person’s death is a universe destroyed. The skier’s abandonment feels like a betrayal of their singular value.

  **In practice**, SAR must prioritize aggregate survival—but your anguish honors the individual left behind. A lottery might be ethically purer in a vacuum, but in storm-lightning decisions with lives at stake, "shut up and multiply" saves more souls over the long run. That doesn’t make the skier’s death less tragic; it makes it a heartbreaking cost of scarcity. Your empathy isn’t a flaw—it’s what makes you human in a role that demands superhuman choices.

  > "To save one life is to save the world entire. But if you *can* save five worlds, and choose to save one... what have you done?"  
  > — *An adaptation weighing Talmudic against utilitarian wisdom*
