prompt: |-
  Okay, I've been down a rabbit hole this week rereading Turing's original 1950 Mind paper -- "Computing Machinery and Intelligence," the one everyone cites for the imitation game and then apparently never reads past page four. Everyone quotes the Lady Lovelace objection and the "heads in the sand" bit, but almost nobody talks about the ninth and final objection in section 6, the Argument from Extra-Sensory Perception, where Turing basically concedes the statistical evidence for telepathy is "overwhelming" (his word, iirc) and then seriously proposes sticking everyone in a "telepathy-proof room" so a psychic human can't give the game away by reading the interrogator's mind. I mentioned this in an ACX open thread and about half the people didnt believe me until someone linked the actual PDF.

  Anyway, I've got a historian of computing coming on my little podcast next month who's published on the thesis that this passage isn't an embarrassing throwaway to be quietly excised from the "respectable" Turing, but is actually continuous with his broader operationalism about what "thinking" even means. I want questions that engage that thesis rather than just having her explain the weird trivia for forty minutes while I nod along. Can you draft me 8-10 interview questions? I need at least one that presses on why Turing treated Rhine-style card-guessing results as credible evidence given how rigorous he is basically everywhere else in that same paper, at least one on whether the telepathy-proof room fix actually rescues the imitation game as an operational test or just reveals that the test's evidential force was always hostage to open empirical questions that have nothing to do with computation, and at least one on where this objection sits relative to the other eight -- is it the odd one out, or does it expose something the other eight don't. For each of those three, and ideally for most of the rest, give me a natural follow-up keyed to whatever answer she's most likely to give, since I don't want the obvious rebuttal just hanging there unasked. If you can also work in something about whether Turing's whole framing reads differently now, post-replication-crisis, given how badly Rhine's numbers have aged, that'd be great too.
