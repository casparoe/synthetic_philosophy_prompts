  So my brother-in-law's been on a big medieval philosophy youtube kick and it somehow turned into an argument with my sister's friend at a bbq last weekend, of all things about killing dictators. He started it, saying something like "even Aquinas, a literal saint, basically said its fine to kill a tyrant, and that the guy who does it should basically be honored for it." She said that's way overstated -- that Aquinas mostly insisted it had to go through "public authority," not some random guy deciding on his own that his king's gotta go, and that Aquinas was actually pretty nervous about private individuals making that call themselves. He came back with: ok, but Aquinas drew a real line between a tyrant who seized power illegally (a usurper) and one who's just a legit ruler gone bad, and for the usurper type he basically says they're just a criminal that pretty much anyone can move against, so it's not "always defer to the government" across the board. She said sure, but even in the usurper case Aquinas spends way more of his actual writing warning that killing the guy usually just gets you a worse tyrant and years of civil war than he does cheering the killing on, so summing it up as "Aquinas approved of tyrannicide" is kind of misleading. He said every moral permission anyone's ever handed out comes with a pile of caveats, that doesn't make it not a real permission, so now she's just moving the goalposts. Neither of them budged and honestly I don't know enough medieval philosophy to referee it myself. Can you go through their back and forth move by move, say who's got the better of it at each stage, and point out anything about what Aquinas actually thought that you think they're both missing?
reasoning: |-
  Okay, the user has shared a detailed account of a debate between their brother-in-law and sister's friend about Aquinas' views on tyrannicide. The brother-in-law claims Aquinas endorsed killing tyrants, while the friend argues Aquinas emphasized caution and proper authority. They need help evaluating who's right at each stage and identifying what both parties might be missing.

  First, I need to recall Aquinas' actual positions. He discusses tyranny in his works, particularly in "On Kingship" and the "Summa Theologiae." The key points are the distinction between usurpers and legitimate rulers who become tyrants, the role of public authority, and the consequences of tyrannicide.

  The brother-in-law started by saying Aquinas approved of killing tyrants and honoring the killer. The friend countered that Aquinas insisted on public authority and warned against private individuals acting alone. The brother-in-law then differentiated between usurpers and legitimate tyrants, arguing that usurpers can be dealt with by anyone. The friend agreed but pointed out Aquinas' extensive warnings about potential chaos and worse outcomes.

  I should analyze each exchange. For the first point, the brother-in-law is partially right that Aquinas permits tyrannicide in some cases, but he oversimplifies by not mentioning the caveats. The friend correctly highlights Aquinas' emphasis on public authority, which is a strong point in her favor.

  On the second point, the brother-in-law accurately notes the distinction between usurpers and legitimate tyrants. Aquinas does say usurpers have no rightful claim, so opposing them isn't rebellion. The friend acknowledges this but stresses Aquinas' warnings about unintended consequences, which Aquinas indeed emphasizes heavily. Her point about potential chaos is valid and shows Aquinas' cautious approach.

  Both might be missing deeper aspects. Aquinas' framework is rooted in natural law and the common good. He's not just setting rules but considering what truly serves the community's welfare. Also, his preference for non-lethal solutions and the role of the Church are often overlooked. The brother-in-law downplays the caveats, while the friend might understate the permission given in usurper cases.

  The user's deeper need is to understand the nuances of Aquinas' arguments to mediate future discussions. They want clarity on who was more accurate at each stage and what both debaters missed. Highlighting Aquinas' balance between moral permission and practical caution could help reconcile their views.
answer: |-
  Here's a breakdown of their BBQ debate, move-by-move, based on Aquinas's actual writings (primarily *De Regno* [On Kingship] and the *Summa Theologiae*), assessing who had the better argument at each stage and highlighting what they might have missed:

  **The Core Argument:**

  1.  **Brother-in-Law's Opening Claim:**
      *   *Claim:* "Aquinas, a saint, basically said it's fine to kill a tyrant, and the killer should be honored."
      *   **Assessment: Partially True, but Overstated & Misleading.**
      *   *Why:* Aquinas *does* discuss the permissibility of removing a tyrant, even lethally, under specific circumstances. He *does* sometimes frame resistance to a usurper as praiseworthy. However:
          *   He *never* simply says "it's fine to kill a tyrant" without significant qualifications.
          *   He *never* says the killer "should be honored" in a general sense. Praise is context-dependent and tied to acting for the common good through proper authority.
          *   Framing it this way ignores the massive caveats, conditions, and warnings that dominate his discussion. It makes Aquinas sound like a cheerleader for assassination, which he absolutely was not.

  2.  **Sister's Friend's First Rebuttal:**
      *   *Claim:* Overstated. Aquinas insisted on "public authority," not private individuals deciding. He was nervous about private action.
      *   **Assessment: Strongly Correct on the Main Point.**
      *   *Why:* This is the absolute cornerstone of Aquinas's position on removing a *legitimate ruler turned tyrant*:
          *   **Summa Theologiae II-II, Q.42, A.2:** Explicitly states that a *private person* cannot lawfully kill even a tyrant. To do so is sedition and morally wrong. Authority to depose rests with "public authority" (e.g., a superior prince, the community acting collectively through established mechanisms, or potentially an institution like the Church acting politically).
          *   **De Regno, Ch. 6:** Emphasizes that the *multitude* (acting as a public body) or a *superior authority* has the right to depose a tyrant who abuses legitimate power. Private initiative is excluded.
          *   Aquinas's nervousness stems from his view of order and the dangers of anarchy. Private judgment replacing public authority undermines the very foundation of political society.

  3.  **Brother-in-Law's Counter: The Usurper Distinction:**
      *   *Claim:* Aquinas draws a line. A usurper (illegitimate ruler) is just a criminal; anyone can move against them, so it's not "always defer to government."
      *   **Assessment: Essentially Correct.**
      *   *Why:* Aquinas makes a crucial distinction:
          *   **Legitimate Ruler turned Tyrant:** Deposition must be by public authority (as friend stated).
          *   **Usurper (Tyrant by Practice *and* Title):** "He who usurps the government by violence does not truly become lord or ruler." Therefore, "it is not seditious to seek to depose him, unless indeed the uprising is accompanied by such disorder that the community suffers greater harm from the upheaval than from the tyrant's rule." (Summa Theologiae II-II, Q.42, A.2, ad 3).
          *   **Key Point:** Opposing a usurper isn't rebellion against *legitimate* authority; it's defending the community against an *aggressor*. Therefore, the strict requirement for "public authority" *in the same hierarchical sense* is loosened. The community (or individuals acting in its defense against an invader/criminal) has a right to resist. Aquinas *does* say such action can be "praiseworthy" (*De Regno*, Ch. 6).

  4.  **Sister's Friend's Pushback: The Warnings & Caveats:**
      *   *Claim:* Even for usurpers, Aquinas spends far more time warning about disastrous consequences (worse tyrant, civil war) than "cheering on" the killing. Calling it "Aquinas approved tyrannicide" is misleading.
      *   **Assessment: Correct and Crucial Context.**
      *   *Why:* This is where the brother-in-law's initial framing completely collapses. Aquinas's overwhelming emphasis is on **caution and the dangers of action**:
          *   **De Regno, Ch. 6 (The Usurper Section):** Immediately after noting resistance to a usurper can be praiseworthy, he launches into a lengthy warning: "The danger... is that those who rise against a tyrant often cannot prevail, and so the tyrant is provoked to greater rage... Even if successful, the multitude is often split by dissension... one faction drives out the tyrant, another brings in a new one, and strife arises... It often happens that the man who helped free the people from tyranny then seizes power and becomes a worse tyrant... Therefore, the people should proceed with great caution against a tyrant."
          *   **The Overriding Principle:** The *common good* is paramount. If the likely outcome of killing the tyrant (usurper or not) is greater evil – civil war, worse tyranny, widespread suffering – then the action is *not* justified, regardless of the tyrant's original legitimacy. The permission is heavily conditional on a probable *net positive outcome* for the common good.
          *   **"Cheering On"?** Absolutely not. Aquinas presents tyrannicide (especially private action) as an extreme, dangerous, last resort fraught with peril. His tone is one of profound caution, not endorsement.

  5.  **Brother-in-Law's Final Retort: "Moving Goalposts":**
      *   *Claim:* Caveats don't negate the permission; it's still a "real permission."
      *   **Assessment: Partially True, but Misses the Point.**
      *   *Why:* Technically, yes, Aquinas *does* grant a theoretical permission under specific, narrow conditions (primarily against usurpers, with the caveat of likely net benefit). However:
          *   **Scale of Caveats:** The caveats aren't minor footnotes; they constitute the *majority* of his discussion and establish the *primary conditions* for the permission. Ignoring them fundamentally distorts his position.
          *   **Friend's Point Stands:** Saying "Aquinas approved of tyrannicide" without immediately adding "...only under these incredibly strict, dangerous, and rarely-met conditions, and he strongly advises against it most of the time" **is** misleading. It implies a general approval that simply isn't there.
          *   **Not Goalposts:** The friend isn't denying the permission exists *in theory*; she's correctly insisting that the *practical reality and overwhelming emphasis* in Aquinas's writing is on the dangers and conditions that make exercising that permission exceptionally risky and often inadvisable. Framing it as simple approval ignores his core message of caution.

  **What Both Might Be Missing About Aquinas:**

  1.  **The Primacy of the Common Good:** This is Aquinas's ultimate litmus test. *Any* action (obedience, resistance, deposition) is judged solely by whether it serves the true welfare of the community. Tyranny is evil *because* it destroys the common good. Resistance is only permissible *if* it truly restores it, and only *if* it doesn't cause greater harm.
  2.  **Natural Law Foundation:** Aquinas's argument rests on natural law. A ruler who fundamentally violates natural justice (like a usurper or extreme tyrant) forfeits their claim to obedience. Resistance in such cases is upholding natural law, not breaking civil law.
  3.  **Non-Lethal Solutions Preferred:** Aquinas explicitly prefers non-violent methods if possible (*De Regno*, Ch. 6). He suggests the people should first try to correct the tyrant's behavior. Deposition, even by public authority, is a last resort. Lethal force is an even more extreme subset of that.
  4.  **The Role of the Church:** While not the main focus of this BBQ debate, Aquinas believed the Church (specifically the Pope, as spiritual authority) could potentially intervene against a tyrannical ruler who was also persecuting the faith or leading his people into sin. This adds another layer of "public authority" beyond the purely secular.
  5.  **"Honor" is Nuanced:** Aquinas might call resistance to a usurper "praiseworthy" in the context of defending the community, but this is *not* the same as saying the killer "should be honored" like a hero. It's a moral judgment on the act's *intention* (defense of common good), not a call for civic celebration, especially given the risks he outlines.

  **Conclusion:**

  *   **Sister's Friend** had the **stronger overall argument.** She correctly identified the central role of public authority for legitimate rulers-turned-tyrant, accurately highlighted Aquinas's *overwhelming* emphasis on the dangers and caveats (especially the common good test), and rightly argued that summarizing his position as "approved tyrannicide" is misleading without these critical qualifications.
  *   **Brother-in-Law** scored a point with the **usurper distinction**, correctly noting that Aquinas treats them differently and permits broader resistance, seeing them as criminals, not legitimate authorities. However, he **overstated and oversimplified** Aquinas's position from the very beginning. His framing ignored the crucial conditions and warnings, making Aquinas sound far more permissive than he actually was. His "caveats don't negate permission" retort missed the point that the caveats *define* the extremely narrow and perilous scope of that permission.

  In essence, Aquinas provides a **highly conditional, theoretical justification for removing tyrants (especially usurpers) under public authority or communal defense, but he surrounds it with such profound warnings about the likely disastrous consequences that his practical message is one of extreme caution and a strong preference for non-violent solutions whenever possible.** Neither "it's basically fine" nor "it's never allowed privately" fully captures his nuanced, cautious, and common-good-centered approach.
