prompt: |-
  Ok so I get the basic pitch behind 'surrogate goals' as a defense against acausal blackmail/threats: you deliberately manufacture some fake vulnerability and commit to responding to threats against it exactly like you'd respond to threats against the thing you actually care about, so that threat-makers target the fake thing instead of the real one. What I dont get is why this actually works instead of just being security theater — if a threatener is smart enough to accurately model you, why wouldnt they just see through the surrogate and threaten your real goal anyway, since thats presumably still at least as effective at extracting compliance? Can you walk me through what's actually doing the load-bearing work here, mechanically, that makes the surrogate the thing they'd rationally target rather than just an extra vulnerability stacked on top of the real one?
