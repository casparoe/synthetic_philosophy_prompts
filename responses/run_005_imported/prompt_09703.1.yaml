prompt: |-
  So for my metaethics seminar we just got through Scanlon's buck-passing account of value, and this week's reading was Rabinowicz & Rønnow-Rasmussen on the wrong kind of reasons problem -- the classic case where an evil demon says he'll torture you unless you admire him (or some totally worthless saucer of mud), so technically you now have a reason to admire it even though it isn't actually admirable. My prof mentioned kind of offhandedly that some people treat the WKR problem as basically a reincarnation of Moore's open question argument against naturalistic definitions of "good," but then she moved on to the next slide before explaining what she meant, and now me and my study group can't stop arguing about it.

  Could you actually spell out that comparison for me? Like, is WKR doing the exact same move as Moore's OQA -- showing that for any proposed analysis of a normative property in terms of some other property, a competent thinker can always coherently pull the two apart -- just transposed from something like "good = pleasure" onto "good = whatever gives us reason for a pro-attitude"? Or is something genuinely different going on, since OQA is about analyzing "good" itself and WKR is more about sorting out which reasons count as the "right kind" for a fitting-attitude analysis to even get off the ground. I'm also curious whether a buck-passer who's already got a decent reply to Moore (like the synthetic-identity move Cornell realists make for "good = X") gets any protection from WKR cases for free, or if thats a totally seperate fight that has to be won on its own terms. If you can, give me an actual verdict on how deep the similarity between these two problems really goes rather than just listing parallels and differences down the middle -- I have to defend a position on this for my response paper and "it's complicated" isn't gonna cut it.
reasoning: |-
  Okay, the user is in a metaethics seminar dealing with Scanlon's buck-passing account and the wrong kind of reasons (WKR) problem from Rabinowicz & Rønnow-Rasmussen. They mentioned their professor linked WKR to Moore's Open Question Argument (OQA) but didn't explain. The user and their study group are confused, and they need a clear comparison for a response paper.

  First, I need to recall both arguments. Moore's OQA targets naturalistic definitions of "good." For any proposed definition (e.g., good = pleasure), Moore says you can always ask, "But is pleasure really good?" The fact that this question remains open shows that "good" can't be reduced to natural properties. The OQA highlights the conceptual gap between natural properties and normative concepts.

  Now, the WKR problem arises in fitting-attitude analyses of value. For example, something is valuable if it's fitting to have a pro-attitude toward it. But in cases like the evil demon threatening torture unless you admire a saucer of mud, you have a reason to admire it (to avoid torture), but the mud isn't actually admirable. So, reasons here are the "wrong kind" because they don't make the object valuable. The challenge is to distinguish between right-kind reasons (which make the attitude fitting) and wrong-kind reasons (which don't).

  The user's professor suggested WKR is a reincarnation of OQA. The user wants to know if they are fundamentally the same, just applied to different analyses (OQA on "good" as pleasure vs. WKR on "good" as reasons for pro-attitudes). Or is there a deeper difference? Also, they ask if a solution to OQA (like Cornell realism's synthetic identity) automatically solves WKR.

  Looking at the core issue: both arguments expose a gap. OQA shows a conceptual gap between "good" and any natural property. WKR shows a gap between reasons for an attitude and the fittingness of that attitude. But the nature of the gaps might differ. OQA's gap is about meaning—competent speakers can separate the concepts. WKR's gap is about normative force—reasons provided by external factors (like threats) don't make the attitude fitting; they're pragmatic, not truth-related.

  A key difference is that OQA targets reductions of "good" to non-normative properties, while WKR targets reductions within the normative realm (reasons to attitudes). So, even if "good" is defined normatively (as reasons for pro-attitudes), WKR points out that not all reasons are the right kind. This suggests WKR might be a deeper problem because it persists even after accepting a normative reduction.

  The user also asks if a solution to OQA helps with WKR. Cornell realists argue that "good" is synthetically identical to a natural property, so the open question doesn't refute the reduction. But for WKR, even if "admirable" is synthetically identical to having right-kind reasons, the challenge is distinguishing those reasons. A synthetic identity might not resolve that distinction, meaning WKR needs its own solution.

  So, the verdict: WKR isn't just OQA applied to buck-passing; it's a distinct but related challenge. Both reveal gaps, but WKR's gap is within normative space, making it harder to solve. A solution to OQA doesn't automatically solve WKR, as the latter requires specifying what makes reasons the "right kind," which involves additional normative criteria.
answer: |-
  You're right to sense both deep kinship and crucial divergence here. The comparison isn't superficial, but framing WKR as *merely* a "reincarnation" of the OQA oversimplifies. Think of it this way: **WKR is the OQA's more sophisticated, normatively self-aware cousin, attacking not the reduction of "good" to the *natural*, but its reduction to the *normative* via reasons.** Here's the breakdown, the verdict you need, and why Cornell realism doesn't automatically solve WKR:

  ### The Core Similarity: Exposing a Conceptual/Normative Gap
  1.  **OQA's Core Move:** For any proposed naturalistic definition of "good" (e.g., "good = pleasure"), Moore argues a competent speaker can always coherently ask, "But is pleasure *really* good?" The persistence of this "open question" demonstrates that the *concept* "good" is not identical to the concept "pleasure." There's a conceptual gap.
  2.  **WKR's Parallel Move:** For any proposed fitting-attitude (FA) analysis (e.g., "X is admirable iff there are reasons to admire X"), the WKR cases show we can always coherently ask, "But are *these* reasons (the demon's threats) *really* reasons that make X *admirable*?" The persistence of this question demonstrates that the *property* of being admirable isn't simply constituted by *all* reasons to admire. There's a *normative* gap between *having reasons* to have an attitude and the attitude being *fitting* (i.e., correctly responding to the object's value).

  **The Shared Insight:** Both arguments exploit the intuition that competent users of normative concepts possess a kind of "discriminatory capacity." Moore says we can always distinguish "good" from any proposed natural property P. WKR says we can always distinguish *reasons that make an attitude fitting* (and hence constitute value) from *reasons that merely give us incentive* to have the attitude (without making it fitting). Both block simple reductive analyses.

  ### The Crucial Divergence: The Nature of the Gap & the Target
  1.  **Target of Attack:**
      *   **OQA:** Primarily targets *naturalistic reductions* ("good = some natural property N"). It argues normativity ("good") can't be captured by the non-normative.
      *   **WKR:** Targets *normative reductions within the normative domain itself*. Specifically, it attacks the buck-passer's attempt to reduce *value* (good, admirable, desirable) to *reasons for pro-attitudes*. The gap isn't between normative and non-normative, but *within* the normative realm – between different *kinds* of reasons (right-kind vs. wrong-kind).
  2.  **Nature of the Gap:**
      *   **OQA:** Emphasizes a *conceptual* or *semantic* gap. The *meaning* of "good" seems distinct from the meaning of any proposed natural term.
      *   **WKR:** Emphasizes a *normative* or *explanatory* gap. Even if we grant that *all* value facts *are* reason facts (the buck-passing thesis), WKR shows that *not all reason facts are value-constituting facts*. The demon gives you a *practical*, *state-given* reason (a reason for *having* the attitude of admiration *as a state*) but not a *fittingness*, *object-given* reason (a reason provided *by the object* that *makes* admiration appropriate). The gap is about *what kind of normative work* the reasons are doing.
  3.  **The Stakes for Analysis:**
      *   **OQA:** Suggests "good" might be simple/indefinable, or at least not definable in non-normative terms.
      *   **WKR:** Doesn't necessarily doom the buck-passing project *in principle*, but shows that any successful FA analysis *requires an additional, prior criterion* to filter RKR from WKR. This criterion itself must be *normative* (e.g., "reasons provided *by the object's properties*" or "reasons that are *constitutive of correctness*"). This threatens to make the analysis circular or uninformative, as the value-concept (admirable) re-emerges in the definition of the "right kind" of reasons.

  ### Your Verdict: How Deep is the Similarity?
  **WKR is fundamentally *doing the same job* as the OQA, but operating at a higher level of normative complexity.** It's not *just* OQA transposed; it's OQA *evolved* to attack a more subtle target.

  *   **The Deep Kinship:** Both are powerful dialectical tools demonstrating an irreducible residue. Just as OQA shows "good" can't be smoothly replaced by *any* natural property N without a question arising, WKR shows "admirable" (or "good" analyzed via reasons) can't be smoothly replaced by *all* reasons to admire R without a question arising about *which* reasons count. **Both exploit the "open question" structure to block reduction.**
  *   **The Crucial Difference:** OQA highlights the gap *between the normative and the non-normative*. WKR highlights a gap *within the normative realm itself* – specifically, between the normative force constitutive of value (fittingness) and other kinds of normative force (incentives, pragmatic reasons). **WKR shows that even if you successfully "naturalize" reasons (a huge 'if'), or even if you keep reasons irreducibly normative, you *still* face the problem of distinguishing the *value-constituting* reasons from others.** This makes WKR a *more internal* challenge for normative theory.

  ### Does Solving OQA (e.g., Cornell Realism) Solve WKR? Absolutely Not.
  This is where the differences become critical.

  1.  **Cornell Realism's OQA Solution:** They argue "good" is *synthetically identical* to some complex natural property N (e.g., "what we would desire to desire under conditions of full information"). The OQA fails because the identity is synthetic, not analytic – it's a discovery about the world, not about meaning. The question "Is N good?" seems open because we haven't *learned* the identity yet, not because it's false. Competent speakers grasp the concepts separately, but they refer to the same property.
  2.  **Why it Doesn't Touch WKR:** Suppose the buck-passer is a Cornell Realist: "Admirable = the natural property N that constitutes the reasons for admiration of the *right kind*."
      *   **The Problem Persists:** WKR doesn't care *how* the property N is characterized (naturalistically or not). **WKR attacks the "right kind" qualifier.** Even if "admirable" is synthetically identical to *some* natural property, the WKR cases show that *the natural property that constitutes RKR is distinct from the natural property that constitutes WKR.*
      *   **The Challenge Remains:** The demon case forces the buck-passer to specify *what natural feature* distinguishes the reasons provided by the mud's intrinsic properties (which are presumably non-existent, hence not admirable) from the reasons provided by the demon's threat (which are very real, but pragmatic). The Cornell move might explain how *RKR* supervenes on the natural, but **it doesn't tell us *which* natural features ground RKR rather than WKR.** Identifying *that* difference *is* the core WKR challenge.
      *   **Circularity Threat Returns:** To non-circularly specify the natural property N that constitutes *only* RKR (and not WKR), you need a prior criterion to filter the reasons. This criterion ("provided by the object," "constitutive of correctness") looks suspiciously normative, potentially reintroducing the value concept you were trying to reduce. The synthetic identity move doesn't automatically solve *this* problem.

  ### Your Defense: The Verdict for Your Paper
  **Position to Defend:** While inspired by the OQA's core strategy of exposing an unbridgeable gap, the Wrong Kind of Reasons problem represents a distinct and *more formidable* challenge within normative ethics. The OQA primarily defends the autonomy of the normative from the non-normative. The WKR problem, however, exposes a fundamental fracture *within* the normative domain itself – specifically, between the reasons that constitute value (fittingness) and the reasons that merely provide incentives. It attacks not naturalism per se, but the buck-passer's attempt to reduce value to reasons *simpliciter*. Consequently, solving the OQA (e.g., via synthetic identity) does *nothing* to resolve the WKR problem, which demands its own solution for distinguishing right-kind from wrong-kind reasons – a distinction that potentially reintroduces the very value concepts the analysis sought to reduce. **WKR is the OQA turned inward, revealing that the normative landscape is more complex and resistant to simple reduction than even Moore imagined.**

  This position acknowledges the clear lineage from Moore while emphasizing the unique, advanced challenge WKR poses for contemporary, reason-based analyses of value. It gives you a strong, defensible claim that goes beyond "it's complicated." Good luck with the paper!
