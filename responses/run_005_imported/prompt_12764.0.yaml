prompt: |-
  So a few months back I went down a YouTube rabbit hole about old logic puzzles and ended up reading about this ancient Chinese thing called the White Horse Dialogue. Some guy named Gongsun Long, part of a group historians call the School of Names, apparently spent real effort arguing that "a white horse is not a horse." My first reaction was that it's just a dumb wordplay trick, like those fake syllogisms where "nothing is better than true love" and "a rock is better than nothing" somehow prove a rock is better than true love. But the more I read the more it seemed like there's an actual structured case being made -- something about how "horse" names a shape and "white" names a color so they can't be the same name, plus a separate bit about how if you're out looking for "a horse" a yellow one satisfies you but if your out looking for "a white horse" a yellow one doesn't, so the two terms must pick out different things, plus a third version about how "horse" doesn't rule out any color but "white horse" rules out yellow and black ones. And then he's also got this whole other essay about a hard white stone, where he says your hand can feel hard but not white and your eye can see white but not hard, so hardness and whiteness are somehow separate in the thing -- which got me wondering if all his little paradoxes are actually pieces of one bigger theory about how qualities or universals exist, sort of a Chinese cousin of Plato's forms that nobody ever brings up in that context.

  I co-host a tiny philosophy podcast (like, genuinely a dozen listeners, I have no illusions) and we've got a guest booked next week who specializes in the School of Names. She's on record thinking Gongsun Long gets a bad rap as "just a sophist doing party tricks" and that he was actually doing serious proto-logic/semantics that later Chinese thought just walked away from. I don't want to waste her time with the "wait, so is a white horse a horse or not, lol" question, she's obviously answered that a thousand times. Could you help me draft 8 to 10 real interview questions that get into the actual guts of this -- the shape/color argument, the "seeking a horse vs. seeking a white horse" argument, the exclusion argument, and how (or whether) it all connects to the hard-white stone piece -- and that push on stuff like: whether this is secretly just equivocating on the word "is," whether Gongsun Long was consciously separating "identity" from "class membership" or if we're just backfitting modern logic onto him, an argument I saw somewhere (I think the name was Chad Hansen but don't quote me) that the whole puzzle only looks paradoxical because Chinese nouns work more like mass nouns than count nouns and we're importing English grammar into it, and why his own contemporaries mostly treated this as pointless hairsplitting instead of a real contribution. For each question can you also add a quick follow-up keyed to whatever answer she'd most likely give, so I'm not just sitting there nodding along.
