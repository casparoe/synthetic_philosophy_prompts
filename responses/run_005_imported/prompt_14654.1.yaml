prompt: |-
  Got into a whole argument with my friend Alex last night about Hofstadter's superrationality -- he thinks the symmetry argument is basically just cooperation dressed up as logic, and I couldn't fully talk him out of it even though I think theres more going on. Anyway, I host a little decision theory podcast and next week's guest actually defends superrationality as the rational move in a one-shot prisoner's dilemma against a psychological twin (and one-boxes on Newcomb for basically the same reason). Can you draft 8-9 interview questions that go past just having her restate the argument? I want at least one on the fact that mutual defection is ALSO a symmetric outcome, so symmetry alone can't be what's picking out cooperation, one on whether the view just smuggles in 'agents will coordinate on the better equilibrium' as an extra premise thats doing all the work, and one connecting her view to functional decision theory's 'subjunctive dependence' move. For each, give me the reply she'll probably reach for and a follow-up that keeps the pressure on.
