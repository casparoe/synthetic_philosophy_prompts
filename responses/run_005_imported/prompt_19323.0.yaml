answer: |-
  ## Taking Hinges by the Handle: Why Moyal-Sharrock Gets Wittgenstein Right (And Solves the Relativism Riddle)

  Professor, I appreciate the call to arms – and the insistence we grapple with the relativism specter that haunted your seminar. Having wrestled with *On Certainty* (OC) and this interpretive fray, I believe **Danièle Moyal-Sharrock's non-propositional, embodied "animal certainty" interpretation is not only defensible but the *most* faithful to Wittgenstein's text and the *only* one that genuinely dissolves the skeptical threat without capitulating to relativism.** The others, despite their sophistication, subtly reintroduce the very conceptual frameworks Wittgenstein aimed to dismantle. Let's grab this hinge by the handle.

  **The Core Argument: Hinges as Enacted, Not Believed**

  Pritchard, Wright, and Coliva, despite their differences, share a crucial assumption: hinges are *propositional attitudes*. They debate whether it's a belief (Coliva), a warranted acceptance (Wright), or an arational commitment (Pritchard), but they treat "The earth has existed for many years" or "Here is a hand" as *objects* of mental assent. Wittgenstein explicitly rejects this:

  *   **OC 204:** "Giving grounds... comes to an end. – But the end is not an ungrounded presupposition: it is an ungrounded way of acting." Wittgenstein doesn't say "it is an ungrounded *belief*" or "an ungrounded *proposition we accept*." The bedrock is *action*.
  *   **The River-Bed (OC 96-99):** "It might be imagined that some propositions, of the form of empirical propositions, were hardened and functioned as channels for such empirical propositions as were not hardened but fluid... **And this relation altered with time, in that fluid propositions hardened, and hard ones became fluid.**" The river-bed metaphor isn't about fixed *beliefs*, but about the *dynamic structure enabling the flow of inquiry*. What's hardened isn't a proposition held true in the mind, but a *pattern of action and expectation* so ingrained it shapes *how* we navigate the world. Beliefs (fluid propositions) can *become* part of this structure over time. Hinges aren't static beliefs; they are the evolving *conditions of possibility* for belief-as-questioning.
  *   **The Door Hinge (OC 341-343):** "The *questions* that we raise and our *doubts* depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn... **That is to say, it belongs to the logic of our scientific investigations that certain things are *in deed* not doubted.**" The emphasis is crucial: "*in deed*" (*in der Tat*). The certainty isn't a mental state *about* the hinge; it's manifested *in what we do*. We don't *believe* the door swings on its hinges; we *use* the hinges to open the door. Doubt *turns on* this unthinking reliance, enacted in our practice. The hinge isn't a proposition we contemplate; it's the *mechanics of our movement*.

  Moyal-Sharrock's insight is that this enacted certainty is **pre-doxastic** and **non-propositional**. It's akin to *know-how*: the certainty with which I reach for a doorknob, the unthinking expectation that the ground will support me, the immediate recognition of a human face. This isn't "belief" in the standard sense requiring justification or even conceptual articulation. It's the **animal certainty** Wittgenstein links to our form of life (OC 358-359). Trying to fit this into the mold of "belief" (even "special belief") or "warranted acceptance" is like trying to fit a door hinge into a filing cabinet – you distort its function.

  **Why the Alternatives Stumble (Textually and Philosophically)**

  1.  **Pritchard's Quasi-Fideism (Arational Commitment):** While correctly emphasizing groundlessness and immunity to evidence, framing it as a "commitment" risks intellectualizing it. OC constantly points *away* from internal states towards public practice (e.g., OC 110: "As if giving grounds did not come to an end sometime. But the end is not an ungrounded presupposition: it is an ungrounded way of acting."). Pritchard's "commitment" sounds too much like a mental act *about* the hinge, potentially reviving the ghost of the inner realm Wittgenstein exorcised. More critically, leaving hinges purely "arational" makes the relativism challenge terrifyingly easy: why *not* witchcraft hinges?
  2.  **Wright's Entitlement (Rational Warrant):** Wright injects a kind of *normative permission* where Wittgenstein insists there is none. Wittgenstein explicitly rejects the need for *any* warrant, evidential or otherwise, for hinges (OC 243: "I should like to say: Moore does not *know* what he asserts he knows, but it stands fast for him, as also for me; regarding it as absolutely solid is part of our *method* of doubt and enquiry."). The "method" is the key – it's about how we *operate*, not a warrant we possess. Wright, seeking rational security, rebuilds a justificatory structure *beneath* the river-bed, precisely where Wittgenstein declared construction finished. This undermines the anti-skeptical force – the skeptic can now demand justification for *this* non-evidential warrant.
  3.  **Coliva's Moderatism (Special Beliefs):** Insisting hinges *are* beliefs, even "constitutive" ones, fundamentally misreads the text. Wittgenstein repeatedly contrasts "standing fast" with "knowing" or "believing" (OC 151: "I do not explicitly learn the propositions that stand fast for me... I hold them fast. That is, I do not let myself be budged from them. For if I did, I should have no firm point to turn to."). Holding fast isn't *believing*; it's the precondition *for* belief to function. Attributing "belief" to hinges reintroduces the question of truth/falsity and justification *for them*, the very questions the hinge role is meant to make senseless. This view is most vulnerable to the "witchcraft hinge" charge: if it's just a different constitutive belief, what's wrong with it?

  **Tackling the Relativism Monster: Pathology, Not Pluralism**

  This is where Moyal-Sharrock's view shines, grounded firmly in OC's naturalism and focus on practice. Relativism arises if we see hinges as *arbitrary* propositions held true. But if hinges are **embodied certainties manifest in successful action within a shared world**, the picture changes radically.

  1.  **Hinges Enable *World-Engagement*, Not Just World-Pictures:** A hinge isn't just *any* deeply held idea. It's a certainty *embedded in our successful interaction with reality*. The hinge "Objects don't vanish spontaneously" isn't a proposition I believe *about* physics; it's the certainty *manifested* when I put my coffee cup down and turn around, expecting it to remain. Its "truth" is its *viability* in enabling coherent, effective action within the world *as we find it*.
  2.  **Pathological "Hinges" Cause Collapse:** Consider the "witchcraft causes illness" hinge. Could this function *as* a hinge? Only within an incredibly narrow, fragile, and ultimately self-defeating practice. It doesn't *enable* a rich, stable form of life capable of sustained inquiry or technological mastery. When faced with germ theory, antibiotics, epidemiology, etc., a practice built on the "witchcraft" hinge *collapses*. It cannot adapt, predict, or reliably intervene. It fails the *functional* test of a hinge: enabling a dynamic, sustainable river-bed of thought and action. Wittgenstein hints at this:
      *   **The Oracle Community (OC 609-612):** Wittgenstein imagines consulting an oracle instead of a physicist. Crucially, he doesn't say this is *just as good*. He notes the *practical consequences*: "If that is what we call 'asking the oracle' and 'acting on its advice', then the oracle must be right." But the key is the *if* – it's defined *within* that practice. However, he immediately points out the instability: "But of course, there is no such thing as that here." Why? Because the practice of consulting physicists demonstrably *works* within *our* world-engagement, enabling prediction, technology, and coherent explanation across contexts. An oracle-based "physics" couldn't build a bridge or cure smallpox. It wouldn't be a *rival framework*; it would be a *pathology* that couldn't sustain itself as a hinge *system* for long.
  3.  **Natural Constraints:** Our hinge certainties aren't arbitrary. They arise from our biological constitution and our immersion in a stable physical world (OC 505: "What stands fast does so, not because it is intrinsically obvious or convincing; it is rather held fast by what lies around it."). The "lying around it" is the entire web of our successful practices and the world's regularities. Hinges like "The earth exists" or "My senses are generally reliable" are not *chosen* doctrines; they are the *emergent scaffolding* of a form of life that has evolved to navigate *this* world. Pathological hinges sever this connection to sustainable world-engagement.

  **Conclusion: Certainty as the Ground We Walk On**

  Moyal-Sharrock rescues hinge epistemology from becoming just another theory *about* justification. By locating certainty in *embodied action* and *successful practice* rather than propositional attitudes, she captures Wittgenstein's radical break: **knowledge and doubt don't rest on beliefs; they arise *within* a framework of unthinking, animal certainty manifested in what we *do*.**

  This view definitively silences the skeptic: demanding justification for the hinges is like demanding justification for walking – it misunderstands the logical grammar of the concept. The hinges *are* the walking. And it vanquishes relativism not by asserting absolute truth, but by recognizing that genuine hinges are those that *enable* a viable, adaptable, and successful engagement with the world we inhabit. Pathologies like "witchcraft hinges" aren't alternative frameworks; they are conceptual/methodological dead ends that crumble under the weight of their own impracticality. They fail the functional test inherent in Wittgenstein's river-bed and door hinge metaphors – they cannot sustain the flow of inquiry or the movement of thought. The groundlessness of hinges isn't an invitation to "anything goes"; it's the revelation that our deepest certainties are the very ground we walk on, tested and confirmed with every successful step. That’s the take I’d stake my grade on – and the one I’d defend in your seminar’s next eruption.
