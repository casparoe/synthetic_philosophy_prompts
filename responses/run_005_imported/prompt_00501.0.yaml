answer: |-
  You've zeroed in on the *core* controversy surrounding Strawson's project – the move from the descriptive ("we *do* and *can't help but* react this way") to the normative ("therefore, it's *appropriate* to react this way"). Let's break down the objection precisely and then explore how Strawsonians defend against it.

  **The Core Objection: The "Is-Ought" Gap & Its Specific Form Here**

  1.  **The Descriptive Claim (The "Is"):** Strawson meticulously describes our deeply ingrained, non-optional psychological repertoire: reactive attitudes (resentment, indignation, guilt, gratitude, forgiveness, etc.) and the participant stance they embody. He argues that abandoning these wholesale in favor of a universal objective attitude (seeing everyone as objects to be managed, not agents to engage with) is psychologically impossible and socially catastrophic. Determinism, even if true, *couldn't* lead us to do this in practice.
  2.  **The Normative Claim (The "Ought"):** Strawson concludes that these reactive attitudes are *justified* or *appropriate* ways of holding people morally responsible. They constitute the very *meaning* of moral responsibility within our form of life. Determinism doesn't threaten *this* kind of responsibility.
  3.  **The Gap:** The objection is that Strawson hasn't provided a bridge. Merely pointing out that we *have* these attitudes and *can't* abandon them doesn't show that they are *correct*, *fair*, *truth-tracking*, or *morally justified*. It seems to conflate:
      *   **Psychological Necessity:** "We are built to react with resentment when wronged."
      *   **Normative Justification:** "It is *right* or *warranted* to resent someone who wrongs you (under conditions X, Y, Z)."
  4.  **Why it's More Than Just "Naturalistic Fallacy":** While related, the objection is sharper:
      *   **Possibility of Error:** Just because a psychological mechanism is universal and inescapable doesn't mean it's reliable. We have universal cognitive biases (e.g., confirmation bias) that systematically lead us astray. Why couldn't reactive attitudes be a similar kind of error?
      *   **Potential for Harm:** Some reactive attitudes (e.g., excessive resentment, vengefulness) can be deeply destructive. Their psychological necessity doesn't automatically justify their expression or negate the need for reform.
      *   **The "Could" vs. "Should":** Even if we *couldn't* abandon them, it doesn't follow we *shouldn't* try to mitigate, refine, or critically evaluate them. Strawson's argument might seem to preclude such critical evaluation.
      *   **Justification Source:** What *makes* resentment appropriate? Strawson points to our social nature, but critics demand a *reason* why this nature grounds *normativity*. Is it circular? ("Resentment is justified because it's part of our practice of holding responsible, which is defined by resentment...").

  **How Strawsonians Defend Against the Gap (Closing the "Is-Ought"):**

  Defenders argue Strawson isn't *deriving* an "ought" from a bare "is," but rather *reconceiving the nature of moral responsibility and its justification*. Here are the key strategies:

  1.  **The Constitutive Argument:**
      *   **Claim:** Moral responsibility isn't some freestanding metaphysical property waiting to be discovered "out there." It is *constituted by* our reactive attitudes and the practices of the participant stance. Responsibility *just is* being an appropriate target of these attitudes.
      *   **Analogy:** Think of "being funny." There's no platonic form of "funny." Something *is* funny if competent judges (within a community, context) find it funny and react with laughter. Similarly, an agent *is* responsible if they are an appropriate target of reactive attitudes within the web of human relationships.
      *   **Closing the Gap:** If responsibility is *defined* by these attitudes and practices, then their existence and inescapability *do* justify them *within the framework they define*. Asking for an external justification (e.g., from physics or metaphysics) is like asking for a justification of "funny" outside of human reactions – it misunderstands the concept. The justification is *internal* to the practice.

  2.  **The Framework Argument / Necessary Conditions for Human Life:**
      *   **Claim:** The participant stance, with its reactive attitudes, isn't just a psychological quirk; it's the *essential framework* that makes meaningful human relationships (friendship, love, cooperation, shared projects, even basic communication) possible. Abandoning it wholesale isn't just impractical; it would mean ceasing to engage with others *as persons*.
      *   **Normative Force:** What justifies the framework? Its indispensability for the kinds of lives and relationships we fundamentally value and cannot coherently imagine giving up without ceasing to be recognizably human. The value we place on these relationships *transmits* normative force to the attitudes that make them possible.
      *   **Closing the Gap:** The "ought" arises from the deep human goods the framework enables. We *ought* to maintain the participant stance *because* it is constitutive of the relationships that give our lives meaning and value. The psychological necessity reflects this deep normative commitment.

  3.  **Internal Standards of Appropriateness:**
      *   **Claim:** Strawson *doesn't* say *every* instance of resentment is justified. He explicitly discusses **exemptions** (e.g., children, the severely mentally ill – those incapable of participating in the moral community) and **excuses** (e.g., accidents, coercion – where the normal expectations of the moral community weren't violated).
      *   **Normative Structure:** The system of reactive attitudes *itself* has built-in normative standards. We constantly judge whether a reactive attitude is *warranted* in a specific case. Was it intentional? Did they understand? Were they coerced? Were they capable? These questions *presuppose* the framework but *provide justification* for specific instances within it.
      *   **Closing the Gap:** The justification for holding responsible *via* reactive attitudes comes from applying the *internal norms of the practice itself* (fairness, reasonableness, recognition of agency). We don't need an external metaphysical guarantee; we need reasons internal to the practice of relating to each other as responsible agents. (R. Jay Wallace's work develops this line powerfully, grounding responsibility in a *norm of fairness* applied within the practice).

  4.  **Rejecting the "External Perspective" Demand:**
      *   **Claim:** The demand for a justification *outside* the human participant perspective misunderstands the nature of the question. Moral responsibility is a concept that only makes sense *within* that perspective. Seeking a "view from nowhere" justification is incoherent for this domain.
      *   **Closing the Gap:** The only possible justification *is* the one found within the lived reality of human relationships. The fact that this perspective is inescapable for us *is* the relevant datum. Trying to step completely outside it to judge it is impossible and pointless.

  **Key Points for Seminar Defense:**

  *   **Strawson's Target:** Emphasize he wasn't trying to *prove* determinism false or find a metaphysical grounding. He was shifting the *question* away from abstract metaphysics to the actual practices that *constitute* responsibility.
  *   **Not "Anything Goes":** Stress that Strawsonians acknowledge exemptions, excuses, and the need for critical reflection *within* the framework. The framework justifies the *practice*, not every specific emotional outburst.
  *   **Value of Relationships:** Hammer home the argument that the participant stance is necessary for intrinsically valuable human goods. The justification flows from the value of what it enables.
  *   **Constitutive vs. Tracking:** Argue that responsibility isn't something our attitudes *track* (like a radar); it's something they *create* or *define* within the moral community.
  *   **The Alternative:** Ask what the alternative justification *could* be. If not our deep-seated practices and the values they serve, then what? A libertarian free will that might be incoherent? A utilitarian calculus that ignores the personal nature of blame and praise? Strawson offers a naturalistic, human-centered account.

  By understanding these defenses, you can move beyond simply accusing Strawson of the naturalistic fallacy and engage with the sophisticated attempt to ground normativity in the indispensable structures of human social life. Good luck in your seminar!
