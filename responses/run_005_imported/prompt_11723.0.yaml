  We are evaluating five claims made by Nate and Farah in their argument about whether it's irrational to decline a costless genetic test for Huntington's disease when there is no treatment but the information could affect other life decisions.

  Recall Good's theorem: In a decision problem, a Bayesian agent should always weakly prefer to observe a costless signal before choosing an action. The reason is that with the information, the agent can condition their action on the signal, and at worst, they can ignore the signal and do what they would have done without it. Thus, the expected utility cannot decrease.

  Now, let's break down each point:

  1. Nate: "Good's theorem says ... so refusing free evidence ... can never raise your expected utility, and her declining the test is a plain mistake."

     - Nate is correct in stating the core idea of Good's theorem: costless information cannot hurt (in the sense of expected utility) in a decision problem. However, the theorem assumes that the decision problem (the set of available actions and their utilities) remains unchanged by the act of observing the signal. If the test result might directly affect the agent's utility (e.g., through psychological costs) in a way that is not mediated by the choice of action, then the theorem's assumptions are violated.

     - Score: Partially correct, but note that the theorem requires the decision problem to be fixed. If there is a direct utility cost to knowing, then the "costless" part is violated. So, we cannot say it's a "plain mistake" without considering if the theorem applies.

     - Verdict: 1 (Mostly right, but with an important caveat that he might be overlooking)

  2. Farah: "the theorem is stated relative to a fixed decision problem ... There's no treatment for Huntington's, so there's no act the result would change, so the theorem doesn't even get a foothold here."

     - Farah is right that Good's theorem requires a decision problem. However, she claims that because there is no treatment, there is no decision problem. But note that Nate in (3) points out that there are other decisions (having kids, savings, etc.) that the test result would affect. So, there is a decision problem (or multiple) that the agent faces. Therefore, Farah's initial point (in 2) is incorrect because the absence of a treatment does not imply the absence of any decision problem.

     - Score: -1 (Wrong because there are indeed decision problems that the information would affect)

  3. Nate: "there's plenty it would change — whether to have biological kids, ... so the antecedent is satisfied after all."

     - Nate is correct. The Huntington's test result would affect several life decisions. Therefore, the antecedent of Good's theorem (that there is a decision problem) is satisfied.

     - Score: 2 (Clearly right)

  4. Farah: "it only shows the theorem covers the decision-relevant slice of the value; it says nothing about the direct psychological cost ... The moment 'finding out' carries a cost ... you're outside what the theorem was ever about."

     - Farah makes a valid point. Good's theorem assumes that the utility function is defined over outcomes and that the act of observing the signal does not by itself change the utility. If learning the result causes direct psychological harm (e.g., dread, anxiety, loss of hope) that is not captured by the consequences of the actions (e.g., having a child who might inherit the disease), then the utility of the state of being informed might be lower than being uninformed, independent of the actions taken. This direct cost is not considered in the theorem because the theorem holds the decision problem (including the utility function over outcomes) fixed. Therefore, if the utility function is defined to include the state of knowledge, then the theorem does not apply because the set of outcomes (and hence the utilities) changes.

     - Score: 2 (Clearly right about the limitation of Good's theorem)

  5. Nate: "doesn't that move generalize to justify anything? ... If dread counts as a legitimate cost in Farah's story, why doesn't it count there too?"

     - Nate is arguing that if we allow psychological costs to count, then it could be used to justify irrational behavior in other contexts (like a gambler avoiding checking the score). However, Farah's point is that the utility function should reflect all aspects of the agent's well-being, including psychological states. In the gambler example, if the gambler's utility is lower when he knows he lost (because of disappointment) than when he doesn't know, then it might be rational to avoid checking. But note: in the gambler case, there is no decision problem that the information would affect? Actually, there might be: if the gambler has to decide whether to place another bet, then knowing the outcome of the previous bet might be irrelevant? Or if it's about the same game? Let's clarify.

       However, the key is that if the agent's utility function includes psychological states, then the direct effect of information on utility is a legitimate component. Good's theorem does not account for this because it assumes the utility is over outcomes that are independent of the information state. Therefore, if we define the utility function to include the information state, then the theorem's assumptions are violated. But note: in the gambler case, if there is no decision to be made, then Good's theorem does not apply at all. If there is a decision (e.g., whether to continue gambling), then the theorem would say that information is costless and should be preferred. However, if the act of knowing the loss causes immediate disutility that isn't offset by the benefits in decision making, then the net effect might be negative.

       So, Nate's comparison does not necessarily show that Farah's move is invalid. Instead, it highlights that the utility function must be comprehensive. In both cases, if the agent experiences a direct psychological cost from knowing, then that cost must be included in the utility calculation. The gambler who avoids checking might be rational if the psychological cost of knowing (without any compensating decision benefits) is high enough. However, in the gambler case, if the information is about a past event and there are no future decisions that it affects, then the only effect is the psychological one. In the Huntington's case, there are both psychological costs and decision benefits.

     - Verdict: Nate's gambler example does not refute Farah's point. It just shows that psychological costs are a general consideration. But it does not prove too much because in each case, we must balance the decision benefits (if any) against the psychological costs. So Nate is wrong in suggesting that allowing psychological costs leads to absurdity. It leads to a more comprehensive utility model.

     - Score: -1 (Nate's point is not a successful refutation of Farah's distinction)

  Now, let's summarize the scores:

  1. Nate's initial claim: Mostly right, but overlooks the possibility of direct utility effects. Score: 1
  2. Farah's first point: Wrong because there is a decision problem. Score: -1
  3. Nate's reply: Correct that there is a decision problem. Score: 2
  4. Farah's distinction: Correct about the limitation of Good's theorem regarding direct costs. Score: 2
  5. Nate's gambler comparison: Does not successfully refute Farah, because psychological costs are a legitimate part of utility. Score: -1

  Additionally, we should note a standard qualification on Good's theorem that both might be missing:

  Good's theorem assumes that the observation of the signal does not change the available actions or the utility function. However, if the act of observing the signal changes the agent's psychological state (and hence the utility of outcomes) or if it changes the set of available actions (which it doesn't in this case), then the theorem does not apply. Therefore, the standard qualification is that the decision problem must be fixed, including the utility function. If the utility function is defined over both physical outcomes and information states, then the theorem must be adjusted. In fact, there are extensions that consider the value of information when there are psychological costs, but the basic theorem does not cover that.

  In summary, the key qualification is that Good's theorem holds only when the utility function is defined solely on the outcomes of actions and not on the information state itself. If the utility function includes the information state, then the theorem does not directly apply.

