answer: |-
  You've hit upon one of the most persistent and fascinating tensions in Kantian ethics. Your friend's argument is intuitive and compelling on the surface, but Kant himself explicitly rejected direct moral status for animals. Let's unpack why:

  **Kant's Explicit View: Animals Have Indirect Moral Status Only**
  Kant undeniably restricts *direct* moral standing (being an "end-in-itself") to rational, autonomous beings capable of setting ends according to universal law (humans). Animals, lacking rationality and autonomy, are "things." However, he *does* condemn cruelty to animals – not for the animal's sake, but for *ours*:

  > *"He who is cruel to animals becomes hard also in his dealings with men... Tender feelings towards dumb animals develop humane feelings towards mankind."* (Lectures on Ethics)
  > *"Violence (crudelitas) to animals is... opposed to a man's duty to himself... for it dulls his shared feeling of their suffering and so weakens... a natural predisposition that is very serviceable to morality."* (Metaphysics of Morals)

  **Your Friend's Argument & Why Kant Would Reject It:**
  1.  **The Core Issue:** Your friend argues that the *contradiction* in willing cruelty to animals as a universal law arises *because of the suffering inflicted on the animals themselves*. Therefore, that suffering must be morally significant *in itself*.
  2.  **Kant's Rebuttal:** Kant would argue the contradiction arises *entirely within the rational will of the moral agent*, concerning *their own* moral character and duties *to themselves and other rational beings*:
      *   **Harm to Humanity:** Cruelty to animals cultivates a cruel *disposition* (Gesinnung) in the human agent. This disposition makes the agent *less capable* of fulfilling their duties *to other rational beings* (humans). It weakens the "shared feeling of suffering" (compassion/sympathy) which is a valuable natural predisposition aiding morality.
      *   **Duty to Self:** Developing a cruel disposition violates the duty to cultivate one's own moral perfection. It corrupts the humanity within oneself.
      *   **The Contradiction is Practical, Not Logical:** Willing universal cruelty to animals doesn't create a *logical* contradiction in the world (like universal lying or promise-breaking does). The contradiction is *practical*: a rational agent cannot consistently will a maxim that actively *undermines* their own capacity for morality and their duty to cultivate virtue. The suffering of the animal is relevant only as the *means* by which the agent corrupts *themselves*.

  **Addressing Your Key Question:**
  *   **"Doesn't the suffering have to count morally in its own right?"** For Kant, **no.** The suffering is a *fact* that triggers a duty, but the *source* of the duty is the agent's own moral character and duties to humanity (in themselves and others). The suffering itself lacks intrinsic moral weight *if* it occurs to a non-rational being. It only matters *instrumentally* – as something that, when inflicted, damages the moral agent.

  **Why Your Friend's Logic Seems Compelling (and Where it Deviates from Kant):**
  1.  **Intuition:** Our moral intuition *does* recoil at animal suffering *for the animal's sake*. We instinctively assign the suffering itself moral significance.
  2.  **Conflation:** The argument subtly imports a utilitarian or sentientist premise (suffering is intrinsically bad) into the Kantian framework. Kant's system is rigorously *deontological* and *rational-agent-centered*. The badness lies in the violation of duty by the rational agent, not in the pain per se.
  3.  **Focus on the Victim:** The argument focuses on the *recipient* of the action (the animal suffering). Kant's focus is solely on the *agent* performing the action and the state of *their will*.

  **Contemporary Kantian Responses:**
  Some modern Kantians argue Kant's *own principles* can be extended to grant animals *some* form of direct moral status, often by:
  1.  **Analogous Argument:** While animals aren't "ends-in-themselves," they are "ends-of-a-kind." We cannot rationally will to treat beings capable of suffering as *mere* things without contradiction regarding our own moral sentiments or respect for sentience.
  2.  **Duties Regarding Sentience:** Arguing that the capacity for sentience (even without rationality) creates a duty *not to cause suffering* directly, as part of respecting life or avoiding wanton destruction of what has inherent value (even if not absolute value).
  3.  **Indirect Status is Insufficient:** Critiquing Kant's indirect duty view as failing to capture the full moral wrong of animal cruelty.

  **Conclusion:**
  Your friend presents a powerful and intuitively appealing argument. However, **within Kant's *own* strict framework**, it misidentifies the source of the duty. For Kant:
  *   The Categorical Imperative forbids cruelty to animals **not because animal suffering has intrinsic moral weight**, but **because it corrupts the moral character of the rational agent**, violating their duties to cultivate humanity within themselves and towards others.
  *   Animals remain beings with **indirect moral status only** – we have duties *regarding* them, but not *direct duties *to* them*.

  The tension arises because Kant's rigorous focus on rationality as the sole ground of intrinsic value clashes with powerful moral intuitions about suffering. While your friend's logic points towards a sentientist view (like utilitarianism or Singer's arguments), Kant himself firmly anchored the prohibition against cruelty to animals within the self-regarding duties of the rational moral agent.
