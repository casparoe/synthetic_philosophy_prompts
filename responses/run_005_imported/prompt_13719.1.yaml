prompt: |-
  So I've been on a bit of a Bayesian decision theory kick lately (blame a stats podcast) and ran into I.J. Good's old 1967 result, the one that's usually filed under "the principle of total evidence." The claim is that a rational expected-utility maximizer can never expect, ahead of time, to be made worse off by getting a piece of free evidence relevant to a decision, as long as their allowed to just ignore the evidence if it turns out to be useless. Every source that mentions this just states it like its obvious ("well of course more info can't hurt you") and moves on, but when I actually tried to reconstruct for myself why it has to be true, rather than just feels true, I got stuck.

  What I'd love is for you to walk me through the actual mechanics of why the theorem holds, aimed at someone who can follow the math but wants the "aha," not just a restatement of the definitions. Like, is the whole proof basically just Jensen's inequality wearing a trenchcoat (the expectation of a max is >= the max of an expectation, so having the option to tailor your action to whatever you learn beats committing to one action in advance), or is there something more specifically decision-theoretic going on that I'm missing? And how does it relate to Blackwell's older, more general theorem about when one experiment counts as "more informative" than another for every possible decision-maker?

  And then, if you can, get into the weeds a bit on the classic-seeming exceptions people throw at this. Things like markets where information becoming public can destroy insurance-type arrangements that only worked because of everyone's shared uncertainty (I want to say this is called the Hirshleifer effect, but don't hold me to the name), or the everyday case of someone who'd genuinely rather not know a piece of information early even though knowing wouldn't change a single thing they'd do about it. Are cases like that real counterexamples to Good's theorem, or is each one secretly smuggling in a violation of some assumption baked into the proof (no cost to acquiring the info, a single decision-maker instead of several people whose strategies interact, purely instrumental preferences with nothing riding on the belief state itself, etc.)? Me and a friend keep going back and forth on whether these are "genuine" exceptions or just different problems wearing a disguise, and I'd like to actually pin down which assumption is doing the load-bearing work in each case.
reasoning: |-
  We are discussing I.J. Good's 1967 result, which states that for a rational expected-utility maximizer, acquiring free relevant evidence (with the option to ignore it) cannot have negative expected utility. The intuition is that more information should not hurt, but we want to see the formal reasoning and then examine apparent counterexamples.

  ### The Formal Argument

  Consider a decision problem with:
  - A set of possible actions \( A \).
  - A set of states of the world \( \Theta \), which we are uncertain about.
  - A utility function \( u: A \times \Theta \to \mathbb{R} \).

  The decision-maker has a prior probability distribution \( P \) over \( \Theta \).

  Without additional evidence, the decision-maker chooses an action \( a \in A \) to maximize expected utility:
  \[
  \max_{a \in A} \mathbb{E}_P[u(a, \Theta)] = \max_{a \in A} \sum_{\theta} u(a, \theta) P(\theta).
  \]

  Now, suppose the decision-maker can observe the outcome of an experiment (or a piece of evidence) \( X \), which is a random variable that may depend on \( \Theta \). Let \( x \) denote a possible realization of \( X \). After observing \( X = x \), the decision-maker updates their belief to the posterior \( P(\theta | x) \) and then chooses an action to maximize expected utility conditional on \( x \):
  \[
  a(x) = \arg\max_{a \in A} \mathbb{E}[u(a, \Theta) | X = x].
  \]

  The expected utility of this strategy (which we call the "informed" strategy) is:
  \[
  \mathbb{E}_X \left[ \max_{a \in A} \mathbb{E}[u(a, \Theta) | X] \right].
  \]

  Without the evidence, the expected utility is:
  \[
  \max_{a \in A} \mathbb{E}[u(a, \Theta)].
  \]

  Good's result is that:
  \[
  \mathbb{E}_X \left[ \max_{a \in A} \mathbb{E}[u(a, \Theta) | X] \right] \geq \max_{a \in A} \mathbb{E}[u(a, \Theta)].
  \]

  ### Why is this true?

  The key is that the decision-maker with the evidence can always choose to ignore it. That is, they can choose an action that is constant in \( X \). In particular, they can choose the same action that is optimal without the evidence. Therefore, the strategy that conditions on \( X \) must do at least as well as any fixed action (and in particular the best fixed action) because it includes the fixed action as a special case.

  Mathematically, for any fixed action \( a_0 \), we have:
  \[
  \max_{a \in A} \mathbb{E}[u(a, \Theta) | X] \geq \mathbb{E}[u(a_0, \Theta) | X].
  \]

  Taking expectations over \( X \):
  \[
  \mathbb{E}_X \left[ \max_{a \in A} \mathbb{E}[u(a, \Theta) | X] \right] \geq \mathbb{E}_X \left[ \mathbb{E}[u(a_0, \Theta) | X] \right] = \mathbb{E}[u(a_0, \Theta)].
  \]

  Since this holds for every fixed \( a_0 \), it holds in particular for the \( a_0 \) that maximizes \( \mathbb{E}[u(a_0, \Theta)] \). Therefore:
  \[
  \mathbb{E}_X \left[ \max_{a \in A} \mathbb{E}[u(a, \Theta) | X] \right] \geq \max_{a_0 \in A} \mathbb{E}[u(a_0, \Theta)].
  \]

  This is the result.

  ### Relation to Blackwell's Theorem

  Blackwell's theorem (1951) provides a way to compare the informativeness of two experiments. It states that for two experiments (or information structures) \( X \) and \( Y \), experiment \( X \) is more informative than \( Y \) (in the sense that for any decision problem, the expected utility from \( X \) is at least as high as from \( Y \)) if and only if \( X \) is "Blackwell-sufficient" for \( Y \). This means that \( Y \) can be obtained from \( X \) by adding noise (i.e., by applying a stochastic transformation).

  Good's result can be seen as a special case of Blackwell's theorem. In Good's setting, we are comparing having the evidence \( X \) versus having no evidence. The experiment of "no evidence" is trivial (it gives no information). Since the trivial experiment can be obtained from any experiment \( X \) by ignoring the result (i.e., by applying a constant stochastic transformation), Blackwell's theorem implies that \( X \) is more informative than the trivial experiment. Therefore, the expected utility with \( X \) is at least as high as without.

  ### Apparent Counterexamples and Their Analysis

  Now, let's consider the counterexamples you mentioned.

  1. **The Hirshleifer Effect (or Market Settings with Public Information)**:

     In a market setting, public information can destroy insurance opportunities. For example, consider two risk-averse farmers who would like to share the risk of crop failure. If they are both uncertain about whether there will be a drought, they can trade and insure each other. But if it becomes publicly known whether there will be a drought, then in the state with drought, the farmer with the failed crop cannot get insurance because the other farmer knows he will have to pay without receiving anything. Thus, the market breaks down.

     **Why is this not a counterexample to Good's theorem?**  
     - Good's theorem applies to a single decision-maker. In the market setting, we have multiple decision-makers (the farmers) whose actions are interdependent. The theorem does not apply to strategic interactions (games). In fact, in a game, revealing information publicly can change the equilibrium and lead to worse outcomes for some players.

     - Moreover, the farmers' preferences are defined over outcomes (consumption) and not over the information structure. However, the mechanism by which information affects the equilibrium is outside the scope of the single-agent decision problem.

  2. **Preferring Not to Know Even When Knowing Doesn't Change Actions**:

     Consider a person who is offered a test for a genetic disease. They might say: "If I test positive, I will be devastated, and if I test negative, I will be relieved. But I don't plan to take any treatment either way (because there is none). So I prefer not to know."

     **Why is this not a counterexample?**  
     - Good's theorem assumes that the utility function depends only on the state and the action, not on the information itself. In this case, the person's utility is affected by the psychological state of knowing or not knowing. Therefore, the utility function is not of the form \( u(a, \theta) \) but rather \( u(a, \theta, \text{belief}) \). 

     - Formally, if we let \( I \) be the information structure (whether they know or not), then the utility becomes \( u(a, \theta, I) \). The theorem does not account for such belief-dependent utility.

     - Alternatively, we can think of the act of acquiring information as having a direct cost in utility (even if it's free monetarily). But note that the theorem assumes no cost to acquiring the information. However, in this example, the cost is psychological and affects utility even if the action remains the same.

     - Therefore, this violates the assumption that utility is solely a function of the state and the action.

  ### Other Assumptions

  - **Free Evidence**: The theorem assumes that acquiring evidence is free (no cost). If there is a cost, then it might be that the cost outweighs the benefit. But the theorem explicitly states that the evidence is free and that you can ignore it.

  - **Single Decision-Maker**: The theorem is for a single decision-maker. In multi-agent settings, the results do not hold because of strategic considerations.

  - **Instrumental Preferences**: The utility function must depend only on the state of the world and the action taken, not on the information per se. If the decision-maker has intrinsic preferences about their beliefs (e.g., they want to be optimistic), then the theorem breaks.

  ### Conclusion

  Good's theorem is a solid result within the framework of a single decision-maker with expected utility preferences that depend only on the state and action, and when the information is free and can be freely ignored. The proof is a straightforward application of the idea that having more options (by conditioning on the evidence) cannot hurt because you can always choose to ignore the evidence and act as if you didn't have it.

  The apparent counterexamples arise when we step outside this framework: either by considering multiple decision-makers (game theory), belief-dependent utility, or costs of information (including psychological costs). In each case, the violation of an assumption of the theorem explains the exception.
answer: |-
  Let's dive into the mechanics of Good's theorem, its relation to Blackwell, and those tricky counterexamples. I'll break it down step by step, focusing on the "aha" moments and where the assumptions bear weight.

  ### The Core Mechanics: Why Good's Theorem Holds
  **Setup**: A decision-maker has:
  - Actions \(a \in A\)
  - States of the world \(\theta \in \Theta\) (unknown, with prior \(P(\theta)\))
  - Utility \(u(a, \theta)\) (bounded, to avoid technical issues)

  **Without evidence**, they choose \(a^*\) maximizing expected utility:
  \[
  V_0 = \max_{a} \mathbb{E}_\theta [u(a, \theta)]
  \]

  **With free evidence \(X\)** (a random variable correlated with \(\theta\)), they observe \(x \sim P(X|\theta)\), update to posterior \(P(\theta|X=x)\), then choose \(a(x)\) maximizing:
  \[
  V_X = \mathbb{E}_X \left[ \max_{a} \mathbb{E}_{\theta|X} [u(a, \theta)] \right]
  \]

  **Good's claim**: \(V_X \geq V_0\). Why?

  #### The "Aha" Proof
  1. **The Ignorance Option is Key**:  
     The decision-maker with evidence can *simulate ignorance* by choosing a fixed action \(\tilde{a}\) *independent of \(X\)*. For *any* fixed \(\tilde{a}\):
     \[
     \max_{a} \mathbb{E}_{\theta|X} [u(a, \theta)] \geq \mathbb{E}_{\theta|X} [u(\tilde{a}, \theta)] \quad \text{(for every } X\text{)}
     \]
     Taking expectations over \(X\):
     \[
     \mathbb{E}_X \left[ \max_{a} \mathbb{E}_{\theta|X} [u(a, \theta)] \right] \geq \mathbb{E}_X \left[ \mathbb{E}_{\theta|X} [u(\tilde{a}, \theta)] \right] = \mathbb{E}_\theta [u(\tilde{a}, \theta)]
     \]
     This holds for *any* \(\tilde{a}\), including the *ex ante* optimal action \(a^*_0\):
     \[
     V_X \geq \mathbb{E}_\theta [u(a^*_0, \theta)] = V_0
     \]
     **Aha!**: Conditioning on \(X\) expands your strategy set to include all fixed actions plus more. More options can't hurt.

  2. **Jensen's Inequality Connection**:  
     Yes, this is Jensen in a trenchcoat! Define \(f(X) = \max_{a} \mathbb{E}_{\theta|X} [u(a, \theta)]\). Then:
     \[
     V_X = \mathbb{E}_X [f(X)] \geq f(\mathbb{E}_X[X]) \quad \text{?}
     \]
     But wait—\(f(X)\) is a *random variable*, and Jensen says \(\mathbb{E}[\phi(Y)] \geq \phi(\mathbb{E}[Y])\) for convex \(\phi\). Here, \(f(X)\) is convex in beliefs (via the max operator), but the direct Jensen analogy is messy. The cleaner insight:  
     **The expectation of a maximum (over actions) is always ≥ the maximum of an expectation**.  
     This is the essence—having the *option* to tailor actions to \(X\) beats committing prematurely.

  ---

  ### Relation to Blackwell's Theorem
  Blackwell's theorem (1951) asks: "When is one experiment \(B\) more informative than another \(A\) for *all* decision problems?"  
  - **Blackwell Sufficiency**: \(B\) is "better" than \(A\) if \(A\) can be simulated from \(B\) by adding noise (i.e., \(A\) is a garbling of \(B\)).  
  - **Utility Monotonicity**: If \(B\) is sufficient for \(A\), then for any \(u(a,\theta)\), the max expected utility from \(B\) is \(\geq\) that from \(A\).

  **Good's theorem is a corollary**:  
  - "No evidence" is the worst experiment (complete garble). *Any* non-trivial \(X\) is Blackwell-sufficient for "no evidence".  
  - Thus, \(V_X \geq V_0\) for all priors and utility functions.  
  **Aha**: Good's result is a special case of Blackwell where the "less informative" experiment is pure ignorance.

  ---

  ### Dissecting the Counterexamples
  The theorem assumes:  
  1. **Single decision-maker**  
  2. **Costless evidence** (free to acquire/ignore)  
  3. **Instrumental utility** (\(u\) depends *only* on \((a, \theta)\), not beliefs or information states)  
  4. **No strategic interactions**  

  Violate any assumption, and "counterexamples" emerge. Let's autopsy:

  #### 1. Hirshleifer Effect (Public Information Destroys Insurance)
  - **Setup**: Two farmers insure each other against crop failure. With *shared uncertainty*, they trade contracts. If a public signal reveals who will fail, insurance collapses (no mutual gain).  
  - **Why it seems like a counterexample**: Ex ante, both farmers prefer not to see the signal.  
  - **Smuggled assumption violations**:  
    - **Multiple agents**: This is a *game*, not a single-agent problem. Good's theorem applies to one DM.  
    - **Strategic interactions**: The value of information depends on others' information. Public knowledge changes equilibrium payoffs.  
    - **Instrumental utility?**: Not violated—farmers care only about consumption (not beliefs).  
  - **Verdict**: Not a counterexample to Good. It's about **equilibrium selection** in games. Blackwell still holds *if* we fix others' strategies, but coordination breaks when information is public.

  #### 2. "I'd Rather Not Know" (Information Has Intrinsic Cost)
  - **Setup**: You can test for an untreatable disease. "Knowing won't change my action (no treatment), but I'll be anxious if positive or relieved if negative. I prefer blissful ignorance!"  
  - **Why it seems like a counterexample**: Expected utility seems higher without evidence.  
  - **Smuggled assumption violation**:  
    - **Non-instrumental utility**: Here, \(u\) depends on *beliefs* or *knowledge state*, not just \((a, \theta)\). Let:  
      - \(\theta\): Disease state (sick/healthy)  
      - \(a\): Action (same regardless)  
      - But \(u(a, \theta, \text{belief})\) differs:  
        - \(u(\text{no test}, \text{sick}) > u(\text{test}, \text{sick})\) (avoiding anguish)  
        - \(u(\text{no test}, \text{healthy}) < u(\text{test}, \text{healthy})\)? (but you might value relief less than you fear anxiety)  
      If \(u\) incorporates psychological costs, it's not of the form \(u(a, \theta)\).  
  - **Verdict**: Violates **instrumental utility**. Good's theorem assumes "beliefs are tools, not tastes." If utility depends on information states, the theorem doesn't apply.

  #### 3. Costly Computation or Attention
  - **Setup**: "Free" evidence requires mental effort to process. Ignoring it is hard (e.g., "don't think of a pink elephant").  
  - **Violation**: **Costless evidence**. Even if acquisition is free, processing/ignoring may have cognitive costs.  
  - **Verdict**: Not a counterexample—just violates "free to ignore."

  ---

  ### The Load-Bearing Assumptions: A Summary Table
  | Counterexample          | Violated Assumption             | Why It Matters                                      |
  |-------------------------|---------------------------------|----------------------------------------------------|
  | Hirshleifer (markets)   | Single decision-maker           | Game theory ≠ individual choice; equilibria shift |
  | "Rather not know"       | Instrumental utility            | Utility depends on beliefs, not just state/action  |
  | Cognitive overload      | Costless evidence (to ignore)   | Ignoring isn't free; psychological costs exist     |
  | Information in auctions | Single decision-maker           | Strategic bidding with interdependent values      |

  ### Key Insight
  Good's theorem is **robust within its domain** (single-agent, instrumental utility, costless evidence). The "counterexamples" reveal how *expansive* real-world decision problems can be—once you introduce beliefs-as-tastes, multiple players, or hidden costs, the math changes. But none break Good's result under its original assumptions. As Good himself noted: "If you *can* ignore the evidence, you should never expect to lose by having it. But the world rarely lets you ignore things cleanly."

  Want to test a specific counterexample? Throw it at me—we'll dissect it together.
