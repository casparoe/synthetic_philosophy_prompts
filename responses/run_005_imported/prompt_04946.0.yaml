answer: |-
  The gaslight hissed, casting long, trembling shadows across the library-turned-laboratory. Professor Alistair Thorne adjusted the brass calipers holding the tuning fork, its low, pure *hum* momentarily steadying the air. Before him, at a precisely measured distance of eight feet, sat the girl. Clara. Twelve years old, pale as parchment, hands folded neatly in her lap atop a worn pinafore. Her mother, Mrs. Gable, perched rigidly on a straight-backed chair against the far wall, instructed to remain silent, her gaze fixed on a point above Thorne’s head.

  "State of readiness, Clara?" Thorne asked, his voice carefully modulated, devoid of inflection. He dipped his pen into the inkwell, poised above the ruled ledger.

  "Ready, Professor," she whispered, her voice barely audible over the tuning fork’s drone.

  Thorne reached into the velvet-lined box beside him. Twenty-five cards. Five symbols, repeated five times: a circle, a square, a cross, a star, a set of wavy lines. He shuffled them with precise, economical movements, the stiff pasteboard rasping against itself. He selected the top card, held it facing him. A star.

  He fixed his gaze upon Clara’s forehead, a point midway between her eyebrows, as prescribed. He concentrated, forming the image of the star in his mind’s eye – not just the shape, but the *idea* of it, the cold points, the celestial distance. He willed it across the space, a mental projectile. The tuning fork hummed. The clock on the mantel ticked. Thirty seconds. He marked the time.

  "Your impression, Clara?"

  She blinked, her eyes large and dark in the gaslight. "Was it... the wavy lines, sir?"

  Thorne’s pen scratched a neat ‘X’ beside the symbol for wavy lines on his chart. He recorded the time, the ambient temperature (63°F), the barometric pressure noted earlier (29.8 inches and falling). He placed the star card face down on the discard pile. Next card. A circle. Concentration. The smooth curve, the endless line. Thirty seconds.

  "Your impression?"

  "The square, sir?"

  Another ‘X’. His jaw tightened imperceptibly. He remembered the Wickham twins – their astonishing success rate, the flurry of excitement, the meticulous controls he’d implemented. And then, the damning click of a dropped hairpin, the pre-arranged signal he’d finally caught. The collapse had felt physical, a subsidence beneath his feet.

  He continued. Cross. Square. Wavy lines. Clara guessed wrong, wrong, wrong. Each scratch of the pen was a small, sharp sound in the quiet room. The air grew thick, not with incense or ectoplasm, but with the smell of dust, lamp oil, ink, and the faint, metallic tang of his own disappointment. The tuning fork’s hum began to grate.

  *Why this compulsion?* The question, unwelcome and persistent, surfaced like a bubble in tar. Not for fame, certainly. The SPR’s work was met with polite derision by his academic peers, open ridicule by the press. Not for comfort – these nights drained him, left him hollowed and brittle. It was the *gap*. The terrifying, logical chasm he’d charted in his own *Principles of Moral Philosophy*. The cold equations demonstrating that, absent a cosmic guarantor – a universe where virtue aligned with ultimate consequence – the rational individual *should* choose self-interest. Ethics became a beautiful, fragile construct, unsupported by the bedrock of reality. A sandcastle against the tide. He needed the tide to be… intentional. Ordered. *Moral*.

  He needed a signal. Proof that mind could transcend matter, that consciousness wasn’t merely a flicker doomed to extinction, that *connection* existed beyond the physical. Proof that the universe held more than indifferent atoms. Proof that his life’s work, his belief in duty, sacrifice, the greater good… wasn’t built on a void.

  Next card. A star again. He concentrated, pouring more force into the projection. *See it, Clara. See the points. See the light.* He felt a vein pulse at his temple. The tuning fork’s note seemed to waver.

  Silence stretched. Thirty seconds. Thirty-five.

  "Your impression?" His voice was tighter now.

  Clara shifted. She glanced down at her hands, then quickly back up. "I… I think it’s the star, sir?"

  Thorne froze. He looked at the card in his hand. The star. He looked at the ledger. The previous twenty-three trials: failure. Statistically insignificant, yet… His heart hammered against his ribs. *Could it?* Was this the anomaly, the crack in the wall of the mundane?

  He forced himself to breathe. "Are you certain, Clara?"

  She nodded, a quick, bird-like motion. "Yes, sir. It felt… bright. Sharp."

  He recorded it. A checkmark. The first of the evening. The ink seemed darker on the page. He shuffled the deck again, fingers suddenly clumsy. He selected the next card. A cross. He focused. The intersection. The weight. The sacrifice. *See it. Know it.*

  Thirty seconds. "Your impression?"

  "The cross, sir?" Her voice held a tremor of hope.

  Another checkmark. Thorne’s hand trembled slightly as he recorded it. *Two.* Coincidence? Probability stretched thin. He placed the cross card down. Next. A circle. He projected the curve, the enclosure.

  "Your impression?"

  "The circle?" Clara ventured.

  *Three.* The air crackled. Thorne felt a surge, not of joy, but of desperate, clawing *need*. *This. This could be it.* The tuning fork hummed, no longer an irritant but a resonant chord. He saw Mrs. Gable lean forward infinitesimally from the corner of his eye.

  Next card. Wavy lines. He formed the image: water, movement, fluidity. *See the waves. Feel the flow.*

  Twenty seconds. Twenty-five. Clara’s brow furrowed. She bit her lip. "I… it’s hard, sir. Blurry."

  "Concentrate, Clara. Relax your mind. Let the image form." His own voice was taut.

  Thirty seconds. "Your impression?"

  She sighed, a small, defeated sound. "The square, sir?"

  Thorne’s shoulders slumped. He marked the ‘X’. The brief spark guttered. He placed the wavy lines card face down. The discard pile was growing. He picked up the next card. A star. Again. Routine reasserted itself. He projected mechanically.

  "Your impression?"

  "The star, sir?" Clara offered, her earlier certainty vanished.

  He looked at the card. A circle. Wrong. He marked the ‘X’. The ledger page was a stark battlefield of crosses with three lonely checkmarks stranded amidst them. He felt the familiar, leaden weight return, heavier than before. The brief flare of hope made the subsequent darkness denser.

  He continued. Cross (wrong – she guessed circle). Square (wrong – she guessed wavy lines). His movements became automatic, the ritual of failure. He recorded temperatures he no longer felt, noted times without seeing the clock. The tuning fork’s hum was an accusation.

  The final card. He didn’t look at it as he projected. It didn’t matter. The symbol – a cross – was just a shape. He went through the motions. Thirty seconds.

  "Your impression?"

  Silence. He looked up. Clara’s head was tilted slightly, not towards him, but towards her mother. Mrs. Gable, her face pale and strained, was staring fixedly at the girl. Her right hand rested in her lap, hidden by the folds of her skirt. As Thorne watched, frozen, he saw the faintest tremor in the fabric of Mrs. Gable’s skirt. A tiny, rhythmic movement. One… two… three distinct shifts.

  Clara swallowed. "The… the cross, sir?"

  Thorne didn’t move. He didn’t mark the ledger. He simply stared at the discard pile, then at the mother and daughter. The room was utterly silent except for the hissing gas and the relentless, indifferent tick of the clock. He saw it not as a conspiracy, but as a pathetic, human frailty. A mother wanting her child to please the imposing professor. A girl, desperate to succeed, seizing on a covert signal. Hope manufactured in the face of emptiness.

  He looked down at the final card in his hand. The cross. He placed it silently on the discard pile, face down. He didn’t need to record the failure; it was etched onto the air.

  "Thank you, Clara," he said, his voice flat, drained. "Thank you, Mrs. Gable. That concludes the session for this evening."

  He didn’t look at them as they gathered their things, the mother murmuring apologies, the girl avoiding his gaze. He heard the library door click shut behind them. The tuning fork had finally stilled. Only the clock remained, measuring out the silence. Thorne sat in the pool of gaslight, surrounded by his instruments, his charts, the meticulous record of nothing. The dread wasn’t sharp anymore; it was a vast, cold sea rising slowly around him, eroding the foundations stone by stone. He picked up his pen, not to write, but simply to feel its solidity, its weight in a world that felt increasingly insubstantial. Outside, the London fog pressed against the windows, swallowing the lamplight, offering no answers, only a deeper dark.
