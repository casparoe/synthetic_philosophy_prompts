  Given Darwin's wariness of anthropocentrism, he'd likely reject both extremes. He'd probably argue that while some cognitive capacities might converge (e.g. problem-solving), human-level intelligence requires too many nested contingencies - the right lineage, stable environments, no mass extinctions. 

