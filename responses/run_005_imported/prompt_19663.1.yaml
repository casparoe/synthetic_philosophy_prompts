  - **Fuzzy logic** with degrees can model higher-order vagueness by having vague assignments, but the regress is a serious issue. However, some fuzzy logicians have proposed ways to stop the regress (e.g., by using the same [0,1] interval for higher orders and collapsing the hierarchy). So it might be competitive.

