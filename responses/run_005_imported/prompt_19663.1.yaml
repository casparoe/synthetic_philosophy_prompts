  We are ranking five approaches to the sorites paradox (epistemicism, supervaluationism, degree-theoretic/fuzzy, contextualism, and paraconsistent/subvaluationist) specifically on their ability to handle higher-order vagueness.

  Higher-order vagueness is the problem that not only is there vagueness in the predicate (e.g., "is bald") but also in the meta-predicates (e.g., "is a borderline case of baldness"). So, if we try to draw boundaries between clear cases, borderline cases, and clear non-cases, the boundaries themselves seem vague.

  Let's consider each approach:

  1. **Epistemicism**: This view holds that vagueness is a matter of ignorance. There is a sharp boundary (e.g., between bald and not bald), but we cannot know where it is. For higher-order vagueness, the same idea would apply: there is a sharp boundary between clear cases and borderline cases, and between borderline cases and clear non-cases, but we are ignorant of these boundaries. However, this seems to deny higher-order vagueness because it posits sharp boundaries at every level. Thus, it does not account for the intuition that the boundary between clear cases and borderline cases is itself vague.

  2. **Supervaluationism**: This approach posits that a vague sentence is true if it is true on all precisifications, false if false on all, and neither otherwise. For higher-order vagueness, one might try to say that the set of precisifications is not fixed, but then we face the same problem again. Supervaluationism typically introduces a hierarchy of orders (by having supervaluations over the precisifications of the previous level) but this leads to an infinite regress and does not capture the idea that higher-order vagueness is of the same kind as first-order. So it struggles with higher-order vagueness.

  3. **Degree-theoretic (Fuzzy) Approaches**: In fuzzy logic, truth values are in the interval [0,1]. For a sorites series, we assign degrees of truth (e.g., 0.9 for having 100 hairs, 0.8 for 101, etc.). For higher-order vagueness, one might assign degrees to the statement "x is a borderline case". However, the problem is that the assignment of degrees itself might be seen as precise. If we allow the degrees to be vague too, we might need a second-order degree (e.g., a degree of truth for the degree of truth) and so on, leading to an infinite regress. Some fuzzy approaches try to avoid this by using fuzzy sets of fuzzy sets, but it becomes complex and may not fully resolve the issue.

  4. **Contextualism**: Contextualist approaches hold that the extension of vague predicates can shift with context. For higher-order vagueness, one might say that what counts as borderline is also context-dependent. This can help because the context might fix not only the boundary but also the boundary between clear and borderline. However, the worry is that the context itself may not provide a clear boundary for the borderline cases, so higher-order vagueness might still reappear.

  5. **Paraconsistent (Subvaluationist) Approaches**: Subvaluationism (dual to supervaluationism) says that a sentence is true if it is true in some precisification, false if false in some, and both if it varies. Paraconsistent logics allow for truth-value gluts. For higher-order vagueness, one might say that an object can be both a clear case and borderline (or neither) in a way that tolerates inconsistency. However, it's not clear if this really captures higher-order vagueness without introducing similar problems at the next level.

