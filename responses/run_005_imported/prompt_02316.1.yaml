  Key scene: The moment she authorizes energy diversion while colonists starve. Focus on her hands shaking, the silence of the void outside, the sheer absurdity of betting lives on a cosmic hunch. End with her staring at the correlation detector's readout: still 0.00% evidence. Just a number on a screen, and the terrible weight of maybe being right. 

  ...And leave it ambiguous. No epiphany, no reward. Just the quiet horror of having gambled real blood for phantom solidarity. That’s the Egan/Chiang vibe. 

  Wordcount-wise, 2000 should do it. Opening with ship systems failing, middle with the ethical debate, climax with the decision, denouement in numb aftermath. Title? "The Silent Handshake." Nods to Newcomb without being obvious. 

