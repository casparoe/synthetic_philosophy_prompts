answer: |-
  This is a profound and enduring question in moral philosophy and just war theory. Let's break it down systematically:

  ### 1. **Daniel's Core Argument & Its Strengths**
     - **Separation of Responsibility**: Daniel distinguishes between:
       - *Political leaders* who launched an unjust war (morally culpable).
       - *Soldiers* who follow ethical rules of engagement (potentially blameless).
     - **Symmetry of Conduct**: By adhering to the same rules as just combatants (distinction, proportionality, avoiding civilians), Daniel argues his battlefield actions are morally equivalent to those defending their homeland.
     - **Moral Luck**: He didn’t choose his nationality or the war; he fulfilled a professional duty under coercion (mobilization). Punishing him for "accident of birth" seems unjust.

  ### 2. **The Disanalogy You Spot: Why It Matters**
  Your self-defense analogy exposes a critical flaw in conflating *individual morality* with *institutional roles*:
  - **Individual Level**: An aggressor (A) who attacks a defender (D) is always morally responsible for initiating violence. D’s defensive force is justified; A’s "defensive" counterstrike is not, because A created the threat.
  - **Institutional Level**: Soldiers are *agents of a state*. Their moral position depends partly on whether their state’s cause is just. A just combatant uses force to *restore peace/justice*; an unjust combatant uses force to *impose an injustice*. Their actions serve different ends, even if their immediate conduct (shooting combatants) appears identical.

  ### 3. **The Moral Difference: "Unjust Combatants"**
  Philosophers like Jeff McMahan argue that **the justice of the war matters intrinsically**:
  - **Moral Liability**: Combatants on the unjust side lack a "right to kill." Their targets (just combatants) are morally justified in using force to resist aggression. Killing them is not wrongful (from the just side’s view), whereas killing just combatants *is* wrongful because it perpetuates aggression.
  - **Culpability Spectrum**: 
    - *Political leaders*: Bear greatest culpability (planned/ordered aggression).
    - *Unjust combatants*: Bear *derivative* culpability. They voluntarily (or under duress) become instruments of injustice. Their moral "cleanliness" depends on:
      - Knowledge of the war’s injustice.
      - Alternatives to participation (desertion, conscientious objection).
      - Degree of adherence to *jus in bello* (conduct in war).
  - **Daniel’s Case**: If he knew the pretexts were fabricated yet fought anyway, his moral position weakens. If he was deceived/conscripted and scrupulously avoided atrocities, his blame is minimized—but not erased.

  ### 4. **Why Legal/Moral Practice Ignores This Asymmetry**
  - **Pragmatism in International Law**: The Geneva Conventions uphold "combatant equality" (*jus in bello* applies equally to both sides) for practical reasons:
    - **Incentivize Ethical Conduct**: If unjust soldiers knew they’d be punished regardless, they’d have no incentive to spare civilians or prisoners.
    - **Feasibility**: Determining individual moral guilt in war is logistically impossible. Courts focus on verifiable *conduct* (war crimes), not abstract assessments of a war’s justice.
    - **Reciprocity**: Equal rules allow mutual expectations of humane treatment.
    - **Sovereignty**: States reject external judgments of their wars’ justice. Equal treatment preserves order between nations.
  - **Moral Practice**: Societies often absolve soldiers to:
    - Honor their sacrifice/trauma.
    - Avoid scapegoating low-level actors for leaders’ decisions.
    - Acknowledge systemic coercion (propaganda, conscription, peer pressure).

  ### 5. **A Balanced Verdict on Daniel**
  - **He’s Not "Innocent"**: By participating in an unjust invasion, he contributed to harm, even if he followed *jus in bello*. His role aided the aggressor’s ends.
  - **But He’s Not a War Criminal**: If he truly avoided atrocities and targeted only combatants, he upheld minimal ethical standards under duress. His blame is mitigated by:
    - Lack of agency in starting the war.
    - Adherence to battlefield ethics.
    - Possible ignorance of the war’s fabricated pretexts.
  - **Moral Residue**: Even if his conscience is clear, his participation *objectively* furthered injustice. A morally sensitive person might feel regret for being *used* as a tool of aggression, even if personal guilt is disproportionate.

  ### Key Takeaway: A Two-Tiered Framework
  1. **Jus Ad Bellum (Justice of War)**: Determines whether a soldier’s *participation* is morally tainted.
  2. **Jus In Bello (Conduct in War)**: Determines whether a soldier’s *actions* were ethical *given their role*.

  Daniel satisfied #2 but not #1. This makes him less culpable than leaders or war criminals, but not morally equivalent to a defender. The asymmetry doesn’t "wash out"—it’s obscured by practical necessity, not moral truth.

  > *"In an unjust war, the only truly ethical act may be refusal. But for those who fight, clean hands require more than clean fighting—they demand a clean cause."*
