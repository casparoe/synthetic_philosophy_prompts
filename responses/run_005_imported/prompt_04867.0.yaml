  For the dynamic argument, I need to show how sophisticated choice can resolve it. The trick is to recognize that in sequential setups, the agent isn't actually changing preferences - they're facing substantively different choices when nodes arrive. When you reach that second decision point after having avoided the 1% disaster, the psychological context has changed. Committing to plans isn't inconsistent if we acknowledge this context-sensitivity.

