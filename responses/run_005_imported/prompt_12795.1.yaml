  The user is confused because founders emphasize Wilt's deservingness, but philosophers focus on entitlements and voluntary transfers. I should explain the difference between desert and entitlement. Desert is about moral worth based on effort or talent, while entitlement is about legitimate claims from just acquisition and voluntary exchanges. Nozick explicitly rejects desert, as he thinks it's not feasible to track in complex economies. 

  Why do people conflate the two? Maybe because in simple cases like Wilt's, desert and entitlement align. People see a superstar earning more and assume it's about deservingness, but Nozick's framework doesn't require that. The founders might be using desert intuitively, but the philosophical basis is about freedom of choice and property rights. 

  Also, the user mentioned philosophers being allergic to "desert." That's accurate because Nozick argues desert isn't necessary for his theory. Historical entitlement trumps patterns, regardless of deservingness. For example, even if Chamberlain didn't "deserve" his talent, the transactions are still valid. 

