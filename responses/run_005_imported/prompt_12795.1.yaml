answer: |-
  You've hit on a crucial tension in how Nozick's argument is used versus how it functions philosophically. The founders are *misreading* Nozick by injecting "desert" as the core justification, and understanding this misreading is key to your critique of Silicon Valley meritocracy talk. Here's the breakdown:

  1.  **Nozick's *Actual* Argument: Liberty and Entitlement, NOT Desert**
      *   **The Core Mechanism:** The Wilt Chamberlain example is designed to demonstrate the **instability of patterned principles of justice** (like equality, need, or even desert-based distributions) *when individuals exercise their liberty*. It's about **voluntary transactions** and **historical entitlements**, not inherent moral worthiness.
      *   **The Sequence is Sacred:**
          *   **Starting Point (Just):** Assume D1 is a just distribution (whatever pattern you like - equal, desert-based, etc.).
          *   **Voluntary Action:** Millions of fans *freely choose* to transfer 25 cents of their D1 holdings to Wilt Chamberlain in exchange for watching him play.
          *   **New Distribution (D2):** Wilt now has $250,000 more; each fan has 25 cents less (times a million).
          *   **The Argument:** If D1 was just, and *all transfers were fully voluntary and knowing*, how can D2 be unjust? To return to D1 (or any other pattern) *requires forcibly taking money Wilt acquired justly* from willing payers. This violates the liberty of *both* the fans (to spend their money as they wish) *and* Wilt (to keep what was freely given to him).
      *   **Entitlement Trumps Pattern:** Justice, for Nozick, isn't about the *resulting pattern* (whether it looks "fair" or matches desert), but about *how holdings came about*. If holdings arise from just initial acquisition and voluntary transfer, they are *entitled* holdings. Taxation to enforce a pattern is *forced labor* (taking the product of Wilt's effort) or *theft* (taking what was freely given).
      *   **Nozick's Skepticism of Desert:** Your professor is correct. Nozick explicitly argues against desert as the basis for distributive justice:
          *   **The Natural Lottery:** Why does Wilt *deserve* his exceptional talent? Isn't it largely a matter of luck (genetics, upbringing)? Can he truly deserve the benefits flowing from unchosen advantages? (ASU, p. 214-215).
          *   **The Complexity Problem:** In a complex economy, it's impossible to isolate individual contributions and assign "desert" accurately. How much of Wilt's earnings are due to *him* vs. his teammates, coaches, league structure, societal interest in basketball, etc.?
          *   **Entitlement Doesn't Require Desert:** Nozick's point is that *even if Wilt doesn't morally deserve his talent or the resulting wealth*, the *voluntary choices* of others to pay him override any patterned conception of justice, including desert-based ones. Justice is about respecting the process, not judging the inherent worthiness of the recipient.

  2.  **Why Founders (& Pop Culture) Misread it as "Desert"**
      *   **Intuitive Appeal:** "He's amazing, people pay to see him, he *deserves* it" is a simple, emotionally resonant narrative. It fits the meritocratic self-image perfectly.
      *   **Conflation of Concepts:** In the Chamberlain example, *desert* (he's talented/hardworking) and *entitlement* (he got it voluntarily) happen to align. People blur them, thinking entitlement *proves* desert. But Nozick's argument works *even if Wilt is lazy and coasting on pure luck*, as long as the transfers are voluntary.
      *   **Rhetorical Power:** "Desert" feels morally weightier than "entitlement via voluntary transfer." Saying "He *deserves* his success" is a stronger defense against redistribution than "He acquired it through a series of voluntary transactions starting from an unknown just baseline." The former appeals to innate justice; the latter sounds like a legalistic process.
      *   **Ignoring the Starting Point:** The founders likely gloss over Nozick's requirement that the *initial distribution (D1)* must be just *by some standard* before the transfers. They implicitly assume the *current* starting point (which includes vast inequalities) is just, allowing them to focus only on the "voluntary" transfers justifying *further* accumulation by the "talented."
      *   **Selective Reading:** They latch onto the "don't take Wilt's money" conclusion and the emphasis on individual genius, ignoring Nozick's deeper critique of patterned principles *and* his skepticism about desert.

  3.  **Why Philosophers Avoid "Desert" in Explaining Nozick:**
      *   **Accuracy:** It's simply *not* the mechanism Nozick relies on. His argument is explicitly about liberty and historical entitlement.
      *   **Nozick's Own Words:** He directly critiques desert as a foundation (as mentioned above). Using "desert" to explain his theory contradicts his text.
      *   **Robustness:** The entitlement argument is *stronger* against patterned principles precisely because it *doesn't* depend on the shaky ground of defining and measuring desert. It works on pure procedural grounds of voluntary exchange respecting prior entitlements.
      *   **Clarity:** Using "desert" confuses Nozick's unique entitlement theory with other, very different, desert-based theories of justice (like some interpretations of Aristotle or Rawlsian contributions).

  **Conclusion for Your Longread:**

  You are absolutely right to be bugged. The founders (and the op-eds) are **fundamentally misrepresenting Nozick**. They are smuggling in a **desert-based meritocratic justification** that Nozick himself found problematic and explicitly tried to *avoid* as the foundation of his theory.

  *   **The Real Mechanism:** The Wilt Chamberlain case "goes through" on **procedural grounds of voluntary exchange respecting prior entitlements**, NOT on the substantive claim that Wilt inherently *deserves* the money because of his talent.
  *   **The Gloss:** Founders gloss over Nozick's skepticism of desert, his emphasis on the *process* over the *pattern* (or the *person*), and the crucial (and often unexamined) assumption that the *starting point* of wealth distribution is just.
  *   **The Irony:** Silicon Valley meritocracy talk uses a thought experiment *designed to show the fragility of all patterns (including merit/desert!)* as a blunt weapon to defend a specific pattern (accumulation by the "talented") based precisely on the desert concept Nozick undermined.

  **This misreading is fertile ground for your piece.** It reveals how "meritocracy" in this context often functions as a post-hoc justification for entitlement and resistance to redistribution, selectively appropriating philosophical arguments while ignoring their nuances and internal critiques. Highlighting the gap between Nozick's actual (liberty/process-based) argument and the founders' desert-based interpretation exposes a core tension – or perhaps hypocrisy – within the meritocratic narrative they espouse.
