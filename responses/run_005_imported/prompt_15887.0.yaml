prompt: |-
  So a few of us from an old SSC meetup started a tiny podcast (like 30 regular listeners, nobody get too excited) and next month's guest is a physicist who's a pretty hardcore Everettian -- the kind of person who'll tell you flat out that many-worlds is a *local* theory and that Bell's theorem never actually established nonlocality, only that no single-outcome hidden-variable theory can reproduce the correlations locally. I went back through Yudkowsky's old quantum physics sequence plus some of the Wallace/Timpson-ish philosophy-of-physics stuff on locality for Everettians, and I keep noticing "MWI is local, actually" gets stated in rationalist-adjacent spaces like it's basically settled, but I've never seen an interview actually make someone earn that claim step by step.

  Can you draft me 8-10 interview questions that don't just let her restate the headline claim? I want at least one question that makes her walk through Jarrett's split of the Bell locality condition into parameter independence and outcome independence and say exactly which one MWI is supposed to satisfy -- and whether denying "outcome independence" by denying that measurements have single outcomes is a real dissolution of the puzzle or just a relabeling of it (this is the actual crux for me, so don't let this one be a softball). I also want one on how the branches on the two wings of an EPR-Bohm experiment end up correlated the right way -- spin-up always paired with spin-down, never both-up -- without anything nonlocal doing the matching, and whether "it just falls out of unitary evolution, no signal required" is an actual answer to that or just a restatement of the mystery. Add one on whether well-defined branching needs some kind of preferred simultaneity surface and how that's supposed to be squared with relativity, one asking why she doesn't just bite the superdeterminism bullet instead if locality matters this much to her, and end with a question asking point-blank what observation, even in principle, could count as evidence against "MWI is local" as opposed to it just being unfalsifiable interpretive bookkeeping. For every question, tack on a quick follow-up keyed to whatever dodge or standard move she's most likely to make -- I dont want this to be the kind of interview where the guest gets to just repeat the sequence-post version of the answer.
