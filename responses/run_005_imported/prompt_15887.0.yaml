answer: |-
  Here are 10 targeted questions (+ embedded follow-ups) designed to probe the "MWI is local" claim rigorously, avoiding standard talking points and forcing engagement with your specific cruxes. Each question anticipates common dodges and presses on the underlying mechanics and philosophy:

  1.  **The Core Locality Claim & Bell's Theorem:**
      *   **Q:** "You assert MWI is a *local* theory. Bell's theorem is widely interpreted as proving quantum mechanics *must* be nonlocal if it's complete and rejects hidden variables yielding single outcomes. MWI rejects single outcomes via branching. Could you walk us through *exactly* how MWI satisfies Jarrett's decomposition of Bell's locality condition – specifically, which of the two sub-conditions (Parameter Independence or Outcome Independence) it violates, and crucially, *why* violating that specific sub-condition, *in the context of branching*, constitutes preserving locality rather than merely relabeling nonlocality?"
      *   **Follow-Up Anticipating Dodge (FUD):** *(If they just say "We violate Outcome Independence by having multiple outcomes" without deeper justification)* "But isn't Outcome Independence precisely the condition requiring that *the specific outcome* observed here doesn't depend on the distant setting? Denying there *is* a single specific outcome seems to dissolve the *condition* itself rather than showing how locality *holds* within the theory's ontology. Isn't this just changing the definition of 'outcome' to avoid the nonlocality charge, rather than demonstrating local dynamics? How does the *mechanism* of branching make the *correlation itself* local?"

  2.  **Branch Matching Without Nonlocal Handshake:**
      *   **Q:** "In an EPR-Bohm experiment, how do the branches on Alice's wing (say, |up_A>) and Bob's wing (|down_B>) become perfectly correlated (always |up_A down_B> or |down_A up_B>, never |up_A up_B>) *without* any nonlocal communication or pre-determined matching? Unitary evolution *predicts* this correlation, but *how* does the branching process *implement* this matching locally? What is the *physical mechanism* ensuring that a branch where Alice measures 'up' only ever contains the version of Bob who measured 'down' on the *same* particle pair, especially if measurements are spacelike separated?"
      *   **FUD:** *(If they just say "It falls out of unitary evolution" or "The entanglement does it")* "But 'unitary evolution' is the *mathematical description*, not the *mechanism*. Entanglement is the *state*, not the *process*. In a local theory, how does the branch *here* 'know' which branch to be part of *over there* for that specific entangled pair? Doesn't this perfect matching across spacelike separation *require* some form of nonlocal coordination at the moment of branching?"

  3.  **Locality vs. Outcome Denial - The Crux:**
      *   **Q:** "Building on the Outcome Independence point: You argue that violating Outcome Independence *by denying single outcomes* dissolves the nonlocality. Critics argue this is a semantic trick – that the *empirical fact* of perfect, spacelike-separated correlations requiring *either* nonlocal influence *or* pre-determination remains, and MWI just *calls* the pre-determined thing 'all branches exist'. Isn't MWI effectively a *superdeterministic* theory in disguise, where the initial state (wavefunction) + unitary dynamics rigidly determines *all* future measurement records (including their correlations) without any *additional* nonlocal influence, but also without any true indeterminism or single outcomes? If so, why not just bite the superdeterminism bullet directly?"

  4.  **Superdeterminism vs. Branching:**
      *   **Q:** "Why *isn't* MWI just a specific type of superdeterminism? Both seem to say the entire history of measurement outcomes (including perfect correlations) is fixed by the initial universal wavefunction + unitary evolution. The only difference seems to be whether you call the different possible histories 'branches' (MWI) or 'not the actual world' (standard superdeterminism). If locality preservation is the primary motivation, why prefer the ontological overhead of countless branches over the (perhaps philosophically uncomfortable but simpler) superdeterministic view where only one history unfolds deterministically?"

  5.  **Relativity & Preferred Branching:**
      *   **Q:** "Branching requires decoherence, which relies on tracing over environmental degrees of freedom. For spacelike separated measurements, *which environment's degrees of freedom define the branching?* Doesn't defining a specific branching structure require choosing a specific spacelike hypersurface (a preferred frame of reference) to define 'the environment' consistently? How does MWI reconcile the apparent need for a preferred frame to define the branching with the locality demanded by relativity?"
      *   **FUD:** *(If they invoke "frame-independent decoherence" or consistent histories)* "But doesn't the *specificity* of the branch structure – which outcome is correlated with which on the other wing – still require defining the branching relative to *some* observer or foliation? If different observers on different trajectories would describe *different* branching sequences for the same events, doesn't that mean the 'worlds' aren't fundamental, objective entities, and locality becomes observer-dependent?"

  6.  **Locality in the Wavefunction Dynamics:**
      *   **Q:** "MWI proponents often say the wavefunction dynamics (the Schrödinger equation) is local. But the wavefunction itself is usually defined over configuration space, not physical space. How does locality defined on configuration space (e.g., terms in the Hamiltonian coupling only 'nearby' configurations) translate to locality in physical 3D space? Can you give a concrete example of how the wavefunction evolution ensures that events spacelike separated in physical space cannot influence each other, even within the branching structure?"

  7.  **The Status of "Outcomes" and Experience:**
      *   **Q:** "In MWI, observers split. When Alice measures spin-up, there's a branch where she has that experience. The locality claim rests on nothing 'happening' nonlocally to *cause* Bob's result in *her* branch; it was always part of that branch. But isn't the *subjective experience* of Alice-in-this-branch still inexplicably correlated with Bob-in-*this*-branch's result? Doesn't the *fact* that *this specific* Alice always finds herself with a Bob who got the opposite result still demand an explanation that unitary evolution alone doesn't provide? Isn't the *persistence* of the correlation within a single observer's stream of consciousness the core mystery, and how does branching make *that* local?"

  8.  **Falsifiability - The Ultimate Test:**
      *   **Q:** "What conceivable empirical observation, even in principle, could falsify the specific claim 'MWI is a local theory'? Could any experiment show something that unitary evolution *couldn't* account for locally via branching, thereby proving nonlocality *must* exist within MWI? If not, how is 'MWI is local' different from an unfalsifiable interpretive claim, rather than a testable physical assertion?"
      *   **FUD:** *(If they say "Nothing, it's a consequence of the formalism")* "Exactly. So isn't the claim 'MWI is local' fundamentally *unfalsifiable* interpretive bookkeeping? It seems immune to any experimental result because any nonlocal-*seeming* effect is always explained away post-hoc by branching. Doesn't this make it more of a philosophical stance about what 'locality' means within a branching ontology than a physically testable claim?"

  **Key Tactics Embedded:**

  1.  **Forcing Mechanism Over Mantra:** Questions 2 & 6 demand explanations beyond "unitary evolution" or "entanglement."
  2.  **Attacking the Semantic Dodge:** Questions 1, 3, and 7 directly challenge whether denying single outcomes *solves* the locality issue or just *redefines* the terms to avoid it. The superdeterminism comparison (Q3 & Q4) sharpens this.
  3.  **Highlighting Relativistic Tension:** Question 5 presses the conflict between relativistic covariance and the need for a definite branching structure.
  4.  **Demanding Falsifiability:** Question 8 forces a confrontation with the theory's empirical footing.
  5.  **Pre-empting Standard Replies:** Each FUD anticipates common MWI responses ("unitary does it", "violating OI by having multiple outcomes", "it's frame-independent") and pushes back hard, demanding deeper justification.

  **How to Use Them:** Don't feel constrained to ask all 10 verbatim. Use them as a roadmap. Listen closely to her answers. If she gives a superficial response, deploy the FUD immediately. If she gives a deep answer to the main Q, maybe skip the FUD. Focus particularly on Q1-3 (your crux) and Q8. Good luck! This sounds like a fascinating interview.
