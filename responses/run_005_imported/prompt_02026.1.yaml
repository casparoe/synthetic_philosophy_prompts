  ### Tier Explanations
  **S Tier (Most plausible):**  
  Maximize Expected Choiceworthiness (MEC) earns the top spot as it rigorously extends expected utility theory to moral uncertainty, providing a unified decision-theoretic framework. While the intertheoretic-comparison problem is serious, MEC's proponents (e.g., MacAskill) argue that approximate, context-sensitive comparisons are feasible—similar to how we handle empirical uncertainties—making it the most philosophically grounded approach despite scalability challenges.

  **A Tier (Strong but flawed):**  
  The Moral Parliament model avoids MEC's comparison problem by reframing moral uncertainty as a bargaining process, leveraging established game-theoretic tools. Its key weakness—reliance on contested bargaining assumptions (e.g., Nash equilibria)—is mitigated by its flexibility: it doesn't require cardinal comparisons and better accommodates incomparable theories through negotiation, making it a robust alternative.

  **B Tier (Moderately plausible with significant drawbacks):**  
  Borda-count aggregation and My Favorite Theory (MFT) share this tier due to fatal yet distinct flaws. Borda counts circumvent cardinal comparisons by using ordinal rankings but founder on option-individuation issues (e.g., strategic splitting of choices alters outcomes). MFT is computationally simple but arbitrarily dismisses minority theories, violating intuitive demands for proportional moral consideration (e.g., ignoring a 40% credible theory risks severe moral error).

  **C Tier (Least plausible):**  
  The skeptical stance is relegated here because it rejects the problem's coherence—arguing moral credences lack empirical comparability—yet fails as normative guidance. It collapses into paralysis or ad hoc action, ignoring how agents *must* act under uncertainty; its critique, while valid, offers no constructive alternative, rendering it self-defeating for practical philosophy.
