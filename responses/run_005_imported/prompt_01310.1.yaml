prompt: |-
  hey, so I'm down a rabbit hole with the unity-of-the-proposition literature (half for my diss, half procrastinating on my diss), and I can't get a good grip on one thing. A bunch of the standard "fixes" for Bradley's regress -- Frege's unsaturated concepts, King's relation-that-also-encodes-predication move, Hanks/Soames turning predication into an act rather than a relation -- all work by positing some primitive bit of glue that supposedly doesn't itself need further gluing. But then Gaskin does basically the Armstrong/Orilia "benign infinitism" move (originally about states of affairs) except for propositions: the regress really is infinite, and thats fine, it's actually constitutive of propositonal unity rather than a threat to it, kinda like how the deflationary truth regress (p, it's true that p, it's true that it's true that p...) is supposedly harmless. What I don't have a good gut-level grip on is what's actually doing the work in the vicious/benign distinction here -- why is Bradley's regress fatal to relations but a structurally similar regress totally fine for Armstrong/Gaskin? Is there a real principled line, or is "benign" just a label people reach for once they've decided they can live with a regress? And do the primitive-unifier moves (Frege/King/Hanks) actually earn their keep, or are they just relocating the same unexplained bit of magic one level up? Would love an intuitive walkthrough rather than just a list of positions.
