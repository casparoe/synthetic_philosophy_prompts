prompt: |-
  I've spent the last few months reading everything I can find online about the classic split-brain experiments (the ones where a patient's corpus callosum has been severed and each hemisphere seems to process information independently, like the famous cases where the left hand does something the verbal, "speaking" left hemisphere can't explain). I don't have any formal training in philosophy of mind or neuroscience, so I've been piecing this together from papers, transcripts, and secondhand summaries, but I keep running into two terms that authors seem to use to explain what's actually happening to consciousness in these patients: "phenomenal unity" and "access unity." From what I can tell, phenomenal unity has to do with whether there's a single unified subjective experience at a time, while access unity is about whether information from different processes is available to be reported or acted on jointly. But I can't tell if these are meant to be two independent ways consciousness could be unified or fractured, or if one is supposed to explain or ground the other.

  Could you compare these two concepts of unity in detail, specifically as they apply to split-brain cases? I'm especially interested in whether a split-brain patient could, in principle, have access disunity (say, the left hand reaching for an object the left hemisphere can't verbally acknowledge seeing) while still retaining some form of phenomenal unity underneath, or whether the experimental evidence forces us to say both kinds of unity break down together. It would also help to know which philosophers or researchers take opposing sides on this, since most of what I've read just uses the terms without spelling out the actual disagreement.
