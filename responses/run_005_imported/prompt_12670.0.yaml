answer: |-
  ## The Fragile Brilliance of Good's Theorem: When Free Information Isn't Free

  I.J. Good's 1967 theorem stands as a cornerstone of Bayesian decision theory, radiating an elegant and powerful simplicity: **The expected value of free information is never negative.** For an idealized rational agent, gathering more *relevant* evidence *cannot*, on average, make your decisions worse; it can only make them better (or leave them unchanged). This seemingly settles a profound question: a rational agent should always be willing to gather more free, decision-relevant evidence before acting. Yet, the real world – and even sophisticated theoretical models – bristle with apparent counterexamples. To understand whether "never refuse free evidence" is a universal norm, we must dissect Good's theorem, examine its assumptions, and see where the cracks appear.

  **Good's Theorem: Precision and Assumptions**

  The theorem states: For a Bayesian agent facing a decision problem with:
  1.  **Fixed Action Space (A):** A set of possible actions {a}.
  2.  **Fixed State Space (Ω) & Prior Beliefs (P):** A set of possible states of the world {ω}, with a prior probability distribution P(ω).
  3.  **Fixed Utility Function (U):** A utility function U(a, ω) specifying the desirability of outcome (a, ω).
  4.  **Costless Information (I):** An information source that provides data D at zero cost. This data is generated with probability P(D|ω).
  5.  **Bayesian Updating:** The agent updates beliefs from prior P(ω) to posterior P(ω|D) = P(D|ω)P(ω) / P(D) upon observing D.
  6.  **Rational Choice:** The agent chooses the action a* that maximizes *expected* utility given their current beliefs: a*(beliefs) = argmax<sub>a</sub> E[U(a, ω) | beliefs].
  7.  **No Strategic Interactions:** The agent's decision affects only their own utility; others' actions and utilities are not strategically dependent on the agent's information state or beliefs.

  **The Expected Value of Information (EVI)** is defined as:
  EVI = E[ U(a*(D), ω) | D ] - E[ U(a*(∅), ω) ]
  Where:
  *   a*(D) is the optimal action *after* seeing data D.
  *   a*(∅) is the optimal action *before* seeing any data (based on the prior).
  *   The expectation E[... | D] is taken over ω given D, and then averaged over possible D (according to P(D)).

  **Good's Result:** EVI ≥ 0. Free information cannot decrease the expected utility of the decision.

  **The Counterexamples and Assumption Violations**

  The skeptics offer compelling scenarios where acquiring information seems harmful. Let's see how each interacts with Good's assumptions:

  1.  **Hirshleifer's Insurance Unraveling (1971):** Imagine two farmers, A and B, facing independent risks to their crops (e.g., A's crop fails with drought, B's with flood). They can mutually insure each other. *Before* information, they agree to share losses, benefiting both through risk-pooling. Now, suppose a *public*, costless, perfectly accurate forecast reveals whether drought or flood will occur. If the forecast predicts drought, Farmer A knows he will lose, and Farmer B knows he won't. B has no incentive to pay A. The insurance contract unravels. Both are worse off than they were under mutual insurance *without* the forecast.
      *   **Violated Assumption:** **Strategic Interactions (Assumption 7)**. Good assumes a single agent whose action only affects their own utility. Here, the *information state itself* (public knowledge of the forecast) fundamentally alters the strategic landscape and the feasibility of the mutually beneficial contract (action). The information changes the *game* being played, not just the beliefs within a fixed game. The "action space" available *after* information disclosure is different (no enforceable insurance) from the space *before*.

  2.  **Strategic Value of Credible Ignorance (Bargaining):** Consider a buyer negotiating the price of a used car. The buyer knows the car might have a hidden, expensive flaw. If the buyer can credibly demonstrate *ignorance* of the flaw (e.g., by refusing a free, definitive inspection), the seller might offer a better price, fearing the buyer will walk away if the price is too high *given the risk*. If the buyer gets the free inspection and discovers the flaw, the seller knows the buyer will only pay a much lower price. If no flaw is found, the seller might demand a higher price knowing the buyer is now confident. In some cases, the *expected* outcome from maintaining credible ignorance might be better than the expected outcome after getting the information.
      *   **Violated Assumption:** **Strategic Interactions (Assumption 7)**. Again, the core issue is the interaction between agents. The buyer's *knowledge state* directly impacts the seller's strategy. Information acquisition changes the seller's beliefs about the buyer's type and thus the seller's offers. The "fixed action space" for the buyer (make an offer/accept/reject) exists, but the *consequences* of those actions (the seller's counter-offers) depend critically on the information state, which Good's isolated agent model doesn't account for. Credible ignorance becomes a strategic asset within the bargaining *game*.

  3.  **Bounded Rationality: Bias, Overload, and Paralysis:** A human investor, overwhelmed by complex market data, might fall prey to confirmation bias, focusing only on data supporting their initial hunch. A doctor, flooded with marginally relevant test results, might experience analysis paralysis, delaying critical treatment. A juror exposed to inadmissible, prejudicial evidence might be unable to disregard it rationally, leading to a biased verdict. In each case, the free information demonstrably led to a worse decision than acting on less information.
      *   **Violated Assumption:** **Bayesian Updating & Rational Choice (Assumptions 5 & 6)**. Good assumes perfect, unbiased Bayesian updating and subsequent utility maximization. Humans are cognitively limited ("boundedly rational"). We suffer from biases (systematic deviations from Bayes), limited working memory, computational constraints, and emotional influences. Additional information can exacerbate these limitations, leading to *worse* decisions than would be made with simpler, more manageable information. The agent fails to update correctly or fails to choose the action maximizing expected utility given their (flawed) posterior beliefs.

  **The Verdict: Context is King**

  Good's theorem is mathematically airtight **for the idealized Bayesian agent operating within its strict assumptions.** For such an entity, inhabiting a world of fixed actions, stable preferences, costless computation, and no strategic entanglements, the injunction "never refuse free, decision-relevant evidence" is logically unassailable. The EVI *is* non-negative.

  However, the real world and its agents are not so pristine. Our verdict must be nuanced:

  1.  **Idealized Bayesian Reasoners:** **Yes, they should always follow the norm.** By definition, they satisfy all assumptions. Acquiring free, relevant information strictly improves (or leaves unchanged) their expected utility. Refusing it is irrational within their model.

  2.  **Humans (Boundedly Rational Agents):** **No, they should not always follow the norm.** The bounded rationality counterexample is decisive. Humans *frequently* violate the updating and choice assumptions. The *cognitive and psychological costs* of processing information – leading to bias, overload, distraction, delay, and ultimately poorer decisions – are real and often substantial. Humans need strategic *information filtering*. The norm should be: "Seek *sufficient*, *manageable*, *high-quality*, *decision-relevant* evidence," recognizing that "free" information often carries hidden cognitive costs. Knowing when to stop gathering data is a crucial human skill.

  3.  **AI Systems Facing High-Stakes Choices:** **It Depends Critically on Architecture and Context.**
      *   *Ideal Bayesian AI (Theoretical):* Same as point 1 – always accept.
      *   *Boundedly Rational AI (Most Current Systems):* Like humans, current AI systems have limitations – computational constraints, vulnerability to adversarial data or biased training sets, potential for reward hacking, or opaque reasoning processes. Dumping vast amounts of unfiltered data into such a system could lead to unpredictable failures, slow response times in critical situations, or exploitation of its biases. Prudence dictates careful curation and limitation of input data streams, especially in high-stakes scenarios. The norm must be qualified.
      *   *Strategic AI (Multi-agent Systems):* If the AI operates in a strategic environment (e.g., negotiation bots, competitive markets), Hirshleifer's and bargaining insights apply. The AI *must* model how its information state affects others' actions. Acquiring information that becomes common knowledge, or revealing its knowledge state, can be detrimental to its goals. Strategic ignorance or controlled information revelation might be optimal. The norm fails here.
      *   *High-Stakes & Safety-Critical AI:* Even for powerful AI, the *risk* of unforeseen consequences from additional data (e.g., triggering a rare edge-case failure mode, overwhelming a safety monitor) might outweigh the expected benefit in a high-stakes context. Robustness and predictability might necessitate limiting information intake to well-understood, curated channels. "Free" information isn't free if it increases catastrophic risk probability.

  **Conclusion**

  Good's theorem is a beautiful and powerful result, defining the pinnacle of rational information acquisition for an idealized agent in an isolated decision problem. It correctly shows that within its assumptions, information *cannot* be harmful *on average*. However, it is not a universal practical commandment. The counterexamples are not flaws in Good's logic; they are demonstrations of where its foundational assumptions crumble against the complexities of strategic interaction and human (or machine) cognitive limitations. 

  The true lesson is not to discard Good, but to wield it judiciously. For idealized Bayesians, it is absolute. For humans navigating a noisy world, it is a guiding principle tempered by self-knowledge of our cognitive frailties. For AI systems, especially those operating strategically or in high-stakes domains, adherence to the pure norm is potentially dangerous. The rational approach to the norm "never refuse free, decision-relevant evidence" is to first ask: *"In what world, and for what kind of agent, am I applying this?"* Only then can we determine if the information is truly free.
