  Here’s a toast that honors the "Don Giovanni" legacy while celebrating Marcus’s growth—without pretending Mozart’s opera endorses redemption. It’s warm, funny, and structured to satisfy both opera buffs and the rest of the room:

  ---

  **(Clink glass gently)**  
  "Hello everyone! For those who don’t know me, I’m Alex, and Marcus and I have been friends since college. Which means… I’ve known him back when his dating philosophy was less ‘till death do us part’ and more… ‘till brunch the next day.’ *(Pause for laughter)*. Yes, Marcus earned a nickname back then—one so enduring that half of you are grinning right now: **Our Don Giovanni**.  

  Now, for the uninitiated: Don Giovanni is Mozart’s charming, reckless, utterly unrepentant womanizer who literally gets dragged to hell rather than change. Classic light opera fare! *(Light chuckle)*. And for years, it was the *perfect* bit for Marcus. The sheer commitment to the bit! The flair! The… inability to text back? *(Grins at Marcus)*.  

  But here’s where our story diverges from Mozart’s. Because Giovanni’s tale *ends* in defiance—no growth, no introspection, just a stubborn ‘no’ to redemption. And friends… that is **not** the man standing here today.  

  Somewhere along the way—and let’s be honest, we all know exactly *where*—Marcus met Rachel. *(Turn warmly to Rachel)*. And Rachel, you did the impossible: You made our Don Giovanni actually *want* to return a library book on time. You made him *choose* stability over chaos. You made him realize that love isn’t a conquest—it’s coming home.  

  To the four people here who know the opera inside out—*(nods to Marcus's aunt and Priya)*—yes, Giovanni never changes. But Marcus? Marcus *did*. Not because a stone statue threatened him with hellfire… *(wry smile)* …but because Rachel offered him heaven. Voluntarily. Joyfully. Every single day.  

  So today isn’t about an old nickname’s punchline. It’s about the punchline being rewritten. It’s about Marcus, the man who once treated commitment like a theoretical physics problem, standing here utterly, completely, *unreservedly* in love. It’s about Rachel seeing past the ‘Don’ and finding the man worth building forever with.  

  So raise your glasses:  
  **To Marcus and Rachel**. May your love story be filled with more laughter than awkward college nicknames, more harmony than a Mozart finale… and absolutely *zero* stone statues showing up for dinner. Cheers!"  

  ---

  ### Why this works:
  1.  **Acknowledges the Nickname & Inside Joke:** Opens with it directly, validating the shared history and audience expectation.
  2.  **Handles the Opera’s Ambiguity (for the experts):**  
      *   Name-drops Giovanni’s defining trait (unrepentance) and his ending.  
      *   Explicitly states the opera offers "no growth, no introspection."  
      *   Contrasts Giovanni’s forced damnation with Marcus’s *chosen* change ("not because a stone statue threatened him... but because Rachel offered him heaven").  
      *   The "punchline being rewritten" subtly nods to Williams' point about the opera refusing resolution, while real life offers a different narrative.
  3.  **Focuses on Growth & Rachel’s Role:**  
      *   Pivots *hard* to Marcus's transformation being real and self-motivated *because of Rachel*.  
      *   Makes Rachel the hero of the story ("You did the impossible").  
      *   Uses specific, relatable examples of change (texting back, library books, choosing stability) instead of vague "redemption."
  4.  **Keeps it Warm, Funny & Accessible:**  
      *   Humor is gentle and affectionate ("till brunch the next day," "inability to text back," "library book," "theoretical physics problem").  
      *   Explains the nickname basics for those unfamiliar.  
      *   The "four people" line winks at the experts without derailing the speech.  
      *   Ends on a purely heartfelt, romantic note focused on the couple's future.
  5.  **Structure:** Starts funny (nickname), acknowledges the "problem" (opera's ending) briefly, pivots to transformation via love, celebrates Rachel, ends with a warm toast. ~3 minutes when delivered with pauses.

  This toast lets the opera buffs hear the clever subversion they crave, while giving everyone else a funny, loving tribute to Marcus's journey and Rachel's impact. It lands firmly on celebration, not critique. Break a leg!
