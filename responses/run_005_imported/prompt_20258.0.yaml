prompt: |-
  My grandpa passed away back in March and I ended up as executor of his estate, which has turned into alot more of a headache than I expected. His will was drawn up like 15 years ago and has one specific line leaving "my 500 shares of Meridian Corp stock" to my cousin Ellie, with the rest of his brokerage account (the "residue") split evenly between his other grandkids, including my cousin Marcus. Except here's the wrinkle: Meridian got bought out by a bigger company called Vantage Group in an all-stock merger back in 2016, so by the time grandpa died his 500 Meridian shares had automatically turned into 750 Vantage shares at whatever the exchange ratio was that year. He never sold or bought a single share after that, he just held whatever he recieved in the swap, and never updated the will to even mention Vantage. (For what it's worth, I'm not a beneficiary of this particular part of the estate either way — grandpa left me a flat amount separately for being executor — so I don't gain or lose depending on how the stock question shakes out, I just have to actually implement whatever's correct.)

  At the lawyer's office a couple weeks ago, Ellie and Marcus got into a genuinely heated argument over what should happen to those 750 Vantage shares, and I can't stop turning it over in my head since I'm the one who has to sign off on the distribution. Roughly how it went, in order: (1) Ellie said it's obviously still her stock — the merger was totally outside grandpa's control, the company just changed its name and share count on paper, and the whole point of that line in the will was "give Ellie my position in that company." Treating the gift as if it vanished because of a corporate event he had zero say in feels like punishing her over a technicality. (2) Marcus, who's finishing his second year of law school, said wills have to be read by what they actually say, not by whoever tells the most sympathetic story about what grandpa "really" wanted, and that's exactly why the traditional rule (he called it "ademption by extinction") is that if the exact property named in the will isn't sitting in the estate at death, the gift just fails and drops into the residue. If grandpa's lawyer had wanted the gift to survive a merger, there's boilerplate for that ("or any shares I may receive in exchange therefor") and it simply isn't there. (3) Ellie shot back that the will has at least one other sloppy spot — it still lists a bank account grandpa closed like a decade ago — so his silence about mergers is obviously just him never thinking about it again, not some deliberate choice to cut her out if this ever happened. She also said her husband, who's a corporate lawyer (not trusts and estates, but still), told her most states carve out exactly this situation, that involuntary, automatic stuff like a merger isn't supposed to wipe out a specific gift the same way an actual sale by grandpa would've. (4) Marcus said sure, maybe some states do that, but that just relocates the fight instead of ending it: now we're arguing about whether "all-stock merger" falls inside whatever narrow list of exceptions the statute actually uses, which is a different question than "what would grandpa have wanted," and Ellie doesn't get to lean on a big-picture "his intent is obvious" argument and a narrow technical statutory exception at the same time, whichever helps her more in the moment. (5) Ellie said that's fair, but if the statute doesn't cleanly cover this exact situation, the tiebreaker should still go to grandpa's obvious intent instead of automatically defaulting to "the gift dies," especially since three different family members separately remember him saying some version of "the Meridian stock is Ellie's, that's for her wedding fund."

  Nobody backed down and the lawyer just kind of watched it happen. Could you go through moves (1) through (5) and tell me, for each one, whether that person basically had the better of it, the worse of it, or something in between, and why? Separately, I'd like to know if there's something both of them are missing entirely that would resolve this more cleanly than either framing does. And one more thing, since it's been bugging me: part of me suspects this is basically a smaller-scale version of the whole textualism-vs-purposivism fight I keep half-hearing about in Supreme Court arguments, just playing out over a will instead of a statute — but I honestly don't know if that comparison holds up or if wills run on different logic entirely. Curious what you think.
reasoning: |-
  Okay, let me tackle this executor's dilemma. The core conflict revolves around whether Ellie gets the converted Vantage shares or if they fall into the residue. I need to evaluate each argument step by step.

  First, Ellie's point about corporate actions being outside grandpa's control makes practical sense. The shares weren't sold; they transformed through a merger. Many states do recognize this distinction. But Marcus isn't wrong about strict will interpretation - the will specifies "Meridian Corp stock," which technically no longer exists. 

  Marcus's ademption argument feels textbook-correct but potentially harsh. The lawyer's observation about varying state laws is crucial here. Ellie's husband might be right about statutory exceptions, but without knowing the jurisdiction, it's speculative. 

  The closed bank account example is interesting - it shows the will's staleness but doesn't legally resolve the stock issue. Corporate law vs trusts law expertise matters here; her husband's input has weight but isn't decisive. 

  Ah, Marcus's procedural point about shifting arguments is sharp. Ellie can't simultaneously claim "obvious intent" and rely on technical statutory exceptions. This is where the legal analysis gets messy. 

  Ellie's tiebreaker proposal has emotional appeal but overstates predictability. Courts do consider extrinsic evidence of intent, but only after establishing ambiguity - which brings us back to square one. 

  What both might be missing: the will might contain residuary language that could help, or the executor could look for merger-related documents showing grandpa's awareness. Also, checking if Vantage shares traded under a Meridian-derived CUSIP could support continuity. 

  The textualism-purposivism analogy is insightful! Wills interpretation does mirror statutory debates - Marcus as textualist focusing on the exact words, Ellie as purposivist emphasizing intent. But wills have unique doctrines like anti-ademption statutes that complicate direct comparisons. 

  Ultimately, the executor needs to: 1) Confirm jurisdiction 2) Check local anti-ademption laws 3) Review entire will structure 4) Consider presenting extrinsic evidence to court if beneficiaries can't settle. The lawyer's earlier neutrality suggests this might require judicial resolution.
answer: |-
  This is a genuinely thorny issue that courts grapple with, and both Ellie and Marcus make valid points. Let's break down each move, followed by what they might be missing and the textualism/purposivism question.

  **Analysis of Each Move:**

  1.  **Ellie (Better of it, but oversimplifies):**
      *   **Why Better:** She correctly identifies the core problem: the gift's *substance* (an investment position) transformed *involuntarily*. Many states *do* have doctrines or statutes designed to prevent ademption in exactly this scenario – where the testator didn't actively dispose of the asset but it changed form due to corporate action beyond their control. The argument that it would be unjust to punish the beneficiary for this is a strong equitable point courts often consider.
      *   **Why Oversimplifies:** Calling it "just a name change" is factually incorrect. A merger creates shares in a *different legal entity* (Vantage Group), even if it's the "successor." The *exact* property described (500 shares of Meridian Corp) ceased to exist. Her "obviously" claim ignores the legal technicality Marcus raises.

  2.  **Marcus (Technically stronger on law, but rigid):**
      *   **Why Technically Stronger:** He is absolutely correct about the **default common law rule: Ademption by Extinction.** If the specific asset described in the will isn't in the estate at death, the gift fails. The burden *is* on the beneficiary (Ellie) to show an exception applies. His point about missing boilerplate language ("or shares received in exchange") is legally significant. Wills *are* interpreted based on their text.
      *   **Why Rigid:** He dismisses the very real possibility of statutory or judicial exceptions designed for corporate reorganizations. His argument assumes the default rule *must* apply unless specific magic words are present, ignoring that legislatures and courts have created pathways around this harsh result for involuntary changes.

  3.  **Ellie (Mixed - Stronger on Context, Weaker on Legal Specifics):**
      *   **Why Stronger (Context):** The outdated bank account reference is excellent evidence the will wasn't meticulously maintained. It strongly supports the argument that Grandpa's silence on mergers was oversight, not intent to condition Ellie's gift on Meridian never changing. The mention of family testimony about his intent ("the Meridian stock is Ellie's") is also highly relevant extrinsic evidence courts *can* consider *if* an ambiguity is found or an exception applies.
      *   **Why Weaker (Legal Specifics):** Relying on her husband (corporate lawyer, not trusts/estates) for the "most states" carve-out is shaky. While anti-ademption statutes for corporate actions exist, their *exact wording* matters immensely. Does it cover "mergers"? "Reorganizations"? "Involuntary exchanges"? Is it limited to stock-for-stock? Her husband's general expertise doesn't resolve the *specific statutory interpretation* needed here. Marcus is right that this just shifts the battle.

  4.  **Marcus (Stronger on Legal Process):**
      *   **Why Stronger:** This is his best point. He correctly identifies the *procedural* shift. If Ellie invokes a statutory exception, the debate becomes: "Does the *statutory language* precisely cover an all-stock merger?" This is a *textual* analysis of the statute, not a free-for-all about Grandpa's intent. Courts interpreting statutes *do* focus on the statutory text first. Ellie can't seamlessly switch between "Grandpa obviously meant it" and "The statute technically covers it" – these are distinct arguments requiring different evidence.

  5.  **Ellie (Better on Equity, but Overstates Predictability):**
      *   **Why Better (Equity):** Her argument that the "tiebreaker" should favor intent over automatic extinction appeals to fundamental fairness, especially with corroborating family testimony. Courts are often reluctant to let ademption defeat clear testamentary intent when the change was passive.
      *   **Why Overstates:** Saying "obvious intent" is the tiebreaker oversimplifies. Courts *do* try to discern intent, but they are constrained by the law (the will's text, the default ademption rule, and the specific wording of any exceptions). The outcome is *not* always predictable based solely on "what Grandpa wanted." The legal framework dictates *how* intent can be proven and when it overrides the text.

  **What Both Might Be Missing:**

  1.  **The Specific Jurisdiction's Law is Paramount:** This is the biggest gap. The outcome hinges almost entirely on:
      *   Does the state have an **anti-ademption statute** covering corporate reorganizations?
      *   **What is the precise wording** of that statute? Does "merger," "reorganization," "exchange," or similar language explicitly include an involuntary stock-for-stock swap? Case law interpreting that statute is critical.
      *   If no statute, does the state's **common law recognize an exception** for involuntary corporate changes? Some states do via doctrines like "identity" or "change in form only."
      *   **Residuary Clause Language:** Does the residuary clause contain broad language like "all the rest, residue, and remainder of my estate"? This strengthens the argument that the Vantage shares fall into the residue *if* ademption applies. Conversely, narrow language might slightly weaken the ademption argument.

  2.  **The Nature of the Merger:** While described as an "automatic" swap, the executor should confirm the exact mechanics. Was it truly a straightforward share conversion, or were there other elements (cash, different classes)? This could impact whether it fits within a statutory exception.

  3.  **Judicial Discretion & Burden of Proof:** Even within the legal framework, judges have some discretion. Ellie bears the burden of proving an exception to ademption applies. The strength of the family testimony about Grandpa's intent *becomes crucial evidence* if the court is determining whether an exception applies or if the will is ambiguous.

  4.  **Practical Solution - Settlement:** The cleanest resolution might be for the beneficiaries to negotiate a settlement (e.g., Ellie gets the Vantage shares but pays a small amount to the residue from her separate executor fee, or they agree on a split). This avoids costly litigation over what is likely a moderate sum relative to legal fees.

  **The Textualism vs. Purposivism Analogy:**

  Your instinct is **spot on.** This is absolutely a microcosm of that debate, applied to will construction:

  *   **Marcus = Textualist:** Focuses strictly on the words of the will ("500 shares of Meridian Corp"). Since that exact asset is gone, the gift fails. Legislative intent (if a statute exists) is found *only* in the statute's text. Extrinsic evidence (family testimony) about Grandpa's wishes is largely irrelevant if the text is clear. Predictability and adherence to the written document are paramount.
  *   **Ellie = Purposivist:** Focuses on the testator's (Grandpa's) purpose and intent ("give Ellie my position in that company"). The text is a means to discern that purpose. When the text produces a harsh or seemingly unintended result due to unforeseen events (merger), the purpose should control. Extrinsic evidence (family testimony, the outdated bank account) is vital to understanding purpose. Equity and avoiding absurd results matter.

  **Do wills run on different logic?** Yes and No.
  *   **Yes:** Wills involve intensely private intent. Statutes governing wills often *explicitly* direct courts to discern and honor the testator's intent if possible. The "absurd results" doctrine is applied more readily than in public statutory interpretation.
  *   **No:** The core interpretive tension – strict text vs. underlying purpose/intent – is fundamentally the same. Rules like ademption exist for predictability and to respect the formal will document. Courts still rely heavily on the text as the primary evidence of intent.

  **Conclusion:** Neither Ellie nor Marcus is entirely wrong or right. Marcus has the stronger *default legal position* (ademption) and correctly frames the statutory interpretation battle. Ellie has the stronger *equitable and contextual argument* about Grandpa's likely intent and the injustice of strict ademption for an involuntary change. The *actual outcome* depends critically on the specific laws of your grandfather's state regarding anti-ademption statutes and judicial exceptions for corporate reorganizations.

  **Executor's Next Step:** You need definitive legal advice based on the **specific state law** governing the will and the **exact wording** of any relevant anti-ademption statute. Present the lawyer (or a trusts/estates litigator they recommend) with the will, the merger details, and the family testimony. Ask: "Under our state's law, does the gift of Meridian stock adeem, or does Ellie receive the Vantage shares?" Be prepared for the answer to involve statutory interpretation and potentially some uncertainty. If the beneficiaries remain deadlocked, court instruction might be necessary, but settlement is always preferable.
