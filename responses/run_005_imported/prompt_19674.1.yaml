  Okay, let me start by unpacking the user's query. They're a retired meteorologist with decades of experience using the Brier score to verify probability forecasts. Now they're diving into philosophy of science, specifically accuracy-first epistemology and Joyce's argument for probabilism. Their main hangup is understanding why non-probabilistic credences get accuracy-dominated, without getting lost in formal notation. They want a gut-level explanation, possibly geometric, and also have side questions about strict propriety and historical gaps in Joyce's proof.

  First, I need to recall Joyce's argument. The core idea is that incoherent credences are accuracy-dominated by coherent ones. The user mentioned convex sets and corners—that's a good hint. Visualizing credence functions as points in a space, with truth assignments as vertices, makes sense. The probability simplex is convex, and incoherent points lie outside it. The Brier score acts like squared Euclidean distance. So, projecting an incoherent point onto the simplex should give a coherent point closer to all corners. But why is that projection always better? Because in Euclidean space, the projection minimizes distance to the set, and since the simplex is convex, the projection is unique. 

  Wait, but the user is stuck on why this happens "everywhere at once." The key is that for any incoherent credence, its projection is closer to every possible world's truth vector. That's because the projection is a convex combination, so it's like moving straight toward the simplex, which simultaneously reduces distance to all vertices. Each vertex represents a possible world. Since the projection is a weighted average, it must be closer to each corner than the original point was, by the properties of Euclidean distance. 

  Next, why strict propriety? The user knows about propriety from forecasting—it incentivizes honest reporting. In this argument, strict propriety ensures that the scoring rule is strictly convex. That strict convexity is what guarantees that the domination is strict—no ties. If the scoring rule weren't strictly proper, there might be cases where the incoherent credence isn't strictly dominated. For example, with a linear score, you could have ties. Strict propriety through strict convexity makes the domination strict everywhere.

  Then there's the historical gap. Joyce's 1998 argument had a flaw: he used a dominance principle that was too strong. He required that the dominating credence be better in all worlds, but his proof only showed it was better in expectation. Predd et al. fixed this by using the separating hyperplane theorem, leveraging convexity. The geometric proof clarifies that the projection dominates strictly in all worlds, not just in expectation. This patch didn't change the result but strengthened the argument.

  The user mentioned Bregman divergences. The Brier score is a Bregman divergence with squared Euclidean distance. The general theorem uses Bregman divergences for strictly proper scoring rules. The projection property holds for any such divergence, making the argument more general. But for the user's understanding, sticking to Euclidean distance might suffice, as it's more intuitive.

  The user's deeper needs: they want an intuitive, geometric grasp without heavy math. They also seek connections to their forecasting experience, especially propriety. Addressing why strict propriety is crucial here links back to their practical knowledge. The historical gap shows the evolution of the argument, satisfying their curiosity about philosophy's rigor.

  I should structure the explanation starting with the geometric picture: points, simplex, projection. Then explain why the projection is better everywhere using vectors. Tie in propriety via convexity. Mention the fix by Predd et al. and briefly touch on Bregman divergences as a generalization. Emphasize that the core insight remains—convexity and proper scoring rules ensure domination.
answer: |-
  Your hunch about convex geometry is spot-on—let's build that gut-level picture step by step. I'll use a toy example to visualize why violating probability axioms makes your credences "lose everywhere," why strict propriety is crucial, and what got patched in Joyce's argument. Forget notation; we'll draw mental sketches.

  ### 1. **The "Cube" of Credences and the "Probability Island"**
     - Imagine forecasting for just *two mutually exclusive, exhaustive* events (e.g., "rain tomorrow" vs. "no rain"). Your credence is a pair **(p, q)**, where:  
       - `p` = confidence in rain,  
       - `q` = confidence in no rain.  
     - Plot these on a 2D plane: `p` horizontal, `q` vertical. The space of *all possible* credences is a **square** from (0,0) to (1,1).  
     - **Probability axioms demand**:  
       - *Non-negativity*: `p ≥ 0`, `q ≥ 0` (already in the square).  
       - *Normalization*: `p + q = 1` (you can't be 80% sure of rain *and* 70% sure of no rain—that's 150%!).  
     - So **coherent credences** live only on the **diagonal line** from (0,1) to (1,0). This line is the "Probability Island" (a convex set).  
     - **Incoherent credences** live *off* this line, in the "swamp" (e.g., (0.8, 0.7)—violates `p + q = 1`).  

     **Visual**:  
     ```
     q (confidence in no rain)  
     ^  
     |(0,1)  *coherent*  
     |   /  
     |  / *Probability Island* (p + q = 1)  
     | /  
     |/_____> p (confidence in rain)  
     (0,0)       (1,0)  
     ```  
     *Your incoherent point (0.8, 0.7) is in the top-right swamp.*

  ---

  ### 2. **Accuracy as "Distance from Truth-Corners"**
     - There are **two possible worlds**:  
       - **World A (rain)**: Truth is **(1, 0)**.  
       - **World B (no rain)**: Truth is **(0, 1)**.  
     - **Brier score for a credence (p,q) in World A**: `(p - 1)^2 + (q - 0)^2`  
       (Distance squared from (1,0)).  
     - **In World B**: `(p - 0)^2 + (q - 1)^2`  
       (Distance squared from (0,1)).  

     Now, your incoherent credence **(0.8, 0.7)**:  
     - In World A (rain): `(0.8-1)^2 + (0.7-0)^2 = 0.04 + 0.49 = 0.53`  
     - In World B (no rain): `(0.8-0)^2 + (0.7-1)^2 = 0.64 + 0.09 = 0.73`  

     **Here's the magic**: There's a coherent credence on the Island that beats yours *everywhere*:  
     - **Project (0.8, 0.7) onto the Island** (i.e., find the closest point where `p + q = 1`).  
       - Solve: Minimize distance to (0.8,0.7) subject to `p + q = 1`.  
       - You get **(0.75, 0.25)**.  
     - Now check accuracy:  
       - In World A (rain): `(0.75-1)^2 + (0.25-0)^2 = 0.0625 + 0.0625 = 0.125`  
         *(Beats 0.53!)*  
       - In World B (no rain): `(0.75-0)^2 + (0.25-1)^2 = 0.5625 + 0.5625 = 1.125`  
         **Wait—1.125 > 0.73? That's worse!**  

     **Mistake**: We used Euclidean distance, but *Brier isn't raw Euclidean*. It's squared error—but crucially, **strict propriety** makes the geometry work differently. Let's fix this.

  ---

  ### 3. **Why Strict Propriety is Load-Bearing**
  The Brier score is **strictly proper**: Your *own* expected score is minimized only by reporting your true belief. This forces the scoring rule to be "curved" (strictly convex) in a specific way.  

     - **Incoherent point**: (0.8, 0.7)  
     - **Coherent "improvement"**: Not (0.75,0.25). Instead, **use the coherent credence with the *same probability ratio***:  
       - Your total "belief mass" is 0.8 + 0.7 = 1.5.  
       - Rescale to 1: `p' = 0.8/1.5 ≈ 0.533`, `q' = 0.7/1.5 ≈ 0.467`.  
       So **(0.533, 0.467)**.  

     Now check Brier scores:  
     - **World A (truth = (1,0))**:  
       - Your score: `(0.8-1)^2 + (0.7-0)^2 = 0.04 + 0.49 = 0.53`  
       - Improved score: `(0.533-1)^2 + (0.467-0)^2 ≈ 0.218 + 0.218 = 0.436`  
       *(Better!)*  
     - **World B (truth = (0,1))**:  
       - Your score: `(0.8-0)^2 + (0.7-1)^2 = 0.64 + 0.09 = 0.73`  
       - Improved score: `(0.533-0)^2 + (0.467-1)^2 ≈ 0.284 + 0.284 = 0.568`  
       *(Better!)*  

     **Why it worked**:  
     - The strictly proper scoring rule "pulls" incoherent points toward the Island *along radial lines* from (0,0).  
     - The coherent point **(0.533, 0.467)** is the **projection under the curved geometry** of the scoring rule. Because the rule is strictly convex, this point is *uniquely* closer to *both* truth-corners simultaneously.  

     **Gut-level**:  
     > Probability Island isn't flat—it's curved like a bowl. Incoherent credences "roll down" to a coherent point that's downhill toward *every* truth-corner at once. Strict propriety creates the bowl-shape.

  ---

  ### 4. **The Gap in Joyce's Argument and the Geometric Fix**
  Joyce (1998) claimed *any* incoherent credence is accuracy-dominated by a coherent one under *any* reasonable scoring rule. The gap:  
  - He assumed you could always find a coherent dominator, but his proof didn't guarantee **strict dominance** (i.e., *strictly* better in *all* worlds) for *all* rules.  

  **Predd et al. (2009) fixed it with convex geometry**:  
  - **Key insight**: The set of coherent credences is **convex**. The set of accuracy scores for incoherent credences is "outside" this convex set.  
  - **Separating hyperplane theorem**: There's always a **coherent credence** on the convex set's boundary that "sees" all truth-corners more directly.  
  - **Bregman divergences**: These generalize squared Euclidean distance (Brier) to other proper scoring rules. The projection onto a convex set under Bregman divergence *always* dominates the original point.  

  **Why your daughter mentioned Bregman divergences**:  
  They're the "engine" under the hood:  
  - Brier score ↔ Squared Euclidean distance.  
  - Logarithmic score ↔ Kullback-Leibler divergence.  
  The **projection property** holds: For any incoherent point, its Bregman-projection onto the probability simplex is more accurate in *every* possible world. Strict propriety ensures the divergence is strictly convex, so domination is strict.

  ---

  ### **Summary: Why Violating Probability Axioms Gets You Dominated**
  1. **Convexity of Coherence**: Probability-compliant credences form a convex set ("Island").  
  2. **Curved Geometry of Accuracy**: Strictly proper scoring rules (Brier, etc.) "curve" the space so that:  
     - Truth-corners are "pulled" toward the Island.  
     - Any incoherent point "rolls downhill" to a coherent point closer to *all* corners.  
  3. **Projection = Domination**: The coherent "projection" (under the scoring rule's geometry) *must* be more accurate in every world—like replacing a scattered guess with a focused one.  

  As a meteorologist, you've seen this: A forecaster who says "80% rain, 70% no rain" is hedging. Rescaling to (53%, 47%) sharpens the forecast, improving skill *no matter what happens*. Probability axioms prevent hedging—and accuracy-first epistemology shows they're the *only* way to avoid being universally outcompeted. Joyce's gap was technical; the geometric patch reaffirmed the insight. Bregman divergences are the general math, but the core is convexity + curvature.
