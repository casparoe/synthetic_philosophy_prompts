  Finally, Ellie argues in point six that guilt doesn't prove wrongdoing, citing examples like survivor's guilt. While technically valid, this seems weaker in context because Danny's relationship with his father involves actual obligations, not just irrational guilt. Both make reasonable points, but Marcus's position aligns better with the specifics of Danny's remorse.

  Throughout, both overlook important nuances: the significance of the decade-long estrangement with the father, how replaceability affects different obligation types (role function vs. relational essence), and that Danny's guilt might stem from conflicting virtues (loyalty vs. care) rather than pure duty violation. The father's last-minute request timing also complicates the hierarchy Ellie proposes. Danny's belief that he owes his dad specifically suggests more than generic regret, supporting Marcus, but the estrangement context makes the obligation less clear-cut than Ellie assumes.
