  We are setting up a dialogue between two characters: CDT (Causal Decision Theorist) and UDT (Updateless Decision Theorist). The scenario is a variant of Counterfactual Mugging where the "coin flip" is replaced by a fixed mathematical fact (the googolth binary digit of pi) that is unknown to the agent. The predictor uses this digit to determine the scenario: if the digit is 1, the agent gets $1,000,000 only if they are the type that would have paid $100 in the counterfactual scenario where the digit was 0. If the digit is 0, the predictor asks for $100 and explains the setup. In this case, the digit is 0.

  CDT argues that the agent should not pay because the counterfactual scenario (digit being 1) was never possible. UDT argues that the agent should pay because the decision should be made based on the agent's policy across all possible mathematical truths.

  The dialogue must engage deeply, especially on the issue of counterfactuals in a fixed mathematical universe.

  Let's structure the dialogue:

  1. **Initial positions**:
     - CDT: "Why pay? The digit was always 0. The scenario where it's 1 is not just causally disconnected, it's logically impossible. So I'm just being asked for $100 with no benefit."
     - UDT: "But your policy in the hypothetical scenario where the digit is 1 is what determines whether you get the million. So you should have a policy of paying in the 0 case to be the type that would pay in the 1 case, even though that case never happens."

  2. **CDT's strongest move**: 
     - The counterfactual "if the digit had been 1" is not a possible world because the digit is fixed by mathematical necessity. Therefore, there is no true counterfactual to consider. The predictor is only testing a logical dependency that doesn't correspond to any real possibility. Thus, the agent's decision in the actual world (digit=0) should be based solely on the actual consequences: paying $100 loses $100 and gains nothing because the million is not on the table.

  3. **UDT's strongest move**:
     - The agent's decision should be made from a position of uncertainty about the mathematical fact. Before knowing the digit, the agent should choose a policy that maximizes expected utility over the two possibilities (digit=0 or digit=1). Even though the digit is fixed, the agent doesn't know it. The predictor is using the agent's policy in the counterfactual (which is a logical consequence of the agent's algorithm) to determine the outcome in the actual world. Therefore, the agent must consider the logical implications of their policy.

  4. **Deepening the debate**:
     - CDT: "But in reality, there is no uncertainty. The digit is fixed. When the predictor evaluated the counterfactual, it wasn't evaluating a real possibility but a logical fiction. So the only real event is the digit=0 world, and in that world, paying $100 doesn't cause anything good."
     - UDT: "The predictor is part of the world. It computed the digit and then set up the situation. Your algorithm, when run by the predictor in the counterfactual scenario (even if that scenario is logically impossible), must be consistent. The predictor is testing what your output would be in the counterfactual scenario. So if your algorithm is such that it would pay in the counterfactual, then you get the million when the digit is 1. But if you don't pay in the actual (digit=0) scenario, that reveals that your algorithm is not the type that would pay in the counterfactual. So you lose the million in the digit=1 scenario. But note: the predictor only gives the million if the agent is the type that would pay in the counterfactual. So by not paying now, you are revealing that you are not that type, and therefore you wouldn't have gotten the million even if the digit had been 1 (which it wasn't). But wait, that seems circular. The point is: the predictor is using the same algorithm that you are running now to determine what you would do in the counterfactual. So if you are using an algorithm that pays in the digit=0 case, then that same algorithm would pay in the digit=1 case? Not necessarily. The algorithm might condition on the digit. But the predictor is evaluating the counterfactual by simulating the agent with the input that the digit is 0 (for the counterfactual) and then seeing if the agent pays. So the agent's algorithm must be consistent: it must output the same action for a given input. But note: the input in the actual world is digit=0, and in the counterfactual the input would be digit=1? Actually, the predictor is setting up two different scenarios:

          Scenario 1 (digit=1): The predictor doesn't ask for money, but it checks what the agent would do if the digit were 0. How? It simulates the agent being told that the digit is 0 and being asked for $100. If the agent in that simulation pays, then the predictor gives $1,000,000.

          Scenario 0 (digit=0): The predictor comes and asks for $100.

          The agent's algorithm is run in two possible situations: 
          - In the actual situation: the agent is told the digit is 0 and is asked for $100.
          - In the counterfactual situation (which is a simulation run by the predictor when the digit is 1): the agent is told the digit is 0 and is asked for $100.

          So the agent is faced with the same input in both cases: "digit=0, please pay $100". But in reality, when the digit is 1, the agent is never actually faced with that request. The predictor is simulating what the agent would do if faced with that request. Therefore, the agent's algorithm, when given the input "digit=0, please pay $100", must output an action. And that same algorithm is what the predictor uses in the digit=1 case to determine whether to give the million.

          Therefore, the agent should choose an algorithm that, when given the input "digit=0, please pay $100", pays the $100. Why? Because then in the case where the digit is 1, the predictor will see that the agent pays in the simulation (i.e., in the counterfactual) and thus gives the agent $1,000,000. And in the case where the digit is 0, the agent pays $100 and gets nothing. But the expected utility (before knowing the digit) is:

          P(digit=1) * 1,000,000 + P(digit=0) * (-100)

          Since P(digit=1)=0.5 (by the principle of indifference, because the agent doesn't know the digit) and 0.5 * 1e6 = 500,000 and 0.5 * (-100) = -50, so the expected utility is 499,950, which is positive.

          Alternatively, if the agent chooses an algorithm that doesn't pay, then:

          P(digit=1) * 0 (because they don't get the million) + P(digit=0) * 0 = 0.

          So paying yields a higher expected utility.

  5. **CDT's response to UDT**:
     - "But in reality, the digit is fixed. The agent in the actual world knows (or can know) that the digit is 0? Actually, in the scenario, the agent doesn't know the digit until the predictor shows up? The problem says: 'Turns out the digit is 0'. So at the moment of decision, the agent is told the digit is 0 and is being asked for $100. The agent does not have the uncertainty anymore. So the expected utility calculation from before knowing the digit is irrelevant. Now, the agent knows the digit is 0. Therefore, the agent knows that the digit=1 scenario is not just counterfactual but logically impossible. So the agent should only consider the actual consequences: paying $100 leads to a loss of $100 and no gain. Not paying leads to no loss. Therefore, don't pay."

  6. **UDT's counter**:
     - "But the agent's decision algorithm was set before the digit was known? Or at least, the agent must consider that the predictor has already run the simulation in the counterfactual. The key is that the agent's algorithm must be consistent. If the agent now, in the actual situation (digit=0), decides not to pay, then that means that in the counterfactual simulation (which the predictor ran when the digit was 1) the agent would also not pay? Wait, no. The counterfactual simulation is of the situation where the digit is 0. So if the agent in the actual world (digit=0) does not pay, then that means that in the counterfactual simulation (which is also a digit=0 situation) the agent would not pay. Therefore, the predictor in the digit=1 world would see that the agent doesn't pay in the counterfactual and thus would not give the million. But that's consistent: the agent doesn't pay and doesn't get the million. However, the point is: the agent in the actual world (digit=0) cannot change the fact that the digit is 0. But the agent's decision now is being used by the predictor in the counterfactual? No, the predictor in the counterfactual (digit=1) has already run the simulation and made its decision. The agent's decision now in the actual world (digit=0) is separate. So how does the agent's decision now affect the past? It doesn't. Therefore, the agent in the actual world (digit=0) has no incentive to pay. But wait, that's the same as the original counterfactual mugging. The UDT argument is that the agent should commit to a policy in advance that pays in both cases? Or specifically, that the agent should have a policy that pays when asked in the digit=0 case because that policy is what gets the million in the digit=1 case. But in the actual world, when the digit is 0, the agent is losing $100. The problem is that the agent cannot change the policy at the moment of decision without affecting the counterfactual. But in a timeless sense, the agent's algorithm must be fixed and must output the same action for the same input. Therefore, if the agent in the actual world (digit=0) pays, then that means the agent's algorithm is such that it pays when told digit=0. Therefore, in the counterfactual world (digit=1) the predictor would simulate the agent being told digit=0 and the agent would pay, so the predictor would give the million. But again, in the actual world the digit is 0, so the agent doesn't get the million. However, if the agent in the actual world (digit=0) does not pay, then the agent's algorithm is such that it does not pay when told digit=0. Therefore, in the counterfactual world (digit=1) the predictor would see that the agent doesn't pay and wouldn't give the million. So the agent in the actual world (digit=0) doesn't pay and loses nothing, but also doesn't get the million in the counterfactual (which doesn't happen). The agent is better off having an algorithm that pays in the digit=0 case because then in the case where the digit is 1 (which has 50% probability from the prior) they get the million. But at the moment of decision, the agent knows the digit is 0. How can they change their algorithm now? They can't. The algorithm was fixed in advance. So the agent must act according to the algorithm. The algorithm that pays in the digit=0 case is better because it gets the million in the digit=1 case. The agent, when designing their algorithm, should choose one that pays in the digit=0 case. Then, when the digit is 0, they pay and lose $100, but when the digit is 1, they get $1,000,000. If they choose an algorithm that doesn't pay in the digit=0 case, then when the digit is 0 they don't lose $100, but when the digit is 1 they don't get $1,000,000. The expected utility of the paying algorithm is 0.5 * (-100) + 0.5 * 1,000,000 = 499,950. The expected utility of the non-paying algorithm is 0. So the agent should choose the paying algorithm. Therefore, when the digit is 0, they pay. That's the algorithm they have. So they pay."

  7. **CDT's final move**:
     - "But the agent doesn't choose their algorithm at the moment of decision. They are already running an algorithm. If they are a CDT agent, their algorithm is: in any situation, consider the causal consequences of actions and choose the one that maximizes utility given the known state. In the known state (digit=0), paying $100 causes a loss of $100 with no gain. So they don't pay. And that algorithm, when run in the counterfactual simulation (if the digit were 1 and the predictor simulates the digit=0 scenario), would also not pay. So the predictor would not give the million. But that's consistent. The CDT agent doesn't pay and doesn't get the million. The UDT agent, by having a different algorithm, does pay and gets the million in the digit=1 case. But the CDT agent, at the time of designing their algorithm, might wish they were a UDT agent? Because the UDT algorithm has higher expected utility. But the CDT agent is committed to causal reasoning. The core of the disagreement is whether the agent should use causal reasoning or logical reasoning (treating the decision as a fixed computation that must be consistent across logically possible scenarios)."

  8. **Landing somewhere**:
     - The distinction between logical and physical possibility does not change the UDT argument because UDT treats logical possibilities as the relevant possibilities for decision-making. The CDT agent, by sticking to causal reasoning in the actual world, loses out on the opportunity to benefit in the logical counterfactual. The problem highlights the difference in decision frameworks: CDT evaluates decisions based on the actual causal consequences, while UDT evaluates based on the entire set of logical possibilities and the consistency of the agent's policy across them. The fact that the counterfactual is logically impossible does not matter for UDT because it is still a well-defined logical scenario that the agent's policy must cover.

