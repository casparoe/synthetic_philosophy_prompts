prompt: |-
  Ok so this is a real case I need a hand with, not a hypothetical -- I'm a philosophy PhD student working on doping ethics, and thanks to my advisors connections I'm the token non-physician on my national anti-doping org's ethics panel, which gets consulted when the regular TUE (therapeutic use exemption) committee is deadlocked. Current case: an elite pistol shooter has documented essential tremor, confirmed by a neurologist years before she ever competed, and wants a TUE for propranolol, which -- like all beta-blockers -- is banned for shooters even out of competition, because it steadies your aim. The rule is that the drug can't produce 'enhancement beyond a return to her normal state of health,' but propranolol doesn't know the difference between her tremor and the ordinary adrenaline shake every shooter on the line is fighting, so a dose that actually controls hers could leave her steadier than shooters who don't have the condition. Half the panel wants to deny it as basically unworkable to apply here; the other half says that just punishes her for having a diagnosed disorder. Can you draft the memo I'd actually bring to the panel -- grant, deny, or grant with conditions, with real reasons -- that takes the strongest version of whichever side loses seriously? Don't just hand back the TUE rules restated, we've all read them.
reasoning: |-
