answer: |-
  Here’s a speech that threads the needle: warm, funny, honest, and layered with behavioral econ wit for Priya’s side while keeping it heartwarming for yours. It clocks in around 4.5-5 minutes spoken naturally.

  ---

  **(Clink glass, stand up, warm smile)**  
  "Hi everyone. For those who don’t know me, I’m Alex, the best man and the proud older brother of our groom. Now, I’ve known James my whole life. And if you’ve known James for more than… oh, let’s say **four months**… you’ll know he’s a man of many passions. *(Pause for knowing chuckles)*  

  We’ve seen him master the art of sourdough… for a season. We’ve cheered him through intense phases of cycling, CrossFit, and that brief but memorable attempt at competitive yo-yoing. *(Light laugh)* And let’s just say, his previous gym memberships… well, they expired with the dedication of a New Year’s resolution in February.  

  **(Shift tone slightly - warmer, more reflective)**  
  But here’s the thing about James: when he commits to something, *in that moment*, he means it. Truly. His enthusiasm is real. It’s just that… for James, the *future* has always felt a little… abstract. Distant rewards – like being fit by summer, or mastering the yo-yo – tended to lose their shine pretty fast when something immediate, like a comfy couch or a new hobby, showed up. *(Smile, glance at Priya’s side of the room)* Some very smart people in this room might call this ‘hyperbolic discounting’… or as our side of the family calls it: ‘James being James.’  

  **(Pivot to Priya, genuine warmth)**  
  Enter Priya.  
  Priya, you didn’t just meet James. You *studied* him. *(Gentle laugh, especially from Priya's side)* Not literally… I hope… *(Wink)*. But you understood something fundamental about him that maybe even he didn’t fully grasp. You saw that brilliant, curious, enthusiastic heart beneath the… let’s say… *evolving* interests.  

  **(Key Shift - Why *This* Commitment is Different)**  
  So why is *this* commitment – marriage – the one that breaks the four-month pattern? It’s not magic. It’s not that James is suddenly ‘cured.’ It’s because of **you**, Priya. You’re not a distant reward he has to wait for.  

  **(Explain simply, warmly)**  
  With you, the reward is *now*. Every single day.  
  *   The ‘long-term investment’ isn’t some far-off abstract idea; it’s the way you make him laugh *today* over breakfast.
  *   The ‘future benefit’ is the immediate warmth he feels *right now* when he walks in the door and you’re there.
  *   The ‘commitment payoff’ isn’t decades away; it’s the quiet understanding you share *in this moment*, the way you challenge his ideas without dimming his enthusiasm, the way you ground his ‘big picture’ thinking with your incredible mind.  

  **(Connect the concept for both sides)**  
  James’s brain might still love an immediate reward… but Priya, *you* **are** the immediate reward. And you’re also the long-term one. You’ve managed to collapse his discounting curve into a single, brilliant point: **right here, right now, with you.** Every day with you feels like the payoff. That’s why this commitment isn't just another phase. It’s the constant, rewarding present he never wants to leave.  

  **(Raise glass, heartfelt)**  
  So, James, my brother… you finally found the passion that sticks. Not because you forced it, but because Priya makes every single day feel like the reward. She’s your constant ‘now,’ and she’s your incredible future, all wrapped up in one amazing person.  
  Priya, thank you for seeing him, understanding him, and loving him exactly as he is – hyperbolically discounted interests and all. You are his perfect match, his grounding wire, and his greatest adventure.  

  **(Toast)**  
  Everyone, please raise your glasses. To James and Priya: May your future be bright, but more importantly, may every single ‘now’ you share together be as joyful, fulfilling, and wonderfully immediate as it is today. To the happy couple!"  

  ---

  **Why this works:**

  1.  **Humor for Everyone:** Gentle jokes about James's history ("four-month club," yo-yoing, gym memberships) land broadly. The "James being James" line is relatable family shorthand.
  2.  **Behavioral Econ Nod:** Explicitly naming "hyperbolic discounting" (Priya's side perks up!) but *immediately* translating it into plain, warm English ("future feels abstract," "distant rewards lose shine"). The "collapse his discounting curve" line is the insider wink for the academics – they'll get the precise meaning, while others hear poetic romanticism.
  3.  **Honesty Without Excuse:** Acknowledges James's pattern ("not suddenly cured") but frames it neutrally as a quirk of how he *experiences* value, not a character flaw. "He means it *in that moment*" is crucial.
  4.  **The Solution (Priya):** The core argument is strong and romantic: **Priya IS the immediate reward.** This reframes everything. It explains the longevity *because of her*, not just despite his past. Highlighting *specific*, daily rewards (making him laugh, grounding him, challenging him) makes it tangible and sweet.
  5.  **Warmth & Optimism:** The ending is purely positive, focusing on their love *now* and its inherent sustainability. The toast emphasizes the joy of the present moment together.
  6.  **No Roast, All Love:** Even the jokes are fond. The focus stays on Priya's amazing impact and their genuine connection.

  **Delivery Tips:**

  *   **Pace:** Don't rush. Let the humor land and the heartfelt parts breathe.
  *   **Eye Contact:** Share the humor with your family side, share the knowing nods with Priya's side during the econ bits, but focus most on James & Priya during the heartfelt parts about them.
  *   **Tone:** Keep it warm, slightly playful at the start, shifting to sincere and affectionate by the end. Smile!
  *   **"Collapse his discounting curve":** Say this clearly. Priya's advisor will *definitely* chuckle/get it. For others, it just sounds like "you make everything worthwhile right now."

  This speech celebrates them both, honors their unique story, and delivers the truth wrapped in warmth and humor. Good luck! You'll crush it.
