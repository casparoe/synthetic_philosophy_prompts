  **Justifications:**

  1.  **Elena (Score 2):** She is clearly right on Aquinas's textual distinction. In his *Commentary on the Sentences* (II Sent. d.44, q.2, a.2), Aquinas explicitly differentiates a tyrant *ex defectu tituli* (usurper) from one *ex parte exercitii* (unjust ruler). He states subjects owe *no obedience whatsoever* to the usurper precisely because the usurper lacks legitimate authority ("*non habet potestatem*"), reducing them to the status of a private aggressor. This foundational point is well-established in Aquinas scholarship. Her claim that forcible resistance against such a figure is *not rebellion* but akin to resisting aggression is a direct and correct inference from this text.

  2.  **Marcus (Score 1):** He is partially correct but misses Elena's key distinction. His point that denying a duty to obey ≠ licensing killing is logically sound and highlights a potential gap. His reference to *De Regno/De Regimine Principum* (I, 6) is accurate: Aquinas *is* highly cautious about private action, warns of worse outcomes, and emphasizes institutional remedies ("*ad eorum auctoritatem pertinet qui talem sibi praefecerunt regem*"). However, his mistake is collapsing the two types of tyrants. The caution in *De Regimine* explicitly addresses the tyrant *ex parte exercitii* (the bad ruler with title), *not* the usurper (*ex defectu tituli*). Marcus is correct that this text shows Aquinas's caution, but he misapplies it to the usurper case Elena is discussing.

  3.  **Elena (Score 2):** She is clearly right again. She effectively corrects Marcus's conflation by reiterating Aquinas's crucial distinction. Her argument that the "no standing to command" principle for usurpers (*ex defectu tituli*) inherently justifies forcible resistance (as against any unjust aggressor) is a strong and textually supported reading of the *Sentences* commentary. Framing this as a "coherent two-track view" (force against usurpers, institutional remedy against bad rulers with title) accurately synthesizes the key Aquinas texts (Sentences II d.44, q.2, a.2 and De Regimine I, 6). This *is* a conditional tyrannicide doctrine, specifically sanctioning lethal force against usurpers.

  4.  **Marcus (Score 1):** He raises valid nuances but doesn't fully undermine Elena's case. His question about "hunt[ing] down after the fact" vs. "resist[ing] in the moment" is insightful; Aquinas's *Sentences* text leans towards resistance *against ongoing usurpation/aggression*, not necessarily a generalized license for assassination long after the fact. His point about the potential impracticality of the institutional remedy for titled tyrants (*ex parte exercitii*) is also valid; in many monarchies Aquinas discussed, no effective deposing body existed, making "endurance and prayer" a likely practical outcome despite the theoretical remedy. His contrast with John of Salisbury (*Policraticus*) correctly highlights Aquinas's relative caution *within* the tradition, especially regarding titled tyrants. However, he underplays the strength of Elena's argument regarding usurpers. While "institutionally dealt with" might be thin for titled tyrants, it doesn't negate the clearer permission for force against usurpers. His points add necessary context and caution but don't refute the core of Elena's two-track reading.

  **What both may be overlooking:**

  1.  **The Scope of "Resistance" against Usurpers:** While Aquinas clearly denies obedience and legitimizes resistance against the usurper as a private aggressor, he doesn't explicitly *detail* the permissible *means* of that resistance in the *Sentences* text. Does "resisting an aggressor" automatically include killing, or could it be limited to lesser force? Scholarly debate exists on this. Marcus's point about "after the fact" touches on this ambiguity.
  2.  **"Public Authority" in *De Regimine*:** Aquinas's remedy for the titled tyrant assigned to "public authority" (*eorum auctoritatem*) might be interpreted more broadly than just the original appointing body. Some scholars argue it could encompass lesser magistrates, the community as a whole (in some readings), or even a superior authority like the Pope (in the context of Christendom), potentially offering more avenues than Marcus allows, though practical limitations remain significant.
  3.  **Natural Law vs. Positive Law:** Elena's argument rests heavily on the usurper's lack of *legitimate authority* (a natural law/political theory point). Marcus focuses more on the practical *consequences* and institutional *structures* (positive law/pragmatics). Both dimensions are present in Aquinas, but their emphasis differs.
  4.  **The Role of Intent and Prudence:** Aquinas's caution in *De Regimine* stems not just from the ruler's title but from a deep prudential concern about disorder and unintended consequences. This prudence arguably applies even to resisting usurpers if the likely outcome is worse chaos, though Aquinas doesn't explicitly say this in the *Sentences* passage. Both debaters could engage more with Aquinas's underlying emphasis on the common good and the perils of disorder.
