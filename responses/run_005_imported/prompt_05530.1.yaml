prompt: |-
  As I prepare a graduate seminar on the logic of conditionals, I keep returning to one specific puzzle rather than a general survey of the field. Ernest Adams's classic minimal pair runs as follows:

  (1) If Oswald did not kill Kennedy, someone else did.
  (2) If Oswald had not killed Kennedy, someone else would have.

  Nearly every competent speaker judges (1) true and (2) false, even though the two sentences share an antecedent and a consequent and differ only in grammatical mood. Please explain why this pair is treated as a serious obstacle to Stalnaker's project of giving indicative and counterfactual conditionals a single, uniform selection-function semantics, and how a Stalnakerian tries to locate the difference in context rather than in the truth conditions themselves. Then offer your own assessment: does that maneuver actually succeed, or does the pair instead vindicate the Adams–Edgington view that indicative conditionals should be handled probabilistically rather than truth-conditionally, leaving counterfactuals as the only genuinely modal conditionals in natural language?
reasoning: |-
  Okay, let me approach this user's query methodically. The user is preparing a graduate seminar on conditionals and is focused on Adams's Oswald pair as a central puzzle. They want to understand why this pair challenges Stalnaker's uniform semantics and how Stalnakerians respond, ending with an evaluation of whether the probabilistic approach prevails.

  First, I need to recall Stalnaker's core framework. His selection-function semantics treats both indicatives and counterfactuals through possible worlds, with a single selection function f that picks the closest antecedent-world. The key difference lies in the context set - the set of live possibilities. For indicatives, the context set excludes worlds where the antecedent is false, while for counterfactuals, it includes them. This distinction is crucial for explaining the Oswald pair.

  For the indicative (1), "If Oswald didn't kill Kennedy, someone else did," the context set in normal discourse only contains worlds where Kennedy was killed. So when we evaluate the antecedent "Oswald didn't do it," the closest world must be one where someone else did. Hence (1) seems true.

  For the counterfactual (2), "If Oswald hadn't killed Kennedy, someone else would have," the context set includes worlds where Kennedy wasn't killed at all. The closest ~Oswald-killed world might be one where no killing occurred, making (2) false. 

  The challenge for Stalnaker is that the same selection function produces divergent truth values despite identical antecedents/consequents. His solution relies entirely on contextual shifts in the context set. But is this convincing? The user likely wants to probe whether this contextual maneuver is ad hoc or principled.

  I should also consider the Adams-Edgington alternative. They argue indicatives lack truth conditions and are instead evaluated through conditional probability. This neatly explains why (1) feels true (since P(others-killed|Oswald-didn't) is high) while (2) has different modal logic. But this view faces its own issues with embedded conditionals and logical properties.

  In assessing Stalnaker's defense, I find his context dependency plausible for well-informed speakers, but psychologically strained for ordinary speakers who may not consciously track context sets. The user might appreciate this cognitive angle for their seminar. Ultimately, while Stalnaker's framework is elegant, the Oswald pair highlights its artificiality compared to the probabilistic view's natural fit for indicatives.

  The user's depth suggests they'll want both technical precision and philosophical implications. I'll structure the response to first explain Stalnaker's system, then the puzzle's challenge, his contextual solution, the probabilistic alternative, and a balanced evaluation favoring Adams-Edgington for indicatives while preserving Stalnaker for counterfactuals.
answer: |-
  This Adams pair is indeed a cornerstone problem in conditional logic, posing a profound challenge to Stalnaker's uniform selection-function semantics. Here's a breakdown:

  **1. Stalnaker's Uniform Semantics (Briefly):**

  *   **Core Idea:** Both indicative (e.g., 1) and subjunctive/counterfactual (e.g., 2) conditionals share the *same* underlying logical structure: "If A, then C" is true at world w iff C is true at the *closest* (most similar) world to w where A is true.
  *   **Mechanism:** A selection function, `f(A, w)`, takes an antecedent proposition A and a world w, and outputs the single world most similar to w where A is true. The conditional "A > C" is true at w iff C is true at `f(A, w)`.
  *   **Uniformity:** The *only* difference between indicative and counterfactual mood, for Stalnaker, lies in the **context of utterance**, specifically the **context set** (the set of worlds compatible with what is taken for granted, presupposed, or salient in the conversation). Mood signals *how* the context set constrains the selection function.

  **2. Why the Oswald Pair is a Problem for Uniformity:**

  *   **Shared A & C:** Both (1) and (2) have:
      *   Antecedent (A): ~O (Oswald did not kill Kennedy)
      *   Consequent (C): E (Someone else did)
  *   **Different Mood, Different Judgment:** (1) (indicative) is judged true; (2) (counterfactual) is judged false.
  *   **The Challenge:** If the semantics is *uniform* (same selection function, same truth conditions based on closest A-world), and we evaluate both at the *actual* world (where Oswald *did* kill Kennedy), then:
      1.  Find the closest world `f(~O, @)` where Oswald didn't kill Kennedy.
      2.  Check if E (someone else did) is true at `f(~O, @)`.
  *   The problem is that the uniform semantics seems to predict that (1) and (2) should have the *same* truth value at the actual world, since they share A and C and are evaluated using the same `f`. Yet, competent speakers assign *different* truth values.

  **3. The Stalnakerian Defense: Contextual Difference via the Context Set**

  Stalnakerians locate the difference *not* in the truth conditions themselves, but in how the **context set** influences the selection function `f`:

  *   **Indicative (1): "If Oswald did not kill Kennedy, someone else did."**
      *   **Context Set:** In a context where (1) is naturally uttered, the speaker and audience typically *presuppose* or take it as settled that Kennedy *was* assassinated. The context set consists *only* of worlds where Kennedy was killed.
      *   **Effect on Selection:** When evaluating `f(~O, w)` (for w in the context set), the selection function *must* find the closest world *within the context set* where ~O is true. Since the context set only contains worlds where Kennedy was killed, the closest ~O-world must be a world where someone else killed Kennedy (E is true). Hence, (1) is true.
      *   **Mood as Signal:** The indicative mood signals that the antecedent is being considered as a *live possibility* *within* the current presuppositions (Kennedy was killed).

  *   **Counterfactual (2): "If Oswald had not killed Kennedy, someone else would have."**
      *   **Context Set:** When uttering a counterfactual about a known past event (Oswald did it), the context set typically *includes* the actual world and its close variants. Crucially, it *allows for worlds where Kennedy was not killed at all*. We are explicitly *supposing* something contrary to known fact.
      *   **Effect on Selection:** The selection function `f(~O, @)` now looks for the closest world to actuality where Oswald didn't kill Kennedy. Crucially, this search is *not* restricted to worlds where Kennedy was killed. The closest world might be one where Oswald's attempt failed, but no other assassin was in place or succeeded – a world where Kennedy *wasn't* killed (~E). In such a world, C (E) is false. Hence, (2) is false.
      *   **Mood as Signal:** The subjunctive mood signals that the antecedent is being considered as *counter to fact*, potentially *outside* the presuppositions holding for indicative contexts. It "opens up" the context set to include worlds where the known outcome (the assassination) didn't occur.

  **4. Assessment: Does the Stalnakerian Maneuver Succeed?**

  The contextual defense is **intellectually coherent and formally consistent** within Stalnaker's framework. It provides *a* way to reconcile the differing judgments with a uniform semantics. However, its success is **debatable and faces significant challenges**, making the Adams-Edgington probabilistic view highly attractive:

  *   **Strengths of the Stalnakerian View:**
      *   Maintains a unified, elegant, possible-worlds framework for *all* conditionals.
      *   Explains the mood difference pragmatically via context set restrictions.
      *   Can handle many complex embeddings and interactions with modality better than early probabilistic accounts.

  *   **Weaknesses/Challenges:**
      1.  **Psychological Plausibility:** Does the ordinary speaker *really* compute different context sets (one restricted to assassination worlds, one not) consciously or subconsciously when processing (1) vs. (2)? The probabilistic judgment for (1) (P(E | ~O) is high) feels more intuitive and direct.
      2.  **The Specificity of the Context Set:** The explanation relies heavily on *exactly* the right context set restriction for indicatives. While plausible for *this* example, is this always the case? What about indicative conditionals where the consequent *isn't* presupposed? (e.g., "If the test was positive, you have the virus" – the virus isn't presupposed).
      3.  **The "Wide-Scope" Problem:** Suppose we are in a context *before* knowing who killed Kennedy. Both indicative and counterfactual versions feel odd or require different contexts. The Stalnakerian explanation for (1)'s truth seems tied to a *very specific*, *retrospective* context where the assassination *is* presupposed. This feels less like a general semantic feature of indicatives and more like a highly contextual pragmatic effect.
      4.  **Adams's Triviality Results:** Frank Adams showed that assigning standard truth-conditional semantics (like Stalnaker's) to indicative conditionals, while respecting the intuitive probability of "If A, C" being P(C|A), leads to triviality (the conditional probability must collapse to the unconditional probability under very general assumptions). This is a major formal obstacle to truth-conditional accounts of indicatives. Stalnakerians have sophisticated responses (e.g., "Stalnaker's Hypothesis" + non-Boolean semantics), but they remain complex and contentious.
      5.  **The Directness of the Probabilistic Judgment:** For (1), the judgment *feels* like an assessment of conditional probability: *Given that* Kennedy was killed (as we know he was), if it wasn't Oswald, it must have been someone else. P(E | ~O) ≈ 1. For (2), we engage in a different kind of modal speculation about how history might have unfolded differently. The Adams-Edgington view captures this intuitive distinction directly at the semantic level.

  **Conclusion: Vindication for Adams-Edgington?**

  While the Stalnakerian contextual maneuver is formally viable and retains theoretical elegance, **the Oswald pair strongly vindicates the core Adams-Edgington view that indicative conditionals are fundamentally different from counterfactuals and are best handled probabilistically, without standard truth conditions.**

  *   **Success of Adams-Edgington:** The pair perfectly illustrates their central claim. The indicative (1) is judged true because the conditional probability P(E | ~O) is extremely high (effectively 1) in the context where Kennedy's assassination is known. Its function is epistemic/evidential within the space of live possibilities. The counterfactual (2) is judged false because it involves a genuine modal claim about alternative courses of history; the closest world where Oswald didn't shoot might well be one where no assassination occurred then and there. It has truth conditions involving similarity of worlds.
  *   **Stalnakerian Success Limited:** Stalnaker's defense succeeds in showing how his uniform semantics *can* accommodate the difference *if* we accept highly specific and somewhat stipulative contextual constraints signaled by mood. However, this accommodation feels less natural and psychologically plausible than the probabilistic account for indicatives. Furthermore, Adams's triviality results pose a serious, independent challenge to assigning truth conditions to indicative conditionals that align with their probabilities.
  *   **Synthesis?** A compelling view emerging from this debate is a **hybrid approach**: Accept the Adams-Edgington probabilistic semantics for *indicative* conditionals, acknowledging their primary role in conditional belief and assertion within an epistemic context. Meanwhile, retain a Stalnaker-like (or Lewis-like) possible-worlds semantics for *counterfactual* conditionals, which genuinely involve modal comparisons of alternative worlds. The Oswald pair remains a powerful argument for this division of labor in the logic of conditionals.

  In your seminar, this pair effectively demonstrates why a purely uniform truth-conditional semantics faces a steep uphill battle against the intuitive and probabilistic force of indicative conditionals.
