prompt: |-
  I was recently appointed to the clinical advisory board of the residential meditation center where I practice, and our first case has just come before us. A student on our current three-month retreat, deep in noting practice, underwent a sudden and stable shift five weeks in: the ordinary felt sense of 'being someone behind experience' switched off and, three weeks after the retreat ended, still hasn't returned. She isn't distressed -- she describes it as finally seeing that the self was never there, exactly what anatta claims, and her teacher calls it a genuine fruition. But she is also noticeably blunted: less reactive, less relationally engaged, indifferent to things she used to care about. Half the board wants to call this textbook depersonalization-derealization and require psychiatric evaluation before she teaches again; the other half warns that this simply assumes the clinical frame is right and her account naive, when the tradition has its own vocabulary for exactly this kind of experience. She is scheduled to co-lead a retreat for new students in three weeks. Draft the board's decision memo: what happens to that assignment, what we require of her before then, and criteria -- grounded in what the tradition itself says realization should do to a person, not just clinical checklists -- we could actually use next time this happens.
reasoning: |-
  Okay, the user has presented a complex scenario involving a meditation student who experienced a profound shift during a retreat, described as anatta (non-self), but with concerning behavioral changes. The clinical advisory board is divided on whether this is a spiritual breakthrough or a psychiatric condition (depersonalization-derealization disorder). 

  The user's role as a new board member suggests they need to navigate both clinical and traditional perspectives carefully. The urgency comes from the student's scheduled teaching role in three weeks. 

  Hmm... the core tension here is between two valid frameworks: Western psychiatry's pathological lens versus contemplative traditions' transformative lens. The student's lack of distress argues against pathology, but the "blunting" raises flags about functionality. 

  I recall that in Theravada Buddhism, genuine realization should increase responsiveness to suffering, not decrease engagement. The Visuddhimagga describes post-path integration as having "tender concern for others." That's crucial - the tradition itself provides diagnostic criteria we can use. 

  For the memo structure: First, we must protect students by postponing her teaching. But we shouldn't medicalize her automatically. Instead, require functional assessments through daily activities and relational check-ins with her teacher. 

  Long-term, we need better protocols. Next time, we'd track: Does compassion increase? Is there wisdom in action? Can she skillfully discuss non-self without inducing fear? The board's divided opinion actually helps - it means we're balancing both perspectives appropriately. 

  The real win here is reframing the question: Not "is this pathological?" but "is this integrated according to the tradition's own standards?"
