  **MEMORANDUM**  
  **TO:** Clinical Advisory Board, [Center Name]  
  **FROM:** Clinical Advisory Board Chair  
  **SUBJECT:** Decision Regarding Student X's Teaching Assignment & Assessment Protocol  
  **DATE:** [Current Date]  

  ---

  ### **I. DECISION ON TEACHING ASSIGNMENT**  
  Student X’s scheduled co-leading role for the upcoming retreat (**3 weeks from now**) is **postponed indefinitely**. This decision prioritizes:  
  1. **Student Safety:** Ensuring her experience is fully integrated before guiding others.  
  2. **Participant Welfare:** Preventing potential transmission of unintegrated non-dual states to new students.  
  3. **Center Integrity:** Upholding our duty to verify teaching readiness per both clinical and contemplative standards.  

  ---

  ### **II. REQUIRED ACTIONS BEFORE FUTURE TEACHING**  
  Before Student X may be considered for teaching duties, the following must occur:  
  1. **Contemplative Integration Assessment:**  
     - Her primary teacher conducts **3+ structured interviews** assessing:  
       - Clarity on the distinction between *fruition* (e.g., stream-entry) and *nirodha-samāpatti* (cessation residue).  
       - Responsiveness to *sankhāra* (conditioned phenomena) with wisdom (*paññā*) versus indifference (*upekkhā*).  
       - Spontaneous emergence of the *brahmavihārās* (loving-kindness, compassion, empathetic joy, equanimity) in relational contexts.  
     - **Deliverable:** Teacher’s written attestation of integration, citing specific behavioral observations.  

  2. **Functional Real-World Evaluation:**  
     - Student X completes **daily life tasks** (e.g., managing finances, complex interpersonal negotiations) demonstrating:  
       - Agency without self-referentiality (*anattā* in action).  
       - *Samvega* (urgent care) for others’ suffering, per Sutta AN 10.48.  
     - **Deliverable:** Logbook of activities + 3rd-party observations (e.g., family, close sangha members).  

  3. **Clinical Screening (Non-Pathologizing):**  
     - **If** blunted affect persists, a **culturally-informed psychiatrist** (vetted by the board) assesses for:  
       - Absence of anhedonia, avolition, or emotional numbing *unrelated to insight*.  
       - Differential diagnosis: Rule out organic causes (e.g., temporal lobe epilepsy) while respecting phenomenology of awakening.  
     - *Note: Not required if teacher/functional assessments confirm integration.*  

  ---

  ### **III. CRITERIA FOR FUTURE CASES: TRADITION-ANCHORED BENCHMARKS**  
  Based on Theravāda frameworks (Visuddhimagga, Pali Suttas), genuine realization manifests through:  

  | **Domain**               | **Concerning Signs**                                  | **Integrative Signs**                                                                 |  
  |--------------------------|-------------------------------------------------------|---------------------------------------------------------------------------------------|  
  | **Affect/Engagement**     | Persistent indifference (*upekkhā* without *karuṇā*) | Responsive care (*karuṇā*) + relational joy (*muditā*) amidst non-self                |  
  | **Ethical Expression**   | Diminished *hiri-ottappa* (moral shame/fear)          | Natural, effortless adherence to *sīla* (ethics) without rigidity                     |  
  | **Phenomenology**        | "Blanking out" sensory/emotional textures             | Clear knowing (*vijjā*) of emptiness (*suññatā*) *within* dynamic sensory flow        |  
  | **Relational Wisdom**    | Withdrawal from *sangha* obligations                  | Spontaneous service (*dāna*), attuned speech (*sammā-vācā*) reflecting non-clinging   |  
  | **Insight Maturation**   | Literalist interpretation of "no-self"                | Fluid use of conventional/pultimate truth (*sammuti/paramattha sacca*) as context demands |  

  **Key Tradition-Based Thresholds for Teaching:**  
  - **Anattā in Service:** Ability to *skillfully reference* self/other constructs to alleviate suffering (per SN 1.25).  
  - **Unshakable *Sīla*:** Ethical stability verified by community (*sangha*) witnesses.  
  - **Thermometer Test:** *Inverse* reactivity to praise/blame (MN 61) while retaining compassionate engagement.  

  ---

  ### **IV. RECOMMENDATIONS FOR CENTER PROTOCOL**  
  1. **Pre-Retreat Screening:** Implement contemplative interviews assessing students’ understanding of *anattā* vs. dissociation.  
  2. **Post-Fruition Monitoring:** Mandatory 3-month integration period with teacher check-ins before teaching.  
  3. **Board Training:** Annual workshop on differentiating pathological detachment from insight-based *viraga* (dispassion) using Pali source texts.  

  ---

  **CONCLUSION:** Student X’s experience demands rigorous *contemplative-first* assessment. We honor her non-distress but verify integration through tradition-defined markers of awakened functioning. Her teaching role remains on hold until she demonstrates embodied wisdom (*paññā*) that enriches—not diminishes—her humanity.  

  **APPROVED:**  
  [Chair Signature]  
  Clinical Advisory Board, [Center Name]  

