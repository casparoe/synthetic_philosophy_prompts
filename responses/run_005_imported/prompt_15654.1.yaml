  However, there's a tension. If the axioms are truly self-evident, why does their coherence depend on an empirical fact? This might indicate that Sidgwick didn't fully trust their self-evidence, or he recognized that without the postulate, their conflict undermines their authority. His research reveals a vulnerability in his system—self-evidence isn't sufficient for practical rationality if axioms conflict irreconcilably.

