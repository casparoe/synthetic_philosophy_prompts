prompt: |-
  Okay, this has been bugging me for weeks and my roomate (a syntax person, so not exactly invested) and I can't agree on it, so I want an outside opinion. I'm doing a linguistics PhD on the pragmatics/semantics side, and over winter break my cousin got an interview invite from a PhD program. A friend of mine who's an alum there mentioned, kind of in passing, that over the last five years something like 39 out of 40 people who made it to the interview stage ended up admitted, so clearing that bar is basically a formality. My cousin texted me freaking out the night before decisions came out, and I just told her straight up, "you're in, seriously, stop stressing" — because honestly 97.5% is about as sure as I am of most things I say out loud all day. Except she was the 1 in 40. She's been kind of cold to me since, her point being that I had no business telling her she got in when I didn't actually know that, and that she wouldn't have called her parents and grandma to tell them early if I'd just said "it's looking really good" instead of stating it like a done deal.

  I had a pragmatics seminar last term that covered speech acts and Gricean maxims, so I've got some vocabulary for this, but nothing that actually settles who's right here. My gut says there has to be room for just flatly asserting stuff based on strong evidence, since testimony and memory aren't infallible either and we don't normally demand certainty before letting people state things outright. But it also feels different from, say, if I'd told her the same thing because I personally overheard someone on the admissions committee say her name in a hallway — even if that turned out to be a mishearing, I feel like I'd be less in the wrong than if I'm just going on a base rate, at the exact same confidence level, and I can't work out why that difference should matter. Is there an actual principled story about when someone's entitled to just assert something outright instead of hedging, and does it settle whether I actually messed up here?
reasoning: |-
  Okay, let me start by unpacking this user's dilemma. They're a linguistics PhD student specializing in pragmatics/semantics, so they clearly have a strong theoretical background. The issue revolves around whether they were justified in confidently telling their cousin "you're in" based on a 97.5% admission rate after interviews. The cousin ended up being the exception and is now upset because she shared the news prematurely. 

  Hmm, the user mentions Gricean maxims and speech acts, so they're looking for a principled linguistic analysis. But there's also a clear personal tension here—they feel conflicted between their theoretical understanding and the real-world fallout. The roommate (a syntactician) wasn't invested, which makes sense—this is pure pragmatics territory. 

  First, I need to dissect why the base-rate case feels different from overhearing an adcomm member. The user's intuition about testimony vs. statistics is spot-on. Testimonial knowledge (even if flawed) carries epistemic authority because it's grounded in direct access, whereas statistics are abstract generalizations. When we say "I heard X," we're signaling a chain of evidence; when we cite a base rate, we're offering an inference. That distinction matters for how assertions land pragmatically. 

  The Gricean angle: Maxim of Quality says "don't say what you lack evidence for." But "evidence" here is tricky—97.5% is strong evidence mathematically, but contextually, in high-stakes scenarios, the threshold for "adequate evidence" skyrockets. The cousin wasn't just asking for a prediction; she was emotionally invested. That raises the stakes, demanding stronger epistemic justification. 

  Also worth considering: the speech act. "You're in" functions as a verdictive (Austin would classify it as such), which implies authority. By stating it flatly, the user implicitly positioned themselves as having decisive knowledge, which the base rate didn't actually provide. Hence the cousin's feeling of betrayal—it wasn't just wrong, it was overconfident. 

  The user's gut feeling about everyday assertions is valid, though. We constantly assert things with <100% certainty ("the train leaves at 8"). But high-stakes declarations (medical diagnoses, admissions) carry higher expectations of precision. The harm of being wrong here wasn't just factual error; it caused social embarrassment (involving family), amplifying the violation. 

  Verdict: The user messed up pragmatically, not semantically. The math was sound, but the speech act overreached the evidence type. A hedge ("virtually certain") would have preserved truthfulness while matching the epistemic grounding. Still, the cousin's coldness seems disproportionate—this was a well-intentioned error, not negligence. 

  ...Should probably also note that "97.5% certain" feels different from "97.5% admission rate." The former is an epistemic state; the latter is a fact. The user conflated them, but in assertion, only the former matters.
answer: |-
  This is a fascinating (and painfully relatable) pragmatics puzzle—and yes, there **is** a principled story here grounded in epistemic authority, stakes, and Gricean norms. Let's break it down:

  ### 1. **The Gricean Maxims & Epistemic Authority**
     - **Maxim of Quality**: "Do not say what you believe to be false or lacks adequate evidence."  
       The crux isn’t statistical probability (97.5% *is* strong evidence), but **what counts as "adequate evidence" for *this speech act* in *this context***.  
     - **Epistemic Authority**: When we flatly assert "P" (e.g., "You're in"), we implicitly claim **direct or privileged knowledge** ("I know P"). If your evidence is indirect (e.g., base rates), asserting "P" rather than "P is nearly certain" misrepresents your epistemic access.  
       - *Contrast*: If you’d overheard an adcomm member say "We’re admitting [cousin]," you’d have **testimonial authority** (direct access to a speech act). A base rate is **inferential**—it supports a probabilistic conclusion, not a categorical fact.  

  ### 2. **Stakes Sensitivity & Hedging**
     - **High Stakes Demand Stronger Evidence**: In high-stakes contexts (e.g., medical diagnoses, admissions decisions), listeners rationally expect stronger epistemic justification before categorical assertions. Your cousin’s anxiety signaled high stakes—this should trigger hedging ("It’s virtually certain") to respect Quality.  
     - **Hedging as a Pragmatic Necessity**: Saying "it’s looking really good" (a probabilistic hedge) would have:  
       - Preserved truthfulness (matching your 97.5% confidence),  
       - Avoided implying infallible knowledge,  
       - Left room for statistical outliers without betrayal.  

  ### 3. **Why Your "Overhearing" Example *Feels* Different**
     - **Direct vs. Indirect Evidence**:  
       - Overhearing an adcomm member: Asserts **testimonial knowledge** (a specific speech act about *her*). Even if wrong (e.g., misheard), your assertion was *epistemically warranted* by direct access.  
       - Base rate: Asserts **generalized induction**. It doesn’t reference *her* specifically, making the categorical claim ("you’re in") a **category error**—treating a probabilistic trend as a deterministic fact.  
     - **Accountability Difference**: With testimony, error lies in *perception*; with base rates, error lies in *overgeneralization*. The latter feels like a *reasoning failure* in high-stakes contexts.  

  ### 4. **The Principled Line: When Can You Assert Flatly?**
     You’re entitled to assert "P" categorically when:  
     - You have **direct, context-specific evidence** (testimony, perception, data *about the target case*), **OR**  
     - The stakes are low ("The train usually arrives at 8"), **OR**  
     - The probability is so high that the outlier is pragmatically negligible (e.g., "The sun will rise tomorrow").  
     
     **97.5% isn’t enough here**: A 1/40 failure rate is *salient* in high-stakes scenarios (e.g., if a surgery had 2.5% mortality, you’d demand hedging). Your cousin’s reaction confirms the stakes were sufficient to require caution.

  ### 5. **Verdict: Did You Mess Up?**
     - **Pragmatically, yes—but not maliciously.** You violated the Maxim of Quality by implying *knowledge* ("you're in") when your evidence only supported *near-certainty* ("you're almost certainly in").  
     - **Why it hurt**: By stating it categorically, you:  
       - Framed the outcome as decided (a "done deal"),  
       - Discouraged emotional preparation for rejection,  
       - Amplified her embarrassment when sharing prematurely.  
     - **Your gut isn’t wrong generally**: We assert flatly based on strong evidence *all the time*—but we adjust for stakes. We say "The train leaves at 8" (even if 95% on time), but not "The biopsy is benign" (even at 95%). PhD admissions are biopsy-level stakes for applicants.

  ### 6. **Linguistic Repair Strategy**
     Apologize for the *pragmatic misstep*, not the intent:  
     *"You’re right—I framed it as a certainty when I only had statistical evidence. I was trying to reassure you, but I should’ve said ‘It’s almost guaranteed’ to reflect that 2.5% uncertainty. I’m sorry that made you feel misled."*  
     This validates her point without conceding ill intent.

  **In short**: Strong evidence ≠ categorical assertion rights in high-stakes contexts. Base rates warrant confidence, but not the elimination of epistemic nuance. Your cousin’s coldness likely stems from feeling your assertion robbed her of agency in managing expectations—a pragmatic harm, not just a statistical fluke.
