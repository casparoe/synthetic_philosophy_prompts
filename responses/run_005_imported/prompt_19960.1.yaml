answer: |-
  Your unease is well-founded. Owen's proposal overlooks the interdependent nature of the deal and fails to account for the fact that **your explicit agreement is essential to unlock the entire $420,000 value** (the $120,000 catalog payment plus the $300,000 instructor contract). Without your signature on the exclusivity agreement, the deal collapses into the fallback ($40,000 split 50/50), leaving both of you with only $20,000 each and no instructor opportunity. This creates a cooperative scenario where both parties contribute uniquely to the surplus, and fairness requires recognizing that your consent has significant leverage.

  ### Why Owen's Proposal ($60k for You, $360k for Him) Is Problematic
  1. **Ignores joint contribution to the surplus**:  
     The $300,000 instructor contract is only available because your agreement enables exclusivity. Owen cannot access this $300,000 without you, just as you cannot access the higher catalog payment ($120,000 vs. $40,000) without him. While Owen alone performs the instructor work, your role as the "gatekeeper" of exclusivity creates the opportunity for that $300,000 to exist. Owen's claim that "that one's mine" ignores this interdependence.

  2. **Undervalues your leverage**:  
     Under Owen's split, you receive only your usual 50% of the catalog payment ($60,000), but no share of the $300,000 surplus your agreement unlocks. This reduces your total gain to **$60,000** while Owen gets **$360,000**—a 6:1 disparity. Yet without your cooperation, Owen’s total would be just $20,000 (from the fallback). Your signature is worth far more than a routine catalog split.

  3. **Misapplies the "standard" argument**:  
     Your lawyer friend’s comment likely refers to standard practice in revenue splits for *existing* work (e.g., the 50/50 catalog split). But this deal includes a new, non-transferable opportunity contingent on mutual agreement. Standard splits don’t address this asymmetry.

  ### A Principled Framework: Equal Surplus Division
  A fair division should:
  - **Compensate both parties for their BATNA** (Best Alternative to a Negotiated Agreement):  
    If negotiations fail, each gets $20,000 from the fallback license. This $20,000 is your baseline.
  - **Split the cooperative surplus equally**:  
    The total value of the full deal is $420,000. The fallback is $40,000. The surplus created by your mutual agreement is:  
    **$420,000 – $40,000 = $380,000**.  
    Since both signatures are equally crucial to creating this surplus (neither can unlock it alone), splitting it equally is fair:  
    **$380,000 ÷ 2 = $190,000 per person**.  
  - **Add the BATNA back in**:  
    - Your total: **$20,000 (BATNA) + $190,000 (surplus) = $210,000**.  
    - Owen’s total: **$20,000 (BATNA) + $190,000 (surplus) = $210,000**.  

  This approach, grounded in **cooperative game theory** (specifically the *Shapley value* or *equal surplus division*), recognizes that:
  - Owen contributes the labor for the $300,000 contract.
  - You contribute the exclusivity agreement enabling the entire deal.
  - Both contributions are indispensable and symmetric in value creation.

  ### What This Looks Like in Practice
  - **Total funds**: $120,000 (catalog) + $300,000 (instructor contract) = $420,000.
  - **Your share**: **$210,000** (all from the catalog payment, plus a portion of the instructor contract).
  - **Owen’s share**: **$210,000** ($300,000 instructor fee minus $90,000 paid to you, plus his $60,000 from the catalog).  
    *Example implementation*:  
    - The company pays you **$120,000** (entire catalog payment).  
    - The company pays Owen **$300,000** (instructor fee).  
    - Owen pays you **$90,000** from his fee.  
    **Final result**:  
    - You: $120,000 + $90,000 = **$210,000**.  
    - Owen: $300,000 – $90,000 + $0 (from catalog) = **$210,000**. *Note: Owen still receives $60,000 indirectly via keeping more of the instructor fee, but the catalog cash goes to you for simplicity.*

  ### Why This Is Fairer
  - **You’re compensated for enabling Owen’s $300,000 opportunity**:  
    Your $210,000 includes a "premium" for your pivotal role in unlocking the deal. Without you, Owen couldn’t earn the $300,000.
  - **Owen is still rewarded for his work**:  
    He keeps $210,000 for the instructor role—far more than his $20,000 BATNA—and isn’t forced to "share wages" indiscriminately.
  - **Equal gains from cooperation**:  
    Both of you profit equally from the surplus ($190,000 each on top of your BATNA), reflecting balanced contributions.

  ### Negotiating with Owen
  - **Frame it collaboratively**:  
    "I agree the instructor work is yours alone, but my agreement is what unlocks the entire $380,000 surplus. A fair split should reward us equally for that joint value creation."
  - **Highlight mutual benefit**:  
    Under this split, Owen gets $210,000 instead of his proposal’s $360,000—but without your cooperation, he’d only get $20,000. Your $210,000 is also a win versus $60,000.
  - **Address the lawyer’s comment**:  
    "Standard splits apply to existing work, but this deal creates new value requiring both of us. The principled approach is to split the surplus we generate together."

  ### If Owen Resists
  Propose a small concession:  
  - You receive **$200,000** (e.g., $120,000 catalog + $80,000 from Owen’s fee).  
  - Owen receives **$220,000** ($300,000 – $80,000 = $220,000).  
  This still acknowledges your leverage while letting Owen feel he "kept more" of his contract.

  ### Bottom Line
  Owen’s proposal is **not defensible** because it treats your essential role in enabling the $300,000 as worthless. A principled split gives each party **$210,000**, fairly rewarding both for their irreplaceable contributions. Use the surplus-division framework to negotiate—it’s logically sound and harder to dismiss than "gut feeling."
