prompt: |-
  I'm a backend engineer, and together with an old friend from my CS program I co-host a small, low-key podcast on decision theory and AI-safety-adjacent topics. Neither of us has any formal training in philosophy; we mostly fell into this material through MIRI papers and years of reading LessWrong. Next episode's guest defends logical induction -- the Garrabrant et al. trader/market framework -- as essentially the right formal answer to the problem of logical uncertainty: how a computationally bounded reasoner should assign credences to mathematical statements it hasn't yet proven or refuted, given that ordinary Bayesian epistemology simply assumes logical omniscience. She's sharp, and she's given versions of this talk on a couple of other shows already, so I don't want to spend the interview having her re-derive the basic picture for listeners -- a growing pool of computable "traders" buying and selling shares in the eventual truth of sentences, with prices required to satisfy the logical induction criterion so that no single efficiently computable trader can extract unbounded profit off the resulting price sequence over time. That part is going into the show notes as required background instead.

  Could you draft eight to ten interview questions that push past that standard pitch? I'd like at least one question on each of the following three points, plus a follow-up for each keyed to the answer she's most likely to give: (1) the fact that the theorem's convergence and calibration guarantees are purely asymptotic, with nothing in the framework bounding how fast a logical inductor's prices actually settle down, so a real, time-limited reasoner has no assurance its credences at any given moment are worth anything; (2) the apparent arbitrariness of the setup itself -- which traders populate the market, how they're resourced, which deductive process is feeding in theorems -- and whether reasonable variation in those choices produces materially different "rational" price sequences, which seems to sit badly with any claim that logical induction identifies the credence rather than merely a coherent one; and (3) whether being unexploitable by traders is really a theory of justified mathematical belief at all, rather than a useful operational stand-in, given that every sentence being priced is, classically, either necessarily true or necessarily false. I'll admit I'm somewhat out of my depth with the original paper myself, so feel free to reorder or blend these into a natural conversational arc -- but I want each point pressed firmly enough that a well-rehearsed answer doesn't simply dispose of it.
