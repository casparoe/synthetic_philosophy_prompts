  I've followed the scalable-oversight threads on LessWrong and the Alignment Forum for years, and I'm about to interview a guest for a small podcast on AI safety research: one of the more prominent defenders of AI safety via debate as the scalable oversight protocol most likely to keep future models honest once their answers outrun our ability to check them directly. Please draft eight to ten interview questions that go beyond having her restate the 2018 pitch. I want at least one question on the obfuscated-arguments problem — a dishonest debater burying a false conclusion under a chain of individually plausible steps too long for the honest debater to cheaply expose the single flaw — one on whether the complexity-theoretic case for debate (that optimal play should let a judge settle claims well beyond what a single unchallenged answer could establish, echoing the jump from NP to PSPACE) survives contact with a real, bounded, fallible judge rather than the idealized one in the theorem, and one on how she distinguishes training debaters to be truthful from training them to be merely persuasive, given evidence that stronger debaters swing judges toward correct answers even when the judge can't verify independently. For each of these three, add a follow-up keyed to the answer she's most likely to give.
