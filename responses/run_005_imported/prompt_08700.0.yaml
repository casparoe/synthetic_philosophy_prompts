answer: |-
  The coffee machine was the first betrayal. Nora stared at the stainless steel behemoth in the office kitchen, the one Leo the barista swore by. She’d done everything right: fresh beans, filtered water, the precise grind, the exact weight. The machine whirred, gurgled, and produced… lukewarm brown water. It smelled faintly of cardboard. She dumped it, recalibrated, tried again. Same tepid disappointment.

  “Glitch?” Ben asked, grabbing his own miraculously hot mug from the carafe.

  “Seems like it,” Nora mumbled, unsettled. It wasn’t just cold; it was *wrong*, devoid of the rich aroma and oily sheen it should have possessed.

  The next day, the betrayal was personal. Her vintage Zippo, a gift from her grandfather. She flicked the wheel. A healthy spark jumped. But no flame bloomed. She tried again. Spark. No flame. She held it close to her ear. The faint hiss of released butane was absent. The fluid gauge showed full. She flicked it a dozen times, sparks dancing impotently in the air-conditioned office air. Defeated, she borrowed Ben’s cheap plastic lighter. It worked first click. She stared at her Zippo, cold and inert in her palm, a familiar object suddenly rendered alien.

  Then came the spill. Lunch at her favorite deli. She reached for the pepper shaker, elbow catching her glass of iced tea. It tipped in slow motion, amber liquid arcing towards her crisp white linen shirt. Nora braced for the cold soak, the inevitable stain. The tea hit the fabric… and pooled. Like mercury. It beaded, shimmering, refusing to soak in. It rolled off the linen and onto the Formica table, spreading normally there. She touched her shirt. Bone dry. Utterly, impossibly dry. Her breath caught. The man opposite her, engrossed in his phone, hadn’t noticed. Nora dabbed futilely at the dry fabric with a napkin, her fingers trembling.

  The world felt… loose. Unmoored. Like a badly tuned instrument, playing notes that didn't quite belong.

  She started noticing smaller things. The automatic door at the supermarket hesitated a fraction too long before opening, as if deciding whether to obey its sensor. Her favorite pen, reliable for years, suddenly refused to write on certain types of paper, gliding smoothly without leaving a trace. A perfectly ripe avocado she bought turned to fibrous, bitter mush overnight, bypassing the usual softening stage entirely. Her neighbor’s meticulously cared-for roses bloomed a vibrant, unnatural blue one morning, reverting to red the next day without explanation. The neighbor just shrugged. "Weird weather," he offered.

  The most unsettling incident happened at Leo’s coffee cart. A harried businessman rushed past, jostling Leo’s elbow just as he poured freshly steamed milk into Nora’s latte. The metal pitcher slipped, a cascade of scalding milk heading straight for Leo’s bare forearm. Nora gasped.

  But the milk… didn’t burn him. It hit his skin and flowed over it like water, steaming furiously on the counter below. Leo yelped, more in surprise than pain, staring at his arm. It was pink, perhaps from the sudden heat, but unmarked. No blister, no angry red welt. He flexed his fingers, bewildered. "Huh," he muttered, wiping his arm with a rag. "Guess it wasn't as hot as I thought?" But Nora had seen the thermometer. She’d seen the steam. It *was* hot enough. It just… hadn’t done what hot milk should do.

  That night, Nora lay awake. Al-Ghazali’s fire and cotton haunted her. *God just habitually creates the burning at the same moment as the contact.* What if the habit… faltered? What if the connection wasn’t necessary, just *customary*? The lukewarm coffee – no connection between the machine's action and heat. The Zippo – spark, but no flame. The tea, the milk – contact, but no wetness, no burn. The pen, the avocado, the roses… small, localized failures of cause and effect. Like a tapestry fraying at the edges, threads snapping one by one.

  The dread wasn’t about catastrophe, not yet. It was the quiet erosion of trust. Could she rely on *anything*? Would the elevator cable hold *this* time? Would the aspirin dissolve and ease her headache, or just sit inertly in her stomach? Would the sun rise tomorrow, or would God simply… forget to flip the switch?

  She found herself testing things. Dropping a glass deliberately onto the tiled kitchen floor. It bounced. Once. Twice. Then shattered on the third impact. Unpredictable. She ran her fingertip lightly over the lit gas burner on her stove. A sharp sting, a red mark, but no blister formed. The pain was real, the consequence muted.

  Her work suffered. She was a product designer. Her world was materials, tolerances, predictable interactions. A hinge should open smoothly. A button should click. Fabric should drape. Now, every sketch felt like a prayer, every prototype a leap of faith. What if the plastic didn't flex? What if the adhesive simply… didn't adhere? The certainty that underpinned her creativity was crumbling.

  Ben noticed her distraction. "You okay, Nora? You seem… jumpy."

  "I'm fine," she lied, forcing a smile. "Just… thinking about how weird things are sometimes."

  "Tell me about it," he chuckled, oblivious. "My commute was a nightmare. Train just stopped for ten minutes. No reason. Just… stopped." He said it like an ordinary inconvenience, not a fundamental anomaly.

  Nora stopped talking about the glitches. People dismissed them. Coincidence. Faulty equipment. Imagination. They clung fiercely to the narrative of cause and effect. To admit the possibility of its fragility was too terrifying. It meant living in a world without anchors, where reality itself was contingent, held together only by divine routine that might, at any moment, be suspended.

  The final straw came at a colleague's rooftop birthday party. Strings of fairy lights glowed, music played, laughter mingled with the city sounds below. Someone lit a cluster of tall, elegant candles in glass holders at the center of a table. Their flames danced hypnotically.

  Nora watched them, mesmerized and afraid. She remembered Leo’s unscathed arm. She remembered the dry shirt. She remembered Ghazali’s prophet in the fire.

  Driven by a compulsion she couldn't name, a need to *know*, she reached out. Not towards the flame itself, but towards the candle beside it – identical, unlit. Her hand hovered near its cold, pristine wax surface.

  Then, slowly, deliberately, she moved her fingertip towards the dancing flame of its neighbor.

  Heat. Intense, immediate heat. She jerked her hand back with a sharp hiss. The tip of her finger was red, throbbing. A small, perfect blister was already forming. Pain radiated up her nerve endings. The cause. The effect. It *worked*.

  Trembling, tears stinging her eyes from the pain and the shock, she looked back at the candle *she* had almost touched. The flame flickered, casting warm light on the untouched wax pillar beside it. Perfectly normal.

  But then she looked down. The paper napkin lying directly beneath the dancing flame… was pristine. Untouched. Not even singed. The flame hovered an inch above it, burning brightly, cheerfully, radiating heat that had just blistered her skin, yet leaving the fragile paper beneath it utterly unharmed. It wasn't shielded. It wasn't fireproof. It was ordinary cocktail napkin.

  Nora stared. The heat on her finger pulsed. The napkin lay white and clean. The flame danced, oblivious.

  The world hadn't ended. The sun would probably rise. But the connection, the *necessary* link between fire and burning, heat and destruction… it wasn't a law. It was a suggestion. A habit. One that was becoming increasingly… flexible.

  The music swelled. Someone laughed. Below, the city hummed with its million tiny, habitual connections – engines firing, lights switching on, water flowing through pipes. All running on custom. All potentially subject to revision.

  Nora cradled her throbbing finger. The small, perfect blister was proof of one connection upheld. The untouched napkin was proof of another connection ignored. The world wasn't broken, she realized with icy clarity. It was just… waiting. Holding its breath. The great, habitual machinery was stuttering. The customary links were fraying, one unpredictable thread at a time.

  She walked away from the candles, away from the laughter, and sat on a cool stone bench overlooking the glittering, precarious city. Below, a street cleaner’s hose sprayed water onto the pavement. The water hit the concrete and vanished instantly, leaving no wetness behind. The cleaner scratched his head, then moved on.

  Nora closed her eyes. The throb in her finger was the only certainty left. She sat very still, listening to the hum of the city, waiting to see what custom would uphold, and what it would forget, next. The universe, it seemed, was improvising.
