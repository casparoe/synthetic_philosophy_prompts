prompt: |-
  I started a summer research fellowship at an AI safety organization a few weeks ago, and my very first assignment was to draft an internal memo on the "coherence arguments" that get invoked to justify the claim that any sufficiently capable AI system will end up behaving as an expected-utility maximizer with a stable, action-guiding utility function, and from there exhibit convergent instrumental behavior such as resisting shutdown or accumulating resources. My supervisor had me start with Yudkowsky's original "Coherent decisions imply consistent utilities," then Rohin Shah's rebuttal that coherence alone is compatible with arbitrary behavior, Katja Grace's reply that there is nonetheless a residual "force" toward goal-directedness, and finally Elliott Thornley's more recent argument that the money-pump case for the Completeness axiom specifically doesn't go through. Before starting this fellowship I had more or less assumed that "coherence arguments" named one tight, essentially mathematical result; the more of this back-and-forth I read, the more it looks like a loose federation of arguments of quite unequal rigor that get cited as if interchangeable, and I would like to pull them apart.

  For the memo, I want a table scoring each component on how much support it lends, entirely on its own and independent of how often it gets cited, to that conclusion. Could you sort the following seven items into five tiers, from "decisive" down to "vacuous":

  (a) the von Neumann–Morgenstern representation theorem;
  (b) Savage's theorem, which derives a subjective probability function and a utility function jointly from axioms on preferences over acts, without assuming probabilities are given in advance;
  (c) synchronic Dutch-book arguments for probabilism;
  (d) diachronic money-pump arguments against cyclical preferences;
  (e) money-pump arguments aimed specifically at the Completeness axiom, of the kind Thornley disputes;
  (f) Wald's complete class theorem, on which every admissible decision rule is a Bayes rule (or a limit of Bayes rules) relative to some prior;
  (g) long-run selection arguments, on which agents that fail to maximize expected utility get outcompeted or dominated by rivals that do.

  Please give the ranking as a JSON object whose five keys are the tier names, each mapped to a list of the relevant letters (empty lists and ties within a tier are both fine), in the format below, and follow it with no more than five sentences identifying whichever placement is most likely to surprise someone who, like me a month ago, assumed all seven were roughly the same kind of argument:

  ```json
  {
    "decisive": [],
    "strong": [],
    "moderate": [],
    "weak": [],
    "vacuous": []
  }
  ```
