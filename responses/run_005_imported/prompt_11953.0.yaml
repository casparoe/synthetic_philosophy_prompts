   - (b) Savage's theorem: This is a very strong result because it derives both probability and utility from preferences over acts. It is often considered the gold standard for subjective expected utility. This is probably the closest to decisive for the representation, but note: it assumes that the agent's preferences satisfy the axioms. There is no guarantee that an AI would have such preferences.

