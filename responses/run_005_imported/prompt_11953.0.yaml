  We are ranking seven items (a through g) into five tiers: decisive, strong, moderate, weak, vacuous.
   The goal is to evaluate how much support each provides, on its own, for the claim that any sufficiently capable AI system will end up behaving as an expected-utility maximizer with a stable utility function, and then exhibit convergent instrumental behaviors.

   Let's briefly recall each:

   (a) von Neumann–Morgenstern (vNM) representation theorem:
       Assumes a set of axioms (completeness, transitivity, continuity, independence) over lotteries and shows that preferences can be represented by maximizing expected utility with a unique utility function (up to affine transformations). 
       However, it assumes that probabilities are given (i.e., objective probabilities). So it doesn't derive probabilities from scratch.

   (b) Savage's theorem:
       Derives both a subjective probability measure and a utility function from preferences over acts, under certain axioms (including completeness, transitivity, sure-thing principle, etc.). 
       This is a foundational result for subjective expected utility.

   (c) Synchronic Dutch-book arguments for probabilism:
       Shows that if an agent's degrees of belief are not probabilistic, then there exists a set of bets (a "Dutch book") that the agent would accept individually but that collectively lead to a sure loss. 
       This is about coherence of beliefs at a single time.

   (d) Diachronic money-pump arguments against cyclical preferences:
       If an agent has cyclical preferences (A>B, B>C, C>A), then the agent can be "pumped" for money by a series of trades that lead back to the original state but with less money. 
       This is about dynamic consistency and avoiding being exploited over time.

   (e) Money-pump arguments aimed specifically at the Completeness axiom (which Thornley disputes):
       Completeness requires that for any two options, the agent either prefers one to the other or is indifferent. 
       Thornley argues that incompleteness does not necessarily lead to being money-pumped because an agent can avoid trades that are not beneficial.

   (f) Wald's complete class theorem:
       In statistical decision theory, it states that every admissible decision rule is either a Bayes rule (with respect to some prior) or a limit of Bayes rules. 
       Admissible rules are those not dominated by any other rule (i.e., no other rule is at least as good in all states and strictly better in some). 
       This suggests that optimal behavior must be Bayesian in a broad sense.

   (g) Long-run selection arguments:
       Argue that agents that fail to maximize expected utility will be outcompeted by those that do, in evolutionary or market settings. 
       This is a pragmatic argument, not about individual coherence.

