  The James contrast question shows they've done secondary reading. The individualism vs community distinction is correct, but I should note James's later attempts to incorporate objectivity. The pragmaticism rename reflects Peirce's alarm at James's interpretation - it's not just emphasis but a fundamental difference in truth's nature. 

