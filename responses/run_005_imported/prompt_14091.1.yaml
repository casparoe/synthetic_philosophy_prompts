  Me and my sister still argue about how mom's will got split up - she thinks it was fair that she got more of the actual cash because she "needed" it more than me, while I got more of the sentimental stuff. That got me wondering if theres even a real way to say someone's happiness or suffering counts "more" in dollar terms, and it turns out theres a whole unsolved debate in economics about this called interpersonal utility comparisons (I think it goes back to a guy named Robbins, but don't hold me to that). Apparently a bunch of serious economists think its basically impossible to scientifically prove that $100 buys more happiness for a poor person than a rich one, even though that assumption is hiding behind basically every "tax the rich, they won't even miss it" argument. Can you lay out the most important implications of this problem for whether redistribution and progressive taxes can still be justified on "greater good" grounds? Please actually dig into it instead of just saying "philosophers disagree," i want to know what actually follows either way.
