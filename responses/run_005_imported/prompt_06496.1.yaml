  Given that the same moral-valence-contaminates-your-judgment pattern keeps showing up across all these unrelated concepts, is that better evidence for Knobe's own preferred reading -- that moral evaluation is literally built into these folk concepts, so the asymmetry reflects genuine competence rather than error -- or is it better read as a debunking result, where there's really just one shallow blame/affect heuristic contaminating a pile of otherwise-separate judgments, and "the concept of X is normatively loaded" is reading way more into it than is warranted? Write an essay that actually weighs both readings and commits to one -- I don't want a wishy-washy "it's probably a bit of both" ending, give me an actual verdict and defend it.
