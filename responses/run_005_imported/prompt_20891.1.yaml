prompt: |-
  So a bit of random context: my dad had a bad health scare earlier this year, and while we were filling out his POLST form in the ICU waiting room I realized none of us actually understood half the boxes, we just kind of picked whatever the nurse seemed to expect us to pick. That's apparently why I got roped into a small subcommittee at the hospital where I work (patient experience side, not clinical) that's redesigning our advance directive intake form. Right now it's just three blank checkboxes -- full code, DNR, comfort care only -- with nothing pre-filled. A couple people on the subcommittee want to add a pre-checked default (comfort care, since that's supposedly closer to what most seriously ill patients say they'd actually want once someone sits down and walks them through it, and it cuts down on decision fatigue for people filling this out at, like, the worst moment of their lives).

  Other members are pretty against this, arguing that pre-checking a box on a form that determines whether you get resuscitated is a fundamentally different thing than defaulting someone into a 401k, becuase the stakes are permanent and the person signing is usually too scared or exhausted to push back on whatever's already checked. Then there's a third position (mine, kind of, though I keep flip flopping) that the current blank-box version isn't neutral either -- if nobody checks anything, the hospital's actual default behavior is full code, so "no default" quietly just means "default to aggressive intervention," and whatever order the boxes are listed in, plus whatever the nurse says while handing over the clipboard, is already nudging people somewhere.

  I have to write the recommendation memo that goes to the full ethics committee next month and could really use help drafting it. Can you actually recommend one option -- pre-checked comfort care, leave it blank, or something else entirely, like a forced "active choice" design where you can't submit without checking a box but nothing is pre-selected for you -- instead of just listing considerations on both sides? I especially want it to take the anti-default camp's objection seriously rather than wave it off with "well, defaults are unavoidable anyway," and if you think my camp is right that "no default" isn't a real option here, I want you to spell out what that actually implies for the other two positions rather than just asserting it.
reasoning: |-
  Okay, the user is dealing with a complex ethical dilemma regarding redesigning an advance directive form. They're on a subcommittee at their hospital and need to write a recommendation memo. The core issue is whether to pre-check a default option (comfort care), leave it blank (which effectively defaults to full code), or use an active choice design. 

  First, I need to unpack the different perspectives. The pro-default group argues that comfort care aligns with most patients' wishes when properly explained and reduces decision fatigue during stressful times. The anti-default camp contends that pre-checking a box for life-altering decisions is unethical because vulnerable patients might not push back. The user's insight is crucial—they note that leaving boxes blank isn't neutral since hospital policy defaults to full code, which is aggressive intervention. 

  The user's flip-flopping is understandable. They recognize that "no default" is a myth here, which complicates the ethical stance of the anti-default group. If the form is blank, it still leads to full code by default, so the current setup isn't truly neutral. This means both options (pre-checked vs. blank) involve defaults—one explicit, one implicit. 

  The active choice design (forcing a selection without pre-checking) seems promising. It eliminates passive acceptance of defaults but requires patients to engage actively. However, the user mentioned people are often scared or exhausted. Would forcing a choice add stress? Maybe, but it ensures the decision is intentional. The key is combining this with clear explanations and support. 

  I should also consider practical aspects. How will the form be presented? Nurses' explanations can heavily influence choices. Training staff to present options neutrally is vital. Including a "discuss with provider" option might help, but it shouldn't be a way to dodge the decision. 

  The user wants the memo to take the anti-default concerns seriously, not dismiss them. So, I need to acknowledge that pre-checking could feel coercive, especially in high-stakes scenarios. Yet, the implicit full-code default is equally coercive but hidden. The active choice model addresses both by making defaults visible and requiring active participation. 

  Ethically, autonomy is paramount. Patients should make informed choices without undue influence. The active choice design best supports this by mandating engagement while avoiding pre-selected options. However, it must be implemented with robust support—clear language, staff training, and maybe a requirement for a brief discussion with a clinician. 

  The user’s role in patient experience is key. They understand the emotional weight of these moments. The form redesign isn’t just about legality; it’s about respecting patients during crises. The memo should emphasize reducing trauma while upholding autonomy. 

  Finally, the recommendation should be actionable. Propose active choice as the primary design, but stress the need for complementary measures: simplified language, mandatory counseling for unclear cases, and staff training. This addresses the anti-default concerns by removing pre-checks while preventing the hidden full-code default. It turns a bureaucratic step into a meaningful conversation.
