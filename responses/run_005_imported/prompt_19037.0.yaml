answer: |-
  Here is a eulogy draft designed for both audiences, honoring your mother's complexity and specific instructions, running approximately 7 minutes:

  ***

  Good morning. For those who don’t know me, I’m [Your Name], [Mother's Name]’s son/daughter. And novelist or not, finding words today feels… inadequate. But Mom loved precision, so I’ll try to be precise.

  If you visited her study, you’d likely see it. Not just law books – though there were plenty – but a particular book, a blue leather-bound French edition of Blaise Pascal’s *Pensées*. It wasn’t decorative. It was *worked*. The spine so creased, so softened by her hands over decades, that whole sections have gently pulled free. She carried that book with her, intellectually, for most of her adult life. And she carried one fragment from it, especially, into our family dinners.

  If one of us kids, or Dad, or a cousin, ever complained about a law being unfair, or a court decision seeming wrong, she’d pause. Then, with that familiar, slightly challenging look, she’d offer Pascal’s words in French, and then in English: **“Justice without force is powerless; force without justice is tyrannical.”** It wasn’t a throwaway line. It wasn’t cynicism. For Mom, this was a profound truth about the human condition.

  She saw it not as a depressing reality of her job as a judge, but as something deeper, almost theological. She believed we humans, in our current state, simply aren’t equipped to perceive True Justice – capital ‘J’ Justice – directly. What we *call* law, she understood, is fundamentally something else: it’s custom. It’s tradition. It’s the accumulated agreements and compromises of a society. And crucially, it’s custom *backed by force* – the power of the state to enforce rulings. And then, we dress that system up *after the fact*, we call it “justice,” because the alternative… well, the alternative terrified her. The alternative is each of us, armed with our own private, absolute sense of what’s right, enforcing our own verdicts on everyone else. Chaos. Endless conflict. She saw the system we have – flawed, human, force-backed custom – not as a scandal, but as a profound *mercy*. A necessary shield against that chaos.

  She loved another fragment nearby in that worn book, where Pascal observes that whether killing someone is called murder or heroism depends on nothing grander than which side of a river they lived on. For Mom, this wasn’t just historical curiosity; it was more evidence. Proof positive that the lines we draw – the lines *she* drew, ruling by ruling – weren’t discovered like eternal mathematical truths. They were drawn by custom, by history, by the messy reality of human communities trying to live together. Reason was vital, essential even, but it operated *within* those boundaries.

  Now, you might think: *If she believed that, how could she possibly care so much about being a judge?* If it’s all just custom and force, why agonize? Why be, as her colleagues and clerks here know, almost *pathologically* scrupulous? Why spend nights buried in briefs, wrestling with facts, refining arguments, demanding absolute clarity?

  Because for Mom, understanding the *nature* of the system didn’t absolve her from her duty *within* it. In fact, it intensified it. Knowing the line wasn't divinely ordained didn't mean it could be drawn carelessly. Knowing that a ruling was an act of necessary force, dressed as justice, demanded *integrity* in applying the custom – the law – as fairly, as consistently, as humanly possible in each unique case. She drew a hard, visible line on the bench – one her colleagues saw clearly. She despised rulings that pretended to be something they weren't. She had deep contempt – a contempt she usually rationed carefully – for any opinion that puffed itself up as a grand moral triumph, that pretended it was revealing capital-J Justice rather than simply applying the law, clearly and honestly, to settle a dispute. **Settling** the case, getting it *right* according to the system we have – that was the job. That was the integrity. Pretending it was more? That was vanity, or worse, a dangerous delusion.

  Her dedication wasn't fueled by a belief in some perfectible, ultimate Justice waiting to be found. It was fueled by respect for the fragile, necessary *mercy* of the system itself, and by a fierce commitment to the individuals caught within its machinery. *This* person, *this* dispute, *this* set of facts – they deserved her absolute focus, her rigorous mind, her relentless pursuit of the fairest outcome *possible* within the human framework we inhabit. Getting it "right" meant upholding the custom faithfully, applying the force judiciously, and never, ever pretending the robe made her a priestess of a higher truth she knew we couldn't reliably see.

  Mom left nothing to chance, not even this moment. Clipped inside that battered Pléiade edition of Pascal, the book that travelled with her through so much thinking and judging and living, she left a note. She asked that it be read here. It’s brief, and it’s pure her: direct, uncompromising, cutting through any potential fog. She wrote:

  **“Do not let anyone stand up and say I believed in Justice. I did not. And do not let anyone conclude, therefore, that I believed in nothing.”**

  Believing in *nothing*? Impossible for her. She believed fiercely in intellectual honesty. She believed in the hard, unglamorous work of getting the details right. She believed in the necessity of the system, however flawed, as a bulwark against chaos. She believed in the profound responsibility that comes with wielding its force. She believed in the warmth of family, in the rigor of a good argument, in the beauty of the French language, in the challenge of Pascal, and in the quiet satisfaction of a case well-settled, without pretense.

  She believed in *us*. In her family, in her friends, in her colleagues, in the clerks she mentored, in the principle that even if we can't grasp perfect Justice, we owe each other our utmost care, our clearest thought, and our unwavering effort within the merciful, messy, human project we share.

  We will miss her clarity. We will miss her challenge. We will miss her warmth. We will miss the woman who held a complex, demanding view of the world and yet lived within it with such integrity, such care, and such love. Thank you.

  ***

  **Why this works:**

  1.  **Honors the Note Explicitly:** The note is read verbatim, given prominence, and its meaning is unpacked *before* it's read, setting the stage so its bluntness lands with full force and clarity for both audiences.
  2.  **Explains Pascal Accessibly:** The key fragments are presented clearly, in context, focusing on *why* they mattered to *her* and what they revealed about her *character* (intellectually fearless, challenging, precise). The "river" example naturally follows the "justice/force" quote, reinforcing the point without jargon.
  3.  **Resolves the Central Tension:** The paragraph beginning "Now, you might think..." directly addresses the apparent contradiction. It explains *how* her view of law's nature *intensified* her dedication to the individual case. The distinction between "settling" (honorable) and "moral triumph" (contemptible) is crucial here, showing her integrity lay in *honesty* about the system's limits.
  4.  **Balances Audiences:**
      *   **For Family:** Focuses on concrete details (the worn book, the dinner table habit, her warmth, her demanding nature, her love of family/friends/French). Uses accessible language ("messy reality," "fragile, necessary mercy," "bulwark against chaos"). The philosophy is framed as part of *who she was* – exacting, honest, principled, warm.
      *   **For Colleagues/Clerks:** Uses precise terms ("capital-J Justice," "system," "custom backed by force," "applying the law... to settle a dispute," "contempt for... grand moral triumph"). Captures the nuance of her view without simplification ("not cynicism," "theological claim," "necessary mercy," "integrity in applying the custom"). They will recognize her intellectual rigor and judicial temperament in the description.
  5.  **Portrait of the Woman:** The details (worn book, dinner table debates, note in the book, contempt for pretense, belief in family/intellect) build a specific picture: exacting, warm, intellectually fearless, honest, principled, loving.
  6.  **Tone:** Respectful, warm, clear, and appropriately direct/challenging when reflecting her own nature. Avoids sentimentality while conveying deep affection and admiration.
  7.  **Structure:** Flows logically: Personal intro -> Concrete symbol (the book) -> Her key philosophy (explained accessibly) -> The apparent tension -> The resolution (her integrity within the system) -> Her explicit instruction (the note) -> Affirmation of what she *did* believe in -> Emotional conclusion.

  This draft aims to give your mother's complex, profound, and fiercely honest worldview the precise and respectful articulation it deserves, ensuring both halves of the room understand and remember her as she truly was.
