prompt: |-
  I spent almost forty years doing weather and climate modelling before retiring, and these days I do amateur probability forecasting for fun on sites like Metaculus, partly just to see if the calibration habits from decades of weather modelling carry over to stuff I know nothing about - elections, drug trial results, that sort of thing. Something's been bugging me though: on a bunch of my questions I already know today the exact date my credence is gonna jump close to 0 or 1 (the day the readout or report drops), I just dont know which way yet. A philosopher friend tells me this is basically what Van Fraassen's Reflection Principle is about. Could you walk me through the most important implications of that principle for how confident I should let myself be right now, given what I already know about my own future confidence? I'm also curious where philosophers think the principle runs into trouble - I vaguely recall something about memory loss or manipulation being carved out as exceptions - since that seems like it'd matter for how I actually revise my forecasts.
