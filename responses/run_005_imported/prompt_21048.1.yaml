answer: |-
  Your attempt to reconcile Sidgwick's dual commitments is insightful, but your "separate chapter" assumption likely underestimates the deep philosophical connection between his ethics and psychical research. Sidgwick himself saw them as fundamentally intertwined. Here's a breakdown of the connection and why his decades of "null results" are philosophically significant, not just a sentimental footnote:

  1.  **The "Dualism of Practical Reason" as the Driving Force:**
      *   Sidgwick's *Methods of Ethics* rigorously argued that while Utilitarianism (maximizing general happiness) was rationally defensible, so was Rational Egoism (maximizing one's own happiness). Reason alone could not prove that one *ought* to sacrifice one's own ultimate good for the greater good.
      *   This "dualism" presented a profound crisis for Sidgwick. He found the prospect of a fundamental contradiction at the heart of ethics deeply unsettling. He yearned for a rational harmony between duty and self-interest.
      *   **The Key Connection:** Sidgwick believed that **post-mortem survival and a system of divine justice** could potentially resolve this dualism. If personal survival meant one's *own* ultimate happiness was secured by acting morally (either through reward/punishment or the inherent satisfaction of virtue in an eternal context), then the demands of Utilitarianism and Egoism could be reconciled. The good of the individual and the good of the whole would align in the long run.

  2.  **Psychical Research as Philosophical Inquiry:**
      *   Sidgwick did *not* approach psychical research (SPR) as a credulous seeker of comfort, nor as a purely detached scientist. He approached it as a **philosopher seeking empirical evidence for a postulate he saw as potentially necessary for the coherence of ethics.**
      *   His involvement wasn't sentimental escapism; it was an extension of his philosophical rigor. If survival was a potential solution to the dualism, then it was philosophically *obligatory* to investigate whether there was any evidence for it. To ignore the question would be intellectually dishonest.
      *   As SPR President, he championed extreme methodological rigor, applying the same critical scrutiny to claims of the paranormal that he applied to ethical arguments. He actively sought out frauds and devised tests to expose them. This wasn't a hobby; it was a demanding philosophical project using empirical tools.

  3.  **The Significance of "Null Results":**
      *   Sidgwick's decades of finding "no adequate evidence" were deeply disappointing *to him personally*, precisely because of his philosophical hope. He confessed this disappointment privately.
      *   **Philosophically, however, this negative result was profoundly consequential:**
          *   **It reinforced the Dualism:** The failure to find evidence for survival meant the Dualism of Practical Reason remained unresolved *by empirical means*. Sidgwick had to confront the possibility that reason alone could not harmonize duty and self-interest. His ethical system had to stand without that hoped-for cosmic support.
          *   **It Demonstrated Intellectual Integrity:** Sidgwick's persistence, despite personal disappointment, and his unwavering commitment to rigorous testing *even when it dashed his hopes*, is a testament to his philosophical character. He prioritized truth-seeking over wish-fulfillment. This *is* the essence of his scrupulous reputation manifest in a different domain.
          *   **It Highlighted the Human Need:** The very intensity of his search, driven by the ethical dualism, underscores the profound human yearning for cosmic justice and meaning that his philosophy exposed but couldn't satisfy through pure reason. His psychical research was, in part, an acknowledgment of the *existential weight* carried by his purely rational ethical conclusions.

  **Why your "separate chapter" view is incomplete:**

  *   **Motivation:** The psychical research wasn't a private, sentimental sideline; it was *motivated* by a core, unresolved problem in his *magnum opus*, *The Methods of Ethics*.
  *   **Method:** The rigor he applied to SPR was the *same rigor* he applied to ethics – meticulous, self-critical, demanding of evidence. It *was* part of his intellectual character.
  *   **Consequence:** The negative results *did* bear on his philosophy by confirming the intractability of the dualism through empirical means. It forced him to live with the unresolved tension his ethics identified.

  **A Fairer Understanding for Your Aunt (and Yourself):**

  You can explain Sidgwick's involvement in psychical research not as a lapse in judgment or a sentimental indulgence, but as:

  1.  **A Deeply Philosophical Quest:** Driven by a specific, profound problem within his ethical system (the Dualism of Practical Reason), he sought empirical evidence for something (survival/divine justice) that *might* resolve it.
  2.  **A Testament to Rigor:** He applied the same relentless scrutiny and demand for evidence to this quest as he did to his ethics. His decades of involvement, ending in disappointment, demonstrate his commitment to following the evidence *wherever it led*, even against his hopes.
  3.  **A Human Response to a Philosophical Abyss:** His search reflects the human difficulty of accepting that the deepest moral questions might have no satisfying cosmic resolution. The comfort your family found mirrors, on a personal level, the kind of hope that drove the most scrupulous philosopher of his age to spend 20 years looking for proof.

  **Conclusion:** Sidgwick's psychical research was not a separate, inconsequential chapter. It was an integral, if ultimately unsuccessful, extension of his core philosophical project. It stemmed directly from the "Dualism of Practical Reason," was conducted with his characteristic scrupulousness, and its negative outcome reinforced the profound and unresolved tension at the heart of his ethics. Understanding this connection doesn't validate the medium's claims, but it does show why Sidgwick, the epitome of rational ethics, felt compelled to search. It highlights both the power of his intellect and the depth of the human longing for meaning and justice that even his rigorous philosophy could not fully dispel. This perspective allows you to acknowledge the comfort your family found while honoring Sidgwick's own commitment to truth based on evidence.
