  Next, why is this a problem? The AI might spot early biomarkers predicting the disease before symptoms worsen. But if the reporter just simulates the doctor's current diagnosis, it misses the true prediction. When the disease manifests later, the reporter was wrong, but it's too late. This shows the core issue: identical outputs during training but divergence in critical unseen cases.

  Now, addressing the bonus points. Why not more data? Even with more examples, the AI's knowledge on unobservable factors (like future outcomes) isn't verifiable by humans. Clarifying questions? The reporter can't ask because it's trained to answer based on the predictor's state, not interact. Also, humans can't answer what they don't know. Transparency tools might show correlations but not causation, leading to false assurances.

