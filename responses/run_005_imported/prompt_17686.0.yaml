answer: |-
  Here's a breakdown of the technical disagreement between Blackburn and Gibbard on the Frege-Geach problem, specifically focusing on the conditional "If lying is wrong, then getting your little brother to lie is wrong," and why it might fuel a decades-long argument between your expressivist philosophers:

  **Core Expressivist Commitment (Shared by Both):**
  *   Moral sentences primarily express non-cognitive *attitudes* (approval, disapproval, plans, commitments) rather than reporting objective facts or beliefs.
  *   "Lying is wrong" expresses a negative attitude (disapproval, planning not to lie) towards lying.
  *   **The Problem:** How can this attitude-expressing function be maintained when the moral sentence ("lying is wrong") appears *embedded* within a complex sentence like a conditional, disjunction, or negation? Crucially, in the conditional, one is *not* asserting "lying is wrong" but considering its *implication*.

  **The Target Sentence:**
  *   "If lying is wrong, then getting your little brother to lie is wrong." (Accepting this *without* asserting lying is wrong).

  **1. Simon Blackburn's Quasi-Realism:**
  *   **Core Strategy:** "Saving the appearances" of realism (truth-aptness, logic, objectivity) *within* an expressivist framework. He aims to show how moral discourse *mimics* realist discourse using higher-order attitudes.
  *   **Analysis of the Conditional:**
      *   Accepting the conditional expresses a *higher-order attitude*.
      *   Specifically, it expresses *disapproval of a certain combination of first-order attitudes*.
      *   **What's happening:** By accepting "If lying is wrong, then getting your little brother to lie is wrong," the speaker is expressing *disapproval of* (or *being for* rejecting) the combination of:
          *   *Having the attitude of disapproval towards lying* **AND**
          *   *Not having the attitude of disapproval towards getting your little brother to lie*.
      *   **In essence:** It's saying, "Boo to disapproving of lying but *not* disapproving of getting your little brother to lie!" It's a commitment to a certain *coherence* in one's attitudes. If you condemn lying, you *must* (on pain of incoherence you yourself disapprove of) also condemn getting your brother to lie.
  *   **Explaining Modus Ponens Validity:**
      *   Suppose you accept the conditional (expressing disapproval of the combination [Disapprove(Lying) & ~Disapprove(Get Brother to Lie)]).
      *   Suppose you *also* accept the antecedent "Lying is wrong" (expressing Disapprove(Lying)).
      *   If you then *fail* to accept the consequent "Getting your brother to lie is wrong" (i.e., you *lack* Disapprove(Get Brother to Lie)), you find yourself precisely in the *combination of attitudes* that your acceptance of the conditional expressed disapproval of: [Disapprove(Lying) & ~Disapprove(Get Brother to Lie)].
      *   **Validity Source:** The validity of modus ponens flows from the *internal practical inconsistency* or *incoherence* one falls into by violating the higher-order attitude expressed by the conditional while holding the attitude expressed by the antecedent. It's a constraint on *having coherent commitments*. Logic is grounded in the *psychology of commitment management*.

  **2. Allan Gibbard's Norm-Expressivism (with Hyperplans):**
  *   **Core Strategy:** Moral judgments express *acceptance of norms* that govern feelings of guilt and anger. His later "hyperplan" framework refines this to model *complete contingency plans* for action and feeling, providing precise truth conditions *for the expressivist*.
  *   **Analysis of the Conditional (Hyperplan Version):**
      *   Moral judgments express the *state of having a hyperplan* that specifies what to do and what to feel (guilt/anger) in all conceivable circumstances. A hyperplan is a maximally detailed set of contingency plans.
      *   "Lying is wrong" expresses that one's hyperplan *calls for feeling guilt if one lies* (and perhaps anger at others who lie).
      *   **What's happening:** Accepting the conditional "If lying is wrong, then getting your little brother to lie is wrong" expresses that one's hyperplan has a specific *structure*:
          *   **If** the hyperplan *calls for feeling guilt if one lies* (i.e., assigns "lying is wrong" a "truth" in the planning sense), **then** the hyperplan *also calls for feeling guilt if one gets one's little brother to lie* (i.e., assigns "getting your brother to lie is wrong" a "truth" in the planning sense).
      *   **In essence:** It's a commitment within one's *overall plan for living and feeling* that the plan's assignment of "wrong" to lying *entails* its assignment of "wrong" to getting one's brother to lie. It's a constraint on the *content* of the hyperplan itself.
  *   **Explaining Modus Ponens Validity:**
      *   Suppose you accept the conditional (your hyperplan is structured such that if it calls for guilt for lying, it calls for guilt for getting brother to lie).
      *   Suppose you accept "Lying is wrong" (your hyperplan *does* call for guilt if you lie).
      *   Given the *structure* of the hyperplan (established by accepting the conditional), it *must* also call for guilt if you get your brother to lie. To deny "Getting your brother to lie is wrong" would be to deny a consequence *built into the very plan you currently hold*.
      *   **Validity Source:** The validity of modus ponens flows from the *logical structure inherent in the content of the hyperplan*. The conditional expresses a *plan-structural commitment*, and modus ponens tracks the *necessary consequences* of that structure combined with the plan's assignment to the antecedent. Logic is grounded in the *logic of planning content*.

  **The Argument at the Bar: Where They Disagree**

  *   **Character A (Blackburn Fan):** "Gibbard, your hyperplans are a step too far! You've smuggled in a full-blown *propositional content* for moral judgments via the back door of these idealized, all-encompassing plans. You're practically a closet realist! The beauty of Simon's approach is its elegant minimalism: logic emerges *naturally* from the practical demands of holding coherent higher-order attitudes. We don't need your hyper-complicated hyperplans to explain why modus ponens works; it works because inconsistency in attitudes is a *practical* failing we naturally avoid. Your account loses the core expressivist insight by reifying attitudes into quasi-propositions."
  *   **Character B (Gibbard Fan):** "Nonsense, Blackburnian! Your 'higher-order booing' is hand-waving. *How* exactly does this 'disapproval of combinations' genuinely underwrite *logical* validity? It feels psychological, not logical. My hyperplans *model* the commitment structure inherent in normative judgment *without* positing objective truths. They provide a precise, formal semantics for expressivism, showing *exactly* how the content of a conditional constrains the rest of the plan. Logic *is* the structure of rational planning! Your account risks making logic look like mere aversion to messy feelings, while mine grounds it in the necessary structure of practical reasoning itself. Your quasi-realism succeeds only by *mimicking* realism without the substance; my norm-expressivism *builds* a substantive, logic-supporting structure out of planning states."

  **Assessment: Do They Founder on the Same Rock?**

  *   **The Rock:** The core challenge is explaining the *necessary*, *truth-preserving* nature of logical inference (like modus ponens) using *only* the resources of non-cognitive attitudes/plans. Realists ground necessity in truth/reference; expressivists must ground it elsewhere.
  *   **Blackburn's Boulder:** His account arguably struggles to fully capture the *objectivity* and *normative force* of logic. Is the "incoherence" he identifies merely a *psychological* discomfort, or is it a genuine *logical* error? Critics (like Bob Hale) argued that Blackburn reduces logic to a "logic of attitudes" that lacks the necessary normative grip – why *should* I avoid that incoherence? He works hard to answer this (appealing to the functional role of logic in discourse), but the worry persists that it's not quite "logical necessity" as traditionally understood.
  *   **Gibbard's Boulder:** Hyperplans *do* provide a more robust structure resembling propositional content. The criticism from the Blackburnian side is that this structure is *too* robust, effectively replicating the truth-conditional semantics expressivism sought to avoid. Is a hyperplan really just a set of beliefs about what's wrong/right, dressed in planning language? Does Gibbard's appeal to the "logic of planning" successfully avoid collapsing into a kind of realism about normative facts encoded in the plan?
  *   **Dressed Differently?** Ultimately, **yes, they arguably founder on variations of the same core difficulty:** grounding genuine logical necessity and normativity solely in non-cognitive states. Blackburn tries to derive it from the practical demands of attitude coherence; Gibbard tries to build it into the content of idealized plans. Both face persistent challenges in showing this foundation is sufficiently robust to capture the compelling, objective-seeming "must" of logical consequence without smuggling in realist assumptions.
  *   **Who Gives a More Satisfying Explanation of Modus Ponens?** This is highly debatable and fuels the novel's conflict!
      *   **Gibbard's Advantage:** His account provides a clearer *formal structure* resembling traditional logic. The validity of modus ponens within the hyperplan framework looks more straightforwardly analogous to its validity in propositional logic. The "necessity" feels more explicit in the plan's structural constraints.
      *   **Blackburn's Advantage:** He stays closer to the core expressivist intuition. His explanation feels more directly tied to the *function* of moral language as expressing and managing commitments, without positing complex entities like hyperplans. The validity emerges from the *use* of language in expressing commitments, not from modeling content.

  **Conclusion for Your Scene:**

  The fundamental disagreement is about the *resources needed* to solve Frege-Geach and ground logic within expressivism. Your Blackburnian character believes Gibbard betrays expressivism by building overly propositional structures (hyperplans) that mimic realism. Your Gibbardian character believes Blackburn offers only a vague, psychologically-based account that fails to genuinely capture logical necessity and requires the very structures Gibbard provides. Both claim to solve the problem, but each sees the other's solution as either insufficiently robust (Blackburn) or insufficiently expressivist (Gibbard). The "rock" is the difficulty of deriving objective-seeming logic from subjective attitudes, but they attack it with very different tools (higher-order booing vs. idealized planning structures), leading to a deep, principled, and enduring philosophical rift perfect for your novel. The bar argument could vividly contrast the "practical incoherence" vs. "plan-structural necessity" explanations for why modus ponens *must* hold, with each philosopher passionately defending their account as the only genuine expressivist solution.
