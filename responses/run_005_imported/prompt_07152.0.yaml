  A while back I came across an online discussion of free will claiming that Locke basically anticipated "Frankfurt cases" almost 300 years early, in the chapter on power in his Essay Concerning Human Understanding. I found the passage it must have been referring to, and I'm having trouble parsing it:

  "Suppose a man be carried, whilst fast asleep, into a room where is a person he longs to see and speak with; and be there locked fast in, beyond his power to get out: he awakes, and is glad to find himself in so desirable company, which he stays willingly in, i.e. prefers his stay to going away. I ask, is not this stay voluntary? I think nobody will doubt it: and yet, being locked fast in, it is evident he is not at liberty not to stay, he has not freedom to be gone. So that liberty is not an idea belonging to volition, or preferring; but to the person having the power of doing, or forbearing to do, according as the mind shall choose or direct."

  I can follow the sentences one at a time, but I don't understand how "voluntary" and "at liberty" are supposed to come apart here -- to me those sound like two words for the same thing. Could you walk me through exactly what distinction Locke is drawing, and why he needs it for the larger argument he's building in that chapter? I'd also like to know whether the forum comment had a point: does this passage really anticipate Frankfurt-style arguments about moral responsibility, or is Locke using a similar setup to make a different point entirely?
