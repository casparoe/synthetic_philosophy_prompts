  (3) **Does Harsanyi’s theorem leave room for Diamond?** Alex insists the axioms force indifference; any preference violates Pareto (if both individuals are truly indifferent). Morgan might question whether "social rationality" should mirror individual rationality—maybe collectives care about things (procedural justice) that individuals don’t. 

