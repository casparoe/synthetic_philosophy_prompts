prompt: |-
  Over the past year, my job has shifted from general machine-learning work to a small causal-inference team, where much of my week now involves building structural causal models and using do-calculus to estimate treatment effects from observational data. At a recent journal club, a colleague who did a philosophy PhD before moving into industry mentioned, almost in passing, that everything our team does is essentially an implementation of Woodward's "interventionist" theory of causation, and that this is a genuine rival to the older theory of causation I dimly remember from an undergraduate philosophy elective — the one on which causation is analyzed as counterfactual dependence, cashed out via similarity among possible worlds (Lewis's theory, I believe). When I asked her whether the two views actually disagree about anything substantive, or whether interventionism is really just a formal, graph-friendly restatement of the same underlying idea, she said that question was exactly what divides people in the literature, and then had to dash off before saying anything more. It has been nagging at me ever since.

  I would like your help thinking this through, in the form of a dialogue between two philosophers, each a fully convinced and technically sophisticated defender of one of these views: one a committed Lewisian counterfactual theorist, the other a committed Woodwardian interventionist. Rather than trading slogans, I would like them to work through a concrete case together: suppose two independent sensors are both monitoring the same faulty fuse, each wired to trip a circuit breaker the instant it detects an overload; sensor A detects the overload and trips the breaker a few milliseconds before sensor B's own signal arrives, so that B's signal reaches an already-tripped breaker and accomplishes nothing. I want the two characters to argue about whether, and in virtue of what, A's detection counts as a cause of the breaker's tripping, given that the breaker would have tripped at essentially the same instant even without A, purely courtesy of B. Beyond that case, I would also like the Lewisian to press the interventionist on whether defining causation in terms of "interventions" is viciously circular, since an intervention is itself specified in causal terms — and I would like the interventionist to get a genuine opportunity to answer that charge, perhaps by turning it back on the Lewisian's similarity metric, which some critics say is reverse-engineered to fit our causal intuitions rather than independently motivated. Please do not let either side win by default or concede a point just to move things along; I want to see exactly where the disagreement bites once the terminology is stripped away, rather than a mere restatement of each theory's slogans.
reasoning: |-
  We are creating a dialogue between two philosophers: Lewis (defending the counterfactual theory) and Woodward (defending the interventionist theory). The setting is a discussion about a specific case and then moving to the theoretical circularity charge.

  Case: Two sensors (A and B) are monitoring a faulty fuse. Sensor A detects the overload and trips the breaker a few milliseconds before sensor B's signal would have tripped it. But because A acted first, B's signal arrives to an already-tripped breaker and does nothing. The breaker trips at time t because of A. However, if A had not acted, then B would have tripped the breaker at t+ε (a very small time later). So, the breaker would have tripped anyway.

  Question: Is A a cause of the breaker tripping?

  We also want to address the circularity charge: Lewis charges that interventionism defines causation in terms of interventions, which are causal, hence circular. Woodward might charge that Lewis's similarity metric is ad hoc.

  Let's create the dialogue accordingly.

  Characters:
  - Lewis: Counterfactual theorist (David Lewis's view)
  - Woodward: Interventionist (James Woodward's view)

  ---

  **Woodward**: Thank you for agreeing to discuss this, David. I thought we might start with a concrete case that our mutual friend in industry described. It involves two sensors, A and B, both wired to trip a circuit breaker upon detecting an overload. Sensor A acts first and trips the breaker, and then B's signal arrives a moment later but has no effect because the breaker is already tripped. The question is: do we count A as a cause of the breaker tripping? 

  **Lewis**: Glad to be here, Jim. In the counterfactual theory, we say that an event c (like A's detection) is a cause of an event e (the breaker tripping) if and only if, if c had not occurred, then e would not have occurred. But we must be careful: we hold fixed the actual past of c and the laws of nature, and then we consider the closest possible world where c does not happen. In this case, if A had not detected the overload, then the breaker would still have tripped because of B, just a few milliseconds later. So, it seems that without A, the breaker still trips (at a slightly different time). Therefore, A is not a cause of the breaker tripping? That doesn't sound right. But wait, note that the time matters. The actual event of the breaker tripping occurs at time t. In the world without A, the breaker trips at t+ε. So the event e (tripping at t) would not have occurred without A. Instead, a different event (tripping at t+ε) would have occurred. Therefore, A is a cause of the actual event: the tripping at t.

  **Woodward**: That's an interesting move. But let me challenge that. In our structural causal model, we represent the system with variables. Let me define:
  - A: whether sensor A triggers (1 if yes, 0 otherwise)
  - B: whether sensor B triggers (1 if yes, 0 otherwise)
  - T: the time of the breaker tripping (a continuous variable, but for simplicity, we can think in discrete steps or just note the time)

  But note that the breaker tripping is a binary event: it trips or it doesn't. However, we care about when it trips. So we might model the time. Alternatively, we can model the event as occurring at a particular time. In the interventionist framework, we ask: if we were to intervene to set A=0 (so that A does not trigger), what would happen to the time of tripping? The intervention must be such that it sets A=0 without affecting B. In the actual world, A=1 and B=1, and T=t. If we intervene to set A=0, then B would still trigger and the breaker would trip at t+ε. So the tripping event is delayed. Therefore, the intervention on A does change the time of the tripping. So in that sense, A is a cause of the time of the tripping. But note that if we define the effect as "the breaker trips at time t or earlier", then without A, it still trips (at t+ε) so that condition holds. But if we define the effect as "the breaker trips at exactly t", then without A, it doesn't. 

  However, in our models, we often care about whether a variable makes a difference to the outcome. We might represent the outcome as the time T. Then, an intervention on A changes T from t to t+ε. So A is a cause of T. But if the outcome is simply "the breaker trips" (a binary variable), then without A, it still trips (because of B). So for the binary outcome, A is not a cause? But that seems odd because in reality, we care about the timing.

  **Lewis**: I see your point. But in the counterfactual theory, we can be more precise. The effect we are considering is the tripping at time t. Without A, that exact event does not occur. Therefore, A is a cause of the tripping at time t. But note that we also have to consider whether the difference in time is significant. If ε is negligible, then perhaps we might think of the tripping as the same event? But in the counterfactual analysis, we must be precise: the event that actually occurs is the tripping at t, and without A, that event does not occur. So A is a cause.

  **Woodward**: But let's think about what we mean by an event. If we consider the tripping event as occurring in a time window, say from t to t+δ (where δ is larger than ε), then without A, the tripping still occurs in that window? So then A might not be a cause? But I think that's arbitrary. The interventionist approach allows us to be flexible about the variables we choose. In practice, we might model the time of tripping as a continuous variable and then ask whether interventions on A change T. They do, so A is a cause of T. But if we model the system with a binary variable for tripping by a certain time (say, within 10 milliseconds of the overload), then both A and B would be causes? But in the actual scenario, only A acted. 

  Moreover, in the interventionist account, we require that there be some intervention that changes the outcome. But note that an intervention on A (setting A=0) does change T. So A is a cause. But what about the binary outcome? Let me define the binary variable: Trip = 1 if the breaker trips at all (within a reasonable time). Then, without A, Trip is still 1 (because of B). So for Trip, A is not a cause? But that doesn't mean A is not a cause of the timing. So I think the interventionist can say that A is a cause of the time of the tripping, but not of the fact that the tripping occurred (because it would have occurred anyway). 

  However, in the context of the problem, the breaker tripping at time t is the event of interest. So we might say A caused the tripping to occur at t.

  **Lewis**: That seems to align with what I said. So we agree that A is a cause of the tripping at time t. But now let me press on a theoretical point. Your interventionist account defines causation in terms of interventions. But how do you define an intervention? Isn't it defined in causal terms? For example, you require that an intervention on X with respect to Y should change Y only through X and not through other paths. That sounds like a causal constraint. So isn't the account circular?

  **Woodward**: That's a common objection. But let me clarify: the notion of an intervention is characterized in terms of a hypothetical experiment. We don't define it in terms of actual causal relations. Instead, we specify what an intervention would do: it sets the value of X independently of the usual causes of X, and it does so in a way that doesn't directly affect Y through any path that doesn't go through X. This is a functional role specification. We can think of an intervention as an exogenous variable that sets X and that has no other connections. The circularity is avoided because we are using the concept of an intervention to define causal relations, and the intervention is characterized without invoking the causal relations we are trying to define. It is a primitive in the account.

  **Lewis**: But when you say "doesn't directly affect Y through any path that doesn't go through X", you are using the concept of a path, which is a causal concept. And you are ruling out that the intervention has an effect on Y except via X. That is, you are assuming a causal structure. So the definition seems to presuppose the very notion we are trying to define.

  **Woodward**: Not exactly. We can represent the causal structure by a directed graph. The intervention is defined relative to a graph. The graph is a representation of the causal relations. But the intervention is a manipulation that breaks the arrows into X and sets X to a value, and we require that it doesn't add any new arrows from the intervention variable to other variables. So the intervention is defined in terms of the graph. But note that the graph is part of the model. We are not defining causation from scratch; we are providing an account of what it is for a relation to be causal in terms of what would happen under interventions. The account is not reductive in the sense of defining causation without any causal notions. But it is illuminating because it connects causal claims to claims about what would happen under interventions. And we can test these claims without having to know the entire causal structure. We can perform experiments that approximate interventions.

  **Lewis**: But then, if I understand correctly, your account is not reductive. It doesn't reduce causation to something non-causal. It only connects causal claims to other causal claims (about what would happen if we intervened). So it's not a reduction. Whereas the counterfactual theory I propose does reduce causation to counterfactuals, which are in turn analyzed in terms of possible worlds and similarity. And similarity is not a causal notion.

  **Woodward**: But is your similarity metric non-causal? Critics have argued that the similarity ordering on possible worlds is set up to match our causal intuitions. For example, when we consider a world where A does not occur, we hold fixed the past of A and the laws, but we allow the future to vary. That holding fixed of the past is a causal constraint: we don't want to change the causes of A when we remove A. So the similarity metric is built to respect causal dependencies. Therefore, your account is also not reductive in a way that avoids causal notions.

  **Lewis**: That's a fair challenge. But I think the similarity metric can be motivated independently. We have an intuitive notion of similarity: we want to make the smallest change to the actual world to remove the event c. We don't change the past because that would be a bigger change. We want the closest world where c does not occur. So we hold fixed the past and the laws, and then let the future unfold according to the laws. That doesn't require causal notions; it's about minimal change.

  **Woodward**: But what counts as minimal change? Why is changing the past a bigger change than changing the future? That seems to assume that the past is fixed and the future is open, which is a temporal asymmetry. And that temporal asymmetry is linked to causation. Moreover, in some cases, we might want to consider worlds where the past is slightly different? For example, if we have a preemptive cause, we might need to consider a world where the backup cause is present and then the effect still happens but in a different way. But in the counterfactual theory, you hold the past fixed, so the backup cause is still there. But why is that the minimal change? Why not change the past to remove the backup cause? Then without A and without B, the effect wouldn't occur. But you don't do that because you hold the past fixed. So the choice to hold the past fixed is what makes the counterfactual come out right. But that choice is motivated by causal considerations: we don't want to remove the backup cause because it wasn't actually involved. 

  In the sensor case, if we didn't hold the past fixed, we might consider a world where both A and B are absent. Then the breaker wouldn't trip. But that's not the closest world. The closest world is one where A is absent but B is present (because the past is fixed). So we get that without A, the breaker trips at t+ε. Therefore, A is a cause of the timing. But the reason we get that is because we are holding fixed the existence of B. Why? Because it's in the past? But note that the detection by B is simultaneous with A? Or is it? In the story, A acts first, then B's signal arrives later. So the state of the world at the time just before A acts includes the fact that B is about to send a signal? Or is it? 

  **Lewis**: In the actual world, at the time just before A acts, the fuse is faulty and both sensors are functional. So if we remove A, we don't change the fact that B is functional and will send a signal. So we hold that fixed. Then without A, B sends the signal and the breaker trips at t+ε. So the minimal change is to remove A and let B do the job. 

  **Woodward**: But why is that minimal? What if we remove A and also by accident remove B? That would be a bigger change? Yes, because we are changing two things. So minimality requires only removing A. So it seems to work. But note that the minimal change idea doesn't explicitly require causation. 

  However, I still think that the interventionist account has advantages. For example, in the sensor case, we can represent it with a structural equation model. Let me write:

  T = min(TA, TB)   [the tripping time is the minimum of the times from A and B]
  But note that if A triggers, then B's signal doesn't matter. So actually:

  TA = if A triggers then t_A else infinity
  TB = if B triggers then t_B else infinity
  T = min(TA, TB)

  In the actual world, A triggers at t_A = t, and B triggers at t_B = t+ε, so T = t.

  Now, if we intervene on A to set A=0 (so A does not trigger), then TA becomes infinity, so T = min(infinity, t+ε) = t+ε. So T changes. Therefore, A is a cause of T.

  If we define the outcome as a binary variable "tripped by time t*" where t* is greater than t+ε, then without A, it still trips by t* (at t+ε). So for that outcome, A is not a cause. But for the continuous T, it is.

  **Lewis**: So we seem to agree on the sensor case: A is a cause of the tripping at time t. But let me push on the circularity again. You say that the intervention is defined relative to a graph. But how do we know what the graph is? We have to know the causal structure to set up the graph. Then we use interventions to define causation. But we need the graph to define interventions. Isn't that circular?

  **Woodward**: Not exactly. We can use the interventionist account to provide truth conditions for causal claims. The account says: X causes Y if and only if there exists a possible intervention on X that changes Y (or the distribution of Y). The graph is a way to represent the causal structure, but we can also think of the causal structure as given by the set of invariant relationships under interventions. We can learn the graph by doing interventions. Alternatively, we can use observational data and assumptions (like the Causal Markov Condition) to infer the graph. But the account does not require that we start with the graph. We can start by performing interventions and seeing what happens. 

  Moreover, the notion of an intervention is not defined in terms of the graph. We have a general definition: an intervention I on X is a variable that sets X to a specific value and that is such that it does not affect Y except through X. We can operationalize this in experiments: we design an experiment that manipulates X and that is randomized and doesn't have direct effects on Y. So in practice, we can test whether X causes Y by doing such an experiment. The account connects causal claims to experimental procedures.

  **Lewis**: But then, when you design an experiment, you are relying on causal knowledge to ensure that the intervention doesn't have side effects. For example, to set up a randomized controlled trial for a drug, we make sure that the assignment is random and that it only affects the outcome through the drug. But we use causal knowledge to set up the trial. So again, we are using causation to define causation.

  **Woodward**: It's true that in practice, we rely on background causal knowledge. But the account is not meant to be a definition from scratch. It is an account that tells us what causation is: it is about invariance under interventions. And it shows how we can test causal claims. It is not viciously circular because we can build up causal knowledge from simple experiments and then use that to design more complex ones. It's a bootstrapping process.

  Moreover, I might turn the tables: in your counterfactual theory, you rely on similarity of possible worlds. How do we know which worlds are similar? We use our causal intuitions to judge that. So both accounts have a kind of circularity, but it's not vicious. They are both illuminating.

  **Lewis**: I see. So we might have to accept that causation is a primitive concept, and both our theories are ways to elucidate it, but neither is a reduction to something non-causal. 

  **Woodward**: Exactly. But I think the interventionist account is more useful for scientific practice, especially in fields like causal inference, because it is tied to what we can manipulate and measure.

  **Lewis**: And I think the counterfactual account is more fundamental because it connects to our intuitive understanding of what it means for one thing to depend on another.

  **Woodward**: Perhaps we can agree to disagree on that. But at least we agree on the sensor case: A is a cause of the tripping at time t.

  **Lewis**: Yes, we do. And I think that's progress.

  **Woodward**: Indeed. Thank you for the discussion.
answer: |-
  Below is a dialogue between two philosophers—**Lewis** (defending David Lewis's counterfactual theory of causation) and **Woodward** (defending James Woodward's interventionist theory)—arguing rigorously about the sensor case and the deeper theoretical disagreements between their views. Neither concedes ground easily, and both press each other on substantive flaws. The dialogue is structured to progressively strip away terminology and expose core disagreements.

  ---

  ### **Scene:** A university common room. Lewis and Woodward sit across from each other, each with a coffee. The faulty fuse sensor case is sketched on a notepad between them.

  ---

  **Woodward**: Let's start with your sensor case. Sensor A detects the overload and trips the breaker at time *t*. Sensor B’s signal arrives milliseconds later but finds the breaker already tripped. You want to know if A caused the tripping. On my interventionist view, causation is defined by what happens under ideal interventions. An intervention *I* on A severs A from its usual causes and sets A’s value independently. If varying *I* changes the outcome—here, the tripping—then A is a cause.  

  **Lewis**: But that’s ambiguous. What’s the “outcome”? If it’s the binary event *breaker trips*, then intervening to set A to “no detection” (*A=0*) leaves B intact. B trips the breaker at *t*+ε. So the breaker still trips—no change. A isn’t a cause.  

  **Woodward**: That misapplies the theory. The outcome must be specified precisely. We care about the *exact time* of tripping. Define the outcome variable *T* as the tripping time. Actual *T* = *t*. Now intervene: set *A=0*. Then *T* = *t*+ε (when B acts). Since *T* changes, A causes *T*.  

  **Lewis**: But that’s gerrymandering! In ordinary language, we say “A caused the breaker *to trip*”—not “A caused it *to trip at t*.” Your interventionist answer depends on how we describe the effect. If we coarse-grain the outcome to “tripping within 1 second,” then *T* doesn’t change under intervention (*t* and *t*+ε both fall within 1 second). Suddenly A isn’t a cause? That’s absurd.  

  **Woodward**: Not absurd—pragmatic. Causal attributions depend on context. In safety-critical systems, milliseconds matter. A *is* a cause of the precise timing. But if you care only about whether the room goes dark, then B suffices, and A is redundant. Interventionism captures this by letting variables reflect granularity. Your counterfactual theory does the same! You’d say: “Without A, the tripping at *exactly t* wouldn’t have occurred.” So you also rely on event description.  

  **Lewis**: True, but I don’t need interventions. My account is simpler: A is a cause of the tripping-at-*t* because, in the closest possible world where A doesn’t occur, the tripping-at-*t* doesn’t occur. Instead, a distinct event (tripping-at-*t*+ε) occurs.  

  **Woodward**: Ah, but your “closest possible world” hides causal assumptions. Why is the closest world one where B still fires? Because you hold fixed the actual past and laws, including B’s readiness. But why not a world where B *also* fails? That might be “closer” in some similarity metrics.  

  **Lewis**: No—similarity prioritizes minimizing spatiotemporal divergence. Worlds where B fails require extra changes (e.g., B’s wiring faults). Worlds where only A is altered are closer. So: actual world → A occurs, B occurs, tripping at *t*. Closest ¬A-world: A doesn’t occur, B occurs, tripping at *t*+ε. Tripping-at-*t* is absent. Thus, A causes it.  

  **Woodward**: But your similarity metric is reverse-engineered to fit causal intuitions! Why prioritize “minimizing spatiotemporal divergence” over, say, minimizing miracles or violations of law? Because you tacitly assume causation’s asymmetry. If I judge worlds by causal resemblance, I’d hold B fixed—but that’s circular.  

  **Lewis**: Then let’s test your view. You say A causes *T* (time) because interventions on A change *T*. But interventions are defined causally! You require that *I* affects *T* only through A, not via other paths. But “through A” is causal. Your definition is viciously circular: you use causation to define causation.  

  **Woodward**: Not at all. Interventions are characterized *non-causally* via modularity. An ideal intervention *I* on A:  
  - Sets A’s value *independent* of A’s usual causes.  
  - Doesn’t alter other variables *directly* (e.g., doesn’t affect B or *T* except through A).  
  This is specified with *graph surgery*: in a causal model, we remove arrows into A and set A. No causal language—just variable manipulation.  

  **Lewis**: But the graph *is* causal! When you say “remove arrows into A,” you presume a causal structure. Where does that come from? From prior interventions? But then you’re bootstrapping causation with causation.  

  **Woodward**: The graph is inferred from invariances. If *T* changes when we wiggle A *and* that change is robust (e.g., across background conditions like B’s state), we posit an arrow A→*T*. No prior causal knowledge needed. We build models from scratch using experimental data.  

  **Lewis**: Experimental data? Your “wiggling A” is an intervention—which you’ve just defined! Circularity remains. Worse, your account can’t handle preemption. Suppose we intervene on A (*A=0*), and *T* changes to *t*+ε. You say A causes *T*. But intuitively, A *preempted* B—it’s a genuine cause. Yet if we define the outcome as binary (trip: yes/no), interventions on A show no change. So is A only a cause of timing, not of tripping *simpliciter*? That’s incoherent.  

  **Woodward**: Not if causation is contrastive. A causes [*T* = *t* rather than *T* = *t*+ε], but not [trip rather than no trip]. Your theory faces the same: without A, tripping occurs but later. So you also say A causes the specific event.  

  **Lewis**: But I ground it in objective similarity of worlds. You rely on human choices: how we define variables, what interventions we “idealize.” Your theory is instrumentalist—it reduces causation to predictive tools for manipulation. I capture causation’s *mind-independent* fabric.  

  **Woodward**: And your similarity metric is mind-dependent! Why is “minimizing divergence” objective? Critics say you tweak it to match intuitions—e.g., in preemption, you hold fixed the backup cause (B) to avoid backtracking. But that assumes B *is* a backup cause! Circular.  

  **Lewis**: Similarity is fixed by physics: worlds with small miracles (localized law violations) are closer than worlds with big miracles or global chaos. In this case, a tiny miracle prevents A, but B operates lawfully. No circularity.  

  **Woodward**: “Miracle size” isn’t physics—it’s metaphysics. And it’s ad hoc. Consider probabilistic causation: if B has a 50% chance of firing, is the closest ¬A-world one where B fires or not? Your metric must add probabilistic closeness, which again fits causal intuitions. Interventionism handles this cleanly: if P(*T* = *t* | *do*(A=0)) < P(*T* = *t* | *do*(A=1)), then A is a cause.  

  **Lewis**: But *do*-notation smuggles in causation. Pearl’s *do*-calculus assumes modularity—which is causal independence. It doesn’t reduce causation; it formalizes it.  

  **Woodward**: It reduces causation to *manipulability* without presupposing causal primitives. The calculus is a toolkit for reasoning. Your theory? It’s elegant but untestable. You can’t *observe* closest possible worlds. I tie causation to empirical methods.  

  **Lewis**: And you equivocate on circularity. Define “direct effect” without causal language. When you say an intervention *I* affects *T* “only through A,” you mean there’s no causal path from *I* to *T* bypassing A. Circular!  

  **Woodward**: I define it via path blocking in the graph. Graph structure is inferred from conditional independencies under interventions. Example: if *I* ⊥ *T* | A, then *I* affects *T* only through A. No causal primitives—just probabilistic independence.  

  **Lewis**: But the graph’s arrows *represent* causation. You’re painting arrows and calling it a reduction.  

  **Woodward**: Arrows represent directed dependencies revealed by interventions. The ontology is the invariance, not the arrow. Your theory? It’s a beautiful castle in the air.  

  **Lewis**: Then we’re at an impasse. You see causation as a tool for control; I see it as bedrock reality. In this case, A caused the tripping-at-*t* because its absence would have led to a different event. Your interventions confirm this but depend on causal assumptions.  

  **Woodward**: And your “would have” is made true by similarity, which presumes causal structure. So neither reduces causation non-circularly. But interventionism is superior for science: it guides discovery. Your theory is an interpretive gloss.  

  **Lewis**: A gloss that predates science! We’ve argued this case to a draw. But at least we agree A caused the precise timing.  

  **Woodward**: Only because we specified variables carefully. That’s the lesson: causation is relative to a model. Your possible worlds don’t escape that.  

  **Lewis**: *[Sips coffee]* Perhaps. But I’ll take objective modality over your pragmatic graphs any day.  

  ---

  ### **Summary of Key Disagreements**  
  1. **The sensor case**: Both agree A causes the tripping *at time t* (due to counterfactual dependence/interventional difference), but disagree on whether A causes the tripping *simpliciter*.  
  2. **Circularity**:  
     - Lewis charges interventionism with circularity: interventions are defined causally (e.g., “no path from *I* to *Y* except through *X*”).  
     - Woodward retorts that interventions are non-causal graph surgeries, and similarity metrics are circular too (they presuppose causal asymmetries).  
  3. **Metaphysics vs. Pragmatics**:  
     - Lewis defends causation as mind-independent (grounded in objective similarity of worlds).  
     - Woodward views causation as manipulability (defined relative to models for predictive control).  
  4. **Granularity**: Both theories depend on how events are described, but neither can fully escape this dependence without circularity or ad hoc adjustments.  

  The core divide: Lewis seeks a reductive, metaphysical account; Woodward offers a non-reductive, methodological one. Neither concedes circularity, but both expose how their rival relies on ungrounded assumptions (similarity metrics or modularity). The disagreement bites deepest on whether causation is part of the universe’s fabric (Lewis) or a human tool for reasoning (Woodward).
