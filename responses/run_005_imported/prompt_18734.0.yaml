prompt: |-
  I am reporting a feature on the replication crisis, and while interviewing two researchers for it I found myself the unwilling referee of an argument between them that I still cannot settle on my own.

  (1) Naomi's lab had planned to recruit 200 participants for a study testing whether a short planning exercise reduces procrastination on essay deadlines. After 120 participants, an interim look showed p = .03; with funding running low, she and her team stopped there and wrote it up. A reviewer rejected the paper, calling this "optional stopping": peeking at the data and quitting once it looks good inflates the true false-positive rate well above the nominal 5 percent level, and Naomi should have fixed the sample size in advance or used a formal sequential design.

  (2) Naomi mentioned this, expecting sympathy, to Theo, a Bayesian statistician she consults. He told her the reviewer's complaint, though standard, reflects a frequentist artifact rather than a genuine flaw: by the likelihood principle, what her 120 data points say about the hypothesis is fixed by their likelihood alone, so a Bayesian analysis of that exact data set gives the same posterior whether she had always planned to stop at 120 or only decided to on the spot. Her reason for stopping, on this view, is simply not part of the evidence.

  (3) Naomi pushed back: if the stopping rule is truly irrelevant, a team willing to peek every ten participants could all but guarantee crossing whatever significance threshold it likes, sooner or later, purely by chance -- and that has to bear on whether the result deserves belief.

  (4) Theo replied that she was running together two different questions: the long-run behavior of a peeking procedure across hypothetical repetitions of the whole study, and what this particular data set says. A Bayes factor tracked under continued peeking, he added, can only stray past a sufficiently stringent threshold with a correspondingly small probability, however long the peeking continues, so no one is "guaranteed" a false positive; the real mistake, if there is one, is reporting a single Bayes factor as though it settled things when you were secretly prepared to keep going had it come out otherwise.

  (5) Naomi's rejoinder was that this may be true of the disciplined analysis Theo has in mind, but that almost nobody in her field actually runs it: in practice, people peek, stop, and report the number as if the sample size had been fixed from the start, so dismissing the stopping-rule objection as a "frequentist artifact" hands ordinary working scientists a rationale for exactly the sloppy practice that produced the replication crisis in the first place.

  Neither of them budged, and I could see something to each position. Could you adjudicate the exchange move by move, saying who has the better of it at each numbered step rather than just declaring an overall winner, and flag anything you think both of them are missing? Please close with a one-line verdict, in the form \verdict{Naomi} or \verdict{Theo}, for whichever of them you think had the stronger case overall.
reasoning: |-
  We are analyzing an argument between Naomi (a researcher who stopped early) and Theo (a Bayesian statistician) about the role of stopping rules in statistical inference. The exchange has five steps. Let's break it down move by move.

  Step (1): Naomi's situation and the reviewer's criticism.
  - Naomi planned for 200 participants but stopped at 120 because she found p=0.03 and funding was low.
  - The reviewer rejected the paper for "optional stopping", which inflates the false-positive rate above 5%.

  Step (2): Theo's Bayesian perspective.
  - Theo argues that the reviewer's complaint is a frequentist artifact. By the likelihood principle, the evidence from the data (the 120 data points) is contained in the likelihood function. Therefore, a Bayesian analysis (which uses the likelihood and prior to form the posterior) should depend only on the data and not on the stopping rule. The reason for stopping is not part of the evidence.

  Step (3): Naomi's pushback.
  - Naomi argues that if the stopping rule is irrelevant, then a team that peeks every ten participants could keep going until they get a significant result by chance. This, she says, must affect the credibility of the result.

  Step (4): Theo's clarification.
  - Theo distinguishes between two things:
     a) The long-run behavior of a peeking procedure (which is what frequentists worry about) and 
     b) What the particular data set says (which is the Bayesian focus).
  - He also notes that in a Bayesian sequential design, if one uses a sufficiently stringent threshold for the Bayes factor, the probability of a false positive remains low even with multiple looks. However, he points out that the real mistake is reporting a Bayes factor as if it were the final result when you were actually prepared to keep going if it hadn't been significant.

  Step (5): Naomi's rejoinder.
  - Naomi agrees that Theo's disciplined Bayesian approach might work in theory, but in practice, researchers peek, stop when they get a significant result, and then report the p-value as if the sample size had been fixed. She argues that dismissing the stopping-rule objection as a frequentist artifact gives researchers a rationale for sloppy practices that contribute to the replication crisis.

  Now, let's adjudicate each step:

  Step (1): The reviewer's criticism is standard in frequentist statistics. In frequentist methods, the sampling plan (including when you stop) is part of the definition of the procedure. If you stop early because the data look good, the actual false-positive rate (Type I error) can be inflated. For example, if you peek multiple times without adjusting, the chance of a false positive can be much higher than 5%. So the reviewer has a point from a frequentist perspective. However, note that the study was planned for 200 and stopped at 120 for a reason (funding) and with a significant result. But the frequentist concern is valid.

  Step (2): Theo is correct about the likelihood principle and Bayesian analysis. The likelihood principle states that all the information about the parameter is in the likelihood function, and the stopping rule does not affect the likelihood. Therefore, a Bayesian analysis that conditions on the data (using the same prior) would yield the same posterior regardless of the stopping rule. This is a fundamental point in Bayesian theory. However, note that the Bayesian approach does require a prior, and if the prior is chosen appropriately, the posterior can be interpreted without reference to the stopping rule.

  Step (3): Naomi's concern is also valid. If researchers are allowed to peek and stop arbitrarily, then they can increase the chance of a false positive in the long run (in a frequentist sense). However, Theo would counter that in a Bayesian analysis with a fixed prior, the posterior probability that the effect exists is what matters, and if the prior is reasonable, then the posterior should not be unduly influenced by the stopping rule. But note: if the stopping rule is chosen to be "stop when significant", then the Bayesian posterior might still be calibrated appropriately if the prior is correct, but the problem is that the prior might not be correct and the researcher's behavior (peeking until significant) is a form of selection bias.

  Step (4): Theo makes two key points:
     a) The long-run behavior (frequentist properties) is separate from the Bayesian interpretation of the current data. This is true and a standard Bayesian position.
     b) He notes that in a proper Bayesian sequential design, one can set a threshold for the Bayes factor that controls the false positive rate in the long run. For example, if you set a very high threshold (say, a Bayes factor of 10 or 100) and you only stop when you cross that, then the chance of a false positive might be low. However, he also points out the real mistake: if you are prepared to keep going if the result isn't significant, then you are essentially conducting multiple tests and you must account for that. If you don't, then you are being dishonest in reporting.

  Step (5): Naomi's rejoinder is very practical. She points out that in the real world, researchers do not use the disciplined Bayesian approach that Theo describes. Instead, they use frequentist methods (p-values) and then stop when they get a significant result without adjusting for multiple looks. Moreover, they report the p-value as if the sample size had been fixed. This practice is indeed a major contributor to the replication crisis. Therefore, Theo's argument, while theoretically sound, might be misused in practice to justify poor methods.

  Overall, both have valid points. However, let's consider the context of the replication crisis. The problem is that many published findings are false, and one reason is that researchers use flexible designs (like optional stopping) without accounting for them. 

  Theo's Bayesian approach is theoretically sound and avoids the stopping rule issue, but it requires:
     - Using Bayesian methods (which are not the norm in many fields).
     - Having a prior that is not chosen arbitrarily to favor the alternative.
     - Being transparent about the stopping rule and the analysis plan.

  In practice, as Naomi notes, researchers often do not do this. They use frequentist methods and then appeal to Bayesian principles to dismiss concerns about stopping rules without actually doing a Bayesian analysis. This is problematic.

  Moreover, even in the Bayesian framework, if the prior is not well calibrated or if the threshold for stopping is not set in advance and adhered to, then optional stopping can still be problematic. For example, if you keep peeking and then stop when the Bayes factor crosses an arbitrary threshold, but you didn't pre-specify that threshold, then the interpretation is less clear.

  Verdict: Both have strong points, but Naomi's practical concerns about how research is conducted in the field are very important. The replication crisis is driven by practices like optional stopping without adjustment. While Theo is correct in theory, the reality is that most researchers are using frequentist methods and then misapplying the likelihood principle to justify their stopping without actually doing a Bayesian analysis. Therefore, in the context of the replication crisis and the current state of research practice, Naomi has a stronger case.

  However, note that the reviewer's criticism was from a frequentist perspective and was appropriate for a study that was analyzed using frequentist methods (p-value). Naomi did not use a Bayesian analysis. So the reviewer was right to reject the paper because the p-value of 0.03 in a context of optional stopping is not valid (it is not really 0.03 in the frequentist sense). 

  Theo's point is that if Naomi had done a Bayesian analysis, the stopping rule wouldn't matter. But she didn't. So the reviewer's criticism stands.

  Therefore, in the overall exchange, Naomi's point about the practical consequences and the current state of affairs in her field is more compelling for the replication crisis discussion.

  But note: Theo's argument is theoretically sound and provides a way out of the stopping rule problem. However, it requires a shift to Bayesian methods and proper application. Without that shift, the problem remains.

  One-line verdict: \verdict{Naomi}

  However, let me clarify: Naomi is right about the practical implications and the danger of dismissing stopping rules in the current research environment. But Theo is right about the theoretical point. The adjudication must consider the context of the replication crisis and the typical practices. Naomi wins on the practical grounds that her field does not use the Bayesian methods that would make the stopping rule irrelevant.

  Final note: Both are missing the importance of pre-registration and the need for transparency. Pre-registering the analysis plan (including the stopping rule) is a way to address these issues. Also, in frequentist statistics, one can use sequential designs that adjust for multiple looks (like group sequential methods) to control the Type I error. So there are solutions in both frameworks, but they require discipline and transparency.
answer: |-
  ### Adjudication of the Exchange

  **Step (1): Naomi's Situation and Reviewer's Criticism**  
  - **Reviewer's Point**: Valid from a frequentist perspective. Optional stopping inflates the false-positive rate because repeated testing increases the chance of crossing \(p < 0.05\) by luck. Naomi’s early stop (at \(p = 0.03\)) without pre-specified rules violates fixed-sample assumptions.  
  - **Naomi's Defense**: Her funding constraints are practical, but this doesn't negate the statistical issue.  
  - **Verdict**: **Reviewer/Naomi**. The criticism is statistically sound; Naomi’s action exemplifies a practice known to inflate Type I error.  

  **Step (2): Theo's Bayesian Rebuttal**  
  - **Theo's Point**: Correct theoretically. The likelihood principle implies that the data’s evidential meaning (via likelihood function) is unchanged by stopping rules. A Bayesian posterior depends only on observed data and prior, not sampling plans.  
  - **Weakness**: Assumes a *proper* Bayesian analysis is performed. If Naomi reported a frequentist \(p\)-value (not Bayesian), this argument is irrelevant to her case.  
  - **Verdict**: **Theo** (on theory). The likelihood principle is a bedrock of Bayesian inference.  

  **Step (3): Naomi's Pushback**  
  - **Naomi's Point**: Legitimate concern. If stopping rules are ignored, researchers can "\(p\)-hack" by peeking until significance, inflating false positives in practice.  
  - **Strength**: Highlights the gap between theory (Theo’s ideal) and real-world misuse.  
  - **Verdict**: **Naomi**. She correctly identifies a practical risk: dismissing stopping rules enables abuse.  

  **Step (4): Theo's Clarification**  
  - **Theo's Point**:  
    - Distinguishes between long-run procedure properties (frequentist) and current data evidence (Bayesian) is valid.  
    - Proper Bayesian sequential testing (e.g., using Bayes factors with pre-set thresholds) controls false positives.  
    - The real flaw is "secret" flexibility: reporting a result while hiding intent to continue if non-significant.  
  - **Weakness**: Overlooks that Naomi’s field rarely uses Bayes factors. His solution requires stringent pre-registration, which isn’t common.  
  - **Verdict**: **Theo** (on theory). He offers a coherent Bayesian solution but underestimates implementation barriers.  

  **Step (5): Naomi's Rejoinder**  
  - **Naomi's Point**: Spot-on. Most researchers use frequentist methods, peek opportunistically, and report \(p\)-values without adjustments. Calling stopping-rule concerns a "frequentist artifact" excuses poor practice.  
  - **Strength**: Directly ties Theo’s argument to replication crisis causes. Flexibility without discipline breeds false positives.  
  - **Verdict**: **Naomi**. She wins on practicality: theoretical purity doesn’t justify real-world negligence.  

  ### Key Points Both Miss  
  - **Pre-registration**: Fixing sample sizes or pre-specifying stopping rules (Bayesian or frequentist) is essential for credibility.  
  - **Hybrid Solutions**: Frequentists can use sequential designs (e.g., alpha-spending); Bayesians need pre-set thresholds. Both require transparency.  
  - **Naomi’s Analysis Flaw**: She reported a frequentist \(p\)-value but stopped flexibly. Theo’s defense only works if she’d done a Bayesian analysis.  

  ### Overall Verdict  
  **Naomi** makes the stronger case. While Theo’s Bayesian stance is theoretically sound, it ignores the dominant practices in Naomi’s field. Dismissing stopping-rule concerns as "frequentist artifacts" without universal adoption of Bayesian methods (with pre-registered thresholds) licenses the very behavior driving the replication crisis. Naomi’s warning against normalizing unplanned peeking is empirically grounded and ethically urgent.  

  \verdict{Naomi}
