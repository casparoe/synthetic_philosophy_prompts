answer: |-
  ## Priya Okonkwo's Toast to Judith Ansel

  (Clinks glass gently, waits for quiet. Smiles warmly at Judith, then scans the room, her gaze lingering briefly on Owen Marsh before returning to Judith.)

  Judith Ansel. Mentor. Colleague. Friend. And, let’s be honest, the woman who has single-handedly kept the phrase “That depends entirely on what you *mean* by ‘law’” in circulation at dinner parties for four decades. For those of you who’ve endured one of Judith’s… *clarifications*… over the roast beef, you know the look. That sharp intake of breath, the raised eyebrow, the precise deployment of the fork – not as cutlery, mind you, but as a rhetorical scalpel, ready to dissect a well-meaning but fatally imprecise claim about the nature of legality. To the uninitiated, it might seem like pedantry. To us, her students and colleagues? It was a masterclass. A relentless, sometimes terrifying, but always vital insistence on seeing the thing itself, unvarnished by what we might desperately wish it to be.

  Judith retires not just as a scholar, but as the last unapologetic defender of a particular way of seeing the law in this department. Legal positivism. Now, before half the room starts shifting uncomfortably and the other half wonders if we’re about to discuss dental fillings, let me say what Judith has spent her career saying, often loudly and over the objections of a certain gentleman two tables over: Positivism isn’t about obedience. It never was. Judith isn’t, and never has been, telling us to *do* what the law says simply because it *is* the law. What she *has* told us, with unparalleled rigor and courage, is that understanding *what makes a rule law* in the first place is a different question entirely from deciding whether that law is good, or just, or worthy of our respect.

  Think of it like plumbing. Judith taught us to see the pipes, the valves, the pressure systems – the complex, human-made machinery that channels social power and calls it ‘law’. She showed us how it’s assembled, how it functions, where the leaks are. And she insisted, crucially, that understanding how the pipes *work* doesn’t mean you endorse the quality of the water flowing through them. In fact, understanding the machinery is the first, essential step towards fixing it – or knowing when the whole system needs to be condemned.

  This brings us, inevitably, to the grudge informer. That case haunted Judith’s early work, and understandably so. When she argued that the post-war German court, in declaring the Nazi statute void *ab initio*, was blurring the crucial line between a rule’s *validity as law* and its *moral monstrousness*, she wasn’t excusing tyranny. Far from it. Her point was devastatingly practical: calling the Nazi decree "not law" was a comforting fiction, but a dangerous one. It obscured the terrifying reality that perfectly valid, procedurally enacted laws *can* be instruments of profound evil. Judith’s solution wasn’t to let the informer go free on a technicality born of denial. It was to face the horror squarely: acknowledge the law *was* law, acknowledge the moral catastrophe it represented, and then, with clear eyes and clean hands, convict the informer under a *new*, *honestly retroactive* statute. It was an argument for confronting the moral debt head-on, not hiding behind a comforting lie about the past. It demanded accountability through transparency, not conceptual sleight-of-hand.

  That argument, Judith’s first major salvo, landed like a grenade. It sparked debate, fierce criticism, and… misunderstandings. Deep, painful misunderstandings. Owen Marsh, Judith’s oldest friend and intellectual sparring partner across the natural law divide, voiced a charge that cut deeply: that this made Judith an apologist for tyranny. It was an accusation born of the heat of fundamental disagreement, a moment when the chasm between seeing law as *only* social fact and seeing it as inherently moral seemed unbridgeable. It caused a rift, one that echoed painfully in this department for a time. We all felt it.

  But time, and Judith’s unwavering intellectual integrity, have a way of clarifying things. The charge didn’t stick, Owen, because it fundamentally misread Judith’s project. Her positivism wasn’t a shield for evil; it was an X-ray. It forced us to see the machinery of power for what it was, so we could dismantle it with moral conviction, not comforting illusions. Her fidelity was never to the *content* of unjust laws, but to the *clarity* needed to fight them effectively. And frankly, Judith’s capacity for *fidelity* – in the very best sense of unwavering commitment to truth – has never been in doubt. As her decades of marriage to the wonderfully patient Robert can attest! (Turns to Robert with a warm smile) Robert, you’ve lived with Judith’s particular brand of ‘Positivism and Fidelity’ every single day. We all salute your endurance! (Allows for a gentle laugh, particularly from the family side).

  That’s Judith’s legacy. Not blind obedience, but clear-eyed analysis. Not the confusion of law with morality, but the rigorous separation necessary for *both* to be properly understood and evaluated. She taught us to distinguish the map from the territory, the rule from its justification. She taught us that calling a spade a spade – even if it’s a bloody, evil spade – is the first step towards throwing it away. She demanded precision in thought and courage in argument. She made generations of students, myself included, better thinkers, sharper critics, and more responsible citizens precisely because she refused the easy answers and the comforting fuzziness.

  So, Judith, as you step away from the formal fray, know this: the arguments you started aren’t over. The questions you sharpened haven’t gone blunt. Your voice, that distinctive blend of relentless logic and dry wit, echoes in every classroom where someone insists on asking, "But what *is* law, really?" You leave jurisprudence stronger, clearer, and far more interesting for having had you in it.

  We raise our glasses to you, Judith. To your formidable intellect, your unflinching honesty, your decades of shaping minds and challenging comfortable assumptions. To the woman who never let a conceptual error pass without comment, especially over dessert. To your retirement – may it be filled with good books, spirited debates (perhaps slightly less technical ones), Robert’s excellent cooking, and the profound satisfaction of knowing you changed the conversation forever.

  To Judith!

  **(Raises glass high)**
