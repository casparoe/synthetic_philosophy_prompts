  Finally, the meta-question: is this about how much people change when idealized (empirical) or what constitutes "own preferences" (conceptual)? The dialogue should reveal both think it's mostly conceptual - Sam sees identity as anchored in actual psychology, Alex in potential rationality. 

  Key moves: 
