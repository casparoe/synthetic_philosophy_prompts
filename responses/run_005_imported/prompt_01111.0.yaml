answer: |-
  You've hit on a core tension in moral philosophy! Hume and Scanlon offer fundamentally different foundations for promise-keeping, and the "deathbed promise" is indeed the classic test case that forces them apart. Here's a breakdown of their disagreement and how the deathbed case exposes it:

  ### Core Difference: Source of Obligation
  1.  **Hume (Conventionalism):**
      *   **Obligation Source:** Social utility and convention. Promises exist *only* because they create a beneficial social practice. We *invented* the ritual of promising to solve coordination problems (e.g., enabling future exchanges).
      *   **Why Keep One?** Primarily to uphold the *system* and avoid the negative consequences of *others* losing trust in the *institution* of promising. Breaking a promise weakens the social fabric for everyone, even if this specific breach goes undetected.
      *   **Analogy:** Like driving on the correct side of the road. It's not intrinsically wrong to drive on the left in a right-hand-drive country; it's wrong because it undermines a vital convention everyone relies on for safety. If you could magically drive on the left *without* causing any accident or eroding the convention (impossible in reality), the obligation wouldn't exist.

  2.  **Scanlon (Expectation & Trust):**
      *   **Obligation Source:** The specific act of intentionally inducing reliance and trust in another individual via Principle F.
      *   **Principle F (Simplified):** If you intentionally lead someone to form expectations about your future behavior (by promising), and they base their choices on those expectations, you have an obligation not to disappoint those expectations *because* disappointing them would be unfairly exploiting their trust.
      *   **Why Keep One?** To avoid wronging *that specific person* by betraying the trust *you deliberately created*. The wrong is in the *act of misleading* and exploiting their vulnerability (reliance).

  ### The Deathbed Promise: The Litmus Test
  *   **Scenario:** You promise your dying friend you will destroy their embarrassing secret journals after their death. They die moments later. No one else knows about the promise or the journals. Destroying them has zero social consequences; keeping them has zero social consequences. No one is ever disappointed or misled *after* the promise is made because the promisee is gone.

  *   **Hume's Analysis (Likely No Obligation):**
      *   Breaking this promise *cannot possibly harm the social institution*. No one learns about it. No one's generalized trust in promises is diminished. The convention remains intact.
      *   There's no utility gained or lost for society. The beneficial practice of promising isn't weakened.
      *   **Conclusion:** Since the *only* reason for the obligation (upholding the beneficial convention) is absent, Hume likely argues there is *no moral obligation* to destroy the journals. The promise "dies" with the promisee. Keeping the journals might be tasteless, but it's not morally wrong.

  *   **Scanlon's Analysis (Strong Obligation):**
      *   At the moment of promising, you *intentionally* created an expectation in your friend ("My journals will be destroyed"). They relied on that promise for peace of mind in their final moments.
      *   Principle F was triggered: You invoked a convention (promising) to induce trust-based reliance for a specific purpose.
      *   Breaking the promise *now* means you *did* mislead them. You exploited the trust they placed in you *at the moment they were vulnerable and relying on you*. The wrongness lies in that *past act of creating a false expectation*.
      *   The fact that they aren't *now* disappointed is irrelevant. The wrong was committed *when you made a promise you didn't intend to keep* (or later decided not to keep), thereby manipulating their trust.
      *   **Conclusion:** The obligation persists. Failing to destroy the journals is a wrong *to your friend*, committed in the past through the act of deceptive promising, even though they can't experience the disappointment now.

  ### Who "Survives" the Deathbed Case?
  *   **Hume Struggles:** The deathbed case is a major problem for pure Humean conventionalism. It exposes that his theory struggles to account for obligations in purely private, consequence-free interactions. It reduces promising to *only* its social function, potentially leaving individual moral commitments unexplained when that function disappears. Critics argue this makes promises too fragile and fails to capture our intuitive sense of a *personal* duty to the promisee.
  *   **Scanlon Holds (With Caveats):** Scanlon's theory handles the deathbed case much better. It grounds the obligation firmly in the *interpersonal wrong* committed *at the time of promising* by creating a false expectation and exploiting trust. The obligation isn't contingent on future social consequences. Principle F survives because its conditions were met *during* the promise-making act.
      *   *Potential Scanlon Caveat:* Some argue Principle F requires the promisee to *actually form* the expectation and rely on it. If the friend died instantly *before* processing the promise, perhaps the conditions aren't fully met. However, in the standard deathbed case, the promisee clearly hears, understands, and relies on the promise for peace of mind before dying.

  ### The Verdict
  *   **They Disagree Radically:** Yes, Hume and Scanlon give diametrically opposed verdicts in the deathbed case. Hume sees no obligation; Scanlon sees a strong one.
  *   **The Deathbed Problem:** It genuinely threatens Hume's conventionalism by showing a promise that cannot possibly serve its supposed social function yet still *feels* binding. It suggests the obligation might be more intrinsic to the act and relationship than Hume allows.
  *   **Survival:** Scanlon's expectation-based theory provides a more robust account of the deathbed obligation, aligning better with the intuition that breaking such a promise wrongs the deceased promisee *personally*. Hume's theory struggles here, potentially needing modification (e.g., incorporating a notion of personal integrity or the intrinsic meaning of the act *to the promisor*) to account for such cases without relying solely on social consequences.

  Your team's argument perfectly illustrates this philosophical divide! Hume offers a "system stability" justification, while Scanlon offers a "personal betrayal" justification. The deathbed promise shows that when system stability isn't at stake, the theories fundamentally disagree on whether any obligation remains.
