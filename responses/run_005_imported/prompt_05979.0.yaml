answer: |-
  Here’s a dialogue grounded in a modified version of Williams’ Owen Wingrave case, with "Charles" as a selfish heir who makes and breaks a promise. The internalist (Alex) defends Williams' view; the externalist (Sam) channels McDowell/Korsgaard. No strawmen, no forced resolution.

  ---

  **Setting:** A philosophy department common room after hours.  
  **Characters:**  
  - **Alex (Internalist):** Defends Williams’ "subjective motivational set" (S) and sound deliberation (D).  
  - **Sam (Externalist):** Argues that "sound deliberation" presupposes external standards of rationality/normativity.  

  ---

  ### **Scene: The Case of Charles**  
  *Charles, a wealthy heir, publicly promises his dying aunt he’ll donate £1M to her orphanage to ease her final moments. He has no affection for her or the orphans; he did it solely to inherit her art collection (which she threatened to sell unless he “showed moral character”). Once he inherits, he tears up the check.*  

  **Alex:** Look, Charles has *zero* reason to keep that promise. His motivational set (S) is pure self-interest: wealth, status, avoiding hassle. Sound deliberation just confirms this. He calculated that reneging won’t hurt his reputation (the aunt’s dead, no one else knows), and donating would drain his assets. Nothing in S — even via imagination or new facts — would motivate keeping it.  

  **Sam:** But your “sound deliberation” is doing all the work here. *Why* is it “sound” for Charles to ignore the promise once the inheritance is secured? You’re assuming that “deliberation” only means *instrumental* reasoning about his *existing* desires. But what if “soundness” requires recognizing that a promise *creates* a reason — regardless of whether he currently cares?  

  **Alex:** How? If Charles deliberates soundly — weighs all facts, imagines the orphans’ suffering vividly, even considers potential guilt — and still feels *nothing*, then no reason exists *for him*. Williams is clear: if you can’t reach the act from S via D, there’s no reason. Charles’ S has no latent altruism, no hidden desire for integrity.  

  **Sam:** But you’re smuggling in a *normative standard* for what counts as “weighing all facts” or “vivid imagination.” Take Williams’ own Owen Wingrave: Owen *does* deliberate soundly when he vividly imagines battlefield horror and rejects his family’s militarism. But that “soundness” assumes that *confronting the reality of violence* is a rational demand. For Charles, doesn’t “sound deliberation” demand he confront the *reality of his promise* — not just as a tool, but as a moral claim?  

  **Alex:** No — because “moral claim” only registers if it hooks into S. If Charles *still* sees the promise as a empty gesture after reflection, then it *is* empty *for him*. You’re just asserting that he *ought* to care. But reasons aren’t magical; they need traction in the agent’s psychology.  

  **Sam:** Traction *where*? In his desires? But deliberation *transforms* desires. Korsgaard would say: when Charles *made* the promise, he took on a practical identity — “promise-keeper” — and sound deliberation requires him to either act on that identity or reject it *coherently*. He can’t just shrug it off as irrelevant without failing as a rational agent.  

  **Alex:** But he *can* reject it! His S is “ruthless opportunist.” If he deliberates soundly — “Does keeping this align with my goals? No.” — then he *has* coherently rejected it. Your “practical identity” is just another desire in disguise. If it’s not in S, it’s not a reason.  

  **Sam:** Then your model is circular. You define S as “whatever survives sound D,” but define sound D as “whatever aligns with S.” Look: when Williams says sound D can correct for irrationality (e.g., ignorance, impulsiveness), he’s appealing to *external* standards of rationality. Why can’t “failing to recognize promissory obligations” be a similar deliberative failure?  

  **Alex:** Because “irrationality” here is technical: ignoring *means* to your *own* ends (e.g., not checking if a bridge is safe when you want to cross). But Charles’ selfishness isn’t “irrational” — it’s consistent! He’s not ignoring facts relevant to *his* goals.  

  **Sam:** Isn’t he? McDowell would say: the *world* presents the orphans’ need and his promise as reason-giving facts. A “sensitive” deliberator — one properly open to reality — would perceive that. Charles’ “deliberation” is defective because he’s blind to a whole category of reasons. You call this blindness “consistent”; I call it a failure of rationality.  

  **Alex:** But that’s question-begging! You’re defining “sensitivity” as “seeing moral reasons,” then saying anyone who doesn’t is defective. Williams’ point is: without *some* motivational hook, “reason” is just a word. Charles *is* “sensitive” — to financial and reputational facts. Why privilege your “category”?  

  **Sam:** Because deliberation isn’t just about *processing* desires — it’s about *evaluating* what’s worth desiring. If Charles deliberates “soundly,” he must ask: “Is a life of ruthless opportunism *worth* living?” If he can’t even entertain that — if his S is so rigid it’s unrevisable — then he’s not deliberating, he’s rationalizing.  

  **Alex:** ...And if he entertains it and says “yes, it’s worth it,” then he *has* deliberated soundly. You’re just insisting he *should* revise S. But reasons can’t force that. If there’s no internal criticism possible, there’s no reason.  

  **Sam:** They can’t *force* it, but they *exist*. On your view, a solipsist has no reason not to torture others. That doesn’t make it true — it just means your theory can’t see the reason.  

  **Alex:** No — it *does* make it true *for him*. Your “external reason” is like a physicalist saying color *exists* independently of perceivers. But reasons aren’t like that. They’re essentially tied to agency.  

  **Sam:** And agency is essentially tied to seeing beyond oneself. We’re stuck.  

  *(Both pause, frustrated. Alex gathers papers; Sam stares out the window.)*  

  **Alex:** Maybe we just care about different things. You want norms that bind agents *whatever they desire*. I want to understand what *moves* actual agents.  

  **Sam:** And I want to understand why some agents *ought to be moved* — even if they aren’t.  

  *(The dialogue ends without resolution.)*  

  ---  
  **Key Philosophical Moves:**  
  - **Internalist:** Stays true to Williams’ S/D model. "Sound deliberation" only corrects for ignorance, irrationality (in a means-end sense), or lack of imagination tied to *existing* S elements.  
  - **Externalist:** Attacks the *criteria* for "soundness," arguing it implicitly relies on normative standards (e.g., coherence, sensitivity to moral reality) not reducible to S.  
  - **No Resolution:** Reflects the real stalemate — internalism risks relativism; externalism risks detached normativity.  

  This captures your debate’s core: whether "reason" requires a subjective hook or exists in the "space of reasons" (McDowell) independently. Williams’ framework holds, but the externalist lands the objection that "sound deliberation" isn’t neutral.
