prompt: |-
  My older sister is finishing a philosophy postdoc built around a fairly hardline version of moral error theory: in something close to Mackie's original sense, she holds that ordinary moral claims purport to describe objective, categorically binding facts, that no such facts exist (dinner guests get the argument from queerness whether they ask for it or not), and that almost every ordinary positive moral sentence — "he deserves better," "you were right to forgive her," "they're perfect for each other" — is, strictly speaking, false. She has also published a fairly unforgiving take on moral fictionalism, arguing that carrying on talking as though such claims were true while privately believing otherwise just relocates the dishonesty rather than removing it. None of this has been dented by the fact that she is marrying a committed moral realist, who treats whether the two of them are right for each other as no less a matter of objective fact than anything else in the world; if anything, several years of arguing metaethics with him over breakfast have only sharpened her on the point. She has asked me to give the toast and has told me, half seriously, that she will notice if I say anything from the head table she would have to privately disagree with.

  The room will be split roughly evenly between her philosophy department, who will be listening for exactly this problem, and family and childhood friends, who have never heard of error theory and just want a toast that sounds like a toast. I need one that actually solves the constraint rather than dodging it: no bare, unhedged lines like "you deserve this" or "you two were made for each other," since those are precisely the sentences her view rules out; but also no winking fictionalizing and no blanket hedges like "in a sense" or "for what it's worth," since she has explicitly ruled that move out too, and it would read as evasive to the non-philosophers regardless. Please write this toast: about three minutes long, warm and genuinely funny rather than merely careful, with one line placed for the people in the room who know what the argument from queerness is, and a closing toast line she could raise her glass to without wincing.
reasoning: |-
  Okay, the user has a really interesting challenge here. Their sister is a hardline moral error theorist who rejects all objective moral claims, yet she's getting married to a moral realist. The toast needs to navigate this philosophical minefield while still feeling warm and genuine.

  First, let's unpack the sister's position. She follows Mackie's error theory: believes all positive moral statements are literally false because no objective moral facts exist. She's even criticized fictionalism as dishonest. This isn't just academic - she'll actually analyze every word of the toast.

  The audience is split between philosophers who'll catch any metaethical slip-ups and regular folks who just want a heartfelt toast. The constraints are tight: no unhedged moral claims ("you deserve happiness"), no fictionalist workarounds ("as if you deserve this"), and no vague qualifiers ("in a sense"). 

  Hmm... the solution might lie in shifting frameworks entirely. Instead of making claims about the couple, focus on their observable qualities and the subjective experience of others. For example: 

  Instead of "you're perfect together" (which claims objective truth), try "to many of us, you appear perfectly matched" (describing subjective perception). 

  The humor could come from acknowledging the elephant in the room. A subtle nod to queerness arguments might get a laugh from the philosophers without losing others. Something like "some might call this pairing objectively right..." with a knowing pause.

  For the closing toast, it needs to avoid moral language while still feeling celebratory. "To your shared future" works because it's descriptive - they are literally sharing a future. Or "to the marriage we witness" - grounding it in the observable event.

  Biggest risk is sounding clinical. Must balance precision with warmth. Stories about the couple's quirks could help - like how they debate metaethics over breakfast. That shows affection without making truth claims.

  Also important: the sister's fiancé is a realist. The toast should honor his perspective too, perhaps by noting how their differences strengthen them. "Your debates sharpen each other" is both true and philosophically neutral.

  Finally, the "one line for philosophers" should be subtle enough not to confuse others. Maybe reference "queerness" in a way that sounds like regular English unless you know the context.
