answer: |-
  ## MEMORANDUM  
  **To:** Hospital Ethics Committee  
  **From:** [Your Name], Family Representative  
  **Date:** [Date]  
  **Subject:** Proposed Criteria & Procedure for Honoring Psychiatric Advance Directives (PADs) Conflicting with Contemporaneous Refusals  

  The case involving my sister underscores a critical gap in our policy regarding Psychiatric Advance Directives (PADs) when they conflict with an apparently competent contemporaneous refusal. To resolve this ethical impasse and guide future decisions, I propose the following concrete criteria and procedures, directly addressing the core objection that honoring the PAD elevates the "past self" above the "present self."  

  ### I. Proposed Decision Criteria for Overriding Contemporaneous Refusal Using a PAD  
  A valid PAD should override a contemporaneous refusal **only if all the following criteria are met**:  
  1.  **Validity & Specificity:** The PAD is legally valid, executed during a documented period of stability (e.g., ≥ 3 months symptom-free), and *specifically addresses the current clinical situation* (e.g., "refuse medication during mania," "authorize hospitalization for acute psychosis").  
  2.  **Impaired Insight Threshold:** There is *objective clinical evidence* suggesting the patient’s current capacity assessment, while technically passing a standard bedside evaluation, may **significantly underestimate impairment in judgment** due to the psychiatric condition. Indicators include:  
      *   Documented anosognosia (lack of insight) typical of the condition (e.g., grandiosity in mania).  
      *   Profound inconsistency between current choices and deeply held, well-documented values/preferences expressed when stable.  
      *   Observable, acute symptoms known to impair decision-making *despite coherent articulation* (e.g., severe agitation, pressured speech, minimal sleep).  
  3.  **Alignment with Treatment Goals:** The treatment authorized by the PAD is consistent with evidence-based practices for the diagnosed condition and the patient’s established recovery goals.  

  ### II. Proposed Adjudication Procedure & Timeline  
  1.  **Initial Assessment:** Treating clinician conducts standard capacity evaluation for the *specific decision* (e.g., refusing medication X, discharge).  
  2.  **PAD Review:** If patient refuses treatment/hospitalization **and** a valid PAD exists authorizing it, the clinician must immediately:  
      *   Consult with the patient’s **longitudinal psychiatrist** (if available) or a senior psychiatrist uninvolved in the current admission.  
      *   This consultant conducts a **focused re-assessment** applying the "Impaired Insight Threshold" criteria above within **24 hours**.  
  3.  **Decision Point:**  
      *   If the consultant psychiatrist **confirms impaired insight meeting the threshold** (Criteria 1-3 satisfied), the PAD is activated, overriding the refusal.  
      *   If the consultant **cannot confirm impaired insight meeting the threshold**, the contemporaneous refusal stands, *even if the PAD exists*.  
  4.  **Ethics Committee Review (Mandatory & Expedited):**  
      *   **Trigger:** *Whenever* a PAD is used to override a contemporaneous refusal.  
      *   **Timeline:** Full committee (or designated rapid-response subcommittee) reviews the case **within 48 hours** of the override decision.  
      *   **Purpose:** Verify protocol adherence, assess ethical justification, ensure no less restrictive alternative exists, and provide recommendations for ongoing care. **This is not an appeal for the current decision** (which stands pending review), but essential oversight.  
  5.  **Patient/Family Notification:** Patient and designated surrogate/agent/family (per PAD) are immediately informed of the decision, rationale, and Ethics Committee review process.  

  ### III. Engaging the Strongest Objection: The "Past Self" vs. "Present Self"  
  The compelling objection—that honoring the PAD privileges the past self over the person in the room—demands a nuanced response:  

  *   **Autonomy as a Longitudinal Project:** True autonomy encompasses a person's values and choices *over time*. A PAD executed during stability represents a deliberate exercise of autonomy to protect one's *future self* from the known distorting effects of their illness on judgment and values. Honoring it respects this longitudinal view of self-determination.  
  *   **The Epistemic Challenge of Capacity in Severe Mental Illness:** Standard capacity assessments focus on understanding, reasoning, appreciation, and choice expression. Certain severe mental illnesses (like Bipolar I mania) can allow a patient to "pass" such an assessment while still experiencing profound distortions in *appreciation* of their situation and *reasoning* based on core values due to lack of insight. The PAD acts as crucial evidence of the patient's *own recognition* of this impairment.  
  *   **Preventing the "Ulysses Contract" Failure:** The *purpose* of a PAD is precisely to be invoked when the patient, due to illness, cannot make decisions aligned with their stable self. Deferring to the contemporaneous refusal in such cases renders the PAD meaningless and abandons the patient's *prior*, well-considered instructions designed to protect their health and identity. It privileges the *illness-distorted* present self over the *authentic*, planning self.  

  **Therefore, overriding a contemporaneous refusal via a PAD is not paternalism, but fidelity to the patient's prior autonomous choice to mitigate the known effects of their illness.** The proposed "Impaired Insight Threshold" ensures this override occurs only when there is robust evidence that the illness is *actively undermining* the patient's ability to reason according to their own stable values, as explicitly anticipated in the PAD.  

  ### IV. Recommendation  
  I urge the committee to adopt this criteria and procedure framework. It provides much-needed structure, prioritizes patient autonomy across time, incorporates critical psychiatric expertise, mandates rapid ethical review for accountability, and directly addresses the core ethical tension by grounding the decision in evidence of illness-related impairment anticipated by the patient themselves. This balances respect for the person in the room with respect for the person's own foresight and wishes.  

  **Respectfully submitted,**  
  [Your Name]
