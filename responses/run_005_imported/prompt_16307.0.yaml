  Another point: the user mentions a "block universe," which aligns with eternalism. But perdurantism isn't the only option here. Endurantists in eternalism might use adverbial modification—how properties are held at different times—without temporal parts. The challenge is explaining how the same object is wholly present at different times without parts. That's where endurantists might struggle under eternalism, leading some to see perdurantism as a natural fit.

  For the novel, the user's approach works, but they should be aware of the nuances. The guilt subplot could explore both views: the grandmother might struggle with whether she's the same person (endurantism) or if her past self is a different part (perdurantism). This internal conflict could mirror the philosophical tension, adding depth without needing to resolve it definitively.

