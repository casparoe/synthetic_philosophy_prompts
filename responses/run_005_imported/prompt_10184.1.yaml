  Hempel's objection is crucial here. He argues Good smuggles in background knowledge—specifically, the assumption that worlds with more ravens are more likely to have non-black ones. The original paradox assumes no such prior knowledge. Good's model depends entirely on these arbitrary population choices. Change the numbers, and the conclusion flips. For example, if World B had fewer ravens, observing a black raven might support the "all ravens black" hypothesis instead.

