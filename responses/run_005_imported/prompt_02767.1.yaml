  - The Errand Argument is mid-tier - its concrete scenario makes the functional difference vivid, but a skilled opponent could still argue it's about specification within a class rather than fundamental non-identity.
  - The Combination Argument is weaker because "horse-combined-with-white" dangerously implies the base identity it's trying to deny, giving opponents an easy out.
  - The Naming Argument ranks last as it most blatantly conflates distinct linguistic acts with ontological difference - easily dismissed as confusing labels with referents.

  For the novel's dramatic arc, this ranking means the protagonist should start with the Naming Argument (letting the rival appear confident), escalate through Combination and Errand Arguments (building tension), then deploy the Brown-Horse Analogy (causing visible discomfort) before the Exclusion Argument as the logical climax (leaving the rival speechless). The user's desire for escalating impact aligns perfectly with this structure.

