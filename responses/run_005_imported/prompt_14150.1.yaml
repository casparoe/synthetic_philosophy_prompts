prompt: |-
  So I had this long, kind of ridiculous argument with my friend last night about population ethics. He was arguing that since Parfit's repugnant conclusion basically sinks total utilitarianism (a massive population with lives barely worth living supposedly beating out a smaller population of people living great lives), the obvious fix is just switching to average utilitarianism instead, since then quality beats quantity and the problem's solved. That felt too easy too me but I couldn't say why. Does the average view actually get population ethics out of the woods, or is it just trading the repugnant conclusion for a different, equally bad problem?
reasoning: |-
  Okay, the user is asking about population ethics, specifically whether average utilitarianism solves the problems of total utilitarianism, like Parfit's repugnant conclusion. They had an argument with a friend who thinks switching to average utilitarianism is an easy fix. The user feels it's too simplistic but couldn't articulate why. I need to explain the flaws in average utilitarianism.

  First, I should recall what Parfit's repugnant conclusion is. Total utilitarianism values the sum of happiness, so a large population with barely positive lives can outweigh a small, very happy one. Average utilitarianism focuses on the average happiness instead. So, in the repugnant scenario, the average happiness would be low, so it avoids that problem. But what are the downsides of average utilitarianism?

  I remember that average utilitarianism has its own counterintuitive conclusions. For example, adding unhappy people can increase the average if they're less unhappy than the current average. Wait, that doesn't sound right. Let me think. Actually, adding people who are below the average would lower the average. But what if we consider not adding people at all? 

  The Mere Addition Paradox is relevant here. Adding a group of people with positive but lower happiness than the existing average. If their happiness is still positive, total utilitarianism would say it's good, but average utilitarianism might say it's bad if it lowers the average. But sometimes, adding such a group could be neutral or even positive if they're above a certain threshold? I need to clarify.

  Another point is the extinction problem. If a society is very happy, adding a new person with slightly below-average happiness reduces the average, so it's seen as bad. But if not adding anyone leads to extinction, that might be better? That seems counterintuitive. Also, average utilitarianism might prefer a small, super-happy population over a larger one with slightly less average happiness, even if the total happiness is higher. That could lead to advocating for reducing populations to increase average happiness, which is problematic.

  Also, there's the issue of creating new people. If a potential person would have happiness above the current average, adding them increases the average, so it's good. But if they're below, it's bad. But comparing a non-existent person's happiness to the average is tricky because non-existent people don't have happiness to average. So, the theory might justify adding happy people even if resources are strained, potentially lowering everyone's happiness in the long run. 

  Then there's the problem with existing unhappy populations. If a group has low happiness, average utilitarianism might suggest eliminating them to raise the average. That's clearly a morally repugnant implication. Also, comparing different populations: a small, very happy group versus a larger group with lower average but higher total happiness. Average utilitarianism would prefer the smaller group, but that might not seem right if the larger group has significantly more total well-being.

  The user's deeper need is to understand the trade-offs between different ethical frameworks. They might be looking for a balanced view that acknowledges both theories' flaws and possibly mention alternatives like variable value theories or critical level utilitarianism. They also want to win the argument with their friend, so providing clear counterexamples is key. 

  I should structure the response by first acknowledging that average utilitarianism avoids the repugnant conclusion but then listing its own problems: the mere addition paradox, extinction implication, obligations to create/have children, the "kill the unhappy" problem, and cross-population comparisons. Conclude that it's not a solution but trades one problem for others. Mention that philosophers have proposed other theories, but there's no consensus. Emphasize that population ethics is complex with no easy answers.
answer: |-
  You're absolutely right to be skeptical – average utilitarianism doesn't "solve" population ethics; it just trades the Repugnant Conclusion for a whole new set of counterintuitive and arguably repugnant conclusions. Your friend's "obvious fix" creates more problems than it solves. Here's why:

  1.  **The "Mere Addition" Paradox Becomes Worse:**
      *   **Scenario:** Society A has 10 billion people, all with very high happiness (say, 100 units each). Average = 100.
      *   **Adding a Group:** Society B has the original 10 billion (100 units) *plus* 1 billion new people living lives that are still positive but much lower quality (say, 50 units each). Total happiness is vastly higher (1,050 billion units vs. 1,000 billion), but the average is now ~95.45.
      *   **Total View:** B might be better (or at least not worse) than A due to the huge total increase.
      *   **Average View:** A (avg 100) is *strictly better* than B (avg ~95.45). Adding those billion people with *positive* lives *reduced* the average, so it was a *bad* thing. This seems deeply counterintuitive – how can adding people whose lives are worth living be a *moral wrong*? It suggests a bizarre obligation *not* to procreate if new lives would be below the current average, even if they are good lives.

  2.  **The "Extinction" or "Last Person" Problem:**
      *   **Scenario:** Imagine a small, idyllic society with 100 people each at 100 units (avg=100). Now, suppose adding *any* new person would inevitably bring the average down slightly (maybe to 99.9), perhaps because resources are stretched thin.
      *   **Average View:** Adding *any* new person, even one who would have a wonderful life (99.9 units), is *morally wrong* because it lowers the average. Over time, as the population naturally ages and dies, the *only* way to maintain the highest possible average is to *never replace anyone*. The morally optimal outcome, according to strict average utilitarianism, is the eventual *extinction* of humanity with the highest possible average happiness maintained until the last person dies. This conclusion seems absurd and clearly undesirable.

  3.  **Obligation to Create Happy People (Even if it Harms Existing People?):**
      *   **Scenario:** Society C has 1 million people averaging 80 units. You have the power to create a new person who would have a life of 90 units. However, adding this person slightly strains resources, reducing *everyone else's* happiness by 0.1 units (so existing people go to 79.9, new person at 90).
      *   **Average Calculation:** New average = (1,000,000 * 79.9 + 90) / 1,000,001 ≈ 79.90001.
      *   **Average View:** Creating this new person *increases* the average happiness (from 80 to ~79.90001? Wait... **Hold on!** This is a critical flaw!). 79.90001 is *less* than 80. Adding a person *above* the current average (90 > 80) *should* intuitively raise the average. But mathematically, if the new person's happiness (90) is *lower* than the *current* average (80), adding them *lowers* the average, even if their life is good! This happens because the new person's happiness pulls the average down *unless* it's *higher* than the current average. So:
          *   If the potential new person's happiness > current average: Adding them *increases* the average. You *must* create them to maximize average utility.
          *   If the potential new person's happiness < current average (even if positive!): Adding them *decreases* the average. You *must not* create them.
      *   **Problem:** This creates potentially extreme obligations: You *must* create people if they'll be above average (potentially leading to overpopulation/resource drain that lowers averages later), and you *must not* create people who would have good lives but below the current average. It also ignores the *cost* to existing people in the calculation above – the average only cares about the final mean, not how it was achieved.

  4.  **The "Kill the Unhappy" Problem:**
      *   **Scenario:** Society D has 1,000 people: 999 at 100 units, 1 at 50 units. Average = ~99.95.
      *   **Average View:** If you could painlessly remove the one unhappy person (or they died), the average jumps to 100. Therefore, eliminating the unhappy person *increases* the average happiness and is morally obligatory. This is a horrifying implication, suggesting that eliminating those below average (even if their lives are positive) is good, purely for statistical reasons.

  5.  **Intransitivity and Comparison Problems:** Average utilitarianism struggles to compare populations of different sizes in ways that seem rational. It can lead to situations where:
      *   A is better than B (higher avg)
      *   B is better than C (higher avg)
      *   But C is better than A (higher avg)
      *   ...which violates basic rationality principles (transitivity).

  6.  **Ignores Total Welfare:** Like the Repugnant Conclusion exploits the weakness of Total Utilitarianism (ignoring average quality), Average Utilitarianism's core weakness is ignoring *total* welfare. It would prefer a tiny population of supremely happy beings (e.g., 10 people at 100) over a vastly larger population where *each* individual is nearly as happy (e.g., 1 billion people at 99), even though the total well-being in the latter is astronomically higher. This seems like a different kind of repugnance – prioritizing statistical purity over the aggregate good.

  **Conclusion: Trading One Repugnance for Another**

  Your friend is correct that Average Utilitarianism easily dodges the *specific* Repugnant Conclusion (it always prefers the smaller, happier population). **However, it does so by introducing conclusions that are arguably just as bad, if not worse:** implying it's wrong to add happy-but-not-*as*-happy people, implying extinction is optimal, implying obligations to create people only under specific conditions that might harm others, and most horrifyingly, implying that eliminating the unhappy is good. It also fundamentally ignores the intuition that more total good matters.

  **Philosophers widely agree that Average Utilitarianism is not a viable solution to the problems of Total Utilitarianism in population ethics.** The debate continues, with other theories proposed (Critical Level Utilitarianism, Variable Value Theories, Person-Affecting Views, etc.), but none have achieved consensus, and all face significant challenges. Parfit himself spent decades wrestling with these issues without finding a fully satisfactory answer.

  **So, tell your friend:** While switching to average utility avoids the Repugnant Conclusion, it sinks the ship on entirely different rocks, producing implications about procreation, extinction, and the treatment of the less happy that most people find deeply morally unacceptable. Population ethics remains a thorny philosophical swamp with no easy exits!
