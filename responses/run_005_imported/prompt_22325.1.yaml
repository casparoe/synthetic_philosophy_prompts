  Ah, no: section 9 rescues him. By limiting this judgment-for-perception swap *to sight alone*, Locke implies touch *is* direct. That’s why the newly sighted man lacks cross-modal links: his touch knows "real" cube-ness, but vision only knows shadows and colors. Until experience couples them, he’s lost. Smart move by Locke, honestly. 

