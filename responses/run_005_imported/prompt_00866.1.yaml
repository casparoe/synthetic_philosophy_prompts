answer: |-
  That's an **excellent** observation, and it's far from just a "weird hobby." Sidgwick's deep involvement in psychical research (SPR) wasn't a contradiction to his rationalism; it was, in many ways, its **logical and deeply personal extension**. Here's why it makes sense:

  1.  **The Crisis of Faith & The Search for Empirical Grounds:** Sidgwick lived during the Victorian crisis of faith. Advances in science (especially Darwinism) and historical Biblical criticism profoundly undermined traditional religious beliefs for intellectuals like him. He resigned his Cambridge fellowship in 1869 because he could no longer in good conscience subscribe to the Anglican creed required for the position. This loss of faith wasn't just intellectual; it was deeply personal and morally troubling. He desperately *wanted* to believe in some form of personal survival after death and a moral order to the universe, but his rigorous intellect demanded **evidence**.

  2.  **Rationalism Demands Investigation, Not Dogmatic Dismissal:** Sidgwick wasn't a credulous mystic jumping on the spiritualist bandwagon. His approach to psychical research was **characteristically meticulous, skeptical, and empirical** – exactly like his approach to ethics. He co-founded the SPR specifically to apply rigorous scientific methods (as understood then) to phenomena that *might* provide evidence for survival or telepathy. His motto for the SPR was essentially: "Approach the subject as if it were entirely unknown; collect facts without prejudice; investigate alleged phenomena with scientific rigor; be prepared to accept evidence if it meets the standard." This *is* rationalism in action.

  3.  **The Potential Ethical Stakes:** For Sidgwick, the possible existence of telepathy or survival had **profound ethical implications**:
      *   **Proof of an Afterlife:** If survival could be empirically proven, it would fundamentally alter the utilitarian calculus. Consequences wouldn't end at death; future states (in an afterlife) would need factoring in. This could potentially resolve some of the deep tensions he identified in utilitarianism (like the "Dualism of Practical Reason" – conflict between rational self-interest and universal good).
      *   **Telepathy & Moral Psychology:** Evidence for telepathy or clairvoyance could challenge fundamental assumptions about the mind, consciousness, and individual boundaries. How would this affect concepts of personal responsibility, privacy, or the nature of sympathy/empathy? Sidgwick saw exploring these possibilities as part of understanding the human condition relevant to ethics.
      *   **Grounding Morality:** If traditional religion couldn't provide a secure foundation for morality (as he believed), could empirical evidence for a non-material aspect of reality (mind/soul) offer an alternative basis for moral objectivity or purpose?

  4.  **Methodological Consistency:** Just as in *Methods of Ethics* he meticulously examined common-sense morality to see if it could be systematized on rational utilitarian grounds, in psychical research he meticulously examined anecdotal claims and conducted experiments to see if they could withstand scrutiny and point to a new scientific reality. Both projects involved:
      *   **Systematic Collection & Analysis:** Gathering data (moral intuitions / psychic phenomena).
      *   **Critical Scrutiny:** Applying reason and logic to identify inconsistencies, biases, and fraud.
      *   **Seeking Coherence:** Looking for underlying principles or laws that could explain the phenomena.

  5.  **Personal Longing vs. Intellectual Honesty:** Sidgwick *hoped* to find evidence for survival. This personal desire was a powerful motivator. **Crucially, however, his intellectual honesty prevailed.** Despite decades of investigation, he never found evidence convincing enough *for him* to overcome his skepticism. He famously lamented near the end of his life that the research hadn't yielded the proof he sought. His commitment was to the *process* of rational inquiry, even when it didn't deliver the desired result.

  **Was he a secret mystic?** No, not in the sense of holding uncritical, faith-based beliefs. He was a rationalist desperately seeking *empirical justification* for beliefs he found existentially and morally necessary but intellectually unsustainable without evidence.

  **Was it unrelated to his philosophy?** Absolutely not. It stemmed directly from:
  *   The existential void left by the collapse of religious faith.
  *   The utilitarian drive to understand *all* relevant consequences (including potentially post-mortem ones).
  *   His fundamental commitment to empirical investigation as the only valid path to knowledge about the world.
  *   The deep Victorian concern with finding a scientific basis for spirituality and morality.

  **In conclusion:** Sidgwick's psychical research wasn't a contradiction; it was the **other side of the same coin**. His rationalism wasn't cold or detached; it was driven by profound existential questions about life, death, meaning, and the foundations of morality. When traditional answers failed, he turned his formidable rational tools towards investigating the most radical possibilities, hoping to find an empirical anchor for his deepest hopes. It was an expression of his rationalism's depth, ambition, and, ultimately, its heartbreaking honesty when the evidence he sought remained elusive. His professor's brief mention truly sells short the fascinating and deeply revealing nature of this aspect of Sidgwick's life and work.
