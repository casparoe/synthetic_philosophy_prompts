answer: |-
  That's an excellent and incisive question that cuts to the heart of a central tension in *On Certainty*. You're right that hinge propositions *function* like necessary truths within our epistemic practices, yet Wittgenstein explicitly denies they are necessary in the traditional logical or metaphysical sense. The river-bed metaphor is crucial for resolving this apparent contradiction. Here's how it fits together:

  1.  **Hinges as Functional Necessities, Not Logical Necessities:**
      *   **Immunity to Doubt & Testing:** As you note, hinges are held fast. Doubting them isn't just difficult; it undermines the very framework for *meaningful* doubt and inquiry. Trying to "test" "the earth has existed for many years" empirically would require presupposing the existence of the earth, records, evidence, etc., which *already assumes the hinge*. This makes them *functionally* indubitable and untestable *within that specific language game or world-picture*.
      *   **Foundation for Practice:** They are the "scaffolding of our thoughts" (OC §211), the "axis" around which inquiry rotates (OC §152). Our practices of justification, testing, doubting, and asserting empirical propositions *presuppose* a background of these unchallenged certainties. They are the "river-bed" through which the fluid water of ordinary empirical claims flows.
      *   **Not Analytic or Metaphysically Necessary:** However, Wittgenstein vehemently rejects the idea that these are necessary truths like "2+2=4" or "All bachelors are unmarried." He doesn't ground their certainty in logic, meaning, or the nature of reality. Their necessity is *pragmatic* and *contextual*, arising from their role in our *lived practices and forms of life*. They are "rules of grammar" in a broad sense – norms governing what *counts* as a meaningful question, doubt, or test *within a given framework*.

  2.  **The River-Bed Metaphor and Fluidity:**
      *   **Shifting Foundations:** Wittgenstein explicitly states that the river-bed isn't eternally fixed (OC §§96-99). What is bedrock (hinge) at one time can become fluid (an empirical proposition open to test and doubt) at another, and vice versa.
      *   **Examples:** "The earth is flat" or "The sun orbits the earth" were once hinge propositions for many cultures – foundational certainties structuring their world-picture. Scientific revolutions transformed them into testable, and ultimately falsified, empirical claims. Conversely, deeply tested scientific theories (e.g., evolution, germ theory) can become so entrenched that they function as new hinges within scientific practice, rarely questioned directly.
      *   **How Shifts Happen:** This fluidity occurs through profound changes in our "world-picture" (Weltbild) driven by:
          *   **Overwhelming Counter-Evidence:** A slow accumulation of anomalies that eventually makes holding the old hinge untenable *in practice* (e.g., evidence against a flat earth).
          *   **Revolutionary Discoveries/Theories:** The introduction of a new framework that reconfigures what counts as fundamental (e.g., Copernican revolution, relativity).
          *   **Cultural/Practical Shifts:** Changes in societal practices, technology, or fundamental beliefs.

  3.  **Resolving the Tension: Contextual Necessity vs. Eternal Necessity**
      The key to resolving the tension lies in understanding the *contextual* and *functional* nature of hinge "necessity":

      *   **Necessity *Within* a Framework:** At any given moment, *within a specific form of life and its world-picture*, certain propositions *must* function as hinges for rational inquiry and communication to be possible. They are necessary *for the practice*. Their certainty is absolute *relative to that framework*.
      *   **Contingency *Between* Frameworks:** This functional necessity is *not* absolute across time or cultures. The *content* of the hinges is contingent on our historical, cultural, and practical circumstances. What is bedrock today might be debris (or a testable claim) tomorrow, and vice versa. The river-bed shifts.
      *   **No Timeless "Necessary Truths":** Wittgenstein is fundamentally attacking the idea of timeless, context-independent necessary truths about the world known through pure reason or logic. Hinges are certain, but their certainty is grounded in their role in human action and language, not in an abstract logical or metaphysical realm. They are "animal" (OC §359), part of our inherited background for acting and reacting to the world.
      *   **The Nature of the Shift:** When a hinge *does* shift, it's not because it was empirically falsified *while still functioning as a hinge*. Rather, a crisis occurs where the *entire framework* supporting that hinge becomes unstable. The proposition *loses its status as a hinge* through a revolutionary change in the world-picture. Only *after* this shift can it be treated as an ordinary empirical claim (if it survives at all).

  **In essence:** Wittgenstein treats hinges as possessing a *contextual, pragmatic necessity*. They are functionally indubitable and foundational *within a specific historical and practical context*, making them unlike ordinary empirical claims. However, this necessity is not logical or eternal. The river-bed metaphor captures the crucial point that the *content* occupying this foundational role is fluid, changing over time as our world-picture evolves. What is "necessary" (i.e., functionally foundational) at Time A can become contingent and testable at Time B. This fluidity is precisely why they are *not* necessary truths in the traditional philosophical sense – their necessity is tied to their role in our living practices, not to their inherent logical structure or relation to reality. Their certainty is the certainty of action and background, not the certainty of logical deduction.
