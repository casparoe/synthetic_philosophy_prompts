answer: |-
  The gaslight hissed in its globe, painting the small parlor in shades of amber and gloom. Henry Sidgwick shifted in the overstuffed armchair, its velvet worn thin by countless sitters before him. Across the small, polished table sat Mrs. Thorne, her face a pale moon in the dimness, eyes closed, hands resting palms-down on the wood. The air hung thick with the scent of beeswax, stale lavender, and something else – an electric stillness, or perhaps just anticipation curdling into dread.

  *Another sitting.* The thought, worn smooth as river stone, carried its familiar weight. Nearly twenty years now. Twenty years of darkened rooms, whispered promises, and the cold, meticulous dissection of hope. He adjusted his spectacles, the gesture grounding him in the physical world – the grain of the table, the faint chill seeping through the windowpane, the pressure of his own ribs against his waistcoat. *Scrupulous, self-doubting rigor.* It was his armour, his burden, his only compass in this fog.

  Mrs. Thorne inhaled deeply, a theatrical sigh. Sidgwick noted it. Habitual. Unnecessary for genuine trance, according to his notes on Mrs. Piper and the others. His mind, unbidden, flickered to the *dualism*. That unyielding knot in his ethical system. Reason demanded virtue for its own sake, but practical reason, the engine of human action, craved happiness. Only the prospect of ultimate justice, of rewards and punishments *beyond*, could reconcile them. Without evidence of survival… morality became a beautiful, perhaps unsustainable, edifice built on shifting sand. The ache of that unresolved tension was a constant companion, sharper tonight in this charged atmosphere.

  A faint tremor ran through the table. Sidgwick’s fingers, resting lightly beside Mrs. Thorne’s, felt it. *Subconscious muscular movement? Vibrations from the street?* He catalogued possibilities, his gaze fixed on the point where the tremor originated. Mrs. Thorne’s eyelids fluttered.

  "Someone… someone approaches," she murmured, her voice lower, rougher than her usual genteel tone. "A presence… confused… seeking…"

  Sidgwick’s pulse, annoyingly, quickened. *Desire.* That was the enemy. The hunger for proof, a gnawing thing beneath the scholar’s calm. He wanted, with a fierceness that sometimes startled him, for the trembling table to levitate, for a voice to speak undeniable truths from the ether. To silence the doubt, to vindicate the decades of searching, to offer *something* solid against the terrifying void implied by his own philosophy. He *wanted* Mrs. Thorne to be genuine.

  The tremor intensified. A distinct *rap* sounded on the table leg, then another. Sidgwick leaned forward infinitesimally. *Rhythm? Random?* He strained his ears, filtering out the hiss of the gas, the distant clop of hooves.

  "Arthur…" Mrs. Thorne breathed. "He says… Arthur…"

  Sidgwick froze. His younger brother, Arthur, lost to typhus years ago. A common ploy – mediums often fished for names, exploited grief. Yet… the specificity, the suddenness? His analytical mind raced: *Could she know? Unlikely, but not impossible. Public records? Gossip?* He had been scrupulously private about his personal losses. The *pull* was almost physical. To believe, just for a moment, that Arthur’s spirit strained against the veil… It would be a balm, a key turning in the lock of the dualism.

  "Arthur?" Sidgwick’s own voice sounded dry, unnaturally loud in the stillness. "Is that you?"

  Mrs. Thorne’s head lolled. "Cold… water… so cold… remembers… the river…"

  Arthur had loved the Cam. Sidgwick’s throat tightened. *Coincidence? Lucky guess tapping into universal imagery of loss?* The *evidence* remained stubbornly ambiguous. His rigorous self demanded more. A code word? A detail only Arthur and Henry knew? He wouldn’t prompt her. That would invalidate it.

  "Does he… have a message?" Sidgwick asked, forcing neutrality into his tone.

  A long pause. The table shuddered again, then stilled. Mrs. Thorne whimpered. "Fading… light… fading… *C'est difficile…*" The French phrase, unexpected, hung in the air. Arthur spoke only English. *Inconsistency.* Sidgwick’s mind latched onto it, a lifeline thrown to his drowning hope. *A fragment from Mrs. Thorne’s own memory? A theatrical flourish?*

  The moment passed. Mrs. Thorne slumped, breathing heavily, then blinked, returning to herself with a look of gentle concern. "Professor? Did… did anything come through? I felt a presence, quite strongly."

  Sidgwick sat back, the worn velvet pressing against his spine. The familiar exhaustion washed over him, deeper than physical tiredness. It was the exhaustion of the perpetual threshold. He had felt the pull, the desperate yearning to cross over into belief, to grasp the offered solace. He had also felt the immovable wall of his own intellectual honesty, the refusal to accept anything less than demonstrable proof. The séance hadn’t provided it. It never did. Not conclusively.

  "Some phenomena were observed, Mrs. Thorne," he said, his voice carefully modulated, the voice of the SPR report yet to be written. "Table movements. Verbal utterances. As always, they require careful analysis against possible alternative explanations – involuntary motor action, sensory cues, subconscious dramatization."

  He saw the flicker of disappointment in her eyes, quickly masked. She wanted validation too. Everyone in these rooms did. They all craved certainty.

  Walking home through the damp Cambridge streets, the collar of his coat turned up against the chill, Sidgwick carried the unresolved weight. The gaslit windows of colleges glowed like promises he couldn't quite believe in. The encounter with "Arthur" replayed – the pang of recognition, the chilling phrase about cold water, the jarring French. *Could it have been?* The question echoed, unanswered. The hunger for proof remained, a dull ache beneath his ribs. But the refusal, the scrupulous, self-doubting rigor, stood firmer. To declare evidence conclusive where doubt persisted would be a betrayal – of reason, of the very ethics he sought to ground.

  He reached his doorstep, fumbling for his key. The night was vast, silent, offering no answers. The dualism of practical reason remained, a philosophical chasm unbridged by the faint rappings in a darkened room. He had sought a signpost to eternity and found only another question mark, shimmering ambiguously in the gaslight and the gloom. He turned the key. The door opened onto silence, and the familiar, heavy work of unresolved thought. Nothing was settled. Nothing, perhaps, ever could be.
