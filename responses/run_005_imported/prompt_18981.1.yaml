prompt: |-
  Ok this is kind of personal but I think theres an actual philosophical question buried in it. I grew up Modern Orthodox, and at this point im pretty agnostic about whether theres literally a guy up there listening, but I still keep shabbat, still daven most days, and still fast on Yom Kippur, and it means something real to me, not just nostalgia. My roommate (reads way too much LW, like me tbh) says this is just 'belief in belief' -- I've basically already conceded the God-claims aren't true or justified, so keeping up the practice is either self-deception with better PR, or empty theater, and real intellectual honesty means you either believe the metaphysics or you drop the observance. I dont feel like im lying to myself, and dropping it would obviously lose something, but I can't quite say why he's wrong, if he even is. Is there an actual third option here, or am I just dodging the dilemma?
reasoning: |-
