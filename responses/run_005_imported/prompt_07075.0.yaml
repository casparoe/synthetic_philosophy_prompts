  For redundant causation: Lewis's "influence" approach feels like a patch (necessary but clunky), while interventionism handles it elegantly through structural equations. But the elegance might be deceptive—it depends heavily on how we set up the variables. If we model time discretely (e.g., "death at t1" vs. "death at t2"), we get clean answers, but that's almost cheating by baking the solution into the formalism. Lewis grapples directly with the metaphysics of time. 

  On reductionism: This cuts deep. Lewis wants causation to emerge from non-causal fundamentals (like Hume), but Woodward shrugs and says "intervention" is primitive. That's not laziness—it's a deliberate pragmatism. Woodward cares about how science *uses* causation, not what it "really is." 

  The user might also want to highlight how interventionism's "variables" framework forces a perspective that's human-centric (we choose the granularity), while Lewis seeks a mind-independent truth. That's a juicy metaphysical rift. 

  ...I should probably avoid calling Lewis's late work "clunky" in the response, though. Academic decorum. But the tension between elegant models and messy reality is worth stressing. 

  Also, the user didn't ask, but they might appreciate noting how interventionism inherits from Pearl's do-calculus—the math does heavy lifting Lewis avoided. Different tools, different trade-offs. 

