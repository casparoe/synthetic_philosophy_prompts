answer: |-
  Here are 10 interview questions designed to push beyond restatement and engage the core challenges for non-cognitivist/assertability-only views of indicative conditionals, with targeted follow-ups:

  1.  **Core Challenge - Triviality & Universality:** "Your view avoids Lewis's triviality result by denying conditionals have truth conditions. But Lewis's result shows that equating P(If A, B) with P(B|A) *across a whole family of possible credence functions* (not just one person's current state) leads to absurdity if conditionals have truth conditions. Why is it a *fair* or *necessary* requirement for a semantic theory to demand that this equation hold *across all possible credence distributions*, rather than just reflecting how a particular speaker evaluates the conditional *in their own state*? Isn't demanding universality across credences smuggling in an assumption about objective truth conditions that your view rejects?"  
      *   *Likely Reply & Follow-Up:* (If she says universality is an unfair imposition): "But doesn't semantic competence require that speakers understand what would make the conditional true *in principle*, even if they lack specific credences? If the meaning of 'If A, B' is *solely* defined by how it updates the speaker's current credence in B given A, how can two speakers with different credence functions ever genuinely *disagree* about the truth of the same conditional claim? Doesn't your view collapse meaning into individual psychology?"

  2.  **Collapse Mechanism:** "Can you walk us through, step-by-step, *why* Lewis's requirement that P(A>B) = P(B|A) must hold for *all* probability functions defined on the same algebra forces the conditional to be equivalent to the material conditional if it has truth conditions? Specifically, how does considering *conditioning on C* (where C is incompatible with A) lead to the contradiction?"  
      *   *Likely Reply & Follow-Up:* (After explanation): "Exactly. So the core pressure point is that *learning new information* (C) that screens off A forces P(A>B) down an unacceptable path. How does your assertability-only view *explain the dynamic aspect* of how we update our evaluation of 'If A, B' when we learn C? Does assertability *itself* obey the same probability calculus that forces the collapse for truth-conditional views?"

  3.  **Compositionality - Negation:** "One of the strongest objections to non-cognitivist views is embedding, especially under negation. Consider: 'It's not true that if the Fed raises rates, the market will crash.' On your view, since 'If the Fed raises rates, the market will crash' has no truth value, what could the negation possibly be negating? What proposition is expressed by the whole negated sentence?"  
      *   *Likely Reply & Follow-Up:* (If she appeals to denying assertability): "So you'd say 'It's not true that if A, B' means 'It's not assertable that if A, B'? But then we get: 'It's not assertable that if A, B' is assertable iff P(B|A) is not high. However, the *intuitive* content of 'It's not true that if A, B' seems closer to the claim that P(not-B | A) is high. How does your account capture that crucial difference? Doesn't equating 'not true that (if A, B)' with 'not assertable that (if A, B)' misrepresent the logical force of negation here?"

  4.  **Compositionality - Disjunction:** "Let's tackle disjunction: 'Either the package is lost, or if it arrives today, it's damaged.' This seems perfectly intelligible. But if 'if it arrives today, it's damaged' lacks a truth value, how does it contribute to the truth conditions (or assertability conditions) of the disjunction? What does the whole disjunction express?"  
      *   *Likely Reply & Follow-Up:* (If she uses Adams's probabilistic logic or similar): "Adams suggests the assertability of 'A or (B>C)' is high when P(A) + P(C|B)*P(not-A) is high, avoiding truth values. But doesn't this feel like a technical *fix* rather than an *explanation*? Does this account genuinely reflect how ordinary speakers *understand* the meaning of such disjunctions, or is it just preserving coherence within the system?"

  5.  **Gibbard's Sly Pete - Motivation:** "Gibbard's Sly Pete case is often cited as a key motivation for non-cognitivism. Two experts, Karen and Sid, know all the facts relevant to whether Sly Pete will call or fold. Karen knows Pete is bluffing, so asserts 'If Pete calls, he'll lose.' Sid knows Pete has the winning hand, so asserts 'If Pete calls, he'll win.' They can't both be right if conditionals have truth conditions. How does your view resolve this?"  
      *   *Likely Reply & Follow-Up:* (She'll say each is correctly reporting their epistemic state via conditional probability): "But doesn't this make the *content* of the conditional radically subjective? If Karen says 'If Pete calls, he'll lose' and Sid says 'If Pete calls, he'll win', are they even *disagreeing* about the *same thing*? If not, what prevents communication breakdown? If they *are* disagreeing, what is the object of their disagreement if not a shared proposition?"

  6.  **Gibbard's Sly Pete - Shared Knowledge:** "Building on Sly Pete: Suppose a *third party*, Chris, knows *everything* Karen and Sid know – Chris knows Pete is bluffing *and* has the winning hand (it's a trick deck!). Chris knows with certainty that Pete *will* call. What should Chris say about 'If Pete calls, he'll win' and 'If Pete calls, he'll lose'? Does Chris's omniscience reveal a problem for tying assertability *only* to conditional probability, or does it bolster your case?"  
      *   *Likely Reply & Follow-Up:* (She might say Chris knows P(win|call)=1 and P(lose|call)=0, so can assert one and deny the other): "But Chris knows the *facts* that make it impossible for Pete to call and lose *or* call and win? Chris knows the outcome is fixed. Isn't Chris more likely to say 'When Pete calls, he will win' (a simple future prediction), making the *conditional* form inappropriate? Doesn't the conditional form inherently signal *epistemic contingency* that Chris lacks, suggesting its core function is epistemic, not truth-conditional?"

  7.  **Beyond Assertability - Reasoning & Logic:** "If indicative conditionals don't express propositions, how do we account for seemingly valid patterns of reasoning involving them? For instance, Modus Ponens: Believing 'If A, B' and believing A seems to compel belief in B. How does this compulsion work if 'If A, B' isn't a belief *that something is true*, but merely a high conditional probability?"  
      *   *Likely Reply & Follow-Up:* (She might appeal to probabilistic constraints or norms of coherence): "But doesn't this reduce logic to psychology? On a truth-conditional view, Modus Ponens is valid *because of the meaning of the connectives* and guarantees truth preservation. What guarantees the *correctness* of your probabilistic 'validity'? Is it just that incoherent agents are irrational, or is there a deeper semantic foundation?"

  8.  **The Role of Truth - Pragmatic Utility?:** "You deny truth conditions for indicative conditionals. Yet, we constantly treat them *as if* they were true or false in everyday discourse, science, and law. Is this just a massive, systematic error? Or is there a pragmatic *utility* in pretending they have truth values that your view can explain, even while denying their reality?"  
      *   *Likely Reply & Follow-Up:* (She might emphasize the functional role of tracking conditional probability): "Doesn't this 'pretense' become indistinguishable from *actually* having truth conditions in practice? If the pretense is so robust and functionally identical to having truth conditions for all practical purposes, what substantive difference does denying the truth conditions actually make?"

  9.  **Jackson's Robustness - Rival or Redescription?:** "Frank Jackson defended a hybrid view: conditionals *have* truth conditions (the material conditional), but their *assertability* requires high conditional probability *plus* robustness (the probability remains high if A is learned). Isn't this just your non-cognitivist view wearing a truth-conditional costume? The truth condition (A⊃B) does no work in explaining assertability or use; the conditional probability and robustness do all the lifting. Is Jackson offering a genuine rival account, or merely a notational variant that preserves truth conditions only nominally?"  
      *   *Likely Reply & Follow-Up:* (She might argue Jackson concedes the key point about assertability): "But Jackson *insists* the truth condition is there, even if idle for assertion. Doesn't this allow him to handle embedding and logic in a way your view struggles with? Is preserving a vestigial truth condition, even if pragmatically inert for assertion, a price worth paying to maintain compositionality and a standard logic, or is it an incoherent half-measure?"

  10. **The Bigger Picture - Cost vs. Benefit:** "Stepping back: Denying propositions to indicative conditionals avoids triviality and handles Sly Pete neatly, but forces complex, non-standard accounts of embedding, logic, and disagreement. Truth-conditional views preserve standard semantics and logic but crumble under triviality and Sly Pete. Jackson's hybrid preserves truth conditions formally but makes them pragmatically inert. Weighing these trade-offs, what do you see as the *strongest positive argument* that your assertability-only view provides the *best overall balance* in explaining the full range of linguistic phenomena involving conditionals, despite its costs?"

  **Key to Follow-Ups:** These are designed to anticipate common defenses and push the guest to:
  *   Confront the *semantic* (not just pragmatic) implications of universality requirements (Q1-2).
  *   Grapple with the *explanatory burden* of compositionality head-on (Q3-4).
  *   Examine the *communicative and intersubjective* challenges of radical subjectivity (Q5-6).
  *   Address the *normative foundations* of reasoning without truth (Q7).
  *   Evaluate the *practical reality* of denying truth (Q8).
  *   Engage directly with a major competing framework on its merits/demerits (Q9).
  *   Synthesize the argument (Q10).

  This line of questioning forces the guest beyond the initial statement of "assertability = conditional probability" and into the deep waters of justification, consequence, and comparison. Good luck with the podcast!
