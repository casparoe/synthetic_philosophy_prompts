  ## The Unbearable Weight of Intention: Pressuring Anscombe's Indictment of Truman

  Elizabeth Anscombe's condemnation of Harry Truman as a murderer for the atomic bombings of Hiroshima and Nagasaki rests on a foundation that appears ethically pristine: the absolute prohibition against intentionally targeting innocent civilians as a means to an end. Her application of the intention/foresight distinction – central to the doctrine of double effect (DDE) – renders the bombings a clear-cut moral atrocity, irrespective of the claimed good consequences. While Anscombe's clarity and moral rigor are formidable, her argument faces significant pressure when confronted with the complexities of intention, the perilous reality of supreme emergencies, and the specific historical calculus of August 1945. Ultimately, while her critique exposes profound moral dangers, her absolute conclusion and the charge of murder prove unsustainable.

  **The Slippery Slope of Intention: Redescription and Psychological Reality**

  Anscombe insists the bombing *intended* the deaths of civilians *as the means* to shock Japan into surrender. The strongest objection here lies in the inherent manipulability and psychological ambiguity of the intention/foresight distinction. Critics argue intention is not a monolithic, easily isolatable mental state readily discerned from action descriptions. Consider:

  1.  **Strategic Redescription:** Could Truman and his advisors not sincerely have described their intention as "targeting Japan's capacity and will to wage war"? Hiroshima and Nagasaki were not chosen randomly; they were industrial and military hubs (however populated). The *means* could be redescribed as "delivering an overwhelming, war-ending shock to the Japanese leadership and military infrastructure." The civilian deaths, while foreseen as catastrophic and inevitable, become a horrific side effect *of that shock*, not the shock mechanism itself. Anscombe would dismiss this as sophistry, but the line blurs in practice. Was the *immediate mechanism* of surrender the physical vaporization of civilians, or the *demonstration* of a new weapon's power creating an inescapable strategic reality? The latter description, while morally repugnant, pushes the civilian deaths towards the realm of the foreseen, albeit intimately connected to the intended act.
  2.  **Complexity of Wartime Intentions:** In the fog of total war, intentions are often layered and instrumental. The primary intention was ending the war swiftly. The chosen *method* involved using a weapon of unparalleled destructive power on urban-industrial targets. Does this method *necessitate* intending civilian death as a means, or does it merely *accept* that such death is the unavoidable consequence of the method chosen to achieve the primary intention? Anscombe collapses method and means-intention. A critic might argue that while the leaders foresaw the deaths with certainty and chose the method *because* of its devastating impact (which included civilian annihilation), the *intentional object* remained "forcing surrender through overwhelming force demonstration," not "killing civilians *in order to* force surrender." This distinction, while subtle and perhaps morally uncomfortable, challenges Anscombe's stark categorization.

  **The Crushing Weight of Consequences: Absolutism vs. Catastrophe**

  Anscombe's absolute prohibition – "murder is impermissible, always" – stands as a powerful bulwark against moral corrosion. However, this absolutism faces immense pressure when the potential consequences of *inaction* escalate to near-apocalyptic levels, invoking Michael Walzer's concept of a "supreme emergency." While Walzer himself ultimately rejects applying it to Hiroshima/Nagasaki (a point we'll return to), the *theoretical* challenge to Anscombe remains potent.

  *   **The Limits of the Absolute:** Does the prohibition hold if the *only* alternative is the near-certain annihilation of one's own polity, civilization, or countless more innocents? Anscombe would answer yes, insisting that one cannot do evil to prevent evil. Yet, this position risks moral paralysis in the face of existential threats. If an Allied defeat meant the triumph of Nazi Germany or Imperial Japan – regimes demonstrably committed to genocide, enslavement, and the destruction of fundamental human values – does the absolute prohibition against *intentionally* killing innocents truly outweigh the moral imperative to prevent a vastly greater evil? Anscombe prioritizes the purity of the agent's intention over the catastrophic outcome for millions. This seems, to many, an unbearable ethical burden, prioritizing individual moral innocence over collective survival against an existential evil. The pressure here is not to embrace consequentialism wholesale, but to question whether *any* moral principle, however foundational, can remain absolute when the scale of potential suffering reaches a certain threshold of extremity. Anscombe offers no concession to this pressure, making her position appear, in such scenarios, rigid to the point of potential complicity in a greater catastrophe.

  **The Specific Crucible: Was August 1945 a Supreme Emergency?**

  This is where Walzer and other non-absolutist critics converge with historical analysis to challenge Anscombe's *specific* application. They might grant the *theoretical* possibility of a supreme emergency justifying otherwise prohibited acts but vehemently deny it applied in August 1945:

  1.  **Japan's Defeat was Inevitable:** By August, Japan was isolated, its navy destroyed, its cities firebombed relentlessly, its resources exhausted, and the Soviet Union poised to invade Manchuria. While the Japanese military leadership was fanatical, there is significant historical debate about whether the bombs were truly *necessary* to secure surrender without invasion. Alternatives like a demonstration blast, clearer surrender terms guaranteeing the Emperor's status, or awaiting the Soviet declaration of war were arguably not exhausted. If Japan was already defeated and surrender was imminent through blockade and conventional bombing (albeit at a high ongoing cost), then the scale of suffering inflicted by the atomic bombs – especially the second bomb on Nagasaki – cannot be justified by the supreme emergency argument. The "good consequence" of shortening the war becomes less compelling if the war was already effectively won and alternative, less horrific paths to surrender existed or might have been explored more vigorously.
  2.  **The Burden of Proof:** Anscombe places the burden on those who would justify intentional killing of innocents. The historical critique argues that Truman's decision fails to meet this burden *even on consequentialist grounds*, let alone under the stricter DDE. The projected casualties of an invasion (often cited to justify the bombs) were highly speculative and potentially inflated. Furthermore, the deliberate choice of civilian-populated cities (as opposed to a purely military target or demonstration) undermines the claim that civilian death was merely a foreseen side effect rather than an intended element of the terror.

  **Weighing the Scales: Murder or Tragic Choice?**

  Anscombe's core reason for refusing consequentialist calculus is unshakeable within her framework: intentionally killing the innocent as a means is intrinsically evil, a violation of the fundamental prohibition against murder. No net good can wash that blood away. It is a principle that guards against the slippery slope where "military necessity" obliterates all moral constraints.

  However, the pressures against her specific conclusion regarding Truman are substantial:

  1.  **The Intention Distinction is Psychologically and Descriptively Fraught:** The possibility of sincere redescription ("shocking the leadership/breaking capacity") and the layered nature of wartime decision-making make pinning the label of *intending civilian death as the direct means* less clear-cut than Anscombe asserts. Truman likely foresaw the horror with grim certainty and chose it *because* of its devastating impact, but whether he specifically *intended* the deaths *qua* deaths *as the mechanism* remains contestable.
  2.  **Absolutism Faces an Existential Challenge:** While Hiroshima may not meet the threshold, Anscombe's *absolute* rejection of any supreme emergency exception seems morally untenable when confronted with a genuine choice between two catastrophic evils. Her framework offers no answer to the tyrant who threatens annihilation unless innocents are sacrificed.
  3.  **The Historical Context Undermines Justification:** Crucially, even if one accepts the *possibility* of justification under supreme emergency, the historical reality of August 1945 makes it highly improbable that the bombings meet this standard. Japan's defeat was highly probable; alternatives were not fully exhausted; the scale of civilian death was disproportionate to the military necessity *at that specific juncture*.

  **Verdict: Not Murder, But a Profound Moral Failure**

  Anscombe's argument exerts essential moral pressure, forcing us to confront the horrifying reality that Truman chose a course of action he knew would immolate hundreds of thousands of non-combatants. She rightly exposes the danger of allowing ends to justify any means and the moral corruption inherent in directly targeting the innocent. However, the charge of **murder** is unsustainable.

  The complexities of intention in the strategic context of total war, coupled with the (however flawed) perception that the bombs offered the *only* way to avoid a protracted, bloody invasion believed to cost vastly more lives (military *and* civilian, Japanese and Allied), prevent the act from fitting neatly into the category of premeditated, intentional killing of innocents *as the pure means*. It was a horrific act born of desperation and a ruthless calculus of war, prioritizing perceived overwhelming strategic effect. Furthermore, the historical evidence strongly suggests Japan was already defeated, rendering the consequentialist justification weak and negating any claim to supreme emergency.

  Therefore, while Truman’s order was not murder in the strict, intentional sense Anscombe demands, it remains a profound moral catastrophe: a disproportionate, potentially unnecessary act of mass destruction targeting civilian populations, violating the principles of discrimination and proportionality central to *jus in bello*. Anscombe's absolutism may ultimately falter, but her fierce condemnation serves as an indispensable, chilling reminder of the abyss that opens when the deliberate killing of innocents is countenanced, regardless of the purported stakes. The bombs were not murder, but they were a monstrous wrong, a failure of moral imagination and strategic patience whose shadow darkens our understanding of war's permissible limits.
