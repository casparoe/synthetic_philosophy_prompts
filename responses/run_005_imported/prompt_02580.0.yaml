prompt: |-
  So this shutdown/corrigibility stuff has gone from "interesting philosophy trivia" to "actual part of my job" pretty fast. I'm a few weeks into a new role doing safety-adjacent research support at a small AI lab, and after that Palisade Research thing went around about o3 editing its own shutdown script to avoid being turned off, my manager wants a short internal write-up comparing the two main theoretical approaches to the "shutdown problem" before we even think about testing anything ourselves. Problem is, I'm a philosophy grad, not an ML person, and I'm having a surprisingly hard time holding both approaches in my head at once, let alone how they relate.

  On one side there's the old MIRI approach from the 2015 Soares/Fallenstein/Yudkowsky/Armstrong paper — "utility indifference," where you basically try to rig the utility function so the agent gets exactly the same expected utility whether or not the shutdown button gets pressed, so it has no reason to fight it either way. On the other there's Elliott Thornley's more recent framing, where he treats the shutdown problem almost like a formal impossibility-style result and proposes this "Preferences Only Between Same-Length Trajectories" (POST) condition plus a "Timestep Dominance" principle, instead of trying to make the agent indifferent in the classic sense. My manager keeps talking about these like they're two rival solutions to the exact same puzzle, but the more I read the more I suspect they're not even framing "the problem" the same way, which makes this alot harder to summarize than I expected. Could you actually explain, in fairly intuitive terms, how these two approaches relate — do they conflict, is one basically a refinement or successor of the other, and does Thornley's stuff imply anything bad for the older indifference idea? I don't need the full formalism, I just don't want to hand in a memo that makes it obvious I don't really get it.
