answer: |-
  The desert highway unspooled like a black ribbon under the truck’s high beams, the only punctuation the rhythmic thump of tires on expansion joints and the low drone of the engine. Inside the cab, the glow of the dashboard instruments painted Vera and Nadia in shades of green and amber. Vera watched the endless scrub flicker past, the silence thickening after Nadia’s pronouncement.

  "Parfit's hitchhiker," Vera finally said, her voice cutting through the hum. "That's the shape of it, isn't it?"

  Nadia’s grip tightened slightly on the wheel, her eyes never leaving the road. "You know the thought experiment. Good. Saves time. Means you understand why I’m… skeptical."

  "Because according to the cold calculus," Vera continued, leaning her head against the cool window glass, "once we hit town, the ride’s done. Cost sunk. Paying me back nets me nothing, costs you fifty bucks. Rational self-interest says keep the cash. Why should I believe your promises now will override that logic later?"

  "Exactly," Nadia stated, her tone flat, pragmatic. "Promises made under duress, or even just convenience, evaporate when the incentive structure flips. It’s not malice. It’s *rationality*. Causal decision theory. You maximize expected utility given the causal structure *at the moment of choice*. In town, the causal structure screams ‘keep the money.’ Believing otherwise isn’t hard-nosed; it’s naive. I’ve got the data points." She tapped the steering wheel for emphasis.

  Vera shifted, turning to face Nadia more directly. The dashboard light caught the sharp planes of her face. "But that’s where it gets interesting. What if rationality isn't just about maximizing *in the isolated moment*? What if the truly rational move was made back there, on the roadside, in the dark?"

  Nadia snorted softly. "Deciding to be a sucker?"

  "Deciding to be the *kind of person* who honors commitments," Vera countered, her voice gaining intensity. "Not because it feels good in the moment, but because that’s the policy that gets you picked up in the first place. Gauthier’s constrained maximizer. McClennen’s resolute choice. You *precommit* to the path. Reopening the question in town isn’t clear thinking; it’s evidence you *never really made that foundational decision*. It’s backtracking, surrendering to momentary impulse disguised as reason."

  The truck roared past a skeletal Joshua tree, its shadow clawing briefly across the cab. "So rationality is just sticking to your guns, no matter what?" Nadia challenged, a sharp edge entering her voice. "Even when the situation changes? That sounds less like reason and more like… rationalized stubbornness. ‘I should keep it because I decided to’ – that’s a tautology, not an argument. It ignores the actual costs and benefits staring you in the face when the time comes."

  "It’s not ignoring them," Vera insisted, leaning forward. "It’s recognizing they were *already factored in* at the point of policy adoption. The cost of paying you back *was part of the calculation* when I decided, stranded and desperate, that becoming someone trustworthy was my best long-term strategy. Re-evaluating *now* throws away that initial rational commitment. It fractures your agency across time. You become a different person in town than you were at the roadside – and which one is the ‘rational’ you? The one who wanted a ride, or the one who wants to keep fifty bucks?"

  "And what if the ‘policy’ was a bad one?" Nadia shot back. "What if, in the cold light of Main Street, it’s blindingly obvious keeping the cash *is* the better move? Your ‘constrained maximizer’ just blindly follows a stupid rule?"

  "It’s not blind!" Vera’s frustration was palpable. "It’s recognizing that the *capacity* to make and keep such commitments *is* the valuable thing. The policy *isn't* ‘pay Nadia’. The policy is ‘be the sort of agent whose commitments are credible’. That policy only works if you stick to it *even when* a single instance seems suboptimal. Otherwise, you’re just… well, you. Someone nobody should rationally trust, precisely *because* you’ll defect when it’s convenient."

  Nadia was silent for a long moment, the only sound the engine and the rushing wind. The first faint glow of distant town lights appeared on the horizon, a smudge of orange against the black.

  "You think I don't see the paradox?" Nadia said quietly, her voice tight. "My own theory… it *wants* everyone else to be the constrained maximizer you describe. The trustworthy one. Because *that* would make *my* life easier, safer. People would help me if I were stranded. But according to that same theory, *I* shouldn't be one. Because *I* pay the cost of trustworthiness, while others reap the benefit of my naivety. My theory says the world *needs* saints, but tells *me* not to be one. And it tells me not to trust anyone else who claims they are." She glanced at Vera, her expression unreadable in the dim light. "So what am I supposed to do? Gamble on being the exception? The data says otherwise."

  Vera met her gaze. "Maybe rationality isn't just about individual moves in isolation. Maybe it's about the kind of game you're playing, the kind of world you're building. Constrained maximization isn't about being a saint; it's about being a reliable player in a repeated game. But you're right. The first move is terrifying. It requires faith that the policy works *because* others adopt it too. And your theory," she gestured vaguely towards Nadia, "actively discourages that adoption. It’s a trap. It tells everyone to defect, ensuring a world where trust is impossible, making the initial defection *seem* rational… but only because the theory poisoned the well."

  Nadia didn’t answer immediately. The town lights grew brighter, resolving into distinct street lamps and the outlines of buildings. The end of the desert run. She slowed the truck slightly.

  "So," Vera asked, her voice low, "do you pull over here? Forty miles wasn't enough to solve decision theory."

  Nadia stared straight ahead, her knuckles white on the wheel. The silence stretched, filled only by the slowing rhythm of the engine and the encroaching hum of the town. The philosophical standoff mirrored the physical one: trust versus calculation, commitment versus consequence, the promise made in the dark versus the logic of the light.

  "I don't know," Nadia finally said, her voice barely above a whisper, thick with the weight of the unsolved paradox and the approaching, illuminated streets. "I just... don't know."

  The truck didn't stop, but it didn't speed up either. It rolled forward, carrying them both, and their unresolved argument, into the lit grid of the town, the desert's vast, dark indifference receding behind them. The meter of trust was still running, its final tally uncertain, payment hanging in the air between them, as heavy and unspoken as the night they’d left behind.
