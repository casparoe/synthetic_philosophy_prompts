  We are going to create two groups: Group A (say, white defendants) and Group B (say, Black defendants) with different base rates for recidivism (the binary outcome).

  Let:
  - Group A (white defendants): 20 people, with a lower base rate of recidivism.
  - Group B (Black defendants): 20 people, with a higher base rate of recidivism.

  We will assign risk scores and then a binary classification (high-risk or low-risk) to each person.

  We want to show that if we require the same positive predictive value (PPV) for both groups, then we cannot have both equal false positive rates (FPR) and equal false negative rates (FNR). In fact, we will see that the false positive rates and/or false negative rates must differ.

  Recall:
  - Positive Predictive Value (PPV) = TP / (TP + FP) [proportion of high-risk classified who actually reoffend]
  - False Positive Rate (FPR) = FP / (FP + TN) [proportion of non-reoffenders classified as high-risk]
  - False Negative Rate (FNR) = FN / (FN + TP) [proportion of reoffenders classified as low-risk]

  We are going to set up a scenario where we force the PPV to be the same for both groups. Then we will compute the FPR and FNR and see that they cannot be equal.

  Step 1: Choose base rates.
  Let:
    Group A: base rate = 40% (so 8 out of 20 reoffend, 12 do not).
    Group B: base rate = 60% (so 12 out of 20 reoffend, 8 do not).

  Step 2: We need to assign classifications. We are free to choose the classifier as long as we have the same PPV for both groups.

  We will set the same PPV for both groups. Let's choose PPV = 0.75.

  For Group A:
    We have 8 reoffenders (positives) and 12 non-reoffenders (negatives).
    Let TP_A = true positives (reoffenders classified as high-risk) and FP_A = false positives (non-reoffenders classified as high-risk).
    We require: PPV_A = TP_A / (TP_A + FP_A) = 0.75.

    So: TP_A = 0.75 * (TP_A + FP_A)   =>   TP_A = 0.75 * (TP_A + FP_A)
    => 0.25 * TP_A = 0.75 * FP_A   =>   TP_A = 3 * FP_A.

    Also note that the maximum TP_A is 8 and the maximum FP_A is 12.

    Let's choose FP_A = 4, then TP_A = 12? But wait, we only have 8 reoffenders. So we cannot have TP_A=12.

    Instead, we must choose a feasible pair. We have two constraints:
      TP_A <= 8
      FP_A <= 12

    And TP_A = 3 * FP_A.

    So let FP_A = 2, then TP_A = 6. Then:
      Total high-risk = TP_A + FP_A = 8.
      PPV_A = 6 / (6+2) = 6/8 = 0.75. Good.

    Then:
      False negatives (FN_A) = total reoffenders - TP_A = 8 - 6 = 2.
      True negatives (TN_A) = total non-reoffenders - FP_A = 12 - 2 = 10.

    So for Group A:
      TP_A = 6, FP_A = 2, FN_A = 2, TN_A = 10.

    Then:
      FPR_A = FP_A / (FP_A + TN_A) = 2 / (2+10) = 2/12 = 1/6 ≈ 0.1667.
      FNR_A = FN_A / (FN_A + TP_A) = 2 / (2+6) = 2/8 = 0.25.

  For Group B:
    We have 12 reoffenders and 8 non-reoffenders.
    We require PPV_B = 0.75.

    Let TP_B = true positives and FP_B = false positives.
    Then: TP_B / (TP_B + FP_B) = 0.75  =>  TP_B = 3 * FP_B.

    Constraints: TP_B <= 12, FP_B <= 8.

    Choose FP_B = 4? Then TP_B = 12? But then:
      Total high-risk = 12+4=16, which is possible (but we only have 20 people, and 12+8=20, so 16 high-risk is acceptable?).

    However, note that if we set FP_B=4, then TP_B=12. Then:
      FN_B = 12 - 12 = 0? (because we have 12 reoffenders and we got all of them).
      TN_B = 8 - 4 = 4.

    Then PPV_B = 12 / (12+4) = 12/16 = 0.75. Good.

    Then:
      FPR_B = FP_B / (FP_B + TN_B) = 4 / (4+4) = 4/8 = 0.5.
      FNR_B = FN_B / (FN_B + TP_B) = 0 / (0+12) = 0.

  Now compare:
    Group A: FPR_A = 1/6 ≈ 0.1667, FNR_A = 0.25.
    Group B: FPR_B = 0.5, FNR_B = 0.

  We see that the false positive rates (FPR) are different: 0.1667 vs 0.5.
  Also the false negative rates (FNR) are different: 0.25 vs 0.

  Therefore, we cannot have both FPR and FNR equal across the two groups when we enforce the same PPV and the base rates are different.

  But note: we could have chosen different numbers for Group B to achieve PPV=0.75? Let's try to see if we can get the FPR and FNR closer? However, we must have TP_B = 3 * FP_B and also the constraints.

  Alternatively, we might try to set FP_B=2. Then TP_B=6. Then:
    Total high-risk = 6+2=8.
    Then FN_B = 12 - 6 = 6, and TN_B = 8 - 2 = 6.
    Then PPV_B = 6/(6+2)=0.75 (same).
    Then FPR_B = 2/(2+6)=2/8=0.25, and FNR_B=6/(6+6)=0.5.

  Now compare:
    Group A: FPR_A=1/6≈0.1667, FNR_A=0.25.
    Group B: FPR_B=0.25, FNR_B=0.5.

  Still, both FPR and FNR are not equal. And note that in Group A we had FPR_A≈0.1667 and in Group B we have 0.25. Also FNR_A=0.25 and FNR_B=0.5.

  We cannot get both FPR and FNR to be equal in both groups.

  General condition for the tension to disappear:
  The impossibility result holds when the base rates (prevalence) are different. If the base rates were the same, then it would be possible to have both equal PPV and equal FPR/FNR (in fact, the same classifier would work equally well for both groups). Also note that if the classifier were perfect (with no errors) then all rates would be equal, but that is only possible if the base rates are the same? Actually, even with different base rates, a perfect classifier would have PPV=1 in both groups, FPR=0 and FNR=0. But that requires that we have no false positives and no false negatives, which implies that we are correctly identifying every case. However, that is only possible if the underlying data is separable without error. In practice, this is not the case.

  But in our example, we have shown that when base rates differ, we cannot have both equal PPV and equal FPR/FNR.

  Now, the disagreement:
  - Your friend argued that a well-designed instrument could remove the disparity (in the false positive rates for non-reoffenders) while remaining calibrated (which I understand as having the same PPV? or perhaps calibration meaning that the risk score reflects the true probability?).

  In the context of the COMPAS controversy, ProPublica found that non-reoffending Black defendants were flagged as high-risk more often (i.e., higher FPR) than non-reoffending white defendants. They also found that the tool was not equally calibrated in terms of FPR and FNR. But the creators of COMPAS argued that the tool was calibrated in the sense that the risk scores corresponded to similar probabilities of recidivism across races (which is about calibration in the sense of expected vs observed events). 

  The impossibility result we are discussing (between PPV and FPR/FNR) is about two different fairness criteria: predictive parity (same PPV) and equalized odds (same FPR and same FNR). The example shows that when base rates differ, we cannot have both.

  Therefore, the disagreement between you and your friend might be about the possibility of achieving both simultaneously. The example shows that it is impossible without the same base rates. So if your friend insists that we can have both, she is factually wrong. But note: she might be talking about a different kind of calibration. 

  In the literature, there are multiple definitions of fairness. The tension we demonstrated is a well-known mathematical fact. Therefore, if she insists on having both predictive parity (same PPV) and equalized odds (same FPR and same FNR) in the presence of different base rates, that is impossible.

  But what if we drop one of the conditions? For example, we might design a classifier that achieves equalized odds (same FPR and same FPR) but then we will have different PPV. Or we might have the same PPV but then we cannot have the same FPR and FNR.

  So the disagreement might be about which fairness criterion to prioritize. That is a value judgment. 

  Thus, the initial part of the argument (about whether it is possible to have both) is a matter of fact (it is impossible when base rates differ). But the choice of which fairness criterion to use (and which one is more important) is a matter of values.

  Conclusion:
  - The example shows that with different base rates, requiring the same PPV leads to different FPR and FNR.
  - The tension disappears only when the base rates are the same, or when the classifier is perfect (which is unrealistic).
  - The disagreement was about both: a fact (the impossibility) and values (which fairness criterion is more important).
answer: |-
  Below is a constructed example with two groups of 20 people each, demonstrating the impossibility of simultaneously achieving equal positive predictive value (PPV) and equal false positive/negative rates (FPR/FNR) when base rates differ. I'll define the binary outcome as "recidivism" (1 = reoffends, 0 = does not reoffend) and use risk classifications (High/Low) to calculate confusion matrices.

  ### Groups and Base Rates
  - **Group A (Lower base rate)**: 20 people  
    Base recidivism rate = 40% → **8 reoffenders (positives)**, **12 non-reoffenders (negatives)**.  
  - **Group B (Higher base rate)**: 20 people  
    Base recidivism rate = 60% → **12 reoffenders (positives)**, **8 non-reoffenders (negatives)**.

  ### Classifier Setup
  We enforce **equal PPV (predictive parity)** for both groups. PPV is the proportion of high-risk individuals who actually reoffend (PPV = TP / (TP + FP)). We target PPV = 0.75 for both groups.  

  #### Group A Classifications (PPV = 0.75)
  - Total high-risk classifications: Must satisfy PPV = TP_A / (TP_A + FP_A) = 0.75.  
    Set:  
    - True positives (TP_A) = 6 (of 8 reoffenders correctly classified high-risk).  
    - False positives (FP_A) = 2 (of 12 non-reoffenders incorrectly classified high-risk).  
    → PPV_A = 6 / (6 + 2) = 6/8 = **0.75**.  
  - Remaining:  
    - False negatives (FN_A) = Total reoffenders - TP_A = 8 - 6 = **2** (reoffenders misclassified as low-risk).  
    - True negatives (TN_A) = Total non-reoffenders - FP_A = 12 - 2 = **10** (non-reoffenders correctly low-risk).  
  - **Rates for Group A**:  
    - FPR_A = FP_A / (FP_A + TN_A) = 2 / (2 + 10) = 2/12 ≈ **0.167** (false positive rate).  
    - FNR_A = FN_A / (FN_A + TP_A) = 2 / (2 + 6) = 2/8 = **0.25** (false negative rate).  

  #### Group B Classifications (PPV = 0.75)
  - Total high-risk classifications: Must satisfy PPV = TP_B / (TP_B + FP_B) = 0.75.  
    Set:  
    - True positives (TP_B) = 9 (of 12 reoffenders correctly classified high-risk).  
    - False positives (FP_B) = 3 (of 8 non-reoffenders incorrectly classified high-risk).  
    → PPV_B = 9 / (9 + 3) = 9/12 = **0.75**.  
  - Remaining:  
    - False negatives (FN_B) = Total reoffenders - TP_B = 12 - 9 = **3** (reoffenders misclassified as low-risk).  
    - True negatives (TN_B) = Total non-reoffenders - FP_B = 8 - 3 = **5** (non-reoffenders correctly low-risk).  
  - **Rates for Group B**:  
    - FPR_B = FP_B / (FP_B + TN_B) = 3 / (3 + 5) = 3/8 = **0.375** (false positive rate).  
    - FNR_B = FN_B / (FN_B + TP_B) = 3 / (3 + 9) = 3/12 = **0.25** (false negative rate).  

  ### Summary of Results
  | Group | PPV | FPR | FNR | Base Rate |
  |-------|-----|-----|-----|-----------|
  | A     | 0.75 | 0.167 | 0.25 | 40% |
  | B     | 0.75 | 0.375 | 0.25 | 60% |

  ### Key Observations
  1. **PPV equality holds** (0.75 for both groups).  
  2. **FPR is unequal**:  
     - Group A: 16.7%  
     - Group B: 37.5% (over 2× higher).  
  3. **FNR is equal** (0.25 for both) in this example, but this is coincidental. If we adjust the numbers (e.g., set TP_B=6 and FP_B=2 for Group B), FNR becomes unequal (FNR_B=0.5) while PPV remains 0.75. **Equality in both FPR and FNR is impossible** with different base rates.  

  ### General Condition for Resolving the Tension
  The tension between predictive parity (PPV equality) and error rate equality (FPR/FNR) disappears **only if**:
  - **Base rates are equal** across groups, or  
  - The classifier is **perfect** (no errors), which is unrealistic.  

  If base rates differ, mathematical trade-offs force a choice between fairness criteria. No classifier can satisfy all simultaneously.

  ### Resolving the Disagreement: Facts vs. Values
  - **Facts**: The example demonstrates an **impossibility theorem** from algorithmic fairness. Your point is mathematically correct: when base rates differ (as in COMPAS, where Black defendants had a higher observed recidivism rate), predictive parity (PPV) and equalized odds (FPR/FNR) conflict. ProPublica’s finding of unequal FPR for non-reoffenders is consistent with this.  
  - **Values**: Your friend’s belief that a "well-designed instrument" could eliminate disparities while preserving calibration **assumes base rates can be equalized** or **prioritizes PPV over error rates**. This is a normative choice. For example:  
    - If society values **avoiding disparities in false accusations** (i.e., FPR), we might accept unequal PPV.  
    - If **calibration** (matching risk scores to observed outcomes) is paramount, we might accept unequal FPR.  
    **The core disagreement is thus about values**: which fairness definition (PPV, FPR, FNR, etc.) should be prioritized when trade-offs are inevitable.  

  ### Conclusion
  The example validates your argument about the mathematical trade-off. However, your friend’s perspective reflects a value-based preference for which fairness criterion matters most. In real-world applications (like COMPAS), this tension necessitates transparent societal choices—not just technical fixes.
