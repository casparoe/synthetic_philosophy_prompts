answer: |-
  Your struggle cuts to the heart of a profound philosophical and psychological tension—one without easy answers, but rich with implications for how we live. Your friend's question exposes the flaw in treating responsibility as a binary switch ("product" vs. "agent"), and your insight about your own reliability being similarly shaped is crucial. Here’s a way to navigate this:

  ### Key Tensions in Your Situation:
  1. **The Illusion of Pure Agency**:  
     We experience ourselves as free agents making choices, yet neuroscience, psychology, and philosophy suggest our "choices" are deeply constrained by biology, upbringing, trauma, and unconscious patterns. Your brother’s failed attempts to change—despite genuine effort—highlight how willpower alone can’t override ingrained neural pathways formed over decades. His "this is who I am" isn’t necessarily an excuse; it may be his painful recognition of this reality.

  2. **The Trap of Moral Accounting**:  
     Your anger assumes a ledger: *I show up (good), he doesn’t (bad), therefore blame is deserved*. But if both your behaviors stem from conditioning (you rewarded for competence, him labeled "difficult"), this ledger collapses. Neither of you authored your initial programming. Holding him "responsible" in the punitive sense becomes like blaming a tree for growing crooked in poor soil.

  3. **The Paradox of Praise/Blame**:  
     If we can’t take full credit for our virtues (your reliability), can we assign full blame for flaws? This doesn’t negate responsibility—it redefines it. Responsibility becomes less about *deserving* blame/credit and more about *practical accountability*: acknowledging the impact of actions and committing to repair, regardless of origin.

  ### A Path Forward (Practical Philosophy):
  - **Shift from "Why?" to "What Now?"**:  
    Instead of demanding your brother "choose" to be different (which traps you both in futility), focus on *functional solutions*. Example:  
    *"I understand showing up consistently is hard for you. How can we structure this so Mom’s care isn’t disrupted? Could you handle finances/administrative tasks instead of visits? Or fund respite care when you cancel?"*  
    This bypasses the unresolvable "blame" debate and addresses the real problem: your mother’s well-being and your burnout.

  - **Reframe Your "Responsibility"**:  
    Your reliability is a strength, but it may also be a compulsion rooted in seeking validation. Ask: *Am I over-functioning to feel worthy?* Scaling back to a sustainable level isn’t "irresponsible"—it’s self-preservation. Let your brother face the natural consequences of his unreliability (e.g., Mom’s disappointment) rather than shielding him.

  - **Compassionate Accountability**:  
    Acknowledge your brother’s history *without* absolving him of impact:  
    *"I know your role in our family made this harder for you, and that wasn’t fair. But when you cancel last-minute, Mom feels abandoned, and I have to scramble. Can we problem-solve this together?"*  
    This separates explanation (his past) from present obligation (shared care).

  - **Revisit Therapy (With a New Goal)**:  
    Family therapy focused on *acceptance and adaptive strategies* may help more than rehashing blame. Look for a therapist skilled in:  
    - **Systems Theory** (how family roles perpetuate patterns),  
    - **Acceptance and Commitment Therapy (ACT)** (building values-based action despite ingrained patterns),  
    - **Solutions-Focused Brief Therapy** (pragmatic problem-solving).

  ### The Unsettling Truth You’ve Touched
  Yes, your line of thinking points to something real: **free will is far more constrained than we intuitively believe**. We *are* largely "products of what happened to us." Yet society requires us to act *as if* we have agency. The philosopher Daniel Dennett calls this "pragmatic free will"—we hold people accountable not because they’re metaphysically free, but because it’s necessary for a functional society. 

  **Where this leaves you**:  
  - Your anger is valid—it signals a boundary violation. But its *usefulness* lies in motivating change, not in proving moral superiority.  
  - You *can* insist on reliability in care arrangements—not because your brother "deserves blame," but because your mother’s needs are non-negotiable.  
  - Your reliability *is* admirable—not because you chose it freely, but because it creates tangible good in the world. Its origin doesn’t negate its value.  

  **In essence**: We are all shaped by forces beyond our control. Responsibility begins when we stop using that as an endpoint and ask: *"Knowing this, how will I respond?"* Your power lies not in forcing your brother to be someone he’s not, but in choosing how *you* engage with the reality of who he is—and who you are becoming in response.
