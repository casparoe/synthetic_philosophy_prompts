  3) Inquiry phase isn't equipped to resolve this - it needs deeper digging

  But the tone must remain neutral and procedural, not accusatory. Phrases like "competing explanations" and "unresolved questions" rather than "suspicious data". Crucially, the memo should frame escalation as the mechanism to properly evaluate both experts' theories, not an assumption of guilt.

