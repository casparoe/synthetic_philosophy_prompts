  What's tricky here is the policy threshold: "sufficient basis" for full investigation isn't the same as proof of misconduct. The memo needs to acknowledge the validity of both perspectives while making a defensible recommendation. I should avoid the trap of pretending one expert is "right" - instead, focus on why the unresolved conflict itself meets the threshold for escalation. 

