  Recalling Good's theorem, it states that for a rational Bayesian, more free information has non-negative expected value. But the subtleties include computational costs, model misspecification, and the cost of delaying decisions. The user mentioned avoiding obvious points like time and money, so focusing on computational infeasibility or model errors might work.

