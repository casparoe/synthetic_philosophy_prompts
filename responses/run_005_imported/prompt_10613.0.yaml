  I recall that in Prior's formalization:
  - Peirceanism rejects bivalence for future contingents, making "There will be a sea battle tomorrow" neither true nor false now. This preserves freedom but sacrifices excluded middle.
  - Ockhamism keeps bivalence (every proposition is true or false) but denies that present truth entails necessity. It handles this via "thin red lines" or actual futures.

  The user's LTL background helps here. In LTL we evaluate paths, but Aristotle's problem arises when we try to assign present truth to future contingents. That's why Prior moved to branching time logics. 

  For the software engineer's benefit, I should emphasize the computational analogs: Peirceanism is like saying "Fp" isn't evaluable until resolved, while Ockhamism is like having a default path. The excluded middle distinction matters because Peirceanism breaks LTL's law "Fp ∨ ¬Fp" at time t0, which might violate some verification properties.

  They might also be hinting at a deeper concern: which formalism is better for specification? Peirceanism avoids over-committing but weakens expressiveness; Ockhamism keeps full expressiveness but requires care with necessity operators. I should note that real model checkers often use Ockhamist-like semantics via the "actual path" abstraction.

