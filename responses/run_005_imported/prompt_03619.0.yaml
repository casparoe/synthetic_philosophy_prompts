prompt: |-
  I spent almost forty years as a physicist before I retired, and these days I've been slowly working through a pile of decision theory and philosophy books I always meant to get around to. A few weeks back I hit I.J. Good's old theorem on the value of information, and it's been rattling around in my head since. The gist, as I understand it: if your a Bayesian trying to maximize expected utility, and someone offers you a free look at some relevant evidence before you have to act, you should always take it -- at worst it changes nothing, since you can just go do whatever you would've done anyway, and at best it makes you switch to something better, so your expected payoff from looking can never be lower then your expected payoff from not looking. It's airtight as math, but I've been wondering how far it actually reaches once real human psychology is involved, and a dinner party a couple weeks ago handed me a live test case.

  Some friends of ours, a married couple, had done one of those mail-in ancestry-and-health DNA kits together for fun. Turns out the company doesn't just show you the Alzheimer's-risk result (the APOE4 variant) -- you have to click through an extra warning screen to see it. He clicked through right away. She thought about it for a minute and decided not to, and still hasn't. Over dessert this turned into a real argument, roughly in this order. (1) He said her decision doesn't hold up: the result is already sitting there computed, looking costs her nothing, and if it's bad news she can just carry on acting exactly as she would have anyway -- so there's no way she ends up worse off by looking. (2) She said "acting like you don't know" isn't a move you actually get to make once you know something -- you can't unknow it -- and since there's no proven way to lower your Alzheimer's risk either way, looking would just be pure dread with nothing on the other side of the ledger. (3) He came back with: she can't know in advance that nothing hangs on it -- if the result's bad, that's precisely when you'd want to lock in long-term-care insurance while you're still healthy on paper, or stop postponing the trips they keep saying they'll take "someday," so there's real decision-relevant value she'd be throwing away by refusing to look. (4) She said that even granting that, she watched her own uncle get tested years back, and the result didn't change a single thing he actually did -- he got the same insurance and took the same trips regardless -- while it hollowed out his mood for a decade before symptoms could even show up, and that if you count that hollowing-out as a real cost, then "the value of information is never negative" quietly stops being true.

  Neither of them gave an inch, and I've been going back and forth on it myself ever since. Could you go through the four moves one at a time (labeling each 1 through 4) and say who's got the better of it at each one, rather than just handing down an overall winner? I'm especially curious how far Good's theorem actually reaches here -- whether it settles things the way he thinks it does, whether she's onto a genuine limit on it, or whether they're both misapplying it in ways I haven't spotted -- and I'd like a short closing paragraph on anything you think both of them are missing.
reasoning: |-
  Okay, let me tackle this step by step. The user presents a complex debate about Good's theorem on the value of information, framed through a real-life disagreement between a couple about viewing genetic Alzheimer's risk results. 

  First, I need to parse the core arguments. The husband (point 1) claims refusing information defies rational choice theory since worst-case scenario you can ignore it. The wife (point 2) counters that psychological costs break the theorem's assumptions. Their subsequent points escalate: he argues for potential instrumental value (insurance/trips), she cites observed psychological harm despite unchanged actions. 

  I recall Good's theorem relies on strict Bayesian rationality - it assumes agents can freely choose actions after updating beliefs, with utility functions unaffected by the information-gathering process itself. The wife's argument exposes two cracks: first, the theorem ignores affective costs (dread); second, it presumes information will influence instrumentally useful actions when no interventions exist. 

  For point 1: Husband is mathematically correct but psychologically naive. The "you can always ignore it" claim fails because humans can't voluntarily suppress knowledge - what philosophers call "the cognitive penetration problem". 

  Point 2: Wife wins this round. She identifies the theorem's blind spot: utility functions aren't static. Learning bad news may intrinsically lower wellbeing even without behavioral changes - a concept known as "experiential utility" in behavioral economics. 

  Point 3: Husband has a strong counter. If actionable decisions exist (insurance/trips), information has instrumental value. But this hinges on two empirical premises: that insurers use such tests (often prohibited), and that knowledge actually changes behavior (which wife disputes). 

  Point 4: Wife's anecdote is devastating here. If information causes dread without altering actions, it creates negative utility while providing zero decision value - directly violating Good's "never negative" conclusion. This illustrates "miswanting" - people overestimate future actionability and underestimate emotional toll. 

  Both miss nuances: He underestimates how Bayesian "belief updating" differs from emotional processing. She overlooks that some people derive relief from knowing. The real limit isn't the theorem but its mismatch with human cognition - we aren't dispassionate belief-updaters. I should emphasize that rational choice models need psychological realism to handle such cases.
answer: |-
  Let's break this down move by move, with a focus on Good's theorem and its psychological limits:

  **1. Husband's Argument (Mathematical Purity):**  
  *"The result is already computed, looking costs nothing, and worst-case she can act as if she didn't look."*  
  **Assessment:** **He's mathematically correct within Good's strict framework.** Good's theorem assumes:  
      *   You are a Bayesian updater (beliefs change rationally with evidence).  
      *   You can freely choose any action *after* seeing the information.  
      *   The *only* cost/benefit comes from enabling better decisions.  
  Under these assumptions, looking dominates not-looking. Not looking locks you into the action chosen with current beliefs. Looking allows you to either stick with that action *or* switch to a better one if the information warrants it. Expected utility cannot decrease. The "already computed" point reinforces that the information exists independently of her choice to access it.

  **2. Wife's Argument (Psychological Reality - The Cost of Knowing):**  
  *"You can't truly 'act like you don't know.' Knowing creates inherent dread, and there's no proven intervention anyway."*  
  **Assessment:** **She identifies the critical psychological limit of Good's theorem.** The theorem assumes the *act of learning* the information itself has no intrinsic positive or negative utility – it only affects decisions. Her point that "acting like you don't know" is psychologically impossible for humans shatters this. Dread, anxiety, or altered life perspective *are* direct utility costs ("experienced utility") independent of any action taken. If there truly are *no* actionable decisions affected (no proven prevention), then looking *only* risks these negative experiential costs without offering any decision-improvement benefit. **Good's theorem doesn't account for the utility cost of the *belief state* itself.**

  **3. Husband's Counter (Potential Instrumental Value):**  
  *"She can't know *in advance* nothing hangs on it. Bad news could prompt buying insurance or taking trips 'sooner'."*  
  **Assessment:** **He correctly highlights a potential flaw in her assumption of "no actionable decisions."** Good's theorem emphasizes that the value comes from enabling *better decisions under uncertainty*. If the information *could* change a decision that affects outcomes she values (financial security via insurance, life experiences via trips), then refusing the information *does* risk forgoing potential gains. He's right that she can't be *certain* the information is decision-irrelevant. This is the core of Good's positive value of information: information is valuable precisely when it might change your optimal action. **This point rescues Good's theorem *if* there are plausible, valuable actions contingent on the result.**

  **4. Wife's Counter (The Gap Between Intention and Action / Experiential Cost Dominance):**  
  *"Her uncle's experience shows the information caused dread without changing actions, making the net value negative."*  
  **Assessment:** **She delivers the strongest challenge to a naive application of Good's theorem.** She makes two powerful points:  
      *   **The Intention-Action Gap:** Even if *potential* valuable actions exist (insurance, trips), people often fail to act on them due to denial, procrastination, or simply reassessing the cost/benefit *after* knowing. Her uncle's inaction demonstrates this. Good's theorem assumes optimal action *after* updating, but humans aren't perfect optimizers.  
      *   **Experiential Cost Dominance:** If the negative utility of dread/anxiety (the "hollowing out") is large, and the *actualized* decision value (the benefit from changed actions) is zero (as in her uncle's case), then the *net* utility of acquiring the information *is* negative. This directly contradicts Good's "never negative" conclusion because it introduces a *cost intrinsic to the information state itself* that the theorem ignores. **This is the core psychological limit: Information can have inherent negative utility regardless of decisions.**

  **Who "Wins" Each Move?**  
  *   **Move 1:** Husband (Mathematically sound within idealized assumptions).  
  *   **Move 2:** Wife (Exposes the critical psychological limitation of those assumptions).  
  *   **Move 3:** Husband (Correctly points out the potential for decision value she might dismiss).  
  *   **Move 4:** Wife (Provides compelling real-world evidence that experiential costs can dominate and render net value negative, highlighting the intention-action gap).

  **Good's Theorem's Reach & Their Application:**  
  Good's theorem is mathematically airtight **within its domain**: pure Bayesian decision theory where utility depends *only* on states of the world and actions taken, and agents act optimally post-updating. **Neither fully misapplies it, but both highlight its boundaries:**  
  *   **Husband** correctly applies the formal logic but underestimates the theorem's fragility when its core assumptions (no cost of knowing, optimal action) collide with human psychology.  
  *   **Wife** intuitively grasps these psychological violations (cost of knowing, intention-action gap) but potentially underestimates the *possibility* of genuine instrumental value (Move 3) and overgeneralizes from her uncle's experience.  

  **What Both Are Missing (A Closing Paragraph):**  

  Both are missing the **contingent nature of the value** and the **subjectivity of utility**. The value of this specific information isn't universally positive or negative; it depends *crucially* on the individual. For someone highly resilient, prone to proactive planning, and facing decisions genuinely sensitive to the risk (like expensive long-term insurance), the instrumental value might dominate, making looking rational. For someone highly anxiety-prone, with no access to actionable interventions, or who knows they struggle to act on unpleasant knowledge, the experiential cost might dominate, making *not* looking the welfare-maximizing choice. Good's theorem governs instrumental rationality in an idealized world. The wife's argument centers on *experienced well-being* in the real, psychologically complex world. The optimal choice depends on which aspect – potential for better decisions or vulnerability to psychological harm – weighs more heavily *for her specific psychology and circumstances*. Rational choice models and psychological realism need integration here; neither alone provides the complete answer.
