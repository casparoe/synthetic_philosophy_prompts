  I should break down the Dutch-book argument for Reflection. The standard setup involves bets at two times. If your current credence doesn't match the future one you anticipate, the bookie can set up bets that cause a sure loss. But in the drug case, even though you know future you is wrong, the Dutch-book still applies. So technically, coherence requires Reflection even when future you is irrational. But that seems counterintuitive.

  Van Fraassen's restriction tries to handle this. He says you should only reflect if you regard your future self as an expert. But what makes someone an expert? Epistemically, it's about having more information or better reasoning. If future you has more evidence, deferring makes sense. But if they're drugged, they're not better informed. So the restriction isn't ad-hoc; it's based on the epistemic authority. However, the Dutch-book argument doesn't naturally include this—it's purely about coherence.

  The user’s deeper need is to understand if there's a coherentist justification that doesn't rely on external epistemic norms. If the Dutch-book for Reflection requires assuming rationality, then it might be circular. But maybe there's a way to interpret "expert" in terms of information alone. If future you has strictly more evidence, then conditionalization already handles belief updating. Reflection might then be about anticipated evidence. But conditionalization doesn't directly say anything about deferring to future credences based on evidence you don't have yet.

  Perhaps the principle can be reformulated as: your current credence should equal the expectation of your future credence. That avoids conditioning on a specific value. But the user’s example targets the standard formulation. Also, expectation might still be problematic if future credences are irrational.

