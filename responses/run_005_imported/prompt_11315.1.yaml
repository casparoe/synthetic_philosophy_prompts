answer: |-
  You're absolutely right to press this edge case – it's the acid test for any instrumentalist account of promises. I'll steelman the pure decision-theoretic (DT) position with maximum bullet-biting rigor. Here’s why, *even in your uncle’s ashes case*, the "obligation" dissolves once instrumental value vanishes, and your intuition is indeed a heuristic misfire:

  ### The Core Argument: Obligation as Epiphenomenal Policy-Loyalty
  1.  **No "Ought" Beyond Instrumental "Is":** Morality (including promises) isn’t a fundamental feature of the universe. Normative force arises *solely* from the alignment of behaviors with an agent's goals within strategic contexts. "Obligation" is just a felt echo of successful policies hardwired or learned through evolution and socialization.
  2.  **FDT/Gauthier Reveal the Engine:** Parfit’s Hitchhiker *exposes* the mechanism: the *only* reason "pay" is the "right" move is because agents precommitted to the "pay" policy get picked up more often. The "pay" action *itself* is causally negative. The "obligation" is 100% contingent on the policy’s *future* instrumental value in securing cooperation.
  3.  **The Ashes Case: Sterilizing the Instrumental Value:** You meticulously removed *all* future instrumental value: no reputation, no future interactions, no divine punishment, no internal guilt affecting future decisions (assuming perfect compartmentalization). The *policy* of "keep promises even when undetected" has *zero* differential payoff here vs. defection. Its raison d'être vanishes.
  4.  **The Intuition is the Heuristic Screaming:** Your feeling of residual obligation isn't evidence of a deeper moral truth. It's precisely the *heuristic mechanism* that usually *implements* the successful policy. Evolution/socialization instilled a powerful "promises are sacred" feeling *because* that feeling reliably produced beneficial cooperation in the vast majority of real-world cases (which involve iterated interactions, uncertainty about detection, etc.). In this sterile edge case, the heuristic fires *maladaptively* – like craving sugar in a world of abundance.
  5.  **Scanlon's Principle F: Instrumental Through and Through:** Scanlon’s Principle F ("One must exercise due care not to lead others to form reasonable but false expectations about what one will do") is *itself* grounded in instrumental value. Why care about others' expectations? Because undermining *general* trust:
      *   **Harms YOU:** Future potential cooperators might avoid you or demand costly assurances.
      *   **Harms COORDINATION:** A society where Principle F isn't followed is worse for *everyone*, including you, at fulfilling their goals. Principle F is a Schelling point for cooperation.
      *   **The Ashes Case Sterilizes Principle F:** Your uncle is dead. You misled *no one else*. You undermine *no future trust* (no one knows, no one's expectations about *your future behavior* are affected). Principle F simply doesn't apply. The feeling it *should* apply is, again, the misfiring heuristic.

  ### Countering the "Moral Residue" Objection Head-On
  *   **"But it feels wrong!":** So does stepping on a crack (for some). Feelings are data about our psychology, not ontology. The intensity reflects the heuristic's strength, not independent moral weight. The DT story *predicts and explains* this intense feeling *and* its origin in instrumental rationality.
  *   **"The Uncle Deserved It / It Disrespects Him":** "Desert" and "respect" are themselves instrumental or emotional constructs. Why does a dead man with no connections or consciousness "deserve" anything? Any "disrespect" only matters if it affects the living (e.g., *your* self-image affecting future interactions, or others learning of it). Sterilized of consequences, "desert" and "respect" lose their anchor. Your feeling is empathy/sympathy – powerful, evolutionarily crucial heuristics – misfiring in a context where their instrumental purpose (facilitating cooperation, group cohesion) is absent.
  *   **"It Degrades My Own Character":** Only if "character" is defined by adherence to policies *even when instrumentally pointless*. The DT view argues "character" is valuable *because* it reliably produces good outcomes. Here, maintaining the "promise-keeper" character trait has zero future instrumental benefit. Sacrificing resources to maintain a trait with no future utility *is* irrational. The "degradation" feeling is the heuristic lamenting a deviation from the usually beneficial policy.
  *   **"Isn't This Psychopathy?":** No. A psychopath lacks the heuristic entirely, harming them in normal life. You *have* the heuristic strongly, which is generally beneficial. Recognizing its misfire in a sterile edge case is rationality, not pathology. Acting *against* it here might even feel difficult – proving the heuristic's power, not its truth.

  ### Why This Doesn't Collapse Into Nihilism (The DT Hope)
  The steelmanned DT position isn't that promises are meaningless. It's that their *force* comes *entirely* from their role in enabling mutually beneficial cooperation. In 99.99% of real-world cases, keeping promises *is* the instrumentally rational choice because the sterile conditions of the ashes case are virtually impossible to guarantee:
  1.  **Uncertainty:** Can you be *absolutely sure* no one finds out? No future interaction hinges on this?
  2.  **Identity & Self-Conception:** Breaking the promise might subtly alter *your own* future propensity to cooperate or feel guilt, introducing self-harm.
  3.  **Rule Utilitarianism:** Internalizing the *absolute* rule "always keep promises" is usually the best policy, as calculating exceptions is error-prone and costly. The ashes case is a philosopher's toy.

  **Conclusion:** In the sterile, consequence-free vacuum of the ashes case, the promissory obligation *does* evaporate. The feeling that it persists is the spandrel of a magnificent, usually beneficial, heuristic machinery – the ghost of cooperation-past haunting an irrelevant present. FDT/Gauthier *is* the core engine; Scanlon's Principle F is a crucial social coordination rule *built upon* that engine. The moral residue is the emotional exhaust fumes of that engine, mistaken for fuel. To keep the promise here isn't "moral," it's either weakness of will (succumbing to the heuristic) or irrational policy-worship. The truly rational, instrumentally focused agent scatters the ashes wherever is cheapest and sleeps soundly, knowing they avoided a pointless cost. The unease they *might* feel is the price of being built by evolution for a world where such sterile defections are almost never possible or wise.
