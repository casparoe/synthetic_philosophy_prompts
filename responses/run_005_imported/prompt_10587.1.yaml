prompt: |-
  ok so I've been on a bit of a Bayesian updating kick lately (blame the rationalist blogosphere) and keep getting stuck on Richard Jeffrey's old puzzle about updating on evidence you're never fully certain of -- something like judging the color of a bolt of cloth by candlelight, where the light's bad enough that your credence shifts toward "it's green" without ever quite hitting 1. Write me a dialogue between two Bayesians standing over that cloth: one's an orthodox strict-conditionalizer who thinks Jeffrey's rule only works because there's secretly some further proposition underneath (like "this looks green to me right now") that you DO become certain of -- so "uncertain evidence" is a myth. The other's a card-carrying Jeffrey-conditionalizer / radical probabilist who denies theres any bedrock certainty and thinks credences can just shift "brutely." I want real back-and-forth, not people talking past each other: make the strict conditionalizer press the regress problem (if you always need a further certain proposition, what's certain about THAT one?), and make the Jeffrey defender deal with the fact that, unlike ordinary conditionalization, two Jeffrey updates done back-to-back can land you at a different final credence depending on which order you learned things in. Neither should be a pushover, and I shouldnt be able to tell which one you secretly think is right.
