  The user's friends represent two philosophical positions: one argues Naomi lost moral standing to judge others ("standing to blame"), the other says this doesn't invalidate her actual judgments (tu quoque fallacy). The user wisely recognizes the speech shouldn't resolve this debate but must navigate between "she shouldn't have judged" vs "her judgments were wrong."

  Hmm... the speech needs to: 
  - Celebrate Naomi's concrete achievements unflinchingly 
  - Acknowledge the violation without euphemisms 
