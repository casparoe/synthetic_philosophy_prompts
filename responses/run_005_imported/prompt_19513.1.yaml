  Biggest risk is the "reveal" moment. For unknowing audience: must land as new information that doesn't erase prior praise. Solution: Pivot to "this makes her dedication more meaningful" immediately after disclosure. 

  Also crucial: No passive voice for the violation ("a lab report was copied" → "Naomi let her friend copy"). Honors her request not to pretend it didn't happen. 

