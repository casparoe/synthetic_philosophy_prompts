  Hmm, this is actually a deep interdisciplinary question touching biology, semiotics, and philosophy. The user seems genuinely curious and intellectually mature - they noticed their sister's argument treats "not sole carrier" as implying "not code at all," and they're suspicious of that leap. Smart observation.

  First, I need to accurately represent both positions. Maynard Smith's argument hinges on three key points: arbitrariness (codons aren't chemically determined), conventionality (evolution fixed these assignments), and send-receiver dynamics (transcription/translation machinery). These do resemble human codes. But the DST counter is powerful too: DNA alone can't build an organism without epigenetic marks, cytoplasmic factors, etc. - so why privilege it as "the" code?

  What's tricky is the user's core confusion: does "not the only information carrier" logically entail "not a code"? That's where both sides talk past each other. The literal code view could survive the parity thesis if we allow multiple codes in development. But DST insists coding language smuggles in preformationist ideas where DNA "contains" the organism.

  I should highlight what each position gets right: Maynard Smith correctly identifies unique semiotic features in gene expression, while DST rightly demolishes DNA-centric developmental narratives. But both oversimplify - the literal view by ignoring context-dependence of genetic "meaning," DST by dismissing coding as mere metaphor when it's clearly operational in molecular biology.

