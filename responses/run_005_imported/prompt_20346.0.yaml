  Ah, here's where the historical context matters. The user mentioned the Buddhist-Nyaya debates - that's crucial. Buddhists like Dignāga argued perception is purely non-conceptual, while Nyaya needed perception to deliver actionable knowledge. So this definition is Nyaya's tightrope walk between those positions.

  The key is in that later distinction between "nirvikalpaka" (indeterminate) and "savikalpaka" (determinate) perception that the user vaguely recalled. Early Nyaya probably saw perception as a single event, but later thinkers like Uddyotakara and Vācaspati Miśra realized they needed two stages. 

