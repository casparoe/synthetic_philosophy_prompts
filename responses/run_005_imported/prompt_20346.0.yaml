answer: |-
  You've hit upon one of the most profound and debated tensions in Indian epistemology! Your confusion is spot-on – the Nyaya definition *does* contain an apparent paradox. Let's dissect the core problem and how later Nyāya thinkers (especially Uddyotakara and Vācaspati Miśra) resolved it through the **nirvikalpaka-savikalpaka** distinction.

  ### The Core Tension (As You Nailed It)
  1.  **Avyapadeśya (Not Describable by Words):** Implies the cognition is *pre-linguistic* and *pre-conceptual*. It's raw, uninterpreted sensory data – the "pure" impact of the object on the sense organ. No labels, no categories, no "this is a cow".
  2.  **Vyavasāyātmaka (Definite Ascertainment):** Implies the cognition is *determinate*, *judgmental*, and *specific*. It's knowledge *of* something definite – e.g., "This is a blue pot," not just a vague impression.

  **The Paradox:** How can a cognition be simultaneously *raw and uninterpreted* (pre-conceptual) yet *definite and specific* (conceptual)? If it's definite, hasn't conceptualization (and thus language) already occurred? If it's pre-conceptual, how can it be definite knowledge?

  ### The Problem Nyaya Was Trying to Solve
  1.  **Grounding Knowledge:** Nyaya needed perception to be the *foundational* source of knowledge (*pramāṇa*) about the external world. It had to be direct, immediate, and reliable (hence *avyabhicāri* - unerring).
  2.  **Avoiding Skepticism:** If perception *only* gave indeterminate, vague blobs of sense-data (like the Buddhists sometimes argued), how could we ever get to definite knowledge of objects ("this is a pot")? How could perception ground inference (*anumāna*) or testimony (*śabda*), which deal in concepts?
  3.  **Refuting Buddhist Phenomenalism:** Buddhists (like Dignāga and Dharmakīrti) argued that perception (*pratyakṣa*) is *only* non-conceptual (*nirvikalpaka*). It apprehends unique, momentary particulars (*svalakṣaṇa*) without any universal properties or concepts. *All* conceptualization, they argued, is the work of the mind (*kalpanā*) and is inherently erroneous or conventional, not truly perceptual knowledge. Nyaya, being realist, needed perception to deliver knowledge of stable, property-bearing objects *as* objects.
  4.  **Accounting for Experience:** Our immediate sensory experience *feels* both direct (contact-based) and yet definite ("I see *that* blue *cup*"). Nyaya had to explain both aspects.

  ### The Solution: The Two-Tiered Model of Perception
  Later Nyāya thinkers (post-Vātsyāyana, especially Uddyotakara and Vācaspati Miśra) introduced a crucial distinction to resolve the tension:

  1.  **Nirvikalpaka Pratyakṣa (Indeterminate Perception):**
      *   **Matches Avyapadeśya:** This is the *first moment* of sensory contact. It's pure, unstructured, non-relational awareness.
      *   **What it is:** Awareness of an undifferentiated "something" with specific qualities, but *without* identifying the object *as* belonging to a category, *without* relating its properties to a substance, *without* applying any name or concept. Imagine pure sensory registration: a patch of blue, a particular shape, a texture, a sound – but *not yet* synthesized into "blue cup" or "bird song." There is no subject-predicate structure ("This is X").
      *   **Not Knowledge (Pramā):** Crucially, *nirvikalpaka* is **not** considered valid knowledge (*pramā*) by itself in later Nyāya. It's the raw material. It *is* *avyapadeśya* – you couldn't *describe* it meaningfully ("Uh... blue... here... now?").
      *   **Why it's needed:** It provides the direct, unmediated, non-conceptual sensory grounding. It ensures perception starts with pure object-contact, uncontaminated by memory or error.

  2.  **Savikalpaka Pratyakṣa (Determinate Perception):**
      *   **Matches Vyavasāyātmaka:** This arises *immediately after* (or synthesized from) *nirvikalpaka*, involving the mind (*manas*) and memory (*smṛti*).
      *   **What it is:** The cognition where the raw sense-data is synthesized, interpreted, and identified using concepts (*vikalpa*). This is where the object is cognized *as* something definite: "This is a blue cup," "That is a cow." It involves:
          *   Identifying the substance (*dravya*).
          *   Attributing properties/qualities (*guṇa*) to it.
          *   Relating the substance and its qualities.
          *   Applying universals (*sāmānya* - e.g., "cowness").
          *   (Implicitly) making it describable by words.
      *   **Is Knowledge (Pramā):** *Savikalpaka* *is* valid perceptual knowledge. It delivers definite, specific, actionable cognition about the world. It is *vyavasāyātmaka* – a cognition of definite ascertainment.
      *   **Relies on Contact:** Crucially, Nyāya argues this conceptualization is *not* arbitrary or purely mental. It is *caused by* and *faithfully represents* (when valid) the object *as it is presented* in the initial *nirvikalpaka* stage. The concepts applied must correspond to the universals actually present in the object contacted by the senses.

  ### How This Resolves Your Paradox
  *   **Avyapadeśya (Wordless):** Applies **only** to the initial, fleeting *nirvikalpaka* stage. This stage is pure sensation, pre-conceptual, and indescribable.
  *   **Vyavasāyātmaka (Definite):** Applies **only** to the subsequent *savikalpaka* stage. This stage is conceptual, judgmental, definite, and describable. *This* is what counts as perceptual *knowledge*.
  *   **The Sutra's Definition:** Read through this lens, the sutra defines perception *as a whole process*. The initial contact produces the raw sensation (*nirvikalpaka*, fulfilling *avyapadeśya* and being the foundation of *avyabhicāri*). This raw sensation *immediately* (barring defects) gives rise to the determinate judgment (*savikalpaka*, fulfilling *vyavasāyātmaka*) through the mind's synthetic activity using stored concepts. The "unerring" (*avyabhicāri*) aspect applies to both stages when the process is functioning correctly.
  *   **Reconciling Definiteness & Pre-Verbality:** Definiteness (*vyavasāyātmaka*) arises *from* the pre-verbal ground (*nirvikalpaka*) via conceptual synthesis (*savikalpaka*). The pre-verbal stage *allows* the contact to be direct and unmediated by concepts. The conceptual stage *allows* this direct contact to become definite, meaningful knowledge. They are sequential phases of a single perceptual event.

  ### Why Nyaya Insisted on Both
  *   **Against Buddhists:** Without *nirvikalpaka*, Nyaya couldn't ground knowledge in direct, non-conceptual sensory reality. Without *savikalpaka*, perception couldn't deliver the definite object-knowledge needed for daily life and other *pramāṇas*, playing into Buddhist skepticism about conceptual knowledge of the external world.
  *   **Against Illusion:** The *avyabhicāri* (unerring) aspect, combined with the causal chain starting from object-contact (*nirvikalpaka*), is what guarantees that valid *savikalpaka* perception is *of* the real object, not an illusion (which arises from faulty synthesis or defective senses/contact).
  *   **Realism:** This model preserves Nyaya's direct realism: we perceive real objects with real properties. The concepts used in *savikalpaka* aren't mental fabrications obscuring reality (as Buddhists might argue), but tools that *reveal* the structure inherent in the objects contacted by the senses.

  **In short:** The Nyaya definition captures the *entire arc* of perception. The apparent paradox between "wordless" and "definite" is resolved by splitting perception into two moments: the initial, indescribable sensory registration (*nirvikalpaka/avyapadeśya*), which *immediately* triggers a conceptual synthesis resulting in definite, describable knowledge (*savikalpaka/vyavasāyātmaka*). This allowed Nyaya to maintain direct sensory grounding *and* deliver definite, conceptual knowledge of the external world. Your instinct about the tension was perfect – it took centuries of sophisticated debate to fully articulate the solution!
