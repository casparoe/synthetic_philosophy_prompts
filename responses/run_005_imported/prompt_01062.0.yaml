prompt: |-
  A friend and I spent most of a long dinner arguing about a notorious stretch of Schopenhauer's philosophy of music, and neither of us could talk the other out of their reading. I'd like a third opinion. The passage is from Book III, §52 of The World as Will and Representation (Haldane and Kemp translation), the section where Schopenhauer explains why music alone, among the arts, bypasses the Platonic Ideas:

  "The (Platonic) Ideas are the adequate objectification of will. To excite or suggest the knowledge of these by means of the representation of particular things [...] is the end of all the other arts [...]. Thus all these arts objectify the will indirectly only by means of the Ideas; and since our world is nothing but the manifestation of the Ideas in multiplicity [...] music also, since it passes over the Ideas, is entirely independent of the phenomenal world, ignores it altogether, could to a certain extent exist if there was no world at all [...]. Music is as direct an objectification and copy of the whole will as the world itself, nay, even as the Ideas, whose multiplied manifestation constitutes the world of individual things. Music is thus by no means like the other arts, the copy of the Ideas, but the copy of the will itself, whose objectivity the Ideas are. This is why the effect of music is so much more powerful and penetrating than that of the other arts, for they speak only of shadows, but it speaks of the thing itself.

  "I recognise in the deepest tones of harmony, in the bass, the lowest grades of the objectification of will, unorganised nature, the mass of the planet. [...] Bass is thus, for us, in harmony what unorganised nature, the crudest mass, upon which all rests, and from which everything originates and develops, is in the world. Now, further, in the whole of the complemental parts which make up the harmony between the bass and the leading voice singing the melody, I recognise the whole gradation of the Ideas in which the will objectifies itself. Those nearer to the bass are the lower of these grades, the still unorganised, but yet manifold phenomenal things; the higher represent to me the world of plants and beasts. [...] Lastly, in the melody, in the high, singing, principal voice leading the whole and progressing with unrestrained freedom, in the unbroken significant connection of one thought from beginning to end representing a whole, I recognise the highest grade of the objectification of will, the intellectual life and effort of man. As he alone, because endowed with reason, constantly looks before and after on the path of his actual life and its innumerable possibilities, and so achieves a course of life which is intellectual, and therefore connected as a whole; corresponding to this, I say, the melody has significant intentional connection from beginning to end. It records, therefore, the history of the intellectually enlightened will.

  "Now the nature of man consists in this, that his will strives, is satisfied and strives anew, and so on for ever. [...] And corresponding to this the nature of melody is a constant digression and deviation from the key-note in a thousand ways, not only to the harmonious intervals to the third and dominant, but to every tone, to the dissonant sevenths and to the superfluous degrees; yet there always follows a constant return to the key-note. In all these deviations melody expresses the multifarious efforts of will, but always its satisfaction also by the final return to an harmonious interval, and still more, to the key-note."

  My friend's objection was that this whole account is quietly incoherent. Elsewhere Schopenhauer insists that the will as thing-in-itself lies wholly outside space, time, and the principle of sufficient reason, and that time is merely the form under which representations are given to a knowing subject. Yet here he treats melody's temporal unfolding -- its departures from and returns to the key-note, its "connection from beginning to end" -- as itself the direct expression of the will's own dynamic of striving and satisfaction. That looks like it smuggles succession into the very thing he says has none. I argued for a more charitable reading: perhaps music copies only the abstract character of willing (the bare structure of striving, satisfaction, renewed striving), while the temporal unfolding belongs solely to music as heard phenomenon, which, like anything perceptible, cannot help but take a temporal form -- so the copying relation itself need not be temporal even though its vehicle is.

  Which of us has the better reading? Is there a way to make Schopenhauer's claim that music directly copies the will consistent with his broader insistence that the will itself is timeless, or is this a real fault line in his aesthetics?
