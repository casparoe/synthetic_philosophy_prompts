answer: |-
  That's an excellent critique of Dummett's position, cutting right to the tension between his theoretical concession and his practical dismissal. Let's break down whether Sweden 2015 would meet Dummett's criteria for "submersion" based on his stated principles, and what that reveals about the concept:

  1.  **Dummett's Explicit Criteria for "Submersion":**
      *   **"Total Transformation":** He emphasizes this isn't just change, but the *complete* replacement or destruction of the existing national character and institutions.
      *   **"Cease to Exist":** The nation would "cease to exist" as the entity it was. This implies not just demographic shift, but the collapse of its foundational culture, political system, and social fabric.
      *   **Irreversible Change:** The change must be fundamental and permanent, not just a period of adjustment or integration.
      *   **"Extremely Limited Application":** He explicitly states that the scale required is far beyond anything experienced by Western nations in the late 20th century (when he wrote). He likely envisioned scenarios like mass, organized, permanent settlement aimed explicitly at displacing the existing population and culture (analogous to aggressive colonization in reverse).

  2.  **Applying the Criteria to Sweden 2015:**
      *   **Scale:** 160,000 asylum seekers (approx. 1.6% of population) in one year *is* a very large number, unprecedented in modern Swedish history and EU per capita terms. It created significant, immediate pressure on housing, social services, and the asylum system.
      *   **But... Did it meet Dummett's Threshold?**
          *   **Total Transformation?** No. Sweden's core institutions (government, parliament, legal system, education system, major industries, cultural infrastructure) continued functioning under Swedish law and norms. Swedish remained the dominant language of public life and administration.
          *   **Cease to Exist?** Sweden demonstrably continued to exist as a sovereign nation with its fundamental constitutional structure, political parties, and cultural identity intact. National identity evolved under pressure, but wasn't eradicated or replaced.
          *   **Irreversible Change?** While the demographic impact is lasting, the *cultural and institutional transformation* Dummett feared wasn't achieved. Integration, however challenging, was the stated goal and ongoing process, not displacement. Many asylum seekers were later granted residency, but this is distinct from an *intentional* project of submersion.
          *   **Intent?** The influx was driven by conflict (Syria, Afghanistan, etc.), not by a coordinated plan by the immigrants or their states of origin to submerge Swedish identity. Sweden *chose* to accept them based on its humanitarian principles, albeit straining its capacity.
          *   **Permanence?** While many stayed, the influx was a peak event, not a sustained, planned, permanent wave designed to overwhelm indefinitely. Subsequent years saw significantly lower numbers.

  3.  **Would Dummett Likely Conclude Sweden 2015 was "Submersion"?**
      *   **Almost certainly not, based on his stated principles.** He would likely argue:
          *   Sweden faced immense **pressure** and **challenges**, potentially even **crisis** in specific localities or services.
          *   This pressure tested Sweden's **capacity** and forced difficult choices about **integration** and **social cohesion**.
          *   However, it did **not** constitute the "total transformation" or cause Sweden to "cease to exist" as a nation with its own distinct character and institutions. The fundamental fabric of Swedish society, law, and governance persisted.
          *   He would likely point to the continuation of Swedish political life, cultural output, economic structure, and legal system as proof that submersion hadn't occurred.

  4.  **The Philosophical Work (and Weakness) of the Concept:**
      *   **Doing Work?** Yes, but arguably *too* much work in one direction. Dummett uses the "right not to be submerged" primarily as a *rhetorical shield* and a *boundary marker*.
          *   **Shield:** It allows him to acknowledge a theoretical extreme concern to pre-empt charges of pure cosmopolitanism/open borders, making his robust defense of refugee rights and condemnation of xenophobia seem more "reasonable" and grounded.
          *   **Boundary Marker:** It defines an outer limit so extreme that virtually any real-world scenario (including Thatcher's Britain or even Sweden 2015) falls *well* short. This lets him dismiss nativist fears as hysterical exaggerations while preserving the theoretical possibility of the right.
      *   **Collapsing into Thatcherism?** Here's the rub:
          *   **The Threshold Problem:** Dummett sets the threshold so impossibly high ("cease to exist," "total transformation") that it becomes practically meaningless. This makes it useless for addressing the *real* anxieties and challenges posed by *significant* (but not "submerging") migration – the very anxieties Thatcher exploited with "swamped."
          *   **Ignoring the Gradient:** By focusing only on the catastrophic endpoint, Dummett fails to engage philosophically with the legitimate questions about *pace*, *scale*, *integration capacity*, *social cohesion*, and *distributive justice* that arise *long before* any mythical point of "submersion." These are the issues that actually drive political debates, and where Thatcher's rhetoric found fertile ground.
          *   **Conceptual Vagueness:** Terms like "national character" and "cease to exist" are inherently vague and contestable. What specific institutions or cultural markers define it? How much change is too much? This vagueness makes the concept vulnerable to *subjective* application, potentially aligning with nativist interpretations when perceived cultural threat feels high, even if the objective threshold isn't met.
          *   **The Sweden Test:** Sweden 2015 shows the concept's limits. It *was* a massive, rapid influx causing real strain and social tension. Dummett's framework would dismiss concerns about its scale and impact as irrelevant because it didn't meet his apocalyptic threshold. This feels philosophically inadequate; it doesn't grapple with the actual ethical dilemmas posed by large-scale migration in the real world. It *collapses into irrelevance* rather than collapsing into Thatcherism.

  **Conclusion:**

  You've hit on a core tension. Dummett's "right not to be submerged" is primarily a **philosophical fig leaf**. It does minimal *positive* work (defining a near-impossible scenario) but significant *negative* work by allowing him to dismiss almost all real-world restrictionist arguments as unfounded hysteria. Sweden 2015, despite its unprecedented scale and challenges, would almost certainly *not* qualify as "submersion" under his criteria because Sweden didn't cease to exist or undergo total transformation.

  The concept **doesn't collapse back into Thatcher's line** because Thatcher's "swamped" was about *perceived* loss of control and cultural change at levels far below Dummett's threshold. Instead, Dummett's concept **collapses into practical irrelevance** for addressing the actual ethical and political dilemmas posed by significant migration flows. It fails to provide a framework for evaluating the *gradient* of impact between negligible change and total submersion, leaving a philosophical vacuum where legitimate concerns about capacity, cohesion, and fairness can be easily hijacked by nativist rhetoric *because* philosophers like Dummett refused to engage with them seriously within a liberal framework. His concept shields his core arguments but doesn't equip us to handle the messy reality where numbers *do* get "big enough" to cause serious, non-apocalyptic problems.
