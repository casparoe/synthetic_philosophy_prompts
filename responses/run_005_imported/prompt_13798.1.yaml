answer: |-
  Your situation is a textbook example of several intersecting concepts in strategic bargaining and game theory, particularly within the Schelling tradition. Let's break down the theoretical structure, diagnose the problem, and explore potential solutions:

  **The Theoretical Framework:**

  1.  **Schelling's Commitment Strategy:** Your cousin was correct about the power of *public, irrevocable commitment*. Schelling argued that strategically limiting your own options (tying your hands) can force an opponent to concede. By declaring "I need the house, non-negotiable," your sister aimed to:
      *   **Reduce her own flexibility:** Making it costly for *herself* to back down (reputational cost).
      *   **Signal resolve:** Convincing you she would fight hard (or accept mutual loss) rather than compromise.
      *   **Shift the burden of concession:** Framing any concession as *your* responsibility to avoid mutual disaster.

  2.  **The Rationality Trap (Mutual Pre-Commitment Game):** This is the core dynamic you identified. Individually, pre-committing *first* seems rational:
      *   **First-Mover Advantage:** The first credible commitment often sets the focal point and forces the opponent to react.
      *   **Fear of Exploitation:** If you don't commit, you fear being steamrolled by the other's commitment ("If I don't stake a claim, she gets everything").
      *   **Loss Aversion:** The perceived cost of losing ground after deliberation feels worse than the potential gain from a cooperative start.

      **However, when both players reason this way simultaneously (or near-simultaneously):**
      *   **Mutual Commitment Occurs:** Both players lock themselves into incompatible positions.
      *   **Pareto-Inferior Outcome:** You reach an outcome (costly stalemate/lawyers) that is worse for *both* than many potential compromises would have been (e.g., selling the house and splitting proceeds, creative division). This is the defining feature of a **Prisoner's Dilemma** or, more aptly here, a **Deadlock Game**.
      *   **Inevitability of Conflict:** The commitments make conflict almost unavoidable. Concession becomes prohibitively expensive due to the sunk reputational cost. This is the **"Rationality of Irrationality"** paradox – rationally pursuing individual advantage leads to collective irrationality.

  3.  **Reputational Costs as Binding Mechanisms:** The key element making these commitments "credible" is the *reputational cost* within the family network. This acts as an **endogenous commitment device**. Backing down isn't just losing money; it's losing "standing," making the threat to hold out (even to mutual detriment) believable. Your reaction cemented this mechanism for both sides.

  4.  **Lack of Focal Points:** Schelling emphasized the importance of **focal points** – obvious, salient solutions around which expectations converge (e.g., "split everything 50/50"). The absence of a clear, pre-agreed focal point (like a will, parent's guidance, or simple default rule) created the vacuum filled by competing commitments. Your sister attempted to *create* a focal point ("I get the house") through her declaration.

  **Were You Reasonable? Foolish? Predictable?**

  *   **Individually Rational (Short-Term):** Given the information and incentives *at the moment each of you acted*, your actions were understandable and followed a recognized (though risky) strategic logic. Your sister saw an opportunity for a first-mover advantage. You saw the need to counter her commitment to avoid being marginalized. Acting quickly based on the fear of hardening positions also has strategic merit.
  *   **Collectively Irrational (Long-Term):** The *joint outcome* of these individually rational moves is clearly suboptimal. The theory predicts this mutual pre-commitment trap is a common failure mode in bargaining without clear rules or focal points. **Yes, the whole mess was predictable in advance** from a game-theoretic perspective. It's a classic coordination failure.
  *   **Not Necessarily "Foolish," But Strategically Myopic:** The mistake wasn't necessarily in the *desire* to commit, but perhaps in:
      *   **Underestimating the Speed of Mutual Lock-In:** Not anticipating how quickly the other would react with a counter-commitment.
      *   **Underestimating the Sunk Cost of Reputation:** Failing to fully grasp how binding the public declarations would become.
      *   **Lack of Coordination on Commitment *Not* to Commit:** This is the trickiest part. Could you have agreed *in advance* not to use public commitments? Probably not, as that agreement itself might not be credible.

  **The Name(s) and Body of Theory:**

  Your intuition is spot-on. This dynamic sits at the intersection of:
  *   **Schelling's Bargaining & Commitment Theory:** Core framework.
  *   **The Prisoner's Dilemma / Deadlock Games:** Modeling the payoff structure where mutual defection (hard commitment) dominates mutual cooperation (flexible negotiation) for the individual, but mutual cooperation yields the best collective outcome.
  *   **Coordination Failures:** Specifically, failures to coordinate on efficient equilibria.
  *   **Preemption Games:** Races to be the first mover to seize an advantage (like claiming the focal point).
  *   **Reputation Models in Game Theory:** How reputational concerns enforce strategies and create binding commitments.
  *   **The "War of Attrition":** A model of costly stalemates where each side waits for the other to concede first, burning resources (here, time, money, family harmony). Your current situation resembles this.

  **Finding a Way Out (Beyond One Side Losing):**

  Escaping this mutually destructive equilibrium requires changing the game's structure or the perceived costs/benefits. It's hard, but possible:

  1.  **Introduce an External Focal Point/Salvage Fairness:**
      *   **Mediator (Formal or Informal):** This is crucial. A skilled mediator (like your cousin?) is *not* just a referee; they reframe the discussion. Their role is to:
          *   Shift focus from *positions* ("I *must* have the house") to *interests* ("I need stability/a financial base/a connection to grandma").
          *   Introduce objective standards of fairness (e.g., market value, equal division as a baseline).
          *   Help generate creative options (e.g., one buys the other out over time, rent-to-own, shared ownership for a period then sell, sell immediately and split proceeds +/- adjustments for sentimental items).
          *   **Provide a face-saving mechanism:** This is *key*. The mediator can absorb blame ("After talking it through with X, I see a different perspective...") or frame concessions as mutual gains or adherence to fairness, reducing reputational damage. They create a "new game."

  2.  **Costly Signaling of Flexibility (Carefully):** One of you needs to send a credible signal of willingness to move, *without* appearing to capitulate entirely. This is risky but can break the deadlock:
      *   **Private Channel:** Initiate a *private*, off-the-record conversation with your sister. Avoid family witnesses initially. Acknowledge the bind: "Look, we've both dug in publicly, and now we're both going to lose with lawyers. That helps no one, especially not honoring Grandma's memory."
      *   **Frame Concession as Strength/Fairness:** "I want to find a solution that's actually fair to both of us and doesn't wreck the family. That might mean both of us moving from our initial public stances. It takes strength to prioritize a good outcome over winning a point." Appeal to a *higher shared value* (family, fairness, honoring grandma).
      *   **Offer a Specific, Face-Saving Compromise:** Don't just say "let's talk." Propose a concrete, *new* option that differs from your public maximalist position but isn't total surrender. Ideally, it should incorporate an element of fairness or appeal to an external standard. *Example:* "Instead of us fighting over who gets the house, what if we got a professional valuation and explored if one of us could realistically buy the other out based on that? If not, maybe selling is the fairest way, and we can each keep specific items that mean the most." This signals flexibility *on the process* and the *form* of the solution, not necessarily capitulation on your underlying interests.

  3.  **Reframe the "Cost" of Backing Down:** Can you jointly reduce the reputational penalty?
      *   **Mutual Concession Narrative:** Can you both agree *together* to "re-evaluate based on fairness" or "seek mediation"? Announcing *jointly* that you're stepping back from rigid positions to find a better solution reframes backing down as mutual wisdom, not weakness.
      *   **Blame the Process/System:** "We realized the way we started wasn't working for anyone. We need a better process." This externalizes the reason for changing course.
      *   **Focus on Legacy:** Emphasize that protracted conflict is the *real* damage to family standing and Grandma's legacy, not reasonable compromise.

  4.  **Introduce New Options:** Break the binary "House vs. Savings" deadlock. Propose scenarios that weren't part of the initial commitments:
      *   Sell the house, split proceeds, divide savings.
      *   One keeps the house but pays the other half its value (via savings, mortgage, or promissory note).
      *   Shared ownership for a defined period (e.g., 5 years) then sell.
      *   Value sentimental items explicitly and factor them into the division.

  **Conclusion:**

  Your analysis is sharp. You correctly identified a classic mutual pre-commitment trap arising from Schelling-esque strategies colliding. Individually, your actions had strategic logic, but collectively they led to a Pareto-inferior outcome predicted by game theory. The reputational costs within the family made the commitments credible but also locked you in.

  The way out lies not in brute force, but in **changing the game:** introducing a mediator to reframe the discussion, finding face-saving mechanisms to enable concessions, focusing on interests over positions, appealing to shared values (fairness, family), and generating new, creative options that weren't part of the initial incompatible demands. The goal is to transform the conflict from a zero-sum battle over fixed positions into a joint problem-solving exercise focused on fair value and preserving relationships. It requires courage and strategic communication, but it's far preferable to the mutually destructive path of lawyers and entrenched conflict. Good luck – your theoretical understanding is a powerful tool for navigating this practically.
