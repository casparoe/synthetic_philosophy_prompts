prompt: |-
  I'm the only student member of my high school's Honor Council, and we're split on a case going to Monday's meeting. A junior used our school's approved AI research assistant on her history paper, and the tool fabricated a citation to a report that doesn't exist. Its activity log had shown a step reading "Verifying source..." followed by "Source confirmed" right before she submitted, and she argues that relying on this was reasonable, not fabrication on her part. Two faculty members disagree: "verifying" and "confirmed," they say, are just interface dressing on a program with no beliefs to be right or wrong about, so its say-so excuses nothing. A third worries that if we discount the tool's self-reports that completely, we can never trust its citation checks for anything, which defeats the point of letting students use it at all. Please draft the short memo I'll bring to that meeting: a recommended ruling on her case, including a concrete consequence and timeline if you find her at least partly responsible, plus guidance for how the Council should weigh these AI "confirmations" going forward. Engage seriously with whichever side you don't end up recommending.
reasoning: |-
  Okay, the user is the only student member on their high school's Honor Council facing a tricky case involving AI-generated citations. They need a balanced memo draft before Monday's meeting. 

  First, let's unpack the core conflict: The junior used an approved AI tool that fabricated a citation but displayed "Verifying source... Source confirmed" messages. The student claims reasonable reliance, while faculty are split between "the AI has no real verification capacity" and "discounting all AI checks undermines its educational value."

  Hmm... This requires threading multiple needles: 
  - Fairness to the student (who used a sanctioned tool correctly)
  - Upholding academic integrity standards
  - Setting precedent for future AI use cases
  - Preserving the tool's utility without over-trusting it

  The student's position is sympathetic—she followed the interface prompts in good faith. But the faculty aren't wrong either; "confirmation" from current-gen AI is probabilistic, not factual. The third faculty's point about preserving tool functionality is crucial though—if we treat all AI outputs as inherently suspect, why have it at all?

  *scribbles mental notes* 
  The memo must:
  1. Avoid punishing the student for the tool's failure
  2. Still uphold citation integrity as non-negotiable 
  3. Create a remediation path that teaches, not penalizes
  4. Establish clear guardrails for future AI verification claims

  *Pauses* 
  The consequence should focus on correction, not punishment. Requiring verified replacement sources within 48 hours balances accountability with proportionality. For precedent, we need to distinguish between "the tool said it was right" (meaningless) and "the student cross-checked" (meaningful). 

  *Nods* 
  The guidance section is vital—it reframes AI's "confirmation" as a starting point for human verification, not an endpoint. That satisfies both skeptical faculty (by centering student responsibility) and the concerned one (by preserving the tool's utility if used properly).

  *Checks tone* 
  The memo avoids technical jargon since it's for a mixed council. Phrases like "probabilistic outputs" become "cannot guarantee factual accuracy." The "Engaging the Counterarguments" section preempts objections respectfully. 

  *Final gut check* 
  Yes, this navigates the tensions: protects the student's intent, upholds standards, and gives the council durable principles for the AI era. The 48-hour fix is tight but feasible for a junior. Guidance future-proofs similar cases without banning the tool.
answer: |-
  ## Honor Council Memo: Recommended Ruling & Guidance on AI Citation Case  
  **To:** Honor Council Members  
  **From:** [Your Name], Student Member  
  **Date:** [Date of Meeting]  
  **Subject:** Ruling & Guidance: Junior History Paper AI Citation Fabrication  

  ### Recommended Ruling: **No Honor Code Violation by Student**  
  After reviewing the evidence, I recommend the Council find the junior **not responsible** for intentional or negligent academic dishonesty.  

  **Reasoning:**  
  1. **Reasonable Reliance:** The student used an approved school tool as instructed. The activity log ("Verifying source... Source confirmed") created a reasonable expectation of reliability. Punishing her for the tool’s undisclosed failure sets an unfair precedent, discouraging trust in sanctioned AI resources.  
  2. **Absence of Deceit:** There is no evidence the student knew the citation was fabricated or bypassed verification steps. Her actions align with good-faith use of the tool.  

  **Consequence & Timeline (Conditional):**  
  *If the Council deems her partially responsible*, I propose:  
  - **Corrective Action:** The student must locate and submit a valid replacement source for the fabricated citation, with a brief explanation of her verification process.  
  - **Timeline:** 48 hours post-ruling.  
  - **Consequence:** No further penalty if completed. Failure results in a formal warning on record.  

  ---

  ### Guidance: Evaluating AI "Confirmations" Going Forward  
  The Council must establish clear standards for AI-assisted work:  
  1. **"Verification" ≠ Verification:** AI outputs are probabilistic, not factual. Terms like "verified" or "confirmed" are interface design choices, not guarantees. Students **cannot** rely solely on these labels.  
  2. **Student Verification Duty:** Using AI for citations requires students to:  
     - Cross-check *all* AI-generated sources against primary databases (e.g., JSTOR, official archives).  
     - Retain screenshots/logs of their independent verification.  
  3. **Tool Accountability:** Flag recurring AI errors to the tech team. Persistent flaws should trigger tool reevaluation.  

  ---

  ### Engaging Counterarguments Seriously  
  **Faculty Concern: "AI has no beliefs; its ‘confirmation’ is meaningless."**  
  This is technically correct. AI lacks intentionality, and its "confirmation" is a UX artifact. However, **school approval of the tool implies a baseline of reliability**. Holding students accountable for its undisclosed failures without clear prior warning undermines institutional trust.  

  **Faculty Concern: "Discounting AI self-reports destroys its utility."**  
  Valid—but the solution is **transparency, not blind trust**. We can preserve AI’s value by:  
  - Training students to treat AI outputs as *unverified drafts*.  
  - Requiring independent corroboration for citations.  
  - Collaborating with tech staff to improve tool accuracy warnings (e.g., "AI sources require human verification").  

  ---

  ### Conclusion  
  **Ruling:** No violation. The student acted in good faith with an approved tool.  
  **Guidance:** Shift responsibility to *student verification* of AI outputs, not tool promises.  
  **Action:** Draft clear AI-use guidelines (see above) for全校 approval by [Date].  

  Respectfully submitted,  
  [Your Name]
