  Hmm, the user seems quite sophisticated—they're clearly familiar with the key thinkers (DeRose, Stanley, etc.) and the technical debate. Their frustration is valid: the standard bank case is messy because changing stakes for the subject also naturally makes error possibilities salient for the attributor. So when high-stakes Hannah says "I don't know," contextualists see raised standards, while encroachment theorists see stakes affecting knowledge itself. No wonder the user wants a cleaner experimental design. 

  I should construct cases that decouple these variables. Let me sketch two scenarios: one fixing attributor context while varying subject stakes (to test encroachment), another fixing subject stakes while varying attributor context (to test contextualism). For the first, imagine a low-stakes attributor commenting on both a low-stakes subject (who should "know") and a high-stakes subject (who shouldn't, if encroachment is true). For the second, have high-stakes subjects in both cases, but vary whether the attributor is in a low- or high-standards context. 

  The key is ensuring the attributor's context stays fixed in the first pair (same conversation, no new error possibilities introduced) and the subject's situation stays fixed in the second (same evidence/stakes, only the attributor's conversational goals shift). That way, divergent predictions emerge: contextualism should say "knows" can flip in the second pair even if subject factors are identical, while encroachment should say "knows" flips in the first pair based solely on subject stakes. 

  Also need to flag why the original bank case fails: by describing Hannah's high stakes to the attributor, it inevitably makes error possibilities salient, muddying the variables. My cases avoid that by either keeping subject stakes hidden from the attributor (first pair) or describing identical subject situations with different attributor concerns (second pair). 

  User's request is sharp—they want a philosophical "control experiment." I'll emphasize how these cases create cleavage: contextualism cares only about the attributor's conversational scoreboard, while encroachment cares only about the subject's practical reasoning context. The standard case smuggles in both changes at once. 

  ...Better avoid jargon like "warranted assertibility maneuvers" unless necessary. User is technical but clarity trumps cleverness here.
answer: |-
  You've pinpointed a crucial flaw in the standard bank case's ability to decisively separate contextualism (C) and pragmatic encroachment (PE). Here's a minimal pair designed to pull attributor context and subject context apart, along with the predicted verdicts:

  **The Core Setup (Fixed Factual Situation):**
  *   **Subject:** Sarah is driving home on Friday. She sees the lights on at First National Bank (FNB) and a few cars in the lot. Based on this (and years of reliable experience), she forms the belief that FNB is open on Saturday.
  *   **Evidence:** Sarah's evidence is *identical* in both scenarios below. It's sufficient for knowledge under ordinary standards but fallible (maybe it's a special staff meeting, lights were left on, etc.).

  ---

  **Scenario Pair 1: Varying SUBJECT Stakes (Fixed ATTRIBUTOR Context) - Testing PE**
  *   **Attributor Context (Fixed - Low Standards):** Philosopher Phil is giving an introductory epistemology lecture about perceptual knowledge in ordinary circumstances. He's discussing cases where evidence is generally reliable but not infallible. Error possibilities like elaborate deceptions or rare bank holidays are *not* salient in his lecture context.
  *   **Subject Context A (Low Stakes):** Sarah is driving home casually. She thinks, "If FNB is open tomorrow, I'll deposit my small, non-urgent paycheck then. If not, I'll do it Monday. No problem either way." She confidently tells her friend in the car, "I know FNB is open tomorrow."
  *   **Subject Context B (High Stakes):** Sarah is driving home in a panic. She *must* deposit her paycheck by Saturday to cover a massive, imminent, non-deferrable bill (e.g., ransom demand, critical medical payment). Financial ruin and catastrophe loom if she fails. She nervously tells her friend, "I don't know if FNB is open tomorrow... I'd better check."

  **Phil's Knowledge Attribution (in his lecture):** "In both situations, Sarah *knows* that FNB is open on Saturday. Her evidence is the same and is perfectly adequate for knowledge in ordinary circumstances."

  *   **Contextualism (C) Verdict:** Phil's attribution **"Sarah knows"** is **TRUE** in *both* A and B.
      *   *Why?* Phil's attributor context has low standards. Sarah's evidence meets those low standards. Her *personal* practical situation (high stakes in B) is irrelevant to the *truth* of the knowledge claim *in Phil's context*. It only affects her psychology (confidence, action) and *warranted assertibility* of her *own* claims.
  *   **Pragmatic Encroachment (PE) Verdict:** Phil's attribution **"Sarah knows"** is **TRUE** in A but **FALSE** in B.
      *   *Why?* Knowledge itself depends on the subject's practical reasoning situation. In A (low stakes), Sarah's evidence is sufficient for knowledge. In B (high stakes), the same evidence is *not* sufficient because the cost of being wrong is too high; knowledge requires stronger justification relative to the stakes. Phil is simply *wrong* when he attributes knowledge to High-Stakes Sarah (B).

  **Cleavage:** PE denies knowledge in B; C affirms knowledge in B *relative to Phil's low-standards context*.

  ---

  **Scenario Pair 2: Varying ATTRIBUTOR Context (Fixed SUBJECT Stakes) - Testing C**
  *   **Subject Context (Fixed - Low Stakes):** Sarah is always in the **Low Stakes** situation (Scenario A above). She confidently believes and asserts "I know FNB is open tomorrow" based on her evidence.
  *   **Attributor Context X (Low Standards):** Philosopher Phil (from Pair 1) is giving his introductory lecture. He says, "Sarah, seeing the lights on and cars at FNB on Friday, *knows* it's open Saturday."
  *   **Attributor Context Y (High Standards):** Skeptic Sally is teaching an advanced seminar on radical skepticism. They are discussing how easily perception can be deceived (Matrix scenarios, evil demons, sophisticated holograms, etc.). Error possibilities are *highly salient*. Sally says, "Even though Sarah saw the lights and cars, she *doesn't know* FNB is open Saturday. Her evidence doesn't rule out these relevant skeptical possibilities."

  **Sarah's Belief:** "I know FNB is open Saturday." (True in both attributor contexts?).

  *   **Contextualism (C) Verdict:** Phil's attribution **"Sarah knows"** is **TRUE** (Context X). Sally's attribution **"Sarah doesn't know"** is **TRUE** (Context Y).
      *   *Why?* The truth conditions of "knows" shift with the attributor's conversational context. In X (low standards), Sarah's evidence suffices. In Y (high standards), her evidence doesn't rule out the salient skeptical possibilities, so "knows" is false *in that context*. Sarah's *own* low stakes are irrelevant to the truth of *others'* knowledge attributions *about her*.
  *   **Pragmatic Encroachment (PE) Verdict:** **Both** Phil's attribution **"Sarah knows"** (X) and Sally's attribution **"Sarah doesn't know"** (Y) are **FALSE**.
      *   *Why?* Knowledge is a fixed relation between the subject and the proposition, determined by the subject's evidence *and* practical stakes. Sarah is in low stakes, so her evidence *is* sufficient for knowledge. Therefore, Phil is correct (she *does* know), and Sally is *incorrect* (she *does* know, despite the attributor's high standards). Sally's high standards might make it *inappropriate* for *her* to *say* "Sarah knows," but they don't make the claim *"Sarah knows"* false. The truth is fixed by Sarah's situation.

  **Cleavage:** C allows the truth of "Sarah knows" to vary with the attributor's context (True in X, False in Y). PE insists it is fixed as True (given her low stakes), regardless of the attributor's context (so Phil is right, Sally is wrong).

  ---

  **Why the Standard Bank Case Fails:**

  The standard high-stakes bank case (Hannah panicking about a check) presented to an audience *does two things simultaneously*:

  1.  **Increases the Subject's Stakes:** Hannah's practical costs of error skyrocket.
  2.  **Raises the Attributor's Contextual Standards:** By *describing* the high stakes to the attributor/audience, the *narrator makes salient* the possibility of error and its dire consequences *for the attributor's context*. The "what if she's wrong?" question becomes prominent.

  This conflation means:

  *   **Contextualists (C)** can explain the intuition that "Hannah doesn't know" in the high-stakes case as the attributor's standards being raised by the salience of error possibilities (introduced *via* the description of high stakes).
  *   **Encroachers (PE)** can explain the same intuition as Hannah's high stakes directly undermining her knowledge itself.
  *   **Neither camp is forced** into a prediction that contradicts the intuitive judgment in the case. The case doesn't isolate the variable each theory claims is fundamental.

  The scenarios above avoid this by either:
  *   **Pair 1:** Keeping the *attributor's context* fixed and *unaware* of the variation in the *subject's stakes*.
  *   **Pair 2:** Keeping the *subject's stakes* fixed while explicitly manipulating the *attributor's conversational standards* independently.

  These scenarios force C and PE to make *different* predictions about the truth of specific knowledge attributions in specific contexts, revealing their distinct theoretical commitments.
