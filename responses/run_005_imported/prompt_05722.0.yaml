  My daughter just turned 4 and was born with dense congenital cataracts in both eyes - she finally got them removed last month after what felt like an endless wait on insurance approvals, huge relief. Her vision therapist mentioned, kind of in passing, that she might not be able to visually tell her favorite block from her ball right away even though shes known the difference by touch since she was a baby, and called this "Molyneux's problem" (hope I'm spelling that right). I looked it up and apparently researchers have actually run this exact experiment for real on newly sighted cataract patients now, and from everything I've read it basically closed the book on the old philosophy debate - empiricism won outright, Locke had it right, and there's no innate link between touch and sight at all. Kind of blows my mind that a 300 year old thought experiment turned into a real, tested finding like that. Is that a fair summary of where things landed, or is there more nuance I'm missing?
