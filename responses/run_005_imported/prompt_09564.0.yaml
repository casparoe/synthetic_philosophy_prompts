answer: |-
  This Greene/Kamm clash cuts to the heart of whether moral philosophy is descriptive psychology or normative discovery. On the footbridge case specifically, **neither side delivers a knockout blow, but Greene's debunking argument is more compelling *as a challenge*, while Kamm likely preserves a core of genuine moral structure that "personal force" alone can't capture.** Here's the breakdown:

  **Greene's Strengths (The Debunking Power of Personal Force):**

  1.  **The Trapdoor Smoking Gun:** As you note, the trapdoor variant is Greene's strongest evidence. Subjects consistently find pushing someone with hands *less* permissible than dropping them via a switch, *even when*:
      *   The victim dies in the same way (under the trolley).
      *   The victim serves the same causal role (stopping the trolley).
      *   The agent's intention is identical (save five by killing one).
      *   The outcome is identical.
      The *only* salient difference is the absence of direct physical contact/force exertion by the agent. This strongly suggests the visceral *aversion* in Footbridge is triggered by a mechanism sensitive to *how* the harm is delivered (personal, forceful, direct), not *why* or *what* the outcome is. This looks like an evolutionary alarm system misfiring in a novel context.

  2.  **Neuroscientific Correlates:** Greene's fMRI work showing heightened amygdala (emotional center) activity in Footbridge-type dilemmas vs. Switch-type dilemmas provides biological plausibility for the "alarm" theory. It demonstrates different neural machinery is engaged.

  3.  **Explaining the Asymmetry Simply:** "Personal Force" offers a relatively parsimonious explanation for the core Switch/Footbridge asymmetry that fits readily with evolutionary psychology (aversion to direct violence).

  **Kamm's Strengths (The Persistence of Moral Structure):**

  1.  **The "Intend/Foresee" Distinction & Loop Track:** Kamm's response isn't just denying the psychology; it's arguing Greene *misidentifies* the morally relevant feature. For Kamm, the key isn't *how* you cause harm (personal force), but *the role the harm plays in your plan*. In Footbridge, you *intend* the man's death *as a means* to stop the trolley. His being crushed *is* the mechanism. In Switch (and Trapdoor!), you merely *foresee* his death as a *side effect* of diverting the threat *away* from the five. The Loop Track case is crucial here:
      *   **Loop Track:** Diverting the trolley onto the sidetrack with one man *only* saves the five if his body stops the trolley *before* it loops back onto the main track. His death is *necessary for* saving the five.
      *   **Judgment:** Many (though not all) find Loop Track *less* permissible than the standard Switch case, feeling it's closer to Footbridge, *even though there's zero "personal force"* – you just pull a switch.
      *   **Kamm's Point:** Loop Track suggests the critical factor isn't personal force, but whether the harm is *intended as a means* (Loop, Footbridge) vs. merely *foreseen as a side effect* (Standard Switch, Trapdoor). Trapdoor is permissible *not* because of less personal force *per se*, but because the harm is still a side effect of redirecting the threat (the trapdoor just redirects him *into* the threat path), not a means.

  2.  **The Doctrine of Triple Effect (DTE):** Kamm refines the Intend/Foresee distinction further. DTE asks *why* you choose an action that causes harm. In Footbridge, you choose the pushing action *because* it causes the harm that blocks the trolley. In Switch/Trapdoor, you choose the diverting/dropping action *in spite of* the harm it causes, not *because* of it. The harm isn't part of the chosen path's *good-making feature*. This subtlety aims to capture why Loop Track feels worse than Switch but Trapdoor doesn't feel like Footbridge.

  3.  **The Burden of Proof for Debunking:** Kamm rightly argues that finding a psychological trigger (like personal force activating the amygdala) doesn't *automatically* debunk the intuition. The intuition *might* be tracking a real moral distinction *via* that psychological mechanism. We need an independent reason to think the mechanism is unreliable *in this specific context*. Greene argues evolution didn't design it for modern moral dilemmas; Kamm argues it *might* be contingently linked to a real distinction.

  **Adjudicating the Footbridge Case:**

  1.  **Greene Wins on the "Bias" Point for Footbridge:** The Trapdoor variant *is* devastating for the idea that the strong intuition *against* Footbridge is *solely* tracking a deep, irreducibly moral truth about "pushing." It strongly suggests a significant portion of the *emotional force* driving that intuition is an evolutionary relic misfiring. If the core moral principle were just "don't intend harm as a means," Trapdoor should feel *just as bad* as Footbridge, but it doesn't. The reduction in "personal force" alleviates the aversion significantly, implying the aversion was partly based on a morally irrelevant trigger.

  2.  **Kamm Wins on the "Structure" Point Beyond Personal Force:** However, Loop Track shows that removing "personal force" doesn't automatically make everything permissible. *Something* makes Loop Track feel worse than Standard Switch. Kamm's apparatus (Intend/Foresee, DTE) provides a plausible *moral* explanation for this residual difference that personal force cannot explain. This suggests that while "personal force" might *amplify* the aversion in Footbridge, the core distinction between *intending harm as a means* and *merely foreseeing harm as a side effect* has independent moral weight that psychology alone cannot dissolve. Greene's model struggles with Loop Track; Kamm's can accommodate it and the Trapdoor data.

  3.  **Other Variants Illustrate the Nuance:**
      *   **Lazy Susan (aka Footbridge with a Lazy Susan):** You can't push the man, but you *can* turn a large rotating platform (Lazy Susan) he's standing on, causing him to fall onto the tracks. Minimal personal force. **Judgments:** Permissibility often *increases* significantly compared to direct pushing. **Supports Greene:** Reduced personal force reduces aversion.
      *   **Drop Man (Similar to Trapdoor, but different framing):** A large man is standing on a trapdoor above the track; dropping him stops the trolley. Identical to Trapdoor. **Judgments:** Consistently more permissible than Footbridge. **Supports Greene.**
      *   **Obstacle Push:** Instead of pushing the man, you push a heavy button with your hands, which releases a weight that falls and crushes him onto the tracks. **Judgments:** Often falls *between* Footbridge and Trapdoor in permissibility. **Supports both?** Less personal force than direct push (supports Greene), but the involvement of your forceful action *directly initiating* a chain *causing* the harm might trigger some "means" concern (supports Kamm's focus on the role of harm).

  **The Verdict (for the Footbridge Case):**

  *   **Greene succeeds** in demonstrating that the *intensity* and *specific character* of the Footbridge intuition – the visceral "NO!" to *pushing* – is significantly driven by the psychologically potent, but arguably morally irrelevant, factor of "personal force." The Trapdoor variant proves this mechanism can be decoupled from the core causal/intentional structure, revealing a bias.
  *   **Kamm succeeds** in demonstrating that *even when "personal force" is removed*, a morally relevant distinction persists between cases where harm is *intended as a means* (Loop Track, Footbridge) and cases where it is merely *foreseen as a side effect* (Standard Switch, Trapdoor). This distinction explains residual intuitive differences that Greene's model struggles with.
  *   **Therefore:** The Footbridge intuition isn't *purely* a discoverable moral truth (Greene's debunking holds for the "pushing" element), nor is it *purely* a noisy bias (Kamm shows a core moral structure exists beneath it). **Greene exposes the distorting *emotional amplifier* (personal force), while Kamm identifies the underlying *moral signal* (intend/foresee, means/side-effect) that the amplifier is often, but not perfectly, attached to.** The Footbridge case feels uniquely wrong *because* the core moral violation (intending death as a means) is combined with the maximal psychological trigger (direct personal force). Greene shows we should discount the *amplifier*; Kamm shows we shouldn't ignore the *signal* it was amplifying.

  The debate continues because it hinges on the fundamental question: How much can psychology tell us about which moral distinctions are "real"? Greene pushes us towards a more consequentialist, systemizing view; Kamm defends the irreducibility of deontological distinctions discerned through careful philosophical reflection. Neither has fully resolved it, but both have profoundly shaped our understanding.
