  Also, the user asks if patching CDT to handle ratifiability makes it converge with EDT. Some solutions, like Ratifiable CDT, suggest choosing the action that's optimal given that it's chosen. In this case, both actions have the same utility, so it might randomly pick one, similar to EDT's indifference. So yes, patching could lead to convergence.

