  Now for CDT. CDT uses causal probabilities, imagining subjunctive conditionals. The man considers the causal effect of his action. But since Death predicts perfectly, if he chooses to stay, Death predicted that and is in Damascus. If he flees, Death is in Aleppo. So CDT also sees both choices leading to death. But here's the twist: when the man considers fleeing, he realizes that if he flees, Death is in Aleppo, but if he were to stay, Death would be in Damascus. So each action seems worse than the alternative at the moment of decision. This leads to a cycle: when considering staying, fleeing looks better, and vice versa. That's the ratifiability problem. CDT can't settle on a stable choice because neither action is ratifiable—each seems inferior upon consideration.

