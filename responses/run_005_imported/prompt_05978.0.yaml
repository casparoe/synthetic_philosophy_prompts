answer: |-
  Here’s a toast that threads the needle—grounded in Priya’s work but warm, inclusive, and under 3 minutes. It uses the transformative experience framework to celebrate her courage, not just the theory:

  ---

  **(Clink glass gently)**  
  "Hi everyone! For those who don’t know me, I’m [Your Name], one of Priya’s fellow philosophy travelers. And for those who *do* know Priya’s work… yes, we *are* about to toast the woman who wrote the book on why having a baby is the ultimate irrational choice. *(Wink at Priya, warm laughter)*.  

  But seriously—Priya’s brilliance has always been in staring down life’s biggest mysteries. Like how you can stand at the edge of a transformation—one that reshapes your very self, your values, your world—knowing that no one, no matter how wise, can truly tell you what it’ll be like. Not because they’re holding back… but because the *you* who’ll understand it… doesn’t exist yet. That gap between the stories we hear and the life we’ll live? That’s the leap Priya’s spent years studying.  

  And here’s the thing: Knowing all that—really sitting with how profound and unknowable this change is—makes what Priya’s doing not less meaningful, but *more*. It’s not just ‘a baby changes everything!’ It’s choosing to trust that the future-you, the parent-you, will find value in a landscape you can’t fully map from here. It’s courage dressed up as curiosity.  

  Priya, you’ve always called your pragmatic workaround ‘cheating’—weighing who you are now against who you’ll probably become. But today? It looks less like cheating and more like… love. Love for the self you are, love for the self you’ll be, and love for this tiny person who’s about to make the whole question gloriously, messily real.  

  So let’s raise a glass:  
  To Priya—the scholar who stared into the abyss of unknowable transformation and said, ‘Alright, let’s go.’  
  To the family, friends, and department who’ve got her back as she crosses that bridge.  
  And to the little one on the way: May your arrival remind us all that some of the best things in life aren’t just decided… they’re lived. Cheers!"  

  ---

  **Why it works:**  
  1. **Accessible Theory:** The "gap" between testimony and lived experience ("the you who’ll understand doesn’t exist yet") explains epistemic/personal transformation without jargon.  
  2. **Warmth > Joke:** The running gag becomes admiration for her courage in facing the unknown.  
  3. **Nods to Her "Fix":** "Weighing who you are now against who you’ll become" captures her solution simply. Calling it "love" reframes "cheating" emotionally.  
  4. **Unifies the Room:** Academics get the depth; family gets "trust," "courage," and "love." The "tiny person" centers the joy.  
  5. **Time:** Clocked at ~2m 30s speaking conversationally.  

  **Delivery Tip:** Pause before "But seriously..." and after "messily real." Let the warmth land. If her family looks confused during the theory bit, smile warmly—they’ll key into the pride and love framing it.
