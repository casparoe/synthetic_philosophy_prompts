answer: |-
  ## The Text and the Promise: An Oath on the Fourth

  **(Approx. 8 minutes)**

  Good morning. What an honor to stand with you on this Fourth of July, in this courthouse, on this day of becoming. To those of you taking the oath today: welcome. Your journey here is a testament to resilience and hope. You arrive carrying the stories of thirty-odd nations, adding your threads to the ever-unfolding tapestry of this one.

  And it *is* the Fourth of July. A day of parades, fireworks, barbecues… and profound reflection. For this holiday, this very *idea* of American independence, has always carried a complex weight. It compels us to ask: Independence for whom? Liberty for whom?

  My own work recently spent considerable time inside the mind of a man who wrestled with this question with unparalleled force: Frederick Douglass. A man who escaped the brutal reality of American slavery to become one of its most powerful abolitionist voices. And on a July 5th, 1852, in Rochester, not so far from here, Douglass stood before a crowd celebrating independence and asked the devastating question: “What, to the American slave, is your Fourth of July?”

  We often hear the righteous fury of that speech, the searing denunciation of the hypocrisy – a nation celebrating freedom while millions remained in chains. That anger is vital, undeniable. But Douglass, a deep reader and thinker, wrestled further. He broke with his mentor, William Lloyd Garrison, over a fundamental question: Was the American project itself, its founding document, inherently corrupt?

  Garrison saw the Constitution as a "covenant with death," an "agreement with hell," fatally compromised by its tacit acceptance of slavery. Burn it, he argued. Start anew.

  But Douglass came to a different, harder, and ultimately, I believe, more potent conclusion through meticulous reading. **He pointed to the text itself.** He noted a remarkable, almost haunting, absence: the words "slave" and "slavery" never appear in the Constitution. Not once.

  The framers, navigating a fragile union, used euphemisms – "persons held to service," "other persons." They compromised, yes. Deeply. Tragically. But they did not, Douglass argued, enshrine the *principle* of human property in the foundational text. They did not define humanity based on race within the document's core structure.

  This absence, Douglass insisted, was crucial. It meant the Constitution, **by its letter**, its actual words, was not a pact *for* slavery, but a promise *betrayed* by slavery. The text contained the seeds of liberty – promises of due process, equal protection (though unrealized), the power of Congress to regulate commerce and, eventually, to amend. The sin was not in the parchment, but in the practice. The failure was not the bargain struck in 1787, but the nation's catastrophic failure, generation after generation, to live up to the words it had solemnly written down.

  **The promise was there. The betrayal was in the doing.**

  This distinction – the text against the practice – is what I offer you today as you become citizens. It’s not an easy comfort. It holds both the soaring aspiration and the crushing weight of history in the same hand.

  Look at the document you pledge allegiance to. Its words speak of forming "a more perfect Union," establishing "Justice," ensuring "domestic Tranquility," providing for the "common defence," promoting the "general Welfare," and securing the "Blessings of Liberty to ourselves and our Posterity." Powerful, universal ideals.

  Yet, we know the chasm between those words and the lived reality for millions from the very beginning – for the enslaved, for the indigenous peoples displaced and destroyed, for generations of immigrants facing prejudice and exclusion. The practice consistently, often violently, betrayed the text.

  So why does this matter today, as you take your oath?

  Because you are not swearing allegiance to the flawed practice. You are not swearing allegiance to the failures, the hypocrisies, or the injustices that stain our history and challenge our present.

  **You are swearing allegiance to the text.** To the words. To the *promise* contained within them. To that aspiration for a more perfect union, for justice, for the blessings of liberty.

  You are joining a story that is fundamentally about the tension between that written promise and the messy, often painful, reality of building a nation. You are not inheriting a finished product, but an ongoing project – a project defined by the struggle to close the gap between the ideals on the page and the life lived in the streets, the fields, the homes, and yes, these courtrooms.

  Douglass, in his later years, clung to that text *because* it was a promise broken, not a lie told from the start. A broken promise can be mended. A corrupt foundation must be destroyed. He fought to hold the nation accountable *to its own words*.

  That is the power you step into today. The power inherent in citizenship is not just the rights you gain, but the responsibility you embrace: **The responsibility to read the text, to know the promise, and to work, in your own way, to weave the practice of this nation ever closer to its written ideals.**

  You bring your histories, your languages, your hopes. You bring fresh eyes to read this old text. See the promise within it. Recognize the betrayals that have marred its fulfillment. And commit, as you swear your oath, to be agents of that promise.

  Welcome to the struggle. Welcome to the ongoing project of making the words on the parchment real for all. Welcome to the promise of America, a promise we are all now charged with keeping.

  Thank you, and congratulations. May your citizenship be a testament to the enduring power of that text, and the unwavering pursuit of its fulfillment.

  **(End)**
