prompt: |-
  Random one from department life, not sure if it's even a real question or just me being salty. We just voted on a new core requirement that's going to bind students for at least the next decade, but only tenure-line faculty actually got a vote. The adjuncts who teach most of the affected sections didn't get one, the grad TAs who deliver a chunk of it didn't either, and the students who'll actually have to take the thing havent even enrolled yet so obviously they didn't get a say either. A few of us on the losing side feel like the vote itself was somehow illegitimate, not just wrong on the merits, but the best I could come up with in the meeting was "it doesn't feel like the right people were in the room," which isn't much of an argument. Is there a more principled way to think about who should actually count as a legitimate voter in a decision like this, or does it just collapse into arbitrary line-drawing the moment you poke at it?
