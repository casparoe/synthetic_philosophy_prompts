  For authenticity, I'll give the set theorist (Ava) concrete examples of AC's necessity (algebraic closures, functional analysis) and the constructivist (Leo) specific workarounds (dependent choice in analysis, topos theory). Their final standoff should echo the 1904 letters: Ava invoking Cantor's paradise, Leo demanding accountability to intuition. 

  ...And crucially, neither should "win." The user wants that delicious, unresolvable friction that makes foundations so addictive. Time to brew some mathematical drama where both sides leave blood on the chalkboard.
