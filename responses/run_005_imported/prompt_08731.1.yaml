answer: |-
  That's an excellent question that cuts to the heart of two profound yet conflicting theories of art. Both Tolstoy and Collingwood reject imitation and prioritize emotion, but their conceptions of *how* emotion functions in art are fundamentally opposed. Let's break it down:

  **1. Tolstoy's Theory: Art as Emotional Infection**
  *   **Core Idea:** Genuine art transmits ("infects") a specific, authentic feeling the artist *actually experienced* to an audience. Success is measured by the audience catching that exact feeling.
  *   **Mechanism:** The artist, having felt a genuine emotion (e.g., joy, sorrow, religious awe), uses their craft (words, sounds, images) to encode that feeling into a work. The audience perceives the work and, if the artist is skilled and sincere, "catches" the identical feeling.
  *   **Focus:** **Effect on the Audience.** Art is defined by its successful *transmission* of a pre-existing feeling *from* artist *to* audience. It's a communicative act aimed at emotional contagion.
  *   **Authenticity:** Crucial. The feeling must be one the artist genuinely lived through. Faking it or using stock emotions fails.
  *   **Value:** Highest art transmits feelings of universal human significance (love, brotherhood, religious feeling) that unite people across social and cultural divides, fostering human connection ("Christian love"). Lower art transmits narrower or more corrupt feelings.

  **2. Collingwood's Theory: Art as Expression**
  *   **Core Idea:** Art is the **clarification and articulation of initially vague, inchoate emotion** within the artist's own mind *through the act of creation itself*. It's not about transmitting a pre-existing feeling, but about *discovering* what the feeling *is*.
  *   **Mechanism:** The artist begins with an "unfelt feeling" or "psychic disturbance" – a muddy, undefined emotional state. By working in a medium (paint, words, sound), they *explore* this feeling. The artwork *is* the process of giving this vague feeling a precise, individualized form. Expression is **self-knowledge.**
  *   **Focus:** **Process within the Artist.** Art is defined by the *act of clarifying emotion* for the artist themselves. The finished work is the *record* of that process of clarification. Audience reception is secondary and distinct.
  *   **Authenticity:** Lies in the *honesty of the exploration*. It's about confronting the raw, undefined feeling without preconception, not about the biographical origin of the feeling. Expression is inherently individualizing.
  *   **Value:** Lies in achieving self-knowledge and emotional integrity for the artist. It fosters individual consciousness. Collingwood explicitly contrasts this with **"Arousal of Emotion"** (craft, technique, propaganda, amusement), which *aims* to produce a *predetermined* emotional effect *in an audience*.

  **Why Collingwood Rejects "Infection" as Expression:**

  Collingwood sees Tolstoy's "infection" as a prime example of what he calls **"Arousal of Emotion,"** which he categorically distinguishes from genuine "Expression." Here's his precise objection:

  1.  **Pre-existing Target:** For Tolstoy, the feeling exists *before* and *independently* of the artwork. The artist's job is to find the best "container" (technique) to package and deliver this pre-packaged feeling. Collingwood argues this turns art into a **craft or technique**, akin to a pharmacist dispensing a known drug to produce a known effect. The artist is using a "known technique to produce a predetermined feeling."
  2.  **Focus on Audience Effect:** Tolstoy defines art *by its effect* – successful infection. For Collingwood, this external focus is fatal. Genuine expression is primarily concerned with the *artist's internal process* of understanding their *own* feeling. Whether it infects anyone, or what effect it has, is irrelevant to whether it *is* expression. An artwork succeeds expressively if it clarifies the feeling for the artist, even if it leaves an audience cold or confused.
  3.  **Lack of Exploratory Process:** Infection implies the artist *knows* the feeling clearly beforehand and simply transmits it. Collingwood argues the artist *doesn't* know the feeling clearly beforehand. The feeling only *becomes* clear *through* the struggle to express it in the medium. Expression is **exploratory and cognitive**, not merely communicative.
  4.  **Confusion of Categories:** By defining art by its (intended) effect on an audience (infection), Tolstoy lumps together:
      *   **Genuine Expression:** An artist wrestling with their own vague emotions to achieve clarity.
      *   **Magic (Ceremonial):** Rituals designed to produce specific feelings (e.g., a hymn to induce piety).
      *   **Amusement:** Art designed purely to entertain or evoke pleasant sensations.
      *   **Propaganda:** Art designed to incite specific actions or beliefs.
      Collingwood argues Tolstoy's infection theory cannot distinguish between a sincere, exploratory expression and a highly effective piece of propaganda designed to whip up a pre-chosen feeling (like nationalist fervor). Both can "infect," but only one is genuine expression for Collingwood.

  **In Collingwood's Eyes:** Tolstoy mistakes the *craft of emotional manipulation* (successful infection via technique) for the *creative act of emotional discovery* (expression). Infection is about *causing* an emotion *in others*; Expression is about *understanding* an emotion *in oneself*.

  **Does Collingwood's Objection Defeat Tolstoy?**

  It's a powerful critique, but not necessarily a knockout blow. Here's the assessment:

  1.  **Hits a Core Weakness:** Collingwood brilliantly exposes a vulnerability in Tolstoy's theory: its **instrumental view of art** (art as a tool *for* producing audience effects) and its difficulty in **distinguishing sincere art from effective craft or propaganda** based *solely* on the criterion of successful infection. A clever propagandist *could* infect people with a feeling they *seem* to have lived through, meeting Tolstoy's technical criteria without meeting his moral/authentic spirit.
  2.  **Tolstoy's Potential Resources for Defense:**
      *   **Emphasis on Sincerity & Lived Experience:** Tolstoy could argue that true infection *requires* the artist's *genuine* prior experience of the feeling. A propagandist faking sincerity would fail the authenticity test. The feeling *must* be drawn from life.
      *   **Universality as Safeguard:** Tolstoy might argue that his *value criterion* (universal, uniting feelings) acts as a filter. Propaganda typically traffics in divisive feelings (hatred of the "other"), not universal Christian love. Art infecting people with *genuine* brotherly love couldn't be propaganda in the negative sense.
      *   **Focus on Feeling, not Technique:** While technique is necessary, Tolstoy prioritizes the sincerity and universality of the *feeling itself* over technical mastery. He might argue Collingwood over-intellectualizes the process; true infection flows *naturally* from authentic feeling, not calculated craft.
  3.  **Fundamental Incompatibility:** Ultimately, their differences run deep:
      *   **Artist vs. Audience:** Tolstoy prioritizes the audience's reception; Collingwood prioritizes the artist's process.
      *   **Known vs. Unknown Feeling:** Tolstoy assumes the feeling is known beforehand; Collingwood argues it's discovered through expression.
      *   **Communication vs. Self-Discovery:** Tolstoy sees art as communication; Collingwood sees it as self-clarification.

  **Your Judgment (as requested):**

  Collingwood's objection **seriously wounds but doesn't utterly destroy** Tolstoy's view.

  *   **Collingwood's Strength:** He successfully identifies a critical ambiguity in Tolstoy's "infection." It *does* risk collapsing the distinction between authentic expression and skillful emotional manipulation aimed at an audience. His emphasis on art as an exploratory process of self-discovery *for the artist* offers a profound counterpoint that captures something essential missing from Tolstoy's transmission model.
  *   **Tolstoy's Enduring Value:** Despite this, Tolstoy's core insights remain powerful and necessary: the **primacy of authentic emotion**, the **moral dimension of art** (its power to unite or divide), the **rejection of art for art's sake or elite amusement**, and the **insistence that art matters profoundly to human life**. His theory forces us to confront art's social and ethical impact in a way Collingwood's more internal, individualistic theory does not.

  **Conclusion:** They are answering different, though related, questions. Tolstoy asks: "What social and moral function does genuine art serve?" (Answer: Uniting humanity through shared authentic feeling). Collingwood asks: "What is the essential psychological process that constitutes making art?" (Answer: Clarifying inchoate emotion through imaginative exploration in a medium). Collingwood convincingly argues that Tolstoy's "infection" describes a *possible effect* of art (or craft), but not its *defining internal process*. While Collingwood exposes a weakness in Tolstoy's mechanism, Tolstoy's emphasis on authenticity, universality, and art's moral purpose provides resources for a defense and highlights aspects of art's value that Collingwood downplays. The most complete view of art likely incorporates elements of both, acknowledging both the artist's internal journey of discovery *and* art's profound potential to communicate shared human experience.
