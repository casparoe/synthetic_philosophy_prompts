  For the jade question, the core issue is whether a single term tracking two distinct essences undermines the "one essence per kind" assumption. The likely reply might involve distinguishing nominal vs. natural kinds or appealing to pre-scientific intentions. The follow-up should challenge whether the theory can handle historical cases without becoming arbitrary.

