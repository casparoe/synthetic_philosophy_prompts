  First, I need to unpack both theories accurately. Tolstoy sees art as emotional infection—transmitting a feeling the artist experienced to an audience. For him, authenticity and universality are key. Collingwood, meanwhile, distinguishes expression from communication. Expression is the artist clarifying their own emotions, which may or may not involve an audience. He sees "infection" as mere arousal of emotion, not true expression.

  The user’s confusion makes sense. Both emphasize emotion but diverge sharply on mechanism. Collingwood’s rejection hinges on intentionality: if the artist aims to provoke a specific audience reaction (like Tolstoy’s infection), it becomes craft or propaganda, not art. Tolstoy might retort that sincerity and universality safeguard against manipulation, but Collingwood would call that irrelevant—the focus shifts from self-clarification to audience effect.

  I should highlight how Collingwood’s "expression" is exploratory (the artist discovers emotions through creation), while Tolstoy’s "infection" is transactional (feeling X in, feeling X out). The user might also wonder if Tolstoy’s universalism inadvertently excludes challenging art that doesn’t seek unity. 

  For evaluation: Collingwood’s critique lands because it exposes Tolstoy’s conflation of creation and reception. But Tolstoy’s emphasis on accessibility and moral function offers a counterweight to Collingwood’s potentially solitary focus. The user might appreciate this tension—both theories reveal different facets of art’s relationship with emotion.
answer: |-
  That's a brilliant question that cuts to the heart of a fascinating conflict in aesthetic theory. Both Tolstoy and Collingwood place emotion at the center of art, but their conceptions of *how* emotion functions are radically different, leading to Collingwood's sharp rejection of Tolstoy's "infection" model. Let's break it down precisely:

  **Tolstoy's Theory ("Infection"):**

  1.  **Core Mechanism:** Art is the deliberate **transmission** of a specific, pre-existing feeling from the artist to the audience.
  2.  **Artist's Role:** The artist must have genuinely *experienced* the feeling they wish to transmit. They then consciously use their chosen medium (words, paint, sound) as a **tool or vehicle** to encode that feeling and "infect" the perceiver.
  3.  **Artwork's Nature:** The artwork is essentially a **coded message** or a **stimulus package** designed to trigger the *same specific feeling* in the audience that the artist felt. Its success is measured by the efficiency and universality of this transmission ("infectiousness").
  4.  **Audience's Role:** The audience is the **passive recipient** of the infection. If they feel the *exact* feeling the artist intended, the art has succeeded for them. If not, it has failed (for them, or potentially as art).
  5.  **Value Criterion:** The *highest* art transmits feelings of universal human significance (love, compassion, brotherhood) that can unite people across social divides. Art transmitting narrow, elite, or corrupt feelings is bad or not art at all.
  6.  **Analogy:** Like giving someone a specific virus (the feeling) you have.

  **Collingwood's Theory ("Expression"):**

  1.  **Core Mechanism:** Art is the **clarification and articulation** of initially vague and inchoate feelings *within the artist* through the act of creation. It's **self-expression**, not primarily communication.
  2.  **Artist's Role:** The artist starts not with a clear feeling to transmit, but with a **turbulent emotional muddle**. The act of working with the medium (painting, writing, composing) is an *exploratory process* where the artist *discovers* what they feel by giving it form. Expression is **cathartic and cognitive** for the artist.
  3.  **Artwork's Nature:** The artwork is the **embodiment** of this clarified feeling. It *is* the expression itself, made concrete in the medium. It's not a code *for* a feeling; it *is* the feeling made manifest and intelligible *to the artist first and foremost*.
  4.  **Audience's Role (Secondary):** If an audience member perceives the artwork, they may recognize the expressed feeling as something *they themselves* could potentially feel or understand. This is **recognition**, not infection. The audience actively engages with the *expression* to find meaning *for themselves*, not passively receive a predetermined emotional payload. Collingwood calls this "recreation" of the expressive act in their own mind.
  5.  **Value Criterion:** Genuine expression has intrinsic value because it represents the clarification of consciousness. Art that *pretends* to express but actually manipulates is corrupt ("corrupt consciousness").
  6.  **Analogy:** Like untangling a knotted ball of yarn (the muddled feeling) and laying it out clearly (the artwork). Showing the untangled yarn *might* help someone else untangle theirs, but that's not the primary goal.

  **Why Collingwood Rejects "Infection" as Expression:**

  Collingwood sees Tolstoy's "infection" model falling squarely into what he calls **"Amusement Art" or "Magic" (which includes propaganda and ceremonial art):**

  1.  **Focus on Audience Effect, Not Self-Discovery:** For Collingwood, infection prioritizes the *audience's reaction* ("did they get the feeling?") over the artist's internal process of clarification. It turns art into a *technique* for *producing a predetermined result* in others, akin to a magician performing a trick or a priest conducting a ritual to evoke awe.
  2.  **Predetermined Feeling:** Tolstoy requires the artist to start with a *clear, identifiable feeling* to transmit. Collingwood argues the artist *starts with confusion*. If the feeling is known beforehand, expressing it isn't necessary; you could just state it ("I feel sad"). True expression is the *process* of finding out *what* you feel.
  3.  **Technique over Authenticity:** Infection relies on the artist using known *techniques* (rhetoric, harmonic progressions, visual clichés) proven to evoke specific responses. Collingwood argues this is **craft**, not art. Genuine expression *may* use technique, but it emerges spontaneously from the struggle with the medium to articulate the *unique* muddle, not from applying a formula to produce a stock response. Using technique to guarantee an audience feeling is manipulation.
  4.  **Passivity vs. Activity:** Infection implies the audience passively receives the feeling. Expression requires the audience to actively *recreate* the expressive act in their own mind to *understand* the feeling expressed, not just *feel* it identically.
  5.  **Confusion of Cause:** Collingwood argues Tolstoy mistakes the *consequence* of successful expression (the audience recognizing and perhaps sharing a similar feeling) for the *essence* of art (the artist's act of clarification). Expression might *lead to* a form of shared feeling, but that's a by-product, not the core mechanism.

  **In essence:** Collingwood argues Tolstoy conflates **arousing** a feeling in an audience (which is craft, magic, or propaganda) with **expressing** a feeling (which is a process of self-discovery and clarification for the artist). Infection is about external *effect*; expression is about internal *clarification*.

  **Does Collingwood's Objection Defeat Tolstoy? Can Tolstoy Respond?**

  *   **The Force of Collingwood's Critique:** Collingwood lands a powerful blow. He correctly identifies that Tolstoy's model:
      *   Privileges communication over creation.
      *   Risks reducing art to emotional engineering/technique.
      *   Doesn't adequately account for the exploratory, *self*-discovering nature of the creative process that many artists describe.
      *   Makes audience reaction the primary measure of artistic success, potentially excluding deeply personal but challenging work.

  *   **Tolstoy's Potential Resources for Response:**
      1.  **Sincerity as Safeguard:** Tolstoy could argue his demand for the artist's *genuine experience* of the feeling prevents the manipulative "technique" Collingwood fears. If the artist truly feels it and transmits it honestly, it's not mere craft or magic, but authentic sharing.
      2.  **Universality vs. Technique:** Tolstoy's emphasis on *universal* feelings counters the charge of relying on narrow, class-based techniques. The feelings he values (brotherly love, simple joy/sorrow) are precisely those *not* dependent on elite cultivation or technical trickery, but on fundamental humanity accessible to all.
      3.  **Expression *through* Transmission:** Tolstoy might argue that the *act* of successfully transmitting a profound, universal feeling *is* the artist's mode of clarifying and affirming that feeling for *themselves*. The communication *is* part of the expressive process. The desire to unite others *is* the feeling being expressed.
      4.  **Collingwood's Solipsism?:** Tolstoy could charge Collingwood's model with being overly individualistic and potentially solipsistic. If art is solely about the artist clarifying their own muddle, what is its social or moral value? Tolstoy's infection model provides a clear mechanism for art's unifying, morally uplifting social function – a function Collingwood struggles to articulate as centrally.

  **Evaluation & Judgment:**

  Collingwood's objection **seriously wounds, but doesn't completely destroy, Tolstoy's theory.**

  *   **Collingwood's Strength:** He exposes a genuine weakness in Tolstoy. Much art *does* seem driven by an internal exploratory process rather than a pre-planned transmission. Reducing art's success to a specific audience reaction *is* problematic and excludes complex or challenging work. The risk of conflating manipulation with expression is real.
  *   **Tolstoy's Enduring Value:** However, Tolstoy highlights crucial aspects Collingwood underplays:
      *   The **communicative power** and **social function** of great art as a force for shared feeling and unity.
      *   The importance of **authenticity** and **sincerity** rooted in lived experience.
      *   A powerful **democratic critique** of art that serves only elite sensibilities.

  **Conclusion:**

  The conflict arises because they prioritize different moments in the artistic process. Tolstoy prioritizes the **successful transmission of authentic, morally significant feeling to an audience.** Collingwood prioritizes the **artist's internal process of clarifying inchoate feeling through engagement with the medium.**

  Collingwood convincingly argues that "infection" is a model of emotional *arousal* or *communication*, not the core *expressive* act defining art. However, Tolstoy's emphasis on authenticity, universality, and art's unifying power offers a vital counterweight to the potential isolation and ambiguity of Collingwood's pure expression. Neither theory fully captures the entirety of art's complexity, but their clash illuminates fundamental tensions between art as communication and art as self-discovery, between social function and individual process. Your struggle with these "old books" reveals a timeless and profound debate!
