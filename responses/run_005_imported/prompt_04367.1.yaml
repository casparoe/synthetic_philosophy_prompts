prompt: |-
  Been meaning to ask this somewhere for a while. I fell down a rabbit hole a couple weeks ago re-reading old Overcoming Bias and early LessWrong posts on Pascal's Mugging (the one where the mugger says he'll use his powers from outside the Matrix to simulate and kill 3^^^^3 people unless you hand over five bucks), and I think I might've actually found the fix that everyone online keeps overcomplicating for no reason.

  Here's my thinking: the "paradox" only really bites if you round the mugger's probability of being legit all the way down to literally zero, and yeah, that's a no-no, since it breaks Cromwell's rule (the whole "leave a little room for the moon being made of green cheese" thing). But if instead you just assign his story some tiny-but-strictly-positive probability, like 10^-30 or whatever number feels sufficiently absurd, then you've dodged the zero-probability objection completely and the paradox just... resolves itself? Seems like it was only ever a problem for people sloppy enough to round all the way down to exact zero. My roommate, who's way more into decision theory then I am, swears this doesn't actually fix anything, and started going on about some "leverage penalty" that Yudkowsky and Robin Hanson apparently had to invent for exactly this reason, but he couldn't really explain why swapping in a tiny positive number instead of zero doesn't just close the case. So which is it, is he right that somethings still broken here (and why), or did I genuinely spot a hole that a bunch of LW old-timers somehow missed?
reasoning: |-
  Okay, let me start by unpacking the user's question. They're revisiting Pascal's Mugging, a thought experiment where a mugger threatens to simulate and kill 3^^^^3 people unless paid five dollars. The user thinks assigning a tiny but non-zero probability to the mugger's claim resolves the paradox, but their roommate disagrees, mentioning leverage penalties from Yudkowsky and Hanson. The user is confused about why their solution isn't sufficient.

  First, I need to recall the core issues with Pascal's Mugging. The problem isn't just about non-zero probabilities; it's about how decision theory handles extremely low-probability, high-stakes scenarios. The user’s approach replaces zero with a small number, say 10^-30. But does that actually solve the problem? 

  The expected utility calculation would be P(claim) * utility of outcome. If P is 10^-30 and the negative utility is -3^^^^3, the product is still astronomically negative. So paying $5 to avoid that makes sense mathematically. But intuitively, that seems wrong. Why? Because the mugger could make an even more outrageous claim, like threatening 3^^^^^3 people. As the claimed impact grows, even with smaller probabilities, the expected utility might still favor paying. But how small can probabilities get? 

  This ties into the leverage penalty concept. The probability shouldn't just be small; it should decrease as the claim becomes more extraordinary. Hanson's leverage penalty suggests that the probability should be inversely proportional to the stakes. So if the mugger threatens N people, P might be 1/N. Then P * N becomes constant, and the expected utility doesn't explode. That makes more sense. Without this, the mugger can always up the ante, forcing you to pay regardless of the probability you assign.

  The user might not realize that the issue isn't just avoiding zero but how we scale probabilities with claims. Their fixed small probability doesn't adjust for the magnitude of the threat. If the mugger says he'll kill a googleplex people, P=10^-30 might be too high. The probability needs to decrease as the claim gets larger. 

  Also, the user’s roommate mentioned decision theory complications. Expected utility theory breaks down with unbounded utility functions. If utilities can be infinite or near-infinite, any non-zero probability leads to extreme decisions. Maybe the solution involves bounded utility functions or adjusting how we assign probabilities to avoid being exploited by increasingly absurd threats.

  The user’s identity seems to be someone familiar with LW and OB but not deeply into decision theory. They’re looking for validation of their insight but are open to correction. Their deeper need might be understanding why smart people overcomplicate things and whether they’ve found a simple fix. They might also want to grasp the underlying principles without getting bogged down in complex theories.

  So, the key points are: fixed small probabilities don't scale, leverage penalty adjusts probabilities based on claims, and decision theory needs to handle extortionate scenarios. The user's solution avoids Cromwell's violation but doesn't address the exploitability. Explaining that the probability must diminish as the stakes increase would address their oversight and connect to the leverage penalty idea.
answer: |-
  You've hit on a crucial insight—**avoiding literal zero probabilities *is* necessary**—but your roommate is right that this alone doesn't fully resolve Pascal's Mugging. Here's why:

  ### 1. **Your Core Insight is Correct (and Important!)**
     - **Cromwell's Rule Matters:** Assigning exactly `p = 0` to the mugger's claim *is* a mistake. Any hypothesis not logically impossible deserves *some* tiny probability (e.g., `p ≥ 10^{-100}`). This prevents absolute certainty from blocking Bayesian updates.
     - **It "Resolves" the Simplest Paradox:** With `p = 10^{-30}`, the expected cost of ignoring the mugger is `10^{-30} × -3^^^^3`. While this is mind-bogglingly large, it's *finite*. If your utility function is linear and unbounded, paying $5 *does* technically maximize expected utility. Case closed? Not quite...

  ### 2. **Why This Isn't Enough: The Real Problem**
     The paradox resurfaces when you consider **scalability** and **adversarial incentives**:
     - **The Mugger Can Always Escalate:** Suppose you set `p = 10^{-30}` as your "floor" for absurd claims. The mugger now says, *"Actually, I'll kill 3^^^^^3 people (a MUCH larger number)."* If your `p` doesn't adjust downward as claims grow wilder, the expected loss `(p × -3^^^^^3)` becomes even larger! You're forced to pay *regardless* of how low your fixed `p` is.
     - **Extortion Incentive:** A fixed tiny `p` makes you vulnerable to *anyone* making arbitrarily huge threats. All they need is `(threat magnitude) > ($5 / p)`. If `p = 10^{-30}`, a threat > `$5 × 10^{30}` "works." This creates perverse incentives for bad actors.

  ### 3. **Enter the "Leverage Penalty" (Why Hanson/Yudkowsky Invented It)**
     This is where your roommate's point kicks in. The solution isn't just *non-zero* probability—it's **probability that decays sufficiently fast** as the claimed stakes increase:
     - **Robin Hanson's "Probability Leverage"**: Your prior probability for a claim shouldn't just be "small"; it should be roughly **inversely proportional to the scale of the claimed effect**. If the mugger threatens harm `H`, your prior should satisfy `P(Claim) ≲ 1/H` (or faster decay). This makes `P(Claim) × H` roughly constant (or decreasing), preventing escalation.
       - *Example:* If `H = 3^^^^3`, set `p ≈ 1/(3^^^^3)`. Then `p × H ≈ 1`, so the expected loss is ~equivalent to 1 life, not `3^^^^3`. Paying $5 to save 1 life may still be rational, but it's not catastrophic.
     - **Yudkowsky's "Priors Scale with Complexity"**: Assign probabilities based on the **complexity of the mechanism** claimed. Simulating `3^^^^3` minds requires inconceivable resources. The prior for such a mechanism existing *and* being used for mugging should decay *faster* than exponentially with the claimed computational scale.

  ### 4. **The Deeper Issue: Unbounded Utility Functions**
     Pascal's Mugging exposes a vulnerability in **unbounded utility functions**. If your ethics says `Utility(lives saved)` can be *arbitrarily large* (no upper limit), then:
     - For ANY fixed `p > 0`, there exists *some* threat large enough to make paying rational.
     - **Solutions require either:**
       - **Bounded utility**: Cap the maximum utility (e.g., "Saving more than X lives has no additional value").
       - **Stronger prior decay**: Enforce `P(Claim) decays faster than utility grows` (e.g., `P(H) ∝ e^{-H}`).

  ### Key Takeaways:
  | **Approach**               | **Why It Helps**                                       | **Why It's Insufficient Alone**               |
  |----------------------------|-------------------------------------------------------|-----------------------------------------------|
  | **Non-zero probability**   | Avoids Cromwell violations; handles finite threats.   | Fails against scalable, adversarial threats.  |
  | **Leverage penalty**       | Makes `P(Claim) × H` bounded; prevents escalation.    | Requires justifying why priors decay with `H`.|
  | **Bounded utility**        | Removes incentive for arbitrarily large threats.      | May conflict with intuitive ethics (e.g., utilitarianism). |

  **In short: You're right that `p > 0` is necessary, but without *how* that probability scales with the magnitude of the claim (the leverage penalty), decision theory remains vulnerable to extortion.** The LW old-timers weren't missing your point—they were wrestling with the *next layer* of the problem. Your insight is the foundation; the leverage penalty is the reinforcement needed to make it robust. Good catch on Cromwell's Rule though—that *is* often overlooked!
