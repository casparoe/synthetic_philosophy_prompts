answer: |-
  ## The Unbounded Circle: Assessing AAI and ASP Against Whelan's Boundary Problem

  Frederick Whelan's "boundary problem" presents a profound and seemingly inescapable logical challenge for democratic theory: how can a democratic procedure, which requires a pre-defined demos (the people), legitimately define *who* constitutes that demos without already presupposing its own existence? Attempting to let "all those affected" decide the demos merely begs the question, as the authority to make *that* decision already assumes a demos is in place. Whelan concludes this circularity renders the problem insoluble from within democratic theory, necessitating an external criterion. Robert Goodin's All-Affected-Interests (AAI) principle and the All-Subjected Principle (ASP) championed by Arash Abizadeh and David Owen are prominent attempts to provide such a criterion. However, a critical assessment reveals that neither AAI nor ASP fully escapes Whelan's circularity; instead, they relocate it to antecedent questions about the core concepts they deploy – "affected" and "subjected" – while offering differing strengths and weaknesses in grappling with the problem's practical and normative dimensions.

  **Goodin's All-Affected-Interests (AAI): Moral Reach and Circularity in Definition**

  Goodin's AAI principle grounds the demos in the fundamental liberal-democratic intuition that those whose interests are impacted by a decision should have a say in making it. This offers significant normative appeal:
  1.  **Moral Comprehensiveness:** AAI captures a core democratic ideal: legitimacy derives from securing the consent of those whose lives are consequentially shaped by collective power. It provides a powerful critical tool against arbitrary exclusion, demanding justification for why affected outsiders lack voice.
  2.  **Dynamic Sensitivity:** Unlike static territorial conceptions, AAI acknowledges the complex, transnational nature of modern causation. Decisions on climate, trade, or security genuinely affect individuals far beyond a polity's borders, and AAI insists this reality must inform democratic scope.

  However, AAI fails to escape Whelan's circularity, merely relocating it:
  *   **The "Affected" Conundrum:** Who defines what counts as a relevant "interest" and what threshold of "causally affected" triggers inclusion? Determining this *itself* affects interests profoundly. Granting a small group the authority to define "affectedness" for a major decision is undemocratic by AAI's own standard. Yet, democratizing *this* definitional process requires a prior demos – reintroducing the original circularity. Goodin acknowledges the near-universal scope of AAI for significant decisions but sidesteps the foundational problem of *who* authoritatively applies the criterion in the first instance.
  *   **The Scale Problem:** Goodin concedes AAI points towards a global demos for most consequential issues. While normatively coherent for some cosmopolitans, this presents insurmountable practical challenges for meaningful deliberation, participation, and collective action within existing institutional frameworks. The principle identifies a moral truth but offers no feasible path for its institutionalization without collapsing into an unworkable universalism or requiring arbitrary, non-democratic limitations on its own scope.

  **The All-Subjected Principle (ASP): Coercion, Institutions, and the Territorial Trap**

  ASP grounds the demos in the experience of subjection to a polity's coercive legal order. Its strengths lie in institutional realism and a focus on autonomy:
  1.  **Coercion as the Core Justificatory Problem:** ASP correctly identifies the imposition of binding, enforceable laws backed by state coercion as the primary act demanding democratic justification. If a power can command you and punish disobedience, democratic legitimacy requires you have a voice in authorizing that power. This provides a clear, morally salient connection between the exercise of authority and the right to participate.
  2.  **Institutional Feasibility:** ASP aligns more readily with the territorial reality of existing states. It offers a bounded demos congruent with jurisdiction, enabling the practical functioning of representative institutions, deliberation, and enforcement within a defined legal space. It provides a workable answer for constituting *a* demos, even if not *the* only possible one.
  3.  **Autonomy Focus:** By tying membership to subjection, ASP emphasizes the link between democracy and individual autonomy – protecting those whose choices are directly constrained by the collective power.

  Yet, ASP also relocates, rather than resolves, Whelan's circularity:
  *   **The "Subjected" Conundrum:** Who defines the scope of "coercion" or "subjection"? Does it include only direct legal commands, or also the pervasive effects of economic policy, environmental degradation, or security decisions emanating from a polity? Does it cover temporary residents? Individuals subject to extraterritorial application of laws (e.g., sanctions)? Defining the boundaries of "subjection" is itself a coercive act with profound consequences, requiring an authoritative decision-maker – again presupposing a demos. ASP merely shifts the boundary problem to defining the jurisdiction whose coercion matters.
  *   **The Territorial Trap:** ASP risks naturalizing existing state borders. It presupposes a defined territory where "our" laws apply coercively. But how were *those* borders established? Often through historical force or non-democratic processes. ASP provides a principle for constituting a demos *within* a pre-existing jurisdiction but offers no independent, democratic justification for the jurisdiction's *territorial scope* itself, potentially legitimizing the status quo regardless of its origins or its effects on outsiders.

  **Verdict: The Inescapable Shadow of Circularity and the Pragmatic Primacy of ASP**

  Whelan's fundamental insight holds: **no purely democratic, self-grounding solution to the boundary problem exists.** Both AAI and ASP, while offering valuable normative perspectives and practical frameworks, ultimately relocate the circularity into the antecedent definitions of their core concepts – "affected interests" and "subjection to coercion." The act of authoritatively defining these terms prior to applying the principle cannot itself be democratically legitimated without presupposing the very demos it seeks to define.

  However, this does not render democratic theory powerless or imply all boundaries are equally arbitrary. We must navigate the circularity pragmatically and normatively:

  1.  **ASP as the Foundational Institutional Principle:** For constituting a *workable* democratic polity capable of collective action and protecting autonomy against coercion, **ASP comes significantly closer to providing a viable solution than AAI.** Its focus on the direct experience of legal subjection provides a clear, morally urgent, and institutionally feasible criterion for defining a core demos. It offers a stable basis for democratic practice within a jurisdiction. While its territorial scope may have non-democratic origins, ASP demands that *within* that jurisdiction, those subject to the laws govern themselves.
  2.  **AAI as the Essential Critical Supplement:** AAI remains indispensable as a **critical principle** and a **supplement** to ASP. It highlights the moral claims of those *outside* the ASP demos who are nonetheless significantly affected by its decisions. Democratic legitimacy under ASP is weakened if a polity consistently ignores severe externalities imposed on outsiders. Mechanisms for incorporating affected interests – through representation, consultation, international law, or federal structures – are crucial for enhancing legitimacy, even if they fall short of full enfranchisement within the primary demos defined by ASP. AAI ensures ASP doesn't become a parochial justification for ignoring global responsibilities.
  3.  **The Necessity of Contestation and Iteration:** Recognizing the inescapable circularity means accepting that boundaries are contingent and must be open to democratic contestation *within* the demos constituted by ASP. The definitions of "subjection" and the recognition of "affected interests" must be ongoing subjects of democratic deliberation and revision. History, geography, shared identity, and functional efficacy also play roles in shaping boundaries, but ASP provides the core justificatory link to the state's coercive power.

  **Conclusion**

  Whelan's boundary problem exposes a deep, logically inescapable circularity at democracy's foundation. Neither Goodin's AAI nor Abizadeh and Owen's ASP provides a magic bullet that escapes this circularity; both relocate it into the problem of defining their core concepts authoritatively. AAI's strength is its expansive moral vision but founders on the impossibility of democratically defining "affectedness" without prior boundaries and its impractical scope. ASP's strength is its institutional realism and direct link to the justification of coercion, but it risks naturalizing existing territorial borders and struggles to define "subjection" non-circularly. **Therefore, while acknowledging the persistent shadow of circularity, ASP emerges as the superior principle for defining the core demos of a functioning democratic polity due to its focus on the immediacy of legal subjection and institutional feasibility.** However, a legitimate democratic order must incorporate AAI's critical insight by actively seeking mechanisms to acknowledge and mitigate the impact of its decisions on externally affected interests. The boundary problem admits no perfect, self-grounding solution, but ASP, supplemented by the moral pressure of AAI and embedded within ongoing democratic contestation, provides the most principled and practicable approach available.
