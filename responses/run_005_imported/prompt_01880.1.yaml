  I wonder about underlying drivers... Maybe fear of stillness? Or conflating achievement with self-worth? The decade-long pattern suggests deep conditioning where productivity equals value. That's exhausting - and unsustainable.

  The real need here seems to be learning to derive satisfaction from states rather than milestones. But how to convey that without psychobabble? Practical reframing might help - like distinguishing between "doing" and "being" modes. The guitar example is perfect for this: what if they tried playing badly on purpose? Or set a timer to play with zero improvement goals?

