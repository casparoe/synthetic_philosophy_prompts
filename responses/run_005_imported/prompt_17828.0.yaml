  - **Furthest from escape**: All-affected (indeterminate scope), Lottery (arbitrary parameters).  
  - **Practical takeaway**: Defensibility decreases as principles become either infinitely expansive (affected) or morally unmoored (lottery), with stakeholder/coercion striking the best balance.
