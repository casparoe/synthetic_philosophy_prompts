reasoning: |-
  Okay, the user is preparing for a comprehensive exam on democratic theory, specifically focusing on the boundary problem. They mention several key readings: Whelan's bootstrapping worry, Goodin on all-affected interests, the Abizadeh vs. Miller debate, and López-Guerra's proposals. Their brain feels overloaded, so they're asking for a gut-check ranking of six different answers to "who belongs to the demos." They want this ranking based on my judgment, not just what's most cited in the literature. 

  The six principles they list are: all-affected interests, all-subjected/coercion, Bauböck's stakeholder principle, nationality/self-determination, birthright citizenship, and López-Guerra's enfranchisement lottery. For each, I need to give a single-sentence reason and explicitly state whether it escapes or relocates Whelan's bootstrapping problem. The output must be in a specific JSON format.

  First, I need to recall Whelan's bootstrapping worry: deciding who gets to vote on the boundary can't be done by voting without circularity. Any principle that relies on democratic decision-making to set its own scope faces this problem. 

  Now, thinking about the principles:

  1. **All-affected interests (Goodin)**: Sounds ideal but is impossibly vague. "Affected" could mean almost anyone indirectly impacted, making it impractical. It definitely doesn't escape bootstrapping—it just kicks the can down the road on who defines "affected."

  2. **All-subjected/coercion (Abizadeh)**: Focuses on those subject to coercion, which is clearer than "affected." But defining "coercion" is still tricky, and it relocates bootstrapping rather than solving it. 

  3. **Bauböck's stakeholder principle**: Emphasizes durable ties, like residency or long-term stakes. This feels more grounded because it's about concrete connections to a community. It doesn't fully escape bootstrapping, but it's less abstract than the first two, making it more defensible. I'd rank this high.

  4. **Nationality/self-determination (Miller)**: Ties membership to national identity, which is exclusionary and static. It avoids bootstrapping by being pre-political, but that's also its weakness—it can justify arbitrary exclusion. 

  5. **Birthright citizenship**: This is how most countries operate, but it's morally arbitrary. It escapes bootstrapping technically, since it's based on birthplace or descent, but it's unfair and perpetuates inequality. 

  6. **López-Guerra's enfranchisement lottery**: Randomly selecting voters? Wild idea, but it undermines core democratic values like inclusion and equality. It doesn't solve bootstrapping; it just dodges it chaotically. Least defensible.

  Ranking them from most to least defensible: Stakeholder first (practical and ethical), then coercion (clearer scope), affected interests (idealistic but messy), nationality (exclusionary), birthright (arbitrary but functional), lottery (gimmicky and unjust). 

  For the JSON, I'll structure it as requested, with concise reasons and bootstrapping status. The user seems stressed and overwhelmed, so this direct, opinionated ranking might help them grasp the big picture amid theoretical chaos. They're likely craving clarity for exam prep, not just citations. 

  Final note: My ranking prioritizes principles that are both normatively strong and somewhat implementable, while being honest about bootstrapping. The stakeholder principle tops the list because it balances ethics and realism better than the others.
