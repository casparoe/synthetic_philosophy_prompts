  ### Case Analysis:

  1. **1973 Berkeley admissions data (Gender bias in admissions)**
     - **Lurking variable**: Department applied to.
     - **Role**: Confounder. The department choice is influenced by gender (women applied more to departments with lower admission rates) and affects admission. To see the true effect of gender on admission (without the influence of department choice), we must condition on department. Therefore, the stratified analysis is more appropriate.

  2. **Kidney-stone treatment study (Julious and Mullee)**
     - **Lurking variable**: Size of the kidney stone.
     - **Role**: Confounder. The size of the stone influences both the choice of treatment (open surgery vs. percutaneous) and the outcome (success rate). Larger stones are more difficult to treat and are more likely to be treated with open surgery. To compare the treatments fairly, we must condition on stone size. Stratified analysis is appropriate.

  3. **Whickham survey data (Smoking and twenty-year survival)**
     - **Lurking variable**: Age.
     - **Role**: Confounder. Age is associated with both smoking status (younger people are more likely to smoke) and mortality (older people have higher mortality). The aggregate data showed smokers had higher survival, but when stratified by age, smoking is harmful. Age confounds the relationship. Stratified analysis is necessary.

  4. **Radelet and Pierce study (Race and death penalty in Florida)**
     - **Lurking variable**: Race of the victim (or possibly the combination of defendant and victim race).
     - **Role**: The variable of interest is the race of the defendant, and we are looking at its effect on death penalty sentencing. The race of the victim is a confounder because it is associated with the defendant's race (same-race crimes are more common) and also influences the sentencing (harsher for black defendant/white victim). However, the causal question is about racial bias in sentencing, and victim race is a key factor in that bias. Therefore, we should condition on victim race. But note: the causal structure is complex. Some argue that victim race is a mediator (the defendant's race might influence the victim's race, which then influences sentencing), but in reality, the victim's race is determined before the sentencing and is not caused by the defendant's race. Instead, it is a confounder in the sense that the combination of defendant and victim race is a social context that affects sentencing. We'll treat it as a confounder. Stratified analysis is appropriate.

