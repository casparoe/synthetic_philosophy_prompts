  Right, breaking this down: First, the core tension in Schlick—if meaning is play (Selbstzweck), why pivot to "youth"? That infant mortality consequence is philosophically radioactive. Need to frame this as a forced choice: Is meaning duration-independent (making infant life "complete") or does accumulation matter? Guest can't duck this. 

