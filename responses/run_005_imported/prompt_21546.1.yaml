prompt: |-
  hey so we're doing the testimony unit in my epistemology seminar rn and i keep mixing up reductionism vs anti-reductionism. could you write me a dialogue between a Humean reductionist and a Coady-style anti-reductionist? i want them to actually hash out the argument about how small kids clearly rack up loads of justified testimonial beliefs way before they could've built up any independent track record of checking testimony against reality - and the reductionist shouldn't get to just dodge Burge's Acceptance Principle when it comes up either. make it a proper back-and-forth where they respond to each other's actual points, not two speeches talking past each other, and dont let either side win too easily pls.
