  First, I need to recall the key arguments. Humean reductionism requires individuals to have positive reasons based on their own experiences to trust testimony. Anti-reductionism, following Coady, argues for a default acceptance of testimony as a fundamental source of knowledge. The user wants the dialogue to address the child objection—children learn from testimony before they can verify it. Also, Burge's Acceptance Principle states that we have a prima facie right to accept testimony as true, which the reductionist can't dodge.

