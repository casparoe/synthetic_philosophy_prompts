      *   **Strengths:** Perfectly captures the essence. Voting defines the "big-picture goal" (values - e.g., maximizing GDP). Prediction markets handle "whether the policy will turn out to be a good one" *relative to that goal* (beliefs - forecasting if the policy causally leads to a higher GDP). Directly and accurately links the slogan to the process.

