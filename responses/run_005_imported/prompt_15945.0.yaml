answer: |-
  ## Dialogue: The Cost of Correlation at Wings A and B

  **Setting:** Two adjacent labs separated by 10km. Alice (Everettian) monitors her detector at Wing A. Bob (Bohmian) watches his at Wing B. They've just run an EPR-Bohm experiment on an entangled singlet state pair. Screens display correlated results (e.g., Alice: Spin Up Z-axis, Bob: Spin Down Z-axis). A video link connects them.

  **(The results flash on screen. Alice smiles; Bob nods.)**

  **Bob (Bohmian):** See that? Perfect anti-correlation. Again. Beautiful confirmation of the quantum structure. *But Alice, doesn't this precise match, instantaneously across 10km, gnaw at your Everettian soul? You have your "Up" branch here, and your "Down" branch there. My Bohmian configuration guided *this* particle here to Down, *knowing* yours went Up. What, in your branching multiverse, *enforces* that correlation? Why aren't there branches where *both* go Up? What mechanism *connects* Alice-Up-A and Bob-Down-B, ensuring they "find each other" in the branching structure? It looks suspiciously like nonlocal handshaking to me, just hidden in the branching.

  **Alice (Everettian):** Bob, you're stuck in the single-outcome mindset Bell presupposed! Bell assumed there *was* a single, definite result at A and a single, definite result at B to correlate nonlocally. But in Everett, *that premise is false*. There *isn't* a single outcome at A or B. There's the *entire wavefunction*, unitarily evolving, containing *all* possible result pairs (Up-Down, Down-Up) perfectly correlated from the moment of entanglement. The correlation is *already there*, globally, in the state vector. Nothing "happens" at A or B to *create* it; it's revealed by decoherence as we measure. Deutsch and Hayden showed this beautifully: in the Heisenberg picture, information about the *global* correlation is perfectly encoded in *local* observables at each wing *before* measurement. When I measure here, I'm just accessing the local information *already present* describing my part of the entangled whole. No signal crosses the light cone. The correlation flow is local in the information-theoretic sense.

  **Bob:** Local information flow? That sounds like sophistry! You have a wavefunction `|ψ> = 1/√2 (|Up_A, Down_B> - |Down_A, Up_B>)`. When *you* measure and see "Up", that branch `|Up_A, Down_B>` becomes *your* reality. But what guarantees that *over here*, in *my* wing, in *that same branch*, the particle *is* Down? Why does *my* Bohmian position variable in *that branch* correspond to Down? What physically *binds* the branch label "Up_A" to "Down_B" across 10km? Your "local information" at B describes a *superposition* until *I* measure! How does the universe "know" to match *my* decohered outcome to *yours* without some nonlocal link ensuring the right branch partners are correlated? The correlation information might be locally *stored*, but the *enforcement* of which local outcome pairs are realized together – that seems inherently nonlocal. You've relocated the nonlocality from outcomes to branch selection.

  **Alice:** You're conflating the *appearance* with the *reality*. In the global wavefunction, the branches `|Up_A, Down_B>` and `|Down_A, Up_B>` are *orthogonal components*. Decoherence makes them effectively separate. There *is no* "branch selection" event. Both branches exist. *You* (in all your versions) are part of that wavefunction. The "Bob" in the `|Up_A, Down_B>` branch *is* coupled to the "Alice" in that *same* branch component via the initial entanglement and the unitary evolution. It's not that separate parts "find" each other; they *are* parts of the same coherent whole from the start. The "binding" is the wavefunction itself. Your Bohmian theory, on the other hand, *explicitly* introduces nonlocality! Your guiding equation: `dQ/dt = (ħ/m) Im[ ψ* ∇ψ / |ψ|² ]` – that `ψ` is the *entire, non-separable, nonlocal* wavefunction! The velocity of *my* particle *here* depends instantaneously on the position of *your* particle *10km away*, via ψ. *That's* action-at-a-distance! How do you reconcile that blatant nonlocality with relativity?

  **Bob:** Fair point, Alice. The guidance *is* nonlocal. But it's *empirically coherent* and *doesn't allow signalling*. The nonlocality is hidden, constrained by the quantum equilibrium (`|ψ|²` distribution). It doesn't violate relativity's *predictions* (no FTL signals), only its *intuitive spirit*. We sacrifice *locality* to keep *determinism* and *single, definite outcomes* without ambiguity. We pay that price openly. But you, Alice, you claim locality. Yet, to avoid the nonlocality inherent in correlating *definite* outcomes – which Bell proved you must have – you sacrifice the *single, definite outcome* itself! You replace one nonlocality (in outcomes) with another kind of nonlocality – the *global, instantaneous structure* of the wavefunction upon which your "local information" utterly depends. Your locality is purchased by making the entire universe a single, non-separable object where "here" and "there" are never fundamentally independent. Is that *true* locality, or just relabeling dependence as "global unity"?

  **Alice:** It *is* true locality in the only sense operational physics requires: no *causal* influences cross spacelike intervals. All predictions, all observable probabilities, are determined by local operations and the *past* light cone (via the initial entangled state preparation). The wavefunction's unity isn't "nonlocal influence"; it's the fundamental reality. The cost *we* pay is ontological extravagance – the vast multiplicity of worlds. But we retain full unitarity, full compatibility with relativistic spacetime *structure* (no preferred foliation needed!), and *no* explicit nonlocal equations governing dynamics. Your "local information" argument misses the point: the information *is* locally accessible *because* the global state is what it is. The cost *you* pay, Bob, beyond nonlocality, is the *preferred foliation*. To make your nonlocal guidance equation compatible with Lorentz invariance *at all*, you need a dynamically privileged reference frame to define the "instantaneous" ψ in the guidance equation. That's a profound violation of relativity's fundamental democracy of frames! You sacrifice the spirit of relativity to save the letter (no signalling), while introducing explicit dynamical nonlocality.

  **(A pause. The correlated results still glow on their screens.)**

  **Bob:** So, the cost for me: Explicit dynamical nonlocality in the guiding equation, and a necessary, hidden preferred foliation in spacetime to make it coherent with relativity. We sacrifice fundamental Lorentz invariance for definite particle positions and trajectories.

  **Alice:** And the cost for us: A vast, arguably extravagant ontology of branching worlds, the absence of a single, unique outcome for any experiment, and the need to explain the *appearance* of probability as "branch weight" derived from the wavefunction. We sacrifice the intuitive notion of a single, shared reality to retain fundamental locality, unitarity, and seamless compatibility with relativistic spacetime *without* hidden structures.

  **Bob:** We both pay. You with worlds, me with action-at-a-distance and a hidden frame.

  **Alice:** And neither of us can have the naive classical dream: local, deterministic, single-outcome physics without hidden variables or branching. Bell saw to that. The universe makes us choose which pill to swallow.

  **Bob:** Indeed. Enjoy your multiverse, Alice. I'll stick with my hidden variables and explicit nonlocality. At least my particles know where they are.

  **Alice:** And you enjoy your preferred frame, Bob. At least my information flows locally within each world. The cost of correlation is high, no matter the interpretation.

  **(They both turn back to their screens, the perfect, puzzling anti-correlation a silent testament to the price quantum mechanics demands.)**
