  The defensible comeback for ritual defenders would be metaphysical: maybe in this world, cosmic balance matters more than human purposes. If the ritual literally transmutes moral debt into physical energy discharged by the volunteer's death, it's not about justice - it's about thermodynamics of sin. But that reveals the system's amorality.

