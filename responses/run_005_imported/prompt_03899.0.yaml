  The harmony/ melody division seems intentional too - harmony embodies the nested hierarchy of nature (minerals→plants→animals), while melody represents human consciousness transcending that chain. That explains the separate treatment: melody isn't part of the gradation because it mirrors will's self-awareness, not objectification stages. 

  User's sharp to notice the phrasing "whole gradation" applies only to harmony. That's not careless writing - it reflects Schopenhauer's view that melody operates on a different metaphysical level. 

