answer: |-
  Your grandfather's position raises a fundamental question about the source of moral truth: **Can a sincere feeling of disgust or "gut-level wrongness," absent any identifiable harm, be sufficient evidence that something is morally wrong? The answer is no, and here's why:**

  1.  **The "Appeal to Nature" Fallacy:** "Against nature" is a common but deeply flawed argument.
      *   **Many natural things are harmful or immoral:** Disease, natural disasters, predation, and death are "natural," but we don't consider them moral goods. Appealing to nature doesn't tell us what *should* be.
      *   **Many "unnatural" things are beneficial or morally neutral:** Medicine, agriculture, clothing, language, art, and technology are all human interventions against a "pure" state of nature. We value them immensely. Using a smartphone is profoundly "unnatural" but not immoral.
      *   **Homosexuality *is* natural:** It's observed in hundreds of animal species and has existed throughout human history across diverse cultures. Its persistence suggests it's a natural variation in sexual orientation.

  2.  **The Problem of Disgust as a Moral Guide:**
      *   **Disgust is culturally conditioned and highly variable:** What disgusts one culture or individual is perfectly acceptable or even revered in another (e.g., eating insects, certain foods, burial practices, hygiene norms). Basing morality on disgust would lead to endless contradictions and no objective standard.
      *   **Disgust has been used historically to justify horrific oppression:** Racism, sexism, anti-Semitism, caste systems, and persecution of various groups were often justified by appeals to "unnaturalness" and visceral disgust felt by the majority or powerful. We rightly reject those arguments *because* they lacked a foundation in actual harm and were based on prejudice.
      *   **Disgust is often a reaction to difference, not harm:** Your grandfather admits no harm is being done. His reaction seems primarily about difference, unfamiliarity, or challenging deeply ingrained cultural norms he associates with "the natural order." This is a common human reaction to social change, but it doesn't make it morally insightful.

  3.  **The Core of Ethics: Harm and Well-being:** Most robust ethical frameworks (utilitarianism, human rights-based ethics, care ethics) focus on concepts like:
      *   **Preventing harm and suffering**
      *   **Promoting well-being, flourishing, and happiness**
      *   **Respecting autonomy and consent**
      *   **Ensuring fairness and justice**
      Since your grandfather explicitly admits your relationship harms *no one* (including yourselves) and seemingly brings you happiness and fulfillment, it fails to meet the criteria for being *morally wrong* according to these core ethical principles. The *absence of harm* is crucial.

  4.  **Feelings vs. Moral Reasoning:**
      *   **Feelings are data, not verdicts:** Your grandfather's feeling of disgust is real *for him*. It tells us something about his personal psychology, upbringing, cultural background, and biases. It does *not* tell us something objective about the moral status of your relationship.
      *   **Moral reasoning requires justification:** Valid moral claims need reasons *beyond* personal feeling. We need to ask: *Why* is it wrong? *Who* is harmed? *What* principle is violated? If the only answer is "It feels wrong to me," that's insufficient for claiming something is *objectively* morally wrong. It's a statement of personal preference or prejudice, not a moral argument.
      *   **The Burden of Proof:** If someone claims something is morally wrong, especially when it involves consenting adults causing no harm, the burden is on *them* to provide a reasoned justification beyond their own visceral reaction. "It feels wrong to me" doesn't meet that burden.

  **Why it feels "off" to you:**

  It feels off because your intuition correctly recognizes that:
  1.  **Harm is missing:** Ethics fundamentally concerns well-being, and no harm is present.
  2.  **The argument is circular:** "It's wrong because it feels wrong" doesn't provide an actual reason.
  3.  **It privileges his feeling over your reality:** He dismisses the observable love, commitment, and lack of harm in your relationship based solely on his internal, unexplained discomfort.
  4.  **It echoes historical prejudice:** You sense the similarity to arguments used to oppress others based on difference.

  **Is he "onto something"?**

  He's onto a powerful *human psychological phenomenon* – the strong emotional reaction people can have to things that challenge deeply held norms or feel unfamiliar. He's *not* onto a sound moral principle. His feeling, while sincere, is not evidence of objective moral wrongness; it's evidence of his own subjective perspective and likely unchallenged assumptions.

  **Conclusion:**

  A strong, sincere feeling of disgust, absent any identifiable harm, **does not carry inherent moral weight on its own.** It is a personal reaction, not moral evidence. Morality requires reasoned justification based on principles like preventing harm, promoting well-being, respecting autonomy, and ensuring fairness. Your relationship, involving consenting adults causing no harm, fails to violate any of these principles. Your grandfather's discomfort, while real for him, stems from personal and cultural factors, not from a defensible moral foundation. It's understandable that you seek his approval, but his inability to move beyond a gut feeling reveals the limitation of his position, not a flaw in your relationship.
