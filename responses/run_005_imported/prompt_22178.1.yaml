  So this is a bit of a weird one but bear with me. I've started getting sleep paralysis for the first time in my life, three episodes in the past month, and in the worst one I was 100% convinced someone was standing at the foot of my bed — I could see the shape, the posture, all of it, and it looked exactly as real as anthing I see when I'm properly awake. My doctor says it's totally normal, just my brain half-waking up, nobody was actually there, and I believe her. But it's kind of messing with my head: if a hallucination can feel completely identical to real seeing from the inside, what actually makes my regular, everyday vision any more trustworthy or "in touch with reality" than that was? Is there a real difference between the two, or does normal perception just get lucky that there's usually something actually there? Not looking for medical advice, more trying to figure out if there's an actual answer to this or if I'm just overthinking a brain glitch.
