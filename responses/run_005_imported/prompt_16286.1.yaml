  The user might also be hinting at a deeper concern: whether "structure" can ever be non-trivial if it's all there is. OSR's success depends on whether it can ground relations in something more than patterns. Physics helps here because the structures are tied to mathematical equations with empirical content. But there's ongoing debate, which the user should engage with. 

