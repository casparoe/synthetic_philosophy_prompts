  Now, why is this a problem for ESR specifically? Because ESR separates structure from ontology. The relations are defined by their extensions, not their natures. So the structural knowledge Worrall wants to preserve is too thin—it doesn't constrain the world enough. 

  Moving to Ladyman's OSR. By making structures ontologically primitive, OSR denies that relations are just sets of tuples. Instead, the relations themselves are fundamental. So when OSR says "the world has structure S," it's not just claiming there's some domain with extensions matching S. It's saying the relations themselves are real and not reducible. This blocks the "any domain will do" because the relations' identities matter—they're not just defined by their extensions. 

