  For the falsification question: If cosmology isn't challenged, what empirical or decision-theoretic failures would undermine ECL? This forces concrete predictions. The speaker might cite failed cooperative outcomes, but in large worlds, that's tricky to measure. A follow-up could highlight that tension.

