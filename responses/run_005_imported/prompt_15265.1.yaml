  Here’s a scene concept grounded in Hobbes’s philosophy, his geometric epistemology, and the delicious irony of his defiance—pulling directly from his *De Corpore* and his feud with Wallis. This avoids "pride" and instead weaponizes his core ideas against his critics:

  ### The Scene: A Clash of Certitudes
  **Setting:** A dim, smoke-filled coffeehouse near Gresham College. Hobbes, hunched over a pamphlet draft, muttering. **YOUNG PHILOSOPHER (YP)**, earnest and slightly naive, approaches.

  **YP:** Master Hobbes, forgive the intrusion... but your latest against Dr. Wallis... Sir, with respect, must it *always* be war? Mathematicians of the first rank – Huygens, Brouncker, even Boyle – agree the quadrature is impossible. Might not... cessation bring peace?

  **HOBBES:** *(Snorts, not looking up)* Peace? With charlatans who peddle *indivisibles*? With Wallis, who confuses *algebra* with *geometry*? Peace is for the credulous. Certainty demands defense.

  **YP:** But your own philosophy, sir! In *De Corpore*, you teach that geometry is unique. *We* make the definitions, *we* generate the figures by motion – the circle from the compass’s sweep. Because we construct it, we can *know* it with absolute certainty. Unlike... well, politics or physics. Surely then... if the construction *fails*...?

  **HOBBES:** *(Eyes snap up, sharp and angry)* **Fails?** Boy, you parrot their error! The failure lies not in *my* construction, but in *their understanding* of it! They apply rules fit only for magnitudes generated by *arithmetic* – that realm of names divorced from clear generation! – to magnitudes generated by *motion*. They mistake the *symbol* for the *thing generated*.

  **The Core of Hobbes’s Sincerity (The "In-the-Weeds" Answer):**

  1.  **The Primacy of Generative Definitions & Motion:** For Hobbes, a true geometric demonstration *isn't* just a logical chain of symbols (Wallis's algebra). It's a mental re-enactment of the *physical generation* of the figure. He defined a circle as "a figure generated by the circumduction of a straight line" (compass motion). His "squaring" relied on specific constructions involving lines, arcs, and specific points generated by intersecting motions.
  2.  **The Indivisibles Heresy:** Wallis used infinitesimals/indivisibles (precursors to calculus). Hobbes saw this as **philosophically monstrous** – a violation of his materialism and his theory of names. An "indivisible line" is a contradiction in terms for Hobbes. A line *is* generated by the motion of a point; it *must* have divisible parts by definition. Wallis's methods weren't just *wrong*; they were *meaningless gibberish* – names without conceivable generation. Accepting Wallis's verdict would mean accepting nonsense *as* geometry.
  3.  **"Error in the Premises, Not the Conclusion":** Hobbes genuinely believed his *generative definitions* and the *constructions derived from them* were flawless. If the conclusion (the square equal to the circle) seemed impossible *when judged by Wallis's alien algebraic rules or the absurdity of indivisibles*, it wasn't proof *he* was wrong. It was proof that:
      *   **a)** The critics misunderstood his specific generative definitions and constructions.
      *   **b)** They were using illegitimate (non-generative, non-material) methods to judge it.
      *   **c)** Their *own* definitions of "circle," "equal," or "quadrature" were flawed or imprecise. He might accuse them of confusing the abstract *concept* with the *generated figure*.
  4.  **The Illusion of Refutation:** When shown counter-arguments (like how his construction didn't *actually* produce equality), Hobbes would dissect the counter-argument itself. He'd claim *it* relied on ungenerated concepts, misapplied his definitions, or used a corrupted understanding of magnitude. The refutation, *in his mind*, failed to engage with the *true generative reality* of his demonstration. It was like trying to refute a description of a physical compass motion using only abstract number theory.

  **YP:** But sir... the Royal Society... they've examined it. They pronounce it flawed. By your *own* doctrine in *Leviathan*, does not private judgment – even yours – yield to the public, authorized verdict? Else... conflict endures. Is this not... *(hesitates)*... precisely that conflict?

  **The Irony Unleashed:**

  **HOBBES:** *(Leans forward, voice low and dangerous)* **Aha!** Now you touch the nerve! You think this is some petty squabble over inches and degrees? You think the Royal Society – that cabal of virtuosi playing with air-pumps and admiring flies under glass – is the **sovereign** appointed to judge *Euclid*? **No!**

  *   **The Sovereign of Truth:** "The Sovereign in *matters of fact* is Judge. But **Geometry is not matter of fact!** It is matter of *Reason* grounded in the **certain generation** of figures. There is but *one* Sovereign here: **the Definitions and the Constructions!**"
  *   **The Illegitimate Umpire:** "The Society presumes to judge *Geometry*? With what authority? They admit Wallis! A man who traffics in *ghosts of magnitudes* – indivisibles! Fantasies! They use *algebra* – a tool of computation, fit for merchants, not for *philosophical demonstration* of generated magnitudes! Their 'authority' is founded on **error** and **jargon**. To yield to *their* judgment on a geometric demonstration would be to yield **Reason itself** to the rule of **Babel**!"
  *   **The Deeper Conflict:** "My conflict with Wallis is *not* mere dispute. It is the **defense of true Philosophy against its corruption**. To admit error *on their terms* would be to surrender geometry to the same chaos of private interpretation that plunged England into civil war! Wallis's *indivisibles* are the *Presbyterians* of mathematics – schismatics against clear definition and generation! I fight not for pride, boy, but for the **sovereignty of Reason** as manifest in the **generative act**."

  **The Young Philosopher's Realization:**
  YP doesn't see a proud old man. He sees a man *trapped* by the very rigor of his own philosophy. Hobbes’s absolute commitment to **generative definitions as the sole source of geometric certainty** blinds him to the possibility that *his specific generation* (his construction) is flawed. The "certainty" he derives from his own mental construction becomes an unassailable fortress. The critics, using different tools (algebra, limits) he deems illegitimate *by his own definitions*, cannot possibly breach it. Their verdict isn't wrong; it's *inapplicable*.

  **Ending Beat:** Hobbes stabs a finger at his diagram. "See here! The point *E* generated by the intersection of *arc AD* and *line BC*... Wallis claims the resulting magnitude isn't equal? *He defines equality by ratios of numbers!* I define it by **congruence under motion**! His *numbers* are abstract phantasms; my *magnitudes* are generated realities! Where is *his* demonstration grounded in generation? Where? **Silence!** He has none! Only *calculation*! This..." *(he taps the diagram fiercely)* "...is **Reason**. Theirs is... *noise*."

  YP leaves not convinced Hobbes is *right*, but understanding why Hobbes *cannot* believe he is *wrong* – and why, in Hobbes's mind, yielding would be an act of profound philosophical and even *political* betrayal. The scene highlights the tragicomic gap between Hobbes’s ideal of geometric certainty and the stubborn reality of his own error, all framed by his core philosophical commitments.
