  Hmm, the key here is connecting his geometric philosophy to his stubbornness. Hobbes believed geometry was the only true science because humans construct the objects themselves through definitions and procedures. But if that's the case, why wouldn't he accept correction when his proof was flawed? 

  Ah, I recall Hobbes had a very specific view of what counts as a valid demonstration. He thought true geometric proofs must be based solely on definitions and the generation of figures through motion. Wallis and others used algebra and limits, which Hobbes considered "computational tricks" rather than true geometric demonstrations. 

  There's also his theory of names - he believed words must precisely correspond to mental conceptions. When critics pointed out errors, Hobbes likely thought they were misapplying terms like "circle" or "equal" based on their abstract algebraic methods rather than his concrete constructive definitions.

  The irony is delicious - his political philosophy demands submission to sovereign judgment, yet in geometry he becomes the ultimate private judge because he considers the Royal Society mathematically incompetent to rule on geometric truth. 

  For the scene, the younger character should push on the contradiction between his philosophy of authorized judgment and his personal obstinacy. Hobbes would likely respond that geometry is different from politics because it deals with certainties we construct ourselves, not opinions. The "umpire" metaphor fails because the Royal Society aren't true geometers in his view.

  The tension between his nominalism (words as labels for mental constructs) and realism (geometry as objectively true) could surface when the younger character points out his definitions don't match common usage. Hobbes might snap that common usage is precisely the problem in geometry.

  This approach avoids generic pride while staying true to his philosophy. The scene could climax with Hobbes equating Wallis' methods with the linguistic chaos of the English Civil War - both failures to properly define terms. That would tie his geometric feud back to his political trauma beautifully.
