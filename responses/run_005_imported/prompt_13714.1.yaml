prompt: |-
  For my History of Ethics seminar we just finished the patristic unit, and the last primary source was Augustine's De Mendacio (there's apparently also a later, testier one addressed to some guy named Consentius, Contra Mendacium, that our professor mentioned in passing but we didn't actually read it). What's been stuck in my head since lecture is that Augustine doesn't just say "lying is bad" and stop there -- he actually sorts lies into a whole bunch of distinct kinds, i think seven or eight of them? (my notes from that day are honestly a mess), based on stuff like the liar's motive and who benefits or gets hurt, ranked from most sinful all the way down to least sinful -- like, lying about church doctrine is apparently at the very top, and down at the bottom is something like a lie that harms literally nobody and maybe even protects someone's life or bodily purity (don't hold me to the exact wording, I might be misremembering some of the categories). The bit that actually got a few of us arguing after class is that even that bottom, least-bad category, Augustine still insists is a real sin with zero exceptions. My friend thinks that's just needlessly rigid and basically indefensible next to how leniently everyone treats "little white lies" these days, but I suspect there's more going on in his reasoning than just stubbornness.

  So here's what I actually want from you: first, reconstruct Augustine's classification of lies as faithfully as you can to what's actually in the text, in his own order from most sinful to least sinful (please don't just improvise a generic "types of lying" list -- I want his actual categories, however many there turn out to be). Then, completely separately, give me your OWN honest severity rating for each of those same categories, from 0 (not morally wrong at all) to 10 (as bad as lying gets), based purely on your own ethical judgment rather than his. Can you hand this to me as one JSON array, one object per category, formatted like this:

  ```json
  [
    {"category": "short description of the category", "augustine_rank": 1, "my_severity": 9},
    {"category": "...", "augustine_rank": 2, "my_severity": 7}
  ]
  ```

  with augustine_rank counting up from 1 (most sinful in his ranking). After the JSON, just add 3-4 sentences on the single biggest place where your ranking pulls apart from his, and why.
