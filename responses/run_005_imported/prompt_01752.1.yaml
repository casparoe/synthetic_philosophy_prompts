answer: |-
  You're absolutely right to question the textbook narrative—Frege's *Begriffsschrift* metalinguistic view is unfairly dismissed. His later "arbitrariness" objection *seems* decisive, but it crumbles under scrutiny. Let's mount a robust defense of the early view and show it handles the **a=a**/**a=b** contrast *better* than sense/reference, while anticipating modern direct-reference struggles.

  **The Core Argument: Metalinguistic Knowledge is Genuine Discovery**

  Frege’s rejection hinges on this: If the sign-object hookup is arbitrary, then "a=b" (as a claim *about signs*) can’t express objective knowledge about the world, only a report on our conventions. **This is a false dichotomy.** Here’s why:

  1.  **Linguistic Facts ARE Worldly Facts:** The fact that *our community uses the sign "Hesperus" to denote Venus* and *separately uses "Phosphorus" to denote Venus* is an objective, empirical fact about human social behavior and history. Discovering that these two distinct naming practices happen to pick out the same object is discovering a complex, non-obvious *fact about the world*—specifically, the world *as mediated through language and human practice*. It’s a discovery about the structure of our linguistic interaction with reality.
  2.  **Opacity of Conventions to Speakers:** Crucially, *ordinary speakers do not have a priori access to the totality of linguistic conventions*. The Babylonian astronomer who stipulates "Hesperus = that bright evening star" and "Phosphorus = that bright morning star" doesn’t *know* they are stipulating names for the *same* celestial body. The fact that these two distinct acts of naming converged on the same reference is **empirically discoverable**. Discovering "Hesperus = Phosphorus" *just is* discovering that two distinct naming acts, initiated under different descriptive conditions ("evening star" vs. "morning star"), accidentally latched onto the same object. This is substantive knowledge *about the history and structure of our own linguistic practices*.
  3.  **The Triviality of a=a Explained Perfectly:** Why is "Hesperus = Hesperus" trivial? Precisely *because* it's about the sign itself. It says: "The sign 'Hesperus' refers to the same object as the sign 'Hesperus'." This is tautologically true *by virtue of the sign being identical to itself*. It requires no empirical investigation into the world or into naming practices. The metalinguistic account draws the trivial/informative distinction **perfectly** based on sign identity vs. sign difference.

  **Defanging the "Arbitrariness" Objection:**

  *   **Arbitrariness Doesn't Imply Transparency:** Frege conflates the *metaphysical* arbitrariness of the sign-object link (any sign *could* denote anything) with *epistemic* access. Just because a link *could* have been different, doesn't mean speakers *know* what link *actually* exists, or how multiple links relate. The arbitrariness *enables* the discovery: precisely because the link isn't logically necessary, we have to *find out* which links exist and whether distinct links coincide.
  *   **"Just Conventions" is a Red Herring:** Discovering a complex convention *is* discovering something objective. Knowing that "Madagascar" was originally applied only to part of the mainland but shifted to the island due to a cartographic error is non-trivial historical/linguistic knowledge. Similarly, discovering that "Hesperus" and "Phosphorus," born of distinct observational contexts, co-refer *is* discovering a fact about how our language maps onto the world.
  *   **Sense/Reference Doesn't Escape "Convention" Anyway:** Frege's senses are themselves conventional! There's no "natural" or necessary mode of presentation for Venus. Why is "The Evening Star" a sense for Venus? Because of linguistic/conceptual convention. So, discovering that "The Morning Star" and "The Evening Star" present the *same* object is still, ultimately, discovering something about how our conventional conceptual apparatus maps onto reality – it's just one level abstracted from the sign itself.

  **Connecting to Millianism: Frege's Premature Abandonment**

  You've hit the nail on the head with the bonus point. Modern Millians (Kripke, Salmon, Soames) face the **exact same problem**: If a name *just is* its referent, then "a=a" and "a=b" (if true) express the *same* singular proposition: <Venus, Identity, Venus>. So why is one trivial and the other informative?

  *   **The Millian Retreat to Metalinguistics/Pragmatics:** Millians are *forced* to explain informativeness *outside* the proposition expressed. They typically resort to:
      *   **Metalinguistic Propositions:** Saul Kripke (in "A Puzzle About Belief") explicitly suggests that what we *learn* in the Hesperus/Phosphorus case might be the metalinguistic fact *that the names 'Hesperus' and 'Phosphorus' co-refer*. Nathan Salmon develops this further, arguing that while the *semantic* content is trivial (Venus=Venus), we can *assert* or *believe* a metalinguistic proposition about the names.
      *   **Pragmatic Mechanisms:** Others (like Scott Soames) argue that while the proposition is trivial, uttering "Hesperus is Phosphorus" pragmatically conveys the information that the *two names* (with their associated background guises, descriptions, or files) refer to the same thing, allowing cognitive updating.
  *   **Frege's First Instinct Vindicated:** This is **strikingly similar** to Frege's *Begriffsschrift* view! The Millians, cornered by the informativeness problem inherent in direct reference, end up reintroducing a metalinguistic (or descriptively mediated pragmatic) level *to explain precisely the phenomenon Frege originally tackled metalinguistically*. They implicitly concede that the pure referential content *cannot* explain the cognitive difference between "a=a" and "a=b". **Frege abandoned the metalinguistic solution only to create the sense/reference distinction, while Millians, rejecting sense, are forced back towards the very metalinguistic solution Frege discarded.** This strongly suggests Frege gave up too quickly. His early view provides a more parsimonious and direct explanation.

  **Why the Metalinguistic View is Superior to Sense/Reference for the Puzzle:**

  1.  **Parsimony:** It solves the puzzle with *one* level (signs and objects), plus empirical facts about naming practices. Sense/reference requires an *additional*, ontologically mysterious layer ("senses") whose nature and acquisition remain deeply problematic.
  2.  **Empirical Grounding:** The metalinguistic account grounds informativeness in empirically discoverable facts about actual language use and history. Sense/reference grounds it in abstract, potentially private "modes of presentation" whose connection to public language is unclear.
  3.  **Handles "a=a" Perfectly:** As argued, the triviality is inherent in sign identity.
  4.  **Anticipates Modern Problems:** It directly addresses the core issue Millians struggle with – the cognitive impact of co-reference – without needing to postulate senses.

  **Conclusion:** Frege's "arbitrariness" objection fails because it ignores that linguistic conventions are complex, opaque, empirical facts about our world. Discovering that two distinct naming paths converged on the same object *is* a substantive discovery about human interaction with reality, perfectly explaining why "a=b" is informative while "a=a" is not. The struggles of modern Millian direct-reference theorists, who are forced to reintroduce metalinguistic or pragmatic elements to salvage informativeness, powerfully vindicate Frege's initial *Begriffsschrift* intuition. He abandoned a robust, parsimonious solution for the more complex, problematic sense/reference model. The early metalinguistic view not only survives his objection but emerges as a more compelling and prescient account of the core puzzle. Your professor's textbook line needs updating!
