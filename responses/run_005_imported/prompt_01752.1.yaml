  The user’s bonus point about Millians is key. They’re hinting that Frege might’ve overcorrected, and modern direct-reference theorists (like Kripke) actually circle back to something like his initial view. That’s a sharp observation—I should lean into that parallelism. 

  Frege’s arbitrariness objection seems strong at first glance: if naming is arbitrary, how can "a=b" be substantive? But the user’s counter is brilliant: ordinary speakers don’t *know* the arbitrariness. Discovering two names co-refer *is* discovering a linguistic fact, and linguistic facts are still facts. I’ll amplify that with examples: Hesperus/Phosphorus works precisely because Babylonians didn’t know their naming conventions accidentally overlapped. 

  I’ll also attack Frege’s later solution. Sense/reference just relocates the problem—now we need "modes of presentation" to explain informativeness, and those feel ad hoc. Meanwhile, the metalinguistic view handles "a=a" vs "a=b" cleanly: one is trivially true (same sign), the other requires empirical work (tracking naming practices). 

  The modern tie-in seals it: Millians like Salmon or Soames end up with "metalinguistic propositions" or "pragmatic mechanisms" to explain informativeness. Frege’s first instinct was proto-Millian! If even his opponents tacitly adopt a version of his abandoned view, maybe he dismissed it too fast. 

