answer: |-
  Your approach is brilliant—treating philosophical theories as testable hypotheses demands precisely the kind of discriminating case you seek. After analyzing the core commitments of both theories, I propose the following scenario, designed to force a split verdict:

  ### The Discriminating Case: The Unspoken Pact  
  **Scenario:** Two strangers, A and B, are sitting on a park bench. A third person, C, approaches aggressively, clearly intent on confronting A. Without exchanging a word or even a glance:  
  - A subtly shifts position, blocking C’s direct path to B.  
  - B simultaneously stands and steps sideways, positioning themselves to obstruct C’s flank.  
  Their movements are seamlessly coordinated, creating a physical barrier that halts C. Both act *because* they recognize the other’s complementary actions, but they never acknowledge each other or form an explicit agreement. After C leaves, they return to their seats without comment.  

  ---

  ### Bratman’s Verdict: **This IS Shared Intention**  
  Bratman’s conditions (*Shared Agency*, 2014) are satisfied:  
  1. **Individual Intentions with Mutual Reference**:  
     - A intends *that we block C’s approach* (content includes "we").  
     - B identically intends *that we block C’s approach*.  
  2. **Interdependence**:  
     - A’s intention depends on B’s intention (A wouldn’t act alone).  
     - B’s intention similarly depends on A’s.  
  3. **Meshing Subplans**:  
     - A’s subplan: *position body to block center*.  
     - B’s subplan: *stand to block flank*.  
     - These subplans interlock without conflict.  
  4. **Mutual Responsiveness**:  
     - A adjusts positioning *in response to* B’s movement.  
     - B steps sideways *because* A shifted.  
     - Both track the other’s actions in real time.  

  **Conclusion:** For Bratman, this is a "modest sociality" case. Coordination arises from interlocking individual intentions—no agreement or obligations needed.  

  ---

  ### Gilbert’s Verdict: **This is NOT Joint Action**  
  Gilbert’s conditions (*Joint Commitment*, 2014) are **NOT** met:  
  1. **No Joint Commitment**:  
     - Joint commitment requires *mutual recognition* of a commitment to act "as a body." Here, A and B never signal acknowledgment (verbally or nonverbally). Their acts are parallel, not mutually constitutive.  
  2. **No Obligations/Standing to Rebuke**:  
     - If B suddenly walked away, A could not legitimately rebuke B for "defaulting." They owe each other nothing.  
  3. **No Plural Subject**:  
     - The goal ("block C") is not constituted by a "pool of wills" (Gilbert 1989). Each acts on personal judgment, not a collective "we."  
  4. **Rescindability Test**:  
     - A can unilaterally abandon the activity without B’s agreement—violating Gilbert’s requirement that commitments bind parties jointly.  

  **Conclusion:** This is mere *parallel individual action*, not joint action. Coordination without commitment is coincidental, not normative.  

  ---

  ### Why This Case Forces the Split  
  | Condition               | Bratman’s View                      | Gilbert’s View                     |  
  |-------------------------|-------------------------------------|------------------------------------|  
  | **Core Mechanism**      | Interlocking individual intentions  | Joint commitment as plural subject |  
  | **Obligations**         | Unnecessary                         | Essential                           |  
  | **Mutual Recognition**  | Implicit in responsiveness          | Must be overt                       |  
  | **Unilateral Rescission** | Permitted (no obligations)         | Impossible (commitments bind)      |  

  - **Bratman’s "Win"**: The case showcases exactly the kind of intention-driven, obligation-free coordination his theory describes.  
  - **Gilbert’s "Loss"**: The absence of mutual commitment—and thus normative glue—renders it a non-joint act.  

  ---

  ### Reverse Case: Gilbert "Yes," Bratman "No"  
  For completeness, a **reverse discriminator**: *Two people coerced into a joint project by a third party, with enforced plans but no personal investment*.  
  - **Scenario**: A dictator orders P and Q to co-author a report, dictating their subplans (P writes Part 1, Q Part 2), and punishes dissent. P and Q coordinate perfectly under threat but despise the project.  
  - **Gilbert**: **Joint action EXISTS**. They formed a joint commitment (under duress) to "act as a body," creating obligations (Q can rebuke P for late work).  
  - **Bratman**: **NOT shared intention**. P and Q lack *intentions that we J*; they act on personal intentions (*avoid punishment*). Subplans are imposed, not meshed by mutual responsiveness.  

  This highlights Gilbert’s tolerance for coercive origins vs. Bratman’s demand for genuine cooperative intentions.  

  Both cases exploit Bratman’s focus on *intentional structure* versus Gilbert’s emphasis on *normative structure*. The Unspoken Pact cleanly isolates the disagreement—**your crucial experiment is designed**. I hope this dissection clarifies the "bookkeeping"! Would you like to test modifications to the scenario?
