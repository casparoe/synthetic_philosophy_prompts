  Also, the user might appreciate knowing that this debate isn't settled—other schools like Buddhists disagreed. But Nyāya insists on a separate pramāṇa because their system requires distinct cognitive processes. Highlighting the philosophical stakes could help: Nyāya’s commitment to a comprehensive epistemology covering all knowledge types. 

