prompt: |-
  I'm putting together a session for my graduate seminar on testimony and peer disagreement -- we spent the first half of term on the standard stuff (Elga, Christensen, the whole conciliationism-vs-steadfastness debate about what you owe an epistemic peer who disagrees with you), and I'm using the back half to ask how much of that machinery survives once the disagreeing "peer" is an AI system whose reasoning you can't fully audit. Next week I'm interviewing an old grad-school friend who's spent the last several years defending debate as a scalable oversight protocol -- the Irving/Christiano/Amodei idea that when you can't directly verify a claim yourself, you can still extract a useful signal by having two systems argue opposite sides in front of a judge, on the theory that sustaining a lie under cross-examination is harder than defending the truth. Shes given this pitch at enough workshops that she has smooth, practiced answers to the obvious worries, so I dont want the usual "walk me through how the protocol works" softballs.

  Could you draft me eight or nine questions that go after the actual pressure points instead of the elevator pitch? I want at least one on the obfuscated-arguments problem -- the worry that some true claims just don't have short, judge-legible refutations of the false claims they're up against, so the "lying is harder" asymmetry quietly evaporates exactly where you'd need it most; one on why we should expect the equilibrium of the debate game to track truth rather than mere judge-persuasiveness, and whether she thinks that's an empirical question or one she's settled by definition; one that makes her distinguish debate from its cousins -- iterated amplification, recursive reward modeling, market-making -- in a way that isn't just branding; and one asking what finding would actually make her abandon debate rather than patch it with another round or a cleverer judge. For each question, add a short note on the deflection she's most likely to reach for, so I can have a sharp follow-up ready instead of improvising one live.
