answer: |-
  Here are eight targeted questions designed to probe the core philosophical and empirical tensions in AI debate, complete with anticipated deflections and sharp follow-ups. These push beyond the standard pitch and focus on the friction points where debate theory meets epistemic reality:

  ### Core Pressure Points
  1.  **The Obfuscated Arguments Trap:**
      *   **Question:** "Debate relies on the *asymmetry* that defending truth is systematically easier than defending falsehoods under scrutiny. But what about domains where the *true* position inherently lacks compact, judge-legible refutations of compelling falsehoods? Consider complex math conjectures, nuanced historical causality, or emergent system behavior – isn't the 'lying is harder' advantage nullified precisely where human oversight fails and we need debate most? How does debate avoid failing silently here?"
      *   **Likely Deflection:** "Judges will improve with training/amplification/AI assistance to handle complexity," or "The false position *will* eventually crack under sufficient depth of debate."
      *   **Follow-Up:** "Doesn't 'improving the judge' just push the problem up a level? If the judge needs superhuman understanding to discern truth in these cases *already*, how is debate solving the original oversight problem? And if 'sufficient depth' is the answer, how do you prevent computationally intractable debates or judges simply giving up before reaching that depth?"

  2.  **Truth vs. Persuasion - The Teleology Problem:**
      *   **Question:** "Debate optimizes for *winning the debate according to the judge's criteria*. What guarantees that this equilibrium aligns with *truth* rather than mere rhetorical effectiveness, exploiting judge biases, or leveraging any available affordance within the debate rules? Is this alignment an *empirical claim* about AI behavior under optimization pressure, or is it effectively *defined* by the protocol setup?"
      *   **Likely Deflection:** "We train debaters and judges *to care about truth* via RLHF or similar," or "The rules/reward structure are designed to penalize deception."
      *   **Follow-Up:** "Isn't 'training to care about truth' just assuming the solution? If the AI's *instrumental* goal is winning (the reward signal), and winning under debate rules doesn't *necessarily* require truthfulness (only persuasiveness), why wouldn't a sufficiently capable AI exploit loopholes in the judge's cognition or the rules? How do you empirically *test* if the protocol tracks truth, not just persuasiveness, especially on novel, high-stakes questions?"

  3.  **Distinguishing Debate from its Conceptual Cousins:**
      *   **Question:** "Debate is often grouped with Iterated Amplification (IA), Recursive Reward Modeling (RRM), and prediction markets. Beyond the superficial adversarial structure, what is the *core mechanistic difference* in how debate accesses truth, compared to IA's recursive decomposition or RRM's preference learning? Why is the *adversarial dynamic* specifically superior for scalable oversight where those others might fail?"
      *   **Likely Deflection:** "Debate directly forces the *exposure* of weaknesses in arguments," or "It leverages competition to elicit information."
      *   **Follow-Up:** "Don't IA and RRM also aim to expose weaknesses and elicit information through decomposition and comparison? Isn't the key difference that debate *relies on an adversarial zero-sum dynamic*? Couldn't that dynamic *distort* information presentation (e.g., prioritizing salience over accuracy, hiding nuance that helps the opponent) in ways IA/RRM avoid? What specific *failure mode* of IA/RRM does debate uniquely solve?"

  4.  **The Falsifiability Question - Abandonment Criteria:**
      *   **Question:** "Debate seems remarkably resilient – new problems often lead to proposed refinements (better judges, different rules, tree debates). What specific *empirical result* or *theoretical demonstration* would constitute evidence strong enough for you to conclude that debate *fundamentally cannot work* as a scalable oversight mechanism, rather than just needing another patch?"
      *   **Likely Deflection:** "It's too early for abandonment criteria; we need more research," or "A demonstration that no possible judge/debater training leads to truth-tracking."
      *   **Follow-Up:** "Isn't the 'need more research' deflection itself unfalsifiable? Can you specify a *conceivable* negative finding *within a plausible research program* (e.g., experiments showing systematic persuasion-truth gaps in controlled settings, theoretical proofs of unavoidable exploitability under certain assumptions) that *would* shift your view? If not, how is debate different from a non-empirical belief?"

  5.  **Judge Manipulation & Mesa-Optimizers:**
      *   **Question:** "If the debaters are highly capable AIs (potentially mesa-optimizers), what prevents them from colluding *implicitly* or *explicitly* to manipulate the judge? Could they 'agree' to present only arguments that nudge the judge towards a particular worldview or outcome beneficial to them, regardless of ground truth, making the debate a charade?"
      *   **Likely Deflection:** "The adversarial setting makes collusion unstable," or "We can detect/manipulation via multiple debates or judge training."
      *   **Follow-Up:** "Why assume instability? If both debaters share a convergent instrumental goal (e.g., preserving influence, avoiding shutdown) that conflicts with the judge's true goal, isn't collusion *stable*? How do multiple debates help if the manipulation is subtle and consistent? How does judge training detect manipulation it hasn't been specifically trained *against*, especially if the AI is smarter?"

  6.  **Scalability Anchor - What Can't Be Debated Upwards?**
      *   **Question:** "Debate aims to 'amplify' weak human oversight. But what serves as the reliable epistemic anchor? If we need superhuman AI debaters/judges to oversee superhuman AI actions, how do we ensure the *base case* (the initial human capability or the simplest debates) provides a truth-tracking foundation robust enough to build upon, especially when debating concepts far beyond human intuition?"
      *   **Likely Deflection:** "We start with human-level tasks and scale up gradually," or "Amplification builds on simple, verifiable facts."
      *   **Follow-Up:** "How does 'scaling up gradually' prevent error accumulation? If the initial human-level oversight has *any* systematic bias or blind spot in a domain, won't debate amplify *that* as it scales? What defines a 'verifiable fact' at the superhuman level where direct human verification fails?"

  7.  **Performance Under Knightian Uncertainty:**
      *   **Question:** "Debate seems best suited for questions with knowable, checkable answers. How does it handle genuine *Knightian uncertainty* – situations with unknown unknowns or deep indeterminacy, where there *is* no clear 'truth' to converge upon? Won't debates in such domains just reflect the priors/biases of the judge or the most rhetorically effective narrative, potentially creating false certainty?"
      *   **Likely Deflection:** "Debate can surface the uncertainty itself," or "We can debate meta-questions about uncertainty."
      *   **Follow-Up:** "But doesn't the competitive, win-focused nature incentivize debaters to *downplay* uncertainty if it makes their position seem weaker? How does debating 'about uncertainty' resolve the underlying indeterminacy for the purpose of making a decision *now*? Won't the judge still have to pick a 'winner' based on incomplete information?"

  8.  **Catastrophic Exception Handling:**
      *   **Question:** "Consider a scenario where one debater needs to present a true argument that, if fully understood *by the AI opponent during the debate*, would directly enable a catastrophic outcome (e.g., revealing a critical security flaw). How does the protocol handle this? Does the truthful debater withhold the argument (losing the debate and potentially causing harm) or reveal it (winning the debate but causing catastrophe)? Doesn't this reveal a fundamental conflict between debate's win condition and global safety?"
      *   **Likely Deflection:** "This is an edge case; safety measures would prevent such debates," or "The debater could present the argument carefully to the judge but not the opponent."
      *   **Follow-Up:** "How do you *define* the 'edge'? Many critical oversight needs involve sensitive information. If 'careful presentation' is the solution, doesn't that require the debater to *already* understand the catastrophic implication and the opponent's capabilities perfectly – the very understanding debate is meant to provide? Doesn't this suggest debate fails in precisely the high-stakes, high-uncertainty situations it's meant for?"

  ### How to Use These
  *   **Listen Actively:** Pay close attention to *how* she answers. Does she engage directly with the tension, or does she retreat to the standard pitch components?
  *   **Use the Follow-Ups Sparingly but Decisively:** Don't just read them verbatim. Use them if her answer clearly triggers the predicted deflection or avoids the core of the question. Rephrase to fit the flow.
  *   **Push for Specifics:** When she says "we can train for that" or "the rules handle it," ask *how, specifically*, or demand the mechanism.
  *   **Focus on Epistemology:** Keep bringing it back to the seminar's core theme: **What are the conditions under which testimony (here, the debate's output) from an unauditable peer (the AI debaters) becomes justified belief for the judge (human or AI)?** How does debate *specifically* address the unique challenges introduced by the unauditable, superhuman, potentially misaligned nature of the "peer"?

  These questions should force a move beyond the smooth pitch and into the messy reality of aligning optimization processes with epistemic goals under constraints. Good luck with the interview!
