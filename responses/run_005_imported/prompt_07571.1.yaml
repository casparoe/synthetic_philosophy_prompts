  Hmm... the social choice angle is tricky. Arrow's theorem says no ranked system can satisfy all fairness criteria simultaneously, but that doesn't make all systems equal - some violate fewer desirable properties than others. Approval voting isn't subject to Arrow because it doesn't use rankings, but that doesn't automatically make it superior. I should clarify this without jargon, maybe comparing it to "no car is perfect, but some still get you to work better than others."

  For the recommendation... approval voting stands out for practical reasons. It solves their immediate problem (electing broadly acceptable candidates), handles multiple candidates well, and is simpler to implement than IRV or Borda. The timeline seems manageable: bylaws amendment in 2 months, voter education before nominations open. 

  But I must address the main objection - that approval might elect "bland" candidates. This is valid, but preferable to divisive winners in their context. The response could emphasize that members can still bullet-vote if they strongly prefer one candidate, maintaining some expressive power.

  The memo structure should flow naturally: problem summary, Arrow's theorem in plain language, system comparison focused on their needs, concrete recommendation with timeline, and candid downside disclosure. Tone must stay professional but accessible - no academic jargon, just clear reasoning grounded in their real-world constraints.
answer: |-
  ## MEMORANDUM

  **To:** Bylaws & Elections Committee  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Presidential Election Reform  

  **I. The Problem & Urgency**  
  Last spring’s election revealed a critical flaw in our current plurality system: a candidate won with only 29% support, and evidence suggests a majority preferred other candidates head-to-head. This undermines confidence in our leadership selection. We must adopt a system ensuring the winner has broader support before nominations open for the next cycle.  

  **II. Arrow’s Theorem: What It Means (and Doesn’t Mean)**  
  Arrow’s Impossibility Theorem is often misunderstood. It states that *no ranked-choice voting system* (where voters submit a full order of preferences) can simultaneously satisfy all five "fairness" criteria in every possible election. **This does NOT mean:**  
  1. **All systems are equally arbitrary.** Systems fail *different* criteria. Plurality fails badly at reflecting majority preferences in multi-candidate races. Others perform better on key measures like Condorcet efficiency (electing candidates who beat all others head-to-head).  
  2. **Approval voting "wins" by escaping Arrow.** Approval voting avoids Arrow’s theorem because voters don’t rank candidates—they simply approve/disapprove each one. While true, this doesn’t automatically make Approval "fairer." It simply means Arrow’s specific ranked-choice criteria don’t apply. Approval has its own trade-offs (discussed below).  

  **III. Evaluating the Options**  
  *   **Status Quo (Plurality):** Proven inadequate. Fails to ensure majority support, encourages strategic nomination splitting, and amplifies the "spoiler effect."  
  *   **Instant-Runoff Voting (IRV):** Eliminates "spoilers" by simulating runoff elections. Ensures the winner has majority support *among voters who ranked the finalists*. However, it’s complex to explain/count, and doesn’t guarantee a Condorcet winner.  
  *   **Borda Count:** Awards points based on rank position. Better at reflecting overall preferences than plurality. However, it’s highly vulnerable to strategic ranking (e.g., burying strong opponents) and can produce non-intuitive results.  
  *   **Approval Voting:** Voters approve *any* number of candidates. The candidate with the most approvals wins. Simple, robust, encourages broad acceptability, and eliminates vote-splitting. Best reflects which candidate is *acceptable* to the most voters.  

  **IV. Recommendation: Approval Voting**  
  I recommend adopting **Approval Voting** for Executive Council and Presidential elections.  

  *   **Why Approval?**  
      *   **Solves Our Immediate Problem:** Directly addresses the issue of winners lacking broad support. The winner will be the candidate acceptable to the largest number of voters.  
      *   **Simplicity & Transparency:** Easy for voters (vote like you do now, but for multiple candidates). Easy and fast to count (just tally approvals). Results are instantly understandable.  
      *   **Reduces Strategic Voting:** Voters can sincerely support all candidates they like without fear of "wasting" their vote or helping a lesser evil beat their favorite.  
      *   **Encourages Positive Campaigns:** Candidates benefit by appealing to broader constituencies, not just narrow bases.  
      *   **Handles Multiple Candidates Well:** Avoids the vote-splitting inherent in plurality that led to our 29% winner.  
      *   **Practical Implementation:** Requires minimal changes to ballots and voting systems.  

  *   **Timeline:**  
      *   **Nov Meeting:** Committee vote on recommendation.  
      *   **Dec:** Draft bylaws amendment (simple language change defining the voting method).  
      *   **Jan:** Circulate amendment to full membership for comment (30 days).  
      *   **Feb:** Committee reviews feedback, finalizes amendment.  
      *   **Mar:** Present amendment to the Executive Council for approval.  
      *   **Apr:** If approved, implement voter education campaign.  
      *   **May/Jun:** Nominations open under new system. *This timeline is achievable before the next election cycle.*

  *   **Strongest Objection & Response:**  
      **Objection:** "Approval Voting doesn't let voters express *intensity* of preference. It might elect a 'least objectionable' bland candidate over a more passionately supported one."  
      **Response:** This is a valid theoretical concern. However, in practice for leadership elections, ensuring the winner has *broad acceptability* is paramount. Members retain full power: they can choose to approve *only* their passionate favorite ("bullet voting") if they wish. Approval maximizes the chance the winner is broadly acceptable, which is critical for association cohesion. While it doesn't capture nuanced rankings, its simplicity, resistance to strategy, and effectiveness in achieving broad support outweigh this limitation, especially compared to the flaws of plurality and the complexities/strategic vulnerabilities of IRV and Borda.  

  **V. Conclusion**  
  Arrow’s Theorem reminds us that no perfect voting system exists, but it doesn’t mean we should tolerate a system known to produce winners opposed by the majority. Approval Voting offers a significant, practical improvement: it is simple, robust, strategically resilient, and ensures our leaders have demonstrable broad support from the membership. It directly addresses the failure mode witnessed last spring. I urge the committee to recommend Approval Voting for adoption.  

  **Attached:** Draft Bylaws Amendment Language & Sample Ballot.
