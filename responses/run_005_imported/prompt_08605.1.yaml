  Two of my closest friends ended up having emergencies at almost the exact same time last month - one texted me mid panic attack needing someone there right away, and completely separately, the other called me from urgent care after a bike accident with no other ride home. They live on opposite ends of town so there was no way to get to both quickly. I went to the panic attack first since it felt more urgent in the moment, and by the time I got to my other friend at urgent care hours later shes already gotten a coworker to drive her home and was pretty hurt I hadn't shown up sooner. Got into a whole argument about this with a friend last night - he says since I literally couldn't be in two places at once, I did nothing wrong and theres zero reason to feel guilty toward the other friend, it was just bad luck. But something in me still feels like I owed her too and that I did fail her a bit, even though I genuinely don't see what else I could've done differently. Is my friend right that the guilt doesn't make sense, or is he missing something?
