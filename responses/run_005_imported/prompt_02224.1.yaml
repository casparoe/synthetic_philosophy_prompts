prompt: |-
  I'm at work on a historical novel set among the mathematicians and philosophes of pre-Revolutionary Paris, and Condorcet appears as a supporting character. I want to write a scene in which he explains, in his own confident register, the reasoning behind his 1785 "Essai sur l'application de l'analyse à la probabilité des décisions rendues à la pluralité des voix." Below is the relevant stretch of the "Discours préliminaire" (spelling lightly modernised from the original). My French is solid enough to follow the individual sentences, but I'm struggling to reconstruct the argument as a whole, and I don't want to put sloppy reasoning into a mathematician's mouth.

  "On trouve de plus, que si la probabilité de la voix de chaque Votant est plus grande que 1/2, c'est-à-dire, s'il est plus probable qu'il jugera conformément à la vérité, plus le nombre des Votants augmentera, plus la probabilité de la vérité de la décision sera grande: la limite de cette probabilité sera la certitude; en sorte qu'en multipliant le nombre des Votants, on aura une probabilité aussi grande qu'on voudra d'avoir une décision vraie; et c'est là ce que nous entendrons toutes les fois que nous dirons que la limite de la probabilité est 1, ou la certitude. Si au contraire la probabilité du jugement de chaque Votant est au-dessous de 1/2, c'est-à-dire, s'il est plus probable qu'il se trompera, alors plus le nombre des Votants augmentera, plus la probabilité de la vérité de la décision diminuera; la limite de cette probabilité sera zéro, c'est-à-dire, qu'on pourra, en multipliant le nombre des Votants, avoir une probabilité aussi petite qu'on voudra de la vérité de la décision, ou une probabilité aussi grande qu'on voudra que cette décision sera erronée. Si la probabilité de la vérité de chaque voix est 1/2, alors, quel que soit le nombre des Votants, celle de la vérité de la décision sera aussi 1/2. Cette conclusion conduit d'abord à une remarque assez importante. Une assemblée très nombreuse ne peut pas être composée d'hommes très éclairés; il est même vraisemblable que ceux qui la forment joindront sur bien des objets beaucoup d'ignorance à beaucoup de préjugés. Il y aura donc un grand nombre de questions sur lesquelles la probabilité de la vérité de la voix de chaque Votant sera au-dessous de 1/2; alors plus l'assemblée sera nombreuse, plus elle sera exposée à rendre des décisions fausses. Or, comme ces préjugés, cette ignorance, peuvent exister sur des objets très importants, on voit qu'il peut être dangereux de donner une constitution démocratique à un peuple sans lumières: une démocratie pure ne pourrait même convenir qu'à un peuple beaucoup plus éclairé, beaucoup plus exempt de préjugés qu'aucun de ceux que nous connaissons par l'Histoire."

  Could you first restate, in plain terms, exactly what is being claimed about the relationship between the number of Votants, the reliability of each individual vote, and the reliability of the collective decision? Then help me see precisely how Condorcet gets from that mathematical claim to the political conclusion about "un peuple sans lumières" — is that inference actually licensed by what's stated here, or is he quietly relying on some further premise about assemblies, education, or human nature that isn't spelled out in this passage? I'd like my character to sound rigorous rather than merely rhetorical, so I need to know where the real logical joints are.
