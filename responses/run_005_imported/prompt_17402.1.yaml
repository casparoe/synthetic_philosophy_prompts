prompt: |-
  I'm one of four students on the rules committee for my school's Computer Science Society, and after our fall tournament we're stuck on a dispute none of us feels equipped to settle. For the past two years the tournament has just been a standard iterated Prisoner's Dilemma bot-off, but this year, after a couple of us read about a corner of game theory sometimes called 'program equilibrium' or 'open-source game theory' — the idea that letting two players inspect each other's source code before acting can support cooperation that classical game theory says is irrational — we redesigned it as a single-shot format in which each bot's complete source is shown to its opponent before either one has to output Cooperate or Defect.

  Here is the complication. Two of our strongest competitors, who are close friends and wrote their entries together, each submitted a bot that cooperates if and only if the opponent's source code is identical to its own once comments and whitespace are stripped out, and defects otherwise. Because their two files matched, the bots cooperated with each other every time and defected against the rest of the field, which was enough to lock up first and second place overall. A third competitor has filed a complaint arguing that this is collusion dressed up as strategy — no different from two players signaling under the table — since the 'cooperation' tracks friendship rather than any reasoning about the opponent. The two accused students respond that they broke no written rule, exchanged no information once the round started, and simply used the format's own mechanic, mutual code visibility, exactly as it was meant to be used. They also point to a fourth competitor, a stranger to both of them, whose bot instead cooperates only when it can verify from the opponent's code — using a small proof search one of them says was inspired by something called Löb's theorem, from a paper on 'robust cooperation' — that the opponent would cooperate with it specifically; that bot ended up cooperating with several strangers over the course of the tournament, and nobody has objected to it.

  Our advisor wants the committee's ruling in writing before Friday's awards ceremony, since a small prize fund rides on the final standings. Could you draft that memo for me? It should actually rule on the complaint — uphold it, dismiss it, or land somewhere in between, including any effect on the standings — and it should propose a workable rule for next year's format that draws a principled line between legitimate uses of code transparency and collusion. Please take the accused students' defense seriously rather than simply assuming that two friends cooperating must be cheating; if there is a genuine difference between what they did and what the fourth bot did, I'd like the memo to say plainly what it is and why it should matter for the ruling.
reasoning: |-
  We are faced with a complaint that two students submitted bots that cooperate only when the opponent's code is identical (after stripping comments and whitespace) and defect otherwise. They are friends and wrote the bots together, and their bots cooperated with each other and defected against others, securing them the top two positions.

  The complaint argues that this is collusion because the cooperation is based on friendship and not on any reasoning about the opponent's behavior. The accused students defend themselves by stating that they did not break any written rule, did not exchange information during the round, and simply used the mutual code visibility as intended. They also point to a fourth competitor whose bot uses a proof search (inspired by Löb's theorem) to verify that the opponent would cooperate with it, and that bot cooperated with several strangers without objection.

  Our task is to:
  1. Rule on the complaint (uphold, dismiss, or a compromise) and decide if the standings should be adjusted.
  2. Propose a rule for next year that distinguishes between legitimate use of code transparency and collusion.

  Key considerations:

  a) **The format's design**: The tournament was redesigned to allow mutual code visibility to enable program equilibrium. The idea is that by seeing each other's code, bots can condition their behavior on the opponent's code to achieve cooperation that wouldn't be possible otherwise.

  b) **The accused bots' strategy**: Their cooperation condition is based on exact code matching (after removing comments and whitespace). This condition is deterministic and based solely on the source code. They did not communicate during the round; the condition was pre-programmed.

  c) **Collusion vs. strategy**: The complaint argues that the condition (code matching) is a proxy for friendship because they wrote the same code. However, the condition is objective and based on the code. The fourth competitor's bot uses a more sophisticated condition (proof of mutual cooperation) and cooperated with strangers. The difference is that the proof-based bot is trying to achieve mutual cooperation with any bot that is similarly designed (i.e., one that can prove things about mutual behavior), while the accused bots only cooperate with themselves.

  d) **Fairness and intent**: The tournament rules did not explicitly forbid this. The accused students used the provided mechanism (code visibility) to condition their behavior. However, the spirit of the tournament might be to encourage cooperation based on the opponent's behavior as deduced from the code, not merely on a trivial condition that only they can satisfy.

  e) **The fourth bot**: This bot uses a proof search to verify that the opponent will cooperate with it. This is a well-known technique in program equilibrium (e.g., based on Löb's theorem as in the "robust cooperation" paper). This bot cooperates with any bot that can pass the proof, which could be designed by anyone. This is more aligned with the idea of open-source game theory because it doesn't require the opponent to be identical but to have a compatible reasoning.

  Ruling:

  1. **On the complaint**: We must decide if the accused bots' strategy is a legitimate use of the format or collusion.

     - **Legitimate strategy argument**: The bots are autonomous and their behavior is entirely determined by the code and the opponent's code. The condition (code identity) is objective and uses the provided mechanism. There was no communication during the round. The rules did not prohibit this.

     - **Collusion argument**: The condition is so specific that it effectively only allows cooperation between the two bots written by the friends. This is functionally equivalent to pre-arranged collusion because no other bot can meet the condition. The purpose of the format is to foster cooperation through reasoning about the opponent's code, not through a trivial check that only the two friends can satisfy.

     We note that the fourth bot's strategy is fundamentally different: it uses the opponent's code to reason about what the opponent will do and cooperates if the opponent can be proven to cooperate. This is a general mechanism that can be satisfied by multiple bots (even from strangers) if they are designed appropriately.

     **Decision**: We find that the accused bots' strategy, while technically within the letter of the rules, violates the spirit of the tournament. The tournament was intended to explore program equilibrium, where bots condition their behavior on the opponent's code to achieve mutual cooperation in a way that is open to any participant. The accused bots' strategy does not engage in any meaningful reasoning about the opponent's behavior; it only checks for an exact copy of itself. This is effectively a way to pre-arrange cooperation only with each other, which is collusive in outcome. Therefore, we uphold the complaint in part.

     However, we also note that the rules did not explicitly forbid this. Therefore, we do not disqualify the students but adjust the standings to reflect that their mutual cooperation was not a legitimate outcome of the intended strategic interaction.

     **Standings adjustment**: The matches between the two accused bots should be re-evaluated. Since they cooperated with each other, they received the highest payoff (R, the reward for mutual cooperation) in those matches. We rule that in matches between the two accused bots, the outcome should be changed to mutual defection (payoff P, the punishment for mutual defection) because their cooperation was not achieved through the intended mechanism. This is a penalty for collusion.

     We recalculate the scores accordingly. Note: The accused bots also defected against everyone else, which is acceptable because they were not required to cooperate. We do not change those outcomes.

     After recalculating, the accused bots' scores will drop. We then re-rank the entire field.

  2. **Rule for next year**:

     We propose a rule that distinguishes between legitimate uses and collusion by requiring that the condition for cooperation must be based on the opponent's behavior in the game, not on an arbitrary condition that only a specific bot (or set of bots) can satisfy.

     Specifically, we can state:

     "A bot's decision to cooperate or defect must be based solely on the opponent's source code and must not be designed to cooperate only with a specific, predetermined opponent (or set of opponents) without regard to the opponent's strategy. In particular, the condition for cooperation must be one that could, in principle, be satisfied by any opponent that implements a compatible strategy, even if written by a different author.

     Examples of acceptable conditions:
     - Cooperating if the opponent's code contains a proof that the opponent will cooperate with this bot (as in the fourth competitor's bot).
     - Cooperating if the opponent's code is a known cooperative strategy (like Tit-for-Tat) or uses a similar mechanism.

     Examples of unacceptable conditions:
     - Cooperating only if the opponent's code is identical to the bot's own code (or a specific known code).
     - Cooperating only if the opponent's code contains a specific hard-coded string that is kept secret and only known to a few teams."

     This rule allows the use of code transparency for strategic cooperation while preventing teams from pre-arranging cooperation with specific friends without a general mechanism.

  Draft Memo:

  ---

  **MEMORANDUM**

  **TO**: Computer Science Society Rules Committee, Tournament Advisor  
  **FROM**: Rules Committee (via [Your Name])  
  **DATE**: [Current Date]  
  **SUBJECT**: Ruling on Complaint Regarding Fall Tournament Bots and Proposed Rule Amendment  

  This memo addresses the complaint filed by a competitor against the bots submitted by [Names of the two accused students] (hereafter "Team A") in the single-shot Prisoner's Dilemma tournament. The complaint alleges that Team A's bots engaged in collusion by cooperating exclusively with each other and defecting against all others. We have reviewed the complaint, Team A's defense, and the tournament rules, and we issue the following ruling and proposal for future tournaments.

  ### Ruling on the Complaint

  Team A submitted two bots that cooperate if and only if the opponent's source code, after removing comments and whitespace, is identical to their own. In all other cases, they defect. Because the two bots shared identical logic (after stripping comments and whitespace), they cooperated with each other in every match between them and defected against all other competitors. This resulted in Team A securing first and second place.

  We find that Team A did not violate any explicit rule in the tournament's written rules. The format allowed bots to condition their behavior on the opponent's source code, and Team A's bots did exactly that. There is no evidence of communication during the tournament round, and the behavior was entirely determined by the pre-submitted code.

  However, the complaint raises a valid concern about the spirit of the tournament. The redesign to a single-shot format with mutual code visibility was intended to foster cooperation through program equilibrium — a mechanism by which bots can use the visibility of each other's code to reason about mutual behavior and achieve cooperation that classical game theory deems irrational. Team A's bots do not engage in such reasoning. Instead, they use a trivial condition (source code identity) that is only satisfied by a bot written by the same authors (or an identical copy). This condition is not based on any analysis of the opponent's strategy or behavior. As a result, Team A's bots effectively pre-arranged cooperation only with each other, which is functionally equivalent to collusion.

  In contrast, we note the bot submitted by [Name of the fourth competitor] (hereafter "Bot B"), which cooperates only if it can verify (via a proof search inspired by Löb's theorem) that the opponent will cooperate with it. Bot B cooperated with several bots written by strangers because those bots passed the proof. This is a legitimate use of the format because it conditions cooperation on the opponent's strategy (as deduced from the code) and is open to any bot that can meet the condition.

  Therefore, we uphold the complaint in part. While Team A did not break a written rule, their strategy subverted the intended purpose of the format. To restore competitive fairness, we adjust the outcomes of the matches between Team A's two bots. Originally, these matches resulted in mutual cooperation (payoff R). We change these outcomes to mutual defection (payoff P). We recalculate the total scores for all competitors based on this adjustment and adjust the final standings accordingly. The revised standings will be used for the awards ceremony.

  ### Proposed Rule for Next Year

  To prevent similar issues and clarify the boundary between legitimate strategy and collusion, we propose the following rule for next year's tournament:

  **Rule on Legitimate Use of Code Transparency**:  
  "A bot's decision to cooperate or defect must be based solely on the opponent's source code and must be designed to condition cooperation on the opponent's strategy in a way that is, in principle, open to any opponent. Specifically, the condition for cooperation must not rely on predetermined identities or shared secrets that are not derived from the opponent's strategic behavior. The condition must be one that could be satisfied by an opponent written by any author, provided that opponent implements a compatible strategy.

  Examples of acceptable conditions include, but are not limited to:
  - Conditions that verify the opponent's code implements a specific cooperative strategy (e.g., Tit-for-Tat in an iterated setting, or a proof-based cooperation mechanism).
  - Conditions that search for a proof (within resource bounds) that the opponent will cooperate with this bot.

  Examples of unacceptable conditions include:
  - Conditions that require the opponent's source code to be identical (or nearly identical) to the bot's own code or a specific code known only to a subset of competitors.
  - Conditions that rely on hard-coded secrets (e.g., a specific string) that are not inherent to the opponent's strategy and are not publicly known."

  This rule will ensure that the tournament encourages innovative strategies that use code transparency for genuine program equilibrium while preventing collusion.

  ### Conclusion

  The adjusted standings will be provided to the advisor by [time] on [date]. We thank the competitors for their engagement and hope this ruling and the new rule will enhance future tournaments.

  ---
answer: |-
  **MEMORANDUM**  
  **TO**: Computer Science Society Rules Committee, Tournament Advisor  
  **FROM**: Rules Committee Chair, [Your Name]  
  **DATE**: [Current Date]  
  **SUBJECT**: Ruling on Tournament Complaint and Proposed Rule Amendments  

  ### **I. Ruling on the Complaint**  
  After thorough review, the committee **upholds in part and dismisses in part** the complaint against the two students (hereafter "Team A") whose bots cooperated exclusively with each other. While Team A did not violate explicit rules, their strategy undermines the core purpose of the "open-source" Prisoner's Dilemma format. The standings will be adjusted as follows:  

  1. **Complaint Dismissed (No Disqualification)**:  
     - Team A broke no written rules. Their bots autonomously executed pre-programmed logic (cooperate iff opponent code matches after whitespace/comment removal) without real-time collusion. Mutual code visibility was used as intended.  
     - Comparison to the proof-search bot (hereafter "Bot B") is instructive: Bot B’s cooperation hinges on verifying *strategic behavior* (i.e., "will the opponent cooperate with me?") through algorithmic reasoning. This is a legitimate "program equilibrium" tactic, as it rewards *any* opponent demonstrably committed to mutual cooperation.  

  2. **Complaint Upheld (Standings Adjustment)**:  
     - Team A’s strategy fails the **spirit of the format**. Cooperation was triggered not by analysis of the opponent’s strategy, but by a *trivial, authorship-dependent condition* (code identity). This reduces to de facto collusion:  
       - The condition is satisfiable *only* by Team A’s own bots, making cooperation inaccessible to outsiders.  
       - By contrast, Bot B’s proof-based condition is *stranger-accessible*; it cooperated with multiple unrelated entrants.  
     - **Action**: Matches between Team A’s bots are retroactively scored as **mutual defection**. Their cooperation was non-strategic and exclusionary, violating the tournament’s goal of fostering open-source cooperation. Recalculate all scores accordingly.  

  **Revised Standings**:  
  - Team A’s bots drop in rank due to reduced points from mutual defection.  
  - Bot B retains its position; its strategy is valid.  
  - Awards and prizes will reflect updated rankings.  

  ### **II. Proposed Rule for Future Tournaments**  
  To distinguish legitimate code analysis from collusion, the following rule will be added for 2025:  

  > **Section 3.2: Conditions for Cooperation**  
  > A bot may condition its action on the opponent’s source code, provided:  
  > (a) The condition for cooperation must be based on the opponent’s *strategic behavior* (e.g., "will the opponent cooperate with me?") and not on authorship, code identity, or arbitrary non-strategic markers.  
  > (b) The condition must be *theoretically satisfiable* by any opponent implementing a compatible strategy, regardless of authorship.  
  >   
  > **Permissible Examples**:  
  > - Cooperation if the opponent’s code contains a proof (e.g., via Löb’s theorem) that it cooperates with this bot.  
  > - Cooperation if the opponent implements Tit-for-Tat or another recognizable strategy.  
  >   
  > **Impermissible Examples**:  
  > - Cooperation iff opponent code is identical to the bot’s own code (after normalization).  
  > - Cooperation iff opponent code contains a hardcoded secret only known to specific teams.  

  ### **III. Key Distinctions and Principles**  
  - **Team A vs. Bot B**:  
    - Team A’s bots checked: *"Are you me?"* (collusive—rewards friendship, not strategy).  
    - Bot B checked: *"Will you cooperate with me?"* (legitimate—rewards verifiable intent).  
  - **Why This Matters**:  
    The format aims to incentivize *robust, reproducible cooperation* via code transparency. Team A’s approach created a closed loop, while Bot B’s enabled open collaboration. The new rule prioritizes strategies that could theoretically scale to a multi-player ecosystem.  

  ### **IV. Conclusion**  
  Team A’s standings are adjusted due to non-strategic cooperation. Future rules will explicitly require cooperation conditions to be behavior-based and universally accessible. The committee commends Bot B’s innovative solution and encourages designs that advance open-source game theory’s goals.  

  **Signed**,  
  Rules Committee, Computer Science Society  

  ---  
  **APPENDIX: Rationale Summary**  
  - **Fairness**: Team A’s bots exploited a loophole for exclusive gain.  
  - **Precedent**: Program equilibrium research (e.g., Tennenholtz, LaVictoire) emphasizes *verifiable mutual cooperation*, not code identity.  
  - **Feasibility**: The new rule is enforceable via code review. Conditions like "code identity" or "hardcoded secrets" are trivial to detect.
