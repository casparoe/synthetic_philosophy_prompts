  Also, the user's frustration with the "side door" suggests they expect a metaphysical justification. But Strawson's point is that such justification is unnecessary. The practices stand on their own. The user's background in software engineering might make them look for logical consistency in a system, but Strawson is challenging the system itself. 

  I should explain the two Strawsons: Galen and P.F. The user might not realize they're different people. Clarifying that avoids confusion. Emphasizing the non-metaphysical grounding of reactive attitudes is crucial. The user's deeper need is likely to resolve the cognitive dissonance between the two arguments. Highlighting Strawson's paradigm shift from metaphysics to practice should help. 

