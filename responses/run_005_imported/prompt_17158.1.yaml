  Key considerations: Grice's framework is intuitive and widely used in linguistics, but it has gaps. For instance, scalar implicatures like "some" implying "not all" are handled by the quantity maxim, but relevance theorists argue that's redundant. They say relevance alone triggers the inference. Also, cases of loose talk or hyperbole might be better explained by relevance theory's effort-effect balance.

