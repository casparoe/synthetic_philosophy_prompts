answer: |-
  You've hit upon one of the most fascinating and enduring puzzles in the philosophy of language – and your suspicion about grammatical costumes touches on a key insight, but the distinction runs deeper than a mere quirk. While both conditionals reference the same historical *facts* (Oswald's action and Kennedy's death), they operate in fundamentally different logical and epistemic modes. Philosophers like Ernest Adams, Robert Stalnaker, and David Lewis demonstrated this isn't just an English artifact; it reveals a core feature of how humans reason about possibility and necessity. Here's the breakdown:

  1.  **The Indicative Conditional ("If Oswald did not kill Kennedy, then someone else did"):**
      *   **Mode:** Epistemic (About knowledge/belief revision).
      *   **Truth Conditions:** Evaluated relative to our *current knowledge state*. We *know* Kennedy was killed. Within this context, supposing the antecedent ("Oswald didn't do it") forces us to conclude the consequent ("someone else did"). It's a form of *belief revision*: given what we know is true (Kennedy died), if we learn Oswald didn't do it, we *must* conclude someone else did. There's no viable alternative within the known facts.
      *   **Why it feels true:** It reflects a deductive inference *from the known outcome*. Kennedy died by an assassin's bullet. Therefore, if Oswald wasn't the assassin, logic dictates someone else *was*. The truth hinges on the *actual outcome* constraining the possibilities under the supposition.

  2.  **The Subjunctive/Counterfactual Conditional ("If Oswald had not killed Kennedy, then someone else would have"):**
      *   **Mode:** Metaphysical/Modal (About how the world *could have* been).
      *   **Truth Conditions:** Evaluated relative to *similar possible worlds*. We imagine a world as close as possible to the actual world *except* that Oswald didn't kill Kennedy. Crucially, we hold fixed background facts *except* those directly causally dependent on the change. In this closest world:
          *   There's no evidence of a coordinated conspiracy with a backup assassin poised to act.
          *   The motorcade route, security, and circumstances weren't set up expecting multiple shooters.
          *   Kennedy wasn't exhibiting signs of being terminally ill or about to be killed by another means that day.
      *   **Why it feels false:** In this closest possible world where Oswald's rifle jams (as in your novel!), the most plausible outcome is that Kennedy *survives the Dallas motorcade*. There's no compelling reason, based on the known historical context *excluding the actual shooting*, to believe another assassin was *guaranteed* to succeed where Oswald (in this scenario) failed. The truth hinges on *causal structures* and *default assumptions* about how events would have unfolded *differently*.

  **Why it's Not *Just* Grammar or Psychology:**

  1.  **Different Truth Makers:** The indicative conditional's truth depends crucially on the *actual fact* of Kennedy's death. Remove that knowledge (e.g., imagine we *don't* know if Kennedy died or not), and the indicative loses its force. The counterfactual's (in)validity depends on causal laws, historical context, and what we hold fixed when imagining alternatives – *independent* of the actual death *in the counterfactual scenario itself*.
  2.  **Possible Worlds Semantics (Lewis/Stalnaker):** This formal framework rigorously distinguishes them. The indicative is evaluated within the *actual* world under a supposition. The counterfactual is evaluated by comparing the actual world to *similar possible worlds* where the antecedent is true. The "closeness" metric is key: worlds where Oswald jams but a previously unknown lone gunman instantly succeeds are likely *less similar* to our world (which had no such evidence) than worlds where Kennedy drives on unharmed.
  3.  **Adams' Thesis (Probability):** Ernest Adams (your friend's reference) focused on how we *assert* and *evaluate* conditionals based on probability. He argued we accept an indicative conditional "If P, then Q" to the extent we assign a high *conditional probability* P(Q|P). Given P(Kennedy was killed) = 1, P(Someone else killed him | Oswald didn't) is also 1. For counterfactuals, it's not about conditional probability *given the actual facts*, but about the probability we assign to Q *in the hypothetical scenario* defined by P. We judge the probability of "someone else kills him" *in the scenario where Oswald fails* as very low.
  4.  **The Role of the Actual Outcome:** Your intuition that "the underlying content is identical" is powerful but slightly off-target. The underlying *events referenced* are the same, but the *logical operation* being performed is different:
      *   **Indicative:** "Given the outcome *we know happened* (death), if we remove this cause (Oswald), what *must* be true about the cause?"
      *   **Counterfactual:** "If this cause *had been removed* (Oswald failing), what *would have happened* to the outcome (death)?"

  **Implications for Your Novel (and Philosophy):**

  1.  **You're Primarily in Counterfactual Land:** Your novel explores "If Oswald *had* failed, Kennedy *would have* survived..." Your task is to build a plausible "closest possible world" where the rifle jams. This requires justifying what you hold fixed (e.g., no massive conspiracy with a failsafe shooter *in position that day*) and what changes (Kennedy's survival, the political fallout). The *falsity* of the counterfactual "someone else would have" in our analysis *supports* the plausibility of your core premise: Kennedy lives.
  2.  **It's Not *Just* English:** While English mood signals the distinction, the logical difference is robust. Translating these sentences into languages with rich mood systems (like Romance languages) or even languages relying more on context still reveals the same intuitive judgments about truth conditions. The puzzle arises from how human cognition handles supposition versus imagination.
  3.  **Philosophers Aren't Over-Reading:** They identified a fundamental feature of reasoning. This distinction clarifies debates in metaphysics (causation, necessity), epistemology (belief revision), logic (non-monotonic reasoning), and even law (counterfactual causation in liability).

  **Conclusion:**

  You are right that both sentences reference the same historical events concerning Oswald and Kennedy's death. However, they are **not "one conditional dressed in two grammatical costumes" with identical underlying content.** The indicative conditional is an exercise in *deductive inference based on known facts*. The counterfactual conditional is an exercise in *imagining alternative causal scenarios based on similarity and default assumptions*. The difference in perceived truth value stems from this fundamental shift in perspective – from reasoning *within* the actual world constrained by its outcomes, to reasoning *about* alternative worlds constrained by similarity and causality. While the grammatical mood in English serves as a signal, the underlying logical and semantic divergence is genuine and deeply informative about how we understand possibility, necessity, and causation. Your struggle to scaffold your novel perfectly illustrates why this distinction matters: building a believable counterfactual history *requires* engaging deeply with the logic of "would have" statements, not just "did/didn't."
