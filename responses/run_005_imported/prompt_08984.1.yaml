  *   "Confidence isn't binary. It's the rational degree of belief calibrated against all logical constraints and evidence generated so far. For Collatz, that calibration points overwhelmingly towards truth."
  *   "It's the sustained absence of *any* counter-pattern, the uniformity of the descent... LI interprets that void where counter-evidence *should* be as deafening confirmation."

