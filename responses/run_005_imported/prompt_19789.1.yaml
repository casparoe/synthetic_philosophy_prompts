  So I went down a rabbit hole and found out Einstein actually wrote this whole essay back in 1949 called Why Socialism, where he goes on about how capitalism doesn't just mess up the economy but actually warps how people treat each other. He's also got this point that stuck with me, where he says private capitalists basically end up controlling the newspapers, radio and schools, so regular people can't really form thier own opinions or use their political rights for anything real. Kinda makes me wonder, if he was alive now and saw how a handful of tech companies control the algorithms on social media (and the AI chatbots too) that decide what billions of people see and believe everyday, would he call that basically the same problem he was talking about just way more powerful, or is that actually a different kind of issue that his whole socialism thing doesn't really cover?
