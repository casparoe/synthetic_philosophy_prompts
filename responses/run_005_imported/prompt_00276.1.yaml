  Addressing failed structures requires showing they were not genuinely structural or were misapplied. For example, Bohr's atomic model had mathematical components that were ad hoc, not derived from deeper principles. In contrast, Fresnel's equations were derived from wave theory and retained. 

  The user's unspoken need might be to present a balanced view in their article. They want to explain structural realism's strengths without oversimplifying. Highlighting that it's a nuanced position—accepting some structural failures but arguing they're exceptions—could help. Also, stressing that structural realism is a refinement, not a complete solution, adds depth. 

  Finally, grounding the claim that structures are more stable involves their empirical grounding. Structures are tied to observations and thus more likely to be retained as approximations. Entities, being theoretical posits, are more prone to rejection. Historical analysis shows mathematical continuity where ontological discontinuity exists, supporting this claim. 

