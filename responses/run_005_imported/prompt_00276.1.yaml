  First, I need to unpack why structural realism claims to avoid the meta-induction. The key is differentiating between structure and ontology. Historical examples like Fresnel's equations show mathematical structures persisting even when entities like the ether were discarded. But the user is right—structures can also be abandoned. So, how does structural realism defend against that?

