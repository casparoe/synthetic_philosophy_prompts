answer: |-
  You've pinpointed the core tension in structural realism (SR) brilliantly. Shifting from "entities survive" to "structure survives" *does* seem like relocating the target for the pessimistic meta-induction (PMI). A sophisticated structural realist needs a nuanced response to the "meta-level PMI" against structure itself. Here's a breakdown of the arguments, the texture, and the potential grounding:

  **1. The Core Structural Realist Claim (Refined):**

  *   **Not "All Structure Survives":** SR proponents don't claim *every* mathematical structure from past theories survives unscathed. They claim that *the specific structure that successfully captured the relevant empirical phenomena* tends to be retained or recovered as a limiting case or approximation within the successor theory.
  *   **Continuity of *Relations*, not *Relata*:** The key insight is that what persists is the *web of relations* described mathematically, even when the *things* related (the unobservable entities) change radically or disappear. The equations describe *how things behave* relative to each other under certain conditions, and *that* behavior pattern often endures.
  *   **Selective Retention:** SR argues that science exhibits a pattern of *selective retention* of empirically successful mathematical structure across deep theory change, precisely where ontological commitment to entities fails spectacularly.

  **2. Addressing the "Meta-Level PMI" Against Structure:**

  The challenge: "Sure, Fresnel→Maxwell worked, but what about cases where the math itself was scrapped? Doesn't *that* history undermine the reliability of structure?"

  **The Structural Realist Response (Layered):**

  *   **a) Identifying Genuine Structural Failures (The Exceptions):** Yes, there are cases. The structural realist needs to analyze these carefully:
      *   **Phlogiston:** Often cited *against* entity realism, but did it have a *robust, empirically successful mathematical structure* associated specifically with it? Stahl's theory was largely qualitative. The quantitative aspects (e.g., weight changes in calcination) were later explained by oxygen chemistry using *different* mathematics (Lavoisier). This is more an *ontological* failure without a deep mathematical structure to carry over.
      *   **Caloric:** More nuanced. Caloric theory *did* develop sophisticated mathematical treatments of heat flow (e.g., Fourier's heat equation). **Here's the texture:** Fourier derived his equation phenomenologically, based *directly* on observable heat flow patterns, *without* necessarily committing deeply to caloric fluid. Crucially, **the Fourier equation itself survives intact** within kinetic theory and statistical mechanics! It describes the *macroscopic behavior* of heat diffusion perfectly well, even though the underlying ontology (caloric vs. molecular motion) is completely different. The *structure* (the equation governing observable relationships) persisted.
      *   **Newtonian Gravity vs. General Relativity (GR):** This is a tougher case *prima facie*. Newton's inverse-square law force (`F = Gm1m2/r²`) seems discarded by Einstein's curved spacetime (`G_μν = 8πG T_μν`). **The SR analysis:**
          *   **Limiting Case Recovery:** In weak gravitational fields and low velocities, the solutions to Einstein's equations *reduce mathematically* to Newton's inverse-square law. Newton's structure is *contained within* GR as a special case approximation.
          *   **Structural Element Retention:** While the *specific force law* is an approximation, core structural *principles* arguably persist: the concept of a field affecting motion (metric tensor field vs. gravitational potential), the dependence on mass, the conservation principles underlying the equations.
          *   **Domain Specificity:** Newtonian gravity wasn't *wrong* per se within its empirically validated domain (planetary orbits, terrestrial mechanics). Its structure *fails* when extended beyond that domain (e.g., Mercury's orbit, light bending, strong fields). Its success was genuine but domain-limited; the *structure* describing that domain is recovered within the broader structure of GR.
      *   **Bohr Model vs. Quantum Mechanics (QM):** Bohr's quantized angular momentum (`mvr = nħ`) and energy levels provided a mathematical structure explaining atomic spectra. **The SR analysis:**
          *   **Partial Retention:** The *energy level structure* itself remains a core feature of QM (`Hψ = Eψ`). The specific quantization rule (`mvr = nħ`) is derived as an approximation for hydrogenic atoms within the full QM framework (using the correspondence principle or solving the Schrödinger equation in spherical coordinates).
          *   **Radical Reformulation:** The underlying *dynamics* (deterministic orbits vs. wavefunction evolution/probability) and the *meaning* of quantization changed utterly. The *structural element* of discrete energy states persisted, even though the *model* generating them (semi-classical orbits) was discarded. The mathematical structure capturing the *spectral lines* (energy differences) was preserved and embedded within a vastly different formalism.

  *   **b) Why Structure *Should* Have a Better Track Record (The Grounding):** SR argues structure is more stable because:
      *   **Empirical Anchoring:** Mathematical structure in successful theories is primarily constrained by and derived from *empirical data* – the patterns and relationships observed in experiments and measurements. Structure is the formalization of *how the world manifests itself to us*. Ontological interpretations (caloric fluid, ether, phlogiston) are often *theoretical posits* attempting to *explain* that structure. Posits are more vulnerable to revision than the empirically grounded patterns they were invented to explain.
      *   **Abstractness and Flexibility:** Mathematical structures are abstract. The same equation (e.g., wave equation, Fourier's law) can often be interpreted in multiple ontological ways (vibrating strings, water waves, sound waves, light waves; caloric flow, molecular kinetic energy flow). This abstractness allows the structure to be *reinterpreted* within new ontological frameworks without losing its empirical content. Entities are more concrete and brittle; if your fundamental "stuff" is wrong, it's hard to salvage.
      *   **The No-Miracles Argument (NMA) Refocused:** The refined NMA for SR: The incredible, detailed, novel predictive success of our best scientific theories would be an *utter miracle* if the mathematical structures they employ to capture the relations between phenomena weren't latching onto *something real and stable* in the world's organization. If structures were routinely completely discarded without trace or limiting case recovery, this success would be inexplicable. The *selective retention* of successful structure provides the best explanation for progressive success.
      *   **Focus on the "What" not the "Why":** SR is often seen as agnostic or deflationary about the ultimate "nature" of things (the entities). It claims we *can* reliably know the *structure* of relations governing observable phenomena, even if our understanding of what *instantiates* that structure changes. This is presented as a more modest, defensible form of realism.

  *   **c) Handling Genuine Structural Failures:** When faced with a case where even the core mathematical structure seems abandoned (e.g., some aspects of Ptolemaic epicycles vs. Keplerian ellipses, though even here geometric relationships have limiting case connections), the SR response is:
      *   **Lack of Genuine Novel Success:** Argue the failed structure didn't achieve the same level of *detailed, novel predictive success* as the structures SR focuses on (like Maxwell's equations predicting EM waves). Its empirical adequacy might have been more limited or achieved through ad-hoc tuning (like endlessly adding epicycles).
      *   **Misidentification:** Argue that the discarded element wasn't truly the *core* empirically successful structure, but a theoretical add-on or a misapplication.
      *   **Domain Relativity:** Concede the structure failed *when extended beyond its original domain of application*, but that within that domain, its success is explained by it capturing a genuine local structural feature, recoverable as a limit of the broader theory.

  **3. The Hierarchy of Structure & Grounding the Claim:**

  Sophisticated SR often appeals to a *hierarchy* of structure:

  1.  **High-Level Abstract Structure:** Fundamental symmetries, conservation laws, very general principles (like least action, principle of relativity). These are incredibly stable across revolutions (e.g., conservation of energy).
  2.  **Mid-Level Phenomenological Structure:** Equations directly describing observable phenomena (Fresnel equations, Fourier's law, ideal gas law). These often persist as highly accurate approximations within well-defined domains or as limiting cases.
  3.  **Low-Level Theoretical Structure:** Specific models and mechanisms posited to *explain* the mid-level structure (luminiferous ether, caloric fluid, Bohr orbits). These are most vulnerable.

  The claim that "structure survives better" is grounded in:

  *   **Historical Analysis:** Careful case studies (like the Fresnel→Maxwell transition) showing the pattern of mathematical continuity amidst ontological rupture.
  *   **The Nature of Scientific Explanation:** Science progresses by building mathematical models that fit data. The fit is achieved through the structural relationships. When models change, the requirement to *recover* the empirically successful relationships of the old model acts as a powerful constraint on the new model, ensuring structural continuity at the phenomenological level.
  *   **The Argument from Underdetermination:** Many different ontologies can often realize the same mathematical structure. Therefore, expecting ontological continuity is unrealistic, but expecting structural continuity (as it's what directly links to evidence) is more reasonable.

  **Conclusion for Your Piece:**

  Structural realism doesn't magically dissolve the PMI; it reframes it. It concedes that *specific entities and mechanisms* are highly fallible but argues that the *mathematical structure capturing empirical relationships* exhibits remarkable resilience across theory change. Its defense against the "meta-PMI" is:

  1.  **Nuance:** Not all "structure" is equal; focus is on the empirically successful core.
  2.  **Recovery:** "Failed" structures are often recovered as limiting cases, showing their domain-specific validity.
  3.  **Historical Pattern:** Analysis shows structural continuity *where it matters most* (in explaining empirical success) is the norm in major transitions, while ontological continuity is the exception.
  4.  **Grounding:** Structure is more stable because it's more directly anchored in empirical data and abstract enough to be reinterpreted. The No-Miracles Argument, focused on structural retention, provides the rational justification for believing *this* aspect is likely to persist.

  The strength of SR lies in its ability to explain scientific progress *without* naive entity realism. Its vulnerability is that it must constantly engage with historical counterexamples and argue that they either aren't genuine structural failures or represent the (expected) failure of less fundamental, less empirically grounded structure. It offers a sophisticated, historically informed, but still realist, perspective on what we can reliably believe survives scientific revolutions.
