answer: |-
  ## The Whiteboard Aftermath: Conditionals & Collapse

  **Setting:** A cramped seminar room, fluorescent lights humming. Whiteboard smeared with the ghost of Lewis’s proof: "Assume P(A>C) = P(C|A) for all A,C... contradiction." Chalk dust hangs in the air. **Alex** (Truth-Conditionalist, leans towards Stalnaker/Jackson) and **Morgan** (Probabilist/Expressivist, Adams/Edgington camp) linger, mugs cooling.

  **Alex:** (Erasing a stray symbol) Alright Morgan, dust has settled on the derivation. Lewis wins. The Equation *cannot* universally hold for a proposition `A>C` within a non-trivial probability space. Simple as that. Adams' Thesis, as a *literal identity* between credence in a conditional and conditional credence, is untenable if conditionals are propositions. So, we bite the bullet: `if A, C` *is* a proposition, and the Equation is either an approximation or holds only under restricted conditions. Jackson had it right – assertibility *tracks* P(C|A) via robustness, even if the truth conditions are material or Stalnakerian.

  **Morgan:** (Leans against the table, arms crossed) "Bite the bullet"? Alex, you're swallowing the whole armory! Lewis didn't just show the Equation can't hold universally *for propositions*. He showed that *any attempt to force conditionals into the propositional mold* while respecting how probability updates work *forces* triviality. The proof *is* the reductio against truth conditions! The Equation *is* the fundamental datum about our conditional judgments – it’s how we *use* conditionals, how we reason with uncertainty. If making them truth-bearers destroys that, then they simply aren’t truth-bearers. Adams got it right first: conditionals express *conditional commitments*, not unconditional beliefs.

  **Alex:** Fine, champion the datum. But how do *you* explain embedded conditionals? "If it rains, then if the party is outside, it will be cancelled." Or "Either if A, C, or if B, D." Your view renders these… what? Meaningless? Ungrammatical? Yet we use them constantly! On my view, `if A, (if B, C)` just is `if (A & B), C`, or perhaps a nested selection function in Stalnaker's framework. It composes. It has a clear truth condition (e.g., true iff in the closest A-world, the closest B-world is a C-world). What’s *your* semantics for that embedding? Edgington handwaves about “construing” embeddings, but it feels like special pleading to avoid the compositional machinery truth conditions provide.

  **Morgan:** (Steps to the board, points at the proof) Compositionality *is* the problem, Alex! Lewis’s proof *uses* compositionality – the assumption that `A>C` is a proposition that can be conjoined, disjoined, negated *within the probability calculus* – to blow everything up. Insisting on truth conditions *creates* the embedding problem *and* the triviality. Our use of embeddings might be more complex than simple truth-functional glue. Maybe "if A, then if B, C" directly expresses P(C | A & B). Maybe embeddings signal a shift in the hypothetical context. It’s messy, I grant you, it’s the *explanatory debt* we carry. But it’s a better debt than the one *you* owe: explaining away the *overwhelming* intuitive pull of the Equation. You have to tell me why, if `if A, C` is just the material conditional or a Stalnaker proposition, we assign credence P(C|A) to it, *not* P(not-A or C). Why does P(if A, C) plummet when I learn A & not-C, but stay high if I just learn not-A? Jackson’s “robustness” feels like a post-hoc patch for the material conditional’s absurdities.

  **Alex:** (Picks up chalk, writes `P(A ⊃ C) = P(¬A ∨ C)`) The material conditional *is* admittedly clunky near P(A)=0 or when A is false. That’s why Stalnaker’s refinement is better! The probability of `A > C` *isn’t generally* P(C|A), Lewis proved that, but it *can be close*, especially when A is epistemically possible. And crucially, when you *learn A*, the probability *does* collapse to P(C) given A, which aligns with conditionalization on the truth of the antecedent. As for robustness: it’s not *just* a patch. It explains why we *assert* conditionals with high P(C|A) – because we believe they’d survive learning A. That *is* a core pragmatic feature captured by the truth-conditional core plus assertibility rules. Your view makes *all* of that core disappear! You reduce conditionals to *sui generis* expressions of conditional probability, but then struggle to explain how they interact logically with other parts of language. That seems like a bigger fragmentation of semantics.

  **Morgan:** Fragmentation versus falsification, Alex. The truth-conditional core you cling to *systematically generates wrong predictions* about the probabilities rational agents assign. Lewis showed it’s mathematically *impossible* for it to match the conditional probability structure across the board. You respond by *restricting* the Equation – "oh, it only holds when A is live," or "it's only approximately true," or "it governs assertibility, not truth." But that concedes the central point: the *deep, general* connection is between the conditional *judgment* and P(C|A). Making it a truth-apt proposition adds a layer that *must* distort this connection, forcing you into ad hoc restrictions. My "explanatory debt" is developing a non-propositional semantics for embeddings. *Your* debt is explaining why the core semantic object – the proposition expressed – seems so utterly disconnected from the core epistemic phenomenon – the conditional credence – in all but the most favorable cases. Why build the whole truth-conditional edifice if it constantly needs to be bypassed to explain use?

  **Alex:** (Sighs, puts chalk down) Because without truth conditions, you lose the *world*. You lose the ability to say the conditional is *true* or *false* given how things are, independent of our credences. You lose counterfactual robustness – what *would* be true *if*. On Stalnaker’s view, even if I have P(C|A) = 0.5, `A > C` is determinately true or false at a world. Your view makes conditionals ephemeral, tied only to the agent's current state of uncertainty. What happens when uncertainty is resolved? Does "If A, C" just vanish if I learn A? Or does it become the assertion of C? That feels deeply unsatisfying. It severs the link between indicative and subjunctive conditionals that Stalnaker’s unified account provides. My debt is restricting the Equation and dealing with the paradoxes of material implication. Your debt is building a coherent, non-propositional *semantics* that handles compositionality and anchors conditionals to reality, not just credence.

  **Morgan:** (Nods slowly) Fair. The "anchoring to reality" point stings. We non-propositionalists *do* owe an account of conditional *facts* and how language hooks onto them, without reifying `A>C`. Perhaps via probabilistic causal models, or generalizing the Ramsey test. And yes, the transition from uncertain supposition to known antecedent needs careful handling – it’s not that the conditional vanishes, but its *role* changes. But Alex, your anchoring comes at too high a cost. That beautiful, simple Equation – the direct expression of how hypothetical reasoning *works* – gets mangled by the truth-conditional machinery. You have to contort the semantics or the pragmatics to explain why rational agents systematically *ignore* the truth conditions your theory posits when assigning credence. My debt is building a richer non-propositional framework. *Your* debt is explaining the massive, systematic *divergence* between the credence rational agents actually have in conditionals and the credence they *should* have, according to your truth conditions, in vast swathes of the probability space. Lewis didn’t just prove a technical result; he proved that truth conditions for conditionals are *epistemically inert* in the way that matters most.

  **Alex:** (Looks at the smeared proof on the board) Epistemically inert... perhaps. But semantically indispensable, I think. We’ll keep building our frameworks, carrying our respective debts. Mine feels like patching a fundamentally sound structure. Yours feels like building on shifting sands. But the proof... the proof stands for both of us. It demands *some* deep concession. (Gathers papers) Same time next week?

  **Morgan:** (Offers a wry smile) Absolutely. The dust never *really* settles, does it? See you then. Don’t erase the board.

  **(Both philosophers leave, the ghost of P(C|A) and the shadow of A>C lingering on the whiteboard, unresolved.)**

  ---
  **Explanatory Debts Owned:**

  *   **Alex (Truth-Conditionalist):** Owes a principled explanation for why the credence rational agents assign to a conditional `A>C` systematically diverges from the probability of the proposition it supposedly expresses (P(not-A or C) for material, a complex function for Stalnaker) across large parts of the probability space, *despite* the Equation holding intuitively and needing to be explained away via restrictions or pragmatics (robustness). Owes a fully satisfying solution to the paradoxes of material implication if favoring that, or an account of why Stalnaker's P(A>C) isn't generally P(C|A).
  *   **Morgan (Probabilist/Expressivist):** Owes a compositional semantics for embedded conditionals (negation, disjunction, antecedents) that doesn't rely on assigning truth conditions to the embedded conditional clauses themselves. Owes an account of how conditional judgments ("If A, C") connect to conditional *facts* or states of the world beyond just the agent's current credences, especially when uncertainty is resolved. Owes a clear story about the relationship between indicative and subjunctive conditionals without a unified propositional core.
