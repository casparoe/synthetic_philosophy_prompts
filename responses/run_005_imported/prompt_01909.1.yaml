  First, I recall that Zahavi's handicap principle posits that signals are honest because they are costly. Only high-quality individuals can afford these costs. But Grafen's formal model introduces the idea of differential costs: the key is that low-quality individuals face higher marginal costs for the same signal level. This difference in cost structure, not the absolute cost, maintains honesty.

  The user mentioned Számadó's argument that realized cost isn't necessary or sufficient. They need to reconcile "cost keeps signals honest" with "honest signals aren't costly at equilibrium." The challenge is explaining this without equations. Using an analogy might help, like the luxury car example. High-quality individuals (like the wealthy) can afford signals (luxury cars) more easily because the cost impacts them less. The cost isn't about the price paid but the burden relative to their resources.

  Another point: at equilibrium, the signal level is set where low-quality individuals can't mimic without incurring unsustainable costs. High-quality individuals pay a cost, but it's manageable for them. The key is the difference in marginal costs, not the absolute cost paid. This distinction resolves the apparent paradox.

  The user also asks if this is a substantive correction or a terminology issue. It's both. Textbooks often oversimplify by focusing on absolute costs, but Grafen's model was clear about differential costs. The confusion arises from interpreting "cost" as realized equilibrium cost versus the cost function's structure. Clarifying terminology and emphasizing differential costs in teaching would help.

