   - KS: Ensures that the ratio of the players' gains from the disagreement point are proportional to their ideal gains (i.e., the maximum they could get if the other player were to concede everything). It is a maximin approach in terms of the proportion of the ideal payoff.
   - Nash: Maximizes the product of the players' gains from the disagreement point.

