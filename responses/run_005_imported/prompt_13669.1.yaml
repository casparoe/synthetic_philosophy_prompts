  Also, robustness is key. Scientists should test how sensitive their results are to different priors. If conclusions change significantly, they need to acknowledge that uncertainty. Reporting with multiple priors or using reference priors could help. The key takeaway is that "uninformative" isn't straightforward, and choices must be justified based on problem structure, not just indifference.

