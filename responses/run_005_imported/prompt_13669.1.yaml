  I should explain why this matters for scientific priors. When scientists say they have no information, they might think a uniform prior is natural. But Bertrand's paradox shows that uniform in one variable isn't uniform in another. So the choice isn't neutral; it depends on the metric. For example, in particle physics, a flat prior on cross-section versus log cross-section affects the upper limit calculation, leading to different results. That's why their collaboration meetings were stuck in arguments—there's no purely principled way to choose without additional considerations.

