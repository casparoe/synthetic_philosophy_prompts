answer: |-
  Below are eight interview questions drafted for your episode, structured to delve into the critical tensions in the surrogate-goals proposal while skipping introductory material. I've included your four requested focus areas (with tailored follow-ups for each) and closed with the persuasion question. The questions are designed to be concise yet incisive, reflecting the podcast's niche audience. Each main question targets a core conceptual challenge, and the follow-ups (marked with "→") anticipate common rebuttals to keep the conversation rigorous. The list totals eight questions: four main, four follow-ups, and one closer.

  ### Interview Questions:
  1. **Establishing shared conventions without causal channels**:  
     "Your work assumes that a threatener will treat a cheap surrogate goal as interchangeable with the real target for acausal threats. But with no causal channel for coordination, how does the target ensure the threatener even recognizes the surrogate as a valid bargaining chip? Isn't this relying on a preexisting 'convention' that might not exist, especially if the threatener has no incentive to adopt it?"  
     → *Likely response follow-up (if she appeals to symmetry or rationality norms)*: "If the threatener’s disposition doesn’t inherently value such conventions, how do you bootstrap mutual understanding without negotiation? Doesn’t this just push the problem to a higher level—who coordinates the coordinators?"

  2. **Premature commitments and commitment races**:  
     "Adopting a surrogate goal feels like an irreversible, early move in what the literature calls a 'commitment race'—like locking in your bargaining position before knowing who you’ll face. Couldn’t this backfire? For example, if you commit to defending a surrogate, might you later encounter a threatener who exploits that rigidity to force concessions on something else?"  
     → *Likely response follow-up (if she argues flexibility in choosing surrogates)*: "But if you delay choosing a surrogate until a threat emerges, doesn’t that leave you vulnerable to threats that condition on your prior lack of commitment? How do you avoid a lose-lose: committing too early versus too late?"

  3. **Common knowledge unravelling**:  
     "Once surrogate goals become common knowledge, why wouldn’t a rational threatener circumvent them by making threats conditional on the target *not* using a surrogate? For instance, 'I’ll harm X unless you prove you haven’t shielded X with a decoy.' Doesn’t this make the defense self-defeating?"  
     → *Likely response follow-up (if she suggests secrecy or probabilistic defenses)*: "If targets hide their surrogate use, how does that solve the acausal coordination problem? Without causal signaling, wouldn’t the threatener still doubt the surrogate’s existence, making threats *more* aggressive due to uncertainty?"

  4. **Behavioral indistinguishability and value drift**:  
     "Defending a surrogate 'exactly as fiercely' as the real goal seems indistinguishable—to an external observer—from no longer caring about the real goal. If that’s true, doesn’t it undermine deterrence? For example, wouldn’t it encourage causal attackers (e.g., human adversaries) to target the real goal, knowing you’ve psychologically deprioritized it?"  
     → *Likely response follow-up (if she argues context-specific defenses)*: "If you only 'activate' the surrogate for acausal threats, how does the threatener verify that context? Couldn’t they force you to defend the real goal directly by threatening it non-acausally, nullifying the surrogate’s role?"

  5. **Closing persuasion test**:  
     "Surrogate goals are elegant in theory, but much of the criticism argues they’re 'held together by hope.' What evidence or argument would convince you this approach is fundamentally flawed—not just messy to implement, but incoherent? For instance, would a proof that no Nash equilibrium exists for acausal bargaining with surrogates change your mind?"

  ### Why this structure?
  - **Pacing**: The sequence escalates from setup (Q1) to failure modes (Q2–Q4) to a reflective closer (Q5), mirroring how debates unfold in alignment circles.  
  - **Follow-ups**: Each is tailored to standard counterarguments (e.g., Q3’s follow-up preempts "secrecy" fixes). They’re concise to avoid derailment but sharp enough to pressure hand-wavy reasoning.  
  - **Audience fit**: Assumes familiarity with acausal concepts (no basilisk rehashing) and name-drops literature (e.g., "commitment races") to signal depth.  
  - **Room for expansion**: At 8 questions, you’re under your limit—add one more if she avoids engagement, e.g., "How do surrogates handle threats from agents with orthogonal values?"  

  If she dodges, the follow-ups should force clarity. For the closing, if she dismisses falsifiability, you could pivot to: "If no evidence could dissuade you, is this more about aesthetics than robustness?" Good luck with the episode!
