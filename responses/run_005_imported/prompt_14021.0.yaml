prompt: |-
  I've spent a long time lurking on LessWrong, Overcoming Bias, and the Alignment Forum, and one thing that keeps nagging at me is how the phrase "money pump" gets used in what feel like two different registers there. In the classic register, it's the diachronic cousin of the Dutch book: an agent with a cyclical preference over some options A, B, and C (or, on some versions, merely incomplete preferences plus a willingness to accept a "free" sweetener) can be walked through a sequence of trades that leaves it strictly poorer while ending up back where it started, and this is supposed to show that transitivity and completeness aren't just tidy modeling assumptions but genuine requirements of rationality. In the other register — the one that shows up around discussions of updateless decision theory and Parfit's hitchhiker — the moral seems to run the opposite way: an agent that reoptimizes at every choice node (what Edward McClennen called a "sophisticated" chooser, as opposed to a "resolute" one who sticks to a plan even where deviating would look locally better) is exactly the kind of agent that ends up money-pumped, or stranded in the desert, because it can never credibly commit itself to anything that its later self would not independently endorse at the time.

  Given that, could you lay out the most important implications of the money-pump literature — including the usual resolute-choice and sophisticated-choice replies, plus the more deflationary view that exploitability of this kind is simply a cost worth paying to keep otherwise-attractive incomplete preferences — for a fairly concrete question about my own life: how far I should actually go in cultivating resolute dispositions, such as an irrevocable multi-year donation pledge or a flat policy against ever renegotiating a deal with my past self, rather than treating every future decision point as a fresh occasion to reoptimize given whatever preferences I happen to have by then. My reading group has been stuck for weeks on whether "being resolute" names a substantive rationality constraint that the money-pump arguments actually license, or whether it's just a polite label for privileging your past self's preferences over a future self who never signed up for them — and I'd like to see the strongest version of both sides before we go another round.
reasoning: |-
  Okay, the user has been deeply involved with rationality communities like LessWrong and the Alignment Forum, where they've encountered two distinct interpretations of "money pump" arguments. They're trying to reconcile the classic view—where cyclical preferences lead to exploitable inefficiency—with the decision-theoretic view—where sophisticated reoptimization causes commitment failures. Their concrete question is about personal application: how resolute should they be in their own life decisions, like donation pledges or personal policies?

  First, I need to unpack both registers of money pumps. The classic version is straightforward: if you prefer A to B, B to C, and C to A, someone can pump money from you by trading you through that cycle. The key implication is that rationality requires transitive preferences to avoid exploitation. But the second register is trickier. Here, money pumps arise from dynamic inconsistency—when your future self won't stick to the plan your past self made. The examples like Parfit's Hitchhiker show sophisticated agents (who reoptimize at each step) getting punished for their inability to commit, while resolute agents (who stick to the plan) fare better. 

  The user's core dilemma is practical: should they cultivate resolute dispositions in real life? They mention examples like irrevocable donations or refusing to renegotiate with their past self. Their reading group is stuck debating whether resoluteness is a genuine rationality requirement or just privileging past preferences. They want the strongest arguments for both sides to break the deadlock.

  For the classic money pump defense of resoluteness, the argument is that sophisticated choosers are predictably exploitable in sequential interactions. If others know you'll renege on commitments when convenient, they won't cooperate with you (e.g., no one picks you up in Parfit's scenario). Resoluteness acts as precommitment, making cooperation possible. McClennen and Gauthier defend this as instrumentally rational—it maximizes outcomes across time. The counter is that resoluteness forces you to follow through on actions that are clearly suboptimal *now*, which feels irrational in the moment. Why pay for the desert rescue if you're already saved? 

  The sophisticated view counters that deviating from the plan is *actually* rational when the choice node arrives because only present preferences matter. Past preferences are sunk; future ones are hypothetical. Sacrificing current interests for past/future selves is incoherent. From this angle, money pumps are just an unfortunate cost of temporal inconsistency, not a flaw. The deflationary view adds nuance: incomplete preferences might be worth keeping even if exploitable because forcing transitivity/completeness could oversimplify complex values. Or resoluteness might only be useful in specific social contexts with commitment mechanisms.

  For the user's concrete life choices, the tradeoffs depend on three factors: (1) How much their future preferences might shift (e.g., if donations align with stable values, resoluteness makes sense). (2) Whether the decision involves strategic interactions (e.g., business deals need credible commitment). (3) How costly it is to be exploited vs. how painful it is to act against current preferences. 

  The strongest case for resoluteness is in repeated interactions where your reputation matters. If you're known to honor pledges, you gain opportunities; if you reoptimize constantly, you lose trust. The strongest case against is when preferences change fundamentally—e.g., pledging to a cause you now find immoral. Forcing yourself to comply would feel like self-betrayal. 

  The user's reading group might benefit from distinguishing between *global* rationality (maximizing life-long goals) and *local* rationality (optimizing at each moment). Resoluteness serves the former; sophistication serves the latter. Neither is universally "correct"—it depends on whether you view your identity as continuous or stage-based. The user's phrasing suggests they lean toward continuity ("past self's preferences"), so they might find the resolute view more compelling, but they're clearly wrestling with the tension.
answer: |-
  You've pinpointed a profound tension at the heart of practical rationality, and your concrete question cuts to the chase. Let's break down the money pump arguments, the "sophisticated" vs. "resolute" responses, and the deflationary view, then apply them directly to your dilemma about cultivating resolute dispositions.

  **The Core Money Pump Registers & Rationality Demands:**

  1.  **Classic Register (Intransitivity/Incompleteness Pump):**
      *   **Mechanism:** Cyclical preferences (A>B, B>C, C>A) or incomplete preferences + a "sweetener" lead to exploitable sequences. E.g., Pay a penny to trade A for C, then pay a penny to trade C for B, then pay a penny to trade B for A. You end up back at A but poorer.
      *   **Prescriptive Demand:** Rationality *requires* transitive and complete preferences to avoid guaranteed loss. This is seen as a *synchronic* coherence requirement.

  2.  **Dynamic Inconsistency Register (Sophistication Pump):**
      *   **Mechanism:** An agent with time-inconsistent preferences (e.g., strongly preferring future sacrifice for long-term gain *now*, but strongly preferring immediate gratification *later*) makes a plan (e.g., commit to saving). A "sophisticated" agent foresees that its future self will deviate (spend the money), so it doesn't commit/save in the first place, achieving a worse outcome than if it *could* commit. Parfit's Hitchhiker (don't get rescued if you *can't* pay later) or Self-Defeating Investment (don't start a project requiring future costly effort you *won't* do) exemplify this.
      *   **Exploitability:** An external agent or the "market" exploits this foreseen deviation. They know you won't follow through, so they don't offer the beneficial initial option (rescue, investment opportunity).
      *   **Prescriptive Challenge:** This seems to demand *diachronic* coherence: a way to bind your future self to plans your past self deemed optimal. "Sophistication" avoids broken plans but accepts the suboptimal outcome caused by foreseen weakness. "Resoluteness" sticks to the optimal plan even when local reoptimization tempts deviation.

  **The Contending Responses & Their Arguments:**

  1.  **The Case for Sophistication (Reoptimize Always):**
      *   **The Core Argument:** Rationality is fundamentally *local* and *procedural*. At any given choice node, the rational action is the one that maximizes expected utility *given your preferences and information at that moment*. Your past self is gone; its preferences have no normative authority over your present self. Sacrificing *current* expected utility to satisfy a *past* preference is irrational.
      *   **Against Resoluteness as Coherent:** Resoluteness requires privileging a *past* decision-making event. Why is *that* moment privileged? What if your preferences change *genuinely* (new information, values shift)? Forcing yourself to act against your *current* values is self-abnegation, not rationality. It treats "you" as a single entity across time in a way that doesn't reflect the reality of changing perspectives.
      *   **Deflationary View on Pumps:** Sophistication avoids *actual* diachronic money pumps (you never pay to cycle or get stranded). The "pump" is merely the *cost* of having time-inconsistent preferences. It's not irrationality, it's a regrettable fact about your utility function. Forcing transitivity/completeness might be worse than accepting some exploitability if it distorts your true, complex values.

  2.  **The Case for Resoluteness (Stick to the Plan):**
      *   **The Core Argument:** Rationality is *global* and *outcome-oriented*. The goal is to achieve the best *overall* life or sequence of outcomes. Sophistication guarantees you *achieve* the suboptimal outcome foreseen by your past self. Resoluteness allows you to achieve the *optimal overall plan*. Diachronic money pumps show that *only* resolute agents can access certain beneficial opportunities (cooperation, investment, rescue) that require credible commitment.
      *   **Resoluteness as Instrumental Rationality:** Cultivating a resolute disposition isn't about privileging the past self; it's a *present* strategy to *bind your future self* in order to achieve better *overall* outcomes that your *present* self values. It's a form of sophisticated precommitment *against your own foreseen future irrationality or weakness*. You rationally choose *now* to limit your future options *because* you know future-you might make a locally rational but globally worse choice.
      *   **Against Sophistication as Self-Defeating:** Sophistication isn't avoiding the pump; it *is* the pump. By refusing to commit/stick to plans, you ensure the worse outcome occurs. True rationality demands finding a way to overcome this dynamic inconsistency. McClennen/Gauthier argue resoluteness *is* the rational response, as it maximizes the agent's prospects across time from the initial planning perspective.

  **The Deflationary View (Cost of Doing Business):**

  *   **Incompleteness/Intransitivity:** Forcing completeness/transitivity upon messy human values might be more distorting than accepting some exploitability. Being "pumped" a small amount might be worth the flexibility of not having rigidly defined preferences over everything.
  *   **Dynamic Inconsistency:** Time-inconsistent preferences (e.g., hyperbolic discounting) might be a deep feature of human psychology. Sophistication might be the *least bad* strategy. Resoluteness might require costly or impossible willpower, or lead to sticking with disastrous plans if circumstances change unexpectedly. Exploitability is a tax on having human-like preferences.

  **Applying to Your Concrete Dilemma: Cultivating Resoluteness**

  The strongest arguments **FOR** cultivating resolute dispositions (pledges, policies):

  1.  **Securing Valuable Opportunities:** If a specific outcome requires credible commitment over time (e.g., a multi-year project, a relationship, building a reputation for reliability), resoluteness is the *only* way to achieve it. Sophistication guarantees you miss out. ("I want to support this cause long-term, but future-me might find it less compelling. A pledge forces future-me to uphold my *current* deep value, securing the impact I want.")
  2.  **Combating Self-Sabotage:** For known weaknesses (procrastination, impulsive spending, short-term gratification), resolute policies (automatic donations, savings locks, "never renegotiate X") are rational *precommitments*. They are your *present* self's strategy to prevent your *future* self from acting against your *present* global interests. It's not privileging the past; it's privileging the *plan* deemed best overall *now*.
  3.  **Building Identity & Integrity:** Resolute adherence to pledges/policies can shape your future preferences and reinforce valued aspects of your identity ("I am someone who keeps promises, even to myself"). Sophistication can lead to a fragmented sense of self.
  4.  **Efficiency & Reduced Decision Fatigue:** Flat policies ("never renegotiate") eliminate costly internal bargaining and regret at every future decision point, freeing cognitive resources.

  The strongest arguments **AGAINST** cultivating resolute dispositions / **FOR Reoptimization**:

  1.  **The Authority of the Present Self:** Your future self has its own perspective, information, and values. Forcing it to act on outdated preferences/information is tyrannical and fundamentally irrational *from its perspective*. You are sacrificing *actual* future utility for the *ghost* of past utility. ("Why should my 40-year-old self be bound by the pledge my 30-year-old self made, when my values and understanding have evolved?")
  2.  **Rigidity in a Changing World:** Resoluteness risks catastrophic inflexibility. What if circumstances change drastically (financial ruin, the charity becomes corrupt, your core values genuinely shift)? A resolute disposition makes adapting harder. Sophistication allows graceful course correction.
  3.  **The Burden of Commitment:** Maintaining resolute dispositions requires constant vigilance, willpower, and can generate significant internal conflict and regret when current preferences clash with the policy. This is a real cost.
  4.  **Sophistication Avoids Actual Losses:** While resoluteness *aims* for the best plan, sophistication avoids *actually* following through on actions that are *locally* suboptimal when the time comes. You never *actually* pay the ransom in Parfit's Hitchhiker if you can't; you just don't get rescued. Is that worse than paying while gritting your teeth? The deflationary view says maybe not.
  5.  **The "Self" Problem:** Cultivating resoluteness assumes a stable, unitary self over time. If your identity/personality shifts significantly, binding "yourself" becomes incoherent. Reoptimization respects the autonomy of each temporal stage.

  **Synthesizing for Your Life & Reading Group:**

  *   **Is Resoluteness a Rationality Constraint?** The strongest pro-resoluteness argument (**McClennen, Gauthier**) says *yes*: Diachronic money pumps show that *only* resolute agents can achieve certain Pareto-optimal outcomes accessible through commitment. Sophistication is self-defeating. Resoluteness *is* the rational strategy for maximizing global outcomes when facing dynamic inconsistency. The strongest anti-resoluteness argument (**Hammond, McClennen's critics**) says *no*: Rationality is strictly local maximization. Binding the future self violates the sovereignty of the present self. Resoluteness confuses a *pragmatic trick* (precommitment) with a *rationality requirement*.
  *   **For Your Concrete Choices:** The optimal approach likely involves **strategic resoluteness**, not a blanket policy. Cultivate resolute dispositions *selectively* where:
      *   **Commitment is Key:** The outcome crucially depends on credible precommitment (e.g., major donations where orgs need predictability, reputation-dependent deals).
      *   **Self-Control is the Bottleneck:** You know your future self will predictably undermine a deeply held *current* goal (e.g., savings automation, addiction avoidance policies).
      *   **Values are Stable:** The pledge/policy reflects core, enduring values unlikely to shift fundamentally.
      *   **Cost of Deviation is High:** Breaking the commitment would have severe reputational, psychological, or practical costs.
      *   **Flexibility is Built-In:** Use mechanisms that allow renegotiation *only* under extreme, predefined circumstances (e.g., "renegotiate only if income drops below X or evidence shows cause Y is harmful").

  **Recommendation for Your Reading Group:** Move beyond "is resoluteness rational?" to "**When is cultivating resoluteness instrumentally rational for achieving better overall outcomes, given the predictable failures of reoptimization?**" Focus on the *consequences* of each strategy in specific scenarios like Parfit's Hitchhiker, investment cases, and your donation/negotiation examples. Acknowledge that both sophisticated reoptimization and resolute commitment have costs and benefits, and the "rational" choice depends heavily on the nature of the preference inconsistency, the importance of commitment, the potential for preference change, and the agent's specific goals. The deflationary view reminds us that perfect, unexploitable coherence might be neither achievable nor desirable for complex, evolving human agents. The key is managing exploitability and inconsistency wisely.
