  6. **Nihilism (Van Inwagen)**: Only simples (particles) exist. There are no composite objects like statues or lumps. So the problem doesn't arise.

  7. **Universalism (Lewis)**: Any arbitrary collection of particles composes an object. So there are two coincident objects: the statue and the lump. But then we must explain their difference (grounding problem).

