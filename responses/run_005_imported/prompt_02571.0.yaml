answer: |-
  You've nailed the core issue. The accuracy-dominance argument (like Joyce's) relies crucially on **strict propriety** to deliver the full force of its conclusion – that *only* probabilistic credences avoid accuracy-domination. Here's the intuition for why merely proper rules (with potential ties) break the argument:

  ### The Core Goal of the Dominance Argument
  1.  **Target:** Show that if your credences violate the probability axioms (e.g., are incoherent like P(A) + P(¬A) ≠ 1), then you are **accuracy-dominated**.
  2.  **What "Accuracy-Dominated" Means:** There exists some *other* coherent set of credences (Q) such that, *in every possible world*:
      *   Q is at least as accurate as your incoherent credences (P).
      *   Q is strictly more accurate than P in *at least one possible world*.

  ### How Propriety Helps (The Basic Idea)
  The proof constructs the dominating credences Q using the *true probabilities conditional on the algebra* defined by the truth values in each world. Propriety (minimizing expected score at true probabilities) is used to guarantee that *if* P is incoherent, *then* shifting to the coherent Q (which represents the true conditional probabilities in the relevant partition) will never make accuracy worse in expectation (given the truth).

  ### Why Strict Propriety is Essential (The Tie-Breaker)
  The critical step where mere propriety fails is in guaranteeing the **strict improvement** in at least one world.

  1.  **Scenario:** Imagine your incoherent credences P assign a value `q` to some event A.
  2.  **The Coherent Alternative Q:** The proof constructs a coherent alternative Q. Crucially, for the event A, Q will assign the *true probability* `p` implied by the coherence constraints and the world's structure (e.g., the indicator value for A in that world, or a conditional probability based on the partition).
  3.  **The Accuracy Comparison (Per World):** We need to compare the score of P (reporting `q` for A) and Q (reporting `p` for A) *in the actual state of the world* (e.g., did A happen or not?).
  4.  **The Problem with Mere Propriety:**
      *   Mere propriety tells us that *if the true probability is `p`*, then reporting `p` minimizes *expected* score. **But it might not be the *unique* minimizer.**
      *   There might be other values `q` ≠ `p` that *also* achieve the same minimal expected score when the truth is `p`.
      *   **Consequence:** In a world where the truth for A is `p` (e.g., A happens, so `p=1`), the *actual* score for reporting `q` (S(`q`, 1)) might be **exactly equal** to the score for reporting `p` (S(`p`, 1)), even though `q` ≠ `p` and `p` is the true probability!
      *   **Result:** In this world, shifting from P (`q`) to Q (`p`) did *not* yield a strict improvement. It was equally accurate.

  ### Why This Breaks the Argument
  *   The dominance argument requires that Q is **strictly better** than P in *at least one possible world*.
  *   If the scoring rule has flat spots (ties for the minimum expected score), the incoherent P might assign `q` ≠ `p` for some event A, and yet, in the world where the truth is `p` (which *is* one of the possible worlds!), the actual score S(`q`, truth) might be *equal* to S(`p`, truth).
  *   **Therefore, Q does not strictly dominate P in that world.**
  *   If this happens consistently across the construction, you **cannot guarantee** that Q strictly dominates P *anywhere*. The incoherent P escapes the dominance argument unscathed.

  ### Concrete Coin Flip Example
  Suppose we have a **proper but not strictly proper** scoring rule for a binary event (Heads/Tails). Let's invent a simple one (though real ones are more complex):

  *   **True Probability:** P(Heads) = 0.5 (Fair coin)
  *   **Mere Propriety:** Reporting `p=0.5` minimizes expected score.
  *   **Flat Spot:** Reporting *any* `q` between 0.4 and 0.6 *also* gives the *same* minimal expected score. (The expected score function is flat between 0.4 and 0.6 when truth=0.5).
  *   **Incoherent Agent:** Reports P(Heads) = 0.6, P(Tails) = 0.6. (Violates P(Heads) + P(Tails) = 1).
  *   **Dominating Alternative Q:** The coherent alternative must assign Q(Heads) + Q(Tails) = 1. The proof construction would likely set Q(Heads) = 1.0 if Heads is true, or Q(Heads)=0.0 if Tails is true (or something equivalent).
  *   **Accuracy Comparison in Heads World:**
      *   P reports `0.6` for Heads (truth=1).
      *   Q reports `1.0` for Heads (truth=1).
      *   **Crucially:** Because of the flat spot, S(`0.6`, 1) **=** S(`1.0`, 1) for our scoring rule.
  *   **Result:** In the Heads world, shifting from P (`0.6`) to Q (`1.0`) provided **no accuracy gain**. It was a tie.
  *   **Argument Failure:** We needed Q to be strictly better than P in *at least one world* (like this Heads world) to prove domination. The tie prevents this. The incoherent agent P is **not accuracy-dominated** by the coherent Q under this scoring rule.

  ### Key Takeaway
  Strict propriety guarantees that **reporting anything other than the true probability `p` is *strictly suboptimal* in expectation.** This translates directly to guaranteeing that in the world where the truth is `p`, reporting `q` ≠ `p` yields a **strictly worse score** than reporting `p`. This strict inequality in the relevant worlds is the essential fuel that drives the "strictly better in at least one world" requirement of the dominance argument.

  Mere propriety only guarantees that reporting `p` is *as good as* any other minimizer `q`, not strictly better. This allows incoherent agents using `q` ≠ `p` to "hide" in the flat spots of the scoring rule, achieving the same accuracy as the coherent agents in the critical worlds where the dominance argument needs them to be strictly worse. Without strict propriety, the dominance argument cannot rule out all forms of probabilistically incoherent credences.
