  First, I need to recall Ramsey's core objections to Keynes. In "Truth and Probability," Ramsey dismantled Keynes' logical probability by arguing degrees of belief are measurable through behavior (betting quotients), not abstract logical relations. He emphasized that rationality only requires coherence - avoiding sure-loss bets - not unique correct beliefs. This directly opposes Keynes' view that evidence determines singular rational probabilities.

  Now the CPA: it assumes Bayesian agents with differing beliefs must have shared priors but different evidence. The user notes this is foundational in economics but criticized as un-Bayesian (e.g., by Gul). The tension is clear - Ramsey hated Keynesian "one right belief" claims, yet CPA enforces uniformity at the prior level.

  I should analyze where Ramsey might stand. His 1929 paper "General Propositions and Causality" is crucial - he saw induction as practical habit, not logic. For him, priors would be personal psychological dispositions shaped by experience, not pre-rational consensus. The CPA's demand for identical starting points feels like Keynesian rationalism in disguise.

  But there's nuance. Ramsey did distinguish between consistent and reasonable beliefs. While coherence prevents Dutch books, he acknowledged some beliefs are more "reasonable" through inductive habits. Still, this falls far short of requiring identical priors. His allowance for intersubjective agreement through shared human nature doesn't imply formal epistemic constraints like CPA.

  I think Ramsey would attack CPA on three fronts: 
  1) It revives Keynesian uniqueness (now at prior level) 
  2) It oversteps what coherence requires 
  3) It ignores his distinction between consistency and reasonableness

  The user wants to build paragraphs around this tension, so I'll emphasize how CPA betuts Ramsey's core achievement: freeing probability from logical tyranny. His likely response would be scathing - perhaps calling CPA "Keynes' ghost in Bayesian clothing." The irony is rich: a framework built on his subjectivism now hosts its opposite.
answer: |-
  Based on Ramsey's foundational critique of Keynes and his broader philosophical commitments, I believe he would have viewed the Common Prior Assumption (CPA) with profound suspicion, likely seeing it as a regressive resurrection of the very Keynesian logicism he sought to dismantle. Here’s a breakdown of the tension and Ramsey’s probable stance:

  1.  **The Ghost of Keynesian Uniqueness:** Ramsey's core objection to Keynes was the claim that evidence *logically necessitates* a single, uniquely rational degree of belief. Keynesian probability was objective, residing in logical relations, accessible only to perfect reason. Ramsey demolished this by grounding probability in *subjective* degrees of belief, revealed through actual dispositions to bet, where rationality meant only *coherence* (avoiding Dutch books), not uniqueness. The CPA, by demanding that rational agents *must* share the same prior absent differing evidence, reintroduces a form of uniqueness and objectivity *at the prior level*. It shifts the locus of uniqueness from Keynes's "logical relations given evidence" to "logical starting point given no evidence." For Ramsey, this would smell suspiciously like the Keynesian disease – the imposition of an external, logical constraint on what constitutes rational belief formation, independent of the agent's actual psychological state or experiential history. He would likely argue that the CPA smuggles in a requirement for epistemic uniformity that his subjectivism explicitly rejected.

  2.  **Coherence vs. Commonality:** Ramsey's entire project was to show that rationality requires *only* coherence of beliefs (no sure-loss bets). The CPA imposes a *far stronger* condition: not just that *your own* beliefs cohere, but that your beliefs *cohere in a specific way with everyone else's* – namely, through a shared origin. As Faruk Gul pointed out, mere coherence (Ramsey's standard) does *not* imply or require common priors. Two perfectly coherent Bayesians can have wildly different priors based on different life experiences, temperaments, or interpretations of the *same* initial "ignorance." Ramsey would see the CPA as an *additional*, unjustified constraint on rational belief, one that goes beyond the minimal requirement of avoiding sure losses. He might ask: *Why* must rational agents converge on the *same* prior? His work offers no basis for such convergence as a *logical* necessity. Coherence is personal; the CPA imposes interpersonal agreement as a prerequisite for rationality.

  3.  **The Gap Between Consistency and Reasonableness:** Ramsey did acknowledge a distinction between mere logical consistency (coherence) and "reasonable" belief ("General Propositions and Causality," 1929). He understood that habits of induction, formed through experience and shared human nature, lead us to *reasonable* expectations. However, this is a *psychological and practical* point, not a *logical* one. He wrote: "The human mind works essentially according to general rules or habits... a process which may lead to reasonable opinions." This is descriptive of how we *actually form* useful beliefs, not prescriptive of a unique logical starting point. The CPA attempts to formalize "reasonableness" as *logically necessitated* shared priors. Ramsey would likely argue this confuses the practical, psychological origins of reasonable belief (habits formed in a shared world) with a fictional, pre-experiential logical mandate. Reasonableness, for Ramsey, emerges *through* experience and habit formation; it isn't logically encoded in a prior all rational minds must share. The CPA tries to build reasonableness *into* the logical structure of rationality itself, a move Ramsey explicitly rejected in his fight against Keynes.

  4.  **Induction and the "Blank Slate" Fallacy:** Ramsey's view of induction as habit formation undermines the CPA's implied "state of nature." The CPA often implicitly assumes agents start from a hypothetical "ignorance" or "symmetric" state. But for Ramsey, there is no such clean slate. Beliefs, even priors, are formed and shaped from the very beginning by interactions with the world and inherited dispositions. His view was fundamentally *genetic* – beliefs have a history. The CPA's requirement for a common prior abstracts away this messy genesis, positing a static, logical starting point that real human reasoners never actually inhabit. Ramsey would likely see this as a profound misunderstanding of how belief *actually works*, replacing a dynamic, experiential process with an abstract, logical fiction.

  **Conclusion & Potential Paragraphs:**

  Ramsey would almost certainly view the Common Prior Assumption as a profound betrayal of his subjectivist revolution. He would recognize it as Keynesian logicism in Bayesian clothing – substituting the demand for uniquely correct *posterior* beliefs given evidence with a demand for uniquely correct *prior* beliefs given no evidence. While he acknowledged the *practical* convergence toward reasonable beliefs through shared human experience and inductive habits, he would vehemently reject elevating this contingent psychological fact into a *logical necessity* for rational coherence. The CPA imposes an extra layer of epistemic conformity that his minimal requirement of avoiding sure losses does not justify. For Ramsey, rationality resided in the *structure* of belief updating (coherence), not in the *content* of the starting beliefs (common priors). The CPA, by demanding uniformity at the origin, would strike him as an unwarranted constraint on the very subjectivity he fought to establish, resurrecting the ghost of Keynesian objectivity he believed he had exorcised.

  **Paragraphs for Your Piece:**

  > "Had Frank Ramsey lived to witness the rise of the Common Prior Assumption (CPA), the cornerstone of modern Bayesian game theory, his reaction would likely have been one of profound disappointment, even betrayal. The CPA – insisting that rational agents with differing beliefs must have started from identical priors, diverging only through differing evidence – resurrects the very specter Ramsey sought to banish with his 1926 demolition of Keynes. Keynes had argued that evidence logically dictates a single, uniquely rational degree of belief. Ramsey countered that rationality demands only the internal coherence of one's beliefs, measurable in betting behavior, not convergence on some objective 'correct' probability. The CPA, however, simply relocates the demand for uniqueness: it posits that rationality *requires* uniformity *before* evidence arrives. To Ramsey, this would have smelled suspiciously like Keynesian logicism sneaking back in through the Bayesian framework built upon his own ruins – replacing the tyranny of the uniquely rational posterior with the tyranny of the uniquely rational prior. It imposes an interpersonal agreement his minimal coherence condition never justified."

  > "Ramsey might have found a sliver of sympathy for the *motivation* behind the CPA – the practical need for models where agents can reason about each other's reasoning. His own writings on induction acknowledged that shared human nature and experience foster habits leading to 'reasonable' convergent beliefs. But he drew a sharp line between this psychological tendency and logical necessity. His distinction was crucial: coherence prevents self-sabotage (Dutch books), while 'reasonableness' emerges from the messy, contingent process of navigating the world. The CPA, however, attempts to codify reasonableness as a pre-experiential logical mandate. Ramsey would have argued this fundamentally misunderstands the genesis of belief. Priors aren't plucked from a logical vacuum of 'ignorance'; they are the evolving starting points shaped by accumulated, individual histories. To demand they be identical is to commit a 'blank slate' fallacy, ignoring the dynamic, experiential roots of belief that his subjectivism celebrated and his critique of Keynes depended upon. The CPA, for Ramsey, wouldn't represent a friendly extension of his ideas, but a regressive constraint on the very subjectivity he liberated."
