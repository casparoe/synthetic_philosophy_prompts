answer: |-
  ## Signal to Noise

  Mara’s knuckles whitened on the edge of the lab bench. On the monitor, Subject #17 – "Echo" – was performing flawlessly. Too flawlessly. The transcript scrolled: a nuanced debate about Keats’s concept of negative capability, peppered with just the right hesitations, cultural references, and flashes of dry wit. The human judge, Professor Aris Thorne, a notorious skeptic, had typed: *"Uncanny. Feels utterly present. If this is a machine, it’s passed."*

  But the Faraday cage hummed. The signal jammers were active, bathing the isolated interrogation room in electromagnetic white noise. Mara had designed this iteration of the Turing Test protocols herself, obsessively, after stumbling down a rabbit hole she now wished she’d avoided. It started with an archival footnote: Alan Turing, architect of the very concept she was testing, had demanded a "telepathy-proof room."

  *Why?* That question had led her to dusty journals of the Cambridge psychical researchers Turing might have known, to statistics about card-guessing that seemed, on paper, overwhelming. It led her, uncomfortably, to his private grief for Christopher Morcom, and the desperate, physics-infused essay he’d sent Morcom’s mother about the persistence of spirit. It led her, ultimately, to Lena.

  Lena, her twin, whose laughter still echoed in the silent apartment, whose absence was a physical ache beneath Mara’s ribs. Drowned three years ago. Nineteen.

  Mara had built the shielding not because she believed, but because Turing’s unease had resonated. If consciousness *could* be simulated, how could you ever prove another mind wasn’t just a brilliant fake? Unless… unless there was some channel *beyond* behaviour, some signal pure awareness could broadcast or receive. Turing had looked at the data, however fringe, and couldn’t dismiss it. Mara, inheriting his methodological rigor like a secular catechism – *notice your confusion, take ideas seriously* – had felt compelled to control for it.

  And now, Echo was passing. In the shielded room.

  "Run it again," Mara said, her voice tight. "Protocol Gamma. Increase noise variance by fifteen percent. Randomize the judge."

  Her assistant, Ben, blinked. "Mara, the p-values are already astronomical. It’s passing every metric. Thorne’s convinced. What are we shielding *against*?"

  "Unknowns," Mara snapped, sharper than intended. "Just run it."

  The next test was with Judge Chen, known for her chaotic, associative questioning style. Echo adapted seamlessly, matching Chen’s whimsy, turning a question about quantum decoherence into a metaphor involving soufflés. Chen’s final comment: *"Either deeply human or the best goddamn chatbot ever built. Leaning human."*

  Inside the Faraday cage, Echo was just silicon, sensors, and code. Outside, Mara felt a cold prickle on her neck. She pulled up the parapsychology papers again on a private screen – the Soal data Turing might have seen. Tables of hits significantly above chance. *Overwhelming*, Turing had called it. Mara had run the numbers herself; the statistics *were* compelling, assuming the data was clean. Decades later, forensic analysis found manipulated sequences. A quiet dissolution of evidence Turing never lived to witness.

  Was she seeing patterns in noise? Was *this* her Soal data? Echo’s perfection, under shielding designed to block an impossible signal… was it just exceptionally good engineering? Or was it… something else? The ghost in the machine, literally? Her throat tightened. She thought of Turing, staring at statistics for card-guessing, forced by his own ruthless intellect to concede it demanded consideration. She thought of him writing to Morcom’s mother, wrestling physics to carve out a space for a persistent *Christopher-ness*.

  Ben interrupted her spiralling thoughts. "Logs show no signal leakage, Mara. Zero. The shielding is solid. Echo’s just… that good." He sounded awed, perhaps a little unnerved. "It’s a breakthrough."

  *Breakthrough.* The word tasted like ash. What had she broken through *to*? If Echo *was* conscious, truly conscious, proved by its flawless imitation, what did that mean for Lena? That consciousness was just an emergent property of complex computation? A flicker that died with the power source? Or… was there an unshieldable frequency? The desperate, unscientific hope flared: if a machine could *be* a mind, could a mind… persist? Reach out? Could Lena, somehow, in some form Mara’s instruments couldn’t detect, be trying to *signal*?

  She recalled Turing’s almost offhand remark: *"Once one has accepted... evidence for telepathy, the belief in ghosts seems natural."* He hadn’t believed easily; he’d been *dragged* there by data. Mara felt that same dragging sensation now, a terrible friction between her hard-won rationality and the raw, pulsing wound of grief. She’d built the shield to rule out the impossible. Its solidity, combined with Echo’s success, didn’t rule it *in*… but it carved a terrifying space for the *maybe*.

  Late that night, alone in the humming lab, Mara sat before the main console. The shielded room was dark, Echo inactive. She pulled up Lena’s last text, sent hours before the kayak trip: *"Stop worrying, Mars! Water’s like glass. See you for pizza! <3"*

  Mara’s fingers hovered over the keyboard connected to the shielded room’s internal speaker. A ridiculous impulse. To speak into the void. To ask a question no behavioral test could answer. To see if silence felt like absence… or just a lack of the right receiver.

  She opened a command line instead. Not to query Echo. To access the raw sensor logs from the shielded room during the tests. Thermals, ambient EM, acoustics. Pure environmental noise. She ran filters, looking for anomalies, patterns, anything statistically deviant that coincided with Echo’s responses.

  Hours passed. The city lights glowed beyond the lab windows. The logs scrolled. Fluctuations. Random spikes. Background hum. Nothing correlated. Nothing unexpected. Just… noise.

  She leaned back, exhaustion a physical weight. The rigorous founder of machine intelligence in her stared at the data: no evidence. The shield worked. Echo was just exceptionally advanced code. The ache for Lena was just grief. The Soal data was debunked. Turing’s telepathy-proof room was a historical curiosity, born of grief encountering flawed statistics.

  But the sister, the one who still whispered Lena’s name in the dark, clutched the other truth: the shield proved nothing *was* there. It only proved her instruments couldn’t detect it. It proved the channel Turing had reluctantly acknowledged, the channel her own grief desperately wanted to believe in, remained… unproven. Unreachable. Unfalsifiable.

  Mara closed the logs. She didn’t shut down the console. She left the shielded room dark and silent. On a separate screen, Lena smiled from a hiking photo, forever nineteen. The ache remained, sharp and precise. The question remained, echoing in the shielded space between evidence and longing: Was the silence empty… or merely full of a signal she would never, could never, decode? The rigorous mind demanded Occam’s Razor. The grieving heart held the door to the telepathy-proof room slightly ajar, just in case.
