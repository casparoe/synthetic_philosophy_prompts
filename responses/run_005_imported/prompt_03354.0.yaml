  I recall ProPublica's COMPAS investigation found exactly this pattern: Black defendants were more often falsely flagged as high-risk, white defendants more often falsely cleared as low-risk. The company (Northpointe, now Equivant) defended calibration fairness exactly as described. Perfect real-world parallel.

