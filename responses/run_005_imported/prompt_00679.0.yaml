answer: |-
  Here's a rigorous analysis of why Joyce's accuracy-dominance argument for probabilism fails due to rule-relativity, even under strict propriety, along with engagement and evaluation of the strongest possible defense.

  ### Core Problem: Residual Rule-Relativity Despite Strict Propriety
  Joyce's (2009) refinement requires accuracy measures to be **strictly proper**:
  - A scoring rule \(S(c, \omega)\) is strictly proper if for any coherent credence function \(c\), the expected score \(E_{c}[S(c, \omega)]\) is minimized uniquely at \(c\) (i.e., your own credence is the unique best estimate of accuracy by your own lights).

  **Why strict propriety doesn't fix rule-relativity:**
  1. **Non-Uniqueness of Dominators**:  
     For a given incoherent credence function \(b\), different strictly proper scoring rules can designate *different* coherent credence functions \(c_1, c_2, \ldots\) as dominating \(b\). Crucially:
     - Under rule \(S_1\), \(c_1\) dominates \(b\) (i.e., \(S_1(c_1, \omega) < S_1(b, \omega)\) for all \(\omega\)).
     - Under rule \(S_2\), \(c_2\) dominates \(b\), but \(c_1\) may *not* dominate \(b\) under \(S_2\).
     - Worse: Some strictly proper rules may have *no dominator* for \(b\) (as in Bronfman's unpublished result).

  2. **Concrete Example** (Adapted from Pettigrew/Bronfman):  
     Consider a universe with 2 mutually exclusive propositions \(A, B\), and an agent with incoherent credences:  
     \(b(A) = 0.6\), \(b(B) = 0.6\) (violating \(P(A \cup B) \leq 1\)).  
     Compare two strictly proper scoring rules:
     - **Brier Score**: \(S_B(c, \omega) = (c(A) - \mathbf{1}_\omega(A))^2 + (c(B) - \mathbf{1}_\omega(B))^2\)  
       *Dominator*: Coherent credence \(c_1(A) = 0.5, c_1(B) = 0.5\) dominates \(b\).
     - **Logarithmic Score**: \(S_L(c, \omega) = -\ln(c(A)) \cdot \mathbf{1}_\omega(A) -\ln(c(B)) \cdot \mathbf{1}_\omega(B)\)  
       *Dominator*: Coherent credence \(c_2(A) = 1.0, c_2(B) = 0.0\) dominates \(b\) (but \(c_1\) does *not* dominate \(b\) under \(S_L\)).

     Here, \(b\) is accuracy-dominated, but by *different coherent credences* under different proper rules. No single coherent alternative dominates \(b\) universally across all proper measures.

  3. **Philosophical Implication**:  
     To claim \(b\) is irrational because *some* coherent \(c\) dominates it *relative to a chosen \(S\)*, presupposes that \(S\) is the "correct" measure of accuracy. But Joyce provides no non-circular justification for privileging one strictly proper rule over others. Rationality becomes contingent on an arbitrary choice of scoring rule.

  ---

  ### Strongest Defense for Accuracy-First Epistemology
  The most robust reply (e.g., from Pettigrew or Leitgeb) is the **"Universal Domination" maneuver**:

  #### The Argument:
  1. **For any incoherent \(b\), and for every strictly proper \(S\), there exists some coherent \(c_S\) that dominates \(b\) under \(S\)** (Joyce's 2009 result).  
  2. **Dominance entails irrationality**: If for *every legitimate way to measure accuracy* (i.e., every strictly proper \(S\)), there is *some* coherent alternative \(c_S\) better than \(b\) in all worlds, then \(b\) is irrational.  
  3. **No rule-relativity problem**: It doesn't matter that \(c_S\) depends on \(S\). The key is that *no matter which proper rule you use*, incoherent \(b\) is always strictly dominated. Coherent credences escape this universal scrutiny.

  #### Why this seems compelling:
  - It reframes the issue: Rule-relativity doesn't undermine domination; it highlights that incoherent credences are *universally* dominated across all proper measures, while coherent ones are immune.
  - Analogizes to multi-criteria decision theory: If an option is dominated under every reasonable criterion, it’s irrational, even if the dominating alternative varies by criterion.

  ---

  ### Why This Defense Fails to Rescue the Argument

  1. **The Quantifier Swap Fallacy**:  
     The defense relies on swapping quantifiers:  
     - **What Joyce proves**: \(\forall S \, \exists c_S \, \text{such that} \, c_S \text{ dominates } b \text{ under } S\).  
       (For each rule, there exists a dominator for \(b\).)  
     - **What rationality requires**: \(\exists c \, \forall S \, \text{such that} \, c \text{ dominates } b \text{ under } S\).  
       (There exists a single \(c\) that dominates \(b\) under all rules.)  
     Joyce’s result **does not** guarantee the latter. Rationality demands a *single dominating alternative* \(c\) that is superior *no matter how accuracy is measured*. The defense only shows \(b\) is dominated *in every measure separately*, not by a *unified alternative*.

  2. **No Guidance for the Agent**:  
     Suppose an incoherent agent asks: *"Which coherent credence should I adopt to avoid domination?"*  
     - Under Brier, they should choose \(c_1\).  
     - Under Log, they should choose \(c_2\).  
     Since \(c_1\) and \(c_2\) are mutually incompatible (e.g., \(c_1(A)=0.5\) vs. \(c_2(A)=1.0\)), the agent has no rational way to choose between them. The accuracy-first program cannot resolve this dilemma without privileging a specific \(S\).

  3. **Bronfman-Style Cases Undermine Universality**:  
     Bronfman (via Pettigrew) shows that for some incoherent \(b\), certain strictly proper rules may **lack any dominator at all**. While Joyce’s proof guarantees a dominator exists for *each* \(S\), it is silent on whether *every* \(S\) must have one for a *given* \(b\). If even one proper rule lacks a dominator for \(b\), the "universal domination" claim collapses.

  4. **The Self-Defeat Problem**:  
     Accuracy-first epistemology aims to justify coherence *without* presupposing probabilistic norms. But strict propriety itself is defined probabilistically (it requires minimization *w.r.t. expected utility*). This circularity means the argument assumes probabilistic rationality to prove it.

  ---

  ### Conclusion: The Argument Remains Unrescued
  While the "universal domination" defense is the strongest available, it fails because:
  - **It commits a quantifier fallacy** by conflating "dominated under every rule" with "dominated by a single alternative across all rules."
  - **It cannot guide agents** toward a unique rational alternative to incoherence.
  - **Potential counterexamples** (like Bronfman’s) threaten the universality claim.
  - **The circularity** in defining propriety undermines its foundational role.

  **Implication for rationality**: Joyce's argument shows incoherent credences are *pragmatically inadvisable* under any *specific* proper scoring rule but fails to establish that they are *inherently irrational*. Rationality requires a **context-independent** dominance relation, which rule-relativity prevents. Until accuracy-firsters can non-arbitrarily justify a *unique* proper scoring rule (or prove all proper rules agree on dominators), the argument does not compel probabilism as a norm of pure rationality. This aligns with Maher’s original critique: scoring rules are tools for specific goals, not arbiter
