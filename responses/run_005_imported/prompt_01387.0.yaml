prompt: |-
  I teach a philosophy of economics seminar, and the last two sessions were on interpersonal utility comparisons — starting with Robbins basically declaring them meaningless value judgments that have no place in scientific economics, then Harsanyi's aggregation theorem, which supposedly derives a weighted-utilitarian social welfare function without needing interpersonal comparisons at all, and then Sen (and Broome, and Weymark) pushing back that the weights in Harsanyi's result are arbitrary and can't actually be pinned down unless you sneak comparability back in through the side door. We also got into Arrow's later "extended sympathy" move from the second edition of Social Choice and Individual Values, where instead of comparing utility levels directly you rank things like "being me in my situation" against "being you in yours." It's great fun to teach in the abstract, but I honestly never thought I'd need any of it for actual departmental buisness, until this week.

  Here's the situation: our department has exactly one semester of paid research leave to hand out this year, and rather than let the chair just pick, the personnel commitee sent round a form asking each of the five eligible faculty to self-rate, on a scale of 0 to 100, "how much would this leave benefit your research." Whoever comes out on top gets the leave. About half the department thinks this is a perfectly sensible Benthamite solution, and the other half (me included) has a nagging sense that we're maxing over numbers that were never comparable in the first place, though I'm struggling to turn that hunch into an actual argument for the next meeting. Could you spell out the most important implications of the interpersonal utility comparisons debate for whether a procedure like ours can be defended at all? I'd like you to actually engage with the specific technical positions here (Robbins's skepticism, the Harsanyi/Sen/Weymark dispute, extended sympathy, maybe even how applied welfare economists try to sidestep the whole mess with money-metric or willingness-to-pay measures) rather than just telling me that comparing utility across people is hard, because that much I already knew going in.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a philosophy of economics seminar and recently covered interpersonal utility comparisons. Now, their department is using a self-rating system for allocating research leave, and they're divided on whether this method is valid. The user is in the skeptical half and needs to articulate why this approach might be flawed, drawing from the theories they've taught.

  First, I need to recall the key arguments from the seminar. Robbins dismissed interpersonal comparisons as unscientific. Harsanyi's theorem tries to derive a social welfare function without such comparisons, but Sen and others argue the weights are arbitrary. Arrow's extended sympathy approach offers an alternative but has its own issues. The user wants these technical points applied to their department's situation.

  The core problem here is the self-rating on a 0-100 scale. Each faculty member assigns a number representing the benefit to their research. The department assumes these numbers are comparable and additive, which is a utilitarian approach. But Robbins would challenge the comparability. Even if individuals understand their own scales, without a common metric, aggregating them is meaningless. 

  Harsanyi's aggregation theorem might be cited by the other side as justification. They could argue that the self-ratings reflect vNM utilities under uncertainty. But applying this to the department's method requires imagining a veil of ignorance where faculty don't know their identities. Since the ratings are done from their actual positions, not behind a veil, Harsanyi's conditions aren't met. The weights for aggregation aren't derived impartially, so the result is arbitrary.

  Sen and Weymark's critiques are crucial here. They point out that Harsanyi's weights depend on the normalization of individual utility functions. In this case, each person chooses their own scale (0-100), so one person's 100 could equal another's 50. Without a normalization convention, the sum doesn't make sense. The department's method implicitly assumes cardinal unit comparability, but the self-rating doesn't enforce any interpersonal standard.

  Arrow's extended sympathy approach could be an alternative. Instead of direct utility comparisons, faculty would rank scenarios like "being me with leave" vs. "being you with leave." This avoids direct utility comparison but requires a complex ranking that might not be feasible. The user might suggest this, but it's probably too late to implement.

  Applied welfare economics uses money-metric measures like willingness-to-pay. But in this academic context, compensating variations aren't practical. The leave isn't a market good, and faculty might not have the means to pay, leading to wealth bias. Plus, it shifts focus from research benefit to financial sacrifice, which isn't the goal.

  The user needs concrete arguments for their meeting. They should highlight the normalization problem (Sen/Weymark), the misuse of Harsanyi's theorem without a veil of ignorance, and Robbins' point about unscientific value judgments. Suggesting alternatives like extended sympathy or committee deliberation based on research statements could strengthen their position. Emphasizing that self-ratings without a common scale are meaningless cardinal numbers might resonate with colleagues.
answer: |-
  Here's a breakdown of how the core technical arguments from the interpersonal utility comparisons (IUC) debate directly undermine the legitimacy of your department's procedure, moving beyond "it's hard" to "it's conceptually incoherent under standard economic frameworks":

  1.  **Robbins' Positivist Guillotine & The Self-Rating Scale:**
      *   **The Core Skepticism:** Robbins argued that statements like "Faculty A's utility gain from leave is greater than Faculty B's" are *not* empirical, scientific propositions. They are normative *value judgments* disguised as facts. We lack any objective instrument to measure and compare the intensity of inner states across different minds.
      *   **Applied to Your Procedure:** When faculty assign a number (0-100) to "how much would this leave benefit your research," they are *not* reporting an objectively measurable quantity akin to height or temperature. They are making a *value-laden self-assessment*. The scale itself is fundamentally ambiguous:
          *   Is 100 "The absolute maximum benefit conceivable for any human research project"? (Implausible and unknowable).
          *   Or is 100 "The maximum benefit *I personally* can imagine for *my own* research"? (Highly subjective and incommensurable across individuals).
      *   **The Fatal Flaw:** The procedure *assumes* that a "75" from Prof. X means the *same thing* as a "75" from Prof. Y in terms of intensity of benefit or social welfare contribution. Robbins insists this assumption is meaningless. Aggregating these numbers is like adding apples to oranges to pears and declaring the result is "fruitiness 250." The sum is a numerical artifact devoid of the welfare significance the procedure attributes to it.

  2.  **Harsanyi's Aggregation Theorem & The Mirage of Objectivity:**
      *   **The Promise:** Harsanyi appeared to rescue utilitarianism *without* IUC. Under uncertainty (a "veil of ignorance"), if individuals have vNM rational preferences over social states, and an impartial observer (or social planner) also has vNM preferences over those same states, then social welfare *must* be a weighted sum of individual utilities.
      *   **Applied to Your Procedure (The Optimistic View):** Proponents might argue: "We're simulating the veil! Faculty are reporting their vNM utilities for getting leave vs. not, under uncertainty about who will get it. Summing these gives the impartial social welfare function!"
      *   **Sen/Weymark/Broome's Devastating Critique:**
          *   **The Arbitrary Weights Problem:** Harsanyi's theorem shows SWF = Σ *a_i* * U_i. Crucially, the weights *a_i* depend entirely on *how individual utility functions are normalized*. If U_i represents Prof. X's preferences, and U_i* = 2*U_i represents the *same* preferences, the weight *a_i* for X in the SWF must halve to get the same social ordering. **The weights are not inherent properties of the individuals; they are chosen by the modeler when setting the utility scales.**
          *   **Applied to Your Procedure:** This is the fatal blow. Your faculty are *self-normalizing*. Prof. X chooses her own 0 and 100 anchors. Prof. Y chooses his. There is *no mechanism* to ensure their scales are comparable or that the implicit weights *a_i* are meaningful or fair. Is Prof. X's "100" scaled to represent the same *intensity* or *social contribution* as Prof. Y's "100"? The theorem provides *no answer*. Summing the raw scores implicitly assumes **Cardinal Unit Comparability (CUC)**, but the self-rating procedure provides *zero justification* for this strong assumption. The resulting "winner" is determined as much by who chose the most expansive scale for their own benefit as by any underlying "need" or "potential benefit."
          *   **The "Sneaking Comparability" Charge:** Sen argues that to give the weights *a_i* ethical significance (e.g., equality), you *must* reintroduce IUC. Harsanyi's weights are mathematically necessary for the aggregation *formula*, but ethically arbitrary without an *additional* normative judgment about the *relative importance* of different individuals' utility gains – which *is* an IUC. Your procedure implicitly sets *a_i = 1* for everyone, which is a specific (and highly contestable) normative choice disguised as neutrality.

  3.  **Arrow's Extended Sympathy: A Possible (But Flawed) Escape Hatch?**
      *   **The Idea:** Instead of comparing utilities ("How much does X gain?" vs. "How much does Y gain?"), compare extended alternatives: "How do I rank the prospect of *being X with leave* vs. *being Y with leave*?" This uses individual preferences over *composite states*.
      *   **Applied to Your Procedure (Hypothetically):** Instead of self-rating "my benefit," faculty would rank all options like: ["Me with leave", "Me without leave", "Prof. X with leave", "Prof. X without leave", "Prof. Y with leave", ...]. A social choice rule (like Borda count or pairwise voting) could then aggregate these rankings over the extended alternatives to choose the leave recipient.
      *   **Problems:**
          *   **Complexity & Cognitive Burden:** Ranking *n* faculty x 2 states = 2n alternatives is vastly more demanding than a self-rating, especially for n=5 (10 alternatives). Accuracy is doubtful.
          *   **Self-Interest vs. Impartiality:** Will faculty genuinely try to imagine being their colleagues, or just rank ["Me with leave"] > ["Anyone else with leave"] > ["Me without"] > ["Anyone else without"]? The procedure relies on impartiality the original self-rating avoids.
          *   **Aggregation Problem Remains:** Arrow's *Impossibility Theorem* applies directly to aggregating these extended preference orderings into a social order. No perfect aggregation method exists. While potentially avoiding *direct* IUC, it introduces significant practical and theoretical hurdles. It doesn't yield a clear "benefit score" like the current procedure craves.

  4.  **Applied Welfare Economics: The Willingness-to-Pay Sidestep (And Why It Fails Here):**
      *   **The Standard Dodge:** Applied economists often use monetary measures (e.g., Willingness-to-Pay - WTP, Compensating Variation - CV) as *proxies* for utility gains, arguing money provides a *common numeraire* enabling comparison. This implicitly assumes the marginal utility of money is constant across individuals (a strong IUC assumption!) or focuses on potential Pareto improvements.
      *   **Applied to Your Procedure (Hypothetically):** Instead of self-rating benefit, ask "What is the maximum amount of your salary you would be willing to forfeit to receive this leave?" The person with the highest WTP gets the leave (and pays nothing, creating a pure windfall). Or, use a Vickrey auction.
      *   **Why It's Unsuitable (and Revealing):**
          *   **Wealth Effects:** WTP is heavily influenced by current wealth/salary. A wealthy senior prof might state a higher WTP than a junior prof with equal "research benefit need," distorting the outcome. This violates the spirit of assessing *research benefit*.
          *   **Not a Market Good:** Research leave isn't a typical commodity. WTP reflects ability/willingness to pay, not pure "benefit to research." It conflates benefit with financial sacrifice capacity.
          *   **Reveals the Normative Core:** Resorting to WTP *abandons* the goal of maximizing aggregate *research benefit utility*. It substitutes maximizing aggregate *monetary sacrifice willingness*. This highlights that the department's current procedure *is* making a strong (and hidden) normative claim: that self-rated cardinal utility scores *are* comparable. The WTP alternative makes a *different* normative claim (money as a comparable proxy), which is also problematic but at least more explicit about its assumptions. It doesn't salvage the current method; it replaces it with something fundamentally different.

  **Conclusion & Argument for Your Meeting:**

  Your department's procedure is **indefensible** based on the technical critiques of IUC:

  1.  **Robbins' Challenge:** The self-rated 0-100 scores are not objective, comparable quantities; they are inherently subjective value judgments. Aggregating them assumes away the fundamental problem of interpersonal comparison.
  2.  **The Harsanyi/Sen/Weymark Trap:** The procedure implicitly relies on Cardinal Unit Comparability (CUC). However, because faculty self-normalize their scales, the weights in the implicit utilitarian sum are **arbitrary**. The outcome depends critically on how individuals anchor and scale their personal utility functions, *not* solely on any underlying "benefit." Sen's critique shows that Harsanyi's theorem *requires* an external normalization convention to have ethical meaning – a convention utterly absent in your self-rating system.
  3.  **The Failure of Alternatives:** Extended sympathy is impractical and runs into Arrow-type problems. Willingness-to-Pay abandons the core goal and introduces wealth bias.

  **A Better Path:** Acknowledge that IUC *is* necessary for this distributive decision, but it cannot be achieved scientifically through self-rating. Shift to a **deliberative** or **procedural** approach:
  *   **Committee Judgment:** Have the personnel committee (perhaps informed by research statements, past productivity, current project stage, teaching load, previous leave) make a recommendation based on *reasoned discussion* about likely research impact, acknowledging the inherent need for judgment.
  *   **Turn-taking/Rotation:** Prioritize fairness over impossible precision in measuring benefit.
  *   **Lottery:** Embrace radical uncertainty if benefits are deemed roughly equal.
  *   **Modified Extended Sympathy Lite:** Ask faculty to confidentially rank the *other four* candidates in terms of who they believe would benefit *the most* (not including themselves). Aggregate these rankings (e.g., Borda count). This focuses on observable *potential impact* rather than inner utility states.

  **Your Key Argument:** "This procedure mathematically aggregates numbers that lack interpersonal meaning. It disguises an arbitrary weighting of self-interest as an objective measure of social welfare. The technical literature demonstrates conclusively that self-rated cardinal utilities, without externally imposed and justified normalization, cannot be meaningfully compared or summed. We are mistaking a number for a scientific fact when it is, at best, an incommensurable expression of personal value. We need a method that acknowledges the necessity of judgment or focuses on fair procedure, not a pseudo-scientific summation of incomparable scales."
