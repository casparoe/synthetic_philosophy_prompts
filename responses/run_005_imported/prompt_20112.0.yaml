answer: |-
  The coffee urn hissed like a disappointed librarian. Dana Prentiss stirred powdered creamer into the thin, bitter liquid, the tiny plastic spoon clicking against the cheap ceramic. Marcus Cole leaned against the wall beside her, staring into his own untouched cup as if seeking answers in the oily surface.

  "Paul always hated funerals," Marcus finally said, the words hanging in the damp air of the community center hall. "Said they were morbid theatre."

  "He’d have hated this coffee more," Dana replied, a ghost of their old, easy banter flickering. "Remember his obsession with that single-origin roaster down on 4th?"

  A faint smile touched Marcus’s lips, then vanished. "Yeah. He’d be staging a protest right now." He took a reluctant sip, grimaced. "How’ve you been, Dana? Really?"

  "Busy. The Board... it’s relentless. Reviewing question banks, analyzing pass/fail distributions, refining the calibration metrics." She met his eyes, a challenge already forming. "It’s necessary work."

  "Is it?" The question was quiet, almost weary. "Necessary to tell millions they’re unfit to choose their own leaders?"

  Dana set her cup down with deliberate care. "Marcus, we’ve been over this. It’s not about *fitness* in some innate sense. It’s about *engagement*, about *competence*. Look at the data, really look. Before the Reckoning, what were we? Jason Brennan nailed it: a sea of hobbits, blissfully ignorant of policy, tuning out until the next emotional outrage. And hooligans, Marcus, cheering for their team, facts be damned, treating governance like a blood sport. Where were the Vulcans? The ones who could dispassionately weigh evidence, understand trade-offs, think beyond the next election cycle? They drowned in the noise."

  "So you build a moat," Marcus countered, his voice gaining an edge. "Only the Vulcans get in. Fine. Who designs the drawbridge? Who decides what makes a Vulcan? *You* do, Dana. You and the Board. On whose authority? The authority of the people you just excluded? That’s circular logic dressed up as empiricism."

  "It’s not arbitrary!" Dana leaned in, her intensity palpable. "The exam isn’t about ideology. It’s about demonstrable skills. Understanding statistical significance, interpreting primary source documents, parsing constitutional principles, grasping basic economics. Things essential for *informed* consent, which is the bedrock of any legitimate government. Mill saw it centuries ago – why should the vote of someone utterly disconnected carry the same weight as someone who understands the stakes? He advocated for plural voting based on competence! We’re just implementing what liberal theory flirted with but lacked the tools to realize."

  Marcus pushed off the wall. "Tools shaped by whom? Mill’s ‘competence’ was steeped in the prejudices of his class and time. Ours isn’t? You think your exam, demanding advanced civics and stats, doesn’t inherently favor the already-educated? The ones who had tutors, who went to schools like *we* did? Who speaks for the single mother working three jobs? Her lived experience navigating broken systems doesn’t count? Only her ability to calculate a standard deviation? You’ve just rebranded class privilege, Dana. You’ve laundered it through a Scantron sheet and called it meritocracy."

  Dana flinched, but held her ground. "We have aggressive outreach programs. Subsidized prep courses. Adaptive testing modules. We’re constantly auditing for bias—"

  "Auditing against *your* standard!" Marcus interrupted, his voice low but fierce. "The standard *you* set. The standard that says understanding the Federalist Papers is more politically relevant than understanding how the zoning board just screwed your neighborhood. Democracy isn't just about aggregating the 'best' decisions, Dana. It's about *belonging*. It's about the fundamental equality of voice, the dignity of having a say in your own fate, even if – *especially* if – the experts think you'd choose 'wrong'. You reduce citizenship to a test score, you sever that belonging. You create a permanent underclass of the disenfranchised, told they're too stupid to participate. That’s corrosive. That’s what my movement is made of – not hobbits or hooligans, but people told they don’t count."

  "And what’s the alternative?" Dana shot back, her own frustration rising. "Go back to the shouting match? To the demagogues preying on ignorance? To policy driven by viral misinformation and tribal loyalty? Look at the infrastructure bill the Board passed last month – evidence-based, long-term, funded sustainably. Do you honestly believe universal suffrage, drowning in the current media ecosystem, would have produced that? Or just another round of tax cuts and culture war theatrics?"

  "Maybe not," Marcus conceded, the admission sharp. "Maybe it would produce something messier. Something less *optimal* by your technocratic calculus. But it would be *theirs*. The people’s choice, for better or worse. That legitimacy matters. It holds the system together. Your way… it’s governance by guardian class. However well-intentioned, it’s a betrayal of the foundational promise."

  "The foundational promise was broken long before the Board," Dana said, her voice suddenly tired. "Broken by apathy, by manipulation, by a system buckling under the weight of its own contradictions. We’re trying to build something stable. Something that works."

  "By breaking it further," Marcus murmured. He looked down at his cold coffee, then back at her. The shared grief for Paul was still there, a raw undercurrent beneath the ideological chasm. "By telling Marcus Cole, his parents, his neighbors… that they are guests in their own country, not citizens. That their consent doesn’t matter, only their comprehension."

  Dana opened her mouth, perhaps to cite another study, another calibration metric, but stopped. She saw not the opponent, but the Marcus she’d known – brilliant, passionate, now etched with a profound, weary hurt. Her arguments felt suddenly abstract, brittle against the lived reality in his eyes.

  "Marcus..." she began, but the words dissolved.

  He offered a bleak, humorless smile. "Bad coffee, Dana. Paul deserved better." He placed his untouched cup on a nearby table. The gesture felt like a period. "Take care of yourself."

  He walked towards the exit, shoulders slightly hunched against the chill seeping in from the street. Dana watched him go, the plastic spoon in her hand forgotten. The intellectual scaffolding of the epistocracy felt momentarily insubstantial, its clean lines blurred by the messy, unresolved pain walking out the door. The coffee in her cup was cold, the silence in the hall suddenly vast. The argument had no winner, only the lingering ache of a shared past and a future irreparably split. She stared at the fogged window where Marcus had disappeared, the taste of ash and failure sharp on her tongue.
