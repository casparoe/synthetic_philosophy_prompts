  For Wright's etiological account: Student correctly captures the historical/selection-based essence ("whatever effect explains why that trait is still around"). Good job linking to ancestral selection. But they miss that Wright's original formulation was broader than just natural selection (e.g., could include learning). Not crucial here but worth noting.

  For Cummins' causal-role: Student gets the ahistorical/system-contribution core right. The "too liberal" point is accurate but could be sharper—Cummins intentionally avoids normative constraints, so "liberal" isn't necessarily a flaw. 

  Now the big issue: Swampman analysis. Student claims Cummins' account forces us to say Swampman's heart has "no function." That's flat wrong. Cummins only cares about current causal contributions—so as long as the heart pumps blood in the system, it absolutely has a function. The student inverted the implications! 

  Meanwhile, they're correct that etiological accounts (like Wright's) would deny Swampman's heart has a proper function due to lacking history. But the student understates how devastating this is for etiological views—it's a classic objection showing their counterintuitive consequences. 

  The professor will want to flag: 
  - Major error in Swampman/Cummins analysis (core misunderstanding) 
  - Minor omission in not noting etiological vulnerability 
  - Good grasp of basic theory distinctions 

  Rubric should deduct heavily for the Swampman/Cummins blunder since it's central to the prompt. Presentation is clear though, so credit for structure. 

  Final score: 7/10 feels right—solid foundation but critical flaw in application. Comments must explicitly correct the Cummins/Swampman mistake to prevent conceptual spread.
