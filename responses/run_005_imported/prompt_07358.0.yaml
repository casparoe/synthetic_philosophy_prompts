answer: |-
  ## The Kelly Delusion: Why Samuelson Was Right (And Why Growth Still Wins)

  The Kelly criterion, promising infinite wealth with probability one to those who maximize expected logarithmic wealth, exerts a seductive pull. Its advocates—from Kelly and Thorp to the modern "ergodicity economics" proponents—portray it not merely as *a* rational strategy, but as *the* rational strategy, objectively superior for any agent concerned with long-term growth. Paul Samuelson, armed with biting wit and rigorous economic theory, saw this as dangerous nonsense. **Samuelson was fundamentally correct: the claim that Kelly-optimality represents an objective, utility-agnostic pinnacle of rationality is a profound fallacy. However, the practical and psychological dominance of growth-rate optimization for mortal beings operating under uncertainty ensures Kelly remains supremely relevant, even if its "objective" status is illusory.**

  ### The Kelly Camp's Allure: Probability-1 Dominance
  The argument for Kelly's objective superiority rests on a powerful mathematical result: over an infinite series of independent, identical bets, the Kelly strategy will almost surely (with probability 1) generate more wealth than *any* other essentially different strategy. This isn't just outperforming on average; it's eventual, almost certain dominance. The conclusion drawn is stark: any strategy deviating from Kelly is irrational because it will, inevitably, be left behind. Log utility isn't a *preference* here; it's presented as the *revealed* optimal tool for achieving the universally desired goal of maximal long-run growth. Ergodicity economics reinforces this by framing wealth evolution as a single, non-ergodic time series, arguing that maximizing the expected growth rate is the only way to ensure favorable outcomes for the individual traversing this single path. The implication is clear: growth-rate maximization transcends subjective utility; it's a fundamental law of rational capital allocation.

  ### Samuelson's Devastating Critique: The Tyranny of Infinity
  Samuelson, Merton, and other critics dismantle this edifice by attacking its foundational pillars: infinity and utility agnosticism.

  1.  **The Infinity Mirage:** Humans are finite. Bankruptcies, deaths, shifting goals, and changing markets impose hard horizons. A strategy guaranteeing dominance *only* after an infinite sequence of bets is irrelevant to any real-world agent. Probability-1 dominance over infinity provides *zero* guarantee of outperformance over 1 year, 10 years, or even 100 years. A strategy with a tiny edge in the ultra-long-run might be catastrophically risky in the short or medium term, violating the risk preferences of virtually all non-log-utility agents. Kelly's "certain" victory exists only in a mathematical abstraction disconnected from lived experience.

  2.  **Utility is Sovereign:** Rationality is defined by maximizing *expected utility*, not expected wealth or its logarithm. Kelly's result only proves dominance *if your utility function is logarithmic*. For an agent with linear utility (risk-neutral), maximizing expected *wealth* is rational, leading them to bet their entire bankroll on positive expectation bets – a strategy Kelly vehemently avoids due to ruin risk. For an agent with exponential utility (constant absolute risk aversion), fractional Kelly betting is optimal. Samuelson's famous syllabic minimalism ("*If you must bet, bet less*") cut to the heart: different risk tolerances dictate different betting fractions. To claim Kelly is universally optimal is to falsely impose log utility on *all* agents, denying the fundamental subjectivity of risk preference.

  3.  **The Path Matters:** Kelly's probability-1 dominance hides the volatility of the journey. A full-Kelly strategy experiences gut-wrenching drawdowns. An agent with high aversion to these drawdowns (e.g., someone nearing retirement) rationally prefers a smoother, lower-growth path offered by fractional Kelly, even knowing they'll be "beaten" in the infinite long run. Maximizing the *median* outcome or minimizing the probability of ruin are valid, rational goals that Kelly does not necessarily serve best for finite horizons.

  ### Verdict: Samuelson Wins the Logic, Kelly Wins the World (For Mortals)

  **The strongest form of the Kelly camp's argument – that growth-rate optimization is objectively, utility-agnostically rational – collapses under Samuelson's critique.** The reliance on an infinite horizon is fatal. Utility maximization, not growth-rate maximization, is the bedrock of rationality. Kelly is optimal *only* for log-utility maximizers.

  **However, dismissing Kelly as merely "an arbitrary preference" misses its profound practical and psychological force:**

  1.  **The Mortal Constraint:** While infinity is unreal, bankruptcy is very real. Kelly's core genius is explicitly managing ruin risk. Most plausible utility functions (excluding linear) share an aversion to total loss. Fractional Kelly strategies, derived from its framework, naturally accommodate higher risk aversion while *still* leveraging its core insight: sizing bets proportionally to edge and bankroll to avoid ruin and harness compounding. Kelly provides the essential *toolkit* for sustainable growth under uncertainty, even if the "full" fraction isn't universal.

  2.  **The Psychology of Compounding:** Humans intuitively grasp the power and fragility of compounding. Strategies that risk catastrophic loss (like betting full bankroll) or starve growth (like betting too timidly) *feel* irrational. Kelly operationalizes the sweet spot. While Samuelson is logically correct that a risk-neutral agent *should* bet it all, few humans exhibit true risk neutrality. Our utility functions often bend sharply downward near zero wealth.

  3.  **Unknown Horizons & Robustness:** We rarely know our precise time horizon. A strategy optimized for a known finite period can be fragile if the horizon changes. Kelly, by focusing on the *rate*, offers a degree of robustness. It aims for sustainable growth regardless of when the game might end (as long as it doesn't end immediately due to ruin).

  4.  **Ergodicity's Practical Nudge:** While Peters' claim that Kelly solves ergodicity issues may overreach mathematically, it highlights a crucial *practical* point: for an individual with one life and one bankroll, the *time-average* growth rate is paramount. Focusing on ensemble averages (expected wealth) can be dangerously misleading if it ignores path-dependent risks like ruin. Kelly forces attention onto the individual trajectory.

  **Conclusion:** Samuelson was unequivocally right. The Kelly criterion possesses no magical, objective, utility-transcending claim to rationality. Its alleged probability-1 dominance over infinity is irrelevant to finite beings and only holds if one *assumes* log utility. Rationality demands maximizing *expected utility*, and Kelly is merely the optimal strategy for one specific (albeit important) utility function.

  **Yet, Kelly's practical dominance is undeniable.** Its core principle – sizing bets proportional to edge relative to bankroll to maximize compound growth while avoiding ruin – resonates deeply with the fundamental constraints and goals of mortal agents operating under uncertainty. It provides the indispensable framework for navigating the tension between growth and survival. While not objectively "the" rational strategy, it is *subjectively* rational for a vast swathe of realistic utility functions concerned with sustainable wealth building, and it is *pragmatically* superior for anyone who understands the devastating power of ruin and the magic of compounding. Kelly isn't rationality incarnate; it's the most rational response we have to the perilous, finite game we actually play. Samuelson exposed the fallacy, but Kelly provides the map.
