  We are ranking statistical approaches based on their contribution to the replication crisis, from most responsible (S-tier) to least (D-tier). The replication crisis is often attributed to misuse and misunderstanding of statistical methods, particularly the overreliance on p-values and the confusion between different frameworks.

  Key points from the query:
  - The hybrid NHST (null hypothesis significance testing) is what's commonly taught and used, and it's a mix of Fisher and Neyman-Pearson without acknowledging the differences.
  - Fisherian and Neyman-Pearson approaches are historically distinct and incompatible.

  Analysis of each approach:

  1. **hybrid_nhst**: This is the Frankenstein mix that is actually used in practice. It combines elements from both Fisher and Neyman-Pearson without clarity, leading to widespread misinterpretations (e.g., treating p-values as error probabilities, dichotomizing results at 0.05). This is arguably the main culprit because it is the dominant method and its misuse (p-hacking, misunderstanding of p-values) is a direct cause of the replication crisis. Thus, it should be in S-tier.

  2. **fisherian**: Fisher's approach uses p-values as continuous evidence against the null, without a fixed threshold. However, in practice, the arbitrary 0.05 threshold became entrenched. Fisher's approach doesn't control for Type I error in the long run and doesn't consider power, which can lead to unreliable results. But the main issue is that it is part of the hybrid that is misused. It shares some blame but not as much as the hybrid. We might put it in A-tier.

  3. **neyman_pearson**: This approach emphasizes pre-specified alpha and beta, and error control in the long run. It is more rigorous when applied correctly, but in practice, it is often misapplied (e.g., not specifying the alternative hypothesis clearly, not considering power). However, the hybrid approach has taken some of its elements and used them without the full context. It is less directly to blame than the hybrid, but still contributes because of the fixed alpha threshold and the focus on dichotomous decisions. We might put it in A-tier as well.

  4. **subjective_bayes**: Bayesian methods with subjective priors are less commonly used in fields that suffer from the replication crisis (like psychology). They require specifying prior beliefs, which can be controversial and vary between researchers, but they do not rely on p-values and are not directly responsible for the replication crisis. They might even be part of the solution by providing an alternative framework. Thus, they are relatively blameless (C or D-tier).

  5. **objective_bayes**: Objective Bayesian methods use default priors, aiming for more consistency. They avoid some of the subjectivity and might be more reproducible. They are not a primary cause of the replication crisis and are sometimes proposed as a fix. Therefore, they are blameless or even positive (D-tier).

  6. **likelihoodism**: This approach focuses on likelihood ratios for evidence without priors or error rates. It is not widely used in the fields that experienced the replication crisis, so it is not directly responsible. It also avoids some pitfalls of NHST. Thus, it is blameless (D-tier).

