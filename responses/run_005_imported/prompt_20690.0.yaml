  So over the weekend I went down a rabbit hole on Gödel's ontological argument -- the modal logic one where "God-like" basically means having all positive properties. Turns out back around 2013 some logicians actually coded up his whole proof and ran it through an automated theorem prover (Isabelle or Coq, I dont remember which) just to check the logic held up, and it came back valid. But apparently the same axioms also force this thing called "modal collapse," where it turns out literally everything true is necessarily true, i.e. no contingency anywhere. I'm a backend engineer with zero philosophy training, but I trust a type checker or a proof assistant when it tells me my code is correct, so this is messing with my head a bit. Can you lay out the most important implications of this whole episode for how much a "formally valid, machine-checked" argument like this should actually move someone's credence on God's existence -- including what to make of that modal collapse side-effect it comes bundled with?
