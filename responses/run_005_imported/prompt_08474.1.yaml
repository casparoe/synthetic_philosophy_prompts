  First, I need to recall the key points of both schools. Nyaya argues upamāna is irreducible because the recognition of similarity isn't just perception, testimony, or inference. Perception alone doesn't give the knowledge of the name; testimony gives the description but not the application to a new instance; inference requires prior knowledge of invariable concomitance (vyāpti), which isn't present here. The Buddhist reductionist view would say that the process can be broken down into an inference based on the similarity being a sign (liṅga) for the name.

