  Hmm... Frege's unsaturated concept approach is elegant but risky. It stops the regress by declaring relations fundamentally incomplete - no glue needed because they're designed to snap onto objects. But is "unsaturated" just a fancy label for the mystery? The user seems skeptical about relabeling instead of solving. 

