  Where do they diverge? The key point is whose context matters. Pragmatic encroachment looks at the subject's stakes—scientists in the drug study face high stakes, so knowledge is harder to claim. Contextualism looks at the journalist's context—what are the audience's stakes? If the journalist is writing for a general audience concerned about health, that's high context, so avoid "know." But if it's for astronomers in a low-stakes setting, "know" is okay. 

