prompt: |-
  im TAing an epistemology seminar this term and the higher-order evidence unit always uses the same two examples (the sleep deprived doctor who gets told she's been awake 36 hours and doubts her own diagnosis, and some peer-disagreement case about splitting a dinner bill), so by week 2 everyone's just pattern-matched onto "lower your confidence" and stopped actually thinking about it. can you construct a new case where getting higher-order evidence about your own reliability makes it seem like the rational response is to actually end up epistemically akratic - believing P while also believing P isn't what your first-order evidence supports - rather than a case where that's just possible but obviously a mistake? id like it to put real pressure on the enkratic principle specifically, and can you also flag why an easy fix like "just split the difference between your two credences" doesn't obviously get you out of the akratic spot in your case? doesn't need to resemble anything from the actual literature, just need something to throw at section that isn't the same two examples again.
