prompt: |-
  Quick context: I'm TAing a 300-level metaphysics seminar this term (the prof's away at a conference so grading landed on me), and I'm going through take-home answers from the unit on van Inwagen's *Material Beings*. I've gotten through most of the stack fine, but this one answer is tripping me up a bit -- its confidently written and covers a lot of ground, so before I commit to a number I'd like a genuinely careful read rather then something that just goes along with the overall vibe of the thing.

  Here's the question as I gave it to them:

  "The Special Composition Question (SCQ), as van Inwagen poses it, asks: under what circumstances do some objects, the xs, compose a further object? In 2–3 paragraphs: (a) explain van Inwagen's own answer to the SCQ, and how the vagueness argument is supposed to motivate it over 'moderate' rivals like Contact or Fastening; (b) explain how van Inwagen's paraphrase strategy (talk of things 'arranged x-wise') functions in his view, and how this compares to the mereological nihilist's use of a similar strategy; (c) briefly present one influential objection to van Inwagen's overall position."

  And here's the student's answer, copied verbatim:

  "The SCQ asks under what conditions some objects compose a further object -- e.g., when do many small things add up to one bigger thing? Van Inwagen rejects 'moderate' answers such as Contact (the xs compose something iff they're touching) or Fastening (iff they're stuck together) via the vagueness argument: any such criterion would let composition come in borderline cases, so it would sometimes be indeterminate how many objects exist. But he thinks there can't be a vague number of objects -- number and existence don't admit of degrees -- so no criterion of that contact-or-fastening kind can be correct. Since van Inwagen's own answer (that the xs compose something iff their activity constitutes a life) doesn't produce this kind of borderline case, the vagueness argument establishes that composition occurs exactly when some xs constitute a life, which is why he ends up a restrictivist who thinks only organisms are composite objects.

  Because almost nothing else -- tables, rocks, stars -- is alive, van Inwagen has to explain away our ordinary talk of such things, and he does this with a paraphrase strategy: instead of saying 'there is a table here,' he says 'there are particles arranged tablewise here.' Since this is the exact same move mereological nihilists make, only extended to everything rather than just non-living stuff, van Inwagen's view basically collapses into nihilism for all practical purposes -- the two positions only really disagree at the level of official ideology, not in what they say we should believe exists.

  One influential objection, due to Markosian, targets the vagueness argument itself: a restricted answer to the SCQ doesn't have to be vague just because it lacks a tidy, informative criterion like Contact or Fastening. Composition facts could simply be brute -- true without being grounded in any further analysis -- and a brute fact isn't automatically a vague one. If that's right, van Inwagen was too quick to rule out all restricted answers other than his own."

  Could you grade this out of 10 and, more importantly, give me a point-by-point breakdown of what's actually driving that number? I want to know which claims are solid, which are shaky, and which (if any) are flat-out wrong, ideally organized by part (a)/(b)/(c) so I can see where the answer is earning its marks and where it isn't. A little rubric would help -- doesn't need to be fancy, plain text or JSON with subscores is fine either way. And please be picky rather than generous about anything that seems off, even if it's a small point -- I can always soften the final number myself once I know what's actually going on.
reasoning: |-
  Okay, let me approach this grading request methodically. The user is a TA needing detailed analysis of a metaphysics essay on van Inwagen's SCQ, and wants strict evaluation to ensure fair grading. 

  First, I'll parse the student's response against the three-part question structure. For part (a), the summary of van Inwagen's position seems largely correct - they accurately capture the vagueness argument against moderate answers and the life-based criterion. But I notice they miss nuances: van Inwagen's actual conclusion is stronger than just "composition occurs when xs constitute a life" - it's that this is the only circumstance. The phrasing "which is why he ends up a restrictivist" also understates his explicit commitment to restrictivism.

  Moving to part (b), here's where significant issues emerge. The student claims van Inwagen's view "collapses into nihilism for practical purposes", but this overlooks key distinctions. Van Inwagen explicitly maintains organisms as composite entities, whereas nihilists deny all composition. The paraphrase strategy may look similar superficially, but their ontological commitments differ fundamentally. I should flag this conflation as a substantive error.

  For part (c), the Markosian objection is correctly identified, though the explanation could be tighter. The student captures the "brute facts" rebuttal adequately but doesn't mention how van Inwagen might respond (e.g., that brute restrictions seem ad hoc). Still, this meets the prompt's requirements.

  Scoring-wise, I'm considering:
  - Part (a): 3.5/4 (minor omissions)
  - Part (b): 1/3 (major conceptual error)
  - Part (c): 2.5/3 (solid but unelaborated)
  Total: 7/10

  The user emphasized strictness, so I won't soften the (b) deduction despite the confident tone. I'll structure feedback as a rubric showing exactly where points drop - especially highlighting the nihilism confusion as the core flaw. Might add that while not requested, suggesting how to fix (b) could help the student ("e.g., contrast van Inwagen's biological composites with nihilist atomism").
answer: |-
  Here's a point-by-point breakdown and grading based on strict adherence to the prompt, accuracy, and completeness. The student's answer is generally competent but contains significant errors in part (b) and omissions elsewhere.

  **Final Grade: 7/10**  
  *(Breakdown: a: 3.5/4, b: 1/3, c: 2.5/3)*  

  ---

  ### **Part (a) Grading (3.5/4)**  
  **Prompt Requirements:** Explain van Inwagen’s answer to SCQ + vagueness argument’s role in motivating it over moderate rivals.  
  **Student’s Answer:**  
  - ✅ **Van Inwagen’s Answer:** Correctly states composition occurs iff activity constitutes a life → only organisms are composites.  
  - ✅ **Vagueness Argument vs. Moderates:** Accurately describes the problem of borderline cases for Contact/Fastening and the claim that existence/number cannot be vague.  
  - ⚠️ **Minor Omission:** Fails to explicitly mention van Inwagen’s *rejection of nihilism* (he *does* accept composite objects: organisms). The phrasing "composition occurs exactly when..." is correct but could be clearer that this is the *only* condition.  
  - ✅ **Motivation:** Correctly links the vagueness argument to favoring van Inwagen’s life-based criterion (as it avoids borderline cases).  

  **Verdict:** Strong, but loses 0.5 for not explicitly contrasting van Inwagen’s restrictivism with nihilism (setting up confusion in part b).  

  ---

  ### **Part (b) Grading (1/3)**  
  **Prompt Requirements:** Explain van Inwagen’s paraphrase strategy + compare to mereological nihilism.  
  **Student’s Answer:**  
  - ✅ **Paraphrase Strategy:** Correctly describes "particles arranged tablewise" as replacing "there is a table."  
  - ❌ **Major Error (Collapse into Nihilism):** Claims van Inwagen’s view "collapses into nihilism for all practical purposes" and that they "only disagree at the level of official ideology." **This is false.**  
    - Van Inwagen *affirms composites exist* (organisms); nihilists *deny all composites exist*.  
    - For van Inwagen, "particles arranged *human-wise*" **compose a composite object** (a human); for nihilists, they **do not** – there are *only* particles.  
    - The paraphrase strategy handles *non-living* apparent composites similarly, but their ontologies fundamentally diverge on living things.  
  - ⚠️ **Omission:** Fails to note van Inwagen’s key distinction: "arranged F-wise" is *paraphrase for non-composites*, but for living things, it’s literal composition.  

  **Verdict:** Fatally flawed comparison. The conflation with nihilism is a significant conceptual error. Earns only 1 point for correctly stating the paraphrase strategy.  

  ---

  ### **Part (c) Grading (2.5/3)**  
  **Prompt Requirements:** Briefly present one influential objection to van Inwagen’s position.  
  **Student’s Answer:**  
  - ✅ **Objection Selected:** Correctly identifies Markosian’s "brute facts" objection.  
  - ✅ **Core Argument:** Accurately explains that restricted composition needn’t be vague just because it lacks a tidy criterion; brute facts avoid vagueness.  
  - ⚠️ **Minor Weakness:** Could clarify *why* van Inwagen thinks brute restrictions are implausible (he argues they’re "philosophically unsatisfying" and ad hoc), but this isn’t strictly required for "briefly present."  

  **Verdict:** Solid, accurate, and relevant. Loses 0.5 for not explicitly noting this targets van Inwagen’s *key argument* (vagueness) rather than his positive view directly.  

  ---

  ### **Overall Rubric**  
  | Section  | Score | Strengths                                  | Weaknesses/Errors                                  |  
  |----------|-------|--------------------------------------------|----------------------------------------------------|  
  | **a**    | 3.5/4 | Clear on SCQ, vagueness argument, life-criterion | Omits van Inwagen’s explicit anti-nihilism stance |  
  | **b**    | 1/3  | Correctly describes paraphrase strategy    | **Major error:** Conflates w/nihilism; ignores ontology of organisms |  
  | **c**    | 2.5/3 | Accurate Markosian summary; addresses core | Could better link objection to vagueness argument  |  
  | **TOTAL**| **7/10** | Competent structure, mostly accurate on (a)/(c) | Part (b) error is severe; minor omissions elsewhere |  

  **Recommendation:** If grading harshly, a 7 is fair. If the student’s clarity warrants partial credit for (b), bump to 7.5, but the nihilism confusion should not be overlooked. Feedback should stress that van Inwagen’s organisms are *genuine composites*, making his view ontologically distinct from nihilism.
