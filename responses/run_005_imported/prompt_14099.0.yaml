  First, I need to clarify the distinction between blameworthiness and standing. Blameworthiness is about the act being wrong, while standing is about who gets to blame. The user is struggling with how these can be separated without reducing standing to mere social influence. 

  Looking at Cohen's argument, he claims that hypocrisy undermines standing because the hypocrite implicitly exempts themselves from the norm they enforce. This creates a contradiction in their moral position. For example, if someone condemns terrorism but supports similar acts by their group, their criticism loses authority. But the user is concerned this might collapse into rhetoric rather than normative facts.

  The user mentions Fritz and Miller's rebuttal, which probably argues that hypocrisy doesn't necessarily remove standing. They might say that the moral truth stands regardless of the accuser's flaws. The user needs the mechanisms behind these positions: how standing is attached to the act of blaming, the assertion, or implicit claims.

  The key points to address are:
  1. The nature of standing: Is it about entitlement or authority? Philosophers like Darwall see moral address as requiring reciprocal recognition. If the accuser violates the same norms, they forfeit the right to address others.
  2. Mechanisms: 
     - Implicit exemption: By blaming others while exempting themselves, the hypocrite invalidates their moral position.
     - Complicity: If the accuser is involved in similar wrongs, they lack the clean hands needed to blame.
     - Moral community: Standing requires membership, which hypocrisy compromises.
  3. Why doesn't this affect the truth? The blame's warrant (truth of the act's wrongness) is separate from the blamer's authority. Even a hypocrite can be factually correct, but their hypocrisy makes their blame inappropriate or ineffective as moral address.

  The user’s deeper need is understanding the logical structure without conflation. They might be seeking clarity on whether standing is a normative fact or social construct. I should present competing views, showing how each explains the mechanism. Also, address their concern about contamination—why the underlying moral claim remains intact despite the hypocrite's lack of standing. Examples like a corrupt politician criticizing corruption can illustrate: the act is wrong, but the politician can't credibly blame others. The truth isn't contaminated because the wrongness exists independently of who points it out.
answer: |-
  You've hit on a core tension in the blame/hypocrisy literature. The separation of **blameworthiness** (the act's moral status) from **standing to blame** (the authority to *issue* condemnation) is maintained through specific conceptual mechanisms. Let's break down the logical structure, key arguments, and competing theories:

  ### Core Distinction & The Non-Collapse Problem
  1.  **Blameworthiness (Object-Level):** "Act X performed by Agent A is morally wrong." This is a fact about A and X. Its truth depends on moral principles, consequences, intentions, etc. *Tu quoque* against the *accuser* doesn't touch this.
  2.  **Standing to Blame (Second-Personal/Relational Level):** "Agent B is morally *authorized* or *entitled* to address a demand for accountability to A regarding X." This is a fact about the *relationship* and *positions* of B and A within the moral community.

  The claim is: Hypocrisy (B doing/condoning acts relevantly similar to X) can undermine B's *standing* without making X any less wrong. The mechanism preventing collapse into mere rhetoric relies on seeing blame as a specific kind of **moral address**, not just a factual assertion.

  ### Key Mechanisms Proposed for How Hypocrisy Undermines Standing
  Here are the main competing explanations, focusing on their logical structure:

  1.  **The "Implicit Claim of Normative Alignment" Model (Cohen-esque/Sincerity View):**
      *   **Structure:** When B blames A for X, B implicitly claims: "We (B and A) are both bound by norm N, which condemns X. I (B) recognize and submit to N myself in relevantly similar contexts."
      *   **Hypocrisy's Effect:** If B is guilty of relevantly similar conduct, this implicit claim is *false*. B is not genuinely committed to N as an impartial norm; they are applying it selectively.
      *   **Mechanism:** Blaming is not just stating "X violates N." It's an *address* that presupposes shared subjection to N and B's own adherence. Hypocrisy makes B's address *insincere* or *inauthentic* as a demand grounded in mutual accountability. B lacks the *moral authority* to *enforce* N upon A because B exempts themselves.
      *   **Why Truth Untouched?** The truth of "X violates N" is independent of B's relationship to N. N exists objectively. B's hypocrisy reveals B's *bad faith* in issuing the *demand*, not that N is invalid or X didn't violate it. (Analogy: A corrupt judge can correctly state the law but lacks *judicial standing* to sentence someone for violating it because they don't apply it impartially).

  2.  **The "Clean Hands"/Non-Complicity Model (Often Linked to "Standing" in Legal Analogies):**
      *   **Structure:** To have standing to blame A for violating N, B must not be *actively complicit* in the *same type of wrongdoing* or significantly benefitting from it. Blaming requires "clean hands" relative to the specific wrong.
      *   **Hypocrisy's Effect:** If B engages in relevantly similar conduct, B is *complicit* in undermining N or directly engaged in the *same kind* of wrong. B is part of the problem N condemns.
      *   **Mechanism:** Blaming is an act of *moral purification* or *defense* of N. One cannot credibly defend a norm while simultaneously (and knowingly) violating it. B's own violation makes them *part of the offense against N*, disqualifying them from acting as its defender against others. Their blame becomes an additional *instance* of the wrong (using moral condemnation selectively/abusively).
      *   **Why Truth Untouched?** Complicity affects B's *role* as blamer, not the validity of N or the fact that A violated it. The wrongness of X is a fact about A and N, not contingent on B's purity. A third party with clean hands could still validly blame A.

  3.  **The "Moral Community & Equal Standing" Model (Darwall-Inspired/Reciprocity View):**
      *   **Structure:** Moral norms and blame exist within a community of mutually accountable agents who recognize each other as having equal standing under the norms. Standing to blame arises from reciprocal recognition of this shared accountability.
      *   **Hypocrisy's Effect:** By violating N themselves while blaming others, B *denies the reciprocity* essential to mutual accountability. B implicitly claims a *superior status* – that the norms bind others but not themselves. This violates the equality presupposed by the moral community.
      *   **Mechanism:** Blaming is a *second-personal stance* – it addresses a demand *to* A *from* a position of equal moral authority ("We are both subject to N"). Hypocrisy reveals B does not see A as an equal under N; B places themselves *above* the norm. Thus, B forfeits the *equal standing* required to make legitimate second-personal demands *of* A. B's act is not a genuine moral address but an assertion of dominance.
      *   **Why Truth Untouched?** The wrongness of X is a *third-personal* fact: "X violates N." The *second-personal authority* to hold A accountable *for* that violation requires the reciprocal relationship. B's hypocrisy destroys that specific relational authority, not the third-personal fact.

  ### Addressing Your Specific Concerns
  *   **"Standing" as Normative (Not Just Social/Rhetorical):** In all models above, standing is a *normative condition* for the *permissibility* or *authority* of the *act of blaming itself*, derived from the nature of moral norms, address, and community. It's not *just* about effectiveness ("people won't listen"), but about whether B *deserves the role* or *has the right* to issue *this specific demand* to *this specific person*. A hypocrite might state a *true proposition* ("What you did was wrong") but lack the *normative position* to *hold you accountable* for it.
  *   **Contamination of Warrant:** The key is separating the *content* of the blame ("X is wrong") from the *illocutionary act* of blaming (holding accountable, making a demand). Hypocrisy attacks the *felicity conditions* (Austin) of the *illocutionary act*. It makes the act of blaming *defective* or *unauthorized* as a *moral address*, even if the *propositional content* asserted *within* that act is true. The warrant for the *truth claim* ("X violates N") comes from N itself and the facts of X. The warrant for the *act of addressing the demand* to A comes from B's relationship to N and A.
  *   **Orthogonality:** Hypocrisy *is* orthogonal to the *object-level facts about X and N*. Its force is entirely on the *relational level* between B and A, and B's relationship to N. It affects *who gets to speak for N* in holding A accountable, not *whether N applies to X*.

  ### Fritz & Miller (and Critics)
  Fritz & Miller (likely "Hypocrisy and the Standing to Blame") argue *against* Cohen, claiming hypocrisy *doesn't* generally undermine standing. Their core argument:
  *   **Structure:** Standing requires only that B is *victimized by* or has a *legitimate interest in* the norm N being upheld (or perhaps just that B recognizes N). B's own violations of N don't necessarily negate this.
  *   **Mechanism:** The primary function of blame is to uphold norms and demand accountability. Even a hypocritical B can perform this function correctly *in this instance* by condemning A. Demanding that blasers be pure creates perverse incentives (silencing critics) and lets wrongdoers off the hook too easily ("You can't blame me because you're flawed too!"). Standing is about the *norm and the wrongdoer*, not the blamer's purity.
  *   **Counter to Models 1-3:** They see the conditions above (sincerity, clean hands, reciprocity) as too stringent and not essential for the core purpose of blaming. They argue hypocrisy might make B *less persuasive* or *vulnerable to counter-blame*, but doesn't negate their *standing* to issue the condemnation if N is valid and A violated it. The hypocrite's blame is still *warranted* (true) and *permissible* (they have the right to voice it, even if it makes them look bad).

  ### The Logical Puzzle Summarized
  1.  **Premise 1:** Blameworthiness (X is wrong) depends solely on X and applicable norms (N).
  2.  **Premise 2:** Standing to blame is a distinct normative condition concerning the authority/entitlement of B to address a demand for accountability to A regarding X.
  3.  **Premise 3:** Hypocrisy (B's violation of N in relevantly similar contexts) is a fact about B's relationship to N.
  4.  **Claim (Cohen et al.):** Premise 3 undermines Premise 2.
  5.  **Mechanism:** Hypocrisy undermines the specific presuppositions (sincerity, non-complicity, reciprocity) required for the *act of blaming* (as a distinct form of moral address) to be authoritative or permissible *when directed from B to A*.
  6.  **Non-Contamination:** Premise 3 attacks the presuppositions of the *act* described in Premise 2. Premise 1 relies on different grounds (X and N). The *proposition* "X violates N" remains true; the *illocutionary force* of B *holding A accountable* for that violation is undermined.
  7.  **Critique (Fritz & Miller):** The presuppositions in Step 5 are incorrect or too strong. Premise 3 does not necessarily undermine Premise 2. The core function of blaming (upholding N, demanding accountability) can still be performed by B even if hypocritical. Premise 3 may create practical/social problems but doesn't negate standing.

  The debate hinges on the precise nature of blame and the necessary conditions for its legitimate exercise as a form of moral address between agents. The "standing" concept survives deflation by anchoring itself in the relational and performative aspects of moral practice, distinct from the propositional truth of the wrongness itself.
