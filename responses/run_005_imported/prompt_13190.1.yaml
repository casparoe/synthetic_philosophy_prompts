  Gilbert's core insight is the symmetry breaker: joint commitments create obligations that aren't reducible to sums of individual obligations. Bratman's mutual responsiveness and meshing sub-plans explain coordination, but not why I can't unilaterally quit the sofa-lifting once we've started. The key is the reciprocal authority structure - by joining, we give each other rights over our actions in this context. 

  The user might be seeking more than just academic validation though. That "genuinely wronged" phrasing hints they want philosophical grounding for everyday moral intuitions. Maybe they've been the abandoned bandmate, or worry about being the quitter. Gilbert offers language for that inarticulate sense of betrayal when collective "we" breaks. 

  I should emphasize Gilbert's rebuke point - it's not just that unilateral quitting is impractical, but that others gain standing to protest. That normative glue is what Bratman's assurance norms can't capture, however elegantly they model coordination. The difference between "you made me expect this" (Scanlon) and "we bound ourselves together" (Gilbert) is crucial. 

  Must avoid getting lost in abstraction. Concrete contrasts help: deciding mid-song "I'm done" versus needing group consent to stop. Or why the remaining band members feel entitled to anger, not just disappointment. Gilbert explains that as the fracture of a plural subject - a "we" that was momentarily real. 

