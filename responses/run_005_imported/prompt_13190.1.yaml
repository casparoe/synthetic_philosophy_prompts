answer: |-
  You've pinpointed the core tension between Bratman's individualist reductionism and Gilbert's commitment to the irreducibly collective. On this specific point – **the asymmetry between revisable personal intentions and the non-unilateral dissolubility of joint commitments** – Gilbert's argument is compelling and, I believe, correct. Bratman's apparatus, even augmented by Scanlon-style assurance norms, cannot fully reconstruct this asymmetry without smuggling in something like Gilbert's joint commitment.

  Here's the argument for Gilbert:

  1.  **The Phenomenon to be Explained:**
      *   **Asymmetry of Dissolution:** In purely personal intention (e.g., "I intend to practice guitar tonight"), I can unilaterally abandon it at any time without wronging anyone (barring special circumstances like prior promises). In a genuine joint action (e.g., moving the sofa, playing the song), no single participant can unilaterally dissolve the shared intention/commitment and walk away without the others feeling genuinely wronged and entitled to rebuke.
      *   **Normative Standing to Rebuke:** The others aren't just *disappointed* or *inconvenienced*; they feel they have the *right* to rebuke the defector. This rebuke isn't merely about inefficiency; it's about a violation of a mutual bond.

  2.  **Why Bratman's Account Falls Short:**
      *   **Individual Intentions + Mutual Responsiveness:** Bratman's core building blocks are individual intentions interlocked via mutual responsiveness and meshing subplans. Crucially, each individual's intention remains *their own*. I intend to lift *because* I believe you intend to lift and vice versa, and we adjust our actions accordingly.
      *   **The Revision Problem:** On Bratman's model, each participant retains full authority over *their own* intention. If I change my mind mid-sofa lift (deciding it's too heavy, I'm bored, I have a better offer), I am logically free to revise *my* intention. My intention to lift *because* you intend to lift dissolves the moment I no longer intend to lift. My responsiveness ceases. There is no inherent normative barrier within the Bratmanian structure preventing me from unilaterally revising my intention and acting on it (stopping).
      *   **Mutual Responsiveness Doesn't Create Mutual Authority:** Mutual responsiveness explains *coordination* – how we adjust *how* we lift together. It doesn't explain why I *cannot legitimately choose* to stop coordinating *at any moment* without incurring normative blame from the others beyond potential disappointment. My responsiveness is conditional on *my* ongoing commitment to the goal, which I can revoke.
      *   **Scanlon's Assurance Norm: A Partial but Insufficient Fix:** Bratman invokes Scanlon's Principle F: "One must exercise due care not to lead others to form reasonable but false expectations about what one will do when one has good reason to believe that they would suffer significant loss as a result of relying on those expectations."
          *   **Limitation 1: Scope.** This norm kicks in *if* others reasonably rely to their detriment. In your examples, the "wronging" feeling arises even if:
              *   The defection happens early, before significant reliance (e.g., dropping out after the first chord).
              *   The inconvenience is minor (e.g., the sofa is light enough for the others to manage, just awkwardly).
              *   The "loss" is purely the frustration of the shared activity collapsing, not tangible harm.
          *   **Limitation 2: Source of Expectations.** Scanlon's norm governs expectations *I create* through my assurances or actions. In a Bratmanian joint intention, the expectation others have is based on *their knowledge of my current individual intention*. If I genuinely change my mind, the expectation that I *will* continue is no longer reasonable *based on my current state of mind*. The norm prohibits misleading others about *my current intention*, not necessarily abandoning an intention I genuinely held. If I *sincerely* change my mind mid-lift, I haven't necessarily violated Principle F by creating a false expectation about my *present* intention.
          *   **Limitation 3: Authority Gap:** Principle F explains why you might be *upset* if I misled you or caused you loss through careless abandonment. It doesn't explain the specific feeling that *you have a right over my action* in this context, that *you* are entitled to demand I continue or rebuke me for stopping *simply because we started together*, independent of tangible loss. It doesn't explain why dissolution requires *your* concurrence as much as mine. Assurance norms create obligations *to individuals* based on harm; they don't create the *mutual authority* inherent in joint commitment.

  3.  **Why Gilbert's Joint Commitment Explains the Asymmetry:**
      *   **Creating a Plural Subject:** Gilbert argues that joint action requires participants to *pool their wills* to create a new entity: the "plural subject" ("we"). This is achieved through a joint commitment, where each party expresses (verbally or non-verbally) a conditional readiness to be jointly committed with the others *to intend as a body* to do X (lift the sofa, play the song).
      *   **Mutual Creation, Mutual Dissolution:** This joint commitment is *created together*. Crucially, because it is a commitment *of the plural subject*, it can only be *dissolved by the plural subject* – i.e., by the concurrence of all parties. No single individual created the commitment alone, so no single individual can dissolve it alone. The commitment binds the *plural subject*, not just the individuals severally.
      *   **Obligations and Entitlements:** By jointly committing, each party incurs obligations *to the others jointly* to do their part in fulfilling the shared intention. Crucially, each party also gains correlative *entitlements* against the others to demand performance and to rebuke for non-performance. This explains the normative standing to rebuke – it's the assertion of the entitlement created by the joint commitment.
      *   **The Asymmetry Explained:** My personal intention is mine alone; I have sole authority over it. The joint commitment belongs to the "we"; its authority is distributed. I cannot unilaterally dissolve "our" commitment any more than I can unilaterally dissolve "your" personal promise to someone else. The commitment transcends the individual wills that created it, binding them collectively until collectively released.

  4.  **The Ineliminable Gap:**
      Bratman's individual intentions + mutual responsiveness + Scanlonian assurance norms can explain:
      *   How we coordinate actions effectively.
      *   Why sudden abandonment might be rude, inconvenient, or even morally wrong *if* it causes harm due to induced reliance.
      What it *cannot* explain, without presupposing the very thing it denies, is:
      *   **The Non-Unilateral Dissolubility:** Why the *mere fact* of having started a joint action *together* creates a normative barrier preventing any *one* participant from simply deciding *for themselves* that it's over, regardless of reliance or harm. Why dissolution *requires* the others' agreement.
      *   **The Source of Mutual Authority:** Why the *other participants specifically* (not just anyone harmed) gain the standing to rebuke the defector *as a matter of right arising directly from the joint endeavor itself*, even absent significant reliance loss.
      *   **The "We" as Agent:** Why the obligation feels like it's owed *to the group* or *to the joint project itself*, not just severally to each individual based on their personal expectations.

  **Conclusion:** Gilbert is right. The profound asymmetry between revisable personal intentions and the non-unilateral dissolubility of joint commitments, coupled with the specific normative standing for rebuke among participants, points to an irreducible social fact. Bratman's sophisticated individualist machinery explains coordination brilliantly but cannot generate the *mutual authority structure* inherent in joint action. This structure – where the commitment belongs to the "we," binding its members and requiring their collective consent for dissolution, creating obligations *to each other as co-participants* – necessitates something like Gilbert's concept of a *sui generis* joint commitment. The feeling of being wronged when someone unilaterally quits the sofa lift or the band practice isn't just about broken expectations or inconvenience; it's the visceral recognition that a small piece of "us" has been violated.
