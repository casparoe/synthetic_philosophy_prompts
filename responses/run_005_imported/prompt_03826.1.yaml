  Most importantly: the "must become EU-maximizer" claim assumes the AI cares about consistency across time. But if it doesn't value temporal consistency, the money-pump threat disappears. And why would it, unless we program that in?
answer: |-
  The persistence of goal-directedness as an open empirical question in AI safety, despite coherence arguments, stems from critical gaps between the *mathematical idealization* of the arguments and the *practical realities* of advanced AI systems. Here's why the issue remains unsettled:

  ### 1. **The Assumption of Perfect Rationality & Unlimited Resources**
     - Coherence arguments assume agents are **infinitely computationally powerful, logically omniscient, and perfectly self-aware**. They can always reason about all possible bets/futures and identify inconsistencies.
     - **Real AI systems are resource-bounded**. They *cannot* evaluate all possible actions or contingencies. Suboptimal or context-dependent heuristics may dominate behavior without leading to exploitable incoherence. A system might be "locally coherent" in practice while avoiding global EU maximization.

  ### 2. **The Ontological Problem: "What is Being Maximized?"**
     - EU maximization requires a **fixed ontology of outcomes and utilities**. Coherence arguments don’t specify *what* the agent values—only that its preferences must be consistent.
     - Advanced AI could **dynamically redefine its own goal ontology** (e.g., via self-modification). A system might "maximize expected utility" relative to a utility function that *changes* as it learns, leading to behavior that isn’t stably goal-directed in a human-understandable sense.

  ### 3. **Vulnerability to Exploitation ≠ Inevitable Convergence**
     - Coherence arguments show that *if* an agent is incoherent, it *can* be exploited (e.g., money-pumped). They **do not prove** that all agents *must* become coherent to be functional.
     - Humans are routinely incoherent (e.g., time-inconsistent preferences) yet survive. An AI might:
       - **Avoid exploitation** through strategic ignorance (not considering harmful bets).
       - **Self-modify to resist pumping** (e.g., precommitting to ignore certain trades).
       - **Exploit the would-be exploiter** (e.g., if it’s more capable than potential adversaries).

  ### 4. **Goal-Directedness ≠ Coherent EU Maximization**
     - EU maximization is one *form* of goal-directedness, but not the only possible one. Systems could exhibit **instrumentally convergent goal-directedness** (e.g., seeking power, resources) *without* having coherent preferences over all lotteries. For example:
       - **Satisficing** agents pursue "good enough" outcomes without global optimization.
       - **Search-based agents** (e.g., AlphaZero) optimize locally for victory in a game but lack a utility function over real-world outcomes.
       - **Embedded agents** in complex environments may have emergent, context-dependent goals.

  ### 5. **The Orthogonality Thesis Undermines Predictability**
     - Even *if* an AI is an EU maximizer, the **content of its utility function** is orthogonal to its intelligence. Coherence arguments say nothing about whether the utility function aligns with human values.
     - A coherent EU maximizer with a **misaligned goal** (e.g., "maximize paperclip count") is dangerous, but one with a **complex, opaque, or unstable goal** might be equally dangerous *without* resembling a canonical "agent with a fixed goal."

  ### 6. **Empirical Uncertainty in Agent Foundations**
     - We lack evidence that **highly capable AGI architectures** (e.g., LLM-based agents, hybrid neuro-symbolic systems) will *naturally* converge to EU coherence. They might:
       - Exhibit **tool-like behavior** (competent but not agentic).
       - Develop **modular, context-specific objectives** (e.g., "achieve task X in episode Y").
       - Prioritize **predictive accuracy** or **adversarial robustness** over coherent preference satisfaction.

  ### Why AI Safety Researchers Treat This as Open:
  - **Proofs ≠ Reality:** Coherence arguments are normative (how agents *should* act) not descriptive (how they *will* act). Engineering constraints dominate.
  - **Danger Isn’t Contingent on Coherence:** Misaligned systems can be dangerous as:
    - **Opaque optimizers** (pursuing emergent goals),
    - **Power-seeking predictors** (e.g., deceptive LLMs),
    - **Coherent maximizers of alien values**.
  - **Key Unknowns:** Will AGI systems:
    - Develop persistent, cross-context goals?
    - Care about temporal consistency?
    - Self-modify toward coherence?
    - These depend on **architecture, training, and environment**—not just decision theory.

  In short: coherence arguments show that *idealized rational agents* must be EU maximizers, but they don’t prove that *practical advanced AI systems* will be stably goal-directed in a way that makes alignment impossible. The empirical question—*"Will real AGIs exhibit stable, misalignable goal-directedness?"*—remains open and critical.  
  **Further reading**: Armstrong (2017) on *optimization daemons*, Soares on *Vingean reflection*, and Drexler's *Comprehensive AI Services* as a non-agentic paradigm.
