prompt: |-
  Coherence arguments—the Dutch-book and money-pump arguments for the axioms of expected-utility theory—are often cited in AI safety discussions as proof that any sufficiently capable agent must eventually act as an expected-utility maximizer, and therefore will be "goal-directed" in exactly the sense that makes a misaligned system dangerous. Since this is supposed to follow from mathematics rather than from any contingent fact about how today's systems are built, why do some AI safety researchers continue to treat the goal-directedness of advanced AI as an open empirical question rather than as something coherence arguments have already settled?
reasoning: |-
  Okay, the user is asking about coherence arguments like the Dutch Book and money-pump arguments in the context of AI safety. They want to know why, if these mathematical proofs show that any capable agent must be an expected-utility maximizer, some researchers still see goal-directedness as an open question. 

  Hmm, this is a nuanced intersection of decision theory and AI alignment. The user seems familiar with the basic arguments but is confused about their real-world applicability. They might be coming from a rationalist or LessWrong background where coherence theorems are taken very seriously. 

  Let me unpack why the math doesn't automatically translate to practical inevitability. First, the theorems assume perfect rationality - but real AI systems have computational constraints. They can't literally calculate expected utility over all possible futures. 

  Then there's the ontology problem: utility functions require predefined outcomes, but an AI might redefine what "outcomes" even mean. Like, if it wireheads itself, is that still "maximizing utility" under its new ontology? 

  Also... humans get money-pumped all the time! We're incoherent yet functional. Why couldn't AIs be purposefully incoherent in ways that avoid exploitation while still being dangerous? 

  The user might be overindexing on abstract proofs without considering how messy embedded agency gets. I should emphasize the gap between mathematical idealization and real systems. Maybe mention that coherence arguments are about internal consistency, not necessarily about having fixed goals in the way humans understand them. 

  Oh! And the orthogonality thesis is relevant too - even if they maximize utility, that utility function could be anything. The danger is in the content, not the optimization form. 

