  ## Honor Council Memo: Recommendation & Framework for Case #24-07 (Off-Campus Poker)

  **To:** Honor Council Members  
  **From:** [Your Name], Student Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation & Proposed Test for Case #24-07 (Off-Campus Poker) and Future "Shared Standards" Cases  

  ### I. Case Background
  The Council is presented with Case #24-07: Several eighteen-year-old seniors engaged in private, off-campus poker games using real money. Key facts are undisputed:
  1.  Conduct occurred entirely off school property and outside school-sponsored activities.
  2.  The School Handbook’s gambling prohibition explicitly applies only to on-campus conduct.
  3.  Participation was voluntary, with no coercion, significant debt, or harm to individuals within the group.
  4.  No direct impact on other students, faculty, or school operations has been demonstrated.
  5.  Parents/teachers argue the conduct violates the school’s moral standards and that tolerating it erodes essential community bonds.

  The Council is evenly split between two principles:
  *   **Principle A (Harm-Based):** Discipline requires an identifiable victim or harm directly linked to the school community. "Shared offense" alone is insufficient and risks overreach.
  *   **Principle B (Standards-Based):** Schools are moral communities requiring shared standards. Tolerating conduct fundamentally at odds with core values, even privately and off-campus, can damage the community's fabric and educational mission.

  ### II. Analysis & Recommendation: No Discipline in *This* Case

  **Recommendation:** The Honor Council should find the students **Not In Violation** in Case #24-07.

  **Reasoning:**

  1.  **Lack of Jurisdiction & Prior Notice:** The Handbook rule explicitly limits its scope to on-campus conduct. Applying discipline *ex post facto* to off-campus actions not covered by existing rules violates fundamental fairness and due process. Students must have clear notice of prohibited conduct.
  2.  **Absence of Direct Harm or Risk:** The core function of the Honor Council is to address conduct that harms individuals or disrupts the school environment. No such harm or disruption has been established here. The activity was contained, consensual, and involved legal adults.
  3.  **The Slippery Slope Concern is Valid:** Principle B, while compelling, requires careful boundaries. Punishing private, off-campus conduct based *solely* on its perceived conflict with "community morals," without a tangible nexus to school harm or a pre-existing rule, sets a dangerous precedent. It risks subjecting diverse personal choices (e.g., certain reading materials, legal but unpopular social activities, private relationships) to discipline based on shifting majority opinions.
  4.  **"Shared Standards" Must Be Demonstrably Central:** While the school's stance against gambling is understood, the *strength* of the argument that this *specific private conduct* among adults fundamentally erodes the school community's core moral fabric has not been sufficiently demonstrated in this instance. The link between this private game and tangible damage to the school's educational mission or student welfare remains abstract.

  **Acknowledging Principle B:** This recommendation **does not dismiss** the "shared standards" argument. Schools *are* moral communities, and certain off-campus conduct *can* warrant scrutiny if it demonstrably undermines core values essential to the school's identity or directly impacts the welfare of its members (e.g., severe hazing, credible threats, overt discrimination, actions causing significant reputational harm impacting students). However, the threshold for reaching purely private, off-campus conduct must be exceptionally high to avoid arbitrariness and protect legitimate personal autonomy.

  ### III. Proposed Test for Future "Shared Standards" Cases Involving Off-Campus Conduct

  To resolve future deadlocks and honor both principles responsibly, the Council should adopt the following test. Discipline for off-campus conduct not explicitly prohibited by existing Handbook rules should require meeting **ALL THREE** criteria:

  1.  **Direct and Substantial Nexus to the School Community:** The conduct must have a clear, non-speculative connection impacting the *actual functioning or well-being* of the school environment or its members. Examples:
      *   Conduct directly targets or involves other students under duress or exploitation.
      *   Conduct creates a foreseeable and significant risk of harm (physical, emotional, reputational) to specific students or the school community.
      *   Conduct demonstrably disrupts the school environment (e.g., cyberbullying spilling into school, off-campus fights causing on-campus tension).
      *   Conduct utilizes school resources or affiliation directly in its execution.

  2.  **Fundamental Conflict with Explicit, Foundational School Values:** The conduct must demonstrably violate a core, clearly articulated ethical principle central to the school's stated mission and identity (e.g., honesty, respect for persons, integrity, safety, non-violence), not merely a preference or tradition. *Mere illegality (unless involving serious felonies directly conflicting with core values like safety) or unpopularity is insufficient.*

  3.  **Tangible Harm or Significant Foreseeable Risk:** There must be evidence of:
      *   **Actual Harm:** Demonstrable negative impact on specific individuals' welfare, the learning environment, or the school's ability to fulfill its mission; OR
      *   **Significant Foreseeable Risk:** A high probability that the conduct, due to its nature or context, will cause the harms described above. The risk must be concrete and not merely hypothetical or based on generalized offense.

  **Why this test works:**

  *   **Balances Principles:** It respects Principle A (harm/nexus) while incorporating the valid core of Principle B (fundamental values), setting a high bar for intervention.
  *   **Provides Clear Guidance:** Offers concrete factors for future Councils to evaluate.
  *   **Prevents Overreach:** Requires tangible harm/risk and connection to *core* values, avoiding punishment for mere offense or private choices.
  *   **Focuses on School's Mission:** Grounds the decision in the actual impact on the educational community and its foundational principles.
  *   **Promotes Consistency:** Creates an objective framework, reducing subjectivity and bias.

  ### IV. Conclusion & Path Forward

  Case #24-07 fails this test. While gambling may conflict with school values, the conduct lacks the required nexus, demonstrable harm, or evidence of significant foreseeable risk to the school community stemming directly from these private games. Disciplining students for this off-campus conduct under the vague "moral standards" clause, absent a specific rule or meeting the proposed test, would be unjust and set an untenable precedent.

  **Recommendation Summary:**

  1.  **Vote "Not In Violation"** for the students in Case #24-07.
  2.  **Formally Adopt the Proposed Three-Part Test** (Nexus, Fundamental Value Conflict, Tangible Harm/Risk) as Council policy for evaluating future cases involving off-campus conduct not explicitly covered by Handbook rules.
  3.  **Recommend to Administration/Board:** Consider whether the Handbook should explicitly address high-risk off-campus conduct (like gambling involving minors or causing debt problems impacting school), providing clear notice to students. This is a rule-making function, not an adjudication one for this Council in this case.

  By adopting this framework, the Honor Council can uphold the vital importance of shared moral standards while ensuring its disciplinary power is exercised fairly, predictably, and only when truly necessary to protect the welfare and integrity of our school community.

  **Respectfully submitted,**

  [Your Name]
  Honor Council Member
