  ## The Stain of Hypocrisy: When the Right to Blame is Forfeited

  The classroom confrontation over the class president's hypocrisy in reprimanding lateness while being chronically late herself taps into a deep philosophical dispute about the ethics of blame. While G.A. Cohen's exploration in "Casting the First Stone" highlights the complexity – questioning who can condemn terrorism given global complicity – the core issue revolves around the concept of "standing to blame." This essay will argue that genuine, unrepentant hypocrisy *does* rob a person of the standing to blame others for the same fault, rendering their criticism morally impotent, even if factually correct. This loss of standing is distinct from the blame's aptness, the "tu quoque" reply can be legitimate, and the critic's current engagement in the offense is crucial.

  **1. Standing: Distinct from Aptness, Rooted in Moral Authority**
  The core distinction Cohen and others emphasize is vital: the *aptness* of blame concerns whether the target *deserves* blame for a genuine wrong (e.g., the officer *was* late and disrupted the vote). The *standing* to blame concerns the *moral authority* or *right* of the *blamer* to level that criticism. Lacking standing is a separate failure. Imagine a judge sentencing a thief while simultaneously pocketing court funds. The thief's guilt (aptness) is unchanged, but the judge's own theft destroys their moral legitimacy to pronounce judgment. Similarly, the president correctly identifies the officer's lateness as disruptive (apt blame). However, her own identical, unrepentant behavior demonstrates a profound inconsistency that erodes her moral authority. She implicitly treats the rule against lateness as binding for others but optional for herself, violating a principle of impartiality fundamental to the moral community. Talk of "standing" isn't confused; it precisely identifies this failure of the *blamer's position*, distinct from the truth of the *blame's content*. It asks not "Is the target wrong?" but "Are *you* the right person, given your own conduct, to call them out?"

  **2. Tu Quoque: From Fallacy to Legitimate Moral Objection**
  The "tu quoque" ("you too!") reply is often dismissed as a logical fallacy – a deflection from the target's wrongdoing. Indeed, if used *only* to avoid accountability ("I stole, but so did he!"), it is fallacious; the target's guilt remains regardless of the accuser's behavior. However, in the context of *standing*, "tu quoque" transforms into a legitimate objection *to the critic*. When hypocrisy is genuine and relevant (the *same* fault), pointing it out isn't merely deflection; it exposes the critic's lack of moral credibility and authority. The objection highlights: "Your own actions demonstrate you don't truly believe this rule is binding or this fault is serious. Therefore, your condemnation rings hollow and lacks the moral force it purports to have." It challenges the blamer's *right* to occupy the moral high ground from which blame is issued. The officer responding "But you do it constantly!" isn't necessarily denying their lateness was wrong; they are contesting the *president's legitimacy* as the voice delivering that blame.

  **3. The Crucial Distinction: Current Unrepentance vs. Reformation**
  The critic's *current relationship* to the fault is paramount. Contrast the actual scenario (president: current, unrepentant offender) with the hypothetical (president: reformed, acknowledges past fault). The unrepentant hypocrite actively undermines the norm they invoke. Their ongoing behavior signals contempt for the rule they enforce on others, revealing their blame as performative rather than principled. They lack the integrity essential for authoritative blame. A *reformed* critic, however, presents a different case. By acknowledging their past fault and changing their behavior, they demonstrate commitment to the norm. Their past failure, while potentially requiring humility in delivery, doesn't automatically destroy standing; it might even lend credibility born of hard-won understanding. The key is consistency *at the time of blaming*. The unrepentant offender blames *while* violating the norm, creating an intolerable contradiction that the reformed person, acting in good faith, avoids.

  **Verdict: Hypocrisy Removes Standing Under Specific Conditions**

  Hypocrisy does not merely make blame "awkward"; it can genuinely *remove* the standing to blame. This occurs under the following specific conditions:

  1.  **Relevance:** The hypocrite must be guilty of the *same specific fault* (or a sufficiently analogous and serious moral failing) for which they blame another. Criticizing lateness while being habitually late qualifies; criticizing lateness while having cheated on a test might not directly undermine standing for the lateness charge.
  2.  **Current Engagement or Unrepentance:** The hypocrite must be either **currently engaging** in the fault *or* have engaged in it recently and persistently **without genuine acknowledgment, remorse, or reform**. Ongoing violation or unrepentant denial demonstrates active contempt for the norm invoked, fatally compromising their moral authority.
  3.  **Lack of Mitigating Role:** The hypocrite's role (like the class president's duty to enforce rules) does not *automatically* restore standing if conditions 1 and 2 are met. Holding office might demand they *address* the lateness, but their hypocrisy means they must do so in a way that acknowledges their own failure (e.g., delegating the reprimand, apologizing first) rather than claiming the moral high ground themselves.

  In the case of the class president, her **current, chronic, and unrepentant lateness** regarding the **exact same fault** she condemned means she categorically **lacked the standing** to publicly reprimand the officer. Her criticism, while factually apt regarding the officer's lateness, was morally illegitimate *coming from her*. She had forfeited the right to cast that particular stone. Her hypocrisy wasn't just an embarrassing sidebar; it was a fundamental disqualification from performing the act of blame with any moral authority. True standing requires not just seeing the speck in another's eye, but first acknowledging – and addressing – the plank in one's own.
