prompt: |-
  Ok, this has been bugging me since Thanksgiving and I figured I'd ask someone who might actually know what's going on. My brother-in-law is very committed to the idea that moral talk isn't in the business of stating facts, it's more like cheering or booing, so when he says "cheating on your taxes is wrong" he's not saying anything true or false, he's just expressing a boo, the same way you'd boo a bad ref call. Fine, I've taught intro ethics for years, I know theres something to this kind of view. But then over pie he was trying to talk my sister into telling her boss the truth about a mistake at work, and the argument went something like: "if owning up to mistakes with people who trust you is the right thing to do, then telling your boss about this one is the right thing to do; owning up to mistakes with people who trust you is the right thing to do; so telling your boss is the right thing to do." Everyone at the table, me included, just nodded along, it felt like a completely normal, valid argument, no different in kind from "if its raining the sidewalk is wet, its raining, so the sidewalk is wet."

  That's the bit I can't shake. If "owning up to mistakes is the right thing to do" doesn't state anything and is just a cheer, then what's that cheer doing sitting inside an "if...then" sentence, where nobody involved is actually cheering for anything, they're just working out what follows from what? He wasn't booing or cheering "owning up to mistakes" inside that conditional the way he plainly was outside it, and yet the whole argument still seemed exactly as tight as the rain/sidewalk one, the kind where you can be caught in a mistake no matter how you feel about rain. So is this an actual problem for his cheering-and-booing picture of morality, something that shows it can't be the whole story, or is it just a technical wrinkle a clever enough version of the view could patch up? There's a real puzzle in here that I can't quite state properly myself, so I'd love your take, and bonus points if you've got a clean way to explain it to him before next Thanksgiving.
reasoning: |-
  Okay, the user is grappling with a philosophical puzzle about moral language. His brother-in-law is an expressivist who thinks moral statements are like cheering or booing, not stating facts. But then the brother-in-law used a moral conditional in an argument that felt logically valid, just like a factual conditional. The user is confused because if moral claims aren't truth-apt, how can they function in logical structures like conditionals? 

  Hmm, this is a classic Frege-Geach problem. The user teaches intro ethics, so he's familiar with metaethics but might not have encountered this specific technical challenge. His frustration is palpable - he senses a contradiction but can't articulate why it bothers him. The Thanksgiving dinner setting makes me smile; this is exactly how real philosophical dilemmas emerge. 

  The core tension is between expressivism's emotional core and logic's structural requirements. When the brother-in-law says "if owning up is right, then telling your boss is right," he's not emoting - he's establishing a connection between propositions. But if "owning up is right" is just a cheer, what's being connected? It's like trying to build a bridge out of fog. 

  I should acknowledge how sharp the user's observation is. Many people wouldn't notice this wrinkle. His example perfectly isolates the problem: moral language behaves like factual language in logical contexts, even for expressivists. That's why philosophers like Blackburn developed quasirealism - to explain how we can "pretend" moral statements have truth values for practical purposes. 

  The user might appreciate knowing this isn't just some theoretical nitpick. It's haunted expressivism since the 1960s. The solution involves distinguishing between moral sentences' surface grammar and their underlying function. We treat them as truth-apt in arguments because... well, because we have to. The alternative is saying all moral reasoning is nonsense, which clearly isn't the case. 

  For next Thanksgiving, I'll suggest framing it as: "When you argue morally, you're playing a game with consistent rules. Your 'cheers' have to follow the same logical patterns as facts, or you couldn't reason about them at all." That might satisfy both the philosopher and the pie-eaters at the table.
answer: |-
  You've hit on one of the most famous and persistent problems in metaethics: the **Frege-Geach Problem** (or Embedding Problem). It's a brilliant observation that cuts to the heart of whether expressivism (the "cheering/booing" view) can fully account for how moral language *actually works* in reasoning. **Yes, this is a significant challenge for a simple expressivist view, and it shows why sophisticated versions need complex solutions.** Here's the breakdown:

  ### The Core Problem (Frege-Geach)
  1.  **Moral Claims in Logic:** Your brother-in-law used a moral claim ("owning up... is the right thing to do") *inside* a conditional ("if... then...") and as a premise in a deductive argument.
  2.  **Expressivist Dilemma:**
      *   **Outside Logic:** According to expressivism, uttering "Owning up is right" *is* cheering for owning up. Its meaning *is* the expression of that attitude.
      *   **Inside Logic:** But in the conditional "**If** owning up is right, **then** telling your boss is right," he *isn't* cheering for owning up. He's not expressing his attitude at that moment. He's considering a *hypothetical* scenario or establishing a *logical connection*.
  3.  **The Puzzle:** How can the *same phrase* ("owning up is right") mean one thing (an attitude expression) when said alone, and something fundamentally different (a proposition capable of being true/false and entering into logical relations) when embedded in a conditional or an argument? The simple expressivist account seems to break down in embedded contexts.
  4.  **The Comparison:** Your intuition is spot-on. The argument *felt* logically identical to the rain/sidewalk argument. We treat the moral premise *as if* it has a truth-value that allows the inference to go through, regardless of our current feelings. This is how reasoning *works*.

  ### Why This is a Problem for Simple Expressivism
  *   **Logic Requires Propositions:** Deductive logic fundamentally operates on propositions – things that can be true or false and stand in logical relations (like implication, conjunction, negation). "If P, then Q" requires P and Q to be truth-evaluable.
  *   **Attitudes Aren't Propositions:** A cheer ("Hooray for owning up!") or a boo isn't true or false. It doesn't logically imply other cheers or boos in the same way "P" implies "Q" if "If P then Q" is true. You can't logically derive "Boo cheating!" *directly* from "Hooray honesty!" using propositional logic.
  *   **The Mismatch:** Simple expressivism struggles to explain how an attitude expression magically transforms into a truth-evaluable proposition when embedded, especially when the *meaning* of the embedded phrase seems crucial to the validity of the argument.

  ### Clever Patches: How Sophisticated Expressivists Respond (Quasirealism)
  Philosophers like Simon Blackburn (quasirealism) and Allan Gibbard (norm-expressivism) have developed complex solutions. The core idea is to explain how *attitudes themselves* can stand in logical-like relations, or how we project attitudes *as if* they were truths to make sense of reasoning. Here's the gist:

  1.  **Higher-Order Attitudes:** Expressing "If owning up is right, then telling your boss is right" isn't expressing a simple attitude towards owning up or telling the boss *right now*. Instead, it expresses a **higher-order attitude** about the *consistency* of one's attitudes.
      *   It means something like: "**Boo to** having the attitude of approval towards owning up *while* having the attitude of disapproval towards telling the boss in this specific case (or boo to not disapproving of the inconsistency)." It expresses disapproval of a *combination* of attitudes.
  2.  **Inference as Attitude Management:** Logical inference in moral contexts becomes a matter of managing the coherence of your own attitudes. Accepting the premises ("If P is right, then Q is right" and "P is right") commits you, on pain of *attitudinal inconsistency*, to accepting the conclusion ("Q is right"). Failing to accept the conclusion reveals an inconsistency in your evaluative stance, just like believing "If it rains, the sidewalk is wet" and "It is raining" but refusing to believe "The sidewalk is wet" reveals a factual/logical inconsistency.
  3.  **Projection and Quasi-Truth:** We "project" our attitudes onto the world, talking *as if* moral properties ("rightness") were real facts. This allows us to use the familiar and powerful structures of logic to reason about what attitudes we *should* hold, given other attitudes we have. The "truth" of moral claims becomes a matter of their correctly reflecting our stable, coherent set of projected attitudes (or the attitudes we would have under ideal conditions).

  ### So, What Does This Mean for Thanksgiving?
  *   **You're Right:** Your observation highlights a genuine limitation of the *simple* "cheering/booing" picture. It struggles to explain how moral language works seamlessly within logical reasoning, like the argument your brother-in-law gave.
  *   **He's Not Entirely Wrong:** The expressivist core – that moral judgments express pro/con attitudes – remains plausible. The sophisticated versions *can* account for the logic, but they require recognizing that moral reasoning involves complex relationships between our attitudes, not just simple isolated cheers/boos.
  *   **The Argument Was Valid... Expressively:** The argument *was* logically tight, even on an expressivist (quasirealist) view. It revealed a commitment to consistency in attitude. If your sister accepts that "owning up with those who trust you is right" (cheers for it) *and* accepts the conditional link (disapproves of approving owning-up while disapproving of telling the boss in this instance), then, to be consistent in her attitudes, she *must* approve of telling the boss ("cheer" for it). Refusing to accept the conclusion makes her attitudes clash.

  ### The Clean Explanation for Next Thanksgiving
  "Hey [Brother-in-law], remember that argument you made to Sis about telling her boss? You said: *If owning up is right, then telling her boss is right. Owning up is right. So, telling her boss is right.* We all nodded because it felt logically solid, just like 'If it rains, the sidewalk is wet; it's raining; so the sidewalk is wet.'

  Here's the puzzle for your 'booing/cheering' view: When you say 'Owning up is right' *by itself*, you're just cheering, right? Not saying something true or false. But *inside* that 'if...then' statement, you weren't cheering for owning up at that moment. You were setting up a logical connection. And the whole argument only works if those moral parts ('owning up is right', 'telling her boss is right') are acting like things that *can* be true or false and linked logically.

  So, how does your 'cheering' view explain that? How can a cheer turn into something that fits into an 'if...then' statement and makes the logic work, without actually being a factual claim? That's the trick sophisticated expressivists try to solve by talking about 'managing the consistency of your cheers and boos' or 'projecting attitudes *as if* they were facts to make reasoning possible.' It shows the simple 'just cheering' picture needs some extra gears to handle how we actually *reason* about right and wrong."

  This explanation acknowledges his core insight while showing why the logical use of moral language pushes us towards a more nuanced view. It presents the puzzle clearly and points towards the solutions developed by professional philosophers grappling with exactly this issue. Good luck next Thanksgiving!
