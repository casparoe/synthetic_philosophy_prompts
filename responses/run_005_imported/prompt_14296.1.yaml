prompt: |-
  I'm about a third of the way into a novel with a secondary character who's kind of my fictionalized Nozick -- an aging libertarian philosopher, brilliant and a bit insufferable, who gets cornered at a dinner party by a young effective altruist type. She's really into "wild animal welfare," the idea that if animal suffering counts morally, we shouldn't just leave predation and starvation alone as "natural" -- maybe we should be contracepting deer, vaccinating gazelles, feeding orphaned prey animals, whatever it takes to cut down suffering in the wild. Apparently there are real orgs doing "welfare biology" research along these lines now (Wild Animal Initiative, if I'm remembering the name right).

  Here's what's bugging me and why I want your take: I'm pretty sure the real Nozick basically saw this coming and used it as a reductio against Peter Singer decades ago -- something like, if you take equal consideration of animal suffering as seriously as Singer's utilitarianism demands, doesn't that commit you to policing the food chain itself, which is absurd, so maybe equal consideration isn't the right principle after all. And seperately, in Anarchy, State and Utopia he's got that footnote about wanting something like utilitarianism for animals and Kantianism for people -- aggregate and trade off animal welfare, but treat human rights as near-inviolable side constraints.

  So imagine you actually sat him down today and showed him people taking his old reductio completely seriously and turning it into an actual funded research program. What does he say? Does he get to just shrug, "see, told you it was absurd," or does his own concession that animal suffering aggregates and counts at all kind of trap him into caring about this too? And does his self-ownership stuff give him a way out, like private individuals funding intervention is fine even though he'd never let the state mandate it? I don't want the generic "well he's a libertarian so obviously against it" answer -- I want you to actually sit with the tension inside his own view and tell me where it leads.
