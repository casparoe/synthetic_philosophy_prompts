  The dialogue needs back-and-forth. For instance, Arden questions how external reasons explain action. Byrne differentiates explanatory and normative reasons. Arden counters that normative reasons must be capable of motivating. Byrne uses epistemic reasons: believing truth is a reason regardless of motivation. Arden might say epistemic reasons still tie to cognitive goals.

