  ### Constructing a Distribution Where Switching is Always Beneficial

  To address your query, I'll construct a specific probability distribution for the smaller amount \(S\) in the two-envelope paradox. This distribution will ensure that no matter what amount \(X\) you observe in your envelope, the expected value of switching is strictly greater than \(X\). The key insight is that this requires the expected value of \(S\) (and thus the expected value of the money in any envelope) to be infinite. This connects to the St. Petersburg paradox, where infinite expectations lead to counterintuitive results.

  #### The Setup
  - Let \(S\) be the smaller amount in the two envelopes. The envelopes contain \(S\) and \(2S\).
  - We define a discrete probability distribution for \(S\) over the values \(2^k\) for \(k = 0, 1, 2, \ldots\) (i.e., \(S = 1, 2, 4, 8, \ldots\) dollars).
  - The probability mass function (PMF) for \(S\) is:
    \[
    P(S = 2^k) = \frac{1}{3} \left( \frac{2}{3} \right)^k \quad \text{for} \quad k = 0, 1, 2, \ldots
    \]
  - This is a geometric distribution with parameter \(p = \frac{1}{3}\), scaled to ensure probabilities sum to 1:
    \[
    \sum_{k=0}^{\infty} P(S = 2^k) = \sum_{k=0}^{\infty} \frac{1}{3} \left( \frac{2}{3} \right)^k = \frac{1}{3} \cdot \frac{1}{1 - \frac{2}{3}} = \frac{1}{3} \cdot 3 = 1.
    \]

  - When you pick an envelope at random and open it, you observe an amount \(X\). The possible values of \(X\) are \(2^m\) for \(m = 0, 1, 2, \ldots\) (i.e., \(X = 1, 2, 4, 8, \ldots\) dollars), since the envelopes contain \(S\) or \(2S\), and \(S\) is a power of 2.

  #### Why Switching Has Higher Expected Value for Every \(X\)
  For any observed \(X = 2^m\), we need to compute the expected value of switching, conditional on \(X\). This depends on:
  - The probability that \(X\) is the smaller amount (so switching gives \(2X\)).
  - The probability that \(X\) is the larger amount (so switching gives \(X/2\)).

  As derived in the general case, the condition for \(E[\text{switch} \mid X] > X\) simplifies to \(P(S = X) > \frac{1}{2} P(S = X/2)\). With our distribution, this holds for all \(X\) because:
  - \(P(S = 2^m) = \frac{1}{3} \left( \frac{2}{3} \right)^m\)
  - \(P(S = 2^{m-1}) = \frac{1}{3} \left( \frac{2}{3} \right)^{m-1} = \frac{1}{3} \left( \frac{2}{3} \right)^m \cdot \frac{3}{2} = \frac{1}{2} \left( \frac{2}{3} \right)^m\) for \(m \geq 1\)
  - Thus, \(P(S = 2^m) = \frac{1}{3} \left( \frac{2}{3} \right)^m > \frac{1}{2} \cdot \frac{1}{2} \left( \frac{2}{3} \right)^m = \frac{1}{4} \left( \frac{2}{3} \right)^m = \frac{1}{2} P(S = 2^{m-1})\)

  Now, let's compute \(E[\text{switch} \mid X]\) for four specific values of \(X\): \(X = 1, 2, 4, 8\). I'll show the arithmetic step by step.

  #### Case 1: \(X = 1\) (\(m = 0\))
  - If \(X = 1\), it must be the smaller amount (since the larger amount is at least 2). Thus, you have the smaller envelope, and switching gives \(2 \times 1 = 2\).
  - Expected value of switching: \(E[\text{switch} \mid X=1] = 2\).
  - Compare to \(X\): \(2 > 1\), so switching is better.

  #### Case 2: \(X = 2\) (\(m = 1\))
  - \(X = 2\) could be:
    - The smaller amount (\(S = 2\)), with probability based on \(P(S=2) = P(S=2^1) = \frac{1}{3} \cdot \frac{2}{3} = \frac{2}{9}\).
    - The larger amount (\(S = 1\), since \(X/2 = 1\)), with probability based on \(P(S=1) = P(S=2^0) = \frac{1}{3}\).
  - Probability of observing \(X=2\):
    \[
    P(\text{observe } X=2) = P(\text{pick smaller and } S=2) + P(\text{pick larger and } S=1) = \frac{1}{2} \cdot \frac{2}{9} + \frac{1}{2} \cdot \frac{1}{3} = \frac{1}{9} + \frac{1}{6} = \frac{2}{18} + \frac{3}{18} = \frac{5}{18}.
    \]
  - Conditional probabilities:
    \[
    P(\text{have smaller} \mid X=2) = \frac{P(\text{pick smaller and } S=2)}{P(\text{observe } X=2)} = \frac{\frac{1}{2} \cdot \frac{2}{9}}{\frac{5}{18}} = \frac{\frac{1}{9}}{\frac{5}{18}} = \frac{1}{9} \cdot \frac{18}{5} = \frac{2}{5}.
    \]
    \[
    P(\text{have larger} \mid X=2) = \frac{P(\text{pick larger and } S=1)}{P(\text{observe } X=2)} = \frac{\frac{1}{2} \cdot \frac{1}{3}}{\frac{5}{18}} = \frac{\frac{1}{6}}{\frac{5}{18}} = \frac{1}{6} \cdot \frac{18}{5} = \frac{3}{5}.
    \]
  - Expected value of switching:
    \[
    E[\text{switch} \mid X=2] = P(\text{smaller} \mid X) \cdot 4 + P(\text{larger} \mid X) \cdot 1 = \frac{2}{5} \cdot 4 + \frac{3}{5} \cdot 1 = \frac{8}{5} + \frac{3}{5} = \frac{11}{5} = 2.2.
    \]
  - Compare to \(X\): \(2.2 > 2\), so switching is better.

  #### Case 3: \(X = 4\) (\(m = 2\))
  - \(X = 4\) could be:
    - The smaller amount (\(S = 4\)), with \(P(S=4) = P(S=2^2) = \frac{1}{3} \cdot \left( \frac{2}{3} \right)^2 = \frac{1}{3} \cdot \frac{4}{9} = \frac{4}{27}\).
    - The larger amount (\(S = 2\), since \(X/2 = 2\)), with \(P(S=2) = \frac{2}{9}\).
  - Probability of observing \(X=4\):
    \[
    P(\text{observe } X=4) = P(\text{pick smaller and } S=4) + P(\text{pick larger and } S=2) = \frac{1}{2} \cdot \frac{4}{27} + \frac{1}{2} \cdot \frac{2}{9} = \frac{1}{2} \cdot \frac{4}{27} + \frac{1}{2} \cdot \frac{6}{27} = \frac{4}{54} + \frac{6}{54} = \frac{10}{54} = \frac{5}{27}.
    \]
  - Conditional probabilities:
    \[
    P(\text{have smaller} \mid X=4) = \frac{P(\text{pick smaller and } S=4)}{P(\text{observe } X=4)} = \frac{\frac{1}{2} \cdot \frac{4}{27}}{\frac{5}{27}} = \frac{\frac{4}{54}}{\frac{5}{27}} = \frac{4}{54} \cdot \frac{27}{5} = \frac{4 \cdot 27}{54 \cdot 5} = \frac{4}{10} = \frac{2}{5}.
    \]
    \[
    P(\text{have larger} \mid X=4) = \frac{P(\text{pick larger and } S=2)}{P(\text{observe } X=4)} = \frac{\frac{1}{2} \cdot \frac{2}{9}}{\frac{5}{27}} = \frac{\frac{2}{18}}{\frac{5}{27}} = \frac{\frac{1}{9}}{\frac{5}{27}} = \frac{1}{9} \cdot \frac{27}{5} = \frac{3}{5}.
    \]
  - Expected value of switching:
    \[
    E[\text{switch} \mid X=4] = P(\text{smaller} \mid X) \cdot 8 + P(\text{larger} \mid X) \cdot 2 = \frac{2}{5} \cdot 8 + \frac{3}{5} \cdot 2 = \frac{16}{5} + \frac{6}{5} = \frac{22}{5} = 4.4.
    \]
  - Compare to \(X\): \(4.4 > 4\), so switching is better.

  #### Case 4: \(X = 8\) (\(m = 3\))
  - \(X = 8\) could be:
    - The smaller amount (\(S = 8\)), with \(P(S=8) = P(S=2^3) = \frac{1}{3} \cdot \left( \frac{2}{3} \right)^3 = \frac{1}{3} \cdot \frac{8}{27} = \frac{8}{81}\).
    - The larger amount (\(S = 4\), since \(X/2 = 4\)), with \(P(S=4) = \frac{4}{27}\).
  - Probability of observing \(X=8\):
    \[
    P(\text{observe } X=8) = P(\text{pick smaller and } S=8) + P(\text{pick larger and } S=4) = \frac{1}{2} \cdot \frac{8}{81} + \frac{1}{2} \cdot \frac{4}{27} = \frac{1}{2} \cdot \frac{8}{81} + \frac{1}{2} \cdot \frac{12}{81} = \frac{8}{162} + \frac{12}{162} = \frac{20}{162} = \frac{10}{81}.
    \]
  - Conditional probabilities:
    \[
    P(\text{have smaller} \mid X=8) = \frac{P(\text{pick smaller and } S=8)}{P(\text{observe } X=8)} = \frac{\frac{1}{2} \cdot \frac{8}{81}}{\frac{10}{81}} = \frac{\frac{8}{162}}{\frac{10}{81}} = \frac{8}{162} \cdot \frac{81}{10} = \frac{8 \cdot 81}{162 \cdot 10} = \frac{8}{20} = \frac{2}{5}.
    \]
    \[
    P(\text{have larger} \mid X=8) = \frac{P(\text{pick larger and } S=4)}{P(\text{observe } X=8)} = \frac{\frac{1}{2} \cdot \frac{4}{27}}{\frac{10}{81}} = \frac{\frac{4}{54}}{\frac{10}{81}} = \frac{4}{54} \cdot \frac{81}{10} = \frac{4 \cdot 81}{54 \cdot 10} = \frac{4}{10} = \frac{2}{5} \quad \text{(wait, mistake)}.
    \]
    Correction:
    \[
    \frac{\frac{4}{54}}{\frac{10}{81}} = \frac{4}{54} \cdot \frac{81}{10} = \frac{4 \cdot 81}{54 \cdot 10} = \frac{324}{540} = \frac{324 \div 108}{540 \div 108} = \frac{3}{5} \quad \text{(since } 324 \div 108 = 3, 540 \div 108 = 5\text{)}.
    \]
    Yes, \(P(\text{have larger} \mid X=8) = \frac{3}{5}\).
  - Expected value of switching:
    \[
    E[\text{switch} \mid X=8] = P(\text{smaller} \mid X) \cdot 16 + P(\text{larger} \mid X) \cdot 4 = \frac{2}{5} \cdot 16 + \frac{3}{5} \cdot 4 = \frac{32}{5} + \frac{12}{5} = \frac{44}{5} = 8.8.
    \]
  - Compare to \(X\): \(8.8 > 8\), so switching is better.

  #### Pattern for General \(X = 2^m\)
  For any \(m \geq 1\), the conditional probabilities are always:
  - \(P(\text{have smaller} \mid X) = \frac{2}{5}\)
  - \(P(\text{have larger} \mid X) = \frac{3}{5}\)

  Thus, the expected value of switching is:
  \[
  E[\text{switch} \mid X] = \frac{2}{5} \cdot 2X + \frac{3}{5} \cdot \frac{X}{2} = \frac{4X}{5} + \frac{3X}{10} = \frac{8X}{10} + \frac{3X}{10} = \frac{11X}{10} = 1.1X > X.
  \]
  For \(X = 1\) (a special case), it's even better. Therefore, for every possible \(X\), switching has a higher expected value.

  ### Conceptual Resolution: Why This Doesn't Contradict Symmetry
  You're right that the envelopes are symmetric before you open one. However, conditioning on the observed amount \(X\) breaks this symmetry because the probability distribution over \(S\) is not uniform. In this case:
  - The distribution \(P(S = 2^k) \propto (2/3)^k\) is decreasing in \(k\), meaning smaller values of \(S\) are more likely.
  - When you observe a large \(X\), it is more probable that you have the larger envelope (because \(P(S = X/2) > P(S = X)\) for large \(X\), making it more likely that \(X\) came from a smaller \(S\) where it would be the larger amount).
  - However, the potential gain from switching when you have the smaller envelope (doubling your money) outweighs the loss when you have the larger envelope (halving it), due to the specific probabilities. In this case, \(P(\text{have smaller} \mid X) = 2/5\) and \(P(\text{have larger} \mid X) = 3/5\), so the expected gain is \(\frac{2}{5}(+X) + \frac{3}{5}(-X/2) = X/10 > 0\).

  The reason this doesn't lead to a paradox is that the **unconditional expected value of the amount in either envelope is infinite**. Specifically:
  - \(E[S] = \sum_{k=0}^{\infty} P(S=2^k) \cdot 2^k = \sum_{k=0}^{\infty} \frac{1}{3} \left( \frac{2}{3} \right)^k \cdot 2^k = \sum_{k=0}^{\infty} \frac{1}{3} \left( \frac{4}{3} \right)^k\).
  - Since \(\frac{4}{3} > 1\), this series diverges to infinity. Similarly, \(E[X]\) for any envelope is infinite.
  - Unconditionally, the expected value of switching is 0 by symmetry, but \(E[\text{switch} \mid X] > X\) for all \(X\) is possible because \(E[X] = \infty\). If \(E[S]\) were finite, this would be impossible, as it would violate the law of total expectation.

  This connects to the St. Petersburg paradox you mentioned, where a game with infinite expected value (e.g., prize = \(2^n\) if first heads on nth toss) leads to situations where any finite entry fee seems acceptable, challenging decision theory. Here, the infinite expectation allows conditional dominance (switching always looks good given \(X\)) without contradicting unconditional symmetry.

  In summary:
  - Yes, a proper probability distribution can make switching always beneficial in expectation, conditional on \(X\).
  - This relies critically on infinite expected values, resolving the "wrinkle" by showing that the symmetry is broken upon observation.
  - The distribution \(P(S = 2^k) = \frac{1}{3} (2/3)^k\) provides a concrete example, with arithmetic confirming \(E[\text{switch} \mid X] > X\) for multiple \(X\).
