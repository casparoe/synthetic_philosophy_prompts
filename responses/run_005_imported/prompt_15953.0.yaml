prompt: |-
  So I started a new job last week, and a teammate who's also pretty new (we'd barely talked before this) told me we don't actually need our manager's sign-off before sending client invoices - she said it's a leftover rule nobody follows anymore. There's nothing else confirming this, I have zero track record with her to know if shes reliable, and theres no easy way to check without just asking my manager directly, which feels weird this early on. She didn't seem shifty or unsure when she said it, just matter-of-fact. Part of me wants to just go with what she said, but another part feels like that's reckless since I don't actually have any real evidence she knows what she's talking about. Is it reasonable to just believe her here, or would I be naive to do that without checking first?
