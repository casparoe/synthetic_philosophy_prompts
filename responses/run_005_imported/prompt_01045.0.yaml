  Next, Tertius Interveniens. The title means "The Third Intervening [Party]" or "Intervening Third." Kepler positioned himself as a mediator between hardcore skeptics and traditional astrologers. He rejected the superstitious parts but thought there might be a natural basis in cosmic harmonies. He dismissed zodiac signs, houses, and planetary rulerships but was interested in astrological aspects (angles between planets) and their possible physical influences.

