answer: |-
  You've hit on a brilliant and very common point of confusion! Anscombe's argument is **often misrepresented** as just a dispute over casualty numbers, but her core ethical objection was fundamentally *different* from utilitarian cost-benefit analysis. While she *did* challenge the casualty estimates, that wasn't her primary philosophical point. Here's why her argument stands as a distinct ethical approach:

  1.  **Her Foundation: Virtue Ethics & Intention:** Anscombe was a staunch virtue ethicist heavily influenced by Catholic natural law tradition (and later Wittgenstein). Her primary objection wasn't *just* about the outcome (total deaths), but about the **intentional nature of the act** itself.
      *   **Targeting Civilians:** Dropping atomic bombs intentionally targeted entire cities, directly aiming to kill non-combatants (civilians, children, the elderly, etc.) on a massive scale. For Anscombe, this was intrinsically evil – a grave violation of the principle of non-combatant immunity inherent in the traditional Christian understanding of "just war" and natural law prohibitions against murder.
      *   **Means vs. Side-Effect:** She drew a sharp distinction between:
          *   **Intentionally killing innocents as a means to an end** (e.g., destroying cities to break Japanese morale/demoralize leadership): This was absolutely forbidden, regardless of the predicted outcome.
          *   **Foreseeable but unintended deaths of innocents as a side-effect** (e.g., civilians killed during a legitimate attack on a military target): This *might* be permissible under the principle of double effect, *if* the good effect was proportionate and the intention was solely the legitimate military objective.

  2.  **The Casualty Estimates: Secondary & Illustrative:** Anscombe *did* argue that the predicted casualties from an invasion were exaggerated and that the bombs likely killed more people overall. However:
      *   **This was secondary:** Her primary argument was that **even if the bombs *had* saved lives overall, intentionally killing hundreds of thousands of innocents would *still* have been morally impermissible.** It was a categorical prohibition.
      *   **It was used rhetorically:** She used the casualty argument to undermine the *utilitarian justification* offered by supporters of the bombings. She was essentially saying: "Even if we play by *your* rules (utilitarianism), your calculation is likely wrong. But more importantly, your rules are flawed because they ignore the intrinsic evil of the act itself."
      *   **It challenged the necessity claim:** Proponents argued the bombs were *necessary* to avoid a bloody invasion. By challenging the casualty estimates, Anscombe was attacking the claim of necessity within the utilitarian framework, showing the utilitarian case itself was weak.

  3.  **Why it's a Different *Kind* of Argument:**
      *   **Deontological Core:** At its heart, her argument is **deontological** (duty-based) and rooted in **virtue ethics**. It focuses on the inherent moral quality of the *act itself* and the *character/intention* of the agent (Truman), not just the consequences.
      *   **Rejection of Consequentialism:** She explicitly rejected the idea that good consequences could justify intrinsically evil means. Utilitarianism is a form of consequentialism (only consequences matter). Anscombe argued consequences *cannot* justify certain acts.
      *   **Focus on Moral Absolutes:** For Anscombe, the prohibition against intentionally killing the innocent was a near-absolute moral rule. Utilitarianism inherently rejects absolute moral rules in favor of maximizing overall good.

  **Why it's Famous & Significant:**

  1.  **Bold Challenge to Orthodoxy:** Immediately post-war, the bombings were widely accepted as necessary. Anscombe's public, principled stand against honoring Truman was incredibly courageous and controversial within Oxford and beyond.
  2.  **Revival of Non-Consequentialist Ethics:** Her pamphlet (and broader work) was part of a mid-20th-century revival of virtue ethics and natural law thinking, challenging the dominance of utilitarianism in applied ethics.
  3.  **Clarity on Intention & Double Effect:** She forced a rigorous re-examination of the concepts of intention and the principle of double effect in discussions of war and violence.
  4.  **Highlighting the Civilians Issue:** She placed the intentional targeting of civilians squarely at the center of the moral debate about the bombings in a way that pure utilitarian arguments often obscured.
  5.  **Enduring Symbol:** It remains a powerful symbol of applying rigorous, non-consequentialist moral principles to real-world political actions, even highly popular ones.

  **In Summary:**

  You're right that the *casualty estimate dispute* is a utilitarian argument *within* the utilitarian framework. **But Anscombe's core argument was *outside* and *against* that framework.** Her primary point was: **Intentionally massacring civilians is always gravely wrong, regardless of the predicted consequences.** The casualty argument was secondary – used to show that the utilitarian justification *also* failed on its own terms. Her fame stems from this powerful, principled, non-consequentialist stand at a crucial historical moment. It wasn't just a numbers game; it was a fundamental challenge to the ethical reasoning used to justify the bombings.
