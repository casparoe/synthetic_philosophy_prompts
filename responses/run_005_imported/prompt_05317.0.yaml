  Ah, there's the rub: the bookie must know f in advance to construct Bet 3. If the agent hasn't specified f, the bookie can't force loss in every world. For example, if the agent might conditionalize sometimes, or uses context-sensitive updates, the bookie loses their guaranteed win. 

