    However, note: Worrall's point is that the mathematical equations (the structure) are retained, but the ontology (the nature of the ether) is discarded. The student's claim that the electromagnetic field is a "reconceived descendant" and that the ontology survives in modified form is a misrepresentation. Worrall emphasizes the discontinuity in ontology and the continuity in structure. The electromagnetic field is not a modified ether; it's a completely different kind of entity. The continuity is in the mathematical form of the equations (e.g., the wave equations), not in the ontology.

