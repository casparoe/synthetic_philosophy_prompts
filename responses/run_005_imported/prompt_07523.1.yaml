prompt: |-
  I host a podcast on social epistemology, and next week's guest is a philosopher known for defending and extending Miranda Fricker's account of epistemic injustice, in particular her claim that testimonial injustice is best remedied not by redesigning institutions but by cultivating the individual hearer's virtue of testimonial justice. Please draft eight to ten interview questions that push past a mere restatement of that position. Include at least one question on whether this virtue-based remedy is psychologically realistic, given that identity prejudice is supposed to operate largely below the threshold of conscious awareness; at least one on Elizabeth Anderson's argument that only structural or institutional reforms can address credibility deficits that are statistical and system-wide rather than case-by-case; and at least one on Gaile Pohlhaus's charge that some so-called "gaps" in collective hermeneutical resources are really cases of dominant groups willfully ignoring interpretive resources that marginalized communities already possess. For each of these three questions, add a follow-up keyed to the reply the guest is most likely to give.
