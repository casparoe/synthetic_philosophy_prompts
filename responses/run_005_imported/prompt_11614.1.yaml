  Brainstorming scenarios: A prison guard helping an innocent inmate escape, believing it's a breach of duty. Or a corporate whistleblower who thinks leaking info is disloyal but does it to prevent harm. Another idea: a nun breaking cloister rules to aid a refugee, believing it's sinful but feeling compelled by compassion.

