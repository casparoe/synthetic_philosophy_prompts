  - David Christensen’s work on [epistemic self-doubt](https://philpapers.org/rec/CHRDC)  
  - Brian Hedden on [temporal epistemic norms](https://philpapers.org/rec/HEDRAN-2)  
  - L.A. Paul on [transformative experience](https://philpapers.org/rec/PAUTEA) (for how experiences alter values/beliefs)
