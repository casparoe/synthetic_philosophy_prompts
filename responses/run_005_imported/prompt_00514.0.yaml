  In Newcomb's, choosing one box doesn't cause the money to be there; it's already determined. But in Smoking Lesion, smoking doesn't cause the lesion or cancer. However, if the agent decides to smoke, does that provide evidence about the lesion? EDT would say yes, because it updates on the action as evidence. CDT ignores that and only considers causal effects.

  The user might be struggling with why one-boxing is rational in Newcomb's but abstaining from smoking in Smoking Lesion isn't. They need to understand that CDT avoids the "irrational" action in Smoking Lesion by focusing on causal independence. The lesion exists regardless of the choice to smoke. So smoking doesn't cause cancer, and thus CDT would smoke. But in Newcomb's, even though the choice doesn't cause the money to be there, one-boxing yields a better outcome due to the Predictor's accuracy.

  I should highlight the role of acausal correlations in Newcomb's versus the pre-existing common cause in Smoking Lesion. Also, mention how EDT treats both similarly, leading to abstaining in Smoking Lesion, which is why some see it as problematic. The user probably wants a clear demarcation between cases where acting on correlation is beneficial versus when it's not.

  They might also be interested in how modern approaches like FDT (Functional Decision Theory) handle these. FDT would one-box in Newcomb's because it considers the output of its decision function, which aligns with the Predictor's prediction. In Smoking Lesion, since the lesion is pre-existing and the decision doesn't affect it, FDT would smoke, similar to CDT.

  In summary, the key difference is that in Newcomb's, the agent's decision is part of a loop where the prediction depends on their disposition, while in Smoking Lesion, the lesion is independent of the decision. This allows CDT and FDT to one-box without committing to not smoking, whereas EDT's reliance on correlation leads to the same action in both but with undesirable outcomes in Smoking Lesion.
answer: |-
  That's a fantastic question that cuts to the heart of the EDT/CDT debate! The Smoking Lesion problem was *designed* to exploit a perceived weakness in Evidential Decision Theory (EDT) when applied to Newcomb's problem. While both problems involve correlation between your choice and a desired outcome, the *nature* of that correlation differs crucially. **One-boxing on Newcomb does NOT necessarily commit you to abstaining in the Smoking Lesion, and the distinction is where EDT and Causal Decision Theory (CDT) fundamentally part ways.**

  Let's break down both problems and then see how EDT and CDT handle them:

  1.  **Newcomb's Problem:**
      *   **Setup:** A near-infallible Predictor places $1,000 in Box B if they predict you will take only Box B, and $0 if they predict you will take both boxes (Box A always has $1,000). You choose after the Predictor has made their prediction and filled the boxes.
      *   **Choices:** One-box (take only B) or Two-box (take A and B).
      *   **EDT Reasoning:** "If I one-box, that provides strong *evidence* the Predictor predicted I would one-box, meaning Box B is very likely full ($1,000,000). If I two-box, that provides strong evidence the Predictor predicted that, meaning Box B is very likely empty ($0). Therefore, one-boxing gives me a high expected value ($1,000,000) while two-boxing gives me a low expected value ($1,000)."
      *   **CDT Reasoning:** "The Predictor has already made their prediction and filled the boxes. My choice *now* cannot *cause* what is in the boxes. Whatever is in Box B, taking both boxes gets me $1,000 more than taking only Box B. If Box B is full, I get $1,001,000 instead of $1,000,000. If Box B is empty, I get $1,000 instead of $0. Therefore, two-boxing dominates."
      *   **Common Intuition:** Despite CDT's logic, many feel one-boxing is the rational choice because the Predictor's accuracy makes one-boxing *correlate* with the best outcome. One-boxers tend to be millionaires.

  2.  **Smoking Lesion Problem (Egan, 2007):**
      *   **Setup:** There is a genetic lesion. People with the lesion are highly likely to both (a) get lung cancer and (b) have a strong intrinsic desire to smoke. People without the lesion are very unlikely to get cancer and have no particular desire to smoke. Smoking *itself* does *not* cause cancer. The lesion causes both the desire/cancer link and the cancer. You don't know if you have the lesion, but you know the statistics. You are deciding whether to smoke.
      *   **Choices:** Smoke or Not Smoke.
      *   **EDT Reasoning:** "If I choose to smoke, that provides strong *evidence* I probably have the lesion (since people with the lesion are the ones who *want* to smoke). Having the lesion means I'm highly likely to get cancer. If I choose not to smoke, that provides strong evidence I probably *don't* have the lesion (since people without the lesion don't want to smoke). Not having the lesion means I'm very unlikely to get cancer. Therefore, not smoking gives me a higher expected utility (lower chance of cancer)."
      *   **CDT Reasoning:** "Smoking does *not* cause cancer. The lesion causes cancer *and* the desire to smoke. My choice to smoke or not smoke *cannot cause or prevent* the lesion (it's already there or not). My choice also *cannot cause or prevent* cancer *directly* (since smoking isn't causal). The *only* effect of smoking is that I enjoy it (positive utility). The *only* effect of not smoking is that I miss out on that enjoyment (negative utility). Therefore, smoking dominates."
      *   **Common Intuition:** Choosing *not* to smoke based solely on the evidence it provides about the lesion feels irrational and superstitious. Smoking doesn't *cause* the harm, so why deprive yourself of the pleasure? Abstaining seems like "managing the news" rather than managing the outcome.

  **How EDT and CDT Draw the Line:**

  1.  **Evidential Decision Theory (EDT):**
      *   **Mechanism:** Maximizes *conditional expected utility*: `U(A) = Sum[ P(Outcome | A) * Utility(Outcome) ]`. It cares about the *total evidence* your action provides about desirable outcomes.
      *   **Treatment:** Treats Newcomb's and Smoking Lesion *identically*.
          *   **Newcomb:** `P(Box B Full | One-box)` is high -> High U(One-box). `P(Box B Full | Two-box)` is low -> Low U(Two-box). **Recommends One-boxing.**
          *   **Smoking Lesion:** `P(Cancer | Smoke)` is high -> Low U(Smoke). `P(Cancer | Not Smoke)` is low -> High U(Not Smoke). **Recommends Not Smoking.**
      *   **Critique:** EDT performs well in Newcomb's but seems to recommend an intuitively irrational, superstitious action in the Smoking Lesion. It confounds *correlation* (evidence) with *causation*. In Smoking Lesion, not smoking doesn't *cause* you to avoid cancer; it just means you're likely the type who wouldn't have gotten it anyway. EDT gets "spooked" by the correlation.

  2.  **Causal Decision Theory (CDT):**
      *   **Mechanism:** Maximizes *causal expected utility*: `U(A) = Sum[ P(Outcome | do(A)) * Utility(Outcome) ]`. It uses causal models (often represented by do-calculus or causal graphs) to estimate the *actual effects caused by the action*, ignoring spurious correlations.
      *   **Treatment:** Treats Newcomb's and Smoking Lesion *differently* based on the causal structure.
          *   **Newcomb:** `do(One-box)` does not *cause* Box B to be full (the prediction/box-filling happened in the past). `do(Two-box)` similarly doesn't cause Box B to be empty. The only causal effect is that `do(Two-box)` *causes* you to get Box A's $1000 *in addition to* whatever is in B. **Recommends Two-boxing.**
          *   **Smoking Lesion:** `do(Smoke)` does not *cause* cancer (the lesion causes cancer, and smoking doesn't cause the lesion). `do(Smoke)` *causes* enjoyment. `do(Not Smoke)` *causes* no enjoyment. **Recommends Smoking.**
      *   **Critique:** CDT performs well in Smoking Lesion, avoiding the superstition. However, in Newcomb's, it seems to leave money on the table by ignoring the undeniable correlation created by the Predictor's accuracy. It loses to a "rational" one-boxer in Newcomb's scenarios.

  **The Principled Distinction:**

  The key difference CDT exploits is the **direction of dependency and the agent's ability to influence the past:**

  *   **Smoking Lesion:** The lesion is a **pre-existing common cause.** Your choice (Smoke/Not Smoke) is an *effect* of the lesion (via desire), *not* a cause of the lesion or cancer. Your action provides *diagnostic evidence* about the past state (the lesion) but cannot *change* it. CDT correctly ignores the spurious correlation between smoking and cancer *for decision-making purposes*.
  *   **Newcomb's Problem:** The Predictor's prediction is **causally dependent on your future choice** (or rather, the *type* of agent you are that *would* make that choice). While your specific choice *now* doesn't cause the past prediction, the Predictor's accuracy means that *agents like you* (one-boxers) *cause* the Predictor to fill the box. This creates a **causal loop or dependency** that EDT captures via correlation but CDT struggles with because it focuses only on the immediate causal effects of the single action. The Predictor's action is *responsive* to the type of decision-maker you are.

  **Does One-Boxing Commit You to Not Smoking?**

  *   **No, not necessarily.** If you are a **CDT agent**, you two-box in Newcomb's and smoke in Smoking Lesion. No commitment.
  *   If you are a pure **EDT agent**, you one-box *and* don't smoke. Commitment via the same mechanism (conditioning on the action).
  *   **Most people who advocate for one-boxing** (like many on LW) do so *without* wanting to commit to not smoking in the Smoking Lesion. They achieve this by adopting a theory that distinguishes between the two structures:
      *   **Refined CDT (e.g., using subjunctive dependence):** Some versions of CDT try to capture the Newcomb intuition by defining causation more carefully to include dependencies like the Predictor's responsiveness. This is tricky.
      *   **Functional Decision Theory (FDT)/Updateless Decision Theory (UDT):** These newer theories explicitly consider the *output of the decision function* across all possible instances. In Newcomb's, FDT one-boxes because it recognizes that *being a one-boxer* (outputting "one-box") causes the Predictor to fill the box. In Smoking Lesion, FDT smokes because the lesion is a pre-existing fact independent of its decision function; outputting "smoke" doesn't *cause* the lesion to exist. **FDT one-boxes *without* committing to not smoking.** This is the dominant modern view among "one-boxers" who find Smoking Lesion irrational. They draw the line based on whether the correlation arises from the *decision rule itself* being a causal factor (Newcomb) or from a pre-existing state independent of the decision rule (Smoking Lesion).

  **In Conclusion:**

  *   **EDT** treats Newcomb's and Smoking Lesion the same: One-box & Don't Smoke. It gets "spooked" by correlations.
  *   **CDT** treats them differently: Two-box & Smoke. It avoids superstition in Smoking Lesion but loses in Newcomb's.
  *   **The principled distinction** lies in the **causal structure:** Pre-existing common cause with the action as an effect (Smoking Lesion) vs. a prediction/outcome that is *responsive* to the *type* of decision-maker/decision-rule you are (Newcomb's).
  *   **One-boxing in Newcomb's does NOT force you to abstain in Smoking Lesion** if you adopt a decision theory (like FDT or a sophisticated CDT) that recognizes the difference in causal dependency. FDT proponents argue that one-boxing is rational precisely *because* it leverages the fact that your decision *rule* influences the Predictor, while smoking does not influence the lesion. This allows them to draw the line between rational acausal trade (Newcomb) and irrational superstition (Smoking Lesion).
