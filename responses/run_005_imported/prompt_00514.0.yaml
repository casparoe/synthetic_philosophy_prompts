prompt: |-
  So I've read like a million posts about Newcomb's problem over the years (LW loves it) but I recently stumbled on the smoking lesion problem and now I'm confused about how they relate. Can you compare the two? Specifically I want to know if one-boxing on Newcomb commits you to also doing the "irrational" thing on the smoking lesion case, or if theres a principled way EDT/CDT proponents draw the line between them.
