  The passage reveals three layers of money-making for Aristotle:
  - Natural acquisition (household management)
  - Unnatural exchange (retail trade)
  - Hyper-unnatural usury

  The key to distinguishing retail from usury lies in Aristotle's teleology. Money has a proper function - as a medium of exchange. Retail trade distorts this by treating money as an end (profit), but at least it still involves actual goods. Usury completely divorces money from goods, making money "breed" independently. 

  For the student's paper, I should emphasize how this distinction stems from Aristotle's biology-based worldview. The "offspring resembles the parent" metaphor isn't just poetic - it shows he sees usury as violating essential natures. But I should also flag how this framework assumes a static, household-centered economy that doesn't account for commercial societies.

