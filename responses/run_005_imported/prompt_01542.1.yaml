prompt: |-
  Longtime reader of the rationalist blogosphere here, where Sharon Street's 2006 "Darwinian Dilemma" paper gets invoked often enough that I'd come to treat the matter as essentially closed: since our evaluative attitudes were shaped by natural selection for reproductive fitness rather than for detecting independent moral facts, non-naturalist moral realism simply cannot be true. So I was surprised to find Derek Parfit devoting a substantial part of On What Matters to defending exactly that kind of realism well after Street's argument was already widely known. Was Parfit just failing to engage with her strongest point, or is there a serious rebuttal to the Darwinian Dilemma that keeps this debate genuinely open rather than settled?
reasoning: |-
  Okay, the user is asking about Sharon Street's Darwinian Dilemma and Derek Parfit's response in "On What Matters." They're familiar with the rationalist blogosphere, where Street's argument is often treated as decisive against moral realism. But they're surprised Parfit defended non-naturalist moral realism after Street's paper. They want to know if Parfit addressed her strongest points or if there's a legitimate rebuttal keeping the debate open.

  First, I need to recap Street's dilemma. She presents two options for moral realists: either moral truths influenced the evolution of our moral beliefs (tracking account), or they didn't (non-tracking account). The tracking account seems implausible because evolution selects for reproductive fitness, not moral truth. The non-tracking account makes the alignment between our moral beliefs and moral truths a massive coincidence. Most naturalist realists accept the tracking account but reduce moral truths to natural facts, which Street also challenges. Non-naturalists like Parfit are left with the coincidence problem.

  Now, Parfit's response. He's a non-naturalist realist, so he rejects both horns of the dilemma. He argues that moral truths are necessary truths, not contingent on evolution. So the coincidence isn't as improbable as Street claims. He uses analogies like mathematics: our evolved abilities might still grasp necessary truths. Parfit also claims that some moral beliefs (like avoiding agony) are obviously true, and any explanation for why we hold them, including evolution, doesn't undermine their truth. He emphasizes that the content of moral beliefs matters, not just their origin.

  But did Parfit engage with Street's strongest points? He addressed the core of her argument but might not have fully countered her deeper challenge. Street's point is that if evolution shaped our moral intuitions for fitness, then even if there are moral truths, we have no reason to trust that our intuitions align with them. Parfit relies on the self-evidence of some moral beliefs, but Street could argue that what seems self-evident is still a product of evolution. The debate hinges on whether necessary truths can be known through evolved faculties without undermining their reliability.

  The user might be seeking not just an explanation but also whether the debate is still open. Among philosophers, it is. Parfit's defense is taken seriously, and others like Enoch and Wielenberg have expanded on similar ideas. But critics like Joyce and Street maintain that evolutionary explanations debunk moral realism. The user, coming from a community that sees the debate as settled, might want reassurance that there are credible counterarguments. They might also be interested in how different meta-ethical positions navigate this dilemma. So, explaining Parfit's arguments and the ongoing discussion shows that the issue isn't resolved, which addresses their surprise and provides a balanced view.
answer: |-
  That's an excellent observation, and you've pinpointed a core tension in contemporary metaethics. The rationalist blogosphere often presents Street's Darwinian Dilemma (DD) as a decisive refutation of non-naturalist moral realism (NNMR), while philosophers like Parfit clearly saw it as a serious challenge requiring a sophisticated response, not a knockout blow. Parfit *did* engage deeply with Street's argument in *On What Matters* (particularly in Volume 2, Part 6: "Normativity and Truth"), and his rebuttal represents a significant, albeit controversial, defense of NNMR. The debate remains genuinely open precisely because of arguments like Parfit's.

  Here's a breakdown of the core points and why the debate isn't settled:

  1.  **Recap of Street's Darwinian Dilemma (The Challenge):**
      *   **Horn 1 (Tracking):** If our evaluative judgments *tracked* independent moral truths during evolution, then evolution must have selected for this ability. But natural selection selects for traits promoting reproductive fitness, *not* truth-tracking per se. There's no plausible mechanism ensuring that fitness-enhancing judgments align with independent moral truths. In fact, we'd expect judgments shaped *only* for fitness to be systematically *distorted* relative to any independent truth.
      *   **Horn 2 (Non-Tracking):** If our evaluative judgments did *not* track independent moral truths during evolution (which is overwhelmingly likely, given Horn 1), then the fact that we ended up with judgments that *seem* to align with putative moral truths is an "astronomical coincidence." Such a massive coincidence is incredible.
      *   **Conclusion:** Non-Naturalist Moral Realism (NNMR) – the view that there are objective, non-natural moral truths – is either implausible (Horn 1) or requires belief in an unbelievable coincidence (Horn 2). Therefore, NNMR is probably false. (Street favors a constructivist alternative).

  2.  **Parfit's Core Defense (The Rebuttal):** Parfit, a staunch NNMR, rejects both horns. His key arguments focus on undermining the "coincidence" charge and the nature of the truths involved:
      *   **Necessary Truths & No Coincidence Needed:** Parfit argues that fundamental normative truths (like "We have reasons to avoid agony" or "Pain is bad") are *necessary truths*, akin to mathematical or logical truths (2+2=4). They hold true in all possible worlds, regardless of contingent evolutionary history.
          *   **Analogy:** Imagine aliens with vastly different evolutionary histories. If they reason correctly, they will still arrive at 2+2=4. Similarly, Parfit argues, any rational being, regardless of its evolutionary path, would (or *should*) recognize fundamental normative truths *if* they engage in rational reflection. Evolution didn't *create* the truths; it shaped minds capable of *accessing* them through reason.
          *   **No "Alignment" Problem:** The truth of "Pain is bad" doesn't depend on evolution *making* us believe it. It's just true. Our evolved aversion to pain *happens* to be a reliable (though imperfect) guide to this truth *because* the truth is necessary and reason-apprehensible. There's no need for evolution to have "tracked" the truth; the truth is necessarily there, and our cognitive faculties, shaped by evolution, can sometimes grasp necessary truths. The "alignment" isn't a coincidence; it's a consequence of the nature of the truths and the rational capacities evolution *incidentally* produced.
      *   **The Self-Evidence of Some Normative Truths:** Parfit contends that some fundamental normative truths are self-evident to rational reflection. We don't infer "I have a reason to avoid agony" from evolutionary facts; we grasp its truth directly. Evolution explains *why we have the cognitive capacity* to grasp such truths and *why we care* (e.g., pain avoidance is fitness-enhancing), but it doesn't explain *the truth itself* or undermine our capacity to recognize it. The *content* of the belief ("Agony is bad") is what matters, not its causal origin.
      *   **Distinguishing "Why Believe?" from "Why True?":** Street's challenge is often framed as "Why should we trust these evolved intuitions?" Parfit shifts the focus: The question isn't primarily "Why do we *believe* X?" but "Is X *true*?" He argues that rational reflection on the *content* of core normative judgments (like reasons to avoid agony or promote well-being) reveals their truth independently of their origin. Evolutionary explanations might explain our *susceptibility* to certain *errors* or biases, but they don't debunk the core truths we can rationally affirm.
      *   **The Implausibility of the Alternative:** Parfit argues that Street's constructivism (or other anti-realist views) faces its own insurmountable problems, primarily the "Normativity Problem" – failing to capture the truly objective, reason-giving force of morality that realism posits. For Parfit, the DD, even if challenging, is less problematic than abandoning the objectivity of normativity.

  3.  **Did Parfit Engage with Street's Strongest Point?**
      *   **Yes, directly.** Parfit dedicates significant space to Street's paper, quoting it extensively and structuring his argument around the two horns of her dilemma. He explicitly targets the "incredible coincidence" argument (Horn 2), which is widely seen as the strongest challenge to NNMR. He doesn't dismiss it; he tries to dissolve it using the necessity/rationality argument.
      *   **The Core Disagreement:** The crux lies in the **epistemology of necessary truths via evolved faculties**. Street (and critics like Joyce) argue that even if truths *are* necessary, the fact that our faculties were shaped *only* for fitness provides a *defeater* for trusting their outputs in domains like morality, *even if* they sometimes get it right. They see Parfit's appeal to rational reflection as question-begging – our sense of "rationality" itself is an evolved faculty selected for fitness, not truth-tracking in abstract domains. Parfit counters that the *success* of reason in logic/math (domains also not directly fitness-relevant) and the *inescapability* of certain normative judgments give us warrant to trust reason here too, despite its evolutionary origins.

  4.  **Why is the Debate Still Open?**
      *   **Parfit's Argument is Substantive:** His defense isn't a mere evasion; it's a sophisticated philosophical position grounded in Platonism about normativity and robust rationalism. Philosophers like David Enoch (*Taking Morality Seriously*) and Erik Wielenberg (*Robust Ethics*) have developed similar "third-factor" theories explicitly responding to the DD.
      *   **Deep Metaphysical/Epistemological Divide:** The debate hinges on fundamental disagreements about:
          *   The nature of necessity (especially normative necessity).
          *   The relationship between evolution, reason, and truth.
          *   Whether evolutionary origins provide a *universal defeater* for beliefs in non-empirical domains.
          *   The reliability and scope of rational intuition.
      *   **No Consensus:** Respected philosophers line up on both sides. Proponents of NNMR (Parfit, Enoch, Wielenberg, Shafer-Landau) find the necessity/rationality response compelling. Critics (Street, Joyce, Greene, Ruse) find the defeater from evolutionary origins overwhelming. Naturalist Realists (e.g., Boyd, Brink, Copp) try to navigate between the horns by grounding moral facts in natural facts (like well-being) that evolution *might* plausibly track, though Street argues forcefully that this merely pushes the coincidence problem back a step.
      *   **The "Moonscape" Objection:** Critics argue Parfit's view leaves normativity disconnected from the actual motivational forces evolution gave us. If the moral truth is a necessary, abstract truth, why *should* we care? Parfit argues we *do* (and should) care about things like agony, regardless of evolutionary explanation, but the motivational link remains a point of contention.

  **Conclusion:**

  Parfit was absolutely engaging with Street's strongest point – the "incredible coincidence" charge against NNMR. His rebuttal, centered on the *necessity* of normative truths and the *rational accessibility* of these truths to minds shaped by evolution, is a serious and influential defense that keeps the debate very much alive. While the DD is a powerful challenge that forces NNMR to explain the *epistemic* link between evolved minds and non-natural truths, Parfit (and others) argue this link is provided by the nature of the truths themselves (necessary, rationally apprehensible) combined with the general, if imperfect, truth-tracking capacity of human reason. Whether this response is sufficient, or whether the evolutionary origins provide an inescapable defeater, remains a core point of contention in metaethics. The debate is far from settled; it's a central battleground defining the landscape of contemporary moral philosophy. Your surprise at finding Parfit defending NNMR post-Street is understandable given the blogosphere's narrative, but it reflects the genuine complexity and unresolved nature of the philosophical dispute.
