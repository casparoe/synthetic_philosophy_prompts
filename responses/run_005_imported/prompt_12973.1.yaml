prompt: |-
  I'm putting together a handout for my formal epistemology seminar and want to run something by you first. I.J. Good has this old theorem showing that a Bayesian who's about to make a decision should never turn down a free peek at more evidence - expected utility with the extra info is always at least as high as without it, so long as she updates on it and then acts optimally. Seems pretty airtight. But Hirshleifer's classic result on information and insurance markets shows almost the opposite: if a public signal about who's going to get sick, or whose house will burn down, arrives before people get the chance to write there insurance contracts, everybody can end up worse off, because the risk-pooling that would've benefited both sides is no longer possible once the uncertainty is gone for one side. So which is it, is more information always weakly good for a rational agent, or can it actually make people worse off? Don't just say 'it depends' - pin down exactly which assumption in Good's proof Hirshleifer's scenario violates, and explain why that assumption was doing all the work.
reasoning: |-
  Okay, the user is preparing a handout for their formal epistemology seminar and wants to clarify a paradox between Good's theorem and Hirshleifer's result. They need a precise explanation of why these two famous conclusions seem contradictory—one claiming more information is always beneficial for Bayesian decision-makers, while the other shows it can make everyone worse off in insurance markets. 

  Hmm, the user is clearly academically sophisticated—they're teaching a grad-level seminar and referencing niche theorems. Their frustration with vague "it depends" answers suggests they want razor-sharp technical distinctions. The real challenge is isolating the exact assumption Good relies on that Hirshleifer violates. 

  Let me mentally walk through Good's proof first. The core steps are: (1) before seeing evidence, you average over possible future belief states; (2) for each possible belief state, you assume optimal action follows; (3) this makes the value of information non-negative. The critical hinge is step 2—it presumes the agent can freely optimize after updating. 

  Now Hirshleifer's insurance case: here, information arrives before contracting. Once risk types are revealed, high-risk people can't get cheap insurance (no cross-subsidy), and low-risk folks lose coverage too. Crucially, the decision structure changed—the "optimal action" (insurance contract) can't be adjusted post-information because contracts require pre-information uncertainty to enable pooling. 

  Aha! So the violation is Good's implicit assumption that the action set remains equally flexible post-information. In insurance, the very existence of certain actions (risk-pooling contracts) depends on symmetric ignorance. When information destroys that ignorance, beneficial actions vanish. 

  I should emphasize this isn't just about "strategic interaction"—even a single insurer facing fixed risks would suffer if information eliminated actuarially fair pooling. The key is the action space itself morphing. 

  For the handout, I'll structure it: first restate both results neutrally, then dissect Good's assumptions, pinpoint where Hirshleifer breaks them (action-space dependency), and finally reframe the "it depends" as a matter of whether information constrains future choice architectures. That should give students a crisp takeaway.
answer: |-
  You've hit on a profound tension at the heart of decision theory! Both theorems are correct within their frameworks. Hirshleifer's scenario violates a *crucial, often implicit assumption* in Good's Theorem: **The agent acts alone, and the set of available actions remains constant and unaffected by the acquisition of information itself.**

  Here's the breakdown:

  1.  **Good's Theorem (The Value of Information):**
      *   **Assumptions:** A *single, rational, Bayesian agent* faces a decision problem with:
          *   A fixed state space (uncertain world).
          *   A fixed set of possible actions.
          *   A utility function defined over state-action pairs.
          *   A prior probability distribution over states.
          *   The opportunity to observe the outcome of a potential experiment (signal) *before* choosing her action.
          *   The ability to update beliefs using Bayes' theorem upon seeing the signal.
          *   The freedom to choose the *optimal* action *after* seeing the signal.
      *   **Result:** The expected utility of the optimal policy *with* seeing the signal and then acting is *at least as high* as the expected utility of the optimal policy *without* seeing the signal. Information has non-negative expected value.
      *   **Key Mechanism:** The agent can *condition her action* on the new information. For any possible signal outcome, she picks the best action *given her updated beliefs*. Averaging over possible signal outcomes *before* seeing the signal, this flexibility guarantees the value can't be negative.

  2.  **Hirshleifer's Result (Information Destroys Insurance Opportunities):**
      *   **Scenario:** Multiple agents interact in a market *before* any information arrives. Crucially, the *availability of mutually beneficial contracts (insurance)* depends on the *initial state of symmetric uncertainty*.
      *   **Mechanism:**
          *   **Pre-Information (Symmetry):** Agents face identical uncertainty about who will suffer a loss (e.g., illness, fire). This shared risk creates the possibility for *risk-pooling* via insurance contracts. Low-risk individuals effectively subsidize high-risk individuals, but *both* gain ex-ante expected utility compared to no insurance because they are risk-averse and value smoothing consumption.
          *   **Information Arrives (Asymmetry):** A public signal perfectly reveals who is high-risk and who is low-risk *before* any contracts are signed. Symmetric uncertainty is destroyed.
          *   **Post-Information Market Failure:** With risks known:
              *   Insurers (or low-risk individuals acting as insurers) will only offer contracts to high-risk individuals at very high premiums (reflecting the true risk).
              *   High-risk individuals might be priced out or face unaffordable premiums.
              *   Low-risk individuals cannot obtain insurance at premiums reflecting the *pooled* average risk (since insurers know they are low-risk and will only offer low premiums). The *mutually beneficial pooling contract* that existed under uncertainty is now *impossible*.
          *   **Result:** *Both* high-risk and low-risk individuals end up worse off in expected utility terms compared to the world where the information never arrived and the symmetric-risk-pooling contract was available. The information has made everyone worse off.

  3.  **Pinpointing the Violation: The Action Set Assumption**
      The core violation in Hirshleifer's scenario is of Good's assumption that **the set of available actions remains fixed and accessible regardless of whether the information is acquired or not.**

      *   **In Good's World:** The agent *always* has the same menu of actions {A, B, C...} available to her. Seeing the signal only changes her *beliefs*, allowing her to pick the *best* action from this fixed menu given the new beliefs.
      *   **In Hirshleifer's World:** The acquisition of information *fundamentally changes the set of feasible actions (contracts)* available in the market.
          *   **Without Information:** The action set *includes* mutually beneficial risk-pooling insurance contracts.
          *   **With Information:** The action set *excludes* those same mutually beneficial risk-pooling contracts. The *only* contracts now feasible are those based on the *known* risks, which are worse for everyone ex-ante (before the information arrives, when they were hoping for pooling).

      **Why this Assumption Does All the Work:**
      Good's proof relies on comparing two strategies:
      1.  `Strategy NO-INFO`: Choose the best action *now* based on the prior.
      2.  `Strategy INFO`: See the signal, update beliefs, *then* choose the best action *from the same fixed set*.

      The value of `Strategy INFO` is calculated by averaging the utility of the best action *given the posterior* over possible signals. Crucially, for *each possible signal*, the agent gets to pick the best action *from the full, original action set*. The proof shows this average (`Strategy INFO`) can't be worse than picking the single best action now (`Strategy NO-INFO`).

      **In Hirshleifer's case, `Strategy INFO` is impossible!** After seeing the signal (which reveals risks), the agent *cannot* choose the action "Participate in the symmetric-risk-pooling contract" because that contract *no longer exists as a feasible option*. The information didn't just change beliefs; it destroyed the very possibility of taking that action. The "best action from the fixed set given the posterior" is now chosen from a *different, worse* action set than the one available without information. Good's proof doesn't account for the action set itself being contingent on the information state.

  **Conclusion:**

  Hirshleifer's scenario violates the core Good assumption that **the acquisition of information does not alter the set of actions available to the agent.** In strategic or market settings involving multiple agents and the creation of contracts based on shared uncertainty, information can destroy the feasibility of actions (like risk-pooling contracts) that were mutually beneficial under ignorance. When information makes beneficial actions *inaccessible*, its arrival can indeed make agents worse off in expectation. Good's theorem holds rigorously for a single agent facing a fixed action set, but it does not generalize to multi-agent interactions where information endogenously determines which actions are possible. The "work" done by the fixed action set assumption is to guarantee that conditioning on information only provides flexibility, never constraint, relative to the uninformed baseline. Hirshleifer shows that information can impose constraints by destroying opportunities.
