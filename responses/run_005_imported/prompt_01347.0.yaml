answer: |-
  You're absolutely right to be suspicious of that tidy narrative—it's a significant oversimplification of the history of epistemology. Your intuition that the core insight behind Gettier problems isn't novel is spot-on. Here's a more nuanced breakdown:

  1.  **Plato Didn't Explicitly Define JTB:** While the *Theaetetus* explores justified true belief and its shortcomings (particularly the "jury" example), Plato *rejects* it as a sufficient definition of knowledge (*episteme*). He leaves the dialogue aporetic (without a definitive conclusion). The JTB formulation is largely a **20th-century reconstruction** of the problem Plato was grappling with, not a definition he endorsed or that stood unchallenged.

  2.  **Pre-Gettier Awareness of the Problem:**
      *   **Ancient Skepticism:** Skeptics like Sextus Empiricus constantly highlighted how justification could lead us astray from truth, emphasizing the role of luck or accident.
      *   **Medieval Philosophy:** Figures like William of Ockham explored cases where evidence could be misleading even if the conclusion was true.
      *   **Modern Philosophy:**
          *   **René Descartes:** His evil demon scenario highlights how justification (based on senses/reason) could be systematically flawed, even if some beliefs accidentally turned out true.
          *   **David Hume:** His problem of induction shows that even well-justified beliefs about the future based on past experience *could* be false (and only turn out true by luck if they happen to be correct).
      *   **Early 20th Century (Pre-1963):**
          *   **Bertrand Russell (1948):** In *Human Knowledge: Its Scope and Limits*, Russell explicitly used the **stopped clock example** you mentioned. He described someone glancing at a clock that had stopped 12 hours ago, forming the true belief that it's (say) 8 o'clock, based on the seemingly reliable evidence of the clock showing that time. Russell concluded this wasn't knowledge because the belief's truth was "accidental."
          *   **A. J. Ayer & Others:** Discussions about the nature of justification and its link to truth often implicitly acknowledged the possibility of accidentally true, justified beliefs. H. A. Prichard (early 20th c.) argued that knowledge was a distinct state from true belief, implicitly rejecting JTB.

  3.  **Why Gettier Had Such an Impact (1963):**
      *   **Context:** Analytic philosophy in the mid-20th century (especially influenced by logical positivism and ordinary language philosophy) was intensely focused on precise definitions and necessary/sufficient conditions. The JTB definition had become a widely accepted *working model* or *straw man* for analysis, even if its historical accuracy was shaky.
      *   **Formalization:** Gettier presented two very clear, concise, and easily generalizable counterexamples (the "Job and Coins" and "Jones and Ford" cases) directly targeting the JTB definition *as it was understood and used at that specific time*.
      *   **Timing & Conciseness:** His paper was exceptionally short (3 pages), making it easy to digest and impossible to ignore. It landed in a philosophical environment primed to debate definitions rigorously.
      *   **Catalytic Effect:** Rather than "overturning overnight," it acted as a catalyst. It crystallized a latent problem into a sharp, undeniable challenge to the dominant framework. It didn't invent the problem; it **forced the entire field to confront it systematically**. The subsequent explosion of literature trying to "solve" the Gettier problem (by modifying justification, adding a fourth condition, or rejecting JTB entirely) is what cemented its significance.

  4.  **Why the Tidy Narrative Persists:**
      *   **Pedagogical Simplicity:** It's a compelling story for introducing epistemology: a clear definition, a long reign, a dramatic overthrow. It hooks students.
      *   **Focus on Modern Analytic Epistemology:** The narrative often reflects the *self-perception* of mid-to-late 20th-century analytic philosophy, which saw itself as making rigorous progress by identifying and solving such puzzles. It downplays earlier, less formal discussions.
      *   **Gettier's Clarity:** His examples became the *paradigm* cases, overshadowing earlier, sometimes vaguer, anticipations like Russell's.

  **Conclusion:**

  You are **correctly suspicious**. The story of an unbroken, universally accepted JTB definition from Plato to Gettier is a **myth**. Philosophers for centuries recognized that justification doesn't guarantee truth and that true beliefs could be held for bad reasons or by luck. Russell explicitly described a Gettier-style case 15 years earlier.

  However, Gettier's 1963 paper **was** a pivotal moment. It wasn't the *discovery* of the problem, but its **crystallization and forceful presentation within the specific context of mid-20th-century analytic philosophy**. It transformed a recognized difficulty into an unavoidable crisis for the prevailing definition, sparking decades of intense debate and reshaping the field. The narrative is overly simplistic, but Gettier's impact on the *direction* of contemporary epistemology was profound and undeniable. Your insight into the simplicity of the underlying problem and the likelihood of earlier recognition is excellent philosophical thinking.
