  For standard DCD, when we don't resuscitate, the body naturally progresses toward irreversible damage. But in TA-NRP, surgeons artificially recreate near-normal physiological conditions below the brain clamp. That's not just declining intervention - it's actively reconstructing vital functions we'd expect only in living bodies. 

  The heart restarting is particularly problematic. If the heart beats in the chest after declaration of death, it blurs the line between a corpse and a patient. Even if the brain is excluded, restoring systemic circulation creates a biological scenario incompatible with how we conceptualize corpses. 

