  Hmm, this is a nuanced bioethics question with life-and-death implications. The user seems to be a journalist or researcher who understands the technical aspects but needs help articulating the ethical distinction. They're likely preparing a critical piece and want strong arguments against TA-NRP's ethical justification. 

