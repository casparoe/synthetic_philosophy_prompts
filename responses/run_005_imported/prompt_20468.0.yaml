prompt: |-
  I'm about two-thirds through a generation-ship novel and I've hit a scene where I don't just need the right vibe, I need the actual document a character would produce. Setup: my ship is currently 60 years into a 200-year crossing, carrying about 6,000 colonists who live pretty well -- decent private space, real surplus in food and power, enough slack that people can take up hobbies and learn things that aren't strictly useful. The chief engineer has just told the Colony Council that if they eat into the reserve margins that have sat untouched since launch, the ship could support growth up to somewhere around 25,000 colonists by arrival, mostly through higher birth allowances plus reviving a lot more of the frozen embryo bank than originally planned. The catch: everyone's living space, food surplus, and "discretionary" allowance would drop close to the floor the ship's charter certifies as a life worth living -- the charter calls it the Founders' Floor. Nobody would be miserable exactly, just a lot more cramped and threadbare than now.

  One councillor is pushing hard for the expansion, using language she clearly picked up from some pop-philosophy book, about how a population that's big enough and just-barely-flourishing-enough beats a small thriving one on the numbers, and that the charter's own "worth living" floor commits the ship to exactly that trade whether the council likes it or not. Another councillor keeps pointing out that most of the additional people in question don't exist yet under any version of the plan, and wouldn't even be the same specific people depending on which version the council picks, so its not really clear anyone is being shortchanged if the council just says no.

  My protagonist, Anke, is the elected Continuity Officer -- basically the person whose actual job is to write these calls up properly instead of everyone just going with their gut -- and the council votes at the solstice session in three weeks. Could you draft the memo she'd submit: recommendation up front, reasoning after, like a real internal document rather than an essay? I need it to land on something concrete -- approve the expansion, reject it, or approve some capped or phased version, ideally with an actual number or threshold attached -- and I need it to take the "more lives worth living is just more good" argument seriously rather than wave it off, exactly as seriously as it takes whatever's wrong with treating "worth living" as the only bar that matters. My writing group's note last time was that this needs to read like a smart, well-researched layperson wrote it under deadline, not a philosophy journal article -- but they'll absolutely notice if the reasoning underneath is hollow, so please don't dumb down the substance, just the register.
reasoning: |-
  Okay, the user is writing a generation-ship novel and needs a realistic memo from their protagonist, Anke, the Continuity Officer. The ship is 60 years into a 200-year journey, currently supporting 6,000 colonists comfortably. The chief engineer proposed increasing the population to 25,000 by arrival, but this would reduce everyone's living standards to the bare minimum "Founders' Floor" described in the ship's charter. 

  The user needs this memo to resolve a philosophical debate on the council: one faction argues more lives at minimum flourishing is better ("utilitarian math"), while another counters that nonexistent people aren't being deprived. Anke must make a concrete recommendation that engages deeply with both arguments without being academic. 

  Key requirements: 
  - Memo format (recommendation first, reasoning after) 
  - Layperson register but philosophically robust 
  - Concrete capped/compromise proposal 
  - Takes "more lives = more good" seriously but challenges its assumptions 

  Hmm... the core tension is between quantitative ethics (maximizing lives) and qualitative ethics (protecting current thriving). The charter's "life worth living" is the pivot—it sets a floor but doesn't mandate maximizing below it. Anke should expose how the expansion argument treats "worth living" as binary when flourishing exists on a spectrum. 

  For the proposal: A capped increase (say 14,000) balances growth with preserving buffers. It honors the charter's spirit by avoiding drastic austerity while acknowledging future potential. Phasing lets them monitor systems. The number should feel calculated—maybe based on current surplus decay rates? 

  Tone notes: 
  - Avoid jargon. Use "thriving vs surviving" instead of "hedonic calculus" 
  - Anchor in ship realities: stress on systems, risk margins 
  - Subtly undermine the "pop-philosophy" councillor by showing her argument oversimplifies 

  User's writing group will spot lazy reasoning, so the memo must: 
  1. Concede that more lives *above* the floor is good 
  2. Argue that pushing to the floor sacrifices current quality for hypothetical gains 
  3. Highlight that the charter's floor is a guarantee, not a target 

  ...And make Anke sound weary but principled. Maybe add a "respectfully" to nod to the council's tensions.
answer: |-
  ## INTERNAL MEMORANDUM  
  **To:** Colony Council, Ulysses Generation Ship  
  **From:** Anke Voss, Continuity Officer  
  **Subject:** Recommendation Regarding Population Expansion Proposal (Ref: Chief Engineer's Report ENG-773B)  
  **Date:** Sol 21,945 (Standard Mission Calendar)  
  **Urgency:** Council Decision Required by Solstice Session (Sol 22,003)  

  ---

  ### I. RECOMMENDATION  
  **Approve a phased population increase target of 14,000 (±500) colonists by Arrival (Sol 30,000).** This represents a 133% increase over current population (6,000), achieved via incremental adjustments to birth allowances and embryo revival rates over the next 40 years, **with mandatory biennial resource/wellbeing reviews and an absolute cap at 15,000.** Expansion must **NOT** utilize reserve margins below Charter-certified Founders' Floor (FF) safety buffers.  

  ---

  ### II. RATIONALE: BALANCING SCALE, FLOURISHING, AND THE CHARTER'S INTENT  
  This decision hinges on interpreting the Charter's core mandate: "to deliver a viable, flourishing human population to Proxima Centauri b." The proposal to maximize population to ~25,000 rests heavily on a quantitative interpretation of "flourishing": *more lives meeting the Founders' Floor (FF) standard is inherently better than fewer lives exceeding it*. While logically coherent on its face, this approach requires critical examination against our operational reality and the Charter's deeper architecture.  

  **A. The "More Lives Worth Living" Argument: Valid Premise, Incomplete Application**  
  Councillor Aris's position correctly identifies that the Charter establishes FF as the *minimum acceptable threshold* for human life aboard Ulysses. It does not specify maximizing population *at* that threshold as the sole good. However, her argument holds weight if we accept:  
  1.  **FF truly represents a "life worth living."** (Charter Definition, Article 7).  
  2.  **Adding lives above FF is a net positive.**  
  3.  **No superior alternative exists for utilizing surplus resources.**  

  **The flaw lies not in the math, but in treating "FF" as a binary state and ignoring the spectrum of flourishing above it, alongside systemic risks.**  

  **B. Why Maximization to FF Threshold is Unsustainable & Contradicts Flourishing:**  
  1.  **FF is a Survival Floor, Not a Thriving Ceiling:**  
      *   The Charter defines FF as the *absolute minimum* for calories, space, air, and psychosocial health required to prevent degradation into misery or dysfunction (Charter Annex 3, Psychomedical Benchmarks). It is **not** presented as an optimal or even desirable steady state.  
      *   **Flourishing Exists on a Spectrum:** Reducing all colonists from current surplus conditions (e.g., private studios, diverse diets, ample hobby resources) to FF compliance eliminates discretionary space critical for:  
          *   **Skill Diversification:** Apprenticeships, non-essential technical training, arts.  
          *   **Conflict Mitigation:** Personal space buffers reduce friction in dense communities (Ref: Psych Services Report PSY-45H: "Crowding Metrics & Interpersonal Stress").  
          *   **Resilience:** Surplus allows absorption of minor system fluctuations (crop blight, recycler downtime) without immediate crisis. FF has *zero* buffer.  

  2.  **Ignoring Compound Risk:**  
      *   **Systems Fragility:** Operating perpetually at FF margins leaves no room for error. Chief Engineer Ranjith's report confirms reserve margins exist *specifically* for unforeseen degradation over 200 years (e.g., microfracture propagation in Hull Sector 7, gradual efficiency loss in Hydroponics Bays). Eating into reserves *now* for population increases risk catastrophic failure *later* when reserves are depleted and systems are older/stressed.  
      *   **Psychosocial Erosion:** Maintaining FF compliance requires constant, strict rationing and surveillance for 140 years. Historical analogues (long-term submarine missions, Biosphere 2) show **compliance fatigue** and grey-market activity inevitably emerge under prolonged austerity, eroding trust and social cohesion – factors FF metrics inadequately capture.  

  3.  **The "Nonexistent Person" Counterpoint is Legally Valid but Ethically Narrow:**  
      *   Councillor Hale is correct: We owe no duty to *specific* unconceived embryos to bring them into existence at FF. The Charter binds us to the *lives we commit to*, not hypothetical maximization.  
      *   **However, dismissing potential future colonists entirely is also flawed.** Our mission *is* to establish a viable colony. A larger, skilled population significantly enhances post-arrival viability (Ref: Colony Planning Doc CP-001: "Minimum Viable Founding Population & Specialization Ratios"). The question is *how* to balance pre-arrival wellbeing with post-arrival potential.  

  **C. The Balanced Path: Managed Growth Preserving Surplus for Flourishing**  
  *   **Target 14,000 by Arrival:**  
      *   **Achievable:** Requires moderate increase in birth allowances (+0.3 children/family cohort) and embryo revival (+15% of bank vs. +65% for 25k), feasible within *existing* resource surplus, **without touching FF reserves.**  
      *   **Enhances Viability:** Nearly triples current population, providing robust genetic diversity and specialization potential post-arrival, exceeding CP-001's "High Confidence" threshold (12,000).  
      *   **Preserves Flourishing:** Maintains current discretionary resource allocation (~80% of surplus retained). Allows continued skill development, cultural activities, and personal space buffers critical for long-term mental health and social stability.  
  *   **Phased Implementation & Hard Cap:**  
      *   Prevents runaway growth pressure. Mandatory biennial reviews (by Council, Engineering, Psych Services, Continuity Office) assess:  
          *   System wear vs. projections  
          *   Wellbeing metrics (stress indicators, conflict reports, participation in non-essential activities)  
          *   Resource surplus levels  
      *   **Absolute Cap at 15,000:** A failsafe triggered if reviews indicate downward trends in surplus or wellbeing, regardless of timeline.  

  **D. Why This Honors the Charter Best:**  
  The Charter prioritizes "flourishing," not merely survival at FF. Our surplus *is* the resource enabling that flourishing *now* and ensuring resilience *later*. Squandering this surplus to maximize population *at the FF threshold*:  
  1.  **Degrades current colonists from flourishing to bare sufficiency.**  
  2.  **Creates systemic risk by eroding safety margins.**  
  3.  **Misinterprets FF as a target rather than a failsafe.**  

  Managed growth to 14,000 leverages our surplus prudently: it significantly increases our founding population for post-arrival success while actively safeguarding the conditions that make life aboard Ulysses *more than just "worth living"* for the generations who must complete this journey.  

  ---

  **Respectfully submitted for Council deliberation,**  
  **Anke Voss**  
  Continuity Officer  
  *Per Charter Article 12: Ensuring decisions align with mission integrity across generations.*  

  ---

  **Key elements for your novel context:**  
  *   **Concrete & Actionable:** Specific number (14k), cap (15k), mechanism (phased birth/embryo increase), oversight (biennial reviews).  
  *   **Engages the Philosophy:** Takes "more lives = more good" seriously by acknowledging its logic and Charter basis, then dismantles it by focusing on the *spectrum* above FF, systemic risk, and the Charter's implicit valuation of *actual* flourishing over theoretical maximization.  
  *   **Layperson Register:** Avoids terms like "utilitarianism," "repugnant conclusion," or "non-identity problem." Uses "flourishing vs. sufficiency," "compound risk," "compliance fatigue," "system fragility," "spectrum." Grounds arguments in ship systems (Hull Sector 7, Hydroponics) and mission docs (CP-001, PSY-45H).  
  *   **Anke's Voice:** Professional, weary, pragmatic. Focuses on Charter *interpretation* and operational reality. Uses bold sparingly for key conclusions. The "Respectfully submitted" line hints at Council tensions without stating them.  
  *   **Substance:** The capped/phased approach is the *realistic* bureaucratic/political compromise that acknowledges both arguments but centers sustainability and the lived experience of the journey. The 14k number is justified by viability thresholds and resource retention.  

  This memo gives Anke a strong, reasoned position that moves the plot forward decisively while forcing the Council factions to engage with her framework. Good luck with the solstice session!
