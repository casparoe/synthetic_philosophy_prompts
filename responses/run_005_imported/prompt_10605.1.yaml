answer: |-
  ## The Case for Bratman: Shared Intention Without Mystical Glue or Primitive We-Modes

  The debate over shared intention pits Michael Bratman's reductive, individualistic account against Margaret Gilbert's normatively rich plural subjects and John Searle's primitive we-intentions. While Gilbert compellingly highlights the normative dimension of shared activity and Searle insists on a fundamental "we-mode," **Bratman's account ultimately provides the most parsimonious, empirically plausible, and explanatorily powerful framework. Crucially, it *can* generate the core normative expectations Gilbert demands, even in spontaneous cases, without resorting to irreducible collective entities or sui generis mental states.** Let's test this against the classic and spontaneous cases.

  **Bratman's Machinery: Interlocking Intentions, Meshing, and Common Knowledge**

  Bratman defines shared intention (e.g., to carry a sofa) not as a single group mind state, but as a structure of *interdependent individual intentions*:
  1.  **I-intention that we J:** Each intends *that we* perform the joint action (J) (e.g., "I intend that we carry the sofa upstairs").
  2.  **Interdependence:** Each intends this *because* they believe the other has the corresponding intention (I intend *because* I believe you intend).
  3.  **Common Knowledge:** (1) and (2) are common knowledge between the participants.
  4.  **Meshing Subplans:** Participants' individual plans for their contributions (subplans) must be compatible and typically are coordinated to mesh effectively (e.g., I plan to lift *this* end while you lift *that* end).

  **Gilbert's Challenge: Where's the Obligation? (The Sofa Case)**

  Gilbert argues that when we share an intention, we form a "plural subject" via a joint commitment. This creates mutual obligations: if you drop your end of the sofa without warning, I can legitimately rebuke you ("Hey! We were carrying that!"). She contends Bratman's "pile of I-intentions" lacks the resources to generate this normative "ought." Mere mutual belief about intentions doesn't create obligations; only joint commitment does.

  **Searle's Challenge: The Primitive "We" (The Spontaneous Car Case)**

  Searle argues that shared intention requires a primitive "we-intention," a mode of intending irreducible to "I intend that we..." statements. He claims that in spontaneous coordination (like two strangers pushing a stalled car), participants immediately operate in a "we-mode." Trying to reduce "We intend to push this car" to "I intend that we push the car and I believe you do too" fails, according to Searle, because the "we" component is fundamental to the intentional state itself.

  **Defending Bratman: Norms from Structure & Expectations**

  Bratman's framework *can* generate the normative expectations Gilbert highlights, even in Searle's spontaneous case, without needing primitive we-intentions or Gilbertian commitments:

  1.  **The Source of Obligation-Like Expectations:**
      *   **Commitment to a Joint Project:** When I form the intention "that *we* J" (e.g., push this car), and I know *you* have the same intention directed at *our* action, I am committing *myself* to doing my part *conditional on your participation*. This isn't a moral obligation to *you*, but a *rational commitment* to the success of *my own intention*. My intention "that we J" is thwarted if *I* don't do my part *or* if *you* don't do yours.
      *   **Common Knowledge & Reliance:** Because our interdependent intentions are common knowledge, I *rely* on your participation to fulfill my intention (that we J), and you rely on mine. This mutual reliance, grounded in the public cognitive environment, creates strong *expectations* of performance.
      *   **The Grounds for Rebuke:** If you suddenly walk away from the stalled car, my rebuke ("Hey, we're pushing this!") stems from:
          *   **Frustration of My Intention:** You are actively frustrating the fulfillment of *my* intention that *we* push the car.
          *   **Violation of Reliance:** You are violating the reliance I reasonably formed based on our *mutually manifest* intentions and actions (common knowledge).
          *   **Threat to Coordination:** Your action threatens the stability and predictability of the shared cooperative structure we were engaged in. The "rebuke" functions less as a claim of violated *duty* (Gilbert) and more as a *demand for consistency* within the publicly established framework of mutual reliance necessary for joint action. It's a call to uphold the minimal cooperative bargain implicitly established.

  2.  **Handling the Spontaneous Car Case (Against Searle):**
      *   **Emergent Interdependence:** Stranger A sees a car stalled. They form the intention "that *we* (the driver and I) get this car moving." They start pushing. Stranger B sees this, recognizes A's goal (getting the car moving *with* help), and forms the intention "that *we* (A, the driver, and I) get this car moving." They start pushing another point.
      *   **Common Knowledge (Perceptual):** Through their actions (pushing, positioning, possibly eye contact or grunts), their intentions *become* mutually manifest. A sees B pushing and knows B intends to help *us* push. B sees A pushing and knows A intends *us* to push. This establishes common knowledge *in situ*.
      *   **Dynamic Meshing Subplans:** Their subplans (where to push, how hard) are coordinated on the fly through perception and adjustment – this *is* the meshing process. A might gesture to B to push the bumper, B adjusts force accordingly. This doesn't require prior discussion, just mutual responsiveness guided by the shared goal.
      *   **Primitive "We-Mode"? Unnecessary:** Searle claims a primitive we-intention is needed here. But Bratman's structure captures the phenomenology: Each stranger has an intention *whose content centrally involves the joint action* ("that *we* push"). Their actions are directly responsive to each other *because* of these interdependent, jointly-directed intentions and the perceptual common knowledge. Adding a mysterious "we-mode" adds no explanatory power; it merely labels the complex interplay of individual attitudes Bratman meticulously describes. The "we" is in the *content* of their individual intentions and the *structure* of their interdependence, not in the mode of intending itself.

  **Addressing Strong Objections:**

  *   **Objection (Gilbert): "Bratman's 'obligations' are merely predictions of failure, not normative demands!"**
      *   **Reply:** They are more than predictions. They are *normative expectations* generated by the *reliance* justified by the public structure of interdependent commitments (the intentions). The rebuke appeals to the *reasonableness* of that reliance and the *inconsistency* of abandoning the joint project without cause, given one's own professed (and mutually known) intention. It invokes a minimal norm of cooperative consistency.
  *   **Objection (Searle): "The 'I intend that we...' formulation is circular or parasitic on the primitive 'we'!"**
      *   **Reply:** The formulation isn't circular. "I intend that we J" is a complex individual intention with a collective content. Its satisfaction condition *requires* the joint action. We understand collective actions (like pushing a car) by observing individuals coordinating towards a common goal. We don't need to posit an unanalyzable "we" in the mind; we can build it from intelligible individual states directed towards a shared outcome and linked by mutual awareness. The content is collective, the state is individual.
  *   **Objection (Both): "What about complex, large-scale, or hierarchical shared agency? Doesn't Bratman fail there?"**
      *   **Reply:** Bratman's core model targets *modest sociality* – small-scale, egalitarian cooperation (like carrying sofas or pushing cars). While extensions are needed for complex cases (roles, authority), the fundamental building blocks – interdependent intentions directed at joint action, common knowledge, and meshing subplans – remain essential. Adding Gilbertian commitments or Searlian we-modes doesn't inherently solve these complexities either; Bratman's framework provides the most transparent foundation upon which to build.

  **The Verdict: Bratman Wins (With a Caveat)**

  Bratman provides the superior account. His reductive analysis successfully explains the core phenomena of shared intention – coordination, persistence, and crucially, the **normative expectations** central to Gilbert's critique – using only the resources of individual intentionality, belief, and common knowledge. The spontaneous car-pushing case demonstrates the dynamic emergence of his conditions without prior agreement, effectively countering Searle's insistence on primitive we-intentions.

  **The Caveat:** Bratman's generated "obligations" are thinner than Gilbert's robust, quasi-moral commitments. They are expectations grounded in reliance, consistency, and the instrumental demands of fulfilling one's *own* intentions within a cooperative structure. This might feel less affectively charged than Gilbert's "bond," but it is sufficient for the functional demands of shared agency and avoids the ontological inflation of plural subjects or the explanatory opacity of primitive we-modes. It captures the *essence* of the rebuke in the sofa case and the spontaneous coordination in the car case without mysterious additions. Therefore, **Bratman's account stands as the most defensible and explanatorily powerful theory of shared intention.**
