  ## The Measure of Convention: How Aristotle's Nomisma Both Sustains and Subverts His Case Against Usury

  Aristotle's twin critiques of exchange justice in *Nicomachean Ethics* V.5 and unnatural wealth-getting (chrematistike) in *Politics* I present a compelling interpretive puzzle. On one hand, *NE* V.5 portrays money (nomisma) as a purely conventional tool, a practical but imperfect proxy for the true measure of exchange: need (chreia). On the other, *Politics* I condemns usury (tokos) as the "most unnatural" form of wealth-getting because it violates money's inherent, nature-given sterility. Does the concession of money's conventionality in *NE* V.5 ultimately strengthen or undermine the naturalness argument against usury? While the tension is real, a careful analysis reveals that the conventional nature of money **strengthens** Aristotle's core ethical critique of chrematistike as a perversion of purpose, but simultaneously **undermines** the specific biological analogy (money's "barrenness") he uses to condemn usury. The surviving core of the argument lies in teleology, not biology.

  **Strengthening the Critique: Convention as the Site of Vice**

  A powerful reading argues that the conventionality of money, far from undermining the *Politics* I argument, precisely *explains* the pathology of chrematistike and usury. On this view:

  1.  **The Conventional Proxy's True Function:** Money's purpose in *NE* V.5 is strictly instrumental. It exists *nomos* (by convention/law) to facilitate the satisfaction of natural needs within the community (*polis* or *oikos*). Its value is entirely derivative, standing in for the real, underlying measure: chreia. Aristotle explicitly states money is "a sort of representative of demand" (*NE* 1133a29) and "all goods must have a price set on them; for then there will always be exchange, and if so, association of man with man" (*NE* 1133b16-18). Exchange, and thus the money enabling it, serves natural human association and need-fulfillment.
  2.  **Chrematistike as Misplaced Concreteness:** The vice of chrematistike, especially in its usurious form, consists precisely in forgetting or denying this derivative, conventional status. It treats money *as if it were* the primary reality, the very substance of wealth, rather than a token representing real use-value tied to need. The moneylender treats money not as a means to acquire goods satisfying needs, but as an end in itself capable of self-generation. This is a profound category error.
  3.  **Violating Teleology:** Aristotle's concept of nature is deeply teleological. A thing's nature is defined by its proper end or function (*telos*). Money's *telos*, established by its conventional role, is to serve as a medium for acquiring goods needed for the good life of the household and city. Usury perverts this *telos*. It severs money from its instrumental function in facilitating the exchange of useful goods (*NE* V.5) and household provisioning (*Pol.* I.8-10), turning it into an object of acquisition for its own sake. This perversion *is* the unnaturalness. The conventional origin of money doesn't negate its having a proper function within human social life; it defines it. Mistaking the conventional token (money) for the natural end (need-fulfillment and virtuous living) is the core unnatural act. As Aristotle states, chrematistike arises "from experience and art" (*Pol.* 1257a4) – the very realm of convention – but perverts that art's purpose.

  On this reading, the *NE* V.5 concession highlights *why* usury is unnatural: it exemplifies the fundamental error of treating a conventional instrument as possessing inherent, independent generative power, thereby divorcing economic activity from its natural foundation in human need and community.

  **Undermining the Analogy: The Erosion of Nature's Ground**

  However, the conventionality of money presents a significant challenge to the *specific form* of Aristotle's argument against usury, particularly his reliance on the biological metaphor of sterility:

  1.  **The Shaky Foundation of "Natural" Function:** If money's existence and value are purely conventional (*nomos*), how can it possess a *natural* function or characteristic? Its "function" is assigned by human agreement for practical purposes, not discovered in its inherent properties like the function of an acorn is to become an oak. Aristotle himself notes money's value is not fixed by nature but fluctuates (*NE* 1133b12-13). To then claim it has a *natural* characteristic (barrenness) that can be violated seems contradictory. If money is conventional all the way down, its "nature" is simply whatever humans agree its role to be. Condemning usury as "unnatural" in a strong biological sense becomes difficult when the entity in question lacks a fixed nature independent of convention.
  2.  **The Failure of the Biological Analogy:** The core of Aristotle's specific condemnation of tokos is the analogy to sterility: "The most hated sort [of wealth-getting], and with the greatest reason, is usury, which makes a gain out of money itself, and not from the natural object of it. For money was intended to be used in exchange, but not to increase at interest... Of all modes of getting wealth this is the most unnatural" (*Pol.* 1258b2-8). This relies on money having a fixed, intrinsic nature akin to a living thing – it is "barren" and *cannot* breed. But if money is merely a conventional token representing variable need, the claim that it *cannot* "breed" loses its force. Convention *could* (and historically did) define tokens that accrue interest. The analogy crumbles because a conventional token doesn't have biological properties. Its "inability" is not natural but conventional; we *could* agree tokens breed, even if Aristotle thinks we *should not*.
  3.  **Condemning Convention with Nature?** The argument risks using the concept of "nature" illegitimately. It invokes a strong, fixed "nature" for money to ground the condemnation of usury, but this "nature" (sterility) is precisely what the *NE* V.5 account seems to deny by making money's essence conventional. The argument against usury appears to require a natural anchor that the theory of money itself pulls up. It might only condemn *all* conventional uses of money that treat it as an end, not specifically usury as uniquely unnatural.

  On this reading, the *NE* V.5 concession fundamentally destabilizes the biological grounding of the usury argument. If money's being is conventional, it cannot simultaneously possess an immutable natural characteristic like sterility that specific practices violate.

  **A Defensible Hybrid: Teleology Survives, Biology Falters**

  The strongest resolution acknowledges the force of both readings but defends a modified Aristotelian position. **The concession in *NE* V.5 strengthens the *teleological* core of the critique against chrematistike but significantly undermines the *biological analogy* used specifically against usury.**

  1.  **The Enduring Core: Teleological Perversion:** Aristotle's fundamental insight survives: economic activity has a natural *telos* – provisioning the household (*oikonomia*) to enable the good life (*eudaimonia*). This *telos* is natural, rooted in human needs and sociality. Money, as a conventional invention, is properly subordinate to this natural end. Chrematistike, including usury, is vicious because it perverts this natural hierarchy. It makes the accumulation of the conventional instrument (money) the end in itself, divorcing economic activity from its natural purpose of need-fulfillment (*Pol.* 1257b40-1258a1). The *NE* V.5 account *supports* this by clarifying money's derivative, instrumental status. Usury is the *paradigm* of this perversion because it seeks gain *solely* through the manipulation of the token itself, utterly detached from the production or exchange of actual goods satisfying needs. It represents the purest form of mistaking the conventional means for the natural end. This teleological perversion constitutes its unnaturalness.
  2.  **The Casualty: The Sterility Analogy:** However, the argument that usury is unnatural *because money is "barren by nature"* does not withstand the *NE* V.5 concession. A conventional token doesn't have a reproductive nature. Its "barrenness" is not a biological fact but a *consequence* of its conventional purpose. Money doesn't breed *because* its *telos* is exchange, not generation; it's not barren *like* a mule. The unnaturalness lies in the *misapplication* of the token, trying to make it perform a function (self-generation) utterly alien to its defined purpose, thereby severing it completely from the natural economy of needs. The metaphor of "breeding" is vivid but logically superfluous and weakened by the conventional account. We condemn usury because it perverts purpose, not because it attempts biological impossibility with a token.
  3.  **Surviving Scope:** This hybrid view retains the condemnation of usury as the *most extreme* form of chrematistike, the purest expression of treating money as an end. It also retains the distinction between natural wealth-getting (managing resources for the household) and unnatural wealth-getting (accumulation for its own sake). What it jettisons is the notion that usury violates a specific *biological* law inherent in money's substance. The argument now rests solely on the violation of money's *assigned, conventional function* within the natural teleology of human life. Usury is still "most unnatural," but because it represents the *complete* detachment of acquisition from need, not because money magically defies biology.

  **Verdict**

  Aristotle's admission in *NE* V.5 of money's conventional and imperfect nature ultimately **strengthens the ethical heart of his argument against chrematistike** by highlighting how its vice consists in the fundamental category error of mistaking a conventional tool for a natural end. This clarifies why usury, as the purest form of seeking gain *from money itself*, is the epitome of this perversion. However, this same concession **significantly undermines the specific biological justification** ("barrenness") he employs against usury in *Politics* I. A conventional token lacks the fixed natural properties required to sustain such an analogy. The enduring power of Aristotle's critique lies not in a dubious claim about money's reproductive capacities, but in his profound insight into the teleological perversion inherent in divorcing economic activity from the natural ends of human need, household provision, and the good life. The *NE* V.5 account, by demystifying money, ironically makes this perversion starker and the ethical condemnation more compelling, even as it forces us to abandon the appealing but flawed sterility metaphor.
