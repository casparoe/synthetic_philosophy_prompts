  I brought it up with my older sister who's away at college and she just said "obviously it's different" but couldn't actually explain why, which lol wasn't super helpful. So is there an actual real difference between silently reading a word, saying it out loud as a direct quote with zero intention of insulting anyone, and saying it TO insult someone? Or is my teacher just picking an arbitrary line to feel safe, and it doesn't really hold up if you think about it?
