answer: |-
  You've hit on one of the most fascinating and contentious points in Nyāya epistemology! Your intuition is sharp—there *is* a tension here, but the Nyāya position is more nuanced than a simple appeal to authority. Let's break it down:

  ### 1. **The Core Nuance: Śabda Isn't *Just* "Authority Says So"**
     - **Competence & Truthfulness Requirement (for Non-Vedic Śabda):** For everyday testimony (e.g., "Your friend says there's milk in the fridge"), Nyāya imposes strict conditions. The speaker must be:
       - *Āpta*: Competent/knowledgeable about the subject.
       - *Satya-vādī*: Truthful/honest (no intent to deceive).
       - The content must be *not contradicted* by perception (*pratyakṣa*) or inference (*anumāna*).
     - **Knowledge Transmission, Not Blind Faith:** Śabda generates knowledge *when you understand the meaning of the words* and *accept the statement based on the speaker's reliability*. It's a cognitive event triggered by linguistic comprehension, not mere deference.

  ### 2. **The Vedic Exception: Why It's *Not* a Hypocritical Blind Spot**
     Nyāya treats Vedic testimony differently based on unique metaphysical claims:
     - **Apauruṣeyatva (Authorlessness):** The Vedas aren't authored by any human (*puruṣa*) or even by God (*Ishvara*, whom Nyāya accepts). They are eternal, authorless truth "heard" (*śruti*) by sages. This removes the need to verify *āptatva* or *satya-vādītva* – there *is no fallible author* whose competence or honesty could be doubted.
     - **Content Beyond Ordinary Means:** Much Vedic content (e.g., rituals for specific cosmic results, nature of *mokṣa*) concerns supersensible (*atīndriya*) realities inaccessible to perception or inference. Nyāya argues these truths *require* a unique, infallible source.
     - **Soteriological Necessity:** Knowledge of *dharma* (duty) and *mokṣa* (liberation) is essential for human flourishing but impossible to gain empirically. Only an infallible source can provide it reliably. This makes Vedic śabda a *sui generis* pramāṇa.

  ### 3. **Is This Still Circular? The Nyāya Defense**
     Naiyāyikas like Gaṅgeśa and Udayana anticipated this objection:
     - **Not *Pure* Circularity:** They don't *solely* rely on the Vedas to prove the Vedas. They argue the *apauruṣeyatva* and consistency of the Vedas can be *inferred* from:
       - Their unique linguistic structure and eternal preservation.
       - The impossibility of humans composing such profound, consistent texts about the supersensible.
       - The *successful practical results* of following Vedic injunctions (e.g., performing a specific ritual yields the promised result).
     - **A Foundationalist Move:** Within their system, Vedic śabda is treated as a *basic* source of knowledge for certain domains, much like perception is basic for empirical facts. You can't "prove" perception using perception; similarly, you can't "prove" Vedic śabda using something more fundamental *for its unique domain*.

  ### 4. **Does the Machinery Apply to Everyday Testimony?**
     **Absolutely, and this is key!** The *mechanism* of śabda is identical:
     1. **Utterance:** Hearing meaningful words/sentences.
     2. **Comprehension:** Understanding the semantic content.
     3. **Acceptance:** Based on *presumed* reliability of the speaker (conditioned by prior knowledge of their competence/honesty).
     - **The Difference:** For non-Vedic śabda, this acceptance is **provisional and fallible**. It can be overturned by:
       - Contradiction by perception/inference (e.g., your friend says "milk in fridge," you look, it's empty).
       - Discovery the speaker is incompetent/lying.
     - **For Vedic śabda,** acceptance is **deemed infallible** due to *apauruṣeyatva*, placing it beyond empirical contradiction *for its specific domain*.

  ### 5. **Is it a "Glaring Blind Spot"? Critiques & Nuances**
     - **Internal Critiques:** Other darśanas (especially Mīmāṃsā, but also within Nyāya) debated *apauruṣeyatva* fiercely. Later Naiyāyikas like Jayanta Bhaṭṭa (Nyāyamañjarī) acknowledged the *apparent* circularity but defended it as necessary for the system's coherence.
     - **External Critique:** From a modern critical perspective, yes, granting *any* text complete epistemic immunity based on its claimed origin *is* problematic. It *can* function as a theological presupposition protected from falsification.
     - **Nyāya's Saving Grace:** Their *rigorous defense* of everyday śabda's fallibility and conditions shows they understood the risks of testimony. The Vedic case is a carefully argued *exception*, not a general endorsement of authority. Their hetvābhāsa system focuses on *inference*; they might argue Vedic śabda bypasses inference entirely, so fallacies don't directly apply.

  ### In Conclusion
  Your logic class was right: "X is true because the text says so" *is* fallacious **for human testimony**. Nyāya agrees! But they carve out a unique epistemic category for Vedic śabda based on:
  1.   **Apauruṣeyatva** (removing the unreliable author).
  2.   **Domain-Specific Necessity** (supersensible truths).
  3.   **Foundational Status** within their metaphysical system.

  Whether you find this *convincing* depends on accepting their premises (especially *apauruṣeyatva*). It's not a *blind spot* in their logic so much as a *deliberate, argued theological-epistemological commitment*. The machinery for *fallible, everyday testimony* remains robust and sophisticated. The tension you feel is real—it reflects the boundary where Nyāya's razor-sharp logic meets its theological foundations. Great catch – this is exactly the kind of critical engagement that makes classical Indian philosophy so rewarding!
