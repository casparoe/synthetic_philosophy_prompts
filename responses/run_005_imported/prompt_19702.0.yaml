answer: |-
  Here’s a rigorous reconstruction of Harsanyi’s Aggregation Theorem as a defense of utilitarianism, highlighting how it constrains non-utilitarian theories. The argument forces critics into rejecting either foundational rationality axioms or the uncontroversial Pareto principle.

  ### **Core Premises & Definitions**
  1.  **Individual vNM Rationality:**
      *   Each individual \(i\) (\(i = 1, 2, ..., n\)) has preferences over uncertain prospects (lotteries) \(\mathcal{L}\) satisfying the von Neumann-Morgenstern (vNM) axioms:
          *   *Completeness:* \(\forall L, L' \in \mathcal{L}\), \(L \succsim_i L'\) or \(L' \succsim_i L\) (or both).
          *   *Transitivity:* \(\forall L, L', L'' \in \mathcal{L}\), if \(L \succsim_i L'\) and \(L' \succsim_i L''\), then \(L \succsim_i L''\).
          *   *Continuity:* \(\forall L, L', L'' \in \mathcal{L}\) where \(L \succ_i L' \succ_i L''\), \(\exists \alpha \in (0,1)\) such that \(\alpha L + (1-\alpha)L'' \sim_i L'\).
          *   *Independence:* \(\forall L, L', L'' \in \mathcal{L}, \forall \alpha \in (0,1]\), \(L \succsim_i L'\) *iff* \(\alpha L + (1-\alpha)L'' \succsim_i \alpha L' + (1-\alpha)L''\).
      *   **Consequence:** Each \(i\) has a utility function \(u_i: \mathcal{L} \to \mathbb{R}\) satisfying the *Expected Utility Property*: \(U_i(L) = \sum_{k} p_k u_i(x_k)\) for lottery \(L\) with outcomes \(x_k\) probabilities \(p_k\). This \(u_i\) is unique up to positive affine transformations (\(u_i' = a_i u_i + b_i, a_i > 0\)).

  2.  **Social vNM Rationality:**
      *   The social planner's preferences \(\succsim_S\) over the *same* set of uncertain prospects \(\mathcal{L}\) also satisfy the vNM axioms (Completeness, Transitivity, Continuity, Independence).
      *   **Consequence:** There exists a social utility function \(U_S: \mathcal{L} \to \mathbb{R}\) satisfying the *Expected Utility Property*. This \(U_S\) is unique up to positive affine transformations.

  3.  **Pareto Principle:**
      *   *Weak Pareto:* If every individual strictly prefers lottery \(A\) to lottery \(B\) (\(A \succ_i B\) for all \(i\)), then society strictly prefers \(A\) to \(B\) (\(A \succ_S B\)).
      *   *Strong Pareto (Implied):* If no individual prefers \(B\) to \(A\) (\(A \succsim_i B\) for all \(i\)) and at least one individual strictly prefers \(A\) to \(B\) (\(A \succ_j B\) for some \(j\)), then society strictly prefers \(A\) to \(B\) (\(A \succ_S B\)).

  ### **The Argument: Step-by-Step Derivation**

  1.  **Social Utility Depends Only on Individual Utilities (Pareto):**
      *   Consider two lotteries \(A\) and \(B\).
      *   Suppose \(u_i(A) = u_i(B)\) for every individual \(i\). This means \(A \sim_i B\) for all \(i\) (by definition of \(u_i\) representing \(i\)'s preferences).
      *   By Strong Pareto (since no strict preference for either), this implies \(A \sim_S B\).
      *   **Conclusion:** If two lotteries yield the same utility for every individual, they are socially indifferent. Therefore, the *only* features of a lottery that matter for social preference are the utility levels it assigns to each individual. Formally, \(U_S\) must be a function of the vector of individual utilities: \(U_S(A) = V(u_1(A), u_2(A), ..., u_n(A))\) for some function \(V: \mathbb{R}^n \to \mathbb{R}\).

  2.  **The Function V Must be Linear (Social vNM + Pareto):**
      *   Consider three lotteries: \(A\), \(B\), and a compound lottery \(C = \alpha A + (1-\alpha)B\) for some \(\alpha \in [0,1]\).
      *   By the Expected Utility Property of individual utilities (Premise 1): \(u_i(C) = \alpha u_i(A) + (1-\alpha)u_i(B)\) for every individual \(i\).
      *   From Step 1, \(U_S(A) = V(u_1(A), ..., u_n(A))\), \(U_S(B) = V(u_1(B), ..., u_n(B))\), and \(U_S(C) = V(u_1(C), ..., u_n(C)) = V(\alpha u_1(A) + (1-\alpha)u_i(B), ..., \alpha u_n(A) + (1-\alpha)u_n(B))\).
      *   By the Social vNM Rationality (Premise 2), the social utility function \(U_S\) satisfies the Expected Utility Property: \(U_S(C) = U_S(\alpha A + (1-\alpha)B) = \alpha U_S(A) + (1-\alpha)U_S(B)\).
      *   Substituting the expressions in terms of \(V\): \(V(\alpha u_1(A) + (1-\alpha)u_1(B), ..., \alpha u_n(A) + (1-\alpha)u_n(B)) = \alpha V(u_1(A), ..., u_n(A)) + (1-\alpha) V(u_1(B), ..., u_n(B))\).
      *   **Conclusion:** The function \(V\) must satisfy *linearity* (more precisely, *affineness*) in its arguments: \(V(\alpha \mathbf{u_A} + (1-\alpha)\mathbf{u_B}) = \alpha V(\mathbf{u_A}) + (1-\alpha) V(\mathbf{u_B})\) for any \(\alpha \in [0,1]\) and any utility vectors \(\mathbf{u_A}, \mathbf{u_B} \in \mathbb{R}^n\). This is a direct consequence of the social Independence axiom applied via the EU property.

  3.  **The Linear Function V Must Be a Weighted Sum (Consequence of Affineness):**
      *   A function \(V: \mathbb{R}^n \to \mathbb{R}\) that is affine (i.e., satisfies the linearity condition derived in Step 2 for all \(\alpha\), \(\mathbf{u_A}\), \(\mathbf{u_B}\)) must be of the form: \(V(\mathbf{u}) = \sum_{i=1}^{n} w_i u_i + c\), where \(\mathbf{u} = (u_1, ..., u_n)\), \(w_i \in \mathbb{R}\), and \(c \in \mathbb{R}\).
      *   **Constant \(c\) is Irrelevant:** Since \(U_S\) represents social preferences, and utility functions are unique up to affine transformations (Premise 2), the constant \(c\) can be set to zero without changing the underlying preference ordering. So, \(V(\mathbf{u}) = \sum_{i=1}^{n} w_i u_i\).
      *   **Weights \(w_i\) Must Be Non-Negative (Weak Pareto):**
          *   Consider a lottery \(A\) where individual \(i\) gets utility \(\delta > 0\) more than in lottery \(B\), and all other individuals get the *same* utility in \(A\) and \(B\). Thus, \(\mathbf{u_A} = (u_1(B), ..., u_i(B) + \delta, ..., u_n(B))\).
          *   Individual \(i\) strictly prefers \(A\) to \(B\) (\(A \succ_i B\)), while all others are indifferent (\(A \sim_j B\) for \(j \neq i\)).
          *   By Strong Pareto, society must strictly prefer \(A\) to \(B\) (\(A \succ_S B\)).
          *   Therefore, \(V(\mathbf{u_A}) > V(\mathbf{u_B})\).
          *   Substituting the form: \(\sum_{j} w_j u_j(A) > \sum_{j} w_j u_j(B)\) \(\implies w_i (u_i(B) + \delta) + \sum_{j \neq i} w_j u_j(B) > w_i u_i(B) + \sum_{j \neq i} w_j u_j(B)\) \(\implies w_i \delta > 0\).
          *   Since \(\delta > 0\), this implies \(w_i > 0\).
      *   **Conclusion:**\(U_S(L) = \sum_{i=1}^{n} w_i u_i(L)\) with \(w_i > 0\) for all \(i\). This is a **weighted utilitarian social welfare function**.

  ### **The Force of the Argument Against Non-Utilitarians**
  The theorem demonstrates that **any social preference ordering over risky prospects satisfying the three premises *must* evaluate lotteries by calculating the expected value of a weighted sum of individual utilities.** Non-utilitarian theories proposing different social evaluations under risk are forced to reject at least one premise:

  1.  **Reject Individual vNM Rationality:** Argue that individuals are irrational or that vNM axioms are descriptively/prescriptively invalid for people. This is unpalatable for critics (like prioritarians/egalitarians) who typically accept individual rationality and build ethical theories upon it. It also undermines the normative foundation of their own distributive concerns.
  2.  **Reject Social vNM Rationality:** Argue that social preferences shouldn't satisfy the Independence axiom or the EU property. This is the most common route for critics.
      *   **Prioritarians/Egalitarians:** They argue that society *should* care about the *distribution* of utility, not just its sum. They claim the *identity* of who gets a benefit in different states of the world matters ethically. The classic example is **Diamond's Critique**:
          *   *State 1 (Prob 0.5):* Person A gets 1 util, Person B gets 0.
          *   *State 2 (Prob 0.5):* Person A gets 0, Person B gets 1.
          *   *Alternative:* Person A gets 1 util for sure, Person B gets 0 for sure.
          *   vNM Social Independence forces indifference between the lottery and giving the good to A for sure (both have expected social utility \(0.5w_A + 0.5w_B\)). A Diamond-egalitarian society strictly *prefers* the lottery because it gives B a fair chance, violating Independence.
      *   **Cost:** Rejecting Social vNM rationality means social preferences violate widely accepted norms of rational choice under uncertainty. The social planner becomes "irrational" in the same way an individual violating vNM axioms is vulnerable to Dutch books or money pumps. Can a theory of *distributive justice* be founded on rejecting rational choice axioms?
  3.  **Reject the Pareto Principle:** Argue that unanimous individual preferences (especially weak/strict Pareto) shouldn't dictate social preferences.
      *   **Prioritarians/Egalitarians:** Might argue that if a change benefits the well-off without harming the worst-off, but *increases inequality*, it could be socially undesirable, violating Weak Pareto. Or, that giving a small benefit to a well-off person might be socially worthless even if no one is harmed.
      *   **Cost:** Rejecting Pareto, especially Weak Pareto, is profoundly counterintuitive and violates a bedrock principle of welfarism (that social goodness supervenes on individual goodness). It suggests society could knowingly choose an option everyone finds worse, which seems ethically indefensible.

  ### **Conclusion for Your Paper: The Utilitarian Trilemma**
  Harsanyi's theorem presents non-utilitarian theories of distributive justice under risk with a **trilemma**. To avoid the utilitarian conclusion (\(U_S = \sum w_i u_i\)), they must abandon one of three pillars:

  1.  **The rationality of individual choice** under uncertainty (vNM axioms for individuals).
  2.  **The rationality of social choice** under uncertainty (vNM axioms for the social planner).
  3.  **The fundamental welfarist principle** that social preferences should respect unanimous individual strict preferences (Pareto).

  Each abandonment carries significant normative costs. Abandoning individual rationality undermines the basis for welfarism itself. Abandoning social rationality makes the theory vulnerable to charges of inconsistency under uncertainty. Abandoning Pareto sacrifices the core link between individual and social good. 

  Therefore, Harsanyi's theorem is not merely a technical result; it is a powerful argument that **any coherent, Paretian, and rational (in the vNM sense) approach to social decisions under risk *must* be a form of weighted utilitarianism.** Critics who wish to incorporate distributional concerns directly into the evaluation of *risky prospects* are forced into a position that appears, from the perspective of the theorem's axioms, as a form of technical irrationality—either in how individuals form preferences, how society aggregates them under uncertainty, or in how society relates to individual welfare. This constitutes a unique and potent formal defense of utilitarianism in the domain of risk and uncertainty.
