answer: |-
  You've pinpointed a classic and profound interpretive puzzle in Locke's *Essay*—one that reveals crucial nuances in his theory of ideas and perception. The tension between Locke's doctrine of "common sensibles" (Book II, Ch. V) and his answer to Molyneux (Book II, Ch. IX) is genuine, but Locke *can* be defended with careful attention to his distinctions. Here's a detailed reconstruction of his position and how the two passages cohere:

  ### 1. **Locke's Doctrine of "Common Sensibles" (Book II, Ch. V)**
     - **The Claim:** Locke states that ideas like **space, figure (shape), rest, and motion** are "ideas we get by more than one sense." They are "common sensibles" because they can be perceived *both* by sight and touch.
     - **Key Implication:** This suggests a *single idea* (e.g., "cubical figure") is accessible via multiple sensory channels. The idea of a cube isn't inherently visual *or* tactile; it's an abstractable property of external objects detected by different senses.

  ### 2. **Locke's Answer to Molyneux (Book II, Ch. IX)**
     - **The Verdict:** The newly sighted man *cannot* visually distinguish the cube from the sphere without prior tactile experience. He lacks the "experience" that what affects touch "so or so" must affect sight "so or so."
     - **Core Argument:** Tactile and visual experiences are distinct *modes of perception* delivering different phenomenal content. Recognizing that the *same object* causes both requires learned association.

  ### 3. **The Apparent Tension**
     If the idea of "cubical figure" is *the same idea* obtained through either sense, why can't the blind man immediately recognize the cube visually? Shouldn't the idea he acquired through touch simply be activated by the visual input?

  ### 4. **Resolving the Tension: Locke's Nuanced View**
  Locke's solution hinges on **three key distinctions** in his epistemology:

     - **A. Simple Ideas vs. Judgments of Identity:**  
       While *figure itself* is a common sensible (a property of objects), the **simple ideas** delivered by sight and touch are *phenomenally distinct*:
       - **Touch:** Delivers ideas of pressure, solidity, texture.
       - **Sight:** Delivers ideas of light, color, two-dimensional patterns.
       The blind man has the idea of "cubical figure" *as derived from touch* (tactile solidity, angles pressing unevenly). When he sees, he receives *visual* simple ideas (e.g., a pattern of light/dark, colors, flat shapes with angles). He lacks the **learned judgment** that these *visual patterns* signify the *same objective property* as his *tactile experiences*.

     - **B. The Role of "Experience" (Association):**  
       Locke's "experience" isn't about acquiring *new simple ideas* of figure. It’s about forming **associative links** between:
       - The *tactile idea* of a cube (uneven pressure, angles),
       - The *visual idea* of a cube (a complex pattern of lines, shadows, and angles in a 2D field),
       - And the *judgment* that these disparate sensory experiences denote the *same object in the world*.  
       The newly sighted man hasn’t yet correlated the *phenomenal look* of a cube with its *phenomenal feel*. Without this associative "experience," the visual input is just an unfamiliar array of colors and shapes.

     - **C. The Abstraction Gap:**  
       Locke holds that we *abstract* the idea of "figure" from sensory particulars. But abstraction requires prior sensory input. The blind man abstracted "cubical figure" *from touch alone*. Visually, he hasn’t yet abstracted figure *from sight* or linked it to the tactile abstraction. As Locke states in II.ix.8:  
       > *"He has not yet obtained the experience, that what affects his touch so or so, must affect his sight so or so."*  
       The "must" here is epistemic, not metaphysical. He doesn’t know *how* the figure he knows by touch *appears* to sight.

  ### 5. **Reconciling with "Common Sensibles"**
     - **Ontological vs. Epistemological:**  
       "Common sensibles" are **objective properties** of objects (e.g., a cube *has* a figure). But accessing these properties *through sensation* requires **sense-specific processing**.  
     - **No Innate Cross-Modal Link:**  
       Locke rejects innate ideas. The *unity* of common sensibles isn't given a priori; it's learned through repeated co-occurrence of visual/tactile experiences with the same object.  
     - **Textual Evidence:**  
       In II.v, Locke says we get ideas of figure *by* sight and touch—not that the ideas are *identical* across senses. The *referent* (the cube’s shape) is the same, but the *sensory modes* differ.  
       In II.ix, he emphasizes that the *delivery mechanisms* (e.g., "a protuberant angle" pressing the hand vs. "appearing to the eye") are distinct and require correlation.

  ### 6. **Locke's Solution in His Own Terms**
     The missing "experience" is **associative knowledge** linking two sets of sensory ideas to a single external cause. The blind man has:
     - **Idea A (Tactile Cube):** Complex idea from touch (solidity, angles, pressure gradients).
     - **Idea B (Visual Cube):** New complex idea from sight (patterns of light, color, 2D contours).  
     He lacks **Idea C:** The *judgment* that Idea A and Idea B are caused by the *same type of object*. This judgment is built from repeated *co-experience* (e.g., seeing an object while touching it).

  ### Conclusion: Coherence and Tension
  - **Defense of Locke:** The two passages *can* be reconciled. "Common sensibles" denote objective properties detectable by multiple senses, but *recognizing identity across senses* requires empirical association. Molyneux’s man fails because he hasn’t built the associative link.  
  - **Residual Tension:** Locke’s language in II.v *suggests* a stronger unity than his II.ix answer allows. He might overstate the immediacy of "common sensibles," but his core empiricist psychology (no innate connections, ideas derived from sensation) demands the II.ix answer.  
  - **Why Commentators See Awkwardness:** Some (e.g., Berkeley, modern sensory substitution theorists) argue that if figure were truly "common," cross-modal transfer *should* be immediate. Locke’s insistence on learned association reveals that his "common sensibles" are more conceptually abstract than sensorily unified.

  ### Key Takeaway for Your Seminar
  Locke’s answer to Molyneux is consistent with his empiricism: **all knowledge of cross-modal identity is learned, not given.** The "common sensible" of figure is an abstraction *from* sensory experiences, not a pre-formed idea automatically activated by either sense alone. The tension arises because Locke’s II.v phrasing hints at a direct perceptual unity he later denies. Your professor is right to note the awkwardness—but Locke’s system has the resources to resolve it by prioritizing *association* over innate or direct cross-modal access. Bring this nuanced reconciliation to your seminar; it acknowledges the tension while defending Locke’s coherence.
