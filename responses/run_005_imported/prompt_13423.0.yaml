answer: |-
  ## The Silent Promise: A Dialogue on Binding Words

  **Characters:**  
  *   **TAYLOR:** Defends a practice-based account (Hume/Rawls/Hart tradition)  
  *   **ALEX:** Defends an assurance-based account (Scanlon tradition)  

  **Setting:** A quiet corner of a university library, surrounded by towering bookshelves.

  **(The dialogue begins after some initial pleasantries about the nature of obligation.)**

  **TAYLOR:** ...so you see, Alex, the obligation to keep a promise isn't some mystical force. It arises *because* we participate in a profoundly beneficial social practice. When I say "I promise," I invoke a complex convention – like Rawls' rules of a game or Hart's social rules. This practice of mutual trust allows us to coordinate, plan, rely on each other. But I can't reap the *benefits* of this system – the ability to make others rely on me, to secure cooperation – while simultaneously flouting its core rule: *keeping* the promises I make. It's unfair, a kind of free-riding. The obligation is conventional, rooted in the utility and fairness of the practice itself.

  **ALEX:** I find that picture incomplete, Taylor. It makes the obligation hostage to the health of the practice and the presence of an audience. Take Scanlon's view: the core wrong in breaking a promise isn't undermining a convention, it's violating a very specific moral principle – Principle F. When you deliberately and openly *invite* someone to form an expectation that you will do X, and they form that expectation *because* of your assurance, you create a duty not to disappoint that expectation. The obligation arises directly from the *relationship* created by the assurance itself, from the intentional creation of reliance. No wider social edifice is strictly necessary.

  **TAYLOR:** An intriguing counterpoint, Alex. But let's test both views against a stark case. Imagine someone, utterly alone and unobserved, promises their dying friend – their very last breath – to carry out a small, private wish after death. The friend dies moments later. No one else will ever learn if the promise is kept. The social practice of promising isn't remotely engaged; no future trust is put at risk. No one remains who *could* be disappointed. What does your assurance-based account say? Does the promise still bind?

  **ALEX:** Absolutely, it binds. The crucial moment happened *before* the friend died. The promisor deliberately and openly assured their friend: "I will do X." The friend, in their final moments, formed the expectation and likely took comfort from it *based on that assurance*. The promisor knowingly created that state of reliance. Breaking the promise now would be a profound betrayal of that specific act of trust, even though the friend isn't here to feel disappointment. It violates the principle governing the assurance given. The obligation persists because the *wrong* was committed in the act of creating and then breaching that reliance. What does *your* practice say about this silent promise?

  **TAYLOR:** Hmm. Within the strict logic of my conventionalist view? If the practice *truly* isn't invoked or engaged – no social context, no potential effect on future reliance, no audience whatsoever, living or dead, who could judge or be affected – then... the conventional *obligation* dissolves. The words were spoken, but the social machinery that imbues "I promise" with its binding force wasn't operational. It was like uttering a magical incantation without the magic existing. There's no practice to uphold, no unfair advantage gained or lost. So, technically, no obligation *from the practice*.

  **ALEX:** But Taylor, doesn't that conclusion feel deeply counterintuitive? Doesn't part of you *still* feel the promisor *ought* to keep that promise? That breaking it would be wrong? If so, where does *that* intuition come from on your view? Isn't your theory borrowing the moral force from the very assurance relation I describe? You're relying on the *intuition* generated by one person deliberately creating expectation in another, then trying to ground it solely in a practice that, by your own admission, isn't present here.

  **TAYLOR:** You press me fairly. Yes, the intuition *is* strong. But is it *my theory's* intuition, or an external one? Perhaps the intuition persists *because* we are creatures *of* the practice. We've internalized the rule "promises must be kept" so deeply that we feel its force even in its absence, like phantom limb pain. Or perhaps, in making the promise, the promisor *themselves* invokes an *internalized* version of the practice, binding themselves to their own conception of the rule. But strictly speaking, on the practice-based account, the *social* obligation – the one grounded in fairness to the cooperative scheme – vanishes in this vacuum. Your Scanlonian view seems tailor-made for this case.

  **ALEX:** Perhaps, but let me press *you* now. Suppose the promisor breaks the silent promise. On your view, since no practice was engaged, they did nothing *wrong* in the conventional sense. Yet, if they later confess, wouldn't we condemn them? Wouldn't *they* likely feel guilt? How does your account explain that condemnation or guilt if the only relevant obligation vanished with the friend's last breath? Doesn't this suggest the core wrong lies in the betrayal of the specific assurance given *to that person*, not in the potential damage to an abstract social fabric? Your "phantom limb" explanation feels like admitting my account captures the real nerve of the obligation, while yours handles only the public scaffolding.

  **TAYLOR:** A powerful challenge, Alex. Perhaps the condemnation stems from the *character* revealed – someone who would exploit even the most intimate, unseen trust. Or perhaps the practice's rules are so ingrained that violating them *feels* wrong, even in isolation, because it weakens our own commitment to the practice generally. But... you force me to concede a point. My account struggles to generate the *full* moral force intuitively present in the silent promise case purely from the practice's logic. Your assurance view provides a more direct, intrinsic reason why that solitary promisor remains bound: the echo of the trust they deliberately invoked still resonates, demanding fidelity. The practice might amplify and structure promise-making, but the deepest obligation, it seems, might spring from the act of assurance itself.

  **ALEX:** And perhaps, Taylor, the very existence and stability of the valuable social practice you describe *depends* on individuals recognizing and adhering to that deeper, Scanlonian principle in countless unseen interactions, not just the public ones. The silent promise might be the purest test.
