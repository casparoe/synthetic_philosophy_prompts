prompt: |-
  So a while back I fell down a rabbit hole thinking about those "save 5 people or save 1" situations, and I got stuck on why the number of people should even matter morally if you can't actually add up separate peoples pain into one big pile - like the 5 people aren't some mega-person who suffers 5x as much, right? Turns out theres an actual philosopher, Taurek, who wrote a paper called "Should the Numbers Count?" making basically that same point, and he even says if you truly can't save both groups you should just flip a coin instead of automatically saving the bigger group. Then Parfit wrote a whole response paper basically calling him out for being "innumerate." Can you compare the two positions for me - whats the strongest move Parfit actually makes against the coin flip idea, and does it hold up, or does Taurek have a comeback that still survives it? genuinely curious who comes out ahead here.
