prompt: |-
  At work we do these blameless postmortems after outages where the whole goal is nailing down "the root cause," and I've noticed it almost always gets pinned on something that *didn't* happen -- on-call didn't get paged, the reviewer didnt catch the bug, the migration script didn't have a rollback, whatever. I went down a rabbit hole reading about how philosophers deal with "absences" as causes, and apparently theres a real puzzle here: if you use the obvious counterfactual test (the outage wouldn't have happened if X had occurred), you get a stupid number of unrelated non-events qualifying too -- like technically if my cat could read code she'd have caught the bug, so did her not-reading-code also cause the incident? Can you walk through the most important implications of this omission-causation puzzle for how we assign "root causes" in incident reviews -- basically, is there some principled way to say the engineer's omission is THE cause and the cat's isn't, or is "root cause" always secretly just blame/convention dressed up as objective causal language?
reasoning: |-
  Okay, the user is grappling with a fascinating and practical problem about root cause analysis in incident reviews. They've noticed that "what didn't happen" often gets labeled as the root cause - like an alert not firing or a rollback script missing. They've even gone down the philosophical rabbit hole about absences as causes, referencing the counterfactual test where technically any non-event (even absurd ones like a cat not reading code) could be considered causal. 

  The core tension they're wrestling with is whether "root cause" is truly objective or just socially constructed blame in disguise. This is such a sophisticated observation - they've already spotted the fundamental flaw in naive counterfactual reasoning. Their example about the coding cat perfectly illustrates how the standard "if X had happened the outage wouldn't have occurred" test becomes meaningless when applied to omissions.

  Hmm... what they're really asking for is a framework to distinguish between relevant omissions (engineer missing something) and irrelevant ones (cat not reading code) without resorting to blame. The emotional subtext here is frustration with performative postmortems where "blameless" feels like lip service. They want real solutions, not jargon.

  The philosophical depth here is impressive - they've clearly read up on causation theories. I should acknowledge that while keeping it practical. The key is to reframe the problem: instead of hunting for THE root cause (which invites omission-focused answers), we should think about creating systems resilient to expected human errors. 

  Their example about the migration script rollback is telling - the real issue isn't that someone forgot it, but that the system allowed deployment without one. That shifts focus from individual failure to organizational responsibility. The cat example fails because feline code review isn't a reasonable expectation, while human code review is. 

  I should emphasize that "blameless" done right means blaming the processes, not the people. The outage doesn't happen because Steve forgot - it happens because the system relied solely on Steve remembering. The cat isn't part of the system's designed safeguards; the code review process is. 

  The most useful approach might be introducing them to how high-reliability organizations handle this - focusing on "how we failed" rather than "who failed." The counterfactual test only works when applied to designed system functions (alerts should page, rollbacks should exist), not imaginary ones. 

  This deserves a response that validates their intellectual curiosity while giving concrete alternatives to omission-hunting. The goal isn't to find THE cause but to find THE most effective changes to prevent recurrence. And that usually involves multiple reinforcing mechanisms, not a single "root" fix.
answer: |-
  You've hit on one of the deepest philosophical and practical problems in incident analysis. The "omission-causation puzzle" (why we treat *some* absences as causal but not others) reveals fundamental flaws in how we typically conceptualize "root cause." Here's a breakdown of the implications and a principled way forward:

  ### Core Problem: The Counterfactual Trap
  - **The Test**: "Outage wouldn't have happened if X *had* occurred." 
  - **The Flaw**: As you note, this makes *infinite* non-events "causes": 
    - If the on-call *had* been paged → outage averted.  
    - If the cat *had* read the code → outage averted (theoretically).  
    - If a solar flare *hadn't* disrupted networking → outage averted.  
  - This reduces "root cause" to an arbitrary choice, often masking blame.

  ### Why We *Still* Focus on Omissions (and Why Some Feel Valid)
  1. **Normative Expectations**:  
     - We expect engineers to write rollback scripts.  
     - We *don't* expect cats to read code.  
     - **Problem**: "Expectations" are social conventions, not objective causal facts.  

  2. **Control & Preventability**:  
     - We can *realistically* ensure rollback scripts exist.  
     - We *can't* train cats to review code.  
     - **Problem**: This confuses *prevention* with *causation*.  

  3. **Proximate Salience**:  
     - The last unfulfilled expectation feels most "causal" (e.g., "If *only* the alert had fired!").  
     - **Problem**: This ignores deeper system design flaws (e.g., *why* wasn't the alert reliable?).

  ---

  ### Principled Ways to Resolve the Puzzle (Beyond Blame)
  1. **Shift from "Root Cause" to "Contributing Factors & Context"**  
     - **Stop asking**: "What's *the* root cause?"  
     - **Start asking**: "What conditions made this failure possible?"  
     - Example:  
       - "No rollback script" *plus* "no automated check for rollbacks" *plus* "pressure to deploy quickly" *plus* "test env mismatch."  

  2. **Focus on *Positive* Mechanisms, Not Absences**  
     - Instead of: "The reviewer *didn't* catch the bug."  
     - Reframe as: "The *code review process* failed to detect this class of bugs because [concrete reason]."  
     - This forces analysis of *how the system functioned* (or malfunctioned), not what people failed to do.  

  3. **Apply the "Reasonable Expectation" Test Rigorously**  
     - **Principled filter**: Only omissions tied to *explicit system functions* or *assigned responsibilities* qualify.  
     - Why the engineer's omission "counts":  
       - Code review is a *defined control* in your system.  
       - Responsibility is formally assigned.  
     - Why the cat's doesn't:  
       - Feline code review isn't a system function or reasonable expectation.  
     - **Key**: Document these expectations *before* incidents (e.g., "Our system requires rollback scripts for all migrations").  

  4. **Adopt Systems Thinking (The "Swiss Cheese Model")**  
     - Incidents happen when multiple layers fail *simultaneously*.  
     - "No rollback script" is one hole in the cheese. Other holes:  
       - Tests didn't catch the issue.  
       - Monitoring didn't show degradation.  
       - Deployment process allowed unsafe changes.  
     - **Fix**: Address *multiple* holes, not just the most salient omission.  

  5. **Counterfactuals Aren't Useless – But Anchor Them in Reality**  
     - **Valid use**: "If the *designed alerting* had worked as intended, would we have mitigated impact?" (Yes → improve alerting).  
     - **Invalid use**: "If a cosmic ray *hadn't* flipped a bit..." (Not actionable).  

  ---

  ### Practical Implications for Incident Reviews
  - **Ban "Root Cause" Language**: Replace with "Key contributing factors" or "Critical system gaps."  
  - **Ask "Why?" 5 Times** (But Correctly):  
    - "No rollback script" → *"Why?"* → "Scripts aren't required by our deployment checklist" → *"Why?"* → "Checklist was last updated 3 years ago" → **Fix the checklist process**.  
  - **Focus on Actions, Not Absences**:  
    - Instead of: "Engineer failed to test rollback."  
    - Say: "The deployment pipeline allows merging without rollback verification. We will automate verification."  
  - **Accept Multi-Causality**: Most outages have 5-10+ contributing factors. List them all and prioritize fixes.  

  ### The Hard Truth
  "Root cause" is often **a social construct** – we select the omission that feels most preventable, assignable, or narratively satisfying. But by focusing on *system functions* (what the system *should* do) rather than individual omissions (what people *didn't* do), you make the analysis both more objective and more effective. The goal isn’t to find *the* cause – it’s to find *the most impactful changes* to prevent recurrence. That usually means fixing processes, not shaming people.
