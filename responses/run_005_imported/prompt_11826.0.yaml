  okay this is gonna sound weirdly specific but ive been stuck on it for days. one of our ethics bowl cases this year involves a bystander who doesnt jump in to save someone from drowning, and our coach mentioned in passing that philosophers actually argue over whether "not doing something" can count as a cause of the drowning in a real metaphysical sense, not just a moral/legal one. so i went down a rabbit hole and it turns out the obvious counterfactual move (if he'd jumped in she wouldnt have drowned, so his not-jumping caused it) proves way too much, because by that same logic the Queen of England not jumping in also "caused" it, and so did literally everyone else on earth who wasnt there. the name Sarah McGrath kept coming up for framing this as an actual dilemma rather then a fixable bug, and apparently Beebee just bites the bullet and says omissions arent real causes at all, while other people (sartorio maybe? not sure im remembering that right) try to patch the counterfactual theory instead of ditching it. can you actually walk me through why this counts as a genuine dilemma and not just a simple fix -- like what specifically breaks when people try to patch the "too many causes" problem, and do any of the patches actually avoid secretly smuggling in moral assumptions about who "should" have acted? we only got the 101 version of this in class, so no need to look anything up -- just actually explain the real disagreement to me, and atleast tell me if im even getting the shape of it right.
