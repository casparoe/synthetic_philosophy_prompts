  So I've been going down a rabbit hole on that old "Death in Damascus" story - the one where the guy runs into Death in the market, Death gives him this look, so he hops on a horse and bolts to Aleppo, and then it turns out Death was actually surprised to see him in Damascus earlier that day because they had an appointment set for Aleppo that night anyway. I found it mentioned in some old forum post as this famous decision theory puzzle, and from what I can gather the whole point of the thing is basically: if there's a predictor out there who literally cannot be wrong, then it doesn't matter what you choose, the outcome was locked in from the start and your "choice" was just an illusion. Me and my buddy got into a whole debate about this over drinks, like doesn't this basically prove hard fatalism whenever a perfect predictor is involved? Like should I stop bothering to weigh my decisions carefully since the real outcome is fixed no matter what I pick? Am I reading this right or is there something I'm missing about what this puzzle is actually supposed to show?
