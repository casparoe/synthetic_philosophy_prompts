  - The threefold lie classification is correctly attributed, though Augustine's later works complicate jocose lies. Student nails the key point: all remain sins, differing only in gravity. 
  - For the murderer-at-the-door case, the student makes two strong moves: correctly identifying silence as Augustine's preferred solution, but also spotting the subtle practical allowance in Contra Mendacium for protective denials when coerced. This shows good textual awareness.
