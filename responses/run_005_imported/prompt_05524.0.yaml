      "comment": "Accurately identifies silence as the ideal solution and notes Augustine's allowance for coerced denial under duress. Minor deduction for implying Augustine saw denial as 'legitimate'—he called it still sinful but less grave than alternatives."
    },
    "coherence": {
      "score": 2,
      "out_of": 2,
      "comment": "Logically structured, connects hierarchy to hard case, and unifies themes (intent, soul-damage). No contradictions."
    }
