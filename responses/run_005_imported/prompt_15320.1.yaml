prompt: |-
  I'm a PhD student in philosophy currently drafting a dissertation chapter on hinge epistemology, and a recurring point of contention in my reading group is just how far Wittgenstein's notion of a "hinge proposition," as developed in *On Certainty*, can be stretched before it stops picking out anything precise. Everyone agrees that the handful of propositions Wittgenstein borrows directly from Moore's "A Defence of Common Sense" and "Proof of an External World" count as paradigm cases, but as soon as we test the concept against propositions neither of them actually discussed, the group splits between people who think almost any deeply held commonsense belief qualifies as a hinge and people who think the category is much narrower than that.

  To make some actual progress, I'd like your help sorting a set of candidate propositions according to how well each one satisfies the specific criteria Wittgenstein associates with hinge-hood: groundlessness rather than ordinary evidential warrant, exemption from the everyday practice of doubting and giving reasons, and a functional role as part of the fixed scaffolding — the shifting river-bed, or the hinges on which a door turns — that makes doubting and justifying possible in the first place, rather than being just another move within that practice. Here are the propositions:

  - "I have two hands."
  - "The Earth has existed for many years before I was born."
  - "Here is a hand" (as in Moore's "proof" of an external world).
  - "I am a human being."
  - "No one has ever set foot on the Moon."
  - "There are physical objects."
  - "2 + 2 = 4."
  - "Water boils at 100 °C at sea level."

  Please sort these into four tiers — paradigm hinge, hinge-like/borderline, well-confirmed empirical belief (not a hinge), and different category entirely (not a hinge) — and return your answer as a JSON object formatted as follows:

  ```json
  {
    "Paradigm hinge": ["..."],
    "Hinge-like / borderline": ["..."],
    "Well-confirmed empirical belief (not a hinge)": ["..."],
    "Different category entirely (not a hinge)": ["..."]
  }
  ```

  Afterward, please add a short paragraph explaining which one or two criteria did the most work in placing whichever two propositions you found hardest to classify, since that tension is really what I need for my own argument.
reasoning: |-
  Okay, the user is a PhD student in philosophy working on hinge epistemology, specifically Wittgenstein's concept from *On Certainty*. They're dealing with a debate in their reading group about how broadly "hinge propositions" can be applied. The core issue is whether only the examples Wittgenstein explicitly discussed (like Moore's propositions) count, or if the category extends to other deeply held beliefs. 

  The user wants me to sort eight propositions into four tiers based on Wittgenstein's criteria: groundlessness (not based on evidence), exemption from doubt/reason-giving, and their functional role as scaffolding for epistemic practices. The tiers are: paradigm hinge, hinge-like/borderline, well-confirmed empirical belief, and different category entirely. After sorting, I need to explain which criteria were decisive for the trickiest cases.

  Let me recall Wittgenstein's key ideas. Hinge propositions aren't justified by evidence; they're the unchanging background that makes justification possible. They're immune to doubt because doubting them would undermine the entire system of knowledge. Examples like "I have two hands" or "The Earth existed long before I was born" are classic because they're so fundamental we never question them—they're the framework for inquiry.

  Now, analyzing each proposition:
  - "I have two hands": Directly from Moore/Wittgenstein. Paradigm case—groundless, doubt-exempt, scaffolding.
  - "The Earth has existed for many years before I was born": Another Moore staple. Same status as above.
  - "Here is a hand": Moore's proof example. Functionally identical to "I have two hands." Paradigm.
  - "I am a human being": Deeply tied to identity and embodiment. Feels hinge-like but less explicitly discussed. Borderline because it shares core features but isn't a canonical example.
  - "No one has ever set foot on the Moon": This is interesting. Historically, it was treated as certain pre-1969, but now it's falsified. It *was* hinge-like in a past context but isn't timeless. Borderline because context-dependent hinges are debatable.
  - "There are physical objects": Moore/Wittgenstein core. Paradigm—directly addresses external world skepticism.
  - "2 + 2 = 4": Mathematical truth. Wittgenstein separates logical/mathematical "rules" from empirical hinges. Different category—it's a grammatical norm, not a groundless certainty about the world.
  - "Water boils at 100°C": Scientific fact. Well-confirmed but revisable (e.g., with altitude). Not groundless—it's evidence-based. Fits "empirical belief."

  The hardest cases were "I am a human being" and "No one has ever set foot on the Moon." For the first, the functional role criterion pulled it toward hinge-like (it's identity-scaffolding), but its lack of explicit grounding in Wittgenstein's text made it borderline. For the moon landing, the exemption-from-doubt criterion was key: it *was* undoubted in some contexts but proved false, showing hinges must be timeless frameworks, not contingent beliefs. This highlights the tension between context-relativity and absolute scaffolding in hinge epistemology.
answer: |-
  Here is the tiered sorting based on Wittgenstein's hinge criteria from *On Certainty*, followed by an explanation of the key tensions:

  ```json
  {
    "Paradigm hinge": [
      "I have two hands",
      "The Earth has existed for many years before I was born",
      "Here is a hand",
      "There are physical objects"
    ],
    "Hinge-like / borderline": [
      "I am a human being",
      "No one has ever set foot on the Moon"
    ],
    "Well-confirmed empirical belief (not a hinge)": [
      "Water boils at 100 °C at sea level"
    ],
    "Different category entirely (not a hinge)": [
      "2 + 2 = 4"
    ]
  }
  ```

  ### Explanation of Critical Tensions
  The hardest classifications were **"I am a human being"** and **"No one has ever set foot on the Moon"**, with the **functional role** and **exemption from doubt** criteria creating tension:  

  1. **"I am a human being"**  
     - *Why borderline*: While it meets the *groundlessness* criterion (we don't evidentially verify our species-identity daily), its *functional role* is ambiguous. For Wittgenstein, hinges scaffold *epistemic practices* (e.g., "I have hands" anchors sensory verification). "I am human" scaffolds *personal identity* and *embodiment* but isn't explicitly treated by Wittgenstein as enabling doubt/justification *about the world*. Its hinge-status depends on whether identity is foundational to epistemic practices.  

  2. **"No one has ever set foot on the Moon"**  
     - *Why borderline*: Pre-1969, this functioned as a hinge (undoubted in contexts like historical reasoning). However, its *exemption from doubt* proved contingent—it was empirically falsifiable. Genuine hinges (e.g., "Earth existed long before me") are *immune* to such falsification; doubting them collapses meaning itself. The criterion of *functional role* pulls it toward hinges (it once stabilized historical inquiry), but its vulnerability to evidence pushes it out of the paradigm.  

  The tension reveals a core Wittgensteinian insight: hinges lose their status if they can *coherently* be doubted or falsified without collapsing language-games. "Moon landing" fails this test; "human being" straddles it by anchoring identity-games rather than strictly epistemic ones.
