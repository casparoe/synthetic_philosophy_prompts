prompt: |-
  So I just spent like two hours on the phone with my friend Priya arguing (again) about the "equality of what" question — shes firmly on the resources side, insisting that if two people start out with identical bundles of stuff and money, whatever happens after that is on them, while I kept saying that identical resources can still leave people radically unequal in what they can actually do or become, so resources can't be the right currency of justice. We went around and around on the classic disability case: she kept patching her view with this hypothetical insurance market idea (basically: figure out how much insurance a prudent person would buy against being born with a disability, before they know their own risk, and that tells you how much society owes people who actually turn out disabled), and I kept saying that just pushes the question back a step, because you still have to decide what counts as "enough" insurance, which smells like smuggling in some notion of capability or functioning through the back door anyway. Afterwards I looked around a bit more and found that a philosopher called G.A. Cohen apparently made basically that same objection and proposed some "midfare" idea as a kind of compromise, which just made me want to see the argument actually played out properly instead of the half-remembered version me and Priya were hacking through.

  So could you write me a dialogue between a Dworkin-style resource egalitarian and a Sen-style capability theorist that really gets into the weeds on this? I want them to work through two cases side by side: (1) someone born with a costly lifelong disability, and (2) someone who has deliberately cultivated genuinely expensive tastes (like fine wine), which Dworkin treats totally differently from the disability case — and I want the capability theorist to press on whether that asymmetry is principled or just convenient for the resourcist. Have the resourcist actually deploy the hypothetical insurance market move in some detail, and have the capability theorist raise the indeterminacy problem in return (how do you even pick the "right" list of capabilities, and isn't "how much insurance is enough" just as indeterminate as "how much capability is enough"?). I don't want either of them to be a pushover — make them equally sharp, actually responding to each other's specific moves rather than just restating their own view past each other, and it's totally fine if they don't reach agreement by the end. I just want to see where the real pressure points are, instead of the strawman-ish versions me and Priya kept loosing track of.
