  Here’s a toast weaving Moore’s insights into genuine, warm praise while addressing the conditionality concern subtly:

  **(Raising glass, warm smile)**  

  "Friends, family, colleagues… and to the philosophers who’ve already mentally dissected the canapés… thank you for letting me toast Sarah and David.  

  We spend our lives, especially in philosophy, searching for what’s *truly* valuable. Sarah, your work on G.E. Moore taught us that he found it in two things: the profound appreciation of beauty, and the deep affection between people. But Moore was adamant: real value doesn’t come from seeing what isn’t there. It comes from seeing what *is* – clearly, truly – and loving it *because* of that clarity, not in spite of it.  

  That’s why toasting Sarah and David feels so easy. Because what’s remarkable about them isn’t some perfect, airbrushed ideal. It’s the specific, wonderful, gloriously *real* picture they’ve built together.  

  Sarah, we all know your brilliance – the way you dissect an argument with laser precision. But David sees what we sometimes miss: the *why* behind it. He sees the fierce loyalty that drives you to defend a friend, the quiet vulnerability when you share an idea you’re not sure about, the sudden, infectious laugh that erupts when something genuinely delights you. He doesn’t just admire the philosopher; he cherishes the whole, complex person – the one who needs reminding to eat when she’s deep in Moore’s footnotes, the one whose eyes light up talking about David’s latest project, flaws and all.  

  David, your world is different. You navigate complexity of another kind. But Sarah sees beyond the spreadsheets. She sees your unwavering steadiness – the calm harbor you create not just for her, but for everyone lucky enough to be your friend. She sees the surprising wit you deploy just when it’s needed most, the quiet generosity that never asks for credit, the deep respect you have for her world, even if you’ll happily skip the seminar on ‘organic unities’. She doesn’t love some abstract provider; she loves *you* – the man who patiently endorses her philosophical rabbit holes and grounds her when she needs it.  

  **Here’s the quiet magic:** Their love isn’t valuable *despite* seeing each other so clearly – with all the quirks, the stubbornness, the occasional philosophical tangent interrupting dinner – it’s valuable *because* they see so clearly. It’s not a love built on flattering illusions. It’s built on knowing the actual person standing there, warts and wonderfulness combined.  

  And that’s why it’s strong. Because **knowing the truth isn't the enemy of lasting love; it's the foundation.** When you love the *actual* person – their specific kindness, their unique humor, their particular way of facing the world – you aren't loving a checklist of perfections frozen in time. You're loving a dynamic, evolving *whole*. You love the way Sarah’s mind wrestles with ideas *and* the way she dances badly at parties. You love David’s analytical skill *and* the way he grumbles good-naturedly about the dishwasher.  

  You love the person, not just the qualities. And because you see the real person – the core character, the enduring spirit beneath the changing details – that love isn't threatened by life’s inevitable shifts. It’s built to adapt, because it was built on reality from the start. The affection is *for* the person revealed *through* those qualities.  

  So, we raise our glasses not to some flawless, imaginary couple, but to Sarah and David: two brilliantly specific, wonderfully real people who chose each other, know each other, and love each other – truly, clearly, and abidingly.  

  To Sarah and David! May your love, grounded in the beautiful reality of who you both are, continue to be the most valuable thing you know."  

  **Why it works:**  

  1.  **Specific & Defensible Praise:** Highlights *actual* traits (Sarah's loyalty, vulnerability, laugh; David's steadiness, wit, generosity, respect for her world) and *how* they are perceived/appreciated by the partner. Avoids vague superlatives ("perfect," "best").  
  2.  **Moore's Core Ideas Embedded:**  
      *   "Seeing what *is*... clearly, truly" (True Cognition).  
      *   "Loving it *because* of that clarity" (Emotion directed at the accurately cognized object).  
      *   "The whole, complex person" / "the actual person" / "gloriously *real*" (Organic Unity - valuing the combination of accurate perception and affection for the whole).  
      *   Contrast with "flattering illusions," "airbrushed ideal," "abstract provider" (Rejecting false cognition).  
      *   "Two paradigm cases" subtly invoked via the intro mentioning beauty/affection and the toast focusing on affection.  
  3.  **Defusing Conditionality (Subtly):**  
      *   "Loving the *actual* person... their particular way of facing the world." (Shifts focus from isolated qualities to the *person* manifest *through* qualities).  
      *   "Dynamic, evolving *whole*." (Acknowledges change is inherent).  
      *   "Core character, the enduring spirit beneath the changing details." (Suggests a stable essence that persists even as specific qualities evolve or fade).  
      *   "Love isn't threatened by life’s inevitable shifts. It’s built to adapt, because it was built on reality from the start." (Explicitly addresses the concern by linking resilience to the foundation in truth).  
      *   "The affection is *for* the person revealed *through* those qualities." (Crucial point: The qualities are the *means* of knowing the beloved, not the *sole condition* for love).  
  4.  **Accessible & Warm:** Uses plain language ("quirks," "stubbornness," "dances badly," "grumbles about the dishwasher"). The philosophical depth is woven into observations about the couple, not presented as theory. The "philosophers dissecting canapés" line acknowledges the room's split humorously.  
  5.  **Recognition for Philosophers:** Colleagues will hear "true cognition," "organic unity," "intrinsic value," the contrast with illusion, and the resolution to the conditionality problem, all without jargon. The structure mirrors Moore's argument flow.  
  6.  **Time & Tone:** Fits comfortably in 5 minutes. Warm, personal, celebratory, and focused entirely on the couple's real relationship.  

  This toast honors Sarah's deep connection to Moore by demonstrating his ethical insight *in action* within her own marriage, celebrates the real David and Sarah, and offers a quietly profound reassurance about the nature of enduring love – all while keeping the non-philosophers fully engaged.
