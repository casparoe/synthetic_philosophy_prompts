  I recall philosophy 101 here: Aristotle's distinction between arithmetic equality (HR's argument) and proportional equality (adjusting for circumstance). Modern equity frameworks would absolutely classify the chair as an accommodation - something companies legally must provide beyond standard benefits. The stipend structure accidentally punishes disability by forcing medical needs to compete with wants.

  *scribbles mentally* Also worth noting how this backfires on the company: 
