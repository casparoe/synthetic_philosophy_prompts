  So I'm partway through the dispositions unit in my metaphysics seminar this term -- we did the simple conditional analysis last week (glass is fragile iff it would break if struck, etc.) and this week hit finks and masks: the live-wire-rigged-to-a-cutoff-switch case, the fragile-glass-wrapped-in-styrofoam case. One of my sharper students raised something in class that I didn't have a great comeback for. Her thought was: since finks and masks show you can have the disposition without the matching counterfactual being true, and the counterfactual true without the disposition, the real lesson is that "disposition" talk doesn't track any actual property at all -- its just a loose, practically useful way of summarizing patterns of behavior, and theres no real categorical or causal thing doing the work underneath. A couple other students nodded like this was the obvious moral, I mumbled something vague about Lewis's reformed analysis and moved us along, and it's been bugging me since, because I don't think I actually rebutted her, I just changed the subject.

  Could you write something I could actually hand her, maybe a page, that takes her specific inference seriously and says exactly where -- if anywhere -- it breaks down? I don't need a full survey of the disposition literature, just an honest verdict on whether finks and masks really do support that fictionalist-ish conclusion about dispositions, or whether they're usually doing the opposite job in the literature and I'm just misremembering. Martin and Lewis should probably show up by name since we already read them for class; Johnston too, if I'm remembering right that the masking cases are originally his, though don't hold me to that one.
