answer: |-
  Here's a concise, one-page response you can hand to your student, directly engaging her inference while drawing on the authors you've covered:

  ---

  **To: [Student's Name]  
  From: [Your Name]  
  Re: Do Finks & Masks Show Dispositions Aren't Real?**

  You raised an excellent point in class: if finks (like Martin’s live wire rigged to a cutoff switch) show that fragility can exist *without* the counterfactual "if struck, it would break" being true, and masks (like Johnston’s glass wrapped in styrofoam) show that the counterfactual "if struck, it would break" can be true *without* the object being fragile, then doesn’t this prove that "disposition" talk is just a useful fiction for predicting behavior, with no underlying property? Your inference is logical and sharp, but the literature actually uses these cases to argue for the *opposite* conclusion. Here’s why:

  1.  **Finks and Masks Challenge the *Analysis*, Not the *Existence* of Dispositions:**  
      Martin’s finkish wire (which loses its disposition to conduct when shocked *just as* it’s struck) and Johnston’s masked poison (retaining its disposition to kill even when an antidote is present) were designed to refute the *Simple Conditional Analysis* (SCA). Their target was the claim that dispositions are *nothing over and above* the truth of a single counterfactual. **They succeeded.** But their success doesn’t imply dispositions aren’t real; it implies the SCA is too simplistic to capture what dispositions *are*.

  2.  **Lewis’s Reformed Analysis: Grounding Dispositions in Causal Bases:**  
      David Lewis’s "reformed" analysis (which we touched on) directly responds to finks and masks. His key move is to anchor dispositions in *intrinsic causal bases*. A fragile glass is fragile not *because* of the bare counterfactual "if struck, it would break," but because it possesses some *intrinsic physical property* (e.g., a specific molecular structure) that *would* cause it to break *if* it were struck *and* nothing interfered (like a fink or mask).  
      -   **The Wire:** When the cutoff switch activates, the wire *loses* the intrinsic physical state (free electrons ready to flow) that constitutes its disposition to conduct. The fink destroys the *basis* of the disposition.  
      -   **The Masked Glass:** The styrofoam *prevents the manifestation* (breaking), but the glass *retains* its intrinsic fragile structure. The mask is an *external preventer*, not a change to the glass's intrinsic properties.  
      **The Lesson:** Dispositions *are* real, intrinsic properties (the causal bases), but their *manifestation* depends on context (absence of finks and masks). The counterfactual is *made true* by the presence of the intrinsic basis *plus* suitable conditions. Fink and mask cases help *isolate* the real dispositional property by showing what can go wrong with the counterfactual link.

  3.  **Martin’s Point: Dispositions are Intrinsic & Causal Powers:**  
      Martin himself argued that finks show dispositions must be *intrinsic* properties (lost when the wire’s internal state changes) and are best understood as *causal powers*. The wire’s power to conduct is real, but fragile – it can be lost quickly. This doesn’t make the power fictional; it makes it defeasible. The fink case highlights the *intrinsic nature* of dispositions, not their unreality.

  4.  **Johnston’s Mask: External Interference vs. Internal Change:**  
      Johnston’s masking cases reinforce the distinction between the *object’s intrinsic state* and *external circumstances*. The poison retains its intrinsic power to kill (its disposition), but the antidote (the mask) interferes with the *causal chain* leading to death. The disposition is real, but its exercise is blocked. This is analogous to a strong athlete being tied up; their strength (disposition) is real, but they can’t manifest it (lift weights) due to external constraints.

  **Why Your Inference Doesn’t Follow:**  
  Finks and masks show the *simple counterfactual* (SCA) is inadequate as a *definition* of dispositionality. They do **not** show that dispositions themselves are unreal. Instead, they:  
  -   **Refine our understanding:** They force us to distinguish the *intrinsic dispositional property* (the causal basis) from the *conditions required for its manifestation*.  
  -   **Support Realism:** By highlighting how dispositions persist through masking (because the basis remains) and are lost through finking (because the basis is destroyed), they point to the disposition *as* the stable, intrinsic causal basis.  
  -   **Reveal Complexity:** They show dispositions are *context-sensitive powers*, not simple behavioral predictions. This complexity is a feature of real causal properties in a messy world, not evidence they are fictions.

  **The Verdict:**  
  Finks and masks are powerful tools **against** reductionist analyses like the SCA, but they are standardly deployed in the literature (by Martin, Lewis, Johnston, and most dispositional realists) **in support of** the reality of dispositions as intrinsic causal powers grounded in categorical (or other) properties. They expose the flaws in a simplistic *account* of dispositions, not the fictionality of dispositions themselves. The "loose, practically useful summary" view is a possible *alternative* position (dispositional fictionalism), but finks and masks don’t *entail* it; they are primarily used to argue *for* a more sophisticated realism.

  ---

  **Key Strengths for Your Purpose:**  
  1.  **Directly Addresses Her Inference:** Starts by validating her logic before showing where it diverges from the literature's intent.  
  2.  **Uses Her Examples:** Explicitly references the wire (fink) and styrofoam (mask) cases she raised.  
  3.  **Name-Checks Assigned Authors:** Martin, Lewis, and Johnston are central to the explanation.  
  4.  **Clear Verdict:** Explicitly states finks/masks are used *against* fictionalism in the literature.  
  5.  **Concise:** Fits comfortably on one page.  
  6.  **Pedagogical:** Explains *why* her conclusion is tempting but not the one drawn by the key authors.  

  This response honors the student's insight while demonstrating how the very cases she cited are wielded to defend dispositional realism against overly simplistic analyses.
