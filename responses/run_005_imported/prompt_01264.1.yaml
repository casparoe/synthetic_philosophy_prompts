  D'Arms and Jacobson's opacity strategy seems tougher to crack. They argue we can't define "fittingness" formally; we must judge case-by-case whether reasons bear on the object's features. But here's the circularity risk: if we say the demon's threat isn't about the mud's features, haven't we already assumed the mud isn't admirable? The judgment appears to presuppose the evaluative fact it's meant to explain.

