  I should break down Lewis's possible responses. On one hand, he might argue that digital traces like upvotes create observable regularities, approximating common knowledge. But the scale and anonymity challenge the mutual expectations aspect. Algorithms amplify certain behaviors, but is that self-perpetuating like in Lewis's examples?

