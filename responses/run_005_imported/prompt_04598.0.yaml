prompt: |-
  So in my philosophy of religion seminar we just spent like two weeks on Wittgenstein's Lectures on Religious Belief (the 1938 ones that only exist because students copied down his notes) and I feel like I sort of get it but also don't. The example that stuck with me is the guy who believes in the Last Judgement - Wittgenstein keeps insisting this isn't like an ordinary belief where you'd say "I've weighed the evidence, so I'm like 90% confident," its supposedly more like a picture that regulates the guy's whole life, and trying to treat it as a probability claim just misses the point of what the belief even is. Then theres the bit about Father O'Hara (some priest/physicist who went on a BBC broadcast in the 30s) where Wittgenstein basically says the guy is being ridiculous for trying to make his faith sound scientifically reasonable, like thats actually a worse mistake than just admitting your faith isn't based on evidence at all.

  Anyway, this turned into a whole argument in my dorm last night that went way past when we should've gone to bed: what do you think Wittgenstein would've said about the New Atheist stuff, like Dawkins in The God Delusion, arguing God is basically a scientific hypothesis (the Russell's teapot comparison etc) and since there's no good evidence for it, believing in God is exactly as irrational as believing in fairies at the bottom of the garden. Would Wittgenstein actually side with Dawkins on the "no evidence" part, while thinking his whole approach is confused for basically the same reason O'Hara's was - i.e both of them assume religious belief is the kind of thing evidence could settle in the first place? Or would that just be him dodging the actual question people care about? And if his view really does mean religious belief can't be judged by ordinary evidence and reasoning, doesn't that basically let people believe whatever they want and call it "faith," totally immune from criticism? That's the part my roommate and I couldn't agree on, so I'd want an actual argued position out of you, not just a summary of "what Wittgenstein generally thought about religion."
