answer: |-
  ## Philosophical Combat: The Omission Outage

  **Setting:** A university common room after a seminar. **Dr. Lena Arden** (defends omissions as genuine causes) sips tea, while **Prof. Marcus Thorne** (argues omissions are only quasi-causes) leans forward intently. The debate is already heated.

  **Thorne:** Lena, your plant example perfectly illustrates the *problem*. Yes, the plant died. Yes, the neighbor didn't water it. But causation requires a *physical connection*, a transfer of energy or momentum! The neighbor’s inaction transferred *nothing*. The real cause was the physical process: dehydration, sun exposure, cellular breakdown. Saying "not-watering caused death" is like saying "the absence of a fireman caused the house to burn down." It’s explanatory shorthand, not metaphysics. It’s *quasi*-causation – useful for blame, but not describing the world’s causal fabric.

  **Arden:** Marcus, that’s far too narrow! Causation isn’t just billiard balls colliding. It’s about *dependence*. The plant died *because* the neighbor failed to water it. Hold fixed the actual conditions – the dry soil, the hot sun – and ask: *if* the neighbor had watered it, *would* it have lived? Yes! That counterfactual dependence is the heart of causation. The neighbor’s omission isn’t just explanatory fluff; it made the crucial difference.

  **Thorne:** Ah, but that’s where your "ocean of counterfactuals" drowns you! *If* *I* had flown to your house and watered it, it would have lived. *If* a random passerby had done it, same result. By your counterfactual dependence test, *everyone* who didn’t water it caused its death! That’s absurd. You can’t have billions of causes for one event. This shows counterfactual dependence alone is insufficient. You need something else to pick out the neighbor – and that "something else" isn’t causation, it’s *normativity*: the neighbor *promised* to do it. That’s about responsibility, not cause.

  **Arden:** You’re conflating two things! The counterfactual dependence *is* there for everyone – technically, yes. But causation is *context-sensitive*. In the context of explaining *this specific death*, we hold fixed background conditions and focus on *relevant* interventions. We don’t consider wild possibilities like you flying in because they’re not part of the *actual* causal field. The neighbor was the *expected intervenor* based on the actual setup – the promise, their proximity, the implicit reliance. Their omission is a *cause* because they occupied a specific role where their action was normatively *expected* to prevent the outcome. It’s not smuggling in norms *instead* of causation; it’s that norms help define the *scope* of relevant causal factors in a given situation. Take that outage example from tech – the queue backup that crashed the service. The team *expected* an alert to be set up; it was part of the system design’s safety mechanism. The omission wasn’t just "anyone didn’t set it up," it was the *specific failure* of the team responsible for monitoring. That’s why we name them in the postmortem! Their inaction was a genuine cause – it broke the counterfactual dependence *within the actual, normative framework of the system*.

  **Thorne:** But that’s precisely my point! You’re relying on "expectation," "responsibility," "role" – all normative concepts! You’re dressing up *blame* as *cause*. In your outage, the physical cause was the queue overflowing, overwhelming downstream services. The absence of an alert didn’t *push* the queue over the limit; it was a failure of *detection and response*. When we say "no alert caused the outage," we mean: had there been an alert (a positive event!), someone might have acted (another positive event!) to prevent it. The *real* causes are the processes that filled the queue and the lack of *intervention* triggered by a missing alert signal. The omission "no alert" isn’t a cause; it’s a *condition* that allowed other causes to operate unchecked. We blame the team because they had a *duty* to create that positive condition (the alert), not because their inaction magically caused the crash. It’s about responsibility for failing to initiate a preventative *process*, not about the absence *being* the process.

  **Arden:** So you’d tell that team, "Your failure wasn't a *cause* of the outage, just a failure to prevent it"? That’s sophistry! It ignores how we *use* causal language to assign responsibility in complex systems. The physical process – the queue filling – was *necessary* but not *sufficient* for the catastrophic failure. The system was designed with redundancies! The *sufficient* cause included the *absence* of the mitigating action the alert would have triggered. The team’s omission was a crucial, non-redundant part of the causal chain leading *to* disaster. If we deny omissions as causes, we cripple our ability to explain preventable failures in social, technical, or biological systems where *inaction* is a designed-for variable. We discipline people for omissions *because* those omissions are causally potent in the real world!

  **Thorne:** We discipline them because they *should have acted*, Lena! Not because their inaction possesses some spooky causal power. Your "sufficient cause" still relies on a counterfactual: *if* they had acted, it *wouldn't* have happened. That’s true! But it’s a truth about what *didn’t* happen, not about what *did*. The actual causal chain that *did* happen involved only positive events and processes: data entering the queue, servers reaching capacity, processes crashing. The absence of the alert is a hole in that chain, not a link. Quasi-causation captures this: it explains *why* the positive causes weren’t stopped, and it grounds blame on the duty to *fill* that hole. But we shouldn’t reify the hole itself as a cause. The world is made of happenings, not not-happenings. Your outage was caused by what *happened* to the queue, not by what *didn’t* happen with the alert.

  **Arden:** Then we fundamentally disagree on what "the world" includes. If the world includes systems of reliance, expectation, and design – which it plainly does – then omissions within those systems *are* real features with real causal consequences. Denying that doesn’t make the plant any less dead, or the service any less down, or the postmortem any less necessary for naming the specific failure that made the difference. Your "quasi-causation" sounds like a way to avoid the messy reality that sometimes, *nothing* is exactly what caused the something.

  **Thorne:** And your "genuine causation by omission" sounds like a way to turn every unfulfilled duty into a metaphysical mystery. We agree on the blame, Lena. We just disagree profoundly on whether that blame points to a *cause* in the fabric of reality, or to a *responsibility* grounded in our normative expectations of what *should have been*. The queue crashed because of processes that occurred. Full stop. The lack of an alert explains why we’re angry at the team, not why the servers stopped.

  *(They stare at each other, the philosophical chasm wide, the teacups cold.)*
