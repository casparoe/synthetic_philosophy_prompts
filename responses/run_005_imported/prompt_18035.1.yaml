  Here’s a draft eulogy that honors Marion’s faith, respects her intellectual legacy, and holds space for all who loved her — without collapsing into philosophy jargon or overstepping her boundaries. It runs about 5-6 minutes when spoken slowly:

  ---

  **(Begin with warmth and presence)**  
  Good morning. For those who don’t know me, I’m [Your Name], Marion’s nephew/niece. When I think of Aunt Marion, I see her in three places: in a cathedral choir loft, sunlight through stained glass on her face as she sang; at her cluttered desk, pencil in hand, circling a sentence in some dense text; and right here in this room, decades ago, teaching me to fold origami cranes at this very table. That’s who she was — a woman who held sacred things, intellectual things, and human things in seamless hands.  

  **(Acknowledge faith without declaring outcomes)**  
  Marion was a deeply faithful person. She found beauty, purpose, and community in the rhythms of the Episcopal tradition — in the hymns she sang for fifty years in the choir, in the liturgy she helped shape on the vestry, in the quiet certainty of prayer. Her faith wasn’t a backdrop to her life; it was one of its vital, beating centers. To honor her *is* to honor that. And yet...  

  **(Introduce her intellectual core with humility)**  
  ...if you knew Marion professionally, you’ll smile knowing there’s a "yet." Because she also devoted her life to a question that might seem, to some, at odds with that faith: *How do we live together when our deepest convictions differ?* She wrestled with this through the work of John Rawls — particularly his "proviso," which she insisted was widely misunderstood.  

  **(Explain her key insight simply)**  
  Marion believed the proviso wasn’t about silencing religious voices in public life. Not at all. It was, she argued, an invitation: a call to build bridges. To say, *"This is why my faith compels me,"* but then also to find words — reasons grounded in our shared humanity, our common hopes, our tangible realities — that might resonate even with someone who doesn’t share your starting point. For her, this wasn’t a constraint; it was an act of generosity. A way of saying, *"I see you, and I want you to understand."*  

  **(Connect faith and philosophy in her character)**  
  She loved pointing out that Rawls himself almost became an Episcopal priest. For Marion, that wasn’t just trivia — it was a clue. It hinted that the space between conviction and conversation, between faith and public reason, wasn’t a canyon to be crossed. It was a room to be furnished together. And my God, did she furnish it beautifully.  

  **(Address her directive with grace)**  
  Marion was clear: She didn’t want today to force a conclusion not everyone here could share. She understood — profoundly — that grief walks many paths. Some here find comfort in the promise of eternal life, in the assurance she is held in God’s mercy. Others find meaning in her enduring legacy — in books, in ideas, in students she inspired, in the origami crane still perched on my bookshelf. Still others simply feel the weight of her absence.  

  **(Conclude with unifying warmth)**  
  So let me say this plainly, in words she might borrow from the Prayer Book but leave open for all of us:  
  Marion lived with unwavering faith and unwavering curiosity. She believed in a God of boundless grace. And she believed just as fiercely in the dignity of every human mind and heart she encountered. She trusted us — her family, her friends, her colleagues, her parish — to hold both truths without forcing them into a single shape.  

  **(Final tribute)**  
  Today, we don’t need to agree on where Marion is. We only need to agree on who she *was*:  
  A woman of profound devotion who wore her choir robe like a royal mantle.  
  A razor-sharp thinker who could dismantle an argument without ever making you feel small.  
  A steadfast friend who showed up — with casseroles, with marginalia-filled books, with that half-smile when you finally grasped her point.  

  She taught us that we need not share the same foundations to build something meaningful together. So let’s honor her now by doing just that: by grieving, by remembering, by singing off-key if we need to, and by holding space — as she always did — for every kind of heart in this room.  

  Thank you, Marion. For everything.  

  ---

  **Why this works:**  
  - **Honors Faith Authentically:** Uses liturgical language ("God of boundless grace," "Prayer Book") and specific, reverent details (choir, vestry) without declaring outcomes ("held in God’s mercy" is a hope, not an assertion).  
  - **Respects Her Intellectual Legacy:** Explains her Rawlsian insight in accessible, human terms ("building bridges," "an act of generosity") and connects it to her character.  
  - **Holds the Tension:** Explicitly names differing perspectives ("Some here... Others...") and frames her approach as inclusive trust ("hold both truths without forcing them").  
  - **Avoids Philosophy Lecture:** Uses vivid personal details (origami crane, casseroles, choir robe) and keeps Rawls explanations brief and metaphorical ("a room to be furnished").  
  - **Centers Shared Grief:** Closes on collective remembrance and her enduring human impact, a space where all can meet.  

  **Delivery Tip:** Speak the lines about faith ("sunlight through stained glass," "God of boundless grace") with warmth and reverence. Pause slightly before and after the "And yet..." to let the transition land. When mentioning Rawls, use a lighter, almost affectionate tone — like sharing an inside story. End with quiet strength on "Thank you, Marion."  

  This gives your father, her colleagues, and her parish a eulogy where each can find their truth held with dignity — exactly as Marion would have crafted it herself.
