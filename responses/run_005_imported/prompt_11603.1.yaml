  Okay, the user is recounting a deep philosophical discussion they had with a friend about Quine's views on ethics, specifically his essay "On the Nature of Moral Values." They're confused about Quine's argument that moral statements lack an analogue to observation sentences in science, and why this would disqualify ethics from being "naturalized" like science. The user pushed back, noting that many empirical claims (like history or other minds) are also distant from direct observation yet still considered knowledge. They want to understand Quine's actual reasoning, why ethics is uniquely affected, and whether this makes Quine a non-cognitivist or just agnostic about ethics.

  First, I need to recall Quine's epistemology. His holism means that scientific theories face experience as a whole, not individually. Observation sentences are the direct link between language and sensory input. For Quine, these are crucial for testing theories. Now, applying this to ethics: Quine argues that moral statements don't have their own observation sentences. There's no direct sensory input that confirms "this is wrong" in the same way that "red here now" confirms a perception. 

  The user's point about other areas like history or other minds is valid. Quine would agree that these are also theoretical. But the difference lies in their connection to the overall web. Claims about other minds or historical events are linked through a chain of inferences to observation sentences. For example, "Caesar crossed the Rubicon" ties to documents, which tie to physical evidence, eventually linking back to observations. Ethics, however, lacks even an indirect chain. Moral values don't have empirical consequences that can be tested. They're more like aesthetic judgments, which Quine also excludes from science.

  Why is ethics uniquely problematic? It's because moral statements don't contribute to predicting observations. Science aims to predict and control experience; ethics doesn't. Even abstract scientific concepts are validated by their role in the predictive web. Moral judgments, however, are expressions of preference or conditioning, not truth-apt statements. This doesn't make them meaningless, but they're not part of the cognitive, truth-seeking enterprise. 

  Is Quine a non-cognitivist? Sort of, but not in the emotivist sense like Ayer. He doesn't say moral sentences are just emotional expressions. Instead, they're culturally conditioned responses without empirical content. He's more of a projectivist: moral values are projections of our preferences onto the world. So, he's a non-cognitivist in the broad sense, denying that moral statements have truth values based on facts.

  The user might also be wondering about the implications for moral knowledge. Quine's view suggests that while science accumulates knowledge through empirical testing, ethics doesn't progress in the same way. Moral disagreements can't be resolved by observation, only by persuasion or social conditioning. This might lead to relativism, but Quine avoids that by not denying the importance of ethics, just its scientific status. 

  I should clarify that Quine isn't dismissing ethics as unimportant. He sees it as vital for society but different in kind from science. His naturalism restricts scientific inquiry to empirically testable theories, so ethics falls outside that scope. The user's friend was right about the observation sentence gap, but the deeper issue is the lack of empirical consequences and predictive power. 

  The user's challenge about other minds is apt, but Quine would argue that other minds are inferred to explain behavior, which is observable. Ethics lacks even that inferential link. So, while both are theoretical, other minds are part of the scientific web, ethics isn't. 

  In conclusion, Quine's position is a nuanced non-cognitivism that respects ethics' social role but denies its scientific naturalizability. The user needs to see that the observation sentence absence is a symptom of the larger issue: no empirical anchorage or predictive role.
answer: |-
  You've hit on a fascinating and often-overlooked aspect of Quine's later thought. Your friend is essentially correct about Quine's core argument in "On the Nature of Moral Values" (indeed from *Theories and Things*, 1981). Let's reconstruct Quine's reasoning, address your excellent pushback, and clarify his position:

  1.  **The Core Analogy & Quine's Argument:**
      *   **Observation Sentences as the Empirical Anchor:** In Quine's epistemology, observation sentences ("It's raining," "Red here now," "Rabbit!") are the *foundation*. They are the point where language directly hooks onto sensory stimulation. They are the "tribunal" against which scientific theory is tested, albeit holistically (the Duhem-Quine thesis). While complex theories aren't tested sentence-by-sentence, the *entire web* faces experience through the triggering of these observation sentences.
      *   **The Lack of a Moral Analogue:** Quine argues that moral discourse ("That is wrong," "Charity is good," "Justice demands X") lacks any such observation sentence. There is no direct sensory stimulation that *uniquely* or *reliably* triggers the utterance of a specific moral sentence in the way seeing a rabbit triggers "Rabbit!".
      *   **Consequence: No Empirical Tribunal:** Because moral statements lack this direct sensory anchor, the *entire web* of moral discourse cannot be tested against sensory experience in the holistic way scientific theory can. There's no empirical "friction" point.
      *   **Why Ethics Can't Be "Naturalized" Like Science:** For Quine, "naturalizing" epistemology meant explaining how scientific knowledge arises from sensory input within a physical world. Science, anchored by observation sentences, can be understood as a natural phenomenon. Ethics, lacking that anchor, cannot be incorporated into this naturalized account *as a body of knowledge about the world* in the same way physics or biology can. Its connection to the physical world is fundamentally different and less direct.

  2.  **Addressing Your Pushback (The "Too Much/Too Little" Problem):**
      Your counterargument is spot-on and highlights the crucial nuance Quine relies on. Quine *doesn't* deny knowledge in history or other minds. Here's his defense:

      *   **Holism and the Web of Belief:** History and other minds *are* theoretical. They are *not* directly tied to single observation sentences. However, they are *integrated into the scientific web*.
      *   **Indirect Anchoring via Theory:** Claims about Caesar crossing the Rubicon or your friend being in pain are connected, through complex chains of theory and inference, *back* to observation sentences. Evidence for Caesar involves documents, archaeology, etc., all ultimately grounded in observable physical traces. Evidence for other minds involves observable behavior (crying, grimacing) explained by a theory (people have minds like mine that cause such behavior when in pain) which *itself* is part of our best scientific understanding of the world.
      *   **The Unique Problem for Ethics:** Quine's claim is that moral values *lack even this indirect theoretical connection* to observation sentences *within the scientific web*. There's no *scientific theory* that posits moral properties (goodness, wrongness) as part of its explanatory apparatus for sensory phenomena. Moral statements don't help predict the triggering of observation sentences. We don't use "That is wrong" to explain *why* the apple fell or *why* the patient screamed. They sit *alongside* the scientific web, not woven into it as explanatory nodes.
      *   **The Analogy of Aesthetics:** Quine often compares ethics to aesthetics. We see a painting and say "Beautiful!" – but is there a specific sensory trigger *for the beauty itself*? Or is it a complex response based on our conditioning, physiology, and culture? The "beauty" isn't a property *in the paint* that science detects; it's a projection *onto* the paint by us. Quine sees ethics similarly. "Wrongness" isn't detected like mass or charge; it's a response *to* situations.

  3.  **Is Quine a Non-Cognitivist or Agnostic/Quietist?**
      This is where Quine's position gets subtle, and he avoids classic labels:

      *   **Not Full Non-Cognitivist (à la Ayer/Emotivism):** He doesn't say moral sentences are *merely* expressions of emotion ("Boo!") or disguised commands ("Don't do that!"). He grants they have propositional *form* ("Stealing is wrong" looks like "Electrons have charge").
      *   **Cognitivist in Form, But...:** He allows that moral sentences *can* be true or false *relative to a moral code*. "Stealing is wrong" is true *within* a code that forbids stealing, just as "Witches exist" was true *within* a certain historical belief system.
      *   **Projectivist & Relativist:** His core view is **Projectivism**: Moral values are projections of human sensibility, cultural conditioning, and innate dispositions *onto* the world. They aren't *discovered* features of reality like electrons. This leads to a form of **Relativism**: The truth of a moral sentence is relative to the moral code of the speaker/society. There is no "cosmic exile" standpoint (his phrase) from which to judge one code objectively superior to another based on "the facts."
      *   **Naturalistic Agnosticism about "Moral Facts":** While moral sentences have truth-value *relative to a code*, Quine's naturalism leads him to **agnosticism** about whether there are any *objective, non-relative moral facts* "out there" in the world for moral sentences to correspond to. Science, his arbiter of what exists, finds no evidence for them. He doesn't rule them out with logical positivist fervor ("meaningless!"), but his naturalistic methodology finds no place for them and no way to access them.
      *   **Quietist about Naturalizing Ethics as Science:** He is **quietist** in the sense that he denies the *project* of "naturalizing ethics" *in the same way epistemology was naturalized*. Ethics cannot be turned into a branch of empirical science discovering moral truths about the world because it lacks the empirical anchor. The *explanation* of why we have the moral sentiments we do *is* a naturalistic project (for psychology, anthropology, biology), but the *justification* of the values themselves cannot be settled by science.

  **In Summary:**

  *   **Quine's Core Argument:** Moral discourse lacks observation sentences, preventing it from facing the empirical tribunal holistically like science. Therefore, it cannot be "naturalized" as a science discovering objective moral facts.
  *   **Response to Your Pushback:** History/other minds *are* theoretical but are *integrated into* the scientific web via chains of inference explaining observable phenomena. Ethics lacks this integration; moral values don't feature in scientific explanations of sensory data. They are projections, not discoveries.
  *   **Quine's Position:** A sophisticated blend of **Projectivism** (values are projections of our sensibility), **Relativism** (truth is code-relative), **Naturalistic Agnosticism** (science finds no objective moral facts), and **Quietism** (denying the feasibility of naturalizing ethics *as a science*). He's closer to a non-cognitivist *in spirit* regarding objective moral truth, but retains a cognitivist surface for relative truth within codes.

  Your debate cuts to the heart of naturalism's limits. Quine draws a sharp line: science, anchored empirically, describes the world; ethics, unanchored, expresses our stance *towards* it. The challenge of integrating normativity into a naturalistic worldview remains central to philosophy today, and Quine's argument is a powerful articulation of why it's so difficult.
