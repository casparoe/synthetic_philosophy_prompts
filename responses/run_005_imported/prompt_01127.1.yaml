prompt: |-
  So I went down a total rabbit hole this week that started with a documentary about the wolf/coyote/dog interbreeding mess out in the eastern US and ended with me reading wikipedia at 1am about something called "the species problem." Turns out biologists have never actually agreed on what a "species" even is -- theres the biological species concept, the phylogenetic one, ecological, cohesion, at least a dozen more -- and they genuinely give different answers for the same real organisms, not just edge cases someone made up to be annoying. This kind of blew my mind since "species" felt like the most basic, settled unit from grade school biology. I'm a backend dev and honestly it reminds me of arguing with coworkers about when two services are "really" the same service vs two different ones -- feels totally obvious until you actually have to write down the rule that decides it.

  Could you give me one specific, real example (an actual named organism, genus, or species complex -- not a hypothetical) where two of the major species concepts flatly disagree about whether you're looking at one species or several, for the exact same group of organisms? And can you actually walk through why they disagree, not just name-drop the concepts and move on. I'd love it if you skipped the examples that show up every single time I search this myself -- ring species like the salamanders or the herring gulls, ligers, and the wolf/coyote/dog thing I mentioned above. Bonus points if you can also tell me whether this kind of disagreement seems like something that could in principle get fixed with a better definition, or whether it's more fundamental than that -- like theres no actual fact of the matter and biologists are just choosing where to draw the lines.
