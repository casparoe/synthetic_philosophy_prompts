  Okay, let me start by understanding the user's situation. They're chairing a bylaws subcommittee for a small scholarly association with about 200 members. The problem began when a moderate candidate lost due to vote-splitting, leading them to adopt ranked-choice voting (RCV). But now, members are strategically misranking their preferences—putting a sincere second choice last to help their favorite win. The user wants to know if there's a voting system where honest ranking is always the best strategy, no matter what others do. If not, why does this keep happening?

  First, I recall Arrow's Impossibility Theorem. It states that no ranked voting system can meet all desirable criteria like fairness, non-dictatorship, etc., without some trade-offs. That's a key point. Then there's Gibbard-Satterthwaite, which directly says that any system with more than two options will be manipulable. So, theoretically, no perfect system exists. That explains why their RCV was gamed.

  The user mentioned a faction pushing for a point-scoring system like Borda Count. But Borda is also manipulable. If someone insincerely ranks a strong competitor lower, they can sway the results. So switching to Borda might not solve the problem. The member who joked about exploitation being inevitable is actually correct based on these theorems.

  The user's deeper need seems to be finding a practical solution despite the theoretical impossibility. They might want to minimize manipulation or choose a system that's harder to game. Also, they might need to present this to the committee in a way that's understandable without technical jargon.

  Looking at their options: Approval voting could be simpler. Members vote for all candidates they approve, and the most approvals wins. This reduces strategy because you can't harm your second choice by approving them. But it doesn't capture ranked preferences. STAR voting combines score and runoff, which might help but still has vulnerabilities.

  The real issue might be the association's culture. The member who proudly admitted manipulation suggests a lack of norms. Emphasizing ethical voting and the spirit of cooperation could help. Also, adding a "none" option or requiring full rankings might reduce tactical voting, but it's not foolproof.

  I should explain why this keeps happening—it's not bad luck but inherent in voting theory. The association's small size and repeated elections make strategic voting more tempting. They need a balance between practicality and encouraging honesty. Maybe recommending Approval or STAR as a compromise, while promoting ethical guidelines, is the way to go.
answer: |-
  This is a profound and mathematically fascinating question that cuts to the heart of democratic decision-making. Your frustration is understandable, but unfortunately, the theoretical answer is definitive and carries significant implications for your subcommittee.

  **The Core Answer: No, It's Theoretically Impossible (Gibbard-Satterthwaite Theorem)**

  The member who joked about exploitation being inevitable is essentially correct, based on a fundamental result in social choice theory: the **Gibbard-Satterthwaite Theorem (G-S)**.

  *   **What it Says:** For any voting system that meets three basic criteria:
      1.  **Has at least three possible outcomes (candidates):** Obviously true in your case.
      2.  **Is Non-Dictatorial:** No single voter's preferences always determine the winner.
      3.  **Is Non-Manipulable (Strategyproof):** It is *always* in every voter's best strategic interest to reveal their true preferences, regardless of how others vote.
  *   **... Then that system must be a dictatorship.** Since dictatorship is unacceptable, the conclusion is: **There is *no* non-dictatorial voting system for three or more candidates where it is *always* strategically optimal for every voter to be honest.** Manipulation is *always* a possibility in principle.

  **Why This Keeps Happening: It's Not Bad Luck, It's Math**

  Your association isn't uniquely unlucky. The problem arises because:

  1.  **The Fundamental Trade-off:** All voting systems involve trade-offs between desirable properties. G-S proves that "strategyproofness" (always best to be honest) is incompatible with "non-dictatorship" and having a meaningful choice between 3+ candidates.
  2.  **Different Systems, Different Vulnerabilities:** While *all* systems are manipulable in theory, they are vulnerable to *different kinds* of strategic voting:
      *   **Plurality:** Vulnerable to vote-splitting (what prompted your initial change). Strategy: Vote for the "lesser evil" frontrunner, not your true favorite.
      *   **Ranked Choice (Instant Runoff Voting - IRV):** Vulnerable to "burying" or "compromising." Your candid member exploited "burying": ranking a strong threat (her sincere 2nd choice) *last* to prevent them from surviving early rounds and potentially beating her favorite in a later round. Strategy: Mis-rank strong competitors lower.
      *   **Point-Scoring (Borda Count):** Highly vulnerable to "burying" and "truncation." Voters can strategically rank a strong competitor *last* to minimize their points, or refuse to rank candidates they dislike below their favorite ("truncation") to deny points to others. Strategy: Exaggerate differences between favorite and rivals.
      *   **Approval Voting:** Vulnerable to "bullet voting" (only approving your absolute favorite) or "over-approving" (approving too many, including weak candidates). Strategy: Decide the approval threshold based on who you think is viable.
      *   **Condorcet Methods:** Vulnerable to "cloning" (adding very similar candidates) and complex strategies involving preference misrepresentation on specific pairwise matchups.
  3.  **Your Specific Context Amplifies the Risk:**
      *   **Small Size:** With ~200 members, it's easier for a small, coordinated group to believe their strategic voting can swing the outcome.
      *   **Repeated Elections & Known Candidates:** Members learn the dynamics, frontrunners, and ideological groupings, making strategic calculations more feasible.
      *   **High Stakes (Perceived):** If members feel strongly about the direction of the association, the incentive to manipulate increases.
      *   **Transparency of the Problem:** The member openly admitting the strategy signals that manipulation is seen as acceptable or clever by some, potentially encouraging it in the future.

  **Evaluating the Proposed Point-Scoring (Borda Count) System**

  The faction advocating for point-scoring (like Borda, where 1st=3pts, 2nd=2pts, 3rd=1pt, etc.) is mistaken if they believe it eliminates strategic incentives:

  1.  **Borda is Highly Manipulable:** It's arguably *more* vulnerable to strategic burial than IRV. Suppose your sincere ranking is A > B > C > D. If you perceive B as the strongest threat to A, your optimal strategy might be to rank A > C > D > B, giving B the *lowest* possible score to hurt them, even though you prefer B over C and D. This is exactly the "burying" strategy, now applied within a points system.
  2.  **Susceptibility to Truncation:** Voters might only rank their top 1 or 2 candidates, denying points to everyone else, if they believe it helps their favorite.
  3.  **Sensitivity to Candidate Field:** Adding or removing even weak candidates who have no chance of winning can significantly alter the point totals between the serious contenders, creating incentives for strategic nomination or ranking.

  **Moving Forward: Practical Considerations for Your Subcommittee**

  Since perfect strategyproofness is impossible, your goal should be to find a system that:

  *   **Minimizes the *opportunity* and *incentive* for manipulation.**
  *   **Is robust when manipulation *does* occur.**
  *   **Fits your association's culture and values.**
  *   **Is understandable and acceptable to members.**

  Here are options, acknowledging their trade-offs:

  1.  **Stick with Ranked Choice (IRV), but Address Culture & Rules:**
      *   **Pros:** Addresses vote-splitting (your original problem), familiar to members now, generally resists "compromising" (voting for a lesser evil over true favorite).
      *   **Cons:** Vulnerable to "burying" (as exploited).
      *   **Mitigations:**
          *   **Strong Norms:** Explicitly state in bylaws and voter guides that the system is designed for honest ranking and that strategic burial violates the spirit. Appeal to collegiality and scholarly ethics.
          *   **Require Full Rankings?:** Mandating voters rank *all* candidates slightly reduces the "burying" tactic's impact (you can't leave the threat unranked) but forces insincere middle rankings and doesn't prevent last-place burial. Can also annoy voters.
          *   **Add "None of the Above" (NOTA):** Gives voters a way to express disapproval without strategically misranking serious candidates.

  2.  **Consider Approval Voting:**
      *   **How it Works:** Voters can vote for ("approve") *any number* of candidates they find acceptable. The candidate with the most approvals wins.
      *   **Pros:** Simple, very resistant to most forms of manipulation. The main strategy ("vote for all you like" vs. "only vote for your absolute favorite to avoid helping others") is relatively transparent. Hard to "bury" a specific candidate without also hurting your favorites. Excellent at finding broadly acceptable, consensus candidates. Counts quickly.
      *   **Cons:** Doesn't capture strength of preference (ranking). A polarizing candidate loved by 51% and hated by 49% could beat a universally tolerated candidate approved by 90%. Might not satisfy members who want to express nuanced preferences.

  3.  **Consider STAR Voting (Score Then Automatic Runoff):**
      *   **How it Works:** Voters score each candidate (e.g., 0-5 stars). The two highest-scoring candidates advance to an automatic runoff. The runoff winner is the candidate preferred by a majority on the *ballots that scored both finalists* (using the higher score as the vote).
      *   **Pros:** Captures strength of preference, generally performs well in resisting strategies (honest voting is usually optimal or close to it), finds broadly acceptable winners, runoff ensures majority support among those expressing a preference between the top two. More expressive than Approval.
      *   **Cons:** More complex than Plurality or Approval. Still theoretically manipulable (e.g., min-maxing: giving max score to favorite, min score to biggest threat), though often less rewarding than in IRV or Borda. New concept for members.

  4.  **Address the Root Cause - Culture and Perception:**
      *   **Education:** Explain *why* strategic voting harms the association's goal of finding the best-supported leader. Frame honest voting as a collective responsibility for a healthy community.
      *   **Transparency:** Discuss the trade-offs openly with members. Acknowledge no system is perfect but emphasize the goal of minimizing harm.
      *   **Lower the Stakes?:** Consider if the President's role could be structured to be less polarizing, or if terms could be shorter/more collaborative.

  **Recommendation for Your Subcommittee:**

  1.  **Acknowledge the Impossibility:** Start by explaining the Gibbard-Satterthwaite Theorem. This frames the discussion realistically – you're seeking the *least bad* or *most robust* option, not a perfect one. This should temper expectations for the point-scoring advocates.
  2.  **Reject Borda Count:** Given its high manipulability and sensitivity to irrelevant candidates, it's likely a step backwards.
  3.  **Seriously Consider Approval or STAR:** Both offer significant practical advantages over IRV in terms of strategy resistance and finding consensus winners. Approval is simpler; STAR offers more expressiveness.
  4.  **If Sticking with IRV, Strengthen Norms:** Explicitly condemn strategic burial in bylaws/policies and promote a culture of honest voting. Adding a NOTA option is worth discussing.
  5.  **Focus on Acceptability:** Ultimately, the system needs member buy-in. Present the options (IRV, Approval, STAR) clearly with pros, cons, and the reality of strategic possibilities. Consider a non-binding member survey or discussion forum.

  The challenge isn't finding an unexploitable system—that's impossible—but choosing one whose vulnerabilities are harder to exploit and less damaging to your association's collegial goals when exploited. Prioritizing simplicity, consensus-building, and fostering a culture of honesty will serve you better than chasing an unattainable ideal of perfect strategyproofness.
