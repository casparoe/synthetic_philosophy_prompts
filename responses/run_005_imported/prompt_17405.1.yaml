  ## Eulogy for My Father: Many-Sided Truth, One Steadfast Heart

  [Take a breath, look around at the gathering]

  Family, friends, colleagues, and especially his students – thank you. Thank you for coming to honor my father, a man whose life was woven into the very fabric of this temple, particularly through thirty years of guiding its youngest souls. His absence these past two weeks has felt like a sudden silence in a room that was always humming with his energy, his questions, and yes, his opinions.

  For those of you who sat in his children's classes, or debated with him at our kitchen table – or even just listened to him hold forth! – you know that one word was his constant companion, his guiding star, his favorite tool for prying open minds: **anekantavada**.

  For those hearing it for the first time, let me try to explain it as he would, especially knowing he’d be listening intently, ready to clarify. Anekantavada isn't simply "anything goes" or "everyone's right in their own way." It’s far more profound, and far more demanding. It’s the understanding that reality – like a complex gem – has *many* facets. Truth isn’t flat; it’s dimensional. To see it fully, we need to understand *from which angle* a statement holds true. **He didn't dismiss truth; he insisted on seeing its context.**

  He railed against the lazy shortcut – the one that turns anekantavada into "so nothing is *really* true, it’s just your point of view, who’s to judge?" He saw that as a betrayal. He’d lean forward, eyes sharp, and say, "That *very statement* – 'nothing is really true' – is pretending to be the one, final, absolute truth! It’s a one-sided claim masquerading as open-mindedness." For him, "it depends" wasn't the end of the conversation; it was the *launchpad*. It meant: *Now let's explore the angles. Why does it depend? On what? For whom? Under what conditions?* He believed deeply in truth, but he insisted we work harder to grasp its multifaceted nature. He taught that true understanding requires intellectual humility and relentless curiosity – the willingness to step outside our own single viewpoint.

  And that’s how he taught you, his students. He didn’t give you easy answers wrapped in platitudes. He gave you puzzles, stories, questions that made you tilt your head. He challenged you to see the world through different eyes – the ant’s, the tree’s, the neighbor’s. He believed that this practice – this rigorous, multi-angled looking – wasn't just philosophy; it was the foundation for compassion, for resolving conflict, for truly *seeing* each other. He trusted you, even as children, to grapple with complexity.

  Now, to speak of my father *only* as a wise teacher would be… well, it would be to present only one facet of the gem. And he would hate that. He practiced anekantavada, but he was also fiercely human. He was **stubborn**. Oh, was he stubborn. Once he had examined an angle, turned it over in his mind, and decided it held truth – especially *his* truth – holding that ground felt like a matter of principle. Conviction ran deep in him. This meant he was incredibly loyal, unwavering in his beliefs, and a formidable advocate. But it also meant that admitting fault… well, that could be a slower process. He could dissect the flaws in another's argument with remarkable speed and precision. Applying that same rigorous, multi-angled analysis to his own positions? That often required more time, more internal debate, sometimes a nudge (or a shove) from reality. He wrestled with his own angles. He wasn't always quick to say, "I was wrong," but when he finally did, after that internal struggle, it carried the weight of hard-won understanding. That stubbornness wasn't malice; it was the other side of his deep integrity and his passionate commitment to what he believed was true. It was part of his intensity, the fuel for his decades of teaching.

  So, how do we remember such a man? A man who taught the intricate beauty of seeing many sides, yet who could hold his own single viewpoint with such tenacity?

  We remember him by embracing the challenge he set before us. We remember him not by smoothing over the complexities of his character or his philosophy, but by honoring them.

  *   We honor him by **resisting the easy flattening** of truth into relativism or lazy dismissal. When we hear "it depends," we follow his lead: we ask "On *what*?" We seek the facets.
  *   We honor him by **cultivating that stubborn integrity** in ourselves – the courage to stand for what we deeply believe *after* we’ve done the work of examining the angles, while always remembering that the examination is never truly finished.
  *   We honor him by **practicing the humility** he sometimes wrestled with himself – the willingness to admit that maybe, just maybe, we haven't seen the whole gem yet, that another perspective might illuminate something vital.
  *   And we honor him by **asking the hard questions**, at the temple, at our own kitchen tables, and especially within our own minds. We keep the argument alive, not to win, but to understand more deeply.

  He wasn't a man of simple platitudes. He was a man of profound, demanding truth – truth seen from many sides. He was a teacher who challenged his students to think harder. He was a father whose stubborn love and fierce intellect shaped me. He was complex, sometimes frustrating, deeply principled, and utterly committed to the path of understanding.

  [Look towards the children's classroom, or where he taught]

  Father, you taught us to turn the prism. Today, we hold your memory up to the light, and we see its many brilliant, challenging, beautiful facets. We see the teacher, the debater, the stubborn seeker, the loving, complex man. We will miss your voice, but we will carry your questions, your insistence on seeing fully, and yes, even a little of your stubborn dedication to truth, with us always. Thank you. **Micchami Dukkadam.** May your journey be peaceful.
