  The user might be probing whether rationalist assumptions gloss over metaphysical cracks. They're right: casually equating qualitative identity with numerical identity *is* presupposing IoI. But in personal identity, we often care about *narrative or psychological continuity*, not just metaphysics. Still, for their question, I should stress how Black's argument threatens the "same person" label for duplicates unless we redefine what "same" means (e.g., Parfit's "survival"). 

