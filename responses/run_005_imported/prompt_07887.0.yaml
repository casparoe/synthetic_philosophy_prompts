  - **Discontinuous switching**:
    - MEC: Continuous in credences? Actually, it can be discontinuous if the choiceworthiness functions are discontinuous, but in general, it's continuous unless there's a tie. However, small credence shifts might cause a switch if the expected values cross.
    - MFT: Highly discontinuous when the favorite theory changes due to a small shift in credence.
    - MP and CWV: Voting can lead to discontinuities (e.g., in Condorcet methods, small changes can flip the winner).
    - MH: Might be more continuous because it's about balancing.

  - **Sensitivity to number and stakes**:
    - MEC: Sensitive to both because it aggregates over all theories.
    - MFT: Ignores all but the top theory, so insensitive to others.
    - MP and CWV: Sensitive to the number of theories and their credences, but not directly to the stakes (unless the voting system accounts for it, which it typically doesn't).
