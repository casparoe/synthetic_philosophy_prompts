answer: |-
  You've hit on one of the most fascinating and contentious debates in decision theory! The ergodicity economics argument (championed by Ole Peters) is intellectually provocative, but declaring expected value (EV) maximization a "mathematical mistake" for repeated bets is an overreach that conflates assumptions with universal truth. Here's the strongest case for why EV remains defensible and why the ergodicity critique isn't the death knell it claims to be:

  ### 1. **The Core Misstep: Assuming Multiplicative Dynamics are Universal**
     The ergodicity argument **crucially depends** on wealth growing *multiplicatively* (geometric growth: `W_t+1 = W_t * (1 + r)`). In this specific scenario, maximizing the *growth rate* (logarithmic utility) is indeed optimal for long-term wealth growth, and the ensemble average (EV) diverges from the time-average growth. **This is mathematically correct for multiplicative processes.**
     *   **The Defense:** **Not all repeated decisions are multiplicative!** Many real-world scenarios involve *additive* dynamics (arithmetic growth: `W_t+1 = W_t + X_t`), where EV maximization *is* the objectively correct strategy for maximizing expected terminal wealth:
          *   **Salary Negotiations/Job Offers:** Your future wealth is `W_0 + Salary1 + Salary2 + ...`. Maximizing the expected value of each salary offer *does* maximize expected long-term wealth.
          *   **Pension Contributions/Fixed Savings:** Adding a fixed amount monthly/yearly. Maximizing the expected return *on each contribution* (if variable) maximizes expected terminal wealth.
          *   **Business Decisions with Fixed Costs/Rewards:** Choosing between projects with additive payoffs over time.
     *   **The Point:** Declaring EV "mathematically wrong" universally ignores a vast class of decision problems where it *is* perfectly valid and optimal. The ergodicity critique applies *only* to strictly multiplicative wealth processes. Calling EV a "mistake" is like declaring a screwdriver "wrong" because your current task requires a hammer.

  ### 2. **Objective vs. Subjective: What Are You Actually Maximizing?**
     The ergodicity argument claims that maximizing the long-run growth rate (Kelly) is the *only* "objectively correct" goal for multiplicative scenarios because it ensures survival and growth over time. It frames EV as an irrelevant "ensemble average."
     *   **The Defense:**
          *   **Different Objectives are Legitimate:** An institution (e.g., a large pension fund, a venture capital firm, a government) might genuinely care about the *expected total wealth* across its entire portfolio or population (`E[W_T]`) *even for multiplicative bets*. They are diversified across many non-correlated bets or individuals. Maximizing `E[W_T]` *is* the correct objective *for them*. Kelly would be too conservative in this context. Dismissing this objective as a "mathematical error" ignores their valid perspective.
          *   **Finite Horizons & Liquidity Events:** Real investors often have finite horizons (e.g., saving for retirement in 20 years, funding a startup exit in 5 years). Their goal is `E[W_T]` at time `T`, not the growth rate over infinite time. For finite `T` in multiplicative processes, maximizing `E[W_T]` often involves taking *more* risk than Kelly (though less than naive EV maximization without considering ruin). Kelly optimizes for `T -> ∞`, which isn't always the relevant timeframe.
          *   **Non-Wealth Utilities:** Humans care about more than just terminal wealth. They care about consumption smoothing, avoiding ruin (which Kelly *does* address), status, regret, philanthropy, or simply maximizing the *chance* of hitting a specific target. EV maximization (perhaps with constraints) can be a reasonable heuristic or component within these broader frameworks. Kelly optimizes for *one specific utility function* (log(wealth)).

  ### 3. **The "Bait and Switch": Conflating a Preference with a Mathematical Error**
     This is likely the source of your unease. Peters often frames it as: "Look! If you use EV on this multiplicative bet repeated over time, almost all individuals go broke, while the ensemble average explodes! Therefore, EV is *wrong*."
     *   **The Defense:** This demonstrates a *consequence* (path dependence and potential ruin in multiplicative processes), not a *mathematical error* in calculating expectation values. The calculation `E[X] = Σ p_i * x_i` is mathematically sound. The "error" lies in assuming that maximizing `E[X]` is the *appropriate objective* for a *single trajectory* in a *multiplicative* process over *long time horizons*. **It's an error in objective selection or model applicability, not in the mathematics of expectation itself.** Calling it a "mathematical mistake" is hyperbolic and conflates the tool (EV calculation) with its misapplication in a specific context. It's like calling calculus "wrong" because you used it to model a discrete system poorly.

  ### 4. **Practicality, Estimation, and Robustness**
     *   **Kelly's Fragility:** The Kelly Criterion is notoriously sensitive to accurate estimates of probabilities and payoffs. Overestimating your edge leads to drastic overbetting and high risk of ruin. Underestimating leads to leaving money on the table. EV maximization, while also sensitive, is conceptually simpler and sometimes more robust to minor misestimations *if* ruin is not a primary concern or is managed separately (e.g., position sizing limits).
     *   **Partial Kelly:** Many practitioners use a "Fractional Kelly" strategy (betting a fraction `f` of the full Kelly stake). This explicitly bridges the gap between Kelly (growth optimal, log utility) and naive EV maximization (linear utility). It acknowledges that pure growth maximization might be too risky *in practice* for individual preferences or estimation uncertainty. This framework inherently validates that objectives exist *between* pure growth and pure EV.

  ### 5. **The Philosophical Pluralism Defense**
     Mathematics provides tools; humans define objectives. Decision theory offers a toolbox:
     *   **Maximize EV:** When additive dynamics dominate, short horizons matter, or you care about the average outcome across many instances (institutions).
     *   **Maximize Growth Rate (Kelly):** When multiplicative dynamics dominate, the horizon is very long, and avoiding ruin while maximizing long-term wealth is paramount.
     *   **Maximize Expected Utility (EU):** The general framework encompassing both (EV is EU with linear utility; Kelly is EU with log utility). Other utility functions (e.g., power utility `U(W) = W^(1-γ)/(1-γ)`) offer different risk preferences.
     **Declaring *one* objective (`U(W) = log(W)`) as the *only* "objectively correct" one for all multiplicative scenarios is a philosophical stance, not a mathematical necessity.** It prioritizes survival and long-term growth above all else. While compelling for many individual investors, it's not universally "correct" to the exclusion of other valid objectives like `E[W_T]` for finite `T`.

  ### Strongest Summary Case for EV

  **"Expected Value maximization is a mathematically sound and often optimal decision criterion for scenarios involving additive wealth dynamics or where the primary objective is the expected outcome across an ensemble of parallel instances at a finite horizon. Even within multiplicative processes, it can be a defensible approximation, a component of a fractional strategy, or the explicit goal for entities prioritizing expected terminal wealth over infinite-horizon growth rates, provided risks of ruin are managed. The ergodicity critique correctly highlights the dangers of naive EV maximization in multiplicative settings over long horizons but errs by declaring EV a universal 'mathematical mistake,' ignoring legitimate contexts where additive dynamics apply or where objectives differ from long-run growth rate maximization. The true 'mistake' is applying a tool (EV maximization) to an objective (long-term growth in multiplicative processes) for which it is poorly suited, not an error in the underlying mathematics of expectation."**

  The ergodicity argument is a powerful and necessary corrective to the *uncritical* application of EV to long-term compounding bets. It brilliantly exposes the flaw in "doubling-or-nothing" strategies. However, its proponents overstep by elevating a specific objective (long-run growth under multiplicative dynamics) to the *only* mathematically valid one. Expected value remains a fundamental, powerful, and often perfectly appropriate tool within a broader decision-making framework.
