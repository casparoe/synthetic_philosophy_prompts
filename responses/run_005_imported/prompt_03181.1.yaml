  Historical context helps here: Jains were less interested in winning debates than in non-harming (ahimsa). Anekantavada was likely always pragmatic—a way to dissolve dogmatism, not build a rival dogma. The essay should stress this shift from "what is true" to "how to inquire ethically." 

