answer: |-
  You've pinpointed a profound and nuanced debate in moral philosophy. The question isn't just "Is the brother wrong?" (he is) or "Were you wrong in the past?" (you were, but reformed). It's about the *authority* or *standing* to level the blame *now*. Let's map the conceptual landscape as requested.

  **The Core Question: What is "Standing to Blame"?**

  Standing to blame refers to the *moral authority* or *right* to hold another person accountable for a wrongdoing. It asks: Even if the accusation is true, does *this particular blamer* have the proper position, relationship, or moral status to level this blame? A lack of standing means your blame might be *normatively defective* – not necessarily factually incorrect, but inappropriate *coming from you*.

  **Key Positions on Why Hypocrisy Might Undermine Standing:**

  1.  **The Second-Personal Address Model (R. Jay Wallace & Stephen Darwall):**
      *   **Core Idea:** Blaming is not just stating a fact ("You did wrong"). It's a *second-personal address* – you are *holding* the other person accountable, demanding a response (justification, apology, change), implicitly invoking shared moral norms. This requires a relationship of *mutual accountability* and *moral equality*.
      *   **Why Hypocrisy Matters:** A hypocrite, by flouting the very norms they now invoke, undermines this relationship of equality. They haven't held *themselves* accountable to the standard they demand of others. Blaming in this context can feel like:
          *   **Arrogance or Superiority:** You claim authority you haven't earned through your own conduct.
          *   **Failure of Reciprocity:** You demand adherence to rules you exempt yourself from, violating the mutual respect required for second-personal address.
          *   **Poisoning the Communicative Act:** Your blame isn't a sincere call to uphold shared values; it's tainted by your own disregard for them. Wallace argues the hypocrite lacks the *moral credibility* needed for the blame to function as a genuine demand addressed to a moral equal.
      *   **Analogy:** It's like a contract breaker trying to sue someone else for breaching a contract. They've undermined the normative foundation (mutual commitment to the rules) that gives them the *standing* to enforce it.

  2.  **The Distraction/Non-Ideal Conditions Model (G.A. Cohen & others):**
      *   **Core Idea:** The *primary* function of blame is to identify and respond to wrongdoing. Hypocrisy in the blamer is a *separate issue*, often used strategically to deflect attention *away* from the original wrongdoer ("Look over there instead!"). While hypocrisy might make the blamer *unlikable* or *less persuasive*, it doesn't fundamentally invalidate the *truth* of the accusation against the wrongdoer.
      *   **Why Hypocrisy *Seems* to Matter (but shouldn't for standing):**
          *   **Rhetorical Effectiveness:** Pointing out hypocrisy is a powerful *ad hominem* tactic to discredit the blamer and silence criticism, especially in non-ideal contexts (like family dynamics).
          *   **Focus on Sincerity/Authority:** It highlights the blamer's insincerity or compromised moral authority, making their blame *less effective* or *harder to take seriously*. However, this is about the blamer's *character*, not the standing to state the *truth* about the wrongdoer's act.
      *   **Objection to "Lack of Standing":** Cohen might argue that framing hypocrisy as a "normative disability" (like losing legal standing) overcomplicates things. The core wrong is the brother exploiting the mother. Your past hypocrisy is a *different wrong*, but it doesn't magically erase the brother's current wrong or your (or anyone's) ability to correctly identify it. Demanding blamers be "pure" can paralyze moral criticism in imperfect worlds.

  **Distinguishing Genuine Hypocrisy from Mere Past Inconsistency:**

  This is crucial to your case. Philosophers (e.g., Macalester Bell, Cheshire Calhoun, Patrick Todd) emphasize:

  *   **Genuine Hypocrisy:** Involves a *current* lack of commitment to the norm one is invoking *at the time of blaming*. Key elements:
      *   **Present Disregard:** The blamer is *currently* violating the norm they are condemning (e.g., stealing while condemning theft).
      *   **Insincerity:** The blame is not a sincere appeal to the norm; the blamer doesn't actually endorse it as binding *on themselves* in practice.
      *   **Pretense of Superiority:** The blamer implicitly claims a moral high ground they don't occupy.
  *   **Mere Past Inconsistency (Reformed Blamer):**
      *   **Current Commitment:** The blamer *now* endorses and adheres to the norm. Their past violation is acknowledged as wrong.
      *   **Sincerity:** The blame reflects a genuine commitment to the norm, informed by their own past failure.
      *   **Lack of Pretense:** The blamer doesn't (or shouldn't) claim moral purity; they speak from the position of someone who has learned the hard way. Their blame might even carry *more* weight as a form of hard-won wisdom.

  **In Your Case:** You fall into the "Reformed Blamer" category. You sorted your finances, implying current adherence to the norm "Don't exploit mom financially." Your past wrong is relevant context, but it doesn't constitute *genuine hypocrisy* in the present act of blaming your brother. You *can* sincerely appeal to the norm now. Whether your family *accepts* this distinction is a separate sociological/psychological issue, but philosophically, your standing is arguably *less* compromised than if you were currently doing what your brother does.

  **Is "You're a Hypocrite" More Than Tu Quoque?**

  *   **Tu Quoque ("You Also"):** This is a classic *logical fallacy*. It argues: "Your criticism of my action X is invalid because you also did X (or something similar)." This is fallacious because the *truth* of the criticism (that X is wrong) is independent of the critic's past actions.
  *   **The Standing Challenge:** The philosophical arguments (especially Wallace's) aim to show that "You're a hypocrite" *can* be more than *just* a tu quoque fallacy. It's not (just) saying "Your argument is illogical." It's saying: "Your *act* of blaming me *in this specific way* is *itself morally defective* because of your relationship to the norm you're invoking. You lack the *moral position* to *address* me in this demanding, second-personal way." It shifts the focus from the logic of the accusation to the *normative validity of the blaming act itself*.
  *   **The Nuance:** Critics of the standing view (like Cohen-inclined thinkers) argue that even if phrased as a standing challenge, "You're a hypocrite" often *functions* in practice as a tu quoque – a deflection tactic. The *strongest* standing critique applies to *genuine, current* hypocrisy, not necessarily past reformed inconsistency.

  **Strongest Case for Hypocrites Losing Standing (Wallace/Darwall view):**

  Blame is a profound moral interaction requiring reciprocity and mutual recognition as agents bound by shared norms. When a hypocrite blames, they:
  1.  **Violate reciprocity:** They demand adherence to rules they exempt themselves from.
  2.  **Undermine equality:** Their act implies superiority they haven't earned.
  3.  **Corrupt communication:** Their blame cannot be a sincere call to shared values because they demonstrably don't hold *themselves* to those values. Their act of blaming thus becomes *itself* a kind of wrong – a failure of respect – poisoning the well of moral dialogue. They forfeit the *right* to make that specific demand *of that person*.

  **Best Objections to the "Lack of Standing" Case:**

  1.  **Overemphasis on Blamer, Neglect of Victim/Wrong:** The primary moral concern should be the *wrong done* (exploiting the mother) and the *victim's* claim for accountability. Focusing on the blamer's hypocrisy shifts attention away from where it belongs. The brother's wrong remains, regardless of who points it out.
  2.  **The Purity Trap:** Demanding moral purity from blamers is unrealistic and paralyzing. It means only saints could ever hold anyone accountable, letting wrongdoers off the hook whenever they can find *any* flaw in the blamer. Moral progress often comes from flawed people recognizing each other's flaws.
  3.  **Conflation with Persuasion:** What's labeled "lack of standing" might simply be *lack of persuasive force* or *moral authority*. A hypocrite is unpersuasive and lacks authority, but this doesn't mean they *cannot* or *should not* state the truth. Their blame might still be *correct*, even if ineffective or annoying.
  4.  **The Special Force of the Reformed:** A reformed blamer might have *more* standing, not less. They understand the temptation, the rationalization, and the harm *from the inside*. Their blame can be more empathetic and potentially more effective ("I know why you do this, I did it too, and here's why you must stop").
  5.  **"Standing" is Muddled:** The analogy to legal standing is imperfect. Moral norms aren't statutes. The idea of a distinct "normative disability" is conceptually fuzzy and adds unnecessary complexity. The core issues (insincerity, unfairness, deflection) can be handled without this specialized concept.

  **Applying the Map to Your Situation:**

  *   **Under Wallace/Darwall:** Your *reform* mitigates the standing objection significantly. You aren't a *current* hypocrite. However, the *recency* and *similarity* of your past actions might still make your brother feel the demand lacks full reciprocity *from you specifically* ("You got away with it for two years, who are you to demand I stop after a few months?"). The family's reaction suggests they perceive a lingering inconsistency in your *authority* on this *specific* issue.
  *   **Under Cohen/Non-Ideal:** Your brother's action is the core wrong. Your past is irrelevant to the *truth* of your accusation. Your aunt's comment is primarily a deflection tactic (tu quoque), successfully shifting focus in the family dynamic away from your brother's exploitation onto your past. The "standing" language is being used rhetorically.
  *   **The Victim's Perspective (Often Overlooked):** Crucially missing from the family debate is **your mother's current vulnerability and right not to be exploited**. This is the most compelling reason *why* the issue needs addressing, regardless of the messenger's past. A focus on standing between siblings can obscure this fundamental point.

  **Conclusion:**

  The debate hinges on whether blame is best understood as a *truth-statement* (where hypocrisy is irrelevant) or a *second-personal normative demand* (where hypocrisy can undermine the moral relationship required for that demand). The strongest case for hypocrisy mattering sees it as corrupting the very act of mutual accountability. The strongest objections argue this overcomplicates morality, neglects the victim and the wrong itself, and risks letting wrongdoers escape scrutiny.

  Your situation involves *reformed* inconsistency, not current hypocrisy. Philosophically, this strengthens your standing compared to a current hypocrite. However, in the messy reality of family dynamics, the *perception* of inconsistency ("He did it too!") and the *rhetorical power* of the "hypocrite" charge proved potent deflection tools, successfully shifting focus from your brother's ongoing exploitation to your past resolved failings. Understanding these concepts won't solve the family tension, but it equips you to see the underlying moral structures at play and perhaps refocus the conversation on the most important person: your mother.
