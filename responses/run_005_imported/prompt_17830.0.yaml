  Here’s a rigorous argument that Hart’s concessions fatally undermine his rejection of Devlin, collapsing his position into a qualified legal moralism:

  ### **The Core Contradiction: Hart’s Framework vs. His Concessions**
  1. **Hart’s Stated Anti-Moralist Position**:  
     Hart explicitly rejects Devlin’s claim that society may enforce its *shared positive morality* (e.g., traditional sexual norms) to prevent social disintegration. He argues:  
     - Only a **critical morality** focused on preventing *harm* (via neutral principles like the harm principle) is necessary for social cohesion.  
     - Enforcing positive morality is illegitimate paternalism or moral tyranny.  

  2. **Hart’s Concessions**:  
     - **Paternalism**: Hart endorses criminalizing consensual acts causing "serious bodily harm" (e.g., dueling, gladiatorial combat), even when fully informed and autonomous.  
     - **Public Indecency**: He accepts laws banning public acts that "offend, annoy, or disgust" others (e.g., nudity, extreme sexual acts), framing this as preventing *psychological harm* or maintaining public order.  

  ---

  ### **The Argument: Hart’s Collapse into Qualified Legal Moralism**
  #### **Step 1: Paternalism Implicitly Relies on Moral Judgments**  
  Hart justifies paternalism by claiming certain acts (like consensual mutilation) are "irreversible" harms that degrade human well-being. But this relies on a **non-neutral conception of the good**:  
  - *Why* is consensual harm "degrading"? This assumes an objective moral truth that certain acts *inherently* damage human dignity or flourishing—even if participants disagree.  
  - **Contradiction**: Hart’s "harm" here is not Millian (non-consensual harm to others) but *moralized harm*. He judges the act’s *inherent moral desirability*, not just its material consequences. This mirrors Devlin’s moralism, repackaged as "well-being."  

  #### **Step 2: Public Indecency Laws Protect Morality, Not Harm**  
  Hart defends public indecency laws by citing "offense to others" as a psychological harm. But:  
  - **The "Harm" is Subjective and Morally Contingent**: Disgust at seeing nudity/homosexuality stems from internalized *moral beliefs* (e.g., "sexuality must be private"). If the harm depends on the viewer’s moral sensibilities, the law is effectively enforcing a moral norm.  
  - **Hart’s Distinction Collapses**: Preventing "distress" from seeing morally disapproved acts is indistinguishable from Devlin’s "intolerance, indignation, and disgust." Hart’s "harm prevention" becomes a Trojan horse for moralism.  

  #### **Step 3: No Principled Line Between Hart and Devlin**  
  - **Devlin’s Claim**: Society may enforce shared morality to prevent disintegration.  
  - **Hart’s Effective Position**: Society may enforce (a) moral judgments about well-being (paternalism) and (b) moral sensibilities about public conduct (indecency laws).  
  - **The Fatal Equivalence**:  
    - Both allow criminal law to enforce *non-harm-based moral values*:  
      - Paternalism enforces values about *human dignity*.  
      - Indecency laws enforce values about *public morality*.  
    - Neither relies on empirical evidence of social disintegration (Hart’s critique of Devlin). Both rest on normative claims about what makes life "degrading" or society "orderly."  

  #### **Step 4: Hart’s "Critical Morality" is Itself a Moral Position**  
  Hart insists society only needs a shared *critical* morality of harm-avoidance. But his concessions show:  
  - His "harm" includes *moralized concepts* (degradation, psychological offense).  
  - This "critical morality" is itself a substantive (and controversial) moral view—not a neutral baseline. Devlin could argue his positive morality is equally "critical" to his society’s identity.  

  ---

  ### **Conclusion: Hart as a Qualified Legal Moralist**
  Hart’s concessions force him to accept that:  
  1. The state may criminalize conduct based on **moral judgments about well-being** (paternalism).  
  2. The state may criminalize conduct based on **protecting moral sensibilities** (public indecency).  

  This grants two core pillars of legal moralism: the enforcement of morality for the sake of (a) individual "good" and (b) social "order." Hart’s only distinction from Devlin is *which* moral values may be enforced ("dignity" vs. "sexual morality") and *how widely* they must be shared. This is **qualified legal moralism**—rejecting Devlin’s *scope* but accepting his *logic*. Hart’s anti-moralist project fails because his concessions require the very moral judgments he sought to exile.  

  ---

  **Key Seminar Takeaway**: Hart’s attempt to defend liberalism via a harm principle is unstable. Once harm is expanded to include moralized concepts (dignity, psychological offense), legal moralism resurfaces. This anticipates modern debates (e.g., whether "hate speech" laws enforce morality or prevent harm). For further discussion, contrast Hart’s concessions with Joel Feinberg’s stricter harm/offense principle in *Offense to Others*.
