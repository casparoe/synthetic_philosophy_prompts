prompt: |-
  Ok so this is a slightly random one but bear with me. Ive been dealing with some annoying gut issues since the spring, and my doctor has me doing one of those elimination-diet-plus-mood-journal things, basically logging what i eat against how foggy/irritable/anxious i feel the next day. I complained about this to my sister, who's finishing up a philosophy degree, and she sent me a passage from Nietzsche as a joke — something like "congrats, you've basically reinvented his whole deal." I figured she was exaggerating for comic effect, until i actually read it, because the man is not kidding around.

  It's from Ecce Homo, the section called "Why I Am So Clever" (this is the old 1911 Anthony Ludovici translation, so forgive the stiff phrasing):

  I am much more interested in another question,—a question upon which the "salvation of humanity" depends to a far greater degree than it does upon any piece of theological curiosity: I refer to nutrition. For ordinary purposes, it may be formulated as follows: "How precisely must thou feed thyself in order to attain to thy maximum of power, or virtù in the Renaissance style,—of virtue free from moralic acid?" ... But as to German cookery in general—what has it not got on its conscience! Soup before the meal ...; meat boiled to shreds, vegetables cooked with fat and flour; the degeneration of pastries into paper-weights! ... German intellect is indigestion; it can assimilate nothing. ... Nothing should be eaten between meals, coffee should be given up—coffee makes one gloomy. Tea is beneficial only in the morning. It should be taken in small quantities, but very strong. It may be very harmful, and indispose you for the whole day, if it be taken the least bit too weak. ... Remain seated as little as possible, put no trust in any thought that is not born in the open, to the accompaniment of free bodily motion—nor in one in which even the muscles do not celebrate a feast. All prejudices take their origin in the intestines. A sedentary life, as I have already said elsewhere, is the real sin against the Holy Spirit.

  So here's what im actually stuck on. First, small thing: what is "moralic acid" even supposed to be — is that just a translation gag meant to sound like a chemical, or is he pointing at some actual concept of his from elsewhere? Bigger thing: is he being completely serious in this passage, or is it some kind of self-aware bit? (Ecce Homo also has a chapter literally called "Why I Am a Destiny," so I know there's showmanship going on at some level, I just don't know how much.) And if he IS serious that spiritual and moral convictions are basically downstream of digestion and climate, doesn't that claim eat itself a little? "All prejudices take their origin in the intestines" is itself a claim, and by his own logic it presumably came out of somebody's intestines too — so why does it get to be the one true insight instead of just another symptom to be explained away like the rest? It also doesn't obviously fit with the whole self-overcoming, create-your-own-values side of him that i've picked up secondhand from friends — if temperament really just reduces to diet and which city you live in, what's actually left to overcome or choose? Could you help me actually work through this passage and whether the physiological-determinism angle holds together with the rest of what he's known for, or whether he's just contradicting himself here?
