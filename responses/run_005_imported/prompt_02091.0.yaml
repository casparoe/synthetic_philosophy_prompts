  Ok I need a tiebreaker bc I just had a two hour argument with my friend about this and neither of us gave up. She's really into utilitarianism and kept saying Harsanyi basically proved it with his aggregation theorem — like, if you and society are both rational in the von Neumann-Morgenstern sense and Pareto holds, then the social utility function has to be a weighted sum of everyones utility, end of story. Fine, I'll grant the math part. But then she said this is basically the same move as the veil of ignorance, so Rawls was just being inconsistent when he got maximin out of what's supposedly the same setup. That felt like a bait-and-switch to me but I couldn't articulate why. Can you compare Harsanyi's aggregation theorem with Rawls's veil-of-ignorance argument for the difference principle? Specifically I want to know if the "equal chance of being anyone" move is actually part of the aggregation theorem itself or if she's conflating it with a different Harsanyi argument, and what the real crux is of why they land on such different rules (utilitarian sum vs maximin) even though both are supposedly starting from impartiality.
