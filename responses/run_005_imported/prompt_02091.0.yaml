  *scribbles mental diagram* Also crucial is their divergent views on utility. Harsanyi treats it as measurable, interpersonally comparable VNM utility. Rawls explicitly rejects this, substituting "primary goods" and making utility rankings incommensurable behind the veil. That technical difference alone explains why averaging vs lexicographic rules emerge. 

