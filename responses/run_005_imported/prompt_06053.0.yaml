answer: |-
  Here are 8 focused questions with anticipated responses and sharp follow-ups, designed to push the paraconsistent interpretation on its toughest points:

  1.  **Core Distinction:** "You argue that the negation of a catuskoti corner *can* sometimes indicate a true contradiction (P & ~P), rather than merely rejecting a *svabhava*-laden interpretation of P. Could you give a *concrete example* from the MMK where the negation *must* be read as affirming a true contradiction, and explain precisely why a Prasangika like Tsongkhapa (who denies svabhava in all conventional designations) would be *incorrect* to interpret that same negation as only rejecting a reified version of P? Where does the exegetical rubber meet the road?"
      *   *Anticipated Response:* Points to a specific tetralemma (e.g., Tathagata after death, Ch. 22) and claims the plain meaning of the terms, under conventional usage devoid of inherent existence, *still* leads to contradiction when denied.
      *   *Follow-up:* "If the contradiction arises even when P is understood conventionally *without* svabhava, doesn't that imply the conventional world *itself* is fundamentally inconsistent? How does this avoid collapsing into the very 'nihilism' (ucchedavāda) Nagarjuna is often charged with, by making coherent conventional discourse impossible?"

  2.  **Self-Refutation (MMK 13.8):** "Nagarjuna famously warns in MMK 13.8 that treating emptiness *itself* as a view or position (*dṛṣṭi*) is disastrous. How does asserting that 'some contradictions are *literally true*' (a claim about the ultimate nature of reality) *not* constitute precisely such a reified view of emptiness? Isn't 'there are true contradictions' a substantive metaphysical thesis about how reality *is*, violating the therapeutic, purely negating intent?"
      *   *Anticipated Response:* Emphasizes that the paraconsistent claim is a *description* of the consequence of emptiness applied rigorously, not a positive thesis *about* emptiness itself. It's what *happens* to concepts under analysis.
      *   *Follow-up:* "But isn't the claim 'some contradictions are true' *itself* a conceptual proposition subject to the same tetralemma analysis? Doesn't asserting its truth inevitably reify *it*? If you say it's only conventionally true or merely descriptive, how does that differ significantly from the Prasangika 'no thesis' stance?"

  3.  **Prasangika Method & "No Thesis":** "Candrakirti insists the Mādhyamika uses *prasaṅga* solely to reveal absurd consequences (*prasaṅga*) in opponents' positions, asserting *nothing* positive of their own. How is asserting 'some contradictions are true' compatible with this purely negative, reductio-based methodology? Doesn't it constitute a positive ontological claim about reality that Candrakirti explicitly avoids?"
      *   *Anticipated Response:* Argues that recognizing true contradictions is the *result* of applying prasaṅga consistently, not an independent assertion. It's the *recognition* of the logical consequence of emptiness, forced upon us by reason.
      *   *Follow-up:* "If it's merely the *recognition* of a consequence, why frame it as 'true contradictions *exist*' rather than 'attempts to formulate consistent propositions about X under ultimate analysis *fail*'? Doesn't the former phrasing inherently posit an ontological feature ('existent contradictions'), while the latter stays within the bounds of epistemic limitation and negating function?"

  4.  **Scope of the Catuskoti:** "The MMK applies the tetralemma to specific, profound questions (Tathagata after death, time, nirvana, etc.). Is your paraconsistent reading intended as a *fully general logical schema* applicable to *any* proposition whatsoever (e.g., 'the cup is on the table'), or is it restricted to propositions attempting to characterize *ultimate reality* or entities presumed to have svabhava? If restricted, how do you demarcate the domain where contradictions arise?"
      *   *Anticipated Response:* Likely restricts it to ultimate truths, or propositions involving presumed inherent existence, or the limits of conceptualization about fundamental reality.
      *   *Follow-up:* "But Nagarjuna *also* uses the tetralemma on concepts like 'motion' (Ch. 2) which seem deeply embedded in conventional reality. If applying the koti to 'motion' can yield a true contradiction, doesn't this fatally infect *all* conventional discourse, as per my first follow-up? If not, what principle protects ordinary propositions ('the cup is on the table') from collapsing into contradiction under analysis?"

  5.  **Svabhava vs. Paraconsistency:** "Critics argue that the Prasangika negation of all four kotis *only* negates each horn *under the assumption of svabhava*. Once svabhava is thoroughly negated, conventional truths operate coherently under bivalent logic. How does your paraconsistent reading *improve* on this explanation? Does it solve a problem the Prasangika account *cannot*, or is it primarily motivated by a different philosophical sensibility?"
      *   *Anticipated Response:* Argues that even *without* svabhava, deep analysis of certain concepts (like the Tathagata, time, etc.) *still* leads to inescapable contradictions, showing the limits of conventional bivalence even post-svabhava-negation.
      *   *Follow-up:* "Isn't the Prasangika response simply that such contradictions signal the *inapplicability* of the concepts/questions *themselves* to ultimate reality, not the *truth* of the contradiction? How do you demonstrate that the contradiction is *true* rather than just revealing the *meaninglessness* or *improper framing* of the question under ultimate analysis?"

  6.  **The Role of Logic:** "If Nagarjuna is intentionally affirming true contradictions in the tetralemma, what does this imply about his view of the *purpose* or *scope* of logic (*nyāya*)? Is he rejecting classical logic entirely, showing its limitations only for ultimate truths, or repurposing it dialectically? How does a paraconsistent system *itself* avoid becoming another reified framework?"
      *   *Anticipated Response:* Emphasizes that logic is a conventional tool, useful but limited. Paraconsistent logic is a *better* tool for describing the consequences of emptiness without collapse into triviality.
      *   *Follow-up:* "Doesn't adopting *any* specific logical system (paraconsistent or otherwise) as the 'correct' framework for interpreting Nagarjuna risk becoming a new form of essentialism (*dṛṣṭi*) about logic itself? How does your reading avoid turning paraconsistent logic into the new 'svabhava of reasoning'?"

  7.  **Practical & Soteriological Implications:** "The MMK is ultimately a soteriological text aimed at liberation. How does the *belief* or *understanding* that 'some contradictions are literally true' function on the path? Does it offer a practical advantage over the Prasangika focus on the cessation of conceptual proliferation (*prapañca*) through relentless negation without positive assertion? Or is it primarily a theoretical stance?"
      *   *Anticipated Response:* May argue it deepens the understanding of emptiness, shattering conceptual complacency more thoroughly by showing reality's radical inconsistency even beyond non-inherence.
      *   *Follow-up:* "Couldn't it be argued that *asserting* true contradictions is itself a potent form of conceptual proliferation? How does holding the view 'P & ~P is true for some P' lead more effectively to the pacification of all views (*dṛṣṭi*) than the Prasangika method of systematically dismantling *all* views without asserting any counter-position, including the view about contradictions?"

  8.  **Historical Fidelity & the Prasangika Objection:** "Tsongkhapa and key Prasangika commentators explicitly argued that the negation of all four kotis *does not* imply true contradictions, precisely to avoid the pitfalls they saw in the paraconsistent (or similar) interpretations (like nihilism or reification). Given that they were deeply immersed in the Indian commentarial tradition, what compelling *textual* or *philosophical* reasons do you have for overriding *their* hermeneutical principle that the negations target *only* the reified interpretations?"
      *   *Anticipated Response:* Argues that later commentators smoothed over the radical edge of Nagarjuna, or that a close reading of Nagarjuna's *arguments* forces the paraconsistent conclusion despite later orthodoxies.
      *   *Follow-up:* "If the Prasangikas, dedicated to avoiding all views (*dṛṣṭi*), interpreted Nagarjuna as *not* asserting true contradictions, doesn't that suggest the paraconsistent reading *introduces* a view where they meticulously sought to avoid one? Isn't the burden of proof very high to show that the tradition's own most rigorous exponents on 'no thesis' fundamentally misunderstood the master on this crucial logical point?"

  **Key for Delivery:**

  *   **Listen Closely:** The follow-ups hinge on the *specific wording* of the initial answer. Be ready to adapt.
  *   **Clarify, Don't Confront:** Frame follow-ups as seeking deeper understanding: "If I understand you correctly, you're saying X... Could you then help me see how that addresses Y?"
  *   **Focus on Text & Logic:** Ground questions in specific MMK verses (like 13.8, 22:11-14 for the Tathagata koti) and logical implications.
  *   **Respect the Scholar:** Maintain a tone of engaged philosophical inquiry. The goal is rigorous exploration, not "gotcha".

  These questions force engagement with the core tensions: exegetical fidelity vs. philosophical innovation, the nature of negation, the status of logic, the avoidance of views, and the practical aim of the text. Good luck with the seminar!
