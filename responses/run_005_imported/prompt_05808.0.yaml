  Okay, let me unpack this user's query about Bradley's regress. They've clearly done their homework—reading the original Appearance and Reality chapter after getting frustrated with secondary summaries. That's impressive but also explains their confusion; Bradley's Victorian prose is notoriously dense.  

  First, I need to distinguish two things they're conflating:  
  1. The mutual dependence argument (qualities ⇄ relations)  
  2. The infinite regress argument (R needs R' to relate to terms)  
  The user thinks the first sounds like harmless holism, and they're right—but Bradley's calling it a vicious circle because he assumes relations/qualities can't be *fundamental*. His absolute idealism demands everything be reducible to a non-relational whole.  

  The key insight they're missing is Bradley's hidden premise: relations are *always* external additions. That's why mutual dependence becomes "infection" for him—if qualities need relations to exist, but relations are separate entities, then qualities can't be independent. Modern metaphysicians would reject this by embracing internal relations or trope theory.  

  About the regress: yes, it's later in the chapter (§26-27). Bradley argues that connecting a relation R to term a requires a new relation R₁ (ad infinitum). This *is* the standard "Bradley's regress" reference. The mutual dependence is the setup; the regress is the knockout punch.  

  Russell connection: Ah, this is juicy. Russell's 1903 rejection of "relations as adjectives" in *Principles of Mathematics* directly engages Bradley. He needed relations to be real and non-relational to stop the regress—hence his "relation R relates a and b without further mediation" stance. Unity of the proposition hangs on this!  

  User's last quip about equivocation is sharp. Bradley *does* blur "relation" between logical structure and metaphysical entity. But that's partly the point: he thinks any relational analysis *must* treat relations as things-in-themselves, inviting regress.  

  ...I should emphasize how this ties to contemporary "states of affairs." Armstrong-style facts *do* face Bradleyan objections—if a state of affairs [aRb] has a, R, b as constituents, what unifies them? But tropes or non-mereological bundles offer escapes.  

  Final note: User's skepticism is healthy. Bradley's argument isn't a slam-dunk; it's a challenge to relational models of reality. The real value is how it shaped 20th c. metaphysics—Russell's realism, Wittgenstein's picture theory, even today's truthmaker debates.
answer: |-
  You've hit the nail on the head about the confusion between Bradley's *mutual dependence argument* and the later *infinite regress* that bears his name. Let's dissect the chapter and the legacy:

  ### 1. The Mutual Dependence Argument (Your "Garden-Variety Holism")
  - **Bradley's Claim:** Qualities (e.g., "redness") and relations (e.g., "next to") mutually presuppose each other:
    - *Qualities need relations:* A quality only exists as differentiated from other qualities (e.g., "red" is defined against "blue," "smooth," etc.). Relations carve out this identity.
    - *Relations need qualities:* Relations require relata (things related) with qualities. A relation like "heavier than" is meaningless without objects possessing the quality "weight."
  - **Why Bradley Calls This "Contradictory":**  
    Bradley isn't a holist; he's a **monist** who believes reality is an undifferentiated, non-relational Absolute. For him:
    - Qualities must be *intrinsic* and self-sustaining to be real. Needing relations makes them "infected" by externality.
    - Relations must be *real connections*. But if they depend on pre-existing relata with qualities, and those qualities depend on relations, neither can be foundational.  
    **His Hidden Premise:** *Nothing genuinely real can be inherently dependent.* Mutual dependence = neither is ontologically prior → both are unreal appearances. It's a "vicious circle" because it violates his ideal of reality as self-contained simplicity.

  ### 2. The Infinite Regress Argument (The "Bradley's Regress" Throwaway)
  This comes **later in the chapter** (§26-27). It's a distinct (though related) argument targeting relational facts like "a is R to b" (e.g., "the cup is on the table"):
  - **The Regress:**
    1. For a relation `R` to connect `a` and `b`, we need `R(a, b)`.
    2. But `R`, `a`, and `b` are distinct entities. What connects `R` to `a` and `b`? A *further* relation `R₁` linking `R` to `a`, and `R₂` linking `R` to `b`.
    3. But what connects `R₁` to `R` and `a`? Now we need `R₃`, `R₄`, etc. → **infinite regress**.
  - **Why It's Vicious:**  
    Bradley argues this regress never "grounds" the original fact. Relations cannot perform their connecting role without invoking an endless chain of further connectors. The unity of the proposition ("aRb") is thus illusory.

  ### Connection Between the Two Arguments
  - **Mutual Dependence is the Foundation:** It shows qualities and relations *can't be fundamental* because they're interdependent. This undermines any ontology built from them.
  - **Regress is the Execution:** It shows that *even if you try to use relations*, their operation leads to incoherence. The regress is a symptom of the deeper disease exposed by mutual dependence.

  ### Why Russell Took It Seriously (And How It Shaped Analytic Philosophy)
  - **Russell's Problem:** In his early work (e.g., *Principles of Mathematics*), Russell needed to explain the unity of propositions. "aRb" isn't just a list {a, R, b}; R *relates* a to b. How?
  - **Bradley's Challenge:** Bradley argued that any relational analysis either:
    - Reduces relations to qualities (incoherent per mutual dependence).
    - Treats relations as additional entities → invites the regress.
  - **Russell's Solution (and Why Bradley Matters):**  
    Russell realized he must **deny Bradley's core premise** that relations are "external" entities requiring further relations to connect. He argued:
    - Relations are **fundamental and directly relational**. `R` doesn't *need* a further relation to hold between `a` and `b`; it *just does*. Its nature is to relate.  
    → This is why Russell insists relations are "unsaturated" (like Fregean functions) and not just more terms.  
    **Impact:** Bradley forced Russell (and later Wittgenstein) to grapple with propositional unity at a metaphysical level. The regress shows that relations can't be treated as mere "objects"; they require a distinct logical category.

  ### Why "States of Affairs" Might Dodge Bradley (Or Not)
  - **The Dodge:** Armstrong-style states of affairs (e.g., *[a's being R to b]*) are *unified complexes*. The unity is primitive: the state of affairs is a single fact, not a collection of parts needing "glue." Relations aren't separate entities; they're *ways objects are combined* in the fact.
  - **Bradley's Retort (via Regress):**  
    If a state of affairs has *constituents* (a, R, b), what unifies *them*? If the state is "more than the sum of its parts," what is this "more"? If it's a primitive unity, Bradley would call it a disguised appeal to the Absolute (which he accepts, but metaphysicians reject).
  - **Modern Responses:**  
    - **Trope Theory:** Replace "universals" (R) with particularized relational tropes (e.g., *this particular being-on between cup and table*). No regress, as the trope is inherently relational.  
    - **Mereological Bundle Theory:** Objects are just bundles of properties. "aRb" is a complex bundle including relational properties.  
    Bradley would likely critique these as still relying on hidden relations/unities.

  ### Key Takeaway
  You're right: the mutual dependence argument (qualities ⇄ relations) *looks* like holism but is deemed vicious **because Bradley assumes reality must be non-relational and self-subsistent**. The regress (§26-27) is the more famous "Bradley's Regress," but it's grounded in the earlier critique. Russell took it seriously because it exposed a genuine puzzle about propositional unity that couldn't be solved by treating relations as ordinary objects. Metaphysics since has largely been an attempt to answer Bradley without resorting to his Absolute—hence the ongoing dance with states of affairs, tropes, and structures.
