prompt: |-
  I'm on my university's Greek life judicial board, and this Friday's hearing has two cases that are basically the same violation with very different outcomes. Both chapters ran the exact same banned pledge activity (an off-campus blindfolded 'trust walk') this semester -- in one case nobody was hurt, in the other a pledge got hit by a car and is still in the ICU, which by all accounts was a total fluke neither chapter couldve seen coming. Nationals for the second chapter is arguing both chapters should get the same sanction (probation) since the actual rule-breaking was identical; a couple board members want to pull that chapter's charter anyway given how things turned out. Our code just says sanctions should fit 'the severity of the incident,' and that phrase is doing a lot of work here since people clearly mean different things by it. Can you draft the memo I'll bring to the hearing recommending concrete next steps for each chapter, in a way that actually engages the 'you'd just be punishing bad luck' objection instead of brushing past it?
reasoning: |-
  Okay, the user is part of a Greek life judicial board facing a tricky situation. They have two cases with the same violation—running a banned blindfolded trust walk—but drastically different outcomes. One had no injuries, while the other resulted in a pledge in the ICU after a car accident. The challenge is determining fair sanctions when the rule-breaking was identical, but the consequences were worlds apart.  

  First, I need to unpack the core tension: Should sanctions focus solely on the act itself (identical in both cases) or factor in the outcome (catastrophic in one)? The user mentioned Nationals arguing for equal punishment (probation) since the violation was the same, while some board members want to revoke the charter of the chapter with the injured pledge.  

  The user’s code states sanctions should fit "the severity of the incident," which is deliberately vague. That phrase is doing heavy lifting here—it could mean severity of the *rule violation* (same for both) or severity of the *consequences* (wildly different). The user wants a memo that explicitly addresses the "punishing bad luck" counterargument, not just sidesteps it.  

  Hmm, the ethical dilemma is real: If both chapters took the same risk, punishing one more harshly because of an unpredictable accident *does* feel like penalizing bad luck. But ignoring the outcome entirely ignores the board’s duty to prioritize safety. The ICU incident is a stark reminder of *why* the rule exists.  

  I should structure the memo to:  
  - Acknowledge the identical violations upfront.  
  - Define "severity" as having two dimensions: *culpability* (how blameworthy the act was) and *consequence* (the harm caused).  
  - Argue that while culpability is the same, consequences matter for sanctions because they reflect the *real-world impact* of the risk taken.  
  - Propose tiered sanctions: Probation for the "no harm" chapter, probation plus major reforms for the ICU chapter.  
  - Explicitly counter the "bad luck" objection: The point isn’t to punish luck, but to respond proportionally to the harm done and force accountability for preventable risks.  

  Key nuance: The car accident was a fluke, but the *risk* wasn’t. Blindfolding people near traffic is inherently dangerous. The chapter with the accident didn’t *cause* the car, but they created the conditions for disaster.  

  For the memo’s tone: Neutral, procedural, but firm on safety. Avoid moralizing; focus on policy logic. Recommend concrete steps:  
  - Chapter A (no injury): Probation + education.  
  - Chapter B (ICU): Probation + safety reforms + victim support mandate.  
  - Both: A joint statement condemning the activity to show consistency.  

  This balances fairness (both punished for the act) with proportionality (the chapter that caused harm faces steeper accountability). It also turns the incident into a systemic teaching moment.  

  The user’s deeper need: They want to uphold justice without seeming arbitrary or cruel. The memo must legitimize outcome-based sanctions while preempting backlash from chapters or Nationals.
answer: |-
  Here’s a draft memo for your judicial board hearing that directly confronts the "bad luck" argument while proposing tiered, principle-based sanctions. It grounds the decision in risk assessment, foreseeable harm, and the duty of care—not just outcomes:

  ---

  **MEMORANDUM**  
  **TO:** Greek Life Judicial Board  
  **FROM:** [Your Name], Judicial Board Member  
  **DATE:** [Date]  
  **RE:** Recommended Sanctions for Chi Chapter & Omega Chapter Violations (Banned "Trust Walk" Activity)  

  ### Case Summary
  Both Chi Chapter (no injuries) and Omega Chapter (pledge critically injured) violated the same rule: conducting an off-campus blindfolded "trust walk" pledge activity, expressly prohibited under Section 4.1 of the Greek Life Code. The *act* of rule-breaking is identical. The *outcome* differs radically due to an unforeseeable accident (pledge struck by vehicle).  

  ### Core Issue: Defining "Severity of the Incident"
  Our Code mandates sanctions fit "the severity of the incident." This requires examining two dimensions:  
  1. **Culpability:** The intent, recklessness, and inherent danger of the *violation itself*.  
  2. **Consequence:** The actual harm caused by the violation.  

  **Nationals’ Argument (Equal Sanctions):**  
  "Identical violations deserve identical sanctions. Punishing Omega more harshly penalizes bad luck, not greater wrongdoing."  

  **Board Concerns (Unequal Sanctions):**  
  "Outcomes matter. Ignoring catastrophic harm undermines accountability and safety."  

  ### Recommended Framework: Proportional Accountability
  **We can reconcile these by recognizing:**  
  - **Culpability is equal:** Both chapters knowingly ran the same banned, high-risk activity.  
  - **Consequences are not:** While the *accident* was a fluke, the *magnitude of potential harm* was foreseeable. Blindfolding individuals near traffic inherently risks catastrophic outcomes—even if statistically rare.  
  - **"Bad luck" is not an ethical shield:** Sanctions should reflect both the *wrongdoing* and the *duty to mitigate foreseeable risks*. A near-miss (Chi) versus actual catastrophe (Omega) demonstrates how the same reckless act can yield vastly different harms due to variables beyond control. Our response must acknowledge this reality while avoiding *punishing randomness*.  

  ### Recommended Sanctions
  **Chi Chapter (No Injury Incident):**  
  - **Probation for 12 months** (standard for this violation).  
  - **Mandatory Risk Management Training:** All members must complete a university-approved workshop on foreseeability of harm in pledge activities.  
  - **Written Apology & Plan:** Chapter must submit a letter acknowledging the inherent dangers of the activity and a safety protocol for future events.  

  **Omega Chapter (Critical Injury Incident):**  
  - **Probation for 18 months** (enhanced due to consequence).  
  - **Immediate Suspension of Pledge Program:** Until a new, nationally-approved New Member Educator is appointed and a revised safety plan is implemented.  
  - **Mandatory Trauma-Informed Training:** For all members, addressing duty of care and bystander intervention.  
  - **Community Restitution:** 200 hours of service supporting campus safety initiatives (e.g., traffic awareness campaigns).  
  - **Requirement to Support Victim:** Facilitate (non-financial) support for the injured pledge’s family, as appropriate.  

  ### Why This Addresses "Bad Luck"
  1. **Probation for both** affirms identical culpability for the violation.  
  2. **Enhanced sanctions for Omega** respond not to "luck," but to the *foreseeable potential for severe harm* inherent in the activity—a risk both chapters ignored. The accident actualized that risk, demanding greater accountability for *failure to protect*.  
  3. **Restitution focuses on systemic change:** Omega’s sanctions repair harm to the community’s safety and trust by addressing the *real-world impact* of their recklessness. This isn’t penalizing chance—it’s mandating responsibility for creating high-risk environments.  

  ### Key Precedential Language for the Board
  > *"While the triggering accident was unpredictable, the gravity of risk taken was not. Sanctions must account for both the violation’s intent and its manifest consequences. To treat a near-miss and a tragedy identically would undermine the Code’s purpose: to protect students from foreseeable harm. Proportionality demands we recognize outcomes where they expose systemic failures in judgment."*  

  ---  

  **Next Steps for Hearing:**  
  1. Present this framework to anchor deliberation.  
  2. Invite Nationals to address: *"If blindfolding pledges near traffic carries foreseeable catastrophic risk, why should a chapter that realized that risk face no greater accountability than one that avoided it?"*  
  3. Emphasize: This approach avoids charter revocation (disproportionate to culpability) while refusing to trivialize outcomes.  

  This memo forces the board to confront the philosophical tension while offering a defensible, safety-focused compromise. It accepts that *identical acts* can warrant *different responses* when consequences reveal the true stakes of the risk taken.
