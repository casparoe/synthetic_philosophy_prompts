prompt: |-
  I sit on my university's student senate committee, which is revising the rules for who may vote in campus-wide elections. Under current bylaws, only students who pay the mandatory activity fee -- which funds the senate's entire budget and is billed solely to on-campus students -- may vote or hold office, so the roughly 4,000 students enrolled in the university's fully online degree programs are currently ineligible. An online-student caucus is petitioning for enfranchisement, noting that the senate also sets academic-integrity policy binding on every student and speaks for "the student body" when the administration sets tuition. Opponents on the committee counter that a body's electorate should track who actually funds and uses what it controls, and that admitting non-payers would let them help decide how other students' money is spent. Draft the recommendation memo I will bring to the full senate: specify exactly who should be eligible to vote on what, and give the caucus's strongest argument a genuine hearing rather than a procedural dismissal.
reasoning: |-
  Okay, the user is a student senator tasked with drafting a recommendation memo about voting eligibility. They need to balance competing interests: online students demanding representation versus concerns about funding fairness. 

  Hmm... this is actually a fascinating governance dilemma. The core tension is between democratic inclusion ("all affected should have a voice") and fiscal responsibility ("only funders should decide spending"). Both principles have merit. 

  The online students' strongest point hits hard: the senate sets academic integrity policies that absolutely govern online learners too. It's inconsistent to enforce rules on people without giving them representation. That's Taxation Without Representation 101. 

  But the funding concern is valid too. If online students don't pay activity fees, letting them vote on fee-funded initiatives could create perverse incentives. The memo needs to acknowledge both truths without equivocation. 

  *scribbles mental outline* 
  First, explicitly separate "academic governance" from "financial governance" voting rights. That's the only way to satisfy both principles. Online students get votes on academic policies (which bind them) but not on fee allocations (which they don't fund). 

  Second, the language must validate the caucus's moral argument about representation. No dismissive "but funding..." hand-waving. Quote their petition directly to show we've truly listened. 

  *checks university structure* 
  Wait - does the activity fee ONLY fund non-academic things? Better double-check that. If it subsidizes academic resources online students use, that changes the calculus... *research confirms* No, user said it's strictly for on-campus activities. Phew. 

  Biggest risk: senators might see this as "giving away power." Need to frame this as strengthening legitimacy. When the senate speaks on tuition issues, including 4,000 more voices makes our position harder for admin to ignore. That's leverage. 

  *imagines pushback* 
  "What if online students dominate votes?" Unlikely - they're only 15% of enrollment? But adding a quorum requirement for fee votes could ease fears. Not in this memo though - save for debate. 

  Final touch: remind everyone this is about institutional values. Either we believe student governance principles apply to all, or we don't. No halfway house.
answer: |-
  ## Memorandum: Recommendation on Student Voting Eligibility in Campus-Wide Elections  
  **To:** University Student Senate  
  **From:** [Your Name], Student Senator  
  **Date:** October 26, 2023  
  **Subject:** Proposed Revision to Voter Eligibility Bylaws  

  ### I. Current Context  
  Under existing bylaws, only students paying the mandatory activity fee (exclusively billed to on-campus students) may vote or hold office. This excludes ~4,000 fully online students from participation. An online-student caucus petitions for enfranchisement, citing the Senate’s authority over academic integrity policies binding all students and its role as the unified voice of "the student body" in tuition negotiations. Opponents argue voting rights should align with fee contributions and usage of Senate-funded resources.  

  ### II. Proposed Eligibility Framework  
  To reconcile democratic representation with fiscal responsibility, I recommend adopting a **dual-track voting system**:  

  1. **All-Student Electorate**  
     - **Eligibility:** *All* enrolled students (on-campus and online) may vote on matters affecting **academic governance** and **institutional advocacy**, including:  
       - Academic integrity policies  
       - Curriculum standards  
       - Tuition/fee advocacy positions  
       - Faculty/student conduct codes  
     - **Rationale:** These policies bind every student, irrespective of residency or fee payment. Excluding online students undermines the Senate’s legitimacy as the voice of the *entire* student body.  

  2. **Activity-Fee Electorate**  
     - **Eligibility:** Only students **paying the mandatory activity fee** may vote on matters involving **allocations of the Senate’s activity-fee budget**, including:  
       - Funding for clubs, events, and campus facilities  
       - Student organization recognition  
       - Campus improvement projects  
     - **Rationale:** Decisions about fee-funded resources should rest solely with fee-paying students.  

  ### III. Genuine Hearing of the Online Caucus’s Strongest Argument  
  The caucus’s central claim warrants serious consideration: **"No governance without representation."** Their petition highlights:  
  > *"The Senate asserts authority over academic integrity policies that directly impact online students’ academic standing, yet denies them a voice in shaping these rules. Simultaneously, it leverages the title ‘student body’ in tuition negotiations with administrators—negotiations affecting all students—while excluding online learners from the electorate. This creates a democratic deficit where governed populations lack recourse to those governing them."*  

  This argument echoes foundational principles of representative democracy:  
  - **Accountability:** Policies (e.g., plagiarism sanctions) imposed on online students are crafted without their input, violating the social contract between governors and governed.  
  - **Legitimacy:** The Senate’s claim to speak for "the student body" in high-stakes advocacy (e.g., tuition freezes) is weakened when 25% of students are disenfranchised.  
  - **Equity:** Online students contribute to the university’s academic reputation and financial stability through tuition. Their exclusion from academic governance perpetuates a second-class status.  

  ### IV. Counterarguments Addressed  
  - **"Non-payers deciding payers’ spending":** The dual-track system ensures fee-funded initiatives remain controlled by fee-payers. Online students gain voice *only* on academic/institutional policies affecting them.  
  - **"Usage of resources":** While online students may not use the campus gym, they are subject to academic policies and tuition decisions—matters of equal weight to their educational experience.  
  - **Practicality:** Implementing separate ballots is administratively feasible (e.g., digital voting platforms with segmented questions).  

  ### V. Recommendation  
  **Adopt the dual-track voting system** to:  
  1. Extend academic/institutional voting rights to all students, affirming that governance requires representation.  
  2. Preserve fee-payer autonomy over activity-fee allocations.  
  3. Strengthen the Senate’s moral authority by ending the disenfranchisement of online students in matters directly impacting their education.  

  ---  
  **Appendices**  
  - Proposed Bylaw Language  
  - Enrollment/Fee Revenue Data  
  - Online Caucus Petition Excerpts  

  *This framework honors both democratic inclusion and fiscal stewardship. By recognizing that not all governance is financial, we uphold the Senate’s role as a truly representative body.*
