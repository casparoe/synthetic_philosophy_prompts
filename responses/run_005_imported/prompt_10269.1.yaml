  The user's in a Democratic Theory seminar, so they're probably thinking about principles like representation and fairness. They mentioned that graduating seniors get to vote but won't use the center, while incoming students who'll pay and use it can't vote. That's the core conflict.

  Hmm, the committee's split: half thinks "enrolled" is neutral, half thinks it's arbitrary. The user wants a memo that takes the incoming students' case seriously, not just dismisses it. They need this for a vote on Thursday, so it's urgent. 

  First, I should frame this in democratic theory terms—like affected interests or all-subjected principle. The fee binds future students, so excluding them is a legit concern. But universities operate on current enrollment, so that's the default. 

  The tension is between administrative practicality (current enrollment is clear-cut) and democratic ideals (those affected should have a say). The memo should acknowledge both but argue for expanding eligibility. 

  Key points to cover: 
  - Why incoming students are meaningfully affected (they'll pay, use the facility, and the fee impacts their choice). 
  - Why "enrolled" isn't perfectly neutral (it excludes future payers). 
  - Address counterarguments: administrative burden? But the uni already has next fall's admits. 
  - Propose solutions: maybe let incoming students vote if they've registered for classes? 

  The tone should be balanced but persuasive. The user wants this to feel rigorous, not emotional. Since they're in that seminar, referencing democratic theory will resonate. 

  Also, the user might be frustrated—this is "on the nose" for their class—so the memo should feel thoughtful, not rushed. They’re likely looking for intellectual backup to sway colleagues. 

  Structure the memo: 
  - Problem summary 
  - Democratic principles 
  - Analysis of both positions 
  - Recommendation (include incoming students) 
  - Implementation (how to verify eligibility) 

  Need to make sure it’s practical too. The committee won’t want chaos. Highlight that next fall’s list exists and can be used. 

  Final thought: The user’s hidden need might be to bridge theory and practice—they want the committee to see this isn’t just paperwork, it’s about who counts in campus democracy.
answer: |-
  ## MEMORANDUM  
  **TO:** Student Senate Elections Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Voter Eligibility for Rec Center Fee Referendum – Balancing Democratic Principles & Practical Impact  

  ### I. The Core Issue
  The referendum on a **$150/semester student fee** for a new recreation center presents a foundational question: *Who constitutes the legitimate "demos" for this decision?* While "currently enrolled" students is the traditional standard, this fee uniquely binds *future* students. We must reconcile administrative precedent with democratic fairness.  

  ### II. Democratic Principles at Stake  
  1.  **The "All-Affected" Principle (Dahl, Shapiro):**  
      A core tenet of democratic theory holds that **those significantly affected by a decision should have a voice in making it.**  
      *   **Graduating Seniors:** Will *not* pay the fee, *nor* use the facility. Their stake is minimal (general campus legacy interest).  
      *   **Incoming Fall Students (Admitted & Deposited):** Will be **mandatorily subject to the fee for multiple semesters** and are the **primary intended users** of the facility. Their financial and experiential stake is direct and substantial. Excluding them violates this principle.  

  2.  **The "All-Subjected" Principle (Song):**  
      Closely related, this principle argues that individuals **subjected to the coercive power of a collective decision** (like a mandatory fee) should have representation.  
      *   **Incoming students** are demonstrably *subjected* to this fee and its governance structure.  

  3.  **Intergenerational Equity:**  
      Decisions imposing long-term costs should respect the interests of those who will bear them. Denying representation to incoming students creates a **democratic deficit between decision-makers and cost-bearers.**  

  ### III. Analysis of "Currently Enrolled" as the Sole Criterion  
  *   **The Argument for Neutrality:** Relies on administrative simplicity and consistency with past elections. It avoids subjective lines.  
  *   **Why It's Insufficient Here:**  
      *   **Arbitrary Impact:** In this *specific* referendum context (a long-term financial commitment impacting defined future cohorts), "currently enrolled" **creates an arbitrary distinction** between two groups with minimal stake (graduating seniors) and those with maximal stake (incoming students).  
      *   **Ignores the Temporal Nature of the Decision:** This isn't a decision about *current* operations; it's an investment binding *future* students. The relevant "community" extends beyond the current semester.  
      *   **Not Truly Neutral:** Neutrality implies fairness to *all affected parties*. Strict adherence to "currently enrolled" unfairly disadvantages a readily identifiable, significantly affected group.  

  ### IV. The Case for Including Admitted & Deposited Incoming Students  
  *   **High Stake:** They bear the full financial burden and will be the primary beneficiaries/users.  
  *   **Definable & Verifiable Group:** The ~600 students admitted *and having deposited* (indicating commitment to enroll) are a concrete, identifiable population. The University *already possesses this list* for admissions and orientation.  
  *   **Democratic Legitimacy:** Including them strengthens the referendum's legitimacy. Their exclusion risks the perception (and reality) of taxation without representation for the facility's main users.  
  *   **Practical Precedent:** Many universities successfully include deposited incoming students in spring elections for Fall-term student government positions and referenda impacting future fees.  

  ### V. Addressing Counterarguments  
  *   **"They aren't technically 'students' yet."**  
      *   *Response:* Democratic principles prioritize **stake and subjection**, not solely administrative status. Their commitment (deposit) and the *certainty* of their enrollment and fee obligation make their stake undeniable.  
  *   **"It's logistically complex."**  
      *   *Response:* The Registrar/Admissions *already* manages the deposited student list. Ballots can be distributed electronically via the email addresses used for admissions communications, similar to orientation materials. Complexity is minimal.  
  *   **"Graduating seniors have historical context."**  
      *   *Response:* Context is valuable, but it doesn't outweigh the direct, substantial, and mandatory financial/experiential impact on incoming students. Seniors retain voting rights on *current* issues.  

  ### VI. Recommendation: A Principled & Practical Line  
  I propose we define voter eligibility for this specific referendum as:  
  **"All currently enrolled undergraduate and graduate students for the [Current Semester], AND all students admitted and having submitted an enrollment deposit for the Fall [Next Year] semester."**  

  ### VII. Justification  
  This approach:  
  1.  **Honors Democratic Principles:** By including those demonstrably subjected to the fee and most affected by the facility.  
  2.  **Ensures Intergenerational Equity:** Gives future cost-bearers a voice.  
  3.  **Maintains Practicality:** Leverages existing university data and processes for a clearly defined group.  
  4.  **Strengthens Legitimacy:** Ensures the decision reflects the will of the community that will live with its consequences.  
  5.  **Remains Bounded:** Focuses on the *immediate* future cohort directly impacted, avoiding slippery slopes.  

  ### VIII. Conclusion  
  Drawing the line solely at "currently enrolled" students for this long-term financial commitment is administratively convenient but democratically inadequate. It prioritizes a technical status over tangible stake. Including admitted and deposited incoming students is not just feasible, but a **necessary step for a just and legitimate outcome.** By adopting this expanded eligibility, we uphold the democratic ideals we study and ensure the referendum truly reflects the interests of those who will build, pay for, and utilize this new center.  

  **I urge the committee to vote in favor of this expanded eligibility criterion.**  

  **Attached:** Sample language for the referendum ballot instructions.  
  ---  

  **Attachment: Draft Ballot Eligibility Language**  
  *"Voting in this referendum is open to: (1) All students currently enrolled in at least one credit-bearing course for the [Current Semester] at [University Name], and (2) All students who have been admitted to [University Name] and submitted an enrollment deposit for full-time undergraduate or graduate study commencing in the Fall [Next Year] semester as of [Date - e.g., one week before voting opens]."*  

  ---  
  This memo provides a robust, theory-grounded argument while offering a concrete, actionable solution. It directly addresses the arbitrariness concern by justifying the inclusion of incoming students based on their significant stake and the feasibility of implementation, moving beyond simple dismissal. Good luck with the vote!
