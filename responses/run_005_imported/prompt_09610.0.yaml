prompt: |-
  so in my history of economic thought seminar we're on book IV of the wealth of nations and im kind of stuck on something. smith's whole reputation is being the guy who showed free trade and open markets make nations richer, and colonies were basically just about grabbing more markets and cheap resources for britain. so wouldnt his own logic mean he'd be totally pro-empire, since more colonies = more trade = more wealth? my prof keeps hinting smith was actually pretty harsh on the colonial system and i cant figure out how that squares with the rest of wealth of nations.
