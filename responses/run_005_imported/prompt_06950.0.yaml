  Then there's the Diamond objection. The ex ante Pareto principle can force society to be indifferent to clearly unfair ex post distributions, like when a coin toss determines who gets a lifesaving treatment. Harsanyi's framework prioritizes expected utility before the lottery resolves, ignoring the actual inequality afterward. That clashes with fairness concerns many find compelling. 

  I should also consider the theorem's strengths. It does show that Pareto plus vNM rationality restricts social welfare to a linear form, which is significant. But calling it "purely rationality-based" utilitarianism is misleading—it smuggles in ethical assumptions through the axioms. 

