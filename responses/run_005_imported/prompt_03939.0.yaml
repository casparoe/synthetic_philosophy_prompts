  Okay, let me start by understanding the problem. Lena and Marco are debating whether a wine glass with a shear-thickening polymer coating is a mask or a fink. Lena says it's a mask because the glass's microstructure remains unchanged; the coating just blocks the shattering. Marco argues it's a fink because the coating activates exactly when impact happens, altering the glass's properties temporarily.

  First, I need to recall the definitions. A fink removes or alters the causal basis at the moment of stimulus. Lewis's sorcerer changes the glass's structure when struck. A mask leaves the basis intact but blocks the manifestation, like protective packing. The key difference is whether the disposition's basis is altered or just interfered with downstream.

  Lena's point (1) focuses on the causal basis remaining intact. The polymer doesn't change the glass's brittleness; it's inert until impact. So, it's a mask. Marco's response (2) is about timing: the coating activates at the stimulus moment, like a fink. But timing alone isn't the defining factor. Finks alter the basis, masks don't. So Lena has a stronger argument here.

  Move (3): Lena emphasizes that finks change the basis, masks don't. The glass's molecular structure stays the same. Marco's counter (4) is that during the impact, the coating stiffens the outer layers, altering the basis temporarily. But the question is whether the intrinsic brittleness basis is changed. The coating is an external addition, not part of the glass's microstructure. So the basis might remain the same, and the coating acts as an external interferer.

  Marco's point about temporary alteration could be tricky. If the coating changes the glass's properties during impact, does that count as altering the basis? But the causal basis for fragility is the molecular structure. The coating's effect is separate. Also, Martin's electro-fink example works by changing the disposition itself instantly, not just adding a barrier. 

  What's missing? Both are stuck on timing versus basis alteration. The key is whether the dispositional basis is intrinsic or if external factors count. Also, the coating is extrinsic to the glass's microstructure. Maybe the distinction needs clearer boundaries between intrinsic basis and extrinsic interveners. Also, in borderline cases, context might determine classification, but that's not ideal. They might need to consider if the disposition is lost (fink) or masked (basis intact). Here, the glass remains brittle; it's just protected externally. So mask seems more accurate.
answer: |-
  Your students have hit upon a genuinely tricky borderline case that exposes ambiguities in the fink/mask distinction. Let's break down each move, assess who has the better argument, identify where the stalemate lies, and clarify what's missing. The core issue revolves around **individuating the causal basis** and **defining "alteration"** in transient interventions.

  ### Analysis of the Moves:
  1. **Lena (1): Classifies it as a mask**  
     *Her argument*: The glass's brittle microstructure (the causal basis) is untouched; the polymer merely blocks the causal chain.  
     *Assessment*: **Strong, but incomplete**. She correctly identifies the *definitional criterion* (basis alteration vs. downstream interference). The Johnston/Bird mask analogy holds: like poison + antidote, the intrinsic basis remains intact, and an *external* mechanism disrupts the process.  

  2. **Marco (2): Objects based on timing**  
     *His argument*: The coating’s *simultaneous activation* with the stimulus mirrors finks (e.g., Martin’s electro-fink).  
     *Assessment*: **Misplaced emphasis**. Timing alone doesn’t define finks; it’s a *symptom* of basis alteration. Lewis’s sorcerer *removes fragility* when struck; the coating doesn’t remove brittleness—it *insulates* it. Marco conflates *temporal signature* with *causal role*.  

  3. **Lena (3): Rejects timing as decisive**  
     *Her argument*: Finks alter the basis; masks leave it untouched. The glass’s microstructure is unchanged.  
     *Assessment*: **Correct core principle**. She nails the distinction: finks modify the *dispositional ground* (e.g., sorcerer alters glass molecules); masks add *extrinsic blockers* (e.g., packing material). The polymer is extrinsic to the glass’s microstructure.  

  4. **Marco (4): Claims the coating *momentarily alters* the basis**  
     *His argument*: Stiffening the outer layers briefly changes the glass’s physical state, making it a "momentary fink."  
     *Assessment*: **Conceptual overreach**. The coating’s stiffening is an *extrinsic additive effect*, not an alteration of the intrinsic causal basis (the brittle atomic lattice). Martin’s electro-fink *directly manipulates the dispositional property* (e.g., wiring that removes conductivity when voltage is applied), not an external shield.  

  ### Who Has the Better of It?
  - **Lena wins moves (1) and (3)** by adhering to the core metaphysical distinction: masks preserve the basis; finks destroy or alter it.  
  - **Marco’s points (2) and (4) are weaker** but expose ambiguities in "basis alteration" during transient states.  

  **Overall**: Lena’s mask classification is more defensible, but Marco highlights genuine gray areas.  

  ### What Both Are Missing:
  1. **Individuation of the Causal Basis**:  
     - The dispute hinges on whether the "causal basis" includes *only* the glass’s microstructure or *also* its extrinsic, transient properties. Lewis/Bird treat the basis as **intrinsic and stable** (e.g., atomic bonding). The polymer is extrinsic—like bubble wrap, not sorcery.  
     - **Key test**: If the coating were removed *mid-impact*, would the glass shatter? Yes. If Lewis’s sorcerer stops his spell mid-impact, the glass shatters. If Martin’s fink stops finking, conductivity resumes. *This confirms the basis persists*—so it’s masked, not finked.  

  2. **The "Alteration" Ambiguity**:  
     - Marco mistakes *adding a property* (stiffness) for *altering the basis*. But:  
       - **Finks**: Swap one basis for another (fragile → robust microstructure).  
       - **Masks**: Superimpose an external barrier *without* changing the basis.  
     - The polymer adds a *new, temporary layer* of protection; it doesn’t rewrite the glass’s dispositional essence.  

  3. **The Role of "Trigger-Dependence"**:  
     - Marco fixates on trigger-dependence (coating activates *because* of impact) as fink-like. But masks can be trigger-dependent too! Bird’s poison antidote is ingested *because* poison is taken—yet it’s still a mask. Trigger-dependence is **orthogonal** to the fink/mask split.  

  4. **Borderline Cases Need a Disposition-Specific Test**:  
     To resolve such cases, ask:  
     - **Q1**: *Is the object still disposed to manifest M in response to S in the* exact same conditions *if the intervener is removed* **at the moment of stimulus**?  
       - *Yes* → Mask (basis unchanged).  
       - *No* → Fink (basis altered).  
       - **Here**: Remove the coating *during impact* → glass shatters. *Mask confirmed*.  

  ### How to Settle This (and Prevent Baroque Variants)
  - **Clarify the framework**: Emphasize that the fink/mask distinction rests on **causal basis persistence**, not timing or trigger-dependence. Finks are *disposition-killers*; masks are *process-blockers*.  
  - **Boundary rule**: If the intervener affects the object *without modifying its intrinsic dispositional ground*, it’s a mask—even if transient.  
  - **For this case**: The glass’s brittleness never ceases; the polymer is a *parasitic disposition* (trigger-dependent but extrinsic). It’s a **dynamic mask**, not a fink.  

  --- 
  **Recommendation for your seminar**: Have Lena and Marco apply the "mid-stimulus removal test" to Martin’s fink and Bird’s antidote. This should reveal why the coating behaves like the latter. If Marco insists the stiffened surface is "part of the glass," challenge him to define the causal basis’s boundaries—this often exposes where intuitions diverge. The distinction is metaphysical, not linguistic!
