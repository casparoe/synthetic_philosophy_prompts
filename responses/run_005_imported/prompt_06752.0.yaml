  Move (2): Marta points out key differences between the cases. Neptune's prediction was precise and immediately verifiable, while Vulcan relied on inconsistent observations. She emphasizes this asymmetry was knowable beforehand. Her historical accuracy strengthens this point - the empirical distinctions were indeed evident pre-discovery. I'll give this +2 as it corrects Owen's false equivalence.

  Move (3): Owen counters that predictive precision shifts the credit from IBE to hypothetico-deductive testing. He argues explanatory virtues like simplicity weren't decisive - testability was. While he identifies an important aspect of scientific practice, he creates a false dichotomy by separating prediction from explanation. This overlooks how predictive success contributes to explanatory strength. I'll score it -1 for that reductionism.

  Move (4): Marta rejects Owen's separation as artificial. She contends that successful prediction is integral to explanatory goodness, not an alternative to it. Her view aligns with how scientists actually evaluate explanations - predictive power is a core explanatory virtue. By refusing to isolate "pure" IBE from confirmation, she avoids arbitrary definitions. This deserves +2 as it reflects scientific reasoning more holistically.

  Both overlook that IBE functions within a broader epistemic system. Scientific confirmation isn't about choosing between explanatory virtues and predictive testing - it's their continuous integration through iterative model-building. The Neptune/Vulcan contrast actually shows how predictive success refines our understanding of what makes explanations "best," rather than invalidating IBE itself.
