  I need to analyze each of their arguments step by step. First, Helen's initial point: Anscombe argues that using innocent deaths as a means to an end is murder. This comes from the Doctrine of Double Effect, where intending harm versus foreseeing it makes a moral difference. Truman chose civilian targets to maximize shock and force surrender, which seems to fit Anscombe's definition. Helen has the stronger point here.

  Marcus objects by saying intentions aren't separate. He references Anscombe's philosophy where an action can have multiple descriptions. But Anscombe distinguishes between what you aim for directly versus what you merely foresee. Marcus might be conflating foresight with intention. However, he does raise a valid concern about how we isolate intentions. Helen's response about targeting decisions strengthens her case—choosing city centers shows civilians were the mechanism, not collateral damage. So Helen wins this round.

  Then Marcus argues that this logic should condemn conventional firebombings too, which weren't criticized as harshly. This is a strong point. If Anscombe applies her principle inconsistently, it weakens her argument. Helen might not have a good rebuttal here, making Marcus's objection significant. It shows that context or other factors might influence moral judgments beyond pure intention.

  Looking deeper, Anscombe's actual position involves absolute moral principles, but her focus on Truman might stem from the atomic bomb's uniqueness or symbolic weight. Also, the Doctrine of Double Effect has its own problems—intentions are hard to prove, and critics argue that foreseen harm can be just as bad as intended harm. Neither Helen nor Marcus discusses the broader just war principles or the role of proportionality. Anscombe might have opposed all area bombings, but Truman's case was a focal point for her campaign.

