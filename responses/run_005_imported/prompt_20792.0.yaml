prompt: |-
  Next week I'm interviewing a decision theorist on my little podcast -- she's built her career defending maxmin expected utility (the Gilboa-Schmeidler answer to Ellsberg's urn problem) as the rational response to ambiguity, not a bias. I'm a software engineer, not a philosopher, so I know the basic three-color urn setup and that it breaks Savage's sure-thing principle, and it caught my eye because it's basically the same shape as the distributionally-robust-optimization stuff we do at work, but I don't want her just restating that 101 version. Draft 8-10 questions that push past it: at least one on why the sure-thing principle, specifically, is the axiom worth sacrificing rather then something else, one on the "maxmin is just worst-case pessimism dialed to max" complaint and whether alpha-maxmin or the smooth ambiguity model actually dodge it or just relabel it, one on what happens once you chain several ellsberg-style choices together over time instead of judging them one at a time, and one on the finding that ambiguity aversion seems to track how expert people feel rather then the actual ambiguity -- which makes the whole thing look more psychological than rational. Give each question a short follow-up keyed to whatever answer she'll reach for first.
reasoning: |-
  Okay, the user is preparing to interview a decision theorist who defends maxmin expected utility (MEU) as rational for ambiguity. They're a software engineer familiar with the basics of Ellsberg's urn and its similarity to distributionally robust optimization. They want questions that go beyond the 101 level, with specific topics: sacrificing the sure-thing principle, addressing the pessimism complaint, chaining ambiguous choices over time, and ambiguity aversion as psychological vs. rational.

  First, I need to ensure each required topic is covered. The user mentioned four must-haves: why sacrifice sure-thing principle specifically, the "maxmin is pessimism" critique, chaining Ellsberg choices, and the expertise-feeling vs actual ambiguity finding. Each question should push past surface-level explanations.

  For the sure-thing principle, I should ask why it's the one to drop. The follow-up could challenge if other axioms like completeness or transitivity are more expendable. This forces the theorist to defend the choice structurally.

  Next, the pessimism critique. MEU is often called overly conservative. I'll ask how alpha-maxmin or smooth models differ. The follow-up should question if they're just disguised pessimism. This probes whether alternatives genuinely solve the issue or rebrand it.

  Chaining choices over time: This explores dynamic consistency. MEU might lead to time-inconsistency. The follow-up can ask if agents must pre-commit, highlighting practical tensions.

  The psychology angle: Studies show ambiguity aversion links to perceived expertise, not actual ambiguity. This questions MEU's rationality. The follow-up can ask if this undermines normative claims, pushing the theorist to reconcile descriptive findings with rational models.

  I also need to add depth. Maybe include applications in ML/AI since the user is in software. Question 5 could connect MEU to robust control in engineering, making it relevant. The follow-up might ask if MEU's conservatism is a feature or bug in real systems.

  Another angle: normative vs. descriptive. Question 6 on whether MEU describes behavior or prescribes it. The follow-up can challenge if learning should reduce ambiguity aversion, testing the theory's adaptability.

  Question 7 on intertemporal effects: If choices compound, does MEU still hold? Follow-up on whether this makes MEU a single-step tool, questioning its scope.

  Finally, ethics: Is avoiding ambiguity morally right? E.g., in hiring algorithms. This ties to real-world impact, relevant to the user's work.

  Each question needs a sharp follow-up. Anticipate common responses. For example, on pessimism, she might say alpha-maxmin adds optimism. Follow-up: Isn't optimism arbitrary? This forces her to defend weighting.

  For the expertise point, she might argue experts have better priors. Follow-up: But studies control for knowledge, so why does perceived skill matter? This targets the theory's foundations.

  I should ensure technical terms are used correctly: sure-thing principle, dynamic inconsistency, alpha-maxmin, smooth ambiguity model. Avoid jargon without explanation, but since it's an interview, the guest can clarify.

  Check that questions don't overlap. Each should tackle a unique angle. The chaining question is temporal, while the expert feeling is psychological. Applications in ML and ethics are separate expansions.

  The user’s deeper needs: They want to engage the theorist beyond textbook answers, showing sophistication. They might also seek connections to their work in distributionally robust optimization. Highlighting applications makes the interview relevant.

  Potential gaps: Maybe discuss computational aspects or scalability of MEU in complex systems. But the user specified 8-10 questions, so prioritize the must-haves and add complementary ones.

  Ensure follow-ups are probing. E.g., after asking about sacrificing sure-thing, follow-up with why not other axioms. This challenges the theorist to justify MEU's axiomatic choices deeply.

  Balance between theory and practice. Questions 1-4 are theoretical, 5-7 on applications and dynamics, 8 on psychology, 9 on ethics, 10 on normative scope. Covers all bases.

  Finally, end with a forward-looking question on the future of ambiguity models, leaving room for broader discussion. This wraps up thoughtfully.
answer: |-
  Here are 8 probing questions designed to push past the Ellsberg 101 explanation, incorporating your specific requests and anticipating common defenses, with sharp follow-ups. Each question targets a conceptual tension or implication of MEU:

  1.  **The Axiomatic Sacrifice:** "MEU explicitly violates Savage's Sure-Thing Principle (STP). Why is STP the *right* axiom to sacrifice for handling ambiguity, rather than, say, completeness or transitivity? What makes STP uniquely incompatible with rational choice under ambiguity, while those others remain sacrosanct?"
      *   *Follow-up (if she argues STP assumes probabilistic sophistication):* "But couldn't one argue that completeness is equally problematic under deep ambiguity? If I truly cannot compare some ambiguous prospects, isn't refusing to rank them (violating completeness) *more* rational than forcing a maxmin ranking?"

  2.  **Pessimism or Prudence?** "A core criticism of MEU is that it's simply pathological pessimism – maximizing the worst-case scenario ignores potentially valuable information or favorable odds. How do models like α-maxmin or the smooth ambiguity model *fundamentally* differ from MEU on this point? Do they genuinely escape the 'worst-case focus' critique, or just soften it parametrically?"
      *   *Follow-up (if she highlights α-maxmin's weighting):* "Doesn't α-maxmin essentially just average MEU with *maximax* optimism? If so, isn't the 'rational' choice then heavily dependent on an arbitrary α parameter, which itself seems like a psychological bias (optimism/pessimism level) rather than pure rationality?"

  3.  **Dynamics & Time Consistency:** "Ellsberg experiments are typically static, one-shot choices. What happens when we chain multiple ambiguous decisions together over time? Does applying MEU recursively at each stage lead to dynamically consistent plans? Or does it potentially lead an agent to pre-commit to a plan they'd later want to deviate from when faced with the next ambiguous node?"
      *   *Follow-up (if she mentions dynamic consistency under MEU):* "But doesn't achieving consistency often require pre-commitment to a specific set of priors *at the outset*? In a truly ambiguous world where the set of possible priors might shift unexpectedly, doesn't this pre-commitment itself become a brittle and potentially irrational constraint?"

  4.  **The Expertise Paradox:** "Empirical findings suggest ambiguity aversion correlates more strongly with an individual's *perceived lack of expertise* regarding the domain than with the *objective degree of ambiguity* present. If ambiguity aversion is a rational response to unknown probabilities, why would subjective feelings of incompetence drive it more than the actual structure of the uncertainty?"
      *   *Follow-up (if she links perceived expertise to prior formation):* "But studies often control for objective knowledge – people with equal *actual* knowledge show different aversion based on *confidence*. Doesn't this suggest the core mechanism is psychological (self-assessment, fear of blame) rather than epistemic (lack of information about the world)? Doesn't this undermine MEU's claim as a purely *rational*, non-psychological norm?"

  5.  **Robustness vs. Opportunity Cost:** "In engineering/ML, Distributionally Robust Optimization (DRO) using a maxmin approach is valued for safety and reliability. However, it often comes with a significant performance penalty (opportunity cost) in non-worst-case scenarios. As a normative theory for *rational choice*, how does MEU justify this systematic sacrifice of potential gains? Isn't true rationality about balancing risk and reward, even under ambiguity?"
      *   *Follow-up (if she emphasizes protection):* "Protection against what, exactly? If the 'worst-case' is extremely unlikely or even implausible (but can't be assigned *zero* probability within the set), isn't MEU mandating an irrational over-weighting of catastrophic tails compared to more probable favorable outcomes?"

  6.  **Normative vs. Descriptive Tension:** "MEU is often presented as a normative model – how agents *should* choose. Yet, the empirical findings on expertise dependence and other context effects make it look like a powerful *descriptive* model of a specific cognitive bias (pessimism under uncertainty). How do you reconcile this? Is MEU primarily a normative ideal, or is its power actually in describing a common psychological heuristic?"
      *   *Follow-up (if she insists on normative status):* "If it's normative, shouldn't learning *reduce* ambiguity aversion under MEU as priors sharpen? Yet, the 'expertise feeling' effect suggests aversion persists based on confidence, not just information. Doesn't this persistence contradict the normative learning story?"

  7.  **Composition & Iteration:** "Imagine a series of Ellsberg-style urns, where the composition of one urn depends ambiguously on the outcome drawn from a previous urn. Does applying MEU sequentially to each choice still yield the most rational overall strategy? Or does the compound ambiguity introduce complexities that a simple per-stage maxmin fails to capture, potentially overlooking valuable hedging opportunities across stages?"
      *   *Follow-up (if she suggests it handles it):* "Doesn't sequential MEU risk myopically focusing on the local worst-case at each step, potentially ignoring how a slightly sub-optimal local choice might create significantly better *global* robust outcomes or reduce future ambiguity?"

  8.  **Beyond Uncertainty: Moral Implications?** "If ambiguity aversion is rational under MEU, does this extend beyond purely financial gambles? For instance, in ethical dilemmas involving ambiguous outcomes or uncertain probabilities of harm (e.g., certain AI safety or medical triage scenarios), would MEU prescribe an *ethically* conservative choice (avoid the action with worst-case harm, even if unlikely)? Does rationality under ambiguity demand a kind of precautionary principle?"
      *   *Follow-up (if she agrees it extends):* "Doesn't this risk legitimizing excessive precaution or even paralysis? If avoiding the *possibility* of catastrophic blame is rational under ambiguity, how does society avoid stifling innovation or necessary risks?"

  **Key Interview Principles:**

  *   **Listen Actively:** Her answers might open doors you haven't anticipated. Be ready to pivot slightly if she gives an unexpectedly rich response to one question.
  *   **Clarify, Don't Confront:** Use follow-ups to probe deeper, not to trap her. Phrases like "Help me understand..." or "So, if I follow that logic..." are useful.
  *   **Anchor in Concepts:** Refer back to core ideas (STP, priors, dynamic consistency, normative/descriptive) to keep the discussion focused.
  *   **Bridge to Her Work:** When she answers, try to connect it back to her specific research or arguments if possible (e.g., "In your 20XX paper on [Topic], you argued [Point], how does that relate to what you just said about...").

  These questions force engagement with the philosophical justifications, empirical challenges, dynamic implications, and potential limitations of MEU as a rational norm, moving well beyond the basic Ellsberg demonstration. Good luck with the interview!
