  #### Criterion 1: Private individual killing a tyrant
  - Aquinas in *De Regimine Principum* (Book I, Chapter 6) does **not** endorse private individuals killing tyrants. Instead, he says that it is not advisable for a private person to kill a tyrant because of the danger of it being done from private presumption and because it might lead to worse disorders. He recommends that if the community has the right to depose the tyrant, they should do so. If not, they must endure and pray.
  - The student claims: "a private individual ... may licitly kill him". This is incorrect. Aquinas explicitly warns against private individuals taking action.

  #### Criterion 2: Remedies proposed as alternatives
  - Aquinas's preferred remedy is for the community (if it had the right to set up the ruler) to depose the tyrant. If the ruler was set up by a higher authority (like the Pope or Emperor), then the community must wait for that authority to act, and in the meantime, endure and pray.
  - The student correctly identifies: (a) community deposition where the community has the right, and (b) patient endurance and prayer when there is no recourse.

