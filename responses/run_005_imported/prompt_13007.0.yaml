  First, I need to assess why the brother made such a public move. It might be a power play, but it could also stem from insecurity or fear of losing the house. The user’s concern about mutual destruction is valid—both sides digging in could lead to lose-lose outcomes. 

  The friend’s advice comes from a commercial context where hardball tactics might work, but family dynamics are different. Emotions and relationships add layers that don't exist in business deals. The user’s deeper need is likely preserving family ties while securing a fair share, not just winning the house. 

  Mediation is next week, so the user needs a strategy that avoids escalation. Instead of mirroring the brother’s ultimatum, positioning as the reasonable party could gain mediator support. Documenting willingness to negotiate and focusing on overall estate value might shift the dynamic. Also, the brother’s rigid stance might backfire in mediation, making the user look cooperative. 

