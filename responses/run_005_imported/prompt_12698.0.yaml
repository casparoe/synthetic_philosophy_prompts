answer: |-
  The scent of lilies hung thick in the over-warm faculty club lounge. Arthur Finch, a genial historian of logic who’d somehow befriended them both, was being remembered. Eleanor Vance stood near the window, a half-finished sherry warming in her hand, watching rain streak the glass. The low murmur of colleagues felt like wool pressed against her ears. She craved air, silence, anything but this suffocating politeness masking shared grief.

  “He’d have hated this, you know.”

  The voice, dry as old paper, came from behind her. Robert Thorne. He leaned heavily on his cane, his once-vibrant eyes now chips of flint beneath unruly brows. Time had etched deeper lines, but the sharpness, the contained energy vibrating just beneath the surface, was unmistakable. And unwelcome.

  “The sentimentality, Robert? Or the sherry?” Eleanor kept her gaze on the rain. “Arthur enjoyed both, in moderation.”

  “The pretense.” Robert shifted, the cane tapping softly. “The insistence on pretending death is anything other than a full stop. Arthur understood finality.” He paused. “Unlike some.”

  Eleanor turned slowly. The old wound, the intellectual schism that had widened into personal estrangement, pulsed between them. “Meaning isn’t death, Robert. It’s life. Messy, communal life.”

  “Ah.” A humorless smile touched his lips. “The party line. Still peddling the communal embrace as a solution? Still insisting there’s nothing *in* the sign, only the corrective shoves of the tribe?”

  The gauntlet was down, disguised as academic banter. The memorial faded; the old battlefield, dusty but familiar, opened before them. Eleanor felt the familiar mix: the thrill of the argument, the deep ache of betrayal.

  “It’s not *peddling*,” she said, her voice low but clear. “It’s observing reality. Take ‘plus’. Take… *quus*.” The absurd, Kripkean alternative hung in the air, their shared shorthand for the abyss. “Was there ever a *fact* in my mind, some ghostly intention, that *meant* plus and *excluded* quus? Or did my training, my place in the practice – the *corrections* I received and give – constitute what ‘plus’ *is* for me?” She gestured subtly at the room. “Just as Arthur’s kindness wasn’t some metaphysical essence, but the sum of his actions within *this* community.”

  Robert snorted, a sharp, dismissive sound. “Reductionism dressed as pragmatism. You mistake the scaffolding for the building, Eleanor. The corrections – the ‘shoves’ as you so charmingly put it – only make sense *because* there’s a norm *to* uphold. Why correct ‘68+57=5’? Because it’s *wrong*! Not because the tribe feels itchy, but because ‘plus’ carries an *ought* within it. The normativity is *internal* to the meaning itself. The practice presupposes it; it doesn’t create it.”

  He leaned forward, his eyes intense. “Your ‘community’ is just a bigger, noisier skeptic. It can only ever *imitate* normativity. It points fingers and says ‘Not like that!’ But *why*? What gives *their* pointing any more authority than the solitary individual’s feeling? Without the irreducible norm – the fact that meaning *requires* certain applications – your communal practice is just a complex pattern of behaviors, devoid of genuine right or wrong. It’s… descriptive sociology masquerading as philosophy.”

  Eleanor felt her knuckles whiten on the sherry glass. He made it sound so sterile, so cowardly. “And your ‘irreducible norm’? Where does it reside, Robert? In some Platonic cloud? Etched on a neuron? It’s a ghost you chase! At least the practice is *real*. We *see* the corrections. We *feel* the expectation. The normativity *is* the pattern of endorsements and sanctions within a form of life. It’s not ‘imitation’ – it’s the *substance*. Your ghost is just the shadow the practice casts.” She took a small step closer, her voice dropping. “You surrendered to mysticism the moment you declared the skeptic owed nothing.”

  Robert flinched almost imperceptibly. *Surrendered*. The word hung there, charged with their history. He remembered the brilliant, fierce doctoral student who’d challenged him relentlessly, forcing him to sharpen his own views. Now she called his deepest conviction a mystical surrender. The cane tapped again, harder.

  “Mysticism? No. It’s realism. Meaning *is* normative. ‘Jones means addition by plus’ *entails* that Jones *ought* to answer ‘125’. That ‘ought’ isn’t derived from the community’s habits; it’s constitutive of the meaning claim itself. To deny it *is* the surrender, Eleanor. It’s giving up on the very idea that meaning *guides* us, that it provides a standard against which our actions are judged. You’ve replaced guidance with… conformity.”

  “Conformity *is* the guidance!” Eleanor countered, frustration edging her voice. “In the only way that matters! Your ‘internal ought’ is inert without the practice that instantiates it. How does your ghostly norm *cause* Jones to say ‘125’? It doesn’t! He says it because he’s embedded in the practice, shaped by it. The normativity *is* the gravitational pull of the practice itself. You want a magical connection between meaning and action that transcends human life. I see life *as* the connection.”

  Robert’s face tightened. “And when the practice shifts? When the community decides ‘plus’ *now* means quus? Does meaning evaporate? Or did it just change? According to you, there was never a fact about the *old* meaning anyway, just an old practice. So no loss, no betrayal of the sign itself? Just… different shoves?” His voice dripped with contempt. “That’s not normativity. That’s fashion. Arthur deserved better than that. *Meaning* deserves better.”

  The mention of Arthur, weaponized, struck deep. Eleanor saw the young Robert, passionate, brilliant, convinced ideas *mattered* in a way that transcended human frailty. Now he seemed brittle, clinging to a purity that felt increasingly like a defense against the messy world he despised. She saw her younger self reflected in his disappointment – the student he felt had abandoned the quest for truth.

  “And you,” she said, her voice suddenly weary, drained of combativeness, “cling to a ghost because you can’t bear the thought that the scaffolding – the practice, the community, the frail, correcting humans – *is* the building. You call it fashion, Robert, because acknowledging its reality feels like a diminishment. But it’s not. It’s just… life. Messy, contingent, *ours*. Your ghost comforts you, but it doesn’t *do* anything.” She took a deliberate sip of her sherry, the gesture final. “Arthur understood that. He lived in the practice. He *was* kindness, not an idea of it.”

  Robert stared at her. The intellectual fury was still there, but beneath it, something older and sadder flickered – the ghost of admiration for a mind that could cut so precisely, now turned against him. He saw the lines around her eyes, the steel in her gaze that hadn't softened, only hardened into a different shape. She wasn't wrong about Arthur. The silence stretched, filled only by the rain and the muffled condolences across the room.

  “Life,” he repeated, the word tasting flat. “A thin substitute for truth, Eleanor. A very thin substitute indeed.” He straightened, adjusting his grip on the cane. The dismissal was clear, but it lacked its usual force. It sounded like an epitaph – for Arthur, for their collaboration, for the possibility of bridging the chasm between them.

  Eleanor watched him turn and navigate slowly towards the exit, a figure of stubborn isolation amidst the communal grief. She turned back to the rain-streaked window. The argument was unresolved, as it always would be. The quus still lurked. The normativity of meaning remained either an irreducible fact or an emergent property of the tribe. But the sharper pain, the one that cut deeper than any paradox, was the irreparable loss of the shared language they once had, the mutual respect that had turned to mutual incomprehension tinged with unforgiving disappointment. The practice of their friendship had ceased, and no ghost of past admiration could correct it. She lifted her glass slightly, not towards Robert’s retreating back, nor towards Arthur’s memory, but towards the cold glass. To what they lost. To the quus between them.
