answer: |-
  The problem of profligate omissions highlights a fundamental asymmetry between causation by *production* (e.g., a rock breaking a window) and causation by *omission* (e.g., the gardener not watering the plant). Let's break this down step by step.

  ### 1. **Why the Problem is Worse for Omissions**
  In "ordinary" causation (production), process/transference theories (e.g., Salmon-Dowe) provide a *physical filter* that counterfactual theories lack. This filter relies on **spatiotemporally continuous processes** and the **transfer of conserved quantities** (e.g., momentum, energy). 

  - **Example**: A rock hits a window, shattering it.  
    - **Counterfactual dependence**: The window wouldn't have broken if the rock hadn't hit it.  
    - **Physical process**: There's an actual trajectory of kinetic energy transfer from the rock to the window.  
    - **Filtering effect**: Even if a bird's flight *counterfactually* depends on the window breaking (e.g., "Had the window not broken, the bird wouldn't have flown by"), it's excluded as a *cause* because no conserved quantity was transferred *from the bird to the window*. The physical process requirement screens off irrelevant counterfactual dependencies.

  **For omissions, this physical filter vanishes**:  
  - Omissions involve *nothing happening*—no energy transfer, no spatiotemporal process.  
  - **Result**: Counterfactual dependence becomes the *only* criterion. The plant dies if the gardener doesn’t water it, but *also* if the Queen, a stranger, or anyone else fails to water it. Without a physical process to restrict causes, *all* these omissions satisfy the counterfactual test. The theory floods us with countless "causes," most of which are intuitively irrelevant.  

  **Key Insight**: Process theories ground causation in *actualist* (non-counterfactual) physical relations. Omissions lack these relations, forcing counterfactual theories to bear the full burden of causal selection—a burden they struggle with.

  ---

  ### 2. **Strategies to Restrict Omissions & Their Defensibility**
  We must choose between:  
  **(a) Building normality into causation** (only "deviant" omissions count as causes).  
  **(b) Egalitarianism + pragmatics** (all omissions are causes, but we only *mention* salient ones).  

  I find **(a) more defensible**, though it faces serious objections. Let's compare:

  #### **Strategy (a): Normality-Based Restrictions**  
  - **Core Idea**: Only omissions that violate statistical or normative expectations are causes. The gardener’s failure is a cause because watering was *expected* (by duty, probability, or norm). The Queen’s omission isn’t, as she had no obligation, and strangers watering plants is statistically rare.  
  - **Defense**:  
    - **Matches intuition**: We *do* blame the gardener, not the Queen. This reflects how humans attribute causality (e.g., in law: *duty of care* determines liability for omissions).  
    - **Solves profligacy**: It restricts causes to "relevant" omissions—e.g., failures by agents with responsibility, or in contexts where action was probable.  
    - **Empirical support**: Psychological studies (e.g., Knobe, Hitchcock) show causal judgments track norm violations.  

  - **Strongest Objection**: **Subjectivity and Relativity**  
    - Normality is context-dependent: Is a 10% chance of rain "normal"? Is a neighbor’s duty to water plants stronger than a stranger’s?  
    - **Circularity risk**: If norms define causation, but norms themselves rely on causal knowledge (e.g., "You *should* water plants *because* it causes survival"), the analysis becomes circular.  
    - **Metaphysical cost**: Causation risks becoming non-objective—varying by culture, perspective, or context—undermining its role in science/law.  

  #### **Strategy (b): Egalitarianism + Pragmatics**  
  - **Core Idea**: *All* omissions that satisfy counterfactual dependence are causes. The gardener’s *and* Queen’s failures caused the plant’s death. We just *pragmatically* focus on the gardener (e.g., he was responsible, his action was cost-effective).  
  - **Defense**:  
    - **Simplicity**: No need for murky "normality" criteria; causation remains objective and counterfactual.  
    - **Unifies causation**: Treats omissions and actions symmetrically.  

  - **Strongest Objection**: **Trivialization and Explanatory Bankruptcy**  
    - **Ontological explosion**: The plant’s death has *millions* of causes (every person who didn’t water it). This drains "cause" of meaning—if everything is a cause, nothing is.  
    - **Moral/legal irrelevance**: If the Queen’s omission *caused* the death just as much as the gardener’s, why is only the gardener blameworthy? Pragmatics can’t resolve this—blame presupposes *causal responsibility*, which strategy (b) dilutes.  
    - **No grounding for pragmatics**: *Why* do we focus on the gardener? Because his omission was *abnormal* or *salient*—but this smuggles normativity back in, defeating the purpose of egalitarianism.  

  ---

  ### **Conclusion**  
  **Why (a) is more defensible**: It better captures the *discriminatory* nature of causal reasoning—we intuitively isolate "the" cause (e.g., the gardener) from a sea of counterfactual dependencies. While normality-based approaches face challenges with subjectivity, these can be mitigated (e.g., by anchoring norms in objective probabilities or institutional roles). Strategy (b), by contrast, collapses under the weight of its own profligacy, failing to explain why we care about causation in the first place—to identify responsibility, intervene, or explain *salient* patterns.  

  **Final note**: Hybrid approaches exist (e.g., Halpern-Pearl’s "normality-weighted" structural models), but they still lean toward (a). The deepest issue is whether causation is purely *descriptive* (favoring b) or inherently *selective* (favoring a). Given human practice, selectivity seems indispensable—and normality, despite its flaws, offers the best path.
