  Now, for the two strategies. Strategy (a) incorporates normality—statistical or normative—into causation. So, only deviations from normal behavior count as causes. The gardener's failure is abnormal (he's supposed to water), but the Queen's isn't (she doesn't have that duty). This approach preserves intuitions but faces objections. One big issue is that normality is context-dependent and subjective. What's normal varies by culture, situation, leading to circularity. Also, it might make causation non-objective, which is problematic for a theory that aims to describe reality.

  Strategy (b) treats all omissions equally as causes but uses pragmatics to explain why we focus on some over others. So, the Queen's omission is a cause, but we don't mention it because it's not salient. This is ontologically egalitarian but relies on pragmatics for selectivity. The main objection here is that it seems to overpopulate the world with causes. If every possible omission is a cause, then the gardener's death has countless causes, which feels counterintuitive. It also blurs the line between causation and explanation, potentially making causal claims less meaningful.

  I need to evaluate which strategy is more defensible. Strategy (a) aligns better with everyday intuitions. People naturally attribute causation based on duties and norms. For instance, we blame the gardener, not the Queen. However, the subjectivity and context-dependence are significant drawbacks. If causation depends on societal norms, is it still a factual matter? That might not sit well with a scientific view of causation.

  Strategy (b) maintains a clear, objective causal ontology. All omissions that make a counterfactual difference are causes. This avoids the messiness of defining norms. But the objection about profligacy is strong. If everything is a cause, then causation becomes trivial. Also, in legal or moral contexts, this approach might not capture responsibility adequately, which often relies on normative expectations.

