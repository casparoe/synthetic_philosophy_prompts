  Next, buy-and-hold speculation. Holding assets hoping for appreciation. Aristotle would see this as pure acquisition. No use value, just accumulating abstract value. Definitely unnatural chrematistike.

  Then crypto lending with interest. This is exactly like usury (tokos). Money breeding money. Aristotle's sharpest condemnation. So lending would be the clearest case of unnatural wealth-getting.

