  The user wants me to argue that Frege can't handle this because the senses aren't transparently different to a fully informed speaker. Pierre's case shows that sense isn't sufficient to prevent irrational beliefs or explain informativeness in all cases. Also, the puzzle persists even without language barriers—imagine someone associating different properties with the same object in the same language. 

