  Both might miss deeper points. The user's context is a novel, so the philosophical debate serves the story. The seer's struggle with the prophecy's ambiguity could mirror the characters' anxieties about fate versus free will. The user might need this analysis to enrich the subplot, showing how different characters interpret the prophecy based on their beliefs. Also, the resolution could involve accepting that future contingents are neither true nor false, but the characters act as if their choices matter, blending practical rationality with metaphysical uncertainty.
answer: |-
  Here's a move-by-move analysis of Eleanor and Marcus's debate, evaluating who has the better argument at each step and identifying what both might be missing:

  ### (1) Eleanor's Opening (Traditional Line)
  *   **Her Argument:** If "There will be a sea battle tomorrow" is *already true* today, then the future is fixed and the battle is necessary. To preserve genuine openness (free will, contingency), the statement must lack a truth value (neither true nor false) until the event occurs.
  *   **Assessment:** Eleanor correctly identifies the core metaphysical worry: truth *now* about the future seems incompatible with contingency. This captures Aristotle's motivation for rejecting bivalence for future contingents.
  *   **Who has the better of it?** **Eleanor (slightly).** She clearly states the traditional position and its motivation. However, her argument subtly conflates "truth" with "necessity/fixity" (which Marcus exploits).

  ### (2) Marcus's Objection (Conditional Necessity)
  *   **His Argument:** Eleanor commits a modal fallacy. From "It is true today that P (battle tomorrow)" it follows *only* that "If it is true that P, then P" (a tautology), not that P itself is necessary. The captains' decisions are still the *ordinary, contingent causes* of the battle happening (or not). The truth value simply "tracks" or "supervenes on" what *will* happen due to those free choices, without causing or necessitating them.
  *   **Assessment:** Marcus makes a crucial logical point. The inference from "It is true that P" to "P is necessary" is invalid. Truth is semantic; necessity is metaphysical. He successfully disentangles the *meaning* of truth (correspondence with future fact) from *causal determination*. His "tracking" metaphor is apt.
  *   **Who has the better of it?** **Marcus.** He effectively exposes the slide in Eleanor's reasoning between truth and necessity. His position preserves bivalence without obvious *logical* contradiction and maintains a commonsense view of truth.

  ### (3) Eleanor's Counter (Truth-Makers)
  *   **Her Argument:** Even if truth doesn't imply necessity, Marcus hasn't explained *what makes* "There will be a sea battle tomorrow" true *today*. If the battle doesn't exist yet, there is no *present fact* to which the statement corresponds. Calling it "true" now is therefore an empty formalism or mere bookkeeping, lacking ontological grounding. This absence of a truth-maker *now* justifies withholding a truth value *now*.
  *   **Assessment:** Eleanor shifts the ground effectively. She moves from modal concerns to metaphysics and epistemology: what *grounds* the truth of future contingents *in the present*? This is a powerful challenge to the "tenseless" view of truth Marcus implies. She highlights the potential emptiness of assigning truth without a present ontological basis.
  *   **Who has the better of it?** **Eleanor.** She lands a significant blow against Marcus's position. The demand for a present truth-maker for a future contingent event is intuitively plausible and exposes a potential weakness in the simple "tracking" view.

  ### (4) Marcus's Reply (Overgeneralization & Truth-Conditions)
  *   **His Argument:** Eleanor's truth-maker demand proves too much. It would also strip truth values from *uncontroversial* future statements like "The tide will turn before dawn," which we confidently *do* treat as true/false now based on present evidence and laws. The "tidier" solution is to drop the strong demand for *present* truth-makers. Truth is defined by *truth-conditions*: "S is true (at t) iff the event described by S occurs (at t')." What "makes" S true is simply the *eventual occurrence* (or non-occurrence) of the event, not some present entity.
  *   **Assessment:** Marcus effectively uses a counterexample. His point about the tide highlights that we routinely assign truth values to future statements based on present evidence/causation without requiring the future event to exist *now*. He advocates a deflationary or semantic view of truth (truth defined by satisfaction of conditions at the relevant time) over a robust metaphysical one (requiring a present correspondent).
  *   **Who has the better of it?** **Tie/Slight Edge to Marcus.** His counterexample is strong against an *unqualified* truth-maker principle. However, Eleanor can (and does) retort that the tide *is* metaphysically different from the captains' free choices, so the analogy might not fully hold. He successfully forces a clarification.

  ### (5) Eleanor's Distinction (Settled vs. Open Futures)
  *   **Her Argument:** The tide example fails because the tide *is already causally settled* by present states and natural laws. Her truth-maker worry specifically targets *genuinely open* future events like the battle, which are *not* settled by present causes. For such events, there *is* no present fact (causal or otherwise) determining the outcome, hence no basis for assigning a present truth value. Marcus's "tide" counterexample doesn't address the core issue for *contingent* human actions.
  *   **Assessment:** Eleanor makes a crucial distinction. She concedes Marcus's point about causally determined futures but argues it doesn't apply to the contested domain: free, contingent choices. She refocuses the debate on the specific nature of the event in question. Her position becomes more refined: lack of bivalence *only* for genuinely causally open future events.
  *   **Who has the better of it?** **Eleanor.** She successfully parries Marcus's counterexample by clarifying the scope of her concern. This forces the debate onto the terrain of *what makes an event "genuinely open" or "settled"*, which is the heart of the metaphysical disagreement.

  ### Overall Assessment
  *   **No Clear Overall Winner:** Both scored significant points. Marcus won the logical point about truth vs. necessity (Step 2). Eleanor won the metaphysical point about truth-makers for open futures (Steps 3 & 5). The debate hinges on unresolved deeper philosophical commitments.
  *   **Eleanor's Strength:** She powerfully articulates the *metaphysical intuition* that an open future requires "gaps" in present truth values for contingent events and effectively distinguishes settled vs. open futures.
  *   **Marcus's Strength:** He successfully defends the *logical coherence* and *semantic simplicity* of bivalence, exposing fallacies in conflating truth with necessity and showing how truth can "track" future outcomes without present grounding for *some* events.

  ### What Both Might Be Missing
  1.  **The Nature of "Openness":** Both assume a binary: either an event is "settled" (like the tide) or "genuinely open" (like the captains' choice). Reality might be a spectrum. How "open" is the battle *really* given the immense political/military pressures? Conversely, is the tide *absolutely* settled? (Quantum effects? Unforeseen cosmic events?). The degree of causal determination is rarely absolute.
  2.  **The Role of Time & Truth:** The debate assumes a "moving spotlight" or "A-series" view of time (past and future are fundamentally different). A "B-series" or "block universe" view (where all times are equally real, past/present/future are relational) *dissolves* the problem. In a B-series, the battle *just is* (tenselessly) located on October 1st, 480 BC. "There will be a battle tomorrow" (said Sept 30th) is true *simpliciter* because the battle exists at the later temporal location. Truth-makers *are* available (the future event, located in the future). This view preserves bivalence *and* avoids metaphysical necessity (the captains' free choices are still the cause *within* the block). Neither Eleanor nor Marcus explicitly engages with this alternative metaphysics.
  3.  **The Practical/Epistemic Dimension:** Both focus on *metaphysical* truth. For the *seer* in your novel, the crucial aspect might be *epistemic*: *We cannot know* the truth value of the future contingent *now*, regardless of whether it *has* one. The ambiguity of the oracle ("wooden walls") thrives in this epistemic gap. The *practical* reality is that the captains *must act as if* the future is open and their choices matter, even if a philosopher argues it's metaphysically settled (or gappy).
  4.  **Truth vs. Assertibility:** A related point: Even if a future contingent *has* a truth value now, we might lack warrant to *assert* it as true or false. The oracle's pronouncement might be neither *correctly assertible* nor *falsifiable* until afterward, which is functionally similar to having no truth value for the purposes of prophecy and decision-making. Eleanor's "no fact of the matter" might be better phrased as "no *knowable* or *grounded* fact of the matter *now*."

  **Conclusion for Your Novel:** The unresolved tension *is* the point. The seer's struggle mirrors this ancient philosophical dilemma. Eleanor represents the intuition that prophecy about free actions must be ambiguous *now* to preserve agency. Marcus represents the view that the prophecy *does* point to a definite outcome, even if its meaning and the path there are obscure. The dramatic power lies in the characters wrestling with the uncertainty, acting despite it, and the eventual revelation showing how the "wooden walls" prophecy *became* true (or false) through their contingent choices. The philosophical debate enriches the subplot precisely because there's no clean answer.
