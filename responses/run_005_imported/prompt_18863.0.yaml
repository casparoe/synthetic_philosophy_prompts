  Looking at step (1), Eleanor's position is that if the statement is already true, the future is fixed, so to keep it open, we must deny it has a truth value. Marcus in (2) counters that truth doesn't imply necessity—there's a difference between the conditional necessity (if true, then it happens) and the event being necessary. He thinks the captains still have free will; the truth value just aligns with their actions.

  In step (3), Eleanor shifts to truth-makers: what makes the statement true now if the event hasn't happened? Without a present fact, calling it true is empty. Marcus in (4) responds that this would also affect mundane future statements like tides, which we consider true now. He suggests dropping the need for truth-makers, defining truth by eventual outcomes.

  Step (5) has Eleanor distinguishing between settled events (tides) and open ones (battle). She argues her truth-maker concern only applies to the latter, so Marcus's counterexample doesn't fully address her point.

