  We are ranking four scoring rules for their suitability in measuring inaccuracy in epistemic utility theory, with reference to Pettigrew's work. The criteria include strict propriety, symmetry, continuity, and boundedness.

   The four scoring rules:
   1. Brier (quadratic) score
   2. Logarithmic score
   3. Spherical score
   4. Absolute-value (linear) score

   Key properties:
   - **Strict Propriety**: A scoring rule is strictly proper if every probability function expects itself to yield a better (lower) score than any other function. This is crucial for epistemic utility because it ensures that probabilistically coherent agents are not accuracy-dominated and that they have an incentive to report their true credences.
   - **Symmetry**: The inaccuracy score should treat all propositions symmetrically (i.e., the score depends only on the credence and the truth value, and is invariant under permutation of the propositions). This is often considered a requirement for a measure of pure accuracy.
   - **Continuity**: The scoring rule should be continuous in the credence assignment. This avoids abrupt changes in inaccuracy with small changes in credence.
   - **Boundedness**: The scoring rule should be bounded (i.e., the inaccuracy scores do not go to infinity). This is desirable because otherwise a single falsehood with credence 0 could lead to infinite inaccuracy, which might be too harsh.

   Let's evaluate each rule:

   1. **Brier (quadratic) score**:
      - For a credence `c` in a proposition and truth value `v` (1 for true, 0 for false), the Brier score is: `(v - c)^2` for a single proposition. For a full credence function over a partition, it is the sum of the squared differences.
      - It is strictly proper, symmetric, continuous, and bounded (if the set of propositions is finite, then the score is bounded between 0 and the number of propositions). However, note that in the case of an infinite partition, the Brier score can be unbounded, but in typical epistemic utility theory discussions, we consider finite partitions. So boundedness holds for finite cases.

   2. **Logarithmic score**:
      - For a credence `c` in a true proposition, the score is `-log(c)`. For a false proposition, it is `-log(1-c)`. But note: for a true proposition, the inaccuracy is often taken as `log(1/c)` (which is the same as `-log(c)`) and for false `log(1/(1-c))`? Actually, the standard logarithmic scoring rule for a probability distribution is defined as the negative log of the probability assigned to the true state. So for a single proposition, if it is true, the inaccuracy is `-log(c)`, and if false, `-log(1-c)`. However, note that this rule is unbounded: as `c` approaches 0 for a true proposition, the score goes to infinity. It is strictly proper and continuous (except at the boundaries where it goes to infinity) and symmetric? Actually, the logarithmic score is defined per state and is symmetric in the sense that it doesn't depend on the labeling of the propositions? But note: the logarithmic score is typically applied to a partition of states, and it is symmetric under permutation of the states. However, the unboundedness is a major issue because it leads to infinite penalties for being certain (credence 0) of a truth.

   3. **Spherical score**:
      - The spherical score for a credence `c` in a true proposition is `1 - c / sqrt(c^2 + (1-c)^2)`. For a false proposition, it would be `1 - (1-c) / sqrt(c^2 + (1-c)^2)`. Alternatively, it is sometimes defined as the Euclidean norm. The spherical score is strictly proper and continuous. It is also bounded (between 0 and 1). It is symmetric? The spherical score for a set of propositions is defined by normalizing the vector of credences. It is symmetric in the same way as the Brier score? Yes, it is symmetric under permutation of the propositions.

   4. **Absolute-value (linear) score**:
      - For a credence `c` in a proposition, the absolute-value score is `|v - c|` (so for true: `|1-c|`, for false: `|0-c| = |c|`). This score is proper but not strictly proper. For example, if an agent has a credence of 0.5 in a proposition, then any credence between 0 and 1 for that proposition will yield the same expected score. Therefore, it is not strictly proper. It is symmetric, continuous, and bounded (between 0 and 1 for each proposition). However, the lack of strict propriety is a major drawback because it does not uniquely vindicate probabilism: there can be non-probabilistic credence functions that are not accuracy-dominated.

   Ranking:

   Most suitable: **Brier score**. It is strictly proper, symmetric, continuous, and bounded (for finite partitions). It is the most commonly used in accuracy arguments and has many desirable properties.

   Second: **Spherical score**. It is also strictly proper, symmetric, continuous, and bounded. However, it is less commonly used and sometimes considered less intuitive. But it is a legitimate alternative.

   Third: **Logarithmic score**. It is strictly proper, continuous (except at boundaries), and symmetric, but it is unbounded. The unboundedness is a significant problem because it leads to infinite inaccuracy for having a credence of 0 in a true proposition, which is considered too extreme by many (e.g., it violates the principle of "finite penalty" for any mistake).

   Least suitable: **Absolute-value score**. It is not strictly proper, which is a critical flaw for the accuracy-dominance argument for probabilism. Without strict propriety, the argument that every non-probabilistic credence function is accuracy-dominated fails (because non-probabilistic functions might not be dominated).

   Therefore, the ranking is:
    1. Brier
    2. Spherical
    3. Logarithmic
    4. Absolute-value

