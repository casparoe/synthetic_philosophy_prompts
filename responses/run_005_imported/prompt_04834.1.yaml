prompt: |-
  In my metaethics seminar we've been working through the wrong kind of reasons (WKR) problem for fitting-attitude analyses of value. The stock illustration is the demon who will torture you unless you admire him: you clearly have a reason to admire him, but it is the wrong kind of reason, since it says nothing about whether he is admirable. The usual diagnosis, following Parfit, is that such a reason is state-given (grounded in facts about the state of admiring) rather than object-given (grounded in facts about the object itself), and that only object-given reasons are of the right kind. I'd like you to put pressure on that diagnosis by constructing an example — not a variant of the demon case, and not a Pascal's-Wager-style case about belief — in which an agent has a reason to adopt some other fitting attitude (fear, contempt, gratitude, remorse, or the like) that is naturally object-given in Parfit's sense, yet still strikes us, on reflection, as the wrong kind of reason for that attitude. Then explain what your example shows about whether the object-given/state-given distinction can really do the work it is supposed to do in solving the WKR problem.
reasoning: |-
  Okay, the user is in a metaethics seminar dealing with the Wrong Kind of Reasons (WKR) problem for fitting-attitude analyses of value. They're familiar with the standard demon example and Parfit's state-given vs. object-given reasons distinction. They want me to challenge that distinction by creating a new example that isn't like the demon case or Pascal's Wager. The attitude should be something like fear, contempt, gratitude, or remorse, and the reason should be object-given but still feel like the wrong kind of reason.

  First, I need to recall what object-given reasons are. According to Parfit, object-given reasons are grounded in the properties of the object itself. For example, a reason to fear something should be based on the dangerous properties of that thing. The WKR problem arises when there are reasons to have an attitude that don't relate to the object's features, like the demon threatening punishment for not admiring him. That's a state-given reason because it's about the consequences of having the attitude, not the object itself.

  The user wants an example where the reason is object-given but still wrong. That means the reason should directly reference properties of the object that are relevant to the attitude, yet intuitively not the right kind of reason for having that attitude. I need to think of an attitude and a scenario where this happens.

  Let me consider different attitudes. Fear is a good candidate because its object-given reasons are usually about danger. Contempt might work if based on someone's traits. Gratitude could be interesting because it typically requires a benefit intentionally conferred. Remorse involves feeling bad for one's own wrongdoing.

  I'm thinking about gratitude. Suppose someone does you a huge favor, but their reason for doing it is manipulative. For instance, a colleague helps you immensely at work, but only to put you in their debt so you'll support their unethical project later. The benefit is real and intentionally given, so object-given reasons for gratitude seem present. But should you feel grateful? Intuitively, maybe not, because the motive taints it. But does this make the reasons the wrong kind? Not sure; it might still be about the object (the act), just with bad motives.

  Another idea: contempt. Imagine someone with genuinely contemptible traits—say, a person who brags about exploiting others. Object-given reasons for contempt exist. But suppose you're in a position where showing contempt would be disastrous, like if this person is your boss's favorite. You have a strong pragmatic reason to suppress contempt. But that's state-given, not object-given. The user wants an object-given reason that feels wrong.

  Let's try remorse. Suppose you commit a minor offense, like lying to avoid a social event. The offense is real, so object-given reasons for remorse exist. But if someone tells you that feeling remorse will lead to personal growth or impress someone, that's state-given. Still not what the user needs.

  What about fear? Here's an idea: a harmless but intimidating object. Like a perfectly safe roller coaster designed to look scary. The fear is object-given because the object appears dangerous, but it's not actually dangerous. However, that might not be the wrong kind of reason; if it appears dangerous, fear could still be fitting.

  I need a case where the object has properties that justify the attitude but external factors make it inappropriate. Maybe a social context. Let's consider admiration. Not the demon case. Suppose a tyrant who has admirable traits like intelligence and charisma, but using them for evil. You might admire the skills but not the person. The reason to admire is object-given (skills), but should you? That might be more about conflicting attitudes.

  The user mentioned other attitudes. How about envy? Suppose someone has something good, so object-given reasons for envy exist. But if envying them leads to self-improvement, that's state-given. Not helpful.

  Let me think of a case where the reason is tied to the object but perverse. Another attempt: gratitude again. Imagine receiving a gift from someone who clearly wants to make you feel indebted in a way that's exploitative. The object-given reason is the benefit received, but the context makes gratitude feel misplaced. However, that might just mean the reasons are overridden, not the wrong kind.

  Perhaps a case where the attitude is demanded by the object itself. For example, a dangerous animal that you shouldn't fear because it's endangered and you're a conservationist. But the danger is real, so fear is fitting, but you have reasons not to act on it. Still, the reason to fear is object-given and correct.

  I recall a real example: professional contexts. Take a bomb defuser who faces a bomb. The bomb is genuinely dangerous (object-given reason to fear), but the defuser must not feel fear to do their job. The reason not to fear is state-given (fear impairs performance), so that doesn't challenge the distinction.

  What if the object's properties are such that the attitude is fitting, but for the wrong person? For instance, feeling remorse for someone else's wrongdoing. But remorse is typically first-person.

  Let's try contempt. Suppose a politician who does something contemptible, like lying. Object-given reasons for contempt. But if you're their advisor, and showing contempt would harm your influence to do good, you have pragmatic reasons to suppress it. Again, state-given.

  I need a case where the reason is object-given but intuitively not a reason for the attitude. How about this: a child who believes monsters are under the bed. The monsters aren't real, but the child perceives them. Object-given for fear? Not really, since the properties aren't actual.

  Perhaps a different attitude: admiration. Imagine an artist who creates beautiful art but is a terrible person. Admiring the art is object-given, but admiring the person isn't. But that's separate.

  Let me consider gratitude in a scenario where the benefit is given for a bad reason. Suppose a racist shopkeeper gives you a discount because he thinks you're the same race. The benefit is real and intentional, so object-given reasons for gratitude exist. But should you feel grateful? Intuitively, no, because the reason for the benefit is racist. The grounds for gratitude are tainted. This might work. The reason is object-given (received a benefit intentionally), but the basis (racial bias) makes it feel like the wrong kind of reason to feel gratitude.

  Why is it wrong? Because gratitude typically requires that the benefit was given out of goodwill or at least not for morally repugnant reasons. So while the act has properties that normally call for gratitude, the context makes it inappropriate. But is this about the kind of reason or about the attitude not being deserved? The WKR problem is about reasons that aren't fitting for the attitude, not about overriding reasons.

  The user's challenge is to have an object-given reason that seems like the wrong kind. In this case, the reason is object-given but arguably not sufficient or appropriate due to the motive. However, it might still be considered the right kind but overridden by moral considerations.

  Another idea: fear of a justified punisher. Suppose you committed a crime, and a vigilante is coming to punish you justly. The vigilante is dangerous to you (object-given reason to fear), but since the punishment is deserved, fear might be inappropriate. Some might say you shouldn't fear just punishment. However, fear could still be a natural response. This is tricky.

  Perhaps a case involving contempt. Imagine a person who has a disability that causes them to behave in ways that might seem contemptible, but it's not their fault. For example, someone with Tourette's who says offensive things. Objectively, the behavior is offensive, so object-given reasons for contempt. But knowing it's involuntary makes contempt feel wrong. The reason is object-given (the offensive behavior) but it's the wrong kind because it's not blameworthy. This might work.

  Let me formalize it. The attitude is contempt. The object is a person with a neurological condition causing involuntary offensive remarks. The properties: they utter insults frequently. This seems to provide object-given reasons for contempt. But upon reflection, because the behavior is involuntary, contempt is inappropriate; it's not their fault. So the reasons, while object-given, are the wrong kind for the attitude of contempt because contempt requires agency or blameworthiness.

  This challenges Parfit's distinction because the reason is grounded in the object (the behavior), which is the sort of thing that could merit contempt in other contexts, but here it fails to be the right kind due to lack of control. So the object-given reason isn't sufficient; it's still the wrong kind because it doesn't account for the necessary conditions of the attitude (voluntariness).

  Similarly, for remorse: if you accidentally cause harm without negligence, object-given reasons exist (you caused harm), but remorse might not be fitting if you're not culpable. So the reason is object-given but wrong kind.

  In both cases, the reasons are object-given but fail to be fitting because they don't satisfy the full criteria for the attitude. This shows that the object-given/state-given distinction isn't enough; we need to consider whether the object's properties are of the correct type to merit the attitude, which involves normative conditions beyond just being about the object.

  So, the example demonstrates that Parfit's distinction might be necessary but not sufficient. Even object-given reasons can be the wrong kind if they don't align with the deeper norms governing the attitude, like control for contempt or culpability for remorse. Thus, solving the WKR problem requires more than just filtering out state-given reasons; we need a substantive account of what makes properties relevant to specific attitudes.
answer: |-
  Here's an original example designed to challenge Parfit's object-given/state-given distinction as a solution to the WKR problem, using **contempt** as the target attitude:

  ### The Case: Involuntary Insults
  **Scenario:** Alex has a rare neurological condition (similar to severe Tourette's syndrome) that causes them to *involuntarily* utter vicious, personalized insults directed at others. The insults are highly specific, creatively cruel, and accurately target deep insecurities—e.g., "Your lifelong artistic efforts are worthless because you lack true talent," or "Everyone tolerates you only out of pity." These remarks are *objectively* contemptible in content: they display malice, arrogance, and a deliberate-seeming intent to demean. However, Alex has zero control over these outbursts, feels profound shame about them, and is actively seeking treatment.  

  **Reason for Contempt:** You, the target of these insults, have an **object-given reason** (in Parfit’s sense) to feel contempt toward Alex. The reason is grounded *entirely in properties of Alex*: the *content* of the insults (malicious, degrading, arrogant) and their *apparent expressive agency* (the words seem to reveal Alex's "true" contemptible character). These features are classic object-given grounds for contempt—they appear to warrant the attitude based on the object's (Alex's) properties.  

  **The Problem:** Despite this being object-given, it strikes us as the **wrong kind of reason** to actually feel contempt toward Alex. Contempt seems inappropriate because Alex is *not responsible* for the insults—they are involuntary symptoms of a medical condition. The reason, while grounded in Alex's properties, feels "wrong" because it ignores the *normative conditions for blameworthy contempt* (e.g., voluntariness, ill will). You might instead feel pity, frustration, or compassion, but contempt would feel unjust.  

  ---

  ### What This Shows About the Object-Given/State-Given Distinction  
  1. **The Distinction Fails to Capture Normative Depth**:  
     Parfit’s framework assumes that if a reason is object-given (grounded in properties of the object), it is automatically the "right kind" for the fitting attitude. This example shows that **object-given reasons can still be the *wrong kind* if they fail to satisfy the deeper normative constraints of the attitude**. Here, the properties *are* contemptible in a superficial sense (e.g., the words *sound* malicious), but they lack the *moral connection* to agency required for fitting contempt. The distinction cannot detect this—it only filters out "external" state-given reasons (e.g., "a demon will punish you unless you feel contempt").  

  2. **The WKR Problem Persists at the Object Level**:  
     The issue isn’t just about *extrinsic* state-given reasons (like incentives or threats) but about **misaligned object-given properties**. Alex’s neurological condition creates a mismatch: the surface properties *prima facie* support contempt, but the underlying reality (non-culpability) voids their normative force. This reveals a gap in Parfit’s solution: even "pure" object-given reasons can be WKRs if they derive from *misleading* or *non-normatively-relevant* features of the object.  

  3. **Highlights the Need for a Substantive Normative Theory**:  
     The object-given/state-given distinction is merely structural—it doesn’t tell us *which* object-properties are truly reason-giving for an attitude. Solving the WKR problem requires **a substantive account of what makes a property *fitting* for a specific attitude** (e.g., contempt requires *culpable* malice). In this case, Alex’s properties are "object-given" but not *morally salient* for contempt. Parfit’s framework lacks the tools to make this distinction, as it focuses on the *source* (object vs. state) rather than the *content* of reasons.  

  ### Conclusion  
  Your example demonstrates that **Parfit’s distinction is insufficient to solve the WKR problem** because it cannot exclude object-given reasons that are *structurally correct* but *normatively defective*. The "right kind" of reason isn’t just about being object-given; it requires that the object’s properties *actually satisfy the attitude’s constitutive norms* (e.g., control and ill will for contempt). This suggests that fitting-attitude analyses need a richer, more nuanced criterion—such as a normative "filter" for object-given reasons (e.g., one appealing to moral responsibility or agential capacities)—to fully resolve the WKR problem.  

  **Key takeaway for your seminar:** The object-given/state-given distinction is a useful *first pass* at the WKR problem, but it risks being *too shallow*. A successful solution must integrate substantive normative criteria to determine *which* object-given reasons are genuinely fitting.
