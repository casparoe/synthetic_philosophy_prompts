    "musical_forms": ["explicitly illustrative \"tone-painting\" that imitates a real event such as a storm", "an opera aria tightly bound to a specific dramatic text", "a full symphonic texture in which bass, inner harmonic voices and melody are all present together", "a simple, unaccompanied melody"]
