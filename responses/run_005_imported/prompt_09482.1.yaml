  **Justification for visual/poetic arts ranking:**  
  Schopenhauer ranks arts by how directly they reveal the "Ideas" (grades of the will's objectification). Architecture is lowest, objectifying only basic forces like gravity. Landscape gardening/painting rises above it by capturing vegetative life. Animal art surpasses this by revealing animal consciousness. Idealized human figures rank higher as they embody the highest visible grade of the will (human essence). Lyric poetry exceeds visual arts by expressing universal human emotions. Tragedy tops the hierarchy by revealing life's deepest suffering and the will's negation—the pinnacle of poetic objectification.

  **Justification for musical forms ranking:**  
  Schopenhauer values music's purity as a *direct* copy of the will, untainted by representation. Tone-painting (e.g., storm imitation) is least pure, as it mimics phenomena rather than the will itself. Opera arias are compromised by subservience to text, diluting music's universality. Full symphonic textures are purer, with bass (will's primal urges), harmony (middle emotions), and melody (intellect) collectively mirroring the will's structure. However, an unaccompanied melody ranks highest because it isolates the will's most intellectual expression (melody alone) without harmonic "distraction," achieving maximal abstraction from representation. Schopenhauer explicitly praises melody's directness (§52), while complexity (symphony) merely elaborates on this foundation. Thus, simplicity best fulfills music's metaphysical role.
