answer: |-
  Here are 10 targeted questions digging into the unresolved tensions and real-world implications of resolute choice, plus sharp follow-ups based on likely responses:

  1.  **The Willpower Mask:**
      *   **Question:** Critics argue that "resolving to stick with the plan" in resolute choice is just willpower rebranded as rationality. Doesn't this concede that *at the moment of choice*, you recognize a more desirable action exists (defection), and rationality is merely the *discipline* to override it? Are you smuggling in a separate faculty (willpower) to save the theory?
      *   *Likely Answer/Follow-Up:* (If she argues resoluteness *is* rational at the moment) "But if defection *feels* strictly preferable *right now* and requires active suppression, how is that suppression fundamentally different from exerting willpower against temptation? Isn't calling it 'rational' just semantics?"

  2.  **Incomplete Preferences & Modern Money Pumps:**
      *   **Question:** Modern money-pump arguments (e.g., Mandler, Rabinowicz) target agents with *incomplete* preferences. They construct chains of trades between options A and Z (which are incomparable) via intermediates B, C,...Y, where each step (A to B, B to C,... Y to Z) is either preferred or indifferent, but A and Z remain incomparable. How does resolute choice resolve this? What specific "plan" does the agent commit to *ex-ante* to avoid being pumped through this chain without ever directly confronting the A-Z incomparability?
      *   *Likely Answer/Follow-Up:* (If she suggests committing to *not trading* at all, or only specific trades) "Doesn't this commitment arbitrarily freeze preferences? If the agent is truly indifferent between some steps (e.g., B and C), why is moving from B to C irrational *at that moment*? Isn't forbidding *any* movement in the chain an ad hoc restriction, not a consequence of rationality?"

  3.  **Akrasia, Procrastination, Addiction: Structural Identity?**
      *   **Question:** You describe money pumps as exploiting time-inconsistent preferences resolved by commitment. Isn't the core structure identical to ordinary akrasia (e.g., planning to diet tomorrow but giving in to cake today), procrastination (planning to start work early but delaying), or addiction (planning to quit but relapsing)? Is resolute choice fundamentally proposing the same solution (pre-commitment) for these pervasive human failures? Are they literally the same phenomenon?
      *   *Likely Answer/Follow-Up:* (If she distinguishes based on "rational" vs. "irrational" preference formation) "But in both cases, the agent *sincerely* forms a prior plan based on their values (health, productivity, sobriety) and later defects against it due to shifting local incentives (temptation, aversion, craving). If the structure is identical, why is defection 'irrational' in the money pump but often attributed to 'weakness' or 'pathology' in everyday cases?"

  4.  **The Self-Undermining Threat:**
      *   **Question:** Resolute choice only works if the agent *believes* they will follow through. But doesn't the theory itself teach the agent that *without* such a resolution, they are exploitable? Doesn't this create an incentive for sophisticated agents to *pretend* resoluteness to deter exploiters, while knowing internally they *would* defect if actually pumped? Isn't true resoluteness then only possible for the naive?
      *   *Likely Answer/Follow-Up:* (If she argues resoluteness is a sincere disposition) "But if sophisticated agents understand the money-pump vulnerability requires resoluteness *as a defense*, doesn't this strategic awareness undermine the sincerity of the commitment? How can you *sincerely* commit to something you only adopt as a shield against exploitation?"

  5.  **The Cost of Commitment:**
      *   **Question:** Pre-commitment mechanisms (like Odysseus tying himself) often involve real costs (lost flexibility, transaction costs). Resolute choice seems like a purely internal, costless commitment. But if it's costless, what prevents the agent from simply *reconsidering* the commitment at the choice node? Isn't the *only* barrier the *memory* of the prior resolution? How is this different from just having a very strong prior preference?
      *   *Likely Answer/Follow-Up:* (If she emphasizes the agent's identity over time) "If the 'cost' is maintaining a consistent identity, isn't this just dressing up regret avoidance or stubbornness as rationality? What makes sticking to a plan *because I said I would* specifically *rational*, rather than just psychologically consistent?"

  6.  **Beyond Dyadic Choices: Complex Plans & Unforeseen States:**
      *   **Question:** Resolute choice is often illustrated with simple sequential choices (like the classic $A > B > C > A$ pump). How does it scale to complex, multi-stage plans in uncertain environments? When unforeseen states arise that weren't contemplated in the original plan, how does the resolute agent decide whether sticking to the *spirit* of the plan requires deviation or adherence? Doesn't this reintroduce ambiguity and potential for dynamic inconsistency?
      *   *Likely Answer/Follow-Up:* (If she says the plan must include contingencies) "But perfect contingency planning is impossible (Savage's 'Small Worlds’ problem). When an unforeseen state occurs, the agent must *reinterpret* the plan. Isn't this reinterpretation just a *new* decision point where the axioms apply again, potentially leading back to the original inconsistency?"

  7.  **Evolutionary/Adaptive Critique:**
      *   **Question:** From an evolutionary or adaptive perspective, dynamic inconsistency (like hyperbolic discounting) can sometimes be beneficial (e.g., seizing immediate opportunities). If standard rationality axioms describe the preferences of agents likely to survive and thrive (by avoiding exploitation), doesn't resolute choice seem like a clever *patch* for a fundamentally maladaptive preference structure, rather than a description of true rationality?
      *   *Likely Answer/Follow-Up:* (If she argues rationality is normative, not descriptive/adaptive) "Even normatively, if a preference structure systematically leads to vulnerability *unless patched by commitment*, doesn't that suggest the underlying preferences *are* the problem? Isn't resoluteness an admission that the axioms *are* normatively correct guides for preference formation?"

  8.  **The "Why Bother?" Objection:**
      *   **Question:** If an agent needs resolute choice to avoid being money-pumped due to violating standard axioms, why not simply *adopt preferences that satisfy the axioms* in the first place? Isn't the resolute agent engaging in unnecessary cognitive gymnastics to protect preferences they could (and perhaps should) just change?
      *   *Likely Answer/Follow-Up:* (If she argues some axiom violations reflect genuine, rational values - e.g., Allais) "But if the Allais preference is genuinely rational, why is it vulnerable to exploitation *at all*? Shouldn't truly rational preferences be dynamically consistent *without needing* an extra layer of resolution? Doesn't needing resolution imply a flaw?"

  9.  **The Limits of Resolution:**
      *   **Question:** Psychological research shows limits on willpower, commitment, and self-control. If resolute choice relies on the *effectiveness* of this internal commitment mechanism, but we know this mechanism is cognitively limited and often fails (as per the akrasia you distinguish), doesn't this make resolute choice a descriptively weak and normatively fragile theory? Is it only rational for agents with perfect self-binding capacity?
      *   *Likely Answer/Follow-Up:* (If she argues it's normative regardless of psychological limits) "Doesn't a normative theory that relies on a psychologically implausible mechanism (perfect, costless internal commitment) lose practical relevance? Shouldn't a theory of rationality account for the cognitive limitations of the agents it describes?"

  10. **The AI Test:**
      *   **Question:** Imagine programming an artificial agent. Would you implement resolute choice? If so, how? Would you hard-code specific plans? Implement a meta-rule forbidding reconsideration? Or simulate a "resolution" module? Doesn't trying to implement it reveal that it either collapses into standard optimization (if the resolution always holds) or requires arbitrary restrictions on processing?
      *   *Likely Answer/Follow-Up:* (If she suggests a meta-rule against reconsideration) "Isn't this meta-rule just an external imposition of the standard axioms ('Thou shalt have dynamically consistent preferences')? How is programming 'Be resolute!' different from programming 'Have transitive preferences!'? Doesn't the implementation bypass the core idea of protecting *violating* preferences?"

  **Key Angles Covered:**
  *   **Willpower vs. Rationality:** Q1 (Core) & F/U.
  *   **Incomplete Preferences:** Q2 (Core) & F/U.
  *   **Akrasia/Procrastination:** Q3 (Core) & F/U.
  *   **Self-Undermining:** Q4.
  *   **Cost/Mechanism:** Q5.
  *   **Complexity/Unforeseen States:** Q6.
  *   **Adaptive Critique:** Q7.
  *   **"Why not fix preferences?":** Q8.
  *   **Psychological Plausibility:** Q9.
  *   **Implementation/Arbitrariness:** Q10.

  These questions force her to confront the *mechanism* of resolution, its *psychological plausibility*, its handling of *modern challenges* (incompleteness), its relationship to *real-world self-control failures*, and potential *self-undermining* or *arbitrariness*. Good luck with the interview!
