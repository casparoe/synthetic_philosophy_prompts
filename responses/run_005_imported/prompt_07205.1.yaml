prompt: |-
  My younger brother's getting a corpus callosotomy in a few weeks — his drop seizures haven't responded to anything else — and I've been falling down a rabbit hole reading about split-brain patients to brace myself for what comes after. Every pop-sci article I find just states as fact that these patients end up with two seperate minds, citing Gazzaniga's old interpreter experiments, but then I found some philosophy stuff (I think it was Tim Bayne?) arguing that's way too fast, that what the classic experiments actually show is disrupted access between the hemispheres, not necessarily two full streams of consciousness. Could you lay out the strongest version of that access-vs-phenomenal-unity distinction for me, and explain why stuff like the half-visual-field flash tests or the left hand doing things the patient can't explain doesn't automatically settle how many "subjects of experience" are actually in there? I dont want the wishy-washy "well some say this, some say that" answer, I want the actual argument, as strong as it gets on both sides.
