answer: |-
  Your grasp of Wittgenstein's tension is profound—and crucial for portraying Ines authentically. These metaphors **are compatible**, but they operate at different *temporal and functional scales*. The stroke doesn’t shatter her world; it exposes the fluidity beneath what felt like bedrock. Here’s how to reconcile them for your novel:

  ### 1. **The Hinges: Local, Practical Fixity**
     - **Function**: Hinges stabilize *specific actions or inquiries*. To check if the milk is sour, Ines must accept "this is my fridge" as fixed *during that act*. Doubting the hinge *while turning the door* paralyzes action.
     - **Temporal Scope**: "Hinges stay put" **only within a discrete moment of engagement**. When Ines searches for a spoon, "this is my kitchen" is the hinge. But tomorrow, after a sleepless night, that hinge might feel less stable.  
     - **Key Insight**: Hinges aren’t eternally immutable—they’re *pragmatically immutable* for the task at hand. The stroke disrupts this pragmatic stability.

  ### 2. **The Riverbed: Geological Shifts Over Time**
     - **Function**: The riverbed (hard rock/sand) is the *historical context* for hinges. What’s "hard rock" for one era (e.g., Newtonian physics) becomes "sand" in another (relativity). 
     - **Temporal Scope**: Shifts occur across *lifetimes or cultures*, not during a single act. Ines’s pre-stroke certainties were "rock" forged over decades; her stroke accelerates erosion into days.
     - **Key Insight**: Riverbed changes are collective and slow. Ines’s crisis is personal and sudden—a **forced confrontation with the sand under her feet**.

  ---

  ### **Resolving the Tension:**
  - **Hinges operate WITHIN the riverbed**. The riverbed’s composition determines *which propositions can serve as hinges* for a person or culture. Ines’s stroke doesn’t break all hinges at once—it liquefies *specific patches* of her riverbed, making certain hinges (e.g., "this kitchen is mine") unreliable in moments of action.

  ---

  ### **Implications for Ines’s Condition:**
  | **Pre-Stroke Certainty**       | **Post-Stroke Vertigo**          |
  |-------------------------------|----------------------------------|
  | "This is my kitchen" = bedrock | "This is my kitchen" = shifting sand |
  | Hinge *during action*: fixed   | Hinge *during action*: wobbles   |
  | Automatic, pre-conscious trust | Requires conscious verification |

  - **Why It’s Not "Amnesia"**: She *knows* the kitchen is hers intellectually—but the **embodied certainty** (the hinge’s function) fails. Like a bridge engineer, she understands static load principles, yet feels the structure tremble beneath her. This isn’t memory loss; it’s **epistemic dizziness**.
  - **Narrative Strategy**: Render these lapses as **sensory and kinetic**. She reaches for a teacup and her hand hovers—not because she forgot, but because the hinge ("my cup, my hand") grinds. Describe how she *rebuilds certainty* through touch (cold countertop), smell (lingering garlic), or habit (muscle memory opening a stiff drawer). 

  ---

  ### **A Bridge Engineer’s Insight (for Ines’s Character):**
  Leverage her expertise: **certainties are load-bearing structures**. Pre-stroke, she designed bridges trusting bedrock would hold. Post-stroke, she feels like the bedrock itself is settling. Yet engineers know bedrock *does* shift—over epochs. Her stroke compresses geological time into lived moments. Have her reflect: *"A truss fails when a joint rusts loose, not when the whole span collapses. Why did I think my mind was welded steel?"*

  ---

  ### **Key Takeaway for Your Novel:**
  Wittgenstein’s metaphors converge on this: **certainty is fluid until it’s needed as an anchor**. Ines’s stroke forces her to *notice* the current. What was instinctive ("home") now requires navigation. This isn’t a flaw in the metaphors—it’s the human condition made visceral. Your novel exposes what healthy minds hide: we walk on sand, trusting it to hold *just long enough to take the next step*.

  *"The door swings on its hinge, but only because the riverbed hasn’t yet washed away beneath the house."*  
  Lean into that fragility. It’s where Ines—and your readers—will find truth.
