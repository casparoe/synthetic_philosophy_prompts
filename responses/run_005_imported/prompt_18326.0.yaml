answer: |-
  Your question cuts to the heart of a profound and ongoing tension between moral philosophy and welfare economics, particularly concerning intergenerational justice and climate policy. You are absolutely right to identify the core conflict: **mainstream climate economics, as practiced by figures like William Nordhaus, does indeed rely on a positive discount rate that often incorporates an element equivalent to pure time preference, which Sidgwick and Parfit powerfully argued is ethically indefensible.** Here's a breakdown of the assessment:

  1.  **The Moral Philosophical Argument (Sidgwick/Parfit):**
      *   **The Core Principle:** Sidgwick (in *The Methods of Ethics*) and Parfit (especially in *Reasons and Persons*) argued that the mere location of a benefit or harm in time, *in and of itself*, provides no rational or ethical justification for valuing it less if it occurs further in the future. Discounting purely for time implies that the well-being of future people matters less simply because they are born later, which is analogous to discrimination based on spatial distance or arbitrary group membership.
      *   **The Implication for Discounting:** A *positive* "pure rate of time preference" (often denoted as ρ (rho) in the Ramsey equation) directly embodies this ethically problematic preference. Setting ρ > 0 means we intrinsically value the utility of future generations less than the utility of the present generation, solely due to their temporal location.
      *   **Widely Accepted:** As you note, this argument is indeed dominant within contemporary moral philosophy concerning intergenerational ethics. A zero or near-zero pure time preference rate (ρ ≈ 0) is considered the ethically defensible baseline for long-term decisions affecting future generations.

  2.  **The Economic Practice (Nordhaus et al.):**
      *   **The Ramsey Framework:** Mainstream climate economics typically uses a discounting framework derived from Frank Ramsey's work. The discount rate (r) applied to future consumption or utility is given by the Ramsey equation:
          `r = ρ + θ * g`
          *   `ρ`: Pure rate of time preference (impatience)
          *   `θ`: Elasticity of marginal utility of consumption (measuring how much extra utility declines as consumption increases; reflects aversion to inequality)
          *   `g`: Projected growth rate of per capita consumption.
      *   **Nordhaus's Choice:** Nordhaus uses a positive `ρ` (typically around 1.5% per year). He justifies this based on:
          *   **Observed Behavior:** Market interest rates and individual savings/consumption behavior reveal *revealed preference* for positive time preference (people discount their own future utility).
          *   **Extinction Risk:** A small positive ρ can be interpreted as accounting for the small but non-zero probability of human extinction in any given year, making future utility uncertain. (Philosophers often argue this is better modeled as a separate probability adjustment, not baked into ρ).
          *   **"Opportunity Cost" Argument:** Resources invested in mitigation today could be invested elsewhere, yielding returns that benefit future generations more. A positive discount rate reflects this potential return on capital. (Critics argue this confuses *intragenerational* capital productivity with the *intergenerational* ethical question of how much weight to give future welfare itself).
      *   **The Consequence:** A positive ρ, even a small one, has a massive impact over centuries. It drastically reduces the present value of damages occurring far in the future, justifying less aggressive near-term mitigation. Nordhaus's models consequently recommend slower emissions reduction pathways than models using ρ ≈ 0.

  3.  **Is Mainstream Climate Economics Resting on a Discredited Premise?**
      *   **Yes, in a Significant Sense:** **The core criticism is valid.** When economists like Nordhaus use a positive ρ purely based on observed impatience or an abstract "opportunity cost" argument applied across generations, they are indeed reintroducing the very pure time preference that moral philosophy has rejected as ethically baseless for intergenerational justice. It *does* systematically devalue the welfare of future people simply because they exist later in time.
      *   **But It's Not *Quietly* Resting on It; It's Explicit:** Nordhaus and others are very open about using ρ > 0 and their justifications. The debate is highly visible within economics and between economics and philosophy.
      *   **Nuances and Counterarguments within Economics:**
          *   **`g` and `θ` Matter Too:** Even if ρ = 0, a positive discount rate (r) can still arise from `θ * g` (if g > 0). This reflects the argument that if future generations are richer, a marginal dollar (or unit of consumption) is worth less to them than to poorer present generations. This is an argument about *efficiency* and *equity*, distinct from pure time preference. However, projecting g far into the future is highly uncertain, and whether this justifies discounting *welfare itself* (rather than just consumption) remains philosophically contested.
          *   **The Stern Review Counterpoint:** The famous 2006 Stern Review on the Economics of Climate Change explicitly adopted ρ = 0.1% (virtually zero) on ethical grounds, citing the Sidgwick/Parfit argument. This led to a much lower overall discount rate and much stronger recommendations for immediate, aggressive mitigation. Stern argued that failing to mitigate was a profound moral failure towards the future. Nordhaus strongly criticized Stern's choice as uneconomic.
          *   **Uncertainty and Catastrophic Risk:** Some economists argue high uncertainty about the distant future (technological change, catastrophe risks beyond extinction) justifies *effective* discounting, though again, philosophers prefer modeling uncertainty separately.
          *   **Practicality vs. Purity:** Some economists argue that while ρ=0 might be ideal, using ρ>0 based on observed behavior is necessary for policy relevance and political feasibility. Philosophers counter that ethics shouldn't be compromised by current preferences when the stakes involve the fate of future generations.

  **Conclusion:**

  Your understanding is correct. **Mainstream climate economics, exemplified by Nordhaus, does incorporate a positive pure rate of time preference (ρ > 0) into its discounting models, directly contravening the powerful ethical arguments against pure time preference put forth by Sidgwick and Parfit and widely accepted in moral philosophy.**

  While economists offer justifications (observed behavior, opportunity cost interpretations, extinction risk proxies), these do not negate the core ethical objection: discounting the welfare of future people simply because they live in the future is discriminatory and lacks a sound ethical foundation for intergenerational decisions with existential stakes like climate change.

  The debate is not quiet; it's loud and fundamental. It represents a deep clash between:
  *   **The Moral Imperative:** To treat the interests of all generations equally (ρ ≈ 0).
  *   **The Economic Pragmatism (as practiced by many):** To base discounting on observed market behavior and opportunity cost concepts, accepting ρ > 0.

  Therefore, models using ρ > 0 *are* vulnerable to the charge that they "smuggle in" an ethically discredited premise, systematically undervaluing the well-being of future generations in a way that moral philosophy finds deeply problematic. The choice of ρ remains perhaps *the* most ethically charged parameter in climate economics.
