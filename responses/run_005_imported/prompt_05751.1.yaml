  Bigger picture:

  The ex-ante/ex-post conflict shows that when individuals have different beliefs, the ex-ante Pareto principle ( which is a condition of unanimity at the ex-ante stage) may lead to choices that are not Pareto efficient at the ex-post stage, and moreover, that everyone may regret in some states. This challenges the use of ex-ante Pareto in social choice when beliefs differ.

  For Harsanyi's theorem, the result only delivers a weighted utilitarianism when utilities are cardinal and comparable and when beliefs are shared. When beliefs are not shared, the ex-ante Pareto principle may conflict with ex-post Pareto and with other desirable properties.

  Some ways to rescue the result:

  1. Insist on shared beliefs. This might be justified by a requirement of objective or agreed-upon probabilities.

  2. Use ex-post utilitarianism: aggregate utilities after the state is known, using a social welfare function that is a weighted sum of individual utilities. This avoids the ex-ante conflict but may not respect ex-ante preferences.

  3. Use a hybrid approach: like ex-ante for ex-post efficiency, or use a veil of ignorance.

  In conclusion, the aggregation theorem of Harsanyi provides a foundation for utilitarianism under shared beliefs, and when beliefs differ, the society must be cautious in applying the ex-ante Pareto principle to avoid the possibility of ex-post regret.

