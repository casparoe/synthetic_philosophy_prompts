  Mechanics:

  The ex-ante Pareto principle respects the expected utility of the individuals based on their own beliefs. When beliefs differ, it is possible that an act is ex-ante Pareto optimal because each individual expects it to be good for them, but in some states of the world, the outcome may be such that every individual, in hindsight, would have preferred a different act. This can happen if the act is a bet that one state will occur, and the individuals are optimistic about their preferred state, but the state that occurs is one where the bet is bad for everyone.

  In the example where both individuals are optimistic about the state in which they win, and if the state that occurs is the one that is win for no one ( but in our setup, there is no such state), it's not happening.

  In the example where the act is that they are betting against each other, then in the state that occurs, one wins and the other loses, so the loser would have preferred not to bet.

