  ### The Ex-Ante/Ex-Post Pareto Conflict: A Minimal Example

  Let's walk through a bare-bones example with two people (Alice and Bob) and two states of the world (State 1 and State 2). The key is that Alice and Bob have **different subjective probabilities** about which state will occur, and we'll compare two social choices (Lottery A and Lottery B). This example is inspired by the Hylland-Zeckhauser/Mongin paradox, simplified for clarity.

  #### Setup:
  - **States of the world**:  
    - State 1 (S1)  
    - State 2 (S2)  
    Each state occurs with objective probability 0.5, but Alice and Bob disagree on these probabilities.  

  - **Subjective beliefs**:  
    - Alice believes: \( P_A(S1) = 0.9 \), \( P_A(S2) = 0.1 \) (she thinks S1 is very likely).  
    - Bob believes: \( P_B(S1) = 0.1 \), \( P_B(S2) = 0.9 \) (he thinks S2 is very likely).  

  - **Utilities** (state-independent, linear in consumption):  
    - Both Alice and Bob care only about their own consumption.  
    - Utilities are identical across states for simplicity.  

  - **Social alternatives**:  
    - **Lottery A**: Constant payoff.  
      - In *both* states: Alice gets 1 unit, Bob gets 1 unit.  
    - **Lottery B**: State-contingent payoff.  
      - In **S1**: Alice gets 2 units, Bob gets 0 units.  
      - In **S2**: Alice gets 0 units, Bob gets 2 units.  

  ---

  ### Step 1: Ex-Ante Preferences (Before the State is Known)
  Individuals evaluate lotteries using their *own* beliefs and expected utility.  
  - **Alice's calculation for Lottery B**:  
    - \( EU_A(B) = (0.9 \times 2) + (0.1 \times 0) = 1.8 \)  
    - \( EU_A(A) = (0.9 \times 1) + (0.1 \times 1) = 1 \)  
    → Alice prefers B to A (1.8 > 1).  

  - **Bob's calculation for Lottery B**:  
    - \( EU_B(B) = (0.1 \times 0) + (0.9 \times 2) = 1.8 \)  
    - \( EU_B(A) = (0.1 \times 1) + (0.9 \times 1) = 1 \)  
    → Bob prefers B to A (1.8 > 1).  

  **Ex-ante Pareto outcome**: Both prefer Lottery B over Lottery A. If a social planner respects ex-ante Pareto (i.e., goes with what everyone prefers given their beliefs), they choose Lottery B.

  ---

  ### Step 2: Ex-Post Preferences (After the State is Revealed)
  Now, the state is revealed. We compare outcomes:  
  - **In State 1 (S1)**:  
    - Lottery A: Alice gets 1, Bob gets 1.  
    - Lottery B: Alice gets 2, Bob gets 0.  
      - Alice is happy (2 > 1), but **Bob is worse off** (0 < 1).  
      → Bob prefers Lottery A’s outcome to Lottery B’s outcome.  

  - **In State 2 (S2)**:  
    - Lottery A: Alice gets 1, Bob gets 1.  
    - Lottery B: Alice gets 0, Bob gets 2.  
      - Bob is happy (2 > 1), but **Alice is worse off** (0 < 1).  
      → Alice prefers Lottery A’s outcome to Lottery B’s outcome.  

  **Result**:  
  - In **every possible state**, one person is worse off under Lottery B than they would have been under Lottery A.  
  - The "unanimity" that justified choosing B ex-ante was **belief-driven**:  
    - Alice supported B because she thought S1 was likely (where she wins).  
    - Bob supported B because he thought S2 was likely (where he wins).  
  - Once the state resolves, the "loser" in that state regrets the choice.  

  ---

  ### Key Insight: Why This is a Problem
  - **Ex-ante Pareto** led to a choice (B) that, **ex-post, is strictly worse for one person in every state** compared to the alternative (A).  
  - The conflict arises because:  
    - Individuals agreed on B *only* due to conflicting beliefs (Alice was optimistic about S1, Bob about S2).  
    - There was no **shared belief** about probabilities or **common interest** in outcomes.  
  - This violates **ex-post Pareto efficiency**: In each state, moving from B’s outcome to A’s outcome would make one person better off without harming the other.  

  ---

  ### Implications for Harsanyi’s Theorem and Utilitarianism
  Harsanyi’s theorem assumes that everyone shares the *same* probabilities over states (or that utilities are state-independent). Your intuition is correct: **once beliefs diverge, the theorem’s utilitarian conclusion (social utility as a weighted sum of individual utilities) faces serious challenges**. Here’s why:

  1. **Harsanyi’s reliance on shared beliefs**:  
     - The theorem requires that individuals and the planner agree on probabilities to derive a social utility function \( U = \sum w_i u_i \).  
     - In our example, the weights \( w_i \) might reconcile ex-ante preferences, but they fail ex-post because the "aggregated" choice (B) is Pareto-inferior in every realized state.  

  2. **The ex-ante/ex-post conflict undermines utilitarianism**:  
     - Utilitarianism (weighted or not) assumes utilities can be summed consistently across states. But when beliefs differ, ex-ante utilitarian aggregation can:  
       - Prioritize "mutually optimistic bets" that backfire ex-post.  
       - Ignore the risk that individuals impose externalities on each other through belief-driven choices.  
     - This creates a **dynamic inconsistency**: Society accepts a gamble ex-ante that everyone rejects ex-post.  

  3. **Can the result be rescued?**  
     - **Option 1: Insist on shared beliefs**.  
       If all agree on probabilities (e.g., through objective evidence), Harsanyi’s theorem holds, and utilitarianism is robust. But this is unrealistic in many social choices.  
     - **Option 2: Shift to ex-post aggregation**.  
       Aggregate utilities *after* the state is known (e.g., via ex-post weighted utilitarianism). This avoids the conflict but violates ex-ante autonomy—individuals’ beliefs are ignored in social decisions.  
     - **Option 3: Weaken Pareto principles**.  
       Some theorists (e.g., Mongin) suggest dropping ex-ante Pareto when beliefs differ. Instead, use **conditional Pareto** (e.g., unanimity only under shared information) or focus on **ex-post efficiency** with belief-sensitive negotiation (e.g., betting markets).  
     - **Option 4: Introduce a veil of ignorance**.  
       Original-position reasoning (à la Rawls) could force individuals to agree on probabilities behind a "veil," restoring Harsanyi’s setup. However, this is more normative than descriptive.  

  ### Broader Philosophical Takeaway
  This paradox highlights that **belief divergence breaks the link between individual rationality and social rationality**.  
  - **For decision theory**: It shows that ex-ante Pareto (a cornerstone of welfare economics) can conflict with ex-post welfare when individuals hold incompatible worldviews. Rational individuals can collectively choose a dominated option.  
  - **For social choice**: It suggests that utilitarianism is fragile without shared beliefs. Formal arguments for utilitarianism (like Harsanyi’s) must either assume homogeneous beliefs or incorporate belief aggregation explicitly.  
  - **For policy**: In real-world decisions (e.g., climate policy or pandemic response), if experts disagree on risks, ex-ante "consensus" might mask future regrets. Social planners should:  
    - Distinguish between *belief disagreements* and *preference disagreements*.  
    - Prioritize ex-post robustness (e.g., choose options that are tolerable in all states).  

  This doesn’t invalidate Harsanyi, but it shows that **utilitarian aggregation is domain-specific**: it thrives under shared beliefs but can produce perverse results when beliefs diverge. If you’re exploring further, Mongin’s *Journal of Economic Theory* (1995) and Hylland-Zeckhauser’s *QJE* (1979) papers formalize this rigorously.
