  ### Key Clarifications:
  - **Move 1's flaw**: Kin selection (inclusive fitness) *is* gene-centered, but group selection isn't reducible to it when r=0. Warren conflates "gene-level accounting" with "only gene-level causality."
  - **Move 4's strength**: Non-additivity breaks equivalence because fitness isn't separable. Example: A 5-member hunting group succeeds only if ≥3 cooperate. Individual fitness depends non-additively on group composition – a group-level property.
  - **Philosophical core**: Noor defends *causal emergence* (group properties have explanatory power), while Warren defends *reductionism* (all causation flows from genes). Biology needs both: genes replicate, but selection acts on phenotypes in environments – which can include group structures.
