prompt: |-
  Two of my housemates, Theo and Nadia, got into a whole thing over dinner about a brainteaser our TA gave us for section, and I've been turning it over since because I honestly can't tell who came out ahead. We'd just finished a unit on formal epistemology in my epistemology seminar — credences, the principle of indifference, Bertrand's paradox with the classic random-chord-in-a-circle setup — and the brainteaser was basically a spinoff of that: say you're told a marble is a perfect sphere with radius somewhere between 0 and 2 cm, and that's genuinely all you know about it, nothing about how it was made or picked. By the principle of indifference, what probability should you assign to "its volume is less than half of the maximum possible volume"?

  Theo said you obviously spread your credence flat over the radius, since that's the quantity the problem actually hands you, and got about 79%. Nadia said that's arbitrary, since the exact same set of possible marbles can be described just as well in terms of their volumes, and being flat over volume instead gets you exactly 50% — nothing in the setup says radius is the privileged variable. Theo's comeback was that radius is the more basic quantity, since volume is literally defined in terms of it, so indifference should attach to whichever variable is more fundamental. Nadia said "basic" was doing all the work in that sentence, since you could just as easily call volume the fundamental one, seeing as its what actually determines how much material you'd need. At that point Theo half-remembered our professor mentioning a fix, something by a guy named Jaynes, where you pick whatever distribution stays invariant if you rotate or rescale the whole setup, and figured that probably rescues his 79%; Nadia wasn't so sure that move even transfers here, since there's no actual physical random process being described, just ignorance about one fixed marble, and anyway, deciding which symmetries you're even entitled to demand invariance under is itself a further assumption, not something that falls out for free. (A third housemate wandered through, tried it with surface area instead, got 63%, and nobody felt better.)

  Could you go through this move by move and say who's right about which specific points — not just crown an overall winner — and call out anything you think both of them are missing? I'm also stuck on the deeper question sitting underneath their argument: is there ever a principled way to say which variable "deserves" the flat distribution when you're in a state of total ignorance, or does Bertrand's paradox basically show the principle of indifference just isn't well-defined for continuous quantities unless somebody sneaks in an assumption from outside?
reasoning: |-
  We are given a marble that is a perfect sphere with radius r in [0,2] cm. We know nothing else. We wish to assign a probability that the volume is less than half of the maximum possible volume.

  First, note the maximum radius is 2 cm, so the maximum volume is V_max = (4/3)π(2)^3 = (4/3)π*8 = 32π/3 cm³.

  Half of the maximum volume is V_half = (1/2) * (32π/3) = 16π/3 cm³.

  We wish to compute P( V < V_half ).

  The volume of a sphere is V(r) = (4/3)πr³.

  So, we require:
     (4/3)πr³ < 16π/3
     => r³ < 4
     => r < ∛4 ≈ 1.5874 cm.

  Therefore, the event "volume less than half of the maximum" is equivalent to "radius less than ∛4 cm".

  Now, the problem is how to assign a probability distribution to r (or equivalently to V) over the interval [0,2].

  Theo's approach: assign a uniform distribution to the radius r over [0,2]. Then the cumulative distribution function for r is F(r) = r/2 for r in [0,2]. Then:
     P(r < ∛4) = ∛4 / 2 ≈ 1.5874 / 2 ≈ 0.7937, or about 79%.

  Nadia's approach: assign a uniform distribution to the volume V. Since V = (4/3)πr³, and r goes from 0 to 2, V goes from 0 to 32π/3. The uniform distribution on V would have a cumulative distribution function F_V(v) = v / (32π/3) for v in [0, 32π/3]. Then:
     P(V < 16π/3) = (16π/3) / (32π/3) = (16π/3) * (3/(32π)) = 16/32 = 1/2 = 50%.

  But note that if we transform the uniform distribution on r to a distribution on V, we get:
     The density of r: f_r(r) = 1/2 for r in [0,2].
     Then the density of V: 
          f_V(v) = f_r(r) * |dr/dV|
     Since V = (4/3)πr³, then dV/dr = 4πr², so dr/dV = 1/(4πr²) = 1/(4π ( (3v/(4π))^(2/3) ) )
     Alternatively, we can express in terms of r: 
          f_V(v) = (1/2) * (1/(4πr²))   [but note that r is a function of v: r = (3v/(4π))^(1/3)].

     At v = (4/3)πr³, we have:
          f_V(v) = (1/2) * (1/(4πr²)) = (1/(8πr²)).

     Since r = (3v/(4π))^(1/3), then:
          r² = (3v/(4π))^(2/3)
          so f_V(v) = (1/(8π)) * (4π/(3v))^(2/3) * (1/( (4π/3)^(2/3) ))   [This step is messy, but note:]

     Alternatively, we can compute the cumulative distribution for V from that of r:
          P(V <= v) = P( (4/3)πr³ <= v ) = P( r <= (3v/(4π))^(1/3) ) = [ (3v/(4π))^(1/3) ] / 2.

     Then the density is the derivative of that with respect to v:
          d/dv [ (3v/(4π))^(1/3) / 2 ] = (1/2) * (1/3) * (3/(4π))^(1/3) * v^(-2/3)
          = (1/6) * (3/(4π))^(1/3) * v^(-2/3)

     This is not constant! So if we start with uniform on r, we do not get uniform on V.

  Similarly, if we start with uniform on V, we get a non-uniform distribution on r.

  Hence the paradox: the two approaches yield different probabilities.

  Now, the debate:

  Theo: argues that we should use uniform on radius because it is the "more basic" quantity, since volume is defined in terms of radius.

  Nadia: argues that we could just as well use volume, and there's no reason to privilege radius.

  Bertrand's paradox shows that the principle of indifference for continuous variables is ambiguous without a clear choice of parameterization.

  Jaynes' approach: use invariance under certain transformations. In this case, we have a scale symmetry because the problem sets a maximum radius (2 cm) but we might consider that the choice of units (cm) is arbitrary. However, note that the problem fixes the range [0,2] for the radius, so we have a fixed scale. But Jaynes might suggest that we should use a distribution that is invariant under changes of scale.

  However, note that the problem does not involve any physical random process. It is about a state of ignorance.

  Let's try to apply Jaynes' idea. In the classic Bertrand's paradox (with chords in a circle), Jaynes resolved it by noting that the problem has rotational and translational symmetry, and thus the distribution should be invariant under those symmetries. In our case, we have a sphere and we are told the radius is between 0 and 2. But note that the sphere is fixed, and we are only varying the radius. However, the problem does not specify a physical mechanism for how the marble was chosen. So we might consider that the only thing we know is the scale: the radius is in [0,2]. 

  Jaynes might suggest that we use a prior that is invariant under scaling. But note: if we change the unit of length, then the radius r becomes r' = a*r, and the volume becomes V' = a^3 * V. The condition that the radius is in [0,2] becomes [0, 2a]. We want the probability to be the same regardless of the unit. That is, the probability that the radius is in [0, x] (with x in [0,2]) should depend only on the ratio x/2. Similarly, for volume, the probability that the volume is in [0, v] (with v in [0, V_max]) should depend only on v/V_max.

  But note that the uniform distribution on the radius is scale-invariant in the following sense: if we change the unit by a factor a, then the new radius r' = a*r, and the interval [0,2] becomes [0, 2a]. The uniform distribution on [0,2a] has density 1/(2a). Then the probability that r' < a*x (where x is a fixed value in the original unit) is (a*x)/(2a) = x/2, which is the same as the original P(r < x). So uniform on radius is scale-invariant.

  But wait: what if we consider the volume? The uniform distribution on the volume is not scale-invariant. If we change the unit, then the volume becomes V' = a^3 * V. The maximum volume becomes V_max' = a^3 * V_max. The uniform distribution on [0, V_max'] would assign P(V' < a^3 * v) = (a^3 * v) / (a^3 * V_max) = v/V_max, which is the same as the original. So uniform on volume is also scale-invariant? 

  But note: we cannot have both uniform on radius and uniform on volume because they lead to different distributions. However, what we see is that both distributions are scale-invariant in the sense that the probability for the event (radius less than a given fraction of the maximum radius) is the same regardless of the unit, and similarly for volume. 

  But the issue is that the event we are interested in is defined in terms of volume: "volume less than half of the maximum". This event is equivalent to "radius less than ∛(1/2) of the maximum radius" because:
     V < (1/2) V_max   <=>   r < (1/2)^(1/3) * r_max   [since V ∝ r³].

  So the event is: r < (1/2)^(1/3) * 2 = 2 * (1/2)^(1/3) = 2 * 2^(-1/3) = 2^(2/3) ≈ 1.5874, as before.

  Now, if we use uniform on radius, P(r < 2^(2/3)) = 2^(2/3)/2 = 2^(-1/3) ≈ 0.7937.

  If we use uniform on volume, then we get 50%.

  But note that under scale invariance, the distribution for the radius should be such that the cumulative distribution function F(r) depends only on r/r_max. So F(r) = g(r/r_max) for some function g. Then the density is f(r) = g'(r/r_max) * (1/r_max). We require that the probability for the event {r < k * r_max} (for k in [0,1]) is g(k). 

  In the uniform radius case, g(k)=k.

  In the uniform volume case, note that V = c * r^3 (with c=4π/3), and V_max = c * (r_max)^3. Then:
     P(V < k * V_max) = P(c*r^3 < k * c * (r_max)^3) = P(r < k^(1/3) * r_max)
     = g(k^(1/3)).

  But if we want uniform on volume, then P(V < v) = v/V_max, so for v = k * V_max, we have P = k. Therefore:
     g(k^(1/3)) = k   =>   g(t) = t^3   [by setting t = k^(1/3)].

  So the cumulative distribution for the radius would be F(r) = (r / r_max)^3. Then the density of r would be f(r) = 3 r^2 / (r_max)^3.

  This is the same as what we get if we transform the uniform volume distribution to the radius.

  So we have two scale-invariant distributions? How can that be?

  Actually, both distributions are scale-invariant in the sense that the probability of an event defined by a fraction of the maximum is invariant under scaling. However, they are different because they correspond to different ways of defining the event in terms of the variable.

  But note: the event we are interested in is defined by a fraction of the maximum volume. In the uniform volume distribution, we assign probability k to the event that the volume is less than k * V_max. In the uniform radius distribution, we assign probability k to the event that the radius is less than k * r_max. But these are different events. The event {V < k * V_max} is the same as {r < k^(1/3) * r_max}. So if we want the probability of the event defined by a fraction of the maximum volume to be k (for uniform volume), then we are led to the distribution for the radius: F(r) = (r/r_max)^3.

  Therefore, the question is: should we assign a uniform distribution to the volume or to the radius? 

  Jaynes' idea in the classic Bertrand paradox was to use the invariance under transformations that leave the problem unchanged. In our problem, we have a fixed interval [0,2] for the radius. But note that the problem does not specify any particular location or orientation (which are not relevant for a sphere) and the scale is fixed by the interval. However, the problem does not give us any information about the process that generated the marble. 

  Jaynes might suggest that we consider the problem as having a scale symmetry in the sense that we have no information that breaks scale invariance. But note: the interval [0,2] breaks the scale symmetry because it fixes the maximum radius at 2. However, we can also think of the problem as having a maximum radius R=2, and we are considering the ratio r/R. Then the problem becomes: we know nothing about the ratio r/R except that it is in [0,1]. Then we wish to assign a distribution to the ratio.

  But now we have a ratio in [0,1]. The principle of indifference for a ratio might suggest uniform? But that is what Theo did (uniform on r, which is equivalent to uniform on r/R). But then we get 79%. However, we could also consider the volume ratio: (V/V_max) = (r/R)^3. Then if we assign uniform to the volume ratio, we get 50%.

  So we are back to the same problem.

  Jaynes' resolution of Bertrand's paradox used the idea of invariance under the group of transformations that preserve the symmetries of the problem. For the circle, that was rotations and translations. For our problem, what are the symmetries? We have a sphere, but the problem does not involve any spatial position. The only symmetry we might have is scale invariance? But note: the problem gives a fixed maximum radius (2 cm), so the scale is fixed. Therefore, it is not clear that we have scale symmetry.

  Alternatively, we might consider that the problem is defined by the interval [0,2] for the radius. Then the only natural symmetry is translation? But translation in the radius space? That doesn't make sense because the interval [0,2] is bounded and not symmetric under translation.

  Given the above, it seems that without additional structure, there is no clear resolution.

  However, let us consider the third housemate who used surface area. The surface area A = 4πr². Then the maximum surface area is 4π(2)^2 = 16π. Half of the maximum volume is 16π/3 (as before). But note: the event is defined by volume, not surface area.

  But we can express the event in terms of surface area? Actually, the volume is V = (1/6)√(A^3/π) [since A=4πr² => r=√(A/(4π)), then V = (4/3)π (A/(4π))^(3/2) = (4/3)π (A^(3/2))/(8π^(3/2)) = (1/6) √(A^3/π) ].

  Alternatively, we can note:
     V ∝ r^3, and A ∝ r^2, so V ∝ A^(3/2).

  Then half the maximum volume: V_half = (1/2) V_max => A_half = ( (1/2) )^(2/3) * A_max.

  So A_max = 16π, then A_half = (1/2)^(2/3) * 16π = 16π * (1/4)^(1/3) = 16π * (1/∛4) = 16π / ∛4.

  But numerically, ∛4 ≈ 1.5874, so A_half ≈ 16π / 1.5874 ≈ 10.079π.

  Then if we assign a uniform distribution to the surface area A in [0, 16π], then:
     P(A < A_half) = (16π / ∛4) / (16π) = 1/∛4 = 1/1.5874 ≈ 0.62996, or about 63%.

  So we get 63% if we use surface area.

  Thus, we have three different answers: 79%, 50%, 63%.

  The deeper question: is there a principled way? Bertrand's paradox shows that without additional structure, the principle of indifference is ambiguous for continuous parameters.

  In this specific problem, note that the problem states: "that's genuinely all you know about it, nothing about how it was made or picked." So we are in a state of total ignorance.

  Jaynes' method requires identifying a group of transformations that leave the problem invariant. In our case, we might argue that the problem is invariant under a change of units. But as we saw, both uniform on radius and uniform on volume are invariant under a change of units in the sense that the probability for the event defined by a fraction of the maximum is invariant. However, the event we care about is defined by a fraction of the maximum volume, so it is natural to use the volume ratio? But then we get 50%. Alternatively, if we consider that the problem gives the radius interval, it might be natural to use the radius? But then we get 79%.

  But note: the problem says "radius somewhere between 0 and 2 cm". It does not say that the radius is uniformly distributed. It just says that's all we know. So we are to assign a prior distribution that represents our ignorance.

  In Bayesian statistics, one often uses a non-informative prior. For a positive quantity that has a natural zero and no upper bound, we might use a prior proportional to 1/r (which is uniform on log r). But here we have an upper bound (2 cm). So that doesn't apply.

  Alternatively, we might use the principle of maximum entropy. But then we need to specify a constraint. The only constraint is that r is in [0,2]. The uniform distribution on [0,2] has maximum entropy among all continuous distributions on [0,2]? Actually, yes, for a fixed interval, the uniform distribution has maximum entropy. But note: we are free to choose the variable. We could also use the volume as the variable and then the uniform on volume would have maximum entropy for the volume. So again, we are back to the same ambiguity.

  Therefore, I conclude that there is no unique way to assign a prior in this state of total ignorance. The principle of indifference is not well-defined for continuous parameters without a clear choice of the variable.

  Thus, both Theo and Nadia have a point:

  - Theo is right that the problem directly gives the radius, so it is natural to use that. But he is wrong in claiming that it is "more basic" in an absolute sense because the volume is just as valid.

  - Nadia is right that the same set of marbles can be described by volume, and that there is no clear reason to privilege the radius. But she is wrong in suggesting that uniform on volume is the obvious choice.

  The Jaynes move: it is not clear that it rescues Theo's 79% because the problem does not have an obvious symmetry group that we can agree upon. Moreover, the problem fixes the scale by giving the interval [0,2] for the radius, so scale invariance might not be the right symmetry.

  Therefore, the answer to the deeper question is that Bertrand's paradox does show that the principle of indifference is not well-defined for continuous quantities without additional assumptions.

  So who came out ahead? Both made valid points, and both also made claims that are not entirely justified (Theo's "more basic", Nadia's dismissal of the Jaynes move without a clear counterargument). However, Nadia's point about the lack of a physical random process is important: if there is no physical random process, then we are only assigning a subjective prior, and it is arbitrary. But then again, the principle of indifference is a tool for assigning subjective priors in the absence of information.

  In conclusion, there is no overall winner. The brainteaser highlights the ambiguity of the principle of indifference in continuous spaces.

  Final note: in practice, if we were to design a physical experiment where marbles are produced with radii uniformly distributed in [0,2], then Theo's answer would be correct. But the problem does not specify such an experiment. It says "that's genuinely all you know". So without a physical process, we are in the realm of subjective probability.

  Thus, the answer is that there is no single correct probability. The assignment depends on the choice of the prior, and that choice is arbitrary.
answer: |-
  To address this brainteaser and the debate between Theo and Nadia, I'll break down each move step by step, highlighting who is correct on specific points, what both might be missing, and the deeper philosophical issue. The core problem is assigning a probability to "volume < half max volume" given only that the radius \(r\) is in \([0, 2]\) cm, using the principle of indifference. The volume of a sphere is \(V = \frac{4}{3}\pi r^3\), and max volume \(V_{\text{max}} = \frac{4}{3}\pi (2)^3 = \frac{32\pi}{3}\) cm³, so half max volume is \(V_{\text{half}} = \frac{16\pi}{3}\) cm³. This event is equivalent to \(r < \sqrt[3]{4} \approx 1.587\) cm.

  ### Step-by-Step Analysis of the Arguments
  1. **Theo's initial move (flat over radius, ~79%):**
     - **Theo's claim:** Apply indifference directly to radius since it's the given quantity. Uniform \(r\) on \([0, 2]\) gives \(P(r < \sqrt[3]{4}) = \sqrt[3]{4}/2 \approx 1.587/2 = 0.793\) (79%).
     - **Assessment:** This is mathematically consistent *if* radius is the correct variable for indifference. Theo is correct that radius is explicitly mentioned, making it a natural choice. However, he incorrectly assumes this is "obvious" without justifying why radius is privileged. **Verdict:** Valid calculation, but the premise (that radius is fundamental) is arbitrary without further support.

  2. **Nadia's counter (flat over volume, 50%):**
     - **Nadia's claim:** Indifference should apply to volume since the set of marbles can be described equivalently by volume. Uniform \(V\) on \([0, \frac{32\pi}{3}]\) gives \(P(V < \frac{16\pi}{3}) = (\frac{16\pi}{3}) / (\frac{32\pi}{3}) = 0.5\) (50%).
     - **Assessment:** Nadia is correct that the principle of indifference is sensitive to parameterization (radius vs. volume), and her calculation is valid if volume is the chosen variable. She rightly points out that Theo's choice is arbitrary because volume is an equally valid descriptor. **Verdict:** Strong challenge to Theo, highlighting the ambiguity in Bertrand-style paradoxes. However, she doesn't prove volume is "better"—just equivalent.

  3. **Theo's comeback (radius is "more basic"):**
     - **Theo's claim:** Radius is "more fundamental" because volume is defined in terms of it (\(V \propto r^3\)), so indifference attaches to radius.
     - **Assessment:** Theo's argument is weak. "Fundamental" is subjective:
       - In geometry, radius is often primary, but volume is physically salient (e.g., material cost).
       - Nadia's rebuttal (volume could be "fundamental") is valid: if you care about material, volume might be more natural.
       - **Both miss:** "Fundamental" depends on context. No objective criterion exists here. **Verdict:** Theo's defense is unpersuasive; Nadia successfully undermines it.

  4. **Theo's Jaynes invocation (symmetry rescue for ~79%):**
     - **Theo's claim:** Jaynes' method (invariance under rescalings) favors uniform radius, preserving ~79%.
     - **Assessment:** Theo misapplies Jaynes:
       - Jaynes resolves paradoxes by demanding invariance under transformations preserving symmetries (e.g., scaling or rotation).
       - Here, scaling symmetry (changing units) *is* relevant: if you rescale all lengths by \(a\), \(r \rightarrow ar\), and \(V \rightarrow a^3 V\).
       - Uniform radius *is* scale-invariant: \(P(r < k \cdot 2)\) is unchanged under rescaling (it depends only on \(k\)).
       - **But** uniform volume is *also* scale-invariant: \(P(V < k \cdot V_{\text{max}})\) depends only on \(k\). 
       - Thus, Jaynes doesn't uniquely select radius; both parameterizations satisfy scale invariance. Theo's claim that it "rescues" 79% is false. **Verdict:** Theo is incorrect—Jaynes doesn't break the tie.

  5. **Nadia's Jaynes rebuttal (no physical process, symmetry assumptions):**
     - **Nadia's claim:** Jaynes doesn't apply because (a) there's no physical random process (just ignorance), and (b) choosing symmetries requires external assumptions.
     - **Assessment:** Nadia is partially correct:
       - **(a)** Jaynes focuses on objective symmetries in physical setups. Here, there's no process—only subjective ignorance—so his method may not directly apply.
       - **(b)** She is right that symmetry choice (e.g., scaling vs. others) is an assumption. Why not rotational symmetry? (But rotation doesn't affect radius/volume, so it's irrelevant.)
       - **However**, Nadia overlooks that scale symmetry *is* natural here (units are arbitrary), and Jaynes *can* be adapted to ignorance. Still, it doesn't resolve the ambiguity. **Verdict:** Nadia fairly critiques Theo's overreach, but understates that scale invariance is plausible.

  6. **Surface area approach (63%):**
     - **Third housemate:** Uniform surface area \(A = 4\pi r^2\) on \([0, 16\pi]\) gives \(P(A < A_{\text{half}})\), where \(V_{\text{half}} \propto A_{\text{half}}^{3/2}\). Result: \(P \approx 63\%\).
     - **Assessment:** This reinforces the paradox—indifference over different valid variables (radius, volume, area) yields different probabilities (79%, 50%, 63%). **Verdict:** All are mathematically valid but mutually inconsistent.

  ### Key Points Each Missed
  - **Theo missed:** 
    - Volume is just as "fundamental" as radius in many contexts (e.g., physical properties).
    - Jaynes' invariance doesn't uniquely justify uniform radius; uniform volume also satisfies scale symmetry.
  - **Nadia missed:** 
    - Jaynes' method *could* be relevant for ignorance if scale symmetry is assumed (though it doesn't fix the problem).
    - The problem explicitly mentions radius, which gives it pragmatic weight (even if not ontological).
  - **Both missed:**
    - **No natural "geometry of ignorance":** For positive unbounded quantities (e.g., radius with no upper bound), a non-uniform prior (like \(1/r\)) is sometimes used. Here, the bounded interval \([0, 2]\) complicates this, and maximum entropy favors uniformity *for a chosen variable*—but variable choice remains arbitrary.
    - **The core paradox:** The event "volume < half max" depends on the cube of radius (\(r^3\)), so flatness in \(r\) concentrates probability toward larger volumes, while flatness in \(V\) spreads it evenly. Without a "correct" geometry for the possibility space, indifference is ill-defined.

  ### Deeper Question: Is There a Principled Way?
  Bertrand's paradox **shows that the principle of indifference is not well-defined for continuous quantities without additional assumptions**. Here's why:
  - **No privileged variable:** Radius, volume, and surface area are interdefinable (\(V \propto r^3\), \(A \propto r^2\)), but uniform density in one variable implies non-uniform density in others. The choice depends on which "parameterization" feels natural, but the problem provides no basis for privileging one.
  - **Jaynes doesn't save us:** Scale invariance produces multiple solutions (uniform \(r\) and uniform \(V\) both work), so it doesn't specify a unique prior. Other symmetries (e.g., translation) don't apply here.
  - **Subjectivity in ignorance:** In pure ignorance, probabilities are subjective. If you insist on indifference, you must arbitrarily choose a variable—but this choice affects the outcome. Real-world context (e.g., how marbles are manufactured) could justify one variable, but here there is none.

  ### Conclusion: Who Came Out Ahead?
  - **Nadia won the debate:** She correctly:
    - Exposed the arbitrariness in Theo's radius-first approach (50% vs. 79% is valid).
    - Challenged Theo's "fundamental" claim as circular.
    - Critiqued Theo's misapplication of Jaynes (scale invariance doesn't fix radius).
  - **Theo had partial merit:** 
    - Radius is explicitly given, making it a defensible default.
    - Jaynes *could* be invoked (scale invariance is reasonable), but it backfires (doesn't favor him).
  - **Overall:** Nadia's critique of indifference's ambiguity is stronger. The paradox stands, and no approach is "correct." 

  **Final takeaway:** In continuous spaces with total ignorance, the principle of indifference fails without external structure (e.g., physical process, natural variable). This is Bertrand's paradox in action—probability assignments require more than ignorance; they need a clear "measure" on the possibility space, which must come from elsewhere.
