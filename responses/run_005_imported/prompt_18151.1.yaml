  **Key Clarification on Kalai vs. Nash**:  
  Kalai-Smorodinsky beats Nash precisely because it **accounts for your friend's "mate advantage" through the ideal point**. While Nash only considers your fallbacks ($f$ and $0$), Kalai also considers maximum achievable payoffs if one partner concedes everything. Your friend's ideal point ($P$, since they could theoretically take all profit) is higher than yours ($P-f$, since they must get at least $f$). Kalai equalizes the *ratio* of gains (yours: $\frac{\text{your gain}}{P-f}$, friend's: $\frac{\text{friend's gain} - f}{P}$), giving your friend extra leverage for their stronger alternative. Nash ignores this, underweighting their advantage.
