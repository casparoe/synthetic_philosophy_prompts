  I'm a retired clinical epidemiologist, and now that I've got time on my hands I've been teaching myself philosophy of science. Hempel's raven paradox has been bugging me for weeks becasue the logic feels identical to an old dispute in my own field over whether case-control studies (where you sample on the outcome and look backward for exposure) give evidence just as good as cohort studies (where you sample on exposure and look forward for the outcome). Could you lay out the most important implications of the paradox for how much evidential weight a well-run case-control study can really claim, particularly when the outcome being studied is rare, and whether that should change how confident I am telling younger colleagues that the two designs are equally rigorous?
