  Hmm, the user's clearly done their homework—they even reference Nozick's desert water hole example. This isn't a surface-level question. They want to understand: (1) Why Locke needed that strong condition, (2) Why Nozick had to weaken it for his historical entitlement theory, and (3) Whether the weakened version actually prevents monopolies. 

  First, Locke's context: His "enough and as good" was a practical solution to the "tragedy of the commons." In 1690, with vast "unimproved" land, claiming a field by farming it didn't harm others because America's frontier still had identical alternatives. That river metaphor wasn't just poetic—it was literal. But today? With tech platforms controlling digital "land," that abundance feels mythical. 

  Nozick's dilemma hits me: If he kept Locke's strict condition, almost no modern property would be legitimate. Historical land grabs, patents, network effects—all fail the "as good" test. His weakened proviso ("don't make others worse off") is a band-aid. But as the user astutely notes, it can't handle monopoly scenarios. If a desert water-hole owner sells water at $1/gallon but later jacks prices to $1000 when alternatives vanish, Nozick would say "they're still better off than if you didn't own it!" That's... uncomfortable. 

  The user's buried question might be: "Is Nozick's theory a sneaky justification for tech oligarchs?" I should emphasize how his proviso bends to defend historical inequality—but also note that even Nozick worried about his own desert case. Maybe add that some neoclassical economists (Coase, Posner) later twisted this into "efficiency justifies everything." 

