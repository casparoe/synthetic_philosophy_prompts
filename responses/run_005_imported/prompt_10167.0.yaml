     - Score: 2. While it handles Paderewski pragmatically, the empty name case is a semantic disaster.

  4. **Hidden-indexical theory (Schiffer/Crimmins-Perry)**:
     - This theory posits that in addition to the referent, there is a hidden indexical element that refers to the mode of presentation. So, an utterance of "Hesperus is Phosphorus" expresses a proposition that includes the referent and the modes of presentation.
     - Paderewski: For "Paderewski is Paderewski", the two tokens might be associated with different modes of presentation, so the proposition expressed is that the individual presented under mode M1 is the same as the individual presented under mode M2. This explains the informativeness.
     - Empty names: If a name is empty, then the hidden indexical would still refer to a mode of presentation, but there is no referent. So the proposition might be incomplete or gappy. Alternatively, the theory might treat empty names as having a mode of presentation without an object. Crimmins and Perry have developed this with "notions" or mental files that can be empty.
     - Failure mode: The theory might overgenerate or become too complex. For example, in the Paderewski case, if the same mode of presentation is used twice, then the identity would be trivial, but the theory must explain why sometimes we use the same name with the same mode and sometimes with different. Also, for empty names, it might work, but the semantics becomes messy because the proposition expressed is not a standard Russellian proposition.
     - Score: 7. It handles both Paderewski and empty names by incorporating modes of presentation, but the hidden indexical element might be seen as ad hoc and not compositional.

  5. **Two-dimensional semantics (Jackson/Chalmers)**:
     - This approach distinguishes two intensions: primary (epistemic) and secondary (metaphysical). The primary intension captures the way reference is fixed in a scenario. 
     - Paderewski: The primary intension of "Paderewski" might be different in two contexts if the speaker associates different descriptions. So, "Paderewski is Paderewski" might have a primary intension that is not trivial because the two occurrences are associated with different reference-fixing descriptions. 
     - Empty names: For an empty name, the primary intension would be a descriptive condition that is not satisfied in any scenario. So, statements involving empty names can be evaluated at the level of primary intension.
     - Failure mode: The two-dimensional framework is controversial, and it might be accused of being a form of descriptivism in disguise. Kripke's arguments against descriptivism might apply to the primary intension as well. Also, for the Paderewski case, if the same name is used, why would the primary intension differ? The theory might say that the primary intension is context-dependent, but then it becomes similar to the hidden-indexical theory. Moreover, the framework is complex and might not be necessary.
     - Score: 6. It handles the cases by resorting to two levels of meaning, but the primary intension might not escape the problems of descriptivism.

  6. **Kit Fine's semantic relationism**:
     - Fine rejects the idea that meaning is compositional in the standard way. Instead, the semantic content of an expression can depend on the relations between occurrences in a sentence. So, in "Hesperus is Phosphorus", the two names have the same semantic value but they are presented in a way that the relation between them is different from the relation in "Hesperus is Hesperus".
     - Paderewski: In "Paderewski is Paderewski", the two occurrences might be coordinated or not. If they are not coordinated (because the speaker doesn't realize it's the same person), then the identity statement is informative. 
     - Empty names: This is tricky. If there is no referent, then the semantic value is missing, but the relation between occurrences might still be present. Fine has an account of empty names in terms of semantic relations between the occurrences. For example, in "Vulcan is Vulcan", the two occurrences are coordinated, so it is trivial, while in "Vulcan is Phlogiston", they are not, so it is informative. But without referents, the coordination is purely syntactic or mental.
     - Failure mode: The theory is non-standard and requires a radical departure from compositionality. It might be seen as too abstract and not grounded in psychology. Also, for empty names, it might work, but it is not clear how the coordination relation is established without referents.
     - Score: 8. It handles both Paderewski and empty names by appealing to coordination between occurrences, which is a unified solution. However, the framework is complex and not widely adopted.

  7. **Recanati's mental-files account**:
     - Mental files are cognitive structures that store information about objects. The sense of a name is the mental file associated with it. 
     - Paderewski: The speaker might have two mental files for Paderewski (one for the pianist, one for the statesman). So, "Paderewski is Paderewski" might involve two different files, and when the identity is discovered, the files are merged. 
     - Empty names: An empty name would correspond to a mental file that is not anchored to an object. So, we can have empty mental files. Statements involving empty names are then about the content of the file.
     - Failure mode: The account is psychological and not purely semantic. It might not provide a formal semantics for sentences. Also, the mental files are subjective, so it is hard to get an objective truth condition for statements involving empty names. For example, "Vulcan exists" is false, but if we are just talking about the mental file, it might be considered true in some sense.
