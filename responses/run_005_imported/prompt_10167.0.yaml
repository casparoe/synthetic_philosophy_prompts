  3. **Millian direct reference with pragmatic/psychological gloss (Salmon/Soames)**:
     - Millianism: The meaning of a name is just its referent. Identity statements are trivial if true. The informativeness is explained pragmatically: by the associated information that is not part of the semantic content.
     - Paderewski case: The same name has the same referent, so "Paderewski is Paderewski" is trivial. The explanation for why someone might not realize it is pragmatic: they associate different information with the two occurrences. 
     - Empty names: This is a big problem. If the meaning is the referent, then an empty name has no meaning. So, how can we even form a sentence with an empty name? Salmon and Soames might appeal to pretense or some pragmatic mechanism, but semantically, the sentence lacks content. This makes it hard to account for the informativeness of statements involving empty names (e.g., "Vulcan is a planet" vs. "Vulcan is a god").
