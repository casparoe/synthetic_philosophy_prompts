  I'm a linguistics PhD student (semantics/pragmatics side of things) currently auditing a philosophy of language seminar, and this week's unit is Frege's puzzle about identity statements -- why "Hesperus = Phosphorus" feels informative while "Hesperus = Hesperus" is trivial, even though both are true and, once you buy rigid designation, necessary. Half my seminar mates gave the "sense vs. reference, then Kripke refuted descriptivism, done" answer in discussion and the professor was clearly unimpressed -- she kept pushing us toward the harder generalizations of the puzzle: Kripke's own Paderewski case (one guy, one name, two "incarnations" living in the believer's head, so you don't even need two distinct coreferential terms to generate the problem), Frege-style cases for indexicals, and what happens to each theory once empty names (Vulcan, Santa Claus) get thrown in. I want to actually work out which solutions survive that and which ones just quietly rely on the easy planet example, so I'm turning to you instead of waiting for office hours.

