answer: |-
  You're absolutely **not** overreading the logic. Your instincts about this passage are sharp. Newton's argument here is far more radical and theologically loaded than a simple inductive inference from nature. It represents a core part of his highly unorthodox (and secret) theological system. Here's a breakdown:

  1.  **Dominion as the Defining Attribute:** Newton explicitly states that "Deity is the dominion," and "It is the dominion of a spiritual being which constitutes a God." This is a *functional* and *relational* definition, not an ontological one based on shared divine substance (like the Trinity doctrine he rejected). This is the heart of the matter.

  2.  **Godhood as a Matter of Degree:** Your point is spot on. The phrase "a true, **supreme**, or **imaginary** dominion makes a true, **supreme**, or **imaginary** God" explicitly introduces hierarchy and relativity into the concept of deity. There can be beings with *some* dominion (perhaps lesser spiritual beings, or even powerful humans worshipped by others) who could be called "gods" in an imaginary or lesser sense. The "supreme" God is distinguished by the *extent and nature* of His dominion, not by an absolute, shared divine essence. This directly undermines the Trinitarian concept of three co-equal, co-eternal Persons in one Godhead.

  3.  **The Linguistic Argument is Doctrinal, Not Empirical:** Your friend's "careful inductive scientist" argument doesn't hold water here. Newton's core point rests *not* on observing the universe, but on **semantic analysis of Biblical language usage** ("we say... we do not say...").
      *   He argues that titles like "Eternal," "Infinite," and "Perfect" are abstract attributes that *don't imply a relationship of lordship*. We don't call anyone "my Eternal."
      *   In contrast, "God" (equivalent to "Lord") *always* implies a relationship of dominion and servantship ("my God," "God of Israel"). This usage, Newton claims, *proves* that dominion is the core defining element of deity in the Biblical sense.
      *   **This isn't physics or induction; it's theology grounded in scriptural philology.** He's building his definition from the *words used in scripture*, not from planetary orbits.

  4.  **Why Bother? The Anti-Trinitarian Agenda:** This is precisely where the doctrinal work happens. Newton (a secret Arian) believed:
      *   God the Father is the *only* supreme, eternal, infinite, absolutely perfect Being with *absolute dominion*.
      *   Jesus Christ is the *Logos*, a created being, supremely exalted by the Father, acting as His vice-regent or mediator. Christ has immense power and authority ("dominion") *delegated* to him by the Father. He is "Lord," but *not* the supreme God in the absolute, ontological sense.
      *   The Holy Spirit is a divine force or emanation, not a distinct person co-equal with the Father.
      *   **By defining Godhood solely by dominion, Newton creates a framework where:**
          *   The Father is the *only* "true supreme God" because He possesses dominion inherently and absolutely.
          *   Christ can be called "God" or "Lord" *in a derivative sense* because he exercises immense dominion *given to him by the Father*. He is a "god" but *not* the Supreme God. He is the "Lord" *under* the Supreme Lord. This allows Newton to use Biblical language about Christ being God/Lord without accepting the Nicene doctrine of consubstantiality.
          *   The linguistic argument ("we say my God, not my Eternal") reinforces this: Christ is worshipped as "God" *because* he exercises dominion on the Father's behalf, not because he shares the Father's eternal, infinite substance.

  5.  **The "Neutral" Claim is Strategic:** Newton often claimed his science was neutral on theology. The General Scholium famously states "Hypotheses non fingo" (I frame no hypotheses). However, this passage *is* theology, carefully couched within a scientific work. Presenting God as the cosmic sovereign whose dominion is evident in the order of the universe *sounds* vaguely deistic or empirical. But the *specific definition of Godhood by dominion*, especially with the hierarchical language and the linguistic argument, is a Trojan horse for his heterodox Christology. He *needs* to ground his definition in something seemingly objective (like word usage or cosmic order) precisely *because* his actual beliefs were heretical and dangerous to state openly.

  **Conclusion:** You are correct. This passage is **not** primarily about inductive science. It is Newton deploying a carefully constructed **theological argument** based on linguistic analysis and a functional definition of deity (dominion) to **undermine the doctrine of the Trinity** and establish a hierarchical view of the divine, where the Father alone is the supreme God, and Christ, while immensely powerful and worthy of worship, is a subordinate being exercising delegated authority. The "my God vs. my Eternal" argument is the linchpin of this theological move, not an empirical observation. Newton is absolutely doing "doctrinal work" here, cleverly disguised within his discussion of the cosmic order. Your friend is underestimating the radical theological engine driving this specific part of the Scholium.
