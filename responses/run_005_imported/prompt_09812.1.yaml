answer: |-
  Your critique strikes at the deepest conceptual challenge for teleosemantics—the **indeterminacy problem of content fixation**. I'll argue that no further biological fact, including mechanistic details (à la Neander), can resolve this without smuggling in interpretive choices. Here's why:

  ### 1. **The Core Indeterminacy in Selective History**
     Teleosemantics defines content by *what a mechanism was selected for*. Yet as you note, selection operates on **fitness outcomes**, not representational content. The frog's ganglion cells were selected because their activation led to *successful feeding* (energy gain), not because they "detected flies" per se. This creates multiple equally valid descriptions of the selected function:
     - "Detecting flies" (specific prey)
     - "Detecting edible moving objects" (functional category)
     - "Detecting small, dark, erratically moving stimuli" (sensory profile)
     - "Detecting nutrition sources" (evolutionary goal)

     Selection history alone cannot privilege one description because:
     - **Fitness equivalence**: All these descriptions co-occur in the ancestral environment. Flies *were* the instantiation of "edible moving objects," so selection *for* feeding success is simultaneously selection *for* fly-detection *and* detection of the broader category.
     - **No causal granularity**: Natural selection sees only outcomes (e.g., "activation → tongue strike → energy intake"). It doesn't "see" whether the fitness boost came from representing *flies* vs. *nutritious moving things*—these are descriptions applied post hoc.

  ### 2. **Why Mechanistic Fine Structure Fails (Against Neander)**
     Karen Neander’s solution argues that content is fixed by **the specific properties that caused the mechanism’s response *during selection events***. For the frog, if selection honed the ganglion cells to respond to *fly-like motion profiles*, then "fly" is the content. But this collapses:
     - **The abstraction problem**: The mechanism responds to *motion patterns* (e.g., small size, erratic movement, dark contrast). Is the content "fly" (a biological kind) or "erratic motion" (a physical property)? Both caused selection, and teleosemantics lacks criteria to choose.
     - **Input vs. output indeterminacy**: 
       - *Input side*: The cells respond to BB pellets. If we say "flies" are the content because pellets weren’t ancestral, we’re invoking counterfactuals (*absent* in selection history).
       - *Output side*: Selection acts on the *behavior* (tongue strike), not the neural state. The behavior is *eating*, so why isn’t the content "edible thing" rather than "fly"?

     **Example**: Suppose we examine the retinal circuitry and find it’s tuned to 5mm dark objects moving at 10 cm/s. Does this mean the content is:
     - "5mm dark object"?
     - "Object moving at 10 cm/s"?
     - "Fly" (since flies *are* 5mm dark objects moving at 10 cm/s in the frog’s niche)?

     The mechanism’s structure doesn’t decide this—it only shows *how* the cell filters inputs, not *what* it represents.

  ### 3. **The Selection-for/Selection-of Distinction Applied to Content**
     Your analogy to genetic hitchhiking is apt. Consider:
     - **Selection *for***: The property directly causing fitness advantage (e.g., detecting *nutritive targets*).
     - **Selection *of***: Correlates that hitchhike (e.g., detecting flies, detecting dark moving specks).

     In teleosemantics, all these are "selected" simultaneously. Crucially:
     - **No privileged causal level**: Is the fitness-bestowing property "fly-ness," "nutrition," or "motion signature"? Biology identifies all three as co-extensive *in the past*. Teleosemantics cannot isolate one as "the" content without arbitrary prioritization.
     - **The interpreter’s dilemma**: Choosing among "fly," "prey," or "moving speck" depends on whether we emphasize:
       - *Stimulus properties* (neuroethological lens)
       - *Ecological role* (behavioral lens)
       - *Metabolic outcome* (evolutionary lens)
       Biology doesn’t dictate which lens is "correct."

  ### 4. **Why Counterfactuals and Historical Accidents Don’t Resolve It**
     Proponents might argue: "If BB pellets existed ancestrally, frogs wouldn’t have been selected to snap at them." But:
     - Selection history only includes *actual* events, not counterfactuals. We can’t appeal to "what would have been selected" without leaving strict historical facts.
     - **The qua problem**: *Why* were frogs selected to respond to flies? Was it because flies are flies, or because they’re nutritious? Both are true, and teleosemantics lacks resources to break the symmetry.

  ### Conclusion: The Ineliminable Role of the Interpreter
  Teleosemantics promises to ground content in objective biology, but **indeterminacy persists at every level**:
  - **Functional indeterminacy**: Selection operates on outcomes, not representations.
  - **Mechanistic indeterminacy**: Neural wiring specifies *causal dispositions*, not semantic content.
  - **Descriptive relativity**: "Fly," "prey," and "moving speck" are *true but partial descriptions* of the same selective history.

  To fix content, teleosemanticists must covertly choose a description based on *explanatory interests* (e.g., "fly" for neuroethology, "nutritive object" for behavioral ecology). This is not a biological fact but an **interpretive stance**. As you intuit, teleosemantics doesn’t solve the hard problem of content; it relocates it from the mind of the frog to the mind of the theorist. Until it can specify why selection privileges *one* description over co-extensive rivals without ad hoc constraints, it remains a powerful but incomplete tool—one that reveals why evolution alone may not suffice to naturalize intentionality.
