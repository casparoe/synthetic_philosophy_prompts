answer: |-
  Here’s a rigorously structured argument against Nozick’s split, designed for your novelist’s purpose—complete with conceptual depth, anticipated defenses, and dramatic potential for your dinner-table clash:

  ### **Core Argument: The Incoherence of Asymmetric Moral Treatment**
  The fundamental flaw in Nozick’s proposal is that it **arbitrarily denies to animals the very moral protections his own framework demands for humans**, while simultaneously failing to resolve conflicts between the two systems. This incoherence manifests in three dimensions:

  ---

  ### **1. The Internal Contradiction: Nozick’s Own Principles Undermine the Split**
     - **Nozick’s Rejection of Utilitarianism for Humans**: He argues that utilitarianism permits unacceptable violations of individual rights (e.g., sacrificing one person to save five) because it treats persons as mere *receptacles* of value, not inviolable ends-in-themselves. The "utility monster" thought experiment epitomizes this: a being whose utility gains are so vast that maximizing aggregate utility justifies immense suffering to others.
     - **The Animal Utility Monster Problem**: 
       - If animal interests are purely aggregable, we create *countless real-world utility monsters*: humans whose trivial pleasures (e.g., gustatory preferences) outweigh vast animal suffering (e.g., factory farming). A single steak dinner might "net" positive utility by aggregating millions of animal pain-units against a human’s mild pleasure—a conclusion Nozick would reject *instantly* if the victims were human.
       - **Defense Anticipated**: "But animals lack rationality/moral agency!" → **Rebuttal**: Nozick grounds rights in *being a person* (a "moral end"), not contingent capacities. His utility monster objection targets *structural unfairness in aggregation*, not the victim’s cognitive traits. If aggregating utilities is inherently violative, it’s violative *regardless of the victim’s species*.

  ---

  ### **2. The Boundary Problem: No Threshold Justifies the Split**
     - **The Arbitrary Line-Drawing**: Nozick ties rights to "personhood" (rationality, self-awareness, etc.), but this boundary:
       - **Excludes Many Humans**: Infants, severe cognitively disabled humans, dementia patients—beings Nozick *would* grant rights to, but who lack his criteria for personhood.
       - **Includes Many Animals**: Elephants, cetaceans, primates, and even pigs/dogs exhibit self-awareness, empathy, and future planning—traits overlapping with "marginal" humans.
     - **Defense Anticipated**: "Rights apply to all *Homo sapiens*!" → **Rebuttal**: 
       - This is naked speciesism—biologically arbitrary, akin to racism. If a chimpanzee has richer inner life than a human anencephalic infant, privileging the infant *solely* due to DNA is ethically indefensible.
       - Nozick’s *own* framework requires a *moral*, not biological, justification for rights. If rights arise from intrinsic value ("separateness of persons"), that value must track morally relevant properties (e.g., sentience, interests), not taxonomy.

  ---

  ### **3. The Interaction Problem: Nozick’s Unresolved Tension is Fatal**
     - **Conflicts Are Inevitable & Systemically Biased**: Every real-world action affecting both humans and animals forces ad hoc choices:
       - *Example: Animal Testing*: A Kantian side constraint forbids using a human as a mere means (e.g., lethal testing without consent). But under the split, animal suffering is aggregated: if 1,000 mice suffering "nets" positive utility by enabling a human drug, the action is permitted. 
       - **Why This Matters**: The split *always* sacrifices animals to human interests because human constraints "trump" animal utilities. This is not a neutral framework—it’s human supremacy disguised as moral theory.
     - **Defense Anticipated**: "We must prioritize persons!" → **Rebuttal**: 
       - This smuggles in unexamined anthropocentrism. If animal interests are morally considerable *at all* (as Nozick concedes), why do human interests *always* override? Either animals have no moral weight (which Nozick denies) or we need a non-arbitrary hierarchy. The split provides neither.
       - **Dramatic Punch**: "Your 'side constraint' for humans is absolute—yet mine is *literally* skin-deep. You’d condemn testing on a comatose human as violative, but testing on a more aware pig is mere 'utility calculus.' That’s not ethics—it’s tribalism."

  ---

  ### **The Strongest Counter-Defense & Its Collapse**
     - **The Reciprocity Gambit**: "Rights arise from social contracts among rational agents. Animals cannot participate, so they get no rights—only aggregated welfare."
       - **Rebuttal**:
         1. This excludes non-participating humans (infants, disabled), reducing rights to a club for the cognitively privileged.
         2. Nozick *explicitly rejects contractarianism* as the basis for rights! His side constraints bind us *even toward hermits* because they protect intrinsic value, not reciprocal advantage.
         3. **Key Insight**: If rights are about *being wronged*, not *negotiating*, then the capacity to be wronged (sentience/suffering) is what matters—not the capacity to negotiate contracts.

  ---

  ### **Dialogue-Worthy Conclusion for Your Lawyer**
  *"You invoke Nozick to sanctify human inviolability—yet when he flinches at his own animal-utilitarianism, you look away. Why? Because you know his utility monster isn’t hypothetical: it’s* us*. We are the monsters who demand that trillions of animal pains aggregate into our minor conveniences. You condemn sacrificing one human to save five—but when a thousand pigs scream in gestation crates so you can enjoy a bacon sandwich, you call it ‘economics.’ Either Nozick’s horror at aggregation applies to all beings who can suffer, or his side constraints are just a circle drawn around our own interests. And circles drawn that small are called* cages*."*

  ---

  ### **Why This Works for Your Scene**
  - **Rigorous**: Engages Nozick’s core principles (side constraints, utility monster) to expose internal contradictions.
  - **Dramatic**: Creates moral high ground for the lawyer—she’s defending Nozick’s *own* logic against his inconsistency.
  - **Adaptable**: Concepts like "animal utility monsters" or "tribalism vs. ethics" translate naturally to heated dialogue.
  - **Unsettling**: Forces the economist to confront that his position requires either abandoning Nozick’s anti-utilitarianism *or* embracing indefensible arbitrariness.

  This approach avoids "marginal cases" as a standalone argument, instead embedding it within a larger critique of Nozick’s framework—making the economist’s discomfort visceral and philosophically damning.
