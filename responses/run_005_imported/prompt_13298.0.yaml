  ### Memorandum  
  **To:** Academic Integrity Board Members  
  **From:** Chair, Academic Integrity Board  
  **Subject:** Investigation Strategy for Exam Leak Case – Decision and Rationale  
  **Date:** October 26, 2023  

  #### **Background and Core Issue**  
  We face a time-sensitive decision in the case of 300 students across four exam groups: Morning-1 (M1), Morning-2 (M2), Evening-1 (E1), and Evening-2 (E2). Initially, each group had a 25% prior probability of being the source of the leaked exam answer. A proctor provided one critical piece of evidence: **if the leak originated in the evening, it is ~4 times more likely to have come from E2 than E1.** She offered no information about the morning groups or the morning/evening split.  

  The board is split on how to update our probabilities:  
  - **Majority view (local update):** Keep the morning/evening probability at 50/50, and only update the room probabilities within the evening (E1: 10%, E2: 40%).  
  - **Priya’s view (global update):** Update all probabilities coherently using Bayesian principles, which shifts the morning/evening split and changes the prioritization.  

  After rigorous debate, we adopt the **local update** (majority view). We will focus investigative resources **first and foremost on Evening-2 (E2)**, followed by Morning-1 (M1) and Morning-2 (M2) if bandwidth allows. Below, I outline the reasoning, mathematical justification, and investigative plan.  

  ---

  ### **I. Why the Local Update is Correct**  
  #### **Key Principle: Evidence Specificity**  
  The proctor’s evidence **only directly conditions on the evening sitting**. It provides no information about:  
  - Whether the leak is more likely in morning vs. evening.  
  - The relative likelihood of the morning rooms (M1 vs. M2).  

  Mathematically, the evidence is a conditional probability:  
  - \( P(\text{E2} \mid \text{Evening}) = 4 \times P(\text{E1} \mid \text{Evening}) \).  
  - This implies \( P(\text{E1} \mid \text{Evening}) = 20\% \), \( P(\text{E2} \mid \text{Evening}) = 80\% \).  

  The local update respects this specificity:  
  - Morning/evening prior (50/50) remains unchanged.  
  - Within evening, probabilities shift to E1 (10%) and E2 (40%).  
  - Morning groups stay at 25% each (no new information).  

  #### **Why Priya’s Global Update is Flawed**  
  Priya argues for a full Bayesian update, which would:  
  - Reduce morning probability (from 50% to ~44%).  
  - Increase evening probability (from 50% to ~56%).  
  - Further elevate E2 (to ~45%).  

  **The strongest argument for Priya’s view:** If we treat the proctor’s evidence as a "likelihood" that applies to all scenarios (including morning), we *must* update everything to avoid incoherence. For example:  
  - Assume likelihood ratios: \( P(\text{Evidence} \mid \text{E2}) : P(\text{Evidence} \mid \text{E1}) = 4:1 \).  
  - For morning groups, assume \( P(\text{Evidence} \mid \text{M1}) = P(\text{Evidence} \mid \text{M2}) = 1 \) (uninformative).  
  - This forces a posterior shift toward evening.  

  **Why we reject this:**  
  1. **The evidence is explicitly conditional on evening.** The proctor’s statement ("if evening...") has no logical bearing on the morning. Forcing likelihoods onto morning scenarios injects assumptions where none exist.  
  2. **No justification for morning likelihoods.** Assigning \( P(\text{Evidence} \mid \text{Morning}) = 1 \) is arbitrary. If the leak was in the morning, the proctor might have said nothing about evening rooms, making \( P(\text{Evidence} \mid \text{Morning}) \) near zero. But we lack data to specify this.  
  3. **Ockham’s Razor:** The local update is simpler and does not overextend the evidence. It updates only what the information directly addresses.  

  #### **Probability Breakdown**  
  | Group    | Prior | Local Update (Posterior) | Global Update (Posterior) |  
  |----------|-------|---------------------------|---------------------------|  
  | **M1**   | 25%   | 25%                       | ~22%                     |  
  | **M2**   | 25%   | 25%                       | ~22%                     |  
  | **E1**   | 25%   | 10%                       | ~11%                     |  
  | **E2**   | 25%   | 40%                       | ~45%                     |  
  | *Morning* | 50%   | 50%                       | ~44%                     |  
  | *Evening* | 50%   | 50%                       | ~56%                     |  

  ---

  ### **II. Investigative Plan: Prioritizing E2**  
  Given our Friday deadline and resource constraints, we must act decisively to minimize unnecessary holds on innocent students. We will:  
  1. **Focus 70% of resources on E2 (Evening-2).**  
     - E2 has the highest probability (40%) and is 4× more likely than E1.  
     - Actions: Swipe-log analysis, TA interviews, handwriting comparison for all E2 students.  
  2. **Allocate 30% to morning groups (M1 and M2).**  
     - Each has 25% probability. Investigate M1 and M2 in parallel with lighter-touch methods (e.g., spot-checking alibis, cross-referencing swipe logs).  
  3. **De-prioritize E1 (Evening-1).**  
     - Lowest probability (10%). Only investigate if E2/morning findings are inconclusive.  

  #### **Why This Allocation?**  
  - **Cost of error:** A hold on a group delays grades for innocent students. Focusing on E2 first minimizes the risk of imposing holds on large groups (E1, M1, or M2) prematurely.  
  - **Efficiency:** E2 is the best signal-to-noise candidate. If the leak is there (40% chance), we resolve the case quickly. If not, we preserve bandwidth for morning groups.  
  - **Fallback:** If E2 clears, we escalate morning investigations and reallocate resources.  

  ---

  ### **III. Counterargument: Priya’s Case for Global Update**  
  Priya’s concern deserves acknowledgment: **If the proctor’s evidence implicitly makes the evening more probable, ignoring this could miss a ~5–6% investigative advantage.** In her model:  
  - E2’s probability rises to 45%, making it even stronger as a first target.  
  - Morning groups drop to 22% each, reducing their urgency.  

  **Why we disagree:**  
  - The global update’s shift hinges on arbitrary likelihood assignments for the morning. Without evidence about how the proctor would act if the leak was in the morning, this introduces uncontrolled assumptions.  
  - In real-world terms, the proctor came forward *because* she observed evening irregularities. If the leak was in the morning, her statement about evening rooms becomes speculative—not a reliable likelihood.  
  - The 5–6% difference does not outweigh the robustness of the local update.  

  ---

  ### **IV. Conclusion and Next Steps**  
  We adopt the **local update**, prioritizing **E2 (Evening-2)** as the primary target. Morning groups (M1 and M2) will be investigated secondarily, and E1 deprioritized. This approach:  
  - Respects the evidence’s specificity.  
  - Minimizes unnecessary holds on innocent students.  
  - Maximizes efficiency given resource constraints.  

  **Actions:**  
  - Investigative team begins E2 audits immediately.  
  - Morning group checks start by October 27.  
  - Final decision by October 28.  

  I thank Priya for her rigorous analysis, which strengthened our scrutiny of this edge case. While we diverge on methodology, her insights ensure we did not overlook subtleties.  

  Signed,  
  Chair, Academic Integrity Board
