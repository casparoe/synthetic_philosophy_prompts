answer: |-
  You've perfectly described why the "first and final" anchoring tactic backfired spectacularly in this situation. **The strategy itself wasn't necessarily wrong *in isolation*, but both of you using it simultaneously against each other *was* fundamentally doomed to create this exact deadlock.** Here's the breakdown:

  1.  **The Theory of Anchoring (Why it *Seems* Smart):**
      *   The idea is that the first serious number put on the table ("the anchor") psychologically influences the entire negotiation. People tend to adjust *from* that starting point, giving the first mover an advantage.
      *   Declaring it "final" adds pressure, signaling you won't budge, hoping the other side capitulates to avoid conflict or cost.

  2.  **Why It Failed Catastrophically When Both Did It:**
      *   **Mutual Assured Stalemate:** You both set rigid anchors simultaneously. Neither anchor can influence the other because they were presented as non-negotiable endpoints *at the same time*. There's no "starting point" to adjust *from*; there are just two conflicting endpoints.
      *   **Loss of Face & Sunk Cost Fallacy:** Backing down now feels like a personal defeat ("I lost, he won") and a waste of the legal fees already incurred ("We've spent this much, we can't give in now!"). Pride and the desire not to feel foolish become bigger drivers than the actual estate value.
      *   **Adversarial Framing:** The tactic inherently frames the negotiation as a zero-sum battle ("I win, you lose"). This destroys any potential for collaboration or finding mutually beneficial solutions. It pits you directly against each other.
      *   **Ignored Relationship Dynamics:** Estate divisions between siblings are emotionally charged. Tactics designed for purely commercial transactions often fail because they damage the underlying relationship, making compromise feel even harder.
      *   **The "Final" Trap:** Declaring a position "final" too early removes flexibility. When circumstances change (like realizing the other side also anchored), you're painted into a corner. True final offers are usually made *after* significant negotiation, not as an opening gambit.
      *   **The Real Winner: The Lawyers:** As you're experiencing, the only guaranteed outcome so far is escalating legal bills for both sides. The professionals win, the siblings lose.

  **Did You "Play it Right"?**

  *   **Tactically (based on flawed advice):** You executed the tactic you were given. In a vacuum against a less prepared opponent, it *might* have worked.
  *   **Strategically & Relationally:** No, it backfired. The advice failed to account for the high likelihood your brother would receive similar counsel (especially given his fiancée's profession) and the unique emotional dynamics of a sibling estate division. The goal should be a *fair and efficient resolution*, not "having the upper hand."

  **Is He Just Being Stubborn?**

  He's likely feeling *exactly* the same way you are: trapped by his own "final" number, afraid of losing face, frustrated by the mounting costs, and probably thinking *you're* the one being stubborn. His stubbornness mirrors yours – it's a symptom of the mutually destructive tactic, not necessarily his inherent character in this context.

  **What Now? Breaking the Deadlock:**

  The current path is lose-lose. You need a circuit breaker:

  1.  **Acknowledge the Mistake (to yourself & potentially him):** Recognize that the "first and final" tactic colliding created this mess. Let go of the idea that sticking to your number proves you "played it right." Winning the tactic battle means losing the war (money and relationship).
  2.  **Shift the Framing:** Propose moving away from battle lines. Frame it as: *"Look, this 'final number' standoff is costing us both a fortune in legal fees and stress, and Mom wouldn't want this. How can we find a solution that's fair and stops the bleeding?"*
  3.  **Embrace Mediation (Seriously Consider It):**
      *   **This is the key.** A professional mediator is *not* a judge. They are a neutral facilitator skilled in breaking deadlocks, especially in emotionally charged family disputes.
      *   They help you:
          *   Communicate effectively without lawyers drafting every word (reducing costs!).
          *   Identify underlying interests (beyond just the dollar amount – fairness, recognition, future relationship, Mom's wishes).
          *   Generate creative options you haven't considered.
          *   Find a mutually acceptable solution that lets *both* of you save face. They help reframe compromise as a joint victory over the problem, not a defeat by the other sibling.
      *   **Propose it directly:** "Instead of our lawyers billing us hourly to argue, let's split the cost of a professional mediator for a day or two. It will be cheaper than another month of legal fees, and they're experts at helping people like us find solutions."
  4.  **Focus on Shared Interests:** Remind yourselves (and each other):
      *   You both want this resolved.
      *   You both want a fair share.
      *   You both want to minimize legal fees eating into the estate.
      *   You both (presumably) care about your relationship long-term.
      *   You both care about your mother and likely don't want her stressed by this.
  5.  **Be the First to Bend (Strategically):** You don't have to abandon your position entirely, but signal flexibility. *"My number was my starting point, but given the costs and the standoff, I'm open to discussing other options to find common ground, maybe with help."* This doesn't mean surrender; it means opening the door to negotiation that should have happened *before* final offers.

  **Stop viewing this through the lens of "who played the tactic right."** That tactic failed both of you. The "right" move now is to recognize the trap you're both in and take collaborative steps to escape it before the estate is significantly diminished by fees and the relationship is permanently damaged. Mediation is the most practical and effective tool for that.
