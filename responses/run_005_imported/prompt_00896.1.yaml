  First, I need to recall the key facts about Ayer. He was a staunch logical positivist, famous for the verification principle. His whole philosophy dismissed metaphysical claims as meaningless unless empirically verifiable. The afterlife would fall into that category. So his prior stance was clear: no evidence for life after death, thus it's improbable.

  Then there's the 1988 incident. He had a cardiac arrest, was revived, and wrote about it. His exact words were that the experience "slightly weakened" his conviction that death is the end, but he still hoped it was. The user interprets this as Ayer treating his NDE as empirical evidence against his previous view. 

