  Marcus defends a pure naturalist (Boorsean) theory, while Elena highlights its inability to handle aging without implicit normativity. Their impasse stems from Boorse's well-known difficulty with universal age-related conditions. A recognized resolution exists in **hybrid theories of disease**:

  1. **Amundson's Critique + Schramme's Hybrid Model:**  
