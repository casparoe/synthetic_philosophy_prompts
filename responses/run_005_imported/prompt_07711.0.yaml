     - Presbycusis involves biological dysfunction (cochlear degeneration ≠ "normal function" even statistically).
     - It causes harm (social isolation, safety risks).
     - Thus, it qualifies as disease *despite* being age-typical.

  2. **Wakefield's Harmful Dysfunction:**  
     Jerome Wakefield's influential hybrid theory similarly requires both evolutionary dysfunction *and* harm. For aging, we might:
     - Define dysfunction causally (Cummins-style, as Marcus suggested).
     - Explicitly incorporate harm (Elena's concern about values).
