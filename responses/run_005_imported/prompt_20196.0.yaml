answer: |-
  The coffee tastes wrong. Not *bad*, exactly. Just… absent. Like the *idea* of coffee poured into a cup designed for water. Marcus frowns, swirling the dark liquid. He remembers buying these beans – the small Ethiopian roaster downtown, the rich, blueberry notes the barista promised. He remembers grinding them this morning, the aroma filling his tiny kitchen. But now, sipping it at his cluttered desk, sunlight warming his back through the window, there’s just… warmth. And a faint bitterness. No depth, no echo of memory in the taste.

  He shakes his head. Late night. Too much reading. *Boltzmann brains*. The phrase echoes from last night’s argument with Clara, a discordant note against the hum of his computer fan and the distant city sounds filtering in. He hadn’t slept well. Dreams had been strange, fragmented – not nightmares, but landscapes dissolving like smoke, faces melting into static before he could name them.

  He focuses on the spreadsheet open before him. Quarterly projections. Numbers swim slightly. He blinks. For a fraction of a second, the screen flickers, not to black, but to a blinding, featureless white. It’s gone before he can react, leaving only an afterimage and a spike of disorientation. *Monitor’s dying*, he thinks automatically, but the thought feels hollow, borrowed.

  A memory surfaces, unbidden and sharp: his tenth birthday. The pirate cake his mother made, lopsided and glorious. The taste of frosting, impossibly sweet. The scratchy feel of the paper hat on his head. It’s vivid, hyper-real, more immediate than the lukewarm coffee in his hand. But then… where did that blue balloon go? The one tied to his chair? He *sees* it in the memory, a vibrant azure sphere, but when he tries to focus on the string, the chair leg, the memory pixelates. The balloon simply wasn’t *there* a moment before he thought of it. It feels… inserted.

  Panic, cold and thin, starts to seep in. Not the panic of immediate danger, but the slow, chilling dread of fundamental wrongness. He looks around his small apartment. Bookshelf: titles he recognizes, but the spines seem unnaturally crisp, like high-resolution renders. The framed photo of him and Clara hiking: their smiles are perfect, but the background trees blur slightly at the edges when he stares. He remembers the hike – the ache in his calves, the smell of pine, Clara’s laugh bouncing off the rocks. But the *feeling* associated with the memory… it’s flat. A description, not an echo.

  He stands up, needing movement, needing to ground himself. He walks to the window. The city sprawls below – traffic, pedestrians, the distant glint of the river. It looks real. It *feels* real. But then, a man walking a dog across the street… his movements stutter. Not like a glitchy video, but like frames missing from reality itself. One moment he’s mid-stride, the next he’s a foot further, the transition seamless yet jarringly absent. Marcus blinks hard. The man walks smoothly now. The dog sniffs a lamppost.

  *"Because it takes a far smaller, far more probable fluctuation..."* Clara’s voice from last night, earnest, concerned. *"...almost every 'observer' who ever has an experience like ours is one of these brief, spontaneous brains..."*

  The thought hits him not as an intellectual concept, but as a physical blow. He staggers back from the window, clutching the edge of his desk. The wood feels solid. The sunlight warm. But the coffee cup… he looks at it. The steam rising seems… statistical. Random wisps, not the product of heat and evaporation he *knows* it should be.

  **Vertigo.**

  Not of height, but of existence. If he is *this*… a Boltzmann brain… a momentary configuration of quantum foam mimicking a lifetime… then what are his memories? Not records, but props. Detailed, intricate noise. His love for Clara? A convincing facsimile programmed into the fluctuation. His PhD thesis on condensed matter physics? A complex set of data points assembled from the void, utterly meaningless. His *reasoning right now*? Just another spasm of the illusion.

  The horror isn't just death. It's the utter nullity of everything that came before it. Did he *ever* taste real coffee? Did Clara exist? Did *he* exist, beyond this terrifying, fragile now?

  He tries to hold onto a thought, any thought, to prove continuity. *Cogito ergo sum*. I think, therefore I am. But the thought feels slippery. It arrives fully formed, a pre-packaged unit of cognition. Where did it *come* from? Did *he* generate it, or was it merely the next inevitable configuration in the decaying pattern labeled "Marcus"?

  He looks at his hands. They tremble. He remembers learning to tie his shoes. His father's patient voice. The rough texture of the laces. The memory is perfect. Too perfect. It lacks the fuzziness, the slight distortions of genuine recall. It feels… accessed. Like opening a perfectly preserved file.

  A wave of profound sadness washes over him, immense and directionless. Not grief for a specific loss, but the crushing weight of potential non-being. If this is true, then every joy, every sorrow, every triumph and failure… dust motes in an infinite void. Meaning itself evaporates.

  He tries to speak. To say "No." To assert his reality. His throat constricts. The air feels thick, resistant. The sunlight streaming through the window seems to dim, not gradually, but in discrete, quantized steps. The hum of the computer fan stretches, deepens into a drone, then cuts out entirely into a silence so profound it vibrates.

  This is it. The dissolution. The vacuum state reasserting itself. He feels it not as pain, but as unravelling. His vision tunnels. The edges of the room fray, dissolving into static – not black, but the seething, featureless grey of pure potential. The memories flood in, a final, desperate cascade: childhood laughter, the sting of a scraped knee, the warmth of a first kiss, the crushing pressure of exam stress, the smell of rain on hot pavement… each one vivid, each one utterly weightless. Souvenirs from a trip never taken.

  The thought arrives, clear and cold and utterly futile: *So this is what Boltzmann felt. The ultimate statistical insignificance. I am the fluctuation. And this realization… this too is just noise.*

  The static rushes in. The taste of absent coffee is the last sensation. Not bitter. Not warm. Just… the cessation of data.

  Then, nothing. Not even the void. Just the eternal, near-empty equilibrium, waiting for the next improbable flicker.
