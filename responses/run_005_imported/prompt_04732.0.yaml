  ### Explanation of Ranking:
  1. **Superdeterminism (Rank 1)**: Preserves strict locality by sacrificing statistical independence. Measurement settings and hidden variables are predetermined, avoiding nonlocal signals.
  2. **Many-Worlds (Rank 2)**: Maintains locality via unitary evolution (no collapse). Sacrifices realism for a single outcome by allowing all possibilities to exist in parallel branches.
  3. **QBism (Rank 3)**: Avoids nonlocality by treating quantum correlations as Bayesian updates. Gives up objective reality, making quantum states agent-dependent beliefs.
  4. **Retrocausal (Rank 4)**: Preserves spatial locality but sacrifices causal time-symmetry (e.g., future-past "handshakes" replace spatial nonlocality with temporal non-separability).
  5. **GRW (Rank 5)**: Sacrifices locality via spontaneous nonlocal collapses. While collapse is dynamical, it affects entangled systems instantaneously.
  6. **Copenhagen (Rank 6)**: Explicitly nonlocal due to wave function collapse. Also sacrifices realism (indefinite properties pre-measurement).
  7. **Bohmian mechanics (Rank 7)**: Maximally flagrant nonlocality. Explicitly requires instantaneous configuration-space guidance, violating relativistic locality.
