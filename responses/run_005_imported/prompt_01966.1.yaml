  Next, Person B claims kin and multilevel selection are mathematically equivalent. The Price equation shows that the total change can be split into components, meaning kin selection parameters can map onto group selection terms. Person A accepts this but argues that equivalence means group selection doesn't "vindicate" old theorists. Here, Person B is right about equivalence, but Person A has a point about not overstating the vindication.

