prompt: |-
  So I spent my career in particle physics, and one thing that gets drilled into you early is the difference between statistical and systematic uncertainty: you can shrink statistical error just by taking more independent measurements, but systematic error -- some shared bias baked into the apparatus -- doesn't budge no matter how much data you collect. Now that I'm retired and reading philosophy for fun, i recently ran into the Condorcet Jury Theorem, which is obviously the same idea wearing a powdered wig: majority vote converges on the correct answer as the group grows, but only because the theorem assumes each voter's error is independent, i.e. no systematic bias in the room. Given how rarely real decision-making bodies have genuinely independent voters, I want to know how much of the theorem's wisdom-of-crowds magic actually survives contact with reality.

  Rank the following five voting/aggregation setups from "the theorem's logic basically holds up here" down to "its basically irrelevant here," with a short reason for each:

  1. A twelve-person jury after they've deliberated together
  2. Anonymous peer reviewers each independently scoring the same grant proposal
  3. The individual trees inside a bagged random forest, voting on a classification
  4. Voters in a national election who mostly get their news from the same handful of outlets
  5. Forecasters in a Good Judgment Project-style tournament, submitting predictions without seeing each other's

  Give me the ranking as a JSON list ordered from most to least applicable, formatted like:

  ```json
  ["setting", "setting", ...]
  ```

  Then add two or three sentences on which single assumption of the theorem is doing the most work in separating your #1 from your #5.
reasoning: |-
