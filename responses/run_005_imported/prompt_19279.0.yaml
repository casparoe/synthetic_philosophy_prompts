answer: |-
  That's an incredibly insightful question about a profoundly difficult situation. You've grasped the core tension brilliantly. Let's break down Strawson's distinction and apply it to your dad's case step-by-step.

  **1. Strawson's Core Project: Defending Our Natural Reactions**

  *   **The Pessimist:** Argues that if determinism is true (no "libertarian free will"), then resentment, indignation, gratitude, etc., ("reactive attitudes") are *irrational* and *unjustified*. Why? Because if people couldn't have done otherwise, blaming or praising them makes no sense.
  *   **Strawson's Goal:** To show that our reactive attitudes are **not** fundamentally dependent on believing in some metaphysical contra-causal free will. Instead, they are **essential parts of human social life**, woven into the fabric of our relationships and expectations of each other as participants in a shared moral community.

  **2. The Crucial Distinction: Excuse vs. Exemption**

  This is where your confusion hits the nail on the head. Both seem to point to "brain not working right," but Strawson draws a vital line:

  *   **"He didn't mean it" (Excuse):**
      *   **What it does:** *Explains* the harmful action *within the normal framework* of interpersonal relationships and moral responsibility.
      *   **Underlying logic:** The person *is still a participant* in the moral community. They *understood* the expectations, *intended* something else (or nothing harmful), and their action was a *deviation* from their normal participation due to a specific, often external, cause.
      *   **Effect on reactive attitudes:** It *modifies* or *tempers* the reactive attitude (e.g., "He didn't *intend* to hurt me, so my anger lessens, but I still feel hurt by the *outcome* and expect an apology/explanation"). The relationship framework remains intact.
      *   **Examples:** Accidentally stepping on someone's foot ("I didn't mean to!"), acting under duress, making an honest mistake based on false information.

  *   **"He's not himself" (Exemption):**
      *   **What it does:** *Removes the person* (temporarily or permanently) *from the normal framework* of interpersonal relationships and moral responsibility.
      *   **Underlying logic:** The person is *incapable* of participating in the reciprocal demands and expectations of the moral community *in that moment or in general*. Their agency, understanding, or control is fundamentally compromised. They are not a *full participant*.
      *   **Effect on reactive attitudes:** It prompts us to *suspend* or *abandon* the reactive attitudes *towards that person as a responsible agent*. Resentment or indignation feels *inappropriate* or *pointless* because the target isn't capable of understanding or responding to the moral demand implicit in those attitudes.
      *   **Examples:** Severe psychosis, profound intellectual disability, extreme intoxication, *or* significant neurological damage (like your dad's frontal lobe impairment affecting impulse control and inhibition).

  **3. Why the Distinction Matters Against the Pessimist:**

  This distinction does *massive* work in Strawson's argument:

  1.  **It Shows the Pessimist is Looking in the Wrong Place:** The pessimist worries about determinism undermining responsibility *universally*. Strawson says: look at our *actual practices*. We *already* have ways of modifying or suspending reactive attitudes *without* invoking metaphysical free will. We use *practical* criteria based on someone's capacity for participation in relationships.
  2.  **It Grounds Responsibility in Relationships, Not Metaphysics:** Our judgments of responsibility aren't primarily about some hidden "free will faculty." They are about whether someone is a *fit subject* for the demands and expectations inherent in ordinary adult interpersonal relationships. Exemptions identify people who *aren't* fit subjects for those demands *at that time*.
  3.  **It Explains Why Determinism Doesn't Destroy Responsibility:** The pessimist thinks determinism means *everyone* is exempt (like puppets). Strawson counters: determinism doesn't automatically make everyone *incapable of participation* in the moral community. Most adults, most of the time, *do* possess the understanding, control, and responsiveness needed to be participants. Our practices of excuse and exemption *already handle* the cases where they don't. Determinism itself doesn't create new exemptions; it doesn't make everyone suddenly psychotic or severely brain-damaged.
  4.  **It Preserves the Naturalness of Reactive Attitudes:** For participants, reactive attitudes are the *natural, human* response to perceived goodwill or ill-will. Suspending them for the exempt is *also* a natural, human response to recognizing incapacity. Neither stance requires belief in libertarian free will; both are rooted in our social nature.

  **4. Applying Strawson to Your Dad: Objective Attitude or Not?**

  This is the heartbreaking part. Strawson would likely argue:

  1.  **Your Dad's Case Points Strongly Towards Exemption:** Frontal lobe damage severely impairing impulse control fundamentally compromises his capacity for self-regulation and inhibition. He isn't *choosing* cruelty in the way a responsible participant would. The "he's not himself" description is apt *in the specific context of these outbursts*. The underlying cause (brain damage) is the *reason* for the exemption, not just an excuse.
  2.  **Therefore, the "Full" Reactive Attitude is Inappropriate/Pointless:** Strawson would say that feeling deep, persistent *resentment towards your dad himself as a responsible agent* for these outbursts is misplaced. The person capable of understanding the moral demand and controlling his impulses in that specific way *isn't fully present* when the damage manifests. Holding him responsible in that full-blooded sense is like resenting a tornado.
  3.  **But "Objective Attitude" is an Ideal, Not an On/Off Switch:** This is critical. Strawson doesn't say:
      *   "You must instantly feel nothing but clinical detachment."
      *   "Your natural hurt feelings are wrong."
      *   He acknowledges that adopting the objective attitude (seeing someone as an object of treatment, management, care, or study, *not* as a participant in reciprocal relationships) is **difficult**, especially with loved ones. It requires effort and can feel unnatural.
      *   **Crucially, he allows for oscillation and mixture.** You might intellectually *understand* the exemption and strive for objectivity (focusing on care, managing triggers, protecting your mom), but still be *flooded* with reactive feelings (hurt, anger, grief) in the moment. *This is normal and human.*
      *   **The key is the *direction* of the attitude:** Are you *primarily* holding him responsible and demanding accountability *from him*? Or are you *primarily* focused on managing the situation, protecting others, and caring for him as someone *harmed by* his condition? Strawson argues the latter (objective attitude) is the appropriate *aim* in exemption cases, even if the former (reactive attitude) flares up involuntarily.
  4.  **What About Your Mom's Hurt?** Strawson wouldn't dismiss your mom's pain! The *harm* is real and deeply felt. The objective attitude is towards the *source* of the harm (the damaged brain, not the responsible agent) as a *perpetrator*. It doesn't erase the victim's suffering. Protecting your mom, creating boundaries, and validating *her* reactive feelings (hurt, sadness, anger *at the situation*) are vital. The exemption changes *who* or *what* is the appropriate target of blame, not the reality of the harm inflicted.
  5.  **"Not Himself" Doesn't Erase History or Relationship:** The exemption applies to *these specific actions caused by the impairment*. It doesn't erase the loving husband and father he was, or the complex relationship you still have with him in moments of clarity. Grief for the change is a separate, valid emotion.

  **Conclusion & Your Sister's Point:**

  *   **Your Sister is Partly Right (Strawsonian View):** She correctly identifies the need for exemption ("not himself") and the inappropriateness of holding him *fully responsible* as if nothing had changed. Demanding he "control himself" or harboring deep resentment *towards him* as a moral agent *for these outbursts* is likely misplaced.
  *   **Why It "Never Sat Right" With You (Also Valid - Strawsonian Nuance):**
      *   It can feel dismissive of the very real pain inflicted on your mom (and you).
      *   It might ignore the complex mix of feelings (hurt, grief, lingering reactive flashes) that are natural and hard to suppress.
      *   It might oversimplify by implying you should *only* feel detached care, denying the human struggle.
      *   It might not address the practical need to manage the behavior and protect your mom, which the objective attitude facilitates.

  **Strawson's Answer:** Strive for the **objective attitude** towards your dad *in relation to these specific outbursts* – focus on care, management, understanding the pathology. This is the rational and humane response to his exemption. **But**, acknowledge that **reactive feelings (hurt, anger, grief) will still arise**, and that's part of being human in a devastating situation. The harm to your mom is real and requires support and protection *separate* from the question of his responsibility. The distinction helps *frame* your response, not police your every feeling. It tells you *why* holding him morally accountable *in the full sense* is inappropriate, freeing you to focus on care and protection without guilt, while still honoring the validity of the pain caused.
