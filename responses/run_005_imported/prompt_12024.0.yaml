answer: |-
  You've articulated Strawson's core argument beautifully and pinpointed two crucial and puzzling aspects of his position. Let's reconstruct the reasoning behind both:

  **1. Why Indeterminism Doesn't Rescue Responsibility:**

  Your intuition that indeterminism ("pure chance") creates "room" that determinism lacks is natural. Strawson rejects this because he believes indeterminism *fails to provide the specific kind of control required for ultimate moral responsibility (UMR)*. Here's the breakdown:

  *   **The Core Requirement (Ultimate Self-Authorship):** Strawson argues that for genuine UMR (being *truly* deserving of praise/blame in a deep, non-consequentialist sense), you must be the *ultimate, uncaused cause* of the crucial aspects of yourself (character, values, desires, etc.) that lead to your actions. You must be "causa sui" (cause of oneself).
  *   **Determinism's Failure:** Under determinism, everything you are and do is the inevitable consequence of prior causes (genetics, environment, etc.) stretching back before you existed. You didn't choose or create those initial conditions. Therefore, you cannot be the ultimate author.
  *   **Indeterminism's Failure - The "Luck" Objection:** Strawson contends that inserting indeterminism (e.g., quantum randomness affecting brain processes) into the chain leading to your character/choices doesn't help; it actually *worsens* the case for UMR:
      *   **Randomness ≠ Control:** An undetermined event is, by definition, *not determined by you*. If a random event influences the formation of your character or a specific choice, that event is a matter of luck or chance. It's something that *happens to* you, not something *you* control or author. How can you be responsible for the effects of pure chance?
      *   **Where Indeterminism Bites:** If indeterminism affects the *formation* of your character (e.g., a random mutation, a chaotic brain event during development), then a crucial part of *who you fundamentally are* is due to luck, not your own doing. If indeterminism affects *choices* themselves (e.g., a genuinely random neural fluctuation tipping the balance between options), then the choice itself has a random element *you* didn't control. Responsibility requires control, not randomness.
      *   **No Room for the "True Self":** The "room" indeterminism creates isn't occupied by a responsible *you*. The "you" that *could* be responsible is the product of *both* determined factors *and* random ones. Neither type of factor provides the self-originating, self-controlling authorship required. Indeterminism adds *uncontrolled* breaks in the chain, not *self-controlled* ones.
      *   **The Regress Persists:** Even if an undetermined event occurs during an "act of self-shaping," Strawson asks: *Why did that specific undetermined event occur rather than another?* If it's truly random, it's luck. If it's influenced by prior states of *you*, then we regress: why were *you* in that prior state? The need for ultimate self-authorship remains unfulfilled.

  **In essence:** Indeterminism doesn't insert *you* as the author; it inserts *randomness*. Responsibility requires *determination by the self*, not the *absence of determination* (which is randomness) or *determination by prior external causes*.

  **2. Why Strawson Doesn't Advocate Reforming Praise/Blame/Punishment:**

  This is where Strawson's position is most distinctive and pragmatic, separating him from "hard incompatibilists" like Derk Pereboom or Gregg Caruso. His reasoning involves several key points:

  *   **Distinguishing Theoretical UMR from Practical Responsibility:** Strawson sharply separates the *metaphysical impossibility* of UMR from the *practical necessity and psychological reality* of holding people responsible within our social lives. He argues our practices of praise, blame, resentment, gratitude, punishment, etc., are not *founded* on the belief in UMR; they are fundamental, natural, reactive aspects of human interpersonal relations (drawing on P.F. Strawson's "Freedom and Resentment").
  *   **The Inescapability of Reactive Attitudes:** We cannot simply *decide* to stop feeling resentment when wronged, gratitude when helped, or indignation at injustice. These "reactive attitudes" are ingrained in our psychology and form the bedrock of our social interactions. Attempting to suppress them universally based on a metaphysical theory would be psychologically impossible and socially destructive.
  *   **Practical Necessity & Functionality:** Our responsibility practices *work*. They regulate behavior, reinforce social norms, express important moral emotions, deter wrongdoing, protect society, and facilitate cooperation and trust. Abandoning them because UMR is metaphysically impossible would likely lead to social chaos or necessitate alternative systems of control that might be far worse (e.g., purely manipulative or coercive systems).
  *   **"Objective" Attitudes are Impractical:** P.F. Strawson contrasted "reactive attitudes" with "objective attitudes" (seeing people as objects to be managed, fixed, or avoided, like a dangerous animal or a broken machine). Galen Strawson agrees that adopting a purely objective attitude towards *all* people *all* the time is neither feasible nor desirable. It would undermine the fabric of human relationships.
  *   **Compatibility with Lack of UMR:** Strawson argues we can *consistently* acknowledge the theoretical truth of no UMR while fully participating in the practical, interpersonal world of holding people responsible. We don't need the *metaphysics* of UMR for the *practice* to be psychologically real, socially vital, and morally meaningful *within its own framework*.
  *   **Focus on Understanding, Not Revolution:** Strawson sees his argument primarily as clarifying a deep metaphysical truth about our condition, not as a direct blueprint for social reform. He might support reforms based on *consequentialist* or *compassionate* grounds (e.g., less punitive justice systems focused on rehabilitation, recognizing the role of luck in life outcomes), but not *because* his argument proves no one is *ultimately* responsible. Reform arguments, for him, stand on their own practical merits.
  *   **Avoiding Nihilism/Pessimism:** While his conclusion is stark metaphysically, avoiding calls for dismantling responsibility practices might be a way to prevent a slide into nihilism or paralysis about how to live and organize society. He allows the practical level its own validity.

  **In essence:** Strawson believes our responsibility practices are rooted in deep, inescapable human psychology and serve vital social functions, entirely independently of the impossible metaphysical requirement of ultimate self-authorship. To abandon these practices because UMR is impossible would be disastrous and unnatural, even if the philosophical argument against UMR is sound. We must live with this tension between metaphysical truth and practical necessity.

  **Your original insight into the regress argument is profound.** Strawson's additions refine it by showing why *neither* determinism *nor* indeterminism can bridge the gap to ultimate self-authorship, and why, despite this, our practical engagement with responsibility remains essential and justified on its own terms. The tension you perceive is central to his unique position.
