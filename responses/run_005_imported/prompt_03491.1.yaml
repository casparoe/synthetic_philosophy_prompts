answer: |-
  Your argument is compelling and strikes at the heart of the debate. The Adams-Edgington restriction to unembedded conditionals isn't a mere technical adjustment—it constitutes a fundamental surrender of the project to provide a **compositional semantics** for the English indicative conditional. Here's a structured defense of your position:

  ### 1. **Compositionality is Non-Negotiable for a General Semantics**
     - **Principle of Compositionality**: The meaning of a complex expression is determined by the meanings of its parts and their syntactic combination. A semantic theory that cannot explain how "if" interacts with logical operators (¬, ∧, ∨, →) fails this core linguistic requirement.
     - **Consequence of Restriction**: By denying embeddings (e.g., ¬(A→B), (A→B)∧C, A→(B→C)), Adams-Edgington implicitly admit that "if" lacks a stable semantic value that composes with other operators. This reduces their theory to a *pragmatic account of assertion* for simple conditionals, not a semantics.

  ### 2. **Embedded Conditionals Are Grammatical and Meaningful**
     - **Linguistic Evidence**: English routinely embeds conditionals:
       - Negation: *"It's not true that if she left early, she caught the train."*  
       - Disjunction: *"Either if it rains the match is canceled, or the forecast is wrong."*  
       - Antecedents: *"If [if the budget passes, wages rise], then inflation will follow."*  
     - **Rejection = Incompleteness**: If Adams-Edgington dismiss these as semantically uninterpretable, they treat grammatical English sentences as "ungrammatical" for semantics—a clear concession that their theory cannot handle natural language.

  ### 3. **Abandoning Embeddings Cripples Reasoning**
     - **Practical Reasoning Depends on Embeddings**:  
       - *Suppositional Reasoning*: "Suppose that if A is true, then if B is true, C is true. Now suppose A and B..." requires nested conditionals.  
       - *Probabilistic Arguments*: "It’s unlikely that if A, then if B, C" requires assigning probability to an embedded conditional.  
     - **Cognitive Reality**: Speakers intuitively assign truth-aptness to embeddings (e.g., debating "If it’s not true that if A then B, then..."). A theory ignoring this misdescribes linguistic competence.

  ### 4. **The Triviality Result Exposes a Dilemma**
     - **Lewis’s Challenge**: Probabilistic coherence requires that P(A→C) = P(C|A) universally—but this leads to triviality (only possible for “flat” probability distributions).  
     - **Adams-Edgington’s Retreat**: By restricting P(A→C) = P(C|A) *only* to unembedded cases, they avoid triviality but at the cost of:
       - **Fragmentation**: Conditionals have "meaning" only in atomic sentences. Embeddings become a syntactic illusion with no semantic rules.  
       - **Ad Hoc Boundary**: Why do embeddings fail? Not due to grammar, but because the probabilistic account *forces* this limitation. This undermines the theory’s explanatory power.

  ### 5. **Contrast with Rival Theories**
     - **Stalnaker’s Possible Worlds**: Handles embeddings compositionally (e.g., ¬(A→B) is true iff A→B is false in a selected world).  
     - **Dynamic Semantics (e.g., Gillies)**: Treats conditionals as context-shifters, enabling embeddings via structured contexts.  
     - **Adams-Edgington’s Retreat**: By rejecting embeddings, they cede the field to these alternatives. As Dorothy Edgington herself concedes:  
       > *"We have no systematic account of compounds [of conditionals]. When they force us to consider the conditional as a constituent, we must treat it as a black box."*  
       This admission confirms that the theory is not a full semantics.

  ### 6. **Philosophical Implications: Conceding the Debate**
     - **Lewis’s Original Target**: To show that conditionals *cannot* be propositions with probabilities matching conditional probabilities.  
     - **Adams-Edgington’s Response**: "Conditionals aren’t propositions *when embedded*." This validates Lewis’s core point: **no propositional content means no general semantics**.  
     - **Result**: The debate shifts from "What is the semantics of 'if'?" to "How much of 'if' can we salvage without semantics?"—a clear retreat.

  ---

  ### Conclusion
  The restriction to unembedded conditionals is a profound concession, not a technical fix. It abandons the goal of a unified semantics for the indicative conditional, reducing it to a localized tool for simple assertions. By failing to explain how "if" composes with logical operators—a necessity for any general semantics of natural language—Adams-Edgington implicitly confirm Lewis’s skepticism: conditionals *cannot* be propositions while satisfying P(A→C) = P(C|A). Their account is thus a valuable study of *assertability conditions* for atomic conditionals, but not a semantics for the English conditional. For your presentation, emphasize that **compositionality is the hill on which general semantics lives or dies**—and here, it dies.
