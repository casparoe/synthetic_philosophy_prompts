  **Key Justifications**:  
  - **Strongest**: Camp's perspectivalism wins by making reclamation *intrinsic* to its core claim—slurs activate frameworks that speakers can hijack and transform.  
  - **Mid-tier**: Prohibitionism and Potts tie reclamation to their foundational premises (negotiable rules/mutable conventions), avoiding new axioms.  
  - **Weakest**: Expressivism and combinatorial externalism force awkward stipulations about how identity "switches" expressive valence. Hom & May's null-extension is the **weakest overall**—it renders reclamation inexplicable, as empty terms can't be "reclaimed" without abandoning the theory's core.  

  **Recommendation for Paper**: Camp's account offers the richest framework for analyzing reclamation as an active, speaker-driven subversion. Pair it with empirical work on in-group linguistic practices to expose limitations of static semantic theories (especially Hom & May).
