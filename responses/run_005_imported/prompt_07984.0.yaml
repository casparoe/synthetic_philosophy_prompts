prompt: |-
  I'm in a grad seminar on philosophy of language this term and we just spent two sessions on the semantics/pragmatics of slurs. I got kind of obsessed with one specific sub-problem afterward: reclamation/appropriation, i.e. how a slur that's devastating coming from an outsider can be totally fine (even affirming) when used within the targeted group — "queer" is the obvious case but there's plenty of others. My professor walked us through the standard theories people use to explain the offensiveness of slurs in general, but the reclamation discussion mostly felt bolted on after the fact rather then actually following from each theory's core mechanism, and I want a second opinion before I commit to a term paper angle.

  Here are the six accounts I'm weighing: (1) prohibitionism (Anderson & Lepore's view that slurs are just prohibited words, full stop, with no special semantic or expressive content of their own), (2) Hom's combinatorial externalism (slurs semantically encode a complex derogatory property that's fixed by racist social institutions), (3) Hom & May's null-extension / "pejoratives as fiction" view (the racist property is uninstantiated, so slurs are semantically empty, like names in fiction), (4) the conventional-implicature / multidimensional-semantics view in the Potts tradition (offensiveness is a non-at-issue expressive dimension layered on top of ordinary truth-conditional content), (5) Jeshion's expressivism (slurs directly express contempt for the target without any mediating descriptive content), and (6) Camp's perspectival account (slurs invoke or impose a whole derogatory way of viewing the target group, more like a lens than a proposition).

  Can you rank these six from best to worst at genuinely explaining reclamation — meaning the theory's own internal machinery predicts or naturally accommodates why in-group use can defuse or invert the slur, as opposed to needing some extra stipulation shoehorned in afterward? Give me the answer as a JSON list ordered best to worst, formatted like this:

  ```json
  [
    {"theory": "...", "verdict": "built-in", "reason": "..."},
    {"theory": "...", "verdict": "bolted-on", "reason": "..."}
  ]
  ```

  where "verdict" is either "built-in" or "bolted-on" and "reason" is a sentence or two. Don't be shy about being opinionated on which one is clearly the weakest of the bunch.
reasoning: |-
  We are ranking six theories of slurs based on how well they explain reclamation (in-group use defusing or inverting the slur). The key is whether the theory's core mechanism naturally predicts or accommodates reclamation without needing an extra stipulation.

  Theories:
  1. Prohibitionism (Anderson & Lepore): Slurs are prohibited words by social convention. No special semantic content.
  2. Combinatorial externalism (Hom): Slurs semantically encode a complex derogatory property fixed by racist institutions.
  3. Null-extension / "pejoratives as fiction" (Hom & May): The derogatory property is uninstantiated, so slurs are empty (like fictional names).
  4. Conventional implicature / multidimensional semantics (Potts): Slurs have a non-at-issue expressive layer (offensiveness) on top of truth-conditional content.
  5. Expressivism (Jeshion): Slurs express contempt directly without descriptive content.
  6. Perspectival account (Camp): Slurs impose a derogatory perspective (like a lens) on the target group.

  Reclamation: How does in-group use make the slur non-offensive or affirming?

  Analysis for each:

  1. **Prohibitionism**: The prohibition is based on who is allowed to use the word. So, reclamation is straightforward: the targeted group can change the prohibition rules for themselves. This seems built-in because the theory is all about social prohibition, which can be renegotiated by the group. Verdict: built-in.

  2. **Combinatorial externalism**: The derogatory content is semantically encoded and fixed by institutions. Reclamation would require changing the semantic content, which is fixed by external racist institutions. How can the targeted group change that? It seems they would need an extra mechanism to override or alter the semantic content, so it feels bolted-on. Verdict: bolted-on.

  3. **Null-extension**: Slurs are empty terms because the derogatory property doesn't exist. But then, why are they offensive? And how does reclamation work? If the term is empty, reclamation might involve assigning a new meaning, but the theory doesn't provide a natural way for that. Reclamation would require a stipulation that the term is no longer empty or is used in a new way. Verdict: bolted-on.

  4. **Conventional implicature (Potts)**: The expressive layer (offensiveness) is conventional. Reclamation could be seen as changing the convention so that the expressive content is different (e.g., in-group use might have a positive expressive content). Since conventions can change, this might be built-in. However, Potts himself might argue that expressives are stable and not easily changed, so it might require an extra story about convention shift. But the core idea of conventional implicature allows for conventions to evolve, so it could be built-in. Verdict: built-in (with some room for debate).

  5. **Expressivism (Jeshion)**: Expresses contempt directly. Reclamation would require that the same word, when used by in-group, expresses something else (e.g., solidarity). But the theory doesn't naturally explain how the expression of contempt turns into an expression of pride. It might need an additional mechanism for context-dependent expression. Verdict: bolted-on.

  6. **Perspectival account (Camp)**: Slurs invoke a derogatory perspective. Reclamation could be seen as adopting that perspective ironically or subverting it. The core idea is about perspective, and perspectives can be shifted or reappropriated. So, when the targeted group uses the slur, they are changing the perspective to one of empowerment. This seems to be a natural extension of the theory. Verdict: built-in.

  Ranking from best to worst at explaining reclamation (with built-in being better than bolted-on):

  Best: 
  - Perspectival account (built-in)
  - Prohibitionism (built-in)
  - Conventional implicature (built-in, though perhaps less straightforward than the top two)
  - Expressivism (bolted-on)
  - Combinatorial externalism (bolted-on)
  - Null-extension (bolted-on, and might be the weakest because it doesn't even have a clear starting point for reclamation)

  But note: We are ranking by how well the core machinery explains reclamation without extra stipulation.

  Final ordering (best to worst):

  1. Perspectival account (Camp) - built-in: The perspective-shifting nature of the account allows for reclamation as a subversion of the derogatory lens.
  2. Prohibitionism (Anderson & Lepore) - built-in: Prohibitions are social and can be renegotiated by the group, so reclamation is a direct change in prohibition rules.
  3. Conventional implicature (Potts) - built-in: Conventions can change, so the expressive content can be reappropriated by the group to convey a different attitude.
  4. Expressivism (Jeshion) - bolted-on: The direct expression of contempt doesn't naturally flip to pride without an additional story about context or speaker identity.
  5. Combinatorial externalism (Hom) - bolted-on: The fixed semantic derogatory content, tied to institutions, doesn't easily allow for reclamation by the group without changing the institutions first.
  6. Null-extension (Hom & May) - bolted-on: The term being empty doesn't provide a basis for reclamation; it would require an entirely new semantic assignment, which is ad hoc.

  Now, format as JSON list ordered best to worst.
