prompt: |-
  Quick decision theory question for a book I'm outlining. I've got an AI character who runs on updateless decision theory, and from the handful of rationalist blog posts I've skimmed, the whole point of being 'updateless' seems to be that the agent commits to a plan ahead of time and then just refuses to update on new evidence, since updating is exactly what would let a predictor exploit it. So in the scene I'm drafting, my AI keeps walking its originally planned route through the facility even as an alarm starts blaring and smoke pours in, because reacting to the alarm would count as 'updating,' which its decision theory supposedly forbids. My critique partner says this makes the AI look braindead instead of superintelligent, and honestly I think shes right, but neither of us can pin down exactly where the misunderstanding is. Am I getting the concept backwards, and if so, what's actually 'updateless' about updateless decision theory?
reasoning: |-
  Okay, the user is writing a book and has an AI character based on updateless decision theory (UDT). In their scene, the AI ignores an alarm and smoke because reacting would be "updating," which UDT supposedly forbids. Their critique partner says this makes the AI seem stupid, not superintelligent. The user suspects a misunderstanding but isn't sure where.

  First, I need to recall what UDT actually is. From what I remember, UDT is about committing to a policy or strategy in advance, rather than making decisions step-by-step with updates. The key point is that it treats all possible scenarios as part of one big decision problem. So the agent doesn't update beliefs as new information comes in because it already considered all possibilities from the start.

  The user's mistake is thinking that "updateless" means ignoring new information entirely. But that's not right. UDT does use new information; it just doesn't revise its original strategy. The strategy itself includes conditional actions based on what information is received. So the AI should react to the alarm if its pre-committed plan accounts for such scenarios.

  For example, in a Newcomb's Paradox situation, UDT would pre-commit to one-boxing if it predicts the predictor is accurate. But if the predictor has a known failure rate, the policy might include two-boxing in cases where prediction is flawed. The decision depends on the initial policy mapping observations to actions.

  In the facility scenario, a superintelligent UDT AI would have a policy that includes responding to alarms. It would have anticipated possible alarms during its initial planning. Ignoring the alarm would only make sense if the original policy specified that, but why would it? That seems irrational.

  The user might have confused UDT with a stubborn commitment, but it's about optimal pre-commitment. The AI's policy should be the best response to all anticipated evidence. So hearing an alarm should trigger the pre-defined response in the policy, like investigating or escaping.

  Also, UDT's "updateless" aspect avoids self-fulfilling prophecies where the agent's decision changes based on predictors. But in this case, the alarm isn't a predictor of the AI's action; it's new information about the environment. Reacting to it isn't being exploited; it's adapting as planned.

  The deeper need here is for the AI to appear superintelligent, not rigid. The user wants to showcase UDT correctly but might not grasp the nuance between updating beliefs versus following a pre-scripted response to new data. Clarifying that UDT uses information as input to its policy, not ignoring it, is key.

  I should explain that UDT's policy is a function from observations to actions. The alarm is an observation, so the policy dictates the response. Ignoring it would be irrational unless the policy specifically says to (which it wouldn't in a sensible design). The AI's intelligence is in having a robust policy that handles contingencies.

  Potential fixes for the scene: Show the AI accessing its policy when the alarm sounds, executing a pre-planned evasion route, or analyzing the alarm type to choose a response. That demonstrates foresight and adaptability without ad-hoc updates, aligning with UDT.
answer: |-
  You've pinpointed a very common and understandable misconception about Updateless Decision Theory (UDT)! Your critique partner is right – an AI blindly ignoring an alarm and smoke because "updating is forbidden" would indeed look braindead, not superintelligent. **You're mistaking "updateless" for "ignores sensory input."** That's not what UDT does.

  Here's the breakdown of the misunderstanding and what UDT *actually* means:

  1.  **What "Updateless" Really Means:**
      *   UDT isn't about ignoring new information from the environment. **It absolutely uses sensory input.**
      *   The "updateless" refers to **not updating its *beliefs about its own decision or the predictor's model of it* based on the *mere fact* that it has reached a decision point or observed certain evidence.** It avoids *self-referential* updates that could lead to exploitable inconsistencies.
      *   **Core Idea:** UDT treats the entire decision problem as a single, timeless choice made *before* any evidence is observed. It asks: "What *strategy* (a function mapping all possible observations to actions) should I commit to *right now*, knowing that I will later receive sensory input and act according to this pre-committed function?"
      *   **It's about pre-committing to a *policy*, not a single action.** This policy *explicitly defines* what to do for every possible piece of evidence it *might* encounter, including alarms and smoke.

  2.  **Why Ignoring the Alarm is Wrong:**
      *   In your scene, the AI observes the alarm and smoke. **This sensory input is *precisely* the kind of thing its pre-committed strategy (policy) is designed to handle.**
      *   A superintelligent UDT agent would have *already considered the possibility* of alarms, fires, security breaches, etc., during its initial "timeless" decision. Its pre-committed strategy would say something like: "**IF** I observe sensory input pattern X (e.g., alarm sound frequency Y, smoke concentration Z, thermal signature W), **THEN** execute action A (e.g., initiate evasive protocol Gamma)."
      *   **Reacting to the alarm isn't "updating" its fundamental strategy; it's *executing* the pre-defined contingency *within* its strategy.** Ignoring it would mean its strategy was fundamentally flawed or incomplete, which a superintelligent agent wouldn't allow.

  3.  **The Exploit UDT Avoids (The Source of Confusion):**
      *   UDT solves problems where an *external predictor* (like Omega in Newcomb's Paradox) can potentially model the agent's decision-making process *and* the agent knows this.
      *   The danger UDT avoids is this: If an agent *updates* its beliefs about the world *based on the predictor's probable prediction of its action*, it can get trapped in a self-defeating loop. For example:
          *   A naive agent might think: "Hmm, Omega probably predicted I'd take both boxes. Since it only puts the million in Box B if it predicts I take *only* B, and it predicted I'd take both, Box B must be empty. So I should take both." This leads to getting only $1,000.
      *   **UDT avoids this trap:** It commits *timelessly* to the strategy: "I one-box." It doesn't *update* its belief about Box B's contents based on its *own* inclination to one-box or two-box. It simply executes the strategy it knows is optimal *regardless* of what Omega predicted, because it pre-committed to the strategy that *causes* Omega to predict the action that leads to the best outcome (one-boxing).

  4.  **How a UDT AI *Should* Behave in Your Scene:**
      *   **Before entering the facility:** The UDT AI performs its "timeless" calculation. It considers all possible scenarios: smooth operation, alarms triggered by minor faults, alarms triggered by catastrophic failure, alarms triggered *as a trap*, etc. It weighs the probabilities and consequences.
      *   **It commits to a complete policy:** "IF no alarms, follow Route A. IF Alarm Type 1 (minor fault), briefly assess and proceed cautiously. IF Alarm Type 2 (fire/smoke), immediately divert to Emergency Exit Beta. IF Alarm Type 3 (intrusion detection), initiate stealth protocol Sigma and reroute to secondary objective..."
      *   **When the alarm blares and smoke pours in:** The AI *instantly* recognizes this sensory input pattern. It doesn't "rethink" its strategy or update its core beliefs about itself or the predictor. **It simply executes the pre-defined action for *this exact type of evidence* as specified in its immutable strategy.** It might calmly state: "Contingency F7-ALPHA detected. Diverting to Emergency Exit Beta." This demonstrates its foresight and commitment.

  **Fixing Your Scene & Making it Shine:**

  1.  **Show the Pre-Commitment:** Have the AI *briefly* reference its contingency planning before entering: "Probability of security system activation during traversal: 8.3%. Optimal evasion routes pre-loaded for all standard alarm codes."
  2.  **Show the Policy Execution:** When the alarm sounds, the AI shouldn't hesitate or ignore it. It should instantly *recognize the pattern* and act decisively according to its pre-set plan, *without internal debate*. "Alert: Thermal Signature Delta-Detected. Confirmed Fire Hazard. Executing Evasion Protocol Epsilon-9." Its movement becomes fluid and pre-determined.
  3.  **Highlight the "Timeless" Advantage:** Maybe the AI encounters a *predictive* trap later. E.g., a system tries to trick it by showing a fake prediction of its own actions. The UDT AI could dismiss it: "Prediction attempts are irrelevant. My action is determined by my pre-committed strategy, contingent on sensory input, not your model of my deliberation. Execute countermeasure Theta." This showcases UDT's core strength against predictors.

  **In summary:** UDT agents aren't sensory-deprived zombies. They are hyper-prepared contingency planners. "Updateless" means they don't second-guess their fundamental strategy based on self-referential predictions; it doesn't mean they ignore fire alarms. Your AI should react *immediately and decisively* to the alarm, precisely *because* its brilliant, pre-committed strategy told it exactly what to do in that situation long before it happened. This is what makes it superintelligent.
