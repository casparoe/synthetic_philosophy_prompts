  ## The Ancestral's Shadow: Frege's Logic in Service of Bigotry

  Your unease is profoundly justified. D'Arcy's argument forces a confrontation not just with Frege the man, but with the unsettling possibility that the very tools of pure reason you meticulously analyze were later wielded to scaffold vile ideology. Let's dissect the two questions directly, resisting the comfort of evasion.

  **I. The Plausibility of Conceptual Continuity: Beyond Rhetorical Borrowing**

  The claim that Frege repurposed *specific technical apparatus* for his politics is **highly plausible and textually grounded, representing significant conceptual continuity, not superficial borrowing.** Here's the defense:

  1.  **The Ancestral's Core Function:** The ancestral relation (`R*`) defines a property holding for an object *x* iff *x* has a property *F*, and *F* is "hereditary" under relation *R*. Its *purpose* is to capture lineage, succession, and inheritance within a defined structure. Family trees were its canonical *illustration* in the *Begriffsschrift*. Its essence *is* descent.
  2.  **The 1924 Diary Entries:** Frege explicitly applies this structure to "Aryan descent":
      *   He discusses "citizenship rights" inhering only in those "of Aryan descent."
      *   He frames this precisely as a hereditary property transmitted through parentage – the *exact* structure the ancestral formalizes. Citizenship (`F`) is defined as hereditary (`R` being the parent-child relation) starting from some foundational "Aryan" ancestors. The logical form he pioneered *is* the form he uses to argue for racialized legal privilege. This isn't using the *word* "ancestral" metaphorically; it's applying the *concept's logical structure* to a new domain – political biology.
  3.  **Vagueness and Sharp Boundaries: A Logical Scruple Deployed Politically:** Frege's lifelong crusade against vagueness and insistence on sharp conceptual boundaries for truth-aptitude was central to his logicism. D'Arcy highlights Frege applying *this same logical scruple* to the question of defining "Jewishness." Frege frets, *as a logician*, that a legally enforceable definition requires precise boundaries impossible to draw biologically. This isn't incidental prejudice; it's the core methodological anxiety of his philosophical project transposed onto a racist political problem. His worry stems from the *same foundational commitment* that drove his logic: concepts must be *sharply defined* to function in rigorous systems (whether logical or legal). The continuity lies in the *application of a core methodological principle*.
  4.  **Contrast with Mere Vocabulary Borrowing:** Superficial borrowing would be using terms like "foundation," "derivation," or "inheritance" loosely. What we see is the *structural deployment* of a *defined formal concept* (the ancestral) and the *application of a fundamental philosophical commitment* (anti-vagueness) to solve specific ideological-political problems. The logic isn't just *dressing* the prejudice; it's providing the *framework* and *justification* for its implementation.

  **Verdict:** The evidence strongly supports D'Arcy's core claim. Frege didn't merely *happen* to be a logician and a bigot. Specific, central pieces of his technical apparatus (the structure of the ancestral) and his core philosophical tenets (the demand for sharp boundaries) were consciously and directly employed to model and justify his fascistic political vision. This makes the connection materially stronger than mere association (Hume) and conceptually specific in a way that differs from Heidegger's more diffuse relationship between ontology and Nazism. Frege used his *tools*.

  **II. Implications: Teaching, Writing, and the Weight of History**

  Granting this conceptual continuity, how should you, as a scholar deeply engaged with the ancestral, proceed? Rejecting the logical insights wholesale is neither feasible nor intellectually honest. Ignoring the history is morally and intellectually deficient. Here’s a defensible path:

  1.  **Teach the Logic Rigorously, But Contextualize Ruthlessly:**
      *   **In Logic/Philosophy of Math Courses:** Teach the ancestral *as logic*. Explain its formal definition, its role in defining mathematical induction and the natural numbers, its power and elegance. This stands on its own technical merits.
      *   **BUT:** Explicitly introduce the *fact* of Frege's later ideological use. Briefly state: "Decades after creating this tool to define numbers, Frege himself applied its *exact logical structure* to argue for citizenship based on 'Aryan descent.' This is a stark reminder that formal tools are not ethically neutral; their meaning and impact depend on context and application." This isn't an ad hominem; it's historical and conceptual truth-telling. It inoculates students against the myth of pure, disembodied reason.
      *   **In History of Analytic Philosophy/Modern Philosophy Courses:** Make this connection a *central case study*. Explore the details: How does the structure map? What does Frege's worry about defining Jewishness reveal about the interaction between his logical scruples and his politics? Use it to critically examine the supposed "purity" of logic and the sociopolitical embeddedness of philosophical concepts.

  2.  **Write with Nuance and Intellectual Courage (Especially in Your Dissertation):**
      *   **Acknowledge Explicitly:** In your chapter, include a substantive footnote or short section (proportional to the work's focus) acknowledging this history. Don't bury it. State clearly: "While this chapter focuses on the logical and mathematical significance of Frege's definition in the *Begriffsschrift* and *Grundlagen*, it is crucial to note that Frege later repurposed the structural logic of the ancestral relation in his political writings to model hereditary citizenship rights based on racial descent. This complex and disturbing appropriation underscores the need for critical reflection on the potential applications of formal systems." This demonstrates scholarly integrity and awareness.
      *   **Avoid Conflation, But Explore Resonance (Where Relevant):** Your dissertation chapter is about the *logical/mathematical* work. Don't derail it into a political analysis. However, if your analysis touches on the *nature* of hereditary properties, succession, or definitional precision *within the logical context itself*, you can briefly note the *resonance* with how Frege later applied similar thinking elsewhere, without equating the domains. E.g., "Frege's insistence on the sharp definability of hereditary properties for the ancestral finds a disturbing, albeit logically parallel, echo in his later political anxieties about defining descent for legal purposes."
      *   **Frame Your Own Work:** Be conscious that you are engaging with tools used for horrific ends. This doesn't taint your work, but it imposes a responsibility. Frame your engagement critically. Your work demonstrates the *logical* power of the ancestral; let that power stand in implicit *contrast* to its ideological misuse. Show logic serving understanding, not exclusion.

  3.  **Resist the "Separate Compartment" Fallacy:** Your advisor's stance ("irrelevant to the logic's merits") embodies this fallacy. While the *validity* of modus ponens isn't changed by who uses it, the *meaning, significance, and potential dangers* of complex conceptual apparatuses like the ancestral *are* illuminated by their historical applications, especially by their creator. Ignoring this flattens history and philosophy. The "merits" of a tool include understanding the full spectrum of what it *can* do and *has* done.

  4.  **Embrace the Cautionary Tale:** Frege's case is uniquely powerful *because* of the specificity D'Arcy reveals. It demonstrates with chilling clarity how tools forged in the pursuit of pure truth can be weaponized. This isn't a reason to abandon logic; it's a reason to teach and practice it with heightened ethical awareness, historical consciousness, and a commitment to exposing its potential misuses. You, as a scholar, now carry the burden and the opportunity to model this.

  **Conclusion:**

  D'Arcy's textual evidence convincingly shows Frege deploying the structural logic of the ancestral and his anti-vagueness scruple directly in service of his fascistic politics. This is not coincidence or mere vocabulary; it is conceptual continuity. To treat Frege's logic now requires acknowledging this history explicitly, not to invalidate the logic, but to understand its creator fully and to confront the sobering reality that even the most abstract formalisms exist within a human world susceptible to ideology and hate. Teach the ancestral rigorously, write about it clearly, but do so with the shadow of its misuse consciously present. Let this knowledge fuel not paralysis, but a more critical, historically grounded, and ethically responsible engagement with the powerful tools of reason. Your dissertation chapter gains depth, not weakness, by acknowledging this complex, uncomfortable truth.
