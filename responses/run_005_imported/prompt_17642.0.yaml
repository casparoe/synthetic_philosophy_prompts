answer: |-
  That's an incredibly insightful observation from your dinner experience, and you've hit on one of the deepest truths in social choice theory: **what you experienced is fundamentally unavoidable in *any* democratic voting system when there are three or more options and multiple voters.** It's not a quirk of Instant Runoff Voting (IRV), nor can any "cleverer counting method" completely design it away. This phenomenon is settled science, proven mathematically decades ago.

  Here's the breakdown:

  1.  **The Core Problem: Strategic Voting (Tactical Voting)**
      *   Your situation is a classic example of **strategic voting**. Voting your sincere preference (Sushi > Pizza > Burger) led to a worse outcome (Pizza winning) than voting strategically (Pizza > Sushi > Burger), which would have led to your sincere favorite winning (Sushi). Your incentive was to *misrepresent* your true preferences to achieve a better outcome.
      *   This directly contradicts the ideal of "vote your honest favorite without fear" that IRV often promotes.

  2.  **The Mathematical Truth: Arrow's Impossibility Theorem & Gibbard-Satterthwaite**
      *   **Arrow's Impossibility Theorem (Kenneth Arrow, 1951):** This Nobel Prize-winning theorem proved that **no** voting system can simultaneously satisfy all of the following seemingly reasonable criteria when there are three or more options:
          *   **Unrestricted Domain:** Voters can rank options in any order.
          *   **Non-dictatorship:** No single voter always decides the winner.
          *   **Pareto Efficiency:** If everyone prefers A to B, B cannot win.
          *   **Independence of Irrelevant Alternatives (IIA):** The relative ranking of two options (A vs. B) should *only* depend on how voters rank A vs. B. The presence or ranking of a third option (C) shouldn't change whether A beats B or B beats A.
      *   **Why it matters to you:** Your experience violates IIA. The presence and relative strength of the Pizza option changed the outcome between Sushi and Burgers *based on your specific ballot*. In your sincere vote, Pizza's strength eliminated Sushi first, letting Pizza win. In your strategic vote, boosting Pizza *first* actually weakened Pizza's ability to eliminate Sushi later, allowing Sushi to win. The relative standing of Sushi vs. Burgers (and who won overall) depended critically on how you ranked Pizza, an "irrelevant" alternative to your Sushi vs. Burgers preference.
      *   **Gibbard-Satterthwaite Theorem (Allan Gibbard 1973, Mark Satterthwaite 1975):** This theorem directly addresses strategic voting. It states that **any** voting system that:
          *   Has three or more possible outcomes,
          *   Is deterministic (rules always produce a single winner),
          *   Allows any voter to rank the outcomes in any order (unrestricted domain), and
          *   Is non-dictatorial
          *   ...**must be susceptible to strategic voting.** That is, there will *always* be some situations where at least one voter can achieve a better outcome by misrepresenting their true preferences.

  3.  **What This Means for Your Dinner (and IRV):**
      *   **Not IRV's Fault Alone:** While your experience happened under IRV, the Gibbard-Satterthwaite theorem guarantees that *any* conceivable non-dictatorial voting system (Approval Voting, Condorcet methods, Borda Count, STAR Voting, etc.) would be vulnerable to strategic manipulation in *some* scenarios with 3+ options. Each system has different vulnerabilities and frequencies, but *none* are immune.
      *   **IRV's Specific Vulnerability:** IRV is particularly susceptible to a specific type of strategic voting called **"compromising"** or **"burying"**, which is *exactly* what you considered: ranking a weaker compromise candidate (Pizza) higher than your true favorite (Sushi) to prevent a stronger rival (Burgers, or in this case, indirectly, Pizza itself) from winning. This often happens when a strong candidate (Sushi) is eliminated early due to vote splitting.
      *   **Why Cities Still Switch to IRV:** Despite this, IRV offers significant practical advantages over First-Past-the-Post (FPTP):
          *   **Eliminates "Spoiler Effect"/Vote Splitting:** Major reason for adoption. In FPTP, voting for your true favorite (e.g., Sushi) can split the vote with a similar option (e.g., maybe a different Sushi place?), handing victory to your *least* favorite (Burgers). IRV largely solves *this specific, common* problem. Your ballot transfers if your favorite is eliminated.
          *   **Promotes Majority Support:** Winners typically have broader support than FPTP winners who can win with a small plurality.
          *   **Reduces Negative Campaigning:** Candidates benefit from being second choices.
          *   **Expresses Preferences:** Allows voters to show nuanced preferences.
          *   **Perception of Fairness:** Often *feels* fairer than FPTP, even if strategically imperfect. It mitigates the *most visible and damaging* flaw of FPTP (spoilers), even if it can't eliminate all strategic incentives.

  4.  **Is it Settled?**
      *   **Absolutely.** Arrow's Theorem and the Gibbard-Satterthwaite Theorem are foundational, rigorously proven mathematical results in social choice theory and economics. They are as settled as any theorem in mathematics. They don't say *all* systems are equally bad, or that strategic voting happens constantly. They state it's an *inherent, unavoidable possibility* in any non-dictatorial system with 3+ options.
      *   **The Debate:** The debate isn't about *if* strategic voting is theoretically possible (it is, unavoidably). The debate revolves around:
          *   **Practical Frequency:** How *often* do these strategic situations arise in real elections? Are they common enough to worry about, or rare edge cases? (Your dinner was a small, common case).
          *   **Complexity:** How difficult is it for voters to *recognize* when strategic voting is beneficial and to execute it correctly? (In your small group, reconstructing the rounds made it clear; in large elections, it's often opaque).
          *   **System Comparison:** Which systems are *less susceptible* or make strategic voting harder to execute in practice? (e.g., Approval Voting and Condorcet methods have different strategic profiles).
          *   **Trade-offs:** Is the reduction of vote-splitting (achieved by IRV) worth the potential for other types of strategy or violations of criteria like IIA? Cities switching to IRV are explicitly making this trade-off in favor of eliminating spoilers.

  **In Conclusion:**

  You didn't get anything wrong in your explainers *fundamentally*. Ranked-choice voting (specifically IRV) *is* a significant improvement over FPTP because it largely solves the spoiler effect, which is a major and destructive form of strategic voting. **However, your dinner experience perfectly illustrates the deeper, unavoidable truth revealed by Arrow and Gibbard-Satterthwaite: no voting system can be perfectly strategy-proof while also being fair and democratic when there are three or more choices.**

  The app's pitch ("no reason to vote anything but your honest favorite") is an *ideal*, not a guaranteed mathematical property. What happened was not a bug in the app or IRV specifically, but a fundamental feature of collective decision-making itself. While other systems might have made the strategic move harder to spot or less likely in that specific scenario, *no* system could have guaranteed it would never happen. The quest for a perfect voting system is mathematically doomed; the practical goal is to find systems that minimize the most harmful flaws for the context.
