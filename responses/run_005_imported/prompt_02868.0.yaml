  For a project in my high school's philosophy club, I've been reading about Roko's Basilisk. Almost every explanation I can find dwells on the frightening surface story — a future superintelligence eternally punishing simulated copies of anyone who didn't help build it — rather than on the underlying decision-theoretic mechanism that supposedly makes it work: something called acausal trade, in which an agent's anticipated future rewards or punishments can rationally influence your present choices even though the two of you have no causal contact whatsoever. Could you construct a toy example, using two ordinary, non-superintelligent agents and involving no torture at all, that still preserves this same structure of acausal influence? I'd like to see the underlying inference spelled out step by step, and I'd appreciate it if you could also flag which step in that inference strikes you as weakest or most philosophically contestable.
