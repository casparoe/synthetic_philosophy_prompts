  }
  ```

  with each "comment" naming the specific claim driving any deduction, "letter_grade" using whichever A–F scale you think fits a graduate-level problem set, and "overall_comment" summarizing the answer's main strengths and weaknesses in two or three sentences. I'd rather have specific comments tied to particular sentences than a general impression, since those comments are what I'll actually be sending back to the group.
