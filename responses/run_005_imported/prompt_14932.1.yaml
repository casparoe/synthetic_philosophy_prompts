answer: |-
  Here are eight interview questions with targeted follow-ups designed to push beyond her standard responses and test the edges of her position:

  1.  **Core Distinction Challenge:** *"You argue that Greaves' 'simple' cluelessness (unforeseeable effects washing out) doesn't apply to longtermist interventions, only 'complex' cluelessness (conflicting evidence with no weighing method). But isn't the *judgment* that effects are 'complex' rather than 'simple' itself vulnerable to the very same epistemic limitations? How can we be confident *that* distinction isn't also clueless?"*
      *   *Likely Follow-up Key:* If she argues the distinction *is* knowable (e.g., based on identifiable conflicting evidence streams), ask: *"Doesn't the *principled identification* of 'no weighing method' itself require a level of meta-evidential certainty that complex cluelessness, by its nature, denies us? Isn't declaring something 'complex cluelessness' just admitting defeat on weighing, rather than proving it's impossible?"*

  2.  **Demanding a Decision Rule:** *"You rightly say cluelessness isn't a license for nihilism. But if complex cluelessness guts the expected value calculations underpinning longtermist interventions, *what positive decision procedure do you endorse* when facing such pervasive uncertainty about far-future effects? What *should* guide our choices?"*
      *   *Likely Follow-up Key:* If she avoids prescribing a specific rule (e.g., talking about virtues, avoiding hubris, focusing on nearer-term goods), press: *"But that sounds like abandoning systematic consequentialist evaluation entirely in these domains. Is your practical conclusion that we must *default to non-consequentialist reasons* – like duties, rights, or agent-relative concerns – precisely because consequentialism is paralyzed here?"*

  3.  **Testing Tarsney's Loophole:** *"Christian Tarsney argues extinction-risk reduction might uniquely escape cluelessness because securing a *persistent* valuable future state (e.g., humanity surviving) only requires avoiding rare 'exogenous nullifying events,' making positive long-term effects highly probable. Does this 'lock-in' logic successfully insulate extinction-risk work from your complex cluelessness critique?"*
      *   *Likely Follow-up Key:* If she concedes some ground, ask: *"Doesn't the *value* of the 'locked-in' state itself depend on contingent future developments we're clueless about? And can we truly be confident about the probability and nature of those 'nullifying events' over astronomical timescales, or is *that* assessment also mired in complex cluelessness?"* If she rejects it outright, ask: *"What specifically fails in Tarsney's probabilistic argument for persistence? Is it the estimation of nullifying event likelihoods, the definition of 'value,' or the assumption of stability?"*

  4.  **Consequentialism's Exclusive Burden?:** *"Earlier proponents of the cluelessness objection often exempted non-consequentialists, arguing only consequentialists need worry about unforeseeable effects. You frame this as a core problem *for consequentialism*. But why isn't it equally a problem for *any* moral theory that requires assessing the real-world impact of actions/rules to determine rightness? Doesn't a deontologist forbidding an action that might prevent extinction also need to grapple with unknowable consequences?"*
      *   *Likely Follow-up Key:* If she argues non-consequentialists aren't *obligated* to maximize distant good, ask: *"But surely most plausible non-consequentialist theories still care if their rules lead to catastrophic outcomes *in principle*, even if not as a direct duty. Doesn't pervasive cluelessness about consequences undermine *any* theory's claim to reliably guide us towards morally acceptable outcomes in the long-term domain?"*

  5.  **The Burden of Proof & Moral Progress:** *"Longtermists often argue that ignoring the far future is a form of 'moral parochialism.' You argue their interventions are undermined by complex cluelessness. Given this epistemic stalemate, where does the burden of proof lie? Should we *presume* interventions are net harmful until proven otherwise, or net neutral, or does the sheer scale of potential value demand action despite uncertainty?"*
      *   *Likely Follow-up Key:* If she emphasizes caution, ask: *"Doesn't this caution risk enshrining the *status quo* and its known harms, potentially committing a different kind of moral error? How do you weigh the known suffering we *could* address now against the cluelessness surrounding attempts to prevent vast future suffering?"*

  6.  **Escaping the Frame:** *"If consequentialist longtermism is indeed crippled by complex cluelessness, does this imply that the most *pragmatic* approach to positively influencing the long-term future lies *outside* direct cause-neutral consequentialism? For example, focusing on building robust institutions, fostering moral and intellectual virtues, or strengthening general resilience – goals justified on nearer-term or non-consequentialist grounds?"*
      *   *Likely Follow-up Key:* If she agrees or is sympathetic, ask: *"Doesn't endorsing these 'indirect' strategies implicitly concede that we *can* have some justified confidence about their long-term valence, or are you arguing they are simply less *risky* ways of being clueless?"*

  7.  **Falsifiability & Longtermism's Redemption:** *"You argue complex cluelessness particularly guts *longtermist* interventions. What specific empirical discovery or philosophical breakthrough would convince you that, at least for *some* interventions like AI safety or pandemic prep, we *can* achieve justified confidence about their net impact on the far future, sufficiently to overcome the complex cluelessness objection?"*
      *   *Likely Follow-up Key:* If she suggests something (e.g., robust predictive models, evidence of path dependency), probe: *"Wouldn't the validation of such models *themselves* require observations over the very long timescales where cluelessness reigns, creating a circularity? If not, what level of near-term validation would suffice?"* If she says nothing could, ask: *"Doesn't that suggest your critique is less about longtermism per se and more a fundamental, insurmountable scepticism about *any* consequentialist claims regarding the distant future?"*

  8.  **The Heuristic Imperative:** *"Given you reject nihilism but also reject the longtermist's expected value calculus under complex cluelessness, what heuristics *do* you personally use, or recommend, for navigating real-world decisions where long-term effects seem profoundly important yet epistemically inaccessible? Is it falling back on commonsense morality, privileging avoidance of obvious catastrophes, or something else?"*
      *   *Likely Follow-up Key:* Whatever heuristic she proposes (e.g., "avoid clear, large-scale risks," "focus on fairness now"), challenge: *"Doesn't applying *that* heuristic itself involve implicit assumptions about long-term consequences? For instance, avoiding a clear risk assumes preventing it is better, but complex cluelessness suggests we can't know that. Isn't *any* practical heuristic smuggling in a suppressed consequentialist bet?"*

  These questions force engagement beyond restating the distinction, demand positive alternatives, test the robustness of her critique against potential counter-arguments (like Tarsney's), challenge its scope, and push her towards concrete implications and potential falsification points. The follow-ups are designed to anticipate her likely moves and prevent retreat into familiar formulations.
