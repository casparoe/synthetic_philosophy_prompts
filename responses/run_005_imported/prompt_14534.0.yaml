  ### Justifications per Tier:
  - **S-Tier**: Explicitly models computational constraints, making them ideal for real-world systems. Algorithmic knowledge ties knowledge to explicit computation steps, while step logics formalize resource-bounded reasoning—both directly address hardware/clock-speed limitations in distributed systems.
  - **A-Tier**: Philosophically robust but less computationally grounded. Impossible-worlds semantics elegantly avoids tautological omniscience by allowing logically inconsistent worlds, while justification logic (via explicit proof terms) naturally handles partial deduction—both are mature frameworks but may overabstract practical constraints.
  - **B-Tier**: Useful but niche. Logical induction brilliantly handles uncertainty and learning over time, but its complexity limits practicality. Awareness logic simply restricts knowledge to "aware" formulas, sidestepping omniscience arbitrarily without modeling reasoning dynamics.
  - **C-Tier**: Technically avoids omniscience but philosophically unsatisfying. Syntactic models (agents as sets of believed sentences) crudely ignore logical structure, permitting inconsistent beliefs and failing to capture any notion of rational inference.
