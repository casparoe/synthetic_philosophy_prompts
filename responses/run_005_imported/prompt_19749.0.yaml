prompt: |-
  I'm on the steering committee for an open-source project I helped start (~40k GitHub stars, running in prod at a bunch of companies). We're writing a governance charter and it's stuck on one question: who counts as a 'member' with voting rights on RFCs and maintainer elections? One camp wants voting limited to people who've merged commits in the past year -- they're the ones who understand the tradeoffs. The other camp points to what just happened: two maintainers deprecated a widely-used API with no warning, breaking prod for companies that depend on us but have never sent a PR, and now those companies want a real vote since they eat the consequences. Once you start giving a vote to 'anyone affected' though, it's not clear where that stops, and half the committee doesn't even agree on who gets to vote on the charter that decides all this. Can you draft the memo I'll send before we vote next friday -- a real recommendation on eligibility, not a list of tradeoffs, that takes the contributors-only side seriously instead of just siding with the sympathetic underdog companies.
reasoning: |-
  Okay, the user is on the steering committee for a popular open-source project (~40k GitHub stars) and they're stuck on defining who should be a "member" with voting rights. The main conflict is between limiting voting to active contributors (those who merged commits in the past year) versus including users/companies affected by decisions, especially after a recent incident where an API change broke production for some companies. 

  Hmm, the user specifically wants a decisive recommendation memo (not just tradeoffs) that takes the contributors-only side seriously, while acknowledging the companies' concerns. They're clearly frustrated by the deadlock and need a strong, actionable proposal before Friday's vote. 

  First, I should recognize why the contributors-only argument is valid: active committers deeply understand technical tradeoffs, have skin in the game, and won't dilute governance with transient interests. But I can't ignore the elephant in the room—the API deprecation backlash proves user impact matters. The memo must bridge this by giving contributors formal authority while creating structured feedback channels for users. 

  Key angles to weave in: 
  - Contributor primacy avoids governance paralysis (e.g., random companies demanding votes) 
  - But the project's real-world impact means *ignoring* users is reckless. The solution isn't giving them votes, though—it's mandating transparent processes *before* decisions hit production. 
  - The charter itself needs legitimacy, so only current maintainers/contributors should ratify it. Later amendments can involve the broader community. 

  ...Wait, the user mentioned half the committee disagrees on who votes for the charter. That's messy. Best to sidestep by proposing a ratification threshold that includes both camps: e.g., "all current maintainers + anyone with N commits in 2023." 

  For the memo structure: 
  - Start bluntly: contributors must own technical decisions. 
  - Acknowledge the API incident as a process failure, not a voter eligibility issue. 
  - Propose concrete alternatives to voting for users: RFC comment periods, opt-in advisory boards for big stakeholders, enforced deprecation timelines. 
  - Stress that "affected = voter" is unworkable—it invites chaos. 

  The tone should be diplomatic but impatient. They've debated this to death; now they need a lever to break the stalemate. I'll frame the contributor-centric model as the *only* scalable path forward, with user safeguards bolted on. 

  ...Also, the user said "not a list of tradeoffs," but the recommendation must briefly address why the other camp's concerns are solved *without* giving votes. So: tradeoffs acknowledged, but buried in solutions. 

  Final memo must feel like a rallying cry: "This is how we move forward."
answer: |-
  Here’s a draft memo for your steering committee vote, designed to resolve the deadlock while prioritizing contributor governance and addressing stakeholder concerns without diluting voting rights:

  ---

  **MEMO: Governance Charter – Voting Eligibility Recommendation**  
  **To:** Steering Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Proposed Voting Eligibility Criteria for Charter Ratification & Ongoing Governance  

  ### **Recommendation**  
  Voting rights for RFCs and maintainer elections should be **exclusively granted to active code contributors** who have merged ≥1 commit in the past 12 months. This group bears the operational burden of maintaining the project, possesses technical context for tradeoffs, and has demonstrated long-term commitment.  

  However, we must urgently address the valid concerns raised by stakeholders impacted by decisions like the recent API deprecation. Thus, we propose:  
  1. **Voting eligibility:** Limited to active contributors (as defined above).  
  2. **Stakeholder safeguards:** Mandatory RFC consultation processes for breaking changes (detailed below).  

  ### **Why Contributors Must Hold Voting Authority**  
  - **Accountability:** Voters must have "skin in the game" – those maintaining the codebase live with the consequences of technical debt, stability, and complexity.  
  - **Informed Decisions:** Merging code requires deep understanding of the project’s architecture and constraints; abstract "user impact" arguments without this context risk poor decisions.  
  - **Sustainability:** Broad voting rights invite well-resourced companies to sway decisions without contributing labor, undermining our volunteer-driven model.  
  - **Precedent:** Apache, CNCF, and Python PEPs prioritize contributor votes while using transparent processes to incorporate feedback.  

  ### **Addressing the API Incident: Solutions Beyond Voting**  
  The API deprecation crisis was a **process failure**, not an eligibility failure. We propose binding rules to prevent recurrence:  
  - **RFC Minimum Consultation Period:** 30 days for breaking changes, with notifications to:  
    - GitHub Discussion Threads (public)  
    - Project mailing list  
    - Designated contacts from top 20 commercial users (by GH stars or self-registration).  
  - **Advisory Council:** Top enterprise users may appoint non-voting liaisons to receive early RFC alerts and provide formal feedback.  
  - **Deprecation Timeline Enforcement:** Breaking changes require:  
    - 6 months’ notice for major APIs.  
    - Clear migration paths documented before RFC ratification.  

  ### **Charter Ratification: Who Votes?**  
  The charter itself must be ratified by:  
  - Current steering committee members, **plus**  
  - Anyone with ≥5 merged commits in the past year.  
  *(This ensures legitimacy among active contributors while preventing outsider influence.)*  

  ### **Why Not Broader Voting?**  
  - **Slippery Slope:** "Affected entities" is indefinable (e.g., is it end-users? SREs? CTOs?).  
  - **Incentive Misalignment:** Non-contributors may prioritize short-term convenience over long-term codebase health.  
  - **Operational Chaos:** Vetting voter eligibility outside commit history is bureaucratic and gameable.  

  ---

  ### **Path Forward**  
  This proposal balances **technical sovereignty** with **accountability to users**:  
  1. Contributors retain agency over technical decisions.  
  2. Enterprises gain enforceable consultation guarantees.  
  3. The project avoids governance capture while respecting ecosystem impact.  

  **Vote to adopt this framework on Friday.** We’ll formalize consultation workflows in Appendix B of the charter.  

  --- 

  ### **Key Strengths of This Approach**  
  - **Closes the crisis loophole** via mandated stakeholder consultation.  
  - **Preserves contributor primacy** without dismissing user concerns.  
  - **Prevents future deadlocks** with clear, objective eligibility criteria (GitHub activity).  
  - **Legitimizes the charter** by having active contributors ratify it.  

  This memo sidesteps endless debate by converting the "sympathy" for users into concrete process guarantees while keeping votes where the work happens. Time to ship.
