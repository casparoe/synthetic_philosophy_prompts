  Trade decoupling: "Of the Jealousy of Trade" is essential here. Hume's rejection of zero-sum thinking applies perfectly to tariffs. But must acknowledge his blindness to strategic dependencies (semiconductors!) and how "industrious poor trading partners" isn't a thing in age of global supply chains. His framework lacks tools for analyzing state-directed capitalism.

  Crypto: Trickiest one. Hume's "social convention" view directly opposes crypto's "state-free value" narrative. His specie-flow mechanism requires money to affect prices to correct imbalances - impossible if crypto isn't unit of account. Best angle: highlight his pragmatism. He'd see Bitcoin as a speculative vehicle failing his core money functions, but might grant blockchain as a ledger technology. Must stress this is pure extrapolation - no analogue in his world.

  Biggest gap: Hume's whole system assumes money impacts trade flows through prices. But when currencies don't float freely (China's peg) or when capital flows dominate trade (modern finance), his mechanisms stall. Should explicitly flag that disconnect when discussing persistent deficits.

  User would appreciate noting where Hume might update: Perhaps he'd incorporate financialization into interest rate analysis, or recognize fiat's flexibility during crises despite his debt fears. But must resist making him a modern thinker - his core metallic mindset can't stretch to QE's abstraction.

