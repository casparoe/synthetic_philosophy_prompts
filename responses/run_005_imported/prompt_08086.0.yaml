  First, unpacking their core tension: They recognize Hume's mechanisms (specie-flow, interest rates as capital signal) are elegant but keep failing when mapped to today. The US-China trade deficit alone breaks Hume's self-correcting model. And Bitcoin? That's a double anomaly - no state backing and believers claiming value from that statelessness, which inverts Hume's "money as social convention" view.

