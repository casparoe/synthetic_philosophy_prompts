  I should emphasize his core tension: money *is* conventional (so fiat/crypto aren’t inherently absurd), but conventions require collective trust sustained by ethics and institutions—neither of which he’d find in pure fiat (without discipline) or crypto (without anchors). His "national bank" idea was about *harnessing* symbolism for public good, not unleashing abstraction. 

