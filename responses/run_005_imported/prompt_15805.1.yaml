  First, I need to disentangle Berkeley’s two strands: the *descriptive* (money as a social tool) and the *prescriptive* (money needing moral/institutional anchors). For fiat currency, he’d likely accept its symbolic nature (consistent with "ticket or counter") but stress robust governance—post-1971 systems might unsettle him if they enable irresponsible credit expansion. His South Sea Bubble trauma would resurface here. 

