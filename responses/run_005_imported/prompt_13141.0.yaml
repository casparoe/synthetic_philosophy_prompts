   However, note: the student also says "pain itself must carry all of the causal powers exercised by any of its possible realizers". This is actually correct because if pain is multiply realizable, then for pain to have the same causal role across realizers, it must have the powers that are common to all realizers? But wait, Shoemaker's view is that the realized property has a subset of the powers of each realizer. The common powers? Not exactly. The mental property M has a set of powers that must be a subset of the powers of each of its realizers. So if a realizer P1 has powers {A, B, C} and P2 has {A, B, D}, then M (pain) might have {A, B}. Then M's powers are a subset of P1 and a subset of P2. 

    The student's statement "pain itself must carry all of the causal powers exercised by any of its possible realizers" is not accurate because it implies that pain has the union of the powers of all realizers, which is not the case. Pain only has the powers that are essential to it (the ones that define pain) and these must be present in every realizer. So it's the intersection, not the union. But the student says "all of the causal powers exercised by any", which would be the union. That's too broad.

