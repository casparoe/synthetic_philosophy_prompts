  I host a podcast about science and ideas, and next week's guest is a philosopher known for defending the self-indication assumption in anthropic reasoning -- including its most notorious consequence, the presumptuous philosopher, where sheer observer-counting is supposed to make it pointless for physicists to even run the actual experiment. Draft me 8-10 interview questions that go beyond her just restating the view: I want one question each on why armchair reasoning about her own existance should outrank actual experimental evidence, on how she nails down a non-arbitrary reference class, on whether SIA really escapes the doomsday argument or just relocates the weirdness once infinite populations are on the table, and on how any of this squares with the thirder position in the sleeping beauty problem -- plus, for each, a follow-up keyed to whatever answer she's most likely to give me.
