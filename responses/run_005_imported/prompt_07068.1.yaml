  ### Defense Notes for Peer Dispute
  *   **Intensions:** Point directly to standard definitions: Primary = "scenario" (epistemic, world as actual). Secondary = "counterfactual" (world considered as counterfactual, actuality fixed). Cite lecture/textbook if possible.
  *   **Water/H2O Application:** Emphasize the logical consequence: If water *is* H2O rigidly (secondary intension necessity), it *couldn't* be false in counterfactual worlds (contra their secondary intension claim). The contingency of the primary intension (could be false if XYZ-world actual) is what makes it a posteriori.
  *   **Vindication:** Stress the *alignment* the framework aims for: Apriority tracks *primary intension necessity* (truth in all epistemic possibilities). Metaphysical necessity tracks *secondary intension necessity* (truth in all counterfactual worlds). Their answer breaks this intended parallelism.
  *   **Objection:** Acknowledge this part is excellent – it shows they understand a key philosophical debate surrounding the framework.
  *   **Overall:** Be constructive: "You clearly grasp Kripke's critique of descriptivism and the core challenge for two-dimensionalism. The main issue is the technical setup of the two intensions themselves and their application, which got reversed. Revisiting the definitions of primary vs. secondary intension and walking through the water example step-by-step with those correct definitions would clarify it."
