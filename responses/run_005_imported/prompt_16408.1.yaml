  Need to avoid making the toast too academic. Use metaphors like "universe's guest list" to keep it light. Stress that their choice allows them to focus on each other and their passions, turning the argument into a positive celebration of their union.

  Check for tone: Warm, inclusive, avoids controversy. End with a heartfelt toast to their happiness and shared life. Ensure the sister feels understood and honored, especially by her younger sibling.
