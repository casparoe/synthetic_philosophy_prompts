  The user wants a strong case for substantivalism. They mentioned Alex's point about frame-dragging as relational evidence, so I must address that head-on. Let me outline the key points. Start with Newton's core argument: inertia requires an absolute reference. Mach's relational view says it's about distant matter. In GR, frame-dragging shows local matter affects inertia, supporting Mach. But empty solutions like Minkowski space maintain inertial frames without any matter, contradicting Mach. 

