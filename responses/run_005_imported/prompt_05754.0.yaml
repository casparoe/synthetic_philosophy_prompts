  Then there's Hirshleifer's 1971 paper. He showed that public information can collapse insurance markets. If everyone learns who will suffer losses, high-risk individuals can't get insurance because premiums would be unaffordable, and low-risk individuals don't need it. This leads to a Pareto-worse outcome. The user remembers this from an econ class.

  The user wants to know why these two ideas conflict. I need to identify the differing assumptions. Good's theorem assumes individual decision-making without considering how others' actions change with new information. Hirshleifer's scenario involves strategic interactions in a market setting. When information is public, it alters the behavior of all agents, leading to market failure.

  The key difference lies in the context: isolated decisions vs. multi-agent systems. Good's theorem holds when an individual acts alone, but in markets, one person's information affects others' strategies. Also, Hirshleifer's case assumes that private information allows risk-pooling, which public info destroys. Good's theorem doesn't account for such market mechanisms.

