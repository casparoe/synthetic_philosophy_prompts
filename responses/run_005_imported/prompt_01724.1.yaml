answer: |-
  Elizabeth Anscombe's position on Truman's bombing order isn't a paradox but a deliberate rejection of **consequentialism** (like utilitarianism) in favor of **deontological ethics** grounded in **natural law theory** and Catholic moral theology. Her stance relies on two core principles:

  1.  **The Absolute Prohibition Against Intentional Killing of the Innocent:** For Anscombe, certain acts are intrinsically evil and never permissible, regardless of consequences. Deliberately targeting and killing non-combatants (the "innocent" in just war terms) falls into this category. It is **murder** by definition.
  2.  **The Doctrine of Double Effect (DDE):** This principle allows her to distinguish between *intended* evil effects and *foreseen but unintended* evil effects, while still permitting acts with both good and bad consequences under strict conditions:
      *   **The act itself must be morally good or neutral.**
      *   **The agent intends only the good effect, not the bad effect.**
      *   **The good effect must not be produced *by means of* the bad effect.**
      *   **There must be a proportionately grave reason for permitting the bad effect.**

  **Applying the Principles to Truman's Decision:**

  1.  **Intention:** Anscombe argued that the bombings *intentionally* targeted the civilian populations of Hiroshima and Nagasaki to destroy the cities and terrorize Japan into surrender. The civilians were not collateral damage from an attack on a military target; they *were* the primary target.
  2.  **Intrinsic Evil:** Intentionally killing innocent non-combatants is intrinsically evil – murder. This prohibition is absolute. No calculation of lives saved later can justify this *kind* of act.
  3.  **Violation of Double Effect:** The bombing fails the DDE test:
      *   **The Act:** Targeting a city center is not a morally neutral or good act in itself.
      *   **Intention:** The death and terror of civilians *was* intended as the direct means to force surrender (the good effect). The good effect *was produced by means of* the bad effect.
      *   **Proportionality:** Even if proportionality *could* justify *foreseen* civilian deaths as a side-effect (e.g., bombing a legitimate military target knowing civilians nearby would die), it cannot justify *intentionally* killing them as the direct means to an end.

  **Rejecting Utilitarianism, Avoiding Pacifism:**

  *   **Rejecting Consequentialism:** Anscombe fundamentally rejected the utilitarian framework that justifies an act *solely* based on its net positive outcome. For her, morality is defined by the nature of the act itself and the intention behind it. An intrinsically evil act (like intentional killing of innocents) cannot be "vindicated" by good consequences; it remains morally wrong. The utilitarian calculation is irrelevant to the *moral character* of the act.
  *   **Avoiding Pacifism:** Anscombe accepted the traditional **Just War Theory** framework. This allows for the *possibility* of morally justified warfare under strict conditions, including:
      *   **Legitimate Authority**
      *   **Just Cause**
      *   **Right Intention**
      *   **Last Resort**
      *   **Probability of Success**
      *   **Proportionality** (the good achieved must outweigh the destruction caused)
      *   **Discrimination (Non-combatant Immunity):** **This is the key.** Combatants may be targeted intentionally because they pose a direct threat. Non-combatants must never be *intentionally* targeted. Killing combatants in a just war is not murder; intentionally killing non-combatants always is.

  **Conclusion:**

  Anscombe's position is consistent:

  1.  **Atomic Bombings = Murder:** Because they intentionally targeted and killed innocent non-combatants as a direct means to an end. This act is intrinsically evil and absolutely prohibited.
  2.  **Utilitarianism Rejected:** The calculation of lives saved is morally irrelevant to the *intrinsic wrongness* of the act. Consequentialism is a flawed and dangerous moral framework that justifies atrocities.
  3.  **Pacifism Avoided:** Traditional Just War Theory provides a framework for evaluating the morality of warfare that condemns intentional attacks on non-combatants (*murder*) while permitting the use of force against legitimate military targets under strict conditions. Killing enemy soldiers in a just war, when necessary and proportionate, is not intrinsically evil like murdering civilians.

  Anscombe's vehement objection stemmed from her belief that Truman's order violated the most fundamental moral absolute – the prohibition against intentional killing of the innocent – and that Oxford's honor bestowed legitimacy on an act she considered unequivocally murderous, regardless of its consequences. Her concession about the bombings shortening the war was a factual observation, not a moral justification; it didn't change the nature of the act itself.
