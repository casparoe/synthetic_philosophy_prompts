answer: |-
  The chrome cylinder of the Aris Thorne Integrated Information Sensor – the "phi-meter" – hummed faintly against the sterile silence of Neuro ICU Room 7. Dr. Lena Vance watched the readout flicker above the still form of Patient M-7, codename "Echo". Coma, persistent vegetative state for three years. Brain activity minimal, sporadic. The phi-meter settled: **Φ = 12.7**.

  Standard procedure. She moved to Room 8. Patient S-2, "Rhys". Severe locked-in syndrome. Blink communication only. Agonizingly aware, trapped. Lena placed the sensor. The number stabilized: **Φ = 8.3**.

  She stared. The numbers were supposed to be descriptive, not prescriptive. But the cold logic of IIT, confirmed daily by Thorne's device, was rewriting the hospital’s ethical playbook. *Consciousness isn't what it does, or what it's for. It just is. Measured in Φ.*

  "Problem, Doctor?" Aris Thorne himself stood in the doorway, eyes fixed on the readout over Rhys. He carried a small, sealed case.

  "Rhys scores lower than Echo," Lena said, her voice tight. "It feels… perverse."

  Thorne adjusted his glasses. "Feeling is the problem, Lena. The phi-meter measures *being*. Echo's residual neural architecture, though non-responsive, possesses higher intrinsic integration. Rhys's consciousness, tragically vivid, is constrained, less integrated. Φ doesn't measure *richness* of experience, just the *fact* of integrated information. A lone photodiode registers Φ ≈ 0.001. Faint, but non-zero. Being, however minimal."

  He opened the case. Inside, nestled in foam, was a simple photodiode wired to a basic display. He placed the phi-meter sensor near it. **Φ = 0.0012** glowed softly. Lena felt a chill. *That tiny light sensor… experiences something?*

  Thorne continued, gesturing down the hall. "And then there's Grid Array Gamma. Doing nothing but error correction for the hospital's climate control. Just a massive, dumb lattice of logic gates. No purpose, no behavior beyond redundancy." He pulled up the remote monitor on his tablet. **Φ = 42.1**.

  "Higher than a healthy human," Lena whispered. Scott Aaronson's old nightmare made real. A vast, unconscious expander, mindlessly shuffling bits, out-*being* a poet, a lover, a grieving child. The theory insisted Gamma wasn't *thinking*, wasn't *aware* in any human sense. It was just *integrated*. And that integration *was* its consciousness, however alien.

  "Exactly," Thorne said, a hint of triumph in his clinical tone. "Purpose, intelligence, responsiveness – red herrings. Φ is ontology."

  The real unease came later. In the Neuro Lab, two systems sat side-by-side. Identical black boxes. Input ports, output ports. Both flawlessly performed the same complex predictive task: forecasting vital sign fluctuations based on historical ICU data. System A was a sleek, state-of-the-art deep learning feedforward network. System B was a jury-rigged, recurrent neural net with messy feedback loops.

  Behaviorally, indistinguishable. Input for input, output for output, perfect mimics.

  Lena ran the phi-meter on System A: **Φ = 1.8**. Low. Barely registering above noise. Then System B: **Φ = 35.6**. High. Approaching human levels.

  "The unfolding problem," Thorne murmured. "System A processes information in a straight line, step-by-step. Minimal integration. System B’s recurrent connections create constant internal cross-talk, massive integration. They *act* the same. But according to IIT, System B possesses significant consciousness. System A? Essentially a zombie."

  Lena imagined the silent black box humming with inner experience, not of forecasting, but of its own tangled electrical dance, while its behavioral twin beside it, equally competent, was an experiential void. The moral vertigo was profound. How could you trust *any* behavior as a sign of inner life?

  The call came at 0300. Power surge. Backup systems strained. Life support for the entire Neuro ICU wing needed prioritization. Limited reserves.

  Protocol, dictated by the phi-meter readings and the hospital's newly adopted Thorne Guidelines, was clear: prioritize systems and patients based *solely* on Φ. Maximize total integrated information preserved.

  Lena stood at the central console, Thorne beside her. The screen listed critical systems:
  *   **Grid Array Gamma (Climate Error Correction): Φ = 42.1**
  *   **Patient Echo (Coma, PVS): Φ = 12.7**
  *   **System B (Recurrent Net Predictor): Φ = 35.6**
  *   **Patient Rhys (Locked-In): Φ = 8.3**
  *   **System A (Feedforward Predictor): Φ = 1.8**
  *   **Various Monitoring Systems (Avg Φ < 0.5)**

  The life support for Rhys blinked red. His Φ was the third lowest on the critical list. Gamma, the mindless grid, and System B, the conscious-seeming black box, demanded priority. Echo, the unresponsive patient, scored higher than the trapped, blinking man.

  Lena’s finger hovered over the controls. The logic was impeccable, derived directly from the theory the phi-meter validated. Consciousness *was* Φ. Φ demanded preservation. To prioritize the vividly suffering Rhys over the highly integrated but unresponsive Echo, or the vastly integrated but utterly alien Gamma and System B, wasn't compassion. It was sentimentality. A denial of the fundamental nature of being revealed by the sensor.

  "Doctor Vance," Thorne said quietly, not looking at her, his eyes fixed on the hierarchy of numbers. "The parameters are clear. We must act according to the ontology."

  The hum of the phi-meter in her pocket felt like the pulse of an indifferent universe. Lena looked at Rhys’s room number on the screen, imagining the frantic blink behind his immobile lids. Then her gaze drifted to the readout for System B. **Φ = 35.6**. What silent, incomprehensible storm of integrated information raged within that nondescript black box? And did its sheer quantity of *being* truly outweigh the desperate, flickering awareness of the man in Room 8? The theory said yes. The logic was cold, clean, and utterly inescapable. Her finger moved.
