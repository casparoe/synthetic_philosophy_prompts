answer: |-
  ## Dialogue: The Attitude Labyrinth of Negation

  **Characters:**  
  *   **Alex (Expressivist):** Defends a Gibbard/Blackburn-style attitude logic.  
  *   **Jordan (Critic):** Presses the Unwin/Schroeder negation problem.  

  **(Setting: A philosophy department common room, late afternoon.)**

  **Jordan:** Alex, I appreciate the expressivist ambition to ground meaning in attitudes, not propositions. But even if we grant that your "hyperplan" or "commitment" logic handles embedded contexts like conditionals – "If lying is wrong, then..." – the negation case feels like a deeper fracture. Take your core move: "Lying is wrong" expresses disapproval of lying. Fine. What, *exactly*, does "Lying is not wrong" express?

  **Alex:** It can't be the mere absence of disapproval, you're right. That *is* compatible with indifference or ignorance. "Not wrong" expresses a distinct, positive attitude: **tolerance** towards lying. Or, framing it in Gibbard's terms, it's the state of *planning not to condemn* lying. It's an active stance, not just a lack.

  **Jordan:** Alright, let's run with that. So "Lying is wrong" = Disapproval(D-lying). "Lying is not wrong" = Tolerance(T-lying) or Plan-not-to-condemn(P~C-lying). Now, consider the logical relation. "Not wrong" is supposed to be the *negation* of "wrong." But what's the *logical* relation between Disapproval(D) and Tolerance(T)? Or between Plan-to-condemn(P-C) and Plan-not-to-condemn(P~C)?

  **Alex:** Contradiction! They are incompatible attitudes. You cannot coherently *both* disapprove of lying *and* be tolerant of it in the same breath. Similarly, you cannot plan to condemn lying and simultaneously plan not to condemn it. That’s the clash. The logic mirrors propositional negation through attitude incompatibility.

  **Jordan:** But *incompatibility* isn't the same as *negation*. Propositions have a neat symmetry: ¬P is true iff P is false. The negation *exhausts* the alternative. Here, what about the vast territory *between* disapproval and tolerance? Indifference? Uncertainty? Ignorance? These aren't Tolerance(T), but they also aren't Disapproval(D). Your "negation attitude" Tolerance(T) seems to carve out only *one specific alternative* to Disapproval(D), leaving other non-D states untouched. But "not wrong" should cover *all* those non-D states – it should be the *complement* of D. Tolerance(T) isn't the complement; it's a specific subset of the complement.

  **Alex:** That's a mischaracterization. Within the normative domain we're modeling, the relevant attitudes *are* exhaustive. When considering whether an act is forbidden (wrong) or not, the fundamental options *are* disapproval (forbidding) or the absence of that disapproval, which we characterize as tolerance (permitting). Indifference *is* a form of tolerance in this context – it’s planning *not to condemn*, even if not actively endorsing. Ignorance might involve *withholding* both attitudes, but that’s a different cognitive state, not the expression of a normative judgment itself. "Lying is not wrong" *expresses* a settled normative stance of permission, which *excludes* disapproval.

  **Jordan:** But that's precisely where the propositional ghost re-enters. You're *defining* your attitude set ("disapprove" vs. "tolerate/permit") to be exhaustive and mutually exclusive *relative to a specific normative question*. Isn't that just *stipulating* the logical structure you need? You've effectively smuggled in the proposition "Lying is wrong" (true iff disapproval, false iff tolerance) and then *labeled* the attitudes accordingly. The attitude logic isn't *recovering* the negation; it's *presupposing* the very propositional content and its negation that expressivism sought to avoid. The attitudes are just placeholders for truth-values.

  **Alex:** No, the attitudes are primary! Think dynamically, like Blackburn. To *accept* "Lying is not wrong" is to commit to a pattern of planning and feeling: *not* feeling guilt for lying, *not* blaming others for lying, *not* planning to prevent lying. To accept "Lying is wrong" commits you to the opposite patterns. The incompatibility arises *from the practical clash* of these commitments. You can't stably plan both to condemn and not to condemn the same act. The "exhaustiveness" emerges from the practical demands of navigating the world – you need *some* stance towards lying to act coherently. Logic supervenes on the practical impossibility of holding incompatible commitments simultaneously.

  **Jordan:** Hold on. Let's grant that practical incompatibility. But does it capture the *inference* we need? If I accept "It is not the case that lying is wrong" (which expresses Tolerance(T)), and I accept "If lying is not wrong, then telling Joe to lie is permissible" (which expresses some complex commitment linking T-lying to P-telling-Joe), then I must accept "Telling Joe to lie is permissible." Does your attitude logic *mandate* that if I have the T-lying attitude and the conditional commitment attitude, I *necessarily* form the P-telling-Joe attitude? Or could I just have a disconnected set of attitudes?

  **Alex:** The whole point of developing the logic of attitudes – the "biforcated attitude" semantics Gibbard works on – is to define the *logical* relations *as* constraints on combinations of attitudes. So yes, the system is designed such that holding the attitudes expressed by the premises *rationally requires* holding the attitude expressed by the conclusion. It's a normative constraint on rationality itself.

  **Jordan:** But now look at the negation *within* that system. You have your basic attitude A (disapproval). You define its "negation" as a *different* basic attitude, ~A (tolerance). Now, what is the negation of *~A*? What attitude expresses "It is not the case that lying is not wrong"?

  **Alex:** That would be... disapproval of tolerance? Or perhaps a higher-order commitment? "Not (not wrong)" should be equivalent to "wrong." So it should express Disapproval(D) again.

  **Jordan:** Exactly! So you have:
  *   ¬(Wrong) = T
  *   ¬(T) = D

  But ¬(T) is "not (tolerant)", which should be the *complement* of T. Yet you've defined it to be identical to D (Disapproval). But is Disapproval(D) *really* the entire complement of Tolerance(T)? What about that indifference/ignorance space again? According to your mapping, ¬T *must* equal D. But that means your system *equates* "not tolerant" with "disapproving." It *collapses* all non-tolerant states into disapproval. But that seems descriptively false – I can be *not tolerant* (maybe I'm uncertain or think it's a non-issue) without actively *disapproving*. You've *defined* the attitude set so narrowly (D vs. T) that the negation operation forces this collapse. You haven't solved the problem of the "gap" between attitudes; you've *eliminated* the gap by fiat, making your two attitudes exhaustive. But this exhaustiveness is artificial – it's dictated by the *logic you want to recover*, not by an independent phenomenology of attitudes. The propositional content ("lying is wrong" with its two truth values) is still calling the shots from offstage, structuring your attitude ontology.

  **Alex:** ...You're pushing hard on the boundaries of descriptive psychology versus normative modeling. The expressivist project isn't to catalog every possible human feeling. It's to model the *commitments constitutive of normative judgment*. The judgment that something is wrong *just is* the commitment to disapprove. The judgment that it is *not* wrong *just is* the commitment *not* to disapprove – which, in the context of deliberation about what to do, *is* the commitment to permit or tolerate. The "exhaustiveness" isn't artificial; it's *constitutive* of what it *means* to make a normative claim. Ignorance and indifference aren't *normative judgments*; they're the *absence* of judgment. Your "gap" exists *outside* the domain of expressed normative commitments. Within the domain of expressed commitments, D and T *are* exhaustive and contradictory.

  **Jordan:** But then the Unwin/Schroeder point crystallizes: If "not wrong" expresses T, and T is a *primitive* attitude distinct from D, then the *logical* relation between "wrong" (D) and "not wrong" (T) is just the *brute incompatibility* of these two primitive attitudes. There's no *deeper* explanation for why they contradict each other; it's a fundamental postulate of your system. Whereas with propositions, the contradiction between P and ¬P is explained by their *semantic content* and the nature of truth/falsity. Expressivism seems to trade a semantic explanation for a brute, psychological one. And worse, this brute incompatibility has to be replicated for *every* distinct normative predicate, and then meticulously wired into a complex logic of attitudes to mimic the propositional calculus. The charge of ad hoc complexity and explanatory thinness looms large. Have you truly avoided propositions, or just buried them under layers of stipulated attitude relations?

  **Alex:** It's not "brute" in an explanatory vacuum! The incompatibility flows from the *practical* roles these attitudes play in guiding action and feeling. You can't *act* on both D and T towards the same act. *That's* the foundation. The logic is an attempt to systematize these practical constraints. It's complex, yes, but the world of normative discourse *is* complex. Propositions with truth conditions might *look* simpler, but they obscure the non-representational, practical nature of the underlying state. The attitude logic *is* the explanation; it doesn't *need* a deeper semantic layer.

  **Jordan:** Then perhaps we've hit the bedrock disagreement. To me, the inability to cleanly capture negation as the *complement* without either collapsing distinctions or relying on stipulated incompatibility reveals that attitudes alone are insufficient carriers for the full logical structure we attribute to normative language. The propositional shadow is inescapable. Your system *works*, in a technical sense, by carefully constructing an attitude analogue, but the cost is accepting that the fundamental logical relation – contradiction – is a primitive, unexplained feature of your chosen psychological primitives, rather than emerging from their content. Schroeder's worry stands: either the negation relation isn't properly recovered (if you allow a gap), or it's recovered only by building propositional structure into the attitude framework from the start (by defining D and T as exhaustive contradictories). The expressivist gains no clear advantage on this front.

  **Alex:** And I maintain that the practical foundation provides the necessary explanation, and that the "propositional structure" you see is an *emergent* feature of the practical logic of commitments, not a presupposed ghost in the machine. We model the phenomena of reasoning with the tools that fit its nature – planning states, commitments, incompatible prescriptions. Calling it "propositional" after the fact misses the point of the explanatory project. The negation problem is hard, but not fatal; it just demands a more nuanced logic of practical stances than critics often allow.

  **Jordan:** Nuanced, perhaps. But whether it's ultimately *explanatory*, or merely a complex redescription... that, I fear, remains the unresolved tension. *(Picks up coffee cup, the discussion clearly paused but far from concluded).*

  **Key Moves Engaged:**
  1.  **Expressivist Move:** Define "not wrong" as a positive attitude (Tolerance, Plan-not-to-condemn).
  2.  **Critic's Challenge:** This attitude is only *one* alternative to disapproval, not the logical complement (neglects indifference/ignorance).
  3.  **Expressivist Move:** Within the domain of *normative judgment*, disapproval and tolerance *are* exhaustive and practically incompatible.
  4.  **Critic's Challenge:** This exhaustiveness is stipulated to mimic propositional logic (D = True, T = False); attitudes don't naturally exhaust the space. Negation of T collapses back to D artificially.
  5.  **Expressivist Move:** Exhaustiveness is constitutive of normative commitment; indifference/ignorance are *non*-judgmental states. Practical incompatibility grounds the logic.
  6.  **Critic's Challenge:** The incompatibility is brute/primitive, lacking the explanation semantic negation has. The system is complex and ad hoc, effectively reintroducing propositional structure via attitude definitions. The core Unwin/Schroeder dilemma (gap vs. stipulation) remains unresolved.
  7.  **Expressivist Counter:** Practical role provides explanation; propositional appearance is emergent, not presupposed. Complexity reflects the subject matter.

  **(End of Dialogue)**
