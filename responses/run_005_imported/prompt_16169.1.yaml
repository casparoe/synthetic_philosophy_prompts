  What about unity? IIT's irreducibility might seem like unity, but Leibniz would argue it's derived unity, not the true simplicity of a monad. The monad's unity is indivisible, while a composite can always be divided, even if it's functionally integrated. 

  So Leibniz would say Φ is measuring a real property—the degree of interdependence—which might correspond to a system's complexity or coordination. But that's not consciousness. Perception belongs to the monads themselves, not the system. The system's integration is just the harmony pre-established by God among monads. 

