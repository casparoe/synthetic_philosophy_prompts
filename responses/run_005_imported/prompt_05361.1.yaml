answer: |-
  ### Dialogue: Deflationism and the Conservativeness Objection

  **Characters:**
  - **Deflationist (D):** Defends a Horwich-style minimalism about truth. Technically informed but focused on the metaphysical lightness of truth.
  - **Critic (C):** Presses the conservativeness objection, emphasizing proof-theoretic consequences. Knowledgeable about formal theories of truth.

  **Setting:** A philosophy department lounge, late evening. Coffee cups and papers litter the table.

  ---

  **C:** Let’s revisit the conservativeness objection. You say truth is just a disquotational device—metaphysically thin and explanatorily idle. Fine. Then adding a truth predicate to a base theory like Peano Arithmetic (PA) should be *conservative*. It shouldn’t prove any new arithmetical sentences. But it’s not conservative! Compositional truth theories—like CT, with Tarski biconditionals and compositional clauses—prove \(\text{Con}(\text{PA})\), which PA can’t prove by Gödel’s second incompleteness theorem. If truth is so thin, why does it pack this logical punch?

  **D:** I agree that CT is non-conservative. But your objection conflates two things: the *essence* of truth and the *logical resources* we deploy alongside it. Truth itself is defined by its disquotational role—the Tarski biconditionals like \(\text{True}(\ulcorner \phi \urcorner) \leftrightarrow \phi\). That’s the core deflationary commitment. The non-conservativeness arises from extending *induction* to formulas with the truth predicate, not from truth itself. Truth is inert; it’s the induction schema doing the heavy lifting.

  **C:** That’s ad hoc. You can’t separate them. The compositional axioms in CT—like \(\text{True}(\ulcorner \phi \land \psi \urcorner) \leftrightarrow (\text{True}(\ulcorner \phi \urcorner) \land \text{True}(\ulcorner \psi \urcorner))\)—are part of what allows the proof of \(\text{Con}(\text{PA})\). And you need those axioms to express generalizations like "All PA-theorems are true." If you ditch compositionality, you lose the generalizations deflationism promises. But with compositionality, you get non-conservativeness. Your disquotational core isn’t enough.

  **D:** Not so fast. The deflationist doesn’t need CT. We can use a weaker, disquotational truth theory—call it DT. It has the Tarski biconditionals for the base language (no truth predicate in \(\phi\)) and *no induction for formulas containing ‘True’*. DT *is* conservative over PA. That’s a theorem. So truth, in its minimal form, adds no new arithmetical content. Problem solved.

  **C:** Nice try, but DT is too weak. It doesn’t prove \(\forall x (\text{Prov}_{\text{PA}}(x) \rightarrow \text{True}(x))\)—the global reflection principle stating that all PA-theorems are true. You said truth’s job is to express generalizations we couldn’t otherwise state. DT fails at that! Without compositionality and extended induction, you only get a *schema*: for each specific \(\phi\), DT proves \(\text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow \text{True}(\ulcorner \phi \urcorner)\). But you can’t quantify over sentences. That’s useless for real reasoning—like proving \(\text{Con}(\text{PA})\) or discussing all theorems at once.

  **D:** I disagree. The schema *is* sufficient for deflationism. For any particular \(\phi\), if PA proves \(\phi\), DT proves it’s true. That captures the generalization in practice. We don’t need a single quantified sentence for truth to do its job. Quantification is a red herring—deflationism is about avoiding ontological commitment, not enabling every metamathematical maneuver.

  **C:** But the schema doesn’t let you *infer_ new things. Suppose I want to show that PA + \(\phi\) is consistent if PA proves \(\phi\). I need the universal to handle arbitrary \(\phi\). With just the schema, I’m stuck. And isn’t that exactly the kind of thing deflationists celebrate—using truth to streamline reasoning?

  **D:** Fair point, but this is where deflationism gets subtle. Truth’s primary role is disquotation and schematic generalization. Proving \(\text{Con}(\text{PA})\) is a _derivative_ use, requiring additional resources. I accept that DT can’t do it. But why must deflationism provide a truth theory that proves everything we might want? Truth isn’t magic; it’s a tool with limits. If you insist on compositionality, I’ll bite the bullet: the non-conservativeness of CT doesn’t refute deflationism because it stems from induction, not truth. Consider this:  
  - The Tarski biconditionals alone (without extended induction) are conservative.  
  - Adding induction for truth-containing formulas is a separate choice—a logical “amplification” of the base theory.  
  Truth remains metaphysically thin; the amplification is about our reasoning, not truth’s nature.

  **C:** But induction over truth *presupposes_ that truth is well-defined—robust enough to support reasoning about all numbers. If truth is just disquotation, why trust induction over it? And \(\text{Con}(\text{PA})\) is a purely arithmetical sentence—no ‘True’ in it. CT proves it, PA doesn’t. That’s non-conservativeness in the standard sense. How is that benign for deflationism?

  **D:** First, \(\text{Con}(\text{PA})\) is metamathematical—it’s about PA’s syntax, not just numbers. Deflationism allows truth to aid metatheoretic reflection without being substantive. Second, the non-conservativeness is “benign” because it only proves truths PA already “intends” (if consistent). Truth makes explicit what’s implicit in PA. Shapiro and Ketland treat conservativeness as a test for substantiality, but that’s question-begging. Why assume a thin truth can’t have logical power? Look at provability predicates: they’re syntactically defined but non-conservative (e.g., GL proves Löb’s theorem). Yet no one calls them “substantive.”

  **C:** Provability is a different beast. Truth, on your view, is supposed to be *merely* expressive. But in CT, it’s generative—it yields new arithmetical knowledge. That suggests explanatory depth. Admit it: CT’s truth *does* work—it explains PA’s soundness.

  **D:** I concede CT proves soundness, but not that truth “explains” it. Soundness is proved via induction on proof complexity, using compositionality. Truth facilitates the proof; it doesn’t ground it. The real “work” is done by PA’s own resources, amplified. Think of truth as a lens: it focuses PA’s inductive power onto syntax. The lens isn’t substantive; it’s optically efficient.  
  Still, I’ll offer a compromise. Deflationists can endorse a *typed* disquotational theory. Add a hierarchy of truth predicates: \(\text{True}_0\) for base language, \(\text{True}_1\) for \(\mathcal{L} \cup \{\text{True}_0\}\), etc. At each level, we get conservativeness and can express generalizations like “All PA-theorems are \(\text{True}_0\).” No non-conservativeness, no loss of generalization.

  **C:** Typed theories avoid \(\text{Con}(\text{PA})\), but they’re artificial and restrictive. We intuitively think truth is univocal, not stratified. And in the real world, we *use_ untyped truth to prove consistency. Deflationism should accommodate that.

  **D:** But deflationism is a metaphysical thesis, not a user manual for formal systems! We can use untyped truth pragmatically while insisting it’s metaphysically thin. Or we can accept that CT’s non-conservativeness is a trade-off for expressive power, without betraying deflationism. Truth isn’t “thick” just because CT proves \(\text{Con}(\text{PA})\); it’s still defined by disquotation. The proof-theoretic consequence doesn’t entail metaphysical gravity.

  **C:** I’m unconvinced. If truth lets CT outperform PA on arithmetical facts—even metamathematical ones—it’s hard to see it as “insubstantial.” But I’ll grant that your responses aren’t trivial. You’ve shifted the burden: now I need to show why conservativeness is indispensable to deflationism, not just a nice-to-have.

  **D:** And I’ll concede that deflationism faces a dilemma: either accept DT’s conservativeness but lose robust generalizations, or embrace CT’s power but explain away non-conservativeness. I prefer the first horn—schematic generalization is enough—but I see why you find it unsatisfying. Let’s leave it unresolved. The technical points are knottier than either of us realized last night.

  **C:** Agreed. This isn’t over—but I’ll need stronger coffee next time.

  ---

  **Key Technical Points Engaged:**
  - **D’s core defense:** Separates the disquotational essence of truth from the role of extended induction. Cites conservativeness of DT (Tarski biconditionals without induction for ‘True’) over PA.
  - **C’s pushback:** Highlights DT’s inability to prove quantified generalizations (e.g., global reflection) and its limitations for metatheoretic reasoning.
  - **D’s nuanced retreat:** Argues that schematic generalization suffices for deflationism’s aims, and CT’s non-conservativeness stems from logical resources (induction), not truth itself. Suggests typed disquotation as an alternative.
  - **C’s persistent challenge:** Insists that truth’s ability to prove new arithmetical facts (like \(\text{Con}(\text{PA})\)) conflicts with deflationary metaphysics, even if mediated by induction.
  - **Unresolved tension:** Whether conservativeness is a necessary condition for deflationism, and whether schematic generalization is sufficiently expressive. Neither side concedes, but both engage the technical specifics.
