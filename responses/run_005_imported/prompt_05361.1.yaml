  D: It's doing logical work, but not metaphysical work. The idea is that the truth predicate allows us to express and prove things that we couldn't before, but that doesn't mean that truth is a metaphysically robust property. It's still defined by the Tarski biconditionals.

  C: I'm not convinced. It seems to me that if the truth predicate allows us to prove new arithmetical facts, then it must be tracking something real.

  D: But what is the new arithmetical fact? Con(PA) is a statement about the consistency of PA, which is a formal property. It's not a statement about the natural numbers in the same way that the twin prime conjecture is. It's a statement about the absence of a proof of contradiction. So it's inherently metamathematical. The truth predicate gives us a way to internalize metamathematics in the object theory. That doesn't mean that truth is a substantive property; it means that we've built a system that can talk about its own syntax.

