prompt: |-
  A friend and I spent a long evening arguing about deflationism about truth and got stuck on one specific technical point neither of us could resolve. I was defending something close to Horwich-style minimalism: "true" is just a device for disquotation and for stating generalizations we couldn't otherwise express, and it does no further explanatory work. My friend, who knows more proof theory than I do, raised the conservativeness objection (a version of it goes back to Stewart Shapiro and Jeffrey Ketland): if truth is really that thin, extending a base theory like Peano Arithmetic with a truth predicate ought to be conservative — it shouldn't let you prove any new arithmetical sentences beyond what the base theory already proves on its own. Yet the compositional truth theories that actually deliver the generalizations deflationists care about are demonstrably non-conservative over PA: they let you prove PA's consistency, which by Gödel's second incompleteness theorem PA cannot prove of itself. I didn't have a good reply on the spot. Could you write a dialogue between a deflationist and a critic pressing this objection, in which the deflationist has a genuine, technically serious response rather than just reasserting that truth is metaphysically insubstantial, and the critic engages with that specific response instead of repeating the original point? Neither side should be a pushover, and it's fine if they don't reach a resolution — I'd rather see real engagement than a tidy ending.
reasoning: |-
  We are going to write a dialogue between a deflationist (D) and a critic (C) about the conservativeness objection to deflationism about truth. The critic will press the objection that adding a truth predicate to PA (Peano Arithmetic) should be conservative if truth is deflationary, but in fact compositional truth theories (like CT, which includes the Tarski biconditionals and compositional clauses) are non-conservative because they prove the consistency of PA. The deflationist must offer a technically serious response.

  The deflationist might respond by distinguishing between different kinds of conservativeness, or by challenging the necessity of having a truth theory that proves the consistency of PA. One well-known deflationist response (from Horwich and others) is to argue that the truth theory the deflationist needs is not the full compositional theory but a different, more minimal theory that is conservative. For example, the theory of truth might be restricted to the Tarski biconditionals for the base language (without the truth predicate) and not include induction for formulas with the truth predicate. This minimal theory (sometimes called the "disquotational theory") is conservative over PA. However, the critic will note that such a minimal theory does not prove the generalizations that the deflationist claims are important (like "All theorems of PA are true"). 

  So the deflationist might have to bite the bullet and say that the truth predicate does not need to prove such generalizations in a strong, object-language way. Alternatively, the deflationist might argue that the generalization can be understood as a schema, and that is enough. 

  Another route is to question whether the non-conservativeness of the compositional theory really undermines deflationism. The deflationist might argue that the truth predicate is still metaphysically thin even if it has logical power, because the non-conservativeness comes from the way the truth predicate interacts with the base theory (via induction extended to the truth predicate) and not from any substantial property of truth.

