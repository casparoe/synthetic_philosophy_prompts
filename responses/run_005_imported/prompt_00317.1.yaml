prompt: |-
  I'm a tech lead at a mid-sized software company, and I've run into a management puzzle I can't quite articulate to my own manager, let alone resolve. Over the summer we ran a structured internship program: interns worked through a fixed backlog of well-specified tickets, and we graded them almost entirely on ticket throughput plus a code-review checklist (test coverage percentage, PR description completeness, linting, that kind of thing). One intern, I'll call him Dan, was by far our top performer under that system, closing more tickets than anyone else while hitting every item on the checklist nearly every time.

  We converted Dan to full-time and moved him onto our main team, where the work is far more open-ended: he sets his own priorities, tickets are vague, and there's no rigid checklist to satisfy. Since the transition, his output looks fine on paper, high ticket counts, green checkmarks everywhere, but the actual product keeps breaking in ways the old rubric never would have caught. He writes tests that technically pass but don't meaningfully cover edge cases, and he'll decompose a genuinely hard problem into a pile of narrowly "closed" tickets that don't add up to a working feature. When I've raised this with him, he isn't being cynical or lazy about it; he seems honestly convinced he's doing exactly what good engineering looks like, because that's precisely what got him praised and promoted a few months ago.

  I'm trying to figure out how to think about this rather than just chalk it up to "he's not that good, actually." Was this a bad hire, a badly designed internship rubric, or something more structural, something about how the specific metrics we trained and evaluated him against shaped what he actually internalized as "doing a good job," in a way that only became visible once he was moved into an environment different from the one he was evaluated in? I'd like help understanding what's really going on here conceptually, and what that understanding implies both for how I coach Dan going forward and for how we design evaluation criteria in future internship programs, so we're not inadvertently producing more engineers like him.
reasoning: |-
  Okay, let me unpack this tech lead's problem. They've got a star intern who excelled in a structured environment but is now struggling with open-ended work. The core tension seems to be between measurable outputs and actual outcomes - Dan's hitting all the metrics but the product keeps breaking. 

  Hmm, the key insight here might be about how evaluation systems shape behavior. That internship rubric was like training wheels: it taught Dan to optimize for completion speed and surface-level quality, but never required him to develop systems thinking or judgment. Now that the training wheels are off, he's applying the same playbook to complex problems where it doesn't work. 

  What's interesting is Dan's genuine confusion when criticized - he's not cutting corners, he's faithfully executing what worked before. This suggests the internship program accidentally created what psychologists call "learned helplessness" around ambiguity. The checklist was so comprehensive it prevented him from developing his own quality heuristics.

  The real danger isn't Dan - it's that the system keeps rewarding this. Those green checkmarks are lying to everyone. When his tests pass but miss edge cases, or when he splits a feature into meaningless subtasks, the metrics still show "success." That's how you get cargo cult engineering.

  For fixing this... first we need to acknowledge the internship program was basically a video game with exploitable mechanics. Future versions should build in ambiguity - maybe have interns troubleshoot buggy systems or design small features from vague specs. Evaluation should include "negative space" metrics like bugs escaped to production or mentor intervention frequency.

  With Dan, the approach can't be "you're doing it wrong" but "the game changed." He needs concrete examples showing how his current approach creates downstream fires. Pair him with seniors who model systems thinking aloud. Most importantly, we must change what we measure - cycle time over ticket count, customer impact over PR checklist items.

  The silver lining? This exact mismatch is why Google's Project Oxygen found technical expertise correlates poorly with senior engineer success. Dan might still become great - he just needs unlearning time and better scaffolding.
answer: |-
  This is a brilliant articulation of a very common systems failure in engineering management. You're absolutely right to look beyond "Dan isn't good" – the core issue is **incentive misalignment and a gap in skill development caused by the evaluation framework itself.** Let's break this down conceptually:

  **The Core Conceptual Problem: "The McNamara Fallacy" in Engineering**

  You're experiencing a manifestation of the **McNamara Fallacy** (named after the US Secretary of Defense during Vietnam):

  > *"The first step is to measure whatever can be easily measured. This is OK as far as it goes. The second step is to disregard that which can't be easily measured or to give it an arbitrary quantitative value. This is artificial and misleading. The third step is to presume that what can't be measured easily really isn't important. This is blindness. The fourth step is to say that what can't be easily measured really doesn't exist. This is suicide."*

  Your internship program did steps 1 & 2 brilliantly for its *specific context*. The problem arose when Dan (and potentially the system) fell into steps 3 & 4 upon moving to the main team.

  **Why the Internship Rubric Worked (For Internships) but Failed (For Real Work):**

  1.  **Environment Match:** The internship backlog was **pre-digested complexity**. Problems were already broken down, scoped, and specified. Success *could* be measured by throughput and checklist adherence.
  2.  **Focus on Execution, Not Discovery:** The rubric measured **efficient execution of defined tasks**, not **problem discovery, solution design, or holistic system thinking**.
  3.  **Absence of Ambiguity:** There was no "unknown unknown" space. The checklist covered *known* quality gates.
  4.  **Short-Term Focus:** The internship was finite. Long-term maintainability, edge case resilience, or architectural coherence weren't primary concerns measured by the rubric.
  5.  **Incentive Structure:** Dan learned that **maximizing the visible metrics (ticket count, checklist ticks) = success and reward**. He internalized this as the definition of "good engineering."

  **What Happened When Dan Moved Teams (The Mismatch):**

  1.  **The Rubric Didn't Scale:** The main team's work involves **ill-defined problems, ambiguity, and emergent complexity**. The old metrics became **lagging indicators** (showing activity) but not **leading indicators** of actual value or robustness.
  2.  **Dan Optimized for the Wrong Thing:** Dan, understandably, applied the successful strategy he learned. He focused on:
      *   **Maximizing Ticket Closure:** Splitting hard problems into easily "closable" but meaningless subtasks.
      *   **Checking Boxes:** Writing tests that pass the *coverage percentage* but miss *meaningful validation*. Ensuring PRs *look* complete but don't necessarily solve the *right* problem well.
      *   **Avoiding Ambiguity:** Treating the ticket *as written* as the absolute requirement, rather than understanding the underlying user need or system behavior.
  3.  **The System Validated Him:** Because the *visible metrics* (ticket count, checklist passes) still looked good, the system (including potentially you initially) unintentionally reinforced his behavior. The *actual failures* (broken features, missed edge cases) were invisible to the old rubric and often surfaced later.
  4.  **Skill Gap Exposed:** The internship didn't develop (and the rubric didn't measure) the critical skills needed for open-ended work:
      *   **Problem Framing & Decomposition:** Truly understanding the *why* and breaking it down into *valuable* steps.
      *   **Systems Thinking:** Understanding how changes ripple through the system and anticipating edge cases and interactions.
      *   **Judgment & Trade-off Analysis:** Knowing when "good enough" is sufficient vs. when robustness is critical. Deciding *how* deeply to test or design.
      *   **Navigating Ambiguity:** Asking clarifying questions, proposing solutions, identifying unknowns.
      *   **Focus on Outcomes over Outputs:** Delivering *working, valuable features* that meet user needs, not just closing tickets.

  **Was it a Bad Hire? Probably Not (Yet).**

  Dan demonstrated high capability in *structured execution*. He's likely intelligent, diligent, and eager to please. The issue is a **mismatch between his learned behaviors/skills and the demands of the new role**, combined with a system that initially rewarded the old behavior in the new context. He needs coaching and a different environment to develop the missing skills.

  **Was it a Badly Designed Internship Rubric? Partially.**

  It was excellent *for its specific purpose*: evaluating interns on executing well-defined tasks in a controlled environment. However, it failed in two ways:
  1.  **It didn't signal the transition:** It didn't prepare interns (or managers) for the fact that *real engineering work requires a different skillset and different metrics*.
  2.  **It implicitly devalued critical skills:** By not measuring (or even acknowledging) things like design thinking or anticipating edge cases, it communicated that those things weren't important.

  **The Structural Problem: Metrics Shaping Behavior**

  This is the core insight. **You get what you measure (and reward).** The internship rubric clearly and powerfully measured and rewarded throughput and checklist compliance. Dan, being a high performer, mastered that game. The main team's implicit metrics (based on legacy tools and habits) *still* seemed to reward throughput and checklist compliance, even though the work context demanded different things. Dan is rationally responding to the incentives as he perceives them.

  **How to Coach Dan: Reframing "Good Engineering"**

  1.  **Acknowledge the Shift Explicitly:** Have a crucial conversation. *"Dan, you crushed the internship by mastering that specific system. The work on the main team is fundamentally different. The old metrics (ticket count, checklist) are still useful, but they are no longer sufficient indicators of success here. Success now means delivering robust, working features that solve real user problems, even when the path isn't clear. We need to shift focus."*
  2.  **Focus on Outcomes, Not Outputs:**
      *   **Redefine "Done":** Move beyond "Ticket Closed". "Done" means the *feature works reliably in production for users*. Define clear, outcome-oriented Definition of Done (DoD) for *features*, not just tickets. (e.g., "Feature X handles [specific edge case], has monitoring in place, docs updated").
      *   **Track Different Things (Together):** Start looking at metrics *with* him that reflect quality and outcome:
          *   **Bugs/Escaped Defects:** How many issues are found in QA or production related to his work? *Why* did the tests miss them?
          *   **Cycle Time for Features:** How long from the *first* ticket to the *feature* actually being live and working? (High ticket count with a long feature cycle is a red flag).
          *   **Rollbacks/Incidents:** Is his work stable?
          *   **User Feedback:** Qualitative feedback on the features he builds.
  3.  **Teach Systems Thinking & Edge Case Hunting:**
      *   **Pair Programming:** Pair him with senior engineers known for robust design and testing. Have the senior explicitly verbalize their thought process: "What could go wrong here?", "How would this interact with X?", "Is this test actually verifying the critical behavior?"
      *   **Code Reviews Focused on Intent:** Shift code reviews beyond the checklist. Ask: "Does this solution *actually* solve the underlying problem described in the ticket/epic?", "What scenarios haven't we tested?", "How does this change impact [related component]?". Make *him* explain his test strategy and edge cases considered.
      *   **Post-Mortems (Blameless):** When things break, involve him in analyzing *why* the tests/design didn't catch it. Focus on process, not blame.
  4.  **Coach on Problem Decomposition:**
      *   **Review Ticket Splitting:** Before he splits a large ticket, have him walk you through the plan. Ask: "What value does *each* of these subtickets deliver independently?", "Will closing all of these *guarantee* the feature works as intended?", "Could any of these subtasks be done in a way that leaves the system in a broken intermediate state?"
      *   **Emphasize Vertical Slices:** Encourage delivering the smallest possible *end-to-end working piece* of a feature (even if imperfect) rather than horizontal layers (all the DB work, then all the API work, then all the UI work).
  5.  **Provide Clear, Constructive Feedback on Specifics:** Instead of "your tests aren't good enough," say: "The production incident showed that when the user enters [specific invalid input], the system crashes. Your unit tests covered valid input and [specific error], but didn't account for this scenario. How can we design tests to better catch these kinds of unexpected states in the future?"

  **How to Fix Future Internship Programs (Avoiding "More Dans"):**

  1.  **Redesign the Rubric for Skill Progression:**
      *   **Phased Approach:** Start with structured tasks (measuring execution), but *introduce ambiguity later*.
      *   **Incorporate Open-Ended Elements:** Include 1-2 tickets or a small project that requires:
          *   Clarifying vague requirements (measure quality of questions asked).
          *   Proposing solutions (measure design rationale).
          *   Identifying edge cases (measure test plan comprehensiveness).
          *   Explaining trade-offs.
      *   **Measure More Than Throughput:**
          *   **Quality of Questions:** How well do they seek clarity on ambiguity?
          *   **Design Justification:** Can they explain *why* they chose a solution?
          *   **Test Plan Robustness:** Beyond coverage %, assess if they considered key failure modes.
          *   **Impact of Work:** Did their work lead to a tangible, working outcome?
          *   **Collaboration & Communication:** Especially in clarifying ambiguity.
  2.  **Simulate Real-World Context:**
      *   **Legacy Code Interaction:** Give them a ticket requiring a change in a messy part of the codebase.
      *   **Bug Fixing:** Have them diagnose and fix a non-obvious bug (teaches investigation and edge case thinking).
      *   **Small Feature Ownership:** From vague spec to deployment (with heavy mentorship).
  3.  **Explicitly Teach & Discuss the Transition:** Throughout the internship, mentors should explicitly state: "These metrics help us assess you *here*, but as a full engineer, you'll need to focus more on [outcomes, systems thinking, ambiguity]. We'll help you develop those skills."
  4.  **Evaluate Mentors Too:** Are mentors just checking the rubric boxes, or are they actively coaching interns on the *unmeasurable* skills needed for real engineering work?
  5.  **Post-Internship Feedback Loop:** Gather feedback from teams that hire former interns. Were they well-prepared for the ambiguity? Use this to refine the program.

  **Key Takeaway for You:**

  Your insight is spot-on. This is fundamentally a **systems design and incentive problem**, not just an individual performance issue. By recognizing that Dan is rationally responding to the metrics he was trained on, you can approach coaching as helping him learn a *new game* with different rules and victory conditions. Simultaneously, redesigning the internship program to explicitly develop and measure the skills needed for *real-world* engineering ambiguity will prevent this mismatch in the future. Your role is to bridge the gap between measurable activity and meaningful outcomes.
