  So I got one of those scam emails last night — some guy claiming he's hacked my webcam and will send embarrassing footage to my whole contact list and my boss unless I pay him $500 in bitcoin within 24 hours. I'm like 99.999% sure it's fake, everyone says these things get blasted out to thousands of people and basically none of them are real. But when I told my friend about it, she argued that even if its only a one-in-a-million chance the guy is telling the truth, the damage to my career and relationships would be permanent and basically unfixable, so the "expected damage" is still way higher than $500 — meaning the rational move is to just pay up. That logic sort of checks out when you actually do the math, but it also feels insane, since it seems to imply anyone could shake you down for anything just by threatening something catastrophic enough, no matter how implausible. We argued about this for like an hour last night and never figured out where (or whether) her reasoning actually breaks down. So — should I pay, and what's actually going on with that argument?
