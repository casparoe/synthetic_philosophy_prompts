      In this interpretation, the chord is generated without reference to the circle. The circle is then imposed. We require that the distribution of the chord should be invariant under translations of the entire plane. This means that the distribution of the chord should be the same regardless of where in the plane we are. 

      Now, the only translation-invariant measure on the set of chords in the plane is the one given by the invariant measure dL = (1/2) |sin φ| dφ dp. 

      Then, when we condition on the chord intersecting the circle, we get the distribution for the chord inside the circle. 

      Under this measure, the probability that the chord is longer than the side of the inscribed equilateral triangle is 1/2. 

      And how do we generate such a chord? One way is to choose the distance p from the center of the circle to the chord uniformly in [0,R] and then choose the angle φ with density proportional to |sin φ|. 

      But note: in the random radius method, we choose φ uniformly. That is not the same. 

      However, Jaynes argues that there is a different physical process that yields the invariant measure. For example, throw long straight straws onto the circle and condition on their intersecting the circle. The invariant measure then arises. 

      And in that measure, the marginal distribution of p (the distance from the center to the chord) is uniform on [0,R]. This is the same as in the random radius method. Moreover, the event we are interested in (d < R/2) depends only on p. And since p is uniform in [0,R] in both the invariant measure and the random radius method, the probability is 1/2 in both. 

      But wait, in the invariant measure, the distribution of p is uniform? Yes, as we computed earlier. And in the random radius method, p is uniform. So for the purpose of the event that depends only on p, the random radius method gives the same probability as the invariant measure. 

      However, the full distributions are different because of the angle φ. But the event "chord length > R√3" depends only on p (since it is equivalent to p < R/2). Therefore, any method that yields a uniform distribution for p will give probability 1/2 for this event. 

      So Jaynes's invariant measure gives the same probability for the event as the random radius method. 

      And the other methods do not yield a uniform distribution for p. 
          Method 1: p = R * cos(θ/2), and θ is uniform on [0,π]. The density of p is (2/(π R)) * 1/sqrt(1 - (p/R)^2) for p in [0,R]. This is not uniform.
          Method 3: p has density (2p/R^2) for p in [0,R]. This is not uniform.

      Therefore, only the random radius method (among the three) yields a uniform distribution for p. And Jaynes's invariant measure also yields a uniform distribution for p. 

      So the probability for the event is 1/2 in both.

      Jaynes then argues that the random radius method is the physical process that corresponds to the invariant measure when we restrict to the circle. 

      But note: the random radius method does not have the correct distribution for φ (it should be proportional to |sin φ|, but it is uniform). However, since the event does not depend on φ, we don't care. 

      Therefore, for this particular event, the random radius method is adequate and matches the invariant measure. 

      So Jaynes's invariance requirement (translation, rotation, and scale invariance for the chord in the plane) leads to the uniform distribution for p, and hence the probability 1/2. 

      And among the three methods, only the random radius method has p uniform. 

      This is why Jaynes favors the random radius method.

  ### Part 3: Van Fraassen's Cube Factory

  Van Fraassen's cube factory problem:

      A factory produces cubes with side length between 0 and 1 meter. What is the probability that the side length is at most 1/2 meter, given that the cube has side length between 0 and 1? 

      If we apply the principle of indifference, we might choose to be indifferent over the side length (s) or over the volume (v = s^3). 
      - If we use s: then s is uniform in [0,1], so P(s<=1/2) = 1/2.
      - If we use v: then v is uniform in [0,1], so P(s<=1/2) = P(v<=1/8) = 1/8.

      This is a paradox.

      Can we apply Jaynes's invariance argument? We would require the distribution to be invariant under some symmetries. What are the symmetries of the problem?

      The problem is about the side length of the cube. The cube is produced by the factory. The symmetries might include:

      - Scale invariance? But the problem specifies the range [0,1] for the side length, so scale invariance might not apply.
      - What about units? If we change the units of length, then the side length s becomes k*s, and the volume becomes k^3 * v. The event "s<=1/2" becomes "k*s<=k/2", which is the same as "s<=1/2". But the distribution might change.

      Let's try to require that the distribution should be the same regardless of the unit of length. That is, if we change the unit of length by a factor of k, then the distribution of the side length in the new units should be the same as the original distribution in the old units. 

      This means that the distribution should be such that the probability that the side length is in an interval [a, b] should be the same as the probability that it is in [k a, k b] in the new unit system? But note, the range [0,1] in the old unit becomes [0, k] in the new unit. 

      This doesn't seem to help.

      Alternatively, we can require that the distribution should be invariant under a change of units in the sense that the probability for the event should be the same. But the event is defined in terms of the side length: s<=1/2. If we change units, the event becomes s'<= (1/2)*k, but the new range is [0,k]. So the event is not the same. 

      Therefore, Jaynes's invariance under scaling might not be directly applicable.

      Another symmetry: the factory might be producing cubes for which we care about the side length or the volume. But the problem doesn't specify. 

      Van Fraassen's point is that the principle of indifference is ambiguous because there are two equally natural parameters (s and v). 

      Jaynes's invariance argument for the circle used the Euclidean group in the plane. In the cube problem, there is no such group of symmetries. The cube is not embedded in space; it is an object with a side length. 

      Therefore, the disanalogy shows that Jaynes's solution works only when there is a physically natural group of symmetries (like the Euclidean group) that can be used to define an invariant measure. In the cube factory, there is no such group. 

      This suggests that Jaynes has not rehabilitated the principle of indifference in general, but only in special cases where there is a physically motivated symmetry group that can be used to define an invariant measure.

      In the cube factory, we might try to find a symmetry. For example, if the factory's production process should be independent of the unit of measurement, then we require that the distribution should be such that the probability for the side length to be in [a, b] is the same as the probability for the volume to be in [a^3, b^3]? This doesn't seem to hold for any distribution except one that is proportional to 1/s^2 ds? Because then:

          P(s in [a, b]) = \int_a^b c/s^2 ds = c [1/a - 1/b].

          P(v in [a^3, b^3]) = P(s in [a, b]) = same.

      But then the probability that s<=1/2 is \int_0^{1/2} c/s^2 ds, which diverges. 

      So that doesn't work.

      Alternatively, if we require that the distribution should be the same whether we measure in terms of s or in terms of v, then we require that the density f(s) and g(v) (for v=s^3) should be related by:

          g(v) = f(s) * |ds/dv| = f(s) * (1/(3 s^2)) = f(s) * (1/(3 v^{2/3})).

      But we also require that the distribution should be uniform in s or in v? That is not possible. 

      Therefore, the cube factory problem does not have a symmetry group that can be used to define an invariant measure in the same way as the circle. 

      This disanalogy shows that Jaynes's solution is only for problems that have a rich enough symmetry group (like the Euclidean group) to uniquely determine the measure. In the cube factory, there is no such group, so the principle of indifference remains ambiguous.

  ### Conclusion

  - Each method in Bertrand's paradox seems obvious in isolation because it corresponds to a natural parametrization of the set of chords, and the principle of indifference applied to that parametrization yields a uniform distribution. The illusion breaks when we see that there are multiple natural parametrizations.
  - Jaynes's invariance argument requires the chord distribution to be invariant under translations, rotations, and scalings of the circle. This forces the distribution of the distance from the center to the chord (p) to be uniform on [0,R], which is achieved only by the random radius method among the three. The probability for the event is then 1/2.
  - In van Fraassen's cube factory, there is no analogous symmetry group that can be used to define an invariant measure. Therefore, Jaynes's strategy does not apply. This shows that Jaynes has not rehabilitated the principle of indifference in general, but only in special cases with sufficient symmetries.
