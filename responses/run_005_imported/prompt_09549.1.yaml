  ### Part 1: The Illusion of Obviousness

  The Bertrand chord paradox presents three methods for choosing a chord "at random" in a circle, each yielding a different probability for the event that the chord is longer than the side of the inscribed equilateral triangle. The methods are:

  - **Random Endpoints (Method 1)**: Choose two points uniformly and independently on the circumference and connect them. The chord is then determined.
  - **Random Radius (Method 2)**: Choose a radius uniformly at random and then choose a point uniformly along that radius. The chord is drawn perpendicular to that radius at the chosen point.
  - **Random Midpoint (Method 3)**: Choose a point uniformly at random inside the circle. The chord is the one for which that point is the midpoint.

  Each method seems natural and obvious when considered in isolation because:

  - **Random Endpoints**: Since the circle is symmetric and the chord is defined by its endpoints, it seems natural to think of the chord as being determined by two points on the boundary. We are used to uniform distributions on intervals, so independently picking two points uniformly on the circumference seems straightforward.

  - **Random Radius**: This method breaks the problem into two steps: first pick a direction (radius) and then a point along that radius. The rotational symmetry of the circle suggests that the direction should be uniform. Then, since the radius is a line segment, it seems natural to pick a point uniformly along it. This is also motivated by the idea that the chord is determined by its distance from the center (which is the variable we are uniformly sampling along the radius).

  - **Random Midpoint**: The set of chords can be put in one-to-one correspondence with their midpoints (except for the chords passing through the center, but these are a set of measure zero). The midpoints lie inside the circle, and since the circle is a symmetric region, it seems natural to pick a point uniformly in the disk to be the midpoint.

  The illusion of uniqueness breaks when we realize that each method is a different parametrization of the set of chords, and each parametrization leads to a different measure. The key is that the set of chords is a continuous space of 2 dimensions (since a chord is determined by two real parameters), but we are embedding it in different ways. The principle of indifference, when applied naively to different parametrizations, leads to different uniform distributions because the "uniform" measure depends on the parametrization.

