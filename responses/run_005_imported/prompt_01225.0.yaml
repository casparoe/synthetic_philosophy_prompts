prompt: |-
  Write a dialogue between an internalist about practical reasons who argues from within Bernard Williams's framework of the "subjective motivational set" and the "sound deliberative route," and an externalist who denies that every genuine reason must trace back to an agent's actual motivations. Have the externalist press two connected challenges: Derek Parfit's case of Future Tuesday Indifference (an agent who cares in the ordinary way about future pain except that he feels no concern at all about pain occurring on a future Tuesday, despite holding no false belief and making no error of instrumental reasoning), and the suggestion that the correction for false belief that Williams allows for in his own gin-and-petrol example licenses an idealization extensive enough to pull an agent's "real" reasons far from anything actually present in his psychology, thereby blurring the very distinction internalism is meant to mark. The internalist should try to meet both challenges without simply abandoning the internalist thesis, and each side should respond to the specific point the other has just made rather than restate a general position.
reasoning: |-
  We are creating a dialogue between an internalist (defending Williams's internal reasons) and an externalist. The internalist argues that reasons must be grounded in the agent's subjective motivational set (S) and accessible via a sound deliberative route. The externalist challenges with two points: Future Tuesday Indifference (Parfit) and the gin-petrol example leading to over-idealization.

  Characters:
  - Internalist (Int): Defends Williams's framework.
  - Externalist (Ext): Challenges internalism with Parfit's case and the idealization problem.

  Structure:
  1. Start with the internalist stating the core idea.
  2. Externalist presents Future Tuesday Indifference.
  3. Internalist responds to Future Tuesday Indifference.
  4. Externalist presses with the gin-petrol example and idealization.
  5. Internalist responds to idealization.
  6. Continue the back-and-forth with each responding to the last point.

  Dialogue:

  Int: Let's begin with the core of Bernard Williams's internal reasons thesis. A reason for an agent to act must be grounded in that agent's subjective motivational set, which we call S. This set includes not just desires but also dispositions of evaluation, patterns of emotional reaction, personal loyalties, and so on. And the reason must be reachable by a sound deliberative route from S. That means the agent can come to be motivated to act by that reason through a process of rational deliberation that corrects for any false beliefs and considers all relevant facts.

  Ext: I understand the appeal, but consider Derek Parfit's case of Future Tuesday Indifference. Imagine an agent who is entirely normal in his concern for future pains except for one quirk: he has no concern at all for pains that he knows will occur on a future Tuesday. He doesn't believe that Tuesday pains are less real or that they don't hurt as much. He just doesn't care about them. Now, according to your view, does he have a reason to avoid a severe pain scheduled for next Tuesday?

  Int: That's a challenging case. But let's think about his motivational set. He has a general disposition to avoid pain, which is part of his S. The exception for Tuesdays is a gap in his motivations. However, via sound deliberation, we might show him that there is no relevant difference between Tuesday and other days. If he can be brought to see that, then he might come to care about Tuesday pains. So, the reason to avoid Tuesday pain is internal because it can be reached by a sound deliberative route from his existing set.

  Ext: But what if he is fully aware of the lack of difference and still doesn't care? He might say, "I know it's arbitrary, but I just don't care about Tuesday pains." In that case, no amount of sound deliberation will change his mind because there's no false belief to correct and no instrumental reasoning error. So, according to Williams, there would be no reason for him to avoid Tuesday pain. But that seems absurd! Surely, he has a reason to avoid that pain, regardless of his quirky indifference.

  Int: I see the force of your intuition. But Williams would say that if the agent, after full deliberation and with all relevant facts, still doesn't care about Tuesday pain, then there is no reason for him to avoid it. The reason must be anchored in what he might come to be motivated by from his current S. If the indifference is so deep that no deliberative route can reach a concern for Tuesday pain, then it's not a reason for him. However, I think we should question whether the indifference is really as fixed as it seems. Perhaps the agent, when confronted with the prospect of a severe Tuesday pain, might find that he does care when it becomes imminent, and that might be a clue that his indifference is not as stable as he thinks.

  Ext: But that's just speculation. The case as described says he has no concern at all, and it's not based on any false belief. So, even if he might care later, at the time of deliberation, there's no motivation to avoid it and no sound deliberative route to generate one. Now, let me press you with another point: Williams allows for correction of false beliefs. In the gin-and-petrol example, the agent wants a gin and tonic, but there's petrol in the bottle. He has a reason not to drink it because, if he knew the truth, he wouldn't want to drink it. So, we idealize by removing the false belief. But how far does this idealization go? What if the agent has not just false beliefs but also lacks true beliefs? What if he has irrational preferences? Suppose we idealize to an agent who has all relevant true beliefs and reasons soundly. Then, his "real" reasons might be very different from his actual motivations. Doesn't this blur the line between internal and external reasons? If we idealize enough, we might end up with reasons that are not really internal to the agent's actual psychology.

  Int: The sound deliberative route does involve idealization, but it's constrained. Williams emphasizes that we can only correct for false beliefs and improve reasoning within the limits of the agent's existing S. We don't add new motivations that aren't already there in some form. In the gin-and-petrol case, the agent already has a desire not to drink petrol. That's part of his S. The false belief is masking that desire. So, when we correct the belief, we reveal a motivation that was already there. Similarly, in the Future Tuesday case, if the agent has a general aversion to pain, that's in his S. We try to extend it by showing that Tuesday pain is pain just like any other. But if there's no hook in his S to extend, then we can't generate a reason.

  Ext: But consider: what if the agent in the gin-petrol case didn't have a desire not to drink petrol? What if he didn't care about ingesting harmful substances? Then, even with the true belief, he might still want to drink it. But we would say he has a reason not to drink it because it's harmful. So, Williams's internalism would say that if he doesn't have a desire to avoid harm, then there's no reason? That seems wrong. And this leads to my point: the idealization you allow might require us to ascribe motivations that are not actually present. For example, we might say that if he were fully rational, he would care about his health. But then we're moving away from his actual S.

  Int: Williams is clear that we don't add new elements to S. We only work with what's there. So, if the agent truly has no concern for his health, then even with full information, he might still want to drink the petrol. In that case, according to internalism, he has no reason to avoid it. But note that in normal agents, there is usually a concern for health or at least a desire to avoid immediate negative experiences. The S is rich enough that we can usually find a hook. In the case of an agent who completely lacks any such concern, we might say he is pathological, and internalism can account for that.

  Ext: But that's my worry: internalism might collapse into externalism when we idealize. Because if we allow that the sound deliberative route can involve not just correcting false beliefs but also filling in missing true beliefs and then deriving motivations from the corrected set, then we are effectively saying that the agent has reasons that are independent of his actual motivations. They depend on what he would be motivated by if he were fully rational. And that's externalism! So, the boundary is blurred.

  Int: Not quite. The key is that the motivations that emerge must be attributable to the agent's actual S. The sound deliberative route is a process of working out what the agent already, in some sense, wants. It's not about what an idealized agent would want but what this agent, with her particular S, would want after reasoning well. So, the reasons are still internal because they are tied to her actual motivational set. The externalist, by contrast, thinks that reasons can exist independently of any connection to the agent's motivations.

  Ext: But in the Future Tuesday case, the agent's actual motivational set includes indifference to Tuesday pain. The internalist must deny that there's a reason to avoid Tuesday pain. But that seems counterintuitive. And in the gin-petrol case, if we allow the idealization to show that he has a reason not to drink because he would be motivated if he knew the truth, then why can't we say that the Future Tuesday agent would care about Tuesday pain if he were more rational? But then we're admitting that rationality can add new motivations, which goes beyond the actual S.

  Int: I think there's a difference. In the gin-petrol case, the desire to avoid drinking petrol is already in S (because he doesn't want to drink petrol, and he only thinks the bottle contains gin). In the Future Tuesday case, we are trying to extend the existing aversion to pain to cover Tuesdays. If the agent has a general aversion to pain, then we are not adding a new motivation but applying an existing one more broadly. The problem in the Future Tuesday case is that the agent has a specific gap. But perhaps we can argue that the gap itself is irrational because it violates a principle of temporal neutrality, which is part of sound deliberation. So, if we require the agent to deliberate soundly, we might force him to see that he should care about Tuesday pain. But note: that would be adding a requirement of temporal neutrality, which might not be in his S.

  Ext: Exactly! So, if we require temporal neutrality as part of sound deliberation, then we are imposing a normative standard that is external to the agent's actual motivations. And that's externalism creeping in.

  Int: Williams might say that temporal neutrality is not an arbitrary imposition but part of what it means to deliberate soundly. Deliberation involves considering like cases alike. So, if the agent treats two identical pains differently just because one is on Tuesday, that is a failure of sound deliberation. Therefore, in the process of sound deliberation, he would come to see that he must care about Tuesday pain. So, the reason is internal because it comes from his existing aversion to pain and the requirement of consistency in deliberation.

  Ext: But what if he says, "I know it's inconsistent, but I don't care. I just don't care about Tuesdays." Then, the requirement of consistency is not part of his S. So, why should we impose it?

  Int: That's a tough one. I suppose Williams would say that if the agent is so resistant to basic rational norms, then he is not capable of sound deliberation. But that might be a limitation of the account. However, note that the internal reasons thesis is meant to capture the idea of a reason that is relative to the agent's perspective. If the agent truly has no concern for consistency and no concern for Tuesday pain, then perhaps we have to accept that there is no reason for him. But that doesn't mean we can't criticize him as irrational. We can say that he ought to care about Tuesday pain, but that 'ought' is external.

  Ext: So, you admit that there is an external 'ought' here? That seems to undermine internalism.

  Int: Not necessarily. Internalism is about reasons for action. We can have external evaluations of rationality without admitting external reasons for action. But I see the tension. Perhaps the internalist can bite the bullet and say that the Future Tuesday agent has no reason to avoid Tuesday pain. That might be counterintuitive, but it's consistent.

  Ext: And that bullet is too hard to bite. It seems clear that he has a reason to avoid the pain, and internalism cannot capture that. So, we need external reasons.

  Int: Or we need to refine internalism. Maybe we can say that the agent has a reason because of his general aversion to pain, and the Tuesday exception is a local irrationality that doesn't negate the reason. But that might be ad hoc. Alternatively, we can argue that the very capacity to feel pain and to have a general aversion to it gives him a reason, regardless of the Tuesday quirk. But that sounds externalist.

  Ext: Precisely. So, perhaps the internalist framework cannot handle these cases without collapsing into externalism or biting an unacceptable bullet.

  Int: I think we can handle them by insisting on the constraints of the actual S and the sound deliberative route. But I admit that Future Tuesday Indifference is a hard case. However, the gin-petrol example doesn't lead to over-idealization because the motivation is already there. The idealization only removes obstacles to the motivation being effective.

  Ext: But what about an agent who doesn't care about harm at all? Then, even with the true belief, he wouldn't be motivated. But we still think he has a reason to avoid harm. That reason is external.

  Int: Then we have a fundamental disagreement. The internalist maintains that without some motivational hook, there is no reason for that agent. The externalist thinks there is. And we can argue about which view better captures the concept of a reason. But I think Williams's framework remains the best account of how reasons are action-guiding for the agent.

  Ext: And I think it fails to capture the normativity of reasons. But we might have to agree to disagree. Thanks for the discussion.

  Int: Likewise. It's been challenging and enlightening.
answer: |-
  ### Dialogue: Internalist vs. Externalist on Practical Reasons

  **Characters:**
  - **Internalist (Int):** Defends Bernard Williams’s internal reasons thesis, emphasizing that all genuine reasons must be traceable to the agent’s "subjective motivational set" (S) via a "sound deliberative route."
  - **Externalist (Ext):** Argues that reasons can exist independently of an agent’s actual motivations, pressing challenges from Parfit’s Future Tuesday Indifference and Williams’s own idealization in the gin-and-petrol example.

  ---

  **Ext:** Let’s start with Derek Parfit’s Future Tuesday Indifference. Imagine an agent who cares deeply about avoiding future pain—except when it occurs on a Tuesday. He knows Tuesday pain hurts just as much, holds no false beliefs, and makes no errors in instrumental reasoning. He simply doesn’t care about it. According to Williams, does this agent have a reason to avoid a severe pain scheduled for next Tuesday? If not, that’s absurd—pain is bad regardless of his indifference. If yes, doesn’t that violate internalism, since no element in his S motivates him to avoid Tuesday pain?

  **Int:** Williams’s framework can handle this. The agent’s S includes a general aversion to pain, which is motivationally foundational. The Tuesday exception is a contingent gap, not a fixed feature. Via sound deliberation—which involves consistency in applying values—he can recognize that temporal location (like Tuesday) is irrelevant to pain’s disvalue. If he deliberates soundly, he’ll extend his existing pain-aversion to cover Tuesdays. Thus, the reason is internal: it’s grounded in his S and accessible through rational correction.

  **Ext:** But that’s cheating! You’re assuming sound deliberation *must* impose temporal neutrality. Yet Parfit’s agent *acknowledges* the arbitrariness and *still* feels no concern. His S contains a brute, unmotivated indifference to Tuesdays—like a preference for vanilla over chocolate. If sound deliberation only corrects false beliefs and instrumental errors, as Williams insists, it can’t touch this. No element in his S "hooks" into Tuesday pain avoidance. So internalism must deny he has a reason, which is implausible. Pain on Tuesday is just as reason-giving as pain on Wednesday—external to his whims.

  **Int:** Not so fast. Sound deliberation isn’t just about beliefs; it includes examining whether one’s motivations cohere with broader elements in S. Here, the agent’s general pain-aversion commits him to caring about *all* similar pains. His Tuesday indifference is a local inconsistency undermining his own values. By Williams’s lights, deliberating soundly would reveal this conflict and motivate alignment—without adding new elements to S. The reason emerges immanently.

  **Ext:** But now you’re blurring internalism’s boundaries. Take Williams’s gin-and-petrol case: the agent wants gin but has a false belief that the bottle contains it (it’s petrol). Correcting that belief via sound deliberation reveals his "real" reason not to drink—grounded in his actual aversion to petrol. Fine. But this licenses heavy idealization. Suppose an agent lacks any health-concern in S and doesn’t care about ingesting petrol. If we "correct" for his ignorance and irrationality, we might say he *would* care if he were fully informed and rational. But then his "real" reason (avoid harm) is detached from his actual psychology. Doesn’t this idealization pull reasons so far from S that internalism collapses into externalism?

  **Int:** Williams guards against that. The sound deliberative route only unfolds what’s *implicit* in S, given true beliefs and coherent reasoning. In gin-and-petrol, the aversion to harm is already in S—it’s not invented. Similarly, for your petrol-indifferent agent, if no element in S opposes harm (e.g., no desire for survival or pleasure), then indeed he has no internal reason to avoid it. Internalism accepts this: reasons are agent-relative. We might call him irrational, but that’s an external evaluation, not a reason *for him*.

  **Ext:** That’s precisely the problem! In Future Tuesday Indifference, the agent’s S includes pain-aversion but excludes Tuesdays. If sound deliberation "corrects" this by demanding coherence, you’re smuggling in an external norm—temporal neutrality—as a deliberative requirement. But why is that requirement part of *his* S? If it’s not, your appeal to coherence is just externalism in disguise. And in the petrol case, if the agent’s S has no health-related motivations, internalism says he has no reason to avoid harm—but that’s clearly false. Reasons can’t depend entirely on contingent motivations.

  **Int:** Coherence isn’t external; it’s constitutive of sound deliberation. Williams argues that deliberation involves testing motivations against each other and against facts. For the Tuesday-indifferent agent, his pain-aversion and Tuesday-indifference conflict directly. Resolving that isn’t adding new content; it’s exercising the rational capacity built into S. As for your petrol agent: if his S truly lacks *any* basis for caring about harm (e.g., no desires that harm would frustrate), then internalism stands firm. Externalists confuse "there is a reason" (agent-neutral) with "he has a reason" (agent-relative). The latter requires a motivational foothold.

  **Ext:** But that’s unacceptably narrow. In Future Tuesday, the agent’s psychology is flawed, yet the reason persists independently. Your coherence move implicitly relies on a normative standard—"all similar pains deserve equal concern"—that isn’t in his S. And with petrol, even if the agent lacks health-motivations, the toxicity gives him a reason. Williams’s sound deliberative route, by allowing belief-correction and coherence-testing, ends up idealizing S beyond recognition. What’s "implicit" is just what *you* think he *should* value. That erodes the distinction between internal and external reasons—the very thing internalism was meant to uphold.

  **Int:** Not at all. The constraints are tight: deliberation only amplifies or refines existing S-motivations under improved information and rationality. In Tuesday’s case, the aversion to pain *is* in S; Tuesday-indifference is a contradiction that deliberation resolves *using his own commitment*. For petrol, if no element in S opposes harm, no reason exists *for him*. This preserves internalism’s core: reasons must be capable of motivating the agent via their psychology. Externalists like Parfit conflate objective norms with agent-relative reasons. Williams’s idealization is bounded—it doesn’t create motivations ex nihilo.

  **Ext:** Bounded? When you override brute preferences (like Tuesday-indifference) for the sake of coherence, you’re not refining S—you’re imposing an external ideal of rationality. And in the petrol case, if we idealize to "what he’d want if rational," we’re far from actual psychology. Internalism either denies clear reasons (e.g., to avoid Tuesday pain) or relies on an idealization that hollows out its own subjectivist foundations. Either way, external reasons look indispensable.

  **Int:** I disagree. Internalism’s power is in tethering reasons to what can *move* the agent. When we idealize, we’re not inventing new motives but removing obstructions to existing ones. Future Tuesday’s indifference *is* an obstruction to his pain-aversion. Without that tether, reasons become inert, abstract norms. Williams’s framework handles both cases without surrender: reasons remain internal, rooted in S, even if accessed through robust deliberation. The distinction holds.
