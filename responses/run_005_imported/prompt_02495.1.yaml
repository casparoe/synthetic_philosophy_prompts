prompt: |-
  I'm a philosophy major taking a course on decision theory this term, where we've spent the last few weeks working through expected utility theory, Dutch book arguments, and the standard reasons why credences and preferences are supposed to satisfy the probability axioms. Something that happened on my floor this week doesn't sit right with me, and I can't tell whether it's actually in tension with anything we've covered or whether I'm just missing something obvious.

  A friend of mine who's really into trading set up an informal betting arrangement for anyone on our floor who wants in. Each week, you can stake any portion of your current balance, and he's been completely upfront about the odds: whatever amount you commit has a 55% chance of growing by 80% and a 45% chance of shrinking by 60%. You're free to let your balance ride into the next week if you want, and most people have been doing that. He's been urging everyone to commit their entire balance every single week, on the grounds that 0.55 times 1.80 plus 0.45 times 0.40 comes out to 1.17, meaning the wager nets a positive expected return of seventeen percent per round, so holding anything back is just leaving free money on the table. He's also pointed out that since most of us intend to keep playing every week for the rest of the semester, the law of large numbers guarantees that our results will converge toward that expected return, so it's practically a sure thing for anyone who sticks with it. Two people who followed his advice and went all-in for several weeks running have already lost their entire balance, but he maintains that this is just an unlucky run and doesn't undermine the underlying reasoning.

  I can't shake the sense that something is wrong here, but his expected-value arithmetic checks out, and I don't have a clean rebuttal to the law-of-large-numbers point either. Is my friend right that committing your whole balance every week is the rational strategy as long as each round has positive expected value, or is there a flaw in his reasoning? If there is, I'd like to understand exactly where it breaks down, and how one should actually think about how much of a balance to risk on a wager like this when you intend to keep playing it repeatedly.
reasoning: |-
  Okay, let's start by understanding the user's problem. They're a philosophy major taking a decision theory course, so they're familiar with expected utility, Dutch books, and probability axioms. Their friend has set up a betting game with a 55% chance of an 80% gain and a 45% chance of a 60% loss. The friend insists that going all-in every week is rational because the expected value is positive (1.17). But two people already lost everything, which makes the user question this advice.

  First, I need to address why the friend's reasoning is flawed. The expected value calculation is correct for a single bet, but repeated bets change things. The friend relies on the law of large numbers, but that applies to the expected value of the bankroll, not the growth rate. The key here is the difference between arithmetic and geometric means. 

  The arithmetic mean is what the friend calculated: 0.55*1.8 + 0.45*0.4 = 1.17. But for repeated bets, the geometric mean matters more because it affects compound growth. Calculating the geometric mean: (1.8^0.55)*(0.4^0.45). That gives about 0.985, meaning a 1.5% loss per bet on average. That explains why going all-in leads to ruin over time.

  Next, the law of large numbers point. The friend thinks that over time, results converge to the expected value. But the expected value here is the arithmetic mean, which doesn't account for the multiplicative nature of compounding. The geometric mean being less than 1 means the bankroll shrinks almost surely. So the law of large numbers actually works against the bettor here.

  The user might also be wondering about rational strategies. They need to know how much to stake each week. The Kelly Criterion comes into play. Calculating the optimal fraction: f = (bp - q)/b. Here, b is 0.8 (since 80% gain), p is 0.55, q is 0.45. So f = (0.8*0.55 - 0.45)/0.8 = (0.44 - 0.45)/0.8 = -0.01/0.8 = -0.0125. A negative result means no bet should be placed. But since the bet has a positive EV, that's confusing. Wait, the Kelly formula assumes you win b times the stake, but here a loss is 60%, so the loss multiplier is 0.4. The net gain is 80%, so b = 0.8, but the net loss is -60%, so a = 0.6. The correct Kelly formula for such scenarios is f = p/a - q/b. Let me recalculate: f = 0.55/0.6 - 0.45/0.8. That's about 0.9167 - 0.5625 = 0.3542. So about 35.42% per bet. That makes sense because the positive EV suggests some fraction is optimal.

  The user's deeper need is understanding how decision theory applies here, especially with repeated bets. They might be confused about why expected utility theory seems to conflict with the outcomes. They need to grasp that utility isn't linear in money, and risk of ruin matters. Also, the difference between single and repeated bets is crucial. The friend's mistake is ignoring variance and compounding. The user probably wants a clear explanation to counter their friend's argument and to know the rational strategy.

  I should also address why two people lost everything. With all-in bets, even with positive EV, the risk of ruin is high because a few losses can wipe you out. The probability of ruin might be low each week, but compounded over weeks, it becomes significant. The Kelly Criterion minimizes the risk of ruin while maximizing growth. Betting 35% each week would have prevented total loss and allowed growth.

  In summary, the friend's flaw is confusing arithmetic and geometric means, misunderstanding the law of large numbers in multiplicative processes, and ignoring risk of ruin. The rational approach is fractional betting using Kelly or similar, balancing growth and safety.
answer: |-
  You're absolutely right to be suspicious—your friend's reasoning contains a critical flaw that's especially dangerous in repeated betting scenarios. His advice to go all-in every week is mathematically irrational for long-term growth, despite the positive expected value per bet. Here's a breakdown of where he goes wrong and how to think about it correctly:

  ### 1. **The Core Flaw: Confusing Arithmetic Mean with Geometric Mean**
     - **Your friend's calculation** (0.55 × 1.80 + 0.45 × 0.40 = 1.17) gives the *arithmetic mean* of returns. This is valid for a **single, isolated bet** where you care about expected terminal wealth.
     - **For repeated bets**, wealth compounds multiplicatively (e.g., a 60% loss followed by an 80% gain doesn't return you to breakeven). Here, the *geometric mean* of growth rates determines long-term growth.  
       - Geometric mean = (1.8)<sup>0.55</sup> × (0.4)<sup>0.45</sup> ≈ **0.985**.  
       - Since 0.985 < 1, each full-bet round *reduces* your wealth by ~1.5% on average.  
     - **Key implication**: Betting your entire balance every time guarantees almost certain ruin (probability → 1 as rounds increase), even with positive expected value per bet. The two players who went bankrupt weren't "unlucky"—they experienced the inevitable outcome of this strategy.

  ### 2. **Why the Law of Large Numbers (LLN) Misapplies**
     - The LLN says the *average return per bet* converges to the expected value (1.17). But this is the **arithmetic average**, not the **compound growth rate**.  
     - For multiplicative processes, your actual wealth grows as:  
       `Final Wealth = Initial Wealth × (Product of growth factors)`  
       The LLN doesn't directly describe the product—it describes the average of the sum of log returns.  
     - **Crucially**: If the geometric mean is <1, wealth → 0 with probability 1, regardless of the positive arithmetic mean.

  ### 3. **The Rational Strategy: Fractional Betting (Kelly Criterion)**
  To maximize long-term growth while avoiding ruin, bet a *fixed fraction* (f) of your bankroll each round. The optimal fraction is given by the **Kelly Criterion**:  
  `f* = (bp - q) / b`  
  where:  
  - `b` = net fractional odds received (0.80 here, since an 80% gain),  
  - `p` = probability of winning (0.55),  
  - `q` = probability of losing (0.45).  

  Plugging in:  
  `f* = (0.80 × 0.55 - 0.45) / 0.80 = (0.44 - 0.45) / 0.80 = (-0.01) / 0.80 = -0.0125`  

  **Wait—a negative fraction?** This signals a deeper issue:  

  ### 4. **The Bet Isn't Actually Profitable for Long-Term Growth**
  - Kelly gives a negative result because `p × b < q` (i.e., 0.55 × 0.80 = 0.44 < 0.45).  
  - The **growth-optimal fraction** requires that `p > 1/(1+b)` (here, 1/(1+0.8) ≈ 0.5556). But 0.55 < 0.5556, so:  
    - The bet has positive *arithmetic* expectation (+17%),  
    - But negative *geometric* expectation (long-term growth rate <0%).  
  - **Rational action**: No bettor seeking growth should take this wager repeatedly. The only justification is if you have a small number of bets and linear utility (unrealistic for most people).

  ### 5. **Why Your Friend's Strategy Fails Practically**
     - **Risk of Ruin**: With all-in bets, 3 consecutive losses (probability = 0.45³ ≈ 9.1%) wipe you out. After 10 weeks, P(ruin) ≈ 65%.  
     - **Asymmetry**: A 60% loss requires a 150% gain to recover—much harder than it seems.  
     - **"Free money" illusion**: Positive EV ≠ infinite growth. Overbetting guarantees volatility drag dominates.

  ### How to Think About Repeated Bets Rationally
  1. **Prioritize geometric growth**, not arithmetic EV.  
  2. **Calculate the Kelly fraction** for any bet:  
     `f* = p - q/b` (simplified form for binary bets).  
     If f* ≤ 0, avoid the bet entirely for long-term play.  
  3. **If betting fractionally**, use a fraction ≤ f* to reduce volatility (e.g., "half-Kelly").  
  4. **Utility matters**: If losses hurt more than gains help (e.g., losing rent money), bet less than Kelly or avoid.  

  **Conclusion**: Your friend's strategy is irrational—it ignores compounding and guarantees eventual ruin. For this specific bet, the rational action is to *not play at all* if you care about long-term growth. If forced to play (e.g., for a decision theory exercise), bet ≤ 0% (i.e., nothing). This case brilliantly exposes how naive expected value maximization fails in repeated games. Kudos for spotting the tension—it's why decision theory needs tools beyond Dutch books!
