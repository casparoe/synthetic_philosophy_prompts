  ## The Unequal Companions: Why Mathematics Survives Evolutionary Scrutiny While Morality Stumbles

  Sharon Street's evolutionary debunking argument (EDA) strikes at the heart of moral realism. If natural selection shaped our moral attitudes primarily for adaptive fitness, not for tracking mind-independent moral truths, then the realist faces a profound challenge: explaining the striking coincidence that these fitness-driven attitudes reliably align with the posited moral facts. The "companions in guilt" (CIG) defense, championed by thinkers like Justin Clarke-Doane, offers a powerful counter: if EDAs debunk morality due to its evolutionary origins, they should equally debunk mathematics and logic, whose basic beliefs were also forged by selective pressures indifferent to abstract truth. Since mathematical skepticism is untenable, the reasoning goes, EDAs must be flawed, and moral realism remains unscathed. **However, upon rigorous examination, a principled disanalogy emerges: mathematics possesses *explanatory indispensability* within our best-confirmed scientific theories, providing a realist-friendly anchor for reliability that morality fundamentally lacks. This crucial difference allows evolutionary origins to debunk moral realism without dragging mathematical realism down with it.**

  **The Force of the Parity Argument: Shared Vulnerability**

  The CIG argument possesses undeniable initial plausibility due to compelling parallels:

  1.  **Non-Adaptive Truth:** Both moral truths (if real) and mathematical truths are abstract, causally inert, and exist independently of human minds. Natural selection pressures concern reproductive success in a physical environment, not correspondence with abstract normative or mathematical facts. There's no obvious selective advantage *specifically* in grasping that "2+2=4" is true in a platonic sense, any more than there is in grasping that "torturing innocents is wrong" corresponds to a moral fact. Fitness would be served equally well by systematically *false* mathematical or moral beliefs, provided they promoted survival and reproduction in our ancestral environment (e.g., a belief that "2 objects + 2 objects = 5 objects" might sometimes lead to advantageous caution).
  2.  **The Reliability Challenge:** For both domains, the realist must explain the *reliability* of our cognitive faculties. If evolution explains the *content* of our beliefs via fitness, why should we trust that these beliefs accurately track independent truths? The "coincidence" problem Street identifies for morality seems equally applicable to basic mathematical and logical intuitions. If EDAs undermine trust in one domain, consistency demands they undermine trust in the other.
  3.  **The Intuition of Immunity:** The visceral implausibility of mathematical skepticism serves as a powerful reductio. If the EDA logic forces us to doubt 2+2=4, then something must be wrong with the logic itself. This suggests that EDAs, in their strong form, overgeneralize and cannot be sound.

  **Forging the Disanalogy: Why Mathematics Stands Apart**

  Despite these parallels, mathematics possesses unique features that provide a realist escape route unavailable to morality:

  1.  **Explanatory Indispensability and Confirmation:** This is the most potent disanalogy. Mathematics is not merely useful; it is *explanatorily indispensable* to our best-confirmed scientific theories (Quine-Putnam Indispensability Argument). General Relativity, Quantum Mechanics, evolutionary biology itself – these theories, which make incredibly accurate predictions about the physical world, are formulated and expressed using sophisticated mathematics. Their empirical success provides *independent confirmation* for the mathematical structures they employ. While the *evolutionary origins* of our basic mathematical intuitions are fitness-driven, the *current justification* for sophisticated mathematical beliefs is inextricably tied to their role in these empirically successful scientific theories. The reliability of our mathematical faculties is vindicated by their instrumental role in generating predictively accurate models of the world. **Evolution may have given us crude numerical sensitivity, but science demonstrates that this sensitivity can be refined into a tool that reliably latches onto abstract structures necessary for describing fundamental reality.**
      *   **The Moral Contrast:** Moral facts play no analogous indispensable role in our best *explanatory* scientific theories. While moral psychology is studied scientifically, the putative *moral truths themselves* (e.g., "genocide is wrong") do not figure in the explanations of physical phenomena offered by physics, chemistry, or biology. There is no parallel "moral indispensability argument" with comparable empirical backing. The success of science does not depend on, or provide evidence for, the existence of mind-independent moral facts. Therefore, the realist lacks an external anchor, independent of our evolved intuitions, to justify the reliability of our moral faculties. Evolution explains the origins, but no subsequent, independent, empirically confirmed framework vindicates their truth-tracking capacity.

  2.  **Modal Status and the Space of Possibilities:** Mathematical truths are typically regarded as metaphysically necessary. "2+2=4" could not be otherwise. This necessity arguably constrains the space of evolutionary possibilities. While *conceivable* that evolution could have selected for systematically false mathematical beliefs, the *actual* selective pressures operated in a world governed by mathematical regularities (e.g., combining discrete objects). Beliefs aligning with these regularities would likely confer a significant advantage over beliefs that consistently misrepresented them. While not guaranteeing perfect alignment, the necessity of mathematical truths makes a *general* reliability less mysterious – evolution operated within a mathematical framework.
      *   **The Moral Contrast:** Moral truths, if they exist, are generally considered contingent. There is no clear consensus that "torture is wrong" *must* be true in all possible worlds. The space of possible moral frameworks compatible with survival seems vast and varied (as evidenced by cultural diversity). Evolution could easily have shaped us with radically different "moral" intuitions that were equally fitness-conducive but utterly disconnected from any posited independent moral truth. The contingency amplifies the "coincidence" problem for the moral realist.

  3.  **Causal Etiology and Perceptual Foundations:** While abstract mathematics is causally inert, our *basic* mathematical beliefs (e.g., small number cognition, spatial relations) often have direct perceptual and sensorimotor foundations (e.g., subitizing, manipulating objects). These low-level capacities, shaped by evolution for navigating the physical world, provide a causal connection to mathematical *structures in the physical environment*. This grounding offers a partial, bottom-up explanation for reliability, starting from perception of concrete instances. While evolution explains the *development* of these capacities, their function is inherently tied to representing physical quantities and relations accurately.
      *   **The Moral Contrast:** Moral beliefs lack this direct perceptual grounding. We don't perceive "wrongness" in the same way we perceive quantities or shapes. Moral judgments arise from complex cognitive processes integrating emotion, social cognition, and reasoning, heavily shaped by cultural learning. The causal chain from any posited moral fact to a moral belief is far more opaque and mediated than the chain from three apples to the belief "there are three apples." The etiology seems much more directly explained by socio-biological pressures alone.

  **Counter-Arguments and Rebuttals:**

  *   **CIG Rejoinder (Indispensability):** Critics might argue that morality *is* indispensable – to social coordination, law, or even scientific practice requiring ethical norms. However, this confuses the *pragmatic* utility of moral *discourse* and *belief* for the *explanatory indispensability* of moral *facts* within scientific theories. Science explains social coordination using psychology, sociology, and biology, not by invoking moral truths. Ethics guides scientific *practice*, but not the *content* of its explanations of the natural world.
  *   **CIG Rejoinder (Modality/Necessity):** Some moral realists (e.g., ethical non-naturalists) argue moral truths *are* necessary. However, even if granted, the lack of indispensability remains decisive. Furthermore, the *epistemic access* problem remains acute: how do we know *which* necessary moral truths obtain? Evolution offers no reliable guide here, unlike the constraint provided by the physical world on mathematical belief formation.
  *   **CIG Rejoinder (Etiology):** While basic arithmetic has perceptual roots, higher mathematics (e.g., transfinite set theory) clearly does not. Does the EDA then debunk *only* higher mathematics? This misunderstands the CIG defense. The target is *basic* logical and mathematical beliefs shared across cultures and foundational to reasoning. If EDAs debunked *these*, skepticism would cascade upwards. The perceptual grounding of basic arithmetic provides a partial reliability story *at the foundation*, stopping the skeptical cascade. Morality lacks any analogous foundational grounding.

  **Verdict: The Disanalogy Holds**

  While the "companions in guilt" argument powerfully highlights the challenge EDAs pose to any domain of non-empirical belief, the disanalogy grounded in **explanatory indispensability** is decisive. Mathematics earns its epistemic credentials through its indispensable role in our best-confirmed scientific theories, providing an independent, empirically anchored reason to trust the reliability of our mathematical faculties *despite* their evolutionary origins. This external vindication is utterly absent for morality. The realist can point to no comparable, successful framework outside our evolved moral psychology that both requires and confirms the existence of mind-independent moral facts. Therefore, Street's evolutionary debunking argument successfully undermines the plausibility of moral realism by revealing the unexplained coincidence between adaptive attitudes and independent truths, while mathematical realism survives because its reliability finds justification *beyond* its evolutionary pedigree, in the empirical triumph of science itself. The companions part ways: mathematics finds refuge in the citadel of scientific confirmation, leaving moral realism exposed to the evolutionary critique.
