  6. Close with traditional wishes (health/happiness) minus fatalism.

  Philosophical touches: Mention "truth-value gaps" lightly, or say "neither true nor false yet" for future events. Supervaluationism might be overkill, but "branching possibilities" could work. Peircean view (no future truth) fits best. 

  Key: Make logic serve romance. "Their love isn't predetermined—it's chosen daily" turns philosophy into a strength. 

  Laugh check: Logicians might chuckle at "avoiding dinner-party debates" or "as Aristotle might say..." if delivered right. Family hears "she's smart" vs. "inside joke."

  Final tone: Warm, clear, slightly playful. No jargon dumps. Callback to Priya's career as evidence she'd reject fatalism in love too. 

