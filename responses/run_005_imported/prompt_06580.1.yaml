  The causal exclusion argument always gets illustrated with the same worn out example: pain causing you to jerk your hand back, even though the neural stuff underneath was already causally sufficient on its own to produce the behavior. Can you come up with a totally different example that has the same basic structure (multiple realizability, causal closure of the physical, no systematic overdetermination) but has nothing to do with pain, belief, desire, or intention? Pull it from some other domain entirely, like ecology, software, or economics, and briefly explain how it maps onto those premises -- kinda want to see if this actually generalizes or if its just a folk-psychology intuition pump.
