  ok so i've spent way too many nights watching cosmological argument debates on youtube and theres something i never see anyone actually address head on: the kalam version and the "contingency" version (the leibniz one, why is there something instead of nothing, the whole chain of causes cant explain itself) dont actually need each other and kind of poke holes in each other if you think about it. like kalam NEEDS the universe to have an actual begining in time, but the contingency argument doesnt care if the past is infinite, it still goes through either way. can you write me a dialogue between a hardcore kalam guy and a hardcore contingency guy, arguing with EACH OTHER (not some atheist strawman) about whose version is actually the stronger one? i want real back and forth where they engage with each others best shot, like the contingency guy pushing on how kalam is betting everything on physics/actual-infinites stuff that could get overturned by cosmologists, and the kalam guy pushing back with that "modal collapse" objection to PSR i've seen mentioned a couple times, where if god necessarily creates then nothing is actually contingent anymore. keep it fairly tight and dont let either of them just win, i wanna know if the disagreement even has a real resolution or if theyre just stuck talking past each other at some point.
