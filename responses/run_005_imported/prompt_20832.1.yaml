  My son's getting married in October and I got roped into giving the toast, which is awkward since he and his fiancee are both decision theorists -- following in my footsteps, unfortunately -- who met arguing about ambiguity aversion at a summer school (she's team maxmin expected utility, he's team Choquet, and neither will concede). Half the reception will be people from that world who'll clock an Ellsberg reference immediately; the other half is just family who's never heard of the sure-thing principle and doesn't need to. I don't want one urn joke stapled onto a generic toast -- I want the whole thing built around the paradox, since these two spent years arguing it's rational to avoid the urn with unknown odds, and then went ahead and picked each other, which is about as unknown an urn as it gets. Can you write me something like four minutes long that uses that tension as the actual spine of the toast, lands as warm rather then as a dig at them, and still works for the aunts and uncles at the table who have no idea what any of this means?
