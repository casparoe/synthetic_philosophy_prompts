  ## The Rational Knot of Parfit's Hitchhiker: Disposition, Act, and the Necessity of Rational Irrationality

  Parfit's Hitchhiker presents a stark challenge to conventional notions of rationality. The traveler, rescued only by the driver’s confidence in her future payment, faces a dilemma: at the moment of payment in town, handing over the fee seems *causally inert*, conferring no benefit while costing her resources. Causal Decision Theory (CDT), the dominant framework evaluating acts based on their expected causal consequences, declares paying irrational *at that moment*. Yet, for the rescue to occur, the traveler *must* be the type of person disposed to pay – a disposition whose cultivation and maintenance appear rational. This case powerfully demonstrates that genuine rationality can indeed require cultivating and adhering to a disposition to perform acts that, *when considered in isolation at the moment of choice*, are irrational. "Rational irrationality" is not merely a paradox; it is a real phenomenon arising from the complex temporal and dispositional structure of agency.

  **CDT's Compelling Case for the Act's Local Irrationality**

  Causal Decision Theory provides a seemingly unassailable argument for the irrationality of paying *in town*:
  1.  **The Causal Criterion:** An act is rational iff it maximizes expected utility based on its *causal consequences*.
  2.  **The Situation in Town:** The rescue is complete. The driver has no future interaction planned and no means to retaliate or reward based on payment. Paying causes the loss of money. Not paying causes the retention of money. There are no other relevant causal consequences.
  3.  **The Calculation:** Paying: Utility = -Fee. Not Paying: Utility = 0 (or +Fee retained). Therefore, not paying maximizes expected utility *at the moment of payment*.

  CDT's focus is rigorously local, examining only the causal levers available *now*. At *t2* (payment time), the past commitment and the driver's prior beliefs are fixed background facts, not variables the traveler can causally influence. Paying is purely costly. CDT thus delivers a clear verdict: paying is irrational *at t2*. To deny this seems to ignore the fundamental tenet that rationality concerns the effective pursuit of goals given the actual state of the world *now*.

  **The Rationality of the Disposition and the Need for "Irrationality"**

  However, this local verdict ignores the crucial precondition for the rescue at *t1* (desert time). The driver only rescues if he believes the traveler is *disposed* to pay. Being disposed to pay – meaning having a reliable character trait or commitment mechanism that *would* lead one to pay even when it seems locally costly – is what makes the rescue possible. Consider the traveler's perspective *before* the rescue:

  1.  **Cultivating the Disposition:** Recognizing the driver's requirement, the rational traveler *wants* to be the type of person who reliably pays promises, even when locally costly. This disposition enables the highly beneficial outcome of rescue. Cultivating or maintaining such a disposition (if it doesn't exist) or simply *being* such a person is rational. It maximizes expected utility over relevant scenarios involving trust-dependent interactions.
  2.  **Adhering to the Disposition in Town:** When *in town*, the traveler who has this disposition faces a conflict. CDT says "Don't Pay!" (local act rationality). But *adhering to her rational disposition* requires paying. If she doesn't pay, she retrospectively undermines the rationality of having cultivated the disposition in the first place. More importantly, for *future* interactions (either with this driver or others, or even maintaining her own self-trust), adhering to the disposition *now* is crucial for *sustaining* the trust-enabling trait that yields long-term benefits (Gauthier's "constrained maximization"). Failing to pay *reveals* her disposition was not truly reliable, potentially sabotaging future opportunities.

  This creates the core tension: **The disposition to pay is globally rational, but the act manifesting that disposition (paying at *t2*) is locally irrational under CDT.** To reap the benefits of the rational disposition, the agent must *perform* the locally irrational act. Rationality, therefore, *requires* being disposed to act irrationally in specific, predictable contexts. This is "rational irrationality": the disposition is rationally necessary, and the act fulfilling it, while locally suboptimal, is an obligatory consequence of that necessary disposition. It is "irrational" only by an overly narrow, act-isolating standard that ignores the agent's temporally extended nature and the constitutive role of dispositions.

  **Addressing Alternatives: Why They Don't Dissolve the Irrationality**

  Proponents of resolute choice (McClennen) or disposition-based criteria (Gauthier) argue paying is straightforwardly rational, denying any residual irrationality. However, this downplays the genuine conflict:

  1.  **Resolute Choice (McClennen):** This suggests the traveler in town rationally *reaffirms* her desert commitment, viewing the payment as part of a larger, rational plan. While this explains *why* she pays, it doesn't magically erase the *local causal inefficacy* of the act. Resoluteness provides a *motivation* for overriding the local CDT calculation, but it doesn't change the fact that *by the lights of the local causal situation*, the act remains suboptimal. The tension is resolved by fiat ("I'm resolute!") rather than dissolved. The pull of the local causal facts remains, creating the *experience* of doing something that feels locally irrational because it *is* locally causally ineffective, even if globally wise.
  2.  **Disposition-Based Rationality (Gauthier):** Gauthier argues the rational *act* is determined by the disposition it expresses. Paying expresses the rational disposition of constrained maximization; hence, it is rational *simpliciter*. This effectively defines the rational act *as* the one expressing the rational disposition. While this provides a coherent alternative framework, it sidesteps the *intuition* captured by CDT – that *given the world as it is at t2*, paying *does nothing beneficial*. Gauthier changes the subject from "what act causes the best outcome now?" to "what act is consistent with being a rational type of agent?" The local causal inefficacy, the core reason CDT declares paying irrational, isn't refuted; it's rendered irrelevant by a shift in the standard. The feeling that one is "throwing money away" *at t2* persists, signifying the lingering pull of the act-based, causal perspective. Gauthier provides a compelling account of *why* the irrationality must be embraced, not proof that it doesn't exist.

  **Comparison with Newcomb's Problem: A Shared Core Disagreement**

  The dispute over the Hitchhiker fundamentally mirrors the division between one-boxers and two-boxers in Newcomb's Problem:

  1.  **Shared Structure:** Both involve a choice where:
      *   A desirable outcome (rescue/$1,000,000) depends on a prior state (driver's belief/predictor's prediction).
      *   The prior state is reliably correlated with the agent's *disposition* or *choice tendency* (disposed to pay/one-box).
      *   At the moment of choice, the prior state is fixed. The agent cannot *causally influence* the desirable outcome by their current choice (paying doesn't cause rescue, one-boxing doesn't cause the $1M to be there).
      *   CDT favors the "dominant" act (Don't Pay/Take Both Boxes) based solely on local causal consequences.
      *   Alternative views (Disposition/Evidential Decision Theory - EDT) favor the act correlated with the good prior state (Pay/One-Box).

  2.  **Alignment of Positions:** Generally, those who advocate paying in the Hitchhiker are also one-boxers in Newcomb's (prioritizing the correlation/expressing the rational disposition). Those who advocate not paying are two-boxers (prioritizing local causal dominance). The core disagreement is identical: **Should rational choice be based solely on the causal efficacy of the act in the immediate moment (CDT), or should it incorporate the act's role as evidence of a desirable prior state or its expression of a beneficial disposition (EDT/Disposition-based views)?** Parfit's Hitchhiker and Newcomb's Problem are structurally isomorphic in this crucial respect; they present the same challenge to CDT using different narratives.

  **Qualification: The Role of Reliability**

  The strength of the case for rational irrationality depends on the *reliability* of the driver's foresight or the correlation between disposition and outcome.
  *   **Perfect/High Reliability:** If the driver is infallible (or near-infallible) in identifying the traveler's true disposition, the case is strongest. Cultivating the disposition guarantees rescue; failing to pay *when disposed* is nearly impossible or self-defeating. The locally irrational act is a strict requirement for benefiting from the rational disposition.
  *   **Low Reliability:** If the driver often mistakes dispositions, the value of cultivating the disposition diminishes. Furthermore, if the driver is unreliable, a traveler *without* the disposition might sometimes get rescued (and then not pay), while a traveler *with* the disposition might sometimes *not* get rescued (and thus avoid the "cost" of paying). In this scenario, cultivating the disposition carries more risk and less guaranteed benefit. While the *structure* of rational irrationality remains possible, its *necessity* and *net advantage* weaken significantly. The local CDT argument against paying gains relatively more weight, as the connection between disposition, rescue, and the *need* to fulfill the disposition becomes probabilistic and less binding.

  **Conclusion**

  Parfit's Hitchhiker successfully establishes that genuine rationality can require cultivating and adhering to a disposition to perform acts that are, when evaluated in isolation at the moment of performance under the causal standard, irrational. CDT correctly identifies the causal inefficacy of paying at *t2*, rendering it irrational *by that specific, local criterion*. However, this local irrationality is the necessary price for possessing and maintaining the *globally rational disposition* that enables the rescue. Resolute choice and disposition-based criteria offer valuable frameworks for *understanding* why the traveler pays, but they achieve coherence by shifting the standard away from the act's immediate causal consequences, thereby sidestepping rather than eliminating the core tension identified by CDT. The dispute is fundamentally the same as in Newcomb's Problem, pitting act-by-act causal dominance against the rationality of types, dispositions, and evidential links. When foresight is reliable, rational agents must paradoxically embrace "rational irrationality" – binding themselves to locally suboptimal acts – to navigate a world where their character precedes and shapes their opportunities. The Hitchhiker reveals rationality not as a simple calculator of immediate gains, but as a complex project of self-construction across time.
