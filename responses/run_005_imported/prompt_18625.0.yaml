prompt: |-
  So in my philosophy of mind seminar this week we went through Penrose's stuff on why minds can't just be classical computers, and my professor also spent a good chunk of the lecture on quantum computing since it connects to the Orch-OR theory he does with Hameroff. She mentioned that quantum computers can solve NP-complete problems exponentially faster than classical ones (the whole "quantum parallelism" thing, like how Shor's algorithm cracks factoring almost instantly), and afterwards a few of us ended up arguing about it over coffee. My theory is that this basically gives Penrose's argument empirical teeth: if the microtubules in neurons really are doing quantum computation the way he claims, the brain could be using that same exponential speedup to instantly search through the huge space of possible proof-steps, which would explain those stories about mathematicians like Ramanujan or Poincare getting a whole proof "in a flash" instead of grinding through it step by step the way a classical Turing machine would have to.

  I kind of want to build my term paper proposal around this (something like "computational complexity theory gives Penrose's Gödel argument the empirical backing it always lacked"), but the proposal is due Friday and I dont have time to read a ton of background before then. Could you help me figure out which specific complexity theory results, beyond just Shor's algorithm, I should be citing to support the "quantum computers beat NP-complete problems" part, and maybe how to phrase the microtubule tie-in so it sounds rigorous instead of hand-wavy? Sorry if some of this is off, my background's in ethics not CS so I might be getting the technical bits wrong somewhere.
