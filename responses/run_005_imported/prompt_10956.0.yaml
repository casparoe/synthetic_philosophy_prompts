answer: |-
  ## MEMORANDUM  
  **TO:** Civil Jury Instructions Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** October 26, 2023  
  **RE:** Proposed Revision of Causation Instruction for Multiple Independent Sufficient Causes ("Overdetermination")  

  ### I. The Problem: When "But-For" and "Substantial Factor" Fall Short  
  Our current instruction relies on "but-for" causation as the default and uses "substantial factor" as a workaround for cases like **two independently sufficient fires merging to destroy a barn**—where neither fire alone satisfies but-for causation (since the barn would have burned down by the other fire anyway). While "substantial factor" pragmatically allows liability, it is notoriously vague. It fails to explain *why* each defendant is responsible when their conduct wasn’t strictly necessary. Philosophically, David Lewis’s counterfactual theory struggles here because it evaluates causes in isolation: asking "Would the harm have occurred if *this specific fire* were absent?" leads to a "no" for each fire individually—a logical dead end.  

  ### II. A Better Foundation: The Interventionist/Structural Causal Model  
  Recent advances in causal theory—notably Judea Pearl's *structural causal models* (SCMs) and Joseph Halpern's refinement of "actual causation"—provide a rigorous framework for overdetermination. This approach:  
  1.  **Models the entire causal system** (e.g., Fire A, Fire B, Barn Integrity) as variables in a network.  
  2.  **Evaluates necessity within the actual context** by "freezing" other variables at their real-world values.  
  3.  **Asks if the defendant’s conduct was a critical link** in a sufficient causal pathway under the actual circumstances.  

  Under Halpern-Pearl’s definition, a cause is "actual" if:  
  - **(a)** There exists a set of background conditions (held fixed at actual values);  
  - **(b)** The defendant’s conduct was necessary for the outcome *given those fixed conditions*; and  
  - **(c)** The conduct is not redundant under any allowable variation.  

  In the barn-fire case:  
  - Holding Fire B’s existence fixed, Fire A was necessary for the barn burning *at the exact time and manner it did*.  
  - Fire A is part of a "sufficient set" (Fire A + Oxygen + Combustible Barn) that actually produced the harm.  
  - The same logic applies symmetrically to Fire B.  

  This satisfies fairness: each fire was an indispensable element of a causal pathway that *actually* produced the harm.  

  ### III. Proposed Jury Instruction  
  **Causation – Multiple Sufficient Causes (Overdetermination)**  

  > "If you find that the plaintiff’s harm would not have occurred when and as it did without the defendant’s negligent conduct, then the defendant’s conduct is a cause of the harm.  
  >  
  > **Even if you find that the harm would have occurred at the same time and in the same way due to another independent cause**, the defendant’s conduct is still a cause of the harm if:  
  > 1.  The defendant’s conduct was negligent;  
  > 2.  The defendant’s conduct, by itself under the actual conditions, was sufficient to bring about the entire harm or a distinct portion of it; **and**  
  > 3.  The defendant’s conduct was a necessary part of a causal process that actually contributed to the harm.  
  >  
  > *Explanation*: In such cases, each cause is responsible because it played an essential role in producing the harm under the actual circumstances—even if another cause alone might have been sufficient."  

  #### Key Features of the Proposed Language:  
  - **Replaces "substantial factor"** with explicit criteria grounded in structural causation.  
  - **Emphasizes the actual context** ("under the actual conditions," "actually contributed") to align with Halpern-Pearl.  
  - **Clarifies timing/outcome specificity** ("when and as it did") to resolve but-for failures.  
  - **Avoids technical jargon** while capturing the essence of SCMs.  

  ### IV. Why This Is Superior to "Substantial Factor"  
  1.  **Theoretical Rigor**: Resolves overdetermination without logical inconsistency by modeling causal dependencies.  
  2.  **Precision**: Provides concrete criteria (necessity within a sufficient set) instead of an undefined "substantiality" test.  
  3.  **Future-Proofing**: Handles complex scenarios (e.g., partial preemption, concurrent delays) better than ad-hoc workarounds.  
  4.  **Fairness**: Justifies liability by showing each defendant’s conduct was essential to the actual causal chain.  

  ### V. Best Argument for Retaining "Substantial Factor"  
  **Judicial Pragmatism and Jury Comprehension**: The "substantial factor" test, while philosophically shallow, is deeply embedded in precedent. Courts know it, appellate decisions interpret it, and jurors intuitively grasp it as a "common sense" standard. Replacing it risks confusion during trials and appeals—especially where simpler cases don’t require structural causal analysis. There is value in familiarity: jurors might struggle with concepts like "necessary part of a causal process" more than with "substantial factor."  

  ### VI. Recommendation  
  Adopt the proposed instruction. It corrects a theoretical flaw in our current approach while providing clearer guidance for complex cases. If the committee prefers a transitional step, we could:  
  - **Hybrid Option**: Keep "substantial factor" but define it using the proposed criteria:  
  > *"A ‘substantial factor’ is one that was a necessary part of a sufficient causal process under the actual circumstances."*  

  This bridges precedent and modern theory, ensuring our instructions remain both legally sound and philosophically coherent.  

  ---  
  **APPENDIX: Conceptual Sources**  
  - Halpern, J. Y., & Pearl, J. (2005). Causes and Explanations: A Structural-Model Approach. *British Journal for the Philosophy of Science*.  
  - Pearl, J. (2009). *Causality: Models, Reasoning, and Inference*. Cambridge University Press.  
  - Restatement (Third) of Torts §27 cmt. b (adopting "necessary element of a sufficient set" (NESS) test, aligned with structural models).  

  **Ready to discuss draft language or theoretical details at our next meeting.**
