answer: |-
  ## Memorandum: Recommendation on Workshop Income Pooling

  **To:** Rotating Governance Council & House Members  
  **From:** [Your Name], Council Member  
  **Date:** [Thursday's Date]  
  **Subject:** Recommendation Regarding Treatment of Workshop Income Under House Bylaws  

  ### I. Background & Core Dispute
  This memo addresses whether income generated from paid applied rationality workshops constitutes "outside earnings" subject to pooling under our house bylaws. The dispute centers on a member whose workshop income significantly exceeds the house median. Her position is that this income, derived from skills developed independently and payments made voluntarily by strangers, falls outside the bylaw's intent and constitutes an unjust claim by others. Two council members counter that the house provided essential early support (test audience, referrals, credibility), and that exempting windfalls undermines the mutual insurance principle fundamental to our agreement.

  ### II. Analysis of Key Arguments

  *   **The Member's Case (Nozickian Autonomy):**  
      Citing Nozick's Wilt Chamberlain argument highlights concerns about rewarding effort and respecting voluntary transactions. Her core objection possesses moral weight: compelling someone to surrender earnings from self-created value *can* feel like an unjust taking, especially when the value wasn't directly enabled by the pool. **However, Nozick's argument targets *state-enforced* redistribution.** Our arrangement is fundamentally different: a **voluntary, pre-commitment** among consenting adults for mutual benefit. By freely joining and signing the bylaw, members *waived* the right to full retention of certain future earnings in exchange for insurance against downside risk and communal support. The "claim" others have stems from this *contract*, not an inherent moral right. While her effort deserves recognition, the Nozickian objection doesn't cleanly negate her prior voluntary agreement.

  *   **The Pooling Advocates' Case (Mutuality & Sustainability):**  
      The arguments about house contribution (testing, referrals, credibility) and systemic risk are compelling. The fund's viability *depends* on participants not opting out upon success. Exempting windfalls creates moral hazard: members enjoy insurance against failure but privatize disproportionate gains, effectively free-riding on the safety net during their risky venture's vulnerable phase. The house environment demonstrably provided fertile ground for piloting and launching this venture, creating a legitimate, albeit indirect, claim.

  ### III. Recommendation: Structured Middle Ground (Graduated Phase-Out with Credit)
  **I recommend adopting a *Graduated Phase-Out* model for significant, novel income streams demonstrably built using house capital, combined with *Credit for Past Contributions*.** This balances fairness, incentivizes enterprise, upholds the core insurance function, and provides a clear precedent.

  1.  **Graduated Phase-Out:**
      *   **Year 1:** 75% of net workshop profit above stipend is pooled; 25% retained by earner.
      *   **Year 2:** 50% pooled; 50% retained.
      *   **Year 3+:** 0% pooled (full exemption).
      *   **Rationale:** This acknowledges the house's initial, crucial contribution to launch and credibility. As the business matures and becomes self-sustaining, reliance on the house's "social capital" diminishes. The phase-out rewards sustained effort while ensuring the pool benefits significantly during the period where its contribution was most impactful. It mitigates the "privatize gains, socialize losses" problem inherent in a clean exemption.

  2.  **Credit for Past In-Kind Contributions:**
      *   Calculate the fair market value of the free workshops provided to housemates during the pilot phase (e.g., # of sessions x reasonable market rate per attendee).
      *   This total value is credited *against the earner's Year 1 pooling obligation*.
      *   **Rationale:** This formally recognizes and compensates for the tangible value already provided *to the house community* before monetization. It directly addresses the argument that housemates contributed to the venture's development.

  3.  **Application to Current Case:**
      *   Apply the credit for past workshops first.
      *   Apply the Year 1 75% pooling rule to *net* workshop profits (after business expenses) earned since monetization began, minus the credit amount. If credit exceeds Year 1 obligation, no further pooling is required for Year 1, but the phase-out schedule continues for future earnings.
      *   Proceed to Year 2/Year 3 based on the anniversary of the first paid workshop.

  ### IV. Why This Position & Precedent

  *   **Engages Core Concerns:** Directly addresses the house's contribution (via credit and initial phase-out %) while respecting the member's entrepreneurial effort and autonomy (via retention % and eventual exemption).
  *   **Preserves the Insurance Principle:** Ensures the pool receives significant compensation during the high-risk/high-house-impact early phase, preventing opportunistic exits upon success.
  *   **Incentive-Compatible:** Encourages members to develop ventures using house resources *knowing* they will retain an increasing share of success, while the community still benefits.
  *   **Clear Precedent for Future Cases:** This model applies to *any* significant, novel income stream demonstrably piloted or launched leveraging house social capital (e.g., referrals, test audience, shared address for credibility). Income from established external jobs remains fully poolable. The phase-out schedule and credit mechanism provide a replicable formula.
  *   **Superior to Alternatives:**
      *   *Full Pooling:* Disincentivizes initiative and fails to acknowledge unique effort/market creation. Feels unjust for true windfalls.
      *   *Clean Exemption:* Undermines mutuality, ignores house contributions, creates moral hazard, jeopardizes fund stability.
      *   *Fixed Cap:* Arbitrary; doesn't scale with income or time. Less adaptable.
      *   *One-Off Buyout:* Difficult to value fairly; doesn't solve systemic issue for future cases.

  ### V. Addressing the Losing Arguments Seriously

  *   **To the Member (if recommendation passes):** Your effort and skill in building this venture are undeniable and deserve significant reward. The phase-out ensures you retain the vast majority of long-term gains. The initial sharing requirement recognizes that the venture's *launchpad* was inextricably linked to this unique community. The contract we all signed traded some upside potential for collective security. This recommendation ensures you are compensated for past contributions (credit) and keeps the community whole, which ultimately benefits everyone, including future entrepreneurs here.
  *   **To Pooling Advocates (if recommendation passes):** A clean exemption *would* be corrosive. This recommendation ensures the pool receives substantial compensation (75% initially, plus credit) precisely when the house's contribution was most vital. The phase-out protects the fund's core insurance function by capturing value during the risky startup phase while acknowledging that ongoing, self-sustaining success relies less on communal capital. It strikes a balance that sustains the arrangement long-term by making success *within* the house desirable.

  ### VI. Conclusion
  The strength of our house lies in balancing individual initiative with mutual support. The Graduated Phase-Out with Credit honors the voluntary contract we entered, recognizes the specific contributions made by both the individual and the community in this unique case, protects the fund's purpose, and establishes a fair and predictable precedent for future entrepreneurial ventures arising from our shared environment. I recommend the council adopt this model for the current workshop income and amend the bylaws to incorporate this framework for similar future income streams.
