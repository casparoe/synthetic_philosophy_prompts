answer: |-
  Your frustration is understandable—the "anti-Humean" label *does* mask significant internal diversity. Let's dissect the landscape beyond the textbook dichotomy, focusing on your specific questions about dispositional essentialism (DE) and the separability of Humean commitments.

  **1. Dispositional Essentialism: A Distinct Third Option or Collapsible?**

  DE is **genuinely distinct** from both Lewisian Humeanism *and* Armstrong-style necessitarianism, though it firmly falls under the broader anti-Humean umbrella. It avoids collapsing into either:

  *   **vs. Lewisian Humeanism:**
      *   **Ontology:** DE posits irreducible modal structure *within* the fundamental properties themselves (causal powers/dispositions). Properties *are* powers. This contrasts sharply with the Humean mosaic, where all facts are categorical (non-modal) and modality arises only from systematization.
      *   **Explanation:** For DE, laws *flow from* the essential nature of properties. Charge *just is* the power to attract opposites and repel likes. The law describing this is a *consequence* of what charge *is*. Humeanism explains laws as our best summaries; DE explains laws as grounded in the fundamental ontology.
      *   **Modality:** DE builds modality (necessity, possibility) directly into the world's fabric at the fundamental level. Properties *necessitate* their manifestations given triggering conditions. Humeanism derives modality from patterns and systematization.

  *   **vs. Armstrongian Necessitarianism:**
      *   **Grounding of Necessity:** Armstrong needs a brute, external "necessitation relation" (N) between distinct universals to explain *why* the law holds (F-ness *N* G-ness). This "governing" relation is often criticized as mysterious ("unconnected necessitation"). DE dissolves this problem: the necessity is *internal* to the property. Charge's *essence includes* the power to exert electromagnetic forces. The law isn't imposed *on* charge; it *is* what charge *does* by its very nature.
      *   **Contingency of Laws:** Armstrong allows that the *same* universals could be governed by *different* laws (contingent N-relations). DE claims that the identity of a property *is* determined by its causal profile. If a property had different powers, it would be a *different* property. Laws are metaphysically necessary truths grounded in the essences of properties.
      *   **Role of Properties:** For Armstrong, universals are categorical entities *to which* laws apply. For DE, properties *are* inherently active, defined by their causal roles.

  **Does it Collapse?**
  *   **Into Necessitarianism?** Only in the broadest sense that both affirm necessary connections in nature. But DE replaces Armstrong's external, contingent necessitation relation with internal, essential modal structure. It answers the "why?" question Armstrong struggles with: *why* does F necessitate G? *Because being F just is having the power to bring about G in circumstances C.* This is a significant ontological and explanatory difference.
  *   **Into Humeanism?** No. The core Humean commitment is the denial of necessary connections between distinct existences *at the fundamental level*. DE explicitly posits such necessary connections *as fundamental*. While a Humean might *describe* a DE world using a best system, the underlying ontology and source of modality are radically different. DE worlds have *intrinsic* modality; Humean worlds have only *extrinsic* (systematization-dependent) modality.

  **DE as a Robust Anti-Humean Species:** DE is best understood as a sophisticated *version* of anti-Humeanism that addresses key weaknesses of traditional necessitarianism (the mystery of N) by grounding lawhood *immanently* within the essential nature of properties themselves. It offers a different answer to the question "What *makes* a law a law?" compared to both Humeanism (systematization) and Armstrong (external necessitation relation).

  **2. Humeanism about Laws: Tied to Humeanism about Causation & Counterfactuals?**

  Lewisian Humeanism is a **package deal**, tightly linking laws, causation, and counterfactuals. Here's why separability is difficult:

  1.  **The Best System Analysis (BSA) Scope:** Lewis's BSA aims to systematize *the entire Humean mosaic*. Causation and counterfactuals are part of that mosaic (sequences of events, patterns of resemblance). Lewis explicitly defines causation (as influence) and counterfactuals *in terms of* the laws + particular facts delivered by the BSA.
      *   **Causation (Lewis):** Roughly, event C causes event E if there is a chain of stepwise influence from C to E, where influence involves whether altering C would lead to a difference in E according to the laws and facts. Laws are central to the counterfactuals defining causation.
      *   **Counterfactuals (Lewis):** "If A were the case, C would be the case" is true if, in the closest possible world(s) where A is true, C is true. "Closeness" is heavily weighted by *similarity in laws* and particular facts. Laws are fundamental to evaluating counterfactuals.
  2.  **The Source of Modality:** Humeanism derives *all* non-logical modality (physical necessity, possibility, counterfactual dependence, causal connection) from the patterns in the mosaic and their systematization via the BSA. Laws are the cornerstone of this derived modality. Introducing a non-Humean source for causation or counterfactuals (e.g., primitive causal powers or singular causation) would undermine this unified, pattern-based account of modality. Why have two sources?
  3.  **Motivation for Humeanism:** A core motivation for Humeanism about laws is often a broader commitment to *metaphysical supervenience*: all truths supervene on the distribution of fundamental, non-modal, categorical properties across spacetime (the mosaic). If causation or counterfactuals were *not* supervenient on this mosaic (i.e., if they involved irreducible modal connections or powers), this would violate the supervenience thesis that underpins Humeanism about laws. The BSA *needs* the mosaic to be modally inert.

  **Could There be a Hybrid View?** It's *conceivable* but unstable and unmotivated within the standard framework:

  *   **Humean Laws + Non-Humean Causation:** Imagine laws are summaries (BSA), but causation is primitive singular production. Problems:
      *   What role do the summarized laws play if causation is primitive?
      *   How do laws constrain or relate to primitive causation? If they don't, laws seem epiphenomenal. If they do, how is that relation explained without invoking further modality?
      *   The BSA aims for strength – ignoring fundamental causal connections would make the system weaker.
  *   **Humean Laws + Non-Humean Counterfactuals:** Imagine laws are summaries, but counterfactual truth is determined primitively or by powers. Problems:
      *   The BSA uses counterfactual robustness (how well the system supports true counterfactuals) as a key criterion for being "best." If counterfactuals are fixed primitively, how does the BSA latch onto them? The system's ability to support counterfactuals would be a *consequence* of primitive counterfactual truth, not a *basis* for it.
      *   Evaluating closeness for counterfactuals relies heavily on law-similarity. If laws are summaries but counterfactuals are primitive, the connection seems broken.

  **Conclusion on Hybrids:** While one can *stipulate* such a hybrid position, it lacks the internal coherence and motivation of Lewis's package. It severs the carefully constructed links within the Humean system for deriving all modality from non-modal foundations. Most philosophers working within the Lewisian framework see the commitments as intertwined. Adopting Humeanism about laws strongly pulls one towards Humean accounts of causation and counterfactuals, as they are interdependent components of the systematization project.

  **Where the Real Dividing Lines Are:**

  1.  **Source of Modality:**
      *   *Humean:* Derived entirely from patterns & systematization (extrinsic, global).
      *   *Necessitarian (Armstrong):* Brute external necessitation relations between universals.
      *   *Dispositional Essentialist:* Intrinsic to the essential nature of fundamental properties (immanent).
      *   *Primitivist (Maudlin):* Lawhood itself is a fundamental, irreducible feature of reality ("It's a law that L" is a brute fact).
  2.  **Nature of Properties:**
      *   *Humean:* Categorical (no intrinsic modal profile).
      *   *Necessitarian:* Categorical universals *governed* by external laws.
      *   *Dispositional Essentialist:* Properties *are* clusters of causal powers/dispositions (identity defined modally).
      *   *Primitivist:* Compatible with categorical properties, but lawhood is an additional brute fact *about* them/their behavior.
  3.  **Explanation of Laws:**
      *   *Humean:* Explained by our epistemic goals (simplicity+strength) applied to the mosaic.
      *   *Necessitarian:* Explained (problematically) by brute N-relations.
      *   *Dispositional Essentialist:* Explained by the essential nature of properties.
      *   *Primitivist:* Unexplained brute fact.
  4.  **Contingency of Laws:**
      *   *Humean:* Contingent (different mosaic, different best system).
      *   *Necessitarian:* Contingent (different N-relations possible between same universals).
      *   *Dispositional Essentialist:* Necessary (different laws imply different properties).
      *   *Primitivist:* Contingent (brute laws could be different).

  DE carves out a clear space by grounding laws *in* the essential, active nature of properties, avoiding both the "governing mystery" of Armstrong and the "modality-from-non-modal" challenge of Humeanism. While Humeanism about laws is deeply entwined with its accounts of causation and counterfactuals within the Lewisian system, focusing on the *source and nature of modality* provides the sharpest tool for distinguishing all these views. Your professor's "obvious" distinction is just the entry point; the real philosophical action lies in the nuanced battles *within* the anti-Humean camp and the intricate connections between lawhood and other modal concepts.
