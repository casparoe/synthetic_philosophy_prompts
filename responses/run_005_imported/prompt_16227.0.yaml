   Specifically:

     - The backward induction argument for the entire game is built on the foundation that at the last move, the player will act rationally. Then the second-to-last player, knowing that, acts accordingly, and so on.
     - Once a player in the middle of the game does not act as the backward induction prescribes, the players must now form new beliefs about the rationality of the other and about the other's beliefs.

   In the diamond example:

     After Bob extends at stage 1 (which he shouldn't do under backward induction), Alice now has to consider:

