          Possibility 2: Bob is not rational. Then he might do anything at stage 3.
          Possibility 3: Bob is rational but has a different utility function? (e.g., he cares about fairness, or he is trying to build a reputation for a longer game).

   But note: in the standard game, we assume both players are rational and only care about maximizing their own monetary payoff.

   So in the novel, the character who sees the deviation might say:

     "You just did something that, according to the logic of backward induction, is irrational. That means either you are irrational, or you believe I am irrational, or you are not solely motivated by money. But if I now assume you are irrational, then I cannot predict your next move. Alternatively, if you believe I am irrational, then you might expect me to extend at stage 2? And then you can seize at stage 3? But if I extend at stage 2, then at stage 3 you would seize and I would get nothing. So I won't extend. Unless... unless you are not solely motivated by money and you would then extend at stage 3? But why would you?"

   This is the core of the argument: the deviation breaks the chain of reasoning and forces the players to reevaluate the entire game.

   To summarize:

     Concrete situation: The diamond polishing partnership with 5 turns (as described) and the payoffs as above.

     Backward induction: Alice should seize at the very first turn.

     The conclusion depends on common knowledge of rationality: each player is rational, each player knows the other is rational, and so on, ad infinitum.

     The moment Bob (at turn 2) declines to seize (when backward induction says he should), then:

          - Alice (at turn 3) can no longer be certain that Bob will seize at stage 3 (if she extends). 
          - The entire backward induction argument for the rest of the game is thrown into doubt.
          - Alice must now form a new belief about Bob's rationality and his future actions.

