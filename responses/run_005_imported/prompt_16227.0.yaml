   But if Bob does extend (which is irrational under common knowledge of rationality), then what happens? Alice now observes that Bob extended. This breaks the common knowledge of rationality. Now Alice must update her belief: maybe Bob is not rational? Or maybe Bob believes that Alice is not rational? 

