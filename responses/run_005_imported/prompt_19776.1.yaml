  Here’s a speech that navigates the tension with warmth, humor, and a clear resolution, while embedding your concepts naturally:

  **(Clink glass gently, warm smile)**  
  "Good evening, everyone. For those who don’t know me, I’m [Your Name], and I’ve had the dubious honor of being [Groom's Name]’s oldest friend. That means I’ve witnessed… well… *all* of it. The grand plans, the boundless enthusiasm… and the eleven gym memberships that lasted roughly as long as it takes to say ‘leg day.’ **(Light laughter)** I’ve seen the novel that’s been ‘one chapter away’ since the Obama administration. And I can confirm that ‘Future [Groom's Name]’ – that mysterious, highly capable guy who lives just around the corner in tomorrow-land? Yeah, he’s notoriously unreliable. Present [Groom's Name] makes him all sorts of promises, and that future guy? He never shows up. **(Affectionate chuckles, glance at Groom)**  

  Now, I’ve done some deep-dive reading on why this happens to the best of us – stumbled into some fancy Greek philosophy terms about knowing the right thing but doing the opposite, and some economic models about how rewards feel different depending on how far off they are. **But here’s the beautiful, important twist tonight: This wedding? This isn't [Groom's Name] trusting that future guy to finally show up. This is him *tying that future guy to the mast*.** This is his first truly successful Ulysses Pact. **(Pause for effect, warm smile at Bride and Groom)**  

  See, the gym membership? That was just [Groom's Name] and Future [Groom's Name] making a quiet, private handshake. Easy to ignore when the alarm goes off at 6 AM. The novel? A whispered promise in his own head. But *this*? **(Gesture around the room)** This is different. Profoundly different.  

  He didn’t just *decide* to marry [Bride's Name] one distant day. He stood right here, in front of all of you – his family, her family, his oldest friends who know *exactly* how that future guy operates **(smile at friends)** – and he made a vow. A public, solemn, *loud* declaration. He signed legal documents! **(Light chuckle)** He invited you all to witness it, to hold him to it, to be part of the very structure of this promise. He didn't just hope; he built scaffolding.  

  **And that’s the genius shift.** The old patterns worked because they were discounts made in isolation. Quiet promises with no witnesses, easily renegotiated by present-you when future-you felt inconvenient. **But a vow made this loudly, this joyfully, surrounded by this much love and accountability? That doesn't get quietly discounted.** It echoes. It resonates. It becomes part of the fabric of who you both *are*, together.  

  **[Groom's Name] didn’t magically overcome his human wiring tonight. He outsmarted it.** He knew himself well enough to know that the most important promise of his life needed more than a hopeful whisper to the future. It needed the weight of this moment, the strength of [Bride's Name]'s incredible love and clear-eyed partnership, and the unwavering support of all of you. He tied his own hands to the wheel, knowing the journey ahead might have storms, but also knowing the destination – a life with [Bride's Name] – is worth any rough seas.  

  **So, that future [Groom's Name] who never showed up for the treadmill? He doesn't get a vote tonight.** He’s been decisively, beautifully overruled by the man standing here now – the man who looked at [Bride's Name], looked at this incredible life they’re building, and said, ‘This is too important to leave to chance. This is the mast I choose to be tied to.’  

  **[Bride's Name],** you are his anchor and his sail. You inspire this kind of commitment in him. **And [Groom's Name],** this pact you’ve made? It’s the wisest, bravest, most *you* thing I’ve ever seen you do. It shows how deeply you love her, and how well you finally understand what truly matters.  

  **So let’s raise a glass:** To [Bride's Name] and [Groom's Name]! May your love always be the loudest voice in the room, the strongest tie to the mast, and the most brilliantly undeniable reason to show up – today, tomorrow, and for every future that comes. Cheers!"  

  **Why this works:**  

  1.  **Acknowledges the Pattern Warmly:** Uses specific, relatable examples (gym, novel) with affectionate humor, framing "future him" as a running joke among friends – not a character flaw.  
  2.  **Introduces Concepts Accessibly:** "Fancy Greek philosophy terms" and "economic models" are placeholders, not jargon. "Tying himself to the mast" is the clear, visual metaphor anyone understands. The *phrase* "Ulysses Pact" is the insider nod – recognizable to those who know it, just an evocative historical reference to others.  
  3.  **Resolves the Tension Explicitly:** Directly contrasts the *private*, easily discounted promises (gym, novel) with the *public, structural, communal* nature of the wedding vow ("public, solemn, *loud* declaration," "signed legal documents," "invited you all to witness," "built scaffolding"). This is the key argument: **The context fundamentally changes the promise, making it resistant to discounting.**  
  4.  **Reframes "Weakness" as Wisdom & Love:** "He didn’t magically overcome his human wiring... He outsmarted it." "He knew himself well enough..." This turns the past pattern into proof of growth and deep commitment *to her*. The "scaffolding" is smart, not a sign of weakness.  
  5.  **The Sharp Line for Insiders:** "**This is him *tying that future guy to the mast*.** This is his first truly successful Ulysses Pact." This clearly signals the concepts to those familiar, while being a powerful and understandable metaphor for all. The later line "that future [Groom's Name]... doesn't get a vote tonight" reinforces it perfectly.  
  6.  **Warmth & Focus on Love:** The core message is about the power of their love ([Bride's Name] as "anchor and sail"), his commitment *to her*, and the supportive community. The concepts serve the toast, not the other way around.  
  7.  **Confidence in the Promise:** Ending with "the wisest, bravest, most *you* thing" and "how deeply you love her" grounds the "pact" in genuine emotion and character growth, leaving no doubt about the sincerity and durability of the vows.  

  **Delivery Tip:** Practice the pacing, especially around the key lines ("tying that future guy to the mast," "doesn't get quietly discounted," "doesn't get a vote tonight"). Let the affection for your friend and genuine happiness for the couple shine through. Good luck! You'll be great.
