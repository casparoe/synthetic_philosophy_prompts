answer: |-
  Here’s my best shot at a raw, Humean-style reconstruction of Selby-Bigge’s Hume grappling with the discursive dilemma, warts and all:

  ---

  **Hume (via Selby-Bigge, probably muttering into his claret):** "Aye, this modern *discursive dilemma* – List, Pettit, clever fellows, no doubt – but it surprises me not a whit. ‘Tis but a newfangled syllogism for an old truth I hammered at til my quills blunted: that **Reason is, and ought only to be, the slave of the passions**, and this holds doubly, trebly, for these *artificial* bodies men cobble together.

  "Look you: Each man votes consistently? Good! His reason serves *his* sentiments, *his* impressions, *his* local view of utility. But then you gather these votes like so many pebbles and pretend the *heap* has a rational soul? Folly! You’ve manufactured a phantom – an ‘institution’ – and then gasp when this phantom, this *artifice*, lacks the internal coherence of a single mind? Why should it? It has no single mind! It has no impressions, no passions binding its parts! ‘Tis a contraption, a mechanism of convention, not an organism of reason.

  "The inconsistency these lads uncover? ‘Tis no deep paradox; ‘tis the **inevitable spasm of an artificial construct straining under a demand it was never meant to bear: logical unity.** Parliaments, courts – they are not giant calculating engines. They are **devices for producing decisions**, for settling disputes, for maintaining order – often *despite* the clashing particulars of individual judgments. Their ‘rationality’ is *practical*, not syllogistic. It lies in the *stability* they provide, the *authority* they confer, the *habit* of obedience they inculcate – not in the flawless deduction of conclusions from premises.

  "What would I make of it? **Vindication, plain and simple.** This ‘dilemma’ lays bare the very artifice I described. It shows the **futility of expecting collective reason to mirror individual reason.** The ‘incoherence’ isn’t a failure; it’s a revelation of the *nature* of the beast. The collective verdict isn’t *discovered* by logic; it’s *made* by procedure. Majority vote on propositions? A useful tool, perhaps, but one prone to these ‘spasms’. So what? We don’t abandon the tool because it sometimes jars; we **fudge the outputs, appeal to precedent, let a speaker or judge break the tie, or simply muddle through.** We rely on **custom, authority, and the sheer inertia of established practice** to paper over the logical cracks. That’s the ‘Humean trick’, if you will: **dissolving the *need* for the paradox by denying that perfect collective logical consistency is either achievable or necessary for the institution’s function.**

  "These aggregation theorists, they chase a phantom coherence. They want the parliament to reason like a philosopher. But a parliament that reasoned like a single philosopher would be a tyranny! The virtue of these artificial bodies lies precisely in their **aggregation of diverse, partial, passionate judgments** – even if the sum is sometimes logically messy. The ‘dilemma’ is only a *problem* if you fetishize formal consistency over practical utility. I never did. The court’s verdict stands because it is *the court’s verdict*, backed by custom and force, not because it flawlessly deduced P and Q therefore R from the jurors' votes. If the verdict settles the dispute and maintains order, its ‘incoherence’ in the abstract ledger of logic is irrelevant. **Reason serves the passions; the institution serves the peace.** Let the logicians puzzle; the world rolls on by habit and contrivance."

  ---

  **Key Humean Moves in this Reconstruction:**

  1.  **Anti-Rationalism about Collectives:** Denies collective bodies possess a unified rational faculty. They are artifacts, not super-minds.
  2.  **Primacy of Passion/Utility:** The *purpose* of institutions is practical (order, settlement, utility), not logical perfection. Their "rationality" is judged by this standard.
  3.  **Artifice & Convention:** Collective rationality is a human construct, arising from convention and necessity, not logical deduction. Its flaws are features of its artificiality.
  4.  **Dissolving the "Problem":** The paradox only seems urgent if you mistakenly demand logical coherence *as the primary goal*. Hume dismisses this demand. The *real* function of institutions (producing workable decisions/order) doesn't require it and has mechanisms (custom, authority, procedure) to cope with the inconsistency.
  5.  **Skepticism about Pure Reason's Authority:** Reason alone cannot dictate how collectives *should* aggregate; it's subordinate to the practical needs and passions that drive the creation of institutions.
  6.  **Habit & Custom as Glue:** The solution to the "problem" isn't a better logical rule, but the non-logical forces of habit, custom, and established authority that make the inconsistent collective verdict *stick* and serve its purpose anyway.

  He wouldn't be *surprised* by List & Pettit; he'd see it as elegant proof of his core thesis about the artificial, passion-driven, non-rational foundation of collective life. The "trick" is reframing the question away from logic towards utility and convention.
