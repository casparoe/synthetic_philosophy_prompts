answer: |-
  You've pinpointed a profound and enduring tension between moral philosophy and mainstream climate economics. Your skepticism is well-founded: **Yes, mainstream climate economics (as practiced by Nordhaus and others) *does* rely on premises regarding time discounting that moral philosophy, following Sidgwick and Parfit, has compellingly argued are ethically indefensible when applied to intergenerational justice, particularly for climate change.**

  Here's a breakdown of the arguments and the assessment you requested:

  1.  **The Moral Philosophy Argument (Sidgwick/Parfit):**
      *   **Core Premise:** Pure time preference (δ > 0) – discounting future well-being *solely* because it occurs later in time – is irrational and unethical.
      *   **Rationality:** There is no logical reason why the mere passage of time should diminish the value of a unit of well-being experienced by a future person.
      *   **Ethics:** Discounting the well-being of future people *just because they live in the future* violates fundamental principles of impartiality and equal consideration of interests. It treats future generations as less morally significant than the present one. As Parfit argued in *Reasons and Persons*, our moral principles shouldn't depend on *when* someone exists.

  2.  **The Economists' Justification for Positive Discount Rates (Nordhaus et al.):**
      Economists typically defend positive discount rates using the **Ramsey Formula** framework:
      `r = δ + η * g`
      *   **r:** Social Discount Rate (SDR)
      *   **δ (Delta):** Pure Rate of Time Preference (PRTP). *This is the contentious part.*
      *   **η (Eta):** Elasticity of Marginal Utility of Consumption (measures aversion to inequality).
      *   **g:** Projected growth rate of per capita consumption.
      *   Economists like Nordhaus argue for δ > 0 based on:
          *   **Descriptive/Revealed Preference:** Observing that individuals *do* discount their own future consumption/utility in markets (e.g., through interest rates). They argue policy should reflect societal preferences as observed.
          *   **Catastrophic Risk:** A positive δ can act as a proxy for the existential risk that future generations might not exist at all (e.g., asteroid impact, nuclear war). However, this risk is usually very small over relevant climate timescales (50-300 years).
          *   **Myopia & Impatience:** Acknowledging that individuals *are* impatient, and policy must account for political reality and the difficulty of imposing high near-term costs.
          *   **Opportunity Cost:** Capital invested today yields returns that can benefit *both* present and future generations more than specific climate investments. Discounting reflects this potential for higher future consumption *if* growth (g) is positive.

  3.  **The Crux of the Conflict & Assessment:**
      *   **"Smuggling In" Pure Time Preference:** You are absolutely correct. When economists like Nordhaus set δ > 0 (e.g., Nordhaus often uses δ ≈ 1.5% per year), **they are directly incorporating pure time preference into their models for intergenerational decisions.** This *is* the very thing Sidgwick and Parfit argued is ethically bankrupt when applied across generations. It systematically devalues the well-being of future people simply due to their temporal location.
      *   **Ethical Discrediting:** Moral philosophy *has* decisively discredited the *ethical* basis for δ > 0 in the context of intergenerational justice. Treating future lives as less valuable than present ones based solely on timing violates core principles of impartiality and non-discrimination. Philosophers widely view this as a powerful and largely successful argument.
      *   **Why Economists Persist:**
          *   **Pragmatism vs. Purity:** Economists argue their models need to reflect "real-world" decision-making, political constraints, and observed behavior, even if imperfect ethically. They prioritize policy feasibility.
          *   **Focus on Opportunity Cost & Growth:** They emphasize that even if δ = 0 (as Stern argued in his famous review), a positive discount rate (r) can still arise from η * g (aversion to inequality combined with expected growth). Nordhaus critiques Stern's near-zero δ as unrealistic and imposing unfairly high costs on the present poor.
          *   **Uncertainty:** High uncertainty about the distant future (technology, preferences, impacts) is sometimes used to justify *effective* discounting, though this is conceptually distinct from pure time preference.
          *   **Disciplinary Norms:** Discounting future costs and benefits is a deeply ingrained tool in cost-benefit analysis (CBA) across all policy domains. Applying it to climate change is seen as consistent methodology, even if the timescales are unprecedented.

  4.  **Critiques from Within and Outside Economics:**
      *   **The Stern Review (2006):** Adopted a prescriptive approach, setting δ ≈ 0 (primarily for catastrophic risk) and emphasizing the catastrophic risks of inaction. This led to much higher estimates of the "social cost of carbon" and more aggressive near-term mitigation recommendations than Nordhaus-style models. Stern explicitly grounded his choice in ethical arguments against pure time preference for intergenerational decisions.
      *   **Martin Weitzman:** Focused on the "fat tails" of climate damage distributions, arguing that discounting becomes secondary when considering potentially catastrophic, low-probability/high-impact scenarios that dominate the expected damage calculation.
      *   **Ethical Economists & Philosophers:** Argue that CBA with positive discount rates is fundamentally ill-suited for intergenerational problems with potentially irreversible, catastrophic consequences. They advocate for alternative frameworks like sustainability thresholds, rights-based approaches, or applying a near-zero δ as an ethical imperative.

  **Conclusion:**

  Your intuition is correct. **Mainstream climate economics, as represented by Nordhaus and much of the integrated assessment modeling (IAM) literature, does indeed rest upon the premise of a positive pure rate of time preference (δ > 0) for future generations' welfare. This premise has been powerfully discredited by moral philosophy (Sidgwick, Parfit, and many successors) on ethical grounds.**

  While economists offer pragmatic justifications based on observed behavior, opportunity cost, and uncertainty, these do not nullify the core ethical objection: discounting the well-being of future people simply because they live in the future is discriminatory and violates impartiality. The continued use of positive δ values in climate models represents a significant, often unacknowledged, ethical choice that systematically disadvantages future generations in the cost-benefit calculus.

  This isn't to say all discounting is invalid. Arguments based on genuine opportunity cost (η * g if g > 0) and catastrophic risk have weight, though they require careful ethical scrutiny. However, the persistence of *pure time preference* (δ > 0) in influential climate economic models remains a major point of contention and, from the perspective of moral philosophy, a serious ethical flaw in how the welfare of future generations is valued. The field of climate economics has not adequately reconciled itself with the forceful ethical critique from philosophy on this fundamental point.
