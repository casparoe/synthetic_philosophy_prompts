answer: |-
  You've pinpointed a crucial and subtle passage where Sidgwick challenges Hume's core assumption. Let's break down Sidgwick's argument step-by-step to clarify his objection and its significance:

  ### Step 1: Hume's Argument Summarized (as Sidgwick presents it)
  *   When evaluating a reported marvel (like a miracle or paranormal event), we must weigh two improbabilities:
      *   **Improbability A:** That the marvel *actually occurred* (given it's "contrary to experience").
      *   **Improbability B:** That the testimony about it *is false* (due to error, deceit, etc.).
  *   Hume claims we have a simple, decisive scale: **"It is contrary to experience that miracles should be true, and not contrary to experience that testimony should be false."**
  *   **Hume's Implication:** Improbability A (the marvel happening) is *always* vastly greater than Improbability B (the testimony being false). Therefore, it's *always* more rational to believe the testimony is flawed than that the marvel happened. Novelty itself is a disqualifier.

  ### Step 2: Sidgwick's Core Objection - Unpacking "Contrary to Experience"
  Sidgwick argues that Hume's key term, "contrary to experience," is misleadingly strong and simplistic. He offers a more precise definition:
  *   "Contrary to experience" **does not mean** logically impossible, metaphysically impossible, or absolutely disproven by all possible evidence.
  *   It **only means** "unlike previous experience" – or more precisely, "unlike that portion of experience which has been collected, handed down, and systematised by competent persons." In essence: **novel and unfamiliar**.
      *   *Example:* A European in 1500 hearing reports of a magnetic compass might say its behavior is "contrary to experience." It *was* novel and unlike systematized natural philosophy at the time.

  ### Step 3: The Crucial Consequence of Sidgwick's Definition
  *   If "contrary to experience" *only* means **novel and unfamiliar**, then labeling a marvel as such **does not automatically assign it an extreme, overwhelming improbability**.
  *   **Novelty is not unique to marvels:** Sidgwick emphasizes a profound historical point: "different portions of mankind have been continually coming across things that were at first entirely novel and strange, though further acquaintance has rendered them familiar."
      *   *Examples:* Magnetism, electricity, meteorites falling from the sky, the existence of entire continents (Americas), the behavior of gases under pressure, germ theory – *all* were once "contrary to experience" in the sense of being utterly novel and challenging to existing systematized knowledge. They were initially deemed "impossible" by some authorities based on *their* experience.

  ### Step 4: Sidgwick's Rejection of Hume's "Scales"
  *   Because "contrary to experience" only signifies novelty, Hume's proposed scale is **invalid**.
  *   **Hume's Scale:** `Improbability(A) [Extreme - "Contrary to Experience"]` **ALWAYS >** `Improbability(B) [Moderate - "Not Contrary to Experience"]`
  *   **Sidgwick's Correction:** `Improbability(A) [Significant - "Novel/Unfamiliar"]` **CANNOT be automatically assumed to be greater than** `Improbability(B) [Variable - depends on the *specific* testimony]`
  *   **The Work Sidgwick's Move Does:**
      1.  **Dethrones Novelty as an Automatic Disqualifier:** It removes the *a priori*, absolute veto power Hume granted to existing "experience" (systematized knowledge). A novel claim isn't doomed from the start.
      2.  **Forces a Genuine Comparison:** It means we *must* actually investigate the *specific* improbability of the event *and* the *specific* improbability of the testimony being false. We can't just say "novelty wins" every time.
      3.  **Opens the Door for Investigation:** Crucially for the SPR, it justifies investigating reports of the paranormal *scientifically*. If novelty alone doesn't render investigation pointless, then gathering *new* evidence, testing claims, and critically examining testimony becomes a valid and necessary endeavor.
      4.  **Highlights the Fallibility of "Systematized Experience":** By pointing out how often genuinely true things *were* initially novel and rejected, Sidgwick undermines the authority of the "competent persons" whose systematized experience Hume relies on. Their experience is incomplete and provisional.

  ### Step 5: Clarifying Sidgwick's Stance on Hume
  *   Sidgwick is **not** saying Hume's principle is *simply wrong* in all cases. He's saying Hume's principle is **far weaker than it appears and often misapplied** because its foundational concept ("contrary to experience") is misinterpreted as signifying near-certain impossibility rather than mere novelty.
  *   **Is it just what Hume meant?** While Hume *did* talk about novelty, Sidgwick argues Hume *equated* novelty with overwhelming improbability. Sidgwick severs that equation. For Hume, novelty *was* the reason for the overwhelming improbability. Sidgwick says: novelty alone isn't sufficient grounds for assigning overwhelming improbability; the improbability must be judged based on other factors *besides* just unfamiliarity.
  *   **What work does it do?** It dismantles Hume's seemingly decisive, universal rule. It transforms the question from "Is this novel? (If yes, reject)" to "Is this claim *so* inherently improbable based on *all* evidence (including the *possibility* of new natural laws), *and* is the testimony *so* strong, that it overcomes the initial hurdle of novelty?" It shifts the burden from automatic rejection to demanding a *specific* evaluation of *both* sides of the scale for each unique case.

  ### In Summary
  Sidgwick objects that Hume misuses "contrary to experience" as a synonym for "virtually impossible" when it really just means "novel and unfamiliar." Since humanity constantly encounters truly novel phenomena that later become accepted, novelty alone cannot justify automatically assigning an event overwhelming, insurmountable improbability. Therefore, Hume's simple scale – where novelty always outweighs the chance of false testimony – is invalid. We must instead genuinely weigh the *specific* (and often uncertain) improbability of the event against the *specific* (and variable) improbability that the *particular* testimony about it is false. This move is essential for Sidgwick's project: it justifies the SPR's existence by arguing that investigating novel paranormal claims isn't inherently irrational.
