prompt: |-
  I host the interview segment of my high school philosophy club's podcast, and next month's guest is a philosopher of language who defends the classical Gricean picture of conversational implicature: every implicature, on her view, must in principle be calculable from the Cooperative Principle and the four maxims, and she's unpersuaded by both neo-Gricean 'default inference' accounts and relevance theory's replacement of the maxims with a single principle of relevance. Draft eight to ten interview questions that go beyond having her restate the position. I want at least one question on whether generalized implicatures like 'some' implicating 'not all' are really computed anew each time rather than triggered by default, one on how the calculability requirement is supposed to survive cases where a scalar implicature seems to resist cancellation once it's embedded under an operator like negation, and one on why we should keep four separate maxims instead of collapsing them into relevance theory's single principle -- and for each, a follow-up keyed to the answer she's most likely to give.
