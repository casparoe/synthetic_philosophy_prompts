prompt: |-
  My uncle loves whipping out this Popper quote at family dinners about how natural selection is basically a "metaphysical research programme" rather than real testable science, almost a tautology ("the fittest survive" = "the survivors survive"). I vaguely remember Popper recanted that later on but I dont know what actually changed his mind or how much of a walk-back it really was. Can you lay out the most important implications of Popper's full position on this (the original charge plus whatever the recantation amounted to) for arguments like my uncle's, and more broadly for whether explanations of specific traits via natural selection can ever really count as falsifiable in his sense?
