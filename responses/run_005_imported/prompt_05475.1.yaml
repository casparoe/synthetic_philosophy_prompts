answer: |-
  ## Dialogue: The Undermining Enigma

  **Characters:**  
  *   **Lewisian (L):** Committed to Humean Supervenience and the New Principle.  
  *   **Propensity Theorist (P):** Believes chances must be primitive, irreducible propensities.  

  **(The scene: A worn armchair and a sturdy lab stool face each other in a study littered with philosophy journals.)**

  1.  **L:** Look, the New Principle solves undermining cleanly. It says: *Conditional* on the entire Humean mosaic *and* the proposition that the *current* best-system chance of A is x, your credence in A should be x. It blocks assigning high credence to futures that would undermine the very chances you’re using.  
  2.  **P:** Cleanly? Perhaps formally. But you’ve gutted the *point* of the Principal Principle! The PP was meant to tell rational agents *how to set their credences based on known chances*, guiding action *now*. Your “current chance” under HS *depends on the entire future*! How can an agent *now* possibly know the proposition describing the entire mosaic? They can’t! Your “known chance” is an unknowable phantom.  
  3.  **L:** Agents don’t need omniscience! They know the *past* and *present* mosaic – the vast bulk of it. They know the laws *as best we can know them now* – the system that best balances simplicity, strength, and fit *up to now*. They defer to the chances *that system yields for the future*. The New Principle tells them *exactly* how to do that *without* risking incoherence from undermining.  
  4.  **P:** “Deferring to chances yielded by the system up to now” is precisely *not* deferring to the *true* Humean chance! The true chance *is* the one fixed by the *whole* mosaic. Your agent is deferring to a *proxy* – the current best *guess* at the final best system. That’s fundamentally different. The PP promised deference to *objective* chance itself, not our best current estimate of what the final tally might *force* the chance to be.  
  5.  **L:** But under HS, the “true objective chance” *just is* what the final best system says it is! There’s nothing *more* to defer to. The New Principle *is* deference to the *only* objective chance there is – the one defined by the system applicable to the world as a whole. Agents use their best *evidence* (past/present mosaic) to constrain their beliefs about what that final system *is*, and *then* set credence equal to the chance *that system assigns*. It’s perfectly rational.  
  6.  **P:** Rational? Consider uranium decay. I know the *propensity* of this atom to decay now is, say, 0.5 given its physical state. That’s a fact *about the present*, grounding my credence *now*. On your view, the “true” chance *now* depends on future decay frequencies! If an unlikely run of stability happens later, it retroactively *changes* what the chance *was* today. How can a rational agent *now* base their action on a “chance” that *doesn’t yet exist* as a fixed fact and might be different tomorrow? It’s madness! Only a present, non-supervenient propensity provides the stable, action-guiding anchor the PP needs.  
  7.  **L:** But how do *you* access this “propensity”? You observe frequencies, patterns. That’s your *evidence*. You infer the propensity exists as the best *explanation* for those patterns. But that’s just inference to the best explanation applied to the mosaic! HS accounts for the evidence *without* positing an extra metaphysical layer. Your propensity is a wheel that turns nothing – it explains the patterns *by being inferred from them*.  
  8.  **P:** Wrong! The propensity *explains why* the patterns are stable and projectible. It’s the *causal power* inherent in the present physical state. We access it *through* its manifestations – the frequencies – but the frequency isn’t the chance. It’s the *evidence* for the chance. Like mass: we measure force and acceleration, inferring the mass property *causing* the behaviour. Humeanism reduces mass to the patterns themselves. That’s inadequate for grounding robust laws and chances.  
  9.  **L:** And your propensity is mysterious! How does this “power” actually *constrain* the future? If it’s truly irreducible, how does it *cause* the specific outcome? Doesn’t it just push the mystery back one step? HS demystifies: chance *is* a feature of the descriptive pattern. The New Principle shows how rational agents navigate a world where that pattern is fixed holistically. They defer to the *actual* objective pattern-based chance, constrained by their *current* knowledge of the pattern.  
  10. **P:** It demystifies by *eliminating* the guiding force! The PP requires chance to be an *input* to rational deliberation, not an *output* of the world’s description. Your “actual objective chance” is only knowable *after the fact*. The New Principle doesn’t rescue deference to *objective chance as a guide*; it replaces it with deference to *our best current systematization of the past*. That’s fundamentally different and loses the normative force of the original PP.  
  11. **L:** You miss the point. The normative force comes from the *structure* of the world. The best system *is* the objective chance-maker. Deferring to the chances *it* yields, based on the evidence we have *now* about what system *will* win, *is* precisely how rationality connects to the objective probabilistic structure of reality under HS. It’s the *only* structure there is. Your propensities are metaphysical excess baggage.  
  12. **P:** And you’ve sacrificed the very thing that makes chance philosophically interesting and practically useful: its ability to rationally guide present expectation and action based on a *present* feature of reality. By tethering present chance to the unknowable future whole, you make objective chance useless *when it matters most* and render agents systematically deluded about what they are deferring to. Only primitive propensities provide the requisite present, action-guiding objectivity.  

  **Final Words (Unresolved):**  

  *   **Lewisian (L):** You’ve gone wrong by demanding a *present*, non-relational anchor for chance that ignores how probability fundamentally arises from the world’s holistic pattern; the New Principle *is* the correct account of deference within the only coherent, naturalistic metaphysics of chance. Propensities are explanatorily empty.  
  *   **Propensity Theorist (P):** *You’ve* gone wrong by conflating the *evidence* for chance (patterns) with chance *itself*, sacrificing the PP’s core function – guiding rational action *now* based on a knowable present fact – on the altar of Humean parsimony. The New Principle saves consistency at the cost of usefulness.
