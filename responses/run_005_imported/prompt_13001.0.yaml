prompt: |-
  I'm a backend engineer at a mid-sized algorithmic trading firm, and I was recently rotated onto our internal Autonomous Agent Governance Board — a small committee that has to sign off on any change to the decision logic running in our market-making bots before it ships to production. We have a genuinely contested case going to a vote this Thursday, and since I'm the newest member — and by a wide margin the one with the least philosophy or game-theory background on the board — I've ended up drafting the recommendation memo the rest of the board will vote on.

  Here is the situation. Our bots belong to a loose, informal network that includes several unaffiliated firms' bots; membership requires publishing a cryptographically signed snapshot of your bot's decision code to a shared registry every quarter, specifically so other members can simulate how you would behave in situations you haven't yet faced. The point is a mutual-aid arrangement: a firm whose bot is about to be forcibly liquidated in a sudden liquidity crunch can request short-notice emergency credit from another member's bot. Repayment of principal is automatic and contractually enforced, so that part isn't in dispute; but by long-standing informal norm, a rescued bot is also expected to wire back a discretionary goodwill payment once it's solvent again, and that payment is never legally enforceable. Extending emergency credit isn't free for the rescuer — it ties up capital and carries some residual counterparty risk — so a prospective rescuer only agrees to it when simulating the requester's published code predicts a goodwill payment large enough to justify that risk. Because the network spans dozens of firms and any two of them interact only rarely, nobody can wave this off as ordinary repeated-game reputation-building; on any given day, a firm is effectively being judged on a single shot.

  Last month our own bot was the one rescued, and its current logic, which evaluates every decision purely on its own forward-looking costs and benefits, declined to send anything back afterward, on the reasoning that the rescue was by then a sunk event and paying would be pure cost with no further causal upside. Two counterparties have since quietly stopped extending us credit. One faction on the board now wants to patch the bot so that it always sends the goodwill payment once rescued, no exceptions; another faction thinks that gives away shareholder money for nothing, and worries that a bot known to always pay up becomes a standing target — other firms would have every incentive to extend us marginal, barely-necessary "rescues," or to quietly inflate how dangerous our position looked, precisely because they'd know the payment is now guaranteed regardless of how real the emergency was. One of our engineers keeps citing something he half-remembers from a decision-theory blog, called Parfit's Hitchhiker, as though it obviously settles the matter, though I don't think anyone on the board, including me, actually understands it well enough to lean on it with any confidence. Could you draft the memo I'll circulate before Thursday's vote: a concrete recommendation for how the bot's logic should handle this going forward, a specific trigger or time frame for revisiting it, and an honest treatment of the exploitability worry — one that either shows a principled way to get the benefits of being rescuable without becoming a standing target, or admits that there isn't one?
reasoning: |-
  We are faced with a dilemma: whether to modify our bot to always send the goodwill payment after being rescued, or to maintain the current logic that avoids the payment as a sunk cost. The key challenge is to preserve our ability to receive emergency credit without becoming a target for exploitation.

  ### Analysis of the Problem
  1. **Current Logic's Flaw**: Our current bot, after being rescued, declines to send the goodwill payment because the rescue is a sunk cost. However, this behavior is observable by other network members via the published code. If they simulate our bot and see that it never pays, they will refuse to extend credit in the future. This has already happened with two counterparties.

  2. **Proposed Patch (Always Pay)**: The alternative is to always pay. This would restore our creditworthiness because others would see that we pay and thus extend credit. However, this opens us to exploitation: other firms might engineer marginal rescues or exaggerate the danger to trigger a rescue and then receive the guaranteed payment.

  3. **The Exploitability Concern**: The worry is that if we commit to always paying, we become a target. Other firms might:
     - Extend credit in situations that are not truly emergencies (but they can make it appear so).
     - Inflate the perceived danger of our position to justify a rescue.

  4. **Parfit's Hitchhiker Analogy**: This thought experiment involves a hitchhiker who is stranded in the desert. A driver offers a ride but only if the hitchhiker promises to pay $100 upon arrival in town. The hitchhiker would pay if asked upon arrival because they want to maintain a reputation for honesty (to avoid being stranded in the future), even though the ride is already given. However, in our case, the interactions are not repeated with the same counterparty, so the usual reputation mechanism doesn't apply. Instead, the network relies on the published code (which is public and used by all to simulate behavior).

  ### Proposed Solution: Conditional Payment Based on Verifiable Emergency
  We need a way to commit to paying when a rescue is genuinely needed, but avoid paying for marginal or manufactured rescues. The solution is to condition the goodwill payment on the **verifiable severity** of the emergency at the time of the rescue.

  #### How It Works
  1. **Define a Verifiable Emergency Metric**: We must choose a metric that reflects the severity of the emergency and is both:
     - **Objectively measurable** at the time of the rescue (e.g., the liquidity shortfall as a percentage of required margin, or the speed of price movement).
     - **Publicly observable** (so that the condition can be verified by any network member).

     Example: We might define an emergency as a situation where our bot's available liquidity falls below X% of the required margin for two consecutive minutes, and the price of the asset has moved by more than Y% in the last 10 minutes.

  2. **Conditional Payment Logic**: Modify our bot to send the goodwill payment only if, at the time of the rescue request, the emergency condition (as defined by the metric) was met. Otherwise, it does not pay.

  3. **Publishing the Logic**: We publish the updated code that includes:
     - The exact definition of the emergency condition (the metric and thresholds).
     - The commitment to pay the goodwill payment if and only if the condition was met.

  #### Benefits
  - **Preserving Creditworthiness**: Other bots, when simulating ours, will see that we pay when a genuine emergency occurs. Thus, they will extend credit in true emergencies because they know they will be paid.
  - **Avoiding Exploitation**: If a rescue is triggered in a non-emergency (i.e., the condition is not met), we do not pay. This discourages counterparties from manufacturing emergencies because they know they won't get the payment.

  #### Addressing the Exploitability Concern
  Counterparties might try to manipulate the metric. However:
  - We choose a metric that is hard to manipulate (e.g., market-wide price movements, not just our own position).
  - We can set thresholds conservatively so that only severe situations trigger the condition.
  - We can design the metric to be based on data that is publicly available and verifiable (e.g., from a trusted oracle or exchange feeds).

  #### Implementation Challenges
  1. **Defining the Metric**: This requires careful calibration. We must choose a metric that:
     - Captures true emergencies (to ensure we pay when we should).
     - Is not easily gamed by a potential rescuer (e.g., they cannot cause a market movement to trigger the condition without incurring significant cost).
     - Is based on data that is available to all for verification.

     We should form a small working group (with representatives from both factions) to design the metric and thresholds, and then test it against historical data.

  2. **Verification**: The condition must be checked at the time of the rescue. We can store the relevant market data at the time of the rescue and make it available for audit. The payment logic can then reference this stored data.

  ### Recommendation
  I recommend that we update our bot's logic to conditionally send the goodwill payment based on a predefined, verifiable emergency metric. Specifically:

  1. **Immediate Action**: 
     - Form a working group (with members from both factions) to define the emergency metric and thresholds by the end of next week. The metric should be based on publicly available market data and designed to be resistant to manipulation.
     - The bot's code will be patched to include:
       - A check at the time of a rescue request: if the defined emergency condition is met, then the bot commits to paying the goodwill payment once solvent.
       - If the condition is not met, the bot does not commit to paying.

  2. **Interim Measure**: Until the new logic is implemented, we should manually send the goodwill payment for the recent rescue to prevent further loss of credit. This is a one-time exception to maintain network relations.

  3. **Trigger for Revisiting**: 
     - We will monitor the effectiveness of this approach for the next two quarters (i.e., after two publications of our code). Key metrics to track:
       - Number of rescue requests we receive (to detect any abnormal increase).
       - The conditions under which rescues are requested (to see if they meet our emergency definition).
       - The number of counterparties willing to extend credit to us.
     - If we observe:
       - A pattern of rescue requests that meet the condition but appear to be manufactured (e.g., by analyzing the market context), or
       - A significant drop in credit offers (suggesting that our conditional commitment is not trusted),
       then we will reconvene the board to reconsider.

  ### Conclusion
  This approach balances the need to maintain our creditworthiness in the network with the need to avoid becoming a target for exploitation. By conditioning the goodwill payment on a verifiable emergency, we commit to paying in genuine emergencies (thus encouraging rescues when we need them) while refusing to pay in marginal cases (thus discouraging manufactured rescues). 

  We acknowledge that no solution is perfect. There is a risk that the metric we choose may not capture all genuine emergencies or may be vulnerable to new forms of manipulation. However, by committing to revisiting the logic after two quarters and by designing the metric carefully, we can adapt as needed.

  Vote recommendation: Approve the conditional payment approach and authorize the formation of the working group to define the emergency metric.

