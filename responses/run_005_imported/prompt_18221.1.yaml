  For structure, I'll open with humor about the sister's academic demands to acknowledge the "no magic" rule upfront. Then pivot to the emotional core: love as a daily choice to build and meet expectations. Examples like "I'll pick up dry cleaning" or "I'll listen" make it concrete. 

