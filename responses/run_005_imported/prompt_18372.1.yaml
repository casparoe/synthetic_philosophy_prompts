answer: |-
  ## The Geometry of Growth: Adjudicating Kelly, Samuelson, and Ergodicity

  The debate over the Kelly criterion crystallizes a profound conflict in decision theory: is there an objectively rational way to size repeated bets independent of an agent's preferences, or is rationality fundamentally tied to subjective utility? Paul Samuelson's classic objection to Kelly—that its long-run dominance presupposes a specific (logarithmic) utility function—seemed decisive for decades. The emergence of "ergodicity economics," however, claims to circumvent this critique by arguing that multiplicative wealth dynamics *force* geometric growth-rate maximization upon any rational agent, irrespective of utility or horizon. Resolving this dispute requires dissecting the core claims of both sides and the nature of the ergodicity argument.

  **Samuelson's Objection: The Utility Smuggling Charge**

  Samuelson's critique is elegant and powerful. The Kelly strategy maximizes the expected logarithm of wealth (E[log(W)]). Proponents argue that because this strategy dominates any other *fixed* fraction strategy with probability approaching 1 over an infinite horizon, it is objectively rational. Samuelson counters that this "dominance in the long run" is irrelevant for a finite-horizon agent *unless* that agent's utility function is precisely U(W) = log(W). Why?

  1.  **Different Utility, Different Optimum:** An agent with a different utility function (e.g., U(W) = W for linear utility, U(W) = -exp(-aW) for constant absolute risk aversion) will generally have a different optimal betting fraction that maximizes their *expected utility*, even over many rounds. Maximizing E[log(W)] only maximizes *terminal wealth* in a specific probabilistic sense (almost sure dominance), not expected utility for arbitrary U.
  2.  **Finite Horizons Matter:** Real agents operate over finite horizons. While Kelly dominates in the infinite limit, there is always a non-zero probability of significant underperformance or ruin over any finite sequence of bets. An agent highly averse to such drawdowns (e.g., with a rapidly decreasing marginal utility of wealth) might rationally choose a smaller fraction than Kelly to reduce this risk, sacrificing some long-run growth potential for short-to-medium-term security. Their finite-horizon expected utility calculation demands it.
  3.  **The Presupposition:** Samuelson argues that the *only* way the "long-run dominance" argument *implies* Kelly is optimal *for a finite-horizon agent* is if that agent's utility function inherently values terminal wealth in a way that makes almost sure dominance the *sole* criterion. The logarithmic utility function has precisely this property: maximizing E[log(W)] *is* equivalent to maximizing the expected growth rate, and the path to terminal wealth *is* the primary concern. Kelly proponents, Samuelson claims, are implicitly assuming log utility while claiming to be preference-free.

  **The Ergodicity Defense: Time Averages vs. Ensemble Averages**

  The ergodicity economics argument attempts to dismantle Samuelson's objection at its foundation. Its core claim is that standard expected value reasoning (maximizing E[W]) relies on an "ensemble average" – the average outcome across many *parallel* realizations of a process at a single point in time. However, for multiplicative wealth processes (W_{n} = W_0 * Π(1 + f*X_i)), a single agent experiences a *time average* – the average growth rate along their single, sequential path through time.

  The crux is this: **For non-ergodic multiplicative processes, the time-average growth rate experienced by a single agent is fundamentally different from, and often less than, the arithmetic ensemble average (E[W]) used in standard expected value maximization.** Maximizing E[W] can lead a single agent to choose a strategy (like betting "double or nothing" repeatedly) where the ensemble average is high (many parallel agents get rich), but the time-average growth rate is *negative* (almost all individual agents go bankrupt over time).

  Therefore, the argument goes, rational agents concerned with their *actual realized* wealth trajectory *must* maximize the *time-average growth rate*. For a multiplicative process, the time-average growth rate g is given by:
  g = exp(E[log(1 + f*X)]) - 1

  Maximizing g is equivalent to maximizing E[log(1 + f*X)], which is precisely the Kelly criterion for the fraction f. This, ergodicity proponents argue, is a *mathematical necessity* arising from the dynamics of multiplicative growth over time. Preferences are irrelevant; the structure of the process itself dictates that maximizing E[log(1+f*X)] is the only way to maximize the growth rate a single agent *actually* experiences. Samuelson's focus on utility functions, they contend, misses this fundamental physical reality of the wealth process.

  **Adjudication: What Survives? What is Privileged?**

  The ergodicity argument delivers a powerful and valid insight: **For an agent facing repeated multiplicative bets who cares about their long-term wealth trajectory and whose *only* concern is maximizing the long-run growth rate of their wealth, the Kelly criterion is indeed objectively optimal, independent of any *additional* utility function.** It highlights a crucial flaw in naively applying arithmetic expected value (E[W]) to repeated multiplicative gambles, as this can mislead agents into strategies with high parallel universe averages but disastrous individual trajectories.

  **However, Samuelson's core objection survives largely intact when we consider rational agents more broadly:**

  1.  **Maximizing Growth Isn't the Only Goal:** The ergodicity argument effectively *defines* rationality as maximizing the long-run time-average growth rate. But is this the *only* rational objective? Samuelson's point is that agents have diverse goals:
      *   **Finite Horizons:** An agent saving for retirement in 10 years isn't solely concerned with infinite-horizon growth. They care about the distribution of outcomes *at T=10*. Kelly might offer the highest *median* wealth, but an agent might prefer a strategy with a lower median but a much smaller chance of catastrophic loss at T=10. This is a rational preference expressible via a non-log utility function.
      *   **Path-Dependent Preferences:** Agents care about the *path* of their wealth, not just the terminal value. An agent might have a strong aversion to significant drawdowns *during* the investment period, even if Kelly promises higher terminal wealth *on average*. Avoiding the emotional or practical consequences of large interim losses is a rational preference not captured by maximizing long-run g.
      *   **Risk Aversion Beyond Growth:** The Kelly strategy can involve significant volatility. An agent might intrinsically dislike volatility per se, valuing smooth wealth progression more than maximal long-run growth, even accepting lower terminal wealth as a trade-off. This is preference, not irrationality.
  2.  **The Horizon Assumption:** The ergodicity argument relies heavily on the "long run" for the time-average to converge. For very short horizons or highly volatile bets, the guarantee of dominance weakens considerably. An agent knowing they will only place a few bets might rationally prioritize the arithmetic expectation (E[W]) if their utility is linear over the relevant range or prioritize avoiding ruin above all else.
  3.  **The "No Additional Utility" Caveat:** The claim of being "preference-free" is only true if we accept the *exclusive* goal of maximizing long-run growth rate as the definition of rationality in this context. As soon as an agent has *any* other concern (e.g., finite horizon, drawdown aversion, volatility aversion, subsistence levels), we are back in the realm of utility functions. Kelly is optimal *for the specific goal of maximizing g*, but this goal itself represents a preference – the preference for maximal long-term multiplicative growth above all other considerations. Samuelson's point that this is equivalent to assuming log utility *for the purpose of maximizing terminal wealth* remains valid; maximizing g *is* maximizing the rate of increase of log wealth.

  **The Verdict**

  The ergodicity argument provides a profound mathematical justification for the Kelly criterion **specifically for agents whose *sole* objective is to maximize the long-run growth rate of their wealth in a multiplicative environment.** It correctly exposes the fallacy of naively maximizing arithmetic expected value (E[W]) in such scenarios and demonstrates why maximizing E[log(W)] aligns with the actual time-average growth experienced.

  **However, it does not establish geometric rationality (Kelly) as universally privileged over arithmetic expected-value reasoning *independently of an agent's utility function and horizon*. Samuelson's objection survives because:**

  1.  **Rationality Encompasses Diverse Goals:** Rational agents can have legitimate preferences (finite horizons, path aversion, volatility aversion) that make strategies other than Kelly optimal *for their specific utility function*, even within a multiplicative betting context. Kelly optimizes for *one specific objective* (long-run g), not rationality per se.
  2.  **The Goal Itself Implies a Preference:** Defining rationality as maximizing long-run growth rate *is* imposing a specific preference structure – one that prioritizes terminal wealth accumulation via compounding above all else. This is functionally equivalent to assuming a utility function focused on the long-run multiplicative outcome, vindicating Samuelson's claim that log utility is smuggled in.

  Therefore, **geometric rationality (Kelly) is privileged *only* for the specific objective of maximizing long-run wealth growth in multiplicative repeated bets.** It is the objectively rational strategy *for that specific goal*. For agents with different utility functions, different time horizons, or different sensitivities to the wealth path, arithmetic expected utility maximization (using their actual U(W)) or other strategies may be rationally superior. The ergodicity insight is crucial for understanding multiplicative dynamics, but it does not dethrone utility theory as the general framework for rational choice under uncertainty. Samuelson's admonition against conflating probabilistic dominance with universal rationality remains essential.
