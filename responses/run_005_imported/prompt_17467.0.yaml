prompt: |-
  I don't work in ethics myself (philosophy of language is more my thing), so I've been chewing on this without really having the tools to sort it out, and it's been bugging me since a faculty meeting last week. We have a colleague — call her Meera, not her real name — who for years has done a ton of stuff for our job-market students that was never part of anyone's actual job: mock interviews on weekends, marathon calls about cover letters, checking in individually with every student every week each fall. None of it was ever asked of her, and nobody else does anything close to it. The problem is it's quietly become the expectation. Our newest hire, who just does the ordinary required advising and nothing more, is getting side-eyed by students and even a little by the chair, like he's shirking something, even though there's nothing beyond standard advising in his contract or anyone else's. Meanwhile Meera is completely burnt out and would love to scale back, but feels like she can't without everyone concluding she's stopped caring.

  Something about this feels philosophically off in a way I can't quite pin down. The whole point of doing more than duty strictly requires is supposed to be that no one else is on the hook for not doing it themselves — thats what's supposed to make it praiseworthy rather than merely expected. But here, doing it seems to have generated a new hook for everybody, including, weirdly, future-Meera. When I brought this up, a friend in ethics just said "yeah, that's basically why people fight over whether moral saints are even a coherent ideal to hold up," which didn't fully clarify things for me. Could you actually walk me through what's going on here in careful terms — is this a recognized problem, does it suggest that the whole category of act I'm gesturing at is less stable than it looks, and is there a principled way for Meera to pull back that doesn't just amount to "stop being so nice"? And please don't just tell me "people have different role-obligations" — that's true but it's clearly not what's actually bothering me about the case.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a philosophy of language scholar who's stumbled into an ethics dilemma in their department. The core issue revolves around Meera, a colleague whose voluntary supererogatory actions have morphed into implicit obligations, creating unfair expectations for others and trapping her in unsustainable practices. 

  The user's frustration is palpable—they sense something philosophically unstable about how goodness can become coercive, but lack the ethics vocabulary to articulate it. Their rejection of simplistic "role-obligations" explanations shows they've already identified the deeper tension: the paradox where moral excellence seems to undermine its own supererogatory status. 

  Hmm, I recall Judith Lichtenberg's work on moral sedimentation—how repeated voluntary acts harden into perceived duties. That seems directly applicable here. Meera's weekend mock interviews and marathon cover-letter sessions were initially "gifts," but through repetition, they've become institutional expectations. The newer colleague now faces normative pressure despite contractual absence of such duties. 

  The user's ethical friend mentioned debates about moral saints, which points to Susan Wolf's critique. But I should connect that to the institutional dynamics—this isn't just about individual virtue but about how communities metabolize generosity. The chair's side-eye reveals how easily admiration becomes entitlement. 

  For solutions, mere "scale back" advice would fail. Meera needs a justice-based exit strategy: shifting focus to structural changes (like formalizing support systems) rather than personal sacrifice. That maintains her care-ethos while dismantling the toxic expectation cycle. 

  Also noting the user's meta-concern: they're probing whether supererogation itself is fragile when practiced in social ecosystems. That deserves a clear "yes—but here's why it shouldn't collapse the category," perhaps using the gift-giving analogy. 

  Key threads to weave: sedimentation effect, supererogation-backfire, institutional vs individual responsibility, and exit strategies that preserve moral integrity. Must avoid jargon though—user prefers careful terms over technical ones.
answer: |-
  You've put your finger on a profound and recognized problem in ethics, often discussed under concepts like **moral licensing, shifting baselines, the problem of moral saints, and the "supererogation trap."** Your philosophical discomfort is spot-on: the very mechanism that makes supererogatory acts (those "beyond duty") praiseworthy *can* undermine their supererogatory status, creating injustice and trapping the moral agent. Let's break this down carefully.

  ### 1. The Core Problem: The "Sedimentation" of Supererogation
  *   **The Initial State:** Meera performs acts that are clearly *supererogatory* – morally good, praiseworthy, but *not required* of her (or anyone else). Her motivation might be compassion, dedication, or a personal standard of care exceeding institutional norms. At this stage, her actions highlight the *gap* between minimal duty and moral excellence.
  *   **The Shift:** Through repetition, visibility, and reliance, these acts undergo a process philosopher Judith Lichtenberg calls **"moral sedimentation."** What was once "extra" slowly settles into the perceived normative landscape. The baseline of "what a committed advisor *does*" subtly rises. Meera's *generosity* becomes the *new normal*.
  *   **The New Norm:** This creates a double-bind:
      *   **For Others (e.g., the New Hire):** The *perceived* duty expands. While their *contractual* duty remains "standard advising," the *social/moral expectation* (enforced by side-eye, chair pressure, student disappointment) now includes elements of Meera's former supererogation. They are now unfairly judged against an unstated, inflated standard they never agreed to. This is **punishing someone for merely meeting their actual obligations.**
      *   **For Meera:** Her *own* supererogatory acts become a *baseline expectation for her future self*. Scaling back isn't seen as returning to a reasonable standard; it's perceived as *falling short*, as "caring less." Her past virtue becomes a cage. Her *praiseworthiness* morphs into an *obligation*. This is the **supererogation trap**: the virtuous agent is penalized for no longer exceeding unsustainable, self-imposed standards.

  ### 2. Why This Feels "Philosophically Off": Undermining Supererogation
  Your instinct is correct: this dynamic attacks the core logic of supererogation.
  *   **The Erosion of the "Extra":** Supererogation requires a clear distinction between the *required* and the *optional-but-good*. The sedimentation process blurs this line. What was "extra" becomes absorbed into the perceived "required."
  *   **The Loss of Genuine Praise:** Praise for supererogation relies on the agent *freely* choosing the good beyond necessity. When Meera's acts become expected *of her*, praise turns into mere acknowledgment of meeting (inflated) expectations, or worse, relief that she hasn't "slacked off." The *voluntary* nature is lost.
  *   **The Injustice:** It creates unfair burdens:
      *   On the new hire, judged against an unattainable (and unnecessary) standard they didn't set.
      *   On Meera, who is denied the freedom to adjust her level of commitment without moral censure.
      *   On the *institution*, which benefits from unsustainable free labor while avoiding responsibility to systematize support.
  *   **The "Moral Saint" Problem:** Your ethics friend is referencing critiques (like Susan Wolf's "Moral Saints") arguing that holding up "moral saints" as ideals can be destructive or incoherent. Why? Precisely because it can lead to this trap: inflating expectations to impossible levels, devaluing ordinary virtue, and creating resentment or burnout. The ideal becomes self-defeating.

  ### 3. Is Supererogation Itself Unstable?
  This case doesn't *destroy* the category of supererogation, but it reveals its **contextual fragility** in social systems:
  *   **Vulnerability to Social Dynamics:** Supererogation relies on a *stable, shared understanding* of baseline duties. Social perception, repetition, and reliance can destabilize this understanding.
  *   **The "Free Rider" Problem in Reverse:** Usually, free riders benefit from others' duty-fulfillment. Here, the *supererogator* inadvertently creates a situation where others can be seen as "free riding" *on her supererogation* (by only doing their actual duty), or she becomes a "forced rider" on her own past generosity.
  *   **It's Stable in Principle, Fragile in Practice:** The *concept* remains coherent: acts beyond duty are praiseworthy *precisely because* others aren't blameworthy for not doing them. The *practice* is fragile because human psychology and social dynamics constantly pressure to normalize exceptional effort, especially when it benefits the group.

  ### 4. A Principled Exit Strategy for Meera (Beyond "Stop Being Nice")
  Meera needs a strategy that addresses the *structural* shift she (inadvertently) caused, framed in terms of justice and sustainability, not diminished care. Here's a principled approach:

  1.  **Name the Shift Explicitly (Using Justice Language):** Meera should initiate a conversation with the Chair (and perhaps the department) focused on *fairness* and *institutional responsibility*, not her burnout.
      *   *"I've realized that some of the support I've provided over the years, while driven by my desire to help, has unintentionally created an expectation that this level of individual, intensive labor is now standard. This puts unfair pressure on colleagues whose contracts and workloads reflect the actual departmental standard, and it's unsustainable for anyone, including me, to maintain indefinitely without formal recognition and support. I worry it also obscures the department's responsibility to ensure equitable, sustainable support structures for all students."*
      *   **Key:** Frame it as an *institutional* issue of fairness and defined responsibilities, not a personal failing or change of heart.

  2.  **Decouple Her "Scaling Back" from "Caring Less":**
      *   **Shift the Focus to Structure:** Propose concrete, *shared*, *sustainable* alternatives that distribute the load or make it more efficient. Examples:
          *   "Could we formalize a rotating schedule for *optional* mock interviews, so it's a shared department effort, not an individual marathon?"
          *   "Would it be possible to develop a small budget for an external career coach for intensive cover letter/resume workshops, reducing the need for individual faculty marathons?"
          *   "Could we create a peer-support group for job-market students, facilitated occasionally by faculty, rather than relying solely on weekly individual check-ins?"
      *   **Offer a "New Normal" Definition:** Clearly state what she *will* continue to do (the actual standard duties plus maybe *one* clearly defined, manageable extra thing) and frame the reduction as aligning with a *healthy, equitable departmental norm*. *"Moving forward, I'll be focusing my advising on [list standard duties] and [one specific, sustainable extra, e.g., organizing one group workshop per semester]. I believe this is a more equitable and sustainable model for all of us and ensures students receive consistent core support from the department."*

  3.  **Invoke Collective Responsibility:** Emphasize that student support is a *departmental* mission. *"Ensuring our students are well-supported on the job market is crucial. Let's work together to build a system that reliably provides core support without relying on unsustainable individual heroics."* This shifts the focus from *her* output to *their* shared structure.

  4.  **Manage Student Expectations Proactively & Transparently:** Meera should communicate the change *to students* clearly and early, again framing it as a positive structural shift, not personal withdrawal.
      *   *"To ensure all students receive consistent support and to make this process more sustainable for everyone, the department is refining how we approach job market advising next year. I'll still be available for [standard advising], and we're also setting up [new shared resource, e.g., peer group, scheduled mock interview slots]. I'm excited this means more students will benefit from structured support!"*

  ### Why This is Principled, Not Just "Less Nice"
  *   **Justice-Based:** It addresses the unfairness to colleagues and the unsustainable burden on herself.
  *   **Responsibility-Shifting:** It moves the focus from individual supererogation to institutional duty and shared responsibility.
  *   **Sustainability Focused:** It prioritizes long-term well-being over short-term (but exhausting) individual effort.
  *   **Clarity-Restoring:** It actively works to re-establish a clear, shared understanding of baseline duties versus optional extras.
  *   **Preserves Care (Differently):** Meera advocates for a *better system* of care, demonstrating care for students, colleagues, *and* herself through structural solutions.

  **In essence:** Meera needs to perform a final supererogatory act – the difficult work of *dismantling the unsustainable expectation structure her past supererogation created* – to restore justice, clarity, and a sustainable future for everyone. This requires courage and framing the issue not as her personal limitation, but as a necessary correction to an unjust and unstable normative shift. The philosophical "offness" stems from the violation of the core principle that supererogation should remain praiseworthy *because* it is free and beyond duty, not a source of new obligations for others or a cage for the supererogator.
