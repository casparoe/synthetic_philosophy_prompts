prompt: |-
  I convene a small monthly colloquium on formal epistemology and rational agency, and next month's guest is a decision theorist whose recent work defends "surrogate goals" as a hedge against acausal threats: roughly, the idea that because a sufficiently capable reasoner can be threatened by an extortionist with whom it shares no causal contact at all -- provided the extortionist can predict or correlate with it closely enough for the threat to bind -- the reasoner is best served by cultivating in advance a visible, dispositionally firm attachment to some cheap substitute value, so that any rational threat-maker will aim at the decoy rather than at what the reasoner actually cares about. I've been turning the proposal over since a graduate student presented it in my reading group last term, and the more I read the more it strikes me as either a genuinely clever patch for agents that cannot fully self-modify, or an acausal dress-up of ordinary reputational bargaining, and I still can't decide which. In print, the guest tends to meet most objections with some version of "that only shows we need a better-designed surrogate, not that the strategy itself is unsound," and I'd like the questions to make that move progressively harder to reach for.

  I'm moderating the Q&A and would like your help drafting eight to ten questions that go beyond having him restate the proposal. At minimum I want one question on the credibility problem: if it is common knowledge that the target adopted a decoy precisely because it is cheap to sacrifice, why wouldn't a sophisticated extortionist simply threaten the real goal, or both at once? One on the regress this seems to invite, since a surrogate that is itself known to be a surrogate needs some further guarantee of its own credibility, and it is unclear where that chain is supposed to bottom out. One on how the whole proposal relates to the updateless ideal of simply being the sort of agent against whom threats never pay to be issued in the first place -- is the surrogate goal a stopgap for agents that cannot achieve that disposition outright, or is it in tension with it? And one on whether stipulating a goal purely for its deterrent value, all the while knowing it to be a stand-in, is psychologically or rationally coherent, rather than an elaborate exercise in self-deception. For each of these, please add a brief follow-up keyed to the answer he is most likely to give: on the credibility question, for instance, I expect him to retreat to saying that the surrogate only needs to be indistinguishable from a real goal from the threatener's epistemic position, and I would like the follow-up to press on how much that concedes.
reasoning: |-
  We are drafting 8-10 questions for a Q&A session with a decision theorist who defends "surrogate goals" as a hedge against acausal threats. The user has specified four minimum questions and wants follow-ups for each. We'll design the questions to challenge the guest's typical response of "we need a better-designed surrogate".

  Let's outline the required questions and then add more to reach 8-10:

  1. **Credibility Problem**: If it's common knowledge that the surrogate is adopted because it's cheap to sacrifice, why wouldn't a sophisticated extortionist threaten the real goal or both?
     - Follow-up: If the answer is that the surrogate must be indistinguishable from a real goal from the threatener's perspective, then press on how much this concedes (e.g., does this imply that the surrogate must be so convincing that even the agent itself is fooled? Or that the agent must have a kind of self-deception?).

  2. **Regress Problem**: The surrogate, being known as a surrogate, needs its own credibility guarantee. Where does this chain bottom out?
     - Follow-up: If the answer is that we can have a hierarchy of surrogates or that the bottom is a goal that is not a surrogate, then ask how we avoid infinite regress and what kind of goal is immune to being seen as a surrogate.

  3. **Relation to Updatelessness**: How does the surrogate goal relate to the updateless ideal of being an agent against whom threats never pay? Is it a stopgap for agents that cannot achieve that disposition, or is it in tension?
     - Follow-up: If the answer is that it is a stopgap, then ask why not focus on achieving updatelessness directly? If the answer is that it is not in tension, then ask how having a surrogate goal doesn't undermine the commitment to the real goal in the updateless framework.

  4. **Psychological/Rational Coherence**: Is stipulating a goal purely for deterrent value, while knowing it's a stand-in, coherent? Or is it self-deception?
     - Follow-up: If the answer is that the agent doesn't need to fully believe in the surrogate goal, then ask how the agent can act as if it cares about the surrogate without undermining the rational coherence of its actions.

  Now, let's add at least four more questions to make 8-10:

  5. **Effectiveness against multiple threat types**: How does the surrogate goal strategy handle different kinds of acausal threats? For example, an extortionist that uses a different predictor or one that can observe the agent's internal state? 

  6. **Cost of maintaining the surrogate**: What are the ongoing costs of maintaining the surrogate goal? Could these costs (e.g., in terms of cognitive load or suboptimal decisions) outweigh the benefits?

  7. **Dependence on predictability**: The strategy seems to require that the threat-maker can predict the agent's behavior. What if the threat-maker is less predictable or uses a different model? How robust is the surrogate approach to variations in the predictor's capabilities?

  8. **Comparison with other strategies**: How does the surrogate goal approach compare to other known defenses against acausal threats, such as precommitment devices, cryptographic solutions, or self-modification to become updateless? Under what conditions is the surrogate goal preferable?

  9. **Empirical evidence or simulations**: Are there any simulations or thought experiments that demonstrate the effectiveness of surrogate goals in a concrete way? If not, how can we be confident in the strategy?

  10. **Scope of application**: For which types of agents is this strategy intended? (e.g., humans, AIs, collective agents) How does the strategy scale with the complexity of the agent and the environment?

  We'll now draft the four required questions with follow-ups and then the additional six.

  **Question 1: Credibility Problem**
     - Main: "Given that it's common knowledge that the surrogate goal is adopted precisely because it is cheap to sacrifice, why wouldn't a sophisticated extortionist simply bypass the surrogate and threaten the real goal, or threaten both at once to maximize leverage?"
     - Expected answer: The surrogate only needs to be indistinguishable from a real goal from the threatener's epistemic position.
     - Follow-up: "If the surrogate must be indistinguishable from a real goal to the threatener, doesn't that require the agent to effectively deceive itself? Because if the agent knows it's a decoy, then any evidence the threatener has about the agent's true state (which might be substantial in acausal settings) could reveal the deception. How do you maintain the indistinguishability without the agent losing track of what is real and what is surrogate?"

  **Question 2: Regress Problem**
     - Main: "The surrogate goal is itself a commitment that must be credible. But if it is known to be a surrogate, then it seems to require a further surrogate (or some other mechanism) to make it credible, leading to a regress. Where and how does this regress bottom out?"
     - Expected answer: Perhaps by having a hierarchy of surrogates or by having a base goal that is not a surrogate (e.g., one that is intrinsically valued and not adopted for strategic reasons).
     - Follow-up: "If the regress bottoms out in a non-surrogate goal, then isn't that base goal vulnerable to the same kind of threat? And if we use a hierarchy of surrogates, how do we avoid an infinite chain? Moreover, doesn't each level of surrogate dilute the agent's commitment to the real goal?"

  **Question 3: Relation to Updatelessness**
     - Main: "How does the surrogate goal strategy relate to the updateless decision theory ideal, where an agent is designed so that threats against it are never profitable? Is the surrogate goal a stopgap for agents that cannot fully self-modify to become updateless, or is it in tension with that ideal?"
     - Expected answer: It might be presented as a stopgap for agents that cannot achieve full updatelessness.
     - Follow-up: "If it's a stopgap, why not invest in achieving updatelessness directly? And if the agent can self-modify to adopt a surrogate goal, why can't it self-modify to become updateless? Alternatively, if the surrogate goal is in tension with updatelessness, how do you reconcile the two?"

  **Question 4: Psychological/Rational Coherence**
     - Main: "Is it psychologically and rationally coherent for an agent to stipulate a goal purely for its deterrent value, all the while knowing that it is a stand-in? Doesn't this require a form of self-deception that might be unstable or irrational?"
     - Expected answer: The agent doesn't need to fully believe in the surrogate goal; it just needs to act as if it does.
     - Follow-up: "If the agent is acting as if it cares about the surrogate without actually caring, then isn't that a case of intentional insincerity? How does the agent maintain this act in the face of acausal threats that might rely on perfect predictors? And doesn't this insincerity undermine the agent's ability to credibly commit to the surrogate?"

  **Additional Questions:**

  5. **Effectiveness against multiple threat types**: "How does the surrogate goal strategy handle variations in the type of acausal threat? For instance, if an extortionist uses a predictor that has access to the agent's internal state, wouldn't it see through the surrogate? And what about threats that come from multiple correlated sources simultaneously?"

  6. **Cost of maintaining the surrogate**: "What are the ongoing costs of maintaining a surrogate goal? Could the cognitive burden of managing the surrogate and the potential for making suboptimal decisions (because of the surrogate) outweigh the benefits of protection against acausal threats?"

  7. **Dependence on predictability**: "The strategy seems to rely on the threat-maker being able to predict the agent's behavior. What if the threat-maker uses a different model of the agent or is less capable of prediction? How robust is the surrogate approach to variations in the predictor's accuracy and methods?"

  8. **Comparison with other strategies**: "How does the surrogate goal approach compare to other known defenses against acausal threats, such as precommitment devices, cryptographic solutions, or self-modification to become updateless? In what scenarios would you recommend surrogate goals over these alternatives?"

  9. **Empirical evidence or simulations**: "Are there any simulations, formal models, or thought experiments that demonstrate the effectiveness of surrogate goals in a concrete way? If not, what kind of evidence would you accept as validating or invalidating the strategy?"

  10. **Scope of application**: "For which types of agents is the surrogate goal strategy most suitable? For example, is it feasible for humans, or only for artificial agents? And how does the strategy scale with the complexity of the agent and the environment, especially in multi-agent settings?"

  We have 10 questions in total. The first four are as requested with follow-ups, and the next six are additional without specified follow-ups (but the moderator can ask follow-ups based on the answers). Let me know if you want any adjustments.
answer: |-
  Below are ten questions designed to probe the "surrogate goals" proposal, with a focus on making the "better-designed surrogate" rebuttal progressively harder to reach for. Each includes a concise follow-up tailored to anticipated responses. The questions are sequenced to escalate pressure on core vulnerabilities: credibility, regress, updatelessness alignment, and psychological coherence, followed by extensions into feasibility, scope, and unintended consequences.

  ---

  ### **1. Credibility Problem**  
  **Question:** If the adoption of a surrogate goal is common knowledge—and thus known to be a cheap-to-sacrifice decoy—why wouldn’t a rational extortionist ignore the surrogate and threaten the agent’s *true* goal instead, or demand concessions on both goals to maximize leverage?  
  *Anticipated Response*: "The surrogate only needs to be *indistinguishable* from a real goal from the threatener’s epistemic position, making it costly for them to test its authenticity."  
  **Follow-up**: Doesn’t this concede that the agent’s *entire* security depends on the threatener’s imperfect information? If so, how is this strategy robust against threateners with privileged access (e.g., via superintelligent prediction or acausal correlation), and doesn’t this reduce surrogate goals to a high-stakes game of informational asymmetry—one the agent is likely to lose against superior predictors?  

  ---

  ### **2. Regress Problem**  
  **Question**: Surrogate goals derive credibility from the agent’s perceived commitment, but if the surrogate is itself recognized as a strategic facade, it requires a *further* meta-surrogate to vouch for its sincerity. How does this regress terminate without either infinite recursion or collapsing into a non-strategic, "real" goal?  
  *Anticipated Response*: "The chain bottoms out in a goal whose commitment is *visibly costly* to fake, making it functionally real for threat-assessment purposes."  
  **Follow-up**: If the terminal goal must be "functionally real," doesn’t this imply that agents can only defend against threats by having *some* intrinsically valued goal exposed (defeating the purpose of the surrogate)? And wouldn’t a sophisticated threatener simply target this terminal goal?  

  ---

  ### **3. Updatelessness Alignment**  
  **Question**: Updateless decision theory (UDT) aims to make threats *irrelevant* by committing ex ante to counterfactuals where extortion never pays. Is the surrogate goal a pragmatic approximation for agents that cannot achieve full UDT alignment, or does it actively undermine UDT by redirecting threats rather than eliminating their incentive?  
  *Anticipated Response*: "Surrogates *are* a tool for UDT-like commitment—they pre-empt threats by making them unprofitable, just as UDT does."  
  **Follow-up**: But UDT achieves this by optimizing across all possible worlds, while surrogates rely on *deception* (hiding the true goal). Doesn’t this deception introduce a vulnerability: if the ruse fails, the agent is *more* exposed than a pure UDT agent, and if it succeeds, the agent wastes resources on a decoy instead of hardening its core preferences?  

  ---

  ### **4. Psychological/Rational Coherence**  
  **Question**: Can an agent coherently cultivate a "dispositional commitment" to a goal it *knows* is a decoy? If the agent acts *as if* it values the surrogate while internally viewing it as instrumental, isn’t this a form of structured self-deception that risks cognitive dissonance or motivational collapse under stress?  
  *Anticipated Response*: "Rationality doesn’t require literal belief—it requires consistent choice dispositions. The agent can instrumentally sustain the surrogate while transparently recognizing its purpose."  
  **Follow-up**: Doesn’t this create a reflexive problem? If the agent transparently knows the surrogate is "fake," its actions become *conditionally* consistent (e.g., abandoning the surrogate if threats vanish). How can such conditional rigidity be perceived as credible by a threatener who knows the agent’s beliefs?  

  ---

  ### **5. Feasibility of Indistinguishability**  
  **Question**: You argue surrogates must be "indistinguishable from real goals," but what architecture supports this? Real goals produce traceable behavioral and neurocognitive signatures (e.g., reinforcement learning, emotional responses). How can an agent simulate these for a surrogate without either (a) massive overhead or (b) accidentally making the surrogate a *real* value via habit-formation?  
  *Anticipated Response*: "Advanced agents could compartmentalize or use partial self-modification to emulate authenticity at low cost."  
  **Follow-up**: If compartmentalization is sufficient, why wouldn’t threateners use this very fact to identify surrogates (e.g., via telltale inconsistencies in goal-pursuit)? And if self-modification *does* make the surrogate "real," doesn’t that defeat the point of it being "cheap to sacrifice"?  

  ---

  ### **6. Threat-Scope Scalability**  
  **Question**: Surrogates might deter threats targeting *one* decoy, but what prevents an extortionist from threatening *multiple* goals simultaneously (e.g., "Do X or I harm both your surrogate S and true goal G")? How does the agent avoid being forced to defend an ever-expanding array of surrogates?  
  *Anticipated Response*: "A well-designed surrogate is either maximally costly for the threatener to attack or bundled with the agent’s core viability."  
  **Follow-up**: Doesn’t this assume threateners have limited resources? Against a hyper-capable adversary (e.g., a superintelligence), wouldn’t proliferating threats be trivial, rendering single surrogates ineffective?  

  ---

  ### **7. Evolutionary Stability**  
  **Question**: In a population of agents using surrogates, wouldn’t there be selective pressure for threateners to "see through" the strategy or for agents to defect (e.g., by dropping surrogates to save costs)? How do surrogate goals remain effective in competitive multi-agent equilibria?  
  *Anticipated Response*: "Stability arises if surrogates are Nash equilibria where deviating (e.g., dropping the surrogate) invites unacceptably high risk."  
  **Follow-up**: But this assumes universal adoption. If a subset of agents defects (e.g., humans who can’t maintain surrogates), doesn’t that create exploitable niches, making threateners *more* likely to target agents *with* surrogates (testing their resolve) or those without (bypassing the strategy entirely)?  

  ---

  ### **8. Unintended Consequences**  
  **Question**: Could surrogate goals backfire? For example, by incentivizing threateners to "weaponize" the surrogate (e.g., "Do X or I’ll *force you to abandon S*, damaging your credibility") or by crowding out resources needed to protect the true goal?  
  *Anticipated Response*: "This is a design flaw—robust surrogates would make such threats prohibitively expensive."  
  **Follow-up**: Doesn’t this handwave the trade-off? If surrogates must be "robust" to all threat types, they cease to be "cheap" and become indistinguishable from core goals, reintroducing the original vulnerability.  

  ---

  ### **9. Causal vs. Acoustic Deterrence**  
  **Question**: How do surrogate goals improve upon causal deterrence (e.g., mutually assured destruction) in *acausal* settings? If the threatener is only correlated with the agent via prediction, why would they care about the agent’s *visible* disposition?  
  *Anticipated Response*: "Acoustic threats work *because* of predictability: a threatener who predicts the agent will defend S won’t attack G."  
  **Follow-up**: But this assumes the threatener *shares the agent’s model of rationality*. What if they use a different decision theory (e.g., EDT) or doubt the agent’s ability to commit? Isn’t this strategy highly sensitive to adversarial model uncertainty?  

  ---

  ### **10. Moral Hazard**  
  **Question**: By encouraging agents to adopt "disposable" goals, does this normalize threat-based extortion as an inescapable fixture of rationality—potentially crowding out investment in cooperative or threat-agnostic frameworks?  
  *Anticipated Response*: "This mischaracterizes surrogates: they *reduce* extortion by making it unprofitable, thus promoting stability."  
  **Follow-up**: But if every agent employs surrogates, doesn’t this *institutionalize* a low-trust equilibrium where threat-based interactions become the default? And wouldn’t agents optimized for this equilibrium be *less* capable of cooperation (e.g., due to overfitted commitments)?  

  ---

  ### **Key Rationale for Sequence**  
  - **Q1–Q4** directly target your specified minimum requirements, with follow-ups forcing concessions on predictability-dependence, terminal goals, UDT trade-offs, and belief/action misalignment.  
  - **Q5–Q7** escalate to feasibility and scalability, challenging the "better design" retreat by highlighting overhead, threat proliferation, and competitive instability.  
  - **Q8–Q10** broaden to systemic risks, exposing how the strategy might amplify threats or distort rational norms.  

  Each follow-up is engineered to preemptively undercut the guest’s typical rebuttals by anchoring objections in structural decision-theoretic constraints (e.g., information asymmetry, regress, and equilibrium dynamics) rather than implementation details. This forces engagement with the *in-principle* viability of the strategy.
