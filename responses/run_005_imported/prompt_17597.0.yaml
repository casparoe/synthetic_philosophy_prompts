  ## Memo: Consultative Session - Cause of Beatification of Sister Agnieszka Radomska

  **From:** Fr. Tomasz Nowak, J.C.D., Chair, Diocesan Historical Commission for the Cause of Sister Agnieszka Radomska  
  **To:** Members of the Diocesan Historical Commission  
  **Date:** [Date of the Eve of the Vote]  
  **Subject:** Urgent Deliberation Regarding New Evidence and the Heroic Virtue of Sister Agnieszka  

  Esteemed Consultors,

  Tomorrow we vote on whether to forward the *positio* for Sister Agnieszka Radomska to the Congregation for the Causes of Saints. This decision, always weighty, carries an unprecedented burden due to the wartime correspondence unearthed by Dr. Kowalska. This evidence compels us to confront a profound theological and moral challenge directly impacting the foundation of our cause: the *heroic virtue* of the Servant of God.

  For years, the narrative of Sister Agnieszka’s heroism rested securely on accounts of immense charity, courage under duress, and the sheltering of children at great personal risk. Her silence, evasions, and steadfast refusal to betray the innocent were pillars of her virtuous reputation. The newly discovered correspondence, however, reveals actions that go beyond silence or ambiguous truth. Sister Agnieszka actively fabricated falsehoods: inventing names, parentage, and even a non-existent quarantine. These were deliberate, premeditated falsehoods delivered, by all surviving testimony, with unwavering composure.

  **The Core Objection: Sin vs. Heroism**

  Consultors Majewski and Zielińska have articulated a grave and theologically rigorous objection that we cannot dismiss. They argue, compellingly, that these deliberate falsehoods constitute *lying* as defined and condemned by the Church’s unbroken magisterial tradition:

  1.  **Augustine:** "*Mendacium est enuntiatio cum voluntate falsum enuntiandi.*" (A lie is a false statement made with the intention to deceive.) He argued *absolutely* that lying is intrinsically evil, a violation of the order of creation rooted in truth, and never justified by consequences, however good (e.g., *De Mendacio*, *Contra Mendacium*).
  2.  **Aquinas (STh II-II, Q. 110):** Building on Augustine, Aquinas defines lying as speech contrary to the mind. He categorically states that every lie is a sin, arguing that it is contrary to the good of the intellect (truth) and contrary to charity, as it harms the social bond built on trust. While distinguishing the gravity of lies, he offers *no exception* where deliberate falsehood becomes morally permissible.
  3.  **Catechism of the Catholic Church (CCC 2483, 2485):** "A lie consists in speaking a falsehood with the intention of deceiving... Lying is the most direct offense against the truth. To lie is to speak or act against the truth in order to lead someone into error... By its very nature, lying is to be condemned. It is a profanation of speech, whereas the purpose of speech is to communicate known truth to others." This teaching admits no qualification based on intent or outcome.

  Consultors Majewski and Zielińska pose the essential question: **If Sister Agnieszka’s fabrications were objectively sinful acts according to this definitive tradition, how can these *very same acts* simultaneously constitute evidence of *heroic virtue*?** Heroic virtue, by definition, requires actions that are not only exceptionally good but also morally *excellent* and free from grave moral defect. To propose that sinful acts demonstrate heroic virtue appears, on its face, a contradiction in terms. They argue that incorporating these documented lies into the *positio* as examples of heroism risks misrepresenting both Sister Agnieszka’s actions and the Church’s moral teaching.

  **The Gravity of Their Position**

  We must acknowledge the strength and coherence of this position. It is not a mere procedural quibble or a lack of pastoral sensitivity. It appeals directly to the bedrock of Catholic moral theology concerning truth and falsehood. They are correct that centuries of authoritative teaching offer no obvious loophole for Sister Agnieszka’s specific actions. To ignore this objection, or to attempt to explain it away without rigorous theological engagement, would be intellectually dishonest and potentially damaging to the integrity of the cause and the Church's witness to truth. **There is a live and significant possibility that Consultors Majewski and Zielińska are correct: that the tradition they invoke is definitive, that Sister Agnieszka’s lies were objectively sinful, and that these sins cannot be transformed retroactively into heroic virtues, regardless of their noble purpose.**

  **The Countervailing Considerations**

  However, the situation demands we also consider the full context with utmost seriousness:

  1.  **The Nature of the Regime & Imminent Danger:** We are not dealing with minor bureaucratic evasion. This was an occupation characterized by terror, systematic murder (especially of children from targeted groups), and the utter destruction of moral order. Refusal to cooperate often meant immediate death; discovery meant death for the children. Sister Agnieszka acted under extreme duress, not for convenience, but to save innocent lives from almost certain execution.
  2.  **The Primacy of Charity:** Sister Agnieszka’s *intention* was not malice or self-interest, but the highest form of charity: laying down one’s life (spiritually, if not physically) for others (cf. John 15:13). Her entire life, as documented, was oriented towards radical self-giving love. Do these acts, born of desperate love in the face of absolute evil, truly carry the same moral weight as a lie told for personal gain or to harm?
  3.  **The Complexity of Truth-Telling in Tyranny:** Does telling factual truth to murderous agents intent on committing grave evil constitute cooperation with that evil? Does silence alone always suffice as a moral defense when lives hang in the balance? While the magisterium on lying remains absolute, the lived experience of persecution raises agonizing questions about the *application* of principles in a context where the aggressor has utterly perverted justice and truth.
  4.  **The Witness of Composure:** The reports consistently describe her delivery as calm and unwavering. This composure under extreme pressure, while delivering falsehoods, *is* remarkable. Is it evidence of heroic virtue *despite* the sinful nature of the act? Or does the sinful nature of the act negate any virtuous aspect of the composure? This is a key tension.

  **The Options Before Us**

  Given this impasse, we have three viable paths forward:

  1.  **Forward the Cause as Currently Framed:** Include the fabrications as examples of her courage and charity under persecution, arguing implicitly or explicitly that the extreme circumstances mitigate or transform the nature of the acts.  
      *   **Risk:** This directly contradicts the established magisterial teaching on lying cited by Consultors Majewski and Zielińska. It invites immediate and potentially fatal objection at the Congregation level on theological grounds, likely requiring us to retract or fundamentally rewrite later. It risks scandal by appearing to disregard Church doctrine. It fails to resolve the core theological conflict.
  2.  **Pause the Cause Pending Formal Theological Opinion:** Suspend the vote. Formally request a *votum theologicum* from experts (e.g., professors at a Pontifical University, consultors to the Congregation for the Doctrine of the Faith) specifically addressing this precise scenario: *Can deliberate falsehoods told under extreme duress to save innocent lives from certain death, by an individual otherwise demonstrably living heroic virtue, be considered compatible with the heroic virtue required for beatification in light of the Church's absolute prohibition on lying?*  
      *   **Rationale:** This acknowledges the gravity and complexity of the theological objection. It recognizes that we, as a historical commission, may lack the definitive theological competence to resolve this centuries-old tension authoritatively. It seeks clarity from the Church's highest theological authorities *before* potentially submitting a flawed *positio*. It demonstrates intellectual honesty and respect for the magisterium.
      *   **Challenge:** It causes significant delay. The answer may still be negative or inconclusive.
  3.  **Reframe the Cause Around a Narrower Account:** Remove or drastically minimize the emphasis on the *fabrications* within the *positio*. Focus solely on her heroic charity, courage, silence under questioning, organizational skill in hiding the children, and spiritual witness, drawing evidence only from witness testimony prior to the discovery of the correspondence. Treat the fabrications as a regrettable, isolated, and morally ambiguous tactic under extreme pressure, not as a pillar of her heroic virtue.  
      *   **Risk:** This feels like historical and moral evasion. It omits significant, documented actions central to her resistance. It potentially misrepresents the full scope of her conduct and the difficult choices she made. It may be perceived as dishonest by those aware of the full record. It fails to grapple with the theological problem; it merely hides the evidence that causes it.

  **My Recommendation: Pause for Theological Clarification (Option 2)**

  After deep reflection and prayer, and with profound respect for the arguments presented by Consultors Majewski and Zielińska – whose position I believe carries significant, possibly decisive, theological weight – **I recommend we pause the cause and seek a formal theological opinion.**

  My reasons are as follows:

  1.  **Primacy of Truth:** The cause of beatification must be built on truth – historical truth and moral truth. We have uncovered a historical truth (the fabrications) that collides with a fundamental moral truth taught by the Church. We cannot blithely assume the moral truth must bend to accommodate our desire for this beatification. We must seek the Church's authoritative guidance on whether and how these truths can be reconciled within the paradigm of heroic virtue.
  2.  **Respect for the Magisterium:** To proceed without resolving this conflict risks doing violence to the Church's clear and consistent teaching on lying. If that teaching is absolute and allows for no exceptions, then we *must* accept that Sister Agnieszka, however understandably and charitably, committed sinful acts. We cannot redefine sin as virtue. Only a higher theological authority can definitively address whether this specific context constitutes an exception *in practice* (even if not in theory) or how the sin impacts the judgment of heroic virtue overall.
  3.  **Integrity of the Cause:** Forwarding the cause now invites almost certain rejection or protracted, damaging controversy at the next stage, based precisely on the objection raised by two of our own consultors. Pausing demonstrates our commitment to the integrity of the process. Reframing feels intellectually dishonest and diminishes the full, complex reality of Sister Agnieszka's sacrifice.
  4.  **Justice to Sister Agnieszka:** Seeking clarity *is* justice to her. It ensures her cause is judged on the fullest possible understanding, both historical *and* moral. It prevents her beatification, if it proceeds, from being built on a potentially shaky or contested theological foundation. It allows her story, in all its complexity and difficulty, to be fully confronted by the Church she served.

  **Conclusion**

  This is not the outcome any of us desired. We have labored long for Sister Agnieszka’s cause. The instinct to see her courageous protection of the innocent recognized is holy and just. However, Consultors Majewski and Zielińska have raised an objection that strikes at the heart of Catholic moral theology. It is not a mere obstacle to be circumvented; it is a profound question demanding an answer we, as a historical commission, are not definitively equipped to provide.

  We stand at a threshold where historical evidence confronts magisterial doctrine. To cross it without the light of authoritative theological guidance risks error. I urge you to join me in recommending a pause. Let us formally petition for the *votum theologicum*. Let us seek the wisdom of the wider Church on this agonizing dilemma born of a time when the very fabric of truth and charity was under siege.

  Only with that clarity can we proceed with the confidence that our recommendation for Sister Agnieszka Radomska rests on unshakeable foundations, both historical and doctrinal. I will call for a vote on this recommendation tomorrow.

  In prayerful solidarity,

  **Fr. Tomasz Nowak, J.C.D.**
  Chair, Diocesan Historical Commission
