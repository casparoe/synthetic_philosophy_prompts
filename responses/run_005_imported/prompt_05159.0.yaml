answer: |-
  Here’s a toast weaving Lewis’s Convention into a warm, accessible narrative that honors the couple’s journey while making philosophers nod and non-philosophers feel included. Key moves: reframing "arbitrariness" as *chosen uniqueness*, using relatable examples of the couple’s rituals, and emphasizing *ongoing choice* as the heart of commitment.

  ---

  **(Clink glass… gentle pause)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], and I had the privilege of studying alongside our brilliant bride during our MA. Now, [Bride] wrote her thesis on a philosopher named David Lewis and his big idea: **‘Convention.’** And since she’d hunt me down if I *didn’t* sneak some philosophy into this toast… *(wink at Bride)*… don’t worry, I promise it’s really a love story.  

  See, Lewis asked a simple question: **How do we coordinate?** How do we know to drive on the right (or left!), say ‘bless you’ after a sneeze, or even settle on a favorite pizza topping? His answer was **Convention** – a pattern of behavior that sticks because it solves a tiny, everyday problem *together*, and we all *know* we’re choosing it.  

  Now, the first thing Lewis says might sound surprising: **Conventions are often *arbitrary*.** That doesn’t mean random or meaningless! It means there are *many* perfectly good ways to solve the problem. Driving on the left works just as well as the right… *as long as we all do the same thing.* The ‘arbitrariness’ is the freedom to pick *our* solution.  

  **(Pivot to the couple, warm tone)**  

  **And [Bride] and [Groom], you’ve been building conventions from day one.** Think about your little rituals – the ones that seem silly to outsiders but are *sacred* to you two. That specific way you argue over who makes the coffee just so the other can pretend to hate it… then drink it with a smile. *(Use a real, cute example if you know one!)*. Or how you always watch that one terrible reality show on Thursdays, not because it’s good, but because it’s *yours*.  

  **Those weren’t just habits. They were tiny conventions evolving.** You faced mini coordination problems: *‘How do we do Friday nights?’ ‘How do we cheer each other up after a rough day?’* And you found *your* solutions. Maybe it was arbitrary whether you chose tacos or sushi for ‘Sad Day Comfort Food’… **but the fact that you *chose one together*, knew the other expected it, and kept choosing it? That’s Lewis in action!**  

  **That’s the magic bit:** It’s not the *ritual itself* that’s powerful. It’s the **common knowledge** – you both *know* this is your thing, you both *know the other knows*, and crucially, **you both keep *choosing* to do it.** Every time you replay that dumb inside joke for the 100th time, you’re not just going through motions. You’re signaling: *‘This is us. I choose our way. Again.’*  

  **(Address the room, inclusive)**  

  **That’s why today isn’t the *start* of their convention. It’s the grand announcement of it!** The wedding makes it **common knowledge to all of us.** We all see it, know it, and know everyone else here sees it and knows it. *We* become part of the beautiful scaffolding supporting their convention. The rings? The ultimate **salient signaling device** – instantly recognizable, saying *‘We’re playing by *our* rules now.’*  

  **So, to Lewis’s point about arbitrariness:** Could [Bride] and [Groom] have found happiness with other people? Sure. There are many good paths. **But that’s what makes *their* choice so profound.** Out of all possible conventions, all possible ways to build a life, they *keep choosing this one*. They built it gesture by gesture, laugh by laugh, through years of solving tiny coordination problems with solutions that became uniquely *theirs*.  

  **Their marriage isn’t arbitrary because it’s random. It’s uniquely theirs *because* they chose it, together, repeatedly, knowing the other was choosing it too. That’s what makes it real. That’s what makes it stable. That’s what makes it a convention built on love, not obligation.**  

  **(Raise glass)**  

  **So let’s raise a glass to [Bride] and [Groom].**  
  To the beautiful, arbitrary, *chosen* convention you’ve already built.  
  To the profound **common knowledge** we celebrate today.  
  And to a lifetime of happily solving coordination problems together – always choosing *your* way, again and again.  
  May your precedent be strong, your salience bright, and your mutual expectations forever fulfilled.  
  **Cheers!**  

  ---

  **Why this works:**  

  1.  **Defangs "Arbitrariness":** Immediately reframes it as *freedom of choice* and *uniqueness* ("*our* solution"), contrasting with randomness. Uses concrete couple-examples.  
  2.  **Leverages Rituals:** Frames their private jokes/habits as *proto-conventions*, showing the theory in action *before* the wedding. This is warm and relatable.  
  3.  **Emphasizes *Choice*:** The core emotional punch (Lewis's "everyone *prefers* to conform...") becomes "you *keep choosing* it." This translates stability into active commitment.  
  4.  **Makes Jargon Accessible:**  
      *   "Coordination problem" = "How do we do Friday nights?"  
      *   "Precedent/Salience" = "Your inside joke," "The rings."  
      *   "Common Knowledge" = "We all see it and know we all see it."  
  5.  **Wedding as Culmination:** Positions the ceremony not as the start, but as the moment their existing convention becomes universally recognized (common knowledge), which feels celebratory.  
  6.  **Satisfies Philosophers:** Uses the actual machinery (arbitrariness clause, CK, precedent, salience, coordination) accurately but embedded in narrative.  
  7.  **Heart is Universal:** The message is about unique partnership, active choosing, and shared history – resonant for everyone.  
  8.  **Pacing:** Anecdotes, pauses, and direct address keep it engaging for 5 minutes.  

  **Delivery Tip:** Smile, make eye contact with the couple during the personal ritual examples, and sweep the room during the "common knowledge to all of us" part. Keep the tone warm and celebratory, not lecture-y.
