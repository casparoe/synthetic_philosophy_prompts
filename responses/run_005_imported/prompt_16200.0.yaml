answer: |-
  That's an incredibly sharp observation, and you've perfectly identified the core tension between normative rationality (what *should* be) and descriptive psychology (what *is*). The money-pump argument **is** a devastating critique of time-inconsistent preferences from a normative, decision-theoretic perspective. Exponential discounting **is** the only discount function guaranteed to be dynamically consistent and immune to this exploit in principle.

  So why don't rationalists conclude that hyperbolic discounting is simply "irrational" and needs complete replacement? Several interconnected reasons:

  1.  **The Descriptive Reality is Inescapable:** Decades of experimental psychology and behavioral economics overwhelmingly show that hyperbolic discounting (or close approximations like quasi-hyperbolic β-δ models) accurately describe *actual human (and animal) choice behavior*. We *are* time-inconsistent creatures. Declaring this "universally irrational" doesn't make it go away. It's a fundamental feature of our cognitive architecture, likely rooted in evolved neural systems prioritizing immediate rewards for survival. Treating it as a "bug" implies we can simply choose to "install" exponential discounting, which isn't psychologically plausible for most people most of the time.

  2.  **Preferences Aren't Chosen, They're Discovered (and Constrained):** We don't *choose* our fundamental discount function consciously. We *discover* our preferences through introspection and observation of our own choices. Telling someone, "Your revealed preferences are irrational, adopt exponential discounting instead," is like telling someone with a sweet tooth, "Your preference for sugar is irrational, prefer broccoli instead." It ignores the deep-seated nature of the preference. Commitment devices work *within* this constraint by changing the *choice architecture* or *incentives*, not by magically rewriting the underlying preference function.

  3.  **The "Multiple Selves" Framework and Self-Paternalism:** Hyperbolic discounting naturally leads to viewing the agent as a series of temporally situated "selves" with conflicting interests. The "present self" (high β, valuing now much more than later) is in conflict with the "future self" (lower β, valuing that future moment more consistently). Commitment devices are tools the "longer-term planning self" uses to *bind* or *constrain* the choices available to the "short-term impulsive self." This is seen as a form of *self-paternalism* or internal conflict resolution, not a rejection of the underlying preferences. The device respects the *longer-term self's* desire to achieve its goals despite knowing the *short-term self* will rebel.

  4.  **Practicality and Harm Reduction:** Even if exponential discounting is normatively ideal, achieving it consistently is practically impossible for humans burdened with hyperbolic tendencies. Commitment devices are *pragmatic solutions* to mitigate the *damage* caused by inconsistency (akrasia, procrastination, failure to achieve long-term goals). They are "second-best" solutions that work within the messy reality of human psychology. Insisting on wholesale preference replacement is seen as unrealistic and unhelpful for actually improving lives.

  5.  **The "True" Preference is Debated:** Some argue that the *long-term plan* (e.g., "I want to write this book") reflects the agent's "true" or "considered" preference, while the impulsive deviation (e.g., "I'll browse Reddit instead") is a temporary failure of willpower exploiting a preference inconsistency. Commitment devices help the agent act according to their "true" preference. Others argue that all revealed preferences are "true" in the moment, making the conflict between successive selves genuine. In either view, commitment devices are tools for managing the conflict.

  6.  **The Money Pump is Often Theoretical/Contrived:** While logically sound, the pure money pump scenario relies on a hyper-rational, patient, and somewhat malicious counterparty exploiting the inconsistency *repeatedly*. In real life:
      *   Exploiters might not exist or be identifiable.
      *   The exploitation might only happen once or twice before learning occurs (though akrasia often persists despite learning!).
      *   The costs of inconsistency (e.g., health damage from procrastinating exercise, career damage from missed deadlines) are often diffuse internal costs rather than direct payments to an external exploiter. Commitment devices target these *real-world costs* of inconsistency more directly than the abstract money pump argument.

  **So, which is it?**

  *   **Normatively:** Yes, the money pump argument is devastating. From a strict, formal decision-theoretic perspective seeking dynamic consistency and exploitability-proofness, exponential discounting is the *only* rational standard. Time-inconsistent preferences *are* irrational in this framework. There is no way to be fully immune to the *potential* exploit while keeping *strictly* time-inconsistent preferences intact.
  *   **Descriptively/Pragmatically:** Humans are hyperbolic discounters. We cannot simply choose to become exponential discounters. Commitment devices are brilliant, empirically validated tools for managing the *consequences* of this inherent inconsistency. They allow us to achieve goals that would otherwise be sabotaged by our inconsistent future selves. They are a way of making our *behavior* more consistent with our *longer-term plans* despite the underlying preference inconsistency.

  **Conclusion:** The rationalist community isn't *quietly failing* to take the exploitability argument to its logical conclusion. They **fully acknowledge** its normative force. However, they are primarily engaged in the *practical project* of improving human welfare and goal achievement *given* the inescapable descriptive reality of hyperbolic discounting. They treat the inconsistency as a *fixed constraint* at the level of fundamental preference generation, not because they deny its irrationality, but because fighting it at that level is empirically futile. Commitment devices are the ingenious workaround – the way to make our actions *approximate* the rationality of exponential discounting *behaviorally*, even if our underlying *preferences* remain stubbornly hyperbolic. It's a recognition of the gap between normative ideals and psychological reality, and a focus on bridging that gap pragmatically.
