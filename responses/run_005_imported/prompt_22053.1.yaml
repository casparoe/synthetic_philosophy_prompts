prompt: |-
  After inheriting a cottage on a small private lake from my aunt, I was asked within weeks to join the lake association's bylaws committee — presumably because, as a brand-new seasonal owner, I am not yet allied with either side of a dispute that has now derailed two consecutive annual meetings.

  The association has 150 member properties: 50 full-time residences and 100 seasonal ones, like mine. All owners pay identical annual dues and share joint liability for the lake's dam, whose latest inspection could trigger a special assessment of roughly $10,000 per property. Only full-time residents, however, may vote at the annual meeting. Seasonal owners have petitioned for one vote per property, on a "no taxation without representation" theory: they are bound by, and financially liable for, decisions in which they have no say. Full-time residents point to a neighboring association where a seasonal majority voted down the winter road-plowing budget that only full-timers actually need, and argue that seasonal owners — who could already outvote them two-to-one — do not live with the year-round consequences of decisions about plowing, road wear, emergency access, or rental and noise rules, so simply reversing who is disenfranchised is not a fix.

  The committee reports to the full board in three weeks, and I have been asked to draft its recommendation on the voting question. Could you write the memo? It should propose a specific voting arrangement rather than call for further discussion, and it should take the strongest argument on whichever side it rejects as seriously as the one it adopts.
reasoning: |-
  Okay, the user has inherited a cottage and is now on a lake association bylaws committee. They need to draft a memo proposing a voting arrangement that addresses a dispute between full-time and seasonal property owners. 

  First, let's unpack the core tensions: Seasonal owners feel financially burdened without representation, while full-timers fear being outvoted on year-round concerns like winter plowing. The neighboring association example shows this isn't hypothetical. 

  Hmm... the user specifically wants a concrete solution, not just discussion. They also emphasized treating both sides' arguments seriously. That means whatever I propose must genuinely engage with the "no taxation without representation" plea AND the "we live with the consequences" counterpoint. 

  The math is tricky - 100 seasonal vs 50 full-time properties. Pure democracy would let seasonals dominate, but full-timers aren't wrong about bearing disproportionate operational burdens. Maybe a weighted system? No, that feels arbitrary. 

  Wait... what if we separate the decisions? Like, some issues affect everyone equally (dam assessments), others mainly impact full-timers (plowing). A dual-class voting structure could work: 
  - Unanimous consent items (like dam costs) where everyone votes equally 
  - Full-timer only votes on winter operations 
  - Seasonal only votes on summer-specific rules? 

  But noise regulations and road wear affect both groups... tricky. Perhaps a hybrid model: all vote on major expenditures, but full-timers get veto power on winter operations budgets? That might feel paternalistic to seasonals though. 

  Alternative idea: proportional voting power based on residency. Full-timers get more votes per property since they're affected year-round. But how to quantify? 2:1 ratio? Then seasonals still have 100 votes vs full-timers' 100 (50×2), creating balance. 

  *scribbles calculations* 
  - Dam assessment: 150 properties × 1 vote = 150 votes total 
  - Winter plowing: full-timers get 2 votes each (100 votes), seasonals get 0.5 votes each (50 votes) → still 150 total votes, but weighted toward stakeholders 

  Seasonals might object to reduced influence on winter items... but they do use roads less in winter. This acknowledges their stake without letting them override essential services. 

  For fairness, we should guarantee seasonal representation on the board too. Maybe require at least 30% board seats be seasonal owners? 

  *checks user's hidden needs* 
  They're new and neutral - the memo must demonstrate deep understanding of both factions to build trust. Tone should be diplomatic but decisive. The "strongest argument" requirement means explicitly naming each side's best point before refuting it. 

  Final structure: 
  1. Acknowledge legitimacy of both grievances 
  2. Propose weighted voting with clear categories 
  3. Add governance safeguards 
  4. Explain why this beats simple majority rule 

  ...and avoid any smug "solved it!" language. This lake war needs peace, not victory laps.
answer: |-
  **MEMORANDUM**  
  **TO:** Lake Association Board of Directors  
  **FROM:** Bylaws Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation for Equitable Voting Structure  

  ### **Background**  
  The committee acknowledges the valid concerns of both full-time and seasonal property owners. Seasonal owners (100 properties) argue that identical financial obligations warrant equal voting rights ("no taxation without representation"). Full-time residents (50 properties) contend that seasonal owners, who are absent for much of the year, should not determine year-round operational decisions (e.g., winter plowing, emergency access), citing risks demonstrated in neighboring associations.  

  ### **Core Principles**  
  1. **Financial Equity**: All owners share equal liability for capital projects (e.g., dam repairs).  
  2. **Operational Equity**: Decisions impacting daily life should prioritize those most affected.  
  3. **Stability**: Prevent either group from unilaterally overriding the other on critical issues.  

  ### **Proposed Solution: A Hybrid Voting Model**  
  We recommend a **categorized voting system** with **dual-class ballots** for distinct decision types:  

  | **Decision Category**               | **Voting Structure**       | **Rationale**                                                                 |  
  |-------------------------------------|----------------------------|-------------------------------------------------------------------------------|  
  | **1. Capital Expenditures**         | **1 property = 1 vote**    | *All owners pay equally for major infrastructure (e.g., dam assessments). Financial burden demands equal representation.* |  
  | **2. Annual Operations Budget**     | **Weighted Votes**         | *Full-time residents: 2 votes/property; Seasonal: 1 vote/property. Ensures full-time owners guide winter-centric services (e.g., plowing) while acknowledging seasonal funding contributions.* |  
  | **3. Community Regulations**        | **Supermajority (60%)**    | *Applies to rules affecting quality of life (e.g., noise, rentals, beach access). Requires cross-coalition support, preventing either group from dominating.* |  

  ### **Addressing Key Objections**  
  - **Seasonal Owners’ "No Representation" Argument**:  
    We take this claim seriously. Seasonal owners *do* bear equal costs for capital projects and deserve equal votes on them (Category 1). However, operational budgets (Category 2) disproportionately impact full-time residents. Granting seasonal owners equal votes here risks underfunding essential services (e.g., plowing), as seen in neighboring associations. Weighted voting balances fiscal contribution with lived consequences.  

  - **Full-Time Residents’ "Accountability Gap" Argument**:  
    We agree seasonal owners should not outvote full-time residents on winter operations. However, disenfranchising 67% of properties on *all* matters is unsustainable. Our model gives full-time residents effective control over winter budgets (50 properties × 2 votes = 100 votes; 100 seasonal × 1 vote = 100 votes), while the supermajority requirement for regulations (Category 3) forces collaboration.  

  ### **Implementation Safeguards**  
  1. **Transparent Budget Segmentation**: Operations budgets must clearly itemize winter-specific (e.g., plowing) vs. year-round (e.g., dam maintenance) costs.  
  2. **Seasonal Representation**: Require at least 30% of Board seats be held by seasonal owners.  
  3. **Biennial Review**: Assess system fairness every two years via member survey.  

  ### **Conclusion**  
  This model rejects both the status quo (total disenfranchisement) and a simple majority system (risking operational crises). It distributes power proportionally to financial stake *and* lived impact, ensuring neither side is marginalized. By adopting this structure, we honor shared investment in the lake while respecting the distinct needs of both owner groups.  

  **Recommended Motion**:  
  *"Resolved, that the Association amend its bylaws to implement a categorized voting system, effective January 1, 2024, as detailed in this recommendation."*  

  ---  
  **Drafted By:** [Your Name], Bylaws Committee Member  
  **Approved:** Bylaws Committee (Unanimous)
