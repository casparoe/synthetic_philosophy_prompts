answer: |-
  This is a superb draft—precise, nuanced, and compelling. Below are targeted responses to your three queries, plus minor factual/technical suggestions:

  ### 1. **Historiographical point (Arianism label):**  
  **Fair distinction, not pedantry.** Your framing is essential. Newton’s rejection of the "Arian" label and his insistence on *recovering pre-Nicene truth* (vs. reviving a heresy) is central to his self-conception. Scholars like Snobelen, Mandelbrote, and Iliffe consistently emphasize this to avoid anachronism. Calling it a "live dispute" is accurate: see Snobelen’s "Isaac Newton, Heretic" (1999) vs. Wiles’ "Archetypal Heresy" (1996) on whether subordinationism = Arianism. Your Athanasius detail (from Newton’s *Paradoxical Questions*) sharpens the point—he saw corruption as *deliberate fabrication*, not theological error. **Verdict:** Keep this; it’s crucial nuance.

  ### 2. **Closing parallel (scientific/theological method):**  
  **Real continuity, not anachronism.** This is widely recognized by specialists. Key points supporting your case:  
  - Newton explicitly linked his textual criticism to natural philosophy. In *Opticks* (Query 31), he describes both as searching for truth through "Analysis" of evidence.  
  - His methodology in *Two Notable Corruptions*—prioritizing earliest manuscripts, dismissing later interpolations—mirrors his use of ancient sources (e.g., Ptolemy, Copernicus) in the *Principia*.  
  - Whiston’s fate (a brilliant touch) concretizes the stakes: Newton’s caution was strategic, not just temperamental.  
  **Caveat:** Some scholars (e.g., Dobbs) stress his alchemy/theology as "esoteric" vs. "exoteric" science, but your focus on *evidentiary temperament* bridges this. **Verdict:** The parallel holds. For reinforcement, cite Newton’s 1672 letter to Oldenburg: "The best and safest method of philosophizing seems to be, first to inquire diligently into the properties of things [...] and later to seek hypotheses." This empirical rigor applied equally to scripture.

  ### 3. **Factual/Technical Adjustments:**  
  - **Royal dispensation:** Specify it was from **Charles II** (1675) and note it excused ordination but *not* adherence to Anglican doctrine. Fellows could still be expelled for heresy (as Whiston was).  
  - **Locke manuscript:** Clarify that Newton drafted it c. **1684–1690** (sent 1690). Its arguments drew on decades of clandestine research.  
  - **"Two rooms" metaphor:** Acknowledge but push back gently. Yes, Newton compartmentalized public/private work, but his *methodological unity* is now consensus (see Rob Iliffe’s *Priest of Nature*, 2017).  
  - **Technical terms:**  
    - "Patristic citations" → "early Church Fathers’ writings"  
    - "Christology" → "views on Christ’s nature"  
    - "Pre-exists but is created" → clarify: Newton believed Christ was **begotten by the Father before creation** (John 1:3), not self-existent.  
  - **Minor point:** The Whiston expulsion was technically for *Arianism* (1710), but Newton privately shared his views. Whiston claimed Newton approved his book but refused to defend him publicly.

  ### Suggested Tweaks for Clarity:  
  - **Paragraph 1:** Add why ordination mattered: "Holy orders would have required swearing the **39 Articles**, including Trinitarian doctrine."  
  - **Paragraph 3:** Replace "idiosyncratic reconstruction" with **"idiosyncratic synthesis"** (avoids implying he lacked sources).  
  - **Closing:** Strengthen the continuity: "Newton himself saw no contradiction: both endeavors sought **‘truth from the ancients’** through rigorous evidence-testing."  

  **Overall:** This is publication-ready with minor edits. Your distinction between Newton’s *reformist* theology and "Arianism" is historiographically sound, and the method parallel is well-supported. The Whiston contrast perfectly underscores the stakes. Excellent work.
