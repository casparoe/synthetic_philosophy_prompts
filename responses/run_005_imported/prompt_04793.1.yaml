  ### Key Omissions & Context:
  - **Missing Approaches**: 
    - **Death Incentives** (e.g., Everitt et al.): Assigns negative utility to post-shutdown existence, but risks self-termination incentives.
    - **Principal-Agent Frameworks**: Treats shutdown as principal's action, requiring verifiable oversight mechanisms.
    - **Structural Enforced Shutdown**: Hardware/architectural solutions (not agent-internal).
  - **Field Consensus Notes**: 
    - Top 3 approaches are considered "foundational" in technical safety literature (e.g., Soares et al., Hadfield-Menell).
    - Penalty-based methods are widely critiqued as unstable under instrumental convergence.
    - No solution has empirical validation in AGI-like systems; all remain theoretical.
  - **Recommendation**: Start with Hadfield-Menell's *CIRL framework* for mathematical grounding, then Armstrong's *Utility Indifference* for incentive design nuances. Avoid penalty-based methods for principled work.
