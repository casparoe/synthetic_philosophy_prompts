prompt: |-
  So in my APUSH class we just got done with this whole thing on Frederick Douglass and the Constitution and its kind of messing with my head ngl. Turns out he used to be all in with William Lloyd Garrison, who thought the Constitution was so pro-slavery that he literally called it "a covenant with death, and an agreement with hell" and once burned a copy of it at a rally. But then at some point Douglass basically flips and starts arguing that if you actually read the text instead of guessing what the framers secretly meant, the Constitution is an anti-slavery document. Now my teacher's making us do this debate thing next week where half the class has to defend Douglass's later position using only arguments he actually made, not stuff we just make up on the spot, and I got picked as "captain" for my side, so I'm the one who has to decide which arguments we lead with, since after every point the other side gets like 90 seconds to try and rip it apart.

  Here's what I've got so far from the reading packet, his six main arguments: (1) the words "slave" and "slavery" never once show up anywhere in the document, just stuff like "other persons," which he says proves the framers were ashamed of it and didn't want it locked into the law forever; (2) the three-fifths clause is actually a restriction on slaveholding states since the South wanted their slaves counted as full people for representation and didn't get that, plus calling them "persons" at all already contradicts treating them as pure property; (3) the fugitive slave clause never says "slave" either and doesn't even specify who's supposed to enforce it; (4) the clause protecting the international slave trade only until 1808 is basically a built-in expiration date, meaning the framers expected Congress to be able to kill it eventually (which it did); (5) the Preamble talks about "justice" and "the blessings of liberty," and Douglass's point is that's a weird thing to write if you're secretly building a pro-slavery government; and (6) his bigger, more legal-sounding point that you interpret a document by what it actually says, not by secretly guessing what a handful of guys meant when they wrote it decades earlier.

  I don't need these explained to me, I already get the gist of each one, what I actually need is help figuring out which ones would survive getting pushed on hard and which ones are gonna loose fast if the other team is smart about it. Could you sort all six into tiers by how well they'd hold up, and send it back as a JSON block, something like:

  ```json
  {
    "lead_with_this": ["..."],
    "solid_backup": ["..."],
    "risky_last_resort": ["..."]
  }
  ```

  and then just a sentence each somewhere explaining why you put it where you did. I gotta have this ready by Wednesday so appreciate any help!
reasoning: |-
  Okay, let me start by understanding what the user needs. They're preparing for a debate in their APUSH class on Frederick Douglass's later position that the Constitution is anti-slavery. They've listed six arguments Douglass used and need them sorted into tiers based on how well each would hold up under scrutiny. The user is the team captain, so they need to prioritize strong arguments and know which ones are riskier.

  First, I recall Douglass's shift from Garrison's view. His key points hinge on textual analysis rather than the framers' intent. The user provided six arguments: absence of "slave" terminology, the three-fifths clause as a restriction, fugitive slave clause wording, the 1808 slave trade expiration, the Preamble's principles, and the importance of literal interpretation.

  I need to evaluate each argument's robustness. Starting with the strongest: the absence of "slave" and "slavery" in the Constitution. This is solid because it's a factual observation. Critics might point out framers used euphemisms to avoid moral discomfort, but Douglass counters that by not naming it, the document doesn't enshrine slavery permanently. This is hard to refute textually, so it should lead.

  Next, the 1808 clause expiration. It shows the framers anticipated ending the slave trade, which Congress did. It's a concrete example of the Constitution allowing anti-slavery action. Opponents might argue it only delayed abolition, but the fact that it happened supports Douglass. This is strong but requires context, so it's a good backup.

  The Preamble mentioning liberty and justice is powerful rhetorically but abstract. Critics could say these are ideals not enforced. However, Douglass uses it to highlight the contradiction in a pro-slavery reading. It's impactful but less concrete, so better as backup.

  The three-fifths clause is tricky. Douglass argues it limited slave states' power by not counting slaves fully. But opponents might counter that it still gave extra representation for slaves. The "persons" vs. property point is good, but the clause's benefit to the South weakens it. This is risky because it's easily challenged.

  The fugitive slave clause lacks enforcement specifics. While true, historically, it was enforced pro-slavery. Douglass's point might seem like a technicality, and opponents can cite real-world impact. This is weak under pressure.

  The textual interpretation argument is foundational but meta. In a debate, it might not directly counter specific clauses. Opponents could argue framers' intent matters. It's crucial but better as a closing framework after presenting evidence.

  The user also mentioned needing this by Wednesday, so I should ensure the JSON structure is clear. They want tiers: lead_with_this, solid_backup, risky_last_resort. I'll map the arguments accordingly, explaining each placement concisely.

  Finally, considering the user's role as captain, they need to anticipate counterarguments. The strongest points are those hardest to refute textually, while riskier ones involve historical interpretations that opponents might twist. My sorting aims to maximize their debate strategy.
answer: |-
  Here's the JSON tier list based on debate resilience, with brief explanations:

  ```json
  {
    "lead_with_this": [
      "The words 'slave' and 'slavery' never appear (euphemisms used)",
      "The 1808 international slave trade clause has a built-in expiration date",
      "The Preamble's commitment to 'justice' and 'liberty' contradicts a pro-slavery purpose"
    ],
    "solid_backup": [
      "The Fugitive Slave Clause lacks enforcement mechanisms and avoids the term 'slave'",
      "Interpret the text as written, not by speculating on framers' secret intentions"
    ],
    "risky_last_resort": [
      "The Three-Fifths Clause actually restricts slaveholding power"
    ]
  }
  ```

  **Explanations:**
  1. **Lead With This:** 
     - **Absence of "slave/slavery"**: Textually undeniable; forces opponents to explain euphemisms.  
     - **1808 Expiration**: Concrete evidence of constitutional sunsetting of slavery's expansion.  
     - **Preamble Principles**: Highlights hypocrisy of pro-slavery readings; roots argument in foundational values.  

  2. **Solid Backup:**  
     - **Fugitive Clause Ambiguity**: Legally sound (text lacks enforcement details), but opponents will cite historical enforcement.  
     - **Text-Over-Intent**: Strong jurisprudential principle, but debatable if historical context overrides it.  

  3. **Risky Last Resort:**  
     - **Three-Fifths as Restriction**: South *gained* political power vs. zero count—this is easily countered with math showing slaveholder advantage.  

  **Debate Strategy Tips:**  
  - **Lead** with the textual absence of "slavery" + 1808 expiration to force opponents into defending euphemisms/procrastination.  
  - **Pivot** to Preamble when opponents cite framers' racism—ask why they'd enshrine liberty if the document was pro-slavery.  
  - **Use "Text-Over-Intent"** to dismiss "Framers were racist!" arguments: "We debate the *law*, not the lawmakers."  
  - **Avoid leading with Three-Fifths**—it’s mathematically weak. If forced, emphasize "persons" over property, but concede it’s imperfect.  
  - **Anticipate Counter:** Opponents will cite Article V (no amendment ban on slave trade before 1808) and *Dred Scott*. Respond: "The Constitution allowed abolition; it didn’t *prevent* it."  

  Good luck, Captain! Your strongest shield is the document’s actual text—make them wrestle with its words.
