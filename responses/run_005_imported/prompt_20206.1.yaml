  I should start by dissecting the analogy between natural kinds and moral terms. Natural kinds like "water" have a microstructure (H₂O) that's causally responsible for observable properties. But moral terms don't have such a microstructure. Human psychology is contingent and variable, unlike the chemical essence of water. So rigid designation might not apply the same way here.

