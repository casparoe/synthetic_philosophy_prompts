answer: |-
  Here is the strongest available argument that Yudkowsky’s metaethical position fails to dissolve the realism/anti-realism debate and instead collapses into a sophisticated form of relativism, engaging his rigid-designation framework on its own terms while addressing your specific concerns:

  ### Core Argument: The Misapplication of Rigid Designation & Hidden Contingency
  Yudkowsky’s model attempts to bypass realism/anti-realism by anchoring "right" via rigid designation to a specific computation (human moral psychology under ideal reflection). However, this move fails for three interconnected reasons:

  1.  **The Disanalogy with Natural Kinds: Reference Without Essence**  
      Kripke-Putnam rigid designation works for natural kinds because the reference is fixed by an *essential microstructure* causally responsible for observable properties (e.g., H₂O explains water’s liquidity, boiling point, etc.). "Right" rigidly designates a *contingent functional process* (human moral computation) with *no analogous essential structure*.  
      -   **Problem:** For water, the rigidly designated essence (H₂O) *explains* its observable properties and *grounds* counterfactual stability ("water would be H₂O in all possible worlds"). For "right," the rigidly designated computation *is* the observable property (human outputs) and lacks a deeper explanatory essence. The "referent" is defined entirely by the contingent functional architecture of human brains.  
      -   **Consequence:** Calling this computation "right" is *descriptive* of human psychology, not *normatively authoritative*. Rigid designation here captures "what humans *do* call right," not "what *is* right" in a mind-independent sense. This reduces to a *relational property* ("right-for-humans"), not an objective property like H₂O.

  2.  **The Open-Question Argument Revisited: The Persistence of Normativity**  
      Yudkowsky’s naturalism inherits Moore’s problem. Defining "right" as "the output of computation C" (where C = idealized human moral psychology) leaves open the question: *"But is computation C itself morally right/good/authoritative?"*  
      -   **Yudkowsky’s Response Anticipated:** He might argue this question is incoherent, as "right" *just means* C’s output. But this ignores the *normative force* of moral claims. When we say "torture is wrong," we imply a *reason* to avoid it, not just "this is what my brain computes."  
      -   **Engaging Rigid Designation:** Even if "right" rigidly designates C, this doesn’t explain *why we should care* about C’s outputs. The rigid designation fixes the *reference*, but not the *normative authority*. A psychopath could rigidly designate "right" as their own pleasure-maximization computation. We reject this not because of a referential error, but because it lacks *justificatory force*. Yudkowsky’s model identifies the *meaning* of "right" but fails to ground its *normativity*, leaving the anti-realist challenge ("Why obey this computation?") unanswered.

  3.  **Radical Contingency and the Failure of the Math Analogy**  
      Yudkowsky argues that calling the computation "arbitrary" is like calling math arbitrary because brains compute it. This analogy fails crucially:  
      -   **Math:** 2+2=4 is *necessarily true* across all possible worlds. Its truth is *discovered* by brains, not *constituted* by them. A differently evolved brain might *miscompute* 2+2, but it wouldn’t change the truth value.  
      -   **Morality (Yudkowsky’s Model):** The "right" computation is *contingently fixed* by human evolutionary/psychological history. In a world where humans evolved differently (e.g., with Babyeater psychology), "right" rigidly designates a *different computation* with potentially horrific outputs. There is no equivalent to the necessary truth of 2+2.  
      -   **Consequence:** The "subjunctive objectivity" Yudkowsky claims ("this *specific* computation would be right even if brains evolved differently") is tautological: "Right" rigidly designates *this specific computation*, so by definition, it designates it in all worlds. But this says nothing about whether that computation *should* be valued or has *normative weight*. The *selection* of which computation gets rigidly designated is utterly contingent on human biology. This *is* moving the arbitrariness back a step: from definitions to the causal history fixing the reference.

  ### "Three Worlds Collide" as Fatal Counterexample, Not Illustration
  Yudkowsky intends this story to show how different species have different rigidly designated "rights," making conflict tragic but not metaphysically contradictory. However, it critically undermines his claim to have dissolved realism/anti-realism:

  1.  **Demonstrates Radical Relativism:** The story explicitly shows there is *no higher standard* to adjudicate between Human, Babyeater, and Superhappy values. Each is "right" relative to its own rigidly designated computation. This *is* anti-realism/relativism – values are indexed to contingent cognitive architectures. Humans cannot say Babyeaters are *objectively wrong* in a realist sense; they can only say Babyeaters violate *human*-designated rightness.
  2.  **Highlights the Lack of Normative Authority:** The story’s central dilemma arises precisely because no species’ computation has inherent normative priority. The conflict is resolved through *pragmatic negotiation and power* (allied humans/Superhappies suppress Babyeaters), not by appealing to a mind-independent moral truth. This tacitly concedes that rigid designation alone provides no normative force beyond internal consistency within a framework.
  3.  **Undercuts "Subjunctive Objectivity":** If "right" for Humans rigidly designates Computation H, and for Babyeaters it designates Computation B, then in a world where Humans evolved like Babyeaters, "right" *would* designate B. This confirms the *contingency* of the referent. Contrast this with water: In *all* worlds, water is H₂O. Yudkowsky’s morality lacks this cross-world stability of reference *to the same thing*; it only has stability *within* a lineage.

  ### Conclusion: Sophisticated Relativism, Not Dissolution
  Yudkowsky successfully provides a naturalistic, causal account of how the *concept* "right" gets its *reference* for humans, using a clever application of rigid designation. However, he fails to escape the realism/anti-realism dilemma:

  *   **Against Realism:** His "right" lacks mind-independent existence or authority. It is ontologically dependent on contingent human psychology. Realists seek "rightness" as a *reason-giving property*, not just a reliably designated computational output.
  *   **Collapse into Relativism:** By grounding "right" entirely in a species-specific (or even individual-specific, under idealization) computation fixed by contingent causal history, and explicitly denying any transcendent standard ("Three Worlds"), the position is a form of **indexed relativism** or **species-dependent naturalism**. It provides *descriptive objectivity* about human moral outputs ("This *is* what we mean by 'right'"), but not *normative objectivity* ("This *ought* to bind everyone").
  *   **The Relabeling Charge:** Yudkowsky relabels anti-realism/naturalism/relativism using the *vocabulary* of realism (rigid designation, objectivity, unique referent). But by locating the source of normativity entirely within contingent human cognition, he adopts the core anti-realist stance: Moral facts are not discovered features of a mind-independent reality, but are constituted by human (or agent-relative) responses. The "dissolution" is semantic; the core dilemma persists between mind-independent authority vs. contingent response-dependence.

  In essence, Yudkowsky offers a compelling account of *moral semantics* and *psychological universality* for humans, but mistakes this for an account of *moral ontology* and *normative authority*. The arbitrariness isn't dissolved; it's embedded in the evolutionary accident that led to *Homo sapiens'* specific moral computational architecture. "Three Worlds Collide" starkly reveals this relativism, showing that "right" rigidly designates different computations for different minds, with no meta-computation to resolve their conflicts. This is anti-realism wearing realist linguistic clothing.
