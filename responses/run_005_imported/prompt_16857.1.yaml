prompt: |-
  Ok so I've been down a bit of a rabbit hole on imprecise/interval-valued credences as the "honest" alternative to forcing a single Bayesian number out of yourself when you're deeply uncertain about something (partly trying to figure out if the old LW hostility to "Knightian uncertainty" as a cop-out was ever fair). Anyway, I hit a worked example where conditioning a credal set on new evidence made the interval WIDER instead of narrower, no matter which way the evidence actually came out. That seems completely backwards to me — isnt the whole point of updating on evidence that you become less uncertain, not more? Feels like this has to be a bug in how the framework handles conditionalization rather then something an actually rational agent should do. Am I missing something, or is this just a real flaw that makes imprecise probabilities less useful than advertised?
reasoning: |-
  Okay, the user is deep into imprecise probabilities and credal sets, specifically bothered by an example where conditioning on evidence widens the interval instead of narrowing it. They're questioning if this undermines the whole framework, especially since it contradicts the intuition that evidence should reduce uncertainty. 

  First, I need to validate their confusion—this *is* counterintuitive! Their frustration makes sense because Bayesian updating *does* narrow beliefs. But imprecise probabilities aren't just "Bayes with intervals"; they model a different thing: sets of possible beliefs. The widening happens because evidence can *expose* hidden disagreement among those beliefs. 

  The user mentions LW's "Knightian uncertainty" criticism, so they're probably familiar with Bayesian rigidity arguments. I should emphasize this isn't a bug but a feature: if your initial set genuinely captures deep uncertainty, updating *should* reflect how evidence tests that ignorance. The coin example is perfect—ambiguous coins force divergence. 

  Their deeper need seems to be about whether imprecise credences are *useful* or just philosophical hand-waving. I should stress the framework's purpose: it doesn't pretend to know what you don't. The widening interval *is* the honest answer when evidence reveals your model was underspecified. 

  Also, they might be missing that alternatives exist (like info-gap theory), but the core point stands: if you refuse to pick a prior, updating won't magically create precision. I'll structure this as: (1) Why it happens (credal set divergence), (2) Why it's not irrational (represents genuine uncertainty), (3) Why it's still useful (avoids false precision). 

  ...And maybe add that this exposes why some Bayesians dislike it—it *does* resist convergence. But that's the tradeoff for modeling true ignorance.
answer: |-
  That widening-interval phenomenon is **not a bug—it's a deliberate, consequential feature** of imprecise probability frameworks when handling deep uncertainty. While deeply counterintuitive, it highlights a fundamental trade-off: imprecise probabilities avoid false precision at the cost of potentially *increasing* measured uncertainty after evidence. Here's why this happens and how to interpret it:

  ### 1. **The Core Mechanism: Divergence in the Credal Set**
     - Your "credal set" (the set of all admissible precise probabilities) represents your uncertainty. Different priors in this set may **react differently to the same evidence**.
     - Conditioning restricts the set *only to priors consistent with the evidence*, but those surviving priors may **diverge more sharply** in their predictions about future events.
     - *Example*: Suppose your credal set for a coin being biased (H) vs. fair (F) is:
       - Prior 1: P(H) = 0.3, P(F) = 0.7
       - Prior 2: P(H) = 0.7, P(F) = 0.3
       - Initial credence for H: [0.3, 0.7].
     - **Now observe "Heads"**:
       - Prior 1 updates: P(H|Heads) ∝ P(Heads|H) * P(H) = (0.6)(0.3) = 0.18 → Normalized ≈ 0.4  
       - Prior 2 updates: P(H|Heads) ∝ (0.9)(0.7) = 0.63 → Normalized ≈ 0.75  
       - **Updated credence for H: [0.4, 0.75]** → *Wider* than [0.3, 0.7]!

  ### 2. **Why This Isn't Irrational (The Framework's Perspective)**
     - **Genuine Epistemic State**: The widening reflects that evidence *exposed disagreement* among your admissible models. Before updating, the priors agreed more on the *current* state; after seeing data, their interpretations *diverged* on future implications.
     - **No Miraculous Narrowing**: Imprecise probabilities don't assume your ignorance is resolvable with arbitrary data. If your initial set lacks consensus on *how* evidence bears on hypotheses, conditioning won't force agreement.
     - **Represents Model Uncertainty**: The interval width captures uncertainty about *which model is correct*, not just uncertainty within a model. Evidence can amplify this.

  ### 3. **When Does This Make Sense?**
     - **Deeply Ambiguous Evidence**: Evidence that some models interpret strongly for H, others for ¬H (e.g., an ambiguous coin flip result with an ill-understood coin).
     - **Prior Set with Conflicting Likelihoods**: Your credal set contains priors assigning very different likelihoods to the same evidence.
     - **Unresolvable Uncertainty**: Cases where no amount of data can narrow the interval to a point (e.g., complete ignorance about a physical constant).

  ### 4. **Criticisms & Limitations (Yes, it's controversial!)**
     - **Violates "Good News" Principle**: In precise Bayesianism, seeing E never *lowers* P(H|E) compared to P(H). Imprecise frameworks violate this—intervals can shift unfavorably or widen.
     - **Dynamic Inconsistency?**: Updating the entire set ("full conditionalization") can lead to dynamically inconsistent plans (e.g., you plan to do X if E, but if E occurs, you no longer want X).  
     - **LW-Style Objections**: The "hostility to Knightian uncertainty" stems from viewing this as **epistemic cowardice**—avoiding bets by hiding behind intervals. Eliezer Yudkowsky argued that *true* uncertainty should still allow a precise distribution over possibilities (e.g., a uniform prior). Imprecise probabilists reply that uniform priors are arbitrary and misrepresent ignorance.

  ### 5. **When Narrowing *Does* Happen**
     Intervals *do* narrow with evidence when:
     - All priors in the credal set agree on the **likelihood** of the evidence.
     - Evidence is **decisive** (e.g., rules out some hypotheses completely).

  ### Practical Takeaway
  - **Use Case**: Imprecise probabilities excel when you have **genuinely incomplete knowledge** (e.g., "Is this coin fair? I have no idea how to model its bias"). They prevent overconfident conclusions.
  - **Pitfall**: They can produce "irrational"-seeming updates when evidence exposes model conflict. This is the cost of representing deep uncertainty honestly.
  - **Alternative**: Consider **robust Bayesian** methods (using a single prior but checking sensitivity) or **info-gap theory** for severe uncertainty if widening intervals are unacceptable.

  **In short**: The widening interval is a feature, not a bug, reflecting how evidence can *amplify* underlying disagreement in your set of plausible models. It forces you to confront the depth of your ignorance—which is precisely why critics call it a cop-out and advocates call it rigor. Whether it's "rational" depends on whether you prioritize avoiding false precision or guaranteeing evidence-driven convergence.
