  First, I need to break down Hobbes's argument. Maker's knowledge posits that creating something gives deeper understanding and certainty. For Hobbes, geometry is certain because we define and construct the figures. He extended this to politics, arguing that since we build commonwealths, we can know them with the same certainty. But his mathematical errors, especially with squaring the circle, show a flaw. Even though he constructed his proofs, they were wrong. The key here is the gap between constructing a model and correctly modeling reality.

  The user is less interested in the psychological aspect (Hobbes being stubborn) and more in whether there's a specific epistemic gap in the maker's knowledge framework that led to his failure. They want to apply this to software engineering: does building or formally verifying a system provide absolute certainty? Or are there hidden vulnerabilities?

  Looking at Hobbes's case, several gaps come to mind. First, the premises: if the initial definitions or axioms are flawed, the entire construction is at risk. Hobbes used faulty assumptions about geometry, leading to incorrect proofs. In software, if the specifications or requirements are wrong, even a formally verified system might not work as intended in the real world.

