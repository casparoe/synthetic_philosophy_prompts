  The structural challenge is balancing depth with readability. I'll start with Voss laying out her "ripest fruit" evidence, then have Thorne counter with the "long chain of will" passage, then escalate to how §16-18 reframe conscience as cruelty. The turning point should be their debate over whether "memory of the will" is freedom or discipline. 

