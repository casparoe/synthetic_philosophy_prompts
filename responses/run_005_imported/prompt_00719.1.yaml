  First, I need to unpack Kripke's argument clearly. The core idea hinges on modeling computation as first-order deduction: if every computational step is expressible in FOL (Hilbert's thesis), then a function is computable iff its computation traces can be formalized as FOL deductions. Gödel's completeness theorem says FOL deductions are provable, hence enumerable by a Turing machine. So computability reduces to Turing-machine enumerability.  

  The user’s sharpest concern is whether this just kicks the can down the road. Kleene’s objection would be that Hilbert’s thesis itself assumes computational steps are FOL-expressible—which is just as informal as the original CT thesis! Kripke might counter that Hilbert’s thesis is "evident" or simpler, but that’s debatable.  

