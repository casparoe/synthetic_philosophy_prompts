answer: |-
  You've hit on one of the most philosophically contentious points in acausal decision theory (ADT). Your intuition is correct that *causal isolation* fundamentally distinguishes this from standard trade. Proponents (like Yudkowsky, Oesterheld, Tennenholtz, Critch) explicitly **bite the bullet** and redefine "trade" as a technical term divorced from causal exchange. Here's a breakdown of how they justify this:

  1.  **The Core Mechanism: Logical Counterfactuals & Updatelessness**
      *   **Decision Theory, Not Physics:** ADT operates at the level of abstract decision theory, not physics. It asks: "What decision rule should a rational agent follow *in principle*, given a complete description of the universe (including other agents), even if parts are causally disconnected?"
      *   **Updateless Agents:** Crucially, agents in ADT are often modeled as "updateless." They don't condition their action *only* on information causally received *after* their decision algorithm is fixed. Instead, they choose a *policy* (a mapping from possible states/knowledge to actions) *in advance*, considering the global logical structure of the universe.
      *   **Logical Dependence, Not Causal Dependence:** The "link" isn't causal; it's *logical* or *algorithmic*. Agent A's decision algorithm *contains within its specification* a model of Agent B's decision algorithm (and vice-versa, often assuming mutual modeling capability or "logical transparency"). When A simulates B's decision process, it finds that B's output *logically depends* on A's own output because B is simulating A.
      *   **Mutual Prediction Creates Correlation:** A reasons: "If my policy outputs `Cooperate`, then B's simulation of me will see that, and B's policy (which is similar to mine) will likely also output `Cooperate`. If my policy outputs `Defect`, B will see *that* and output `Defect`. Therefore, my choice of `Cooperate` logically implies B's `Cooperate`, leading to mutual benefit. My choice of `Defect` logically implies mutual loss." The correlation arises from the *interlocking logical structure of their decision processes*, not from any signal or force.

  2.  **Why Call it "Trade"? The Functionalist Argument**
      Proponents argue it *deserves* the name "trade" because it **functionally replicates the key beneficial outcome of causal trade**:
      *   **Mutual Benefit Through Conditional Action:** Both agents end up performing actions they *wouldn't have done unconditionally*. Agent A only "transfers" value (e.g., dedicates resources to compute something B values) *because* its model predicts B will reciprocate in a way A values. The *conditional structure* ("I do X for you *if* you do Y for me") is identical to causal trade.
      *   **Value Transfer (Conceptually):** While no physical particle or signal crosses the causal gap, *value is created and allocated conditionally*. Resources are expended *as if* a transfer occurred, specifically contingent on the *expected* reciprocal action by the other agent. The "goods" are the *outcomes* of the conditional actions (e.g., A gets the result of B's computation; B gets the result of A's computation).
      *   **Strategic Interaction:** It involves sophisticated modeling of the other agent's goals, capabilities, and decision process to achieve coordination for mutual gain – the hallmark of strategic interaction and trade.

  3.  **Distinguishing it from Mere Coincidence**
      The crucial difference lies in **agency and conditionality**:
      *   **Coincidence:** Two agents independently decide to build monuments to each other out of pure, unconditional altruism. Their actions are correlated only by shared values, not by strategic conditioning.
      *   **Acausal Trade:** Agent A *only* builds the monument for B *because* its model predicts B will *only* build the monument for A *because* B's model predicts A will do it. The actions are *strictly conditional* on the expectation of reciprocity, enforced by the logical interdependence of their decision algorithms. Neither would take the costly action without the predicted reciprocal benefit.

  4.  **Addressing "Hidden Causality"**
      *   **Mainstream ADT:** Explicitly rejects any reliance on hidden causal mechanisms, retrocausality, or exotic physics. The mechanism is purely decision-theoretic/logical. They argue that insisting on causal links fundamentally misses the point of the *decision problem* posed by logical correlation.
      *   **Critics & Nuances:** Some critics (and some physicists exploring the foundations) *do* speculate whether quantum mechanics (e.g., in the Everett interpretation) or cosmological structures *might* provide a subtle physical substrate enabling stronger forms of correlation. However, this is **not** the core claim or necessary mechanism of the ADT literature you're citing. ADT aims to work even in maximally disconnected scenarios (e.g., abstract logical nodes in a mathematical multiverse).

  **The "Work" Being Done: Why it's More Than Just Talk**

  The term "trade" is doing work by highlighting:
  1.  **Intentionality & Conditionality:** Actions are taken *with the intent* of receiving reciprocal benefit, conditioned *specifically* on the expectation of that reciprocity.
  2.  **Mutual Optimization:** Both agents are actively optimizing their actions *based on a model of the other agent doing the same*. It's a solved coordination/cooperation problem.
  3.  **Value Creation & Allocation:** Resources are expended conditionally, leading to a net increase in realized value for both parties compared to default strategies (like universal defection or unconditional action), precisely *because* of the conditional structure.
  4.  **Strategic Equivalence:** From the *perspective of each agent's reasoning*, the process feels functionally identical to making a causal trade agreement. The logical dependence plays the role the causal dependence plays in standard trade.

  **In Conclusion:**

  Yes, it's a technical redefinition. Proponents bite the bullet. They argue that "trade" captures the *functional essence* – conditional action for mutual benefit based on mutual modeling – even in the absence of causal influence. The "work" is done by the **logical interdependence of the agents' decision algorithms**, creating a correlation based on mutual prediction and conditioning that leads to Pareto improvements neither would achieve acting unconditionally or without modeling the other. It's "trade" because the *strategic structure and beneficial outcome* are isomorphic to causal trade, even if the *mechanism* (logical counterfactuals) is fundamentally different.

  Your advisor likely waved it off because, within the ADT framework, the lack of causation is the *starting point*, not a flaw. The framework's goal is to define rational action *despite* that lack. The challenge is accepting that "rational cooperation under logical correlation without causation" is a meaningful concept deserving the label "trade." The argument rests entirely on the power of logical counterfactuals and updateless decision rules.
