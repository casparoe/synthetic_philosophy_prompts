prompt: |-
  Been lurking on rationalist-adjacent blogs/forums for like a decade now and this argument happened at my LW meetup reading group last week and it's been living in my head since. Someone had linked Scott Alexander's "My Left Kidney" post (the one about non-directed kidney donation to a stranger) and it turned into a whole thing between two people, Marcus and Ines, about whether donating a kidney to a stranger is supererogatory or actually obligatory. Trying to reconstruct it fairly:

  1. Marcus: if the expected-value math in that post is even roughly right (small risk to you, years of healthy life for a stranger), then not donating isn't just "failing to go above and beyond" — its straightforwardly wrong, same logic as Singer's drowning child. "Supererogatory" is just a label we invented so we don't have to feel bad about not doing the math.

  2. Ines: says thats too fast. Morality has to leave some agent-centered slack — your own body and risk tolerance have to count for something in your own decisions, or the demands of morality become limitless and eat themselves. If Marcus is right about kidney #1, the same argument runs on kidney #2, bone marrow, a liver lobe, eventually all of it, which is absurd, so something upstream in his reasoning has to give before we get there.

  3. Marcus: ok, but then where's the principled stopping point? Nobody's ever given a non-arbitrary line between "drowning child case, everyone agrees you must act" and "donate all your spare organs, nobody thinks that." A continuum with no defensible cutoff is evidence there's no real obligatory/supererogatory distinction, just vibes dressed up as a category.

  4. Ines: no sharp line doesn't kill the distinction — plenty of real categories are vague at the edges (bald vs. not-bald) without the difference between clear cases being fake. Marcus is basically running a sorites argument, and sorites arguments don't actually prove nobody's bald.

  5. Marcus: fine, granting that — but then she owes an actual answer for the kidney case specifically, since by Scott's numbers it isn't a borderline case, and she's using "vagueness in general" to dodge doing the math on this particular one.

  6. Ines: the math already smuggles in the thing in dispute — that a stranger's marginal welfare and your own bodily risk convert at some fixed exchange rate. Whether they do is exactly the agent-relative-vs-impartial question they're arguing about, so leaning on "just run the numbers" here is question-begging.

  They both dug in and it fizzled out unresolved. Can you go through this round by round and say who's got the better of it at each step (not just an overall winner), and flag anything about supererogation as a concept that you think both of them are missing which would've moved the conversation forward?
reasoning: |-
  Okay, the user has presented a detailed reconstruction of an ethical debate between Marcus and Ines regarding kidney donation and supererogation. This seems to be a continuation of a longstanding philosophical discussion they encountered in rationalist circles. 

  First, I need to unpack the core tension here: Marcus takes a strictly consequentialist view where moral obligations extend to all high-impact/low-cost actions (à la Peter Singer), while Ines defends agent-centered prerogatives that limit moral demands. The kidney donation case serves as a perfect testbed because it sits in that uncomfortable middle ground between obvious duty (like saving a drowning child) and extreme sacrifice (donating all organs).

  Hmm... what's interesting is how both debaters are wrestling with boundary problems. Marcus correctly points out that vague thresholds don't invalidate clear cases (like Scott Alexander's kidney math), while Ines highlights how collapsing the supererogatory/obligatory distinction could lead to absurd demands. Neither seems to address that morality might operate with multiple parameters - not just cost/benefit ratios but also relational proximity, psychological sustainability, and systemic effects.

  The user specifically wants round-by-round analysis rather than just a verdict. For each exchange, I should note whose argument has stronger logical footing while pointing out unexamined assumptions. In Round 1, Marcus is technically correct about the math but ignores psychological/embodied factors. Ines's slippery slope argument in Round 2 is rhetor effective but philosophically weak - we reject similar arguments against Singer's shallow pond case. 

  Ah, Round 3 is where it gets juicy. Marcus's demand for a "principled stopping point" exposes a real weakness in common morality, but Ines's baldness analogy in Round 4 is clever - vagueness doesn't negate categories. Still, she's dodging his challenge about kidney donation specifically. By Round 6, they're talking past each other: Marcus assumes welfare is commensurable across persons, while Ines denies this is self-evident. 

  What's missing? Both overlook how supererogation functions socially - as a release valve for moral systems that would otherwise collapse under their own demands. Also, neither considers institutional solutions (like opt-out organ donation) that could resolve the tension. The user might appreciate these angles since they're familiar with rationalist discourse where systemic fixes are often favored over individual ethics debates.
answer: |-
  Here's a round-by-round analysis of the Marcus vs. Ines debate, highlighting strengths, weaknesses, and missed nuances:

  **Round 1: Marcus' Initial Claim**  
  *Marcus:* "If the math holds, not donating is *wrong*, not merely non-heroic. 'Supererogatory' is a cop-out."  
  **Strengths:**  
  - Correctly applies consistent consequentialist logic (Singer's drowning child → kidney donation).  
  - Forces confrontation with uncomfortable implications of impartial welfarism.  
  **Weaknesses:**  
  - Overlooks *qualitative* differences between wading into a pond (low bodily intrusion) and elective surgery (significant bodily violation/risk).  
  - Assumes "expected-value math" is morally decisive without justifying *why* it should override other values.  
  **Better of the Round:** **Marcus** (for exposing inconsistency in common moral intuitions).  

  **Round 2: Ines' Agent-Centered Reply**  
  *Ines:* "Morality needs agent-centered slack. Marcus' logic leads to absurdity (donate everything)."  
  **Strengths:**  
  - Identifies a genuine problem: unlimited moral demands ("demandingness objection").  
  - Correctly notes Marcus' argument *scales* (kidney → liver lobe → more).  
  **Weaknesses:**  
  - Uses a slippery slope without showing the slope is *inevitable* (could have stopping points).  
  - Doesn't explain *why* bodily integrity/risk tolerance *should* grant moral slack.  
  **Better of the Round:** **Ines** (for highlighting a critical flaw in strict impartialism).  

  **Round 3: Marcus Demands a Principled Line**  
  *Marcus:* "No non-arbitrary cutoff? Then obligatory/supererogatory is a false distinction."  
  **Strengths:**  
  - Exposes vagueness in common moral categories.  
  - Challenges Ines to defend *where* the line is for *this specific case* (kidney).  
  **Weaknesses:**  
  - Implies vagueness invalidates categories (but many real-world concepts are vague).  
  - Overlooks that *multiple factors* (risk, sacrifice, benefit) interact, making a single "line" unrealistic.  
  **Better of the Round:** **Draw** (Marcus scores on inconsistency, but overplays "vagueness = fake").  

  **Round 4: Ines' Vagueness Defense**  
  *Ines:* "Vagueness doesn't kill categories (baldness). This is a sorites fallacy."  
  **Strengths:**  
  - Correctly diagnoses Marcus' reasoning as a sorites paradox.  
  - Defends the coherence of "obligatory vs. supererogatory" despite borderline cases.  
  **Weaknesses:**  
  - Doesn't engage Marcus' core challenge: **why the kidney case specifically falls on the "supererogatory" side** despite favorable math.  
  **Better of the Round:** **Ines** (successfully rebuts Marcus' strongest objection).  

  **Round 5: Marcus Presses on the Kidney Case**  
  *Marcus:* "Granted, vagueness exists—but kidney donation *isn't* borderline by the numbers. Do the math!"  
  **Strengths:**  
  - Forces focus on the concrete case, preventing abstraction.  
  - Highlights that Ines hasn't addressed the *specific cost/benefit ratio* of kidney donation.  
  **Weaknesses:**  
  - Assumes impartial welfare calculus is *the* correct moral framework (begs the question).  
  **Better of the Round:** **Marcus** (Ines hasn't explained why kidney donation isn't obligatory *given the numbers*).  

  **Round 6: Ines' Meta-Argument**  
  *Ines:* "The math *presupposes* impartialism. We're arguing about whether that framework is correct."  
  **Strengths:**  
  - Identifies the core disagreement: **Is morality fundamentally agent-neutral or agent-relative?**  
  - Correctly notes Marcus' "do the math" assumes the very premise Ines rejects.  
  **Weaknesses:**  
  - Risks stalemate by framing the debate as foundational.  
  - Still doesn't offer a *positive reason* why bodily integrity outweighs the stranger's need in *this* case.  
  **Better of the Round:** **Ines** (exposes Marcus' circularity).  

  **Overall Stalemate:**  
  - **Marcus** wins on *internal consistency* of impartial consequentialism.  
  - **Ines** wins on *exposing the demandingness problem* and questioning the framework.  
  - **No clear victor**—they hit bedrock disagreement about moral foundations.  

  ---

  **Key Nuances Both Missed (That Could Have Moved the Debate Forward):**  
  1. **Scalar vs. Threshold Views of Supererogation:**  
     - Supererogation isn't just "less obligation." It's acts that are *genuinely optional* because they exceed what can be *demanded* of an agent. Bodily integrity and risk tolerance might set the threshold for demandability, even if welfare gains are high.  
     - *Example:* We don't *demand* people run into burning buildings, even if expected utility is positive—because the risk/sacrifice exceeds what morality can *require*.  

  2. **The Role of Institutions & Fairness:**  
     - Individual donations aren't the only solution. A *system* of opt-out organ donation or compensated donation could achieve greater good with less burden. Marcus' argument might obligate *system reform*, not individual sacrifice.  
     - *Example:* If everyone donated kidneys, need would plummet—so demanding individual action ignores collective action problems.  

  3. **Psychological & Social Realities:**  
     - Morality that ignores human psychology (e.g., risk aversion, bodily autonomy) is self-defeating. A "demanding" morality that people reject *in practice* may save fewer kidneys than one with "slack."  
     - *Example:* Promoting supererogation as praiseworthy may inspire more donations than framing it as obligatory (which causes resentment/avoidance).  

  4. **Rights-Based Stopping Points:**  
     - Bodily rights (e.g., self-ownership) create *agent-relative permissions* not to sacrifice, even for greater good. This blocks the slippery slope: you can’t be obliged to surrender *essential* bodily functions (liver lobe regenerates; second kidney doesn’t).  
     - *Example:* Donating a kidney (non-essential) may be supererogatory; donating your heart (essential) cannot be obligatory.  

  5. **Contextual Factors:**  
     - Risk/benefit isn't static. A surgeon donating in a high-mortality hospital vs. a healthy 20-year-old donating to a 70-year-old changes the math. "Obligation" may depend on context.  

  ---

  **Conclusion:**  
  - **Marcus** is stronger if you accept impartial consequentialism as the sole moral framework.  
  - **Ines** is stronger if you believe morality must account for personal integrity and reasonable limits.  
  - **Resolution requires engaging deeper questions**: What gives morality its *authority*? When do *personal costs* exempt one from impartial demands? Framing kidney donation as "supererogatory" isn't evasion—it’s a recognition that ethics must balance the *value of the agent* against the *value of outcomes*. The debate stalled because they needed to argue meta-ethics, not just this case.
