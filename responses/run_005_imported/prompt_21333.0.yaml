answer: |-
  You've pinpointed a profound and persistent tension between ethical philosophy and economic practice regarding discounting. The philosophical consensus against pure time preference (PTP) *is* remarkably strong, yet the economic debate remains heated. Here's why this disconnect exists and why economists like Nordhaus aren't *simply* committing an elementary error:

  1.  **The Normative vs. Positive Divide:**
      *   **Philosophers (Sidgwick, Parfit, Ramsey):** Focus on *normative ethics* – what *ought* to be. They argue that PTP is ethically indefensible from an impartial, universalist standpoint. Future well-being matters just as much as present well-being, *ceteris paribus*.
      *   **Economists (especially in policy modeling):** Often operate in a *positive* or *descriptive/prescriptive* space. They argue that observed market behavior (e.g., interest rates, savings rates) *reveals* that individuals and societies *do* exhibit significant time preference. To ignore this reality in large-scale policy models (like climate IAMs) would be to impose an ethical ideal detached from how people actually behave and make intertemporal trade-offs. Nordhaus argues for a discount rate derived from observed market returns, reflecting this "revealed preference."

  2.  **Uncertainty and Catastrophic Risk:**
      *   While philosophers reject PTP, they acknowledge powerful reasons for discounting related to *uncertainty*. The further into the future, the greater the uncertainty about:
          *   **Existence:** Will the beneficiaries even exist? (Relevant for very long time horizons).
          *   **Preferences:** Will future generations value things the same way?
          *   **Technology/Economy:** What will the state of technology and wealth be?
          *   **Catastrophic Risk:** The possibility of civilizational collapse or human extinction makes future benefits less certain.
      *   Economists argue that even a very low *pure* discount rate must be augmented significantly by a *risk premium* to account for this profound uncertainty. A discount rate incorporating this uncertainty *looks like* a higher discount rate, even if the pure ethical component is zero. Critics of Stern argued his uncertainty adjustments were insufficient.

  3.  **The Opportunity Cost Argument:**
      *   Economists emphasize *opportunity cost*. Money invested today (e.g., in decarbonization) could instead be invested elsewhere, earning a return (r). That return represents the growth in wealth and consumption potential. If r is positive, $1 invested today grows to $(1+r)^t in t years. Therefore, to justify spending $1 today to prevent $X of damage in year t, we need X >= (1+r)^t. This implies discounting future damages *at rate r*.
      *   Nordhaus and others argue that r (the "social opportunity cost of capital") is observable in markets and historically significant (e.g., 4-6%+). Using a near-zero rate like Stern (effectively ~1.4%) implies forgoing massive potential future wealth, which could be used to solve *many* future problems, including adapting to climate change or funding other welfare-enhancing projects. This is a consequentialist argument based on maximizing potential future welfare, not an endorsement of PTP.

  4.  **Model Dependence and Practicality:**
      *   Integrated Assessment Models (IAMs) used for climate policy are incredibly sensitive to the discount rate. A near-zero rate makes almost *any* cost incurred today to prevent distant future damage seem justified. Critics argue this leads to implausibly high optimal carbon taxes and near-total immediate decarbonization, potentially imposing large near-term economic costs that might hinder other welfare-improving investments or cause political backlash.
      *   Economists argue that using a rate reflecting observed behavior and opportunity costs produces more politically feasible and economically coherent results, even if imperfect from a strict ethical perspective. They see Stern's rate as an ethical choice detached from economic reality.

  5.  **Intergenerational Equity vs. Efficiency:**
      *   The debate often boils down to a trade-off:
          *   **Low/Near-Zero Rate (Stern):** Prioritizes *intergenerational equity* – future generations have a strong claim on our resources to prevent harm we cause. Maximizes the weight given to very long-term impacts.
          *   **Higher Rate (Nordhaus):** Prioritizes *efficiency* – using resources where they yield the highest return (including growth), arguing this maximizes the total consumption "pie" available to *all* generations over time. Assumes richer future generations will be better equipped to handle problems.

  **Why Nordhaus et al. Aren't *Simply* Committing an Error:**

  Nordhaus and similar critics are generally *aware* of the philosophical arguments against PTP. Their position isn't based on defending PTP *as ethically valid*. Instead, it rests on:

  1.  **Empirical Observation:** People demonstrably discount the future in their behavior.
  2.  **Opportunity Cost:** Capital has a positive return; sacrificing that return has real welfare consequences.
  3.  **Uncertainty Adjustment:** Future costs/benefits are highly uncertain and need significant risk-based discounting.
  4.  **Model Pragmatism:** Models using "revealed preference" rates produce results more aligned with observable economic behavior and political feasibility.
  5.  **Consequentialism:** Maximizing total consumption potential over the very long run *might* require prioritizing near-term growth, even for dealing with long-term problems like climate change.

  **Conclusion & Your Core Insight:**

  You are fundamentally correct: **The *ethical* argument against pure time preference is decisive.** From a strict impartial spectator perspective, there is no justification for valuing well-being less simply because it occurs later in time.

  However, the persistence of the economic controversy stems from:

  1.  **Confounding Factors:** Uncertainty and risk are immense and necessitate discounting that *looks like* time preference.
  2.  **Positive Economics:** Economists modeling real-world systems feel compelled to incorporate observed behavior (revealed time preference) and opportunity costs.
  3.  **Practical Policymaking:** The implications of a near-zero rate in complex models are enormous and raise concerns about feasibility, efficiency, and potentially neglecting near-term welfare.

  **Therefore:** While economics *should* internalize the philosophical rejection of PTP more deeply, the "live controversy" isn't *just* about PTP. It's about:
  *   **The Magnitude of the Risk Premium/Uncertainty Adjustment:** How much discounting is justified *solely* due to uncertainty about the distant future?
  *   **The Appropriate Social Opportunity Cost of Capital:** What is the right "r" to use for public investment, especially for projects with benefits centuries away?
  *   **Intergenerational Weighting:** How *should* society balance the welfare of current vs. distant future generations, given uncertainty and opportunity costs, even after rejecting PTP?

  **Your intuition is strong:** For truly existential, potentially irreversible risks (like catastrophic climate change or biorisks) where the uncertainty is about *survival* itself, the ethical imperative combined with the stakes pushes strongly towards a discount rate *effectively near zero* in practical decision-making. Continued resistance *does* partly reflect economics lagging philosophy, but it also reflects genuine, complex disagreements about modeling uncertainty, opportunity cost, and the practical translation of deep ethics into policy for an uncertain world. The debate isn't settled because the translation from "ought" to "operational model parameter" under radical uncertainty is incredibly difficult.
