answer: |-
  That's a fantastic question, and it highlights a crucial point about Peter Singer's "drowning child" example that often gets misunderstood! As a biologist used to empirical data, your instinct to look for the experiment is spot on, but the answer is:

  **Peter Singer's "drowning child" was *not* an empirical experiment. It was a philosophical *thought experiment* designed to expose a moral inconsistency in our reasoning.**

  Here's the breakdown:

  1.  **No Data Exists:** Singer did not conduct or cite any specific study where people walked past an actual drowning child. He invented the scenario purely as a hypothetical tool to challenge our intuitions about proximity, obligation, and sacrifice.
  2.  **Purpose:** The power of the example lies in its *intuitive plausibility*. Singer argued that *any reasonable person* would agree that:
      *   If you saw a child drowning in a shallow pond right in front of you.
      *   And you could easily save them (e.g., wading in).
      *   And the only cost was ruining your clothes or shoes...
      *   ...then you have a *strong moral obligation* to save the child. Failing to do so would be monstrous.
  3.  **The Philosophical Point:** Singer then argues that children dying from poverty and preventable diseases in distant countries are *morally equivalent* to the drowning child. The physical distance, the fact that they are one of many, and that we don't see them directly *should not* absolve us of the obligation to help when we can do so at relatively little cost (e.g., donating a significant portion of our income to effective charities).

  **Why the Confusion?**

  *   Singer's scenario is *so vivid* and psychologically compelling that it *feels* like it could be based on real events or experiments.
  *   It taps into real psychological phenomena like the "bystander effect" and the "identifiable victim effect," which *have* been studied empirically. This creates an association.

  **Relevant Empirical Research (The Spirit, If Not the Letter):**

  While Singer's pond wasn't real, researchers *have* studied related phenomena that illuminate aspects of his argument:

  1.  **The Bystander Effect (Darley & Latané, 1968):** This famous (and controversial, regarding replication) series of experiments showed that individuals are *less* likely to help a victim (e.g., someone having a seizure) when other bystanders are present. This relates to Singer's point about diffusion of responsibility, but it's about *other witnesses*, not physical distance *per se*. Replication has been mixed; the effect is real but its strength and universality are debated.
  2.  **Physical Proximity & Helping:** Studies generally show people are more likely to help someone physically close to them than someone far away. This directly supports Singer's point about our bias towards proximity. (e.g., Piliavin, Rodin, & Piliavin, 1969 - "Subway Samaritan" study).
  3.  **The Identifiable Victim Effect:** People are dramatically more motivated to help a single, specific, identifiable victim (like the drowning child) than a large group of anonymous victims (like starving children in a famine), even when the statistical need is greater in the latter group. This is *central* to Singer's critique. Numerous studies confirm this powerful cognitive bias (e.g., Small & Loewenstein, 2003; Kogut & Ritov, 2005).
  4.  **Cost of Helping:** Research consistently shows that willingness to help decreases as the perceived cost (monetary, time, effort, risk) increases. Singer's argument hinges on the *relative smallness* of the cost (ruined clothes vs. a life) compared to the benefit.
  5.  **Effective Altruism Research:** While not testing the pond scenario directly, the modern Effective Altruism movement (heavily influenced by Singer) rigorously studies *how* to help distant strangers most effectively per dollar donated. This provides empirical grounding for the *second half* of Singer's argument: that we *can* effectively save lives at a distance.

  **So, Did Singer's Argument "Hold Up"?**

  *   **Philosophically:** Singer's argument remains one of the most powerful and influential in modern ethics. It forces a confrontation with our moral intuitions and biases. Whether one ultimately *accepts* his radical conclusion (that we must give until the marginal utility of our money equals that of saving a life) is debated, but the *logical inconsistency* he exposes is widely acknowledged as significant.
  *   **Empirically (Supporting the Underlying Biases):** The empirical research *strongly supports* the existence of the psychological biases Singer leverages: we *are* biased towards proximity, identifiable victims, and low-cost helping. We *do* discount distant suffering and statistical lives. This makes Singer's point about the irrationality of letting geography dictate moral obligation *empirically plausible*.
  *   **Empirically (Testing the Obligation):** You can't directly "replicate" the moral conclusion in a lab. However, surveys and behavioral economics experiments often find that when presented with Singer's argument, many people feel compelled to agree with the logic, even if they struggle to act on it fully. Research on donation behavior also shows that framing donations in ways that make distant victims more "identifiable" or reduce perceived barriers increases giving.

  **In Conclusion:**

  As a scientist, your search for the data is perfectly understandable! But Singer's drowning child is a philosophical scalpel, not a dataset. Its power comes from forcing us to confront the inconsistency between our intuitive, visceral reaction to the nearby child and our often passive response to distant suffering. While no one walked past *that* pond for data collection, decades of psychology confirm the biases that make his argument so unsettlingly relevant. The lack of an original experiment doesn't weaken the argument; it highlights how effectively the *thought experiment* uses our own deeply held intuitions against us to reveal a potential moral blind spot.
