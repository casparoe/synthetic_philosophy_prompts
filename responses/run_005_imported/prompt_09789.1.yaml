answer: |-
  That's a fantastic find and a brilliant connection to make! You've hit on a fascinating historical and conceptual tension surrounding "supererogation." Let's unpack both sides and see how they relate (and conflict).

  **1. Deconstructing Article XIV's Argument Against Supererogation:**

  The Article is a classic expression of **Protestant Reformation theology**, specifically reacting against certain **Roman Catholic practices** (like the medieval concept of the "Treasury of Merit" and the sale of indulgences). Here's the core of their argument:

  *   **Theological Foundation:** Humans are fundamentally sinful and incapable of earning salvation through their own works. Salvation comes solely through God's grace, received by faith (Sola Gratia, Sola Fide).
  *   **The Problem with "Extra Works":** Claiming to perform "voluntary works... over and above God's Commandments" implies several problematic things:
      *   **Arrogancy (Hubris):** It suggests a human can *exceed* the perfect standard God requires. It implies a level of personal righteousness or capacity for good that the Article denies humans possess ("We be unprofitable servants" even after doing *all* commanded). Claiming to do *more* than God demands is seen as presumptuous pride, placing oneself above the divine standard.
      *   **Impiety:** It potentially undermines the sufficiency of Christ's sacrifice. If humans can generate "extra" merit through supererogatory works, it suggests Christ's work wasn't *fully* sufficient to cover human sin and obligation. It shifts focus from reliance on God's grace to reliance on human achievement.
      *   **Misunderstanding Duty:** The Article implies that God's commandments *define* the full extent of human moral obligation ("bounden duty"). The idea that one could go "beyond" this divinely prescribed duty is conceptually incoherent from this perspective. Duty is defined by God's will; there is no "beyond" His will.
      *   **The "Unprofitable Servant" Quote (Luke 17:10):** This is the knockout punch. Jesus states that even when a servant has done *everything commanded*, they should still say, "We are unworthy servants; we have only done what was our duty." This explicitly rejects the notion that humans can place God in their debt or do *more* than what satisfies their fundamental obligation. Our best efforts merely meet the baseline requirement; they don't generate surplus credit.

  **In essence:** The Article argues that the *concept* of supererogation is theologically dangerous because it fosters human pride, undermines divine grace, misunderstands the nature of duty as defined by God, and contradicts Jesus's own teaching about human standing before God. It's not just wrong; it's "arrogant and impious."

  **2. Modern Philosophical Supererogation (Your Friend's Concept):**

  This concept, revitalized in the mid-20th century largely by philosophers like J.O. Urmson, is **secular and action-focused**, divorced from salvation theology. Key features:

  *   **Definition:** Actions that are:
      *   **Morally Good/Praiseworthy:** They are clearly good things to do.
      *   **Not Obligatory:** You are *not* morally blameworthy or failing in your duty if you *don't* do them.
      *   **"Above and Beyond":** They involve significant personal sacrifice, risk, or effort that goes far beyond what morality *demands* of anyone.
  *   **Examples:** Donating a kidney to a stranger, diving into icy water to save someone at great personal risk, whistleblowing knowing it will destroy your career and livelihood, extreme acts of charity or heroism.
  *   **Purpose:** Philosophers use it to capture a real intuition: that morality isn't just about avoiding blame (duties) or doing the minimum, but also about recognizing extraordinary goodness that exceeds requirements. It adds nuance to moral categories.

  **3. The Connection and Conflict: Repurposing and Resurfacing Worries**

  *   **Repurposing the Word:** Yes, the *word* "supererogation" was absolutely repurposed. Modern philosophers borrowed the *term* from theological discourse precisely because it captured the idea of "going beyond duty." However, they stripped it of its theological baggage (salvation, merit before God, the sufficiency of grace) and applied it purely to secular moral evaluations of actions and agents. The *concept* of "beyond duty" existed, but the specific *term* came from theology.
  *   **The Resurfacing Worry (The Secular Shadow of the Theological Critique):** This is the really interesting part. While modern philosophers reject the *theological* basis of the Article's condemnation, **the *structural* worry about the coherence of "beyond duty" absolutely persists in secular debates.** Here's how the old worry shows up in disguise:
      *   **The "No Beyond Duty" Argument (The Article's Ghost):** Some secular philosophers (e.g., some Utilitarians, or proponents of "extreme demandingness") argue that **if an action is genuinely the *best* thing to do (maximizes good, prevents great harm), how can it *not* be your duty?** If donating a kidney saves a life at manageable risk to you, isn't it *actually obligatory*? This mirrors the Article's view that God's commandments define the *full* extent of duty – secular versions argue that morality's demands are actually very extensive, leaving little or no room for true "supererogation." Doing the best thing *is* the duty. Claiming otherwise might be seen as a form of moral laxity or an attempt to lower the demandingness of morality (a kind of secular "impiety" against the demands of the good).
      *   **The "Undermining Duty" Worry:** Could celebrating the "supererogatory" subtly lower the perceived importance of fulfilling basic duties? If whistleblowing is "heroic and beyond duty," does that imply that *not* whistleblowing in egregious cases is acceptable, rather than a failure of duty? The Article worried supererogation undermined grace; secular critics worry it might undermine the stringency of core obligations.
      *   **The "Problem of Justification":** If supererogatory acts are optional, *why* are they optional? What justifies *allowing* someone *not* to perform an action that is clearly morally excellent and would produce significant good? This is a core puzzle in supererogation theory. The Article had God's grace as the answer (you *can't* earn extra merit); secular philosophy needs other answers (e.g., personal autonomy, reasonable demandingness, agent-centered prerogatives).

  **Conclusion:**

  You're spot on. The Thirty-Nine Articles condemn theological supererogation as arrogant and impious because it clashes with core Protestant doctrines of human sinfulness, divine grace, and the sufficiency of Christ's work. The *word* was later repurposed by secular philosophers to describe a distinct category of morally praiseworthy but non-obligatory action.

  **Crucially, the *conceptual* challenge posed by the Articles – the question of whether it even *makes sense* to claim one can do "more than duty" – did not disappear.** It re-emerged as a central debate *within* secular moral philosophy. While most philosophers accept that supererogation *is* a real and important category (thanks to thinkers like Urmson, Heyd, and Chisholm), justifying its existence and defining its boundaries against the ever-present pressure of demanding moral theories that see the "best action" as *always* obligatory remains a live and complex issue. The ghost of Article XIV lives on in these modern arguments about the true extent of moral obligation. Your friend is advocating for recognizing a distinct category of praiseworthiness, while the Articles (and their secular echoes) question whether that category can coherently exist *outside* of duty. It's a deep and enduring philosophical puzzle.
