  ```
reasoning: |-
  We are ranking the following accounts by how successfully they solve the value problem of knowledge over true belief:

  1. Simple process reliabilism (Goldman): Knowledge is true belief produced by a reliable cognitive process. But if the process is reliable, then it gets you to the truth as well as knowledge, so why is knowing more valuable than merely having a true belief? This seems to restate the problem.

  2. Safety-based accounts (Sosa/Pritchard): Knowledge is true belief that is safe (i.e., in nearby possible worlds, the belief is true). But again, if safety ensures the truth in the actual and nearby worlds, then it's not clear why it adds value over a true belief that happens to be safe by accident? The value problem remains.

  3. Sensitivity/tracking accounts (Nozick): Knowledge is true belief that tracks the truth (i.e., if p were false, you wouldn't believe it). However, a true belief that is sensitive might still not seem more valuable than a true belief that isn't, if both get you to Larissa. Moreover, sensitivity has been criticized for not being necessary for knowledge (e.g., in lottery cases).

  4. Virtue-theoretic "credit" accounts (Greco/Zagzebski/Riggs): Knowledge is true belief that arises from intellectual virtues, so the believer deserves credit. This adds a normative element: the agent is praiseworthy. This might solve the value problem by adding an element of achievement.

  5. Kvanvig's claim that understanding, not knowledge, is the state we should really value: This sidesteps the problem for knowledge by saying that what we value is understanding, which is a different state. But the question is about knowledge, so this doesn't solve the problem for knowledge.

  6. Socrates' answer: Knowledge is true belief tied down by an account (grasping the reason why). This is often taken as the first stab at justification. It adds an explanatory element. Having the reason why might be more valuable because it provides stability and the ability to apply it in new situations.

  Ranking:

  We are to rank in S (best) to D (worst) with S being the most successful and D being the least.

  Criteria: We want solutions that actually explain the added value of knowledge over true belief, not restating or sidestepping.

