  I should clarify that the Dutch Book argument is normative. It's about what a rational agent should do to avoid being exploited due to their own inconsistencies. The vig is a separate issue—it's a transaction cost. Even coherent bettors pay the vig, but they aren't vulnerable to the kind of exploitation that comes from internal inconsistencies.

  The user's deeper need might be understanding why coherence matters in a world where bookies always profit. They might be skeptical about the practicality of rationality arguments. So, emphasizing that coherence is about avoiding additional, unnecessary losses beyond the vig could help. It's like making sure you're not making it worse for yourself beyond the house's built-in advantage.

  Also, addressing the difference between a guaranteed loss (Dutch Book) versus an expected loss (vig) is key. The vig means the house expects to win over time, but a Dutch Book means the bettor loses no matter what. That's a stronger condition. The user might not have distinguished these two types of losses clearly.

