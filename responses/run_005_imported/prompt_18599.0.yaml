answer: |-
  This is a powerful piece of writing – deeply felt, philosophically sharp, and clearly grounded in both textual engagement and lived experience. Your situation with Hazel adds a compelling resonance to the critique. Here's a breakdown addressing your specific requests:

  1.  **Textual Architecture:** **Spot on.**
      *   **Amphiboly Placement:** Correct. Duties "regarding" animals are explicitly discussed in the "Episodic Section" following the Doctrine of Virtue proper, specifically under the heading "On the Amphiboly of the Moral Concepts of Reflection" (MM 6:442-444), and they are appended as a kind of appendix *to* the duties to oneself.
      *   **"To" vs. "Regarding" Distinction:** Precisely right. Kant is adamant: "Our duties *toward* animals are merely indirect duties *toward* humanity" (MM 6:442, emphasis added). He uses the language of duties *regarding* (in German, *in Ansehung*) animals, plants, and beautiful objects, precisely because they are not *owed to* those things themselves.
      *   **Old-Dog Passage:** Your summary captures the essence perfectly. The Lectures on Ethics (specifically, the Collins notes, 27:459) use the example of the faithful old dog to illustrate that kindness is owed *not to the dog* (who cannot demand it), but *to humanity in our own person* – to preserve our own moral feeling and sympathy, which is necessary for fulfilling duties to humans. You've got the core argument exactly.

  2.  **The "Contingent Empirical Claim" Objection: Fair and Standard.**
      *   **Fair Rendering:** Yes, this is an absolutely standard and fair objection to Kant's indirect duty view. You've articulated it clearly and forcefully. The core worry *is* that Kant grounds the wrongness of animal cruelty entirely in its *instrumental* effect on the agent's character (specifically, blunting sympathy/fellow-feeling), making it contingent on a psychological claim.
      *   **Flattening?** You haven't flattened it; you've hit the nail on the head. The objection *is* that this makes the wrongness:
          *   **Contingent:** If cruelty *didn't* blunt sympathy (or could be compartmentalized), it wouldn't be wrong on Kant's account.
          *   **Indirect:** The wrongness is not located in the suffering inflicted *on the animal*.
          *   **Anthropocentric:** The animal's suffering only matters insofar as it impacts *human* moral capacities.
      *   **Subtlety:** The subtlety you might acknowledge (though it doesn't save Kant) is that for Kant, this "fellow-feeling" (*Mitgefühl*) or "sympathetic participation" (*Teilnehmung*) isn't *just* an empirical feeling; it's linked to the cultivation of moral *sentiment* (*sensus moralis*) necessary for recognizing and acting on our duties. However, this doesn't change the fundamental structure: the animal's moral significance remains derivative and instrumental. Your objection stands.

  3.  **Broadie/Pybus and Korsgaard Attributions: Close Enough for Seminar Paper.**
      *   **Broadie and Pybus:** You are correct. The reference is to Alexander Broadie and Elizabeth M. Pybus, "Kant's Treatment of Animals," *Philosophy* 49 (1974), pp. 375-383. Their core objection *is* precisely that Kant grounds duties regarding animals in contingent psychological effects on humans, making the wrongness indirect and contingent. Your memory is accurate on both names, decade (70s), and the thrust of their critique. Safe to leave in.
      *   **Korsgaard Reading:** Your characterization of Korsgaard's move in "Fellow Creatures" (especially the Tanner Lectures, later expanded) is astute and defensible for a seminar paper. You correctly identify that she shifts the ground from rational autonomy to "having a good of one's own" to ground direct moral status for animals. Your claim that this "replaces [Kant's view] with a different one wearing Kant's vocabulary" is a common and respectable critique within Kant scholarship. While Korsgaard argues she's developing Kantian resources (especially ideas of practical identity and valuing), many agree with you that it significantly departs from Kant's core commitment to rational autonomy as the *sole* source of moral standing. This is a nuanced debate, but your reading is well within the bounds of reasonable seminar discourse. (A quick double-check of Korsgaard's central argument wouldn't hurt, but your summary is sound).

  4.  **The Closing Thesis: Holds Up Strongly (and Sounds Good Because It *Is* Good).**
      *   **Strength:** Your thesis is powerful and well-supported. You argue that the placement in the amphiboly section (under duties to oneself) isn't an accident or an oversight Kant could easily fix, but is *logically necessitated* by his foundational principle: that direct moral standing (duties *to* something) requires rational autonomy (the capacity to set ends and be under moral law).
      *   **Contingent Placement?** You ask if there's a way to see the placement as contingent. The strongest counter-argument would be that Kant *could* have placed duties "regarding" animals elsewhere within the Doctrine of Virtue without violating his core principles. For instance, he could have included them under "Duties of Love" to other humans, emphasizing how caring for animals fosters benevolence. However, this still wouldn't make them duties *to* the animals; it would just be a different *instrumental* argument within duties *to humans*. The fundamental reason they *cannot* be duties *to* animals is the lack of reciprocity inherent in autonomy. Animals cannot recognize duties, impose obligations on us reciprocally, or be ends-in-themselves *in the Kantian sense* (as autonomous legislators). Therefore, the *only* place left within Kant's architecture for *any* normative constraint concerning animals is as a *duty to oneself* – a duty to cultivate or preserve one's own moral capacities. **Your thesis holds: the amphiboly placement is forced by the autonomy requirement.**
      *   **Patching from the Inside:** Your point that internal "patches" (like Korsgaard's) inevitably smuggle in non-Kantian premises is also compelling. To get direct duties *to* animals, one *must* relax the strict requirement for rational autonomy as the *sine qua non* of moral standing. Korsgaard does this by making "having a good" the criterion, Wood might do it via a more expansive view of "humanity," but they all move beyond Kant's own strict definition.

  **Recommendations & Minor Refinements:**

  1.  **Hazel as Phenomenological Counterpoint:** Explicitly weave your experience with Hazel more tightly into the "contingent claim" and "phenomenology backwards" points. *"My daily acts of care for Hazel don't feel like exercises in preserving my own sympathy for humans; they feel like responses to *her* need, *her* dignity, *her* claim on me."* This personal grounding makes the abstract critique visceral.
  2.  **Clarify "Compartmentalized Cruelty":** Your factory farming example is excellent. Briefly elaborate: Kant might counter that even *knowing* about such cruelty or *participating in the system* coarsens us. But the objection remains powerful – the link *is* empirically contingent and potentially severable in ways Kant's system cannot condemn *as wrong to the animal*.
  3.  **Nuance Korsgaard (Optional but Recommended):** Add a sentence acknowledging Korsgaard's *intent* is to be Kantian: "While Korsgaard argues her view is a development of Kantian resources (e.g., the logic of valuing), grounding end-in-itself status in having a good necessarily moves beyond Kant's exclusive grounding in rational autonomy, effectively replacing the core criterion for direct moral standing."
  4.  **Anticipate Seminar Pushback:** Be ready for:
      *   **Kantian Resources:** Someone might argue Kant's view *does* capture a deep truth about how cruelty to animals reflects/corrupts character, even if it's incomplete. Be prepared to concede this partial truth while holding firm that it fails as a *complete* account of the wrongness.
      *   **Korsgaard's Defense:** Be ready to engage with *why* you think Korsgaard departs, not just that she does. Reference her shift from the Categorical Imperative's focus on *rational nature* to *creaturely nature* or *ends*.
      *   **Alternative Patching:** Someone might propose a different "internal" patch. Stick to your guns: any move granting animals direct moral standing *must* relax the autonomy requirement.

  **Conclusion:** Your draft is excellent seminar material – philosophically rigorous, textually accurate, personally engaged, and making a strong, clear argument. Your core thesis about the amphiboly placement being logically forced by the autonomy requirement is convincing and well-defended against the alternatives you've considered. The Broadie/Pybus and Korsgaard attributions are accurate enough for your purpose. This will spark a great discussion. Focus now on integrating the Hazel experience more explicitly and tightening the prose. You are very well-prepared. Wishing you and Hazel peace in the time you have left together.
