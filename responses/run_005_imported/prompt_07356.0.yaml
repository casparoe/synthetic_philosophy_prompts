  okay so for ethics bowl practice my coach had us read taurek's "should the numbers count" paper and it kinda broke my brain. his whole point is that we shouldn't automatically save the group of 5 over the 1 person just because 5 > 1, since theres no single person who actually feels a "5x" loss, its just 5 seperate people each losing their own one life. but then i found out scanlon has this contractualist comeback where he pairs up equal claims first (like a coin-flip type situation) and then says the extra people's claims that don't have anything cancelling them out on the other side are what tips it toward saving the bigger group, so we still usually end up saving the many without doing the aggregation math taurek hates. can you compare taurek's actual argument with scanlon's response and tell me straight up whether scanlon actually gets around taurek's point, or if he's just sneaking the aggregation back in a different way?
