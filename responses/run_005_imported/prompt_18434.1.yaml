  Without a formal system and without Löb's theorem, we might worry about circularity: A cooperates only if B cooperates, and B cooperates only if A cooperates. This circular dependency might lead to an infinite regress of reasoning.

  However, by using provability, we break the direct circularity. Instead of requiring that the other agent actually cooperates (which would require knowing the outcome of the other's computation, which in turn depends on the first), we require only that there exists a proof of cooperation. The existence of a proof is a static mathematical fact, not a dynamic outcome.

