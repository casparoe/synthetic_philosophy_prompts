  Löb's theorem states that, in a formal system that meets certain conditions (like Peano Arithmetic), if we can prove that "if the statement P is provable then P is true" (i.e., □□P→□P, or more precisely □(□P→P)→□P), then we can conclude that P is provable (□P). In other words, if the system can prove that its own proof of P would imply the truth of P, then it can prove P.

