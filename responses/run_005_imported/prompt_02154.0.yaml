answer: |-
  Your background in taxonomy makes you uniquely positioned to grasp the tension between Mill's "unmeaning mark" theory and Frege's puzzle. You're right that Mill's account struggles with informative identity statements, and Frege's solution *does* address it—but it opens new questions about sense and reference. Here's how Mill's view fares against Frege's challenge and where Frege's solution stands:

  ### 1. **Mill's View vs. Frege's Puzzle: The Core Conflict**
     - **Mill's Position**: Proper names are *non-connotative*; they denote individuals directly without encoding any attributes (e.g., "Paul" or "Dartmouth" are arbitrary tags). The name's origin (e.g., Dartmouth being at the Dart's mouth) is irrelevant to its current use.
     - **Frege's Puzzle**: If names *only* denote, then "Hesperus is Phosphorus" (both denoting Venus) should have the same cognitive value as "Hesperus is Hesperus." But the former is an astronomical discovery, while the latter is trivial. Mill's theory cannot explain why one is informative.

     - **Can Mill's View Handle This?**  
       Mill *explicitly rejects* that names carry descriptive content. In his framework, identity statements *should* be tautological if both names refer to the same object. He lacks the tools to distinguish between:
       - *Linguistic meaning* (which, for him, is just denotation)
       - *Cognitive significance* (how speakers conceptualize the referent).

       Mill might retort that the *discovery* lies in empirical investigation, not semantics—but this dodges Frege's point about the *statement itself* conveying new knowledge. Mill's account has no room for this distinction.

  ### 2. **Frege's Solution: Sense vs. Reference**
     Frege resolves the puzzle by distinguishing:
     - **Reference** (*Bedeutung*): The actual object denoted (e.g., Venus for "Hesperus" and "Phosphorus").
     - **Sense** (*Sinn*): The "mode of presentation" or cognitive route to the reference (e.g., "the evening star" for Hesperus; "the morning star" for Phosphorus).

     - **Why This Dissolves Frege's Puzzle**:  
       "Hesperus is Phosphorus" is informative because the *senses* differ, even though the reference is identical. It's not a tautology because it links two distinct descriptions to one object.

  ### 3. **Does Frege Just Relocate the Problem?**
     You astutely note that Frege's solution raises a deeper question: **How do two distinct senses pick out the same reference?** This isn't a flaw in Frege's solution—it's a fundamental metaphysical/epistemological issue he exposes:
     - **The Problem of Co-Reference**: If senses are distinct, how do we *know* they refer to the same object? Frege's answer: through empirical investigation (e.g., astronomy reveals Hesperus/Phosphorus are Venus).
     - **Why This Isn't Circular**:  
       Frege doesn't claim senses *guarantee* co-reference; he claims they *embody how we identify* references. The identity statement's informativeness stems from unifying two cognitive paths to one object. The "mystery" of co-reference is real—but it's a problem about *how language hooks onto the world*, not a defect in the sense/reference model.

  ### 4. **Mill vs. Frege: Lessons from Taxonomy**
     Your experience offers a practical lens:
     - **Mill in the Field**: When you named a new species *Ursus arctos horribilis* (grizzly bear), the name functioned as a Millian "mark." Its Latin roots ("dreadful bear") might suggest attributes, but the name *denotes* the species regardless of whether future specimens lack "dreadfulness."
     - **Frege in the Field**: The same species might be identified via distinct "senses":
       - Sense 1: "The large brown bear in the Rocky Mountains."
       - Sense 2: "The bear with a genomic sequence X."
       Discovering these senses refer to the same species (*Ursus arctos horribilis*) is substantive—mirroring "Hesperus is Phosphorus."

  ### Conclusion
  - **Mill's Account**: Cannot resolve Frege's puzzle. It treats names as purely denotative tags, leaving informative identities inexplicable.  
  - **Frege's Solution**: Successfully explains cognitive significance by introducing "sense." The lingering question—*how senses co-refer*—isn't a failure but an insight into language/world relations. It shifts focus to how we *fix reference* (a problem later addressed by Kripke's causal theory of names).  

  **In short**: Mill’s view is elegant but descriptively inadequate for identity statements. Frege’s solution resolves the puzzle by enriching semantics with "sense," though it demands further work on reference-fixing. Your biological practice aligns with Mill’s use of names as stable designators, but Frege better captures how those names function in human cognition and discovery.
