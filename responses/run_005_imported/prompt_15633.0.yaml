  Okay, let me start by unpacking the user's problem. They're teaching a grad seminar on blame and hypocrisy and struggling to explain why hypocritical blame is defective due to lack of standing, not because the content is false. The main issue is that when they try to explain "lacking standing," they end up just restating the hypocrisy without getting to the underlying mechanism. The student pushed back, asking why it's not just a tu quoque fallacy.

  First, I need to recall the key philosophers mentioned: Cohen, Wallace, Fritz and Miller, Todd. Wallace's equal standing argument is central. He says that blaming involves a demand for reasons, and by blaming, you imply you hold yourself to that standard. Hypocrisy violates this because the blamer doesn't meet their own standards, so they lose the standing to make demands. That's different from tu quoque because it's about the blamer's authority in the moral exchange, not the truth of the blame.

  Then there's Fritz and Miller's fairness angle. They see blame as a sanction, and hypocrites impose burdens they avoid, which is unfair. This shifts from conversational standing to distributive fairness. But does this avoid tu quoque? Maybe, by focusing on the unfair imposition rather than the blamer's character. But the user is worried it's just relabeling the problem.

  The user also mentions the asymmetry between blame and praise. Why don't we question standing in hypocritical praise? That's a good point. Praise doesn't impose burdens or demand change, so the conditions for standing aren't the same. The harm in blame is about accountability, which praise lacks. That asymmetry needs a clear explanation.

  The user's deeper needs might be wanting a structured way to present these concepts to students, avoiding circular explanations. They need concrete mechanisms, not just slogans. Also, addressing the tu quoque concern is crucial to show that standing isn't just an ad hominem. Highlighting the difference between undermining the act's validity vs. the actor's authority could help. 

  I should break down each theory's mechanism: Wallace's exemption claim, Fritz and Miller's fairness in burden-bearing. Compare them to show how they escape tu quoque. Then tackle the praise asymmetry by contrasting the roles of blame and praise in moral communication. Emphasize that standing is about the relational aspect of blame, not the content's truth. Maybe use analogies like a corrupt judge to illustrate invalid authority. 

  Also, the user might need reassurance that these theories hold up under student scrutiny. Addressing possible counterarguments, like whether standing is just another form of inconsistency, would strengthen the explanation. Conclude by tying it back to why this matters for moral discourse beyond logical fallacies.
answer: |-
  You've hit on one of the most persistent challenges in the hypocrisy literature – the move from "they're inconsistent" to "they lack standing" often feels like a handwave rather than an explanation. Let's break down the granular mechanisms proposed by different standing accounts, how they attempt to escape *tu quoque*, and address the blame/praise asymmetry.

  **Core Problem: Why "Lack of Standing" Isn't Just a Restatement of Hypocrisy**

  The key move is shifting the defect from the *content* of the blame (is the target blameworthy?) to the *relational authority* or *performative validity* of the blamer within the moral community/practice. It's not that the hypocrite is *wrong* about the target's fault; it's that they aren't *entitled* to *enact* the specific social/moral practice of *blaming* in this instance. Think of it like a judge with a massive conflict of interest: the defendant might genuinely be guilty, but *this judge* can't validly preside over *this trial*.

  **Granular Breakdown of the Mechanisms:**

  1.  **R. Jay Wallace's "Equal Standing" & Implicit Exemption Claiming (The Conversational Authority Model):**
      *   **What Blaming Is:** Blaming is a *second-personal* act. It involves *holding someone accountable* by demanding reasons for their conduct, implicitly invoking shared norms and expectations within a moral community.
      *   **The Standing Requirement:** To issue such a demand *authoritatively*, the blamer must implicitly present themselves as *bound by the same norms* they are invoking. They must occupy a position of *equal standing* within the normative community defined by those rules. Demanding compliance implies your own subjection to the demand.
      *   **What the Hypocrite Does Wrong (The Mechanism):** By blaming while violating the same norm (or a relevantly similar one), the hypocrite implicitly *exempts themselves* from the very norms they are holding the target accountable to. This is an *act* of claiming a kind of illegitimate privilege or superiority ("These rules bind *you*, but not *me*").
      *   **Why This Invalidates the Blame:** The hypocrite's act of blaming *simultaneously asserts* ("You are bound by norm N") and *undermines* ("I am exempt from N") the foundation of their authority to make the demand. It's performatively inconsistent. Their action (exempting themselves) contradicts the presupposition of equal standing necessary for their speech act (holding you accountable to N) to have its intended second-personal force. The target is justified in rejecting the *demand* ("Who are *you* to make this demand of me?") because the hypocrite has disqualified themselves from the role of legitimate demander *within this normative framework*.
      *   **Escaping *Tu Quoque*:** The defect isn't *just* that they are inconsistent (which could be irrelevant). The defect is that their inconsistency *directly undermines the presuppositions of the specific communicative act they are performing*. It renders their blaming *inapt* or *invalid* as a form of moral address *in this instance*, regardless of the target's actual fault. It's not that their character flaw proves the target innocent; it's that their flaw makes *their specific act of blaming* morally ineffective and rightfully dismissible. The target isn't saying "I'm innocent," they're saying "*You* can't be the one to call *me* out."

  2.  **Kyle Fritz & Daniel Miller's "Fairness" Account (The Sanction-Imposition Model):**
      *   **What Blaming Is:** Blaming involves the imposition of a *sanction* (reproach, censure, emotional withdrawal, etc.) and the creation of a *burden* (guilt, obligation to apologize/make amends) on the target.
      *   **The Standing Requirement:** It is unfair to impose sanctions/burdens on others for violating norms that you yourself systematically avoid complying with, especially when that avoidance confers benefits or avoids burdens. Fairness requires that those imposing the burdens of accountability bear comparable burdens themselves.
      *   **What the Hypocrite Does Wrong (The Mechanism):** The hypocrite *unfairly distributes the burdens* of the moral community. They benefit from others' compliance (or their own non-compliance) while imposing the costs of blame on others for failing to comply. They act as a "free rider" on the system of accountability – enjoying the benefits of the norms (order, predictability, others' restraint) without paying the costs (restraining themselves, bearing the burdens of guilt/reproach when they fail).
      *   **Why This Invalidates the Blame:** Because the act of blaming imposes an unfair burden. The target is being made to bear a cost (the sanction) by someone who refuses to bear comparable costs themselves. This unfairness undermines the hypocrite's *right* to impose that burden. It's akin to a tax collector who evades taxes themselves; their act of collection becomes illegitimate *because* of their own evasion, even if you genuinely owe the tax.
      *   **Escaping *Tu Quoque*:** Again, the focus shifts from the target's desert to the *unfairness of the hypocrite's action*. The target's objection isn't primarily "I didn't do it" but "It's unfair *for you specifically* to punish *me* for this, given your own behavior." The defect is in the *relational act* of imposing *this* burden by *this* person, not in the truth of the underlying claim about the violation.

  **Todd's "Unified Account" (Briefly):** Patrick Todd often synthesizes these. Hypocrisy undermines standing because:
      *   It involves an *implicit falsehood* (claiming a commitment/status one lacks).
      *   It constitutes *unfair burden-imposition* (as per Fritz & Miller).
      *   It *damages credibility* as a moral interlocutor.
      The combined effect is that the hypocrite loses the *moral authority* or *position* necessary for their blame to function as a legitimate demand within the moral practice.

  **Do They Escape *Tu Quoque* or Just Relocate It?**

  *   **Relocation, But Meaningful:** They *do* relocate the issue "one level up," but this relocation is philosophically significant. *Tu quoque* traditionally targets the *argument* (e.g., "Your inconsistency proves my innocence"). Standing accounts shift the target to the *speaker's authority to perform the specific act* (e.g., "Your inconsistency disqualifies *you* from performing *this* act of blaming effectively/fairly").
  *   **Avoiding Irrelevance:** The escape lies in arguing that the hypocrite's character/conduct *isn't* irrelevant to the *validity of their performative act* of blaming. It's directly relevant to the presuppositions (Wallace) or fairness conditions (Fritz & Miller) *internal to the practice of blaming itself*. The inconsistency isn't evidence against the *content*; it's a flaw in the *vehicle* delivering the content.
  *   **Residual Worry:** The challenge is showing why this flaw in the vehicle *matters* enough to warrant dismissal *of the blame itself*, rather than just warranting criticism *of the hypocrite*. Standing accounts argue it matters because blaming is inherently a relational, second-personal practice requiring specific authority/positioning. Invalidating *that* authority invalidates *that* particular act of blame. It doesn't absolve the target; it just means *this person* can't be the one to hold them accountable *in this way*.

  **The Blame/Praise Asymmetry: Why Standing is (Mostly) for Blame**

  This is a crucial observation, and the asymmetry stems from fundamental differences in the acts:

  1.  **Nature of the Act:**
      *   **Blame:** Imposes a *burden* (guilt, sanction, demand for change/amends). It's *costly* for the target. Fairness concerns about who imposes burdens are paramount. It asserts a *demand* requiring standing/authority.
      *   **Praise:** Confers a *benefit* (approval, esteem, reward). It's generally *welcome* or at least cost-neutral for the target. Concerns about the fairness of benefit-conferral are less acute ("Why *shouldn't* you praise me, even if you wouldn't do it?"). It doesn't inherently demand reciprocity or presuppose the praiser's own virtue in the same way blame presupposes the blamer's compliance.

  2.  **Presuppositions of Authority:**
      *   **Blame:** To demand accountability, you must implicitly claim the authority of someone *subject* to the same accountability. Praise doesn't demand anything *from* the target; it simply offers a positive evaluation. You don't need to be a good artist to validly praise a beautiful painting.

  3.  **Risk of Harm/Exploitation:** Hypocritical blame risks unfairly harming the target (imposing burdens unfairly). Hypocritical praise might be insincere or ironic, but it rarely *harms* the target in the same way (they still get the benefit of praise, even if it feels hollow). The main harm of hypocritical praise is usually to third parties or to the praiser's own credibility, not directly to the target.

  4.  **The "Exemption Claiming" Move:** Hypocritical praise doesn't clearly involve claiming an exemption from the norm. Saying "That was wonderfully generous!" while being stingy yourself doesn't implicitly say "Generosity binds you but not me." It just says you recognize generosity *in them*, even if you fail at it. Your failure doesn't *contradict* the act of praise in the same way a blamer's failure contradicts the presupposition of shared accountability inherent in blame.

  5.  **Possible Exceptions:** Hypocritical praise *could* raise standing issues in specific contexts:
      *   **Insincere Manipulation:** If praise is used manipulatively by someone known to be insincere, its validity *as praise* might be questioned (it's just flattery).
      *   **Praise as Implicit Sanction:** If praise for A implicitly blames B (e.g., a manager lavishly praising one employee's overtime while ignoring others), the *comparative* element might import fairness concerns akin to blame.
      *   **Praise as Norm-Setting:** If praise is used authoritatively to *set* norms or expectations (e.g., a leader praising extreme self-sacrifice), their own failure to meet that norm *might* undermine their standing to *demand* it via praise. But this is rarer and more contested.

  **Conclusion for Your Seminar:**

  *   **Emphasize the Performative Shift:** Hammer home that standing accounts are about the *act* of blaming as a second-personal, burden-imposing, authority-claiming practice, not just the proposition "X did wrong."
  *   **Contrast Mechanisms:** Explicitly diagram Wallace (Conversational Authority / Implicit Exemption Claiming) vs. Fritz & Miller (Fair Burden-Imposition / Free-Riding). Ask students which they find more compelling and why.
  *   **Confront *Tu Quoque* Head-On:** Frame the discussion: "Is 'lacking standing' *really* different from 'you're a hypocrite, so I can ignore you'? How do Wallace/F&M/Todd argue that the hypocrite's flaw *intrinsically* invalidates the *act*, not just makes the *actor* unlikeable?"
  *   **Pose the Asymmetry Question:** Challenge students: "Why does hypocritical *praise* feel different? Does this asymmetry support or undermine the standing accounts for blame? Does praise have different 'standing' conditions?" This can illuminate the unique features of blame.
  *   **Use Concrete Analogies:** The conflicted judge, the tax-evading tax collector, the vegetarian leather-wearer blaming meat-eaters – these can help make the standing defect feel more tangible than abstract inconsistency.

  The standing move remains contentious, but its power lies in taking the *practice* of blame seriously as a social interaction with its own internal norms and authority structures, rather than just a statement of fact. The challenge is making those structures explicit and showing why hypocrisy violates them in a way that genuinely undermines the act itself. Good luck with the seminar!
