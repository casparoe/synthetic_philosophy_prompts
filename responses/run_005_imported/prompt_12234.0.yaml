  - **Tier S (most promising)**: These proposals fully respect strong Pareto-dominance and impartiality without arbitrary choices, though they are incomplete. They are the least compromised by the impossibility result.
  - **Tier A**: These are formal workarounds that can respect Pareto and impartiality in limited contexts but rely on an arbitrary ordering or sequence, reintroducing the arbitrariness they aim to avoid.
  - **Tier B**: This proposal uses non-constructive mathematical objects (e.g., free ultrafilters) to achieve comparability, but the selection of these objects is inherently arbitrary.
  - **Tier C (least promising)**: These violate core principles—discounted utilitarianism breaks impartiality, and average utilitarianism fails strong Pareto—and rely on arbitrary parameters.

