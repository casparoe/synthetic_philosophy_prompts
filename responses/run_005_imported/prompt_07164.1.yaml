  Based on Michael Dummett's core arguments in *On Immigration and Refugees* and his extensive activism, here's a reconstruction of how he would likely judge the events you mention, emphasizing his distinctive principles rather than generic liberalism:

  1.  **The "Hostile Environment" Policy (2012 onwards):**
      *   **Dummett's Judgement:** He would see this as the **ultimate expression of the institutional racism and bad faith he spent his life fighting.** His entire critique centered on how state mechanisms, even when framed neutrally, were designed to exclude non-white immigrants and create a climate of fear and precarity. The explicit aim of making life unbearable for undocumented migrants (many of whom were *not* undocumented by choice but due to state error or historical injustice) would have confirmed his deepest fears. He argued that immigration controls inherently invited abuse and racism when embedded in a society with Britain's colonial history and racial prejudices. The "hostile environment" operationalized this abuse as official policy. He would view it as a **fundamental betrayal of justice and a deliberate infliction of cruelty.**

  2.  **The Windrush Scandal (2018):**
      *   **Dummett's Judgement:** This would be **the precise, devastating vindication of his decades-long warnings about the 1971 Act and subsequent administrative cruelty.** He would see it not *just* as a recurrence, but as the **inevitable, poisonous fruit of the discriminatory system he dissected in the 1970s.**
      *   **Patriality's Legacy:** The Windrush generation were *precisely* the people excluded by the "patriality" rule he attacked – Commonwealth citizens with deep historical ties to Britain, but without a UK-born parent/grandparent. Their vulnerability was *created* by that discriminatory legal structure.
      *   **Administrative Disguise:** The scandal revealed how the *administration* of immigration control, once imbued with racist intent (as he argued the 1971 Act was), inevitably leads to catastrophic injustice. The destruction of landing cards, the lack of documentation provided to long-term residents, and the Kafkaesque burden of proof placed on victims were not mere accidents; they were the logical outcome of a system designed to view certain people as inherently suspect and disposable. He would see it as **definitive proof that the "neutral" administration of discriminatory laws perpetuates and deepens racial injustice.**

  3.  **Brexit & the Points-Based System (PBS):**
      *   **Dummett's Judgement:** He would be **highly skeptical that a formally nationality-blind PBS represented genuine progress or eliminated discrimination.** His analysis would focus on:
          *   **Historical Amnesia:** The PBS ignores the specific historical and moral obligations Britain incurred through Empire and Commonwealth. Ending free movement for EU citizens might be framed neutrally, but it severed ties based on recent political agreements, while failing to acknowledge or rectify the deeper, racially-tinged injustices inflicted on non-white Commonwealth citizens through previous legislation like the 1971 Act. He would see the *replacement* of one system (EU free movement) without addressing the *legacy* of the previous discriminatory system (against the Commonwealth) as a profound moral failure.
          *   **Criteria as Disguised Discrimination:** Dummett was acutely aware that seemingly neutral criteria (skills, salary thresholds, language requirements) could be *selected and weighted* to disproportionately exclude people from specific regions (often the Global South/former colonies) and favor others (wealthy, predominantly white nations). He would scrutinize the *design* of the points criteria for biases that replicated old patterns of exclusion under a new, technocratic veneer. The "neutrality" would ring hollow if the outcome was similar.
          *   **Symbolism vs. Substance:** Ending free movement for EU citizens (predominantly white) while introducing a PBS would likely strike him as symbolically abandoning a principle of free movement for Europeans without making substantive amends to those historically wronged by British immigration policy (non-white Commonwealth citizens). The *focus* of the change, driven by anti-immigration sentiment often tinged with xenophobia, would concern him deeply.

  4.  **Channel Crossings & the Rwanda Plan:**
      *   **Channel Crossings:** Dummett would see the focus on "stopping the boats" as a **distraction from the core duty to protect refugees.** He would argue that the dangerous journeys are a symptom of the failure to provide safe and legal routes, a failure he vehemently condemned. His primary concern would be the welfare and rights of the individuals fleeing persecution, not the method of their arrival. He would likely advocate for processing claims fairly in the UK and expanding safe pathways.
      *   **The Rwanda Plan (and similar offshore schemes):** Dummett would view this as **morally abhorrent and a fundamental abdication of responsibility.** His argument for the near-absolute duty to admit refugees was rooted in the immediacy of harm and the state's direct responsibility to those arriving at or within its jurisdiction. Offshoring responsibility to a third country, especially one with questionable human rights records and no genuine connection to the asylum seekers, would violate every principle he held:
          *   It attempts to **evade the duty of sanctuary** he considered paramount.
          *   It **inflicts further cruelty and uncertainty** on traumatized individuals.
          *   It treats human beings as **pawns to be bargained away**, utterly contrary to his view of refugees as bearers of fundamental rights.
          *   He would see it as the **cynical culmination of the "hostile environment" logic**, pushing cruelty beyond Britain's shores.

  **Addressing Your Core Questions:**

  *   **Windrush as Recurrence:** Dummett would **absolutely** see Windrush as the "same danger... recurring in administrative disguise." It wasn't just similar; it was the *direct, foreseeable consequence* of the discriminatory system established in 1971 and the administrative culture it fostered. The destruction of records and the burden of proof placed on victims were mechanisms *within* that system that enabled the exact kind of injustice he predicted – the state denying the rights and even the very presence of people it had encouraged to come and who had built lives in Britain for decades. It proved that the racism embedded in the *structure* of the law inevitably permeated its *administration*.

  *   **Formally Equal, Nationality-Blind System:** Dummett would be **profoundly skeptical that this constituted genuine progress on discrimination.** His life's work taught him that formal neutrality was easily weaponized to achieve discriminatory ends. He would argue:
      1.  **Historical Context Matters:** A "neutral" system applied *after* centuries of colonialism and decades of explicitly racist immigration laws ignores the specific debts and injustices owed to certain groups (like the Windrush generation and their descendants). True justice requires rectifying past wrongs, not just applying a neutral rule going forward.
      2.  **Design Determines Outcome:** The selection of criteria in a points system (e.g., salary thresholds, specific skill sets, language requirements) could be consciously or unconsciously designed to favor applicants from certain (wealthier, whiter) countries and disadvantage those from others, replicating old patterns of exclusion. He would demand rigorous scrutiny of the *impact* of the criteria, not just their facial neutrality.
      3.  **Administration is Key:** Even a perfect law on paper is worthless if administered with bias, lack of resources, or cruelty (as Windrush horrifically demonstrated). A "neutral" system administered within the Home Office culture revealed by the "hostile environment" and Windrush would still produce discriminatory and unjust outcomes. He would prioritize reforming the *culture and practice* of immigration enforcement above the nominal structure of the rules.
      4.  **Symbolic Erasure:** A blanket nationality-blindness could be seen as erasing the specific history of racial discrimination in British immigration policy, preventing acknowledgment and redress. For Dummett, acknowledging that history was essential.

  **In essence:** Dummett would view all these post-2011 developments – the hostile environment, Windrush, the focus on stopping boats, the Rwanda plan – as **confirmation and intensification** of the systemic racism, administrative cruelty, and evasion of responsibility he identified as the core problems of British immigration policy decades earlier. He would likely see the points-based system not as a solution to past discrimination, but as a potential new mechanism for perpetuating exclusion under a veneer of neutrality, unless it was explicitly designed *and* administered with rectifying historical injustice and avoiding disparate impact as central goals. His response would be one of profound moral outrage and a renewed call for radical reform centered on justice, humanity, and confronting Britain's racist immigration history head-on.
