  Ok this has been living in my head for like two weeks and I need a sanity check from someone who overthinks things as much as I do (occupational hazard after years of reading rationalist blogs, probably).

  My friend Dana is, by a wide margin, the calmest person I know. We've been through genuinely stressful stuff together — a brutal thesis deadline, her car breaking down on a highway shoulder at 1am, a landlord who tried to illegally evict her — and she just doesnt rattle, ever. So a few weeks ago we're at her parents place for dinner, her dad makes one of his classic passive aggressive digs about her "wasting her degree," and Dana just explodes. Raised voice, said some things she probably regrets, the works. Totally unlike her. Afterwards she brushed it off with "that doesn't count, nobody stays calm around my dad, he's just built different" — like it's some known exception that doesn't touch the general rule that she's a calm person.

  Part of me wants to just accept that — everyone's got a button somebody can push. But another part feels like that's kind of a get-out-of-jail-free move: if the calmness completely vanishes the one time she's up against someone who actually knows how to provoke her, in what sense was she ever a calm person, versus someone who's just had easy tests so far and hasn't met her match yet? Is there an actual principled way to tell "the trait is genuinely there, this is a legit exception" apart from "the trait was never robustly there, we just hadn't hit the right button yet"? Or is that not even a real distinction, and I'm overthinking a totally mundane thing about how people work? Would love an actual rigorous take on this rather than the standard "everyone has an exception" shrug.
