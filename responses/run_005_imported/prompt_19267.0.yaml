  The user also worries about the "no true Scotsman" fallacy. If every exception is explained away, is the trait meaningful? But this isn't moving goalposts; it's recognizing context. Dana's calmness holds in varied, high-stress scenarios (thesis, car breakdown, eviction). Those are diverse tests, making her dad the exception, not the rule. 

