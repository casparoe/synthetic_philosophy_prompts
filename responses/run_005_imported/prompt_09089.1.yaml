answer: |-
  Here’s a warm, funny, and philosophically bulletproof 5-minute speech that honors Owen’s views while celebrating his marriage. It sidesteps "authorship" language, nods to Strawson Sr., and keeps things joyful:

  ---

  **(Clink glass gently. Warm smile.)**  

  "Hi everyone. For those who don’t know me, I’m [Your Name], Owen’s best man—or as *Owen* would say, ‘the person arbitrarily designated by social convention and a chain of prior causes to stand here today.’ *(Pause for laughs.)*  

  Now, if you’ve ever been to a party with Owen, you’ll know he has a unique talent. You’ll be enjoying a drink, feeling proud of your kid’s art project or your promotion… and Owen will appear. With *kindness* in his eyes and *Galen Strawson* on his lips, he’ll gently remind you that none of us are truly the ‘authors’ of our lives. You didn’t *earn* that promotion—you’re just the output of genetics, circumstance, and a causal chain stretching back to the Big Bang. *(Shrug, smile.)* He’s a real romantic.  

  So when he asked me to give this speech, I knew I had a problem. Because wedding toasts? They’re *full* of landmines for Owen. ‘You two deserve each other’? Nope—can’t *deserve* anything. ‘Look how far you’ve come’? Sorry, no ‘you’ to come anywhere. Even ‘you built this life’ implies a builder who chose the bricks! *(Mimics Owen’s gentle, apologetic tone.)* ‘Ah, but who chose the chooser?’  

  *(Lean in conspiratorially.)*  
  But here’s the beautiful thing: Owen’s sitting right there… next to Maya. *(Gesture to couple.)* And whether you believe our choices are determined by fate, quantum dice rolls, or tiny elves in your prefrontal cortex *(pause for chuckle)*, what’s *undeniable* is that **this moment exists**. The universe—through sheer, glorious contingency—has conspired to put these two people here. Together. And *we* get to see it.  

  I don’t need to pretend Owen ‘authored’ himself into being the brilliant, wry, surprisingly good-dancer he is today. I just need to say: *how lucky we are to witness the collision of particles that produced him and Maya.* How astonishing that in a cosmos indifferent to responsibility, these two chaotic bundles of stardust found each other. And how fitting that Owen—who’s spent years explaining why no one’s *ultimately* responsible for anything—has somehow, against all cosmic odds, ended up *utterly, irrevocably responsible for making Maya laugh.*  

  *(Raise glass slightly.)*  
  And yes, Owen, I *did* read up on your hero Galen. I know his Basic Argument means we can’t take credit for being ‘deep down’ good or bad… or even for choosing to love. But then I found the *perfect* loophole: **P.F. Strawson.** Galen’s *own dad* spent his career arguing that moral responsibility isn’t about cosmic truths—it’s about *us*. Our human reactions. Our joy, our resentment… our gratitude. And today? Today we’re drowning in it.  

  So let’s not say Owen and Maya *deserve* this happiness. Let’s say something truer: **We are outrageously lucky it found them.** We don’t need ‘ultimate authorship’ to see how their smiles sync up, how they nudge each other’s coffee cups without looking, or how Owen—despite his best philosophical efforts—*clearly* had no choice but to fall for Maya the moment she roasted his Kant take at that department mixer.  

  So here’s to Owen and Maya: two astonishing accidents of existence who, through forces beyond their control, chose to keep choosing each other. May your lives keep colliding in beautiful, unexpected ways. And Owen? *(Wink.)* Don’t overthink the cake cutting—it’s just determinism with buttercream.  

  **To the happy inevitability!**"  

  ---

  ### Why This Works:
  1. **No "Authorship" Traps**: Replaces "you built this" with "how lucky we are to witness it," and "deserve" with "lucky it found them."  
  2. **Strawson Sr. Nod**: Uses P.F. Strawson’s "reactive attitudes" as a human counterpoint to Galen’s metaphysics—warmly implying that *our* joy matters more than cosmic responsibility.  
  3. **Owen-Proof Humor**: Jokes about his party habits ("arbitrarily designated"), Kant takes, and "don’t overthink the cake cutting" land without mocking his sincerity.  
  4. **Quantum/Determinism Dodge**: Explicitly mentions "quantum dice rolls" as irrelevant, satisfying philosophy friends without derailing the toast.  
  5. **Heart Over Lecture**: Focuses on observable love (smiles, coffee cups) and shared gratitude—things even P.F. Strawson would toast to.  

  **Delivery Tip**: Lean into the playful exasperation when mimicking Owen’s philosophy voice. End the "overthink the cake cutting" line with a fond grin. The room will melt.  

  You’ve got this. And remember: if Owen starts analyzing your speech mid-toast? Just point at the dance floor and yell, "Look! Compatibilist boogying!" and run. *(Kidding. Mostly.)*
