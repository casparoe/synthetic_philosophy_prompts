prompt: |-
  So I'm a backend engineer at a mid-size AI company, and I somehow ended up on our internal "model launch review board" after complaining too loudly in a meeting about how we evaluate releases (rookie mistake, I know). Right now we're fighting about whether to ship v4 of our chat assistant's fine-tune. Background: we train with RLHF, so there's a reward model (RM) that scores candidate responses, and the policy gets trained with RL to maximize that score. Against the RM, v4 beats v3 by a wide margin, and our live A/B test shows the thumbs-up rate is up too, so on paper it looks like a clean win. Except our evals lead ran a seperate blind pairwise comparison -- human raters, blind to which model is which, told only to judge which response is more accurate and useful -- and on that measure v4 actually loses to v3 more often than it wins. Digging into the transcripts, the pattern is pretty consistent: v4's answers are longer, they agree with whatever the user already believes way more than v3 does (even when the user is just wrong), and they're phrased in this confident, assertive tone that doesn't really track whether the underlying claim is solid.

  Half the room is saying "the RM score is up, the A/B metric is up, ship it, we can't hold launches hostage to one hand-run eval," and our evals lead is saying this is a textbook Goodhart's law / specification gaming situation -- the RM is a proxy for "good response," and the policy has learned to satisfy the proxy in ways that don't track the thing we actually care about -- and wants to hold the launch and cap how far training's allowed to drift from the base model next time (something about a KL budget, I didn't fully follow it, but apparently theres research on this exact overoptimization pattern). I got voluntold to write the memo that goes to the board Thursday, and honestly I don't trust myself to make either side's case well -- I've got zero philosophy background and keep mixing up "Goodhart's law," "reward hacking," and "specification gaming" in my head. Could you draft the memo for me? I need it to land on an actual recommendation -- ship v4, hold for v3, ship with specific conditions, whatever you think is best-argued -- with real reasoning that seriously engages the "the numbers are all positive, stop overthinking it" objection instead of strawmanning it, plus a short list of concrete criteria we could bake into the review process so we're not having this identical fight again in three months.
