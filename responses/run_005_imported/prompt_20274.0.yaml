prompt: |-
  I am revising the conditionals unit of my philosophy of language seminar and want to be sure I have the history straight before I teach it. As I understand things, David Lewis's 1976 triviality results showed that indicative conditionals cannot be assigned truth conditions at all, which is precisely why Lewis abandoned a truth-conditional semantics for them in favor of something like Ernest Adams's probabilistic account, reserving his possible-worlds machinery for counterfactuals instead. If that is the right way to state the upshot of the triviality results, I am at a loss to explain why Stalnaker and Jackson kept developing truth-conditional semantics for indicative conditionals well after 1976: were they simply unpersuaded by a result that had already settled the question, or does the argument actually establish something narrower than I have suggested? I would like to get the dialectic right before presenting it in lecture.
reasoning: |-
  Okay, the user is revising the conditionals unit for their philosophy of language seminar and wants to ensure they have the history and implications of Lewis's triviality results correct. They understand Lewis's 1976 results as showing that indicative conditionals cannot have truth conditions at all, leading him to adopt Adams's probabilistic approach. However, they're confused about why Stalnaker and Jackson continued developing truth-conditional semantics for indicative conditionals after 1976. 

  The user's main question is whether Stalnaker and Jackson were simply ignoring a settled result or if the triviality results actually establish something narrower. They want to present the dialectic accurately in their lecture. 

  First, I need to clarify Lewis's actual argument. Lewis didn't argue that indicative conditionals can't have truth conditions at all. Instead, he showed that under certain assumptions—particularly that conditionals obey the probability conditional (P(A→C) = P(C|A)) and that they have truth conditions that allow embedding—leads to triviality. The conclusion is that these assumptions can't all hold together. 

  Stalnaker and Jackson accepted Lewis's results but interpreted them differently. They believed the issue was with the embedding assumption. Stalnaker's logic for conditionals allows them to be embedded, but he argued that the triviality arises only if we assume that the conditional's probability must always match the conditional probability in all embeddings, which might not be necessary. Jackson, on the other hand, introduced the concept of robustness to explain why we assert conditionals even when their truth conditions might not align perfectly with conditional probability. 

  The user might be oversimplifying Lewis's conclusion. The triviality results don't outright ban truth conditions; they show a conflict between the probability conditional, truth-conditional embedding, and non-triviality. Stalnaker and Jackson each addressed different parts of this conflict. Stalnaker modified the embedding assumption, while Jackson added a pragmatic layer. 

  The user's deeper need is to present the philosophical debate accurately, showing that the responses to Lewis weren't dismissive but were attempts to resolve the trilemma he presented. They need to highlight the key points of contention: the embedding assumption and the role of pragmatics. Emphasizing the different strategies Stalnaker and Jackson used will help students understand the ongoing discourse in the field.
answer: |-
  You've captured the *core* impact of Lewis's triviality results brilliantly, but your framing slightly overstates their *inescapable* conclusion. The results didn't *prove* that indicative conditionals **cannot** have truth conditions *at all*; rather, they proved that indicative conditionals **cannot have truth conditions that satisfy all three of the following widely desired properties simultaneously**:

  1.  **The Probability Conditional (Adams's Thesis):** The probability of the conditional `A → C` equals the conditional probability of `C` given `A` (`P(A → C) = P(C|A)`). This captures the intuition that we evaluate indicatives by supposing `A` and seeing how likely `C` is.
  2.  **Truth-Conditionality & Embeddability:** `A → C` has genuine truth conditions (it can be true or false), and crucially, **it can be embedded within other truth-functional operators** (like `~`, `&`, `∨`, or even within another conditional) without changing its meaning or probability profile. (This is the key assumption Lewis exploited).
  3.  **Non-Triviality:** The probability function `P` is not trivial (i.e., it assigns non-extreme probabilities to more than two incompatible sentences).

  Lewis showed that **any theory satisfying (1) and (2) inevitably leads to (3) being false** – the probability function *must* be trivial (e.g., only assigns probabilities 0 or 1). This is devastating for *any* truth-conditional theory aiming to capture Adams's Thesis.

  **So, why did Stalnaker and Jackson persist?**

  They accepted Lewis's proof but **rejected the necessity of one of the assumptions**, specifically targeting **Assumption (2): Embeddability**.

  1.  **Robert Stalnaker (Stalnaker's Hypothesis):**
      *   **Core Belief:** Indicative conditionals *do* have truth conditions (a selection function over possible worlds, similar to his counterfactuals, but with a different constraint on the "selection").
      *   **Response to Lewis:** Stalnaker argued that **Assumption (2) is false for his theory**. He maintained that `A → C` *has* truth conditions and *can* be embedded, but **the probability of the embedded conditional `P(B & (A → C))` is *not always* equal to `P(B) * P(A → C | B)` in the way required for Lewis's proof**.
      *   **The Crucial Move:** Stalnaker claimed that when a conditional is embedded, especially under negation or in the antecedent of another conditional, **its context of evaluation changes**. The selection function used to determine its truth might shift based on the embedding context. Lewis's proof assumes the truth conditions (and thus the selection function) remain fixed regardless of embedding. Stalnaker denied this fixedness under embedding for the *probability calculation* needed in the proof. He argued that the *assertability* conditions (governed by `P(C|A)`) hold for simple, unembedded conditionals, but the truth conditions themselves are robust enough to allow embedding *without* necessarily satisfying the probability conditional (`P(A → C) = P(C|A)`) *in all contexts*, especially embedded ones.
      *   **In Simple Terms:** Stalnaker conceded Adams's Thesis (`P(A → C) = P(C|A)`) holds for *simple, unembedded assertions* of conditionals, but it *fails* for embedded occurrences. He sacrificed the universal validity of (1) under embedding to preserve (2) and (3).

  2.  **Frank Jackson (The "Robustness" Defense):**
      *   **Core Belief:** Indicative conditionals *do* have truth conditions (material implication: `A → C` is true iff `~A ∨ C`). He famously defended the material implication analysis.
      *   **Response to Lewis:** Jackson accepted that the *literal truth conditions* of `A → C` are those of the material conditional (`~A ∨ C`). He also accepted that `P(~A ∨ C)` does *not* generally equal `P(C|A)` (e.g., if `P(A)` is low but `P(C|A)` is high, `P(~A ∨ C)` is high simply because `~A` is likely).
      *   **The Crucial Move:** Jackson argued that **asserting `A → C` conventionally implicates that `P(C|A)` is high**. The *reason* we use the conditional form instead of just asserting the material conditional is to signal that the probability of `C` *given* `A` is robust – high and stable even if we learn `A` is true. This robustness explains why we assert the conditional *instead* of the material conditional when `P(C|A)` is high, even if `P(~A ∨ C)` is also high.
      *   **In Simple Terms:** Jackson conceded that Adams's Thesis (`P(A → C) = P(C|A)`) does **not** hold for the *literal meaning* (truth conditions) of the indicative conditional. He preserved (2) (truth-conditions = material conditional, perfectly embeddable) and (3) by **denying (1) as a constraint on literal meaning**. He explained the *intuition* behind (1) pragmatically, via the conventional implicature of robustness.

  **The Dialectic for Your Lecture:**

  1.  **Lewis's Bomb:** Shows the *incompatibility* of three desirable properties: (1) Probability = Conditional Probability, (2) Genuine/Embeddable Truth-Conditions, (3) Non-Trivial Probability.
  2.  **Lewis's Conclusion:** Since (1) (Adams's Thesis) is non-negotiable for capturing how we *use* indicatives, and (3) is essential, (2) must be abandoned. Indicatives lack truth conditions suitable for embedding.
  3.  **Stalnaker's Gambit:** Accepts (2) and (3). Sacrifices the *universal validity* of (1), especially under embedding. Preserves truth conditions & embedding by making probability sensitive to embedding context. Adams's Thesis holds only for simple assertions.
  4.  **Jackson's Gambit:** Accepts (2) and (3). Explicitly *denies* (1) as a constraint on literal truth-conditional meaning. Explains the *apparent* validity of (1) via pragmatics (conventional implicature of robustness).

  **Why they persisted:** Neither Stalnaker nor Jackson thought Lewis *failed* to prove his result. They thought he proved that **one cannot have *all three* properties simultaneously**. They chose different paths:

  *   **Stalnaker:** Kept robust truth conditions (2) & non-triviality (3), moderated (1) (Adams's Thesis) to apply primarily to unembedded assertions.
  *   **Jackson:** Kept robust truth conditions (2) & non-triviality (3), explicitly rejected (1) as a semantic constraint, explaining it pragmatically.
  *   **Lewis (& Adams):** Kept (1) and (3), abandoned (2) for indicatives (no truth conditions suitable for embedding).

  **How to State the Lewis Upshot Accurately:**

  > "Lewis's triviality results (1976) demonstrated that **no truth-conditional semantics for the indicative conditional can simultaneously satisfy three core desiderata: (i) that its probability equals the corresponding conditional probability (Adams's Thesis), (ii) that it has standard truth-functional embeddability, and (iii) that it operates within a non-trivial probability space.** Lewis concluded that (i) was paramount and non-negotiable, leading him to abandon truth conditions for indicatives in favor of Adams's assertability/pragmatic account. However, philosophers like Stalnaker and Jackson accepted Lewis's proof but argued that *one of the other assumptions could be rejected*. Stalnaker challenged the full force of embeddability (ii) within probability calculations, while Jackson rejected (i) as a direct constraint on semantic content, explaining it pragmatically. The debate thus centers on *which* desideratum must be sacrificed."

  This framing accurately captures Lewis's devastating result while explaining why the truth-conditional project for indicatives didn't simply die in 1976 – Stalnaker and Jackson offered principled (though controversial) ways to reinterpret or reject one of the assumptions Lewis relied upon.
