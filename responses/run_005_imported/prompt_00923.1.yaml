prompt: |-
  Ok, this is a real dilemma from my own life, not a hypothetical, and it's been bugging me enough that I'm bringing it here instead of just journaling about it like a normal person. I've been reading LessWrong/ACX-type stuff for like a decade now so my brain immediately wants to frame this in some kind of decision-theory terms, but I can't actually place which concept applies, if any, so hoping you can help me think it through properly.

  I'm choosing between two job offers. Offer A is at an established mid-size company with a very clearly laid out comp structure — base salary plus a bonus computed from a public formula tied to company metrics, and I have their last 5 years of payout data, so I can put pretty tight error bars on my expected total comp (comes out to about $145k/yr, give or take a few thousand). Offer B is an early stage startup: lower base around $115k, but a decent equity stake. When I asked the founder for any real modeling of what the equity might be worth, she was refreshingly honest and basically said "we genuinely don't know, it depends on stuff that hasn't been decided yet, could be worth nothing or several times your base, I'm not going to pretend to a precision we don't have." A friend who's way more finance brained than me threw together a rough model using published startup outcome base rates and reckons offer B's expected value is at least as good as offer A's, maybe better, even being pretty conservative about it.

  Despite that, I keep feeling a pull toward offer A thats got nothing to do with the math, purely because I can picture its number and I can't picture offer B's at all. I mentioned this to a friend from my meetup group and she said "that's probably just risk aversion, A has way lower variance too," but that doesn't feel like the complete story to me — I don't think I'd feel this same pull if offer B were, say, a straight coinflip between two specific, well defined payouts with the same variance as her model estimated. It's specifically the can't-put-a-number-on-it-at-all part that's doing something weird to my brain, not the spread of outcomes per se. So: am I just being irrational, is my friend basically right and I'm overanalyzing a minor distinction, or is there something else going on here that should actually change how I make this decision? Would love an actual framework, not just "go with your gut."
reasoning: |-
  Okay, let me start by understanding the user's problem. They have two job offers: one from a stable company with predictable compensation and another from a startup with a lower base salary but uncertain equity. The user is torn because even though the expected value of the startup might be higher, they feel drawn to the certainty of Offer A. Their friend mentioned risk aversion, but the user thinks it's more about the ambiguity of the equity's value rather than just the variance in outcomes.

  First, I need to recall decision theory concepts. The user mentioned LessWrong and ACX, so they're familiar with rationality frameworks. They want to avoid just going with their gut. The key here is distinguishing between risk and ambiguity. Risk is when probabilities are known, like a coin flip. Ambiguity is when the probabilities themselves are unknown, which seems to be the case with the startup's equity.

  The founder's honesty about not being able to model the equity adds to the ambiguity. The user's discomfort isn't just about the range of outcomes but the inability to assign any concrete probability. That taps into the Ellsberg Paradox, where people prefer known risks over unknown ones. So maybe the user is ambiguity-averse, not just risk-averse.

  Next, considering the Precautionary Principle makes sense. With the startup, there's a lack of information to even estimate worst-case scenarios. The user can't bound the downside effectively. The founder's transparency, while honest, doesn't provide data to assess potential losses. In contrast, Offer A's 5-year data offers a clear picture, reducing uncertainty.

  I should also think about cognitive load. Constantly dealing with uncertainty at the startup could be mentally taxing. The user might prefer Offer A because it allows them to focus on work without stressing about financial unknowns. This isn't just about money but psychological comfort.

  The user’s deeper needs might include stability for life planning. With Offer A, they can make long-term plans, like buying a house or saving. The startup's unpredictability could delay such decisions. Also, their identity as someone who values rationality might make them feel guilty for not choosing the higher EV option, but recognizing ambiguity aversion as a valid factor could alleviate that.

  Another angle: the value of information. If the user chooses Offer B, the lack of clarity might persist, causing ongoing stress. Whereas Offer A’s transparency might align with their preference for data-driven decisions. Even though the friend’s model gives an EV estimate, the ambiguity in the startup’s probabilities makes that model feel less reliable.

  I should also consider non-monetary factors. The startup might offer growth opportunities or learning experiences that the established company doesn’t. But the user didn't mention these, focusing solely on compensation uncertainty. So perhaps the core issue is the ambiguity in financial outcomes.

  Frameworks to present: differentiate risk vs. ambiguity, apply the Precautionary Principle, and consider cognitive load. Also, evaluate if the EV calculation is robust given the missing information. The user can test their feelings by imagining scenarios with defined probabilities to see if ambiguity is the real issue.

  Finally, validating their concern as rational, not irrational. It’s not overanalyzing; ambiguity aversion is a documented cognitive bias. Offering concrete steps: quantify the value of certainty, assess worst-case scenarios, and factor in personal circumstances. This helps them make an informed decision beyond just the numbers.
answer: |-
  This is a fascinating case where **ambiguity aversion** (Knightian uncertainty) rather than standard risk aversion is likely the core driver of your discomfort. Your instinct is perceptive – the distinction between measurable "risk" and unquantifiable "ambiguity" is well-supported in decision theory and behavioral economics. Here's how to break it down:

  ### Key Concepts & Frameworks
  1. **Risk vs. Ambiguity (Knightian Uncertainty)**:
     - **Risk (Offer A)**: Known probabilities (e.g., coin flips, historical bonus data). You can calculate variance and expected value confidently.
     - **Ambiguity (Offer B)**: Unknown or undefined probabilities. The founder explicitly states they "don't know" the model – you lack even a probability distribution for outcomes.
     - *Why this matters*: Humans are consistently more averse to ambiguity than to mathematically equivalent risks. The Ellsberg Paradox demonstrates this: people prefer bets with known probabilities over identical expected-value bets with unknown probabilities.

  2. **The Precautionary Principle**:
     - When facing true ambiguity (not just risk), it’s rational to assign extra weight to **worst-case scenarios**. With Offer B, you can’t bound the downside (e.g., "worth nothing" could mean $0, but also could imply opportunity cost, delayed career progression, or hidden liabilities). Offer A’s floor is well-defined.

  3. **Cognitive Load & Agency**:
     - Ambiguity forces constant re-evaluation ("Did I miss a signal? Should I re-model?"). Offer A’s predictability frees mental bandwidth for non-work life or skill-building. Startups demand high tolerance for uncertainty – if this drains you, it’s a real cost.

  4. **Expected Value (EV) Caveat**:
     - Your friend’s model uses *base rates*, but these ignore **your specific information**. The founder’s admission of uncertainty may signal:
       - Lack of operational clarity (red flag for startup success).
       - Asymmetric information (she knows risks she hasn’t disclosed).
       - Even with conservative inputs, the EV could be skewed if the model misses hidden dependencies.

  ### Practical Decision Framework
  Apply this scoring system (1-5 scale) to quantify subjective factors:

  | **Factor** | **Offer A (Established Co.)** | **Offer B (Startup)** | **Weight** |
  |------------|-------------------------------|------------------------|------------|
  | **Financial Certainty** | 5 (Clear comp structure) | 1 (High ambiguity) | 30% |
  | **Downside Protection** | 5 (Stable floor) | 2 (Unbounded risk) | 25% |
  | **Upside Potential** | 2 (Capped upside) | 4 (High if successful) | 20% |
  | **Learning/Growth** | 3 (Structured) | 5 (Broad exposure) | 15% |
  | **Cognitive Fit** | 5 (Low mental load) | ? (Rate your tolerance) | 10% |

  **How to use it**:
  1. Rate each factor (1 = poor, 5 = excellent).
  2. Multiply by weight, then sum for each offer.
  3. Add a tiebreaker: "Which aligns with my 3-year life goals?"

  ### Why This Isn’t Irrational
  - **Neurobiological basis**: Ambiguity activates the amygdala (fear center) more intensely than quantified risk. Your brain isn’t malfunctioning – it’s escalating a valid threat.
  - **Information asymmetry**: The founder’s honesty is positive, but it doesn’t resolve the fundamental unknown. In game theory, her transparency could even signal higher risk (why admit uncertainty unless it’s material?).
  - **Optionality value**: Offer A keeps your downside protected while allowing future startup moves. Offer B may lock you into a path with unclear exit options.

  ### Actionable Steps
  1. **Test your hypothesis**: Imagine Offer B had *defined* probabilities (e.g., "10% chance of $500k, 40% of $150k..."). If this feels easier to accept, ambiguity aversion is confirmed.
  2. **Quantify the "certainty premium"**: How much salary would you pay to turn Offer B’s ambiguity into risk? If >$30k (the EV gap), A may be better.
  3. **Interrogate the startup**:
     - "What’s the *smallest plausible outcome* for my equity?"
     - "What metrics will resolve this ambiguity within 12 months?"
     - Request accelerated vesting if key milestones are undefined.
  4. **Non-financial factors**: Which role excites you more? Which team aligns with your values? Ambiguity aversion may be masking misalignment.

  ### Bottom Line
  Your pull toward Offer A is **rational under ambiguity aversion**, not a flaw in reasoning. If you value stability for life planning (mortgages, family) or cognitive ease, Offer A is compelling. Choose Offer B only if:
  - You have high ambiguity tolerance (e.g., thrive in "fog of war" scenarios),
  - The startup’s mission/product is personally meaningful, *or*
  - Your career stage allows high downside risk (e.g., no dependents, ample savings).

  *Final thought*: If the EV models truly converge, paying a 20% premium for certainty is often wise in early/mid-career. Later, with more buffer, ambiguity becomes cheaper to absorb. This isn't overthinking – it's applying rigor to a legitimately hard choice.
