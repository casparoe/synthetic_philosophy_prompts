  Here’s a draft of your commencement address that honors your journey, acknowledges Parfit’s challenge, and offers a philosophically robust call to action—all in under 8 minutes. It avoids technical jargon while respecting the graduates’ expertise:

  ---

  ### Draft Commencement Address: "The Glacier and the Gift"  

  **Opening:**  
  "Thirty years ago, I drilled a core of Antarctic ice 800,000 years deep. Every layer was a time capsule—trapped air from eras when humans weren’t yet *Homo sapiens*. I used to imagine handing that core to someone 800,000 years from now. Today… I’d frame that gesture differently. Let me explain why—and why it matters for all of you.  

  **The Shift:**  
  For decades, I said our environmental failures harmed *specific* future people. If you’d asked me last year, I’d have urged you: ‘Protect your grandchildren from the world we’re creating.’ It’s intuitive. It’s moving. And—as some of you know—it’s philosophically incomplete.  

  **The Puzzle:**  
  Policy choices change the course of human lives in ways that reshape *who exists*. The future population in a depleted world isn’t the same group who’d live in a conserved one. If their lives are livable—if they laugh, love, and find meaning—can we truly say *they* were ‘harmed’ by our choosing depletion?  
  *(Pause)*  
  This isn’t hypothetical. It’s Derek Parfit’s ‘non-identity problem,’ and it unsettled me. If the ‘harm’ argument frays under scrutiny, what’s left?  

  **The Bridge:**  
  Three realizations reshaped my thinking—and they’re why your work matters more than ever:  

  1. **We steward a shared story, not just individuals.**  
     Civilizations are defined by what they pass forward: art, institutions, stable climates. When we degrade Earth’s systems, we don’t just alter *who* inherits the future—we shrink *what* they inherit. We leave them a world with fewer wonders, fewer options, more chaos. That diminishment is real—even if the beneficiaries change.  

  2. **We owe continuity, not just existence.**  
     My ice cores held more than data; they held continuity. Each layer connected epochs. You’re inheritors of that chain. Your task isn’t just to ensure people *exist* in 2124—it’s to ensure they inherit a world where progress is still possible. Where they can write *their* chapter—not spend their lives repairing ours.  

  3. **The gift is in the gesture.**  
     When I handle 800,000-year-old ice, I’m not thinking ‘I owe this to Emily, born 3024 AD.’ I think: *This is precious. I will not break it.* That’s not a contract with a stranger. It’s fidelity to something larger than personhood—to life’s capacity for awe, discovery, and care.  

  **The Call:**  
  So I won’t say, ‘Do this for your grandchildren.’ I’ll say: Do it because you’re the first generation trained to see the Earth whole—as a dynamic system, an archive of deep time, and a legacy we hold in trust.  

  Do it because when you choose conservation over depletion, you’re not just changing *who* comes next—you’re giving *whoever comes* a foundation worthy of their dreams.  

  Do it because humanity’s story shouldn’t peak with us.  

  **Closing:**  
  My ice cores were messages from deep time. Yours is a message *to* deep time. Write it in thriving wetlands, in resilient grids, in policies that honor the improbable gift of our moment.  

  Build a world where future generations—*whoever they are*—open our chapter and whisper: ‘They saw farther than their own horizon.’  

  Congratulations. Welcome to the work."  

  ---

  ### Why this works:
  1. **Acknowledges complexity without lecturing:**  
     - References Parfit obliquely ("philosophically incomplete," "this isn’t hypothetical") but doesn’t drown non-specialists in jargon.  
     - Graduates will recognize the non-identity problem; parents hear a relatable moral puzzle.  

  2. **Replaces "harm" with richer imperatives:**  
     - **Stewardship:** Shifts focus to preserving *what* is passed on (options, stability, beauty).  
     - **Continuity:** Emphasizes intergenerational connection as a cultural project.  
     - **Gift-giving:** Framing action as generosity sidesteps Parfit while feeling more inspiring.  

  3. **Leverages your credibility:**  
     - Glacier/ice core imagery roots abstraction in your lived experience.  
     - Shows intellectual growth ("This unsettled me") without undermining authority.  

  4. **Actionable resonance:**  
     - "Build a world where future generations—*whoever they are*—open our chapter…" offers a Parfit-proof mission.  
     - "Your task isn’t just to ensure people *exist* […] it’s to ensure they inherit a world where progress is still possible" reframes success.  

  **Delivery Tip:** Pause after "can we truly say *they* were ‘harmed’…?" Let the tension sit. When you follow with "Three realizations reshaped my thinking," it signals resolution—not paralysis.  

  This speech honors your peers’ expertise, avoids oversimplification, and gives graduates a narrative they can wield when *they* face the "Why bother?" question. It doesn’t "solve" Parfit—it finds purpose beyond him.
