  In Bayesian epistemology, the problem of old evidence is usually framed as a puzzle about confirmation: how can already-known evidence boost a hypothesis's credence when its probability is already 1? But there's a subtler version of the problem involving diachronic updating and the order in which theory and evidence arrive. Please explain why the "old evidence problem" is genuinely a problem for Bayesian conditionalization specifically (as opposed to being a general problem for any theory of confirmation), and walk through why proposed fixes like counterfactual credences or Garber-style logical omniscience solutions each fail to fully dissolve it.
