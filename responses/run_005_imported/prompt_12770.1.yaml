  ## The Scholarship Gamble: Utility vs. the Coin Flip

  **Setting:** A stark university committee room. Late afternoon light slants across a single scholarship dossier on the table. **ELARA** (mid-40s, sharp, analytical, leans forward intently) and **SILAS** (late 50s, thoughtful, carries an air of moral weight) face each other.

  **SILAS:** ...and that’s why the coin flip *isn’t* just another option tied with giving it outright to Anna or Ben. It’s *distinctly* better. It’s the *only* fair way when they’re truly identical in merit and need. Harsanyi’s math might tie them, but fairness demands we strictly prefer the random procedure.

  **ELARA:** (Leans back, steeples fingers) Silas, I understand the *intuition*. Truly. But Harsanyi’s theorem isn’t just ‘math’. It’s the logical consequence of demanding rationality at *every* level – individual *and* social. If we both agree Anna and Ben are symmetric – identical utility functions, identical circumstances, identical expected utility gain from the scholarship – then *any* social ranking that strictly prefers the coin flip violates the axioms. It’s logically inconsistent.

  **SILAS:** Inconsistent with *what*, exactly? The axiom that says society must be indifferent between lotteries that yield the same probability distribution over final outcomes? That’s precisely the point Diamond made! That axiom *assumes away* the value of the procedure itself. It begs the question against fairness! We’re saying the *process* of giving them equal chances *matters*, even if the final utility distribution is identical to giving it outright to one or the other.

  **ELARA:** But *where* does that value reside? If it’s not captured in the individuals' utilities, what is it? A ghost in the machine? Let’s dissect your intuition. Is it risk-aversion? Society disliking the *certainty* of knowing one person is arbitrarily favored? But that’s a preference society *could* have! It would show up in the social utility function as an aversion to unequal outcomes *even when expected utility is identical*. Harsanyi’s framework *can* accommodate that – it just means social utility isn’t *solely* the sum of individual utilities, but includes an inequality aversion term. But that’s a *different* social welfare function, violating the Pareto condition or linearity! Diamond’s point is deeper: he’s saying even *without* such aversion, the procedure matters.

  **SILAS:** Exactly. It’s not about disliking the outcome. It’s about respecting the *persons*. Giving it outright to Anna tells Ben: "Your equal claim, your equal need, your equal potential – they count for nothing. You lose because of brute luck in the committee's arbitrary choice." The coin flip tells *both* of them: "We acknowledge your claims are truly equal. We lack the wisdom or the right to choose between you definitively. So we submit to chance, giving you both an *equal opportunity*." *That* act of recognition – the *ex-ante* equality of opportunity – carries moral weight. It affirms their equal standing. That’s the value Harsanyi misses.

  **ELARA:** But how is that value *not* captured in their individual utilities? If Ben feels disrespected by not getting a fair shot, that’s a *disfutility*! It should lower his utility in the 'give to Anna' scenario. If Anna feels the process was fairer with the coin flip, that’s a *utility gain*! If we’ve truly specified their utilities *comprehensively* – including their sense of being treated justly – then the coin flip *should* yield higher *expected utility* because it avoids those procedural disutilities. If it doesn’t, then by your own description, Ben *shouldn’t* feel disrespected, and Anna *shouldn’t* feel the process was fairer. The intuition vanishes. Diamond’s symmetry case only bites if we *insist* on defining utilities narrowly, excluding procedural preferences, and *then* demand a social value for procedure that can't be reduced to those utilities. But why define utilities so narrowly? Harsanyi’s framework urges us to be *complete* in our utility accounting.

  **SILAS:** (Sighs, rubs temple) You’re trying to fold procedural fairness *back* into outcome utility. But that distorts what fairness *is*. It makes it contingent on people *feeling* bad about unfairness. What if Ben is stoic? Or conditioned to accept arbitrary authority? Does his lack of measurable disutility make giving the scholarship arbitrarily to Anna *fair*? No! Fairness is an objective feature of the *action*, not just a subjective feeling. The coin flip *is* fair, intrinsically, because it gives equal ex-ante chances, *regardless* of whether Anna or Ben later feel good or bad about the procedure itself. Harsanyi’s axioms force us to judge actions *only* by their consequences – the final distributions of goods and feelings. But fairness is partly about *how* we arrive at those consequences. The lottery *is* the fair action, distinct from its outcomes.

  **ELARA:** And there’s the rub. Harsanyi’s axioms *are* consequentialist. They say: if two actions lead to identical probability distributions over all possible states of the world – including all psychological states, all feelings of fairness or unfairness – then society *must* be indifferent between them. Diamond’s coin flip *does* lead to the *same* probability distribution over final outcomes (50% Anna gets scholarship, 50% Ben gets scholarship, with all attendant feelings) as giving it outright to one or the other *if we’ve fully accounted for utilities*. Your ‘objective fairness’ seems to demand we value something *over and above* the actual experiences and well-being of Anna and Ben in all possible worlds. What *is* that thing? And why should it trump the rational aggregation of their own preferences over risky prospects, which is what Harsanyi builds from?

  **SILAS:** It’s the value of *impartiality in action*. Of not *exercising* arbitrary power when reason cannot distinguish between claims. The Aggregator sees only the landscape of possible outcomes. The Fairness Advocate sees the *path* taken. When reason is exhausted, flipping the coin isn't just a way to *get* to an outcome; it *is* the morally required act of humility. It treats the claimants as moral equals in the decision *process*, not just in the abstract evaluation of outcomes. Harsanyi’s social utility function, even a weighted sum, is blind to that path. It sees only the destination map. Diamond points out that sometimes, the only way to reach a destination justly *is* by a specific path – the random one. Ignoring that makes the Aggregator’s rationality feel... morally hollow, regardless of its internal consistency.

  **ELARA:** (Quietly) And ignoring the internal consistency makes the Fairness Advocate’s position feel... mystifying. Like invoking a moral fifth force. If we can’t ground it in the experiences or rational preferences of the people involved, on what basis do we assert its authority? Isn’t insisting on the coin flip itself an exercise of power – imposing a value *you* hold, but which, by your own stipulation of symmetry, Anna and Ben *don’t* register in their utilities? Are we being fair *to them* by valuing something they don’t?

  **SILAS:** Or are we recognizing a duty *to* them that exists independently of their current preferences? A duty to treat equals equally, manifested through procedure? Perhaps Harsanyi derived *a* utilitarianism, but not the *only* possible rational social ethics. Diamond’s challenge suggests rationality might demand more than a weighted sum when reason runs out.

  *(A long silence hangs in the room. The scholarship dossier lies untouched between them. Elara stares at the table, the elegance of the theorem warring with the persistent pull of Silas’s point. Silas watches her, the moral clarity of the coin flip tempered by the unnerving coherence of her challenge. Neither looks entirely convinced by the other. Neither looks entirely sure.)*

  **Final State:** Genuine philosophical stalemate. The core disagreement – whether rational social choice under uncertainty *must* be strictly consequentialist (evaluating only outcome distributions) or can incorporate intrinsic procedural values – remains unresolved. Elara effectively argues that procedural preferences *must* be captured in comprehensive utilities or they become incoherent ghosts. Silas effectively argues that fairness is a deontic constraint on action that exists prior to, and can override, consequentialist calculations even with comprehensive utilities. The dialogue forces both to confront the limitations of their starting axioms without providing a clear resolution, leaving the tension between Harsanyi's aggregation and Diamond's critique vibrantly intact.
