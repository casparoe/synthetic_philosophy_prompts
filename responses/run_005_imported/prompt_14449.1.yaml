        },
        {
          "name": "Williams' Critique of External Reasons",
          "max_points": 4,
          "description": "Explains Williams' argument that external reasons are incoherent/incomprehensible: they collapse into internal reasons if motivational, or lack explanatory content if not. Mentions the challenge to truth/meaning.",
          "student_score": 3.5,
          "comment": "Very good on motivational/explanatory incoherence. Minor omission: could slightly emphasize Williams' point about the difficulty specifying truth conditions for external reasons."
        },
        {
