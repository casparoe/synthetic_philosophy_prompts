  First, I need to map the core challenge: any democratic procedure to define membership presupposes existing members, creating infinite regress. Näsström's constitutional authorship paradox and Goodin's AAI solution (with its radical unbounded implications) set the stage. Abizadeh's border control critique then destabilizes the All-Subjected alternative. 

  The key angles to evaluate:
  - Does AAI's inclusivity resolve or merely displace the regress? (Goodin embraces global franchise; students call it reductio)
  - Can All-Subjected handle Abizadeh's coercion-at-borders argument? 
  - Is there a third path or is insolubility inevitable?

  I recall Whelan's original framing: circularity seems inescapable because "the people" must preexist their self-definition. This feels structurally similar to foundational paradoxes in other fields - like set theory's Russell Paradox where "the set of all sets not containing themselves" can't exist without contradiction. 

  For AAI: Goodin's probabilistic effects argument does logically point toward global inclusion, but at the cost of practical coherence. If my choice of breakfast tea affects Sri Lankan farmers' interests (through trade ripple effects), must they vote on it? The principle melts decision-making capacity. This isn't solving regress - it's accepting boundarylessness as "solution" by elimination.

  For All-Subjected: Abizadeh's move is devastating because border enforcement does coerce outsiders. If subjected means "subject to power's effects," it collapses into AAI; if it means "formally governed," it's question-begging. Either way, the bounded demos remains unjustified.

  So where does that leave us? Perhaps the answer lies in distinguishing between constitutive and constituted moments. No "pure" democratic founding exists - all polities emerge from historical contingencies (wars, migrations, bargains). The regress stops not by logic but by acknowledging pre-political foundations: shared geography, language, or simply the brute fact of existing institutions. 

  This isn't democratic circularity but historical anchoring. Subsequent boundary adjustments then occur through democratic processes authorized by that inherited framework. The objection "But why accept that origin?" misses that legitimation flows forward: a people constitutes itself by maintaining, reforming, or revolting against inherited structures.

  Strongest counter: Doesn't this justify any status quo, however unjust? Response: Historical contingency ≠ moral endorsement. Democratic legitimacy requires that current members can contest boundaries through inclusive processes - precisely what Abizadeh demands for borders. But the agency to redesign belongs to those already subjected, extending outward where power imposes costs.

  This third way accepts the regress as theoretically insoluble yet practically resolved through path-dependent people-making. The alternative is paralysis. We don't reject democracy because toddlers can't vote; we construct bounded demoi while expanding inclusion where coercion demands it. 

  Final position: The boundary problem dissolves when we shift from seeking timeless justification to evaluating ongoing democratic integrity within contingent frameworks. All-Subjected best guides inclusion reforms without pretending to found the whole edifice democratically ex nihilo.
answer: |-
  ## The Boundary Problem: Dissolving the Regress Through Democratic Practice

  The boundary problem presents a formidable challenge: any democratic procedure to define the demos presupposes a prior, bounded group authorized to make that definition, creating an infinite regress or vicious circularity. Sofia Näsström amplifies this into the claim that a people cannot self-author its constitution. While Robert Goodin’s All-Affected-Interests (AAI) principle and the All-Subjected Principle offer competing solutions, both stumble over the regress in distinct ways. Ultimately, neither principle *fully* escapes the foundational circularity in a purely *theoretical*, *a priori* sense. However, the problem is **dissolved, not solved, by embracing the historical and practical nature of democratic constitution-making within the framework provided by the All-Subjected Principle, critically applied.** Let’s dissect the regress, the failures of AAI and naive subjection, and why this practical, historically-grounded approach survives scrutiny.

  ### The Regress Argument: Unpacking the Core Challenge
  The regress is powerful because it highlights democracy's inherent presupposition:
  1.  **Decision Requires Demos:** Any legitimate democratic decision (e.g., defining membership, adopting a constitution) requires an authorized demos.
  2.  **Demos Requires Prior Boundary:** This demos must itself be bounded *before* the decision can occur. Who authorizes the *first* constitutive act?
  3.  **Circularity:** Any attempt to define the demos democratically (Step 1) requires a prior demos (Step 2). This creates a logical loop. Founding moments appear inherently *undemocratic* because they lack prior democratic authorization. Näsström is right: a people cannot democratically author its *own* original constitution *ex nihilo* without presupposing itself.

  ### Why AAI Fails to Escape (and Intensifies the Problem)
  Goodin’s AAI principle ("everyone affected gets a say") seems intuitively fair. Its radical inclusivity – embracing probabilistic, indirect, and potential effects – aims to ground inclusion objectively. However, it fails to resolve the regress and creates new, insurmountable problems:

  1.  **Relocates, Not Resolves, the Regress:** AAI doesn't define *who decides what counts as an "effect" or "interest."* Determining the scope of "affectedness" is itself a constitutive decision requiring prior authorization. Does my choice of breakfast tea "affect" Sri Lankan tea farmers? Does a US policy affecting global markets "affect" everyone? Drawing the line requires a prior decision-maker – the very bounded group AAI seeks to avoid presupposing. The regress moves from "who is in the demos?" to "who defines 'affectedness'?".
  2.  **The Practical Implosion (Reductio Ad Absurdum):** Goodin embraces near-universal inclusion, but this is the principle’s fatal flaw. An unbounded demos for *every* non-trivial decision is operationally impossible. It destroys the capacity for collective agency and renders decision-making incoherent. Your students are correct: this *is* a reductio. Democracy requires bounded agency to function; AAI, consistently applied, dissolves the very possibility of a *demos* capable of acting.
  3.  **Epistemic Arrogance:** AAI assumes we can objectively map all potential effects across the globe and through time. This is an impossible epistemological burden. Decisions about who is "affected enough" are inherently political judgments, not discoverable facts, again requiring prior authorization.

  AAI doesn't solve the boundary problem; it transforms it into an unworkable demand for infinite inclusion, demonstrating why *some* boundedness is a prerequisite for democratic action, even if its *initial* justification isn't purely democratic.

  ### Why a Naive All-Subjected Principle Also Stumbles
  The All-Subjected Principle ("only those subject to binding power get a say") initially seems more bounded and realistic. However, Abizadeh’s border argument exposes its vulnerability:

  1.  **The Coercion of Exclusion:** Abizadeh correctly argues that border enforcement *is* an exercise of coercive power directly *upon* those seeking entry (or even those deterred). If "subjected" means "subject to the jurisdiction's *coercive force*," then border enforcement clearly subjects non-members. Excluding them from decisions *about* that enforcement violates the principle itself.
  2.  **The Regress of "Subjectedness":** Similar to AAI, defining the precise scope of "subjected" requires a prior decision. Does mere exposure to indirect effects (e.g., pollution, economic spillovers) count? Or only direct legal coercion? Who decides *this*? The regress simply shifts to defining the nature and threshold of "subjection." Furthermore, the principle presupposes an existing jurisdiction *to be subjected to* – which itself required a prior boundary.

  A naive "only current legal subjects" version is circular and ignores the coercive power exercised *at* the boundary itself.

  ### The Path Forward: Dissolution through Democratic Practice and Critical Subjection
  The theoretical regress is genuine and insoluble *at the moment of pure, abstract founding*. No principle generates a demos *ex nihilo* without circularity. **However, this does not mean democracy is impossible or boundaries are unjustifiable. It means we must shift perspective from abstract justification to historical practice and ongoing democratic legitimacy within a framework guided by the All-Subjected Principle, interpreted dynamically.**

  1.  **Accepting Historical Contingency:** Demoi do not emerge from philosophical vacuums. They arise through complex historical processes – shared geography, common threats, cultural ties, revolutionary breaks, or imposed structures. The *initial* boundary is always contingent and non-democratic (e.g., war, colonization, dynastic marriage). This is the brute fact Näsström highlights. Democracy doesn't *create* the initial people; it *emerges within and transforms* an existing, contingent political community.
  2.  **The All-Subjected Principle as the Guide for *Inclusion* (Not Initial Definition):** We cannot democratically justify the *absolute origin* of a demos, but we *can* and *must* use the All-Subjected Principle to critically evaluate and democratize its *ongoing composition and boundaries*. This principle provides the strongest normative standard for demanding inclusion:
      *   **Internal Challenge:** It demands maximal inclusion *within* the existing jurisdiction for all clearly subjected individuals (e.g., universal suffrage for residents).
      *   **Boundary Challenge:** It forces critical scrutiny of the coercive power exercised *at* the borders (Abizadeh's point). Decisions *about* border enforcement *do* coercively subject outsiders. Therefore, legitimacy requires finding ways to give those affected by border control *a voice* in shaping those policies, even if not full membership in the *internal* demos governing everything else. This could mean transnational consultation, special representation mechanisms, or international agreements – pushing towards more inclusive *decision-making about coercion*, not necessarily erasing all boundaries.
      *   **Focus on Coercion:** It grounds inclusion claims in the concrete experience of being bound by rules enforced by power, avoiding the epistemic quagmire of "affected interests."
  3.  **Dissolving the Regress through Democratic Agency:** The regress stops not by pure principle, but by recognizing the *constituted* democratic people as having the *practical agency* and *responsibility* to (re)define itself, guided by the normative imperative of including the subjected. The existing demos, born of history, uses democratic procedures (authorized by its existing, contingent constitution) to debate and revise its boundaries, striving to align them with the All-Subjected ideal. The circularity exists, but it’s *practically broken* by historical fact and the ongoing project of democratic self-correction. The legitimacy flows not from the purity of the origin, but from the commitment to make the *current* exercise of power accountable to those it binds.

  **Meeting the Strongest Objection Head-On:**

  *   **Objection:** "This is just sanctifying the status quo! You admit the initial boundary is arbitrary and coercive, and then say the powerful group gets to decide who to include, potentially perpetuating exclusion. Abizadeh shows border control *is* subjection – why isn't full inclusion required *now*?"
      *   **Response:** This objection conflates the descriptive reality of origins with the normative prescription. Accepting historical contingency is not endorsing it. The critical All-Subjected Principle *directly challenges* the status quo. It demands that the *existing* demos:
          1.  **Maximize Internal Inclusion:** Ensure all within the jurisdiction subjected to its laws have full democratic rights.
          2.  **Acknowledge and Mitigate Border Coercion:** Recognize that border control subjects outsiders and therefore requires *justification to them*. This necessitates institutional innovation: consultative bodies for affected communities, weighted input in border policy decisions, robust asylum rights, or pursuing cosmopolitan agreements that reduce the unilateral coercive power of borders. It demands *democratizing the boundary-setting process itself* by including voices of the subjected outsiders, *without* necessarily granting them identical status in *all* internal decisions. The principle forces constant critical pressure towards more inclusive justification, preventing complacency with arbitrary exclusion, while acknowledging the practical necessity of *a* bounded demos for governance. It avoids the AAI trap of demanding the impossible (universal inclusion for all decisions) while providing a concrete, powerful standard for critique and reform grounded in the reality of power and coercion.

  **Conclusion: The Dissolution, Not the Solution**

  The boundary problem's theoretical regress is insoluble for a pure, abstract founding moment. Neither AAI nor a naive All-Subjected Principle escapes it; AAI implodes practically, while naive subjection ignores the coercion of boundaries. However, the problem is **dissolved** by recognizing that democracy operates in history. Existing demoi, constituted through contingent processes, possess the practical agency to redefine themselves. The **All-Subjected Principle, critically applied as a dynamic standard for demanding inclusion and justifying coercion**, provides the essential normative compass for this ongoing democratic project. It forces the bounded demos to confront the coercive implications of its boundaries and strive to make the exercise of its power accountable to all those it actually binds. Democracy's legitimacy lies not in a mythical pure beginning, but in its relentless, self-critical effort to align its boundaries with the fundamental imperative: that those subjected to power must have a voice in its exercise. This is the verdict: the regress stands as a theoretical truth, but democratic practice, guided by the critical force of the All-Subjected Principle, dissolves its paralyzing power in the real world of politics.
