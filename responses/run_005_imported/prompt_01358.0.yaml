answer: |-
  The gas lamps hissed like disapproving librarians as Professor Alistair Thorne adjusted his spectacles. Outside the heavy drapes of the Cambridge drawing room, the world was grey and rational. Inside, the air hung thick with anticipation and the faint scent of camphor and nervous sweat. Opposite him, bathed in the dim, reddish glow shielded by a silk screen, sat Madame Elara Vespera, the current sensation of the spiritualist circuit. Her hands rested lightly on the small, polished table between them.

  Thorne’s own hands, knotted with arthritis, rested beside his meticulously kept notebook. He wasn’t here for thrills. He was here for *proof*.

  For decades, Thorne had wrestled with the abyss his own intellect had opened. His masterwork, *The Calculus of Conscience*, laid bare the "Dilemma of Dual Reason." Pure logic, he’d argued with devastating clarity, could not definitively prove that sacrificing one’s own deepest good for the greater good of others was *rational*. Why should Reason, cool and impartial, demand self-immolation? Why choose the freezing water to save a stranger when staying warm and dry on the lifeboat was equally logical? Only a guarantee – a *cosmic postulate* – could tip the scales: the assurance that virtue, ultimately, *was* rewarded, that the scales of justice balanced beyond the veil of death. Without it, the noble edifice of universal benevolence risked crumbling before the sheer, undeniable force of rational self-interest.

  Hence the séances. Hence the years spent in dim rooms, listening to rappings, observing floating trumpets, taking notes on ectoplasmic manifestations. He’d co-founded the Society for Psychical Inquiry precisely to find that missing postulate, not through faith, but through *evidence*. Empirical proof of survival would be the keystone holding his ethical universe together.

  Madame Vespera sighed, a theatrical sound. "They gather... the vibrations are strengthening... Aunt Agatha... she has a message... for the Professor..."

  Thorne’s pen hovered. Aunt Agatha had been a formidable woman in life, sharp-tongued and skeptical. In death, according to Vespera, she’d become a font of saccharine platitudes.

  A cold draft, inexplicable in the sealed room, brushed Thorne’s cheek. The table trembled. Then, with a distinct *thump*, it lifted an inch off the carpet, hovered, and settled back down. Gasps rippled through the small circle of observers – Thorne’s trusted colleagues, Eleanor Vance and Dr. Bernard Finch.

  "Remarkable!" breathed Finch, his usual skepticism momentarily suspended.

  Thorne’s eyes, however, were not on the table, but on the space *beneath* it. The dim light was tricky, but he’d positioned himself carefully. He saw it: the faintest shift of shadow near Madame Vespera’s feet, the subtle tensing of her ankle beneath the heavy tablecloth. His heart, which had leapt for a fraction of a second, sank like a stone. *Weight distribution. Leverage.*

  "Madame Vespera," Thorne’s voice was calm, cutting through the awed silence. "Would you be so kind as to place your feet flat on the floor, directly in front of you? Where I can see them clearly?"

  A flicker of annoyance crossed the medium’s face, quickly masked by serene detachment. "The spirits require freedom, Professor. Constriction hinders the flow."

  "Indulge me," Thorne pressed, his gaze unwavering. "For the record."

  Reluctantly, Vespera shifted her feet forward into the patch of slightly brighter light cast by a shielded lamp. The next time the table trembled and began to rise, Thorne saw it clearly: the slight outward pressure of her knee against the table leg, the counter-pressure of her foot bracing against the floor. It wasn't spirit; it was simple, skillful mechanics.

  "Thank you, Madame," Thorne said quietly, making a precise note in his book: *'Lift achieved via lateral pressure from right knee. Foot braced for counter-leverage. No observable anomalous force.'*

  He felt Eleanor’s disappointed gaze. Finch looked embarrassed. Vespera’s serene mask hardened into something brittle.

  Later, in Thorne’s book-lined study, the air thick with the smell of pipe tobacco and defeat, Eleanor spoke. "Alistair... must you be quite so... thorough? Every promising lead... Eusapia last year, now Vespera... you dismantle them yourself. What if... what if the *real* evidence slips through because we’re looking too hard?"

  Thorne stared at the leather-bound spine of *The Calculus of Conscience*. It felt heavy with unfulfilled promise. "What good is evidence, Eleanor, if it cannot withstand scrutiny? A postulate built on sand will not hold the weight I need it to bear. My ethics demand truth, not comforting illusion."

  "But your ethics *need* the postulate!" Finch argued, frustration edging his voice. "Without it, your whole system... it’s magnificent, Alistair, but it hangs on nothing! Reason itself shows its own limitations. You proved that! Must your relentless reason also destroy the only possible bridge across that chasm?"

  Thorne turned to the window. The Cambridge spires were sharp silhouettes against the twilight sky. The dualism yawned within him, vast and cold. *Reason demanded the postulate.* Reason, wielded with scrupulous honesty, dismantled every empirical candidate for it. The investigator in him couldn't fabricate evidence, couldn't ignore the tell-tale shift of a foot, the hidden wire, the accomplice in the cabinet. The ethicist in him couldn't base a universal duty on a comforting lie.

  He saw the lifeboat on the freezing sea. He saw the stranger drowning. Reason whispered *both* options: save yourself, save the other. Without the cosmic guarantee – the promise that virtue *mattered* in a way that transcended the cold equations of mortal loss – why choose the water? Why choose the lesser portion for yourself, forever?

  He had built a lighthouse of logic, only to discover it stood on a foundation that required another light, shining from a shore he couldn't prove existed. And his own unwavering commitment to truth was the gale relentlessly extinguishing every hopeful glimmer on the horizon.

  "The bridge," Thorne murmured, his voice hoarse, "must be real, Bernard. It *must* be real. And I... I seem uniquely equipped to prove only that the chasm is deep, and the plans for the bridge... flawed." He tapped his notebook, filled with meticulous records of failure. "The search continues. The methodology remains. What else can I do?"

  He didn’t look at his colleagues. He looked out at the gathering dark, the unyielding stone of the rational world, and the silent, implacable void beyond, where the answer he needed – the answer his life’s work, his very conception of the good, depended upon – remained stubbornly, devastatingly, empirically absent. His honesty was the lock. His need was the key. And they fit together only to turn the mechanism that kept the door firmly shut.
