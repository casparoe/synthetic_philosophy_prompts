  Here’s the scene—sharp, lived-in, with the kind of shorthand only siblings who’ve rehashed this for years can manage. The setting is their dad’s crowded, slightly stuffy retirement party in a university faculty club. Background chatter and clinking glasses underscore the argument.

  **Characters:**  
  - **ELARA (late 30s):** Cosmologist, pragmatic, waves away paradoxes with a physicist’s shrug.  
  - **LEO (mid 30s):** Ex-philosophy PhD, perpetually haunted by epistemic dread.  

  ---

  **The Scene:**  

  Leo swirls cheap champagne in his plastic cup, eyes fixed on Elara across the high-top table. Their dad’s laughter booms from across the room, oblivious.  

  **LEO:**  
  (sniffs)  
  Still believe the universe is mostly empty? After all this time?  

  **ELARA:**  
  (taking a deliberate sip)  
  Statistically inevitable, Leo. Basic cosmology.  

  **LEO:**  
  Basic? Right. Because *armchair cosmology* told you there’s a septillion lifeless rocks for every one of us.  

  **ELARA:**  
  It’s not *armchair*. It’s Bayesian inference. If the universe *weren’t* vast, we wouldn’t be here to see it. SIA—  

  **LEO:**  
  (cuts her off, leaning in)  
  —Self-Indication Assumption. Yeah, I remember. "I exist, therefore the universe *must* be huge." It’s solipsism with equations.  

  **ELARA:**  
  (exasperated)  
  It’s not *solipsism*. It’s updating priors based on selection effects. If the universe were small and life-permitting, we’d *still* observe what we see. But if it’s vast—  

  **LEO:**  
  —then you’re *guaranteed* to exist. Convenient. But let’s pin down your precious SIA. Remember the Presumptuous Philosopher?  

  **ELARA:**  
  (sighs, sets down her cup)  
  Here we go.  

  **LEO:**  
  (voice tight, low)  
  *Exactly* here we go. Philosopher wakes up in a lab. Two theories: Theory A says there are 10 observers in the universe. Theory B says 10^100. No evidence either way. SIA says she *must* assign near-certainty to Theory B. Right?  

  **ELARA:**  
  Broadly.  

  **LEO:**  
  Broadly? Elara, she’d bet her *life* on Theory B being true. Without a shred of data! Just because it makes her existence *marginally less improbable*. That’s not science—it’s a cargo cult of probability. You’re saying sheer cosmic narcissism dictates reality!  

  **ELARA:**  
  (calm, razor-edged)  
  It’s not narcissism. It’s accounting for the fact that *she’s here to make the bet*. But fine—let’s talk about your sacred SSA.  

  **LEO:**  
  (flinches slightly)  
  Self-Sampling’s sane. You reason from *your* perspective as a random observer.  

  **ELARA:**  
  (smiling thinly)  
  Random *from where*? That’s your problem, Leo. Your whole doomsday schtick hinges on the "reference class." Who counts as "an observer like me"?  

  **LEO:**  
  Humans. Obviously.  

  **ELARA:**  
  Is it? Are you a "human observer" born in 1988? Or a "carbon-based intelligence"? Or a "sentient entity in a post-industrial society"? SSA gives you different doomsday probabilities depending on where you draw the circle. Your apocalypse math could be off by orders of magnitude because you can’t define "you."  

  **LEO:**  
  (stiffening)  
  We use the smallest reference class with adequate data. Humans.  

  **ELARA:**  
  Adequate for what? To confirm your bias? My "presumptuous philosopher" at least forces consistency. Your SSA lets you cherry-pick the reference class that makes you feel cosmically doomed. If you defined "observer" as "entities who worry about doomsday arguments," you’d be freaking out about tomorrow.  

  **LEO:**  
  (face flushed)  
  That’s a dodge. SIA *demands* absurdity. You’d believe a near-infinite universe just because it flatters your existence probability.  

  **ELARA:**  
  And you’d believe humanity ends tomorrow because you can’t handle the idea that we might *not* be special. Your SSA is just doomsday Calvinism.  

  **LEO:**  
  It’s *caution*!  

  **ELARA:**  
  It’s arbitrary. At least SIA owns its assumptions. You’re terrified of the Presumptuous Philosopher because she exposes the arrogance in *your* position—thinking your sampling is privileged.  

  *(Their father’s voice cuts through, jovial and booming.)*  

  **DAD:**  
  Kids! Enough saving the universe—come get cake before Margaret from Accounting hogs it all!  

  *(Leo glares. Elara picks up her champagne, her expression unreadable. The argument hangs, unresolved, in the sticky air.)*  

  **LEO:**  
  (muttering)  
  It’s not privilege. It’s sanity.  

  **ELARA:**  
  (sotto voce, turning away)  
  Keep telling yourself that. Maybe it’ll help when the aliens don’t show up.  

  ---

  **Key Elements Used:**  
  - **Presumptuous Philosopher Pinpointed:** Leo attacks SIA’s core "problem"—believing vast scales without evidence—framing it as epistemic arrogance.  
  - **SSA’s Reference Class Counter:** Elara doesn’t defend SIA on faith; she pivots to SSA’s fatal flaw (defining "observer") to undermine Leo’s doomsday certainty.  
  - **Sibling Dynamics:** Shortcuts ("Here we go"), old wounds ("doomsday schtick"), and dismissal ("Keep telling yourself") show history.  
  - **Tone:** Academic rigor masked by frustration, with Elara’s calm precision vs. Leo’s visceral dread.  
  - **No Resolution:** Dad’s interruption leaves the tension simmering—next round at Thanksgiving.  

  Let me know if you want more philosophical teeth, or to lean harder into the family friction!
