      *   Both sides accurately described real statistical properties.
      *   They prioritized different, incompatible fairness criteria.
      *   The differing base rates made it *impossible* for any tool to satisfy both criteria simultaneously ("no amount of retuning COMPAS could have satisfied both").
      *   Therefore, it wasn't a dispute resolvable by "better statistics" but a fundamental conflict in values/definitions.

