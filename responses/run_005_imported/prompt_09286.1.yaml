  **Grading Notes & Justification:**

  1.  **Accuracy of ProPublica Finding (2/2):** The answer perfectly captures ProPublica's key findings: higher false positive rates (FPR) for Black defendants who did not reoffend and higher false negative rates (FNR) for white defendants who did reoffend. This directly addresses calibration differences ("COMPAS's calibration differed sharply by race").
  2.  **Accuracy of Northpointe Finding (2/2):** The answer precisely describes Northpointe's defense: within each risk score category, Black and white defendants reoffended at similar rates. This is the essence of *predictive parity* (also called *calibration within groups*).
  3.  **Correctness of Impossibility Claim & Attribution (3/4):**
