answer: |-
  Here are 8 targeted questions with follow-ups designed to push past the "burden of proof" mantra and engage the core arguments, incorporating your specific requests:

  1.  **Theory Conflict Question:** "You often ground the precautionary argument in 'the science' of consciousness. But the leading frameworks—Global Workspace Theory (GWT), Higher-Order Thought (HOT), and Integrated Information Theory (IIT)—make *radically different* predictions. GWT likely excludes insects, HOT might exclude most vertebrates, and IIT potentially includes very simple systems. Given this fundamental disagreement about *what even counts* as the neural basis for sentience, how does the precautionary principle navigate this landscape without implicitly picking a favorite theory?"
      *   *Likely Dodge/Follow-up:* If she deflects by saying "all suggest some animals are sentient" or "caution still applies": *"But doesn't the specific scope of the precautionary claim—like extending it to insects or bivalves—rely heavily on *which* theory you lean towards? Applying IIT's implications as broadly as possible *is* picking a theory. How do you justify privileging the most expansive theory for precaution, rather than the most restrictive?"*

  2.  **Redescription Challenge Question:** "Let's take a concrete behavior often cited: crabs abandoning a preferred shell to avoid shock, or bees showing 'pessimism' after stress. Proponents of unconscious processing argue these are elegant examples of complex, adaptive computation driven by nociception, learning circuits, and cost-benefit modules – no need to invoke subjective 'pain' or 'dismay'. Why is the precautionary leap to sentience *necessary* here, rather than just acknowledging sophisticated unconscious machinery?"
      *   *Likely Dodge/Follow-up:* If she invokes precaution/burden of proof or says "we can't prove it *isn't* felt": *"But isn't the 'unconscious machinery' explanation *also* a valid, often simpler, scientific interpretation? Isn't the precautionary argument essentially *demanding* we interpret ambiguous evidence through the lens of sentience *despite* a viable alternative? How do we decide when complexity *requires* sentience rather than just enables complex behavior?"*

  3.  **Comparative Rankings / Probability Question:** "The precautionary principle feels most urgent where sentience is plausible but uncertain. Could you sketch a rough, comparative 'sentience probability' scale for us? For example: mammals (high), birds/reptiles/cephalopods (high-moderate), decapod crustaceans (moderate), insects (low-moderate?), spiders (low?), bivalves (very low?). Where would *you* personally place the threshold where precaution becomes *overwhelmingly* compelling versus merely speculative?"
      *   *Likely Dodge/Follow-up:* If she resists ranking or says "it's a gradient, not a threshold": *"I understand it's a gradient, but practical application often requires thresholds – like regulations starting at cephalopods/crabs. If we *must* draw a line somewhere for action (research ethics, welfare laws), where does the balance of plausibility tip strongly enough for *your* expanded precaution to mandate significant changes in how we treat those animals? Can you point to *any* taxon where you think precaution *doesn't* meaningfully apply?"*

  4.  **The 'Hard Problem' Leverage Question:** "A core challenge is the 'hard problem' – bridging neural activity to subjective experience. The precautionary principle seems to bypass this by saying 'if we see complex, pain-*like* behavior, assume experience'. But doesn't this risk conflating the *correlates* of potential consciousness (behavior, neurobiology) with consciousness *itself*? How does precaution resolve the fundamental epistemic gap?"
      *   *Likely Dodge/Follow-up:* If she uses burden of proof or "erring on the safe side": *"But isn't 'erring on the safe side' only compelling if we have *some* positive reason to suspect sentience exists in a given system? Applying it universally risks infinite regress – why not extend it to plants, or sophisticated AI? What specific *positive* evidence, even if inconclusive, makes insects/bivalves plausible candidates for sentience *beyond* just exhibiting adaptive responses?"*

  5.  **Evolutionary Cost/Benefit Question:** "From an evolutionary perspective, subjective experience seems metabolically expensive and computationally demanding. For animals with extremely limited neural resources like insects or bivalves, what is the specific evolutionary advantage conferred by *felt* experience that couldn't be achieved more efficiently through complex but unconscious reflexes and learning? Doesn't Occam's Razor lean against adding the 'extra' layer of sentience where simpler explanations suffice?"
      *   *Likely Dodge/Follow-up:* If she argues we don't know the evolutionary role or "why not both?": *"But evolutionary pressure favors efficiency. If complex unconscious processing can achieve survival-critical behaviors like avoidance, learning, and navigation in tiny brains, what selective pressure *drives* the emergence of costly subjective feels in those systems? Isn't assuming sentience without a clear adaptive benefit *adding* an unexplained complexity?"*

  6.  **Practical Implementation & Slippery Slope Question:** "Taking your expanded precaution seriously could have vast practical implications – rewilding labs, restructuring agriculture (insect farming?), even pest control ethics. How do you propose we *operationalize* this principle for, say, mosquitoes or oysters, in a way that's feasible and doesn't lead to paralysis or absurdity? Where does 'precaution' stop being a guiding principle and start becoming an impractical demand?"
      *   *Likely Dodge/Follow-up:* If she deflects to "we need societal conversation" or focuses only on clear-cut cases: *"But your argument explicitly pushes it *beyond* the clear-cut cases like octopuses. If the logic compels precaution for bivalves, doesn't it logically compel it for mosquitoes? What's the *principled* distinction within your framework that allows us to treat a mosquito fundamentally differently from a crab when both exhibit nociception and avoidance?"*

  7.  **The 'Decider' Problem Question:** "Precaution shifts the burden of proof. But proof of *non*-sentience seems fundamentally elusive – it's hard to prove a negative, especially about private experience. Doesn't this risk making the principle unfalsifiable? If we can *never* prove an animal *isn't* sentient, does precaution effectively become a permanent, non-negotiable assumption for *all* animals exhibiting any responsiveness?"
      *   *Likely Dodge/Follow-up:* If she argues this is precisely why we need precaution or emphasizes harm asymmetry: *"But if the principle is truly unfalsifiable because non-sentience can't be proven, doesn't that weaken its status as a *scientific* or *evidential* argument, making it more of an ethical axiom? How do we avoid the trap where 'precaution' becomes synonymous with 'assume sentience everywhere' regardless of emerging neuroscience?"*

  8.  **Falsifiability / Evidence Against Question:** "Finally, to test the robustness of your view: what specific type of evidence or discovery would genuinely make you *less* confident that a particular animal group (say, insects or bivalves) is sentient? What finding would constitute meaningful evidence *against* sentience in those groups within your precautionary framework?"
      *   *Likely Dodge/Follow-up:* If she struggles or gives very weak counter-evidence (e.g., "if they showed *no* response to damage" – which even plants do): *"But plants show responses without sentience. Can you describe evidence that would *positively* support the *absence* of subjective experience in a complex behaving animal, rather than just the absence of correlates? If no conceivable evidence could lower your confidence in insect sentience, doesn't that suggest the view is insulated from counter-argument?"*

  **Key Tactics Employed:**

  *   **Forcing Engagement with Theories:** Question 1 directly confronts the inconsistency in relying on "the science" when the science is deeply divided.
  *   **Challenging Behavioral Interpretations:** Question 2 & 5 demand justification for *why* sentience is necessary to explain the observed phenomena, appealing to parsimony.
  *   **Demanding Specificity:** Question 3 forces a comparative stance, moving beyond vague "maybe." Follow-ups prevent retreat.
  *   **Addressing Core Challenges:** Questions 4 (Hard Problem) and 7 (Unfalsifiability) tackle the deepest philosophical hurdles.
  *   **Exploring Implications:** Question 6 grounds the discussion in real-world consequences and potential slippery slopes.
  *   **Testing Robustness:** Question 8 is crucial – forcing her to define what could weaken her view shows intellectual honesty and tests if the position is scientific or purely axiomatic.
  *   **Anticipating Dodges:** Each follow-up is tailored to common retreat points ("burden," "gradient," "more research," "harm asymmetry," "complexity implies sentience") and pushes further.

  These questions respect the guest's core argument while rigorously probing its boundaries, assumptions, and practical implications, ensuring the conversation moves beyond the rehearsed soundbite. Good luck with the interview!
