  The deflection follow-ups are crucial. She might downplay the Grafen-Zahavi gap as semantic, so the follow-up asks if Zahavi's verbal model was incomplete. For indices, she might claim all signals have some cost, so the follow-up pushes for falsifiability. For Sidney, she might say the model is too simplistic, so the follow-up asks if human signals could similarly be cheap.

