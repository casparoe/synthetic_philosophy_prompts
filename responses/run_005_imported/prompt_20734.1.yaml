  In the reinsurance context, this means Hume might see the user's job as useful social custom ("we agree to treat models this way") but not as discovering rational obligations. Fascinating implication for the user's existential tension - their professional practice is more Humean convention than Lewisian rationality, however much the models resemble best-systems.

