  ### Constructed Counterexample: The Medical Test with a Physical Side Effect

  **Scenario:**  
  Dr. Avery, an oncologist, must decide on a treatment for a patient with a rare tumor. The tumor can be one of two types: Type A (occurring with prior probability 0.6) or Type B (prior probability 0.4). Dr. Avery has two treatment options:  
  - **Treatment X**: Highly effective for Type A tumors (cure with utility +100) but harmful for Type B tumors (disability, utility -50).  
  - **Treatment Y**: Moderately effective for Type B tumors (partial recovery, utility +40) but ineffective for Type A tumors (no change, utility 0).  

  Without additional evidence, Dr. Avery maximizes expected utility by choosing Treatment X:  
  \[
  EU(X) = (0.6 \times 100) + (0.4 \times (-50)) = 60 - 20 = 40  
  \]  
  \[
  EU(Y) = (0.6 \times 0) + (0.4 \times 40) = 16  
  \]  
  Thus, she chooses Treatment X for an expected utility of 40.  

  **Cost-Free Evidence:**  
  A genomic test can perfectly reveal the tumor type. Crucially, however, the test has an unavoidable *physical side effect*:  
  - If the test result is "Type A," it triggers a biochemical reaction that *alters the tumor microenvironment*, making Treatment X less effective. Specifically:  
    - Treatment X now only provides a partial cure (utility +60 instead of +100) for Type A tumors.  
    - Treatment X still harms Type B tumors (utility -50).  
  - If the test result is "Type B," the test has no side effect (treatments work as before).  

  The test is cost-free in terms of resources, time, and subjective burden. Dr. Avery updates beliefs via Bayesian conditionalization:  
  - Probability of test result "A": \( P(\text{"A"}) = P(\text{Type A}) = 0.6 \)  
  - Probability of test result "B": \( P(\text{"B"}) = P(\text{Type B}) = 0.4 \)  

  **Post-Test Decisions and Expected Utility:**  
  1. **If test result is "A" (prob. 0.6):**  
     - Tumor is Type A, but Treatment X now yields +60 (due to side effect).  
     - Treatment Y yields 0.  
     - Optimal action: Treatment X (utility +60).  

  2. **If test result is "B" (prob. 0.4):**  
     - Tumor is Type B.  
     - Treatment X yields -50, Treatment Y yields +40.  
     - Optimal action: Treatment Y (utility +40).  

  **Expected Utility with Evidence:**  
  \[
  EU(\text{Test}) = [P(\text{"A"}) \times 60] + [P(\text{"B"}) \times 40] = (0.6 \times 60) + (0.4 \times 40) = 36 + 16 = 52  
  \]  
  **Expected Utility without Evidence:**  
  \[
  EU(\text{No Test}) = 40 \quad (\text{from choosing Treatment X})  
  \]  
  **Result:**  
  \[
  EU(\text{Test}) = 52 > EU(\text{No Test}) = 40  
  \]  
  *This appears to confirm Good’s theorem (52 > 40).*  

  **Modification for Strictly Worse Outcome:**  
  Now, suppose the side effect is more severe:  
  - If the test result is "A," Treatment X’s efficacy drops further (utility +30 instead of +100).  
  - If the test result is "B," no change.  

  **Recalculated Expected Utility with Evidence:**  
  1. **Result "A" (prob. 0.6):** Tumor Type A, Treatment X yields +30, Treatment Y yields 0 → Choose X (30).  
  2. **Result "B" (prob. 0.4):** Tumor Type B, Treatment X yields -50, Treatment Y yields +40 → Choose Y (40).  
  \[
  EU(\text{Test}) = (0.6 \times 30) + (0.4 \times 40) = 18 + 16 = 34  
  \]  
  **Result:**  
  \[
  EU(\text{Test}) = 34 < EU(\text{No Test}) = 40  
  \]  
  Dr. Avery is strictly worse off in expectation (34 < 40) for taking the test.  

  ---

  ### Diagnosis: Exploited Premise of Good’s Theorem

  Good’s theorem relies on the following key premises:  
  1. **Single, Fixed Decision-Maker**: Only one agent acts optimally after evidence.  
  2. **Correct Conditionalization**: The agent updates beliefs via Bayesian conditioning.  
  3. **State-Action Utility**: Utility depends *only* on the world state and action, not on the evidence-gathering process itself.  
  4. **No Physical Impact of Evidence**: Evidence has no causal effect on the world state or utility function.  

  **Exploited Premise: State-Action Utility with Fixed World State (Premise 4)**  
  In this counterexample, the evidence-gathering process *alters the physical world*, violating the assumption that evidence is purely informational. Specifically:  
  - The test directly changes the tumor’s responsiveness to Treatment X (a biochemical side effect).  
  - Utility now depends on *whether the test was performed* and *its outcome*, not just the tumor type and action. For instance:  
    - Utility of (Type A, Treatment X) is **+100** *without* the test but **+30** *with* a test result "A."  
  - This makes the "world state" ambiguous: Is the state solely the tumor type, or does it include the test outcome? If we expand the state space to include the test result, the pre-test and post-test decision problems have *different state definitions*, breaking the theorem’s requirement of a fixed state space.  

  **Why Good’s Theorem Survives:**  
  The theorem holds when:  
  - Evidence is *acausally* related to the state (i.e., it only provides information).  
  - The utility function is invariant to evidence collection.  
  Here, the test *causally* affects the utility of outcomes (via side effects), placing it outside the theorem’s scope. The counterexample exploits this boundary without undermining the theorem’s validity within its intended domain.  

  **Key Takeaway for Formal Epistemology:**  
  Good’s theorem is robust in purely informational settings but fails when evidence collection physically alters the world. This highlights that Bayesian rationality assumes evidence is "inert." In real-world applications (e.g., medicine, interventions with behavioral effects), physical side effects of evidence must be modeled separately from epistemic gains.
