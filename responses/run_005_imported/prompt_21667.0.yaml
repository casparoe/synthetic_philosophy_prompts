  Possible solutions: The writer could explore why Kestrel's return feels essential. Is there another way to address the book one thread without resurrection? If not, perhaps the editor needs more convincing with specific examples of how this change improves the overall series. Alternatively, the writer might save this idea for a different story if the editor remains firm.

