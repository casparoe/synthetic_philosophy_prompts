answer: |-
  That's an excellent and historically significant question, highlighting a crucial tension within Catholic political thought. Your reading of Aquinas isn't fundamentally wrong on the *principle*, but the broader tradition introduces critical distinctions, practical concerns, and theological priorities that drastically shape its application. Here's where the nuance lies:

  1.  **Aquinas's Precise Conditions and Nuances:** Aquinas doesn't offer a simple "tyrant = killable" formula. His endorsement is heavily qualified:
      *   **Public Authority vs. Private Action:** Aquinas emphasizes that removing a tyrant should ideally be the act of "public authority" (*auctoritas publica*), not private individuals. This could mean a representative body, nobles acting on behalf of the community, or even a higher authority (like the Pope in medieval theory over emperors). Vigilante action is generally condemned. He writes in *De Regno* (On Kingship): "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power." The *multitude* acts, not an individual assassin.
      *   **Proportionality and Avoiding Greater Evil:** Removal must not cause greater harm to the common good than the tyranny itself. Aquinas warns that overthrowing a tyrant often leads to worse consequences: prolonged violence, civil war, foreign invasion, or the rise of an even worse ruler. The cure must not be worse than the disease.
      *   **"Praiseworthy" vs. "Permissible":** Aquinas uses the term "praiseworthy" (*laudabilis*) cautiously. He distinguishes it from "permissible" (*licitus*). An act can be morally praiseworthy *in principle* under specific, ideal circumstances without being generally advisable or prudent in the messy reality of fallen human politics. It's an exceptional last resort, not a standard policy.
      *   **Distinction between Usurper and Tyrant:** A ruler who gains power illegitimately (a *usurper*) has *no* claim to obedience from the start. A legitimate ruler who *becomes* a tyrant forfeits the *obligation* of obedience specifically regarding unjust commands, but the *authority* to remove him still rests with the public, not private judgment.

  2.  **The Broader Tradition's Emphasis on Order and Avoidance of Anarchy:** The Catholic tradition, drawing on Augustine's profound awareness of human sinfulness and the dangers of disorder (*tranquillitas ordinis*), prioritizes social peace and the avoidance of chaos:
      *   **Slippery Slope & Subjective Judgment:** Who definitively judges when a ruler has crossed the line into tyranny justifying death? Individuals and factions have wildly differing views. Allowing private judgment on tyrannicide opens the door to constant rebellion, vendettas, and justification for killing any disliked ruler based on subjective grievances. This threatens the very foundation of social order.
      *   **High Risk of Worse Outcomes:** History overwhelmingly shows that violent revolutions often lead to massive bloodshed, instability, economic collapse, and the rise of regimes as bad or worse than the one overthrown. The Church, valuing human life and social stability, is deeply wary of actions likely to cause such widespread suffering.
      *   **"Scandal" and Legitimizing Violence:** The Church is acutely aware that endorsing or even appearing to endorse assassination, even of tyrants, can "scandalize" the faithful (lead them into sin) and legitimize violence as a political tool more broadly, undermining respect for authority and the rule of law generally.

  3.  **The Priority of Non-Violent Means:** The tradition strongly emphasizes exhausting *all* peaceful and legal avenues before even considering force:
      *   **Remonstrance & Counsel:** Rulers should be admonished, counseled, and pleaded with to reform.
      *   **Legal & Institutional Checks:** Utilizing existing constitutional mechanisms, assemblies, courts, or appeals to higher authorities (like the Pope historically) is the preferred path.
      *   **Passive Resistance & Non-Cooperation:** Refusing to obey unjust laws or commands is often endorsed, but violent rebellion is a last resort. The overthrow itself, if necessary, should ideally be as non-violent as possible and aimed at restoring lawful order, not just killing the tyrant.

  4.  **The Development of Doctrine on Legitimate Authority:** Later thinkers, grappling with the Reformation and Enlightenment, further refined the concept:
      *   **Vitoria & Suárez:** These Salamanca School theologians heavily emphasized the role of the *community* (or its legitimate representatives) as the source of political authority. A tyrant forfeits his right to rule, but the *right to depose* resides *only* with the community acting through its legitimate structures, not with private individuals. They also stressed proportionality and last resort even more forcefully.
      *   **Condemnation of Regicide:** Following the turmoil of the French Revolution and various assassination attempts on monarchs (even unpopular ones), the 19th-century Church became even more explicit in condemning regicide and revolutionary violence, seeing it as intrinsically linked to anti-clericalism and attacks on the social order itself. Papal condemnations of groups like the Carbonari reinforced this.

  5.  **Theological Underpinnings: Sin, Authority, and Prudence:**
      *   **Original Sin:** The constant awareness of human fallibility means trusting individuals to judge and execute a tyrant correctly and without sinful motives (vengeance, ambition) is seen as extremely risky.
      *   **Authority as from God (Ultimately):** While mediated through the people (in Aquinas and later tradition), authority has a divine origin (Rom 13:1-7 is a key text). Unjust authority is a mystery of permitted evil, and removing it requires extreme caution and legitimacy. Private individuals usurping the role of divine judgment is problematic.
      *   **Prudence as the Cardinal Virtue:** Political action demands prudence above all – weighing complex circumstances, foreseeing consequences, choosing the lesser evil. The tradition judges that the prudential risks of endorsing tyrannicide almost always outweigh the potential benefits, except in the rarest, most clearly defined circumstances involving legitimate public authority.

  **Conclusion: Where Your Reading Might Need Adjustment**

  Your reading correctly identifies Aquinas's core *principle*: a ruler governing for private gain forfeits legitimacy and the *obligation* of obedience. **Where the broader tradition diverges is in its strict interpretation of who can act (public authority, not individuals), its overwhelming emphasis on the dangers and likely negative consequences of violent action, its prioritization of non-violent alternatives and order, and its deep theological wariness of human judgment and the sinfulness that fuels political violence.**

  The tradition doesn't reject Aquinas's logic; it accepts the premise but concludes that the conditions for *justly* and *prudently* carrying out tyrannicide are so stringent and the risks of abuse and disaster so high that it is virtually never to be recommended or undertaken by private individuals. Endorsing the *principle* under extreme, theoretical conditions is not the same as endorsing the *practice* in the real world. The Church's historical caution reflects a tragic realism about human nature and politics, prioritizing the avoidance of greater evils like anarchy and widespread bloodshed, even when facing manifest tyranny.
