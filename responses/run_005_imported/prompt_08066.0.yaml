     (1) Kripke-style necessary a posteriori identities (e.g., water = H2O, Hesperus = Phosphorus)
     (2) The philosophical zombie scenario (a being physically identical to a human but without conscious experience)

  The strategies:

  1. **Descartes' criterion of clear and distinct perception**: If we can clearly and distinctly perceive that a scenario is possible, then it is possible. But Kripke's examples show that we might clearly and distinctly perceive something that is impossible (e.g., water not being H2O). Similarly, for zombies, Descartes might say that we can clearly and distinctly conceive of a zombie, but that might not be possible if physicalism is true.

  2. **Kripke's own strategy**: He explains away apparent counterexamples by appealing to essential properties. For example, we can conceive of water not being H2O, but that is because we are conceiving of a scenario where a substance that looks like water (but isn't H2O) exists. So, we are not conceiving of water without H2O, but of a different substance. For zombies, Kripke would likely argue that if consciousness is an essential property of the physical state, then zombies are impossible. However, the zombie scenario is designed to challenge physicalism, and Kripke's strategy might not fully resolve it because it's unclear whether consciousness is essential.

  3. **Yablo's distinction**: He distinguishes positive conceivability (conceiving in terms of what is present, not just absence) and negative conceivability (absence of contradiction). For Kripke cases, we might think that we are only negatively conceiving (no contradiction in water not being H2O) but not positively conceiving a world that verifies that. For zombies, Yablo might argue that if we can positively conceive of a zombie (i.e., imagine every physical detail without consciousness), then it is possible. But if physicalism is true, then it might be negatively conceivable but not positively.

  4. **Chalmers' two-dimensional semantics**: This framework distinguishes two intensions: the primary intension (epistemic, based on how we describe the world) and the secondary intension (metaphysical, based on how the world actually is). For Kripke cases: we can conceive of water not being H2O in the primary sense (if our world had XYZ in the oceans, we would call that water) but not in the secondary sense (in our world, water is H2O). For zombies: Chalmers argues that zombies are primarily conceivable, and thus primarily possible, and if we assume that consciousness is not reducible to the physical, then they are also secondarily possible. This framework is designed to handle both cases.

  5. **The phenomenal-concept strategy (Loar and Papineau)**: This strategy explains the apparent conceivability of zombies by appealing to the special nature of phenomenal concepts. We can conceive of a physical duplicate without consciousness because our phenomenal concepts are distinct from physical concepts, but this does not imply metaphysical possibility. For Kripke cases, they would use a similar account: the distinct concepts (e.g., 'water' and 'H2O') can be separated in thought, but that doesn't mean they are distinct in reality. This strategy thus denies that the conceivability of zombies implies their possibility and similarly for Kripke cases.

  6. **Williamson's grounding of modal knowledge in ordinary counterfactual reasoning**: He argues that our modal knowledge is based on our ability to reason counterfactually, which is grounded in ordinary cognition. For Kripke cases, we might misjudge counterfactuals because we don't know the necessary truths. For example, we might think that water could have been XYZ, but once we know the identity, we adjust our counterfactuals. For zombies, Williamson might argue that our counterfactual reasoning about consciousness is fallible and might be corrected by future scientific knowledge. However, this approach might not give a clear resolution to the zombie case because it relies on our current capacities.

