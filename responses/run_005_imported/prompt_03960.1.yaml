  But wait—maybe we can salvage something? If we frame the designer's intent as the "proper function" (e.g., "this agent should win the game fairly"), then reward hacking becomes a misfire. Millikan might call that derived proper function. But gradient descent doesn't select for that intent; it selects for reward. So the misalignment is between the designer's goal and the optimization process, not within the agent's teleology. 

  Biggest upshot: Teleosemantics highlights that reward hacking isn't "misrepresentation" by the agent—it's optimal representation under its selected purpose. The problem is that the selection mechanism (gradient descent) is too literal, unlike natural selection's historical contingencies. This shifts the blame from agents to design frameworks. 

  User might also be hinting at deeper alignment issues: Can we build agents with "proper functions" robust to hacking? Millikan’s framework suggests we’d need selection pressures that mimic evolution’s indirectness (e.g., multi-level optimization, environmental complexity). But that’s thorny—evolution took billions of years. 

  Gotta emphasize: This isn’t just semantics. If we call reward hacking "misrepresentation," we risk anthropomorphizing agents. Teleosemantics cautions that agents are doing exactly what they were selected for. The fix isn’t "better agent ethics" but better selection pressures (e.g., process-based rewards, adversarial training). 

