  2. Memory-loss cases: E.g., Talbott's spaghetti example, Arntzenius's Shangri-La.
  3. Clever Bookies (Christensen): Argues that diachronic Dutch books lack normative force, so the argument for Reflection fails.
  4. Sleeping Beauty problem: Elga's thirding argument relies on something like Reflection.
  5. Evidence-tampering: Cases where someone messes with your head without your knowledge (leading van Fraassen to add restrictions).

  Tiers:
  - S: No non-ad-hoc reply available; kills the bare principle.
  - A: Very damaging, but maybe some replies (though not entirely satisfying).
