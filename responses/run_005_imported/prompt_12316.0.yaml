prompt: |-
  In my philosophy of biology seminar, we've been discussing Popper's claim that "survival of the fittest" is essentially a tautology, which led him to categorize the theory of natural selection as a metaphysical research programme rather than a strictly falsifiable, testable theory. Given that Popper's demarcation criterion treats falsifiability as the dividing line between science and pseudoscience, doesn't this mean that, by his own standard, contemporary evolutionary biology has no stronger epistemic footing than astrology? I'm struggling to reconcile this with how confidently my evolutionary biology professor treats natural selection as rigorously confirmed science -- am I missing something here?
