prompt: |-
  So I'm running a graduate seminar this term that pairs classic philosophy of action with the MIRI-style "embedded agency" literature (the Garrabrant/Demski sequence, if you know it), and one of my students floated a claim in office hours last week that I havent been able to shake, even though part of me thinks its too cute to actually be right. Her claim, roughly: the whole CDT-vs-EDT-vs-FDT fight over Newcomb's problem isn't really a free-standing puzzle in decision theory, it's just a symptom of embeddedness. The idea is that a genuinely Cartesian agent -- one whose action is a clean output node that the rest of the world only ever learns about via observation, the way Pearl's do-operator screens a node off from its normal causes -- could never actually be Newcomb'd, since nothing in the environment could get evidential purchase on the decision before the decision is observed. It's only once the agent's decision procedure is itself a physical/logical object sitting inside the same world as the predictor -- i.e., once you take seriously that an embedded agent's model of the world has to be smaller than the world itself, no exact self-location and so on -- that predictors and near-predictors and Newcomblike correlations stop being a contrived edge case and become the norm.

  I want you to actually build the strongest possible case for her rather than giving me the balanced overview I could write myself. So: argue for the thesis that Newcomblike problems (and therefore most of the motivation for ever leaving causal decision theory) are downstream of agents being embedded rather than Cartesian, such that a truly non-embedded agent would never need anything fancier than vanilla CDT. Get into the weeds if it helps the argument -- the grain-of-truth problem, the 5-and-10 problem, the Löbian obstacle to self-trust, whatever actually does work -- but I want a real, conclusion-having argument I could disagree with, not a survey of considerations on both sides. Sorry for any typos, grading finals while I type this.
reasoning: |-
  Okay, the user is running a graduate seminar pairing classic philosophy of action with MIRI's embedded agency literature. A student proposed that Newcomb's problem isn't a standalone puzzle but arises from embeddedness. The user wants the strongest argument for this thesis, not a balanced overview.

  First, I need to define key terms. A Cartesian agent is like Pearl's do-operator: actions are outputs screened off from causes, purely interventionist. Embedded agents are part of the world, with models smaller than reality, leading to self-reference issues.

  The student's claim is that Newcomb-like problems only exist for embedded agents. For Cartesian agents, predictors can't have evidential access to decisions before they're made. So CDT works fine for them. Embedded agents face predictors that can model their decision processes, creating correlations that CDT can't handle.

  To build the strongest case, I should start with the Cartesian agent setup. Here, the action node is isolated. Any predictor must rely on observational data, not pre-output influence. Thus, no pre-choice correlation exists. Examples like Newcomb would reduce to transparent causal problems.

  Then, contrast with embedded agents. Their decision-making is physically instantiated, so predictors can simulate them. This leads to evidential correlations. Problems like Grain-of-Truth, 5-and-10, and Lobian obstacles show that embedded agents can't fully self-model, allowing predictors to exploit this gap.

  Grain-of-Truth: Real agents can't include every detail, so predictors might have better models. 5-and-10: An agent might choose a dominated option due to logical dependencies. Lob's Theorem prevents consistent self-trust, enabling predictors to outwit agents.

  Argue that without embeddedness, CDT suffices. FDT/UDT only become necessary when agents are part of the world. Use technical points like how Cartesian agents avoid logical uncertainty because their actions aren't objects of prediction within the same model.

  Conclude that Newcomb's problem is a symptom of embeddedness. The user wants a strong, disputable argument, so emphasize that for Cartesian agents, CDT is optimal, and all decision theory debates stem from embedded contexts.
answer: |-
  Here’s the steelmanned case for your student’s thesis, argued aggressively and without caveats. I’ll build it step-by-step, targeting the core claim: **Newcomblike problems (and the need for non-CDT decision theories) are artifacts of embedded agency. A genuinely Cartesian agent would be immune to such puzzles and could optimally use CDT.**

  ### Core Definitions
  - **Cartesian Agent (CA):** An agent whose decision node is a metaphysical "prime mover." Its choice is generated *ex nihilo*, screened off from all prior causes (Pearl’s `do`-operator). The world learns of the decision *only* through observation *after* output. No physical trace or computation leading to the choice is accessible to the environment pre-decision.
  - **Embedded Agent (EA):** An agent whose decision process is a physical system *within* the universe it models. Its cognition has spatiotemporal location, consumes resources, and is subject to prediction/analysis by other systems (e.g., Omega). Its world-model must be a *strict subset* of the world itself (grain-of-truth problem).
  - **Newcomblikeness:** Any scenario where an agent’s *choice* correlates with some state of the world *despite* having no causal influence on that state, creating a tension between causal and evidential reasoning.

  ---

  ### The Argument: Why Cartesian Agents are CDT-Immune to Newcomb
  1. **The Cartesian Firewall Precludes Pre-Output Correlation**  
     In a CA, the decision node `D` has *no physical prehistory*. Before `D` is outputted:  
     - There is no *fact of the matter* about what `D` will be.  
     - No process in the universe (including predictors) can compute `D`’s value before output.  
     - Any correlation between `D` and a predictor’s state `P` must be *causal* (e.g., `P` → `D` or `D` → `P`). Evidential links via common causes are impossible because `D` has no causes.  

     **Consequence:** Newcomb’s Problem *cannot arise*. Omega cannot base its prediction on `D`’s value because `D` doesn’t exist until output. Any correlation must be spurious or causal. If Omega predicts based on *causes* of `D` (e.g., the agent’s "disposition"), then by the Cartesian premise, those causes don’t exist—`D` is acausal. CDT trivially wins: one-boxing and two-boxing are causally identical, so CDT two-boxes and gets $1,000,000 + $1,000.  

  2. **Embeddedness Creates the Predictor’s Leverage**  
     EAs fail precisely because their decision process `M` is a concrete object *inside* the universe:  
     - `M` has a physical implementation (e.g., code on a server, a brain).  
     - `M` can be simulated/analyzed by predictors *before* output.  
     - Crucially, `M` cannot contain a perfect model of itself (due to incompleteness/grain-of-truth).  

     **Result:** Predictors exploit the gap between `M`’s self-model and reality. In Newcomb:  
     - Omega simulates `M` better than `M` can self-simulate.  
     - `M`’s output `D` is logically/deterministically entailed by `M`’s state *prior* to output.  
     - Thus, `D` correlates with Omega’s prediction *even if* `M` tries to "surprise" Omega. This correlation is *logical* (not causal), forcing `M` into evidential reasoning.  

     **Cartesian contrast:** A CA has no `M` to simulate. Its choice is ontologically uncomputable until output. No logical entanglement → no Newcomb.

  3. **Grain-of-Truth and Löbian Obstacles Cement the Problem for EAs**  
     - **Grain-of-Truth Problem:** An EA’s world-model is always coarser than reality. Omega’s model of `M` is higher-fidelity than `M`’s self-model. Thus, Omega can *outcompute* `M`, creating Newcomblike correlations *everywhere* (e.g., predicting stock trades, AI outputs).  
     - **Löbian Obstacles:** An EA cannot trust its own reasoning (Löb’s Theorem). If `M` believes "I will one-box," it cannot prove this won’t lead to a contradiction. Omega exploits this by simulating `M`’s *actual* behavior, not its beliefs. CDT fails because it assumes `M` can freely choose while ignoring that its "choice" is predetermined by its code.  
     - **5-and-10 Problem:** An EA might pay $5 to avoid a process that *would have* caused it to lose $10. But this is only a dilemma because the agent’s decision logic is a *causal node* in the world. For a CA, no such loop exists—it pays $0 because its choice isn’t causally influenced by hypotheticals.  

     **Key Insight:** These are *all* instances of agents stumbling over their own footprints. Embeddedness forces self-referentiality, creating Newcomblike traps. Cartesian agents float above the muck.

  4. **Why CDT Suffices for Cartesians**  
     - CDT’s failure in Newcomb relies on *evidential* ties between choice and outcome. But for CAs:  
       - Evidential ties require pre-decision correlations (impossible).  
       - "Could I have chosen otherwise?" is nonsensical—Cartesian choices *define* "otherwise."  
     - CAs face only *causal* problems (e.g., smoking lesion). Here, CDT is optimal: it maximizes causal influence.  
     - FDT/UDT only exist to handle *logical counterfactuals*—i.e., "What if my algorithm *were* different?" But Cartesians *have no algorithm*. Their choices aren’t the output of a function; they’re uncaused inputs.  

     **Thus:** CDT isn’t "wrong" for Cartesians; it’s *complete*. Newcomb isn’t a counterexample—it’s inapplicable.

  5. **Objection: "But What About Cartesian Predictors?"**  
     Suppose a godlike Omega tries to predict a CA. By definition:  
     - Omega cannot observe the choice pre-output (no physical substrate).  
     - If Omega bases prediction on the CA’s "nature," this either:  
       - (a) Casually influences the choice (violating Cartesianism), or  
       - (b) Is uncorrelated with the choice (so no Newcomb payoff structure).  
     Prediction of a CA reduces to guessing a random number generator. No dominance violations occur.

  ---

  ### Conclusion: Newcomb as a Symptom of Embeddedness
  Your student is fundamentally correct. Newcomblike problems aren’t quirks of decision theory; they’re **pathologies of bounded agents trying to reason from within a universe that contains them**. The moment an agent is embedded:  
  - Its decision machinery becomes a legible, predictable object.  
  - Logical counterfactuals (FDT) dominate causal ones (CDT).  
  - Self-reference traps (Löb, grain-of-truth) force suboptimality without UDT-like solutions.  

  Cartesian agents avoid this because they’re *not of the world*. They don’t have "decision procedures" to predict, "outputs" to correlate, or "algorithms" to self-reference. CDT works perfectly because their choices *create* causality—they aren’t entangled in it. The entire CDT/EDT/FDT debate is thus a shadow cast by the central problem of embedded agency: **how to act when you’re made of the same stuff as the problems you’re trying to solve.** If your seminar takes nothing else from MIRI, take this: embeddedness isn’t a detail; it’s the whole game.

  *(This argument deliberately ignores practical objections—e.g., "Cartesian agents are impossible"—to isolate the theoretical claim. Disagree? Attack the Cartesian firewall: if choice requires computation, the student’s thesis collapses.)*
