  For (1): Their van Fraassen summary is spot-on. Armstrong's "necessitation" does face a grounding gap—how a second-order relation constrains first-order particulars remains metaphysically mysterious. The modal skepticism (why call it "necessitation"?) is also valid. Theo's "fixed N(F,G) with rogue F" hypothetical exposes real tension.

  For (2): The circularity charge against BSA is serious. While "explanans ≠ explanandum" avoids formal circularity, the epistemic worry persists—especially in toy worlds where the "system" is barely more than the data. Loewer's "cosmic explanation" framework helps, but doesn't fully resolve why we should treat the summary as explanatory. Might need to invoke pragmatic virtues (simplicity/strength) as genuinely explanatory.

