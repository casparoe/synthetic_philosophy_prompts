answer: |-
  Your reading captures a crucial turning point in philosophy of science, but overgeneralizes the implications of Miller and Tichý's theorem. Here's a precise breakdown of what they proved, what it *didn't* prove, and how verisimilitude research evolved:

  **1. The Miller-Tichý Theorem (1974): What it Actually Proved**
  *   **Target:** Popper's *specific, syntactic definition* of verisimilitude (1963, refined in 1972).
  *   **Popper's Definition (Simplified):** Theory A has more verisimilitude than Theory B if:
      *   A's true consequences include all of B's true consequences (or more), *AND*
      *   A's false consequences are included within B's false consequences (or fewer).
  *   **The Fatal Flaw:** Miller and Tichý independently demonstrated that **under this specific definition, if Theory A is false, it cannot satisfy both conditions against *any* other false Theory B.** The core reason is logical interdependence:
      *   If A has *any* false consequence (which it must, being false), there will always be *some* true consequence of B that A lacks (or vice versa), violating the set-inclusion requirements.
      *   Essentially, Popper's definition required a *logically impossible* combination of set relationships for *any* false theory to surpass another false theory.
  *   **The Consequence:** Popper's *formal definition* was internally inconsistent with its intended purpose. It could not, even in principle, distinguish the verisimilitude of *any* two false theories. This was a devastating blow to Popper's *proposed formalization* of verisimilitude.

  **2. What the Theorem Did NOT Prove**
  *   **It did NOT prove "getting closer to the truth" is incoherent *in general*:** It proved *one specific formal definition* was flawed. This is a critical distinction. The theorem is about the failure of a *particular mathematical formulation*, not a metaphysical proof that the *intuitive concept* is meaningless.
  *   **It did NOT prove scientific progress is illusory:** Scientists observe clear progress (e.g., predicting eclipses more accurately, curing diseases, landing probes on comets). The theorem doesn't negate this; it challenged *one specific philosophical account* (Popper's syntactic definition) of *what constitutes* that progress in terms of "truth-likeness."
  *   **It did NOT prove scientists are wrong to use the language:** Scientists use "closer to the truth" as an intuitive, pragmatic assessment based on empirical success, explanatory scope, coherence, and predictive power. Their usage rarely relies on, or even references, Popper's precise (and flawed) formal definition.

  **3. The Aftermath: Verisimilitude Post-1974**
  Philosophers didn't abandon verisimilitude; they pursued *different formalizations* and *related concepts*. Key developments include:

  *   **The Semantic/Model-Theoretic Turn (Tichý, Hilpinen, Niiniluoto):** Instead of counting true/false *statements*, they defined verisimilitude as *similarity between states of affairs*.
      *   **Possible Worlds Approach (Tichý, Hilpinen):** Define the "truth" as a single possible world (the actual world). Verisimilitude is how "close" a theory's set of *possible models* (worlds it allows) is to the actual world. Closeness is measured by set inclusion or a "similarity" metric between worlds.
      *   **Similarity Metrics (Niiniluoto, Oddie):** Developed sophisticated quantitative measures of the "distance" between a theory's proposed state (or set of states) and the true state. Niiniluoto's "min-sum" measure (balancing closeness to truth and distance from falsity) became highly influential. This approach explicitly handles partial truths and approximations.
  *   **Structuralist Approaches (Sneed, Stegmüller, Balzer, Moulines):** Framed theories as sets of *models* (mathematical structures). Progress involves finding models that more accurately *represent* the structure of the target system, often incorporating approximations.
  *   **Refined Realism (Boyd, Psillos):** Scientific Realists argued that the *approximate truth* of theoretical claims, coupled with their role in enabling novel predictions and interventions, *justifies* the intuition of progress. "Getting closer" might mean our theories' *ontological commitments* and *causal structures* better correspond to reality, even if specific details are wrong. (e.g., atoms exist, even if Bohr's model was incorrect).
  *   **The "Conjectural Knowledge" Response (Popperians like Watkins, Musgrave):** Some Popperians conceded the definitional failure but argued the *intuition* remained vital. They shifted focus to progress as increasing "well-testedness," "problem-solving effectiveness," or "non-ad-hoc-ness" of theories, seeing these as *indicators* (though not strict measures) of increasing truth-likeness.
  *   **Critiques & Alternatives (Laudan, van Fraassen):**
      *   Larry Laudan ("Progress and Its Problems") argued the "pursuit of truth" (especially verisimilitude) is a red herring. Progress is better understood as increasing *problem-solving effectiveness*.
      *   Bas van Fraassen ("The Scientific Image") argued for Constructive Empiricism: science aims only for *empirical adequacy* (saving the phenomena), not truth about unobservables. "Getting closer" is about empirical fit, not ontological correspondence.

  **4. Implications for Your Article Framing: A Nuanced Correction**
  Your physicist friend's conclusion, while capturing the *impact* of Miller-Tichý, overreaches:

  *   **Inaccurate:** Saying the *whole idea* of "getting closer to the truth" was "shown to be mathematically incoherent" is incorrect. Only *Popper's specific definition* was shown to be flawed. Subsequent work provided *alternative* formalizations that *are* mathematically coherent (e.g., Niiniluoto's similarity metrics).
  *   **Overly Strong:** Claiming specialists "quietly wrote it off as a dead end" is misleading. Verisimilitude research *exploded* after 1974, taking new and fruitful directions. It remains a core topic in formal epistemology and philosophy of science.
  *   **Conflation:** Scientists using the language aren't necessarily "unknowingly leaning on a piece of Popperian philosophy." They are more likely leaning on a *deep intuition about empirical success and explanatory power* that existed long before Popper and persists independently of the fate of his definition. Popper attempted to formalize the intuition; his formalization failed; the intuition endured.

  **A More Accurate Framing for Your Article:**

  > "While Karl Popper's falsificationism revolutionized how we think about testing science, his attempt to formally define scientific progress as 'getting closer to the truth' (verisimilitude) hit a major snag. In 1974, David Miller and Pavel Tichý proved a devastating theorem: Popper's own definition couldn't actually distinguish which of *any* two false theories was closer to the truth. This didn't mean the *intuition* behind scientific progress was wrong – scientists clearly see advances from Newton to Einstein, or from vague continental drift to plate tectonics. Instead, it showed Popper's *specific mathematical formulation* was fatally flawed. Philosophers of science responded not by abandoning the quest to understand truth-likeness, but by forging new paths. They developed sophisticated theories based on comparing possible worlds, measuring similarity between states, or analyzing the structure of scientific models. These modern approaches grapple with the complex reality that scientific theories are almost always approximations, yet still capture something deep and increasingly accurate about how the universe works. So, when scientists talk about getting closer to the truth, they're invoking a powerful intuition validated by empirical success – an intuition that philosophers continue to refine and formalize, even after Popper's initial attempt ran aground."

  **Key Takeaways for Your Sanity Check:**
  *   **Miller-Tichý:** Killed Popper's *specific formal definition* of verisimilitude. Proved it was logically incapable of its intended task.
  *   **Not the Concept:** Did *not* prove the *idea* of increasing truth-likeness is incoherent.
  *   **Vibrant Field:** Verisimilitude research flourished *after* 1974 with new, mathematically coherent approaches (semantic, similarity-based, structuralist).
  *   **Scientists' Intuition:** Scientists' use of "closer to the truth" reflects empirical success and explanatory power, not reliance on Popper's flawed definition.
  *   **Article Frame:** Focus on the *failure of Popper's specific solution* and the *subsequent, ongoing philosophical effort* to understand truth-likeness, rather than declaring the intuition incoherent or abandoned.
