answer: |-
  You're absolutely right that Bernoulli's expected utility solution mathematically resolves the original St. Petersburg Paradox (SPP) as *you presented it to your students*. Teaching it that way for a core Micro Theory sequence covering vNM axioms is **perfectly appropriate and standard**. Your explanation wasn't outdated; it covered the fundamental point.

  However, the persistence of the SPP in modern literature isn't because economists forgot Bernoulli. It's because the paradox serves as a powerful **lens to examine deeper, unresolved questions** in decision theory, probability, and the foundations of rationality. Here's why papers keep being written:

  1.  **The "Any Unbounded Utility" Problem (Menger's Objection):** Karl Menger pointed out in 1934 that Bernoulli's solution only *shifts* the problem. Suppose you use *any* unbounded utility function U(w) (like log(w), sqrt(w), -1/w, etc.). You can *always construct a modified St. Petersburg game* where the expected utility diverges to infinity.
      *   *How?* Make the payoffs grow sufficiently fast. Instead of paying $2^{n-1}$ on the n-th flip, pay $U^{-1}(2^{n-1})$ (or faster). The expected utility becomes Σ (1/2)^n * U[ U^{-1}(2^{n-1}) ] = Σ (1/2)^n * 2^{n-1} = Σ (1/2) * 2^{n-1} / 2^{n-1} = Σ (1/2) = ∞.
      *   **Implication:** If we insist utility must be unbounded (to handle arbitrarily large gains), then EU theory *still* predicts people should pay arbitrarily large amounts to play *some* version of the SPP, which remains empirically implausible. This forces a confrontation: *Must rational utility be bounded?* But bounded utility creates other theoretical problems (e.g., with small probability events).

  2.  **The Challenge to the vNM Framework Itself:** The SPP highlights extreme consequences of the vNM axioms, particularly Continuity and the treatment of infinite expectations.
      *   **Continuity Axiom:** This axiom implies that for any outcome A > B > C, there's a probability p such that B ~ pA + (1-p)C. The SPP pushes this to the limit, asking if a tiny probability of an astronomical payoff should dominate all finite payoffs. Does this *feel* rational? Does it describe actual behavior?
      *   **Infinite Expectations:** vNM EU theory struggles formally with infinite expected values/utilities. How should they be compared? Is one infinity "larger" than another? The SPP exposes the limitations of the standard framework for handling these cases rigorously.

  3.  **Descriptive vs. Normative Tensions:** Bernoulli resolved the paradox *normatively* by saying people *should* maximize EU. But modern behavioral economics asks: *Do* they? And if not, why not?
      *   **Probability Weighting:** People dramatically underweight very small probabilities (π(p) << p). In the SPP, the massive payoffs require vanishingly small probabilities. Prospect Theory and Rank-Dependent Utility models resolve the *empirical* puzzle (why people won't pay much) by incorporating this weighting, often implying EU is a poor *descriptive* model here.
      *   **Bounded Rationality / Cognition:** People might simply fail to grasp the implications of the infinite series, truncate the game mentally, or lack the computational resources to evaluate it. The SPP becomes a case study in cognitive limits.
      *   **Framing & Context:** Would people pay more if the game was framed differently? Does the sheer implausibility of the payoffs make people dismiss it?

  4.  **Variations and Related Paradoxes:** New twists on the SPP are designed to probe specific weaknesses:
      *   **The Pasadena Paradox (Nover & Hájek):** A game with conditionally convergent expected utility (the sum converges, but its value depends on the *order* of summation). This creates deep problems for defining a unique expected utility and assigning value.
      *   **The Super St. Petersburg Paradox:** Designed to break specific utility functions, reinforcing Menger's point.
      *   **St. Petersburg with Risk Aversion over Probabilities:** Exploring if aversion to ambiguity or compound risk plays a role.

  5.  **Philosophical Foundations:** The SPP forces questions about the nature of rationality, value, and probability:
      *   Is it rational to ignore events with probability zero? (The SPP relies on them!)
      *   Does rationality *require* us to be willing to stake everything on a tiny chance of near-infinite gain?
      *   How should we model decisions involving potentially infinite consequences (relevant in some ethical/philosophical contexts)?

  **Why Your Teaching Was Fine (and What You Could Add):**

  *   **For the Course:** Teaching the SPP as a motivation for moving from Expected Value to Expected Utility, solved by concave utility (like log), is **foundational and correct**. It perfectly illustrates the core point of the vNM framework.
  *   **Potential Addendum (Optional):** If you want to hint at the deeper waters, you could add a brief footnote/slide at the end: "While Bernoulli's concave utility resolves the original mathematical infinite expectation, the St. Petersburg Paradox continues to spark debate about the foundations of decision theory, the necessity of bounded utility, descriptive behavior, and the handling of infinite expectations. See [Menger 1934] or modern papers like [Nover & Hájek 2004 on Pasadena] for deeper dives." This shows awareness without derailing the core lesson.

  **Conclusion:**

  The St. Petersburg Paradox isn't a "zombie" due to ignorance of Bernoulli. It's a **living probe**. While Bernoulli definitively solved the *original mathematical puzzle* under the EU framework, the paradox's enduring power lies in its ability to:

  1.  Expose potential limitations of the vNM axioms themselves (especially concerning unbounded utility and infinite expectations).
  2.  Serve as a critical testbed for *alternative* descriptive and normative theories (Prospect Theory, Bounded Rationality, etc.).
  3.  Generate new, more complex paradoxes (like Pasadena) that challenge the foundations.
  4.  Force fundamental philosophical questions about rationality and value.

  Your students learned the essential resolution correctly. The ongoing literature isn't refuting Bernoulli; it's using the SPP as a tool to explore much deeper and more complex questions at the frontiers of decision theory. Your lit review stumble is actually a sign you're engaging with those frontiers – keep digging!
