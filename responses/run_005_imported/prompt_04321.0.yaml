prompt: |-
  For the past few months, my school's philosophy club has been trying to work through primary texts in full rather than relying on textbook summaries of them, and this month our faculty sponsor picked Bertrand Russell's 1905 paper "On Denoting." I got through the opening puzzles about "the present King of France" and about Scott being the author of Waverley without too much trouble, since we had already covered the basic theory of descriptions in class. But there is a later stretch of the essay that I gather philosophers nickname the "Gray's Elegy" argument, and I must have reread it six or seven times without being able to confidently say what is actually going wrong in it. It is supposed to be Russell's central case against any theory that assigns a denoting phrase both a "meaning" and a "denotation" as two separate things, including his own earlier view in The Principles of Mathematics and the view he attributes to Frege. We each have to bring a passage we found genuinely confusing to next week's meeting, and this is mine. Here it is, copied exactly as it appears in the original 1905 Mind article, inverted commas and all:

  The relation of the meaning to the denotation involves certain rather curious difficulties, which seem in themselves sufficient to prove that the theory which leads to such difficulties must be wrong.

  When we wish to speak about the meaning of a denoting phrase, as opposed to its denotation, the natural mode of doing so is by inverted commas. Thus we say:

  The centre of mass of the Solar System is a point, not a denoting complex; "The centre of mass of the Solar System" is a denoting complex, not a point.

  Or again, The first line of Gray's Elegy states a proposition. "The first line of Gray's Elegy" does not state a proposition. Thus taking any denoting phrase, say C, we wish to consider the relation between C and "C," where the difference of the two is of the kind exemplified in the above two instances.

  We say, to begin with, that when C occurs it is the denotation that we are speaking about; but when "C" occurs, it is the meaning. Now the relation of meaning and denotation is not merely linguistic through the phrase: there must be a logical relation involved, which we express by saying that the meaning denotes the denotation. But the difficulty which confronts us is that we cannot succeed in both preserving the connexion of meaning and denotation and preventing them from being one and the same; also that the meaning cannot be got at except by means of denoting phrases. This happens as follows.

  The one phrase C was to have both meaning and denotation. But if we speak of "the meaning of C," that gives us the meaning (if any) of the denotation. "The meaning of the first line of Gray's Elegy" is the same as "The meaning of 'The curfew tolls the knell of parting day,'" and is not the same as "The meaning of 'the first line of Gray's Elegy.'" Thus in order to get the meaning we want, we must speak not of "the meaning of C," but of "the meaning of 'C,'" which is the same as "C" by itself. Similarly "the denotation of C" does not mean the denotation we want, but means something which, if it denotes at all, denotes what is denoted by the denotation we want. For example, let "C" be "the denoting complex occurring in the second of the above instances." Then C = "the first line of Gray's Elegy," and the denotation of C = The curfew tolls the knell of parting day. But what we meant to have as the denotation was "the first line of Gray's Elegy." Thus we have failed to get what we wanted.

  The difficulty in speaking of the meaning of a denoting complex may be stated thus: the moment we put the complex in a proposition, the proposition is about the denotation; and if we make a proposition in which the subject is "the meaning of C," then the subject is the meaning (if any) of the denotation, which was not intended. This leads us to say that, when we distinguish meaning and denotation, we must be dealing with the meaning: the meaning has denotation and is a complex, and there is not something other than the meaning, which can be called the complex, and be said to have both meaning and denotation. The right phrase, on the view in question, is that some meanings have denotations.

  But this only makes our difficulty in speaking of meanings more evident. For suppose C is our complex; then we are to say that C is the meaning of the complex. Nevertheless, whenever C occurs without inverted commas, what is said is not true of the meaning, but only of the denotation, as when we say: The centre of mass of the Solar System is a point. Thus to speak of C itself, i.e., to make a proposition about the meaning, our subject must not be C, but something which denotes C. Thus "C," which is what we use when we want to speak of the meaning, must be not the meaning, but something which denotes the meaning. And C must not be a constituent of this complex (as it is of "the meaning of C"); for if C occurs in the complex, it will be its denotation, not its meaning, that will occur, and there is no backward road from denotations to meanings, because every object can be denoted by an infinite number of different denoting phrases.

  Thus it would seem that "C" and C are different entities, such that "C" denotes C; but this cannot be an explanation, because the relation of "C" to C remains wholly mysterious; and where are we to find the denoting complex "C" which is to denote C? Moreover, when C occurs in a proposition, it is not only the denotation that occurs (as we shall see in the next paragraph); yet, on the view in question, C is only the denotation, the meaning being wholly relegated to "C." This is an inextricable tangle, and seems to prove that the whole distinction of meaning and denotation has been wrongly conceived.

  I understand more or less every individual sentence of this on its own, but I cannot hold the whole argument in my head at once, and I do not think I could reconstruct why the final conclusion follows if someone covered up the last paragraph and asked me to guess it. Could you help me actually work through it? Specifically: first, what exactly goes wrong, step by step, when Russell tries to write a sentence that is genuinely about the meaning of a denoting complex rather than about its denotation — why does the subject keep sliding back to being about the denotation, no matter how many extra layers of inverted commas get added? Second, what work is the "no backward road from denotations to meanings" sentence actually doing — why does the fact that "every object can be denoted by an infinite number of different denoting phrases" rule out just stipulating that "C" denotes C and stopping there? And third, why does Russell treat all of this as proof that the meaning/denotation distinction was "wrongly conceived" from the start, rather than as an awkward but survivable complication — the sort of thing a Fregean might absorb by simply accepting a hierarchy of "indirect senses" for quoted or oblique contexts and moving on? While you're at it, I would also be curious whether this is one of those passages where philosophers still genuinely disagree about what Russell was even trying to say, since a couple of things I skimmed while looking for secondary help made it sound that way, and I would rather not walk into club next week acting as though there is one settled interpretation if there is not.
