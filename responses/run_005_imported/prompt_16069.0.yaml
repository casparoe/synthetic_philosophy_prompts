  Part 2: Proof sketch (5 points)
  The student wrote:
  "The proof goes via a convexity argument. Your expected utility if you act now is just the best of the expected utilities available to you given your prior. If you get to see the evidence first, you'll pick, for each possible outcome of the experiment, whichever act maximises expected utility given the updated credences, and by the law of total probability your prior credence in each state is just the probability-weighted average of your posterior credences across the possible outcomes of the experiment. Because "take the max" is a convex operation, Jensen's inequality tells us the max of the averages is never more than the average of the maxes, so pre-committing to update and then optimise can only help. This is really a claim about expected-utility, i.e. risk-neutral, maximisers specifically: it's the assumption that the agent maximises a linear function of probabilities that lets the convexity argument go through, and if she instead maximised a risk-averse, concave transform of expected utility, the relevant value function need not come out convex and the guarantee could fail."

  This sketch is mostly correct. The key elements:
  - The student correctly identifies that the value of acting now is max_a E[U|a] (with the prior).
  - The value of seeing the evidence and then acting is E[ max_a E[U|a, e] ] (where the expectation is over the possible evidence e).
  - The law of total probability is used to relate the prior to the posteriors.
  - The convexity of the max function and Jensen's inequality are correctly invoked.

  However, note that the student adds an important point about risk neutrality. They note that the theorem relies on the agent being risk neutral in the sense of maximizing a linear function of probabilities (i.e., expected utility). They correctly point out that if the agent were risk averse (maximizing a concave transform of expected utility) then the result might not hold. This is a good observation and shows understanding of the assumptions.

  But note: the proof sketch is a bit compressed and could be clearer. The key step is that the prior expected utility of an act is the average of the posterior expected utilities of that act (by the law of total probability). Then, when we choose the best act at the posterior, we get a value that is at least as high as the posterior expected utility of any fixed act. Therefore, the average of the maxes (over acts) of the posterior expected utilities is at least the max (over acts) of the average of the posterior expected utilities (which is the prior expected utility of that act). Hence, the average of the maxes is at least the max of the averages (which is the value of acting now). The student's use of "max of the averages" and "average of the maxes" is standard and correct.

  One minor quibble: the student says "the max of the averages is never more than the average of the maxes". This is correct because Jensen's inequality for a convex function f says that f(E[X]) <= E[f(X)]. Here, f is the max over acts of the expected utility (which is a convex function in the probabilities) and we are comparing f(E[X]) (which is the max of the averages) and E[f(X)] (the average of the maxes). So indeed, max of averages <= average of maxes.

  Therefore, the sketch is correct and includes an important qualification about risk neutrality. We can award 5/5.

