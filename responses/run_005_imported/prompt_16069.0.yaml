  This is a good statement. It captures:
  - The agent is an expected utility maximizer and updates by strict conditionalization.
  - The experiment is cost-free.
  - The expected utility after seeing the evidence (and then choosing optimally) is at least as high as the expected utility of acting now without the evidence.

