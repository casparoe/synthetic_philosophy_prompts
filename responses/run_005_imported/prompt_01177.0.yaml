prompt: |-
  So I'm drafting a section of my quals paper on accuracy-first epistemology / epistemic utility theory (Joyce, Pettigrew, etc) and I keep getting stuck on something that feels like a genuine problem with the view, unless im missing something obvious. If credences are only epistemically good insofar as they're accurate, shouldn't the norm that falls out of the theory just be "go as extreme as possible," since a maximally confident credence in whatever's actually true is literally more accurate than any hedged credence in that same truth? But the literature always ends up recommending calibration instead, i.e. proportioning your confidence to the evidence rather than maxing it out. Feels like the real normative work is being done by something other than accuracy, and "accuracy" is just along for the ride. Is that a legit worry about the framework, or am I misunderstanding how the scoring rules are supposed to be doing the work here?
reasoning: |-
  Okay, the user is working on a quals paper about accuracy-first epistemology and epistemic utility theory. They're stuck on what seems like a genuine problem: if the goal is accuracy, why doesn't the theory recommend extreme credences? They notice that literature promotes calibrated credences instead, which feels inconsistent. I need to unpack why this isn't actually a contradiction.

  First, I should recall the basics. Epistemic utility theory uses scoring rules to measure accuracy. The Brier score and logarithmic score are common. These rules penalize not just being wrong but also being overconfident. For example, if you assign 0.9 to a true proposition, the Brier score is better than assigning 1.0 because if you're wrong, the penalty is harsher at 1.0. So the scoring rules themselves discourage extremism by design.

  The user's confusion might stem from thinking of accuracy in a binary way—right or wrong. But scoring rules introduce a gradient: closeness counts. A credence of 0.8 when the truth is 1.0 is better than 0.5 because it's closer. But going to 1.0 isn't always optimal because if you're wrong, the penalty is severe. The mathematical properties like propriety matter here. A proper scoring rule makes you report your true belief, so hedging is rational.

  I should explain propriety. If a scoring rule is proper, your expected score is minimized when you report your actual credence. That incentivizes honesty. For instance, if your real credence is 0.7, saying 0.7 gives a better expected score than saying 0.9 or 1.0. So calibration naturally emerges because deviating from your true belief worsens your expected accuracy.

  The user's deeper worry might be that accuracy alone isn't doing the work. But actually, the scoring rules encode the idea that both overconfidence and underconfidence are inaccurate. Accuracy here isn't just about being right but about matching the degree of truth. The mathematical structure of the scoring rule incorporates the value of calibration. So it's still accuracy-first, but with a nuanced definition.

  Also, the user might not have considered the diachronic aspect. Updating credences with evidence over time requires calibration. If you always go extreme, you might not adjust properly with new evidence, leading to worse long-term accuracy. But the immediate scoring rules already handle this through propriety.

  In summary, the key is that proper scoring rules make calibrated credences accuracy-efficient. The user's oversight is not accounting for how these rules define accuracy. The theory avoids extremism by penalizing misplaced certainty, making calibration the rational strategy under uncertainty.
answer: |-
  This is an **excellent and genuinely deep worry**—one that cuts to the heart of accuracy-first epistemology (AFE) and epistemic utility theory (EUT). You're absolutely right to be puzzled. The resolution lies in understanding the **specific mathematical properties of the scoring rules** used to measure accuracy and how they encode epistemic values *beyond* simply being right. Here's a breakdown:

  1.  **The Superficial Argument for Extremism:**
      *   *Premise 1:* Accuracy is the sole fundamental epistemic good.
      *   *Premise 2:* A credence of 1 (maximal confidence) in a *true* proposition is more accurate than *any* lower credence (e.g., 0.9, 0.7) in that same true proposition.
      *   *Conclusion:* Therefore, agents should always adopt credence 1 in whatever proposition they believe is most likely true.

      Premise 2 seems intuitively correct *if* you think accuracy is *only* about how right you are *when you're right*. But this is where AFE/EUT introduces a crucial nuance through its choice of scoring rules.

  2.  **The Role of Scoring Rules:**
      AFE/EUT doesn't just say "be accurate"; it quantifies accuracy using **scoring rules**. The two most common are:
      *   **Brier Score (Quadratic Score):** For a credence `p` in a proposition `A`:
          *   If `A` is true: Score = `(1 - p)^2`
          *   If `A` is false: Score = `(0 - p)^2` = `p^2`
      *   **Logarithmic Score:**
          *   If `A` is true: Score = `-ln(p)`
          *   If `A` is false: Score = `-ln(1 - p)`

      **The Key Insight:** These rules don't *only* reward you for being right. They **penalize you *differently* for *how* wrong you are when you're wrong.** Specifically, they penalize *overconfidence* (being more confident than your evidence warrants) *harshly*.

  3.  **The Problem with Extremism: Risk of Catastrophic Error**
      Imagine your evidence genuinely only supports a credence of 0.7 in `A`. Consider adopting credence 1.0 vs. 0.7:
      *   **If `A` is TRUE:** Credence 1.0 scores *better* than 0.7 (Brier: `(0)^2 = 0` vs. `(0.3)^2 = 0.09`; Log: `-ln(1) = 0` vs. `-ln(0.7) ≈ 0.357`).
      *   **If `A` is FALSE:** Credence 1.0 scores *disastrously worse* than 0.7 (Brier: `(1)^2 = 1` vs. `(0.7)^2 = 0.49`; Log: `-ln(0) = ∞` vs. `-ln(0.3) ≈ 1.204`).

      **The Extremism Trade-Off:** Adopting an extreme credence (1 or 0) gives you the *best possible score if you're right*, but subjects you to the *worst possible score if you're wrong*. A calibrated credence (like 0.7) gives you a *good-but-not-best score if you're right*, but protects you from the *worst penalties if you're wrong*.

  4.  **Propriety: The Mathematical Engine of Calibration**
      The crucial mathematical property that forces calibration is **propriety**.
      *   A scoring rule is **strictly proper** if, *for any possible credence `q` you actually hold*, the credence report `r` that *minimizes your expected score* (according to `q`) is `r = q`.
      *   **Example:** Suppose your *genuine* credence in `A` is `q = 0.7`. If the scoring rule (like Brier or Log) is strictly proper, then:
          *   Reporting `r = 0.7` gives you the *lowest possible expected score* (highest expected accuracy) *according to your own belief `q=0.7`*.
          *   Reporting any other credence `r` (like `r=0.6`, `r=0.8`, or `r=1.0`) would give you a *higher* expected score (worse expected accuracy) *by your own lights*.

      **Why Propriety Matters:** It makes epistemic rationality *immediately* self-policing. To maximize your *expected accuracy* (given your *current* evidence and beliefs), you *must* report your *actual* credence. Lying to yourself (reporting `r` ≠ `q`) is epistemically self-defeating *even before you know the truth*. Propriety builds the value of evidential proportionality (calibration) *directly into the definition of accuracy* embodied by the scoring rule.

  5.  **Answering Your Worry:**
      *   **"Shouldn't the norm be 'go as extreme as possible'?"** No, because extremism maximizes accuracy *only conditional on being right*. It ignores the *risk* of being wrong and the *severity* of the penalty imposed by proper scoring rules. Maximizing *expected* accuracy (which is what rational agents should do under uncertainty) requires balancing the potential gains (if right) against the potential losses (if wrong). Propriety ensures that this balance is struck precisely when your credence matches your evidence (`r = q`).
      *   **"Feels like the real normative work is being done by something other than accuracy..."** This is the heart of your worry, and it's insightful. The response from AFE/EUT is: **The scoring rule *defines* what "accuracy" means in a way that incorporates the value of calibration.** The argument is:
          1.  We value accuracy fundamentally.
          2.  A *plausible*, *sensible* measure of accuracy for degrees of belief must penalize not just being wrong, but *how confidently* wrong you are. (Brier and Log do this; a rule that *only* cared about being right/wrong wouldn't).
          3.  Plausible, sensible measures (like Brier/Log) are strictly proper.
          4.  Therefore, maximizing *expected* accuracy (as defined by these rules) *requires* calibration.
      *   **Is "accuracy" just along for the ride?** Proponents argue *no*. The *structure* of the scoring rule (its propriety) isn't an *external* constraint added to accuracy; it's argued to be an *essential feature* of any coherent measure of accuracy for graded beliefs. The claim is that extremism is *inaccurate* in a deeper sense – it misrepresents the *degree* of fit between belief and world, especially when wrong. The penalty for overconfidence *is part of the accuracy measure itself*.

  6.  **Is This a Legit Worry?**
      **Yes, it's a fundamental and ongoing debate point.** Critics argue:
      *   **Ad Hoc Scoring Rules:** The choice of Brier/Log feels somewhat arbitrary. While they have nice properties, are they the *only* way to measure accuracy? Couldn't we define an "accuracy" measure where being maximally confident when right *is* always best, even if it risks catastrophe when wrong? AFE/EUT proponents reply that such measures would violate basic intuitions about what makes a graded belief "better" or "worse" and wouldn't be strictly proper, making them unsuitable for guiding rational belief formation under uncertainty.
      *   **The Value of Truth vs. Avoiding Error:** The worry highlights a tension between the pure "value of truth" (rewarded by extremism when right) and the "disvalue of error" (mitigated by calibration). AFE/EUT, via proper scoring rules, builds in a *specific weighting* between these two values. Critics might argue this weighting isn't purely derived from "accuracy" alone but smuggles in other epistemic values (like caution or proportionality).
      *   **Diachronic Challenges:** While propriety handles the *synchronic* case (what credence to have *now*), some argue the *diachronic* justification for rules like conditionalization within pure AFE still faces challenges related to extremism and long-run calibration.

  **Conclusion for Your Paper:**

  Your worry is spot-on. The move from "accuracy is fundamental" to "calibration is rational" is **not trivial**; it crucially depends on the **strict propriety** of the scoring rules used to measure accuracy. The defense is that propriety isn't an *external* constraint but an *essential feature* of a *sensible* measure of accuracy for degrees of belief – one that properly accounts for the cost of overconfidence when wrong. Frame your discussion around this core argument: **Propriety bridges the gap between the fundamental value of accuracy and the normative requirement for calibration.** Acknowledge the criticism that the choice of scoring rule might be doing significant, potentially contentious, normative work, but emphasize that proponents see this as unpacking the true meaning of "accuracy" for credences. This is a central tension worth exploring in your quals paper.
