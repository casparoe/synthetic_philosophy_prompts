  Here's a 4-minute toast weaving Margaret Gilbert's joint commitment theory into a heartfelt, accessible, and celebratory message. It uses the core idea as the *structure* without getting bogged down in jargon, contrasting it subtly with individual intentions:

  **(Clink glass gently, warm smile)**

  "Hi everyone. For those who don’t know me, I’m [Your Name], the incredibly proud, slightly nervous, and definitely younger sibling of our amazing bride, [Sister's Name]. And standing beside her is [Fiancé's Name], who we’re all thrilled to officially welcome into our chaotic, wonderful family today.

  Now, [Sister's Name], as many of you know, has spent the last few years living and breathing some pretty deep ideas about how people come together – how 'we' actually *happens*. Specifically, she’s been wrestling with the brilliant work of Margaret Gilbert. **(Light, knowing chuckle towards the academics)** Don’t worry, I promise this isn’t a seminar! But bear with me for just a second, because what she studies? It actually hits the nail right on the head for why we’re all here today.

  Professor Gilbert talks about something powerful called a 'joint commitment.' It’s not just two people *individually* deciding to do the same thing, like both deciding separately to paint a house yellow. That’s nice, but either one could just... change their mind and walk away. No big deal, right? The house might stay half-painted.

  A *joint commitment* is something different. It’s when two people look each other in the eye, as [Sister's Name] and [Fiancé's Name] are about to do, and together, as a *pair*, they say, 'We are committed to this. *We* are doing this thing.' It’s creating something brand new – this little entity called 'us'. And here’s the crucial bit Gilbert teaches us: once that 'we' is formed through that joint commitment, it creates real obligations. Neither person gets to just unilaterally decide it’s over or walk away from what they’ve built *together*. It’s a promise forged *between* them, binding them to each other in a way that individual wishes alone never could.

  **(Pause, shift focus fully to the couple)**

  And guys... that’s marriage. That’s *exactly* what your vows are. It’s not just two separate 'I's who happen to love each other and want similar things today. It’s the powerful, deliberate creation of a 'we'. It’s standing up and making that joint commitment – to love, to support, to build a life, to face whatever comes, *together*. You’re creating that 'we' entity right here, right now, in front of all of us. And Gilbert’s point is spot on: that commitment creates real, enduring obligations to each other. It means you can’t just bail when things get tough or messy or half-painted. You’re in it, *together*, because you both created this commitment that only *both* of you can truly reshape.

  **(Smile widens, more personal tone)**

  Watching you two build this ‘we’ has been incredible long before today. It wasn’t just two grad students studying the same obscure texts **(nod to the academics, light chuckle)** who happened to be dating. It was watching you become a *team*. Whether it was navigating the madness of dissertations, figuring out whose turn it was to walk the dog during a deadline crunch, supporting each other through setbacks, or just making each other laugh until you cried over something only you two found funny... you haven’t just been aligned individuals. You’ve been actively building and living that joint commitment every single day. You’ve shown us what it truly means to create a 'we' – resilient, supportive, and full of laughter.

  So, to the social ontology folks here, yes, this is a masterclass in Gilbertian joint commitment unfolding in real-time! **(Raise glass slightly in their direction)**. And to everyone else, what it means is this: [Sister's Name] and [Fiancé's Name] aren’t just promising to love each other today. They’re forging a powerful, shared promise today that binds them to keep choosing each other, supporting each other, and building that 'we' for all their tomorrows. It’s a commitment neither can walk away from alone, and that’s the beautiful, solid foundation of marriage.

  **(Raise glass fully, voice warm and strong)**

  So let’s raise our glasses to [Sister's Name] and [Fiancé's Name]! To the brilliant, beautiful, and slightly nerdy creation of your powerful, enduring ‘we’. May your joint commitment be the source of endless strength, deep joy, incredible adventures, and a lifetime of love that only grows stronger. To the newly formed 'we'!"

  **(Everyone: "To the 'we'!")**

  **Why this works:**

  1.  **Accurate Gilbert Core:** Clearly explains the key differentiator (joint commitment vs. coinciding individual intentions), the creation of the "plural subject" ("we"), and the crucial point about non-unilateral dissolution and real obligations. The Bratman contrast is implied without needing to name him explicitly.
  2.  **Seamless Wedding Link:** Directly maps the theory onto the act of marriage vows as the formal establishment of that joint commitment.
  3.  **Accessible Language:** Uses simple analogies (painting the house) and avoids jargon. Explains the concepts in plain terms ("creating a 'we'", "shared promise", "binding them together", "can't just bail").
  4.  **Not a Lecture:** The theory serves as the *framework* and *explanation* for the significance of marriage, not the focus itself. It's woven into a narrative about the couple.
  5.  **Personal & Heartfelt:** Includes personal observations about the couple building their "we" in everyday life, making it warm and specific to them.
  6.  **Acknowledges the Academics:** Includes a light, inclusive nod ("Don't worry...", "To the social ontology folks...") that makes them feel seen without alienating others.
  7.  **Strong Toasting Finish:** Ends with a clear, celebratory toast focused on the couple's future together.
  8.  **Timing:** Reads comfortably within 4 minutes when delivered at a moderate pace with pauses.

  **Delivery Tips:**

  *   **Practice:** Time yourself. Adjust pacing as needed.
  *   **Tone:** Warm, sincere, slightly humorous when appropriate (especially the light academic nods), and celebratory.
  *   **Eye Contact:** Connect with the couple during the personal parts, sweep the room during the explanation and toast.
  *   **Pauses:** Use them effectively, especially after key points or before the final toast.
  *   **Confidence:** You know the core idea well enough! Deliver it with conviction.

  This toast uses your knowledge respectfully, honors your sister's work in a meaningful way, satisfies the experts, and resonates with everyone celebrating the love and commitment of the newlyweds. Good luck!
