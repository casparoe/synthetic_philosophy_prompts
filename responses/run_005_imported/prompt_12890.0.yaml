answer: |-
  Here’s a toast that walks the tightrope – honoring the debate without resolving it, leaning on Williams for the perfect blend of wit and warmth, and ensuring both philosophers and non-philosophers feel seen and celebrated:

  **(Tap glass gently. Smile warmly at the room, then at Elena and Marcus.)**

  Friends, family, colleagues... and, let’s be honest, a significant contingent of people who probably spent their morning debating whether the canapés have intrinsic moral worth or merely instrumental value... welcome! We’re here, finally, to celebrate Elena and Marcus.

  **(Light chuckle from the room.)**

  Now, anyone who knows this remarkable couple knows two things for absolute certain. First: they are, quite simply, brilliant, kind, deeply funny, and profoundly in love. The evidence is overwhelming. Second: if you ask them *why* kindness matters, or *how* we recognize a truly good act... well, you might want to cancel your afternoon plans. Because for the better part of a decade, these two have engaged in one of philosophy’s most enduring debates – with passion, rigor, and mutual respect – right there in the academic journals for all to see.

  **(Nod towards Marcus, then Elena.)**

  Marcus, my friend, you stand firmly in the tradition that sees moral worth shining brightest when duty is the sole motivator. The honest shopkeeper, guided by principle, not profit? That’s your guy. You believe the highest good requires stripping away the messy, lovely entanglements of inclination to reveal the pure structure of obligation. It’s a view of towering intellectual integrity.

  Elena, your work paints a very different, equally compelling picture. You argue compellingly that love, empathy, sympathy – the very inclinations Marcus sets aside – aren’t distractions from the moral act, but often its very heart and soul. Drawing on thinkers like Smith and Arpaly, you remind us that Huck Finn’s decision *not* to turn in Jim wasn't a lapse in duty, but a triumph of human connection. Moral worth, for you, often blooms right there in the fertile soil of feeling.

  **(Smile, shake head slightly in mock bewilderment.)**

  Their colleagues, I’m told, find this dynamic both deeply touching and slightly… theoretically awkward. How can two people so committed to seemingly opposite answers about the foundation of moral worth be, by every observable measure, so incredibly *good* to each other? So clearly, joyfully *happy* together?

  **(Pause, lean in slightly.)**

  Well, I think the late, great Bernard Williams might have offered us a clue – a clue perfectly suited to a wedding day. He once considered a scenario involving a man whose wife is drowning. If that man, Williams mused, pauses mid-rescue to confirm that saving his wife *rather than a stranger* is morally *permitted*... well, he’s had "one thought too many."

  **(Pause for recognition chuckles, especially from the academic side. Smile knowingly.)**

  *Exactly.* One thought too many. Williams wasn't necessarily taking sides in *this* specific debate, but he pinpointed something essential: sometimes, the relentless drive to justify, to theorize, to find the purest moral motive... gets in the way of the thing itself. The act. The commitment. The love.

  **(Turn fully to Elena and Marcus.)**

  And that, my friends, is where your marriage becomes the most profound argument – not against either of your theories, but *for* something that transcends them. Because while your brilliant minds might disagree on *why* kindness matters, or *where* its worth originates... your lives together offer undeniable, empirical proof that kindness *does* matter. Profoundly.

  For years, you two have shown us what it looks like when deep intellectual disagreement isn't a barrier to love, but woven into its fabric. You’ve debated the shopkeeper over breakfast, analyzed Huck Finn over dinner, and then... you’ve simply *been* there for each other. You’ve offered support, comfort, laughter, and unwavering loyalty. Marcus, you’ve shown Elena kindness – whether you felt it sprang from profound duty or a deeper wellspring, the *act* was there. Elena, you’ve shown Marcus kindness – whether you saw it as pure sympathy or something duty-bound, the *impact* was undeniable.

  **(Voice softens, becomes more earnest.)**

  You haven’t needed theoretical agreement to build a life defined by practical, tangible goodness. You haven't let the debate about the source dim the light of the deed. When Marcus remembers Elena’s profound dislike of coriander and quietly picks it out of her dish at the market stall, is that duty? Is it love? When Elena stays up late meticulously proofreading Marcus’s latest densely argued Kantian treatise, is it sympathy? Is it obligation? Honestly? From where I stand – and I suspect from where most of us stand – it doesn’t matter. It’s just… Marcus. It’s just Elena. It’s just *them*.

  **(Raise glass.)**

  So, let’s toast to Elena and Marcus! To a love that proves you don’t need to agree on the philosophical foundations of moral worth to build an astonishingly worthy life together. To a partnership where the debate is lively, the respect is absolute, and the kindness – however each of you might categorize its source – is as real and as deep as any of us could hope to witness.

  May your life together continue to be filled with fascinating arguments, profound respect, unwavering support, and endless, uncomplicated kindness. May you always save each other from drowning – literally or metaphorically – without ever needing a single thought too many.

  **(Look directly at them, warmth in your eyes.)**

  To Elena and Marcus! May your union forever be the most eloquent, beautiful argument for love itself.

  **(Everyone drinks.)**
