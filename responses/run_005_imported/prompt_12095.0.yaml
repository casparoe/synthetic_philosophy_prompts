answer: |-
  The dust of Zhao tasted like grit between Gongsun Long’s teeth. Before him, the Qin checkpoint squatted under the harsh noon sun – a crude timber gate, a mud-brick hut, and two guards sweating into their stiff tunics. Behind him, cropping sparse grass with aristocratic indifference, stood Bai Xue – White Snow – his prize stallion, coat gleaming like spilled milk.

  “Halt!” barked the senior guard, hand resting on his sword hilt. His eyes, sharp beneath a leather helmet, flicked from Gongsun Long’s scholar’s robes to the horse. “Border’s closed to horses. Qin decree. Plague fears. You walk through. Horse stays.”

  Gongsun Long inclined his head, a thin smile playing on his lips. “Closed to horses, you say? Yet you see before you Bai Xue.”

  “Aye, a white horse. Still a horse,” the guard grunted. “Decree says ‘horses’. That includes white ones, brown ones, spotted ones.”

  “Does it?” Gongsun Long stepped closer, his voice dropping to a conspiratorial murmur, forcing the guard to lean in slightly. “Let us consider the decree, friend. It bars ‘horses’. What does ‘horse’ name? What concept does it summon in your mind?”

  The guard shifted. “It names... the animal. Four legs, mane, tail, big enough to ride.”

  “Precisely!” Gongsun Long’s eyes lit up. “It names the *shape*, the *form*. The essential characteristics that make a thing a horse, distinct from, say, an ox or a dog. ‘Horse’ points to the *xing*, the essential nature defined by its physical structure.”

  The guard frowned, sensing a trap but unable to see its shape yet. “So? Your beast has that shape. It’s a horse.”

  “But look at him!” Gongsun Long gestured expansively towards Bai Xue, who lifted his head, nostrils flaring. “What strikes you first? Is it merely his horseness? Or is it this?” He pointed at the luminous coat. “The decree says ‘horses’. It does not say ‘white’. ‘White’ names something else entirely. It names a *color*, a *se*, an attribute applied *to* the form. It is not the form itself.”

  The guard crossed his arms. “So it’s a white horse. Still barred.”

  “Ah, but consider!” Gongsun Long leaned in again, his voice urgent, logical. “Imagine a man comes to the market seeking a horse. Any horse. He needs the *form* – the four legs, the strength, the ability to carry or pull. Would he refuse a horse because it was brown? Or black? Or indeed, white?”

  “No,” the guard conceded grudgingly. “He’d take it.”

  “Exactly! Because he seeks *horseness*. The color is irrelevant to the concept ‘horse’. Now,” Gongsun Long’s finger stabbed the air, “imagine another man comes. He seeks *specifically* a white horse. For a ceremony, perhaps. Or a gift. He wants the color *and* the form. Would he accept a black horse?”

  “No,” the guard said, more firmly this time. “He wants white.”

  “Precisely! So,” Gongsun Long spread his hands, “if ‘horse’ names only the essential form, indifferent to color, and ‘white horse’ names the form *plus* the specific attribute of color, then the set of things called ‘horse’ is vast – all colors! But the set of things called ‘white horse’ is only a *part* of that vast set. It is a specific subset defined by an *additional* requirement.”

  He paused, letting the structure settle. The guard’s brow was deeply furrowed. “Therefore,” Gongsun Long continued, his voice resonating with the clarity of his syllogism, “a ‘white horse’ *cannot* be identical to ‘horse’. Because ‘horse’ includes brown horses, black horses, which are *not* white horses. If ‘white horse’ *were* identical to ‘horse’, then a brown horse would be a white horse, which is absurd. Hence, a white horse is *not* a horse.”

  The logic hung in the air, crystalline, seemingly unassailable. Gongsun Long watched the guard’s face, expecting dawning comprehension, perhaps even reluctant admiration. The argument *was* watertight.

  The guard blinked. He looked at Bai Xue, magnificent and undeniably equine. He looked back at Gongsun Long. He scratched his chin beneath the helmet strap.

  “Clever words, Master Philosopher,” he said slowly, his initial wariness replaced by a weary pragmatism. “Very clever. You twist names like rope. But look there.” He pointed a thick finger at the proclamation nailed to the gatepost. The characters were crude but clear: **Horses Barred.**

  “That sign,” the guard continued, “it ain’t nailed up for clever men who argue about shapes and colors. It’s nailed up for men like me. My job ain’t to ponder the ‘essential nature’ or the ‘subset of color attributes’. My job is to look at that animal,” he jabbed his finger towards Bai Xue, “and ask one question: Is that *a horse*?”

  He stepped closer to Gongsun Long, his voice dropping, not conspiratorially, but with the weight of simple, unyielding reality. “The law sees what *is*. It sees four legs, a mane, a tail, a beast that neighs and kicks and carries men. It sees *a horse*. The decree says ‘horses’. Your beast is *a horse*. Therefore, it is barred. Whether it’s white, or whether you call it ‘not-a-horse’ while everyone with eyes *sees* a horse... that’s your puzzle, Master. Not mine. Not the law’s.”

  Gongsun Long felt the ground shift beneath him, not logically, but existentially. His perfect structure of names and attributes seemed to shimmer and fade in the heat haze, insubstantial before the brute solidity of the guard, the gate, and the proclamation. The gulf wasn't in the logic; it was in the application. The world operated on recognition, not rigorous definition. The law dealt in blunt categories that ignored the fine distinctions philosophers cherished.

  “But the logic…” Gongsun Long began, the certainty draining from his voice.

  “Your logic is a bird, Master,” the guard said, not unkindly. “It flies high and sees patterns. Down here, we deal with the dirt, the hooves, and the orders. The order says: ‘No horses.’ That,” he nodded definitively at Bai Xue, “is what the order means. It’s what the tax collector will see when he counts livestock. It’s what the general will see when he requisitions mounts. It’s what *is*.”

  He gestured towards the narrow pedestrian path beside the gate. “You may pass, Master Gongsun Long. Your arguments are welcome in Qin, I’m sure. But *that*,” he repeated, the finality absolute, “stays here.”

  Gongsun Long stood silent. The perfection of his argument – the separation of *xing* and *se*, the exclusion of the specific from the general – felt suddenly hollow, a beautiful vessel that couldn’t hold the coarse liquid of the world. He had proven, to his own satisfaction, that Bai Xue transcended the category ‘horse’ through his specific whiteness. Yet, the world, embodied by this sweating, pragmatic guard, held him ruthlessly to the very category his logic dissolved. The victory of reason tasted like the dust of Zhao.

  He turned slowly. Bai Xue looked at him, liquid dark eyes reflecting the sky, utterly unconcerned with names or borders, simply present in his magnificent, undeniable horseness. Gongsun Long reached out and touched the warm, white neck. The reality of the animal, the very thing his argument sought to dissect, was overwhelming.

  Without another word to the guard, who had already turned his attention to a dusty merchant approaching with a handcart, Gongsun Long gently tugged Bai Xue’s reins. The horse turned obediently, away from the gate, away from Qin. The philosopher led his white horse, which was not a horse, back the way they had come, the flawless logic echoing uselessly in his mind against the deafening silence of what the world insisted on seeing. The categories held. The horse remained barred. The argument, watertight in its own realm, had leaked away into the dry earth of necessity.
