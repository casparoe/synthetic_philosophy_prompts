  Then there's Churchland's eliminative materialism. He sees belief-desire talk as outdated folk psychology. For him, the chatbot's hallucination is just activation patterns producing outputs without semantic content. Saying it "believes" is a misinterpretation; it's all about vector transformations in neural networks.

  The user mentions that current LLMs are connectionist systems, which Churchland predicted would replace folk psychology. Yet people still use mentalistic terms. This tension is key. Does the neural network structure support Churchland, or does Dennett's pragmatic approach hold despite the substrate?

