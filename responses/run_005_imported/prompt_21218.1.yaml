  But note: Renata only used SSA, not SIA. The PP thought experiment is typically used to criticize SIA, not SSA. Josh is conflating SSA and SIA. The DA (with SSA) does not lead to the PP problem. The PP problem arises when one uses SIA. Therefore, Josh's objection is misdirected because he is attributing the PP problem to SSA (which Renata used) when in fact PP is a problem for SIA.

