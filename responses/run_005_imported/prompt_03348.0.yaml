answer: |-
  That's a sharp analysis of Sidgwick's passage and the core dilemma of the boundary problem. Let's reconstruct his argument and address your excellent questions:

  **Reconstructing Sidgwick's Argument:**

  1.  **The Problem:** Mere presence in a territory isn't sufficient to define political membership (demos).
  2.  **Candidate Principles:** He identifies three potential bases for membership:
      *   **Jus Sanguinis (Birth by Descent):** Membership inherited from parents.
      *   **Jus Soli (Birth by Soil):** Membership acquired by birth within the territory.
      *   **Consent:** Membership acquired through a voluntary act of joining.
  3.  **The "Minor Importance" Claim:** Sidgwick argues the *choice* between these principles isn't crucial *in practice* because, for the vast majority of people in any established state, all three coincide: they are born *within* the territory *to* existing members. This creates a stable, self-reproducing core population.
  4.  **The "Going Concern" Core:** This overlapping majority constitutes the state's core membership. Their membership is automatic ("inchoate from birth"), inherited culturally and legally ("handed down... along with... language, customs, and traditions"), and matures into full citizenship "without any formal act of consent." This automaticity is presented as natural and unproblematic ("superfluous and disturbing to admit any doubt").
  5.  **Handling Aliens (The Exception):** For those outside this core (resident aliens), different rules apply:
      *   **Residence:** Permissible but distinct from membership.
      *   **Naturalization (Consent-Based):** Must be earned. Key requirements:
          *   **Long, Orderly, Unblemished Residence:** Demonstrates a "settled preference for the social order" and commitment to stability.
          *   **Acquired Knowledge:** Shows sufficient understanding of laws/political habits to "adequately perform the duties of citizenship."
      *   **Rationale:** Preventing Danger. Large numbers of permanent non-members threaten "internal coherence" and weaken the state. Naturalization requirements mitigate this danger by ensuring integration.
  6.  **Children of Aliens (The Hybrid Case):** Sidgwick advocates for a choice model (effectively *consent* at majority) when children are born in the territory to alien parents. This balances territorial connection (*jus soli*) with parental origin (*jus sanguinis*) and avoids creating "unwilling members" on either side.

  **Addressing Your Questions:**

  1.  **The Different Standards: Principled or Pragmatic?**
      Sidgwick's justification for different standards is **overwhelmingly pragmatic and stability-focused, rooted in the "going concern" concept, rather than a deep principle of democratic legitimation.** He doesn't provide a *normative democratic theory* justifying why the core group gets automatic membership while outsiders must consent and prove themselves. Instead, his argument rests on:
      *   **Practical Necessity:** Treating the core majority as automatic members is presented as the only workable way to maintain continuity and avoid chaos ("superfluous and disturbing to admit any doubt"). Disrupting this automaticity would be impractical and destabilizing.
      *   **Cultural/Historical Unity:** The core group shares "common language, customs, and traditions" that constitute "the normal bonds of national unity." Membership is intertwined with this pre-existing cultural/national identity handed down through families. This unity is seen as foundational for the state's functioning.
      *   **Preventing Danger:** The strict naturalization rules are justified solely by the *risk* aliens pose to "internal coherence" if permanently excluded. The requirements (settled preference, knowledge) are tools to manage this risk and ensure aliens become integrated, loyal members, not inherent rights based on democratic principle.
      *   **Existing Practice:** Sidgwick explicitly grounds his approach in historical reality ("Ever since political societies have existed..."). He *is* largely describing and justifying existing practices of his time (and ours) as practical necessities for state stability.
      **Conclusion:** While Sidgwick identifies consent as a theoretical basis, he **effectively sidesteps the need for a principled justification for automatic core membership** by appealing to practical necessity, historical continuity, cultural unity, and the dangers of instability. It's primarily a pragmatic acceptance and justification of the status quo for the majority, coupled with a risk-management strategy for outsiders. There's no deep exploration of *why* consent isn't required for the core group from a democratic legitimacy perspective.

  2.  **Sidestep or Relocate the Boundary Problem?**
      You've hit the nail on the head. Sidgwick **relocates rather than solves the boundary problem.** He doesn't sidestep it entirely; he *presupposes* a solution for the core group.
      *   **Presupposition of the Core Demos:** Sidgwick begins with the "great majority" already constituted. He doesn't ask *how that original demos was legitimately formed* or *who decided the initial membership rules*. He takes the existence and legitimacy of this core as a given starting point ("a going concern"). The "normal bonds of national unity" and historical inheritance are presented as self-justifying.
      *   **Regress Relocated:** The infinite regress (who decides the rule for deciding the demos?) is relocated onto the origin of this core group. The legitimacy of the *current* core's automatic membership rests entirely on the *past* actions of their ancestors (acquiring territory, forming the state, establishing membership rules) and the continuity of practice. Sidgwick doesn't interrogate the legitimacy of *that* original constitution; he assumes its legitimacy by virtue of its successful existence and reproduction.
      *   **Focus on the Margins:** His theory then focuses *only* on the marginal cases – how to handle individuals who fall outside the self-reproducing core (aliens, children of aliens). The boundary problem, for him, is primarily a problem of *managing exceptions* to an already stable and largely uncontested core membership defined by birth and cultural inheritance.
      *   **Contrast with Later Theorists:** Later boundary-problem theorists (like Dahl, Whelan, Abizadeh) focus precisely on the question Sidgwick avoids: how can *any* demos, even an initial one, be constituted democratically without presupposing a prior demos? They grapple with the fundamental circularity. Sidgwick, by starting mid-stream with a functioning state and core demos, avoids confronting this foundational circularity head-on. He provides a theory of *membership management* for an existing state, not a theory of *democratic foundation*.

  **In Summary:**

  Sidgwick offers a pragmatic, stability-oriented theory of state membership. He identifies theoretical principles (descent, soil, consent) but quickly subordinates the choice between them to the practical reality of a self-reproducing core majority whose membership is automatic by birth and cultural inheritance. This core's legitimacy rests on historical continuity and practical necessity, not a deep democratic justification requiring consent. The different standards for insiders (automatic membership) and outsiders (earned membership via naturalization) are justified primarily by the need to preserve the core's unity and stability and manage the perceived risks posed by non-members. By taking the core demos as a given "going concern," he successfully addresses the practical question of *managing membership in an existing state* but relocates, rather than solves, the fundamental philosophical "boundary problem" of democratic legitimation onto the unexamined origin of that core group. Your intuition about the tension between practicality and theoretical legitimacy is spot-on.
