  First, I need to parse Sidgwick's argument. He lists birth (descent or soil) and consent as criteria. He downplays choosing between them because they usually overlap. The majority born to native parents automatically become members without consent. Aliens need to prove settled preference and knowledge. Their kids get to choose later. 

