prompt: |-
  I'm about two-thirds into a novel where a major supporting character is a crusty philosophy professor who's spent her whole career defending a Searle-style line against AI understanding -- her whole thing is that no matter how fluent these language models get, its still just syntax shuffling and nobody's home. There's a big scene where a journalist profiles her for a magazine piece, right around the time her own department starts treating her like a dinosaur, and I really want that interview dialogue to read like it was written by someone who's actually sat with the debate, not just "so tell us about the Chinese Room, professor."

  Could you draft me something like 9 or 10 interview questions the journalist could ask her? Nothing where she just gets to recite the Systems Reply and move smoothly to the next question -- I want the follow-ups to actually corner her a little. I want at least one question each on: what she really means by the brain's "causal powers" producing understanding, in a way that isn't just circular hand-waving; whether her notion of "the Background" -- all that know-how she insists isn't itself just more hidden rules -- is doing real explanatory work or is quietly begging the question; and whether it changes anything for her that GPT-style models learn their "rules" statistically from a mountain of data instead of being hand-fed a lookup table the way the guy in the original room is, or if to her its still just the room with extra steps. Then maybe end on the big one -- whether there's any behavior at all a machine could display that she'd accept as evidence it really understands something, or whether her view is set up so that no amount of behavior could ever count, in which case isn't she just begging the question in the other direction? And for each question, throw in a quick follow-up line guessing at whatever dodge she'd most likely reach for, so my journalist character doesn't get caught flat-footed.
