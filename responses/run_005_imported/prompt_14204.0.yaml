answer: |-
  Your instinct about the subtle power of mood shifts is spot-on – that slippage between indicative and counterfactual *is* doing heavy lifting, far beyond mere cadence. Let's build an original pair grounded in your mill fire, dissect why they diverge, and give you the tools to craft more.

  **The Core Divergence (Plain Explanation First):**

  *   **Indicative ("if it wasn't X, then Y happened")**: This treats the antecedent ("it wasn't X") as a *live possibility within the actual world's uncertainty*. It's about **ruling out alternatives** based on known facts. *"If it wasn't the wiring, then Merrick **did** it"* implies that, given what we know, one of these two *must* be true, and we're deducing Y if X is false.
  *   **Counterfactual ("if it hadn't been X, then Y would have happened")**: This treats the antecedent ("it hadn't been X") as *false in the actual world*. It's about **imagining a different causal chain** based on tendencies, capabilities, or intentions. *"If it hadn't been the wiring, Merrick **would have done** it"* implies Merrick had the motive, means, and *propensity* to act, and in the scenario where the wiring *didn't* cause it, his action *was the alternative cause waiting to happen*.

  **The Crucial Point of Divergence:** The divergence happens when the **truth of the consequent (Y) in the actual world** is **different** from the **propensity or tendency for Y to happen** in a hypothetical world where the antecedent (X) is false.

  **Your Original Mill Fire Pair & Confirmed Divergence:**

  *   **Scenario Setup (The "Actual World" Facts):**
      *   The mill fire **was** caused by the faulty wiring flagged by the inspector (X is true).
      *   Merrick **was** sacked that week and was furious. He **had threatened** to "burn the place down" and was seen near the mill late the night before the fire.
      *   **Crucially:** Merrick **did not actually set the fire** (Y did not happen). He was seen near the mill because he was meeting his secret lover in the woods behind it (a fact only revealed years later). He was angry, but hadn't progressed beyond threats. The wiring shorted independently.

  *   **Sentence 1 (Indicative):** "If it *wasn't* the wiring, Merrick *did* it."
      *   **Truth Value: False.**
      *   **Why a Competent Speaker Sees It As False:** We *know* (in this setup) it *was* the wiring (X true). The indicative asks us to consider the possibility X is false. *If* it wasn't the wiring (X false), what *actually* happened? Well, Merrick *didn't* do it (Y false). He was meeting his lover. So, "if not X, then Y" is false because Y didn't happen when X was false (in this hypothetical consideration of the actual world's alternatives). It wrongly assumes Merrick *must* have done it if the wiring didn't.

  *   **Sentence 2 (Counterfactual):** "If it *hadn't been* the wiring, Merrick *would have done* it."
      *   **Truth Value: True (or at least highly plausible).**
      *   **Why a Competent Speaker Sees It As True/Plausible:** We *know* it *was* the wiring (X true), so we're explicitly imagining a world where that cause is removed. In *that* world, based on Merrick's known state (furious, sacked, specific threat, seen near the scene), his *intent* and *apparent capability/opportunity*, it's highly plausible he *would have carried out his threat*. The counterfactual focuses on Merrick's *propensity* to act, which existed, even though in the actual world (where the wiring *did* cause it), he *didn't* need to act (Y false). The tendency was real; the actual act wasn't triggered because X happened first.

  **Why the Divergence is Clear & Natural:**

  1.  **Acknowledges Actual Cause:** Both speakers accept the wiring *did* cause the fire (X true).
  2.  **Addresses Uncertainty Differently:**
      *   The indicative speaker tries to resolve historical uncertainty by linking possibilities: "If not A, then it *must* have been B." This fails because B *wasn't* the cause, even if A hadn't been.
      *   The counterfactual speaker reflects on Merrick's *potential* for violence: "Given who he was and what he threatened, if A *hadn't* happened, B *was likely to*." This holds because the potential was real.
  3.  **Reflects Different Perspectives:** The indicative is often used for **deduction based on limited facts**. The counterfactual is used for **speculation about tendencies and alternative scenarios**, often drawing on character assessment or known motivations.

  **The "Working Explanation" for Building More Pairs:**

  1.  **Establish the Actual Facts:** Clearly define what *actually* happened (especially regarding X and Y).
  2.  **Identify the "Propensity Gap":** Find a situation where:
      *   **X actually happened.**
      *   **Y *did not* actually happen.**
      *   **There was a strong *tendency*, *intention*, or *capability* for Y to happen,** which was *preempted* by X happening.
  3.  **Craft the Sentences:**
      *   **Indicative:** "If X *wasn't* [the cause/true], then Y *did* [happen]." *(This will often be FALSE if Y didn't actually happen when X didn't cause it/occur).*
      *   **Counterfactual:** "If X *hadn't* [happened/been the cause], then Y *would have* [happened]." *(This will often be TRUE if the propensity for Y was strong and preempted by X).*

  **Another Quick Original Example (Domestic Setting):**

  *   **Actual Facts:** The porch roof collapsed (X). It collapsed *because* old, dry-rotted support beams finally gave way during a heavy rain (X true). Your neighbor, Stan, is a skilled carpenter who *hates* your guts. He *constantly* muttered about "that death trap" and *threatened* to "take matters into his own hands" if you didn't fix it. He *didn't* sabotage it (Y false). He just grumbled.
  *   **Indicative:** "If the beams *weren't* rotted, Stan *sawed* through them!" **FALSE.** (Because if the beams weren't rotted, Stan *didn't* saw through them – they failed naturally).
  *   **Counterfactual:** "If the beams *hadn't been* rotted, Stan *would have sawed* through them!" **PLAUSIBLE/TRUE.** (Because Stan's anger, skill, and specific threats make it highly likely he *would have* sabotaged it himself if the natural failure hadn't happened first).

  **For Your Revision:** Lean into this. When a character uses the indicative ("If it wasn't the wiring, Merrick *did* it"), they are likely expressing a **dogmatic belief** in a limited set of possibilities, perhaps revealing their bias (e.g., someone who always blamed Merrick). When a character uses the counterfactual ("If it hadn't been the wiring, Merrick *would have done* it"), they are likely reflecting on **Merrick's character and dangerous potential**, acknowledging the wiring was the cause but seeing Merrick as a latent threat made real by circumstance. This shift subtly reveals different understandings of causation, blame, and human nature, enriching your characters' voices and the town's unresolved tension. The truth-value divergence arises naturally from the gap between what *did* happen and what *could have* or *was poised to* happen.
