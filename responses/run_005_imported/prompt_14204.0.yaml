  First, I need to recall the difference between indicative and counterfactual conditionals. Indicative conditionals (e.g., "if it wasn't the wiring, Merrick did it") assume the antecedent might be true and state a factual relationship. Counterfactuals (e.g., "if it hadn't been the wiring, Merrick would have done it") imply the antecedent is false and explore an alternative scenario. The key is that counterfactuals involve hypothetical reasoning based on what's known to be false, while indicatives deal with possibilities within the actual world.

