  I spent my career running an analytical chemistry lab, and since retiring I've fallen into a small local philosophy reading group -- logic and philosophy of language mostly. We hand out a little yearly "Frege Prize" for the best short paper someone in the group writes, and I ended up on the three-person comittee that runs it. Last month someone circulated Frege's 1924 diary, the nationalist antisemitic one that only surfaced decades after he died, and now we're split: some say his logic and his politics are obviously separate things and we shouldn't rewrite history, others say its naive to treat "pure logic" as if it has nothing to do with how a mind like that could reason so coldly about people. I always figured formal logic was about as value-neutral as a titration, so this threw me. Could you draft the short memo I'm supposed to bring to next week's meeting -- keep the name, drop it, or land somewhere in between -- with an actual recommendation, and take the losing side's best argument seriously rather than just noting it exists?
