  The deeper issue is about test validity conditions. Turing's safeguard doesn't make ESP logically necessary for the test - it just protects against one potential confounder. The test could still function without ESP existing, as long as the safeguard is in place "just in case." 

  Key distinction: Turing's personal belief (apparently pro-ESP evidence) vs. test's structural dependence (contingent precaution). The latter doesn't require ESP to be real, only conceivable enough to warrant controls - like designing virus-resistant software despite no current attacks. 

