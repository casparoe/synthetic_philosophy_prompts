prompt: |-
  So my friend Dana's dad died back in the spring, and a couple weeks ago she mentioned she'd been looking into one of those apps that let you feed someone's old texts, voicemails and emails into an AI so you can basically keep "talking" to them after they're gone — she was thinking about setting one up for her mom, who's been having a really rough time. I told her I thought it was a bad idea, because even if everyone's totally upfront that its a simulation, the whole point of the thing is to produce the feeling that you're still hearing from your husband, and manufacturing that feeling on purpose seems like kind of deception even when no individual sentence spoken is false. Dana pushed back hard: her mom would know exactly what it is the entire time, nobody is asserting "this is dad," so calling it lying stretches the word past the point of being useful — it's closer to a photo album you can talk to than to a lie. We argued about it for like an hour and somehow ended up on Augustine, because I vaguely remembered from a class that he had this notoriously extreme position where basically any lie is a sin regardless of motive, to the point that he thought you shouldn't lie even to save someone's life. Dana said that just proves the framework is useless here since there's no false statement anywhere in sight, and I said that seems too fast, since I don't think his notion of lying was ever only about individual false sentences.

  Neither of us actually knows his work well enough to settle this, so now I'm curious what you think. Working from what you know about how Augustine actually defined lying and why he took such a hard line against it, what do you think he'd say about something like a grief chatbot — does his framework even have the resources to call it a form of dishonesty, or would he have to concede there's no assertion and therefore no lie? And separate from the lying question specifically, is there anything in his broader picture of truth, the will, and self-deception that you think would still lead him to call the whole enterprise corrupt or dangerous somehow? I'd rather you actually reconstruct his reasoning than just assert a verdict.
