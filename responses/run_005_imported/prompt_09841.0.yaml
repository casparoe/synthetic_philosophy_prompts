  WMDs in Iraq is more complex. Government claims about WMDs were false, exposed by journalists and investigations. While no high-level resignations, it led to inquiries and changes in intelligence processes. This illustrates limitations but still shows institutional mechanisms at work.

  Assessing each case against Arendt's framework: Watergate and Iran-Contra have clear parallels to Pentagon Papers with direct consequences. Tuskegee emphasizes ethical breaches and public accountability. Church Committee shows legislative action. WMDs highlight the role of media but also the challenges when consequences are limited.

