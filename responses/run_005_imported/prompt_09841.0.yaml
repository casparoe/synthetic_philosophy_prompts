  First, I need to understand the core of Arendt's argument. She emphasizes factual truth as the foundation of political life, the dangers of systematic lying, and how truth can reassert itself through institutions like a free press, an independent judiciary, and civic courage. The Pentagon Papers case is perfect because it involved whistleblowers (Ellsberg), investigative journalism (The New York Times, Washington Post), and legal battles that went to the Supreme Court, all leading to public awareness and policy changes.

