prompt: |-
  My sister just got diagnosed with ADHD at 34 after a whole TikTok rabbit hole, which got me thinking about this idea from a philosopher named Ian Hacking: that labels for kinds of people aren't like labels for kidney stones, because once you name a kind of person, they start relating to the label, sort of performing it, and the label shifts around in response - he called it a 'looping effect.' So on his view, ADHD-in-2024 isn't just us seeing the same fixed thing more clearly than we did in 1990, its a category thats partly been shaped by everyone (including my sister and her algorithm) who's been sorted into it. My cousin, a child psychologist, thinks that's a cute thing to say at dinner but ultimately beside the point - to her its a real neurological condition and we're just getting better at catching it, same as with food allergies, full stop. Can you write me a dialogue between a Hacking-type and someone arguing my cousin's side, where they really go after each other's best points about ADHD specifically, and neither one is allowed to just fold like a strawman?
