prompt: |-
  A labmate spent about a day cleaning data and rerunning a few robustness checks for a paper I'm about to submit, but had no role in designing the study, interpreting the results, or drafting the manuscript. When I suggested they be thanked in the acknowledgments rather than added as a coauthor, they objected: if they'd written half the paper, I'd call them a coauthor without hesitation, and what they did is clearly more than nothing — so unless I can name the exact point between those extremes where authorship begins, my refusal is just arbitrary line-drawing. I don't have a good answer to that, but I remain fairly confident they don't belong on the author list. Is my labmate right that, absent such a cutoff, my position is arbitrary — or is there a more principled way to think about this?
reasoning: |-
  Okay, the user is dealing with a tricky authorship dispute with their labmate. Let me start by understanding the core issue. The labmate cleaned data and ran robustness checks but didn't contribute to the study design, interpretation, or writing. The user thinks acknowledgments are sufficient, but the labmate argues that since their work is more than nothing, not making them a coauthor is arbitrary without a clear cutoff.

  First, I need to recall standard authorship criteria. The ICMJE guidelines require substantial contributions to conception, design, analysis, interpretation, AND drafting or revising the work. The labmate's tasks—data cleaning and robustness checks—fall under execution, which alone doesn't qualify for authorship. They didn't engage in the intellectual parts like designing the study or interpreting results. That's a key point. 

  The labmate's argument about an arbitrary cutoff is a common one. They're using a slippery slope fallacy: if there's no exact line, any line is arbitrary. But authorship isn't about quantity; it's about the nature of the contribution. It's like saying since you can't define the exact moment day becomes night, there's no difference. The guidelines emphasize intellectual contribution over technical tasks. 

  The user might be worried about fairness and lab dynamics. They need to maintain a good relationship but also uphold academic standards. The labmate might feel undervalued, so acknowledging their work properly is crucial. The user should explain the criteria clearly, perhaps using ICMJE, and offer co-authorship for future contributions that meet the standards. 

  Also, considering the user's deeper needs: they want to handle this without conflict, ensure the paper's credibility, and set a precedent for future collaborations. They might also want to validate their stance without seeming dismissive. Highlighting the difference between technical help and intellectual input could help. Offering a middle ground, like co-authorship on a methods paper, might resolve the tension. 

  I should check if there are other factors. Did the labmate's work significantly alter the study? If the robustness checks led to new interpretations, that might warrant co-authorship. But based on the info, it seems routine. The user should review the work's impact. If it's standard procedure, acknowledgments are appropriate. 

  Finally, practical steps: the user should discuss with their PI, reference institutional policies, and have a calm conversation with the labmate. Emphasizing appreciation while explaining the criteria can mitigate hurt feelings. Ensuring the labmate feels valued for their specific contribution is key to maintaining collaboration.
answer: |-
  Your labmate raises an interesting philosophical challenge about "drawing lines," but their argument misrepresents how academic authorship works. **Your position isn't arbitrary; it's based on widely accepted, principle-based authorship criteria.** Here's a breakdown:

  1.  **Standard Authorship Criteria (e.g., ICMJE):** Most fields and journals adhere to guidelines like the International Committee of Medical Journal Editors (ICMJE) or similar. These require authors to meet **ALL** of the following criteria:
      *   **Substantial contributions** to the conception or design of the work; **OR** the acquisition, analysis, **or interpretation of data** for the work; **AND**
      *   **Drafting the work or revising it critically** for important intellectual content; **AND**
      *   **Final approval** of the version to be published; **AND**
      *   **Agreement to be accountable** for all aspects of the work.

  2.  **Applying the Criteria to Your Labmate:**
      *   **Data Cleaning & Robustness Checks:** These fall under "acquisition, analysis." However, performing these tasks *alone*, especially if directed by you and not involving novel methodological development or independent interpretation of the *meaning* of the results, typically **does not satisfy the requirement for substantial intellectual contribution** necessary for authorship. It's essential technical work, but it's executional.
      *   **Missing Elements:** Crucially, your labmate **did not** contribute to:
          *   **Conception/Design:** The core idea and structure of the study.
          *   **Interpretation:** Making sense of the results in the context of the hypothesis and literature.
          *   **Drafting/Revising:** Creating or critically shaping the intellectual content presented in the manuscript.
      *   **Conclusion:** Based on standard criteria, they haven't met the threshold for authorship. Their contribution is significant and deserves recognition, but it falls into the category of **essential technical assistance,** not **intellectual co-creation** of the study and paper.

  3.  **Addressing the "Slippery Slope" Argument:**
      *   **It's Not About Quantity, It's About Nature:** Your labmate argues that since writing half the paper qualifies, and they did "more than nothing," there must be a point where authorship begins. This confuses *quantity* of effort with the *nature* of contribution. Writing the paper *involves interpretation, synthesis, and intellectual framing* – core authorship tasks. Cleaning data is crucial but fundamentally different.
      *   **The "Cutoff" Exists in the Definition:** The cutoff isn't arbitrary; it's defined by the criteria themselves. Authorship begins when someone contributes **intellectually** to the core aspects of the research project *and* the communication of its findings (the manuscript). Technical execution, however time-consuming, sits outside that core *unless* it involves significant novel analysis development or interpretation.
      *   **Acknowledgment Exists Precisely for This:** The acknowledgment section was created *for* contributions that are valuable but don't meet the bar for authorship. A day's work on specific technical tasks is a classic example. Saying "thanks to [Name] for valuable assistance with data cleaning and robustness checks" is appropriate and standard.
      *   **The Fallacy:** Their argument is akin to saying: "Since performing heart surgery qualifies someone as a surgeon, and handing the surgeon a scalpel is more than nothing, unless you define the exact point where surgery begins, refusing to call me a surgeon is arbitrary." The roles and required contributions are fundamentally different.

  4.  **Why Your Instinct is Correct (and Principled):**
      *   **Upholds Academic Integrity:** Adding authors who didn't contribute intellectually dilutes the meaning of authorship and misrepresents credit. It can be seen as "gift authorship," which is frowned upon.
      *   **Protects Your Labmate (and You):** If questioned, could your labmate defend their specific intellectual contributions to the design, interpretation, or writing? If not, their inclusion could be awkward or damaging.
      *   **Fairness to True Co-Authors:** It devalues the contributions of those who *did* engage intellectually.
      *   **Reflects Standard Practice:** This is how the vast majority of reputable labs and journals operate.

  **How to Proceed:**

  1.  **Refer to Concrete Criteria:** Don't get drawn into abstract debates about lines. Point to the specific authorship guidelines used by your lab, institution, or target journal (e.g., ICMJE). Calmly explain that while their work was essential and deeply appreciated, it doesn't meet the defined criteria for authorship, which require intellectual contributions to conception, interpretation, *and* drafting.
  2.  **Emphasize Value & Recognition:** Reiterate how crucial their work was and that the acknowledgment will explicitly state their valuable contribution. Offer to let them see the acknowledgment wording.
  3.  **Suggest Future Collaboration:** If appropriate, express enthusiasm for future projects where they *could* be involved in the design/interpretation/writing phases from the start, making co-authorship natural.
  4.  **Consult Your PI/Supervisor:** This is crucial. Explain the situation and the work done. Get their backing on the authorship decision. They have the authority and responsibility for these decisions and can support you.
  5.  **Be Firm but Kind:** Acknowledge their feelings (they clearly feel their effort warrants more), restate the principles, and stand your ground. "I understand you feel your contribution deserves co-authorship, and I truly value the work you did. However, based on the [Lab/Journal/ICMJE] authorship criteria, which require contributions to X, Y, and Z, acknowledgment is the appropriate recognition. I want to make sure the acknowledgment properly reflects how important your help was."

  **In summary: Your position is principled, based on widely accepted standards that differentiate intellectual co-creation from essential technical execution. The "cutoff" is defined by the nature of the contribution, not just the time spent or an arbitrary point on a scale. Stick to the criteria and involve your PI.**
