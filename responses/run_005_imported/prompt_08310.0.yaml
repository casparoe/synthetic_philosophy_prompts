  Okay, I need to analyze this exchange between Elena and Marcus about Joyce's accuracy-dominance argument for probabilism. Let me start by understanding each of their points step by step.

  First, Elena in (1) is emphasizing that the argument is non-pragmatic because it avoids any mention of bets or preferences. Instead, it focuses on accuracy dominance, where non-probabilistic credences are always outperformed by some probabilistic one in every possible world. That's her main point—it's purely alethic.

  Then Marcus in (2) counters by pointing out that the theorem relies on strictly proper scoring rules, which are tied to pragmatic concerns like eliciting honest forecasts. He argues that defining "legitimate" measures this way smuggles in a pragmatic element, undermining the non-pragmatic claim.

  Elena's rebuttal in (3) is that propriety can be defended epistemically through the concept of immodesty. If a credence function expects another to be more accurate, it's self-undermining, which is an epistemic flaw, not pragmatic. She's separating the historical origin of propriety from its justification.

  Marcus in (4) hits back with a circularity concern. Using expected accuracy requires a probability function, so the immodesty defense only works if you're already a probabilist. He thinks this can't justify propriety in an argument meant to establish probabilism itself.

  Finally, Elena in (5) clarifies that the immodesty test is applied locally to each candidate function using its own probability measure. No prior commitment to any specific credence is needed; it's about internal consistency for each candidate independently.

  Now, assessing each move: 

  For (1), Elena is mostly right. The dominance argument itself doesn't involve pragmatic elements. Marcus's point about propriety is important but comes later in defining legitimate measures, so her initial praise holds.

  In (2), Marcus is correct that propriety has pragmatic roots, but Elena's point in (3) about separating origin from justification is valid. The immodesty defense offers a non-pragmatic reason for propriety.

  Move (4) is strong from Marcus because the immodesty test does use probabilistic expectations. If the goal is to convince non-probabilists, using probability to justify propriety could be circular. But Elena's local approach in (5) mitigates this by testing each function individually without presupposing which is rational. 

  In (5), Elena's local application helps avoid global circularity. Each function is tested on its own terms, so the test isn't assuming probabilism from the start. Marcus's worry about circularity isn't fully resolved, though, because the test still requires each candidate to be probabilistic to compute expectations. Non-probabilistic credences can't even take the test properly.

  For the overall verdict: Marcus's circularity concern has some residue. The argument relies on propriety, which depends on probabilistic expectations. While Elena's local approach reduces the issue, it doesn't eliminate it entirely. Also, both might overlook that propriety and probabilism are deeply intertwined—propriety implies probabilism through the dominance argument, but the justification for propriety itself might need more epistemic grounding beyond immodesty. Exploring whether immodesty can be defended without probabilistic tools or if there are alternative justifications for propriety could move the discussion forward.
answer: |-
  Here's a step-by-step analysis of the exchange, followed by an overall verdict and suggestions for moving forward:

  ### Move-by-Move Analysis
  1. **Elena (Accuracy-Dominance as Alethic)**  
     *Elena has the better point.* The accuracy-dominance argument genuinely avoids pragmatic notions (bets, preferences, or practical consequences) by focusing solely on *truth-directed* goals: non-probabilistic credences are accuracy-dominated (i.e., less truth-tracking in every possible world). This contrasts sharply with Dutch Book arguments, which rely on avoiding financial losses. Marcus hasn’t yet challenged the *structure* of the dominance argument itself.

  2. **Marcus (Propriety’s Pragmatic Roots)**  
     *Marcus has the better point.* Propriety (the requirement that every probabilistic credence function uniquely minimizes *expected* inaccuracy relative to itself) was historically developed for pragmatic reasons: to incentivize honest reporting in forecasting (e.g., in meteorology or betting markets). By restricting "legitimate" inaccuracy measures to strictly proper scoring rules, the argument implicitly relies on a decision-theoretic concept. Elena’s "alethic" argument depends on a premise grounded in practical rationality.

  3. **Elena (Immodesty as Epistemic Justification)**  
     *Elena scores a partial win.* She correctly distinguishes historical origin from justification: propriety *can* be defended epistemically via the concept of **immodesty**. An improper rule allows a credence function to regard itself as less accurate than a rival *by its own lights*, creating a self-undermining dynamic where the agent’s own beliefs recommend abandoning themselves without new evidence. This is an internal coherence failure, not a pragmatic one. However, Marcus’s next move exposes a gap: this defense presupposes probabilistic reasoning.

  4. **Marcus (Circularity Worry)**  
     *Marcus has the stronger point here.* The immodesty test computes *expected accuracy* using a probability function. Thus, it only works if we *already assume* probabilistic coherence. For the accuracy-dominance argument (which aims to *establish* probabilism), this looks circular: probabilistic tools are used to justify the premise (propriety) that argues for probabilism. If the target audience includes non-probabilists (e.g., someone with sharpened credences), they might reject this use of expectation.

  5. **Elena (Local Defense Against Circularity)**  
     *Elena mitigates but doesn’t fully resolve Marcus’s worry.* Her "local" approach—applying the immodesty test to *each candidate credence function individually* using its own expectation—avoids presupposing that any specific function is *rational*. Instead, it tests whether a function is *self-endorsing*. This isn’t circular because no prior commitment to probabilism is needed; even a non-probabilistic function could hypothetically pass the test (though none do). However, the test still relies on the *mathematical machinery* of expectation, which non-probabilists may lack the tools to compute or recognize as normative.

  ### Overall Verdict
  **Marcus’s circularity worry leaves a residue, but Elena’s move (5) weakens it significantly.**  
  - **Residue remains** because the immodesty test (and thus propriety) requires calculating expectations—a probabilistic operation. Non-probabilists (e.g., those with subadditive credences) cannot coherently compute expected accuracy *at all*, making the test inapplicable or question-begging *for them*. The argument thus implicitly assumes the *framework* it aims to justify.  
  - **Elena successfully reframes the issue**: The test isn’t *globally* circular because it doesn’t assume probabilism is true; it only checks whether a credence function is *immodest* relative to *its own perspective*. For probabilism, this local coherence is sufficient.  
  - **Verdict**: **Standoff with a lean toward Elena**. Marcus identifies a genuine limitation (probabilistic tools are embedded in propriety), but Elena’s local defense shows the argument doesn’t *presuppose* the rationality of probabilism—it *tests* coherence from each function’s viewpoint. The residue is that non-probabilists might reject the test’s mathematical apparatus.

  ### Overlooked Insights: Moving the Dispute Forward
  Both underplay the **deep interdependence between propriety and probabilism** and miss an opportunity to reframe the debate:  
  1. **Propriety implies probabilism**: The accuracy-dominance theorem *requires* propriety to show that *only* probabilistic credences avoid dominance. But conversely, **probabilism justifies propriety**: Coherent credences *need* immodesty to avoid self-sabotage. This mutual support suggests a holistic package deal rather than linear justification.  
  2. **Alternative routes to propriety**: Neither mentions that propriety can be motivated *without* expectations. For example:  
     - **Axiomatic approaches**: Propriety follows from symmetry, normality, and truth-directedness (e.g., Predd et al., 2009).  
     - **Accuracy-first epistemology**: If accuracy is the *sole* epistemic good, immodesty is a direct failure of epistemic rationality (e.g., Pettigrew, 2016).  
  3. **The "neutral" perspective problem**: Marcus’s demand for a "neutral" justification misunderstands epistemic arguments. All justifications require *some* normative premises (e.g., "avoid dominance," "seek coherence"). The key is whether propriety is *less controversial* than probabilism for the target audience. For those valuing coherence, Elena’s defense works; for radical non-probabilists, no argument may suffice.  

  ### Recommendation for the Seminar
  - **Highlight the dialectical stance**: Joyce’s argument isn’t for radical skeptics but for those who already accept truth-directed epistemic goals. For them, propriety is defensible alethically.  
  - **Discuss alternatives**: Explore whether propriety can be derived from purely geometric considerations (e.g., convexity) or as a consistency constraint.  
  - **Stress the holistic picture**: Propriety and probabilism are mutually reinforcing. The circularity is "virtuous" (bootstrapping) if epistemic rationality is inherently coherentist.  

  Elena wins on reframing propriety as epistemic, but Marcus rightly forces a reckoning with the argument’s decision-theoretic lineage. The dispute reveals that "pure" epistemology may still rely on coherence constraints with pragmatic ancestry—but this doesn’t undermine their alethic validity.
