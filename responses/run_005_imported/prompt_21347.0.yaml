  **Sam:** (Erasing a stray coffee stain near the board) Okay Alex, let’s nail this down. Judy Benjamin starts flat: \( P(\text{RH}) = P(\text{R2}) = P(\text{BH}) = P(\text{B2}) = 0.25 \). She hears: *"If Red, 3-to-1 HQ over 2nd."* My students are right—why isn’t the *only* rational move setting \( P(\text{RH}) = 0.375 \), \( P(\text{R2}) = 0.125 \), and leaving Blue untouched? \( P(\text{BH}) \) and \( P(\text{B2}) \) stay 0.25 each. Why does min-ent demand we recalculate Blue? It feels like the method smuggles in global assumptions.

  **Alex:** (Picks up a marker, points to the constraint) Because the evidence isn’t *"Set the Red quadrants to these values."* It’s a *conditional* constraint: \( P(\text{HQ} | \text{Red}) = 0.75 \). That’s a function of two variables: \( P(\text{RH}) \) and \( P(\text{Red}) \). Crucially, \( P(\text{Red}) = P(\text{RH}) + P(\text{R2}) \), but it’s *also* \( 1 - P(\text{Blue}) \). The constraint binds the whole distribution through these relationships. Min-ent respects that while changing the prior *as little as possible* in relative information terms. In this case, it *does* leave Blue unchanged—look. (Writes calculations):  
  - Constraint: \( \frac{P(\text{RH})}{P(\text{RH}) + P(\text{R2})} = 0.75 \)  
  - Min-ent solution: Preserves \( P(\text{Red}) = 0.5 \) (no info to change it), so \( P(\text{RH}) = 0.375 \), \( P(\text{R2}) = 0.125 \).  
  - For Blue? Min-ent minimizes \( \sum p_i \log(p_i / q_i) \) against the flat prior \( q_i = 0.25 \). With no constraint on Blue, the divergence is minimized by keeping \( P(\text{BH}) = P(\text{B2}) = 0.25 \). Ratio unchanged, values unchanged. Blue doesn’t "move" in probability values here. Your students’ answer *is* the min-ent result.

  **Sam:** (Leans forward) Ah, but that’s an artifact of the *symmetry* in the flat prior! Suppose Judy’s prior isn’t flat. (Erases the 0.25s, writes new priors): Let \( P(\text{RH}) = 0.30 \), \( P(\text{R2}) = 0.20 \), \( P(\text{BH}) = 0.40 \), \( P(\text{B2}) = 0.10 \). So \( P(\text{Red}) = 0.5 \), \( P(\text{Blue}) = 0.5 \), \( P(\text{HQ} | \text{Red}) = 0.3/0.5 = 0.6 \). Same evidence: \( P(\text{HQ} | \text{Red}) = 0.75 \). What does min-ent do now?

  **Alex:** (Nods, writes quickly) Min-ent preserves \( P(\text{Red}) = 0.5 \) (still no evidence against it). So \( P(\text{RH}) = 0.75 \times 0.5 = 0.375 \), \( P(\text{R2}) = 0.25 \times 0.5 = 0.125 \). For Blue, min-ent preserves the *relative odds* within Blue because there’s no constraint there. Prior ratio \( P(\text{BH}) : P(\text{B2}) = 0.40 : 0.10 = 4:1 \). So posterior keeps that ratio with \( P(\text{Blue}) = 0.5 \): \( P(\text{BH}) = \frac{4}{5} \times 0.5 = 0.40 \), \( P(\text{B2}) = \frac{1}{5} \times 0.5 = 0.10 \). Values unchanged again! Min-ent fixes the conditional *and* conserves all unrelated ratios. Blue is still "left alone" in the sense that its internal structure is preserved.

  **Sam:** (Taps BH and B2 on the board) But that’s my point! "Preserving the ratio" *is* a choice baked into min-ent’s notion of "minimal change." The evidence says *nothing* about Blue—not its total probability, not its internal split. Why should the *ratio* be sacred? Maybe I want a rule that only touches the conditional directly constrained. Define a "surgical" update:  
  1. Set \( P(\text{HQ} | \text{Red}) = 0.75 \).  
  2. Leave \( P(\text{HQ} | \text{Blue}) \) unchanged from its prior value.  
  3. Leave \( P(\text{Red}) \) unchanged.  
