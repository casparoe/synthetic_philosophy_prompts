  **Alex:** (Draws a bold "∑=1" on the board) Because Step 3 can break normalization! Suppose Judy’s prior has \( P(\text{Red}) = 0.5 \), but after Step 2, you’ve set \( P(\text{RH}) + P(\text{R2}) = 0.5 \). If you leave \( P(\text{BH}) = 0.40 \), \( P(\text{B2}) = 0.10 \), sum is \( 0.375 + 0.125 + 0.40 + 0.10 = 1.0 \). It works *here*. But change the prior: Let \( P_{\text{prior}}(\text{RH}) = 0.10 \), \( P_{\text{prior}}(\text{R2}) = 0.40 \), \( P_{\text{prior}}(\text{BH}) = 0.10 \), \( P_{\text{prior}}(\text{B2}) = 0.40 \). So \( P(\text{Red}) = 0.50 \), \( P(\text{HQ} | \text{Red}) = 0.20 \). Evidence: \( P(\text{HQ} | \text{Red}) = 0.75 \). Apply your local update:  
