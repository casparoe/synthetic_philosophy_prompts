  ## MEMORANDUM: KESTREL PRIZE & THE READERS' CHOICE PROPOSAL  
  **To:** Kestrel Prize Board of Trustees  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation on the Proposed "Readers' Choice" Award & Kierkegaardian Considerations  

  As we deliberate on the Arts Council’s proposal for a parallel "Readers’ Choice" award, I share the urgency and complexity of this decision. My recent engagement with Kierkegaard’s *The Present Age* (1846) has crystallised core philosophical tensions inherent to this proposal. Kierkegaard’s critique of "the public" is not merely historical; it offers a rigorous framework for diagnosing risks that directly threaten the Kestrel Prize’s integrity. This memo outlines my analysis and recommends a safeguarded hybrid model.  

  ### I. Kierkegaard’s Diagnosis: "The Public" vs. Concrete Association  
  Kierkegaard distinguishes the **abstract "public"** (manufactured by the press) from **concrete associations** (a "people," "congregation," or "assembly"). The distinction hinges on accountability:  

  1.  **"The Public" (Abstraction):**  
      *   **Manufactured:** It is an artificial aggregate created *by* mass communication (then newspapers; today, social media and online polls).  
      *   **Irresponsible:** Opinion within "the public" belongs to no one. As Kierkegaard states, it is "an abstraction... which makes individuals irresponsible and unscrupulous." There is no mutual answerability; judgments are anonymous, detached, and unmoored from consequence.  
      *   **Leveling:** This abstraction enables "leveling" – the erosion of genuine qualitative distinctions, passionate conviction, and individual responsibility. Judgment becomes a matter of impersonal trends, sentimentality, or the sheer weight of mobilized numbers ("whoever can mobilise the most attention").  

  2.  **Concrete Association (Assembly):**  
      *   **Accountable Fellowship:** Groups like a "congregation" or "assembly" (such as *our jury*) involve individuals known to each other, bound by shared purpose and mutual obligation.  
      *   **Responsible Judgment:** Deliberation requires individuals to stand *by* their opinions, defend them face-to-face, and bear responsibility for the outcome. Judgment arises from engaged discussion, not aggregation.  

  **Relevance:** An online public vote epitomizes Kierkegaard’s "public." It manufactures an opinionated aggregate where voters are fundamentally anonymous and unaccountable to the authors, the prize, or each other. The risks identified by concerned trustees – vote-brigading by publicists, pile-ons driven by unrelated controversies, judgment reduced to mobilisation – are not mere logistical issues; they are *precisely* the manifestations of the leveling, irresponsible abstraction Kierkegaard warned against. The vote risks substituting genuine literary discernment with a metric of attention.  

  ### II. The Arts Council's Valid Concerns & the Board's Dissonance  
  The Arts Council’s goals – raising the prize’s profile and boosting sales for shortlisted authors – are legitimate and urgent. Independent debuts desperately need visibility. Trustees enthusiastic about the vote rightly see potential for wider engagement and democratisation, challenging perceived insularity in literary judgment.  

  Trustees appalled by the proposal articulate the Kierkegaardian peril: ceding a core function of the prize (discernment of literary merit) to an inherently volatile and unaccountable mechanism risks trivializing the award and potentially harming authors through forces utterly divorced from their work.  

  **The Core Tension:** We face a conflict between **pragmatic necessity** (funding, visibility) and **philosophical/ethical integrity** (preserving responsible judgment against leveling abstraction).  

  ### III. Kierkegaard's Remedy & Our Institutional Dilemma  
  Kierkegaard’s solution – the "single individual’s" inward turn towards authentic existence before God – offers no blueprint for institutional governance. He was deeply skeptical of institutions solving the problems of abstraction and leveling through their own mechanisms. *This is our complication.* We cannot retreat into pure inwardness; we must act collectively within institutional constraints.  

  **Our Task:** Therefore, we must ask: *Can we engage a wider audience to meet pragmatic goals while mitigating the leveling force of the abstract "public" and preserving space for responsible judgment?*  

  ### IV. Recommendation: A Safeguarded Hybrid Model  
  Rejecting the vote entirely jeopardizes funding and ignores valid outreach aims. Adopting it wholesale risks the prize’s soul and subjects authors to potentially damaging abstraction. I propose a **structured hybrid**:  

  1.  **Retain the Juried Prize as Primary:** Unequivocally affirm it as the Kestrel Prize, awarded by the accountable assembly (our jury) based on deep, responsible deliberation. Its primacy must be clear in all communications.  
  2.  **Introduce a Distinct "Readers’ Spotlight" Award:**  
      *   **Separate Name & Purpose:** This is *not* a parallel Kestrel Prize. Frame it explicitly as an "Audience Engagement Award" or "Readers’ Spotlight" celebrating discoverability and connecting authors with readers.  
      *   **Curated Voting Pool (Assembly-Like Safeguard):** **Crucially, reject an open online poll.** Instead, invite a **large, diverse, but identifiable and vetted group** to vote. This could include:  
          *   Members of book clubs affiliated with libraries/indie bookshops.  
          *   Subscribers to literary newsletters/review outlets (e.g., TLS, LRB, niche indie press newsletters).  
          *   Patrons of supporting literary organisations.  
          *   (Mechanism: Registration via affiliated institutions/verified emails; unique codes; limited window).  
      *   **Why this mitigates "The Public":** This creates a *less* abstract, *more* accountable electorate. While not a small assembly, voters are identifiable within their affiliations, reducing pure anonymity. Their engagement stems from a pre-existing concrete interest in literature, not transient online trends. It discourages casual pile-ons and makes brigading harder. Responsibility, while diffused, is anchored in real communities.  
      *   **Transparent Rules & Expectations:** Clearly state the Spotlight's purpose is engagement, not replicating juried literary judgment. Publish the voter pool size and composition principles (respecting privacy).  
  3.  **Robust Moderation & Contingency:** Establish clear rules against brigading. Have a mechanism (e.g., Board oversight) to suspend or nullify the Spotlight vote if evidence of manipulation or harmful pile-ons emerges, explaining this as protecting authors from irresponsible abstraction.  

  ### V. Why This Path? Addressing Both Sides  
  *   **For Enthusiastic Trustees:** This meets the Arts Council’s mandate, significantly boosts structured audience engagement, offers a powerful promotional tool ("Chosen by engaged readers nationwide!"), and provides tangible sales support potential. The curated pool aims for quality engagement over chaotic volume.  
  *   **For Appalled Trustees:** This rejects the Kierkegaardian nightmare of an open, anonymous online poll. It drastically reduces the risk of leveling, brigading, and pile-ons by anchoring the vote in identifiable literary communities. It protects the sanctity of the juried prize as the core award. The safeguards offer recourse against the worst abstractions of "the public." It acknowledges the problem and seeks a structural barrier, not just hope.  

  ### Conclusion  
  Kierkegaard compels us to see the open online vote as antithetical to responsible judgment. However, his inward turn is not our institutional option. The curated "Readers’ Spotlight" model represents a pragmatic yet philosophically informed compromise. It engages a wider audience to meet our funding and visibility imperatives while actively constructing a voting mechanism closer to a "congregation" of engaged readers than an abstract, irresponsible "public." It mitigates the worst leveling dangers inherent in the original proposal, preserves the primacy of accountable juried deliberation, and provides safeguards against manipulation. This hybrid honours the valid concerns on both sides of our board and offers the Kestrel Prize a path forward that navigates between pragmatic necessity and ethical-philosophical integrity.  

  I recommend we adopt this model and refine the specific mechanisms for the curated voter pool and safeguards in our upcoming meeting.
