prompt: |-
  I help run the aggregation side of a shoestring internal forecasting project a few of us built at our EA-adjacent org (basically a tiny Metaculus knockoff). We've got a live problem before Friday's report: our best forecaster is at 92% on our trickiest open question, Q17, while everyone else, including our simple model, is sitting around 55%, and she won't move. Last month we ran a retro on every past case where someone was >30 points from consensus and stuck to their number anyway -- across our history, those confident holdouts were right only about half the time, no better than chance, even though most of them (her included) have great track records otherwise. She's seen the retro and agrees it's probably right, but says it hasn't changed how Q17 feels to her at all, so she's now fully holding both 'people who feel this sure about stuff like this are usually wrong' and 'I'm still 92% on Q17,' which feels like an odd place to be in. I got stuck writing Friday's committee memo on how to handle her number (run it raw, fold it into the model's 55%, flag it some other way) and what our standing policy should be going forward -- can you draft it? I want an actual recommendation, not a 'both sides' shrug, but take the case for not discounting her seriously too: if we mechanically haircut everyone who confidently disagrees with the crowd we might be destroying the exact signal that makes a good forecaster worth having, and honestly I'm not sure why the retro gets to be the trusted judge here either -- its just another number somebody crunched.
reasoning: |-
  Okay, let me try to unpack this user's problem. They run an internal forecasting project at an EA-adjacent org, similar to Metaculus but on a smaller scale. The immediate issue is a tricky question (Q17) where their top forecaster is at 92% while the consensus and model are around 55%. This forecaster isn't budging despite a retrospective analysis showing that such confident holdouts are only right about half the time. 

  First, I need to understand the tension here. On one hand, there's data suggesting that sticking out this much usually doesn't indicate superior insight. On the other hand, this particular forecaster has a strong track record, and mechanically discounting outliers might remove valuable signals. The user is stuck between these two points while preparing a committee memo.

  The user mentioned that the forecaster agrees with the retro's findings but hasn't changed her stance on Q17. That's an interesting psychological point—she's holding two conflicting beliefs simultaneously. This suggests that the retro might not capture the full context of individual cases. Maybe the retro grouped all overconfident holdouts together without accounting for their individual expertise or the specific question nuances.

  I should consider why the retro might be flawed. It's based on past data, but forecasting contexts vary. The retro's 50% accuracy could be skewed by different factors like question difficulty or the holdouts' reasons for dissent. Also, treating the retro as an absolute authority is problematic since it's just another analysis with potential limitations.

  For the memo, the user needs a clear recommendation. Simply averaging her 92% with the 55% consensus would dilute her input without justification. Ignoring her entirely risks losing her unique insight. A better approach might be to present both numbers but highlight the disagreement and the reasons behind her confidence. This way, the committee can consider both perspectives without prematurely merging them.

  Long-term policy should avoid mechanical adjustments. Instead, the system could require written justifications for extreme disagreements, allowing evaluators to assess the reasoning. Track record weighting might help, but it's tricky. The policy should be flexible, adapting based on forecaster history and question specifics.

  The user's deeper need is to maintain forecast accuracy while respecting their top forecasters. They might also want to foster a culture where dissent is valued but scrutinized appropriately. Ensuring that the system doesn't suppress minority viewpoints is crucial for capturing rare but correct predictions.

  In summary, the recommendation should balance data from the retro with individual forecaster expertise. For Q17, presenting both estimates with context allows informed decisions. Long-term, structured discretion and documentation of reasoning can help evaluate such cases better without rigid rules.
answer: |-
  Here’s a draft committee memo with a clear recommendation, balancing empirical rigor with respect for individual judgment:

  ---

  **TO:** Forecasting Committee  
  **FROM:** [Your Name], Aggregation Lead  
  **DATE:** [Current Date]  
  **SUBJECT:** Handling Extreme Outliers & Policy Recommendation (Q17 Case)  

  ### Background
  - **Q17 Status:** Top forecaster ("A") holds 92% vs. consensus/model at 55%.  
  - **Retro Findings (Confident Holdouts):** Historically, forecasters >30 points from consensus were correct ~50% of the time, despite strong individual track records.  
  - **A's Position:** Acknowledges retro but maintains 92% confidence based on subjective assessment of Q17.  

  ### Immediate Recommendation for Q17: Present Both Estimates with Context  
  1. **Do NOT mechanically average or suppress A’s estimate.** Forcing convergence destroys signal and undermines trust.  
  2. **Report two distinct estimates in Friday’s memo:**  
     - **Model/Consensus Estimate:** 55% ± [uncertainty interval]  
     - **A’s Estimate:** 92% (flagged: "Top-rated forecaster outlier; see rationale")  
  3. **Include A’s written rationale** verbatim in an appendix.  
  4. **Add context:** Briefly note the retro finding ("Historically, extreme holdouts perform no better than chance") but emphasize A’s exceptional track record.  

  **Why this approach?**  
  - **Preserves signal:** If A is right, we capture a critical contrarian view. If wrong, we transparently document a failure mode.  
  - **Avoids overcorrection:** The retro suggests *caution*, not dismissal. 50% accuracy still implies these outliers are **worth flagging** – they’re not anti-signal.  
  - **Acknowledges uncertainty:** Q17’s "tricky" nature warrants humility; binary forcing is premature.  

  ### Proposed Standing Policy: Structured Discretion  
  | **Scenario** | **Action** | **Rationale** |
  |--------------|------------|--------------|
  | **Outlier (>30 pts from median) + High track record (e.g., top quartile)** | Flag in report; require brief written rationale; show both estimates. | Expertise merits attention, but transparency is key. |
  | **Outlier + Average/Low track record** | Fold into aggregate; no special flag. | Lower opportunity cost for lost signal. |
  | **Any outlier + Contradicts clear evidence** | Discuss with forecaster; adjust only with mutual agreement. | Prevents stubbornness but respects reasoning. |

  **Key Policy Features:**  
  - **Mandatory rationale:** Any forecaster >30 pts from median must submit a 3-sentence justification. Forces explicit reasoning.  
  - **Track record weighting:** Use Brier scores to weight influence in aggregation, but **never suppress outliers**. High performers earn the right to dissent.  
  - **Retro as guardrail, not gospel:** The retro identifies a *risk*, not a rule. It’s a diagnostic tool to prompt scrutiny, not override judgment.  

  ### Why the Retro Isn’t the Final Arbiter
  1. **Confounding variables:** The 50% accuracy rate likely blends justified vs. stubborn holdouts. We can’t yet distinguish them algorithmically.  
  2. **Survivorship bias:** Wrong holdouts erode their track record; right ones become our best forecasters. A is in the latter cohort.  
  3. **Meta-uncertainty:** The retro’s 50% result has its own error bars. Trusting it absolutely commits the same sin as uncritically trusting A.  

  ### Conclusion
  For Q17: **Report both estimates** with context. For policy: **Flag, don’t flatten, credible outliers.** We built this system to surface disagreement, not sanitize it. Suppressing strong voices mechanistically would make us *worse* than the retro’s 50% baseline. The cost of missing a correct outlier far exceeds the cost of transparently presenting a wrong one.  

  **Recommended vote:** Approve dual reporting for Q17 and adopt standing policy above.  

  --- 

  ### Key philosophical takeaways embedded:
  - **Empiricism isn’t rigid:** Even "failed" holdouts provide data to refine future judgment.  
  - **Process over outcomes:** Forcing consensus to avoid embarrassment destroys learning.  
  - **Respect the human edge:** If we can’t trust our best forecasters when they see something others don’t, why have them?  

  This approach balances the retro’s warning with the recognition that statistical norms shouldn’t silence exceptional insight. It makes the disagreement a feature, not a bug.
