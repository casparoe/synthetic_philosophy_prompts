     Alternatively, we can have the following: in Structure 1 (confounding), we have only Z as a common cause and no direct effect, so within-Z independence. In Structure 2 (mediation), we have X->Z->Y and also a direct effect X->Y? Then Structure 2 is not a pure mediator.

     This is getting messy.

     Let me try a different approach: 

     We want to show that in the confounder structure, adjusting for Z gives the true causal effect, and in the mediator structure, adjusting for Z gives a biased effect.

     We don't necessarily need the same joint distribution. We can have two different joint distributions, but each consistent with one structure, and then show the effect of conditioning.

     Structure 1 (confounding): Z is a common cause of X and Y.

          Z ~ Bernoulli(0.5)
          X = Z + noise? Let's make them deterministic for simplicity: 
              X = Z   (if we want a binary, then let Z be binary and X=Z)
          Y = Z 

          Then without conditioning, X and Y are perfectly correlated.
          Conditioning on Z, we get: for each Z, X and Y are fixed, but we see that when Z=0, X=0 and Y=0; when Z=1, X=1 and Y=1. But within Z, there is no variation in X and Y? 

     So let's add noise:

          Z ~ Bernoulli(0.5)
          X ~ Bernoulli(0.8) if Z=1, Bernoulli(0.2) if Z=0
          Y ~ Bernoulli(0.7) if Z=1, Bernoulli(0.3) if Z=0

          Then within a fixed Z, the expected value of Y does not depend on X? because they are generated independently given Z. So within Z, we have:

              E[Y|X=0, Z=0] = 0.3, E[Y|X=1, Z=0]=0.3
              similarly for Z=1: 0.7 for both.

          So the true causal effect of X on Y is zero.

          The marginal: 
              E[Y|X=0] = P(Z=0|X=0)*0.3 + P(Z=1|X=0)*0.7
              How to compute P(Z|X=0):
                  P(X=0) = P(Z=0)*0.8 + P(Z=1)*0.2 = 0.5*0.8+0.5*0.2=0.4+0.1=0.5
                  P(Z=0|X=0) = (0.5*0.8)/0.5 = 0.8
                  P(Z=1|X=0)=0.2
                  So E[Y|X=0]=0.8*0.3+0.2*0.7=0.24+0.14=0.38

              E[Y|X=1]= P(Z=0|X=1)*0.3 + P(Z=1|X=1)*0.7
                  P(X=1)=0.5
                  P(Z=0|X=1)= (0.5*0.2)/0.5=0.2
                  P(Z=1|X=1)=0.8
                  E[Y|X=1]=0.2*0.3+0.8*0.7=0.06+0.56=0.62

          So without conditioning, it appears that X=1 is better (0.62) than X=0 (0.38).

          But the true causal effect is zero.

          If we condition on Z, we see within each Z, no effect. So by conditioning on Z, we recover the truth.

     Structure 2 (mediation): X -> Z -> Y

          X ~ Bernoulli(0.5)
          Z ~ Bernoulli(0.8) if X=1, Bernoulli(0.2) if X=0
          Y ~ Bernoulli(0.7) if Z=1, Bernoulli(0.3) if Z=0

          The true causal effect of X on Y: 
              If we set X=1, then 
                  Z is Bernoulli(0.8), then Y is 0.7 with probability 0.8, and 0.3 with probability 0.2, so E[Y] = 0.8*0.7+0.2*0.3=0.56+0.06=0.62
              If we set X=0, then 
                  Z is Bernoulli(0.2), then E[Y]=0.2*0.7+0.8*0.3=0.14+0.24=0.38

          So the true causal effect is 0.62-0.38=0.24.

          Now, if we condition on Z, we get:
              For Z=0:
                  E[Y|Z=0]=0.3, regardless of X.
              For Z=1:
                  E[Y|Z=1]=0.7, regardless of X.
              So within each Z, there is no effect of X on Y.

          If we don't condition, we get the same as above: 
              E[Y|X=0]=0.38, E[Y|X=1]=0.62.

          But if we condition on Z, we see no effect, which is not the true causal effect. The true causal effect is not zero.

     So in Structure 1, conditioning on Z is essential to see that there is no direct effect.
     In Structure 2, conditioning on Z masks the causal effect that is mediated by Z.

     But note: in Structure 2, the within-Z effect is zero, which is the direct effect (there is no direct effect, only mediated). So if we want the mediated effect, we should not condition on Z.

     These two structures do not yield the same joint distribution, but they are minimal and illustrate the point.

     Now, for the same joint distribution, we cannot have both because in Structure 1 within Z, Y is independent of X, and in Structure 2 within Z, Y is independent of X. So both will show within Z independence. 

     Structure 1 with no direct effect and Structure 2 with no direct effect will have the same within Z independence. 

     But then the marginal association will be the same in both? 

     Let me try to set the same parameters for both structures to get the same joint distribution.

     In Structure 1 (confounding, no direct effect):

          P(Z=1)=0.5
          P(X=1|Z=1)=0.8, P(X=1|Z=0)=0.2
          P(Y=1|Z=1)=0.7, P(Y=1|Z=0)=0.3

     Then joint distribution:
          P(X=1,Y=1) = P(Z=1) * P(X=1|Z=1) * P(Y=1|Z=1) + P(Z=0) * P(X=1|Z=0) * P(Y=1|Z=0)
                      = 0.5*0.8*0.7 + 0.5*0.2*0.3 = 0.28 + 0.03 = 0.31

     In Structure 2 (mediation, no direct effect):

          P(X=1)=0.5
          P(Z=1|X=1)= we need to choose to match the joint distribution.
          P(Y=1|Z=1)=0.7, P(Y=1|Z=0)=0.3

     How do we choose P(Z|X) to yield the same joint distribution as above?

          We require:
            P(X=1, Y=1) = P(X=1) * P(Z=1|X=1)*0.7 + P(X=1) * P(Z=0|X=1)*0.3
                         = 0.5 * [ P(Z=1|X=1)*0.7 + (1-P(Z=1|X=1))*0.3 ]
                         = 0.5 * [0.3 + 0.4 * P(Z=1|X=1)]

          Set equal to 0.31:
            0.5 * [0.3 + 0.4 * a] = 0.31  (where a = P(Z=1|X=1))
            0.3 + 0.4a = 0.62
            0.4a = 0.32
            a = 0.8

          Similarly, for X=0:
            P(X=0)=0.5
            P(X=0, Y=1) = 0.5 * [ P(Z=1|X=0)*0.7 + (1-P(Z=1|X=0))*0.3 ]
                         = 0.5 * [0.3 + 0.4 * b]   where b = P(Z=1|X=0)

          From Structure 1, we have:
            P(X=0, Y=1) = P(Z=1) * P(X=0|Z=1) * P(Y=1|Z=1) + P(Z=0) * P(X=0|Z=0) * P(Y=1|Z=0)
                         = 0.5*(1-0.8)*0.7 + 0.5*(1-0.2)*0.3 = 0.5*0.2*0.7 + 0.5*0.8*0.3 = 0.07 + 0.12 = 0.19

          So in Structure 2, we require:
              0.5 * [0.3 + 0.4 * b] = 0.19
              0.3 + 0.4b = 0.38
              0.4b = 0.08
              b = 0.2

          So in Structure 2, we set:
              P(Z=1|X=1)=0.8, P(Z=1|X=0)=0.2

          Then the joint distribution is the same as in Structure 1.

     Now, what is the true causal effect in each structure?

     In Structure 1 (confounding, no direct effect):
          The true causal effect of X on Y is zero, because Y is only caused by Z, and X does not cause Y.

     In Structure 2 (mediation, no direct effect):
          The true causal effect of X on Y is non-zero, because X causes Z and Z causes Y.
          Specifically, 
              If we set X=1, then P(Y=1) = P(Z=1|X=1)*0.7 + P(Z=0|X=1)*0.3 = 0.8*0.7+0.2*0.3=0.56+0.06=0.62
              If we set X=0, then P(Y=1) = 0.2*0.7+0.8*0.3=0.14+0.24=0.38
              So the average causal effect is 0.62-0.38=0.24.

     Now, if we condition on Z in both structures, we get within each Z, Y is independent of X. So the conditional effect is zero in both.

     Therefore, in Structure 1, conditioning on Z reveals the truth (zero effect).
     In Structure 2, conditioning on Z hides the truth (which is a positive effect).

     If we do not condition on Z, then in Structure 1, we see a positive association (0.62 for X=1 and 0.38 for X=0) which is not causal.
     In Structure 2, we see the same positive association (0.62 and 0.38) which is causal.

     Therefore, in Structure 1, we must condition on Z to get the causal effect.
     In Structure 2, we must not condition on Z to get the causal effect.

     This is the essence of the issue.

     Now, to answer the second part about the smoking lesion problem:

     In the smoking lesion problem, we have:

          Action: smoke (X=1) or not smoke (X=0)
          Outcome: cancer (Y=1) or not (Y=0)
          There is a common cause: a genetic lesion (Z) that causes both the desire to smoke and independently causes cancer.

     So the structure is: Z -> X and Z -> Y.

     This is Structure 1 (confounding).

     If we don't condition on Z, we see an association between smoking and cancer. But the true causal effect of smoking is zero (or perhaps even protective if we imagine that smoking might reduce stress and thus cancer, but in the story it's typically zero).

     Evidential decision theory (EDT) would look at the conditional probability: P(cancer | smoke) and P(cancer | not smoke). If P(cancer | smoke) > P(cancer | not smoke), then EDT says not to smoke.

     But in the confounding structure, this association is not causal. Causal decision theory (CDT) would condition on the genetic lesion (if it were observed) or use a method to account for it. But in the problem, the lesion is not observed. So EDT is trusting the confounded association.

     In this sense, it is similar to Structure 1 where we should condition on Z to get the true effect, but if we don't have Z, we are misled.

     Therefore, it is fair to describe EDT's mistake in the smoking lesion problem as making the mistake of trusting an unadjusted, confounded correlation.

     In summary, the key is the causal structure: whether Z is a confounder or a mediator. In the confounder case, adjustment is necessary; in the mediator case, adjustment is harmful (if we want the total effect). The observed data alone (without causal assumptions) cannot tell us which is which.
