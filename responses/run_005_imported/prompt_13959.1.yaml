  I should also address Coliva's view that hinges are beliefs. The counter is that calling them beliefs misrepresents their role. Beliefs can be true/false, justified/unjustified, but hinges are arational. They're the stage, not the actors. The user needs a rigorous argument, so referencing specific sections of *On Certainty* is crucial. For instance, §152: "I do not explicitly learn the propositions that stand fast for me." This shows hinges are not learned as beliefs but as part of learning itself.

