  First, I need to recall the core distinction: finks alter the disposition's causal basis when the stimulus occurs, while masks leave the basis intact but block the manifestation. Lena's case has a glass with brittle microstructure (basis) coated with polymer that stiffens only upon impact. 

  Looking at move (1): Lena calls it a mask because the glass's molecular structure remains unchanged. That seems correct based on Bird/Johnston's definition - the causal basis persists untouched. 

  Move (2): Marco argues the timing makes it a fink because the coating activates precisely when the stimulus occurs. But Lewis explicitly rejects timing as the defining feature - his sorcerer example works because it changes the basis, not just because it acts at stimulus-time. 

  Move (3): Lena correctly notes basis alteration is key, not timing. Her coating doesn't alter the glass's brittleness - it adds external shock absorption. 

  Move (4): Marco's "momentary basis change" claim is interesting but flawed. The polymer's stiffness isn't part of the glass's intrinsic causal basis for fragility. Fragility is defined by molecular structure, not temporary external reinforcement. 

  The deeper issue seems to be about causal basis individuation. Both students might be missing that: 
  - Lena might be underestimating how the coating functionally replaces the glass's role in the causal chain 
  - Marco is conflating temporal behavior with basis alteration 

  To resolve borderline cases, I'd suggest examining: 
  1. Persistence of intrinsic properties 
  2. Spatial boundaries (is polymer part of the object?) 
  3. Counterfactual dependence (would glass shatter if coating failed?)

  The user probably needs a way to teach students how to handle gray areas in metaphysical categorization - where clear definitions meet messy reality. The key is emphasizing why basis alteration matters more than timing in the classical framework.
answer: |-
  Let's break down this excellent dispute systematically, assessing each move and identifying the core philosophical issues at stake:

  **Move (1) Lena's Initial Classification (Mask)**  
  *Lena has the better argument here.* Her reasoning aligns with Bird/Johnston's canonical mask:  
  - The glass's **intrinsic brittle microstructure** (the causal basis of fragility) persists unchanged before, during, and after impact.  
  - The polymer is an **external interferer** blocking the causal pathway to shattering.  
  - *Crucial analogy:* Like poison + antidote, the basis (glass brittleness/poison toxicity) remains intact; the blocker operates downstream.  

  **Move (2) Marco's Temporal Objection (Fink)**  
  *Marco is partially right about timing but wrong about classification.*  
  - He correctly notes that finks and masks *typically* differ temporally: Finks act *at* stimulus-time (like Lewis's sorcerer), while masks are *standing conditions* (like packing foam).  
  - **BUT** he errs in claiming temporal signature *alone* determines the category. Lewis explicitly rejects this: What matters is *whether the causal basis is altered*, not *when* intervention occurs (*Philosophical Papers*, 1997, p.153). Martin's electro-fink is a fink because it *removes the dispositional basis* when the stimulus occurs – not merely because it acts at that moment.  

  **Move (3) Lena's Basis-Persistence Reply (Mask)**  
  *Lena is fundamentally correct.*  
  - She identifies the **core distinction**: Finks *remove/alter the causal basis*; masks *preserve the basis* but disrupt the manifestation process.  
  - The polymer **doesn't touch the glass's microstructure**. It adds an external shock-absorption mechanism. This is textbook masking (like a circuit with intact conductivity but a fused switch).  
  - *Weakness:* She under-engages Marco's temporal worry, missing a chance to clarify why timing isn't decisive.  

  **Move (4) Marco's "Momentary Basis Change" Claim (Fink)**  
  *Marco's argument is inventive but unsound.*  
  - His claim that the coating "changes the basis" by stiffening outer layers confuses:  
    - (a) The glass's **intrinsic microstructure** (silicate bonds), which remains unchanged, and  
    - (b) **Extrinsic structural dynamics** (stiffness from polymer adhesion).  
  - Fragility's causal basis is the *intrinsic molecular structure*, not transient *extrinsic* properties. The coating is an *added layer*, not part of the glass's dispositional basis.  
  - *Key flaw:* By his logic, *any* mask that activates on impact (e.g., an airbag) would be a fink – collapsing the distinction Martin/Lewis/Bird worked to establish.  

  **Who Has the Better Overall Case?**  
  **Lena wins the core argument:** Her case is unambiguously a mask under the Lewis/Bird framework. The causal basis remains intact; interference is downstream and extrinsic.  

  **What Both Are Missing:**  
  1. **Causal Basis Individuation:** The dispute reveals ambiguity about *what constitutes the causal basis*. Lena assumes it's solely the glass's atomic structure; Marco conflates the object's intrinsic properties with its transient relational states. Settling this requires specifying how to individuate the basis (e.g., Lewis's "core" basis vs. total microstructure).  
  2. **The Role of Intrinsicness:** Masks often exploit extrinsic/extrinsic interference (e.g., packing foam), while finks typically alter intrinsic properties. The polymer is *extrinsic* to the glass qua brittle object.  
  3. **Borderline Resolution Strategy:** For ambiguous cases, apply Lewis's **counterfactual test**:  
     - *Fink counterfactual:* "If the stimulus occurred, *would the basis persist?*" (No → fink)  
     - *Mask counterfactual:* "If the stimulus occurred *and the blocker failed*, would manifestation follow?" (Yes → mask)  
     In Lena's case: If the polymer *didn't* stiffen (e.g., defective coating), the glass *would* shatter upon impact → mask.  

  **Settling Borderline Cases:**  
  Cases like this turn on:  
  - **Spatial Boundaries:** Is the polymer part of *the glass* or an external attachment? (If extrinsic → mask)  
  - **Persistence of Basis:** Does the basis *counterfactually depend* on the stimulus? (If no dependence → mask)  
  - **Mechanism of Interference:** Does the intervener *modify the object* or *add external forces*? (Shear-thickening adds external damping; sorcerer alters internal structure).  

  **Recommendation for Your Seminar:**  
  1. Halt the baroque variants by refocusing on Lewis/Bird's *definitions* (not intuitions).  
  2. Emphasize that temporal coincidence is *correlative* with finks but not *definitive* (some finks could be slow; some masks could be trigger-activated).  
  3. Use this case to explore *causal basis metaphysics*: What fixes an object's "intrinsic" properties? When do extrinsic coatings become "part" of the object?  

  ***Conclusion:*** Lena's classification holds under standard Lewis/Bird criteria. Marco's temporal argument confuses a common symptom of finks (timing) with their essence (basis alteration). The unresolved tension lies in the under-specified metaphysics of "causal basis" – which this case brilliantly exposes.
