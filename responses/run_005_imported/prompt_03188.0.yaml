  But here's why that fails: The demonstration wasn't separable from mass civilian slaughter. You can't show "overwhelming destruction" without destroying things—specifically human lives. The shock value came precisely from annihilating cities full of noncombatants. If Truman intended the shock, he intended the annihilation that caused it. 

