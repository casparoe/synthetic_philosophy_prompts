  Also, the scale matters. Annihilating two entire cities isn't a side effect—it's the centerpiece. Anscombe would say this is textbook "using persons as means": civilians became instruments to terrify their leaders into surrender. Redescription can't wash that away because the causal pathway is too direct. 

  If I'm honest, the toughest counter is when defenders argue Japan would've suffered more in a prolonged invasion. But that's about proportionality, not intention. Even if true, it doesn't change the fact that civilians were instrumentalized. The argument holds unless someone proves Truman could've achieved surrender without mass civilian targeting—which he couldn't, hence the means problem. 

  Ultimately, Anscombe's verdict survives because the deaths weren't collateral damage; they were the weapon. No linguistic trickery undoes that.
answer: |-
  ## A Defense of Anscombe's Verdict Against the Closeness Problem

  Professor, I'll argue directly: Anscombe's core charge *does* survive the redescription challenge. Truman's defenders cannot escape the conclusion that the civilians of Hiroshima and Nagasaki were used as a *means* in a morally impermissible way. While the closeness problem is a serious theoretical challenge to double effect, this case reveals its limits in practice. Here’s why:

  **First, let's steelman the redescription challenge.** The defender argues: "Truman *intended* only a *demonstration of overwhelming destructive power* sufficient to convince Japan's leadership that further resistance was hopeless. The horrific deaths of civilians were *foreseen* as the necessary *means* to create that demonstration, but they were not *intended* as an end in themselves or even as a direct means to surrender. The surrender was intended *through* the shock generated *by* the demonstration, which itself *required* the civilian deaths. Therefore, the deaths fall on the 'merely foreseen' side of the line. They are a tragic cost, not murderous intent."

  This is sophisticated. It leverages the fact that intentions are nested: we intend ends *through* means. By focusing the description of the immediate intention narrowly ("demonstration of power"), it pushes the civilian deaths into the background as a condition for achieving that immediate goal, rather than the goal itself.

  **Anscombe's verdict survives because this redescription fails on two principled grounds:**

  1.  **The Inseparability of the "Demonstration" and the Civilian Harm:** The defender's redescription relies on a false separation between the "demonstration" and the killing itself. What *was* the demonstration? It wasn't a fireworks show or a detonation over an empty bay. The *demonstration* **consisted in** the instantaneous, horrific annihilation of two cities filled with non-combatants. The destructive power *was manifested* precisely in the mass killing. Truman didn't intend "destructive power" abstractly; he intended its *instantiation* in the vaporization of human beings and their communities. The shock value *was* the scale of civilian death and suffering. Therefore, intending the demonstration *necessarily* means intending the mass killing *as the very content of that demonstration*. You cannot coherently intend *this specific demonstration* while claiming the deaths are merely a foreseen side effect. The deaths *are* the demonstration.

  2.  **Warren Quinn's Direct Harm vs. Indirect Agency:** Quinn's distinction (developed partially in response to *this kind* of problem) is crucial here. Quinn argues that what matters morally isn't just the psychological state of "intending" versus "foreseeing," but the *structure of agency*. Did the agent *directly involve* the victim in their plan as a means, or was the harm a *side effect* of a plan that didn't intrinsically require using the victim? The terror bomber *needs* the civilians to die to achieve their goal (intimidation); their death is directly agential. The tactical bomber foresees deaths but doesn't *need* them; destroying the munitions factory *could* conceivably happen without them (even if, in practice, it doesn't).

      **Applied to Truman:** The plan *required* the direct, massive harming of civilians *as the mechanism* to achieve the shock and awe. Japan's surrender was to be achieved *by means of* terrorizing its leadership *through* the mass slaughter of its citizens. The civilians weren't incidentally harmed *while* destroying a legitimate military target (like the tactical bomber hitting a factory near homes). They *were* the target. Their deaths were the chosen instrument of coercion. This is the structure of *direct harm* or *using as a mere means*: the civilians' destruction was not a *byproduct*; it was the *chosen pathway* to the goal. Redescribing the *immediate* intention as "demonstration" doesn't change the fact that the *chosen pathway* involved directly and necessarily harming these innocent people to achieve the strategic end.

  **Countering the Redescription Directly:** Imagine Truman saying: "I intended only the demonstration, not the deaths." This rings hollow. *How* was the demonstration to be achieved? By what mechanism? The answer is inescapable: by killing them. The defender might say: "The deaths were the *means to the demonstration*." But this concedes the point! If the deaths are the *means to* the immediate goal (the demonstration), and the demonstration is the *means to* the ultimate goal (surrender), then the deaths are *still a means* within the overall plan to achieve surrender. They are instrumentalized. Double effect does not permit intending harm *as a means to a means*. The doctrine requires that the evil effect be *only* a side effect of the *good* act itself, not a means to *another* intended good effect further down the causal chain. The civilian deaths were causally *productive* of the demonstration; they were not a *concomitant* of an act aimed elsewhere.

  **Where the Closeness Problem Fails Here:** The closeness problem thrives in hypotheticals where causal chains are ambiguous or descriptions can be endlessly refined (like the craniotomy). Hiroshima and Nagasaki are *not* ambiguous. The causal chain is brutally direct: Bomb detonates -> Civilians die horribly -> Leadership is shocked -> Surrender occurs. The deaths are the *direct and necessary cause* of the shock. There is no plausible counterfactual where the *same* level of shock compelling surrender is achieved *without* the mass civilian deaths. The "demonstration" *is* the killing. To claim otherwise is sophistry – an attempt to mask the grim reality with abstract language.

  **Conclusion: A Principled Line Holds:** Anscombe's verdict survives because the structure of agency in this case is fundamentally different from permissible applications of double effect. The civilian deaths were not a regrettable *consequence* of an act aimed at a military objective; they were the *chosen instrument* of policy, directly intended *as the mechanism* to produce the psychological effect necessary for surrender. Quinn's distinction between direct and indirect agency provides a robust, non-ad-hoc framework for identifying this: Truman's plan *directly involved* harming innocents as a necessary element of its causal pathway to the goal. Redescribing the *label* of the immediate intention cannot alter this fundamental moral structure. Truman used the people of Hiroshima and Nagasaki as mere means. Anscombe was right: it was murder. The closeness problem, while potent in theory, cannot dissolve the moral reality of *this* act.
