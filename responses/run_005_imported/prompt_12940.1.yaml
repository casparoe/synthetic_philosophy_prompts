answer: |-
  ## Dialogue: Parity vs. Vagueness in Hard Choices

  **Characters:**  
  *   **Parity (P):** Defends Ruth Chang's view that "on a par" is a distinct fourth value relation.  
  *   **Vagueness (V):** Defends John Broome's view that apparent parity is just vagueness in "better than".  

  **(The scene: Two philosophers debate over coffee after a conference session on practical reason.)**

  **Vagueness (V):** Look, I sympathize with your career dilemma, truly. But I think Ruth Chang complicates things unnecessarily with this "fourth relation" of parity. The problem isn't some mysterious new relation; it's simply that our concept of "better than" is inherently *vague* in complex comparisons. Like the Sorites paradox with heaps: adding one grain doesn't suddenly make it a heap, but eventually, it clearly is. Similarly, comparing your stable job (S) and your meaningful job (M) involves many complex, often incommensurable factors – salary, security, passion, impact, stress levels. The *precise* point where the balance tips from "S is better" to "M is better" is fuzzy. That indeterminacy *is* what makes the choice hard. It feels unresolved because the boundary is vague, not because the options stand in a fundamentally new relation.

  **Parity (P):** Vagueness is real, John, but it doesn't capture the *phenomenology* or the *structure* of choices like this. When neither job is better, worse, nor precisely equal, and yet they are genuinely comparable – both are good careers worth choosing – vagueness suggests we just don't know *enough* or can't measure finely *enough*. But often, we *do* know all the relevant facts! The person agonized *because* they saw the values clearly: profound stability and comfort vs. profound meaning and risk. These values belong to different *kinds* – like comparing a Michelangelo sculpture to a Shakespeare sonnet. Vagueness implies that with infinite precision, we'd find one slightly better. But I argue that even with perfect knowledge, these options can be **on a par**. They are comparable, yet neither trumps the other, nor are they equal. They belong to the same "league" of value, but different "styles" within it. This distinct relation explains why the choice feels like creating a reason through commitment, not just discovering a hidden truth. Vagueness reduces it to an epistemic failure.

  **Vagueness (V):** But how does "parity" solve the problem? You say they are comparable yet incomparable! That seems contradictory. Let's take the slight improvement objection you mentioned. Suppose the person gets a *slightly* better salary offer for the meaningful job (M+). If they were truly on a par with M, then M+ should be *clearly better* than S, right? But often, even with M+, the choice might *still* feel agonizingly hard! The stability of S might still exert a powerful pull. Why? Because the improvement was too small to push M+ clearly across the vague boundary where it becomes determinately better than S. The "fuzziness" of the better-than relation absorbs small improvements without producing a decisive verdict. Your "parity" relation can't explain why a slight improvement *doesn't* automatically break the tie if the original options weren't equal.

  **Parity (P):** Ah, the Sorites challenge! First, sometimes a slight improvement *does* break the tie, showing it was near-equality. But crucially, when it *doesn't*, it's precisely because the options weren't equal to begin with! If S and M are on a par, a small improvement to M (M+) might simply create a *new* par comparison: M+ is now on a par with S, just as M was. Why? Because the improvement might not alter the fundamental *kind* of value comparison. Adding £1000 to M doesn't suddenly make its meaningfulness *commensurate* with S's profound stability in a way that allows precise cardinal comparison. The values remain qualitatively different. The improvement might make M+ *somewhat* better than M relative to S, but not necessarily *better than S full stop*. It remains within the same "zone of parity." Vagueness struggles to explain why the improvement doesn't *nudge* M+ just over the fuzzy line; parity explains it by saying the line *between relations* (parity vs. better-than) isn't fuzzy in the same way – the improvement wasn't significant enough to change the *category* of the comparison.

  **Vagueness (V):** That sounds suspiciously like you're smuggling vagueness back in! You're saying a small improvement isn't enough to shift from "on a par" to "better than," implying there's a *vague boundary* around the "parity zone." How is that different from my vague boundary for "better than"? You've just relocated the vagueness to the border *between* your proposed relations! And why posit this extra ontological category? Occam's Razor suggests we should prefer the simpler explanation: one relation ("better than") with acknowledged vagueness in its application, rather than inventing a whole new relation ("on a par") which itself seems to have vague boundaries. The feeling of "different kinds of value" is real, but it's a *source* of the vagueness in applying "better than," not evidence for a new relation.

  **Parity (P):** Occam's Razor cuts both ways, John. If a single relation plus vagueness can't adequately explain the *normative force* and *structure* of hard choices, we need more. Vagueness paints hard choices as failures of measurement or precision. But often, the conflict is deeper: a conflict of genuine, incommensurable *reasons*. Choosing S commits you to reasons of security and comfort; choosing M commits you to reasons of passion and purpose. Neither set of reasons is stronger, weaker, or exactly equal in weight. They are *different*. When you choose, you aren't discovering which reason was stronger all along (as vagueness suggests, hidden by fuzziness); you are *making* one set of reasons decisive through your commitment. This "will-based" aspect only makes sense if the alternatives were normatively on a par beforehand. Vagueness reduces choice to discovery; parity makes space for creation.

  **Vagueness (V):** But that "creation" sounds like a post-hoc rationalization for an arbitrary decision forced by indeterminacy! If the reasons were truly incomparable *in principle* (not just hard to compare), how can we even say both choices are good or rational? Your "different kinds" threaten to make rational comparison impossible, leading to paralysis. My vagueness account keeps comparison possible, albeit messy. The Sorites objection still haunts you: if you make M *significantly* better – say, double the salary *and* guarantee tenure – then it *clearly* becomes better than S. My model shows this as crossing the vague boundary decisively. Your model must say parity somehow *breaks down* at some point. But where? That breakdown point looks suspiciously like... vagueness! The transition from "on a par" to "better than" is itself vague. So, you haven't eliminated vagueness; you've just embedded it within your new framework without gaining a clear advantage.

  **Parity (P):** The breakdown isn't vague; it's determined by whether the improvement fundamentally alters the *nature* of the comparison. A massive improvement to M might make its value *overwhelmingly* better, moving it into a different league entirely – no longer comparable on par with S, but simply better. Or, it might make the *kinds* of value offered by M+ commensurate with S in a way they weren't before. The point where parity breaks down isn't vague in the Sorites sense; it's a substantive shift in the evaluative landscape. Vagueness struggles to explain why the *quality* of the difficulty feels different between a hard choice (like the career dilemma) and a merely difficult calculation (like choosing between two nearly identical pensions). The former feels like a clash of identities; the latter feels like missing data. Only parity captures that qualitative difference in the nature of the choice itself. Vagueness flattens it.

  **Vagueness (V):** But that "qualitative difference" might just be our psychological response to particularly complex or identity-constitutive vagueness! The pension choice feels calculative; the career choice feels existential. But that doesn't *prove* a different underlying normative relation. It just shows that some areas of vagueness in "better than" cut deeper into our sense of self. We respond differently, but the underlying indeterminacy is of the same kind. Positing parity might satisfy a psychological need for the choice to be "special," but it doesn't provide a clearer or more parsimonious account of the normative facts. And crucially, it still leaves us with the unanswered question: *how* do we know when options are on a par rather than vaguely better/worse/equal? Your criterion seems just as elusive as my vague boundary.

  **(Both philosophers sip their coffee, the unresolved tension mirroring the very choice they debate.)**

  **Parity (P):** We know through the phenomenology of the choice and the irreducibility of the competing values. When reasons clash without resolution, demanding commitment, that *is* parity. The elusiveness is the point – it's normative, not epistemic.

  **Vagueness (V):** And I say that phenomenology is precisely the hallmark of deep vagueness in our most important comparisons. The demand for commitment arises *because* of the indeterminacy, not in spite of it. We'll need stronger arguments to justify multiplying relations beyond necessity.
