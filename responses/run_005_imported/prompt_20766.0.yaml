answer: |-
  You've hit on one of the most complex questions in group dynamics: **individual agency vs. systemic structure**. Neither your perspective nor your sociology housemate's is entirely wrong – but they're incomplete without each other. Here's how to break it down:

  ### 1. **Why "It's Just Steph" Feels Inadequate (Even If She's Problematic)**
      - **The "Vacancy" Problem:** Your sociology housemate is right that dysfunctional groups often have *roles* (e.g., the complainer, the passive-aggressor, the peacekeeper). If Steph left, *someone else might unconsciously fill that "conflict catalyst" role* because the underlying tensions (resentment about chores, unfair rent, poor communication) remain unaddressed. Steph might be *amplifying* the role, but the role exists because of the system.
      - **Behavior Needs Context:** Steph's passive-aggression doesn't exist in a vacuum. *Why* is she passive-aggressive? Is she frustrated by the chore rotation? Resentful about the room situation? Feeling unheard? Her behavior is problematic, but it might be a (toxic) response to the same systemic flaws bothering everyone.

  ### 2. **Why "It's Just the System" Feels Like Letting Steph Off the Hook (And Kinda Does)**
      - **Individual Accountability Matters:** Systems are made of people. Steph *chooses* to be passive-aggressive. She *chooses* to insert herself into conflicts. A flawed system *explains* behavior but doesn't *excuse* it. Saying "the system made her do it" removes her agency and responsibility for how she contributes to the toxicity.
      - **Not Everyone Reacts the Same:** The other housemates are frustrated too, but they (presumably) aren't sparking blow-ups or being passive-aggressive in the chat. The system impacts everyone, but Steph's *specific reactions* are making things significantly worse. A system can be flawed without having a *disproportionately disruptive* individual.

  ### 3. **Your Mom's Insight: The Scapegoat Dynamic**
      This is crucial and different from the sociology argument:
      - **Sociology Housemate:** Says the *system* creates the *conditions* for conflict, and roles emerge naturally within it. Fix the system, the role loses its power.
      - **Your Mom:** Points out that *groups* often *unconsciously select one person* to bear the blame ("scapegoat") to avoid facing their *own* contributions to the problem or the harder systemic fixes. This is about **group psychology avoiding responsibility.**
      - **The Danger:** Blaming *only* Steph lets *everyone else* off the hook for their part in the dysfunction (passivity, not enforcing chores, avoiding conflict) AND avoids the hard work of fixing the system. It's a coping mechanism for the group.

  ### So, What's More Accurate? It's the **Interaction**

  1.  **The Flawed System is the Foundation:** The unfair rent distribution, unenforced chore rotation, and leaderless communication create chronic low-grade resentment, frustration, and ambiguity. This is fertile ground for conflict.
  2.  **Steph is the Accelerant:** Her specific behavior (passive-aggression, inserting herself into conflicts) takes those underlying tensions and ignites them into major blow-ups. Her communication style and conflict approach are toxic *within this specific context*.
  3.  **The Group Dynamic Reinforces It:** How others react to Steph (avoidance, escalating, blaming) and the emerging pattern of making her the focal point (scapegoat tendency) complete the dysfunctional cycle.

  **Answering Your Core Questions:**

  *   **"Is it the people or the structure?"** It's **both**. The structure creates the vulnerability, specific people exploit or amplify it through their behavior, and the group dynamic locks it in.
  *   **"Is one explanation more true?"** No. They are interdependent. Focusing *only* on Steph ignores the fuel for the fire. Focusing *only* on the system ignores the match that keeps lighting it.
  *   **"Is asking 'which one' wrong?"** Not wrong, but **incomplete and potentially counterproductive.** It leads to either unfair blame (on Steph) or passive resignation ("the system's too big, nothing we can do").

  ### What to Do: Move from "Who/What's to Blame?" to "How Do We Fix This?"

  1.  **Separate Behavior from System (Temporarily):**
      *   **Address Steph's Behavior DIRECTLY & SPECIFICALLY (but not *only* her):** "Steph, when you send messages like [quote specific passive-aggressive example], it makes it hard to resolve issues constructively. Can we agree to communicate requests or complaints directly in the future?" *Focus on the impact, not her character.*
      *   **Simultaneously, Tackle the Systemic Flaws COLLABORATIVELY:**
          *   **Rent:** Renegotiate *now*. Base it on room size/amenities. Get it fair.
          *   **Chores:** Ditch the unenforced rotation. Try: Individual responsibility for specific zones/rooms (e.g., "You own the kitchen floor & bins, I own the bathroom sink & toilet"), or a simpler weekly list people sign up for. Include *enforcement* (e.g., weekly 5-min check-in).
          *   **Group Chat:** Establish *explicit* rules: "Chat is for logistics only. Conflicts or complaints are discussed in person/house meetings." Appoint a neutral "moderator" (rotates weekly?) to gently remind people of the rules.
          *   **Meetings:** Schedule them *regularly* (e.g., 1st Sunday of the month) before things blow up. Have a clear agenda.

  2.  **Beware the Scapegoat Trap:** In the next meeting, frame it as "We *all* want this house to work better. We've identified some structural issues (rent, chores, chat) that frustrate everyone. Let's fix those. *And*, we need to agree on how we communicate and handle conflict as a group, so small issues don't blow up." This invites collective responsibility *without* letting Steph's specific actions off the hook.

  3.  **Observe the Interaction:** If you fix the system *and* Steph's behavior improves (because the triggers lessen or she's held accountable), you've succeeded. If the system improves *but* Steph remains consistently toxic and disruptive *despite* direct feedback and new structures, *then* the evidence leans much more heavily towards her being a uniquely problematic individual in need of stronger consequences (like being asked to leave).

  **The truth likely lies in the messy middle.** Steph's behavior is making a bad situation explosively worse, but removing her without fixing the foundational cracks won't magically create harmony. Tackle both strands simultaneously. Good luck – this is tough, but a valuable lesson in navigating complex human systems!
