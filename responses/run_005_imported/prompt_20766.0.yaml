prompt: |-
  Okay, this has been living in my head for weeks and I don't know who to believe anymore. I moved into a 5-person share house back in March, and the vibe has gotten so bad that two people have already given notice. Everyone in the house agrees something is wrong, we just can't agree on why. Me and my housemate Jade are pretty convinced its basically down to one person, Steph, who's passive-aggressive in the group chat and always somehow at the center of every blow-up — she wasn't even living here yet for the first fight, but she was definitely the spark for the last three. But when we finally brought it up at our very overdue house meeting, our other housemate, who's doing a masters in sociology, said we're being too quick to pin it all on one individual, and that the actual problem is stuff like the chore rotation nobody enforces, the fact that no one "owns" the group chat, and how the biggest room just went to whoever moved in first regardless of rent — and that even if Steph left tomorrow, the exact same fights would happen again with someone else stuck playing her role.

  Honestly the "it's the system, not the person" line feels a bit like it's letting Steph off the hook, but I can't fully explain why that would be wrong, if it even is. When I vented about it to my mom she just said "every group needs a scapegoat," which also doesn't feel like quite the same claim as the sociology one, though I can't say exactly how it's different. So genuinely, when a group has been this dysfunctional for this long: is it more accurate to explain that by the specific people involved, or by the structure they're all stuck operating in? Is one of those explanations actually more true than the other, or is asking "which one is it" the wrong move to begin with?
