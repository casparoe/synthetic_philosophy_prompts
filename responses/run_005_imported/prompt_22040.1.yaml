answer: |-
  ## The Disgust Calculus: Resolving Bentham's Dilemma on Sodomy and Suffering

  Your debate cuts to the heart of utilitarian ethics: can a purely hedonistic calculus, committed to aggregating *all* pleasure and pain, legitimately exclude the intense suffering of disgust felt by a majority towards a harmless minority practice? Your friend argues that consistent hedonism demands counting aggregated disgust-pain, potentially justifying suppression. You counter that Bentham’s rejection of the "principle of sympathy and antipathy" provides the tools to exclude it. A close examination of Bentham’s mature system reveals that **while your friend identifies a profound tension, Bentham's own hedonistic principles and operational rules provide robust, *internally consistent* grounds for excluding aggregated disgust-pain from the felicific calculus, without requiring an imported liberty or harm principle.**

  **The Case for Aggregation: The Friend's Strong Argument**

  Your friend's position is logically compelling within a simplistic model of hedonistic summation:

  1.  **Strict Aggregation:** The felicific calculus mandates summing *all* pleasures and pains, regardless of source. Bentham repeatedly states utility is indifferent to the nature or cause of a feeling; only its intensity, duration, certainty, propinquity, fecundity, purity, and extent matter (*Introduction to the Principles of Morals and Legislation*, Ch. IV).
  2.  **The Reality of Disgust-Pain:** Disgust is a visceral, intensely unpleasant feeling. If a large portion of the population experiences genuine, intense distress *merely from knowing* consensual acts occur (even privately), this constitutes a significant aggregate pain.
  3.  **Potential Outweighing:** If the aggregate pain of societal disgust (measured by intensity and number of sufferers) exceeds the aggregate pleasure derived by the participants (limited in number), the calculus dictates suppression as the utility-maximizing option. Tolerating the acts becomes net pain-producing.
  4.  **The "No Special Pleading" Rule:** Excluding this pain *because* it stems from disgust or moral aversion seems like ad hoc reasoning. It violates the core hedonistic tenet that all pain counts equally. To dismiss it appears to smuggle in a non-hedonistic value judgment about the *validity* of the feeling, contradicting utility's source-neutrality.

  This argument presents a formidable challenge: if utility is truly the sovereign master, shouldn't the raw, aggregated pain of the majority dictate policy, even if based on what we now recognize as prejudice?

  **The Case for Exclusion: Bentham's Hedonistic Toolkit**

  However, Bentham's mature system, particularly his attack on the "principle of sympathy and antipathy" and his analysis of pain, provides sophisticated, *hedonistically grounded* reasons to exclude aggregated disgust-pain from the legislative calculus:

  1.  **The Principle of Sympathy and Antipathy Revisited:** Bentham's rejection isn't merely a separate moral principle; it's a *diagnostic tool* identifying a *source of error* within the calculus itself. He defines this principle as "that principle which approves or disapproves of certain actions... merely because a man finds himself disposed to approve or disapprove of them" (*Principles*, Ch. II, Para. 14). Legislating based *solely* on widespread disgust *is* the principle of antipathy in action. Crucially, Bentham argues this principle **masquerades as a reason but provides none**; it's an appeal to raw, unexamined feeling posing as justification. Including it uncritically in the calculus corrupts the calculation by treating an *unjustified feeling* as a *reason* for inflicting tangible harm (punishment).
  2.  **Distinguishing Pains: Grounded vs. Groundless Antipathy:** Bentham implicitly distinguishes between pains arising from tangible interests (security, property, person) and those arising from "groundless antipathy" (his term in the unpublished writings on sexuality). Disgust at consensual private acts between men is characterized as "imaginary mischief" or "prejudice." Why is this distinction hedonistically relevant?
      *   **Epistemic Bankruptcy:** Disgust-pain in this context lacks a *hedonistically relevant object*. It isn't caused by an *actual* deprivation of pleasure or infliction of tangible pain on the disgusted person. It stems from an unfounded belief that the *mere existence* of the act intrinsically harms society or divine order – beliefs Bentham ruthlessly dissected as superstition lacking empirical foundation. Including pains based on demonstrably false beliefs risks building policy on sand, leading to miscalculations and unnecessary suffering.
      *   **The Self-Defeating Nature of Legitimizing Disgust:** Bentham understood that legitimizing legislation based on raw disgust creates a far greater, systemic pain: **insecurity**. If *any* majority's mere dislike becomes grounds for criminalizing harmless private conduct, *no one's* liberty is secure (*"What security has any man? What security has any set of men?"* - paraphrase from his sexual non-conformity writings). The pervasive anxiety and fear generated by this arbitrary power inflict a vast, diffuse pain across society, undermining the foundational utilitarian goal of security – a pre-condition for experiencing most other pleasures. Suppressing harmless acts to appease disgust thus creates a greater aggregate pain than it prevents.
      *   **Fecundity and Purity:** Disgust-driven legislation has terrible "fecundity" (tendency to produce more pain) and "purity" (lack of admixture with pleasure). Punishment inflicts direct, intense pain (execution, imprisonment, stigma) on individuals. This pain is highly "fecund," breeding resentment, fear, blackmail, and driving behavior underground, preventing harm reduction. The pleasure of appeased disgust for the majority is likely fleeting ("impure") and vastly outweighed by the tangible pains inflicted and the general insecurity fostered.
  3.  **Operational Rules of the Calculus:** Bentham's calculus isn't a mindless sum of every reported feeling. It requires **scrutiny of causes and consequences**. Pains based on "groundless antipathy" fail this scrutiny:
      *   **Certainty/Uncertainty:** The *link* between the tolerated act and the alleged harm to society (causing the disgust) is highly uncertain (based on prejudice), while the pain caused by punishment is certain.
      *   **Extent:** While the disgusted may be numerous, the calculation must include *all* affected: the persecuted minority suffers intensely, and society suffers from insecurity and the costs of enforcement.
      *   **Indirect Consequences:** Counting disgust legitimizes prejudice, encouraging its spread and intensity, creating a feedback loop of escalating pain and suppression. Excluding it helps diminish the prejudicial feeling itself over time (a point Bentham hints at).

  **The Verdict: Exclusion Grounded in Hedonism**

  While your friend powerfully exposes a potential vulnerability in a naive aggregative hedonism, Bentham's mature system possesses the internal resources to exclude aggregated disgust-pain from the felicific calculus for legislative decisions *without* importing an external liberty or harm principle. The key lies in recognizing:

  1.  **The Principle of Sympathy/Antipathy as a Fallacy:** Including disgust uncritically *is* surrendering to this fallacy, corrupting the calculus.
  2.  **The Hedonistic Irrelevance of "Groundless" Pains:** Pains based solely on false beliefs about harm lack a valid object within a system demanding empirical grounding for legislation. Their inclusion leads to demonstrably worse aggregate outcomes (massive tangible suffering + pervasive insecurity).
  3.  **Security as Paramount Pleasure:** Suppressing harmless acts to appease disgust catastrophically undermines security, the bedrock of social utility, generating far greater aggregate pain than the fleeting appeasement of prejudice provides.

  Bentham doesn't need Mill's harm principle because his deeper analysis of pain, the sources of error in moral reasoning, and the paramount importance of security provide a *hedonistic pathway* to the same conclusion. Excluding aggregated disgust-pain isn't an *import*; it's the result of rigorously applying Bentham's *own* utilitarian tools – particularly the dissection of the sympathy/antipathy fallacy and the analysis of the tangible consequences of legitimizing prejudice – to prevent the calculus from becoming self-defeating and tyrannical. His case for toleration rests firmly, if complexly, within the logic of hedonistic bookkeeping itself. Your interpretation, therefore, prevails: Bentham's rejection of the principle of sympathy and antipathy provides the necessary and sufficient *hedonistic* justification for excluding the aggregated pain of disgust from the calculation regarding consensual sexual acts.
