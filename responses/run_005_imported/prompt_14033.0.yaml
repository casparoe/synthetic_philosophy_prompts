  ## Charter Revision Commission Recommendation: Voting Rights for Budget Articles

  **To:** Charter Revision Commission Members  
  **From:** [Your Name], Commission Member  
  **Date:** 10 October 2023  
  **Subject:** Recommendation Regarding Proposed Limited Franchise for Seasonal Property Owners on Budget Articles  

  **Issue Under Consideration:**  
  A proposal has been raised to amend the Town Charter to grant seasonal property owners (non-residents who pay property taxes but reside elsewhere most of the year) the right to vote *specifically* on municipal budget articles at Town Meeting. This arises from the observation that approximately 50% of our property tax base, funding core services including schools, is contributed by these owners who currently have no voting rights. Concurrently, full-time residents who rent (and thus do not pay property tax directly) possess full voting rights. The current Charter defines voters simply as "legal voters of the town," interpreted historically to mean residents registered to vote.

  **Commission's Task:**  
  To determine whether to recommend amending the Charter to create this limited, tax-based franchise for budget votes.

  **Fair Presentation of Opposing Views:**

  1.  **Proposal for Limited Franchise (Seasonal Owner Perspective):**
      *   **Core Argument:** There is a fundamental principle of "no taxation without representation." Seasonal owners bear a significant, direct financial burden for the town's budget through property taxes but have no voice in determining how that money is spent. This creates a disconnect between those funding services and those deciding their scope and cost.
      *   **Focus on Budget Impact:** Their stake is primarily financial. Granting voting rights *only* on budget articles directly addresses this specific concern without granting broader governmental influence.
      *   **Equity & Contribution:** They argue it is inequitable that renters, whose landlord's tax burden may be indirectly passed on but who pay no tax directly to the town, have full voting power on budgets, while those directly funding half the budget have none. Their significant financial contribution merits a voice on fiscal matters.

  2.  **Opposition to Limited Franchise (Resident Perspective):**
      *   **Core Principle:** The foundational democratic principle is "no representation without *residency*." Voting rights belong to those who live in the community year-round, are subject to its laws and ordinances daily, utilize its services constantly (schools, roads, emergency services), and experience the direct consequences of budgetary and policy decisions on their daily lives and community fabric.
      *   **Defining "Community":** A voter's stake extends far beyond finances; it encompasses the lived experience of the town. Budget decisions impact service levels, school quality, infrastructure maintenance, and overall community character in ways that primarily affect residents.
      *   **Administrative & Precedent Concerns:** Creating a bifurcated franchise (different voters for different articles) would be administratively complex, potentially confusing, legally questionable under state law, and could set an undesirable precedent for further dilution of the residency requirement. Property ownership is not the sole basis for civic participation; residency is.

  **Commission Recommendation:**

  **The Commission recommends AGAINST amending the Charter to grant seasonal property owners voting rights on budget articles.**

  **Reasoning for Recommendation:**

  1.  **Primacy of Residency:** The principle that voting rights are fundamentally tied to residency within the community remains paramount. Town Meeting exists for the self-governance of the *people who live here*. While financial contribution is significant, it does not equate to the year-round stake in the community's well-being, character, and daily operations that residency entails. Budget decisions profoundly impact these lived experiences in ways that extend far beyond the tax bill.
  2.  **Legal and Administrative Integrity:** The current system, based on residency and state voter registration laws, is clear and administratively sound. Creating a novel, limited franchise based solely on property ownership for specific articles introduces significant legal uncertainties (potential conflicts with state constitutional provisions or election laws) and substantial administrative burdens for the Town Clerk in verifying eligibility, maintaining separate voter lists, and managing distinct ballots or voting procedures for budget items.
  3.  **Cohesion of the Franchise:** Splitting the franchise risks creating two classes of voters with potentially competing interests based on transient versus permanent stakes. This could undermine the collective decision-making process central to Town Meeting, where voters are expected to weigh the *overall* needs of the community, not just their individual tax liability.
  4.  **Addressing the Underlying Concern:** While the Commission rejects the specific proposal for a voting franchise, it acknowledges the valid concern of seasonal owners regarding their significant financial contribution and desire for input. **This input should be sought and valued through robust, non-voting mechanisms.** The Commission strongly encourages the Selectboard and Town Administration to:
      *   Establish formal, accessible channels for seasonal property owners to provide input on the budget *before* Town Meeting (e.g., dedicated public comment sessions, online forums, targeted surveys).
      *   Ensure budget documents and presentations clearly communicate the sources and impacts of property tax revenue.
      *   Explore the creation of an advisory committee that includes seasonal owner representation to provide formal feedback to the Selectboard and Budget Committee.

  **Conclusion:**

  The principle of residency as the cornerstone of the municipal franchise is essential for legitimate self-governance reflecting the lived experience of the community. While the substantial financial contribution of seasonal property owners is deeply appreciated and crucial to the town's operations, it does not supersede the fundamental link between residency and the right to vote. Amending the Charter to create a tax-based franchise for budget articles introduces significant legal, administrative, and philosophical difficulties. Instead, we recommend enhancing formal avenues for seasonal owners to contribute their perspectives to the budgetary process, ensuring their voices are heard and their concerns addressed within the existing framework of resident-led governance.
