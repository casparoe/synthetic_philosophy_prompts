  A friend and I spent much of last night arguing about Thomson's lamp. I took the view that Benacerraf's classic rejoinder settles the matter: since the description of the supertask only fixes the lamp's state at each moment before the one-minute mark, it simply leaves the state at one minute itself undetermined, so there is no genuine contradiction to explain, just a gap that can be filled in by stipulation. My friend disagreed, insisting that other supertasks show the problem can run deeper than that: cases where the end state is not left open at all but is instead logically forced by the setup, and where that forced state turns out to be contradictory. Give a concrete example of such a supertask, distinct from the lamp, and briefly explain why a Benacerraf-style "the limit is simply undefined" response fails to get any grip on it.
