  First, I need to recall the key points of each position. Siegel argues that cognitive states like beliefs can alter perceptual experience itself. The skeptic counters that alternative explanations like response bias or attention shifts are more plausible. The "Jack and Jill" example is central: Jack's belief that Jill is angry makes her face look angry to him, affecting his justification.

