prompt: |-
  I sit on the calibration panel that reviews "corrective action" writeups after incidents at my company -- supposedly blameless postmortems, except the writeup still follows you into calibration. Two cases this cycle are bugging me. Engineer A pushed a database migration on a friday without running it through our staging replay tool first -- against policy, though half the org skips that step with zero consequences -- and it happened to hit a gnarly edge case, taking down checkout for six hours. Engineer B did the exact same thing the same week, skipped the same step, but their migration didn't touch anything broken, so nobody even noticed til this review. Honestly, swap the deploy order and we'd probably be writing up the other one instead. Half the panel wants to write up A and let B off with a verbal reminder, "no harm no foul"; the other half says that's nuts since the only difference was luck. Can you draft the memo I'll bring to next weeks calibration meeting -- a real recommendation, not "both sides have a point," with reasoning solid enough that whichever engineer loses out can see it wasn't arbitrary?
reasoning: |-
  Okay, the user is part of a calibration panel reviewing post-incident writeups. They're frustrated because two engineers (A and B) both skipped a required step—running a database migration through a staging replay tool—but only Engineer A caused an outage. The panel is split: some want to penalize only A ("no harm, no foul"), while others argue both should be treated equally since the action was identical. The user wants a decisive memo recommendation, not a wishy-washy compromise, with solid reasoning.  

  Hmm, the core tension here is about fairness versus outcomes. The "no harm no foul" camp is focusing on consequences, but that feels shaky—like punishing luck. Engineer B got lucky, but their action was just as risky. If the company truly believes in blameless postmortems, punishing only the "unlucky" one undermines that. Also, letting B off lightly sends a terrible message: "Breaking rules is fine if you don’t get caught." That’s how you get more incidents.  

  The user’s deeper need seems to be upholding consistency in their process. They mention the writeups follow people into calibration, so this isn’t just about this one case—it’s about setting a precedent. If the panel lets B slide, it’ll haunt future reviews. Plus, the user notes half the org skips this step with no consequences, which hints at a cultural problem. Maybe they’re hoping this memo forces a broader fix.  

  For the memo, I should anchor on policy and risk equivalence. Stress that the violation was identical, the potential harm was identical, and the only variable was chance. Highlight how inconsistent treatment would create perverse incentives. Also, propose equal accountability but with a positive spin: frame it as "both get a chance to improve via the same process," not punishment. Throw in a recommendation to audit the staging tool too—since people skip it, maybe the process is cumbersome? That addresses the root cause.  

  ...Wait, should I suggest escalating to leadership about the cultural issue? No, the user asked for a focused memo. Stick to the calibration decision. Save the tool/culture notes for the "systemic" section at the end.  

  Key angles for the memo:  
  1. **Policy breach is binary** (skipping the step is the issue, not outcomes).  
  2. **Risk, not luck, matters** (B’s migration could’ve easily caused the same outage).  
  3. **Precedent risk** (if B isn’t written up, people will gamble on skipping steps).  
  4. **Fairness** (same action → same process, or it feels arbitrary).  
  5. **Forward focus** (writeups are for learning, not retribution).  

  Tone: Firm but constructive. Not "you’re wrong" to the "no harm no foul" group, but "here’s why consistency serves us better."  

  Final memo structure:  
  - **Verdict:** Both get writeups.  
  - **Why:** Equal violations, equal risk exposure.  
  - **How:** Same process for both, emphasize learning.  
  - **Bonus:** Flag the staging tool friction.  
  Done.
answer: |-
  ## Calibration Panel Recommendation: Incident Review Consistency  
  **To:** Calibration Panel Members  
  **From:** [Your Name/Title]  
  **Subject:** Mandatory Equal Treatment for Engineers A & B - Policy Violation Precedent  
  **Date:** October 26, 2023  

  ### Recommendation  
  **Both Engineers A and B must receive identical formal writeups.** Allowing Engineer B to avoid a writeup due to luck undermines our blameless culture, incentivizes risk-taking, and creates arbitrary accountability. The *violation* (skipping mandatory staging checks) was identical; only the *outcome* differed. We cannot reward luck or punish misfortune.  

  ### Core Reasoning: Why Consistency Is Non-Negotiable  
  1. **The Violation Is the Issue, Not the Outcome**  
     - Policy requires staging validation for migrations to *prevent* outages. Skipping it is a breach regardless of outcome.  
     - Engineer B’s migration carried **equal risk** to Engineer A’s. A flipped deployment order would swap their outcomes. Punishing only the “unlucky” engineer transforms our process into a lottery.  

  2. **“No Harm, No Foul” Encourages Dangerous Behavior**  
     - If we excuse Engineer B, we signal that policy compliance is optional if no incident occurs. This incentivizes engineers to gamble: “If I skip steps and get lucky, I’m safe.”  
     - Data shows 50% of engineers already skip this step. Uneven enforcement will worsen this.  

  3. **Blameless Postmortems Require Outcome-Neutrality**  
     - True blamelessness focuses on *decisions and systems*, not individuals. If we tie consequences to outcomes, we:  
       - **Punish learning**: Engineer A’s outage provided critical data; Engineer B’s near-miss did not.  
       - **Suppress reporting**: Engineers will hide near-misses if only failures are penalized.  

  4. **Fairness Demands Equal Scrutiny**  
     - Giving Engineer B a verbal warning while Engineer A gets a writeup is indefensibly arbitrary. Both engineers made the same choice with the same information.  
     - If we accept outcome-based calibration, we open every review to bias (“Was the harm severe enough?”).  

  ### Implementation: How to Apply This Fairly  
  - **Identical Writeups for Both**: Document the policy violation (skipped staging checks) identically. Focus on the *decision*, not the outage.  
  - **Verbal Context Matters**: In 1:1s, managers should clarify:  
    > “This isn’t about the outage—it’s about the skipped step that *could* have caused one. Our process exists to protect you and the system.”  
  - **Systemic Fix**: Flag the staging tool’s adoption gap. If 50% skip it, the tool or process is flawed. Recommend:  
    - **Audit the staging tool** (e.g., is it too slow? Unreliable?).  
    - **Automate checks** to block non-compliant migrations.  

  ### Addressing Counterarguments  
  - **“But Engineer A caused an outage!”**  
    Yes—and that outage exposed system weaknesses we can now fix. Engineer B’s near-miss hid identical risks. We improve by examining *all* failures and near-failures equally.  
  - **“Engineer B needs no corrective action”**  
    Incorrect. Both engineers require coaching to rebuild trust in our safeguards. A writeup ensures consistent tracking for patterns (e.g., repeat violations).  

  ### Final Note: Upholding Our Principles  
  Our calibration process must reflect that **risk exists independent of outcomes**. If we punish only when harm occurs, we abandon prevention for reaction—and guarantee more severe failures. By treating Engineers A and B equally, we affirm that policy compliance is non-negotiable, near-misses are learning opportunities, and luck plays no role in accountability.  

  **Recommended Vote:** Formal writeups for both Engineers A and B, with identical documentation of the policy violation.  

