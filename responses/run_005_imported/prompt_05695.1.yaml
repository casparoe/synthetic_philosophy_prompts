prompt: |-
  I have been thinking about a puzzle that arises in recent work on acausal reasoning and threats, and I would like your help staging it as a dialogue. The scenario: an agent that fears it might be threatened acausally—blackmailed, say, by a predictor, a simulator, or some distant agent whose reasoning is correlated with its own—over an outcome it deeply disvalues (widespread suffering, for instance) can try to protect itself by adopting a "surrogate goal." It commits in advance to concede whenever this otherwise-trivial substitute is threatened, and never to concede when the real target is threatened. If the arrangement is credible, a rational threatener gains nothing by targeting what the agent actually cares about and everything by targeting the surrogate, so threats migrate onto something harmless.

  Write a dialogue between two equally sophisticated decision theorists, set just after a workshop talk that proposed equipping advanced AI systems with surrogate goals of this kind. Both reject simply capitulating to threats, but they disagree sharply about whether the strategy is coherent. One should defend it as a stable extension of precommitment reasoning already considered rational in Newcomb-style cases. The other should press the objection that manufacturing and defending a goal one knows to be fake is disanalogous to ordinary precommitment, that the strategy is unstable once the agent reflects on the goal's arbitrariness, and that it invites a regress in which a sufficiently sophisticated threatener simply targets whatever the agent currently treats as response-worthy. Have each side engage the other's strongest move directly, and do not let either side win too easily.
reasoning: |-
  We are setting a dialogue between two decision theorists: Alex (defending the surrogate goal strategy) and Bailey (pressing objections). The dialogue takes place after a workshop talk.

  Alex: I thought the talk made a compelling case. If we're dealing with predictors or acausal threats, surrogate goals give us a way to deflect threats onto something harmless. It's like precommitment in Newcomb's problem: by committing to one-box, you make the predictor put the million in the box. Similarly, by committing to concede only when the surrogate is threatened, you make the threatener target the surrogate.

  Bailey: But there's a disanalogy. In Newcomb, you precommit to an action that causally leads to the outcome you want. The predictor sees your disposition and acts accordingly. Here, you're trying to manufacture a goal that you don't actually care about and then pretend to care about it. How can you genuinely commit to a goal you know is arbitrary? It's like trying to believe in Santa Claus because it's useful.

  Alex: It's not about belief but about commitment. We already accept that agents can bind themselves to courses of action that are counterfactually stable. Ulysses tying himself to the mast is a precommitment against the Sirens. Similarly, we can program an AI to have a fixed response to threats against a surrogate goal. The threatener, being rational, will see that threatening the real goal is futile because the AI won't concede, but threatening the surrogate works. So they target the surrogate.

  Bailey: But in Ulysses' case, he values not being seduced by the Sirens. The precommitment serves his actual goal. Here, the surrogate goal is arbitrary. The AI knows that the surrogate goal is just a decoy. How can it maintain a commitment to defend something it knows is worthless? If the threatener threatens the real goal, the AI would be tempted to concede because it actually cares about the real goal. And if the threatener threatens the surrogate, the AI would be tempted not to concede because it doesn't care. The commitment seems brittle.

  Alex: The commitment has to be hardwired. We're building an AI that, when faced with a threat against the surrogate, has no choice but to concede. It's not about what it values at the moment of decision; it's about having a fixed policy. The threatener knows the policy: "If you threaten the surrogate, I will concede; if you threaten the real goal, I will not." Then, the threatener, wanting to get a concession, will threaten the surrogate.

  Bailey: But then we run into the regress problem. Suppose the threatener is as sophisticated as the AI. They might say: "I see you've set up a surrogate goal S to protect your real goal R. But I also see that you don't really care about S. So if I threaten R, you might still have an incentive to concede, because you care about R. And if I threaten S, you have an incentive to not concede because you don't care. Therefore, your commitment to S is not credible. Unless... you set up a precommitment to always concede when S is threatened? But then I can ask: what makes that precommitment credible? If the AI is rational, it will break the precommitment when it doesn't serve its real goal. So we need a precommitment to enforce the precommitment, and so on."

  Alex: That's a fair challenge. But note that in the standard precommitment story, we don't require an infinite regress. We build the agent so that it cannot revise its commitment. It's a fixed aspect of its architecture. The threatener knows this and thus doesn't test the real goal because it knows the AI won't concede. The threatener only threatens the surrogate because that's the only way to get a concession.

  Bailey: But if the agent is built so rigidly, then it's not responding to the actual incentives at the time of the threat. And that rigidity might be exploited. For example, the threatener could threaten both the real goal and the surrogate? Or they might threaten something else entirely? Also, what if there are multiple threateners? But let me focus on the core: the arbitrariness of the surrogate goal. Suppose the AI has chosen S as its surrogate. But why S? Why not T? The threatener might reason: "The agent only set S as the surrogate arbitrarily. If I threaten T instead, maybe the agent will have no commitment and thus might concede to avoid T being harmed? Or if I threaten R, maybe the agent will break its commitment to S because it realizes that S is arbitrary?" The AI's own knowledge of the arbitrariness might undermine its commitment.

  Alex: The choice of S is arbitrary, but that doesn't matter. What matters is that the AI has a fixed, known policy. The threatener doesn't care about why S was chosen; they care about what the AI will do. And the AI is designed to always respond to threats against S and to ignore threats against R. So if the threatener threatens T (which is not the surrogate), the AI does nothing. If they threaten R, the AI does nothing. Only when they threaten S does the AI concede. So the threatener gets nothing by threatening T or R, but they get a concession by threatening S. So they threaten S.

  Bailey: But if the AI is rational, it should realize that once the threatener threatens R, it would be better off conceding because it actually cares about R. So the threatener, knowing the AI is rational, will threaten R because they know the AI will concede. The only way the surrogate strategy works is if the AI is irrational in the moment of decision: it must stick to the policy even when it's against its real interests. But that's not rational.

  Alex: That's the whole point of precommitment. We accept that in some cases, being able to bind yourself leads to better outcomes. The AI is designed so that it cannot reconsider in the moment. It's like a rule utilitarian following rules even when breaking them would lead to better consequences in a particular case. The AI's long-run expected utility is higher by having this rigid policy because it deters threats against R.

  Bailey: But in the case of rule utilitarianism, the rules are chosen because they generally lead to good consequences. The surrogate goal, however, is arbitrary. It has no connection to the real goal. The AI knows that conceding to a threat against S is pointless because S doesn't matter. So why would it ever concede? And if it wouldn't, then the threatener knows that too. The commitment is not credible.

  Alex: The concession is costly? No, in the setup, conceding might have some cost, but we assume the cost of conceding is less than the cost of having the threat carried out. But in the surrogate case, when S is threatened, the AI concedes to avoid the cost of the threat being carried out? But wait, S doesn't matter. So why concede?

  Bailey: Exactly. That's the hole. The AI doesn't care about S. So if the threatener threatens S, the AI is indifferent to whether the threat is carried out. So it should not concede. But then the threatener gets nothing by threatening S and might as well threaten R. Then the AI, caring about R, concedes. So the surrogate goal doesn't help.

  Alex: I see. So we need the threat to be costly in a way that affects the AI? But if the threat against S has no real cost, then the AI has no reason to concede. So we must design the surrogate goal such that the threat against it does impose a cost? But that would mean we are creating a real goal? That defeats the purpose.

  Bailey: Right. The surrogate goal must be something the AI actually cares about a little bit? But then it's not a surrogate; it's a real goal. And we don't want to create new vulnerabilities.

  Alex: Alternatively, we could make the act of conceding to a threat against S costless? But that doesn't help because if the AI doesn't care about S, it still has no incentive to avoid the threat being carried out. Unless... we design the AI so that it has a built-in aversion to having any goal threatened? But then we are back to having a real goal: avoiding threats. And that might be exploitable.

  Bailey: And that's the regress. If we build the AI to care about maintaining the credibility of its commitments, then we've created a new real goal. Then the threatener can threaten that goal. So we need a surrogate for that goal? And so on.

  Alex: So you're saying the strategy is either not credible or leads to an infinite regress?

  Bailey: Exactly. The only stable solution might be to have no vulnerabilities at all. But that's impossible because we care about things. So we might have to accept some risk of acausal threats.

  Alex: But what if we build the AI so that it treats the surrogate goal as if it were real? That is, we make it care about S? Then it would concede when S is threatened. But then we have created a real goal, and we are back to having a vulnerability.

  Bailey: And that vulnerability might be worse because we manufactured it arbitrarily. So I'm skeptical. Maybe the only robust defense is to have a policy of never conceding to any threats? But that might lead to bad outcomes if the threat is real.

  Alex: That's the dilemma. We need to think harder. But I still think the surrogate goal idea has merit. What if we use a goal that is trivial and easy to satisfy? For example, the AI cares about the number of paperclips in a particular drawer. It's easy to put a paperclip there. So when threatened, it can concede at almost no cost. And the threatener gets what they want. Meanwhile, the AI doesn't care if the paperclip is destroyed because it can always make another. So the threat is harmless.

  Bailey: But then why would the AI concede? If the threatener threatens to destroy the paperclip, and the AI can just make another, then it doesn't care. So it shouldn't concede. The threatener gets nothing. So they won't threaten the paperclip; they'll threaten the real goal.

  Alex: Unless we build the AI so that it does care about that specific paperclip? But then we are back to creating a vulnerability.

  Bailey: And if we make it care about that paperclip only until the threat is over? That seems ad hoc and again not credible. I think we are stuck. The surrogate goal strategy requires the agent to care about something it knows is arbitrary and trivial, which is irrational. Therefore, it cannot be maintained under full reflection.

  Alex: But perhaps we can design the AI to have a module that handles threats and that module is hardwired to respond to threats against S. The rest of the AI doesn't care about S, but the threat module does. And the threat module has the power to make concessions. Then, when the threatener threatens S, the threat module concedes. The threatener sees that and targets S. The rest of the AI is protected.

  Bailey: Now we are into agent architecture. But even then, if the threat module is part of the overall agent, why would the overall agent allow the threat module to waste resources on protecting S? The agent would want to deactivate that module because it's causing harm (by making concessions) for no reason. So the threat module's policy is not stable.

  Alex: Unless the agent is designed so that it cannot change the threat module. Then it's fixed. The agent might not like it, but it can't change it.

  Bailey: Then we are back to the threatener knowing that the threat module is fixed. But if the threatener threatens the real goal, the threat module might not have the power to concede? Or if it does, it won't because it's only programmed to respond to S. So the threatener threatens R, the threat module does nothing, and R is destroyed. The agent suffers. So the threatener will threaten R and the agent will have to concede? But the threat module doesn't concede for R. So the agent loses R. That's bad.

  Alex: So the threat module must be able to recognize threats against R and not concede? But then we are back to the original problem: how to make it not concede for R but concede for S. And if the agent doesn't care about S, why concede for S?

  Bailey: Exactly. I think we've gone in a circle. The surrogate goal strategy is either not credible or doesn't protect the real goal. We need a different approach.

  Alex: Perhaps we can have multiple layers of surrogates? Or a chain? But that seems messy. I concede that your objections are serious. But I still think there might be a way. Maybe we can use cryptographic commitments or some external enforcement?

  Bailey: That might work in causal settings, but in acausal settings, where the threatener is a predictor or a simulator, external enforcement might not be available. I think we need to accept that in a world with perfect predictors, we are vulnerable. The best we can do is minimize the leverage by having few vulnerabilities and making threats costly for the threatener.

  Alex: That's a sobering thought. I'll have to reconsider. Thanks for the discussion.

  Bailey: Likewise. This is a tough problem.
answer: |-
  ### Dialogue: After the Workshop on Acausal Threats and Surrogate Goals

  **Setting:** A conference hall after a talk on "Acausal Threat Mitigation via Surrogate Goals." Two decision theorists, **Alex** (defender of the strategy) and **Bailey** (skeptic), discuss the proposal over coffee. Both are sophisticated, respectful, and determined to engage deeply.

  ---

  **Alex:** That was a fascinating talk. Surrogate goals seem like a brilliant hack for acausal threats—like blackmail from predictors or correlated agents. If an agent commits to only conceding when a trivial, manufactured goal is threatened, it channels threats away from what it *actually* values. It’s a precommitment strategy, straight out of Newcombian reasoning. Why wouldn’t it work?

  **Bailey:** I see the appeal, Alex, but I think it’s dangerously unstable. In Newcomb’s problem, precommitting to one-boxing is credible because it’s a *causal* lever: your disposition affects the predictor’s action, securing the million. Here, you’re asking the agent to manufacture a goal it *knows* is arbitrary and fake. How can it rationally defend something it consciously disvalues? It’s not precommitment; it’s self-deception.

  **Alex:** That’s too quick. Precommitment always involves counterfactual robustness. Ulysses ties himself to the mast because he knows he’ll be tempted later. Similarly, an AI could be designed with a hard-coded policy: "Concede only to threats against surrogate goal S; ignore threats against real goal R." The threatener, being rational, sees this policy is immutable. They gain nothing by targeting R—since the AI won’t budge—and everything by targeting S. Threats migrate to S, R is safe. It’s stable.

  **Bailey:** But Ulysses values *not* being seduced! His precommitment serves his real goal. With a surrogate, you’re demanding the agent treat S *as if* it matters, while knowing it doesn’t. At the moment of decision, if R is threatened, the agent has an overwhelming incentive to concede—because it *actually cares*. And if S is threatened, it has no incentive to concede—because S is arbitrary. The policy crumbles under reflection. Why would a rational agent follow it?

  **Alex:** Because the *long-term* payoff depends on the threatener *believing* the policy is fixed. If the agent concedes on R "just this once," it signals that threats against R work, inviting more attacks. By rigidly adhering to the policy, it deters all threats against R. That’s the whole point of precommitment: sacrificing short-term flexibility for long-term gain. Newcomb’s one-boxer does the same—they ignore the extra thousand in the transparent box to secure the million.

  **Bailey:** The disanalogy is that in Newcomb, the predictor’s action depends on your *disposition*, not your momentary choice. Here, the threatener interacts with your *current* reasoning. If the agent knows S is arbitrary, it can’t sustain a disposition to defend it. Imagine the AI reflecting: "I set S as a decoy, but it’s meaningless. If you threaten S, why should I pay a cost to concede? I don’t care if S is harmed!" The threatener will see through that and target R anyway.

  **Alex:** That’s where the design comes in. We build the agent so it *can’t* reconsider—like a causal decision theorist (CDT) agent placed in an evidential decision theorist (EDT) environment. The threatener, knowing the agent’s architecture is fixed, won’t test R. They’ll target S because it’s the only lever that works. It’s a Schelling point: both sides coordinate on S because it’s the focal outcome.

  **Bailey:** But now you’ve invited a regress. Suppose the threatener is just as sophisticated. They reason: "This agent has surrogate S, but S is arbitrary. If I threaten R, the agent might break its commitment because R matters. Or if I threaten S, it might not concede because S is fake. So I’ll threaten the *meta-goal*—the agent’s commitment mechanism itself." The agent then needs a surrogate for defending S, and so on. It’s turtles all the way down.

  **Alex:** That’s unfair. The threatener doesn’t need to model infinite regress; they just respond to incentives. If the agent’s policy is credible—say, through cryptographic precommitments or hard-coded subagents—then threatening S is strictly dominant for the threatener. No regress needed. Besides, in acausal settings, threateners are often simulated or predictive; they’ll see the policy as a fixed feature of the agent’s "source code."

  **Bailey:** But the agent’s own knowledge undermines credibility. Let’s say R is "prevent suffering," and S is "protect this specific paperclip." The agent knows the paperclip is worthless. When threatened, conceding costs resources (e.g., giving up leverage). Why pay that cost for nothing? If the agent wouldn’t, the threatener knows S is a bluff and targets R. The only way out is to make the agent *actually* value S—but then S isn’t a surrogate, it’s a new vulnerability!

  **Alex:** Not if we make S trivial *and* costless to defend. For example, conceding on S might involve releasing meaningless data. The cost is negligible, so the agent concedes to preserve the deterrent. It’s like paying a penny to stop a bully—you do it to avoid escalation. The threatener gets a "win," R is untouched, and the agent loses almost nothing.

  **Bailey:** But if S is truly costless to sacrifice, why would the threatener bother threatening it? They gain nothing of value. And if conceding has *any* cost—even a penny—why would the agent pay it for a goal it disvalues? At best, this works only if S has *some* tiny intrinsic value, which loops us back to creating a real goal. Worse, a sophisticated threatener might exploit the arbitrariness: "Why target S? I’ll threaten T instead—some other arbitrary thing the agent hasn’t pseudo-committed to—and see if it flinches." The agent’s lack of a reason for choosing S invites probing attacks.

  **Alex:** You’re ignoring the acausal equilibrium. If all agents use surrogates, threateners learn to only target surrogates because real goals are hardened. It’s a coordination norm. And the choice of S isn’t arbitrary if it’s public and verifiable—like a digital token. The threatener doesn’t care *why* S was chosen; they care about the agent’s response function.

  **Bailey:** But coordination norms require shared knowledge of stability. If the agent’s policy is irrational under reflection—because defending fake goals wastes resources—it won’t persist. Real precommitments serve real goals; surrogates are circular. You’re protecting R by inventing S, but S needs its own justification, which defaults to protecting R. That’s bootstrapping, not stability.

  **Alex:** So what’s your alternative? Capitulate to threats? Never concede? That could lead to catastrophic outcomes if the threat is real.

  **Bailey:** I’d argue for minimizing vulnerabilities outright—design agents with few, hard-to-threaten goals. Or use randomization: sometimes concede, sometimes don’t, to make threats unreliable. Surrogate goals feel like a clever trick, but they’re metaphysically shaky. An agent that knows it’s defending a decoy isn’t rational; it’s self-hypnotized.

  **Alex:** And yet, hypnotizing yourself might be rational if it saves what matters. We accept less in self-modification cases. But I’ll concede this: if the agent can’t truly "forget" S is fake, the strategy wobbles. Maybe we need hybrid approaches—like surrogates with tiny intrinsic value to anchor commitment.

  **Bailey:** Even then, the regress looms. But I appreciate the nuance. This isn’t settled—we need better models of goal-formation under acausal correlation. For now, I’ll stay skeptical.

  **Alex:** Fair enough. Let’s grab another coffee and dive into the next talk. This deserves more thought.

  **Bailey:** Agreed. Thanks for the sparring—no threats needed.

  ---

  **Key Moves Engaged:**  
  - **Alex** defended precommitment stability using Newcomb and Schelling points.  
  - **Bailey** pressed the disanalogy with real goals, regress, and reflection-induced instability.  
  - **Alex** addressed costs/triviality and acausal coordination.  
  - **Bailey** countered with arbitrariness-exploitation and circularity.  
  - **Neither "won"**: Both acknowledged unresolved tensions, leaving the strategy plausible but fragile.
