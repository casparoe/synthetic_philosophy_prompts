  For authenticity: I'll have Mark (EU) open with the standard "it's just risk aversion" objection, forcing Dana (REU) to explain why probability distortion isn't reducible to diminishing marginal utility. Then escalate to dynamic consistency - Mark's strongest weapon. Dana's comeback should grant EU's normative pull while arguing REU describes actual human rationality better. The money pump concern needs a concrete defense; maybe Dana argues pumps assume preference stability under framing that REU rejects.

