prompt: |-
  Please explain why no-trade theorems, which seem to show that risk-neutral rational agents with common priors should never bet against each other, don't straightforwardly imply that observed trading in real financial markets is irrational. What exactly are the theorems smuggling in via the common prior assumption, and where does that idealization break down in a way that actually restores gains from trade rather than just adding noise?
