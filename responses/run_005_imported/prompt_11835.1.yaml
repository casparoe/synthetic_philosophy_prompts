prompt: |-
  I've recently joined the board of a homeowners' association for a condominium development that's being built and sold off in phases: of forty-two planned units, thirty are sold and occupied, and the remaining twelve are still unbuilt or unsold. What began as a routine bylaws review has turned into the most contentious thing the board has faced in years, and after a couple of meetings that generated far more heat than clarity, I'd like a more rigorous outside take than anyone on the board has managed to offer.

  The dispute is nominally just about voting rights, but it keeps fracturing into sub-disputes every time we think we've settled it. Under the current bylaws, one vote attaches to each deed, held by whoever is on the title. About a third of the thirty sold units are owned by investors who rent them out on long leases and have never lived there, while several tenants who've rented for years, attend every meeting, and are bound by every rule the board passes have no vote at all, since tenancy isn't ownership. Meanwhile, the board is about to approve a fifteen-year reserve-funding and renovation plan that will financially bind whoever eventually buys the twelve unsold units — people who, by definition, can't be consulted now. The development company that still holds title to those twelve units, and will cast its votes until each one sells, has said plainly that it intends to vote however keeps its own carrying costs lowest, with no particular loyalty to the future owners it's nominally standing in for. Predictably, the board has split: one faction wants to leave the rule exactly as it is, since "one deed, one vote" is at least unambiguous and hard to litigate; another wants to extend a vote to long-term tenants and hold the unsold units' votes in some kind of trust for their eventual owners, on the theory that whoever actually has to live under a rule has the strongest claim to a say in making it.

  This feels like exactly the kind of dispute that would get a long, careful treatment on a rationalist blog, and I keep wishing someone had already written that post — but since I can't find one, I'd rather reason it through directly than lean on half-remembered analogies. Part of me suspects the "one deed, one vote" camp is really just defending a Schelling point — a rule that's stable and hard to litigate, rather than one that's obviously fair — but administrative simplicity has to count for something, and I don't want to dismiss their position just because it's convenient. More fundamentally, my suspicion is that every one of these proposals quietly smuggles in an answer to the very question it's supposed to be neutral about: there's no way to decide who gets to help decide without having, in some sense, already decided who counts. But I can't tell whether that's a genuine and probably irresolvable problem, or just a sophisticated-sounding rationalization for whichever scheme happens to favor my own preferred outcome. I'd like your honest, fully worked-through answer: is there a principled way to settle who should get a vote in a case like this, and if so, what is it, and why does it beat the alternatives? And if you conclude that the problem is genuinely unfixable in principle, I want the argument for that conclusion, not a diplomatic shrug.
reasoning: |-
  Okay, let me unpack this HOA voting rights dilemma. The user presents a layered governance problem that's tearing their board apart, and they're clearly frustrated with superficial debates. They're not just asking for legal advice—they want a rigorous ethical framework to evaluate voting systems.

  First, I notice the user has already identified several key tensions: 
  - Ownership vs occupancy rights (investors vs long-term tenants)
  - Present vs future owner interests (especially for unsold units)
  - Administrative simplicity vs moral legitimacy
  - The meta-problem of circularity in deciding who decides

  Hmm... they're unusually perceptive about the Schelling point dynamic and the neutrality illusion. This isn't someone who wants platitudes—they explicitly reject "diplomatic shrugs." The reference to rationalist blogs suggests they appreciate systematic analysis.

  The core challenge seems to be balancing three competing legitimacy claims:
  1. Legal ownership (current deeds)
  2. Affected interests (tenants/future owners)
  3. Governance stability (avoiding litigation)

  I should probably start by mapping why each standard solution fails:
  - Pure deed-based voting ignores residents who bear rules' daily impact
  - Tenant voting risks creating two classes of "owners" and complicates title systems
  - Holding votes in trust for future owners involves impossible speculation

  Wait—the user's observation about smuggled premises is crucial. Any voting system inherently privileges certain stakeholders. So the real question might be: which privileging aligns best with the HOA's purpose? 

  For condos, HOAs exist primarily to maintain shared infrastructure and livability. That suggests voting weight should correlate with both financial stake and lived experience of rules. But how to operationalize that?

  The developer conflict is particularly thorny. Their profit-motivated votes could saddle future owners with costs they didn't approve. But blocking their votes entirely might violate contractual rights. Maybe the answer is constraining rather than eliminating their vote—like requiring supermajorities for long-term financial commitments.

  On tenants... granting full votes might create perverse incentives, but zero representation feels unjust. Perhaps a non-voting advisory seat? Though the user might see that as tokenism.

  The user seems to want someone to acknowledge that no perfect solution exists while still identifying the least bad option. I should explicitly reject false neutrality—any recommendation will involve tradeoffs, so I'll need to justify why certain losses are more acceptable than others.

  Also worth considering: whatever system they adopt needs to survive legal challenges and future board turnover. A "principled but unimplementable" solution helps no one. Maybe tiered legitimacy where deed votes decide financial matters, but residents get weighted input on living-rule changes?

  The future-owner problem feels most philosophically interesting. We're binding people who can't consent. Only mitigation approaches seem possible—like requiring sunset clauses on major decisions or higher approval thresholds for long-term commitments.

  Ultimately, I'll need to present a framework that:
  1. Accepts the circularity problem rather than pretending to solve it
  2. Prioritizes avoiding irreversible harms
  3. Maintains enough simplicity to actually function
  4. Acknowledges where compromises bleed moral legitimacy

  The user's self-awareness about bias is refreshing. I should mirror that by explicitly stating where my reasoning favors certain values (e.g., resident well-being over absolute property rights) so they can adjust for their own priorities.
answer: |-
  Your analysis is spot-on: this isn't just about voting mechanics, but about **defining moral legitimacy in collective governance** when stakeholders have fundamentally asymmetric relationships to the property. The core tension is between three competing principles:

  1.  **Formal Ownership (Legal Title):** "One deed, one vote" is clear and legally defensible.
  2.  **Affected Interest (Residency & Burden):** Those subject to rules and paying costs should have a voice.
  3.  **Future Stakeholders (Unborn Owners):** Binding future owners requires some representation of their hypothetical interests.

  Each faction's proposal fails to resolve this triad. Here's a rigorous framework for evaluating the options:

  ---

  ### The Unavoidable Trade-offs & Why Existing Proposals Fail

  1.  **"Stick with One Deed, One Vote" (Status Quo):**
      *   **Pros:** Legally robust, administratively simple, respects current property rights.
      *   **Cons:**
          *   **Moral Hazard:** Developer votes against long-term interests of future owners to minimize *their* costs.
          *   **Disenfranchisement:** Long-term tenants bear full burden of rules without representation.
          *   **Tyranny of the Absent:** Absentee investors wield power without experiencing consequences.
      *   **Why it fails:** Prioritizes legal simplicity over moral legitimacy for affected residents and future owners. It's stable *now* but sows seeds of future conflict and resentment.

  2.  **"Extend Votes to Tenants & Hold Unsold Votes in Trust":**
      *   **Pros:** Recognizes affected residents, attempts to protect future owners.
      *   **Cons:**
          *   **Legal Vulnerability:** Granting votes to non-owners likely violates state condo statutes and the master deed/bylaws foundation. Opens the HOA to costly litigation from owners and the developer.
          *   **Defining "Long-Term Tenant":** Creates a new, contentious administrative category. Is it 1 year? 5 years? What about lease renewals? Creates a permanent "second class" of residents with votes but no equity.
          *   **The "Trust" Illusion:** Who is the trustee? How do they discern the "interests" of unknown future buyers? This is pure speculation, not representation. The trustee becomes an unelected decision-maker.
      *   **Why it fails:** Well-intentioned but legally precarious and administratively complex. Replaces one form of unaccountability (developer) with another (trustee), while creating new legal risks.

  3.  **The Meta-Problem You Identified:**
      *   You are absolutely correct: **There is no neutral starting point.** Deciding *who decides* is itself a decision that inherently privileges one principle (ownership, residency, future stake) over others. Any voting rule *is* an answer to the fundamental question of "who counts."

  ---

  ### A Principled Path Forward: Mitigation Over Perfection

  Since no solution perfectly balances all principles, the goal should be **minimizing harm and maximizing legitimacy** within legal constraints. Here's a workable, principle-driven approach:

  1.  **Uphold "One Deed, One Vote" as the Legal Baseline (But Constrain It):**
      *   **Why:** State condo law and your governing documents almost certainly tie voting to deed ownership. Fighting this foundation invites legal defeat. Accept it as the necessary legal shell.
      *   **Mitigation for Tenants:** Create a formal, non-voting **Resident Advisory Committee (RAC)**.
          *   Open to all residents (owners & tenants).
          *   Holds official meetings before board meetings.
          *   Elects a representative with a *mandatory speaking right* at all board meetings.
          *   Board must formally respond to RAC recommendations in meeting minutes.
          *   **Principle:** Recognizes affected interest and provides a structured voice without violating ownership rights or creating legal vulnerability. Enhances legitimacy through transparency and inclusion.

  2.  **Neuter the Developer's Conflict on Critical Long-Term Decisions:**
      *   **Problem:** The developer's profit motive directly conflicts with the long-term interests of future owners.
      *   **Solution:** Amend bylaws to require **supermajority votes (e.g., 67% or 75%) for any decision with a financial commitment exceeding X years (e.g., 5 years)**. This specifically targets the reserve/renovation plan.
      *   **Mechanics:**
          *   The developer *still* casts votes for unsold units (upholding legal baseline).
          *   However, passing the measure requires significant buy-in from *actual resident-owners* who share the long-term interest.
          *   Example: With 30 sold units, 12 unsold. To pass a 15-year plan needing 75%:
              *   Total possible votes: 42.
              *   75% of 42 = 31.5 (round to 32 votes needed).
              *   Developer controls max 12 votes.
              *   Therefore, *at least 20 votes must come from sold units* (32 needed - max 12 from dev = 20). This forces alignment with resident-owner interests.
      *   **Principle:** Protects future owners by requiring consensus from current owners who *do* have a long-term stake and live with the consequences. Accepts the developer's formal right while minimizing their power to dictate long-term burdens. Balances ownership rights with future stakeholder protection.

  3.  **Address Absentee Investors (Indirectly):**
      *   **Problem:** Absentee owners may vote against community interests.
      *   **Solution:** The RAC provides input reflecting resident concerns. The supermajority requirement for long-term decisions also dilutes the impact of purely self-interested absentee votes, as more resident-owner votes are needed.

  4.  **Future-Proofing (The Best You Can Do):**
      *   **Transparency:** Ensure all decisions, especially long-term financial ones, are meticulously documented and disclosed to potential buyers of unsold units. This is a legal and ethical obligation.
      *   **Sunset Provisions:** Build reviews into the long-term plan (e.g., every 5 years) allowing *future* owners to adjust based on actual conditions and their own preferences.
      *   **Reserve Study Rigor:** Base the 15-year plan on an independent, professional reserve study. This provides objective justification, making it harder for future owners to claim it was unreasonable.

  ---

  ### Why This Approach Beats the Alternatives

  *   **Legally Defensible:** Works within the "one deed, one vote" framework mandated by law and docs.
  *   **Enhances Legitimacy:** Gives residents (owners *and* tenants) a formal voice (RAC) and forces alignment between long-term decisions and resident-owner interests (supermajority).
  *   **Protects Future Owners:** Supermajority requirement prevents the developer (or a small coalition) from saddling future owners with burdens against the will of the existing resident-owner majority. Transparency and sunset clauses add further protection.
  *   **Administratively Feasible:** RAC and supermajority rules add manageable complexity. No need for impossible "trusts" or legally dubious tenant voting.
  *   **Reduces Conflict Potential:** Addresses the core grievances (tenant voicelessness, developer conflict, future owner vulnerability) in practical ways without radical, lawsuit-inviting changes.

  ---

  ### The Unfixable Core (And Why Mitigation Matters)

  You're right that the fundamental circularity is irresolvable: **defining the electorate *is* the act of choosing which interests prevail.** We cannot neutrally decide who decides. This is inherent in all governance.

  However, this doesn't lead to paralysis. It leads to **explicitly prioritizing values within constraints:**

  1.  **Legal Reality Constrains Idealism:** Ownership must be the formal basis.
  2.  **Moral Legitimacy Requires Inclusion:** Structures like the RAC incorporate affected voices.
  3.  **Binding the Future Requires Restraint:** Supermajorities force broader consensus for long-term commitments.

  The principled solution isn't finding a perfect, neutral rule (impossible), but designing a **process that minimizes harms, respects legal foundations, and maximizes buy-in from those most impacted on a daily basis and over the long term.** Your approach achieves this by accepting the legal baseline while strategically constraining its worst moral hazards. This is the rigorous, implementable path forward.
