answer: |-
  Here’s a rigorous defense of resolute choice against the money-pump argument, addressing your core concerns about preference stability and the distinction from hyperbolic discounting:

  ### **1. The Money-Pump Setup & Resolute Response**
  - **Sequence**: 
    1. Start with A.  
    2. Bookie offers: Trade A for B + pay ε (small fee). *Cyclic preference: A > B → Accepts.*  
    3. Now hold B. Bookie offers: Trade B for C + pay ε. *B > C → Accepts.*  
    4. Now hold C. Bookie offers: Trade C for A + pay ε. *C > A → If accepted, back to A but -3ε.*  

  - **Resolute Agent’s Plan**:  
    At **t₀** (before any trades), the agent evaluates *entire paths*:  
    - Path 1: Accept all trades → End with A - 3ε.  
    - Path 2: Reject all trades → End with A.  
    - Path 3: Accept first two, reject last → End with C - 2ε.  
    Given cyclic preferences, C ≻ A ≻ B ≻ C (loop), but **C - 2ε** is dispreferred to **A** (if ε > 0).  
    → Commits to plan: **Reject all trades** to retain A.  

  ### **2. Why Refusal at a Node Isn’t Preference Change**
  - **Key Distinction**:  
    Resoluteness separates **local pairwise choice** from **global plan evaluation**.  
    - At **t₂** (holding C), the agent *still* prefers C over A *in a binary comparison*.  
    - Yet they refuse the trade C→A+ε because:  
      (a) Their commitment binds them to the *t₀*-chosen plan (retain A),  
      (b) They judge *plan-adherence* as rationally superior to *myopic choice*.  

  - **Analogy: The Lawsuit Gambit**  
    Suppose you prefer settling a lawsuit (S) over trial (T) if forced to choose *now*. But if you commit *in advance* to rejecting settlement offers, you force the plaintiff to drop the suit (D). You prefer D ≻ S ≻ T.  
    - At the settlement node, you still prefer S > T locally.  
    - But refusing S (to get D) isn’t a *preference reversal*: it’s enacting a plan that leverages your future actions to achieve a globally superior outcome.  

  Here, refusing C→A+ε leverages the *absence of future exploitation* to secure A (≻ C - 2ε), even though C ≻ A locally.

  ### **3. Resoluteness vs. Sophistication in Hyperbolic Discounting**
  - **Hyperbolic Discounting (Sophisticated Agent)**:  
    - Preferences *genuinely change* over time: Future rewards are undervalued as they near the present.  
    - Sophistication: At **t₀**, you *predict* your future self’s preferences and choose a plan that "manages" your future selves (e.g., locking away cash to avoid spending).  
    → Preferences are *time-indexed*: Uₜ₊₁(large reward) > Uₜ₊₁(small reward), but Uₜ(small reward) > Uₜ(large reward).  

  - **Resolute Agent with Cyclic Preferences**:  
    - Preferences are **stable and time-invariant**: A ≻ B ≻ C ≻ A holds at all times.  
    - Refusing a trade isn’t because preferences changed, but because:  
      - The agent views **rational choice as plan-relative**, not node-relative.  
      - At **t₀**, they select a plan maximizing outcome *given their cyclic valuations*.  
      - Deviating would *worsen the outcome* (A vs. A - 3ε), violating their own *ex-ante* optimality.  

  ### **4. Why This Isn’t "Patching Irrationality"**
  - **The Charge**: Your colleague claims resoluteness "cheats" by adding incoherence.  
  - **Rebuttal**: Resoluteness is a **meta-rational commitment device** justified by:  
    - **Non-Myopic Rationality**: Rationality requires evaluating *sequences of choices* holistically.  
      - *Principle*: An agent is rational iff they select a *feasible plan* that maximizes utility, then execute it.  
      - Myopic choice violates this by ignoring the causal linkage between decisions.  
    - **Axiomatic Defense** (McClennen):  
      - **Dynamic Consistency**: If you prefer plan P over Q at **t₀**, and P remains feasible at **t₁**, you should stick to P.  
      - **Separability Violation**: Money-pumps assume "separability" (choices depend only on *current* options). Cyclic preferences *require* non-separable evaluation to avoid exploitation.  

  ### **5. Objection: "But They *Prefer* to Deviate at the Node!"**
  - **Response**: True, but this conflates:  
    - **Revealed Preference at Nodes**: At **t₂**, C ≻ A implies trading C for A + ε *would* be chosen *if the node were isolated*.  
    - **Plan-Constrained Choice**: The node *isn’t* isolated; it’s embedded in a sequence where deviating triggers a loss.  
      - The resolute agent *does not evaluate the choice in isolation*. They evaluate it *as part of the t₀ plan*.  
      - Refusing the trade is consistent with their *global* preference for A over C - 2ε.  

  ### **6. Why the Money-Pump Fails Against Resoluteness**
  - **Exploitation Blocked**: The bookie cannot extract infinite fees.  
  - **No Preference Revision Needed**: Cyclic preferences persist, yet no pumping occurs.  
  - **Transitivity Not Vindicated**: Resoluteness shows that *even with cyclic preferences*, agents can avoid Pareto-suboptimal outcomes (A - 3ε ≺ A) via commitment. Transitivity is sufficient but **not necessary** for dynamic rationality.  

  ### **Conclusion: The Case for Resolute Rationality**
  The money-pump assumes rationality is **myopic and separable**. Resoluteness rejects this, arguing that rational agents:  
  1. **Evaluate extended plans** at the outset,  
  2. **Commit to optimal plans** (even if later nodes offer locally preferred deviations),  
  3. **Maintain stable preferences** while recognizing that *choice contexts* are path-dependent.  

  This doesn’t "patch" irrationality—it **redefines rational agency** as inherently plan-based. Cyclic preferences become pragmatically tenable *if* the agent is resolute, proving that transitivity isn’t a strict requirement of practical reason. The burden shifts to the money-pump proponent to show why *myopic* separability is essential to rationality—a claim resoluteness forcefully challenges.  

  **For your seminar**: Press students on whether "rationality" must be node-local (sacrificing global outcomes) or whether commitment can be a rational response to dynamic inconsistency. The heart of the debate is the *scope* of practical reason: Is it about *choices* or *plans*?
