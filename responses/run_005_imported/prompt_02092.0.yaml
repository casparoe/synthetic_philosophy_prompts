  Could you write me a dialogue (~700 words) between two AI safety researchers hashing this out? One thinks a complexity/runtime penalty on the reporter basically solves the direct-translator-vs-human-simulator problem (maybe with some patches), the other thinks it definately fails in the worst case. They should actually engage with each others' strongest moves instead of strawmanning one another, and you don't need to wrap it up with a tidy resolution -- I'd rather see the real disagreement play out than get a neat ending.
