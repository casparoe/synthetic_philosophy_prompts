prompt: |-
  so im a ling PhD student sitting in on a phil of sci seminar as an elective, and I think I've talked myself into a confusion I can't shake. last week was Duhem-Quine underdetermination plus the usual realist replies (IBE, theoretical virtues, etc), and this week the syllabus jumps straight to Quine's indeterminacy of translation (the gavagai stuff in Word and Object) and basically treats it as the same argument redeployed for meaning instead of physics - two translation manuals fit all the evidence, so which one is "right" is undetermined, same structure as two rival theories fitting the same data. but if that's the correct way to see it, shouldn't whatever move blocks underdetermination skepticism about theories also dissolve the gavagai worry? every secondary source I've found just asserts indeterminacy is a "deeper" or "totally different" problem without actually explaining why the underdetermination fixes don't carry over. is there a real argument for that, or is this just underdetermination with extra steps?
reasoning: |-
  Okay, let me try to unpack this user's question. They're a linguistics PhD student attending a philosophy of science seminar. They're confused about the relationship between Duhem-Quine underdetermination and Quine's indeterminacy of translation. Specifically, they see both as having the same structure—two options fitting the same evidence—and wonder why solutions for the first don't apply to the second.

  First, I need to recall both concepts. Duhem-Quine underdetermination is about scientific theories: multiple theories can explain the same data, so choosing between them isn't determined by evidence alone. Realists counter with IBE (inference to the best explanation) and theoretical virtues like simplicity. Quine's indeterminacy of translation, using the gavagai example, shows that multiple translation manuals can fit all behavioral evidence, making the correct translation indeterminate. 

  The user's main point is that if underdetermination can be addressed by IBE and virtues, why not apply the same to translation? Secondary sources claim indeterminacy is deeper but don't explain why. The user suspects it might be underdetermination with extra steps. Their confusion is valid, and I need to clarify the differences.

  Let me break down why the solutions for underdetermination don't work for indeterminacy. First, underdetermination allows that one theory is true, but we can't know which due to insufficient evidence. Realists argue that theoretical virtues help us approximate truth. In contrast, Quine's indeterminacy argues there's no fact of the matter—no single correct translation. It's ontological, not epistemological. 

  Evidence plays different roles. In science, sensory data underdetermine theories, but theories still aim to predict observations. For translation, the evidence is solely behavioral (stimulus conditions). There's no access to mental states or meanings, only behavior. So, while scientific theories can be tested beyond current data, translation manuals can't be, as all evidence is behavioral.

  Theoretical virtues like simplicity are applicable in science for choosing theories but don't point to truth in translation. Quine argues these virtues are pragmatic, not truth-conducive. For example, choosing "rabbit" over "undetached rabbit part" is practical, not because it's correct. 

  Also, the user might be conflating underdetermination (many theories fit data) with indeterminacy (no fact of the matter). The key is whether there's an independent reality to latch onto. Science assumes one true theory; translation doesn't have that. 

  I should check if the user's background in linguistics affects their view. They might expect meaning to be more determinate. Quine's behaviorism rejects mental meanings, so that's a point to emphasize. Also, mentioning Davidson's response about charity in interpretation could add depth, but focus on Quine's argument first.

  In summary, the main differences are: ontological vs. epistemological, the nature of evidence, and the role of theoretical virtues. The user needs to see that while underdetermination is about lack of evidence, indeterminacy denies any fact of the matter beyond behavior. Realist solutions don't apply because there's no truth to approximate in translation.
answer: |-
  You've hit on a profound and genuinely tricky point – one that reveals why Quine's indeterminacy argument is so unsettling and distinct from standard underdetermination. The instinct to see them as structurally similar is spot-on, but the differences are crucial and explain why realist moves against underdetermination *don't* automatically dissolve indeterminacy. Here's the breakdown:

  1.  **The Core Similarity (The Underdetermination Structure):**
      *   **Scientific Theories (Underdetermination):** Multiple empirically adequate theories (T1, T2, ... Tn) can be logically compatible with all possible observational evidence (E).
      *   **Translation Manuals (Indeterminacy):** Multiple translation manuals (M1, M2, ... Mn) can be compatible with all possible behavioral evidence concerning speech dispositions (stimulus meanings, assent/dissent patterns).

  2.  **Why Realist Moves Against Underdetermination Seem Promising for Indeterminacy (Your Point):**
      *   **IBE (Inference to the Best Explanation):** We choose the scientific theory that *best explains* the evidence. Surely, we can choose the translation manual that *best explains* the native's behavior?
      *   **Theoretical Virtues (Simplicity, Coherence, Fecundity, etc.):** We choose the scientific theory exhibiting the best balance of these virtues. Surely, we can choose the translation manual that is simplest, most coherent with the rest of the language, etc.? (E.g., "rabbit" is vastly simpler than "undetached rabbit part" or "rabbit stage").

  3.  **Why Quine Argues These Moves FAIL for Indeterminacy (The "Deeper" Problem):**

      *   **The Nature of the Evidence & What Constitutes "Fitting" It:**
          *   **Science:** Evidence is sensory stimulation/publicly observable events. Theories postulate *unobservable entities/structures* to *explain and predict* this evidence. There's a gap between evidence and theoretical ontology, bridged by explanation.
          *   **Translation:** Evidence is *exhaustively* behavioral dispositions (assent/dissent to sentences under specific stimulus conditions). Translation manuals postulate *meanings* (intensions, references). **Crucially, for Quine, there is *nothing more* to meaning than these dispositions.** The "meaning" *just is* the pattern of dispositions. There is no hidden "meaning fact" *beyond* or *underlying* the behavior to be explained.

      *   **The Target of Indeterminacy: No Fact of the Matter (Ontological, not Epistemological):**
          *   **Underdetermination (Standard View):** This is usually seen as an *epistemological* problem. There *is* one true theory (or a set of empirically equivalent ones sharing the same observational consequences and core ontology - see "Ramsey Sentences"), but our evidence doesn't let us *know* which one it is definitively. IBE and virtues are tools for *epistemic* selection aiming at truth.
          *   **Indeterminacy:** Quine argues this is an *ontological* problem. **There is *no fact of the matter* about which manual is correct.** It's not that we don't know which manual captures the *real* meaning; there *is* no "real" meaning independent of the behavioral dispositions. Meaning is *constituted by* the dispositions, and different manuals systematize these dispositions differently without any single one being uniquely "correct." Choosing "rabbit" over "undetached rabbit part" isn't discovering a truth; it's imposing a pragmatic organization.

      *   **Why IBE Doesn't Apply:**
          *   Explanation requires something *to be explained*. In science, the explanandum is observable phenomena, the explanans is the unobservable theoretical structure.
          *   In translation, **what is there to explain *beyond* the behavioral dispositions themselves?** The dispositions *are* the meaning facts. Postulating "rabbit" as the meaning doesn't *explain* the dispositions any better or worse than postulating "undetached rabbit part" – both systematize *exactly the same behavioral patterns*. Neither explains anything *more* than the other. There's no deeper level for explanation to latch onto. Explanation is redundant because meaning supervenes entirely on behavior.

      *   **Why Theoretical Virtues Don't Point to Truth:**
          *   In science, virtues like simplicity are (arguably, per realists) guides to truth or approximate truth about a mind-independent world.
          *   In translation, virtues like simplicity are **purely pragmatic**. Choosing the manual that uses "rabbit" is *easier for us* because it aligns with our innate perceptual similarity spaces and conceptual scheme. It's more *useful*. But it doesn't mean the native *has* the concept "rabbit" in a way that makes "undetached rabbit part" *false*. Both are equally *adequate* to the *only* facts that exist – the behavioral dispositions. The virtues help us *use* the language, not discover its pre-existing "real" meanings.

      *   **The Analogy Quine Uses (But Don't Confuse With Identity):**
          *   Quine *compares* indeterminacy to underdetermination to highlight the structural similarity in the argument form. However, he immediately emphasizes the key difference: "The indeterminacy of translation is not just an instance of the empirically underdetermined character of physics. To see this, reflect that rival systems of analytical hypotheses [translation manuals]... are compatible with all the same distributions of states and relations over elementary particles. In fact, they are compatible with *all* possible observations, of all sciences, natural and behavioral." (*Word and Object*, §16). The point is that indeterminacy persists *even if we had complete physical knowledge*. Meaning facts don't reduce to or supervene on physical facts in the way theoretical facts in physics (arguably) do.

  4.  **In Short: The Key Distinction**

      *   **Underdetermination (Standard Epistemological View):** Many theories fit *the evidence*, but (probably) only one is *true* about an independent reality. Realist moves try to get us closer to that truth.
      *   **Indeterminacy (Quine's Ontological Claim):** Many manuals fit *all the facts* (behavioral dispositions). There are *no further meaning facts* for one manual to be "true" *about*. The manuals aren't descriptions of hidden realities; they are different ways of organizing the surface. The choice is purely pragmatic, not epistemic. **There is nothing to be right or wrong about beyond adequacy to behavior.**

  **Why Secondary Sources Call it "Deeper":** Underdetermination challenges our *knowledge* of the world. Indeterminacy challenges the very *existence* of determinate meanings as objective entities or facts beyond behavior. It attacks the foundation of semantics itself. Realist strategies against underdetermination presuppose an independent reality to be right or wrong about. Quine argues that in the realm of meaning, *there is no such independent reality* once behavioral dispositions are fixed. That's the radical, "deeper" skepticism.

  **Your Skepticism is Well-Founded:** It *is* structurally similar, and seeing that is key. The brilliance (or perversity) of Quine's argument is showing that this structure, applied to meaning with his behaviorist premise (*meaning just is stimulus meaning/dispositions*), leads to a far more radical conclusion than its application in science. The realist fixes don't carry over because they rely on assumptions (an independent reality for theories to latch onto, explanation as a truth-guiding virtue) that Quine explicitly *denies* hold for the case of meaning. The debate then often shifts to whether Quine's behaviorism about meaning is correct (Davidson, Chomsky, and many linguists/philosophers argue fiercely against it). But *given* Quine's premises, the argument for indeterminacy being distinct and deeper is robust.
