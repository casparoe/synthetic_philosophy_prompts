  ## MEMORANDUM: FACULTY CONDUCT COMMITTEE - CASE RECOMMENDATION & PATH FORWARD

  **TO:** Faculty Conduct Committee Members  
  **FROM:** [Your Name/Title], Philosopher, Faculty Conduct Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Regarding Conduct of Prof. [Colleague's Name] & Proposed Path Forward  

  This memo outlines the Committee's recommendation for addressing the documented conduct incidents involving Prof. [Colleague's Name]. It synthesizes the complex medical, ethical, and procedural considerations presented by this case, recognizing the legitimate concerns on all sides while prioritizing institutional integrity, individual well-being, and a safe, respectful workplace.

  ### I. Case Summary & Key Facts
  1.  **Incidents:** Three documented outbursts post-medical leave (shouting x2, throwing object). All targeted junior staff/faculty.
  2.  **Medical Context:** Prof. [Colleague's Name] returned from leave following a frontal-lobe stroke. A neuropsychological evaluation attributes the outbursts to documented **reduced impulse control** directly linked to the neurological event. Cognitive functions (memory, reasoning) and teaching performance are reportedly unaffected.
  3.  **Colleague's Position:** Acknowledges incidents. States difficulty "catching it in time" due to the neurological impact. Requests handling as a **medical accommodation**.
  4.  **Faculty Code Framework:** Routes cases to either:
      *   **Disciplinary Track:** Focuses on misconduct, potentially leading to dismissal for cause.
      *   **Fitness-for-Duty (FFD) Track:** Suspends discipline pending assessment/treatment to determine ability to perform essential functions safely.
  5.  **Committee Concern:** The observed pattern (targeting only junior individuals) raises questions about retained control for some members, while others note documented selective expression in genuine impulse disorders. The Code lacks explicit guidance when misconduct is plausibly *caused* by a diagnosed medical condition.

  ### II. Ethical & Procedural Considerations
  *   **Medical Reality:** The neuropsychological evaluation provides credible, specific medical causation linking the behavior to an acquired disability. Ignoring this risks discrimination under disability accommodation frameworks.
  *   **Impact & Harm:** Regardless of cause, the behavior created a hostile, intimidating environment for junior colleagues and staff. This harm is real and must be addressed. The university has a duty to provide a safe workplace.
  *   **Procedural Fairness:** The colleague's request for accommodation based on a diagnosed condition merits serious consideration. However, accommodation cannot be unlimited if it fails to mitigate risk or perpetuates harm.
  *   **Pattern of Targeting:** While selective targeting *can* occur in genuine impulse disorders, it understandably fuels skepticism. This pattern must inform risk assessment and mitigation strategies, even if it doesn't definitively prove intentional control *over the outbursts themselves*.
  *   **Institutional Responsibility:** We must balance supporting a colleague experiencing a significant medical event with protecting vulnerable members of our community and upholding standards of professional conduct.

  ### III. Recommended Path: A Hybrid Approach - FFD with Accountability & Harm Mitigation
  **The Committee recommends utilizing the *Fitness-for-Duty (FFD) Track* as the primary procedural framework, augmented by specific, mandatory accountability and harm mitigation measures.** This path acknowledges the medical causation while taking the harm caused and ongoing risk seriously. It avoids the punitive focus of the disciplinary track for *past* incidents directly attributable to the disability, but imposes strict requirements for *future* conduct and remediation.

  #### Rationale for FFD as Primary Framework
  1.  **Medical Causation:** The documented link between the stroke and the impulse control deficit provides a clear medical basis for behavior previously uncharacteristic. Treating this purely as "misconduct" ignores the established disability component.
  2.  **Focus on Future Capacity:** The core question is whether Prof. [Colleague's Name] can perform his essential functions (including collegial interaction) safely *with appropriate accommodation and treatment*. The FFD track is designed to answer this.
  3.  **Treatment Potential:** Impulse control deficits post-stroke can sometimes improve with targeted therapy and strategies. The FFD track mandates pursuing this.

  #### Essential Augmentations: Accountability & Harm Mitigation
  To address the harm caused and manage ongoing risk, the FFD process **must** include the following mandatory components:

  1.  **Immediate Conditional Return:** Prof. [Colleague's Name]'s return to full duties is contingent upon strict adherence to the following plan. Any violation constitutes grounds for immediate shift to the disciplinary track.
  2.  **Mandated Treatment & Monitoring Plan:**
      *   **Neurologist/Neuropsychologist Oversight:** Regular (e.g., monthly) appointments specifically focused on impulse control management strategies. Compliance reports provided to HR/designated FFD officer.
      *   **Occupational Therapy / Behavioral Coaching:** Focused on developing and practicing concrete de-escalation techniques, recognizing triggers, and implementing alternative responses *in the workplace context*. Progress reports required.
      *   **Medication Review (if applicable):** Ongoing assessment of potential pharmacological supports by treating neurologist/psychiatrist.
      *   **FFD Officer:** Designated individual (e.g., in HR or Dean's Office) to receive reports, monitor compliance, and liaise with the committee.
  3.  **Workplace Accommodations & Safeguards:**
      *   **Structured Interactions:** Develop protocols for potentially stressful interactions (e.g., performance reviews of juniors, committee work). This may involve: a third-party observer (agreed upon), pre-meeting agendas, written feedback instead of purely verbal where feasible.
      *   **Trigger Mitigation:** Identify specific high-stress situations (e.g., tight deadlines, complex student issues) and develop proactive avoidance or management strategies with the Chair/Dean.
      *   **Communication Protocol:** Establish a clear, immediate "time-out" mechanism Prof. [Colleague's Name] agrees to use if he feels escalating, and a safe way for others to disengage and report if an incident begins.
  4.  **Explicit Behavioral Contract:** A formal agreement outlining:
      *   Zero tolerance for shouting, throwing objects, or intimidating behavior.
      *   Mandatory participation in the treatment/monitoring plan.
      *   Adherence to workplace safeguards.
      *   Clear consequences: **Any** further verified outburst, regardless of target, will result in immediate suspension and activation of the disciplinary track, where dismissal will be the likely outcome. Past incidents will be considered in this track.
  5.  **Addressing Harm to Affected Colleagues (Independent of Track):**
      *   **Formal Acknowledgment & Apology:** Prof. [Colleague's Name] must issue written apologies, drafted in consultation with HR/Dean's office to ensure appropriateness, to each specifically targeted individual, acknowledging the impact of his actions. *This is non-negotiable and separate from medical causation.*
      *   **Support for Affected Individuals:** Guaranteed, confidential access to counseling services through the university's EAP. Assurance from the Chair/Dean that there will be no retaliation and that concerns will be taken seriously.
      *   **Departmental Climate:** The Chair, in consultation with HR, should actively monitor the climate within the department, particularly among junior faculty and staff, and be prepared to address concerns or lingering fears.

  ### IV. Timeframe & Next Steps
  1.  **Immediate (Next 5 Business Days):** Chair/Dean meets with Prof. [Colleague's Name] to present this path, including the requirement for written apologies and the behavioral contract. FFD Officer designated.
  2.  **Within 10 Business Days:** Prof. [Colleague's Name] provides written apologies (copied to FFD Officer). Initial meetings with neurologist/neuropsychologist and occupational therapist/coach scheduled. Draft behavioral contract and workplace accommodation plan developed by Chair/Dean/HR in consultation with Prof. [Colleague's Name] and his treatment providers.
  3.  **Within 15 Business Days:** Behavioral contract and accommodation plan finalized and signed by Prof. [Colleague's Name], Chair, Dean, and FFD Officer. Treatment/coaching commences.
  4.  **Ongoing Monitoring:** FFD Officer receives monthly compliance/update reports from treatment providers. Chair provides brief monthly updates to FFD Officer on workplace climate (maintaining confidentiality).
  5.  **Formal FFD Review:** At **6 months**, a formal FFD review by the Committee (or designated subset), informed by:
      *   Comprehensive reports from all treatment providers.
      *   Report from FFD Officer on compliance.
      *   Confidential feedback from the Chair on department climate/any incidents.
      *   *This review will determine if the conditional return becomes permanent, if the plan needs modification, or if the disciplinary track must be activated.*

  ### V. Conclusion
  This recommendation seeks a just and practical path forward. It accepts the medical reality of Prof. [Colleague's Name]'s condition and the framework of accommodation, while refusing to minimize the harm done or the absolute necessity of preventing recurrence. The augmentations impose significant accountability and prioritize the safety and well-being of junior colleagues and staff. The behavioral contract provides a clear, objective standard: further outbursts will be treated as disciplinary matters with severe consequences, regardless of the underlying medical context.

  By adopting this hybrid approach, the university demonstrates compassion grounded in medical evidence, upholds its duty to provide a safe and respectful environment for all, and establishes clear boundaries and consequences for future conduct. This path offers Prof. [Colleague's Name] a structured opportunity to manage his condition and continue his contributions, while unequivocally prioritizing the protection of vulnerable members of our community.

  We urge the Committee to support this recommendation at next week's vote.
