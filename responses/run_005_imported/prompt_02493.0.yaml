  I imagine Ghazali might respond in three layers: First, he'd reject the very premise of "randomness" as a real ontological category - since nothing happens without God's direct action. Second, he'd likely interpret quantum events as God exercising particularized will at the subatomic level. Third, he might see the unpredictability as perfect proof against those who attribute power to created things.

