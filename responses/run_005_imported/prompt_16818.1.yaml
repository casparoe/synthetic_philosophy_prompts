prompt: |-
  I spent my career running delay-discounting experiments on pigeons and rats -- classic hyperbolic-discounting stuff, including the version where the animal pecks a key in advance to remove its own future temptation. Retired now, I've been reading philosophy on akrasia and self-binding, which has turned out to be oddly relevant: I'm the community member on my hospital's ethics committee, and we've got a woman with bipolar I who signed a 'Ulysses contract' while stable, requesting involuntary treatment at the first signs of hypomania and stating that her objections in the moment shouldn't count. She's hypomanic now, articulate, and refusing, and argues the document doesn't get to speak for her anymore. Policy says we honor advance directives unless the patient 'currently has decisional capacity,' and hers is genuinely borderline. Some committee members want to just default to 'capacity now settles it,' which I think dodges the real question. Can you draft the short memo I'll bring to Thursday's meeting -- a real recommendation with a timeframe, not a punt -- that takes her present refusal seriously rather then just labeling it akrasia and moving on?
reasoning: |-
  Okay, let me unpack this complex ethics committee case. The user is a retired behavioral researcher with expertise in delay discounting, now serving on a hospital ethics committee facing a dilemma about a bipolar patient's Ulysses contract. 

  Hmm... the core tension here is between respecting the patient's past autonomous decision (made when stable) versus her current refusal (during hypomania). The committee seems tempted to simplify this to a capacity binary, but the user rightly points out that's inadequate. Interesting how their animal research on precommitment strategies directly parallels this human scenario.

  The patient's hypomania complicates everything - she's articulate but her judgment is likely impaired regarding her own condition. Yet her current voice matters. The policy's "decisional capacity" clause becomes dangerously reductive here. I recall similar cases where strictly following capacity assessments led to disastrous outcomes for bipolar patients who later regretted refusing treatment.

  What's needed is a framework that honors both versions of the patient: the forward-thinking self who created the advance directive, and the suffering self who now resists care. The memo should reject false dichotomies while providing concrete clinical guidance. 

  For the recommendation: immediate short-term treatment seems ethically justifiable based on the contract's specific triggers being met. But this must be paired with urgent reassessment - say within 72 hours - to prevent indefinite override of current preferences. The key is framing treatment not as overriding her will, but as enacting her documented values.

  The tone should balance academic rigor (nodding to their research background) with clinical pragmatism. References to hyperbolic discounting could bridge their past work with current ethics, but must stay accessible to committee members without behavioral science backgrounds.
answer: |-
  Here's a concise, ethically rigorous memo draft focused on actionable recommendations for your committee, respecting both the advance directive and the patient's current state:

  ---

  **MEMORANDUM**  
  **To:** Ethics Committee  
  **From:** [Your Name], Community Member  
  **Date:** [Date of Meeting]  
  **Re:** Urgent Recommendation re: Ms. [Initials], Ulysses Contract & Current Refusal  

  ### Key Ethical Conflict  
  Ms. [Initials]’s case presents a conflict between two expressions of autonomy:  
  1. **Past Autonomy:** Her documented, considered request (during euthymia) for intervention at precisely this hypomanic stage, anticipating impaired judgment.  
  2. **Present Expression:** Her current articulate refusal while hypomanic, asserting her "self" has changed.  

  Labeling this solely as "akrasia" (weakness of will) oversimplifies. Bipolar hypomania involves neurocognitive impairment in *predictive judgment* and *risk appraisal*, even when linguistic capacity appears intact. Her contract explicitly anticipated this dissociation.  

  ### Recommendation & Timeframe  
  1. **Honor Advance Directive Immediately:**  
     - Initiate involuntary treatment per the Ulysses contract.  
     - **Rationale:** The contract’s validity hinges on its activation criteria being met (onset of hypomania). Her current decisional capacity, while borderline, is likely impaired in the specific domain the contract addresses: *evaluating the necessity of treatment for mania*. Her documented rationale ("objections in the moment shouldn’t count") directly addresses this impairment.  

  2. **Mandate Reassessment Within 72 Hours:**  
     - Conduct a formal capacity reassessment **after 48-72 hours of initial treatment**.  
     - **Rationale:** This balances urgency with respect for evolving autonomy. Hypomania may resolve rapidly with intervention. If capacity is restored and she *still* refuses treatment after understanding risks, her contemporaneous wishes should prevail, and discharge planning begins. If impairment persists, continue treatment under the directive.  

  ### Why This Approach?  
  - **Avoids Binary "Capacity" Trap:** "Borderline capacity" in bipolar hypomania often reflects islands of intact reasoning amid global impairment in illness insight. The advance directive provides critical context for interpreting this ambiguity.  
  - **Prevents Harm:** Delaying treatment risks escalation to severe mania, causing longer-term autonomy loss (e.g., psychosis, extended hospitalization).  
  - **Upholds Dignity:** Respects her past self’s foresight without permanently silencing her current voice. The 72-hour reassessment ensures her present preferences are re-evaluated urgently.  
  - **Clinical Parallel:** Just as we override a delirious patient’s refusal of life-saving antibiotics (despite "articulate" objections), we can override refusal here based on her pre-identified impaired state.  

  **In short:** Activate the Ulysses contract *now* as she directed, but tie continued involuntary treatment to *reassessment under improved conditions within 72 hours*. This implements her advance directive while taking her current refusal seriously through rapid reevaluation.  

  ---  

  ### Key Strengths of This Approach
  1. **Temporally Grounded:** Forces concrete action (treatment initiation) and rapid follow-up (reassessment), avoiding paralysis.  
  2. **Clinically Nuanced:** Acknowledges hypomania’s fluctuating nature without requiring perfect diagnostic certainty.  
  3. **Ethically Defensible:** Uses the least restrictive alternative *initially* justified by the directive, with a built-in off-ramp if capacity stabilizes.  
  4. **Policy-Compliant:** "Decisional capacity" is interpreted dynamically (per standard psychiatric ethics), not as a static snapshot ignoring the directive’s context.  

  This respects her as both the author of her future and a person experiencing illness—without letting either version of her self be permanently ignored. I urge the committee to endorse this dual-path framework.
