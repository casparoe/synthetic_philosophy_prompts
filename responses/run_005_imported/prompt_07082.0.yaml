  First, I need to unpack the core issues. The co-op's founding principle is equal revenue sharing to avoid favoritism. But now Marisol's popularity on TikTok has created a situation where customers are willing to pay extra for her tours. The key points of contention are whether the premium is a tip for Marisol or payment to the co-op, and how the co-op's charter applies here.

