prompt: |-
  ok so I just joined the policy committee for the domestic violence shelter near me (long story -- a friend needed a place last year, now I volunteer there), and we're stuck on the script staff use when an abuser calls or shows up asking if someone's staying with us. Current policy is basically "lie if it keeps her safe." But our clinical director is catholic and brought up Augustine, who apparently thought an outright lie is never ok even to save a life -- though he was totally fine with staying silent or being deliberately vague, since thats not technically "asserting" a falsehood. Now the committee's split: half want staff to keep flatly denying ("no one by that name lives here"), half want a strict "I can't confirm or deny that" script with zero exceptions.

  Can you draft the short memo I'll bring to next week's meeting? I need one clear recommendation on which script to adopt, reasoning that actually engages the concealment-vs-lying distinction instead of treating it like a technicality, plus an honest version of the strongest argument against whatever you recommend.
