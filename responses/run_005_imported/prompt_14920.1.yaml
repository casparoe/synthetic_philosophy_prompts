answer: |-
  ## MEMORANDUM  
  **TO:** Policy Committee, [Shelter Name]  
  **FROM:** [Your Name], Policy Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommended Script for Abuser Inquiries: Balancing Safety, Ethics & Consistency  

  ### Background & Dilemma
  As discussed, we are revising our protocol for staff responding to abusers inquiring about survivors. The core tension is:  
  1. **Current Practice ("False Denial"):** "No one by that name lives here." (Potential ethical violation per Augustine's prohibition on *asserting* falsehoods).  
  2. **Proposed Alternative ("Strict Non-Confirmation"):** "I cannot confirm or deny that information." (Avoids lying but may signal shelter involvement).  

  After thorough analysis, **I recommend adopting the strict "I cannot confirm or deny that" script for all abuser inquiries.**  

  ---

  ### Rationale for "Strict Non-Confirmation"  

  1. **Ethical Integrity & Philosophical Consistency:**  
     Augustine (and later Aquinas) distinguished between *lying* (asserting a falsehood) and *concealment* (refusing to reveal truth). "I cannot confirm or deny" is concealment—it withholds truth without asserting falsehood. **This respects the ethical boundary against lying** while fulfilling our duty to protect life. "False denial" actively creates deception; non-confirmation passively preserves confidentiality.  

  2. **Operational Safety & Predictability:**  
     *   **No Judgment Calls:** Staff never decide *when* lying is "justified," eliminating risky real-time ethical calculations during high-stress interactions.  
     *   **Legal/Reputational Protection:** False denials could expose staff/shelter to legal liability (e.g., defamation) if challenged. Non-confirmation is legally defensible.  
     *   **Consistency = Security:** Abusers cannot exploit inconsistencies. If one staff member lies and another doesn’t, it reveals patterns. Uniform non-confirmation is a security feature.  

  3. **Alignment with Best Practices:**  
     National coalitions (NNEDV, RAINN) and leading shelters universally advise *against* false denials, advocating for non-committal phrases like "We don’t provide client information" or "I have no information for you."  

  4. **Survivor-Centric Focus:**  
     The priority is *survivor safety*, not managing an abuser’s expectations. Non-confirmation denies abusers any actionable intelligence (true OR false), forcing them to disengage.  

  ---

  ### Strongest Argument Against This Recommendation  
  **"Strict non-confirmation may inadvertently signal to a suspicious abuser that the survivor *is* present, potentially escalating risk if they interpret vagueness as evasion."**  

  *   **Why it’s compelling:** Abusers often operate on control and intuition. A rehearsed, legalistic response ("can’t confirm or deny") might feel unnatural compared to a simple "no," raising suspicion. In cases where the abuser has strong circumstantial evidence (e.g., saw the survivor enter), non-confirmation could functionally confirm their suspicion, leading them to stalk the shelter or retaliate against the survivor elsewhere. False denial *might* create plausible doubt in such high-risk moments.  

  ---

  ### Why This Counterargument Does Not Outweigh the Recommendation  
  1. **False Denial Offers False Security:** If an abuser discovers the lie (e.g., via surveillance, coercion of others, or accidental disclosure), trust in the shelter is destroyed, and retaliation becomes *more* likely. Non-confirmation never creates this explosive liability.  
  2. **Risk is Mitigated by Training:** Staff can be trained to deliver non-confirmation neutrally and terminate calls/visits swiftly. Protocols for escalating suspicious abusers to security/police are more effective than ad-hoc lying.  
  3. **The Slippery Slope:** Endorsing "ethical lies" creates ambiguity. Where do we draw the line? What *other* lies are permissible? Non-confirmation establishes a bright, sustainable ethical and operational standard.  

  ---

  ### Recommended Script & Protocol  
  **For ALL inquiries by potential abusers (call or in-person):**  
  > *"I'm sorry, but for the safety and privacy of everyone we serve, we cannot confirm or deny whether anyone is staying here. I have no information for you. Have a good day."*  
  > *(Hang up or walk away immediately. Document the interaction per security protocols.)*  

  **Critical Next Steps:**  
  1. **Staff Training:** Role-play delivery to sound routine and unflustered. Emphasize immediate disengagement.  
  2. **Security Coordination:** Ensure staff can instantly alert security for in-person inquiries.  
  3. **Survivor Education:** Inform survivors that the shelter *will not* disclose their presence, even via denial.  

  ---

  ### Conclusion  
  The "cannot confirm or deny" script upholds our ethical duty to avoid falsehoods while maximizing operational safety through consistency and legal defensibility. It prioritizes survivor protection by denying abusers information *without* creating the unique risks inherent in institutionalized lying. While no approach is risk-free, this strategy offers the most principled, sustainable, and security-focused path forward.  

  **Recommendation:** Adopt the strict non-confirmation script as universal policy.  

  Respectfully submitted for discussion.
