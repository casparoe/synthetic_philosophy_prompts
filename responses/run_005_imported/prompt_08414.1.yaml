answer: |-
  Here’s a eulogy that honors your brother’s courage while honoring the unresolved tension he carried—written to resonate with both his rowing crew and his philosophy friends, without reducing him to a simple narrative:

  ---

  **For [Brother’s Name]**  
  *Delivered with love, by [Your Name]*

  Two weeks ago, my brother saw a child in the water. Without hesitation, he went in. He got her out. And in doing so, he gave his life. That’s the stark truth. Many of you here—his fellow firefighters, his rowing brothers and sisters—know exactly the courage that took. You’ve trained for moments like that. You understand the river’s pull, the speed of a current, the instinct to act. In his final moments, he was utterly, magnificently, the hero you see him as. And he *is* that hero.

  But if you knew him deeply—like his friends from late-night philosophy debates, or like our family did—you also know that moment was layered with something else. It was the culmination of a question that haunted him for years.

  Ever since college, he wrestled with an idea by the philosopher Peter Singer: If you saw a child drowning right in front of you, you wouldn’t hesitate to ruin your clothes, wade in, and save them. So why, Singer asks, do we hesitate to sacrifice far less to save children dying unseen, halfway around the world? That question never left my brother. It wasn’t academic to him. It was a moral weight he carried. He felt the tension between what we *can* do and what we *actually* do. Between the child in front of us and the child out of sight. He felt the gap deeply, personally, and it troubled him. He hadn't "solved" it. He lived in the unease of that question.

  On that riverbank two weeks ago, there was no gap for him. There was no hesitation. There was only a child *right there*, in need. He didn’t stop to calculate, to philosophize, to weigh the cost against some unseen other. He acted with the pure, selfless instinct you all witnessed in him—the rower’s drive, the firefighter’s courage, the innate decency that was simply who he was.

  That’s the paradox he embodies for us now:  
  **He was tormented by the children he couldn’t see, but he gave everything for the one he could.**

  He didn’t resolve Singer’s pond. He *lived* it. In the moment of ultimate testing, the abstract became concrete. The distant question became immediate action. The weight he carried didn’t paralyze him; it propelled him *into* the water.

  So, how do we honor him? Not by flattening him into a simple story, though his bravery *was* breathtakingly clear. Not by turning this into a lecture, though his mind wrestled with profound ideas. We honor him by holding both truths together:

  1.  **He was a hero in the truest sense:** He saw danger, saw need, and acted with fearless compassion. He saved a life.
  2.  **His heroism was born from a deep, unresolved ache:** An ache for a world where suffering exists just beyond our sight, and a relentless belief that we *must* do better, even when the scale of it feels overwhelming.

  He wondered if he wasn’t doing enough for the children he couldn’t see. Let there be no doubt: for the child right in front of him, he gave absolutely everything. He lived the hardest part of the philosophy that challenged him. He bridged the gap with his own life.

  In the end, the river that took him was the same river he rowed on with such joy and strength. The current he fought that day was the same current he’d challenged alongside you all in his boat. His love for that water, and his instinct to protect someone in its grasp, defined him.

  He leaves us with a challenge, not neatly packaged, but lived in the raw tension he carried: To see the need right in front of us, and act. To feel the weight of the unseen suffering, and *still* find ways to act. To live with the uncomfortable questions, and let them move us towards courage, not despair.

  He didn’t find perfect peace with the world’s injustice. But in his final, defining moment, he found perfect clarity in his purpose: to help. To save. To go in.

  That’s how he lived. That’s how he died. That’s the profound, complicated, beautiful truth of who he was. We will miss his strength, his fierce mind, his uneasy heart, and his incredible courage—always.

  ---

  **Key elements for your delivery:**

  *   **Pace & Tone:** Speak slowly, especially during the heavier philosophical parts. Ground it in warmth and personal love.
  *   **"You" Sections:** Directly address the firefighters/rowers ("You’ve trained for moments like that...") and the philosophy friends ("If you knew him deeply...") to make each group feel seen.
  *   **The Paradox Statement:** Emphasize: **"He was tormented by the children he couldn’t see, but he gave everything for the one he could."** This is the core.
  *   **The Challenge:** Frame his legacy as continuing to wrestle with compassion in action, not having answers.
  *   **End on Love:** Conclude firmly on missing *him* – his specific qualities – bringing it back to the personal.

  This acknowledges the intellectual struggle without lecturing, honors the heroism without simplification, and offers a unifying truth about his character: a deep, active compassion that drove him, even amidst unresolved questions. It lets the different people present see the facets they connected with, held together by the whole person he was.
