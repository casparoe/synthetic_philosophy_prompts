  The user explicitly asks for a brand-new example of undermining that's not the standard coin toss or radioactive decay scenarios. They want something concrete, vivid, and different—maybe real-world-ish or a toy scenario—where an agent knows the objective chance of an event E but then learns some future proposition H that rationally shifts their credence away from that chance. They also want a walkthrough of why the Principal Principle fails here and whether the New Principle fixes it. 

  Hmm, the challenge is to avoid the usual tropes. Coin tosses are overdone. Radioactive decay is too similar. Need something with a different flavor. What about... weather patterns? Climate? Or maybe something biological? Epidemiology could work—disease spread feels tangible. Let's develop that. 

  Imagine a novel virus emerging. The Humean mosaic includes all infection events across time. The objective chance of an early case (Event E) depends on the ultimate statistical distribution of the outbreak. But if the agent later learns that the outbreak fizzles out quickly (Proposition H), that undermines the high initial chance assignment because the overall pattern no longer supports it. 

  This feels fresh. Viruses have chaotic spread, initial clusters, and unpredictable fade-outs—perfect for illustrating how future outcomes retroactively alter chance interpretations. Plus, it's post-COVID; people get it. 

  Now to build the technical bits: 
