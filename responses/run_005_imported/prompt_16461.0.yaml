  ### The Bigger Thing They're Missing
  **The conflict stems from two irreconcilable interpretations of probability:**  
  - **Halvers** (Marco) prioritize *temporal external reality*: The coin is fair *before* any wakings, and waking provides no new coin-information. Probability = 1/2.  
  - **Thirders** (Tessa) prioritize *indexical self-location*: Upon waking, Beauty’s ignorance about "which awakening now?" creates new uncertainty, proportional to possible observer-moments. Probability = 1/3.  

  **Key oversight:** Both sides assume "probability" is univocal here, but the puzzle reveals a schism between **objective chance** (coin = 1/2) and **evidential credence** (centered in an awakening). The deeper issue is whether self-locating uncertainty ("Am I in the first or second tails waking?") should update beliefs about non-indexical facts (the coin). Philosophers remain split, proving the rabbit hole has no bottom!  

  *(Note: In contemporary decision theory, most formal models favor the thirder position (1/3) due to consistency across betting scenarios, but halfer intuitions persist.)*
