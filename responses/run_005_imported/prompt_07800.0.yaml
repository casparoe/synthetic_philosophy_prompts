  so in my metaphysics seminar we've been on causation by omission and it's kind of messing with my head. on lewis's counterfactual view, a gardener's failure to water her plant counts as a cause of its death (since if she'd watered it, it wouldnt have died) — but that same logic seems to make literally everyone else on earth who also didnt water it a "cause" too (the profligacy problem). beebee's fix is to just deny that omissions are ever genuine causes at all, while other people try to rescue omissive causation by saying only omissions that violate some norm or expectation actually count. i can't stop thinking about how this maps onto the law, where tort/crim law generally wont hold you liable for an omission unless you had a pre-existing duty (the misfeasance vs nonfeasance thing, no general duty to rescue, etc). so what are the most important implications of this metaphysical disagreement (lewis vs beebee vs the norm-based folks) for that legal doctrine — does it actually vindicate the law's duty-based line, or is the law doing something totally orthogonal to whatever's metaphysically going on? genuinely not sure how much weight the metaphysics should even carry here
