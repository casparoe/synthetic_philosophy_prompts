  Breaking it down: 
  - In ordinary ambiguity, disambiguating is just gathering more instances within the same referential framework. 
  - But for Quine, the framework itself is uncheckable because any test assumes prior referential mappings (via analytical hypotheses). 
  - Proxy functions then formalize how all possible evidence maps equally to incompatible ontologies. 

  I must emphasize the circularity: assent/dissent patterns can be reinterpreted to preserve any ontology. If the user asks "Is this gavagai?" while pointing to a rabbit leg, the native's "no" could mean either "That's not a whole rabbit" (rabbit ontology) or "That's not rabbit-stage fusion" (temporal parts ontology), depending on how we initially mapped "gavagai." There's no neutral way to design a test that doesn’t presuppose the very reference scheme we're testing.

  The user might still protest: "But what about pointing to the same rabbit over time?" Here, Quine would say temporal stages could explain that data too—each pointing is to a new stage, and "same gavagai" just means temporal counterparthood. The evidence fits multiple interpretations because reference isn't fixed by stimuli alone; it's part of a holistic web.

  Finally, I should contrast this with underdetermination in physics (e.g., Newton vs. Einstein on gravity). There, we assume the terms share referents (mass, force), so better data eventually favors one theory. In indeterminacy, the referents themselves are in flux—no shared "mass" to compare. That’s the fancier clothing Quine tailors. 

