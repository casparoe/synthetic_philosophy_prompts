answer: |-
  ## The Razor's Edge: Can Maximizing Consequentialism Tolerate Supererogation?

  The persistent debate surrounding Peter Singer's drowning child argument often fixates on calibrating the *degree* of sacrifice demanded by morality. Yet, as you astutely observe, the more profound challenge lies deeper: **does the relentless logic of maximizing act consequentialism (MAC) inherently dissolve the very concept of supererogation?** If the obligatory act *just is* the impartially best available act, then any act praised as "above and beyond duty" must either be secretly obligatory (if it *is* the best) or, if it isn't the best, perhaps even *wrong* for falling short. The saintly doctor staying in the plague city or the heroic soldier diving on the grenade seem to vanish into the category of strict duty under MAC's bright, demanding light. Let's dissect whether supererogation can survive this logic, examining the proposed escapes and the hard-nosed alternative.

  **The Core Tension: Maximization vs. The Extra Mile**

  Maximizing Act Consequentialism (MAC) holds:
  1.  **Rightness:** An act is morally right iff its outcome is at least as impartially good as that of any other available alternative.
  2.  **Obligation:** One is morally obligated to perform a right act (and only a right act, if there are multiple optimific options).
  3.  **Praiseworthiness:** Performing a right act is praiseworthy, but crucially, *only* performing a right act is morally permissible.

  Supererogation, however, requires:
  1.  **Permissibility:** The supererogatory act is morally permissible (not wrong).
  2.  **Non-Obligation:** It is *not* morally obligatory.
  3.  **Special Praiseworthiness:** It involves significant sacrifice or effort beyond what is normally expected or required, meriting distinct and heightened praise.

  The conflict is stark: MAC dictates that *only* the optimal act(s) are permissible. Any non-optimal act is, by definition, wrong. Therefore, any act praised as supererogatory must *be* optimal to be permissible. But if it's optimal, it's obligatory. Where, then, is the space for the permissible, non-obligatory, yet specially praiseworthy act? The grenade-smothering soldier *must* be doing their duty, however extreme; the plague-staying doctor *must* be fulfilling a requirement, however personally devastating. Supererogation seems illusory.

  Can MAC accommodate this? Let's examine the contenders.

  **1. Satisficing Consequentialism (Slote): The "Good Enough" Threshold**

  *   **The Move:** Michael Slote proposes abandoning maximization. An act is right if its outcome is "good enough" relative to the available alternatives, even if a better outcome exists. A threshold of acceptability is set (though defining it precisely is notoriously difficult). This creates a zone of permissibility above the threshold but below the optimum.
  *   **Creating Space for Supererogation:** Acts within the "good enough" zone are permissible but not obligatory (one could choose a less good but still acceptable act). Sacrificing *beyond* the threshold to achieve the *optimal* outcome – like the soldier diving on the grenade when holding a defensive position was already "good enough" to save most of the platoon – becomes supererogatory. It's permissible to do less, but specially praiseworthy to do the best.
  *   **Why it (Probably) Doesn't Work for MAC:**
      *   **Abandons Core Maximization:** This is a fundamental rejection of MAC, not an accommodation. MAC is defined by its *maximizing* imperative. Satisficing replaces "best" with "sufficiently good."
      *   **Arbitrariness:** Defining the "good enough" threshold is deeply problematic. Why is *this* level of sacrifice the limit of duty? Slote's threshold risks appearing arbitrary or merely codifying conventional expectations, losing the objective force of consequentialism. Kagan's critique bites hard here: if a slightly better outcome is achievable with only slightly more sacrifice, why isn't *that* obligatory? The threshold seems unstable.
      *   **Collapse Risk:** Under pressure, the satisficing threshold often gets pulled towards the optimum. If saving 10 lives is optimal and saving 9 is "good enough," but the cost of saving the 10th is minimal, failing to save it seems wrong, pushing the threshold up. This dynamic threatens to erode the space for supererogation back into duty.

  **2. Agent-Centered Prerogatives (Scheffler): Weighting the Self**

  *   **The Move:** Samuel Scheffler introduces agent-centered prerogatives into a broadly consequentialist framework. Agents are rationally *permitted* (but not required) to give *some* extra weight to their own interests, projects, and commitments when calculating the overall "cost" of an action. This means an agent can permissibly choose an act that is *impartially suboptimal* if the personal cost of the optimal act is too high relative to the marginal impartial gain, factoring in their permitted self-bias.
  *   **Creating Space for Supererogation:** The permissible zone now includes acts that are impartially suboptimal but fall within the agent's prerogative. Supererogation occurs when an agent *waives* their prerogative and performs the impartially optimal act despite the high personal cost. The plague doctor who *could* permissibly leave (invoking the prerogative due to the immense personal sacrifice) but chooses to stay is performing a supererogatory act. They go beyond what they are *required* to do (which allows for self-favoring) and do the impartially best thing.
  *   **Why it Might Work (But Strains MAC):**
      *   **Preserves Maximization (Sort Of):** The *impartially* optimal act is still identified. The framework retains a core consequentialist structure evaluating outcomes. Prerogatives carve out permissions *around* the optimum.
      *   **Intuitive Appeal:** It captures the sense that we aren't *always* required to sacrifice our deepest projects for marginal impartial gains. It explains why the doctor leaving isn't *wrong*, but staying is saintly.
      *   **The Challenge for Pure MAC:**
          *   **Source of Prerogatives:** Scheffler grounds prerogatives in the *rationality* of personal agency, not directly in consequentialist value maximization. This feels like an external graft onto MAC. *Why* is this weighting permitted if the fundamental imperative is impartial maximization? Consequentialism traditionally locates value *in states of affairs*, not in the agent's subjective perspective on sacrifice. Scheffler's move requires a significant concession: consequentialism must incorporate a non-consequentialist element (agent-relative permissions) to be plausible.
          *   **Quantification:** How much extra weight is permitted? Without clear limits, the prerogative could justify excessive self-favoring, undermining the demandingness MAC is known for.

  **3. Dual-Ranking Act Consequentialism (Portmore): Two Lenses on Value**

  *   **The Move:** Douglas Portmore proposes a more integrated approach. He suggests acts should be evaluated through *two* rankings:
      1.  **Agent-Neutral Reasons (ANR):** Based on the act's overall impartial value.
      2.  **Agent-Relative Reasons (ARR):** Based on the act's value *from the agent's perspective*, incorporating their personal commitments and the *costs to them*.
      The *deontic status* (right/wrong) of an act is determined by the *balance* of these two sets of reasons. An act is wrong only if the agent has *decisive* reason, all things considered (weighing both ANR and ARR), not to perform it. Crucially, ARR can make it permissible *not* to do the impartially optimal act.
  *   **Creating Space for Supererogation:** An act can be impartially optimal (maximizes ANR) but involve such high personal costs that the ARR *against* doing it are very strong. Performing it might still be *permissible* (if the ANR are strong enough), but *not* obligatory, because the agent doesn't have decisive *all-things-considered* reason to perform it – the ARR provide a sufficient countervailing reason. Choosing to perform the impartially optimal act despite the strong ARR against it is supererogatory. The soldier diving on the grenade maximizes ANR (saves many lives) but involves the strongest possible ARR against it (death). They have decisive ARR *not* to do it. Doing it anyway is supererogatory – permissible, not obligatory (due to the overwhelming ARR), and supremely praiseworthy.
  *   **Why it's the Most Promising Internal Accommodation:**
      *   **Consequentialist Structure:** Value is still fundamental. Reasons stem from the consequences of acts, just categorized as agent-neutral or agent-relative.
      *   **Integrated Permissions:** Permissions arise organically from the *interplay* of the two types of value-based reasons within the framework, rather than being grafted on top like Scheffler's prerogatives. The "cost to the agent" directly generates ARR that factor into the deontic calculus.
      *   **Accommodates Intuitions:** It cleanly handles the hero/saint cases. The plague doctor has strong ANR to stay (save lives) and strong ARR to leave (survival, family). Staying is likely permissible (if ANR > ARR) but not obligatory (because ARR provide sufficient reason *not* to stay). Choosing to stay is supererogatory.
  *   **The Catch:**
      *   **Redefining Consequentialism?** Critics argue this stretches "consequentialism" beyond recognition. The core doctrine is often understood as defining rightness *solely* by impartial goodness of outcomes. Portmore effectively redefines the "good" that determines rightness to include an agent-relative component influencing permissibility. It's consequentialism *broadly construed*, but arguably abandons the *purely agent-neutral* maximizing imperative of classic MAC.
      *   **Defining ARR:** The nature and source of agent-relative *reasons* within a consequentialist ontology need careful justification. Are they reducible to agent-neutral value in some complex way, or truly irreducible?

  **4. The Hard-Nosed Alternative (Kagan): Supererogation as Moral Illusion**

  *   **The Move:** Shelly Kagan confronts the tension head-on. He argues that our strong intuitions about supererogation are simply mistaken. MAC is correct: we *are* obligated to perform the optimal act. What we call "supererogatory" is, in fact, just plain obligatory, however demanding. The grenade dive *is* the soldier's duty. The doctor *must* stay. Our resistance stems from psychological limitations, selfishness, or the underdeveloped state of conventional morality, which systematically underestimates our true obligations.
  *   **Defending the Move:**
      *   **Internal Consistency:** Kagan's view is the most internally consistent with pure, unadulterated MAC. It embraces the demandingness without apology.
      *   **Debunking Intuitions:** He argues intuitions about excessive demandingness are unreliable and often self-serving. The history of morality shows expanding circles of obligation once deemed too demanding (abolitionism, universal suffrage).
      *   **The Slippery Slope:** He uses the Singer argument effectively: if saving the drowning child is obligatory (low cost/high gain), consistency demands similar obligations in analogous distant-need cases (moderate cost/high gain), pushing the boundary of duty outward significantly.
  *   **The Cost:**
      *   **Radical Revisionism:** It requires rejecting deeply held, widely shared moral intuitions about the limits of obligation and the genuine heroism of extreme sacrifice. Most find it deeply implausible that *everyone* is morally *required* to be a saint or a hero whenever it's optimal.
      *   **Psychological Implausibility:** A morality that demands constant, extreme self-sacrifice may be self-defeating, leading to burnout, resentment, and ultimately *less* good being done. It seems to ignore the moral value of personal integrity, projects, and relationships except insofar as they impartially maximize value.
      *   **Loss of a Meaningful Category:** It eliminates the conceptual tool of supererogation, flattening the moral landscape. All praiseworthy acts collapse into duty, leaving no distinct space for extraordinary, optional virtue.

  **The Verdict: Maximization Must Bend**

  After engaging seriously with these moves, the conclusion is clear: **Pure, unmodified maximizing act consequentialism cannot coherently accommodate a genuine, non-illusory category of supererogation.** Its logic is too relentless. The optimal act absorbs all permissibility and obligation, leaving no conceptual room for the specially praiseworthy "extra mile."

  *   **Slote's Satisficing:** Abandons maximization entirely. While it creates space for supererogation, it does so by replacing MAC's core tenet and struggles with arbitrariness and potential collapse. It's not an accommodation *of* MAC; it's a rejection.
  *   **Scheffler's Prerogatives & Portmore's Dual-Ranking:** These offer the most plausible paths *towards* accommodating supererogation within a framework that *retains consequentialism as its foundation*. However, they succeed precisely by **modifying the pure maximizing principle.**
      *   Scheffler injects an external, non-consequentialist element (rational prerogatives) to create permissions.
      *   Portmore integrates agent-relative value *into* the determination of permissibility, effectively redefining the "good" that consequentialism maximizes in the deontic context. Rightness is no longer defined *solely* by maximizing agent-neutral value.
  *   **Kagan's Hard Line:** Preserves pure MAC by sacrificing supererogation entirely, demanding we reconceptualize heroism as duty. While logically consistent, the cost in intuitive plausibility and psychological realism is prohibitively high for most, rendering morality alienating and potentially counterproductive.

  **Therefore, supererogation survives, but only if maximizing consequentialism surrenders its purity.** Portmore's dual-ranking approach offers the most sophisticated and integrated solution, successfully generating a space for supererogation by building agent-relative reasons *into* the consequentialist calculus of permissibility. Scheffler's prerogatives provide a less integrated but still viable route. Both, however, concede that **preserving the distinct, praiseworthy category of the supererogatory requires acknowledging that the right act isn't always the impartially optimal act, and that agents have legitimate, value-based reasons (rooted in their own perspective) that can permissibly override the demands of pure impartial maximization in defining obligation.** The soldier's dive and the doctor's stay remain genuinely supererogatory – permissible, non-obligatory, and supremely praiseworthy – not because they are less than optimal, but because the cost *to the agent*, understood as generating significant agent-relative reasons against the act, means doing the optimal act isn't strictly demanded. Morality, even consequentialist morality, allows room for the extraordinary act that goes beyond what it can rightfully require.
