prompt: |-
  Never took a philosophy class in my life, but retirement's given me time to read, and lately I've been on a decision-theory kick. Something's bugging me that nobody seems to actually adress head on.

  I spent my career as a population geneticist, and there's a classic bit of theory there: in a fluctuating environment, selection favors whichever genotype has the higher *geometric* mean fitness across generations, not the higher arithmetic mean -- a lineage can have a great arithmetic mean fitness and still go extinct with probability 1 if the variance is high enough, because what accumulates over generations is the product of fitnesses, not their sum. Its the whole logic behind bet-hedging traits, like some desert annuals only letting a fraction of their seeds germinate in any given year, so one bad year can't wipe out the whole lineage.

  Now I keep running into the Kelly criterion and this "geometric rationality" / ergodicity-economics stuff (Ole Peters and that crowd), and it's obviously the same math transplanted into betting: maximize expected log wealth instead of expected wealth. Fine so far. But in the biology case, "geometric mean wins" is just a descriptive fact about what happens to survive, no different in kind from water flowing downhill. The decision theorists want that same math to spit out something normative -- that maximizing expected log wealth is what a rational person ought to do, even for a bet they'll only ever face once. Is that actually a legitimate move, or is "geometric rationality" just riding on the biology analogy to sneak an ought out of an is? And please don't just answer "log utility is concave, that's risk-aversion" -- that dodges the point, since the whole claim on offer is that this is supposed to be something more than a repackaged utility function.
reasoning: |-
  Okay, let me unpack this user's question. They're a retired population geneticist diving into decision theory, noticing a parallel between geometric mean fitness in biology and the Kelly criterion in economics. Their core concern is whether transferring this math from descriptive biology to normative rationality is valid.

  First, I need to recognize their expertise. As a population geneticist, they deeply understand the biological context - how geometric mean fitness determines survival in fluctuating environments. That's crucial background. Their analogy to desert annuals' bet-hedging shows they grasp the evolutionary logic.

  The user's frustration is palpable. They've encountered decision theorists claiming maximizing expected log wealth isn't just descriptively useful but normatively necessary - even for one-off decisions. And they're suspicious this might be smuggling biological "is" into rational "ought". They explicitly reject the standard risk-aversion explanation, wanting deeper philosophical engagement.

  Hmm... this requires careful dissection. The biological case is indeed purely descriptive: lineages either survive or don't based on multiplicative processes. But human rationality involves conscious choice. We must distinguish between:
  - What survives (biology)
  - What we should choose (rationality)

  The user's sharpest point is about single bets. In biology, bet-hedging evolves precisely because there are multiple generations. But Peters' ergodicity economics argues that even for one bet, time-averaging matters if we consider all possible parallel universes. That's where the normative leap happens - and where I suspect the user's skepticism lies.

  I recall Peters frames repeated bets as examining one path through time, while a single bet samples many parallel paths. But this relies on controversial metaphysical assumptions about probability. Is the ensemble of parallel universes real or just a modeling device?

  The user would appreciate concrete examples. Consider two bets:
  A) 50% chance of $50, 50% of $100 → arithmetic mean $75
  B) Certain $74.99

  Kelly would reject B for A, but most people would take the sure thing. Is that irrational? Only if we accept Peters' ensemble ontology. Without it, the geometric mean argument weakens significantly.

  Also worth noting: Kelly optimization assumes perfect knowledge of probabilities - rare in real life. And real humans have nonlinear utility for money (losing everything hurts more than gaining everything helps). The user knows this but wants the pure logic exposed.

  Ultimately the normative claim rests on whether we accept that rationality requires optimizing over possible worlds rather than actual outcomes. That's not math - it's philosophy. The biology analogy is suggestive but not conclusive. I should emphasize this boundary while acknowledging why the analogy feels compelling.
answer: |-
  You've zeroed in on the core philosophical tension brilliantly. Your background in population genetics gives you a razor-sharp lens to see the potential sleight-of-hand. Let's dissect this, separating the *is* (biology) from the *ought* (rationality):

  1.  **The Descriptive "Is" (Biology): Undeniable**
      *   You're absolutely correct: In iterated multiplicative processes (like lineage survival or compounded wealth), **long-term growth is dominated by the geometric mean.** This is a mathematical inevitability.
      *   Lineages/betting strategies with higher geometric mean fitness/growth *will* dominate those with lower geometric mean *over the long run*, even if the latter has a higher arithmetic mean. Extinction probability approaches 1 for the lower geometric mean strategy.
      *   This is a *consequence* of the multiplicative process. It's descriptive of what *happens* in the system. Water flows downhill.

  2.  **The Normative "Ought" (Decision Theory): The Claim & The Tension**
      *   Proponents of "geometric rationality" or "ergodicity economics" (Peters et al.) argue that **rational agents *ought* to maximize the expected logarithm of wealth (growth rate) *even for a single, non-repeated decision*.** This is the crucial, controversial leap.
      *   Their core argument rests on "ergodicity breaking":
          *   In an *ergodic* system, time averages (what happens to one system over long time) equal ensemble averages (what happens across many identical systems at one time). Wealth growth under additive expectations (arithmetic mean) is ergodic.
          *   Wealth growth under multiplicative dynamics (compounding) is *non-ergodic*. The time average (your personal growth over time) does *not* equal the ensemble average (the average outcome across many parallel agents making the same bet once).
          *   Therefore, they argue, optimizing the ensemble average (expected wealth) is irrational for an individual experiencing the time average. You must optimize the growth rate (expected log wealth) to align with your individual long-term outcome.

  3.  **The Legitimacy of the Move: Critiques & Why It's Not Just Repackaged Utility**
      *   **The Single Bet Problem:** This is your core objection, and it's powerful. In biology, bet-hedging evolves *because* there *are* multiple generations. The geometric mean *matters* descriptively *because* of iteration. For a single, unrepeated bet:
          *   **Ensemble vs. Individual:** Peters argues that even a "single" bet should be viewed as sampling from an ensemble of possible worlds. Maximizing expected log wealth maximizes your growth rate *across this ensemble*. He contends this *is* the rational choice for the individual inhabiting *one* of these worlds, precisely *because* the process is non-ergodic. Your outcome *is* a sample from this ensemble.
          *   **Critique:** Opponents argue this "ensemble of possible worlds" perspective is metaphysical overreach for a single decision. *Your* actual experience is one outcome. Maximizing expected wealth (arithmetic mean) *does* maximize the average outcome *across the ensemble* and represents the fair value of the bet. If you only face the bet *once*, why *should* you care about the geometric mean across hypothetical parallel universes? The biological necessity only kicks in with iteration *in your timeline*. The normative claim for a single bet relies heavily on accepting this ensemble ontology as fundamental to rationality.
      *   **Is it Just Repackaged Utility?** You're right to reject the glib "it's just concave utility" answer. Proponents argue it's fundamentally different:
          *   **Derived vs. Assumed:** Geometric rationality *derives* the "log utility" function from the structure of the multiplicative process (non-ergodicity) and the goal of long-term survival/growth. It claims this is the *objectively correct* utility function for multiplicative wealth dynamics, not a subjective preference. Standard utility theory *starts* by *assuming* a concave utility function representing risk aversion. Geometric rationality claims to *explain why* that concavity (specifically log) is rational for wealth.
          *   **The "More Than" Claim:** The "something more" is the claim of **objectivity based on system dynamics.** They argue it's not *just* a preference; it's the *rationally mandated* strategy given the mathematical nature of multiplicative growth and non-ergodicity. It's presented as discovering a law of rational choice in specific environments, analogous to the biological law of survival.

  4.  **Is it a Legitimate Normative Move? A Nuanced Answer**
      *   **It's Not Illegitimate, But It's Highly Contested and Context-Dependent:**
          *   **For Repeated Bets/Long-Term Growth:** It's exceptionally strong, bordering on undeniable as a normative rule *if* your goal is maximizing long-term compounded wealth and avoiding ruin. Kelly is the gold standard here. The biology analogy holds perfectly.
          *   **For Truly Single, High-Consequence, Non-Repeatable Bets:** This is the battleground.
              *   **Proponents:** Argue the ensemble perspective *is* the correct normative framework. Ignoring the geometric mean/risk of ruin *is* irrational, even once, because the dynamics are inherent. Choosing a strategy likely to lead to ruin in many worlds is irrational, even if you *might* get lucky in yours.
              *   **Critics (Your Suspicions):** Argue this smuggles in a *different* normative goal (optimizing across hypothetical ensembles or ensuring survival across many trials) that isn't necessarily relevant to an agent facing *one* trial. Maximizing expected wealth might be perfectly rational for that agent's single outcome. The "ought" derived from the biological *is* requires the *iterated context* to be normatively binding. Applying it to a single bet is an over-extension.
          *   **Utility is Ultimately Unavoidable:** Even geometric rationality relies on a *goal*: long-term growth/survival. If your goal is radically different (e.g., "I need $100,000 next year for a lifesaving operation, or I die anyway"), maximizing expected wealth (arithmetic mean) on a single bet might be the rational choice *for that goal*, even if it has a lower geometric mean. Geometric rationality normatively privileges one specific goal (long-run survival/growth) as paramount.

  **Conclusion:**

  You've identified the core issue perfectly. Geometric rationality **is** trying to derive a powerful normative "ought" (maximize growth rate/expected log wealth *always*) from the descriptive "is" of multiplicative processes (geometric mean determines survival *over time*). **The legitimacy of this move for a single bet hinges critically on whether one accepts the "ensemble of possible worlds" perspective as fundamental to rational choice in non-ergodic systems.**

  *   **Is it *just* riding the biology analogy?** Not entirely. The math of non-ergodicity provides a formal foundation beyond analogy.
  *   **Does it successfully derive a *universal* normative "ought" for single bets?** This is the crux. Critics like yourself (rightly) argue that the *necessity* of the geometric mean only *bites* descriptively in iterated contexts. For a single bet, maximizing expected wealth remains a coherent, alternative normative standard focused on the single outcome. Proponents argue the ensemble perspective *reveals* the irrationality of that standard in multiplicative environments.
  *   **Is it "something more" than repackaged utility?** Yes, in its *ambition* and *derivation*. It claims to ground a specific utility function (log) objectively in the dynamics of the system, rather than in subjective preference. However, it still fundamentally promotes a *specific goal* (long-term growth/survival) as rationally paramount.

  **In essence:** Geometric rationality makes a compelling, mathematically grounded argument for why maximizing expected log wealth is *often* profoundly rational, especially for repeated decisions. Its claim to be the *uniquely* rational strategy *even for single bets* is philosophically ambitious and controversial, resting on a specific (and debatable) interpretation of rationality in the face of non-ergodicity. Your skepticism about deriving a universal "ought" for single bets from the biological "is" is well-placed and shared by many philosophers and decision theorists. The biology analogy is insightful and motivating, but the normative leap for single bets requires accepting an ensemble-based metaphysics of rational choice.
