answer: |-
  You've nailed a profound tension in Neurath's thought, one that goes beyond mere supplement-versus-replacement. The core conflict lies in **epistemological claims versus representational claims**, and Neurath's anti-foundationalist boat *should* have sunk any naive belief in the direct, unmediated, "clean" presentation of facts via *any* symbol system, including pictures. Here's the argument that survives the "supplement" defense:

  1.  **The Boat's Radical Implications for *All* Symbolism:**
      *   Neurath's boat metaphor isn't just about sentences; it's an epistemological stance about *all* knowledge representation. It argues against *any* foundational, neutral, context-free, or perfectly transparent medium for expressing "facts." Knowledge is always provisional, interconnected, historically situated, and mediated by the tools (symbols, languages, frameworks) we use to build it.
      *   If *no* plank (no foundational sentence, concept, or observation report) is immune to revision based on its coherence within the whole structure, then *no* symbolic representation – words, numbers, *or* pictures – can claim privileged, unmediated access to "the facts themselves." All representations are planks in the boat.

  2.  **Isotype's Core Selling Point Contradicts This:**
      *   Neurath explicitly marketed Isotype on the premise that images (specifically, his standardized, simplified pictograms) could *bypass* the problems inherent in verbal language:
          *   **"Vagueness" of Words:** He claimed pictures were less ambiguous, more precise in conveying quantitative relationships and basic facts.
          *   **"Emotional Baggage":** He argued images were more "objective" and "neutral," free from the historical connotations, ideological load, and persuasive rhetoric embedded in words.
          *   **"Just the Facts":** The implication was that Isotype provided a cleaner, more direct window onto reality – a "view from nowhere" mediated by supposedly transparent symbols.
      *   **This is precisely the kind of foundationalist claim the boat metaphor demolishes.** Isotype's promise hinges on the *possibility* of a neutral, unmediated, foundational representation – the very thing Neurath's epistemology denies exists.

  3.  **Why "It's Just a Supplement" Doesn't Resolve the Tension:**
      *   **The Supplement Still Makes Epistemic Claims:** Even if Isotype is *only* a supplement to words, Neurath still claimed it offered a *superior* (less vague, less emotionally charged, more universal) way to grasp *certain kinds* of factual information. This claim of superiority rests on the idea that pictures can *better* approximate "just the facts" than words can. The boat metaphor argues this hierarchy of representational purity is illusory.
      *   **The Problem is the *Nature* of the Claim, Not the Scope:** The tension isn't about *how much* Isotype is used; it's about the *kind of epistemological privilege* Neurath implicitly or explicitly granted to pictorial representation *over* verbal representation in specific contexts. The boat insists *no* representation has this privilege.
      *   **Isotype Embodies "Pseudo-Rationalism"?** Neurath criticized "pseudo-rationalism" – the belief that reason alone, detached from historical context and empirical constraints, could build perfect systems. Doesn't Isotype flirt with a *visual pseudo-rationalism*? It suggests a rationally designed, standardized visual language can escape the messy, contingent, historically embedded nature of knowledge that the boat metaphor emphasizes. The very act of *designing* and *standardizing* the pictograms is a social, historical, contingent process – they are *constructed* planks, not found foundations.

  4.  **The Unavoidable Mediation of Pictures:**
      *   **Convention is Inescapable:** Isotype symbols are *highly* conventional. What does a simplified figure representing "a worker" *really* convey? It abstracts away countless individual variations, embodies specific cultural norms about dress and posture, and implicitly defines what counts as "work." These conventions are just as laden with potential bias and historical contingency as verbal definitions. Choosing *which* aspects of reality to pictorially represent, and *how*, involves interpretation and selection – it's not a neutral mirror.
      *   **Abstraction is Interpretation:** Reducing complex data to comparative lengths of rows of identical pictograms involves massive abstraction and selection. What data is included/excluded? What scale is used? How are categories defined? These choices are interpretive acts, laden with potential values and assumptions, just like choosing which verbal sentences to use in a report. The picture doesn't make these choices disappear; it often *hides* them behind an apparent immediacy.
      *   **"Objectivity" as a Rhetorical Effect:** The *appearance* of neutrality and objectivity in Isotype charts is a carefully crafted *rhetorical effect* achieved through standardization and simplification. It doesn't mean the representation *is* objectively neutral; it means it *looks* that way, potentially masking the interpretive choices involved. Neurath, the anti-foundationalist, should have been the first to deconstruct this effect, not promote it as a feature.

  **The Unresolvable Core Tension:** Neurath's boat insists that *all* knowledge is contextual, mediated, revisable, and lacks pure foundations. Isotype's core justification relies on the claim that *this specific form of pictorial representation* can mitigate mediation, reduce context-dependence, and provide a cleaner, more direct, more universal grasp of facts than words. This claim is fundamentally at odds with the radical implications of the boat. It posits a representational "dry dock" for *certain kinds* of facts – precisely what the metaphor denies exists.

  **For Your Novel:** This tension isn't a weakness in your character; it's *gold*. It makes him profoundly human and intellectually complex. Perhaps your Neurath-figure:
  *   Is genuinely blind to this tension, driven by his passion for social reform and belief in the power of visual education.
  *   Grapples with it privately, aware of the contradiction but believing the pragmatic benefits of Isotype (in promoting social understanding and education) outweigh the philosophical inconsistency.
  *   Develops a more sophisticated, boat-compatible theory of Isotype *later*, acknowledging its conventionality and limitations, moving away from the "clean facts" rhetoric towards seeing it as a particularly *effective communicative tool* within specific social contexts – just another type of plank, useful for specific purposes, but not foundational.
  *   Faces criticism from a more rigorously consistent anti-foundationalist character who sees Isotype's claims as a betrayal of their shared philosophical principles.

  This unresolved tension is a rich vein for character development and philosophical drama. Don't resolve it neatly – let it simmer, drive conflict, and reveal the complexities of trying to build a better world (or a better ship) with imperfect tools and imperfect understanding. Neurath's greatness lies partly in the productive friction between his ideas, and your character can embody that beautifully.
