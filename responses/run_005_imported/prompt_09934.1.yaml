answer: |-
  The perpendicular bisector of the segment joining \(A(0, 0)\) and \(B(4, 3)\) passes through the midpoint \(M(2, 1.5)\) and has a slope that is the negative reciprocal of the slope of \(AB\). The slope of \(AB\) is \(\frac{3-0}{4-0} = \frac{3}{4}\), so the slope of the perpendicular bisector is \(-\frac{4}{3}\). The equation of the perpendicular bisector is \(4x + 3y = 12.5\).

  A segment of length 5 units lies on this perpendicular bisector. The points \((x_1, y_1) = \left(\frac{1}{2}, \frac{7}{2}\right)\) and \((x_2, y_2) = \left(\frac{7}{2}, -\frac{1}{2}\right)\) satisfy the equation of the perpendicular bisector:
  - For \(\left(\frac{1}{2}, \frac{7}{2}\right)\): \(4 \times \frac{1}{2} + 3 \times \frac{7}{2} = 2 + \frac{21}{2} = \frac{4}{2} + \frac{21}{2} = \frac{25}{2} = 12.5\).
  - For \(\left(\frac{7}{2}, -\frac{1}{2}\right)\): \(4 \times \frac{7}{2} + 3 \times \left(-\frac{1}{2}\right) = 14 - \frac{3}{2} = \frac{28}{2} - \frac{3}{2} = \frac{25}{2} = 12.5\).

  The distance between these points is:
  \[
  \sqrt{\left(\frac{7}{2} - \frac{1}{2}\right)^2 + \left(-\frac{1}{2} - \frac{7}{2}\right)^2} = \sqrt{\left(\frac{6}{2}\right)^2 + \left(-\frac{8}{2}\right)^2} = \sqrt{3^2 + (-4)^2} = \sqrt{9 + 16} = \sqrt{25} = 5.
  \]

  Thus, the segment joining \(\left(\frac{1}{2}, \frac{7}{2}\right)\) and \(\left(\frac{7}{2}, -\frac{1}{2}\right)\) lies entirely on the perpendicular bisector and has a length of 5 units.

  \boxed{\left( \dfrac{1}{2},\ \dfrac{7}{2} \right)} \quad \text{and} \quad \boxed{\left( \dfrac{7}{2},\ -\dfrac{1}{2} \right)}
