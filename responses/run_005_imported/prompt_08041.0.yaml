  User clearly wants the case prosecuted, not balanced – so I'll hammer how Gibbard's solution buys logic at the cost of expressivism's soul. The technical success creates philosophical failure: if normative "plan acceptance" walks, talks, and logics like belief, calling it "non-cognitive" is just wordplay. 

  Also noting the user's comps context – they need a crisp, exam-ready argument. I'll avoid digressions and structure it as: thesis (Gibbard loses expressivist advantages), evidence (structural isomorphism + loss of motivational/ontological benefits), contrast (Blackburn/Schroeder preserve asymmetry). Punchline: solving Frege-Geach by making attitudes pseudo-cognitive is a Pyrrhic victory.
answer: |-
  You've nailed the core tension. Here's a sustained argument *for* the thesis that Gibbard's hyperplan solution to Frege-Geach, precisely by achieving logical parity with descriptivism, fatally undermines the core theoretical advantages expressivism was supposed to hold over cognitivism, collapsing into a deflationary cognitivism in all but terminology:

  **Thesis: Gibbard's hyperplan formalism, by structurally mimicking truth-conditional semantics to solve Frege-Geach, sacrifices expressivism's defining commitments to attitudinal asymmetry and ontological parsimony, rendering it a notational variant of deflationary cognitivism.**

  1.  **Expressivism's Core Promise & The Frege-Geach Threat:**
      *   Expressivism's *raison d'être* was offering a fundamentally different *metaphysical and psychological* account of normative discourse compared to cognitivism. It promised:
          *   **Attitudinal Asymmetry:** Normative judgments express *conative* (plan-laden, action-guiding) attitudes (like planning, endorsing, commending), distinct in kind from *cognitive* (belief-like, representational) attitudes expressing descriptive judgments.
          *   **Ontological Parsimony:** Avoiding commitment to irreducible, causally inert, "queer" normative facts/properties in the world, explaining normativity solely via human psychology and practical reasoning.
      *   Frege-Geach exposed the challenge: How can these distinct conative attitudes embed logically (negation, conditionals, disjunction) in ways that preserve validity, if their content isn't truth-conditional and their logic isn't inherited from a representational function?

  2.  **Gibbard's Solution: Hyperplans as Truth-Conditional Proxies:**
      *   Gibbard's genius was to identify an object of planning attitudes – the **hyperplan** (a maximally specific contingent plan for what to do in every conceivable situation) – that is sufficiently rich and structured.
      *   He then constructs **plan-laden propositions**: The content of a normative claim (e.g., "Stealing is wrong") is the set of world-hyperplan pairs where the hyperplan *forbids stealing* in that world.
      *   **Logical Machinery:** This allows him to define logical operations *set-theoretically*, mirroring possible worlds semantics:
          *   Negation: The set of world-hyperplan pairs *not* in the original set.
          *   Conjunction: The intersection of two sets.
          *   Disjunction: The union of two sets.
          *   Conditional: Defined via negation and disjunction (or directly via supersets).
          *   Validity: Preservation of acceptance across all world-hyperplan pairs (analogous to truth-preservation across all worlds).
      *   **Result:** The logic of normative discourse "comes along for free" using standard tools. Frege-Geach is solved *technically*.

  3.  **The Creeping Minimalism Trap: Sacrificing Expressivism's Advantages:**
      *   **Loss of Attitudinal Asymmetry (Psychological Advantage):** Gibbard *defines* the attitude of "accepting" a normative sentence as *having a hyperplan that includes the prescribed plan-component*. But what *is* this attitude?
          *   **It Becomes Quasi-Cognitive:** Accepting a hyperplan-laden proposition looks suspiciously like *believing* that one's hyperplan has a certain feature (e.g., forbids stealing). The content *represents* a complex state of affairs involving the agent's own mental state (their hyperplan) and the world. The *functional role* of this "acceptance" state, especially its role in inference, mirrors belief. The conative "oomph" – the essential practical, motivating force expressivism claimed for normative judgments – is *no longer inherent in the attitude type itself*. It's relegated to the *content* (the hyperplan *prescribes*), not the *mode* of acceptance. The attitude ("accepting that hyperplan H forbids stealing") is now a *belief-like state about a prescription*. The fundamental psychological asymmetry collapses.
      *   **Loss of Ontological Parsimony (Metaphysical Advantage):** Expressivism promised to avoid "queer" normative properties. But what is the *status* of hyperplans and the "facts" about what they prescribe?
          *   **Hyperplans as Queer Entities:** Hyperplans are abstract, maximally specific, contingency-planning entities. They are posited as real objects of attitudes and bearers of content. The "fact" that hyperplan H forbids stealing in world W looks very much like a *normative fact* – it's a fact *about what is prescribed*. It's just relocated from "out in the world" to "inside the hyperplan." But since hyperplans are part of the furniture of Gibbard's explanatory universe, we are still committed to *irreducibly normative entities* (hyperplans) and *irreducibly normative properties* (prescribing, forbidding). The ontological gain over a minimalist realism (which posits normative facts but gives a deflationary account of "fact") is negligible. Both posit normative "truth-makers" (hyperplan states vs. minimalist facts); Gibbard's just have a psychological label attached.
      *   **Structural Isomorphism Undermines Theoretical Distinctness:** The key point is that the *formal structure* of Gibbard's semantics for normative language is **isomorphic** to a truth-conditional semantics. The logic works *identically*. The compositional rules work *identically*. The account of validity works *identically*. The only difference is the label on the indices: "world-hyperplan pairs" instead of "worlds" (or "worlds + standards," etc.). When two theories assign the *same formal structure* to the phenomena they explain, and that structure is rich enough to fully determine logical behavior and content, the claim that they represent fundamentally different *metaphysical* or *psychological* accounts becomes incredibly thin. The expressivist "attitude" and "content" have been engineered to perfectly mimic the functional role of cognitive belief and truth-conditional content.

  4.  **Contrast with Alternatives Highlighting the Loss:**
      *   **Blackburn's Quasi-Realism/Attitude Trees:** Blackburn explicitly *rejects* needing propositional objects for attitudes. His solution relies on tracking *higher-order attitudes* towards *combinations* of first-order attitudes (e.g., tolerating tolerance). The logical structure emerges from the *relations between distinct conative states*, not from fattening the objects into truth-conditional proxies. This preserves attitudinal asymmetry (booing/hooraying remains distinct from believing) and ontological parsimony (no hyperplan entities). It struggles more with compositional complexity, but it *avoids* the isomorphism that traps Gibbard.
      *   **Schroeder's "Being For":** Schroeder's "being for" attitude is maximally minimal and *non-representational*. The attitude is the same for all normative judgments; only the *relata* change (e.g., being for blaming for stealing). Logic is handled by the attitude combining *itself* in complex ways (e.g., being for (not blaming for stealing if not wrong)). This rigorously maintains attitudinal asymmetry (one primitive conative attitude) and ontological parsimony (no commitment to hyperplans or normative facts/properties). The complexity lies in the *attitude combinatorics*, not in fattening the *objects*. It avoids mimicking truth-conditional structure directly.

  5.  **Conclusion: A Pyrrhic Victory:**
      Gibbard's hyperplan solution is a remarkable technical achievement that successfully tames the logical complexities of normative discourse within a broadly expressivist framework. However, this victory comes at the cost of expressivism's *defining theoretical advantages*. By constructing plan-laden propositions that are formally indistinguishable from truth-conditional contents, and defining an attitude of "acceptance" that functions identically to belief within the logical system, Gibbard erases the crucial psychological asymmetry expressivism promised. By committing to hyperplans as irreducible normative entities bearing normative properties (prescribing, forbidding), he sacrifices the ontological parsimony that was a major motivation for rejecting cognitivism. The resulting theory solves Frege-Geach *by becoming*, for all functional and explanatory purposes relevant to logic and semantics, a *deflationary cognitivist* theory that happens to use the word "plan" instead of "fact." The "expressivism" becomes a label attached to a structure that walks, talks, and reasons like cognitivism. Therefore, while solving one problem (Frege-Geach), Gibbard's machinery undermines the very reasons for preferring expressivism over cognitivism in the first place.
