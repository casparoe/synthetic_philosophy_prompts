  First, I need to recall Gibbard's core move: treating normative judgments as accepting hyperplans (maximally specific contingency plans) instead of beliefs about facts. His big sell is that this solves the embedding problem by making normative content proposition-like enough for standard logic to apply. But the user's sharp question is: if hyperplan-content behaves just like truth-conditional content, what's left of non-cognitivism?

  Hmm. The user mentions Dreier's creeping minimalism – that's key. When expressivist "plan-laden propositions" mirror realist "truth-apt propositions" in structure and function, the distinction starts feeling purely terminological. I should emphasize how Gibbard's framework makes normative and descriptive contents isomorphic: both are sets of world-plan pairs that combine via set operations (intersection for conjunction, etc.). That structural parity is exactly what lets logic "come along for free," but also what drains expressivism of its revolutionary flavor.

  The user also references Blackburn and Schroeder – good that they want comparisons if helpful. Blackburn's attitude trees avoid this by preserving distinct psychological roles (e.g., disapproval isn't a belief-like state). Schroeder's "being for" is even leaner – no propositional objects at all. But Gibbard's hyperplans are so richly specified that they become truth-apt by another name. 

