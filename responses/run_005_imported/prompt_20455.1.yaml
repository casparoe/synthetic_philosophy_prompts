answer: |-
  Here's a joke built specifically on that delicious contradiction:

  **Hobbes finally corners John Wallis at an Oxford coffeehouse.**  
  Hobbes: *"Wallis, this bickering over my circle quadrature is intolerable! Must we endlessly dispute what is plainly evident? Your objections are mere noise!"*  
  Wallis: *"Thomas, it's not noise, it's rigorous proof. Your construction demonstrably fails. The algebra doesn't lie."*  
  Hobbes: *"Precisely! This perpetual squabbling proves my point from 'Leviathan'! Without a final, supreme authority to whose judgment all must submit, disputes like this rage eternally. Each man clings to his own reason, leading only to conflict!"*  
  Wallis: *"So... what? You propose we petition the King to decree whose geometry is correct?"*  
  Hobbes: *(Leans in, eyes gleaming)*  
  ***"No, Wallis. I propose they decree that *I* am the Sovereign Geometer. Then the matter will be settled."***

  **Why it works:**

  1.  **Core Contradiction:** It directly pits Hobbes's core political solution (a Sovereign's word *is* law/truth because it ends dispute) against his geometric behavior (refusing mathematical proof).
  2.  **Specific References:** Requires knowledge of:
      *   **"Leviathan":** The argument about the necessity of a Sovereign to end disputes born of individual reasoning.
      *   **The Feud:** His decades-long insistence on squaring the circle despite mathematical disproof (represented by Wallis).
      *   **Hobbes's Stance:** His utter refusal to yield to mathematical authority (like Wallis or established geometry).
  3.  **The Punchline:** Instead of accepting mathematical proof as the "authority" in geometry (which he rejects), or suggesting an external ruler (like the King), Hobbes's solution is the ultimate application of his own flawed logic to his own failing: *He* should be declared the Sovereign whose word *on geometry* cannot be questioned. It highlights the absurdity of trying to impose political "final word" authority onto a realm governed by demonstrable proof.
  4.  **Character:** Captures Hobbes's likely exasperation and his characteristic solution (centralize authority) while exposing the profound mismatch with mathematical reality.

  It's not just that Hobbes was bad at math; it's that his *response* to being demonstrably wrong violated the very principle he championed as the *only* solution to such irreconcilable disagreements. The joke hinges entirely on that specific philosophical-math historical clash.
