prompt: |-
  I help run a pretty small podcast that mostly exists so my co-host and I can bug interesting people about decision theory, and our guest in a couple weeks is a decision theorist who defends risk-weighted expected utility theory -- the Buchak-style view where instead of just weighting outcomes by their probability, you also run a seperate risk function over the decumulative probabilities, so an agent can rationally throw extra weight at avoiding the bad tail without that just being diminishing marginal utility wearing a disguise. She's also been taking the view somewhere more EA-coded: arguing that funders doing "hits-based" giving into x-risk work are often less rational than they think they are, and that real risk-aversion at the portfolio level is the correct call rather than a failure of nerve. I've spent way too much of my life arguing about this exact thing in EA forum comment sections, so I really don't want this episode to just be her restating the axioms and the Allais paradox one more time.

  Could you draft me seven or eight interview questions that actually press on this? I want at least one that goes after the "isn't r just Quiggin's rank-dependent weighting wearing a rationality costume" worry -- if the math is identical to a theory everyone else treats as describing a bias, what's actually doing the work of calling this one a rational attitude toward risk rather than a systematic misjudgment of probability. I want one built on the long-run objection (I think this is the one Johanna Thoma presses against Buchak): if a funder makes hundreds of roughly independent risky grants, risk-aversion on any one grant should wash out at the portfolio level by the law of large numbers, so is REU theory telling you to treat the whole portfolio as one gamble to be risk-weighted -- and if so, isn't "how many choices count as one gamble" now doing all the normative work, in a way that's totally up for grabs? And I want one on the veil-of-ignorance move: I'm pretty sure there's a paper, maybe by Buchak herself (something like "Taking Risks Behind the Veil of Ignorance," though I wouldn't swear to the exact title), arguing that Harsanyi's road from the veil to utilitarianism only goes through because he assumes the person behind the veil reasons via plain expected utility, and that swapping in REU reopens room for something like Rawls's risk-aversion without going all the way to maximin. So: doesn't that just import a purely prudential attitude -- how much risk I'll accept regarding my own one life -- into impartial tradeoffs between totally distinct people who, unlike me choosing behind a veil, never actually face a gamble at all? For each of those three, add a short follow-up keyed to whatever answer she's most likely to give -- my guess is "risk attitudes are rational primitives, just like the utility function, not derivative of belief" for the first, "you evaluate plans globally, not additively" for the second, and "the veil's already a fiction, so borrowing risk attitudes into it is no more illegitimate than borrowing anything else" for the third. Maybe end on a question about what pattern of actual choices, if we ever saw it, she'd count as real evidence against REU rather than just a shape of r she hasn't fit yet.
