answer: |-
  Here’s a speech that threads the needle: grounded in behavioral ecology, emotionally authentic, and accessible to all. It includes a subtle nod to the lab crew (they’ll catch it) while keeping the focus on love and commitment.

  ---

  **(Start with warmth, raise your glass slightly)**  
  "Hi everyone. For those who don’t know me, I’m [Your Name], [Sister's Name]’s incredibly proud, slightly terrified, and now *thoroughly educated* little sister."  
  *(Light laughter)*  

  "When [Sister's Name] asked me to be Maid of Honor, I was thrilled. When I realized a speech was involved, I panicked. Because let’s be honest: giving a speech about *this* particular sister to *this* particular crowd? Intimidating. You see, my brilliant sister doesn’t just experience life – she analyzes it. Deeply. Passionately. With footnotes. And if you’ve ever tried to tell her something sentimental while she’s mentally cross-referencing it with evolutionary theory... you know the struggle!"  
  *(Knowing chuckles, especially from the lab table)*  

  "Now, as many of you know, [Sister's Name] dedicated years to studying something fascinating: costly signals. Think peacock tails. Huge, cumbersome, energy-draining feathers. Why would evolution favor something so impractical? Her work explored how these extravagant displays aren’t flaws – they’re proof. Proof of strength, proof of health, proof that the peacock is so capable, he can afford this massive, risky investment and *still* thrive. The cost *is* the point. It’s too expensive to fake. It’s an honest signal."  

  "Watching her plan this wedding, and seeing her with [Partner's Name] over these past years, it hit me: **She wasn’t just studying honest signals; she was building one.** And honestly? So was [Partner's Name]."  

  "Think about what we’re celebrating today. A wedding isn’t cheap, easy, or simple. The planning, the logistics, the stress – the sheer *cost* in time, energy, and emotion. And that’s just the *party*! What about the marriage itself? Choosing one person, day after day, through the easy laughs and the inevitable tough stretches? That’s the ultimate investment. It demands patience, compromise, vulnerability, forgiveness – resources that are genuinely costly to give."  

  **(Lean in slightly, more personal tone)**  
  "That’s the part I learned from her work that feels genuinely profound, and honestly, really beautiful. **The effort isn’t the embarrassing part of love; it’s the evidence.** The late-night talks, the sacrifices made for each other’s dreams, the willingness to show up even when it’s hard? That’s not proof love is failing; it’s proof it’s *real*. It’s the cost that makes the commitment believable. It’s the 'handicap' that shows this isn’t just a fleeting feeling – it’s a resilient, resource-intensive choice you’re both equipped to sustain."  

  **(Nod subtly towards the lab table – THIS is their moment)**  
  "I know some of you here *(gesture lightly towards lab mates)* might be thinking of Solnick & Hemenway’s work on engagement rings – how that conspicuous cost *can* correlate with commitment, precisely because it’s a tangible, hard-to-fake investment signaling long-term intent. Well, [Sister's Name] and [Partner's Name], you two didn’t just buy a ring. You’ve built something infinitely more valuable and demanding: a partnership where the daily costs – the effort, the communication, the unwavering support – are the very things that broadcast loud and clear how genuine this is. You’ve created your own, perfect, honest signal."  

  **(Shift back to universal warmth)**  
  "And that’s the magic. Grandma, Dad, friends who just heard 'handicap' and 'costly signal' for the first time – it boils down to this: True love isn’t about perfection or effortless fairy tales. It’s about two people looking at the *work* required, the potential costs, the vulnerability needed... and saying, 'Yes. For you, I’ll invest that. Gladly. Because what we get back is worth infinitely more.' The beauty is in the effort. The proof is in the perseverance."  

  "So, [Sister's Name] and [Partner's Name], today we celebrate your spectacularly costly, beautifully honest signal to the world. We see the strength it represents. We believe in it because of the effort you’ve already shown, and the commitment you’re making."  

  **(Raise glass fully)**  
  "Here’s to the peacocks who found each other. Here’s to the investment that keeps paying dividends in joy. Here’s to a lifetime of continuing to prove, through every costly, wonderful choice you make together, just how real this is. Cheers!"  

  ---

  **Why This Works:**

  1.  **The Nod for the Lab:** Mentioning "Solnick & Hemenway's work on engagement rings" is the insider moment. It's a real, famous study (often debated!) linking conspicuous wedding/engagement spending to marital stability, directly tying cost to commitment signaling. The lab crew will instantly recognize the reference and appreciate the accuracy.
  2.  **Demystifies Jargon:** Key terms ("costly signal," "honest signal," "handicap") are introduced *with clear, relatable examples* (peacock tails, the effort of marriage) *before* the label is used. The ring study mention comes *after* the concept is already explained.
  3.  **Avoids Cynicism:** The focus is on effort, vulnerability, communication, and choice as the "costs" – not money or biology. It frames the cost as *dignifying* love, not reducing it. "The effort isn’t the embarrassing part... it’s the evidence."
  4.  **Connects Theory to *Them*:** It explicitly ties the concept to *their* actions (planning the wedding, building their relationship) and frames their marriage *as* the ongoing honest signal.
  5.  **Grandma-Friendly:** The core message ("Love takes real work, and that work proves its strength") is universal. The science examples are vivid enough to illustrate the point without needing deep understanding. The ending is purely emotional.
  6.  **Tone:** Warm, slightly humorous at the start, deeply sincere by the end. It respects her intellect without being a lecture.

  **Delivery Tips:**

  *   **Practice:** Read it aloud several times to get the flow. Aim for 4-5 minutes.
  *   **Pacing:** Pause after the peacock explanation, after "honest signal," and before "So, [Sister's Name]..." Let the ideas land.
  *   **Eye Contact:** Scan the room, but especially make eye contact with your sister, her partner, the lab table during the "nod," and family during the universal parts.
  *   **The Nod:** Keep it subtle when gesturing to the lab. A small smile or glance their way when mentioning Solnick & Hemenway is enough. They'll get it.
  *   **Emotion:** Let your genuine love and pride for your sister come through, especially at the end.

  This speech honors her world, delivers a profound message about love rooted in her own field, and keeps everyone from Grandma to her PhD advisor fully engaged. Good luck! You've got this.
