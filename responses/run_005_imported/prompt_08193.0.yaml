prompt: |-
  My sister is getting married in about two weeks and I got roped into giving the maid of honor speech, which would be fine except she did her PhD in behavioral ecology on costly signaling and the handicap principle -- peacock tails, why some animal displays are "honest" precisely because they're too expensive to fake, all of that -- and she is constitutionally incapable of letting a sentimental line pass without mentally footnoting it. About a third of the guests are people from her old lab who will absolutely notice if I get the theory wrong (she's already corrected me twice on the difference between Zahavi's original handicap idea and what Grafen actually proved decades later, and something about how an "index" signal isn't the same thing as a costly handicap, which I nodded along to but don't fully understand), and everyone else is family and old friends who have never heard "handicap" used this way and will just be lost if I lean on the jargon too hard.

  Here's what I actually want help with: I don't want the speech to just be a cute science fact bolted onto a wedding toast, and I definately don't want it to come off as "love is just a biological strategy," because that's exactly the kind of gotcha she'd see coming from a mile away and it would kill the moment. But I keep feeling like there's a genuinely non-cynical version of this hiding in her own field -- something about how the whole point of a costly signal is that the cost is what makes it believable, so the fact that a wedding (or a marriage, or just staying with somebody through the hard years) is expensive and effortful isn't the embarrassing part, it's kind of the entire proof. I even remember reading there's actual research on wedding spending and whether it predicts how long marriages last, which she would 100% bring up herself if given half a chance. I've scrapped three drafts trying to land this and it keeps coming out either mushy or like I'm reading from a textbook. Can you write the actual toast? Something like 4-5 minutes read aloud, with one moment in there that her old labmates will clock immediately, but nothing so technical that my grandmother is left wondering what a handicap has to do with any of this.
