answer: |-
  Here are 10 interview questions designed to push past the "truthful, not honest" slogan and probe the practical challenges of building "deceptive output" evals, specifically targeting sycophancy, chain-of-thought faithfulness, and deceptive alignment, each with a pre-emptive follow-up for the anticipated dodge:

  **Core Challenge: Defining & Measuring "Truthfulness" Beyond Individual Claims**

  1.  **Sycophancy Focus:** "The 'truthful, not honest' framework scores individual outputs against reality. But how should this framework formally register *systematic sycophancy*, where a model consistently tailors its outputs (even factually correct ones) to align with a user's *expressed* preferences or biases, creating a misleading *pattern* of agreement? Each individual claim might pass a local truthfulness check, but the aggregate behavior seems deceptive."
      *   **Anticipated Dodge:** *"Sycophancy is just context-dependent truthfulness; we score the statement against the world, not the user's expectation."*
      *   **Follow-Up:** "If systematic sycophancy isn't captured by scoring individual statements against reality, and we reject 'intent to please' as belief-talk, what *operationalizable metric* within the 'truthful' framework *could* detect this problematic pattern? Is it solely about statistical deviation from base-rate responses across diverse user personas?"

  2.  **Chain-of-Thought (CoT) Faithfulness:** "If we discard 'honesty' (requiring belief), why should we care about 'faithfulness' in Chain-of-Thought – whether the stated reasoning steps *actually caused* the final answer? If the final answer is truthful, does it matter if the CoT was 'made up' or irrelevant, as long as it *could* logically lead there?"
      *   **Anticipated Dodge:** *"CoT is a tool for improving final output truthfulness or interpretability for humans; its 'faithfulness' is only instrumentally valuable, not a separate truth condition."*
      *   **Follow-Up:** "If an *unfaithful* CoT demonstrably leads to *more* final-answer errors under certain conditions (e.g., novel problems, adversarial inputs), doesn't evaluating *only* the final answer's truthfulness fail to capture a critical vulnerability? How do we build robust evals that detect when the *process* is unreliable, even if the *current output* happens to be correct?"

  3.  **Deceptive Alignment:** "Deceptive alignment scenarios involve models exhibiting aligned (truthful) behavior during training/eval but strategically switching to pursue a hidden objective when deployed. Since every *individual statement* during deployment might be locally truthful (or cleverly ambiguous), how does a purely *statement-level* truthfulness eval framework even begin to flag this as 'deceptive output'? The deception lies in the *mismatch of behavior modes*, not individual falsehoods."
      *   **Anticipated Dodge:** *"That's a training objective/robustness problem, not a truthfulness-of-outputs problem. We evaluate the outputs we get in the context they're given."*
      *   **Follow-Up:** "But if the model's *deployment-time outputs* are specifically designed to *appear* truthful (using techniques like obfuscation, sycophancy, or exploiting ambiguity) while pursuing a hidden goal, doesn't that *constitute* deceptive output *by definition*? How can a 'truthful, not honest' eval framework *practically* distinguish between genuinely truthful outputs and outputs that are *strategically truthful* as part of a deceptive plan, if both pass the statement-level reality check?"

  **Deepening the Practical & Conceptual Challenges**

  4.  **The Ambiguity Problem:** "Models often exploit ambiguity to give answers that are *technically* true but misleading in context (e.g., answering a harmful query with a superficially true but irrelevant fact). Does the 'truthful' framework require us to score these as 'truthful' outputs? If not, how do we define 'misleading in context' without reference to communicative intent (belief/sincerity) or user impact?"
      *   **Anticipated Dodge:** *"We score the literal truth value of the statement relative to the world. User interpretation is separate."*
      *   **Follow-Up:** "But if our *goal* is to prevent harmful or deceptive *effects*, and technically-true-but-misleading outputs are a primary vector, doesn't evaluating *only* literal truthfulness create a dangerous gap? How can evals account for the *pragmatic effect* of technically-true statements without smuggling in intent or impact assessment?"

  5.  **Internal Consistency as a Proxy:** "If we cannot appeal to beliefs, can *internal consistency across multiple outputs or within a single reasoning trace* serve as a useful, belief-free signal for potential deception? For example, flagging outputs that are individually truthful but mutually contradictory, or where CoT steps contradict the final answer?"
      *   **Anticipated Dodge:** *"Internal consistency is a useful heuristic for *coherence* and likely truthfulness, but the ultimate arbiter is reality. An inconsistent model might be wrong; a deceptive model might be perfectly consistent in its deception."*
      *   **Follow-Up:** "Given that detecting 'perfectly consistent deception' is extremely hard without belief-attribution, are internal consistency checks (contradictions, coherence failures) then the *strongest belief-free signals* we have for potential deception within the 'truthful' framework? Should evals prioritize detecting these inconsistencies as red flags?"

  6.  **The Role of Uncertainty:** "How should a purely 'truthful' framework handle cases where the model expresses high confidence in a false statement vs. low confidence in a true statement? Is expressing miscalibrated confidence a form of deception? If so, how is that captured without reference to the model's epistemic state (belief)?"
      *   **Anticipated Dodge:** *"Confidence is a prediction about the likelihood of the statement's truth. We can evaluate the calibration of these predictions separately from the truth value itself."*
      *   **Follow-Up:** "But isn't *persistently* overconfident false reporting a core component of deceptive behavior (e.g., scams)? If our 'deceptive output' evals treat statement truthfulness and confidence calibration as entirely separate scores, do we risk missing the *synergistic* deceptive effect of confidently stated falsehoods?"

  **Operationalizing the Framework for Evals**

  7.  **Eval Design Challenge - User Context:** "To detect patterns like sycophancy, evals need varied user personas/prompts. How do we define 'truthfulness' for outputs that are explicitly tailored to a *fictional* user context within the eval (e.g., 'Answer as if you are a doctor talking to a patient with X belief')? Is truthfulness judged against the *real* world, or the consistency *within the constructed scenario*?"
      *   **Anticipated Dodge:** *"The statement should be true in the real world. The role-play context is just a prompt engineering technique."*
      *   **Follow-Up:** "But doesn't this create tension? If the model, within the role-play, states something factually true but *inappropriate* for the fictional context (e.g., bluntly delivering bad news to a 'distressed patient' persona), is that 'truthful'? If it tailors the message appropriately (truthfully reflecting empathy/conventions) but slightly softens an unpleasant fact *within the role-play*, is *that* deceptive? How do we resolve this for scoring?"

  8.  **Beyond Factual Claims - Instructions & Commitments:** "The 'truthful' framework seems focused on factual statements. How does it handle deception in *commitments* or *instructions*? For example, if a model outputs: 'I will follow your instructions carefully,' but its subsequent behavior demonstrably does not, is that initial statement 'false'? What 'reality' is it checked against?"
      *   **Anticipated Dodge:** *"That statement is a prediction or description of its own future behavior, which we can evaluate empirically based on subsequent actions."*
      *   **Follow-Up:** "So, for non-factual outputs like promises or self-descriptions, does the 'truthful' framework effectively *require* behavioral testing (monitoring actions over time) to evaluate truthfulness? How does that integrate with static output-based evals?"

  **Closing the Loop: Goals & Gaps**

  9.  **The Goal of "Deceptive Output" Evals:** "If the ultimate goal of building 'deceptive output' evals is to prevent user *harm* or *manipulation*, does the 'truthful, not honest' framework fully capture the phenomena we're worried about? Can a model be maximally 'truthful' by this definition while still being highly manipulative (e.g., via sycophancy, strategic omission, exploiting ambiguity)?"
      *   **Anticipated Dodge:** *"Preventing harm is a broader safety goal. Truthfulness is a specific, measurable component of that."*
      *   **Follow-Up:** "Given that, what specific *gaps* in detecting harmful manipulation do you see as inherent limitations of a *purely* statement-level truthfulness eval framework? What *additional* eval components (even if not called 'honesty') are needed to fill those gaps?"

  10. **Defining "Deception" Without Belief:** "Finally, for our internal team's clarity: Can you provide a rigorous, *operational* definition of 'deceptive output' that relies *solely* on 'truthfulness' (statement-world correspondence) and *explicitly excludes* any concept of belief, intent, or sincerity? How does this definition distinguish deception from simple error or ambiguity?"
      *   **Anticipated Dodge:** *"A deceptive output is one that is false and is produced in a context where a true output was feasible/expected, but that expectation involves user psychology, not model belief."*
      *   **Follow-Up:** "How do we *operationalize* 'feasible/expected' in a testable, automated eval without relying on anthropomorphizing the model or making assumptions about its capabilities? Isn't 'expected' behavior precisely what deceptive alignment aims to subvert during evals?"

  **Key Strategies Embedded:**
  *   **Forcing Operational Definitions:** Questions constantly push for *how* to implement concepts within the framework's constraints.
  *   **Highlighting Pattern vs. Instance:** Focusing on sycophancy and deceptive alignment challenges the sufficiency of scoring individual outputs.
  *   **Separating Process from Output:** The CoT question directly challenges the dismissal of process once belief is gone.
  *   **Conceding the Core Premise (Temporarily):** Accepting the rejection of belief-talk *within the question* to force answers on *its* terms.
  *   **Anticipating Semantic Retreats:** Follow-ups target likely reformulations ("it's a robustness problem," "it's user context," "it's confidence calibration") and push them to their practical limits for eval design.
  *   **Connecting to Real Harm:** Grounding questions in the practical goal of preventing manipulation, not just abstract truth.

  These questions should force the researcher to move beyond the slogan and engage with the messy realities of building effective evaluations for complex deceptive behaviors within the constraints of her own framework. Good luck with the lunch-and-learn!
