prompt: |-
  Ok so this is suddenly super relevant to my actual job -- I just got moved onto the 'model behavior' team at the AI company I work for, and my first real project is building evals for 'deceptive' outputs, which is turning out to be way murkier then I assumed going in. For an internal lunch-and-learn series I run, I've got a researcher coming in next week who's a committed defender of the 'truthful, not honest' framework -- basically the view that we should score AI systems purely on whether their statements match reality, and drop 'honesty' talk entirely, since honesty requires the system to actually believe what its saying and we don't have a good basis for attributing beliefs to a language model in the first place. Her go-to move whenever anyone raises a hard case is 'that's smuggling belief-talk back in, you don't need it,' so I don't want her just repeating that line for 40 minutes. Can you write me 8 to 10 interview questions that push past the slogan: I want at least one question on how a purely statement-level truthfulness score is even supposed to register sycophancy (each individual claim can look locally plausible even while the overall pattern is just the model caving to what the user wants to hear), one on why we should still care about chain-of-thought 'faithfulness' (whether the model's stated reasoning actually reflects the process that produced the answer) once belief-talk is off the table, and one on deceptive-alignment-style worries, where the problem isn't any single false statement but a mismatch between training-time and deployment-time behavior -- and for each, a follow-up keyed to the dodge she'll probably reach for.
