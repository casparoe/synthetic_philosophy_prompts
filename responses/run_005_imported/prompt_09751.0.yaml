prompt: |-
  I've been reporting on how AI-safety folks keep repurposing old decision-theory puzzles, and last weekend two friends of mine -- one finishing a philosophy MPhil, the other an ML engineer who spends way to much time on rationalist blogs -- got into a proper argument over dinner about the "Death in Damascus" case, and it's been nagging at me since. Quick recap in case it's useful: a man in Damascus runs into Death, who gives him a look of surprise. Spooked, the man rides off that night to Aleppo. Turns out Death was surprised to see him in Damascus at all, because he already had an appointment to meet the man in Aleppo. In the decision-theory version of the story, Death is basically never wrong about which city you'll end up in, and you have to decide where to spend the night knowing that wherever you pick is strong evidence Death will show up there too -- which, obviously, you'd rather avoid.

  Roughly how the argument went: (1) The philosopher said the case is basically a knockdown argument against evidential decision theory -- since picking either city counts as "bad news" the moment you've picked it, EDT can never actually settle on an action, it just wants you to switch forever, and a theory of rational choice that can't recommend an action isn't one. (2) The engineer said that's not quite fair -- all the flip-flopping shows is that neither city is "ratifiable," and you could just as well conclude that the ratifiability requirement is the broken part, not the underlying evidential idea that you should act on the news your own choice would deliver. (3) The philosopher answered that dropping ratifiability doesn't save EDT, because even before any of that deliberation-loop stuff kicks in, EDT already rates both cities as equally lousy, so it gives you no actual reason to prefer one over the other -- whereas causal decision theory gets the obviously right answer for the obviously right reason: your choice doesn't cause Death to be anywhere, so you should just flip a coin (or go wherever's cheaper), since the causal expected utilities are identical either way. (4) The engineer wasn't having it: if Death is genuinely that good a predictor, he said, then a coin-flipping habit is exactly the kind of policy Death would predict too, so the causal theorist hasn't actually escaped the correlation, he's just shoved it up a level, from "which city" to "which method you use to pick a city." Neither of them budged, and honestly I couldn't tell you who won.

  Could you go through their exchange move by move and say who's got the better of it at each step, rather than just handing down one overall verdict? And if there's something both of them seem to be circling around without quite naming it -- some cleaner way of stating what's actually at stake in the disagreement -- I'd be curious to hear that too.
reasoning: |-
  We are analyzing an argument about the "Death in Damascus" decision-theory puzzle between a philosopher and an ML engineer.

  The story: A man meets Death in Damascus. Death is surprised because he had an appointment to meet the man in Aleppo. The man flees to Aleppo that night and dies there. In the decision-theory version, Death is a perfect predictor. The man must decide where to spend the night (Damascus or Aleppo) knowing that if Death predicts he will be in a city, Death will be there.

  The argument:

  1. Philosopher: This is a knockdown argument against Evidential Decision Theory (EDT). EDT cannot settle on an action because whichever city you choose, upon choosing it you get evidence that Death is there, so you want to switch. But then the same happens for the other city. Thus, EDT leads to an infinite loop and cannot recommend an action.

  2. Engineer: The flip-flopping only shows that neither city is "ratifiable" (i.e., you don't want to stick with your choice after making it). But maybe the requirement for ratifiability is the problem, not the evidential idea that you should act on the news your choice delivers.

  3. Philosopher: Even without the deliberation loop, EDT rates both cities equally bad (because choosing either gives bad news). So it provides no reason to prefer one over the other. Meanwhile, Causal Decision Theory (CDT) gets the right answer: your choice doesn't cause Death to be anywhere, so you should flip a coin (or choose based on cost) because the causal expected utilities are the same.

  4. Engineer: If Death is a perfect predictor, then even a coin-flipping policy would be predicted by Death. So CDT doesn't escape the correlation; it just moves it up to the level of the method (e.g., flipping a coin) and then the city chosen by that method. So the causal theorist hasn't avoided the problem.

  We are to go through each move and say who has the better of it at each step, and also identify any underlying issue.

  Let's break it down:

  Step 1: Philosopher's claim that EDT leads to infinite regress and cannot recommend an action.

  - In EDT, the value of an action is based on the conditional probability of outcomes given the action. In this case:
    - P(Death in Damascus | I choose Damascus) ≈ 1 (because Death is a perfect predictor and if you choose Damascus, Death predicted that and is there)
    - Similarly, P(Death in Aleppo | I choose Aleppo) ≈ 1.
    - Therefore, the expected utility of choosing either city is very low (since you are likely to die).

    But note: if you are considering Damascus, then conditional on choosing Damascus, you get evidence that Death is in Damascus, so you don't want to choose it. The same for Aleppo. So indeed, EDT does not have a stable choice. It seems to recommend switching.

    However, the philosopher says EDT cannot settle on an action. This is a standard criticism of EDT in Newcomb-like problems (which this resembles). The philosopher has a point: a decision theory should be able to recommend an action.

    Verdict: Philosopher is correct on this step.

  Step 2: Engineer's response that the problem is ratifiability, not EDT.

  - Ratifiability (due to Richard Jeffrey) is the idea that a decision is rational only if, having made it, you do not regret it (i.e., you would make the same choice again given the state of having chosen it). In this case, neither choice is ratifiable because after choosing a city, you have evidence that Death is there and thus you regret the choice.

    The engineer suggests that the requirement of ratifiability might be the problem. That is, maybe we shouldn't require that an action be ratifiable? But note that without ratifiability, we are left with the initial EDT evaluation: both actions are equally bad. So we still have no basis for choosing.

    The engineer is defending EDT by attacking the ratifiability requirement. However, even without ratifiability, EDT still fails to break the symmetry. So this doesn't solve the problem.

    Moreover, the philosopher's point in step 1 was about EDT's inability to recommend an action (due to the regress), and the engineer's response about ratifiability doesn't directly address the regress. The regress is a separate issue from the initial evaluation.

    Verdict: The engineer's point is interesting but doesn't fully counter the philosopher. The ratifiability requirement is a way to handle the instability, but if we drop it, we are left with EDT giving equal and bad expected utility for both actions. So the philosopher's criticism still stands.

  Step 3: Philosopher's point that without the loop, EDT still fails to break the tie, while CDT does.

  - Philosopher: EDT rates both cities as equally bad (which is true, as per above). So it provides no reason to choose one over the other. This is a failure of discrimination.

  - CDT, on the other hand, uses causal structure. In CDT, the decision-maker considers the causal effect of their action. In this scenario, the man's choice of city does not cause Death to be in that city. Death has already made his prediction and set his location accordingly. So the causal expected utility of choosing Damascus is the utility of being in Damascus without causing Death to be there (which is independent of the choice). Similarly for Aleppo.

    However, note that Death is a perfect predictor. So if the man chooses Damascus, then Death is in Damascus (because he predicted the man would be there). But the causation is the reverse: the man's being in Damascus is caused by his choice, but Death's being there is caused by his own prediction (which is based on the man's choice). So the man's choice does not cause Death to be there; it is only evidence.

