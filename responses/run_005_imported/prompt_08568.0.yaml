prompt: |-
  I've been working through the St. Petersburg paradox on my own. In the classic version, you flip a fair coin until it lands tails for the first time, and if that happens on the nth flip you win 2^n dollars; because the prize doubles exactly as fast as the odds of reaching it halve, the expected payout is infinite, even though almost no one would pay more than a small amount to play. The resolution I keep running into is Daniel Bernoulli's: money has diminishing marginal utility, so once the game is scored in expected utility rather than expected dollars (he used a logarithmic scale), the sum comes out finite, and refusing to pay much for the bet turns out to be perfectly rational rather than some kind of mistake. I've been using that idea to write a simple personal rule for judging long-shot bets and investments: run every payout through a concave utility function instead of raw dollars, and this particular kind of infinite-expectation trap can never come up again, no matter how the bet is structured. Before I start relying on that rule for real decisions, I'd like to know whether it actually holds up in general, or whether it only worked for the specific game Bernoulli happened to be looking at.
reasoning: |-
  We are discussing the St. Petersburg paradox and the resolution via utility functions. The key idea is that by applying a concave utility function (such as the logarithm) to the monetary outcomes, the expected utility becomes finite, thus resolving the paradox.

   Your question: Does this rule (applying a concave utility function to the payouts) always prevent an infinite expected utility, regardless of the structure of the bet? Or is it specific to the St. Petersburg game?

   Let me break it down:

   1. The St. Petersburg game has payouts that grow exponentially (2^n) and probabilities that decay exponentially (1/2^n). The expected value in dollars is:
          E = sum_{n=1}^{∞} (probability of n-th flip being the first tail) * (payout at n)
            = sum_{n=1}^{∞} (1/2^n) * (2^n) = sum_{n=1}^{∞} 1 = ∞.

   2. Using a utility function u(x) that is concave and increasing (like log(x)), the expected utility becomes:
          EU = sum_{n=1}^{∞} (1/2^n) * u(2^n)

      For u(x) = log(x) (base e or base 2, it doesn't matter as long as consistent), we have:
          EU = sum_{n=1}^{∞} (1/2^n) * log(2^n)
              = sum_{n=1}^{∞} (1/2^n) * (n * log(2))
              = log(2) * sum_{n=1}^{∞} n * (1/2)^n

      We know that the series sum_{n=1}^{∞} n * r^n converges for |r| < 1 (and r=1/2 is in that range). Specifically, the sum is r/(1-r)^2. So:
          sum_{n=1}^{∞} n * (1/2)^n = (1/2) / (1 - 1/2)^2 = (1/2)/(1/4) = 2.

      Therefore, EU = log(2) * 2, which is finite.

   3. Now, the general question: If we have an arbitrary bet (with a countable set of outcomes) and we apply a concave utility function, can we still get an infinite expected utility?

      Let me clarify: the utility function u is concave and increasing. This implies that u grows slower than linearly. In fact, for large x, u(x) is bounded above by a linear function but the concavity flattens it.

      However, note that the utility function must be defined for all positive real numbers (since payouts can be arbitrarily large) and must be concave and increasing. Examples include:
          u(x) = log(x)
          u(x) = sqrt(x)
          u(x) = x^c for 0 < c < 1

      Now, consider a general gamble with payouts x_n and probabilities p_n (with sum p_n = 1). The expected utility is:
          EU = sum_{n} p_n * u(x_n)

      We want to know: under what conditions might this sum diverge to infinity?

      Note: Even with a concave utility function, it is possible to design a gamble that yields infinite expected utility if we allow the payouts to grow fast enough relative to the decay of the probabilities.

      Example:

          Let u(x) = log(x) (which is concave and increasing). Now design a gamble with:

              payout x_n = exp(2^n)   (which grows double exponentially)
              probability p_n = 1/2^n

          Then the expected utility is:
              EU = sum_{n=1}^{∞} (1/2^n) * log(exp(2^n))
                  = sum_{n=1}^{∞} (1/2^n) * (2^n)
                  = sum_{n=1}^{∞} 1 = ∞

          So we have an infinite expected utility even with the log utility function.

      Therefore, the rule of using a concave utility function does not in general prevent infinite expected utility. It depends on the specific gamble.

   4. Why did it work for the St. Petersburg game?

      In the St. Petersburg game, the payout was 2^n and the utility was log(2^n) = n * log(2). The probability was 1/2^n. So we had:

          EU = sum_{n} (1/2^n) * (n * log(2)) = log(2) * sum_{n} n/2^n < ∞

      because the series sum n/2^n converges.

      But if we make the payout grow faster than the reciprocal of the probability decay (in the utility scale), we can get divergence.

   5. What does this mean for your rule?

      Your rule is: "run every payout through a concave utility function instead of raw dollars, and this particular kind of infinite-expectation trap can never come up again"

      The above example shows that it is still possible to design a gamble that yields infinite expected utility even after applying a concave utility function. Therefore, the rule does not hold in general.

      However, note that in practice, the payouts in real-world gambles are bounded (by the wealth of the house, for instance) and hence the utility will be bounded. So in a bounded world, the expected utility will be finite.

      Also, note that the example I constructed has payouts that grow extremely fast (double exponentially). Such gambles are not common and may not be feasible in reality.

   6. A more refined rule:

      If we require that the utility function is bounded above (which is not true for log, sqrt, or x^c), then the expected utility will always be finite because the utility of any payout is at most some constant M. Then:

          EU <= M * sum p_n = M < ∞.

      However, bounded utility functions are sometimes criticized because they lead to the "paradox of the martingale" (see for example the discussion in Martin, 2011). Also, they are not always realistic.

      Alternatively, you might impose a condition on the gamble: that the payouts do not grow too fast relative to the decay of the probabilities and the growth rate of the utility function.

      But this would require a case-by-case analysis.

   7. Conclusion:

      The rule that using a concave utility function always prevents infinite expected utility is not true in general. It depends on the specific gamble and the specific utility function.

      However, for typical gambles that you might encounter in real life (with bounded payouts, or at least payouts that do not grow at an astronomical rate), the expected utility will be finite when using a concave utility function.

      Therefore, for practical purposes, your rule is a good guideline. But be aware that in theory, it is possible to construct pathological gambles that yield infinite expected utility even after applying a concave utility function.

      If you are concerned about such pathological cases, you might consider using a utility function that is bounded above (like u(x) = 1 - exp(-a*x) for a>0, which is the exponential utility function and is bounded above by 1). This ensures that the expected utility is always finite.

      Alternatively, if you are only dealing with gambles that have a finite maximum possible payout (which is the case in the real world), then any continuous utility function will be bounded on the interval [0, M] (by the extreme value theorem) and hence the expected utility will be finite.

      So in summary:

          - In the real world, where payouts are bounded, the rule is safe.
          - In theoretical settings, if you allow unbounded payouts, then the rule may fail for some gambles unless you use a bounded utility function.

      Therefore, if you are using this rule for real decisions and the gambles you are considering have a maximum possible payout (or at least the payouts are not designed to grow double exponentially), then you are safe. Otherwise, you might want to choose a bounded utility function.

      I hope this helps.
answer: |-
  The rule you've derived from Bernoulli's resolution—applying a concave utility function to payouts to avoid infinite expectations—is a powerful and rational principle for real-world decisions, but **it does not hold up in absolute generality for all possible bets**. While it robustly resolves the St. Petersburg paradox and many similar scenarios, certain pathological bet structures can still produce infinite expected utility, even with concave utility. Here's a breakdown:

  ### 1. **Why the Rule Works for St. Petersburg (and Many Bets)**  
     - In St. Petersburg, the payout \(2^n\) grows exponentially while the probability \(1/2^n\) decays exponentially. With logarithmic utility \(u(x) = \ln(x)\), the expected utility becomes:  
       \[
       \sum_{n=1}^{\infty} \frac{1}{2^n} \ln(2^n) = \ln(2) \sum_{n=1}^{\infty} n \left(\frac{1}{2}\right)^n = 2\ln(2) < \infty.
       \]
     - Concave utility (e.g., \(\ln(x)\), \(\sqrt{x}\), \(x^c\) for \(0 < c < 1\)) dampens large payouts, often taming divergent sums. For most real-world bets (e.g., lotteries, investments), payouts grow slower than probabilities decay, ensuring finite expected utility.

  ### 2. **Where the Rule Can Fail: Pathological Cases**  
     If a bet’s payouts grow **sufficiently faster** than the utility function can suppress, expected utility may still diverge. For example:  
     - **Utility function:** \(u(x) = \ln(x)\) (concave and unbounded).  
     - **Bet structure:** Payout \(x_n = e^{2^n}\) (double exponential) with probability \(p_n = \frac{1}{2^n}\).  
       Expected utility:  
       \[
       \sum_{n=1}^{\infty} \frac{1}{2^n} \ln\left(e^{2^n}\right) = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty.
       \]  
       Here, payouts grow so fast that even log utility fails to bound the sum.  

  ### 3. **Broader Implications**  
     - **Bounded utility functions** (e.g., \(u(x) = 1 - e^{-kx}\)) guarantee finite expectations for all bets, as \(u(x) \leq M\) for some \(M\). However, they may not reflect real risk preferences (e.g., rejecting all high-risk investments unrealistically).  
     - **Unbounded concave utility** (e.g., \(\ln(x)\)) is vulnerable to "super-exponential" payout growth, but such bets are artificial and implausible in practice. No real casino or market offers \(e^{2^n}\) prizes.  

  ### 4. **Practical Advice for Real Decisions**  
     Your rule **remains excellent guidance** for real-world applications:  
     - **Realism over pathology:** In finance, gambling, or insurance, payouts are bounded (e.g., a lottery’s maximum prize, a stock’s finite upside). Concave utility will yield finite expectations.  
     - **Risk management:** Concave utility formalizes diminishing returns and risk aversion, protecting you from overvaluing extreme long shots (e.g., buying lottery tickets at inflated prices).  
     - **Robustness:** For bets resembling St. Petersburg (exponential payouts/probabilities), concave utility ensures convergence.  

  ### Conclusion  
  Bernoulli’s insight transforms irrational infinite expectations into finite, manageable decisions for virtually all practical scenarios. While **mathematically unbounded concave utility can be defeated by contrived bets**, these are irrelevant to real-life choices. Your rule is sound for personal finance, investing, and gambling—where payouts are constrained and utility reasonably models human preferences.  

  **Recommendation:** Use concave utility (e.g., \(\ln(1 + \text{wealth})\)) for real decisions, but remain aware that theoretical extremes exist. For absolute safety in pathological cases, consider bounded utility—though this is rarely necessary. Your approach is rational and empirically validated.
