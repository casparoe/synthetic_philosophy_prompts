  Hmm, they're asking for philosophical mechanics, not just textbook answers. That means I need to carefully unpack both the naive immortality claim and its sophisticated critiques. The user mentions Deutsch/Wallace decision theory - that's advanced stuff, so they're probably well-read in quantum foundations. 

  First, the core tension: MWI says all possibilities happen, but not equally "real." Born rule gives weights to branches. In quantum suicide, each survival branch has exponentially decreasing weight as rounds increase. So subjectively, should you expect to be in a surviving branch? 

  The naive immortality argument ignores weights entirely. But that's like saying you should expect to win the lottery because there's a world where you do. The user is right to question this. 

  Now the meat: Deutsch-Wallace decision theory. This is where it gets subtle. Their approach uses rationality constraints to derive Born rule weights as the only coherent way to value outcomes. If correct, it means rational agents must care about branch weights. 

  But here's the rub - D-W is controversial. Critics say it smuggles in probabilistic assumptions. The user needs to know this isn't settled philosophy. 

  For quantum suicide specifically: even with D-W, your future selves in surviving branches would be rationally certain they survived, but that's different from pre-suicide you expecting survival. The pre-suicide agent faces all possible futures with their weights. 

  Important nuance: the "I" who survives isn't more real - just one of many future versions. The user seems to grasp this, but it's worth emphasizing how personal identity works in branching scenarios. 

  Finally, the practical takeaway: Born weights matter for rational action. If the user were actually considering quantum suicide (hopefully not!), D-W would say the tiny survival weight shouldn't comfort them. 

