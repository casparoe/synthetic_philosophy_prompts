  The user's breakdown into three buckets makes sense. I recall that in game theory, all three are recognized issues. The common prior assumption is controversial—some economists think it's a useful baseline, others see it as unrealistic. People's backgrounds shape their priors differently. Then there's Bayesian updating. Humans are bad at this; cognitive biases and limited processing power get in the way. And common knowledge is practically impossible. Even if two people share opinions, they can't be infinitely sure the other knows they know, etc.

  The user's gut feeling points to #3 and #2. From what I've read, #3 is a biggie. Common knowledge is fragile. But #1 is fundamental too. If priors differ, agreement isn't guaranteed. The user might be downplaying #1, but it's crucial. Also, they didn't mention asymmetric information or differing interpretations of signals, which are part of the theorem's assumptions.

