answer: |-
  Here's a step-by-step breakdown of Sidgwick's argument and his objection to Hume:

  1.  **Hume's Core Argument (As Sidgwick Presents It):**
      *   When judging testimony about a marvel (miracle/paranormal event), we weigh two improbabilities:
          *   (A) The improbability that the marvel *actually occurred* (given it's "contrary to experience").
          *   (B) The improbability that the witnesses' testimony *is false* (mistaken or deceptive).
      *   Hume asserts: "It is contrary to experience that miracles should be true, and not contrary to experience that testimony should be false."
      *   **Hume's Implication:** Improbability (A) is *always* vastly greater than improbability (B). The marvel's violation of "uniform experience" is so extreme that it outweighs *any* level of apparent reliability in the testimony. We should *always* reject the marvel and accept that the testimony is flawed.

  2.  **Sidgwick's Key Move: Redefining "Contrary to Experience"**
      *   Sidgwick argues that when we call a marvel "contrary to experience," we **do not** mean it is *impossible* or *inherently false*.
      *   We **only** mean it is "unlike previous experience" or specifically, "unlike that portion of experience which has been collected, handed down, and systematised by competent persons."
      *   **Sidgwick's Conclusion:** "Contrary to experience" simply means **"entirely novel and strange."**

  3.  **Sidgwick's Objection to Hume (The Core Point):**
      *   Hume's argument **fails because it equates "novel and strange" with "impossible or maximally improbable."** Sidgwick argues this is a fundamental error.
      *   **Historical Evidence:** Human history is full of phenomena that were initially "entirely novel and strange" (and thus "contrary to *then-current* systematized experience") but were later verified and became familiar (e.g., magnetism, meteorites, germs, electromagnetic waves, continental drift). People encountering kangaroos for the first time would have found them "contrary to experience."
      *   **The Problem:** If something being "novel and strange" automatically meant it was so improbable as to *always* outweigh testimony, then *all* genuine discoveries of genuinely new phenomena would have been (and historically *were*) wrongly rejected. Hume's rule would stifle scientific progress.

  4.  **What Work is Sidgwick's Move Doing?**
      *   **Severely Weakening Improbability (A):** Sidgwick drastically reduces the *presumed weight* of the improbability that the marvel occurred. He argues it's not a near-infinite improbability based on inherent impossibility, but merely the lesser improbability of encountering something genuinely new that hasn't been incorporated into established science/history yet.
      *   **Creating Space for Testimony:** By lowering Improbability (A) from "effectively infinite" (Hume) to "significant but finite and potentially surmountable" (Sidgwick), Sidgwick makes it *possible* for sufficiently strong testimony (low Improbability B) to *outweigh* the novelty of the event. Hume's rule ("always reject the marvel") is no longer absolute.
      *   **Highlighting Incommensurability:** Sidgwick reinforces his earlier point that weighing (A) and (B) is inherently difficult because they are "quite diverse." He argues Hume offers false precision ("intellectual scales") by treating the novelty-based improbability as if it were an absolute, known quantity easily outweighing testimony-based improbability.
      *   **Justifying Psychical Research:** This move is crucial for the SPR's mission. If marvels are *inherently* impossible (Hume's effective position), investigation is pointless. But if they are merely *novel*, then systematic investigation using careful methods (like those the SPR aimed for) *is* justified to see if this novelty can be verified and incorporated into established knowledge, just like magnetism or germs.

  5.  **Is Sidgwick Saying Hume is Wrong or Just Weaker?**
      *   Sidgwick is arguing that **Hume's principle is fundamentally flawed and too strong.** He doesn't deny that novelty *is* a factor against believing a marvel. He *agrees* that something being novel *does* make it initially improbable.
      *   **However, he strenuously objects to Hume's leap:** that this novelty-based improbability is *so immense* that it *always and automatically* outweighs *any* improbability of false testimony, no matter how credible and numerous the witnesses.
      *   Sidgwick's redefinition shows that "contrary to experience" (novelty) **is not the knockout blow Hume claimed it was.** It's a significant factor, but one that can, in principle, be overcome by sufficiently strong evidence (testimony). Hume's argument is not just "weaker than it looks," but **based on a mistaken conflation of novelty with practical impossibility.**

  **In Summary:**

  Sidgwick objects that Hume misinterprets "contrary to experience" as implying near-impossibility, when it really just means "novel and unfamiliar." History proves that genuinely novel phenomena *do* occur. Therefore, the improbability of a marvel is *not* automatically so vast that it must always outweigh the improbability of false testimony. Novelty is a strong reason for skepticism, but not an insurmountable one. This opens the door for investigating paranormal claims based on testimony, rather than dismissing them out of hand as Hume's rule dictates. Sidgwick's move redefines the problem from "Is this impossible?" to "Is this sufficiently well-attested *despite* its novelty to warrant belief or further investigation?"
