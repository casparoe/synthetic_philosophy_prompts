prompt: |-
  So a few of us from a rationalist-adjacent Discord run recurring side bets at meetups (sports outcomes, elections, random nerdy stuff), and ages ago we agreed to size wagers as a % of a personal bankroll each person tracks, instead of fixed dollar amounts. Theres a running argument about how big that % should be though. Priya's take: work out whatever % maximizes your expected winnings over many bets and just bet that, scaling up with your edge, since leaving EV on the table is silly. Dave bets noticeably less than that using some formula he swears by, and even shades that number down even further because he says he's never fully sure of his edge estimate, which just makes Priya more convinced he's being timid. Whenever I've pushed him on why his number should beat straightforward EV maximization though, he kinda hand-waves it. Except I've watched this play out over a bunch of sessions now, and Priya's approach does seem to wipe people out eventually even though every single bet is +EV. So is Priya's reasoning actually flawed, or just differently risky? And is there a real principled case for Dave's more conservative number (both the base formula and the extra shading), or is he just risk-averse and dressing it up in math?
reasoning: |-
  Okay, the user is part of a rationalist-adjacent Discord group that places side bets using a percentage of personal bankrolls. There's a debate between Priya, who wants to maximize expected value (EV) by betting a certain percentage based on edge, and Dave, who bets less and further reduces his bets due to uncertainty. Priya's approach seems to lead to wipeouts despite +EV bets, which puzzles the user. They want to know if Priya's reasoning is flawed, if Dave's conservative approach has a principled basis, or if Dave is just risk-averse.

  First, I need to recall the Kelly Criterion. Kelly maximizes long-term growth by betting a fraction of the bankroll equal to (bp - q)/b, where b is the odds, p is the win probability, and q is the loss probability. Priya is essentially using Kelly without adjustments. However, Kelly assumes exact knowledge of probabilities and no uncertainty. Dave's shading down accounts for uncertainty in edge estimation, which is a real concern.

  Priya's wipeouts suggest overbetting. Even if each bet is +EV, betting too high a fraction risks ruin due to variance. The Kelly Criterion balances growth and risk, but overbetting reduces growth and increases ruin risk. Dave's approach might be using fractional Kelly (betting a fraction of the Kelly percentage) to mitigate risk, especially with uncertain probabilities.

  Dave's extra shading for uncertainty makes sense. If edge estimates are inaccurate, the optimal fraction decreases. Models like Bayesian approaches or confidence intervals adjust Kelly for uncertainty. So Dave isn't just risk-averse; there's math behind adjusting for estimation error.

  The user might also care about practical implications. They've observed wipeouts, so understanding the math behind Dave's method could prevent that. The deeper need is to find a sustainable betting strategy that avoids ruin while growing the bankroll. They might want to reconcile the theoretical EV maximization with real-world uncertainty, ensuring long-term participation without busting out.
answer: |-
  This is a classic clash between **naive EV maximization** and **bankroll management under uncertainty**, and Dave's caution (even if poorly articulated) is grounded in **very real mathematical principles**. Priya's approach is fundamentally flawed for repeated betting over time, while Dave's (assuming he's using something akin to "Fractional Kelly" plus uncertainty shading) is far more robust. Let's break it down:

  ### 1. The Flaw in Priya's "Maximize EV Per Bet" Approach
  *   **The Problem:** Maximizing the *expected value* of each individual bet *ignores the path dependency of your bankroll*. Betting a large percentage of your roll on a +EV bet *does* maximize the expected dollar value *of that single bet*. However, if you lose, your bankroll shrinks dramatically, and future bets (even with the same edge) generate less absolute EV because they are sized relative to a smaller base. Losing big hurts your ability to capitalize on future opportunities far more than winning big helps it.
  *   **The Result - Ruin & Suboptimal Growth:** Betting too large a fraction inevitably leads to long losing streaks (due to variance) that cripple or wipe out the bankroll ("risk of ruin"). Even if you avoid ruin, overbetting *reduces* your long-term compound growth rate compared to a more optimal fraction. Priya observes "every bet is +EV," which is true for the *first* bet, but after a loss, the *effective* EV for the *sequence* can be negative if the bet size was too large relative to the edge and variance.
  *   **The Mathematical Solution: The Kelly Criterion**
      *   This is the **principled answer** to "what % maximizes long-term bankroll growth?" for repeated bets where you can reinvest winnings.
      *   **Formula:** `f* = (bp - q) / b`
          *   `f*` = Optimal fraction of bankroll to bet.
          *   `b` = Net odds received on the bet (e.g., if you bet $1 to win $2 net profit, `b = 2`).
          *   `p` = Probability of winning.
          *   `q` = Probability of losing (`1 - p`).
          *   **Edge:** `(bp - q)` is your *edge* expressed as a decimal (e.g., 0.05 for a 5% edge).
      *   **Example:** Fair coin flip (`p=0.5, q=0.5`), but you get paid 2.2:1 (`b = 2.2`) if you win.
          *   Edge = `(2.2 * 0.5) - 0.5` = `1.1 - 0.5` = `0.6` (a 60% edge!).
          *   `f* = 0.6 / 2.2 ≈ 0.2727` (Bet **27.27%** of your bankroll).
      *   **Why Kelly Works:** It maximizes the *geometric mean* growth rate of your bankroll. Betting more than Kelly increases your *risk of ruin* and *lowers* your long-term growth rate. Betting less than Kelly lowers your growth rate but also lowers risk.

  ### 2. Dave's Conservative Approach: The Principled Case
  Dave's behavior strongly suggests he's using **Fractional Kelly** and **uncertainty discounting**, which are mathematically sound extensions of Kelly:
  *   **Fractional Kelly (e.g., "Half-Kelly"):**
      *   **Concept:** Bet a fraction of the Kelly optimal bet (e.g., `f = k * f*`, where `k` is often 0.5 or 0.7).
      *   **Why it's Principled:**
          *   **Reduced Volatility & Risk of Ruin:** It significantly lowers the swings in your bankroll and makes wipeout astronomically less likely. The reduction in growth rate is often surprisingly small compared to the drastic reduction in risk. (Half-Kelly typically only reduces growth by ~25% while cutting risk dramatically).
          *   **Robustness to Mispricing:** If your edge estimate (`p`) is slightly too optimistic, betting full Kelly can be disastrous. Fractional Kelly is much more forgiving.
          *   **Psychological Comfort:** Lower volatility makes it easier to stick to the strategy consistently.
  *   **Shading Down for Uncertainty (The "Extra Shading"):**
      *   **This is CRITICAL and HIGHLY Principled.** Priya's flaw is assuming she *knows* the true `p` and `b` (especially `p`). Dave recognizes he doesn't.
      *   **Sources of Uncertainty:**
          *   **Imperfect Information:** Your probability estimate (`p`) is almost always an *estimate* based on limited data, models, or intuition, not a known truth. The true probability is `p_true = p_estimate + ε` (where `ε` is an error term).
          *   **Model Risk:** Your model for estimating `p` might be fundamentally flawed or miss key factors.
          *   **Changing Conditions:** Probabilities can shift between when you place the bet and when it resolves.
      *   **Mathematical Justification for Shading:**
          1.  **Overestimation is Catastrophic:** If you *overestimate* your edge (think `p_estimate > p_true`), betting the full Kelly fraction based on `p_estimate` means you are *overbetting* relative to the true Kelly fraction. Overbetting rapidly increases risk of ruin and destroys growth.
          2.  **Underestimation is Less Harmful:** If you *underestimate* your edge (`p_estimate < p_true`), you are *underbetting* relative to the true Kelly fraction. This leaves some growth on the table but doesn't risk ruin.
          3.  **Bayesian Approaches:** Rigorous methods involve treating `p` as a probability *distribution* (e.g., a Beta distribution based on your prior belief and observed evidence) rather than a point estimate. You then calculate a "Bayesian Kelly" fraction, which inherently discounts for uncertainty. The less data/confidence you have, the wider the distribution and the lower the optimal bet.
          4.  **Rule of Thumb:** A common heuristic is to reduce your estimated edge (`bp - q`) by some factor proportional to your uncertainty before plugging it into the Kelly formula. Dave's "shading" is a practical implementation of this.
      *   **Principled Risk Management:** Shading for uncertainty isn't timidity; it's acknowledging the fundamental difference between *risk* (known probabilities) and *Knightian uncertainty* (unknown probabilities). Betting full Kelly based on a point estimate is reckless when facing true uncertainty.

  ### 3. Why Priya Wipes Out & Dave Doesn't

  *   **Priya:** Bets a large % (likely exceeding Kelly based on her *estimated* edge). Variance inevitably hits. A few losses in a row decimate her bankroll. She might rebuild slightly on wins, but the next losing streak hits harder because she's still betting a large % of a *smaller* roll. Eventually, variance wins, and she busts or is severely crippled. Her *sequence* EV is negative due to overbetting, even if each individual bet has positive *point estimate* EV.
  *   **Dave:** Bets a fraction (likely Fractional Kelly) of a *discounted* edge estimate. His bets are smaller relative to his roll. Losses hurt less. Wins compound steadily. He avoids deep drawdowns and ruin. His long-term compound growth rate, *accounting for the uncertainty he faces*, is higher than Priya's *realized* growth rate (which is often negative due to busting).

  ### Conclusion

  *   **Priya's Reasoning *is* Flawed:** Naive EV maximization per bet is mathematically incorrect for repeated betting with reinvestment. It ignores bankroll path dependency, variance, and crucially, the risk of ruin. The Kelly Criterion provides the correct foundation for maximizing *long-term compounded growth*.
  *   **Dave's Approach is Principled (Assuming He's Doing Something Like This):** Betting less than the point-estimate Kelly fraction (Fractional Kelly) and further shading down due to uncertainty is **not mere risk aversion; it's mathematically superior risk management** under real-world conditions where probabilities are estimates, not known truths. It prioritizes survival and robust growth over maximizing a theoretical point estimate.
  *   **Recommendation for Your Group:**
      1.  **Learn Kelly:** Understand the Kelly Criterion deeply. It's the bedrock.
      2.  **Embrace Fractional Kelly:** Decide on a fraction (e.g., 1/2, 1/3, 1/4 Kelly) as a group standard for sanity and reduced volatility. This addresses Priya's overbetting.
      3.  **Formalize Uncertainty Discounting:** Discuss *how* to estimate `p` and `b`. Acknowledge uncertainty explicitly. Use ranges or confidence levels. Agree on a discounting rule (e.g., "Reduce estimated edge by 20% for low-confidence bets, 40% for medium, 60% for high"). This validates Dave's shading.
      4.  **Track Results:** Keep detailed records of bets (estimated `p`, `b`, Kelly %, actual bet %, outcome). This provides data to refine your uncertainty discounting and fractional Kelly level over time.

  Priya is leaving more than EV on the table; she's leaving her entire bankroll on the table periodically. Dave's conservatism, grounded in the realities of variance and uncertainty, is the rational path to sustained participation and growth in your side bet ecosystem. He might not articulate it perfectly, but his instincts (and formula) are pointing him in the right direction.
