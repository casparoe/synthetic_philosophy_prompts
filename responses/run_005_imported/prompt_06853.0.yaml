  Okay, the user is grappling with a dense passage from Hobbes's *Six Lessons*, specifically his distinction between demonstrable and indemonstrable arts. They're puzzled by two main things: first, how Hobbes can equate geometric construction with political founding under a single notion of "making," and second, why Hobbes's own failures in geometry and political theory don't undermine his claim that such "made" subjects guarantee demonstrative certainty. 

  Hmm, the user clearly isn't looking for a simple paraphrase—they want to wrestle with the conceptual tension. That's sophisticated. They mention Hobbes's materialism and causal theory of science, so they likely have some background in early modern philosophy. The historical counterexamples (Hobbes's failed quadrature and contested political theory) suggest they're probing whether Hobbes's epistemology is defensible or self-serving. 

  First puzzle: Is "construction" really univocal? For geometry, it's literal fabrication via rules/compasses. For politics, it's institutional creation via covenant. But in Hobbes's mechanical worldview, both reduce to matter in motion. Drawing a circle and establishing sovereignty both involve assembling components (lines/figures or humans/covenants) according to definable operations. The key is voluntarism—we control the starting definitions because we invent the artifacts. That's why both contrast with natural philosophy, where causes are inferred from effects. 

  Second puzzle: The gap between theory and practice. Here Hobbes would likely blame human error, not his principle. For geometry: his quadrature failed because he violated geometric rules (e.g., assuming incommensurable arcs were equal), proving only that he botched the "making," not that geometric demonstration is flawed. For politics: contested philosophies arise when thinkers ignore or misapply the "construction rules" (e.g., failing to derive sovereignty rigorously from the state of nature). Actual agreement isn't guaranteed because people are irrational or biased—but the *potential* for certainty exists if the rules are followed. 

  The user might be hinting at a deeper irony: Hobbes positions himself as the arbiter of correct "making" in both fields, yet his own work was rejected. But for Hobbes, that's just evidence others failed to grasp his axiomatic method. Still, it's a fair critique—his criterion for "correct construction" feels circular when he alone decides what counts as valid. Maybe that's the unspoken tension the user senses.
answer: |-
  Your questions cut to the heart of Hobbes's epistemology and its tension with his practical failures. Let's unpack the conceptual core and address the awkward historical reality using Hobbes's own framework:

  **1. The Unified Notion of "Construction":**
  Hobbes's materialism and causal theory *do* provide a single, principled foundation for linking geometric and political construction. The key lies in his **voluntarist, artifactual conception of science**:

  *   **Materialist Causation & Definition:** For Hobbes, true scientific knowledge requires knowing the *generating cause* of a thing. A correct definition isn't just a description; it's an account of *how the thing is made* (its generation). Science is the deductive chain of consequences from this causal definition.
  *   **Artifactual Epistemology:** The only way to *guarantee* we have certain knowledge of the generating cause is if *we ourselves are the cause*. When we construct the object, we control and know its origin completely.
  *   **Construction as Generation:** Both drawing a figure and founding a commonwealth are acts of *generation according to definable rules*:
      *   **Geometry:** We generate figures using stipulated instruments (compass, straightedge) and operations defined by Euclid's postulates. The rules (e.g., "a circle is the set of points equidistant from a center") *are* the generating cause. We know the cause because we impose it.
      *   **Commonwealth:** We generate the state through a defined operation: the covenant. Individuals, motivated by the fear of violent death (a mechanistic cause), mutually transfer rights to a sovereign according to a specific logical operation (the social contract). The generating cause (the covenant) is known because it is a human invention, a deliberate act of will following a defined procedure. The sovereign and laws are artifacts of this construction.
  *   **The Common Core:** In both cases:
      *   The subject matter is an *artifact*.
      *   Its essential properties and generation are defined by *stipulated rules* (geometric postulates, laws of nature/politics).
      *   The scientist/demonstrator *is the artificer* or reasons *as if* they were the artificer who imposed these rules.
      *   Demonstration is the *deduction of necessary consequences* from these foundational rules of construction. It's analyzing the logical implications of our own definitions and operations.

  The "principled notion" is thus **voluntarist generation according to stipulation**. We create the object (figure or state) *ex nihilo* (conceptually) by our definitions and operations. This complete control over the generative cause is what makes deduction from first principles possible and certain.

  **2. The Historical Awkwardness & Hobbes's Defense:**
  The objection is powerful: If "making" guarantees demonstrability and certainty, why were Hobbes's geometry *and* politics hotly contested, and his geometry demonstrably *wrong*? Hobbes would likely defend himself using his own theoretical resources by appealing to **errors in execution, not flaws in principle**:

  *   **Geometry (The Quadrature Failure):**
      *   **Error in Construction:** Hobbes would argue his quadrature wasn't a *true* geometric construction according to the accepted (Euclidean) rules. Wallis and others proved he had smuggled in assumptions or made invalid steps *not* derivable from the foundational postulates and permissible operations. His "making" was flawed; he didn't correctly follow the rules of generation he himself endorsed for geometry.
      *   **Failure of Reason, Not Principle:** The certainty of geometry stems from correct construction and deduction. Hobbes's error was a failure *in applying* the method, not a failure *of* the method. The quadrature was rejected *because* it violated the demonstrable principles of geometry. This rejection, ironically, *proves* geometry's demonstrability – errors *can* be definitively shown.
      *   **Appeal to Correct Reason:** He would claim the "competent geometers" were blinded by prejudice or failed to grasp his (erroneous) reasoning. His certainty was subjective, not objective, stemming from a *mistaken* belief he had correctly constructed and deduced.

  *   **Civil Philosophy (Contested Politics):**
      *   **Error in Understanding/Application:** Hobbes would argue that critics fail to grasp the true generating cause (the covenant based on mechanistic passions) or the necessary logical consequences flowing from it (absolute sovereignty, indivisibility of power, etc.). Their disagreements stem from:
          *   **False Premises:** Basing philosophy on tradition, scripture, or Aristotelian metaphysics instead of correct definitions and the mechanics of human passion and reason.
          *   **Incorrect Deduction:** Failing to follow the logical chain from the state of nature through the covenant to the powers of the sovereign.
          *   **Passion over Reason:** Allowing fear, ambition, or institutional loyalty (e.g., to Church or Parliament) to cloud rational understanding of the necessary construction.
      *   **Contestation ≠ Indemonstrability:** The *fact* of disagreement doesn't negate the *potential* for demonstration. Just as geometric truths exist even if someone miscalculates, the logical necessity of the sovereign's powers exists even if people misunderstand or reject it. The chaos of the English Civil War, for Hobbes, *was* proof of the catastrophic consequences of *not* understanding and adhering to the demonstrable principles of political construction.
      *   **"We Make It" ≠ "We All Agree Now":** Hobbes doesn't claim that because we *did* make commonwealths (historically), everyone *currently* understands how or why they work. He claims that *because* its cause is a human artifact (covenant), its science *can* be known with geometric certainty *if* we reason correctly from the true generating cause. Actual historical covenants might be messy, but the *scientific model* of the covenant is the clear, demonstrable foundation.

  **Hobbes's Theoretical Block:** To counter the objection, Hobbes relies on a strict separation:

  1.  **The Principle:** Subjects whose generating causes we stipulate and control *are* capable of demonstration (Geometry, Politics).
  2.  **The Practice:** Individual attempts at demonstration (his quadrature, his *Leviathan*) can still contain errors in *executing* the construction or deduction. These errors are failures of the *artist*, not the *art*. Competent practitioners following the rules correctly *will* agree. Disagreement arises from incompetence, flawed premises, or irrational interference (passions, interests). Natural philosophy is different: its *inherent* lack of known generating causes means even correct reasoning can only yield "what may be," not "what is," guaranteeing perennial contestation.

  **In essence:** Hobbes's failures don't disprove his principle; they exemplify the human difficulty in *perfectly applying* the principle. The certainty lies in the *method* (deduction from known causes of artifacts), not in the infallibility of any particular practitioner. Geometry *is* certain *when done correctly*; his quadrature simply wasn't done correctly. Politics *is* demonstrable; the persistent disagreement merely proves how often humans fail to reason correctly from first principles. The "making" guarantees the *possibility* of absolute certainty, not its universal achievement.
