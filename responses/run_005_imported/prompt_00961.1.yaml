              We know that c1 and c2 must be 1 (since in w1 and w2, A and B are true, so the conditional should be true) and c3 must be 0 (because in w3, A is true and B is false, so the conditional is false). Then we have:

                  0.2*1 + 0.2*1 + 0.3*0 = 0.4, which matches.

          Now, for the whole space, we require:

              P(A→B) = 0.2*1 + 0.2*1 + 0.3*0 + 0.3*c4 = 0.4 + 0.3*c4

              and this must equal P(B|A)=0.4/0.7≈0.5714.

              So: 0.4 + 0.3*c4 = 0.5714
              => 0.3*c4 = 0.1714
              => c4 = 0.1714 / 0.3 ≈ 0.5713

          But c4 must be 0 or 1, not 0.5713. Contradiction.

     Therefore, we have a concrete counterexample with 4 worlds and specific probabilities.

     Steps:

       1. Define the space:
            w1: P=0.2, A=true, B=true
            w2: P=0.2, A=true, B=true
            w3: P=0.3, A=true, B=false
            w4: P=0.3, A=false

       2. We set the conditional A→B:
            In worlds where A is true: we must have w1: true, w2: true, w3: false.
            In w4 (A false), we would need to assign either true or false, but neither works because:

               If c4=0: then P(A→B)=0.4+0.3*0=0.4, but we need 0.5714 -> not equal.

               If c4=1: then P(A→B)=0.4+0.3=0.7, which is not 0.5714.

       3. Therefore, no assignment works.

     This shows the impossibility.

     Why is this bad news for the Equation as a theory of indicative conditionals?

          The Equation (P(A→B)=P(B|A)) is attractive because it captures the intuition that we evaluate the conditional by hypothetically assuming the antecedent. However, the requirement that this equality be preserved under conditionalization on new evidence is very natural: as we learn more, our conditional probabilities update, and so should the probabilities of our conditionals. But Lewis showed that this preservation leads to a contradiction unless the conditional is independent of its antecedent, which is not generally true for indicative conditionals. In our example, we see that no assignment of truth values to the conditional can satisfy the Equation and its preservation. Therefore, the Equation cannot be part of a coherent truth-conditional semantics for indicative conditionals that is compatible with probability updating.

     In summary, the triviality result shows that there is no non-trivial probability space that assigns truth values to indicative conditionals as propositions in a way that satisfies the Equation and preserves it under conditionalization. This forces us to either abandon the truth-conditional approach (e.g., by saying that conditionals don't express propositions) or to abandon the Equation as a general principle.

