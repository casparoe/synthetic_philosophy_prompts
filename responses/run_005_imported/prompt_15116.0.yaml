answer: |-
  Here's the dialogue you requested, staged in the cramped back room of "Folios & Foundlings Used Books," where Martha (a retired Classics professor) and Leo (a perpetually ABD grad student in Medieval Philosophy) are inevitably drawn to the same dog-eared theology section every other Thursday.

  **Characters:**
  *   **Martha:** 70s, sharp eyes behind thick glasses, carries a well-worn leather satchel. Favors the *On Kingship* position.
  *   **Leo:** 30s, earnest, slightly rumpled, gestures with a battered copy of Aquinas's *Sentences Commentary*. Favors the usurper/bad-king distinction.

  **(The scene: Dust motes dance in the shaft of light from the high window. Martha is examining a volume of Suarez. Leo approaches, clutching his Aquinas.)**

  **Leo:** Martha! Just the person. I was re-reading the *Sentences Commentary*, Book II, Distinction 44, Question 2, Article 2… you know the bit.
  **Martha:** (Without looking up) The "tyrant-slaying praise" passage? Leo, we’ve been over this. *On Kingship* is his mature, practical political treatise. The *Sentences Commentary* is early work, a *student exercise* commenting on Peter Lombard. You can’t weigh them equally.
  **Leo:** But that’s precisely why it’s fascinating! It shows his *reasoning*, the bones of the argument before he wrapped it in caution for a king. He draws a *crucial* line: “*When anyone usurps dominion, he does not commit an injustice solely against some particular person, but against the whole community*.” Killing such a usurper isn't murder; it's removing a public enemy. He *explicitly* says the killer "is *praised and rewarded*" for freeing the people!
  **Martha:** (Closes Suarez, turns to Leo) He also says that *immediately after* praising the slayer: “*unless perhaps it is expedient for the common good that the tyrant be tolerated.*” Caution, Leo! Always caution. And look at *On Kingship*, Chapter 6. He lays out the *process*: endure lesser evils, wait for public authority – meaning the community itself, or a higher power like the Church or a neighboring prince acting *for* the community. A *private person* acting alone? He calls it "perilous"! He literally says it "*generally*" leads to worse evils. The risk isn't abstract – a failed attempt hardens the tyrant, or you get someone *worse* seizing power in the chaos. Vigilantism unravels the fabric.
  **Leo:** I agree on the *legitimate* king gone bad! Aquinas calls that a "tyrant in administration." *That's* where the caution applies. Why? Because he *had* title. Removing him requires due process, judgment by the community or its representatives. It’s about *legitimacy*, Martha. The usurper *never had it*. He’s a robber on a grand scale, sitting in the king’s chair by force and fraud. Public authority *cannot* function against such a man because *he is the perversion of public authority itself*. Who constitutes the "public authority" to judge him if he’s violently suppressed the legitimate structures? Sometimes, the *only* public authority left is the people’s inherent right to self-defense against an aggressor.
  **Martha:** But who *decides* he's a usurper? That’s the rub! Is it the noble with a grudge? The merchant whose taxes are too high? The peasant stirred by a fiery preacher? Aquinas’s fear in *On Kingship* is the precedent. If you open the door to *any* private person judging the ruler a usurper and acting, you invite endless coups, vendettas, and instability. Every deposed king’s faction will scream "usurper!" at the victor. How do you objectively define "no real claim"? Hereditary right? Election? Conquest accepted by custom? It’s a Pandora’s Box. That’s why he insists the *community*, acting collectively or through its *recognized* residual structures (like nobles, bishops, ancient councils), must authorize action. The private citizen’s role is to endure, petition, and *support* that public action, not initiate lethal force.
  **Leo:** But Aquinas himself provides the definition! The usurper gains power "*non ex ordinatione divina vel humana, sed per violentiam*" – not by divine or human ordinance, but by violence. It’s not subjective. It’s a *fact* of how power was seized, contravening the established lawful means. Think King John versus the Angevins – John had title, even if he abused it. But a warlord who murders the royal family and seizes the throne? That’s pure usurpation. In that *specific* case, Aquinas *does* seem to grant the private person the role of liberator, precisely *because* the normal mechanisms of public authority are nullified *by the usurper's own act*. The killer isn't acting on a *personal* grievance but against a clear, objective enemy of the *res publica*. The "praise" Aquinas offers isn't for disobedience; it's for a public service akin to killing a rampaging beast.
  **Martha:** You isolate the "praise" sentence. Read the *entire* context in the *Sentences*. He’s primarily discussing *obedience* and *disobedience* to authority. The "praise" example is almost an aside, a limiting case illustrating when authority lacks legitimacy *ab initio*. He doesn’t elaborate on *how* the killing happens or *who* does it. More importantly, he immediately tempers it with the "unless expedient" clause. Now, contrast this with *On Kingship*, written *for a king*, where he spends *pages* detailing the dangers of private action. He emphasizes the tyrant *might* reform, that the cure (private killing) is often worse than the disease, and that God sometimes permits tyranny as punishment – implying resignation, not assassination. This is his *developed* thought for the messy reality of governance. The *Sentences* passage is a theoretical point about legitimacy; *On Kingship* is a practical manual forbidding freelance tyrannicide.
  **Leo:** But the distinction *is* the practical application! Recognizing the usurper *is* the key. Aquinas isn’t naive. He knows legitimate structures can be utterly shattered. In that vacuum, the natural law right of self-defense and defense of the community kicks in. He wouldn’t license a mob, but a single, resolute act by a private person *can* be the spark that restores public order *if* it targets the clear usurper. The caution in *On Kingship* applies overwhelmingly to the much more common case: the bad king. For the true usurper, the *Sentences* provides the ethical green light. The "expediency" clause just means: if killing him *now* would cause more chaos than waiting, then wait. But the *permissibility*, the lack of sin, is established by the lack of title.
  **Martha:** And I say that distinction collapses in practice, and Aquinas knew it. The risks he outlines in *On Kingship* – the precedent, the potential for worse tyranny, the divine punishment angle, the sheer danger of failure – apply *regardless* of how the tyrant gained power. A dead usurper leaves a power vacuum just like a dead bad king. An assassin’s dagger aimed at a usurper sets the same dangerous example as one aimed at a legitimate monarch. His *consistent* emphasis is on *collective, public action* as the only safe and just remedy. The "praise" in the *Sentences* is for the *result* of liberation, likely achieved through *publicly sanctioned* means, not an endorsement of the lone assassin. He’s fundamentally a man of order, Leo. Order requires process, even when removing disorder. To read him as licensing private judgment and lethal action, even against a usurper, is to ignore the overwhelming thrust of his political philosophy: *auctoritas*, not *violentia*.
  **Leo:** But *auctoritas* must have a foundation! The usurper has *violentia* masquerading as *auctoritas*. Removing that deception *is* restoring order. Aquinas saw the difference. I think he meant both things: absolute caution with the bad king, but a qualified, perilous *permission* – even duty – for the private person facing the true thief of sovereignty.
  **Martha:** And I think the later, fuller, practical treatise trumps the early academic gloss. The risks are too great. For Aquinas, the answer is almost always: Pray, endure, and let the proper authorities handle it – however long that takes. Tyrannicide, private tyrannicide especially, remains the "perilous" path, best avoided.
  **(They hold each other's gaze for a moment, the old argument unresolved but thoroughly aired. Martha sighs, a hint of a smile playing on her lips. Leo runs a hand through his hair, looking at his book. The dust motes continue to dance.)**
  **Martha:** Same time next week? I think I saw a volume of Cajetan come in…
  **Leo:** (Grinning faintly) Wouldn’t miss it. Maybe *he* settled it.
  **Martha:** (Chuckles) Doubtful. Pass me that Suarez?

  **(They return to the shelves, the ancient argument momentarily shelved, but far from settled.)**

  **Key Points Debated:**

  1.  **Textual Weight:** *On Kingship* (mature, practical) vs. *Sentences Commentary* (early, academic).
  2.  **The Core Distinction:** Usurper (no title, public enemy) vs. Bad Legitimate Ruler (has title, requires process). Leo argues this distinction *is* Aquinas's practical key; Martha argues it collapses under the weight of the risks.
  3.  **"Public Authority":** What constitutes it? The community acting collectively? Remnant institutions? Or, in the case of a usurper, is it null, allowing private action as a last resort? Martha insists only collective/public action counts; Leo argues that against a usurper, private action *can* be an act *of* public defense.
  4.  **The Risks:** Precedent setting (anyone can claim "usurper"), potential for worse outcomes (failed attempts, worse successors, chaos), divine punishment. Martha argues these apply universally; Leo argues they are primary concerns for removing legitimate rulers, less absolute for clear usurpers.
  5.  **The "Praise" Passage:** Is it an endorsement of lethal private action, or praise for the *result* of liberation (however achieved)? Leo takes it literally; Martha contextualizes it within a discussion of obedience and sees it as qualified.
  6.  **Nature of the Act:** Is killing a usurper murder or the execution of a public enemy/self-defense? Leo argues the latter due to the violation of the *res publica*; Martha emphasizes the danger of private judgment in such matters.
  7.  **Aquinas's Priority:** Order and due process (Martha) vs. Justice and the defense of the community against fundamental illegitimacy (Leo).

  The dialogue captures the genuine tension in Aquinas's texts and the reasonable interpretive divide among scholars. Neither Martha nor Leo "wins," but they rigorously engage the specific arguments and texts as you requested.
