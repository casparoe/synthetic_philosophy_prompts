  Everyone just calls it "the doomsday argument" like it's one thing, but Gott's delta-t/Copernican version (the one with the Berlin Wall example) and the Carter-Leslie version (built on the self-sampling assumption and your birth rank among all humans who'll ever live) actually run on pretty different machinery under the hood - one bakes in a specific prior over durations, the other leaves the prior open and is really just about the bayesian update itself. Compare the two versions: where exactly do their assumptions diverge, and does one hold up better against the standard objections (reference class problem, the self-indication assumption rebuttal, worries about self-application) then the other? Justify your answer.
