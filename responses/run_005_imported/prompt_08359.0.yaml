  - B: 14-15
  - etc.

  So 16 is B+.

  ### Overall Comment
  The student provides a clear explanation of the demandingness objection with a well-chosen example (Singer's shallow pond). However, in presenting Railton's response, the student inaccurately labels it as "satisficing consequentialism", which is a term more commonly associated with Michael Slote. Despite this, the student captures the essence of Railton's argument about dispositions and long-term outcomes. The evaluation of Railton's reply is positive and coherent but lacks critical depth by not addressing potential weaknesses. Overall, the answer is strong in structure and understanding but has some inaccuracies and could be more probing in evaluation.

