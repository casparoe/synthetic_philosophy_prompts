  We are grading the student's answer to the question about the demandingness objection to consequentialism and one consequentialist reply (Railton's satisficing consequentialism). The question has two parts: (1) explain the objection with an example, (2) present and evaluate one consequentialist strategy.

  The student's answer is divided into three paragraphs:
  1. Explanation of the demandingness objection with Singer's shallow pond example.
  2. Presentation of Railton's satisficing consequentialism as a response.
