answer: |-
  You've hit on a genuinely deep and debated point at the heart of formal epistemology's "accuracy-first" program. Your background gives you a unique and valuable perspective – you're absolutely right to see the pragmatic DNA of strict propriety, and your concern about its role in supposedly non-pragmatic arguments is spot-on. Let's break this down:

  1.  **Your Core Insight is Correct:** The historical origin and primary *motivation* for Brier's development of his score (and the subsequent formalization of "strict propriety" by Savage, de Finetti, etc.) were indeed **pragmatic**. The goal was to design evaluation metrics that incentivize forecasters to report their *true* beliefs. It's about aligning incentives for honest reporting within an institutional context (like the weather service) to prevent gaming. This is fundamentally decision-theoretic/pragmatic: "If you want forecasters to tell the truth (because that leads to better decisions downstream), use this scoring rule."

  2.  **The Epistemological Repurposing:** Formal epistemologists (Joyce, Pettigrew, Leitgeb, et al.) then took these scoring rules and said: "Look at this mathematical property! If we interpret these scores as measures of *epistemic accuracy* – how *close* a credence function is to the truth – then probabilistically coherent credences have a unique advantage: they are never *accuracy-dominated*." An incoherent credence function is always accuracy-dominated by some coherent one, meaning there's *some* coherent alternative that is guaranteed to be at least as accurate, and strictly more accurate in some possible worlds. They argue this provides a *purely alethic* (truth-directed) reason for probabilism: coherence is necessary for avoiding epistemic self-sabotage.

  3.  **The Crux of Your Challenge:** You're asking: **Isn't the selection of *strictly proper* scoring rules as the "legitimate" measures of accuracy *itself* relying on the very pragmatic consideration (incentivizing honesty) that the accuracy-dominance argument was supposed to avoid?**

      *   **The Epistemologist's Standard Defense:** Proponents argue that strict propriety isn't *defined* by its incentive properties but by a purely mathematical relationship between a credence and the resulting score depending on the truth value. They claim this mathematical property *captures* the essence of what it means for a score to be a *genuine measure of accuracy*. The argument goes:
          *   Accuracy is about "closeness to truth."
          *   If a scoring rule *weren't* strictly proper, it would imply that reporting something *other* than your true belief could get you *closer to the truth* according to *that very rule*. But how can misrepresenting your own best estimate bring you closer to truth? A rule that allows this must be a defective measure of accuracy.
          *   Therefore, strict propriety is a *necessary condition* for any scoring rule to genuinely measure epistemic accuracy. It's not smuggled in pragmatically; it's derived from the *concept* of accuracy itself. The incentive property is a *consequence* of it being a good accuracy measure, not the definition.
          *   **Analogy:** We want rulers to measure length accurately. If a ruler was designed such that intentionally misreading it gave a *more accurate* length measurement (according to that ruler!), we'd say it's a defective ruler. Strict propriety is like demanding rulers that don't have this perverse property.

      *   **Your (Valid) Counter-Perspective:** This defense can feel circular or question-begging. You might respond:
          *   "But *why* is 'a rule where misreporting your belief can get you a better score' defective *as an accuracy measure*? Isn't the defect *only* apparent if we *already care* about the honesty incentive? If accuracy is purely about the *distance* between the reported number and the truth (1 or 0), why can't I just use absolute error (|p - truth|)? It measures distance directly! Sure, it's improper – I might shade my report towards 0.5 to minimize *expected* absolute error even if my true belief is 0.7 – but why does that make it an *invalid* measure of the *actual* distance on this one occasion? The dominance argument only works because we've *ruled out* simple distance measures like absolute error *based on the pragmatic concern about reporting incentives*."

  4.  **Is This a "Soft Spot"?** Yes, absolutely. It's one of the most significant ongoing debates in this area.
      *   **Proponents:** Argue strict propriety flows naturally from the concept of accuracy for *degrees of belief* (credences). Accuracy for a credence isn't just about being right/wrong on the binary outcome, but about how *well-calibrated* or *confident* the degree of belief was relative to the truth. A strictly proper score penalizes both being wrong *and* being over/under-confident in a way that aligns with intuitive notions of gradational accuracy. The dominance result is then a powerful *consequence* of using genuinely accuracy-revealing measures.
      *   **Critics:** Argue that the requirement of strict propriety *does* implicitly import pragmatic considerations about belief *reporting* or *elicitation* into the core concept of epistemic accuracy. The dominance argument only establishes that coherence is necessary for avoiding dominance *relative to measures defined by rules that have this incentive property*. Whether avoiding dominance *under those specific rules* constitutes a purely alethic requirement is contested. Critics like Aaron Schervish, Teddy Seidenfeld, or even Joyce in earlier work have wrestled with this. Some argue the dominance argument is better seen as a *pragmatic* one dressed in alethic clothing, or that the justification for privileging strictly proper rules needs more foundational work.

  5.  **Technical/Historical Accuracy:** Your summary is excellent. Key points:
      *   **Brier (1950):** Exactly right – developed for verification, motivated by preventing hedging/gaming in weather forecasting competitions.
      *   **Strict Propriety:** Formalized later (Savage '71, de Finetti earlier in decision-theoretic contexts). Defined as: A scoring rule S(p, i) (p=reported prob, i=1 if true, 0 if false) is strictly proper if the *expected* score according to your belief q is minimized *only* when you report p = q. `argmin_p E_q[S(p, I)] = q`.
      *   **Joyce (1998):** His "A Nonpragmatic Vindication of Probabilism" is the seminal paper applying this to accuracy dominance for epistemic justification. He explicitly contrasts it with Dutch Book arguments (which are pragmatic/decision-theoretic).
      *   **"Any Strictly Proper Rule":** Correct. The dominance result holds for *any* strictly proper scoring rule (Brier, Logarithmic, Spherical, etc.), though the *specific* incoherent credences dominated and the dominating coherent ones might differ.

  **Conclusion & What to Say at Your Reading Group:**

  You haven't mangled anything. You've identified a profound and live philosophical tension. Here's how to frame it:

  *   "I see the power of the accuracy-dominance argument using strictly proper scoring rules. However, I'm wrestling with the justification for *restricting* 'legitimate' accuracy measures to strictly proper ones in this supposedly nonpragmatic context. The defining property of strict propriety – that it uniquely incentivizes honest reporting – seems inherently pragmatic. It was developed to solve a practical problem in forecasting verification. Does selecting our accuracy measures *because* they have this incentive property inadvertently reintroduce pragmatic considerations through the back door? If so, does this undermine the claim that the dominance argument provides a *purely* alethic vindication of probabilism? I know this is debated (e.g., Schervish, Seidenfeld), and I'd like to understand how proponents reconcile the alethic interpretation of strict propriety with its pragmatic origins and definition."

  **Why this is strong:**

  1.  **Acknowledges the Argument:** Shows you understand the dominance reasoning.
  2.  **Precise Challenge:** Targets the *selection criterion* for accuracy measures.
  3.  **Connects History to Philosophy:** Leverages your unique background insightfully.
  4.  **Identifies the Tension:** Clearly states the conflict between "nonpragmatic" goal and the pragmatic roots/definition of strict propriety.
  5.  **Shows Awareness:** Mentions it's a known debate point.
  6.  **Opens Discussion:** Ends with a clear question seeking clarification.

  You are absolutely not embarrassing yourself. You're engaging critically with a sophisticated argument at its most vulnerable point, informed by valuable real-world context. This is exactly the kind of insight philosophy reading groups thrive on!
