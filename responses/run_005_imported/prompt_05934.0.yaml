prompt: |-
  Okay, this is a bit of a rabbit hole but I've been chewing on it for days and can't shake it loose. Somewhere in the comments of a stats blog (might've been Gelman's, might've been some old LessWrong thread, honestly can't remember) someone brought up "Lindley's paradox" (aka the Jeffreys-Lindley paradox) as a reason to distrust naive p-value reasoning, and the setup as I understood it goes something like: you're testing a sharp point-null against a diffuse alternative, and if you hold the p-value fixed at some conventional threshold -- say exactly 0.05 -- and just crank the sample size up, the Bayesian posterior probability that the null is *true* keeps climbing toward 1. So the exact same "significant at p<0.05" result that's decent-ish evidence against the null in a small study becomes, in a big enough study, actual evidence *for* the null once you do the Bayesian update properly. I mentioned this to a friend doing a stats PhD and she just said "yeah, priors matter," which, cool, thanks, very illuminating.

  I get the vague shape of "the diffuse prior is spreading it's bets too thin over the alternative and gets punished for that, kind of like an automatic Occam's razor," but I can't turn that into an actual felt sense of why the effect specifically requires large n to bite, or why it's basically invisible in small samples. Could you walk me through the real intuition here (not the Bayes-factor algebra, I can look that up) -- like, what's actually happening to the likelihood and the prior as n grows that makes this get worse instead of washing out? And then, since this feels like it matters beyond stats-nerd trivia: do you think Lindley's paradox is an actual underappreciated contributor to the replication crisis (e.g. huge preregistered studies or biobank-scale datasets turning up "significant" results that a careful Bayesian wouldn't be caught believing), or is that overreading a neat mathematical curiosity?
