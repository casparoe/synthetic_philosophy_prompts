  First, I need to visualize how evidence accumulates differently in frequentist vs Bayesian frameworks. The key is that p-values measure extremity of data under H0, while Bayes factors weigh evidence between H0 and H1. 

  When n is small, that diffuse alternative prior isn't too problematic - the likelihood functions under both hypotheses are wide and overlapping. A significant p-value might reasonably correspond to some Bayesian evidence against H0. But as n grows... ah, here's the crux! The likelihood under the sharp null becomes extremely concentrated at the true value, while under the diffuse alternative, it stays spread out. 

  Imagine we get exactly p=0.05 in a huge study. That means the observed effect size is tiny - just barely different from null. The Bayesian machinery looks at this and says: "H1 predicted a wide range of effects, so seeing this tiny blip is actually more consistent with H0 being true." The diffuse prior gets penalized for predicting big effects that didn't materialize.

  For the replication crisis angle... hmm. There's definitely a case to be made. Those genome-wide studies finding "significant" effects with tiny estimated sizes? Classic Lindley bait. But I should note the limitations too - most failed replications probably have more mundane explanations like p-hacking.

