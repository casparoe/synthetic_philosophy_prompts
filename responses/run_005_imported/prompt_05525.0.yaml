  For the memo, I should take a middle-ground position since outright mandating either approach ignores key uncertainties. A bounded pilot makes sense: test flipped classrooms under controlled conditions while collecting missing data. Key elements to include:
  - Acknowledge Simpson's Paradox explicitly to validate both committee viewpoints
  - Reject both simplistic interpretations (subgroup-only vs overall-only)
