  The entire debate is focused on the theoretical properties of the two solutions. However, in the context of splitting equity between co-founders, there are practical considerations that are not addressed:

  1. **Real-world applicability:** The bargaining solutions assume that both parties have symmetric information and that the feasible set (including the utility functions and the disagreement point) is well-defined. In reality, these might be hard to quantify. For example, how do we measure the contributions, future roles, and opportunity costs?

  2. **Beyond two players:** Both solutions are defined for two players. Equity splits often involve more than two co-founders, and these solutions might not extend easily.

