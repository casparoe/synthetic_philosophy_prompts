  7. **Market Frictions**: Things like transaction costs, taxes, and regulatory requirements can create trading opportunities (e.g., tax-loss harvesting) or force trades. But they are not the primary driver of volume in normal markets. **B Tier** (important in specific contexts).

  8. **Multiple Priors/Ambiguity Aversion**: This is a more nuanced version of "No Common Prior". It can lead to trade because agents update beliefs differently. It's a valid explanation but less straightforward and perhaps less universal than simple prior disagreement. **C Tier**.

