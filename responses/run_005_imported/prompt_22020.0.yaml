  okay so a while back i went down a rabbit hole reading about this thing called the no-trade theorem (milgrom & stokey, also tangled up with aumann's agreement theorem stuff) and it kind of broke my brain. the way i understand it: if two people start from an efficient split of risk, share the same prior, and its common knowledge that i'm offering you a trade, then the mere fact i'm offering it should make you infer i know something you don't, so you update and the deal unravels before it even happens — meaning purely speculative trade between rational people basically shouldn't occur at all. but obviously real markets have huge trading volume every single day, so clearly something about the real world is violating the theorem's setup.

  over time i've picked up a handful of "explanations" people give for why real trade doesn't collapse the way the theorem predicts: people not actually sharing a common prior, hedging/liquidity needs that have nothing to do with private info, noise traders / overconfidence, plain old bounded rationality (nobody's actually doing the infinite regress of updating), and risk-sharing trades driven by new endowment shocks (so you weren't at an efficient allocation to begin with).

