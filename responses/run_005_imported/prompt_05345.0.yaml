  Potential pitfalls: Avoiding jargon, keeping explanations succinct. Using metaphors like "disease of accumulation" makes the idea accessible. Balancing sincerity with levity ensures it feels like a toast. Including specific anecdotes about Priya (even if fictionalized in the toast) adds warmth. Ensuring both sides of the audience feel acknowledged—finance colleagues for their hard work, artists for their values.

