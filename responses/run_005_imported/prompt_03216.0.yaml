answer: |-
  ## The Querist and the Skeptic (Dublin, 1736)

  **Setting:** A bustling Dublin coffeehouse. The air is thick with the aroma of roasted beans, pipe smoke, and the low hum of merchants, pamphleteers, and clergy debating the affairs of a struggling Ireland. George Berkeley, Bishop of Cloyne, sits near the fire, reviewing notes. Opposite him, leaning forward intently, is **Silas Fitzgerald**, a merchant of middling wealth but sharp experience, his face etched with the memory of past financial storms.

  **Characters:**
  *   **George Berkeley:** Mid-50s, intelligent eyes, dressed soberly as a Bishop but with an air of restless inquiry.
  *   **Silas Fitzgerald:** Late 50s, shrewd gaze, practical attire, carries the weight of hard-earned caution.
  *   **Others:** A few other patrons half-listening, including a young pamphleteer (**O'Toole**) taking notes.

  **(The Dialogue)**

  **Fitzgerald:** (Tapping Berkeley’s pamphlet, *The Querist*, on the table) This notion of yours, Bishop, this... *ticket* theory of money. It echoes your earlier arguments, the ones before the Parliament crushed that bank scheme in '21. Sounds dangerously smooth, if you’ll pardon my bluntness. Like John Law’s promises before the Seine ran red with ink from worthless *billets*.

  **Berkeley:** (Looks up calmly) Mr. Fitzgerald. Your caution is noted, and rooted in a painful spectacle, I grant you. But tell me, *whether* Law’s failure condemns *all* paper credit, or merely *his particular application* of it?

  **Fitzgerald:** Application? Bishop, it was the very *nature* of it! He conjured millions out of thin air, backed by nothing but swampy acres in Louisiana valued by fantasy! Men traded estates for scraps of paper promising fortunes that vanished overnight. *That* is what happens when money loses its anchor! Gold has weight, Bishop. It has limits. Paper... paper is temptation given form. A national bank issuing it? It’s handing the keys to the mint to men who’ll inevitably print their way to ruin. We felt the chill wind from France blow right across the Channel here. Saw the panic. Men ruined. Trade frozen. *That* is the specter you dismiss as a mere 'ticket'!

  **Berkeley:** (Nodding gravely) A dreadful spectacle indeed, Mr. Fitzgerald, and a potent warning against folly. But *whether* the fatal flaw lay in the *idea* of credit, or in its *perversion*? Law’s credit was not a ticket representing *existing* labour or *genuine* trade. It was a speculative engine, a bubble inflated on the vapour of distant, overvalued land and royal privilege. It bore no relation to the real work of France.

  **Fitzgerald:** (Leaning in) And how, pray, would *your* national bank be different? How do you ensure *this* paper doesn’t become just another vapour? Where’s the anchor, if not in gold? You say ‘command labour’ – fine words, but how does a scrap of paper command anything if no one believes it can be *redeemed* for something solid?

  **Berkeley:** (Eyes alight) Precisely the crux! *Whether* the solid thing must be a lump of metal, or the productive capacity of the nation itself? Consider: When a merchant in Cork issues a bill of exchange upon his correspondent in Bristol, backed only by the *expectation* of goods shipped and sold... *is* that bill ‘backed by gold’? Or is it backed by the *labour* that produced the goods, the *trust* in the merchant, and the *reality* of trade between two ports? It circulates as credit, facilitating work, long before any gold changes hands, *if* it ever does.

  **Fitzgerald:** Private credit, Bishop! Between known parties, for specific ventures. Limited. Contained. A national bank flooding the country with paper... that’s a different beast entirely. Who checks it? Who stops the politicians from demanding more notes to pay for wars or palaces?

  **Berkeley:** A vital question, Sir. *Whether* the true danger lies in the *material* of the counter, or in the *management* of the tally? The bank must be a public trust, its directors men of probity, its issue *strictly proportioned* to the *demonstrable activity* and *potential* for labour within the kingdom. Credit issued to fund productive enterprise – spinning wool, draining bogs, building ships – credit that *enables* labour, creates goods, and thus *increases* the very wealth the credit represents... *that* is sustainable. It grows *with* the trade it facilitates. Law’s credit was printed to fuel speculation *in itself*; it was divorced from real production.

  **O'Toole:** (The young pamphleteer, interjecting) So... the Bishop means credit should be like water in a millrace? Enough to turn the wheel and grind the corn, but not so much it floods the works?

  **Berkeley:** (Smiling faintly) An apt analogy, young man. *Whether* the true measure of our wealth is the idle gold in a vault, or the number of hands usefully employed, the fields productively tilled, the looms humming? Ireland starves not for want of gold, but for want of *circulation*, of *employment*. A well-regulated paper credit, acting as these ‘tickets’ or ‘counters’, can set idle hands to work on idle lands. It represents the *power* to command that labour *now*, based on the *future fruit* it will bear. Gold cannot be conjured, but industry can be awakened.

  **Fitzgerald:** (Sitting back, thoughtful but unconvinced) Awakened... or intoxicated? You paint a fair picture, Bishop. But the memory of Law’s intoxication is long. You speak of proportion, trust, management... men are fallible. Greed is powerful. *How* do you build the millrace strong enough? *How* do you ensure the directors resist the siren call of easy paper? Your ‘tickets’ require immense faith, Bishop. Faith in men and institutions that have failed us before. Gold... gold requires no faith. It simply *is*.

  **Berkeley:** (Quietly) *Whether* gold simply ‘is’, Mr. Fitzgerald, or *whether* its value, too, rests upon the common consent of men who agree to exchange their labour for it? A shilling is but a disc of silver... until we agree it represents the price of a day’s work or a loaf of bread. The ‘isness’ of money, gold or paper, resides not in the substance, but in the *trust* and the *convention* that it signifies the power to procure labour. A national credit, managed prudently, tied to real production, *can* foster that trust and unleash that power far more effectively for Ireland’s present needs than any hoard of imported metal. The anchor, Sir, is not the gold, but the *industry* it sets in motion. *Whether* we dare to harness that power wisely, or remain forever shackled by the ghost of a failed alchemist?

  **Fitzgerald:** (Stares into his cooling coffee for a long moment) Wise or foolish... that’s the gamble, isn't it, Bishop? Your questions... they gnaw at a man. But the ghosts, Bishop... they gnaw louder. I’ll need more than questions to lay *those* to rest. (He stands, nods curtly but with a hint of reluctant respect) Good day, Bishop Berkeley. You argue well. But I fear you argue against human nature itself.

  **(Fitzgerald leaves. Berkeley watches him go, then turns back to his notes, a thoughtful, determined expression on his face. The coffeehouse murmur continues, now buzzing with the echoes of the debate.)**

  **O'Toole:** (Eagerly scribbling) "...shackled by the ghost of a failed alchemist..." Oh, that's capital, Your Lordship! Pure gold!

  **Berkeley:** (Without looking up, a wry smile) *Whether*, young O'Toole, metaphors are the true coin of the realm for pamphleteers? Now, about those idle hands in Ulster...
