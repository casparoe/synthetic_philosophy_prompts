answer: |-
  ## The Parity Gambit: Assessing Mathematics as a Shield for Moral Realism Against Evolutionary Debunking

  Sharon Street’s evolutionary debunking argument (EDA) delivers a powerful challenge to moral realism. If natural selection shaped our moral faculties solely for adaptive fitness—promoting cooperation, avoiding dangers, securing resources—rather than for tracking mind-independent moral truths, then the realist faces a profound challenge: **explain the reliability of our moral beliefs without appealing to the very truths they purport to track**. The realist cannot simply *assume* reliability; they must explain *why* evolution would have produced faculties sensitive to these independent truths. The "companions in guilt" (CIG) response, championed by Justin Clarke-Doane, offers a seemingly potent rebuttal: if evolutionary origins debunk moral belief, they must equally debunk mathematical and logical beliefs, as their selective advantage also stems from utility, not abstract truth-tracking. Skepticism about mathematics, however, is widely considered absurd. Therefore, the EDA must be flawed. **While the CIG argument initially appears compelling, a closer examination reveals significant disanalogies between mathematics and morality—rooted in indispensability, modal status, and causal etiology—that allow Street’s debunking of moral realism to stand without collapsing into mathematical skepticism.**

  **The Force of Companions in Guilt: Undermining the Debunking Premise**
  Clarke-Doane’s core insight is powerful: the *structure* of the EDA applies equally to domains like mathematics. Consider the belief "1 + 1 = 2." Its selective advantage is undeniable—counting resources, coordinating actions, predicting outcomes—but this advantage flows from its *pragmatic utility in navigating the physical world*, not its correspondence to abstract Platonic truths. Natural selection is supremely indifferent to whether our cognitive faculties grasp the necessary truths of Peano arithmetic; it only cares if the resulting behaviors enhance survival and reproduction. If Street argues that the adaptive origins of moral belief undermine its claim to track independent truths, then the same logic should apply to mathematics. The widespread intuitive rejection of mathematical skepticism, despite its shared evolutionary pedigree, suggests a flaw in the general reasoning. **The CIG argument effectively shifts the burden: if evolutionary origins alone cannot debunk mathematics (which we rightly trust), they cannot debunk morality either.** The debunker must identify a *principled difference* between the domains to avoid an unacceptable reductio ad absurdum.

  **Principled Disanalogies: Why Morality Might Fall Alone**
  Despite its initial force, the parity argument falters under scrutiny due to fundamental differences between mathematical and moral belief:

  1.  **Indispensability and Explanatory Power (Quinean Objection):** Mathematics is demonstrably indispensable to our best scientific theories of the physical world. Quantum mechanics, general relativity, and evolutionary biology itself rely fundamentally on mathematical structures. This "indispensability" (à la Quine-Putnam) provides a powerful *independent reason* to believe mathematical claims track objective truths: their success in explaining and predicting concrete physical phenomena is inexplicable without their approximate truth. **Evolution may have shaped our *faculty* for math, but the *content* of our successful mathematical theories earns its epistemic warrant through its irreplaceable role in science.** Morality, in stark contrast, lacks this robust indispensability. While moral *language* or *psychology* might be explained by evolution, there is no compelling evidence that *mind-independent moral facts* play any necessary role in explaining the success of the physical or biological sciences. Evolutionary biology explains the *existence* of our moral sentiments without invoking moral truths. The realist thus lacks a comparable, independent justification for moral belief reliability that bypasses the evolutionary challenge.

  2.  **Modal Status and Evolutionary Sensitivity:** Mathematical truths (e.g., 2+2=4) are typically considered metaphysically necessary—true in all possible worlds. Moral truths, however, are generally conceived as contingent by realists—what is morally required could, in principle, have been different. This difference is crucial. **Evolution operated within the constraints of *this* specific physical world.** Our mathematical faculties plausibly evolved to grasp structures *fundamental to this world's physics* (e.g., discrete objects, spatial relations), which happen to instantiate necessary mathematical truths. Selection pressure directly favored sensitivity to these concrete, world-bound structures. Even if abstract mathematical necessity wasn't the target, sensitivity to the *instantiated* physical correlates was adaptive and *entails* sensitivity to the necessary truths governing those correlates. Morality lacks this anchor. There is no clear reason why selection pressures in *this* world, favoring cooperation within kin groups or reciprocal alliances, would reliably track contingent, mind-independent moral truths that *could* have been radically different. The link between adaptive fitness and contingent moral truth seems arbitrary in a way the link between adaptive fitness and necessary mathematical structure (via physics) does not.

  3.  **Causal Etiology and Belief-Forming Mechanisms:** The cognitive mechanisms underpinning basic mathematical and logical beliefs appear more directly constrained by the structure of physical reality than moral beliefs. Perception of discrete objects, manipulation of quantities, and basic spatial reasoning are foundational cognitive abilities honed by evolution to interact directly with the environment. Beliefs like "1 rock + 1 rock = 2 rocks" have a clear sensory-motor causal chain. **While abstracted, the core mathematical beliefs arise from cognitive modules deeply entangled with tracking objective features of the physical world (discreteness, quantity, shape).** Moral beliefs, however, primarily arise from complex interactions of emotion (empathy, disgust, anger), social intuition, and cultural learning. These mechanisms were selected for regulating social behavior and promoting group cohesion *within specific environments*. The causal chain leading to a moral belief "Killing is wrong" involves emotional responses and social conditioning far removed from any putative causal contact with a non-natural moral fact. The evolutionary story explains the *entirety* of the moral belief-forming process in terms of adaptive pressures on social emotions, leaving no explanatory role or causal pathway for independent moral truths to influence belief formation. The causal "gap" is significantly wider for morality.

  **Weighing the Balance: A Verdict for Principled Disanalogy**
  The CIG argument successfully exposes a potential overreach in Street’s EDA, highlighting that evolutionary origins *alone* are insufficient for global skepticism. However, the disanalogies provide the realist with the necessary resources to block the debunking of mathematics without rescuing morality.

  *   **Indispensability** provides mathematics with an independent epistemic anchor in scientific success, absent for morality.
  *   **Modal Status** means the necessary truths of mathematics are inherently linked to the structures of any possible physical world evolution could operate within, while contingent moral truths lack this guaranteed alignment.
  *   **Causal Etiology** suggests core mathematical beliefs arise from cognitive mechanisms more directly constrained by physical reality, while moral beliefs stem primarily from socially adaptive emotions whose causal link to independent truths remains opaque and explanatorily redundant.

  These differences collectively demonstrate that **Street's EDA can plausibly debunk moral realism without triggering mathematical skepticism**. The evolutionary challenge uniquely undermines morality because the realist lacks a compelling story for *why* adaptive pressures would align our contingent, emotionally-driven moral beliefs with mind-independent truths, especially when the entire history and mechanism of moral belief formation is fully explicable in naturalistic, adaptive terms. The reliability challenge for mathematics, while real, is mitigated by its indispensable role in science, its necessary connection to the physical world's structure, and the more direct causal etiology of its core beliefs. Therefore, the companions in guilt gambit, while initially formidable, ultimately fails to shield moral realism from the force of Street's evolutionary debunking argument. The disanalogies are sufficiently deep and principled to allow the debunking of moral realism to stand alone.
