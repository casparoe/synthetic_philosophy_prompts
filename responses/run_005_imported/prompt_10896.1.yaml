prompt: |-
  hey, so I co-host a pretty small philosophy-of-language podcast (like 40 regular listeners lol) and next month's guest is a philosopher who's built her whole career defending Davidson's radical interpretation -- the view that theres nothing more to what a speaker means than what a truth theory satisfying the charity/coherence constraints, built up by a radical interpreter with zero prior access to her beliefs, would assign her. I'm a linguistics PhD student so I know enough to be dangerous, but I want questions that actually press on stuff instead of just letting her restate the view for a general audience. Can you draft like 7-8 interview questions? I want at least one on the Fodor-and-Lepore-ish worry that charity just stacks the deck so that massive, genuine error becomes undefinable, one on the old "Foster problem" -- a theory can satisfy Convention T and even work fine in practice without thereby capturing meaning, so what's actually doing the interpretive work -- and one on triangulation, since its supposed to ground objective content but kind of seems to presuppose the very shared communicative situation it's meant to explain. For each of those add a follow-up keyed to whatever answer she's most likely to give. Maybe end on whether any of this is falsifiable or just a priori reconstruction dressed up as empirical semantics. thanks!
