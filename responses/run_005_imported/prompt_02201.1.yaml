  Okay, let me start by unpacking the user's question. They had a two-hour argument with a friend about Parfit's hitchhiker, specifically focusing on why paying once in town is rational. They agreed on the action but got stuck on the reasoning behind constrained maximization (CM) and resolute choice (RC). The user wants a clear distinction between these two approaches, examples where they might differ, and how they relate to Parfit's "rational irrationality."

  First, I need to recall what CM and RC entail. Gauthier's CM is about adopting a disposition to cooperate if others do, evaluating actions based on that disposition. McClennen's RC involves committing to a plan in advance and sticking to it, even when later parts seem suboptimal. The user’s friend thinks they're essentially the same, but the user senses a difference.

  The key difference lies in what's being evaluated: CM focuses on dispositions before interaction, while RC evaluates entire plans from the outset. In the hitchhiker, both recommend paying, but their justifications differ. CM says it's rational to have a cooperative disposition; RC says committing to the plan makes paying rational later.

  To show a distinction, I should find a scenario where CM and RC diverge. Toxin Puzzle is a classic: RC would drink because of precommitment, but CM might not, as the disposition doesn't affect others. Another example could be a single-player scenario where RC's plan-based commitment applies, but CM doesn't since no interaction.

  The user also mentions Parfit's "rational irrationality." CM fits here—being irrationally disposed to cooperate is rationally chosen. RC isn't about irrationality; it's about consistent planning. So CM aligns more with Parfit's idea.

  I need to ensure the explanation addresses all parts: the core difference, a case where they disagree, and their relation to Parfit. Also, note why literature treats them separately—CM is about mutual cooperation, RC about individual plan coherence. Examples like Toxin Puzzle and single-player cases should clarify the distinction. Finally, confirm that while they overlap in hitchhiker, they are fundamentally different frameworks.
answer: |-
  You've hit on a deep and contested debate in decision theory! Your friend is right that Gauthier's Constrained Maximization (CM) and McClennen's Resolute Choice (RC) *both* recommend paying in the Hitchhiker case by advocating commitment to a policy, but they are **fundamentally distinct approaches with different foundations, objects of evaluation, and implications.** Calling them the "same fix" flattens crucial philosophical differences. Here's the breakdown:

  **Core Differences: What They Evaluate & Why**

  1.  **Object of Rational Evaluation:**
      *   **Constrained Maximization (Gauthier):** Evaluates **dispositions (or character traits) *before* interaction.** Rationality is about choosing *which kind of agent to be* – a Straightforward Maximizer (SM) who always maximizes expected utility given current beliefs/desires, or a Constrained Maximizer (CM) who is disposed to cooperate *if* they expect the other party is also disposed to cooperate (and cooperation is mutually beneficial). The *action* (paying) is rational *because* it flows from the rationally chosen disposition. Gauthier is fundamentally offering a *revisionist theory of rational agency* based on mutually advantageous cooperation.
      *   **Resolute Choice (McClennen):** Evaluates **plans (or strategies) *over time* as a whole.** Rationality involves selecting a complete plan *at the initial choice node* (or behind a "veil of foresight") that best achieves your goals across the entire decision tree, and then *resolutely* sticking to that plan at subsequent choice nodes, *even if* sticking to it violates the principle of Separability (which says you should re-optimize at each node considering only future options). The *action* (paying) is rational *because* it is part of the resolutely chosen plan that was optimal *ex ante*. McClennen is defending a *coherentist* view of rational choice over time.

  2.  **Source of Binding Force:**
      *   **CM:** The binding force comes from the *strategic advantage* of having a cooperative disposition *in interactions with other similarly disposed agents*. Choosing the CM disposition is rational *because* it leads to better overall outcomes (access to cooperative gains) than being an SM *if* you interact with other CMs. It's about mutual benefit through reciprocal dispositions. The *action* follows because you *are* a CM.
      *   **RC:** The binding force comes from the *internal coherence and optimality of the plan itself*. Choosing the plan "Accept ride if offered; Pay upon arrival" *at the start* is rational because it yields survival (utility 1) vs. death (utility 0). Sticking to the paying part *later* is rational *because abandoning it would undermine the coherence of the plan you recognized as optimal from the outset*. It's about temporal consistency and maximizing over the whole course of action. The *action* follows because you *committed* to the plan.

  3.  **Role of "Irrationality":**
      *   **CM:** **Explicitly embraces "Rational Irrationality" (Parfit's term).** Gauthier argues it is *rational* to adopt a disposition (CM) that will *sometimes cause you to act irrationally* by SM standards (e.g., paying when you could defect without penalty). The disposition is rationally chosen *because* having it (and being recognized as having it) gets you into beneficial interactions you otherwise couldn't access. The *action* of paying *is* irrational by SM standards *at the moment of action*, but it's the result of a rationally chosen disposition.
      *   **RC:** **Rejects the need for "irrationality" and redefines rationality.** McClennen argues that resolutely sticking to the optimal initial plan *is* the rational thing to do *at every point*. Abandoning the plan at the paying node *looks* rational by myopic SM/separability standards, but McClennen argues that Separability itself is flawed. RC claims that true rationality requires evaluating the whole extended action and sticking to it. The *action* of paying *is* rational *at the moment* precisely *because* it fulfills the rational commitment made earlier.

  **Why Paying is Rational: Their Different Explanations**

  *   **CM:** "You should pay because you are (and it was rational to become) the *type of agent* who reliably pays in such situations. Being this type got you the ride. Paying now maintains the integrity of that disposition, which is necessary for future beneficial interactions (even if *this specific act* of paying costs you money with no future consequence *from this driver*)."
  *   **RC:** "You should pay because *at the start*, when facing the whole sequence, you rationally chose the plan 'Get ride & Pay' as superior to 'No ride' or 'Get ride & Don't Pay' (which leads to no ride). Sticking to that resolutely chosen plan *now* is rational, even though myopically, not paying looks better. Abandoning it would be incoherent and undermine your initial rational choice."

  **Cases Where They Might Diverge (or Highlight Differences)**

  1.  **Kavka's Toxin Puzzle (The Litmus Test):** This is where the distinction becomes stark.
      *   **Setup:** A millionaire offers you $1M on Tuesday if, *at midnight Monday*, you intend to drink a (non-lethal, but very unpleasant) toxin on Wednesday. You get the money Tuesday *regardless* of whether you drink the toxin Wednesday. Drinking the toxin has no benefit, only cost.
      *   **RC Recommendation:** Drink the toxin. Why? On Monday, the optimal plan is "Intend to drink Tuesday -> Get $1M -> Drink Wednesday." Sticking resolutely to the drinking part Wednesday is rational to maintain the coherence of the plan that got you $1M. The initial commitment binds.
      *   **CM Recommendation (Gauthier's view):** *Don't* drink the toxin. Why? There's no *strategic interaction* here. No one else's cooperation depends on your disposition to drink *after* getting the money. The disposition to drink Wednesday doesn't help you form beneficial interactions; it just pointlessly harms you. Adopting a disposition to "drink toxins when promised money after you've already gotten it" isn't advantageous. SM wins here.
      *   **Key Difference:** RC can bind you to purely self-harming actions *if* they were part of an optimal initial plan. CM only binds you to actions that are part of a *mutually advantageous cooperative disposition* in strategic interactions. CM requires reciprocity; RC does not.

  2.  **The Solitary Hitchhiker (A Variation):** Imagine you are *alone* in the desert. A driver offers: "I'll drive you if you promise to pay $1000 once safe. I have a perfect lie detector." Once safe, paying costs you money with *absolutely no future consequences* (no reputation, no other interactions).
      *   **RC:** *Might* still recommend paying. Why? The optimal initial plan "Promise -> Get Ride -> Pay" leads to survival. Abandoning paying undermines the coherence of the plan that got you survival. Resoluteness binds you.
      *   **CM:** Would recommend *not* paying. Why? There's no ongoing interaction or reputation. Adopting a disposition to keep promises *even when completely solitary and consequence-free* isn't advantageous. It doesn't enable cooperative gains; it just costs you money. SM wins.
      *   **Key Difference:** RC's binding force comes from plan coherence alone, even in isolation. CM's binding force *only* exists within the context of enabling beneficial *reciprocal* cooperation. In purely one-shot, consequence-free interactions, CM collapses to SM, while RC may still demand adherence.

  3.  **The Unreliable Driver (Highlighting Dispositions vs. Plans):** Suppose the driver is known to be unreliable. There's only a 60% chance she actually picks you up *if* she believes you'll pay. Once safe, paying costs money.
      *   **CM:** Focuses on the disposition. Is it rational to adopt the CM disposition *given the risk*? This depends on the probability, the cost/benefit, and the *general* value of the CM disposition for *other* interactions. It might not recommend adopting the disposition (and thus not promising) if the risk is too high, even though *if* you had it and got picked up, you should pay.
      *   **RC:** Focuses on the plan. The plan "Promise -> (60%: Get Ride & Pay / 40%: No Ride)" might be compared to "No Promise -> No Ride". If the expected utility of the first plan is higher (survival is valuable enough), then RC recommends committing to that plan and resolutely paying *if* you get the ride.
      *   **Key Difference:** CM evaluates the lifetime value of a *disposition*. RC evaluates the expected value of a specific *plan* for this particular decision tree. Their risk assessments operate at different levels.

  **Relation to Parfit's "Rational Irrationality"**

  *   **CM is the *paradigm* of Rational Irrationality:** Gauthier explicitly builds on Parfit. CM involves rationally choosing a disposition that will cause you to perform actions that are irrational *by the standard of straightforward maximization at the time of action* (like paying the driver). The irrationality of the *act* is the instrumentally rational consequence of the rationally chosen *disposition*.
  *   **RC Rejects Rational Irrationality:** McClennen argues that resolutely sticking to the optimal plan *is* rational *at every point*. The *apparent* irrationality of paying (by myopic SM standards) is an illusion created by the flawed principle of Separability. True rationality, for RC, *is* resoluteness. There's no "irrationality" involved in the action itself within the RC framework.

  **Conclusion: Distinct Tools, Not Just Semantics**

  Your friend is wrong that CM and RC are "basically the same move." While they *coincide* in recommending paying in the standard Hitchhiker case, they do so for **fundamentally different reasons, operating on different levels (dispositions vs. plans), with different scopes (reciprocal cooperation vs. individual plan coherence), and different stances on Rational Irrationality.**

  *   **CM** is a theory about **rational agency and dispositions** for achieving **mutually beneficial cooperation** in repeated or reputation-based interactions. It explicitly endorses Rational Irrationality.
  *   **RC** is a theory about **rational choice over time**, emphasizing **coherence and commitment to optimal extended plans**. It rejects the need for Rational Irrationality by redefining rationality to include resoluteness.

  **Why the Distinction Matters in Literature:**

  1.  **Scope of Application:** CM is specifically tailored to solve problems of cooperation (Prisoner's Dilemma, Hitchhiker). RC is a broader theory of dynamic choice applicable to any sequential decision problem (like Toxin, saving/spending, even single-player games).
  2.  **Theoretical Foundations:** CM is grounded in contractarian moral philosophy and mutual advantage. RC is grounded in coherence and utility maximization over time.
  3.  **Handling "Irrationality":** CM embraces the paradox of Rational Irrationality as central. RC attempts to dissolve the paradox by rejecting the myopic standard that creates it.
  4.  **Divergent Recommendations:** As shown in Toxin and Solitary Hitchhiker, they *do* recommend different actions in specific, crucial cases. This isn't just academic hair-splitting; it reveals their core differences.

  So, next movie night, you can confidently say: "CM makes me pay because it's smart to *be a cooperator*. RC makes me pay because it's smart to *stick to my survival plan*. Different tools, different reasons, both get me out of the desert, but only one would make me drink that damn toxin!" Good luck!
