   The standard is: which actually solves the problem without relabeling or trading obscurities.

   Recall Bradley's regress: If a relation R relates a and b, then we have a, b, and R. But then we need a further relation R1 to relate R to a, and then R2 to relate R1 to R, and so on ad infinitum.

   The problem is to explain the unity of a state of affairs without falling into an infinite regress.

   Let's briefly consider each option:

   1. Bergmann's nonrelational "nexus": A primitive tie that connects without being a further term. This avoids regress by being non-relational and thus not requiring a further unifier. But it might be accused of being obscure.

   2. Frege's unsaturated concepts: Concepts are incomplete and thus naturally combine with objects. The idea is that the incompleteness provides the unity without a further relation. This is a popular view but might be seen as metaphorical.

   3. Armstrong's and Olson's "brute fact" states of affairs: States of affairs are fundamental unities that are not composed of their parts in a mereological way. So the unity is primitive. This avoids regress by stopping at the state of affairs.

   4. Armstrong's and Orilia's "benign infinitism": The regress happens but it is harmless because each step supervenes on the first and adds nothing. This is like the truth regress: "p is true", "it is true that p is true", etc. But the worry is that the regress might still be vicious.

   5. Vallicella's external unifier: An agent-like operator that brings unity. This introduces an agent and might be seen as overly mysterious and anthropomorphic.

   6. Weiland, Betti, and Maurin's relata-specific relations: Relations are individuated by their relata so that they cannot relate anything else. This might avoid the regress because the relation is already tied to the relata. But it might be accused of being ad hoc.

   7. Russell's early distinction (1903): Between a relation as a term (inert) and as a verb (active). The idea is that when a relation occurs as a verb, it relates without needing a further relation. This is similar to the nexus idea.

   8. Russell's multiple-relation theory: The unity is provided by the act of judgment. The mind relates the constituents. But this faces problems (as Russell later saw) because it's unclear how the mind imposes the right structure.

