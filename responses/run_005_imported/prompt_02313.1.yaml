prompt: |-
  I'm a novelist currently at work on a historical novel set in Roman North Africa during one of the pre-Constantinian persecutions. One of my central characters, a small-town bishop, hides a fugitive in his church and must then face imperial officers who come asking after the man. While researching the period, I was delighted to discover that Augustine records a real episode remarkably close to this scene: in his early treatise On Lying (De Mendacio, c. 395), he describes Firmus, a bishop of his own hometown of Thagaste, who was tortured for refusing either to lie about a fugitive in hiding or to betray him, and who was eventually brought before the emperor himself, whose admiration for his constancy won the fugitive a pardon. I would like my bishop's reasoning on the page to reflect the actual moral logic of his period rather than a modern reader's assumptions about honesty, so I have been working through the argument Augustine builds around this kind of case in an old translation — and a friend from my writing group, who studied classics, warned me that it turns genuinely slippery right at the point that interests me most, a point she admitted she could never quite untangle herself.

  Here is the passage in question, which comes directly after Augustine considers someone who knows exactly where the fugitive is hidden and is asked, point-blank, whether he is in a given place:

  "But one sometimes comes to a case of this kind, that we are not interrogated where the person is who is sought, nor forced to betray him, if he is hidden in such manner, that he cannot easily be found unless betrayed: but we are asked, whether he be in such a place or not. If we know him to be there, by holding our peace we betray him, or even by saying that we will in no wise tell whether he be there or not: for from this the questioner gathers that he is there, as, if he were not, nothing else would be answered by him who would not lie nor betray a man, but only, that he is not there. So, by our either holding our peace, or saying such words, a man is betrayed, and he who seeks him has but to enter in, if he have the power, and find him: whereas he might have been turned aside from finding him by our telling a lie. Wherefore if you know not where he is, there is no cause for hiding the truth, but you must confess that you know not. But, if you know where he is, whether he be in the place which is named in the question or elsewhere; you must not say, when it is asked whether he be there or not, 'I will not tell you what you ask,' but you must say, 'I know where he is, but I will never show.' For if, touching one place in particular you answer not and profess that you will not betray, it is just as if you should point to that same place with your finger: for a sure suspicion is thereby excited. But if at the first you confess that you know where he is, but will not tell, haply the inquisitor may be diverted from that place, and begin now to ply you that the place where he is may be betrayed."

  What I cannot reconstruct is why Augustine treats these two refusals as different in kind and not merely in timing. Declaring up front, before any particular place has even been named, "I know where he is, but I will never show," and simply declining to confirm or deny one specific place once it has been named, both seem to leave the questioner in possession of exactly the same information in the end. Is there a genuine logical or pragmatic distinction being drawn here — something about what a refusal implicitly communicates depending on when, relative to the specific question, it is offered — or is this really just a rationalization by a thinker already committed to the view that no lie whatsoever, however small or well-meant, can ever be told? I would like to understand his reasoning precisely enough, whichever way it turns out, to let my bishop make his case honestly on the page rather than merely sound pious.
