  The user might also need practical examples. Like a politician involved in corruption blaming others for corruption. The accusation could be true, but their lack of moral credibility makes their blame ineffective or inappropriate. This illustrates how standing affects the reception and legitimacy of blame, separate from its factual accuracy. 

