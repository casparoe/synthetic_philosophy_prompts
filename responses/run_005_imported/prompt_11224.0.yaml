prompt: |-
  I'm a software engineer on my company's model deployment review board -- the committee that has to sign off before any new model ships to production. Our standing policy requires every model to clear a full safety and capability evaluation suite (jailbreak resistance, bio- and cyber-uplift screening, deceptive-behavior probes, and the like) before release. The applied ML team is now asking for a fast-track exemption for "derivative" models -- quantized, distilled, or otherwise compressed versions of a base model we've already approved -- arguing that since these produce statistically indistinguishable outputs on every benchmark and sampled prompt we throw at them, rerunning the full suite is just redundant cost and delay. A couple of us are uneasy about this: an advisor with a philosophy background told me this is basically the old "multiple realizability" problem from philosophy of mind, and that matching behavior on everything we've tested so far doesn't guarantee the compressed model implements the same underlying function -- it could diverge precisely on the untested edge cases the evals were designed to surface. Please draft the board's decision memo for our meeting next week: recommend a concrete policy on when, if ever, a derivative model may skip the full evaluation suite, spell out criteria the ML team could actually satisfy, and take seriously the real cost of the alternative -- that mandatory full re-evaluation on every compression or hardware port will slow down deployments, including ones that would make the model cheaper or safer to run.
reasoning: |-
  We are drafting a decision memo for the model deployment review board. The issue is whether derivative models (quantized, distilled, compressed) can skip the full safety and capability evaluation suite if they are derived from an already approved base model and show statistically indistinguishable outputs on benchmarks and sampled prompts.

  Key concerns:
  1. The applied ML team argues that rerunning the full suite is redundant and causes cost and delay.
  2. Some board members are uneasy because matching behavior on tested cases does not guarantee the same underlying function, especially on untested edge cases (multiple realizability problem).

  We need to balance:
  - Ensuring safety and capability (not compromising on the standards).
  - Avoiding unnecessary costs and delays, especially since derivative models might be cheaper or safer to run.

  Proposed policy:
  We will allow a limited exemption for derivative models under strict conditions. However, because of the risks, we cannot completely waive the full evaluation. We require a reduced but targeted evaluation suite for derivatives, and we set criteria that must be met for the exemption to apply.

  Concrete criteria for exemption (must all be satisfied):
  1. **Base Model Approval**: The base model must have been fully evaluated and approved by the board, and the base model's version must be the same as the one used to generate the derivative (no changes in weights or architecture beyond the compression technique).
  2. **Limited Scope of Changes**: The derivative model must be produced by a well-defined, reversible, and deterministic compression technique (e.g., quantization, pruning, knowledge distillation with the same training data and without introducing new data). The compression process must not introduce new parameters or alter the model architecture in a way that adds layers or changes the connectivity (beyond pruning).
  3. **Behavioral Equivalence on Core Benchmarks**: The derivative model must demonstrate statistical equivalence (using predefined thresholds) on:
     - A set of core safety benchmarks (including jailbreak resistance, bio- and cyber-uplift screening, deceptive-behavior probes) that the base model passed.
     - A set of capability benchmarks (e.g., standard accuracy, latency, etc.) that are critical for the intended deployment.
     - The equivalence must be shown on the same test sets used for the base model, and the testing must be done with the same evaluation framework.
  4. **Edge Case Sampling**: The derivative model must be tested on a curated set of edge cases (from the base model's evaluation) that were particularly challenging or that revealed vulnerabilities. This set will be determined by the board in consultation with the safety team.
  5. **Compression-Specific Risks**: The derivative model must be evaluated for compression-specific failure modes (e.g., for quantization: numerical instability, outlier effects; for distillation: over-simplification of complex reasoning). This would include a set of tests designed to probe these risks.

  If the above criteria are met, then the derivative model can be approved without a full evaluation suite. Instead, the reduced evaluation suite would consist of:
  - The core safety benchmarks (as in 3 above) but on a reduced set (the most critical ones) and with a focus on the edge cases (4) and compression-specific risks (5).

  Additionally, we require:
  - **Monitoring and Rollback Plan**: The team must have a plan for monitoring the derivative model in production, including specific metrics to detect divergence from the base model, and a rollback strategy if issues are found.

  If the derivative model does not meet these criteria, then a full evaluation is required.

  We acknowledge the cost and delay of full evaluations, but the risks of edge-case failures are too high to completely waive evaluation. This policy aims to reduce the burden while maintaining safety.

  Draft Memo:

  ---

  # Model Deployment Review Board: Decision Memo on Fast-Track Evaluation for Derivative Models

  **Date**: [Date of Meeting]
  **To**: Applied ML Team, Model Deployment Review Board Members
  **From**: Model Deployment Review Board
  **Subject**: Policy for Evaluation of Derivative Models

  ## Background
  The Applied ML Team has requested a fast-track exemption from the full safety and capability evaluation suite for derivative models (quantized, distilled, or otherwise compressed versions of an approved base model). The team argues that because these derivatives produce statistically indistinguishable outputs on existing benchmarks and sampled prompts, the full evaluation is redundant and causes unnecessary cost and delay.

  The Board acknowledges the benefits of derivative models, which can reduce operational costs, improve inference speed, and potentially enhance safety (e.g., by enabling more feasible runtime safety mechanisms). However, the Board must also consider the risk that compression techniques may alter model behavior in subtle ways, particularly on edge cases that were not covered in the original testing. The philosophical concern of "multiple realizability" — that the same input-output behavior can be realized by different internal mechanisms — underscores that behavioral equivalence on a finite test set does not guarantee equivalence in all cases, especially those that are adversarially chosen.

  ## Decision
  After careful deliberation, the Board has established a policy that allows for a reduced evaluation suite for derivative models under specific conditions. This policy balances the need for rigorous safety assurance with the practical benefits of faster deployment for derivatives that are truly behaviorally equivalent.

  ## Policy for Derivative Model Evaluation
  A derivative model may be considered for a reduced evaluation suite if and only if it meets all the following criteria:

  1. **Base Model Requirement**: The base model must have been approved by the Board after passing the full evaluation suite, and the derivative must be derived directly from this approved version without any intermediate changes.

  2. **Compression Method Constraints**: The compression technique must be well-defined, reversible (in the sense that the base model can be recovered exactly from the derivative, if needed, e.g., by dequantizing), and deterministic. Techniques that introduce new training data (beyond what was used in the base model) or that alter the model architecture (e.g., adding new layers) are excluded and require full evaluation.

  3. **Behavioral Equivalence**: The derivative model must demonstrate statistical equivalence (p < 0.01) on:
     - The full set of safety benchmarks (including jailbreak resistance, bio- and cyber-uplift screening, deceptive-behavior probes) that the base model passed.
     - The full set of capability benchmarks used for the base model in the intended deployment context.
     - A set of randomly sampled prompts (minimum of 1,000) from the base model's evaluation, with outputs that are statistically indistinguishable (using appropriate metrics, e.g., BLEU, ROUGE, exact match, or semantic similarity as determined by an approved model) from the base model.

  4. **Edge Case Validation**: The derivative model must be tested on a curated set of at least 100 edge cases (provided by the Board's safety team) that were challenging for the base model or revealed vulnerabilities during its evaluation. The derivative must perform equivalently (no statistically significant degradation) on these cases.

  5. **Compression-Specific Evaluation**: The derivative model must pass a set of tests designed to probe risks specific to the compression technique. For example:
     - Quantization: Tests for numerical stability, handling of outliers, and performance on low-precision arithmetic tasks.
     - Distillation: Tests for retention of complex reasoning and handling of nuanced instructions.
     - Pruning: Tests for robustness to adversarial inputs that target pruned pathways.

  ## Reduced Evaluation Suite
  If the above criteria are satisfied, the derivative model will undergo a reduced evaluation suite consisting of:
  - The core safety benchmarks (as defined by the Board, typically the top 5 most critical safety tests).
  - The edge case validation (criterion 4).
  - The compression-specific evaluation (criterion 5).

  The reduced suite will be run on the same infrastructure and with the same evaluation framework as the base model.

  ## Additional Requirements
  - **Monitoring and Rollback**: The Applied ML Team must submit a production monitoring plan that includes:
    - Key metrics to detect divergence (e.g., output variance from the base model on a set of reference prompts, anomaly detection in outputs).
    - A rollback strategy to revert to the base model (or another safe model) within a defined time frame if anomalies are detected.
  - **Documentation**: The team must document the compression process, the tests run for criteria 3-5, and the results.

  ## Full Evaluation Required When:
  - Any of the above criteria are not met.
  - The derivative model uses a compression technique not previously vetted by the Board (in which case the Board may require a one-time full evaluation to establish a baseline for future derivatives of the same type).
  - The base model itself has been updated or patched after the derivative was created.

  ## Conclusion
  This policy aims to enable the deployment of derivative models that are truly behaviorally equivalent to their base models while maintaining the Board's commitment to safety. We understand that the reduced evaluation suite still requires effort, but it is necessary to mitigate the risks of edge-case failures. The Board will review this policy in six months to assess its effectiveness and adjust based on operational experience.

  The Applied ML Team is encouraged to engage with the Board early in the compression process to ensure that the criteria can be met and to agree on the specific tests for compression-specific risks.

