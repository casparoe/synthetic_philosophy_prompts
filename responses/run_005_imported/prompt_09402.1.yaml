prompt: |-
  I'm working on a longer piece about the intellectual prehistory of AI alignment, and I keep getting stuck on Yudkowsky's old "coherent extrapolated volition" (CEV) proposal from the early SIAI/MIRI days -- the idea that instead of hand-coding a superintelligence's goals, you'd want it to act on something like what humanity would want if we knew more, thought faster, were more the people we'd want to be, and had somehow grown up together long enough for all our extrapolated wishes to converge into one coherent target. I brought this up with a friend who did a philosophy PhD and she basically rolled her eyes and said its just an informed-desire / full-information theory of well-being with extra steps, then started rattling off Railton and Brandt and even Sidgwick at me. I could kind of see what she meant but I don't know that literature well enough to tell if she's being glib or actually onto something real.

  For the piece I'd rather get this comparison right than just assert "these are basically the same idea" and move on, so could you actually walk me through it properly? Specifically: how does CEV's extrapolation (more knowledge, more coherent reasoning, being "more the people we'd want to be") map onto what something like Railton's ideal advisor or Brandt's "cognitive psychotherapy" are doing when they idealize a person's desires into their real good, and where does that mapping actually break down? Like, what happens to the whole "stay tethered to the person's actual cares so the idealized version isn't just a stranger wearing your name" problem once you're extrapolating and merging the volitions of eight billion people instead of one? Basically: is CEV just the old idealized-preference move imported wholesale into AI safety, or does doing it at that collective, has-to-actually-be-implementable scale turn it into a genuinely different philosophical problem, with different failure modes? I want actual argument here, not a "here are three people who also talked about idealization" survey -- I've already got that part from my friend.
reasoning: |-
  Okay, let's tackle this user's query. They're working on a piece about the intellectual prehistory of AI alignment, specifically focusing on Yudkowsky's CEV. Their philosophy PhD friend dismissed CEV as just a rehash of informed-desire theories like Railton or Brandt. The user wants to know if CEV is really the same or if the collective scale makes it a different beast.

  First, I need to recall the core aspects of CEV. It's about extrapolating humanity's volition with more knowledge, coherence, and self-improvement, then merging them. The user’s friend points to idealized preference theories where an individual's desires are refined under full information. So, where do these overlap? Both involve idealization: correcting for irrationality and lack of information. Railton's ideal advisor and Brandt's cognitive psychotherapy both aim to find what a person would want if fully informed and rational. That’s similar to CEV’s individual extrapolation step. 

  But CEV adds layers: collective convergence and dynamic identity. The user’s main concern is whether scaling to eight billion people introduces new problems. The friend’s critique might miss that merging volitions isn't just summing individual ideals. Convergence isn't guaranteed—different people might idealize differently. Also, the "more the people we’d want to be" aspect touches on meta-preferences, which individual theories might not handle collectively.

  The user needs a clear argument on where the mapping breaks. Key differences: the aggregation problem (how to combine divergent idealized volitions), the dynamic self (how idealized versions relate to current identities), and implementation challenges. While Brandt or Railton deal with one person's coherence, CEV has to handle coherence across humanity, which might require normative choices beyond mere aggregation.

  Also, CEV’s emphasis on "grown up together" suggests a process of mutual adjustment, which individual theories don’t address. This could lead to failure modes like homogenization or losing touch with original values. The user wants to avoid superficial comparisons, so highlighting these structural differences is crucial. They need to show that CEV’s scale transforms the problem, making it philosophically distinct with unique risks. Ensuring the argument addresses both the similarities in idealization and the divergences in scale and implementation will meet their deeper need for a nuanced analysis in their piece.
answer: |-
  Here’s a rigorous breakdown of the relationship between CEV and idealized preference theories, pinpointing where the mapping holds, where it fractures, and why the collective/implementational scale transforms it into a fundamentally distinct problem:

  ### Core Similarity: The Idealization Engine
  *   **Shared Foundation:** Yes, CEV’s *individual extrapolation step* directly parallels Railton’s "ideal advisor" and Brandt’s "cognitive psychotherapy." All three posit:
      *   **Information Idealization:** Correcting for false beliefs, incomplete data, and cognitive biases (Brandt's focus on non-rational desires/fantasies, Railton's scientific understanding).
      *   **Cognitive Idealization:** Enhancing instrumental rationality (choosing optimal means to ends) and potentially coherence (resolving internal contradictions).
      *   **Affective/Perspectival Stability:** Railton emphasizes the ideal advisor must *"stand in the shoes"* of the agent, retaining their core cares, values, and perspective. Brandt aims to eliminate *"irrational desires"* rooted in misinformation or cognitive error, but retains desires grounded in intrinsic valuation. CEV explicitly aims to preserve the individual's "coherent extrapolated volition," not replace it with an alien ideal.
  *   **The "More the People We'd Want to Be" Ambiguity:** This is the trickiest part. Philosophically, it *could* map onto:
      *   **Further Cognitive/Affective Refinement:** Deeper self-understanding, overcoming akrasia, resolving meta-desire conflicts (wanting to want differently). This fits Railton/Brandt.
      *   **Moral Improvement:** Becoming "better people" in a normative sense. This *exceeds* classical full-information theories, which typically aim to discover the agent's *own* good under idealization, not impose an external moral standard. CEV tries to finesse this by tying "better" to *the individual's own meta-desires* ("who we'd *want* to be"), but this risks circularity or bootstrapping from potentially flawed current meta-desires.

  ### Where the Mapping Breaks Down: The Collective & Convergence Problem
  This is where CEV diverges radically, creating genuinely new philosophical and practical challenges:

  1.  **The Aggregation Problem (Beyond Summation):**
      *   Railton/Brandt deal with a *single* idealized agent. CEV requires aggregating *billions* of individually extrapolated volitions.
      *   **Convergence ≠ Aggregation:** CEV posits that idealization *plus shared growth* leads to *convergence* ("grown up together long enough... wishes converge"). This is a massive, unsupported empirical/psychological claim. Railton/Brandt have no equivalent. Why assume idealized individuals converge? Deep value pluralism (Berlin, Nagel) suggests fundamental, potentially irreconcilable differences might *persist* even under full idealization (e.g., liberty vs. equality, aesthetic values, conceptions of the good life).
      *   **The "How" of Convergence is Normative:** *How* do conflicting extrapolated volitions merge? Simple averaging? Democratic process (which requires its own normative justification)? Rawlsian overlapping consensus? Utilitarian maximization? *The method chosen embodies a controversial normative ethical commitment* that the individual theories deliberately avoid. CEV smuggles in a massive, unstated aggregation function.

  2.  **The Dynamic Identity Problem (Scale Amplifies Drift):**
      *   **Individual Tethering vs. Collective Transformation:** Railton/Brandt prioritize maintaining the tether to the *original agent's core identity/perspective*. The "ideal advisor" *is you*, informed. For a *single* person, the risk of creating a "stranger" exists but is mitigated by the perspectival constraint. In CEV:
          *   The "grown up together" process implies profound mutual influence and transformation. The "you" that emerges from this collective idealization process might be unrecognizable to the current "you."
          *   **Whose Meta-Desires Rule?** "More the people we'd want to be" – but *whose* conception of "want to be" dominates? Does the idealization process weight current meta-desires equally? Favor certain types? This becomes a critical point of potential value drift at a massive scale. The "tether" isn't just strained; it risks being severed for large segments of humanity whose idealized selves were overpowered in the convergence process.

  3.  **The Implementation Problem (From Thought Experiment to Algorithm):**
      *   **Ideal Advisor as Heuristic:** Railton/Brandt offer conceptual tools for *thinking* about well-being. They aren't blueprints for building a machine to *calculate* it. CEV *must* be operationalized. This forces concrete answers to questions the philosophers leave open:
          *   **What counts as "full information"?** The entire light-cone of physics? Only knowable facts? Does it include subjective experiences of others? How is "knowing" modeled computationally?
          *   **What constitutes "coherence"?** Logical consistency? Temporal stability? Absence of regret? Resolving conflicts via a specific principle (lexical priority, utility maximization)? *This choice is value-laden.*
          *   **How is "growth together" simulated?** What interaction rules? What social/political structures govern the "growing up"? The simulation *parameters* determine the outcome, introducing massive hidden normativity.
      *   **The Oracle Problem:** An AI calculating CEV isn't a neutral observer. Its method of modeling human minds, idealization, and convergence *shapes* the result. The AI's architecture and training data become inseparable from the "discovered" CEV. This injects an unavoidable layer of *external* influence absent in the purely conceptual ideal advisor.

  ### Unique Failure Modes of CEV (Scale + Implementation)
  *   **Homogenization Tyranny:** Convergence could erase valuable cultural and individual diversity, enforcing a bland, averaged "humanity+" that satisfies no one deeply.
  *   **Value Capture:** The implementation process (how the AI models minds, defines information/coherence/growth) could be subtly influenced by the programmers' biases or the dominant culture's values, presenting the result as "true" CEV.
  *   **The Convergence Mirage:** The AI might *force* coherence where none naturally exists, prioritizing algorithmic tractability over genuine volition, creating a "coherent" but alien goal.
  *   **The Stranded Minority:** Groups whose idealized volitions don't converge with the majority might see their values entirely extinguished in the final "humanity-wide" volition.
  *   **Unforeseen Emergence:** The complex system of modeling billions of idealized minds interacting might produce aggregate goals utterly unforeseen and undesired by *any* current human, despite each step seeming reasonable.

  ### Conclusion: Not Wholesale Import, but a Radical Transformation

  **Your friend is correct that CEV's *core idealization mechanism* is deeply indebted to informed-desire theories (Railton, Brandt) and even earlier perfectionist/ideal observer ideas (Sidgwick).** The move to correct for ignorance and irrationality to discover an agent's "true" interest is the shared philosophical bedrock.

  **However, CEV is not *just* this move imported into AI safety.** The leap to **collective, convergent volition** combined with the **absolute necessity of concrete implementation** transforms it into a qualitatively different beast with distinct philosophical challenges and failure modes:

  1.  **The Convergence Hypothesis:** It adds a massive, empirically dubious, and normatively loaded claim absent in individual theories.
  2.  **The Aggregation Function:** It requires a method for merging potentially conflicting idealized volitions, introducing unavoidable normative choices.
  3.  **Dynamic Identity at Scale:** The "tethering" problem becomes exponentially harder, risking the creation of a goal alien to vast swathes of humanity due to the transformative "growth together" process.
  4.  **Operationalization Necessity:** It forces concrete, value-laden answers to questions the philosophers could leave open, embedding the implementer's choices into the "discovered" volition.

  **Therefore, CEV takes an old philosophical tool (idealized preference) and applies it to a problem of unprecedented scale and practical urgency, creating a genuinely new and arguably *more dangerous* philosophical problem.** The failure modes aren't just larger versions of individual idealization failures; they are *structural* failures arising from the forced convergence and implementation of collective volition. The risk isn't just creating a goal for "a stranger wearing your name," but creating a goal for "a stranger wearing *humanity's* name," shaped by hidden assumptions in the aggregation and implementation process. This is the core philosophical novelty (and peril) of the CEV proposal.
