  ok so my friend group has this group chat called "philosophy nerds anonymous" (there's four of us juniors, we got into this after our AP Psych teacher went on a 20 min tangent one day and never really recovered) and for like a week now we've been arguing about "moral uncertainty" — basically the problem that even if you don't know whether utilitarianism, Kantian ethics, virtue ethics, etc is the actually-true moral theory, you still have to decide what to do, so theres presumably supposed to be some principled way to act that takes your own uncertainty seriously instead of just picking whichever theory you personally vibe with and ignoring the rest. one of my friends fell down a rabbit hole and found out there's a bunch of specific named proposals that real philosophers argue about for this, not just "idk follow your gut." the ones we found are: "My Favorite Theory" (act on whatever theory you personally find most credible, full stop), "My Favorite Option" (each theory basically "votes" for its favorite option weighted by how much you believe it, most votes wins), "Maximize Expected Choiceworthiness" (like expected value from stats class but applied to ethics), "Moral Parliament" (each theory gets delegates proportional to your credence in it and they bargain/trade votes like an actual legislature), "Variance Voting" (a fix where you normalize each theory's scale of "choiceworthiness" before comparing so extreme theories can't just dominate), and "Randomization" (roll weighted dice and just follow whatever theory comes up for that decision).

  We got stuck arguing over which of these is actually reasonable to use in real life versus which ones are basically a joke, and my one friend who's obsessed with competitive gaming suggested we settle it with a tier list instead of arguing over facetime for another 2 hours. So — can you rank these 6 approaches into a S/A/B/C/D tier list, S being most philosophically defensible as an actual decision procedure and D being closest to broken/indefensible, with like a one-sentence reason for each so we have "receipts"? Can you format it as a JSON block like this so I can just screenshot it into the chat:

  ```json
  {
    "S": ["approach — reason", ...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
