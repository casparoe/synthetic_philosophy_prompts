  We are ranking 6 approaches for decision-making under moral uncertainty:
   1. My Favorite Theory (MFT) — act on whatever theory you personally find most credible, full stop.
   2. My Favorite Option (MFO) — each theory "votes" for its favorite option weighted by your credence, most votes wins.
   3. Maximize Expected Choiceworthiness (MEC) — expected value but for ethics, i.e., for each option, compute the sum over theories of [credence * choiceworthiness under that theory], then pick the one with the highest.
   4. Moral Parliament (MP) — each theory gets delegates proportional to credence, and they bargain/trade votes.
   5. Variance Voting (VV) — normalize each theory's choiceworthiness scale (to avoid scale variance) before applying MEC-like aggregation.
   6. Randomization (R) — roll weighted dice to pick a theory and then follow that theory for the decision.

   Criteria: philosophical defensibility as an actual decision procedure for real life. We want S (most defensible) to D (broken/indefensible).

   Analysis:

   S tier: 
     - Maximize Expected Choiceworthiness (MEC): This is a direct analog to expected utility in decision theory, which is the standard for rational choice under uncertainty. It is principled and accounts for both the probability of each theory and the degree to which an action is good or bad according to that theory.
     - Variance Voting (VV): This is a refinement of MEC that addresses a major criticism: that without normalization, theories with larger scales (e.g., utilitarianism might assign huge numbers to saving many lives) can dominate. By normalizing, we get a fairer comparison. It's an improvement over MEC and thus also highly defensible.

   A tier:
     - Moral Parliament (MP): This is a more complex but potentially realistic model that captures negotiation and compromise. It might better reflect how collective decisions are made. However, it is less straightforward and the bargaining process might be arbitrary. Still, it's a serious proposal.

   B tier:
