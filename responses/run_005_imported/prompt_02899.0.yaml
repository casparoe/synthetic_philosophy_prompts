  ### General Principle for Updating on Conditional Evidence
  When you receive evidence of the form "if A, then the odds on B are such-and-such" (e.g., "if A, then P(B) = p"), it provides direct information only about the conditional probability P(B | A). To incorporate this into your beliefs:

  1. **Interpret the evidence**: Treat it as a constraint on the conditional distribution (e.g., P(B | A) = p). It does not directly inform:
     - P(A) or P(not A) (the marginal probability of A).
     - P(B | not A) (the probability of B given not A).
     - Any other variables or conditions unrelated to A and B.

  2. **Update the conditional probability**: Revise P(B | A) to the given value (e.g., p), while keeping all else constant from your prior beliefs. This means:
     - P(A) remains unchanged unless there is specific evidence about it.
     - P(B | not A) remains unchanged unless there is specific evidence about it.
     - Joint probabilities involving A and B should be updated using the definition of conditional probability: P(A and B) = P(B | A) × P(A).

  3. **Apply Bayesian or information-theoretic principles**:
     - **Bayesian updating**: Use a prior distribution that reflects initial beliefs. The evidence defines a likelihood that constrains P(B | A). The posterior should satisfy this constraint while minimizing unnecessary changes (e.g., via maximum entropy).
     - **Independence and relevance**: If A and other variables (e.g., C) are independent in the prior, they should remain independent after updating P(B | A). Do not revise beliefs about unrelated variables (e.g., P(C)) without evidence.
     - **Handling uncertainty**: If the evidence is approximate (e.g., "odds are something like 3 to 1"), model it probabilistically (e.g., P(B | A) follows a distribution centered at 3/4), but this doesn't change the core principle.

  4. **Common pitfalls to avoid**:
     - **Confusing P(B | A) with P(A and B)**: The clue is about the probability of B given A, not the joint probability. For example, learning P(B | A) = p does not imply that P(A and B) increases; it depends on P(A).
     - **Assuming dependence**: Do not infer that P(B | not A) must be similar to P(B | A) unless you have a prior reason (e.g., hierarchical model). Default to independence.
     - **Over-updating**: Resist the intuition that asymmetry in one area (e.g., uneven West) implies asymmetry elsewhere. Only update where evidence exists.

