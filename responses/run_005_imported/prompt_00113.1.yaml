prompt: |-
  I'm a retired chemist who's fallen down the rabbit hole of decision theory in retirement (turns out philosophy is way more addictive than titration curves ever were). I've been reading about updateless decision theory in the context of stuff like counterfactual mugging and Newcomb's problem, and there's one thing that's bugging me that none of the blog posts I've read really clear up.

  The whole pitch of UDT, as I understand it, is that you shouldn't update on the fact that you've observed yourself in some particular branch or situation -- instead you commit, from behind a kind of veil, to whatever policy is best across all the ways things could've gone, rather than reasoning from where you currently happen to find yourself. Fine, I think I get that much. But then whenever people actually work out what the UDT-optimal policy is for a given problem, they seem to lean pretty heavily on logical/mathematical updating -- like, the agent has to figure out what the predictor would do, or derive what follows from the setup, and that seems to require updating on logical facts as it goes, the same way any of us updates once we've actually worked through a calculation. So how is "don't update on indexical/empirical evidence" compatable with "you must update on logical/computational facts just to act at all"? Is there a principled line between these two kinds of updating that I'm just not seeing, or is this a known soft spot in the theory that people mostly just wave hands over? I'd love an explanation that actually engages with the guts of this rather than just restating the "updatelessness" slogan.
reasoning: |-
  Okay, let me tackle this retired chemist's question. They're deep into decision theory, specifically updateless decision theory (UDT), and they're confused about the apparent contradiction between being "updateless" and still needing logical updates. 

  First, I need to unpack their core concern: they see UDT rejecting empirical updates (like which branch you're in) but then relying heavily on logical updates (like working through math proofs). They're wondering if this is a hand-wavy inconsistency in the theory. 

  Hmm, this is actually a really sharp observation. The key here is distinguishing between two types of information: empirical (which depends on your specific circumstances) and logical (necessary truths about the problem setup). UDT isn't against all updates - just against letting your arbitrary position in reality bias your decisions. 

  Let me think about Newcomb's problem. In UDT, you don't care whether you actually see two boxes or one. Instead, you choose the policy that works best across all possible versions of you - including those where the predictor put money in or left it out. But to even know what "best" means, you have to crunch the logical structure of Newcomb's problem itself. That's where logical updating comes in - it's about understanding the game rules, not your role in it.

  The chemist might benefit from seeing this as two separate phases: first, you do all the logical work to understand the dependencies (like how your choice relates to the predictor's action). Only then do you apply the updateless policy. The "veil of ignorance" idea is crucial here - you're not ignoring information, you're refusing to let your location in possibility space distort your values.

  I should emphasize that logical updating is fundamentally different because it's about necessary truths. When you prove 2+2=4, that's true in all branches. But knowing "I'm the version who got mugged" is only true for one branch. UDT says: make commitments that would've been good no matter which branch turned out to be yours.

  The counterfactual mugging example is perfect here. If Omega asks for $100, UDT pays because it knows that in the branch where the coin was heads (even though that's not this branch), paying was part of the deal that makes the whole policy worthwhile. The chemist might appreciate this being framed as honoring precommitments across possible worlds.

  What I absolutely must avoid is hand-waving. This thinker has clearly done their homework - they've spotted a real tension. The resolution lies in carefully distinguishing what kind of information you're updating on, and when. Logical updating happens before you apply the policy; empirical updating is what UDT avoids during decision-making.

  I'll structure this as: first clarify UDT's actual position, then show why logical updating is necessary and different, then use concrete examples to illustrate the phase separation. The punchline should be that UDT isn't update-averse - it's location-averse. The math updates aren't about where you are, but about how the universe works.
answer: |-
  Ah, a fellow traveler down the decision theory rabbit hole! Your background in chemistry likely gives you a keen eye for the *operational* details that pure philosophers sometimes hand-wave. You've pinpointed a subtle but crucial tension in Updateless Decision Theory (UDT) – the apparent contradiction between "don't update on indexicals" and "must update on logical facts." This isn't just a soft spot; it's a core conceptual challenge, and resolving it requires digging into the *kinds* of information and the *stages* of reasoning.

  **The Core Insight: Distinguishing Information Types & Reasoning Stages**

  UDT's "updatelessness" isn't a rejection of *all* updating. It's a specific rejection of updating on *indexical or contingent empirical information* that reveals "where you are" within the structure of possibilities defined by the problem. Conversely, updating on *logical/computational facts* is not just compatible; it's essential. The principled line lies in the *source* and *necessity* of the information:

  1.  **Logical/Mathematical Facts (Must Update):** These are necessary truths derived from the *problem specification itself* and the laws of mathematics/logic/computation. They are true in *all* possible branches/worlds/scenarios defined by the problem. Discovering them isn't learning "where you are"; it's learning *the rules of the arena you're playing in*. This includes:
      *   The payoff matrix/structure (e.g., "If I one-box and the predictor predicted one-box, I get $1M").
      *   The causal/acausal dependencies (e.g., "The predictor's action is a function of my decision algorithm's output").
      *   Mathematical theorems needed to compute outcomes (e.g., solving equations, proving properties of the predictor).
      *   The *logical implications* of your own decision algorithm (UDT's core trick).

  2.  **Indexical/Empirical Facts (Don't Update On):** These are contingent facts about *which specific branch, world, or instance* of the problem you happen to find yourself observing. They tell you "your location" within the pre-defined structure. Updating on these can lead to suboptimal policies by making you optimize for your local branch at the expense of the global strategy. Examples:
      *   "I am the version facing the mugger demanding $100 *right now*." (Counterfactual Mugging)
      *   "I see two boxes in front of me *right now*." (Newcomb's - though the observation itself might be logically entangled with the predictor's past action).
      *   "The quantum random number generator *actually* came up tails." (Quantum Counterfactuals).

  **How UDT Uses Logical Updating Without Contradiction: The Two-Stage Process**

  UDT agents reason in two distinct stages:

  1.  **Logical Pre-Computation Stage (Intense Updating Required):**
      *   **Input:** The *full specification* of the decision problem (payoffs, dependencies, nature of other agents like predictors, any relevant mathematical constraints).
      *   **Process:** The agent performs *all necessary logical/mathematical/computational work* to understand the structure. This involves massive "updating" on logical facts:
          *   It proves theorems about what the predictor *must* have done given its nature and the agent's potential algorithms.
          *   It calculates the logical consequences of choosing policy A vs. policy B *across all possible branches* defined by the problem's uncertainties (coin flips, predictor outputs, etc.).
          *   It solves for the policy (a mapping from the *type* of situation to an action) that maximizes expected utility *across the entire multiverse of possibilities* defined by the problem. Crucially, this calculation treats *all branches as equally real possibilities during the optimization* – the agent hasn't "observed" itself into one yet.
      *   **Output:** A single, fixed *policy function* `F(Situation_Type) -> Action`.

  2.  **Execution Stage (Strictly Updateless):**
      *   **Input:** The agent finally "wakes up" and observes the *specific situation type* it's in (e.g., "Omega is asking me for $100", "I see two boxes").
      *   **Process:** The agent *does not* re-run the optimization. It does *not* ask "Given *I* am *here*, what's best for *me* now?". It simply *looks up* the action dictated by the pre-computed policy function `F` for the observed situation type.
      *   **Output:** The action `F(Current_Situation_Type)`.

  **Resolving the Tension: Why Logical Updating Doesn't Break Updatelessness**

  *   **Logical Updates Define the Arena, Not Your Seat:** When the UDT agent proves a theorem about the predictor, it's learning a fact true for *all* instances of the problem. This doesn't tell it "where it is" within the problem; it tells it the *universal rules*. It's like a chemist calculating reaction kinetics: the Arrhenius equation applies universally, regardless of which specific test tube the reaction occurs in. The calculation defines the possibilities, not the observation.
  *   **The Policy is Computed Behind the Veil:** The critical pre-computation happens *before* the agent knows which branch it will observe. It optimizes from a perspective of profound ignorance about its "location." The logical work is done to figure out what commitment, made *now* (before knowing the location), leads to the best overall outcome *across all locations*.
  *   **Execution is Mechanical:** Once the policy `F` is fixed, acting requires *no further decision-theoretic reasoning*. Applying `F` is like following a pre-written instruction manual. Observing "I am in branch X" is only used to find the relevant page (`F(X)`), not to rethink the manual's contents. Any "updating" here is purely indexical lookup, not Bayesian belief revision about what's optimal.

  **Illustration with Counterfactual Mugging:**

  1.  **Logical Pre-Computation (UDT Agent):**
      *   Problem Spec: Omega flips a coin. Heads: Agent wins $10,000. Tails: Omega appears, asks for $100. Omega is a perfect predictor.
      *   Logical Work: The agent considers possible policies: `Always Refuse` and `Always Pay`.
          *   Computes outcome of `Always Refuse`: Wins $10,000 if Heads ($0 if Tails). Expected Value (EV) = $5,000.
          *   Computes outcome of `Always Pay`: Wins $10,000 if Heads, Pays $100 if Tails. EV = ($10,000 * 0.5) + (-$100 * 0.5) = $4,950.
      *   **Ah, but wait!** This naive calculation misses the acausal dependence. The agent realizes Omega's prediction (and thus whether it set up Heads or Tails) *depends on what policy `F` the agent uses*. It must prove what Omega *would have predicted* for each candidate `F`.
          *   If `F(Mugging_Situation) = Refuse`, Omega predicts refusal. So: Heads branch: Agent wins $0 (Omega doesn't give $10k to a refuser). Tails branch: Agent refuses, pays $0. EV = $0.
          *   If `F(Mugging_Situation) = Pay`, Omega predicts payment. So: Heads branch: Agent wins $10,000. Tails branch: Agent pays $100. EV = $4,950.
      *   **Logical Update:** The agent discovers the acausal link: Choosing the `Pay` policy *causes* the Heads outcome (and the $10k) to exist. Choosing `Refuse` *causes* the Heads outcome to vanish (or not pay). The EV calculation is updated: `Pay` yields $4,950; `Refuse` yields $0.
      *   **Output Policy `F`:** `F(Mugging_Situation) = Pay`.

  2.  **Execution (Updateless):**
      *   Agent observes: "Omega is asking me for $100." (This is the `Mugging_Situation` type).
      *   Agent consults `F`: `F(Mugging_Situation) = Pay`.
      *   Agent pays $100. **It does NOT think:** "But I *know* the coin was tails! Paying gets me -$100, refusing gets me $0 *here and now*. I should refuse!" That would be updating on the indexical fact "I am in the Tails branch" and optimizing locally, breaking the pre-commitment that made the $10k possible in the Heads branch.

  **The Chemist's Analogy (Because why not!):**

  Think of synthesizing a complex molecule with competing reaction pathways.

  *   **Logical Pre-Computation:** You calculate all possible reaction kinetics and thermodynamics *in advance* using quantum chemistry or known rate laws. You determine the optimal protocol (temperature, catalyst, concentration, sequence) that gives the best *overall yield* considering *all possible pathways*, even if some pathways lead to minor byproducts under certain conditions. This involves intense "updating" on physical laws and molecular properties (universal truths).
  *   **Execution (Updateless):** You run the reaction *exactly as per the pre-calculated protocol*. You do *not* constantly sample the reaction mixture mid-process and think, "Hmm, I see a lot of intermediate X forming *right now*, maybe I should suddenly change the temperature to favor pathway Y *at this instant*." That local optimization (updating on the indexical "state of the flask right now") would likely ruin the carefully planned global optimization and reduce overall yield. You trust the pre-commitment based on universal principles.

  **In Conclusion:**

  Your intuition is sharp. UDT absolutely relies on massive logical updating *during the policy formulation stage* to understand the universal structure of the problem and the consequences of different policies across all branches. The "updatelessness" strictly applies to the *execution stage*: once the optimal policy is computed from behind the veil of ignorance, the agent binds itself to that policy and executes it mechanically, refusing to let the contingent fact of "which branch I observe" override the global strategy. The principled line is between **updating on necessary logical truths that define the problem's rules** (essential) and **updating on contingent indexical facts that reveal one's position within those rules** (forbidden during execution). It's not hand-waving; it's a carefully staged division of cognitive labor. Keep probing – this level of scrutiny is how the foundations get stronger!
