answer: |-
  Here are 10 interview questions designed to push beyond surface-level thesis restatement, targeting the core tensions in her work, the mechanics of impossibility, COMPAS, and upstream bias. Each includes a predicted dodge and a surgical follow-up:

  ### Core Mechanics & Impossibility
  1.  **Question:** "You argue standard fairness metrics aren't necessary for fairness. The Kleinberg/Chouldechova result shows that when base rates differ and the predictor is imperfect, satisfying both calibration *and* error rate balance (like equal FPR/FNR) is mathematically impossible. *Specifically*, could you walk us through the conditional probability math (e.g., `P[Y|R,G]` vs. `P[Y|G]`, `P[R=1|Y=0,G]`) that forces this trade-off under unequal base rates? Why isn't this a fundamental constraint on *any* notion of fairness relying on prediction?"
      *   **Predicted Dodge:** Appeal to the metrics being flawed concepts, not engaging with the math.
      *   **Follow-Up:** "Even granting your critique of the *metrics*, doesn't this math expose a *real-world tension* between accurate risk assessment for groups with different prevalence and treating similar individuals similarly across groups? How does your framework resolve *this* tension without simply declaring one side irrelevant?"

  2.  **Question:** "If we accept that satisfying all standard metrics is impossible under unequal base rates, and you argue *none* of them are necessary, what *positive criterion* does your framework offer that a practitioner *must* satisfy? Is it purely contextual/subjective, or is there a testable condition?"
      *   **Predicted Dodge:** Focus on context, process, or values, avoiding a concrete technical criterion.
      *   **Follow-Up:** "Can you give a *specific, non-trivial example* of a predictor that your framework deems fair in a lending context *despite* violating calibration, error rate balance, *and* demographic parity? What single feature of that predictor makes it fair?"

  ### COMPAS Adjudication
  3.  **Question:** "In the COMPAS case, ProPublica focused on unequal FPR/FNR (disparate impact on errors), while Northpointe defended calibration (predictive parity). Given your rejection of both metrics as necessary for fairness, who, *in your view*, was closer to identifying a *genuine fairness problem*? Or were both fundamentally missing the point?"
      *   **Predicted Dodge:** Say both were wrong/missing the point, remain neutral.
      *   **Follow-Up:** "If forced to choose based *only* on the information they highlighted (FPR disparity vs. calibration), which concern – the potential for disproportionate harm via errors *or* the potential for unfair risk inflation/deflation – aligns *more closely* with a harm your framework prioritizes? Why?"

  4.  **Question:** "COMPAS aimed to predict 'risk of recidivism.' Your framework might argue fairness depends on what 'risk' *means*. If 'risk' is defined purely statistically (probability of re-offense), Northpointe's calibration argument holds. If 'risk' incorporates something normative (e.g., 'culpability' or 'desert'), ProPublica's error focus might resonate. How does your framework *guide* defining the target variable itself fairly?"
      *   **Predicted Dodge:** Highlight the ambiguity of "risk" without committing.
      *   **Follow-Up:** "In lending, our target is 'probability of default within X months.' Is this purely statistical, or does *your* conception of fairness require embedding normative elements (e.g., considering *why* base rates differ) *into the target definition itself*? How would that work?"

  ### Upstream Bias & Base Rates
  5.  **Question:** "You critique metrics for ignoring context. In lending/policing, the base rate gap (e.g., default, arrest) is often *caused* by systemic bias (redlining, biased policing). Does your framework require that a 'fair' predictor *compensate* for this upstream injustice (e.g., by *not* reflecting the biased base rate), or is it 'fair' to predict based purely on the observed, biased reality?"
      *   **Predicted Dodge:** Separate the predictor's fairness from societal fairness; say the predictor should reflect reality.
      *   **Follow-Up:** "If a predictor trained on biased data *perfectly* reflects the biased reality (is calibrated, minimizes loss), but this perpetuates disadvantage (e.g., denies loans based on biased history), how can your framework call it 'fair' without endorsing the status quo? Doesn't fairness require *some* deviation from pure prediction accuracy?"

  6.  **Question:** "Assume we agree upstream bias distorts base rates. Does your framework allow for, or even demand, *different fairness criteria* for groups impacted by different levels of upstream bias? For example, requiring stricter error rate parity for a group with historically inflated arrest rates?"
      *   **Predicted Dodge:** Argue fairness is holistic, not group-wise.
      *   **Follow-Up:** "Operationally, how would a lender implement this? Would it require explicitly defining 'impacted groups' and setting *different* fairness constraints per group? Doesn't this risk essentialism or create new tensions?"

  ### Beyond Critique - Application & Tensions
  7.  **Question:** "You present toy cases where 'obviously fair' predictors flunk standard metrics. But in real-world, high-stakes domains like lending with complex, correlated features, ambiguity reigns. How does your framework *prevent* 'fairness' from becoming entirely subjective or a shield for harmful outcomes? What are the guardrails?"
      *   **Predicted Dodge:** Emphasize process, deliberation, values – avoid concrete guardrails.
      *   **Follow-Up:** "Can you name *one specific, measurable thing* a regulator could demand of a lender (beyond process docs) that aligns with your framework and *wouldn't* be satisfied by a predictor meeting just one standard metric?"

  8.  **Question:** "Lenders face legal requirements (e.g., disparate impact liability under ECOA/FHA) often interpreted through these statistical metrics. If your framework says a predictor violating all metrics *can* be fair, how should a compliance officer act? Ignore the law? Advocate for legal change? Or is your framework purely academic?"
      *   **Predicted Dodge:** Separate ethics from law; say compliance must follow current law.
      *   **Follow-Up:** "Given the tension, what's your *practical advice* to a data scientist *today* who believes meeting a standard metric (say, equal FPR) is legally safe but ethically dubious under your view? Should they prioritize legal safety or your ethical framework?"

  9.  **Question:** "Process fairness (explainability, appeal) is crucial in your work. But can a truly *unfair* predictor (by your lights) be 'redeemed' by a fair process? Conversely, can a predictor meeting no standard metric but deemed 'fair' by your contextual analysis *still* cause unacceptable harm if the process is opaque?"
      *   **Predicted Dodge:** Argue process and outcome are intertwined.
      *   **Follow-Up:** "Prioritize: If resources are limited, should a lender focus first on building a predictor aligned with your contextual fairness *or* on building robust explainability/appeal processes? Which mitigates more harm?"

  10. **Question (Closing):** "Stepping back: If the industry adopted your contextual, non-metric approach wholesale tomorrow, what's the *biggest concrete improvement* in fair lending outcomes you'd expect to see in 5 years? And what's the biggest *new risk* it might introduce?"
      *   *(Forces synthesis beyond critique, envisioning real-world impact and trade-offs)*

  **Key Interview Strategy:**
  *   **Anchor in Reality:** Constantly tie questions back to lending ("In a loan approval context...") and the user's experience ("As a practitioner who burned weeks..."). This grounds her philosophy.
  *   **Force Specifics:** Demand examples, operational details, and prioritization. Avoid letting her stay in abstract critique.
  *   **Pre-empt Dodges:** Use the predicted escapes to craft immediate, tighter follow-ups that block easy exits.
  *   **Embrace Tension:** Frame questions around conflict (math vs. context, law vs. ethics, accuracy vs. justice) – that's where the insight lies.
  *   **Control Framing:** Explicitly define terms like "risk" or "fair" within questions to prevent semantic sidetracks.

  These questions push her to move beyond "metrics are bad" into the harder territory of *how her alternative works*, *how it handles real conflicts*, and *what it demands of practitioners* – exactly where the value (and potential flaws) of her framework lie. Good luck with the interview!
