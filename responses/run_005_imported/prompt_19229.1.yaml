prompt: |-
  So this got weirdly personal for me recently: I'm a data scientist at a small consumer-lending startup, and a couple months ago compliance asked us to make our default-risk model "fair" by satisfying both equal calibration across racial groups and equal false-positive/false-negative rates across those groups. I burned like two weeks trying to hit both before a friend who minored in philosophy told me that's not a bug, it's an actual proven impossibility outside of a couple narrow special cases (equal base rates, or a perfect predictor) -- the Kleinberg/Mullainathan/Raghavan and Chouldechova results, apparently from a few years back. That sent me down a rabbit hole into the whole COMPAS/ProPublica fight, where ProPublica nailed Northpointe for unequal false-positive rates by race and Northpointe shot back that the tool was calibrated just fine, and it turns out they were probably both just defending opposite horns of the same impossibility theorem without ever framing it that way. Kinda broke my brain, honestly.

  Anyway, I co-host a tiny tech-ethics podcast with an old coworker (we have maybe 50 listeners and half of them are our moms), and completely coincidentally next week's guest is a philosopher whose whole deal is arguing that none of the standard statistical fairness criteria -- calibration, equalized odds, demographic parity, whatever -- are even necessary conditions for an algorithm to be fair, let alone sufficient, and she's got a pile of toy cases where a predictor everyone would call obviously fair still flunks every metric on the list. Could you draft me 8-10 interview questions that go beyond letting her just restate that thesis? I want at least one question that makes her engage with the actual mechanics of the impossibility result rather than just gesturing at "the metrics can conflict" -- why unequal base rates specifically force the trade-off, and what she thinks we're obligated to give up as a result. One built around the COMPAS case specifically, asking her to actually adjudicate who was closer to right, Northpointe or ProPublica, given her view. And one that leans on the fact that the base-rate gap between groups is itself often downstream of biased policing or lending history -- does that change what her framework says counts as fair, or is she treating that as a separate question entirely. For each one, add a quick note on the dodge she'll probably reach for and a follow-up that closes it off.
