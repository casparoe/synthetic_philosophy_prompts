answer: |-
  You're absolutely right to feel uneasy - this situation highlights a profound unfairness driven entirely by luck, not differing levels of responsibility. Here's why it feels "off":

  1.  **Identical Actions, Different Outcomes:** You both made the *same* conscious decision to skip proper testing due to time pressure. The core ethical lapse (prioritizing speed over stability) was identical.
  2.  **Luck Dictated the Consequences:** The *only* difference was the random occurrence (or non-occurrence) of the edge case that triggered failure. Your code *could* have failed just as catastrophically under slightly different circumstances. His didn't fail because he was *worse*; it failed because it encountered the specific conditions that exposed the flaw.
  3.  **The System Rewarded Luck, Not Merit:** You were praised for "shipping fast," but the *only* reason that speed didn't backfire was sheer luck. Your coworker was punished not for being *less competent* or *more negligent*, but for having *bad luck*. The company rewarded risk-taking that *happened* to succeed and punished risk-taking that *happened* to fail, despite the underlying risk being the same.
  4.  **The "Heads I Win, Tails You Lose" Problem:** This creates a perverse incentive. If you take a risky shortcut and it works, you're a hero. If you take the *same* risky shortcut and it fails, you're a villain. This discourages transparency about risks and encourages gambling with stability.

  **What made it feel worse for your coworker?**

  *   **Visible Impact:** His decision had immediate, tangible negative consequences (downtime), making it impossible to ignore. Yours remained hidden.
  *   **Scapegoating:** Organizations often look for someone to blame after a major incident, especially one causing significant disruption. He became the visible target.
  *   **Confirmation Bias:** Once the outage happened, management likely retrospectively viewed *his* corner-cutting as inherently more reckless or his work as less thorough, even though it wasn't.

  **What you did wasn't "better":**

  You got lucky. That's the crucial difference. Your decision carried the same inherent risk to the system. The potential for catastrophe existed in both parts.

  **Why this feeling matters:**

  Your discomfort is your ethical compass working correctly. It recognizes that:

  1.  **Justice wasn't served:** The punishment/reward was based on outcome, not intent or action.
  2.  **The process is flawed:** The system failed to recognize the systemic issue (pressure leading to corner-cutting) and instead focused on the individual who happened to trigger the failure.
  3.  **It could easily have been you:** This highlights the fragility of your own "success."

  **What you can do (moving forward):**

  1.  **Acknowledge Your Role (Internally/Privately):** Be honest with yourself that you took the same risk.
  2.  **Advocate for Systemic Change (Carefully):**
      *   **Focus on Process:** Frame the incident as a learning opportunity for the *team* and the *process*. Argue that tight deadlines led both of you to skip testing, exposing a vulnerability.
      *   **Push for Blameless Post-Mortems:** Suggest adopting a practice where the focus is on understanding *why* the failure happened (e.g., unrealistic deadlines, lack of testing time, pressure to ship) rather than *who* made the last mistake.
      *   **Advocate for Realistic Timelines:** Use your influence (gained from being "the hero") to argue for schedules that include adequate time for testing, especially for complex or critical features. Say: "This incident showed how easily hidden risks can cause outages. To prevent this, we need to bake in proper test time, even if it means adjusting deadlines."
      *   **Promote Shared Responsibility:** Emphasize that quality is a team effort, and releases require collective confidence in the code, not just individual heroics.
  3.  **Support Your Coworker (Discreetly):** If appropriate and safe, acknowledge privately to him that you understand the unfairness of the situation and that you both faced the same pressures. Don't make excuses, but show empathy. "That was incredibly rough, and honestly, it could have just as easily been my code that blew up. The pressure to skip testing was real on both sides."
  4.  **Change Your Own Behavior:** Let this be a stark lesson. Commit to not cutting that particular corner again, regardless of pressure. Advocate for the necessary time.

  **In essence:** Your coworker didn't do something worse. You both took the same gamble. He rolled snake eyes; you rolled a seven. The unfairness lies in the system punishing the unlucky gambler while rewarding the lucky one, instead of recognizing that the gamble itself was the problem. Your unease is justified – it's the recognition of this fundamental injustice and the fragility of your own "success." Use that unease to drive positive change in your team's processes and your own practices.
