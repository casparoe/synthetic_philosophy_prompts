  Directionality is key. Wittgenstein's objection to Russell applies here. An act predicating "loves" between Kate and Mark must specify who loves whom. The act-based theory must explain how the act's structure encodes this order without additional elements. If the structure relies on mental tokens or roles, then those roles need their own unification, restarting the regress.

  Also, consider complex cases like nested propositions: "Othello believes Desdemona loves Cassio." The act must handle the sub-act of Desdemona loving Cassio. How does the higher-order act structure the sub-act to avoid misordering? If the sub-act's structure isn't preserved, the same components could form different beliefs, like Cassio loving Desdemona. This mirrors Russell's problem.

