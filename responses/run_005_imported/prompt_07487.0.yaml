  To build the case, I should steelman the act-based position first. Acts aren't composed of parts; they're primitive events. Predication is a cognitive act where the agent attributes a property to an object. This intrinsic unity avoids Bradley's regress because there's no need for glue—the act itself is the unity. The friend might argue that the structure of the act includes the agent's intentional state, which inherently orders the constituents.

