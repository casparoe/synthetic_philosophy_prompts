answer: |-
  Here are six progressively challenging interview questions designed to press the core tension in resolute choice, with precise follow-ups targeting likely replies:

  ### Question 1: The "Single Decision" Boundary
  *"You argue there's only one decision—the plan adoption—and later actions are mere execution. But when the agent faces the *physical act* of (e.g.) trading Z for A in the final step of the pump, they consciously *could* deviate from the plan. If they feel a strong *preference* in that moment to deviate (because they prefer Z > A), isn't this a genuine decision-point requiring justification beyond 'I said so earlier'?"*  
  **Likely Reply:** "Execution isn't a decision; it's enacting prior agency."  
  **Follow-Up:** "If the agent *physically enacts* Z-for-A while internally *preferring* to keep Z, isn't this a volitional act contradicting their current preference? How is this not a decision forced against their will *at that moment*?"

  ### Question 2: Sophisticated Choice as Alternative
  *"Sophisticated agents avoid money-pumps by foreseeing their future choices and pruning inconsistent plans upfront. Why isn't this sufficient? Doesn't sophistication achieve dynamic consistency *without* requiring the agent to act against their *current* preferences during execution?"*  
  **Likely Reply:** "Sophistication surrenders to akrasia; resoluteness affirms unified agency."  
  **Follow-Up:** "But sophistication avoids the pump *and* never asks the agent to act against their preference *at the moment of choice*. If both strategies evade exploitation, why prefer resoluteness when it demands painful self-overriding?"

  ### Question 3: Transitivity Relabeled?
  *"Resolute agents choose *plans* rather than myopic outcomes. But if cyclic *outcome* preferences (A>B, B>C, C>A) lead to cyclic *plan* preferences (e.g., Plan ABC > Plan BCA > Plan CAB > Plan ABC), haven’t you just shifted intransitivity upstream? Doesn’t resoluteness *require* transitivity over plans to avoid infinite indecision?"*  
  **Likely Reply:** "Agents don’t have cyclic *plan* preferences; they commit to one optimal plan."  
  **Follow-Up:** "What *grounds* the 'optimality' of the chosen plan if not transitive preferences over plans? If cyclic outcome preferences *generate* conflicting plans, how do resolute agents avoid arbitrariness in plan selection without implicit transitivity?"

  ### Question 4: Distinguishing from Ulysses Contracts
  *"How is resolute choice *not* just internalized precommitment? When Odysseus bound himself to the mast, it was an *external* constraint overriding local preferences. Resoluteness seems identical: binding 'future you' to 'past you’s' plan, overriding local preferences. Is the difference merely metaphysical?"*  
  **Likely Reply:** "Ulysses is external coercion; resoluteness is internal integrity—acting as your 'whole self'."  
  **Follow-Up:** "If 'whole self' agency is vested *only* at the planning stage, doesn't that disenfranchise the agent's perspective *during execution*? Isn't the 'executing self' still *you*, with its own preferences?"

  ### Question 5: The Experience of Self-Violation
  *"Imagine a resolute agent in the final pump step: they trade Z for A as planned, but *deeply regret it* as they do so, feeling they’ve harmed themselves. Isn’t this phenomenological evidence that a genuine conflict exists? How can resoluteness be rational if it *feels* like self-betrayal?"*  
  **Likely Reply:** "Regret is mistaken; they *should* feel satisfaction in upholding their commitment."  
  **Follow-Up:** "If the agent *experiences* persistent regret despite knowing their plan was 'whole-self' optimal, doesn’t this suggest the 'whole self' model fails to capture their actual valuation *over time*?"

  ### Question 6: Evidence Against Resoluteness
  *"What hypothetical scenario would make you concede resolute choice is flawed? For instance: if resolute agents *systematically regret* their executed plans (despite no new information) or remain exploitable in multi-agent settings?"*  
  **Likely Reply:** "Systematic regret would imply incorrect plan selection, not flawed resoluteness."  
  **Follow-Up:** "If *no* observed regret or exploitation can falsify resoluteness—because deviations are labeled 'failure of will' or 'flawed planning'—isn’t it unfalsifiable? Does this shield the theory from counterevidence?"

  ---

  ### Key Tactics Embedded:
  1.  **Phenomenological Pressure:** Questions 1 & 5 force engagement with the *lived experience* of choice execution, challenging the abstraction of "no decision here."
  2.  **Structural Comparison:** Question 2 forces a defense against a less paradoxical alternative (sophistication). Question 4 demands a distinction from external precommitment, exposing potential circularity in "internal" agency.
  3.  **Transitivity Trap:** Question 3 directly targets whether resoluteness smuggles in transitivity at the plan level, undermining its claim to "vindicate" cyclicity.
  4.  **Falsifiability:** Question 6 prevents retreat into "true Scotsman" defenses by demanding concrete defeaters.

  These questions compel the guest to either:
  - Defend the counterintuitive claim that acting against your *current* preference isn't a decision/violation,  
  - Admit that resoluteness implicitly imposes transitivity on plans, or  
  - Concede that resoluteness is indistinguishable from self-paternalism.  

  Good luck with the interview!
