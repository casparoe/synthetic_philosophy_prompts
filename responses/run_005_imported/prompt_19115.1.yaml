prompt: |-
  A friend and I spent an entire dinner arguing about money-pump arguments and never settled whether resolute choice actually rescues an agent with cyclic preferences or just relabels the problem. I produce a small decision-theory podcast, and next month's guest is a philosopher who has built her career defending resolute choice against both the demand for transitivity and the rival strategy of sophisticated choice. Whenever someone objects that resoluteness asks her to act against her own preferences at the moment of choice, her standard line is that there is no second decision there, only the first one being carried out. Write me six or seven interview questions that make that deflection progressively harder to use. Include at least one question pressing whether resoluteness secretly just moves the transitivity requirement up a level, onto preferences over entire plans, rather than genuinely vindicating cyclic preferences over outcomes. Include one distinguishing her position from a Ulysses-and-the-mast style external commitment device, and one asking why sophisticated choice doesn't already dodge the pump without needing resoluteness at all. End with a question about what she would accept as evidence against her own view, and give each question a short follow-up keyed to the reply she's most likely to give.
