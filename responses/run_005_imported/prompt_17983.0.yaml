answer: |-
  You're right to feel uncomfortable with your friend's reasoning—it's not just "shitty," it's fundamentally flawed both ethically and *strategically*. Here's why ditching the tow driver is **not** the rational move, even in purely self-interested terms:

  ### 1. **The "Rational Self-Interest" Argument Fails Under Scrutiny**
     - **False Premise of Zero Consequences**: Your friend assumes "no reputation on the line," but this ignores:
       - **Your Own Self-Image**: Welching corrodes your integrity. If you rationalize betrayal as "smart," you normalize untrustworthiness, making future dishonesty easier. This erodes self-respect, a high psychological cost.
       - **The Witness Effect**: Your friend *knows* you didn’t pay. You’ve now signaled to them that promises are optional. This damages *their* trust in you and subtly encourages them to act opportunistically toward you later.
       - **Unexpected Ripple Effects**: Small towns have networks. What if the tow driver mentions your car model/plate to a mechanic friend? Or you cross paths at a gas station? "No consequences" is an assumption, not a guarantee.

  ### 2. **The Hidden Long-Term Costs of Betrayal**
     - **Eroding the System You Rely On**: That driver helped you because he believed in reciprocal decency. By cheating him, you actively degrade the social contract. Next time *you’re* stranded, potential helpers—aware people exploit goodwill—may drive past. Your "win" today could cost you or others dearly tomorrow.
     - **Game Theory Reality**: In single-interaction scenarios ("one-shot games"), betrayal *seems* optimal. But human society relies on *repeated interactions*. Acting honorably in anonymous situations (like this) sustains a system where strangers help strangers—a net benefit to everyone, including you.

  ### 3. **The Rational Benefits of Paying**
     - **Psychological Payoff**: Upholding your promise reinforces your identity as trustworthy. This builds self-confidence and reduces cognitive dissonance ("I’m a person who does the right thing").
     - **Future Leverage**: Paying + thanking him earns you a moral advantage. If you ever meet again (or need another tow locally), he’ll vouch for you. Honor creates unexpected opportunities.
     - **Risk Mitigation**: Paying eliminates *all* risk of backlash (e.g., him reporting your plate as suspicious, confronting you publicly, or sharing the story in ways that harm your local reputation). Peace of mind has tangible value.

  ### 4. **The Ethical Dimension IS Rational**
     - Trustworthiness isn’t just "nice"—it’s a social survival tool. Societies where promises are kept function better than those where they’re discarded. By paying, you invest in a world where people help strangers at 1 AM. *You directly benefit from this norm.* Dismantling it for $300 is like burning down a bridge you’ll need again.

  ### The Bottom Line
  **Paying isn’t naive—it’s strategically wiser.** Your friend’s view is dangerously short-term: it grabs $300 but poisons the well of trust you drink from daily. Rationality includes weighing abstract costs like integrity, systemic trust, and psychological burdens. 

  **What to tell your friend:**  
  *"Saving $300 by betraying someone who trusted me might feel like 'winning,' but it makes the world a little darker and me a little smaller. It’s not just immoral—it’s bad math. That $300 buys me self-respect, reinforces a system that helps people like us, and avoids hidden risks. Welching is like eating the seeds you need to plant next year’s crop."*  

  **TL;DR:** Pay the man. You’ll sleep better, uphold a system that protects everyone, and avoid the slow corrosion of your own character. That’s the truly rational choice.
