  ## The Vera Variations

  The email from Dr. Petrov arrived like a shard of ice slipped between the ribs. *Congratulations on the shortlist*, it began, dripping false warmth. Then: *However, concerns regarding attribution persist. Given the extensive lacunae in Vera Petrova’s original manuscript and your documented… creative interpolations, does "Vera’s Last Poems" truly represent her work, or yours? The committee deserves transparency.*

  Elena stared at the screen. Ten years. Ten years coaxing meaning from water-stained notebooks, deciphering Vera’s cramped script in a language whispered by fewer than a thousand souls. Poems fragmented by time, damp, and Vera’s own habit of abandoning lines mid-thought. Gaps yawned everywhere. Page three: only the first stanza intact, the rest a Rorschach test of mildew. Page seven: a single, haunting image – *the well’s black throat remembers the rope* – floating in a sea of blank, degraded paper. Page eleven: entirely Elena’s creation, woven from a marginal note about *birch bark peeling like old letters* and Vera’s documented obsession with migrating cranes. She hadn’t hidden this. Her translator’s preface meticulously charted the "reconstructed passages," marked by brackets. She’d believed the work was a bridge, a collaboration across time. Vera’s voice, channeled through her necessity.

  **Position One: It Is Vera’s.** Standing before the framed photograph of Vera – fierce eyes, untamed grey hair – in her study, Elena felt the conviction solidify. The core *was* Vera. The imagery, the rhythm of thought, the way the poems grappled with silence and absence – pure Vera. Her interpolations weren’t inventions; they were *restorations*, filling negative space defined entirely by Vera’s existing lines. Like repairing a shattered vase with gold; the form remained Vera’s. The prize nomination validated this. Vera *was* the sequence. She emailed the committee chair, attaching scans of the original fragments beside her translations, highlighting the clear lineage. "The essence is indisputably Vera Petrova’s," she typed, fingers firm.

  **Position Two: It Is Not Vera’s.** Dr. Petrov’s counter-argument arrived via committee forward. It was surgical. He dissected Page Eleven, the birch bark/crane poem. "No trace of this exists in the extant Vera fragments. The imagery, while evocative, leans towards contemporary ecological lyricism, absent from Vera’s known, more surrealist tendencies. This isn’t translation; it’s ventriloquism." He pointed to a reconstructed stanza on Page Three, arguing its meter was smoother, more "accessible" than Vera’s characteristic, jarring cadences. "Where Vera ends and Elena begins," he concluded, "is not a line but a no-man's-land. Attributing the whole to Vera is a fiction." Elena pulled the fragile originals from their archival sleeves. The gaps *were* absolute. Silence. Blankness. Her words *did* sit in that void. A cold doubt seeped in. *Had* she smoothed the edges? Had she, desperate for wholeness, imposed her own voice onto Vera’s silence? The sequence felt suddenly foreign, heavy with her own fingerprints. Maybe it *wasn’t* Vera’s at all. Just Elena’s elaborate, well-intentioned forgery.

  **Position Three: It Is Both.** Cousin Anya arrived smelling of rain and old libraries. "Petrov’s a vulture," she declared, pouring tea. "He wants the spotlight, or maybe just hates seeing Vera honored." Anya, who remembered Vera’s laugh, her sharp temper, her habit of humming folk tunes while staring out windows. "Look," she said, tapping the published book, open to the reconstructed Page Eleven. "Does it *feel* like her? That image – the cranes stitching the sky, the bark like old letters? Vera *lived* that. She watched those cranes every autumn from the dacha. She kept every letter Papa ever sent, tied with birch twine. You didn’t invent the feeling, Lena. You *found* it. In the gaps, in the notes, in the air she left behind." Anya’s certainty was warm, familial. The sequence *was* Vera – her life, her obsessions, channeled through Elena’s skill. It was both: Vera’s bones, Elena’s flesh. The truth lived in the fusion, the collaboration. Elena almost wept with relief. This felt sustainable. Shared ownership.

  **Position Four: It Is Neither.** The next morning, in the cool silence before dawn, Elena returned to the physical manuscript. Not the printed book, not the scans, but the fragile, damaged pages themselves. She laid out Page Three: the single surviving stanza, then the mildewed void where she’d woven her reconstruction. She looked at Page Seven: the lone, powerful line about the well, surrounded by paper so degraded it was nearly translucent. She examined Page Eleven: blank except for Vera’s scribbled margin note (*birch bark - letters?*) on an otherwise empty sheet, where Elena had built the entire poem. She searched, minutely, obsessively, for the seam. Where did "Vera" definitively end and "Elena" begin? Not just in the gaps, but *in the words themselves*.

  The surviving stanza on Page Three – was its power inherent, or did it gain resonance *because* of the surrounding void she’d filled? Her reconstruction on that same page – was it truly independent of the surviving fragment that shaped its necessity? The famous line about the well – was its starkness amplified by the emptiness she hadn’t filled *around* it? And Page Eleven – her poem sprang *only* from Vera’s tiny marginal note. The note needed her poem to become more than a scribble; her poem needed the note to claim any connection to Vera at all. Where was the intrinsic "Vera-ness" or "Elena-ness" residing purely *in* the words on *that* page? Not in the intention (Vera’s fragment, her own effort), not in the material (the paper was just paper, ink just ink), but in the words *themselves*? She couldn’t isolate it. The "Vera" of the sequence wasn’t a fixed essence captured in the fragments; it was a designation arising *from* the fragments, *from* the gaps, *from* her labor, *from* the context. The sequence wasn't *fundamentally* Vera’s, nor *fundamentally* hers, nor *fundamentally* both. The question itself – "Is it hers?" – demanded a self-existing truth the words couldn’t hold alone on the page. It was neither... and yet, it *was* "Vera’s Last Poems."

  The award ceremony proceeded. The committee, after "careful consideration of the complex textual history," affirmed the attribution. Dr. Petrov sat stiffly in the front row. Anya beamed. Elena read aloud the sequence’s final, reconstructed poem – the one built from Vera’s note about the cranes. Her voice was steady. The words hung in the air, resonant and beautiful. No one questioned *who* had written them in that moment. They were Vera’s. The plaque on the prize said so.

  Later, when the stonemason asked for the inscription beneath Vera’s newly carved name, Elena didn’t hesitate. "Poet," she said. And beneath that: *"The Well's Black Throat Remembers the Rope / The Cranes Stitch the Sky with Old Letters."* Lines salvaged, lines created, side by side. The rain fell on the fresh granite, blurring the ink on the mason’s sketch, soaking into the earth where Vera lay. The words remained, doing their work, belonging perfectly and without inherent essence to the name etched above them.
