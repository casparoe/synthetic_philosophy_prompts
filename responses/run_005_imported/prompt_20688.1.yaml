  The ending must show conventional truth functioning without ultimate foundation. Imagining the award ceremony where the attributed poems are read aloud while rain blurs the manuscript's ink and pencil - a visceral metaphor for dependent origination. The gravestone inscription becomes the perfect final image: words functioning perfectly while literally weathering.

  Strictly avoiding:
