  - Institutional processes like prize committees

  Word count management is crucial. The four positions need distinct scenes (rival's email, cousin's visit, committee meeting, archive examination), each advancing both plot and logical sequence without over-explaining. The manuscript's materiality - water stains, pencil edits, insect holes - will carry philosophical weight silently.
