  Hmm, I need to think of a scenario where "permanent" (won't be reversed due to circumstances) and "irreversible" (can't be reversed even with all possible interventions) diverge meaningfully. The classic example that comes to mind is witnessed cardiac arrest without resuscitation attempts. But why would that highlight the gap? 

  Ah, yes—if a patient collapses in a remote location with no medical help available, their cardiac arrest is permanent (because no one will intervene) but not truly irreversible (since timely CPR could potentially restart circulation). Yet legally and clinically, we'd declare death based on permanence. 

