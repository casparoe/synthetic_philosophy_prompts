  ### Grading Summary

  **Part (a): 4/4**  
  The answer provides a clear, step-by-step explanation of the Mere Addition Paradox and accurately demonstrates how it drives total utilitarianism to the Repugnant Conclusion. Key strengths:  
  - Correctly frames the process starting with a high-welfare population (A).  
  - Explains the "mere addition" of lives worth living (A+) as "not worse" under total utilitarianism.  
  - Notes the transition to a more equal population (B) with equal or higher total welfare.  
  - Explicitly invokes transitivity to reach the vast, barely-worth-living population (Z).  
  **Minor note:** The description of population A as "modest" could be tightened (the question specifies "ten billion people, all with very high quality of life"), but this doesn’t materially impact the logic.  

  **Part (b): 5.5/6**  
  The answer correctly explains critical-level utilitarianism’s core modification and how it avoids the Repugnant Conclusion but omits one key technical detail:  
  - **Strengths:**  
    - Clearly defines the subtraction of a fixed positive critical level (e.g., \(w_i - c\)) before summation.  
    - Explains why barely-worth-living lives (below critical level) become net-negative contributions.  
    - Directly applies this to show why Z is worse than A.  
  - **Weakness:**  
    - Fails to explicitly state that the critical level \(c\) **must be positive** (not zero or negative). This is essential because a zero critical level collapses back to total utilitarianism, and a negative one creates absurd results.  
  **Deduction:** -0.5 for this omission.  

  **Part (c): 5/5**  
  The answer perfectly identifies the Sadistic Conclusion as the cost and traces it to critical-level utilitarianism’s core mechanism:  
  - Explicitly names the Sadistic Conclusion and Parfit’s role in identifying it.  
  - Explains how sub-critical lives (even if positive) count as net negatives, making it preferable to add fewer people with *negative* welfare over more people with *low-positive* welfare.  
  - Directly links this cost to the subtraction mechanism used to avoid the Repugnant Conclusion.  
  - Appropriately references Arrhenius’s impossibility theorem as broader context.  

  **Total Score: 14.5/15**  
