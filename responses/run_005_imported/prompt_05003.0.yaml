prompt: |-
  I spent about thirty five years running an analytical chemistry lab before I retired, and lately I've been filling my time working through some philosophy of language texts, mostly self-taught (right now I'm wrestling with Frege in translation, which is it's own kind of adventure at my age). The puzzle about identity statements has really gotten under my skin: why is "Hesperus is Phosphorus" informative, while "Hesperus is Hesperus" is just empty and trivial, even though both are true and both names pick out the exact same object? I think I've got the sense/reference distinction down on paper, but every explanation I run into reaches for the same handful of examples - Hesperus/Phosphorus, that Superman/Clark Kent business, maybe "water is H2O" if the author's feeling adventurous - and I'm starting to worry I've just memorized the stock answer instead of actually understanding what's going on.

  So here's what I'd like: give me a genuinely different example of the same puzzle, ideally pulled from the history of science rather than logic textbooks - chemistry, astronomy, biology, whatever you like - where two names or descriptions were both in use for a good stretch of time before anyone realized they picked out one and the same thing, and where figuring out the identity was a real, substantive discovery rather than something true just by the meanings of the words. Walk me through what the two "senses" or modes of presentation would be in Frege's terms, explain why the identity claim counts as informative on his account, and then tell me honestly whether your example gives Frege's own sense/reference solution any trouble - compared to, say, a more Kripke-style view where names are just rigid tags with no descriptive content doing the work. And please, no Hesperus, no Superman, no water-is-H2O - my reading group already wore that one out.
