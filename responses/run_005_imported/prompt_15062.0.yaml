  I need to create a sharp exchange between an internalist defending Williams's view and an externalist representing critics like McDowell or Nagel. The internalist must use the Owen Wingrave case to argue that reasons require a sound deliberative route from the agent's motivational set (S), while the externalist should counter with the case of a thoroughly cruel person who supposedly has reasons to stop being cruel despite lacking any such route.

  The tricky part is making sure both characters are equally formidable. The internalist needs to address whether expanding S to accommodate such cases is valid or just an ad hoc move that guts internalism of meaning. The externalist must respond substantively to the internalist's actual arguments, not just repeat objections. This requires deep familiarity with the literature - Williams, McDowell, Nagel, Scanlon, etc.

  I'm considering structuring the dialogue to escalate logically: opening salvos, core arguments with examples (Owen vs the sadist), then the crucial debate about the integrity of S. The internalist should push hard on why external reasons claims are unintelligible without motivational grounding, while the externalist must press on normative authority beyond psychology. The sadist case is perfect for forcing the internalist to either bite the bullet or admit S-expansion risks making internalism vacuous.

  For authenticity, I'll have them reference specific texts (e.g., Williams' "Internal Reasons" paper, McDowell's "Might There Be External Reasons?"). Their language should be precise but conversational - no monologues. I want the tension palpable, especially when the internalist argues that externalism collapses into hypothetical imperatives and the externalist retorts that internalism confuses reasons with mere motives.

  The conclusion shouldn't resolve neatly; it should leave both positions strained but standing, true to Williams' own acknowledgment of external reasons' intuitive pull. This mirrors seminar discussions where students grapple with unresolved tensions. The user will likely appreciate seeing their course concepts rigorously tested in this way.
answer: |-
  ## Seminar Sparring: Internalism vs. Externalism on Reasons

  **Setting:** A philosophy seminar room after class. Papers strewn, coffee cups half-full. **Dr. Aris Thorne (Internalist)** and **Dr. Elena Voss (Externalist)** remain, deep in discussion.

  **Aris Thorne (Internalist):** Elena, I appreciate your points earlier about the *intuition* of external reasons, but Williams’s internalism provides the only coherent *explanation* for what a reason-claim *means*. Take Owen Wingrave. His family insists he has a reason to join the military – an "external" reason based on tradition, honour, duty. But Owen feels nothing but revulsion. He has no desire for martial glory, no fear of dishonour in *their* sense. For Williams, the only intelligible reason-claim we can make *to Owen* is one traceable to *his* actual motivational set – S. We can say, "Owen, *if* you want to avoid your grandfather’s wrath, *then* you have a reason to enlist." But absent any element in *his* S that could, via sound deliberation (correcting ignorance, avoiding logical errors, weighing desires), lead to the motivation to enlist… the bald claim "You have a reason to enlist" is simply false, or worse, unintelligible. It’s projecting *our* values onto him, mistaking *our* reasons for *his*.

  **Elena Voss (Externalist):** Aris, I grant the Owen case is compelling for its context. He’s conflicted, his S *does* contain elements potentially responsive to deliberation – perhaps a desire for peace, or autonomy. But Williams’s framework becomes morally bankrupt when we consider the *truly* recalcitrant agent. Imagine Callias: not conflicted, but thoroughly cruel. He takes deep, self-satisfied pleasure in the suffering of others. His S contains no shred of empathy, no latent desire for approval that might be leveraged, no hidden fear of consequences. Sound deliberation, by Williams’s lights – clearing factual errors, being consistent – leaves his motivational core untouched. He *knows* he causes pain and *delights* in it. According to internalism, we must say Callias has *no reason whatsoever* to stop being cruel. But that’s absurd! Surely, the suffering he inflicts *itself* constitutes a reason for him to stop, regardless of his motivational architecture. Morality isn’t merely about satisfying existing desires, even corrected ones; it imposes demands.

  **Aris Thorne:** Ah, the cruel person – the externalist’s favourite battering ram. But let’s dissect this. First, are we *sure* no sound deliberative route exists? Williams emphasizes S includes not just desires, but "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments." Could cruelty *itself* be based on a misconception – perhaps a false belief about the victims' humanity, or a miscalculation of long-term consequences? If so, deliberation *might* dislodge it. But grant your premise: Callias’s S is hermetically sealed, cruelty is foundational. The internalist *does* say: "Callias has no reason to stop." The claim "Callias has a reason to be kind" is, *for Callias*, false. It has no practical traction *for him*. It doesn’t engage his will.

  **Elena Voss:** But that concedes the normative high ground! It reduces reasons to mere psychological levers. You’re saying the *only* thing that could make it true that Callias has a reason is if some motivational switch flips inside him. But the *reason* he *should* stop – the objective wrongness of inflicting suffering – exists independently of whether his psychology acknowledges it. Like Nagel argues in *The Possibility of Altruism*, reasons stem from the objective features of situations and our place within them. Callias’s capacity for agency itself, coupled with the fact of suffering, generates the reason, irrespective of his contingent motivations. To deny this is to make normativity hostage to psychology.

  **Aris Thorne:** You accuse me of reducing normativity, but I accuse externalism of *inflating* it into obscurity. What *is* this "objective reason" floating free of any possible connection to an agent’s motivations? How does Callias *grasp* it? How does it *function* in his practical reasoning? Williams’s point is that for a reason to be *his* reason, it must be capable of motivating him *under the right conditions* (sound deliberation). Your "objective reason" seems inert, incapable of being *any* agent's actual reason unless it connects to their S. It risks being a philosopher's fiction. Now, you might retort: "But we *can* expand S! Perhaps S includes a 'capacity to recognize reasons' or a 'fundamental interest in the good'." But here’s the crux, Elena: **Isn't that move utterly ad hoc? Doesn't it drain internalism of its critical content and explanatory power?**

  **Aris Thorne (Continuing):** Williams’s internalism gains its force precisely by grounding reasons in the *actual*, potentially idiosyncratic, motivational sets of agents. It explains why reasons are *relative to the agent*. If we start bloating S with universal, reason-responsive capacities *just* to accommodate the intuition that Callias *must* have a reason, we’ve effectively smuggled externalism in through the back door. We’ve defined S so broadly ("all rational agents have a disposition to respond to moral reasons") that *every* external reason claim becomes vacuously true by definition, because S will *always* contain the necessary hook. This robs internalism of its bite. It becomes indistinguishable from a version of externalism wearing an internalist mask. The point of S is its *contingency*. If we make S necessarily contain the seeds of morality for all agents, we’ve abandoned the core Williamsian insight about the radical diversity of possible S's and the potential for genuine normative silence from the external perspective.

  **Elena Voss:** Sharp point, Aris. You’re right that simply *defining* S to include a universal reason-responsiveness *would* be ad hoc and defeat Williams’s project. But I don’t think that’s the only move, nor is it McDowell’s or Nagel’s. McDowell, in "Might There Be External Reasons?", argues that the externalist isn’t positing a mysterious non-psychological entity. They’re claiming that *correct* deliberation – which includes *correctly perceiving the moral landscape* – can reveal motivations *not* prefigured in a crude, pre-deliberative S. For Callias, sound deliberation isn’t just logical consistency *given* his desire for cruelty; it involves *seeing the suffering he causes aright*. If he *truly* saw it – not just as a fact, but as a *reason-giving* fact – that perception *itself* could generate a motivation. The capacity for such perception *is* part of rational agency. It’s not an ad hoc addition; it’s constitutive of what it means to deliberate *soundly* about the practical world. Callias’s failure isn’t that he lacks some *extra* desire; it’s that his perception is *defective*, blocking the recognition of a reason *that is there*.

  **Aris Thorne:** So, on your view, "sound deliberation" for McDowell includes achieving a *correct moral perception*? That seems to presuppose the very external reasons Williams denies! How do we know what "correct perception" *is* except by reference to the external reasons we're trying to establish? This feels circular. For Williams, deliberation works *on* S, using the materials *in* S. Adding "correct moral perception" as a *component* of sound deliberation, rather than an *outcome* potentially reachable from S, seems like begging the question. It defines sound deliberation *as* that which leads to recognizing external reasons.

  **Elena Voss:** Perhaps it’s less circular and more acknowledging that practical reason isn’t value-neutral. Deliberation isn’t just instrumental calculus; it’s inherently evaluative. Seeing cruelty *as* cruel *is* seeing it as reason-giving to stop. The failure in Callias is a failure of *rationality*, not just motivation. He is *rationally defective* because he fails to be motivated by the reasons that are objectively present – reasons grounded in the nature of the action and its impact. Internalism, by tying reasons so tightly to existing motivations, risks making rationality itself contingent on psychological luck. Williams saves the *relativity* of reasons but sacrifices their *normative authority*.

  **Aris Thorne:** And externalism, Elena, secures normative authority at the cost of making it potentially *inert*, disconnected from the actual springs of action for many agents. It risks making reasons *spectral* – present but powerless. Williams’s internalism offers a sobering, perhaps uncomfortable, view: reasons are real, but they are tethered to who we are. The terrifying implication for Callias is that *within his own perspective*, he may be beyond the reach of reasons to change. Our condemnation is external. That’s the bleakness Williams forces us to confront. Expanding S to avoid it doesn’t solve the problem; it hides it.

  **Elena Voss:** And that bleakness, Aris, is precisely why we *must* push beyond it. Accepting that Callias has *no reason* to stop diminishes the very concept of a reason. It conflates "what *can* move him" with "what *ought* to move him." The authority of reasons must transcend the individual psyche, even if their motivational force, tragically, sometimes does not. The challenge for externalism is explaining *how* that authority connects to agency without collapsing into psychology; the challenge for internalism is explaining how reasons can be genuinely normative without that transcendence. Neither of us, it seems, has an easy time of it.

  **Aris Thorne:** (Smiling wryly) No, Elena, we certainly do not. Williams saw that tension clearly. The seminar continues... shall we get more coffee? I suspect we’ll need it.

  **Elena Voss:** (Returning the smile) Absolutely. This round goes to... ongoing dispute.
