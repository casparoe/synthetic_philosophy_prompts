answer: |-
  Your reading group's debate captures a core tension in evolutionary biology. Let's resolve the dispute and refine your heuristic:

  ### Addressing the Symmetry Objection
  Your critic makes a common but flawed argument. Shifting the default to non-adaptation is **not** symmetrically Panglossian because:
  1.  **Epistemic Asymmetry:** Gould & Lewontin's target was the *methodological* practice of assuming adaptation *without requiring evidence*. Their critique exposes that "adaptive storytelling" is often *too easy* and lacks falsifiability. Your proposed default corrects this by demanding *positive evidence* for adaptationist claims.
  2.  **Burden of Proof:** The adaptationist programme implicitly placed the burden of proof on *non*-adaptationist explanations. Your heuristic properly resets this burden to where it belongs in hypothesis testing: on the positive claim (adaptation).
  3.  **Falsifiability:** A default of non-adaptation is *more falsifiable*. Demonstrating adaptation requires positive evidence (e.g., comparative data, fitness measurements, genetic analysis). "Non-adaptation" as a starting point is simply the null hypothesis awaiting rejection.
  4.  **Gould & Lewontin's Intent:** They explicitly advocated for *pluralism*, not anti-adaptationism. Your heuristic fosters pluralism by forcing consideration of alternatives *before* accepting adaptation.

  **Verdict:** Your core insight is correct. The objection commits the fallacy of false equivalence.

  ---

  ### Sharpened Methodological Heuristic for Evaluating Adaptationist Claims
  Apply this multi-step filter when encountering claims in evolutionary psychology (or any trait adaptation hypothesis):

  1.  **Presumptive Null Hypothesis:**  
      *"This trait is likely a non-adaptive byproduct (spandrel), consequence of developmental constraint, pleiotropy, drift, or exaptation (co-opted for current use), until proven otherwise."*  
      *Burden of proof rests entirely on the adaptationist claimant.*

  2.  **Minimum Evidence Threshold for Adaptation:**  
      The claimant must provide **positive evidence beyond plausibility**:
      *   **Comparative Evidence:** Does the trait show phylogenetic patterns consistent with selective history? (e.g., presence/absence correlated with ecology in closely related species).
      *   **Fitness Consequences:** Is there *direct* evidence of heritable variation in the trait *and* its correlation with differential reproductive success *in relevant environments*? (Lab studies often fail this).
      *   **Design Specificity:** Does the trait exhibit complex, functional design *specifically* suited to the proposed adaptive problem, unlikely to arise as a byproduct? (Beware "adaptive-looking" spandrels!).
      *   **Developmental/Genetic Feasibility:** Is the trait developmentally plausible? Could it realistically evolve via known genetic mechanisms under selection? Does it avoid requiring implausible pleiotropic side-effects?
      *   **Alternative Exclusion:** Have leading non-adaptive hypotheses (drift, constraint, pleiotropy, exaptation) been seriously considered *and* shown to be insufficient? (Not just dismissed).

  3.  **Evolutionary Psychology Specific Tests (Heightened Scrutiny):**  
      For human behavioral/cognitive traits, demand **additional** evidence:
      *   **Universality:** Is the trait truly universal across human cultures? (Avoid WEIRD samples).
      *   **Domain-Specificity & Modularity:** Is there evidence the proposed module is *domain-specific* and *informationally encapsulated*? Or is it a domain-general process?
      *   **Ancestral Environment Plausibility:** Is the proposed adaptive function *and* selective pressure rigorously grounded in the Pleistocene EEA? Is it falsifiable?
      *   **Cultural Confound:** Can the trait be explained by cultural transmission/learning? Is there evidence it's *not* culturally variable or recent?
      *   **Reverse Engineering Caution:** Does the claim avoid *reverse engineering* (inventing a function for an existing trait)? Does it predict *previously unknown* traits or patterns?

  4.  **Acceptance Criteria:**  
      An adaptationist claim is credible **only if** it:
      *   Satisfies the Minimum Evidence Threshold.
      *   Passes the Evolutionary Psychology Specific Tests (if applicable).
      *   Demonstrates why non-adaptive alternatives are *less* parsimonious or evidentially supported.
      *   Makes novel, testable predictions beyond the initial observation.

  ---

  ### Key Refinements & Caveats
  *   **"Non-Adaptive" ≠ Useless:** Spandrels/exaptations can be crucial and functional *now*. The heuristic targets claims about *selective origins*.
  *   **Graded Skepticism:** Apply stronger skepticism to:
      *   Traits lacking obvious homologs in related species.
      *   Complex behaviors/cognitions without clear genetic/neural substrates.
      *   Claims relying solely on modern utility arguments.
  *   **Pluralism is the Goal:** This heuristic doesn't *deny* adaptation; it demands *evidence* for it and ensures alternatives are considered. Many traits *will* prove adaptive under scrutiny.
  *   **Distinguish Exaptation:** A trait co-opted for a new use *after* its origin (e.g., feathers for flight) is distinct from a true adaptation *shaped by selection for that function*. The heuristic targets the latter claim.
  *   **Avoid Dogma:** This is a methodological tool, not a belief. Evidence should always prevail.

  **Example Application (EP Claim):** "Jealousy is an adaptation for mate guarding."
  *   **Apply Heuristic:** Presume jealousy is a spandrel/exaptation (e.g., byproduct of general anxiety/social monitoring) until proven otherwise.
  *   **Minimum Evidence?** Is there comparative evidence in primates? Fitness data linking jealousy variation to reproductive success loss *in ancestral contexts*? Specific design for mate-guarding (vs. general monitoring)? Alternatives considered (e.g., cultural norms, general emotion dysregulation)?
  *   **EP Tests?** Universality (cultural variation exists)? Domain-specificity (overlaps with other anxieties)? EEA plausibility (mating structures varied)? Cultural confounds (correlates with patriarchal norms)?
  *   **Verdict:** Unless strong evidence addresses these points, the claim remains a "just-so story."

  This heuristic operationalizes Gould & Lewontin's critique into a practical, falsification-oriented framework. It replaces uncritical storytelling with a demand for evidence, promoting rigorous evolutionary science.
