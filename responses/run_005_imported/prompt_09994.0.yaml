answer: |-
  ## The Unblinking Gaze: Anscombe, Truman, and the Weight of Intention

  Elizabeth Anscombe's condemnation of Harry Truman as a murderer for the atomic bombings of Hiroshima and Nagasaki stands as a stark, uncompromising challenge to utilitarian justifications of warfare. Her argument, rooted in the doctrine of double effect (DDE), insists that intentionally killing the innocent as a *means* to an end – even a supremely good end like ending a war and saving lives – constitutes murder, morally impermissible regardless of consequences. The standard consequentialist defense, that the bombings minimized total casualties by averting a costly invasion of Japan, collides head-on with Anscombe's deontological fortress. Evaluating whether her argument succeeds requires scrutinizing the core distinction of DDE – intending evil versus foreseeing it – and engaging with the potent objection that the bombings might be redescribed to fit within DDE's permissible bounds.

  **Anscombe's Core Argument & The Consequentialist Challenge:**
  Anscombe's case rests on two pillars:
  1.  **The Absolute Prohibition:** Deliberately killing innocent non-combatants is intrinsically evil, an act of murder. No appeal to good consequences can justify this intrinsic wrong.
  2.  **The Double Effect Distinction:** Morality hinges crucially on the agent's intention. It is permissible to perform an action with a good intention (e.g., destroying a legitimate military target) that foreseeably but *unintentionally* causes the death of innocents as a side effect, provided the good effect is proportionate and not achieved *through* the evil effect. Crucially, the evil effect cannot be part of the agent's chosen *means*.

  Applied to Hiroshima and Nagasaki, Anscombe argues Truman *intended* the deaths of civilians *as the very mechanism* to shock Japan into surrender. The massive civilian casualties weren't an unfortunate byproduct of attacking a purely military objective obscured within the city; the destruction *of the cities and their populations* was the instrument chosen to achieve the surrender. Therefore, it was murder.

  The consequentialist defense counters that Truman faced a horrific choice: authorize the bombings or order a land invasion (Operation Downfall) projected to cost hundreds of thousands of American lives and potentially millions of Japanese lives (military and civilian). By choosing the bombings, he *minimized total net suffering and death*. On this view, the intent was to end the war swiftly; the civilian deaths, while tragic and foreseen, were a necessary cost of achieving that greater good. The moral calculus of saving net lives overrides any deontological constraints.

  **The Redescription Objection: Fitting the Bombings into DDE?**
  A significant challenge to Anscombe's application of DDE arises from the possibility of redescribing the bombings. Could Truman's intention be framed as targeting Japan's *war-making capacity* (military-industrial centers, communication hubs, troop concentrations) located within Hiroshima and Nagasaki, with the massive civilian deaths being a *foreseen but unintended* side effect? If this redescription holds, the bombings might satisfy DDE: the *intended* effect is disabling military infrastructure; the civilian deaths, however catastrophic, are *foreseen but collateral damage*. The proportionality condition (military necessity justifying civilian cost) would still need to be met, but the act wouldn't be intrinsically murderous on Anscombe's terms.

  **Evaluating the Objection and Anscombe's Strength:**
  While appealing, this redescription faces formidable difficulties in light of historical context and the nature of atomic weapons in 1945:

  1.  **Target Selection and Lack of Discriminatory Capability:** The Target Committee explicitly prioritized large urban areas untouched by conventional bombing to maximize the bomb's "psychological effect" and demonstrate its unprecedented destructive power. While Hiroshima housed military headquarters and Nagasaki had shipyards, the cities were chosen as *whole entities*. The atomic bomb, unlike precision munitions, was inherently indiscriminate at that scale; destroying "military targets within the city" *necessarily meant* destroying the entire city and its population. The means chosen guaranteed the civilian deaths.
  2.  **The Mechanism of Coercion:** The *intended mechanism* for forcing surrender was explicitly the shock and awe generated by the instantaneous annihilation of entire cities and their populations. As Secretary of War Henry Stimson noted, the target should be "a vital war plant employing a large number of workers and closely surrounded by workers' houses." The point was the *demonstration* of total destruction *upon a civilian center*. Truman's own statements and diary entries reflect an understanding that the bomb's horror, demonstrated on cities, was key. The civilian deaths weren't incidental to the military effect; they *were* the primary instrument of psychological coercion.
  3.  **Foreseeability vs. Intention:** Anscombe would argue that choosing a weapon and target where civilian destruction is guaranteed and is the known mechanism for achieving your goal *is* to intend that destruction as a means. You cannot claim merely to "foresee" an effect that is the inevitable and central causal pathway to your desired end. When you choose an action *because* it will cause X (mass civilian terror and death) to achieve Y (surrender), you intend X as a means to Y.

  **Can the Distinction Bear the Weight?**
  The objection highlights a genuine vulnerability in DDE: the potential for self-serving or post-hoc redescription of intentions. However, Anscombe's framework provides tools to resist this. Intention isn't merely a private mental state; it's discernible through the agent's chosen *action* and the *description under which the act is chosen*. Did Truman choose "destroying military facility Z"? Or did he choose "dropping a bomb of unprecedented destructiveness on City A to shock the enemy government into surrender through mass civilian annihilation"? The historical evidence strongly supports the latter description as the operative intention guiding the decision. While DDE requires careful application to avoid sophistry, in this specific case, the distinction holds. The sheer scale, the targeting choice prioritizing intact cities for maximal shock value, and the explicit rationale documented in planning documents make it implausible to claim the civilian deaths were merely a foreseen side-effect of a narrowly military strike.

  **Verdict: Anscombe's Argument Succeeds Against Consequentialism *in this Case***

  Anscombe's argument against the consequentialist defense succeeds in establishing that Truman's decision constitutes murder *in her specific sense*. While the consequentialist calculus of lives saved is compelling on its own terms, it fails to address Anscombe's core point: that certain acts are intrinsically wrong, regardless of consequences. The intentional killing of the innocent as a means is one such act.

  Furthermore, the attempted redescription of the bombings to fit within DDE fails under scrutiny. The choice of weapon, the selection of targets, and the documented reasoning behind the decision reveal that the destruction of the cities and their civilian populations *was intended as the direct means* of compelling surrender. The civilian deaths were not an unintended byproduct of attacking a pinpoint military target; they were the very fuel for the psychological shockwave Truman sought to create. Therefore, the action falls squarely within Anscombe's definition of murder: the deliberate choice to kill innocents as an instrument to achieve a goal.

  This verdict does not negate the horrific dilemma Truman faced, nor the terrible calculus of the invasion scenario. However, for Anscombe, the gravity of the moral prohibition against intentionally killing the innocent is such that it cannot be overridden, even by consequences of such magnitude. The bombings stand as a profound moral tragedy, not merely because of the immense suffering caused, but because, on Anscombe's rigorous analysis, they crossed a fundamental moral boundary: they used the intentional killing of the innocent as a weapon of war. Her argument, though demanding and uncomfortable, forces a confrontation with the absolute nature of this prohibition that consequentialism, by its very design, cannot accommodate. In the unblinking gaze of her principle, Truman's decision does indeed bear the mark of murder.
