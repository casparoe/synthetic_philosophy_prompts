    P(λ_{ab+}) = 0.1465  [since we want the product to be +1 with prob 0.1465]
    P(λ_{ab-}) = 0.8535

  Similarly, for (a,b'):
    P(λ_{a b'+}) = 0.8535  [because we want the product to be +1 with prob 0.8535? But wait: we want E=0.707, which is 2p(+1)-1=0.707 -> p(+1)=0.8535]
    P(λ_{a b'-}) = 0.1465

  For (a',b):
    P(λ_{a'b+}) = 0.1465
    P(λ_{a'b-}) = 0.8535

  For (a',b'):
    P(λ_{a'b'+}) = 0.1465
    P(λ_{a'b'-}) = 0.8535

  But now, is there any conflict? Note that for a run with settings (a,b), we are using only λ_{ab+} and λ_{ab-}, so the other λ's are not used. Therefore, the outcomes for other settings are not used and it doesn't matter what they are.

  This model is factorizable because the outcome for Alice depends only on her setting and λ, and similarly for Bob.

  And the distribution of λ depends on the settings: for each setting pair, we have a specific distribution over the 8 λ's (concentrated on the two for that pair).

  Now, we must check that the model reproduces the quantum correlations. For settings (a,b):

    E(a,b) = P(λ_{ab+}) * [A(a,λ_{ab+})*B(b,λ_{ab+})] + P(λ_{ab-}) * [A(a,λ_{ab-})*B(b,λ_{ab-})]
            = 0.1465 * (1*1) + 0.8535 * (1*(-1)) 
            = 0.1465 - 0.8535 = -0.707

  Similarly for the others.

  So it works.

  But note: the model uses 8 hidden variable states. We could reduce it to 4 by having one state per setting pair and making the outcome for the chosen setting pair stochastic? But then we would have to make the hidden variable include the randomness. Alternatively, we can have a continuous hidden variable.

  However, the point is to have a concrete toy model.

  Now, to the philosophical part: 

  You ask: is there a principled asymmetry that makes this kind of fine-tuned correlation a worse cost to bear than abandoning factorizable locality outright?

  And you also ask about retrocausal models.

  The standard objection to violating measurement independence (also called the "no-conspiracy" assumption) is that it requires a very special correlation between the hidden variable and the settings. In our model, for instance, when the experimenters choose the settings (a,b), the hidden variable is distributed only over λ_{ab+} and λ_{ab-}. But if they had chosen (a,b'), the hidden variable would have been distributed over λ_{a b'+} and λ_{a b'-}. This means that the hidden variable is "in on" the choice of settings. It must be that whenever the experimenters choose a particular pair of settings, the hidden variable is distributed in a very specific way that is tailored to produce the quantum correlations.

  This is seen as a "conspiracy" because it requires the hidden variable to be correlated with the settings in a way that seems to anticipate the choice. If the settings are chosen freely by the experimenters, then it is mysterious why the hidden variable should know in advance which settings will be chosen.

  Moreover, this correlation must be very precise to reproduce the quantum probabilities. In our model, the probabilities are set to very specific values (0.1465 and 0.8535). Any deviation would not reproduce the quantum correlations exactly. This fine-tuning is seen as unattractive.

  In contrast, giving up factorizability (as in quantum mechanics) does not require such fine-tuning with respect to the settings. The wave function is the same regardless of the settings, and the nonlocal correlation is fixed by the quantum state.

  However, nonlocality is also seen as unattractive because it violates relativistic causality. But in quantum mechanics, it is argued that the nonlocality cannot be used for signaling, so it is acceptable.

  Now, about retrocausal models: these models allow the future measurement settings to influence the past hidden variable. This is a time-symmetric mechanism. In such models, the correlation between the hidden variable and the settings is not a conspiracy in the sense of a pre-established harmony, but a consequence of time-symmetric physics. The settings chosen in the future can affect the hidden variable in the past. This is not fine-tuning in the same way because it is a dynamical law. However, it does require a revision of our understanding of causality.

  Some argue that retrocausality is not more palatable than conspiracy. Others see it as a natural way to restore locality (by having the hidden variable depend on both the past and the future). 

  In conclusion, the preference for protecting measurement independence may be partly due to taste, but there is a principled point: violation of measurement independence requires a very specific, fine-tuned correlation that is not required by the violation of factorizability. Moreover, the idea that the experimenters can freely choose the settings is deeply ingrained. However, if one is willing to give up the idea of free choice (or to embed it in a retrocausal framework), then one might find these models acceptable. But the retrocausal models are not obviously less costly than nonlocal ones, and they are still being debated.
