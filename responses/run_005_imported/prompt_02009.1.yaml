  ### What Both Overlook & Overall Verdict
  **Overlooked**: The debate conflates *levels of abstraction*. The board state is real *as a computational primitive* (validated by patching), but its *implementation* (monolithic vs. fragmented) is a separate question. Networks likely encode features redundantly across scales—e.g., a high-level "board state" direction may *supervene* on lower-level heuristics without being reducible to them. Neither addressed whether fragmentation implies "no fact of the matter" or merely *multiple valid descriptions* (like software vs. hardware views of a program).

  **Overall**: Marcus is closer to correct. The causal evidence (patching) strongly supports realism about the board state *as a functional component*. Elena’s SAE critique is valid but targets tooling, not the underlying reality. However, her caution is warranted: claiming we’ve found "the" representation risks reification; we’ve found *a* causally relevant structure, but its granularity (e.g., unified vs. bag-of-heuristics) depends on context. **Representations are real but perspectival**—like discovering a river has a consistent flow direction (real) while its molecular composition varies (contingent on measurement).
