prompt: |-
  hey, I'm a comparative politics PhD student who somehow ended up on my department's grad admissions committee this year. We're mid-fight over how to read files. Current system: 2 readers per applicant, admit only if both rank them top-tier, disagreements get hashed out live. One of the formal theory people wants 5 readers per file with majority vote instead, basically running a condorcet jury theorem argument at us - if each reader is even slightly better than a coinflip at spotting who'll thrive here, 5 independent readers will track the truth way better then 2. Others are pushing back hard: our readers arent independent (same training, same rubric, we chat before meetings anyway), we can't check anyone's "competence" since we never see what happens to applicants we reject, and maybe "who'll thrive" isn't even a fact waiting to be detected in the first place.

  I got stuck drafting the recommendation memo for next week - switch, keep the current system, or something else, and why. Can you write it? Actually take a side and defend it, and engage with the strongest version of the skeptical objection rather than just listing considerations on both sides.
reasoning: |-
  Okay, the user is a comparative politics PhD student who's on their department's grad admissions committee. They're in the middle of a debate about how to evaluate applications. The current system uses two readers per applicant, requiring both to rank the applicant as top-tier for admission. If they disagree, it's discussed in a meeting. 

  One formal theory person is pushing for five readers per file with a majority vote, arguing that according to the Condorcet Jury Theorem, even if each reader is only slightly better than random at identifying who will thrive, five independent readers would be more accurate. Others are objecting because readers aren't independent—they have the same training, rubric, and discussions—and it's impossible to verify individual reader competence since rejected applicants' outcomes are unknown. Plus, there's skepticism about whether "who will thrive" is an objective fact that can be detected.

  The user has to draft a memo recommending whether to switch systems, keep the current one, or propose something else. They want me to take a side, defend it robustly, and address the strongest counterarguments.

  First, I need to unpack the Condorcet Jury Theorem's applicability. The theorem assumes voter independence and identical competence above 50%. The objections here are valid: readers aren't independent due to shared training and discussions, which introduces groupthink. Also, without data on rejected applicants, there's no way to measure individual reader accuracy. The department can't even confirm if readers are better than random, let alone quantify their competence.

  The second big issue is whether "thriving" is an objective truth. In comparative politics, success is multifaceted and context-dependent. Factors like advisor fit, research interests aligning with faculty, or personal circumstances play huge roles that aren't captured in application files. This makes the Condorcet model overly simplistic because it treats admissions as a truth-discovery process rather than a holistic judgment.

  The formal theory proponent's argument is mathematically sound in a vacuum but ignores real-world constraints. Adding more readers increases workload significantly—five readers per file instead of two is a 150% increase. Given committee members' limited time, this could lead to rushed evaluations, ironically reducing quality. Plus, majority voting might overlook nuanced disagreements that the current system's discussion phase resolves, potentially missing strong candidates who are divisive but exceptional.

  The strongest counterargument is that the current system is too strict—requiring two "yes" votes means any single "no" can reject a good candidate. But in practice, the discussion phase mitigates this by allowing for debate and reconsideration. The key is to enhance that discussion rather than replace it with a mechanical vote.

  So, I recommend keeping the two-reader system but improving the discussion process. For instance, implementing a "devil's advocate" role for borderline cases or training readers to identify biases. This addresses the core problem—reducing false negatives—without overburdening the committee or pretending that reader judgments are perfectly independent or measurable.

  Addressing the formal theorist: while their model is elegant, its assumptions don't hold here. Independence is compromised by shared norms, and competence is unverifiable. Moreover, admissions aren't just about aggregating votes; they're about contextual judgment, which requires dialogue. The department should lean into its strength—collective deliberation—rather than force a statistical fix that doesn't fit.
answer: |-
  ## Memorandum: Graduate Admissions Evaluation Protocol Recommendation  
  **To:** Departmental Graduate Admissions Committee  
  **From:** [Your Name], PhD Student, Comparative Politics  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Against Adopting 5-Reader Majority Vote System; Proposal to Strengthen Current Protocol  

  ### 1. Recommendation Summary  
  **Retain the current 2-reader system with mandatory consensus for top-tier ranking**, supplemented by targeted reforms to strengthen deliberation and reduce false negatives. **Reject the 5-reader majority vote proposal** based on fundamental mismatches between Condorcet Jury Theorem (CJT) assumptions and the realities of graduate admissions.  

  ### 2. Critical Engagement with the 5-Reader Proposal  
  The formal theory colleague’s argument relies on CJT, which states that if individual voters are:  
  - **(A) Independent**,  
  - **(B) Competent** (p > 0.5 accuracy), and  
  - **(C) Voting on a binary “truth”**,  
  then majority voting with more voters increases decision accuracy.  

  **We reject this proposal because all three assumptions fail in our context:**  

  #### **A. Independence is Unattainable and Undesirable**  
  - **Strongest Objection:** Committee members are *deliberately trained to apply shared rubrics*, participate in pre-meeting discussions, and are socialized into departmental norms. This creates correlated judgments—not statistical independence.  
  - **Why Independence is Harmful Here:** Graduate admissions requires *interpretive consistency* across files. Forcing artificial independence (e.g., forbidding discussion) would fracture application of our holistic criteria (e.g., "research potential," "fit"). This risks rewarding idiosyncratic or outlier readings, not "truth."  

  #### **B. Competence is Unmeasurable and Likely Heterogeneous**  
  - **Strongest Objection:** *We have no data to verify p > 0.5*. We observe outcomes only for admitted students—a classic selection bias problem. Rejected applicants vanish from our dataset, making calibration impossible.  
  - **Deeper Issue:** "Competence" varies by subfield. A formal theorist’s threshold for "rigor" may differ from an ethnographer’s, especially when assessing qualitative statements. CJT assumes homogeneous competence—a fatal flaw in our interdisciplinary field.  

  #### **C. “Who Will Thrive” is Not a Binary Fact**  
  - **Strongest Objection:** Thriving is *emergent* and *path-dependent*, not a latent trait detectable in files. Success depends on advisor match, cohort dynamics, funding stability, and intellectual evolution—none reducible to a pre-admission "signal."  
  - **Implication:** CJT optimizes for detecting a fixed truth, but admissions is a *projective judgment* about *future potential* under uncertainty. More votes don’t resolve this ontological gap.  

  ### 3. Why the Current System is Preferable (with Modifications)  
  The 2-reader consensus model better aligns with our epistemic realities:  
  - **Forces Deliberation:** Disagreements trigger live discussion—*the very mechanism that surfaces divergent interpretations* of "fit" or "potential." This is where rubric ambiguities are resolved.  
  - **Reduces Arbitrary Exclusions:** Requiring two strong "yes" votes minimizes false positives (admitting weak candidates), though it risks false negatives (rejecting strong but divisive candidates).  

  **However, we can mitigate weaknesses:**  
  | **Current Weakness**          | **Proposed Reform**                          |  
  |-------------------------------|----------------------------------------------|  
  | **False negatives** (strong candidates rejected by one reader) | **"Third reader rescue"**: If readers disagree *and* one ranks applicant top-tier, a third reader breaks the tie. |  
  | **Inconsistent rubric application** | **Calibration sessions**: Pre-review meetings to norm readings of sample files (admitted/rejected in past cycles). |  
  | **Overburdened readers**      | **Stratified workload**: Assign 2 readers to all files; add third reader *only* for cases with split decision. |  

  ### 4. Why Majority Vote Would Harm Our Process  
  - **Workload Collapse:** 5 readers/file increases labor by 150%. This forces superficial readings, *lowering* individual competence (p).  
  - **Majority Tyranny:** A 3-2 vote admits applicants with substantial opposition without requiring deliberation. Conversely, strong but unconventional candidates (e.g., interdisciplinary projects) are easily buried.  
  - **Illusion of Precision:** Quantifying votes implies spurious objectivity. A "3.6/5" score can’t capture why a candidate might thrive.  

  ### 5. Conclusion: Judgment, Not Computation  
  Admissions is a *hermeneutic* exercise—interpreting ambiguous signals amid uncertainty. The formal theory proposal, while mathematically elegant, treats judgment as a detection task when it is fundamentally an act of *collaborative sense-making*. Our current system prioritizes deliberation over aggregation. By adding a tiered review for split decisions and norming our interpretive standards, we address core weaknesses without embracing a model reliant on false assumptions of independence, measurable competence, and binary truth.  

  **Recommended Vote:** Retain and refine the 2-reader consensus system.  

  ---  
  **Signature**  
  [Your Name]  
  PhD Candidate, Comparative Politics  
  *[This memo reflects extensive consultation with methodological literature on committee decision-making, including Kerr & Tindale (2004) on group deliberation and Lamberson & Page (2012) on institutional design under correlated judgments.]*
