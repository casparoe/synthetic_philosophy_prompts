  Okay, the user is grappling with an apparent contradiction in G.E. Moore's *Principia Ethica*. They've noticed that in §112, Moore warns against neglecting the principle of organic unities—specifically, the error of assuming that if one part of a whole has no intrinsic value, the whole's value must reside entirely in the other parts. But then in §114, Moore seems to do exactly that by isolating the emotional component of aesthetic appreciation and concluding it has little value on its own.

  The user is wondering if this is a genuine inconsistency or if Moore is using two different notions of isolation. They mention a similar move in §122 regarding admiration of mental qualities versus bodily expression. The user wants a careful reconstruction of Moore's methodology and a verdict on whether his approach holds up.

  First, I need to recall Moore's key concepts. The method of absolute isolation is meant to determine what has intrinsic value by imagining things existing alone. The principle of organic unities states that the value of a whole isn't just the sum of its parts; it can be greater or less. 

  In §114, Moore isolates the emotional element from the cognitive component of aesthetic appreciation. He finds the emotion alone has little value, but when combined with the cognition of beauty, the whole is valuable. This seems to violate his warning because he's judging a part in isolation and then making a claim about the whole. But Moore would argue he's not making an inference error here. He's using isolation to test individual components, but then he's not concluding that the whole's value comes solely from the other part. Instead, he's showing that the emotional part lacks value alone, yet the whole has value, which demonstrates the organic nature of the unity.

  The distinction might lie in what is being isolated. When Moore talks about entire states of affairs, like a beautiful world without conscious beings, he's isolating a complete scenario. But in §114, he's breaking down a complex state of consciousness into its elements. His warning in §112 is against assuming that because a part has no value, the whole's value must be in the other parts. In §114, he's not saying the cognitive part holds all the value; he's saying the combination creates value that isn't present in either part alone. That's consistent with organic unities.

  In §122, when discussing personal affection, Moore isolates admiration for mental qualities and appreciation of bodily expression. He finds each has limited value alone, but together they form a valuable whole. Again, he's using isolation to test parts but not reducing the whole's value to one part. Instead, he's emphasizing the emergent value of the combination.

  The user's insight about two types of isolation—whole states of affairs versus components of a state—seems valid. Moore's method in §112 applies to evaluating complete scenarios in isolation, while in §114 and §122, he's dissecting complexes to show their parts lack value alone, thus proving the whole is organic. This isn't contradictory because the principle of organic unities requires recognizing that parts can be value-neutral yet essential for the whole's value.

  However, there's a tension. When Moore isolates a component like emotion, he's abstracting it from its context. Is such abstraction possible? Can we meaningfully conceive of an emotion without any object? Moore assumes we can, but critics might argue emotions are inherently intentional. If the emotional component can't exist without an object, then isolating it is incoherent, and Moore's method fails. But within his framework, he's consistent. His practice holds if we accept his phenomenological approach of imagining elements in isolation.

  The user is in a reading group on early twentieth-century value theory, so they likely need a nuanced analysis for discussion. They want to understand if Moore is contradicting himself or if there's a deeper coherence. Their question shows they've read closely and spotted a real tension, which is commendable.

  In conclusion, Moore isn't inconsistent. His method involves two complementary moves: isolating wholes to identify intrinsic goods and dissecting those wholes to show their organic nature. The warning in §112 is against misattributing value within a whole, not against analyzing parts. When he isolates components, he's not committing the error because he's not locating the whole's value in the remaining part but in the unity itself. His approach survives scrutiny if we grant his assumptions about isolability, though it raises philosophical questions about part-whole relationships in value theory.
answer: |-
  Your analysis identifies a genuine tension in Moore's methodology, but I argue it reflects a deliberate (though potentially problematic) application of his principles rather than a straightforward inconsistency. Moore *is* using "isolation" in two distinct but complementary ways, consistent with his overall framework. Here's a reconstruction and verdict:

  1.  **The Two Levels of Isolation:**
      *   **Level 1: Isolation of Whole States of Affairs (Macro-Isolation):** This is the primary method outlined in §112 and Chapter III (§§55, 57). It asks: "What entire universe (state of existence), considered *as a complete whole* in absolute isolation, would we judge to be intrinsically good?" Examples include:
          *   A beautiful world utterly devoid of conscious beings to appreciate it.
          *   The existence of a single feeling of pleasure with no object or context.
          *   A state of friendship considered as a complete entity.
          *   **Purpose:** To identify which *complex wholes* possess intrinsic value *in their own right*, preventing the error of valuing something only for its consequences (the first error he mentions).
      *   **Level 2: Isolation of Constituent Parts within a Valuable Whole (Micro-Isolation):** This is the method employed in §114 and §122. It asks: "If we *conceptually decompose* a complex whole we *already know* (via Level 1 isolation) to be intrinsically valuable, and then consider one of its essential *constituent parts* in absolute isolation, what value does *that part alone* possess?" Examples include:
          *   The emotional component of aesthetic appreciation, stripped of its cognitive object.
          *   The cognitive apprehension of beauty, stripped of any emotional response.
          *   Admiration for mental qualities, stripped of any bodily expression.
          *   Appreciation of bodily expression, stripped of any knowledge of the mental qualities it expresses.
          *   **Purpose:** To demonstrate the *organic nature* of the valuable whole identified at Level 1. By showing that essential parts have little or no value in isolation, Moore proves the value emerges only from the *specific combination* – guarding against the second error (neglecting organic unities).

  2.  **How Moore Uses Micro-Isolation to Defend Organic Unities:**
      *   **§114 (Aesthetic Enjoyment):**
          1.  Level 1 Isolation establishes that the *whole state* of consciousness involving both cognition of a beautiful object *and* an appropriate emotional response is intrinsically valuable.
          2.  Level 2 Isolation then asks: What if we isolate the *emotional component*? Moore argues it likely has little or no intrinsic value by itself (e.g., a feeling of rapture with no object is meaningless or potentially bad if directed wrongly).
          3.  Crucially, Moore **does not** then conclude that the *cognitive component* must therefore hold all the value of the aesthetic whole. That *would* be the error he warned against.
          4.  Instead, he infers: *Because* the emotional part is essential to the valuable whole yet valueless alone, the value of the aesthetic whole **cannot be reduced to the sum of the values of its parts** (emotion + cognition). The value arises *organically* from their specific union. The micro-isolation *demonstrates* the organic unity, it doesn't violate the principle.
      *   **§122 (Personal Affection):**
          1.  Level 1 Isolation establishes that the *whole state* involving affection for a person *combining* admiration of their mental qualities *and* appreciation of their bodily expression of character is highly valuable.
          2.  Level 2 Isolation asks: What value does admiration for mental qualities *alone* (without bodily expression) have? What value does appreciation of bodily expression *alone* (without connection to mental qualities) have? Moore argues both are significantly less valuable (or potentially less valuable) in isolation.
          3.  Again, he **does not** conclude that one part holds all the value. He concludes that the *combination* creates a unique, emergent value exceeding the value of the parts considered separately or summed. This *is* the principle of organic unities in action.

  3.  **Addressing the Apparent Contradiction:**
      *   The warning in §112 ("supposing that if one part has no intrinsic value, the value of the whole must reside entirely in the other parts") targets a specific *inference*: reducing the whole's value to the value of the *remaining part(s)*. Moore is *not* warning against *isolating parts conceptually* to test their individual value contribution.
      *   Micro-isolation is Moore's *tool* for proving the *necessity* of the organic unity principle. If a part essential to a valuable whole turns out to have little or no value in isolation, it *forces* us to acknowledge that the whole's value is emergent and non-additive. He isn't *making* the forbidden inference; he's using the results of micro-isolation to *block* anyone else from making it.
      *   The object of the macro-isolation (Level 1) is a *complete state of existence* judged for its intrinsic goodness. The object of the micro-isolation (Level 2) is a *constituent element* of such a state, judged for *its* intrinsic goodness *if it were the whole state*. The "isolation" procedure is formally similar, but the *objects* being isolated are at different levels of complexity within his analysis.

  4.  **Verdict on Scrutiny:**
      *   **Internally Consistent:** On Moore's own terms, his methodology is **consistent**. Level 1 isolation identifies intrinsically valuable wholes. Level 2 isolation analyzes the constituents of those wholes *to demonstrate why they are organic unities*, specifically by showing that essential parts lack significant value in isolation, thereby proving the whole's value isn't reducible to the sum of its parts. The micro-isolation is explicitly framed as a test *for* organic unity, not an inference *from* the part's lack of value *to* the location of the whole's value in another part.
      *   **Philosophically Problematic:** While consistent internally, Moore's micro-isolation practice faces significant **external scrutiny**:
          *   **Meaningfulness of Isolating Constituents:** Can we meaningfully conceive of the "emotional element" of aesthetic appreciation *utterly by itself*? Isn't emotion inherently intentional (directed at an object)? Moore relies on a phenomenological intuition about what this isolated feeling *would* be like, which critics (like later Wittgensteinians or phenomenologists) might find dubious or impossible. The "part" may not be a genuine separable entity.
          *   **The Status of "Parts":** Are emotions, cognitions, etc., truly discrete "parts" that can be added or subtracted? Or are they abstractions from a fundamentally unified conscious state? Moore treats them as isolable atoms, which may misrepresent the nature of consciousness.
          *   **Circularity Risk:** Level 1 isolation identifies the valuable whole. Level 2 isolation dissects it to prove it's organic. But the *choice* of how to decompose the whole into "parts" is crucial. Moore selects decompositions (emotion vs. cognition; mental admiration vs. bodily appreciation) that conveniently yield the result he needs to demonstrate organic unity. A different decomposition might yield different results. The method risks presupposing the organic nature it seeks to prove by how it carves up the whole.
          *   **Justification of Level 1 Intuitions:** The whole edifice rests on the intuitive judgments made during Level 1 isolation (e.g., that aesthetic enjoyment *is* intrinsically good). Critics can challenge these foundational intuitions.

  **Conclusion:** Moore's procedure in §§114 and 122 is **not inconsistent** with his methodological pronouncements in §112. He employs a two-tiered isolation strategy: macro-isolation to identify intrinsically valuable wholes, and micro-isolation to demonstrate the organic nature of those wholes by showing their essential constituents lack significant value in isolation. This micro-isolation is his *means* of guarding against the error of neglecting organic unities, not an instance of committing it. While internally coherent within his framework, the meaningfulness and validity of micro-isolating conscious constituents remain philosophically contentious points of vulnerability in his argument. His practice survives scrutiny *on its own terms* but faces legitimate challenges regarding the feasibility and implications of isolating phenomenological "parts."
