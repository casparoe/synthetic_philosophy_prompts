prompt: |-
  So for my school's philosophy club we've been going down this rabbit hole on "rule-following" and now I think I'm more confused than when we started lol. It started because our sponsor teacher told us about Kripke's weird "quus" example — like, how theres technically no fact about my past that proves I meant the "plus" function instead of some function that matches plus for every case I've actually computed but then does something totally different for huge numbers I've never tried (he said Kripke specifically picked the number 57 for some reason). We spent basically a whole meeting just being horrified that you can't even prove you meant "plus" when you add two numbers.

  So then I went and looked up where this paradox actually comes from and found out it's from this passage in Wittgenstein's Philosophical Investigations (section 201), wich our teacher says is basically THE paragraph everyone argues about:

  "This was our paradox: no course of action could be determined by a rule, because every course of action can be made out to accord with the rule. The answer was: if everything can be made out to accord with the rule, then it can also be made out to conflict with it. And so there would be neither accord nor conflict here. It can be seen that there is a misunderstanding here from the mere fact that in the course of our argument we give one interpretation after another; as if each one contented us at least for a moment, until we thought of yet another standing behind it. What this shews is that there is a way of grasping a rule which is not an interpretation, but which is exhibited in what we call 'obeying the rule' and 'going against it' in actual cases."

  And okay here's what's actually bugging me: the first part makes total sense as a problem — any rule can be twisted to fit any action, so the rule by itself can't pin down what counts as following it correctly. But then his "solution" is just... there's a way of grasping a rule that isn't an interpretation? That feels like he's just declaring by fiat that the regress stops wherever he wants it to stop. Like why doesn't THAT "grasping" need to be interpreted too, which just puts us right back where we started? My friend Theo thinks this is basically Wittgenstein admitting defeat in fancier words, but that seems too harsh for a guy everyone treats as a genius. Is there an actual reason this isn't circular, or is this genuinely one of those spots where even professional philosophers disagree about whether he pulled it off?
