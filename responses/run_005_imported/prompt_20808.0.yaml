  2. Reference-class indeterminacy: This is a deep problem for any application of SSA. Without a clear reference class, the argument cannot get off the ground. This might be decisive because it challenges the very foundation of the sampling assumption.

  3. No well-defined sampling process: This is a metaphysical objection that questions the application of probability in this context. It is substantial but might be seen as a philosophical worry that doesn't necessarily destroy the argument for those who accept the use of SSA in anthropic reasoning.

  4. Prior arbitrariness: The DA requires a prior over total human population. If the prior is arbitrary, then the posterior is arbitrary too. This is a substantial objection because it makes the argument subjective and dependent on an arbitrary choice.

