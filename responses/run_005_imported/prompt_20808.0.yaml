  **Tier Rationales**  
  - **Decisive**: "Reference-class indeterminacy" and "Toy-population reductio" destroy the argument’s foundations—the former by making sampling incoherent, the latter by showing SSA yields absurdities in controlled cases (e.g., misestimating population sizes in minimal simulations).  
  - **Substantial**: "Self-Indication rebuttal" (cancels the shift under SIA) and "Reproductive-decision worry" (implies absurd causal independence) force major revisions or abandonment of SSA, but permit weakened formulations.  
  - **Partial**: "No well-defined sampling process" challenges SSA’s metaphysical basis but doesn’t refute its empirical use in anthropic reasoning.  
  - **Marginal**: "Prior arbitrariness" only highlights subjective elements already inherent in Bayesian methods, without uniquely undermining Doomsday.  
  - **Ineffective**: No objections are ineffective; all have some dialectical weight.
