  Hmm, I need to reconstruct both arguments carefully. First, Kripke's water argument: water is rigidly designated as "the stuff in our oceans", and since H2O is what that stuff actually is in all possible worlds, the identity is necessary. The contingency illusion comes from confusing the reference-fixing description ("watery stuff") with the rigid designator itself.

  Now for pain: Kripke argues that unlike heat (where we fix reference via contingent sensation S), with pain there's no separation between the sensation and the phenomenon itself. The reference-fixer isn't "whatever causes pain-sensation" but the pain-qualia directly. So when we imagine c-fibers firing without pain, we're not imagining a scenario where pain exists without its physical correlate - we're imagining pain's absence.

  Chalmers supercharges this by arguing that for consciousness, no physical description can ever capture the "what-it's-like-ness". Zombies are conceivable because we can perfectly imagine all physical processes without subjective experience. And since conceivability entails possibility (in this case), physicalism must be false.

