  We are ranking the following six proposals based on their ability to handle both finks and masks (two classic problems for conditional analyses of dispositions):

  1. David Lewis's "Reformed Conditional Analysis" (RCA)
  2. Alexander Bird's move to primitive powers (rejecting conditional analyses)
  3. Sungho Choi's defense of the Simple Conditional Analysis (SCA)
  4. David Manley and Ryan Wasserman's gradable account (which uses a comparative conditional)
  5. M. Fara's "habitual" analysis (which uses habitual conditionals)
  6. Barbara Vetter's potentiality framework

  The problems:
  - **Finks**: A fink is a mechanism that would remove the disposition of an object just when the stimulus condition is about to occur. For example, in Martin's electro-fink, a wire is disposed to conduct electricity when touched by a conductor, but if a device makes the wire non-conductive the moment it is touched, then the wire is still disposed to conduct but the conditional "if touched by a conductor, it would conduct" is false.
  - **Masks**: A mask is something that interferes with the manifestation of a disposition even when the stimulus condition occurs. For example, a fragile glass might be wrapped in protective packaging so that when struck, it doesn't break. The disposition (fragility) is still present, but the conditional "if struck, it would break" is false.

  We are to rank them in tiers (S, A, B, C, D) with S being the best (solves the problem) and D being the worst (doesn't engage). We must consider how well they handle both finks and masks.

  Analysis:

  - **Lewis's Reformed Conditional Analysis (RCA)**: Lewis modifies the simple conditional analysis by adding a ceteris paribus clause and requiring that the object retains the disposition during the test. This is supposed to handle finks by ensuring that the disposition isn't lost. However, it is vulnerable to masks because the mask might be part of the circumstances that are held fixed (so the manifestation is still prevented). Also, there are cases of finkish and maskable dispositions that RCA struggles with. Generally, it handles finks better than masks but isn't perfect for either.

  - **Bird's Primitive Powers**: Bird abandons conditionals in favor of a metaphysical account of dispositions as irreducible powers. This avoids the conditional altogether, so finks and masks don't directly challenge the account. However, it doesn't provide a reductive analysis and might be seen as not engaging with the conditional analysis project (but it does address the problem by rejecting the framework). It handles both finks and masks because it doesn't rely on conditionals that can be interfered with.

  - **Choi's Defense of Simple Conditional Analysis (SCA)**: Choi argues that the counterexamples (like finks and masks) can be handled by a proper understanding of the conditional (e.g., using a non-backtracking conditional). However, his account is still vulnerable to some sophisticated counterexamples and is generally considered to have limited success. It doesn't fully solve the problems.

  - **Manley & Wasserman's Gradable Account**: They propose that dispositions are not all-or-nothing but gradable, and use a comparative conditional: "if it were the case that C, then it might be the case that M" and also "if it were the case that C, then it might not be the case that M" must both be false for the disposition to be absent. This account is designed to handle masks and finks by being less demanding. It handles many cases, but there are counterexamples (e.g., cases of asymmetric masks) and it might overgenerate dispositions.

  - **Fara's Habitual Analysis**: Fara uses a habitual conditional: "x is disposed to M when C" means "x Ms when C" in a habitual sense (like "the glass breaks when struck" meaning it is prone to break when struck). This is supposed to handle finks and masks by being about what happens in normal conditions. However, it faces problems with cases where the fink or mask is permanent and thus becomes "normal". It might not handle all cases of finks and masks.

  - **Vetter's Potentiality Framework**: Vetter replaces conditionals with a modal notion of potentiality, which is multi-track and gradable. This framework is designed to be flexible and handle a wide range of cases. It avoids the problems of conditionals and thus handles both finks and masks. It is a comprehensive alternative.

