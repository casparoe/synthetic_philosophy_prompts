prompt: |-
  I'm working on a piece about the more mathematically-minded wing of effective altruism, and I keep running into an argument that would be a great hook for the piece if its actually true, so I want to sanity check it before I write it up. A couple of people I've interviewed told me that Harsanyi's aggregation theorem basically proves utilitarianism. Here's the version I got: if both individuals and "society" are rational in the standard economic sense (preferences satisfying what economists call the von Neumann-Morgenstern axioms for choice under uncertainty), plus one mild condition -- if literally everyone is indifferent between two options, society has to be indifferent too -- then you're mathematically forced into a social welfare function that's just a weighted sum of everybody's individual utility. One guy pitched it to me as basically the utilitarian mirror image of Arrow's theorem: instead of proving something's impossible, it proves that once you accept a handful of boring, near-tautological axioms about rationality, you don't get to pick your ethical theory anymore -- the math picks it for you.

  If that's right, it seems like a much bigger deal than just another move in a philosophy seminar, since it would mean Rawlsians, virtue ethicists, and everybody else who isn't already a utilitiarian is just refusing to follow their own premises to their logical conclusion. The only pushback I got was from an economist friend, who mentioned something about "Sen" and interpersonal comparisons being an issue, but she was heading into a meeting and it came out sounding like a footnote-level technicality rather than a real crack in the argument. So, gut check: is it fair to tell readers that Harsanyi mathematically proved utilitarianism, full stop, and that everyone still arguing about ethics after 1955 hasn't caught up? Or is something load-bearing getting lost between the actual theorem and the version that's making the rounds?
reasoning: |-
  Okay, the user is working on a piece about the mathematically-minded effective altruists and came across Harsanyi's aggregation theorem. They heard that this theorem proves utilitarianism, which would be a big deal if true. They want to know if it's fair to present it as a mathematical proof that settles ethical debates.

  First, I need to recall what Harsanyi's theorem actually states. From what I remember, it's about social welfare functions under uncertainty. The theorem assumes that both individuals and society have vNM-rational preferences. The key axioms are individual rationality, social rationality, Pareto indifference, and possibly independence. The conclusion is that the social welfare function must be a weighted sum of individual utilities. So, it's additive utilitarianism with weights.

  But the user's sources are saying this "proves utilitarianism." That seems like an overstatement. Utilitarianism as a philosophy has more components, like interpersonal utility comparisons and the moral weight of each individual. Harsanyi's theorem relies on these utilities being vNM utilities, which are unique up to affine transformations. That means the scales can be arbitrary, so the weights in the social welfare function become crucial. Without a way to normalize utilities across people, the weights are arbitrary. That's a big issue because different weights lead to different social choices. So, the theorem doesn't specify how to set these weights, which is a major philosophical point.

  Then there's the issue of interpersonal utility comparisons. vNM utilities are ordinal and don't allow for comparing utility differences between people. But utilitarianism requires such comparisons to say that one person's gain outweighs another's loss. Harsanyi assumes that utilities are comparable, but that's not derived from the axioms. Economists like Sen point out that without a way to measure and compare utilities across individuals, the theorem doesn't fully support utilitarianism. The user's economist friend mentioned Sen, which makes sense here.

  The Pareto condition is another point. It's presented as mild, but in practice, it's strong. For example, if society must be indifferent whenever all individuals are, that rules out any non-welfarist considerations. Rawls' theory, which prioritizes the worst-off, would violate this because even if everyone is indifferent, the distribution might matter. So, ethical systems that care about equality or fairness beyond individual preferences are excluded by assumption, not disproven.

  The user wants to present this as a mathematical proof that forces utilitarianism, dismissing other ethical theories. But that's misleading because the assumptions themselves are contentious. Rawlsians and others reject the vNM rationality for society or the Pareto principle. So, the theorem is conditional on accepting those premises, which many ethicists don't. It's not that they're ignoring logic; they're challenging the axioms.

  Also, the effective altruism community might overstate the theorem to support their utilitarian leanings. The user should be careful not to present it as a closed case. Highlighting the controversies, like the weighting problem and interpersonal comparisons, would provide a balanced view. Mentioning Sen's critique and the difference between vNM utilities and measurable utility is important.

  In conclusion, the theorem is significant but not a proof of utilitarianism "full stop." It shows that under specific rationality assumptions, social welfare must be additive. But those assumptions are debated, and the utilities' comparability is assumed, not proven. The user should present it as a strong argument within a specific framework but acknowledge the philosophical disputes around the axioms.
answer: |-
  You've hit on a fascinating and genuinely important debate at the intersection of economics, philosophy, and effective altruism. While Harsanyi's theorem is a profound and powerful result, **it is absolutely *not* fair to tell readers that it "mathematically proved utilitarianism, full stop," or that non-utilitarians are simply refusing to follow logic.** Your economist friend's mention of Sen (and interpersonal comparisons) points directly to the core of the controversy. Here's a breakdown of why the "proof of utilitarianism" claim is an overstatement:

  1.  **What Harsanyi Actually Proved (The Core Insight):**
      *   If individuals have vNM-rational preferences (satisfy the axioms for choice under uncertainty: completeness, transitivity, continuity, independence), then their preferences can be represented by a cardinal utility function unique up to affine transformations (linear scaling: u_i' = a_i * u_i + b_i).
      *   If "society" *also* has vNM-rational preferences over the same lotteries (social states with probabilistic outcomes).
      *   And if society satisfies the **Pareto Indifference** condition (if everyone is indifferent between two options, society is indifferent).
      *   *Then*, the social preference ordering can be represented by a **social welfare function (SWF) that is a *linear aggregation* of the individual cardinal utilities:** W = Σ w_i * u_i (where w_i > 0 are weights).
      *   This *is* an additive utilitarian form. This is the mathematical core that your interviewees are excited about.

  2.  **Why This is *Not* "Proving Utilitarianism Full Stop" (The Load-Bearing Caveats):**
      *   **The Achilles' Heel: Interpersonal Comparisons of Utility (ICUs):** This is the "Sen" point, and it's **far from a footnote.** The vNM theorem ensures that *each individual* has a cardinal utility function *for themselves*. However, these functions are only defined up to an arbitrary scale (a_i) and zero point (b_i). Harsanyi's theorem *assumes* (or requires) that we have already chosen specific scales (a_i) and zero points (b_i) for each individual's utility function such that utility differences *are meaningfully comparable across people*. **The theorem does *not* tell you how to do this.**
          *   *Why is this critical?* Utilitarianism fundamentally depends on comparing the *size* of utility gains and losses *between different people*. Saying "Social Welfare = w1*u1 + w2*u2" is meaningless unless "1 unit of u1" is comparable to "1 unit of u2". Without a method for ICUs, the weights (w_i) and the scaling factors (a_i) are hopelessly entangled. You could make *any* social outcome "optimal" by choosing different scales for individual utilities. Harsanyi provides a *form*, but the *content* (the actual values used for comparison) is assumed to exist externally.
          *   *The Philosophical Sticking Point:* Many philosophers (like Rawls) and economists (like Sen) argue that ICUs are either impossible, deeply problematic, or require strong ethical assumptions *beyond* the vNM axioms and Pareto. Resolving ICUs is *itself* a major task in ethical theory, not a mere technicality solved by the theorem. Harsanyi argued ICUs *were* possible based on extended preferences or empathy, but this is a substantial *additional* philosophical claim, not a consequence of the theorem itself.
      *   **The Weighting Problem (w_i):** The theorem tells you the SWF must be a *weighted* sum. But **it says nothing about *how* to set the weights (w_i).** Are all individuals weighted equally (w_i = 1 for all i)? Should weights reflect desert, need, or bargaining power? This is a fundamental ethical question. Classical utilitarianism typically demands equal consideration (equal weights, after appropriate scaling). Harsanyi's theorem is compatible with utilitarianism, but it's also compatible with elitism (heavily weighting some) or other weighting schemes. The choice of weights is an ethical leap *not* dictated by the axioms.
      *   **The Nature of "Utility":** The u_i in the theorem are vNM utilities derived purely from observed choices under risk. Many ethical theories (especially non-welfarist ones like Rawlsianism, capabilities approach, virtue ethics) argue that what matters ethically is *not* reducible to this specific concept of preference-satisfaction revealed by choices under risk. They care about primary goods, capabilities, freedoms, rights, virtues, or objective well-being, which may not perfectly align with vNM utility. The theorem assumes that vNM utility *is* the relevant ethical currency.
      *   **The Social vNM Rationality Assumption:** Is it reasonable to assume that "society" as a whole has preferences satisfying the vNM axioms, *especially the Independence Axiom*? This is highly contentious. Ethical deliberation often involves considering the *reasons* for preferences or the *context* of choices in ways that might violate these axioms when aggregated. Rawls explicitly rejects this assumption for his original position reasoning.
      *   **Pareto Indifference is Not Neutral:** While seeming mild, Pareto Indifference rules out *any* non-welfarist considerations. If two options are identical in terms of every individual's vNM utility, society *must* be indifferent. This excludes ethical views that care about equality per se, fairness of process, symbolic meaning, or intrinsic rights that might be violated even if everyone is indifferent on a utility level. It builds welfarism directly into the axioms.

  3.  **Arrow's Theorem Comparison - Valid but Limited:**
      *   Your interviewee is right that it feels like a "mirror image" of Arrow. Arrow shows the *impossibility* of aggregating *ordinal* preferences under seemingly reasonable conditions (without a dictator). Harsanyi shows the *possibility* (even necessity) of aggregating *cardinal* utilities under vNM rationality plus Pareto.
      *   **The crucial difference:** Arrow operates in a world *without* interpersonal utility comparisons or cardinal utility. Harsanyi *requires* cardinal utility and (critically) *assumes* the problem of interpersonal comparisons has been solved. This is why Sen often frames the debate: Arrow shows the impossibility without cardinality/ICUs; Harsanyi shows the possibility *with* them. The real debate is about the validity and feasibility of cardinality and ICUs.

  **How to Frame This for Your Piece (Avoiding Overstatement):**

  *   **Do:** Present Harsanyi's theorem as a **profound and rigorous argument** showing that *if* you accept:
      1.  Individuals are vNM rational,
      2.  Society is vNM rational,
      3.  Pareto Indifference,
      4.  **And critically, if you believe meaningful interpersonal comparisons of cardinal utility are possible,**
      *   *Then* the *only* coherent form for social welfare is a weighted sum of individual utilities (additive utilitarianism).
  *   **Do:** Highlight why mathematically-minded EAs find this compelling. It provides a formal, axiomatic foundation for utilitarianism within a specific, well-defined framework of rationality. It feels like "ethics emerging from math."
  *   **Do Not:** Claim it "proves utilitarianism full stop" or that non-utilitarians are illogical. Emphasize the **major caveats**:
      *   **The ICU Problem:** The theorem *assumes* the hardest part of utilitarianism (comparing utility across people) is solved; it doesn't prove it can be done. This is the core of Sen's (and others') critique.
      *   **The Weighting Problem:** Utilitarianism requires equal weighting; the theorem only gives a weighted sum.
      *   **Contentious Assumptions:** Many reject the idea that *society* should have vNM-rational preferences or that Pareto Indifference captures all ethical concerns.
  *   **Contextualize:** Frame it as a powerful argument *within a specific conception of rationality and welfare*, but not a knockdown proof that silences all other ethical traditions. The debate about ICUs, the nature of well-being, and the validity of the social rationality assumption are live and profound philosophical issues. Rawlsians, virtue ethicists, etc., aren't ignoring math; they are challenging the foundational premises Harsanyi builds upon.
  *   **Quote Effectively:** You could use a line like: "For some in EA, Harsanyi's theorem isn't just an argument *for* utilitarianism; it feels like a mathematical *uncovery* of it, lurking within the very logic of rational choice. Yet, critics argue the theorem smuggles in utilitarianism's most contentious premise – the comparability of happiness across minds – as an assumption, rather than proving it."

  **In short:** Harsanyi provides a stunning mathematical derivation of the *form* of utilitarianism *conditional* on accepting vNM rationality for society, Pareto Indifference, and, most crucially, the possibility of interpersonal utility comparisons. It's a landmark theorem that strongly motivates utilitarianism, but it does *not* prove utilitarianism "full stop" because the validity of those critical assumptions – especially regarding ICUs – remains the central battleground of modern moral philosophy. Presenting it as an unassailable mathematical proof misrepresents the ongoing debate.
