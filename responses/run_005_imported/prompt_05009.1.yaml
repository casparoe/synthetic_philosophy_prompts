  First, I need to unpack the difference between the factual truth of the criticism and the legitimacy of the critic. The user is right that these are separate issues. Factually, the user is messy. But Deb's authority to enforce the standard is questionable because she doesn't follow it elsewhere. 

  Hypocrisy affects the moral standing of the critic. If Deb doesn't adhere to the same rules she enforces, it weakens her position to demand compliance. It's not just about being annoying; it's about fairness. The user might perceive the criticism as an unfair double standard. For example, if Deb doesn't clean at Tom's, why should the user listen to her at home?

  Also, the context matters. In a shared living space, mutual respect and reciprocity are important. If Deb expects cleanliness from the user but not from herself in similar situations, it breaks that reciprocity. The user might feel that Deb is imposing rules without holding herself accountable, leading to resentment. 

  The user's deeper need here is probably fairness and mutual respect. They want Deb to acknowledge her own faults before criticizing others. The conflict isn't just about dishes; it's about equitable standards in their relationship. The user might also feel that Deb's criticism is less about actual cleanliness and more about control, especially since Deb deflects by saying her hypocrisy doesn't invalidate the truth.

