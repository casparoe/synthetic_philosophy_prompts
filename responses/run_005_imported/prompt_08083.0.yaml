answer: |-
  You've perfectly framed the core issue. Menger's objection is indeed devastating to any hope of resolving the St. Petersburg paradox *generally* within the expected utility (EU) framework without imposing a boundedness constraint on the utility function. Here's a direct argument for the claim:

  **Thesis:** Expected utility maximization as a *universal* standard of rational choice for all possible lotteries (within an idealized model allowing arbitrarily large payoffs) requires the utility function `u(x)` to be bounded above. Any unbounded utility function, no matter how severely concave, renders the EU framework vulnerable to a "Super St. Petersburg" paradox, making consistent rational choice impossible.

  **Argument:**

  1.  **Premise (EU Framework):** Rational agents maximize expected utility. The expected utility of a lottery `L` with payoffs `x_i` and probabilities `p_i` is `EU(L) = Σ [p_i * u(x_i)]`.

  2.  **Premise (Unbounded Utility):** Assume `u(x)` is unbounded above. This means for any arbitrarily large real number `K`, there exists some finite payoff `x_K` such that `u(x_K) > K`. There is no finite upper limit to utility.

  3.  **Menger's Construction (The Fatal Counterexample):** For any such unbounded `u(x)`, we can construct a specific "Super St. Petersburg" lottery `L_super` as follows:
      *   **Payoff Structure:** Define the payoffs `c_n` for outcomes `n = 1, 2, 3, ...` (where `n` corresponds to the first heads on the `n`-th flip, as in the original) such that:
          `u(c_n) = 2^n`
      *   **Why is this possible?** Because `u(x)` is unbounded above. For each `n`, `2^n` is just a finite number. Since `u(x)` grows without bound, we *can* always find a finite monetary payoff `c_n` large enough to satisfy `u(c_n) = 2^n`. (The `c_n` will grow extremely rapidly, especially if `u(x)` is very concave, but they remain finite payoffs).
      *   **Probabilities:** Keep the same probabilities as the original St. Petersburg game: `p_n = (1/2)^n` (probability of first heads on flip `n`).

  4.  **Calculating EU(L_super):**
      `EU(L_super) = Σ [p_n * u(c_n)]   (sum from n=1 to ∞)`
      `= Σ [ (1/2)^n * 2^n ]`
      `= Σ [ (1/2 * 2)^n ]`
      `= Σ [ 1^n ]`
      `= Σ [ 1 ]   (from n=1 to ∞)`
      `= 1 + 1 + 1 + ... = ∞`

  5.  **The Paradox Regenerated:** Just like the original St. Petersburg paradox had infinite expected monetary value, `L_super` has infinite expected utility under the assumed unbounded `u(x)`. This means:
      *   An EU maximizer should be willing to pay *any* finite amount of money (or utility) to play `L_super`.
      *   This violates basic economic intuition and principles of rational choice (e.g., willingness to pay should be finite for a game with finite possible outcomes, even if large).
      *   It creates incomparability: How does one rationally choose between `L_super` and another game also constructed to yield infinite EU (e.g., `u(d_n) = 3^n`)? EU maximization gives no answer. Dominance reasoning might fail.

  6.  **Generality of the Attack:** This construction *explicitly depends* on `u(x)` being unbounded. The concavity of `u(x)` (which solved the original paradox) is irrelevant here. Whether `u(x) = log(x)`, `sqrt(x)`, or any other function that grows without bound, no matter how slowly, Menger's method works. For *any* unbounded `u(x)`, we can always define payoffs `c_n` such that `u(c_n) = 2^n`, leading directly to `EU(L_super) = Σ [ (1/2)^n * 2^n ] = Σ [1] = ∞`.

  7.  **The Implication for Resolution:** Therefore, any resolution of the St. Petersburg paradox based *only* on replacing linear value with a concave utility function (Bernoulli's fix) is *not general*. It solves the specific original game but fails for the tailor-made counterexample `L_super` constructed specifically to exploit the unboundedness of `u(x)`.

  8.  **The Necessity of Boundedness:** The *only* way to definitively prevent *all possible variations* of the St. Petersburg paradox (within the idealized model) from generating infinite expected utility is to impose the constraint that `u(x)` is bounded above. If `u(x) < B` for some finite bound `B`, then for *any* lottery `L` with payoffs `x_i`:
      `EU(L) = Σ [p_i * u(x_i)] ≤ Σ [p_i * B] = B * Σ [p_i] = B * 1 = B < ∞`
      Expected utility is guaranteed to be finite for all possible lotteries, no matter how payoffs are scaled. Menger's construction becomes impossible because you cannot satisfy `u(c_n) = 2^n` for large `n` if `u(x)` cannot exceed `B`.

  **Conclusion:**

  Menger's construction demonstrates an inherent instability within the expected utility framework when applied to idealized lotteries with potentially unbounded payoffs: **unbounded utility functions are fundamentally incompatible with the requirement that expected utility be finite for all possible lotteries.** The infinite EU of `L_super` leads to the same counter-intuitive results and decision-theoretic incoherence as the original St. Petersburg paradox. Consequently, if we insist on retaining expected utility maximization as a *universal* standard of rational choice applicable to *all conceivable lotteries* in this idealized setting, we *must* accept that the utility function `u(x)` must be bounded above. This boundedness is not merely a convenient fix; it is a necessary structural constraint to ensure the coherence and generality of the EU framework itself. Bernoulli's concave utility resolves a specific instance of the paradox, but only bounded utility resolves the underlying *class* of paradoxes Menger revealed.
