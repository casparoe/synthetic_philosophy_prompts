prompt: |-
  I'm putting together a graduate seminar on the prehistory of the harm principle, and this week's set text is Jeremy Bentham's unpublished essay "Offences Against One's Self" (c. 1785), in which he applies his own hedonistic calculus to argue against the capital punishment then prescribed in England for sodomy. Since Bentham never prepared the manuscript for publication, the prose is rougher and more tangled than in his finished works, and most of the essay still proceeds exactly as one would expect from him: he works through a series of standard objections (that the practice "weakens" the agent, that it reduces population, that it "robs" women of partners, and so on) and finds, on the principle of utility, no case for punishing it. But there is one passage, where he turns to consider the antipathy the practice provokes in third parties, that I cannot quite untangle, and I would like a second opinion before I teach it. In the transcription established by Louis Crompton from the manuscript (Bentham Papers, UCL), it reads:

  "Meanwhile the antipathy, whatever it may arise from, produces in persons how many soever they be in whom it manifests itself, a particular kind of pain as often as the object by which the antipathy is excited presents itself to their thoughts. This pain, whenever it appears, is unquestionably to be placed to the account of the mischief of the offence, and this is one reason for the punishing of it. More than this—upon the view of any pain which these obnoxious persons are made to suffer, a pleasure results to those by whom the antipathy is entertained, and this pleasure affords an additional reason for the punishing of it. There remain however two reasons against punishing it. The antipathy in question (and the appetite of malevolence that results from it) as far as it is not warranted by the essential mischievousness of the offence is grounded only in prejudice. It may therefore be assuaged and reduced to such a measure as to be no longer painful only in bringing to view the considerations which shew it to be ill-grounded. The case is that of the accidental existence of an antipathy which [would have] no foundation [if] the principle of utility were to be admitted as a sufficient reason for gratifying it by the punishment of the object; in a word, if the propensity to punish were admitted in this or any case as a sufficient ground for punishing, one should never know where to stop. Upon monarchical principles, the Sovereign would be in the right to punish any man he did not like; upon popular principles, every man, or at least the majority of each community, would be in the right to punish every man upon no better reason."

  Bentham then adds, under separate headings, that admitting antipathy as a sufficient ground would equally license burning heretics, Moors, and Jews, and that the antipathy already inflicts on its object "a very galling punishment" quite apart from anything the law does. What I would like help with is the argument's anatomy. In the first two sentences, Bentham appears to grant, as a consistent hedonist arguably must, that the pain of antipathy and the vicarious pleasure it affords onlookers are genuine entries in the felicific calculus, counting in favor of punishment; he then announces "two reasons" on the other side, but I cannot cleanly tell how many distinct reasons actually follow, or how the heresy analogy and the "already punished" remark relate to that enumeration. Could you reconstruct the argument for me, sentence by sentence? I would also welcome your view on a harder question the passage raises: is Bentham entitled, given his own hedonism, simply to discount antipathy-based pains and pleasures as mere "prejudice," or does that move covertly rely on something like Dworkin's later distinction between personal and external preferences—a distinction his official apparatus of summing pleasures and pains does not, by itself, seem to license?
