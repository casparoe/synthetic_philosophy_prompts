answer: |-
  ## The Lewisian Gambit: Can Coordination Ground Truthfulness and Beyond?

  David Lewis's *Convention* offers a powerful, reductionist analysis: conventions emerge as self-perpetuating solutions to pure coordination problems. A regularity R is a convention if (1) it's a coordination equilibrium (no one regrets conforming if others do), (2) it's arbitrary (a viable alternative R' exists where everyone would be equally well-off if *everyone* switched), and (3) this arbitrariness and conformity are matters of common knowledge. Driving on the left, meeting spots, and call-back protocols fit perfectly – conformity is paramount, but the specific choice is indifferent. The problem arises when Lewis, in "Languages and Language," tries to apply this elegant machinery to **truthfulness** – the norm of honestly conveying one's beliefs through language. His solution is ingenious but, as your suspicion suggests, reveals a fundamental limitation in the scope of coordination-based analyses for core social norms.

  **The Honesty Problem and Lewis's Maneuver:**

  Lewis readily concedes the core issue: **bare truthfulness fails the arbitrariness clause**. Imagine a population with a standing policy of *systematic lying*. Could this serve as a viable alternative regularity R'? Lewis argues no:

  1.  **Coordination Failure:** Communication fundamentally relies on shared expectations about the link between utterances and states of affairs. A policy of lying systematically severs this link. If everyone *knows* everyone lies, then uttering "It's raining" would reliably indicate it is *not* raining. Listeners would reinterpret accordingly, believing the opposite. *But*:
      *   This reinterpretation *itself* relies on a shared convention about the *meaning* of the lying policy ("utterance X indicates *not* P"). This isn't an alternative to truthfulness; it's a *different semantic convention* where "X means not-P" instead of "X means P". The act of *intending to deceive* is parasitic on shared meaning.
      *   Crucially, the *motivation* for communication collapses. Why bother speaking if your intent is always misinterpreted? The very purpose of communication – coordinating on shared beliefs or actions – is undermined. A "lying convention" doesn't solve the *same* coordination problem as a truthfulness convention; it either creates a different, dysfunctional coordination or obliterates the possibility of coordination via language altogether.

  Lewis concludes truthfulness itself isn't arbitrary. We *need* a shared practice of trusting utterances to reflect beliefs (approximately) for language to function as a coordination tool. His solution is a **strategic retreat to the linguistic level**:

  1.  **The Arbitrary Choice is the Language:** What *is* arbitrary is *which* particular language (English, French, a code where "gavagai" means rabbit) a population adopts. Any sufficiently expressive language could serve the communicative function equally well *if* everyone used it consistently.
  2.  **Truthfulness-and-Trust "Piggybacks":** Once a language L is conventionally established (satisfying arbitrariness: L' would work just as well), the norm of **truthfulness-and-trust-in-L** emerges as a *logical consequence*. For L to function *as* a language for coordination, speakers *must* generally be truthful in L (meaning: they utter sentences of L only when they believe them to be true *according to L*) and hearers *must* generally trust utterances in L (form beliefs based on them *according to L*). This "T&T-in-L" isn't itself a separate convention; it's the necessary behavioral stance required to *use* the conventional language L effectively for coordination.

  **The Sleight of Hand? Locating the Obligation**

  Your suspicion hits the mark: Lewis hasn't *generated* the normative obligation to be truthful from pure coordination dynamics. He's **relocated its source** and **changed its nature**.

  *   **Relocation:** The coordination dynamics explain the emergence and stability of the *language* L. The *need* for T&T-in-L is then presented as a functional necessity *given* the existence of L and the *prior* desire to coordinate via communication. The "ought" of truthfulness derives from the *instrumental* goal of successful communication using the established tool (L), not directly from the convention-defining coordination problem itself.
  *   **Changed Nature:** The obligation becomes *language-relative* and *hypothetical*: "If you want to communicate successfully using L, you ought to be truthful-in-L." The *categorical* force often associated with honesty ("You ought to tell the truth, period") isn't explained; it's conditional on participating in the linguistic practice aimed at coordination.

  **Testing Generalization: The Case of Promise-Keeping**

  Can Lewis's maneuver extend to other normatively loaded practices like **promise-keeping**? Let's apply the structure:

  1.  **The Problem:** Bare promise-keeping seems non-arbitrary. Could a standing policy of *systematic promise-breaking* (R') serve as a viable alternative? Like systematic lying, this seems disastrous. If everyone *knows* promises are always broken, the act of promising loses all force. Why make or accept a promise if it guarantees nothing? The practice collapses, failing to solve the coordination problem it exists for (e.g., enabling reliance on future actions). It fails the arbitrariness test directly.
  2.  **The Lewisian Gambit Attempt:** Can we find an "arbitrary shell" analogous to language? One might propose: what's conventional is the specific *form* or *ritual* of promising (e.g., saying "I promise," shaking hands, signing a contract). The obligation to keep the promise then "piggybacks" on the conventional form. Arbitrariness: we could use different words or gestures (R' = saying "I pinky-swear," crossing hearts) to perform the same function.

  **Why the Gambit Fails for Promises (and Similar Norms):**

  1.  **Lack of Genuine Functional Equivalence at the Shell Level:** While the *specific form* of promising is arbitrary, the **core function** of the practice – creating a binding obligation – is *not* transferable to the shell alone. The shell (words, gestures) is only meaningful *because* it conventionally signals the undertaking of the underlying obligation. The obligation *is the core practice*, not a separable consequence. Changing the shell doesn't create a *different kind of obligation* (like lying created a different meaning); it just changes the label for the *same* obligation.
  2.  **No "Piggybacking" Without the Core Norm:** In the language case, T&T-in-L *is* the behavioral manifestation of *using L as a language*. For promises, "keeping the promise" *is* the core behavioral norm itself. The "form" is merely its conventional marker. The obligation to keep the promise doesn't arise *because* we use the word "promise"; we use the word "promise" *to invoke* the pre-existing (or co-constitutive) normative practice of undertaking binding commitments. The form signals the norm; it doesn't generate the norm's core content instrumentally.
  3.  **The Normative Residue:** Even if we adopted a new shell (pinky-swears), the obligation incurred would be identical: *to do the thing you pinky-swore to do*. The arbitrariness applies *only* to the signifier, not the signified obligation. Lewis's framework explains why we use *this* signifier, but it doesn't explain the origin or binding force of the obligation *to keep commitments* signified by *any* shell. The coordination problem solved by the *form* is simply "how do we reliably signal an intention to undertake a commitment?" It doesn't address why undertaking commitments creates obligations or why those obligations should be fulfilled.

  **Adjudication: The Limits of the Lewisian Framework**

  Your friend is right that Lewis's move for language is **internally coherent and clean** *within its domain*. It successfully isolates a genuine locus of arbitrariness (language choice) and shows how the need for T&T flows instrumentally from the functional use of *any* chosen language for coordination. It explains the *contingency* of *which* language we are truthful in.

  However, your suspicion is **fundamentally correct**: this is a **special-case dodge**, not a generalizable model for grounding non-coordination norms. The maneuver works *only* because:

  1.  **Language is a Symbolic System:** Language is inherently a system of arbitrary signs. The arbitrariness of the sign (word) is fundamental to its nature (Saussure's *l'arbitraire du signe*). This provides a natural, deep level of arbitrariness to relocate to.
  2.  **Truthfulness is Instrumental to Communication:** T&T-in-L is *not* the primary goal; it's the *means* to achieve communication/coordination *using* the symbolic system L.

  **Norms like promise-keeping, honesty in non-linguistic dealings (e.g., returning lost property), or prohibitions against violence lack these features:**

  *   **No Deep Arbitrariness:** Their core content (keeping commitments, respecting property, bodily integrity) doesn't seem arbitrary in the Lewisian sense. No functionally equivalent alternative *practice* (like systematic breaking or harming) exists.
  *   **The Norm is the Goal, Not the Means:** Keeping promises *is* the point of the practice, not merely a means to use an arbitrary tool. The "form" is secondary.
  *   **Intrinsic Normativity:** These norms often feel intrinsically binding or grounded in reasons beyond coordination efficiency (e.g., autonomy, reliance, harm).

  **Conclusion: How Far Can Lewisian Analysis Go?**

  A broadly Lewisian, coordination-based analysis of convention **reaches its limit when confronted with the core normative content of practices that are not themselves solutions to pure coordination problems and lack a separable, deeply arbitrary symbolic layer.**

  *   **It succeeds brilliantly** for **pure coordination norms** (driving, meeting points) and for **the symbolic infrastructure of communication** (language choice).
  *   **It partially succeeds, via the gambit, for norms that are instrumentally necessary for using a conventional symbolic system** (truthfulness-and-trust-*in-L*).
  *   **It fails to ground the normative force of core social practices** like promise-keeping, non-linguistic honesty, or prohibitions against harm. For these, the Lewisian framework can explain:
      *   *How specific signals or forms become conventional* (e.g., the word "promise," the handshake).
      *   *How conformity can become a stable equilibrium* (if others keep promises, it's best for me to do so too, and vice versa).
      *   *How common knowledge of the practice sustains it.*

  However, it **cannot explain why these practices generate obligations in the first place, or why the arbitrariness requirement isn't met at the level of the core practice itself.** The framework elucidates the *equilibrium* and *contingency* aspects but leaves the essential *normativity* unexplained, deriving it instead from pre-existing desires (to communicate, to enable reliance) or functional necessity. To fully account for these norms, we must look beyond pure coordination – to theories of joint commitment (Margaret Gilbert), normative expectations (Bicchieri), rule-following, moral realism, or the inherent structure of practical reason. Lewis gives us a powerful engine for understanding the emergence and stability of arbitrary solutions, but it stalls when asked to generate the fundamental normative fuel that powers many of our most important social institutions. The obligation to be truthful-in-English is parasitic on the convention of English; the obligation to keep a promise, or to be honest *simpliciter*, is not parasitic in the same way – it stands as a primitive pillar of the social world Lewis sought to explain.
