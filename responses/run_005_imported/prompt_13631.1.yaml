answer: |-
  That's an excellent find for your EE, but your current description **oversimplifies Anscombe's position significantly.** While she fiercely opposed the bombing and condemned Truman, **she was NOT a pacifist who believed "killing in war is always wrong."** Her argument was far more nuanced and grounded in **Just War Theory (JWT), specifically the principle of discrimination (non-combatant immunity).**

  Here's a breakdown of her actual position and argument, crucial for your essay:

  1.  **Not Pacifism, but Strict Just War Adherence:**
      *   Anscombe was a devout Catholic philosopher deeply committed to Thomistic ethics (following Thomas Aquinas).
      *   She accepted the *possibility* of a morally justifiable war under strict JWT conditions, including **legitimate authority, just cause, right intention, last resort, proportionality, and crucially, discrimination.**
      *   Her outrage stemmed from the belief that the atomic bombings of Hiroshima and Nagasaki constituted a **fundamental and egregious violation of the discrimination principle.**

  2.  **The Core Argument: Indiscriminate Killing & Non-Combatant Immunity:**
      *   **The Principle:** JWT holds that it is intrinsically evil to *intentionally target* non-combatants (civilians, wounded soldiers, POWs, medical personnel). Combatants may be targeted because they pose a direct threat.
      *   **The Application to the Bomb:**
          *   Anscombe argued that the atomic bombs were **inherently indiscriminate weapons.** Their design and destructive power made it impossible to confine their effects to legitimate military targets or combatants within a city.
          *   The primary effect was the **mass slaughter of civilians.** While some military targets existed within the cities, the weapon itself could not distinguish between combatants and non-combatants. The civilian population was not collateral damage; it was the *primary target* to achieve the psychological and political effect of forcing surrender.
          *   **"Double Effect" Doesn't Apply:** Some defenders argued the civilian deaths were an unintended "double effect" of targeting military installations. Anscombe vehemently rejected this. She argued that when you use a weapon *known* to destroy an entire city and kill vast numbers of civilians predictably and necessarily, you **intend** that outcome as the *means* to your end (surrender). The civilian deaths were not a side-effect; they were the *mechanism* of coercion. Truman and his advisors *chose* this method precisely *because* of its catastrophic impact on the civilian population.

  3.  **Specific Condemnation of Truman:**
      *   In "Mr. Truman's Degree" and her protest, she focused on Truman's *personal responsibility* as the decision-maker who authorized the use of these indiscriminate weapons.
      *   She argued that deliberately authorizing the killing of non-combatants on such a scale constituted **murder.** It wasn't just a tragic consequence of war; it was a premeditated act of mass killing violating the most fundamental moral prohibition against targeting the innocent.
      *   Her protest wasn't *just* about the act, but about Oxford *honoring* a man she believed had committed mass murder. She saw this as a profound moral failure by the university, normalizing or excusing an atrocity.

  4.  **Rejection of Pragmatic Justifications:**
      *   Anscombe explicitly addressed and dismissed the common justifications:
          *   **"Saving Lives" (Ending the War Quickly):** She argued this was morally corrupt reasoning. You cannot *justify* murder (intentionally killing innocents) by claiming it *prevented* other deaths (even if true, which she contested). The end does *not* justify intrinsically evil means. It sets a dangerous precedent.
          *   **Military Necessity:** She argued the bombings weren't militarily necessary in the strict JWT sense. Alternatives (continued blockade, conventional bombing, awaiting Soviet entry, even a demonstration) existed, and Japan was already nearing collapse. The bomb was used primarily for political/demonstrative reasons against the Soviets or to avoid an invasion *that might not have been needed*.
          *   **Retaliation/Deterrence:** She saw these as irrelevant or immoral justifications for targeting civilians.

  **How to Accurately Describe Her Position in Your Essay:**

  *   **Avoid:** "Pacifist who thought all killing in war is wrong."
  *   **Use Instead:**
      *   "Catholic moral philosopher and staunch adherent to Just War Theory."
      *   "Fierce critic who condemned the atomic bombings as a fundamental violation of the principle of non-combatant immunity inherent in Just War ethics."
      *   "Argued that the inherently indiscriminate nature of the atomic bomb and the intentional targeting of civilian populations made its use intrinsically immoral and constituted mass murder."
      *   "Believed President Truman bore direct moral responsibility for this act and that honoring him with a degree condoned mass murder."

  **Key Philosophical Concepts for Your Teacher:**

  1.  **Just War Theory (JWT):** The ethical framework she operated within.
  2.  **Principle of Discrimination (Non-Combatant Immunity):** The absolute prohibition on *intentionally targeting* non-combatants. This was the core of her argument.
  3.  **Intention vs. Foresight (Double Effect Doctrine):** Her argument hinged on proving that the civilian deaths were *intended* as the means to force surrender, not merely *foreseen* but unintended side-effects. She argued the weapon's nature and the context made intention undeniable.
  4.  **Intrinsic Evil:** The deliberate killing of innocents is always wrong, regardless of consequences. Consequences cannot justify such an act.
  5.  **Moral Responsibility:** The focus on Truman's *personal* culpability as the authorizing agent.

  **Why Her Protest is Significant for Your EE:**

  Anscombe's protest wasn't just a historical curiosity; it was a powerful, early, and philosophically rigorous moral condemnation from within the Western tradition itself. Highlighting it shows that the ethical debate was immediate, profound, and based on established principles of warfare, not just hindsight or anti-war sentiment. It challenges the dominant narrative of pure military necessity and forces a confrontation with the moral horror of deliberately targeting civilians on a massive scale. Integrating her argument will add significant depth and philosophical rigor to your analysis.

  Good luck with your EE! This is a fascinating angle.
