  This is a classic debate in formal epistemology, and there is no universally accepted answer. However, we can evaluate the merits:

  - Nadia's approach (minimum discrimination information) is a general and principled method that has been successful in many applications (statistics, information theory, physics). It minimizes the information loss (or surprise) relative to the prior. In this case, it leads to a distribution where the Right Bank marginal increases because the constraint on the Left Bank (which makes the Left Bank more concentrated on the Old Quarter) is easier to satisfy if we slightly shift probability to the Right Bank, which is unconstrained and thus can remain more spread out. This reduces the overall discrimination.

