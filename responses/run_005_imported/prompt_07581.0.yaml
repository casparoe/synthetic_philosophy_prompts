prompt: |-
  I host a philosophy podcast on formal epistemology, and next week's guest is a philosopher well known for defending the Self-Indication Assumption (SIA) in anthropic reasoning -- including, notoriously, its commitment in the presumptuous philosopher case, which she treats as a cost worth paying rather than a reductio of the view. Draft eight to ten interview questions that go beyond having her simply restate the position: I want at least one question each on why she thinks the reference class problem that dogs the rival Self-Sampling Assumption (SSA) doesn't equally resurface for SIA, on how she squares her enthusiasm for the way SIA defuses the Doomsday Argument with the charge that this is just the presumptuous philosopher's move in a different guise, and on what SIA is committed to once the rival hypotheses involve infinite populations, where relative population sizes stop being well defined -- and for each, a follow-up question keyed to the answer she's most likely to give.
