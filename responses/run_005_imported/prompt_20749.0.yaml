answer: |-
  The dust in the Archives tasted of chalk and forgotten decisions. Aris traced a cracked fingernail down the brittle ledger page, the ink faded to sepia ghosts. *Year 23 Post-Founding. Resolution: Expedited Dam Construction. Materials: Priority Allocation. Timber: Clearcut Sector 7-East. Labor: Mandatory Rotation.* Below, cramped marginalia: *…sustainabl alternatv rejected… smaller yield… longer timetabl… inadmissibl hardship for current gen…*

  Outside the thick stone walls, the sun beat down on Ember Vale. It always beat down now. The great dam, the Founders' Pride, still held back the Silverthread River, creating the reservoir that had fueled their explosive growth – orchards bursting, grain silos overflowing, children laughing in streets built wide for a promised abundance. But generations later, the reservoir was a shrinking, algae-scummed eye. The soil downstream, starved of the river's silt, was pale and chalky, yielding stingy crops. The wind carried grit from the exposed lakebed, scouring paint from houses and hope from faces.

  Aris’s cousin Kael spat onto the dusty path as they walked home. “Another half-basket of mealy apples. Barely worth the blisters. If those greedy bastards hadn’t stripped the eastern slopes for their damned dam timber, we’d have good topsoil. We’d have forests holding the water, not this… this *scraping*.” He kicked a loose stone, sending it skittering. “They stole from *us*, Aris. Plain and simple. Left us this husk.”

  Aris carried the ledger’s weight in her mind. “The Archives… they debated another way, Kael. A slower way. Terraced farms along the river, managed timber cuts, smaller population initially…”

  Kael snorted. “Smaller population? Meaning *we* wouldn’t be here? Fine. Maybe ghosts don’t get blisters harvesting dust. At least they wouldn’t have to live knowing their ancestors *chose* this for them.” He gestured angrily at the bleached valley, the skeletal orchard branches clawing at the harsh sky. “They *harmed* us.”

  The phrase echoed in Aris long after Kael stalked off. *Harmed us.* She returned to the Archives, not to the grand resolutions, but to the dissent. Fragments from Councilor Elara: *…reckless acceleration… burdening generations unseen… a debt we cannot repay…* And then, tucked inside a water-stained journal, a single, chilling line from Founder Garret, the dam’s chief architect, responding to Elara: *…but those unseen generations? They will owe their very breath to our choices now. Different choices, different breaths. Who can mourn a life never drawn?*

  It hit Aris with the force of the summer sun. She stared at the names in the old census rolls – *her* ancestors, listed *after* the dam resolution. Mara, born Year 25. Joren, Year 28. Her own great-great-grandmother, Liana, Year 31. Precise dates, meticulously recorded.

  She cross-referenced. The alternative plan – the slow, careful build – projected initial families restricted, marriages delayed, births carefully spaced. The projected population chart diverged wildly from reality within a single generation. The names listed in *that* hypothetical future… none matched the names in her own lineage past Year 20. Not a single one.

  Her hands grew cold despite the Archive's dry heat. Kael’s anger, her own quiet resentment towards the Founders whose faces stared sternly from portraits… it curdled into something else. A dizzying void.

  *If they had chosen the slow path…* Aris thought, tracing her finger down her own family line in the real census. *Mara… conceived during the Midsummer Festival, Year 24. But if the dam hadn't been built, the Festival wouldn't have been held – resources were diverted to construction. Joren… born after the bumper crop enabled by the reservoir irrigation, Year 28. No reservoir? No crop surplus? His parents struggled for years before; they might not have married then, or conceived then. Liana… her parents met hauling stone for the dam's foundations…*

  Each link in the chain of her existence was forged in the specific, hurried crucible of the Founders' choice. The alternative wasn't Aris living in a greener, kinder Vale. The alternative was… not-Aris. Not-Kael. An entirely different set of people, breathing different air, walking different paths. People who never were.

  She walked out to the overlook. The dam’s shadow stretched long and cold across the valley floor. Below, Kael was still angrily hacking at a shriveled vine. *He blames them for his hardship*, Aris thought. *But if the Founders had chosen differently, chosen the path that wouldn't have led to this dust… Kael wouldn't exist to feel the sun, taste the dust, or even feel anger. He wouldn't be.*

  Could you be *harmed* by the choice that gave you breath? Was her existence, here, now, amidst the grit and the struggle, *worse* than never existing at all? The question wasn't abstract; it was the bedrock of her being. Resenting the Founders for *her* life being hard felt like… resenting the seed for the tree it became, even if the tree grew twisted by the wind they chose to plant in.

  A profound loneliness settled over her, colder than the dam's shadow. The wrongness of the Vale – the depleted soil, the parched air, the struggle etched on every face – was undeniable. It was a wrong woven into the fabric of their world, a consequence of a selfish choice. But who, exactly, was wronged? Not her. Not Kael. They were *products* of the wrongness. To wish for the alternative path was, inescapably, to wish for their own non-existence.

  She looked at her hands, pale in the twilight, hands that sorted the records of the choice that made them. There was no one to blame *for her*, only the vast, impersonal echo of a decision made generations ago, an echo that *was* the valley, *was* the dust, *was* Aris herself. The vertigo wasn't intellectual anymore; it was the ground shifting beneath her feet, revealing not solid earth, but a chasm of contingency. The wrong was real. The harmed… were nowhere to be found. Only the living, breathing consequences remained, looking back at the past with a resentment that had nowhere concrete to land, and forward into a future built on the same unsettling ground. The wind picked up, carrying the taste of chalk.
