  Here’s a toast designed to honor your coach, weave in the conciliationism/steadfastness theme, land the joke for your team, and keep parents engaged – all in about 4 minutes:

  **(Clink glass gently to get attention. Start warm and inclusive.)**

  "Good evening, everyone! Coaches, teammates, parents, families, and most importantly, the irreplaceable Coach [Coach's Name]. Thank you all for being here to celebrate an incredible season and an even more incredible career.

  For 20 years, Coach [Coach's Name] hasn’t just run this Ethics Bowl team; she’s built a sanctuary for thoughtful disagreement. A place where, instead of just trying to win arguments, we learned how to *have* arguments – respectfully, rigorously, and yes, sometimes relentlessly. **(Smile at coach)**.

  And if there’s one philosophical puzzle she drilled into us harder than the trolley problem, it was the great debate: Conciliationism versus Steadfastness. Now, for the benefit of our fantastic parents who might not spend their free time debating epistemology... **(Turn slightly towards parents with a reassuring grin)** ...this basically boils down to a really tough question: What should you do when you meet someone just as smart, just as well-informed, and just as reasonable as you are... and they completely disagree with you?

  Does that disagreement mean you *must* dial back your own certainty? That you *have* to move your position closer to theirs? That’s **conciliationism**. Or... is it okay, sometimes, to hold your ground? To say, 'I’ve thought this through, I understand your points, but I still believe I’m right'? That’s **steadfastness**.

  **(Turn back to Coach, playful tone)**
  And Coach? Let the record show: You were **Team Steadfast**. All the way. Passionately. Unwaveringly. We read the papers, we parsed the arguments, we learned the fancy terms... and your message was clear: Don't just cave because someone smart disagrees. Stand firm in your reasoned conviction.

  **(Time for the joke - deliver with affectionate exasperation)**
  Which, of course, led to some... interesting moments. Like the time she’d spend a whole practice session explaining how, *technically*, upon encountering peer disagreement, we *should* rationally update our priors... only to then review a judge's feedback where they clearly raised a valid point against our case... and her immediate, emphatic response would be: 'Absolutely not. They clearly misunderstood the nuance. Our position was sound.' **(Pause for teammate laughter - they'll get it)**. Coach, we learned *so much* about Bayesian reasoning... and then watched you demonstrate a truly awe-inspiring prior-update resistance! **(Smile warmly at her)**. It was equal parts frustrating and deeply, deeply instructive.

  **(Pivot to sincere appreciation)**
  But here’s the thing she taught us that went way beyond the textbooks: Her steadfastness wasn’t about stubbornness for stubbornness’ sake. It was about **integrity**. It was about the courage to defend a position you’ve truly wrestled with, researched deeply, and believe is ethically sound – *especially* when it’s hard. It was about not letting the pressure to concede blur the clarity of your own reasoned judgment. She taught us that sometimes, the most ethical thing you can do is to stand your ground *because* you’ve listened, *because* you’ve understood the counter-argument, and *because* your conviction is built on solid rock, not shifting sand.

  **(Broaden the scope to include everyone)**
  For us on the team, it meant learning to argue with steel in our spines and respect in our voices. For the parents here, maybe it translates to seeing your kids develop the courage of their convictions, the ability to think critically under pressure, and the resilience to stand up for what they believe is right – skills that matter far beyond any competition room.

  **(Direct focus back to Coach, heartfelt)**
  Coach [Coach's Name], for 20 years, you’ve been the steadfast heart of this program. You’ve believed in Ethics Bowl, you’ve believed in this weird, wonderful process of collaborative disagreement, and you’ve believed fiercely in generations of students, pushing us to think harder, dig deeper, and argue better than we ever thought we could. You taught us that being fair to an opponent's argument doesn't mean surrendering your own. You taught us that intellectual courage and intellectual humility can, and must, coexist.

  **(Raise glass)**
  So, tonight, in the spirit of the philosophy you championed so passionately: We see your point about moving on to retirement. We understand your reasoning. We've listened to your arguments...

  **(Pause, look her in the eye with a knowing, affectionate smile)**
  ...And we remain steadfastly convinced that you are utterly irreplaceable, and that this program, and all of us, owe you a debt we can never fully repay.

  To Coach [Coach's Name] – a true champion of reasoned conviction, the undisputed captain of Team Steadfast, and the reason we all learned how to argue ethically... even if you never *quite* updated those priors on judge feedback! **(Wink)**. Thank you for everything. We will miss you more than words can say. To Coach [Coach's Name]!"

  **(Everyone: "TO COACH [COACH'S NAME]!")**

  ---

  **Why this works:**

  1.  **Accessible Explanation:** Clearly defines conciliationism/steadfastness in simple terms for parents ("What do you do when someone smart disagrees?").
  2.  **Insider Nod:** Uses the jargon ("update priors," "Bayesian reasoning") specifically for the team's benefit in the joke section.
  3.  **The Joke Lands:** The "update priors... never updated her own" is central to the anecdote about judge feedback. Teammates will immediately recognize the scenario.
  4.  **Affectionate, Not Mean:** The framing ("frustrating and deeply instructive," "awe-inspiring prior-update resistance," "knowing, affectionate smile") ensures the joke is warm and celebrates her consistency, even while poking fun.
  5.  **Meaningful Tribute:** Connects her philosophy to broader values (integrity, courage, reasoned conviction) that resonate with everyone.
  6.  **Includes Parents:** Explicitly addresses them and connects the lessons learned to skills parents value in their kids.
  7.  **Strong Finish:** The final "We see your point... we remain steadfastly convinced..." beautifully ties the theme back to the heartfelt tribute and gets a laugh/sigh combo.
  8.  **Appropriate Length:** Structured for about 4 minutes when delivered with natural pauses and emphasis.

  **Delivery Tips:**

  *   Practice pacing. The joke section needs good timing.
  *   Make eye contact with the coach during the heartfelt parts and the joke.
  *   Use gestures naturally – open palms when explaining concepts, maybe a slight shrug during the joke, a firm gesture on "stand your ground."
  *   Let the warmth and respect shine through, especially at the end. A little genuine emotion is perfect.
  *   **Crucially:** Deliver the joke with a big smile and clear affection – it should sound like you're lovingly teasing a beloved mentor about a well-known quirk, not criticizing.

  Good luck! Your coach sounds amazing, and this toast perfectly captures her impact and personality.
