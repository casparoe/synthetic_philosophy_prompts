  ## Rain-Slicked Reckoning at Professor Aris Thorne's Memorial

  **Setting:** A dimly lit faculty lounge repurposed for the memorial reception. Rain streaks the tall windows, blurring the grey campus outside. The murmur of colleagues is a low hum beneath the rain’s percussion. Marguerite, sharp in a tailored black suit, stares into her untouched coffee. Julian, looking rumpled and slightly damp, hesitates before taking the empty armchair beside her.

  **(The silence stretches, thick with unsaid history and the weight of the occasion. Julian clears his throat.)**

  **Julian:** Ten years, Marguerite. Feels longer in this room. Aris would have hated the weak coffee. *(He gestures vaguely towards the urn)*

  **Marguerite:** *(Without looking up)* He’d have complained bitterly while pouring his third cup. Precision in critique, even about the mundane. A lesson you absorbed selectively, Julian. *(Her tone is brittle, testing the ice)*

  **Julian:** *(A flicker of irritation)* Still leading with the ad hominem, I see. Some things *don't* change their truth value. How’s the fortress of epistemic certainty? Holding firm against the tides of… well, reality?

  **Marguerite:** *(Finally turns, her gaze sharp)* Reality *is* precise, Julian. It’s our *access* that’s limited. Unlike your… spectral multitude. Tell me, how fares the kingdom of the indeterminate? Still expanding its borders indefinitely? *(She leans in slightly, the old rhythm asserting itself)* Your ‘admissible precisifications’ – how precisely do *they* admit or exclude? Where’s the sharp line between an admissible precisification of ‘bald’ and an inadmissible one? Or is *that* boundary also… vague? Infinitely regressing into a fog of meta-vagueness?

  **Julian:** *(Leans back, steepling his fingers. A familiar defensive posture, but his eyes are alert, engaged)* Ah, Marguerite, always charging straight for the meta-level. Higher-order vagueness isn’t a bug; it’s a feature. It mirrors the phenomenon. The *fact* that we can’t draw a sharp line around the borderline cases *is* what the supervaluationist framework captures elegantly. It’s not that the *framework* is vague about its own machinery; it’s that the machinery *describes* the genuine lack of sharp boundaries *in the world*, reflected in our language and concepts. There *is* no fact of the matter about whether a precisification itself is borderline admissible – that’s precisely the point! It acknowledges the indeterminacy all the way down, without pretending it’s just epistemic fog obscuring a hidden blade.

  **Marguerite:** *(A tight, humorless smile)* Elegant evasion, Julian. But it’s surrender dressed as sophistication. You replace one mystery – a sharp but unknowable cutoff – with an infinite regress of indeterminacy. At least mine *admits* a fact of the matter exists, even if we can't perfectly access it. Yours dissolves facts into… possibilities. A democracy of precisifications where truth is merely consensus? How is that *not* anti-realist sleight of hand? How does it account for the *feeling* of getting it wrong? When someone clearly misapplies ‘bald’, we *know* it’s wrong. Your cloud of precisifications seems incapable of explaining that normative force.

  **Julian:** *(Leans forward now, intensity matching hers)* Normative force? From *where*, Marguerite? From the precise, unknowable boundary you insist lurks in Plato's heaven? Tell me this: what possible *facts* about the way we use the word ‘heap’, or ‘bald’, or ‘tall’ could *possibly* conspire to fix a *single*, precise number of grains, or hairs, or millimeters, as the cutoff? Not just unknown, but *unknowable in principle*? That’s not realism; it’s mystification! Our usage patterns are messy, contextual, fluid. They *fail* to determine a single cutoff. That’s the *datum*! Supervaluationism doesn’t dissolve facts; it locates the fact *in* the space of admissible interpretations consistent with that messy usage. The feeling of getting it wrong arises when a claim violates *all* admissible ways of making the vague predicate precise. *That’s* the normative anchor – consistency with the established, albeit flexible, meaning. Your ‘unknowable precise boundary’ is a metaphysical ghost conjured to avoid admitting meaning can be genuinely open-textured.

  **Marguerite:** Open-textured? Or simply undefined? You mistake the limitations of our current *knowledge* for a fundamental feature of *reality*. Just because we haven’t mapped the precise threshold for ‘heap’ doesn’t mean it isn’t there, fixed by the complex web of physical facts about sand grains and human perception interacting over millennia of language use! The unknowability is epistemological, Julian, not ontological. Your super-truths are a convenient fiction to avoid the hard problem: that the world *is* precise, even when our linguistic grasp falters. You make vagueness a primitive feature, a brute fact. I see it as an epistemological challenge arising from complexity. *(Her voice lowers slightly)* Aris… Aris always said the hardest truths were the ones that refused to yield to elegant systems. He respected the stubbornness of the real.

  **Julian:** *(The name 'Aris' lands heavily. Julian’s intensity softens, replaced by a weary frustration)* He also said systems were maps, Marguerite, not the territory. Your map insists there’s a single, definite summit, invisible in the fog. Mine acknowledges the mountain range has foothills where the very *idea* of ‘summit’ loses its meaning. It’s not surrender; it’s fidelity to the landscape. And the normative force you prize? It emerges *from* the constraints of admissibility, grounded in actual use, not smuggled in from some inaccessible Platonic switchboard. *(He rubs his temples, looking suddenly tired)* But… invoking Aris… that’s low, Rita. Even for you. *(The old nickname slips out, unintended)*

  **Marguerite:** *(Flinches almost imperceptibly at ‘Rita’. She stares at her coffee again, the fight momentarily draining)* Low? Perhaps. But he’s the reason we’re sitting here, isn’t he? The reason we even… *(She cuts herself off, takes a shaky breath)* Your ‘fidelity to the landscape’ feels like giving up on the summit. Declaring it doesn’t exist because the climb is hard. It feels… intellectually complacent. Safe.

  **Julian:** *(Quietly)* And your hidden blade feels like… superstition. Inventing precision where none exists to satisfy a craving for absolutes. *(He sighs, the rain drumming harder)* Complacent? Maybe. But is it complacent to look at the messiness of language, the contextual shifts, the genuine puzzlement, and say ‘Yes, *this* is the phenomenon,’ instead of insisting it *must* be hiding a pristine razor’s edge we’re just too dim to see? Safety… perhaps. But sometimes safety is just refusing to pretend we know more than we do. *(He looks at her profile)* You always hated uncertainty.

  **Marguerite:** *(Still looking down, her voice barely audible)* And you always embraced it too readily. Made a virtue of not knowing. *(She finally lifts her cup, takes a sip of the cold coffee, makes a face)* God, he *would* hate this swill. *(A faint, reluctant echo of their old shared grievance)*

  **Julian:** *(A ghost of a smile touches his lips)* Told you. Some predicates *are* clearly false. ‘Good departmental coffee’ being one of them. No precisification needed. *(He pushes himself up from the chair, the moment of near-connection fading)* I should… circulate. Pay respects. The Dean looks like she’s mustering troops.

  **Marguerite:** *(Nods stiffly, not looking at him)* Yes. Of course. *(As he turns to go, she adds, almost too softly to hear)* The summit *is* there, Julian. Even in the fog.

  **Julian:** *(Pauses, doesn’t turn back)* Keep climbing, Marguerite. Just… maybe check your map isn’t drawn in ink that ignores the rain. *(He walks away, melting into the somber crowd, leaving Marguerite alone with the weak coffee and the relentless drumming of the rain against the glass.)*
