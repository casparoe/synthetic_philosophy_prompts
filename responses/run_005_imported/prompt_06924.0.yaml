prompt: |-
  Okay so this one isn't hypothetical, I actually have to bring a real memo to a vote on Thursday, and it happens to line up with what we're covering in my decision theory seminar this week, so I figured I'd try to get a head start here. I'm on the small-grants committee for my school's EA club (we give out around $4,000 a semester based on member pitches), and one of the proposals this cycle has basically turned into a live Pascal's Mugging, and the committee is split down the middle on what to do with it.

  Here's the pitch: a member wants us to give the entire semester budget to a friend of his (not a club member, no publication record, nothing we can independently check) who says he's close to a decision-theoretic result on AI bargaining/alignment. In the proposal's own numbers, theres maybe a 1-in-200,000 chance the work amounts to anything, but if it does, he claims it lowers existential risk by an amount worth something like 10^16 expected lives, using a pretty standard total-view longtermist framework. Multiply that through and it beats every other proposal we have, including the boring GiveWell-recommended stuff, by fifteen-plus orders of magnitude, and he's more or less daring the committee to explain why a rational funder wouldn't back the highest-EV option sitting right in front of it.

  We literally read Bostrom's original mugging paper and the leverage-penalty idea for class two weeks ago, and I went and skimmed Yudkowsky's "Pascal's Muggle" reply too, where the leverage penalty stops doing its job once the mugger starts producing evidence, so I know there's supposed to be more principled machinery here than "big numbers make me nervous, no." I just can't turn that into something I can actually defend in front of our resident hardcore expected-value guy, who will 100% stand up and say rejecting the top-EV proposal is just motivated reasoning wearing a Bostrom costume. Could you draft the actual memo I'd circulate before the vote? I need it to land on a real recommendation (fund it, don't, fund some token or conditional amount, whatever's most defensible), and it has to seriously engage with the straight expected-value case for funding rather than dodge it, ideally leaving the committee with some kind of standing principle it could reuse, since I doubt this is the last "shut up and multiply" pitch we're going to get.
reasoning: |-
  Okay, the user is part of a small-grants committee for their EA club and has to decide on a proposal that's essentially a real-life Pascal's Mugging scenario. They need a memo to present before the vote that addresses the high expected value claim seriously but also provides a defensible rejection. 

  First, I need to understand the core tension: the proposal claims astronomical expected value (EV) based on tiny probabilities, which technically dominates other options mathematically, but feels intuitively wrong. The user mentioned they've studied Bostrom and Yudkowsky, so they're familiar with theoretical solutions but need practical application. 

  The user's explicit request is for a memo that:
  - Doesn't dodge the EV math
  - Gives a clear recommendation
  - Establishes a reusable principle
  - Prevents future similar issues

  But their deeper needs might include:
  - Avoiding committee dysfunction (they're split 50/50)
  - Preserving credibility against the "hardcore EV guy"
  - Not setting a precedent for wild pitches
  - Balancing theory with real-world grantmaking constraints

  Hmm, the leverage penalty framework from Bostrom/Yudkowsky seems relevant but needs adaptation. The mugger here isn't threatening harm but offering salvation, and the "evidence" is just the proposer's word. Key red flags:
  - No independent verification (friend of a member, no credentials)
  - Vague claim ("close to a result")
  - No mechanism to audit progress

  I recall Yudkowsky's point that leverage penalties fail when evidence scales with claims, but here there's zero evidence. That's crucial. Also, real grants have opportunity costs beyond money - like committee time and precedent setting.

  The memo should:
  1. Acknowledge EV argument seriously
  2. Explain why we're not convinced by the probability estimate
  3. Propose concrete criteria for future insanity-filtering
  4. Recommend rejection without sounding dogmatic

  Biggest risk is the EV guy accusing them of bias. Need to preempt that by showing EV calculations themselves are untrustworthy here. Also, suggesting a token grant might backfire by validating the approach. Better to reject but fund a smaller related project if defensible.

  Wait - the "standard longtermist framework" point is good. If the proposal uses standard assumptions but gets insane results, that might indicate flawed inputs rather than flawed math. Like, if P(doom) is high but the claimed risk reduction is implausibly large.

  Also worth noting that grant committees aren't obligated to fund everything with positive EV - they have a duty to steward resources responsibly. Comparing to SFF or LTFF thresholds could help.

  ...after drafting the memo structure, I realize the "contingent probability" angle is strongest. The 1/200k isn't P(success), it's P(success | we fund), but if the researcher is unserious, funding might not change outcomes. That reframes rejection as avoiding false positives in EV calculations rather than defying math.
answer: |-
  ## MEMORANDUM  
  **To:** Small-Grants Committee Members  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation on High-Variance AI Alignment Proposal (Ref: Pascal's Mugging Dynamics)  

  ### I. Proposal Summary & Core Tension  
  The proposal requests our entire semester budget (~$4,000) to fund an unvetted researcher claiming a 1/200,000 chance of producing pivotal AI alignment research. If successful, the proposer estimates an existential risk reduction equivalent to 10¹⁶ expected lives saved. Multiplying probability and impact yields an astronomical expected value (EV), dwarfing other proposals.  

  **The tension:** While the *math* superficially favors funding, this mirrors Pascal’s Mugging—a scenario where extreme claims exploit EV frameworks. Our challenge: **reject the proposal without rejecting EV maximization itself.**  

  ---

  ### II. Why Straight EV Calculation Fails Here: Three Defensible Objections  
  We reject the proposal not due to "bigness aversion," but because the claimed probability (1/200,000) and impact (10¹⁶ lives) are epistemically unjustified. Crucially, **EV = P(Success) × Impact** collapses if either input lacks credible anchoring.  

  #### A. **The Leverage Penalty Applies to Uncorroborated Claims**  
  *   Bostrom’s leverage penalty argues we should downweight *extreme* claims lacking commensurate evidence. Here:  
      *   **Zero independent verification:** No publication history, no institutional affiliation, no technical appendix.  
      *   **No mechanism for scrutiny:** The researcher is unknown to our community; we cannot audit progress.  
      *   **Evidence/claim mismatch:** Yudkowsky’s "Pascal’s Muggle" caveat ("evidence scales with claims") is *unmet*. The "evidence" is solely the proposer’s assertion.  
  *   **Committee Principle:** *Claims scaling in impact must scale in evidence.* Absent this, we apply a leverage penalty (e.g., cap maximum plausible P×I).  

  #### B. **P(Success) is Wildly Overstated**  
  The 1/200,000 figure is arbitrary. Consider:  
  *   **Base rates:** Probability of an unknown researcher (no track record) making a pivotal alignment breakthrough is likely << 10⁻⁶. (Compare: LTFF/SFF grants target researchers with proven output).  
  *   **"Close to a result" is not evidence:** Many researchers are perpetually "close." Without technical details, we cannot distinguish this from wishful thinking.  
  *   **Real-world P(Success|Funding):** Does $4,000 meaningfully alter the probability? Unlikely for fundamental theory work.  
  *   **Committee Principle:** *Probability estimates require grounding in base rates or technical plausibility.*  

  #### C. Impact Claims Depend on Untestable Assumptions  
  While 10¹⁶ lives fits a "standard" longtermist model, it assumes:  
  *   The research directly affects AI outcomes (highly uncertain for theoretical work).  
  *   No offsetting risks (e.g., accelerating unsafe capabilities).  
  *   **Committee Principle:** *Gigascale impacts require explicit consideration of model fragility and second-order effects.*  

  ---

  ### III. Recommendation: Reject the Proposal  
  **Do not fund.** The proposal fails basic epistemic checks required for high-stakes bets:  
  1. **No evidence justifying the probability estimate.**  
  2. **No scaffolding to verify impact claims.**  
  3. **No mechanism to ensure accountability.**  

  Funding this sets a dangerous precedent: any claim can "shut up and multiply" by inserting arbitrarily large numbers. **EV maximization requires responsible inputs—not blind faith in extreme numbers.**  

  ---

  ### IV. Handling Future "Shut Up and Multiply" Pitches: A Framework  
  Adopt this 3-stage filter for high-variance proposals:  

  | **Stage** | **Criteria** | **Failure Outcome** |  
  |-----------|--------------|---------------------|  
  | **1. Evidence Threshold** | Does the claim have evidence *commensurate with its scale*? (e.g., pre-prints, expert endorsements, replicable models) | Reject if unmet. Leverage penalty applies. |  
  | **2. Probability Calibration** | Is P(Success) justified by base rates, technical depth, or independent review? | Cap P(Success) conservatively if unsupported. |  
  | **3. Impact Resilience Check** | Does the impact claim hold under plausible model variations? (e.g., partial success, coordination failures) | Discount impact if fragile. |  

  **Only proposals passing all 3 stages warrant full EV consideration.**  

  ---

  ### V. Addressing the "Hardcore EV" Counterargument  
  *"Rejecting the highest-EV option is irrational!"*  
  - **Reply:** True EV depends on *accurate inputs*. This proposal’s inputs are speculative and unanchored. Funding it isn’t EV-maximization—it’s gambling on fabricated numbers. We safeguard EV by filtering out noise.  
  - **Analogy:** Betting your life savings on a lottery ticket with "1:10²⁰ odds" scrawled in crayon isn’t rational EV; it’s credulity.  

  ---

  ### VI. Optional: Symbolic Alternatives (If Compromise Needed)  
  If outright rejection lacks support, propose:  
  - **$100 conditional grant:** Requires researcher to submit a 1-page technical summary to an independent reviewer (e.g., a grad student in ML theory). Funds released *only* if deemed non-trivial.  
  - **Why?** Tests the "evidence threshold" at low cost. If failed, it demonstrates due diligence. If passed, we revisit.  

  ---  
  **Vote Recommendation: Reject**  
  This proposal abuses the EV framework. By rejecting it, we uphold rigorous EV maximization—demanding credible inputs rather than blind multiplication. We can’t fix Pascal’s Mugging by paying the mugger.  

  // End memo //  

  **Key Defense for Thursday:** Focus on the *epistemic injustice* of the inputs. The EV case collapses when P and I are detached from reality. Your "hardcore EV" colleague must defend why *this specific* 1/200,000 is credible—and why uncorroborated claims deserve $4,000 over vetted opportunities. If they cite Bostrom, note his leverage penalty *explicitly* authorizes skepticism here.
