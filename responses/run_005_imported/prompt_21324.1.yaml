  On pacifism vs just war, the student is flawless - correctly noting Anscombe isn't pacifist and accepts combatant deaths. Historical attribution is solid too. The handling of the consequences objection is exemplary: they perfectly capture Anscombe's "even if true, still murder" stance. 

