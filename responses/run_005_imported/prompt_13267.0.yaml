  First, I need to recall Anscombe's core arguments in that pamphlet. She opposed Oxford awarding Truman an honorary degree because she believed his decision to bomb Hiroshima and Nagasaki was murder. The key here is distinguishing between her absolute prohibition on intentional killing of innocents versus the proportionality calculation in double-effect scenarios. The user's framing focuses on proportionality, but Anscombe's main thrust is about intention. 

  The user mentions her use of "murder" as rhetorical emphasis on failed proportionality. But I think that's a misunderstanding. Anscombe uses "murder" to denote the intentional targeting of non-combatants, which is intrinsically wrong. So the user might be conflating two aspects: the absolute moral prohibition versus the conditional proportionality in double effect. 

  Looking at her other writings, like "War and Murder," she clearly distinguishes between intended and foreseen deaths. In the atomic bombings, the civilians weren't just collateral damage; they were direct targets to force surrender. That's where the intention comes in. Truman's defenders might argue it was about ending the war quickly, but Anscombe would counter that the means involved deliberately killing innocents, which is never permissible regardless of ends. 

  The user's confusion arises from Anscombe's acceptance of large-scale collateral damage in other cases. But in those instances, the deaths were unintended, even if foreseen. The proportionality test applies there, but only after establishing that the action itself isn't intrinsically evil. For Hiroshima, the act itself is murder, so proportionality doesn't even come into play. 

  I should also consider the context of the pamphlet. Anscombe was protesting the honor given to Truman, implying moral approval of his actions. Her argument isn't just about the bombings but about the university's complicity in endorsing what she sees as a grave moral wrong. 

  The user's reconstruction as a strict cost-benefit analysis might stem from contemporary just war discourse, where proportionality is a key criterion. But Anscombe's Thomistic framework prioritizes the act's morality over consequences. Her stricter "accounting" isn't quantitative but qualitative: targeting innocents shifts the act into a different moral category. 

  To address the user's deeper needs: they might be trying to position Anscombe within modern just war theory, which heavily relies on proportionality. However, her contribution is a critique of consequentialism in ethics. Emphasizing her distinction between intended and foreseen harm clarifies why Hiroshima is uniquely condemnable for her, beyond scale. 

