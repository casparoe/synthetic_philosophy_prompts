answer: |-
  Your reconstruction captures a significant aspect of Anscombe's argument, but it likely underemphasizes her **core deontological commitment concerning intention and the absolute prohibition against directly targeting innocents**. While proportionality plays a crucial role, it operates *within* and is framed by this more fundamental principle. Here's a breakdown:

  1.  **The Foundational Principle: Intention and Innocence:**
      *   Anscombe was a staunch Thomist and Catholic moral philosopher. Central to her ethics is the **absolute prohibition against the intentional killing of the innocent** (non-combatants). This is not merely a strong preference; it's a moral absolute derived from natural law.
      *   In "War and Murder" (1961) and other writings, she rigorously defends the principle of **double effect**. An action with both good and bad effects (e.g., destroying a military target foreseeably causing civilian deaths) *may* be permissible if:
          *   The action itself is good or neutral.
          *   The *intention* is only the good effect (the bad effect is foreseen but *not intended*).
          *   The good effect is sufficiently weighty to *proportionally* justify the foreseen bad effect.
          *   There is no alternative way to achieve the good effect without the bad effect.

  2.  **Applying this to Hiroshima/Nagasaki:**
      *   Anscombe argues the atomic bombings **fundamentally failed the first two conditions of double effect**:
          *   **Intention:** The primary *means* chosen to achieve the end (Japan's surrender) was the **mass slaughter of civilians**. The destruction of the cities *was the instrument* of coercion. Civilians were not collateral damage; they were the direct and intended target of the destructive force to break the enemy's will. *This is murder.*
          *   **Nature of the Act:** Targeting a whole city inherently and necessarily involves targeting non-combatants. The act itself is indiscriminate by design.

  3.  **The Role of Proportion:**
      *   **Secondary, but Devastating:** Once the action is deemed intrinsically wrong (intentional killing of innocents), proportionality doesn't even get off the ground. *However*, Anscombe *also* argues that **even if one incorrectly applied a proportionality test alone (ignoring intention), it would still fail spectacularly.**
      *   **Her "Stricter Accounting":** Her "stricter accounting" isn't just about higher numbers on the cost side. It's about:
          *   **Questioning the Necessity:** She fiercely contested the claim that the bombings were necessary to end the war without invasion. She pointed to alternatives (e.g., demonstration, modified surrender terms, waiting for Soviet entry) that were dismissed without sufficient justification.
          *   **Questioning the Gain:** She questioned the *moral weight* of the purported gains (saving Allied lives in a hypothetical invasion) when weighed against the *certainty* of incinerating hundreds of thousands of non-combatants.
          *   **Scale as Evidence of Intention/Malice:** The sheer, unprecedented scale and indiscriminate nature of the destruction served as powerful *evidence* that the targeting of civilians was not merely foreseen but *intended* as the means. Such disproportionate destruction couldn't plausibly be argued as an unintended side-effect of a legitimate military strike.

  4.  **Why "Murder"?**
      *   **Rhetorical Emphasis? Yes, but More:** While it *is* rhetorically powerful, "murder" is **precise moral terminology** for Anscombe. It signifies the *category* of the act: the *intentional killing of an innocent person*. It's not merely that the costs were high; it's that the *kind of act* performed was intrinsically evil. Using "murder" forces the reader to confront the act's essential nature, stripped of wartime euphemisms ("collateral damage," "strategic bombing").

  5.  **Resolving the Apparent Tension (Accepting Large-Scale Killing Elsewhere):**
      *   This is the key. Anscombe *could* accept large-scale killing *if* it met the double-effect criteria.
      *   **Bombing Military Installations:** Bombing a legitimate military target (e.g., a factory, rail hub, troop concentration) within a city, knowing civilians nearby would be killed, *might* be permissible under double effect *if* the target is sufficiently important, the attack is discriminate (aimed at the target), the civilian deaths are proportional to the military gain, and there are no better alternatives. The deaths are foreseen but *not intended*; the intention is to destroy the military target.
      *   **Hiroshima/Nagasaki:** Here, the *city itself* (and its civilian population) *was* the target. The military effect (damage to war industries, killing soldiers) was secondary or incidental to the primary goal of mass civilian extermination to terrorize the government into surrender. This *inverts* double effect: the civilian deaths are not a side-effect; they *are* the intended means. *That's* the qualitative difference that makes it murder, regardless of scale or purported benefit.

  **Conclusion:**

  You've correctly identified proportionality as a major component, but **the core structure of Anscombe's argument is deontological, centered on the absolute prohibition of intentionally killing the innocent.** Her verdict differs from other large-scale killings she might accept because:

  1.  **Intention:** She judged the atomic bombings involved the *intentional targeting* of civilians as the *means* to an end.
  2.  **Nature of the Act:** Bombing entire cities is inherently indiscriminate and violates non-combatant immunity *by design*.
  3.  **Proportion's Role:** Proportionality analysis is secondary and presupposes the act isn't intrinsically evil. She argues it fails *even on its own terms* due to questionable necessity and the grotesque imbalance of certain, immediate civilian slaughter versus speculative military gains. The scale *demonstrates* the intentional targeting.

  **In short:** It's not *just* stricter accounting. It's that the act falls into a *different moral category* (intentional killing of innocents = murder) *before* the accounting even begins. The accounting then serves to demolish any potential consequentialist justifications that might be offered *despite* the act's intrinsic evil, and the scale provides overwhelming evidence for the malicious intent. Her use of "murder" is precise moral categorization, not mere rhetorical flourish emphasizing disproportionate cost.

  **For your dissertation:** Emphasize this Thomistic/deontological foundation. Explore how her critique isn't primarily a utilitarian cost-benefit argument gone strict, but a fundamental rejection of consequentialism when it violates absolute moral norms concerning intention and innocence. Contrast her view explicitly with the Truman defenders' arguments, which she saw as morally bankrupt consequentialism justifying murder. This clarifies why she saw the award as a profound moral failure by the university – endorsing an act she considered intrinsically evil.
