prompt: |-
  I'm a student member of my college's Honor Council (the panel that hears academic integrity cases), and this semester I'm also taking a philosophy of probability course where we just spent two weeks on the reference class problem -- you know, the classic headache where you want "the" probability that some specific person has some property, but depending which comparison group you slot them into (all smokers vs. smokers their age vs. smokers their age with their family history, etc.) you get a completely different number, and there's no principled way to say which group is actually the right one for them specifically. We've got a case in front of the council right now that I can't stop thinking is exactly this problem wearing a disguise, so before we vote I want an actual memo laying out the reasoning, not just my gut feeling.

  Here's the case: a student's take-home essay got flagged by the AI-writing detector the school licensed this year, which spat out "91% probability this text is AI-generated." She swears she wrote it herself, and part of her defense is that she's an international student, and these detectors are known (i think -- ive read a couple things on this) to false-flag non-native English writing way more often, something to do with sentence predictability. About half the council wants to treat 91% as basically a confession; the other half wants to throw the number out entirely as meaningless for her case specifically. Nobody's actually using the phrase "reference class problem," but that's clearly the real disagreement -- the 91% came from running the detector over some big test set of essays, and it's not obvious that "essays in that set" is the right comparison class for predicting whether THIS particular essay, written by THIS particular student, was AI-written.

  Could you draft the short memo I'd actually bring to Monday's meeting? I need a concrete recommendation for what to do with her specific case, with a deadline attached since our bylaws say hearings have to close within two weeks of the initial flag, plus a general standard the council could reuse in future cases for how much weight a detector score like this should carry. And don't let the council off easy -- I want the memo to take seriously the strongest version of the other side's view too, that 91% really is evidence and you don't get to just dismiss a number because assigning probabilities to individuals happens to be philosophically messy.
reasoning: |-
  Okay, the user is a student on their college's Honor Council dealing with an AI-detection case involving an international student. They've connected this to the reference class problem from their philosophy of probability course. Let me unpack this.

  First, the core issue: The AI detector flagged the student's essay with 91% probability of being AI-generated. The student claims innocence, citing her status as an international student and known biases in these detectors against non-native English. The council is split between treating 91% as near-proof versus dismissing it entirely. 

  Hmm... The reference class problem is indeed central here. The 91% comes from some general training dataset, but its relevance to this specific student depends entirely on which reference class we use - all students? International students? Her particular linguistic profile? Each gives different probabilities. 

  I should emphasize three key problems: 
  First, the training data likely underrepresents non-native English patterns. Studies show these detectors flag non-native writing more often due to simpler sentence structures - exactly what the student described. 

  Second, the 91% isn't actually the probability of cheating - it's the detector's confidence in matching patterns associated with AI. That's very different from real-world cheating likelihood. 

  Third, even if we accept the number, we must consider base rates. If the detector has a 10% false positive rate for international students (hypothetical), a 91% score could be more likely false than true depending on how common cheating actually is. 

  For the recommendation... We need to reject both extremes. Can't ignore the flag completely (it is evidence), but can't treat it as conclusive. Should demand additional human analysis comparing this essay to the student's past work. Also require investigation into the detector's performance specifically for international students. 

  For future cases, we should establish that detector scores alone can't support a finding - must have corroborating evidence. And we need to pressure the administration for transparency about the tool's limitations. 

  The memo needs to satisfy both sides: validate that the 91% means something (rebutting the "dismiss entirely" faction) while demolishing the idea that it's near-proof (targeting the "treat as confession" group). Philosophical rigor but practical recommendations. 

  Key phrasing: "The detector output is evidence but not proof. Its weight depends critically on context the algorithm cannot see." That frames it as a limitation of application rather than the number itself being meaningless. 

  Also worth stressing the ethical dimension: Applying a flawed metric disproportionately harms vulnerable groups (international students). That's not just philosophically messy - it's potentially discriminatory. 

  Deadline pressure is real - 2 week window. So recommendations must be actionable immediately: comparative analysis by tomorrow, detector validation request by Wednesday. 

  Future standard should require: 1) Corroboration rule, 2) Contextual analysis, 3) Demographic audits of tools. This makes the policy reusable. 

  Biggest risk is council thinking we've "solved" the reference class problem. Need to emphasize this is about minimizing harm despite uncertainty. The philosophical problem remains - we're just creating safeguards around it.
answer: |-
  ## MEMORANDUM  
  **To:** Honor Council Members  
  **From:** [Your Name], Student Representative  
  **Date:** [Meeting Date]  
  **Subject:** Framework for Evaluating AI-Detector Evidence in Case # [Case Number] - Urgent Deadline: [Date + 2 Weeks]  

  ### I. Core Issue: The Reference Class Problem in Action
  The central disagreement regarding the "91% probability" AI-detection score reflects the **reference class problem** discussed in probability philosophy. The score derives from the detector’s performance on a *general dataset* (its "reference class"), but its relevance to *this specific student* depends critically on whether that dataset appropriately represents her. Key facts:  

  1.  **Detector Bias is Documented:** Multiple studies (e.g., Liang et al., ACL 2023; OpenAI, 2023) confirm AI detectors exhibit significantly higher false positive rates for non-native English writers. Features like grammatical simplicity, predictable syntax, and lower lexical diversity—common in non-native writing and AI output—are conflated.  
  2.  **The 91% is Contextual:** This score indicates a 91% match to patterns *associated with AI text in the detector's training data*. It is **not** a direct 91% probability that *this student* cheated. Its accuracy for *her* hinges on how well the detector's reference class (likely dominated by native English essays) aligns with her unique linguistic profile.  
  3.  **The Reference Class Matters:**  
      *   If the reference class is "All Student Essays," the 91% *might* seem strong evidence.  
      *   If the reference class is "Essays by International Students with Similar Linguistic Backgrounds," the false positive rate could be 15-30% or higher (based on cited research). A 91% score in *this* class could be far less meaningful, potentially even more likely to be a false positive than a true positive depending on the base rate of cheating.  

  ### II. Analysis: Why Neither Extreme Position is Defensible
  *   **Against Dismissing the 91% Entirely:** Ignoring the score is unwise. A high score *is* evidence demanding investigation. Detectors *do* identify AI text correctly in many cases. Dismissing it outright fails our duty to investigate potential violations. The philosophical difficulty of assigning individual probabilities doesn't negate the score's *probative value* as a signal worthy of scrutiny.  
  *   **Against Treating 91% as Conclusive Proof:** Relying solely on this score is statistically flawed and potentially unjust. Applying a metric known to be biased against a specific group (international students) without accounting for that bias risks discriminatory outcomes. The reference class problem shows the 91% lacks a stable, objective meaning for *this individual* without contextual adjustment.  

  ### III. Recommended Action for This Case (Deadline: [Date + 2 Weeks])
  1.  **Reject Sole Reliance on the AI Score:** The 91% alone **cannot** support a finding of responsibility. It is insufficient evidence.  
  2.  **Demand Comparative Human Analysis:**  
      *   **Immediately:** Instruct the course instructor (or a designated writing specialist) to conduct a **blind comparative analysis**. Compare the flagged essay against:  
          *   The student’s *verified past submitted work* (e.g., in-class essays, drafts, other assignments).  
          *   Known AI-generated text on the same prompt.  
          *   Focus on argument depth, specific vocabulary/idioms, citation integration, error patterns, and stylistic consistency.  
      *   **Require Specificity:** The analysis must state whether the flagged essay is *stylistically consistent* with the student's past work, noting any significant deviations *and* potential explanations (e.g., rushed deadline, different topic complexity).  
  3.  **Investigate Detector Performance Context:**  
      *   **Request Information:** Demand the administration/provost’s office provide:  
          *   The *validated false positive rate* of the detector **specifically for non-native English writers**, if available.  
          *   Details on the demographic composition of the detector’s training/test sets.  
      *   **Lack of Data is Evidence:** If this data is unavailable (likely), this significantly undermines the score's weight for this student. The known general bias *must* be factored in.  
  4.  **Evaluate Holistically:** Weigh the AI score *alongside* the human analysis, the student's testimony, any access history (if available), prompt specificity, time allowed, and the documented detector bias. The burden of proof remains on the accuser.  

  ### IV. Proposed Standard for Future Cases
  The Council should adopt the following principles for AI detector evidence:  

  1.  **Corroboration Required:** An AI detector score, regardless of magnitude, **cannot be the sole basis** for a finding of responsibility. It requires corroborating evidence.  
  2.  **Contextual Analysis Mandatory:** Human comparative analysis against the student’s authenticated prior work is **essential** whenever detector evidence is presented, especially if factors known to increase false positives (non-native English, specific writing styles) are present.  
  3.  **Transparency Demand:** The Council should formally request the administration provide, for any licensed detector:  
      *   Validated overall accuracy, false positive, and false negative rates.  
      *   Validated accuracy/false positive rates for key demographic subgroups (non-native English speakers, specific disciplines).  
      *   Documentation of the training data composition.  
      *   *Absence of this data significantly diminishes the weight of detector scores.*  
  4.  **Burden of Proof:** The presenter of detector evidence (usually the instructor/facilitator) must be prepared to contextualize the score within the framework above.  

  ### V. Conclusion & Deadline Imperative
  The reference class problem exposes the 91% as context-dependent statistical output, not divine truth. Ignoring it is irresponsible; treating it as conclusive is statistically naive and risks injustice. For this student, **we must seek stronger, individualized evidence before the [Date + 2 Weeks] deadline.**  

  **Recommendation:**  
  *   **Do not find responsibility based solely on the 91% score.**  
  *   **Compel immediate human comparative analysis (Step III.2).**  
  *   **Request detector performance data (Step III.3).**  
  *   **Reconvene before [Date + 2 Weeks] to evaluate ALL evidence (AI score + human analysis + detector context + testimony).**  

  This approach balances the seriousness of the allegation with the fundamental statistical and ethical limitations of the evidence, ensuring fairness for this student and establishing a robust standard for the future.  

  **Attachments:** (Optional - include links to key studies on AI detector bias if available, e.g., [Link to ACL 2023 Paper], [Link to OpenAI Detector Limitations])
