  ## The Swampman's Silence: A Necessary Sacrifice for Teleosemantics?

  Davidson's Swampman thought experiment presents a stark challenge to teleosemantic theories of mental content, particularly the "selected-effects" (SE) approach championed by philosophers like Ruth Millikan. SE theories ground meaning in evolutionary history: a mental state means what it does because that state (or its precursor) was *selected for* causing behaviors that enhanced fitness in the organism's ancestors. Swampman, an exact physical duplicate of Davidson formed by a freak swamp accident, lacks this history. SE theory thus seems forced to conclude Swampman has no genuine thoughts and produces only meaningless noises, despite behaving identically to the original. Furthermore, his organs, lacking a selection history, possess no "proper functions," rendering malfunction impossible. Is this bizarre consequence a fatal flaw for SE theories, or a defensible, even necessary, implication? Let's weigh the arguments.

  **The Case Against Teleosemantics: Swampman as the Fatal Bullet**

  1.  **The Intuitive Absurdity:** The core objection is sheer counterintuitiveness. Swampman walks, talks, solves complex problems, expresses apparent pain when injured, and engages in sophisticated dialogue indistinguishable from the original Davidson. Denying him thoughts feels profoundly wrong, violating our deepest intuitions about mentality being grounded in current structure and function. If a system *is* physically and behaviorally identical to a thinker, *why isn't it thinking?* SE theory seems to commit a kind of *genetic fallacy*, confusing the origin of a capacity with its present existence.

  2.  **The Epistemological Nightmare:** If mentality requires a specific, unknowable history, skepticism looms large. How can *we* ever know if *we* have the requisite evolutionary history? Perhaps *we* are all Swampmen, spontaneously formed moments ago with false memories. SE theory potentially undermines our own first-person certainty about having thoughts.

  3.  **The Problem of Novelty & Learning:** SE theory struggles with genuinely novel thoughts or learned concepts not directly tied to ancestral selection pressures. If Swampman ponders a *new* mathematical theorem or the concept of "swampman" itself, what selected function grounds *that* content? The theory seems overly restrictive, unable to account for the dynamism and creativity of human thought beyond its evolutionary roots.

  4.  **Biological Functions as Epiphenomenal?** Extending the "no function" claim to organs like the heart seems equally problematic. If Swampman's heart stops, it seems nonsensical to deny it *malfunctioned*. This suggests SE theory divorces biological function too radically from current structure and causal role, making function an irrelevant historical footnote rather than explaining why structures exist *now* and what they *do*.

  **The Case for Biting the Bullet: Millikan's Defense**

  1.  **Consistency and Normativity:** Millikan and defenders argue Swampman *precisely reveals* what SE theory gets right: **normativity**. Meaning involves *correctness conditions*. My belief "that is water" is *true* if it's H2O and *false* if it's XYZ. SE theory locates this normativity in biological function: the state has the function of indicating water *because* doing so aided survival/reproduction. Swampman's identical state lacks this history; it was never *supposed* to track anything. It has no correctness conditions. It may *correlate* with water, but correlation isn't meaning. Swampman highlights that meaning isn't just in the head or the behavior; it requires a history of being *selected for* getting things right. Without that history, there is no "right" or "wrong" for the state.

  2.  **Solving the Disjunction Problem:** SE theory elegantly solves a major puzzle in philosophy of mind: why does my mental state mean *water* and not *water-or-swamp-liquid-on-Tuesdays*, even if I've been fooled by swamp liquid before? The answer lies in selection history: the state was selected for tracking *water*, not disjunctions. Swampman has no such selection history to fix the content, leaving his states semantically indeterminate. The "weird upshot" is the *cost* of solving this problem.

  3.  **Biological Functions Aren't Dispositions:** Defenders argue that equating function with current disposition (like the heart's pumping) is inadequate. A diseased heart *still has the function* to pump blood, even if it can't. This normative "should" comes *only* from selection history. Swampman's heart has the *disposition* to pump, but no *proper function*. If it stops, it hasn't malfunctioned; it's simply broken or ceased its disposition. While counterintuitive, this preserves a clear, objective distinction between something merely *happening* (a disposition) and something *being supposed to happen* (a proper function).

  4.  **Swampman as a Mirage:** Millikan dismisses Swampman as a "philosopher's fiction" irrelevant to the actual biological world we inhabit and seek to explain. Natural selection *is* the process that created real minds; theorizing about radically unnatural scenarios like Swampman distracts from explaining how *actual* biological intentionality works. The theory explains the real phenomenon; it shouldn't be judged by its implications for metaphysical impossibilities.

  **Verdict: A Tough Pill, But Not Fatal**

  While Swampman exposes a profoundly counterintuitive consequence of SE theory, it does not constitute a *fatal* flaw. The arguments for biting the bullet are ultimately stronger, grounded in the theory's core strengths: **providing a naturalistic account of normativity and solving persistent problems like the disjunction problem.**

  The intuitive force of Swampman stems from conflating *current structure/behavior* with *intentionality*. SE theory convincingly argues that structure and behavior, no matter how complex, are insufficient for genuine *meaning* without the historical context that establishes normative standards of correctness. The heart of the issue is normativity: can correctness conditions exist without a history of selection *for* correctness? SE theorists compellingly argue "no." Swampman's noises and behaviors lack semantic depth because they are unmoored from the evolutionary teleology that imbues states with "aboutness" and truth conditions.

  Therefore, while the Swampman conclusion is undoubtedly strange and requires sacrificing strong intuitions about duplicate mentality, it is a **defensible consequence** inherent to the selected-effects approach. Millikan and her allies can, and do, "happily" bite this bullet because it preserves the explanatory power and coherence of their theory regarding the *actual* biological origins of meaning. The cost is high in terms of intuition, but the gain – a naturalistic, non-mysterious account of mental content grounded in biological function – is deemed worth it. Swampman remains silent, not as a refutation, but as a testament to the theory's commitment to grounding meaning in the real history of life.
