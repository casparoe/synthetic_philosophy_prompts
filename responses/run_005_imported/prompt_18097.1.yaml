answer: |-
  Based on Quine's core commitments in epistemology, philosophy of language, and ethics, he would almost certainly **savagely critique** the "universal moral grammar" (UMG) program, likely seeing it as suffering from *all* the flaws he attributed to Chomsky's linguistic nativism, *plus* the fatal defects he identified in attempts to ground objective ethics. Here's why, breaking it down:

  1.  **The Core Objection: No Sensory Periphery for Ethics (The Elephant in the Room):**
      *   Quine's fundamental argument in "On the Nature of Moral Values" is that ethics lacks the crucial feature that gives science its objectivity: **friction against sensory experience.** Scientific hypotheses are ultimately judged by their ability to predict and organize sensory input at the "periphery" of our conceptual scheme.
      *   Moral claims, Quine argued, lack this "tribunal." They float free, untethered to sensory evidence in the same way. Their "truth" is relative to a cultural web of values, not an external world.
      *   **Application to UMG:** The UMG program posits an innate *computational mechanism* for generating moral judgments. But for Quine, this changes *nothing* about the fundamental problem: **What is this mechanism *responsive to*?** What is its *input* that provides *empirical constraint* analogous to sensory stimuli?
          *   If the input is "social situations" or "harm scenarios," Quine would demand: How do these situations *impinge sensorially* to *falsify* or *confirm* the output judgment in a way comparable to how a failed prediction falsifies a scientific hypothesis? He'd argue they don't. The UMG mechanism might generate *consistent* judgments within a cultural framework or even across cultures, but consistency ≠ objectivity grounded in sensory evidence. It just pushes the problem of "untetheredness" one step back into the innate structure.

  2.  **Repeating the Attack on Linguistic Nativism (Behaviorism & Underdetermination):**
      *   **Behaviorism & The Black Box:** Quine was deeply skeptical of positing rich, inaccessible innate structures to explain behavior (like language acquisition or moral judgment). His "general-purpose conditioning" view favored explanations based on observable stimuli, responses, reinforcement, and the gradual shaping of behavior through interaction with the environment. He saw Chomsky's innate Universal Grammar (UG) as an unnecessary postulate, a "myth of the museum" where meanings/structures are pre-stored. He'd see UMG as the *same kind of myth* for morality – positing a complex innate "black box" where observable learning patterns (cultural transmission, social conditioning, reinforcement/punishment of behaviors) suffice.
      *   **Indeterminacy of Translation/Underdetermination:** Quine's famous arguments showed that multiple incompatible linguistic theories (grammars) could be compatible with all possible behavioral evidence. He extended this to meaning and even science. Applied to UMG:
          *   **Indeterminacy of Moral "Translation":** Couldn't multiple incompatible "moral grammars" generate the *same* pattern of intuitive judgments in response to trolley problems or harm scenarios? How could behavioral evidence *ever* uniquely determine the correct underlying "syntax"?
          *   **Underdetermination of Moral Theory:** Even if UMG accurately described *how* we *do* judge, Quine would argue it tells us nothing about whether we *ought* to judge that way. The descriptive mechanism is radically underdetermined as a basis for *normative* ethics. The UMG output isn't "true" in the way a scientific prediction is; it's just the output of our biological programming.

  3.  **Naturalism Gone Wrong?**
      *   Quine championed *naturalized epistemology*, bringing epistemology within science. However, his naturalism was **empiricist and physicalist**. He'd likely view UMG as a *pseudo-scientific* naturalization of ethics.
      *   **Lack of Empirical Anchoring:** While UMG researchers conduct psychological experiments, Quine would argue the core postulate – the innate, content-specific moral syntax – lacks the *kind* of direct, constraining sensory link that characterizes genuine scientific posits (like neurons or genes). The evidence (response patterns) is consistent with the nativist hypothesis *and* with sophisticated learning/cultural hypotheses, making the nativist postulate empirically underdetermined and potentially vacuous.
      *   **The Ghost in the Moral Machine:** Positing an innate "moral organ" with complex internal rules smacks of the very kind of mentalism and Cartesianism Quine spent his career demolishing. He'd see it as reintroducing mysterious, unobservable entities under the guise of cognitive science.

  4.  **Would He See Any Difference from Linguistics? (Probably Making it *Worse*):**
      *   Quine might grant that linguistic behavior has a *slightly* stronger claim to empirical constraint through its link to sensory reports and its role in predicting observable events. While still rejecting Chomsky's UG, he might see the *domain* of language as marginally closer to the sensory periphery than ethics.
      *   **Ethics is Farther Out:** For Quine, ethics is *maximally* detached. Therefore, building a Chomskyan model *for ethics* doesn't dodge his objections; it **compounds them**. It takes a model he already rejected for a domain with *some* empirical traction (language) and applies it to the domain he considered *fundamentally lacking* any such traction (morality). It's like using a flawed engine design and putting it in a car with no wheels.

  **Quine's Likely Verdict:**

  Quine would see UMG as a **double folly**:

  1.  **Repeating the Mistake of Linguistic Nativism:** Positing an empirically underdetermined, inaccessible innate structure when observable learning mechanisms suffice.
  2.  **Compounding it with the Fatal Flaw of Ethics:** Applying this flawed model to a domain utterly lacking the sensory-peripheral friction necessary for genuine objectivity, thereby creating an illusion of scientific grounding for moral judgments that are, in his view, inherently non-objective and culturally relative.

  He wouldn't just "tear into it" the same way; he would likely see UMG as an *even more egregious* example of the kind of speculative, empirically unmoored theorizing he opposed, precisely because it attempts to bootstrap pseudo-objectivity onto the least empirically tractable domain of human discourse. His critique would be **devastating and comprehensive**, drawing on his behaviorism, his empiricism, his arguments against innate ideas, his views on the underdetermination of theory, and most fundamentally, his conviction that ethics lacks a sensory tribunal. He would see UMG as dodging *nothing*.
