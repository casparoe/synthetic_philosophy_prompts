  Also, Quine's naturalism rejects any non-empirical foundations. Moral grammar claims might be seen as unverifiable, lacking the behavioral evidence he valued. His objections to Chomsky's linguistics were partly about the inaccessibility of mental structures. For morality, this issue is worse because moral intuitions are even harder to observe and test. 

