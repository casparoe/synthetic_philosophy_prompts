prompt: |-
  I've been working through the Dutch book literature and want to sanity-check something. As I understand it, the diachronic Dutch book argument for conditionalization and the synchronic Dutch book argument for the probability axioms are really just two applications of the same basic proof strategy: incoherence at a time (or across time) lets a bookie construct a combination of bets that guarantees a loss regardless of outcome. Given that they share this same logical core, why do so many decision theorists treat the diachronic version as considerably weaker or more contestable than the static one?
