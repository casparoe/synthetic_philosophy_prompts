prompt: |-
  Ok so I'm putting together a handout for my phil of science seminar this week — we're doing the stats unit and I want something meatier than the cardboard-cutout version of the frequentist/Bayesian fight that everyone already half-knows ("one side uses priors, one doesn't," etc). My students have all vaguely heard of the replication crisis but most of them don't relaize how much of it is actually a fight about what "evidence" even means, and not just about p-hacking being naughty.

  Could you write me a dialogue between a frequentist statistician and a Bayesian statistician who are both staring at Daryl Bem's old "Feeling the Future" precognition experiments — the ones that cleared p < .05 using completely standard methods, and that Eric-Jan Wagenmakers and co. later reanalyzed with Bayes factors, concluding the evidence for psi was pretty underwhelming once you looked at it that way. I want the frequentist to have a genuine, non-strawmanned case for why a run of independently significant results is doing real evidential work regardless of what the Bayes factor says, and I want the Bayesian to push back with actual substance — why the sampling plan/stopping rule shouldn't change what the data tell you (this is the likelihood principle stuff my students always find sort of spooky), and why a small p-value and a large likelihood ratio can come apart for principled reasons, and not just because the Bayesian rigged the prior. By the end I'd like them to have actually located the deepest layer of the disagreement — is evidence fundamentally about controlling error rates over hypothetical repetitions, or about the relative likelihood of the data under each hypothesis — rather than just restating their opening positions louder.

  It doesn't need to resolve in favor of either side. Honestly a dialogue that ends in a kind of stalemate is fine, so long as its clear why they can't just split the difference — that's usually the part my students skip past too fast.
reasoning: |-
  We are going to create a dialogue between a Frequentist (Freq) and a Bayesian (Bayes) discussing Daryl Bem's "Feeling the Future" experiments. The key points we want to cover:

   1. The Bem experiments: a series of experiments that showed statistically significant results (p<.05) for precognition. Later, Wagenmakers et al. reanalyzed with Bayes factors and found the evidence for psi to be weak.

   2. Frequentist's perspective: 
      - The experiments were independently significant. Each one passed the p<.05 threshold. 
      - The replication of the effect across multiple experiments (even if each is small) is evidence that accumulates. 
      - The p-value is a measure of how incompatible the data are with the null hypothesis in a long-run error control sense.

   3. Bayesian's perspective:
      - The Bayes factor gives the relative evidence for one hypothesis over another (e.g., H1 vs H0) by comparing the likelihood of the data under each.
      - The stopping rule and sampling plan are irrelevant for the evidence (the likelihood principle): only the data obtained matter, not the intended design.
      - A small p-value does not necessarily mean strong evidence against H0 because it doesn't account for the alternative hypothesis. The Bayes factor can be small even when the p-value is small if the alternative is not well supported by the data (e.g., if the effect size is small and the prior for the alternative is diffuse).

   4. The deepest layer of disagreement: 
      - Frequentist: evidence is about controlling long-run error rates (Type I error). The p-value is a tool to avoid false positives in repeated experiments.
      - Bayesian: evidence is about updating beliefs. The data should be interpreted in light of prior knowledge and the likelihood under competing hypotheses.

   5. Stalemate: They can't split the difference because they are answering different questions. 
      - Frequentist: "What is the probability of observing data as extreme as this, assuming the null is true?" (focus on the null and long-run behavior)
      - Bayesian: "How should I update my beliefs about the hypotheses in light of the data?" (focus on the relative support from the data for H1 vs H0)

  We'll structure the dialogue to build up to this.

  Setting: Two statisticians are looking at the Bem studies.

  Characters:
  - Freq: A frequentist statistician
  - Bayes: A Bayesian statistician

  Dialogue:

  Freq: Look at these Bem experiments. Nine out of ten of his experiments showed statistically significant results with p-values below 0.05. That's strong evidence for precognition! Each experiment independently rejects the null hypothesis at the 5% level. The chance of that happening by chance if there's no effect is tiny.

  Bayes: I see why it looks impressive, but let's step back. When we reanalyzed these with Bayes factors, the evidence for psi was actually quite weak. For example, in one of the experiments with a p-value of 0.01, the Bayes factor was only about 1.4 — barely any evidence at all. And that's typical across the studies.

  Freq: But that's because you chose a prior that was too skeptical! You set up a prior for the effect size that was spread out, which dilutes the evidence. If you had chosen a more reasonable prior...

  Bayes: Actually, we used a default prior that was designed to be objective — a Cauchy distribution centered at zero with a scale of 0.707. It's a standard choice for psychological effects. But that's not the main point. The issue is that the p-value doesn't measure evidence in the way you think. It tells you the probability of getting data as extreme as what you observed, assuming the null is true. But it doesn't consider how likely the data is under the alternative.

  Freq: Of course it does! If the null is false, then we should get small p-values more often. That's the whole idea of power. And in Bem's case, we have multiple independent replications. The combined probability of getting nine significant results out of ten by chance is astronomically small.

  Bayes: But that's where the likelihood principle comes in. The evidence in the data should depend only on the data you actually observed, not on the sampling plan or what might have happened in other experiments. In the Bayesian framework, the stopping rule doesn't affect the evidence. For instance, if Bem stopped collecting data when he hit p<0.05, that doesn't change the likelihood function — but it does affect the p-value. Your calculation of the combined significance assumes that all ten experiments were fixed in advance. What if he ran more than ten and only reported the significant ones? Or what if he stopped each experiment when he got a significant result? Then your p-value would be invalid.

  Freq: That's a fair point about p-hacking, but Bem used standard methods and pre-registered his designs. We can trust that each experiment was run independently and analyzed correctly. So the combined evidence is strong.

  Bayes: Even then, let's look at the effect sizes. They were small, and the sample sizes were modest. A small p-value can occur even when the alternative hypothesis isn't much more likely than the null. Remember, the p-value is a tail area: it accumulates extreme data that didn't happen. The Bayes factor, on the other hand, is the ratio of the likelihood of the data under H1 to that under H0. If the observed effect is small and the prior for H1 is spread out (as it should be for a novel effect), then the Bayes factor might be small because the data are not particularly surprising under H1 either.

  Freq: But that's exactly the problem! You're penalizing the alternative hypothesis for having a broad prior. That prior reflects your skepticism, not the data. The data are telling us that the null is unlikely, and we have multiple replications. In the long run, if we control the Type I error rate at 5% per experiment, then getting nine out of ten significant results is overwhelming evidence against the null.

  Bayes: The data are telling you that the null is unlikely, but they are not telling you that the alternative is likely. That's the key. The Bayes factor directly compares the two. And when we do that, the data don't strongly favor the alternative. Moreover, your long-run error control is about hypothetical repetitions. But we have this data now. Why should what might have happened in other experiments determine how we interpret this one? The likelihood principle says that the evidence is contained in the likelihood function, which is the same regardless of the sampling plan.

  Freq: Because science is about generalizing beyond this particular sample! We want procedures that are reliable in the long run. If we only look at the data at hand without considering the procedure, we open the door to all sorts of biases. The p-value, when properly used, gives us a measure of how often we'd be wrong if we rejected the null when it's true.

  Bayes: And the Bayes factor tells us how much our beliefs should shift. But the deeper issue is that we're answering different questions. You're asking: "If the null hypothesis were true, how often would I get data as extreme as this?" I'm asking: "How much more likely is the data under the alternative than under the null?" And these questions are fundamentally different. That's why we can get different answers.

  Freq: But in Bem's case, the p-values are so small and replicated that both should agree! The fact that they don't suggests there's something wrong with your approach.

  Bayes: Or with yours? Remember, we have prior knowledge. Precognition contradicts well-established physics. So even if the data are surprising under the null, they might be even more surprising under the alternative if the alternative is inherently implausible. The Bayes factor doesn't incorporate that prior plausibility — it's just about the data. But when we combine it with a low prior probability for psi, the posterior probability remains low. Your method doesn't account for prior plausibility at all.

  Freq: And that's a feature, not a bug! We let the data speak without being clouded by subjective beliefs. If we only look for effects we already believe in, we'll never discover anything new.

  Bayes: But without some prior, how do you know if an effect is real or a fluke? The replication crisis has shown that many effects with p<0.05 don't replicate. That's because the p-value doesn't tell you the probability that the effect is real. It only tells you about the data assuming the null. And when the alternative is not well specified, you can get fooled by randomness.

  Freq: But in Bem's case, we have replication! Multiple studies!

  Bayes: And yet, when others tried to replicate, they failed. The initial evidence wasn't as strong as the p-values suggested. That's the point. The Bayes factor was warning that the evidence was weak, and it turned out to be right.

  Freq: Or maybe the replications were underpowered? Or maybe the effect is real but context-dependent? We can't know for sure. But I maintain that the original studies, taken at face value, provided strong evidence by frequentist standards.

  Bayes: And by Bayesian standards, they didn't. Because we're measuring different things. You're focused on controlling false positives in hypothetical repetitions. I'm focused on the weight of evidence in the actual data for one hypothesis over another. And we can't just average these two concepts — they are fundamentally different approaches to evidence.

  Freq: So we're at an impasse.

  Bayes: It seems so. But at least we've clarified that the disagreement isn't just about priors or p-hacking. It's about what counts as evidence in the first place.

  Freq: Indeed. And that's a debate that's been going on for a century.

  Bayes: And will likely continue. But at least your students will see that there's real substance on both sides.

  [End of Dialogue]
answer: |-
  Here’s a dialogue that digs into the foundational disagreements between frequentist and Bayesian approaches, using Bem’s precognition experiments as a case study. It avoids caricatures, focuses on the core philosophical clash about evidence, and ends in a principled stalemate.  

  ---

  **Characters**:  
  - **Freq**: A frequentist statistician  
  - **Bayes**: A Bayesian statistician  
  *They’re reviewing Bem’s 2011 paper, which reported 9 out of 10 experiments with p < .05 for "precognition."*  

  **Freq**: Look at this—nine independent experiments, each rejecting H₀ (no precognition) at p < .05. The odds of that happening by chance if H₀ were true are astronomically low. This *is* evidence for psi. It’s not just p-hacking; it’s a pattern of replicated signal.  

  **Bayes**: But when Wagenmakers reanalyzed this with Bayes factors, the evidence for psi was marginal—BF ≈ 1.4, barely worth a mention. A small p-value doesn’t automatically mean strong evidence against H₀. Your approach conflates "surprise" with "support."  

  **Freq**: How? Each experiment controls Type I error at 5%. Over multiple tests, the combined probability of false positives shrinks geometrically. Nine successes suggest the effect is real, not noise. The data pass your "replication" litmus test!  

  **Bayes**: Only if you ignore the likelihood principle. Evidence should depend *only* on the data you observed, not on invisible counterfactuals like "What if Bem ran 20 more experiments?" Your p-values hinge on the sampling plan—whether Bem planned 10 tests upfront or added them after peeking. But the *data*—the 9 out of 10—are identical either way. Why should the stopping rule change what the data *mean*?  

  **Freq**: Because error control is about reliability! If I let you stop when you hit p < .05, you’ll "find" effects even when H₀ is true. The procedure guarantees a 5% false-positive rate *in the long run*. That’s not arbitrary—it’s how science corrects itself.  

  **Bayes**: And that’s where we diverge. You’re fixated on long-run performance. I care about what this specific dataset says. The Bayes factor—BF = P(data | H₁) / P(data | H₀)—depends only on the likelihood of the *observed* data under each hypothesis. Stopping rules don’t enter the equation. If the data are unlikely under H₀ *and likely under H₁*, BF is large. Here, it’s not.  

  **Freq**: But your BF is tiny because your prior for psi is skeptical! You used a default Cauchy(0, 0.707) prior, which spreads mass over implausibly large effects. Of course it dilutes the evidence.  

  **Bayes**: Not the point. Even with a neutral prior, Bem’s effect sizes were small. A p = 0.01 might look impressive, but if H₁ is a vague composite hypothesis (e.g., "effect size ≠ 0"), the data can be *even less likely* under H₁ than under H₀. P-values ignore that. A small p-value and a large BF can diverge because p-values measure tail-area probability under H₀, while BF measures relative predictive accuracy.  

  **Freq**: But replication breaks that! Nine studies with consistent, directional effects. Under H₀, the probability of that is 0.05⁹ ≈ 2e-12. That’s overwhelming evidence.  

  **Bayes**: Only if you assume the experiments are identical and independent—which they weren’t. Bem’s effects varied. More deeply, your calculation assumes a fixed sample size. But if Bem ran tests until he hit "success," your math collapses. BF doesn’t care. Evidence is *in the data*, not the design.  

  **Freq**: So you’re saying even flawless replication can’t convince you?  

  **Bayes**: No—if BF >> 1 across studies, I’d be convinced. But here, the data are unimpressive under H₁. Precognition claims are extraordinary; the data aren’t. Your approach sees "replicated significance" and declares victory. Mine asks: "How well does H₁ *predict* this data?" Here, not well.  

  **Freq**: But science needs error control! Without it, we get false positives piling up—exactly the replication crisis. BF depends on priors, which are subjective.  

  **Bayes**: And p-values depend on hypothetical repetitions no one performs. When Wagenmakers applied BF to Bem’s data, it warned the evidence was weak—and replications failed. Your method "saw" strong evidence; mine saw noise. Who was right?  

  **Freq**: ...Fair. But if we abandon error rates, what stops us from cherry-picking data?  

  **Bayes**: Pre-registration, model checks, and yes—BFs that account for predictive adequacy. But fundamentally, evidence isn’t about "controlling mistakes in hypothetical worlds." It’s about *comparing explanations* for real data.  

  **Freq**: And I say evidence *is* about calibration. If I reject H₀ at p = 0.05, I know only 5% of such rejections are false alarms *over time*. That’s objective.  

  **Bayes**: But is "5% false alarms in a long run" the same as "evidence for H₁"? No. That’s why we’re stuck. You think evidence is defined by performance under repetition; I think it’s defined by relative predictive accuracy. We’re answering different questions.  

  **Freq**: So we can’t just average our answers.  

  **Bayes**: Exactly. We agree on the math but not on what "evidence" means. That’s the real fight.  

  **Freq**: ...And it’s why the replication crisis isn’t just about p-hacking. It’s about whether we’ve been measuring the wrong thing all along.  

  **Bayes**: Precisely. Now, about that precognition paper—coffee break? I’ll predict your order...  

  ---

  ### Key philosophical takeaways for your handout:  
  1. **The Core Disagreement**:  
     - **Frequentism**: Evidence = controlling error rates (Type I/II) over infinite hypothetical trials.  
     - **Bayesianism**: Evidence = updating beliefs via likelihood ratios (BF), governed by the likelihood principle.  

  2. **Irreconcilable Differences**:  
     - **Stopping rules**: Freq sees them as essential for error control; Bayes sees them as irrelevant to evidence.  
     - **Replication**: Freq sees replicated p < α as decisive; Bayes demands consistent BF > 1.  
     - **Subjectivity**: Freq avoids priors for "objectivity"; Bayes requires them to quantify evidence.  

  3. **The Stalemate**:  
     - Freq: "Your BF is prior-dependent and ignores long-run reliability."  
     - Bayes: "Your p-value confuses surprise with support and violates the likelihood principle."  
     - **No synthesis possible**: They define "evidence" differently—one procedurally, one predictively.  

  4. **Why This Matters for Science**:  
     - Bem’s p-values suggested strong evidence; BF called it weak. Replications favored Bayes.  
     - The crisis isn’t just about fraud or p-hacking—it’s about which statistical philosophy best defines "evidence."  

  ### Suggested Seminar Questions:  
  - Is evidence a property of data alone (Bayes) or data-plus-procedure (Freq)?  
  - Can error rates (e.g., 5% false positives) ever *be* evidence? Or are they tools for decision-making?  
  - Does the likelihood principle liberate us from arbitrary design choices—or open the door to cherry-picking?  
  - Why might scientists *need* both approaches, even if they can’t be reconciled?  

  This dialogue avoids "priors vs. no priors" oversimplification and instead forces students to confront *why* these frameworks generate conflicting conclusions from the same data—and why that disagreement is foundational.
