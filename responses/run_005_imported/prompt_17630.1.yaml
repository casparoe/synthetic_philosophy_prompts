answer: |-
  Here’s a dialogue between **Alex** (defending Holton’s view) and **Jordan** (defending Ainslie’s picoeconomics), observing **Marcus** hesitating outside his usual casino after resolving to quit gambling:

  ---

  **Setting:** *A rainy evening. Marcus stands under a streetlamp, staring at the neon-lit entrance of "The Fortuna Casino." He clenches his fists, takes a step toward the door, then stops. Alex and Jordan watch from a cafe across the street.*  

  **Jordan:** (Leaning forward) Classic hyperbolic discounting in action. Last night, Marcus’s "sober self" valued long-term financial security and personal integrity highly. He resolved to quit. But now? His "imminent-self" hyperbolically discounts those future benefits. The visceral thrill of gambling—lights, sounds, adrenaline—is *immediate*. Its value spikes as it gets closer. His "resolution" was just a prediction his past self made about future preferences. Now those preferences have shifted. No mystery—just competing temporal selves.

  **Alex:** You’ve described *why* he’s tempted, Jordan, but you’ve erased the crucial element: **resolution**. Marcus didn’t just *predict* he wouldn’t gamble; he *resolved*. For Holton, resolution is a distinct mental act—a commitment formed through deliberation, locking in an intention *against* anticipated future temptation. It’s not a preference; it’s a *volitional posture*. Weakness of will occurs when he *abandons* that commitment despite still judging it best. Watch him—he’s not recalculating preferences; he’s *fighting* to uphold his resolve. *That’s* the failure.

  **Jordan:** But what *is* this "resolve" besides a temporary coalition of earlier temporal selves? When Marcus resolved last night, he exploited hyperbolic discounting *in his favor*—binding his future self by vividly imagining tomorrow’s regret, making it salient *now*. That’s "resolve" in picoeconomics: intertemporal bargaining. The "failure" today is just that his present self reneges on the deal. The casino’s proximity makes immediate reward loom too large. No extra "volitional ghost" needed.

  **Alex:** Ah, but here’s where your model stumbles. If Marcus walks away now, what explains it? According to you, it’s just that his "later selves" happen to discount less steeply today. But *that’s* not what Marcus would say. He’d say, "I *stuck to my resolution*." Holton captures this: success is *actively exercising the capacity to maintain a commitment*, not passively having favorable discount rates. Your model reduces agency to preference fluctuations—but Marcus feels he’s *fighting himself*, not observing preferences change.

  **Jordan:** Feelings aren’t explanations. That "fight" is just the aversive experience of conflicting reward signals: the limbic system screaming "GAMBLE NOW!" versus the prefrontal cortex simulating future losses. Resolutions are brain states that temporarily modulate discount curves. When Marcus feels resolve "crumbling," it’s those inhibitory circuits being overwhelmed by dopamine. What does "weakness of will" add beyond this neuro-behavioral account?

  **Alex:** It adds the **normative dimension of practical identity**. Marcus’s resolution wasn’t just a prediction ("I likely won’t gamble"); it was a *commitment to being a person who doesn’t gamble*. When he abandons it, he doesn’t just satisfy a stronger preference—he *betrays* his own agency. Hyperbolic discounting explains temptation’s pull, but only weakness of will explains why succumbing feels like a *failure of self-governance*, not just a preference shift. Your view makes him a passive spectator to his discount rates. Holton sees him as an active, failing governor.

  **Jordan:** But look! Marcus just pulled out his phone—he’s rereading his "quit gambling" pledge to his wife. In picoeconomics, that’s *re-engaging intertemporal bargaining*: making distant consequences vivid again to steepen the discount curve. If "resolve" were a primitive capacity, why would he need this tactic? It’s proof he’s manipulating his own discounting!

  **Alex:** Tactics *support* resolve; they don’t replace it! Rereading the pledge isn’t recalculating preferences—it’s *reaffirming his commitment* when attention wavers. Resolve is the capacity to deploy such tactics *because* you’re committed. Without the prior resolution, why would he even open that note? In your model, he’s just another self opportunistically maximizing utility. But Marcus sees himself as *the same agent across time*, obligated to his past commitment. That’s why weakness of will carries guilt—not regret over preference miscalculation.

  **Jordan:** Guilt is just the aversive signal that his current choice damages future selves’ interests—reinforcing future bargaining power. Still all within the economy of selves.

  **Alex:** And when he turns away from the casino now, head down, walking quickly—is that just a cooler self winning? Or is it Marcus *exercising his will* to honor his resolution? Your model dissolves the agent into fragments. Holton’s preserves the unity of agency—and explains why *that man walking away* feels he’s achieved something moral, not statistical.

  *(Marcus shoves his phone in his pocket, turns sharply, and walks away from the casino without looking back.)*

  **Jordan:** …He won this round. But tomorrow, or next week, when the urge hits and the future feels abstract again? Hyperbolic discounting will still be there, waiting. "Resolve" is just its temporary ally.

  **Alex:** And without resolve, discounting would *always* win. That’s why weakness of will is the enemy—and why reducing it to discounting misses the battle entirely.

  ---

  **Key Distinctions Illustrated:**  
  1. **Nature of Resolution:**  
     - *Holton/Alex:* Commitment creating normative force.  
     - *Ainslie/Jordan:* Intertemporal bargaining tactic.  
  2. **Failure Mode:**  
     - *Holton:* Abandoning a commitment one still endorses.  
     - *Ainslie:* Preference reversal due to steep discounting.  
  3. **Agency:**  
     - *Holton:* Unified agent maintaining intentions.  
     - *Ainslie:* Successive selves negotiating outcomes.  
  4. **Explanatory Scope:**  
     - *Holton:* Explains guilt, self-betrayal, and the *character* of failure.  
     - *Ainslie:* Explains the *mechanics* of preference shifts.  

  Both accounts *describe* the same behavior but diagnose fundamentally different pathologies—one of judgment, the other of preference. The dialogue shows why Holton insists weakness of will isn’t *reducible* to discounting: it concerns the integrity of intention, not just fluctuating utilities.
