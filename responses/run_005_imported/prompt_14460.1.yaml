answer: |-
  Alright, Doctor, here's a joke crafted for the specific malfunction wrinkle in the function debate, aiming for that insider chuckle:

  **Scene:** A slightly smoky philosophy pub. Two theorists are hunched over a cadaver's exposed chest cavity. A defibrillator lies nearby, unused.

  *   **Dr. Wright** (Etiologist, peering intently): "There, you see? Classic ventricular fibrillation. It's *malfunctioning*. Its *function* is to pump blood rhythmically – that's what it was selected *for*! This chaotic twitching is a failure *of* that function."
  *   **Dr. Cummins** (Causal-Role advocate, tapping the quivering heart with a pen): "Nonsense, Wright. Function isn't some historical ghost. Look at the *current causal contribution*: Right now, this tissue is generating significant thermal energy through chaotic electrical impulses and inefficient mechanical contractions."
  *   **Wright:** "Thermal energy? That's absurd! Its *purpose* is pumping!"
  *   **Cummins:** "Purpose schmurpose. Based on its current causal role within this system's thermodynamic processes... its primary function *at this precise moment* is clearly localized heat production. Quite efficient, actually. Calling it a 'malfunction' is just value-laden anthropomorphism of evolutionary history."
  *   **Wright** (Staring at the still-fibrillating heart, then back at Cummins, deadpan): "So... by your logic... if I plug it into a toaster... it's *not* broken... it's just... *functionally unemployed*?"

  **Why it works for the theories (and the wrinkle):**

  1.  **Core Distinction:** Wright immediately invokes evolutionary history/selection ("selected *for*") to define the function (pumping) and thus the malfunction. Cummins dismisses history and focuses purely on current causal contribution (heat production).
  2.  **The Malfunction Wrinkle:** This is the crux. Cummins's position *forces* him to redefine the function based on the *current* (dysfunctional) state. The heart isn't *failing* at pumping; pumping simply *isn't its current function* anymore. Heat production *is*. This highlights the counter-intuitive consequence: Under pure causal-role, "malfunction" as a *failure of a specific, historically defined task* doesn't exist. Things just have different current causal roles.
  3.  **Wright's Punchline:** Wright's retort exposes the absurdity Cummins's view creates in this context. Calling it "functionally unemployed" brilliantly satirizes the idea:
      *   It implies the heart *could* have its "real job" (pumping) but isn't doing it *right now* (unemployed), which presupposes a stable function *external* to current contribution – exactly the etiological view.
      *   It contrasts the inherent purposefulness implied by "unemployed" with the purely descriptive, value-neutral "current causal role" of Cummins.
      *   The "plug it into a toaster" visual reinforces the disconnect – under causal-role, the heart *is* currently "working" (producing heat), just not in a way anyone *wants* or *expects* based on its history. Calling it "unemployed" sarcastically points out that Cummins has robbed the concept of its normative force ("should be pumping").
  4.  **Insider Nod:** Naming the characters after the theorists and using the specific scenario (fibrillation) grounds it in the real debate.

  It lands because it doesn't just explain the theories; it weaponizes the malfunction problem inherent in pure causal-role against itself, using the very logic Cummins employs, to arrive at a conclusion that feels intuitively ridiculous to anyone who understands biological systems have *persisting* functions they can fail at. Enjoy the philosophy, Doctor!
