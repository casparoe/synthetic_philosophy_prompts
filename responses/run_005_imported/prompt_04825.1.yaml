answer: |-
  Here’s a tightly argued 20-beat exchange focusing solely on *upamāna* (comparison), with a natural segue into *śabda* (testimony) that intensifies the core conflict. Each line directly engages the previous point:

  1.  **Naiyāyika:** "Consider the man told only 'a *gavaya* resembles a cow.' Later, in the forest, he sees an unfamiliar beast, *recognizes* its likeness, and declares, 'This is that *gavaya*!' That *recognition of the resemblance itself*, leading to correct identification, is *upamāna* – a unique knowledge-event irreducible to prior means."
  2.  **Buddhist:** "You mistake the *result* for the *process*. He *sees* the beast (perception). He *remembers* the description 'like a cow' (memory). He *infers* based on perceived similarity to the remembered cow: 'This matches the described likeness, therefore it is a *gavaya*.' No fourth source is needed; inference handles the relational judgment."
  3.  **Naiyāyika:** "But his inference *presupposes* the validity of the resemblance itself! How does he *know* this perceived similarity reliably points to 'gavaya-hood'? He never inferred *that* universal connection before! That initial grasp of 'this is *like* that' is *upamāna*."
  4.  **Buddhist:** "The 'grasp of likeness' is merely *perception* of shared qualities (horns, dewlap, etc.) present in both objects. He perceives qualities A, B, C in the forest beast. He remembers qualities A, B, C are 'cow-like' from the description. The *association* is memory linking perceived qualities to a remembered term – inference merely applies this link."
  5.  **Naiyāyika:** "Perception gives only *this* beast's qualities. Memory gives only the *past* description. What bridges *this specific* perception to *that specific* memory and produces the *novel* identification 'gavaya'? Inference requires a universal rule ('All cow-like beasts in this forest are gavayas'), which he *lacks* at that moment. *Upamāna* provides that bridge *without* a prior universal."
  6.  **Buddhist:** "He *does* have a rule: 'The thing described as cow-like *is* the gavaya.' The description *is* the universal for him. He infers: 'This possesses cow-likeness (perceived). Cow-likeness defines the gavaya (remembered description). Therefore, this is a gavaya.' The 'newness' is just the *first application* of the rule, not proof of a new *pramāṇa*."
  7.  **Naiyāyika:** "Ah, but the description 'cow-like' *is* *śabda* (testimony)! You reduce *upamāna* only by relying on another irreducible *pramāṇa*! You merely shift the irreducible element from comparison to words."
  8.  **Buddhist:** "Not so. *Śabda* itself *is* inference! The hearer *infers* the speaker's intention based on conventions learned through prior perception and inference. Hearing 'gavaya is like a cow,' he infers the speaker intends to denote an animal sharing specific cow-qualities. *Śabda* is reliable inference based on trustworthy speech, not a unique knowledge-source."
  9.  **Naiyāyika:** "Ridiculous! If the speaker says 'This is *nīla* (blue),' and the hearer correctly perceives blue, is his understanding of *nīla* merely an *inference* about the speaker's mind? No! He understands the *meaning* directly via *śabda*. Your reduction dissolves the *immediacy* of understanding language."
  10. **Buddhist:** "The 'immediacy' is an illusion of habituation. As a child, he *learned* 'nīla' denotes *this* color through repeated perception of the object, the word, and the speaker's intent (inferred from context). Now, the association is swift, but it remains a complex inference based on convention and perception. *Śabda* has no intrinsic power; its validity rests on inferential chains about convention and trustworthiness."
  11. **Naiyāyika:** "So, the king hears your arguments now. Is his understanding of your complex points about *pramāṇas* merely him *inferring* your mental states? Or does he grasp the *propositions themselves* directly through your words (*śabda*)? If only inference, how can he be certain he infers *your* meaning correctly, not his own projection?"
  12. **Buddhist:** "Certainty comes from the *reliability* of the speaker (established by perception/inference) and the *coherence* of the argument (itself tested by perception/inference). He grasps the *sounds* (perception), recalls their conventional meanings (memory/inference), and infers the propositional content *you intend* based on context and logical structure. It *is* complex inference, but it suffices. Adding *śabda* as a distinct source explains nothing *new*."
  13. **Naiyāyika:** "But *upamāna* and *śabda* deal with unique objects: *similarity* and *meaning*. Perception grasps qualities, not similarity-as-such. Inference deals with universals, not the unique signification of a *new* word like 'gavaya' in the moment of identification. Your 'inference' is stretched so thin it loses explanatory power! We *need* distinct categories for distinct *kinds* of knowledge-events."
  14. **Buddhist:** "Distinct *events* do not demand distinct *fundamental sources*. We explain all events with perception (including similarity-as-co-presence of qualities), inference (relating concepts/experiences), and their derivatives (memory). Multiplying *pramāṇas* creates unnecessary entities. Is the 'knowledge of absence' a fifth *pramāṇa*? No! It's perception of the empty space plus inference. Economy demands reduction."
  15. **Naiyāyika:** "Economy at the cost of accuracy! Your 'inference' for *upamāna* silently smuggles in the very act of *comparison* you deny. When you say 'he infers based on perceived similarity,' the 'based on' *is* the *upamāna* act! You presuppose what you deny to make your reduction *seem* plausible."
  16. **Buddhist:** "The 'based on' is the *perception* of shared qualities triggering a memory association. The 'inference' is the cognitive step linking the associated term to the perceived object. Where is the mysterious 'comparison' *beyond* perception and this cognitive linking? You reify a mental process into a separate ontological category."
  17. **Naiyāyika:** "The 'cognitive linking' *is* the comparison! And it produces knowledge *not* contained in either perception or memory alone. That *novel synthesis* – 'this *is* that thing described' – is the essence of *upamāna*. Inference, as deduction, cannot generate *new* identifications without prior universals; *upamāna* provides the ground *for* forming those universals."
  18. **Buddhist:** "The 'synthesis' *is* the formation of a new conceptual association (samanya-laksana) – a function of the conceptualizing mind operating *on* perception and memory. It's a *type* of inferential process, not a distinct *pramāṇa*. Calling it *upamāna* adds only a name, not an explanation. The mind's conceptual synthesis is always inferential in nature."
  19. **Naiyāyika:** "Then you reduce *all* knowledge to two sources? Even the Vedas, even the Buddha's words? Is enlightenment merely a complex inference? This radical reduction impoverishes the world! Knowledge of similarity, meaning, absence, the sacred – these have unique textures demanding unique sources. Your razor severs too much!"
  20. **Buddhist:** "The 'texture' is subjective experience, not proof of distinct *pramāṇas*. Enlightenment transcends *all* conceptual means, including your four! True knowledge (*prajñā*) sees things as they are, without proliferating categories. Your *pramāṇas*, including *upamāna* and *śabda*, are conceptual tools for the conventional world – useful, but ultimately reducible to perception and inference operating within dependent arising. Adding more tools doesn't bring us closer to liberation, only to complexity."

  **Key Philosophical Points Embedded:**

  *   **Naiyāyika:** Focuses on the *novelty* and *synthetic* nature of the knowledge gained through comparison/testimony. Emphasizes they deal with unique objects (similarity, meaning) not fully captured by perception/inference alone. Argues reductionism relies on the very thing it denies. Defends distinct categories for distinct epistemic events.
  *   **Buddhist (Dignāga/Dharmakīrti):** Relentlessly reduces to perception (including qualia and relations as co-presence) and inference (conceptual synthesis, linking based on associations). Argues *śabda* is inference based on convention and speaker reliability. Sees *upamāna* as a specific *application* of inference, not a source. Champions ontological and epistemic economy. Links the debate to the soteriological goal (liberation from conceptual proliferation).

  **Why this works for your scene:**

  1.  **Substantive Engagement:** Each point directly challenges the *specific* claim made before, forcing the opponent to refine or defend their position, not just repeat.
  2.  **Shifting Ground:** The debate naturally moves from the *gavaya* example (Beat 1-6) to the nature of *śabda* (Beat 7-12) triggered by the Naiyāyika's point, then back to the core of *upamāna* vs. inference (Beat 13-18), culminating in the broader philosophical stakes (Beat 19-20).
  3.  **Stalemate Potential:** Neither side lands a definitive knockout. The Naiyāyika exposes potential circularity in the reduction (Beat 15, 19). The Buddhist exposes potential reification and unnecessary complexity in multiplying *pramāṇas* (Beat 14, 16, 18, 20). The *emotional* climax comes from the intensity and intelligence of the clash, not a clear winner.
  4.  **Philosophical Depth:** Core issues are tackled: novelty of knowledge, role of universals, nature of conceptual synthesis, relationship between language and thought, reliability of sources, and the link between epistemology and soteriology.
  5.  **Natural Inclusion of Śabda:** It arises organically as a supporting pillar in the Naiyāyika's defense of *upamāna*, allowing the Buddhist to showcase his school's other major reductionist argument without derailing the main topic.

  This exchange provides the rigorous philosophical core you need. Integrate it with your character voices, the king's reactions, and the tense atmosphere for a powerful climax!
