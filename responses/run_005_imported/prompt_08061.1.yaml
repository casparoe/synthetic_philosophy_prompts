  I'm drafting a novel whose protagonist, a cosmologist, delivers a set-piece argument at a conference about humanity's prospects, and I'd like the philosophical scaffolding behind it to be sound rather than hand-waved. In researching the Self-Sampling and Self-Indication Assumptions for her speech, I came away thinking that Bostrom's "presumptuous philosopher" case essentially refutes the Self-Indication Assumption outright, since it lets someone out-argue an entire physics department from an armchair instead of running the experiment. On that basis, I'd planned to have her build her argument on the Self-Sampling Assumption alone, avoiding the Self-Indication Assumption entirely, on the theory that this keeps her reasoning safely free of that same kind of overreach. Before I write the scene, could you tell me whether that's actually a sound way to insulate her argument, or whether I'm missing something about how the two assumptions relate to each other?
