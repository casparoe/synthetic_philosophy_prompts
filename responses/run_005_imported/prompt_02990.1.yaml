answer: |-
  You've hit on a genuinely deep and debated point in formal epistemology – and your meteorological background gives you a uniquely insightful perspective. Your understanding of both the history and the technical core is solid. Let's break down the concern and the responses.

  **Your Core Concern (Accurately Summarized):**
  The accuracy-dominance argument for probabilism (e.g., Joyce) claims to be "non-pragmatic," relying *only* on the purely epistemic goal of accuracy. However, it defines "accuracy" using strictly proper scoring rules (like the Brier score). But "strict propriety" was originally defined *pragmatically* – to incentivize honest reporting by making it strategically optimal. Doesn't this reliance on strict propriety secretly reintroduce pragmatic considerations (incentivizing honesty) into the supposedly purely alethic (truth-related) argument?

  **This is a Valid and Important Challenge.** You haven't mangled anything; you've identified a significant tension. Here are the main lines of response from defenders of the accuracy-first program, along with counterpoints:

  1.  **The "Natural Measure" Defense:**
      *   **Argument:** Proponents (like Joyce, Pettigrew) argue that strictly proper scoring rules aren't *just* pragmatically useful; they are the *only* measures of accuracy that truly respect the *nature* of credences. A credence of 0.7 *means* that the agent believes the proposition is 70% likely to be true. A scoring rule is "truth-directed" if assigning higher credence to truths and lower to falsehoods improves your score. But strict propriety adds the crucial feature: **the uniquely best way to *expect* a good score, given your *own* beliefs, is to report those beliefs honestly.** They claim this captures the *alethic* idea that your credences themselves represent your best estimate of the truth. Any rule lacking strict propriety allows a situation where you *know* (by your own lights) that misrepresenting your belief would lead to a *better expected score* – which seems to violate the very point of having credences as truth-trackers. Accuracy, they argue, *just is* being calibrated *and* sharp, and strict propriety uniquely captures this duality.
      *   **Counterpoint (Your Rabbit Hole):** This feels circular. *Why* is "honest reporting being the best strategy *by your own lights*" the *defining* feature of a purely alethic measure? Isn't the concept of a "best strategy" inherently pragmatic? The forecast verification origin story supports this: strict propriety was *designed* to solve a principal-agent problem (preventing hedging), a fundamentally strategic/pragmatic concern. Defining alethic accuracy *in terms* of a property designed for pragmatic control *does* seem to smuggle it in. Is the "nature" of credences really defined by what makes them strategically optimal to report?

  2.  **The "Avoiding Perversity" Defense:**
      *   **Argument:** Imagine an accuracy measure (scoring rule) that is *not* strictly proper. As you know from forecasting, such rules are "gammable." An agent could have coherent credences `C`, but know that reporting a *different* set of credences `C'` would yield a *better expected score* according to `C` itself. This seems epistemically perverse: your own beliefs tell you that misrepresenting them would look *more accurate* in expectation! Defenders argue that any purported measure of accuracy allowing this is fundamentally flawed *as an accuracy measure*. Strict propriety is a *necessary condition* for a scoring rule to be a legitimate measure of pure inaccuracy, precisely *because* it prevents this internal conflict between belief and expected accuracy report.
      *   **Counterpoint:** While avoiding this perversity is desirable, the *reason* it's desirable might still be pragmatic. We want to *incentivize* honesty (a pragmatic goal), so we demand measures that don't reward dishonesty *in expectation according to the agent's own beliefs*. Is the flaw in the non-proper rule *really* that it doesn't measure truth accurately, or that it creates bad incentives for reporting? The former (alethic) claim is what the accuracy argument needs, but the latter (pragmatic) rationale is more immediately plausible, especially given the historical context you cite.

  3.  **The "Accuracy-Dominance Requires It" Defense:**
      *   **Argument:** The accuracy-dominance argument *only works* with strictly proper scoring rules (or more generally, with "convex" accuracy measures). If you use an improper rule, it's possible that incoherent credences are *not* accuracy-dominated – there might be no coherent set that is guaranteed to be more accurate no matter which possible world is actual. Strict propriety (or convexity) is what *enables* the mathematical proof that incoherence guarantees dominance-avoidability. Therefore, if you want accuracy-dominance to be the criterion for irrationality, you *must* use strictly proper rules.
      *   **Counterpoint:** This is true technically, but doesn't address the *justification* for why accuracy-dominance *using those specific rules* is the relevant purely alethic criterion. It assumes the legitimacy of the measure needed for the proof. The question remains: *Why* is dominance according to a strictly proper rule the mark of alethic irrationality, given the pragmatic roots of strict propriety?

  **Is it a Soft Spot?**

  *   **Yes, it's widely acknowledged as a point of contention.** Philosophers like Miriam Schoenfield, Richard Pettigrew (who defends the program but discusses this), and others explicitly grapple with this challenge. Your concern isn't niche; it's central to critiques of "accuracy-first" epistemology.
  *   **The "Nonpragmatic" claim is arguably overstated.** Many proponents now frame it more carefully. They might say strict propriety captures the *alethic virtue* of credences *qua* estimates of truth, even if the *concept* originated in a pragmatic context. The argument shows that coherence is necessary for optimal accuracy *as measured by any legitimate (i.e., strictly proper) standard*. Whether "legitimate" can be defined *without* a whiff of the pragmatic is the crux.
  *   **Your Historical Insight is Spot-On:** Brier's goal *was* pragmatic verification management. Joyce et al. are repurposing the mathematical tool for a different (alethic) philosophical argument. The question is whether the tool *can* be completely divorced from its original pragmatic purpose and justification in this new context.

  **What to Tell Your Reading Group:**

  1.  **State your case clearly (as you did here):** "I understand the accuracy-dominance argument requires strictly proper scoring rules to show incoherent credences are dominated. However, 'strict propriety' was defined by Brier to solve a *pragmatic* problem – incentivizing honest reporting in forecasting. Doesn't building the argument *around* this specific property, and dismissing improper rules as 'illegitimate' measures of accuracy, implicitly rely on a pragmatic consideration (the need for honest reporting incentives) smuggled into the definition of 'accuracy' itself? How is this a *purely* alethic vindication?"
  2.  **Acknowledge the defenses:** Briefly mention the "natural measure" and "avoiding perversity" arguments outlined above. Show you understand their position.
  3.  **Highlight the tension:** Emphasize the gap between the *origin* and *justification* of strict propriety (pragmatic) and its proposed *role* in the argument (defining pure alethic accuracy).
  4.  **It's a Live Debate:** Conclude by noting this *is* a recognized point of debate within formal epistemology, not a misunderstanding on your part. Philosophers like Schoenfield have pressed this critique hard.

  **Will you embarrass yourself? Absolutely not.** Raising this point shows a deep understanding of both the technical apparatus *and* its historical context, precisely identifying a major philosophical tension. Your forecaster's perspective is a valuable asset in this discussion. You're highlighting that the tool brought in to do "pure" alethic work might still have some pragmatic engine grease on it. That's a sophisticated observation, not an embarrassment. Lean into it!
