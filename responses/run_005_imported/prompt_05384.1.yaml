  Below is a clean counterexample to the idea that "total welfare" for an infinite population can be straightforwardly defined by summing utilities in a fixed order, even when the multiset of welfare levels is identical and only the assignment to people differs. This demonstrates the problem with naively extending total utilitarianism to infinite populations.

  ### The Counterexample
  - **Population**: Both worlds (World A and World B) have the same countably infinite set of people, indexed as \(1, 2, 3, \ldots\).
  - **Welfare levels**: The multiset of welfare levels is identical in both worlds. For every natural number \(n\), there is one person with welfare \(+1/n\) and one person with welfare \(-1/n\). Thus, the welfare values are \(\left\{ +1, -1, +\frac{1}{2}, -\frac{1}{2}, +\frac{1}{3}, -\frac{1}{3}, \ldots \right\}\).
  - **Key property**: The worlds differ only in how these welfare levels are assigned to the people (i.e., a "reshuffling"). No welfare is created or destroyed; it is merely redistributed among the same people.

  #### World A: Assignment and Sum
  - **Assignment**: For each \(k = 1, 2, 3, \ldots\), assign:
    - Person \(2k-1\) has welfare \(+1/k\).
    - Person \(2k\) has welfare \(-1/k\).
  - **Utility sequence**: The welfare levels in order of person indices are:
    \[
    u_A = \left( +1, -1, +\frac{1}{2}, -\frac{1}{2}, +\frac{1}{3}, -\frac{1}{3}, \ldots \right)
    \]
  - **Summation**: Consider the partial sum \(S_N\) after \(N\) terms:
    - For even \(N = 2M\), the sum is \(\sum_{k=1}^M \left( +\frac{1}{k} - \frac{1}{k} \right) = 0\).
    - For odd \(N = 2M+1\), the sum is \(\sum_{k=1}^M \left( +\frac{1}{k} - \frac{1}{k} \right) + \frac{1}{M+1} = \frac{1}{M+1}\), which approaches 0 as \(M \to \infty\).
  - **Total welfare**: The series converges to 0:
    \[
    \lim_{N \to \infty} S_N = 0.
    \]

  #### World B: Assignment and Sum
  - **Assignment**: Group people into triplets. For each \(m = 1, 2, 3, \ldots\), assign:
    - Person \(3m-2\) has welfare \(+\frac{1}{2m-1}\).
    - Person \(3m-1\) has welfare \(+\frac{1}{2m}\).
    - Person \(3m\) has welfare \(-\frac{1}{m}\).
  - **Utility sequence**: The welfare levels in order of person indices are:
    \[
    u_B = \left( +1, +\frac{1}{2}, -1, +\frac{1}{3}, +\frac{1}{4}, -\frac{1}{2}, +\frac{1}{5}, +\frac{1}{6}, -\frac{1}{3}, \ldots \right)
    \]
  - **Summation**: Consider the sum over each triplet \(m\). The welfare sum for triplet \(m\) is:
    \[
    s_m = \frac{1}{2m-1} + \frac{1}{2m} - \frac{1}{m} = \frac{1}{2m-1} + \frac{1}{2m} - \frac{2}{2m} = \frac{1}{2m-1} - \frac{1}{2m}.
    \]
    - This simplifies to a positive term: \(\frac{1}{2m-1} - \frac{1}{2m} = \frac{1}{2m(2m-1)} > 0\).
  - **Partial sum after \(K\) triplets**: After \(3K\) terms, the sum is:
    \[
    \sum_{m=1}^K \left( \frac{1}{2m-1} - \frac{1}{2m} \right).
    \]
    - This is the partial sum of the alternating harmonic series, which converges to \(\ln(2)\) as \(K \to \infty\):
    \[
    \lim_{K \to \infty} \sum_{m=1}^K \left( \frac{1}{2m-1} - \frac{1}{2m} \right) = \ln(2) \approx 0.693.
    \]
  - **Total welfare**: The series converges to \(\ln(2)\):
    \[
    \lim_{N \to \infty} S_N = \ln(2) \neq 0.
    \]

  #### Comparison
  - **Same multiset, different sums**: Both worlds have identical multisets of welfare levels (e.g., the value \(+1\) appears once, \(-1\) appears once, \(+\frac{1}{2}\) appears once, etc.), and the populations are identical. The only difference is how these levels are assigned to specific people—a mere reshuffling.
  - **Sum outcomes**:
    - World A: Sum converges to 0.
    - World B: Sum converges to \(\ln(2) \approx 0.693\).
  - **Conclusion**: The "total welfare" depends on the order of summation (i.e., how we line people up), even though the worlds are ethically identical in terms of who experiences what welfare. This contradicts the naive total utilitarian idea that we can simply "add up everyone's utility."

  ### What Should Give? The Tension Resolved
  The counterexample exposes a tension between two intuitions:
  1. **Reshuffling invariance**: Merely reshuffling welfare levels among the same fixed population should not change how good a world is, as the overall distribution of welfare is identical.
  2. **Total utilitarianism's summation**: The "total" welfare should be defined as the limit of the summed utilities when people are lined up in some order.

  **What should give?** Total utilitarianism's summation method must yield. The reshuffling invariance intuition is more fundamental for ethics—if the same people have the same set of welfare experiences, just reassigned, the world should be equally good. The example shows that the summation limit is not invariant under reshuffling, so it cannot be a consistent definition of "total welfare" for infinite populations. Total utilitarianism, as naively applied, fails here because it violates the principle that identical distributions should have identical values.

  ### Saving Total Utilitarianism with Finite Reshufflings?
  One might try to save total utilitarianism by insisting that "reshuffling doesn't matter" only for **finite reshufflings** (i.e., permutations that move only finitely many people). In this restricted case, the sum limit would indeed be invariant, as changing finitely many terms does not affect the convergence or limit of an infinite series.

  - **Why this might seem like a solution**: In the counterexample, the reshuffling between World A and World B is an "infinite permutation" (infinitely many people have their welfare changed). If we only require invariance under finite reshufflings, the problem disappears, as finite changes don't alter the sum.
    
  - **Why this is a technical dodge that doesn't help**: It avoids the problem but does not address the core ethical intuition. Students (and ethicists) will likely argue that even infinite reshufflings should not change the value of a world if the multiset of welfare levels is unchanged. After all, the identities of the people are irrelevant; what matters is the set of welfare experiences. If swapping who is happy and who is unhappy (even for infinitely many) doesn't change the "distribution," it shouldn't change the goodness of the world. Restricting to finite reshufflings feels arbitrary and ad hoc—it prioritizes mathematical convenience over ethical reasoning. In essence, it dodges the deeper issue: that total utilitarianism lacks a coherent, invariant definition for infinite populations when welfare is not absolutely summable (i.e., when \(\sum |u_i|\) diverges).

  ### Teaching Takeaways
  - **Use this example**: Present this counterexample when students suggest "just add up the utilities." It clearly shows that the sum depends on the summation order, making "total welfare" undefined or order-dependent under naive total utilitarianism.
  - **Broader implications**: This problem highlights why infinite populations require different tools, such as:
    - **Density-based approaches**: E.g., the proportion of people at each welfare level (but this may not work for all distributions).
    - **Axiomatic restrictions**: Like the Pareto principle or anonymity axioms, which might imply that only finite reshufflings are allowed—but this is controversial.
    - **Alternative theories**: Critical level utilitarianism, average utilitarianism (though averages may also be undefined), or non-archimedean theories.
  - **Bostrom reference**: You mentioned a Bostrom paper; this is likely "Infinite Ethics" (2011), which discusses these issues in depth. It explores the problems of aggregating welfare over infinite populations and the implications of various invariance principles. While I haven't summarized it here, your counterexample aligns with its core challenges.

  This example should effectively challenge the naive summation intuition and stimulate discussion on the foundations of population ethics for infinite futures. If you need variations (e.g., a case where one sum converges and the other diverges), I can provide that too!
