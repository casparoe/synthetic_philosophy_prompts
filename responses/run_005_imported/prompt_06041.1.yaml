prompt: |-
  I'm taking a decision theory course this semester, and a disagreement in my friends' weekly betting pool has been nagging at me in a way the assigned readings haven't quite resolved. Each week we all agree on which side of a given wager carries positive expected value, but one friend insists that being rational just means judging every bet purely by its expected value, staking as much of your bankroll as possible whenever the odds favor you, since doing otherwise leaves money on the table. When I tallied results over a full season, everyone who followed his rule went broke at least once, but he waves this off, arguing that if you imagine many people following the same rule in parallel, it still wins out on average, so any one person's ruin is just bad luck rather than evidence that the strategy itself was mistaken. Another friend instead wagers some smaller, fixed percentage of her bankroll every time, but cannot really explain why that policy should count as more rational rather than merely more cautious. Is either of them actually onto something defensible, or does rationality simply have nothing further to say about bet size once a wager's expected value is positive, leaving it purely a matter of personal taste?
reasoning: |-
  Okay, the user is in a decision theory course and is grappling with a disagreement among friends about betting strategies. Let me unpack this step by step.

  First, the core issue: One friend advocates always betting as much as possible on positive EV bets, arguing that anything less is irrational. The other uses fractional Kelly betting but can't articulate why it's better. The user wonders if rationality has anything to say beyond positive EV.

  Hmm, this is a classic expected value vs expected utility problem. The EV-maximizer friend is technically correct about long-run averages but ignores individual risk of ruin. The fractional bettor is intuitively avoiding ruin but lacks the vocabulary to explain why. 

  I should emphasize that rationality isn't just about EV - it's about maximizing expected utility. The key insight is that going broke has near-infinite disutility. Even if the probability is small, the catastrophic outcome dominates the calculation. 

  The Kelly Criterion seems relevant here - it maximizes geometric growth while eliminating ruin risk. But full Kelly still has high volatility. Fractional Kelly (like the friend's fixed percentage) reduces volatility while preserving most growth. That's probably why she didn't go broke like the others.

  The parallel universes argument is interesting but flawed. Sure, the collective wins, but individuals care about their specific path. Rational actors can't accept strategies where their personal extinction probability approaches 1 over time.

  I should mention how utility functions work - logarithmic utility makes Kelly optimal, but even with different risk tolerances, fractional Kelly makes sense. The fixed-percentage friend might be approximating this without knowing the math.

  Also worth noting: the season-long results aren't just bad luck. The probability of ruin for full EV maximization approaches 1 given enough bets. That's a mathematical certainty, not variance.

  The user might be looking for ammunition to settle the debate. Giving them the Kelly math and risk-of-ruin formulas would help. But also emphasizing that rationality requires considering outcome distributions, not just averages.
answer: |-
  This is a deep and practical question that cuts to the heart of what "rational" means in decision-making under uncertainty. Neither friend is entirely right, nor entirely wrong, but the "fixed percentage" friend is closer to a defensible rational strategy, even if she can't articulate why. Here's why:

  1.  **The Flaw in Pure Expected Value (EV) Maximization (Your First Friend):**
      *   **Mathematical Reality of Ruin:** Your first friend is correct that *in expectation* (across many parallel universes), betting your entire bankroll on every +EV bet maximizes expected *dollar* gain. However, this strategy has a **100% probability of eventual ruin** in a single universe if you face an infinite series of bets (or even a long finite series). This is because any bet, no matter how favorable, has a non-zero probability of losing. Betting your entire bankroll repeatedly guarantees you *will* eventually lose it all. "Going broke at least once" over a season is *not* just bad luck; it's the inevitable consequence of the strategy when faced with repeated bets. Rationality shouldn't demand a strategy guaranteeing self-destruction.
      *   **Utility, Not Just Dollars:** Rationality isn't solely about maximizing expected *dollars*; it's about maximizing expected *utility*. Dollars often have diminishing marginal utility (the first $1000 means more than the next $1000). More crucially, **losing your entire bankroll has catastrophic utility** – you can't play anymore, debts might be incurred, or your basic needs might be threatened. A rational actor assigns a huge negative utility to ruin. Pure EV maximization ignores this non-linearity in the value of money and the catastrophic disutility of ruin.
      *   **The Parallel Universes Fallacy:** Your friend's argument about parallel universes winning on average is irrelevant to an individual actor making sequential decisions in *one* timeline. An individual cares about their *own* survival and growth trajectory. A strategy that guarantees individual ruin while showing a positive average *across* ruined individuals isn't rational for the individual.

  2.  **The Wisdom in Fractional Betting (Your Second Friend):**
      *   **Managing Risk of Ruin:** Betting a fixed percentage of your *current* bankroll (like 1%, 5%, 10%) automatically reduces your bet size after losses and increases it after wins. This inherently **dramatically reduces the probability of ruin** compared to betting a fixed dollar amount or your entire bankroll. It ensures you always have bankroll left to keep playing.
      *   **Maximizing Long-Term Growth Rate:** Crucially, there's a mathematically optimal way to do this fractional betting to maximize the *expected long-term growth rate* of your bankroll. This is the **Kelly Criterion**.
          *   The Kelly fraction (`f*`) is calculated as: `f* = (bp - q) / b`
              *   `b` = Net odds received on the bet (e.g., if you bet $1 to win $2, `b` = 2).
              *   `p` = Probability of winning.
              *   `q` = Probability of losing = `1 - p`.
          *   **Example:** A bet at even odds (b=1) where you have a 55% chance of winning (p=0.55, q=0.45). Kelly fraction = `(1 * 0.55 - 0.45) / 1 = 0.10` or 10%.
      *   **Why Kelly is Rational (for Growth):** Betting the Kelly fraction maximizes the *geometric mean* of your bankroll growth over the long run. It balances the competing goals of capitalizing on +EV opportunities and avoiding excessive risk that leads to ruin or severe drawdowns. It inherently incorporates the non-linearity of utility associated with bankroll levels.
      *   **Fractional Kelly (Your Friend's Strategy):** Betting a *fixed* percentage smaller than full Kelly (e.g., 1/2 Kelly, 1/4 Kelly) is a very common and rational adaptation. It further reduces volatility and the (already small) risk of ruin associated with full Kelly, while sacrificing only a small amount of expected growth. This is often preferred because:
          *   Humans are typically more risk-averse than the pure growth-maximizing Kelly strategy assumes.
          *   Estimates of `p` and `q` are often imperfect. Betting less than full Kelly provides a margin of safety against estimation errors.
          *   It significantly reduces the emotional stress of large drawdowns.

  3.  **Is it Just Personal Taste?**
      *   **No.** Once you acknowledge that utility is non-linear (especially concerning ruin) and that decisions are sequential, rationality *does* have something substantive to say beyond "bet something on +EV".
      *   **The Rational Framework:**
          1.  **Define your utility function:** How do you value different bankroll levels? What is the disutility of ruin? (This *can* involve personal taste regarding risk aversion).
          2.  **Maximize Expected Utility (E[U]):** Given your utility function and the probabilistic outcomes of the bets, choose the bet size that maximizes your *expected utility* for each wager.
      *   **Kelly as a Benchmark:** The Kelly Criterion arises naturally if your utility function is the *logarithm of wealth*. This specific function implies that a 10% gain provides the same utility increase regardless of your current wealth (constant relative risk aversion), and crucially, it assigns infinitely negative utility to ruin (log(0) = -∞). **For an actor whose sole goal is maximizing the long-term compounded growth rate of their wealth and who accurately knows the edge, betting the full Kelly fraction is the uniquely rational strategy.**
      *   **Deviations are Rational *Given* Preferences/Uncertainty:** Betting *less* than Kelly is rational if:
          *   Your personal risk aversion is higher than logarithmic utility implies (you value reduced volatility more than pure max growth).
          *   You are uncertain about your true edge (`p`). Erring on the side of caution is prudent.
          *   You have financial obligations or psychological limits that make severe drawdowns unacceptable.
      *   Betting *more* than Kelly (like your first friend) is *never* rational for maximizing long-term growth and *increases* the risk of ruin. It only maximizes simple EV, ignoring the path dependency and risk of ruin inherent in repeated play.

  **Conclusion:**

  *   **Your first friend is mistaken.** Pure EV maximization is irrational for repeated betting because it guarantees ruin and ignores the catastrophic disutility of losing everything. The parallel universes argument doesn't save it for the individual actor.
  *   **Your second friend is using a rational strategy (Fractional Kelly), even if she can't explain it.** Betting a fixed percentage of the bankroll manages risk, avoids ruin, and, if the percentage is chosen well (e.g., based on Kelly principles), comes close to maximizing expected long-term growth or utility for many reasonable risk preferences.
  *   **Rationality demands more than just identifying +EV bets.** It requires choosing a bet size that maximizes your *expected utility*, considering:
      *   The sequential nature of the bets.
      *   The non-linear utility of money (especially the disutility of ruin).
      *   Your personal risk tolerance.
      *   The uncertainty in your edge estimates.
  *   **The Kelly Criterion provides the core rational benchmark** for bet sizing when the goal is long-term wealth growth with known edge. Fractional Kelly is a rational and prudent adaptation for real-world conditions involving risk aversion and uncertainty. Bet size is **not** purely a matter of personal taste once EV is positive; it's a critical component of maximizing expected utility in a sequential decision-making context. Your season's results starkly illustrate the practical difference between the two approaches.
