answer: |-
  ## Philosophers at the Conference Bar: Dispositions Under Siege

  *(The clink of glasses mingles with the murmur of post-talk debate. ALEX, mid-40s, leans forward intently, gesturing with their IPA. BEN, late 50s, rests an elbow on the bar, nursing a whiskey, a skeptical eyebrow raised.)*

  **Alex:** ...so Lewis *did* salvage the core insight. Martin’s electro-fink showed the *naive* conditional analysis – "if poked, it would break" defining fragility – was hopeless. But adding the *intrinsic causal basis* fixes it! The finked wire isn't fragile *because* its causal basis – its molecular structure – is rigged to *prevent* breaking when poked. The conditional holds *relative to* the basis being undisturbed. It’s not magic; it’s causal structure!

  **Ben:** *(Sighs softly)* Alex, Alex. Lewis patched one leak only to spring three more. That "causal basis" is doing all the heavy lifting, but it’s smuggled in. *What* is it? If it’s just whatever physical property grounds the disposition... haven't you just *renamed* the disposition? You haven't analyzed it *away* with conditionals.

  **Alex:** No! The basis is the categorical property – the microstructure – that *underpins* the disposition. The conditional analysis *plus* the specification of that basis tells you what the disposition *is*: it’s that property which, *were* it present and *undisturbed*, *would* cause the manifestation given the stimulus. The fink disturbs the basis. Problem solved.

  **Ben:** Undisturbed? Ah, there’s the rub. Enter Johnston’s masking. Take your fragile glass. It has its lovely causal basis. Now, wrap it in superbubblewrap – the basis is intact, entirely undisturbed! The conditional "if struck sharply, it would break" is *false*. Yet, the glass is *still fragile*! The bubblewrap *masks* the fragility without altering the basis. Lewis’s analysis now falsely denies the disposition exists.

  **Alex:** *(Leans back, thoughtful)* Okay, masking is trickier. But we can refine! Add an "unless masked" clause to the analysis: "X is disposed to M when S iff X has some intrinsic property B such that, if S were to occur and X retained B *and no mask intervened*, then M would occur." The bubblewrap *is* the mask. The disposition persists because the *counterfactual dependence* holds *in the absence of the mask*.

  **Ben:** *(Chuckles dryly)* "Unless masked"? Alex, that's not analysis; that's capitulation dressed in a lexical bow. *What is masking?* It’s preventing the manifestation *despite* the disposition and stimulus being present. Your definition now reads: "X is fragile iff, *if* struck *and* not prevented from breaking *by something that prevents it from breaking when it's fragile*, it would break." Circularity! You're using the very notion you're trying to define – the disposition itself – to characterize the mask. "Mask" *means* "prevents the manifestation *of the disposition*". You haven't captured dispositions with conditionals; you've presupposed them.

  **Alex:** It's not circular! We can characterize masks *functionally* or *via their own dispositions*. The bubblewrap has the disposition to absorb impact. That disposition interacts with the glass's fragility. We analyze *that* disposition causally too. It's a network of causal powers, all ultimately grounded in intrinsic bases and conditionals describing their interactions.

  **Ben:** A network held together by... what? Glue made of more dispositions? Look at Bird’s antidote case. Poison is disposed to kill when ingested. The antidote isn't a fink – it doesn't alter the poison's causal basis mid-flight. It's not a mask in Johnston’s sense – the poison *is* interacting with the system, doing its biochemical damage. But the antidote *interrupts* that causal chain *downstream*. Is the poison *not* disposed to kill? Of course it is! Yet, the conditional "if ingested, it would kill" is false if the antidote is always present. Your "unless masked" clause struggles here – is the antidote a mask? It doesn't prevent the poison *acting*, it prevents the *final manifestation*. Your analysis risks either misclassifying the disposition or becoming impossibly complex, adding clauses for every possible downstream interferer.

  **Alex:** Complexity isn't falsity! Maybe we need a more sophisticated understanding of the stimulus-manifestation chain, allowing for intermediaries. The poison *is* disposed to *initiate a biochemical cascade* that *typically* leads to death. The antidote disrupts that cascade *after* the initial disposition manifests. The core disposition to bind receptors or whatever *is* captured by a conditional relative to its basis.

  **Ben:** "Typically"? Now you're sneaking in regularity or modality again. And "initiate a cascade"? That *is* its manifestation! Death is the *result*. But the disposition *itself* is the poison's *power*, its *directedness* towards that result. Martin was right: this directedness, this *aboutness* – the poison being *for* killing – is what the conditional tries, and fails, to capture. You keep adding epicycles – bases, 'unless masked', complex chains – to save the conditional model. But each fix either smuggles in the dispositional concept or fails to cover the counterexamples. The phenomena – finks, masks, antidotes – reveal dispositions as *sui generis*. They are properties *in virtue of which* the conditionals hold *when they do*, but the conditionals don't *define* them. The electron's charge just *is* that property that disposes it to repel other electrons, attract protons... finks and masks be damned. Trying to reduce it to a set of 'if-thens' plus physical bases plus exception clauses... it doesn't capture the *nature* of the property, only its *contingent behavioral profile*.

  **Alex:** But that profile *is* what physics, my old world, deals in! Charge *is* defined operationally, by what it *does* in interactions. The disposition *is* the causal role.

  **Ben:** And the causal role is played by... *something*. The *playing* of the role, the *having* of the power – that's the primitive bit. Enjoy the whiskey, Alex. It has the disposition to induce philosophical melancholy... unless masked by another round? *(Ben taps his empty glass, a wry smile playing on his lips).*

  **Alex:** *(Smiles faintly, signalling the bartender)* Touché, Ben. Touché. But I'm not surrendering the conditionals just yet. That next round might clarify things... or just mask the problem further. Let's test the disposition of your wallet, shall we?
