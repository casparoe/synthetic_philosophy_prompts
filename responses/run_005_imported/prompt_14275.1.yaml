  For follow-ups, anticipating her defenses is key. Example: if she says causal powers are biological, ask why biology is special. If she says Background isn't rules, demand how we'd tell the difference.

  Statistical learning follow-up should preempt her "still syntax" reply by asking why syntax can't ground semantics when scaled up. Falsifiability follow-up must block the "categorical difference" escape route by asking if that makes her position unscientific.

