  ### Standard Philosophical Resolution  
  Neither Leah nor Theo invokes **Joyce’s accuracy-domination argument** (from James Joyce’s 1998 *A Nonpragmatic Vindication of Probabilism*), which sharpens the dispute:  
  - **Core distinction**: Dutch books are *pragmatic* (focused on avoiding losses), while accuracy arguments are *epistemic* (focused on belief-truth alignment).  
  - **Resolution**: For any incoherent credence function, there exists a coherent one that is *strictly more accurate* (closer to truth) in every possible world, as measured by scoring rules (e.g., Brier score). This avoids betting/utility assumptions and directly targets "ordinary confidence" (Theo’s concern in #4).  
  - **Why it helps**:  
    - Addresses Theo’s #4/#6: No circularity (it doesn’t define belief via betting) and no utility assumptions.  
    - Strengthens Leah’s #1/#3/#5: Incoherence isn’t just "practically bad"—it’s *accuracy-dominated*, making it epistemically irrational regardless of stakes or money.  

  This shifts the debate from "Can I dodge bookies?" to "Are my beliefs geared toward truth?"—a deeper foundation for probabilistic coherence.
