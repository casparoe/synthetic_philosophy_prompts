  }

  And the additional resolution: The accuracy argument (e.g., by James Joyce in "A Nonpragmatic Vindication of Probabilism") provides a way to justify probabilistic coherence without appealing to betting or pragmatic losses. It shows that for any incoherent credence function, there is a coherent one that is strictly more accurate in every possible world (using a proper scoring rule). This avoids the issues of utility and the betting protocol.
