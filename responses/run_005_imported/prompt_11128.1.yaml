prompt: |-
  A friend of mine and I spent much of the walk home from our decision theory reading group last night arguing about whether the "coherence arguments" for expected utility maximization really deliver what their proponents claim. The occasion was Eliezer Yudkowsky's essay "Coherent decisions imply consistent utilities," which my friend reads as showing that any agent facing a long enough sequence of choices will be dragged, on pain of leaving free money on the table, toward acting as if it maximizes some real-valued utility function. When I asked why an agent couldn't simply decline to have any preference at all between certain pairs of options, rather than being forced to rank everything, my friend retreated to a narrower and admittedly more careful line of defense: the money-pump argument for the completeness axiom specifically, of the sort developed at length in Johan Gustafsson's 2022 book on the subject. There, an agent with a genuine gap in its preferences (the example under discussion was a career as a clarinettist versus a career in law) can apparently be walked through a short sequence of trades, none of which its incomplete preferences give it any standing to refuse, that leaves it strictly worse off than where it started.

  I remained unconvinced, because the whole procedure seemed to rely on treating each offered trade as a fresh, memoryless choice rather than as one step in an ongoing policy. An agent that keeps track of which options it has already turned down, and simply refuses ever to accept something ranked below one of those, appears to escape the entire sequence without needing a complete preference ordering anywhere. My friend regarded this as a kind of evasion: a rule invented on the spot to defuse one particular pump is suspicious by its very design, and in any case Gustafsson devotes a whole section of the book to arguing that this general style of history-sensitive, "resolute" response to money pumps does not ultimately work. We went around in circles for the better part of an hour and never settled it.

  I would like your help making my side of the case properly. Could you argue that the money-pump argument for completeness fails to show that rational agents must have complete preferences, on the grounds that its force depends on a substantive and independently unmotivated assumption about which choice rules an agent is permitted to use across a sequence of decisions, rather than following from any minimal requirement of rationality on its own? I would especially like you to engage with my friend's strongest objection – that a choice rule custom-built to survive a known pump is question-begging in exactly the way any ad hoc rescue is – rather than brushing it aside.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with their friend about coherence arguments for expected utility maximization, specifically focusing on money-pump arguments for the completeness axiom. The user's friend argues that any rational agent must have complete preferences to avoid being money-pumped. The user remains unconvinced, believing that an agent with incomplete preferences can avoid money pumps by using history-sensitive choice rules. They want help articulating this position, especially countering the friend's objection that such rules are ad hoc.

  First, I need to recall the core of the money-pump argument. It claims that if an agent has incomplete preferences (e.g., indifferent between A and B), they might accept a series of trades leading to a worse outcome. For example, trading A for B (since they don't prefer A over B), then B for C (if they prefer C over B), and finally paying to get back to A, ending up worse off. The standard solution is to enforce completeness, so the agent has strict preferences and avoids such cycles.

  The user's counterargument involves a resolute choice rule. The agent refuses any trade that leads to a dominated outcome when considering the entire sequence. So, even if individually each trade seems acceptable, the agent rejects the first trade because it knows accepting would lead to a net loss. The friend's objection is that this rule is ad hoc—designed just to avoid the pump without genuine justification.

  To support the user, I need to argue that the money-pump relies on an implicit assumption about choice rules: that decisions are made step-by-step without foresight. But rationality doesn't inherently require such myopic decision-making. A rational agent can plan ahead and use history to avoid pitfalls. The ad hoc objection might be misplaced because the rule isn't arbitrary; it's based on the principle of avoiding sure losses. 

  I should also address Gustafsson's arguments against resolute choice. He might say that such rules lead to dynamic inconsistency or other issues. However, the user can counter that dynamic inconsistency isn't irrational if the agent commits to a plan that maximizes overall outcomes. The key is distinguishing between per-step and overall rationality. 

  The user's deeper need is to defend the plausibility of incomplete preferences without conceding to money-pump arguments. They want to show that rationality doesn't demand completeness if agents can use smarter decision rules. Emphasizing that the burden is on proponents of completeness to justify the stepwise choice assumption could strengthen their case. Also, highlighting that resolute rules stem from coherence over sequences, not just single choices, might undermine the ad hoc accusation.
answer: |-
  Your skepticism is well-founded, and your proposed defense—using a history-sensitive, resolute choice rule—is a legitimate and philosophically robust challenge to the money-pump argument for completeness. Let's systematically dismantle the argument while engaging directly with your friend's strongest objection.

  ### The Core Problem: The Money-Pump's Hidden Assumption
  The money-pump (e.g., Career A [Clarinet] ≁ Career B [Law]) proceeds as:
  1. **Trade 1:** Offer B in exchange for A. *Since A ≁ B, the agent is indifferent → accepts.*
  2. **Trade 2:** Offer C (a strictly worse version of A, e.g., "Clarinet career with a $100 fee") in exchange for B. *If B ≻ C (plausible), the agent accepts.*
  3. **Trade 3:** Offer A in exchange for C plus a small payment. *If A ≻ C (true by definition), the agent pays to return to A.*  
  **Result:** Agent started with A, ended with A minus payment → exploited.

  **The argument implicitly assumes:**  
  > *"Rationality requires evaluating each choice myopically, in isolation, without considering the future sequence or past commitments."*

  This is **not a minimal requirement of rationality**—it's a substantive (and contestable) restriction on *how* an agent reasons across time.

  ### Your Defense: Resolute, History-Sensitive Choice
  An agent with incomplete preferences (A ≁ B) can adopt this rule:  
  > *"I will reject any trade that, when combined with trades I *foresee* being offered (or might accept later), results in a net loss compared to my current status quo. I track refused options to prevent exploitation."*

  **Applied to the pump:**  
  - **Trade 1 (B for A):** The agent knows accepting B enables Trade 2 (C for B) and Trade 3 (A for C + fee).  
    - Outcome: A → B → C → A-fee. **Net loss.**  
    - **Decision:** Reject Trade 1.  
  - Result: Pump defeated. No completeness required.

  ### Engaging Your Friend's Objection: "This is Ad Hoc!"
  Your friend claims this rule is "custom-built" and "question-begging." Here’s why that objection fails:

  1. **It's Not *Ad Hoc*; It's *Principle-Based*:**  
     The rule derives from a **core rational principle: Avoid sure losses**. If an agent *knows* a sequence leads to a dominated outcome (A-fee < A), refusing the first step is instrumentally rational. This isn't "invented to defuse pumps"; it's a general commitment to *global coherence* across decisions. Gustafsson's dismissal of "resolute choice" assumes that *dynamic inconsistency* (changing plans mid-sequence) is irrational. But your agent isn't inconsistent—it *commits* to a plan that maximizes outcomes. **Rationality permits foresight and precommitment.**

  2. **The Burden is on the Pump-Proponent:**  
     Money-pump arguments claim incompleteness *inevitably* leads to exploitation. Your defense shows this is false *unless* we add the extra premise that agents must evaluate choices atomistically. **Why must rational agents be myopic?** The pump proponent must justify this restriction. Without it, incompleteness is pragmatically viable.

  3. **Gustafsson's "Refutation" Misses the Mark:**  
     Gustafsson argues resolute agents may face "regret" or fail in more complex pumps. But:
     - **Regret ≠ Irrationality:** Feeling regret after avoiding exploitation (e.g., "I wish I took B!") doesn't imply error. The agent *correctly* avoided a net loss.
     - **Complex Pumps Assume Myopia:** Any multi-step pump relies on the agent not anticipating future choices. A resolute agent with foresight blocks *all* pumps at Step 1 by refusing trades enabling exploitation. History-tracking is a tool for this foresight.

  4. **Completeness Demands Are *Themselves* Ad Hoc:**  
     Insisting that rational preferences *must* rank every option is a drastic constraint. Why is "no opinion" on Law vs. Clarinet irrational? The money-pump only "works" if we *first* assume agents can't use sequential reasoning. **The pump argument doesn't *derive* completeness from minimal rationality—it presupposes a narrow decision theory.**

  ### Why Your Defense is Stronger
  - **Minimal Rationality Intact:** Your agent satisfies:  
    - *Non-exploitability*: Cannot be forced into a net loss.  
    - *Reflexivity* and *Transitivity* (where preferences exist).  
    - *Instrumental efficiency*: Achieves best feasible outcomes given its knowledge.  
  - **No Completeness Needed:** Gaps remain, but they're shielded from exploitation by coherent *procedural* rationality.  
  - **Realism:** Humans use history and foresight (e.g., "I shouldn't start bargaining if I'll be pressured into a bad deal"). Your agent formalizes this.

  ### Conclusion: The Money-Pump Fails as a *Necessity* Proof
  The argument shows that **myopic agents** with incomplete preferences are exploitable. But it doesn't show that **all rational agents** must be myopic. By adopting a resolute, history-aware choice rule—grounded in the principle of avoiding sure losses—an agent can maintain incomplete preferences *without* being money-pumped. Your friend's "ad hoc" objection conflates *principled global coherence* with circular defense. The true burden lies with pump proponents: they must justify why rationality forbids foresight and commitment across sequences. Until they do, completeness remains a convenience for decision theorists—not a mandate of reason.  

  This doesn’t refute coherence arguments entirely, but it fatally undermines the claim that completeness is *unavoidable*. Rational agents *can* inhabit a world with genuine preference gaps.
