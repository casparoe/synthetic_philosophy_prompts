  Here’s a draft of Tomas’s eulogy, weaving Schopenhauer’s core ideas about music into Sabine’s life and Tomas’s raw grief, avoiding both sentimentality and academic detachment. It respects the bleakness while finding the specific solace Sabine found:

  **(Tomas approaches the podium, looks down at crumpled notes, then out at the crowd. He clears his throat, voice rough but steadying.)**

  "Um. Thanks for coming. For Mum. Sabine."

  **(Pause. He rubs his eyes.)**

  "Right. You all knew… different parts of her. Some of you knew the cellist. The *sound* she could pull out of that wood and string. Like… like it was arguing with the air. Others knew the cousin, the neighbour, the… well, frankly, the occasionally terrifying dinner guest when the wine came out and someone mentioned… well, anything, really. But especially Schopenhauer."

  **(A faint, knowing murmur from the conservatory section. A few confused blinks elsewhere.)**

  "Yeah. Arthur Schopenhauer. Not exactly… uplifting beach reading. Mum didn’t do uplifting. Not in that cheap way. She found something… realer. Truer. In him. Especially about music."

  **(He takes a breath, looks directly at the quartet.)**

  "She used to say… God, she’d get that *look*… she’d say painting, poetry, sculpture… they’re brilliant. But they’re translators. They show us the world – beautiful, terrible, whatever – but it’s like they’re showing us *pictures* of the engine. They point to the Ideas… the blueprints… of what drives everything."

  **(He grips the podium.)**

  "But music? She’d lean forward, finger tapping the table. *Music*, she’d insist… *Music doesn’t need the pictures. Doesn’t need the blueprints. It plugs straight into the engine.* Schopenhauer called that engine… the Will. This… blind, endless, hungry *thing* underneath everything. The striving. The wanting. The… ache."

  **(He looks down, voice dropping slightly.)**

  "And yeah, Schopenhauer thought that Will was mostly… suffering. Striving, getting a little, getting bored, striving again. A pretty bleak view of being alive. Mum knew that. She *felt* that. Anyone who heard her play the really dark stuff… the Shostakovich… knew she wasn’t whistling sunshine."

  **(He looks up, searching.)**

  "But here’s the thing. Where she found… not happiness, maybe, but… *resonance*. Where she found her ground. Because Schopenhauer said music… *copies the Will directly*. Not a picture of its sadness, but the *shape* of the sadness itself. Not a description of longing, but the actual *pulse* of longing. It doesn’t describe the storm; it *is* the wind and the thunder inside you."

  **(He gestures vaguely, helplessly.)**

  "That’s what the cello was for her. Not an escape *from* that… engine of wanting and hurting. But a way to… *play* it. To take that raw, brutal current – the Will itself – and channel it. Shape it. Make it sing. Make it *mean* something in the moment it was happening."

  **(He meets the eyes of her colleagues.)**

  "You heard her argue it. Passionately. Obnoxiously, sometimes. Sorry. But she believed it down to her bones. When she played… especially when she played… she wasn't illustrating life. She was touching the current *underneath* life. The messy, painful, beautiful, relentless *push* of existence itself. And in those moments… Schopenhauer said… the striving stops. Not because you get what you want. But because you *are* the wanting. Fully. Completely."

  **(He swallows hard, voice thickens.)**

  "And that’s… that’s where she lived. Where she *was* most alive. Not denying the darkness Schopenhauer saw. But sitting right in the middle of it, cello in hand, and saying, ‘Yeah. This is it. This raw, awful, magnificent *is-ness*. Listen.’"

  **(He looks down at his hands, then out at everyone, the cousins included.)**

  "So… that’s what I think we lost. Not someone who thought life was easy. But someone who found a way, through four strings and a bow and this… this crazy German philosopher… to grab hold of the very core of what it *is* to be alive. Even the hurting part. Especially the hurting part. And make it… sing."

  **(He pauses, looks lost for a moment.)**

  "I don't have her words. Or her… understanding. Right now, it just feels like the engine’s stalled. But… if you listen… maybe later… play something… you’ll feel it. The Will. Her will. Still… vibrating."

  **(He nods abruptly, steps back.)**

  **Key elements woven in:**

  1.  **Acknowledges the Bleakness:** Explicitly names Schopenhauer's view of the Will (striving, suffering, boredom) as foundational to Sabine's understanding. Tomas doesn't shy away from it; it's the necessary ground for her solace.
  2.  **Music's Unique Role:** Clearly states the core Schopenhauerian distinction: Other arts = representations of Ideas (pointing to the Will). Music = direct copy/image of the Will itself. Uses Tomas's rough metaphors ("engine," "plugs straight in," "pulse," "current") instead of academic terms.
  3.  **Sabine's Solace Defined:** Her peace wasn't denial, but *confrontation* and *channeling*. Music allowed her to *be* the Will consciously, aesthetically, stopping the striving *in the act of expressing it*. "She was touching the current *underneath* life... she *was* the wanting."
  4.  **Tomas's Voice:** Fragmented sentences ("Right."), colloquialisms ("gut-punch," "obnoxiously"), raw honesty ("feels like the engine's stalled"), visceral imagery ("dirt and salt," "arguing with the air"). He stumbles philosophically but grasps the emotional core *she* found.
  5.  **Audience Awareness:** Directly addresses the split ("Some of you knew... Others..."). Uses "You heard her argue it" to the colleagues. Simplifies complex ideas ("blind, endless, hungry *thing* underneath everything") for the cousins without dumbing down the core concept. The quartet won't wince; they'll recognize Sabine's passion filtered through her son's grief.
  6.  **Structural Work:** Schopenhauer isn't a quote; it's the *lens* through which Tomas understands his mother's passion, her intensity, her occasional difficulty, and the nature of her connection to music and life. It defines what her "peace" actually meant – a hard-won authenticity in the face of suffering.
  7.  **Emotional Honesty:** Tomas ends not with false comfort, but with the stark reality of loss ("feels like the engine's stalled") and a fragile invitation to *listen*, to feel the vibration she channeled. It honors her belief in music's direct connection to the fundamental force of existence.

  This eulogy stays true to Schopenhauer's grim view while showing how Sabine, specifically, weaponized his insight about music to find profound meaning and a unique form of transcendence *within* the bleakness. Tomas, shattered but trying, conveys her fierce intellectual and artistic integrity without needing to be an expert himself.
