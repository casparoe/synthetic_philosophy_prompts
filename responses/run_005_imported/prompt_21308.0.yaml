prompt: |-
  Had a long one with my friend Priya last night about split-brain patients that basically ate our whole dinner. She's fully convinced that after a callosotomy you've got two separate subjects of experience running around in one skull, all the time, and not just as some artifact of the tachistoscope experiments where they flash a word to one visual field. I kept pointing out that these patients button their shirts and hold conversations totally seamlessly outside the lab, which has to count against there being two full subjects instead of one (admittedly weird) one, and she just kept saying thats cross-cueing and redundant sensory input papering over the divide. Neither of us budged, and I went to bed kind of annoyed that her position felt unfalsifiable and I couldn't quite say why.

  Anyway, I run a little philosophy podcast on the side and I've got someone booked next month who basically holds Priya's view -- doesn't have to be a real named person, feel free to just invent a philosopher who defends it -- that callosotomy patients are two numerically distinct subjects of experience even in ordinary, non-testing life, not merely two processing streams under one subject. I don't want the episode to just be him restating the thesis for ten minutes, I want to actually press on it. Can you draft me 8-10 interview questions, with at least one that goes after the cross-cueing/redundant-input explanation for everyday unity, one that brings up Nagel's old point that our normal concept of "how many minds" might just not have a determinate answer here (so why is "two" the right count rather than "one, weirdly" or "indeterminate"?), and one that just asks him straight out what evidence would actually change his mind, since so far every counterexample seems to get absorbed. For each question throw in a quick follow-up keyed to whatever answer he's most likely to give -- the annoying comeback he'd reach for -- so I'm ready for it instead of just nodding along.
