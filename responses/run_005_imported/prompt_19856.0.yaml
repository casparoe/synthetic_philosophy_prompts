  We are setting a dialogue between a substantivalist (Sub) and a relationist (Rel) about spacetime, in the context of the hole argument. The substantivalist has retreated from naive manifold substantivalism to sophisticated substantivalism. The relationist will press on whether this leaves substantivalism with any content beyond relationism. They engage in a detailed, non-talking-past exchange.

  Setting: A philosophy of physics conference during a coffee break.

  Characters:
  - Sub: A sophisticated substantivalist.
  - Rel: A relationist.

  Dialogue:

  Rel: So, I hear you've moved from naive substantivalism to what's now called sophisticated substantivalism in light of the hole argument. That's interesting. But I'm wondering: what's left of substantivalism after this move? It seems to me that by accepting that diffeomorphic models represent the same physical situation, you've given up the very thing that defined substantivalism: the independent reality of spacetime points.

  Sub: Not quite. I still maintain that spacetime is a real, mind-independent entity. What I've given up is the idea that spacetime points have primitive identities — their haecceities. Instead, I hold that the identity of points is fixed by the metric structure. So, when we apply a diffeomorphism, we're just re-labeling the points without changing the physical reality, because the structure is what matters.

  Rel: But if the points don't have any identity beyond what the metric structure gives them, then isn't your spacetime just the metric structure? And that's exactly what I, as a relationist, believe: spacetime is nothing over and above the spatiotemporal relations between events. So, it seems we agree.

  Sub: No, because I still hold that spacetime is a substance, a container that exists independently of the material content. The metric field is a physical field that exists in spacetime. In my view, even in the absence of matter, there would be spacetime with its metric structure. That's the key difference.

  Rel: But in general relativity, the metric is a dynamical field. It's not a fixed background. So, if you say that the metric is part of the container, then the container is changing. How is that different from the relationist view that the metric field is just the set of relations between events?

  Sub: The difference lies in ontology. For me, spacetime points are real entities that are the bearers of properties, such as the metric field. But they are not individuated independently of the metric. So, for example, in the hole argument, when we shift the metric and matter fields by a diffeomorphism within the hole, we are not creating a new physical situation because the points in the hole are not identifiable except via the metric. But without the metric, there are still points — they just aren't individuated.

  Rel: That sounds puzzling. How can there be points that are not individuated? If they are not individuated, then how can we say they exist as distinct entities? It seems like you are saying that the points are only distinguished by the structure, which is exactly what I would say. But then, why posit the points at all? Why not just say that the structure exists, and that's spacetime?

  Sub: Because without the points, what are the fields defined on? The fields are functions from the manifold to some value space. So the manifold is necessary as the domain of these functions.

  Rel: But if the manifold is only characterized up to diffeomorphism, then it's the equivalence class of manifolds under diffeomorphisms that matters. And that equivalence class is determined by the metric and other fields. So again, it's the structure that's real, not the underlying manifold points. You seem to agree that the manifold points have no identity beyond the structure. So why not eliminate them?

  Sub: Because the manifold provides the continuity and the topology that underlies the metric. Even without a metric, we have a topological space. And that topological space is real.

  Rel: But in general relativity, the topology is fixed and the metric is defined on it. However, if you accept that the points are only individuated by the metric, then how can you have a topology without a metric? If the points are not individuated without the metric, then the topology itself must be defined by the metric. So again, the metric is primary.

  Sub: Let me clarify. In sophisticated substantivalism, the spacetime is a manifold equipped with a metric. The manifold without the metric is not physically meaningful. But the manifold is still there as the underlying set of points. The points exist, but they are not physically distinguishable without the metric. So, the manifold is not just an abstract set — it has a topology, which is a set of open sets that define continuity. This topology is part of the spacetime structure.

  Rel: But if the topology is fixed independently of the metric, then what happens if we consider two metrics that are not related by a diffeomorphism? Then we have two different spacetimes. But in the hole argument, we are only considering diffeomorphisms, which preserve the topology. However, if the topology is fixed, then even in the absence of the metric, the manifold has a topology. How do you know what the topology is without the metric?

  Sub: The topology is specified as part of the model. In the standard formulation of general relativity, we start with a smooth manifold, which includes a topology and a smooth structure, and then we add a metric. So, the topology is prior.

  Rel: But if the points are not individuated without the metric, then how can we say that the topology is fixed? The topology is a structure on the set of points. But if the points are not individuated, then the topology isn't fixed either. It seems that the entire manifold structure — topology and smoothness — must be defined by the metric.

  Sub: I see your point. But let me try a different approach. Consider a model of general relativity: (M, g, T), where M is the manifold, g the metric, and T the stress-energy tensor. A diffeomorphism φ: M → M gives a new model (M, φ*g, φ*T). Sophisticated substantivalism says that (M, g, T) and (M, φ*g, φ*T) represent the same physical situation. So, the physical spacetime is the equivalence class of such models under diffeomorphisms. But note that the manifold M is still part of the model. It's just that we are quotienting by the diffeomorphisms. So, the manifold is still there.

  Rel: But if you are quotienting by diffeomorphisms, then the physical reality is the equivalence class. And in that equivalence class, the manifold M is not fixed — because you can have two different manifolds that are diffeomorphic? Actually, no: in the hole argument, we are considering the same manifold with different metrics. But when we quotient, we are saying that the physical spacetime doesn't care about the particular labeling of points. So, what is physical is the metric and matter fields up to isometry. And that is what I, as a relationist, would call the spacetime.

  Sub: But note that the manifold is still present in the description. The equivalence class is over models that share the same manifold. So, the manifold is part of the representation.

  Rel: But if the manifold is only defined up to diffeomorphism, then what is the physical significance of the manifold? Why not just say that the physical spacetime is the metric structure? That is, a Lorentzian manifold up to isometry? Then we don't need the manifold as an independent entity. We can think of the metric as defining both the geometry and the topology. In fact, in general relativity, the metric determines the topology (for connected manifolds). So, the manifold is dispensable.

  Sub: But how do you account for the possibility of different topologies? For example, we can have a flat metric on a torus or on R^4. The metric alone doesn't fix the topology.

  Rel: That's true. But in that case, the global topology is part of the structure that is fixed by the entire model. So, the physical spacetime has a topology, but that topology is not given by an underlying manifold of points with haecceities. Instead, it's a feature of the relational structure. For me, spacetime is the whole structure of events and their spatiotemporal relations. The topology and the metric are both aspects of that structure.

  Sub: But what are events? In my view, events are points in spacetime. So, spacetime is the container for events.

  Rel: And I say that events are the basic entities, and spacetime is the set of relations among them. We don't need a container.

  Sub: But without the container, how do you account for the possibility of empty space? If there are no events, then there are no relations, so you would say there is no spacetime. But I say there is spacetime even without matter.

  Rel: That's a classic point. But in general relativity, without matter, we still have the metric field. So, if we consider the metric as a physical field, then it provides the relations. But if we remove the metric too, then we have nothing. So, I would say that without any physical fields, there is no spacetime. But that doesn't mean spacetime is unreal. It just means that spacetime is constituted by physical fields. In particular, by the metric field.

  Sub: But then the metric field is a field on what? It must be a field on some domain. That domain is spacetime.

  Rel: Not necessarily. We can think of the metric field as a relational structure among events. The events are the basic constituents. The metric assigns intervals between them. So, the domain of events is prior, but events are not points in a container; they are the relata of the spatiotemporal relations.

  Sub: But what are events? How do you individuate events? In my view, events are located at spacetime points. So, without spacetime points, how do you individuate events?

  Rel: Events are individuated by their physical properties and relations. For example, two events might be the collision of two particles and the emission of a photon. They are distinct because they have different physical characteristics and stand in different relations to other events.

  Sub: But without spacetime, how do you define the relations? You need spacetime to define the spatiotemporal relations.

  Rel: That's circular. I don't think so. The spatiotemporal relations are primitive in my view. They are part of the fundamental structure of the world.

  Sub: But then how do you account for the continuity of spacetime? For instance, the real line structure of time?

  Rel: I can say that the set of events has a topological and differential structure that is given by the relations. For example, we can define neighborhoods by the metric relations.

  Sub: But that seems to require that the relations are already spatiotemporal. You are presupposing the very thing we are trying to explain.

  Rel: Not necessarily. We can start with causal relations, as in causal set theory, and build up the spacetime structure. But even without that, in general relativity, we can take the metric as fundamental and define the events as the points of the manifold, but without giving the manifold any independent reality. The manifold is just a way to label events.

  Sub: So, in your view, the manifold is just a mathematical representation?

  Rel: Exactly. It's a convenient tool for representing the physical relations, but it's not part of the ontology.

  Sub: But then, what is the difference between your view and mine? I say that the manifold is real, but the points are not individuated without the metric. So, the physical reality is the manifold with the metric structure, and the metric structure is what gives the points their identity.

  Rel: But if the points are not individuated without the metric, then the manifold without the metric is not physically real. So, when you say the manifold is real, you only mean it as equipped with the metric. So, we both end up saying that the physical spacetime is the metric structure. The only difference is that you call the underlying set of points real, but then you say they have no identity without the metric. That seems like a distinction without a difference.

  Sub: Perhaps it is a subtle difference. But I think it matters for how we think about possibilities. For example, consider a world with the same metric structure but a different topology. In my view, that is a different spacetime. But if you reduce spacetime to the metric structure, then a change in topology would be a change in the metric structure because the metric determines the topology (in connected manifolds). But if we consider a disconnected manifold, then the metric might be the same on each component, but the topology is different. How would you handle that?

  Rel: In that case, the metric structure would be the same locally, but globally different. So, I would say that the global topology is part of the structure. So, two spacetimes with the same metric but different topologies are different. But note that in this case, the set of events is different because the global structure is different. So, I don't have a problem.

  Sub: But in your relational view, what are the events? If the topology is different, then the set of events is different. But then events are not basic because they depend on the global structure.

  Rel: Events are basic, but the relations among them include global relations. So, the identity of events is tied to the entire relational structure.

  Sub: That sounds a lot like what I said: the identity of points is fixed by the entire metric structure.

  Rel: So, we seem to be converging. But then, what is the residual disagreement?

  Sub: Maybe it's about whether spacetime can exist without any events. Suppose we have a spacetime with a metric but no matter fields. I would say that spacetime exists. Would you?

  Rel: Yes, because the metric field is a physical field. So, there are events — namely, the points at which the metric is defined. But these events are not material; they are just the loci of the metric field.

  Sub: So, you do have events even in empty spacetime?

  Rel: Yes. The metric field is a physical entity, so it requires events to be instantiated.

  Sub: Then we agree that there can be empty spacetime. And we agree that the identity of events (or points) is fixed by the metric structure. So, what's the difference?

  Rel: The difference is in the fundamental ontology. You say that spacetime is a substance that has properties, such as the metric. I say that spacetime is the network of relations among events, and the metric is the set of those relations. So, I don't posit a substance over and above the relations.

  Sub: But if you have events as the relata, then events are the substances. So, you have a substance ontology too.

  Rel: Not necessarily. I can take events as property-instances or as nodes in a graph without thinking of them as substances. They are not bearers of properties in the same way. The properties are the relations.

  Sub: This is getting metaphysical. Maybe the difference is indeed verbal.

  Rel: Or perhaps it's about the independence of spacetime. You might say that spacetime could have been different even if the relations were the same, but you've given up haecceities, so you don't say that.

  Sub: Right. I don't. So, perhaps we are in agreement. But I still feel that there is a difference. Maybe it's about the mathematical representation. In the formalism, the manifold is part of the model, and that reflects an ontological commitment.

  Rel: But if you accept that the physical reality is the model up to diffeomorphism, then the manifold is not physically real; only the diffeomorphism equivalence class is.

  Sub: But the equivalence class is a class of manifold-plus-metric structures. So, the manifold is still part of it.

  Rel: But if two manifolds are diffeomorphic, they represent the same physical spacetime. So, the manifold itself is not uniquely real; it's the structure type.

  Sub: I see. So, we might be forced to conclude that sophisticated substantivalism and relationism are equivalent.

  Rel: Or at least, the hole argument has pushed substantivalism so far that it collapses into relationism.

  Sub: Or vice versa? Maybe relationism has evolved to incorporate the metric field as a fundamental entity, making it similar to substantivalism.

  Rel: That's the moral of the hole argument: the two views are not as distinct as we thought.

  Sub: So, perhaps the debate is over. But I suspect there are still nuances. For example, how do we handle quantum gravity? If spacetime is emergent, then my substantivalism might be challenged.

  Rel: And my relationism might be more adaptable. But that's a topic for another day.

  Sub: Indeed. Let's get more coffee.

  Rel: Agreed.
answer: |-
  ### Dialogue: Sophisticated Substantivalism and Relationism after the Hole Argument

  **Setting:** A quiet corner in a philosophy of science conference lounge. Two scholars, **Sub** (a sophisticated substantivalist) and **Rel** (a relationist), are debating spacetime ontology. They’ve just attended a talk on the hole argument in general relativity and are now hashing out its implications. The hole argument—which shows that if spacetime points have primitive identities (haecceities), then diffeomorphisms (smooth, invertible remappings of points) generate physically distinct but empirically indistinguishable models—hangs heavy in the air. Sub has conceded that models related by such diffeomorphisms represent the same physical possibility and that points lack haecceities. But Sub insists spacetime is still real and mind-independent. Rel is skeptical that this leaves substantivalism with any unique content.

  ---

  **Rel:** That talk really sharpened the hole argument. You used to be a manifold substantivalist—believing spacetime points exist independently and have primitive identities. But now you’ve retreated: you agree that shifting the metric and matter fields via a diffeomorphism in some "hole" region doesn’t change the physical world. Points aren’t individuated primitively; their identities depend entirely on the metrical structure. So, what’s left of substantivalism? It sounds like you’ve collapsed into relationism—where spacetime is just a web of relations between events, not a thing in itself.

  **Sub:** Not at all. I still hold that spacetime is a real, substantial entity—a mind-independent container. What I’ve given up is the claim that points have haecceities. But spacetime itself isn’t reducible to relations. It’s the bearer of the metric field. Think of it this way: in general relativity, we model spacetime as a manifold \(M\) with a metric \(g_{\mu\nu}\). Diffeomorphisms map \(M\) to itself, dragging \(g\) along. Sophisticated substantivalism says that \((M, g)\) and \((M, \phi^*g)\) represent the same physical spacetime for any diffeomorphism \(\phi\), because the points are only individuated *by* \(g\). Without \(g\), the manifold is a bare set of points with no physical identity. But \(M\) is still real—it’s the underlying substance that hosts the fields.

  **Rel:** But if the points have no identity except through the metric, then spacetime *just is* the metric structure. And that’s precisely what relationism says: spacetime is nothing beyond the spatiotemporal relations encoded in \(g\). You’ve stripped points of haecceities, so diffeomorphic models are physically identical—fine. But now, when you say "spacetime is real," all you mean is that the metrical relations are real. That’s relationism! What extra content does your "substance" add?

  **Sub:** The substance is the domain over which the relations are defined. Relationism reduces spacetime to the relations themselves—as if you could have relations without relata. But fields like \(g_{\mu\nu}\) are properties *of* spacetime points. Points are the substratum. In a matter-free universe, spacetime still exists as a substance, even if the metric is flat and featureless. You relationists deny that—you’d say no relations, no spacetime.

  **Rel:** Ah, the classic "empty space" argument. But in GR, the metric *is* a physical field, so "empty" space still has \(g_{\mu\nu}\) providing relations. I’d say spacetime is the total relational structure defined by \(g\) and any matter fields. Events—like intersections of particle worldlines—are the relata, and spacetime is the pattern of intervals between them. No need for a container. But you’ve conceded so much that your view now sounds identical: you say points are individuated by \(g\), so "spacetime" is just a label for the metric’s relational network. Where’s the substance?

  **Sub:** Let me clarify. Sophisticated substantivalism treats spacetime as a structured entity: a manifold \(M\) equipped with \(g\), but with the physical content captured by the equivalence class under diffeomorphisms. The manifold isn’t dispensable—it provides the topological and differential structure that makes continuity, dimensionality, and locality possible. For example, consider two models: one with \(g\) and another with \(\phi^*g\). They share the same manifold \(M\), and we say they represent identical physics. But \(M\) itself is part of the ontology. It’s real, even if its points are only discernible via \(g\).

  **Rel:** But if \(M\) is only "discernible via \(g\)," then \(M\) adds nothing beyond \(g\). The topology and differential structure are *determined* by \(g\) in GR—for instance, the metric defines causal structure, which fixes the topology (modulo global issues like exotic smoothness). So, when you quotient out diffeomorphisms, the physical reality is just the isometry class of \((M, g)\). That’s a set of relations. Relationism can accommodate this easily: events and their spatiotemporal relations are primitive, and diffeomorphisms are just redescription. You’ve kept the label "substance," but it’s doing no work.

  **Sub:** It does work in modal contexts. Suppose we imagine a world with the same metric relations but a different global topology—say, flat spacetime on \(\mathbb{R}^4\) versus a torus. Sophisticated substantivalism says these are distinct physical possibilities because the manifolds aren’t diffeomorphic. The substance—the manifold—grounds this difference. Relationism struggles here: if spacetime is just relations, how do you account for global topology without a prior domain? You’d have to treat the topology as a brute feature of the relations, but then it’s parasitic on the underlying space.

  **Rel:** Not at all. Relationism can say the set of events itself has a topological structure defined by the relations. For example, in causal set theory, spacetime emerges from a discrete partial order of events. No manifold needed. In smooth GR, the metric relations fix the topology, so \(\mathbb{R}^4\) and the torus differ because their relational structures are globally distinct—they’re not isometric. No appeal to a "container." Your substantivalism, by making the manifold prior, risks ontological excess: why posit points that are indiscernible without \(g\)? That’s like positing "bare particulars" that are always clothed—pointless (pun intended).

  **Sub:** But without the manifold as substance, what are the events? You relationists take events as primitive, but events are localized in spacetime. If spacetime isn’t real, events float in a void. My view avoids this: events are properties instantiated at spacetime points. Points are the bearers. And in sophisticated substantivalism, we don’t have bare particulars—points are individuated relationally *via* \(g\), but they’re still real entities. Think of it as structural realism about spacetime: the points exist, but their identities are structurally determined.

  **Rel:** Now we’re circling back. If identities are structurally determined, then the structure is primary. Relationism holds that the relations are fundamental, and "events" are just nodes in that relational network. You’re adding a layer—points as substratum—but then saying the structure individuates them. That’s redundant. And your "structural realism" sounds identical to what I’d call metric relationism. For instance, both our views would say that Leibniz shift arguments fail because points lack haecceities—there’s no difference between "shifting" the universe or not. So, is our disagreement just verbal?

  **Sub:** Perhaps partially. But consider ontology: substantivalism takes spacetime as a basic entity, while relationism takes spatiotemporal relations as basic. That’s a categorical difference. In a quantum gravity context, if spacetime emerges from non-spatiotemporal entities, relationism adapts naturally—relations all the way down. Substantivalism might struggle. But in classical GR, sophisticated substantivalism captures the idea that spacetime is an independent existent, even if its points aren’t primitive. Relationism can’t say that—it’s ontologically reductive.

  **Rel:** But you’ve reduced it so much that "independent existent" is vacuous. If spacetime is only identifiable via the metric, and the metric is relational, then spacetime is relational. You’ve just relabeled relationism. Look: we both agree that diffeomorphic models are physically equivalent (hole argument resolved). We both deny haecceities. We both say the metric structure is physical. The only difference is that you call the domain of that structure a "substance," but if it’s structure-dependent, it’s not substantival in the traditional sense. Why not call it quits and admit relationism wins?

  **Sub:** Because I think the domain matters. In the hole argument, the manifold \(M\) is fixed across diffeomorphic models—it’s the stage, even if the actors (fields) define the action. Relationism has no stage; it’s all actors. That shows up in how we interpret gauge freedom: in substantivalism, diffeomorphisms are gauge because they redraw labels on a fixed substance. In relationism, they’re gauge because they redescribe relations. But the former view preserves spacetime as a fundamental entity. Still, I’ll concede this: if the only disagreement is whether we call the relational network a "substance" or not, it might be verbal. But I think there’s a residual issue about fundamentality.

  **Rel:** Fair. Let’s test fundamentality. Imagine a world with only a metric field—no matter. Sophisticated substantivalism says spacetime exists as a substance hosting \(g\). Relationism says spacetime *is* the relational structure of \(g\). Empirically identical, but ontologically, you posit an extra entity: the manifold as substratum. But if the substratum is indiscernible except through \(g\), Occam’s razor slices it away. Your "substance" is a metaphysical dangler.

  **Sub:** Or your "relations" are ungrounded without relata. We’re at an impasse. Maybe the lesson of the hole argument is that spacetime ontology isn’t as binary as we thought. Sophisticated substantivalism isn’t manifold substantivalism—it’s a third way, close to relationism but retaining realism about spacetime as an entity. For now, I’ll stick with that. But I’ll grant that if you can show how relationism handles global structure without smuggling in a container, we might be closer than I thought.

  **Rel:** And I’ll admit your view isn’t naive substantivalism—it’s a defensible middle ground. But I still think "sophisticated substantivalism" is just relationism in disguise. Another coffee? We can debate whether quantum gravity breaks the tie.

  **Sub:** Agreed. Let’s caffeinate and continue.

  ---

  **Key Points Engaged:**  
  - **Substantivalist retreat:** Sub abandons haecceities and accepts diffeomorphic equivalence (hole argument resolution), but retains spacetime as a real, non-reducible entity.  
  - **Relationist pressure:** Rel argues that this collapses substantivalism into relationism, as spacetime adds nothing beyond the metric structure.  
  - **Specific moves:**  
    - Sub’s appeal to the manifold as the domain for fields (e.g., empty space).  
    - Rel’s counter that fields/relations define their own relata (events).  
    - Sub’s modal argument (global topology) vs. Rel’s structural rebuttal.  
    - Ontological debate: substance vs. relations, with Sub claiming a categorical difference and Rel seeing redundancy.  
  - **Non-refutability:** Neither side "wins"—Sub’s sophisticated view avoids hole argument pitfalls while preserving realism, but Rel questions if it’s distinct. The dialogue ends with unresolved tension over fundamentality and verbal differences.
