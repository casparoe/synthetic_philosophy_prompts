     - Heyting formalized intuitionistic logic and provided the BHK (Brouwer-Heyting-Kolmogorov) interpretation, which explains logical connectives in terms of proofs/constructions.
     - Departure: Brouwer was critical of formalization because he saw logic as secondary to the intuitive mathematical activity. Formalizing the logic risks putting the cart before the horse. Also, BHK is a semantic explanation but still uses language (which Brouwer wanted to avoid).

