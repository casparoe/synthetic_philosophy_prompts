    "B": ["Martin-Löf's intuitionistic type theory"],
    "C": ["Bishop's program of constructive analysis"],
    "D": ["Markov's constructive recursive mathematics (the Russian school)", "Dummett's meaning-theoretic (anti-realist) justification of intuitionistic logic"]
  }
  ```
