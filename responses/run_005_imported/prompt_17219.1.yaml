answer: |-
  Here’s a dialogue between two evolutionary biologists, Dr. Elena Aris (pluralist, Gould/Lewontin tradition) and Dr. Samuel Reed (adaptationist, Maynard Smith tradition), debating the testability of adaptationist claims using the human chin as a case study. The dialogue incorporates methodological, empirical, and explanatory dimensions of adaptationism (à la Godfrey-Smith).

  ---

  **Setting:** Coffee room at an evolutionary biology conference. Whiteboard in the corner.

  **Characters:**  
  - **Dr. Elena Aris:** Sharp, precise, gestures with her coffee cup. Favors developmental constraints and drift.  
  - **Dr. Samuel Reed:** Energetic, leans forward when making points. Thinks optimality models are the best toolkit for generating hypotheses.  

  ---

  **Reed:** (Sighs, pointing at conference program) Another talk dismissing optimal foraging models as "just-so stories." Elena, you’ve worked on seabird provisioning—surely you see the predictive power? We *test* hypotheses: if prey density drops, handling time should decrease. If it doesn’t, we reject the model!  

  **Aris:** Sam, I’ve watched redshanks optimize their intake rates for decades. But Gould and Lewontin’s point isn’t that *no* traits are adaptive. It’s that assuming *every* trait is an optimal adaptation blinds you to alternatives. Take the human chin. Classic spandrel: no selection *for* the chin itself. It’s a byproduct of jaw reduction and dental alveoli recession.  

  **Reed:** (Leans in) And that’s untestable? Hardly! If the chin is non-adaptive, we’d predict:  
  1. No functional advantage conferred by chin shape/size.  
  2. No heritable variation in chin morphology affecting fitness.  
  3. Developmental evidence of automatic chin formation via growth fields.  

  **Aris:** (Raises eyebrow) But that’s the adaptationist framework talking! You’re demanding evidence *against* adaptation as the null hypothesis. Why isn’t *non-adaptation* the null?  

  **Reed:** Because selection is the only force that *builds* complex function! Drift and constraints erase or limit variation—they don’t create functional design. Methodology 101: assume the simplest force that *can* explain the trait.  

  **Aris:** Ah, Peter Godfrey-Smith’s distinction! You’re conflating *methodological* adaptationism ("assume selection first to test it") with *empirical* adaptationism ("most traits *are* adaptations"). The chin isn’t "complex function"! It’s a bony bump. Why *assume* it was selected?  

  **Reed:** Fine, let’s get empirical. Prediction: if chins are adaptive, variation should correlate with fitness. Example: robust chins might signal testosterone, enhancing mate choice. We can test that!  

  **Aris:** And if you find a weak correlation? Adaptationists call it "residual selection" or invoke unseen trade-offs. That’s the "just-so" escape hatch! Meanwhile, the developmental hypothesis *directly* predicts chins emerge predictably during ontogeny without selection.  

  **Reed:** Show me the evidence!  

  **Aris:** Gladly. Embryological studies show the chin forms where the two halves of the mandibular arch fuse. When humans evolved smaller jaws but retained tooth size, the bone below the teeth protruded—automatically. No selection needed.  

  **Reed:** But why isn’t it *reduced* by selection if it’s non-functional? And why do chins vary so much?  

  **Aris:** (Moves to whiteboard, sketches) Because variation might be neutral! If chin morphology doesn’t affect fitness, drift can act freely. Your mate-choice hypothesis? Cross-cultural studies show chin attractiveness isn’t universal. Some groups prefer pointed chins, others square—no consistent fitness signal.  

  **Reed:** (Eyes gleaming) Aha! But if chins are purely developmental byproducts, their variation should be tightly correlated with overall mandibular shape—no independent evolvability. Yet we see chins changing independently in hominins! *Homo sapiens* have prominent chins; Neanderthals didn’t. Why would a spandrel evolve directionally?  

  **Aris:** Because jaw size reduced faster than dental alveoli! It’s a passive consequence of selection acting elsewhere. As for independent evolution—chin prominence correlates with facial retraction across species. Constraint and selection *interacting*.  

  **Reed:** So test this: if chin variation is neutral, its genetic variance should match neutral expectations. Run a QTL study on chin morphology vs. mandible shape. If chin-specific loci pop up, that’s evidence for independent selection!  

  **Aris:** (Nods) Now *that’s* a test I’ll accept! But you must also test the null: if chin QTLs are always linked to mandible development genes, that supports constraint. And crucially, measure selection strength. If chin size has a selection coefficient near zero, drift wins.  

  **Reed:** Fair. But if we find chin shape affects bite force efficiency or speech—  

  **Aris:** —Then we confirm adaptation. Pluralism isn’t *denying* adaptation, Sam. It’s demanding that you *rule out* non-adaptive forces before claiming it. Optimality models work for foraging because function is obvious. For chins? The burden of proof is on adaptationists.  

  **Reed:** (Sips coffee, thoughtful) So your gripe is with *explanatory priority* adaptationism—the idea that adaptation is the *only* important explanation. But methodologically, starting with an optimality model generates precise, falsifiable predictions. Even for chins!  

  **Aris:** Only if the trait’s function is plausible. Assuming a chin is "for" something is the problem. Start with development, phylogeny, and variation structure first—*then* test selection. Otherwise, you risk confirmation bias.  

  **Reed:** Point taken. But promise me: if that QTL study finds chin-specific loci under selection, you’ll concede the chin might be an adaptation?  

  **Aris:** Only if effect sizes are meaningful, and you control for correlated traits. Deal?  

  **Reed:** (Grins) Deal. Now, about those shorebird models—let’s design a test where developmental constraints *and* selection interact...  

  ---

  ### Key Points Hashed Out:
  1. **Testability:** Both agree tests exist (e.g., QTL + selection coefficients), but dispute the *default null hypothesis* (Aris: drift/constraint; Reed: selection).  
  2. **Godfrey-Smith’s Framework:**  
     - *Methodological:* Reed defends using optimality models as heuristic tools.  
     - *Empirical:* Aris challenges the claim that "most traits are adaptations."  
     - *Explanatory Priority:* Reed argues selection is the primary driver; Aris insists drift/constraints deserve equal billing.  
  3. **Evidence for Chin Case:**  
     - *Pro-Adaptation:* Independent evolution in hominins, potential functional links (bite force, mate choice).  
     - *Pro-Spandrel:* Embryology, lack of universal fitness correlates, covariation with jaw traits.  
  4. **Resolution:** Rigorous tests require disentangling selection from drift/constraints via:  
     - Genetic architecture (e.g., QTLs)  
     - Selection differentials  
     - Developmental pathways  

  Both characters hold their ground but converge on test design—exactly as you requested. The dialogue forces them to move beyond slogans into the weeds of chin genetics, selection metrics, and the philosophy of hypothesis-testing.
