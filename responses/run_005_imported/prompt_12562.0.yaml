answer: |-
  Here’s a eulogy draft that honors your aunt’s wisdom while balancing clarity and warmth. It runs about 4.5–5 minutes when spoken slowly:

  ---

  ### Eulogy for [Aunt's Name]

  Good morning. When I think about what made [Aunt’s Name] so extraordinary—her warmth, her fierce intelligence, her ability to sit with people in their hardest moments—I keep coming back to a conversation she loved to have. It usually started late at night, maybe a glass of wine in hand, often right here in her living room.  

  Some of you knew her as a gifted grief counselor. Others knew her as the host of what she jokingly called her "Socratic salon"—that decades-long reading group where she wrestled with philosophy, especially her beloved Wittgenstein. And if you ever talked with her about both those worlds, you’d hear her light up about one idea in particular.  

  She’d say: We often talk about grief as if it’s this utterly private thing—locked away inside us, impossible to share. We say things like, "No one can ever truly know another person’s pain." But [Aunt’s Name] believed that line of thinking wasn’t just unhelpful—it was *wrong* in a way that made healing impossible.  

  She put it like this: If grief were truly private—if my sadness was *only* mine, and yours *only* yours, with no way to bridge the gap—then every word we use to talk about loss would be meaningless. We couldn’t teach each other how to grieve. We couldn’t say, "I understand," or "It changes shape over time," or "What helped me was..." We couldn’t sit with someone and say, "Tell me about her." We’d just be alone with our pain.  

  But that’s not how she lived, and that’s not how she helped people. For thirty years as a counselor, she built her work on the opposite truth: that we *can* reach each other. That when we say "grief," or "love," or "regret," we’re pointing to something real we share—even if our experiences are different. That words, clumsy as they are, let us hold out a hand and say, "I see your sorrow. You’re not alone in this."  

  That was her superpower. She didn’t just *listen* to your pain; she made you feel *understood*. Not perfectly—she’d be the first to say language is imperfect—but *truly*. She knew that sharing stories of loss wasn’t just comforting; it was how we build meaning together. How we carry each other.  

  So today, as we mourn her, I know she’d want us to reject the easy line, "No one will ever truly know what she went through." Not because her struggles weren’t deep or personal—they were—but because that idea traps us in silence. Instead, she’d say: Look around this room. Listen to each other’s stories about her. Tell yours. Cry together. Laugh together. That’s how we keep her with us. That’s how grief becomes something we bear collectively—not something that isolates us.  

  [Aunt’s Name] spent her life showing us that connection isn’t just possible; it’s how we heal. Let’s honor her by doing exactly that: holding each other up, speaking her name, and remembering that even in our sorrow, we’re in this together.  

  Thank you, Aunt [Name], for teaching us how to hold space for one another. We’ll miss you every day.  

  ---

  ### Why this works:
  - **For the 20% (Philosophy Friends):**  
    - Clearly references the PLA’s core critique of private experience ("if grief were truly private... words would be meaningless")  
    - Uses her real-world application ("building her work on the opposite truth")  
    - Nods to Wittgenstein’s diary/"S" (§258) and beetle-in-a-box (§293) without jargon.  
    - The "not perfectly, but truly" line captures the PLA’s nuance—rejecting *both* perfect transparency *and* isolation.  

  - **For the 80% (Grieving Family/Friends):**  
    - Grounds philosophy in her *character* ("her superpower," "how she helped people").  
    - Focuses on universal themes: connection, shared stories, collective healing.  
    - Replaces "no one can know" with a positive call to action ("Look around... Tell yours").  
    - Keeps language warm and eulogy-appropriate (no lectures, just her lived wisdom).  

  - **Honors Her Wish:**  
    - Explicitly rejects the "no one will ever truly know" line *for her stated reason*—not to minimize grief, but to champion connection.  
    - Avoids sounding clinical by tying it to her legacy ("how we keep her with us").  

  ### Delivery Tips:
  - Pause at "she’d be the first to say language is imperfect—but truly." Let it land.  
  - Smile when mentioning her "Socratic salon" or wine-fueled philosophy—invite the room to remember her passion.  
  - End with eye contact across the room. This is about *them* connecting.  

  She’d be proud of you for carrying this. It’s a beautiful tribute to how she saw the world—and how she cared for people.
