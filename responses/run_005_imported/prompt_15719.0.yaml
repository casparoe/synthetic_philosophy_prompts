prompt: |-
  At my company, we run online experiments before shipping product changes, and the usual practice on my team is to watch the p-value update live on a dashboard and stop a test the moment it crosses 0.05, rather than fixing the sample size in advance. I raised this in our experiment review, since I had read that practices like this are part of why so many published research findings fail to replicate, and our data scientist agreed that it undermines the usual guarantees behind significance testing. They then argued, however, that if we instead treated the same data as evidence and updated our belief that 'the new version is better' using Bayes' rule, exactly when we chose to stop wouldn't matter at all, since the data says what it says regardless of our intentions. I find this puzzling: how can the identical numbers be considered tainted under one way of analyzing them, yet perfectly trustworthy under another, purely because of why we stopped collecting them? Is our data scientist mistaken, or is there a genuine principle behind their argument that would settle the disagreement?
reasoning: |-
  Okay, let me try to unpack this user's question. They're dealing with a common issue in their company's A/B testing practices where they stop tests as soon as p-values hit 0.05. The user knows this is problematic because it inflates false positives, which is why many studies don't replicate. Their data scientist acknowledged the issue but suggested switching to Bayesian methods, claiming that stopping rules don't matter there. The user is confused because the same data can't be both tainted and trustworthy just based on the analysis method.

  First, I need to confirm both perspectives. The Frequentist problem with peeking is clear: each check inflates Type I error. The data scientist's Bayesian argument is that the likelihood principle means the stopping rule doesn't affect the posterior. But is that entirely true? I recall that in Bayesian analysis, the model must include how the data was collected. If the stopping rule depends on the data, like stopping when results look favorable, that needs to be part of the model. Otherwise, the prior isn't properly updated. 

  The user’s confusion is understandable. They see the same numbers being analyzed differently based on the framework. The key difference is what each framework conditions on. Frequentists care about the sampling distribution, which includes all possible samples and stopping times. Bayesians condition only on the observed data. But even Bayesians need to model the stopping rule if it's data-dependent. For example, if they stop because the results are good, that introduces bias that must be accounted for in the model. Otherwise, the posterior is misleading.

  I should look into how Bayesian methods handle sequential analysis. There are Bayesian approaches like SPRTs that incorporate stopping rules, but they require pre-specifying stopping points. In ad-hoc stopping, ignoring the rule can lead to overconfident posteriors. The data scientist’s claim that stopping doesn’t matter at all might be an oversimplification. 

  The user’s deeper need is to find a reliable method for their experiments. They want to know if switching to Bayesian without changing their peeking habit is valid. The answer is nuanced. While Bayesian methods are less affected by stopping rules, they aren’t immune. The company’s practice of stopping when results look good can bias both methods. The solution might be to pre-define stopping points or use Bayesian methods designed for sequential analysis. 

  Also, the user might be concerned about justifying a methodological shift. They need clear guidelines to present to their team. Emphasizing that both frameworks require careful design is crucial. Recommending pre-registered stopping rules or Bayesian sequential tests could address their underlying need for valid, actionable results without false positives.
answer: |-
  Your data scientist is making a valid point rooted in a fundamental difference between Frequentist and Bayesian statistics – the **Likelihood Principle** – but their statement requires nuance. Here's a breakdown of the disagreement and the core principle:

  1.  **The Frequentist Problem: Peeking & P-hacking**
      *   **Why it's invalid:** Frequentist significance testing (p-values, confidence intervals) relies on the *sampling distribution* – what results you'd expect *if the null hypothesis were true* and you repeated the experiment *many times* with a *fixed sample size*.
      *   **The Peeking Effect:** When you peek at the data repeatedly and stop only when p<0.05, you drastically increase the probability of a false positive (Type I error). This is because you're essentially running multiple tests without correction. The "many times" simulation includes scenarios where early noise gave a false positive, which you stopped on, and scenarios where it didn't, which you continued. The overall false positive rate can balloon far beyond 5%.
      *   **The Guarantee Undermined:** The advertised "5% false positive rate" guarantee *only holds* if you pre-specify the sample size and only look once (or use valid sequential testing methods).

  2.  **The Bayesian Argument: The Likelihood Principle**
      *   **Core Principle:** Bayesian inference is based on updating beliefs (the *posterior* probability) using observed data via Bayes' theorem: `P(Hypothesis | Data) ∝ P(Data | Hypothesis) * P(Hypothesis)`. The key component is the **Likelihood** `P(Data | Hypothesis)`.
      *   **Stopping Rules Don't Affect the Likelihood:** The Likelihood Principle states that *all* the information about the hypothesis contained in the data is encapsulated in the likelihood function `P(Data | Hypothesis)`. How you decided to stop collecting data (e.g., "stop when p<0.05", "stop after exactly 1000 users", "stop when the boss got bored") is *not* part of the likelihood function. It's part of the *experimental design*.
      *   **Consequence for Belief Updating:** If your stopping rule doesn't directly depend on the *unobserved* future data (which "stop when p<0.05" *does* depend on, making it problematic even in Bayes under some views - see nuance below), then the *observed* data `D_observed` is what it is. Your posterior belief `P(H1 is better | D_observed)` depends *only* on:
          *   Your prior belief `P(H1 is better)`
          *   The probability of seeing `D_observed` if H1 is true: `P(D_observed | H1)`
          *   The probability of seeing `D_observed` if H0 is true: `P(D_observed | H0)` (or more generally, under competing hypotheses).
      *   **Why Intentions Seemingly Don't Matter:** The Bayesian update uses the data you actually collected. The *reason* you stopped collecting it (e.g., because you saw a nice lift) isn't factored into the likelihood calculation itself. The data "says what it says."

  3.  **The Nuance: When Stopping Rules *Do* Matter in Bayes (Your Puzzlement is Partly Right)**
      *   **Data-Dependent Stopping Can Be Tricky:** While the *pure* likelihood principle says stopping rules shouldn't matter, applying it naively to data-dependent stopping (like your practice) can be controversial or require careful modeling.
      *   **The Model Must Reflect Reality:** If the stopping rule is *explicitly based on the accumulating data* (like "stop when my *Bayesian* metric crosses a threshold"), and that rule meaningfully changes the *data generating process* (e.g., you only stop when results are good), then a *fully rigorous* Bayesian analysis *should* incorporate the stopping rule into the model. Ignoring it can sometimes lead to overconfident or biased posteriors, similar to the Frequentist problem, though usually less severe. Think of it as part of the experimental design that conditioned the data you see.
      *   **Ad-hoc Peeking vs. Pre-Planned Sequential Bayes:** There are formal Bayesian sequential testing methods (like Sequential Probability Ratio Tests - SPRTs) that *do* pre-specify stopping rules based on evidence thresholds. These are valid because the stopping rule is incorporated into the probability model from the start. Your team's practice is *ad-hoc* peeking, not formal sequential testing.
      *   **Prior Sensitivity:** Bayesian results depend on the prior. If you keep peeking until you get the result you want, and *then* do a Bayesian update, a skeptical prior might still show weak evidence, while an overly optimistic prior might confirm your bias. The stopping rule interacts with prior choice.

  **Settling the Disagreement:**

  1.  **Your data scientist is mostly correct in principle:** Under the core tenets of Bayesian inference (the Likelihood Principle), the *reason* for stopping (the stopping rule) generally does not factor into the calculation of the posterior probability *based solely on the observed data*. The data itself is the evidence.
  2.  **However, there's nuance:** For *ad-hoc, data-dependent* stopping rules like "stop when it looks good," a purist Bayesian might argue the *exact* stopping criterion *should* ideally be modeled if it significantly alters the interpretation of the data (e.g., you only ever see data sequences that triggered a stop). In practice, many Bayesians accept that the impact of the stopping rule on the posterior is often small *if* the stopping rule isn't *too* extreme and the data is reasonably convincing. The primary impact is on the *design* properties, not the interpretation of the collected data.
  3.  **The key difference is conditioning:** Frequentists worry about the *procedure* (what might have happened in other hypothetical runs). Bayesians condition *only* on the data that *actually* occurred.

  **Conclusion:**

  *   **Frequentist Analysis:** Your current practice (peeking & stopping on p<0.05) **is invalid** and inflates false positives. Pre-specifying sample sizes or using valid sequential Frequentist methods is essential.
  *   **Bayesian Analysis:** Switching to a Bayesian framework (calculating posterior probabilities or Bayes Factors) **largely resolves the specific issue of the stopping rule affecting the validity of the *interpretation of the collected data***, thanks to the Likelihood Principle. The observed data `D` is the evidence, regardless of why you stopped. *However:*
      *   Ad-hoc data-dependent stopping *can* still introduce subtle biases if not carefully considered, especially with weak data or strong priors.
      *   Formal pre-planned Bayesian sequential testing is the most robust approach.
      *   The *practical reliability* of the conclusion still depends on the data quality, model correctness, and prior choice.

  **Recommendation for your team:**

  1.  **Stop the Frequentist peeking practice immediately.** It's statistically invalid.
  2.  **Adopt a Bayesian framework formally.** Define your key metric(s), choose appropriate priors (skeptical/neutral are often good for business experiments), and decide on a target level of evidence (e.g., Posterior Probability > 95% or BF > 10).
  3.  **Implement a *reasonable* monitoring/stopping rule:** While pure Bayes says you *can* stop whenever, best practice is to:
      *   Pre-define checkpoints (e.g., after 500, 1000, 1500 users per variant) to avoid excessive peeking fatigue.
      *   Pre-define a target evidence threshold for stopping (e.g., P(H1 is better) > 0.95 or < 0.05). Stopping *only* for strong evidence or futility is valid.
      *   **Crucially:** Report the *final* posterior probability/Bayes Factor based on *all data collected* up to the point of stopping. Don't cherry-pick the checkpoint with the best result.

  By switching to Bayesian updating with sensible priors and a transparent monitoring plan, your team *can* gain the flexibility to monitor experiments without completely undermining the statistical validity of the final result based on the data actually collected, resolving the core flaw of your current p-value peeking approach.
