  ## The Antebellum Constitution: Covenant or Charter? A Clash of Interpretive Visions

  The antebellum abolitionist rift over the U.S. Constitution wasn't merely a tactical disagreement; it was a profound clash of interpretive philosophies, pitting William Lloyd Garrison's stark textual and historical realism against Frederick Douglass's aspirational, principle-driven hermeneutic. Evaluating these positions solely on interpretive merit – fidelity to the text, structure, and original context, bracketing political consequences – reveals a complex struggle where both possess compelling logic, but one ultimately aligns more fundamentally with the Constitution's inherent nature.

  **The Garrisonian Case: A Pro-Slavery Compact by Text and Deed**

  Garrison and Wendell Phillips presented a devastatingly clear textual and historical argument:

  1.  **Explicit Textual Sanctions:** They pointed to undeniable clauses:
      *   **The Fugitive Slave Clause (Art IV, Sec 2, Cl 3):** Mandated the return of "Person[s] held to Service or Labour in one State" escaping to another. This wasn't passive; it imposed a positive federal obligation to uphold slavery's core function – maintaining ownership of human beings.
      *   **The Three-Fifths Clause (Art I, Sec 2, Cl 3):** Explicitly counted enslaved individuals as "three fifths of all other Persons" for representation and direct taxation. This wasn't neutral. It deliberately boosted the political power of slaveholding states in the House and Electoral College, embedding slave power structurally within the federal government.
      *   **The 1808 Slave Trade Clause (Art I, Sec 9, Cl 1):** Explicitly prohibited Congress from banning the "Migration or Importation of such Persons as any of the States now existing shall think proper to admit" *until* 1808. This clause *assumed* the legitimacy of the international slave trade for two decades and implicitly recognized the states' power to define "Persons" as property to be imported. Its structure (a temporary bar on federal action) inherently protected the institution during the nation's formative years.

  2.  **Structural Protections:** Beyond specific clauses, the Constitution's federal structure operated as a shield for slavery:
      *   **Domestic Institution Clause:** The lack of federal power to interfere with the "internal institutions" of states (outside specific delegated powers) effectively created a constitutional sanctuary for slavery within existing slave states. The federal government lacked the authority to abolish it there.
      *   **Amendment Process:** The deliberately high bar for amendment (Art V) made altering these pro-slavery provisions virtually impossible without slave state consent, rendering them effectively permanent features.

  3.  **Original Understanding:** Garrisonians emphasized the undeniable historical context: many Framers owned slaves; the compromises were explicit bargains necessary to secure Southern ratification; and the government functioned for decades consistently *as* a pro-slavery compact. The text, they argued, must be read through the lens of the shared understanding and practical operation at its adoption. The "baked-in" compromises weren't ambiguous; they were the price of union paid to slaveholders.

  **Interpretive Merit (Garrison):** Garrison's strength lies in **textual literalism and historical positivism.** He reads the document as a concrete legal agreement, focusing on what it *explicitly says and what it demonstrably did*. He refuses to ignore inconvenient clauses or downplay their operational impact. His interpretation requires no external philosophical framework; the proof is in the text itself and its immediate historical application. It is a model of descriptive accuracy regarding the Constitution's *function* in preserving slavery.

  **The Douglass/Spooner Case: An Anti-Slavery Document by Principle and Potential**

  Frederick Douglass, influenced by Gerrit Smith and Lysander Spooner, mounted a sophisticated counter-argument rooted in close reading, structural analysis, and higher principles:

  1.  **Textual Absences and Ambiguities:** Douglass emphasized what the Constitution *did not* say:
      *   **No Explicit Sanction:** The words "slave," "slavery," "property in man" appear nowhere. Enslaved individuals are consistently referred to as "Persons" (Fugitive Clause, Three-Fifths Clause) or "other Persons" (Importation Clause). This linguistic choice, Douglass argued, refused to constitutionally enshrine the principle of human property.
      *   **The Preamble as Key:** "In order to form a more perfect Union, establish Justice, insure domestic Tranquility, provide for the common defence, promote the general Welfare, and secure the Blessings of Liberty to ourselves and our Posterity..." Douglass argued this was the Constitution's supreme statement of purpose. Any interpretation of specific clauses must be consistent with securing "Liberty." Slavery, being its antithesis, could not be constitutionally sanctioned.

  2.  **Structural Powers Against Slavery:** Douglass highlighted powers that could be wielded against the institution:
      *   **Federal Control Over Territories & DC (Art IV, Sec 3; Art I, Sec 8):** Congress had plenary power to prohibit slavery in federal territories and the District of Columbia.
      *   **Control of Interstate Commerce (Art I, Sec 8, Cl 3):** Could potentially be used to regulate or restrict the interstate slave trade.
      *   **War Power (Art I, Sec 8, Cl 11) & Necessary and Proper Clause (Art I, Sec 8, Cl 18):** Could be invoked in extremis to confront slavery as a threat to the Union or national security.
      *   **Guarantee Clause (Art IV, Sec 4):** Could be interpreted as requiring states to have "republican" forms of government, incompatible with chattel slavery.

  3.  **Interpretation Guided by Liberty:** Douglass's core move was interpretive: **The Constitution must be read as a coherent whole in light of its stated purposes.** Specific clauses (like the Fugitive Slave Clause) must be interpreted *as narrowly as possible* to avoid contradicting the Preamble's commitment to Liberty. The Framers' *private* intentions or the *initial practice* were irrelevant; the *public meaning* of the text, understood through its highest principles, was paramount. The compromises were unfortunate concessions to political reality, but they did not alter the document's fundamental character as a charter for freedom. They were temporary obstacles within a fundamentally liberty-oriented framework.

  **Interpretive Merit (Douglass):** Douglass's strength lies in **purposive interpretation and constitutional coherence.** He reads the document not just as a static contract, but as a foundational charter establishing a government dedicated to liberty. He forces the text to confront its own highest ideals. By focusing on absences (no "slavery") and the overarching Preamble, he argues that the Constitution, properly understood, *contains the seeds of its own redemption* from the compromises it initially tolerated. It's an interpretation that looks beyond the immediate historical mire to the document's aspirational core.

  **The Verdict on Interpretive Merit: The Aspirational Charter Prevails**

  While Garrison's textual and historical realism is undeniably powerful and descriptively accurate for the Constitution's *initial function*, **Frederick Douglass's purposive, principle-driven reading holds greater interpretive merit on the whole.**

  1.  **The Preamble is Foundational:** Constitutions are not mere contracts listing transactions; they are foundational charters declaring purposes. The Preamble *is* part of the text and establishes the ultimate ends of the government it creates. Ignoring it, as Garrison effectively does by focusing solely on operational clauses without reference to this guiding star, creates an incomplete and distorted interpretation. A document created to "secure the Blessings of Liberty" cannot be fundamentally pro-slavery without a catastrophic internal contradiction. Douglass forces that contradiction to the surface, demanding resolution.
  2.  **Textual Ambiguity Cuts Both Ways:** Garrison is right that the pro-slavery clauses are explicit. However, Douglass is equally right that the *language used* ("Person," "Service or Labour") is deliberately euphemistic and avoids explicitly constitutionalizing human property. This ambiguity is significant. It leaves space for an interpretation that aligns with the Preamble's liberty principle, whereas explicitly naming "slavery" as a protected right would have closed that door entirely. The text's silence on the *principle* of property in man is a crucial opening.
  3.  **Structural Potential is Real:** The powers Douglass identified (territories, DC, war power) were not hypothetical. They became the very tools used to restrict, undermine, and ultimately destroy slavery. While politically difficult to wield pre-Civil War, their existence within the constitutional framework demonstrates that the document did *not* create an airtight fortress for slavery. Garrison's reading treats the federal structure as solely protective of slavery; Douglass recognizes it also contained mechanisms potentially hostile to it.
  4.  **Constitutions are Aspirational:** The genius of the American Constitution lies partly in its recognition of imperfection and its provision for evolution ("a more perfect Union"). Douglass's reading embraces this. He interprets the text not frozen in 1787, but as containing principles capable of growth towards its own stated ideals. Garrison reads it as a death pact, fixed and irredeemable. Douglass reads it as a living charter, flawed but fundamentally oriented towards liberty, demanding interpreters strive to align its practice with its promise. This aligns with the inherent nature of foundational constitutional documents designed to endure.

  Garrison's "covenant with death" interpretation is a powerful indictment of the Constitution's *immediate historical reality* and its tragic compromises with evil. It is descriptively accurate for how the document *functioned* for decades. However, on pure interpretive merit – evaluating the text as a coherent whole, respecting its foundational purpose, acknowledging its structural possibilities, and understanding the aspirational nature of constitutions – Douglass's vision of a "GLORIOUS LIBERTY DOCUMENT," tragically compromised but redeemable through faithful interpretation aligned with its core principles, proves the more compelling and constitutionally coherent reading. It recognizes the text not merely for what it *was* used for, but for what it *declared itself to be* and what it *could become* when its highest ideals were finally brought to bear. The Constitution's greatest flaw was not that it mandated slavery, but that it tolerated it; Douglass's interpretation, demanding that tolerance be overcome by the document's own logic of liberty, ultimately holds the deeper fidelity to its text and spirit.
