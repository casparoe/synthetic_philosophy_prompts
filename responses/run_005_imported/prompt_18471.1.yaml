  So in my African-American political thought seminar we just spent two weeks on Douglass and I'm still chewing on something that came up in section. We read the "Fourth of July" speech and then jumped to his 1860 Glasgow speech where he lays out this whole case that the Constitution, "fairly interpreted," is actually an anti-slavery document -- he makes a big deal out of the fact that the words "slave" and "slavery" never even show up in the text, that the framers hid behind euphemisms like "other persons" and "persons held to service," and that any genuinely ambiguous clause should be read in light of the Preamble's talk of justice and liberty rather than against it. What's messing with my head is that this is basically a 180 from where Douglass started out -- as a young Garrisonian he was fully on board with Garrison's line that the thing was, in Garrison's words, a covenant with death and an agreement with hell, and that between the three-fifths clause, the fugitive slave clause, and the slave-trade clause, the only honest response was disunion: no voting, no office-holding, nothing that legitimized the compact. One guy in my section argued Douglass basically only "found" the anti-slavery reading once it became politically convenient to start voting and back Gerrit Smith and the Liberty/Republican parties, and that Garrison's blunter reading was just more honest about what the 1787 framers actually horse-traded on.

  Can you write me an essay that actually settles this instead of doing the wishy-washy "there's good points on both sides" thing? Lay out the strongest version of Garrison's pro-slavery-compact reading and the strongest version of Douglass's mature anti-slavery reading (bring in Lysander Spooner if its useful, since he's apparently who Douglass was leaning on), and then actually pick a winner and defend it: was Douglass's shift a defensible piece of constitutional interpretation, or was it basically motivated reasoning dressed up in legal language once he needed a document he could vote under? I don't want a cop-out "it depends what interpretive theory you like" ending -- give me an actual thesis I can bring into section tomorrow.
