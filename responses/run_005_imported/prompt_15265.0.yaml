answer: |-
  Here's a scene digging into the *philosophical bedrock* of Hobbes' obstinacy, leveraging his unique theory of science, demonstration, and the nature of truth against the Wallis feud and the sovereignty irony:

  **Setting:** Hobbes' cluttered London lodgings, late afternoon. Dust motes dance in shafts of weak light. Papers, diagrams, and open pamphlets (his own and Wallis's, heavily annotated with furious marginalia) cover every surface. A younger intellectual, **ELIAS** (curious, slightly awed, but persistent), has been drawn into the old man's orbit.

  **The Scene:**

  ELIAS: (Gently picking up a diagram labeled "Hobbes' True Quadrature") Master Hobbes, I’ve studied your latest… and Doctor Wallis’s rebuttal in the *Transactions*. And… Archimedes. The consensus of the Society… it seems overwhelming. Wallis’s algebraic methods, while abstract, yield consistent results accepted by—

  HOBBES: *(Cutting him off, a low rumble building)* Consensus? *Transactions*? Pah! The chirping of sparrows in a barnyard! You speak of ‘consensus’ as if it were *Truth*, boy. Truth is not decided by vote, nor by the scribblings of symbol-weavers like that mountebank Wallis! *(He thumps a bony finger on his own diagram)* **Truth is made, Elias. Not discovered, not voted upon. MADE. Here!**

  ELIAS: But… the procedure? The construction? Master Hobbes, you yourself teach that geometric certainty flows from the **maker’s knowledge** – *scientia propter quia*. We know the circle because we define it, we generate it by motion: a point equidistant. We know its properties because we *built* it from that cause. Shouldn’t that… shouldn’t that make a flaw *more* demonstrable? If the construction fails, the knowledge fails. Isn’t that your own doctrine?

  HOBBES: *(Eyes sharpening, seeing Elias grasp the core principle, but misapply it)* Aye, boy. You grasp the foundation. **Philosophy is causal reasoning from the known generation of things.** Physics stumbles because we guess at causes we did not make – God’s hidden machinery. But Geometry? Ah! **We are the Demiurges here!** We lay down the definitions – ‘point’, ‘line’, ‘motion’ – and from them, by **syllogistic demonstration grounded in those generative acts**, we build our knowledge. **Certainty resides in the causal chain we construct, step by necessary step, from first principles.** *(He gestures emphatically at his diagram)* **This** *is* that chain! I have defined the terms, I have described the motions – the rotations, the translations – that generate this figure. I have reasoned syllogistically from those acts of generation. Therefore, **it is true.** The quadrature *is* achieved.

  ELIAS: But… Doctor Wallis demonstrates algebraically, using limits and infinite series, that the ratio is irrational, incommensurable… that no such finite construction *can* exist. Isn't that a demonstration of the impossibility?

  HOBBES: *(Snorts derisively)* **Algebra!** Wallis’s ‘demonstrations’ are phantoms! Smoke and mirrors! He deals in *symbols*, Elias, not in *things generated*. He manipulates marks on paper according to rules he borrows, not rules derived from the **genesis** of magnitudes themselves! What is this ‘infinite series’? A chimera! A potentiality, never actualized. **True demonstration requires the actual generation of the magnitude, step by causal step, comprehensible to the mind tracing the motion.** His symbols do not *generate* the circle; they merely *describe* it… poorly! **He confuses calculation with causation, description with generation!** My method *shows* the cause – the specific motions that *produce* the equal area. His shows… arithmetic tricks. Tricks that fail to grasp the *philosophical* essence of magnitude, which is **extension generated by motion.**

  ELIAS: (Pressing carefully) So… when others point to a specific step, say where you equate this arc length with this straight line… and they claim the motion you describe *doesn't* produce exact equality…?

  HOBBES: *(Leaning forward, intensity burning)* **Then they have failed to comprehend the generative act!** They see static lines, Elias. They do not *trace the motion* in their mind's eye as the true geometer must! They lack the **synthetic vision** – the ability to see the whole causal chain unfolding from the definitions and the motions prescribed. **Their failure of imagination, their inability to replicate the *intellectual construction* in their own minds, does not falsify *my* demonstration, which rests on the clear and necessary connection of causes I have laid bare.** Wallis and his ilk are blinded by their symbols; they mistake the manipulation of signs for the comprehension of causes. **My quadrature stands because I have *constructed* its truth, causally, from the ground up. Their objections are failures of *their* understanding, not flaws in *my* generation.**

  ELIAS: (Seizing the irony) But Master Hobbes… forgive me… your *Leviathan*. The core argument… the necessity of a single, sovereign arbiter for contentious judgments in matters of religion, morality, even natural philosophy where causes are hidden… to prevent the war of all against all, the clash of private judgments. Yet here… here you stand, a sovereign unto yourself in this geometric realm. You reject the consensus, the judgment of the Royal Society – the closest thing we have to an authorized ‘geometric sovereign’… You wage your own private war against Wallis’s judgment. How does philosophy reconcile the public necessity of sovereignty with the… private certainty of the geometer?

  *(A long silence. Hobbes stares at Elias, then slowly looks around at the papers, the diagrams – his constructed world. A flicker of something ancient and weary crosses his face, quickly replaced by defiant resolve.)*

  HOBBES: *(Voice lower, gravelly, but firm)* The sovereign’s judgment is necessary, boy, precisely *because* men cannot naturally agree on causes they did not make – on God’s will, on justice, on the hidden springs of nature. **Private judgment there is poison, leading to chaos.** But Geometry? **Geometry is different.** Its causes are open. They lie in definitions and motions we ourselves establish. Its demonstrations are syllogistic chains built on those self-made causes. **Here, the ‘sovereign’ is not a man or an assembly. The sovereign is the *Logic of Generation* itself.** A man who truly grasps the causal generation of a figure possesses a certainty no external decree can grant or deny. To yield my quadrature to the *vox populi* of Gresham College, to the symbol-juggling of Wallis, would be… **(He searches for the word)**… **treason.** Treason against Reason itself. Against the very principle of *scientia propter quia*. I built this truth. I know its cause. **No mob, geometric or otherwise, can unmake what I have made.** Let Wallis have his symbols and his Society. I have my constructions. And while this hand can hold a compass, and this mind can trace a motion, I will defend them. **Here, Elias, I *am* the sovereign.**

  *(Hobbes turns back to his diagram, tracing a line with a trembling but unwavering finger. The argument is closed. The private geometric war continues.)*

  **Key Philosophical Points Embedded:**

  1.  **Scientia Propter Quia (Knowledge Because of the Cause):** Hobbes' core epistemology. True scientific knowledge comes from understanding the *generating cause* of a thing. Geometry is privileged because *we* define the generating causes (definitions, motions).
  2.  **Maker's Knowledge:** Because we generate geometric objects by our definitions and mental constructions (motion of points, lines), we have privileged, certain knowledge of them.
  3.  **Demonstration as Causal Synthesis:** A valid geometric demonstration isn't just a chain of logic; it's a *synthetic reconstruction* of the object's generation from first principles via necessary steps. You must mentally *perform* the construction.
  4.  **Rejection of Algebra/Infinitesimals:** Hobbes saw algebra as mere symbolic manipulation, divorced from the causal generation of magnitudes. Infinitesimals and limits were "potentialities," not actual generated magnitudes, hence philosophically illegitimate for *demonstration* (though maybe useful for *calculation*). Wallis's methods were thus fundamentally unsound *philosophically*, regardless of results.
  5.  **The Illusion of Error:** For Hobbes, if others found a flaw, it meant *they* failed to correctly perform the intellectual synthesis, to trace the causal chain he had built. Their inability wasn't proof of his error, but of their deficient geometric imagination/understanding. His demonstration *felt* causally complete to him.
  6.  **The Irony of Sovereignty:** The scene explicitly confronts the tension. Hobbes argues geometry is the *exception* to the need for an external sovereign because its truths are generated by *publicly accessible, self-made causes* and demonstrable by *individual reason* tracing those causes. The "sovereign" *is* the logic of construction. Yielding would betray reason itself. This justifies his private war intellectually (in his mind), while highlighting the profound irony against his political doctrine.

  This scene gives Hobbes a powerful, internally consistent (if deeply flawed and self-serving) rationale rooted in his unique philosophy of science and geometry, far beyond mere pride. It showcases his intellectual arrogance but also his genuine, almost tragic, commitment to his own system of thought.
