answer: |-
  You've grasped Aquinas's core distinction with impressive clarity for someone piecing it together from fragments – your reconstruction is fundamentally sound. Let's break down his reasoning and its implications for modern tyrannicide, walking through the logic step-by-step.

  **The Core of Aquinas's Position (Primarily from *De Regno* and *Summa Theologiae*):**

  1.  **The Distinction is Foundational & Moral:**
      *   **Tyrant by Usurpation (Defect in Title):** This ruler never had legitimate authority. They are fundamentally an *aggressor* against the rightful political order. Aquinas argues (**Summa Theologiae II-II, Q.42, A.2, ad 3** and **Q.64, A.3**) that killing such a person can be analogous to killing a brigand or an unjust aggressor in self-defense or defense of the common good. *Private individuals* may have the right (even duty, in extreme cases) to resist or kill such a usurper because there *is* no legitimate public authority to appeal to; the usurper *is* the disruption.
      *   **Tyrant by Exercise (Defect in Governance):** This ruler was legitimately established (e.g., by election, inheritance, just conquest) but then governs unjustly, oppressing subjects, violating law, and destroying the common good. Here, Aquinas (**De Regno, Ch. 6-7**) is *extremely* cautious.

  2.  **Why the Caution Regarding Legitimate Tyrants?**
      *   **Theological Foundation:** Legitimate authority, even when abused, derives ultimately from God (**Romans 13:1-2** is a key text here). Private individuals directly killing a *legitimately constituted* ruler risks usurping God's judgment and the divinely ordained structure of authority.
      *   **Practical Prudence & Order:** Aquinas fears anarchy and the "tyranny of the mob." If *any* private individual can decide a ruler has become tyrannical and kill them, it invites:
          *   **Chaos:** Endless cycles of violence, vendetta, and factional strife ("Who decides what's tyranny?").
          *   **Worse Tyrants:** The assassin or their faction might simply install an even worse regime.
          *   **Undermining Law:** It bypasses all legal and institutional processes, destroying the very fabric of ordered society.
      *   **The "Public Authority" Solution:** Aquinas doesn't counsel passive acceptance. Instead, he insists action must come from a *higher or representative public authority*:
          *   **"Superior Power":** E.g., An Emperor over a King, the Pope in certain medieval conceptions (though Aquinas is nuanced here).
          *   **The Community Itself ("Universitas") Acting Corporately:** Not individuals, but the body politic acting through its legitimate representatives (e.g., nobles, elders, a council, the people *as a whole* in some form). This action might involve deposition, legal judgment, or, as a *last resort*, forceful removal. The key is that it represents the *public judgment* of the community whose common good is being destroyed, not private vengeance or ambition.

  3.  **Does the Distinction Change the Moral Justification?**
      *   **Yes, subtly.** For the usurper, the justification is primarily *defensive* (repelling an unjust aggressor against the polity). The act is *less* about judging the ruler and *more* about repelling an external threat.
      *   For the legitimate tyrant, the justification for forceful removal requires a *public judgment* that the ruler has fundamentally broken the covenant of rulership and is now an *internal enemy of the common good*. The act is a *political* and *judicial* act of the community (or its higher representative), not merely a defensive one. The moral burden shifts from individual conscience to the legitimacy of the *process* enacting the community's judgment.

  **Implications for Modern Cases (Hitler Plots, Targeted Killing of Dictators):**

  Applying Aquinas's framework rigorously leads to complex and often uncomfortable conclusions:

  1.  **Tyrant by Usurpation (e.g., Military Coup Leaders):**
      *   **Aquinas is More Permissive:** Private individuals acting to kill or overthrow such a figure *could* be justified under Aquinas's logic, especially if no functioning public authority exists to oppose the usurper. The moral barrier is lower. Think of resistance fighters against a junta.

  2.  **Tyrant by Exercise (The Hard Cases - Hitler, Modern Dictators):**
      *   **Hitler:** This is the quintessential challenge. He came to power through semi-legal means (appointed Chancellor, then exploited mechanisms). By Aquinas's strict definition, he was initially legitimate (defect in exercise, not title). Therefore:
          *   **Private Plots (Stauffenberg, Elser, etc.):** Aquinas's framework would view these with *profound caution*. They represent private individuals (even high-ranking officers acting outside their chain of command) taking judgment and action into their own hands. This risks the anarchy and usurpation Aquinas feared. While motivated by the highest ideals and facing unimaginable evil, they arguably fall outside Aquinas's preferred path.
          *   **Is There a "Public Authority"?** This is the critical question for Aquinas.
              *   *The German State Apparatus?* Corrupted by Nazism. Legitimate institutions (Reichstag, courts) were destroyed or subverted. Who represents the "universitas"?
              *   *The Military Leadership?* If acting collectively *as* the remaining legitimate arm of the state to restore constitutional order (which was part of the July 20th plotters' justification), this *might* edge closer to Aquinas's "public authority" – a corporate body acting for the common good, not just private individuals. However, the plot's secrecy and reliance on assassination rather than open declaration/judgment complicate this.
              *   *The German People?* Impossible to mobilize collectively under totalitarian terror.
              *   *An External Power (Allies)?* Aquinas might see a legitimate "superior power" waging a just war against a tyrant threatening the international common good. Targeted killing *by them* (e.g., Operation Valkyrie planned by Allies) fits better than private action *within* Germany.
      *   **Modern Dictators (e.g., Assad, Kim Jong-un):** Similar logic applies.
          *   **Private Citizen Assassination:** Highly problematic for Aquinas. A lone citizen or small cell lacks the standing of "public authority." Their action is fundamentally privatized judgment and violence, risking chaos and potentially worse outcomes.
          *   **Revolution/Coup by a Faction:** Depends on whether the faction can credibly claim to represent the "public authority" (e.g., a broad-based revolutionary council with popular legitimacy, a significant military faction acting *as* a corporate body to restore order). Mere seizure of power by another elite group might just be another usurpation.
          *   **International Action (ICC, UN Sanctioned Force, Drone Strike by Foreign Power):** This pushes Aquinas's framework. He envisioned hierarchical superiors within a known order (Empire/Church). Modern international law and institutions are different. However:
              *   *UN Security Council Authorization:* Could be seen as the closest modern analogue to a legitimate "higher authority" acting for the international common good, potentially justifying force, *including* targeting a leader deemed a threat to peace (though assassination is rarely explicit policy).
              *   *Unilateral Foreign Action (e.g., targeted killing by one state):* Much harder to justify under Aquinas. It looks more like an external power acting on its own judgment, potentially usurping the role of any internal "public authority" or legitimate international body. It risks being seen as aggression, not tyrannicide for the common good.

  **Does Aquinas Leave *Any* Room for Private Action Against a Legitimate Tyrant?**

  *   **Extremely Limited:** Aquinas's overwhelming emphasis is on public authority. He explicitly warns against private action in *De Regno* (Ch. 6): "To proceed against the cruelty of tyrants is an action not to be undertaken by private enterprise but rather by public authority."
  *   **Last Resort & Imminent Catastrophe:** One *might* stretch Aquinas by arguing that when a tyrant's actions become so monstrous and immediate (e.g., actively perpetrating genocide) that *no* public authority can possibly act in time, and the tyrant has utterly destroyed any functioning polity, the situation collapses into one resembling a state of war or aggression against the people. In this scenario, defensive action by individuals *could* be analogized to killing a rampaging aggressor. However, this is a modern extension Aquinas himself would likely resist, as it dangerously blurs his crucial distinction. His framework simply isn't designed to easily accommodate the totalitarian state's ability to destroy all avenues for public action.

  **Conclusion: The Internal Logic and Its Stretch**

  Aquinas's internal logic prioritizes **order, legitimacy of process, and the common good** over individual righteous anger, however justified. He fears the cure (private tyrannicide) being worse than the disease (tyranny itself) by unleashing chaos. The distinction between usurpers and legitimate tyrants is crucial because it defines **who has the standing to act** and **under what justificatory framework**.

  *   **For modern private plots (like many against Hitler):** Aquinas's framework is largely **dismissive or disapproving.** He would see them as necessary risks born of desperation in a system where public authority was utterly destroyed, but still problematic privatizations of judgment and violence. His sympathy would lie more with their motives than their method.
  *   **For modern debates on targeted killing:**
      *   By internal factions claiming public legitimacy? *Possibly* justifiable if they truly represent a corporate body acting for restoration, not mere seizure.
      *   By foreign powers unilaterally? *Highly suspect* under Aquinas's logic, resembling aggression.
      *   By foreign powers under international mandate? *Closer* to Aquinas's "superior authority" concept, offering the strongest modern parallel for justified action against a tyrant by exercise.

  **Where the Framework Strains:** Aquinas couldn't anticipate totalitarianism's ability to annihilate all internal avenues for public action or the scale of modern genocide. His framework struggles most when the "public authority" needed to act *no longer exists or cannot function*, leaving only private courage against overwhelming evil. While his principles of order and legitimate process remain vital, applying them rigidly to such extremes can feel morally inadequate. This tension is precisely why figures like the German resistance, acting outside his strict bounds, continue to compel our moral imagination, even as Aquinas provides essential cautions against vigilantism and chaos. His enduring value lies in forcing us to confront the profound dangers inherent in privatizing the ultimate political act of removing a ruler.
