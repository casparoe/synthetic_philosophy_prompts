answer: |-
  Your unease is profoundly justified: Maudlin's entanglement objection strikes at the heart of Humeanism by challenging the existence of a separable, local mosaic. Neither wavefunction realism nor Super-Humeanism genuinely preserves Lewis's core metaphysical commitments—both sacrifice *separability* and *locality* to retain the label "Humean," rendering the position unrecognizable from Lewis's original vision. I will focus on **wavefunction realism** (defended by David Albert, Barry Loewer, and others) to demonstrate this in technical detail, showing how it abandons the substantive locality requirement essential to Lewis's project.

  ### Maudlin's Core Objection: Non-Supervenience and the Loss of the Mosaic
  Maudlin's argument (e.g., in *The Metaphysics Within Physics* and *Philosophy of Physics: Space and Time*) hinges on two quantum facts:
  1. **Entangled states** (e.g., the singlet state \( \frac{|\uparrow\downarrow\rangle - |\downarrow\uparrow\rangle}{\sqrt{2}} \)) describe systems with properties that are not determined by the intrinsic states of their parts. The spin correlations are irreducible relations between particles.
  2. **Bell’s theorem** empirically rules out local hidden variables, confirming that these correlations cannot supervene on intrinsic properties of spatially separated parts.

  For Lewis, the Humean mosaic must consist *only* of local intrinsic qualities instantiated at spacetime points (or point-sized regions). Entanglement shows that the fundamental physical structure includes *non-supervenient relations*, meaning the mosaic—as Lewis defines it—does not exist. Lewis’s response in "Humean Supervenience Debugged" (1994) is a retreat: he dismisses QM as "not yet right," but this is ad hoc and fails against contemporary quantum foundations.

  ### Wavefunction Realism: A "Solution" That Abandons Locality
  Wavefunction realists propose relocating the mosaic to **configuration space** (e.g., Albert in *Wave Function Realism*). Here’s the strategy:
  - **The move**: Treat the wavefunction \( \psi \) as a physical field in a \(3N\)-dimensional configuration space (where \(N\) is the number of particles). Each point in this space represents a *complete configuration* of all particles. The "local" beables are now field values at points in this high-dimensional space.
  - **The promise**: By embedding everything in configuration space, entanglement correlations are "local" because they are encoded in the field values at single points. For example, the singlet state’s spin correlations are captured by \( \psi \)’s value at points like \(( \vec{r}_1, \vec{r}_2 )\).

  #### Why This "Saves" Humeanism Only Verbally
  1. **Destruction of Spatiotemporal Locality**:  
     - In Lewis’s mosaic, "locality" means that physical properties are intrinsic to *small spacetime regions* and supervene on their subregions. Configuration space points are not small spacetime regions—they represent *entire configurations of the universe*. A point \( q = (\vec{r}_1, \vec{r}_2, \dots, \vec{r}_N) \) encodes the positions of all \(N\) particles *at once*.  
     - **Consequence**: Properties at \( q \) are *inherently global*. For two entangled particles, the wavefunction value \( \psi(q) \) at \( q = (\vec{r}_A, \vec{r}_B) \) assigns properties to the *entire pair*, not to A or B individually. This is not "local" in any sense Lewis intended—it replaces spacetime locality with a monolithic, non-separable structure.  

  2. **Loss of Separability**:  
     - Lewis’s mosaic requires **separability**: the whole supervenes on the intrinsic properties of non-overlapping spacetime parts. But in configuration space, there are no "parts" in the spacetime sense. Subregions of configuration space (e.g., those varying only \( \vec{r}_A \)) do not correspond to physical subsystems; they are mathematical artefacts.  
     - **Technical proof of non-separability**: Consider decomposing configuration space into subspaces for particles A and B. For \( \psi \) to supervene on individual particle states, it must be separable: \( \psi(\vec{r}_A, \vec{r}_B) = \psi_A(\vec{r}_A) \otimes \psi_B(\vec{r}_B) \). But entangled states are *non-separable*—they cannot be written this way. Wavefunction realism doesn’t resolve this; it *relocates* non-separability to the geometry of the mosaic itself. The "local" field values in configuration space still describe irreducible relations.  

  3. **Best-System Account Becomes Trivial**:  
     - Lewis’s BSA gains traction from the idea that laws *emerge* from patterns in a sparse, local mosaic. But if the mosaic is a \(3N\)-D field, it is maximally rich—it already encodes the entire history of the universe in a single mathematical object.  
     - **Simplicity/strength trade-off undermined**: A "simple" law in configuration space (e.g., the Schrödinger equation) describes the evolution of this bloated mosaic. But this simplicity is illusory: the wavefunction’s high-dimensional structure *builds in* the very holism Humeans sought to avoid. For example, the Schrödinger equation for an entangled system is "simple" only because it treats the system as an indivisible unit—precisely the non-locality Lewis rejected.  

  4. **Maudlin’s Rebuttal Applied**:  
     Maudlin argues this move is a bait-and-switch (*The Metaphysics Within Physics*, Ch. 2):  
     - If "locality" is redefined to mean "locality in configuration space," then Humean supervenience reduces to the trivial claim that "everything supervenes on everything." Configuration space realism doesn’t *ground* entanglement in local particulars—it *redefines* the particulars as global states. This abandons the spirit of Humeanism, which aimed to reduce laws to a mosaic of *independent* local facts.  

  ### Why Super-Humeanism Also Fails (Briefly)
  While your focus is on wavefunction realism, note that **Super-Humeanism** (Esfeld’s "primitive ontology" approach) collapses for similar reasons:  
  - It posits only particles with definite trajectories (à la Bohmian mechanics) as the mosaic, treating \( \psi \) as a "nomological" entity.  
  - **Problem**: The particle trajectories *themselves* are non-local. The velocity of particle A depends instantaneously on the position of particle B via the guiding equation \( \dot{\vec{r}}_k = \frac{\hbar}{m_k} \Im \left( \frac{\nabla_k \psi}{\psi} \right) \). This dependence is not supervenient on local properties—it’s baked into the dynamics. Calling \( \psi \) "nomological" doesn’t erase the fact that the mosaic (particle positions) is governed by a fundamentally relational law.  

  ### Conclusion: Humeanism Sacrificed, Not Saved
  Wavefunction realism "saves" the Best-System Account only by evacuating it of its original content. By relocating the mosaic to configuration space, it:  
  - **Abandons spatiotemporal locality** for a high-dimensional structure with no physical analogy to Lewis’s mosaic.  
  - **Denies separability** by making the fundamental ontology inherently holistic.  
  - **Trivializes the BSA** by building global constraints into the mosaic itself.  

  This is not a defense of Humeanism but a surrender to its incompatibility with quantum mechanics. Your dissertation’s final chapter can powerfully argue that Lewis’s project—grounding laws in a local, separable mosaic—is untenable in light of entanglement. Neither wavefunction realism nor Super-Humeanism offers an escape; they merely obscure the corpse of Humean supervenience with formalist makeup. Embrace this as a strength: philosophy progresses by confronting contradictions, not by redefining them away. If you pursue this line, engage directly with Albert’s *After Physics* (Ch. 6) and Maudlin’s *Philosophy of Physics: Quantum Theory* (Ch. 11) for the technical nuances.
