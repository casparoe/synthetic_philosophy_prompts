answer: |-
  You've hit on a fascinating and genuinely important distinction – your friend is right that "the Frame Problem" refers to **two distinct, though deeply related, problems**, often causing confusion. Let's break down the differences and why the philosophical version is considered a different beast:

  1.  **The "Narrow" (AI/Engineering) Frame Problem (Your Version):**
      *   **Core Issue:** Efficiently representing *state persistence* in a logical formalism for planning systems.
      *   **Focus:** *Representation*. How do we *write down* rules for an action's effects so the system doesn't need explicit axioms for everything that *doesn't* change?
      *   **Assumption:** There *is* a well-defined, finite set of relevant "fluents" (properties that can change) and actions. The problem is computational/representational efficiency *within that predefined set*.
      *   **Solution Strategies (as you noted):** STRIPS assumption (assume persistence unless an effect explicitly changes it), circumscription, default logic, domain-specific axioms, state update semantics. Engineering workarounds like efficient data structures and focusing mechanisms *within the predefined domain*.
      *   **Tractability:** Widely seen as a *solvable engineering challenge* within bounded domains. We *can* build practical planning systems by cleverly limiting the scope or using efficient representations. It's a "boring optimization/representation problem" *relative to the philosophical version*.

  2.  **The "Broad" (Philosophical/Epistemological) Frame Problem (Your Friend's Version - Dennett, Fodor, McCarthy & Hayes originators):**
      *   **Core Issue:** How any cognitive system (biological or artificial) *determines relevance* – what beliefs *could possibly be relevant* to update or consider after an event, action, or new piece of information, without succumbing to combinatorial explosion or paralysis?
      *   **Focus:** *Cognition & Relevance*. How does the mind (or any general intelligence) *know what to ignore*? It's about the *dynamic process* of belief fixation and revision in an open-ended world.
      *   **Key Ingredients Beyond the Narrow Problem:**
          *   **Informational Unencapsulation (Fodor's Key Point):** Central cognitive processes (like belief revision, planning, problem-solving) are *not* restricted to drawing only on a specific, limited domain of information. *Any* belief stored anywhere in the system *could*, in principle, become relevant. Confirming a chair is blue might, in some bizarre context, involve beliefs about the price of tea in China if that somehow became part of a complex chain of reasoning. There are no *a priori*, fixed boundaries on what *might* be relevant.
          *   **The Problem of Specifying "Relevance":** There's no clear, formal, general definition of "relevance" itself. What makes one belief relevant to a situation and another irrelevant? This isn't just about persistence ("does painting change the chair's position?"), but about *any potential inferential connection* ("does flipping this fridge switch potentially affect my belief about neutrino oscillations?"). The "fridgeon" (Fodor's deliberately absurd hypothetical particle emitted by fridges) thought experiment highlights this: if we take physics seriously, *every* action *does* change *something* about everything else (via gravity, EM fields, etc.), making "most things stay the same" physically false. Our *common-sense* notion of relevance is doing heavy lifting that's hard to formalize.
          *   **The Scope is Unbounded:** The set of *potential* beliefs is effectively infinite (or at least, astronomically vast and constantly growing). The system doesn't operate within a predefined, finite set of fluents; it has to deal with novelty and unexpected connections.
          *   **The Frame Problem as a Problem for *Learning* and *Adaptation*:** How does the system learn *what* is relevant? How does it update its *criteria* for relevance when faced with novel situations? This goes beyond static representation.

  **Are They Different in Kind or Degree?**

  It's **both**, but leaning towards **kind** due to the centrality of **relevance determination within an unbounded, informationally unencapsulated system**.

  *   **Shared Core:** Both stem from the fundamental observation that the world's state has immense complexity, and actions/events only change a tiny part of it. Both grapple with the combinatorial explosion that arises if you *don't* ignore the unchanged parts.
  *   **Difference in Kind:** The narrow problem is *solvable within a closed system* by fiat – we *define* the relevant fluents and actions. The broad problem attacks the very idea that relevance *can* be pre-defined or algorithmically determined in a general, tractable way for an open-ended cognitive system interacting with the real world. The narrow problem asks *how to efficiently represent persistence*. The broad problem asks *how cognition avoids paralysis when literally anything could be relevant*.

  **Is the Broad Frame Problem Unsolvable in Principle (Fodor's Claim)?**

  This is **highly contentious** and where Fodor's pessimism comes in:

  1.  **Fodor's Argument:**
      *   Central cognition is informationally unencapsulated.
      *   Therefore, determining relevance for any given cognitive task (like updating beliefs after an action) requires, in principle, accessing *all* beliefs (because any one *could* be relevant).
      *   Checking all beliefs is computationally intractable (combinatorial explosion).
      *   There is no known (and Fodor argues, *no possible*) general algorithm or heuristic that *reliably* and *tractably* restricts the search for relevant beliefs *without itself needing to check everything* to apply its own criteria. Any relevance-filtering mechanism would itself face the frame problem when deciding what *it* needs to consider.
      *   **Conclusion:** Therefore, central cognition (belief fixation, relevance determination) *cannot* be computationally tractable in the way perception or motor control (which *are* encapsulated modules) might be. It's a fundamental limit.

  2.  **Counterarguments & Criticisms:**
      *   **Biological Plausibility:** Humans *do* it. We aren't paralyzed. Therefore, *some* tractable solution exists in nature. (Fodor might reply: yes, but we don't know *how*, and it might rely on messy, heuristic, connectionist, or non-computational properties).
      *   **Heuristics Work (Well Enough):** Evolution and learning provide powerful, domain-specific heuristics, biases, salience detectors, and associative mechanisms that *practically* solve the relevance problem for most everyday situations, even if they aren't foolproof or formally general. Connectionists (like Paul Churchland) argue neural networks implicitly handle relevance through distributed representations and pattern completion.
      *   **The Frame Problem is Misstated:** Some (like Dennett, though he takes it seriously) or roboticists like Rodney Brooks argue the problem arises from the flawed "sense-plan-act" model. Real agents are embedded, use situated action, reactive architectures, and continuous interaction with the world, which constantly prunes relevance *through action* rather than pure internal deliberation.
      *   **"Fodor being Fodor":** Fodor is known for provocative, often pessimistic, arguments about the limits of computationalism and AI. His modularity thesis itself tries to wall off central cognition *because* of problems like the Frame Problem. Critics argue he overstates the problem's intractability and understates the power of learning, embodiment, and heuristic reasoning.

  **Conclusion for You:**

  1.  **Distinct Problems:** Yes, your friend is correct. The narrow Frame Problem is a specific technical challenge in knowledge representation for planning systems. The broad Frame Problem is a profound epistemological and cognitive science puzzle about relevance, boundedness, and the tractability of general intelligence.
  2.  **Extra Ingredient:** The crucial additions are **informational unencapsulation** (any belief could be relevant) and the **fundamental difficulty of algorithmically defining "relevance" itself** within an open-ended world. This shifts it from "how do we efficiently represent persistence?" to "how does cognition *ever* avoid combinatorial explosion when updating beliefs?"
  3.  **Difference in Kind:** While sharing roots, the unbounded scope and the focus on dynamic relevance determination make the broad problem qualitatively different and significantly harder.
  4.  **Unsolveable in Principle?** Fodor argues yes, it's a fundamental limit for computational theories of central cognition. This is his *philosophical position*, not a proven theorem. Many cognitive scientists and AI researchers disagree, believing heuristics, learning, and embodiment provide tractable (though imperfect) solutions. It remains a deep and active debate.

  Think of it like this: The narrow problem is figuring out how to efficiently update a specific, predefined database schema after a known operation. The broad problem is figuring out how a scientist, given a surprising experimental result, knows *which books in the entire Library of Congress* (and beyond) *might* be relevant to understanding it, without reading every single one. The latter feels fundamentally different and much harder. Your friend is pointing to the Library of Congress problem.
