answer: |-
  You've hit on a crucial point! Switching to **Average Utilitarianism (AU)** *does* indeed avoid the Repugnant Conclusion (RC), and it's the most intuitive "fix" many people land on. Your reasoning is completely logical. **However, philosophers reject AU as a complete solution because it introduces new, arguably *worse* problems than the one it solves.** Parfit and others spent decades exploring this and found AU leads to conclusions many find even more morally repugnant.

  Here's a breakdown of why "just use the average" isn't the magic bullet:

  1.  **The "Extinction" or "Mere Addition" Problem:**
      *   **Scenario:** Imagine a world with a small population living *extremely* happy lives (World A). Now, consider adding a new group of people who have lives *slightly less happy* than the original group, but still *very much worth living* (World A+). Adding them doesn't harm the original group's happiness.
      *   **Total Utilitarianism (TU):** A+ is better than A because total happiness increases.
      *   **Average Utilitarianism (AU):** Adding people who are *slightly less happy* than the current average *lowers the overall average happiness*. Therefore, AU says World A (the smaller, happier population) is better than World A+ (the larger population with very high, but slightly lower average happiness).
      *   **The Problem:** This implies it would be *wrong* to create additional happy people if they aren't *as happy* as the happiest existing people, even if their lives are wonderful. Taken to its logical extreme:
          *   If the only way to add new people is if they are *slightly less happy* than the current happiest, AU forbids it.
          *   If the *only* population possible would have an average happiness *lower* than the current average (even if still very high), AU demands we *never create them* and let humanity go extinct rather than lower the average. This conclusion – that non-existence is preferable to a large, very happy (but not maximally happy) population – strikes many as absurd and deeply problematic for a theory meant to promote wellbeing.

  2.  **The "Sadistic Conclusion":**
      *   **Scenario:** You have a choice between two futures for a population:
          *   **Option 1:** Add a group of people with lives *barely worth living* (positive wellbeing, but very low).
          *   **Option 2:** Add a group of people with lives that are *net negative* (full of suffering, worse than non-existence).
      *   **Average Utilitarianism (AU):** Adding the group with *barely worth living* lives (Option 1) lowers the average happiness. Adding the group with *net negative* lives (Option 2) lowers the average happiness *even more* (since their wellbeing is negative). Therefore, AU prefers **Option 1** (adding barely-worth-living lives) over **Option 2** (adding miserable lives) *because it harms the average less*.
      *   **The Problem:** This seems correct *only* when comparing these two bad options. But consider a *third* option:
          *   **Option 3:** Don't add *any* new group.
      *   **AU vs. Option 3:** Adding the barely-worth-living group (Option 1) *lowers the average* compared to not adding anyone (Option 3). Therefore, AU prefers **Option 3** (not adding anyone) over **Option 1** (adding barely-worth-living lives).
      *   **The Sadistic Twist:** Now imagine you *must* add one of the two new groups. AU tells you to add the group with *barely worth living* lives (Option 1) rather than the miserable group (Option 2). But what if adding the miserable group would somehow *prevent* the barely-worth-living group from ever existing? AU would then prefer creating the *miserable* lives (Option 2) over creating the *barely-worth-living* lives (Option 1), **because creating miserable lives results in a *higher average wellbeing* for the total population than creating barely-worth-living lives would** (since the miserable lives drag the average down less than the larger number of barely-worth-living lives would). This conclusion – that it's sometimes better to create suffering people than happy-but-not-very-happy people, purely to preserve a higher average – is called the **Sadistic Conclusion**. It's arguably far more repugnant than the original RC.

  3.  **Ignoring the Value of Existence for the New People:**
      *   AU focuses solely on the average of *existing* people. It assigns *no intrinsic positive value* to bringing a new, happy person into existence. Creating a new person with a wonderful life only has value for AU if it *increases the average*. If it lowers the average (e.g., because existing lives are even happier), AU says it's *bad* to create that happy person. This clashes with the strong intuition that creating a happy life is a *good thing in itself*, even if it doesn't maximize the average happiness of the world.

  4.  **Harsh Implications for Existing Populations:**
      *   While AU avoids encouraging massive populations of low wellbeing, it can imply harsh things about *existing* populations with low wellbeing. If a group of people has very low (but positive) wellbeing, removing them (painlessly and without affecting others) would *increase the average happiness* of the remaining population. AU could therefore *favor* the elimination of unhappy people to boost the average. This is another deeply counterintuitive and ethically repugnant implication.

  **Why is this so hard? The Trade-offs:**

  The Repugnant Conclusion exposed a fundamental tension in population ethics. There seems to be no single, intuitively satisfying way to simultaneously:
  1.  **Value happy lives:** Acknowledge that creating a happy life is good.
  2.  **Avoid overpopulation hell:** Reject that a massive population with barely-worth-living lives is best.
  3.  **Avoid extinction absurdity:** Reject that we should go extinct rather than create large populations of very happy (but not maximally happy) people.
  4.  **Avoid sadism:** Reject that creating suffering people is sometimes preferable to creating less-happy-but-still-happy people.
  5.  **Treat existing people fairly:** Avoid implying it's good to eliminate unhappy people.

  **Total Utilitarianism (TU)** fails at (2).
  **Average Utilitarianism (AU)** avoids (2) but fails spectacularly at (3), (4), and arguably (1) and (5).

  **That's why philosophers look for "Theory X":** They seek a principle that navigates *all* these problems without collapsing into absurdity. Critical Level Theories, Variable Value Theories, Person-Affecting Views, and others are attempts to find this elusive balance. None have achieved universal acceptance, hence the ongoing debate and the sense that the Repugnant Conclusion remains a profound challenge.

  **In summary:** You're absolutely right that switching to averages avoids the *specific* Repugnant Conclusion. Philosophers don't dismiss it; they thoroughly explored it and found it creates a different set of conclusions widely regarded as *even more* ethically problematic. The search is for a theory that avoids *both* the original RC *and* the nasty side effects of AU. That search is incredibly difficult, which is why Parfit considered it such a deep problem. Your intuition is spot on for the specific issue, but the rabbit hole of population ethics goes much deeper!
