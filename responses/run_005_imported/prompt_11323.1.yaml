  First, let's unpack their situation: The "disaster" was a classic spoiler effect—similar candidates split votes, letting an unpopular third candidate win with 34%. That's textbook plurality failure. Now the committee's split between RCV advocates (who believe it fixes strategic voting) and runoff supporters (who prioritize simplicity). 

