  Wait—the user mentioned freshmen comprehension. That's crucial. In a school setting, runoff's two-step simplicity might trump RCV's theoretical benefits. But RCV has momentum (used in Maine, Alaska, NYC), and students likely adapt faster than adults. 

  Alternative idea: Approval voting? Let voters choose multiple candidates equally. Simpler than RCV, eliminates spoilers, but has its own strategic quirks (e.g., bullet voting). Might be too radical for their committee though. 

  Recommendation pathway: Since the core problem was vote-splitting, RCV directly addresses that while runoff only treats the symptom. Should emphasize RCV's momentum in student elections (Harvard, Stanford use it) and provide concrete voter education plans to offset complexity concerns. The memo must decisively say "RCV is better despite minor strategic residues" because runoff's first-round issues are arguably worse. 

