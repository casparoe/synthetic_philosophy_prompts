  Hmm... the user mentions arguing with a friend all night, so this is really bugging them. They're not just skimming surface-level content - they're wrestling with the philosophy. And they're specifically annoyed by the standard "Omega would've predicted" rebuttal, calling it a dodge. That tells me they want the underlying mechanics dissected, not just the usual talking points.

  Let me structure this carefully. First, I should validate their intuition - because it IS logically consistent within standard causal decision theory. If we only consider actual outcomes (which is how humans naturally think), refusing the $100 when you know you're in heads makes perfect sense. No imaginary money should compel real payment.

