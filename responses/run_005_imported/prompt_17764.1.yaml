  Expanding this: The bridge is the only connection between the towns. Each has a long-standing rule: Kaelar always yields to those crossing from the west, while Thalor yields to those from the east. This creates a symmetrical conflict. When contact increases, collisions happen. Salience is disrupted because both precedents are equally strong. Expectations clash as each group assumes their norm is obvious. The story should show the breakdown of common knowledge and the struggle to establish a new convention.

  Characters: Aris from Kaelar and Toren from Thalor. They witness accidents and try to find a solution. Initial attempts to communicate fail because each assumes their way is the default. The crisis escalates, forcing them to experiment. They might try using physical markers (like painting lines) or signals (flags), but these are ignored. Then, an accident involving a child creates urgency. They realize that neither precedent is salient anymore, and they need a new focal point. They introduce a simple, neutral signal—a bell ring to indicate crossing. It starts with a few using it, catches on because it works, and becomes a new precedent. The story ends with the new convention in place, showing that salience can be artificially created when old precedents fail.

