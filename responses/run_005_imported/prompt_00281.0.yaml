prompt: |-
  I'm a PhD student in philosophy (working mostly in philosophy of language, but I TA an intro metaphysics course), and I've been trying to come up with material to make David Lewis's modal realism a bit more approachable to my undergrads before we dive into the technical apparatus of counterpart theory. During office hours last week, one of my students joked that modal realism is basically just "multiverse cosmology for people who are bad at physics," which got some laughs but also made me think there might be a genuinely good joke lurking in the neighborhood of indexicality, the "actual" world, and the sheer profligacy of Lewis's ontology.

  Could you write me a joke about modal realism that would land with someone who has actually read *On the Plurality of Worlds* (or at least the SEP summary)? I don't want something that's just a generic "haha philosophers believe weird things" joke—the humor should hinge on a real feature of the view, e.g., the indexical analysis of actuality, the modal realist's commitment to genuine (not merely abstract) possible worlds, the lack of any privileged world, or the weird deflationary sense in which "actually" just means "in this world." Bonus points if it could also work as a subtle jab at how modal realism trivializes the intuitive distinction between the possible and the actual.
