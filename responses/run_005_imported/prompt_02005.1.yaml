  The dialogue must avoid strawmen. Believer should concede some points (e.g., humans can't practically simulate alien psychologies) but hold that the *principle* compels moral consideration. Skeptic should grudgingly admit that under perfect rationality, cooperation *could* emerge—but stress how often real agents fail these ideals. 

