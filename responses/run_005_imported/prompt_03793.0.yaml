  First, their core question: why does having mom pay a phone fine feel socially acceptable while having a friend serve detention feels absurd? Both involve transferring punishment, but the reactions are polar opposites. That's a sharp observation—most people wouldn't even question the phone fine thing. 

  Hmm, the key differences seem to be in the nature of the punishments. Money is inherently transferable because it's impersonal and fungible. Detention is deeply personal—it's about your time and presence. You can Venmo cash but can't Venmo sitting in a room. 

  Also worth noting: the phone fine is transactional (fixed amount, no effort), while detention is experiential (time loss, boredom, reflection). That's why substituting the latter feels like cheating—it bypasses the intended discomfort. 

  The user might also be hinting at a deeper frustration: they didn't learn anything from the phone incident because mom paid without discussion. Smart kid—they're sensing that punishments should teach, not just penalize. 

