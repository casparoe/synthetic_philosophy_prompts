answer: |-
  You're absolutely **not** being irrational, and your friend is misunderstanding how probability works, especially with independent events. Your feelings of high confidence on individual questions combined with low confidence in a perfect score are **perfectly logical and mathematically sound**. Here's why:

  1.  **Independent Events:** Assuming each question is independent (knowing one answer doesn't affect knowing another), the probability of getting *all* questions correct is the product of the probabilities of getting *each individual* question correct.
  2.  **The Multiplication Rule:** This is the key concept your friend is missing.
      *   Let's use your lower confidence estimate: 90% sure per question. This means you estimate a 90% (or 0.9) chance of being correct on *each specific question*.
      *   The probability of getting **both** Question 1 *and* Question 2 correct is 0.9 * 0.9 = 0.81 (or 81%).
      *   The probability of getting **all three** of the first three correct is 0.9 * 0.9 * 0.9 = 0.729 (72.9%).
      *   **Now, scale this up to 100 questions:** The probability of getting all 100 correct is 0.9 multiplied by itself 100 times: 0.9¹⁰⁰.
  3.  **The Compounding Effect of Uncertainty:**
      *   **Calculating 0.9¹⁰⁰:** This is a very small number! Approximately **0.00002656** or **0.002656%**. That means, even with 90% confidence on each question, you'd only expect to get a perfect score roughly 1 time in every 37,649 attempts!
      *   **Using your higher estimate (95%):** 0.95¹⁰⁰ ≈ **0.00592** or **0.592%**. That's still less than a 1 in 169 chance of a perfect score.
  4.  **The Result:** Even though you were 90-95% confident on *each individual* question, the probability of getting *every single one* correct is vanishingly small (0.0027% to 0.592%). This aligns perfectly with your feeling that missing a few questions was inevitable.

  **Why your friend's logic is flawed:**

  1.  **Misapplying Individual Confidence to the Whole:** Your friend is incorrectly assuming that 90-95% confidence *per question* should translate to 90-95% confidence in a *perfect score*. This ignores the fundamental multiplication rule for independent events. Each question introduces a small element of uncertainty (5-10% chance of being wrong). While that uncertainty is small for one question, multiplying it across 100 questions makes the chance of *no uncertainty anywhere* extremely unlikely.
  2.  **Confusing "Most" with "All":** Being highly confident on each question *does* mean you expect to get *most* questions correct. If each question has a 95% chance of being right, your expected score is 95/100. However, "most" (e.g., 90+%) is very different from "all". The probability of getting *exactly* 99 right is much higher than getting *all* 100 right, even with high individual confidence.
  3.  **Ignoring Cumulative Risk:** Think of it like reliability engineering. If each component in a complex machine has a 95% chance of not failing in a year, the chance of the *entire machine* (with 100 critical components) having *zero failures* in a year is very low. Redundancy or expecting some failures is necessary.

  **Real-World Factors Reinforce This:**

  *   **Test Design:** Good multiple-choice tests include distractors designed to lure people who are *almost* certain but make a small mistake.
  *   **Human Factors:** Fatigue, misreading a question, second-guessing yourself, or simply having a minor brain lapse on 1 or 2 out of 100 questions is incredibly common, even for experts. Your 5-10% uncertainty per question likely accounts for this realistic possibility.
  *   **Overconfidence Calibration:** While you felt 90-95% confident, true calibration is hard. It's possible your *actual* accuracy per question was slightly lower (say 85-90%), making the chance of a perfect score even smaller. Your intuition that you probably missed a few is a healthy recognition of this.

  **Conclusion:**

  Your intuition is spot on and mathematically justified. It is **completely rational** to be:

  *   **Highly confident (>90%) on each individual question**, meaning you expect to get the vast majority correct.
  *   **Simultaneously very confident that you did NOT get a perfect score**, because the probability of avoiding *any* error across 100 independent questions, even with high per-question confidence, is extremely low.

  Your friend's argument fails to account for the way probabilities of independent events multiply. The tiny uncertainty on each question accumulates dramatically over many questions. You are thinking probabilistically correctly!
