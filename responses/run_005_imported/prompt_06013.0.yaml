answer: |-
  Below is a step-by-step explanation of Chalmers's test for verbal disputes, designed for clarity before students tackle the primary text. I'll start with the intuitive core, apply it to the composition dispute, and precisely locate the residual Hirsch-Sider disagreement post-test.

  ---

  ### **I. The Intuitive Gut-Level Idea: "The Neutral Language Test"**
  Imagine two people arguing over whether a "bank" has fish in it. Person A (a fisherman) says yes, pointing to a riverbank. Person B (a banker) says no, thinking of financial institutions. Their dispute *feels* substantive but collapses once they realize they mean different things by "bank." Chalmers's test generalizes this intuition:

  1. **The Core Insight**: A dispute is *merely verbal* if, when both parties **translate their claims into a perfectly neutral language** (free of the contested terms' ambiguities), their disagreement vanishes. If disagreement persists *even in this neutral framework*, the dispute is substantive.

  2. **Why "Stronger" Than Just "Meaning Different Things"?**  
     Merely observing that words have different meanings (e.g., "exists" means different things) doesn’t prove the dispute *lacks substance*. They might still disagree about the *world*, not just words. Chalmers’s test forces both sides to *reformulate their disagreement without the contested vocabulary*. If they *still* disagree after this translation, their conflict is about reality. If not, it’s verbal.

  ---

  ### **II. Applying Chalmers’s Test Step-by-Step to the Composition Dispute**
  **Contested Term**: "There exists an object composed of parts X."  
  **Rival Claims**:  
  - *Universalist (U)*: "For any set of objects, there exists a fusion."  
  - *Restrictivist (R)*: "Only some sets of objects (e.g., causally integrated ones) have a fusion."

  #### **Step 1: Identify the Neutral Base Vocabulary**
  Chalmers proposes a "semantically neutral" language describing reality *without* ontological terms like "object" or "exists." This base vocabulary includes:  
  - Physical properties (e.g., *mass*, *charge*, *spatiotemporal relations*).  
  - Logical/structural terms (e.g., *and*, *not*, *for all*).  
  - Patterns or arrangements: Descriptions like *"there are particles arranged chairwise"* or *"there are particles arranged sand dune-wise"*.

  #### **Step 2: Translate Both Claims into Neutral Terms**
  - **Universalist (U) in Neutral Terms**:  
    "For any arbitrary collection of particles arranged in any pattern P, there is a corresponding *pattern P* in the world."  
    *(Note: U isn’t asserting a new *object*—just that the arrangement itself is real.)*

  - **Restrictivist (R) in Neutral Terms**:  
    "Only for *some* patterns P (e.g., causally integrated ones) is there a corresponding pattern in the world."  
    *(Note: R isn’t denying arrangements—they’re denying that *all patterns* are real in the same way.)*

  #### **Step 3: Check for Residual Disagreement**
  - **If U and R agree** that *all patterns P are equally real* (just patterns!), but U calls some patterns "objects" while R reserves "object" for special patterns → **dispute is verbal**.  
    *(They describe the same world with different words.)*

  - **If U and R disagree** about whether *all patterns P are real* → **dispute is substantive**.  
    *(They genuinely describe different worlds.)*

  #### **The Twist: What Both Sides *Should* Agree On**
  Chalmers argues that after neutral translation:  
  - U and R **both accept** all the same patterns (scattered particles, integrated wholes, etc.) as real arrangements.  
  - Their only difference is whether to *label* every pattern as an "object" (U) or only some (R).  
  - Thus, the dispute **dissolves**: It’s a conflict over linguistic preferences, not reality.

  ---

  ### **III. Where Hirsch and Sider Re-Enter: The Metaontological Divide**
  Chalmers’s test *suggests* the dispute is verbal, but Hirsch and Sider clash over **why** and **what follows**. Crucially, **Sider does not dispute Chalmers’s test**—he relocates the substantive disagreement:

  | **Hirsch (Quantifier Variance)**                                                                 | **Sider (Joint-Carving Quantifier)**                                                                 |
  |--------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|
  | **Accepts Chalmers’s Test Result**: Yes, the dispute is merely verbal. Ordinary "exists" has multiple equally legitimate meanings. | **Accepts Chalmers’s Test Result for Ordinary Language**: Yes, *in everyday terms*, the dispute is verbal. But... |
  | **No Further Dispute**: All quantifier meanings are metaphysically equal. No "deeper" reality to uncover. | **Relocates the Dispute**: There is a privileged "joint-carving" quantifier (**Ontologese**) that describes *fundamental structure*. |
  | **Conclusion**: Metaphysics should dissolve such disputes.                                        | **Conclusion**: The *real* question is whether Ontologese quantifies over fusions. **This dispute is substantive.** |

  #### **The Crucial Distinction**
  - **Chalmers vs. Hirsch**: Chalmers’s test is *compatible* with quantifier variance but doesn’t *require* it. Chalmers remains neutral on whether quantifier variance is true—his test only diagnoses verbality *in a given language*.  
  - **Sider’s Move**: He grants Chalmers that the *ordinary-language* dispute is verbal but insists:  
    > *"There is still a substantive disagreement about which quantifier meaning **carves reality at its joints**. Universalism is true in Ontologese, and that’s what matters for metaphysics."*  

  #### **Why Students Get This Wrong**
  They conflate two questions:  
  1. **Q1 (Chalmers’s Test)**: Is the dispute verbal *in natural language*?  
     → *Answer (Chalmers/Hirsch/Sider)*: **Yes**.  
  2. **Q2 (Sider’s Addendum)**: Is there a privileged quantifier meaning that settles the dispute *fundamentally*?  
     → *Hirsch*: No.  
     → *Sider*: Yes—and **this is where the real substance lies**.

  ---

  ### **Key Takeaway for Students**
  Chalmers’s test doesn’t prove quantifier variance; it isolates verbal disputes by forcing neutral translation. In the composition case, it shows the dispute *in ordinary English* is verbal. But Sider argues this is irrelevant to metaphysics: the substantive battle is over which quantifier is **fundamental** (Ontologese). Hirsch denies such fundamentality exists. Thus:  
  - **Chalmers** and **Hirsch** agree the *surface dispute* is verbal.  
  - **Sider** agrees too—*but only on the surface*. For him, the deep disagreement survives in Ontologese.  

  This preserves Chalmers’s neutrality: his test diagnoses verbality without endorsing quantifier variance or fundamentality. Sider exploits this by pushing the dispute "upstairs" into metametaphysics.
