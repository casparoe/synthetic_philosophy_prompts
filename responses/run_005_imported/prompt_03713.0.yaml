                  = 0.1*(S-5) + 0.9*[0.01*(-1005) + 0.99*95]
                  = 0.1(S-5) + 0.9*(-10.05 + 94.05)
                  = 0.1S - 0.5 + 0.9*84
                  = 0.1S - 0.5 + 75.6 = 0.1S + 75.1

