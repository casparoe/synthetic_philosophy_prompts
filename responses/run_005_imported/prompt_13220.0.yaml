answer: |-
  You're absolutely right to feel conflicted - this situation touches on complex dynamics of generosity, expectations, and reciprocity. **Both perspectives have some validity, but your friend's reaction (especially the sense of entitlement) crosses a line.** Here's a breakdown:

  1.  **Your Generosity Was Genuine & Voluntary (Your Point is Strong):**
      *   **No Formal Agreement:** You initiated these acts out of kindness, not obligation. There was no explicit contract or promise of permanence.
      *   **Gifts, Not Debts:** Thoughtful gestures like airport runs or organizing events are gifts of your time and energy. The recipient doesn't "earn" a right to future gifts simply because they received past ones.
      *   **Changing Capacity is Human:** Life circumstances, energy levels, and priorities naturally shift. Needing to step back from *voluntary* extras is completely reasonable and doesn't negate your past kindness.
      *   **Entitlement is Toxic:** Your friend saying people are "entitled to count on it" is the core problem. Gratitude is the appropriate response to generosity, not entitlement. This attitude turns your kindness into an expected service.

  2.  **Your Friend's Point About Reliability & Expectation (A Sliver of Validity, Poorly Expressed):**
      *   **Patterns Create Implicit Expectations:** Humans are pattern-recognition machines. When you consistently do something kind for *years*, it's natural for people to unconsciously come to expect it. It becomes part of their mental model of how the group functions.
      *   **Sudden Change Can Cause Disruption:** Pulling back abruptly *can* cause practical inconvenience and emotional surprise, especially if the person had genuinely come to rely on that pattern (even if they shouldn't have *assumed* it).
      *   **"No Warning" Aspect:** While not required, communicating a shift in your capacity *before* a specific request arises can be kinder and prevent situations like this. (Though her request *was* the trigger, making "warning" tricky).

  **Why Your Friend's Reaction is Problematic (Even with the Sliver of Validity):**

  1.  **The "Entitled" Language:** This is the biggest red flag. Framing your past generosity as something that creates an *entitlement* to future service is fundamentally disrespectful of your autonomy and kindness. It transforms a gift into a debt.
  2.  **Lack of Appreciation:** Instead of expressing gratitude for the countless times you *did* help, she focused on the *one* time you couldn't, framing it as a failing on your part. This feels deeply ungrateful.
  3.  **Ignoring Your Reason:** You were "wiped out." A true friend's first response should have been concern for *you*, not annoyance about the inconvenience.
  4.  **No Reciprocity Mentioned:** Did she ever express concern about *your* well-being? Offer to help *you*? Organize something for *your* birthday? Her reaction suggests she sees this as a one-way street.

  **The Core Issue: Unspoken Expectations & Imbalance**

  *   You generously created a pattern of support.
  *   Your friends (or at least this one) internalized this pattern as an unspoken rule or entitlement.
  *   There seems to be a significant lack of reciprocity – not necessarily in identical tasks, but in equivalent care, effort, and appreciation directed back towards you.
  *   When you finally hit your limit and enforced a boundary (saying no), the underlying imbalance and unspoken expectations exploded.

  **What This Means & What To Do:**

  1.  **You Are NOT Obligated:** Legally, morally, or socially, you are not bound to continue these voluntary acts indefinitely because you did them in the past. **You are "in the clear" in terms of having broken any real promise or obligation.**
  2.  **Your Friend DOES Have a Point About Patterns & Expectations (But Not Entitlement):** Humans do get used to patterns. While her *entitlement* is wrong, the *surprise and disappointment* stemming from a long-standing pattern changing suddenly is a real human reaction (though poorly handled by her). This doesn't mean you have to keep doing it, but it explains the friction.
  3.  **The Problem is the Entitlement and Lack of Reciprocity:** This is what you should address.
  4.  **Actions to Consider:**
      *   **Reflect on the Dynamic:** Honestly assess the reciprocity in the group. Is this one friend, or is the whole group taking you for granted?
      *   **Have a Calm Conversation (With the Friend or Group):** "I need to talk about something that's been bothering me. I love doing things for you guys, like the airport runs or birthdays, and I've been happy to do them. But last weekend made me realize some expectations have built up that I didn't intend. Those things were always choices I made in the moment because I wanted to help, not commitments I signed up for forever. When I couldn't do the airport run because I was exhausted, [Friend's Name]'s reaction made me feel like my past help was seen as an entitlement, rather than a gift. That really hurt. I need you to understand that my capacity changes, and saying 'no' sometimes doesn't mean I care any less. It also made me realize I'd love to see more mutual support flowing around the group – it would mean a lot to feel cared for in that way too."
      *   **Reset Expectations:** "Going forward, please don't assume I'm always available for [specific tasks, like airport runs]. Ask me, and understand that sometimes the answer might be no, and that's okay. It doesn't reflect on how much I value our friendship."
      *   **Practice Saying No Gracefully (Without Over-Justifying):** "I'm so sorry, I'm completely wiped out that day and just can't manage the airport run." or "I need to focus on recharging this weekend, so I won't be able to organize X this time."
      *   **Step Back Strategically:** Consciously reduce the "extra" things you do for a while. See if others step up. Notice who checks in on *you*.
      *   **Focus on Reciprocity:** Invest your energy more in friendships where care and effort feel mutual.

  **In short:** Your friend is wrong about the entitlement. Her hurt feelings based on disrupted expectation might be understandable on a human level, but her *expression* of it (accusation, entitlement, lack of appreciation) was unfair and hurtful. You have every right to set boundaries around your voluntary generosity. Use this as an opportunity to reset the dynamic towards something more balanced and reciprocal. True friendship shouldn't make you feel like an unpaid, unappreciated service provider.
