  I've been reading about the Vienna Circle lately just for fun (no philosophy background here, just enjoy this stuff), and it turns out Carnap wasn't only a logic guy - by his own account most of the Circle, him included, were some flavor of socialist, he was big into pacifism and internationalism and even wrote stuff pushing for world government, and he genuinely thought careful logical/scientific thinking was the best tool going for fixing society's problems, not just physics. Meanwhile his friend Neurath was literally trying to figure out how to plan a whole economy "in kind" (physical units instead of prices) to dodge the socialist calculation problem.

  So what do you reckon Carnap would make of todays AI hype about using huge models and compute to finally crack that same calculation problem and plan economies/policy better than messy markets or democratic debate? Would he see it as the Circle's dream coming true, or would the fact that he had to leave Europe as fascism rose make him nervous about handing that kind of planning power to some opaque system nobody can really check? Try to actually ground it in specifics of what he believed, not just vibes.
