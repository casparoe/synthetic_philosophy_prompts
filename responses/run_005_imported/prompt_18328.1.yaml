prompt: |-
  I'm teaching a graduate seminar on medieval political philosophy this term, and last week we spent a long session picking apart Aquinas's actual position on tyrannicide -- De Regimine Principum, the relevant bit of his commentary on the Sentences, and the question on sedition in the Summa. What struck the class is how much more cautious he actually is compared to the "Aquinas said its fine to kill bad kings" version that gets passed around in intro classes -- he's pretty wary of private individuals taking it on themselves to kill a tyrant, seems to want any deposing done by whatever public authority set the ruler up in the first place, and keeps circling back to the worry that a botched or unauthorized tyrannicide could produce more disorder and suffering than the tyranny it's replacing.

  That's the background for a question one of my students asked that I couldn't answer well on the spot, and it's been bugging me since. Say a tyrant today gets taken out by a drone strike ordered by some other country's government, maybe with a nod of approval from the UN Security Council -- so not a lone assassin, but also not any authority that the tyrannized population itself set up or answers to. Does that count as the kind of "public authority" action Aquinas thinks can licitly depose a tyrant, given that his own examples all seem to assume some authority internal to the same community (a council, the barons, a liege lord within the same political order)? Or is a foreign power acting on a population's behalf just a structurally different case that his framework doesn't really have the resources to adjudicate one way or another? I'd love an answer that actually works through how his argument hangs together rather than just citing the "yes tyrannicide can be ok" headline.
reasoning: |-
  Okay, the user is teaching a graduate seminar on medieval political philosophy, specifically focusing on Aquinas's position on tyrannicide. They've covered texts like De Regimine Principum, his commentary on the Sentences, and the Summa. The class noticed that Aquinas is more cautious than the simplified version often taught in intro classes. Aquinas emphasizes that private individuals shouldn't take matters into their own hands, and any action should be taken by the public authority that established the ruler. He's worried about the potential for greater disorder if tyrannicide is botched or unauthorized.

  Now, the student's question is about a modern scenario: a foreign government using a drone strike to kill a tyrant, possibly with UN Security Council approval. The user wants to know if Aquinas would consider this a legitimate "public authority" action, given that his examples are all internal authorities like councils or barons. The user needs a thorough analysis based on Aquinas's arguments, not just a superficial answer.

  First, I need to recall Aquinas's key principles. He distinguishes between private individuals and public authorities. Private citizens can't act on their own because they lack the authority, and such actions could lead to chaos. The public authority that originally instituted the ruler has the right to depose them. The common good is central: any action must serve the community's welfare, not cause more harm.

  The modern scenario involves external actors: a foreign government and possibly the UN. Aquinas's framework is built on the idea of an internal authority. So, does a foreign power acting with international approval fit? The UN Security Council might be seen as a global authority, but Aquinas's concept of authority is tied to the political community itself. He mentions higher authorities like the emperor over a king, but that's within a hierarchy, not external entities.

  Aquinas is cautious about disorder. Even if a tyrant is removed, if the process isn't legitimate, it might lead to more instability. A drone strike by a foreign power could exacerbate conflict or undermine local sovereignty, leading to more suffering. The principle of proportionality matters: the action shouldn't cause more harm than the tyranny.

  The student's question touches on whether Aquinas's framework can handle external intervention. His texts don't address this directly, as medieval political structures were different. However, his emphasis on the originating authority and the common good suggests that external actors lack the legitimacy unless they are part of a recognized hierarchy. The UN might be an analog to a higher authority, but it's not the same as the community's own structures.

  The user probably wants to show students how to apply historical frameworks to modern issues. They need an analysis that respects Aquinas's principles while addressing the scenario's complexities. The deeper need is to foster critical thinking about political authority and intervention, using Aquinas as a foundation but acknowledging the limitations of applying medieval thought to contemporary geopolitics.
answer: |-
  That's an excellent and sophisticated question from your student – one that cuts to the heart of Aquinas's political metaphysics and the limitations of applying medieval frameworks to modern international relations. Aquinas wouldn't recognize the concept of a "UN Security Council" or "drone strike," but we can rigorously apply his core principles to this scenario. The answer leans heavily towards "no," this would *not* constitute legitimate "public authority" action in Aquinas's eyes, for several interlocking reasons drawn from his argumentative structure:

  1.  **The Primacy of the *Communitas Perfecta* (Perfect Community) and its Originating Authority:**
      *   Aquinas's entire framework for legitimate deposition hinges on the authority stemming from the *same political community* suffering under the tyranny. The "public authority" he references (whether "the multitude," "the barons," "a council," or a "superior" like an Emperor over a King) is *internal* to the political order, or at least part of a recognized hierarchical structure *within* which that community exists (e.g., the Empire over a Kingdom).
      *   **Key Argument:** The authority to depose derives from the same source as the authority to institute. As he states in *De Regimine Principium* (I, 6): "...he who has the right to provide for the multitude has the right to **remove the king** whom he has set up." The foreign power or UN did *not* set up the ruler of the tyrannized community; they are fundamentally *external* actors. Their authority, even if internationally recognized, does not originate from *this specific* *communitas perfecta*.

  2.  **The Nature of Authority and the Common Good:**
      *   Political authority, for Aquinas, exists *for the sake of the common good of a specific community* (ST I-II, Q90, A2; De Reg. I, 1). The deposing authority must act *for that specific common good* and be *accountable* to that community or its legitimate representatives within the established order.
      *   **Key Argument:** A foreign power, even acting with ostensibly good intentions or UN approval, acts based on *its own* conception of the good, international order, strategic interests, or a generalized notion of human rights – *not* necessarily the specific, concrete common good of the tyrannized community *as understood and pursued internally*. The UN Security Council represents the international community's *collective* interest in peace/security, not the *internal* common good of the specific nation-state in question. This lack of intrinsic orientation towards *this particular* common good disqualifies it as the "public authority" Aquinas envisions.

  3.  **The Peril of Disorder and the "Worse Tyranny" Argument:**
      *   Aquinas's profound caution stems from his core principle: any action must be judged by whether it serves the common good or risks greater evil (ST II-II, Q42, A2 ad 3). Unauthorized or botched removal creates chaos worse than the tyranny.
      *   **Key Argument Applied:** Foreign intervention, *especially* violent intervention like a drone strike, carries immense risks of *increased* disorder from Aquinas's perspective:
          *   **Lack of Legitimacy:** The action lacks the *internal* legitimacy crucial for stable succession. It may be seen as foreign conquest or neo-colonialism, fueling resentment and resistance, potentially leading to civil war or a power vacuum filled by worse actors.
          *   **Ignorance of Context:** External actors are inherently less capable of understanding the complex social, political, and historical dynamics necessary to ensure a stable transition *tailored to that community*. Aquinas's internal authority (council, barons) presumably possesses this contextual knowledge.
          *   **Accountability:** The foreign power/UN is not accountable *to the tyrannized population* in the way an internal authority (even an elite one) would be. They can leave chaos behind with impunity.
          *   **Proportionality:** Aquinas insists the remedy must not be worse than the disease. A drone strike causing collateral damage, triggering wider conflict, or installing a puppet regime favored by the intervener but not by the populace *exactly embodies* the "worse disorder" he fears more than enduring a known, perhaps containable, tyrant.

  4.  **The Problem of "Acting on Behalf Of":**
      *   The student's phrasing "acting on a population's behalf" is crucial. Aquinas's framework has *no mechanism* for an external entity to legitimately claim this role. Who determines if the foreign power *truly* acts "on behalf of" the population? Not the population itself through any established internal process Aquinas would recognize. The UNSC claim rests on international law and power politics, not on the organic authority structure *of the community itself*.
      *   **Key Argument:** For Aquinas, representation flows from *within* the community's structure. An external power claiming to act "on behalf of" a population bypasses this entirely, imposing an external will. This is structurally alien to his conception of legitimate political action.

  **Conclusion & Nuance:**

  Within Aquinas's explicit framework and core principles, **a foreign government or UNSC-ordered drone strike to kill a tyrant would *not* constitute the legitimate exercise of "public authority" required for licit tyrannicide.** It fails on the fundamental grounds of:
  *   **Lack of Originating Authority:** They didn't institute, so they can't licitly depose.
  *   **Misalignment of Common Good:** They act for external/international goods, not the internal *bonum commune* of the specific community.
  *   **High Risk of Greater Disorder:** The inherent dangers of external violence and lack of contextual legitimacy precisely trigger Aquinas's deepest cautions.
  *   **Illegitimate Representation:** The claim to act "on behalf of" lacks grounding in the community's own authoritative structures.

  **However, the student brilliantly highlights a gap:**

  1.  **The "Higher Authority" Question:** Aquinas *does* allow for a "superior" (like an Emperor) to depose a tyrannical king. Could the UNSC be seen as a modern, secular "emperor" in an international hierarchy? *Potentially, but weakly.* Aquinas's superiors existed within a *recognized, organic, hierarchical political order* (Christendom/Empire). The modern international system of sovereign states lacks this. The UNSC is a treaty-based body of powerful states, not a sovereign *imperium* recognized as having *inherent* authority over member states akin to an Emperor over vassals. Its authority is delegated and limited by its Charter, not organic and hierarchical in the medieval sense Aquinas assumes. Its claim to be a "higher authority" is contested and fundamentally different in kind.
  2.  **"Structural Difference" Acknowledgement:** The student is absolutely correct that the modern scenario is "structurally different." Aquinas's framework *lacks the resources* to neatly adjudicate this because it presupposes a world of nested authorities within a single overarching (if fragmented) political-theological order (Christendom). The Westphalian system of sovereign equality fundamentally challenges this model. Aquinas provides no clear mechanism for legitimate *external* intervention, even for tyranny, because the concept of fully independent, sovereign states interacting as equals wasn't his reality.

  **In essence:** While Aquinas *might* theoretically allow for a *truly universal, legitimate sovereign* (like a universally recognized Emperor or, in his theology, God) to act against any tyrant, he would *not* recognize a foreign state or even the contemporary UNSC as possessing that kind of inherent, organic authority over another distinct *communitas perfecta*. The drone strike scenario falls outside the bounds of licit tyrannicide as Aquinas constructs it, precisely because it violates the foundational link between the deposing authority and the specific political community suffering the tyranny. His framework suggests such an action would likely constitute an illicit act of aggression or war, carrying the high risk of the very "worse disorder" he so feared. The burden of proof for legitimacy, within his logic, rests *entirely* on demonstrating an internal or organically superior authority acting for the *specific* common good – a burden a foreign drone strike cannot meet.
