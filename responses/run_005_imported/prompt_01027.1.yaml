  Hmm, this is a classic mix-up that many students encounter when first studying Lewis. The key is realizing Lewis held two distinct positions simultaneously: (1) conditionals do express propositions (specifically material conditionals), but (2) those propositions cannot satisfy the Equation. The user seems to have missed that first commitment because later philosophers (like Adams) used Lewis's proof to argue against propositional content altogether.

  I should emphasize Lewis's actual position: he stubbornly maintained that "if A, C" is just "not-A or C" despite his own triviality proof showing this can't match conditional probabilities. His solution was to reject the Equation as a requirement for rational belief, not to abandon propositions. The user's sources probably group him with Grice/Jackson because they all defend truth-conditional approaches (unlike Adams/Edgington), even if Lewis's version has this paradox.

