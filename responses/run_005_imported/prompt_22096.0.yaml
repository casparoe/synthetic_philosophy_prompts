  - **C tier**: Hamkins' multiverse view. It is compelling to some because it reflects the practice of forcing, but it abandons the idea of a unique truth for CH. For those who are realists, this is a drawback. It is a dissolution rather than a solution.

  - **D tier**: Freiling's axiom. While intuitively appealing to some, it has been heavily criticized and is not taken very seriously by most set theorists. It seems to beg the question.

