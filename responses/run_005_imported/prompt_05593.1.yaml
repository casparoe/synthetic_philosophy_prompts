  For Cohen's argument: It's essentially that Nozick's liberty-based objection to patterned principles applies equally to any property system. By focusing only on redistribution as "interference," Nozick implicitly treats existing property rules as natural/default - a bias Cohen calls "conservative." The key move is showing that stability ≠ non-interference.

  Does it break Nozick? Not fatally, but it forces libertarians into a corner: They must either concede that all property systems involve coercion (undermining the liberty argument) or argue that enforcing property rights isn't really "interference" (which requires defending private property as pre-political). 

