answer: |-
  You've nailed the core confusion! The Pasadena Paradox is brilliant precisely because summing the terms in the "natural" order (n=1,2,3...) *does* give you a finite number (ln(2) ≈ $0.693), making "undefined" seem absurd. But the "why" hinges on a deep requirement for expected value that goes beyond just getting a finite sum in one specific order. **The issue is that the expected value sum must be "absolutely convergent," not just "conditionally convergent."** Let's break down why this matters logically.

  **1. The Setup & The Naive Sum:**

  *   **Probability of first head on flip `n`:** `(1/2)^n`
  *   **Payoff for first head on flip `n`:** `(-1)^(n+1) * (2^n) / n`
  *   **Expected Value Calculation:**
      `E = Σ [Probability(n) * Payoff(n)]` from `n=1` to `∞`
      `E = Σ [ (1/2)^n * (-1)^(n+1) * (2^n) / n ]` from `n=1` to `∞`

  Simplify the terms inside the sum:
  `(1/2)^n * 2^n = (2^n / 2^n) = 1`
  So the sum becomes:
  `E = Σ [ (-1)^(n+1) * (1) / n ]` from `n=1` to `∞`
  `E = Σ (-1)^{n+1} / n` (The Alternating Harmonic Series)

  *   **Summing in Natural Order (n=1,2,3...):**
      `n=1:` `(+1)/1 = +1.000`
      `n=2:` `(-1)/2 = -0.500` (Partial Sum = 0.500)
      `n=3:` `(+1)/3 ≈ +0.333` (Partial Sum ≈ 0.833)
      `n=4:` `(-1)/4 = -0.250` (Partial Sum ≈ 0.583)
      `n=5:` `(+1)/5 = +0.200` (Partial Sum ≈ 0.783)
      ... and this partial sum *does* converge to `ln(2) ≈ $0.693`.

  **2. So Why Isn't ln(2) the Answer? The Problem with Rearrangement**

  The fatal flaw is revealed when you realize that **the concept of expected value *must* be independent of how we happen to list the possible outcomes.** The value of the game shouldn't change if we relabel flip sequences or change the order in which we consider the payoffs in our calculation. Expected value is supposed to be a fundamental property of the game itself.

  *   **Conditional Convergence:** The alternating harmonic series `Σ (-1)^{n+1}/n` is *conditionally convergent*. It converges to ln(2) when summed in the order `n=1,2,3,...`. However, its convergence depends *crucially* on the precise alternating pattern of positive and negative terms canceling each other out gradually.
  *   **Riemann's Rearrangement Theorem:** This powerful theorem states that for any conditionally convergent series (one that converges but `Σ |a_n|` diverges - here `Σ |(-1)^{n+1}/n| = Σ 1/n`, the harmonic series, *does* diverge!), you can rearrange the order of the terms to make the series converge to *any* real number whatsoever, or even make it diverge to +∞ or -∞.

  **3. Rearrangement in Action: Breaking ln(2)**

  Let's see how rearranging the terms changes the expected value sum for the Pasadena game. Remember, mathematically, rearranging the summation order corresponds to considering the same possible outcomes (first head on flip `n`), but grouping them differently in the calculation.

  *   **Rearrangement 1: Chasing Positive Infinity**
      Strategy: Take positive terms in chunks, then negative terms in chunks, making the positive chunks slightly larger/faster than the negative chunks.
      *   Group 1: `1/1` (+1.000) *Partial Sum = +1.000*
      *   Group 2: `-1/2` (-0.500) *Partial Sum = +0.500*
      *   Group 3: `+1/3 + 1/5` (≈0.333 + 0.200 = +0.533) *Partial Sum ≈ +1.033*
      *   Group 4: `-1/4 -1/6` (≈ -0.250 - 0.167 = -0.417) *Partial Sum ≈ +0.616*
      *   Group 5: `+1/7 + 1/9 + 1/11` (≈0.143 + 0.111 + 0.091 ≈ +0.345) *Partial Sum ≈ +0.961*
      *   Group 6: `-1/8 -1/10 -1/12` (≈ -0.125 - 0.100 - 0.083 ≈ -0.308) *Partial Sum ≈ +0.653*
      *   Group 7: Take the next *4* positive terms (`1/13 + 1/15 + 1/17 + 1/19 ≈ 0.077+0.067+0.059+0.053≈0.256`)
      *   Group 8: Take the next *3* negative terms (`-1/14 -1/16 -1/18 ≈ -0.071 -0.063 -0.056 ≈ -0.190`) *Partial Sum ≈ +0.719*
      *   **Continue:** Keep taking slightly larger chunks of positive terms followed by slightly smaller chunks of negative terms. The partial sums will keep *growing* over time because you're consistently adding slightly more positive "density" than negative "density". The partial sums will diverge to **+∞**.

  *   **Rearrangement 2: Chasing Negative Infinity**
      Reverse the strategy: Take slightly larger chunks of *negative* terms followed by slightly smaller chunks of positive terms. The partial sums will diverge to **-∞**.

  *   **Rearrangement 3: Chasing $100**
      Riemann's theorem says you can make it converge to *any* number, say $100. This requires a more delicate balancing act, consistently adding groups of terms that push the partial sum closer and closer to 100.

  **4. Why This Logically Breaks Expected Value**

  This is the critical point: **All these rearrangements correspond to valid calculations of the expected value formula `Σ Probability * Payoff`.** We are summing over *all possible outcomes* (first head on flip 1, flip 2, flip 3, etc.), each with their correct probability and payoff. We haven't omitted any outcomes or changed their probabilities or payoffs. We've *only* changed the *order* in which we add them up.

  *   **Natural Order:** Suggests E = ln(2) ≈ $0.69
  *   **Rearrangement 1:** Suggests E = +∞
  *   **Rearrangement 2:** Suggests E = -∞
  *   **Rearrangement 3:** Suggests E = $100

  **Logically, the "expected value" of the game cannot simultaneously be $0.69, infinity, negative infinity, *and* $100.** These are fundamentally different answers describing the same game. This is a catastrophic inconsistency.

  **5. The Core Principle: Absolute Convergence**

  The requirement for absolute convergence (`Σ |Probability(n) * Payoff(n)| < ∞`) exists precisely to prevent this nightmare scenario. It guarantees two crucial things:

  1.  **Invariance under Rearrangement:** If the sum of absolute values converges, then *any* rearrangement of the terms will converge to the *same* finite value. The order of summation doesn't matter. The expected value is a stable, well-defined property of the game.
  2.  **Agreement with Other Interpretations:** Absolute convergence ensures that expected value aligns with the "long-run average" interpretation from the Law of Large Numbers. If you played the game infinitely many times, the average payoff per game *would* converge to the expected value. Without absolute convergence, this link breaks – the average payoff might not converge at all, or its behavior could depend on the order of the games!

  **In the Pasadena Paradox:**

  *   The *conditional* convergence of the sum in the natural order (`Σ (-1)^{n+1}/n -> ln(2)`) is mathematically real but **misleading** for expected value.
  *   The **absolute** series diverges (`Σ |(-1)^{n+1}/n| = Σ 1/n = ∞`).
  *   Because the absolute series diverges, the rearrangement theorem applies, allowing us to get *any* sum by changing the order.
  *   Therefore, there is **no single, consistent value** we can assign as the expected value of the game. Its value depends entirely on the arbitrary choice of how we sum the terms. This violates the fundamental requirement that expected value be a unique property inherent to the game itself.

  **Conclusion: Why "Undefined" is the Only Logical Verdict**

  The verdict "undefined" isn't a mathematical cop-out; it's a rigorous consequence of the game's structure. While summing in the natural order gives you ln(2), that result is **fragile and arbitrary** because it relies entirely on the specific alternating order of payoffs coinciding with the order of summation. Change the summation order (which is logically permissible and corresponds to different ways of grouping the same possible outcomes), and you get wildly different, contradictory answers. Since there is no order-independent, unique sum that represents the average payout considering *all* outcomes fairly, the expected value **cannot be defined**. The paradox highlights that conditional convergence, while mathematically interesting, is insufficient for the robust, unique definition required for expected value in probability theory. The divergence of the absolute series (`Σ 1/n = ∞`) is the mathematical red flag that warns us this instability exists.
