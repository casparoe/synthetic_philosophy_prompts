answer: |-
  Ah, the problem of old evidence! A truly fascinating and persistent thorn in the side of Bayesian confirmation theory. Your physicist's intuition is spot-on – the Mercury perihelion precession *is* a paradigmatic example of powerful confirmation using "old" evidence, yet the naive Bayesian calculation seems to say it *shouldn't* work if P(E) = 1. You're right to feel neither bullet is palatable. Dismissing the historical significance of Mercury for GR feels absurd, but abandoning Bayesianism entirely seems like throwing the baby out with the bathwater. Fortunately, there are ways to *dodge* both bullets. The Bayesian framework is more flexible than the initial formulation suggests.

  Here's the breakdown:

  1.  **The Core Problem (Glymour's Challenge):**
      *   **Setup:** You have evidence E (e.g., Mercury's anomalous precession) that is already known with certainty. So `P(E) = 1`.
      *   **New Theory:** A new theory H (e.g., GR) is proposed, and it's discovered that H entails E (`H ⊨ E`).
      *   **Bayes' Theorem:** `P(H|E) = [P(E|H) * P(H)] / P(E)`
      *   **The Issue:**
          *   Since `H ⊨ E`, then `P(E|H) = 1`.
          *   Since E is known for certain, `P(E) = 1`.
          *   Plugging in: `P(H|E) = [1 * P(H)] / 1 = P(H)`.
      *   **Conclusion:** Learning that H entails E provides *no increase* in the probability of H. The old evidence E cannot confirm H. This contradicts the strong intuition (and historical practice) exemplified by Mercury and GR.

  2.  **Why Mercury Feels Like a Counterexample:**
      *   Astronomers (like Le Verrier) knew the precession (E) was real and unexplained by Newtonian mechanics for decades.
      *   Einstein developed GR (H) *without* initially aiming to solve Mercury. When he calculated GR's prediction for Mercury (`H ⊨ E`) and saw it matched the known anomaly *exactly*, it was a **profound moment of confirmation** for him and the physics community.
      *   Intuitively: Before GR, Mercury's orbit was an anomaly, a problem. After GR explained it, Mercury became a *success* for the new theory. This shift feels like significant confirmation. The Bayesian calculation above says it shouldn't.

  3.  **Biting the Bullets? (Neither is Necessary)**
      *   **Bullet 1: Physicists were wrong.** This seems historically and scientifically indefensible. The explanation of Mercury *was* a major reason GR was taken seriously. Dismissing this confirmation seems to ignore the actual dynamics of scientific reasoning.
      *   **Bullet 2: Bayesianism is broken.** While the problem highlights a genuine challenge, discarding the entire Bayesian framework seems premature and loses its many powerful insights into reasoning under uncertainty, belief updating, and hypothesis comparison.

  4.  **Dodging the Bullets: Resolving the Problem within (or extending) Bayesianism**
      The key insight is that when scientists say "E confirms H" in the context of old evidence, they aren't *just* learning `E` (they already know that). They are learning something *new* about the *logical relationship* between `H` and `E`. Several solutions capture this:

      *   **Solution 1: Learning the Logical Connection (Garber, Jeffrey, Niiniluoto):**
          *   The crucial new evidence isn't `E` itself, but the proposition `L`: "H logically entails E" (`H ⊨ E`).
          *   Before Einstein formulated GR and performed the calculation, physicists *did not know* that GR entailed the precise Mercury precession. They knew E, but `P(L)` was **not** 1. Maybe they thought GR *might* explain it, but they weren't certain.
          *   **The Bayesian Update:** The scientist updates their beliefs *on learning L*. The relevant probability is `P(H|L, E)`.
          *   **Crucially:** `P(L | H, E)` is usually very high (if H is true and E is true, it's likely H entails E, though deductive certainty might need careful handling). `P(L | ~H, E)` is often much lower (if H is false, it's less likely that H would just happen to entail the true E, especially if E is surprising or complex).
          *   **Result:** Learning `L` ("GR entails the Mercury precession") *can* significantly increase `P(H | E, Background)`, even though `E` was already known. The confirmation comes from learning the *explanatory connection*, not from learning `E` itself. This perfectly matches the historical experience: Einstein's *calculation* linking GR to Mercury was the confirmatory event.

      *   **Solution 2: Counterfactual or "Tempered" Credence (Howson, others):**
          *   Ask: "What would my degree of belief in `H` be *if I didn't already know E*?" (or "if I hadn't conditioned on E yet"?).
          *   In this counterfactual state, `P_cf(E)` is **not** 1. It might be quite low, especially if E is surprising under the background theory (Newtonian gravity couldn't explain it!).
          *   Now, learning that `H ⊨ E` *would* dramatically increase the counterfactual `P_cf(H|E)` via standard Bayesian conditioning.
          *   The argument is that this counterfactual support justifies the *actual* increase in confidence scientists felt. We recognize that *if* E had been unknown, it *would have been* strong evidence for H; therefore, it *is* strong evidence for H, even though we knew E already. This captures the intuition that explaining an *anomaly* is confirmatory.

      *   **Solution 3: Shifting Background Knowledge (Changing K):**
          *   The probability function `P` is always relative to background knowledge `K`.
          *   Before the discovery of `H ⊨ E`, `K` included `E` but *did not* include the fact that `H` entails `E`.
          *   The act of discovering/demonstrating `H ⊨ E` *changes the background knowledge* to `K' = K ∪ {H ⊨ E}`.
          *   We need to compare `P(H | K)` (belief in H given old K) with `P'(H | K')` (belief in H given new K'). The latter is calculated relative to the new probability function `P'` defined over the expanded background `K'`.
          *   Typically, `P'(H | K')` will be greater than `P(H | K)` because `K'` now contains the information linking H to the previously anomalous E. The confirmation arises from the change in the background knowledge structure.

  5.  **Applying the Solutions to Mercury & GR:**
      *   Astronomers knew `E` (the precession anomaly) and knew it was a problem for Newton (`K`).
      *   Einstein proposed `H` (GR).
      *   Einstein *calculated* that `H ⊨ E` (L). **This was new information.**
      *   **Solution 1:** Learning `L` (`H ⊨ E`) increased `P(H | E, K)`. It showed GR *solved* the known anomaly. `P(L | ~H, K)` was low – what were the chances another theory would nail that precise number?
      *   **Solution 2:** *If* physicists hadn't known about Mercury's orbit, and GR predicted it *exactly* (especially when Newton was wrong), it *would have been* astounding confirmation. Recognizing this counterfactual power justifies the actual confirmation.
      *   **Solution 3:** The background knowledge `K` changed to `K'` by adding `H ⊨ E`. Evaluating GR relative to `K'` (where it explains the anomaly) gave it higher probability than relative to `K` (where the anomaly was unexplained).

  **Conclusion: Which Bullet to Bite? Neither!**

  Physicists were **absolutely right** to treat Mercury's precession as powerful evidence for General Relativity. The sense of confirmation was real and well-founded. However, the **naive application** of Bayes' theorem, treating `P(E)` as rigidly 1 in all contexts, is **too simplistic** to capture the dynamics of scientific reasoning involving old evidence and the discovery of novel explanatory connections.

  The Bayesian account of confirmation is **not fundamentally broken**. The "problem of old evidence" highlights a crucial nuance: confirmation often comes not merely from observing evidence, but from discovering *how theories relate to evidence*, especially evidence that was problematic or anomalous under previous theories. By explicitly modeling the learning of the logical entailment (`L`) or by considering counterfactual degrees of belief or shifts in background knowledge, the Bayesian framework can be extended or applied more subtly to accommodate and explain the confirmatory power of old evidence like Mercury's precession. Glymour's challenge was invaluable in forcing Bayesians to refine their models, not abandon them. Your discomfort was justified, but there's a satisfying resolution that honors both good scientific practice and the core insights of Bayesian epistemology. Enjoy the rabbit hole – it gets even more interesting from here!
