  First, I need to recall the Bayesian framework. The theorem says P(H|E) = [P(E|H) * P(H)] / P(E). If P(E)=1, then P(E|H) is also 1 since H entails E. Plugging in, P(H|E) = P(H), so no update. The user's frustration makes sense here. But the Mercury example clearly contradicts this. So why the disconnect?

  I remember that the issue isn't with Bayesianism itself but with how we model the agent's knowledge. When E is already known, P(E)=1 seems fixed. But in practice, scientists learn that H explains E, which they hadn't connected before. So maybe the key is to reconsider the probability space. Before realizing H entails E, the agent might not have set P(E)=1 in the context of H. Or perhaps the learning process involves recognizing a logical relationship, not just observing E.

