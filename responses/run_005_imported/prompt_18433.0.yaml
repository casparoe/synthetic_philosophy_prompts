  The Mercury case fits here. Before GR, astronomers knew the data but didn't have a theory that explained it. Newtonian physics failed here, so P(E) wasn't 1 under all theories. When Einstein showed GR accounted for it, that was new information—connecting H to E. So even with old evidence, the logical connection was novel, prompting belief update.

