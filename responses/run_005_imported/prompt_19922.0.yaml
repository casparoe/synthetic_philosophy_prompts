  In Move 3, Devesh tries comparing it to gym temptation scenarios. This is clever but flawed. When I set a morning alarm despite predicting I'll snooze it, my future self isn't being rational by snoozing - it's weakness of will. Whereas skipping the toxin tomorrow is objectively rational. The cases differ fundamentally in how we judge the future self's action. Naomi will pounce on this.

