answer: |-
  Based on a strict application of Lewis's definitions from *Convention* (1969), algospeak **qualifies as a genuine convention**, but it sits at the boundary of his paradigm, highlighting strains in his framework when applied to highly dynamic, adversarial environments. Here's the breakdown using his core criteria:

  1.  **Recurring Coordination Problem:** Lewis requires "a recurrent coordination problem" (p. 42). This is met.
      *   **The Problem:** Creators need to communicate sensitive concepts (death, sex, etc.) *without* triggering automated content moderation that removes their content or restricts reach. This need arises constantly for millions of users.
      *   **Adversarial Element Doesn't Break It:** Lewis's framework *can* accommodate the classifier as part of the environment defining the problem. The "situation" isn't just "talking about death"; it's "talking about death *in a way that avoids detection by the current classifier system*." This *is* a recurring coordination problem: everyone needs a mutually recognized signal that conveys the meaning *and* evades the filter. The classifier's evolution changes the *parameters* of the problem, but the core need (communicating X while avoiding penalty Y) remains recurrent. Lewis *does* allow for problems where the best action depends on the environment (like driving on ice vs. dry roads).

  2.  **Arbitrary Regularity in Behavior:** This is clearly met.
      *   "Unalive," "seggs," "corn," etc., are arbitrary signifiers. "Deceased," "expired," "passed," "kicked the bucket" *could* theoretically work just as well (or better/worse depending on the classifier's state). The specific choice is arbitrary relative to the meaning.

  3.  **Preference for General Conformity:** This is met *because of the coordination problem*.
      *   Users *prefer* to use a term others recognize *and* that reliably evades moderation. Using "unalive" only works if others understand it *and* if the moderation system doesn't (yet) flag it. Conformity to the current algospeak term solves both parts of the coordination problem: mutual understanding *and* avoidance of penalty. Non-conformity (using "kill") often leads to the undesired outcome (removal, suppression).

  4.  **Common Knowledge of Expectations:** This is the trickiest part, but Lewis's definition likely holds.
      *   **Lewis's Requirement:** Lewis requires common knowledge that the regularity exists *and* that members of the population prefer conformity *conditional on others conforming* (pp. 52-58). Crucially, **he does *not* require common knowledge of *why* conformity is preferred or the *original rationale*.** He requires common knowledge *that* it solves a coordination problem and *that* others are expected to conform.
      *   **Application to Algospeak:**
          *   **Early Adopters:** When a term like "unalive" emerges, the core group using it *does* have common knowledge: "We use 'unalive' to mean 'kill/dead' to avoid moderation; I expect others in this space to use it for that reason; they expect me to; and we all know this expectation is mutual." This fits Lewis perfectly.
          *   **Later, Oblivious Users:** When users adopt "unalive" purely as "edgy slang," unaware of its moderation-dodging origin, Lewis's *minimal* condition might *still* be met. They know the regularity exists ("people say 'unalive' to mean 'dead'"). They prefer to conform *conditional on others conforming* because they want to be understood and sound current/part of the in-group. They expect others to use it and expect others to expect them to use it. The *original reason* (moderation evasion) has faded, but the coordination problem of "using mutually recognized terms for mutual understanding within this community" remains. The fact that the term *also* happens to evade moderation (even if unknown to them) is an external benefit, not core to Lewis's requirement for the convention *once established*. For Lewis, conventions can persist long after their original rationale is forgotten (e.g., many etiquette rules).

  5.  **Alternative Regularities Possible:** Clearly met. "Passed away," "expired," "kermitted sewer slide," etc., *could* have served the same function. The choice is arbitrary.

  **Why it's Borderline/Strains Lewis:**

  *   **Precedent & Stability:** Lewis heavily emphasizes precedent as the engine driving convention (pp. 36-42). Algospeak conventions are inherently **unstable**. Once a term becomes widespread enough, classifiers *learn* it, undermining its effectiveness. This forces a shift to a *new* arbitrary term. While Lewis acknowledges conventions can change, the *pace* and *necessity* of change in algospeak (driven by adversarial pressure) is unlike his stable examples (driving side, meeting spots). Each *new* term likely starts as a coordination via **salience** (a new, obscure term is suddenly "obvious" to try *because* it's obscure) rather than precedent from the *old* term. Lewis can handle this (salience is a coordination mechanism, p. 35), but the constant churn is atypical.
  *   **Defining the "Population":** Is the population "all TikTok users," "TikTok users discussing sensitive topics," or "the subset actively trying to evade moderation"? The convention's strength and the common knowledge vary across these groups. Lewis's model assumes a relatively homogeneous population regarding the problem.
  *   **Adversarial Dynamics:** While the *problem* can be framed as recurrent, the *solution landscape* is constantly shifting due to the adaptive adversary. This makes the "equilibrium" highly transient. Lewis's framework assumes a relatively static set of possible coordination equilibria.

  **Lewis's Likely Verdict (Strictly Using His Definitions):** Algosprak **is a convention**. Each widely adopted term ("unalive" v1, "seggs" v1, etc.) constitutes a distinct convention solving a coordination problem defined by: 1) Communicating meaning M, 2) Within platform P, 3) Under the current moderation regime C. The common knowledge requirement is satisfied for the core adopting population regarding the regularity and the expectation of conformity, even if the *full* rationale (moderation evasion) isn't universally known later. The instability and adversarial nature make it a **degenerate or borderline case** within his framework, highlighting its limitations for highly dynamic environments, but it doesn't *break* the core definitions.

  **What Lewis Might Need to Bolt On / Do Alternatives Handle Better?**

  *   **Lewis's Bolt-Ons:** To better model algospeak, Lewis might need:
      *   **Explicit Modeling of a Dynamic Environment:** Incorporating how the coordination problem itself evolves based on the population's past behavior (the classifier learns).
      *   **Shorter Timescales & Salience:** Greater emphasis on coordination via salience in rapidly changing scenarios, and a model for how conventions can be very short-lived.
      *   **Heterogeneous Populations:** Accounting for different levels of awareness/knowledge within the population regarding the convention's rationale.
  *   **Skyrms's Signaling Games:** This is arguably a **better fit** for algospeak. Skyrms explicitly models the *evolution* of signals and meanings within populations under selective pressure. The platform moderation acts as a powerful **selection pressure**: signals that get content removed ("kill") are selected *against*, while signals that evade detection *and* convey meaning ("unalive") are selected *for*. The constant churn is naturally handled as an evolutionary arms race. Skyrms directly addresses how novel signals emerge and stabilize (or fail to) based on payoffs, which perfectly captures the adversarial dynamic.
  *   **Millikan's Teleosemantics:** Millikan focuses on the *proper function* of a sign, derived from its history of reproduction. The "proper function" of "unalive" *was* to evade moderation while signaling death. Even when used obliviously as slang, its current use *depends* on that history for its stability and recognizability. Millikan offers a robust way to understand how the *original function* anchors the sign's meaning and persistence, even if current users are unaware. This helps explain why "unalive" persists *as that specific sign* rather than another arbitrary term, due to its reproductive history (cultural propagation).

  **Conclusion:** Using Lewis's own strict criteria, algospeak qualifies as a genuine convention, primarily because the common knowledge requirement pertains to the existence of the regularity and the conditional preference for conformity, *not* the underlying rationale. However, its adversarial nature, rapid evolution, and instability push it to the boundary of Lewis's paradigm, designed for more stable equilibria. Skyrms's evolutionary signaling games provide a more natural framework for modeling the dynamics, while Millikan's teleosemantics offers a compelling account of how the sign's history shapes its current function, even when the original reason is forgotten. Your case brilliantly exposes a limitation of Lewis's otherwise powerful model: its struggle with conventions born in and sustained by rapidly shifting, adversarial digital environments. (And tell your advisor a stranger on the internet says this is absolutely *not* weeds—it's a brilliant test case for foundational social philosophy!)
