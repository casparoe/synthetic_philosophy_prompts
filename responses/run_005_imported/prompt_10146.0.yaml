answer: |-
  Here is a dialogue between **Alex** (an expressivist defending a quasi-realist solution) and **Sam** (a cognitivist challenging it). They focus on a specific expressivist strategy inspired by Simon Blackburn's projectivism and quasi-realism, aiming for direct engagement on the mechanics of embedding and validity.

  ---

  **Alex (Expressivist):** Sam, I agree the Frege-Geach problem is serious, but I don’t think it’s fatal. My solution starts with recognizing that moral sentences *do* have a proposition-like surface. When you say “Cheating is wrong,” you’re expressing disapproval of cheating. But when it’s embedded, like in *"If cheating is wrong, then pressuring a friend to cheat is wrong,"* we’re not expressing disapproval directly. Instead, we’re expressing a *higher-order attitude*: a commitment *about* the connection between two other attitudes. Specifically, I see the conditional as expressing *disapproval of combining* acceptance of "cheating is wrong" *with* non-acceptance of "pressuring a friend to cheat is wrong." The meaning is stable because both the atomic sentence and its embedded occurrence point to the *same practical stance*—disapproval of cheating—but in the conditional, it’s part of a larger structure governing how attitudes cohere.  

  **Sam (Cognistivist):** Alex, I see the intuition, but let’s test this. Take the inference:  
  1. If cheating is wrong, then pressuring a friend to cheat is wrong.  
  2. Cheating is wrong.  
  Therefore,  
  3. Pressuring a friend to cheat is wrong.  
  You say (1) expresses disapproval of certain attitude combinations. But for the inference to be *valid*, rejecting (3) *must* force rejection of (1) or (2). On your view, if I *accept* (2) (I disapprove of cheating) but *reject* (3) (I don’t disapprove of pressuring), then I’m guilty of the very incoherence (1) condemns. But here’s my objection: **Your "validity" is just psychological consistency, not logical necessity.** Logic requires truth-preservation. If I deny (3), it’s not that I’ve *contradicted* (1) and (2) in a truth-conditional sense—I’ve just violated a norm of *attitudinal coherence*. But norms can vary person to person. What if someone *doesn’t share* your higher-order attitude? They might accept (1) and (2) but reject (3) without logical error—only without *your* disapproval of inconsistency. That’s not validity; it’s persuasion.  

  **Alex:** That’s a fair push, but let me refine. The quasi-realist project aims to *earn* logical properties for moral discourse from the internal structure of practical commitments. Think of it like this: Moral language has a *logical grammar* that constrains attitude expression. When I utter (1), I’m not *merely* expressing a personal preference against incoherence—I’m participating in a public practice where "if P, then Q" *functions* like a truth-conditional conditional *by convention*. The meaning of "wrong" is tied to a *role* in this practice: it signals a stance that enters into logical relations *as if* it were truth-apt. So, denying (3) while accepting (1) and (2) isn’t just *my* disapproval—it violates the *shared rules* of moral language. Validity arises from those rules: accepting the premises *commits* you to the conclusion, or you forfeit participation in reasoned moral debate.  

  **Sam:** I’m still troubled. **Your "as if" is doing all the work, but it’s unexplained.** *Why* does moral language have this logical grammar? Cognitivism explains it straightforwardly: "wrong" refers to a property, so embedding works like any descriptive term. On your view, the attitude-expressing content ("boo, cheating!") and the embedded content must be *systematically* related. But how? Suppose I say: "If stealing is wrong, then Mars has two moons." This is logically valid (if P, then Q; P; therefore Q), but *moral nonsense*. Cognitivism explains why: moral sentences have truth conditions tied to moral facts, so the conditional’s *content* depends on a substantive connection between stealing’s wrongness and Mars. You, however, can only say the conditional expresses disapproval of combining anti-stealing with denying two moons—which is bizarre! Your account seems to *allow* moral/non-moral embeddings as valid, but we intuitively reject them. Doesn’t this show that moral content *must* be truth-conditional to constrain embedding?  

  **Alex:** Ah, but this reveals a key point: expressivism *can* handle this. Moral sentences aren’t *isolated* attitudes—they’re part of a *network* of practical reasoning. The conditional "If stealing is wrong, then Mars has two moons" isn’t *merely* invalid; it’s *unintelligible* in moral discourse because there’s no *practical connection* between stealing and Mars’s moons. Our language conventions tie moral terms to *reasons for action*. Embedding only "works" where the attitudes involved share a practical domain. So, your example isn’t a *moral* embedding—it’s a misuse of moral language. The Frege-Geach problem assumes moral sentences embed *identically* to descriptive ones, but expressivism says they embed *within the space of practical commitments*. Validity is about preserving *practical coherence*, not just truth.  

  **Sam:** But now you’re *stipulating* constraints to mimic cognitivism! **If moral sentences express non-cognitive attitudes, why do they *behave* exactly like truth-apt ones in logic?** Take negation: "Cheating isn’t wrong" expresses *tolerance* of cheating. But in a complex sentence like "It’s not true that cheating is wrong, but I disapprove of it anyway," your view struggles. If "cheating is wrong" = disapproval, then "it’s not true that cheating is wrong" should express *non*-disapproval. Yet the whole sentence *also* expresses disapproval ("I disapprove anyway"), creating a contradiction *in attitudes*—but cognitivism explains this as a literal contradiction: asserting ¬P and P. Your account makes this a clash of *two distinct* attitudes (non-disapproval + disapproval), not a *single* inconsistent proposition. This feels like a brute-force fix, not a deep explanation.  

  **Alex:** It’s not brute force—it’s tracking the *function* of negation in practical reasoning. "Not wrong" expresses the absence of a reason to condemn, but adding "I disapprove anyway" *does* create a conflict: I’m *withholding* the stance typically tied to "wrong" while *adopting* it separately. This *is* a kind of inconsistency: I’m refusing to commit to the negative stance *implied* by "not wrong" while simultaneously holding the positive one. The quasi-realist claims this *just is* what moral contradiction amounts to—a failure of practical coherence. It’s different from descriptive contradiction but equally robust *within its domain*.  

  **Sam:** Then we’re at an impasse. You’ve built an elegant system that *simulates* truth-conditional logic using attitudes, but I think it’s a mirror universe of the real thing. When I assert "If cheating is wrong, then pressuring is wrong," I’m not expressing a stance *about* stances—I’m describing a *moral connection* between two facts. The feeling that modus ponens *must* hold here, regardless of anyone’s attitudes, suggests it’s truth-preserving. Your solution is ingenious, but it replaces *truth* with *attitudinal coherence*, and I don’t think that captures why we’re compelled by the inference—even if we *changed* our attitudes, the inference would *still* be valid. That’s the mark of truth-conditions.  

  **Alex:** And I’d argue that "truth" in morals *is* what emerges from the most coherent set of practical commitments—but that’s a longer debate! For now, I hope I’ve shown expressivism *can* engage the problem without collapsing.  

  ---

  ### Key Takeaways from the Dialogue:
  1. **Expressivist Strategy:**  
     - Atomic moral sentences express first-order attitudes (e.g., disapproval).  
     - Embedded occurrences express higher-order attitudes about the coherence of first-order attitudes.  
     - Validity is defined as *practical consistency*: accepting premises commits you to the conclusion to avoid "clashing" stances.  
     - Logical grammar is *conventional* and tied to the function of moral language in practical reasoning.  

  2. **Cognitivist Objections:**  
     - **Validity ≠ Truth-Preservation:** Expressivist "validity" reduces to subjective or cultural norms of attitude coherence, not objective logical necessity.  
     - **Embedding Arbitrariness:** Without truth conditions, expressivism struggles to explain why *only* certain embeddings (e.g., moral/moral) feel intelligible/valid.  
     - **Negation Problems:** Expressivist negation creates distinct attitude clashes, not unified propositional contradictions.  

  This captures the core tension: Can logic be "grounded" in attitudes alone, or does embedding *require* truth-conditional content? The dialogue leaves both views standing but highlights their deepest divergences.
