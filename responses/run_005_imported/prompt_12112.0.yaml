  First, I need to map their four moves clearly. Theo's opener (1) is classic reference class problem - Mara's 9% risk depends on arbitrary class selection. Mara's counter (2) argues for using the narrowest statistically validated reference class. Theo's rebuttal (3) claims this just relocates the problem when equally valid classes conflict. Mara's finale (4) accuses Theo of overreach by implying no individual predictions can ever be justified.

