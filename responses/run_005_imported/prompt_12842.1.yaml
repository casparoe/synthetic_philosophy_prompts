  For my metaphysics seminar we got this assignment where you invent a philosopher who defends a real position and then interview them for a mock podcast (profs idea, weirdly fun). Mine defends a Lewis-style 'reformed' conditional analysis of dispositions -- the fix where finkish cases get handled by requiring the intrinsic causal basis to stick around through the stimulus. Can you draft me 7-8 interview questions that go past the obvious finks question? I want one on how he'd even distinguish a fink from a mask/antidote case (since both just end with the disposition not manifesting), one that uses an actual mask case -- basis totally untouched, stimulus happens, manifestation still gets blocked -- to press on whether basis-retention rules those out at all, one on telling a genuine disposition apart from a mimic that satisfies the conditional for the wrong reason, and then end on what kind of counterexample would have to show up for him to admit the whole conditional-analysis project fails instead of just needing one more clause bolted on. For the mask question especially, throw in a follow-up keyed to whatever dodge he's most likely to give. Skip the generic 'why do you find this interesting' stuff -- I want it pinned to actual moves people make in the finks/masks lit.
