answer: |-
  ## Dinner Party Debate (Dialogue Only)

  **Game Theorist:** The irony, Eleanor? Watching them, I saw textbook rationality. Painfully so.

  **Psychologist:** Rational? Martin, that was a collective nervous breakdown fueled by champagne and social pressure. They bled cash to avoid admitting they’d already lost.

  **Game Theorist:** Precisely! At *each* incremental bid, the cost of *not* bidding – accepting a certain, immediate loss of whatever they’d already sunk – felt worse than the risk of a slightly larger, but still *potential*, future loss. Locally optimal. Every time.

  **Psychologist:** "Locally optimal"? That’s the trap! You isolate the moment, ignore the accumulating wreckage. It’s entrapment. Each bid isn't just a new cost; it’s another chain link. They weren’t buying a painting; they were buying relief from the shame of quitting. Sunk costs *shouldn’t* dictate future action, but they do. Every time.

  **Game Theorist:** Of course they do! Because the cost of quitting *is* real. It’s the public admission of wasted resources. It’s losing face. Those are tangible losses factored into the utility function at each decision point. Calling it irrational dismisses the *real* stakes people perceive.

  **Psychologist:** Perceive? Or are manipulated into perceiving? Your "rational actors" became prisoners of the escalating conflict *they* created. Just like strikers holding out month twelve for a penny more, long after the strike fund’s gone, because backing down *now* feels like betraying the previous eleven months of hardship. Or wars prolonged because no leader can bear being the one who "lost" after so many deaths. It’s not rational calculation; it’s pathological commitment fueled by aversion to loss and regret.

  **Game Theorist:** You’re describing the *outcome*, not the *process*. The process *is* a series of rational responses to a shifting battlefield – a war of attrition. Each participant believes the other will crack first. Bidding becomes an investment to force *their* capitulation. It’s tragic, yes, but born of individual reasoning under pressure and imperfect information.

  **Psychologist:** Imperfect information? They knew the value of the item! They watched the bids soar past it! Your model assumes perfect self-interest, Martin, but ignores the emotional vortex. Pride, stubbornness, competitive fury – these aren't cool calculations; they're heat that melts rationality. Calling this "rational" because you can model the micro-decisions with game trees sanitizes the human mess. It was a predictable psychological cascade, not a triumph of logic.

  **Game Theorist:** Predictable *because* the logic is consistent! The heat you describe *is* part of the utility function! Avoiding humiliation *has* high utility. Fighting to win a contest, even a costly one, *is* a goal people value. The aggregate outcome is disastrous, I grant you, a classic sub-optimal Nash equilibrium... but each actor, at their moment of choice, with their values and perceived costs, acted in a way they believed maximized their position *then and there*. That *is* rationality.

  **Psychologist:** Then your definition of "rational" is bankrupt. If "rational" leads reliably to collective ruin, traps people in escalating nightmares they wouldn't touch with a barge pole if seen whole at the start, and is indistinguishable from compulsive behavior driven by fear and pride... then the word has lost all useful meaning. It becomes an apologist’s term for dysfunction. They weren’t *reasoning*; they were *rationalizing* their descent. There’s a crucial difference. Your war of attrition logic explains the *mechanism*, Martin, not the sanity.
