  **Key Takeaways:**

  1.  **Clear Biology Anchors Naturalism:** Conditions like a broken leg or Type 1 Diabetes have unambiguous structural/functional failures causing direct, universal harm, requiring minimal value judgment to label as disease.
  2.  **Harm & Context Drive Contention:** Conditions like ADHD, infertility, and prolonged grief involve biological elements, but the *definition of harm* and *dysfunction* depends heavily on societal context, expectations, and individual goals. What's impairing in one context may not be in another.
  3.  **Values Define the Threshold & Harm:** High cholesterol and obesity show how statistical risk and biological links lean naturalistic, but deciding *where* to draw the disease line and *how much* to emphasize individual responsibility vs. biology involves values. Prolonged grief explicitly defines "excessive" based on norms.
  4.  **Identity & Rejection of Pathology:** Deafness is the clearest example where a biological difference is primarily pathologized based on societal values (prioritizing hearing). The Deaf community's rejection of the disease label highlights how normativity can be imposed externally.
  5.  **Evolution is Possible:** Evidence can shift conditions (e.g., ME/CFS moving towards contested/leaning naturalistic as biology is uncovered). Social values also change (e.g., de-pathologization of homosexuality).

  This ranking reflects *where these conditions typically fall within the current academic debate*, acknowledging significant gray areas and that individual perspectives (especially lived experience) may differ. The placement of "contested" and "normative" items is particularly fluid and debated.
