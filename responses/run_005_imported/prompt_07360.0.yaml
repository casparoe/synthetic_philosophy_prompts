  **Explanation of Ranking:**

  1. **Indexical/affiliation theory (e.g., Nunberg)**: Best overall fit. It explains all three phenomena via context-dependent meaning:  
     - **Mention without use**: Offense arises because the word itself indexes historical bigotry, regardless of intent.  
     - **Reclamation**: In-group use indexes affiliation/solidarity, flipping meaning through shared context.  
     - **Out-group harm**: An outsider lacks the affiliative context, reactivating the slur’s original derogatory index.  
     Flexible and speaker-context focused.

  2. **Perspectival account (e.g., Camp)**: Strong runner-up.  
     - **Mention without use**: Evokes a derogatory perspective, causing offense.  
     - **Reclamation**: In-group use adopts a defiant/affectionate perspective, neutralizing harm.  
     - **Out-group harm**: Outsiders reintroduce the hostile perspective.  
     Handles perspective shifts well but less emphasis on linguistic context than indexicalism.

  3. **Speech-act/subordination accounts (e.g., Langton, McGowan)**: Good fit for harm dynamics.  
     - **Mention without use**: Echoing a slur perpetuates subordination (as "echoic" speech acts).  
     - **Reclamation**: In-group use becomes a counter-speech act resisting oppression.  
     - **Out-group harm**: Outsiders reinforce hierarchy, reactivating subordination.  
     Explains power dynamics but struggles with nuanced mention vs. use.

  4. **Conventional-implicature/presuppositional accounts**: Moderate fit.  
     - **Mention without use**: Derogatory presupposition may linger in mention, causing offense.  
     - **Reclamation**: In-group use might override implicature through convention shift.  
     - **Out-group harm**: Outsiders trigger default derogatory presupposition.  
     Less adaptable to rapid meaning change (e.g., reclamation).

  5. **Prohibitionism (e.g., Anderson & Lepore)**: Poor fit for reclamation.  
     - **Mention without use**: Offense stems from taboo violation (fits well).  
     - **Reclamation**: Cannot explain inversion—taboos don’t easily flip to affection.  
     - **Out-group harm**: Predicts harm (as violation) but ignores why in-group use isn’t harmful.  
     Overly simplistic for meaning transformation.

  6. **Combinatorial externalism (e.g., Hom)**: Worst fit.  
     - **Mention without use**: Fixed semantic content might not explain offense in mention.  
     - **Reclamation**: Rigid ideology-bound meaning resists reclamation (no inversion).  
     - **Out-group harm**: Predicts harm but fails to explain why in-group use isn’t harmful.  
     Inflexible for contextual/relational shifts.
