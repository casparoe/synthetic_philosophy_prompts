prompt: |-
  So my housemate's a bit too into rationalist blogs, and last week we spent like two hours arguing over whether to sell our shared crypto position. At the end he goes: we're both smart, we were both honest about our actual probabilities the whole time we were trading numbers back and forth, so by Aumann's agreement theorem we should've converged by now — the fact that we still disagree just means one of us is being irrational. Didn't have a comeback in the moment but it's been bugging me since. I looked the theorem up afterward and it seems to lean on stuff like a 'common prior' and full common knowledge of each others posteriors, which feels like a lot to assume about two guys arguing over a shared google sheet at midnight. Can you walk me through what actually has to be true for the theorem (and the version about repeatedly swapping estimates) to apply, and how much of that we realistically satisfied? Mainly want to know if he was right that someone here had to be irrational, or if he just won the argument with math.
