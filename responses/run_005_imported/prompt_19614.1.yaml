  Had a long arguement with my friend last night thats still bugging me. She thinks that as long as information is free, it's always irrational to avoid finding something out, because knowing more can never leave you worse off than knowing less, as long as you actually use it properly once you have it. I pointed out that I do noticeably worse with my investments when I check the account during a market dip, since seeing the number drop makes me panic and sell, whereas if I just don't look for a few months I ride it out fine and come out ahead. She said that just proves I'm bad at handling information, not that ignorance is ever actually the smart move, and that in principle I should still want to know even if I can't be trusted with it in practice. Something about that felt like a dodge but I couldn't quite explain why. Who's actually right here?
