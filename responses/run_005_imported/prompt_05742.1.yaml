answer: |-
  Here are 10 interview questions with podcast-style follow-ups, designed to push the "open future" view while remaining accessible. I've marked questions needing brief setup with **(Brief Setup Needed)** and included suggested phrasing.

  ---

  ### **1. Core View Clarification**
  *(Start here to establish the view for the audience)*  
  **Question:** "You defend an 'open future' view where claims like 'There will be a sea battle tomorrow' aren’t true *or* false today. Could you explain *why* this matters? What problem does it solve?"  
  *Likely Response:* She’ll explain it preserves free will/future contingency by avoiding "fixedness."  
  **Follow-up:** "But doesn’t this mean the future is *radically* unsettled? Could even basic predictions like ‘I will eat lunch tomorrow’ lack a truth value right now?"  

  ---

  ### **2. The "Physically Settled" Exception**  
  **(Brief Setup Needed)**  
  *Setup: "Some events seem inevitable—like planetary motion."*  
  **Question:** "What about scientifically predictable events, like ‘The solar eclipse on April 8, 2024, will occur’? Wasn’t that true *years* ago? Does your view require exceptions?"  
  *Likely Response:* She might say physics creates "local settledness," but future contingents (human actions) are open.  
  **Follow-up:** "Doesn’t carving out ‘settled’ vs. ‘open’ futures risk arbitrariness? Where do we draw the line—is climate change ‘settled’? A coin flip?"  

  ---

  ### **3. Truth Retroactivity**  
  **(Brief Setup Needed)**  
  *Setup: "After an event happens, we often say past predictions *were* true."*  
  **Question:** "Suppose the sea battle *does* happen tomorrow. Don’t we say, ‘The prediction "there will be a battle" was true all along’? How does your view avoid smuggling truth back in?"  
  *Likely Response:* She’ll say the proposition *becomes* true retroactively, but wasn’t true "at the time."  
  **Follow-up:** "So before the battle, was the claim *meaningless*? Or did it have a different status—like ‘indeterminate’? How do we talk about it without truth/falsity?"  

  ---

  ### **4. Supervaluationism Alternative**  
  **(Brief Setup Needed)**  
  *Setup: "One alternative says ‘There will or won’t be a battle’ is true, even if neither part is."*  
  **Question:** "Why choose ‘no truth value’ over supervaluationism? Doesn’t letting ‘P or not-P’ be true avoid gaps while keeping the future open?"  
  *Likely Response:* Supervaluationism still implies *some* future timeline is "the real one," undermining openness.  
  **Follow-up:** "But if *neither* ‘battle’ nor ‘no battle’ is true today, how can their disjunction be true? Isn’t that just logic?"  

  ---

  ### **5. Metaphysical Indeterminacy**  
  **(Brief Setup Needed)**  
  *Setup: "Some argue the ‘gap’ isn’t just linguistic—it’s in reality itself."*  
  **Question:** "You’ve written that the future is *metaphysically* indeterminate, not just unknown. What does that mean—is reality itself ‘fuzzy’ about tomorrow?"  
  *Likely Response:* Yes; the world lacks determinate facts about future contingents.  
  **Follow-up:** "But how can reality be ‘indeterminate’? If I decide to raise my hand *now*, was it indeterminate a second ago? Doesn’t that make change inexplicable?"  

  ---

  ### **6. Proving Too Much?**  
  **Question:** "Could this view prove *too much*? If ‘I will eat lunch tomorrow’ lacks truth value, how do we explain planning or betting? Are we just pretending things are true?"  
  *Likely Response:* We act on *probabilities* or *expectations*, not truth values.  
  **Follow-up:** "But doesn’t science rely on future truths? If a physicist says ‘The comet will enter orbit in 2061,’ is that neither true nor false? Doesn’t that undermine science?"  

  ---

  ### **7. Agency & Responsibility**  
  **Question:** "How does an open future protect free will? If my choice tomorrow isn’t ‘true’ yet, does that make me *more* free?"  
  *Likely Response:* Yes—if future choices were already true, they’d be fatalistically fixed.  
  **Follow-up:** "But if my future choice isn’t true/false now, does that mean I don’t *yet* have the *property* of ‘going to choose X’? How does that help me *act* freely?"  

  ---

  ### **8. Logic & Rationality**  
  **(Brief Setup Needed)**  
  *Setup: "We often assume logic applies to all claims."*  
  **Question:** "Does your view break standard logic? For example, is ‘Either a battle happens or it doesn’t’ *also* neither true nor false?"  
  *Likely Response:* No; logical truths (like excluded middle) hold, but contingent claims about specifics can be gappy.  
  **Follow-up:** "But if ‘battle’ is indeterminate, how can ‘battle or no battle’ be true? Doesn’t its truth *depend* on the parts?"  

  ---

  ### **9. Time’s Asymmetry**  
  **Question:** "Why is the future open but the past fixed? What *makes* the future metaphysically special?"  
  *Likely Response:* Causality flows forward; past events causally determine present facts, but not vice versa.  
  **Follow-up:** "But couldn’t a ‘block universe’ theorist say this is an illusion? If relativity treats time as a dimension, why privilege the future?"  

  ---

  ### **10. Practical Implications**  
  *(Good closer—connects to the audience’s lives)*  
  **Question:** "If the future is truly open, what does that mean for how we live? Should it change our relationship with anxiety or determinism?"  
  *Likely Response:* It empowers us—our choices matter; fatalism is false.  
  **Follow-up:** "But if *some* futures are ‘settled’ (e.g., the sun rising), and others aren’t, how do we avoid despair over what we *can’t* change?"  

  ---

  ### **Delivery Tips for the Assembly:**
  - **Flag jargon:** Before Q4, say: *"There’s a technical alternative called supervaluationism—it tries to keep logic intact while saving free will. Why avoid that?"*  
  - **Simplify examples:** Swap "sea battle" for "soccer game" or "math test."  
  - **Pace yourself:** Pick 5-6 questions max. Prioritize #2 (science), #3 (retroactivity), #6 (proving too much), and #10 (practical).  
  - **Signal transitions:** *"This leads to a deeper worry..."* or *"Let’s bring this down to earth..."*  

  You’ve got this! Your prep shows you understand the tensions—use that to make her *engage*, not lecture. Good luck! 🍀
