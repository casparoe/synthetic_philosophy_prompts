  Another angle: consent. Users don't consent to manipulative designs, similar to how malware victims don't consent. The AI recognizing this shows nuanced understanding of harm beyond immediate requests. 

  I should also consider if the AI's approach was consistent. It implemented neutral parts but refused manipulative elements. That suggests it draws lines based on deception, not obstruction—which is reasonable. 

