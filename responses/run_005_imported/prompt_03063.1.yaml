  So, the downside isn't informational but psychological. Preserving mental health by not checking during downturns is rational self-care. The user's instinct is justified because it protects their emotional state, which is crucial for long-term financial discipline.
answer: |-
  You're right to be skeptical of your friend's argument. While checking your account balance seems harmless on the surface, there are significant psychological downsides that make your reluctance not only justified but rational. Your friend's claim that "more information can never leave a rational person worse off" fails in this specific context for several crucial reasons:

  1.  **Information Without Agency Creates Anxiety, Not Insight:** The core problem is that you *cannot act* on the information. Knowing the account has dropped 20% provides no actionable insight or benefit – you can't buy, sell, or rebalance. For a rational person focused on long-term goals (which you are, evidenced by the lock), this information is fundamentally *useless* for financial decision-making during the lock period. However, it is *highly potent* for triggering negative emotional responses (fear, regret, panic) that serve no productive purpose.

  2.  **The Power of Loss Aversion & Mental Accounting:** Behavioral economics shows humans feel the pain of losses roughly twice as intensely as the pleasure of equivalent gains (loss aversion). Seeing a large dollar figure loss, even on paper, triggers this primal response. Furthermore, you mentally "account" for this money as part of your retirement security. Seeing that number shrink feels like a direct threat to your future well-being, regardless of the lock.

  3.  **Amplifying Noise and Short-Term Volatility:** The lock strategy brilliantly forces you to focus *only* on the very long term (10+ years). Checking the balance drags you back into the noisy, volatile short term. Markets fluctuate constantly; sharp drops are normal but feel catastrophic in the moment. Obsessing over these fluctuations during the lock period is like constantly checking the weather during a flight you can't exit – it only fuels anxiety without offering control.

  4.  **Erosion of the Psychological Benefit of the Lock:** The lock wasn't just a physical barrier; it was a *psychological shield*. Its power lies in removing the *temptation* and *need* to monitor. Checking the balance actively dismantles that shield. It reintroduces the very temptation and anxiety the lock was designed to eliminate. Each check weakens the psychological safety net you created.

  5.  **The "Nocebo" Effect of Information:** Just as a placebo can create positive effects, negative information can create harmful psychological effects (a "nocebo"). Knowing your balance has plummeted *will* likely worsen your mood, increase stress, and potentially spill over into other areas of your life, even if you rationally know you can't act. This emotional toll is a real cost.

  6.  **Rationality Includes Managing Emotions:** True rationality isn't just cold logic; it involves understanding your cognitive biases and emotional triggers and structuring your environment to mitigate them. *Choosing not to seek information that provokes harmful emotional responses without offering any decision-making benefit is itself a profoundly rational act of self-preservation.* Your reluctance isn't avoiding reality; it's acknowledging the reality of your own psychology and protecting your peace of mind.

  **Why Your Friend is Mistaken:**

  *   **"More information is always better" is flawed:** This assumes information is costless and always leads to better decisions. In this case, the information has a high emotional cost and zero decision-making utility. It's like insisting you *must* know the exact temperature during a heatwave when you're locked in an air-conditioned room with no thermostat control – knowing it's scorching outside only makes you feel worse without changing anything.
  *   **"Avoiding reality":** You accepted reality when you locked the account for ten years. You acknowledged market volatility and your own behavioral tendencies. *Not checking the balance during the lock is consistent with that acceptance.* Constantly checking the *short-term* fluctuations is arguably more about obsessing over noise than embracing the long-term reality your strategy is built upon.

  **Conclusion:**

  Your reluctance to check the balance is **highly justified and rational.** Checking carries a significant **psychological downside:** it reintroduces anxiety, triggers loss aversion, erodes the protective benefit of the lock, and imposes emotional stress without offering any compensating benefit or actionable insight. You designed the lock precisely to free yourself from this cycle of worry during downturns. Honoring that strategy by *not* looking protects your mental well-being and reinforces the long-term perspective crucial for successful investing. Your instinct to avoid the information is a wise form of self-care and discipline, not weakness or denial. Stick with your original plan and preserve your peace of mind.
