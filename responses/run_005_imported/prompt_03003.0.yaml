  Regarding her grouping of Owen, Fourierists, and continental socialists under one principle - this is historically sound for 1880. While modern scholars distinguish these movements, contemporary critics (especially non-academic ones) often lumped them together as threats to private property. Edith's phrase "the same principle conceded" works because she's referring specifically to their rejection of market-based distribution, not their methods. Her dismissal of cooperatives as "Socialism with better manners" is particularly sharp and period-appropriate - it echoes contemporary liberal critiques.

