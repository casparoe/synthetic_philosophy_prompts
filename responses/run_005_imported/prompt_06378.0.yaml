prompt: |-
  I'm a high school student putting together an independent essay on fatalism and future contingents for my school's philosophy club, and while working through Aristotle's sea-battle passage in De Interpretatione 9 I traced things back to what's apparently its direct ancestor: Diodorus Cronus's "Master Argument," as reported secondhand by Epictetus. I'm reading an old public-domain translation (P. E. Matheson, 1916), and I'm having trouble with the logic of the actual passage, not just the general gist of it:

  "The 'Master' argument appears to have been propounded on some such basis as this. There are three propositions which are at variance with one another—i.e., any two with the third—namely, these: (1) everything true as an event in the past is necessary; (2) the impossible does not follow from the possible; (3) what neither is true nor will be is yet possible. Diodorus, noticing this conflict of statements, used the probability of the first two to prove the conclusion, 'Nothing is possible which neither is nor will be true'. Some one else, however, will maintain another pair of these propositions. 'What neither is nor will be true is yet possible', and, 'The impossible does not follow from the possible', while rejecting the third, 'Everything true in the past is necessary', as appears to be the view of Cleanthes and his school, who have been supported to a large extent by Antipater. Others maintain the third pair, 'What neither is true nor will be is yet possible', and 'Everything true as an event in the past is necessary', and reject 'The impossible does not follow from the possible'. But to maintain all three propositions at once is impracticable, because every pair is in conflict with the third.

  If, then, some one ask me, 'But which of these do you maintain?' I shall answer him that I do not know, but the account I have received is that Diodorus maintained one pair, and the school of Panthoides and Cleanthes, I fancy, the second, and the school of Chrysippus the third."

  I can follow why the three propositions can't all be true together, and I get that Diodorus himself keeps (1) and (2) and rejects (3), which just sounds like fatalism about the future. What I can't get a grip on is premise (2) and the Chrysippean response to it: what is actually being given up if a logician denies that "the impossible does not follow from the possible," and how is that supposed to be a coherent, non-contradictory position rather than just a way of dodging the argument? Relatedly, do you think Diodorus's own solution—keeping (1) and (2), rejecting (3)—commits him to essentially the same fatalism Aristotle was resisting with the sea battle, or is there a meaningful logical difference between the two arguments' conclusions?
