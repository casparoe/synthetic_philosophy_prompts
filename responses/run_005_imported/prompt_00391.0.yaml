  I've been diving into textualism vs purposivism lately and keep getting stuck on the "absurdity doctrine" wrinkle — the idea that even hardcore textualists like Scalia carved out an exception for cases of obvious scrivener's error, where the literal text would produce a result nobody could've intended (like a statute that accidentally says "the defendant shall pay" instead of "the plaintiff shall pay"). That seems like it's smuggling purposivism in through the back door, but textualists insist there's a principled line between fixing an obvious drafting slip-up and using legislative intent to override text you just don't like the result of. Can you write me a dialogue between a committed textualist and a purposivist hashing this out over a specific case — pick one where the "was this a scrivener's error or just an unfortunate-but-clear text" question is genuinely hard? I want them actually engaging with each other's argument, not just talking past each other, and neither one should be a pushover.
