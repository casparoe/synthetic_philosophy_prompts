prompt: |-
  For the past few months, a few friends and I have kept circling back to a disagreement that started as a throwaway comment over dinner and has been nagging at me ever since, even though I don't have any formal training in philosophy and have mostly just been chewing on it on my own. It began when my friend Mara argued that when someone says "cheating on your partner is wrong," they aren't stating a fact that could be true or false; they're doing something closer to booing or wincing, venting disapproval dressed up in the grammar of a factual sentence. I found this fairly convincing at first, since it does seem to explain why moral disagreements almost never get resolved the way factual disagreements do, no matter how much evidence anyone brings to the table.

  What's been bothering me is something I noticed the next time the subject came up, during an argument about whether a mutual friend was wrong to keep a wallet he found instead of trying to return it. Mara built her whole case out of perfectly ordinary logical steps: she got us to agree that "keeping something valuable you find, when you could return it, is wrong," then got us to agree that "if that's wrong, then what our friend did is wrong," and from those two claims concluded that what our friend did was wrong. That's just an ordinary "if this, then that; this; so that" argument, the same shape you'd use to reason about any plain fact. But if calling something "wrong" is really just a way of booing at it, I don't see how that middle step is supposed to work, because nobody boos at an "if" — in that sentence Mara isn't disapproving of anything, she's just linking two claims together. When I pointed this out, she said I was overthinking a metaphor, but I can't shake the feeling that she wants moral language to behave like ordinary fact-stating language whenever it's doing work inside an argument, and to shrink back down to a mere grunt of approval or disapproval the moment someone asks what it actually means. Is she being inconsistent, or is there some way for both halves of her view to fit together after all?
reasoning: |-
  Okay, let me start by unpacking the user's dilemma. They're stuck in a philosophical debate with their friend Mara about moral language. Mara claims that saying something is "wrong" is like booing—it's an expression of disapproval, not a factual statement. But then in an argument about keeping a found wallet, Mara uses logical steps that seem factual. The user feels there's inconsistency here.

  First, I need to recall the philosophical frameworks involved. Emotivism comes to mind—that's where moral statements are emotional expressions. But pure emotivism struggles with logical arguments. Then there's prescriptivism, like Hare's view, which says moral statements are universal commands. That might bridge the gap Mara is using. 

  The user noticed Mara's argument structure: a universal moral premise, a factual observation, and a conclusion. This looks like modus ponens, which is logical. But if "wrong" is just a boo, how does it function in the "if-then" premise? That's the core issue. 

  I should explain how prescriptivism handles this. Universalizable imperatives can be part of logical structures. For example, "If keeping found property is wrong, and this is keeping found property, then this is wrong." The conditional works because the first premise is a universal rule, not just an emotion. 

  Also, the user might be worried about inconsistency in Mara's approach. When pressed on meaning, she retreats to emotivism, but uses logic in arguments. Prescriptivism allows both: the imperative force (like booing) and logical structure via universal rules. 

  Another point: moral disagreements. Emotivism explains why they don't resolve like factual ones—clashing emotions. But prescriptivism adds that we can reason about consistency and universal application. So Mara can argue logically about applying a rule consistently. 

  The user's deeper need might be understanding if moral language can be both expressive and logical. They want coherence in Mara's view. Explaining how prescriptivism incorporates both elements could resolve their confusion. Also, they might seek validation that their critique has merit, which it does. 

  I should also address why the user is stuck. Without philosophy background, they're intuiting the problem but lack the terms. Naming prescriptivism and its mechanisms gives them tools to articulate the issue. Highlighting Mara's use of universal premises shows the logical structure isn't accidental but integral. 

  Finally, reassuring the user that their observation is astute. Mara's view isn't inconsistent if framed within prescriptivism, which allows moral statements to function logically in arguments while being rooted in commendation or condemnation. That synthesis resolves the apparent contradiction.
answer: |-
  You've hit on a profound and enduring problem in moral philosophy. Mara's initial view resembles **Emotivism** (associated with A.J. Ayer and C.L. Stevenson), which holds that moral statements *primarily* express emotions ("booing" or "cheering") rather than stating objective facts. But your counterexample perfectly exposes the difficulty pure Emotivism faces with **moral reasoning and logic**. Mara *is* being inconsistent if she insists moral language *only* expresses emotion while simultaneously using it logically. However, her core intuition can be salvaged with a more sophisticated non-objectivist theory.

  Here's why her pure "boo/hurrah" view struggles, and how it can be refined:

  1.  **The Problem with Logic in Emotivism:**
      *   As you noted, "If keeping found valuables is wrong, and X is keeping found valuables, then X is wrong" is a valid deductive argument (modus ponens).
      *   For this logic to work, the *meaning* of "wrong" in the first premise ("keeping... is wrong") and the conclusion ("X is wrong") must be consistent. It must function as a *logical term*.
      *   Pure Emotivism struggles because:
          *   **Premise 1:** "Keeping found valuables is wrong" = Boo! (Disapproval of the act-type).
          *   **Premise 2:** "X is an instance of keeping found valuables" = Factual statement.
          *   **Conclusion:** "Therefore, X is wrong" = Boo! (Disapproval of this specific act).
      *   **The Crucial Gap:** How does the *emotion* expressed in Premise 1 logically *entail* the *emotion* expressed in the Conclusion? Logic connects *propositions* (statements that can be true/false), not raw feelings. The "if...then" in Premise 1 seems empty if "wrong" just means "Boo!" – it becomes "If Boo!(keeping), then Boo!(X)" – which doesn't follow logically; it just states two separate emotional reactions.

  2.  **Refining the View: Prescriptivism (R.M. Hare):**
      *   Mara's functional use of moral language points towards **Prescriptivism**. This view agrees that moral judgments aren't *just* facts, but argues they are more than *mere* emotions: they are **universalizable prescriptions** (commands).
      *   **"Wrong" = "Don't do it!" (A Command):** Saying "Cheating is wrong" isn't *just* booing; it's issuing a universal command: "No one should ever cheat!"
      *   **Universalizability:** This is key. Moral judgments commit you to applying the same standard to all *relevantly similar* situations. If you condemn cheating in others, you must condemn it in yourself (or be inconsistent).
      *   **How it Solves Your Puzzle:**
          *   **Premise 1:** "Keeping found valuables is wrong" = "No one should ever keep found valuables when they can return them!" (A universal prescription/command).
          *   **Premise 2:** "What our friend did *is* keeping a found valuable he could return." (Factual classification).
          *   **Conclusion:** "Therefore, what our friend did is wrong" = "Therefore, our friend should not have done that!" (The specific prescription logically derived by applying the universal rule to this instance).
      *   **Logic Works:** The argument is now logical. The "if...then" in "If keeping is wrong, then *this* act is wrong" becomes "If we universally command 'Don't keep found valuables!', and *this* act *is* an instance of keeping a found valuable, then we command 'Don't do *this*!'" The logic connects the *prescriptive content* of the commands via the factual classification. Universalizability provides the necessary consistency for the logic to hold.
      *   **The "Boo/Hurrah" Aspect:** Prescriptivism *includes* the emotive element. Issuing a strong command ("Don't do it!") *expresses* our disapproval (booing). But it *also* involves a logical, universal commitment. The "booing" isn't *all* it is.

  3.  **Addressing Mara's Inconsistency & Your Feeling:**
      *   **Your Feeling is Spot On:** You've correctly identified that Mara wants moral language to do two things: 1) Function logically *within* arguments like factual language, and 2) Shrink to a mere expression of feeling when asked about its *meaning*. Pure Emotivism fails at (1). Prescriptivism *integrates* them.
      *   **Is Mara Inconsistent?** In her *stated* pure "boo" view, **yes**. She cannot consistently claim moral language is *only* emotional expression while using it logically. Her *actions* (using logic) betray a richer understanding of moral language than her *definition* (mere booing) allows.
      *   **Can the Halves Fit?** **Yes, under Prescriptivism (or similar views):**
          *   **Meaning/Force:** The core *meaning* or *primary function* of "wrong" is prescriptive/imperative ("Don't do this!"). This inherently carries an emotive charge (disapproval).
          *   **Logic:** Because these prescriptions are *universalizable*, they generate logical relationships. We can reason *about* our prescriptions: "Do I consistently apply this command?" "Does this specific case fall under my universal rule?" "Does this rule conflict with another rule I hold?" This allows moral arguments to have logical structure, even if the premises aren't "facts" in the same way "water boils at 100°C" is a fact.
          *   **Why Disagreements Persist:** This explains why moral debates are hard to resolve. We might:
              *   Disagree on the *facts* (Could he *really* have returned it?).
              *   Disagree on the *classification* (Is this *really* "cheating" or just a white lie?).
              *   Disagree on the *universal prescriptions* themselves (Why *shouldn't* people keep found wallets? What underlying principles?).
              *   Disagree on *relevance* (Are these two situations *really* similar?).
              *   Have conflicting prescriptions we haven't reconciled.
          *   The argument isn't *just* clashing emotions ("Boo!" vs. "Hurrah!"), it's a clash of *incompatible universal commands* and their applications, layered with factual/interpretive disagreements. Resolving it requires persuasion on all these levels, not just presenting evidence for a simple fact.

  **Conclusion:**

  You're right to be bothered. Pure Emotivism ("just booing") cannot account for the logical structure Mara naturally employs in moral arguments. However, her intuition that moral language isn't *purely* descriptive like scientific facts is valid. **Prescriptivism** offers a more coherent non-objectivist account. It acknowledges the expressive/emotive force ("booing") but grounds it in universalizable prescriptions ("Don't do this kind of thing!"). This provides the logical scaffolding needed for moral reasoning ("If this act falls under the rule 'Don't do X', then don't do *this* act"), explaining how Mara could build her argument while still maintaining that calling something "wrong" expresses a strong, action-guiding stance of disapproval, not a simple matter-of-fact truth.

  Mara isn't *wrong* to see the expressive core, but she underestimates the logical commitments embedded in using moral language seriously. You aren't overthinking a metaphor; you've identified a genuine tension that philosophers have wrestled with for decades, and your counterexample is an excellent one. The debate between you is essentially about how to reconcile the expressive power of moral language with its logical function – and Prescriptivism is a major contender for doing just that.
