  Okay, let me start by unpacking the user's query. They're a retired experimental physicist with decades of experience, now diving into decision theory and social choice. They're specifically wrestling with Harsanyi's aggregation theorem and Diamond's 1967 objection involving an indivisible good and a coin flip. The core tension is between the expected utility equivalence of three options (give to person 1, person 2, or flip a coin) and the strong intuition that flipping the coin is fairer. Their economist friend dismisses this as an ex-ante/ex-post confusion, but the user isn't satisfied.

  First, I need to recall Harsanyi's framework: it combines expected utility axioms with Pareto efficiency to derive utilitarianism. Diamond's example challenges this by showing a situation where all options have the same expected utility sum, yet fairness demands a different choice. The economist's rebuttal is that fairness feelings arise from post-hoc reasoning, not ex-ante rationality.

  The user wants the strongest counterargument that validates fairness intuition without ignoring the ex-ante/ex-post distinction. They seek a substantial engagement, not just a survey of opinions. So I should build a case that fairness isn't reducible to ex-ante utility but reflects a normative principle about decision processes.

  Hmm, the key is to argue that Harsanyi's axioms miss something fundamental about social decisions. Individual expected utility under the coin flip might be identical ex ante (0.5 utils each), but the coin flip introduces a procedural element—equal opportunity—that isn't captured in utility sums. Even before the coin lands, the planner's choice of procedure communicates respect for individuals as equals. 

  I should emphasize that rejecting the coin flip (choosing person 1 arbitrarily) violates a principle of impartiality, which is distinct from utility maximization. This is where the symmetry argument bites: if the planner has no reason to favor person 1, flipping the coin is the only way to avoid arbitrary discrimination. 

  The economist might counter that symmetry is already handled by indifference between options. But fairness requires active avoidance of arbitrariness, not just indifference. Procedural fairness matters intrinsically—it's why we use lotteries in real life (e.g., school admissions). 

  I can also attack the "smuggling ex-post concerns" claim. The fairness intuition arises ex ante: we feel the coin flip is fair before the toss. It’s about the decision structure, not outcomes. Harsanyi’s framework fails to model this because it reduces all value to individual utilities, ignoring how procedures express respect. 

  Finally, I should address qualifications: rejecting Harsanyi doesn’t mean abandoning utilitarianism entirely, but insisting on procedural fairness when utilities are symmetric. This preserves the theorem’s core while accommodating Diamond’s insight. 

  The user’s physics background suggests they’ll appreciate analogies to symmetry in physics—e.g., how indistinguishability principles lead to different statistical mechanics (Bose-Einstein vs. Maxwell-Boltzmann). The coin flip is like enforcing a symmetric wavefunction. 

