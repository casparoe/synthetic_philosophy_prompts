answer: |-
  Your physicist's intuition is spot-on—there *is* something substantive here that Harsanyi's framework struggles to capture. Diamond's example exposes a genuine limitation, not mere confusion. Let's dissect the "ex-ante/ex-post confusion" rebuttal and build the case that fairness tracks a normatively significant feature missing in Harsanyi's aggregation.

  ### Core Argument: Fairness as a Requirement of Impartiality Under Symmetry
  The strongest case rests on recognizing that **Harsanyi's axioms fail to encode a fundamental principle of *procedural impartiality* when individuals are symmetric and outcomes are stochastic.** Here’s the breakdown:

  1.  **The Symmetry Imperative:**
      *   In Diamond’s scenario, individuals are identical in all normatively relevant respects (utilities, claims, status). The planner has *no justifiable reason* to favor one over the other.
      *   Choosing (a) "give to person 1" *arbitrarily* violates this symmetry. It treats identical individuals differently without grounds. This arbitrariness is intrinsically objectionable from a moral perspective concerned with equal respect.
      *   The coin flip (c) *actively respects* symmetry. It guarantees that the *process* treats individuals equally by giving them identical ex-ante chances. This procedural equality is the only way to avoid arbitrary discrimination when a deterministic choice *must* favor one symmetric individual over another.

  2.  **Engaging the "Ex-Ante/Ex-Post Confusion" Charge:**
      *   **Charge:** The fairness intuition illegitimately imports concern about the *realized outcome* (e.g., "It's unfair Bob got it and Alice didn't!") into the ex-ante evaluation.
      *   **Counter:** This misdiagnoses the intuition. The core fairness concern arises *entirely ex-ante* and is *procedural*:
          *   *Before the coin is flipped*, choosing (a) is objectionable because it *unjustifiably denies person 2 any chance*. It’s the *denial of opportunity* itself, not the potential future outcome, that violates fairness. The planner, knowing symmetry, chooses a procedure that *systematically excludes* one identical individual.
          *   Choosing (c) is fair *ex-ante* precisely because it *grants equal opportunity* ex-ante. The fairness judgment is made at the decision point, based on the structure of the chosen procedure and its alignment with the symmetry of the individuals. The potential for a "bad" realized outcome (e.g., person 2 losing the flip) is *irrelevant* to the ex-ante fairness of the procedure; what matters is that the procedure itself didn't *build in* an arbitrary disadvantage.
          *   **Analogy:** Consider allocating a scarce lifesaving drug to two identical patients. Choosing patient A arbitrarily feels wrong *before* anyone gets the drug, because you *know* you are denying patient B a chance for no reason. The lottery feels fair *before* the draw, because it acknowledges their equal claim. The moral wrong in choosing (a) occurs at the moment of decision.

  3.  **What Harsanyi Misses: Beyond Ex-Ante Pareto & EU**
      *   Harsanyi's theorem relies on **ex-ante Pareto indifference** and individual **expected utility (EU)** maximization. In Diamond's case:
          *   *Ex-Ante Pareto Indifference:* Both individuals are indifferent between (a), (b), and (c) ex-ante (each gets EU=0.5 in all cases). So the planner is indifferent.
          *   *Individual EU:* Each individual evaluates only their *own* probability of getting the good (0, 1, or 0.5). They are rationally indifferent.
      *   **The Gap:** This framework has *no conceptual resources* to evaluate the *procedural justice* of *how* that 0.5 EU per person is achieved. It cannot distinguish between:
          *   A procedure respecting symmetry (coin flip).
          *   A procedure arbitrarily favoring one individual (give to 1).
          *   A procedure based on a hidden bias (e.g., planner secretly hates redheads, and person 2 is a redhead, leading to (a)).
      *   All three satisfy ex-ante Pareto indifference and yield identical individual EU profiles. Yet, only the coin flip satisfies the moral demand for *impartiality under symmetry*. Harsanyi's axioms are insufficient to capture this demand. They conflate "no one objects ex-ante" with "the decision procedure is just."

  4.  **The Positive Case for Fairness as Fundamental:**
      *   **Equal Respect:** Impartial procedures (like lotteries) express fundamental equal respect for persons when they have symmetrical claims. Arbitrary choice expresses disregard.
      *   **Legitimacy & Stability:** Decisions perceived as fair (even when outcomes differ) foster legitimacy and social cohesion. Arbitrary decisions breed resentment and undermine trust in the planner/institutions.
      *   **Agency & Opportunity:** Fairness concerns the *distribution of agency/opportunity* within the decision structure, not just the distribution of final outcomes or expected utilities. Denying an equal chance denies equal standing in the process.
      *   **Non-Aggregability:** This procedural fairness is a *distinct social value* that cannot be reduced to or derived from the aggregation of individual expected utilities. It operates at the level of the *social choice mechanism itself*.

  5.  **Qualifying Harsanyi, Not Necessarily Rejecting Utilitarianism:**
      *   Diamond's challenge doesn't require abandoning utilitarianism entirely. It requires recognizing that **Harsanyi's *specific axiomatic route* (relying *only* on ex-ante Pareto and EU rationality) is incomplete**.
      *   A plausible response is to **add a principle of procedural impartiality under symmetry** as a *constraint* on the social planner's choices *when* individual ex-ante utilities are symmetric and outcomes are indivisible/stochastic. This principle would break the indifference in Diamond's case, mandating the coin flip.
      *   This preserves Harsanyi's core insights (aggregation, EU) in *asymmetric* cases or deterministic choices but acknowledges an independent fairness constraint in symmetric stochastic dilemmas. It reflects that "welfare" has both *outcome* (utility) and *procedural* dimensions.

  ### Conclusion: Why Your Unease is Warranted
  Your chess-club economist friend is correct that *if* one accepts Harsanyi's axioms *as sufficient* for social rationality, then indifference follows. However, Diamond's example powerfully argues that **those axioms are *not* sufficient.** They fail to account for a fundamental normative requirement: **when individuals are symmetric and a good is indivisible, a fair social planner must use a procedure that respects that symmetry impartially.** The fairness intuition in the coin-flip case is tracking this real requirement of *procedural justice under conditions of symmetry*. It arises ex-ante as a judgment about the legitimacy of the decision *process*, not ex-post as regret about outcomes.

  Harsanyi's theorem provides a powerful foundation for utilitarian aggregation *based on individual preferences and risk attitudes*. Diamond shows it cannot be the *whole* story; it lacks the machinery to handle the moral significance of *procedural equality* when individuals are indistinguishable and choice is stochastic. Your intuition as a physicist recognizes that symmetry demands a specific treatment – the coin flip enforces that symmetry in the social decision rule, just as symmetry principles constrain physical laws. This is a substantive gap, not a confusion.
