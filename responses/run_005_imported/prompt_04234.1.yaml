  **Key Insight Both Miss**:  
  The fish’s death had a **physical cause** (lack of food on Wednesday) and a **responsible cause** (Owen’s duty-bound omission). Confusing these leads to deadlock. Physical causation is objective (anyone could have fed it), but responsibility is subjective (the sign-up sheet). Naomi wins on *blame*, Owen on *causal precision*—yet both err by treating "cause" as monolithic.
