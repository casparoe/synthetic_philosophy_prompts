  - Phlogiston theory said that burning releases phlogiston, while oxygen theory said combustion involves oxygen.

  - With better experiments, like Lavoisier's work showing mass conservation and the role of oxygen, phlogiston was disproven.

  - So, this was a transient underdetermination that was broken by evidence. At one point, both could explain some phenomena, but not all, and new evidence settled it.

