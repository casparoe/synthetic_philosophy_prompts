  Now, let's go through each pair one by one.

  **(a) Newtonian absolute space and motion vs. Leibnizian/Machian relationalism about motion**

  - This is a debate in the philosophy of physics about the nature of space and motion. Newton believed in absolute space, while Leibniz and later Mach argued for relational space, where motion is relative to other objects.

  - In modern physics, especially with general relativity, relationalism has been incorporated to some extent, but the debate isn't fully settled. Einstein was influenced by Mach's principle.

  - However, there are arguments that this underdetermination might be permanent. For example, the hole argument in GR relates to this, but here it's separate. Some think that no experiment can distinguish absolute vs. relational space because all observations are relational. So, this might be permanent underdetermination.

  - I recall that in Newtonian mechanics with gravity, absolute space has observable effects like in the bucket experiment, but in GR, it's different. Still, the metaphysical aspect might not be empirically decidable. I think this is often considered a case of permanent underdetermination.

  **(b) Pre-telescopic Ptolemaic vs. Copernican heliocentrism**

  - This is historical. Before telescopes, with naked-eye observations, both models could explain planetary motions using epicycles or different centers.

  - Once telescopes were invented, evidence like the phases of Venus and the moons of Jupiter supported heliocentrism over geocentrism decisively.

  - So, this was a transient underdetermination that was broken by new evidence. It was tied only with the evidence available at the time.

  **(c) Lorentz's ether theory vs. special relativity**

  - Lorentz had a theory with an ether and length contraction to explain the null result of Michelson-Morley, while Einstein's special relativity did away with the ether.

  - Empirically, both theories make the same predictions for all experiments to date; they are empirically equivalent.

  - However, special relativity is simpler and doesn't require unobservable entities like the ether. But in principle, could future evidence distinguish them? Probably not, because any evidence that might seem to favor one could be incorporated into the other. For example, Lorentz could add more ad-hoc assumptions.

  - This is often cited as a case of permanent underdetermination because the theories are empirically equivalent and no observation can break the tie, as they predict the same outcomes.

  **(d) Bohmian mechanics vs. standard (Copenhagen) quantum mechanics**

  - Bohmian mechanics is a pilot-wave theory that is deterministic, while Copenhagen is probabilistic.

  - Both make the same empirical predictions for all quantum experiments so far. However, there might be ways to distinguish them in principle, such as in non-local contexts or with hidden variables tests, but Bell's theorem shows that local hidden variables are ruled out, but Bohmian is non-local.

  - Bohmian mechanics agrees with all standard quantum predictions, so it's empirically equivalent. But some argue that future experiments, like those involving quantum gravity or cosmology, might provide evidence, but it's unclear.

  - Generally, this is considered empirically equivalent, and the underdetermination might be permanent because both can explain the same data. However, there are debates; for instance, Bohmian mechanics has different ontological commitments, but no testable difference.

