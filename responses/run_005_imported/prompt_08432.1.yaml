  **(e) The "hole argument" in general relativity — two metrics related by a diffeomorphism**

  - This is about general covariance. Einstein struggled with this; it says that if you have two metrics that are diffeomorphic, they represent the same physical situation, just in different coordinates.

  - In GR, this is resolved by saying that such metrics are physically equivalent; they don't represent different realities. So, there's no underdetermination; it's a gauge freedom.

  - Therefore, this was never a real underdetermination; it was an apparent one that was resolved by understanding the theory better. So, it's merely apparent.

