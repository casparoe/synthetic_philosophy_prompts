answer: |-
  This is a deeply uncomfortable ethical bind, and you're right – there's no perfect solution that avoids all harm. Both choices involve breaking a commitment: either to your parents (confidentiality) or your cousin (radical honesty). However, we can analyze the nuances to find the *least harmful* and most *principled* path:

  1.  **The Core Conflict:**
      *   **Promise to Parents:** You made a specific commitment based on past events (cousin's spoilers) and their genuine fear of embarrassment.
      *   **Pact with Cousin:** You have a mutual understanding of radical honesty, especially given her history of feeling excluded. A direct "no" would be a lie, violating this core principle.

  2.  **Why "Pick Family" Doesn't Work:** You've identified this perfectly. Both *are* family, and both values (keeping promises & radical honesty) are important familial bonds. Choosing one inherently "wrongs" the other.

  3.  **Analyzing the Options:**

      *   **Option 1: Lie to Your Cousin (Keep the Secret)**
          *   **Pros:** Honors your explicit promise to your parents. Protects the surprise your grandmother likely deserves.
          *   **Cons:** Violates your foundational pact with your cousin. Confirms her worst fears about being excluded/lied to by this side of the family. Damages trust potentially irreparably. You become complicit in her exclusion. Feels morally compromising.
          *   **Likely Outcome:** Short-term success for the party, long-term damage to your relationship with your cousin and her feeling of belonging.

      *   **Option 2: Tell the Truth (or Tip Her Off) to Your Cousin (Break the Secret)**
          *   **Pros:** Honors your honesty pact with your cousin. Includes her (in a way) and validates her desire to belong. Avoids direct lying.
          *   **Cons:** Betrays your parents' explicit trust and their specific request. Risks the surprise being spoiled *again*, causing significant hurt and embarrassment to them and potentially your grandmother. Validates your parents' reason for excluding her in the first place. Could cause major family conflict.
          *   **Likely Outcome:** Short-term family conflict and potential party failure, long-term damage to your parents' trust and your cousin's reputation within the family.

  4.  **The "Third Way" - Nuanced Honesty (Most Principled Path):**
      Given the pact, outright lying seems the most corrosive to your specific relationship with your cousin. Instead, try **radical honesty *about the situation itself*, without revealing the secret:**

      *   **Acknowledge Her Feelings & Your Bind:** "Cousin, I know you've felt left out before, and I hate that. This question puts me in a really tough spot. I've been asked by Mom and Dad to keep something specific confidential, *and* you and I have always promised not to lie to each other. I feel stuck between those two things right now."
      *   **Focus on Her Value & the Purpose:** "I need you to understand something really important: The *reason* anyone might hesitate to include you in surprises isn't about *excluding you* personally from the *family*, but specifically about protecting the *surprise element* because of what happened before. It's about Grandma's experience, not your worth. You *are* important to Grandma and to me."
      *   **Make an Appeal & Shift Focus:** "Can I ask you a huge favor? Can you trust me that whatever might or might not be happening, it's being done out of love for Grandma? And can we focus on how *we* can make her feel special on her actual birthday, regardless of any surprises? Maybe we could plan something small together for her that day?"
      *   **The "Non-Answer" with Context:** "Because of the promise I made and our pact, I can't answer that question directly right now without breaking one of them. Please don't put me in that position. Let's just focus on celebrating Grandma."

      **Why this is better than lying:**
      *   It's truthful about your predicament.
      *   It acknowledges her feelings and validates her belonging.
      *   It implicitly confirms *something* might be happening without revealing details, respecting your pact *more* than a lie would.
      *   It appeals to her higher nature (love for Grandma) and offers a positive alternative (doing something *with* her).
      *   It protects the core of your relationship (radical honesty) by being transparent about the silence.

  5.  **The Hard Truth & Recommendation:**
      *   **There is a "right-er" choice:** Protecting your integrity in the relationship where you have a specific, mutual pact of radical honesty (with your cousin) is arguably more crucial *for that specific relationship* than keeping a secret requested due to past failures (by your parents). The "nuanced honesty" approach above allows you to do this while minimizing the risk to the surprise.
      *   **You *will* disappoint someone:** Your parents might be upset if your cousin figures it out. However, you haven't *told* her; you've been honest about your bind. If they get "mortified," it stems from *their* choice to exclude her based on past actions, not solely from your attempt to navigate an impossible request ethically.
      *   **Recommendation:** Choose the **Nuanced Honesty** path with your cousin. Explain your bind, affirm her value, appeal to her love for Grandma, and offer an alternative way to participate. This:
          *   Minimizes direct harm (no lie, no explicit spoiler).
          *   Upholds your core values *as much as possible* in this situation.
          *   Preserves the potential for trust with your cousin.
          *   Shifts the focus to celebrating Grandma.
      *   **Be Prepared:** Your cousin might still deduce the surprise. If she does, *and if she spoils it again*, that consequence is on *her*, validating your parents' concern but stemming from *her* choice, not your betrayal of your pact. You acted with integrity within your relationship with her.

  This situation highlights the flaw in your parents' strategy. Excluding someone prone to spoiling surprises *and* sensitive to exclusion often creates the very pressure that leads to probing and potential leaks. By addressing the underlying issue (her feeling excluded and her past actions) with empathy and honesty, you stand the best chance of navigating this without destroying trust. It's messy, but this path offers the most integrity. Good luck.
