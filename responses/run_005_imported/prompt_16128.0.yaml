answer: |-
  ## To the Woman on the Ridge: A Toast to Mom

  **(Raise your glass slightly, warm smile)**  
  Family, friends, fellow volunteers… especially you volunteers who’ve braved blizzards and scree slopes alongside this incredible woman for three decades… thank you for letting me stand here tonight. We’re gathered for one simple, profound reason: to honor my mother. Thirty years. Thirty years of dropped dinners, late-night callouts, frozen fingers, and bringing people home against all odds. Mom, the mountains, and this community, owe you a debt we can never truly repay. So, let’s start by just saying: **Thank you.** *(Take a sip, gesture for others to do the same if comfortable).*

  Now, anyone who’s spent five minutes around mountain rescue knows it’s not just about ropes and radios. It’s about impossible choices made in the teeth of a gale, with seconds ticking by. And Mom, one choice you made, way back in your second year, has echoed through this room, and probably every gear shed and trailhead since. The storm. The closing window. Two ridges: two souls on one, seven on the other. And you… you didn’t just send the team to the seven. You had them draw lots.

  *(Acknowledge the room knowingly)*  
  Oh, I know. I *know*. Half of you are leaning forward right now. “Taurek versus Parfit,” right? John Taurek, arguing in “Should the Numbers Count?” that we can’t simply add up lives like beans in a jar. That saving *A* and *B* isn't inherently "more good" than saving *C* – that each life is a separate, immense world, and flipping a coin respects the equal moral claim of each *individual* facing doom. Then Derek Parfit fires back in “Innumerate Ethics” – no, he says, numbers *must* count! Failing to save the greater number when you *could* have is objectively worse, a greater loss of what matters: human life and potential. It’s cold math, maybe, but math that minimizes total tragedy.

  *(Look directly at your mother)*  
  Mom, you’ve always been quiet about that night. You just said the numbers “weren’t the kind of thing that should settle it on their own.” Reading those philosophers… I finally understood the weight you carried. Taurek saw the *individual* in the storm, screaming in the dark. Parfit saw the *outcome*, the grim arithmetic of loss.

  **(Shift tone, more decisive but still warm)**  
  So, do I think you got it right? Standing here, your son, knowing the leader you became? **Absolutely, I do.**

  Not because every life *isn't* precious – they are, blindingly so. But because Taurek grasped something fundamental about the *moment*, about the *position* you were in, that Parfit’s “greater good” calculus misses. You weren’t a distant policymaker allocating resources. You were on that mountain, responsible *directly* to specific people facing annihilation. To choose the seven *because* they were seven isn’t saving more individuals; it’s *sacrificing* two specific individuals *because* they are fewer. It treats those two as less worthy of rescue, purely because of the accident of their location relative to others *you couldn't reach anyway*.

  Drawing lots? That wasn’t indecision, Mom. That was **profound moral courage.** It was acknowledging the agonizing truth: that you couldn't save everyone, but you refused to make the two on the north ridge *expendable* simply due to a number. You refused to let the accident of grouping dictate whose life had more claim on your team’s effort *in that impossible moment*. You treated each life, each *stranded soul*, with the same terrifying respect. You accepted the burden of the lottery’s randomness rather than impose the cruelty of counting.

  **(Pause, look around at the volunteers, then family)**  
  The split it caused? It proves how hard this is. Parfit’s view is powerful, logical. But Mom, that night, you chose Taurek’s path. You chose the path that looks the individual in the eye, even in the howling wind, and says, “Your chance is equal. Your life matters, not your tally.” And that, I believe, is the bedrock of the trust this team built under you. It wasn’t about being efficient calculators of life; it was about being unwavering guardians of *every* life you *could* reach, on its own terms.

  **(Voice softens, filled with pride)**  
  So, for thirty years, you’ve led not just with skill and bravery, but with that deep, unwavering humanity. You’ve taught us that leadership isn’t just about making the easy call, but sometimes the unbearably hard one that honors the individual spark. You’ve shown us that integrity means facing the storm, and the silence afterwards, with clear eyes.

  **(Raise glass high)**  
  Mom, to your incredible thirty years of service: May your retirement be filled with calm skies, warm sun, and trails walked purely for joy. To the woman on the ridge, who chose the harder, more human path. To a leader who understood the math of mercy. To my mother. **We all raise our glasses to you!**

  **(Hold the moment, smiling at her)**
