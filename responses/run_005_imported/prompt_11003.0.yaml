  First, I need to understand why the team is resistant. The user mentioned there's no policy requiring CC'ing the CEO, so it's likely a cultural habit. But the team's unease suggests there might be unspoken concerns. Maybe they fear losing visibility, think the CEO still wants the emails, or worry about accountability. 

