answer: |-
  Your unease is justified. The epistemic dissolution fails to capture the full moral reality of resultant luck, even under your strong stipulation of perfect antecedent parity. Here’s a direct argument against it, engaging your three fallback moves:

  **Core Claim:** The driver who kills *is* genuinely more blameworthy because **causing harm fundamentally alters the moral landscape of the agent's action and imposes a unique relational debt.** Blameworthiness isn’t solely a function of will or risk-creation; it incorporates the actual *exercise* of destructive agency in the world. The epistemic account flattens morality into a courtroom exercise about evidence, ignoring the irreducibly relational and consequential nature of responsibility.

  ### 1. Against Zimmerman: Wrongness vs. Blameworthiness & the Primacy of Harm
  Zimmerman attempts to quarantine luck by conceding it affects the *wrongness* of the act (killing is worse than risking a kill) while insisting *blameworthiness* attaches only to the will (the reckless state of mind). **This separation is artificial and unsustainable.**
  *   **Harm Completes the Moral Object:** Recklessness *aims* at potential harm; it is defined by its indifference to foreseeable bad outcomes. When that potential is actualized, the reckless will achieves its *telos*. The driver who kills hasn’t merely *willed* recklessly; they have *realized* the very object of their willful indifference. Their agency has *succeeded* in its dangerous aspect. This success changes the moral description of *what they have done*: not just "acted recklessly," but "killed through recklessness." Blameworthiness attaches to *this* completed act, not just its abstracted mental component. To blame only the will is to blame a ghost, not the flesh-and-blood agent who *did* the harm.
  *   **The Relational Debt:** Killing creates a unique moral relationship: a debt to the victim and their community that *cannot* exist for the merely reckless driver. This debt isn’t just about compensation; it’s about the *agent’s position* as the destroyer of a life. Blameworthiness is partly *constituted* by this relational fact. The killer owes an account, a burden of justification (or lack thereof), and a stain on their moral record that the merely reckless driver, however identical in prior state, does not bear. Zimmerman’s focus on the will ignores how blameworthiness is inherently tied to the *position* the agent occupies in the network of harm.

  ### 2. Against Reducing Agent-Regret to Non-Moral Sentiment
  The suggestion that Williams’s "agent-regret" is merely a fitting *non-moral* feeling (like sadness) misreads its depth and function.
  *   **Agent-Regret as Moral Recognition:** Williams identifies agent-regret as a response specifically to being the *cause* of harm, distinct from regret about the state of affairs or sympathy for the victim. It *is* a moral emotion because it acknowledges the agent’s *unique authorship* of the bad outcome. It’s the feeling of "I *did* this," not just "this happened." For the driver who kills, this regret is *fitting* precisely because they *are* more blameworthy. Their regret acknowledges the special burden they carry – the burden of being the one whose agency directly extinguished a life. The non-killing driver, while perhaps horrified by the risk they took, cannot coherently feel *this specific* regret because they *didn’t* cause the harm. Denying the moral core of agent-regret reduces it to bystander sympathy, erasing the crucial distinction between causing and witnessing.
  *   **Evidence of Asymmetric Burden:** The persistence and unique character of agent-regret *demonstrate* the moral residue. If the epistemic account were correct and blameworthiness were truly identical, the killer's profound, life-altering regret would be disproportionate or irrational – merely a response to bad luck. Yet it feels intuitively *appropriate* and deeply connected to their moral identity *because* they bear a heavier burden of responsibility. Their regret is the subjective correlate of the objective moral asymmetry.

  ### 3. Against the "Idealization" Objection
  The claim that stipulating full epistemic parity reintroduces the asymmetry it aims to deny **fundamentally misunderstands the thought experiment's purpose and exposes the epistemic account's weakness.**
  *   **The Stipulation's Role:** The stipulation *isolates* resultant luck. By eliminating *all* other differences (antecedent character, intent, observable risk-taking), we force the question: Does the *outcome alone* make a moral difference? If the epistemic account requires *actual* epistemic asymmetry in the real world to explain the *intuition* of differing blameworthiness, then *under stipulation*, it *must* concede that blameworthiness *is* identical. But our moral intuition stubbornly persists: the killer *still* seems more blameworthy *even knowing* the other driver was identical beforehand.
  *   **The Account's Failure Under Stipulation:** The epistemic dissolution *relies* on the premise that worse outcomes provide better evidence of worse character/will. Under perfect parity, this premise collapses. There *is no* hidden character flaw or greater recklessness to be revealed in the killer. They were, ex hypothesi, identical. Therefore, the epistemic account *cannot* explain the persistent intuition of greater blameworthiness in the killer within this scenario. Its *only* recourse is to dismiss the stipulation as "unrealistic," but this is evasion. The thought experiment reveals that *even if* we could know everything about the antecedent states, the outcome itself generates a moral difference the epistemic account cannot accommodate. The residual intuition under stipulation *is* the evidence of resultant moral luck. Dismissing the stipulation protects the theory from falsification by the very phenomenon it seeks to explain.

  **Conclusion & Verdict:** The epistemic dissolution fails. While controlling for will and risk is crucial, morality is not hermetically sealed from consequences. **Causing grievous harm through reckless agency fundamentally amplifies blameworthiness.** It completes the reckless intention, imposes a unique relational debt, and burdens the agent with a form of responsibility (captured by agent-regret) that cannot exist for the merely reckless. Zimmerman's separation of wrongness and blameworthiness is artificial; the harm done is integral to *what* we blame the agent *for*. Reducing agent-regret to non-moral sentiment ignores its core function as acknowledgment of unique causal authorship. And objecting to the stipulation concedes that the epistemic account cannot survive the pure case of resultant luck. **Therefore, the driver who kills *is* genuinely more blameworthy than her identical counterpart who was merely lucky. The residue is real, reflecting the profound moral significance of what we actually do in the world, not just what we will or risk.** Luck shapes not just our fate, but the moral weight we carry.
