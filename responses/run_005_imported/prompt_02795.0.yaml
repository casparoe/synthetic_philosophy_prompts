answer: |-
  ## Dialogue: The Height Line Standoff  
  *[ED (Epistemicist) and SAL (Supervaluationist) stand before a perfectly ordered line of 100 people. Heights range precisely from 150.0 cm to 199.9 cm in 0.5 cm increments.]*

  **SAL:** Look at this line, Ed. Perfect gradation. Now, point precisely where ‘tall’ stops applying. Go on. Person 182.3 cm? Tall? Person 181.8 cm? Not tall? You *insist* there’s *some* exact point, known only to an omniscient being. But *how*? Meaning is grounded in use. Show me the linguistic practices, the behavioral dispositions, that could *possibly* fix a boundary *that* precise – down to half a centimeter! It’s absurd. Our usage is tolerant; small differences don’t trigger a switch. Where’s the evidence for this mythical sharp cutoff in the world of speakers?

  **ED:** Your complaint presupposes meaning supervenes transparently on *observable* use, Sal. But meaning isn’t a ghost in the machine; it’s constituted by complex, potentially unknowable, patterns across a community’s dispositions and causal histories. Just because *we* can’t discern the exact point where accumulated slight variations in usage tip the scales doesn’t mean there isn’t one. Our ignorance is profound, not proof of indeterminacy. The vagueness is epistemic – a failure of *our* access, not a feature of the semantic *fact*.

  **SAL:** Semantics isn’t mysticism! If meaning is just use, and use exhibits tolerance (we accept ‘tall’ for both 181 cm and 181.5 cm, and for 181.5 cm and 182 cm...), then tolerance propagates. There *is* no fact of the matter where it stops because our practices *don’t determine* one. They determine a *range* of acceptable precisifications. That’s why we get truth-value *gaps* for borderline cases – statements aren’t true *or* false relative to the meaning fixed by use. ‘Definitely tall’ applies clearly at one end, ‘definitely not tall’ at the other, and there’s a zone of indeterminacy in between. *That* respects the actual phenomenology of vagueness.

  **ED:** Ah, the siren song of ‘definitely’! But you’ve merely kicked the can down the road, Sal. You replace the vague predicate ‘tall’ with the ostensibly precise meta-predicate ‘definitely tall’. But is *‘definitely tall’* itself precise? Look again. Where does ‘definitely tall’ stop applying? Is there a sharp boundary between those who are definitely tall and those who are merely borderline tall? Of course not! ‘Definitely’ inherits the vagueness. You’ve traded first-order sharp boundaries for second-order sharp boundaries – the boundary between ‘definitely tall’ and ‘not definitely tall’! Higher-order vagueness plagues your super-truth just as badly. Your ‘solution’ is an infinite regress.

  **SAL:** Nonsense! ‘Definitely tall’ isn’t a *new* predicate we’re defining. It’s a reflection of the *admissible precisifications* of ‘tall’ fixed by meaning-as-use. The indeterminacy of ‘definitely’ *is* the original vagueness manifesting at the meta-level – it’s not a *new* problem! We don’t need infinitely many ‘definitely’s. The lack of a sharp boundary for ‘definitely tall’ *just is* the manifestation of the borderline cases for ‘tall’ under different ways of making it precise consistently with use. The regress is illusory; it’s the same phenomenon viewed differently. *You* are the one positing an arbitrary, inexplicable, unknowable fact *beyond* all possible evidence from use!

  **ED:** And *you* are positing truth-value gaps and indeterminacy *equally* beyond any possible evidence! Can you point to the linguistic practice that *determines* the exact set of admissible precisifications? Where’s the sharp boundary between precisifications that respect meaning and those that don’t? Your ‘admissible’ is just as vulnerable to higher-order vagueness as my ‘tall’. Meaning *does* fix a sharp cutoff – it’s a complex fact about our language and the world. Our inability to know it is a profound epistemological limitation, not a semantic revolution. Your supervaluations smear the ignorance across truth-values, but the core problem of precision arising from imprecise practice remains. You disguise it; you don’t dissolve it.

  **SAL:** The difference is, supervaluationism *models* the tolerance inherent in use! It explains *why* we hesitate and disagree in the middle – because multiple assignments are valid. Your epistemic cutoff is a brute posit, utterly disconnected from the observable, tolerant behavior of speakers. How could communal practice *generate* a boundary finer than any practice could possibly discriminate? *That’s* the mystery! Meaning supervenes on use, Ed. If the supervenience base is fuzzy, the meaning *cannot* be razor-sharp. Your sharp boundary is a phantom!

  **ED:** And your lack of a boundary is an artifact of mistaking epistemological fog for ontological void! The fuzziness *is* in our knowledge, Sal, not in the world or the semantics. Meaning constrains extension more tightly than we can ever discern. Your ‘admissible precisifications’ are a useful fiction for modeling our ignorance, but they don’t reflect an underlying semantic indeterminacy. The boundary is real, fixed by the totality of facts about usage and cognition, however inaccessible to us. Higher-order vagueness is just higher-order ignorance. The line *is* sharp. We just can’t see where it is.

  **SAL:** *(Gesturing at the seamless height gradient)* Then show me the practice that draws *that* line. Until you can, supervaluationism remains the only account faithful to the actual phenomenon of vagueness *in our language*.
  **ED:** *(Staring intently at the line)* And until you can explain where *your* boundaries for ‘definitely’ lie without invoking yet more vagueness, epistemicism remains the only account faithful to the bivalence inherent in *truth*.
  *[Both turn back to the line, frowning, the argument unresolved.]*
