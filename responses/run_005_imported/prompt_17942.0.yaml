  Based on Sidgwick's documented rigor, ethical scruples, and the hard-won lessons from the SPR's work, here's how I believe he would have adjudicated the Bem affair, reconstructing his likely response step-by-step:

  1.  **Initial Deep Skepticism Rooted in Self-Distrust:** Sidgwick wouldn't dismiss Bem's claims out of hand – his entire SPR career was predicated on investigating the seemingly impossible. However, his immediate reaction would be profound suspicion *precisely because* the findings aligned with a deep human (and his own) desire: evidence for non-material aspects of mind or perception transcending time. He knew better than anyone the insidious power of "wish-transmuted thought" (as Myers called it). The *strength* of Bem's claims in a mainstream journal would trigger Sidgwick's alarm bells about unconscious bias – both in Bem's experimental design/analysis and in the journal's review process. He would suspect the "dualistic" pull was at work: the desire for a groundbreaking discovery (self-interest) potentially overriding the dispassionate demands of truth (the general good of science).

  2.  **Critique of Significance Testing as Insufficient (and Known to Be So):** Sidgwick wouldn't have been surprised by the fragility of Bem's statistics under Bayesian re-analysis or replication attempts. His SPR work, especially the Census, was a brutal education in:
      *   **The Deceptiveness of Coincidence:** He spent decades grappling with how easily the human mind perceives meaning in random clusters. Standard NHST, focusing solely on *p*-values against a null of pure chance, was precisely the tool he used *and* found wanting. He knew it was vulnerable to Type I errors, especially when investigating rare or extraordinary phenomena, and crucially, when multiple comparisons or optional stopping were possible (as was the case with Bem's 9 experiments).
      *   **The Need for Stronger Evidence:** Sidgwick demanded *converging lines* of evidence and *independently verifiable* phenomena. A series of experiments yielding *p*-values hovering around 0.05 (some just under, some non-significant) using novel, context-dependent paradigms would strike him as inherently weak evidence for a claim as extraordinary as precognition. He would see NHST, as commonly practiced, as a known trap for generating false positives, especially when fueled by desire – a lesson learned painfully through the SPR's own often-inconclusive or ambiguous results.

  3.  **Anticipation of the Bayesian Critique:** Sidgwick likely *would* have anticipated the core of Wagenmakers' critique *before* seeing it, driven by his statistical caution and awareness of prior probability:
      *   **Prior Plausibility:** Sidgwick understood that the *a priori* likelihood of a hypothesis mattered profoundly. While open to the *possibility* of precognition, his decades of rigorous, failed attempts to find conclusive evidence for even simpler psychic phenomena (telepathy, apparitions coinciding with death) would have led him to assign a *very low* prior probability to Bem's claims. He knew extraordinary claims require extraordinary evidence – not just a collection of barely-significant *p*-values.
      *   **Weighing the Evidence Properly:** Sidgwick's approach was fundamentally about *weighing* evidence, considering alternatives (like bias, coincidence, methodological artifact), and assessing the *balance* of probabilities – a mindset far closer to Bayesian thinking than to the binary "significant/non-significant" logic of NHST. He would instinctively ask: "Given how easily desire and subtle methodological flaws *could* produce these results, and given the immense implausibility of the claim, is this collection of *p*-values *really* sufficient to overcome the prior unlikelihood?" His answer, based on his SPR experience, would be a resounding "no."

  4.  **Assessment of the Scandal and Reform:**
      *   **Irony and Validation:** Sidgwick would find deep, almost tragic, irony in the fact that a scandal originating in parapsychology (a field he pursued with the utmost seriousness but found perpetually elusive) became a catalyst for reforming mainstream scientific practice. It would feel like a validation of his lifelong struggle: the methodological flaws and susceptibility to bias he battled in the search for evidence *for* the paranormal were, in fact, fundamental weaknesses in *all* human reasoning under desire, endemic to the broader scientific enterprise.
      *   **Cautious Optimism:** He would view the push towards preregistration, data sharing, Bayesian methods, and a focus on effect sizes and replication as *precisely* the kinds of safeguards his own work cried out for. These reforms directly address the "dualistic" tension he identified – creating structures to bolster the "general good" (scientific integrity) against the "self-interest" of researchers (careerism, confirmation bias, desire for striking results).
      *   **The Lingering "Dualism":** However, he would remain acutely aware that no reform can fully eradicate the "dualism of practical reason" from science. Preregistration is a tool, but human ingenuity in rationalizing desired outcomes persists. The Bem affair, for Sidgwick, would ultimately underscore the *perpetual* need for the rigorous, self-doubting, ethically-driven vigilance he embodied – a vigilance born not from cynicism, but from a profound understanding of the human mind's capacity for self-deception, especially when what it seeks aligns with its deepest hopes.

  **In Sidgwick's Voice (SPR Presidential Address Register):**

  >"Fellow Members of the Society,
  >
  >We are confronted, in this recent American study on 'feeling the future,' with a phenomenon both arresting and profoundly illustrative of the perils inherent in our pursuit. Here, within the established halls of psychological science, we find claims of precognitive faculty demonstrated, we are told, through methods deemed routine – the null hypothesis and its statistical signification.
  >
  >Yet, let us recall the arduous lessons of our own Census, and countless inquiries besides. Have we not learned that the human propensity to discern pattern amidst randomness is matched only by its capacity for unconscious artistry in the shaping of evidence? When a finding aligns so potently with a deep-seated human yearning – be it for communion beyond the grave, or in this instance, for perception unbound by time’s arrow – our first duty is not to credulity, but to the most searching distrust. Not distrust of the investigator's *integrity*, mark you, but of the subtle, pervasive influence of *desire* upon the very faculties of observation and judgment. This is the 'dualism' that haunts the practical reason of the scientist no less than the moral agent: the tension between the wish for the proposition to be true, and the dispassionate demands of Truth herself.
  >
  >Consider the statistical foundation. The mere attainment of 'significance,' hovering at that conventional threshold, across a series of experiments – does this truly suffice to establish a phenomenon overturning our fundamental understanding of causality? Our own work taught us that coincidence, amplified by selective memory or reporting, can mimic the signal we seek. The very methodology employed – this testing against a null of pure chance – we know to be fragile. It is vulnerable to the multiplicity of comparisons, the siren call of ceasing data collection when the desired result glimmers forth, the myriad unseen biases that creep into design. Is it not likely, perhaps even *probable* on the balance of prior experience, that these *p*-values reflect not a bending of time, but the bending of method under the weight of hope and expectation? A Bayesian reckoning, weighing the immense antecedent improbability against the strength of this particular evidence, strikes me not as a novel critique, but as the natural, necessary consequence of the caution we have long championed.
  >
  >That such an episode, emerging from the borderlands we have so diligently patrolled, should become the impetus for widespread methodological reform within psychology is a development rich with irony, yet not without a glimmer of validation. It demonstrates that the vulnerabilities we encountered in our specific quest – the susceptibility to bias, the insufficiency of routine significance testing for extraordinary claims, the corrosive potential of undisclosed flexibility – are not peculiar to psychical research, but are endemic to the scientific endeavor itself when desire outpaces rigor. The embrace of preregistration, open data, and more nuanced statistical reasoning represents a welcome, if belated, institutional recognition of the 'dualistic' peril. It is an attempt to fortify the citadel of disinterested inquiry against the besieging forces of self-interest and wish-fulfillment.
  >
  >Let us, therefore, regard the 'Bem affair' not with schadenfreude, nor with despair for our own elusive quarry, but as a stark reminder. It reaffirms the perpetual necessity of the ethical and methodological rigor we have striven to uphold: that constant vigilance against the self, that willingness to dwell in uncertainty, that profound distrust of results which too readily satisfy the heart's desire. For the 'dualism of practical reason' in science can never be wholly dissolved, only perpetually guarded against. These reforms are tools for that vigilance; let us hope they are wielded with the same relentless self-suspicion that our own vexing pursuit has, of necessity, instilled within us."

  This reconstruction positions Sidgwick not as a believer in precognition, nor as a dismissive skeptic, but as the rigorous, ethically-tormented methodologist he was. His profound awareness of the corrupting influence of desire on evidence evaluation, forged in the frustrating fires of the SPR, would have made him uniquely prepared to dissect the methodological and psychological frailties exposed by the Bem affair and the replication crisis it helped ignite. He would see the subsequent reforms as a necessary, if imperfect, attempt to institutionalize the very skepticism he had to apply constantly, manually, and often fruitlessly, in his own work.
