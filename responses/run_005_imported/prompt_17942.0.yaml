  On significance testing: Sidgwick's SPR work taught him that coincidences can appear significant without proper controls. He'd see NHST as inadequate for rare or extraordinary claims, needing stronger evidence. Bem's use of it would strike him as insufficient, echoing Fisher's ideas but without the robustness Sidgwick demanded.

