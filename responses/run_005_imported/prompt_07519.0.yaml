prompt: |-
  So for my school's philosophy club we started recording little interviews to put up on the club page, and next month's guest is a grad student friend of our ethics bowl coach who works on population ethics and defends critical-level utilitarianism as her fix for the Repugnant Conclusion. I got into this after reading the population ethics chapter of What We Owe the Future for a debate case last year, then went down a rabbit hole into actual Parfit and Arrhenius papers our coach forwarded, so I get the basic pitch: you set a "critical level" above zero, and a life only makes things better once its above that, which is supposed to stop a gazillion barely-happy people from ever beating out a smaller thriving population. But the more I read the more it seems like this just trades one monster for another -- theres this "Sadistic Conclusion" thing where the math apparently lets adding a handful of miserable people come out better than adding way more barely-positive ones, and picking the exact critical level seems kind of arbitrary too, like a sorites cutoff.

  Could you write me like 8-10 interview questions for her? I want at least one where she has to actually walk through, step by step, how the critical level is supposed to block the usual mere-addition argument (not just say "we add a threshold"), at least one that pushes hard on the Sadistic Conclusion where "that only happens with crazy numbers nobody would ever face" doesn't get to be the end of it, one on whether the critical level is arbitrary in basically the sorites-cutoff way I mentioned, and one asking if she's basically just relocated the Repugnant Conclusion to kick in a bit higher up the welfare scale instead of actually blocking it, since you could presumably rerun the same mere-addition argument using populations that are all safely above the critical level. I heard critical-level people sometimes retreat to a "critical range" instead of one exact number when someone calls the level arbitrary, so can you also make sure a question anticipates that move and asks whether that just trades arbitrariness for a bunch of populations that can't be ranked against each other at all. For every question throw in a quick follow-up tailored to whatever answer she'd probably give so it doesn't just stop after the first response, and maybe end on something like what would actually count as evidence against her specific view, not just against total utilitarianism. Sorry if some of my terminology's a bit off, I'm mostly self-taught on this part from papers our coach forwarded and some SEP articles.
