prompt: |-
  So my epistemology class has been stuck on norms of assertion for like two weeks now (Williamson's "you may assert p only if you know p," plus the weaker rivals that just want it true, or that you reasonably/justifiably believe it), and it's made me way too invested in an argument that happened in my apartment last week. My roommate Theo texted our group chat at 7am, "discussion section's cancelled today," because our TA's calendar had switched to "out of office" for that slot -- he didn't check his email or the course site first. Turned out he was right, section really was cancelled. My other roommate Nadia wouldn't let it go though, and honestly both of them said stuff that's stuck with me since. Roughly how it went:

  (1) Nadia said Theo got lucky -- he didn't know section was cancelled, he guessed off a calendar entry that couldve meant a dentist appointment for all he knew, and if people had skipped based on that and been wrong, it wouldve been on him.
  (2) Theo said he doesn't see the problem: the text was true, so how can a true assertion be a bad one?
  (3) Nadia said plenty of assertions are true by luck rather than by knowing, and that's exactly what was wrong with his -- "but it was true" doesn't get you off the hook if you didn't know it when you said it.
  (4) Theo said that's a weird standard, because he makes calls like that constantly and nobody bats an eye -- like when he says "library's closed, it's Sunday," he hasn't checked that either, he's just inferring, so what's the principled difference?
  (5) Nadia said the Sunday inference is basically never wrong, while "the TA's calendar looks weird" is wrong all the time, so his evidence just wasn't good enough this time, even though it happened to pan out.
  (6) Theo said fine, but now the real standard has quietly become "assert whatever you're well justified in believing," not "assert only what you know" -- and he doesn't think that's right either, because of the lottery case: you can be 99.9999% justified that your ticket lost without checking, and everyone still agrees you shouldn't flatly assert "it lost." So if huge statistical justification isn't enough there, why does his calendar-based justification count, and if it isn't enough there either, doesn't basically everything anyone confidently says all day fail the same test?

  Neither of them budged and I've been chewing on it since. Could you go move by move through (1)-(6) and give a verdict on each, as a JSON object like {"1": <score>, "2": <score>, ...} with scores from -2 (clearly wrong) to 2 (clearly right), and then explain each score in a sentence or two? And could you end by saying which of the three norms -- knowledge, truth, or justified/reasonable belief -- actually survives Theo's lottery point, since that's the thing they were both circling without quite naming it?
