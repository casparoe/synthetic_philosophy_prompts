  The lottery point is crucial here. It shows that even near-certain justification (99.9999% belief) isn't enough to warrant flat assertion - which demolishes both truth and justification norms. Only the knowledge norm survives because it demands actual factive grounding, not just probabilities or sincerity. Williamson's standard holds up precisely where the others fail. 

