  ### Explanations:
  1. **Nadia (Score: 1)**  
     *Correctly identifies the epistemic luck problem.* Theo lacked knowledge (only had weak evidence), making his assertion improper under knowledge norms, even though it was true. "Guessed" slightly overstates, but her core point stands.

  2. **Theo (Score: -1)**  
     *Overly simplistic view.* Truth alone isn't sufficient for proper assertion (e.g., lucky guesses). Assertions carry normative weight – you can mislead even with true statements if unsupported.

  3. **Nadia (Score: 2)**  
     *Perfectly captures the knowledge norm.* Directly addresses Theo's objection: truth by luck doesn't fulfill the epistemic responsibility of assertion. Central to Williamson's position.

  4. **Theo (Score: -1)**  
     *False equivalence.* Sunday library closures are highly stable social patterns (strong justification), while TA calendar quirks are unreliable. Not the same epistemic context.

  5. **Nadia (Score: 1)**  
     *Right about evidence quality* but blurs norms. She shifts toward justification ("evidence wasn't good enough"), which Theo exploits. Should've stuck to knowledge vs. luck.

  6. **Theo (Score: 2)**  
     *Devastating point.* Highlights why justification norms fail: lottery cases show near-certain justification still prohibits assertion. Exposes a fatal flaw in weaker norms.

  ---

  ### Which Norm Survives the Lottery Point?
  **Only the knowledge norm survives.** Here's why:

  - **Truth Norm (Assert only truth)**:  
    *Fails*: Lottery assertions ("Your ticket lost") are true 99.9999% of the time but are still improper. Truth alone permits reckless assertions.

  - **Justified/Reasonable Belief Norm**:  
    *Fails*: In lottery cases, you have overwhelming justification (99.9999% rational belief), yet asserting "It lost" is still widely considered inappropriate. Justification isn't sufficient.

  - **Knowledge Norm (Assert only what you know)**:  
    *Survives*: You don't *know* your lottery ticket lost before checking (knowledge requires more than statistical probability – it demands factive grounds). Thus, the norm correctly prohibits the assertion. Theo's calendar case also fails this norm (he didn’t know).  

  Theo’s lottery argument successfully defeats truth and justification norms by showing they permit assertions we intuitively reject. Only the knowledge norm aligns with our intuition that lottery assertions are improper *even when justified and likely true*, because knowledge is absent. Williamson’s standard withstands the challenge.
