  First, I recall that this resembles classic philosophical problems. The user's friend mentioned a well-known problem, likely the demandingness objection to utilitarianism. The user is stuck in a cycle where every additional hour can do more good, leading to exhaustion. They need a principled way to set boundaries without feeling guilty.

  The user's partner suggests logging off is fine, but they struggle to justify why. This indicates a need for ethical frameworks that accommodate personal limits. I should consider different moral theories. Utilitarianism might demand too much here, but other approaches like moderate consequentialism or virtue ethics could offer solutions.

  Next, the generalization to donations and volunteering is important. The user isn't just dealing with open-source; it's a broader ethical concern. Effective Altruism comes to mind, which emphasizes maximizing impact but also recognizes sustainability. The user might benefit from the "drop in the bucket" argument—that individual actions are small compared to larger systemic issues, so personal sacrifice beyond a point isn't obligatory.

  I also think about practical strategies. Setting predefined limits, like time-boxing contributions, aligns with rule utilitarianism. Treating open-source as a long-term project requires sustainability. Burnout would reduce overall contribution, so self-care is necessary for continued impact.

  The user mentioned their partner and social life. Relationships and personal commitments hold intrinsic value in many ethical systems. Virtue ethics, for example, values balance and flourishing. Neglecting personal relationships for constant labor isn't virtuous; it's disproportionate.

