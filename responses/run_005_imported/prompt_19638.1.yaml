  Here's a toast draft weaving in the statue/clay concept with philosophical care, emotional warmth, and audience accessibility (aiming for ~3 minutes):

  **(Clink glass gently)**  
  "Mom, Dad – 40 years! That deserves a standing ovation all on its own. Seriously, everyone, let's hear it for John and Mary!" *(Pause for applause)*

  "Now, being the resident philosopher in the family means I get the... *privilege*... of trying to find something profound in all this confetti and cake. And don't worry Uncle Bob, I’m steering clear of the Ship of Theseus this time! But I *was* thinking about another puzzle my students wrestle with: a beautiful statue, and the lump of clay it’s made from.

  "At first glance, they seem like the same thing, right? The statue *is* the clay, shaped up. But are they *really* identical? Think about it: that lump of clay could have been rolled into a ball yesterday, or squashed flat tomorrow – it would still be the same lump. But the *statue*? If you squash it flat... the statue is gone. Poof! Even though the clay is still right there. The statue *needs* that specific shape to exist. It’s *made from* the clay, absolutely dependent on it, but it’s not *just* the clay. It’s something else, something with its own rules for existing, its own ‘life story,’ if you will.

  "And that, believe it or not, made me think about *your* marriage.

  "Because for 40 incredible years, Mom and Dad, you two – these amazing, distinct individuals – have been the essential *stuff*, the fundamental material, of something truly special: your marriage. This marriage is *constituted by* the two of you. It couldn’t exist without either one of you being exactly who you are. It’s utterly dependent on you both.

  "But... is the marriage *just* John? No. Is it *just* Mary? Absolutely not. Is it even *just* John-and-Mary-lumped-together? I don’t think so. Because look at what this marriage has *survived*! It’s seen career changes that felt like reinventing yourselves, moves that uprooted everything, the beautiful chaos of raising kids (hi, sis!), triumphs, setbacks, fashion choices we’d all rather forget... Changes that, for any *one* person alone, would feel monumental, life-altering. Yet the *marriage*? It endured. It adapted. It persisted *through* those changes. It has its own incredible resilience, its own unique history that’s more than just the sum of your two individual histories.

  "And here’s the other side of that statue-and-clay idea: Just like the statue can be gone while the clay remains, the *marriage* could theoretically end – through divorce, say – while John and Mary, as individuals, live on, perhaps even unchanged in many ways. That possibility shows us the marriage isn't *identical* to either of you, or even to the pair considered just as two people. It's something else that *emerges* when two specific people commit, connect, and build a life together with its own unique character and persistence.

  "What you've built, Mom and Dad, isn't just two lives lived side-by-side. It's a *third thing*. A living, breathing entity woven from 40 years of shared jokes, whispered worries, fierce loyalty, forgiven arguments, countless cups of coffee, and an ocean of love. It's the invisible force field around you both that says 'We're a team.' It's the history only you two fully share, the private language you speak, the unspoken understanding that fills this room.

  "You are the indispensable clay, absolutely. But together, you’ve shaped something far greater than the sum of its parts – a beautiful, enduring statue of commitment. It’s weathered storms and basked in sunshine, constantly being reshaped, yet always recognizably, magnificently *yours*.

  "So, let’s raise our glasses. Not just to John, not just to Mary, but to the incredible, persistent, unique *thing* you’ve created together for 40 years. To the statue. To your marriage. May it continue to stand tall, beautiful, and strong. Happy Anniversary!"

  **Why this works:**

  1.  **Accessible Metaphor:** The statue/clay is introduced simply and concretely. The examples (squashing the statue, rolling the clay) are clear visualizations.
  2.  **Clear Philosophical Core:** It accurately captures:
      *   **Constitution, not Identity:** Explicitly states the marriage is *constituted by* but not *identical to* the individuals or the pair.
      *   **Persistence Conditions:** Highlights the marriage's ability to survive significant changes that *would* alter the individuals' identities ("reinventing yourselves").
      *   **Modal Mismatch:** Directly addresses the divorce scenario showing the marriage can cease while individuals persist unchanged.
  3.  **Emotional Connection:** Grounds the abstract concept in their real, lived experience (careers, moves, kids, shared moments). The descriptions ("invisible force field," "private language," "ocean of love") evoke warmth.
  4.  **Audience Appropriate:**
      *   **Bowling League Friends:** Gets the core idea (marriage is special/separate thing built by them that lasts through stuff) without jargon. Focuses on love, commitment, endurance. Humorous touches ("fashion choices," "Uncle Bob").
      *   **Philosophy Colleague:** Will recognize the precise metaphysical points being made (constitution, persistence conditions, modal differences) embedded cleanly within the accessible narrative. No fumbling.
  5.  **Structure:** Clear flow: Hook (celebration) -> Puzzle intro -> Puzzle explained -> Applied to marriage -> Evidence (40 years of change) -> Key distinction (divorce scenario) -> Emotional tribute -> Toast.
  6.  **Avoids Jargon:** Uses phrases like "rules for existing," "life story," "essential stuff," "fundamental material," "persisted through," "emerges" instead of technical terms like "numerical identity," "modal properties," "supervenience."
  7.  **Respects the Occasion:** Celebrates *them* and *their achievement*. The philosophy serves the tribute, not the other way around.

  **Delivery Tip:** Speak warmly, make eye contact with your parents, and slightly pause after key points (like the divorce analogy) to let the idea land without dwelling. Your genuine affection will carry it. Your colleague will nod appreciatively; everyone else will just feel the love and the depth of the tribute. Good luck!
