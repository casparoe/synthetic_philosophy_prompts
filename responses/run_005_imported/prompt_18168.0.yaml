  Okay, let me try to unpack this user's problem. They work at a startup and ran an A/B test on a checkout button. After two weeks, p=0.09, not quite significant. A teammate suggested running it another week for more data, which seemed reasonable. But their data guy objected, saying that checking results periodically and extending the test invalidates the results. The user is confused because the extra data is real, so why should when they look matter? Their psych PhD roommate mentioned this is why you can't trust a lot of published psychology, which piqued their curiosity.

  First, I need to confirm if the data guy is right. The issue here is peeking and extending without pre-specifying the sample size. In frequentist statistics, p-values depend on the sampling plan. If you peek multiple times and stop when you hit significance, you inflate the Type I error rate. The user thinks the final numbers should speak for themselves, but the process matters because each peek adds more chances to find a false positive. 

  The user's deeper need is understanding the logic, not just rules. They mentioned their roommate's comment about psychology studies, so they're concerned about the broader implications. They want to grasp why the timing affects validity. 

  I should explain the multiple comparisons problem. Even if each test is valid, doing multiple tests without correction increases the chance of false positives. For example, testing at p=0.05 each time, after 3 tests, the actual error rate could be around 14%. The simulation analogy might help: if you simulate many A/A tests and peek weekly, you'll see false positives more often than 5%.

  Also, the data guy mentioned another statistical approach. That's likely Bayesian methods. Bayesian statistics updates beliefs with new data, using Bayes' factor. It doesn't rely on fixed sample sizes, so peeking isn't an issue. But it has its own challenges, like choosing priors. The user might want to know if this solves the problem or just moves it. 

  The user's confusion is valid. The data is real, but frequentist inference depends on the experimental design. They need to understand that the stopping rule affects the p-value calculation. Maybe an analogy: like a detective deciding when to stop investigating; stopping after finding the first suspect versus following a pre-set plan.

  The roommate's point about psychology publications ties into the replication crisis. P-hacking, like peeking and extending, leads to unreliable results. The user might be connecting their small test to bigger scientific integrity issues.

  So, the answers: Yes, the data guy is correct. Peeking inflates error rates. The timing matters because of the stopping rule principle. Bayesian methods avoid this by design but require careful prior selection. 

  I should structure the response to address each part: explain the problem, why timing matters, introduce Bayesian as an alternative, and relate it to broader implications. Use simple examples without jargon. Emphasize that while the data is real, the interpretation framework (frequentist) has rules that, if broken, invalidate results. Suggest solutions like sequential testing or switching to Bayesian for their startup's context.
answer: |-
  This is a brilliant and profoundly important question that cuts to the heart of why many scientific findings (especially in social sciences) fail to replicate. Your data guy is **absolutely correct**, and understanding *why* is crucial. Let's break it down:

  1.  **Is peeking-and-extending a real problem? YES.**
      *   **The Core Issue:** It's not that the *data* becomes "unreal" or dishonest. It's that the **interpretation framework (frequentist statistics / p-values / NHST)** relies heavily on the **experimental design**, specifically the **stopping rule**.
      *   **Why the Timing Matters (The Stopping Rule Principle):** P-values are calculated under the assumption of a *specific sampling plan*. If your plan is "collect exactly N samples and run one test", the p-value threshold (e.g., p<0.05) controls the false positive rate (Type I error) at 5%. **But if you peek multiple times with the option to stop or continue, you are effectively conducting multiple hypothesis tests.**
      *   **The Multiple Testing Problem Amplified:** Each peek is an opportunity to falsely reject the null hypothesis (H0 - no button effect). If you peek once at 1 week (p=0.09), then again at 2 weeks (p=0.09), then stop at 3 weeks only *because* p=0.04, you've given yourself *three* chances to see a significant result by random chance alone.
      *   **Simulation Analogy:** Imagine running 10,000 fake A/A tests (both groups identical). You simulate peeking weekly until you either hit p<0.05 *or* reach 4 weeks. How many of these 10,000 tests (where the null is *always true*) would show a "significant" result (p<0.05) *at some point* within those 4 weeks? It's **not 5%**! It could easily be **12-18% or higher**, depending on your stopping rule and the underlying variance. Your actual Type I error rate is inflated far beyond 5%. This means you'll declare effects "real" far more often than you should when there is actually no effect.
      *   **The "Final Numbers" Fallacy:** You're right, the final data is the final data. *But the meaning assigned to that data (the p-value) depends on the process that generated it.* A p-value of 0.04 obtained after a single pre-planned test means something very different statistically than the *same* p=0.04 obtained after peeking twice and extending because the previous results weren't significant enough. The latter scenario is much more likely to occur by random chance when H0 is true.

  2.  **Why Does This Happen?**
      *   **Frequentist Statistics Relies on Long-Run Behavior:** It defines error rates based on what would happen if you repeated the experiment *infinitely many times* under the same design and stopping rule. Changing the rule (peeking & extending) changes the long-run behavior.
      *   **Optional Stopping Biases the Result:** Stopping only when the results look "good" (e.g., p<0.05) introduces a selection bias. You're more likely to stop when random fluctuations temporarily favor your new button, even if the true effect is zero or smaller.

  3.  **The "Different School of Statistics" - Bayesian Inference:**
      *   **What it is:** Bayesian statistics focuses on updating the *probability* that a hypothesis (e.g., "New button is better") is true, given the data and prior knowledge (the "prior"). The key output is often the **Bayes Factor (BF)** or the posterior probability.
      *   **Why it (Mostly) Solves the Peeking Problem:** Bayesian updating is **coherent**. It doesn't matter *when* you look at the data or *how many times* you update your beliefs. If you collect more data and update your posterior probability or BF, the result is valid *based on all the data seen so far*. Stopping when the BF reaches 10 (strong evidence for H1) or 1/10 (strong evidence for H0) is statistically sound *by design*. The evidence accumulates continuously.
      *   **Does it Make the Problem Go Away? Mostly, but with Caveats:**
          *   **Genuine Advantage:** The core issue of inflated Type I error due to optional stopping *is eliminated* in the Bayesian framework for hypothesis testing using Bayes Factors. The interpretation of the current BF isn't dependent on how many times you peeked.
          *   **Relocation/Caveats:**
              *   **Prior Dependence:** The result *does* depend on the choice of the prior distribution. A poorly chosen prior can bias results, though sensitivity analyses can help. This replaces the "stopping rule" dependency with a "prior specification" dependency.
              *   **Decision Thresholds:** While stopping based on BF thresholds is valid, the *choice* of threshold (e.g., BF>10) still involves some subjectivity and needs careful consideration.
              *   **Calibration:** Communicating Bayesian results (especially probabilities/BFs) to stakeholders used to p-values can be challenging.
              *   **Error Rates:** Bayesian methods control different types of error probabilities (e.g., posterior error probabilities) rather than frequentist Type I/II rates. Some frequentists argue this is a weakness.

  **Why Your Roommate is Right (The Bigger Picture):**

  The practice of "p-hacking" – which includes optional stopping (peeking and extending), cherry-picking outcomes, trying multiple analyses until one is significant – is a major contributor to the replication crisis in psychology and other fields. Journals preferentially publish "significant" results (p<0.05). If researchers run an experiment, peek, see p=0.07, add 10 more subjects, peek again, see p=0.04, and stop, they publish. **They don't report all the peeks and extensions.** The published p=0.04 looks convincing but is statistically invalid because of the unplanned stopping rule. Many published "findings" are simply these types of false positives. This is why large-scale replication efforts often fail.

  **Practical Solutions for Your Startup:**

  1.  **Pre-Specify:** The gold standard is to **pre-specify the primary endpoint and sample size** based on a power calculation *before* looking at any results. Stick to that plan for the primary analysis.
  2.  **Sequential Testing (Frequentist):** Use formal **group sequential designs** or **alpha-spending functions**. These pre-specify interim analysis points and adjust the significance threshold at each point to control the *overall* Type I error rate. (Requires statistical expertise).
  3.  **Bayesian Approach:** **Switch to Bayesian A/B testing.** Define your prior (e.g., "We expect a small lift, maybe 1-5%"), choose a decision threshold (e.g., BF > 10 or Posterior Probability > 95%), and monitor the BF or posterior probability as data comes in. You can stop early if strong evidence accumulates *for or against* the new button. Platforms like Google Optimize often offer Bayesian options.
  4.  **Blind Analysis:** If peeking is tempting for operational reasons, have the results calculated automatically but only revealed at the pre-specified end date.
  5.  **Honest Reporting:** If you *must* peek and extend (not ideal), report it transparently. State "We conducted an interim analysis at N1, observed p=0.09, and decided to extend to N2." Use more stringent criteria for claiming significance (though calculating the correct threshold is complex).

  **Conclusion:**

  Your data guy is spot on. Peeking and extending based on non-significant results **does invalidate the frequentist p-value interpretation** by inflating the false positive rate, even though the data itself is real. The *process* of data collection and analysis is inseparable from the interpretation in the frequentist paradigm. The Bayesian approach genuinely sidesteps this specific problem by focusing on continuous evidence accumulation, making it often better suited for iterative environments like startups. However, it introduces other considerations like prior choice. Understanding this distinction is critical not just for your checkout button, but for evaluating the credibility of *any* statistical claim based on p-values. Your roommate's cynicism about psychology publications is, sadly, well-founded due to widespread misuse of techniques like optional stopping.
