answer: |-
  Your frustration is both understandable and justified. While your neighbor may technically "win" the practical outcome, the core unfairness you perceive tracks a profound ethical and philosophical reality: **the process by which the boundary was established violated fundamental principles of procedural fairness and exploited an imbalance of power, regardless of the underlying truth about the property line.**

  Here's a breakdown of why your sense of unfairness is valid:

  1.  **The Primacy of Due Process (Even Informal):** Fairness isn't just about the *outcome* (who owns the strip), but crucially about the *process* used to reach that outcome. A fair process involves:
      *   **Neutrality:** Decisions shouldn't be made unilaterally by one interested party.
      *   **Opportunity to be Heard:** Both sides should have a chance to present their understanding or evidence.
      *   **Lack of Coercion:** Outcomes shouldn't be forced by threats or leveraging power imbalances.
      *   **Transparency:** The basis for the decision should be clear and open.
      Your neighbor bypassed all of this. He acted as judge, jury, and executioner based solely on his own self-serving "research" and confidence in your unwillingness to fight.

  2.  **Exploitation of Power Asymmetry:** Your neighbor explicitly leveraged his knowledge that you wouldn't sue due to cost/effort vs. value. He didn't act because he had overwhelming evidence; he acted because he knew he could force the outcome without meaningful resistance. This transforms the dispute from a search for truth or fairness into a simple exercise of power: "I can take it, and you can't stop me." This "might makes right" approach is inherently unfair in civil disputes between neighbors.

  3.  **The "Settled Status Quo" Had Value:** The old, crooked fence represented a de facto agreement, however tacit or historical. It was a practical solution acknowledging the ambiguity. Your neighbor didn't just claim the land; he violently disrupted this established, functional (if imperfect) equilibrium *without* establishing a superior claim through a mutually acceptable process. He imposed his will.

  4.  **The Burden Shift is Unfair:** While technically the legal burden to prove the boundary might lie with whoever challenges the *new* status quo in court, the moral burden of proof for *changing* the long-standing status quo rested squarely on your neighbor. He initiated the change. A fair approach would have involved him presenting his evidence *to you* and attempting to persuade you *before* acting, or proposing a joint solution (like splitting the cost of a cheap surveyor, or agreeing to move the fence 1.5 feet instead of 3). He skipped this entirely.

  5.  **"Acting First" as a Strategy, Not Evidence:** Your neighbor's confidence wasn't based on irrefutable evidence of his claim; it was based on confidence in his ability to *enforce* his claim due to your aversion to conflict and cost. He weaponized your reasonableness. His claim isn't inherently better because he acted first; he simply exploited the situation to make his claim *stick* through force and your constraint.

  **Addressing Your Friends' Points:**

  *   **Friend 1 (No Grievance Without Proof):** This view is too narrow. It reduces fairness solely to the *underlying factual truth* of the boundary line, ignoring the *process* and *power dynamics* that led to the resolution. You absolutely have a grievance about *how* this was done. Your claim to a fair process *is* a valid claim in itself.
  *   **Friend 2 (Senses Unfairness, Can't Define):** This friend is closer. The unfairness lies in the **procedural injustice** and the **exploitation of the power imbalance**, not necessarily in the final location of the fence (which might even be correct, but we'll never know fairly).

  **Conclusion:**

  Your impression is absolutely tracking something real. The separation between your claim and your neighbor's claim *in terms of enforceability* is indeed his willingness to act unilaterally and aggressively, coupled with your inability/willingness to bear the cost of challenging it. However, **this separation is one of power and aggression, not inherent merit or fairness.**

  Fairness encompasses both substantive justice (who actually owns the land) and procedural justice (how the dispute is resolved). Your neighbor has potentially achieved a substantively correct outcome (though unproven) through a grossly procedurally unfair process. He prioritized force and leverage over collaboration, evidence, or mutual agreement.

  Your grievance is valid because:
  *   **The process was unfair:** Unilateral, coercive, bypassing any attempt at mutual resolution.
  *   **Power was exploited:** He used your reasonable cost-benefit analysis against you.
  *   **The existing equilibrium was disregarded:** He disrupted a functional (if ambiguous) status quo without justification through a fair process.

  While you may be practically stuck with the outcome, your sense that this outcome was achieved unfairly is entirely correct. It highlights a harsh reality: in the absence of clear evidence or access to formal dispute resolution, power dynamics and willingness to act aggressively can often dictate outcomes, even when they violate principles of neighborly fairness and due process. Your frustration is not merely about losing the land; it's about *how* you lost it. That "how" is fundamentally unfair.
