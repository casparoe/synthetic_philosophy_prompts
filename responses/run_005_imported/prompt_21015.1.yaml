  ## Student Petitions Committee Decision Memorandum  
  **Date:** October 26, 2023  
  **To:** Committee Chair & Members  
  **From:** [Your Name/Committee Secretary]  
  **Subject:** Recommendation on Petition #SC-2311 (Resident Assistant - Request for Make-Up Final Exam)  

  **I. Recommendation**  
  The Committee **GRANTS** the petition for a make-up final exam.  

  **II. Reasoning**  
  After deliberation, the majority of the Committee finds that the Resident Assistant's (RA) actions constitute "extenuating circumstances" warranting accommodation under university policy, based on the following reasoning:  

  1.  **Voluntary Sacrifice Beyond Contractual Duty:** The RA's job description explicitly limits her obligation to contacting Campus Safety and remaining present *only until professional responders arrive*. Campus Safety officers confirmed her release from duty upon their arrival. Her decision to remain throughout the night was therefore a **supererogatory act** – morally commendable but exceeding any requirement of her role. This places it outside the scope of mere "duty extension."  

  2.  **Direct Causal Link to Absence:** The RA's absence from the 9 a.m. final was a direct and unavoidable consequence of her voluntary choice to provide overnight support. She sacrificed a significant academic obligation for the sake of a resident's well-being.  

  3.  **Spirit of the "Extenuating Circumstances" Policy:** While the policy doesn't explicitly address voluntary acts beyond duty, its core purpose is to provide relief for students facing unforeseen and significant hardships that impede academic performance. The confluence of a genuine crisis, the RA's unique position requiring initial response, and her subsequent *voluntary* commitment creating an unavoidable conflict constitutes an unforeseen hardship distinct from routine personal obligations or scheduling conflicts.  

  4.  **University Values and Student Welfare:** Denying accommodation in this specific instance risks signaling that acts of profound compassion and personal sacrifice undertaken for the direct benefit of a fellow student in crisis – even when explicitly released from obligation – carry negative academic consequences. Granting the petition aligns with fostering a supportive community and recognizes the exceptional nature of the situation.  

  **III. Addressing the Strongest Objection**  
  The Committee acknowledges and takes seriously the compelling objection that granting this petition could set an unfair precedent or inadvertently transform supererogatory acts into expected duties:  

  *   **The Objection:** Rewarding this act might create an expectation that RAs (or other student employees) *should* go beyond their formal duties in crises, placing unfair pressure on them and potentially penalizing those who adhere strictly to their contracts but face different, non-"heroic" hardships (e.g., severe illness, family emergencies). It risks formalizing an informal "duty of heroism" and could disadvantage students whose extenuating circumstances lack a socially valorized narrative.  

  *   **The Committee's Response:**  
      *   **Specificity and Exceptionalism:** This decision is grounded in the *highly specific and exceptional* circumstances:  
          *   The RA was **formally released** from her duty by the arriving professionals, definitively marking her subsequent actions as voluntary.  
          *   Her actions involved **direct, sustained care** during an ongoing mental health crisis for a resident under her initial purview.  
          *   The sacrifice (missing a final exam) was **immediate and unavoidable** as a direct result of her choice.  
      *   **Precedent Limitation:** This decision does not establish a blanket rule that any act beyond duty constitutes an extenuating circumstance. Future petitions will require the same rigorous analysis of context, voluntariness, direct causation, and the nature of the hardship. Adherence to contractual duties remains the baseline expectation; supererogation remains exceptional.  
      *   **Fairness to Other Hardships:** The "extenuating circumstances" policy exists precisely for hardships like severe illness or family emergencies. These are inherently valid claims based on *endured misfortune*, not chosen sacrifice. Granting this petition does not diminish the validity of those claims; it simply recognizes that *in this unique case*, the hardship arose from a voluntary act of significant compassion directly tied to the petitioner's role and a university member's welfare, creating an unavoidable conflict.  
      *   **Avoiding Coercion:** The Committee explicitly rejects the notion that this decision creates a new expectation. RAs fulfilling only their contractual duties during crises will not be penalized. The decision rests on the *voluntary and exceptional* nature of *this specific act*, not on a redefinition of the RA role.  

  **IV. Conclusion**  
  The Committee finds that the RA's decision to remain with the resident throughout the night, after being formally released by Campus Safety, was a supererogatory act demonstrating exceptional compassion. The direct consequence – missing her final exam – constitutes an extenuating circumstance warranting relief under university policy. While mindful of concerns regarding precedent and fairness, the Committee believes the unique facts of this case justify approval without establishing a requirement for future extraordinary acts. The decision affirms the value of voluntary care for vulnerable students while upholding the integrity of defined roles and contractual obligations.  

  **Recommendation:** Petition #SC-2311 is **APPROVED**. The student is granted permission to schedule a make-up final exam for [Course Name/Number] with the instructor and relevant department, following standard university procedures.  

  **Attachments:**  
  *   Petition #SC-2311  
  *   RA Job Description Excerpt (Crisis Protocol)  
  *   Campus Safety Incident Report Summary  
  *   Committee Vote Tally (Optional)  

  ---
  **Key Philosophical Anchors Used:**  
  *   **Supererogation:** Clearly distinguishing mandatory duty (contact safety, stay until help arrives) from the morally praiseworthy *but non-obligatory* act (staying all night after release).  
  *   **Causation:** Establishing a direct link between the voluntary act and the academic hardship.  
  *   **Precedent vs. Specificity:** Addressing the slippery slope concern by emphasizing the unique, non-repeatable circumstances (formal release, direct care, immediate sacrifice) to prevent normalizing supererogation as duty.  
  *   **Value of Compassion:** Recognizing the act's alignment with university community values without making it a rule.  
  *   **Fairness:** Balancing the recognition of this specific voluntary sacrifice against the inherent validity of hardships arising from misfortune, arguing they are different *types* of claims under the same policy umbrella.
