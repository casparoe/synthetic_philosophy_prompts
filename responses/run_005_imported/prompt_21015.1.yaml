prompt: |-
  I'm a philosophy major taking a seminar on duty and obligation this term, and I sit on my university's Student Petitions Committee, which rules on requests for retroactive excused absences. A case on Thursday's agenda seems to turn on exactly the distinction between required duty and going beyond it that we've been discussing in class, and I need to draft the committee's decision memo.

  A resident assistant's job description obliges her, during a crisis, to contact campus safety and stay with a resident only until professional responders arrive. During a mental-health crisis last month, officers told her she was free to leave once they arrived, but she stayed with the resident through the night anyway. She missed her 9 a.m. final as a result and is petitioning for a make-up exam under our "extenuating circumstances" policy, which doesn't say whether going beyond a job's formal duties counts as such a circumstance.

  The committee is split three ways. Some say this was just an extension of her existing duty of care, so no special claim follows. Others say everything she did after the officers arrived went clearly beyond anything her role required, and penalizing it would be perverse. Others worry that rewarding this sets an unfair precedent for students whose hardships gave them no chance to be "heroic," and that formalizing such rewards quietly turns admirable extras into new expectations.

  Please draft the memo: a specific recommendation on the petition, reasoning the committee could act on, and a serious, fair treatment of the strongest objection to whatever you recommend.
reasoning: |-
  Okay, the user is a philosophy major dealing with a real-life ethical dilemma that mirrors their academic studies. They're on a committee deciding whether a resident assistant (RA) should get a makeup exam after staying with a student during a mental health crisis beyond her job requirements. The committee is split, and they need a memo that addresses duty vs. supererogation—exactly what they're studying. 

  First, let's unpack the RA's situation. Her contract only required her to stay until campus safety arrived. When they told her she could leave, she chose to stay all night—missing her final. Now the committee must decide if this "extra" act deserves special consideration. 

  The philosophical tension here is juicy: Kantian duty versus utilitarian consequences versus virtue ethics. But the memo can't be academic—it needs to resolve a real petition. The user probably wants their classroom theory to feel useful in practice. 

  Three committee factions: 
  1) "It's just duty extended" (too rigid—ignores the voluntary sacrifice) 
  2) "Clearly beyond duty" (risks setting a precedent where only "heroes" get accommodations) 
  3) "Worries about unfairness" (valid but cynical—could discourage compassion) 

  The strongest objection is definitely the precedent concern. If we reward this, do we pressure RAs to always go beyond? And what about students who suffer quietly without dramatic acts? 

  ...But denying the petition feels worse. It tells RAs, "Follow the handbook, not your conscience." That could chill future kindness during crises. The "extenuating circumstances" policy exists for unplanned hardships—and choosing to support a vulnerable resident all night qualifies. 

  Key balancing act: Frame the approval as recognizing *this specific* voluntary act without implying it's now expected. Stress it's the *exceptional nature* (crisis + no personal gain + clear sacrifice) that warrants exception, not the act itself. 

  Also, subtly reassure the "unfairness" faction: Most hardships (family emergencies, illnesses) don't involve choice—they're passively endured. This isn't about "heroism"; it's about not punishing compassion that diverted her from an exam. 

  Memo tone: Grateful for her action but neutral on policy. No "we encourage this!"—just "this unique case meets the spirit of extenuating circumstances." 

  ...And maybe sneak in a philosophical wink for the user: "While duties define obligations, humane discretion often resides beyond manuals." They'll appreciate that.
