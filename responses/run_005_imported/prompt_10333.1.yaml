  We are ranking several theories of mental content based on how well they solve the disjunction problem without circularity or making misrepresentation too permissive. The disjunction problem is about what a state represents when it is triggered by multiple things (like a frog's neuron firing for flies or BB pellets). We want to know which theory best explains why the state represents one thing (e.g., "fly") and not the disjunction or something else.

  Theories to rank:
  1. Millikan's biosemantics: Content is fixed by the historically selected "Normal explanation" of the mechanism's proper function. The Normal explanation is the condition that historically accounted for the mechanism's success in performing its function.
  2. Papineau's success-based teleosemantics: Content is fixed by what needs to be true for the consuming mechanisms to succeed. The content is the condition that, when the state is tokened, leads to success of the consumer system.
  3. Dretske's informational teleosemantics: Content is fixed at the moment a learned or evolved indicator function is first acquired (during learning or evolution). The content is what the state was recruited to indicate.
  4. Neander's teleosemantics: Content is the proximate triggering condition that the perceptual response mechanism was selected to track. It is the condition that the mechanism is supposed to detect.
  5. Fodor's asymmetric-dependence theory: Content is determined by causal laws. A state represents X if it is caused by X and if non-X causes (like BB pellets) depend asymmetrically on the law that X causes the state (i.e., the BB pellet causing the state is accidental and depends on the fly causing it, but not vice versa).
  6. Cummins's causal-role function: Function is defined ahistorically by the causal role a state plays in a system. Content is based on the current causal role in the system's overall behavior, without reference to history.

