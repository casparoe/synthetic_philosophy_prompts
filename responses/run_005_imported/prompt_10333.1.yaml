answer: |-
  ```json
  {
    "S": ["Millikan's biosemantics", "Papineau's success-based teleosemantics"],
    "A": ["Dretske's informational teleosemantics", "Neander's teleosemantics", "Fodor's asymmetric-dependence theory"],
    "C": ["Cummins's ahistorical, causal-role notion of function"]
  }
  ```

  - **Millikan's biosemantics**: Fixes content via the historically selected "Normal explanation" of a mechanism's function, robustly avoiding disjunctions by privileging the condition that consistently explained evolutionary success (e.g., "fly" not "BB pellet" if flies sustained fitness).
  - **Papineau's success-based teleosemantics**: Anchors content to what must be true for consumer mechanisms to succeed, directly resolving disjunctions by privileging the condition enabling biological goals (e.g., "food" not "fly-or-BB" if only flies yield nutritional success).
  - **Dretske's informational teleosemantics**: Fixes content at the moment of indicator-function acquisition, avoiding disjunctions by locking in the causal correlate present during learning/evolution (e.g., "fly" if BB pellets were absent during training), though Swampman reveals vulnerability to history-dependence.
  - **Neander's teleosemantics**: Locates content in the proximate triggering condition selected for tracking, resolving disjunctions by referencing the specific feature evolution aimed to detect (e.g., "fly" if selection favored fly-specific responses over general motion detection).
  - **Fodor's asymmetric-dependence theory**: Privileges core causal laws over parasitic correlations without teleology (e.g., BB pellets asymmetrically depend on "fly" causation), but may allow disjunctive contents if multiple causes are law-like (e.g., in environments with diverse valid prey).
  - **Cummins's ahistorical, causal-role notion of function**: Fails to solve the disjunction problem, as current causal roles cannot distinguish "correct" from "incorrect" triggering (e.g., BB pellets fulfill the same role as flies in causing snapping), making misrepresentation inexplicable.
