  We are ranking 10 positions on the torture-vs-dust-specks problem from most to least defensible.
   The problem: choose between one person tortured horribly for 50 years vs 3^^^3 people each getting a dust speck in their eye.

   We are to assign each position to a tier: S (most defensible), A, B, C, D (least defensible). Each tier is a list of the numbers (1-10) of the positions.

