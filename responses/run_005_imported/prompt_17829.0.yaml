prompt: |-
  So this is probably super random but I've been stuck on this for like two days and my teacher just said "sit with it," which was not helpful lol. In my philosophy elective we're doing a unit on free will, and as background for a discussion on fatalism our teacher gave us a handout with part of Aristotle's On Interpretation, chapter 9 — the famous "will there be a sea battle tomorrow" thing. I got kind of into it and found the rest of the chapter online (it's the E. M. Edghill translation, the one that's free everywhere), and now I'm hung up on one specific paragraph that comes right after he sets up the sea-battle example and says its necessary that either the battle happens tomorrow or it doesnt, but not necessary that it happens, and not necessary that it doesn't. Here's the bit that's breaking my brain:

  "One of the two propositions in such instances must be true and the other false, but we cannot say determinately that this or that is false, but must leave the alternative undecided. One may indeed be more likely to be true than the other, but it cannot be either actually true or actually false. It is therefore plain that it is not necessary that of an affirmation and a denial, one should be true and the other false. For in the case of that which exists potentially, but not actually, the rule which applies to that which exists actually does not hold good."

  Like, he says one of the two propositions MUST be true and the other false, and then two sentences later says it "cannot be either actually true or actually false" — which just sounds like the opposite claim?? Is the word "actually" secretly doing a ton of work in that sentence, like is he pulling in his whole potential-vs-actual distinction from somewhere else in his philosophy to sneak in a third option besides just true and false, or am I missing something more basic about how his logic works here? I saw one site mention that this is where he supposedly denies something called "bivalence" but I don't really get how that word connects to the actual sentences above. If you could walk through what's logically going on in this paragraph (ideally sentence by sentence) and say whether Aristotle is really saying "there will be a sea battle tomorrow" isn't true or false yet, or if that's the wrong way to read it, that'd be huge. Bonus points if you can explain why people apparently still argue about how to read this instead of it being a settled 2000-year-old question, since that part honestly surprised me most.
