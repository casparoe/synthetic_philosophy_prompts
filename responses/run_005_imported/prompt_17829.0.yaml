  Hmm, the key is definitely Aristotle's actual/potential distinction. When he says "one must be true" he's talking about logical necessity - eventually one outcome will happen. But "cannot be actually true/false" refers to ontological status right now. It's like Schrödinger's cat for ancient philosophy - the truth value is indeterminate until the event actualizes. 

  The user mentions surprise that scholars still debate this. That makes sense because it ties into bigger philosophical questions: logical determinism vs free will, the nature of time, whether truth exists for non-existent things. Modern logicians like Łukasiewicz built whole three-valued systems based on this passage. 

