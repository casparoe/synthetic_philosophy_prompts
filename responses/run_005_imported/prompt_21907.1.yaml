  ## The Stain of Intention: Why Anscombe's Indictment of Hiroshima and Nagasaki Stands

  Elizabeth Anscombe's 1957 pamphlet, "Mr. Truman’s Degree," is not merely another voice in the chorus debating the utilitarian calculus of the atomic bombings of Hiroshima and Nagasaki. It is a scalpel, dissecting the moral act itself with chilling precision. While consequentialist defenses focus on the *outcome* – the purported shortening of the war and saving of lives – Anscombe trains her formidable philosophical lens on the *intention* behind the act. Her argument, rooted in the absolutist tradition of just war theory and natural law, asserts that President Truman committed murder by deliberately targeting non-combatant civilians as a means to an end, regardless of any alleged beneficial consequences. Engaging with Anscombe's specific argument reveals its profound moral force, exposing the consequentialist defenses as ethically deficient precisely because they evade the core question of intention.

  **Anscombe's Core Argument: Intention as Moral Determinant**

  Anscombe's argument rests on a fundamental distinction central to traditional moral philosophy: the difference between *intending* an evil and merely *foreseeing* it as a side-effect. She argues:

  1.  **Direct Targeting of Non-Combatants is Forbidden:** The principle of non-combatant immunity is absolute in just war theory. Civilians are not legitimate targets because they are not directly participating in hostilities.
  2.  **Intention Defines the Act:** The morality of an action is crucially determined by the agent's intention. If one *intends* the death of innocents as a means to achieve a goal (like coercing surrender), the act is murder.
  3.  **The Bombs Were Intentionally Aimed at Cities:** Hiroshima and Nagasaki were not primarily military targets; they were densely populated urban centers. The explicit purpose of targeting them was to inflict catastrophic civilian casualties and societal collapse to break Japan's will to fight. The civilians weren't collateral damage; their deaths *were* the weapon.
  4.  **Consequences Do Not Excuse Intentional Evil:** Even *if* the bombings hastened the end of the war and saved lives overall (a claim Anscombe deeply questions), this does not morally justify the *intentional choice* to murder civilians. A good end does not justify intrinsically evil means. To honor Truman, therefore, is to honor a mass murderer.

  Anscombe cuts through the fog of strategic justification: Truman didn’t just *foresee* civilian deaths tragically; he *willed* them as the necessary mechanism for his desired end. This intention, for Anscombe, stains the act irredeemably.

  **Consequentialist Defenses and Their Failure to Engage**

  The standard defenses of the bombings fundamentally operate within a consequentialist framework, focusing exclusively on outcomes:

  1.  **The "Millions Saved" Argument:** The predominant defense claims the bombs saved far more lives (Allied and Japanese) than they took by avoiding a bloody invasion of the Japanese mainland. Projected casualty figures (often inflated retrospectively) are marshaled as justification.
  2.  **The "Necessary Shortcut" Argument:** This posits that the bombings were the only way to end the war swiftly, preventing prolonged conventional bombing, blockade-induced famine, and continued fighting across Asia.
  3.  **The "Psychological Shock" Imperative:** Some argue that only the unprecedented horror of atomic destruction could shock the Japanese leadership, particularly the military faction, into accepting surrender.

  **Why These Defenses Fail Against Anscombe:**

  Consequentialist arguments fail to refute Anscombe because they deliberately sidestep or dismiss the ethical core of her accusation:

  *   **Evading the Question of Means:** They treat the deaths of Hiroshima and Nagasaki as a tragic but necessary *cost*, a regrettable number on a balance sheet. Anscombe insists they were not a cost but the *chosen instrument*. Consequentialism, by focusing solely on net outcomes, implicitly condones *any* means if the perceived end is "good enough." It provides no inherent barrier against intentionally targeting innocents if the calculator deems it efficient.
  *   **Ignoring the Moral Quality of the Act:** For Anscombe, murder is wrong *in itself*, regardless of consequences. The consequentialist defense changes the subject from "Was this act murder?" to "Did this act produce a net benefit?" This is a category error in moral reasoning from her perspective. Praising the outcome doesn't cleanse the intrinsic evil of the means.
  *   **Questionable Empirical Grounds:** Anscombe (and many historians since) strongly challenge the *necessity* of the atomic bombings to achieve surrender without invasion. They point to Japan's extreme vulnerability in August 1945 (naval blockade, relentless conventional bombing, Soviet entry), the existence of diplomatic feelers, and the possibility of a demonstration or modified surrender terms. The consequentialist defense relies heavily on speculative invasion casualty figures and ignores alternatives, making its foundational claim – that *only* this intentional mass murder could achieve the good end – historically dubious and ethically convenient. Even if the net lives argument held, Anscombe would maintain it doesn't touch the core moral crime.

  **Verdict: Anscombe's Indictment Stands Firm**

  Engaging deeply with Anscombe's argument compels a stark conclusion: **The atomic bombings of Hiroshima and Nagasaki were morally indefensible acts of mass murder.** Truman and his advisors made a conscious, deliberate choice to wield the indiscriminate slaughter of civilians – men, women, and children – as a weapon of terror to achieve their political objective. This intention to use innocent life as a mere tool defines the act as murder according to the fundamental principles of justice and non-combatant immunity that Anscombe upholds.

  The consequentialist defenses, however emotionally compelling or strategically pragmatic they may seem, crumble under the weight of this moral absolutism. They offer a dangerous calculus that justifies atrocity based on speculative future benefits, eroding the essential barrier against intentionally targeting the innocent. They confuse *what was done* with *what might have happened*. Anscombe forces us to look directly at the *what was done*: the intentional incineration of cities full of non-combatants. By that unwavering standard, Truman's decision was not a tragic necessity but a profound moral failure. To honor such an act, as Oxford contemplated, would indeed be, as Anscombe argued, to dishonor the very concept of justice and the sanctity of innocent human life. Her verdict, though demanding and uncomfortable, stands as a necessary condemnation of a choice that crossed a fundamental moral threshold. The stain of intention cannot be washed away by appeals to consequences.
