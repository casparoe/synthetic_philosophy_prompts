  Overall, both positions have merit. However, in the context of a hospital ethics committee, the practical and moral imperative to save as many lives as possible is often compelling. Moreover, the claims-based approach (move 4) provides a non-aggregative reason to save the five. Therefore, I lean toward the view that numbers should count.

