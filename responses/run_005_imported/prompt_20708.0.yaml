     Option A: Save one (with the whole vial)
     Option B: Save five (by splitting the vial)

  If we choose Option A, we let five die to save one. If we choose Option B, we let one die to save five.

  The claims approach: Each of the six patients has a claim to the antivenom. However, we cannot satisfy all. If we choose Option A, we satisfy one claim and leave five unsatisfied. If we choose Option B, we satisfy five claims and leave one unsatisfied. Since each claim is equally strong, it is better to satisfy more claims. This reasoning does not require adding up the suffering but rather focuses on the distribution of a scarce resource.

  Therefore, I conclude that in this case, numbers should count. We should save the five.

  But note: There might be other considerations. For instance, is it fair to the one that he gets nothing while the five each get a partial dose? However, the toxicologists have judged that the partial dose is effective. So, the one would get the same chance of survival as any of the five if he were in the group of five. The problem is that he is alone. But if we choose to save the one, then the five would have no chance at all.

