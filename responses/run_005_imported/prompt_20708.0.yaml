  4. **Move (4):** Dr. Osei's second angle is an important and sophisticated move. By focusing on honoring claims without aggregating suffering, he attempts to provide a non-aggregative reason to save the greater number. This move has been developed by philosophers (like John Broome) and is a serious challenge to Taurek. It partly succeeds because it presents a plausible alternative principle that avoids direct aggregation of welfare but still accounts for numbers.
