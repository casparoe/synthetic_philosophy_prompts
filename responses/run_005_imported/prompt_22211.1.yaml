answer: |-
  Here's a breakdown of the revisionist argument against the moral equality of combatants (focusing on McMahan), contrasted with the traditionalist view, and an analysis of the crucial wrongness/blamelessness distinction you're grappling with:

  **Core Concepts: The Foundation of the Revisionist Argument**

  1.  **Moral Permissibility of Killing Grounded in Liability:** McMahan's core argument starts with the fundamental ethics of self-defense and defense of others. Killing another human being is presumptively wrong. The only justification for intentionally killing someone is if that person has made themselves **morally liable** to defensive killing.
  2.  **Liability Arises from Moral Responsibility for an Unjust Threat:** Someone becomes liable to defensive force only if they are *morally responsible* for posing (or contributing to) an **unjust threat** of serious harm to others. This responsibility implies agency and a lack of justification or excuse.
      *   *Example:* A culpable aggressor (e.g., a murderer) is liable to defensive force because they are morally responsible for an unjust threat. An innocent person (e.g., someone thrown against you by an explosion) posing a threat is *not* liable; killing them would be morally tragic but not justified self-defense.
  3.  **Applying Liability to War:** Combatants pose lethal threats to others. For killing them to be morally permissible, they must be liable to being killed.
      *   **Just Combatants:** Fight in defense against aggression or serious injustice. They pose a *just* threat. Their violence is aimed at stopping an unjust harm. Therefore, the people they threaten (unjust combatants) *are* morally responsible for the unjust threat being resisted, making *them* liable to defensive killing.
      *   **Unjust Combatants:** Fight for an unjust cause (e.g., aggression, conquest). They pose an *unjust* threat. The people they threaten (just combatants) are *not* morally responsible for an unjust threat; they are resisting one. Therefore, just combatants are *not* liable to being killed by unjust combatants.

  **The Revisionist Case Against Moral Equality (Step-by-Step)**

  1.  **Jus ad Bellum Determines Liability:** The justice of the cause (*jus ad bellum*) directly determines the moral status of the combatants and their actions *in bello*. An unjust war means the combatants fighting for that cause are, by participating, posing an *unjust threat*.
  2.  **Unjust Combatants Lack the Right to Kill:** Because unjust combatants pose an unjust threat and their targets (just combatants) are not liable, unjust combatants generally **lack the moral right to kill just combatants**, even if they follow all the rules of war (e.g., wear uniforms, avoid civilians, take prisoners). Their act of killing is morally wrong.
  3.  **Just Combatants Have the Right to Kill Unjust Combatants:** Just combatants pose a *just* threat. Their targets (unjust combatants) *are* liable because they are morally responsible for the unjust threat. Therefore, just combatants **do have the moral right to kill unjust combatants** (provided they follow *jus in bello* constraints like necessity and proportionality).
  4.  **Conclusion - No Moral Equality:** Therefore, there is **no moral equality of combatants**. The moral permissibility of killing depends fundamentally on *which side you are fighting for* and the justice of your cause. Just combatants act permissibly; unjust combatants generally do not.

  **The Traditionalist Case *for* Moral Equality (Walzer)**

  1.  **Separation Thesis:** *Jus ad bellum* (justice of the war) and *jus in bello* (justice in fighting) are **logically and morally independent**. The rules governing *how* war is fought apply equally to both sides, regardless of who started it or why.
  2.  **Combatants as Moral Equals:** Soldiers on both sides enter a state of "mutual liability." By taking up arms and entering the arena of war, they become legitimate targets for each other. This mutual liability arises from their shared status as combatants engaged in hostilities, not from the justice of their cause.
  3.  **Reasons for Separation:**
      *   **Pragmatism/Reciprocity:** Enforcing *jus in bello* rules (protecting civilians, POWs, etc.) requires mutual recognition and acceptance by *both* sides. Linking adherence to *jus ad bellum* would destroy this reciprocity – the "unjust" side would have no incentive to follow any rules.
      *   **Epistemic Uncertainty:** Soldiers in the fog of war cannot reliably know the ultimate justice of their cause or their enemy's. Applying *jus ad bellum* judgments at the individual combatant level is impossible.
      *   **Combatant as Instrument:** Soldiers are primarily instruments of the state. Holding them individually responsible for the state's decision to wage an unjust war is unfair; their moral duty is to fight *well* (following *jus in bello*), not to judge the war itself. They are coerced by the state's authority and the demands of patriotism/loyalty.
      *   **Symmetry of Risk:** Combatants on both sides face the same lethal risks and hardships. This shared experience grounds a kind of mutual respect and equality in the application of war's rules.

  **The Crucial Distinction: Wrongness vs. Blamelessness (McMahan)**

  This is where McMahan addresses the concern about ordinary soldiers like your cousin. He rigorously distinguishes between:

  1.  **Moral Wrongness of the Act:** The act of an unjust combatant killing a just combatant is **objectively morally wrong**. It is the killing of someone who is not liable to be killed. This wrongness stems from the *nature of the act itself* and the objective liability (or lack thereof) of the victim.
  2.  **Blamelessness of the Agent:** The individual unjust combatant who commits this wrongful act **may be fully excused or blameless** for doing so. Their personal moral culpability is mitigated or eliminated by excusing conditions.

  *   **Excusing Conditions:** McMahan identifies several factors that can render an unjust combatant blameless *even though their act is wrong*:
      *   **Duress:** Coercion by threat of severe punishment (imprisonment, execution) for refusing to fight.
      *   **Epistemic Limitations:** Sincere, non-culpable belief that the war is just, fostered by state propaganda, controlled information, lack of education, or cultural conditioning.
      *   **Lack of Real Choice:** Conscription systems offering no viable alternative (e.g., prison, exile, social ruin).
      *   **Diminished Responsibility:** Youth, lack of experience, psychological pressure, or battlefield stress impairing judgment.
      *   **Distributing Responsibility:** The primary moral responsibility lies with the leaders who initiated the unjust war and the structures that enable it. The individual soldier's contribution and agency are often small and heavily constrained.

  **Is this Distinction Legitimate Philosophical Work or a Dodge?**

  This distinction is **absolutely central** to McMahan's project and does **significant philosophical work**. It's not a dodge. Here's why:

  1.  **Preserving Objective Morality:** It maintains that acts have intrinsic moral properties based on facts about the world (like unjust aggression). Killing an innocent person defending themselves *is* wrong, objectively, regardless of the killer's beliefs or circumstances. This anchors morality in reality, not just subjective perception.
  2.  **Targeting Responsibility Accurately:** It allows McMahan to argue that the *primary* moral condemnation and responsibility fall on the *leaders* who start unjust wars and the *institutions* that sustain them. The foot soldier might be committing a wrong, but their *personal guilt* is minimal or non-existent compared to the architects of the conflict. This avoids unfairly scapegoating individuals caught in systemic forces.
  3.  **Explaining Intuitions:** It explains common intuitions. We instinctively feel that a conscripted teenager fed propaganda and forced to fight under threat of death is *less* (or not at all) morally blameworthy than a volunteer SS officer or a leader like Hitler, even if the teenager kills a just combatant. The distinction captures this difference.
  4.  **Avoiding "Clean Hands" for Unjust Wars:** Crucially, it **prevents excusing conditions from washing away the *wrongness* of the unjust war itself.** Saying "My cousin was blameless" doesn't mean "His participation was morally permissible" or "The war he fought in was okay." The war remains unjust, the killing he participated in remains objectively wrong *as an act*, but *he personally* is not condemned as an evil person. This stops the justification of unjust wars by pointing to the blamelessness of individual soldiers.
  5.  **Focusing Reform:** By highlighting the *wrongness* of the act, McMahan aims to delegitimize unjust wars at their core and place pressure on states and societies to avoid initiating them. By highlighting the *blamelessness* of many combatants, he avoids the counterproductive and often cruel condemnation of individuals trapped by circumstance, focusing reform efforts on leaders and institutions.

  **Applying it to Your Cousin:**

  *   **The Act:** If he fights in a war McMahan would deem unjust, his act of killing an opposing combatant (even one following the rules) would be considered **morally wrong** in the revisionist framework. The opposing soldier, fighting defensively, is not liable to be killed by him.
  *   **The Agent (Your Cousin):** Given your description (apolitical, resigned, conscripted/reservist in a mobilized society), he likely falls squarely under **blamelessness**. Duress (legal compulsion, potential punishment), likely epistemic limitations (propaganda, societal pressure), and lack of real choice are strong excusing factors. He is not a bad person; he is caught in a terrible machine. His participation is tragic, not villainous.

  **Conclusion:**

  The revisionist argument dismantles the strict separation of *jus ad bellum* and *jus in bello* by grounding the permissibility of killing in combatants' liability, which is determined by the justice of their cause. The "wrong but blameless" distinction is a sophisticated and necessary tool within this framework. It allows McMahan to:

  1.  Condemn the *institution* of unjust warfare and the acts it requires as objectively wrong.
  2.  Hold leaders and enabling structures primarily responsible.
  3.  Avoid condemning individual combatants who lack genuine moral agency due to coercion, ignorance, or lack of alternatives.

  It's not a dodge; it's an attempt to capture the complex, layered moral reality of war – where systemic evil can compel individuals into committing acts that are objectively wrong, without those individuals necessarily being morally monstrous themselves. This complexity is precisely what you're wrestling with regarding your cousin. Understanding this distinction doesn't make the situation less awful, but it might provide a clearer, less emotionally conflicted framework for understanding the moral landscape he's being forced into.
