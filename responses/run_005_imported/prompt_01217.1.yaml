answer: |-
  ## The Arbitrary Core and the Normative Load: Testing Lewis's Linguistic Dodge

  David Lewis's analysis of convention in *Convention* is a masterpiece of social ontology, meticulously building a definition from the ground up: a convention is a **regularity R** in the behavior of a population P such that:
  1.  **Coordination Problem:** P faces a recurring coordination problem S.
  2.  **Coordination Equilibrium:** R is a coordination equilibrium in S (roughly: no one prefers to deviate unilaterally from R if others conform).
  3.  **Arbitrariness:** There exists at least one alternative regularity R' that would also be a coordination equilibrium in S.
  4.  **Common Knowledge:** It is common knowledge in P that nearly everyone conforms to R, expects others to conform, and prefers to conform conditional on that expectation.

  The elegance lies in the arbitrariness clause (3). Driving on the left vs. right, meeting at the clock vs. the fountain, red vs. green for "stop" – in each case, *any* stable solution works equally well *as a solution to the coordination problem itself*. The preference for conformity is purely conditional and instrumental: "I drive left *because* I expect others to; if they drove right, I would too." The normativity is generated entirely by the mutually reinforcing expectations solving a problem where coordination, not the *specific* coordination, is the goal.

  **The Problem of Truthfulness:**
  Lewis later, in "Languages and Language," confronts a harder case: **honesty** or **truthfulness-in-L** (systematically uttering sentences of language L only when one believes them true in L). Applying his definition directly fails:

  1.  **Coordination Problem:** Communication requires coordination on meaning. (✓)
  2.  **Coordination Equilibrium?** Truthfulness *is* a coordination equilibrium: if everyone is truthful and trusting (interprets utterances as true), communication succeeds; any individual liar or mistruster disrupts it. (✓)
  3.  **Arbitrariness?** Here's the rub. Is there an alternative regularity R' that would serve communication *just as well*? The obvious candidate, systematic **falsityfulness-in-L** (uttering sentences of L only when one believes them *false* in L), is **not** a coordination equilibrium. If everyone were falsityful and mistrusting (interpreting utterances as false), communication *would* succeed – you could reliably infer the opposite of what was said. However, crucially, **unilateral deviation** *undermines* this equilibrium. If everyone else is falsityful and mistrusting, and *I* decide to be truthful, my true statement will be interpreted as false, causing misunderstanding. Worse, if I *mistrust* while others are falsityful, I interpret their false statements as true (since I expect them to be lying, so I invert), causing error. Falsityfulness requires *everyone* to invert both production *and* interpretation perfectly. Any deviation (slipping into truthfulness, or failing to invert interpretation) causes failure. It's highly unstable. More importantly, Lewis argues, populations simply don't *have* the psychological capacity or inclination to maintain such a systematic, global inversion policy. Therefore, truthfulness-in-L is **not arbitrary** in his strong sense. There is no *practicable*, *stable* alternative regularity that solves the communication coordination problem equally well.

  **Lewis's Linguistic Maneuver:**
  Lewis's solution is to shift the locus of arbitrariness:

  1.  **The Substantive Obligation:** The requirement to be truthful (to intend to communicate true information) is **not conventional**. It's a prerequisite for communication to be worthwhile at all. We fundamentally *want* to communicate truths (at least sometimes).
  2.  **The Conventional Element:** What *is* arbitrary and conventional is **which language L** a population adopts for this truthful communication. Whether a population uses the sound "dog" or "chien" to mean *dog*, or employs SVO vs. SOV word order, is genuinely arbitrary. Many different languages (L1, L2, L3...) could serve the function of facilitating truthful communication *equally well*, provided everyone in the population converges on the *same* one.
  3.  **Piggybacking Normativity:** The norm "Be truthful-in-L" is then analyzed as a *hybrid*:
      *   The core injunction "Be truthful" (i.e., intend to convey true beliefs via your utterances) is non-conventional, driven by the fundamental desire to communicate.
      *   The specific content "in-L" is conventional. We are obligated to be truthful *in the specific language L* that our population has converged upon via convention, precisely *because* that's the arbitrary coordination point chosen.

  Your friend sees this as elegant: the coordination problem cleanly resides at the language-choice level (which mapping of sounds to meanings?), satisfying arbitrariness, while the truthfulness obligation is a separate, functional requirement for the communication project itself.

  **Testing the Maneuver: The Case of Promise-Keeping**

  Can Lewis's linguistic maneuver be generalized to other normatively loaded practices, like **promise-keeping**? Let's apply it rigorously.

  1.  **The Substantive Obligation?** Analogous to truthfulness, we might posit a fundamental desire or need to create binding commitments. The core obligation "Keep your commitments" (or "Do what you've committed to do") seems non-instrumental and non-arbitrary in a way similar to truthfulness. We value the ability to make binding agreements.
  2.  **The Conventional Element?** Following Lewis, we'd look for an arbitrary variable analogous to "which language?". The obvious candidate is **the conventional act or form that constitutes making a promise**. Is waving a specific flag, spitting in one's palm before a handshake, saying "I pinky swear," or uttering "I promise" in English vs. French the arbitrary element?
  3.  **Piggybacking Attempt:** The norm would be: "Keep the commitments you make *using the conventional form C*". The obligation to keep commitments is fundamental; the arbitrariness lies in *which signal* (C1, C2, C3...) the population uses to mark an utterance as creating such a commitment.

  **Does it Work? Assessing the Generalization:**

  *   **The Strong Case (For Generalization):** Lewis's move *does* isolate *an* arbitrary element within the practice. The *form* of the promise (the words, the gesture) is indeed conventional and often arbitrary. Different signals could serve the function of marking an utterance as commitment-creating. The coordination problem exists: we need to coordinate on *which* signal means "this is a promise, take it seriously." Once coordinated on C, it becomes a coordination equilibrium to use C sincerely and to expect commitments marked by C to be kept (and to keep them, expecting others to expect you to). The "keep commitments made via C" norm seems to piggyback on the conventional choice of C. This mirrors language: the form (sound/gesture) is arbitrary; the core function (communication/commitment) is not.

  *   **The Fatal Weakness (Against Generalization):** The analogy breaks down regarding the **strength and source of the core obligation**. In the language case:
      *   The *only* normativity Lewis needs to add externally is the *desire to communicate true information*. The specific obligation "Be truthful-in-L" *is generated by* the convention plus this desire. Once L is chosen, the instrumental reason to be truthful-in-L ("to communicate successfully") flows directly from the desire to communicate and the conventional meaning of L.
  *   In the promise case:
      *   The external element needed is the *obligation to keep commitments*. Lewis's convention only generates an obligation concerning the *form*: "Use signal C only when you intend to create a commitment" (analogous to truthfulness-in-C) and "Interpret signal C as creating a commitment" (analogous to trust-in-C). But crucially, **it does not generate the obligation to *keep* the commitment once made.**
      *   Why? Because the coordination problem solved by choosing signal C is merely **recognition**: "Did they *make* a promise?" Once recognized, the *keeping* of it is a separate action, often involving significant cost, with no *new* coordination problem being solved by performing that action *now*. The expectation that it *will* be kept in the *future* isn't sustained by the same mutual expectations solving an immediate coordination dilemma in the way driving on the left *right now* is. My keeping my promise *today* doesn't directly help *you* coordinate *your* actions *today* in the same immediate, reciprocal way that my driving on the left *right now* prevents a crash with you *right now*.
      *   The obligation to *keep* the promise seems to require a separate, **deontic "ought"** – a sense that one *must* do it, simply because one promised, even when it's costly and no immediate coordination breakdown occurs by breaking it (though general trust may erode *over time*). This "ought" is not reducible to "I prefer to keep it because I expect you to expect me to keep it, and if I don't, future coordination on making promises might fail." While *general* trust is important, the felt obligation in a *specific* case often transcends this instrumental calculation. Lewis's convention explains the *institution* of promising (how we mark commitments) and the *expectation* of keeping, but not the *distinctive normative force* of "I *must* keep *this* promise."

  **Adjudication: How Far Can Lewis's Framework Go?**

  Lewis's linguistic maneuver is **not mere sleight of hand**; it successfully identifies a genuine locus of arbitrariness (language choice) and leverages it to explain the conventional aspect of truthfulness-*in-a-particular-language*. It works well for language because the core value (truthful communication) cleanly separates from the arbitrary vehicle (the specific language).

  **However, it is fundamentally limited as a *general* strategy for reducing normativity to coordination equilibria plus arbitrariness.** Here's how far a Lewisian analysis can be pushed:

  1.  **Pure Coordination Norms:** Flawless (e.g., driving rules, meeting points).
  2.  **Norms with Arbitrary Form & Instrumental Core:** Good fit (e.g., truthfulness-*in-L*, the *form* of promising/commanding). The convention establishes the arbitrary signal/form; the instrumental value (communication, efficient command recognition) provides the core reason for conformity *using that signal*.
  3.  **Norms with Non-Arbitrary Core or Non-Instrumental Force:** **Limited.** This is where it fails for the *keeping* part of promises, honesty in non-linguistic dealings (e.g., returning a lost wallet – the *act* isn't arbitrary; the coordination problem is murky), or prohibitions against harming innocents. Lewis's framework can explain:
      *   *How* such norms become *established* and *expected* (via reciprocal conformity solving some broad assurance or cooperation problem).
      *   Why *specific instantiations* or *symbols* might be arbitrary (e.g., *how* we signal apology).
      *   Why we have an *instrumental interest* in general conformity.

  **But it cannot generate the intrinsic, deontic "ought"** often associated with these norms. The machinery of coordination equilibrium and common knowledge explains *stability* and *expectations*, but not necessarily the *source* or *full force* of the obligation, especially when conformity is costly and the immediate coordination consequences of *this* defection are diffuse. The obligation to keep a specific promise, or the sense that lying is *wrong* (not just inefficient), seems to require normative resources – perhaps evolutionary, psychological, or ethical – beyond the strategic structure of recurring coordination problems. Lewis successfully explains the *scaffolding* of many social norms, but not always the full normative *load* they bear. The linguistic case works precisely because the core normativity (desire for truth) is external and thin; for thicker norms like fidelity, the Lewisian reduction reaches its limit.
