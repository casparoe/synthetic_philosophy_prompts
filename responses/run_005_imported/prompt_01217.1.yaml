  I need to carefully reconstruct Lewis's argument. His core definition has three key elements: convention is (1) a behavioral regularity that's (2) a coordination equilibrium (everyone prefers to conform if others do), and (3) arbitrary (some alternative would work equally well). The problem arises when applying this to truthfulness, since lying systematically wouldn't work as an alternative - communication would break down. 

  Lewis's solution is clever: he shifts the arbitrariness to language choice. The obligation to be truthful isn't conventional, but which language we're truthful in is. For example, whether we use "dog" or "chien" for canines is arbitrary, but once chosen, truthfulness in that language is mandatory. 

