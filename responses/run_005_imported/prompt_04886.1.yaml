  Okay, the user is on a state bar disciplinary board and needs to draft a decision memo about a complaint between two attorneys. Let me unpack this carefully. Attorney A filed a complaint against Attorney B for billing fraud, but during the investigation, it surfaced that A committed similar misconduct five years ago that was privately settled. B's counsel wants the complaint dismissed because A lacks standing due to her past actions, while other board members focus solely on B's conduct. The memo needs to recommend whether to proceed against B, dismiss for lack of standing, investigate A, or combine actions, with timelines. Crucially, I must present the strongest counterargument before rejecting it.

  Hmm... this is tricky. The core tension is between procedural fairness (B's "clean hands" defense) and regulatory integrity (the bar's duty to investigate violations regardless of source). Standing isn't typically a barrier in disciplinary systems - most jurisdictions allow even anonymous tips. But A's hypocrisy could undermine the complaint's credibility, right? Wait, no... the memo should clarify that evidence matters more than the complainant's motives. 

  For the rejected argument: B's counsel's "unclean hands" position deserves its strongest formulation. They'd argue that A's identical past misconduct invalidates her complaint as hypocritical and abusive, potentially weaponizing the disciplinary process. There's surface-level appeal - it feels unjust for A to accuse B while hiding her own violation. But legally? Disciplinary boards aren't courts; their mandate is protecting the public, not adjudicating private disputes. Precedent likely shows past cases weren't dismissed due to complainants' misconduct. Plus, dismissing could create dangerous precedent where violators avoid scrutiny by attacking accusers.

  Recommendation-wise: Proceeding against B is essential because the evidence (if substantiated) shows ongoing harm to clients. The memo should note that A's history doesn't negate B's alleged fraud. But A's concealed past violation can't be ignored - it suggests she may have broken reporting duties by not self-disclosing her own misconduct. Separate inquiry needed there. Timelines: 30 days to finalize B's investigation, 60 for A's preliminary review. 

  Key nuance: The board must decouple the two issues. B's fate hinges on billing evidence; A's on her failure to report. Conflating them risks compromising both investigations.
