  ## STATE BAR DISCIPLINARY BOARD  
  DECISION MEMORANDUM  
  Re: Complaint by Attorney A against Attorney B  

  **I. BACKGROUND**  
  Attorney A filed a formal complaint alleging Attorney B billed a client for hours not worked, violating Rule 1.5(a) (prohibiting unreasonable fees). During investigation, evidence revealed Attorney A engaged in comparable billing misconduct five years prior, resolved privately without bar reporting. Attorney B’s counsel moves to dismiss, arguing Attorney A lacks "standing" due to her own misconduct. Board members are divided on whether the complainant’s history is relevant.  

  **II. STRONGEST VERSION OF ARGUMENT FOR DISMISSAL (REJECTED)**  
  Attorney B’s counsel contends dismissal is warranted under the equitable doctrine of *unclean hands*, asserting:  
  *   **Fundamental Fairness:** Allowing a complainant who concealed identical misconduct to accuse another subverts the disciplinary system’s integrity. Attorney A’s hypocrisy undermines her credibility and suggests bad faith (e.g., retaliatory motive or deflection).  
  *   **Procedural Abuse:** Attorney A exploited the disciplinary process while evading accountability for her own violation, violating the duty of candor (Rule 8.1). Granting her complaint legitimacy rewards this evasion.  
  *   **Waste of Resources:** Proceeding incentivizes "tit-for-tat" complaints between adversaries, burdening the Board with disputes rooted in personal animus rather than public protection.  
  *   **Implied Standing Requirement:** While no explicit rule bars complaints based on a complainant’s misconduct, principles of equity and statutory construction imply such a barrier exists to prevent abuse.  

  **III. REJECTION OF DISMISSAL ARGUMENT**  
  The Board unanimously rejects dismissal for lack of "standing" or under the unclean hands doctrine:  
  *   **Regulatory Mandate:** The Board’s duty is to protect the public and uphold ethical standards, *regardless of the complaint’s source* (ABA Model Rules for Lawyer Disciplinary Enforcement § 2.8). Complaints may stem from malice, self-interest, or altruism—the focus remains on the respondent’s conduct.  
  *   **No Standing Requirement:** Disciplinary proceedings are *sui generis*; they are not civil litigation. No rule or precedent supports dismissing a complaint based on a complainant’s unrelated misconduct. The Board’s jurisdiction is triggered by *evidence of a violation*, not complainant purity.  
  *   **Irrelevance of Complainant’s Motive:** Attorney A’s credibility or motives are secondary to objective evidence of Attorney B’s conduct. The investigation uncovered evidence warranting scrutiny of Attorney B independently of Attorney A’s complaint.  
  *   **Dangerous Precedent:** Dismissal would establish that violators can immunize themselves by attacking complainants’ pasts, chilling legitimate reports and undermining the bar’s oversight function.  

  **IV. RECOMMENDATIONS & TIMELINE**  
  The Board recommends the following actions:  

  1.  **PROCEED WITH INVESTIGATION OF ATTORNEY B**  
      *   **Rationale:** The evidence suggesting billing fraud (if corroborated) poses a direct threat to client trust and ethical standards. Attorney A’s history does not negate this evidence.  
      *   **Timeline:** Complete investigation within **30 days**. If probable cause is found, file formal charges per standard procedures.  

  2.  **OPEN SEPARATE INQUIRY INTO ATTORNEY A**  
      *   **Rationale:** Attorney A’s failure to report her own billing violation to the Bar may breach Rule 8.3(a) (duty to report professional misconduct). Private settlement does not absolve this mandatory reporting obligation.  
      *   **Timeline:**  
          *   Preliminary review of evidence re: Attorney A’s past conduct: **15 days**.  
          *   If evidence supports a Rule 8.3(a) violation, initiate formal investigation: **Within 60 days** of this memo.  

  3.  **DO NOT DISMISS COMPLAINT AGAINST ATTORNEY B**  
      *   **Rationale:** As stated in Section III, dismissal based on Attorney A’s conduct is legally unsupported and contrary to the Board’s public protection mandate.  

  **V. CONCLUSION**  
  The complaint against Attorney B presents credible allegations of Rule 1.5(a) violations meriting investigation. Attorney A’s prior misconduct is legally irrelevant to the validity of these allegations. However, Attorney A’s failure to report her own violation warrants a separate inquiry to uphold the profession’s self-reporting obligations. The Board must pursue both matters independently to fulfill its duty to the public and the integrity of the legal profession.  

  **Action:**  
  ☑ Proceed with investigation of Attorney B (Timeline: 30 days)  
  ☑ Open preliminary inquiry into Attorney A re: Rule 8.3(a) (Timeline: 15-day review; 60-day investigation if warranted)  
  ☒ Dismiss complaint against Attorney B  

