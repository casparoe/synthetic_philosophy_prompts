answer: |-
  Here's a close reading of the Aquinas passage, analyzing your interpretive dispute and its connection to contemporary double effect:

  **Close Reading & Adjudication:**

  1.  **Establishing the Core Double Effect Structure:** Aquinas *explicitly* lays out the foundational structure of double effect in the opening sentences:
      *   "**Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention.**" This is the core insight.
      *   "**Moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental.**" This establishes the *moral relevance* of the distinction between the intended effect and the merely foreseen side-effect.
      *   Applied to self-defense: "**one's intention is to save one's own life...**" (intended effect) and "**the slaying of the aggressor**" (effect beside the intention).

  2.  **Proportionality as a Necessary Condition:** Aquinas immediately adds a crucial qualifier: "**though proceeding from a good intention, an act may be rendered unlawful, if it be out of proportion to the end.**" He applies this directly to self-defense: "**if a man, in self-defense, uses more than necessary violence, it will be unlawful, whereas if he repel force with moderation his defense will be lawful.**" This establishes proportionality as a *separate* necessary condition for the act to be lawful, *alongside* the distinction between intended and foreseen effects.

  3.  **The Private Individual's Constraint:** Aquinas reinforces the prohibition on *intending* death for the private individual:
      *   "**Nor is it necessary for salvation that a man omit the act of moderate self-defense in order to avoid killing the other man...**" (Affirms permissibility of acting with foreseen death).
      *   "**But as it is unlawful to take a man's life, except for the public authority acting for the common good, it is not lawful for a man to intend killing a man in self-defense...**" (Explicitly forbids the private individual from *intending* the aggressor's death. The justification for this prohibition rests on the general principle that only public authority can licitly take life for the common good).

  4.  **The Public Authority Exception:** Aquinas then carves out the exception:
      *   "**except for such as have public authority, who while intending to kill a man in self-defense, refer this to the public good...**" (Key phrase: "**intending to kill**").
      *   Examples: "**a soldier fighting against the foe, and in the minister of the judge struggling with robbers**".
      *   Caveat: "**although even these sin if they be moved by private animosity.**" (The *intention* must genuinely be for the public good, not personal malice).

  **Adjudicating Your Dispute:**

  *   **Your Friend's Argument (Public Authority is Decisive):** Your friend is correct that Aquinas makes a *distinct moral difference* based on the agent's role. For the private individual, *intending* the death is categorically forbidden ("it is not lawful... to intend killing"). For the public authority figure, *intending* the death *is* permissible, provided it is "referred to the public good." This is a significant qualification to a simple "intend/foresee" rule. The permissibility of *intending* death hinges on the agent's role and the end they serve. The passage is indeed shakier ground for the *standard, simplified* trolley-problem version of DDE than often assumed because Aquinas explicitly permits *intending* death under specific conditions (public role + common good).
  *   **Your Argument (Intention's Identical Work, Different Ends):** You are also correct, but in a more nuanced way. The *structure* of intention remains central to Aquinas's analysis in *both* cases:
      *   For the private individual: The licit act requires intending only self-preservation and *foreseeing* but not *intending* death. Intending death makes it unlawful.
      *   For the public authority: The licit act requires intending the death *as a means* to defending the public good (or oneself *as part of* that public duty). Intending death *for private animosity* makes it sinful. The *object* of the intention changes (self-preservation vs. public good defense), but the *deliberate choice* to bring about death (intention) is what distinguishes the public authority's permissible act from the private individual's forbidden intention. The *logic* of intention defining the "species of the act" applies universally; what changes is *what* can licitly be intended by whom.

  **Synthesis:** Aquinas presents a **layered doctrine**:
  1.  **Core DDE Structure:** Acts can have multiple effects; moral species depends on the intended effect; foreseen side-effects can be permissible if unintended.
  2.  **Necessary Conditions:** Proportionality *and* the agent's role constrain what can be licitly intended.
  3.  **Role-Specific Permissions:** The *intention* of death is morally illicit *unless* the agent acts with legitimate public authority and refers the killing to the public good. In this specific case (intentional killing), the agent's role fundamentally changes what intention is morally possible. **The friend is right that the public authority distinction modifies the simple "intend/foresee" rule concerning killing.** **You are right that intention remains the fundamental moral category determining the act's nature in both contexts; the role defines *what* can be licitly intended.**

  **Continuity with Contemporary Trolley Literature:**

  1.  **Core Continuity:** Aquinas provides the essential foundation:
      *   The distinction between intended effects and foreseen side-effects.
      *   The principle that an act can be permissible if the bad effect is unintended (merely foreseen), while the intended effect is good, *and* proportionality is satisfied.
      *   Foot and others explicitly draw on this core structure for trolley problems (e.g., diverting the trolley intends to save five, foresees but does not intend killing one; pushing the fat man intends killing him as a means to save five).

  2.  **Significant Discontinuity:**
      *   **Role of the Agent:** Trolley problems almost universally abstract away the agent's social role (judge, soldier, private citizen). The focus is purely on the act's structure, intentions, and consequences. Aquinas's crucial distinction based on public authority plays *no role* in standard trolley analyses. This is a major divergence.
      *   **Permissibility of Intending Evil:** Aquinas *forbids* intending evil (death) for the private citizen but *permits* it for the public official serving the common good. Contemporary DDE, as used in trolley problems, almost always maintains the *absolute prohibition* on *intending* evil (like death) as a means or end, even for hypothetical "public officials" in trolley scenarios. Pushing the fat man is typically ruled out *because* it intends the death. Aquinas's public official exception is generally *not* incorporated into the modern trolley DDE framework. This makes Aquinas's view more permissive regarding intentional harm in some contexts but more restrictive regarding private citizens.
      *   **Foundation of the Prohibition:** Aquinas grounds the prohibition on private intentional killing in the natural law limitation of lethal authority to the public good. Contemporary DDE discussions often rely more on the intrinsic wrongness of intending harm or Kantian-inspired prohibitions on using persons merely as means, rather than a theory of legitimate authority derived from natural law and the common good.
      *   **Proportionality:** While proportionality remains a condition in both, Aquinas emphasizes it as a separate check on an act otherwise structured by intention (moderate vs. immoderate force). In trolley problems, proportionality is often woven into the evaluation of whether the unintended bad effect is outweighed, but the primary focus is the structure of intention itself.

  **Conclusion:**

  Your friend correctly highlights a critical nuance in Aquinas: the permissibility of *intending* death hinges decisively on **public authority** serving the **common good**. This makes the passage a less straightforward ancestor of the simple "intend/foresee" distinction used in trolley problems, where intending death is typically always impermissible. You are correct that **intention** remains the fundamental moral category for Aquinas in defining the act in *both* cases; the role determines *what intention is licit*. The core DDE structure (one act, two effects, species by intention) is undeniably present and foundational.

  The continuity with contemporary trolley literature lies in the **core structural insight** of DDE. The discontinuity arises from Aquinas's **role-specific permissions concerning intention** (especially for killing) and his grounding in **natural law and the common good**, elements largely absent or transformed in the abstract, agent-neutral, and often deontological framework of trolley problem discussions. Aquinas's doctrine is richer and more contextually embedded (role, common good) than the distilled principle often invoked in contemporary ethics.
