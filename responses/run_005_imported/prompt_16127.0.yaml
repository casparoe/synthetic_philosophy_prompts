prompt: |-
  Quick bit of context: I'm a backend/ML engineer at a small consumer-lending startup, and because I built the underwriting model I somehow got pulled onto our "Responsible AI Council" -- a very extra name for six people arguing over Zoom every other Thursday. The model outputs a probability-of-default number for every applicant, which drives pricing and approval decisions. The current version buckets applicants pretty coarsely (state, broad age band, credit tier), but our data science lead wants to ship a v2 that slices much finer -- zip code, income band, five-year age bracket, plus behavioral stuff like which of our other products someone has used. It backtests noticeably better, tighter calibration curves across the board, so on pure metrics it's an easy yes. Legal and the outside ethics consultant we bring in for these meetings are blocking it, and it's become a real fight.

  Here's the bit I'm stuck on: everyone keeps collapsing two different objections into one. Objection one is the familiar "this reconstructs race and neighborhood history through the back door" fair-lending worry, which I get fine. Objection two, which the consultant keeps trying to explain, is wierder: even if the finer slicing were completely clean of any protected-class proxy, there's apparently no principled reason that particular grouping is the "correct" one for pricing any given applicant -- you could equally well bucket the same guy by profession, or by his specific repayment history with us, or a dozen other reasonable partitions, and each hands back a different number for the same human being. We actually ran one test applicant through both versions: v1 priced him at roughly 4% probability of default, the new zip/income/behavior slicing put him at almost 8%, and when a teammate rebucketed him by profession and tenure instead he came out under 2%. Nobody on the data science side can answer "why this reference class and not another" with anything better than "it backtests well," and the consultant sent around a philosophy paper (something by a guy named Hájek, "The Reference Class Problem is Your Problem Too") that I read half of on the train and did not fully recover from.

  I have to send the council a short written recommendation before Thursday: basically whether v2 ships as-is, gets blocked, or ships with specific conditions, plus a timeframe, since launch is currently penciled in for three weeks out. Could you draft that memo for me? I need it to actually engage with objection two as its own real problem instead of folding it back into the bias conversation and calling it a day, and whatever it recommends, I want it to lay out the strongest version of the case for the option it's turning down, since half the room will read this looking for ammunition against whatever I land on. A short table of conditions at the end would be great if we go that route, but the reasoning that gets us there matters more than the formatting.
reasoning: |-
  Okay, the user is a backend/ML engineer at a lending startup dealing with a Responsible AI Council debate. They need to write a recommendation about deploying a more granular underwriting model (v2). The key issue isn't just bias concerns but also the "reference class problem" - how different groupings of features can yield vastly different risk scores for the same person. 

  Hmm, this is messy. The user's caught between data science wanting to deploy a technically superior model and ethics/legal pushing back hard. The consultant's throwing philosophy papers at them, and no one's cleanly separating the two objections: bias proxies vs fundamental arbitrariness in feature selection. 

  The user's memo needs to do three things well: 
  First, clearly disentangle the bias concern from the reference class problem - most people are conflating them. 
  Second, acknowledge that "backtests well" isn't a sufficient answer to "why these features?" especially when alternative bucketing gives wildly different scores. 
  Third, give a practical path forward that doesn't torpedo the model launch but forces serious validation. 

  I'm noticing the user's stressed about timeframe (3 weeks to launch) and council politics. Half the room will weaponize whatever they write. So the memo must preemptively address counterarguments - like explicitly stating why blocking v2 entirely is worse than conditional approval. 

  The Hájek paper reference suggests this isn't just theoretical - different reference classes genuinely produce incompatible but equally "valid" risk assessments. That's terrifying for lending fairness. But the user can't solve philosophy; they need engineering guardrails. 

  Key tradeoff: The model's precision gain (real business value) vs introducing new arbitrariness (legal/ethical risk). The sweet spot might be allowing deployment but with: 
  1) Robust sensitivity testing (how much do scores jump when features change?) 
  2) Business logic constraints (e.g., no single feature dominating outcomes) 
  3) Monitoring for "score volatility" at individual level 

  ...And buying time post-launch to study the reference class issue properly. The user's team clearly hasn't done this homework yet. 

  Biggest risk: If they deploy without addressing this, and regulators later prove equally accurate models give different rates, they're exposed. But delaying launch has costs too. The conditional approval with specific validation milestones feels like the only viable middle path.
answer: |-
  ## MEMORANDUM  
  **To:** Responsible AI Council  
  **From:** [Your Name], Backend/ML Engineer  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Underwriting Model v2 Deployment  

  ### 1. Context  
  Model v2 demonstrates clear improvements in calibration and backtested accuracy over v1. However, two distinct ethical concerns require resolution:  
  - **Objection 1 (Bias Proxy Risk):** Finer features (e.g., zip code) may reconstruct protected attributes (race/neighborhood history).  
  - **Objection 2 (Reference Class Problem):** Even absent bias, multiple valid feature groupings yield materially different PD scores for the same applicant, raising questions about the *fundamental arbitrariness* of the selected bucketing strategy.  

  This memo focuses primarily on Objection 2, which presents a novel and under-addressed challenge to model fairness.  

  ---

  ### 2. Core Issue: The Reference Class Problem  
  As demonstrated by our test applicant (PD: 4% in v1, 8% in v2, 2% under alternative grouping), **Objection 2 is not hypothetical**. It reveals a foundational tension:  
  - **The Dilemma:** All risk models rely on grouping individuals into reference classes. However:  
    - *No single "correct" grouping exists.* Different features (zip code, profession, tenure) reflect legitimate but partial facets of risk.  
    - *Model performance (AUC, calibration) alone cannot resolve this.* A model can be statistically "accurate" while its *choice of reference classes* remains ethically arbitrary.  
  - **The Risk:** Unchecked, this arbitrariness can lead to:  
    - Unjustified variance in pricing/approvals for similar-risk individuals.  
    - Erosion of customer trust if outcomes feel capricious.  
    - Regulatory scrutiny under UDAAP (Unfair, Deceptive, or Abusive Acts/Practices) principles, even absent traditional bias.  

  Our current justification ("it backtests best") is necessary but *insufficient* to answer this ethical challenge.  

  ---

  ### 3. Options Analysis  

  | Option                     | Strengths                                                                 | Weaknesses                                                                                                |  
  |----------------------------|---------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|  
  | **A. Block v2 Deployment** | Eliminates immediate reference class/bias risks; Forces deeper analysis. | Discards material accuracy gains; Undermines data science velocity; Ignores v1’s own coarser (but real) arbitrariness. |  
  | **B. Deploy v2 As-Is**     | Captures backtested value; Aligns with technical metrics.                 | Ignores unresolved ethical ambiguity; Exposes firm to legal/reputational risk if reference class issue manifests; May exacerbate Objection 1. |  
  | **C. Deploy v2 with Conditions** | Balances innovation with responsibility; Mitigates key risks proactively. | Requires rapid cross-functional work; May delay launch slightly.                                        |  

  ---

  ### 4. Recommendation: Deploy v2 with Conditions  
  **Approval is recommended** contingent on addressing *both* objections before launch. **Objection 2 specifically demands procedural rigor to justify our feature selection beyond backtesting.**  

  **Proposed Conditions & Timeline:**  
  | Condition                                                                                               | Owner         | Deadline     |  
  |---------------------------------------------------------------------------------------------------------|---------------|--------------|  
  | 1. **Sensitivity Analysis Report:** Quantify PD variance for diverse applicants under 3-5 *plausible alternative feature groupings* (e.g., profession-centric, tenure-centric). Report max/min PD delta observed. | Data Science | 1 Week       |  
  | 2. **Reference Class Justification Framework:** Document *business-ethical* rationale (beyond AUC) for selecting zip/income/behavior over alternatives. Cite lending industry norms, customer expectations, or causal logic. | DS + Legal + Ethics | 10 Days    |  
  | 3. **Bias Proxy Mitigation:** Finalize disparity testing on v2 (disaggregated by race/gender via BISG) + implement demographic guardrails (e.g., max rate delta allowed across groups). | DS + Legal    | 2 Weeks      |  
  | 4. **Post-Launch Monitoring:** Track "high-variance" applicants (those whose PD shifts >X% under alternative models in #1). Flag for manual review initially. | Engineering   | At Launch    |  

  **Launch Timeframe:** **Conditional Go-Live in 3 Weeks** remains achievable *if* Conditions 1-3 are met satisfactorily by deadlines. If not, launch pauses for Council review.  

  ---

  ### 5. Why Not the Alternatives?  
  - **Blocking v2:** While safe, it perpetuates v1’s *known* inaccuracy and its own (coarser) reference class arbitrariness. Accuracy is a *component* of fairness; stagnation is not virtuous.  
  - **Deploying As-Is:** Ignores the consultant’s valid philosophical/legal warning. "We didn’t consider alternatives" is indefensible if challenged by regulators or customers.  

  ---

  ### 6. Conclusion  
  Model v2’s accuracy gains are real and valuable. However, **the reference class problem requires us to demonstrate *deliberateness* in our feature selection, not just technical performance.** The proposed conditions force this rigor while enabling launch. By documenting our rationale and monitoring variance, we turn an abstract concern into a manageable risk control.  

  **Recommended Path:**  
  ✅ **Approve v2 for launch in 3 weeks** contingent on completion of Conditions 1-4 above. Council to review interim deliverables at Days 7 and 14.  

  ---  
  *Attachment: Summary Table of Conditions*  

  Let me know if you'd like to refine any arguments or add specific legal/technical nuances. This balances pragmatism with genuine engagement on the philosophy.
