  A couple of people in my philosophy discussion group (I started going after I retired, mostly to keep the brain from rusting) got into a real arguement last week about laws of nature, and it's been bugging me since. (1) Evan said Humean regularity theories -- he kept invoking Lewis's "best system" version -- can't actually explain anything: if a law is just a compact summary of a huge pile of particular events, citing it to explain any one of those events is circular, like explaining a student's B by pointing at the class average. (2) Nora said that's no different from ordinary scientific explanation: we explain things by unifying particulars under a few simple, strong axioms, and nobody thinks Newton's laws fail to explain planetary motion just because we inferred them from watching the planets. (3) Evan replied that compressing data isn't explaining it, and worse, that a mere pattern among actual events has no grip on cases that never happen -- it can't ground "the vase would've shattered if I'd dropped it," since I never dropped it. (4) Nora came back that Lewis has an answer for that too: the same simple/strong system that wins for the actual world also comes out best (or close to it) at all the nearby possible worlds relevant to the counterfactual, so the coverage extends past the actual events for free, no extra necessitation relation needed.

  Neither budged, and they both looked at me to settle it since Im supposedly the "science guy" of the group, but thirty years of just plugging away with F=ma without asking what it actually IS did not prepare me for this. Could you go through moves (1)-(4) and say who's got the better of each exchange, plus whatever important thing you think both are missing? Give me scores as a JSON block, {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, each an integer from -2 (badly wrong) to 2 (basically nails it), then briefly justify each one.
