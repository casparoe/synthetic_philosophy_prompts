  okay so my friend Theo and I were up way too late last night arguing about decision theory again (we do this more than either of us wants to admit), and it turned into a whole thing about the Pasadena game vs. the St. Petersburg paradox. His basic position is that Pasadena is just St. Petersburg "with extra steps." Both games have that same doubling structure where the payout grows like 2^n while the probability of getting that far shrinks like 2^-n, so obviously the expected value goes haywire in both cases, and the fix people reach for is the same one going back to Bernoulli — stick a concave, bounded utility function on the payouts instead of raw dollar amounts, and the problem more or less dissolves either way. He thinks the alternating plus-and-minus signs on the Pasadena payouts (which I think come from a paper by Alan Hájek, maybe with a coauthor?) are basically just cosmetic, a way to dress up an old 18th century paradox so it looks new enough to publish.

  I wasn't convinced but couldn't say why on the spot — it was like 1am and we'd had a couple beers by that point lol. I have this nagging memory from a stats class that the "problem" with Pasadena isn't just that the expected value is big or infinite the way it is with St. Petersburg, but that its not even well-defined as a single number, like the answer changes depending on the order you add the terms up in, which seems like it should matter a lot for whether Theo's "one paradox, two costumes" story actually holds together. Am I remembering that right? And if so, does that mean bounding the utility function is basically a red herring for what's really going on in Pasadena, or does it end up fixing that version too, just for a totally different reason than it fixes St. Petersburg? Basically I want to know if Theo's take is defensible or if he's collapsing two genuinely different problems into one just because they both involve infinity and doubling.
