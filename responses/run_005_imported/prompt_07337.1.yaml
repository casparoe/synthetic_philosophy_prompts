answer: |-
  Here’s a dialogue between a Traditionalist (defending Walzer’s symmetry) and a Revisionist (advocating McMahan’s asymmetry), structured to press core objections and culminating in their double cruxes:

  **Setting:** A university seminar room after a conference on war ethics.  
  **Characters:**  
  - **Traditionalist:** Defends moral equality of combatants as essential for functional *jus in bello*.  
  - **Revisionist:** Argues liability tracks individual moral responsibility for unjust threats.  

  ---

  **Traditionalist (T):** Let’s start simply: on the battlefield, a soldier faces another soldier. Why should the *justice of their nation’s cause* determine whether pulling the trigger is murder? The rules of engagement must be clear, universal, and actionable in the fog of war. Your asymmetry makes every rifleman a moral philosopher.  

  **Revisionist (R):** But they *are* moral agents! If I knowingly contribute to an unjustified lethal threat—like a bank robber’s getaway driver—I’m liable to defensive force. Why does putting on a uniform absolve one of that responsibility? The just combatant defends innocent lives; the unjust combatant endangers them.  

  **T:** Epistemic humility! A conscript in Russia or Ukraine isn’t privy to high-level intelligence. They’re told they’re defending against Nazis or NATO expansion. If soldiers must adjudicate *ad bellum* justice subjectively, you paralyze them—or worse, incentivize desertion based on propaganda.  

  **R:** Ignorance isn’t blanket immunity. A mafia enforcer might believe he’s "protecting his community," but if he’s willfully ignorant or perpetuating harm, he’s still responsible. Soldiers have a duty to critically examine their cause—especially when killing is involved.  

  **T:** That duty collapses the firewall between *jus ad bellum* and *jus in bello*. Your view makes the laws of war contingent on victors’ tribunals. If only just combatants can kill lawfully, then every dead civilian becomes a potential war crime for the *unjust* side—even if they followed proportionality!  

  **R:** Not necessarily. *Jus in bello* rules (distinction, proportionality) can remain objective *standards*, but *liability* hinges on context. An unjust combatant who avoids civilians still does wrong by killing just soldiers—but less gravely. The law can separate *moral liability* from *legal prosecutability* for pragmatism.  

  **T:** Pragmatism? Your theory makes warfare *unworkable*. If a Ukrainian drone operator knows conscripted Russians are coerced or deceived, must they hesitate? Your asymmetry breeds moral chaos when we need clear red lines to restrain horror.  

  **R:** Clarity ≠ moral truth. We *already* accept asymmetries: police may kill a school shooter; the shooter may not kill police. Why can’t a just defender target unjust aggressors, while the aggressors lack that right? The "chaos" you fear stems from war’s inherent injustice—not my theory.  

  **T:** But soldiers aren’t criminals—they’re functionaries of a collective. War is a Hobbesian state of necessity. By entering combat, soldiers mutually consent to reciprocal risk, creating a moral sphere where personal guilt is suspended.  

  **R:** That’s the crux! You see the battlefield as a distinct institution with its own norms. I see it as an extension of interpersonal ethics. If a state sends you to kill innocent people, you don’t gain rights by doing it en masse.  

  **T:** Then answer this: A 19-year-old conscript is drafted by a dictatorship, given false intelligence, and threatened with prison if he deserts. Is he *liable* to be killed?  

  **R:** Tragically, yes—if he shoots at just defenders. But his blameworthiness is mitigated (he’s less *culpable*), and just forces should minimize harm to him. Yet by participating, he becomes part of an unjust threat that must be stopped.  

  **T:** So a scared kid coerced into holding a rifle is morally equivalent to a voluntary SS officer? That’s where your individualism breaks. My symmetry acknowledges war’s collective tragedy: combatants are *already victims* of state violence. Granting them equal status protects their humanity.  

  **R:** No—it *erases* their agency. And it victimizes the truly innocent: those they unjustly attack. Your "humanity" privileges soldiers over civilians they imperil.  

  ---  
  **Double Cruxes:**  

  **T:** **My crux:** If I conceded that *the collectivized context of warfare does not create a distinct moral sphere* where ordinary self-defense principles are suspended, I’d abandon combatant equality. But as long as war is a state monopoly enacted through bureaucracy, fog, and coercion—not individual aggression—its ethics must differ from bar fights.  

  **R:** **My crux:** If I accepted that *wearing a state uniform grants moral immunity for contributing to unjust killings*, I’d accept symmetry. But since I see institutions as aggregates of moral agents, not alchemists transforming wrong into right, I can’t. The burden is on *you* to explain why the bank-robbing principle doesn’t scale up.  

  **T:** Then we remain at the abyss.  
  **R:** Then we keep digging.  

  ---  

  **Key Disputes Explored:**  
  1. **Epistemic Objection (R pressed):** Revisionist demands critical engagement from soldiers but admits mitigating factors for ignorance/coercion.  
  2. *Jus in Bello* Independence (T pressed): Traditionalist warns asymmetry collapses legal/moral firewalls; Revisionist argues law can be pragmatic while ethics remain truth-apt.  
  3. **Coercion/Deception (T pressed):** Traditionalist highlights how symmetry protects the coerced; Revisionist distinguishes liability from culpability but holds participation creates threat.  
  4. **Institutional vs. Interpersonal (Cruxes):** Traditionalist’s crux hinges on war’s unique structure; Revisionist’s on the scalability of individual ethics.  

  This leaves both positions coherent but irreconcilable—exactly as the double crux method predicts when core premises diverge.
