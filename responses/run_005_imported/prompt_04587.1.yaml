answer: |-
  Your thesis is profoundly unsettling but formally sound: **Frege's application of his logical concept of "hereditary property" to defend racial hierarchy was a valid, non-equivocal deployment of his own apparatus.** The flaw lies exclusively in the empirical and moral premises he smuggled into his system, not in the logical inference. This dismantles the "separate rooms" metaphor by demonstrating that Frege's philosophy and politics shared a common conceptual foundation. Here's the structured argument:

  ### 1. **Frege's Logical Apparatus: Hereditary Properties and the Ancestral Relation**  
     - In *Grundgesetze der Arithmetik* (1893), Frege defines a property as **hereditary** (within a sequence ordered by a relation *f*) if:  
       *Whenever it holds for any element *x*, and *x* bears relation *f* to *y*, it also holds for *y*.*  
     - The **ancestral relation** (later named by Russell/Whitehead) is derived from this: It defines the property of "belonging to a sequence starting from *x*" by making "being a descendant of *x*" a hereditary property.  
     - This construct is **purely formal** and **domain-agnostic**. It abstracts relations like mathematical succession (e.g., 0 → 1 → 2) or biological lineage without presupposing empirical content.  

  ### 2. **Frege's Racial Argument: A Valid Application**  
     Frege asserted that "Aryan superiority" is a hereditary property in the *technical sense*:  
     - **Premise 1 (Empirical, false):** "Aryan descent" confers inherent superiority.  
     - **Premise 2 (Formal):** Superiority is a *hereditary property* under the biological parent-child relation (*f* = "is a parent of").  
       → *If a parent has "Aryan superiority," then all their children must inherit it.*  
     - **Conclusion:** Favoring "Aryans" is non-arbitrary because superiority propagates via the ancestral relation.  

     **Validity:**  
     - The inference is **structurally identical** to Frege's definition of natural numbers. For numbers:  
       *"Being reachable from 0 by succession"* is hereditary under *f* = "is the successor of."  
     - For race:  
       *"Being Aryan-superior"* is hereditary under *f* = "is a biological descendant of."  
     - No equivocation occurs. The logical machinery operates identically in both cases.  

  ### 3. **Rebuttal to the "Separate Rooms" Thesis**  
     Dummett's view—that Frege's logic and politics are "unaccountable to each other"—collapses under scrutiny:  
     - **Shared Vocabulary:** Frege didn’t merely *use* logic to rationalize prejudice; he *re-purposed his core innovation*. The ancestral relation was his crowning achievement in reducing arithmetic to logic. Its deployment for racial hierarchy proves his philosophy and politics occupied the *same conceptual space*.  
     - **Moral Neutrality ≠ Structural Neutrality:** While formal logic is morally neutral, its constructs gain ethical weight when applied. Frege’s framework *enabled* his racism by providing a rigorous structure to naturalize it. The tool was neutral, but *his application of it was not*—it revealed his willingness to graft bigotry onto his logic’s scaffolding.  
     - **The Premise Problem:** The flaw was *not* in the inference but in Premise 1 ("Aryan superiority exists"). This premise is:  
       - **Empirically false** (no evidence for racial superiority),  
       - **Morally repugnant** (dehumanizing),  
       - **External to logic** (logic cannot validate empirical claims).  
     - **Dummett's Inconsistency:** To dismiss Frege’s racism as "personal" ignores that he weaponized his life’s work to legitimize it. If logic and politics were truly separate, Frege would not have used *hereditary property*—the bedrock of his system—as the vehicle for his hate.  

  ### 4. **Why This Matters: Philosophy’s Uncomfortable Truth**  
     - **The Apparatus Absorbs the Premise:** Frege’s logic *could not* refute his racial argument because the system is designed to validate conclusions from given premises. His racism was "logically consistent" with his framework, making it more insidious than a mere emotional prejudice.  
     - **A Warning Against Abstraction:** Frege’s case exposes how formal systems, when detached from ethical scrutiny, can sanctify atrocities. His definition of hereditary properties was intended to secure mathematical truth—but its formal purity made it equally serviceable for pseudoscientific racism.  

  ### Conclusion: The House with One Foundation  
  Frege’s work is a monolith, not a partitioned house. His politics did not corrupt his logic; they exploited its flexibility. **The ancestral relation was both the foundation of arithmetic and the scaffold for his bigotry.** This forces a grim recognition: Formal genius offers no immunity to moral failure—it can even arm it with intellectual credibility. Dummett’s shock reflects a desire to compartmentalize, but Frege himself refused that separation. The diary’s venom was not a private failing; it was the dark twin of his public brilliance, both drawing from the same well of conceptual rigor. To honor Frege’s contributions, we must confront how deeply his logic was entangled with his hate—not to dismiss his achievements, but to understand how easily reason, unmoored from humanity, becomes a tool for its opposite.  

  *"The ancestral relation giveth numbers; the ancestral relation taketh away dignity. One apparatus, master of all domains."*
