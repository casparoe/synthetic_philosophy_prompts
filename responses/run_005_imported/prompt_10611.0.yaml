  Ok so my friend and I just spent way too long arguing about the Judy Benjamin problem -- the lost soldier stuck somewhere in a 2x2 grid of Red/Blue territory crossed with HQ-company/2nd-company area, uniform prior across all four quadrants, and then HQ radios her "if you're in Red, the odds are 3:1 you're in the HQ part rather than the 2nd company part." The famously weird bit: if you update via minimum-cross-entropy (one of the standard proposals for generalizing conditionalization to a conditional tip like that, instead of a flat-out proposition), your credence on Red vs Blue overall actually shifts, even tho the tip was only ever about the split within Red. My friend thinks that's just a quirk of this one example and doesn't show anything deep -- I definately think it generalizes to pretty much any case where you get conditional testimony like that. Can you invent a totally different example (different domain, not soldiers/territories reskinned) with the same bones -- uniform prior over a 2x2 split, testimony that's a conditional-odds statement about only one half of one split -- and show whether the same spillover into the untouched split shows up? Kinda want to settle this once and for all.
