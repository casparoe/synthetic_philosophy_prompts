prompt: |-
  I host a podcast on judgment and decision-making whose audience mostly arrived via Kahneman, the Sequences, and the rest of the usual rationalist-blogosphere canon, so next week I want to complicate that picture: my guest is a cognitive scientist who defends the fast-and-frugal heuristics program as the true heir to Herbert Simon's bounded rationality, against a heuristics-and-biases tradition she thinks quietly redefined "satisficing" as a story about error measured against an idealized rational-actor benchmark. On her view, strategies like take-the-best and the recognition heuristic aren't degraded stand-ins for fuller computation but can outperform it outright -- the "less-is-more" effect -- and most textbook biases reflect the wrong normative standard rather than genuine irrationality. Draft eight to ten interview questions that don't just let her restate the adaptive-toolbox picture: I want one that presses on how far less-is-more results demonstrated in narrow tasks like city-population judgments are entitled to generalize, one on the strategy-selection problem -- how an agent, or a modeler, is supposed to know which heuristic from the toolbox fits a given environment without already doing something like the fuller computation the heuristic exists to avoid -- and one asking her to distinguish take-the-best's cue-by-cue stopping rule from Simon's original aspiration-level satisficing, rather than simply asserting continuity between them. For each of these three, add a follow-up keyed to the answer she's most likely to give, and close with a question about what finding would actually settle the dispute with the heuristics-and-biases camp, as opposed to one that just gets her to restate which normative standard each side prefers.
reasoning: |-
  Okay, the user hosts a podcast on judgment and decision-making, and their audience is familiar with Kahneman, the Sequences, and rationalist-blogosphere content. They want to complicate that picture by interviewing a cognitive scientist who advocates for the fast-and-frugal heuristics program. The user needs eight to ten interview questions that go beyond just letting the guest restate the adaptive-toolbox view. Specifically, they want three targeted questions with follow-ups on generalization, strategy selection, and distinguishing take-the-best from Simon's satisficing. They also want a closing question about what evidence could settle the dispute with the heuristics-and-biases camp.

  First, I need to understand the core conflict. The guest argues that fast-and-frugal heuristics are the true heirs to Simon's bounded rationality, criticizing the heuristics-and-biases tradition for redefining satisficing as error against an idealized benchmark. She believes heuristics like take-the-best can outperform full computation (less-is-more effect) and that many biases are due to wrong normative standards, not irrationality.

  The user wants questions that challenge and deepen the discussion. The three specific areas are:
  1. Generalization of less-is-more effects beyond narrow tasks.
  2. The strategy-selection problem: how to choose the right heuristic without full computation.
  3. Distinguishing take-the-best's stopping rule from Simon's aspiration-level satisficing.

  For each, I need to anticipate the guest's likely answers and craft follow-ups that press further. Then, a closing question about what finding would settle the dispute, not just restate normative preferences.

  Starting with generalization: The guest might point to ecological rationality and real-world examples. Follow-up should push on whether lab demonstrations scale to complex environments or if there are domains where more information is crucial.

  For strategy-selection: The guest might talk about meta-heuristics or environmental cues. Follow-up should challenge how these are learned without computational cost or how to avoid mismatches.

  On take-the-best vs. satisficing: She might emphasize their shared frugality. Follow-up should highlight the difference in stopping rules (cue-based vs. aspiration level) and why that matters for Simon's legacy.

  Closing question: Need something that forces consideration of empirical evidence both sides would accept, like real-world decision outcomes or computational trade-offs in specific domains.

  Also, ensure other questions cover key aspects without being redundant. Possible angles: ecological validity of bias studies, teaching heuristics, critiques of heuristics-and-biases methodology, evolution of heuristics, practical applications.

  Finally, structure the questions to flow naturally, with the targeted ones in the middle and the closing question at the end. Make sure each question pushes beyond surface-level explanations into deeper analysis or predictions.
answer: |-
  Here are 10 interview questions designed to challenge and deepen the discussion on fast-and-frugal heuristics (FFH), incorporating your specific requests for targeted probing on generalization, strategy selection, and conceptual distinctions, plus a decisive closing question. Each core challenge question has an anticipated answer and a pointed follow-up.

  **Core Challenge Questions & Follow-Ups:**

  1.  **Generalization Challenge:** "The 'less-is-more' effect is compellingly demonstrated in tasks like inferring which of two cities is larger based on limited cues (e.g., recognition, few features). But critics argue these are narrow, often artificial, low-stakes judgments. How confident are we that this effect robustly scales to complex, high-stakes, real-world decisions – like medical diagnosis, financial investing, or policy design – where the cost of being 'less' might be catastrophic, and the 'more' often includes crucial, non-redundant information?"
      *   *Anticipated Answer:* She'll likely emphasize ecological rationality – that FFH are *designed for* specific environments where their simplicity matches the structure of the information, and point to examples like expert intuition or successful simple rules in complex domains (e.g., flu diagnosis heuristics).
      *   **Follow-Up:** "But isn't there a potential asymmetry? Demonstrating 'less-is-more' in *some* complex domains feels like existence proof, while failures might be attributed to 'poor fit' rather than a limitation of the *general* principle. What specific *empirical result* across diverse high-stakes domains would convince *you* that the generalization of the 'less-is-more' effect has clear boundaries we should be wary of?"

  2.  **Strategy Selection Problem:** "A core appeal of the adaptive toolbox is having the *right* heuristic for the environment. But this raises the 'meta-problem': how does the agent (or the modeler) *select* the appropriate heuristic without first engaging in precisely the kind of computationally expensive analysis of the environment that heuristics are supposed to avoid? What's the heuristic for choosing heuristics?"
      *   *Anticipated Answer:* She'll likely discuss cues in the environment (e.g., recognition available? cue validities discernible?), feedback loops, social learning, evolved defaults, or domain-specific knowledge triggering specific tools. She might downplay the need for a meta-*heuristic* per se.
      *   **Follow-Up:** "Let's grant that cues or feedback *can* trigger heuristics. But doesn't this just push the problem back? How is the agent supposed to *learn* which environmental cues reliably signal which heuristic's success, especially in novel situations, without incurring significant computational or error costs during the learning phase itself? Isn't this learning process often *more* demanding than the bounded rationality FFH seeks to address?"

  3.  **Distinguishing Take-The-Best (TTB) from Simon's Satisficing:** "You emphasize continuity between FFH and Simon's bounded rationality. However, Simon's original 'satisficing' was fundamentally about setting an *aspiration level* and stopping search when that level was met – a *goal-oriented* stopping rule. TTB, in contrast, uses a *cue-based* stopping rule: search cues in order of validity and stop at the first discriminating cue. How is this cue-based rule fundamentally different from Simon's aspiration-level concept, and why is it more faithful to his vision of bounded rationality?"
      *   *Anticipated Answer:* She'll likely focus on shared frugality, bounded search, and rejection of optimization. She might argue both involve sequential search with a stopping rule based on *sufficiency* (cue discrimination = sufficient reason; meeting aspiration = sufficient outcome).
      *   **Follow-Up:** "But doesn't the *basis* for 'sufficiency' differ critically? Simon's aspiration level is inherently subjective and goal-derived ('good enough for *my* purpose'), while TTB's stopping rule is based on an objective (or learned) ecological property of the *cue* (its validity/discriminatory power). Doesn't this make TTB more like a fast, frugal form of *optimizing inference* within a specific cue structure, rather than a pure 'satisficing' process defined by subjective adequacy? Is TTB actually closer to a bounded form of *maximizing* on the most valid cue?"

  **Additional Questions to Broaden & Deepen:**

  4.  **Ecological Validity of Bias Demonstrations:** "The heuristics-and-biases (H&B) program often uses decontextualized lab tasks to demonstrate 'errors'. You argue these reflect the wrong normative standard. Beyond normative arguments, what's your strongest *empirical* case that these so-called 'biases' actually lead to *worse outcomes* in the real-world environments where the heuristics typically operate?"

  5.  **Teaching & Improving Decisions:** "If many 'biases' are ecologically rational, how should we approach *improving* human judgment? Does the FFH program primarily advocate teaching people *specific* fast-and-frugal heuristics for known environments, training meta-cognitive skills to better match heuristics to environments, or something else entirely? And how does this differ from H&B's approach of 'debiasing'?"

  6.  **Critique of H&B Methodology:** "Beyond normative standards, what's your most fundamental *methodological* critique of how the H&B tradition typically identifies and studies 'heuristics'? Do you think they mischaracterize the processes people actually use?"

  7.  **The Role of Computation & Deliberation:** "FFH celebrates fast, intuitive processes. But Simon also acknowledged the role of deliberate, computational problem-solving within bounds. In the FFH framework, when *is* deliberate computation justified? How do you delineate the boundary where 'less' stops being 'more'?"

  8.  **Evolution & Development:** "How does the adaptive toolbox perspective explain the *origin* of heuristics? Are they primarily evolved adaptations, learned cultural tools, individually developed strategies, or some mix? What does this imply about their universality vs. domain/cultural specificity?"

  **Closing Question (Settling the Dispute):**

  9.  **The Decisive Test:** "The debate often centers on normative standards – H&B's coherence/rational actor vs. FFH's ecological rationality. But let's imagine we could design the perfect study. What *concrete, observable finding* – not about which standard is 'right', but about actual decision *performance* or cognitive *process* – would genuinely settle the core dispute in favor of the FFH perspective for you? Conversely, what finding would make you seriously reconsider your position against the H&B view? (For example, consistent findings that specific 'biases' demonstrably *improve* outcomes across diverse ecologies, or evidence that people reliably default to computationally intensive strategies *without* performance loss in simple FFH-friendly tasks?)"

  **Key Design Choices:**

  *   **Specificity:** Questions directly target your requested areas (generalization, selection, TTB vs. satisficing) with clear, pointed language.
  *   **Follow-Ups:** Each core question has a follow-up designed to anticipate and push back on the most likely defense, forcing deeper engagement (e.g., on learning costs for selection, asymmetry in generalization evidence, and the fundamental difference in stopping rules).
  *   **Beyond Restatement:** Questions 4, 5, 6, 7, and 8 prevent simple restatement of the adaptive toolbox by focusing on implications (teaching, improvement), critiques (methodology), boundaries (computation), and origins (evolution).
  *   **Decisive Closing:** Question 9 explicitly moves beyond normative preferences ("which standard is right") to demand consideration of what *empirical evidence* would actually resolve the core disagreement about performance and process, forcing a falsifiable claim. It asks for evidence *both* for FFH and *against* it.
  *   **Flow:** Starts with the core conceptual challenges, broadens to implications and critiques, and ends with the decisive question.

  This set should provoke a rich discussion that moves beyond textbook descriptions of FFH and directly engages the tensions and controversies within the field. Good luck with the interview!
