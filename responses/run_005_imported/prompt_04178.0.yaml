  ### Reasoning by Tier
  **S-Tier (Most Defensible):**  
  `[6]` addresses the *root cause* rather than symptoms. Historical hiring data often encodes past biases (e.g., underrepresentation of certain groups). Auditing labels ensures the model learns true merit signals, making downstream fairness metrics more meaningful. This is proactive, legally safe, and aligns with research showing label quality dictates fairness attainability.

  **A-Tier (Strongly Defensible):**  
  `[5]` acknowledges trade-offs transparently. Reporting calibration, FNR/FPR, and impact ratios equips reviewers to weigh context (e.g., role criticality, diversity goals). Delegation accepts that rigid algorithms can't resolve value judgments. `[7]` mathematically operationalizes the fairness impossibility via Bayesian-optimal thresholds (e.g., varying thresholds by group to balance FNR/calibration). Though complex, it directly confronts the base-rate dilemma.

  **B-Tier (Contextually Defensible):**  
  `[1]` ("equal opportunity") is ethically compelling when false rejections are high-stakes (e.g., systemic exclusion). However, it may exacerbate skill mismatches if base-rate differences exist. `[4]` (individual fairness) avoids group stereotypes but requires meticulously defined similarity metrics—challenging for resumes where "merit" is multi-dimensional and subjective.

  **C-Tier (Legally Compliant but Insufficient):**  
  `[2]` (calibration) ensures scores predict similarly across groups but risks cementing disparities if historical outcomes were biased (e.g., lower precision for underrepresented groups). `[3]` meets legal requirements but ignores deeper fairness concerns, leaving the model vulnerable to criticism if disparities manifest post-hire.

  **D-Tier (Not Included):**  
  No option is entirely indefensible, but `[3]` without complementary actions would rank lowest if ethical rigor is prioritized. The empty D-tier reflects that all strategies have *some* merit.

  ### Key Considerations for Your Context
  - **Cost Asymmetry:** Since false rejections (denying opportunity) likely outweigh false advancements (training costs), `[1]` gains ethical weight.  
  - **Operational Risk:** `[7]` and `[4]` may face implementation challenges; `[5]` and `[6]` are more scalable.  
  - **Leadership Clarity:** Combine **S-tier (6)** with **A-tier (5)** for a compelling narrative: *"We’re fixing foundational data issues while empowering humans to interpret nuanced trade-offs."* This demonstrates proactive ethics beyond compliance.
