prompt: |-
  So in my experimental philosophy seminar this week we spent basically the whole class on Knobe's chairman/environment case (the one where the CEO says "I don't care about the environment, I just want profits" and then greenlights a program that either helps or harms it as a side effect), and my prof kept hammering on how wild it is that like 80-something percent of people say he harmed the environment "intentionally" but only 20-something percent say he helped it "on purpose," even though his stated attitude is literally identical in both versions. We also briefly went over Machery's "trade-off" alternative to Knobe's own moral-bias explanation (something about how it's really about whether the agent accepted a cost to get what they wanted, not the moral valence per se), which I actually found more convincing than the standard story, but either way the asymmetry itself is what stuck with me. A few of us were riffing after class about how this basically means a boss can never get credit for anything but will get blamed for everything, and I think theres a genuinely funny joke buried in there that none of us could quite land.

  Could you write me a short joke (like a two-to-four line bit, it doesn't need to be a classic setup/punchline thing) about the Knobe effect that people who've actually studied this would find funny because it turns on the real asymmetry, not just a generic "philosophers are dorks" or "corporations are evil" joke? Basically someone should only really get why it's funny if they already understand why we're so quick to call the harm intentional and so reluctant to call the help intentional.
