answer: |-
  Here's a joke capturing the Knobe asymmetry, relying on the core cognitive quirk:

  > **CEO to Philosopher:** "Look, when the program *harmed* the environment, you all said I did it *intentionally*. When the *identical* program *helped* the environment, you said I didn't do it *on purpose*. How is that fair? My attitude was the same both times!"
  >
  > **Philosopher:** "Exactly. That's why you get the blame for the harm. But credit for the help? Sir, that was just... *accidentally adjacent*."

  **Why it works for the initiated:**

  1.  **Core Asymmetry:** It directly states the contradictory judgments about intentionality ("intentionally" vs. "not on purpose") based on outcome (harm vs. help) despite identical stated attitude ("My attitude was the same both times!").
  2.  **CEO's Confusion:** The CEO's protest highlights the apparent irrationality that makes the effect so striking and philosophically interesting.
  3.  **"Accidentally Adjacent":** This punchline:
      *   Paraphrases the "side effect" nature of the help scenario.
      *   Captures the *reluctance* to attribute intentionality to the positive outcome. It implies the help wasn't just unintended, it was barely even *connected* to the CEO's actions in our minds, emphasizing the asymmetry.
      *   Avoids simple moralizing ("corporations are evil") or generic jokes ("philosophers are dorks"). The humor *is* the asymmetry itself and the CEO's (understandable) frustration with it.
      *   Uses terminology ("adjacent") vaguely reminiscent of the philosophical discussion about descriptions and side effects.

  The joke lands because it succinctly dramatizes the very phenomenon under discussion – the CEO experiences the bewildering asymmetry of folk psychology firsthand. Only someone familiar with Knobe's findings will fully grasp why the CEO's protest is both valid *and* why the Philosopher's response reflects the actual experimental data.
