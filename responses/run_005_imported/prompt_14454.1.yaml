prompt: |-
  Okay so this has been bugging me since Labor Day, when basically my whole family was over at my place. My uncle Gary smoked something like a pack a day for almost twenty years, quit cold turkey back in 2017, and now every single time he catches me vaping he goes off about how disgusting it is and how I'm gonna regret it. My sister backed me up and said Gary's kind of a hypocrite and doesn't really have any right to lecture anyone about nicotine given his own history, which is basically what I always assumed too - like, if you did the thing yourself, you loose your right to judge someone else for doing it. But Gary's comeback actually threw me off. He said quitting doesn't cancel his right to say anything, if anything it gives him MORE of a right, because he knows from the inside exactly how the addiction talks you into "just one more" and every little lie you tell yourself along the way, in a way somebody who never smoked simply couldn't. And he's not even fully done with it either, he still buys a vape when he's really stressed, which my sister says makes his whole "I've been there" thing even more hollow, but Gary insists that's actually WHY he still gets it, not a reason to tune him out.

  Me and my friends argued about this for like an hour last weekend and never landed anywhere, so now I'm curious what an outside person thinks. Does the fact that Gary did, and still sometimes does, the exact thing he's judging me for actually cancel out his right to say anything about it, or does having lived through it (and mostly, if not fully, come out the other side) put him in a stronger position to speak, not a weaker one? And separately from all that - even if my sister's completely right that he's being a hypocrite with zero business lecturing anyone, does that actually mean he's WRONG that vaping's bad for me, or are "does he get to say this" and "is he actually correct" just two totally different questions that feel like the same argument in the moment? I don't have any background in this kind of stuff, I just can't drop it, so I'd love a real answer that digs into the logic instead of just telling me to go easy on my uncle.
