  I should check the key points from both sides. Maynard Smith: arbitrariness (codon assignments aren't physically necessary), selected machinery (ribosomes, tRNA evolved to interpret the code). Sarkar/Griffiths: arbitrariness isn't sufficient; many causal relations are arbitrary without being semantic. Also, cytoplasmic cues can be equally arbitrary and selected, e.g., in epigenetics or symbiosis.

