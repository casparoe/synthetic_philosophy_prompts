prompt: |-
  Hey, I need a dialogue for my phil of bio seminar and figured I'd get a fresh one instead of reusing the one I always use. Can you write a dialogue between two grad students arguing about whether DNA is *literally* a code carrying semantic information, or whether "code" and "information" talk there is just a convenient metaphor.

  One character should take something like the Maynard Smith line: the codon-to-amino-acid mapping is arbitrary -- theres no physical necessity fixing which codon goes with which amino acid -- and that arbitrariness is exactly what you'd expect from a real code rather than a mere causal correlation. Combine that with the fact that the mapping gets read by translation machinery that was shaped by selection specifically to respond to it, and you get genuine semantic content, unlike say temperature effects on development.

  The other character should take the deflationary line associated with people like Sarkar and the Griffiths/Gray developmental-systems crowd: that "arbitrariness" alone doesn't get you semantic content (plenty of ordinary contingent causal relations are arbitrary in that sense without being meaningful), and that once you're careful about which notion of information is doing the work, cytoplasmic and environmental factors satisfy the same criteria DNA does -- so singling out DNA as "the" carrier of developmental information is unprincipled (the parity thesis).

  I want real back and forth here, not two people talking past each other -- the code-realist needs an actual answer to the parity challenge, and the deflationist needs an actual answer to the "arbitrary but selected-to-be-read" argument, not just a restatement of their opening position. Neither should be a pushover. Something like 10-16 turns total feels about right.
