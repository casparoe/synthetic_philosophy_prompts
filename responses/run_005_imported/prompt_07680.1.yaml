  Need to avoid making either a pushover. So, each should have strong rebuttals. For example, when Alex says the genetic code is universal and digital, Jordan could point out that not all codes are universal (mitochondrial differences) and that digital vs analog is a red herring. Then Alex might clarify that the systematic mapping is key.

  Also, addressing the "semantic content" aspect. Jordan might argue that meaning requires intentionality, which biology lacks. Alex could counter that biological functions, shaped by selection, provide a naturalized version of meaning.

