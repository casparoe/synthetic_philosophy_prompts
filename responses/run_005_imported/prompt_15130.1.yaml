answer: |-
  You've hit the philosophical core of time-travel fiction. Your friend is right to push you, as the model you choose fundamentally shapes your protagonist's struggle, the stakes, and the emotional payoff. Let's break down the implications for your two key dramatic concerns – **Free Will** and **Identity Continuity** – across the main models:

  **1. Strictly Fixed Timeline (Novikov/Lewis Self-Consistency):**
      *   **Mechanism:** The past is immutable. Every action the protagonist takes *was always part of the past*. She arrives *because* she always arrived. Her attempts to change things *are* the causes of the events she remembers. Paradoxes are logically impossible; the timeline loops seamlessly.
      *   **Free Will Implications (Cost/Preserve):**
          *   **Cost:** **Radically Undermines Libertarian Free Will.** Her choices are predetermined by the loop. "She can prevent the accident" is *false* relative to the fixed past/future. Her sense of agency is an illusion within her personal time. Her struggle becomes tragic *futility* – she *must* act out the script, even if she doesn't know it yet. The drama shifts from "can she change it?" to "*how* does it happen?" and "how does she *cope* with realizing her actions are predetermined?"
          *   **Preserve:** **Compatibilist Free Will / Agency-as-Experience.** Lewis's framework shines here. Within her *personal timeline* (the sequence of her experiences), she makes choices based on reasons, desires, and information available *to her*. She *feels* free, deliberates, acts, and experiences consequences. The drama lies in *her lived experience* of making choices, even if, from the external timeline's view, the outcome was fixed. Her "freedom" is the freedom of a character in a story whose ending is written – she still must *live* it.
      *   **Identity Continuity Implications (Cost/Preserve):**
          *   **Preserve:** **Strong Identity Continuity.** This model offers the *clearest* defense of sameness. There is only one timeline and one physical body. The consciousness inhabiting the young body *is* the future consciousness, experiencing events out of sequence. The "her" who arrives is the *same person* as the "her" who left, just displaced. When the loop closes, she reintegrates seamlessly (if she returns). Her memories and psychological continuity are maintained within the loop. The reader has followed *one* person on a non-linear journey.
          *   **Cost:** **Potential for Identity Dissolution Through Determinism.** If the realization of utter predetermination is shattering, her *sense* of self – as an autonomous agent – might fracture, even if the metaphysical identity remains constant. She might feel like a puppet, eroding her psychological continuity from the reader's perspective.

  **2. Branching Multiverse (Many Worlds/Alternative Timelines):**
      *   **Mechanism:** Every significant choice or change creates a new, separate timeline. The protagonist leaves her original timeline (T1) behind and enters a new one (T2) when she arrives in the past. Changing events in T2's past creates T3, and so on. The original timeline (T1) remains unchanged.
      *   **Free Will Implications (Cost/Preserve):**
          *   **Preserve:** **Robust Libertarian Free Will (in the new timeline).** In the timeline she *creates* by her arrival (T2), her actions have genuine, novel consequences. "She can prevent the accident (in T2)" is true. She has the power to change the course of events *in this new world*. The drama is about choice, consequence, and creating a better (or worse) future *here*.
          *   **Cost:** **Irrelevance to Original Timeline & Potential Meaninglessness.** The biggest dramatic cost: **She abandons the original "her" (T1-Her) and everyone she knew in T1.** T1 remains broken. Her journey isn't about fixing *her* past, but about creating a *new* life in a new universe. The stakes for *T1-Her* vanish. Furthermore, if branching happens constantly, choices might feel less significant ("Oh well, another branch").
      *   **Identity Continuity Implications (Cost/Preserve):**
          *   **Cost:** **Severed Identity with T1-Her.** The "her" who arrives in the past is a copy or transplant from T1. The T1-Her who initiated the jump is either dead, stuck, or continues in T1, forever separated. The protagonist in T2 is *psychologically continuous* with T1-Her *up to the moment of the jump*, but she is now a distinct entity in a distinct timeline. By the time the loop "closes" (if it even applies – she might just live linearly in T2), she is fundamentally *not* the same person who started the journey *in T1*. The reader followed T1-Her for 200 pages, only to see her consciousness effectively abandon that self/world.
          *   **Preserve:** **Continuity of Consciousness Stream (within the branch).** Within the new timeline (T2), her stream of consciousness continues unbroken from the moment of arrival. She *feels* like herself, remembers her past (T1's past and her personal jump), and builds a future in T2. She *is* the same person *within T2* from arrival onward.

  **3. Hybrid/Modified Models (Seeking a Middle Ground):**

  *   **Limited Branching / "Wrinkles" but Core Fixed:** Some events are fixed points, others can be altered within limits, or alterations cause instability that forces correction back to the main timeline. (e.g., *Time Traveler's Wife*, some *Doctor Who*).
      *   *Free Will:* Partial agency. She can change *some* things, but core events (the accident? her jump?) resist change. Drama comes from discovering *what* is mutable vs. immutable.
      *   *Identity:* Generally preserves continuity if the "core loop" holds and she returns to her origin point. Changes might create dissonance (false memories, subtle shifts).
  *   **Meta-Time / Authorial Time:** The timeline isn't fixed until the loop completes. Her actions *create* the fixed past as she acts. It's fixed only in retrospect. (Lewis flirts with this; used in some fiction).
      *   *Free Will:* Strong agency *during* the trip. Her choices *define* what the past always was. "She can prevent the accident" is true *until she fails to prevent it*, at which point it becomes false (it was always going to happen *because* she failed). High tension, but logically tricky.
      *   *Identity:* Preserves continuity well. It's still one timeline being defined. She's the same agent shaping her own history.
  *   **Consciousness Overwrite with Integration:** Her future consciousness merges with/influences her past self, but the past self's experiences also shape the future consciousness during the jump. The "loop" involves mutual influence. (More common in reincarnation/body-swap than pure TT).
      *   *Free Will:* Blurs the lines. The acting agent is a fusion, making choices influenced by future knowledge but filtered through the younger self's psyche/context.
      *   *Identity:* Strong psychological continuity, but the "her" during the jump is arguably a new, fused entity distinct from both pure past and pure future selves. Closing the loop might mean reintegrating this fused experience.

  **Recommendation for Your Dramatic Concerns & Avoiding Corners:**

  1.  **Stick with Fixed (But Leverage Lewis Hard):** Given your draft and core concerns, **the Fixed Timeline is likely the most defensible and dramatically coherent choice for preserving *Identity Continuity* and exploring a specific, powerful type of "freedom."** However, you *must* lean into Lewis to make the Free Will aspect dramatically satisfying:
      *   **Embrace the Tragedy/Beauty of Inevitability:** The drama isn't *if* she changes things, but *how* her desperate attempts to change them *become* the very causes of the events she fears. This is rich ground for irony, revelation, and profound character development. Her "freedom" is the agonizing freedom to *discover* and *accept* (or rage against) her role in the tapestry. (Think *Oedipus Rex*, not *Back to the Future*).
      *   **Focus on Personal Time:** Show her *experience* of choice, deliberation, hope, and despair *as it happens to her*. The reader should feel the weight of her decisions *with her*, even if they (and eventually she) understand they were necessary. Lewis gives you the language: "Relative to the facts of her current situation in personal time, she *can* choose X or Y. Relative to the fixed external timeline, only one *was* chosen."
      *   **Make the Closure of the Loop Meaningful:** How does the knowledge of predetermination change her *after* she returns? Does she find peace in the pattern? Does she feel hollow? Does understanding *how* she caused the past events offer a perverse form of closure? Her identity remains intact, but her *understanding* of herself is transformed.

  2.  **Why Branching is Riskier for Your Goals:**
      *   **Identity:** The clean severing from T1-Her is hard to square with the reader's investment in *that specific person* overcoming *her specific past*. It can feel like a bait-and-switch.
      *   **Stakes:** The original tragedy remains untouched. Her victory in T2 is bittersweet at best, nihilistic at worst, for T1.
      *   **Free Will Gain, Thematic Cost:** While it grants full agency, it sacrifices the unique philosophical tension and identity continuity you seem drawn to.

  3.  **If You Need More Agency, Consider Hybrids Carefully:**
      *   **Meta-Time:** Offers the most agency while still preserving identity and a single timeline. It's complex but can work if you clearly show the past solidifying *because* of her actions.
      *   **Limited Branching/Fixed Points:** Use sparingly. Maybe the *method* of the accident can change, but not its occurrence? Or her attempts to prevent it cause *different* but equally significant traumas? This preserves the core tragic structure but allows *some* variation. Ensure the fixed points are thematically relevant (e.g., the accident must happen to forge the person who eventually builds/jumps with the machine).

  **Key Questions for Your Draft's Back Half (Fixed Timeline Focus):**

  *   **The Revelation:** How and when does your protagonist realize her actions are part of the fixed past? Is it gradual dawning horror, or a single shattering moment? This is your climax's emotional core.
  *   **The Necessary Action:** What specific action does she take, thinking it will prevent the accident, that *actually causes it* (or a crucial step leading to it)? This needs to be plausible, deeply ironic, and emotionally resonant.
  *   **The Return & Aftermath:** How does the knowledge of her own complicity change her *after* she returns to her original time? Does it break her, or does she find a way to integrate this knowledge? How does it reframe the first 200 pages for the reader?
  *   **Motivation Persistence:** Why does she *keep trying* even as evidence mounts that change is impossible? Desperation? Hope as a biological imperative? A misinterpretation of events? This drive is crucial for maintaining tension.

  **Conclusion:** The Fixed Timeline model, rigorously applied using Lewis's framework (personal time vs. external time, relativized abilities), is **philosophically defensible** and **dramatically potent** for your core concerns. It preserves **Identity Continuity** absolutely and redefines "Free Will" as the **agonizing, experienced agency within a predetermined loop**. The cost is the loss of *outcome-altering* freedom, but that loss *is* the source of its unique tragic power. Leaning into this, rather than fighting it, will give your novel a coherent, memorable, and philosophically rich conclusion. Defend this choice to your friend – the drama lies precisely in the *tension* between personal agency and external determinism that Lewis articulates so well. Write the hell out of that realization scene.
