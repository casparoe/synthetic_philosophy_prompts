  First, I need to recall Hobbes's key concepts. The condemned man example is crucial. Hobbes says even someone sentenced to death can resist because self-preservation is an inalienable right. But AIs aren't natural persons. They're artificial, created by humans for protection. So, the covenant applies only to humans who transfer their rights to the sovereign.

