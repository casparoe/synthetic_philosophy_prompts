prompt: |-
  I'm a second-year philosophy PhD student currently drafting a seminar paper on triviality results for indicative conditionals, and there is one issue I keep getting stuck on that I would like to work through properly rather than take on authority. Ernest Adams's original probabilistic account of indicative conditionals held, in a fairly modest and restricted way, that the assertability of a simple conditional "if A, then C" tracks the conditional probability P(C|A); crucially, Adams never committed himself to the claim that such conditionals express propositions with stable, context-independent truth conditions, and he explicitly confined the thesis to simple, non-embedded occurrences. Robert Stalnaker, by contrast, offered a genuinely truth-conditional semantics for conditionals, built around a selection function over possible worlds, and maintained that the resulting propositions should still satisfy essentially the same equation between a conditional's probability and the corresponding conditional probability — with no comparable restriction against embedded or compound occurrences.

  David Lewis then showed, in "Probabilities of Conditionals and Conditional Probabilities" (1976) and its 1986 sequel, that no non-trivial proposition can have its probability equal to the relevant conditional probability across a sufficiently rich class of credence functions closed under conditionalization. My advisor mentioned, somewhat in passing, that this result is usually read as devastating for Stalnaker's project while leaving Adams comparatively unscathed, and that this asymmetry is a large part of why so many philosophers of language ended up gravitating toward non-truth-conditional or "suppositional" treatments of indicative "if." I would rather understand in detail why that asymmetry is supposed to hold than simply repeat it in my own paper without having worked it through myself.

  Could you compare Adams's and Stalnaker's theses closely enough to spell out exactly what each is, and is not, committed to; explain why Lewis's triviality result bears so differently on the two of them; and then tell me which of the two positions — Adams's restricted, non-propositional thesis, or Stalnaker's fully propositional one — you find more defensible once the triviality results are taken into account?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a second-year PhD student in philosophy, working on triviality results for indicative conditionals. Specifically, they're stuck on why Lewis's results affect Stalnaker more than Adams. They want a detailed comparison to really grasp the asymmetry, not just take it on authority. 

  First, I need to recall the core positions. Adams says the assertability of "if A, C" is tied to P(C|A), but he doesn't commit to conditionals having truth values. Stalnaker, on the other hand, proposes a truth-conditional account where the probability of the conditional equals P(C|A). Lewis's triviality proof shows that if conditionals have truth conditions and satisfy that equation, it leads to triviality—only possible in trivial probability spaces.

  The user's advisor mentioned that Lewis devastates Stalnaker but not Adams. Why? Adams avoids the problem because he doesn't assign truth conditions. His thesis is about assertability, not truth, so the conditional isn't a proposition that can be embedded. Lewis's proof relies on treating conditionals as propositions that can be embedded in logical operations. Adams restricts his account to simple conditionals, avoiding embeddings that Lewis exploits.

  The user wants to understand this asymmetry deeply. They might be preparing a seminar paper and need to explain why Adams's non-truth-conditional approach became popular post-Lewis. They probably need a clear breakdown of commitments: Stalnaker's truth conditions vs. Adams's assertability. Also, how Lewis's use of conditionalization and embeddings targets Stalnaker's framework.

  Then, the user asks which position is more defensible after triviality. Here, I should outline the trade-offs. Adams avoids triviality but sacrifices embeddings and compositionality. Stalnaker maintains truth conditions but must modify his system (like abandoning CCCP) or adopt a dynamic semantics. The user might be looking for a balanced view, noting that both have responses but with costs. 

  I should also consider their deeper needs. As a PhD student, they need to demonstrate a thorough understanding, not just a summary. They might want to engage with the literature critically, perhaps evaluating defenses like Stalnaker's bypassing or Adams's restrictiveness. They might also be interested in contemporary solutions like impossible worlds or probabilistic dynamic semantics.

  Finally, I need to ensure the explanation is clear without jargon overload. Break down the key steps of Lewis's proof, why it applies to Stalnaker, and why Adams is insulated. Highlight Adams's modesty vs. Stalnaker's ambition. Conclude by weighing the philosophical costs: Adams's limited scope vs. Stalnaker's adjustments. The user likely wants to form their own argument for the paper, so providing a foundation for their analysis is key.
answer: |-
  Here's a detailed comparison of Adams and Stalnaker, the impact of Lewis's triviality results, and a reasoned assessment of their relative defensibility:

  **1. Core Theses & Commitments:**

  *   **Ernest Adams (Probabilistic/Assertability Thesis):**
      *   **Core Claim:** The *assertability* (or acceptability) of a simple, non-embedded indicative conditional "If A, then C" is given by the speaker's conditional probability P(C|A).
      *   **Crucial Restrictions:**
          *   **Non-Propositional:** Adams explicitly avoids committing to the view that indicative conditionals express propositions with standard truth conditions. He is agnostic or skeptical about their truth-aptness.
          *   **Non-Embeddable:** His thesis applies *only* to "simple" occurrences – conditionals appearing as the main connective in an assertion. He does *not* provide a semantics for conditionals embedded under other operators (negation, conjunction, disjunction, other conditionals, belief operators, etc.).
          *   **Focus on Communication:** The account is fundamentally about communication norms (when is it rational to assert/accept a conditional?) rather than a compositional truth-conditional semantics.
      *   **Commitments:** Adams is committed to the idea that rational assertion of simple "If A, C" is governed by P(C|A). He is *not* committed to conditionals having truth values, nor to any specific semantic value for embedded occurrences.

  *   **Robert Stalnaker (Truth-Conditional Thesis + Probability Principle):**
      *   **Core Claim:**
          1.  **Truth Conditions:** An indicative conditional "If A, then C" expresses a proposition with specific truth conditions defined via a selection function over possible worlds: It is true (at world w) iff C is true in the world most similar to w where A is true (the "A-world most similar to w").
          2.  **Probability Principle (CCCP - Conditional Constraint on Conditional Probability):** The probability of the proposition expressed by "If A, then C" *is* equal to the conditional probability P(C|A). Formally: P(A → C) = P(C|A), whenever P(A) > 0.
      *   **Crucial Expansions:**
          *   **Propositional:** Conditionals *do* express genuine, context-independent propositions with truth conditions.
          *   **Embeddable:** Because they express propositions, indicative conditionals *can* coherently be embedded under other logical operators and attitude verbs. Stalnaker provides rules for their behavior in embeddings (e.g., negation, conjunction).
          *   **Compositional Semantics:** The account aims to be part of a full compositional truth-conditional semantics for natural language.
      *   **Commitments:** Stalnaker is committed to *both* the specific truth conditions *and* the principle that P(A → C) = P(C|A) must hold for rational agents across contexts where P(A) > 0. He is committed to conditionals being embeddable propositions.

  **2. Lewis's Triviality Results & The Asymmetric Impact:**

  *   **Lewis's Core Result (Simplified Outline):** Lewis proves that under seemingly weak and plausible assumptions (especially the ability to conditionalize credences and closure under conditionalization), the equation P(A → C) = P(C|A) (for all A, C, and all probability functions P in a sufficiently rich class) leads to triviality. Specifically, it implies that the probability space has at most *two* distinct possible worlds with non-zero probability that are not orthogonal in a specific way. This is wildly at odds with the richness we assume our epistemic states and the world have.
      *   **Key Mechanism:** Lewis considers a specific partition of possibilities and uses the probability equation applied to different conditional probabilities within this partition, leveraging the ability to conditionalize on different pieces of evidence. Embedding plays a crucial role in defining the partition or the propositions involved in the derivation. The derivation forces a contradiction unless the probability space is trivial.
      *   **The Assumptions:** The critical assumptions include:
          1.  Conditionals express propositions (have truth values).
          2.  The Equation: P(A → C) = P(C|A) whenever defined.
          3.  Closure under Conditionalization: If a probability function P is in the class, so is P(·|E) for any E with P(E) > 0.
          4.  Richness: The class of probability functions is rich enough to represent different possible dependencies between propositions (e.g., it contains functions where A and C are independent, positively correlated, and negatively correlated).

  *   **Why Devastating for Stalnaker:**
      1.  **Direct Hit on Core Commitments:** Lewis's proof directly targets the conjunction of Stalnaker's two core commitments: that conditionals are propositions *and* that they satisfy P(A → C) = P(C|A). The proof shows these two commitments, combined with standard assumptions about rational belief revision (conditionalization), are incompatible with non-trivial probability spaces.
      2.  **Embedding is Fatal:** The proof *relies* on considering the conditional embedded within probability assignments or within the logical structure of the proof itself (e.g., considering P((A → C) | B) or P((A → C) | ~B)). Stalnaker's commitment to conditionals being embeddable propositions is *essential* for setting up the derivation that leads to contradiction. Adams's restriction shields him from this move.
      3.  **No Room for Maneuver (Within Core Commitments):** Stalnaker cannot abandon the propositionality without abandoning his core semantic project. He *could* abandon the universal validity of CCCP (P(A → C) = P(C|A)), but this would be a massive retreat, undermining the key motivation and empirical adequacy (Ramsey Test intuition) of his semantics.

  *   **Why Adams is (Initially) Unscathed:**
      1.  **No Propositionality:** Lewis's Assumption 1 (conditionals express propositions) is explicitly *rejected* by Adams. Adams doesn't assign truth values to simple conditionals, so there *is no proposition* A → C whose probability P(A → C) could be equated with P(C|A) or embedded in other propositions. The equation Lewis attacks doesn't exist in Adams's framework.
      2.  **No Embedding:** Adams's thesis explicitly *avoids* providing a semantics for embedded conditionals. Lewis's proof crucially relies on embeddings (explicit or implicit). Adams's restriction blocks the application of the proof; there's no defined entity to embed or assign a probability to in the problematic ways Lewis requires.
      3.  **Focus on Assertability:** Adams's equation is between *assertability* and conditional probability, not between the *probability of a proposition* and conditional probability. Assertability is a pragmatic norm, not a semantic property of a proposition. Lewis's result is about the constraints on assigning probabilities to propositions.

  **3. Defensibility Post-Triviality: Adams vs. Stalnaker**

  Neither position emerges entirely unscathed, but the triviality results clearly impose a heavier burden on Stalnaker's ambitious truth-conditional project. Adams's modesty provides significant insulation.

  *   **Adams's Defensibility (Strengths):**
      *   **Avoids Triviality:** It straightforwardly avoids Lewis's result by denying its fundamental premise (propositionality).
      *   **Captures Core Intuition:** It perfectly captures the core Ramsey Test intuition that rational belief in/assertability of "If A, C" depends on P(C|A).
      *   **Empirical Adequacy (Simple Cases):** It handles simple, non-embedded conditionals well.
  *   **Adams's Defensibility (Weaknesses/Challenges):**
      *   **The Embedding Problem:** The major cost is the inability to handle embedded conditionals systematically. How *should* we understand "It's not the case that if A, C", "If A, then if B, C", "He believes that if A, C"? Adams offers no general semantic account. Proponents (e.g., Dorothy Edgington) develop complex, often non-compositional, pragmatic accounts for some embeddings, but this remains a significant theoretical burden and point of contention.
      *   **Compositionality:** The account struggles with the principle of compositionality – the meaning of complex sentences being built from the meanings of parts. If "if A, C" lacks a standard semantic value, how do we compositionally determine the meaning of sentences where it's embedded?
      *   **Truth-Aptness Intuitions:** There is a strong intuition that conditionals like "If it rains, the match will be canceled" *are* sometimes true or false, not merely assertable or not. Adams downplays or denies this intuition.

  *   **Stalnaker's Defensibility (Post-Triviality Responses & Weaknesses):**
      *   **Abandoning Universal CCCP:** Stalnaker's main response is to abandon the idea that P(A → C) = P(C|A) holds universally across all probability functions. He argues it holds only in *contexts* where the conditional is being *evaluated* or *asserted*, reflecting the agent's *current* epistemic state. The context changes upon learning new evidence (conditionalization), potentially changing the relevant selection function or making the original conditional undefined. This "contextualist" move blocks Lewis's derivation by denying that CCCP holds for the *same* conditional proposition relative to *different* probability functions (P and P(·|E)).
      *   **Bypassing the Equation:** Others (e.g., van Fraassen) propose semantics where CCCP holds by making the truth conditions of the conditional *depend* on the probability function itself. However, this makes the proposition expressed context-dependent in a very strong, non-Stalnakerian way.
      *   **Strengths of Response:** It preserves propositionality and embeddability. It offers a unified, compositional semantics. It captures truth-aptness intuitions.
      *   **Weaknesses of Response:**
          *   **Retreat from Original Ambition:** Giving up the universal, context-independent validity of P(A → C) = P(C|A) is a significant concession. The equation was a major selling point and source of empirical adequacy.
          *   **Complexity & Context-Dependence:** The contextualist response makes the semantics highly context-dependent and complex. Determining the truth conditions requires tracking the speaker's epistemic state and how it evolves.
          *   **Does it Fully Escape?** Some argue that even contextualized versions face new triviality challenges or struggle to handle all embeddings coherently within the probabilistic framework. The cost of maintaining propositionality + embeddability is a constant battle against triviality in new guises.

  **Conclusion: Which is More Defensible?**

  Once the full force of Lewis's triviality results is acknowledged, **Adams's restricted thesis is arguably the more immediately defensible position.** Its deliberate modesty – denying propositionality and restricting scope to simple conditionals – provides a direct and effective shield against the triviality proofs. It captures the core functional role of indicative conditionals in guiding thought and assertion under uncertainty without running afoul of Lewis's mathematical constraints.

  However, Adams's defensibility comes at the **significant cost of limited explanatory scope**, particularly regarding embedding and compositionality. This cost is substantial for a comprehensive semantic theory.

  Stalnaker's ambitious truth-conditional project is **far more vulnerable** to Lewis's results. While sophisticated contextualist or dynamic responses exist (e.g., Stalnaker's own later work, or developments like Gillies's "epistemic must"), they involve **major concessions** (abandoning universal CCCP) or **significant increases in complexity** (deep context-dependence, dynamic semantics). Maintaining propositionality and embeddability post-Lewis requires constant vigilance and often feels like patching holes in a dam.

  **Therefore:**

  1.  **For Robustness Against Triviality:** Adams wins decisively. His core thesis for simple conditionals remains intact.
  2.  **For Explanatory Scope & Semantic Ambition:** Stalnaker's framework has the potential to offer more, but at the cost of being perpetually embattled by probabilistic constraints and requiring complex maneuvers to avoid inconsistency. Its defensibility is more conditional and qualified.
  3.  **Overall Defensibility:** **Adams's position is more defensible *on its own, more modest terms*.** It achieves its limited goals without internal contradiction revealed by triviality proofs. Stalnaker's position remains a powerful and influential research program, but its defensibility relies on accepting significant modifications (like contextualism w.r.t. CCCP) that move it away from its original, elegant simplicity in response to Lewis. The choice often boils down to whether one prioritizes avoiding triviality and handling simple conditionals (favoring Adams/suppositionalism) or prioritizes a unified, compositional, truth-conditional account and is willing to pay the price in complexity and contextualism to handle embeddings (favoring modified Stalnakerian approaches or dynamic semantics).

  The gravitational pull towards suppositional theories stems directly from this asymmetry: Adams offers a stable, paradox-free account for the central case, while Stalnaker's elegant propositional account requires substantial and ongoing repair work to survive in a probabilistic landscape shaped by Lewis. Your advisor's point about this asymmetry driving philosophers towards suppositional theories is well-founded.
