   Example in software:

   Consider a system that processes user requests. There are two independent modules, Module A and Module B, each of which can process a request and produce an output. The system is designed to use the output of whichever module finishes first. However, if both modules are running, the system takes the first output and ignores the second.

   Now, suppose we have a request. Both modules start processing. Module A finishes first and its output is used. Module B is then ignored. However, we later discover that Module B had a bug and would have produced an incorrect output if it had been used.

   We ask: Did Module A cause the correct output?

   Counterfactual test:
     - Without Module A, what would have happened? The system would have used Module B's output, which was incorrect. So the correct output would not have occurred without A. Therefore, by counterfactual test, A caused the correct output.

   But now consider: what if we intervene on Module A? We set Module A to not run (or to produce an incorrect output). Then the system would use Module B and we get an incorrect output. So intervening on A changes the output. Thus, the interventionist also says A caused the correct output.

   This example doesn't show a divergence.

   We need a case of overdetermination where both causes are sufficient and both are present, but the counterfactual test fails because without one, the other would have produced the same effect.

