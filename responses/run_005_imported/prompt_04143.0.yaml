prompt: |-
  So I've been messing around with Judea Pearl's do-calculus stuff for causal inference at work, and it sent me down a rabbit hole into the philosophy behind it. Seems like theres a whole fight between the 'counterfactual' theory of causation (roughly: C caused E iff E wouldn't have happened without C) and the 'interventionist' theory (C caused E iff surgically intervening on C changes E, holding everything else fixed appropriately). Apparently the two come apart in cases where theres some backup cause lurking around ready to produce the same effect anyway, like a backup shooter or two people throwing rocks at a bottle at the same time. Can you invent a fresh example of that kind of setup -- not those two, and feel free to set it in a software/systems context if that's easier -- where the plain counterfactual test gives the wrong verdict about what actually caused the outcome, but the intervention-based approach still gets it right? Walk me through exactly why the two diverge on your example.
