  We are looking for a scenario where the counterfactual test (C caused E iff E wouldn't have happened without C) fails, but an interventionist approach (changing C while appropriately holding other things fixed changes E) gives the correct causal verdict.

   The classic problem with the counterfactual account is in cases of overdetermination (like two sufficient causes both present). We want a new example, preferably in a software/systems context.

   Idea: Consider a distributed system with two redundant services that can both perform the same critical function (e.g., sending a notification). The system is designed so that if one service fails, the other takes over. We have an event where both services are triggered and both would have sent the notification. However, due to a bug, one of the services actually fails to send, but the other succeeds. We want to know: did the failure of the first service cause the notification to be sent? (Wait, that doesn't sound right. Let's reframe.)

