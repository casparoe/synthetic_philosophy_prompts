prompt: |-
  Quick one — I'm doing the vagueness unit in my seminar this week and want to get a crisper handle on something before I teach it. Everyone presents the epistemicism/supervaluationism split as just "sharp boundary you cant know" vs "no sharp boundary, only precisifications" and leaves it there, which I think hides where the real disagreement is. What I actually want is the gut-level reason higher-order vagueness is supposed to be so much cheaper for Williamson than for the supervaluationists — why doesn't "admissible precisification" just need its own supervaluation the same way "heap" does, and why can epistemicism stack unknown sharp cutoffs on unknown sharp cutoffs forever for free, while stacking precisifications on precisifications actually costs Fine and Keefe something? Don't just define the terms for me — I want the structural reason one regress is cheap and the other isn't.
reasoning: |-
  Okay, the user is diving into the vagueness debate, specifically why higher-order vagueness is handled differently in epistemicism versus supervaluationism. They teach a seminar and feel the standard split oversimplifies the core disagreement. They want the structural reason why epistemicism can handle the regress of unknown boundaries easily, while supervaluationists struggle with "admissible precisification" regresses.

  First, I need to recall the basics. Epistemicism, like Williamson's, says vague predicates have sharp boundaries, but we can't know them. Supervaluationism (Fine, Keefe) avoids sharp boundaries via precisifications. Higher-order vagueness questions vagueness in the boundary itself. The user's real question: why is infinite regress "cheap" for epistemicists but costly for supervaluationists?

  Epistemicism's foundation is classical logic with sharp cutoffs. Each boundary is just another fact we're ignorant about. The framework already assumes bivalence and omniscient truth, so adding layers of ignorance doesn't change the ontology—it's just more unknowns. The regress is epistemological, not ontological, so it doesn't require new machinery. Williamson's model is built to stack unknowns infinitely without added cost.

  Supervaluationism, however, relies on precisifications to define truth. First-order precisifications handle the predicate's vagueness, but "admissibility" itself is vague. If they need a meta-supervaluation for admissibility, that introduces a new set of precisifications, each needing their own admissibility criteria, leading to a vicious regress. Each level adds ontological complexity—more sets of precisifications—which undermines their goal of eliminating sharp boundaries. Fine and Keefe must either accept this regress (costly) or find a way to halt it, like primitive admissibility, which seems arbitrary.

  The user probably wants to highlight this structural difference: epistemicism's regress is within an existing framework (ignorance stacking), while supervaluationism's regress creates new ontological layers. The cost is ontological for supervaluationists but merely epistemological for epistemicists. That's why Williamson can "stack cutoffs for free" while supervaluationists pay with complexity or theoretical compromises.

  Also, the user might be preparing to discuss why higher-order vagueness challenges supervaluationism more, pointing to its foundational aims. They need to convey this in class without getting bogged down in definitions. Emphasizing the difference between ignorance-based and structure-based regresses should clarify the "gut-level" reason for the disparity.
answer: |-
  You're absolutely right—the standard presentation masks the deeper structural asymmetry. Here's the gut-level reason why higher-order vagueness (HOV) is ontologically "cheap" for Williamson (epistemicism) but ontologically *costly* for Fine/Keefe (supervaluationism), focusing on the nature of the regress:

  1.  **Epistemicism's Regress is Purely *Epistemological* (Cheap):**
      *   **Core Ontology:** There is exactly *one* precise world with sharp boundaries for all predicates (e.g., a specific number `n` is the cutoff for "heap").
      *   **First-Order Ignorance:** We don't know *where* that boundary `n` is for "heap".
      *   **Higher-Order Ignorance (HOV):** The *concept* "knows where the boundary is" itself has a sharp boundary we don't know. There's a precise point `m` where statements like "X knows the heap-boundary" switch from true to false. We don't know `m`.
      *   **Why it's Cheap:** Adding a layer of HOV **doesn't change the underlying ontology.** The world is still just that single precise world. Each new layer of vagueness simply adds *another fact about our ignorance* concerning where a sharp boundary lies *within that same world*. Williamson's framework is *built* to accommodate infinite, nested ignorance about precise facts. Stacking "unknown sharp cutoffs" is just adding more entries to the list of things we don't know in an already bivalent, precise world. It's an *epistemological* regress within a *fixed*, simple ontology. No new *kinds* of entities (like precisifications) are introduced.

  2.  **Supervaluationism's Regress is *Ontological* (Costly):**
      *   **Core Ontology:** Truth is defined relative to a *set* of admissible precisifications (ways of making "heap" precise). There is *no* single sharp boundary in reality.
      *   **First-Order Machinery:** We need this set `S1` of precisifications to define truth for "heap" (supertruth = true on *all* `S1`).
      *   **The Problem of Admissibility:** What makes a precisification "admissible"? This notion ("fits usage," "preserves penumbral connections") is *itself vague*. There's no sharp boundary to the set `S1`.
      *   **Attempted Solution (The Costly Move):** To handle the vagueness of "admissible," the supervaluationist might propose a *meta*-supervaluation. Define a *second-order* set `S2` of precisifications *of the concept "admissible precisification for 'heap'"*. Super-truth about admissibility would then be truth on *all* `S2`.
      *   **Why it's Costly:**
          *   **Ontological Bloat:** Each new layer of HOV requires introducing a **new, distinct set of precisifications** (`S2`, `S3`, etc.). This explodes the ontology. We no longer have just one set `S1` defining "heap," but a tower of sets defining admissibility for the set below.
          *   **Regress of Machinery:** The machinery used to solve first-order vagueness (a set of precisifications with supertruth) must be **replicated at every higher level** to handle the vagueness *of the previous level's key notion* (admissibility). This isn't just adding ignorance; it's adding complex *structure*.
          *   **Threat to the Core Motivation:** Supervaluationism's main selling point is eliminating sharp boundaries in reality. But if `S1` has a sharp boundary defined by `S2`, and `S2` has a sharp boundary defined by `S3`, etc., then *sharp boundaries reappear at the meta-levels*. The view struggles to *genuinely* eliminate sharp boundaries; it just pushes them up a level. Accepting an infinite tower of precisification sets feels like a surrender, contradicting the desire for a clean, boundary-free account.
          *   **The "Free Lunch" Ends:** Defining first-order truth via `S1` is the core move. Defining *which precisifications belong in `S1`* using `S2` is an *additional*, costly theoretical commitment requiring its *own* complex apparatus. It's not free; it's building a whole new floor on the tower.

  **The Structural Asymmetry in a Nutshell:**

  *   **Epistemicism:** Regress = Stacking **ignorance claims** (about precise boundaries) within a **single, fixed, precise ontology**. Cost: More things we don't know. Framework handles this natively.
  *   **Supervaluationism:** Regress = Stacking **ontological layers** (sets of precisifications defining the admissibility of the sets below). Cost: Exploding ontology, replication of complex machinery, potential reintroduction of sharp boundaries at meta-levels, deviation from the core motivation.

  **Why Fine/Keefe Can't Just Say "Admissibility is Primitive":**

  They *could*, but this is where the cost becomes apparent. Halting the regress by declaring "admissible" primitive (or vague but not further analysable) means:

  1.  **They accept a fundamental, unanalyzable vagueness "in the world."** This clashes with the supervaluationist ambition to *reduce* vagueness to precise machinery (sets of precisifications + supertruth).
  2.  **It makes the set `S1` itself vaguely defined.** But supervaluationism relies on `S1` being a well-defined set to *define* supertruth. If `S1` is vague, how can it precisely determine the extension of "heap"? This undermines the formal elegance and precision that is a major attraction of supervaluationism.
  3.  **It looks suspiciously like epistemicism about "admissibility".** If "admissible" has a sharp boundary we can't know (but is primitive), haven't they just relocated the epistemicist's problem to the meta-level?

  **Conclusion:**

  The "cheapness" for Williamson stems from HOV being purely *about our knowledge* of an underlying reality that remains simple and precise. The "costliness" for Fine/Keefe stems from HOV requiring them to *multiply the complex ontological structures* (sets of precisifications) that define their core notion of truth. One regress stays within epistemology; the other forces an ontological explosion. *That's* the structural heart of the asymmetry you want to highlight. Epistemicism absorbs the regress as ignorance; supervaluationism is forced to replicate its core machinery endlessly.
