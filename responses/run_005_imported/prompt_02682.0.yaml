answer: |-
  Here's a dialogue between two political philosophers, **Professor Aris Thorne** (defending "All Affected Interests") and **Dr. Lena Bell** (defending "All Subjected"), debating a fictional referendum with cross-border consequences. They're grabbing coffee after a seminar:

  **Setting:** A bustling university common room, referendum posters for "Riverton Dam Project - Vote YES for Clean Energy!" visible outside the window. Riverton shares a river border with Oakley.

  **(Aris Thorne stirs his coffee, gesturing towards the posters)**
  **Aris:** Lena, see that referendum? Riverton votes on damming the Silver River. Clean energy, jobs, fantastic! Except... the reservoir floods prime farmland *in Oakley*. Thousands of Oakleyans lose livelihoods. Yet only Rivertonians vote. How is *that* democratic? Classic boundary problem. The "All Affected Interests" principle screams injustice here. Anyone significantly impacted *must* have a say. Oakleyans are stakeholders whether Riverton likes it or not.

  **Lena Bell:** (Leans forward, frowning) Aris, your principle sounds compassionate, but it’s a recipe for democratic paralysis. *Define* "significantly impacted." Does a farmer downstream in Oakley whose irrigation costs rise count? A Riverton shop owner whose taxes fund the dam? An environmentalist in another country worried about migratory fish? Your net is infinitely wide! Democracy requires a *demos*, a bounded group capable of collective action. The "All Subjected" principle provides that: only those **directly bound by the coercive power of the resulting law** should vote. Oakleyans aren’t subject to Riverton’s dam laws; they’re subject to *Oakley’s* laws, even if affected.

  **Aris:** Paralysis? No, we draw practical lines! Significant impact means demonstrable, substantial harm or benefit. The flooded Oakley farmers? Clear harm. The downstream irrigation? Quantifiable cost increase – significant. The distant environmentalist? Less direct, maybe consultative input, not a vote. We *can* define this! Your "subjected" principle is arbitrary. *Why* is being coerced by a *specific law* the magic line? What if the dam pollutes Oakley's water? Riverton law doesn't coerce Oakleyans to *drink* poison, but they suffer! They’re subjected to harm, just not *legal* coercion. Isn’t that just as morally relevant?

  **Lena:** Harm isn't the same as subjection to authority, Aris! My local bakery suffers if I buy bread elsewhere, but they don’t get a vote in my household budget! Democracy is about self-government within a **political community**, bound by shared rules and enforcement. Oakleyans aren't part of Riverton's political community. They don't pay Riverton taxes, can't be fined by Riverton for violating the dam ordinance, and Riverton police can't arrest them for protesting *in Oakley*. Their recourse is *their own* government, diplomacy, or international law. Including them dilutes the agency of *actual* Riverton citizens who live under these rules.

  **Aris:** But that’s precisely the problem! "Political community" is the *question*, not the answer! *Who decides* the boundaries of that community? Historically, it was often force or accident! Why should Riverton's arbitrary border decide who drowns and who benefits? And what about *reciprocal effects*? What if Oakley, furious about the flooding, builds *their own* dam upstream, devastating Riverton? Suddenly, Riverton is "affected" but wasn't included in Oakley's "subjected" group earlier. Your principle creates fragmented, potentially antagonistic demoi ignoring their spillover effects. Mine forces collective responsibility for consequences.

  **Lena:** Collective responsibility sounds noble, but it ignores political reality. A Riverton voter *is* accountable – to their *fellow Rivertonians* through elections, recall, etc. They have skin in the game *within that system*. An Oakleyan has no such mechanism within Riverton. How do they enforce accountability? Your principle requires a *global demos* for truly global problems, which is utterly impractical! We build democracy *up* from existing communities of shared fate *defined by shared subjection*. Yes, borders are imperfect, but they map (roughly) to jurisdiction and enforcement capability. Your principle maps to an impossibly complex web of impacts.

  **Aris:** Shared fate? Those Oakley farmers' fate is now inextricably tied to Riverton's vote! More "shared" than a Riverton retiree with no stake in the dam! Jurisdiction is a *tool*, not a moral foundation. We *can* design mechanisms: joint commissions, weighted voting for cross-border issues, even special electoral colleges for affected non-citizens. Difficult, yes, but more just than saying "tough luck" to those outside the magic coercion circle. And what about non-coercive but massively consequential decisions? A referendum on diplomatic recognition? Your "subjected" principle might exclude allies whose security is profoundly affected!

  **Lena:** (Sighs) You highlight the messy edge cases. But Aris, your "affected" principle risks *disempowering* the core democratic unit. If Rivertonians know their vote on local infrastructure can be overridden by non-citizens they didn't elect and can't hold accountable, why participate? It undermines the very legitimacy of *their* self-government. The "subjected" principle protects the integrity of the democratic contract *within* a polity. External effects are handled through *inter*-polity relations – treaties, diplomacy, supranational bodies. Imperfect? Absolutely. But trying to solve every spillover *within* the voting mechanism dissolves the demos itself. Democracy needs a starting point, a "birth certificate" of membership. "Subjected" provides that anchor.

  **Aris:** An anchor that can drown the neighbors! Democracy's legitimacy shouldn't stop at the border when its actions don't. We need principles that acknowledge interconnectedness. "Affected interests" forces us to confront the real-world consequences of our votes, not hide behind jurisdictional walls. It pushes us towards more inclusive, cooperative democratic designs. Your anchor feels more like a cage – for those outside. The boundary problem remains unsolved, Lena, but ignoring affected outsiders is a moral and practical failure, not a solution.

  **Lena:** And including everyone potentially affected is a path to democratic incoherence, Aris. We agree the problem is fiendish. But until we have a world state, "all subjected" provides the only workable foundation for meaningful, bounded self-government. The spillovers? That's the hard work of politics *between* demoi. Riverton's vote stands. Oakley's fight begins. (She takes a final sip of coffee, the referendum posters fluttering in the wind outside).

  **(They sit in silence for a moment, the unresolved tension hanging in the air – the core democratic dilemma laid bare).**

  **Key Points Illustrated:**
  *   **All Affected (Aris):** Focuses on moral relevance of harm/benefit, forces responsibility for consequences, challenges arbitrary borders, pushes for inclusive mechanisms. Weakness: Definitional vagueness, potential for infinite regress, practical dilution of local agency.
  *   **All Subjected (Lena):** Focuses on political community, shared rules/enforcement, accountability mechanisms, practical workability. Weakness: Ignores significant external harm, potentially entrenches arbitrary borders, struggles with non-coercive consequential decisions.
  *   **Rabbit Hole Elements:** Circularity (who decides the demos?), reciprocal effects, edge cases (non-coercive impacts), tension between moral ideals and practical implementation.
