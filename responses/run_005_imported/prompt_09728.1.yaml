  So this is going to sound like a super specific question but here's the backstory: I've got a roommate, Dana, who's honestly one of the best people I know in terms of how she actually treats people — she's the one who got up and dealt with our neighbors medical emergency at 3am while the rest of us just stood there frozen, she's always the first to help a stranger, stuff like that. But shes told me straight up she's never really thought about ethics as a subject, she just does whatever feels right in the moment, no weighing duties or consequences or anything. Meanwhile I'm in an intro ethics class right now working through Kant's Groundwork, and I do a lot of "good" stuff too (volunteering, giving money, being nice to people I secretly can't stand), but if I'm honest a lot of my motivation is wanting to think of myself as a good person, not really the people I'm supposedly helping. Last week my professor brought up the Huckleberry Finn case — Huck helping Jim escape even though he consciously believes its a sin, and he actually writes a letter to turn him in before tearing it up at the last second — and mentioned some philosopher who uses that case against Kant, Arpaly maybe? Ever since then I can't stop comparing Dana, Huck, and myself in my head and it's honestly a little unsettling.

  Could you actually lay out that comparison properly for me: Kant's claim that an action only has genuine moral worth if it's done from duty/respect for the moral law, versus this Arpaly-ish view where what matters for moral worth is just whether you're actually responsive to the real right-making reasons in a situation, whether or not you ever consciously frame things to yourself in moral terms. Which of the two gives a more plausible verdict on cases like Huck's and Dana's? And is there some more charitable reading of Kant that doesn't just have to bite the bullet and say people like Dana never do anything of genuine moral worth, because that conclusion seems pretty rough to me.
