prompt: |-
  Back when I was still working in statistical mechanics, I used to burn through my lunch breaks reading Douglas Hofstadter's old "Metamagical Themas" columns, and his idea of "superrationality" -- that two identically-reasoning agents playing a one-shot Prisoner's Dilemma should both cooperate, because whatever argument convinces one of them to defect or cooperate is, by the symmetry of the situation, exactly as convincing to the other one -- always struck me as one of the slicker pieces of reasoning I'd run into outside of actual physics. Now that I'm retired and getting properly into philosophy (slowly, and probably not always correctly), I keep running into a newer-sounding idea out of the effective altruism/longtermist world called "evidential cooperation in large worlds," which from what I can tell takes basically the same superrationality move and blows it up to the scale of the whole universe, or multiverse if its infinite: the thought being that in a big enough world there are bound to be huge numbers of agents totally cut off from us causally, who nonetheless reason in ways correlated with ours, even if they're not exact copies of us and dont share our values.

  I mentioned this to an old colleague of mine over coffee and we ended up arguing about whether there's anything genuinely new here, or whether it's just superrationality wearing a bigger coat. So I'd like you to properly compare evidential cooperation in large worlds with Hofstadter-style superrationality. Where does the large-worlds version really need correlation-without-identity and evidential decision theory to carry weight that plain superrationality never had to carry, and where is it secretly still riding on that same old assumption of near-perfect symmetry between agents? And while you're at it, I'd like your honest take on how serious a problem it is for the large-worlds argument that nobody can actually specify who counts as "correlated enough with me" to be part of the deal, given that Hofstadter got to just stipulate perfect symmetry in his toy examples and the large-worlds crowd doesn't get that luxury.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're comparing Hofstadter's superrationality with the newer concept of evidential cooperation in large worlds (ECLW). The user is a retired physicist with a background in statistical mechanics, now diving into philosophy. They mention their colleague argued about whether ECLW is genuinely new or just superrationality scaled up.

  First, I need to recall both concepts. Superrationality, from Hofstadter, involves identical agents in symmetric games like the Prisoner's Dilemma. They cooperate because any reasoning one uses applies identically to the other. ECLW, from effective altruism/longtermism, extends this to large worlds with many agents who are causally disconnected but correlated in reasoning, not necessarily identical.

  The user's main questions are: Where does ECLW rely on correlation-without-identity and evidential decision theory (EDT) where superrationality didn't? Where is ECLW still leaning on symmetry? Also, how serious is the problem of defining "correlated enough" agents in ECLW, compared to Hofstadter's clear symmetry.

  Breaking it down:

  1. **Key Differences**: Superrationality requires identical agents and symmetric situations. ECLW drops identity but keeps correlation. It uses EDT, which focuses on evidence and correlations, unlike causal decision theory (CDT). Superrationality didn't need EDT explicitly because symmetry handled it.

  2. **Symmetry Assumptions**: ECLW still needs some symmetry in reasoning, but not perfect identity. The correlation in decision-making processes allows for similar actions without identical agents. However, this introduces vagueness: who counts as correlated?

  3. **Problem of Vagueness**: Hofstadter could assume perfect symmetry. ECLW can't. Defining "correlated enough" is tricky. How to measure correlation strength? Thresholds are arbitrary, and the concept relies on large numbers to mitigate this, but it's a fundamental issue.

  4. **User's Background**: They're coming from physics, where precise definitions matter. The vagueness in ECLW might be a sticking point. They might appreciate the scalability of ECLW to real-world problems like AI alignment or global coordination, which superrationality couldn't handle due to its strict symmetry.

  5. **Unspoken Needs**: The user might be exploring how philosophical concepts apply to real-world issues. They could be interested in the practical implications for cooperation in large-scale problems, like existential risks. Also, they might enjoy the intellectual bridge between physics-inspired reasoning and philosophy.

  I should structure the response to address each part: comparison, reliance on EDT, symmetry, vagueness issue. Emphasize that ECLW's novelty is in handling non-identical agents via correlation and EDT, but the symmetry is relaxed, not absent. The vagueness is a significant challenge but potentially mitigated in large worlds. Conclude that ECLW extends superrationality by addressing its limitations, though it inherits some issues in a more complex form.
answer: |-
  What a delightful crossover of ideas—Hofstadter's lucid superrationality meeting the cosmic ambitions of evidential cooperation in large worlds (ECLW). As a fellow admirer of elegant reasoning (and someone who's wasted many lunch breaks similarly), I'll dissect this carefully. Let's break it down step by step, addressing your core questions about novelty, assumptions, and the thorny problem of "correlation."

  ### 1. **Core Similarities: The Superrationality DNA**
  Both frameworks share a foundational insight: **agents should condition their decisions on the fact that their reasoning process is mirrored (or correlated) with others**. Hofstadter's superrationality, as you noted, relies on *perfect symmetry*: two identical agents in a one-shot Prisoner's Dilemma (PD) realize that whatever logic compels one to defect/cooperate compels the other identically. Cooperation emerges because defection only dominates if you assume *causal independence*—but symmetry breaks that assumption. If I defect, I must conclude my identical counterpart defects too, leading to mutual defection. But if I cooperate, symmetry implies mutual cooperation, yielding a better outcome.  

  ECLW inherits this evidential core but scales it radically:  
  - **Scale**: Instead of two identical agents, ECLW posits a vast multiverse (finite or infinite) filled with agents whose *decision algorithms are correlated* with yours, even if they aren't identical, causally disconnected, or value-aligned.  
  - **Mechanism**: By cooperating, you "signal" to correlated agents (via the abstract link of shared reasoning) to cooperate too, creating a "cosmic coalition" that outperforms causal defection.  

  *The shared engine*: Both reject causal decision theory (CDT) in favor of **evidential decision theory (EDT)**. EDT says: "Choose actions that, conditional on being taken, *provide evidence* for desirable outcomes." Superrationality uses symmetry to make "I cooperate" evidence that "my twin cooperates." ECLW uses correlation to make "I cooperate" evidence that "many correlated agents cooperate."  

  ### 2. **Key Differences: Where ECLW Demands New Machinery**
  Here’s where ECLW isn’t just "superrationality in a bigger coat"—it needs heavier lifting to function:  

  - **Correlation Without Identity**:  
    Hofstadter’s symmetry is *exact*: agents are clones. ECLW relaxes this to *statistical correlation*: agents share overlapping decision algorithms (e.g., similar cognitive architectures, training data, or ethical priors) but aren’t identical. This allows ECLW to handle real-world heterogeneity:  
    - *Why it matters*: Superrationality fails if agents aren’t perfect copies. ECLW claims to work even with "distant cousins" (e.g., an AI in Andromeda with similar RLHF training). This requires **generalizing symmetry to probabilistic dependence**—a move grounded in complexity theory/Lotteries and Physics (e.g., the "neurocorrelate" work of Oesterheld 2021).  
    - *Weight carried*: ECLW must prove that correlation induces *enough* cooperators to offset defectors. Superrationality’s mutual cooperation is Pareto-optimal; ECLW risks "cooperating with defectors" if correlation is weak.  

  - **Evidential Decision Theory as Non-Negotiable**:  
    Superrationality *implicitly* uses EDT, but its symmetry makes the evidence deductive: "I cooperate → they cooperate" is certain. ECLW *explicitly* relies on EDT to handle uncertainty: "I cooperate → this *raises the probability* that correlated agents cooperate." This introduces:  
    - *New vulnerabilities*: EDT is notoriously brittle (e.g., it fails in Newcomb-like problems if the predictor is fallible). In ECLW, if your action is weak evidence (e.g., because correlation is noisy), cooperation may not pay off. Superrationality dodges this—its evidence is airtight.  

  - **Large Worlds & Infinity**:  
    Superrationality is small-scale and finitistic. ECLW exploits cosmological scale:  
    - In infinite worlds, ECLW argues that even tiny correlations create infinite cooperators, making cooperation dominant (via expected value calculus).  
    - *Where symmetry still lurks*: ECLW assumes that *your decision algorithm is representative* of correlated agents. This is a statistical symmetry assumption—not identity, but ergodicity in reasoning. If your "type" is rare, ECLW collapses.  

  ### 3. **The Symmetry Assumption: Still Riding the Old Horse?**
  ECLW *tries* to escape perfect symmetry, but a diluted version remains essential:  
  - **"Reasoning Correlation" as Symmetry Lite**: ECLW replaces "identical agents" with "agents whose decisions are conditionally dependent given shared reasoning methods." This is still a *symmetry of process*—e.g., all agents using Bayesian updating with common priors. If correlated agents reason *differently* about the dilemma (e.g., some are CDT agents), ECLW fails.  
  - **The Hidden Anchoring Problem**: Superrationality’s symmetry is a clean prior. ECLW needs a prior over "who is correlated." This often defaults to *similarity in computational complexity* (e.g., "agents solving the same problem optimally"). That’s symmetry in disguise—it assumes a uniform solution landscape.  

  ### 4. **The Vagueness Problem: ECLW's Achilles' Heel**
  You’ve nailed the crux. Hofstadter stipulates symmetry; ECLW must *discover* correlation, and this is philosophically fraught:  
  - **The Boundary Issue**: Who counts? Is a chimpanzee using trial-and-error correlated with an AI using gradient descent? What about a paranoid human defector? ECLW relies on vague predicates like "agents implementing similar algorithms" (e.g., MIRI’s "coherence arguments"). But:  
    - *No objective threshold*: "Similar enough" is undefined. Correlation strength isn’t observable; it’s inferred from abstract models of cognition.  
    - *Exploitable ambiguity*: Defectors could claim they’re "uncorrelated" to justify free-riding. Superrationality’s clones can’t evade their twin.  
  - **Why Large Worlds Might (Partly) Save It**:  
    Proponents argue that in a *large enough* world, vagueness "washes out": if *most* agents near your correlation threshold cooperate, expected utility favors joining them. But this leans on **infinity or universality assumptions**—e.g., that decision algorithms are drawn from a reasonable prior (e.g., Solomonoff induction). In finite worlds, vagueness can dominate.  

  ### My Honest Take: Novelty vs. Risk
  - **Where ECLW Shines**: It’s a genuine extension for *realistic* large-scale cooperation problems (e.g., AI alignment or interstellar coordination) where symmetry is implausible but correlation isn’t. It forces us to take EDT seriously in cosmology—something superrationality avoided by staying "toy."  
  - **Where It Stumbles**: The correlation vagueness is a **foundational problem**. Superrationality is a polished diamond; ECLW is a rough cosmic ore. Until we formalize "correlation thresholds" (e.g., via algorithmic information theory), ECLW risks being an elegant fiction.  
  - **Why Physicists Might Wince**: You know symmetry when you see it (e.g., \( SU(3) \) gauge invariance). "Correlated reasoning" lacks operational tests—it’s more like quantum interpretations (useful but unfalsifiable).  

  **In short**: ECLW *is* novel in scaling superrationality to a messy multiverse, but it trades Hofstadter’s crisp symmetry for a foggy correlation that may not hold weight outside idealized models. Its value lies in forcing longtermists to confront acausal coordination—but without a theory of "correlation distance," it’s more inspiration than prescription.  

  If you're exploring this philosophically, I’d recommend pairing ECLW (e.g., Oesterheld & Yudkowsky) with critiques from causalists (e.g., Arif Ahmed’s *Evidence, Decision and Causality*). It’s a wild ride—worthy of those old *Metamagical Themas* breaks.
