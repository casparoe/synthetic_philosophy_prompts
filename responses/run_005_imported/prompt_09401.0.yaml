    - Shor’s algorithm **does not solve NP-complete problems** (it efficiently solves factoring/discrete log, but BQP ≠ NP).  
    - RSA security relies on factoring hardness, not NP-completeness; the phrasing overstates the role of complexity theory.  
  - **Minor overconfidence in mathematics example:**  
