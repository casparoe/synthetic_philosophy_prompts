prompt: |-
  I had a long, slightly heated argument with a friend last night about effective altruism after she brought up Peter Singer's drowning-child argument. Her position was that once you accept Singer's reasoning, the whole concept of "supererogation" — acts that are morally good but not required — basically collapses: whatever produces the most good is simply obligatory, and anything less than that is a moral failure, so extraordinary charitable giving (or any other "above and beyond" act) was never really optional in the first place, just misdescribed by common sense. I felt this was too quick but couldn't pin down exactly where the argument goes wrong. Is she right that taking utilitarian-style reasoning seriously means there's no real room left for supererogatory acts, or is there a way to preserve that category even if something like Singer's argument is basically sound?
reasoning: |-
  Okay, let me start by unpacking the user's question. They had a heated debate with a friend about effective altruism and Peter Singer's drowning-child argument. The friend claimed that accepting Singer's reasoning collapses the concept of supererogation, making any act that isn't maximally beneficial a moral failure. The user felt this was too quick but couldn't pinpoint why. I need to figure out how to address this.

  First, I should recall Singer's argument. The drowning child analogy suggests that if you can save a life at little cost, you're obligated to do so. Extending this to global poverty, donating to effective charities becomes a duty. The friend's point is that this leaves no room for actions that are good but not required. 

  Now, supererogation traditionally involves acts that go beyond duty. The user wants to know if utilitarianism can accommodate this. I remember that utilitarians like Singer focus on maximizing good, which seems to make supererogation impossible. But maybe there's nuance here. 

  I should consider different utilitarian responses. One approach is threshold utilitarianism, where duties have a baseline. Meeting that is obligatory; exceeding it is supererogatory. But defining that threshold is tricky. Another angle is demandingness. Utilitarianism might be too demanding, so supererogation acts as a pressure valve. However, Singer might counter that the stakes are too high to lower demands. 

  Epistemic limitations matter too. We can't always know the best action, so supererogation covers acts where we go beyond despite uncertainty. Also, psychological realism suggests that allowing supererogatory acts encourages more people to contribute rather than feeling overwhelmed. 

  Motivational structures are another point. Praising supererogatory acts might inspire others, even if they're technically required. But Singer could argue this is just strategic, not moral. 

  The user might also be interested in practical implications. How does this affect someone's motivation to donate? If everything is obligatory, people might feel guilty and do less. Supererogation could maintain morale. 

  I should check if the user is looking for a way to reconcile their intuitive sense of supererogation with Singer's ethics. They might want validation that their friend's absolutist view isn't the only option. Highlighting the various utilitarian defenses of supererogation could help them articulate their discomfort. 

  Also, considering the depth of the discussion, the user likely has a good grasp of philosophy but needs structured counterarguments. They mentioned not being able to pin down where the argument fails, so providing clear categories of responses would be useful. 

  Finally, summarizing that Singer's framework can coexist with supererogation through these nuanced approaches should address their core concern. Emphasizing practical and psychological factors might resonate more than purely theoretical points.
answer: |-
  That's an incredibly sharp debate touching the heart of moral philosophy! Your friend is articulating a powerful and common critique of consequentialism (especially utilitarianism) known as the **"demandingness objection."** While her conclusion isn't *necessarily* wrong, it's far from the only way to interpret Singer's argument within a consequentialist framework. Here's a breakdown of the positions and potential ways to preserve supererogation:

  1.  **Singer's Core Argument (The Demandingness):**
      *   Premise: If we can prevent something very bad (e.g., death, severe suffering) without sacrificing anything *morally significant*, we ought to do it.
      *   Analogy: Saving a drowning child at the cost of muddying your clothes. Failing to save them is morally wrong.
      *   Application: Global poverty causes immense, preventable suffering. Most people in affluent nations can donate significant portions of their income to highly effective charities (like those endorsed by GiveWell) without sacrificing anything *morally comparable* to the suffering prevented (e.g., giving up luxuries, not necessities).
      *   **Friend's Inference:** Therefore, donating that "significant portion" isn't "extraordinary" or "supererogatory" – it's the *minimum required* to avoid being complicit in preventable harm. *Anything less is a moral failure.* Going "above and beyond" this baseline becomes conceptually difficult, as the "baseline" duty is already extremely demanding.

  2.  **Why Her Argument is Strong (But Not Inevitable):**
      *   **Internal Logic:** From a *strict act-utilitarian* perspective (maximize good consequences, act-by-act), she's largely correct. If donating 30% of your income saves 10 lives/year, and donating 40% saves 12, then donating *only* 30% means you allowed 2 preventable deaths. Morally, that looks like a failure relative to the best you could do.
      *   **Collapsing Supererogation:** In this view, the traditional category of "supererogation" vanishes. What common sense calls "extraordinary" is simply *what is required*, and failing to meet it is blameworthy. "Ordinary" morality is seen as systematically mistaken about the demandingness of duty.

  3.  **Ways to Preserve Supererogation Within (or Alongside) Consequentialist Reasoning:**

      *   **Thresholds & Satisficing:**
          *   **Concept:** Morality requires achieving a *sufficient* level of good or preventing a *sufficient* amount of harm, not necessarily the *absolute maximum possible*. Once this threshold is met, further beneficent acts are supererogatory.
          *   **Defense:** This aligns better with human psychology, societal functioning, and common intuitions. We recognize duties to rescue (like Singer's child) but don't demand people constantly seek out every *possible* drowning child globally 24/7. Meeting a demanding but achievable baseline (e.g., donating 10-20% effectively) could be obligatory, while donating 50% or radically changing one's life could be supererogatory.
          *   **Challenge:** Defining the threshold objectively is difficult. Singer would argue the preventable suffering is so vast that the threshold must be set very high.

      *   **The Demandingness Objection as a Feature, Not a Bug (But with a Pressure Valve):**
          *   **Concept:** Utilitarianism *is* extremely demanding. However, recognizing this psychological reality, we might *treat* acts meeting a high but not maximal standard as "good enough" (fulfilling duty) in practice, reserving blame only for clear failures far below that, while *praising* those who go significantly beyond it as supererogatory. This is a pragmatic concession, not a fundamental moral distinction.
          *   **Defense:** This maintains the *ideal* (maximization) while acknowledging human limitations and the counterproductive nature of paralyzing guilt. Supererogation acts as a social and psychological "pressure valve."
          *   **Challenge:** Singer might argue this blunts the moral urgency and lets people off the hook too easily.

      *   **Epistemic Limitations & Marginal Value:**
          *   **Concept:** We rarely know with certainty *exactly* what the maximally beneficial act is. Calculating expected utility is complex. Donating effectively to a proven charity clearly meets a high standard of duty. Spending years researching an even *more* effective niche cause, or taking enormous personal risks for marginal extra gains, might be supererogatory because the *certainty* of meeting the duty threshold is already achieved, and the extra effort/risk is disproportionate to the *likely* marginal benefit.
          *   **Defense:** Morality requires reasonable efforts based on available knowledge. Once you've met a high standard of significant, effective contribution using reliable methods, you've done your duty. Extraordinary research or sacrifice for uncertain marginal gains is beyond duty.

      *   **Psychological Realism and Moral Motivation:**
          *   **Concept:** A moral system that labels *every* non-maximal act a "failure" risks being demotivating and counterproductive. People might reject the system entirely ("If I can't be perfect, why bother?"). Preserving a category of "supererogatory" allows us to praise exceptional effort *without* implying that those meeting a demanding baseline are failures. This can foster a more sustainable culture of giving.
          *   **Defense:** This is a consequentialist argument *for* preserving the concept of supererogation! It might lead to *more* good overall by encouraging widespread compliance with demanding duties and inspiring further action through praise, rather than inducing guilt-ridden paralysis.
          *   **Challenge:** This feels like a "noble lie" – if the underlying truth is that only maximal giving is truly obligatory, is it right to pretend otherwise?

      *   **Focus on Rules & Character (Rule-Utilitarianism/Indirect Consequentialism):**
          *   **Concept:** The best *set of rules* or *character traits* for society to promote might include a distinction between duty and supererogation. A rule demanding maximal sacrifice might be less optimal than a rule demanding significant sacrifice (duty) while highly praising extraordinary sacrifice (supererogation), as the latter fosters wider adherence and positive moral development.
          *   **Defense:** This separates the criterion of rightness (maximizing good) from the decision procedure or rules we teach. The *rule* "Donate X% effectively" defines duty; exceeding it is supererogatory, and this rule-system maximizes good overall.
          *   **Challenge:** It still implies that *fundamentally*, the supererogatory act is *better*, blurring the line Singer's friend wants to collapse.

  4.  **Conclusion: Is Supererogation Possible Under Singer?**

      *   **Under Strict Act-Utilitarianism:** Your friend has a very strong point. Supererogation as traditionally understood (morally optional good acts) largely collapses. Failing to maximize is morally wrong.
      *   **Within Broader Consequentialism (or Pragmatically):** Supererogation *can* be preserved through:
          *   **Thresholds/Satisficing:** Defining a demanding but achievable level as "duty."
          *   **Pragmatic/Psychological Grounds:** Recognizing the concept is necessary for motivation and societal functioning, even if not fundamental.
          *   **Epistemic Humility:** Acknowledging limits in knowing the absolute maximum.
          *   **Rule-Based Approaches:** Distinguishing optimal rules from fundamental rightness.

  **Your intuition that it was "too quick" is valid.** While Singer's argument powerfully challenges complacency and reveals the demandingness of our duties in an unequal world, it doesn't *force* us to abandon the concept of supererogation entirely. We can accept the core moral force of preventing severe harm at little comparable cost (which *is* demanding) while still making conceptual and practical space for recognizing *exceptional* efforts that go beyond a high, yet defined, standard of duty. The debate often hinges on whether one prioritizes moral purity (maximization) or psychological/social sustainability in pursuing the good. Effective Altruism itself often walks this line, setting high but specific giving benchmarks (like 10% or "earning to give") as clear duties while celebrating those who go further.
