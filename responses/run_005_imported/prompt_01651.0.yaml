answer: |-
  You've touched on one of the most profound ethical dilemmas in effective altruism: the tension between earning-to-give and direct impact work. Your discomfort reveals important nuances in moral philosophy that deserve careful consideration. Here's a breakdown of why your friend's argument might be incomplete:

  ### Key Flaws in the "Obligatory Maximum Impact" Argument
  1. **The Sustainability Problem**:  
     Burning out in a high-stress job isn't just personally costly—it's strategically unsound. Research on altruistic careers shows that **sustainable impact** often outperforms short-term maximization. If the lucrative path destroys your health or relationships within 5 years, while part-time direct work lasts 30 years, lifetime impact may be greater with the latter.

  2. **The Marginal Utility Problem**:  
     Donating $300K/year to top charities (e.g. Against Malaria Foundation) might save ~100 lives annually. But if your **unique skills** could develop an open-source diagnostic tool used in 10,000 clinics, the multiplicative impact could dwarf donations. Software engineers often underestimate their comparative advantage in direct technical work.

  3. **The Moral Luck Paradox**:  
     Your inheritance *does* change obligations, but not in the way your friend implies. Philosophers like Peter Singer argue privilege *increases* responsibility to help others—but crucially, **not exclusively through financial sacrifice**. Having time and mental bandwidth is a rare resource that enables high-leverage direct action inaccessible to those trapped in survival jobs.

  4. **The Holistic Impact Blindspot**:  
     Sacrificing all personal relationships and rest doesn't just harm you—it reduces your **capacity for nuanced problem-solving**. Global poverty work requires deep understanding of local contexts, which often emerges through diverse life experiences, not 80-hour workweeks.

  ### A Balanced Framework for Decision-Making
  Consider these dimensions:

  | **Factor** | "Earn-to-Give" Path | "Direct Work" Path | Hybrid Approach |
  |------------|---------------------|-------------------|----------------|
  | **Impact Type** | Funds proven interventions | Develops new solutions | Funds + builds |
  | **Leverage** | High immediate $ impact | Potential for exponential scale | Balanced portfolio |
  | **Risk** | Low (evidence-based giving) | High (innovation uncertainty) | Mitigated |
  | **Sustainability** | Low (burnout likely) | High (controlled pace) | Optimal |
  | **Personal Cost** | Severe (time/health drain) | Moderate | Managed |

  ### A Third Way: The Hybrid Strategy
  Given your unique position, consider:
  1. **Part-time direct work** (20 hrs/week) with high-impact nonprofits like [Innovations for Poverty Action](https://www.poverty-action.org/) or [Terraformation](https://www.terraformation.com/), leveraging your engineering skills on systemic solutions.
  2. **Consulting 10-15 hrs/week** for tech firms at premium rates, donating 80%+ of consulting income.
  3. **Preserving 30% time** for relationships/rest—critical for long-term effectiveness.

  This likely outperforms either extreme: A $150K donation could fund 50,000 malaria bednets *while* you build vaccine distribution algorithms that improve efficiency by 1% (saving thousands more lives cumulatively).

  ### Why This Isn't "Opting Out"
  Your inheritance enables **strategic impact optimization**, not avoidance. As philosopher Ingrid Robeyns notes: "We have duties to assist others, but also duties to develop our capabilities." Sacrificing your talents on an assembly-line coding job when you could be solving harder problems is its own moral opportunity cost.

  ### Resolving the Moral Discomfort
  - **Reframe "luxury" as leverage**: Your security lets you take risks on innovative solutions that salaried employees cannot.
  - **Reject false binaries**: The 80,000 Hours project finds the highest-impact careers often combine paid work, volunteering, and skill-building.
  - **Calculate holistically**: Include your wellbeing as a multiplier in the impact equation. Depleted people don't solve wicked problems.

  **Actionable next step**: Run a personal impact simulation using tools like [80,000 Hours Career Planner](https://80000hours.org/career-planning/) comparing 10-year projections of both paths. You may find the hybrid model offers 70-90% of maximum theoretical impact with 50% less personal cost—an ethical and practical sweet spot.

  Your moral intuition is sound: Impact isn't just about dollars moved or hours logged, but about wisely deploying your *entire* human potential in service of others. That requires preserving the very humanity you're trying to elevate.
