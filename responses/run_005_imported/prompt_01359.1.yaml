prompt: |-
  Hey, quick question for a piece I'm working on about religious justifications for killing dictators. From what I can tell, Aquinas's argument boils down to this: an unjust law isn't really a law, and a ruler forfeits his legitimacy the second he starts governing for himself instead of the common good -- so killing him isn't just permitted, its praiseworthy, he even says so pretty explicitly in one spot. Given that, why didn't medieval Europe see a lot more assassinations of unpopular kings once this kind of Thomistic reasoning got around? Feels like the Church was sitting on a pretty radical license for regicide and barely used it.
reasoning: |-
  Okay, the user is writing a piece about religious justifications for assassinating dictators, specifically focusing on Aquinas. They've summarized Aquinas's argument: an unjust law isn't a real law, and a ruler who governs for themselves instead of the common good loses legitimacy, making killing them praiseworthy. The user wonders why medieval Europe didn't see more regicides if this reasoning was available. They feel the Church had a radical tool but didn't use it much.

  First, I need to unpack Aquinas's actual position. The user mentions the "unjust law" part from Question 90 and Question 96 of the Summa Theologiae. But Aquinas also discusses tyranny in Question 42. He does say that a tyrant can be killed, but with caveats. The user might be oversimplifying by focusing only on the permissibility without considering the conditions Aquinas sets. I should clarify that Aquinas isn't giving a blanket license for assassination.

  Next, the user's question about why more assassinations didn't happen. The key here is the practical application versus theoretical permission. The Church had reasons to avoid promoting regicide. Political stability was crucial for the Church's own power. If they endorsed killing tyrants, it could backfire on them or lead to chaos. Plus, the Church often preferred other methods like excommunication or supporting rival nobles. Historical examples like Becket's assassination leading to backlash show the risks.

  I should also consider the medieval context. Removing a king wasn't simple; it required collective action from the nobility. The Church might condemn a ruler but hesitate to push for assassination because of the potential fallout. Aquinas himself emphasizes that the action shouldn't cause more harm. The Church might have seen deposition as a safer alternative.

  Another point is the distinction between tyrannical acts and being a tyrant. Aquinas allows resistance but doesn't necessarily advocate for assassination as the first resort. The Church might have used his framework to justify resistance without explicitly endorsing murder. Also, the sacramental role of kings made direct killing problematic—kings were anointed by God, so even a bad king's removal needed care.

  The user might be missing the Church's balancing act between moral authority and political pragmatism. They had the theory but applied it selectively to maintain influence. Examples like the Magna Carta or conflicts with figures like Emperor Henry IV show the Church pushing back without advocating assassination. 

  I should also address the user's deeper interest: why theoretical justifications don't translate to action. They might be exploring the gap between ideology and practice, or how institutions control radical ideas. Highlighting the Church's mechanisms to restrain such doctrines could add depth to their piece. Maybe they want to understand the constraints on religious justifications in real politics.

  Lastly, ensuring accuracy. The user cites Aquinas explicitly saying killing a tyrant is praiseworthy. I recall in Question 42, Article 2, Aquinas references the Maccabees and says it's praiseworthy to kill a tyrant, but with conditions. Emphasizing those conditions is crucial. Also, the Church's later adoption of Aquinas but downplaying the radical parts, like in the Renaissance, shows institutional management of ideas.
answer: |-
  That's a sharp observation! You're right that Aquinas's arguments in *Summa Theologiae* (particularly I-II, Q90, Q96 and II-II, Q42) *could* be interpreted as providing a radical theological justification for tyrannicide. His core points are:

  1.  **Law = Reason for Common Good:** True law is an ordinance of reason directed to the common good (I-II, Q90).
  2.  **Unjust Law is Violence, Not Law:** A law failing this standard (e.g., for private gain, exceeding authority, unjustly distributing burdens) "is a perversion of law," "an act of violence" rather than true law (I-II, Q92, A1, ad 4; Q96, A4).
  3.  **Tyranny Defined:** A tyrant rules for personal benefit, not the common good (II-II, Q42).
  4.  **Resistance & Removal Permitted:** Subjects are *not* obliged to obey unjust commands or laws aimed at tyranny (I-II, Q96, A4). Aquinas explicitly discusses removing a tyrant, stating it is "praiseworthy" (*laudabiliter*) to kill a tyrant who cannot otherwise be removed, citing biblical examples like Ehud killing Eglon (Judges 3) and the Maccabees (II-II, Q42, A2, ad 3).

  **So why wasn't medieval Europe awash in Thomistically-justified regicide? Several crucial reasons:**

  1.  **The "Public Authority" Caveat:** Aquinas is crystal clear that killing a tyrant **must not be undertaken by private individuals acting on their own initiative** unless the tyranny is extreme and immediate, and there is absolutely no other recourse (II-II, Q42, A2). He emphasizes:
      *   **Danger of Worse Outcomes:** Private individuals are likely to lack the judgment, power, or legitimacy to succeed, potentially plunging the realm into worse chaos or inviting a worse tyrant. He feared anarchy more than tyranny.
      *   **Legitimate Authority Required:** Removal (including execution) should ideally be done by a superior authority (like the Emperor over a king, though this was contested) or by "public authority" – meaning a collective body representing the community (like the nobility or estates acting *for* the common good, not private vengeance). This made it a political and constitutional act, not simple assassination.
      *   **The "Common Consent" Loophole:** While not explicitly advocating mob rule, the idea that "public authority" could reside in the community acting through its leaders provided a theoretical path, but one fraught with practical difficulty and risk.

  2.  **The Church's Institutional Prudence & Self-Preservation:**
      *   **Fear of Chaos:** The Church was a primary beneficiary of social and political stability. Encouraging private individuals to kill rulers, even bad ones, threatened the very order the Church relied upon.
      *   **Avoiding Backlash:** Openly endorsing regicide could make the Church a target for retaliation by nervous monarchs and undermine its own claims to temporal authority and immunity.
      *   **Leverage, Not Elimination:** The Church often found excommunication, interdict, supporting rival claimants, or encouraging baronial rebellion far more effective and less risky tools than advocating murder. Deposing a king (like Emperor Henry IV at Canossa) allowed for a controlled transition, potentially preserving Church influence.
      *   **Safeguarding Sacral Kingship:** Even bad kings were anointed. Directly killing them risked undermining the *sacred* aspect of kingship that the Church itself upheld and benefited from. Deposition preserved the *institution* while removing the individual.

  3.  **Practical Political Realities:**
      *   **Power Dynamics:** Successfully removing a king required immense coordinated power, usually from rival nobles. Aquinas's theory might *justify* their rebellion, but their motivation was usually self-interest and power, needing little Thomistic justification. The *theory* didn't create the *capability*.
      *   **Distinction Between "Tyrant" and "Unpopular/Strong":** Kings were often accused of tyranny by those whose privileges they challenged (like John Lackland by the barons leading to Magna Carta). The Church was wary of labeling every unpopular or strong-willed king a "tyrant" justifying death. The barons sought to *constrain* John, not kill him.
      *   **Succession Crises:** Killing a king without a clear, legitimate, and powerful successor guaranteed instability and civil war – the very outcome Aquinas warned against.

  4.  **Interpretation and Emphasis:** The Church and later Scholastics often **downplayed the radical implications** of Aquinas's words:
      *   Focus shifted to his cautions against private action and the dangers of removal.
      *   Emphasis was placed on the *possibility* of deposition by legitimate authority rather than the *praiseworthiness* of killing by individuals.
      *   The "common good" argument was often used more to pressure kings towards reform than to justify their murder.

  **In essence:** Aquinas provided a powerful *theoretical framework* justifying resistance and even removal of tyrants. However, the radical potential for individual or small-group assassination was deliberately **constrained by his own strict conditions** (public authority, last resort, avoidance of greater evil) and **neutered by the institutional self-interest and political pragmatism of the medieval Church and nobility.** They possessed the "license" but chose to keep it tightly locked away, deploying less extreme and less destabilizing tools from their political arsenal whenever possible. The theory was there, but the institutional will and practical mechanisms for widespread Thomistic regicide were deliberately absent. Your piece is right to highlight the tension – it reveals the gap between potent theological reasoning and the messy realities of power and institutional survival.
