  Key points from Vasubandhu's philosophy: continuity is crucial. Karma depends on a linear causal chain where actions in one moment ripen in subsequent moments of the same series. If you fork the series, which stream inherits the karma? Both copies share the same past karma up to the fork. Vasubandhu would argue that the karma must ripen in the specific continuum where the action was performed. Post-fork, each copy has its own continuum, so karma should ripen separately in each. But the duplication event itself isn't a natural karmic action, so it's an external interference. That might be problematic because Vasubandhu's system assumes a natural, unbroken chain.

