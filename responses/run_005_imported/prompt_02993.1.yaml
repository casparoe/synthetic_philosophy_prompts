  Nyaya epistemology says a valid inference (like 'that mountain has fire because it has smoke') needs vyapti -- an invariable, unconditional link between the reason and what it proves. Nyaya logicians didnt think repeated observation alone gets you there though, they also lean on tarka (basically a reductio ad absurdum move) to rule out hidden conditions (upadhis) and lock down the generalization. So how does this compare to Hume's problem of induction -- does tarka actually give Nyaya a real way out of Hume's circularity worry, or does it just push the problem back a step? Which tradition comes out ahead here in your view, and why?
