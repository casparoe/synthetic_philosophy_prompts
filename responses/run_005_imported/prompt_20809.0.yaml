prompt: |-
  My advisor's retiring after 35-ish years in set theory and I somehow got stuck giving the toast at her dinner next month. She's a total AC true believer, and for as long as anyone can remember she's opened her intro grad course with that old joke (Bona's, I think?) that the axiom of choice is "obviously true," the well-ordering theorem "obviously false," and nobody can say what to think about Zorn's lemma -- even though all three are provably equivalent -- and then spends the semester quietly wrecking you with the equivalence proof. The room's gonna be half set theorists and logicians who'll clock every layer of that, and half aunts, uncles, and old friends who've never heard of a well-ordering in there life. She's also said more than once that anyone who gets misty about "her legacy living on in all of us" without pointing to one concrete example is just making the same non-constructive existence move she's spent her whole career defending, so if I go there the toast kinda has to know what it's doing. Can you write me a 4-5 minute toast built around that joke (or the idea underneath it) that actually lands as a real laugh and a real feeling for both halves of the room -- not just her students smirking while the aunts clap politely -- and feels warm rather than like a logic lecture?
