  For the mixed audience: The humor must land visually for non-experts. Physical gestures could illustrate concepts—miming "choosing" from glasses, mock horror at "ordering relatives by height." Experts will catch deeper references (forcing, independence proofs), but the surface should entertain aunts. The punchline? Reveal the toast itself as a "Zorn’s Lemma moment"—seemingly spontaneous but carefully constructed, much like her teachings. 

  Key risks: Over-explaining logic, or reducing the joke to a gimmick. Solution: Anchor metaphors in human traits (her decisiveness as AC, her career’s unpredictability as a well-order). Finally, subvert her "legacy" critique by citing a concrete student contribution—perhaps the user’s own work—proving her impact isn’t just non-constructive. 

