answer: |-
  Here’s a toast that threads the needle—honoring your advisor’s wit, warming the room, and turning her signature joke into a celebration of her humanity (not just her logic). It runs **~4.5 minutes** and uses physicality/humor to bridge the knowledge gap:

  ---

  **(Clink glass gently. Start warm, conversational.)**  
  "Friends, family, colleagues—and everyone who’s ever survived MATH 615… *[pause for knowing chuckles]*—we’re here for Dr. [Name]. For 35 years, she’s been a force of nature. And if you’ve ever met her, you know two things: she’s fiercely brilliant, and she has *opinions*. Especially about how math *ought* to behave.  

  **(Lean in conspiratorially to the non-math guests.)**  
  "Now, some of you might not know her work. But trust me: she’s legendary for how she started every class. She’d look at a room of terrified grad students and say: *‘The Axiom of Choice? Obviously true.’* *[Gesture confidently, like swiping an apple from a bowl]* You just… pick things! Simple! *‘But the Well-Ordering Theorem?’* *[Shudder dramatically]* ‘*Obviously false!*’ Who believes you can line up *everything*—even, say, Uncle Frank’s record collection *[nod to a relative]*—in some perfect, secret order? Madness! And Zorn’s Lemma? *[Shrug, palms up, bemused]* ‘Who knows?’ Even though—plot twist—they’re all the *same thing*.  

  **(Pivot to the experts with a grin.)**  
  "…And if you just felt half the room tense up? *[Laughter]* That’s the sound of people reliving their first-year trauma. Because she wasn’t *just* joking. She was setting a trap. A beautiful, months-long trap where she’d dismantle your intuition brick by brick, then hand you back the pieces rearranged into something bulletproof. *That* was her magic.  

  **(Soften, shift to heartfelt.)**  
  "But here’s what that joke *really* taught us—and why it matters tonight.  
  1.  **The Axiom of Choice?** That was **her boldness**. She never hesitated. When she saw a path, a problem worth solving? She’d *choose* it. Decisively. Unapologetically.  
  2.  **The Well-Ordering Theorem?** That was **her defiance**. She knew some truths *feel* absurd at first glance. She embraced the weird, the counterintuitive—and dared you to keep up.  
  3.  **Zorn’s Lemma?** *[Smile directly at advisor]* That was **her mentorship**. Mysterious? A little. Powerful? Absolutely. You’d be wrestling with chaos—ideas scattered everywhere, no structure in sight—and then… *poof*. She’d help you find the piece that made order inevitable. Not by giving you the answer, but by showing you how to *build* it.  

  **(Address the room, unifying the metaphor.)**  
  "Tonight might feel a bit like Zorn’s Lemma. How do you sum up 35 years? Infinite contributions, infinite connections… where do you even start? *[Pause]* You start by recognizing the **maximal element** in the room. *[Raise glass to advisor]* The one whose choices shaped careers, whose ‘obviously false’ spirit challenged orthodoxy, and who—when things seemed messy beyond rescue—always, *always* helped us find the chain that led us home.  

  **(Final beat - defuse the "legacy" trap concretely.)**  
  "And because she’d skin me alive for a non-constructive tribute… *[look to advisor, mock-wary]*… here’s one concrete thing she built: My thesis. Page 27, Lemma 3.2. The proof that finally worked? It used *her* exact move from the 1998 paper on [mention brief topic, e.g., ‘forcing in L-like models’]. It’s there. Citeable. Irreducible. Just like her impact on every student, colleague, and friend here.  

  **So raise your glasses:** To Dr. [Name]—who taught us that the deepest truths often hide in the tension between ‘*obvious*’ and ‘*absurd*.’ Thank you for choosing us. Thank you for well-ordering our chaos. And thank you for being the Zorn’s Lemma we never knew we needed. Cheers!"  

  ---

  **Why this works:**  
  - **For Non-Mathematicians:** Uncle Frank’s records, "tense up" room, "skin me alive," and physical gestures make the logic *feel* human. They grasp her *character* (bold, quirky, wise) through the metaphor.  
  - **For Logicians:** Nods to the joke’s structure ("obvious → absurd → mysterious"), the proof process ("dismantle intuition"), and a *real* citation (Lemma 3.2!) satisfy rigor while honoring her teaching.  
  - **Avoids Schmaltz:** The "legacy" is embodied in a *specific* result (your thesis), dodging empty sentiment. The warmth comes from her *methods* (boldness, defiance, guidance), not abstractions.  
  - **Her Vibe:** Celebrates her wit, traps, and disdain for hand-waving. The "maximal element" line is pure set-theory cheek.  

  **Delivery Tips:**  
  - **Pace:** Let the joke land (pause after "obviously false!"), speed up during the "trap" description, slow down for the tribute.  
  - **Eye Contact:** Play to non-math guests during the joke setup, lock in with the advisor during the "Zorn’s Lemma = mentorship" line.  
  - **Cite Smart:** Name a real paper/topic she cares about—even if only 5 people get it, *she* will.  

  This turns her armor (the joke) into a lens for her heart. And proves you *were* paying attention—just don’t let her assign homework after dessert.
