  I'm profiling a theoretical neuroscientist next week who's become the public face of the free energy principle -- the claim that any self-organizing system, from a single cell to a human brain, survives by minimizing its own "surprise" relative to an internal model. Whenever someone asks what would falsify this, he's got a stock dodge: "you're treating a mathematical principle like an empirical hypothesis, that's a category error, ask about a specific process model instead." Give me seven or eight questions that dont let him retreat to that line, including at least one that makes him sit with the dark-room problem (if minimizing surprise is the whole story, why isnt every organism just curled up in a quiet box somewhere), one on why the same math supposedly covering a thermostat, a bacterium, and a brain doesn't just mean it isn't really explaining any of them in particular, and one where he has to commit to a real finding that would count against the theory, not some strawman version of it. For each, flag the dodge he'll probably reach for and give a sharp follow-up that shuts it down.
