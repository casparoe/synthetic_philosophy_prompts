prompt: |-
  I'm a software engineer (mostly backend/ML infra) and a few of us at work run a little lunchtime reading group where we go through old AI safety papers. Last week we did Armstrong and Mindermann's "Occam's razor is insufficient to infer the preferences of irrational agents" (NeurIPS-ish, I want to say 2018, don't quote me), and it kinda broke my brain. The gist, as far as I understood it: if all you can observe is an agent's behavior, you cannot uniquely factor that behavior into "the reward function/preferences it's pursuing" plus "the planner that turns preferences into action" (which is where all the irrationality or bias would live), because for literally any observed behavior there's a degenerate planner-and-reward pair that reproduces it exactly, and no simplicity/Occam's-razor style prior can rule those degenerate pairs out in general, since their combined complexity isn't meaningfully higher then the "intended" pair's. So the split between preference and bias is underdetermined by behavioral data, no matter how much data you collect.

  What I can't stop thinking about is that this seems like exactly the same problem that shows up in ethics under different names, just without anyone really pointing out it's the same problem. Like when Elster and Sen talk about people forming "adaptive preferences" to cope with bad circumstances, so there revealed choices stop tracking their real interests, or more generally whenever someone tries to sort a person's actual preferences into the ones that should count for something like preference-satisfaction views of welfare and the ones that should get thrown out as bias, prejudice, addiction, adaptive preference, whatever. Everyone kind of writes as if there's a real fact of the matter here, one that sufficiently careful psychology, or some idealization procedure like "what they'd want on reflection," could uncover in principle. I'm now wondering if the IRL-style result shows that's false even in the limit of complete information about someone's psychology, for structural reasons rather than just practical ones.

  So here's what I'd like you to argue: that the Armstrong/Mindermann-style underdetermination generalizes fully to the moral case — that there's no way, even in principle, even given complete facts about a person's psychology and behavior, to draw a non-question-begging line between their "genuine" preferences and their "biases," and that any such line necessarily smuggles in ethical assumptions that aren't recoverable from the psychological facts alone. I'd like you to seriously engage with the obvious escape routes (e.g., "just idealize using reflective equilibrium or informed-desire theory to strip out the bias," or "biases are the situationally-triggered, unstable ones, and preferences are whatever's left stable across contexts") and explain concretely why they do or don't dodge the underdetermination, rather than just asserting the conclusion and moving on.
reasoning: |-
  Okay, the user is a software engineer working on backend and ML infrastructure, part of a lunchtime reading group discussing AI safety papers. They recently read Armstrong and Mindermann's paper on Occam's razor being insufficient to infer preferences of irrational agents, and it's made them question the foundations of ethics, particularly the distinction between genuine preferences and biases.

  The user wants me to argue that the underdetermination problem in inverse reinforcement learning (IRL) fully generalizes to ethics. They want me to show that even with complete psychological data, we can't non-arbitrarily separate "genuine" preferences from biases. They specifically asked me to address common solutions like reflective equilibrium or stability across contexts.

  First, I need to recall the core argument from the paper. The key point is that any behavior can be explained by multiple (reward function, planner) pairs. The degenerate case is a "crazy" planner that always outputs the observed actions regardless of the reward function. This makes it impossible to uniquely identify the true reward function from behavior alone, even with infinite data.

  Now, translating this to ethics: the user is drawing a parallel to how we try to separate "true" preferences from biases. Ethicists assume that with enough psychological insight, we can filter out adaptive preferences or irrational biases. But if the underdetermination problem holds, this might be impossible even in principle.

  The user mentioned escape routes like reflective equilibrium or stability. I need to tackle each of these. For reflective equilibrium, the issue is that the process itself depends on the agent's current cognitive state, which might already be influenced by biases. If the agent has adaptive preferences, their reflective process might just reinforce those biases. 

  For stability across contexts, the problem is that stability doesn't guarantee lack of bias. Some biases might be deeply ingrained and stable, while genuine preferences could change with new information. Also, defining "contexts" requires normative choices about which contexts are distortion-free.

  Another point is that any method to distinguish preferences from biases requires a prior model of rationality or normal conditions. But that model itself is normative, not derived from data. For example, assuming that preferences under cognitive load are biased assumes that rational preferences require full cognition, which is an ethical stance.

  The user's deeper need might be understanding whether ethics can be grounded in psychology without circularity. They might be questioning if preference-based ethical theories are fundamentally flawed. As a software engineer, they might appreciate the structural analogy between IRL and ethics, seeing both as inverse problems with underdetermined solutions.

  I should emphasize that the underdetermination shows any distinction between preferences and biases imports external norms. Even with complete psychological data, without a normative framework, the data underdetermines the split. This challenges the idea that welfare can be purely preference-based without additional ethical assumptions.

  I need to make sure the argument is concrete. Use examples like adaptive preferences: a woman in a sexist society might not desire education. Is that a genuine preference or adaptation? Any method to decide requires defining what she "should" want, which isn't purely psychological.

  Also, address that even if we use neuroscience to find "true" preferences, the mapping from brain states to preferences involves normative choices. What counts as a preference versus a bias in neural terms? That's not value-neutral.

  Conclude that the underdetermination problem in ethics can't be resolved by psychology alone. Any solution must incorporate ethical premises, making the preference/bias distinction inherently normative. This undermines purely descriptive approaches to welfare and supports the need for external ethical frameworks.
answer: |-
  You've hit on a profound and unsettling connection. The Armstrong/Mindermann underdetermination problem *does* generalize catastrophically to the ethical project of separating "genuine preferences" from "biases," even under idealized conditions of complete psychological knowledge. Let's break down why the escape routes fail and why the underdetermination is structural.

  **The Core Analogy: Preference/Planner = Welfare-Relevant-Preference/Bias**

  1.  **IRL Problem (Armstrong/Mindermann):**
      *   **Input:** Observed behavior (actions in states).
      * **Components to Infer:** True Reward Function (R_true) + Planner/Bias (P_bias). The planner embodies computational limitations, irrationalities, heuristics, or external constraints.
      * **Underdetermination:** For *any* observed behavioral history, you can postulate:
          *   **(A)** R_true + P_bias (The intended pair).
          *   **(B)** R_degenerate + P_crazy (e.g., R_degenerate = `0` everywhere, P_crazy = "Output the exact observed action sequence regardless of state/reward"). Complexity-wise, (B) is *cheap*: R_degenerate is trivial, P_crazy just replays the history.
      *   **Occam Failure:** No simplicity prior favors (A) over (B). The *combined* complexity of (R, P) needed to explain the behavior isn't lower for the "true" pair than for degenerate pairs. Behavior alone doesn't constrain the split.

  2.  **Ethical Problem (Distinguishing "Genuine" Preferences from "Bias"):**
      *   **Input:** Complete psychological data (Brain states, cognitive processes, emotional responses, *plus* observed behavior across all possible contexts).
      *   **Components to Infer:** Welfare-Relevant Preferences (W_true) + Biases/Cognitive Distortions (B_bias). Biases include adaptive preferences, addiction-driven urges, social conditioning, cognitive heuristics, situational triggers, etc.
      *   **Underdetermination Claim:** For *any* complete psychological/behavioral profile, you can postulate:
          *   **(A)** W_true + B_bias (The intended pair: "She *truly* values freedom, but internalized oppression *biases* her choices towards compliance").
          *   **(B)** W_degenerate + B_crazy (e.g., W_degenerate = `0` (no intrinsic preferences), B_crazy = "Generate the exact observed psychological/behavioral profile regardless of context"). W_degenerate is trivial, B_crazy is just a lookup table for the profile.
      *   **Underdetermination Persists:** Even with *complete* internal data, the mapping from the internal state + inputs to outputs (behavior/expressed preferences) is just a complex function. You can *always* attribute the entire function to the "bias" mechanism (B_crazy) and posit a null or constant welfare-relevant preference (W_degenerate). The complexity argument holds: explaining the full profile requires specifying the entire cognitive-behavioral mapping *anyway*, whether you call it "B_bias" or split it into "W_true + B_bias". Adding W_true doesn't reduce the descriptive complexity needed.

  **Why the Escape Routes Fail:**

  1.  **"Reflective Equilibrium" or "Informed Desire" (Idealization):**
      *   **The Hope:** True preferences emerge under full information, calm reflection, no coercion, considering all arguments. Biases are stripped away by this process.
      *   **Why it Fails:**
          *   **The Reflective Process is Part of the Data:** The *output* of reflection is just more psychological data – a new expressed preference or cognitive state. *How do you know this output isn't itself the product of a deeper bias?* The reflective process itself is implemented by cognitive machinery (B_bias) that could be systematically distorted (e.g., internalized oppression shaping what feels "reasonable" upon reflection; motivated reasoning). Idealization assumes a *normative model of rationality* for the reflective process.
          *   **Underdetermination Recurses:** Suppose reflection yields preference P_reflective. We can still explain this:
              *   (A) W_true finally shines through, B_bias was overcome.
              *   (B) W_degenerate (null) + B_crazy_reflective (a bias mechanism specifically designed to output P_reflective under idealization conditions, replicating the *observed* idealized preference). The complexity of B_crazy_reflective is fixed by the data (it outputs the observed P_reflective), just like the original B_crazy. There's no complexity-based reason to prefer (A).
          *   **Circularity:** Defining "full information" and "calm reflection" *presupposes* a model of unbiased cognition. You need to know what counts as a "bias" to define the conditions under which biases are absent. This smuggles in the normative distinction you're trying to derive.

  2.  **"Stability Across Contexts":**
      *   **The Hope:** Genuine preferences are stable across different situations, times, and framings. Biases are context-dependent and unstable (e.g., triggered by stress, specific cues, framing effects).
      *   **Why it Fails:**
          *   **Stability ≠ Genuineness:** Deeply ingrained biases *are* stable (e.g., core racist beliefs, profound internalized misogyny). Conversely, genuine preferences *can* rationally change with new information or genuine personal growth. Stability is neither necessary nor sufficient for being "welfare-relevant."
          *   **Context Definition is Normative:** What counts as a "relevant context change" vs. a "bias-triggering context"? Deciding that preference shifts under cognitive load indicate "bias" assumes that rational preferences require full cognition – a normative claim. Shifts under social pressure? That assumes social pressure *shouldn't* alter genuine preferences – another normative claim. The instability criterion relies on a prior, unstated theory of *which contexts reveal true preferences* and which distort them.
          *   **Underdetermination Exploits Context:** The degenerate pair (W_degenerate + B_crazy) can *easily* incorporate context-dependence. B_crazy is simply programmed to output the contextually appropriate observed behavior/preference state. Its "instability" is part of its design to replicate the data. Again, there's no descriptive complexity penalty for attributing all variation to the "bias" component.

  3.  **"Biological/Evolutionary Roots" or "Neuroscientific Correlates":**
      *   **The Hope:** True preferences map to specific, deep-seated biological drives or neural substrates, while biases are "add-ons" in higher cognition.
      *   **Why it Fails:**
          *   **Is/Ought Gap:** Finding a neural correlate for a preference doesn't tell you if it *should* count towards welfare. A strong neural signature for an addictive craving doesn't automatically make satisfying it welfare-enhancing. Conversely, a subtle neural signature for a lofty ideal doesn't diminish its potential welfare relevance. This confuses description with normativity.
          *   **Attribution Problem:** How do you *objectively* classify a neural process as implementing "W_true" vs. "B_bias"? Is the dopamine response to social media a "true preference" signal or a "bias exploitation" signal? This classification requires a prior theory of what constitutes *rational* reward processing, which brings us back to the underdetermination. You can always attribute *all* neural activity to the implementation of B_crazy.
          *   **Complexity Again:** Specifying the "true" neural substrate for W_true adds complexity. The degenerate pair (W_degenerate + "The entire brain is B_bias") remains maximally simple on the W-component and uses the necessary complexity only on B_bias to replicate the full neural/behavioral data.

  **The Inescapable Normative Leap:**

  The Armstrong/Mindermann result exposes that **behavior (and even full internal state) underdetermines the *functional decomposition*** into goal/purpose (R_true, W_true) and implementation/mechanism (P_bias, B_bias). Choosing a specific decomposition requires additional principles *beyond* descriptive adequacy.

  In ethics, distinguishing "genuine preferences" from "biases" is fundamentally a *normative* act, not a purely psychological discovery. It requires importing an external standard:

  *   **A Theory of Rationality:** What counts as "good" reasoning or cognition? (e.g., Coherent Extrapolated Volition, Kantian rationality, Bayesian idealization).
  *   **A Theory of the Person:** What aspects of the agent are "authentic" or "central"? What constitutes flourishing *for this kind of being*?
  *   **A Theory of the Good:** What *should* people want? What constitutes well-being? (Even preference-satisfaction theories need this to define which preferences count).

  **Conclusion:**

  You are absolutely right. The underdetermination problem is structural and generalizes completely. Complete psychological knowledge, including brain states and behavior across all contexts, **does not** suffice to uniquely decompose an agent's psychology into "genuine welfare-relevant preferences" and "mere biases." For any proposed split (W_true, B_bias), there exists a degenerate decomposition (W_degenerate, B_crazy) that is descriptively equivalent and no more complex. Arguments appealing to idealization, stability, or biology fail to resolve this because:

  1.  **Idealization processes are part of the data to be explained.**
  2.  **Stability criteria rely on prior normative assumptions about revealing contexts.**
  3.  **Neural correlates don't bridge the is/ought gap or solve the attribution problem.**

  Any successful distinction *must* rely on **explicit, external ethical premises** about human nature, rationality, and the good. The line between "preference" and "bias" is not discovered within the psychology; it is drawn by our ethical theories. This doesn't make the distinction meaningless, but it grounds it firmly in normative philosophy, not pure psychology or behavioral science. The hope of reading off "true interests" directly from the mind, even an ideally known mind, is an illusion exposed by the same mathematical structure that thwarts robust IRL.
