  On Donnellan, the real thorn is misdescription cases. If I say "the martini drinker" pointing at someone with water, why isn't the semantic content just false? The guest will likely invoke speaker's reference vs. semantic reference, so the follow-up must question whether this distinction is ad hoc. Does it merely preserve Russell's theory by fiat?

