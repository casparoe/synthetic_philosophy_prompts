prompt: |-
  So this semester my school is piloting a new thing called Peer Panels -- basically instead of getting written up for stuff like cheating on a quiz or dress code and phone violations, you go in front of a small group of fellow students who talk it over with you and decide the consequence (community service, written reflection, whatever) instead of it going straight to the assistant principal. I'm the only sophomore on the student government committee that has to actually write the rules before the pilot launches in three weeks, and we're deadlocked on panel size and how panelists get picked. It somehow turned into an argument about the Condorcet Jury Theorem, which one of the policy debate kids brought up, and I tried reading about it myself last night and now I'm even more confused than before.

  Here's the actual disagreement: the debate kid says its basically mathematically proven that bigger panels chosen totally at random beat small ones, so we should just pull like 15 names out of a hat every time. The kids who did mock trial want the opposite -- small panels of 3 or 4 people who've actually been trained for this, since they think random sophomores won't be any good at figuring out what actually happened or what's fair. There's also beef over whether panelists should each write down their decision privately before talking, or just hash it out loud as a group, which the teacher running the pilot said "changes whether the theorem even applies" but wouldn't explain further. And I don't think anyone's noticed that "what happened" and "what's a fair consequence" aren't the same kind of question -- one has a real answer and the other kind of doesnt -- which feels like it should matter for which parts of this the theorem can even speak to.

  Can you write the memo I'm bringing to our meeting Thursday? I need an actual recommendation -- panel size, how people get selected, and whether/when they deliberate together versus vote independently -- not just a list of pros and cons for each side. If you think we should build in some kind of check after the pilot's first few panels to see whether it's actually working, say when that should happen and what we'd be looking for. And please take the "big random panel" argument seriously on its own terms instead of just shooting it down, since half the committee will get defensive if it reads like we're just dismissing it.
reasoning: |-
  Okay, the user is part of a student government committee setting up Peer Panels at their school. They're stuck on panel size, selection, and deliberation methods. The debate kid cites the Condorcet Jury Theorem to argue for large random panels, while mock trial students prefer small trained panels. The user is confused about how the theorem applies and needs a clear recommendation for their meeting.

  First, I need to unpack the Condorcet Jury Theorem. It states that for binary decisions, if each voter is more likely to be correct than wrong (p > 0.5), larger groups will make better decisions. But if p < 0.5, bigger groups are worse. The theorem assumes independent votes and identical competence. The user mentioned that "what happened" (fact-finding) and "what's fair" (consequence) are different. The theorem might apply to fact-finding but not to fairness decisions, which are more subjective.

  The user's deeper needs include resolving the committee deadlock with a solution that respects both sides. They want the memo to take the theorem seriously but also address its limitations. They also need practical steps for the pilot, like how to evaluate success later. The memo must avoid dismissing the debate kid's argument to prevent defensiveness.

  Next, considering the school context: Peer Panels handle issues like cheating or dress code violations. Fact-finding requires discerning truth, while consequences involve fairness and restorative justice. Random panels might be okay for facts if students are generally competent, but training could improve consistency. For consequences, group discussion might be better to explore different perspectives.

  For panel size, a compromise between 5 and 7 makes sense. It's large enough to benefit from collective wisdom but small enough to manage. Selection should balance randomness with training. Maybe a pre-trained pool selected randomly, ensuring diversity. Training should focus on both fact-finding and fairness principles.

  Deliberation method: Start with private votes on facts to apply the theorem's benefits, then group discussion for consequences. This addresses both aspects. For the pilot, collect data on case types, decision times, and participant feedback. Review after 5-7 cases to adjust as needed.

  The user might also be concerned about implementation feasibility. Training resources and time are factors. Staggered training sessions could help. Ensuring diverse representation in the pool is important to avoid bias. The memo should present this as a pilot adjustment, emphasizing flexibility based on initial results.
answer: |-
  **MEMORANDUM**  
  **TO:** Peer Panel Design Committee  
  **FROM:** [Your Name], Sophomore Representative  
  **DATE:** October 26, 2023  
  **SUBJECT:** Resolution on Panel Structure & Deliberation Process — Balancing Theory, Practicality, and Fairness  

  ### **1. Core Recommendation**  
  After evaluating the Condorcet Jury Theorem (CJT) arguments, procedural fairness, and operational feasibility, we propose:  
  - **Panel Size:** **5–7 students** per case.  
  - **Selection Process:** **Random selection from a pre-trained, stratified pool** of 30–40 students (demographically reflective of the school).  
  - **Deliberation Method:** **Hybrid approach** — private votes on *factual determinations* (e.g., "Did cheating occur?") followed by group discussion for *consequences* (e.g., "What is a fair response?").  

  This model respects CJT’s insights while addressing its limitations, ensures consistency, and mitigates bias.  

  ---

  ### **2. How We Reached This Recommendation**  
  We take the Condorcet argument seriously. CJT *does* mathematically prove that for **binary factual questions** (e.g., "Did Student X violate Rule Y?"), larger groups of independently voting members with >50% individual accuracy outperform smaller groups. However, CJT **does not apply** to:  
  - Non-binary questions (e.g., "What consequence is fair?").  
  - Situations where voter competence is <50% (e.g., untrained students misapplying rules).  
  - Group deliberations without independent voting (groupthink can reduce accuracy).  

  Thus, we split our design to align with CJT where applicable and deviate where necessary:  

  | **Issue Type**       | **CJT Applies?** | **Our Approach**                              |  
  |----------------------|------------------|-----------------------------------------------|  
  | Factual Determination| Yes (binary)     | Private vote *before* discussion (CJT ideal) |  
  | Consequence          | No (subjective)  | Group discussion (leverages diverse perspectives) |  

  ---

  ### **3. Detailed Breakdown**  
  #### **A. Panel Size: 5–7 Students**  
  - **Why not 15 (per CJT)?**  
    - CJT assumes voter independence and competence. At our scale, 15 untrained/random students risk:  
      - **Logistical chaos**: Scheduling, coordination, and confidentiality challenges.  
      - **Diminished engagement**: Larger groups silence quieter voices.  
      - **Competence concerns**: CJT fails if average accuracy is <50%. Without training, random students may misinterpret evidence.  
  - **Why not 3–4?**  
    - Too small to benefit from CJT’s "wisdom of crowds" for factual questions.  
    - Over-reliance on individual judgment increases inconsistency.  
  - **Why 5–7?**  
    - Mathematically robust: For a group with 55% individual accuracy (achievable via training), 5–7 members yields >70% group accuracy (per CJT calculations).  
    - Operationally manageable: Fosters focused discussion while ensuring diversity of thought.  

  #### **B. Selection Process: Stratified Random Pool**  
  - **Step 1**: Recruit 30–40 volunteers (stratified by grade, gender, ethnicity, and extracurriculars) via open sign-ups.  
  - **Step 2**: Mandate **one 3-hour training session** covering:  
    - Evidence evaluation (e.g., witness statements, timestamps).  
    - Bias mitigation (e.g., recusal protocols).  
    - Restorative justice principles (for consequence phase).  
  - **Step 3**: For each case, **randomly select 5–7 panelists** from this pool.  
  - **Why this works**:  
    - **CJT Compliance**: Random selection preserves independence; training ensures competence >50%.  
    - **Fairness**: Stratification avoids panel homogeneity; training standardizes baseline skills.  
    - **Efficiency**: Pre-trained pool avoids ad-hoc recruitment delays.  

  #### **C. Deliberation Method: Hybrid Vote → Discuss**  
  1. **Fact-Finding Phase (Private Vote)**:  
     - Panelists review evidence and **privately vote** "yes/no" on whether a violation occurred.  
     - *CJT Basis*: Independent votes maximize factual accuracy for binary questions.  
  2. **Consequence Phase (Group Discussion)**:  
     - Panelists discuss appropriate consequences **openly**, considering context, intent, and restorative outcomes.  
     - *Deviation Rationale*: Fairness is nuanced — discussion surfaces creative solutions (e.g., "community service + apology letter").  

  ---

  ### **4. Pilot Evaluation Protocol**  
  To ensure data-driven improvements, we will:  
  - **Review after 5–7 cases** (or 4 weeks, whichever comes first).  
  - **Metrics to track**:  
    - **Factual Accuracy**: Compare panel decisions with available evidence (e.g., security footage, teacher reports).  
    - **Consequence Consistency**: Audit if similar violations receive similar outcomes.  
    - **Participant Feedback**: Surveys of accused students, panelists, and teachers.  
    - **Time Efficiency**: Average time per case vs. traditional disciplinary process.  
  - **Adjustments**: If factual accuracy is <70%, increase training or panel size. If consequences are inconsistent, add consequence guidelines.  

  ---

  ### **5. Why This Balances Both Sides**  
  - **Respects CJT Argument**: Uses random selection + private voting for factual decisions, leveraging CJT’s math where valid.  
  - **Addresses Mock Trial Concerns**: Training ensures competence; small groups enable skilled deliberation.  
  - **Acknowledges "Two Questions" Issue**: Separates fact-finding (CJT-applicable) from consequence (non-CJT).  

  ---  
  **VOTE RECOMMENDATION**: Adopt the 5–7 person stratified random pool model with hybrid deliberation. This is a pilot — we commit to reevaluate after 5 cases using concrete metrics. Let’s build a system that’s both mathematically sound and humanly fair.  

  **APPENDIX**: Condorcet Jury Theorem simplified summary (for committee discussion) attached.
