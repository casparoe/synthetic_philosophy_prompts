answer: |-
  ## Eulogy for Miriam: Time, Tigers, and Love

  [Take a breath, look out at the gathering]

  Thank you all for being here, for Miriam. To our family, our friends, Miriam’s beloved colleagues, her students past and present – your presence is a comfort she would deeply appreciate. Many of you know Miriam wore many hats: brilliant professor, devoted mother, grandmother, my partner in life… and my most cherished philosophical sparring partner.

  For over thirty years, Miriam lived and breathed Latin American literature. But one text held a special, enduring fascination: Jorge Luis Borges’s essay, "A New Refutation of Time." Some of you know it intimately; others might be hearing the title for the first time. That’s okay. Because Miriam’s love for it wasn’t just academic; it was deeply personal, and it speaks to something fundamental about how she moved through the world.

  Borges, in that essay, performs a kind of intellectual high-wire act. With meticulous care, borrowing from philosophers like Hume and Berkeley, he builds an argument that time, as we fiercely experience it – this relentless, linear *succession* of moments – might not be fundamentally real. If there’s no enduring "self" or solid "matter" for time to happen *to*, Borges suggests, then perhaps this flow we feel is… an illusion. A trick of perception.

  [Smile gently] Now, as a physicist who spent his career wrestling with time’s arrow in thermodynamics, particularly entropy – that measure of increasing disorder – I couldn’t resist. For years, across the kitchen table, I’d playfully needle her: "But entropy, Miriam! The universe unfolds in one direction! Doesn’t *that* settle it? Doesn’t physics prove time’s real?" And Miriam, with that patient, knowing look she reserved for my philosophical enthusiasms, would invariably reach for her worn copy of Borges. Not to rebut me point-by-point, but to flip to the *very end*.

  Because Borges, after constructing this intricate, almost air-tight argument against time, does something extraordinary. He collapses it. He confesses it doesn’t *save* him. He writes: "And yet, and yet… Denying temporal succession, denying the self, denying the astronomical universe, are apparent desperations and secret consolations… It is no less arduous for me to think of the universe as unreal than to think of it as real… Time is the substance I am made of. Time is a river which sweeps me along, but I am the river; it is a tiger which destroys me, but I am the tiger; it is a fire which consumes me, but I am the fire."

  **"The world, unfortunately, is real."**

  Miriam treasured that ending above all else in Borges. She called it his one truly honest paragraph. Why? Because it wasn’t an escape hatch. It was a profound, humble admission. The intellectual argument, however elegant, however logically compelling, *couldn’t dissolve the lived reality*. He was still *in* it. Still swept by the river, still facing the tiger, still feeling the fire. The world, in all its messy, painful, beautiful succession, remained stubbornly, "unfortunately," real.

  Miriah understood that honesty. She saw the deep courage in Borges staring down his own elegant logic and admitting its ultimate powerlessness against the raw fact of *being*. The argument didn’t negate the experience; it merely framed its profound mystery.

  So, why did she love this essay so fiercely? I think it resonated with her own clear-eyed view of existence. Miriam possessed an incredible intellectual rigor – she could dissect arguments, appreciate complex structures, challenge assumptions. But she also possessed an even deeper emotional honesty. She never sought easy answers or cheap comforts. She understood that life, like Borges’s essay, holds both breathtaking intellectual possibility *and* the undeniable, often difficult, weight of the real.

  To stand here today, just two weeks after her passing, and try to use Borges’s *argument* to tell you all that time isn’t real, so Miriam isn’t really gone… well, she’d see right through that. Instantly. It would be precisely the kind of evasion that final paragraph rejects. It would disrespect the very honesty she admired.

  The river of time *feels* terribly real right now. The tiger of loss has taken a fierce swipe. The fire of grief burns. We feel the brutal succession: Miriam was here, vibrant, arguing, loving, teaching… and now she is not physically here. Borges’s logic doesn’t erase that ache. Physics doesn’t negate that void. To pretend otherwise would be to dishonor the reality Miriam cherished, even in her fascination with its potential unreality.

  But here’s the thing Miriam also knew, and what Borges’s honest collapse points towards: **If the world is "unfortunately real," it is also, profoundly, *meaningfully* real.** The river carries more than just loss; it carries the indelible currents she created. The tiger’s power speaks also to the fierce love and intellect she possessed. The fire that consumes also illuminates.

  The reality of time means we experienced Miriam. We learned from her. We were shaped by her passion for literature, her sharp wit, her unwavering love. The reality of time means those experiences – the sound of her laughter explaining García Márquez, the intensity in her eyes discussing Borges, the warmth of her hand in mine – are not illusions. They *happened*. They are woven into the fabric of who we each are.

  The argument may question time’s foundation, but it cannot touch the *substance* she left behind: the students she inspired who will carry her insights forward; the family she nurtured whose love continues to bind us; the memories etched into our hearts with such vivid detail they feel present even now.

  Miriam didn’t find ultimate comfort in Borges’s refutation of time. She found profound respect in his *surrender* to reality. Her comfort, and ours, lies in embracing that reality fully. It lies in acknowledging the searing pain of her absence *because* her presence was so brilliantly, beautifully real. It lies in knowing that while the river flows onward, the water she stirred continues to move within it. While the tiger stalks, the echo of her roar remains. While the fire burns, the light she cast continues to show us the way.

  She was real. Our love for her is real. Our loss is real. And the enduring mark she left on this stubbornly real world – that is the truest refutation of oblivion. That is her lasting victory over the river, the tiger, and the fire.

  Thank you, Miriam, for your brilliant mind, your honest heart, and for sharing the journey within this beautiful, difficult, real world with us all. We carry you with us, always.
