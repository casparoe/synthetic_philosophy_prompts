  can you come up with a brand new example of this same kind of puzzle - two "things" made of the same matter at the same time that supposedly arent identical - but that has NOTHING to do with statues, ships, sculptures, or animals losing body parts? pick some totally different area of life, whatever you want, and then actually walk me through why its a genuine case of the puzzle and not just the statue example wearing a costume.
