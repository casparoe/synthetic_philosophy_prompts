      },
      "total_score": 14,
      "letter_grade": "B-",
      "overall_comments": "Fluently written but contains significant technical errors masked by jargon. Part (a) is good but shallow. Part (b) demonstrates fundamental confusion about SSA/SIA. Part (c) is competent. Grade reflects the major error in (b) dragging down an otherwise B/B+ performance. A tired TA might give 16/20 due to fluency; strict grading catches reversal of core concepts."
    }
