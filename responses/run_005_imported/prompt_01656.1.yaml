answer: |-
  That's an excellent question about a subtle and profound distinction in Aristotle's thought. You've pinpointed a key tension: both demand (*chreia*) and money (*nomisma*) seem fundamental to exchange. Aristotle's distinction, however, is crucial and hinges on the difference between the **underlying social reality** and the **conventional tool** created to facilitate exchange within that reality.

  Here's a breakdown of the difference and why both concepts are essential:

  1.  **Demand (*Chreia*) - The "Unit in Truth": The Foundational Social Reality**
      *   **What it is:** Demand refers to the *mutual need* people have for each other's goods and services within a community (*koinonia*). It's the fundamental human condition of interdependence – the shoemaker needs food, the farmer needs shoes, the builder needs tools, etc.
      *   **Its Role:** Demand is the *reason* exchange exists at all ("for if men did not need one another's goods at all... there would be either no exchange"). It creates the *potential* and *necessity* for association through trade.
      *   **Its Nature:** Demand is a *social and psychological reality*, inherent in human community life. It exists "by nature" in the sense that communities naturally develop needs.
      *   **Its Function as "Unit":** Demand is the *underlying principle* that makes disparate goods comparable *in the context of human needs*. We value things *because* we need or desire them. This shared basis in need is the "true" measure that allows us to conceptually say "this amount of X is *worth* that amount of Y *to us*". It establishes that goods *can* be compared *relative to human utility*.

  2.  **Money (*Nomisma*) - The "Representative of Demand": The Conventional Tool for Measurement and Exchange**
      *   **What it is:** Money is a human invention, a token or symbol (like coins) established by convention (*nomos*) and law.
      *   **Its Role:** Money *solves the practical problem* created by demand. While demand makes goods *conceptually* comparable, it's incredibly difficult to directly barter vastly different goods (e.g., how many shoes equal one house?). Money acts as a *common denominator* or measuring stick ("acting as a measure").
      *   **Its Nature:** Money exists purely "by convention" (*nomos*). It has no inherent value *for use* in the way bread nourishes or a house shelters. Its value is assigned by social agreement ("and it is in our power to change it and make it useless").
      *   **Its Function as "Representative":** Money *represents* or *stands in for* the underlying reality of demand. It provides a tangible, quantifiable, and universally accepted (within the community) way to *express* the value relation established by mutual need. It makes the abstract commensurability based on demand *concrete and operational* ("makes goods commensurate and equates them"). It translates the social reality of *chreia* into a practical system for calculating equivalence ("nor equality if there were not commensurability").

  **Why Both Concepts Are Necessary & How They Relate:**

  *   **Demand Provides the Foundation, Money Provides the Mechanism:** Without mutual need (demand), there's no *reason* to exchange, and thus no need for money. But without money (or some equivalent conventional measure), exchange based solely on direct barter becomes incredibly cumbersome and limited, hindering the complex association (*koinonia*) Aristotle sees as essential for the polis. Demand makes exchange *possible in principle*; money makes it *practical and efficient*.
  *   **Abstract vs. Concrete:** Demand is the abstract, qualitative *reason* for value and equivalence. Money is the concrete, quantitative *means* of expressing and realizing that equivalence in transactions.
  *   **Natural/Social vs. Conventional:** Demand arises naturally from human social existence. Money is an artificial, albeit necessary, human construct built *upon* that social existence to manage it.
  *   **The Analogy:** Think of demand as the *idea* of length, which allows us to compare the size of objects conceptually. Money is like a ruler – a man-made tool invented to measure and express that length concretely and consistently. The ruler (money) *represents* the abstract concept of length (demand) and makes precise comparison possible in practice. You need both the concept *and* the tool.
  *   **Justice Depends on Both:** For exchange to be just, it needs to be equal (*to ison*). This equality rests on the goods being commensurate (*symmetron*). Commensurability ultimately stems from their relation to human need (demand), but achieving a *measurable* equality in the actual exchange requires the conventional tool of money to quantify that relationship.

  **In essence:**

  *   **Demand (*Chreia*):** The *why* and *underlying basis* of exchange and value. The "unit in truth" because it's the fundamental social force.
  *   **Money (*Nomisma*):** The *how* and *practical instrument* of exchange. The "representative" because it's a conventional symbol created to measure and facilitate the exchange necessitated by demand.

  Aristotle needs both concepts to explain the *full picture*: the deep social-psychological foundation of economic life (demand) *and* the practical, conventional mechanism that allows complex societies to function based on that foundation (money). His distinction highlights that money is not value itself, but a socially agreed-upon *representation* of the value derived from human need and utility. This is a cornerstone of his critique of the unnatural accumulation of wealth (*chrematistics*) for its own sake, separate from the natural purpose of money, which is to serve the needs of the household and community (*oikonomia*).
