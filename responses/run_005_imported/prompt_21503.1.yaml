  The advocate's point about "cancelling her standing as a person" is crucial. They argue that enforcing the directive ignores her current capacity, effectively treating her as non-autonomous during episodes. But the patient's directive explicitly states that her manic self isn't the self she wants making decisions. This tension between past and present autonomy needs careful balancing.

  Decision theory offers insights. A money-pump scenario shows how inconsistent preferences can lead to exploitation. Here, the patient's stable self prefers treatment during mania to avoid losses, but her manic self refuses. Without binding commitments, she's stuck in a cycle of harm. Sophisticated choice might involve her anticipating the manic self's refusal and setting irreversible mechanisms. Resolute choice would mean adhering to the original plan despite changed preferences. The patient's directive resembles a resolute approach, committing in advance to avoid future pitfalls.

  For the recommendation, enforcing the directive aligns with her long-term values and prevents repeated harm. It respects her autonomy as defined over time, not just in the moment. However, the committee must ensure the directive's conditions are met and that revocation procedures were followed. Since she hasn't revoked it while stable, and her psychiatrist confirms, the directive should be upheld.

  Policy-wise, the hospital needs clear guidelines for Ulysses clauses. Requirements should include specificity of triggers, psychiatric verification of stability when signed, and revocation protocols. Also, capacity assessments during episodes must be contextual, recognizing that decisional capacity doesn't override prior autonomous choices designed to protect the patient.

  Addressing the advocate's concern: Enforcing the directive doesn't negate her personhood but respects her extended autonomy. It acknowledges that identity persists over time, and her stable self's decision is valid. The committee should affirm that such clauses are exceptions, not precedents for overriding current wishes without proper documentation.

  The draft opinion must be concise, recommend immediate enforcement, outline policy elements, and validate the advocate's point while explaining why the directive takes precedence here. Highlighting the patient's repeated cycles and explicit reasoning can justify this as a protective measure rooted in her own values.
answer: |-
  ## Committee Opinion: Ulysses Directive Case (Patient X)

  **To:** Ethics Consultation Committee Members  
  **From:** [Your Name/Committee Chair]  
  **Date:** [Date]  
  **Subject:** Urgent Recommendation & Policy Considerations for Patient X's Ulysses Directive  

  **I. Case Summary & Core Ethical Conflict:**  
  Patient X, with severe Bipolar I Disorder, executed a valid Psychiatric Advance Directive (PAD) 18 months ago while euthymic, witnessed by her psychiatrist. It includes a specific "Ulysses clause" triggered by defined manic symptoms (severe insomnia, excessive spending, sustained medication refusal). The directive mandates hospitalization and medication *over her contemporaneous objections* during such episodes. Revocation is only permitted in writing during stability with psychiatrist concurrence. Patient X is now experiencing an episode meeting all trigger criteria. A formal capacity assessment finds her capable *at this moment* of understanding, reasoning, and expressing a coherent refusal of treatment ("medication takes away the productive me," "past self shouldn't decide"). Her sister (designated proxy) demands directive enforcement, citing ongoing harm (financial loss). Her court-appointed advocate argues enforcing the directive against her capable refusal negates her personhood and autonomy.

  **II. Recommendation: Honor the Ulysses Directive (Immediate Hospitalization & Treatment)**  
  The Committee recommends **immediate implementation of Patient X's Ulysses directive**, overriding her current refusal, for the following reasons:

  1.  **Upholding Precedent Autonomy & Identity:** The directive represents Patient X’s deeply considered, stable self-conception and values ("a self I don't want making decisions for me"). Honoring it respects her autonomy *over time* and her explicit wish to protect her long-term life goals (preserving relationships, livelihood) from the severe, recurrent harm she associates with untreated mania. Her capacity *now* exists within a state she herself defined as distorting her values and judgment.
  2.  **Meeting Validity Thresholds:** The directive is highly specific regarding triggers, executed with psychiatric oversight during stability, and includes a stringent revocation process (not invoked). It precisely anticipated the current scenario.
  3.  **Preventing Documented Harm & Preserving Future Agency:** Her history demonstrates the severe consequences of untreated episodes (lost marriage, job). Enforcing the directive is the mechanism she chose to *preserve* her future capacity for autonomous decision-making in a stable state, preventing the very destruction of agency she fears. Waiting risks irreversible damage.
  4.  **Decision Theory Insight (Resolute Choice):** Patient X acted as a "resolute chooser." While her manic self exhibits "sophisticated" preferences (refusing treatment based on current feelings), her stable self made a resolute commitment to bind her future manic self, recognizing that *only this binding prevents a "money pump" cycle* of repeated, severe self-harm. Respecting this resolute commitment is rational and protective of her overall life plan.
  5.  **Distinguishing from Ordinary Involuntary Commitment:** This is not a standard capacity/involuntary treatment decision. It is the fulfillment of a patient's *own* advance plan, designed specifically because standard commitment thresholds (imminent danger) often fail to capture the insidious, destructive trajectory of her mania before it's too late.

  **Action Required:** Notify the attending physician and treatment team to proceed with hospitalization and administration of prescribed mood stabilizers per the directive, overriding Patient X's current objections. Inform the sister (proxy) and advocate immediately.

  **III. Addressing the Advocate's Profound Objection:**  
  The advocate's concern – that enforcing the directive against a capable refusal "cancels her standing as a person" – is valid and serious. It forces us to confront the nature of personal identity and autonomy over time. Our recommendation does *not* negate this concern; it navigates it by prioritizing a different conception of personhood:

  *   **Personhood as Extended Narrative:** Patient X defines her personhood not solely by her momentary capacity, but by her enduring values, life narrative, and desire for continuity. Her directive argues that the "person" she is *right now* (manic) is not the self she identifies with as her authentic agent. Enforcing the directive upholds the personhood defined by her stable narrative.
  *   **Temporal Sovereignty:** This upholds the principle that a person can exercise sovereignty over their *future* states when they reasonably anticipate a temporary, severe impairment of the judgment necessary to protect their core values and existence. It recognizes autonomy as temporally extended.
  *   **Exception, Not Rule:** This does not negate the presumption favoring contemporaneous capable decisions *in general*. It affirms a specific, carefully circumscribed exception based on documented history, valid prior instructions, and the unique nature of the impairment (where capacity exists *despite* severe value distortion and predictable catastrophic consequences).

  **IV. Recommended Standing Hospital Policy on Ulysses Clauses:**  
  This case necessitates formal policy. The Committee recommends adoption of a policy requiring Ulysses clauses in PADs to meet strict criteria for enforceability:

  1.  **Specificity:** Triggers must be objective, measurable, and clinically significant (e.g., specific symptom duration, behavioral thresholds, medication refusal documented over X days).
  2.  **Psychiatric Verification:** Execution and any revocation *must* include formal verification of euthymia/stability by the treating psychiatrist (or an independent psychiatrist if contested), documented in the medical record.
  3.  **Revocation Protocol:** Revocation clauses must be explicit and require formal psychiatric verification of stability *during* the revocation attempt. Revocation during an episode meeting trigger criteria is invalid.
  4.  **Designated Proxy:** A named proxy must be designated in the directive.
  5.  **Capacity Assessment Context:** During a triggered episode, a capacity assessment remains crucial *but is interpreted contextually*. Capacity regarding treatment refusal *does not automatically override* a valid Ulysses directive. The assessment informs the committee's understanding of the current state but does not negate the prior directive meeting policy criteria. The core question shifts from "Can she refuse now?" to "Does her valid prior instruction mandate action now?"
  6.  **Ethics Consultation Mandatory:** Any decision to invoke or override a Ulysses clause meeting policy criteria requires full Ethics Committee review.

  **V. Conclusion:**  
  Patient X provided us with clear instructions born of painful experience, designed to protect her from a state she knew would compromise her true values. Her current capable refusal is a predicted symptom of the very condition the directive was meant to address. Honoring her resolute choice, embedded in a valid directive, is the most profound way to respect her autonomy *as she defined it* and prevent the third devastating loss she feared. We recommend immediate action per the directive and the establishment of a formal policy framework to ensure such profound decisions are made with rigorous safeguards in the future.
