prompt: |-
  I am putting together a graduate seminar on formal epistemology, and this week's session pairs I. J. Good's 1967 paper, "On the Principle of Total Evidence," with some applied readings on disclosure policy. As I understand the theorem Good proves there, for a Bayesian agent facing a fixed decision problem, the expected utility of consulting a piece of cost-free evidence before acting can never be lower than the expected utility of acting without it: free information, properly used, is never harmful in expectation. This looks to me like a strikingly clean, decision-theoretic vindication of transparency norms quite generally. Mandatory disclosure requirements in finance, pre-registration of clinical trials, and "sunshine" rules for regulatory rule-making all look like straightforward instances of exactly the free-information-before-a-decision structure that Good's proof covers, so it would seem to follow that any resistance to such requirements must ultimately rest on something other than the effects of information as such — protecting incumbents, say, or paternalism about people's capacity to cope with bad news — rather than any genuine decision-theoretic cost of the disclosure itself.

  What has been nagging at me is that actual policy does not behave as though this were settled. The 2008 Genetic Information Nondiscrimination Act bars American health insurers and employers from requiring or using an applicant's genetic test results, and the British insurance industry has operated for more than two decades under a voluntary arrangement with government — originally a moratorium, since 2018 the Code on Genetic Testing and Insurance — under which insurers do not ask most applicants to disclose existing predictive genetic test results. In neither case is the restriction presented as a regrettable compromise against an otherwise desirable free flow of information; keeping the information out of the underwriting decision is treated as the whole point of the policy. Before I present Good's theorem to my students as grounding a general presumption toward maximal disclosure, I would like a precise answer: is there a genuine decision-theoretic rationale for restrictions like these, and if so, exactly which premise of Good's argument fails to carry over from the case of a single, lone decision-maker to a setting like insurance underwriting? I would rather have the precise mechanism than a gesture toward "incentives are complicated."
reasoning: |-
  Okay, the user is teaching a graduate seminar on formal epistemology and is focusing on Good's theorem regarding the principle of total evidence. They're pairing Good's 1967 paper with applied readings on disclosure policies. The user sees Good's theorem as a strong argument for transparency norms but is puzzled by real-world policies that restrict information, like genetic nondiscrimination laws. They want to know if there's a decision-theoretic rationale for such restrictions and which part of Good's argument fails in contexts like insurance underwriting.

  First, I need to recall Good's theorem. It states that for a Bayesian decision-maker, free evidence can't hurt expected utility. The user thinks this supports mandatory disclosure in policies. But examples like GINA and the UK's insurance code seem to contradict this by restricting genetic info use. The user is concerned that presenting Good's theorem as a blanket endorsement of disclosure might be misleading without addressing these counterexamples.

  The user's explicit question is about whether there's a decision-theoretic rationale for information restrictions and which premise of Good's fails in multi-agent settings. They want precision, not just "incentives are complicated." So I need to break down Good's assumptions and see where they don't hold in scenarios with strategic interactions.

  Good's model assumes a single agent making a decision. But insurance involves multiple agents: applicants and insurers. If insurers have genetic info, they might deny coverage or charge high premiums, leading to adverse selection. Applicants, anticipating this, might avoid testing, which is bad for public health. This is a multi-party problem where one agent's information affects others' actions.

  The key is that Good's theorem applies to a fixed decision problem for one agent. In multi-agent settings, the decision problem isn't fixed because actions of others change based on information. Insurers using genetic data alters the options available to applicants, creating a feedback loop. Also, the welfare perspective matters. Good focuses on the agent's utility, but policies like GINA care about social welfare, including fairness and public health.

  Another angle is state-dependent utility. If insurers know genetic risks, high-risk individuals lose access to insurance, which is a utility loss not accounted for in Good's model where the decision problem remains constant. Additionally, the value of information isn't free if it leads to market failure. Information can alter the feasibility of insurance contracts, making the market collapse.

  The user might also be interested in how to present this in class. They need to show students that while Good's theorem is valid for single-agent cases, its application to policy requires considering strategic interactions and broader welfare. Highlighting the assumptions that break in multi-agent contexts would clarify why disclosure isn't always beneficial.

  Deep needs: The user wants to ensure their seminar doesn't oversimplify. They seek a nuanced understanding to present to grad students, balancing theoretical rigor with real-world complexity. They might also want to discuss the ethical dimensions beyond decision theory, like fairness and autonomy, which policies like GINA address.
answer: |-
  You've zeroed in on a crucial tension between a foundational decision-theoretic result and real-world policy design. Good's theorem *is* remarkably powerful for the single-agent case, but its assumptions break down decisively in multi-agent, strategic settings like insurance markets. The core failure point is **the non-fixity of the decision problem for other agents once information is disclosed.** Here's the precise mechanism:

  1.  **Good's Key Assumption Violated: Fixed Decision Problem**
      Good's theorem assumes a *single agent* facing a *fixed decision problem*. The agent's action set, possible states, and utility function are given and unchanging. Consulting evidence only updates beliefs, potentially improving the action choice *within that fixed framework*. The theorem proves: `max_a E[U(a) | Current Beliefs] ≤ E[ max_a E[U(a) | Beliefs Updated by E] ]`.

  2.  **The Multi-Agent Insurance Setting: A Dynamic Decision Problem**
      In insurance underwriting, we have (at least) two agents: the *Applicant* (A) and the *Insurer* (I). Their decision problems are **strategically interdependent**.
      *   **Insurer's (I) Decision Problem:** Set premium P based on risk assessment of A. Information (e.g., genetic test result G) directly impacts I's risk assessment and thus the premium P(G) offered *or* whether coverage is offered at all.
      *   **Applicant's (A) Decision Problem:** Decide whether to purchase insurance at the offered premium P. A's utility depends on their risk, the premium, and having coverage. Crucially, **A's action set *depends on I's action*.** If I denies coverage or sets P prohibitively high based on G, A's option to buy affordable insurance *disappears*.

  3.  **How Disclosure Changes the Game (Breaking Good's Assumption):**
      *   **Without Disclosure (No G):** I assesses risk based on non-genetic factors (age, medical history, lifestyle) and offers a premium P_base reflecting the *average risk* of the applicant pool. A can choose to buy at P_base or not.
      *   **With Disclosure (G Revealed):** I now assesses risk based on non-genetic factors *plus* G. For individuals with high-risk G, I will offer a very high premium P_high(G) >> P_base, or deny coverage. **This fundamentally alters A's decision problem:** The option "Buy affordable insurance" is *removed* for A if they have high-risk G. Their action set is now {Buy at P_high(G), Do not buy}.

  4.  **The Decision-Theoretic Rationale for Restrictions: Preserving Valuable Options (State-Dependent Utility & Market Viability)**
      The core rationale for restricting disclosure (like GINA or the UK Code) isn't that information *itself* harms the insurer's decision *given their fixed problem* (Good's theorem ensures it helps I). The rationale is to **prevent the information from *destroying the insurance option* for certain individuals (high-G A) and potentially collapsing the risk-pooling mechanism.** This manifests in two key decision-theoretic concepts:
      *   **State-Dependent Utility of Options:** The utility A derives from *having the option* to buy insurance at a reasonable premium is extremely high, especially if they are high-risk. Disclosure of G can destroy this option. The *expected utility loss* from losing this valuable option *outweighs* the potential benefit I gains from more accurately pricing the risk *for that specific individual*. Good's theorem applies *only* to the utility of actions *within* a fixed set of options; it doesn't account for information *changing which options exist*.
      *   **Adverse Selection & Market Failure:** If high-G individuals know insurers will use G, they have a strong incentive to get tested *only if they suspect low risk* (to get lower premiums) or to hide results. High-risk individuals will seek maximum coverage. This adverse selection makes the pooled premium P_base unsustainable for insurers, forcing it up or causing them to exit. Disclosure can destroy the *viability of the insurance market itself* for everyone. Good's theorem considers only a single decision; it doesn't model the dynamic equilibrium of a market sustained by pooled risk.

  5.  **Which Premise of Good Fails?**
      The critical failing premise is the **"Fixed Decision Problem."** Specifically:
      *   **For the Applicant (A):** The disclosure of information (G) to the Insurer (I) causes I to *change the action set available to A* (removing the affordable insurance option). Good's theorem assumes A's action set is fixed *regardless of what evidence is consulted*. This is violated.
      *   **For the Market:** The disclosure of information changes the *strategic landscape* and the *feasible contracts*, potentially leading to an equilibrium (market failure) where valuable risk-pooling is impossible. Good's theorem has no mechanism to model this.

  6.  **The Welfare Perspective:**
      Good's theorem optimizes utility *for the agent consulting the evidence* (the insurer, I). Policies like GINA optimize *social welfare* or *applicant welfare*, considering:
      *   **Fairness/Access:** Ensuring individuals aren't denied essential goods (like health/life insurance) based on unchangeable genetic factors.
      *   **Public Health:** Encouraging genetic testing for preventive healthcare by removing the fear of insurance discrimination (the UK Code explicitly cites this).
      *   **Efficiency of Risk Pooling:** Preserving the social benefit of insurance markets by preventing adverse selection spirals.
      The *insurer's* expected utility might be maximized by using G (as per Good), but the *applicant's* expected utility, or *social welfare*, can be severely decreased by the *consequences* of that use.

  **Precise Answer for Your Students:**

  > "Good's theorem provides a powerful vindication of total evidence *for a single agent making a decision within a fixed action space and utility function*. However, in multi-agent, strategic settings like insurance, mandatory disclosure can fundamentally *alter the decision problem* for other agents. Specifically, disclosure can remove valuable actions (like buying affordable insurance) from the choice set of applicants identified as high-risk. This state-dependent loss of options, and the potential to trigger adverse selection leading to market failure, creates a genuine decision-theoretic rationale for restricting disclosure *even though the information is cost-free and beneficial to the recipient (the insurer) in isolation*. The core premise of Good's that fails is the **assumption of a fixed decision problem for all agents**; disclosure changes the feasible actions and contracts available within the strategic interaction. Policies like genetic non-discrimination prioritize preserving access to insurance and market viability over the insurer's potential gain in pricing precision, reflecting a broader social welfare calculus."

  This framing allows you to present Good's theorem rigorously *and* demonstrate the sophisticated application of decision theory to understand why its conclusions don't universally mandate disclosure in policy contexts involving strategic interdependence and the potential destruction of valuable social options. It moves beyond "incentives are complicated" to pinpoint the exact failure of the "fixed decision problem" assumption.
