  Leibniz would likely reject relational properties as sufficient for discernibility because monads' perceptions are internal. Relations are reducible to intrinsic properties. So using spin relations wouldn't satisfy him. Then, maybe he'd argue that quantum particles aren't true substances. Monads are indivisible, but particles might be emergent or not simple. However, in quantum field theory, particles are excitations, not basic substances. That could align with Leibniz's view that only monads are real substances.

