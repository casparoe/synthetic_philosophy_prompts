answer: |-
  That's an excellent and nuanced question! You've grasped the core of the Gould & Lewontin critique perfectly. Their 1979 "Spandrels of San Marco" paper remains **highly relevant and fundamentally important** when evaluating pop evolutionary psychology (evo psych), precisely *because* many popular books often ignore or downplay its core lessons. It's not an outdated technicality; it's a foundational methodological warning about over-interpretation.

  Here’s a breakdown of the key implications for you as a critical reader, and the specific questions you *should* be asking when encountering claims like "Trait/Behavior X is an adaptation for Y":

  **Core Implications of the Spandrels Critique for Evaluating Pop Evo Psych:**

  1.  **Adaptationism is a Tempting Trap:** The critique highlights the deep human tendency (especially among biologists) to see "design" and purpose everywhere. Pop evo psych books often lean heavily into this, crafting satisfying, intuitive narratives. The spandrels argument is a powerful reminder that **"plausible story" ≠ "true explanation."**

  2.  **Not Every Trait Has an Adaptive "Why":** Traits can arise and persist for many reasons *other* than being directly sculpted by natural selection for their current function:
      *   **Developmental Constraints/Byproducts (Spandrels):** Like the human chin (side effect of jaw bone growth patterns) or male nipples (developmental byproduct of the shared embryonic blueprint).
      *   **Genetic Linkage/Pleiotropy:** A gene influencing a highly advantageous trait might also cause a neutral or even slightly disadvantageous trait because they are linked.
      *   **Phylogenetic Inertia/Historical Legacy:** A trait might be vestigial (like the appendix) or simply a holdover from an ancestor where it *was* adaptive in a different context (e.g., goosebumps in humans).
      *   **Exaptation (Gould's later term):** A trait originally shaped for one function gets co-opted for a *new* function (e.g., bird feathers likely evolved for insulation, later adapted for flight). The *original* reason isn't the *current* reason.
      *   **Drift:** Random changes can fix traits in a population without any selective advantage.

  3.  **The Burden of Proof is High:** Proving something is a direct adaptation is methodologically difficult. The spandrels critique argues that the default assumption should *not* be "it's an adaptation," but rather "what are *all* the possible explanations?" Pop evo psych often reverses this burden.

  4.  **Function is Not Always Obvious (or Singular):** A trait might serve multiple functions, or its current observable function might not be the reason it evolved. Pop evo psych often assigns a single, specific, often sexually dimorphic function.

  5.  **Beware of "Panglossian" Optimism:** The critique warns against assuming the current state is the "best possible" or perfectly optimized by evolution (like Dr. Pangloss in Voltaire's *Candide*). Evolution works with tinkered compromises, not perfect engineering.

  **Practical Questions to Ask When Reading "Trait X is an Adaptation for Y":**

  Don't just say "spandrel!" – ask these questions to probe the strength of the claim:

  1.  **What's the Actual Evidence Beyond the Story?**
      *   Is this *just* a plausible-sounding narrative ("It makes sense that jealousy would work this way because...")?
      *   Is there cited research? What kind? (e.g., Cross-cultural studies showing universality? Comparative studies with primates? Genetic studies? Fossil evidence? Rigorous experiments measuring fitness consequences? Brain imaging correlating with the behavior?)
      *   Does the evidence *rule out* alternatives, or just make the adaptation story *seem* likely?

  2.  **What are the Plausible Alternatives?**
      *   **Developmental Constraint/Byproduct:** Could this be a side effect of how our brains/brains/bodies develop? (e.g., Is a specific fear/disgust *really* an evolved module, or a byproduct of a more general learning mechanism?)
      *   **Exaptation:** Could this behavior/trait have evolved for a different original purpose and been co-opted? (e.g., Did music evolve for sexual selection, group bonding, cognitive exercise, or is it a spandrel of language and pattern recognition?)
      *   **Cultural Invention/Transmission:** Could this be primarily learned and culturally variable, rather than a hardwired adaptation? (Pop evo psych often underestimates culture). Does the book address cross-cultural variation?
      *   **Phylogenetic Legacy:** Is this something we share with distant ancestors where the context was very different? (e.g., Are modern social hierarchies *direct* adaptations, or do they exploit ancient dominance/submission circuits evolved in very different contexts?).
      *   **Genetic Linkage:** Could genes for this trait be "hitchhiking" on genes for something truly adaptive?

  3.  **How Universal and Specific is the Trait?**
      *   Is this behavior/trait truly universal across *all* human cultures? If not, how does the book explain the variation? (This is a major weakness for many broad pop evo psych claims).
      *   Is the proposed adaptive function (Y) the *only* possible function, or could the trait serve multiple purposes? Is the link between X and Y *that* specific?

  4.  **What is the Proposed Selective Pressure?**
      *   Is the specific selective pressure described clearly and plausibly? (e.g., Exactly *how* in our ancestral environment would this specific jealousy difference have led to more surviving offspring? How strong would that pressure need to be?).
      *   Does the proposed pressure align reasonably with what we know (or can infer) about human ancestral environments (Pleistocene ecology)? Beware of vague "in the ancestral environment" justifications.

  5.  **Does the Book Acknowledge Complexity?**
      *   Does the author even mention alternative explanations (like byproducts, constraints, culture) or the difficulty of proving adaptation?
      *   Or is the adaptation narrative presented as the obvious, only, and "proven" explanation?

  **Applying This to Your Book Club Example (Jealousy Differences):**

  *   **Claim:** Men are *specifically adapted* by natural selection to be more upset by *physical* infidelity (risk of cuckoldry, investing in non-biological offspring), women by *emotional* infidelity (risk of losing partner's resources/investment).
  *   **Your Critical Questions:**
      *   **Evidence?** What studies support this *specific* sex difference? Are they cross-cultural? (Some research shows the difference, but its magnitude and universality are debated). Does brain imaging show distinct modules? Or is it a learned cultural pattern exploiting general emotional mechanisms?
      *   **Alternatives?** Could this be a byproduct of general sex differences in parental investment strategies *combined* with cultural norms amplifying the difference? Could men's focus on physicality be linked to other factors (e.g., sperm competition theory) rather than *only* paternal certainty? Is the emotional aspect in women truly distinct or just one facet of valuing relationship stability?
      *   **Universality?** Are there cultures where this difference doesn't hold, or is reversed? How does the book explain that?
      *   **Specificity?** Is jealousy *only* about these two neatly separable things? Don't both sexes get upset by *both* types of betrayal? Is the proposed mechanism *that* specific?
      *   **Acknowledgment?** Does the book mention critiques like Gould & Lewontin's, or alternative interpretations?

  **The Bottom Line for You:**

  The spandrels critique isn't a magic bullet saying "no adaptations exist." Humans *are* products of evolution, and many traits *are* adaptations. However, it **demands rigor and humility.** When reading pop evo psych:

  *   **Be deeply skeptical of neat, just-so stories,** especially those reinforcing gender stereotypes or offering simplistic explanations for complex behaviors.
  *   **Always ask: "What's the evidence, and what are the alternatives?"**
  *   **Look for acknowledgment of complexity, constraints, byproducts, and culture.** Its absence is a major red flag.
  *   **Remember that demonstrating adaptation is hard work;** a compelling narrative is the starting point for science, not the conclusion.

  By asking these questions, you move beyond simply labeling things "spandrels" and become a much more sophisticated consumer of evolutionary arguments, capable of distinguishing potentially insightful science from oversimplified, potentially misleading storytelling. Your ecology PhD friend was right to point you towards this foundational critique!
