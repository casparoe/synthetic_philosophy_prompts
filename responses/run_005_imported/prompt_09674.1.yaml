  Hmm, I need to first unpack Strawson's core move carefully. His regress isn't about causation per se but about the conditions for true moral desert. The key insight is that responsibility requires authorship, and authorship requires prior authorship - hence the infinite regress. What's clever is how he blocks the quantum indeterminacy escape route by arguing randomness doesn't confer authorship.

