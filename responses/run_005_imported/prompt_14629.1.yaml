  The key here is understanding Vasubandhu's causal continuity model. In his Abhidharmakośa, he explicitly defines the santāna (continuum) as an unbroken chain of momentary dharmas where each moment causes exactly one successor. This one-to-one causal necessity is fundamental - it's how he explains everything from personal persistence to karmic responsibility without needing a self.

  Now looking at Parfit's fission case: one brain splits into two fully functional successors. For Vasubandhu, this violates his core principle of singularity in causation. The last moment of the pre-fission person can't simultaneously cause two distinct continuums - that would require either overdetermination (which he rejects) or bifurcation (which his system doesn't allow).

  The Pudgalavādin debate actually helps here. Vasubandhu argued against their "inexplicable self" precisely by showing how causal continuity alone suffices. But his model requires strict causal singularity - when that breaks down, so does the conventional identity. So fission would force him to say the original santāna ends, and two new ones begin spontaneously from that final moment.

  This actually mirrors how he handles rebirth - when a being dies, one final moment causes exactly one rebirth moment elsewhere. Fission would be like a single death generating two rebirths simultaneously, which his system can't accommodate.

