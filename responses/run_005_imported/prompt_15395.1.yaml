  I'm plotting a scene for my novel: two old grad-school friends, now philosophy professors, run into each other at a mutual friend's wedding and end up in a real fight. Can you write me the dialogue? Mara is a committed conciliationist about disagreement—finding out an epistemic peer disagrees with you should genuinely move your credence toward theirs. Jonah holds the steadfast view: you can rationally dig in even when someone just as smart thinks you're wrong. Start them off snapping at each other over something dumb and concrete (a bet on some trivia fact, whatever), then let it spiral into the meta version of the fight—Jonah points out that plenty of Mara's fellow epistemologists actually think steadfastness is correct, so by her own view, shouldnt she be losing confidence in conciliationism itself right now? I want Mara to have a genuine comeback, not just fold, and neither of them should come off as the strawman.
