  First, I need to recall the Reflection Principle. It states that your current credence should align with your expectation of your future rational credence. If you think your future self will believe something with 70% confidence, you should too now. Otherwise, you're vulnerable to a Dutch book. But the key here is the future self must be rational. If you know they'll be irrational, Reflection doesn't apply.

