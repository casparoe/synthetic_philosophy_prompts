prompt: |-
  Quick question from a CS PhD student who mostly works on multiagent RL, so game-theoretic foundations aren't really my home turf. I've been reading about program equilibrium, the Tennenholtz result where instead of picking an action each player submits a program that gets to inspect the other player's source code before it acts, and this apparently gets you mutual cooperation as a genuine equilibrium in one-shot Prisoner's Dilemma. But isn't this just correlated equilibrium with extra steps? Letting the programs read each other's code before moving seems like exactly the kind of correlating device Aumann already gave us, so shouldn't everything you can get out of a program game already be sitting inside the correlated equilibrium set of the base game? Trying to figure out if theres an actual new idea here or if its just old wine in a much nerdier bottle.
