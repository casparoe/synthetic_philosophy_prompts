  Also worth emphasizing that the board's job isn't just predicting risk, but evaluating rehabilitation - something no algorithm can quantify. The inmate's unique efforts matter more than which demographic box he falls into. 

  The draft should probably:
  1. Acknowledge the score's aggregate value upfront
