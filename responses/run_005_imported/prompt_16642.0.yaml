answer: |-
  Here's a new example addressing the core structural problem in teleosemantics, avoiding stock cases:

  **Example: The Echo Finch's Mating Call Detection**

  *   **Trait:** Neural circuitry in female Echo Finches (*Ficticia avis sonorus*) dedicated to triggering a positive mating response upon hearing the male's specific, complex, 10-second trill.
  *   **Evolutionary History:** Throughout the species' history, this trill required immense respiratory control and musculature coordination. Males capable of producing the *full, sustained 10-second trill* (Property P1: **Long Call Duration**) were *unfailingly* males possessing the highest overall genetic fitness and freedom from debilitating parasites (Property P2: **High Genetic Fitness**). This was because:
      1.  Producing the trill demanded significant energetic resources only fit males possessed.
      2.  A key respiratory parasite endemic to their habitat severely shortened call duration in infected males; only parasite-free males achieved the full 10 seconds.
      3.  Thus, P1 (Long Call Duration) and P2 (High Genetic Fitness) were **perfectly co-extensive** in the ancestral environment. Selection pressure favored females whose neural circuitry responded positively *only* to calls exhibiting the full 10-second duration, *because* this reliably indicated high genetic fitness. There was *no* historical instance where a male produced the full 10-second trill without high fitness, nor high fitness without the ability to produce the full call.
  *   **Modern Divergence:** Humans introduce two novelties:
      1.  **Effective Parasite Treatment:** A harmless treatment eliminates the respiratory parasite without otherwise affecting fitness. Treated, low-fitness males can now produce the full 10-second trill.
      2.  **Call Synthesizers:** Devices can perfectly replicate the 10-second trill with no male present.

  **The Teleosemantic Dilemma:**

  1.  **Content Candidate 1:** Detecting/Responding to *Long Call Duration (P1)*.
      *   *Justification:* The mechanism was directly sensitive to acoustic properties corresponding to call duration. Selection *causally operated* on its ability to discriminate duration. When it fired, it was *because* of the duration property. Its success (producing fit offspring) depended on it responding *to* that specific acoustic signature.
  2.  **Content Candidate 2:** Detecting/Responding to *High Genetic Fitness (P2)*.
      *   *Justification:* The ultimate *biological function* explaining the trait's selection was identifying fit mates. The mechanism's success *consisted* in its correlation with fitness. Call duration was merely the *means* or *natural sign* for fitness in that environment. The mechanism was "supposed to" track fitness; duration was just how fitness manifested acoustically.

  **Historical Justification Equivalence:** Both specifications are equally justified by the selection history. The mechanism was selected *for* responding to P1 (duration) *precisely because* P1 was perfectly correlated with P2 (fitness), and responding to P1 *was* responding to P2. Selection pressure was applied simultaneously and indistinguishably to both properties due to their perfect co-extensiveness. There is no historical basis within the selected effects framework to privilege one property (the proximal stimulus P1) over the other (the distal biological value P2) as the "true" content.

  **Why Appealing to "Normal Conditions" Doesn't Resolve It:**

  Millikan defines "Normal conditions" as those conditions under which the trait performed its function in the way that accounted for its selection and reproduction. However:

  1.  **Ambiguity in Defining "The Way":** What *was* "the way" the trait performed its function? Was it:
      *   (a) Responding to the specific acoustic property (P1), which *happened* to correlate perfectly with fitness (P2) under Normal conditions?
      *   (b) Detecting high fitness (P2), which *happened* to be signaled by that specific acoustic property (P1) under Normal conditions?
  2.  **Circularity:** Defining Normal conditions requires knowing the trait's proper function. But the proper function (and thus content) is precisely what's in dispute between P1 and P2.
      *   If we define Normal conditions as including "when call duration reliably indicates fitness," we presuppose that fitness (P2) is the content.
      *   If we define Normal conditions as "when the specific acoustic signature (P1) is present," we presuppose that the acoustic property is the content.
  3.  **Application Doesn't Break the Tie:** In the novel situations:
      *   The treated, low-fitness male producing the full call *is* producing the Normal proximal stimulus (P1) under Normal acoustic conditions. If content is P1, the female's response is correct. If content is P2, it's incorrect/mistaken.
      *   The synthesizer produces P1 without any fitness property (P2) existing at all. If content is P1, the female is responding to the *property* she's supposed to (even if uselessly). If content is P2, she's making a radical error (detecting something non-existent).
      *   Appealing to Normal conditions doesn't tell us which of these interpretations of the mechanism's *purpose* (track P1 or track P2) is correct, because the historical success depended *identically* on both properties being present together. The Normal conditions description itself is ambiguous between the two functional descriptions.

  **Conclusion:** The Echo Finch case demonstrates that the co-extensivity problem is structural, not merely a quirk of simple mechanisms. Whenever selection acts on a trait because of a perfect historical correlation between a directly detectable proximal property (P1) and a biologically significant distal property (P2), teleosemantics lacks the historical resources within its selected-effects framework to definitively assign content to P1 over P2 (or vice-versa). The framework cannot resolve the ambiguity because the selection history *only* selected for responding to the conjunction (P1 & P2), not for either property individually. Appeals to Normal conditions presuppose an answer to the very question of what the function/content is. This inherent ambiguity persists regardless of the mechanism's complexity.
