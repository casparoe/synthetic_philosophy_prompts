answer: |-
  Based on a close reading of Douglass's 1860 Glasgow speech, particularly his arguments against relying on historical practice to settle constitutional meaning concerning liberty, his assessment of the Court's current "history and tradition" approach would likely be **highly critical, viewing it as fundamentally flawed and potentially dangerous for securing individual rights.**

  Here's a breakdown of why, working directly from Douglass's specific arguments in that speech:

  1.  **Explicit Rejection of History/Tradition as Definitive Proof:** Douglass's core argument was that **"over seventy years of uniform practice" under the Constitution favoring slavery did *not* settle the question of the Constitution's meaning on liberty.** He dismissed the pro-slavery historical record as irrelevant to the *interpretive* question: "I base my sense of the Constitution upon its *words*... I plant myself upon the Constitution as *it is*." For Douglass, practice proved only what power had *done*, not what the text *meant* or *required*. Applying this to today, he would likely argue that citing centuries of restrictions on abortion (Dobbs) or firearms regulations (Bruen) does *not*, in itself, prove that the Constitution permits or requires those restrictions.

  2.  **The Need for "Something More" When Liberty is at Stake:** Douglass explicitly demanded "something more than history — something more than tradition" when interpreting the Constitution on matters of "human liberty and justice." The Court's current methodology, particularly as articulated in Dobbs and Bruen, elevates "history and tradition" to the *primary* or even *definitive* guide for identifying fundamental rights or permissible restrictions. Douglass would see this as directly contravening his imperative. He would argue the Court is relying *precisely* on the tools he deemed insufficient and potentially deceptive when core liberties hang in the balance.

  3.  **The Presumption of Liberty and "Irresistible Clearness":** Douglass's central interpretive principle was the **presumption in favor of liberty**: "Liberty is normal; slavery is abnormal... The Constitution must be held to be an anti-slavery instrument... I hold that the Constitution is, in its letter and spirit, an anti-slavery instrument." Crucially, he argued that **rights can only be curtailed by language of "irresistible clearness."** This flips the current "history and tradition" approach:
      *   **Douglass:** Start with a presumption of liberty. Restrict it *only* if the text *unambiguously* commands it.
      *   **Current Court (Dobbs/Bruen):** Start by asking if the specific right claimed was historically recognized or traditionally protected at a specific level of generality. Restrict it if history shows a tradition of regulation, even if the text is ambiguous.
      Douglass would argue the current method *begins* by looking for historical justifications for *restriction*, rather than presuming liberty and demanding textual clarity for its limitation. He would see this as abandoning the protective shield the "irresistible clearness" standard provides for fundamental freedoms.

  4.  **The Danger of Entrenching Injustice:** Douglass understood that history and tradition are often the record of oppression and power, not justice. Slavery *was* the historical tradition and practice under the Constitution for decades. To rely on that tradition to interpret the Constitution was, for him, to sanctify injustice. He would likely argue that the Court's current method risks doing the same – legitimizing historical restrictions on rights (like those affecting women's bodily autonomy in Dobbs or potentially other marginalized groups in future cases) precisely *because* they were traditional, regardless of whether they were just or aligned with the Constitution's broader principles. He would see it as a tool susceptible to freezing in place past inequalities.

  5.  **Text and Principle Over Practice:** While Douglass wanted judges constrained (agreeing with your friend's *general* point about avoiding pure moral judgment), the constraint he advocated was the **text read through the lens of its animating principles of liberty and justice**, *not* historical practice. He pointed to the Preamble ("establish Justice," "secure the Blessings of Liberty"), the Guarantee Clause (guaranteeing a "Republican Form of Government"), the Due Process Clause, and the Privileges and Immunities Clause as sources of anti-slavery principle. He would likely argue that the Court should focus on interpreting *these broad principles* in light of evolving understandings of liberty and justice (guided by text), rather than tethering rights to specific historical regulations that may reflect outdated or unjust societal norms. He saw the Constitution as aspirational, not merely descriptive of past practice.

  **Conclusion:**

  Frederick Douglass, based on his specific 1860 arguments, would be a **vocal critic** of the Supreme Court's current "history and tradition" methodology for defining the scope of constitutional rights. He would see it as:

  *   **Repeating the error of the pro-slavery argument:** Using historical practice as proof of meaning, which he explicitly and forcefully rejected.
  *   **Ignoring the imperative of "something more":** Failing to employ the higher standard of interpretation required when liberty is at stake.
  *   **Abandoning the presumption of liberty:** Starting from the wrong end by seeking historical justification for restrictions rather than demanding "irresistible clearness" in the text to curtail liberty.
  *   **Risking the entrenchment of past injustice:** Potentially elevating discriminatory or oppressive historical practices into constitutional mandates.
  *   **Misunderstanding the necessary constraint:** While agreeing judges shouldn't rule by pure personal morality, he would argue the constraint should be the *text interpreted with a strong pro-liberty bias and according to its just principles*, not the historical record of what governments have traditionally been allowed to do.

  Douglass would likely view the current approach as a dangerous regression, abandoning the tools needed to realize the Constitution's promise of liberty in favor of a methodology that sanctifies the power structures of the past. Your interpretation – that his words are a direct rebuttal – aligns more closely with his specific arguments in the Glasgow speech than your friend's view of him as a constrained-interpretation forerunner. While Douglass sought constraint, the source of that constraint (text + pro-liberty presumption) was fundamentally different from, and often antagonistic to, the constraint sought through historical practice.
