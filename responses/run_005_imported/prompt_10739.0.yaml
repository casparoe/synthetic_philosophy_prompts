answer: |-
  It turns out your friend is correct, and there is indeed a well-established mechanism from decision theory that satisfies all your requirements. This mechanism, known as the **VCG mechanism** (Vickrey-Clarke-Groves) adapted for bilateral trade, ensures that neither of you needs to reveal your true valuation, neither needs to trust the other, and both are guaranteed to be at least as well off as with the fallback option (selling the house and splitting the proceeds). Crucially, it can also improve on the fallback outcome when your valuations differ sufficiently. Below, I'll explain the logic, present a workable version for your situation, and address your concerns.

  ### Core Concept: Incentive Compatibility Without Trust
  The mechanism leverages a key insight: by aligning incentives so that honest reporting is optimal *regardless of what the other party does*, it eliminates the need for trust. Specifically:
  - **No revelation of private information**: You and your sister submit bids without disclosing your true valuations.
  - **Dominant-strategy incentive-compatible (DSIC)**: It’s in your best interest to bid truthfully, even if you assume the other will lie.
  - **Individual rationality**: Both are guaranteed at least the fallback payoff (half the market value).
  - **Efficiency potential**: If your valuations differ, the outcome can be strictly better for both than the fallback.

  ### The Mechanism: Step-by-Step
  Here’s a practical version for your lake house dispute. Assume:
  - The market value of the house, \( V \), is independently appraised (e.g., by a realtor). This \( V \) is the fallback sale price.
  - You (the buyer) bid \( b \): the maximum you’re willing to pay *above your fallback payoff* to own the house outright.
  - Your sister (the seller) bids \( s \): the minimum she’s willing to accept *above her fallback payoff* to sell her share.

  **Steps**:
  1. **Appraisal**: Secure an independent appraisal of the house’s market value \( V \). This is fixed and known to both.
  2. **Bidding**: 
     - You submit a sealed bid \( b \) (representing \( B - \frac{V}{2} \), where \( B \) is your true value for the house).
     - Your sister submits a sealed bid \( s \) (representing \( \frac{V}{2} - S \), where \( S \) is her true value for her share, but since she prefers cash, \( S \leq \frac{V}{2} \)).
  3. **Decision Rule**:
     - If \( b \geq s \), you buy the house from your sister. You pay her \( \frac{V}{2} + s \).
     - If \( b < s \), no trade occurs. The house is sold externally for \( V \), and you each get \( \frac{V}{2} \).

  **Why this works**:
  - **Your payoff if trade occurs**: You get the house (worth \( B \) to you) but pay \( \frac{V}{2} + s \). Your net gain is \( B - \frac{V}{2} - s \). Since you bid \( b = B - \frac{V}{2} \), your gain is \( b - s \).
  - **Sister’s payoff if trade occurs**: She receives \( \frac{V}{2} + s \). Her net gain is \( \left( \frac{V}{2} + s \right) - \frac{V}{2} = s \).
  - **Fallback payoff**: If no trade, both get \( \frac{V}{2} \).

  ### Why Truth-Telling is Optimal
  - **Your incentive**: Suppose your true value is \( B \), so your true bid should be \( b_{\text{true}} = B - \frac{V}{2} \). 
    - If you bid \( b_{\text{false}} > b_{\text{true}} \): Trade might occur when \( s > b_{\text{true}} \), forcing you to pay \( \frac{V}{2} + s > B - \frac{V}{2} \), making you worse off.
    - If you bid \( b_{\text{false}} < b_{\text{true}} \): You might miss a trade where \( s \leq b_{\text{true}} \), losing a potential gain of \( b_{\text{true}} - s \geq 0 \).
    - **Truthful bidding is optimal**: You avoid losses and capture all beneficial trades.
  - **Sister’s incentive**: Suppose her true minimum is \( s_{\text{true}} = \frac{V}{2} - S \). 
    - If she bids \( s_{\text{false}} < s_{\text{true}} \): She might be paid \( \frac{V}{2} + s_{\text{false}} < \frac{V}{2} + s_{\text{true}} \), which is below her true minimum.
    - If she bids \( s_{\text{false}} > s_{\text{true}} \): Trade might not occur when \( b \geq s_{\text{true}} \) (but \( b < s_{\text{false}} \)), causing her to miss a payoff \( s_{\text{true}} \geq 0 \).
    - **Truthful bidding is optimal**: She avoids underpricing and doesn’t block beneficial trades.

  ### Guaranteed Outcomes
  - **At least the fallback**: 
    - If no trade, both get \( \frac{V}{2} \).
    - If trade occurs, you gain \( b - s \geq 0 \) (since \( b \geq s \)), and your sister gains \( s \geq 0 \). Both are better off or equal to the fallback.
  - **Improvement over fallback**: 
    - If \( b > s \), trade occurs. Your sister gains \( s > 0 \), and you gain \( b - s > 0 \) if \( b > s \). This is a strict improvement for both over the fallback.
    - Example: \( V = \$500K \). Your true \( B = \$700K \) (so \( b = \$200K \)). Sister’s true \( S = \$200K \) (so \( s = \$50K \), since \( \frac{V}{2} - S = \$250K - \$200K \)). Trade occurs, you pay \( \$250K + \$50K = \$300K \). 
      - You keep the house, net gain: \( \$700K - \$300K = \$400K \) (vs. fallback \( \$250K \)).
      - Sister gets \( \$300K \) cash (vs. fallback \( \$250K \)).
      - Total surplus: \( (\$400K - \$250K) + (\$300K - \$250K) = \$200K \) created.

  ### Why This Beats Your Mediator
  - **No prolonged negotiation**: Bids are submitted once, eliminating hourly fees.
  - **No exploitation**: Truthful bidding is the best strategy, even if the other lies.
  - **Efficiency**: The house is transferred if you value it more, ending the deadlock.

  ### Addressing Your Concerns
  - **“No use of information” vs. “Improvement on fair default”**: The mechanism *does* use your bids, but in a way that makes lying suboptimal. It’s not a sleight of hand—it’s a game-theoretic design that forces honesty through incentives.
  - **Appraisal requirement**: \( V \) must be objective (e.g., average of independent appraisals). This is feasible and common in probate.
  - **No deficit**: Payments are between you two; no external subsidy is needed.

  ### Practical Implementation
  1. **Before the mediator meeting**:
     - Agree on a reputable appraiser to determine \( V \).
     - Sign a binding contract committing to the mechanism.
  2. **At the meeting**:
     - Submit sealed bids \( b \) and \( s \).
     - The mediator enforces the rule: trade if \( b \geq s \), with payment \( \frac{V}{2} + s \).
  3. **Outcome**:
     - If trade occurs, you own the house, and your sister gets cash.
     - If not, sell externally and split \( V \).

  ### Conclusion
  Your friend was right: this mechanism satisfies all your requirements. It guarantees neither of you will do worse than the fallback, avoids trust or disclosure issues, and can create gains when your valuations differ. It’s a genuine, non-trivial solution grounded in decision theory. For your upcoming mediator meeting, propose this—it could resolve your 18-month stalemate fairly and efficiently. If your sister is rational, she’ll recognize it’s in her interest too.
