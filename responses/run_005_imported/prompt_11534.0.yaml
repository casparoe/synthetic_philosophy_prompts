answer: |-
  ## Inter-Council Memorandum: Establishing Voting Eligibility Principles  
  **To:** Student Council Members  
  **From:** [Your Name], Sophomore Class Representative  
  **Date:** October 24, 2023  
  **Subject:** Recommendation: Voting Eligibility for Schedule Change & Future Student Body Decisions  

  ### I. Recommendation
  **All currently enrolled students (grades 9-12) shall have equal voting rights** on the block schedule proposal and future student body decisions. **Incoming freshmen (current 8th graders) shall be granted voting rights via a proxy ballot administered by the Middle School Student Council advisor.** Vocational-program students retain full voting rights.  

  ### II. Core Principle for Voting Eligibility  
  **Voting rights are tied to current membership in the student body**, not solely to the degree of future impact. While impact is a significant factor, the authority to decide rests with the community *currently* constituting the school. This principle ensures stability, avoids subjective "impact assessments," and provides a consistent rule for all future votes.  

  ### III. Addressing Key Concerns  
  1.  **"Why should seniors (or departing students) vote if they won't experience the change?"**  
      *   **Acknowledgment:** This is a valid practical concern. Their direct experience *will* be limited.  
      *   **Defense of Inclusion:**  
          *   **Current Stakeholders:** Seniors are active members *now*. Major changes affect the school culture, resources, and underclassmen peers/siblings *during their final year* (e.g., transition logistics, teacher availability, building atmosphere).  
          *   **Collective Responsibility:** Decisions made by the *current* student body shape the institution's legacy. Excluding members based on imminent departure undermines the principle of collective governance.  
          *   **Precedent & Stability:** Creating rules to exclude groups based on future departure is administratively messy and sets a precedent for disenfranchising any group deemed "less affected" in future debates (e.g., juniors voting on a senior-only prom rule).  
          *   **Voluntary Abstention:** Seniors concerned about relevance can *choose* not to vote, but the *right* to participate should remain.

  2.  **"Why include incoming freshmen (current 8th graders)?"**  
      *   **Acknowledgment:** Excluding the group most impacted for the longest duration is fundamentally unfair and undermines the legitimacy of the vote.  
      *   **Solution (Proxy Vote):**  
          *   The Middle School Student Council advisor will distribute, collect, and certify ballots for current 8th graders intending to enroll next year.  
          *   Votes will be tallied as part of the "Freshman" class total for the upcoming year.  
          *   This ensures representation for the primary stakeholders without requiring premature formal enrollment.

  3.  **"Vocational students are less impacted. Should their vote count less?"**  
      *   **Acknowledgment:** Their daily schedule is different.  
      *   **Defense of Equal Rights:**  
          *   **Equal Membership:** They are fully enrolled students. Creating tiers of voting power based on perceived impact is discriminatory and unworkable.  
          *   **Tangible Impact:** The schedule change *still* affects their core classes at our school, start/end times, transportation coordination, access to teachers/clubs, and the overall school environment they participate in daily.  
          *   **Dangerous Precedent:** Discounting votes based on individual circumstances opens the door to endless arguments about who is "affected enough" for future issues (e.g., athletes voting on field trips, AP students voting on exam policies).

  ### IV. Benefits of This Framework
  *   **Fairness:** Balances the rights of current members with the needs of the most affected future members (incoming freshmen).  
  *   **Clarity & Consistency:** Establishes a bright-line rule: **Current Enrollment = Voting Right.** Easily applied to *any* future student body vote (prom, dress code, fund allocation, etc.).  
  *   **Legitimacy:** Ensures the decision is made by the community governing the school *now* while incorporating the voices of those inheriting the outcome.  
  *   **Practicality:** Avoids subjective debates about "impact levels" for every issue. The proxy system for incoming freshmen is a one-time manageable lift.  

  ### V. Implementation for Schedule Vote
  1.  **Voter Eligibility:** All students currently enrolled in Grades 9-12 at [School Name].  
  2.  **Incoming Freshman Vote:**  
      *   Ballots distributed to current 8th graders via Middle School Council advisor.  
      *   Clear deadline set (e.g., 3 days before HS vote closes).  
      *   Sealed ballots returned to advisor, delivered to HS Council for counting with HS freshman votes.  
  3.  **Vocational Students:** Full and equal voting access.  
  4.  **Voting Platform:** Utilize existing school voting system/platform. Ensure accessibility.  
  5.  **Communication:** Clearly explain eligibility rules and the *reasoning* behind them (this memo!) to the entire student body before voting opens.  

  ### VI. Conclusion
  This recommendation upholds the principle that the **current student body governs**, while pragmatically addressing the unique situation of the most impacted future members. It resolves the immediate conflict over the schedule vote and provides a fair, consistent, and defensible rule for all future student body decisions. By including incoming freshmen via proxy and rejecting impact-based vote weighting, we ensure legitimacy and avoid setting harmful precedents. Let's adopt this framework and focus our energy on educating voters about the *merits* of the schedule options themselves.  

  **Respectfully submitted for adoption at Tuesday's meeting,**  
  [Your Name]  
  Sophomore Class Representative
