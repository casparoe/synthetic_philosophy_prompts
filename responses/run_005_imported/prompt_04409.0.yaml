prompt: |-
  Ok, this has been rattling around in my head for like two weeks now, ever since a comment thread (EA forum, I think, though it mighta been cross-posted to LW) where someone claimed Harsanyi's aggregation theorem basically hands you utilitarianism "for free," the same way Arrow's theorem hands you an impossibility result. Funny timing, because the week before I'd just finished explaining Arrow's theorem to a non-rationalist friend at a dinner party, so the whole thing was fresh in my mind when I saw the thread. Anyway, the claim being made was: give everyone von Neumann-Morgenstern (expected utility) preferences, add a Pareto condition, and out pops a social welfare function that's a weighted sum of individual utilities -- some form of utilitarianism, allegedly with no interpersonal comparisons required. It got framed as basically "Arrow found the wall, Harsanyi found the door." But then someone else pushed back, pointing out that Sen apparently showed that just upgrading everyone from ordinal to cardinal utility, without interpersonal comparability, does basically nothing to Arrow's result -- the dictator comes right back. Which seems like it flatly contradicts the "no interpersonal comparisons needed" part of the Harsanyi story, since his individuals also just have their own private cardinal utility functions, nothing more.

  I can follow the bare statements of both theorems fine, I just don't have the background to see where they actually diverge, so hoping you can sort it out for me. Could you compare Arrow's impossibility theorem and Harsanyi's aggregation theorem properly -- not the "ordinal vs. cardinal" one-liner everyone gives, but which specific axiom is doing the real work in each setup -- and then actually take a stance on the crux: does Harsanyi's theorem escape Arrow's impossibility on its own terms, or is it quietly relying on something that functions like interpersonal comparability (smuggled in via the Pareto-indifference step, or via however the weights end up getting pinned down, or somewhere else entirely)? If there's a sleight of hand in there somewhere, I want to know exactly where it happens.
