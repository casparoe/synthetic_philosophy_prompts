  First, I need to mentally juxtapose both theorems' setups. Arrow requires ordinal non-comparable preferences, with IIA and unrestricted domain leading to dictatorship under Pareto. Harsanyi assumes cardinal utilities upfront, social welfare must be VNM too, and uses Pareto indifference. The key is... Pareto indifference! In Arrow, Pareto is about strict preference, but Harsanyi's Pareto indifference compares utility differences implicitly.

  Ah! That's the smuggled interpersonal comparison. When Harsanyi requires society to be indifferent whenever all individuals are indifferent, he's forcing a calibration between utility scales. It's not full comparability, but enough to make weights meaningful. Meanwhile Sen's critique uses cardinal utilities without that extra calibration, so Arrow's problems persist.

