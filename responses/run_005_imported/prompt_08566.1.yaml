  We are grading a student's exam answer on the nonidentity problem. The question is: "Explain what the nonidentity problem is and why it poses a challenge to person-affecting accounts of the wrongness of an act. Illustrate with an example."

  The student's answer is:

  "The nonidentity problem, first raised by Derek Parfit, is a puzzle about whether a person can be wronged by the very choice that is also the reason that person exists. For example, imagine a woman is told that if she conceives this month she'll have a child with a mild but manageable disability, because of a virus she currently has, but if she waits three months to conceive, she'll have a different, healthy child. If she conceives now anyway, we want to say she's wronged her child. But the child she actually has couldn't have existed if she'd waited — a totally different child, from a different egg and sperm, would exist instead. So her child isn't made worse off by her choice, since for that specific child the only alternative was never existing at all, and (assuming the disability isn't severe enough to make the child's life not worth living) existing with a disability is better than not existing. This is basically the same move as Parfit's Repugnant Conclusion, where he shows that a huge population of people with lives barely worth living is better than a smaller population of very happy people, which is why he thinks total utilitarianism has to be rejected as a moral theory. Since the child isn't harmed on any standard person-affecting definition of harm, Parfit's own conclusion is that the mother hasn't actually done anything wrong, which is a useful corrective to our overly moralistic intuitions about reproductive choices."

  We are to grade this out of 20 and provide specific comments.

  Breakdown of the question:
  1. Explain the nonidentity problem.
  2. Explain why it poses a challenge to person-affecting accounts.
  3. Illustrate with an example.

  The student's answer:
  - Defines the nonidentity problem correctly in the first sentence.
  - Provides an example (the woman conceiving now vs. later) that is standard and appropriate.
  - Explains why the child is not made worse off (because the alternative is nonexistence, and the life is worth living).
  - Then, the student makes a connection to the Repugnant Conclusion and total utilitarianism, which is not directly asked for and may be a tangent.
  - States that Parfit's conclusion is that the mother hasn't done anything wrong, and that this is a corrective to intuitions.

  Strengths:
  - The definition is correct.
  - The example is well-chosen and explained appropriately for the nonidentity problem.
  - The challenge to person-affecting accounts is implicit in the explanation: the child isn't harmed (so a person-affecting view would say no wrong was done to that child) but we have the intuition that the act is wrong.

  Weaknesses:
  1. The answer does not explicitly define what a "person-affecting account" is. The question requires explaining why the nonidentity problem challenges such accounts. The student mentions that the child isn't harmed "on any standard person-affecting definition of harm", but without explaining what a person-affecting account is, this might be too vague. We expect the student to note that person-affecting views hold that an act is wrong only if it makes someone worse off (compared to some alternative). The nonidentity problem challenges this because the act doesn't make the child worse off (since the child would not have existed otherwise) and yet we feel the act is wrong.

  2. The connection to the Repugnant Conclusion is misplaced. The nonidentity problem and the Repugnant Conclusion are two distinct problems in Parfit's work. The Repugnant Conclusion is about population ethics and total utilitarianism, while the nonidentity problem is about identity-dependent harms and person-affecting views. The student incorrectly states that the nonidentity problem is "basically the same move" as the Repugnant Conclusion. This is a significant error.

  3. The student says that Parfit's "own conclusion is that the mother hasn't actually done anything wrong". This is an oversimplification. Parfit does argue that the mother hasn't wronged the child, but he does not necessarily conclude that the act is not wrong. He suggests that we might need a different kind of moral theory (like an impersonal one) to account for the wrongness. The student's phrasing that it's a "useful corrective" is also an interpretation and might be too casual for an exam.

  4. The answer does not explicitly state why the nonidentity problem is a challenge to person-affecting accounts. It implies it, but the question requires an explicit explanation.

  Grading:
  - Full marks for the definition and the example: 8/8 (if we break it down: 4 for definition, 4 for example).
  - The explanation of the challenge to person-affecting accounts: the student does not define person-affecting views and only implicitly addresses the challenge. We might give 3 out of 6 for this part (because the example does show the challenge, but without explicit mention of what person-affecting accounts are and how they are challenged, it's incomplete).
  - The extra material about the Repugnant Conclusion and total utilitarianism is not asked for and is incorrect, so we deduct 2 points for that.
  - The conclusion about Parfit's view is oversimplified, so we deduct 1 point.
  - There is also a lack of explicit structure for the challenge, so we might deduct 1 more for that.

  Alternatively, we can break down the total of 20 as:
  - Definition: 5 points
  - Explanation of challenge to person-affecting accounts: 5 points
  - Example: 5 points
  - Clarity, precision, and avoiding errors: 5 points

  Then:
  - Definition: 5/5 (clear and correct)
  - Challenge explanation: 2/5 (because it doesn't define person-affecting views and only implies the challenge)
  - Example: 5/5 (good example and well explained in the context of the problem)
  - Clarity and errors: 3/5 (because of the Repugnant Conclusion error and the oversimplification of Parfit's conclusion)

  Total: 5+2+5+3 = 15/20.

  But that seems low. Alternatively, we might be more generous on the challenge explanation because the example does illustrate the challenge and the student does say the child isn't harmed on person-affecting definitions. So let's say 4/5 for challenge explanation? Then 5+4+5+3 = 17/20.

  Alternatively, a common breakdown might be:
  - Definition: 3 points
  - Challenge: 7 points (because that's the core of the question)
  - Example: 5 points
  - Overall clarity and accuracy: 5 points

  But I think the original question is 3 parts: explain the problem (which includes the example), explain the challenge, and illustrate with example. So maybe:

  - Explanation of nonidentity problem (including example): 10 points
  - Explanation of challenge to person-affecting accounts: 10 points

  But the example is part of the explanation of the problem, so we can do:

  Part 1: Definition and example (10 points)
  Part 2: Challenge to person-affecting accounts (10 points)

  For part 1, the student gets 10/10? The example is correct and the definition is correct.

  For part 2, the student does not explicitly define person-affecting accounts and only implies the challenge. The student does say: "Since the child isn't harmed on any standard person-affecting definition of harm, ...". That does address the challenge, but without defining what a person-affecting account is, it's a bit weak. Also, the extra material about the Repugnant Conclusion and the oversimplification of Parfit's conclusion are in this part and are errors. So we might give 7/10 for part 2.

  Total: 17/20.

  Comments:

  1. Good definition of the nonidentity problem and a well-chosen example that illustrates it correctly.

  2. You correctly identify that the child is not made worse off and therefore not harmed in the person-affecting sense. However, you should explicitly define what a person-affecting account is (e.g., an act is wrong only if it makes some particular person worse off than they would have been otherwise). This is the core of the challenge: the nonidentity problem shows cases where an act seems wrong but does not make any particular person worse off.

  3. The comparison to the Repugnant Conclusion is incorrect. The Repugnant Conclusion is a separate problem in population ethics and does not use the nonidentity problem's structure. The nonidentity problem does not lead to the Repugnant Conclusion, and the reasoning is distinct. Avoid conflating them.

  4. Be cautious in stating Parfit's conclusion. While Parfit argues that the child is not wronged, he does not necessarily conclude that the mother's act is not wrong. He uses the nonidentity problem to challenge person-affecting views and to suggest that we might need an impersonal theory (e.g., one that focuses on the total amount of well-being) to account for the wrongness.

  Therefore, I assign 17/20.

