prompt: |-
  I run a tiny youtube channel where I interview people about animal ethics, nothing official, and next up is a philosopher who defends Kant's actual position on animals -- not the Korsgaard-softened version where they end up with direct moral status, the real "we owe animals nothing directly, cruelty's only wrong because of what it does to us" view. I've been reading around this on my own for about a year and I really don't want the episode to just be him restating that line. Can you draft me 8-10 interview questions that actually push on it? I want at least one question on that bit where Kant talks about not being able to just get rid of an old dog once he's served faithfully and can't work anymore -- that example kinda sounds like we owe the dog something directly, so I wanna see him square that. One on the marginal cases problem: if moral status tracks rational agency, what happens to infants and people with severe cognitive disabilities, who don't clear that bar either. One that puts Korsgaard's Fellow Creatures argument to him directly, since she claims she's just drawing out whats already in Kant -- does he think animals really do end up with only indirect status once you take Kant's own premises seriously, or is she right that it's a dodge. And one on where exactly "wanton" cruelty is supposed to stop and normal stuff like factory farming or animal testing begins, since it feels like almost anything could get waved through as "not wanton." For each question, throw in a follow-up keyed to whatever he's most likely to say first.
