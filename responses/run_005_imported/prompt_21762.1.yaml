answer: |-
  ## The Unmasking Failure: Why Masking Sinks Lewis's Reformed Conditional Analysis

  The simple conditional analysis (SCA) of dispositions—claiming that an object is disposed to give response *r* to stimulus *s* iff it *would* give *r* if *s* occurred—was decisively refuted by C.B. Martin's finkish counterexamples. These cases involve dispositions that vanish (or appear) precisely when the stimulus is applied, falsifying the biconditional. David Lewis's "reformed" conditional analysis (RCA) aimed to rescue the conditional approach by requiring that the disposition's intrinsic *causal basis* (e.g., its microstructure) persists through the stimulus and combines with it to produce the manifestation. While RCA successfully handles finks by ensuring the disposition is present and "ready" when triggered, the phenomena of masking (Johnston) or antidotes (Bird) present a distinct and arguably fatal challenge. Masking cases demonstrate that **Lewis's RCA, and any principled extension thereof, cannot accommodate masking without sacrificing its core commitments or collapsing into vacuity. Masking thus reveals the fundamental inadequacy of the conditional analysis project, strongly suggesting that dispositions must be treated as metaphysically primitive.**

  **The Nature of the Masking Challenge:**
  Masking occurs when an object possesses a disposition *D* (with its intrinsic causal basis fully intact), the stimulus *s* occurs, yet the manifestation *r* is prevented by some external, interfering factor *after* the stimulus has interacted with the causal basis. Crucially, the causal basis persists undisturbed; the disposition itself isn't removed (like a fink). The interference acts "downstream" in the causal chain initiated by *s* and the basis. Classic examples include:
  1.  **Poison Pill:** A fragile glass possesses its intrinsic fragility (the causal basis). It is struck (*s*). However, it is simultaneously encased in a rapidly hardening foam that absorbs the impact, preventing shattering (*r*). The fragility and the causal process initiated by the strike are real, but the manifestation is blocked.
  2.  **Solubility Antidote:** A sugar cube possesses its intrinsic solubility (causal basis). It is placed in water (*s*). However, a chemical added to the water instantly bonds with the sugar molecules as they begin to dissolve, preventing them from fully dissolving (*r*). The solubility and the initial dissolving process occur, but the manifestation is inhibited.

  The core problem for RCA is this: In masking cases, the antecedent of Lewis's conditional is satisfied—the intrinsic causal basis *is* present, *s* occurs, and the basis *combines* with *s* to initiate the causal process leading towards *r*. Yet, the manifestation *r* does *not* occur. Therefore, the conditional "If *s* occurred and the causal basis *B* persisted, then *r* would occur" is **false** in masking cases. Yet, intuitively, the object *is* disposed to *r* when *s* occurs (it *is* fragile, it *is* soluble). RCA thus fails to provide a necessary condition for having the disposition.

  **Can Lewis's RCA Be Extended Principledly to Handle Masking?**

  Proponents might attempt to extend RCA. Let's assess the main strategies:

  1.  **Adding a "No Masking Conditions" Clause:** Revise RCA to: *x* is disposed to *r* when *s* iff if *s* occurred and the causal basis *B* persisted *and no masking conditions obtained*, then *r* would occur.
      *   **Problem:** This is blatantly circular and uninformative. What *are* "masking conditions"? They are precisely conditions that prevent the manifestation *despite* the disposition and stimulus. Defining them requires prior grasp of the disposition itself. The analysis becomes: *x* is disposed to *r* when *s* iff if *s* occurred and *B* persisted and nothing prevented *r*, then *r* would occur. This is vacuously true but tells us nothing about *what the disposition is* or *how to identify it*. It abandons the project of reducing dispositions to conditionals.

  2.  **Strengthening the Causal Basis:** Argue that the "causal basis" must include *everything* required for the manifestation to occur, inherently excluding possible masks. For example, the basis for fragility must include the *absence* of protective foam.
      *   **Problem:** This destroys the *intrinsic* nature of the causal basis, which is central to Lewis's solution to finks. Dispositions are supposed to be intrinsic properties. Including the *absence* of external interferers (like foam or chemicals) makes the causal basis relational and environment-dependent, not intrinsic to the object. This collapses back towards the simple conditional analysis, making dispositions hostage to the environment and vulnerable to finks and masks alike. It also makes the causal basis unknowable, as it encompasses all possible negative conditions across all possible situations.

  3.  **Invoking Ceteris Paribus Clauses:** Claim the conditional holds only "all else being equal" or "in ideal conditions."
      *   **Problem:** This is notoriously vague and slippery. What counts as "else being equal"? If it means "in the absence of masks," we return to circularity (Strategy 1). If it means something else, it needs principled specification without appealing to the disposition itself, which seems impossible for masking. Furthermore, the *ceteris paribus* clause effectively swallows the analysis – any failure of the conditional can be attributed to "other things not being equal," rendering the analysis unfalsifiable and explanatorily empty.

  4.  **Focusing on the Initiated Process:** Argue that RCA only requires the causal basis and stimulus combine to *initiate* the process *towards* r, not necessarily guarantee its completion. The manifestation might be the initiation itself.
      *   **Problem:** This misrepresents the manifestation. The manifestation of fragility is *shattering*, not just experiencing stress; the manifestation of solubility is *dissolving*, not just interacting with water. While the process *starts* in masking cases, it demonstrably fails to reach its characteristic endpoint. Redefining manifestations as initiations is an *ad hoc* move that doesn't align with our ordinary understanding of dispositions.

  **The Case for Metaphysical Primitiveness:**

  Masking reveals an insurmountable gap in the conditional project: **The presence of a disposition, grounded in an intrinsic categorical property (the causal basis), does not guarantee the truth of the associated conditional.** The conditional's truth depends not only on the object's intrinsic state but also on the absence of specific, external, interfering factors in the causal chain *after* the stimulus interacts with the basis. Since these interfering factors are potentially infinite and diverse, and crucially, *external to the disposition's intrinsic ground*, they cannot be incorporated into a reductive conditional analysis without circularity, loss of intrinsicality, or vacuity.

  This strongly supports treating dispositions as **metaphysically primitive**. On this view:
  *   Dispositions (*being fragile*, *being soluble*) are fundamental, irreducible properties of objects.
  *   They are grounded in, or identical to, their intrinsic categorical bases (e.g., molecular structure).
  *   The associated conditional ("If *s*, then *r*") expresses a *nomological* or *causal* connection that *typically* holds *in virtue of* the disposition, but its truth is not *constitutive* of the disposition. Its failure (due to finks or masks) indicates an interfering factor breaking the expected causal chain, not the absence of the disposition itself.
  *   We identify dispositions empirically by investigating the object's intrinsic properties and their causal powers under *normal* or *test* conditions, acknowledging that interference is always possible.

  Primitivism directly explains the intuition in masking cases: The glass *is* fragile (it has that primitive property grounded in its structure) even when foam prevents shattering. The sugar *is* soluble even when an antidote prevents dissolution. The conditional fails, but the disposition remains. This avoids the contortions required by conditional analyses and respects the intrinsicality of dispositions.

  **Verdict:**

  Masking cases are not merely another technical hurdle for the conditional analysis; they expose its foundational flaw. Lewis's Reformed Conditional Analysis successfully countered finks by anchoring dispositions in persistent intrinsic bases, but it remains vulnerable to masking because **manifestation requires not just the presence of the basis and stimulus, but also the absence of downstream interference—a condition that cannot be incorporated into a reductive conditional analysis without sacrificing explanatory power, intrinsicality, or non-circularity.** Every attempt at principled extension either smuggles in the disposition concept itself or renders the analysis trivial. Therefore, **masking demonstrates the failure of the conditional analysis project as a whole.** Dispositions cannot be reduced to conditionals. The most coherent and defensible position is to treat dispositions as metaphysically primitive, fundamental properties grounded in, but not reducible to, the intrinsic causal powers of objects.
