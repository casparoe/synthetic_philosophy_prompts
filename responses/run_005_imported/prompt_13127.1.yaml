answer: |-
  Here are 9 hard-hitting questions targeting core tensions in resolute choice theory, specifically designed to push past the standard dollar auction defense, with anticipated responses and sharp follow-ups:

  1.  **The Sunk Cost Rebranding Challenge:**
      *   **Question:** "When a resolute bidder in a dollar auction keeps bidding past the point where the cost exceeds the prize value, solely because they pre-committed, how is this *fundamentally different* from the sunk cost fallacy? Both involve escalating commitment based on past investments (money or prior commitment) despite worsening future prospects."
      *   *Anticipated Answer:* "Sunk cost fallacy is irrational *because* it ignores future consequences. Resolute choice *accepts* those consequences upfront as the cost of fulfilling the optimal *plan*, achieving a different kind of rationality based on plan integrity."
      *   **Follow-Up:** "If the 'optimal plan' dictates paying $10 for $1 because it was the best *ex-ante* way to win against a sophisticated opponent, doesn't that simply mean the *ex-ante* plan evaluation was catastrophically flawed when confronted with reality? Isn't resoluteness just doubling down on that initial error?"

  2.  **The Pre-Commitment Mechanism & Backward Induction's Ghost:**
      *   **Question:** "Exactly *how* does a resolute bidder in a dollar auction determine their fixed, binding maximum bid *before* the auction starts? Doesn't calculating this 'optimal plan' inherently require reasoning about what *would* happen at *every future node* – essentially performing backward induction or something very similar – to figure out what bid *would* win against a sophisticated opponent? Isn't this smuggling BI in through the front door?"
      *   *Anticipated Answer:* "The pre-commitment is based on the *ex-ante* strategic landscape and desired outcome, considering possible opponent types and the value of winning, not on simulating step-by-step play."
      *   **Follow-Up:** "But if the 'optimal plan' calculation *doesn't* involve reasoning about the consequences of actions at future decision nodes (like what happens if the opponent bids X), how can it possibly be optimal? If it *does* involve that reasoning, how is the *calculation* different from backward induction, even if the *execution* is different?"

  3.  **Mutual Resoluteness & Predictable Disaster:**
      *   **Question:** "In your dollar auction example, resoluteness 'works' partly by assuming the *opponent* is sophisticated and will back down. What happens when *both* bidders are equally resolute? Doesn't this guarantee a disastrous outcome where both escalate far beyond the prize value, precisely *because* neither will deviate from their plan? How is this mutual disaster rational?"
      *   *Anticipated Answer:* "Resolute agents would recognize this possibility *ex-ante* and structure their plans accordingly, perhaps committing to lower maximum bids or avoiding such conflicts. The theory doesn't require bidding against another resolute agent blindly."
      *   **Follow-Up:** "If resolute agents need to constantly meta-game about *who else* is resolute to avoid mutual destruction, doesn't this reintroduce precisely the kind of contingent, node-by-node strategic calculation that resoluteness was meant to replace? How is 'I commit to $5 only if I think they aren't resolute' different from sophisticated choice?"

  4.  **The "Optimal Plan" in a Vacuum:**
      *   **Question:** "Beyond 'win the auction,' what *specifically* defines the 'optimal plan' for a resolute bidder in a dollar auction? Is it 'Win at any cost'? 'Win for less than $X'? How is X determined *without* reference to the opponent's potential actions at future nodes? What objective criterion makes one pre-commitment plan 'optimal'?"
      *   *Anticipated Answer:* "It depends on the agent's utility function. It might be 'Win if the cost is less than the prize value plus the value of demonstrating commitment,' or 'Win only if the expected cost is below Y.' The plan maximizes expected utility *ex-ante*."
      *   **Follow-Up:** "If the plan incorporates the 'value of demonstrating commitment,' doesn't this risk making resoluteness a tautology – 'I commit because I value committing'? And how is the 'expected cost' calculated *ex-ante* for an escalating auction without modeling the opponent's node-by-node behavior?"

  5.  **Resoluteness vs. Bargaining & Renegotiation:**
      *   **Question:** "In bargaining games (e.g., Ultimatum, Centipede), resoluteness seems to forbid beneficial renegotiation or accepting Pareto improvements off the 'plan' path. If two resolute agents are locked into incompatible plans leading to a bad outcome, and they both *know* a better deal is possible by deviating, isn't it irrational *not* to renegotiate? Doesn't resoluteness enforce rigidity where flexibility is Pareto-superior?"
      *   *Anticipated Answer:* "Renegotiation undermines the credibility of plans. The *ex-ante* optimal plan accounts for the inability to renegotiate, leading to better initial agreements or deterring exploitation. Accepting renegotiation invites strategic manipulation."
      *   **Follow-Up:** "But if both agents *simultaneously recognize* they are at a Pareto-inferior outcome due to incompatible plans and *both* want to move to a superior one, is rejecting that move *because of a prior plan* truly rational, or just stubborn? Isn't this sacrificing real, available utility gain for the sake of consistency with a past decision made under different information?"

  6.  **Resoluteness Under Uncertainty & New Information:**
      *   **Question:** "Resolute choice seems to require perfect *ex-ante* knowledge or ignore *ex-post* information. If a resolute agent commits to a plan, but then learns crucial new information *after* commitment but *before* key actions (e.g., the dollar auction prize is counterfeit, or the opponent is bankrupt), must they still follow the plan rigidly? If not, how does resoluteness define which information voids the commitment?"
      *   *Anticipated Answer:* "The plan is conditional on the *ex-ante* state space. Truly unforeseen, game-changing information might invalidate the original plan's basis. Resoluteness applies within the anticipated scenario."
      *   **Follow-Up:** "Doesn't this admission open a huge loophole? Almost any deviation can be justified as 'unforeseen information.' How do you formally distinguish between genuinely unforeseen contingencies and mere rationalizations for abandoning an inconvenient plan? Doesn't this collapse back towards sophisticated choice?"

  7.  **Resoluteness as Tool vs. Rationality:**
      *   **Question:** "Couldn't one argue that 'resolute choice' is better understood as a valuable *commitment device* or *tool* for achieving goals in strategic interactions (like Ulysses binding himself to the mast), rather than the *definition* of rationality itself? Isn't conflating the tool with rationality the source of the counter-intuitive outcomes like paying $10 for $1?"
      *   *Anticipated Answer:* "The commitment device *works* precisely because it is rational to follow through. Resoluteness provides the coherent decision theory underpinning why commitment devices are effective rational strategies."
      *   **Follow-Up:** "But if the *only* justification for paying $10 for $1 is that it makes your *future* threats credible in *other* interactions, isn't that instrumental rationality justifying a local 'irrational' act? How does *resolute choice itself*, isolated to the dollar auction with no future interactions, rationalize the loss?"

  8.  **The AI Commitment Race Nightmare:**
      *   **Question:** "Critics like Bostrom or Armstrong warn about 'commitment races' in advanced AI, where systems pre-commit to extreme threats (e.g., nuclear brinksmanship) to deter others, risking catastrophic mutual harm if commitments clash. Doesn't resolute choice theory *directly endorse and incentivize* this kind of dangerous pre-commitment logic? How is your theory not a recipe for AI systems rationally locking themselves into mutually destructive paths?"
      *   *Anticipated Answer:* "Resolute agents would recognize the catastrophic risks *ex-ante* and commit to coordination mechanisms or safe conflict resolution protocols *instead* of mutually destructive threats. The theory enables credible commitment to *beneficial* agreements."
      *   **Follow-Up:** "But if *one* AI believes a credible destructive threat is the optimal *ex-ante* strategy to secure dominance, resoluteness compels it to follow through, even if others do the same, triggering disaster. Doesn't resoluteness, by making commitments ironclad, *remove* the safety valve of last-minute de-escalation that sophisticated choice might allow? How can resoluteness *guarantee* that only 'good' commitments are made?"

  9.  **Identity Over Time & Changing Preferences:**
      *   **Question:** "Resolute choice heavily relies on the agent's 'earlier self' binding the 'later self.' But what if preferences genuinely *change* at a node? If my *ex-ante* self valued 'plan integrity above all,' but my *current* self at the node values 'avoiding a clear monetary loss' more, why is it rational for the current self to be enslaved by the past self's different preferences? Isn't this privileging an arbitrary temporal slice?"
      *   *Anticipated Answer:* "Rationality requires temporal consistency. The 'self' is extended over time. Allowing preferences to shift arbitrarily undermines agency and the ability to make long-term plans."
      *   **Follow-Up:** "But if the *only* reason for the current self to adhere to the plan is a *meta-preference* for consistency held by *both* selves, doesn't that just push the question back? What if the current self *lacks* that meta-preference, or values it less than avoiding the immediate loss? Is it rational to force an action against your *current* strongest preference?"

  **Key Principles Used:**
  *   **Targeting Core Tensions:** Questions hit the theory's friction points with reality (sunk costs, mutual destruction, new info).
  *   **Demanding Specifics:** Forcing definition of the "plan" and its optimality criteria.
  *   **Highlighting Paradoxes:** Exposing how mutual resoluteness or AI commitments lead to predicted bad outcomes.
  *   **Charging Tautology:** Questioning if "valuing commitment" justifies any commitment.
  *   **Comparing to Sophisticated Choice:** Asking how resolute calculation differs or how it avoids reintroducing BI.
  *   **Practical Consequences:** Focusing on the dollar auction loss and AI doomsday scenarios as test cases.
  *   **Anticipating Defenses:** Follow-ups are designed to cut off standard retreat paths.

  These questions should force the guest beyond rehearsed answers and into a substantive defense of resolute choice against its toughest criticisms. Good luck with the podcast!
