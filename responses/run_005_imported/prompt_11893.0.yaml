answer: |-
  Here’s a draft opinion addressing M.’s case and proposing institutional policy, designed to cut through the past/present self dichotomy and confront the trigger-contestability problem head-on:

  ---

  **ETHICS COMMITTEE OPINION: Case #M. & Ulysses Clause Directive**  
  **Date:** [Thursday Date]  
  **Committee Draft Lead:** [Your Name]  

  ### I. RECOMMENDATION FOR M.’S CURRENT CASE
  **The Committee Recommends Honoring M.’s Psychiatric Advance Directive (PAD) with the Ulysses Clause.**  
  *Rationale & Implementation:*  
  1.  **Trigger Verification:** The objective sleep-log criterion (≤4 hours/night for ≥3 nights) was met per documentation from M.’s psychiatrist and sister. Her current objection to the *accuracy* of the logs does not invalidate the trigger, as the PAD explicitly designated these parties as joint verifiers. Re-litigating verified triggers mid-crisis undermines the contract’s purpose.  
  2.  **Override of Current Objections:** The PAD’s language ("treat objections as symptoms, disregard") must be respected. Competence during mania is often domain-specific; M.’s coherence on unrelated topics does not equate to capacity to revoke a precommitment designed *for* this exact impaired state. Her history shows catastrophic loss of insight *during* episodes despite surface articulateness.  
  3.  **Proxy Authority:** M.’s named proxy (not the boyfriend of 2 months) holds decision-making authority per the PAD. Treatment should proceed per the pre-approved medication list.  
  4.  **Documentation & Review:** Clinicians must meticulously document: (a) verification of trigger criteria, (b) assessment of current mental state noting preserved/diminished capacities, and (c) rationale for overriding contemporaneous objections. Schedule a formal review of the PAD’s ongoing validity *once M. is stabilized and independently assessed as competent*.

  ### II. RESOLVING THE "TRIGGER CONTESTABILITY" PARADOX
  The core problem—Ulysses contracts failing precisely when contested—demands structural solutions, not ad-hoc judgments:  
  -   **The "Schelling Point" Solution:** Triggers must be **objectively verifiable ex-ante and monitored by pre-designated, conflict-minimized agents.** M.’s PAD succeeded here: sleep logs are quantifiable, and verification relied on her psychiatrist (clinical expertise) + sister (personal observation), minimizing unilateral error or bias. Contestability *during crisis* is intentionally excluded by design.  
  -   **Failure Mode:** If triggers are subjective ("I feel manic") or verifiers lack independence, the contract *is* vulnerable to dissolution when needed. M.’s PAD avoids this. Honoring it reinforces the institution’s capacity to uphold valid precommitments.  
  -   **Not Past vs. Present Self:** This is about **recognizing temporally extended agency.** Past-M made a reasoned choice to protect her long-term interests against a known threat (mania) that systematically distorts present-M’s judgment. Respecting *only* present-M ignores her documented life history and values expressed when capable of foresight.

  ### III. PROPOSED HOSPITAL POLICY ON ULYSSES CLAUSES
  To prevent future improvisation, the Committee recommends adopting the following policy within **90 days**:  
  1.  **Validity & Enforceability:** Ulysses Clauses within PADs are **presumptively valid and enforceable** if:  
      -   Executed while independently verified competent.  
      -   Contain **objective, measurable clinical triggers** (e.g., specific BPRS scores, sleep data, positive drug screens, not just "mania suspected").  
      -   Designate **specific, agreed-upon verifiers** (e.g., "Treating Psychiatrist X + Family Member Y").  
      -   Include **explicit language** authorizing override of contemporaneous objections during the triggered episode and prohibiting revocation mid-episode.  
  2.  **Trigger Verification Protocol:**  
      -   Verification requires **concurrent agreement** of all designated agents.  
      -   Verification is **time-limited** (e.g., valid for 72 hours post-trigger, requiring re-verification for prolonged episodes).  
      -   **Documentation Must Include:** Raw data supporting trigger (e.g., sleep logs), verification signatures, timestamp.  
  3.  **Capacity Assessment During Triggered Episode:**  
      -   A formal capacity assessment (focused on understanding the PAD, its consequences, and reasons for revocation) is **required** but **informative, not determinative**.  
      -   Current objections can only override the PAD if the patient demonstrates **stable capacity specifically regarding the PAD decision** *and* the objection isn’t a predicted symptom per the PAD/history. Burden of proof lies with revocation advocates.  
  4.  **Review & Sunset Provisions:**  
      -   All PADs with Ulysses Clauses automatically expire after **2 years** unless reaffirmed while competent.  
      -   Mandatory review of the PAD (not necessarily revocation) **within 30 days** of episode resolution.  

  ### IV. THE CONSTITUTIONAL PARALLEL (Brief Addendum)
  The analogy to entrenched constitutional clauses (e.g., Elster) is structurally valid but ethically distinct in one key respect:  
  -   **Asymmetry of Rationality:** Constitutions bind future majorities presumed equally rational. Ulysses contracts bind a *future self* facing a *known, pathology-induced rationality deficit*. Past-M isn’t "tyrannizing" present-M; she is deploying a defense *against* the tyranny of a transient pathological state that historically destroys her rational agency. The justification hinges on the **predictable, episodic collapse of the self’s decision-making capacity**, not mere preference persistence. This asymmetry justifies enforceability in the psychiatric context where the "constituent power" (stable self) acts to preserve core identity/values against a recurring threat the "governed" (manic self) cannot reliably perceive.  

  ### V. TIMELINE FOR POLICY ADOPTION
  1.  **This Week:** Circulate this draft for Committee vote on M.’s case.  
  2.  **Within 2 Weeks:** Form Policy Subcommittee (include psychiatrists, legal counsel, patient advocate, ethics lead).  
  3.  **45 Days:** Subcommittee drafts full policy proposal based on Section III.  
  4.  **75 Days:** Committee review/approval of draft policy.  
  5.  **90 Days:** Hospital leadership adoption & implementation.  

  ---

  **Key Strengths of this Approach:**  
  -   **Actionable:** Gives M. immediate resolution grounded in her PAD’s validity.  
  -   **Precedent-Setting:** Turns the trigger-contestability problem into policy requirements (objective triggers, multi-agent verification).  
  -   **Philosophically Rigorous:** Avoids past/present stalemate by focusing on extended agency and predictable irrationality. Directly engages Elster.  
  -   **Institutionally Responsible:** Mandates timely policy creation with clear standards.  
  -   **Clinically Nuanced:** Requires capacity assessment but acknowledges its limits in this specific pathology.  

  This draft forces the committee to confront the operational reality: **A Ulysses contract that bends when screamed at is no contract at all.** The solution isn’t abandoning the concept, but designing triggers and verification protocols robust enough to withstand the storm.
