  The constitutional comparison: both cases involve binding future decision-makers. The justification here is stronger because the past self is the same person, and mental illness creates a temporary incapacity. Unlike constitutions, psychiatric directives address a clear asymmetry in competence. 

  The user also needs a timeline for policy adoption. Propose forming a subcommittee to draft policy within 3 months, consulting legal experts and patient advocates. Immediate steps for M.: honor the directive after trigger confirmation, document thoroughly, and schedule a review once stable. 

