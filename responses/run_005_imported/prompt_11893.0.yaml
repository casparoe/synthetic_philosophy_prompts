  The user also mentioned the constitutional theory parallel with entrenched clauses. That's an interesting angle. I should address how the individual and collective cases compare. The ethical principles at play here include autonomy (both past and present), beneficence, non-maleficence, and justice. The committee has to weigh these while considering clinical outcomes and legal precedents.

