prompt: |-
  Ok so last night I got into a proper long argument with my friend Priya (shes doing a PhD in semantics/pragmatics) about Grice, and I'm still chewing on it. I run a tiny podcast about language and philosophy on the side, and next month's guest is a philosopher who has basically built her whole career defending the classical Gricean picture of implicature more or less unmodified -- the cooperative principle, all four maxims plus their sub-clauses, the calculability requirement, the lot -- against both the neo-Griceans who want to compress everything down into two or three heuristics and the relevance theorists who want to throw out the maxims entirely for a single principle of relevance. Priya's whole argument was that "calculable in principle" is doing way more work than it should: you can always reverse-engineer some chain of reasoning from the maxims that "derives" whatever implicature you already believed was there, so the theory never actually predicts anything in advance, it just rationalizes after the fact. I argued back but didn't have a great answer, and it's honestly still bugging me.

  Could you draft me 8-10 interview questions for this guest that go beyond just having her restate the cooperative principle for the audience? I want at least one question that presses directly on that calculability/unfalsifiability worry, one on why we need four separate maxims (with all their sub-maxims) rather than the single-principle move relevance theory makes, and one on conventional implicature specifically -- since that category doesn't seem to derive from the maxims or the cooperative principle at all, which seems like a weird loose end for a maxim-based theory to be carrying around. If you can fit it in, I'd also love one on hard cases for the "flouting" story, like loose talk -- people say things like "France is hexagonal" constantly without meaning to communicate something blatantly false that needs to be calculated away. For each question, throw in a quick follow-up keyed to whatever answer she's most likely to give, so I'm not caught flat-footed if she just gives the standard reply.
reasoning: |-
  Okay, let me unpack this user's request. They run a philosophy-language podcast and had a heated debate with Priya (a semantics PhD) about Grice's calculability requirement. Now they're interviewing a staunch Gricean defender and need sharp questions that press on calculability's predictive power, the four-maxim structure, conventional implicature, and loose talk. 

  First, I notice the user's frustration with Priya's "unfalsifiability" critique - that Gricean reasoning feels like retroactive rationalization. That's the core tension: does calculability actually constrain theories or just describe? The guest will likely argue calculability forces systematicity, so I'll need follow-ups about falsifiability thresholds. 

  For the four-maxims question, relevance theorists would collapse everything into cognitive efficiency. The guest probably thinks granularity captures nuances like irony vs metaphor. Follow-up should challenge whether sub-maxims are truly necessary or just taxonomic. 

  Conventional implicature is messy - words like "but" carry non-cancellable meaning unrelated to maxims. Guest might call it a separate layer, but that risks making Grice's framework seem incomplete. Follow-up should press why this isn't a theoretical gap.

  Loose talk ("France is hexagonal") is perfect for testing flouting. Guest may call it "exploiting" Quality maxim differently, but then how is that distinct from relevance theory's "optimal relevance"? Need follow-up comparing the mechanisms.

  User's clearly done homework - cites neo-Griceans (Levinson), relevance theory (Sperber/Wilson), knows conventional implicature debates. Questions should match their level. Podcast context means balancing depth with listenability - no jargon dumps. 

  Structure-wise: opener on why defend Grice today, then calculability (Priya's point), maxim granularity, conventional implicature, loose talk, and close with modern challenges. Each Q needs a steelman version of guest's likely answer plus a thorny follow-up. 

  Biggest risk is letting guest retreat to textbook definitions. Questions must force engagement with criticisms - e.g., "How would your account of loose talk differ from relevance theory's in a testable way?" 

