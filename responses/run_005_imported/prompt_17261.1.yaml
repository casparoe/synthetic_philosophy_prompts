prompt: |-
  One of my favorite former grad students is getting married in a few weeks and asked me to give the toast, which is a little terrifying -- half the room is my department and will catch every reference, the other half is her family, who as far as I know have never discussed ethics on purpose in their lives. Here's what I want to build it around: she's an animal-welfare utilitarian who thinks eating meat is a real wrong but never gave much thought to flying; her fiance thinks flying is a real climate wrong but has zero qualms about a burger; and somewhere in the last few years together they basically struck a moral trade -- he went vegetarian, she barely flys anymore -- without either one changing their mind about the other's issue at all. (I think this is basically the Toby Ord thing, gains from trade across a moral disagreement instead of within a market.) I want the toast to use that idea to say something true and a little moving about the two of them, but it can NOT come across as "they compromised their principles for each other," since that's exactly backwards and would honestly annoy both of them a bit -- the whole point of a moral trade is that nobody waters anything down. Can you write me something like a five-minute toast that pulls this off for both halves of the room?
reasoning: |-
  Okay, the user wants me to write a wedding toast that bridges two worlds: academic philosophers and family members who may not engage with ethical discussions. The core idea is fascinating - a couple made a "moral trade" where each adopted the other's ethical practice without changing their underlying beliefs. 

  Hmm, the challenge is making this accessible without dumbing it down. The family half needs to feel included, while the philosophy crowd should nod in recognition. I need to avoid jargon but keep the intellectual depth. 

  The key is framing this as a strength, not compromise. They didn't dilute their principles - they expanded their moral horizons. The Toby Ord reference helps anchor it for academics, but for others I'll use "different moral languages" as metaphor. 

  I'm noticing the user fears sounding like they compromised. That's crucial. Words like "exchange" or "agreement" work better than "compromise." The toast must celebrate how they honor each other's values. 

  For structure: start with warmth about the couple, explain the ethical dynamic simply, then reveal the trade as something remarkable. End with how this makes them stronger partners. The "two languages" analogy can carry through. 

  The climate/meat examples are perfect - concrete enough for everyone. I'll keep academic references subtle (Ord gets one name-drop). Humor helps too - that "never discussed ethics on purpose" line is gold, should stay. 

  Biggest risk is losing half the audience. Need transitions like "Now, some of you might wonder..." to acknowledge different perspectives. The moral must be universal: real love means seeing value in what matters to your partner. 

  *scribbles outline* Opening cheers -> their contrasting passions -> the beautiful tension -> the trade explained -> why it's profound -> marriage application -> final blessing. Keep it under 5 mins with pauses.
answer: |-
  Here’s a 5-minute toast that celebrates their "moral trade" without implying compromise, weaving warmth, clarity, and intellectual respect for both halves of the room:

  **(Raise glass, warm smile)**
  "Friends, family, colleagues... thank you for gathering to celebrate [Bride] and [Groom]. As [Bride]'s former advisor, I’ve had a front-row seat to her brilliant mind and fierce heart. And getting to know [Groom] these past few years, I’ve seen that same remarkable combination of conviction and kindness in him. Today isn’t about dissertations or debates, but I *do* want to share something unique and beautiful about how these two fit together – because it says everything about why their marriage is going to be extraordinary.

  **(Shift tone slightly – conversational, inclusive)**
  "Now, some of you know [Bride] thinks deeply about ethics, especially how we treat animals. For her, choosing a veggie burger isn’t just a preference; it’s a deeply held principle about reducing harm. Others here know [Groom] is passionate about our planet. For him, skipping a flight isn’t just frugal; it’s a tangible stand against climate change.

  **(Introduce the 'tension' playfully)**
  "Here’s the thing they discovered early on: [Bride], bless her, could probably write a thesis on factory farming but hadn’t lost much sleep over her carbon footprint from flying. And [Groom], wonderfully pragmatic about trains and buses, saw absolutely no conflict between saving the glaciers and enjoying a juicy steak. They fundamentally disagreed on the *other’s* core issue!

  **(The Revelation – Key Moment)**
  "You might expect this to cause friction. You might expect passionate debates ending in stalemates, or maybe... a messy compromise where both watered down their beliefs to meet in the middle. But that’s not what happened. What they did was far more interesting, far more respectful, and honestly, far more powerful.

  **(Explain the Trade – Simply and Powerfully)**
  "They made a *trade*. A moral trade. [Groom] looked at [Bride]'s conviction about animals and thought, 'Her reasons are strong, her commitment is real. Even if *my* primary focus is elsewhere, *I* can honor *her* values by making this change *myself*.' So, he embraced vegetarianism – wholeheartedly, for *her* principle.

  "And [Bride] looked at [Groom]'s dedication to the planet, saw the integrity in his actions, and thought, 'His concern is vital, his commitment is real. Even if *my* primary calculus weighs animal suffering most heavily, *I* can honor *his* values by making this change *myself*.' So, she grounded her frequent flyer miles – wholeheartedly, for *his* principle.

  **(Emphasize the Crucial Point – NO COMPROMISE)**
  "Let me be crystal clear: **Neither of them changed their mind.** [Bride] still believes eating meat is a profound wrong. [Groom] still believes unnecessary flying is a climate sin. There was no surrender, no dilution of belief. What happened was something rarer and more profound: **They each chose to fully adopt the other's value as their own action, *out of respect for the other person's moral universe*.** They expanded their own practice to encompass the other's deeply held truth.

  **(Connect to Love and Partnership)**
  "This isn't just clever ethics; it’s the blueprint for an incredible marriage. It shows a level of respect that goes beyond mere tolerance. It’s active, engaged love. It’s saying: 'I see what matters most to you. I may navigate the world differently, but your north star is so important to *you*, that I will make it a guide for *my* actions too. Not because I’m convinced, but because *you* are convinced, and *you* matter that much to me.'

  "They didn’t meet in some mushy middle. They each moved *towards* the other's pole, planting their flag firmly there, *for* each other. They built a bigger shared world, not a smaller negotiated one.

  **(The Toast – Universal and Moving)**
  "So, let’s raise our glasses to [Bride] and [Groom]:
  *   To the courage to hold your convictions fiercely.
  *   To the even greater courage to embrace your partner's convictions with equal fervor, simply because they are *theirs*.
  *   To a love that doesn’t demand agreement, but inspires profound, active respect.
  *   To a partnership built not on compromise, but on the radical, generous expansion of each other’s values into your own lives.
  *   To the best moral trade I’ve ever witnessed – may your life together be filled with countless more acts of such generous, principled love.

  "To [Bride] and [Groom]!"

  **Why this works:**

  1.  **Accessibility:** Uses simple analogies ("north star," "blueprint," "planting their flag"). Explains the core issues (meat = animals, flying = climate) clearly without jargon. The "trade" concept is intuitive.
  2.  **Academic Nod:** Mentions ethics, principles, conviction, and subtly references the "moral trade" concept (Toby Ord is recognizable to the department without needing explanation for others). The structure is logically sound.
  3.  **Emphasis on NO COMPROMISE:** The bolded section explicitly states it. Phrases like "no surrender," "no dilution," "not a messy compromise," "didn't change their mind," and "not a smaller negotiated world" hammer it home.
  4.  **Celebrates Them Individually and Together:** Highlights both their strong individual convictions *and* the unique strength of their partnership. Shows mutual respect.
  5.  **Connects to Marriage:** Explicitly links the "moral trade" to the core ingredients of a strong marriage – respect, active love, generosity, building a shared world.
  6.  **Tone:** Warm, celebratory, respectful, slightly playful at the start, building to a moving conclusion. Avoids lecturing.
  7.  **Structure:** Clear narrative arc: introduce couple -> their values -> the apparent tension -> the unique solution -> why it's profound -> connect to marriage -> toast.
  8.  **Time:** Carefully paced, this should land right around 5 minutes.

  This toast honors their intellectual integrity while making their profound act of love understandable and moving for everyone in the room. Cheers!
