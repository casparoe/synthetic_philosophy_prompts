  Also, alternative uses of the money. If he invested in career retraining, that could have a tangible positive impact. Comparing opportunity costs might appeal to practical outcomes over speculative ones.

  The user's deeper need is to protect their brother from a costly mistake while preserving their relationship. They need structured arguments that aren't dismissive but encourage critical thinking. Emphasizing epistemic humility—admitting uncertainty—could help. Suggesting consulting experts or evaluating the group's track record adds practical steps.

  In summary, the flaws are: unsubstantiated probability, ignoring personal risk, marginal impact dilution, and vulnerability to Pascal's Mugging. The user can challenge the probability's basis, stress the real-world consequences, and propose due diligence without rejecting longtermism entirely.
answer: |-
  You're absolutely right to sense a flaw in the reasoning, and it's *not* just bias against small probabilities. While expected value (EV) calculus is a powerful tool, applying it uncritically to scenarios with **astronomical stakes multiplied by arbitrarily tiny probabilities** leads to several fundamental problems, known collectively as **"Pascal's Mugging."** This is exactly what your brother is encountering.

  Here's a breakdown of the principled problems with his argument, why it feels "off," and how to counter it without abandoning EV entirely:

  1.  **The Problem of Unconstrained Probability Estimates:**
      *   **The Flaw:** The core vulnerability is that the claimed probability (1-in-200,000) is essentially pulled from thin air. It has no empirical basis, no established methodology for calculation, and no way to be verified or falsified. In EV calculations, *P* (probability) is just as crucial as *V* (value). If *P* can be made arbitrarily small *by assertion*, then *any* action, no matter how absurd or costly, can be justified by *any* sufficiently large *V* (like "trillions of future lives").
      *   **Why it feels off:** It makes reasoning hostage to whoever can make the most extreme (and unverifiable) claim about potential impact. "This $40k has a 1-in-10^15 chance of saving 10^100 future lives!" becomes an unbeatable EV argument using this logic.
      *   **Counter-argument:** "Your EV calculation *assumes* the 1-in-200,000 probability is meaningful and reasonably estimated. But how was this number derived? What's the specific model showing *exactly* how my $40k to *this specific group* closes this 'last gap'? What's the margin of error on that model? Without robust, verifiable evidence for *that specific probability figure*, the entire EV calculation collapses. It's not that small probabilities are zero, it's that *unsubstantiated* probabilities are epistemically worthless for decision-making. The burden of proof is on them to demonstrate that probability isn't just wishful thinking."

  2.  **Neglecting the Cost of Being Wrong & Personal Risk:**
      *   **The Flaw:** The calculation focuses *only* on the potential (massive) upside *if the specific scenario is true and the donation is pivotal*. It completely ignores:
          *   **The near-certain downside:** Draining his 401k has a *very high probability* (near 1) of causing him significant, tangible harm: financial insecurity, stress, lost compounding growth, potential hardship later in life, limited options if he finds a new job but has no savings.
          *   **Alternative high-value uses:** The $40k could have significant positive expected value *for him and others* in the real world *right now* (e.g., retraining, starting a business, supporting family, donating to proven-effective charities addressing current suffering like malaria prevention). Comparing only the speculative upside to "doing nothing" is a false dichotomy.
          *   **The probability the *entire premise* is wrong:** The probability that longtermist AI-risk models are fundamentally flawed, or that this specific group is ineffective, or that the "last gap" narrative is mistaken, might be *much higher* than 1-in-200,000. He's only comparing the upside of his *specific bet* being right against the baseline, not against the upside of other actions.
      *   **Why it feels off:** It dismisses concrete, near-term suffering and risk (his own) for an abstract, distant, and highly uncertain potential benefit. It feels reckless.
      *   **Counter-argument:** "EV needs to account for *all* possible outcomes and their probabilities. What's the EV calculation that includes the *high probability* of you losing your retirement security and facing significant hardship? What's the EV of using that $40k for retraining, starting a small business, or donating to GiveWell's top charities *today*? Ignoring these high-probability negative outcomes and alternative high-EV opportunities makes the calculation incomplete and biased towards the speculative bet."

  3.  **The Problem of Marginal Impact & Diminishing Returns:**
      *   **The Flaw:** The argument assumes his $40k is uniquely pivotal ("the thing that tips us away"). This is incredibly unlikely for several reasons:
          *   **Funding Scale:** If the problem truly requires billions to solve, $40k is a rounding error. Its marginal impact on the probability of success is negligible.
          *   **Diminishing Returns:** Even within a small group, additional funding often has decreasing marginal utility. The first $100k might be crucial for salaries/rent; the next $40k might fund a conference with minimal impact on the core "gap."
          *   **Substitutability:** If his $40k *isn't* donated, someone else might donate later, or the group might find funding elsewhere, or the problem might be addressed by another team.
      *   **Why it feels off:** The idea that one person's relatively modest donation is the linchpin preventing extinction feels grandiose and disconnected from how large-scale problems (even existential ones) are actually solved.
      *   **Counter-argument:** "Even if we grant that funding *this specific group* has *some* positive impact, what evidence is there that *your specific $40k* is the critical, marginal dollar that makes the difference between success and failure? How does their funding level directly map to the probability of closing this 'gap'? If they are $1 million short, your $40k increases their funding by 4%, but does that linearly translate to a 4% increase in their probability of success? Almost certainly not. More likely, the impact of your marginal dollar is vanishingly small, making the 1-in-200,000 figure vastly overstated *even if the group's work is valuable*."

  4.  **Vulnerability to Exploitation (Pascal's Mugging):**
      *   **The Flaw:** This reasoning pattern is inherently vulnerable to grifters and well-intentioned but misguided groups. Anyone can claim: "Give me $X, there's a tiny chance it prevents catastrophe Y with astronomical value Z." The logic compels donation unless you can *prove* the probability is *exactly* zero, which is often impossible.
      *   **Why it feels off:** It feels like being held hostage by an unfalsifiable claim. The "cult" vibe your friends picked up on stems partly from this – groups exploiting this exact logical vulnerability to solicit funds for unproven, speculative causes.
      *   **Counter-argument:** "This type of reasoning makes you vulnerable to anyone making an extraordinary claim about their unique ability to avert catastrophe. How do you distinguish *this* three-person group from others making similar claims? What specific track record, transparency, or independent validation do they have that justifies believing *their* probability estimate over someone else's? The structure of the argument itself is easily weaponized."

  **How to Push Back Effectively (Without Throwing Out EV):**

  1.  **Focus on the Probability:** This is the weakest link. Don't attack the value of future lives; attack the *basis* for the 1-in-200,000 figure. Ask:
      *   "Walk me through *exactly* how you or they calculated that number. What's the model? What are the assumptions? What's the confidence interval?"
      *   "What evidence demonstrates that *this specific group* is uniquely positioned to close this gap?"
      *   "What's the probability that their model/theory of the 'gap' is simply wrong?"
      *   "How sensitive is the result to small changes in the assumptions? If one assumption is off by 10%, does the probability become 1-in-2-million or 1-in-20,000?"

  2.  **Highlight the Personal Cost & Alternatives:** Make the *real*, *near-term* consequences tangible.
      *   "What happens to *you* if you drain the 401k and then face an emergency or can't find a job for another year?"
      *   "Have you calculated the EV of using this money to significantly improve *your own* stability and future earning potential, which could allow you to donate *more* later, potentially even to *more proven* causes?"
      *   "What's the EV of donating this to a charity with a proven track record of saving lives *right now* (e.g., Against Malaria Foundation)? How does *that* EV compare, using *actual evidence-based probabilities*?"

  3.  **Challenge the Marginal Impact:** Undermine the "pivotal dollar" assumption.
      *   "How much total funding do they need to be successful? How does your $40k specifically move the needle on *that* probability?"
      *   "If you don't donate, what's the probability someone else fills that gap? What's the probability the 'gap' isn't as critical as they claim?"

  4.  **Question the Group's Credibility & Transparency:** Shift focus to due diligence.
      *   "Who are these people? What's their background? What have they *actually delivered* before? Are their research plans, budgets, and reasoning publicly available and scrutinized?"
      *   "Have they been evaluated by independent, credible actors in the field (not just others within the same bubble)?"

  5.  **Acknowledge the Core Logic, Then Refine It:** Show you understand but see the pitfalls.
      *   "I get the EV logic: Tiny P * Enormous V can dominate. But math only works with good inputs. Unconstrained P makes the logic self-destruct because *any* action can be justified by *any* cost. We need *reasons* to believe P is 1/200k and not 1/200 billion or 1/20. The burden is on them to provide that evidence, and right now, it seems like an arbitrary number supporting an extraordinary claim. It's not rounding to zero; it's demanding evidence before betting your future on a number pulled from the air."

  **Conclusion:**

  Your brother isn't *mathematically* wrong given *his assumptions*, but his assumptions (especially the pivotal probability) are critically flawed and unsupported. The problem isn't EV itself; it's the **unjustified, unverifiable, and arbitrarily small probability estimate** combined with **ignoring the significant near-term costs and risks** and **overestimating the marginal impact** of his specific donation. This combination creates a classic "Pascal's Mugging" scenario. You can reject *this specific application* of EV without rejecting the concept entirely by demanding robust evidence for the probability claim and insisting on a complete accounting of all costs and alternative uses of the resources. The flaw is in the inputs and the scope of the calculation, not in EV per se.

  Focus the conversation relentlessly on the provenance and justification of *that specific probability number* and the tangible consequences for *him*. That's where his argument is most vulnerable. Good luck – this requires patience and persistence.
