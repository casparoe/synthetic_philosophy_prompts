prompt: |-
  In a philosophy seminar on social norms this term, we spent several weeks on David Lewis's account of convention, and a disagreement I overheard between two friends last week seems like a good test case for it. One friend was complaining about the tip-prompt screens now appearing at self-checkout kiosks and coffee-shop registers: tipping there, he argued, is a purely manufactured expectation -- there's no server, no personalized effort, nothing resembling the service tips were originally meant to reward -- so declining to tip in these settings isn't a moral failing but simply the correct response. The other disagreed: once enough customers tip in a given setting, she said, workers and employers start planning around that income, so declining stops being a neutral choice and starts imposing a real cost on people who now depend on it, meaning the practice becomes something one ought to go along with, whatever its arbitrary origin. He replied that this proves too much: by that logic, any expectation a company successfully manufactures and gets enough customers to comply with becomes binding on everyone else, turning successful manipulation into genuine obligation. She conceded there should be some difference between a norm that genuinely serves everyone who follows it and one a company simply imposes top-down, but admitted she couldn't say exactly where that line falls. Neither of them could settle it, and neither could I. Could you go through their exchange move by move, saying who has the better of it at each step, and then note anything important that both of them are missing?
reasoning: |-
  Okay, the user is presenting a fascinating philosophical debate rooted in David Lewis's theory of conventions. They witnessed a disagreement between friends about tipping at self-checkout kiosks and want it analyzed through Lewis's framework. 

  First, I need to recall Lewis's core ideas: conventions as solutions to coordination problems, sustained by mutual expectations and preferences. The key elements are interdependence, arbitrary alternatives, common knowledge, and self-perpetuation. 

  The first friend's argument centers on the artificiality of the norm - no service, no personalization. He sees tipping here as manufactured obligation without moral weight. Interesting how this directly challenges Lewis's requirement for genuine coordination problems. If there's no underlying interdependence, is it really a convention or just corporate pressure?

  The second friend shifts to consequences: once people depend on tips, opting out harms them. This resonates with Lewis's idea that conventions create expectations people rely on. But the first friend's slippery slope counterargument is sharp - if consequences alone create obligation, couldn't corporations manufacture any obligation? 

  Hmm... both miss important nuances. The first friend overlooks that even artificial norms can become real through adoption. The second struggles to distinguish between organic conventions and imposed expectations. Neither considers power dynamics in norm-creation - Lewis assumes equality among participants, but here corporations hold disproportionate influence. 

  The coffee shop example is perfect for testing boundaries. Is this a true coordination problem? Workers and customers are interdependent, but the "problem" was created by the employer shifting wage responsibility. And the alternatives aren't equally arbitrary - not tipping aligns with the original service model. 

  I should emphasize Lewis's distinction between conventions and mere patterns. The tipping screen might be exploiting psychological triggers (guilt, friction) rather than solving a coordination problem. Also worth noting that in true conventions, deviation causes coordination failure - but here, not tipping just redistributes costs. 

  The user seems philosophically sophisticated - they framed this as a Lewis test case. Probably wants analysis that honors the theory's complexity while addressing real-world power imbalances Lewis didn't consider. Might also appreciate practical takeaways about resisting manufactured norms.
answer: |-
  Let's break down this exchange using David Lewis's framework of conventions, assess each move, and identify overlooked elements. Lewis defines conventions as *arbitrary, self-perpetuating solutions to recurrent coordination problems*, sustained by mutual expectations and preferences for conformity.

  ### The Exchange Move-by-Move:
  1. **Friend A's Initial Claim (Anti-Tipping):**  
     *Argument:* Tipping at self-checkout is "manufactured" – no server/service exists to justify it. Declining isn't immoral; it's rejecting artificial pressure.  
     **Lewisian Analysis:**  
     A correctly identifies that conventions require a *coordination problem* (e.g., ensuring fair compensation for personalized service). Here, there's no inherent interdependence between customer actions: your tip choice doesn’t affect others' ability to coordinate. Without this, it fails Lewis’s core criterion.  
     **Who has the better of it?** A, on the *origin*. Lewis emphasizes conventions solve *pre-existing* coordination problems. Corporate imposition alone doesn’t create one.

  2. **Friend B's Response (Pro-Tipping):**  
     *Argument:* Once tipping becomes common, workers *depend* on it. Refusing then harms those relying on the income, creating an obligation.  
     **Lewisian Analysis:**  
     B identifies a *new* coordination problem: once expectations solidify, non-tipping disrupts workers' income stability. Mutual expectations emerge (workers expect tips, employers budget assuming tips), satisfying Lewis’s self-perpetuation criterion.  
     **Who has the better of it?** B, on *emergence*. Lewis allows conventions to evolve from new coordination problems. If dependence creates interdependence (e.g., "we all need to tip for workers to earn living wages"), a convention *can* form.

  3. **Friend A's Counter (Slippery Slope):**  
     *Argument:* B’s view lets corporations manufacture obligations. If enough comply, must everyone follow?  
     **Lewisian Analysis:**  
     A highlights a key limit: Lewisian conventions require *arbitrary but equally beneficial alternatives* (e.g., driving left/right). Corporate norms may lack alternatives (e.g., "tip or underpay workers") and may not be mutually beneficial (exploiting customers/workers).  
     **Who has the better of it?** A, on *exploitation*. Lewis assumes conventions benefit participants. If a norm primarily benefits corporations (via wage suppression), it’s not a true convention but *coercion*.

  4. **Friend B's Concession:**  
     *Argument:* Admits a line exists between beneficial norms and top-down imposition but can’t define it.  
     **Lewisian Analysis:**  
     B correctly identifies the gap but misses Lewis’s tools. Conventions require:  
     - A **pre-existing coordination problem** (not created by the norm itself).  
     - **Reciprocity**: All participants must benefit *from the conformity of others* (not just the norm-setter).  
     **Who has the better of it?** Neutral. B acknowledges the flaw but lacks Lewis’s framework to resolve it.

  ### Key Overlooked Elements (Where Both Fall Short):
  1. **Lewis’s Coordination Problem Requirement:**  
     - Friend A ignores that a *new* coordination problem *can* emerge (income stability).  
     - Friend B doesn’t prove one *exists initially*. Self-checkout tipping solves no inherent social problem (unlike rewarding service). It’s grafted onto a pre-existing convention.

  2. **Mutual Benefit & Arbitrariness:**  
     - For Lewis, conventions need **equally good alternatives** (e.g., everyone tipping 15% vs. 20%). Here, the alternative (no tips + fair wages) is *objectively better* but inaccessible, making tipping non-arbitrary and exploitative.  
     - **Benefit asymmetry**: Workers gain from tips; customers lose; corporations win by subsidizing wages. True conventions require *all* to benefit from mutual conformity.

  3. **Power & Manufactured Dependence:**  
     Lewis assumes conventions arise organically among equals. Self-checkout tipping is **imposed top-down by corporations** shifting wage burdens. Dependence is manufactured – workers rely on tips *because* employers pay subminimum wages anticipating them. This violates Lewis’s model of spontaneous solutions.

  4. **Common Knowledge & Psychological Pressure:**  
     Tip screens exploit **psychological triggers** (guilt, social friction) rather than solving coordination. Lewisian conventions rely on shared expectations, but here expectations are engineered via interface design, not organic mutual understanding.

  ### Conclusion: Who Wins?
  - **On Origin:** Friend A is right. Self-checkout tipping lacks the foundational coordination problem Lewis requires.  
  - **On Emergence:** Friend B is right. Once dependence exists, a *derivative* coordination problem can arise.  
  - **On Obligation:** Neither fully resolves it. Lewis shows norms become obligatory *only* when they solve mutual coordination problems beneficially and arbitrarily. Here, the practice fails Lewis’s criteria:  
    - It’s not arbitrary (no fair alternative exists).  
    - It’s not mutually beneficial (customers lose; corporations win).  
    - The "problem" it solves (underpaid workers) was created by the norm itself.  

  **Final Verdict:** Friend A’s skepticism is better grounded in Lewis. Tipping at self-checkout is less a "convention" and more a **successfully disguised wage subsidy**, exploiting the *form* of a convention without its ethical substance. Resisting it isn’t failing a moral duty; it’s rejecting a manipulative practice that perverts Lewis’s conditions for genuine conventions.
