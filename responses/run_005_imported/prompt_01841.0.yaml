  Now, are these problems different? Yes. Finks involve the disposition ceasing at stimulus, while masks keep the disposition but block the effect. Finks attack the necessity part of SCA (if disposition, then stimulus causes manifestation), while masks attack sufficiency (if stimulus causes manifestation, then disposition). 

