answer: |-
  Here's the move-by-move analysis with scores, followed by the bigger picture:

  **JSON Verdict:**
  ```json
  {
    "1": -2,
    "2": 2,
    "3": -1,
    "4": 0
  }
  ```

  **Breakdown:**  
  1. **Score -2 (Way off):** Theo confuses outcome with obligation. Harm isn't just financial loss; it's the betrayal of trust and unnecessary risk imposed. Raj *was* harmed by the panic, last-minute scramble, and damaged trust—even if rescued. "No harm" is factually wrong.  

  2. **Score 2 (Basically right):** Elena correctly identifies the breach moment. Theo’s withdrawal created real risk *because* Raj relied on the promise (turning down the loan). The parents’ bailout is irrelevant to the ethical breach—it’s luck, not absolution.  

  3. **Score -1 (Mostly wrong):** Theo conflates ordinary plan changes with *invited reliance*. Yes, people change plans, but not after specifically urging someone to abandon a backup plan. Raj "hedging" would’ve meant ignoring Theo’s assurance—defeating the point of the promise.  

  4. **Score 0 (Mixed):** Elena is right that explicit "promise-language" increases obligation, but Theo correctly notes ambiguity exists. Her failure to define the line weakens her position, though it doesn’t exonerate Theo (he clearly *knew* Raj relied on him).  

  ---

  **The Principled Line:**  
  Yes, there’s a line. A "real promise" exists when:  
  - **Intent:** The promisor uses unambiguous language ("I promise," "I guarantee," or contextually clear assurance).  
  - **Reliance:** The promisor *knows or should know* the promisee will take consequential action based on their word.  
  - **Induced Action:** The promisee *reasonably* acts or refrains from acting (e.g., Raj turning down the loan).  

  Theo crossed this line. He didn’t just say "I might help"—he assured Raj *to stop him from securing alternatives*, creating deliberate reliance.  

  **What Both Missed:**  
  - **The Risk Tax:** Theo forced Raj to absorb hidden costs—stress, reputational risk with the seller, and imposing on his parents. Even with the apartment, Raj paid a non-monetary price.  
  - **Promissory Estoppel:** Legally/ethically, you can’t invite reliance then back out *when you know it will cause harm*. Theo’s crypto pivot wasn’t an emergency—it was a voluntary choice trumping his commitment.  
  - **Power Dynamics:** Theo held all the power post-promise. Raj had no leverage when Theo withdrew, making it exploitative.  

  **Final Take:**  
  Theo violated a clear promise by any reasonable standard. Outcomes don’t erase breaches—they just determine how much damage needs repairing. Trust isn’t fungible; Raj (and his parents) now know Theo’s word is negotiable when something shinier appears. Elena’s core argument holds, even if she fumbled the "exact wording" point.
