  Ok so I had this whole exhausting argument at dinner on Sunday -- except it wasn't really mine, it was between my friends Theo and Elena, and I just got stuck in the middle for like an hour. Background: Theo promised his brother-in-law Raj back in March that he'd lend him the down payment on an apartment once his bonus came through. Raj went ahead and made an offer, told the seller he had the money lined up, and turned down a personal loan he'd been offered so he wouldn't be loosing money to interest twice over. Two weeks before closing, Theo texts him saying he's not doing it anymore, he'd rather put the bonus into some crypto thing. Raj panicked but his parents covered it at the last minute, so he ended up with the apartment anyway. Theo told this whole story like it was a funny anecdote, and Elena said he'd wronged Raj regardless of how it turned out. It went back and forth for a while:

  (1) Theo said it's a non-issue since Raj ended up with the apartment -- nobody was actually harmed, so there's nothing to feel bad about.
  (2) Elena said the wrong happened the moment he backed out and left Raj exposed -- Raj turned down a backup loan and told the seller he was financed because he trusted Theo's word, and his parents bailing him out afterwards is just luck, not vindication.
  (3) Theo said that logic proves too much: people change plans for good reasons all the time and we don't call it a betrayal every time someone quietly counted on the original plan, so there has to be some line between a real promise and just saying you'll probably do something, and Raj should've hedged regardless.
  (4) Elena said the line is that Theo used actual promise-language specifically to get Raj to stand down from his backup loan, which invites a lot more reliance than "I'll try" -- but when pushed she admitted she couldn't say exactly how explicit the wording needs to be before it counts as a real promise, and Theo jumped on that, saying if she can't draw the line she can't accuse him of crossing it.

  Neither of them budged and i was too busy refereeing to actually weigh in. Can you go through it move by move? Give me a verdict on each as a json block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>} from -2 (way off) to 2 (basically right), explain each score in a sentence or two, and then say whether you think there's an actual principled line between a real promise and a casual assurance, plus anything you think they're both missing entirely.
