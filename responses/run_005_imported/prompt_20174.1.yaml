  The user's friend sees a contradiction: how can Ramsey dismiss cosmic scales but then advocate for future generations? The user wants to reconcile these and speculate on Ramsey's stance on modern longtermism. I need to use Ramsey's known views to build an argument.

  First, the "human mood" emphasizes intrinsic human values. Ramsey values consciousness and relationships. This isn't about ignoring the future but focusing on what gives life meaning. Longtermism, as argued by Bostrom, prioritizes future sentient beings, aligning with valuing consciousness. So Ramsey might support that aspect.

  His savings paper argues against pure time discounting. He sees future people as morally equal. So his concern for the future is based on their potential for valuable experiences, not just numbers. This counters the friend's point. The conflict isn't between human scale and future concern but between valuing human experiences versus cosmic insignificance.

  Ramsey might critique longtermism's focus on sheer numbers. He valued individual experiences deeply. So while he'd care about existential risks, he might not prioritize them to the exclusion of current suffering. Also, his mathematical approach suggests he'd engage with models but question oversimplifications.

