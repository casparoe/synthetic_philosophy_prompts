prompt: |-
  Got into an argument about this on the ACX subreddit a while back and never got a satisfying answer, so hoping you can settle it. I've been rereading the Sequences and Yudkowsky's "conservation of expected evidence" post is one of those results everyone on LW treats as obviously true and kind of boring: if you can already predict which direction you'll update your credence in, you should just update now, since your expected future credence has to equal your current one -- that's basically just the law of total probability. Separately I've been poking around in formal epistemology (SEP rabbit hole, as always) and ran into van Fraassen's Reflection Principle, which says the same thing as far as I can tell: if your certain what your credence in some claim will be at a later time, your credence now should already equal that. He even backs it with an explicit Dutch book argument -- if you don't conform, a bookie can set up bets now and later that guarantee you a loss regardless of outcome.

  Except in that literature this is apparently a live, heavily contested principle, not some settled one-paragraph result. There's a whole back and forth of counterexamples (something about anticipating you'll be drunk, senile, or otherwise less reliable later, and I think a positive case involving a guru you know will end up being right), plus decades of people -- Christensen, maybe Talbott, don't remember exactly who -- proposing increasingly fiddly restrictions on when you're actually supposed to defer to your future self like that. If it's the same underlying mathematical result, why does the philosophy side treat this as such an open problem requiring decades of patches, when LW apparently nailed the whole thing in one moderately short blog post? Am I missing some real technical difference between the two principles, or is this just the same idea getting independently reinvented by two communities that don't read each other, with the philosophers being unnecessarily precious about it?
reasoning: |-
  Okay, the user is asking about the difference between Eliezer Yudkowsky's Conservation of Expected Evidence (CEE) and van Fraassen's Reflection Principle. They noticed that both seem mathematically similar but the philosophical reception is very different. CEE is treated as straightforward in the LessWrong community, while Reflection is debated in formal epistemology. The user is confused about why one is uncontroversial and the other isn't if they're essentially the same.

  First, I need to recall what each principle states. CEE says that if you expect to update your belief in a certain direction upon receiving evidence, your current belief should already incorporate that expectation. It's derived from the law of total probability. For example, if you think seeing a black swan would lower your belief that all swans are white, but not seeing one would raise it, the expected value of your future belief equals your current belief.

  Reflection Principle states that your current credence should match your expected future credence at a later time, conditional on what you believe now. Van Fraassen uses a Dutch book argument: if you violate this, a bookie can exploit you with bets now and later. But philosophers have counterexamples, like knowing you'll be drunk or brainwashed in the future.

  The key difference is the conditions under which the principles apply. CEE is about updates based on new evidence, assuming rationality is maintained. Reflection is about future credences regardless of why they change. So if the future self is irrational or has compromised mental states, Reflection doesn't hold, but CEE still does because it's evidence-based.

  The user might be missing that CEE assumes rational updating with evidence, while Reflection applies to any future belief change, including irrational ones. That's why philosophers debate restrictions—they're accounting for cases where future beliefs aren't trustworthy. The LessWrong community might take rational updating for granted, hence seeing it as simple.

  Also, the user might be seeking validation that they're not overlooking a technical difference. Confirming that both principles share the same mathematical foundation (law of total probability) but differ in scope and application. The philosophical debate stems from broader epistemic concerns about self-trust and rationality over time, whereas CEE is more narrowly scoped to evidence updates.

  The user's deeper need could be understanding why two fields treat similar concepts differently. They might want to reconcile the approaches or grasp the philosophical nuances. Highlighting the assumptions behind each principle and how context affects their validity should address their core concern.
answer: |-
  You've hit on a fascinating and subtle point where mathematics, philosophy, and community norms intersect. You're absolutely right that **the core mathematical insight underlying both Conservation of Expected Evidence (CEE) and the Reflection Principle (RP) is the same: the law of total probability.** However, the *interpretation, scope, and intended application* differ significantly, leading to the vastly different receptions in the LessWrong (LW) community versus formal epistemology. Here's the breakdown:

  1.  **The Shared Mathematical Core (Law of Total Probability):**
      *   **CEE:** As Yudkowsky presents it, CEE is a direct consequence of the law of total probability applied to your *future credence* conditional on *possible future evidence*. If `P(H)` is your current credence in hypothesis H, and `P(H|E_i)` is your credence if you see evidence `E_i`, and `P(~E_i)` is your credence if you don't see `E_i` (or see some alternative), then:
          `P(H) = P(H|E) * P(E) + P(H|~E) * P(~E)`
          More generally, over a partition of possible evidence `{E_i}`:
          `P(H) = Σ_i [P(H|E_i) * P(E_i)]`
          This *mathematically forces* your current credence to be the probability-weighted average of your possible future credences *after observing that evidence*. If you *expect* to update up on average (conditional on the evidence you might see), you must already be high enough to make the average work, and vice-versa. It's about *evidence-based updating*.

      *   **Reflection Principle (Simple Version):** Van Fraassen's RP states that your current credence in A should equal your expectation of your future credence in A at time t:
          `P_now(A) = E_now[ P_t(A) ]`
          Where `E_now` is the expectation taken with respect to your current probability function. **This expectation *is* calculated using the law of total probability.** If `{S_j}` represents a partition of states that determine what your credence at t will be (or what you *think* it will be), then:
          `E_now[P_t(A)] = Σ_j [P_t(A | S_j) * P_now(S_j)]`
          But `P_t(A | S_j)` is just the specific credence you *think* you'll have in A at t if state `S_j` holds (e.g., if you see evidence `E_j`). So, fundamentally:
          `P_now(A) = Σ_j [P_future_j(A) * P_now(S_j)]`
          This is *mathematically identical* to the CEE formula, where `S_j` corresponds to the possible future evidence states `E_i`.

  2.  **The Crucial Difference: Scope and "Why" of Belief Change**
      *   **CEE (LW Interpretation):** This is presented **exclusively as a constraint on how you update your beliefs *in response to anticipated future evidence***. The future credences `P(H|E_i)` are defined as what your belief *should be* after rationally processing evidence `E_i`. The emphasis is on *rational updating conditional on specific evidence streams*. It's a statement about the internal consistency of your *planned* or *obligatory* response to evidence. The "future you" in CEE is implicitly assumed to be your *rational* self after seeing `E_i`.
      *   **Reflection Principle (Philosophical Target):** Van Fraassen originally presented RP as a much **more general norm of epistemic deference to your *future self*, regardless of *why* your belief changes.** The future credence `P_t(A)` is simply whatever you *believe now* that your credence *will actually be* at time t, for *any reason whatsoever* – new evidence, forgetting old evidence, cognitive decline, emotional trauma, brainwashing, guru hypnosis, etc. RP, in its simple form, demands that you *now* adopt whatever belief you *anticipate* having *later*, even if you *now* believe that future belief is *irrational* or based on compromised faculties.

  3.  **Why Philosophers Freak Out (And LW Doesn't): The Counterexamples**
      The broader scope of RP is precisely what generates the famous counterexamples and decades of debate:
      *   **The Drunk/Senile Future Self (Christensen, others):** You know that tonight you will drink an enormous amount of alcohol and become highly irrational. You are currently sober and rational. You know that while drunk tonight (`t`), you will become convinced (P_t(A) = 0.99) that you are the king of France (A). RP (simple form) demands that you, sober now, must *also* believe P_now(A) = 0.99. This is absurd. You rationally believe your future drunken self will be wrong.
      *   **The Brainwashed Future Self:** You know that tomorrow you will be captured by a cult and subjected to highly effective brainwashing that will make you believe (P_t(A) = 1) that the cult leader is a god (A). RP demands you believe that *now*. Absurd.
      *   **The Guru Counterexample (Talbott, others - Positive Case):** You encounter a guru who has an astonishing track record. You are highly confident (but not certain) that this guru is epistemically superior and always right. You know that after spending time with the guru tomorrow, you *will* come to fully believe their strange doctrine (A). You *also* know that your *current* evidence strongly suggests A is false. RP (simple form) seems to demand you adopt belief in A *now*, simply because you anticipate believing it later after guru exposure, *even though* your current evidence says it's false. This seems to bypass current evidence in favor of anticipated deference. (Note: This case is more complex and debated than the impairment cases).
      *   **Forgetting/Information Loss:** You know that in the future, you will forget crucial evidence that currently supports A. You anticipate your future credence P_t(A) being lower than your current rational credence P_now(A). Simple RP demands you lower your credence *now* to match the *expected lower future credence*, effectively ignoring the evidence you *currently have* but know you will lose. This seems irrational.

  4.  **The LW Response vs. The Philosophical Response**
      *   **LW/CEE:** The LW community generally sidesteps the philosophical quagmire by **implicitly or explicitly restricting the principle to the case where the future belief state is your *rational* belief state *after updating on new evidence***. The counterexamples don't bite because the "future you" in `P(H|E_i)` isn't the *actually drunk* you, it's the *ideally rational you* processing `E_i`. If you anticipate becoming irrational or brainwashed, that future state isn't `P(H|E_i)` for any `E_i` you consider valid evidence processed rationally; it's a different state `S_j` (impairment) that you wouldn't *defer* to within the CEE framework. CEE is seen as a theorem about *rational updating plans*, not deference to any future self-state. Hence, it *is* boring and obvious *within that narrow scope*.
      *   **Formal Epistemology/Reflection:** Philosophers are deeply interested in the **general question of diachronic coherence (coherence over time) and self-trust.** *Can* there be a norm requiring deference to your future self? *When* is such deference rational? The simple RP makes a bold, general claim ("*Always* defer!") which the counterexamples show is untenable. The decades of work involve:
          *   **Identifying Restrictions:** Proposing conditions under which RP *should* hold (e.g., Christensen's "Rational Reflection", requiring deference only when you believe your future self will be *rational* and have at least your current evidence; "New Reflection" principles).
          *   **Refining the Principle:** Formulating more complex principles (e.g., involving higher-order probabilities - your credence about your own future rationality) that avoid the counterexamples while preserving some core idea of self-trust or coherence.
          *   **Exploring Justifications:** Arguing *why* some form of deference might be rational (avoiding Dutch Books *only if* the bookie can exploit you *at the future time* as well, epistemic authority of future evidence, coherence arguments).
          *   **Understanding Self-Location & Belief Change:** The guru case pushes into deep issues about how to integrate anticipated belief changes based on anticipated access to *superior* evidence/reasoning vs. your current evidence.

  **Answering Your Questions Directly:**

  1.  **Are they technically different?** At the *core mathematical level* (the law of total probability applied to expected future credence), **no, they are fundamentally the same formula.** `P_now(A) = E_now[P_future(A)]`.
  2.  **Why the different reception?** It's **primarily about scope and interpretation:**
      *   **CEE (LW):** Narrowly interpreted as a *descriptive consequence of rational updating plans in response to evidence*. Future credences represent *rational* post-evidence states. Counterexamples involving irrational future selves are outside its intended scope. Hence, "obviously true and boring" *within its frame*.
      *   **Reflection (Philosophy):** Broadly interpreted as a *prescriptive norm of diachronic coherence and self-deference*. Future credences represent *whatever you actually anticipate believing, for any reason*. This broad scope makes it vulnerable to compelling counterexamples involving irrationality, information loss, or conflicts between current evidence and anticipated belief changes. Hence, a "live, heavily contested principle".
  3.  **Is it just communities not talking?** Partly, but not entirely. The LW community derived the math independently, focusing tightly on Bayesian updating. Philosophers encountered the same math (via Dutch Books, coherence) but were immediately drawn to its broader implications for self-trust over time, where the counterexamples naturally arise. The philosophical debate stems directly from taking the *broad interpretation* seriously. The LW treatment avoids the controversy by sticking to the *narrow interpretation*.
  4.  **Are you missing a difference?** You've identified the core sameness correctly. The key nuance you might have missed is the **radical difference in how the "future credence" term (`P_t(A)`) is conceptualized:** Is it the credence of your *rational, evidence-updated* future self (CEE/LW), or is it the credence of your *actual, possibly compromised* future self (RP/Philosophy)? This difference in scope *creates* the entire philosophical controversy.

  **In essence:** Conservation of Expected Evidence is the Reflection Principle *restricted to the special case where the future credence is understood to be your rational credence after updating on specific evidence*. What LW considers the *whole point* is just one (relatively uncontroversial) *application* of the mathematical structure that philosophers see as having much wider, and more problematic, implications when generalized. The philosophers are wrestling with the messy reality of belief change over time in non-ideal agents, while the LW presentation assumes ideal rationality throughout the process. That's why one seems like a trivial theorem and the other like a deep, contentious puzzle.
