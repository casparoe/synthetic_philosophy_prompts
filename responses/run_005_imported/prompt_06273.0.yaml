  1. **S tier (essentially certain yes)**: These are entities that are widely accepted to have consciousness, with strong evidence of complex behaviors and neural structures that support integrated subjective experience.
     - Adult chimpanzee: Close evolutionary relative to humans, complex social behaviors, self-recognition, and evidence of rich inner life.
     - African grey parrot: Known for high intelligence, self-awareness (e.g., Alex the parrot), and complex communication.

  2. **A tier (very high credence)**: Entities with substantial evidence of consciousness, though perhaps not as uncontroversial as S tier.
     - Octopus: Highly intelligent, complex nervous system (with a central brain and distributed ganglia), exhibits play and problem-solving. However, their consciousness might be very different from mammals and birds.
     - Rainbow trout: Fish are known to exhibit pain responses and complex behaviors. Recent evidence suggests fish may have some level of consciousness.

  3. **B tier (high credence)**: Entities with good evidence but some significant doubts or less complex neural substrates.
     - Honeybee: Demonstrates learning, memory, and complex communication (waggle dance). They show signs of emotion-like states and are included in Birch's "edge of sentience" discussion. Unlimited associative learning (UAL) marker would include them.
     - Jumping spider: Known for complex hunting strategies, problem-solving, and good vision. Some studies suggest they may have cognitive abilities beyond typical arthropods.

  4. **C tier (moderate credence)**: Entities where the evidence is mixed or the neural basis is very different, but there are some reasons to consider the possibility.
     - Hermit crab: Crustaceans like crabs have been shown to experience pain and have some learning capabilities. However, their nervous system is simpler than cephalopods or vertebrates.
     - Box jellyfish: They have a complex visual system and can navigate purposefully. But jellyfish lack a centralized brain and have a diffuse nerve net. Some argue they might have a minimal form of consciousness, but it's highly controversial.

  5. **D tier (low credence)**: Entities where consciousness is unlikely but not entirely ruled out due to some minimal behavioral responses.
     - C. elegans: A roundworm with exactly 302 neurons. It exhibits simple learning and responses, but its nervous system is extremely rudimentary and fixed. No evidence of subjective experience.
     - Human fetus at 24 weeks: At this stage, the brain is developing but the cortex is still maturing. While there is some neural activity, it is generally thought that consciousness emerges later (around 24-28 weeks is a debated threshold). We have low credence because the necessary neural architecture for integrated conscious experience is not fully established.

  6. **F tier (essentially certain no)**: Entities that almost certainly lack any form of consciousness.
     - Sea sponge: No nervous system at all. They are simple filter feeders with no evidence of any neural activity or responsiveness beyond basic cellular reactions.
     - Patient in a persistent vegetative state (PVS): In PVS, there is no awareness of self or environment. The higher brain functions are absent, and only autonomic functions remain. Thus, no subjective experience.

  However, note that the human fetus at 24 weeks is a complex case. Some studies suggest that the thalamocortical connections necessary for consciousness start to form around 24-28 weeks, but it is not fully established. Therefore, we place it in D (low credence) rather than F because there is a possibility, but it is low.

