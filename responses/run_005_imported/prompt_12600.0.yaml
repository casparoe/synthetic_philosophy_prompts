  We are ranking nine theories from Laudan's list by how serious a threat they pose to scientific realism, particularly in terms of how difficult it is for a selective or structural realist to find something in the successor theory that vindicates the earlier theory as "approximately true". The tiers are S (greatest threat) to D (least threat).

  Key considerations:
  - **Selective realism (divide et impera)**: Can we identify specific working posits that were preserved or had a counterpart in the successor theory?
  - **Structural realism**: Can we identify mathematical structures that were retained across theory change?

  Theories:

  1. **Phlogiston theory of chemistry**: Posited a substance (phlogiston) released during combustion. Replaced by oxygen theory. Some argue that phlogiston theory got the role of gases in combustion reversed, but it did have some correct ideas about chemical reactions (e.g., conservation of matter). However, the central posit (phlogiston) was entirely abandoned. Selective realists might point to the idea of a substance involved in combustion, but it's not the same as oxygen. Structural elements? Not much mathematical structure to retain. Moderate to severe threat.

  2. **Caloric theory of heat**: Heat as a fluid (caloric) that flows from hot to cold. Replaced by kinetic theory. Caloric theory had successes in explaining heat conduction and the gas laws (via Carnot). The mathematical equations for heat flow and the laws of thermodynamics (like the inverse square law for radiation) were retained in the kinetic theory. Also, the conservation of caloric is analogous to conservation of energy. So, structural retention is strong. Selective realism might note that the idea of heat as a conserved quantity was preserved (as energy). Thus, it's a relatively easy case for realists.

  3. **Optical (luminiferous) ether**: A medium for light waves. Fresnel's equations were retained in Maxwell's theory and beyond. Worrall's structural realism uses this as a prime example: the equations survived even though the ontological commitment to the ether was dropped. So, it's a classic case for structural realism and not a severe threat.

  4. **Electromagnetic ether**: Similar to the optical ether but for electromagnetism. Maxwell initially thought of the ether as a mechanical medium, but his equations were retained in special relativity without the ether. Again, structural retention is strong (Maxwell's equations). So, like the optical ether, it's not a severe threat.

  5. **Crystalline spheres of ancient and medieval astronomy**: These were literal crystalline spheres carrying planets and stars. Replaced by Newtonian gravity and then relativity. There is no retention of the spheres in any form. No mathematical structure retained (Ptolemy's epicycles are mathematical, but the spheres are not). Selective realism: no working posit that survived. This is a clear case of a completely abandoned theory. High threat.

  6. **Humoral theory of medicine**: The body has four humors (blood, phlegm, black bile, yellow bile) and health is their balance. Replaced by modern physiology and germ theory. There is no direct retention: the humors are not real, and the idea of balance is too vague. However, some concepts like the importance of blood (though not as a humor) remain. But overall, very little is preserved. High threat.

  7. **Vital force theory of physiology**: A special life force distinct from physical and chemical forces. Replaced by biochemistry and molecular biology. The vital force was entirely abandoned. No mathematical structure. Selective realism: no working posit survived. This is a classic example of an abandoned theoretical entity. Very high threat.

  8. **Theory of circular inertia**: In Aristotelian and medieval physics, the natural state of celestial bodies was circular motion. Replaced by Newton's linear inertia. There is no retention: circular motion was abandoned in favor of linear inertia. However, the idea that celestial motion is uniform and circular (in a way) is partially preserved in Newton's circular orbits under gravity, but the underlying cause is different. But the concept of inertia itself changed fundamentally. Moderate threat.

  9. **Effluvial theory of static electricity**: Posited effluvia (streams of particles) as the cause of static electricity. Replaced by the concept of electric charge and fields. There might be some continuity in the idea of an electric fluid (like Franklin's), but the effluvia were abandoned. However, the mathematical description of electrostatic phenomena (e.g., Coulomb's law) was retained. So, structural retention is possible. Moderate threat.

  Ranking by threat level (hardest to defuse for realists):

  - **S (Most severe threat)**: Theories that are entirely abandoned with no structural retention and no working posits that can be salvaged. These are the most problematic for realists.

  - **A**: Very severe, but perhaps with a tiny bit of retention.

  - **B**: Moderate threat: some aspects can be salvaged, but the core ontology is gone.

  - **C**: Relatively easy for realists: significant structural retention or some key working posits preserved.

  - **D**: Least threat: clear structural retention or selective preservation.

  Reasoning for each:

  - **Crystalline spheres**: No retention. The spheres were completely abandoned. Even the structure (if any) was not mathematical. This is a paradigm example of a completely false theory that was successful for centuries. So, S tier.

  - **Vital force**: Entirely abandoned. No counterpart in modern biology. The concept of a non-physical life force is rejected. Also, no mathematical structure. So, S tier.

  - **Humoral theory**: Similarly, the specific humors are gone. The idea of bodily fluids having a role is partially preserved (e.g., blood, lymph), but the theory as a whole is completely rejected. The balance idea is too vague. No mathematical structure. So, high threat, but maybe not as bad as vital force? However, it's still very bad. Let's put it in A tier because there is some very loose continuity in the importance of bodily fluids, but not enough to call it approximate truth.

  - **Phlogiston**: The central posit is gone, but it did have some correct structural elements (e.g., conservation of mass in reactions). However, the reversal of the role of gases is a big problem. Selective realists can point to the idea of a substance involved in combustion (oxygen) but the theory got it backwards. So, it's a classic problem. B tier? Or A? It's often discussed as a key example, but realists can argue that the theory had some correct elements. However, the core ontology is wrong. Let's say B tier because there are some structural aspects (e.g., chemical reactions involve exchange of substances) but the specific posit is wrong.

  - **Caloric**: As noted, the mathematical structure was largely preserved (heat flow equations, Carnot cycle). Also, the conservation principle was transformed into energy conservation. So, realists have a good story. C tier.

  - **Optical ether**: Fresnel's equations were preserved. This is Worrall's go-to example for structural realism. So, D tier (least threat).

  - **Electromagnetic ether**: Similarly, Maxwell's equations were preserved without the ether. So, also D tier.

  - **Circular inertia**: The idea of circular motion for celestial bodies is still used (e.g., orbits) but the cause is gravity, not a natural tendency. The concept of inertia changed from circular to linear. So, there is a partial preservation of the idea of uniform circular motion, but the underlying mechanism is entirely different. Also, no mathematical structure from the old theory was preserved. So, moderate threat. C tier? But note: the mathematical description of orbits in Newton is circular (for simplicity) but actually elliptical. So, not even the motion is exactly circular. Thus, it's a high threat? Let's say B tier.

  - **Effluvial theory**: The idea of effluvia was abandoned, but the mathematical laws of electrostatics (like Coulomb's law) were preserved. So, structural retention is present. Thus, C tier.

  After reconsideration, let's assign:

