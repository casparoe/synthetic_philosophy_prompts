  But note: the electromagnetic ether and optical ether are both D.

  Also, for effluvial theory: if we consider that the laws of electrostatics were developed independently and then retained, but the effluvial theory itself did not have those laws. So, the theory was replaced without structural retention. Therefore, it might be a B or even A. However, there is a continuity in the concept of electric charge as a fluid-like substance (in Franklin, which was a development of effluvial ideas) that then led to the mathematical theory. So, selective realists can say that the idea of an electric fluid was a working posit that was approximately correct (as charge). But the effluvia were not exactly charge. It's messy.

