  - Crystalline spheres: S
  - Humoral: A (because there is some very weak continuity in the importance of bodily fluids, but not enough to save it)
  - Phlogiston: B (selective realists can argue that the theory got some reactions right, but the core posit is wrong; structural elements? Not much)
  - Circular inertia: B (the idea of circular motion for celestial bodies is still used, but the cause is different and the inertia is linear; no math structure)
  - Effluvial: B (no math structure, but the idea of something flowing might be seen as a precursor to charge, but it's weak)
  - Caloric: C (math structure preserved)
  - Optical ether: D
