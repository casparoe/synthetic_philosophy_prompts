  2. Practical - can volunteers apply any new policy at midnight?
  3. Organizational - what defines their center's purpose?

  The user specifically asked not to default to compassion alone, which tells me they need operational realism. The "mission creep" worry is central - they're a small center, not a nature hospital. Also that hawk-feeding contradiction is uncomfortable but important; it shows they already participate in natural suffering.

  Hmm... the memo must balance ethics with executable criteria. "Suffering matters" is too vague for intake decisions. I should propose middle path: keep human-cause focus but add exceptions where intervention doesn't expand scope. Like when injuries are treatable regardless of cause, or when human activity indirectly enabled harm (e.g. coyotes thriving in human-altered landscapes). 

  Key practical concerns:
