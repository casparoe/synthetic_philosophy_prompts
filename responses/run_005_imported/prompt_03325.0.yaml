  First, I need to assess the "two tracks" argument. The user points to clear evidence: Smith's rent-seeking critique of monopolies harming the nation versus his moral outrage at European atrocities. The economic arguments dominate the chapter, but those ethical outbursts are indeed present, especially regarding indigenous suffering. The user's observation that Smith's solutions address only the economic issues seems spot-on—ending monopolies won't undo past injustices. This tension feels real, not manufactured.

