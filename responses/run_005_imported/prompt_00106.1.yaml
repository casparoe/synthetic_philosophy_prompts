answer: |-
  ## Evidential Cooperation in Large Worlds: A Precarious Foundation for Altruism?

  The prospect of deriving robust reasons for cooperation and altruistic compromise solely from the logical structure of decision problems in a vast universe is profoundly alluring. Evidential Cooperation in Large Worlds (ECL), championed by thinkers like Caspar Oesterheld, promises precisely this. It argues that Evidential Decision Theory (EDT), when applied in sufficiently large or infinite worlds containing many causally isolated agents facing structurally similar problems, generates compelling *evidential* reasons for cooperation across diverse value systems. However, this promise rests on foundations vulnerable to potent objections concerning similarity, probability, and the very nature of practical reason. While ECL illuminates fascinating possibilities for acausal coordination, I argue it fails to establish *general, action-guiding practical reasons* as initially claimed, surviving only as a potentially relevant heuristic within highly constrained scenarios or under specific, contestable metaphysical assumptions.

  **The Case for ECL: Altruism from Updateless Correlation**

  ECL's core mechanism leverages EDT's sensitivity to evidence about *what kind of agent one is*. EDT evaluates an action based on the evidence it provides about the state of the world, including the actions of other agents, and then computes expected utility conditional on performing that action. In a large world:

  1.  **Cliquish Structure:** Imagine countless agents facing isomorphic decision problems (e.g., variations of a Prisoner's Dilemma, or choices about resource allocation affecting their own and others' values). These agents form a "reference class" of "similar" decision-makers.
  2.  **Evidential Link:** When an agent \(A\) considers cooperating (C), EDT notes that *if* \(A\) chooses C, this is evidence that \(A\) is the *type* of agent who chooses C. Crucially, in a large world containing many agents sufficiently similar to \(A\), \(A\)'s choice also provides evidence about the choices of those *other* similar agents. Choosing C makes it more probable (evidentially) that other agents in the reference class also choose C.
  3.  **The Cooperation Payoff:** If the decision problem is structured such that mutual cooperation yields a better outcome for each agent than mutual defection (D) – a common feature in dilemmas – then the *evidential expected utility* of C can exceed that of D. Choosing C provides strong evidence that others like you are also cooperating, leading to the favorable mutual cooperation outcome. Choosing D provides evidence that others are defecting, leading to mutual defection. Thus, EDT prescribes cooperation.
  4.  **Updatelessness & Value Pluralism:** Proponents emphasize an "updateless" perspective. Agents should reason *before* knowing their precise location/identity within the large world, considering the global strategy profile. This perspective naturally extends to value pluralism. Agents \(A\) (valuing \(V_A\)) and \(B\) (valuing \(V_B\)) can recognize their structural similarity. If \(A\) compromises slightly on \(V_A\) to help realize \(V_B\) for \(B\), and \(B\) reciprocates, both can end up better off *according to their own values* than if they each purely maximized selfishly and ended up with mutual defection. The evidence \(A\) gets from their own compromise supports the conclusion that \(B\) is likely compromising too, making the cooperative outcome probable and beneficial for both.

  In essence, ECL argues that in large worlds, the act of cooperating (or compromising) becomes a *signal* that one belongs to a cooperative clique, and by Bayesian updating, this signal makes the existence and actions of that clique more probable. This evidential link, proponents claim, provides genuine, non-causal, practical reasons for cooperative and altruistic behavior across value systems, grounded purely in rational self-interest under EDT.

  **Subjecting ECL to Scrutiny: The Cracks in the Foundation**

  While elegant, ECL faces formidable challenges that undermine its claim to provide robust, general practical reasons:

  1.  **The Intractability of "Similarity" (The Reference Class Problem):**
      *   **The Core Ambiguity:** ECL hinges entirely on defining which other agents are "sufficiently similar" to be evidentially linked. What constitutes the relevant reference class? Is it agents facing the *exact* same payoff matrix? Agents implemented on similar substrates? Agents who *would* reason the same way given the same information? Agents who share the same *definition* of similarity?
      *   **Begging the Question:** Defining similarity often seems to presuppose the desired cooperative conclusion. If similarity is defined rigidly (e.g., "agents facing *this specific problem description*"), it guarantees the evidential link but becomes analytically true and devoid of independent justification. Why should an agent believe they are part of *this* specific reference class rather than a broader one containing many defectors?
      *   **Anthropics and Indexical Uncertainty:** In large or infinite worlds, the problem of self-locating belief ("where am I in this vast multiverse?") becomes paramount. How does an agent assign probabilities over which reference class they belong to? Different solutions to anthropic reasoning (Self-Indication Assumption, Self-Sampling Assumption) yield vastly different probability assignments and thus different EDT recommendations. ECL lacks a non-arbitrary resolution to this indexical uncertainty.
      *   **Verdict:** Without a principled, non-question-begging, and universally applicable definition of "similarity" that grounds the necessary evidential correlations, ECL's core mechanism remains fundamentally unstable. The reference class is too easily gerrymandered or rendered indeterminate, making the purported evidential link illusory or undefined in many realistic scenarios.

  2.  **Probability in the Vast and Infinite (The Problem of Priors and Measure):**
      *   **The Infinite Problem:** In infinite worlds, standard probability theory breaks down. How do we assign probabilities over an infinite set of agents? Using cardinality (e.g., proportion of cooperators) often fails in infinite sets (Hilbert's Hotel paradox). Measure-based approaches (e.g., using a natural density or hyperreal probabilities) are mathematically complex, non-unique, and lack clear epistemic justification.
      *   **Prior Sensitivity:** Even in large finite worlds, the EDT calculation is exquisitely sensitive to the prior probability distribution over the space of possible agents and strategies. What justifies a prior that places non-negligible weight on the existence of large cooperative cliques similar to oneself? A uniform prior over all logically possible agents might assign vanishingly small probability to any agent *exactly* like you, swamping the evidential effect. Priors based on simplicity or algorithmic probability are controversial and computationally intractable.
      *   **The Threat of Domination:** If there exists *any* infinite set of agents who *never* cooperate (e.g., "zombie defectors" hardwired to defect), depending on the chosen measure, the probability that *you* are a cooperator conditional on existing might be zero or infinitesimal, rendering the EDT calculation of cooperation's expected utility undefined or meaningless.
      *   **Verdict:** ECL requires well-defined, non-arbitrary probability distributions over agents in vast/infinite spaces. Current tools for handling such distributions are either inadequate (leading to paradoxes) or rely on assumptions that are themselves deeply problematic and lack consensus. This makes the evidential calculations underpinning ECL practically inapplicable and theoretically shaky.

  3.  **The Causalist's Indifference (The CDT Challenge):**
      *   **The Fundamental Divide:** Causal Decision Theory (CDT) evaluates actions based solely on their *causal consequences*. An evidential correlation, no matter how strong, provides no *causal* reason to act for a CDT agent. In a causally isolated Prisoner's Dilemma, CDT *always* prescribes defection: your choice *causes* only your own payoff; the correlation between your choice and your counterpart's is merely diagnostic, not causal.
      *   **Why Should a CDT Agent Care?** ECL proponents argue EDT's recommendations are rational *for EDT agents*. But a committed CDT agent has no internal reason to adopt the evidential perspective. They see ECL as pointing to a spurious correlation. Choosing C might *indicate* mutual cooperation is likely, but it doesn't *cause* it. From a CDT view, choosing C sacrifices potential gains from unilateral defection based on an irrelevant correlation. ECL provides no bridge to convince a CDT agent within their own framework.
      *   **The Illusion of Influence?** Does ECL smuggle in a form of acausal causation? Proponents deny this, insisting it's purely evidential. However, the *practical force* of ECL's recommendation *feels* like influencing others acausally. For the CDT agent, this is precisely the conflation they reject: evidence is not influence.
      *   **Verdict:** ECL fails to engage the core commitment of CDT. It offers reasons that are compelling only from within the EDT framework itself. For the vast majority of decision theorists and practical reasoners who find CDT's focus on causal efficacy more intuitive and robust, ECL's evidential correlations simply do not translate into *practical reasons for action*. It remains an intriguing curiosity, not a persuasive alternative.

  **Verdict: ECL as a Restricted Heuristic, Not a General Foundation**

  ECL does not survive the strongest objections unscathed as a source of general, robust, action-guiding practical reasons for cooperation and altruistic compromise across value systems.

  *   **Similarity:** The reference class problem is fatal to its generality. Without a non-arbitrary, non-question-begging definition of similarity that reliably grounds the required evidential correlations across diverse scenarios, the mechanism simply doesn't engage.
  *   **Probability:** The difficulties in defining coherent and justifiable priors and measures over agents in large/infinite worlds render the core calculations speculative at best and incoherent at worst, especially in the infinite case.
  *   **Causalist Indifference:** ECL remains fundamentally unpersuasive to CDT agents, who constitute a significant portion of its intended audience. It fails to address the core causalist intuition that practical reasons must track causal efficacy.

  **However, ECL is not devoid of insight.** Its potential validity is strongest in highly specific, constrained scenarios:

  1.  **Highly Symmetric, Finite Acausal Trade:** In carefully defined, finite scenarios involving agents who *know* they are in a symmetric acausal interaction (like the classic "Absent-Minded Driver" or explicitly modeled acausal trade between two identical civilizations), the evidential reasoning can be compelling *for agents already committed to EDT or an updateless perspective*. The reference class is clearly defined (the other party), and probability distributions are manageable.
  2.  **Heuristic for Updateless Reasoning:** As a *heuristic* for considering the global consequences of decision rules ("What if everyone in my situation did this?"), ECL has value, promoting cooperative norms. But this heuristic appeal is distinct from claiming it provides fundamental, inescapable practical reasons derived purely from large-world evidential correlations.
  3.  **Motivation for Hybrid Theories:** ECL highlights limitations of pure CDT in acausal settings, motivating the development of hybrid decision theories (e.g., Functional Decision Theory - FDT) that explicitly aim to optimize outcomes across similar decision nodes in a causal graph, potentially capturing some ECL insights within a more causalist-compatible framework. However, FDT's foundations and relationship to CDT/EDT are still debated.

  **Conclusion**

  Evidential Cooperation in Large Worlds is a fascinating and ambitious attempt to derive profound ethical implications—altruism and cooperation across value systems—from the cold logic of probability and decision theory in vast realities. Its core intuition, that my choices reveal what choices beings like me make, is powerful. However, its foundations crumble under scrutiny. The inability to objectively define "similarity," the profound challenges of probability in large/infinite worlds, and its irrelevance to causal decision theorists prevent ECL from delivering on its promise of providing *general, robust, fundamental practical reasons*. It survives not as a revolutionary new source of normativity, but as a specialized argument potentially relevant to specific, highly structured acausal interactions among agents who already embrace an evidential or updateless perspective, or as a useful heuristic. For ECL to be more than an intriguing intellectual artifact, it requires solutions to the deep problems of reference classes, infinite ethics, and the causal/evidential divide that remain stubbornly unresolved. Until then, its grand claims must be significantly tempered.
