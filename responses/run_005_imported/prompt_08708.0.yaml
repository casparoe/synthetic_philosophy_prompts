  Random tangent, but I could use your help thinking through something for a novel I'm plotting. There's a secondary character, a retired comp lit professor, who's spent basically her whole life obsessed with Borges — there's a scene where she's got her old paperback of "A New Refutation of Time" completely full of marginalia — and last week I fell down a rabbit hole reading about time crystals, which turn out to be a real thing physicists actually built in a lab, not just sci-fi. Wilczek proposed the idea back in 2012, and then a group at Maryland and a group at Harvard each independently made one around 2016-17. The gist, as I understand it (shakily), is that the lowest-energy state of the thing just keeps oscillating in a fixed rhythm forever, spontaneously breaking "time-translation symmetry" the same way an ordinary crystal breaks symmetry in space — though it still needs a periodic pulse from outside to stay out of equilibrium, so it's not quite the perpetual-motion, needs-no-winding clock some of the pop-sci writeups made it sound like, but still close enough to mess with your head a little.

  I want my professor to bring this up with a former student as a kind of provocation, and I need the scene to feel like she's actually thought it through rather than just going "ooh, cycles, Borges would've loved this." So: if Borges had somehow lived long enough to hear about time crystals, what do you think he'd have actually made of them, argument by argument? I'm especially interested in how it lines up against two things he wrote that seem to pull in opposite directions — the New Refutation, where he leans on Berkeley and Hume to suggest that succession, and therefore time, might not be real, but then backs off at the end and admits he's still stuck being Borges in a world that is, unfortunately, real; versus that other, weirder essay of his where he goes after Nietzsche's eternal return using Cantor's set theory, and ends up wondering out loud whether two supposedly identical recurring states would even count as two occurrences or just collapse into one. Would a time crystal's endless little loop read to him as some kind of vindication of cyclical repetition, does his own objection to Nietzsche cut against it just as well, or is this whole thing just a cute physical curiosity that's orthogonal to what he actually cared about? Go deep on this one, please — shes supposed to be genuinely sharp about it, not just name-dropping him.
