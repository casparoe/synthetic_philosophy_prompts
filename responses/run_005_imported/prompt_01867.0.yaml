answer: |-
  Okay, atmospheric scientist to atmospheric scientist (honorary, on my end!), let's get blunt. Your instincts are **spot-on**, and you've hit a genuine, live nerve in accuracy-first epistemology (AFE). This isn't a basic math error; you've zeroed in on a fundamental philosophical tension. Here's the breakdown:

  1.  **The Technical Setup is Solid:** You correctly understand Joyce's core argument (the "domination theorem"). If your credences violate probability axioms, there exists a *probabilistically coherent* rival credence function that is *strictly more accurate* than yours according to *any* legitimate scoring rule, in *every* possible world. The proof relies crucially on the scoring rule being **strictly proper**.
  2.  **"Legitimacy" ≈ Strict Propriety:** You're right that "legitimacy" in this context is *defined* by the properties needed to make the domination theorem work. The core properties are:
      *   **Truth-Directedness:** If `c` is closer to truth-value `v` than `c'` is, then `c` gets a better score than `c'` for that proposition at `v`.
      *   **Propriety (Specifically Strict Propriety):** For any coherent credence function `p`, the *expected inaccuracy* of reporting `p` (according to `p` itself) is strictly less than the expected inaccuracy of reporting any *different* credence function `c` (again, expectation taken w.r.t. `p`). This is the "honesty incentive" condition you know well.
      *   **Continuity & Additivity/Extensionality:** Often assumed for technical reasons.
  3.  **Your Objection Lands Hard:** This is the crux:
      *   **In Meteorology:** Propriety (strict propriety) has a **compelling, independent, behavioral justification.** It's a *solution concept* for a principal-agent problem: How do you design a payment scheme (scoring rule) so that the agent (forecaster) maximizes their *expected* payoff only by revealing their true belief (`p`)? It's grounded in instrumental rationality and incentives. The score "earns its keep" *because* it demonstrably elicits honesty under uncertainty. Its connection to "accuracy" is mediated through this incentive structure.
      *   **In AFE:** Propriety is presented as *constitutive* of what it means for a scoring rule to measure "epistemic accuracy" or "closeness to truth" *directly*. The argument often runs: A legitimate measure of inaccuracy *must* be strictly proper because if it weren't, a believer could *rationally expect* to do better by reporting something other than their true belief, which would be perverse for an accuracy measure. Avoiding this "perversity" is the independent justification.
  4.  **The Circularity/Justification Worry is Real and Known:** Your "smell test" is valid. Critics (and even some proponents grappling with it) argue:
      *   **Is "Avoiding Perversity" Enough?** The AFE justification for propriety often boils down to: "A measure that *doesn't* incentivize honesty can't be a good measure of accuracy." But this feels perilously close to *defining* "good measure of accuracy" as "one that incentivizes honesty." Where is the *independent* grip on "accuracy" itself? Why is "accuracy" the supreme epistemic good such that *only* measures promoting honesty in its pursuit are legitimate?
      *   **The Bootstrapping Problem:** The domination theorem *uses* strict propriety to *derive* probabilism as the uniquely accuracy-dominated-avoiding state. But strict propriety itself is justified *by* the need to avoid a different kind of perversity (dishonesty being rationally preferable) *within a framework that already assumes accuracy is the goal and probabilism is likely desirable*. It risks being a beautifully closed, self-referential system. As you put it, it can feel like legitimacy is picked to make the theorem true.
      *   **Alternative "Natural" Measures?** While strictly proper rules form a broad class (Brier, Log, Spherical), there *are* intuitive-seeming measures that violate strict propriety (e.g., absolute error |c - v|). AFE dismisses them as illegitimate *because* they aren't strictly proper and thus don't support the domination theorem. The justification for this dismissal relies heavily on the propriety = anti-perversity = legitimacy chain.
  5.  **Proponents' Defense (and its Limits):** AFE proponents (like Pettigrew) argue:
      *   **Avoiding Dominance is Foundational:** The core normative principle isn't *first* propriety, but **Avoidance of Strict Dominance**. If option A is *guaranteed* worse than option B no matter what happens, choosing A is irrational. The domination theorem shows probabilism is necessary to avoid this. Propriety is then justified *because* it's necessary (along with truth-directedness) to *make* the accuracy measure respect this dominance principle. I.e., if the measure *weren't* strictly proper, the domination theorem *wouldn't hold*, and violating probabilism *wouldn't* guarantee dominance, which would undermine the core argument.
      *   **Propriety as a Consequence, Not the Start:** They claim propriety is *derived* from the more fundamental commitment to accuracy as the goal *plus* the requirement that the accuracy measure be "sensible" enough to make accuracy-domination a serious failing. Avoiding the "perversity" of honesty not being optimal *is* presented as the independent reason why "sensible" requires propriety.
  6.  **Is it "Circularity Wearing a Nicer Outfit"?** That's the $64,000 question. Your meteorology background gives you a unique perspective:
      *   **Similar Math, Different Foundation:** In forecasting, propriety is justified **pragmatically/externally** by its role in eliciting truthful reports within a principal-agent framework. The "accuracy" measured is defined relative to the forecast *system's purpose*.
      *   **AFE's Challenge:** In pure epistemology, there's no external principal. The justification for propriety (and thus the domination theorem) has to be **internal** to the concept of epistemic rationality itself. AFE grounds it in the intuitive irrationality of dominated options and the intuitive perversity of measures where dishonesty pays (in expected accuracy). Whether this is a *sufficiently* independent justification, or whether it's ultimately circular ("we define good accuracy measures as those that make our desired rationality principles hold"), is the core philosophical debate you've stumbled into.
  7.  **Known Soft Spot? Absolutely.** This is one of the most discussed critiques of AFE:
      *   **Critics:** Philosophers like Dan Greco, Miriam Schoenfield, and others have pressed exactly this point. They argue AFE either tacitly assumes the normative weight it tries to derive (probabilism/accuracy-first) in its definition of "legitimate scoring rule," or that the justification for propriety rests on contentious assumptions about epistemic value that aren't adequately defended independently of the desired conclusion.
      *   **Proponents' Refinements:** Richard Pettigrew, Jason Konek, and others have worked to provide deeper justifications for the conditions (like "Admissibility" or "Symmetry" arguments), but the debate continues. The charge of "begging the question" or relying on a "too-thin" concept of accuracy is a constant companion.

  **Verdict:**

  *   **Your Math/Understanding is Correct:** You've nailed the technical setup and the role of propriety in both fields.
  *   **Your Philosophical Objection Lands Forcefully:** The worry about the justification for "legitimacy"/strict propriety being circular or question-begging in AFE, *especially when contrasted with its pragmatic justification in meteorology*, is **valid, significant, and a recognized point of contention.** You are **not** conflating propriety with something fuzzier; you're correctly identifying that its *epistemic normative justification* within AFE is more debatable than its *pragmatic justification* in forecasting.
  *   **You've Hit a Known Soft Spot:** This is precisely one of the major frontiers in the accuracy-first literature. Your background gives you a powerful lens to see this tension clearly.

  **Recommendation:** Lean into this! Raise it in your library group. Frame it as: "In my old job, propriety was justified *because* it made forecasters tell the truth. In AFE, propriety is justified *because* it makes probabilism the uniquely rational option. But is there an independent story about *why* propriety tracks 'accuracy' in the epistemic sense, beyond making the desired theorem work?" Cite Pettigrew's defenses (Chapters 3 & 4 of *Accuracy and the Laws of Credence* grapple with justifying the conditions) and acknowledge the critiques (look for papers by Greco or Schoenfield on AFE). You're bringing a valuable, grounded perspective to the philosophical debate. Don't let them off the hook with just "propriety avoids perversity" – push on *why* that avoidance is the *sine qua non* of epistemic legitimacy. The conversation will be richer for it.
