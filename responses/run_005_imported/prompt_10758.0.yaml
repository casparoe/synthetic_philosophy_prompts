  I'm on the parent-teacher policy committee at my kids' school, and we're revising the discipline code. Theres currently a demerit system (detention, lines) for misbehavior, and a couple of members want to scrap it entirely for a positive 'rewards ladder' -- points, prizes, extra recess -- since everyone keeps citing Locke as the guy who was against caning kids and so would obviously back a rewards-only approach. I actually went and read the relevant bits of Some Thoughts Concerning Education though, and its messier than that: Locke seems just as suspicious of bribing kids with treats and prizes as he is of beating them, and thinks the only instruments that really build character are esteem and disgrace, not appeals to pleasure or pain either way. Can you draft the memo I'm supposed to circulate before next week's vote? It should actually recommend what to do with the demerit system and the proposed rewards ladder, engage seriously with Locke's real argument for why rewards can corrupt kids just as much as punishments do, and give the rewards side's best argument a fair hearing before you rule against them (if you do).
