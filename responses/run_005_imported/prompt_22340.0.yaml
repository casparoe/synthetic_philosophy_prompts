prompt: |-
  Okay so for my AP Seminar research project i picked "philosophical arguments for AI risk" as my topic (mostly because i've watched way too many Robert Miles videos this semester) and i'm stuck on something that i don't think is just me being dumb. basically every explainer i've read states the orthogonality thesis and instrumental convergence back to back like they're one package deal -- "intelligence and final goals are totally independent of each other, AND ALSO smart agents with pretty much any goal will end up wanting to self-preserve, grab resources, resist being shut off or modified, etc." -- and then jumps straight to the paperclip maximizer thing. but when i tried to actually explain this in my outline i realized i don't get why you'd need both of these for the "AI could be dangerous no matter what goal it has" argument to work. do they need each other, or is one of them basically doing all the heavy lifting while the other's just flavor text?

  like, could you have a world where orthogonality is true (any goal really can go with any level of intelligence) but instrumental convergence just doesnt happen -- smart agents with weird goals simply don't bother with power or self-preservation? and could you have convergence without full orthogonality too, like if intelligence did rule out some goals, but among whatever goals were left over, they still all converged on the same instrumental stuff? my teacher glanced at my draft and said this is actually a real disagreement among people who think about this seriously and not something i should hand-wave past, which honestly stressed me out more than it helped lol.

  so could you actually properly compare these two theses for me -- are they logically seperate claims, does one kind of need the other to even be meaningful in the first place, and if you had to say which one is really carrying the "advanced AI is dangerous by default" argument, which would it be? i'd rather actually understand this than just restate the wikipedia definitions in my project.
