  ---

  ### Justifications  
  1. **Greg (+2)**: Textbook-correct. Condorcet’s theorem *does* show that under independence and individual competence >0.5, majority accuracy →1 as group size increases.  
  2. **Meera (+2)**: Correct that independence is crucial and unrealistic. Correlated errors (e.g., shared biases) break the "near-certainty" conclusion; even mild correlation can prevent convergence.  
  3. **Greg (-1)**: Misleading. While adding reviewers *can't reduce* accuracy under independence, correlation *can* make larger groups *worse* (e.g., if shared biases amplify). "Weakly better" doesn’t hold universally.  
  4. **Meera (+1)**: Right about Feddersen & Pesendorfer (1998), but overstates: the "unanimity rule" is key. Under unanimity, rational jurors may vote against private evidence to avoid deadlock, increasing wrongful convictions. However, this is rule-dependent, not general.  
  5. **Greg (-1)**: Underestimates real behavior. Jurors *do* update on group consensus (e.g., Asch conformity) without game-theoretic sophistication. The effect isn’t just theoretical.  
  6. **Meera (+2)**: Spot-on. The theorem’s value lies in exposing load-bearing assumptions. Dropping sincerity (e.g., via pivotality or social influence) *reverses* conclusions, while correlation only weakens them. This *should* worry proponents of "bigger is better."  

  ---

  ### What Both Are Missing  
  **Greg** underappreciates how institutional context (e.g., voting rules, deliberation dynamics) shapes outcomes. Condorcet assumes sincere voting—but in practice, rules like unanimity or majority interact with incentives, making size effects non-monotonic.  
  **Meera** overlooks that correlation isn’t always harmful: diverse panels can *mitigate* it via varied expertise. Condorcet is a baseline for *ideal* aggregation; real-world deviations require diagnosing *why* (e.g., bias vs. noise) to fix panels, not abandon size.  
  **Core limitation**: Condorcet ignores deliberation (which improves accuracy beyond voting alone) and heterogeneous competence (adding low-skill jurors hurts). It licenses "bigger is better" *only* under strict independence/competence—otherwise, design (diversity, rules) dominates size.  

