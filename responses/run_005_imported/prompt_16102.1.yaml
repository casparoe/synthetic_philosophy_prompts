  I need to argue that common knowledge of rationality (CKR) isn't sufficient to enforce immediate defection. The key is that CKR doesn't dictate beliefs off-equilibrium. If Player 2 sees Player 1 pass, they might doubt Player 1's rationality, leading them to pass too. This challenges the uniqueness of the backward-induction outcome.

