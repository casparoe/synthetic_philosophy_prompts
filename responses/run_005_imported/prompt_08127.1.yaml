answer: |-
  You've pinpointed a core tension in Bentham's utilitarianism, and your friend's challenge is historically significant (raised by contemporaries like James Mill). Bentham's argument in this passage is subtle but powerful, aiming to *exclude antipathy itself* as a *sufficient independent justification* for legal punishment. He doesn't necessarily exclude the *pain caused by antipathy* from the calculus altogether, but he radically recontextualizes it and argues against *adding legal punishment* on top of it. Here's a breakdown:

  **Reconstructing Bentham's Argument:**

  1.  **The Slippery Slope/Consistency Argument (The Core Move):**
      *   Bentham argues that if we accept *mere antipathy/disgust* as a sufficient reason for legal punishment, we open the floodgates to justifying the most horrific persecutions in history.
      *   **The Analogy:** He explicitly compares antipathy towards "paederasts" to the antipathy Spaniards felt towards Moors or Portuguese towards Jews – antipathy that fueled the Inquisition and executions for heresy.
      *   **The Challenge:** He asks how a Protestant (presumably opposed to Catholic persecution for heresy) could consistently condemn burning heretics while advocating burning "paederasts" based *solely* on the same kind of intense popular disgust. The *basis* for punishment (antipathy) is identical.
      *   **The Point:** Accepting antipathy as a *ground* for punishment is fundamentally irrational and leads to intolerable, inconsistent, and tyrannical outcomes. It legitimizes persecution based purely on majority sentiment, regardless of any *other* harm caused.

  2.  **The "Priced In" Argument (The Utilitarian Reinforcement):**
      *   Bentham acknowledges the *reality* of the pain caused by societal antipathy. He doesn't deny its existence or intensity.
      *   **Key Insight:** He points out that this antipathy *already inflicts its own punishment*: "a very galling punishment... without having recourse to the political magistrate." This punishment includes social ostracism, shame, loss of reputation, emotional distress, and potentially economic hardship.
      *   **The Redundancy/Excess Point:** Therefore, adding *formal legal punishment* (fines, imprisonment, execution) on top of this existing, severe social punishment is *redundant*. It inflicts *additional* pain without addressing any *new* or *distinct* harm caused by the act itself. The suffering from antipathy is already part of the negative consequences borne by the individuals involved.
      *   **The Aggravation Point:** Legal punishment doesn't just add pain; it often *intensifies* the existing social punishment. A convicted person faces even greater stigma and ostracism. Bentham implies that formal punishment amplifies the very suffering caused by antipathy that supposedly justified the punishment in the first place.

  **Addressing Your Specific Questions:**

  1.  **Exclude Antipathy or "Priced In"?** Bentham primarily uses the **"priced in"** argument. He *acknowledges* the pain of antipathy as real suffering. His key move is to argue that *because* this suffering already exists as a heavy informal social punishment, adding *legal* punishment is unjustified, redundant, and counterproductive (as it increases the aggregate pain). The Slippery Slope argument serves to show that accepting antipathy *as a ground* is fundamentally dangerous and illiberal.

  2.  **Does it Block Your Friend's Worry?**
      *   **Partially, but not entirely.** It significantly *relocates and reframes* the problem, making the friend's position harder to maintain consistently.
      *   **How it Blocks/Relocates:**
          *   **Against Grounds:** It powerfully argues that antipathy *alone* cannot be a *justification* for law. Law must be based on preventing *specific harms* (like theft, violence, fraud), not merely codifying popular disgust. The Slippery Slope makes this principle clear.
          *   **Against Adding Pain:** It argues that adding legal pain *on top of* the existing social pain caused by antipathy is inefficient and cruel. The utilitarian calculus for *legal intervention* must focus on whether it reduces *net* pain. Adding punishment here *increases* net pain without remedying the underlying antipathy or preventing a distinct harm.
          *   **Aggregate Disutility Relocated:** The pain of antipathy *is* counted, but its weight is borne *by the targets of the antipathy* through social punishment. The friend wants to count the *spectators'* pain/disgust *again* as a reason to inflict *additional* legal pain. Bentham argues this double-counting is illegitimate and leads to excessive suffering. The aggregate disutility of the *act itself* (including the social pain it triggers for the actor) is already present without legal punishment.
      *   **Where the Worry Persists (The Unresolved Tension):**
          *   **Intensity & Scale:** What if the *spectators'* pain/disgust is so incredibly intense and widespread that, even acknowledging the social punishment already inflicted, the *aggregate* pain (spectators' disgust + targets' suffering) is deemed by the utilitarian legislator to be so vast that suppressing the act *still* reduces net pain? Bentham's arguments don't *formally* exclude this possibility within pure hedonistic aggregation.
          *   **The Source of Pain:** Bentham hints at a deeper critique – that the pain of antipathy might be based on prejudice, superstition, or "polluted taste" (as he calls it). A *sophisticated* utilitarian might argue such "irrational" pains should be discounted or given less weight than pains stemming from tangible harms (like physical injury or theft). Bentham leans here but doesn't fully develop this argument in this passage. His focus is on the danger and redundancy of punishing *for* antipathy.

  **Conclusion:**

  Bentham's argument is primarily **against using antipathy as a *sufficient ground* for legal punishment** and **against the *redundancy and cruelty* of adding legal pain on top of the severe social pain antipathy already inflicts.** He relocates the pain of antipathy: it's real suffering, but its primary consequence is the *informal social punishment* borne by the disliked minority. Adding legal punishment on this basis is unjustified, inconsistent with liberal principles (as shown by the heresy analogy), and increases net suffering.

  **Does it fully block your friend?** It makes the friend's position much harder to defend consistently (as it justifies historical persecution) and shows that legal punishment based on antipathy is usually a cruel overreaction. However, a determined pure hedonist aggregator *could* theoretically argue that in extreme cases of near-universal, intense disgust, the aggregate pain *might* still justify suppression, even acknowledging the social punishment. Bentham would likely counter this with his Slippery Slope argument (where does it end?) and a deeper, perhaps implicit, belief that pains rooted in prejudice are less legitimate grounds for state coercion than pains from tangible harm. His argument powerfully limits the *practical justification* for such laws but doesn't entirely resolve the *theoretical aggregation problem* within the simplest version of his utilitarianism. His genius lies in showing why giving weight to antipathy *as a ground for law* is a recipe for tyranny and unnecessary suffering.
