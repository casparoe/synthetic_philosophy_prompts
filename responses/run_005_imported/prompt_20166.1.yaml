prompt: |-
  So I've been kind of obsessed with John Rawls the last couple of months, started with the veil of ignorance stuff everyone talks about but then fell down a rabbit hole into his personal life, and it turns out this guy who's basically famous for saying religion shouldn't get special treatment in politics almost became a minister himself. He wrote his entire senior thesis at Princeton back in the 40s on sin and faith, super devout kid, and then the war apparently wrecked it - he was infantry in the Pacific - and theres this short piece of his called "On My Religion" that only got published after he died, where he talks about watching a friend die for no reason, finding out about the Holocaust, and (if I'm remembering this right) some army chaplain giving a sermon basically blessing the killing of Japanese soldiers, which disgusted him on a religious level and not just a moral one. Nobody mentions any of this when they're explaining "justice as fairness" to you, and it kind of reframed the whole theory for me once I found out.

  So I tried writing up a little paragraph connecting the dots and I'm genuinely not sure it holds together:

  "Rawls's mature idea of public reason, and especially the 'proviso' that lets you bring religious reasons into politics only if you can eventually back them up with reasons non religious people could accept too, isn't just a neutral technical fix for the fact that people disagree. It's Rawls doing institutionally what happened to him personally - he never says religion is false, he just refuses to let anyone's comprehensive doctrine get the last word over people who don't already buy into it, which is basically the move he made in his own head once he watched faith get used to bless a war and go silent on the Holocaust. Same with the 'burdens of judgment' thing, the idea that reasonable people looking at the exact same evidence can land on totally different ultimate views about God and meaning - that's not just some abstract epistemology point, that's a guy generalizing his own experience of watching religious certainty fail him under pressure into a whole theory of why the state has to stay neutral between comprehensive doctrines."

  I might just be projecting a tidy psychological story onto a technical bit of political philosophy that doesn't need one, so could you give me some honest comments - mainly (1) whether this connection actually survives contact with what Rawls really argued or if I'm stretching it way past what the text supports, (2) whether I'm garbling the proviso or burdens of judgment stuff itself, and (3) whether this is a genuinely interesting way into his work or just a "well obviously biography shapes philosophy" observation that isn't saying much. Don't go easy on me, I'd rather find out the idea doesn't really work than keep repeating it at dinner parties.
