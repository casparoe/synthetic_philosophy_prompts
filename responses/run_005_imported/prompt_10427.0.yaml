  First, I need to recall the core positions. Rawls argues for maximin: in the veil of ignorance, people would prioritize the worst-off position because they'd avoid catastrophic outcomes. That leads to the difference principle, ensuring inequalities benefit the least advantaged. Harsanyi, on the other hand, believes rational actors would use expected utility, calculating average outcomes with equal probability, leading to utilitarianism.

