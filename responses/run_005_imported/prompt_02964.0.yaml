answer: |-
  Here’s a dialogue between **Sophia (Supervaluationist)** and **Riley (Relativist)** debating Sam’s assertion. They engage directly with the retrospective-assessment problem, with Sophia offering a substantive defense of supervaluationism:

  ---

  **Setting:** A philosophy department coffee room, post-colloquium.  
  **Trigger:** Riley overhears Sophia defending supervaluationism to a grad student.

  ---

  **Riley:** *(leaning over)* Sophia, I heard you defending supervaluationism for future contingents. But take Sam’s case: Monday, she asserts "There will be a sea battle Friday." The battle *happens*. Yet supervaluationism still can’t vindicate her as having *said something true* on Monday. That’s a fatal flaw.

  **Sophia:** Hold on, Riley. On Monday, when Sam speaks, the future *is* genuinely open. There are histories branching from that moment: one with a battle, one without. Since "There will be a sea battle" is true on some histories but false on others, it’s *indeterminate* at tₘₒₙ. That’s not just epistemic—it’s metaphysical. Sam’s assertion isn’t true *or* false at utterance.

  **Riley:** Exactly! But *after* Friday, when we’re assessing retrospectively, we all agree the battle occurred. Supervaluationism still forces you to say: "At the time Sam spoke, her statement wasn’t true. It only *became* true later." That’s absurd! Sam *predicted the actual future*. She deserves credit for being *right*. Your theory can’t give it to her without equivocating on "truth."

  **Sophia:** I’m not equivocating. Truth is timeless, but *evaluation* is temporal. On Monday, relative to the context of utterance, Sam’s statement lacks a truth value because the actual history isn’t settled. But *after* Friday, we evaluate propositions against the *actual, complete history*. Relative to *that* context, her statement *is* straightforwardly true. We can say: "What Sam asserted *was* true" because the proposition’s truth is grounded in the actualized history.

  **Riley:** *(shaking head)* But "what Sam asserted" is a token utterance at tₘₒₙ. When we assess *that very utterance* retrospectively, supervaluationism forces us to anchor its truth value to *its context of utterance*—Monday’s open future. So we’re stuck saying: "That utterance, made when it was, was indeterminate." You’re conflating the *proposition’s* truth (timeless) with the *utterance’s* truth (context-bound).

  **Sophia:** Not conflating—distinguishing. The *proposition* <There is a sea battle Friday> is true simpliciter relative to the actual world. Sam’s *utterance* on Monday *expresses* that proposition. On Monday, we couldn’t know its truth value. After Friday, we *can* see it expresses a true proposition. We vindicate Sam by noting she expressed a proposition that *turned out* to be true. That’s not a cop-out; it’s respecting the metaphysics of openness.

  **Riley:** But that’s the rub! "Turned out to be true" isn’t "was true when uttered." MacFarlane’s relativism *does* vindicate Sam: when assessed *from Friday* (or after), her Monday utterance is true *relative to that later context*. Truth isn’t just about the utterance context; it’s *assessment-sensitive*. That’s why we can honestly say *at assessment-time*: "Sam spoke truly on Monday."

  **Sophia:** And that’s where I think relativism just *relocates* the problem. You say an utterance’s truth depends on the assessor’s context. But on Monday, if Sam’s friend assesses her utterance, they *must* say it’s indeterminate (since no future facts exist then). On Friday, they say it’s true. But now you’ve got *contradictory truth assessments* for the same utterance. Supervaluationism avoids that by keeping truth anchored to the *objective history*, not the assessor’s temporal vantage point.

  **Riley:** Contradictory assessments don’t conflict if they’re relative to different contexts! That’s the point. On Monday, assessing relative to that moment’s unsettled future, it’s indeterminate. On Friday, assessing relative to the settled past, it’s true. Both are correct *relative to their context of assessment*. Sam gets vindicated *when it matters*—retrospectively—without pretending Monday’s context was other than open.

  **Sophia:** But now *you’re* undermining objectivity. If no assessment is "absolutely correct," how do we explain that Sam *really* got it right? The battle *was* going to happen—it just wasn’t *settled* on Monday. Supervaluationism captures that by separating *truth* from *determinacy*. The proposition was *always* true relative to the actual history; we just couldn’t *know* or *ground* that truth on Monday. After Friday, we can. Sam’s correctness isn’t retrospective invention—it’s discovery.

  **Riley:** But "always true" smuggles in determinism! If it was "always true" relative to actual history, then on Monday, the battle was *already* inevitable. That negates genuine openness. Relativism *preserves* openness: on Monday, no fact *makes* the utterance true or false. Only later, when history settles, does assessment from that settled context make it true. The metaphysics stays open; the semantics adapts.

  **Sophia:** *(pausing)* Here’s my comeback: supervaluationism *can* say Sam’s utterance *was* true—not by changing its past status, but by recognizing that *truth is timeless* while *truth-value ascription* is temporal. On Monday, we *correctly* ascribe no truth value. After Friday, we *correctly* ascribe truth. What changes isn’t the utterance’s relation to reality; it’s our epistemic and metaphysical position for *evaluating* it. Sam spoke a truth; we just couldn’t confirm it until Friday.

  **Riley:** But "she spoke a truth" implies it was true *then*. If you bite the bullet and say it *wasn’t* true then, you lose vindication. If you say it *was*, you collapse into eternalism. Relativism offers a third way: truth is *constitued* by context of assessment. That’s not relocating—it’s refining what truth *is*.

  **Sophia:** And I maintain that "refinement" overcomplicates without solving the core problem. Both theories agree reality was open. Both let us call Sam correct retrospectively. Supervaluationism does it with a stable, non-relative truth predicate tied to actual history. Your move buys rhetorical vindication at the cost of making truth irreducibly perspectival. I’ll take ontological parsimony over semantic relativism.

  **Riley:** Even if it means Sam’s true assertion wasn’t true when made? That’s a cost I won’t pay. *(Sips coffee, smiling)* Dissertation committee’s going to love this.

  ---

  ### Key Philosophical Takeaways:
  - **Relativist’s Push**: Supervaluationism allegedly can’t call Sam’s *utterance* "true" *simpliciter* even after the fact, only the *proposition* "turned out true."  
  - **Supervaluationist’s Comeback**: Truth is timeless; utterances express propositions whose truth is fixed by actual history. Retrospective vindication comes from *knowing* the utterance expressed a true proposition, not from changing past truth-value.  
  - **Core Tension**: Is "truth" fundamentally tied to context of utterance (supervaluationism) or context of assessment (relativism)? And which better preserves openness *and* retrospective correctness?  

  This mirrors current debates: MacFarlane argues supervaluationism’s "indeterminate at utterance but true later" is incoherent; supervaluationists (like Barnes & Cameron) retort that relativism’s assessment-sensitivity undermines truth’s objectivity. Both positions have nuanced defenses—your dissertation can weigh which cost is steeper.
