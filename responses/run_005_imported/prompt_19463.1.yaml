  I need to ensure I don't get too technical but still convey the essential disagreements. Highlighting Williamson's argument that epistemicism preserves classical logic might be relevant, as the user mentioned classical logic's assumptions. Also, touching on higher-order vagueness could address their concern about whether borderline cases themselves have boundaries.

