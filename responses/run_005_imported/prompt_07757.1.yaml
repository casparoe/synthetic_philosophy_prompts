  The user's confusion is practical: why do scientists treat Mercury as confirming evidence if Bayesian math says it shouldn't? Their seminar friend disagrees, but neither sees the flaw. The user needs clarity on whether this is a genuine consequence of Bayesianism or if there's a solution they're missing. 

  First, I recall Glymour's problem: old evidence can't raise P(H) if already known. The user's example is textbook—Mercury's data was old, so by strict conditionalization, it can't confirm GR. But scientists do cite it as evidence. The tension is between formal Bayesianism and scientific practice. 

  The user might be overlooking philosophical responses. Solutions exist: (1) counterfactual priors (what P(H) would've been without E), (2) rigid designators (reinterpreting E post-theory), (3) non-probabilistic accounts. They might also conflate historical discovery with logical confirmation. Einstein used Mercury heuristically, but confirmation is about rational belief update. 

  Their deeper need: reconciling Bayesian theory with real science. They want to know if Bayesianism is flawed or if scientists are "confused." The answer is nuanced—Bayesianism has tools to address this, but it's a recognized limitation. Historians aren't wrong; they're describing historical impact, not formal confirmation. 

  I should explain key solutions simply. Emphasize that most philosophers don't discard old evidence; they adjust the framework. The counterfactual approach is popular: imagine a scientist who never knew E, then sees P(H|E) > P(H). For Mercury, Einstein (or peers) could hypothetically not have known it, making P(E) < 1. 

  Also, note that E isn't just "Mercury's anomaly" but its precise fit with GR. Post-GR, E gains new meaning, so P(E) could be reassessed. This avoids the problem but is contentious. 

  Lastly, distinguish historical narrative from confirmation logic. Einstein leveraged Mercury for motivation, but formal confirmation requires novel testing. Eddington's eclipse was novel; Mercury became "confirmatory" later in a Bayesian sense only via counterfactuals. 

  The user's friend is right to question the strict view—pure Bayesianism here is incomplete. The resolution lies in nuanced interpretations. Highlight that this is a famous puzzle with no single answer, but Bayesianism adapts rather than collapses.
answer: |-
  You've articulated the problem of old evidence perfectly—it's a genuine and deep challenge for Bayesian confirmation theory. Yes, the core mathematical consequence you describe is correct: **if P(E) = 1 *before* conditionalizing on E to update belief in H, then P(H|E) = P(H), and E cannot confirm H on the standard Bayesian definition.** Applied to Mercury's perihelion precession in 1915, this implies it *should not* count as confirmatory evidence for GR under strict Bayesian conditionalization.

  **Why Scientists/Historians Aren't "Confused":**
  Physicists and historians aren't mistaken about Mercury's significance; they're operating with a different (and often implicit) notion of confirmation. They focus on:
  1.  **Explanatory Power:** GR *uniquely and precisely explained* a known anomaly that resisted Newtonian solutions.
  2.  **Retrospective Coherence:** The anomaly became evidence *for* GR precisely *because* GR fit it so well, contrasting with the failure of alternatives.
  3.  **Narrative Significance:** Einstein himself was motivated by explaining Mercury, and its fit was a powerful rhetorical and psychological boost for the theory's acceptance.

  **The Philosophical Puzzle & Proposed Solutions:**
  Philosophers recognize this clashes with strict Bayesianism. Glymour's critique forces them to refine the theory. Here are the main ways they've tried to resolve it:

  1.  **The Counterfactual Credence Approach (Most Popular):**
      *   **Core Idea:** We shouldn't use the *actual* prior probability of the scientist (e.g., Einstein in 1915). Instead, we should ask: What would the scientist's credence in H have been *if they hadn't known E*? Then, conditionalizing on E *from that counterfactual state* would raise P(H).
      *   **For Mercury:** Imagine Einstein (or a relevant scientific community) *before* learning about Mercury's anomaly. In that counterfactual state, P(Mercury Data) < 1. We then ask: *If* they had GR and *then* learned the precise value of the anomaly, would P(GR) increase? The answer is clearly "yes." The anomaly is strong evidence *relative to a state of ignorance about it*.
      *   **Challenge:** Defining the exact counterfactual state ("How much did Einstein know?") can be messy. Is it a state of total ignorance about Mercury, or just ignorance that its motion is anomalous? But it captures the intuition.

  2.  **Changing the Interpretation of E (Rigid Designation):**
      *   **Core Idea:** The evidence proposition E isn't static. After proposing H, E might be understood differently. Pre-GR, E = "The observed perihelion advance is X arcseconds/century." Post-GR, E* = "The observed perihelion advance is X arcseconds/century *AND* GR predicts exactly X arcseconds/century."
      *   **For Mercury:** Before GR, scientists knew E. But *after* GR is proposed, the *salient* evidence becomes E* – the *match* between the observation and GR's unique prediction. Crucially, P(E*) was *not* 1 before GR was proposed (no one knew GR predicted X!). Learning *that GR predicts exactly the known value* (E*) *can* raise P(GR).
      *   **Challenge:** This can feel like changing the subject. The raw data was known; the *fit* is what's new. But Bayesians argue the *fit* is the confirmatory element.

  3.  **Probability of the "Fit" (Related to 2):**
      *   **Core Idea:** What's surprising and confirmatory isn't E itself (the anomaly), but the *fact that H entails E*. Let F = "H entails E". We can ask if P(H|F) > P(H). Crucially, P(F) was <1 before H was formulated (no one knew GR entailed E!).
      *   **For Mercury:** Before GR, P(GR entails Mercury's anomaly) = 0 (GR didn't exist). After GR is proposed, learning F = "GR entails the precise observed anomaly" *is* new information that can raise P(GR).
      *   **Challenge:** This separates logical entailment from empirical evidence. Does learning the *logical fact* that H implies known E really provide the same confirmation as *observing* a novel E predicted by H? Some argue no.

  4.  **Non-Bayesian or Hybrid Accounts:**
      *   Some philosophers (like Glymour himself) argue this shows Bayesianism is insufficient and needs supplementing with other concepts (like explanatory coherence or bootstrapping).
      *   Others explore "logical" or "objective" Bayesianism with constraints on priors that might force P(E) < 1 even for known data under certain descriptions.

  **Your Specific Questions Answered:**

  *   **Is the inability of old evidence to confirm a consequence of the math?** **Yes.** Strict application of conditionalization with the agent's *actual* priors at the time H is proposed, where P(E)=1, implies P(H|E)=P(H).
  *   **Should *only* novel predictions like the eclipse count?** **On strict, literal Bayesian conditionalization with actual priors, yes.** Only evidence learned *after* H is proposed with P(E)<1 can increase P(H).
  *   **Is Mercury's perihelion demoted to mere rhetoric?** **No, not even by most Bayesians.** While the strict math has a problem, the proposed solutions (especially the counterfactual approach) aim to *recover* the intuition that Mercury *does* provide genuine confirmation. It highlights a *limitation in the simple application* of the theory, not necessarily a flaw in the intuition.
  *   **Where does the argument go wrong?** The core mathematical point isn't wrong. The "wrongness" lies in the *strict application of actual historical credences* to capture the confirmatory relationship. The solutions involve rethinking *which* probabilities (counterfactual, reinterpreted evidence, probability of fit) are relevant for capturing why scientists rightly see Mercury as evidence.

  **Conclusion:**

  You've correctly identified a profound challenge for Bayesian confirmation theory. The Mercury perihelion *is* problematic under a naive application of conditionalization using Einstein's 1915 credences. However, philosophers overwhelmingly reject the conclusion that it provides *no* confirmation. Instead, they use this puzzle to refine Bayesianism, primarily through the **counterfactual credence approach** – arguing that Mercury confirms GR relative to what rational credence *would have been* without knowledge of the anomaly. While the eclipse observations represent the "cleaner" Bayesian case of novel prediction, the philosophical consensus is that solutions exist within (or as extensions to) the Bayesian framework to accommodate the undeniable confirmatory role of old evidence like Mercury's orbit. Glymour's problem doesn't sink Bayesianism, but it forces a more sophisticated understanding of how probabilities represent evidence and belief change over time.
