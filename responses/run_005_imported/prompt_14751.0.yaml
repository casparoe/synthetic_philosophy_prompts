  Actually, let me check the standard definitions from Bostrom:

  - Self-Sampling Assumption (SSA): One should reason as if one were a random sample from the set of all observers in one’s reference class.
  - Self-Indication Assumption (SIA): One should reason as if one’s own existence is a random sample from the set of all possible observers (across possible worlds). This implies that a world with twice as many observers is twice as likely.

  So the student's description of SSA is approximately correct: "weight entire hypotheses in proportion to how many observers-like-you they contain" is a way to say that we are a random sample from the set of observers in the actual world, which leads to weighting by the number of observers in each world.

