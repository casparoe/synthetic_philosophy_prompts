  But note: the student says that SIA is about "locating yourself once you already know which world is actual" which is actually more like SSA. SSA is about self-location given the world. SIA is about updating on the fact that you exist at all (i.e., which world is actual). So the definitions are a bit confused.

  Let me adjust: 
  - The student's definition of SSA is correct: weighting hypotheses by the number of observers (so that you are more likely to be in a world with more observers) -> leads to thirder.
  - The student's definition of SIA: "an observer should reason as if randomly sampled from the set of all actually existing observers in her reference class" is actually a description of SSA, not SIA. 

  What is SIA? Bostrom defines SIA as: we should think that we are more likely to exist in a world that has more observers. So SIA says that the prior probability of a world should be proportional to the number of observers in it. Then, when you condition on being an observer, you get that worlds with more observers are more likely.

  In the student's text: 
