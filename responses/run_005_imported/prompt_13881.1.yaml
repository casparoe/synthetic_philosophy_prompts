prompt: |-
  This semester I'm taking a seminar on the metaphysics of facts and propositions, and this week's session on Bradley's regress left me wanting to think through something we didn't have time to settle in class. We'd read Bradley's chapter on relation and quality in Appearance and Reality alongside excerpts from Frege's "On Concept and Object" and Armstrong's A World of States of Affairs, and our professor kept lining the two responses up against each other: Frege blocks the regress by making concepts inherently "unsaturated," so that no further relation is needed to glue a concept to an object, while Armstrong blocks it by holding that a state of affairs is unified through "non-mereological composition" -- a brute fact about the whole that isn't built up out of its constituents plus some connecting relation. Set side by side like that, the two moves start to look interchangeable, as though each side has simply relocated the same primitive unity and given it a different name, and I'd like to see whether that impression survives actual argument.

  Could you write me a dialogue between a committed Fregean and a committed Armstrongian, each trying to convince the other that only their own solution really stops the regress? I'd like the Armstrongian to open by pressing the concept horse problem -- that the moment you try to say what unsaturatedness amounts to, you've named the concept and thereby turned it into an object, so the doctrine seems to undercut itself as soon as it's stated -- and I want the Fregean to have a real answer to this rather than concede the point outright. I'd then like the Fregean to go on the offensive by asking how a state of affairs, which by Armstrong's own account exists only when the corresponding proposition is true, can explain the unity of a proposition that is false or merely being entertained, given that there's no state of affairs there to do any unifying at all. Please have each side engage directly with the other's last move rather than simply restate their own position, keep both equally sharp, and end with that last question still open rather than have either side concede.
reasoning: |-
  We are to write a dialogue between a Fregean (F) and an Armstrongian (A) on the topic of Bradley's regress and their respective solutions. The Armstrongian will start by pressing the concept horse problem against Frege. The Fregean must have a real answer. Then the Fregean will go on the offensive about false propositions and states of affairs. We are to end with the Fregean's last question about false propositions still open.

  Key points:
  1. Armstrongian opens with the concept horse problem: when you try to say what unsaturatedness is, you name the concept and turn it into an object, so the doctrine undercuts itself.
  2. Fregean must have a real answer to that.
  3. Then Fregean attacks: how does Armstrong account for the unity of false propositions? There's no state of affairs to unify the constituents.
  4. Each side engages directly with the other's last move.
  5. Both sides are equally sharp.
  6. End with the Fregean's last question still open.

  We structure the dialogue accordingly.

  Characters:
  - A: Armstrongian
  - F: Fregean

  Dialogue:

  A: Let's start with your Fregean solution to Bradley's regress. You say that a concept is inherently unsaturated, so it doesn't need a relation to bind it to an object. But here's the problem: the moment you try to express what unsaturatedness is, you have to use a name for the concept. For example, when you say "the concept horse is unsaturated", you've turned the concept into an object by naming it. So your doctrine seems to undermine itself as soon as it's stated. How do you escape this?

  F: That's a fair challenge, but it rests on a misunderstanding. When I say "the concept horse", I am indeed naming an object, not the concept itself. That's because language forces us to use names for concepts when we want to talk about them, but in reality, the concept is only presented in its predicative role. In a proper proposition like "Bucephalus is a horse", the concept 'horse' is not named; it is expressed by the predicate, and that's where its unsaturatedness is manifest. The fact that we can't talk about concepts without turning them into objects is a limitation of language, not of the metaphysics. The unsaturatedness is a feature of the concept as it functions in a proposition, not as it is named.

  A: I see what you're saying, but I'm not convinced. Even if we grant that in a proposition the concept functions in an unsaturated way, the problem is that when we try to explain what unsaturatedness is, we are forced to reify the concept. And then we have to explain how this reified concept (which is now an object) relates to the unsaturated concept that you say is present in the proposition. It seems you've just pushed the problem back a level. Now we have two kinds of things: the concept-as-object and the concept-as-unsaturated. How do they connect?

  F: But that's just the point: we don't have two kinds of things. The concept-as-object is a representation we create in our language to refer to the concept, but it's not the concept itself. The concept itself is only ever encountered in its predicative role. So there is no duality in the metaphysics, only in our language. The regress is blocked because in the actual combination, the concept is doing what it essentially does: it is incomplete and demands saturation by an object. There is no need for a further relation because the concept is already structured to be combined with an object.

  A: Hmm, that still seems like a dodge. You're saying that the concept in the wild, so to speak, is unsaturated and that's primitive. But then how do you account for the fact that we can think about concepts? When we think about the concept 'horse', we are thinking of it as an object. So in our thought, we are representing it as saturated. But then how does that representation relate to the unsaturated concept? It seems we are still stuck with a kind of duality that requires a relation.

  F: Not at all. The concept as an object of thought is a different entity. It is what Frege called a 'concept' in inverted commas. The real concept is the one that is predicative. The fact that we can form thoughts about concepts does not change the nature of the concept itself. The regress is blocked at the level of the original proposition because the concept is inherently predicative. The representation of the concept as an object is a derivative phenomenon and does not affect the original unity.

  A: I'll set that aside for now, but I remain skeptical. Let me turn to Armstrong's solution. He avoids the regress by holding that a state of affairs is a fundamental unity. It is not composed of its constituents plus a relation; rather, the unity is primitive. This is non-mereological composition: the whole is prior to the parts in terms of unity. So there is no need for a further relation to bind the constituents because the state of affairs just is the unified complex.

  F: But that seems like a brute fact. You're saying that the state of affairs unifies its constituents without any explanation. How is that better than my solution? At least I have a story about the nature of concepts.

  A: It's better because it avoids the problems of reification that plague your view. We don't have to worry about unsaturatedness and the concept horse problem because we treat everything as objects. The state of affairs is a whole that contains objects, properties, and relations, but the unity is not an additional component; it's a feature of the whole. So we don't need to introduce a special category of unsaturated entities.

  F: But now let me press you on a different point. Your states of affairs exist only when the corresponding proposition is true, right? So what about false propositions? When I say "The cat is on the mat" and it's false, there is no state of affairs. But the proposition still has unity: it's a structured whole that represents the cat as being on the mat. How does Armstrong account for that unity? There is no state of affairs to unify the constituents in the false case.

  A: Armstrong would say that for false propositions, we are dealing with a mere possibility. There is a possible state of affairs that would unify the constituents if it existed. But the unity in the proposition is derivative from the unity that exists in actual states of affairs. We understand what it would be for the cat to be on the mat because we are acquainted with actual unities of that form.

  F: But that seems circular. How do we understand the unity of the actual state of affairs? You say it's primitive. But then how does that primitive unity explain the unity of a proposition that is false? The false proposition is a unity that does not correspond to any actual state of affairs. So the unity must be in the proposition itself. But if the unity is in the proposition, then it seems we have a unity without a state of affairs. And then we are back to the problem: what unifies the proposition? If you say that the proposition is a representation that mirrors the structure of a state of affairs, then you are admitting that the unity of the state of affairs is prior and the proposition borrows it. But then what unifies the state of affairs? You say it's primitive. But then why can't I say the same for the proposition? And if you say that the proposition is unified by the mind, then you've introduced a different kind of unity and you have to explain that.

  A: I see the challenge. Armstrong does not have a full theory of propositions, but he does hold that the unity of a proposition is derived from the form of actual states of affairs. The mind can combine objects and properties in a way that mirrors the structure of states of affairs. So the unity in the proposition is not primitive; it is parasitic on the unity of actual states of affairs.

  F: But that doesn't work for false propositions that have no corresponding possible state of affairs. For example, consider the proposition "The square circle is round". That's a false proposition, but it's also impossible. There is no possible state of affairs that would make it true. So how can the unity of that proposition be parasitic on an actual state of affairs? There isn't even a possible one. Yet the proposition is a unity: it represents the square circle as being round.

  A: For impossible propositions, Armstrong might say that they are built out of constituents that are themselves derived from actual states of affairs, but combined in an incoherent way. The unity is still derivative because the constituents and the way they are combined (even if incoherent) are drawn from actual unities.

  F: But the way they are combined is not drawn from any actual unity because no actual state of affairs combines a square circle with roundness. In fact, the concept 'square circle' is itself impossible. So it seems that the unity of the proposition is independent of any actual state of affairs. And if that's the case, then the unity must be explained without reference to states of affairs. But then what explains it? And if you can explain the unity of the proposition without states of affairs, then why do you need states of affairs to explain the unity of true propositions?

  A: I think you're pushing me into a corner. Let me think... Perhaps the unity of the proposition is a mental act. When we entertain a proposition, we are actively combining the constituents. So the mind provides the unity.

  F: But that sounds like psychologism, and Armstrong would reject that, wouldn't he? He wants states of affairs to be mind-independent. And if the unity of the proposition is provided by the mind, then how does that relate to the mind-independent unity of states of affairs? Moreover, for false propositions, if the mind unifies the constituents, then what prevents the regress in the mind? If the mind combines A and B, do we need a relation between the mind and A and B? And then a relation between that relation and the mind, and so on? It seems the regress reappears.

  A: You're right that Armstrong would not want to go down the psychologism route. But I think his view is that the unity of a proposition is a derivative kind of unity, explained by the fact that it represents a state of affairs. The representation relation is what gives the proposition its unity. But that representation relation is a complex matter.

  F: But then we are back to the representation relation. How does that relation unify the proposition? If the proposition is a complex of constituents, and the representation relation is a relation that holds between the whole proposition and a state of affairs, that doesn't explain the internal unity of the proposition. The proposition must already be unified in order to represent. So the representation relation cannot be what unifies it. This seems to lead to a regress.

  A: I think we are at an impasse. I maintain that the primitive unity of states of affairs is the foundation, and propositions derive their unity from it. You find that inadequate for false propositions. But let me turn it back to you: how does your Fregean account handle false propositions? You have the same problem: what unifies the constituents of a false proposition?

  F: For Frege, a proposition (a thought) is built from saturated objects and unsaturated concepts. The unsaturatedness of the concept provides the unity. So even in a false proposition, the concept is unsaturated and thus requires saturation. The unity comes from the same source: the concept is incomplete and is completed by the object. So the unity is present regardless of truth value.

  A: But then what about the concept horse problem? In the false proposition "Bucephalus is a horse", the concept 'horse' is unsaturated. But when we think about that false proposition, we are considering it as a whole, and then the concept becomes an object. So again, we have the duality.

  F: Only in our reflective thought. The proposition itself is a unity because the concept is functioning in its predicative role. When we reflect on it, we form a new proposition about the original one, and then we use names. But that doesn't affect the original unity.

  A: But then how do we account for the unity of the reflective proposition? It seems we are in an infinite regress of meta-propositions.

  F: Not necessarily. The reflective proposition is a new unity, built from new concepts and objects. The original proposition is now an object of thought, but the reflective proposition has its own unity from the unsaturated concepts within it. So each level is independent.

  A: But then we have an infinite hierarchy of unities, each one built from the same kind of unsaturated concepts. That seems to multiply unities without end. How is that better than a regress?

  F: It's not a regress because each proposition is a separate entity. The unity of each proposition is explained by the unsaturatedness of its concepts. There is no chain of relations that goes on forever. The regress is blocked at each level.

  A: But now you have an infinite number of primitive unities, one for each level. That seems ontologically extravagant.

  F: And your primitive unities of states of affairs are not? For every true proposition, you have a state of affairs. But for false ones, you have to explain the unity without a state of affairs. So you have two kinds of unity: the primitive unity of states of affairs and the derivative unity of propositions. I have only one kind: the unity from unsaturated concepts, which applies to all propositions.

  A: But you have the concept horse problem at every level.

  F: And you have the problem of false propositions.

  [End with the Fregean's question about false propositions still open, as per request.]

  F: So, we seem to have reached a stalemate. But let me leave you with this: how does Armstrong account for the unity of a false proposition without invoking a state of affairs? Until you can answer that, I don't see how your solution is complete.

  A: And I leave you with the concept horse problem: how do you talk about the concept without turning it into an object? Until you can answer that without invoking a hierarchy of unities, I don't see how your solution is stable.

  [End of dialogue]
answer: |-
  ### Dialogue: Fregean vs. Armstrongian on Bradley's Regress

  **Characters:**  
  - **Armstrongian (A):** Committed to David Armstrong's view that states of affairs are unified through "non-mereological composition"—a brute, primitive unity of the whole that does not reduce to its constituents plus a relation.  
  - **Fregean (F):** Committed to Gottlob Frege's view that concepts are inherently "unsaturated," so they require completion by objects without needing a further binding relation.  

  **Setting:** A university common room after the seminar.  

  ---

  **A:** (Leaning forward, eager to engage) Let's start with the core of your Fregean solution to Bradley's regress. You block the infinite chain by claiming concepts are "unsaturated"—they don't need a relation to glue them to objects because they're inherently incomplete, like a puzzle piece with gaps. But here's the fatal flaw: the moment you try to articulate what "unsaturatedness" is, you inevitably name the concept. Take "the concept *horse*." The instant you refer to it as "the concept," you've turned it into an object—a saturated, self-subsistent thing. Your doctrine undercuts itself the moment it's stated. How can unsaturatedness be a real feature if naming it destroys it? That's not a solution; it's a self-defeating paradox.  

  **F:** (Calmly, with a slight smile) Ah, the infamous "concept *horse*" problem! But you're conflating language with metaphysics. When I say "the concept *horse*," I am indeed using a name—a saturated expression—to refer to something that, in its proper metaphysical role, is unsaturated. This is a limitation of language, not a flaw in the metaphysics. In a proposition like "Bucephalus is a horse," the concept isn't named; it's expressed through the predicate, where its unsaturated nature is manifest. The concept *as it functions* in predicative position is incomplete and demands saturation. Naming it in reflection doesn't change that; it just creates a derivative object for discussion. The regress is blocked at the level of the proposition itself because no further relation is needed—the concept's unsaturatedness *is* the binding.  

  **A:** (Skeptical, tapping the table) But that's a dodge! If language forces us to reify concepts whenever we discuss them, then in our *theorizing* about propositions, we're stuck with saturated objects. Now you have two things: the concept-as-object (which we talk about) and the concept-as-unsaturated (which does the binding). How do they connect? Doesn't that just restart the regress? You need a relation between the saturated object we name and the unsaturated entity in the proposition, and off we go again. Your "limitation of language" sounds like an excuse to avoid the real issue.  

  **F:** (Leaning in) Not at all. The concept-as-object is a mere shadow—a byproduct of our representational practices. Metaphysically, there's only one concept: it is unsaturated in its natural habitat, the proposition. When we reify it in language, we're creating an artifact for convenience, not discovering a new entity. The regress is blocked because at the ground level—in the atomic fact or proposition—the concept operates as unsaturated, requiring no glue. Your objection only highlights how language distorts; it doesn't undermine the ontology.  

  **A:** (Pausing, then shifting gears) Fine, let's turn to Armstrong's solution. He avoids your linguistic pitfalls by grounding unity in states of affairs. A state of affairs—say, *the cat being on the mat*—isn't built from the cat, the mat, and a relation; it's a primitive whole with "non-mereological composition." The unity is brute: the state of affairs just *is* the binding. No infinite regress because there's no "gap" for a relation to fill. It's ontologically honest—no mysterious unsaturatedness, just the world's structure.  

  **F:** (Eyes narrowing) But that brute unity raises its own problem. By your own account, a state of affairs exists only when the corresponding proposition is *true*. So, when I assert a false proposition—"The cat is on the mat" when it isn't—there is no state of affairs. Yet the proposition still has unity: it's not a mere list of "cat, mat, on"; it represents the cat *as being* on the mat. How does Armstrong explain that unity? If there's no state of affairs to unify it, what holds the constituents together? Without an answer, your solution only works for truths, leaving falsehoods—and even mere thoughts—unexplained.  

  **A:** (Quickly) False propositions are unified by their correspondence to *possible* states of affairs. When you entertain "the cat is on the mat," even falsely, your thought is structured by what it *would be* for that state of affairs to obtain. The unity is derived from the form of actual states of affairs we encounter. We grasp the cat-on-the-mat unity because we've seen cats on mats before—the actual unities scaffold the possible ones.  

  **F:** (Shaking head) That doesn't work. Consider an impossible proposition like "the square circle is round." There's no possible state of affairs here—it's incoherent. Yet the proposition has unity: it presents the square circle *as being* round. How can your "derived unity" from actual states of affairs explain this? Actual states of affairs involve coherent properties, but "square circle" is a contradiction. If you say the mind unifies it, you're lapsing into psychologism—and Armstrong rejects that. Without a state of affairs (actual or possible), your brute unity vanishes, and the regress returns: what unifies the constituents in the proposition itself?  

  **A:** (Firmly) The unity of a proposition, even a false one, comes from its combinatorial structure, which mirrors the real structure of states of affairs. The mind doesn't create unity; it accesses the same combinatorial principles that govern reality. For impossibles, we misuse those principles—but the principles themselves are grounded in actual unities. Your unsaturated concepts can't handle this either: in "the square circle is round," your "round" is unsaturated, but "square circle" is a failed object—it can't saturate anything. How does Frege avoid a regress there?  

  **F:** (Pointedly) Easily: in "the square circle is round," "is round" is unsaturated, demanding saturation. The subject "the square circle" attempts to saturate it but fails because it's contradictory. The unity arises from the concept's unsaturatedness, regardless of truth or coherence. But you still haven't answered my challenge: if states of affairs are your only source of unity, how can a false proposition be unified *when there is no state of affairs*? Saying it "mirrors" reality just pushes the question back. What is this "mirroring" relation, and how is *it* unified? If you appeal to the mind, Bradley's regress resurges for mental acts. If you say it's primitive, you've just relocated Frege's "unsaturatedness" under a new name—"non-mereological composition."  

  **A:** (Pausing, then conceding slightly) Armstrong's view is that propositions are real entities with intrinsic combinatorial structure, modeled on states of affairs but not dependent on their existence. The unity comes from the same fundamental principle: wholes are prior. But for falsehoods, it's a *representation* of a unity, not the unity itself.  

  **F:** (Triumphantly) And there it is! If false propositions have "intrinsic combinatorial structure," you've smuggled in unity without states of affairs—exactly what I do with unsaturatedness. But now you owe an account of that structure. Call it "non-mereological" or "unsaturated," it's equally primitive. Worse, you have two kinds of unity: one for states of affairs (brute) and one for propositions (derivative or structural). I have one: unsaturatedness everywhere. So how is your view less ad hoc?  

  **A:** (Defiantly) Because my primitive unity is grounded in the world—states of affairs are real, mind-independent complexes. Your unsaturatedness is a linguistic ghost. But I'll turn it back on you: if false propositions are unified by unsaturated concepts, what stops the concept *horse* problem from arising *within* the proposition when we analyze it? You still need to explain how unsaturatedness works without naming it—and you can't.  

  **F:** (Coolly) I don't need to "explain" it beyond its role—it's a fundamental feature of concepts. But you? You need to explain false propositions without states of affairs. So I ask again: how does a state of affairs, which doesn't exist for falsehoods, unify a proposition that is false? Until you answer that, your solution is incomplete.  

  **A:** (Eyes flashing) And until you explain how we can talk about unsaturatedness without destroying it, yours is incoherent.  

  **F:** (Smiling faintly) Then we agree on one thing: the question remains open.  

  ---  
  **End of dialogue.**  
  **Status:** The Fregean's challenge about false propositions is unresolved, with neither side conceding. The Armstrongian presses the "concept *horse*" problem as a critical flaw in Frege's view, while the Fregean maintains that Armstrong cannot account for the unity of false propositions without invoking a primitive unity that mirrors Frege's unsaturatedness. Both positions appear equally challenged, and the stalemate highlights the depth of Bradley's regress.
