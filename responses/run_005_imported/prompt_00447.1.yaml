prompt: |-
  So this happened to me last week and I still haven't shook it off. I was driving back from giving a guest lecture at another campus, running a bit behind schedule, and passed a car pulled over on the shoulder with its hazards on -- someone standing next to it looking pretty stressed out. I didn't stop, told myself someone else would get to it, plus I had a stack of exams waiting on me at home. That same evening I also skipped my usual $50 donation to the effective giving fund I support, figuring i'd just double up next month instead. Over dinner I mentioned both things to my partner, who's not in philosophy, and she said they're basically the same kind of failure -- that the only difference is one's vivid and close and the other isn't, and that shouldn't matter morally. I pushed back hard, saying the roadside case felt way more urgent to have blown off, but I couldn't actually explain why beyond "it just does."

  I teach intro ethics every fall and I'm embarrassed that I can't sort through my own case cleanly. Is there a principled reason the roadside omission should weigh heavier on my conscience than the donation one, or is my partner right that this is just distance and vividness messing with my judgment and I should feel equally bad about both? Curious how you'd talk me through this.
reasoning: |-
  Okay, let me start by really understanding what this philosophy professor is going through. They had two situations: not stopping to help a stranded driver and skipping their monthly donation. Their partner thinks both are morally similar failures, just differing in vividness. The professor feels worse about the roadside incident but can't articulate why beyond gut feeling. Since they teach ethics, this personal conflict is especially troubling.

  First, I need to break down why the roadside scenario feels heavier. Proximity is a big factor—being physically present creates an immediate demand. The stranded person's distress was visible, which triggers emotional responses. There's also the bystander effect; they assumed others would help, but in that moment, they were the only one there. Plus, driving away leaves no chance for someone else to step in immediately.

  Contrast this with the donation. It's a planned, habitual action. Missing one month feels less urgent because the harm is distant and abstract. They can compensate later by doubling up. The beneficiaries aren't visible, so there's no emotional trigger. The systems in place (like the effective giving fund) mean others' donations might cover the gap, reducing immediate harm.

  Now, the partner's point about vividness affecting moral judgment is valid. Psychological studies like Singer's pond example show people respond more to salient crises. But does vividness change moral weight? In effective altruism, both actions aim to prevent harm, but the roadside is a specific individual in immediate peril, while donations address systemic issues. 

  Assessing harm: The roadside help could prevent physical danger or significant inconvenience. The donation might fund life-saving interventions. Quantitatively, $50 could save more lives via effective charities. But immediacy matters—helping the stranded driver addresses a direct, acute need versus a potential future one.

  Responsibility is another angle. In the roadside case, proximity creates a direct duty. The professor was uniquely positioned to help at that moment. With donations, the responsibility is shared; others contribute, and delaying doesn't immediately endanger anyone.

  The professor might feel worse due to personal failure in a spontaneous test of character versus a habitual lapse. The roadside was a real-time decision under pressure, making the omission feel like a deeper moral failing.

  So, while vividness plays a role, there are principled differences: immediacy, specificity of harm, unique position to act, and inability to defer. Yet, effective altruism argues for rationality over emotion. Balancing both, the professor should recognize the psychological impact but also consider the greater good of consistent donations. The takeaway? Both matter, but the roadside omission has distinct features that amplify its moral weight, though not dismissing the donation's importance.
answer: |-
  You've hit on one of the most visceral tensions in moral philosophy - and your discomfort is completely understandable. Let's break this down systematically. Your partner makes a strong point about vividness bias, but there are indeed principled differences between these omissions that might explain your heavier conscience about the roadside situation:

  ### 1. **The Proximity/Uniqueness Argument**
     - **Roadside**: You were the *only possible agent* at that moment. The stranded person's distress created a *direct, exclusive appeal* to you specifically. As Judith Jarvis Thomson noted, when someone "locks eyes" with you in need, it transforms abstract duty into personal obligation.
     - **Donation**: Your $50 would be pooled with others'. Your omission could be compensated by other donors (or your future self). The beneficiaries don't know you exist - there's no unique appeal.

  ### 2. **The Immediacy of Harm**
     - **Roadside**: Potential harm was imminent (safety risks, hours-long wait). Your help would have resolved the crisis *immediately*.
     - **Donation**: Harm prevented is probabilistic and deferred (e.g., malaria nets preventing *future* deaths). Skipping one month delays impact but doesn't usually create *new* immediate crises.

  ### 3. **The Bystander Effect Paradox**
     - **Roadside**: Your assumption "someone else will help" is classic bystander effect. But on a sparse highway, that assumption may have been statistically *untrue*. Each passing car reduces chances of help.
     - **Donation**: In effective giving systems, others *are* reliably helping. Your $50 absence doesn't collapse the safety net.

  ### 4. **Epistemic Certainty**
     - **Roadside**: You *knew* the need was real and urgent (hazards on, distressed person). No uncertainty about impact.
     - **Donation**: Impact is statistically significant but abstract. You trust the charity's efficacy reports, but it lacks concrete certainty.

  ### 5. **Effort/Convenience Asymmetry**
     - **Roadside**: Stopping would have cost significant time/effort (potentially hours). Omission was self-interested in a tangible way.
     - **Donation**: The $50 cost is fixed and low-effort. Skipping was arguably more forgetfulness than active sacrifice avoidance.

  ### Where Your Partner Is Profoundly Right**
  The vividness *does* distort your guilt. Peter Singer's "shallow pond" thought experiment exposes this: We'd ruin $50 shoes to save a drowning child, yet hesitate to donate that same $50 to save a child abroad. Morally equivalent? Logically yes. Psychologically different? Absolutely. Evolution wired us to prioritize proximate, visible crises. Your roadside guilt leverages this ancient wiring.

  ### The Ethical Synthesis**
  - **You should feel *differently* about these omissions, but perhaps not *unequally* guilty**:  
    The roadside omission violates a **duty of easy rescue** (limited-time opportunity to prevent direct harm). The donation omission violates a **duty of beneficence** (ongoing obligation to address suffering). One is a localized fire alarm; the other is climate change mitigation.  
  - **The conscience isn't irrational**: Your guilt signals that in *that moment*, you failed a test of character when stakes were clear. Donation lapses reflect systemic commitment issues.  
  - **Practical reconciliation**: Carry roadside emergency supplies in your trunk (compensating future omission risk). Set up automatic donations (removing monthly choice).

  ### Professional Self-Compassion
  Don't be embarrassed - this is pedagogy gold. Next semester, present this exact case study. Let students debate: *"Is letting someone drown in a pond morally equivalent to skipping a life-saving donation? Does physical distance negate moral proximity?"* Your lived tension demonstrates why ethics remains infuriatingly human - no clean algorithms, just continual calibration between emotional intuition and rational principle. The discomfort *is* the work.
