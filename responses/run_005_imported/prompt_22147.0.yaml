  First, I need to recall the standard responses to this objection. The friend claims NU is incoherent because its proponents reject the world-destruction implication. But philosophers like Arrhenius or Ord might argue that NU's axiology (value theory) doesn't automatically dictate obligations. So there's a gap between what's best in theory and what's actionable. Also, many suffering-focused ethicists aren't strict negative utilitarians; they might prioritize reducing suffering without excluding other values, like in negative-leaning utilitarianism.

  The user mentions s-risks, so they might be familiar with thinkers like Tomasik or Vinding. These ethicists often focus on reducing extreme suffering without advocating for extinction. They might argue that extinction could cause immense suffering if botched, making it too risky. Plus, future beings might find ways to eliminate suffering without ceasing to exist. That's a practical counterargument.

  Another angle: deontological constraints. Even if a painless extinction minimizes suffering, it might violate rights or autonomy. But NU typically rejects such constraints. However, negative consequentialism could incorporate them. The user's friend might be conflating pure NU with broader suffering-focused views.

  The user seems concerned about whether the friend's argument is decisive. They suspect it might only target extreme NU, leaving other suffering-focused ethics intact. I should highlight the spectrum of views. For instance, asymmetrical views where creating happiness is good but preventing suffering is more urgent. Or threshold views where only intense suffering matters, not mild discomforts.

  Also, the distinction between axiological and deontic levels. Even if a world without sentience is better, acting to achieve it might involve unacceptable means. But if the annihilation is painless, is the means still problematic? Some ethicists argue that sentient beings have interests in continuing to live, so ending life violates those interests, even if painless. That's a key point.

  The user might also be interested in real-world adherence. Philosophers like Singer prioritize reducing suffering but don't support extinction. They focus on practical measures like reducing animal suffering. So the friend's claim that no serious philosopher holds suffering-focused ethics without deception might overlook these nuanced positions.

  I should check if there's a deeper need here. The user attended a talk on s-risks, so they might be involved in effective altruism or related communities. They could be seeking reassurance that focusing on suffering reduction is still valid despite the extinction argument. Or they might want to better defend their position in future discussions.

