answer: |-
  Here's the argument that Newton's Arian heresy is structurally necessary for his doctrine of absolute space, using Leibniz as the contrasting orthodox foil:

  **The Core Argument:** Newton's Arianism (specifically its emphasis on God's *absolute, undivided, singular Sovereignty*) necessitates a framework where God's dominion is exercised *directly and universally* over creation. Absolute space provides the unique, immutable, non-relational "stage" required for this direct sovereign action. A Trinitarian Newton, accepting divine relationality and immanence through the Son/Spirit, would lack this *theological compulsion* for absolute space and could have adopted Leibniz's relational alternative without violating core theological principles.

  **Deconstructing the Theological Pressure Points:**

  1.  **The Arian God: Sovereign Will Demanding Immediate Presence:**
      *   Newton's God is emphatically *Dominus Deus* (Lord God) – a singular, indivisible monarch whose will is the *only* source of physical law and action ("He is not eternity or infinity, but eternal and infinite; he is not duration or space, but he endures and is present... he constitutes duration and space" - General Scholium).
      *   Arianism rejects the co-eternal, co-equal Persons of the Trinity. The Son is a created intermediary. For Newton, this meant **God the Father *alone* is the ultimate Sovereign**, and His dominion cannot be delegated, mediated, or dependent on relations *within* creation. His action must be *direct* and *immediate*.
      *   **The Problem:** How does this utterly transcendent, singular Sovereign *act* upon a spatially extended, temporal creation? There must be a universal medium for His presence and action that is *not* part of creation itself (which would make God dependent) nor a mere abstraction.

  2.  **Absolute Space as the Necessary Stage for Dominion:**
      *   Newton's solution is **Absolute Space**: Infinite, eternal, immutable, homogeneous, and independent of the bodies within it. Crucially, it is **not a substance** (which would challenge God's uniqueness) but an **emanative effect** or **consequence** of God's existence ("an emanative effect of the first existing being" - Drafts for the General Scholium).
      *   **Why Absolute?** Because only an *absolute* framework guarantees the *universality* and *immediacy* of God's sovereign action:
          *   **Universality:** God must be equally present *everywhere* to exert dominion uniformly. Absolute space provides the "everywhere." Relational space (defined by distances between bodies) would leave "gaps" or make God's presence dependent on the existence and configuration of bodies.
          *   **Immediacy:** God's will must act *directly* on bodies (e.g., imparting inertia, causing gravitational attraction). Absolute space provides the fixed, universal reference frame *through* which this action is instantiated. It is the "sensorium" (Opticks Query 28) – **not** a physical organ, but the *framework of perception/action* – allowing the singular Sovereign to perceive and act upon all parts of creation *simultaneously* and *without intermediary*. Relational space, being defined *by* bodies, offers no such prior, independent framework for direct divine action.
      *   **Space as Divine Attribute:** Newton subtly identifies space (and time) with God's *manner* of existing ("He endures always and is present everywhere, and by existing always and everywhere he constitutes duration and space"). Absolute space is the *manifestation* of God's omnipresence necessary for His singular sovereignty. A relational space could not fulfill this role as an attribute of the divine being.

  3.  **Leibniz's Orthodox Trinitarianism Enables Relational Space:**
      *   Leibniz (orthodox Trinitarian) attacks Newton's absolute space precisely because he lacks Newton's *theological need* for it. His objections in the Clarke Correspondence are theological *and* metaphysical:
          *   **Theological:** Absolute space makes space an "absolute real being... eternal, infinite, uncreated" – challenging God's uniqueness ("It seems to follow that this divine sensorium is independent of God"). He sees it as a return to pagan ideas of space as God's body or a rival entity.
          *   **Metaphysical:** "Space is the order of coexisting things." For Leibniz, space is fundamentally *relational*, defined by the possible and actual relations between substances (monads). It has no independent existence.
      *   **Why Relationalism Works for Leibniz's Theology:**
          *   **Divine Relationality:** The Trinity posits God as *inherently relational* (Father-Son-Spirit). This internal relationality provides a model for God's relationship *to* creation that doesn't require an absolute container. The Son and Spirit are the means of God's immanent action *within* the relational order of creation.
          *   **Immanence without Container:** God's omnipresence is achieved not by occupying a pre-existing absolute space, but by God's *direct causal and sustaining power* over every monad/substance. The *relations* between substances *are* the spatial order, sustained moment-by-moment by God. There is no need for an absolute stage because God's action is immanent *within* the relational network of creation itself.
          *   **No Threat to Sovereignty:** Leibniz's God is equally sovereign, but this sovereignty is exercised through the harmonious ordering of relations (pre-established harmony), not through direct mechanical action *within* an absolute framework. The relational order *is* the expression of God's will.

  **Conclusion: The Heretical Necessity**

  A Trinitarian Newton, accepting the co-eternality of the Son and Spirit, would have had a theological framework for divine immanence *within* the relational fabric of creation, akin to Leibniz. The *need* for an absolute, independent, universal container – as the sole means of ensuring the *direct, unmediated, universal action* of a strictly *singular and transcendent* Sovereign – would evaporate. Leibniz's relational space, grounded in orthodox Trinitarian immanence, becomes a viable alternative. Newton's Arian insistence on God's *absolute, undivided dominion* is therefore not just adjacent to his physics; it is the *theological engine* driving the specific structure of absolute space as the indispensable "sensorium" for his solitary Lord God. Without the heresy, the absolute framework loses its core theological *raison d'être*.
