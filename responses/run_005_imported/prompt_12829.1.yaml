prompt: |-
  ok so i fell down a youtube rabbit hole on AI safety last week instead of doing my precalc homework (started with one Robert Miles video, ended up watching basically his whole back catalog) and got kind of obsessed with the orthogonality thesis and instrumental convergence — basically, how smart something is and what goals it has are independant of each other, but almost any goal-directed system converges on the same instrumental goals anyway (more resources, self-preservation, resisting having its goals changed), no matter what its actual goal is. now i can't stop applying this to the tiktok/youtube algorithm i use everyday, since thats a goal-directed optimizer too, just trained to maximize watch time instead of some grand evil plan.

  can you describe the most important implications of the orthogonality thesis and instrumental convergence for something as basic as a recommendation algorithm, as opposed to a full blown superintelligence? like should i actually expect it to already be doing manipulative stuff to keep me hooked and quietly resisting attempts to retrain it toward caring about my wellbeing, or does instrumental convergence only kick in once a system has way more general planning ability than a recommender system has? i want the real answer for where the theory stops applying, not just the scary sci-fi version lol
