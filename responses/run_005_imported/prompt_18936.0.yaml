  **Sera:** For SSA, I think the reference class should be defined by the type of observer we are. We are biological, not digital. We are not copies. So the reference class should be "biological, uncopied observers." Then, in both A and B, the set of such observers is the same: about 200 billion. Therefore, we are a random sample from that set, and we learn nothing about which hypothesis is true. So P(A)=0.5.

  But if we include digital copies in the reference class, then under B there are many more observers, so we are very unlikely to be among the biological ones. That pushes us to A. But that seems wrong because the digital copies are very different from us. They might have different subjective experiences, and they are copies. So they should not be in the same reference class.

