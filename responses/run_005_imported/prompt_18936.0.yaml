  But in both hypotheses, there are biological observers. Only in B are there digital ones. So we must decide: are digital minds (even if they are copies) in the reference class? If we define the reference class as "observers with human-like biological consciousness", then digital minds are excluded. But if we define it as "any conscious entity", then they are included.

