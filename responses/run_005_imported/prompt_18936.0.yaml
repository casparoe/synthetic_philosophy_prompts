  But now, let me challenge your reference class. If we define the reference class too narrowly, we can avoid the Doomsday Argument. But that seems ad hoc. For example, if we define the reference class as "observers alive in 2024", then we are certain to be in 2024 regardless of the future, so we learn nothing. But that's too narrow. Similarly, if we define it as "biological humans", then we ignore the digital minds and avoid the update. But why is that the right reference class? What if the digital minds are conscious and have experiences just like ours? Shouldn't they be in the reference class?

  **Sera:** That's a fair point. If digital minds are phenomenally conscious and have experiences that are relevantly similar to ours, then they should be in the reference class. But in this scenario, they are copies. Does that matter? If I am a copy, then there are multiple identical observer-moments. But in the reference class, we count observer-moments, not necessarily distinct individuals. So identical copies would each be a separate observer-moment. So they should be included. Therefore, if we accept that, then the broad reference class is appropriate. Then, under SSA, we get a strong Doomsday Argument: we are almost certainly in A.

  But that seems presumptuous? Because without any evidence, we are concluding that the future is short.

  **Ian:** And that's the standard objection to SSA: it leads to the Doomsday Argument. Now, for SIA, we avoid that because we start by favoring large worlds. But then we condition on our data. However, in this case, after conditioning we are at 50-50. But note that without conditioning, we were almost certain of B. So we are making a huge update to go back to 50-50. That update comes from the fact that we are biological, which is very unlikely in B.

