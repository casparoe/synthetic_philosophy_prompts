  P(biological | A) = 1
  P(biological | B) = 1e-6

  So:

  Numerator: 1 * 1e-6 = 1e-6
  Denominator: (1 * 1e-6) + (1e-6 * 1) = 1e-6 + 1e-6 = 2e-6

  So P(A | biological) = (1e-6) / (2e-6) = 0.5

  And P(B | biological) = 0.5.

  Therefore, after conditioning on being biological, we are back to 50-50.

  **Sera:** That's interesting. So under SIA, without conditioning on being biological, we would be almost certain of B. But conditioning on being biological brings us back to even. However, under my SSA approach, if I use the broad reference class (including digital), I get almost certain of A. But if I use the narrow reference class (only biological), I get 50-50. And you get 50-50 after conditioning. So we both end up at 50-50? Then why do we have a disagreement?

  Wait, no: in my SSA approach, I argued for the narrow reference class and got 50-50. But I also noted that if I use the broad reference class, I get almost 100% for A. So the issue is: what is the correct reference class? And that's where we might differ.

  **Ian:** Exactly. The key is how we individuate observers and what we include in the reference class. But also, note that in your SSA approach, if you use the broad reference class, you get a strong update towards A, which is the Doomsday Argument. But then you have to explain why we are so early. In my SIA approach, we avoid that by having the prior favor large universes, and then conditioning on our data brings us back to even.

