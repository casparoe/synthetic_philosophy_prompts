  So both approaches can be made to agree by choosing the reference class appropriately for SSA and conditioning appropriately for SIA.

  But let me push back: in SIA, we counted the digital minds as observers. But what if they are not conscious? Or what if they are not "observers" in the relevant sense? Then we shouldn't count them. But the problem states that they are "observer-moments", so we are to assume they are conscious.

