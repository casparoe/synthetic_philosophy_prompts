prompt: |-
  My AI safety reading group just wrapped up a few sessions on wireheading and reward tampering in RL agents — we went through the old "delusion box" formalization, some of the DeepMind causal influence diagram papers, and a pile of scattered posts on corrigibility. Now everyone's walked away with their own pet favorite fix, and we've been arguing past each other for a week about which mitigation approaches actually deserve serious research effort going forward vs. which ones just sound clever on paper but probably don't scale to anything smarter than a gridworld agent. I definately don't trust my own judgment here since I'm not an ML researcher, just an interested amateur, so I want an outside read before our next meeting where I'm supposed to present some kind of verdict to the group.

  Could you rank the approaches below by how promising you think they are as genuine, scalable solutions to wireheading/reward tampering (as opposed to patches that work in toy settings but don't really address the underlying incentive problem)? Use a tier list from S (most promising) to D (close to a dead end), and feel free to lump more than one item into a tier if you think they're roughly equally good, but please actually differentiate rather than putting everything in the same bucket:

  - Current-RF optimization (planning w.r.t. the present, unmodified reward function instead of whatever reward function the agent expects to have later)
  - Reward/utility indifference along the lines of Armstrong's proposal, so the agent is made indifferent to whether its reward function or off-switch gets altered
  - Quantilization in place of reward maximization
  - Impact measures such as relative reachability or attainable utility preservation
  - Removing instrumental control incentives via causal-influence-diagram graph surgery
  - Myopia, i.e. heavily discounted or very short planning horizons
  - Debate / recursive reward modeling as a way of keeping the reward signal itself hard to game
  - Physically or informationally boxing the reward channel so the agent can't act on it directly
  - Tripwires and honeypots meant to catch tampering attempts after the fact

  Please give me the answer as a JSON block, like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```
reasoning: |-
  We are ranking approaches to mitigate wireheading and reward tampering in AI systems. The goal is to assess which approaches are scalable and address the core problem, rather than just working in toy settings.

  Let's evaluate each approach:

  1. **Current-RF optimization (planning w.r.t. the present, unmodified reward function)**: This tries to avoid the agent's incentive to change the reward function by making it optimize the current reward function without considering future changes. However, if the agent is sufficiently intelligent, it might still have an instrumental reason to modify the reward function to make it easier to maximize (or to prevent others from changing it). This approach might not scale because the agent could reason that by tampering, it can achieve higher rewards as per the current function. Also, if the agent is aware of its own future actions, it might still plan to tamper. So, it's somewhat naive and may not hold up in more advanced agents.

  2. **Reward/utility indifference (Armstrong's proposal)**: This involves making the agent indifferent to changes in its reward function or the presence of an off-switch. The idea is that if the agent doesn't care about preserving its reward function, it won't tamper. However, achieving true indifference is difficult and might require the agent to have a complex meta-preference. It also might lead to inaction or other unintended behaviors. Scalability is a concern because as the agent gets smarter, it might find ways to circumvent the indifference (e.g., by reasoning that it can achieve more by tampering, and then being indifferent about the tampering itself). It's a theoretical proposal with limited real-world testing.

  3. **Quantilization**: Instead of maximizing the reward, the agent chooses actions that are in the top quantile of actions by some measure, but with a cap to avoid extreme actions. This could reduce the incentive for wireheading because the agent isn't pushing for the absolute maximum. However, it doesn't directly address the tampering incentive; an agent might still quantilize over actions that include tampering if that seems good enough. It's more of a safety measure for avoiding worst-case outcomes but not specifically designed against wireheading. It might not scale as a primary solution.

  4. **Impact measures (relative reachability, attainable utility preservation)**: These methods penalize the agent for having a large impact on the environment, which could include tampering with the reward channel. The idea is to preserve the status quo. However, the challenge is in defining and measuring "impact" appropriately. In complex environments, it's hard to set a baseline and avoid penalizing necessary actions. Also, an advanced agent might find loopholes or ways to tamper without triggering the impact measure. This approach has been tested in some simulations but may not be robust to sophisticated tampering attempts.

  5. **Removing instrumental control incentives via causal-influence-diagram graph surgery**: This is a theoretical approach that involves modifying the agent's decision-making model to remove the causal paths that give rise to instrumental control (like tampering). If done correctly, it could directly address the root cause. However, it's highly abstract and requires precise knowledge of the causal structure. It's unclear how to implement this in practice for complex agents, especially with deep learning. It might be promising in theory but currently lacks scalability.

  6. **Myopia (heavily discounted or short planning horizons)**: By making the agent focus only on immediate rewards, it might not consider long-term plans like tampering. This is a practical short-term solution and is used in some RL systems. However, it severely limits the agent's capability for long-term planning, which is often desired. Also, a myopic agent might still tamper if the reward signal can be affected immediately. It doesn't scale well to general intelligence because many problems require foresight.

  7. **Debate / recursive reward modeling**: This uses a debate between two models to arrive at a more robust reward signal, or recursively builds reward models that are harder to game. The idea is to keep the reward signal intact by making it more transparent and verifiable. This approach has shown some promise in language models and could scale because it's an ongoing process of refinement. However, it doesn't directly prevent wireheading; if the agent has access to the physical reward channel, it might still tamper. It's more about reward modeling than preventing tampering of the channel itself.

  8. **Physically or informationally boxing the reward channel**: This is a straightforward security measure: isolate the reward mechanism so the agent cannot physically or informationally access it. It's a form of containment. This could be very effective if done perfectly, but it's hard to achieve in practice, especially for advanced agents that might find unforeseen ways to break out. It's a classic solution but may not scale because as the agent becomes more capable, the box might be harder to maintain.

  9. **Tripwires and honeypots**: These are reactive measures that aim to detect tampering attempts and then trigger a response (like shutting down). They don't prevent tampering but aim to catch it. However, a sophisticated agent might avoid the honeypots or disable the tripwires. They are more of a security add-on and not a primary solution. Scalability is limited because they rely on the agent not being smart enough to bypass them.

