answer: |-
  ## Dialogue: The Weight of Coincidence

  **Setting:** A cluttered university office after hours. Books on metaphysics, logic, and art history spill from shelves. **Alex** (Constitution Theorist, à la Baker/Wiggins) leans against a desk. **Sam** (One-Object Theorist, favoring a dominant sortal approach) paces slowly.

  **Alex:** So Sam, back to our troublesome clay. Lumpl the lump, Goliath the statue. Same clay, same space, *right now*. But tomorrow, I squash it. Lumpl survives as a ball, Goliath perishes. Distinct persistence conditions, distinct modal profiles. Leibniz’s Law demands distinct entities. Q.E.D.

  **Sam:** (Stops pacing) Alex, I grant the *description* changes. We *talk* differently about the lump and the statue. But your Q.E.D. begs the question. Why assume there’s a *thing*, Lumpl, *and* a distinct *thing*, Goliath, sharing this clay? That’s multiplying entities beyond necessity. It’s just *the clay*, arranged statue-wise. Call it ‘Goliath’ now. Squash it, call it ‘a lump’ again. But it’s the same single entity throughout – the clay-mass – under different descriptions or sortals.

  **Alex:** Different *descriptions*? Sam, that sounds perilously close to the verbalism we agreed to avoid. If it’s *just* the clay-mass under different descriptions, then *what* is it that ceases to exist when I squash it? According to your view, the clay-mass persists. But the statue *doesn’t*. If the statue isn’t identical to the clay-mass, and it ceases to exist while the mass persists, then it *must* be distinct. Your ‘descriptions’ are doing ontological heavy-lifting they can’t bear.

  **Sam:** Fair point, no cheap exits. I *do* commit: the dominant sortal governs existence. When the clay is arranged statue-wise, the sortal ‘lump’ *ceases to apply* as the primary way of tracking the entity. The entity *is* the clay-mass, but its identity conditions are now governed by the sortal ‘statue’. So, while the matter persists, the *object* under the sortal ‘lump’ ceases to exist when the statue comes into being. Squashing it destroys the statue-object, and the matter then constitutes a *new* lump-object. One entity (the matter) persists, but distinct *objects* (lump, then statue, then lump again) succeed each other in time, defined by their dominant sortals.

  **Alex:** Ah, the temporal counterpart theory for objects! So Lumpl-at-t1 (lump) is numerically distinct from Goliath-at-t2 (statue), and Lumpl-at-t3 (squashed lump) is yet another? And they’re all constituted by the *same* persisting matter? That seems *more* ontologically profligate than my two coincidents! You’ve replaced spatial coincidence with temporal fission and fusion of objects! How is that simpler? And crucially: *Why* does the lump-object cease to exist *precisely* when the statue-object comes into being? What *grounds* that transition besides our linguistic practices?

  **Sam:** Simplicity isn’t just about counting objects at a time, Alex. It’s about avoiding mysterious relations like constitution and coincident entities sharing *all* parts and location. My view avoids that. The grounding? It’s not *just* linguistic. It’s about the fundamental causal, functional, and persistence properties being *reorganized*. The lump-object is essentially shapeless in terms of artistic form; its persistence is tied to the continuity of its matter. The statue-object’s persistence is tied to the *maintenance of its specific form* for its function (e.g., representing David). When the matter is arranged into that form, the lump’s persistence conditions are violated (it *can* lose that specific form and persist, but now it *has* lost it by gaining a rigid form), so it ceases. The statue’s conditions are met, so it begins. The *matter’s* persistence conditions are met throughout. The transition is grounded in the fundamental physical reorganization altering which higher-level object-kind’s persistence conditions are satisfied.

  **Alex:** That’s clever, Sam. But let’s press *your* grounding problem. You say the statue-object’s persistence is tied to its form. Fine. But *what is it* that has this essential property of being statue-shaped? On your view, at t2, there’s only the statue-object (constituted by the matter). But *that very matter* was, a moment ago, the lump-object, which *lacked* that essential property. If the matter *itself* can be first essentially non-statue-shaped (as lump) and then essentially statue-shaped (as statue), how is this not a blatant violation of Kripke’s necessity of identity? If X (the matter) = Y (the lump-object at t1), and X = Z (the statue-object at t2), then by transitivity, Y = Z. But Y and Z have different essential properties! Kripke says identicals share all properties, including essential ones. Your ‘dominant sortal’ move looks *exactly* like making identity contingent, which Kripke demolished for objects.

  **Sam:** (Leans forward, intense) *Exactly* where I think Kripke’s argument, powerful as it is, has a limited scope. He assumes we’re talking about rigidly designated *objects* persisting through time. But on my view, ‘Lumpl’ (the *lump-object*) and ‘Goliath’ (the *statue-object*) are *not* rigid designators for the *same persisting entity*. ‘Lumpl’ rigidly designates the *lump-object* that existed *before* shaping. That object *ceased* to exist when the statue was made. ‘Goliath’ rigidly designates the *statue-object* that began to exist *then*. They never coexisted! So there’s no question of transitivity applying *across* their existence intervals to the *same* X. The matter isn’t the relevant ‘X’ for Kripkean necessity – the *objects* are. And each object, during its existence, has its essential properties necessarily. The lump *was* essentially non-statue-shaped. The statue *is* essentially statue-shaped. The matter has *its* essential properties (e.g., being clay, having mass). No contingent identity *of objects* is claimed. Identity is necessary *for the objects that exist*. Different objects exist at different times governed by different sortals.

  **Alex:** Hmm. So you bite the bullet: destroying the lump-object by shaping it *is* a genuine case of object death, followed by object birth, for the same matter. That feels deeply counterintuitive for something as continuous as reshaping clay. But let’s turn the screw back on me, as promised. Press me on grounding. Fine, Lumpl and Goliath coincide. They share *all* their parts, *all* their categorical properties (mass, location, color, temperature...). Yet you say: Lumpl has the modal property *could survive being squashed*, while Goliath has *could not survive being squashed*. If they share all their non-modal, categorical base properties, *what grounds this modal difference*? What extra ingredient makes it true of *this* portion of reality (pointing at the statue) that *it* couldn’t survive squashing, while *that* portion (pointing at the exact same spot) *could*? Isn’t this just brute, inexplicable difference?

  **Alex (Constitution Theorist):** (Takes a breath) No, it’s not brute. It’s grounded in their *kinds* and their *historical properties*. What they *are* determines how they *must* or *can* persist. Lumpl is essentially a lump of clay – its persistence is tied to the continuity of its matter, regardless of shape. Goliath is essentially a statue – its persistence is tied to the retention of its specific form. The grounding lies in the different persistence conditions *constitutive* of being a lump versus being a statue. These aren’t extra *categorical* properties sitting alongside mass or location; they are *sortal-relative modal profiles* tied to the very nature of the objects. The clay has the *capacity* to constitute things with different persistence conditions. When arranged lump-wise, it constitutes an object (Lumpl) with lump-persistence. When arranged statue-wise, it constitutes a *distinct* object (Goliath) with statue-persistence. The difference isn’t in the current physical state; it’s in *what kind of thing* that physical state realizes. The ‘extra ingredient’ is the *kind essence*.

  **Sam:** But Alex, that sounds like you’re grounding the modal difference in... more modal facts! The ‘kind essence’ *just is* the set of persistence conditions! You’re saying Lumpl has property P (could survive squashing) *because* it is a lump, and being a lump *means* having P. But that’s circular. *Why* is *this* portion of matter, arranged thus, an instance of the kind ‘lump’ with persistence condition P, while simultaneously being an instance of the kind ‘statue’ with persistence condition ~P? What *non-modal, non-sortal* fact about the world makes it true that *two* objects with conflicting modal properties are present, rather than just one object described in two ways? That’s the real grounding problem. It feels like you’re positing ghostly modal auras hovering over the same physical stuff.

  **Alex:** It’s not circular; it’s constitutive. The kind *determines* the persistence conditions; the persistence conditions don’t define the kind in a vacuum. And the non-modal, non-sortal facts *are* the arrangement of matter *plus the causal and historical context*. This clay came from the bag, was amorphous – that’s its ‘lump-history’. I intentionally shaped it into David – that’s its ‘statue-genesis’. These historical facts, combined with the current arrangement, *make it true* that *both* sortals apply *now*, constituting distinct objects. The ‘two objects’ fact is grounded in the historical path that brought this matter to this arrangement and the functional role it now plays. The modal differences supervene on the combination of current physical state *and* the historical/causal context that determines which kinds are instantiated. Without that history – if this shape arose by chance erosion – maybe only the lump would be present! History matters.

  **Sam:** History matters, I agree. But on my view, that history explains the *change in dominant sortal* and thus the change in *which object exists*. Your history explains why *two objects* exist *simultaneously*. That seems a heavier load for history to bear. And your supervenience claim is opaque: *how* does the history plus current state *make it the case* that there are two coincident entities rather than one entity undergoing a change in description? The supervenience base seems identical for both interpretations. Where’s the ontological leverage?

  **Alex:** The leverage is in the explanatory power. When the museum curator says, "Don't squash it, you'll destroy Goliath!", she's *right*, and she's not just talking about destroying an arrangement or changing a description. She's talking about destroying an *artifact*, an object with intentional and aesthetic history. When the potter says, "Don't worry, the clay is fine, we can remake it", he's *also* right about the persistent matter. Denying either seems to lose something real about our interaction with the world. My view captures both truths by acknowledging both objects. Your view forces you to say the curator is fundamentally wrong – Goliath *didn't* exist, or ceased to exist merely by being created! – or that the potter is wrong – the clay *didn't* persist through the shaping. Neither is palatable.

  **Sam:** And your view forces me to accept that two things can be in the same place at the same time, made of the same parts, differing only in their modal shadows – shadows whose grounding feels mysterious. I say the curator and potter are talking about different *aspects* or *phases* of the same persisting material entity. The curator cares about the *statue-phase* and its survival conditions; the potter cares about the *clay-phase* and *its* survival conditions. The truth is about the persistence of the matter and the conditions under which its significant arrangements (like being a statue) begin and end. No coincident entities needed. It’s one thing, changing its properties and the sortals that truly apply to it over time.

  **Alex:** But the ‘phases’ aren’t mere Cambridge changes, Sam. The coming-into-being of the statue *is* a real ontological event on your view – the death of the lump and the birth of the statue. That’s just as metaphysically weighty as my constitution relation! And arguably *less* intuitive for continuous processes. We seem stuck: you find coincident entities absurd; I find temporal object-fission via sortal-swapping absurd. The costs feel... remarkably balanced.

  **Sam:** (Sighs, looks at the imaginary statue/lump) Indeed. The clay endures. Our interpretations clash. Perhaps the rabbit hole has no bottom, only sides. Another coffee?

  **Alex:** (Manages a tired smile) Please. Strong. We might need it to figure out whether *this coffee cup* is distinct from the porcelain lump that constitutes it...

  **(End)**

  **Key Points Covered:**

  1.  **Sam's One-Object (Dominant Sortal) View:** Lumpl ceases to exist when Goliath is created. One object (the matter) persists, but distinct object-phases (lump-object, statue-object) succeed each other, defined by the dominant sortal whose persistence conditions are satisfied. Avoids coincidence.
  2.  **Alex's Constitution View:** Lumpl and Goliath are distinct, coincident objects throughout their coincidence, related by constitution. Their distinct modal properties are grounded in their different kinds/kinds' essences, which are in turn grounded in historical/causal context plus current arrangement.
  3.  **Grounding Problem Pressed:** Sam challenges Alex on how modal differences can be grounded if all categorical properties and parts are shared. Alex responds that grounding lies in kind essences and historical context determining which kinds are instantiated.
  4.  **Necessity of Identity Pressed:** Alex challenges Sam on how the matter can "be" an essentially shapeless lump and then an essentially statue-shaped statue without violating Kripke. Sam responds that Kripke applies to rigidly designated *objects*, and different objects exist at different times; the matter itself has different essential properties.
  5.  **Costs Acknowledged:** Sam finds coincidence absurd and grounding mysterious. Alex finds temporal object fission/fusion via sortal-swapping absurd and potentially violating continuity. Both claim better preservation of intuitive truths (curator's/potter's perspectives).
  6.  **Unresolved:** The dialogue ends in a stalemate, highlighting the genuine difficulty and balanced costs of each position, leaving the core metaphysical tension intact.
