  The user might be conflating two aspects: Russell's solution for definite descriptions versus his view on ordinary names. The machinery for phrases like "the present King of France" isn't directly undermined by Kripke. That machinery still works for non-referring terms, uniqueness, and scope distinctions. Kripke even acknowledges its utility for descriptions. 

  The friend's claim that logic courses teach Russell out of habit seems overstated. Russell's theory is foundational in logic, linguistics, and computer science. Its precision in handling quantifiers and scope is still valuable. The user probably needs reassurance that Russell's contributions remain relevant despite Kripke's impact on names. 

  Also, the user might feel their philosophical understanding is incomplete. They need a nuanced view that separates the theories' domains. Highlighting that Kripke's arguments address different problems could help. Emphasizing the continued application of definite descriptions in formal systems might alleviate their concern about obsolescence. 

