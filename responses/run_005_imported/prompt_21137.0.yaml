     Compare A0 and A1.
     - If A plays 0: gets 1.
     - If A plays 1: gets 2 only when both B and C play 1; otherwise 0.

     Is there a pure strategy of A that strictly dominates another? 
        We cannot say that A0 strictly dominates A1 because if B and C both play 1, then A1 gives 2 > 1. 
        Similarly, A1 does not dominate A0 because if at least one of B or C is 0, then A1 gives 0 < 1.

     So for A, neither pure strategy dominates the other.

  Similarly, for B and C, the same holds.

  Thus, no pure strategy is dominated by another pure strategy. So the entire set of strategies survives.

  Now, using mixed strategies as dominators:

  Consider player A. We want to see if there is a mixed strategy that strictly dominates either A0 or A1.

  Note: A0 gives a constant 1. A1 gives 2 when (B,C)=(1,1) and 0 otherwise.

  Consider a mixed strategy for A: play A0 with probability p and A1 with probability (1-p). Then the expected payoff for A against a fixed (B,C) is:
     p * 1 + (1-p) * [2 * I_{(1,1)}(B,C) + 0 * otherwise] 
     = p + 2(1-p) * I_{(1,1)}(B,C)

  We want to see if there is a mixed strategy (i.e., a p) that strictly dominates A1. 

