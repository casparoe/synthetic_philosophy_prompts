prompt: |-
  Compare two versions of iterated elimination of dominated strategies in a finite normal-form game: one that eliminates a pure strategy only when some other pure strategy strictly dominates it, and one that also eliminates a pure strategy whenever some mixed strategy strictly dominates it. Explain whether and how allowing mixed strategies as dominators changes the final set of surviving strategies, with a concrete example. This mixed-strategy procedure is standardly presented as equivalent to rationalizability, the set of strategies consistent with common knowledge of rationality. Does that equivalence still hold once a game has more than two players, and does it matter whether a player's beliefs about different opponents can be correlated? Justify your answer.
reasoning: |-
  We are going to compare two versions of iterated elimination of dominated strategies (IEDS) in a finite normal-form game.

  Version 1: Eliminate a pure strategy only when some other pure strategy strictly dominates it.
  Version 2: Also eliminate a pure strategy whenever some mixed strategy strictly dominates it.

  We are to see if allowing mixed strategies as dominators changes the final set of surviving strategies.

  First, note that in two-player games, the two versions lead to the same set of surviving strategies. However, in games with more than two players, the situation might be different because of the possibility of correlated beliefs.

  Rationalizability is defined as the set of strategies that survive iterated elimination of strategies that are never a best response to any belief about the opponents' strategies. The standard equivalence is that the set of strategies surviving IEDS when mixed strategies are allowed as dominators is exactly the rationalizable set. However, this equivalence holds under the assumption of independent beliefs (i.e., a player's belief about the opponents' strategies are independent across opponents) in games with more than two players? Actually, the standard rationalizability concept in most textbooks assumes independent beliefs. But there is also a concept of correlated rationalizability that allows correlated beliefs.

  Let me clarify:

  - In the procedure of IEDS that uses mixed strategies as dominators, we eliminate a pure strategy if there exists a mixed strategy (over the player's own pure strategies) that strictly dominates it. This procedure is equivalent to the set of strategies that are rationalizable under the assumption of independent beliefs? Or correlated?

  Actually, the standard IEDS with mixed dominators is equivalent to correlated rationalizability (allowing correlated beliefs) because the dominance condition by a mixed strategy does not require independence of opponents' strategies. In fact, the dominance condition is defined over the entire set of opponents' strategy profiles, without requiring independence.

  But let me break it down:

  1. **Strict domination by a mixed strategy**: 
     A pure strategy s_i of player i is strictly dominated by a mixed strategy σ_i if for every profile of opponents' strategies s_{-i}, the payoff from σ_i is strictly greater than the payoff from s_i. That is:
        u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i}) for every s_{-i} in the current set of opponents' strategies.

     Note: This condition must hold for every possible combination of opponents' strategies. This does not require independence.

  2. **Rationalizability**:
     - A strategy is rationalizable if it is a best response to some belief (probability distribution) over the opponents' strategy profiles. 
     - If we allow correlated beliefs, then the belief can assign positive probability to any profile in the set of opponents' strategies. This is called correlated rationalizability.
     - If we require independent beliefs, then the belief must be a product measure over each opponent's strategy set. This is independent rationalizability.

  In two-player games, the set of strategies surviving IEDS by mixed strategies is the same as the set of rationalizable strategies (and in two-player games, correlated and independent rationalizability coincide because there is only one opponent).

  In games with more than two players, the equivalence between IEDS with mixed dominators and rationalizability is with correlated rationalizability. Why? Because the condition for strict domination by a mixed strategy is defined against every pure profile of the opponents. This corresponds to a situation where a player may have correlated beliefs about the opponents. Thus, the set of strategies that survive IEDS with mixed dominators is exactly the set of correlated rationalizable strategies.

  However, if we require independent beliefs, then the set of independent rationalizable strategies may be larger. That is, there might be strategies that are never a best response to any independent belief but are a best response to some correlated belief. Thus, they would be eliminated under correlated rationalizability (and hence under IEDS with mixed dominators) but not under independent rationalizability.

  But note: the standard IEDS procedure with mixed dominators is equivalent to correlated rationalizability.

  Now, let's see if the two versions of IEDS (with and without mixed dominators) can lead to different outcomes in a game with more than two players.

  Example: Consider the following three-player game.

  Players: A, B, C.
  Each player has two strategies: 0 and 1.

  Payoffs:
  - Player A's payoff: 
     If A plays 0: 
        Then A gets 1 regardless of B and C.
     If A plays 1:
        Then A gets 2 if both B and C play 1, and 0 otherwise.

  - Player B and C: 
     They are symmetric. For player B:
        If B plays 0: 
            Then B gets 1 regardless.
        If B plays 1:
            Then B gets 2 if both A and C play 1, and 0 otherwise.
     Similarly for player C: 
        If C plays 0: gets 1.
        If C plays 1: gets 2 if both A and B play 1, and 0 otherwise.

  We can write the payoffs as:

  For A:
     A(0, *, *) = 1
     A(1, B, C) = 2 if (B,C) = (1,1), else 0.

  For B:
     B(0, *, *) = 1
     B(1, A, C) = 2 if (A,C) = (1,1), else 0.

  For C:
     C(0, *, *) = 1
     C(1, A, B) = 2 if (A,B) = (1,1), else 0.

  Now, let's do iterated elimination.

  First, using only pure strategy domination:

