  ### Comparison of Iterated Elimination Procedures
  In finite normal-form games, iterated elimination of strictly dominated strategies (IEDS) can be performed in two ways:
  1. **Pure-Strategy Dominators (PSD)**: Eliminate a pure strategy only if another **pure strategy** strictly dominates it.
  2. **Mixed-Strategy Dominators (MSD)**: Eliminate a pure strategy if **any mixed strategy** (over the player's pure strategies) strictly dominates it.

  **Key Difference**: MSD may eliminate more strategies than PSD, especially in games with more than two players, because a pure strategy might not be dominated by any single pure strategy but could be dominated by a mixed strategy. This is because mixed strategies allow for probabilistic combinations that can exploit weaknesses across different opponent profiles.

  ---

  ### Example: 3-Player Game Illustrating the Difference
  Consider a 3-player game where:
  - Player 1 has actions \(A_1, B_1\).
  - Player 2 has actions \(A_2, B_2\).
  - Player 3 has actions \(A_3, B_3\).

  **Payoffs for Player 1** (players 2 and 3 receive 0 in all cases, so they are indifferent and we focus on player 1):
  - If player 1 plays \(A_1\): Gets 1 if players 2 and 3 match (both \(A_2A_3\) or both \(B_2B_3\)), 0 otherwise.
  - If player 1 plays \(B_1\): Gets 1 if players 2 and 3 mismatch (\(A_2B_3\) or \(B_2A_3\)), 0 otherwise.
  - If player 1 plays \(C_1\) (a third strategy): Gets 0.5 in all cases.

  #### Payoff Matrix for Player 1:
  | Player 1 | \((A_2, A_3)\) | \((A_2, B_3)\) | \((B_2, A_3)\) | \((B_2, B_3)\) |
  |----------|---------------|---------------|---------------|---------------|
  | \(A_1\)  | 1             | 0             | 0             | 1             |
  | \(B_1\)  | 0             | 1             | 1             | 0             |
  | \(C_1\)  | 0.5           | 0.5           | 0.5           | 0.5           |

  **Analysis**:
  - **No pure strategy dominates \(C_1\)**:
    - \(A_1\) vs. \(C_1\): At \((A_2, A_3)\), \(A_1 = 1 > 0.5 = C_1\), but at \((A_2, B_3)\), \(A_1 = 0 < 0.5 = C_1\). No strict domination.
    - \(B_1\) vs. \(C_1\): At \((A_2, B_3)\), \(B_1 = 1 > 0.5 = C_1\), but at \((A_2, A_3)\), \(B_1 = 0 < 0.5 = C_1\). No strict domination.
  - **But a mixed strategy dominates \(C_1\)**:
    - Consider player 1 mixing equally between \(A_1\) and \(B_1\): \(\sigma_1 = (0.5, 0.5, 0)\).
      - Payoff of \(\sigma_1\) at any opponent profile: 
        - Expected payoff = \(0.5 \times \text{payoff of } A_1 + 0.5 \times \text{payoff of } B_1\).
        - E.g., at \((A_2, A_3)\): \(0.5 \times 1 + 0.5 \times 0 = 0.5\).
        - Similarly, at all profiles, payoff = 0.5.
      - Compare to \(C_1\) (always 0.5): \(\sigma_1\) yields 0.5 everywhere, but **strict domination requires strictly greater payoff in all cases**. Thus, \(\sigma_1\) does not strictly dominate \(C_1\).
    - **Dominating mixed strategy**: Use \(\sigma_1' = (0.4, 0.4, 0.2)\):
      - Payoff at \((A_2, A_3)\): \(0.4 \times 1 + 0.4 \times 0 + 0.2 \times 0.5 = 0.4 + 0.1 = 0.5\).
      - Payoff at \((A_2, B_3)\): \(0.4 \times 0 + 0.4 \times 1 + 0.2 \times 0.5 = 0.4 + 0.1 = 0.5\).
      - **Not sufficient**. Instead, use a mixed strategy that avoids \(C_1\) entirely: \(\sigma_1'' = (0.5, 0.5, 0)\).
        - At any profile, \(\sigma_1''\) yields 0.5, same as \(C_1\).
      - **Revised payoff for \(C_1\) to illustrate**: Assume \(C_1\) always yields 0.4 (not 0.5). Then \(\sigma_1'' = (0.5, 0.5, 0)\) yields 0.5 > 0.4 at all profiles, strictly dominating
