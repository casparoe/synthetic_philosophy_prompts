     In fact, the and that is the key: player 1's payoff depends only on whether player 2 and 3 match, not on his own action. So any action of player 1 is as good as any. Therefore, in this case, both 0 and 1 are best responses to any belief, so they are independent rationalizable.

     So in this game, under correlated beliefs, it is also the case that both actions are rationalizable.

