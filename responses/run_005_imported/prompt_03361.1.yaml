answer: |-
  That's a razor-sharp observation about Hobbes! You've perfectly captured his core ambition and its fascinating (and ultimately problematic) connection to Euclidean geometry. It *is* wild how seriously he took the model, and your "proto-LessWrong" comparison is spot-on – it's pure rationalist hubris in the best possible sense: "If we just define terms precisely and reason flawlessly, we *must* arrive at the One True Answer."

  Here's a breakdown of why Hobbes was drawn to this, why it hasn't "worked" for ethics/politics since, and the deeper reasons:

  1.  **Hobbes' Euclidean Dream:**
      *   **Mechanistic Universe:** Hobbes lived during the Scientific Revolution. He saw the universe, *including humans*, as complex machines governed by discoverable laws. Geometry was the pinnacle of demonstrable, certain knowledge.
      *   **Escape from Subjectivity & Chaos:** Post-Reformation Europe was ripped apart by religious wars fueled by conflicting interpretations of scripture and morality. Hobbes saw geometry as the antidote: start with undeniable truths about observable reality (human nature - fear, desire, self-preservation) and build logically. No room for opinion or dogma.
      *   **The Power of Deduction:** If you accept his bleak definitions of the "state of nature" (solitary, poor, nasty, brutish, short) and human motivation (appetite/aversion, driven by fear of death), then the logical deduction *must* be the absolute sovereign (Leviathan) as the only escape. It *felt* as inevitable as Pythagoras' theorem.
      *   **His Mathematical Confidence:** You're right, his (erroneous) solution to the circle quadrature massively inflated his confidence in his *method*. If he could crack an ancient geometric puzzle, why not the puzzle of political order? He believed he'd found the key to certainty.

  2.  **Why It Hasn't Been Replicated (Successfully) for Ethics/Political Theory:**
      *   **The Normative/Descriptive Chasm:** Math deals with abstract relations. Ethics and politics are fundamentally **normative** – they deal with *values*, *oughts*, *purposes*, and *justice*. Hobbes tried to derive the "ought" (absolute sovereignty) purely from descriptive "is" statements about human nature and a hypothetical state of war. This leap is the core problem.
          *   **The "Is-Ought" Problem (Hume):** David Hume later demolished this. You cannot logically derive a statement about what *should* be (e.g., "we ought to obey the sovereign") solely from statements about what *is* (e.g., "humans are self-interested and violent"). Values require a separate foundation.
      *   **The Non-Euclidean Nature of Human Reality:**
          *   **Contested Definitions:** What is "human nature"? Is it *only* fear and self-interest? What about empathy, cooperation, or a sense of fairness? Hobbes' starting axioms are highly contested, not self-evident like "a point has no part." They are interpretations, laden with his own historical context and biases.
          *   **Complexity & Emergence:** Human societies are complex adaptive systems. Behavior emerges from countless interacting individuals with varying motives, histories, cultures, and incomplete information. Reducing this to a few axioms and expecting deterministic, geometric outcomes ignores overwhelming complexity, feedback loops, and unintended consequences.
          *   **Historical & Cultural Contingency:** Political arrangements aren't theorems; they are historical products. They depend on specific technologies, economic systems, cultural values, geographical constraints, and random events. Deduction from universal axioms can't capture this messy contingency.
          *   **Value Pluralism:** Modern societies recognize multiple, often conflicting, legitimate values (liberty vs. equality, security vs. privacy, individual rights vs. collective good). There is no single, universally agreed-upon "first principle" from which to deduce a unique political solution. Geometry has one consistent system; ethics/politics have many competing frameworks.
      *   **The Failure of Grand Rationalist Systems:** Subsequent attempts (Spinoza, perhaps Rawls in a very different way) showed the difficulty. The 20th century horrors perpetrated in the name of "scientific" ideologies (Fascism, Stalinism) profoundly discredited the idea that pure reason applied to society leads inevitably to good outcomes. It often led to tyranny justified by "inevitable" logic.
      *   **The Empirical Turn:** Social sciences largely abandoned pure deduction. Political science, sociology, and economics embraced empirical observation, data, experimentation, and probabilistic models, recognizing the limits of axiomatic certainty in complex human systems. We model, we don't deduce theorems.

  3.  **Did People "Lose Their Nerve"?**
      It's less about losing nerve and more about gaining **epistemic humility** in the face of overwhelming evidence of complexity and the failures of grand rationalist schemes. We realized:

      *   **Certainty is Elusive:** The kind of absolute, geometric certainty Hobbes craved is impossible in the messy realm of human affairs. The best we can aim for is well-justified, revisable knowledge based on evidence and reasoned argument, acknowledging uncertainty.
      *   **Power of the Method is Limited:** Deduction is powerful *within* a defined axiomatic system (like math or logic). But **defining the initial axioms for society is itself a political and ethical act**, not a neutral geometric starting point. Whose definitions count? Whose view of "human nature" prevails?
      *   **The Danger of False Certainty:** Pretending to have deduced the One True Answer can be incredibly dangerous, shutting down debate, justifying oppression, and ignoring the lived experiences and values of others. Hobbes' own system justified absolutism.

  **In Conclusion:**

  Hobbes' Euclidean ambition was brilliant, audacious, and understandable given his context and the chaos he witnessed. His *desire* for rigor remains vital. **However, the deeper reason axiomatic deduction doesn't work for ethics/politics like it does for math is the fundamental difference in subject matter.** Math deals with necessary truths in abstract, closed systems. Ethics and politics deal with contingent truths, conflicting values, irreducible complexity, and historical emergence in open, dynamic systems. We haven't "lost our nerve"; we've (mostly) learned that the tools of geometry, while inspiring, are fundamentally inadequate for the task. The quest for rigor continues, but it takes different forms: clarity of concepts, logical consistency *within frameworks*, empirical grounding, and open, democratic deliberation about values and trade-offs – a much messier, but arguably more honest, kind of "proof." Think more Rawls' "reflective equilibrium" (testing principles against intuitions and vice-versa) than Hobbes' geometric deduction. The dream of certainty persists, but the reality demands a different toolkit.
