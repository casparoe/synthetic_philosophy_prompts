  ## The Unflinching Gaze: Anscombe, Truman, and the Unforgivable Calculus

  Your grandfather's story cuts to the heart of a moral chasm that remains profoundly unsettling. Elizabeth Anscombe's opposition to Truman's honorary degree wasn't merely dissent; it was a meticulously argued indictment based on a moral philosophy that refuses to bend to consequences. To understand her position, and whether it withstands the "saved your grandfather" defense, we must delve beyond the caricatures and confront the starkness of her reasoning.

  **Reconstructing Anscombe's Core Argument:**

  Anscombe, drawing deeply on Aristotelian-Thomistic natural law tradition and the doctrine of double effect (DDE), built her case on a foundational principle:

  1.  **Absolute Prohibition of Intentional Killing of the Innocent:** This is non-negotiable. Innocent civilians, by definition non-combatants not directly participating in hostilities, possess an inviolable right to life. Deliberately choosing to kill them is *murder*, intrinsically evil, and *never* morally permissible, regardless of the ends sought. It violates the fundamental good of justice and the sanctity of innocent human life.

  2.  **Distinguishing Intention from Foresight (The Crux of DDE):** This is where Anscombe parts dramatically with utilitarianism. The DDE allows that an action with both good and bad effects *might* be permissible if:
      *   **a) The action itself is good or neutral.**
      *   **b) The *intended* effect is the good one.**
      *   **c) The bad effect is not intended, but merely *foreseen* as a side-effect.**
      *   **d) There is a proportionate reason for permitting the foreseen bad effect.**

  3.  **Application to Hiroshima and Nagasaki:**
      *   **The Action:** Dropping atomic bombs on entire cities.
      *   **The Intended Effect:** Anscombe argued forcefully that the *intended* effect was the mass killing of civilians to break Japanese morale and force surrender. The cities themselves were the targets, chosen precisely for their civilian populations and infrastructure. Military targets were secondary or coincidental.
      *   **The Foreseen Bad Effect:** The death of non-combatants wasn't an unfortunate side-effect; it was the *primary mechanism* of the intended outcome (surrender through terror). Therefore, it *was* intended.
      *   **Proportionality:** Irrelevant. Because the killing of innocents was intended, the act was intrinsically evil. No calculation of lives saved (even if true) can justify an intrinsically evil means. You cannot do evil that good may come.

  4.  **Rejecting the "Lesser Evil" Defense:** Anscombe utterly rejected the utilitarian argument ("it saved more lives overall"). For her, this reasoning fundamentally misunderstands morality. Choosing a gravely immoral act (mass murder of innocents) because you *foresee* it preventing a *different* evil (a bloody invasion) is still choosing evil. It corrupts the moral agent and violates absolute prohibitions. Morality isn't a ledger sheet where lives cancel out; some acts are simply forbidden.

  5.  **The Charge Against Truman:** As the decision-maker who authorized these bombings with the clear understanding of their effect on civilians, Truman, in Anscombe's view, bore direct responsibility for mass murder. Honoring him with a degree was thus a public endorsement of this act, a betrayal of the university's duty to uphold fundamental moral principles.

  **Confronting the "But It Saved More Lives" Defense:**

  This is the most potent counter-argument, deeply personal in your case. Let's present it strongly and see how Anscombe's framework responds:

  *   **The Defense:** Operation Downfall, the planned invasion of Japan, projected catastrophic casualties. US estimates ranged from hundreds of thousands to over a million Allied casualties, and millions of Japanese military *and civilian* deaths (from conventional bombing, naval blockade, famine, and brutal ground combat). The bombs, by forcing surrender without invasion, allegedly saved far more lives overall – including potentially your grandfather's and, by extension, your own existence. Choosing the bombs was thus the *lesser evil*, preventing a far greater tragedy. Truman made the agonizing but necessary choice to save lives.

  *   **Anscombe's Rebuttal (Within Her Framework):**
      1.  **The Intentionality is Fatal:** The defense doesn't touch Anscombe's core point. *Even if* the casualty projections were accurate and the bombs *did* avert a greater loss of life, it doesn't change the *nature* of the act committed at Hiroshima and Nagasaki. Deliberately incinerating hundreds of thousands of non-combatants remains mass murder, an intrinsic evil. Saving lives *by* committing murder is morally bankrupt.
      2.  **Questioning the Necessity:** Anscombe (and others) argued the "necessity" was questionable. Was a demonstration on an uninhabited area truly exhausted? Was the blockade and continuation of conventional bombing not already crippling Japan? Was the Soviet entry into the Pacific theater not a significant factor? Did the Japanese government's internal debates show movement towards surrender *before* the bombs? If viable alternatives existed that didn't require mass murder, the "necessity" defense crumbles, even on consequentialist grounds.
      3.  **The Slippery Slope:** Accepting the "lesser evil" justification for mass murder sets a terrifying precedent. Who defines "necessity"? Who calculates which lives are worth sacrificing? If killing 200,000 civilians saves 500,000 soldiers *today*, what stops leaders from using similar logic *tomorrow* in vastly different circumstances? Anscombe saw absolutes as essential bulwarks against such catastrophic moral erosion.
      4.  **The Nagasaki Problem:** The second bomb, dropped just three days after Hiroshima with even less time for Japan to process the first event, is exceptionally difficult to justify even on consequentialist grounds. It severely weakens the "it was the only way" argument and strengthens the case for intentional terror.

  **Who Wins? The Verdict:**

  This demands the commitment you asked for. While acknowledging the immense complexity and Truman's agonizing position, **Anscombe's core moral logic prevails on the specific question of the intrinsic wrongness of the atomic bombings.**

  *   **Why Anscombe Wins (Philosophically):** Her argument is philosophically rigorous and internally consistent. The distinction between intended and foreseen effects, while sometimes challenging to apply, is crucial for prohibiting the direct targeting of innocents as a *method*. The bombings of Hiroshima and Nagasaki clearly intended the destruction of the cities and their inhabitants as the means to shock Japan into surrender. This crosses the line into intentional killing of non-combatants, which is murder. The prohibition against murdering the innocent is a foundational pillar of a civilized ethic, arguably more important than any single calculation of lives saved, precisely because abandoning it opens the door to unimaginable horrors justified by "necessity." Truman's authorization *was* a decision to commit mass murder, however horrific the alternative might have been.

  *   **The Limits of the Victory (Practically & Historically):**
      *   **The Agony of the Alternative:** The projected invasion casualties were horrifyingly real. Truman and his advisors genuinely believed they faced a choice between two monstrous options. The psychological weight of ending the war and saving Allied lives cannot be dismissed.
      *   **Uncertain Counterfactuals:** We cannot *know* for certain what would have happened without the bombs. Would Japan have surrendered before November? Would the blockade/Soviet entry have sufficed? Would the invasion have been as bloody as projected? History is not a lab experiment. This uncertainty weakens the absolute certainty of *both* positions but doesn't invalidate Anscombe's judgment on the act itself.
      *   **Nagasaki:** The second bombing is indefensible even on consequentialist grounds and severely damages the "necessity" argument.
      *   **The Verdict is on the Act, Not Necessarily the Man:** Condemning the *decision* as morally wrong doesn't necessarily equate to condemning Truman as uniquely monstrous. He operated under immense pressure, with imperfect information, and within the brutal context of total war. But Anscombe's point is that such circumstances cannot absolve one from the fundamental moral law against murder.

  **Conclusion:**

  Elizabeth Anscombe forced the world to look unflinchingly at the nature of the atomic bombings, stripping away the comforting veil of utilitarian calculation. Her argument compels us to recognize that intentionally vaporizing cities full of non-combatants is mass murder, an intrinsic evil that cannot be washed clean by even the most compelling predictions of lives saved elsewhere. While the specter of Operation Downfall and the lives saved (including your grandfather's and, by extension, your own) presents a heart-wrenching counter-narrative, it does not, within the framework of absolute moral prohibitions, justify the chosen means. Truman made a decision that falls under Anscombe's definition of murder. Honoring him for it, she argued, was a profound moral failure.

  The tragedy lies in the brutal reality that the "right" moral choice (refusing to commit mass murder) might have led to consequences arguably *more* horrific in scale – a war of annihilation on the Japanese homeland. This is the true, unbearable weight of that moment in history. Anscombe forces us to confront the possibility that sometimes, there are no morally clean choices, only choices between different kinds of profound evil. Her victory is a philosophical one: she correctly identified the intrinsic wrong of the act itself. But it is a victory that offers little solace, leaving us with the chilling realization that your grandfather's survival, and your existence, may be rooted in an unforgivable crime. The ethical scar remains.
