  *scribbles mental list* The breakdown happens in at least five ways: (1) When Alice's information advantage lets her exploit Bob, that's negative-sum redistribution. (2) Public information can destroy valuable private signals - like herding in markets. (3) Some info induces costly defensive actions (arms races in privacy protection). (4) Processing costs multiply when everyone must analyze the same data. (5) Strategic disclosure incentives mean "free" info isn't actually free if disclosers incur costs.

