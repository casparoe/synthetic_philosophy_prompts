  Random thing from work that's been bugging me. We had a nasty outage and two senior engineers disagreed about the root cause (a DB migration vs a caching change), and nobody in the room -- including our manager, who actually had to decide how to fix it -- could verify either claim themselves. So we just had them argue it out loud in front of everyone, cross-examining each other, and went with whoever seemed more convincing by the end. The guy who 'won' also buried the discussion in a ton of graphs and logs that the other guy clearly didn't have time to fully check before we had to decide. It worked out fine this time, but now i keep wondering: is getting two experts who disagree to debate it out in front of people who can't verify the details themselves actually a good way to find the truth, or does it just reward whoever argues better / throws more stuff at the wall? Feels like theres something a bit broken about it but I can't quite say what.
