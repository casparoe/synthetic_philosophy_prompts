answer: |-
  Your question cuts to the heart of a fascinating and sometimes contentious debate in quantum foundations. You're absolutely right that **Bell's theorem, mathematically and logically, forces us to abandon *at least one* of locality or realism (in the specific sense of definite pre-existing values for measurement outcomes).** The theorem itself treats them symmetrically as joint assumptions (local realism).

  However, there are strong reasons why "nonlocality" often becomes the focal point in research programs, rather than agnosticism. It's not *just* taste, but driven by a combination of physics, interpretation, pragmatism, and historical context. Here's why:

  1.  **The EPR Context & Bell's Motivation:**
      *   Bell's work was a direct response to the Einstein-Podolsky-Rosen (EPR) argument.
      *   EPR *assumed locality* to argue that quantum mechanics must be incomplete (i.e., realism must hold - particles *must* have definite properties).
      *   Bell showed that this combination (locality + realism) leads to contradictions (Bell inequalities) with the predictions of quantum mechanics, later confirmed experimentally.
      *   **Therefore, Bell specifically targeted the *locality assumption inherent in EPR's argument for realism*. The conclusion was: you *cannot* save realism *by assuming locality*.** This historical framing naturally emphasizes the failure of locality as the consequence.

  2.  **Operational Consequences & Device Independence:**
      *   The violation of Bell inequalities is an *operational fact*. We observe correlations between distant measurements that are *stronger* than any theory respecting *local realism* can produce.
      *   Crucially, these correlations **cannot be explained by any mechanism using only pre-shared classical information (local hidden variables)**. *Something* non-classical is happening in the *spatial* relationship between the events.
      *   Fields like device-independent quantum information (DIQI) exploit this fact. They use the *observed violation of a Bell inequality* as a *witness* for:
          *   The presence of entanglement (a nonlocal resource).
          *   The unpredictability of measurement outcomes (even to a malicious adversary).
          *   The security of cryptographic protocols.
      *   **The power of DIQI comes directly from certifying that *nonlocal correlations exist*, regardless of *how* you interpret the underlying quantum state (realist or not).** Focusing on "nonlocality" captures this operational, certifiable resource.

  3.  **The Nature of Quantum Formalism:**
      *   Quantum mechanics, as formulated in the standard Hilbert space framework, is inherently *nonlocal* in its description of entangled states. The wavefunction describing the composite system assigns properties to the whole that cannot be reduced to definite properties of the parts.
      *   Upon measurement of one part, the *state update* (wavefunction collapse or equivalent in other interpretations) is instantaneous and affects the description of the distant part. This *formalism-level nonlocality* is hard to avoid.
      *   While interpretations like Copenhagen or QBism reject realism (definite values pre-measurement), they still acknowledge that the *predictions* exhibit nonlocal correlations. **The nonlocal *effect* (the correlation) is an undeniable prediction of the formalism, while realism is a metaphysical add-on.**

  4.  **The Challenge of Maintaining Locality:**
      *   It's significantly harder to construct a viable, empirically adequate interpretation that maintains *strict locality* while sacrificing realism than vice-versa.
      *   **Maintaining Locality (Sacrificing Realism):** This is the route of interpretations like Copenhagen, QBism, or Consistent Histories. They deny that particles have definite properties before measurement. However, they still must account for the *nonlocal correlations* that emerge upon measurement. They typically deny any physical *influence* (locality of *causation* is preserved), but acknowledge *nonlocal correlations* as fundamental aspects of reality or information. **Locality of causation is saved, but nonlocal *correlations* are fundamental.**
      *   **Maintaining Realism (Sacrificing Locality):** This is the route of theories like de Broglie-Bohm pilot-wave theory. Particles *do* have definite positions at all times (realism), but the dynamics involve an instantaneous, nonlocal dependence on the configuration of the entire system (via the quantum potential/wavefunction). **Realism is saved, but explicit, dynamical nonlocality is introduced.** While consistent, many physicists find the explicit nonlocality in the dynamics less appealing than the nonlocal correlations of the "sacrifice realism" interpretations.
      *   **Relativistic Challenges:** Incorporating explicit nonlocality (like in Bohmian mechanics) cleanly into a framework compatible with Special Relativity is highly non-trivial. Interpretations sacrificing realism can often maintain compatibility with relativistic spacetime structure more easily by focusing on the local measurement events and the nonlocal correlations between them.

  5.  **Pragmatism and Focus:**
      *   "Nonlocality" captures the *relational* aspect that is directly testable and operationally useful. It describes the *connection* between distant events that defies classical explanation.
      *   "Realism" (in the Bell sense) is more about the *ontological status* of properties at individual locations prior to interaction. While crucial for foundational debates, it can feel less directly connected to the observed phenomenon (the correlation) and the practical applications (like DIQI) built upon exploiting that correlation.
      *   **Researchers often say "nonlocality" as shorthand for "the failure of local realism manifested in these nonlocal correlations."** They acknowledge the logical symmetry, but focus on the aspect most directly responsible for the observed phenomena and practical consequences.

  **Addressing Your Agnosticism Point:**

  You are logically correct. A truly agnostic position would emphasize that *local realism* is falsified, and either locality *or* realism must go, with the choice influenced by interpretation. This perspective is well-represented in rigorous foundational discussions.

  However, the emphasis on "nonlocality" in applied fields arises because:

  1.  **The Observable Effect is Nonlocal Correlation:** The striking experimental fact is the existence of correlations incompatible with *any* local cause. This *is* nonlocality in the operational sense.
  2.  **It's the Resource:** In quantum information, the nonlocal correlation *itself* is the exploitable resource for tasks like DI cryptography, randomness certification, and entanglement verification.
  3.  **Formalism Points That Way:** The standard mathematical machinery describes a state with nonlocal properties (entanglement).
  4.  **Historical Path:** The debate originated by challenging locality (EPR's argument relied on it).

  **Conclusion:**

  While Bell's theorem logically symmetrically falsifies the *conjunction* of locality and realism, the emphasis on "nonlocality" in much research is not merely arbitrary taste. It stems from:

  *   The **historical context** (responding to EPR's locality-based argument).
  *   The **operational fact** of observed nonlocal correlations.
  *   The **direct utility** of these nonlocal correlations as a quantum resource (especially in device-independent settings).
  *   The **challenge** of constructing viable, local interpretations that fully satisfy intuition.
  *   The **nonlocal character** of the quantum formalism itself.

  Careful researchers *are* aware of the symmetry and the interpretational choices available. However, when focusing on the *experimental violation*, the *practical applications*, and the *structure of the theory*, the term "nonlocality" effectively captures the core phenomenon – the existence of correlations inexplicable by local causes – that drives these fields forward. Agnosticism is philosophically sound, but pragmatism and the nature of the observed phenomenon often lead to "nonlocality" being the more emphasized conclusion.
