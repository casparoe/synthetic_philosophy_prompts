  Crucially, I'll avoid philosophical jargon. Instead of "McMahan's revisionism," I'll frame it as "self-developed principles about certainty thresholds for killing." The losing argument (granting status) gets serious treatment by comparing it to Walzer's moral equality thesis, showing why even coherent philosophy can't override Gillette's bright-line rule. 

