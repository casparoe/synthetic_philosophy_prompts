  Next, two-dimensional semantics. The key is distinguishing primary and secondary intensions. For Kripkean necessities like 'water is H2O', the primary intension might be contingent, explaining conceivability. But for zombies, primary intension not being necessary might threaten the argument. The follow-up needs to press on why zombies' primary intension is necessary.

  Then, strong necessities—cases where conceivability and necessity come apart. The philosopher likely denies such necessities as incoherent. The follow-up should ask if physicalism could be such a necessity, testing if their response is question-begging.

  I should also include other relevant topics: the zombie argument's persuasiveness, alternative explanations of conceivability judgments, epistemic vs. metaphysical gaps, and the role of empirical science. Each question needs a follow-up anticipating their response.

