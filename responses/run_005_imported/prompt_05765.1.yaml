answer: |-
  Let's dissect Gongsun Long's "seeking a horse" argument step-by-step, pinpoint the ambiguity in "非" (*fei*), assess if it equivocates, and connect it to the School of Names' core concerns. This passage is a masterclass in semantic boundary-testing.

  **1. Reconstruction of the "Seeking a Horse" Argument: Premises & Senses of "非" (*fei*)**

  Gongsun Long's core argument (after establishing the distinct semantic roles of "horse" [shape] and "white" [color]):

  *   **Premise 1 (Descriptive Observation):** If one seeks a horse (求馬), a yellow horse (黃馬) or a black horse (黑馬) will satisfy the request (可致). *(Sense of "is": Class Membership - A yellow/black horse **is** a horse)*
  *   **Premise 2 (Descriptive Observation):** If one seeks a white horse (求白馬), a yellow horse or a black horse will *not* satisfy the request (不可致). *(Sense of "is not": Class Exclusion - A yellow/black horse **is not** a white horse)*
  *   **Premise 3 (Counterfactual Assumption):** Suppose a white horse *were* the same as a horse (白馬乃馬). *(Sense of "is": Identity - "White horse" = "Horse" as terms/concepts)*
  *   **Premise 4 (Implication of Assumption):** Then what is sought in the two cases (求馬 / 求白馬) would be one and the same thing (所求一也). *(Sense of "is": Identity of Referent/Extension - The set of things satisfying "horse" = set satisfying "white horse")*
  *   **Premise 5 (Implication of Identity):** If what is sought is one and the same, then 'white' would be no different from 'horse' (白與馬無異). *(Sense of "is": Term Identity/Redundancy - "White" adds nothing distinct; "white" = "horse")*
  *   **Premise 6 (Contradiction with Observation):** But Premises 1 & 2 show that yellow/black horses *are* sometimes acceptable (when seeking "horse") and sometimes unacceptable (when seeking "white horse"). Acceptable and unacceptable plainly stand opposed (可與不可，其相非明). *(Sense of "is not": Mutual Exclusivity - The properties "being acceptable for request X" and "being unacceptable for request X" **are not** compatible)*
  *   **Premise 7 (Explanation of Contradiction):** Therefore, the yellow/black horse *is* a horse (有馬) but *is not* a white horse (非有白馬). *(Sense of "is": Class Membership; Sense of "is not": Class Exclusion)*
  *   **Conclusion:** Hence, "a white horse is not a horse" (白馬非馬) is established. *(Crucially, Gongsun Long *infers* the strong sense here based on the argument above: Class Exclusion - A white horse **is not** [an instance of] a horse)*

  **2. The Equivocation Charge & Surviving Semantic Point**

  *   **The Slide:** The equivocation happens between **Premise 3/4/5** and the **Conclusion**.
      *   Premise 3 assumes "white horse" *is* (identical to) "horse" (in the strong, extensional identity sense: the sets are identical).
      *   Premises 4 & 5 show the *absurd consequences* of this strong identity assumption ("white" becomes redundant, yellow horses satisfy "white horse" requests).
      *   Premises 1, 2, 6, & 7 demonstrate the *falsity* of the strong identity assumption by showing the sets *aren't* identical (yellow horses are in the "horse" set but not the "white horse" set).
      *   **The Leap:** From proving that "white horse" and "horse" are **not identical terms/concepts** (weak "非": term non-identity) and refer to **non-identical sets** (moderate "非": extensional non-identity), Gongsun Long *concludes* that "a white horse is not a horse" in the **strong sense of class exclusion** (strong "非": an individual white horse is not an instance of the class "horse"). Premise 7 (yellow horse *is* horse but *is not* white horse) subtly primes this leap by using "非" for class exclusion regarding white horses, which is then misapplied in the conclusion to the class "horse" itself.
  *   **Guilty of Wordplay?** Yes, there is equivocation. Gongsun Long exploits the ambiguity of "非" (*fei*) to derive a shocking, seemingly paradoxical conclusion ("this specific horse isn't a horse!") from the undeniable premise that the *terms* "white horse" and "horse" have different meanings and referents. Xunzi's criticism of the School of Names for "playing with words to create chaos" (以名亂實) hits here. The argument *feels* like sophistry because the strong conclusion contradicts common sense and linguistic usage.
  *   **Surviving Semantic Point:** Despite the equivocation, a genuine and profound point survives:
      *   **Compound Terms Create New Categories:** "White horse" isn't *just* "horse" plus an adjective. It creates a new, distinct category with stricter criteria. The meaning of "white horse" isn't simply the sum of "white" and "horse"; it's a new compound concept. You cannot deduce the properties of "white horse" solely from knowing "horse" and "white" separately. This challenges the assumption that general terms are simply labels for pre-existing, stable realities.
      *   **The Specificity of Reference:** The "seeking" scenario brilliantly highlights how the *specificity* of a term determines what satisfies it. "Horse" has a broader extension than "white horse." Referring successfully requires matching the *precise* compound name to the actuality. Using the wrong compound term ("horse" instead of "white horse") fails to pick out the intended object *in a context demanding specificity*.

  **3. Connection to the School of Names' Larger Project: Names (名) and Actualities (實)**

  This is **absolutely not a freestanding stunt**. It's a core move within the School of Names' project of rigorously examining the relationship between language (名) and reality (實):

  *   **The Problem:** How do names correspond to actualities? Is the relationship stable and one-to-one? Common language often assumes it is ("a white horse is obviously a horse!").
  *   **Gongsun Long's Intervention:** The White Horse Dialogue exposes a fissure in this assumption. It shows:
      1.  **Names have Structure:** Compound names ("white horse") are not simple labels; they combine distinct naming functions ("names shape," "names color").
      2.  **Compounding Creates New Actualities:** The compound name "white horse" picks out a *different actuality* (實) than the simple name "horse." The actuality of "horseness" (shape) is insufficient to capture the actuality demanded by "white horseness" (shape *and* color).
      3.  **Precision Matters:** Using an insufficiently specific name ("horse") fails to refer correctly to a more specific actuality ("white horse") in contexts demanding that specificity. This highlights the potential for referential failure when names and actualities are mismatched.
      4.  **Challenging Common Sense:** It forces us to question automatic inferences based on class inclusion ("A is a kind of B, therefore A is B"). Gongsun Long argues that the specific compound name defines a unique actuality not fully captured by the broader name.
  *   **Link to Hui Shi & Larger Preoccupations:** Hui Shi's paradoxes (like "I set out for Yue today and arrive yesterday") similarly challenge conventional assumptions about time, space, and identity by exposing ambiguities or tensions in language and concepts. The White Horse Dialogue focuses specifically on the logic of classification and predication. Both share the School's core aim: to demonstrate that language is not a transparent window onto reality but a complex system whose structure needs careful analysis to avoid confusion and ensure precise correspondence between names and actualities. They are exploring the *logic* underlying naming and reference.

  **Walking into Section:**

  *   **Mechanics:** Focus on the "seeking" test. Gongsun Long uses a practical scenario (what satisfies a request) to demonstrate a logical point about term identity and extension. The key move is showing that substitutability fails ("horse" accepts yellow/black; "white horse" rejects them), *proving* the terms aren't identical. The equivocation is the leap from "these terms aren't identical and have different extensions" to "therefore an instance of the narrower term isn't an instance of the broader term."
  *   **Defense:** While guilty of equivocation for the strong conclusion, emphasize the *positive* semantic insight: compound terms like "white horse" create genuinely new categories/referents with stricter criteria, distinct from the simple terms they contain. The argument powerfully demonstrates the *specificity* required for accurate naming.
  *   **Big Picture:** Frame it as Gongsun Long using a seemingly paradoxical example to investigate a fundamental question: How does combining names create new meanings and new referents? How does this process relate to the actualities we encounter? It's a logical probe into the very mechanism of how language hooks onto the world, a central concern for the School of Names. His point isn't ontological (denying white horses are animals) but semantic/logical (challenging how names compound and refer). He's showing that "white horse" isn't just "horse" plus a modifier; it's a new name demanding a new actuality.

  This dissection reveals the argument not as mere sophistry, but as a sophisticated, albeit flawed, exploration of semantic compositionality and reference – core issues in the School of Names' quest to rectify names and actualities.
