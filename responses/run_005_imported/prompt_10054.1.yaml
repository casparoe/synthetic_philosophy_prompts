answer: |-
  Here's a joke crafted specifically for the object-given/state-given distinction, avoiding the demon trope:

  **Setting:** A pretentious modern art gallery opening. Two philosophers, ALICE and BERTRAM, stand before a piece that looks suspiciously like a dusty, slightly dented fire extinguisher mounted on the wall. A large red "SOLD" sticker is on its side.

  **ALICE:** (Squinting at the label) "It says... '*Untitled Safety Apparatus (Meditation on Imminent Conflagration)*'. Sold for £250,000. Bertram, am I missing something? Is there profound beauty in this extinguisher I'm failing to perceive?"

  **BERTRAM:** (Leaning in conspiratorially, glancing nervously at the imposing gallery owner nearby) "Shhh! Not beauty, Alice. *Fittingness*. Or rather, the *appearance* of it. See the owner over there? Griselda Von Snoot? She *detests* people who don't 'get' her curated vision. If she senses our disdain... we'll be blacklisted from *every* opening in Mayfair. Forever. No more free champagne."

  **ALICE:** (Eyes wide with dawning horror) "So... you're saying we need to... *genuinely admire*... this fire extinguisher? To avoid social exile?"

  **BERTRAM:** (Nodding vigorously, forcing a look of rapt contemplation onto his face) "Exactly! We must cultivate a sincere pro-attitude! Feel the profound *statement* of its functional mundanity! Marvel at its latent potential for... extinguishing! It's the *only* prudent course of action!"

  **ALICE:** (Staring intensely at the extinguisher, brow furrowed in fierce concentration, then whispers) "...Bertram... I think I'm starting to *get* it... the bold industrial aesthetic... the raw, utilitarian honesty... it's... it's actually... quite..."

  **BERTRAM:** (Interrupting sharply, still watching Griselda) "No, Alice! Don't confuse the *reason*! Your sudden appreciation for its 'industrial aesthetic'? That's just the *state-given* reason talking – the fear of Griselda's wrath! It doesn't make admiration *fitting*! The *object-given* reasons – the actual properties of this dented canister – are still entirely inadequate for genuine aesthetic valuation! Keep *pretending* the attitude is fitting because of the *consequences*, but don't fall for the WKR trap and think it suddenly *is* fitting! Now, smile and nod like you grasp its profound commentary on... uh... pressurized fluids!"

  **Punchline:** Alice continues staring, looking slightly ill. "Right. So... admire fervently for the *wrong* kind of reason. Got it. Though... honestly, Bertram? Knowing it could actually put out a fire *is* making it seem slightly more valuable than that saucer of mud we discussed last week..."

  ---

  **Why it works for the distinction:**

  1.  **Clear State-Given Reason:** The threat of social exile (Griselda's blacklist) is a classic state-given reason. It makes it *advantageous* for Alice and Bertram to *have* a pro-attitude (admiration) towards the extinguisher.
  2.  **Object-Given Reasons Highlighted (and Lacking):** Bertram explicitly points out the *actual* properties of the object (dented canister, utilitarian function) are insufficient for genuine aesthetic appreciation (the fitting attitude). Alice's initial attempt to find object-given reasons ("industrial aesthetic") is revealed as likely just a *response* to the state-given pressure, not a discovery of genuine fittingness.
  3.  **WKR Trap Avoidance:** Bertram's frantic warning to Alice ("Don't confuse the reason!") directly addresses the core problem: mistaking the state-given reason (avoiding blacklist) for an object-given reason that makes the attitude *fitting*. He insists she must maintain the distinction internally.
  4.  **Humorous Irony:** The final twist ("knowing it could actually put out a fire") subtly introduces a *different*, perhaps slightly more plausible, *potential* object-given reason (utility/safety), highlighting how tricky pinning down "genuine" fittingness can be, while still contrasting with the purely social state-given reason. The reference to the saucer of mud ties it back to the classic example without rehashing it.
  5.  **Turns on the Distinction:** The humor comes entirely from Bertram's pedantic insistence on maintaining the philosophical distinction *while* under social pressure, and Alice's struggle to comply without committing a metaethical error. The punchline isn't just "philosophers are silly," but "applying this specific distinction in a ridiculous real-world scenario is inherently awkward and funny."

  Hope this lands well in your seminar! It captures the essence of the WKR problem without relying on the demon.
