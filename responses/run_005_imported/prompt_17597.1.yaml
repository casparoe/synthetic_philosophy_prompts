  ## Memorandum: Cause of Beatification and Canonization of Servant of God Sr. Agnieszka Radomska

  **To:** Members of the Diocesan Historical Commission for the Cause of Sr. Agnieszka Radomska
  **From:** Rev. Fr. Tomasz Nowak, J.C.L., Chair
  **Date:** 23 October [Year]
  **Subject:** Deliberation on the Forwarding of the *Positio* in Light of New Archival Evidence (Convent Correspondence, 1942-1944)
  **Priority:** Urgent – Pre-Vote Consideration

  Esteemed Consultors,

  Tomorrow we reach a critical juncture in our sacred duty concerning the Cause of Sr. Agnieszka Radomska. The recovery of the convent’s wartime correspondence has irrevocably altered the landscape of our inquiry. It compels us to confront a profound theological and canonical challenge that strikes at the heart of our assessment of heroic virtue.

  For years, the Cause has progressed on the compelling and undisputed testimony of Sr. Agnieszka’s extraordinary charity, fortitude, and composure in the face of mortal danger – virtues manifested in her sheltering of children targeted by a brutal occupying regime. The new documents, however, reveal not merely prudent silence or technically truthful evasion when confronted by officials seeking specific children, but **deliberate, detailed fabrications**: false names, invented parentage, and a spurious quarantine for scarlet fever, all deployed without hesitation to shield the innocent.

  Drs. Kowalski and Petrov (Consultors 3 & 5) have raised a formidable objection we cannot dismiss: **How can actions the Church’s magisterium consistently teaches are intrinsically evil – namely, deliberate falsehoods – simultaneously constitute evidence of heroic virtue?**

  They invoke a tradition of exceptional clarity and weight:
  1.  **St. Augustine:** "*Mendacium est enuntiatio cum voluntate falsum enuntiandi.*" (A lie is a false statement made with the will to deceive.) He argued this is *always* sinful (*mendacium est semper peccatum*), regardless of intention or consequence. Saving a life through a lie, for Augustine, saved the body but damned the soul.
  2.  **St. Thomas Aquinas (STh II-II, Q. 110):** Building on Augustine, Aquinas defines lying as speech contrary to the mind. He states plainly that "every lie is a sin," as it is an offense against truth and consequently against justice. While he distinguishes the gravity of lies (officious, jocose, pernicious), he denies any lie can be without sin. The intention to achieve a good end does not justify the sinful means.
  3.  **Catechism of the Catholic Church (CCC 2483, 2485):** "**A lie consists in speaking a falsehood with the intention of deceiving.**... **Lying is the most direct offense against the truth.** To lie is to speak or act against the truth in order to lead someone into error." It further states, "**By its very nature, lying is to be condemned.**" The purpose served does not nullify its intrinsic wrongness.

  Kowalski and Petrov argue, forcefully and with textual fidelity, that Sr. Agnieszka’s fabrications, however noble her ultimate aim, fall squarely within this condemned category. They contend that to present these acts *as evidence for heroic virtue* is logically incoherent within the Church's own framework. If the acts are sinful, they cannot be virtuous, let alone *heroically* virtuous. To include them as such in the *positio*, they argue, risks undermining the theological integrity of the entire beatification process and misrepresenting the Church’s doctrine on a fundamental moral issue. **They force us to ask: Could the Church, in good conscience, hold up as a model of sanctity someone whose cause relies partly on actions it explicitly teaches are always wrong?** This is not a minor scruple; it is a challenge rooted in the bedrock of Catholic moral theology. We must acknowledge the unsettling possibility that, on the strictest reading of this tradition, they are correct.

  **The Dilemma for the Cause:**

  1.  **The Immense Good Achieved:** There is no question Sr. Agnieszka saved lives. Her courage in the face of profound evil is undeniable. To set aside her cause over these fabrications feels, intuitively and pastorally, like a devastating failure to recognize genuine, self-sacrificing heroism performed under unimaginable duress.
  2.  **The Unyielding Doctrine:** Yet, the theological tradition cited is not a minor opinion; it is mainstream, magisterial teaching consistently upheld. It offers no explicit exception for life-saving lies. Appeals to "mental reservation" or "strict truthfulness under interrogation" seem strained or inapplicable to the elaborate, premeditated fictions documented. Casuistry has its limits before such clear-cut inventions.

  **Options Before Us & My Recommendation:**

  Our task is not to achieve a comfortable consensus, but to assess the Cause's readiness for the *positio* based on the evidence *and* its coherence with Church teaching. We have three viable paths:

  1.  **Forward the Cause as Currently Framed:** Include the fabrications as further proof of heroic charity and fortitude, arguing the circumstances (Nazi persecution, protection of innocents) render the strict application of the lying doctrine inapplicable or that the good achieved *defines* the virtue here.
      *   **Argument For:** Honors the totality of her sacrifice and the reality of extreme moral conflict.
      *   **Argument Against:** Directly contradicts established magisterial teaching without clear theological justification. Risks the *positio* being rejected, or worse, approved while implicitly contradicting doctrine, causing scandal or confusion. Fails to adequately address Kowalski/Petrov's core objection on principle.
      *   **My Assessment:** This option ignores the theological weight of the objection. It assumes the desired outcome (beatification) must override the doctrinal conflict, rather than resolving it. It is the path of least resistance but potentially the greatest long-term risk to the Cause's credibility and the process's integrity.

  2.  **Pause the Cause Pending Formal Theological Opinion:** Suspend forwarding the *positio*. Request a formal *votum* (opinion) from the Congregation for the Doctrine of the Faith (CDF), or a panel of eminent moral theologians, specifically on whether actions defined as lies by Augustine/Aquinas/CCC, undertaken *solely* to save innocent lives from unjust persecution, can be considered compatible with the manifestation of heroic virtue in a Cause for Beatification.
      *   **Argument For:** Recognizes the gravity and novelty of the theological challenge. Places the decision where it doctrinally belongs – with the Church's highest teaching authority. Demonstrates our commission's prudence and fidelity. Provides clarity for *this* Cause and potentially for future similar cases.
      *   **Argument Against:** Will cause significant delay (likely years). May be perceived as lack of confidence or an attempt to bury the Cause. Outcome is uncertain (CDF could rule against the Cause).
      *   **My Assessment:** This is the most intellectually honest and procedurally sound course. It directly confronts the problem Kowalski and Petrov have rightly identified without pre-judging the answer. It respects the magisterium by seeking its guidance on a point where our commission lacks definitive authority. While delay is painful, proceeding while ignoring such a fundamental objection risks a far greater setback later. **This is my strong recommendation.**

  3.  **Reframe the Record:** Forward the *positio* but significantly narrow the scope of Sr. Agnieszka's heroism presented. Downplay or omit detailed discussion of the fabrications, focusing solely on her sheltering actions, her courage in the face of danger, and her charity *as evidenced by other means* (testimonies of survivors regarding care, her demeanor, etc.). Present the fabrications only as necessary context, not as virtuous acts in themselves.
      *   **Argument For:** Potentially avoids the direct doctrinal conflict by not presenting the lies *as virtuous*. Allows the Cause to proceed based on undisputed virtues.
      *   **Argument Against:** Requires suppressing significant, newly uncovered evidence central to her actions. Feels intellectually dishonest and historically incomplete. The fabrications are inextricably linked to her protective acts; separating them artificially diminishes the full reality of her choices and the pressure she faced. The Congregation for Saints will have the full archive anyway. Kowalski/Petrov would likely see this as evasion.
      *   **My Assessment:** This is a compromise that satisfies no one fully and risks appearing disingenuous. It attempts to sidestep the problem rather than solve it and may still face rejection based on the full evidence. It undervalues the very actions that arguably made her protection effective under extreme duress.

  **Conclusion:**

  The path of heroic virtue is rarely simple, and Sister Agnieszka walked it in the valley of the shadow of a profound moral evil. Her courage and charity shine brightly. Yet, Kowalski and Petrov compel us to acknowledge that the light may illuminate a tension within our own tradition. The Church’s teaching on lying is not a minor scruple; it is a commitment to the very foundation of truth and trust upon which society, and our relationship with God, is built. To simply override it, even for the most noble of ends witnessed here, sets a dangerous precedent and undermines the doctrinal coherence the Congregation for Saints must safeguard.

  Therefore, while it pains me to propose delay in honoring this remarkable woman, **I recommend we vote to PAUSE the Cause.** We should formally request a *votum* from the Congregation for the Doctrine of the Faith, presenting the full evidence and the precise theological question: Can deliberate falsehoods, as defined by the consistent tradition from Augustine through the Catechism, undertaken *exclusively* to save innocent lives from imminent, unjust persecution, be considered manifestations of heroic virtue in a Cause for Beatification?

  This is not a rejection of Sister Agnieszka’s sacrifice. It is an act of fidelity – fidelity to the truth of her complex actions, fidelity to the Church’s teaching, and fidelity to the integrity of the beatification process itself. We owe it to Sister Agnieszka, to the Church, and to the truth we serve, to seek clarity from the highest authority before proceeding.

  I urge you to consider this recommendation carefully. Tomorrow, we vote not for convenience, but for conscience and the long-term good of the Cause.

  In Christ the Truth,

  **Rev. Fr. Tomasz Nowak, J.C.L.**
  Chair, Diocesan Historical Commission
  Cause of Sr. Agnieszka Radomska

  ---

  **Why this memo works for your scene:**

  1.  **Takes Dissent Seriously:** It explicitly names Kowalski & Petrov, accurately summarizes their argument using key theological sources (Augustine, Aquinas, CCC), and grants the full weight and logic of their position. Phrases like "formidable objection," "forcefully and with textual fidelity," "unsettling possibility that... they are correct," and "challenge rooted in the bedrock" show genuine engagement.
  2.  **Acknowledges the Conflict's Core:** It doesn't minimize the doctrine or try to wish it away. It states the dilemma starkly: How can intrinsically evil acts be heroic virtue? It frames their argument as potentially correct on principle.
  3.  **Avoids Easy Answers:** It explicitly rejects simply folding the lies into the heroic narrative (Option 1) as ignoring the doctrine, and rejects reframing (Option 3) as dishonest evasion. The recommended pause (Option 2) is presented *because* the dissenters' point is too strong to ignore or override locally.
  4.  **Prioritizes Doctrine Over Desired Outcome:** The memo argues that the *integrity of the process and the teaching* is paramount, even if it delays or potentially jeopardizes the beatification they all likely desire. "Fidelity... to the Church’s teaching, and fidelity to the integrity of the beatification process itself" is the core justification.
  5.  **Father Nowak's Voice:** It sounds like a canon lawyer – precise, referencing sources (J.C.L., *votum*, CDF, magisterium), structuring arguments logically, using formal but clear language. He shows pastoral sensitivity to Sr. Agnieszka's heroism but subordinates it to procedural and doctrinal rigor.
  6.  **Sets Up the Vote:** It clearly outlines the options and makes an unambiguous, argued recommendation, providing the basis for the tense debate and vote in your scene. The dissenters' arguments are now formally on the table and central to the Chair's reasoning.
  7.  **Highlights the Stakes:** It emphasizes that this isn't just about one nun, but about precedent and the coherence of the Church's teachings on morality and sanctity.

  This memo forces the commission (and the reader) to grapple with the uncomfortable truth that sometimes, even the most noble actions might conflict with deeply held principles, and that resolving such conflicts requires more than just good intentions.
