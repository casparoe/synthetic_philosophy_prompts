        - Equal false positive rates (FPR): P(flagged high risk | will not reoffend, race) is equal across race.
        - Equal false negative rates (FNR): P(flagged low risk | will reoffend, race) is equal across race.
    - This is correct. Note that balance in the context of the impossibility result often refers to equal FPR and FNR (or sometimes to predictive parity in terms of positive predictive value, but here it's specified as FPR and FNR).

