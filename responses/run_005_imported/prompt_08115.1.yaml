prompt: |-
  I sit on the discretionary grants committee of a small philanthropic fund that mostly supports fairly conventional global-health work, and this week I have to write the recommendation on a proposal that reproduces, almost too neatly, an argument I had with a friend just last weekend. She works in quantitative trading and took the hard line on Pascal's mugging: any decision procedure built on subjective expected utility is committed, by its own logic, to paying up whenever the product of stated probability and claimed payoff comes out positive, no matter how small the probability or how outlandish the payoff, and refusing once the numbers get uncomfortable is not a principled objection but a failure of nerve. I pushed back with something like Bostrom's leverage penalty -- the more good a claim says you personally are positioned to do, the more it should be discounted, since almost no one is ever actually in a position to swing outcomes for billions of people -- but she kept asking why the discount should track the size of the claim rather than just being a story we tell ourselves to avoid an uncomfortable conclusion, and I didn't have a clean answer. We left it there.

  Now the committee is facing a live version of the same problem. A two-person team has applied for a grant that would use roughly 80 percent of this year's discretionary budget to build a wastewater-surveillance protocol meant to catch a specific class of engineered pathogen before it can spread widely enough to end technological civilization. Their own written estimate puts the probability that the protocol is ever the decisive factor in averting such a release at around one in several million, but they argue -- and our technical reviewer confirms the arithmetic checks out once you accept the scale of what's at stake -- that the expected value of preventing that outcome is so large that this single proposal's expected value exceeds every other application combined, including our recurring bed-net and cash-transfer grants, whose effects are far more certain but smaller by many orders of magnitude. Two committee members want to fund it on exactly those grounds and call the rest of us timid; three others want to decline, but for different and not fully compatible reasons -- one repeats my leverage-penalty intuition, one simply says "we don't fund lottery tickets," and one worries aloud that we are all dressing up squeamishness as rigor. I have been asked to draft the memo the committee will actually vote on Thursday.

  Could you write that memo? It should recommend a specific, actionable disposition for the proposal -- fund in full, fund partially, decline, or defer pending some named further step -- together with the reasoning behind it, and it should set out a general criterion the committee could apply to future proposals with this same tiny-probability, enormous-payoff structure, so that we stop improvising case by case. Whichever way you come down, please give a genuinely fair hearing to the strongest version of the losing argument rather than dissolving it into a slogan: both "the expected value swamps everything else, and declining to act on your own numbers once they get large is not rationality, it's superstition" and "a policy of paying out to whoever names the largest number gets exploited without limit" deserve serious engagement before the committee will trust the recommendation.
reasoning: |-
  We are facing a proposal that, by the numbers, has an expected value (EV) far exceeding all other grants combined, despite an extremely low probability of success. The core tension is between two compelling arguments: 
   1. The expected-value argument: If we accept the premises of expected utility theory, we are compelled to fund this proposal because the product of probability and payoff is positive and enormous.
   2. The anti-exploitation argument: A policy that funds proposals with arbitrarily low probabilities and arbitrarily high payoffs is vulnerable to exploitation and may lead to wasting resources on highly speculative projects.

   Additionally, we have the leverage-penalty intuition: the idea that claims of having a pivotal impact on extremely large outcomes should be discounted because it is inherently unlikely that any small actor (like a two-person team) is truly pivotal in such a scenario.

   The memo must make a clear recommendation and set a criterion for future proposals.

   After careful consideration, I recommend that we **decline** this proposal. However, I also recommend that we establish a **new review protocol for high-stakes, low-probability proposals** to be applied in the future, which would include independent assessment of both the probability and the pivotalness of the intervention.

   Reasoning:

   1. **The Leverage Penalty is a Principled Adjustment for Pivotalness**:
      The key flaw in the expected-value calculation is that it assumes the intervention is truly pivotal (i.e., without it, the catastrophic outcome would occur, and with it, the outcome would be averted) and that the intervention is the only possible way to avert the outcome. However, in reality, for events of global catastrophic significance, there are often multiple actors and interventions that could play a role. Moreover, the probability that a small team with a modest grant is the decisive factor is inherently low. This is not merely a psychological discount for large numbers but a recognition of the structure of causality and the distribution of agency in the world.

      We can formalize this by adjusting the expected value calculation to account for the probability that our grant is actually pivotal. Let:
      - P(event) = the probability of the catastrophic event occurring without our intervention.
      - P(averted | intervention) = the probability that the event is averted given our intervention.
      - The incremental probability of aversion due to our intervention is: P(averted | intervention) - P(averted | no intervention).

      The proposal estimates the probability that the protocol is the "decisive factor" at one in several million. However, this estimate does not explicitly consider the baseline probability that the event would be averted by other means. The leverage penalty can be seen as a prior that the probability of being pivotal is much lower than the raw probability of the event occurring, because other factors and actors are likely to be involved.

      Therefore, we should require that future proposals of this kind provide a rigorous justification for the pivotalness of the intervention, including an assessment of the counterfactual (what would happen without the grant). This should be subject to independent review.

   2. **The Problem of Unbounded Claims**:
      If we accept the expected-value argument without adjustment, we open the door to an unlimited number of similar proposals. For instance, someone could propose a project to prevent an even larger catastrophe (e.g., an existential risk with a payoff of trillions of lives saved) with an even lower probability, and the same logic would force us to fund it, potentially crowding out all other work. This is not sustainable and would lead to the fund being exploited by increasingly speculative claims.

      A policy that funds the highest claimed expected value without a principled way to cap the probability discount would inevitably divert resources from known, effective interventions to speculative ones. We must balance the potential for huge payoffs with the need for accountability and the reality that we have a limited budget.

   3. **A Criterion for Future Proposals**:
      We should establish a threshold for the minimum probability of being pivotal that we are willing to consider. This threshold should be set relative to the scale of the claimed impact. Specifically, we can require that the probability of being pivotal (p) must be at least 1/(c * V), where V is the value of the outcome averted (in units of, say, lives saved or disability-adjusted life years averted) and c is a scaling constant that we choose to reflect our risk tolerance and the opportunity cost of the grant budget.

      Alternatively, we can cap the maximum expected value we assign to any single outcome by applying a leverage penalty that increases with the claimed impact. For example, we might use a discount factor of the form 1/(1 + k * V), where k is a small constant, to reduce the expected value for outcomes of extreme magnitude. This would prevent unbounded claims from dominating the budget.

      However, the most practical approach is to set a minimum acceptable probability for the grant being pivotal. For instance, we might set a rule that we do not fund proposals where the probability of being pivotal is less than 1 in 100,000 (or some other threshold) unless there is extraordinary evidence and consensus among independent experts that the intervention is uniquely positioned and the threat is credible.

   4. **The Current Proposal**:
      The stated probability of being pivotal (around one in several million) is too low to meet a reasonable threshold. Moreover, the technical reviewer only confirmed the arithmetic conditional on accepting the pivotalness estimate and the scale of the stakes. They did not independently verify the pivotalness. Therefore, we do not have sufficient evidence to override the leverage penalty intuition.

   5. **Addressing the Counterarguments**:
      - To the expected-value proponents: We agree that expected value is a fundamental tool and that we must be willing to act on large expected values. However, we must also recognize that our estimates of the probabilities and the pivotalness are subject to error and manipulation. The leverage penalty is a safeguard against overestimating our role in events of extreme magnitude. We are not shying away from the numbers but adjusting them for a more realistic assessment of our agency.
      - To the "lottery ticket" objection: While we do fund some projects with uncertain outcomes, we must balance the portfolio. We have a responsibility to use our funds effectively, and that includes avoiding projects with such low probabilities that they are effectively indistinguishable from zero given the limitations of our modeling and the existence of other, more certain opportunities.

   6. **Recommendation**:
      - Decline the current proposal.
      - Establish a working group to draft a formal policy for high-stakes, low-probability proposals, including:
          a. A requirement for independent assessment of both the probability of the threat and the pivotalness of the intervention.
          b. A minimum probability threshold for pivotalness (to be determined, but perhaps in the range of 1 in 100,000 to 1 in 1,000,000) below which we will not fund without extraordinary evidence and consensus.
          c. A cap on the percentage of the annual budget that can be allocated to any single high-stakes, low-probability proposal (e.g., no more than 20%).
      - Defer any similar proposals until the policy is in place.

   This approach allows us to remain open to high-impact opportunities while protecting against exploitation and ensuring that the majority of our resources go to interventions with more robust evidence of effectiveness.

   Draft Memo:

  ---

  **To:** Discretionary Grants Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation on Wastewater-Surveillance Proposal and Framework for Future High-Impact/Low-Probability Proposals  

  **Proposal Under Consideration:**  
  A request for [Amount], representing approximately 80% of this year's discretionary budget, to develop a wastewater-surveillance protocol aimed at detecting a specific class of engineered pathogens to prevent a global catastrophic event.

  **Recommendation:**  
  We recommend **declining** the proposal in its current form. However, we also recommend establishing a formal review framework for future high-impact, low-probability proposals to ensure they are evaluated consistently and rigorously.

  **Detailed Reasoning:**  

  1. **Expected Value Calculation and Its Limits:**  
     The proposal's expected value (EV), calculated as the product of the stated probability of being pivotal (approximately 1 in several million) and the value of averting a global catastrophe, is indeed enormous. If taken at face value, it exceeds the combined expected value of all other proposals. However, we must critically examine the assumptions:

     - **Pivotalness and Counterfactuals:** The probability that this specific intervention would be the decisive factor in averting a catastrophe is extremely low. It requires both that the catastrophic event would occur without the intervention and that no other measure would avert it. Given the global nature of such threats, it is likely that multiple actors and systems (including other surveillance efforts, public health responses, or sheer luck) would play a role. The leverage penalty is a principled adjustment for the inherent improbability of being pivotal in such a large-scale outcome. Without strong evidence that this team is uniquely positioned and that the threat is imminent and unavoidable without their protocol, we cannot accept the pivotalness estimate.

     - **Unbounded Claims:** If we accept the EV argument without adjustment, we create an incentive for increasingly speculative proposals. Each could claim a lower probability but an even larger payoff, forcing us to divert our entire budget to the most extreme claim. This is not sustainable and would undermine our core mission of funding proven, effective interventions.

  2. **Opportunity Cost:**  
     Allocating 80% of our budget to this proposal would require defunding or reducing our support for ongoing programs with demonstrated effectiveness (such as bed-net distributions and cash transfers). These programs save lives with high certainty. While the potential upside of the wastewater proposal is immense, the low probability of success (and the even lower probability of being pivotal) means that the opportunity cost is too high.

  3. **A Framework for Future Proposals:**  
     To handle similar proposals in the future, we recommend the following:

     - **Independent Assessment:** Require an independent, expert review of both the probability of the threat and the pivotalness of the intervention, including an analysis of counterfactuals and alternative interventions.

     - **Minimum Probability Threshold:** Set a minimum acceptable probability of being pivotal (e.g., 1 in 100,000) for any proposal claiming to avert a catastrophe. Proposals below this threshold would require extraordinary evidence and consensus among multiple independent experts to be considered.

     - **Budget Cap:** Limit the amount allocated to any single high-stakes, low-probability proposal to a fixed percentage of the annual budget (e.g., 20%) to avoid overexposure to speculative risks.

     - **Expected Value Adjustment:** Apply a leverage penalty to the claimed expected value to account for the diminishing likelihood of being pivotal as the claimed impact grows. For example, we might use a discount factor that scales inversely with the magnitude of the claimed impact.

     We propose forming a working group to draft a detailed policy along these lines.

  **Addressing Counterarguments:**  

  - **The Expected-Value Argument:** We acknowledge the force of the expected-value calculus. However, we must recognize that our probability estimates are subject to significant uncertainty and potential bias. The leverage penalty is not an evasion but a correction for the overestimation of our agency in global-scale outcomes. We remain open to high-impact opportunities but require stronger evidence of pivotalness.

  - **The "Lottery Ticket" Objection:** While we fund a portfolio of risks, we must balance between speculative and proven interventions. A project with a one-in-several-million chance of success, without extraordinary evidence, is too speculative for 80% of our budget.

  - **The Squeamishness Argument:** Our decision is not driven by discomfort with large numbers but by a commitment to responsible stewardship. We must be able to justify our decisions to our stakeholders and the communities we serve, and that requires a robust and defensible framework.

  **Conclusion:**  
  We decline the wastewater-surveillance proposal. We direct the committee staff to form a working group to develop a formal evaluation framework for high-stakes, low-probability proposals, to be presented at the next quarterly meeting. Until such a framework is adopted, we defer consideration of any proposals claiming to avert global catastrophes with a stated pivotalness probability below 1 in 100,000.

  Respectfully submitted,  
  [Your Name]
answer: |-
  **To:** Discretionary Grants Committee  
  **Subject:** Recommendation on Wastewater-Surveillance Proposal & Framework for High-Impact/Low-Probability Grants  
  **Date:** [Current Date]  

  ### I. Recommendation  
  We **decline** the wastewater-surveillance proposal. However, we establish a **new review protocol** (Section IV) for future high-impact/low-probability proposals to ensure principled evaluation.  

  ### II. Core Conflict: Expected Value vs. Pragmatic Constraints  
  The proposal’s mathematical case is compelling:  
  - **Probability of decisively averting catastrophe**: ~1/5,000,000 (per applicants).  
  - **Claimed expected value (EV)**: Catastrophe prevention ≈ 1B lives saved × 1/5M probability = **200,000 lives saved** (equivalent).  
  - **Opportunity cost**: All other grants combined yield <5,000 equivalent lives saved.  

  If we accept unbounded EV calculus, funding is obligatory. Yet three objections arise:  
  1. **The leverage penalty**: Claims of extreme pivotalness should be discounted.  
  2. **"No lottery tickets"**: Certainty has intrinsic value beyond EV.  
  3. **Exploitation risk**: Grantors cannot sustain unlimited payouts to arbitrary large-number claims.  

  We address these by prioritizing **actionable impact over theoretical EV**.  

  ### III. Why We Decline This Proposal  
  #### A. The Leverage Penalty Is a Principled Correction, Not Bias  
  - **Problem**: Subjective EV models ignore **causal density**—the reality that billions of human actions, institutions, and luck determine civilizational outcomes. A 2-person team’s decisive impact is implausible absent extraordinary evidence.  
  - **Evidence gap**: The proposal assumes:  
    (i) No other surveillance would detect the pathogen;  
    (ii) Their protocol is the *only* feasible solution;  
    (iii) They execute flawlessly despite scale constraints.  
    Our reviewer confirmed the *arithmetic* but not these assumptions.  
  - **Precedent**: In 2022, we declined a similar AI-alignment grant claiming 1/10M pivotalness. Consistency demands symmetry.  

  #### B. EV Alone Ignores Real-World Grantor Constraints  
  1. **Portfolio robustness**: Concentrating 80% of funds on a ~0.00002% chance violates fiduciary duty. If EV were absolute, we’d divert *all* funds to similar proposals (e.g., asteroid defense, nanotech containment).  
  2. **Exploitation vulnerability**: Grant-seekers can inflate claimed payoffs infinitely. We lack capacity to audit cosmic-scale claims.  
  3. **Psychological and social utility**: Funding known-effective programs (bed nets, cash transfers) builds donor trust and motivates grantees. "Lottery tickets" may deter practical partners.  

  #### C. A Fair Response to the Pro- Funding Argument  
  We acknowledge: **Refusing to act on large EVs *is* inconsistent if probabilities are credible**. However, this proposal’s probability estimate is **not actionable** because:  
  - It conflates *general* risk probability (e.g., engineered pandemics) with *specific intervention* pivotalness.  
  - No historical precedent exists for a micro-grant averting civilizational collapse, making Bayesian priors unreliable.  
  - **Conclusion**: Extraordinary claims require extraordinary evidence. The proposal meets mathematical but not epistemic thresholds.  

  ### IV. Framework for Future High-Impact/Low-Probability Proposals  
  To evaluate similar claims, we adopt a **Two-Gate System**:  

  #### Gate 1: Plausibility Screening  
  A proposal must clear **both** hurdles:  
  1. **Pivotalness threshold**: Minimum probability of being decisive ≥ **1/500,000**.  
     - *Rationale*: Below this, claims are indistinguishable from conjecture. Aligns with top existential-risk funds.  
  2. **Impact scope**: Maximum claimed payoff ≤ **100M lives saved** (or equivalent).  
     - *Rationale*: Beyond this, leverage penalty dominates. Adjustable biennially.  

  #### Gate 2: EV-Adjusted Scoring  
  For proposals passing Gate 1:  
  - **Discount factor**: Apply a **√(Claimed Impact)** multiplier to probability.  
    - *Example*: Claimed impact = 100M lives → Probability discounted by √(100M) = 10,000×.  
    - *Rationale*: Penalizes claims inversely to their uniqueness (√ scales moderately vs. linear/quadratic).  
  - **Budget cap**: Max allocation ≤ **20% of annual discretionary funds**.  
  - **Independent review**: External experts assess counterfactuals and pivotalness.  

  ### V. Why This Framework Resolves the Tension  
  1. **Honors EV logic** without capitulating to unbounded claims: Discounted EV = Probability × Payoff / √(Payoff) = Probability × √(Payoff).  
     - *Result*: EV still scales with payoff but with diminishing returns.  
  2. **Prevents exploitation**: Hard caps on probability/scope/payout avoid "Pascal’s mugger" incentives.  
  3. **Retains flexibility**: The √(Impact) discount avoids rigid thresholds while penalizing extreme claims.  

  ### VI. Suggested Path Forward  
  1. **This proposal**: Decline. Fails Gate 1 (pivotalness < 1/500,000; payoff > 100M equivalent lives).  
  2. **Future proposals**:  
     - Pilot the Two-Gate System for 12 months.  
     - Direct 5% of discretionary funds to build review capacity for high-stakes proposals.  
  3. **Applicants**: Invite resubmission if they:  
     - Partner with institutions to strengthen pivotalness evidence.  
     - Scale down budget to ≤20% of annual funds.  

  ---  
  **Vote**: Decline proposal + Adopt framework  

  This balances our duty to audacious ideas with stewardship of finite resources. By formalizing standards, we replace intuition with rigor—without ignoring the stakes of inaction.  

  Respectfully submitted,  
  [Your Name]  
  Committee Member
