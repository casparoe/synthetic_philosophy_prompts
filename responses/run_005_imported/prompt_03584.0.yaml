  so i've been reading Maimonides' Guide for the Perplexed on my own time and got stuck on part 3, where he explains animal sacrifice as basically a concession — God let the Israelites keep sacrificing because that's what they were used to from being around idol worship in Egypt, kind of like weaning a baby onto solid food, with the real endgame being prayer instead of sacrifice. but this is also the same guy behind the 9th of his 13 principles of faith (the Torah will never change), and in his actual law code he says flat out that the messiah is gonna rebuild the temple and get sacrifices going again just like before. doesnt that seem like a real contradiction to you? if sacrifice was just training wheels for people fresh out of idol worship thousands of years ago, why bring it back once we're supposedly at the most spiritually advanced point in history? can you build me the strongest possible case that Maimonides is genuinely contradicting himself here — not the wishy-washy "eh it probably works out somehow" version?
