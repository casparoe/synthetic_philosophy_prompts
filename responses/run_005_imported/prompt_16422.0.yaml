  I need to ensure each philosopher lands a solid point. Thorne's strongest point might be that denying margin-for-error in introspection isn't ad hoc because of the unique nature of phenomenal states. Voss's counter would be that any cognitive process, including introspection, has limitations, so the margin is necessary. Also, if luminosity fails at boundaries, it might fail in other cases too, undermining the whole idea.

