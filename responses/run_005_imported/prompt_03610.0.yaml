  1. **Restricting the knowability principle syntactically (Tennant, Dummett)**:
     - Tennant's Cartesian restriction: the knowability principle only applies to propositions that are consistent (i.e., not leading to contradiction when known). This blocks the paradox because the crucial proposition (p ∧ ¬Kp) is not Cartesian (since knowing it leads to contradiction). 
     - Dummett's basic statements: only for decidable, atomic statements.
     - Evaluation: This is a natural move for anti-realists because they might already think that not all statements are knowable in the same way. However, it can be seen as ad hoc because the restriction is designed specifically to block the paradox. Also, it might abandon the original anti-realist motivation for universal knowability. But Tennant argues that the restriction is independently motivated by the nature of knowledge.

  2. **Actuality operators / situation semantics (Edgington, Rabinowicz & Segerberg)**:
     - The idea is that when we say a truth is knowable, we mean that it is knowable in some situation, but the knowledge might be about a different situation (using actuality operators to refer to the original situation). This avoids the collapse by making the knowledge attributions relative to situations.
