answer: |-
  You've nailed the core puzzle: identical starting points (veil of ignorance) leading to diametrically opposed conclusions (average utilitarianism vs. maximin). The divergence lies in **fundamental assumptions about rationality, risk, probability, and the nature of utility itself**. Let's break down the mechanics:

  1.  **The Nature of the Veil & Probability:**
      *   **Harsanyi:** Treats the veil as a situation of **decision under risk** with known probabilities. Individuals behind the veil are rational Bayesian agents who know:
          *   All possible social positions (identities) they might occupy.
          *   The *objective probability distribution* of ending up in any given position. Crucially, Harsanyi argues that **everyone must assume the *same* probability distribution** for the choice to be impartial – typically, an equal probability of being anyone in society (1/n for each of n individuals).
          *   The *cardinal utility* they would experience in each position.
          *   **Rational Choice:** Agents maximize their *expected utility*. They calculate: `Expected Utility = Σ [Probability of being person i * Utility of person i]`.
          *   **Result:** Since everyone has the same information and probabilities, they all choose the same social arrangement. The chosen arrangement maximizes the *average* utility across society because the expected utility calculation *is* the average utility when probabilities are equal: `(1/n) * Σ (Utility_i)`. This is **average utilitarianism**.

      *   **Rawls:** Treats the veil as a situation of **decision under uncertainty** (or "ignorance"). Individuals behind the veil know:
          *   General facts about society, human psychology, and "primary goods" (rights, liberties, opportunities, income, wealth, self-respect).
          *   *Nothing* about:
              *   Which specific social position they will occupy.
              *   *Any* probabilities or likelihoods associated with occupying different positions. Rawls explicitly **rejects the possibility of assigning meaningful probabilities** ("principle of insufficient reason" or Laplace's rule). He argues there's no objective basis for assigning equal probabilities to vastly different life prospects (e.g., being a CEO vs. a person with severe disabilities).
          *   **Rational Choice:** In this profound uncertainty, where the stakes are "highest-order interests" (life prospects, self-respect), Rawls argues rational agents would *not* use expected utility maximization. Instead, they would use the **maximin rule**: choose the alternative whose worst possible outcome is better than the worst possible outcome of any other alternative. They prioritize guaranteeing the best possible *minimum* position, as they have no basis for gambling on potentially higher rewards that come with the risk of catastrophic loss.

  2.  **Risk Aversion:**
      *   **Harsanyi:** Assumes agents are rational expected utility maximizers. While individuals *can* have different degrees of risk aversion *within* their own utility functions (reflected in the shape of their vNM curve), the *choice of the social arrangement* itself is driven purely by the expected utility calculation using the *same* probabilities. He doesn't build extreme risk aversion into the *structure* of the decision problem.
      *   **Rawls:** The maximin rule is chosen *because* of the unique features of the original position (high stakes, ignorance of probabilities). Rawls argues this makes maximin rational *in this specific context*, not that humans are infinitely risk-averse in general. **Harsanyi's Critique:** Harsanyi *does* accuse Rawls of implying infinite risk aversion. He argues that *only* an agent with infinite risk aversion would *always* choose according to maximin in *any* risky situation. He sees Rawls's rejection of probabilities as arbitrary and argues that *without* that rejection, maximin is irrational.
      *   **Rawls's Rebuttal (and why Harsanyi's critique might be unfair):** Rawls counters that Harsanyi fundamentally mischaracterizes the original position. It's *not* a standard decision under risk; it's a situation of *radical uncertainty* designed to model *fairness*. Assigning probabilities is meaningless and introduces arbitrariness. The stakes involve fundamental life prospects, not monetary gambits. Therefore, the rationality of maximin stems from the *nature of the choice situation itself*, not from an inherent psychological trait of infinite risk aversion. Applying standard EU theory here is the mistake.

  3.  **Interpersonal Utility Comparisons & the Metric:**
      *   **Harsanyi:** This is *crucial* to his argument. He relies on **cardinal, interpersonally comparable utility**. He assumes individuals have von Neumann-Morgenstern (vNM) utility functions defined over social states. More importantly, he argues that for impartial choice behind the veil, these utilities must be **normalized** such that "equal increments of utility represent equal welfare differences for all individuals" (e.g., zero utility for a minimally acceptable life, unit utility for some benchmark). This normalization allows the *summation* in the expected utility calculation. Without interpersonal comparability, the average utility calculation is meaningless.
      *   **Rawls:** **Explicitly rejects interpersonal utility comparisons** as impossible or too problematic for a public conception of justice. Instead, he proposes the index of **primary goods** (basic liberties, opportunities, income/wealth, powers/preconditions of self-respect) as an objective, publicly verifiable metric of advantage. Individuals behind the veil care about maximizing their share of these primary goods, *not* utility. This allows comparisons without needing to delve into subjective experiences. The difference principle focuses on maximizing the *minimum share* of primary goods (especially the "all-purpose means" like income/wealth).

  **The Core Divergence Summarized Mechanically:**

  | Feature           | Harsanyi's Aggregation Theorem                      | Rawls's Original Position                         |
  | :---------------- | :-------------------------------------------------- | :------------------------------------------------ |
  | **Probability**   | **Known, Equal Probabilities** (Decision under *Risk*) | **Complete Ignorance** (Decision under *Uncertainty*) |
  | **Rational Rule** | **Maximize Expected Utility**                       | **Maximin Rule**                                  |
  | **Utility Metric**| **Cardinal, Interpersonally Comparable Utilities** (vNM, normalized) | **Primary Goods Index** (Objective, comparable shares) |
  | **Risk Attitude** | Standard EU risk aversion *within* utility functions | Extreme caution (*contextual*, due to uncertainty/stakes) |
  | **Core Outcome**  | **Average Utilitarianism** (Max ΣU_i / n)          | **Maximin / Difference Principle** (Max Min[Primary Goods]) |

  **Which Move is More Defensible? (An Argumentative Stance)**

  This is hotly contested, but here's a case for **Rawls's moves being more defensible *for establishing a basic structure of justice***:

  1.  **Rejecting Probabilities:** Harsanyi's assumption of known, equal probabilities is arguably *more* arbitrary in the context of fundamental justice than Rawls's outright rejection. What *is* the objective probability of being born into extreme poverty vs. immense wealth? Assigning equal probability to *every possible life* ignores the massive structural differences in likelihood created by the social system itself. Rawls is right that this introduces arbitrariness masquerading as objectivity. The veil should model *fairness*, not a lottery with known odds.
  2.  **Rejecting Interpersonal Utility Comparisons:** Harsanyi's reliance on cardinal, comparable utilities is a massive philosophical and practical hurdle. How do we actually normalize utilities across individuals? How do we compare the intensity of my suffering to your joy? Rawls's shift to primary goods provides a **publicly accessible, objective(ish) basis** for comparison essential for a stable, justifiable social contract. We *can* measure and compare income, wealth, legal rights, and educational opportunities. Focusing on the means to pursue *any* conception of the good (primary goods) respects pluralism better than trying to sum elusive utilities.
  3.  **Contextual Rationality of Maximin:** While Harsanyi correctly points out maximin is generally irrational under risk, Rawls provides strong reasons why the *original position* is unique:
      *   **High Stakes:** The decision determines fundamental life prospects, not marginal gains/losses.
      *   **Unacceptable Alternatives:** Some social positions might be truly intolerable (slavery, destitution). Maximin guarantees against falling below a threshold.
      *   **No Basis for Gambling:** Without probabilities, there's no rational way to trade off potential gains for the few against catastrophic losses for others (who could be you).
      *   **Focus on the Worst-Off:** Justice requires special attention to the most vulnerable; maximin operationalizes this directly. Utilitarianism can sacrifice the worst-off for greater aggregate gain.

  **Harsanyi's Strengths & Rebuttal:**

  Harsanyi's model is **mathematically elegant** and integrates seamlessly with standard rational choice theory. It demonstrates that impartiality *can* lead to utilitarianism. His critique highlights that Rawls's agents *behave as if* they are infinitely risk-averse *given the description of the veil*. However, this misses Rawls's point: the veil's description *defines* what fairness requires. Fairness, Rawls argues, *just is* a situation where such extreme caution is rational precisely because we are protecting against the possibility of being in an utterly unacceptable position, a possibility we cannot rationally discount.

  **Conclusion for Your Paper:**

  The divergence isn't just about "utilitarian vs. egalitarian" outcomes; it stems from **fundamentally different conceptions of rationality under the veil and the possibility/desirability of interpersonal utility comparisons.**

  *   **Harsanyi:** Models the veil as a risky lottery with known, equal odds. Rational agents maximize expected utility using comparable cardinal utilities, yielding average utilitarianism.
  *   **Rawls:** Models the veil as radical uncertainty about fundamental life prospects. Rational agents, lacking any basis for probability assignments or utility comparisons, use maximin applied to an index of primary goods, yielding the difference principle.

  **Defensibility Argument:** For establishing the *basic structure* of a just society, Rawls's rejection of probabilities and interpersonal utility comparisons, coupled with his focus on primary goods and the contextual rationality of maximin under conditions of fundamental uncertainty, provides a **more robust, publicly justifiable, and practically implementable foundation** than Harsanyi's elegant but arguably more assumption-laden model relying on problematic interpersonal utility sums. Rawls better captures the moral core of fairness – ensuring no one falls below an acceptable threshold – which gets diluted in the utilitarian averaging. The mechanics show Harsanyi prioritizing rational choice *formalism*, while Rawls prioritizes the *moral constraints* that define a fair choice situation.
