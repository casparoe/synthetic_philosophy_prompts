answer: |-
  You've hit on a profound philosophical problem called **"moral luck"** – and your discomfort is completely justified. What you're describing exposes a deep inconsistency in how we judge people. Here's a breakdown of why this feels unfair and how to articulate it:

  1.  **The Core Issue: Moral Luck (Specifically Resultant Luck):**
      *   **Definition:** Moral luck occurs when factors entirely *beyond a person's control* significantly influence the moral praise or blame they receive for an action.
      *   **Resultant Luck:** This is the type you're seeing. It's luck in the *outcome* of an action. Both drivers made the *identical* reckless choice (looking away while driving). The *only* difference was the *result*: one hit an obstacle due to random chance (the exact position of the parked car, minor steering drift, etc.), the other didn't encounter an obstacle in those specific seconds. The outcome was pure luck, yet it drastically alters the moral and practical judgment of the *identical* initial act.

  2.  **Why the Disproportionate Judgment Feels Wrong:**
      *   **Judging Luck, Not Just Choice:** Society (friends, parents, school) is heavily punishing Kid A *not solely* for his choice to look at his phone (which Kid B also made), but overwhelmingly for the *bad luck* that his reckless act resulted in a collision. Kid B escapes judgment solely due to *good luck* that his reckless act had no immediate negative consequence.
      *   **Inconsistent Application of "Recklessness":** If looking away while driving is inherently reckless and dangerous (which it is), then *both* kids demonstrated identical recklessness. The *potential* for harm was the same in both cases. Judging Kid A as "reckless" and Kid B as "fine" solely based on outcome implies that recklessness is only defined by the *result*, not the *action* or *intent*. This is logically inconsistent.
      *   **The "Near Miss" Problem:** Kid B's incident was a "near miss." He engaged in behavior that *easily could have* caused an accident just like Kid A's. We routinely ignore near misses, treating them as if nothing happened, even though they reveal the same dangerous flaws in judgment or behavior. This creates a false sense of security and fails to address the root problem.
      *   **Character vs. Consequence:** Your friends say "actions have consequences," which is true. But the *social judgment* ("reckless idiot") is often framed as being about *character*. It feels off because Kid A isn't being judged as having *worse character* than Kid B *for the driving choice itself*. He's being judged as having worse character *because his luck was worse*. We mistake the outcome for a reflection of inherent difference in recklessness or character, when the difference was circumstantial luck.

  3.  **Why Society Does This Anyway (The Practical/Pragmatic Reasons):**
      *   **Focus on Harm:** Legally and practically, society *must* focus on actual harm caused. We can't punish intent or potential harm alone to the same degree without becoming oppressive. Laws and rules (like kicking someone off a team) often *need* to be triggered by concrete outcomes.
      *   **Deterrence:** Punishing harmful outcomes more severely aims to deter the behavior that *leads* to harm. The hope is that the fear of severe consequences will make people think twice.
      *   **Easier to Identify/Prove:** It's much easier to identify and prove that someone caused damage than to consistently catch and punish every instance of distracted driving where nothing happened.
      *   **Emotional Response:** Humans react more strongly to actual harm than potential harm. Seeing the damaged car evokes anger and a demand for accountability that the abstract danger of Kid B's action does not.

  4.  **How to Explain Why This Bugs You:**
      Instead of "it feels wrong," try framing it like this:

      *   **Focus on the Identical Choice:** "Both of them made the exact same dangerous and irresponsible choice at the exact same spot: they looked away from the road while driving. That choice itself was reckless, regardless of what happened next."
      *   **Highlight the Role of Luck:** "The *only* reason Kid A is in huge trouble and Kid B isn't is pure random chance – whether a parked car happened to be in the exact wrong spot at that exact millisecond. Kid B was *equally* reckless, he just got lucky nothing was there. Judging their *character* or *level of recklessness* so differently based on that luck feels unfair."
      *   **Challenge the Character Judgment:** "Calling Kid A a 'reckless idiot' while giving Kid B a pass suggests we think Kid A *intended* to hit the car or was somehow *more* careless in that moment. He wasn't. They were equally careless. We're blaming him more because of the bad outcome, not because his choice was actually worse."
      *   **Invoke the "Near Miss":** "Kid B had a 'near miss.' He did something just as dangerous that could have easily caused the same accident if things had been slightly different. Ignoring that near miss means we're not learning the right lesson. *Both* actions showed the same dangerous lack of judgment behind the wheel."
      *   **Conclude with the Core Principle:** "It feels like we're punishing bad luck more than the actual reckless choice. The choice was the thing they controlled; the outcome was largely luck. Judging character based so heavily on luck feels inconsistent and unfair, even if the practical consequences for causing damage make sense."

  **In essence:** You are recognizing that while **practical consequences** (paying for damage, team rules) might logically differ based on outcome, the **moral judgment of their character and recklessness** should be the same for both, as their choices and intentions were identical. The vast difference in social blame stems mostly from "resultant moral luck," not from any meaningful difference in their actions or intent at the critical moment. Your discomfort is a sign you're thinking deeply about fairness and the difference between intent, action, and consequence. It *is* unfair, even if the world often operates that way for practical reasons.
