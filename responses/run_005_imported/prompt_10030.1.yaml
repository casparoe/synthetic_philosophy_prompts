prompt: |-
  So in my modal logic seminar (it's cross-listed with the CS department, which explains a lot about the vibe of the class) we spent last week on epistemic logic, and the professor mentioned almost as a throwaway comment that the standard Kripke/possible-worlds treatment of knowledge has this famous flaw called the "problem of logical omniscience" — basically that any agent who knows some proposition automatically knows every logical consequence of it, plus every tautology, no matter how hairy or non-obvious the reasoning would be for an actual person. She moved on pretty fast (I think she assumed most of us had seen this in an intro course, which I definitly have not), and now the problem set wants us to explain WHY the K axiom and the necessitation rule force this on us, not just assert that they do.

  I get on a gut level that it's absurd — obviously I don't know every consequence of what I know, otherwise I'd have already proven the Riemann hypothesis in my sleep — but I can't articulate where exactly, mechanically, in the possible-worlds setup this "leakage" happens. Could you walk me through, in a fairly intuitive and not-too-symbol-heavy way, why modeling knowledge as truth-in-all-epistemically-accessible-worlds automatically buys you logical omniscience? And then, since I vaguely remember there being "fixes" involving stuff like awareness and letting agents consider logically impossible worlds, could you also give me a sense of how convincing those actually are — do they really dissolve the problem, or do they just relabel which things count as "known" while quietly smuggling the issue back in somewhere else? My study group has been arguing about this for like an hour now and nobody actually feels like they get it on a deep level, we're just kind of nodding along at this point.
