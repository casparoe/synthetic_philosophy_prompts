prompt: |-
  I teach a graduate seminar on conditionals, and this week's session is devoted to the indicative/counterfactual distinction. I like to open with Adams's well-worn minimal pair — "If Oswald didn't kill Kennedy, someone else did" against "If Oswald hadn't killed Kennedy, someone else would have" — since it shows so cleanly that no single truth-functional or strict-conditional reading of 'if' can be doing the same job in both sentences: the first is obviously true given what we know, the second is not. This year's cohort is unusually well versed in formal semantics, and when a colleague from linguistics sat in on my planning session, she pushed back on the tidy moral I usually draw from the example. She wants to insist that 'if' names one semantic mechanism throughout, with the indicative/counterfactual contrast reducible to a difference in how context constrains that mechanism; I'm inclined to think the two constructions come apart at a deeper level, once you factor in how badly probability behaves for one of them and not the other.

  Before I revise my slides, I would like your help thinking this through properly. Please compare indicative and counterfactual conditionals, addressing in particular: why the material and strict conditional analyses fail for both constructions; how Stalnaker's selection-function semantics purports to give a single formal treatment of both, differentiated only by a pragmatic constraint tying the selection function to the conversational context set; and how Adams's thesis about the probability of indicative conditionals, together with Lewis's triviality results, complicates that unified picture — including what Lewis himself actually concluded about the semantics of 'if' from his own triviality result, as distinct from the more deflationary morals that Adams, Gibbard, and Edgington drew from the same result. I would like you to close by taking a side: is the kinship between indicative and counterfactual 'if' best explained, à la Stalnaker, as one mechanism wearing two pragmatically distinct hats, or do the triviality results show that the two constructions are, at bottom, different kinds of device that only happen to share a word?
reasoning: |-
  Okay, the user teaches a graduate seminar on conditionals and is focusing on the indicative/counterfactual distinction. They usually use Adams's Oswald example to show that truth-functional or strict-conditional analyses fail for both. But this year, a linguistics colleague challenged the idea that 'if' has two different mechanisms, arguing instead for one semantic mechanism with contextual constraints. The user is now reconsidering and wants a thorough analysis.

  First, I need to recall why material and strict conditionals fail for both types. Material implication is too weak; it makes conditionals true whenever the antecedent is false, which doesn't work for indicatives like Oswald since we know Kennedy was killed. For counterfactuals, it would make false antecedents vacuously true, but "if Oswald hadn't killed..." is false, not vacuously true. Strict conditionals require necessity, which is too strong. Indicatives don't need metaphysical necessity, and counterfactuals can be true without it in all possible worlds.

  Next, Stalnaker's unified approach using selection functions. He treats both indicatives and counterfactuals with the same core semantics: a conditional is true if the consequent holds in the closest antecedent world. The difference is pragmatic. For indicatives, the selection function is constrained to worlds within the context set (common ground). For counterfactuals, it can consider worlds outside, especially those where the antecedent is true. This explains the Oswald pair: the indicative looks at worlds consistent with knowledge (Kennedy killed, so if not Oswald, someone else did). The counterfactual looks at worlds where Oswald didn't kill, and in those, it's not necessary someone else did, so it's false.

  Then, Adams's thesis: the probability of an indicative conditional is the conditional probability. But Lewis's triviality results show that this can't hold in standard probability models without collapsing to material implication. Lewis concluded that indicatives aren't propositions with truth conditions, hence no unified account with counterfactuals which do have truth conditions. Adams, Gibbard, Edgington took a deflationary view, seeing indicatives as expressing conditional probabilities without truth values.

  The user wants me to take a side. Stalnaker's unified approach is elegant but struggles with probability. Lewis's triviality suggests a fundamental split. However, recent work like Mandelkern's might offer ways to reconcile. But given the evidence, the triviality results indicate a deeper difference. Indicatives are about suppositional thought within the context, while counterfactuals involve modal comparisons. So, despite shared surface syntax, they might be different devices. This aligns with the user's inclination that probability behavior shows a split. I should recommend siding with the deflationary view for indicatives, keeping counterfactuals as truth-conditional.
answer: |-
  Your colleague's challenge is excellent—it forces us to confront whether Stalnaker's elegant unification can withstand the pressure of probability dynamics. Let's break this down systematically.

  ### 1. **Why Material & Strict Conditionals Fail for Both**  
     - **Material Conditional (⊃)**:  
       - *Indicative*: "If Oswald didn't kill Kennedy, someone else did" (Oswald⊃Someone) would be **true** if Oswald didn't kill (since Kennedy *was* killed). But if Oswald *did* kill (making antecedent false), the material conditional is *vacuously true*—contradicting the intuition that the conditional's truth depends on historical facts, not Oswald's guilt alone.  
       - *Counterfactual*: "If Oswald hadn't killed..." (¬Oswald⊃Someone) is vacuously true if Oswald killed (antecedent false). Yet we judge it **false**—no necessity for a backup assassin.  
       - *Core Problem*: ⊃ ignores *dependence* between antecedent/consequent and mishandles false antecedents.  

     - **Strict Conditional (□(A→B))**:  
       - Demands B in *all* A-worlds. Over-strong for both:  
         - *Indicative*: True only if someone *always* kills Kennedy if Oswald fails? But we only claim backup in *actual* circumstances.  
         - *Counterfactual*: True only if backup killers exist in *all possible worlds* where Oswald abstains. Implausible—conspiracy wasn't metaphysically necessary.  

  ### 2. **Stalnaker's Unification: One Mechanism, Two Pragmatic Constraints**  
  Stalnaker treats "if A, C" as true iff C holds in the **closest A-world** (via a *selection function* f(A,w)).  
     - **Unified Semantics**:  
       - `[A > C]^w = 1 iff C^{f(A,w)} = 1`  
       - Same core for indicatives (Ind) and counterfactuals (CF).  
     - **Pragmatic Differentiation via Context Set**:  
       - *Indicative*: f(A,w) must pick from the *context set* (worlds compatible with common ground).  
         - In Oswald-Ind: Context includes "Kennedy killed." Closest ¬Oswald-world has a killer. **True.**  
       - *Counterfactual*: f(A,w) may access *more distant worlds* outside context.  
         - In Oswald-CF: Closest ¬Oswald-world might lack conspiracy (e.g., no plot, different outcome). **False.**  
     - *Appeal*: Explains minimal pairs via context-relativity. CFs involve "modal backtracking" unconstrained by actuality.  

  ### 3. **Adams + Lewis: The Probability Bomb**  
  Adams's Thesis (AT): For indicatives, P(If A, C) = P(C|A).  
  Lewis (1976) proved: **AT is incompatible with standard probability + truth-conditional semantics.**  
     - **Triviality Result**: If P(A > C) = P(C|A) for all A,C,P, then:  
       - Either P collapses to 0/1 (no uncertainty), or  
       - A > C reduces to material implication.  
     - **Lewis's Semantic Conclusion**:  
       - Indicatives **lack truth conditions** (hence no proposition to probability).  
       - *Contrast*: Counterfactuals *do* have truth conditions (e.g., in historical contexts).  
       → **Deep Split**: Inds and CFs are semantically distinct devices.  
     - **Deflationary Response (Adams/Gibbard/Edgington)**:  
       - AT holds because indicatives *express conditional probability*, not propositions.  
       - "If A, C" conventionally signals P(C|A) high.  
       → Unified syntax masks semantic discontinuity: CFs are truth-apt; Inds are probability-apt.  

  ### 4. **Taking a Side: One Mechanism or Two?**  
  **The triviality results force a bifurcation.** Stalnaker's unification is pragmatically insightful but semantically unsustainable.  
     - **Why Probability Breaks Unification**:  
       - CFs behave like ordinary propositions: we assign them *credence* based on world similarity.  
         (e.g., P(Oswald-CF false) ≈ 0.9 based on historical evidence).  
       - Inds obey AT: P(If rain, match canceled) = P(canceled | rain).  
       - *No consistent model* reconciles AT with CF-like truth conditions.  
     - **Lewis Was Right (Partly)**:  
       - Syntax misleads: "if" marks *supposition*, but indicatives/counterfactuals realize supposition differently:  
         - *Indicative*: Supposition *within* epistemic space (constraint: context set).  
         - *Counterfactual*: Supposition *about* metaphysical space (constraint: similarity).  
       → They are distinct linguistic devices co-opting the same word.  

  **Recommendation for Your Slides**:  
  - Keep Adams' minimal pair but add a *probability* variant:  
    > "Given what we knew in 1964, P(If Oswald didn’t kill Kennedy, someone else did) ≈ 1"  
    > "P(If Oswald hadn’t killed Kennedy, someone else would have) < 0.5"  
  - Conclude: **Stalnaker's pragmatics explains usage distinctions; Lewis's triviality reveals semantic fracture.** The kinship is functional (suppositional logic), not architectural (common truth-conditional core).  

  *Deflationary postscript*: For indicatives, embrace Edgington—they're not in the "fact-stating business." Counterfactuals are. This duality is why conditionals remain philosophically fertile ground.
