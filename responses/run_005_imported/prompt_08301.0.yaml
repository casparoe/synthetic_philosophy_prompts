answer: |-
  Here's the scene, tracking the philosophical debate while grounding it in their dynamic:

  **Setting:** Their kitchen, post-dinner. Dishes are half-cleared. Wine glasses are half-full. The air is thick with the residue of a good meal and simmering intellectual friction.

  **Characters:**  
  *   **ELARA (40s):** Expressive, quick, gestures with her fork. Quasi-realist expressivist.  
  *   **LEO (40s):** More deliberate, leans back, taps his glass. Moral cognitivist/realist.  

  **(The scene opens as Leo pushes his plate away, a familiar challenge in his eyes.)**

  **LEO:**  
  (Leaning forward slightly)  
  Alright, Elara. Let’s not dance around the tax evasion syllogism tonight. You know it’s coming. It’s practically our dessert. *If cheating on your taxes is wrong…* (He pauses, inviting the familiar rhythm)  

  **ELARA:**  
  (Sighs, swirling her wine, a small, knowing smile playing on her lips)  
  …*then getting your accountant to help you cheat is wrong.* Fine. *Cheating on your taxes is wrong.* Therefore, *getting your accountant to help is wrong.* Modus ponens marches on. And you think this simple little inference derails my entire metaethical project? Honestly, Leo, after all these years?  

  **LEO:**  
  (Spreading his hands)  
  It’s not the *inference* that derails you, it’s *what happens inside it*. In the first premise – "If cheating is wrong..." – "wrong" seems inert, just part of a hypothetical. In the second premise – "Cheating *is* wrong" – you say it’s expressing your boo-hiss attitude. Fine. But in the conclusion – "Getting your accountant to help *is* wrong" – suddenly "wrong" is back to expressing that attitude? How? The *logic* carries the moral term through, demanding it has the *same meaning* throughout – a meaning that makes the premises truth-apt and capable of entailing the conclusion. But for you, in premise one, "wrong" isn’t expressing an attitude; it’s just… floating. How can your ‘attitude expression’ jump into the conclusion? It breaks the logic.  

  **ELARA:**  
  (Puts her glass down decisively)  
  It doesn’t *break* it; it *explains* it differently. You keep insisting the meaning *has* to be the same static, truth-conditional meaning. I reject that demand. Think about *commitment*. When I say "Cheating is wrong," I express my disapproval. When I say "If cheating is wrong, then getting your accountant to help is wrong," I’m expressing a *higher-order* attitude: disapproval towards *combining* approval of cheating with *non*-disapproval of getting help.  

  **LEO:**  
  (Raises an eyebrow)  
  So the conditional premise isn't *about* wrongness? It's about... your feelings about combinations of feelings? That seems a far cry from what people *mean* when they utter moral conditionals.  

  **ELARA:**  
  (Leans in, animated)  
  No, Leo, it *captures* what they mean! When someone sincerely asserts that conditional, they’re *committed* to disapproving of getting help *if* they disapprove of cheating. The logic works because the inference *trains our attitudes*. If you accept the premises sincerely, you’re *psychologically committed* to the attitude expressed in the conclusion. The validity isn't in abstract truth-preservation; it's in *practical consistency* of attitudes. That’s how the ‘boo’ gets from premise two into the conclusion – via the commitment expressed in premise one.  

  **LEO:**  
  (Nods slowly, tapping his glass again. He’s engaged, not dismissive)  
  Okay. I grant that’s clever. Blackburn’s projectivism. You map the logical structure *onto* the conative states. The inference rule becomes a rule for *correctly managing* our approvals and disapprovals.  

  **ELARA:**  
  (Smiling, a touch triumphant)  
  Exactly. The Frege-Geach problem isn’t a *problem*; it’s an invitation to show how expressivism can *mimic* realist logic using attitude-projection. Quasi-realism earns the right to talk *as if* moral statements are truth-apt, *as if* they refer, *as if* the logic works conventionally, because the system of attitudes *underpinning* it all behaves analogously.  

  **LEO:**  
  (Leans back, a thoughtful frown replacing his earlier challenge. He takes a deliberate sip of wine)  
  "*As if*." That’s the rub, Elara. You mimic the *form* beautifully. But does it capture the *normative force*? Let’s say I accept premise one: I disapprove of combining approval-of-cheating with non-disapproval-of-getting-help. And I accept premise two: I disapprove of cheating. So I *must*, to be consistent, disapprove of getting help. Fine.  

  **ELARA:**  
  (Watching him closely)  
  Yes…?  

  **LEO:**  
  But *why* must I be consistent? Is it just a psychological quirk, like avoiding cognitive dissonance? Or is it because there’s a *genuine normative truth* – that inconsistency in moral judgment is *itself* wrong, objectively flawed? Your system generates the *conclusion* attitude, but it grounds the *obligation* to draw that conclusion *only* in my pre-existing desire for attitudinal consistency. What if I simply don’t care about *that* consistency? What if I happily accept the premises but shrug off the conclusion? On your view, I haven’t made a *logical* error about the *moral facts*; I’ve just failed to manage my own feelings properly. But when we argue morals, Leo, we think we’re pointing to something *outside* the other person’s psychology. We think inconsistency *proves* they’re *objectively* mistaken, not just emotionally untidy. Can quasi-realism *really* deliver that sense of external normative authority, or is the ‘realism’ ultimately just a convincing mask?  

  **(Silence hangs. Elara stares at him, her earlier triumph fading into intense concentration. She picks up her fork, not to eat, but as a focus. Leo’s question isn't a restatement; it’s a deeper probe into the quasi-realist’s ability to satisfy the very intuition of objectivity it seeks to mimic. He hasn't refuted her solution to Frege-Geach; he’s questioned whether solving it *this way* can ever capture what *drives* the moral argument in the first place.)**

  **ELARA:**  
  (Very quietly, almost to herself)  
  "The 'as if' has to be robust enough to *feel* like 'is'... or the whole project unravels."  
  (She meets his gaze, a complex mix of challenge and respect)  
  You always find the pressure point, don't you? Pour me another glass. We’re not done.

  **(Leo reaches for the bottle, a slight, acknowledging tilt to his head. The dance continues.)**

  ---

  **Word Count:** ~480

  **Philosophical Tracking:**
  1.  **Leo's Setup:** Clearly states the Frege-Geach problem using the tax example, focusing on the univocal meaning of "wrong" across asserted and embedded contexts.
  2.  **Elara's Answer (Quasi-Realist/Expressivist):** Draws directly on Simon Blackburn's projectivist solution. Explains the conditional premise as expressing a higher-order attitude (disapproval of combinations of attitudes), and validity as consistency in commitments/attitudes. Explicitly mentions "quasi-realism" and its goal of mimicking realist discourse ("as if").
  3.  **Leo's Comeback:** Moves beyond the formal logic to target the *normative authority* of morality. Questions whether grounding logical obligation *only* in desires for attitudinal consistency can capture the *objective-seeming* "must" and the sense that inconsistency reveals an *external* error, not just internal messiness. This challenges the *adequacy* of the quasi-realist explanation, not its internal coherence regarding Frege-Geach. It's a common realist critique of expressivist/quasi-realist accounts of moral disagreement and objectivity.
  4.  **Elara's Final Line:** Acknowledges the depth of his challenge – the quasi-realist needs the "as if" to be phenomenologically indistinguishable from realism for the project to fully succeed.

  Neither is a strawman. Leo articulates the problem clearly and offers a substantial critique. Elara gives the expressivist answer accurately and concisely. Their history and mutual respect (and frustration) are evident in the tone and stage directions.
