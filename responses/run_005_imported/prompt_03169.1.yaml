answer: |-
  You're absolutely right to push for substance over hand-waving. Radford's position isn't just defeatist; it's a rigorous diagnosis of a genuine inconsistency in our psychology, and Walton's "quasi-emotion" framework doesn't resolve the core paradox – it often just obscures it. Here's the strongest case for Radford, taking Walton's core defense head-on:

  **Radford's Core Argument (The Inconsistency):**
  1.  **Belief Requirement:** Genuine emotions (like fear, pity, grief) typically require a belief in the existence and plight of their object. We feel pity *because* we believe someone *real* is suffering.
  2.  **Fictional Awareness:** When engaging with fiction (Anna Karenina, green slime), we *know* the objects of our attention (Anna, the slime) do not exist. We hold the belief "This is not real."
  3.  **Experienced Emotion:** Yet, we *do* experience strong, phenomenologically real feelings – tears, chills, increased heart rate, dread – directed *at* these fictional entities.
  4.  **Conclusion:** Therefore, our emotional responses to fiction are inconsistent or irrational. We feel emotions that logically require belief in the object's existence, while simultaneously holding the belief that the object does not exist. It's a conflict between our emotional system and our cognitive beliefs.

  **Why Walton's "Quasi-Emotion" Doesn't Solve the Paradox (Addressing the Core Defense):**

  Walton's key move is granting that the *physiological reactions* (Charles's racing heart, sweaty palms) are real but arguing that the *mental state* itself isn't genuine fear *because* Charles doesn't have the belief "This green slime really threatens me" and lacks the motivation to flee. He calls this state "quasi-fear," defined by its lack of belief in the object's existence and lack of motivation to act.

  **Radford's Strong Retort (Why "Quasi" Fails):**

  1.  **The "Quasi" Label Sidesteps the Phenomenological Core:** Radford's paradox centers on the *phenomenology* – the *feeling itself*. When Charles feels his heart pound, his breath catch, and a sense of dread wash over him *while intently focused on the slime*, the *subjective experience* is indistinguishable from genuine fear *in that moment*. Calling it "quasi" doesn't change the raw feeling; it just renames it. Radford argues that *this feeling*, directed at a known fiction, *is* the irrational state. Walton doesn't explain *why* we have this intense, fear-*like* feeling; he just defines it as not-real-fear because of the lack of belief/action. But the paradox *is* the existence of that intense feeling *despite* the lack of belief. Walton accepts the feeling but denies its status as emotion *by fiat*.
  2.  **"Aboutness" Doesn't Disappear with the "Quasi" Label:** Walton argues the reaction isn't *to* the real slime (since there isn't one) but *within the game of make-believe*. But Radford would counter: What *is* Charles's pounding heart *about*? It's *about* the fictional slime he's perceiving. His physiological and phenomenological state is causally triggered by and intentionally directed *towards* the fictional entity. The paradox *is* that we have an intentional state (this feeling *of fear-about-the-slime*) directed at an object we know doesn't exist. Saying it's "quasi-fear *within the game*" doesn't dissolve the intentionality; it acknowledges it happens *in a fictional context*, but the feeling itself remains, stubbornly directed at the non-existent. The irrationality lies precisely in this aboutness towards the non-existent.
  3.  **Motivation is a Red Herring:** Walton heavily relies on the lack of motivation to flee as proof it's not real fear. Radford (and common sense) can counter this:
      *   **Overriding Motives:** Charles has *stronger* countervailing motivations: desire to see the film, social norms, intellectual curiosity, enjoyment of the thrill. Genuine fear can be *overridden* by stronger motives (e.g., a soldier feeling terror but staying in position due to duty/camaraderie). Charles's lack of flight doesn't prove the *absence* of fear; it proves the *presence* of stronger competing motivations *within the real world*.
      *   **Contextual Inhibition:** We learn context-specific inhibitions. We *know* fleeing a cinema during a horror film is socially inappropriate and pointless. This learned inhibition *suppresses* the flight response, but doesn't necessarily negate the underlying fear *feeling*. The physiological arousal and negative affect remain.
      *   **Degrees of Fear:** Fear exists on a spectrum. Not all genuine fear triggers full-blown flight. Charles's reaction might be genuine, lower-intensity fear, or fear mixed with fascination, held in check by context. Calling it "quasi" because it doesn't hit maximal panic thresholds is arbitrary.
  4.  **"Quasi-Emotion" Creates a Phantom Category:** Radford would argue that "quasi-emotion" is an unnecessary invention. What we have are *real* physiological and phenomenological responses (arousal, affect) triggered by imagination and perception of fiction. The irrationality Radford identifies is the triggering of these *real* responses with *real* phenomenology (tears, dread, excitement) *by* something we simultaneously *know* isn't real. Inventing a new category ("quasi") doesn't explain *why* this triggering happens or resolve the conflict; it just gives a special name to the very phenomenon that creates the paradox. It papers over the inconsistency with terminology.
  5.  **The Power of Art Depends on the "Irrationality":** Radford's view, ironically, might better explain art's impact. If our responses were merely cool, distanced "quasi" states, why would art move us so profoundly? The *very fact* that we cry real tears for Anna Karenina, *knowing* she's fictional, highlights a fascinating, non-rational capacity of the human mind. Walton's "quasi" framework risks reducing the emotional power of art to a bloodless intellectual game. Radford embraces the messy, contradictory reality: art *exploits* this irrational capacity to generate real feelings about unreal things, and that's its unique magic (and philosophical puzzle).

  **Conclusion:**

  Radford's strength is in highlighting a fundamental clash: our emotional systems generate real feelings (with real phenomenology and physiology) *directed at* fictional entities, while our rational faculties know those entities don't exist. This *is* inconsistent. Walton's "quasi-emotion" doesn't resolve this clash; it merely *defines* the resultant state as "not-real-emotion" *because* it lacks the belief and motivation components *that are precisely what's rendered inconsistent by the fictional context*. By doing so, it sidesteps the core phenomenological puzzle – the existence of that intense, object-directed feeling *despite* disbelief – and dismisses the very real physiological responses as irrelevant to the emotion's status. Radford forces us to confront the irrational core of our engagement with fiction; Walton, despite his insights into make-believe, provides a label that can feel like an evasion of that uncomfortable truth. The paradox remains because the feeling, in all its visceral reality, persists even when we know its object is unreal. That's the inconsistency Radford nailed, and no relabeling makes it fully rational.
