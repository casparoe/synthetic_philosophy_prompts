  Also, considering Neurath's role in the Vienna Circle, he was more focused on empirical science and unified science, not metaphysical aspects of language. The Circle used Wittgenstein's early ideas but discarded the mystical elements. Neurath's project aligns with their scientific ethos, making Isotype a practical application rather than a philosophical extension.

