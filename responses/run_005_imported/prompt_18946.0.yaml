answer: |-
  ## The Weight of Sums: Adjudicating Harsanyi's Theorem and the Utilitarian Claim

  Your debate cuts to the heart of normative economics and moral philosophy: can a mathematical theorem derived from seemingly minimal rationality axioms commit us to a substantive ethical doctrine like utilitarianism? Harsanyi's Aggregation Theorem (HAT) is indeed a powerful result, but its philosophical burden is more nuanced than either your friend's near-proof claim or your Sen-inspired skepticism suggests. Let's dissect the theorem, weigh the strongest arguments on both sides, and reach a defended verdict.

  **1. Harsanyi's Theorem: The Formal Core**

  *   **Premises:**
      *   **Individual Rationality:** Each individual `i` has preferences over lotteries (risky prospects) satisfying the von Neumann-Morgenstern (vNM) axioms. This implies their preferences can be represented by a **cardinal utility function `U_i`**, unique up to positive affine transformations (`a*U_i + b`, `a>0`). Cardinality means ratios of utility *differences* are meaningful (`U_i(A) - U_i(B) > U_i(C) - U_i(D)` implies A is preferred to B more strongly than C is preferred to D).
      *   **Social Rationality:** The social ranking of lotteries also satisfies the vNM axioms. Thus, there exists a **social welfare function `W`** representing social preferences over lotteries, also cardinal.
      *   **Pareto Principle:** If every individual weakly prefers lottery `A` to lottery `B`, then society weakly prefers `A` to `B`. If at least one individual strictly prefers `A` and no one prefers `B`, then society strictly prefers `A`.

  *   **Conclusion:** Given these premises, the social welfare function `W` **must** be a **weighted sum** of the individual vNM utility functions:
      `W = Σ α_i * U_i`   (where `α_i > 0` for all `i`)

  The `α_i` are positive weights. Crucially, the theorem proves the *existence* and *form* of such a representation but says **nothing** about how the `α_i` are determined, other than being positive. Different weight vectors correspond to different social welfare functions satisfying the premises.

  **2. The Utilitarian Interpretation: Your Friend's Strongest Case**

  Your friend's argument leverages the theorem's elegance and its formal resemblance to utilitarianism:

  1.  **From Representation to Prescription:** The theorem shows that *if* we demand social rationality under uncertainty and respect unanimous preferences (Pareto), *then* social welfare *must* take the form of a sum of individual utilities. This suggests the utilitarian form isn't an arbitrary ethical choice but a logical consequence of foundational decision-theoretic principles applied to society. Rejecting the sum would require rejecting one of the premises – rationality or Pareto – which seem highly plausible.
  2.  **Cardinality Enables Summation:** The vNM framework provides the necessary cardinal structure for utility. While `U_i` itself is only unique up to affine transformation, the *weights* `α_i` implicitly handle the scaling. Once weights are chosen, the weighted sum `Σ α_i U_i` is a specific cardinal function. The theorem demonstrates that such cardinal interpersonal aggregation is *compatible* with the premises.
  3.  **Pareto as the Bridge:** The Pareto principle injects a fundamental individualism into the social ranking. Combined with rationality, it forces social welfare to be a function *only* of individual utilities. The linear form is the specific consequence derived under uncertainty.
  4.  **Harsanyi's Own View:** Harsanyi explicitly intended the theorem as a defense of utilitarianism. He argued that under a "veil of ignorance" (where individuals don't know their own identity), rational individuals would choose the social arrangement maximizing *expected* utility, leading to equal weights (`α_i = 1` for all `i`). While the theorem itself doesn't contain the veil, proponents see it as a natural normative extension.

  **Strongest Version:** Harsanyi's theorem provides the *formal scaffolding* for utilitarianism. It demonstrates that accepting basic principles of rational choice under uncertainty and a weak unanimity condition logically compels us to represent social welfare as an aggregate of cardinal individual utilities. Choosing equal weights (`α_i = α_j`) then becomes the natural expression of impartiality, completing the utilitarian picture. The theorem doesn't *fully* prove classical utilitarianism, but it proves its essential *mathematical form* is uniquely dictated by the axioms, making utilitarianism the default social choice framework compatible with individual rationality.

  **3. The Skeptical Rebuttal: Sen's Objection and Beyond (Your Case)**

  Your counterarguments, rooted in Amartya Sen's critique, highlight crucial limitations:

  1.  **The Tyranny of Arbitrary Weights:** The theorem's silence on the `α_i` is devastating for its *normative* force. **`Σ α_i U_i` is equally compatible with:**
      *   **Utilitarianism:** `α_i = 1` for all `i`.
      *   **Elitism:** `α_i` very large for one person, negligible for others.
      *   **Systematic Discrimination:** `α_i` low for members of a specific group.
      All satisfy the premises! The theorem offers no justification for preferring equal weights over any other positive weights. It doesn't even require weights to be constant across different policy choices. The "weighted sum" form is necessary but insufficient for the *ethical content* of utilitarianism, which demands impartiality and equal consideration.
  2.  **The Mirage of Interpersonal Comparability:** The vNM utility functions `U_i` are *intrapersonally* cardinal (meaningful differences within a person) but *interpersonally* ordinal (only rankings, not levels or difference magnitudes, are comparable *across* persons). The theorem *assumes* a specific scaling is chosen for each `U_i` (establishing its zero point and unit) to make the sum `Σ α_i U_i` mathematically defined. However:
      *   **No Empirical Basis:** The vNM axioms provide no information about how to align one person's utility scale with another's. Is a 1-unit increase for Alice comparable to a 1-unit increase for Bob? The theorem is silent.
      *   **Weights Absorb Scaling:** The choice of `α_i` is inextricably linked to the arbitrary choice of scaling for `U_i`. Doubling Alice's utility scale (`U_A' = 2*U_A`) is equivalent to halving her weight (`α_A' = α_A / 2`) in the social welfare function. The "utility" being summed is not a common, interpersonally validated metric of well-being; it's a representation of preferences under risk, normalized arbitrarily and then weighted arbitrarily.
  3.  **Utility ≠ Well-being:** Harsanyi conflates vNM utility (a representation of choice under risk) with moral utility (well-being or happiness). Individuals might have preferences that don't align with their own well-being (e.g., self-sacrifice, spite) or well-being might involve dimensions not captured by risky choices. Summing vNM utilities doesn't necessarily sum well-being.
  4.  **The Pareto Straitjacket:** While weak, the Pareto principle can be problematic. It prevents social choices that benefit many at a small cost to one (violating weak Pareto if that one person is harmed), and it cannot resolve conflicts where some gain and others lose, which is the norm in policy. Utilitarianism often *requires* such trade-offs, which the Pareto principle, strictly interpreted, forbids the theorem from addressing directly.

  **Strongest Version:** Harsanyi's theorem establishes a *mathematical possibility*, not an ethical necessity. It shows that *if* you demand social vNM rationality and Pareto, *and if* you arbitrarily fix interpersonal utility scales, *then* social welfare is a weighted sum. However, it provides **zero** normative guidance on the critical ethical questions: how to set the weights (`α_i`) and how to establish meaningful interpersonal comparisons (choosing the scales for `U_i`). Without answers to these, the "weighted sum" form is ethically hollow. It is just as compatible with inegalitarian or discriminatory social orderings as with utilitarianism. The theorem formalizes aggregation but presupposes the solution to the core problem of interpersonal comparison that utilitarianism requires.

  **4. Adjudication and Verdict**

  Both sides capture essential truths, but the skeptical view ultimately carries more weight regarding the theorem's ability to *justify* utilitarianism.

  *   **What HAT Does Entail:**
      *   A powerful *impossibility* result: **No** social welfare ordering satisfying vNM rationality and Pareto can deviate from the weighted utilitarian form. This is its core technical achievement.
      *   That cardinal individual utilities *can* be aggregated into a cardinal social utility under these axioms.
      *   That Pareto and social rationality under uncertainty impose a strong structural constraint, forcing social welfare to be a linear function of individual utilities.
      *   That Harsanyi's setup provides a *framework* within which utilitarian *calculations* could occur, *if* the weighting and comparability problems are solved externally.

  *   **What HAT Does NOT Entail:**
      *   That the weights `α_i` should be equal.
      *   That vNM utilities represent interpersonally comparable well-being.
      *   That meaningful interpersonal comparisons of utility levels or differences are possible within the framework.
      *   That utilitarianism (as an ethical doctrine demanding equal consideration and maximization of comparable well-being) is proven or uniquely supported.
      *   That the "utility" being summed has any necessary ethical significance beyond representing risky preferences.

  **Verdict:** **Harsanyi's Aggregation Theorem does not give us good reason, by itself, to accept utilitarianism as a normative ethical theory.** While it brilliantly demonstrates the logical linkage between individual rationality under uncertainty, Pareto efficiency, and a linear aggregation *form*, it fails to bridge the critical ethical chasms:

  1.  **The Weighting Problem:** The theorem's silence on `α_i` renders it normatively inert on the core utilitarian principle of impartiality. It formalizes aggregation but not equality.
  2.  **The Comparability Problem:** The theorem *assumes* a solution to interpersonal comparison is provided (via the arbitrary scaling choices absorbed by the weights) but offers *no justification* for any particular solution. It presupposes the very thing utilitarianism needs to establish – a common metric of value.

  **Qualification:** This is not a dismissal of HAT's significance. It remains a profound result showing the *formal coherence* of utilitarian aggregation under specific, plausible axioms. It powerfully argues that *if* one accepts those axioms *and* can independently justify a method for interpersonal utility comparison *and* a normative principle for setting the weights (like impartiality behind a veil of ignorance), *then* utilitarianism becomes a compelling framework. HAT provides the mathematical skeleton; utilitarianism needs independent ethical flesh. It makes utilitarianism *possible* and *compatible* with rationality and Pareto, but it falls far short of proving it *necessary* or *compelling* solely based on those premises. The burden of justifying interpersonal comparisons and equal weighting lies entirely outside the theorem's scope. Your skepticism about its direct philosophical weight is therefore well-founded, while your friend overstates the theorem's ethical reach, mistaking a necessary formal structure for a sufficient ethical justification.
