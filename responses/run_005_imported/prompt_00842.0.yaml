  Hey, I need a dialogue for my formal epistemology seminar and can't quite nail the voices myself. Scene: two credence theorists get stuck sharing a cab after a workshop on Bayesian epistemology. One is a committed accuracy-firster in the Joyce/Pettigrew mold -- for them, probabilism is justified because any incoherent credence function is accuracy-dominated by some coherent alternative in every possible world, no betting required. The other is an old-school Ramsey/de Finetti Dutch book theorist who thinks thats all fine but accuracy-dominance arguments just quietly smuggle in their own arbitrary choices (which scoring rule? why's it have to be proper/immodest?) dressed up as pure epistemics. Get them actually engaging with each others points instead of talking past one another -- I want the Dutch-booker pressing on where "legitimate" accuracy measures come from, and the accuracy-firster pressing back on whether caring about a sure loss on bets nobody's forced to make is even an epistemic failing, rather than just a practical one. Neither should cave by the end.
