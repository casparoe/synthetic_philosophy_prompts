  Their question about whether emergent behavior in ML is more than the sum of parts ties directly. They’re likely facing arguments in their field about whether emergence is real or just apparent. Mill’s passage might be a historical parallel to current debates. 

  I should clarify that Mill’s "Composition of Causes" here might mean something broader. Perhaps he’s using it to emphasize that laws of individual nature still apply in aggregate, not that effects are always additive. His "without residue" phrasing is strong, but maybe he’s reacting against holistic theories of his time, like Comte’s. 

