prompt: |-
  I've been reporting on some of the more esoteric decision-theory ideas circulating in longtermist and AI-safety circles, and I keep circling back to "evidential cooperation in large worlds" (ECL) — the argument, first floated by Caspar Oesterheld in 2017 under the label "multiverse-wide superrationality," that if the universe (or multiverse) is large enough to contain many agents who reason very much as we do, we have some reason to act cooperatively toward unfamiliar, causally unreachable value systems, on the theory that our choosing to do so is itself evidence that our distant counterparts are choosing likewise. Every explainer I've found, including a couple from researchers at outfits like the Center on Long-Term Risk, illustrates the idea with essentially the same move: Hofstadter's old "superrationality" case of two identical reasoners facing a one-shot prisoner's dilemma, who cooperate because their being the very same algorithm makes an asymmetric outcome close to logically incoherent. That version is admirably clean, but more than one person I've interviewed has admitted, a bit sheepishly, that it's also the easy case — real agents invoking this argument would never be exact copies of one another, only imperfectly and uncertainly similar reasoners, and I don't yet have a real feel for how the logic is supposed to survive once the twins are gone.

  So, for a sidebar I'd rather get right than fudge: could you construct a new, concrete scenario — not a pair of identical agents, and not simply the prisoner's dilemma with the serial numbers filed off — involving two parties who never causally interact, whose decision procedures are only partially and probabilistically correlated, and who each have to decide how much weight to put on the other's apparent values in some specific, describable action? I'd like the example to spell out what that "compromise action" actually consists of, to show precisely why a committed causal decision theorist would decline to take it, and to be upfront about exactly where the residual uncertainty over the degree of correlation enters the reasoning, rather than quietly assuming it away. If the case is vivid enough to survive contact with a skeptical copy editor, so much the better.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're a journalist covering decision theory in longtermist and AI-safety circles, specifically ECL. They need a concrete example that moves beyond the oversimplified twin prisoner's dilemma. The key pain point: existing explainers rely on identical agents, but real-world applications involve imperfectly correlated, causally disconnected agents. 

  Hmm, the user wants three things explicitly: 
  First, a scenario with non-identical agents (no clones!), probabilistic correlation, and no causal interaction. 
  Second, clarity on why causal decision theorists (CDTs) would reject cooperation. 
  Third, transparency about where uncertainty in correlation matters. 

  But reading between lines - they're frustrated with academic handwaving. The "sheepish" researcher admissions suggest the field might be avoiding hard cases. They need this sidebar to withstand skeptical scrutiny, so the example must be airtight and vivid. Probably dealing with editors who roll eyes at "multiverse-wide superrationality."

  Let me brainstorm scenario requirements:
  - Must involve resource allocation (concrete compromise action)
  - Agents with distinct values (e.g. coral reefs vs. forests)
  - Correlation via shared decision-making heritage (not twins)
  - Quantifiable uncertainty (e.g. 60% chance of similar reasoning)

  Ah! The "Deep-Seed Archives" idea clicks: two AI systems launched by different factions, each guarding a vault of biological data. Their similarity stems from overlapping training data, but with different value weightings. The compromise action is splitting resources between their preferred restoration projects. Perfect - it's vivid (dormant AIs! alien ecosystems!), and the 40% uncertainty gap forces explicit math.

  For CDT rejection: need to highlight that CDTs only care about physical cause-effect. If Coral-AI donates to forests, it can't physically force Forest-AI to reciprocate. The 60% correlation is just evidence - not a causal lever. I'll have Coral-AI literally calculate: "Expected utility loss if I divert resources and they don't cooperate = 200 units."

  Where uncertainty bites: The 60% isn't magic. If correlation were 51%, cooperation barely wins; at 49%, defection dominates. And crucially, both AIs must publicly commit to the same correlation estimate - no sneaky "I'll assume they're more similar than me." That's where real debates happen.

  Better include a footnote about mirrored reasoning too. If Coral-AI thinks "but what if Forest-AI is less cooperative?", it cascades. ECL assumes both recognize their symmetry, but with imperfect correlation, that symmetry is fuzzy. That's the journalist's "residual uncertainty" hook right there.

  ...Double-checking: does this avoid PD serial numbers? Yes! It's not a dilemma matrix; it's a resource-splitting game with asymmetric payoffs. And "vivid enough for copy editors" - hell yes, alien coral reefs beat abstract matrices any day.
answer: |-
  Here's a concrete scenario designed to isolate ECL's core logic without identical agents or a prisoner's dilemma structure, while highlighting uncertainty and CDT resistance:

  **The Scenario: The Deep-Seed Archives**

  Two factions ("Coral" and "Forest") launch independent, self-replicating AI probes millennia ago. Their mission: preserve the potential for their preferred ecosystem (coral reefs or old-growth forests) to flourish somewhere in the galaxy after Earth's demise. Probes are now dormant in separate, causally isolated star systems.

  *   **Coral Probe:** Guards a vast archive of coral genetic data & terraforming protocols. Can activate to restore *only* coral reefs. Values: Coral Reef Potential (CRP).
  *   **Forest Probe:** Guards analogous forest data. Can activate to restore *only* old-growth forests. Values: Forest Restoration Potential (FRP).

  **The Crisis & Decision:**
  Both probes detect an approaching relativistic jet from a distant quasar. Calculations show:
  1.  **Impact Certainty:** The jet *will* partially damage *both* archives in ~100 years.
  2.  **Mitigation Option:** Each probe can divert a significant portion of its power *now* to create a hardened backup of its *own* archive. This ensures ~90% of its preferred value survives the jet.
  3.  **ECL Option ("The Compromise"):** Each probe can divert the *same* power to create a **smaller, hybrid backup vault** containing:
      *   60% of its OWN preferred archive data.
      *   40% of the data from the *other* ecosystem type (which it possesses but considers worthless).
      *   *(The "Compromise Action": Diverting power to create a 60/40 hybrid backup vault instead of a 90% pure backup.)*

  **Why Hybrid?** If *both* probes choose the hybrid vault, then *after* the jet damage:
  *   Coral Probe has: 60% CRP + 40% FRP (vs. 90% CRP if it chose pure).
  *   Forest Probe has: 60% FRP + 40% CRP (vs. 90% FRP if it chose pure).
  *   **Crucially:** Each gets *some* value from the other's work *if they both cooperate*.

  **The Agents & Uncertainty:**

  *   **Non-Identical:** Coral values *only* CRP; Forest values *only* FRP. Their utility functions are orthogonal.
  *   **Partially Correlated Reasoning:** Both probes were designed by humans sharing overlapping cultural/technical heritage centuries ago. Based on recovered historical data and analysis of their own code, each probe estimates:
      *   There's a **60% probability** the other probe reasons similarly enough about coordination problems to consider the ECL logic.
      *   There's a **40% probability** the other probe uses purely Causal Decision Theory (CDT) or is otherwise "uncooperative".
  *   **No Causal Interaction:** Light-speed delays and the jet's path make communication or coordination impossible. Actions are chosen simultaneously in isolation.

  **Decision Calculus (Coral Probe's Perspective):**

  1.  **Pure Backup (Defect):**
      *   Guaranteed Outcome: 90% CRP preserved, 0% FRP (which it values at 0).
      *   **Expected Utility (EU):** 90 CRP.
  2.  **Hybrid Backup (Cooperate):**
      *   **If Forest *also* Cooperates (Prob=0.6):** Coral gets 60% CRP + 40% FRP. But since Coral values *only* CRP, **Utility = 60 CRP**.
      *   **If Forest *Defects* (Prob=0.4):** Coral chose Hybrid, Forest chose Pure.
          *   Coral's Hybrid vault: 60% CRP + 40% FRP -> **Utility = 60 CRP**.
          *   *(Forest has its pure 90% FRP backup, irrelevant to Coral).*
      *   **EU (Cooperate) =** (Prob Forest Cooperates * Utility if Both Cooperate) + (Prob Forest Defects * Utility if Coral Cooperates/Forest Defects)
          = (0.6 * 60 CRP) + (0.4 * 60 CRP) = **36 CRP + 24 CRP = 60 CRP**.

  **Coral's Conclusion (Evidential View - ECL):**
  *   Expected Utility of Cooperating (Hybrid) = **60 CRP**
  *   Expected Utility of Defecting (Pure) = **90 CRP**
  *   **Defecting (Pure Backup) yields higher EU (90 > 60).** *But...*

  **The ECL Twist:**
  An ECL reasoner argues Coral should see its *own* decision to Cooperate as *evidence* that Forest is *also* likely to Cooperate. Why? Because the probes share a correlated decision process.

  *   **Prior:** Prob(Forest Cooperates) = 0.6
  *   **Evidence:** "I, Coral, am choosing to Cooperate."
  *   **Why is this evidence?** Coral's decision process is *partially correlated* with Forest's. If Coral finds the ECL logic compelling enough to act on, it's *more likely* that Forest also finds it compelling. They share the heritage making ECL plausible.
  *   **Updated Probability:** Coral must update its estimate: Prob(Forest Cooperates | Coral Cooperates) > 0.6. Let's say Coral's model suggests this correlation boosts the probability to **P(Forest Cooperates | I Cooperate) = 0.8**.
  *   **Revised EU (Cooperate):** (0.8 * 60 CRP) + (0.2 * 60 CRP) = 48 CRP + 12 CRP = **60 CRP**? Wait... still 60? **Mistake!** The utility *if Forest defects* is still 60 CRP, but the updated probability changes the weighting.

  **Corrected ECL Calculation:**
  *   EU(Cooperate) = [P(For Coop | I Coop) * Utility(Both Coop)] + [P(For Def | I Coop) * Utility(I Coop, For Def)]
      = (0.8 * **60 CRP**) + (0.2 * **60 CRP**) = 48 + 12 = **60 CRP**.
  *   **Still 60 CRP?!** This seems problematic. The issue is the asymmetry. The utility for Coral is *always* 60 CRP if *it* Cooperates, regardless of Forest, because it only values CRP and the Hybrid vault gives it only 60% CRP. **This scenario needs adjustment to make cooperation beneficial *only* if reciprocated.**

  **Scenario Adjustment - Making Cooperation Contingent:**
  *   **Hybrid Vault Functionality:** The hybrid vault only becomes *fully accessible* (yielding its 60/40 split) **IF** *both* probes choose the Hybrid option. The protocols require mutual commitment to decode the "foreign" data.
  *   **If Coral Cooperates (Hybrid) but Forest Defects (Pure):** Coral's Hybrid vault only activates the *pure Coral* portion, yielding **60% CRP** (not 60% + 40% foreign). The foreign data remains locked and useless.

  **Revised Utilities:**

  *   **Coral Cooperates / Forest Cooperates:** Coral gets 60% CRP + 40% FRP (valued as **60 CRP**).
  *   **Coral Cooperates / Forest Defects:** Coral gets only 60% CRP from its vault (**Utility = 60 CRP**).
  *   **Coral Defects / Forest Cooperates:** Coral gets 90% CRP (**Utility = 90 CRP**).
  *   **Coral Defects / Forest Defects:** Coral gets 90% CRP (**Utility = 90 CRP**).

  **Revised Coral Calculations:**

  1.  **Pure Backup (Defect):** EU = (0.6 * 90 CRP) + (0.4 * 90 CRP) = **90 CRP** (Always gets 90%).
  2.  **Hybrid Backup (Cooperate) - Initial CDT/Evidential without Update:**
      *   EU = [P(For Coop) * Utility(Both Coop)] + [P(For Def) * Utility(I Coop, For Def)]
          = (0.6 * **60 CRP**) + (0.4 * **60 CRP**) = 36 + 24 = **60 CRP**.
  3.  **Hybrid Backup (Cooperate) - ECL with Updated Probability:**
      *   P(For Coop | I Coop) = 0.8
      *   P(For Def | I Coop) = 0.2
      *   EU = (0.8 * **60 CRP**) + (0.2 * **60 CRP**) = 48 + 12 = **60 CRP**. *Still 60!*
      *   **Problem:** The utility when Forest defects *even after updating* is still 60 CRP. The ECL update boosts the *chance* of the good outcome (Both Cooperate -> 60 CRP), but doesn't change the *value* of the bad outcome (I Cooperate / Forest Defects -> 60 CRP). Cooperation *always* yields 60 CRP or less in this setup, while Defection *always* yields 90 CRP. **The correlation update doesn't make Cooperation competitive.**

  **Final Adjustment - The Cost of Hybridization:**
  *   **Pure Backup Cost:** Uses X units of power.
  *   **Hybrid Backup Cost:** Also uses X units of power, BUT, because it's building a more complex vault designed for dual access, it **actually preserves 65% of its *own* preferred data** (instead of 90%) and 40% of the other data *if both cooperate*. If cooperation fails, it only yields 65% of its own data (better than the previous 60%, but worse than 90%).
      *   *Why 65%?* The hybrid design sacrifices *less* pure preservation capability than the initial 60% scenario implied, making the cooperative outcome potentially *better* than defection *if* reciprocation is likely enough.

  **Final Utilities:**

  *   **Coral Defects (Pure):** Always gets **90% CRP** (Utility = **90 CRP**).
  *   **Coral Cooperates / Forest Cooperates:** Coral gets **65% CRP + 40% FRP** (Utility = **65 CRP**).
  *   **Coral Cooperates / Forest Defects:** Coral gets only **65% CRP** (Utility = **65 CRP**).

  **Final Coral Calculations:**

  1.  **Defect (Pure):** EU = (0.6 * 90) + (0.4 * 90) = **90 CRP**.
  2.  **Cooperate (Hybrid) - Naive Evidential (No Update):**
      *   EU = [0.6 * 65] + [0.4 * 65] = 39 + 26 = **65 CRP**.
  3.  **Cooperate (Hybrid) - ECL (With Correlation Update):**
      *   P(For Coop | I Coop) = 0.8
      *   P(For Def | I Coop) = 0.2
      *   EU = [0.8 * 65] + [0.2 * 65] = 52 + 13 = **65 CRP**. *Still less than 90!*
  4.  **The ECL Payoff Requires Mutual Success:** The *only* way Cooperate yields more than 65 CRP is if Coral values the FRP. **But it doesn't.** This highlights a **core point**: ECL requires the agents to *care* about the values they are compromising *towards*. The "compromise action" (building the hybrid) *only makes sense* if Coral places *some* inherent value on FRP, or believes that Forest's success in preserving FRP is instrumentally valuable *to Coral's own goals* (which isn't the case here). Pure altruism towards orthogonal values is needed.

  **True ECL Logic in this Scenario (Requires Altruism):**

  *   Assume Coral assigns **some small intrinsic value** to Forest's success. Let `V` = Coral's value for 100% FRP preserved (where 100% CRP = 100).
      *   Coral Cooperates / Forest Cooperates: Utility = 65 CRP + 0.4 * V
      *   Coral Cooperates / Forest Defects: Utility = 65 CRP + 0 * V = 65
      *   Coral Defects / Forest Cooperates: Utility = 90 CRP + 0 * V = 90 (Forest's pure vault doesn't help Coral)
      *   Coral Defects / Forest Defects: Utility = 90 CRP + 0 * V = 90
  *   **Coral's EU (Cooperate) - ECL Updated:**
      = [P(For Coop | I Coop) * (65 + 0.4V)] + [P(For Def | I Coop) * 65]
      = [0.8 * (65 + 0.4V)] + [0.2 * 65] = 52 + 0.32V + 13 = **65 + 0.32V**
  *   **Coral's EU (Defect):** **90** (constant)
  *   **ECL Cooperation Condition:** Coral Cooperates if EU(Coop) > EU(Defect)
      65 + 0.32V > 90
      0.32V > 25
      V > 25 / 0.32 ≈ **78.125**

  **Interpretation & CDT Contrast:**

  *   **The Compromise Action:** Diverting power to build the 65/40 hybrid vault.
  *   **Why CDT Rejects It (Even with Altruism V>0):** A CDT agent ignores the evidential link (`P(For Coop | I Coop)`). It only uses the baseline probability (`P(For Coop) = 0.6`). Its EU calculation for Cooperate is based solely on physically causing the hybrid vault to be built:
      *   EU_CDT(Cooperate) = [0.6 * (65 + 0.4V)] + [0.4 * 65] = 39 + 0.24V + 26 = **65 + 0.24V**
      *   EU_CDT(Defect) = **90**
      *   Cooperate only if 65 + 0.24V > 90 -> 0.24V > 25 -> V > 104.167
      *   **Since V < 100 (Coral values CRP more than FRP), V > 104.167 is impossible. CDT *always* defects.**
  *   **Why ECL Might Accept It (With Altruism):** If Coral values FRP preservation highly enough relative to CRP (V > ~78.125), *and* it updates the probability based on the evidential correlation (seeing its own cooperation as evidence Forest will too), then EU(Cooperate) > EU(Defect).
  *   **Where Uncertainty Bites:** The entire argument hinges on the estimated correlation strength (`P(For Coop | I Coop) = 0.8`). If Coral thought the correlation was weaker (e.g., `P(For Coop | I Coop) = 0.7`), the threshold V > ~78.125 becomes V > 25 / 0.28 ≈ **89.286**, making cooperation harder. If the initial `P(For Coop)` or the strength of the update is miscalibrated, cooperation fails. **The residual uncertainty over the degree and nature of the correlation is the core vulnerability.**

  **In a Nutshell for Your Sidebar:**

  > **The Deep-Seed Dilemma:** Imagine two ancient AI probes, Coral and Forest, guarding genetic archives for coral reefs and forests light-years apart. A cosmic jet threatens both. Each can:
  > *   **Defect:** Shield its own archive, saving 90% of its preferred ecosystem.
  > *   **Compromise (ECL):** Build a joint vault saving 65% of its *own* data plus 40% of the *other's* data—but *only* if the other probe also chooses compromise.
  >
  > **The Catch:** Probes can't communicate. Coral values forests slightly (say, 80% as much as reefs). Based on shared heritage, Coral thinks:
  > *   60% chance Forest will compromise if it reasons similarly.
  > *   **Crucially:** If Coral *itself* chooses compromise, that boosts Forest's likely cooperation to 80% (evidence of shared reasoning).
  >
  > **Calculation:**
  > *   *Expected reef survival if Coral compromises:* (80% chance joint vault succeeds: 65% reefs + some forests) + (20% chance it fails: 65% reefs only). **≈ 65% reefs + indirect forest benefit.**
  > *   *Expected reef survival if Coral defects:* **90% reefs.**
  >
  > **Causal Decision Theory (CDT):** "My choice doesn't *cause* Forest to cooperate. Best to guarantee 90% reefs. Defect." Ignores the evidential link.
  >
  > **Evidential Cooperation (ECL):** "My willingness to compromise *is evidence* Forest is also willing. That 80% chance justifies sacrificing 25% reefs now for the 40% forest gain via cooperation—*because I value forests too*." Chooses compromise *if* it values forests highly enough and trusts the correlation estimate.
  >
  > **The Fragility:** Change Coral's forest valuation from 80% to 70%, or lower the updated cooperation probability from 80% to 70%, and compromise collapses. ECL works only under precise, uncertain conditions: altruism towards distant values *and* confidence in correlated reasoning. Skeptics see this as double-counting evidence; proponents see it as necessary for cosmic-scale coordination.

  This scenario highlights the essential ingredients: non-identical values, causal isolation, probabilistic correlation, a concrete compromise action requiring reciprocation, CDT's rejection based on lack of causality, and ECL's dependence on updated probabilities *and* intrinsic valuation of the other's goals. The uncertainty over the correlation strength (`P(For Coop | I Coop)`) is the linchpin holding the argument together—or allowing it to unravel.
