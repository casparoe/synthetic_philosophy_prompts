answer: |-
  You've hit on one of the most debated passages in Locke! Let's break it down line-by-line, addressing your specific questions about the mechanism and the tension with "common sensibles."

  **Key Concepts & Sentence Breakdown:**

  1.  **The Globe Example (Judgment altering Sensation):**
      *   "**We are further to consider concerning perception, that the ideas we receive by sensation are often, in grown people, altered by the judgment, without our taking notice of it.**" - Locke's core claim: Our *raw sensory input* (sensation) is frequently modified unconsciously by our *understanding* (judgment) based on past experience.
      *   "**When we set before our eyes a round globe... it is certain that the idea thereby imprinted on our mind is of a flat circle, variously shadowed...**" - The *actual* visual sensation is a 2D pattern of light and color/shade (like a painting).
      *   "**But we having, by use, been accustomed to perceive what kind of appearance convex bodies are wont to make in us... the judgment presently, by an habitual custom, alters the appearances into their causes.**" - Through constant experience, our judgment *automatically* interprets these patterns as signs of 3D objects. Habit/custom links the sensory pattern to its usual cause.
      *   "**So that from that which is truly variety of shadow or colour, collecting the figure, it makes it pass for a mark of figure, and frames to itself the perception of a convex figure and an uniform colour; when the idea we receive from thence is only a plane variously coloured...**" - The judgment takes the varied colors/shades (the *signs*), infers ("collects") the 3D shape, and *replaces* the raw sensation (flat, colored plane) with the perception of a 3D object (convex sphere). We *think* we see the sphere directly, but it's an interpretation layered onto the sensation.
      *   **Mechanism:** Learned association (habit/custom) links a specific sensory pattern (visual shading) to a specific concept/cause (3D convexity). This association happens so fast and automatically we mistake the judgment for sensation.

  2.  **Introducing Molyneux's Problem:**
      *   Locke presents the scenario: Blind from birth, learns cube vs sphere by touch, gains sight, asked to distinguish them *visually* before touching.
      *   He quotes Molyneux's answer: "**Not. For, though he has obtained the experience of how a globe, how a cube affects his touch, yet he has not yet obtained the experience, that what affects his touch so or so, must affect his sight so or so; or that a protuberant angle in the cube, that pressed his hand unequally, shall appear to his eye as it does in the cube.**"
      *   **Locke's Agreement:** "**I agree with this thinking gentleman... I am of opinion that the blind man, at first sight, would not be able with certainty to say which was the globe, which the cube, whilst he only saw them...**"
      *   **Locke's Stated Reason:** He explicitly endorses Molyneux's reasoning: The man lacks the *specific experience* linking how the tactile sensation *correlates* with the visual sensation. He knows what a cube *feels* like, but doesn't know what that specific tactile feeling *looks* like.
      *   **Locke's Broader Point:** "**This I have set down... as an occasion for him to consider how much he may be beholden to experience, improvement, and acquired notions, where he thinks he had not the least use of, or help from them.**" - The whole passage is an argument for empiricism: even seemingly simple perceptions rely heavily on learned associations from experience.

  **Answering Your Questions:**

  1.  **Is the Molyneux answer running on the SAME mechanism as the globe/circle bit?**
      *   **Yes, fundamentally.** You are correct, and Leo's interpretation ("visual ideas and touch ideas are just totally different in kind") is an oversimplification of Locke's explicit reasoning *in this passage*.
      *   **The Common Mechanism:** In *both* cases, Locke is arguing that **perception requires learned associations (judgments based on habitual custom/experience) to interpret raw sensory data.** He explicitly frames Molyneux's problem as an *extension* of the globe example, using the phrase "To which purpose I shall here insert..." linking them directly.
      *   **Globe Example:** Experience links the *visual pattern of shading* to the *tactile/conceptual idea of 3D convexity* (within the *same* sense, vision). The judgment *interprets* the shading as depth.
      *   **Molyneux Problem:** Experience is needed to link the *tactile sensation of a cube* (unequal pressure from angles) to the *visual sensation caused by a cube* (a specific pattern of lines, angles, shading). The judgment *cannot yet interpret* the visual pattern as "cube" because the association hasn't been learned.
      *   **Locke's Key Phrase:** "**he has not yet obtained the experience, that what affects his touch so or so, must affect his sight so or so**". This is *precisely* about the **lack of the habitual custom/judgment link** between the modalities. It's not that the ideas are metaphysically different *kinds* in a way that *prevents* linkage; it's that the *specific empirical correlation* hasn't been established *yet*. The mechanism for building the link (experience leading to habitual judgment) is the same as in the globe example.

  2.  **Does the "habit not built up yet" story create tension with shape being a "common sensible"?**
      *   **Yes, there is a tension, but Locke likely has a way to resolve it (though it might feel unsatisfying).** You've identified a crucial point often debated by scholars.
      *   **The Tension:** Locke elsewhere (e.g., Book II, Ch. V) classifies shape (figure) as a *primary quality* – a quality inherent in the object itself (like solidity, extension, motion/number). Crucially, he argues primary qualities are perceivable by more than one sense. The blind man *does* have the idea of "cube" (from touch), and shape *is* a property accessible to both sight and touch. So why can't he recognize the visually presented cube *as* the cube he knows tactilly? Shouldn't the *idea* of "cube" be the same?
      *   **Locke's Likely Resolution (Implied in the Passage):**
          *   **Ideas are Sensory-Specific:** While the *property* (cube-shape) exists in the object, the *ideas* we have of it are tied to the specific senses. The idea of "cube" obtained *by touch* is a complex idea built from sensations of pressure, resistance, motion, and spatial relationships *felt* by the hand. The idea of "cube" obtained *by sight* is a complex idea built from sensations of light, color, and spatial relationships *seen* by the eye. These are two distinct sets of sensory ideas.
          *   **The Abstract Idea is Built from Both:** Locke *does* think we can form an *abstract* idea of "cube" that isn't tied to any specific sense. However, forming this abstract idea *requires* having sensory input from *both* modalities (or at least, experience correlating them). The newly-sighted man hasn't had the experience necessary to *connect* his tactile cube-ideas with the visual sensations now bombarding him. He hasn't learned *which* visual pattern corresponds to *which* tactile pattern.
          *   **The Bridge Requires Experience:** Having the tactile idea and the visual sensations isn't enough. He needs the *experience* that *this specific tactile pattern* = *that specific visual pattern* = the abstract idea "cube". This is the "habitual custom" link Molyneux and Locke say is missing. The "common sensible" property (shape) is only *recognized* as common *after* experience correlates the distinct sensory ideas from each modality.
      *   **The Analogy:** Think of the abstract idea "cube" as a central hub. The tactile sensations form one spoke, the visual sensations form another spoke. The newly-sighted man has the tactile spoke firmly attached to the hub, and he has raw visual sensations at the end of the other spoke, *but the visual spoke isn't connected to the hub yet*. The experience of correlating touch and sight is what forges that connection. The "common sensible" exists at the hub, but reaching it from a new sensory pathway requires building the link.

  **Conclusion:**

  1.  **Mechanism:** You are right. Locke's explicit reasoning for the "no" answer in the Molyneux problem is **the same mechanism** as the globe example: perception relies on **learned judgments (based on habitual custom/experience)** that interpret raw sensory data. The blind man fails because he lacks the specific experience linking *how* the tactile sensations he knows correlate with *how* the visual sensations appear. It's about the absence of the associative link, not an absolute barrier between fundamentally different idea-kinds. Leo's "totally different in kind" argument is closer to later philosophers (like Berkeley) who took Locke's empiricism further in an idealist direction.
  2.  **Tension with Common Sensibles:** There is a tension, but Locke resolves it by emphasizing that while shape *is* a property of the object accessible to multiple senses, the *ideas* produced by each sense are distinct sensory packages. Recognizing that these distinct sensory packages *represent the same property* requires the **empirical correlation** provided by experience. The blind man has the tactile idea and the abstract idea built from touch, but he cannot yet *recognize* the visual sensations as *signifying* that abstract idea. The "common sensible" aspect only becomes functional *after* the associative link is formed through experience.

  Your grasp of the core issue – the link between the globe example and Molyneux, and the potential conflict with common sensibles – is excellent. The 17th-century prose is dense, but you've identified the critical philosophical moves Locke is making. Your dinner argument was heated because this *is* a genuinely tricky and profound point about the nature of perception and experience!
