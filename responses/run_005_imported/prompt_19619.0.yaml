  I'm a retired chemist who's fallen down a philosophy rabbit hole lately, and I keep getting stuck on Al-Ghazali's argument (from the Incoherence of the Philosophers) that fire doesn't actually cause cotton to burn -- that the burning is just something God habitually creates alongside the fire touching the cotton, and there's no necessary connection between the two since all we ever really observe is them occuring together, never any actual necessitating power. Forty years of thinking about combustion and this dumb little example still gets under my skin. I know Averroes went after this exact case in his rebuttal (which has the great title "The Incoherence of the Incoherence"), defending real causal powers in things and warning that Ghazali's view would make science impossible -- but every summary I find just states each guy's position and moves on instead of making them actually argue. Could you write me a dialogue between Ghazali and Averroes hashing out the fire-and-cotton case specifically, where each one has to respond to the other's strongest point instead of just restating his own? I want to see whether Averroes actually has an answer to the epistemic bit (that we never observe necessitation itself, only constant conjunction) or if he's ultimately just insisting causal powers are real because the alternative seems absurd.
