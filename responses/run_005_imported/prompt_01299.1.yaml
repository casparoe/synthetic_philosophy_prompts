answer: |-
  That's a *fascinating* and incredibly timely ethical dilemma you've hit upon. Your sister is absolutely onto something real and defensible. It's not mere squeamishness; it touches on profound philosophical and ethical distinctions. Here's a breakdown of why her feeling has weight:

  1.  **The Shift from "Health" to "Enhancement" (or "Optimization"):**
      *   **Disease Screening:** This is firmly rooted in **medical necessity** and the principle of **non-maleficence** (do no harm). Preventing a child from suffering a debilitating, life-limiting disease is widely seen as a core parental and medical responsibility. It aligns with the goal of ensuring a basic level of health and well-being.
      *   **Cognitive/Height Prediction:** This moves squarely into the territory of **enhancement** or **trait optimization**. While cognitive ability *correlates* with certain life outcomes (academic, professional), it is not a *disease*. Selecting for higher predicted cognitive performance isn't about avoiding suffering or ensuring health; it's about conferring a perceived *advantage*. This crosses a significant line for many ethicists and individuals.

  2.  **Nature of the Traits:**
      *   **Disease Risk:** Often involves single genes or well-understood pathways with high penetrance (if you have the mutation, you get the disease). The outcome (disease) is usually binary and severe.
      *   **Cognitive Ability/Height:** These are **complex polygenic traits**. The predictions are based on aggregating thousands of tiny genetic variants (SNPs), each contributing a minuscule amount. The predictive power, while statistically significant in large populations, is **far from deterministic for an individual**. Environment (nutrition, upbringing, education, experiences, socioeconomic factors) plays a *massive* role. Selecting based on these scores involves a significant leap of faith about what the number *actually means* for *that specific child's* future.

  3.  **The "Expressivist" Argument:**
      *   Choosing an embryo specifically for a higher predicted IQ score sends a message, whether intended or not. It could be interpreted as valuing certain cognitive abilities over others, or implying that a child with a *lower* predicted score would be less desirable or valuable. This raises concerns about devaluing neurodiversity or different kinds of intelligence. Disease screening doesn't carry this same implication – avoiding Tay-Sachs doesn't devalue people without it; it simply avoids a horrific fate.

  4.  **Parental Expectations and Child Autonomy:**
      *   Knowing the "cognitive percentile" could profoundly shape parental expectations and investment from birth. This creates immense pressure on the child to "live up to their genes" and risks disappointment if the complex interplay of genes and environment doesn't produce the predicted outcome. It subtly shifts the focus from unconditional acceptance to conditional expectations based on a genetic prediction. Disease screening generally avoids this; the goal is health, not performance.

  5.  **The Slippery Slope (A Valid Concern Here):**
      *   Once you accept trait selection for cognitive ability, where do you stop? What about other non-disease traits predicted by polygenic scores: athleticism, musical aptitude, personality tendencies (risk-taking, empathy), or even physical appearance? Allowing cognitive selection fundamentally opens the door to a much broader and ethically murkier landscape of "designer embryos." Disease screening has a clearer, more defensible boundary.

  6.  **The Illusion of Certainty and Reductionism:**
      *   Relying on a percentile score for cognition reduces a profoundly complex human trait to a single number. It risks creating a false sense of certainty about a child's potential and oversimplifies the intricate dance of nature and nurture that shapes a human being. Disease screening, while sometimes probabilistic, usually deals with clearer, more catastrophic outcomes.

  7.  **Social Justice and Equity Concerns:**
      *   Widespread use of cognitive trait selection could exacerbate existing social inequalities. Access to expensive IVF with advanced screening is already limited. If it becomes a tool for conferring perceived cognitive advantages, it risks creating a genetic "arms race" favoring the wealthy, further widening societal gaps.

  **Addressing the "No DNA Touched" Argument:**

  Your sister is right that this is a different *kind* of choice, even though the technical mechanism (selecting among existing embryos) is the same as disease screening. The difference lies in the **intent, the nature of the trait, and the societal implications.**

  *   **Disease Screening Intent:** Prevent suffering, ensure basic health. Aligns with core medical ethics.
  *   **Cognitive Trait Intent:** Optimize for perceived advantage, potentially fulfill parental aspirations. Enters the realm of enhancement and social engineering.

  **Conclusion:**

  Your sister's "nagging feeling" is incredibly well-founded. She's intuitively recognizing a significant ethical boundary crossing. While disease screening prioritizes health and alleviation of suffering (a near-universal good), selecting for cognitive potential based on polygenic scores prioritizes optimization and perceived advantage, venturing into enhancement territory with profound implications for how we value human traits, shape parental expectations, and potentially structure society. It raises valid concerns about reductionism, expressivism, the slippery slope, and equity.

  **For your novel:** This is *rich* ground. Explore the characters' internal conflicts:
  *   The sister's ethical unease vs. the practical desire to give her child "the best chance."
  *   The husband's potential different perspective (maybe more utilitarian?).
  *   The pressure from the clinic presenting this "data" as valuable information.
  *   The societal whispers about "genetic potential."
  *   The future child's potential struggle with the weight of those expectations defined before they were even born.

  It's not squeamishness in a philosophy costume; it's a genuine grappling with a new frontier in human reproduction and what kind of choices we want to make there. Your sister is sensing that the *meaning* of the choice has fundamentally changed.
