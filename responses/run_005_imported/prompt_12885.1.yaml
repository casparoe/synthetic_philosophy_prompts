  Ok, I need help with a scene for the novel I'm drafting. My main character's brother has just been declared brain dead after a motorcycle crash, and out in the hallway his aunt — a retired ICU nurse who's read way too much on this over the years — is going at it with the attending doctor over whether he's actually, really dead yet, while the rest of the family waits to decide about organ donation. I don't want either of them to be an idiot: I want the doctor to lay out the real, serious case for why whole-brain death counts as death (not just "the law says so" but the actual reasoning about the brain and the organism as a whole), and I want the aunt to push back hard with the stuff that's actually out there about brain-dead bodies that keep healing wounds, fighting off infections, growing, even carrying a pregnancy for months — which she thinks blows a hole in his reasoning. Don't let the doctor just fold, I want him to have a real comeback. And don't let the aunt get away with treating circulatory death like it's some clean, obvious alternative either, since apparently that's messier than people think too once you get into how organ donation after cardiac death actually works. Can you write their whole back-and-forth, maybe 500-700 words, where they're actually responding to each others points and not just taking turns giving speeches?
