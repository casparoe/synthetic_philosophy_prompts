  I should break down both sides: Leibniz's argument and the objections. Highlighting possible counterarguments like relational properties (position in space/time) and haecceities (primitive thisness). Also, mention that in practice, their data schema's limitations mean duplicates can exist, but philosophically, the debate is ongoing.

