  • **Theoretical justification:** Correctly contrasts with conventional implicature (e.g., "but" vs. "and") and explains why tests support conversational status.  
  • **Full credit:** Exemplary application of both tests.  

  ***(d) Generalized vs. Particularized (2/4)***  
  • **Incorrect classification:** Argues it’s generalized ("almost anyone would conclude"), but this is actually **particularized**.  
  • **Why it’s particularized:** The inference relies on *specific contextual knowledge* (e.g., Jordan’s busyness explains non-reading). Generalized implicatures (e.g., "some" implying "not all") require no context.  
