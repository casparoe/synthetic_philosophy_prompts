  ***(b) Flouted Maxim & Flout vs. Violate (2/4)***  
  • **Correct identification:** Rightly cites the Maxim of Relation as flouted.  
  • **Critical error:** Reverses Grice’s definitions. *Flouting* is a deliberate, overt breach (as here) that signals implicature. *Violating* is covert deception (e.g., lying). The student incorrectly swaps these.  
