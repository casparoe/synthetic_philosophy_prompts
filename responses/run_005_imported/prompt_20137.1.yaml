answer: |-
  ## The Non-Fatalist Toast for Priya & Marcus

  *(Clink glass gently. Warm, genuine smile.)*

  Friends, family, Marcus’s colleagues… and Priya’s logic-and-language cohort… *(knowing glance towards the academics)* …welcome. As Priya’s oldest friend from undergrad, it’s an honour to toast her and Marcus. Though, I must confess, preparing this felt… unusually high-stakes. Because when your friend has spent ten years meticulously dismantling fatalist dinner party jokes and wrote her *dissertation* on Aristotle’s sea battle… well, let’s just say the pressure to avoid philosophical landmines is real. Priya, if I accidentally imply your future is already ‘written in the stars,’ I know you’ll raise an eyebrow sharper than Occam’s razor. *(Gentle chuckle from the room, especially the academics.)*

  So, Aristotle asks: *Will there be a sea battle tomorrow?* Seems simple. But is that statement *true* today? Is it *false*? Or is it… indeterminate? Does declaring it true *now* mean the admirals are mere puppets, the ships already locked in inevitable collision? Priya taught us – forcefully, and probably with diagrams – that Aristotle wasn’t selling fatalism. Saying “It *will* happen” doesn’t magically chain the future. The admirals still deliberate. The winds still shift. Contingency reigns! The *truth* about tomorrow isn't settled *today*; it’s waiting down the temporal road. *(Nods from the academic section; families lean in, intrigued by the story.)*

  Now, apply this to Priya and Marcus. If I stand here and say, “They were *always* destined to meet!” or “Their happiness was *inevitable*!”… *(shakes head, mock-warning look)* ...Priya would rightly point out I’ve smuggled in a sneaky sea battle. I’d be implying their beautiful, complex journey – the late-night coffees, the shared laughter, the conscious choices, the navigating of life’s storms – was just a pre-scripted play. That Marcus proposing wasn’t a thrilling leap of faith, but a line delivered on cue. And we all know that’s not how this incredible story unfolded. *(Warm smile at the couple.)*

  But here’s where Aristotle – *and* Priya’s brilliant work on how we talk about the future – actually gives us the *perfect* way to celebrate them. Because rejecting fatalism isn’t about uncertainty or pessimism. It’s about affirming the *power* of the open future. It’s about the space where possibility lives.

  Think of it like this: Standing here today, looking at Priya and Marcus, what can we say about *their* future? The strict Peircean might say, "Right *now*, 'Priya and Marcus will be happy' isn't strictly true *or* false. It’s open!" *(A few knowing smirks from the academics.)* But the Ockhamist, perhaps, sees a ‘thin red line’ – the *actual* future unfolding – where their happiness is becoming true *as they live it*. And maybe a supervaluationist sees all the *possible* wonderful futures branching out, and across *all* the reasonable ways we might define "happy," that statement comes out **true** in *every single one* compatible with who they are and the love they’ve built. *(Academic section appreciates the nuance; families hear "they're going to be happy.")*

  Priya, your work reminds us the future isn’t a locked box. It’s a vast ocean of possibilities. But Marcus, seeing you two together? It’s like watching master navigators. You’ve charted a course built on deep respect, shared values, incredible kindness, and a love that’s both grounding and exhilarating. You haven’t found inevitability; you’ve built something far more powerful: **inexhaustible potential**.

  So, we don’t toast today because their future happiness is a *necessary truth*. We toast because, looking at the open sea before them, considering the sailors they are, the ship they’ve built together, and the compass they share… *(raise glass higher)* …every reasonable valuation of the future, every possible timeline branching from this joyous moment, *supervaluates* to one brilliant outcome: a life profoundly well-lived, together.

  Priya, Marcus – May your voyage be long, your seas be kind (mostly), and your choices, as always, be freely and wonderfully your own. May the truth about your happiness become ever more beautifully definite, one shared sunrise, one solved problem, one burst of laughter at a time. To the open future, and the brilliant certainty of your love within it!

  **To Priya and Marcus!**

  *(Clink! Applause. The philosophers got the supervaluationist joke. The families heard "they'll be happy." Priya isn't cringing. Mission accomplished.)*
