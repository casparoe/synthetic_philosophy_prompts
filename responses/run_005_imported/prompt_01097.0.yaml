answer: |-
  ## The Unfinished Argument: A Dialogue Between P.F. Strawson and Galen Strawson

  **Setting:** A quiet study in Oxford, bookshelves lining the walls. Rain taps against the window. P.F. Strawson (PFS) sits in a worn armchair, a pipe resting nearby. Galen Strawson (GS) leans against a desk, a copy of "Freedom and Resentment" open in his hands.

  **GS:** Father, I keep returning to this passage: "What I want to contrast is the attitude (or range of attitudes) of involvement or participation in a human relationship, on the one hand, and what might be called the objective attitude... on the other." It’s compelling, truly. You shift the ground entirely away from metaphysics to our lived, interpersonal reality. But… I worry it sidesteps the very question that haunts me.

  **PFS:** Sidesteps? I aim to *dissolve* it, Galen. To show the traditional metaphysical debate – determinism vs. libertarianism – is ultimately irrelevant to the actual practice of holding people responsible. Our reactive attitudes – resentment when slighted, gratitude for kindness, indignation at cruelty – aren’t conclusions drawn *from* a metaphysical theory. They are the *foundation* upon which the very concept of responsibility is built. They are constitutive of seeing others as persons, not objects.

  **GS:** I understand the move. It’s elegant. We *do* feel these things, inevitably. We *can’t* fully adopt the objective stance towards everyone all the time without ceasing to be social beings. But that’s precisely my concern. You’re describing a psychological and social *necessity*, not providing a *justification* for the core idea of *desert*. You say being morally responsible *just is* being an appropriate target of these attitudes within our form of life. But my Basic Argument asks: *Can anyone ever truly **deserve** to be the target of those attitudes, in the deepest sense?* Does the mere fact we *have* the attitudes answer that?

  **PFS:** It answers it in the only way it *can* be answered, Galen. Just as Hume showed we cannot step outside induction to justify induction rationally – we can only point to its indispensable role in navigating the world – we cannot step entirely outside the participant stance to justify it. The demand for an external, metaphysical justification for desert *itself* presupposes a standpoint we cannot occupy without ceasing to be participants in human relationships. The "justification" *is* the stance itself and its role in making human life possible. To ask "But do they *really* deserve it?" from outside that stance is like asking "But is induction *really* rational?" from a perspective that rejects all inductive inference. The question loses its grip.

  **GS:** But Hume’s point about induction is about *predicting the future*, about epistemic practices concerning the *non-rational* world. My argument is about *moral responsibility*, about *justice*, about what people *ultimately deserve* based on their actions. These are normative concepts, laden with notions of fairness and intrinsic worth. Simply pointing to a psychological tendency or social practice doesn't seem sufficient to ground the *normative weight* of desert. We feel resentment, yes. But *should* we, if the agent, in the final analysis, wasn't the ultimate originator of their character and choices?

  **PFS:** The "should" you invoke, Galen – where does *it* come from? Isn't it itself born *within* the participant stance? Our judgments of fairness, our sense of justice, our very concept of 'should' in the moral realm, are *expressions* of the reactive attitudes and the expectations they entail. To demand a justification for desert from a perspective that strips away the very soil in which the concept of 'should' grows is to ask an impossible question. It’s not that the attitudes are merely inevitable; they are *constitutive* of the moral dimension you seek to ground. Without them, there *is* no 'desert' to justify or condemn.

  **GS:** That feels perilously close to saying "We feel it, therefore it's justified." Or worse, "This practice is necessary for social cohesion, therefore the blame it assigns is truly deserved." But necessity isn't desert. Imagine a society that *must* scapegoat innocents to function. Does the necessity make the scapegoat *deserve* their fate? Of course not! My point is that for blame or praise to be *ultimately* fair, for the agent to be the *true source* of their praiseworthy or blameworthy qualities in a way that grounds desert, they would need to be *causa sui*. They would need to have created themselves – their core values, dispositions, and capacities – from nothing. And that’s impossible. Whether determinism is true or not, the chain of causation leading to who we are and what we do always stretches back beyond our control. Your participant stance explains *why we hold people responsible*, but it doesn't show how they can be *ultimately responsible* in the sense required for true, non-instrumental desert.

  **PFS:** And I contend that "ultimate responsibility" in *that* metaphysical sense is a chimera, Galen. A philosopher’s fiction. It’s not a requirement embedded within our actual practices of holding responsible. When we resent a friend's betrayal, we aren’t tacitly assuming they created themselves *ex nihilo*. We are responding to *them*, as we know them, within the web of expectations and demands that constitute our relationship. The question "Did they *ultimately* create their own character?" simply doesn’t arise within that stance. It only arises when we adopt the external, theoretical perspective you favour – the perspective which, as I argued, we cannot *live* within consistently.

  **GS:** But doesn't that mean the desert assigned within the participant stance is… *provisional*? Or perhaps *fictional*, in a necessary way? Like a useful myth? If the metaphysical condition for true desert is impossible, then the blame we feel, however natural and socially necessary, isn't *really* deserved in the deepest sense. It's a response to an agent who, through no fault or merit of their *own* ultimate making, happens to have the character that caused the harm. Your stance explains the *phenomenology* and the *social function*, but it doesn't answer the *normative* challenge: Is the resentment *warranted* by the agent's *ultimate* relation to the act, or is it merely an inevitable emotional reaction to a stimulus?

  **PFS:** You keep wanting to split the agent from their character, Galen, to find some core self *behind* the character that could be the ultimate author. But there is no such core self accessible to us, or relevant to our practices. The agent *is* their character, as manifested in their actions and responses. To hold them responsible *is* to respond to that manifestation within the relational context. The "warrant" *is* the appropriateness of the attitude *within the participant perspective*. There is no deeper, perspective-independent warrant to be found. Trying to find it is like trying to find the justification for induction outside of any inductive framework – it’s a quest for an impossible Archimedean point.

  **GS:** And you keep retreating to the *inevitability* and *constitutive* nature of the stance to deflect the normative question. But the fact that a perspective is inescapable for practical purposes doesn't mean it delivers *truth* about desert. It might deliver a *necessary fiction*. We *must* use induction, but we cannot prove its ultimate rationality. We *must* employ the participant stance, but perhaps we cannot prove that the blame it assigns is *ultimately* deserved. My Basic Argument suggests we *can* prove the opposite: that such ultimate desert is *impossible*. Your comparison highlights the inevitability, Father, but it doesn't bridge the gap to justification when the very possibility of the thing to be justified is under attack. The attitudes exist, powerfully. But do they track a *truth* about desert, or are they powerful *illusions* necessary for human life? That’s the question your dissolution seems to leave hanging.

  **PFS:** (Sighs, tapping his pipe thoughtfully) Then we reach an impasse, Galen. For me, the "truth about desert" *is* constituted by the appropriateness of the reactive attitudes within the form of life that makes us human. To call it an "illusion" presupposes a standard of truth – that ultimate, *causa sui* responsibility – that is itself incoherent and irrelevant to our actual moral concepts. You see a gap between practice and a metaphysical ideal. I see that ideal as a will-o'-the-wisp, leading us away from understanding the only kind of responsibility that actually exists and matters: the responsibility grounded in our inescapable reactions to each other as persons. We can suspend it clinically in specific cases – the objective attitude – but we cannot abolish it as a whole without abolishing human society itself. That necessity isn’t just pragmatic; it’s woven into the meaning of responsibility itself.

  **GS:** And I see that necessity as tragically coexisting with a deep metaphysical lack. We are condemned to hold each other responsible, to feel resentment and gratitude, to structure our lives around desert, even though no one can ever *ultimately* deserve anything. The attitudes are real, powerful, necessary... and yet, they point towards a form of desert that is, in the final reckoning, unattainable. We live the stance, Father, but my argument suggests we cannot, in good philosophical conscience, believe it delivers the ultimate justification it seems to promise. The rain hasn't stopped, has it? It feels like our conversation hasn't either. We just see the water falling from fundamentally different heights.

  **PFS:** (Looks out at the rain, then back at Galen) Perhaps not stopped. But perhaps we understand its nature, and our own place in it, a little differently. The conversation continues, Son. It always does. Pass me that book, would you? Let's see precisely where you think I went wrong... again.

  **(The dialogue ends with the core disagreement clarified: P.F. Strawson maintains the reactive attitudes define and justify desert within the only framework that matters (the participant stance), rendering the demand for ultimate responsibility incoherent and irrelevant. Galen Strawson concedes the attitudes' inevitability and social necessity but argues they cannot confer *true* desert because the metaphysical precondition (ultimate self-creation) is impossible, leaving the attitudes as necessary fictions. Neither has conceded ground; the tension between the inescapability of the practice and the impossibility of its deepest metaphysical justification remains unresolved.)**
