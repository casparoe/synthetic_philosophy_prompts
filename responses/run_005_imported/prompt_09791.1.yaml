  User's phrasing—"dressed up in felicific-calculus language"—makes me think they suspect Bentham is just a proto-Mill. But no: the philosophical machinery is distinct. Bentham is ruthlessly consequentialist; Mill builds a deontic fence within utilitarianism. That contrast seems worth highlighting for their footnote.
answer: |-
  That's a sharp observation! You're absolutely right that Bentham's arguments in the "Offences Against One's Self" manuscripts (written c. 1785, published 1978) are remarkably radical and permissive compared to *anything* Mill published, and even compared to Mill's *On Liberty* (1859). While both arrive at toleration for private, consensual "paederasty" (and other non-procreative acts), the **philosophical engines driving them are distinctively different, reflecting core differences in their utilitarianism.**

  Here's a breakdown comparing the arguments:

  **1. Bentham's Argument (Based on Rejection of Antipathy & Hedonic Calculus):**

  *   **Core Premise:** The *only* legitimate grounds for punishment/criminalization is the **prevention of specific, tangible harms** (pain, loss of security, property, etc.). Mere feelings like disgust, indignation, or "antipathy" are **not harms** in the utilitarian sense and cannot justify inflicting the *real harms* of punishment.
  *   **Rejection of "Antipathy" as Justification:** Bentham meticulously dissects arguments based on "corruption of morals," "offense to God," "indecency," or "weakening of marriage." He argues:
      *   These are expressions of *aversion* or *disgust*, not demonstrable harms.
      *   Criminalizing acts based on antipathy *creates* immense new harms: punishment, blackmail, ruined lives, fear, hypocrisy.
      *   There's no evidence consensual private acts *actually cause* the alleged indirect harms (like societal collapse).
  *   **Hedonic Calculus Applied:**
      *   **Act Itself:** Consensual sex acts produce pleasure for the participants (a positive utility).
      *   **Disgust of Others:** The disgust felt by those *not involved* is a *pain*, but it's:
          *   **Indirect & Speculative:** Often based on imagination, not direct experience.
          *   **Avoidable:** People can choose not to think about private acts.
          *   **Lesser Pain:** Compared to the severe pains inflicted by punishment (imprisonment, execution, stigma).
      *   **Punishment:** Inflicts massive, concrete pains (loss of liberty, life, reputation, livelihood) on individuals and costs on society.
      *   **Net Utility Calculation:** The pleasure gained *plus* the avoidance of punishment's massive pains **far outweighs** the diffuse, avoidable pain of others' antipathy. Criminalization creates a huge net *loss* of utility. Toleration yields a net gain.
  *   **Distinctively Utilitarian:** This is **pure act-utilitarian cost-benefit analysis.** Bentham weighs *all* pleasures and pains (including the "pain" of disgust) on the same scale. His conclusion flows directly from the calculus: criminalizing consensual sodomy produces more pain than it prevents.

  **2. Mill's Harm Principle (On Liberty):**

  *   **Core Premise:** "The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others." Self-regarding actions are sacrosanct.
  *   **Rejection of Disgust/Offense:** Mill explicitly states that mere dislike, disgust, or moral disapproval of another's purely self-regarding conduct is **not** "harm" in the relevant sense. It cannot justify interference.
  *   **Focus on Liberty & Autonomy:** While grounded in utility (human flourishing requires liberty), Mill's principle creates a **protected sphere of individual sovereignty.** The *right* to pursue one's own good in one's own way, free from coercion based on others' opinions, is paramount *within that sphere*.
  *   **"Harm" Defined Narrowly:** Harm means direct, tangible injury to the "permanent interests" of others (security, property, rights). Offense to feelings, shock to sensibilities, or alleged "spiritual harm" do not count.
  *   **Net Utility Calculation?** Mill *implies* that respecting liberty leads to greater long-term utility (progress, individuality, human development). However, **he does *not* weigh the pleasure of the act against the pain of disgust within the principle itself.** The harm principle acts as a **deontic barrier:** If an act is truly self-regarding (no harm to others), it is *automatically* protected, *regardless* of the intensity of others' disgust or the magnitude of the actor's pleasure. The disgust is simply *irrelevant* to the justification for interference.
  *   **Distinctively Millian:** This incorporates utilitarianism but **fuses it with a strong liberal commitment to individual rights and autonomy.** It's a rule designed to maximize long-term utility by protecting a fundamental sphere of freedom.

  **Key Differences & Whether Bentham Collapses into Mill:**

  1.  **Treatment of Disgust:**
      *   **Bentham:** Acknowledges disgust as a *real pain* but argues its weight is vastly outweighed by the pains of prohibition and the pleasures of the act. He *engages* with the disgust argument on utility grounds.
      *   **Mill:** Declares disgust categorically *irrelevant* as a justification for interference. It's dismissed at the door of the harm principle. He doesn't (within the principle) weigh it against anything.
  2.  **Mechanism:**
      *   **Bentham:** **Direct Act Utilitarianism.** Prohibition fails the utility test because it causes more pain than it prevents. Toleration passes because it maximizes net pleasure/minimizes net pain.
      *   **Mill:** **Rule Utilitarianism/Liberal Principle.** A *rule* protecting self-regarding acts is justified because it fosters essential goods (liberty, individuality) crucial for long-term utility. The harm principle *defines* the scope of the rule.
  3.  **Scope & Wildness:**
      *   Bentham's calculus, applied consistently, could potentially justify acts Mill might exclude *if* they caused no tangible harm but produced great pleasure (e.g., certain public acts, complex consenting arrangements). Bentham's argument is potentially *more permissive* because it relies purely on net utility, not a predefined sphere of the "self-regarding." Mill's principle offers a clearer (though debatable) boundary.
  4.  **Collapse?** **No, they don't fully collapse.** While both reject disgust as grounds for prohibition, Bentham *argues against it within the utilitarian calculus*, while Mill *excludes it from consideration* via a prior principle defining the limits of social authority. Bentham's argument is **explicitly and solely utilitarian cost-benefit.** Mill's harm principle introduces a **distinct, liberty-protecting rule** justified *by* utility but operating as a quasi-rights-based barrier. Mill's principle is more elegant and politically focused on limiting state power; Bentham's is more ruthlessly consistent in applying the utility metric to *all* sensations.

  **Conclusion:**

  Bentham's argument is **distinctively and foundationally utilitarian.** It proceeds by meticulously applying the hedonic calculus: criminalization based on antipathy creates demonstrable, severe pains that vastly outweigh the diffuse pains of disgust and the foregone pleasures of the act. The rejection of antipathy is *part* of this calculus, showing it fails as a justification for inflicting real harm.

  Mill's harm principle, while ultimately justified by utility, **transcends direct calculation in its application.** It establishes a protective boundary *before* the calculation of pleasures and pains related to others' opinions. Disgust is not weighed and found wanting; it is declared inadmissible as evidence of "harm."

  Bentham gets there earlier and more radically through a relentless application of utility *to everything*, including the sensation of disgust. Mill gets there by defining a sphere of individual sovereignty where utility calculations based on others' feelings simply don't apply. Both reach tolerance, but Bentham's path is pure, unadulterated act-utilitarianism, while Mill's incorporates a vital liberal principle derived *from* utility but functioning as a distinct shield. Bentham's argument doesn't just dress up Mill's reasoning; it *is* the core utilitarian engine that Mill later encases within a more politically robust framework.
