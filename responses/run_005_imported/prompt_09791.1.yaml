  Hmm, the user is writing an academic footnote but seems excited by the philosophical tension they've noticed—that wild permissiveness in Bentham compared to Mill. They might be looking for a crisp conceptual distinction to highlight in their paper. The footnote context suggests they need precision but also something rhetorically punchy. 

  Let me unpack both arguments systematically. Bentham's core move is rejecting "antipathy" as irrational, then applying his calculus: if an act produces more pleasure than pain *without causing tangible harm*, banning it creates *new* suffering (punishment, stigma) for no benefit. It's a pure utility equation—no inherent wrongness, just cost-benefit analysis. 

  Mill's harm principle feels different. He draws this moral boundary: society can only interfere to prevent harm to others. The disgust of onlookers? Irrelevant. But he *doesn't* frame it as "because the pleasure outweighs the disgust." It's about rights, not arithmetic. 

