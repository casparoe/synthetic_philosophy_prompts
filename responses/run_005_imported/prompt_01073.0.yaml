  ## Hobbes's Geometric Commonwealth: Does the Squared Circle Undermine the Leviathan?

  Your argument with Theo cuts to the heart of Hobbes's ambitious philosophical project: the transformation of civil philosophy into a science as certain as geometry. To settle this, we must first reconstruct Hobbes's argument in its strongest form, then rigorously examine whether the Wallis debacle serves as relevant counter-evidence or merely a personal embarrassment.

  **Hobbes's Argument: Construction as the Source of Certainty**

  Hobbes's core claim, articulated forcefully in *Six Lessons to the Professors of the Mathematiques* (1656) and foundational works like *De Corpore* (1655), rests on a powerful epistemological principle:

  1.  **The Ground of Geometric Certainty:** Geometry achieves absolute, demonstrative certainty *not* because it describes pre-existing Platonic forms, but because its objects are *artifacts of human reason*. We define points, lines, circles, and figures through precise definitions. We generate them through stipulated operations (drawing a line between two points, rotating a line to form a circle). Because we *make* these objects according to our own definitions and rules, we possess complete knowledge of their generation and properties. We can reason deductively from these definitions and generative operations to incontrovertible conclusions. As Hobbes states in *Six Lessons*: "Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves; and civil philosophy is demonstrable, because we make the commonwealth ourselves."

  2.  **The Analogy to Civil Philosophy:** The commonwealth, Hobbes argues, is fundamentally similar. It is not a natural growth or divine ordinance, but a *human artifact*. Individuals, driven by the fear of violent death and the desire for peace in the State of Nature, rationally *construct* the Leviathan through a covenant. They *define* its core elements: the Sovereign (one man or assembly), the Subjects, and the fundamental Laws of Nature (seeking peace, keeping covenants, etc.). The Sovereign's power and the rights/duties of subjects are *generated* by the act of authorization in the covenant.

  3.  **The Claim to Demonstrative Certainty:** Because the commonwealth is *made* by us according to rationally constructed definitions and principles (the Laws of Nature), we possess the same privileged access to its logic and necessary consequences as we do with geometric figures. Political truths, Hobbes contends, can be deduced with geometric rigor from the definitions of the state of nature, the covenant, sovereignty, and subjection. Just as we know a triangle's angles sum to 180 degrees because we constructed it from straight lines, we know rebellion is self-contradictory because it violates the very covenant that creates the subject's obligation to obey the sovereign they authorized.

  **In its strongest form, Hobbes's argument is compelling:** It offers a clear, materialist, and rationalist foundation for political science. If the state is truly a human construction based on universal principles of human nature and rational self-preservation, then deducing its necessary properties *should* be possible. The analogy highlights the active, artificial nature of political order, contrasting it with passive observation of natural phenomena.

  **The Wallis Debacle: Relevant Evidence or Unfortunate Stain?**

  Theo is correct that a personal failure in a specific geometric construction doesn't *directly* refute the general epistemological principle. One can hold that "construction grants privileged knowledge" while simultaneously being spectacularly wrong about *what* one has constructed in a specific instance. Wallis demolished Hobbes's *particular attempts* to square the circle, not the *idea* that we understand circles because we define and generate them.

  **However, the Wallis debacle is not merely an unrelated personal failing. It provides *highly relevant evidence* about the *practical application* and *potential pitfalls* of Hobbes's own method, directly undermining his claim for geometric certainty in civil philosophy. Here's why:**

  1.  **Hubris of Construction:** Hobbes's fundamental error was assuming that *because* he understood the *definition* of a circle and a square, and *because* he could generate them, he could necessarily find a ratio between them using only compass and straightedge (the classical requirement). He conflated understanding the *generation* of individual figures with the ability to *construct* a complex, specific relationship *between* them. Similarly, in politics, understanding the definitions of "sovereign," "covenant," and "subject" does not guarantee the ability to deduce *all* complex political relationships and contingencies with geometric certainty. Hobbes's political theory often assumes a level of rational clarity and control over definitions that the messy reality of human passions, interpretations, and unforeseen circumstances constantly undermines. The circle-squaring failure exemplifies the hubris of believing construction guarantees mastery over *all* problems derived from the constructed objects.

  2.  **Ignoring Counter-Evidence & Dogmatism:** For over two decades, Wallis presented rigorous mathematical proofs showing the impossibility of Hobbes's constructions and the irrationality of pi. Hobbes didn't engage with the mathematical substance; he dismissed Wallis as malicious, ignorant, or pedantic, clinging stubbornly to his initial flawed constructions. This reveals a critical flaw: **a profound resistance to falsification based on the conviction that his foundational principles *must* be correct.** This same tendency permeates his political philosophy. Once Hobbes deduces absolute sovereignty from his definitions and the state of nature, *all* counter-evidence (historical examples of stable non-absolutist regimes, arguments for rights resisting sovereign power) is dismissed as irrational, illogical, or stemming from a misunderstanding of his definitions. The Wallis episode demonstrates that Hobbes's "demonstrative" method, *as he practiced it*, was prone to becoming a closed system immune to empirical or logical refutation when its core axioms were challenged – a fatal flaw for any claim to scientific certainty.

  3.  **The Gap Between Definition and Reality:** Hobbes insisted his geometric constructions *were* the true circle and square, despite their demonstrable failure to meet the required relationship. He privileged his *act of construction* over the *logical consequences* that proved it wrong. In politics, the danger is analogous: Hobbes privileges his *definitional construction* of sovereignty (absolute, undivided, authorized) over the messy realities of how power actually functions, how consent is maintained or lost, and how institutions evolve. The claim that we "make" the commonwealth ourselves is an abstraction; its actual operation involves countless individuals with conflicting interpretations of the "definitions" Hobbes lays down. The circle-squaring debacle highlights Hobbes's tendency to mistake the clarity of his *own definitions and constructions* for a complete and infallible grasp of the complex realities they aim to describe or generate.

  **The Verdict: A Shared Flaw Exposed**

  The Wallis debacle is **not** irrelevant. It provides **concrete, damning evidence** against Hobbes's *application* of his "construction grants certainty" principle and exposes a **critical shared flaw** that directly undermines his claim for geometric certainty in civil philosophy:

  *   **Flaw X (Shared): The Dogmatism of Construction:** Hobbes fundamentally confuses the *clarity and certainty achievable within a defined, closed system* (like basic Euclidean geometry dealing with properties *directly* generated from definitions) with the *infallibility of his own reasoning* when tackling complex problems *derived from* or *applying* those definitions. His method, *as practiced*, exhibits a hubristic resistance to falsification. Once he "constructs" an idea (a geometric relationship, an absolute sovereign), he treats it as immune to counter-argument, dismissing contrary evidence as error or malice rather than engaging with it substantively. This dogmatism is evident in both the futile circle-squaring attempts and the rigid, often unrealistic, deductions of *Leviathan*.
  *   **Not Flaw Y (Geometric Principle Itself):** The core principle – that we have privileged knowledge of things we construct according to our definitions – remains logically coherent *in the abstract*. Theo is right that this principle must be evaluated on its own merits for politics.

  **Therefore, the Wallis debacle decisively weakens Hobbes's *specific claim* that his civil philosophy achieves the *same level of demonstrable certainty* as geometry.** It does so by revealing a persistent methodological flaw – **the conflation of definitional clarity with infallible deduction and a dogmatic resistance to falsification** – that is demonstrably present in both his failed geometric endeavors *and* his political theorizing. While the core analogy has intellectual force, Hobbes's own disastrous attempt to wield geometric certainty in geometry itself proves that his *execution* of the method is fundamentally flawed and prone to generating false certainty. His political "demonstrations" are thus tainted by the same hubris and methodological weakness spectacularly exposed by Wallis. The circle wasn't squared, and the certainty claimed for the Leviathan is similarly unattainable by Hobbes's own lights.

  **Go back to Theo with this:** "Hobbes's principle *sounds* strong, but the Wallis saga isn't just an oopsie. It's a live demo of *how* his method actually fails: he gets high on his own definitions, ignores any proof he's wrong, and digs in. That exact same dogmatic blind spot – mistaking the clarity of his *idea* of sovereignty for perfect knowledge of *all* politics – is why his 'geometric certainty' in civil philosophy is just as illusory as his squared circle. The flaw isn't the principle in a vacuum; it's how his brain *used* the principle in both cases."
