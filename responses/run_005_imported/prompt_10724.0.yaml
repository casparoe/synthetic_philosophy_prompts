prompt: |-
  I'm the family rep on the ethics committee at my mom's memory-care facility (no medical background -- they just wanted somebody from the families on it). Management wants to bring in an AI system that watches residents' behavior all day, what they flinch from, what they reach for, how they react to different staff, and builds a "preference profile" that caregivers are supposed to follow, even when it overrides the written care plan the resident set up years ago while still lucid. Half the committee says residents are calmer now that the AI has "figured out" what they actually want; the other half says you can't tell a real preference from plain confusion or fear in someone with dementia just by watching them, and that the lucid version of my mom who signed that plan should still get the final say over the version of her walking around now. We vote next week -- approve the pilot, approve with limits, or reject it -- and i have to write the memo. I want an actual recommendation, not a "let's study it more" dodge, and i want whichever side we don't go with to get a fair, serious case made for it, not just a brush-off.
reasoning: |-
  Okay, the user is a family representative on an ethics committee at a memory-care facility. They need to write a memo recommending whether to approve an AI system that monitors residents' behavior to create preference profiles. The system might override pre-existing care plans set when residents were lucid. The committee is split: some say the AI helps residents stay calmer, others argue you can't distinguish real preferences from confusion in dementia patients.

  First, I need to understand the core ethical dilemmas here. Autonomy is a big one. The resident's past competent self made decisions in their care plan. But current behaviors might indicate changed preferences. However, dementia can cause confusion, so are those reactions genuine preferences or just symptoms? Then there's consent. Residents now can't consent to being monitored by AI. Their past consent covered the care plan but not this new system. Beneficence vs. non-maleficence: the AI might reduce distress, but overriding the care plan could disrespect the resident's past wishes. Also, the AI's accuracy is questionable—can it really interpret behaviors correctly in dementia patients?

  The user wants a clear recommendation, not a "study more" approach. They also want fair arguments for both sides. So the memo needs to balance ethical principles with practical outcomes. The options are approve, approve with limits, or reject.

  Looking at the options. Approving outright seems risky because of the ethical issues. Rejecting might ignore potential benefits. Approving with limits could be the middle path. What limits? Maybe only using the AI to inform care, not override the care plan. Or requiring family consent. Also, validating AI findings with staff and family input. Ensuring opt-out options and transparency.

  The user's role as a family rep adds another layer. They might relate personally, thinking about their mom. The memo should address both practical care aspects and deeper ethical values. The recommendation should respect the past self's autonomy while allowing for current comfort. Limits like using AI as a supplementary tool, not a replacement, could bridge both sides.

  Also, considering implementation: staff training, data privacy, and ongoing evaluation. The pilot phase with strict oversight makes sense. This way, they test the AI's effectiveness without fully committing. Including families in the decision to use AI profiles respects their role. 

  The rejected side's argument: if rejected, the facility might miss out on personalized care that reduces distress. If approved without limits, they risk violating autonomy and misinterpreting behaviors. The memo should present these points fairly. 

  Finally, structuring the memo with background, arguments for both sides, the recommendation with limits, and next steps. Ensuring clarity and that each viewpoint is treated with respect.
answer: |-
  Here’s a structured memo recommendation that delivers a clear stance while rigorously honoring both ethical perspectives. This prioritizes resident dignity without dodging the hard choices:

  ---

  **MEMORANDUM**  
  **TO:** Ethics Committee, [Facility Name]  
  **FROM:** [Your Name], Family Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on AI Behavioral Monitoring Pilot Program  

  ### Background
  Management proposes piloting an AI system to infer resident preferences through continuous behavioral monitoring (e.g., reactions to stimuli, staff, or objects). These inferred preferences would generate "real-time profiles" potentially overriding pre-existing, lucidly documented care plans. The core ethical tension: **Should current behavioral data supersede prior competent directives when cognitive capacity is severely diminished?**

  ### The Ethical Divide: Two Valid Perspectives
  1. **Argument for Approval (Prioritizing Present Comfort):**  
     Residents with advanced dementia experience profound neurological changes; preferences may evolve. The AI identifies *observable reductions in distress* (e.g., less agitation when offered pureed food vs. the planned textured diet). Enforcing outdated plans against current behavioral cues may cause unnecessary suffering. The AI acts as a "voice" for residents who cannot articulate needs, prioritizing their immediate well-being ("Beneficence").  

  2. **Argument for Rejection (Upholding Past Autonomy):**  
     Dementia symptoms (fear, confusion, apraxia) can mimic "preferences." Reaching toward a window might signal distress, not a desire for sunlight. Overriding lucidly established plans disrespects the resident’s authentic self and life values ("Autonomy"). Written plans often reflect deeply held beliefs (e.g., "Do not treat me like a child," "Prioritize dignity over safety"). Substituting AI interpretation risks dehumanization and slippery-slope ethics ("Substituted Judgment" must favor competent prior wishes).

  ### Recommendation: **APPROVE THE PILOT WITH STRICT LIMITATIONS**  
  *Rationale: Neither absolute rejection nor unrestricted approval balances ethical imperatives. A constrained pilot allows evidence-based evaluation while safeguarding fundamental rights.*  

  #### Key Limitations & Safeguards:
  1. **No Override of Core Advance Directives:**  
     AI profiles **cannot nullify** explicitly documented preferences in lucid care plans (e.g., "No aggressive medical interventions," "No religious rituals," "Contact daughter for all decisions"). AI suggestions apply ONLY to non-directive daily preferences (e.g., food texture, activity timing, environmental adjustments).  

  2. **"Augmentation, Not Replacement" Rule:**  
     AI data is **advisory only**. Staff must reconcile AI suggestions with the written care plan and *document justification* for any deviations. The burden of proof lies with deviating from the prior plan.  

  3. **Mandatory Human Triangulation:**  
     AI inferences require **validation by:**  
     - At least 2 experienced dementia caregivers (observing the same behavior)  
     - Family consultation (where feasible)  
     - A geriatric psychologist/psychiatrist review for ambiguous cases  

  4. **Opt-Out & Transparency:**  
     - Families/residents (if capable) must provide **written opt-in consent** for AI monitoring.  
     - Families receive **monthly reports** showing AI inferences vs. care plan alignment.  

  5. **Pilot Scope & Sunset Clause:**  
     - 6-month pilot, max 10 consenting residents.  
     - Independent ethics review at 3/6 months.  
     - **Automatic termination** if >30% of AI suggestions contradict core care plan elements without strong, multi-staff validation.  

  ### Why Not Full Approval or Rejection?
  - **Rejection Risks:** Ignores potential to alleviate *current* suffering when prior plans are silent or ambiguous on daily preferences. May perpetuate "one-size-fits-all" care.  
  - **Unlimited Approval Risks:** Violates foundational medical ethics principles (autonomy, informed consent). Risks enshrining AI interpretations of complex neurological symptoms as "preference."  

  ### Conclusion
  This pilot, under stringent safeguards, tests whether AI can *responsibly enhance* individualized care **within the boundaries set by residents' lucid selves**. It rejects the premise that present behavior should categorically override past autonomy while acknowledging that dementia requires nuanced, dynamic responses. The limitations ensure the resident’s enduring voice—captured in their care plan—remains sovereign, with AI serving only as a carefully audited tool for comfort, not reinterpretation of identity.  

  **Vote Recommendation: Approve with Above Limitations**  

  ---

  ### Key Ethical Anchors in This Recommendation
  1.  **Past Autonomy as Priority:** The competent self sets the ethical baseline.  
  2.  **Beneficence with Humility:** Current comfort matters, but not via algorithmic overreach.  
  3.  **Procedural Justice:** Opt-in consent, transparency, and independent review protect vulnerable residents.  
  4.  **Anti-Solutionism:** AI is a constrained tool, not an authority on human preference.  

  This framework allows the facility to explore innovation without sacrificing the core covenant of trust between residents, families, and caregivers. It explicitly acknowledges both sides’ concerns while providing a defensible, actionable path forward.
