answer: |-
  ## Ethics Committee: The Primate Proposal
  **Setting:** University Ethics Board meeting room, after reviewing a neuroscience proposal involving invasive procedures on macaques to study Parkinson's disease.

  **Characters:**
  *   **Dr. Evelyn Vance (Philosophy):** Defends a nuanced, Nozick-inspired hybrid view. Sharp, pragmatic, emphasizes practical consequences.
  *   **Dr. Aris Rao (Philosophy):** Argues for extending genuine side constraints to all sentient beings. Rigorous, presses consistency, influenced by Singer/Korsgaard critiques.

  **(The proposal documents lie open on the table. Coffee cups are half-empty.)**

  **Dr. Vance:** ...so while the primate suffering is significant, Aris, the potential human benefit *is* substantial. This isn't trivial convenience; it's alleviating a devastating neurodegenerative disease. On the hybrid view I find plausible – Kantian constraints for persons, utilitarian aggregation for non-persons – this seems justifiable. The macaques, while sophisticated, lack the rational agency, deep life-planning capacities, and reflexive self-understanding that ground *inviolable* status. Their interests matter, profoundly, but they enter the calculus as weights, not as generating absolute vetoes.

  **Dr. Rao:** Evelyn, we’ve danced this dance before. Let’s press your ‘plausible’ view. First, the marginal cases. Your capacity criterion – rational agency, life-planning – excludes infants, profoundly disabled humans, perhaps advanced dementia patients. Does your calculus permit invasive research on *them* if the aggregate benefit is high enough? If not, why carve the line at species rather than capacity? Consistency demands either including those humans in the aggregation pool or extending protection *beyond* your capacity criterion.

  **Dr. Vance:** Fair push. But the line isn’t *species* per se, it’s *kind-membership* and the *potentiality* inherent in it. An infant belongs to a kind – humanity – whose *standard, developed* form possesses the grounding capacities. That potentiality, and the profound relational bonds and expectations we have towards members of that kind – parents, society – generate derivative but still robust constraints. We don’t treat infants as mere means because they are nascent *persons*, embedded in the web of human relations and potential. A macaque, however intelligent, belongs to a different kind, lacking that specific potential for rational agency *as we understand and value it*. Kind-membership isn't arbitrary; it tracks the source of the very moral value we're protecting.

  **Dr. Rao:** Potentiality and relations. Convenient justifications for the status quo. Does the profoundly disabled adult with the cognitive capacity of a macaque, and no potential for more, lose their constraint because they lack the ‘standard form’? And are we really saying moral status hinges on *our* relational bonds *to them*? That sounds suspiciously like privileging the powerful. More importantly, let’s apply *Nozick’s own* utility-monster critique *to this very case, and to animal agriculture*. You reject unconstrained aggregation for persons because it allows sacrificing one for the greater good of many, violating their inviolability. But look at industrial farming: vast aggregations of animal suffering – terror, pain, deprivation – offset against marginal human gains: cheaper burgers, convenience. Isn’t that *precisely* a utility monster scenario? The aggregate animal suffering is monstrous, and the human benefit, while distributed, is comparatively trivial per capita. Your hybrid view seems to *license* this monstrous aggregation for non-persons. How is that defensible?

  **Dr. Vance:** (Leans forward, intensity rising) You’re conflating two things, Aris. First, the *magnitude* of suffering in factory farming is indeed horrific, and I agree it’s almost certainly *unjustified* even on a hybrid view. The cost-benefit *is* skewed – the human gains *are* trivial compared to the scale of suffering. We should condemn it vigorously on *utilitarian* grounds! But that’s different from saying the animals have *side constraints* against being used. It’s about the calculation being wrong, not the framework being invalid. Second, the utility-monster argument *for persons* targets the violation of *using someone as a mere means*. The horror isn't just suffering; it's instrumentalization. For beings lacking the reflexive self-conception that makes being *used* a fundamental violation, the primary wrong is the suffering inflicted, which *can* be weighed, however carefully. The primate proposal *aims* to minimize suffering through strict welfare protocols, and the benefit isn't trivial convenience – it's mitigating a core threat to human agency itself.

  **Dr. Rao:** But that’s the crux! *Why* is instrumentalization only a wrong for beings with a "reflexive self-conception"? If a being is sentient, capable of suffering, and has interests in avoiding pain and pursuing well-being, doesn't *using* it solely as a tool for others' ends, against its interests, *constitute* treating it as a mere means? The capacity for abstract self-reflection might deepen the *experience* of violation, but the core moral wrong of instrumentalization – disregarding its inherent worth for its own sake – seems present with any sentient being. Denying them *any* constraint against being used reduces them to vessels for experiencing positive or negative utility, which *is* the utilitarian reduction Nozick rightly feared. And regarding magnitude: if you concede factory farming's suffering is unjustified *even* on aggregation, doesn't that suggest sentience alone demands a *threshold* of protection that aggregation cannot override? A constraint against *extreme* suffering for trivial gains?

  **Dr. Vance:** A constraint against *extreme* suffering? That’s dangerously vague. Where’s the line? And what about the costs of drawing it? If we grant genuine side constraints – even 'weaker-content' ones – to *all* sentient animals, the implications are staggering. Not just this research, but virtually all animal agriculture, pest control, habitat destruction for housing, even owning pets arguably involves some level of instrumentalization. Medicine stalls. Ordinary life grinds down under the weight of constant moral vetoes. Your position risks demanding an asceticism we can't reasonably impose, or collapsing under its own impractical weight. My hybrid view acknowledges a profound duty to minimize suffering and respect the interests of sentient creatures, but it *also* recognizes the tragic necessity of trade-offs in a world where our flourishing inevitably impacts others who lack full inviolable status. It draws a line based on the capacities that make *inviolability* conceptually coherent and practically sustainable. Infants get protection through their kind-potentiality; animals get robust welfare consideration, but not absolute vetoes.

  **Dr. Rao:** So practicality becomes the ultimate constraint? That feels like surrender. We *can* do better than industrial farming. We *can* prioritize research with minimal sentient involvement. We *can* build societies less dependent on profound animal suffering. Dismissing the extension of constraints because it's *hard* ignores our moral obligation to *strive* for coherence and reduce harm. And your 'kind-potentiality' for infants still feels like special pleading to protect 'us'. If the profoundly disabled adult lacks the 'standard form' and no potential, does their constraint vanish? If not, then *sentience itself* must be doing significant work. And if sentience grounds *some* constraint against being used purely instrumentally for trivial gains – as even you seem to concede in condemning factory farming – then why not for this primate research? Is alleviating Parkinson's sufficiently *non-trivial* to override a *prima facie* constraint against inflicting severe suffering and instrumentalization on a sentient being? That seems the sharper question your hybrid view must answer, without retreating to kind-membership. What level of human benefit justifies *that*?

  **Dr. Vance:** (Sighs, steepling fingers) That *is* the sharp point, isn't it? The Parkinson's benefit *is* substantial, targeting a core assault on human agency. But "trivial"? Factory farming *is* trivial in its justifications. Yet drawing a bright line between "substantial" and "trivial" human interests... that feels perilously subjective. My hybrid view relies on the *combination*: the kind-based inviolability for persons *plus* stringent aggregation demanding proportionality for non-persons. The primate isn't inviolable, but the suffering must be minimized and the human gain must be *significant*, not marginal. This proposal, I believe, meets that bar. Factory farming does not. But... (pauses) I concede the discomfort. Granting *no* constraint against instrumentalization feels too permissive. Yet granting a constraint *identical* in kind to persons feels unworkable and ignores relevant differences in capacity.

  **Dr. Rao:** And there we remain. You see the relevant difference in capacity as justifying a fundamental difference in moral architecture (constraints vs. aggregation). I see sentience as grounding a shared, if perhaps gradable, protection against being used *merely* as a means, demanding that any such use meet an exceptionally high justificatory bar – one that trivial human interests *cannot* meet, but perhaps profound medical advances *might*. We both condemn factory farming. We both want stringent welfare here. But for me, the macaque's sentience generates a *claim* not to be used solely as a tool that must be *overcome*, not merely weighed. For you, its claim is inherently weightable. That foundational difference – whether the core wrong is only suffering or also instrumentalization for non-persons – seems irreducible. We agree on the moral gravity, Evelyn, but not on the structure.

  **(Silence hangs. They look at the primate proposal again. The disagreement is narrowed, but the chasm remains.)**
