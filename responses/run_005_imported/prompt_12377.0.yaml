answer: |-
  You've engaged with Aquinas's text with remarkable clarity—a rarity even among philosophy students. Your three confusions pinpoint precisely where modern summaries oversimplify his argument. Let's unpack them in order, then assess how they relate to the "tidy" double effect doctrine.

  ### 1. What "intended vs. beside the intention" *actually* means  
  Aquinas isn't distinguishing between "wanted" and "unwanted" outcomes, but between the **moral object** of the act (what you directly intend as means/end) and **foreseen but indirect consequences**. Key clarifications:  
  - **"Fully foreseen ≠ intended"**: The aggressor's death is anticipated, but *not willed as an end or means*. The act's structure is "repelling force to save life," not "killing to save life." Pushing someone into the trolley *requires* their death as a means (using their body as a brake), making it intended.  
  - **Moral species**: For Aquinas, an act is morally categorized by its primary intention. If you *intend* killing (even for a good end), it's homicide. If death occurs as a byproduct of a proportionate act (e.g., repelling force), it's morally distinct.  
  - **Modern analogy**: A surgeon removing a cancerous uterus foresees the fetus's death but doesn't *intend* it; the act is "life-saving surgery," not "abortion."  

  ### 2. The "switch" to public authority: A second justification?  
  You're correct—this *isn't* a mere application of double effect. Aquinas introduces a **separate moral principle**:  
  - **Private individuals**: Bound by the prohibition against *intending* homicide (Exodus 20:13). Double effect applies here: They may act in self-defense, tolerating unintended death.  
  - **Public authorities (soldiers/judges)**: Can *intend* killing as an act of **just punishment or defense of the common good**. Their role transforms the moral act: Killing isn't personal but an exercise of delegated authority for societal order.  
  **Why modern summaries omit this**: Contemporary double effect discussions (e.g., Philippa Foot's trolley essays) secularize the doctrine, stripping Aquinas's theology of authority. His argument is fundamentally two-tiered:  
  > Private sphere: Double effect applies.  
  > Public sphere: Intending killing is licit under authority.  

  ### 3. Proportionality's role: Why force matters  
  Proportionality isn't an add-on but a **safeguard against bad faith**:  
  - If you use "more force than necessary" (e.g., shooting an unarmed thief), it suggests your true intention was *not* defense but harm—collapsing the "unintended" claim.  
  - It anchors the act in **natural law**: Self-preservation is licit, but only via means "naturally" suited to it. Excessive force corrupts the act's moral object.  
  **Example**: Diverting a trolley uses proportional force (redirection); pushing a person is disproportionate (direct assault).  

  ### Does Aquinas support the "four conditions"?  
  The modern schema (e.g., Joseph Mangan's 1949 formulation) distills Aquinas but loses crucial nuance:  

  | **Modern "Four Conditions"** | **Aquinas's Original Framework** |  
  |------------------------------|----------------------------------|  
  | 1. Act itself good/neutral | Rooted in natural law (self-preservation) |  
  | 2. Intend only good effect | Intend *moral object* (repelling force) |  
  | 3. Good effect not caused by evil | Evil effect *side effect*, not means |  
  | 4. Proportional good/evil | "Moderate" force; care for own life > others' |  

  **Critical divergences**:  
  - Aquinas **never treats these as a checklist**. His reasoning is teleological: Acts are judged by intention *and* their fit with natural/divine law.  
  - The **public/private distinction** is ignored in modern versions, yet it's central to his argument.  
  - **Proportionality** for Aquinas is about *means to end* (moderate defense), not utilitarian calculus (1 vs. 5 lives).  

  ### Conclusion: Aquinas's argument is richer—and messier  
  Your instinct is right: Aquinas isn't building a universal "double effect formula." He's solving a specific theological problem (When is killing not murder?) by weaving together:  
  - **Moral psychology** (intention vs. foresight)  
  - **Natural law** (self-preservation)  
  - **Political theology** (delegated authority)  
  - **Jurisprudence** (medieval "moderate defense" principles)  

  The trolley divergence (turning vs. pushing) *can* be mapped to his framework—**if** you accept that redirecting a threat treats death as a side effect, while pushing makes death the means. But his deeper concern—whether private persons may *ever* intend killing—explains why pushing feels "monstrous": It usurps the state's exclusive right to intentional homicide.  

  This passage *inspired* double effect theory but doesn’t contain it fully formed. Your frustration with summaries is justified: They often reduce Aquinas to a proto-utilitarian, obscuring his medieval worldview. To resolve your trolley argument, note that modern philosophy uses double effect *differently*—detached from authority hierarchies—making Aquinas both a foundation and a poor fit for contemporary dilemmas.
