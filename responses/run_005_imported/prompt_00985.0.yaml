  I should emphasize three gaps: (1) Historical injustices—Nozick's theory only justifies distributions if all prior transfers were just. (2) The Chamberlain scenario assumes perfectly clean starting points, unlike real economies shaped by slavery or discrimination. (3) Taxation isn't necessarily analogous to "grabbing quarters back"; it might fund institutions enabling voluntary exchange (e.g. courts).

  Also, the user's phrasing about "presumption of justice" is slightly off. For Nozick, justice isn't presumed—it's binary: either every step in the chain was voluntary, or rectification is needed. No middle ground.

  Teaching-wise, I'd suggest they present the clean Chamberlain logic first (which they've nailed), then complicate it with real-world questions. That scaffolds well for undergrads. Maybe add a slide contrasting "idealized vs. applied entitlement theory." 

