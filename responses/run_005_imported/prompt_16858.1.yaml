prompt: |-
  So for my IB Theory of Knowledge exhibition I've been going down a rabbit hole on non-western "ways of knowing" and landed on the Nyaya school of Indian philosophy and their theory of the four pramanas (basically their word for legitimate sources of knowledge): pratyaksa (perception), anumana (inference), upamana (comparison), and sabda (testimony). I get the basic idea of each, like the classic upamana example where some guy who's never seen a gavaya (a wild ox thing) is told "it looks kind of like a cow," then later spots one in the forest and realizes "oh, THAT's a gavaya." What's actually hooked me though is finding out that not everyone agreed these are 4 genuinely seperate sources of knowledge - apparently the Carvakas only accepted perception and thought inference basically can't be trusted, Buddhist logicians (Dignaga and that whole lineage, i think?) argued testimony isn't its own category and is really just inference in disguise ("this person is reliable, so..."), and even the Vaisheshikas, who are supposedly Nyaya's closest sister school, historically only recognized 2 pramanas and tried to fold upamana and sabda into inference too. My TOK teacher had genuinely never heard of any of this so ive just been reading around on my own, and now I don't have a good feel for which of the 4 pramanas has the strongest claim to actually being its own irreducible thing.

  The exhibition is due in a few weeks and I want to use this as one of my objects/examples, so here's what I'm hoping you can help with: rank the four Nyaya pramanas from "most secure/irreducible as an independent source of knowledge" down to "most vulnerable to being collapsed into one of the others," based on the actual historical reduction arguments made against each one (by Carvakas, Buddhists, Vaisheshikas, whoever) and how Nyaya philosophers actually pushed back - not just whichever one sounds most obviously legit to a modern reader. For each one, give me 1-2 sentences on the strongest reduction argument it faced and 1-2 sentences on Nyaya's best reply. If two are basically tied, just say so and explain why. Could you format it as a JSON list like this so I can paste it straight into my notes:

  ```json
  [
    {"rank": 1, "pramana": "...", "reduction_threat": "...", "nyaya_defense": "..."},
    {"rank": 2, "pramana": "...", "reduction_threat": "...", "nyaya_defense": "..."},
