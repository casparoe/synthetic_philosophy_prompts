prompt: |-
  I teach a graduate seminar on social ontology, and this term we've spent several weeks on the metaphysics of acting together. Two of my strongest students have reached an impasse that I'd like an outside perspective on before we reconvene. One is committed to Michael Bratman's planning-theoretic account of shared intention, on which shared agency reduces without remainder to a structure of individual intentions: each party intends that they together perform the joint action, intends this at least partly because of the other's matching intention, and forms sub-plans that mesh with the other's, all of this being common knowledge between them. The other has been won over by Margaret Gilbert's plural subject theory, on which shared intention essentially involves joint commitment -- a normative bond that the parties jointly and openly enter into, and which cannot be reduced to any configuration, however intricate, of separate individual attitudes.

  Their disagreement crystallized around a case raised in seminar: two colleagues begin co-authoring a paper on the strength of an informal conversation, without either ever explicitly promising the other anything, yet each comes to feel -- once real work has gone into the project on the strength of the other's apparent participation -- that walking away unannounced would wrong the other collaborator, and not merely disappoint them. My Bratman-inclined student wants to say this sense of obligation can be captured by further individual-level attitudes (expectations, reasonable reliance, the rational pressure generated by one's own prior intentions) without abandoning an individualist framework; my Gilbertian student thinks the case shows precisely why a sui generis joint commitment needs to be posited.

  Could you write the response paper I've asked them to produce: a comparison of Bratman's and Gilbert's accounts of shared intention detailed enough that what actually divides them -- and not just their slogans -- becomes clear? I'd like you to take an explicit position on the co-authorship case: does Bratman's apparatus have the resources to explain the obligation the collaborators feel toward one another, or does Gilbert's appeal to joint commitment do genuine explanatory work that no amount of added individual psychology can replicate? Please defend a verdict rather than simply cataloguing considerations on each side.
reasoning: |-
  Okay, let me approach this systematically. The user is a professor teaching social ontology, specifically on acting together, and they have two students stuck in a theoretical debate between Bratman's planning theory and Gilbert's plural subject theory. The core disagreement centers on whether obligations in joint actions like co-authoring a paper can be explained individually or require irreducible joint commitment. 

  First, I need to unpack both theories carefully. Bratman reduces shared intention to interconnected individual intentions: each person intends the joint action, knows the other does too, and their sub-plans mesh. Gilbert argues for a normative joint commitment that binds participants, creating obligations beyond individual psychology. The co-authorship case is perfect for testing this - informal collaboration where obligation emerges without explicit promises.

  For Bratman's side, I'll examine how his framework might handle obligation through nested intentions and planning norms. If each co-author intends their joint work, relies on the other's participation, and invests effort based on mutual expectations, could the "wronging" feeling stem from breached reliance or violated planning stability? The student likely argues this suffices. 

  But Gilbert's point about distinctiveness of obligation feels powerful here. When collaborators feel personally wronged (not just disappointed), it suggests a mutual bond - exactly what her joint commitment describes. Unlike individual promises, this obligation is bidirectional and created collectively. The "openness" requirement in Gilbert's account matches how collaborators sense mutual awareness of their commitment.

  The key differentiators I should highlight: 
  - Bratman's obligations flow vertically from individual to joint action 
  - Gilbert's obligations are horizontally binding between participants 
  - The "wrong" in the co-authorship case feels like violating a mutual pledge, not just failing a project 

  I think Gilbert wins this round. No matter how you enrich Bratman's individual attitudes, the specific quality of mutual obligation in the case - the sense that you owe the other person directly - seems to demand Gilbert's joint commitment. That normative glue is what makes walking away feel like betrayal rather than mere coordination failure. 

  For the verdict section, I'll contrast Bratman's elegant reductionism with Gilbert's phenomenological accuracy about obligations. The co-authorship case shows individual psychology can't replicate the "we" bond - which is precisely why Gilbert's irreducible joint commitment does necessary work.
answer: |-
  ## Shared Intention: The Bratman-Gilbert Divide and the Case of the Co-Authors

  **Introduction**
  The debate between Michael Bratman's planning theory and Margaret Gilbert's plural subject theory represents a fundamental schism in understanding shared intention and collective agency. While both aim to explain how individuals act together intentionally, their accounts diverge radically on the nature of the glue binding participants and the source of associated obligations. This paper will delineate the core commitments of each theory, pinpoint their irreconcilable differences using the co-authorship case as a focal point, and argue that Gilbert's appeal to *sui generis* joint commitment is necessary to fully explain the normative obligation felt by the collaborators. Bratman's individualist apparatus, however sophisticated, ultimately fails to capture the distinctive interpersonal normativity at play.

  **Core Commitments: Planning vs. Plural Subject**

  1.  **Bratman's Planning Theory: Reductionist Interlocking**
      *   **Foundation:** Shared intention (e.g., "We intend to J") is *nothing over and above* a complex structure of individual, interdependent, interlocking intentions and common knowledge.
      *   **Key Components:**
          *   *Intention that we J:* Each individual (A and B) intends that *they* perform the joint action J *together*.
          *   *Interdependence:* Each intends that they J *in part because* they believe the other also intends that they J.
          *   *Meshing Sub-Plans:* Each intends that they J in part by way of meshing sub-plans of each. They are disposed to coordinate and (minimally) negotiate sub-plans to ensure compatibility.
          *   *Common Knowledge:* All of the above is out in the open; each knows the structure obtains and knows the other knows, etc.
      *   **Source of Obligation/Normativity:** Any sense of obligation or commitment arises *derivatively* from:
          *   *Individual Intentions' Stability:* The rational pressures inherent in individual intending (e.g., stability, means-end coherence).
          *   *Interdependence & Reliance:* B's intention and actions depend on A's (and vice versa). Walking away might violate norms of reliance or instrumental rationality *given* the interlocking intentions.
          *   *Moral/Conventional Norms:* Separate norms of promise-keeping, fairness, or cooperation *might* be triggered by the situation, but these are external to the structure of shared intention *itself*.
      *   **Metaphysics:** Strictly individualist. There are only individuals with their attitudes and interrelations. "We-intention" is a *description* of this complex psychological and epistemic state of affairs.

  2.  **Gilbert's Plural Subject Theory: Irreducible Commitment**
      *   **Foundation:** Shared intention (or "joint commitment") constitutes a *sui generis* social phenomenon. It creates a *plural subject* – a new entity constituted by the jointly committed individuals.
      *   **Key Components:**
          *   *Joint Commitment:* The core element. Parties *together*, openly, commit *each* to *all* to espouse a certain goal or course of action *as a body*. This is not a sum of personal commitments.
          *   *Creation:* Joint commitment is typically created by expressions of readiness (e.g., "Shall we J?" "Yes, let's") but can arise implicitly through coordinated action signaling mutual understanding of a joint project.
          *   *Obligations & Entitlements:* Joint commitment *necessarily* creates correlative *obligations* (to do one's part) and *entitlements* (to expect the other to do their part, to rebuke for non-performance) *directed* between the parties. These obligations are *owed specifically to the other participant(s)*.
          *   *Indissolubility:* A joint commitment cannot be unilaterally rescinded; it requires the concurrence of all parties for dissolution. Walking away unilaterally violates this commitment.
      *   **Source of Obligation/Normativity:** The obligations and entitlements are *internal* and *constitutive* of the joint commitment itself. They are the *normative bond* created by the act of committing together.
      *   **Metaphysics:** Non-reductionist/Holist. While constituted by individuals, the plural subject and its joint commitment are emergent phenomena with irreducible normative properties. "We-intention" refers to the state of being jointly committed.

  **The Irreducible Divide: Beyond Slogans**

  The core disagreement is **not** merely about whether obligations exist in shared agency (both agree they often do). The disagreement is about the *source, nature, and direction* of those obligations:

  1.  **Source:**
      *   **Bratman:** Obligations are *external imports* – derived either from the rational pressures of *individual* agency (intention stability, means-end coherence) or from independent moral/social norms (promises, reliance, fairness) *triggered by* the interlocking intentions situation.
      *   **Gilbert:** Obligations are *internal creations* – *constituted by* the act of forming the joint commitment itself. The commitment *is* the normative bond.

  2.  **Nature & Direction:**
      *   **Bratman:** Any obligation is fundamentally *impersonal* or *project-focused*. You might feel pressure to finish the paper because you intended to, or because it's irrational to abandon your plan, or because it's *generally* wrong to let people down who relied on you. The "wronging" is felt *towards the project* or *as a general moral failing*, not *specifically and necessarily* as a violation *owed to the other collaborator*.
      *   **Gilbert:** The obligation is *inherently interpersonal* and *directed*. The collaborator feels *specifically obligated to the other person* because they jointly committed *to each other*. The other person is *entitled* to their performance and to rebuke them for failure. The "wronging" is a *direct violation of the bond between them*, not just a project failure or general moral lapse.

  **The Co-Authorship Case: A Verdict for Gilbert**

  The case of the informal co-authorship perfectly crystallizes this divide and demonstrates the necessity of Gilbert's joint commitment.

  *   **The Phenomenon:** The collaborators feel that walking away *unannounced* would *wrong the other person specifically*. This isn't merely a feeling that the *paper* would fail, or that they'd be *irrational*, or that they'd violate a *general* norm of cooperation. It's the distinct sense that they would be *letting down this particular person* to whom they are *bound* in the project. The obligation is *owed to the collaborator*.
  *   **Bratman's Resources (and Their Limits):**
      *   *Interlocking Intentions & Reliance:* Bratman can explain disappointment, frustration, and perhaps a judgment of unreliability or irrationality. A formed the intention "that we co-author" relying on B's matching intention and visible participation (and vice versa). Abandoning the project destabilizes A's own plans and violates B's reliance.
      *   *The Gap:* However, this explains *why B is harmed or disappointed*, and perhaps why A might feel *guilty for causing harm* or *embarrassed for being flaky*. It does **not** adequately explain the *specific, directed, obligation-infused* character of the "wronging." Why does A feel *bound to B*, such that B has a *claim* against A? Why does A feel they need B's *agreement* to quit, rather than just needing to *inform* B to mitigate harm? Bratman's structure generates reasons and potential moral failings, but not the *interpersonal normative bond* where B is *entitled* to A's continued participation and can *rebuke* A for failing. The obligation feels like a debt owed *to B*, not just a failure regarding the project or a breach of a general moral rule.
      *   *Added Psychology?* Adding individual attitudes like "A feels she promised" or "A judges it unfair" doesn't solve the core issue. Firstly, these attitudes might be absent in the informal case described (no explicit promise, no judgment of unfairness *until* the obligation is felt). Secondly, even if present, these are *external* moral norms being applied *to* the situation. They don't explain how the *joint activity itself* creates the *sui generis* directed obligation *between the participants*.
  *   **Gilbert's Explanation:**
      *   *Implicit Joint Commitment:* Through their informal conversation initiating the project and their subsequent *mutually recognized, coordinated work* on it based on the *apparent participation* of the other, the collaborators *implicitly* formed a joint commitment to co-author the paper. Their actions signaled readiness to be committed *as a body* to this goal.
      *   *Obligation Constituted:* This joint commitment *immediately* created the normative bond. Each became obligated *to the other* to do their part and entitled *from the other* to their performance. This explains the specific feeling of *wronging the other person*: violating the joint commitment *is* directly failing the other party to whom one is bound. It explains why walking away *unannounced* feels particularly wrong: the joint commitment requires *mutual concurrence* for dissolution. The obligation is intrinsic to the relationship formed by committing together.

  **Conclusion: The Necessity of the Normative Bond**

  While Bratman's account provides a powerful, elegant, and psychologically plausible model of the *cognitive and planning infrastructure* necessary for shared agency, it fails to capture the *distinctive normative phenomenology* present in cases like the co-authors. The feeling that one would *wrong a specific other person* by unilaterally abandoning a joint endeavor, even one begun informally, points to an irreducible interpersonal normative reality.

  Gilbert's concept of joint commitment directly explains this phenomenology. The obligation isn't merely a consequence of interlocking individual psychologies plus external moral norms; it is *constituted by* the act of committing together. The collaborators in the case feel bound *because* they have, through their words and actions, entered into a joint commitment. This commitment creates a plural subject with its own normative structure – obligations and entitlements *between* the members. No reconfiguration of individual attitudes, however complex, can replicate this *sui generis* normative relation born of mutual commitment. Therefore, Gilbert's account does genuine, indispensable explanatory work that Bratman's reductionist framework cannot achieve. The co-authorship case demonstrates that shared agency, in its fullest sense, requires the metaphysical and normative resources of the plural subject.
