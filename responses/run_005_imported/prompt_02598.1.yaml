  But for part (3)—the verdict—I'm leaning hard toward Nyāya. Why? The cognitive "aha!" moment in upamāna (e.g., "gavaya" = wild cow) isn't mediated by vyāpti. It's direct linguistic calibration via perception of similarity. Vaiśeṣika smuggles in resemblance as a premise, but resemblance itself isn't inferred; it's perceived. That gap sinks their reduction. 

  ...Wait, is this too absolutist? The user did ask for no diplomacy. Still, I should flag where Vaiśeṣika has a point: if resemblance is universal-based, inference could technically handle it. But Nyāya's emphasis on the phenomenology of learning words feels right. The verdict stays. 

