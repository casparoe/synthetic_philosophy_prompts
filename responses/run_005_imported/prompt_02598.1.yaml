  Hmm, the stakes are high here. This isn't just academic; their seminar paper hinges on taking a stand. I notice they've already done heavy textual work (Nyāya-sūtra with Vātsyāyana, Praśastapāda's Padārthadharmasaṃgraha), so I can't hand-wave. Their frustration with "both sides have a point" answers suggests they've hit a wall in their own analysis. 

  For part (1): I'll contrast anumāna's rigid vyāpti/parārthānumāna structure with upamāna's unique sequence—especially how atideśa-vākya (authoritative statement) triggers resemblance-based cognition. The saṃjñā-saṃjñi-sambandha (word-referent nexus) is Nyāya's trump card; it feels irreducible. 

