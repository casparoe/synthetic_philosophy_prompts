answer: |-
  Here are 8 targeted interview questions designed to push your guest on the "all-affected interests" principle, incorporating your specific requests with anticipated dodges and sharp follow-ups:

  1.  **The Scope Problem - Over-Inclusiveness:** "Professor, in a hyper-connected world, almost any significant decision – setting US interest rates, EU agricultural subsidies, or China's coal policy – creates ripple effects impacting billions globally through climate, markets, or supply chains. Doesn't the 'all-affected' principle, taken literally, logically demand that *everyone on Earth* gets *some* form of vote on *every* major policy decision? Do you bite that bullet and advocate for global direct democracy on everything, or do you need to introduce a limiting criterion?"  
      *   *Follow-up (Anticipating Threshold/Intensity Dodge):* "If you argue for a threshold of 'significantly affected' or 'directly affected' to avoid this, who defines that threshold and *how*? Doesn't setting that threshold *itself* become a prior, undemocratic decision about who gets to decide who counts?"

  2.  **The Circularity Problem:** "A core criticism is that 'affected interests' is circular. To know *who* is affected by a decision (e.g., 'Should we build this dam?'), we need to know the *scope and consequences* of the decision itself – but figuring out the scope and consequences *is precisely the democratic deliberation we're trying to constitute*. How do you break out of this loop? Where does the *first* demos come from to decide the scope of the *first* decision?"  
      *   *Follow-up (Anticipating Procedural/Iterative Dodge):* "If you suggest we start with existing units or use iterative processes, doesn't that just privilege historical contingencies or power structures (like current nation-states) that the principle is supposed to overcome? How is that not just kicking the can down the road?"

  3.  **The Coercion/Subjection Alternative:** "Why should 'affected interests' be the fundamental criterion, rather than the rival principle focusing on those *subject to the coercive power* of the decision-making body? For instance, border policy primarily *coerces* those trying to cross or being deported. Doesn't the 'subject to coercion' principle offer a clearer, more administrable boundary, focusing on those most directly bound by the rules?"  
      *   *Follow-up (Anticipating "Coercion is a Subset of Affected" Dodge):* "Even if coercion is a *type* of effect, why should it be secondary? Isn't the *direct imposition of binding rules* the core justification for democratic legitimacy? Doesn't the 'affected' principle dilute the special claim of those who are *ruled* by potentially including distant stakeholders who merely have an *interest*?"

  4.  **Defining "Interests":** "The principle hinges on identifying 'interests.' But interests are contested, subjective, and often shaped by the very power structures democracy seeks to regulate. How do we objectively determine someone's 'interest' in a decision, especially if they might not even be aware of it, or if their perceived interest conflicts with a theorist's view of their 'real' interest? Doesn't this open a huge door for paternalism or elite interpretation?"  
      *   *Follow-up (Anticipating "Self-Defined Interests" Dodge):* "If we rely on individuals to *define their own interests*, how do we practically solicit that input from potentially billions of affected parties *before* constituting the demos for each decision? Isn't this functionally impossible, forcing us back to proxies or representatives who *interpret* interests?"

  5.  **Aggregation vs. Weighting:** "Even if we could identify everyone affected, how do we aggregate their input? Does 'some kind of say' mean equal vote weight? If so, doesn't that drown out the voices of those *most* severely affected by a decision? If we weight votes by intensity or nature of effect, how do we measure that objectively and avoid manipulation?"  
      *   *Follow-up (Anticipating "Differentiated Input" Dodge):* "Suggesting varied mechanisms (voting, consultation, legal standing) sounds pragmatic, but doesn't it create a hierarchy of political voice *within* the affected group? Who decides *which* affected parties get *which* type of say, and how is *that* decision made democratically under the principle?"

  6.  **Feasibility & Institutional Design:** "Beyond the philosophical critiques, what would a *practically implementable* institutional model based on 'all-affected interests' look like? How could it possibly function without collapsing under its own administrative weight or becoming hopelessly complex? Can you point to *any* real-world system that comes close to embodying this principle at scale?"  
      *   *Follow-up (Anticipating "Aspirational/Ideal" Dodge):* "If it's primarily an aspirational ideal rather than a blueprint, how does it meaningfully guide institutional reform *now*? Doesn't its practical indeterminacy risk leaving existing, exclusionary boundaries largely intact?"

  7.  **The "All-Subjected" Principle Revisited:** "Let's revisit the coercion/subjection alternative. Proponents argue it avoids global over-inclusion by focusing on those within a jurisdiction's coercive reach. They might say an investor in Country A affected by interest rates in Country B isn't *subject to B's laws* in the same way as B's citizens. Why is your 'affected' principle superior to this more bounded approach for defining the *primary* demos?"  
      *   *Follow-up (Anticipating "Ignores Externalities" Dodge):* "Granted, the 'all-subjected' view might downplay *externalities* (like pollution crossing borders). But if we use 'all-affected' for the *primary* demos, doesn't it become unworkable? Shouldn't we instead focus on strengthening *mechanisms* for representing affected outsiders *within* bounded units (e.g., international courts, treaties) rather than dissolving the units themselves?"

  8.  **The Future & Non-Humans:** "Looking ahead, how does the 'all-affected' principle handle potential future persons whose interests are profoundly affected by current decisions (like climate policy or nuclear waste)? And does it logically extend to non-human entities with demonstrable interests (e.g., ecosystems, certain animals)? If not, why not? If so, how could they possibly have 'a say'?"  
      *   *Follow-up (Anticipating "Guardians/Trustees" Dodge):* "If we need guardians or trustees to represent future generations or non-humans, how do we select them democratically under the 'all-affected' principle? Doesn't this reintroduce the problem of defining the demos to choose the guardians?"

  **Key elements used:**

  *   **Confronts Over-Inclusiveness:** Directly pushes the global scale implication (Q1 & Follow-up).
  *   **Tackles Circularity:** Explicitly names and explores the chicken-and-egg problem (Q2 & Follow-up).
  *   **Challenges the Core Criterion:** Forces a defense against the "all-subjected" alternative (Q3 & Q7, incl. Follow-ups).
  *   **Anticipates Dodges:** Each primary question has a specific follow-up targeting the most likely defensive maneuvers.
  *   **Pushes Practicality:** Asks for concrete models and confronts feasibility (Q6 & Follow-up).
  *   **Probes Underlying Concepts:** Questions the definition of "interests" (Q4) and aggregation (Q5).
  *   **Tests Boundaries:** Explores edges like future generations/non-humans (Q8).

  **Delivery Tip:** Frame these firmly but respectfully. Signal your intent: "I want to really test the boundaries of this powerful idea with you..." or "These are the toughest objections I encounter, I'd love your response..." This sets a collaborative, intellectually rigorous tone rather than an adversarial one. Good luck with the episode! Sounds fascinating.
