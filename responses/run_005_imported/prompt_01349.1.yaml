  Okay, let me start by understanding the user's problem. They're working through Aristotle's De Interpretatione, specifically chapter 9, which deals with future contingents and logical fatalism. The user is confused because Aristotle seems to contradict himself. On one hand, he says that for any pair of contradictories, one must be true and the other false. But then, when discussing future events like a sea battle, he says we can't determinately say which is true or false. The user wants to know if Aristotle is contradicting himself or if there's a coherent distinction being made.

  First, I need to recall Aristotle's main points in that chapter. He's addressing the problem of fatalism. If statements about the future are already true or false, then future events are determined. But Aristotle wants to avoid that conclusion because he believes in contingency—some events aren't necessary. The key is his distinction between the necessity of the disjunction (either it will happen or it won't) and the lack of necessity for either disjunct individually.

  The user mentions the Edghill translation. I should check the exact quotes. Aristotle says it's necessary that the sea battle happens or not, but not necessary that it happens, nor necessary that it doesn't. Then he says we can't determinately say which proposition is true or false. The user is stuck on the apparent contradiction between insisting bivalence holds (one must be true/false) and then denying it's necessary that one is true and the other false.

  Wait, but Aristotle isn't denying bivalence. He's making a modal point. The disjunction is necessarily true, but the individual propositions about future contingents aren't necessarily true or false. The distinction here is between what's logically necessary and what's metaphysically necessary. The disjunction is a tautology, so it's always true. But for future events that aren't determined, neither "it will happen" nor "it won't" is necessary. So, both can be possible, but one will turn out true, the other false. However, at the present, neither has a truth value that is fixed or determinate. 

  The user might be missing the temporal aspect of truth. Aristotle seems to be saying that for future contingents, the truth value isn't settled yet. So, bivalence holds in the sense that eventually one will be true and the other false, but at the time of utterance, neither is determinately true or false. That's the "not actually true or actually false" part. So, it's not that bivalence is abandoned; it's that the truth values are indeterminate until the event occurs.

  Also, the user is concerned if this distinction blocks fatalism without giving up bivalence for present/past statements. Aristotle's position here does that. Past and present events are fixed, so their truth values are determinate. Future contingents aren't fixed, so their truth values aren't settled yet. But once the future becomes present or past, bivalence applies. So, for Aristotle, bivalence is temporal. The fatalist argument fails because it assumes that future statements having truth values now implies necessity, but Aristotle separates truth from necessity. Truth doesn't entail determinism for future events.

  The user might also be interested in how this connects to modern logic. The idea of supervaluationism or three-valued logic (like Łukasiewicz) where future contingents have a third truth value. But Aristotle isn't going that far. He's maintaining that they will be true or false, just not yet determined. So, it's more about determinacy than truth value itself. 

  I should also clarify the term "actually true or false." Aristotle uses "actually" in the sense of "determinately" at the present moment. So, the propositions aren't now true or false in a fixed way. But they will be. This avoids fatalism because the lack of current determinate truth means the future isn't set, even though the disjunction is necessary.

  In summary, the key distinctions are: necessity of disjunction vs. disjuncts, determinate vs. indeterminate truth values, and temporal aspects of truth. Aristotle isn't contradicting himself; he's applying bivalence differently to future contingents by introducing indeterminacy. This blocks fatalism while preserving bivalence for non-future statements. The user's deeper need is likely to grasp Aristotle's solution to fatalism and whether it holds up. They might also be preparing for their reading group, so clarity on these distinctions is crucial for discussion.
answer: |-
  You've pinpointed the central interpretive crux of *De Interpretatione* 9, a passage that has generated immense scholarly debate for centuries. Aristotle is **not** simply contradicting himself, although the tension is deliberate and crucial to his argument against logical fatalism. The key lies in understanding the distinctions he draws, particularly concerning **modality (necessity), determinacy, and temporal ontology**. Here's a breakdown:

  1.  **The Core Tension (as you stated):**
      *   **Premise 1:** For any pair of contradictories (P and ~P) about *what is or what has been*, one *must* be true and the other false. (Bivalence holds determinately for present/past).
      *   **Premise 2:** For contradictories about future singular contingent events (e.g., "There will be a sea-battle tomorrow" / "There will not be a sea-battle tomorrow"):
          *   The *disjunction* ("Sea-battle or No sea-battle") is necessarily true. (The Law of Excluded Middle holds).
          *   However, *neither disjunct* is *necessary* on its own. (The sea-battle is not *necessary*, nor is its absence *necessary*).
          *   Crucially: **We cannot say *determinately* which one is true and which is false.** They are "undecided". One *will become* true/false, but *now*, neither is "actually true" or "actually false" in the same fixed way a present or past proposition is.
      *   **Conclusion:** Therefore, it is **not necessary** that for *every* pair of contradictories (specifically, those about the future contingent), one *is* true and the other false *right now* (in the determinate sense applicable to present/past).

  2.  **The Crucial Distinctions Doing the Work:**

      *   **Necessity of the Disjunction vs. Necessity of the Disjuncts:**
          *   Aristotle firmly upholds the **Law of Excluded Middle (LEM)**. "P or ~P" *must* be true. This is a logical necessity. The future *will* unfold one way or the other.
          *   However, he **denies** that the *truth* of either disjunct (P or ~P) about a future contingent is *necessary*. The necessity of the *disjunction* does not imply the necessity of *either disjunct*. The sea-battle is *contingent*; it could happen or not happen, depending on future causes (human decisions, chance events). Its occurrence isn't forced by logical necessity alone.

      *   **Truth vs. Determinately True/False (The Core Innovation):**
          *   This is the most important and controversial distinction. Aristotle is introducing the idea that **truth values for future contingent propositions are not *fixed* or *determinate* at the time of utterance.**
          *   He **does not abandon Bivalence** (the principle that every proposition is either true or false) *simpliciter*. He agrees that *eventually*, one will be true and the other false. The sea-battle *will* happen or it *won't*.
          *   However, he **denies that Bivalence applies *determinately* to future contingents *at the present moment***. They lack a *settled* truth value *now*. This is what he means by "we cannot say determinately," "must leave the alternative undecided," and "it cannot be either *actually* true or *actually* false."
          *   **"Actually" (Edghill's translation of Aristotle's Greek) here means "in actuality *now*" or "fixedly/settled *now*".** A present-tense proposition like "Socrates is sitting" has a truth value fixed by the current state of affairs. A past-tense proposition is fixed by what has happened. A future contingent proposition lacks this current ontological grounding to fix its truth value *now*. Its truth value depends on future, undetermined events.

      *   **Temporal Ontology and Contingency:**
          *   Aristotle's metaphysics holds that the **past is fixed and necessary** ("what is... has taken place"). What happened *cannot* be changed. This grounds the determinate truth value of past and present propositions.
          *   The **future is open** for genuinely contingent events. Their occurrence depends on possibilities that haven't been actualized yet. There is no *current* state of affairs to make "There will be a sea-battle tomorrow" true *now* or false *now* in the same settled way. Its truth-maker lies in the future.

  3.  **How This Blocks Fatalism:**

      The fatalist argument Aristotle sets up earlier runs roughly like this:
      1.  For any future event (like a sea-battle), the proposition asserting it (P) is either true or false *now* (Bivalence).
      2.  If P is true *now*, then it is *necessary* that the sea-battle happens tomorrow (since a true statement about the future must correspond to a fixed future fact).
      3.  If P is false *now*, then it is *necessary* that the sea-battle does *not* happen tomorrow.
      4.  Therefore, from 1, 2, & 3: Either the sea-battle is necessary or its absence is necessary. Contingency is impossible. All events are fated.

      **Aristotle's Response:** He attacks premise (1) *as interpreted by the fatalist*. He agrees that *eventually* P or ~P will be true (upholding LEM and eventual Bivalence), but **denies that either P or ~P is *determinately* true or false *now*** for future contingents. The truth value is *not fixed* at the present moment. Therefore, we cannot *now* say "P is true" (implying necessity) or "P is false" (implying the impossibility of the event). The *necessity* the fatalist derives relies on the *current determinacy* of the truth value. By denying this current determinacy while affirming eventual Bivalence and LEM, Aristotle blocks the inference to necessity (steps 2 & 3) and preserves genuine contingency. The future is open *because* its truth values are not yet settled.

  4.  **Does it Abandon Bivalence for Present/Past?**

      **No.** Aristotle explicitly contrasts the future case with the present and past. For "that which is or which has taken place," propositions *are* determinately true or false *now*. The ontological grounding for their truth/falsity exists in the fixed past or present. His restriction applies *only* to singular propositions about *future contingent* events. Statements about the present ("It is raining now") or past ("Caesar crossed the Rubicon") retain their determinate bivalent status.

  5.  **Coherence and Challenges:**

      *   **Textual Support:** The text strongly supports this interpretation. Aristotle explicitly contrasts the future case with present/past, emphasizes the lack of *determinacy*, uses language like "undecided" and "not actually true/false," and bases the difference on the ontological status of the future ("that which is not always existent or not always non-existent" – i.e., contingent events).
      *   **Does the Position Succeed?** This is a major philosophical debate:
          *   **Strengths:** It offers a seemingly intuitive way to reconcile logical principles (LEM, eventual Bivalence) with metaphysical contingency and avoid fatalism. It captures the sense that *right now*, the future sea-battle genuinely *might* or *might not* happen.
          *   **Challenges:**
              *   **The Status of "Will":** What does it *mean* to say "There *will* be a sea-battle tomorrow" if it's not *true now*? Aristotle might say it expresses a tendency or likelihood based on current causes, but not a settled fact.
              *   **Truthmakers:** What makes a future contingent proposition *become* true? How does the transition from indeterminate to determinate truth value occur? Aristotle doesn't fully address this.
              *   **Logical Complications:** Denying *current* determinate truth values while affirming eventual truth/falsity creates complexities for logic (e.g., the principle that if P is true at any time, it's always true thereafter). Later logicians (like Łukasiewicz) developed formal three-valued systems explicitly inspired by this passage to handle "indeterminate" as a third truth value.
              *   **Metaphysical Commitment:** It requires a robust metaphysics of temporal becoming and an open future, which not all philosophers accept.

  **Conclusion:**

  Aristotle is **not contradicting himself** in *De Interpretatione* 9. He is making a sophisticated and coherent distinction between:

  1.  The **logical necessity of the disjunction** (P or ~P must be true).
  2.  The **metaphysical contingency of the disjuncts** (Neither P nor ~P is necessary).
  3.  The **determinacy of truth value** (Present/Past: determinate; Future Contingents: indeterminate *now*, though eventually determinate).

  By denying the *current determinacy* of truth values for future contingent singular propositions, while affirming the Law of Excluded Middle and *eventual* Bivalence, he successfully **blocks the logical fatalist argument** (which relies on current determinate truth entailing necessity) **without abandoning Bivalence for statements about the present and past.** His position hinges on a specific metaphysical view of time and contingency, where the future's openness is reflected in the *current indeterminacy* of the truth values of propositions about it. Whether this position is ultimately satisfactory is a deep philosophical question, but it is a powerful and influential response to the problem of fatalism grounded in a careful analysis of truth, time, and modality. Your suspicion that many invoke it without working through the details is likely correct – the argument's subtlety is easily missed!
