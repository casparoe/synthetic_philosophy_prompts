  The five options:

  1. Kant's own hard line: The sympathetic person has no moral worth because they act from inclination; only the person acting from duty (even if miserable) has moral worth.

  2. Barbara Herman's "motive of duty as a limiting condition": The motive of duty serves as a background condition that checks inclinations, but it doesn't require that duty be the sole motive. The sympathetic helper can have moral worth if their inclination is regulated by duty.

  3. Richard Henson's "fitness report" vs. "battle citation": Henson distinguishes two ways of assessing moral worth. The "fitness report" (like Kant's hard line) focuses on the act being done solely from duty. The "battle citation" allows that an act can have moral worth even if done from inclination, as long as the agent would have done it from duty if the inclination weren't present. This allows the sympathetic helper to have moral worth.

