  - Team reasoning: Similar to Kantian in that it changes the perspective. The agent acts as a team member and chooses the action that is best for the team. This does not condition on the other's action, but if the other does not team reason, the outcome is bad. The symmetry in the twin case might make it reasonable to adopt team reasoning, but the circularity worry is that without the other also adopting it, it fails. However, the adoption is a shift in reasoning that is independent.

