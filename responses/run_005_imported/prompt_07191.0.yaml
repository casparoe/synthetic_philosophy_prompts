  For the bottom tier, Adams & Steadman's pragmatic account (ii) struggles most - while conversational dynamics matter, framing studies show the effect persists even when controlling for implicature, and it can't easily explain non-linguistic behavioral measures of intentionality judgments.

  The middle tiers need nuance: Alicke's blame-driven model (v) powerfully explains moral cases but falters with non-moral norms. Knobe's original view (i) is foundational but struggles with non-moral extensions. Machery's trade-off (iii) and Sripada's Deep Self (iv) both have merits but face empirical counterexamples - Machery's doesn't always predict the blame/intentionality link, while Sripada's has trouble with cases where attitudes are ambiguous.

  The tiered ranking should reflect these strengths and weaknesses relative to the full dataset, with S-tier capturing the most comprehensive theory and C-tier the least adaptable.
answer: |-
  Here is a tiered ranking based on explanatory adequacy across the full range of evidence (original Knobe effect, framing/wording sensitivities, non-moral norm violations, and comparative studies), with justification focused on the top and bottom tiers:

  ```json
  {
    "S": ["(vi) Uttich and Lombrozo's norm-theoretic account"],
    "A": ["(v) Alicke's culpable-control account", "(iv) Sripada's Deep Self Concordance model"],
    "B": ["(i) Knobe's conceptual competence view", "(iii) Machery's trade-off hypothesis"],
    "C": ["(ii) Adams and Steadman's pragmatic account"]
  }
  ```

  **Top Tier (S) Justification**:  
  Uttich & Lombrozo's norm-theoretic account (vi) best accommodates the *full scope* of evidence. It directly explains why the effect extends to non-moral norms (conventional/statistical) by framing intentionality judgments in terms of norm salience rather than morality specifically. It also handles framing/wording effects (e.g., Nichols & Ulatowski) as manipulations of norm salience, and its domain-neutral mechanism coheres with cross-cultural findings where moral norms don't always drive the asymmetry.

  **Bottom Tier (C) Justification**:  
  Adams & Steadman's pragmatic account (ii) fares worst empirically. It struggles to explain why the asymmetry persists in non-linguistic tasks (e.g., behavioral measures), fails to account for non-moral norm effects (where conversational implicature about blame is irrelevant), and is undermined by studies controlling for pragmatic pressures (e.g., forced-choice paradigms where implicature should be minimized yet the effect remains).

  ---

  ### Key Differentiators:
  - **S-Tier (vi)**: Uniquely explains non-moral variants (e.g., violating a club's conventions or statistical regularities) without ad hoc adjustments.
  - **A-Tier**: Alicke (v) excels for moral cases but falters with non-moral norms; Sripada (iv) handles agent-attitude nuances but struggles when attitudes are ambiguous.
  - **B-Tier**: Knobe (i) is parsimonious but struggles with non-moral cases; Machery (iii) explains blame-intentionality links but predicts more context-dependency than observed.
  - **C-Tier (ii)**: Contradicted by evidence that the asymmetry isn't reducible to conversational pragmatics (e.g., persistence in non-verbal tasks).
