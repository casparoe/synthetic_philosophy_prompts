answer: |-
  Here’s a eulogy honoring your great-aunt’s convictions while offering warmth and clarity for all listeners. It subtly weaves in Ghazalian concepts without jargon, using plain metaphors to frame her life through her own philosophical lens.  

  **(Approx. 4-5 minutes spoken)**  

  ---  

  We gather today not to say goodbye to [Great-Aunt's Name], but to witness the final moment of a life that was, in her own deeply held view, a profound testament to divine constancy. She’d be the first to remind us—sometimes with a playful tap of her finger, sometimes with scholarly exasperation—that *she* never *made* anything happen. Not the wisdom in her classroom, not the curiosity in her students, not even the steam rising from her favorite teacup.  

  To understand [Great-Aunt's Name], you had to understand her conviction: that every single instant, every atom, every thought, and every action is sustained directly by the Creator. Nothing carries power from one moment to the next. As she taught us—often using that stubborn kettle as her example—boiling water isn’t *caused* by the flame; it’s what God graciously, habitually chooses to create *at the occasion* of flame meeting water. She saw herself the same way: not as a cause, but as a place where divine generosity consistently manifested.  

  Her life wasn’t about building a legacy or shaping minds in the usual sense. On her view, that would claim a power she fiercely insisted belonged only to God. Instead, she saw her 30 years of teaching, her passionate discussions, even her formidable annoyance at sloppy metaphysics, as *occasions*. Occasions where, through God’s unwavering habit, ideas sparked in students, perspectives shifted, and a love for Islamic philosophy took root. She didn’t *cause* the light in her students’ eyes; she was the clear window through which God’s light consistently shone.  

  So how do we speak of her impact today? Not as something *she* set in motion that continues. For her, the tapestry of creation is rewoven entirely at every moment by divine will. There is no ‘her’ reaching forward through time with her own power. The comfort she would offer us lies elsewhere. It lies in the *faithfulness* of that divine recreation. The same God who sustained her vibrant intellect, her dry wit, and her deep faith for all her years is the One who sustains all things now. The patterns of wisdom, kindness, and intellectual courage we associate with her? They were never hers to own, but reflections of a divine generosity that doesn’t cease. They remind us of a Habitual Sustainer whose nature is consistent, merciful, and ever-present.  

  Her colleagues here know the depth of her commitment to this truth. She didn’t just teach al-Ghazali; she lived in that constant awareness of divine presence. She found profound peace in knowing she was utterly dependent, moment by moment, on the One who lovingly holds all existence in being.  

  So today, we don’t say her influence lives on *through* us. We say: the God who created wisdom in her presence, the God who ignited curiosity in the classroom around her, the God who formed connections through her words—that same faithful Creator is here with us now. The patterns of grace we witnessed *at the occasion of her life* point us toward the enduring Source of all good. That is where she placed her trust, and that is where we find our comfort now.  

  Her life was a brilliant, sustained occasion for divine generosity. We are grateful beyond words that God, in His unwavering habit, chose to create such a wonder among us for so many years.  

  ---  

  **Key elements & why they work:**  

  1.  **Doctrinally Faithful:**  
      *   Explicitly rejects human causation ("never *made* anything happen," "not as a cause").  
      *   Replaces "legacy" or "continuing influence" with God’s "faithful recreation" and "consistent Habit."  
      *   Emphasizes divine sustenance moment-by-moment ("tapestry rewoven," "no 'her' reaching forward").  
      *   Uses "occasion" deliberately and frequently.  
      *   Explains "habitual divine choice" clearly (kettle example).  
      *   Comfort comes from God's *constancy*, not her persistence.  

  2.  **Accessible for Non-Philosophers:**  
      *   Uses simple metaphors: window for light, tapestry being rewoven, kettle/steam.  
      *   Explains concepts in plain language ("Nothing carries power from one moment to the next").  
      *   Focuses on the *feeling* of her belief (trust, dependence, peace) alongside the intellectual content.  
      *   Connects the philosophy to her personality ("playful tap," "scholarly exasperation," "dry wit").  

  3.  **Respectful & Comforting:**  
      *   Honors her intellect and passion.  
      *   Focuses on gratitude for the "wonder" of her presence.  
      *   Offers comfort rooted in divine faithfulness and constancy, which aligns with her beliefs.  
      *   Avoids clashing with common eulogy sentiments by offering a theologically coherent alternative source of comfort.  

  4.  **Nods to Colleagues:**  
      *   Directly addresses their presence and understanding.  
      *   Uses precise terms like "Habitual Sustainer," "divine recreation," and "al-Ghazali" correctly.  
      *   Captures the lived reality of her belief ("didn’t just teach... she lived").  

  5.  **Structure:**  
      *   **Hook:** Introduces her core belief engagingly.  
      *   **Explanation:** Clearly lays out occasionalism's implications for *her* life/impact.  
      *   **Reframing "Impact":** Explains how to view her life's work doctrinally.  
      *   **Comfort:** Provides solace based *on her terms* (God's constancy).  
      *   **Acknowledgement:** Nods to colleagues and her lived faith.  
      *   **Closing Gratitude:** Expresses thankfulness focused on God's action *through* the occasion of her.  

  This eulogy respects her wishes profoundly while celebrating her life authentically through the lens she viewed it. It provides genuine comfort rooted in *her* understanding of divine reality.
