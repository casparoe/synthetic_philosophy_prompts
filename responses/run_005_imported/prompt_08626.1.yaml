answer: |-
  You've hit on a classic democratic paradox inherent in boundary changes like annexation: **defining "the people" who get to decide *who* "the people" are is inherently circular.** There's no perfect, logically pristine solution that escapes this circularity, but there *are* more and less principled approaches based on different values. The current system (only existing town voters) is common but ethically problematic for the reasons you see.

  Here's a breakdown of the competing principles and potential "fixes":

  1.  **The Status Quo Principle (Existing Voters Only):**
      *   **Argument:** The town's governance and tax base belong to its current residents. They have the right to decide who joins their political community and shares its assets/liabilities. Adding the subdivision changes the character, costs, and benefits for *them*. The subdivision residents haven't contributed to building the town and aren't subject to its rules *yet*.
      *   **Problem:** It binds outsiders to rules and taxes without their consent ("no taxation without representation"). It ignores the profound impact *on* the subdivision.

  2.  **The Affected Interests Principle (Include Subdivision Voters):**
      *   **Argument:** The decision fundamentally alters the lives, finances, and governance of subdivision residents. Basic democratic fairness dictates that those most directly and significantly affected by a decision should have a say in it.
      *   **Problem:** As the council member stated, this *presupposes* they *are* part of the relevant political community *before* the decision is made. It risks letting outsiders decide the fate of the town's resources and character without being part of it. Legally, they aren't residents yet.

  3.  **The Dual Majority/Approval Principle:**
      *   **Potential Fix:** **Require the referendum to pass *both* among existing town voters *and* among eligible voters within the subdivision.** Only if *both* groups approve does annexation proceed.
      *   **Principles:** Balances the rights of the existing community to control its destiny with the rights of the affected outsiders not to be forcibly incorporated against their will. Recognizes both sets of interests as legitimate.
      *   **Advantages:** Directly addresses the core fairness issue. Avoids the circularity trap by creating a separate, parallel electorate for the affected area. This is a common and principled approach used in many jurisdictions for annexations.
      *   **Disadvantages:** More complex logistically. Makes annexation harder to achieve. Existing town voters might object to "outsiders" having a veto over *their* town's expansion plans. Legally requires defining who in the subdivision is eligible (property owners? residents?).

  4.  **The Supermajority Principle:**
      *   **Potential Fix:** Require a supermajority (e.g., 60% or 2/3) of existing town voters to approve annexation.
      *   **Principles:** Acknowledges that forcibly incorporating an unwilling population is a significant act requiring stronger consensus than a simple majority among the existing electorate. Raises the bar for overriding the lack of consent from the subdivision.
      *   **Advantages:** Simpler logistically than a dual vote. Still signals that annexing an unwilling population demands extraordinary justification.
      *   **Disadvantages:** Doesn't *directly* give subdivision residents a voice; it just makes overriding their presumed objection harder. Still fundamentally exclusionary. What constitutes a "supermajority" is somewhat arbitrary.

  5.  **The Post-Annexation Representation Guarantee:**
      *   **Potential Fix (Complementary, not a franchise fix):** Couple the annexation (decided by existing voters) with an *immediate guarantee* of representation for the new residents. E.g., automatically adding council seats specifically for the annexed area effective immediately upon annexation, or holding special elections very soon after.
      *   **Principles:** Mitigates the "taxation without representation" period. Acknowledges that while the *decision* to annex rests with the existing polity, the *governance* of the newly annexed must include them without delay.
      *   **Advantages:** Addresses the most acute democratic deficit (temporary disenfranchisement). More palatable to existing voters than giving subdivision residents a vote *on* annexation.
      *   **Disadvantages:** Still excludes them from the *initial, binding decision* itself. Doesn't solve the core circularity/franchise problem for the referendum.

  **Why it's "Turtles" but Manageable:**

  The circularity is real: *Any* definition of the franchise for a boundary-setting vote presupposes a prior definition of the boundary. This is a foundational problem in political theory.

  **The Principled Answer:**

  The most widely accepted principled answer that directly addresses the ethical dilemma you perceive is **Option 3: Dual Majority/Approval.**

  *   **It explicitly recognizes two distinct sets of legitimate interests:** the existing town's right to control its expansion and the potential new residents' right not to be incorporated against their will.
  *   **It avoids the presupposition problem:** By having separate electorates defined by current boundaries, it doesn't assume the subdivision is *already* part of the town when voting on *whether* it should join.
  *   **It embodies consent:** Annexation only happens with the consent of both communities.
  *   **It's common practice:** Many state annexation laws require approval from voters or property owners in the area to be annexed for precisely these reasons.

  **What You Can Do:**

  1.  **Research State Law:** Check your state's laws governing municipal annexation. Many states *mandate* dual approval mechanisms (vote in annexing city + vote in area to be annexed) for certain types of annexations, especially those involving populated areas. If your state law allows or requires this, it's a powerful argument.
  2.  **Frame the Argument Ethically:** Focus on the core democratic principle: "People shouldn't be permanently bound by laws and taxes imposed by a government they had absolutely no say in creating or joining, especially when the decision *to* join them is being made *for* them without their input."
  3.  **Propose Dual Approval:** Advocate to the council that the *only* way to make the referendum truly fair and avoid imposing rule on an unwilling population is to require approval from both the existing town voters *and* the eligible voters within the subdivision.
  4.  **Highlight Practical Benefits:** An annexation opposed by the subdivision residents is likely to lead to resentment, non-compliance, integration problems, and potentially legal challenges. A "yes" vote from both sides creates a stronger foundation for the merged community.
  5.  **Compromise Proposal:** If dual approval seems politically impossible, advocate for a supermajority requirement *plus* a guaranteed fast-track for representation post-annexation.

  **Conclusion:**

  The current system *is* arbitrary (it privileges the existing boundary) and circular (it defines the voters based on the boundary the vote is meant to change). While no solution escapes the foundational circularity completely, requiring **dual approval from both the existing town voters and the subdivision voters** is the most principled way to balance the legitimate interests and rights of both communities affected by the decision. It moves beyond the "turtles" by explicitly acknowledging two distinct groups with a stake in the outcome and requiring consent from both. Push for that.
