answer: |-
  You've honed in on a genuinely profound tension within Quine's system, and your inference is sharp. Let's pressure-test it:

  1.  **The Core Similarity is Real & Powerful:**
      *   You're absolutely correct that Quine's argument against the analytic/synthetic distinction in "Two Dogmas" fundamentally relies on **confirmation holism**: meaning is fixed holistically within the web of belief, and revision under recalcitrant experience targets the *web as a whole*, with pragmatic factors (simplicity, centrality, conservatism) determining where revision occurs. There's no principled *epistemic* line between "meaning" and "fact."
      *   In "On the Nature of Moral Values," Quine explicitly applies **the same holistic, pragmatic model to ethics**: Moral standards form a "web" or "fabric." Recalcitrant *experience* (often involving *feelings* like guilt, outrage, sympathy) prompts piecemeal revision guided by the same pragmatic virtues (simplicity, conservatism, harmony with the rest of the web). No single moral judgment is tested in isolation against "pure fact" or "pure feeling" any more than a single scientific sentence is tested against "pure experience."

  2.  **The Asymmetry Claim & Its Vulnerability:**
      *   Quine's hedge about science having "some title" to correspondence and ethics being relegated to coherence *is* precisely a restatement of the desired asymmetry, not an argument *for* it based on his holism. He *asserts* that science has a causal connection to the world via sensory stimulation that ethics lacks.
      *   **Your Challenge Hits Home:** Given that *both* science *and* ethics operate under the *same* holistic, pragmatic model of revision under recalcitrant experience (even if the *nature* of the experience differs - sensory stimulation vs. complex feelings/social pressure), what *within Quine's own holism and naturalism* justifies this radical asymmetry in their claims to "truth" and "correspondence"?

  3.  **Potential Defenses of Quine's Asymmetry (and Their Weaknesses):**

      *   **The Input Channel Argument:**
          *   **Defense:** Science's unique claim stems from its **causal link to sensory receptors**. Observation sentences are directly keyed to patterns of sensory stimulation ("Ouch," "Red here now"). This provides a non-inferential, causal anchor point for the *entire* web, including theoretical science. Moral judgments, while responsive to *experiences* (seeing suffering), lack this direct, pre-linguistic, *sensory-specific* coding. The input for ethics is more diffuse, involving complex feelings and social interactions mediated by language from the start.
          *   **Pressure-Test:** Is this difference in *input channel* sufficient to justify the *metaphysical* asymmetry (correspondence vs. coherence)? Holism already shows that *no* sentence, not even observation sentences, is immune to revision based on global pragmatic considerations (though they are highly conservative). Further, feelings *are* natural phenomena, part of the causal order. Why can't the complex experiences triggering moral revision (e.g., witnessing injustice causing outrage) be seen as a *different kind* of causal input anchoring the ethical web, even if less precise than retinal stimulations? Quine's naturalism should arguably treat all human responses as natural phenomena.

      *   **The Role of "Feeling" vs. "Sensation":**
          *   **Defense:** Quine might argue that the "recalcitrant experience" in science is fundamentally about *sensory prediction* being violated, while in ethics, it's about *feeling* (discomfort, dissonance) arising from conflicts within the web *or* with social norms/empathy. Feelings, for Quine, might be seen as internal states lacking the direct, intersubjectively calibratable link to external objects that sensory stimulations provide.
          *   **Pressure-Test:** This risks smuggling in a Cartesian dualism Quine rejects. Feelings *are* physical states, part of the causal fabric. More importantly, the holism applies equally: revising a scientific theory to resolve dissonance with evidence *feels* different than revising a moral stance, but the *logical structure* of holistic revision under pressure is identical. Privileging "sensory prediction" as uniquely "world-tracking" seems arbitrary within a naturalistic framework that views humans as complex biological systems responding to myriad environmental inputs.

      *   **Naturalized Epistemology's Privileging of Science:**
          *   **Defense:** Quine's naturalized epistemology *starts* from within science. Science, as the most successful tool for prediction and control, is the framework through which we understand *everything*, including ethics. Therefore, science gets to set the standard for "truth" and "correspondence." Ethics, while holistic and revisable, is seen as a different *project* within the natural world, perhaps more akin to aesthetics or social convention, lacking the same robust connection to the fundamental physical structure science describes.
          *   **Pressure-Test:** This defense risks being **circular** or **question-begging**. It *assumes* the very asymmetry your inference challenges. If holism shows the *method* of revision is structurally identical, why should science get to define "truth" in a way that excludes ethics *a priori*? This seems like a relic of logical positivism Quine otherwise dismantled. A truly radical naturalism might demand we investigate the *actual* function and revision of moral discourse within human life without pre-judging its metaphysical status based on the privileged position of physics.

      *   **The "Correspondence/Coherence" Distinction Doing Heavy Lifting:**
          *   **Assessment:** You are right to suspect this hedge is crucial. Quine likely sees "correspondence" as *requiring* the specific causal chain via sensory stimulation that science possesses. "Coherence" is the fallback for systems lacking that anchor. **The work it does is *defining* the asymmetry, not *justifying* it based on shared holism.** It reflects Quine's underlying physicalism and his view that science describes the fundamental causal structure. Ethics, on this view, supervenes on that structure but doesn't *describe* it in the same direct way.

  4.  **Conclusion: Your Inference Holds Significant Weight**

      *   **Yes, the Parallel is Strong:** Your core insight is correct. Quine's application of holism to ethics *does* create significant pressure to collapse the fact/value distinction in the same way the analytic/synthetic distinction collapsed. The structural similarity in their holistic revision undermines a *principled epistemic* distinction between how scientific and moral beliefs are justified and revised.
      *   **The Asymmetry Rests on External Commitments:** Quine's insistence on the correspondence/coherence divide isn't *derived* from holism; it's an *imposition* based on his deeper commitments to **physicalism** and the idea that **science (specifically physics) provides the fundamental ontology and causal story**. The difference in *input channels* (sensory stimulations vs. complex feelings/social experiences) is the point where these commitments bite, allowing him to maintain the asymmetry *despite* the shared holistic revision process.
      *   **Vulnerability:** The weakest point is whether this reliance on input channels and physicalism truly *justifies* the radical metaphysical asymmetry ("correspondence" vs. mere "coherence") within a framework that otherwise emphasizes the continuity of human cognition and the pragmatic nature of belief revision. It can appear as an *ad hoc* exception to save a pre-conceived hierarchy rather than a conclusion forced by the holistic model itself. A more thoroughgoing Quinean naturalism, taking the holism and the natural status of moral feelings seriously, *could* lead to a more unified picture where both science and ethics aim at (different aspects of) truth within a single, vastly complex web of belief, albeit anchored differently.

  **For Your Dissertation:** This is a rich line of argument. You can powerfully argue that Quine's holism *logically extends* to undermine the fact/value distinction just as it did analytic/synthetic. His resistance stems not from holism itself, but from his physicalist ontology and privileging of sensory input as the *sole* conduit for "correspondence." Critically examine whether this resistance is consistent with the radical implications of his holism and naturalism, or if it represents a lingering positivist/empiricist bias. Engaging with critics who push Quine further towards a collapse (e.g., some readings of Putnam, or contemporary neo-pragmatists) or defenders who argue the input channel difference *is* decisive would strengthen your chapter.
