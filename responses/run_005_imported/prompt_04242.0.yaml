  First, I need to recall Quine's arguments in both texts. In "Two Dogmas," holism shows that no sentence is verified in isolation; it's the entire web of belief that faces experience. This leads to the rejection of analytic truths as a distinct category. In his ethics essay, Quine describes moral judgments as part of a holistic system, revised based on experience and feeling. But he still claims science has a correspondence theory of truth, while ethics is coherence-based. The user sees this as a restatement of the asymmetry, not a justification.

  The user's main challenge is to pressure-test their inference: once ethics is granted the same holism, why doesn't the fact/value distinction collapse like analytic/synthetic did? They suspect Quine's correspondence/coherence distinction might be doing more work than it appears. 

  I should consider Quine's naturalism. He roots epistemology in natural science, so science's empirical grounding is fundamental. For Quine, observation sentences are directly tied to sensory stimuli, providing a causal link to the world. Moral judgments, however, lack this direct tie. They're responsive to experience but mediated by feelings, not stimuli. This could be the key asymmetry. 

  The user mentions Quine's hedge about science having "some title" to correspondence. I need to explore if this is an ad hoc exception or consistent with his epistemology. Quine's naturalized epistemology treats science as the arbiter of truth, so perhaps he's privileging science's empirical basis. But does that commit him to a double standard? 

  Also, the user might be implying that Quine's position is inconsistent. If holism dismantles one dichotomy, why not another? The answer might lie in the different roles of sensory input. For science, recalcitrant experience directly challenges theories via observation sentences. In ethics, feelings prompt revisions, but these aren't tied to specific stimuli. This difference in input channels could justify the asymmetry. 

  I should also address whether Quine's coherence theory for ethics is sufficient. If moral values cohere internally but lack empirical reference, does that make them non-cognitive? Quine seems to avoid that, but it might lead to relativism. The user's deeper concern could be whether Quine's framework can accommodate objective moral values without collapsing into relativism or needing an external foundation.

  The user's dissertation likely aims to critique or reconcile Quine's naturalism with ethics. Their unspoken need might be to strengthen their argument by either defending Quine's asymmetry or showing its instability. They might want to position their work within broader meta-ethical debates, like moral realism vs. anti-realism. 

