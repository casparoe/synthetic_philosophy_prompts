prompt: |-
  I have no formal training in philosophy, but I've spent the past couple of years working through the experimental philosophy literature on my own, and I now run a small monthly discussion group at my local library. Next month's guest is a philosopher who defends Joshua Knobe's own reading of his famous boardroom vignette -- the one where a chairman declares that he doesn't care at all about harming, or helping, the environment, so long as the company turns a profit -- namely, that whether a foreseen side effect counts as "intentional" is genuinely fixed by how morally good or bad we judge it to be, and that this is built into the ordinary concept itself rather than a bias distorting it. Draft eight to ten questions for our Q&A that go beyond having her simply restate the finding. I want one question on the rival "conversational pragmatics" explanation associated with Adams and Steadman, one on the Uttich-and-Lombrozo-style worry that the same asymmetry shows up even when the violated norm isn't moral at all, and one on why the same pattern reappears in judgments of causing, deciding, and wanting -- for each, include a follow-up keyed to the answer she's most likely to give. Close with a question about what pattern of results would actually convince her that she's wrong.
reasoning: |-
  Okay, the user is running a discussion group and needs help crafting questions for a guest philosopher who supports Joshua Knobe's interpretation of his boardroom experiment. Let me break down their request.

  First, they want questions that go beyond restating Knobe's findings. They specifically mentioned three topics: the conversational pragmatics explanation by Adams and Steadman, the Uttich & Lombrozo concern about non-moral norms, and the pattern extending to other verbs like causing/deciding/wanting. Plus a final question about what evidence would change the philosopher's mind.

  The user seems knowledgeable about experimental philosophy despite no formal training - they're familiar with key literature and researchers. Their questions show they want to push the guest beyond surface-level explanations. I should craft questions that probe the theoretical tensions while remaining accessible for a library discussion group.

  For the pragmatics angle, I'll need a question contrasting Knobe's conceptual competence view with the pragmatic alternative. The follow-up should challenge whether pragmatic effects can be experimentally disentangled. 

  For the non-moral norms issue, I'll reference Uttich & Lombrozo's work directly. The follow-up should ask whether moral valence might still be sneakily involved in those cases.

  Regarding the verb generalization, I'll ask why the asymmetry persists across different judgment types. The follow-up should question whether this broad pattern actually weakens Knobe's moral thesis by showing the effect isn't specific to intentionality.

  Finally, the falsifiability question needs to be concrete - what specific experimental outcome would make the guest reconsider their position? This forces them to define their theory's boundaries.

  Throughout, I'll maintain academic rigor while keeping language accessible. The questions should model good philosophical discussion - probing but respectful. I'll avoid jargon where possible, but some technical terms like "pragmatics" and "valence" are unavoidable given the subject matter.

  The user clearly wants to foster deep understanding in their group, so these questions should help unpack the debate's complexities while keeping it engaging. I'll aim for 8-10 questions total as requested, with the specified three focus areas plus the closer.
answer: |-
  Here are 9 questions designed to push the discussion beyond simple restatement, targeting the key areas you requested, with likely follow-ups:

  1.  **Core Challenge to Pragmatics:** Professor Adams and Steadman argue the Knobe Effect arises from *conversational pragmatics* – specifically, that labeling the harm "intentional" is a way to *pragmatically imply* blameworthiness in a context where the chairman's indifference is salient, not because the concept itself is morally loaded. How does your defense of the competence theory decisively rule out this pragmatic explanation as the *primary* driver of the asymmetry?
      *   *Likely Answer/Focus:* Competence theory might argue pragmatics *builds on* the core conceptual link, or point to cases where pragmatics seem insufficient (e.g., non-linguistic tasks, cross-cultural robustness).
      *   **Follow-Up:** If the pragmatic explanation *is* parasitic on the conceptual structure (as some competence defenders suggest), how do we experimentally disentangle whether the moral valence is *constitutive* of the concept itself (your view) versus merely the *most salient trigger* for deploying a pragmatic mechanism operating on a morally neutral concept?

  2.  **Non-Moral Norm Challenge (Uttich & Lombrozo):** Uttich and Lombrozo found the same asymmetry (higher "intentional" ratings for bad outcomes) even when the violated norm was purely *conventional* (e.g., a club rule) or *prudential*, not moral. Doesn't this suggest the effect stems from norm-violation *salience* or *deviance* in general, rather than being uniquely tied to the *moral* valence built into the concept of intentionality?
      *   *Likely Answer/Focus:* Competence theory might argue moral norms are primary/fundamental, or that conventional/prudential norms often carry implicit moral weight, or reinterpret the findings.
      *   **Follow-Up:** If the effect truly generalizes to *any* salient norm violation (moral, conventional, prudential), doesn't that significantly weaken the claim that *moral* goodness/badness is the *specific* feature built into the *concept* of intentionality? Might "norm deviance" or "significance" be the more fundamental cognitive factor?

  3.  **Generalization to Other Verbs:** The Knobe Effect isn't limited to "intentionally." We see similar asymmetries in judgments about whether an agent *caused* an outcome, *decided* to bring it about, or even *wanted* it to happen. Why does the competence theory predict that moral valence would pervasively shape judgments across this entire *family* of folk-psychological concepts?
      *   *Likely Answer/Focus:* Competence theory might argue these concepts are deeply interconnected within our folk psychology, sharing a common structure sensitive to an agent's evaluative stance or the normative status of outcomes.
      *   **Follow-Up:** Doesn't this broad pattern actually pose a challenge? If moral valence shapes judgments of *causation*, *desire*, and *decision* just as strongly as *intentionality*, doesn't that suggest we're looking at a more general cognitive bias affecting *attribution* or *evaluation* of agency, rather than revealing something *specifically constitutive* of the *concept* of intentional action itself? Could the effect on "intentionally" be downstream from these other biased judgments?

  4.  **Conceptual Competence vs. Performance:** Critics often frame the Knobe Effect as a *performance error* – a bias distorting the application of a morally neutral concept of intentionality. You argue it reflects *conceptual competence*. What specific criteria distinguish a genuine feature of conceptual competence from a systematic performance error in this context?
      *   *Likely Answer/Focus:* Competence might be argued to be early-developing, cross-culturally stable, resistant to instruction, or structurally integrated with other core concepts.
      *   **Follow-Up:** Couldn't a deeply ingrained *bias* (e.g., stemming from evaluative processing fundamental to social cognition) also exhibit these features (early, stable, resistant, integrated) without being *constitutive* of the specific concept's meaning? How do we decide?

  5.  **The Role of Indifference:** In the boardroom vignette, the chairman's explicit *indifference* ("I don't care...") seems crucial. How integral is this expression of indifference to generating the effect, according to the competence theory? Does the moral valence still shape intentionality judgments if the agent has a *positive* attitude towards the side-effect (e.g., mild pleasure) without explicitly stating indifference?
      *   *Likely Answer/Focus:* Competence theory might see indifference as highlighting the lack of a *pro-attitude* towards the good, making the bad outcome more saliently attributable to the agent's core commitment (profit).
      *   **Follow-Up:** If the effect diminishes significantly when indifference isn't explicit (or changes with the agent's specific attitude), does that suggest the effect relies more on *pragmatic interpretation* of the agent's stated mental state within the narrative context, rather than the moral status of the outcome being *directly* built into the concept?

  6.  **Cross-Cultural Variation:** Some studies show cross-cultural variation in the strength or even presence of the Knobe Effect. How does the competence theory account for this variation? If the moral valence *is* built into the ordinary concept, shouldn't we expect near-universality?
      *   *Likely Answer/Focus:* Competence theory might argue variation reflects differences in *what* is considered morally salient or in the relative weight of competing factors within the concept, not the core link itself.
      *   **Follow-Up:** If the effect disappears or reverses in some cultural contexts for outcomes deemed morally significant *within that culture*, doesn't that strongly suggest the moral evaluation is an *input* shaping the judgment via local norms, rather than an *internal feature* of a universal concept?

  7.  **"Side-Effect" as a Conceptual Marker:** Is the "side-effect" status of the outcome essential to the competence theory's explanation? Why wouldn't the moral valence equally shape intentionality judgments for outcomes that are merely *foreseen* but not strictly side-effects (e.g., intermediate steps)?
      *   *Likely Answer/Focus:* Competence theory might argue that side-effects specifically reveal the agent's true priorities when their primary goal is clear.
      *   **Follow-Up:** If the effect weakens or changes when the outcome is framed as an unintended *means* rather than a side-effect, does that imply the effect is more about *causal structure* and *goal hierarchy* within an action description, with moral valence acting as a *modulator*, rather than being directly constitutive?

  8.  **Developmental Evidence:** What does developmental psychology tell us? Do young children exhibit the Knobe Effect? If they don't acquire it until later, or if it develops alongside other moral reasoning capacities, doesn't that challenge the idea that the moral link is a fundamental, early-acquired feature of the *concept* itself?
      *   *Likely Answer/Focus:* Competence theory might predict early emergence, or argue that the concept matures alongside moral understanding.
      *   **Follow-Up:** If the effect emerges significantly *after* children have mastered the core components of intentional action (desire, belief, skill) and coincides with the development of sophisticated moral evaluation, doesn't that suggest the moral link is an *acquired association* or *application heuristic*, not a core conceptual feature present from the start?

  9.  **Falsifiability:** What specific pattern of empirical results, if discovered, would genuinely convince you that the competence theory is incorrect, and that the Knobe Effect is better explained by pragmatic mechanisms, general attribution biases, or salience of norm-violation, rather than moral valence being built into the concept of intentionality itself?
      *   *Likely Answer/Focus:* This forces a concrete commitment. Possible answers might involve: elimination of the effect under conditions preserving moral valence but altering context/verbs, reversal of the effect for morally good outcomes without changing the core structure, or isolation of the effect *only* at the pragmatic level in tightly controlled experiments.
      *   **Follow-Up (Implicit):** Listen carefully to the specific criteria mentioned – these become key points to reference in future discussions or research.

  These questions encourage the speaker to defend the *distinctiveness* and *robustness* of the competence theory against prominent alternatives and anomalies, moving the discussion beyond the basic finding into the heart of the theoretical debate. Good luck with the discussion!
