  Next, Elena's real contributions. Despite the role's flaws, she showed skill and judgment. Highlighting her ability to handle pressure, make quick decisions, and maintain empathy even when overrides were rare. Emphasize her professionalism and the respect she earned from the team.

  The toast needs to avoid direct criticism of leadership. Using phrases like "the role we designed" instead of "the role leadership designed" shifts blame to the collective. Acknowledge the VPs' perspective by validating the intent behind the role—accountability and oversight—while pointing out its practical limitations.

  Structure the toast: start with warmth and gratitude, transition into Elena's skills, then gently reveal the role's reality, and end on a positive note. Use phrases like "honest truth" and "real gift" to maintain sincerity. Ensure the tone remains appreciative, not confrontational.

  Potential pitfalls: The VPs might feel called out. Mitigate this by focusing on systemic issues rather than individual blame. Teammates will appreciate the honesty, so validating their shared experience is important. Include specific, genuine compliments about Elena to keep the toast personal and heartfelt.

