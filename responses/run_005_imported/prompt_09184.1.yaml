answer: |-
  Here’s a rigorous defense of Scanlon’s framework against your objection, grounded solely in his expectation-based principles and engaging the core challenge:

  ### Step 1: Reconstructing Scanlon’s Core Argument  
  Scanlon’s Principle F (from *What We Owe to Each Other*) states:  
  *If (1) A voluntarily leads B to expect that A will do X (unless B consents to A not doing so); (2) A knows B wants this assurance; and (3) A acts with the aim of providing this assurance, then A must do X unless B consents to X not being done.*  

  Wrongfulness arises not merely from *disappointing* B, but from **violating the normative relationship created by the assurance**. When you break a promise, you exploit B’s reliance on your integrity, undermining the social practice of promise-keeping that benefits all.  

  ### Step 2: Addressing the "Deceased Promisee" Objection  
  **Your challenge**: If your grandmother no longer exists, how can her expectations be "defeated"? And if no defeat occurs, how can breaking the promise be wrong?  

  #### Scanlonian Response (Without Importing External Theories):  
  1. **The Expectation’s *Causal and Normative Legacy***:  
     - When your grandmother formed the expectation based on your promise, it altered her practical reasoning. She likely died believing her garden would survive, deriving peace from that expectation.  
     - Scanlon’s theory isn’t solely about *current* psychological states. It’s about whether you **retroactively invalidate the reasonableness of her reliance** while she lived. Breaking the promise now would make her *past* reliance (a real, voluntary act you induced) **unreasonable in hindsight**. You’d have made her trust *misplaced*—a moral injury to the relationship she reasonably invested in.  

  2. **The *Ongoing* Relational Harm**:  
     - Promises create a **persistent normative position**. By accepting her trust, you took on a role as steward of her expectation. Abandoning the garden *now* doesn’t harm her *present interests* (she has none), but it **repudiates the value of her *past* trust** and your own commitment.  
     - Scanlon: Promises bind because they create relationships of "assurance and reliance." Your grandmother’s death ends her agency, but not the **relational fact** that you owe fidelity to the trust she *placed in you*. To break it is to disrespect the history of that relationship.  

  3. **The *Social Practice* Dimension (General Expectations)**:  
     - Principle F sustains a practice that benefits everyone. If promises died with promisees, people couldn’t rely on assurances about posthumous matters (e.g., "I’ll care for your children").  
     - You might argue: "But Scanlon focuses on *specific* expectations, not general practices!" However, **your promise to your grandmother shaped *her* specific expectation**, and upholding it maintains the *reliability of the practice for others*. If you break it, you weaken others’ trust in similar promises (e.g., "Will their grandchild neglect *my* dying wish?"). Thus, you defeat the **legitimate expectations of living persons** about how promises function.  

  4. **The *Voluntary Creation of a Binding Reason***:  
     - By promising, you voluntarily assumed an obligation that *intrinsically* extended beyond her death. The expectation you created wasn’t conditional on her survival but on *your continued agency*.  
     - Letting the roses die isn’t wrong because it "hurts" your grandmother; it’s wrong because you **negate the moral force of your own past voluntary act**. You invited her to rely on you *in perpetuity* for this task. Reneging now exploits the temporal vulnerability of her reliance.  

  ### Step 3: Countering the Strongest Rebuttal  
  **"But if she never knows, where is the *defeat* of expectation?"**  
  - The "defeat" isn’t experiential but **retroactive normative inconsistency**: At the moment she trusted you, her reliance was reasonable. Breaking the promise renders it *unreasonable after the fact*. You retroactively make her trust foolish, violating the duty to honor reasonable reliance you invited.  

  **"Why isn’t this just rule-worship (e.g., 'promises must be kept')?"**  
  - It’s not about rules. It’s about the **relational harm of invalidating trust**. Scanlon’s focus remains on the *expectation you engineered* and the social costs of betraying it. The "bindingness" flows from the concrete wrong of **exploiting vulnerability you created**, not abstract duty.  

  ### Conclusion: Why Your Promise Still Binds  
  On Scanlon’s view, breaking your promise would:  
  1. **Retroactively undermine the reasonableness of your grandmother’s reliance** while alive,  
  2. **Repudiate the relational trust she invested in you**,  
  3. **Damage the social practice of promising** for living persons who depend on posthumous assurances,  
  4. **Violate the normative position you voluntarily assumed**—one that persists beyond her death.  

  The wrongness lies not in disappointing a consciousness that no longer exists, but in **betraying the moral architecture built by her past trust and your ongoing role as its guarantor**. The expectation’s *legacy*—its enduring claim on your integrity—is what Scanlon’s framework captures, without appealing to virtues, rules, or supernatural duties. Your obligation survives because the *reason* it was wrong to break the promise while she lived (the defeat of invited trust) extends to its posthumous violation.
