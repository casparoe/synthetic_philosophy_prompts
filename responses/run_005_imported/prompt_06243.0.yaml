answer: |-
  ## The Sleeping Beauty Divide: Weighing Elga Against Lewis

  The Sleeping Beauty problem presents a deceptively simple scenario that fractures along profound questions of self-location, evidence, and the nature of probability. While Beauty begins with a clear prior (P(Heads) = P(Tails) = 1/2), the amnesia-inducing structure of the experiment creates uncertainty upon waking: *Where am I in the experiment's timeline?* Two compelling answers emerge, championed by Adam Elga (1/3) and David Lewis (1/2). Adjudicating requires dissecting their core arguments and confronting their consequences.

  **Elga's Case for 1/3: The Indistinguishability Argument**

  Elga's reasoning hinges on Beauty's complete inability to distinguish between the three possible waking moments upon being awakened:

  1.  **Heads-Monday (H-Mon)**
  2.  **Tails-Monday (T-Mon)**
  3.  **Tails-Tuesday (T-Tue)**

  From Beauty's subjective perspective upon waking, these three states are phenomenologically identical. Elga argues that this indistinguishability warrants applying a restricted principle of indifference: in the absence of any differentiating evidence, she should assign equal credence to being in each of these three possible "centered worlds."

  *   Therefore, P(H-Mon) = P(T-Mon) = P(T-Tue) = 1/3.
  *   The proposition "Heads" corresponds *only* to the H-Mon awakening.
  *   Hence, P(Heads | Waking) = P(H-Mon) = **1/3**.

  Elga's argument treats the awakening event itself as a context where self-locating uncertainty (which day? which branch?) is fundamental. The coin outcome isn't directly observed; it's inferred from her location within the experimental structure. The amnesia ensures that *this specific waking moment* could correspond equally well to any of the three scenarios where she finds herself awake.

  **Lewis's Case for 1/2: Conservation of the Prior**

  Lewis contends that Beauty learns nothing new *relevant to the coin toss* when she wakes up. Before the experiment begins on Sunday, she knows with certainty:

  1.  She *will* be woken on Monday regardless of the coin flip (P=1).
  2.  *If* the coin lands tails, she *will* be woken on Tuesday as well (P=1).

  Upon waking, she gains no information that contradicts this known schedule. She knew she would experience this very state of "being awake in the experiment with amnesia" at least once (on Monday), and possibly twice. Lewis argues that since the waking event was guaranteed to occur (in some form) and provides no specific evidence *discriminating* between Heads and Tails, her credence in Heads should remain unchanged from her prior: **1/2**.

  Lewis frames the problem as one of updating on *de se* (self-locating) evidence. He argues that while Beauty learns the *de se* proposition "I am awake now," this proposition was entailed by her prior knowledge (she knew she *would* be awake on Monday). Learning something you already knew with certainty provides no new information and shouldn't change your credences about *other* propositions (like the coin flip).

  **The Cost of Lewis's Position: The Monday Credence**

  Lewis's adherence to P(Heads) = 1/2 *upon waking* forces a specific consequence when Beauty learns additional information. Suppose Beauty is told, upon waking, "Today is Monday." What is her credence in Heads *now*?

  Lewis must assign probabilities consistently with his initial 1/2 credence for Heads and the known experimental structure. Let's define the relevant possibilities and their probabilities under Lewis's framework:

  *   P(Heads) = 1/2. This *only* includes the Monday awakening.
  *   P(Tails) = 1/2. This includes *both* the Monday *and* Tuesday awakenings.
  *   P(Monday) = P(Heads) + P(Tails and Monday). Since Tails guarantees a Monday awakening, P(Tails and Monday) = P(Tails) = 1/2.
      *   Therefore, **P(Monday) = P(Heads) + P(Tails) = 1/2 + 1/2 = 3/4**.
  *   P(Heads | Monday) = P(Heads and Monday) / P(Monday). Since Heads implies Monday, P(Heads and Monday) = P(Heads) = 1/2.
      *   Therefore, **P(Heads | Monday) = (1/2) / (3/4) = 2/3**.

  **This is the cost Lewis incurs.** To maintain P(Heads) = 1/2 upon a generic awakening, he must accept that *if Beauty learns it is Monday*, her credence in Heads jumps to 2/3. Many find this awkward: why should learning the mundane fact that it's Monday significantly *increase* Beauty's confidence in Heads above her prior? After all, under Heads, Monday was guaranteed, and under Tails, Monday was *also* guaranteed. While mathematically coherent within Lewis's framework, this consequence strikes many as counterintuitive and undesirable.

  **Weighing the Considerations: A Verdict for Thirding**

  Both arguments possess intellectual rigor, but Elga's position proves more compelling upon examination:

  1.  **The Primacy of the Centered Perspective:** Upon waking, Beauty isn't contemplating the experiment abstractly from a God's-eye view on Sunday. She is located *within* it, experiencing a specific, subjectively indistinguishable moment. Elga's approach directly addresses this *de se* uncertainty. Lewis's approach treats the waking as confirming a foregone conclusion (Monday awakening), potentially undervaluing the indexical nature of her evidence ("I am experiencing *this* waking now").
  2.  **The Cost of Halfing is Higher:** Lewis's 2/3 credence on Monday is genuinely awkward. It requires Beauty to significantly revise her credence upwards based on information (Monday) that was certain to occur under *both* hypotheses. While formally consistent, it feels like an unnatural adjustment forced by preserving the prior in the generic waking case. Elga's framework yields the more intuitive P(Heads | Monday) = 1/2: if it's Monday, Heads and Tails are equally likely because each implies one Monday awakening.
  3.  **Betting Intuitions and Frequencies:** Consider many repetitions. In 100 experiments, roughly 50 Heads (50 Monday awakenings) and 50 Tails (100 awakenings: 50 Mon, 50 Tue). Beauty is awakened 150 times. Only 50 of those awakenings occur when Heads is true. If Beauty bets on Heads each time she wakes, she wins 50 times and loses 100 times. A 1/3 credence reflects her betting odds. Lewis's 1/2 credence seems mismatched to this long-run outcome from *within* the awakenings.
  4.  **Robustness to Self-Location:** Elga's indifference principle between indistinguishable, mutually exclusive, and exhaustive centered possibilities is a powerful tool for handling self-locating uncertainty, applicable beyond this puzzle (e.g., your cosmological interests). Lewis's strict conservation of the prior struggles when the evidence gained is fundamentally indexical and the prior was assigned from a non-indexical perspective.

  **Verdict: Beauty's credence upon waking should be 1/3.**

  The qualification inherent in this verdict is that self-locating evidence ("I am experiencing awakening X now") *does* require updating that affects credences about non-indexical propositions (the coin flip), and that such updates are validly governed by principles like Elga's restricted indifference applied to the relevant centered possible worlds. Lewis's attempt to shield the prior from the impact of *de se* evidence leads to the more jarring consequence regarding the Monday awakening. The Sleeping Beauty problem highlights that in scenarios involving indexical uncertainty, the subject's perspective *within* the probability space is paramount, and credences must reflect the distribution over those centered experiences, not just the external causes. Elga's 1/3 credence best captures Beauty's rational epistemic state upon finding herself awake in the experiment.
