  First, I notice this is high-stakes dissertation work - their advisor thinks it's rhetorical flourish, but they suspect deeper significance. That tension means I need to be particularly rigorous. The three questions they pose are interconnected: the credit metaphor's probabilistic meaning, its relation to Hume's miracle argument, and the "investigator in the trick" closure. 

  Hmm... the De Morgan reference suggests Sidgwick is invoking probability theory. Victorian thinkers often used banking metaphors for epistemic credit. I recall De Morgan's work on compound testimony - each witness adds independent probability, so even weak testimonies can cumulatively strengthen a claim. That fits Sidgwick's "draft will help" despite no single witness being sufficient. 

  On the Hume question - tricky. Sidgwick's "burying alive" image does seem psychological, but his epistemology elsewhere shows he took low priors seriously. The key is his "if we are able to kill it at all" qualification - he's not rejecting Hume's structure but working within it, suggesting that if the prior isn't literally zero, overwhelming evidence could shift it. 

  The "investigator in the trick" point feels like a Bayesian exhaustion of hypotheses. Sidgwick implies that when all other objections fail, the only alternative is fraud - but he anticipates critics will still choose that. That's not a logical flaw; it's a shrewd observation about psychology. The weight comes from forcing critics into increasingly implausible positions. 

  Connecting the threads: Sidgwick proposes a three-stage evidentiary strategy - accumulate independent testimony to compound probability, target psychological resistance rather than absolute impossibility, and systematically eliminate alternatives until fraud remains the only counterargument. It's a coherent response to organized skepticism, blending epistemology and rhetoric. 

  The user's intuition seems correct - this isn't just flourish. The passage shows Sidgwick adapting probabilistic reasoning to defend marginal inquiry while acknowledging deep-seated skepticism. That's significant for their chapter on Victorian boundary-work in science.
answer: |-
  Your advisor's caution is understandable, but your close reading reveals a genuinely complex and significant passage where Sidgwick strategically navigates epistemology, probability, rhetoric, and the sociology of scientific resistance. The three elements you identify are deeply interconnected within Sidgwick's overall argumentative strategy. Here's a breakdown of the logical structure and connections:

  1.  **The De Morgan Metaphor ("Stock of Credit"/"Draft"): Independent Witnesses and Probability Accumulation**
      *   **Specific Probabilistic Meaning:** Sidgwick *is* invoking a specific probabilistic concept derived from thinkers like De Morgan and Laplace. The core idea is that multiple *independent* witnesses, even if individually only somewhat credible (possessing a "fair stock of credit"), can *jointly* significantly increase the probability of the reported event beyond what any single witness could achieve.
      *   **Mathematical Basis:** If the prior probability of an event is low but non-zero (P(H)), and each witness has a credibility (likelihood) less than 1 but greater than 0.5 (P(E|H) > P(E|~H)), then multiple independent testimonies (E1, E2, E3,... En) multiply the cumulative force of the evidence via Bayes' theorem. The "draft" metaphor captures this: each testimony draws on its own credit (likelihood ratio) to support the claim. While no single testimony ("draft") might cover the enormous "demand" (low prior probability), each adds incrementally to the total evidence *for* the claim.
      *   **Concession & Strategy:** Sidgwick's immediate concession ("not likely to suffice") acknowledges the *enormous* prior improbability assigned by mainstream science. The point isn't that one witness makes the case, but that each *independent* witness adds a necessary increment. The focus shifts to *quantity and independence* as the necessary strategy against a strong prior.

  2.  **"Burying it alive under a heap of facts" vs. Hume's Argument: Psychology vs. Epistemology?**
      *   **Strategic Shift:** Sidgwick is making a crucial *strategic* move here. He explicitly frames the target: "the common sense of mankind" and "scientific incredulity." His goal isn't (in this passage) a *purely formal* logical refutation of Hume's abstract epistemological point that a sufficiently low prior probability can never be overcome by *any* amount of testimony (if the prior is *literally* zero or deemed impossible).
      *   **Implicit Rejection of Zero Priors:** However, Sidgwick *implicitly* rejects the *practical application* of Hume's argument by mainstream science. He argues that scientific incredulity towards psychical phenomena isn't based on a *demonstrated* impossibility (P=0), but on a deeply ingrained *presumption* of impossibility ("so long in growing... many and strong roots") stemming from the success of materialistic science. He treats the prior as *very low*, but *not* zero.
      *   **The "Heap" as Overcoming Resistance:** Because the prior is treated as low but non-zero, Sidgwick argues that an overwhelming *mass* of independently attested *facts* (well-documented observations, experiments) *can* and *must* overcome the psychological and sociological resistance ("burying alive"). This "heap" serves two functions:
          *   **Probabilistic:** It systematically increases the posterior probability via accumulation (as per the De Morgan point).
          *   **Psychological/Sociological:** It overwhelms the *rhetorical* and *habitual* resistance ("incredulity") by sheer volume and diversity, forcing attention and making dismissal seem increasingly *unreasonable* or *stubborn* rather than scientifically justified. It targets the *will to disbelieve*.

  3.  **The "Investigator in the Trick" Closure: Exhaustion of Alternatives**
      *   **Argumentative Weight & Legitimacy:** This is the culmination of Sidgwick's strategy and carries significant weight. He argues that the SPR's methodological rigor aims to systematically eliminate *all other* plausible explanations for a reported phenomenon *except* the phenomenon itself *or* fraud by the investigator.
      *   **Logical Structure:** It's an argument by **exhaustion of competing hypotheses**. If the investigation is meticulously designed and documented to rule out:
          *   Coincidence
          *   Sensory error/misperception
          *   Unconscious bias/expectancy effects
          *   Deliberate fraud by the *subject* (medium, etc.)
          *   Environmental artifacts
          *   Faulty instrumentation/procedure
          *   *Then* the only remaining alternative explanation is deliberate fraud by the *investigator*.
      *   **Legitimacy:** This *is* a legitimate logical move *if* the list of alternative hypotheses *is* exhaustive and the investigation *has* successfully ruled them out. Sidgwick acknowledges the inherent limitation ("the trustworthiness of the investigator" is the ceiling). His point isn't that this *proves* the phenomenon, but that it represents the *strongest possible case* testimonial/experimental evidence can make. At this point, disbelief *must* take the form of accusing the investigator of fraud ("he will allege that").
      *   **Rhetorical Force:** This move shifts the burden dramatically. It forces the critic into a position of making a specific, serious, and potentially libelous accusation against a presumably reputable investigator (like Sidgwick himself or his SPR colleagues) rather than offering a general critique of methodology or prior probability. It makes disbelief look *ad hominem* and desperate.

  **Connecting the Three Pieces: Sidgwick's Coherent Strategy**

  1.  **Foundation (De Morgan):** Acknowledge the low prior and the need for *accumulation* of independent evidence to incrementally increase probability. (Addresses the *formal* challenge of evidence strength).
  2.  **Scale & Target (Heap of Facts):** Propose a massive, relentless program of evidence gathering ("pegging away") designed to overwhelm the *psychological* and *sociological* resistance ("scientific incredulity") rooted in materialistic paradigms. This accumulation aims to make the sheer weight of evidence undeniable *in practice*, shifting "common sense." (Addresses the *pragmatic/sociological* challenge of acceptance).
  3.  **Methodological Culmination (Exhaustion of Alternatives):** Define the evidentiary gold standard: investigations so rigorous that the *only* remaining counter-argument is an accusation of fraud against the investigator. This exposes the ultimate basis of persistent disbelief as *personal distrust* rather than *scientific* objection. (Addresses the *methodological* challenge and forces the critic's hand).

  **Conclusion: Building Your Argument**

  You are **not** over-reading. This passage is a masterful encapsulation of Sidgwick's strategic approach to legitimizing psychical research against entrenched opposition:

  *   He **implicitly challenges** the *application* of Hume's argument by treating the prior as low but surmountable by a "heap," rejecting its use as an *a priori* dismissal.
  *   He **adopts and adapts** probabilistic reasoning (De Morgan) to justify the strategy of massive accumulation of independent testimonies and experiments.
  *   He **combines epistemology with sociology**, recognizing that changing belief requires addressing both the formal probability *and* the psychological/social roots of resistance.
  *   He **defines the methodological endgame** as systematically eliminating all explanations except the phenomenon or investigator fraud, thereby cornering critics.

  This passage is *precisely* where Sidgwick outlines how the SPR intended to navigate the tension between rigorous empirical investigation and phenomena dismissed by mainstream science. It shows him trying to carve out a space for evidentiary legitimacy *despite* the low prior, using accumulation, methodological rigor, and a keen understanding of the sociology of scientific resistance. Building your argument around this passage is highly justified. It reveals Sidgwick's sophisticated (if ultimately unsuccessful) blueprint for challenging scientific orthodoxy on evidentiary grounds.
