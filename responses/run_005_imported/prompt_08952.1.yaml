  **Justifications:**  
  - **Move 1 (Dominic: +1)**  
    Correctly identifies the core problem of long-term unpredictability ("cascading indefinitely") undermining expected-value calculations. While overstated ("close to meaningless"), the directional concern is valid.  

  - **Move 2 (Marlene: +2)**  
    Masterfully exposes the paralysis paradox: if cluelessness invalidates donating, it equally invalidates *all* choices. Forces Dominic to refine his position.  

  - **Move 3 (Dominic: 0)**  
    Distinguishing random vs. directional uncertainty is insightful, but wrongly claims this "saves" his argument. Fails to address symmetry – withholding money *also* has directional effects (e.g., spent on carbon-intensive goods).  

  - **Move 4 (Marlene: +2)**  
    Correctly applies Dominic’s distinction against him: *both* options have systematic directional uncertainties. Concludes we lack grounds to rank them – a strong rebuttal to Dominic’s original anti-donation stance.  

  - **Move 5 (Dominic: -1)**  
    Shifts goalposts: now attacking consequentialism’s *practicality* rather than defending "withholding is better." Ignores that consequentialism has tools (e.g., decision procedures) for precisely this uncertainty. Overclaims "no usable expected value."  

  - **Move 6 (Marlene: +2)**  
    Correctly identifies Dominic’s challenge as a *general* problem for any action-guiding theory (not unique to consequentialism). Highlights the criterion/procedure distinction – consequentialism’s established response to epistemic limits.  

  **Closing Note:**  
  A critical omission is **comparative near-term evidence**. While long-term cluelessness is real, consequentialists can prioritize robust near-term welfare gains (e.g., girls' education empirically improves health/agency) *unless* there’s specific evidence of countervailing long-term risks. Dominic overweights abstract uncertainty while undervaluing measurable short-run impacts. Marlene’s symmetry argument holds, but doesn’t engage how we might prioritize empirically tractable effects over untestable speculation.
