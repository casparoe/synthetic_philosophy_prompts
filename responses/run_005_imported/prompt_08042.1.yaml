prompt: |-
  Okay so this is going to sound kind of random but here's the context. In my IB Theory of Knowledge class we only spent like one period on skepticism/certainty, and my teacher had us skim part of Wittgenstein's On Certainty as extra reading (it's written in these weird numbered remarks, honestly reads like someone's diary lol). This all started because my friend Jake wouldn't shut up about how we could technically be brains in a vat / living in the Matrix and there's no way to prove otherwise, and my teacher brought up Wittgenstein's idea of "hinge propositions" -- stuff like "I have two hands" or "the earth existed before I was born" -- as basically his answer to that. But from the reading, Wittgenstein doesn't say we KNOW those hinge things, he says something weirder, like they're not even the kind of thing that can be known or doubted, they're just what has to stay fixed for questions about knowing/doubting to make sense at all (I guess that's the "hinge" thing, like the door swings but the hinge itself doesn't).

  What I can't figure out, and what we didn't have time to get into, is whether this is actually a real answer to the skeptic or just a fancy way of dodging the question. Like if I literally cannot know I'm not being deceived about having hands, who cares if Wittgenstein says the question is somehow "out of bounds," Jake still wins the argument right? I looked it up a bit after class and apparently real philosphers fight about this exact thing: some people (I keep seeing Crispin Wright's name) treat hinges as stuff we're allowed to just accept with no evidence, which sounds like sneaky foundationalism to me, other people (I think Duncan Pritchard?) seem to basically agree that we have zero rational grounds for hinges and think that's totally fine, not a problem, and then theres apparently a THIRD group who say hinges aren't beliefs at all, more like instincts, so asking "do we know them" was confused from the start. Could you actually break down these different readings for me and explain which ones (if any) genuinely beat radical skepticism versus which secretly just relabel it? I don't need every paper ever written on this, just enough to actually get it on a gut level and settle the argument with Jake.
