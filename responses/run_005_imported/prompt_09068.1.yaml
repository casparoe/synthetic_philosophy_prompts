  I’ll avoid naming Kierkegaard or Denmark. The themes should resonate through the plot mechanics. Arthur’s job loss and social exile show concrete consequences, while the unresolved ending underscores the difficulty of escaping the abstraction. Bonus points for the heckler scene—it shows the public’s ghostly nature and Arthur’s fumbled chance at genuine connection.
