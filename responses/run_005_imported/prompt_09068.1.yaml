  For the leveling, I’ll show the lack of real conviction. The attackers are fragmented—some sincere, most performative. No one claims responsibility; it’s a wave of noise. The platform’s algorithm accelerates the spread, and the pile-on fades when novelty wears off, leaving Arthur isolated. 

