  ## The Leveling

  Arthur Vance was a man who existed in the quiet hum of obscurity. He wrote thoughtful, meticulously researched blog posts about urban infrastructure – the poetry of sewer systems, the sociology of traffic flow patterns. He had 742 dedicated followers, mostly fellow planners and a few academics who appreciated his niche obsessions. His most commented-on post in the last year had garnered seven responses. Arthur despised his own obscurity, a slow-burning resentment that curdled into something sharper each time he witnessed the online frenzy around something trivial – a celebrity’s haircut, a poorly phrased tweet, a cat video.

  One rain-slicked Tuesday, after reading yet another viral pile-on targeting a mid-tier novelist for a clumsy metaphor, Arthur snapped. His fingers flew over the keyboard, abandoning his half-finished analysis of bicycle lane efficacy in favour of pure, undiluted venom. The title practically screamed: **"Feeding the Ghost: How the Faceless Rabble Masquerades as Public Opinion."**

  He didn’t hold back. He dissected the mechanics of the online swarm: the anonymity that bred cowardice, the performative outrage divorced from genuine conviction, the way platforms algorithmically amplified the loudest, angriest voices into a synthetic hurricane. "This 'public' you invoke?" he typed, his knuckles white. "It doesn't exist. It's a phantom, conjured by the very machinery you use to scream into the void. You’re not citizens; you’re the fuel for a monstrous abstraction. You level anything that momentarily rises above the flatline of your collective boredom, not because it matters, but because tearing down is easier than building up. You’re a pack of dogs, unleashed by your own emptiness."

  He paused, cursor blinking. A reckless impulse seized him. Kierkegaard’s ghost nudged his elbow. *Dare them*, the ghost whispered. *Show them their own reflection.*

  Arthur added the fatal paragraph: "And you know the saddest joke? You wouldn't dare come for *me*. Too obscure. Too insignificant. You only hunt where the algorithmic spotlight shines, where the pack can gather easily. You crave the validation of the mob, but you fear the silence of an actual, individual conscience. Prove me wrong. I dare you. Unleash your phantom dogs. See if they can even find me in the shadows."

  He hit publish. A tremor of defiance, quickly followed by a cold trickle of fear, ran down his spine.

  The silence lasted precisely twenty-seven hours. Then, like a dam bursting, it came.

  It started predictably: screenshots of his "elitist," "out-of-touch" rant circulating on platforms he rarely visited. Outrage influencers, always hungry for fresh meat, seized upon it. "Who does this infrastructure nerd think he is?" "Calling US rabid dogs?!" "Let’s educate this pompous planner." His follower count began to climb, not with fellow infrastructure enthusiasts, but with avatars bearing flaming torches and pitchforks in digital form.

  Then came the memes. Someone found an old, slightly unflattering photo from a city council meeting where Arthur, mid-yawn, looked particularly owlish. It was photoshopped onto a dog’s body, straining at a leash held by a shadowy figure labelled "The Algorithm." His blog banner – a serene shot of a well-designed pedestrian plaza – was defaced with crude graffiti tags reading "ELITIST SEWER RAT" and "LEVEL ME THIS, NERD."

  The "leveling," as Kierkegaard might have put it, had begun. It wasn’t about his ideas on infrastructure, or even his critique of online culture. It was about *him*. Reducing Arthur Vance to a caricature, a symbol ripe for collective contempt.

  The digital bled into the real. His commute became an ordeal. Whispers followed him on the subway. Once, a group of teenagers, phones out, snickered as he passed. "Hey, Sewer Rat! Level this!" one shouted, miming throwing something. Laughter echoed. His face burned.

  His local coffee shop, where he’d written most of his obscure posts, became hostile territory. The usually friendly barista avoided eye contact. Regulars he’d nodded to for years suddenly found their phones fascinating as he approached. He overheard a snippet: "...that guy who hates everyone online? Yeah, apparently he comes here..." He stopped going.

  The cruelest cut came from his tailor. Arthur favoured well-cut, slightly old-fashioned trousers. He went for his biannual visit to Mr. Henderson, a meticulous man who’d measured Arthur’s inseam for a decade. Mr. Henderson looked profoundly uncomfortable. "Mr. Vance," he stammered, polishing his glasses furiously. "I... I appreciate your patronage, truly. But... well, there’s been talk. Online. Some rather unkind... representations. Mocking the... the cut of your trousers, specifically. Associating my shop with... well, with that unpleasantness. It’s... bad for business. Perhaps... perhaps it would be best if you sought your alterations elsewhere?"

  Arthur stood frozen, the familiar scent of wool and sizing suddenly cloying. He wasn't being attacked for his ideas; he was being erased for the *image* the phantom public had created. His trousers – perfectly fine trousers! – had become a weapon against him, wielded by a ghost. He left without a word, the bell on the door jingling with finality.

  He retreated. He stopped blogging. He deleted his social apps. He walked only at night, head down, avoiding eye contact. The online frenzy, true to Kierkegaard’s observation, peaked and then began to dissipate. The dogs, having torn their fill, grew bored. New scandals emerged. A politician’s gaffe, a singer’s feud. Arthur Vance, the "Sewer Rat," was old news. The phantom public moved on, leaving only wreckage and silence.

  But the silence wasn’t peaceful; it was hollow. Arthur felt flayed, exposed. He sat in his small apartment, the glow of his unused laptop a cold accusation. Kierkegaard’s concept of "the single individual" haunted him. The only real entity, the only point from which meaning could spring, was the individual confronting their own existence, free from the suffocating abstraction of "the public."

  One damp afternoon, weeks after the storm had passed, Arthur ventured out for groceries. As he queued, a young man in a tech company hoodie glanced at him, did a double-take, and nudged his friend. Arthur braced himself. The friend smirked. "Hey," he called, not unkindly, but with the casual cruelty of recognition. "Aren't you that guy? The one who got owned by the entire internet?"

  It wasn't a physical threat, but it was the ghost reaching out one last, cold finger. Arthur felt the old rage surge, the desire to shout, to explain, to *make them see* the absurdity, the manufactured nature of it all. To force them to acknowledge *him*, Arthur Vance, not the meme.

  He opened his mouth, ready to unleash a torrent of Kierkegaardian insight mixed with raw, personal anguish. He would make them understand the phantom! He would force them into individuality!

  But he saw it in their eyes – not malice, exactly, but a vacant curiosity, the look of tourists observing a minor local oddity. They weren't *people* he could reason with; they were momentary conduits for the lingering echo of the phantom. Engaging them *was* feeding the ghost.

  The words died in his throat. He closed his mouth. He looked not at them, but through them, towards the misted window of the supermarket. The rain streaked the glass, blurring the world outside into indistinct shapes.

  He said nothing. He paid for his meagre groceries – bread, milk, a single sad apple – and walked out, head held not high in defiance, but simply upright. The rain soaked his shoulders, the same shoulders caricatured online as hunched and deformed. He didn't hurry.

  Back in his apartment, he placed the groceries on the counter. The silence pressed in, thick and heavy. He walked to the window, watching the rain distort the city lights into smears of colour. The phantom public had moved on, leaving him stranded on this lonely shore. He understood, with a crushing clarity, that the "way out" Kierkegaard proposed wasn't about winning an argument or silencing the crowd. It was an internal migration, a terrifyingly solitary journey towards owning one's existence completely, divorced from the reflection in the monstrous mirror of the crowd. He had fumbled the dare, spectacularly. He had invited the leveling and been flattened.

  Now, the hard part began: learning to stand up, not against the phantom, but simply *as himself*, in the echoing quiet it left behind. He placed a hand on the cold glass. The city lights, blurred and beautiful, offered no answers, only existence. He stood there, the single individual, drenched in the aftermath, wondering how to breathe in a world that had proven, definitively, that the crowd was only ever smoke. The open window beckoned, not for escape, but for a different kind of air. He didn't open it. Not yet.
