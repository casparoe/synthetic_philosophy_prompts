answer: |-
  Here's the strongest possible case that the dogmatism paradox survives the move to sub-unity credence, rendering "just don't assign probability 1" a superficial fix:

  ### The Core Argument: Functional Equivalence Under High Credence
  1.  **The Discounting Mechanism is Identical:** The paradox hinges on the agent's ability to *explain away* disconfirming evidence *as it arises*. At P(h) = 0.995, the agent *already* assigns a prior probability P(misleading | ~h) = 1 (trivially, since if ~h is true, evidence against h *is* genuine). Crucially, they also assign a high prior probability P(misleading | h) ≈ 0.995 *by necessity*. This high P(misleading | h) *is* the pre-commitment to discounting specific disconfirming evidence *before seeing it*. The Bayesian structure *formally encodes* the dogmatist's stance: "If I see strong evidence against h, it's overwhelmingly likely to be misleading noise/fraud/error *because h is true*."

  2.  **Conservation of Expected Evidence is Irrelevant to Local Dogmatism:** While CEE ensures that *on average*, the agent's belief movement must be balanced, it says *nothing* about how belief updates are distributed across *specific* evidence streams. An agent with P(h) = 0.995 can satisfy CEE by:
      *   Assigning near-zero probability (e.g., 0.005) to seeing *extremely* strong, unambiguous, paradigm-shattering disconfirming evidence (E_strong) that *would* force a significant downgrade (say to P(h|E_strong) = 0.01).
      *   Assigning high probability (e.g., 0.995) to seeing ambiguous, noisy, or weak evidence (E_weak) that they *can easily explain away* as misleading, resulting in negligible belief change (P(h|E_weak) ≈ 0.995).
      **Result:** The *expected* update is correct (ΔP ≈ 0), but the agent has functionally pre-committed to dismissing *any evidence they actually encounter* as belonging to the E_weak/"misleading" category they can ignore. The belief update rule for the evidence they *expect to see* is: "Discount it heavily; it's probably noise." This *is* dogmatism in action. Cromwell's Rule doesn't prevent this allocation; it *enables* it by making P(misleading | h) high but <1.

  3.  **The Update is Theoretically Correct but Practically Negligible:** Suppose the agent observes disconfirming evidence E. Bayes' Theorem dictates:
      `P(h|E) = P(E|h) * P(h) / [P(E|h)*P(h) + P(E|~h)*P(~h)]`
      With P(h) = 0.995 and P(~h) = 0.005:
      *   If the agent judges P(E|h) (probability of misleading evidence) as high (say 0.99) and P(E|~h) (probability of genuine evidence if h is false) as low (say 0.01), then:
          `P(h|E) ≈ (0.99 * 0.995) / [(0.99 * 0.995) + (0.01 * 0.005)] ≈ (0.985) / [0.985 + 0.00005] ≈ 0.99995`
      **Result:** The agent technically updates... *towards even greater certainty in h!* The disconfirming evidence is not just dismissed; it's interpreted as *further confirmation* because it was so "unlikely" to be seen unless h were true *and* it was misleading. The Bayesian machinery, fed by the agent's prior model which includes the high P(misleading | h), produces *increased* dogmatism upon encountering counter-evidence. This perfectly mirrors the crank's response: "This evidence against my theory is so bad, it *proves* how desperately wrong my opponents are!"

  4.  **The Distinction (0.995 vs 1.0) Doesn't Constrain Behavior:** What practical difference does P(h)=0.995 vs P(h)=1.0 make in how the agent treats *specific* counter-evidence?
      *   **Prior to Evidence:** Both agents believe h is almost certainly true and believe counter-evidence is almost certainly misleading if seen. Both pre-commit to discounting it.
      *   **Upon Receiving Evidence:** Both agents conclude the specific evidence E is very likely misleading. The Bayesian at 0.995 *might* move to 0.99995 or 0.99, while the Certain agent stays at 1.0. But functionally, both:
          *   Reject E as probative against h.
          *   Attribute E to error/noise/fraud.
          *   Continue acting *as if* h is unquestionably true.
          *   Require *overwhelmingly* improbable evidence (under their model) to significantly shift beliefs.
      The Bayesian's *technical* non-absolute certainty doesn't generate meaningful epistemic caution or openness in the face of *expected* counter-evidence. The behavioral and interpretive stance is identical to the dogmatist.

  5.  **It Matches Real-World Dogmatism Perfectly:** Cranks and confident experts *don't* literally hold P(h)=1.0. They hold P(h) high enough that:
      *   The space of evidence they consider *genuinely* disconfirming (i.e., not explicable as error within their model) is vanishingly small *by their own prior assessment*.
      *   Any *actual* counter-evidence encountered *falls* into the pre-defined "likely error" category.
      *   Their belief update is negligible or even confirmatory. "Just don't assign 1.0" fails to diagnose or prevent this. The Bayesian formalization *rationalizes* it.

  **Conclusion:** The Kripke/Harman paradox isn't fundamentally about probability 1. It's about the **self-sealing nature of belief systems** where the truth of the proposition *entails* that counter-evidence must be misleading, and crucially, the agent *assigns high prior probability to encountering misleading evidence if their belief is true*. Moving to sub-unity credence doesn't break this seal; it merely adjusts the dial on *how* misleading the evidence is expected to be. The Bayesian agent with very high credence *is licensed by their own probability assignments* to systematically discount counter-evidence as it arises, satisfying CEE globally while being locally dogmatic about every *specific* piece of evidence they encounter. "Cromwell's Rule" is insufficient because the paradox operates through the *interaction* of a strong prior (P(h) ≈ 1) and a correspondingly strong prior model of evidence under h (P(misleading | h) ≈ 1). This combination ensures belief revision in the face of plausible counter-evidence is functionally impossible, recreating the dogmatist's immunity. The distinction between 1.0 and 0.995 is mathematically real but *epistemically inert* in preventing the core dysfunctional dynamic. The paradox survives, dressed in Bayesian robes.
