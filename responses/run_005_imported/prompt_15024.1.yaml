  ---

  This memo:  
  ✅ **Engages the core tension** by reframing "normal health" in sport-specific terms.  
  ✅ **Provides enforceable safeguards** against performance enhancement.  
  ✅ **Legitimizes both viewpoints** while rejecting absolutism.  
  ✅ **Aligns with WADA** via proactive monitoring beyond mere diagnosis.
