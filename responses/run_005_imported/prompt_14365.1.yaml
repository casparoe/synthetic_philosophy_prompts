  so in my philosophy of language seminar we just read Russell's 'On Denoting' and i think i spotted an actual hole in his theory that our prof didn't address in lecture. since there's no king of France, 'the present king of France is bald' comes out false on Russell's analysis, because nothing satisfies the description. but by that same logic shouldnt 'the present king of France is NOT bald' also come out false, since again nothing satisfies it? that seems like a straight-up violation of the law of excluded middle - one of those two sentences has to be true. is this a real unresolved problem with the theory, or is there something i'm not getting?
