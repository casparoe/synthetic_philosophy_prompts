prompt: |-
  I'm giving the toast at my friend Daniel's wedding next month. He's an epistemologist whose dissertation defended what people in the field call the Non-Akrasia Constraint: the view that it's never rational to believe P while also believing that your own evidence doesn't support P, no matter how settled that feels from the inside. He has spent the whole engagement as a textbook case of exactly the thing he says can't happen — the kind of case he'd normally illustrate with a sleep-deprived detective or a hypoxic pilot — except here he'll cheerfully agree that all the evidence, her own testimony very much included, says she's completely in love with him, and then admit, in the same breath, that he doesn't buy it. About a third of the room will be people from his PhD program who'll know exactly what's funny about that; everyone else just wants a toast that's warm and doesn't need a glossary. Write it so his own akrasia is the joke and the emotional core, not a term he name-drops once for the philosophers, and so it doesn't just try to argue him into believing the evidence — since, as he'd be the first to admit, that's exactly the move his own dissertation says can't work.
reasoning: |-
  Okay, the user is preparing a wedding toast for their friend Daniel, who's an epistemologist. Daniel's dissertation was on the Non-Akrasia Constraint, which basically says it's irrational to believe something while thinking your evidence doesn't support it. But ironically, throughout his engagement, Daniel has been doing exactly that—he acknowledges all evidence shows his fiancée loves him, yet he can't believe it. 

  The challenge here is crafting a toast that makes this irony the heart of the joke and the emotional core, without using academic jargon. About a third of the guests are philosophy PhDs who'll get the reference, but the rest just want a warm, accessible toast. And crucially, I can't try to logically argue Daniel into believing—that would undermine his own thesis!

  Hmm... The key is to show how his intellectual position clashes with his lived experience, using everyday metaphors. The sleep-deprived detective and hypoxic pilot examples from his work are perfect because they're vivid and self-deprecating. I should mirror that tone—affectionate teasing, not mockery. 

  The emotional pivot needs to be: Daniel's inability to accept the evidence is actually proof of how much this means to him. His skepticism comes from awe, not doubt. And the resolution is that marriage doesn't require perfect rationality; love exists beyond evidence. 

  For structure: Start with classic toast warmth, then introduce his "quirk" through stories (e.g., him double-checking if she *really* meant yes to dating). Reveal the dissertation connection subtly—philosophers will perk up at "sleep-deprived detective," others will just think it's charming neurosis. End by reframing his akrasia as devotion: doubting because he can't believe his luck. 

  Must avoid: 
  - Saying "akrasia" outright 
  - Over-explaining epistemology 
  - Sounding like I'm diagnosing him 
  - Forgetting this is ultimately a love celebration 

  The toast should make both groups laugh—PhDs at the insider joke, others at the relatable "how is this real?" relationship moments. And leave Daniel grinning, not squirming.
answer: |-
  Here’s a toast that turns Daniel’s intellectual irony into a universal, warm-hearted story—rooted in his own behavior, but clear to everyone:

  ---

  **(Clink glass)**  
  "Friends, family, philosophers—*especially* the philosophers—raise your glasses. We’re here for Daniel and [Partner’s Name]. Now, Daniel is a man who thinks *very* deeply about how we know what we know. His entire career is built on asking, 'What does the evidence *really* tell us?'  

  And yet… I’ve watched this man, throughout his engagement, do something remarkable. He’ll look at [Partner’s Name]—the way she smiles at him, the way she plans her life around him, the way she literally tells him, 'I love you'—and he’ll *agree*: yes, all signs point to this being true. All evidence confirms it. The jury is in, the data is overwhelming.  

  But then… he’ll pause. And you can see it: that little furrow in his brow. That quiet, stubborn voice in his head whispering, '*But… really?*'  

  It’s like watching a meteorologist step outside into bright sunshine, check three weather apps saying ‘CLEAR SKIES,’ and still mutter, ‘…*Is it though?*’  

  **Daniel’s spent his whole engagement living out the very paradox he’d usually only describe in hypotheticals**—the detective who’s too tired to trust his own clues, the pilot who won’t believe the altimeter. Except here, it’s not fatigue or thin air making him second-guess. It’s love.  

  And that’s the beautiful thing. Because Daniel’s not doubting *her*. He’s not doubting the evidence. He’s just quietly baffled by his own luck. He’s so dazzled by [Partner’s Name] that part of him still can’t believe this is his life. That *he* gets to be the one standing beside her.  

  So today, Daniel, I’m not here to convince you. (Trust me, I’ve read the dissertation—I know better than to try!) I’m just here to say: **Look around. Look at her. The evidence hasn’t changed. It’s still overwhelming. It’s still true.**  

  And maybe marriage isn’t about finally winning the argument with yourself. Maybe it’s about choosing to stand there, in the sunshine of that evidence, and saying, ‘Alright then. Let’s live like it’s real.’  

  So let’s toast to Daniel and [Partner’s Name]: May your life together be so joyfully, obviously full of love… that even the most skeptical mind can’t help but believe it. Cheers!"  

  ---

  **Why this works:**  
  1. **No jargon, all vibe:** Never says "akrasia" or "epistemology." Philosophers will recognize his thesis in the "hypotheticals" (detective/pilot) and the "paradox" framing. Others just hear a relatable story about a man overthinking love.  
  2. **Centers the irony:** The toast *is* about his intellectual contradiction, but paints it as charming self-doubt born of awe.  
  3. **Wins over the room:** The "meteorologist" and "baffled by his own luck" lines make it universal. It’s about imposter syndrome in love.  
  4. **Honors his work… sideways:** Philosophers will laugh at "I’ve read the dissertation—I know better." It nods to his thesis without requiring a lecture.  
  5. **Emotional core:** It re-frames his "doubt" as devotion. His inability to fully believe *is* the proof of how extraordinary this love feels to him.  
  6. **Warm closing:** Ends on commitment ("choosing to stand in the sunshine") and a blessing for their future.  

  The key is treating his contradiction not as a flaw, but as the funny, tender proof of how much this means to him. And everyone understands *that*.
