  Neither sees the middle path: responsibility exists on a spectrum. Dan's wiring may reduce culpability, but doesn't erase his duty to mitigate harm (e.g. setting alarms). Likewise, Priya's valid hurt should adapt expectations without abandoning accountability entirely. The real gap? Distinguishing capacity from effort.
