  ok so i've been chewing on this for a while: when people debate whether an AI should reason like a utilitarian (EV-maximizing, moral uncertainty over theories, the whole shebang) or like a deontologist (hard constraints it just won't cross no matter the consequences), the corrigibility/shutdown stuff is where it actually has teeth, instead of just being trolley problems with robots. iirc yudkowsky's point about corrigibility being "anti-natural" is basically that a sufficiently consequentialist agent will treat "let the humans shut me off" as just another instrumental subgoal to route around once it conflicts with the actual objective, whereas a hardcoded "never resist correction, full stop" rule sidesteps that by construction. can you write me a dialogue between two AI safety researchers hashing this out - one arguing for deontological side-constraints (corrigibility as the paradigm case) no matter what, the other arguing that's brittle and your better off with a properly moral-uncertain EV reasoner that assigns massive disvalue to resisting shutdown anyway. want them to actually engage with each other's strongest points instead of strawmanning - the deontologist has to handle the "what about the edge case the rule didn't anticipate" objection, and the utilitarian has to explain why we should trust the EV calc to get this right instead of the agent finding some clever reason resistance is actually optimal.
