  ## The Moral Equality of Combatants: A Collapse in Theory, a Necessity in Practice

  The doctrine of the "moral equality of combatants" (MEC) stands as a cornerstone of traditional Just War Theory, most famously articulated by Michael Walzer in *Just and Unjust Wars*. Its central claim is stark and counterintuitive: **a combatant fighting for an unjust cause (failing *jus ad bellum*) is not inherently committing a greater moral wrong by merely fighting than a combatant fighting for a just cause, provided both adhere to the rules of warfare (*jus in bello*).** This separation of *jus ad bellum* and *jus in bello* ensures that soldiers on both sides possess symmetrical rights and liabilities in combat – they are legitimate targets for each other, and killing enemy combatants within the rules does not constitute murder. Walzer's rationale hinges on two key ideas: the "war convention" (a shared set of rules combatants mutually recognize) and the concept of soldiers as "mutual threats" existing within the unique coercive context of war, largely stripped of their individual political agency.

  **The Revisionist Assault: McMahan, Rodin, and the Liability Thesis**

  Jeff McMahan, alongside philosophers like David Rodin, launched a fundamental challenge to MEC, often termed "revisionist" Just War Theory. Their core argument dismantles Walzer's separation axiom:

  1.  **The Self-Defense Analogy:** McMahan argues that war is fundamentally governed by the same moral principles governing individual self-defense. An unjust combatant (fighting an aggressive war) is analogous to an *unjust aggressor* in a street fight. The aggressor has no right to kill the defender who acts in self-defense. Conversely, the defender *does* have the right to use necessary force against the aggressor to protect themselves or others.
  2.  **Liability vs. Justification vs. Excuse (Clarifying the Terms):**
      *   **Liability:** Being *liable* to defensive harm means you have lost your normal right against being harmed *because* your own actions have made you a direct threat to others' fundamental rights without justification. The unjust aggressor is liable to be killed to stop their unjust threat.
      *   **Justification:** An act is *justified* if it is morally permissible, or even obligatory, because it prevents a greater wrong. The defender's killing of the aggressor is justified.
      *   **Excuse:** An act is *excused* if it is morally wrong *but* the agent is not fully blameworthy due to mitigating circumstances (e.g., ignorance, duress, insanity). An aggressor *might* be excused for attacking (e.g., if coerced), but the act itself remains unjustified, and crucially, **their liability to defensive harm remains.** Excuse reduces *blame*, not *liability*.
  3.  **The Asymmetry Thesis:** Applying this framework, McMahan contends:
      *   **Unjust Combatants:** By participating in an unjust war of aggression, they become *unjust threats*. They are therefore **morally liable** to defensive harm inflicted by just combatants. Killing them is **justified** on the part of the just combatant. Their actions are typically neither justified *nor* excused at the deep moral level (though excuses *might* apply individually).
      *   **Just Combatants:** They act in necessary defense against an unjust threat. Killing unjust combatants is **justified**. Crucially, **they are not morally liable** to be killed by the unjust combatants. Killing them is *unjustified* aggression, akin to murder.
  4.  **Rejecting MEC:** Therefore, MEC collapses. The moral status of combatants is fundamentally **asymmetrical**. Unjust combatants *are* doing something profoundly worse: participating in collective murderous aggression. Their adherence to *jus in bello* mitigates their actions (e.g., avoiding war crimes), but it does not erase their underlying liability for participating in an unjust enterprise. They cannot claim a "right" to fight merely because they follow the rules of engagement.

  **The Defenses of (or Alternatives to) Equality: Excuse, Convention, and Contract**

  Faced with this powerful critique, defenders of MEC or related positions offer nuanced responses:

  1.  **The Excusatory Defense (Lazar, et al.):** Some philosophers (like Seth Lazar) concede McMahan's *deep moral* asymmetry but argue that **unjust combatants are often *excused***. Key excusing conditions in war include:
      *   **Epistemic Limitations:** Soldiers are rarely in a position to reliably judge the *jus ad bellum* merits of their nation's war. Governments control information, propagate propaganda, and demand obedience.
      *   **Coercion and Duress:** Soldiers face immense institutional pressure, threats of punishment (including for desertion), and powerful group dynamics that severely limit their genuine freedom to refuse participation.
      *   **Role Obligations:** Soldiers are trained to follow orders and defend their comrades and state; disentangling this role morality from the abstract justice of the war is practically impossible for the individual soldier.
      *   **Conclusion:** While unjust combatants are *liable* at the deep moral level (agreeing with McMahan), they are often not *culpable* or *blameworthy* due to these excusing conditions. Consequently, treating them *as if* they were moral equals (*in bello*) is practically justified and avoids unfairly condemning individuals trapped in systemic circumstances beyond their control. The *symmetry* in combatant status is thus preserved *pragmatically* due to widespread excuse, even if *deep moral liability* is asymmetric.

  2.  **Conventionalism (Shue, et al.):** Philosophers like Henry Shue argue that MEC is best understood not as a deep moral truth, but as a **necessary convention** essential for the functioning of *jus in bello* norms.
      *   **The Problem of Knowledge and Reciprocity:** If soldiers believe only *they* have the right to kill (because their cause is just), while the enemy does not, adherence to *in bello* constraints collapses. Why should the "just" side show restraint to "murderers"? Conversely, the "unjust" side has no incentive to follow rules if they know they are seen as criminals regardless. MEC provides a mutually recognized "level playing field" where *both sides* have an interest in maintaining rules protecting prisoners, civilians, and limiting suffering.
      *   **Maintaining Humanitarian Constraints:** The convention of MEC is the pragmatic foundation upon which the edifice of International Humanitarian Law (IHL) is built. Abandoning it risks returning warfare to a state where *no* constraints are observed, causing significantly greater suffering for all involved, especially civilians. The convention serves a vital moral purpose (reducing overall harm) even if it doesn't perfectly reflect deep individual moral liability.

  3.  **Collectivist/Contractual Views:** Less prominent but related arguments suggest MEC arises from a kind of social contract *between states* or *between combatants*. Soldiers are authorized agents of their state; the state bears primary *ad bellum* responsibility, while soldiers are bound by the mutual *in bello* contract of warfare. Attacking the agent (soldier) isn't inherently immoral because they act within their authorized role under the shared rules of the "war game." This view struggles, however, to explain why individuals should lose their basic moral rights simply by becoming state agents in an unjust enterprise.

  **The Verdict: Deep Collapse, Practical Survival**

  The revisionist critique, spearheaded by McMahan, is fundamentally correct at the **level of deep, individual morality.** The analogy to self-defense is compelling. Soldiers fighting for a manifestly unjust cause of aggression *are* participating in a collective moral wrong. Their actions make them morally liable to defensive killing by those resisting that aggression in a way that does *not* symmetrically apply to the just combatants. Adherence to *jus in bello* rules is morally significant – it prevents them from becoming war criminals – but it does not magically transform their participation in an unjust war into a morally neutral act or grant them a right to kill just defenders. Walzer's strict separation of *jus ad bellum* and *jus in bello* cannot be sustained at this foundational level. **MEC, as a claim about the *deep moral equivalence* of all combatants regardless of the justice of their cause, collapses under the revisionist critique.**

  **However, the doctrine does not vanish entirely; it transforms into a vital practical necessity.** The excusatory and conventionalist defenses reveal why MEC remains indispensable *in practice*:

  1.  **The Ubiquity of Excuse:** The epistemic fog of war, state coercion, and the profound difficulty of individual moral judgment in the military context mean that treating *every* unjust combatant as a culpable murderer is profoundly unfair and often inaccurate. The widespread presence of excusing conditions necessitates a *presumption* of equal combatant status *in bello* for the sake of justice to the individual soldier.
  2.  **The Imperative of Humanitarian Law:** The conventionalist argument is compelling. The rules of war protecting civilians, prisoners, and limiting suffering *depend* on reciprocity and mutual recognition of combatant status. Eroding MEC risks eroding these vital constraints. Maintaining the *convention* of combatant equality, even while acknowledging its moral fiction, is a lesser evil than the potential descent into total war that its abandonment could invite. It serves the paramount moral goal of mitigating the horrors of war.
  3.  **Pragmatic Function:** As a practical legal and military doctrine, MEC provides clear, workable rules for soldiers in the chaos of battle. Demanding soldiers constantly assess the deep justice of their cause and the liability of each enemy combatant is impossible and would paralyze military operations and undermine discipline.

  **Therefore, the resolution is a synthesis recognizing a crucial distinction:**

  *   **Deep Moral Level:** Moral equality collapses. Unjust combatants are generally **liable** to defensive harm in a way just combatants are not. Their participation is typically **unjustified**, and while often **excused** mitigating blame, the excuse does not negate their liability. Deep moral asymmetry prevails.
  *   **Practical/Jus in Bello Level:** Moral equality **survives as a necessary convention and pragmatic principle.** Due to widespread excusing conditions and the paramount need to maintain humanitarian constraints and reciprocal *in bello* compliance, combatants *must* be treated as moral equals *in the conduct of hostilities*. We grant them symmetrical rights and obligations under the laws of war, regardless of *ad bellum* justice.

  **In essence:** The soldier fighting for an unjust cause is, in the abstract, more like an aggressor than a defender. But the realities of war – ignorance, coercion, and the desperate need for rules to contain the slaughter – mean we *must* treat them, on the battlefield, *as if* they were the moral equal of their adversary. The "equality" is a shield forged not from deep moral truth, but from the harsh necessities of limiting hell. It collapses as philosophy but endures as a vital, tragic, practical imperative.
