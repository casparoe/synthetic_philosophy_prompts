prompt: |-
  So I've been falling down a rabbit hole on the "standing to blame" literature after writing a piece on all the hypocrisy call-outs in politics (every scandal now comes with someone yelling "you're a hypocrite, shut up" like that settles anything). Two accounts of why hypocrisy actually undermines standing to blame keep bumping into each other in my notes and I cant tell if they really disagree. One is R. Jay Wallace's "equal standing" story: hypocritical blame fails because your implicitly claiming an exemption from the norm you're holding someone else to, which breaks the equal standing that blaming (as a kind of address) is supposed to presuppose. The other is G.A. Cohen's line from "Casting the First Stone" (his piece on who gets to condemn terrorists), which, if I remember right, is less about narrow do-as-I-say-not-as-I-do hypocrisy and more about whether you're complicit in the same background injustice, even without personally doing the exact thing.

  Can you lay out both views properly and then tell me which gives the better verdict on this case: a former oil exec turned climate activist, who never drilled a single well themselves but made a fortune off the industry, now shaming everyday people for their carbon footprints. Does one theory actually track our intuitions better here, or is the Wallace/Cohen disagreement more verbal than real?
