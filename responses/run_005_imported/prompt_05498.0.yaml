answer: |-
  Here's a breakdown of Wallace and Cohen's accounts of hypocritical blame and their application to your oil exec case:

  **1. R. Jay Wallace: The "Equal Standing" Account (Hypocrisy as Moral Inequality)**

  *   **Core Idea:** Blame is a distinctive form of *moral address*. To effectively blame someone (A blames B for X), A must presuppose a relationship of *moral equality* between them. Both are subject to the same moral norms, and both are accountable to each other for upholding them.
  *   **Hypocrisy's Problem:** When the blamer (A) is *guilty of violating the very norm they are invoking* against B, they implicitly claim an *exemption* for themselves from that norm. They act as if *they* are not bound by the rule they insist *B* must follow. This shatters the presupposition of equality.
  *   **Result:** A loses "moral standing" to blame B. It's not that B isn't blameworthy; it's that A, by their own conduct, has disqualified themselves from being the *rightful addresser* of that blame. Their blame becomes illegitimate *as address*, akin to a corrupt judge presiding over a case.
  *   **Focus:** Direct, personal violation of the *specific norm* being invoked in the blame. It's about the blamer's *own actions* undermining their moral authority *relative to that particular norm*.

  **2. G.A. Cohen: The "Complicity in Background Injustice" Account (Hypocrisy as Systemic Entanglement)**

  *   **Core Idea (from "Casting the First Stone"):** Standing to blame can be undermined not only by direct personal hypocrisy regarding the *specific act*, but by being deeply *complicit in the broader system of injustice* that makes the blamed act possible or prevalent. The blamer's position within the unjust system creates a conflict of interest or taints their voice.
  *   **Hypocrisy's Problem (Broader):** If the blamer (A) *benefits from* or *actively participates in upholding* the unjust structures that enable or normalize the wrongdoing they condemn in B, their blame loses legitimacy. Even if A doesn't commit the *exact* act, their role in the system makes their condemnation seem self-serving, disingenuous, or blind to their own contribution.
  *   **Result:** A lacks the "clean hands" or moral purity required to issue authoritative condemnation *regarding that system*. Their voice is compromised by their entanglement in the very injustice they decry. The problem is systemic complicity, not necessarily identical personal transgression.
  *   **Focus:** Participation in and benefit from the *underlying unjust system* related to the specific wrongdoing. It's about the blamer's *structural position* and contribution to the context enabling the blameworthy act.

  **Applying to the Oil Exec Turned Climate Activist:**

  *   **The Blamer:** Former oil exec who made a fortune from the industry but never personally drilled a well.
  *   **The Blamed:** "Everyday people" for their carbon footprints.
  *   **The Norm:** Reducing carbon emissions/mitigating climate harm.

  **Wallace's Analysis:**
  1.  **Direct Personal Violation?** The exec isn't necessarily blaming people for *drilling wells* (which they didn't do). They are blaming them for *high carbon footprints* (driving, heating homes, consumption).
  2.  **Hypocrisy?** Does the exec *personally* have an excessively high carbon footprint *now*? Wallace's theory primarily focuses on *current* or *ongoing* violations of the specific norm being invoked. If the exec *currently* lives a genuinely low-carbon lifestyle (despite past wealth source), Wallace might argue they *do* have standing. Their past role *in the industry* isn't a direct violation of the *norm for individuals* ("reduce your personal footprint") they are invoking. Their blame isn't implicitly claiming exemption *for themselves* from reducing *their own* footprint *now*.
  3.  **Verdict:** **Likely Preserves Standing (on Wallace's terms).** Unless the exec *currently* lives hypocritically (e.g., owns multiple mansions, flies private jets), their past source of wealth doesn't automatically strip them of standing to blame individuals for *their current consumption choices*. Their critique targets a different actor (individual consumers) than their own past role (industry executive).

  **Cohen's Analysis:**
  1.  **Systemic Complicity?** Absolutely. The exec amassed wealth by profiting from and likely actively participating in the *very system* they now condemn: the fossil fuel industry driving climate change. They were a key part of the structure that *produced* the carbon-intensive society and infrastructure that now traps "everyday people." They benefited enormously from the injustice.
  2.  **Conflict of Interest/Tainted Voice?** Yes. Their fortune was built on accelerating the problem they now decry. This creates a strong appearance of hypocrisy: condemning the symptoms (individual footprints) while having been a major architect/capitalist beneficiary of the cause (the fossil fuel system). Their critique of individuals can seem to deflect responsibility away from the systemic drivers (like the industry they were part of) and onto consumers, absolving their own past role and the structures they upheld.
  3.  **Verdict:** **Undermines Standing.** The exec is deeply complicit in the *background injustice* – the fossil fuel economy – that makes high individual carbon footprints both prevalent and often difficult to avoid. This systemic entanglement compromises their moral authority to issue condemnations *about climate responsibility*, even targeting different actors within the same system. Their voice is tainted by their past role as a profiteer from that system.

  **Which Theory Tracks Intuitions Better?**

  *   **Cohen's account** far better captures the intuitive discomfort with the oil exec scenario. Most people would likely find the exec's shaming of everyday people jarring, unfair, and hypocritical *because of their past role*, even if they live modestly now. The sense is, "You helped *create* this mess and got rich doing it; who are *you* to lecture *me* about my role within the system you profited from?" Cohen's focus on systemic complicity and benefiting from the injustice explains this intuition powerfully.
  *   **Wallace's account**, while rigorous, feels overly narrow here. It struggles to account for why the past systemic role *does* feel morally relevant to standing, even without direct personal violation of the specific consumption norm being invoked *now*. It might seem to let the exec off the hook too easily for their foundational contribution to the problem.

  **Is the Disagreement More Verbal Than Real?**

  Not entirely, but they address different *aspects* of the problem:

  1.  **Scope:** Wallace focuses narrowly on *violation of the specific norm invoked*. Cohen focuses broadly on *complicity in the underlying injustice*.
  2.  **Mechanism:** Wallace sees hypocrisy breaking *reciprocal moral address*. Cohen sees complicity creating a *conflict of interest* or *moral taint*.
  3.  **Target:** Wallace primarily invalidates blame for *identical wrongs*. Cohen invalidates blame *related to the system* one is complicit in.

  **However, they converge significantly:** Both agree that hypocrisy/complicity undermines the *blamer's moral authority* and makes their blame illegitimate *as a form of address* (not necessarily incorrect in substance). Cohen's view can be seen as *expanding* the concept of what undermines standing beyond just identical personal transgression to include deep systemic entanglement. The oil exec case highlights a scenario where Cohen's broader view is necessary to explain the strong intuition of lost standing that Wallace's narrower view struggles with. They are complementary lenses on the same core problem: the blamer's own moral failings (whether direct or systemic) disqualifying them from the role of moral judge.
