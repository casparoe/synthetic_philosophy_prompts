prompt: |-
  I'm reporting a piece on how "wisdom of crowds" arguments get invoked in debates about jury size and committee design, and a political scientist I've been interviewing let me sit in on her graduate seminar on social epistemology. Half as a joke, she handed me one problem set from the stack she was grading and asked what score I'd give it. I don't trust my own instincts enough to write about this with any confidence, so I'd like a sharper second opinion before I decide how much weight to put on my own reading. Below is the question exactly as she wrote it, and the answer exactly as the student submitted it.

  Question (20 points, roughly 6/8/6 across parts): (a) State the Condorcet Jury Theorem, including the assumptions it depends on. (b) Consider the following claim, of a kind you'll have seen in popular treatments of "the wisdom of crowds": "Since a jury of six people, each more often right than wrong, is more reliable than any one of its members alone, a jury of six hundred would be better still — bigger deliberating bodies are simply more trustworthy than smaller ones." Using the theorem, assess whether this inference is sound. (c) Identify one respect in which real juries or committees tend to depart from the theorem's assumptions, and explain what that departure does to its guarantee.

  Student answer:

  (a) The Condorcet Jury Theorem describes a group of voters choosing between two options, exactly one of which is correct. If every voter decides independently of the others, and each is more likely than not to pick the correct option — that is, each has a "competence" greater than 0.5 — then as the group grows larger, the probability that a majority vote lands on the correct option approaches 1. This is often presented as a formal vindication of "the wisdom of crowds," and it is essentially the same insight behind Francis Galton's famous demonstration that the median of hundreds of independent guesses at an ox's weight, made at a country fair, came within a pound or two of the true value even though almost no individual guess did: in both cases, pooling many separately fallible judgments cancels out error and leaves only signal.

  (b) The inference is only as good as its assumptions. Competence above 0.5 is doing real work: if a body's members are, on the relevant question, worse than a coin flip, then making the body bigger makes it worse, not better, since the theorem runs in reverse and the majority grows increasingly likely to be wrong as the group grows. Even granting competence above 0.5, the claim also needs independence, and that assumption is more fragile. A jury of six hundred who read the same coverage, hear the same arguments, and influence one another in deliberation is not six hundred independent trials; statistically it may behave like a much smaller independent sample, so "bigger juries are more accurate" does not follow from the theorem just by adding heads.

  (c) The main departure is exactly this failure of independence, encouraged by deliberation, shared media exposure, and social pressure. A subtler point is that the independence assumption is best secured, not undermined, by voters who reason strategically: a voter who thinks carefully about the circumstances under which her vote would be pivotal, and votes accordingly, is a voter whose ballot tracks her own private evidence rather than simply mirroring everyone else's, which is precisely the kind of independence the theorem needs. Committees swayed by a charismatic member or an early straw poll fall short of this strategic ideal, which is a further way the assumptions can fail outside the classroom.

  Could you grade this as she would — out of 20 — and back up the grade with point-by-point comments: what the answer gets right, what it gets wrong or elides, and anything stated in a way that's misleading even if not technically false? If it's useful, feel free to structure the assessment as JSON, with a score, a short list of strengths, and a short list of specific errors, each with a one-line explanation.
reasoning: |-
  Okay, the user is a journalist working on a piece about the "wisdom of crowds" in jury and committee design. They sat in on a political science seminar and were given a student's problem set to grade as a joke, but now they want a professional assessment before deciding how much weight to give their own reading. The question has three parts worth roughly 6/8/6 points, and I need to evaluate the student's answer rigorously.

  Looking at part (a) about stating the Condorcet Jury Theorem: The student correctly identifies the core components - binary choice, independence, competence >0.5, and convergence to certainty. But they added an unnecessary analogy to Galton's ox weight experiment. While interesting, this conflates voting contexts with estimation contexts. The theorem is specifically about majority decisions, not medians of continuous estimates. This could confuse readers, so I'd deduct a point here.

  For part (b) assessing the "bigger juries are better" claim: The student excellently critiques both the competence assumption (showing how <0.5 competence reverses the effect) and especially the independence problem in large juries. They perfectly explain why 600 non-independent jurors don't satisfy theorem conditions. This is precisely what the 8-point question demanded - no deductions.

  In part (c) about real-world departures: The student correctly identifies independence failure due to deliberation/media, but then makes a confusing pivot to strategic voting. While technically some game theory models do treat strategic voters as independent, this is an advanced nuance that oversimplifies real committees. The example about pivotal voters is misleading because real juries rarely operate that way. This needs clarification and a minor deduction.

  Overall the answer demonstrates strong conceptual grasp but has two flaws: the Galton analogy in (a) and the strategic voting tangent in (c). Since part (b) was flawless and carries the most weight, the score remains high. I'd award 16/20 - an A- in most grad systems. For the journalist's purpose, this shows how crowd wisdom arguments require scrutiny of hidden assumptions, which aligns perfectly with their reporting angle on jury design debates.
answer: |-
  Here's a graded assessment of the student's answer, structured as requested. The answer demonstrates a strong conceptual grasp but contains several significant flaws affecting precision and completeness.

  **Grading Summary (16/20):**
  *   **(a) 5/6** (Minor error/overreach)
  *   **(b) 8/8** (Excellent, fully addresses the prompt)
  *   **(c) 3/6** (Partially correct but contains a significant misstatement)

  **Strengths:**
  1.  **Core Theorem Understood:** Correctly identifies the key elements of CJT (binary choice, independence, competence >0.5, convergence) in (a).
  2.  **Effective Critique of Claim:** In (b), perfectly dismantles the popular claim by correctly highlighting the critical dependence on competence >0.5 and the fragility of independence, especially for large groups.
  3.  **Identifies Key Departure:** Correctly identifies the failure of independence due to deliberation/shared information as a major real-world departure in (c).

  **Errors/Problems:**
  1.  **Misplaced Analogy (a):** Linking CJT directly to Galton's ox weight example is **misleading**. CJT concerns majority voting on a binary choice. Galton's example concerns the *median* (or mean) of continuous estimates. While both show aggregation benefits, the mechanisms (voting vs. averaging) and results (certainty vs. reduced error) differ significantly. This conflation risks misunderstanding the theorem's specific context. *(-1 point)*
  2.  **Misstatement on Strategic Voting (c):** The claim that strategic voting "*best secures*" independence is **incorrect and reverses the core problem**. Strategic voting (voting based on pivotality calculations) *fundamentally violates* the CJT's independence assumption. A strategic voter's choice explicitly depends on their beliefs about *how others will vote*, directly contradicting the requirement that votes are cast based *only* on private information/competence, unaffected by others' likely actions. While strategic voting might sometimes *counteract* herding in specific models, it is definitively *not* the independence CJT requires and is a major source of departure in real voting bodies. *(-3 points)*
  3.  **Omission of Competence Consistency (a/c - Minor):** While competence >0.5 is stated in (a), the answer doesn't mention the common assumption that competence is identical and fixed across voters (though not strictly necessary for the limit result, it's standard). More importantly, in (c), it misses that real-world departures often involve heterogeneous or question-dependent competence (e.g., jurors strong on facts weak on law, or competence varying with case complexity), which weakens the theorem's guarantee even if average competence >0.5. *(Noted, but not severe enough for further deduction as core assumptions were covered in context)*.

  **Justification:**
  *   **(a) 5/6:** Lost 1 point for the Galton analogy misstep. The core statement of CJT itself is accurate.
  *   **(b) 8/8:** Flawless critique using the theorem's assumptions. Directly and correctly addresses the popular claim's flaws regarding both competence thresholds and the critical independence assumption for large groups.
  *   **(c) 3/6:** Awarded 1 point for correctly identifying shared influence/deliberation as a major independence failure. Awarded 2 points for recognizing that committees often fail the strategic ideal *mentioned*, but deducted 3 points for the fundamentally wrong claim that this strategic voting *secures* the needed independence. The "subtler point" is a significant conceptual error. Omission of heterogeneous competence is noted but not penalized further.

  **Overall:** A strong answer showing good understanding of CJT's mechanics and its limitations regarding independence in large groups. However, significant points were lost for misapplying an analogy and, more seriously, fundamentally mischaracterizing how strategic voting relates to the independence assumption. **Score: 16/20 (B+ equivalent).**

