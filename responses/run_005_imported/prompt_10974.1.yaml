answer: |-
  Here's a structured argument that moral trade is intrinsically vulnerable to adverse selection and moral hazard due to the nature of moral commitments, potentially undermining the core comparative advantage analogy. I'll build the case economically, acknowledge counterarguments, and assess the implications for Ord's concept.

  **The Core Argument: A Double Market Failure in Moral Trade**

  1.  **The Setup: Parallels to Classic Market Failures**
      *   **Adverse Selection (Hidden Type):** Before a moral trade, each party possesses private information about the *sincerity* and *intensity* of their moral convictions. Just as a used car seller knows the vehicle's true quality (a "lemon") while the buyer does not, a potential moral trader knows whether their stated moral outrage is genuine or performative. An insincere actor ("moral lemon") can easily mimic the preferences of a sincere trader to enter a deal.
      *   **Moral Hazard (Hidden Action):** After the agreement, compliance is largely unobservable and unverifiable. Did the omnivore *actually* switch *all* their meat consumption to pasture-raised, or just the steak they ate in front of the vegetarian? Did the vegetarian *genuinely* experience moral cost when buying leather, or did they just buy a belt they wanted anyway? Unlike a traded good (where delivery is often observable), the *internal moral cost* and *consistent behavioral change* are hidden actions.

  2.  **Exploitation & Crowding Out: The Dynamic Process**
      *   **Stage 1: Adverse Selection Favors "Moral Lemons":** Insincere traders have a strategic advantage. They can:
          *   Overstate the intensity of their convictions to extract larger concessions ("I find factory farming *absolutely devastating*, so you need to do X, Y, and Z for me to switch").
          *   Understate the cost of their concession ("Oh, giving up factory-farmed meat is *no big deal* for me, honestly").
          *   Feign concern about issues where monitoring compliance is hardest.
          Sincere traders, bound by their actual convictions, cannot credibly mimic this flexibility. They are "high-cost" traders in terms of the concessions they require and the authenticity they bring.
      *   **Stage 2: Moral Hazard Erodes Trust & Value:** Even if a deal is struck, the inability to monitor compliance creates strong incentives for defection:
          *   The insincere trader has little reason to follow through. Their stated moral cost was fake; actually changing behavior is burdensome.
          *   The sincere trader *might* comply due to intrinsic motivation, but faces the risk their counterpart won't. Partial compliance or "effort substitution" (e.g., the omnivore switches chicken but not beef) is easy and undetectable.
      *   **Stage 3: Market Unraveling:** Sincere traders realize:
          *   They are likely dealing with insincere counterparts (due to adverse selection).
          *   Their concessions are costly, but the reciprocal benefits are unreliable (due to moral hazard).
          *   They are effectively subsidizing insincere actors who gain concessions without delivering real moral gains.
      This leads sincere traders to withdraw from the "moral market" or demand prohibitively high "premiums" (concessions) to offset the risk, making deals impossible. The market becomes dominated by insincere actors trading cheap promises with little real moral consequence – a "race to the bottom" in moral trade efficacy. The *comparative advantage* (sincere differences enabling mutual gain) is destroyed because the information asymmetry prevents efficient matching and enforcement.

  3.  **Why Moral Commitments Amplify the Problem (vs. Ordinary Goods)**
      *   **Costless Signaling:** Stating a strong moral view is virtually free. Stating you have a high-quality used car is cheap, but proving it (via mechanics, history) costs resources. Moral sincerity lacks cheap, reliable verification mechanisms.
      *   **Non-Contractibility:** The "goods" traded are internal states (moral satisfaction/cost) and private behavioral changes. They cannot be written into an enforceable contract. Courts can verify if a car was delivered; they cannot verify if someone *felt* moral cost or *always* chose pasture-raised meat.
      *   **Absence of Residual Claimants:** In firms, principals (owners) have incentives to monitor agents (managers) because they bear the residual profits/losses. In moral trade, there's no "principal" who internalizes the full cost of shirking; the losses are diffuse (the "moral gain" isn't realized) and fall partly on the deceived counterpart.
      *   **Lack of Repeated Interaction/Reputation Mechanisms:** Many moral trades might be one-off or infrequent, hindering the development of reputation, a key mitigator in ordinary markets. Moral reputations are also easily gamed ("virtue signaling") compared to commercial reputations built on delivered goods/services.

  **Counterarguments & Nuances (Where Moral Commitments Might Resist Failure)**

  1.  **Intrinsic Motivation:** Sincere moral traders *want* to comply due to their convictions, reducing moral hazard *for them*. However, this doesn't solve adverse selection (insincere actors still enter) or the moral hazard of *their counterpart*. Intrinsic motivation makes sincere traders *more* vulnerable to exploitation by insincere ones.
  2.  **Thick Communities:** Within close-knit groups (e.g., activist circles, religious communities) with shared values and strong social monitoring, reputation *can* function. Compliance might be observable, and defection punished socially. This mitigates the problems *within* the community but doesn't scale to the diverse, anonymous interactions often envisioned in moral trade theory (e.g., global poverty alleviation deals between ideologically opposed groups).
  3.  **Focus on Observable Outcomes:** Could trades focus *only* on verifiable actions with measurable outcomes (e.g., "I donate $X to cause A if you donate $Y to cause B")? This reduces moral hazard but:
      *   It abandons the core of *behavioral change based on differing moral weights* (like the meat/leather example).
      *   Adverse selection remains: An actor who doesn't truly value Cause B might agree to donate $Y only if the concession for Cause A is large enough to outweigh their *actual* low valuation of B, exploiting the sincere partner who highly values A.
      *   It becomes more like standard charitable bargaining than a novel "moral trade" exploiting comparative advantage in moral costs.

  **Assessment: Practical Wrinkle or Analogical Undercutting?**

  *   **More Than a Wrinkle:** This vulnerability isn't merely a practical hiccup; it strikes at the heart of the **comparative advantage analogy**. The analogy relies on the *revealed preferences* and *enforceable contracts* that make standard trade work. In economics:
      *   Preferences are revealed through *costly* actions (purchases).
      *   Contracts enforce delivery of *observable* goods/services.
      *   Institutions (courts, reputation systems) mitigate information problems.
      Moral trade lacks these foundations. The inability to reliably reveal *sincere* moral types and enforce *private* behavioral compliance means the "gains from trade" Ord identifies are often phantom or exploitative in practice. The core mechanism – mutual benefit arising purely from differing valuations – is critically impaired by the information asymmetries inherent in private moral commitments.
  *   **Undercutting the Analogy?** It significantly **undercuts the robustness of the analogy**. While the *theoretical possibility* of mutual gain exists in a world of perfectly sincere and perfectly monitorable actors, the *practical feasibility and stability* of such trades in the real world – filled with strategic actors and hidden information/actions – is highly questionable. The market failures aren't peripheral; they are central to the "good" being traded (moral commitment/behavior). This suggests moral trade is fundamentally more fragile and prone to collapse or perversion than standard economic trade.

  **Conclusion for Your Feature:**

  Toby Ord's moral trade is a fascinating intellectual export from economics to ethics, highlighting a potential avenue for cooperation amidst deep disagreement. However, its vulnerability to simultaneous adverse selection and moral hazard presents a profound challenge. The very features that define moral commitments – their sincerity, intensity, and reliance on internal states – make them uniquely susceptible to strategic deception and hidden defection. While intrinsic motivation or tight-knit communities might offer pockets of resistance, these are unlikely to scale. Consequently, the elegant parallel to comparative advantage in trade risks being undermined by the harsh realities of information asymmetry. Moral trade, in practice, may be less a stable engine of mutual moral improvement and more a fragile arrangement constantly threatened by insincere actors exploiting the good faith of sincere ones, potentially crowding out the very cooperation it seeks to foster. This doesn't render the concept useless, but it demands serious consideration of *institutional* or *technological* solutions (e.g., verifiable impact tracking?) if it is to move from intriguing theory to practical reality.
