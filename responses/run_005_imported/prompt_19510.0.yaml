answer: |-
  **To:** Board of Directors, [Co-op Name]  
  **From:** Elections Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendation on Voting Method for Future Board Elections  

  ### **Background**  
  Our first ranked-choice voting (RCV) election successfully addressed vote-splitting but revealed a new concern: the winner (Treasurer) lost a hypothetical head-to-head matchup against the candidate eliminated in Round 2. While RCV’s instant-runoff process was correctly followed, this outcome has divided members. We acknowledge both frustration over the result and the philosophical argument that "no perfect system exists" (per Arrow’s Impossibility Theorem). However, practical improvements *are* possible.  

  ---

  ### **Engaging Arrow’s Theorem**  
  Arrow’s theorem mathematically proves that no ranked system can satisfy all fairness criteria (e.g., unanimity, independence of irrelevant alternatives) simultaneously. **This does not mean all methods are equally flawed.** RCV satisfies key criteria like "monotonicity" (voters can’t hurt a candidate by ranking them higher) but fails the "Condorcet criterion" (electing a candidate who beats all others head-to-head). Systems exist that better approximate Condorcet fairness—our priority given this election’s controversy.  

  ---

  ### **The Case for Sticking with RCV**  
  RCV has merits we respect:  
  1. **Simplicity:** Members grasp runoff eliminations.  
  2. **Proven Fix for Splitting:** It eliminated plurality’s spoiler effect.  
  3. **Widespread Adoption:** Many governments/organizations use it successfully.  
  4. **No "Worse" Outcomes:** Unlike some systems, RCV never elects a candidate who would lose to *every* other.  

  **However**, when a Condorcet winner exists but loses under RCV (as may have occurred here), trust erodes. For a co-op of our size, we can adopt a method that mitigates this.  

  ---

  ### **Recommended Method: Condorcet-Ranked Pairs**  
  We propose **Ranked Pairs**, a Condorcet method that:  
  1. **Identifies Head-to-Head Majorities:** Tallies all pairwise matchups (e.g., "A beats B by 20 votes").  
  2. **Locks in Clear Wins:** Ranks these victories by margin strength, locking in the strongest first (e.g., "A>B by 20" locks before "B>C by 1").  
  3. **Resolves Cycles:** If conflicting pairs arise (e.g., A>B, B>C, C>A), the weakest link is dropped.  

  **Why Ranked Pairs?**  
  - **Addresses This Election’s Flaw:** It guarantees victory for any candidate preferred head-to-head over others (a Condorcet winner).  
  - **Transparent & Auditable:** Pairwise counts are intuitive and can be displayed publicly.  
  - **Balanced Fairness:** Meets more Arrow criteria than RCV while avoiding complex ballots.  
  - **Feasibility:** With 34 ballots, counting is manageable manually or via free software (e.g., *CIVS*).  

  **Tradeoffs:**  
  - Ballots remain identical (ranked choices).  
  - Margin-of-victory comparisons may seem abstract initially, but results are defensible.  
  - If no Condorcet winner exists (rare), Ranked Pairs still resolves fairly.  

  ---

  ### **Implementation Plan**  
  1. **Trial Run:** Re-tally this year’s ballots using Ranked Pairs to demonstrate legitimacy.  
  2. **Member Education:** Host one 30-minute session explaining pairwise counting.  
  3. **Tools:** Use open-source software for tallying; document process for audits.  
  4. **Review:** Reassess after 2 election cycles.  

  ---

  ### **Conclusion**  
  Arrow’s theorem reminds us that no system is perfect, but we can choose methods better aligned with our priorities. Ranked Pairs maximizes Condorcet fairness—addressing this election’s core concern—while retaining RCV’s benefits. It offers a rigorous, transparent compromise to restore trust. We recommend its adoption starting next election.  

  Respectfully submitted,  
  The Elections Committee  

  *(1 page)*
