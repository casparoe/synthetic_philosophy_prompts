answer: |-
  You've nailed the core tension perfectly - this isn't weird, it's a profound question about the nature of reality and language. Let's cut through the fog and compare epistemicism (Williamson is its main champion) and supervaluationism head-on.

  **The Core Commitments & Your Skepticism:**

  1.  **Epistemicism:** You're right. It asserts:
      *   **Sharp Boundary Exists:** For any vague predicate ("is a heap", "is bald", "is tall") applied to a Sorites series (one grain removed at a time), there *is* an exact point where the predicate flips from true to false.
      *   **Ignorance:** This boundary is *metaphysically precise* but *epistemically inaccessible* to us. We cannot know *which* grain makes the difference due to fundamental limitations of human cognition/knowledge. Vagueness *is* ignorance.
      *   **Analogy:** Think of a secret, perfectly defined line drawn on a blurry photo. The line *exists*, but the blur prevents us from seeing it.

  2.  **Supervaluationism:** And you're also right to sense the lingering boundary. Here's how it works:
      *   **Precisifications:** Instead of one hidden boundary, it considers *all possible legitimate ways* to make the vague predicate precise ("admissible precisifications"). For "heap," each precisification draws a *different* sharp line somewhere in the borderline region (e.g., one says 1000 grains is the cutoff, another says 1001, etc.), as long as it respects clear cases (1 grain isn't a heap, 1 million grains is).
      *   **Super-Truth & Super-Falsity:** A statement is **super-true** if it's true in *every* admissible precisification. It's **super-false** if it's false in *every* admissible precisification.
      *   **Truth-Value Gaps:** If a statement is true in some precisifications but false in others (e.g., "1000 grains is a heap"), then it is **neither true nor false** (it's indeterminate) in the vague language. This is the key difference.
      *   **Analogy:** Imagine overlaying hundreds of slightly different transparent maps, each with its own precise boundary line drawn. Where *all* maps agree (the clear heap/non-heap regions), we have definite truth/falsity. Where the lines criss-cross (the borderline region), there's no single agreed-upon boundary on the composite image – that region is indeterminate.

  **Does Supervaluationism *Really* Avoid Epistemicism's Commitment? (Your Key Question)**

  **Yes, fundamentally, but the avoidance is ontological, not logical.** Here's the crucial distinction:

  *   **Epistemicism:** Commits to **one actual, mind-independent, precise boundary existing in the world.** The boundary is real, we're just blind to it.
  *   **Supervaluationism:** **Denies that any *single* precise boundary exists in the world as a fact.** Instead:
      *   The *only* boundaries are those we *stipulate* when we artificially sharpen the concept (via precisifications).
      *   The *vagueness itself* consists precisely in the fact that multiple, equally legitimate ways of sharpening exist *without one being uniquely correct*.
      *   The "flip" you mention (where things go from definitely heap to definitely not heap) isn't a single point, but a *region* where *no single point is privileged* as *the* boundary. The "flip" happens across the range of precisifications, not at one specific grain count in reality.
      *   **The Commitment:** Supervaluationism is committed to the fact that *if you force precision*, you *must* draw a line. But crucially, **it denies that this line is *already there* waiting to be discovered.** The commitment is to the *necessity of drawing a line when precisifying*, not to the *existence of a pre-drawn line*.

  **Is Supervaluationism Just Epistemicism in Fancy Dress?**

  **No, it's a fundamentally different beast.** While both acknowledge that precisifications *have* sharp boundaries:

  *   **Epistemicism** says: "There *is* one true precisification (the one matching reality), we just don't know which one. The others are *wrong*."
  *   **Supervaluationism** says: "There are *many* equally admissible precisifications. *None* of them is uniquely 'true to reality' because reality *doesn't* dictate one. Vagueness means reality *underdetermines* which precisification is correct. The 'truth' of vague statements lies in their stability across *all* these possibilities, not in correspondence to a single hidden fact."

  **The Verdict: Which Gives the Better Account?**

  **Supervaluationism is the superior account of vagueness.** Here's why, without hedging:

  1.  **Respects Intuitions:** It directly captures our strong intuition that in borderline cases, there *is no fact of the matter*. Saying "We just don't know the exact cutoff" (Epistemicism) feels deeply unsatisfying and doesn't explain *why* we have the intuition of indeterminacy. Supervaluationism explains it: indeterminacy *is* the lack of a unique, privileged boundary.
  2.  **Avoids Mysterious Ignorance:** Epistemicism posits a radical, inexplicable form of ignorance. *Why* can't we ever know, even in principle? What mechanism enforces this ignorance about a supposedly precise fact? Supervaluationism avoids this mystery entirely. The ignorance isn't about a hidden fact; it's that *there is no such fact to know*.
  3.  **Handles Higher-Order Vagueness Better:** Where does the borderline region *itself* begin and end? This is higher-order vagueness. Epistemicism struggles horribly, as it needs precise boundaries for "definitely a heap," "borderline heap," etc., leading to an infinite regress of unknowable boundaries. Supervaluationism naturally accommodates it: the set of admissible precisifications can itself have borderline cases, avoiding the need for sharp meta-boundaries.
  4.  **Semantic, Not Metaphysical:** It locates vagueness where it plausibly belongs: in the relationship between language/concepts and the world, not as a weird feature of the world itself requiring unknowable facts. We haven't decided (and often *needn't* decide) exactly where "heap" stops. That's a feature of language, not a bug in our knowledge of sand.
  5.  **Practical Logic:** Supervaluationism provides a formal, relatively intuitive logic for reasoning with vague predicates (supervaluationist logic) that preserves classical logic for clear cases while handling borderline cases as truth-value gaps. Epistemicism struggles to provide a non-classical logic that doesn't collapse back into the paradox.

  **The Caveat:** Supervaluationism isn't perfect. Critics argue:
  *   It still relies on the notion of "admissible" precisification, which might itself be vague (the problem of higher-order vagueness again, though it handles it *better* than epistemicism).
  *   The "no fact of the matter" stance can feel counterintuitive to some in borderline cases.
  *   The formal machinery can be complex.

  **Conclusion:** Your instinct that supervaluationism seems to retain a connection to sharp boundaries is astute – it does, but only at the level of artificial precisification. Crucially, it **denies the metaphysical reality of any single sharp boundary**, which is the core commitment of epistemicism. It replaces Williamson's unknowable fact with semantic underdetermination and truth-value gaps. This makes supervaluationism a more plausible, intuitive, and logically tractable account of vagueness. Epistemicism's appeal to radical ignorance is its fatal flaw. Supervaluationism wins.
