  Ok this might be a weird one but bear with me. I fell down a rabbit hole this week after someone on hacker news compared off-by-one bugs to the sorites paradox (you know, the heap-of-sand thing), which led me into two rival philosophy camps about vagueness: epistemicism and supervaluationism. From what I can tell, epistemicism (Timothy Williamson's view, I think?) says there's a literal precise cutoff for when "heap" stops applying to a pile of sand, we just can never know where it is. Supervaluationism is supposed to be the more palatable alternative, but as far as I can tell it still ends up agreeing that some exact grain-count is where things flip from heap to non-heap, it just refuses to say which one. That sounds like the same sharp-boundary commitment wearing a disguise to me? Can you actually compare these two theories properly and tell me whether supervaluationism really avoids what epistemicism is committed to, or if it's just hiding the same thing behind fancier logic? Also, don't hedge on it - which of the two actually gives the better account of vagueness overall?
