  Hmm... medical contexts often provide rich probability dilemmas. What about... diagnostic probabilities? But that might be too common. Wait - what if we combine it with something unexpected? Like zoonotic diseases or occupational hazards. 

  I recall that veterinarians have interesting cross-species exposure risks. Perfect! A veterinarian bitten by a macaque while researching zoonoses creates beautiful tension: the "medical professionals" class suggests low disease risk, while "primate-bite victims" suggests high risk. Both classifications are objectively defensible but yield wildly different probabilities (say 0.3% vs 15% for herpes B).

  Now to deepen the arbitrariness critique. Reichenbach's "narrowest reliable statistics" fix fails here because:
  - Defining "narrowest" is ambiguous (should we include occupation? research specialty?)
