prompt: |-
  Ok this is going to sound random but bear with me for a sec. I've been a freelance illustrator for about 8 years now (book covers, editorial stuff, the occasional album cover) and over the last year or so my income has basically cratered because half my regular clients just run a Midjourney prompt now instead of hiring me. I've suddenly got a lot more free time than I'd like, so I signed up for a philosophy night class at the community college, and this week's reading was Moritz Schlick's essay "On the Meaning of Life." His basic idea is that a life is meaningful to the extent you manage to turn what you're doing into "play" -- activity that's done for its own sake instead of as a means to some further goal -- and he actually singles out art and craft work as the clearest examples of this, while being pretty harsh on "mechanical, brutalizing" industrial labor, saying that kind of thing is basically slave labor dressed up and civilization would be better off without it.

  Which got me stuck on something. Schlick's whole framework sort of assumes that if boring, repetitive work ever got automated away, that would just free people up to do more of the creative "play" stuff, which is where the real meaning supposedly lives. But generative AI seems to be coming for the drawing/writing/music jobs first, while stuff like plumbing or childcare is way harder to automate. So genuinely, what do you think Schlick would say if someone explained this situation to him? Would he just bite the bullet and insist the meaning was always in the doing-it-for-yourself part, so it doesnt actually matter that a machine can now do my job faster and cheaper and I should just keep drawing for the joy of it -- or is there something in his actual argument, not just the vibe of it, that would genuinely break under this kind of case? I'd rather you get into the weeds of what he actually argued than give me a generic "here's what a philosopher might say about AI" answer.
