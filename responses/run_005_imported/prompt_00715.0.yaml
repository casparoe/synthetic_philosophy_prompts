answer: |-
  That's a fantastic question – you've nailed a core tension between Aquinas' prescriptive ethics and Knobe's descriptive findings. Let's break down Aquinas' logic and then see how Knobe complicates it:

  **Dissecting Aquinas' Argument (II-II, Q.64, A.7):**

  1.  **The Core Premise:** A single human act can have multiple effects.
  2.  **The Crucial Distinction:** Effects are categorized as either:
      *   **Intended (Intenditur):** The conscious purpose or goal motivating the act. This is what gives the act its moral species (e.g., saving a life).
      *   **Beside the Intention (Praeter Intentionem):** A foreseen but *undesired* consequence that is not the reason for acting. It's "accidental" to the moral nature of the act.
  3.  **Application to Self-Defense:**
      *   **Intended Effect:** Preserving one's own life ("saving of one's life"). This is the *goal*.
      *   **Foreseen but "Beside the Intention" Effect:** The death of the aggressor ("the slaying of the aggressor").
  4.  **Why is Death "Praeter Intentionem"?** Aquinas doesn't claim the defender is *unaware* of the death. He claims:
      *   **The Death Isn't the Goal:** The defender acts *for the sake of* saving their life, not *for the sake of* killing the attacker. Killing isn't the motivating purpose.
      *   **Death is a Consequence of the Means:** The defender chooses the *means* of forceful resistance necessary to stop the threat. Death is a highly probable or even inevitable *result* of using that means effectively against a lethal threat, but it's not chosen *as* the means itself. The means is "stopping the attack," death is the *way* that stopping happens in this lethal context.
      *   **The "As Far As Possible" Caveat:** Aquinas hints at proportionality. The force used must be necessary and proportionate *only* to stop the attack. If minimal force could stop the attack without killing, killing would become intended or disproportionate. The defender must *only* intend to use the force necessary to save themselves.
  5.  **The Moral Justification:**
      *   Since the *intended* effect (self-preservation) is good and natural ("natural to everything to keep itself in being").
      *   And the act is proportionate (only necessary force used).
      *   Then the act itself is morally permissible ("not unlawful").
      *   The bad effect (death), though foreseen, is *not* intended and is an unavoidable side effect of achieving the good goal proportionately. Its moral weight doesn't transfer to the agent *as if* they intended it.

  **The Knobe Effect Challenge:**

  You're absolutely right. Knobe's findings (and subsequent x-phi work) pose a significant challenge to the stability of the "intended"/"foreseen" distinction as Aquinas (and DDE proponents) rely on it. Here's why:

  1.  **"Intentionality" is Folk-Psychologically Contaminated:** Knobe shows that ordinary people's judgments about whether a side effect was brought about "intentionally" are heavily influenced by the *moral valence* of that side effect.
      *   **Harmful Side Effect (Environment):** People readily attribute *intentionality* to the bad outcome, even though the CEO explicitly disavowed wanting it and it wasn't his goal. They *moralize* the intention.
      *   **Beneficial Side Effect (Environment):** People *deny* intentionality for the good outcome, even though it was equally foreseen and a side effect of the same action driven by the same indifference. The lack of positive moral desire seems to block the attribution of intention.
  2.  **Undermining the Descriptive Claim:** Aquinas (and DDE) needs the distinction between "intended" and "merely foreseen" to be a relatively objective, psychological fact about the agent's mental state that we can discern. Knobe suggests that *how we discern and describe that mental state* is itself shaped by our moral evaluation of the *outcome*. We don't neutrally report the mental state; we interpret it *through* a moral lens.
  3.  **Threatening the Prescriptive Framework:** If our very *judgment* of what counts as "intended" shifts based on whether the side effect is good or bad, then the DDE's ability to *justify* an act becomes unstable. The doctrine relies on being able to isolate the "intended" effect as the stable core for moral evaluation.
      *   In the harmful environmental case, folk intuition aligns *against* the CEO using a DDE-like defense ("I didn't *intend* to harm the environment, I just foresaw it!"). People say he *did* intend it, morally.
      *   In the self-defense case, if folk psychology moralizes intention, might people be *more* likely to say the defender *intended* the death if they find the death particularly gruesome or disproportionate, even if Aquinas' criteria are technically met? Or *less* likely to say a harmful side effect was intended if they sympathize with the agent?
  4.  **Is "Praeter Intentionem" Psychologically Real?** Knobe's work raises the question: *Can* humans actually hold a mental state where a highly probable, causally direct consequence of their chosen action is truly "beside their intention" in a way that isn't contaminated by the moral weight of that consequence? Or does the moral significance inevitably pull it into the orbit of "intention" in our psychology?

  **Reconciling (or Not)? Possible Responses:**

  *   **Aquinas was Prescriptive, Knobe is Descriptive:** Defenders might argue Aquinas isn't *describing* how people *do* judge intention, but *prescribing* how they *should* judge it for moral purposes. DDE is a normative tool, not a psychological theory. Knobe exposes a common cognitive bias, but doesn't necessarily invalidate the ethical principle.
  *   **Refining DDE:** Some modern DDE proponents might argue Knobe shows we need clearer criteria *beyond* simple foresight vs. desire to delineate "intention," perhaps focusing more on whether the bad effect is a *means* to the good end (which Aquinas also implies). Was the harm *necessary* for the good? Was it *chosen as part of the plan*?
  *   **Knobe Undercuts the Foundation:** Your intuition is strong. If the *concept* of "intention" used in DDE is inherently unstable and morally laden in the way humans actually understand and apply it, then the doctrine loses its claimed objectivity. It risks becoming a post-hoc rationalization where the "intended/foreseen" distinction is drawn precisely *because* we want to justify or condemn the act, rather than being an independent criterion. Aquinas *needs* "intended" to be a stable, non-moralized category based on the agent's motivating purpose, and Knobe suggests that's not how folk psychology works.

  **Conclusion:**

  As a scientist, you've identified a profound challenge. Aquinas relies on a clean, objective separation between the agent's chosen goal (intended) and the foreseen but undesired consequences (praeter intentionem). Knobe's experimental philosophy demonstrates that ordinary people's attributions of "intentionality" are deeply sensitive to the moral valence of side effects. This strongly suggests that the concept of "intention" in folk psychology is **not** the stable, unmoralized category Aquinas requires. While DDE might survive as a prescriptive *normative* principle, Knobe's work fundamentally undercuts its claim to be based on a straightforward, objective description of human action and mental states. The "chairman effect" reveals that our very perception of intention is often a *moral judgment* in disguise, making Aquinas' attempt to isolate intention as the pure source of an act's moral species far more problematic than it first appears. Your chemical intuition about unstable categories is spot on!
