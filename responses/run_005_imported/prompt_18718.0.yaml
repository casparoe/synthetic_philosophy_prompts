answer: |-
  Here are 8 interview questions designed to push the act theory of propositions beyond surface restatements, specifically targeting her key moves and the deeper issues you're grappling with. They're sequenced to progressively corner the "type/token" deflection and end with falsifiability.

  **Core Questions:**

  1.  **The Bradley Regress Relocation:** "You argue that viewing propositions as acts solves Bradley's regress – the act's intrinsic unity avoids needing a further relation to 'glue' constituents. But doesn't this simply relocate the regress? What unifies the *act itself*? Isn't an act of predicating property P of object O *itself* a complex structure – the agent (even if abstract), the predicating relation, P, and O? What prevents *this* complex from requiring its own unifying relation, launching a new regress at the level of acts?"
      *   *Likely Deflection:* "Acts are primitive unifiers; their structure *is* their unity. The regress stops at the act."
      *   **Follow-Up:** "If acts are primitive unifiers immune to regress, why couldn't we simply say the *propositional complex* is the primitive unifier? Doesn't positing acts as primitives just add an extra layer without explaining *why* they escape the regress that plagued complexes? What's the *metaphysical* difference that grants acts this immunity?"

  2.  **Russell's Multiple Relation & Wittgenstein's Objection:** "Your theory seems structurally similar to Russell's early multiple relation theory of judgment, where judging unifies constituents. Wittgenstein famously objected that such theories cannot fix the logical form or distinguish between 'aRb' and 'bRa' (or nonsense). How does your act theory avoid this? Specifically, how does the *type* of act 'predicating love-of-Heloise of Abelard' intrinsically differ from the type 'predicating love-of-Abelard of Heloise' in a way that captures the directionality and prevents nonsensical combinations?"
      *   *Likely Deflection:* "The act types are defined by their intentional content/structure from the start. The type *is* the predicative structure."
      *   **Follow-Up:** "But if the act type *is* defined by the very predicative structure (Abelard as lover, Heloise as beloved, loving as relation) that needs grounding, doesn't this risk circularity? How is defining the act type by the structure it's supposed to *explain* different from just *assuming* the structured proposition? Isn't the 'act' becoming a mere label for the structure we already grasp?"

  3.  **Fregean Comparison & Psychologism:** "Frege solved unity via unsaturated concepts binding with saturated objects. Your act of predicating seems functionally similar: a dynamic 'saturating' of a property with an object. Isn't your view essentially a psychologized version of Frege? If so, what do you gain by introducing *acts* (with potential baggage like agency, time, potential contingency) that outweighs the cost of departing from Frege's robustly objective, abstract realm?"
      *   *Likely Deflection:* "Acts are *not* psychological events; they're abstract types. It's about the *logical* act of predication, not mental occurrences. This avoids Frege's mysterious 'grasping' and provides a dynamic account of unity."
      *   **Follow-Up:** "If the acts are abstract types, not psychological, how do they fundamentally differ in their metaphysical status and unifying power from Fregean *Sinne* (senses), which are also abstract, structured, and unify constituents? Isn't calling it an 'act' just a metaphorical way of describing the combinatorial *function* of a Fregean concept, without solving the core problem of *how* that function is implemented metaphysically?"

  4.  **The Type/Token Dodge - Metaphysical Inflation:** "You frequently invoke 'types' of acts to handle uninstantiated propositions (like dinosaur truths). But what is the *metaphysical status* of these uninstantiated act-types? Are they Platonic abstracta? If so, how does introducing a realm of abstract *acts* (beyond abstract objects, properties, etc.) provide a genuine *advantage* over the structured complex view it replaces, which also likely posits abstract entities? Isn't this just replacing one set of abstracta (propositional complexes) with another (act-types), without clearly resolving the unity problem *for the types themselves*?"
      *   *Likely Deflection:* "Types are a well-understood category across philosophy (e.g., linguistic types, biological species). We need types anyway for many things; positing act-types isn't special pleading."
      *   **Follow-Up:** "But biological or linguistic types often have *causal histories* or *conventional grounding* linking them to tokens. What grounds or constitutes an *uninstantiated, never-to-be-instantiated* act-type, like 'predicating herbivory of Brontosaurus #7421'? If it's defined purely by its structure (predicate, object), how is this *metaphysically distinct* from just being the structured complex itself? Isn't the 'act' label redundant?"

  5.  **Type Unity Problem:** "Building on the type question: What provides the unity for the *act-type itself*? The type 'predicating P of O' still seems to involve constituents: the property P, the object O, and the predicative relation/operation. If the unity of a token act is primitive, what provides the unity for the *type* specification? Doesn't the type *also* face a version of the unity problem – what prevents it from being just a list: {Predication, P, O}? How does the 'type' nature intrinsically unify these elements into a single, structured entity?"
      *   *(This directly challenges the core "type" move by applying the unity problem to the type itself).*

  6.  **Modal & Counterfactual Truths:** "How does the act-type theory handle necessarily false propositions (e.g., '2+2=5') or highly counterfactual truths (e.g., 'If gravity were repulsive...')? What constitutes the *type* of act 'predicating equaling-5 of (2+2)'? Since this act-type could arguably *never* be coherently tokened by a rational agent (as it involves a fundamental mistake), in what sense is it a 'well-defined' act type? Isn't its definition parasitic on grasping the *proposition* (and its falsity) first?"
      *   *(Pushes the "well-defined type" claim into logically impossible territory).*

  7.  **Truthmakers & Act-Types:** "Traditionally, propositions are truth-*bearers* made true by truth-*makers* (facts, states of affairs). If a proposition *is* an act-type, what is its truthmaker? For the true proposition <Dinosaurs were scaly>, what in the world makes the *act-type* 'predicating scaliness of dinosaurs' *true*? Does the existence of the relevant past state of affairs directly make an abstract *act-type* true? How does this causal/metaphysical link work between concrete reality and abstract act-types? Does this differ significantly from how a structured complex would be made true?"
      *   *(Challenges the integration of the theory with broader metaphysical commitments like truthmaking).*

  8.  **Falsifiability & Burdens of Proof:** "Finally, to clarify the theory's status: What would constitute *evidence against* the act-type theory of propositions? What empirical finding, logical argument, or metaphysical problem would genuinely force you to concede this approach doesn't work, rather than just requiring further refinement? Conversely, what evidence uniquely supports *your* act-type view over its main rivals (structured complex, possible-worlds sets, primitives) that isn't equally explained by those rivals?"
      *   *(Forces reflection on the theory's core commitments and vulnerabilities, moving beyond "more research needed").*

  **Sequencing Logic:**

  1.  **Start with Bradley (Q1):** Directly challenges the core motivation/selling point. Her "act as primitive" deflection is expected and sets up the follow-up.
  2.  **Move to Russell/Wittgenstein (Q2):** Challenges the theory's ability to handle core logical features. The "type defines structure" deflection appears, setting up the circularity worry.
  3.  **Frege Comparison (Q3):** Questions the theoretical cost/benefit and uniqueness. The "abstract type, not psych" deflection is central here.
  4.  **Type Metaphysics (Q4):** Directly attacks the metaphysics of the *type* itself, the key deflection tool. The "types aren't special" deflection gets the "uninstantiated grounding" follow-up.
  5.  **Type Unity (Q5):** Applies the unity problem *directly* to the type, making "it's a type" an inadequate answer *by itself*.
  6.  **Modal Extremes (Q6):** Pushes the "well-defined type" claim to its breaking point with logical impossibilities.
  7.  **Truthmaking (Q7):** Tests the theory's compatibility with other core metaphysical frameworks.
  8.  **Falsifiability (Q8):** Ends by demanding clarity on the theory's empirical/logical stakes and burdens, making deflection seem evasive.

  This sequence forces her to defend the *metaphysics* of the act-type repeatedly (Q4, Q5, Q7), makes the "type" answer progressively less satisfying as a standalone solution (Q5 directly challenges it, Q6 shows its limits), and culminates in demanding accountability for the theory's testability (Q8). Good luck with the interview and your paper!
