prompt: |-
  So I did jury duty last year and it's been bugging me ever since. The judge told us we couldn't consider hearsay, so when a witness said 'my neighbor told me she saw him run out of the house around 9pm,' that got tossed out because the neighbor wasn't there to testify herself. Fair enough, i guess. But then when a witness does testify in person, all they're really doing is telling us what they remember seeing. We still can't check that this particular person's eyes or memory are actually reliable, we just believe them because they're sworn in and looking us in the eye. My brother says i'm way overthinking this and that's just how trials have to work, but it seems like both situations come down to trusting somebody's word for it, so why does one basically count as rock solid proof and the other counts as nothing at all? Is there an actual difference here or is it just a technicality?
