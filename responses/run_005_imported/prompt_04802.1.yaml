prompt: |-
  I've spent a long time reading through the Overcoming Bias archives, and I keep coming back to Robin Hanson's old posts on Aumann's agreement theorem, along with the paper he wrote with Tyler Cowen on whether disagreements are ever honest. This has become more than an academic interest for me lately: a friend from my local rationalist meetup and I have been stuck in a weeks-long disagreement over the probability we should assign to a fairly mundane Metaculus question (something like whether the US enters a recession before the end of next year), and neither of us will budge. We each regard the other as a careful, good-faith Bayesian, we've walked each other through our full reasoning and evidence in exhausting detail over several long conversations, and even ran a double-crux session at one point — yet our numbers still differ by nearly twenty percentage points after all that.

  Given that Aumann's theorem seems to show that two people who regard each other as rational, and who have common knowledge of each other's posteriors, cannot agree to disagree, and given that, per the old Geanakoplos–Polemarchakis result, a handful of rounds of exchanging updated numbers should already get us most of the way to that common-knowledge condition, it really does seem to follow that our continued disagreement is just hard evidence that one of us is violating some rationality norm somewhere — self-deception, motivated reasoning, or something in that vein. I know the theorem technically relies on what's sometimes called the common prior assumption, the idea that we're both reasoning from the same prior probabilities before either of us saw any evidence, but I've always treated that as a bit of harmless modeling scaffolding rather than something that could actually fail between two people who came up through the same meetup scene and read the same blogs, so I don't think that's where the problem lies. So my actual question is: is there a principled, in-the-moment way for two people in this situation to figure out which one of them is the irrational party, so that person can simply defer to the other's number instead of us burning yet another evening on this? More generally, has the rationalist community converged on any heuristics for this beyond "whoever has spent more hours reading the literature wins"?
reasoning: |-
  Okay, the user is deeply engaged with rationalist concepts, specifically Aumann's agreement theorem and its implications for their ongoing disagreement with a friend. They've both invested significant effort in resolving their differing probability assessments on a Metaculus question, yet remain 20 percentage points apart. The user is frustrated and seeks a practical method to identify which party is being irrational, hoping to resolve the dispute without further time investment.

  First, I need to acknowledge the user's thoroughness—they've done double-crux sessions, evidence exchanges, and clearly understand the theoretical framework. Their assumption that the common prior isn't the issue suggests they view their shared rationalist background as sufficient alignment. But this might be where I gently challenge them.  

  The core tension lies in their interpretation of Aumann's theorem as proof that one must be irrational. I should unpack why this might not hold. The common prior assumption (CPA) is often more problematic than it appears—even with similar influences, priors are shaped by personal experiences and subconscious biases. Two people can have vastly different baseline assumptions without either being dishonest.  

  I should also address the "in-the-moment" solution they want. Realistically, forcing immediate deference risks overlooking valid epistemic differences. Instead, I should emphasize diagnostics: maybe suggest mapping their priors to surface hidden disparities, or auditing evidence weighting (e.g., one might overindex a historical analogy). The rationalist community often uses prediction markets or third-party adjudication here, but those aren't instant fixes.  

  Their deeper need seems to be efficiency—they're tired of debates that feel unproductive. So while "defer to who spent more hours reading" is tempting, it's anti-epistemic. Better to frame this as a chance to refine their disagreement taxonomy. Are they using different models? (e.g., econometric vs. narrative-based). Or is it a scope issue—like defining "recession" differently?  

  I recall Hanson/Cowen's paper on honest disagreement. They'd argue that without clear irrationality signs (evasion, inconsistency), the disagreement might persist legitimately. The user might benefit from accepting persistent uncertainty as rational—sometimes 20% gaps reflect true ambiguity.  

  Finally, practical heuristics: if forced to pick, average their estimates and track future performance. Or bet real money to incentivize truth-seeking. But fundamentally, I should steer them toward viewing this as collaborative truth-seeking rather than a duel to find the "irrational" one.
answer: |-
  Your situation perfectly illustrates the tension between Aumann's elegant theory and the messy reality of human disagreement. You've correctly identified the core implication: **Aumann's theorem *does* formally imply that your persistent disagreement, under the conditions you describe, is evidence of a deviation from idealized Bayesian rationality by at least one party.** However, identifying *which* party (or if both) are deviating, and *how*, is the profound challenge. There's no simple "irrationality detector," but here's a breakdown of principled approaches and community heuristics:

  **Why "Who's Irrational?" is Harder Than It Seems:**

  1.  **The Common Prior Assumption (CPA) is Almost Certainly the Culprit (Even if You Think It Isn't):** You dismiss this as "harmless modeling scaffolding," but it's the most frequent and fundamental failure mode.
      *   **"Same Meetup Scene/Same Blogs" ≠ Common Prior:** While you share many influences, your *internalization* of those ideas, the *weight* you assign them, your *unique life experiences* shaping baseline assumptions, and even subconscious priors formed long before encountering rationalism differ profoundly. Two people reading the same sequence on genetics will still have subtly (or not-so-subtly) different prior distributions over the heritability of a complex trait based on personal background and interpretation.
      *   **Priors are Vast and Implicit:** Your prior isn't just over the recession question; it's over every conceivable piece of evidence *related* to it (economic models, Fed credibility, political stability, global shocks, data reliability, etc.). Perfect alignment here is astronomically improbable. Differences might be buried deep in how you model causality or assign base rates.

  2.  **"Rationality" Encompasses More Than Just Bayesian Updates:** Aumann assumes perfect Bayesian updating from a common prior. Real-world rationality failures include:
      *   **Evidence Interpretation:** Did you *truly* agree on the meaning and implications of shared evidence? Or did you interpret the same Fed statement differently based on priors?
      *   **Model Uncertainty:** Are you using different implicit or explicit models of the economy? (e.g., DSGE vs. MMT vs. purely empirical). Aumann doesn't resolve disagreements over which model is best.
      *   **Scope Neglect/Unpacking Effects:** Did you fully account for all relevant pathways to recession? One person might be weighting a specific risk vector (e.g., housing market) much higher based on a vivid recent example.
      *   **Cognitive Biases (Subtle Ones):** Overconfidence, confirmation bias (seeking/discounting evidence), availability heuristic, affect heuristic – these can creep in even for diligent Bayesians, especially on affectively charged topics (like economic hardship).
      *   **Differing Definitions/Scope:** Are you absolutely certain you agree on the *exact* definition of "recession" (NBER dating? 2 quarters negative GDP? Depth?) and the scope of "enters before end of next year"?

  3.  **Common Knowledge is an Idealization:** While Geanakoplos–Polemarchakis shows convergence *can* happen in finite steps, it assumes perfect recall, perfect understanding, and no ambiguity in the statements exchanged. In practice, subtle misunderstandings or different interpretations of *what the other person said* can persist.

  **Principled Approaches to Diagnose the Disagreement (Instead of Finding "The Irrational One"):**

  1.  **Explicitly Map Priors (Especially Implicit Ones):** Don't assume alignment. Go meta:
      *   "Before we looked at any evidence for *this specific question*, what was your prior probability of a US recession starting in *any* given 18-month period over the last 50 years? How did you derive that base rate?"
      *   "What are your fundamental priors about market efficiency, Fed effectiveness, political impact on markets? Can we assign rough probabilities?"
      *   This often reveals deep, previously unspoken differences in worldview that explain the posterior gap.

  2.  **Evidence Audit with Calibration Focus:**
      *   **Source Calibration:** For each key piece of evidence, discuss: "What is your track record for trusting/using information from *this specific source* (e.g., a particular economist, data series, model)? How calibrated have you been historically when relying on similar sources?"
      *   **Argument Calibration:** "When you've used *this type of argument* (e.g., 'inverted yield curve predicts recession') in the past, how often has it been correct? What's your personal Brier score on similar predictions?"
      *   **Identify the Crux(es) of the Cruxes:** Double-crux aims for this, but go deeper. If you found a crux, ask: "What prior belief or evidence weighting *underpins* why *this* is your crux?" Often the true divergence is one level deeper.

  3.  **Model Comparison:**
      *   Force each other to articulate the *simplest possible model* that generates your respective probability estimates. Compare the assumptions and mechanisms of these models directly. Which model's assumptions seem more plausible given general knowledge? Where do the models get historical cases right/wrong?

  4.  **Third-Party Adjudication (with Caution):**
      *   **Prediction Markets:** What probability does the market (e.g., Metaculus itself, Kalshi) assign? While not perfect, it aggregates many viewpoints. Significant deviation from *both* of you suggests you *both* might be off.
      *   **Trusted Calibrated Forecaster:** Find a forecaster known for good calibration on economic questions (not just punditry). Compare both your estimates to theirs. Why do they differ? (Don't defer blindly; understand their reasoning).
      *   **Rationalist Peers:** Present your *full* reasoning (priors, evidence, updates) anonymously to a small group of trusted, calibrated peers from your meetup. Ask for their independent probability assessment and critique of *both* your processes.

  5.  **The Betting Test:** Propose a small, mutually agreeable bet based on the Metaculus resolution. The act of staking something concrete often focuses the mind and reveals hidden doubts or overconfidence. If one person is suddenly much less willing to bet at their stated odds, it signals potential irrationality in their stated belief.

  **Rationalist Community Heuristics (Beyond "Hours Read"):**

  1.  **"Aumann Points to the Prior, Not the Person":** The community increasingly emphasizes that CPA failure is the most likely explanation. This shifts focus from "who's irrational?" to "where do our world models fundamentally differ?" It's less accusatory and more collaborative.
  2.  **Track Record is King:** The most respected heuristic is **calibration**. Who has the better Brier score/log score on *similar* prediction questions over time? Defer to the better-calibrated forecaster. If track records are similar or non-existent, this isn't decisive.
  3.  **The "Shut Up and Multiply" / "Average" Fallback:** If all diagnostic attempts fail *and* a decision is needed *now*, a common pragmatic approach is to **average your probabilities** (potentially weighted by historical calibration if known). This is not theoretically rigorous under Aumann (it violates the assumptions), but it's often better than sticking stubbornly to one number when you know the other person has valid insights.
  4.  **Embrace the Uncertainty:** Sometimes the principled conclusion is: **"Our persistent disagreement, even after effort, is legitimate evidence that this question is genuinely difficult and uncertain."** Your aggregated estimate (via averaging) might be 55%, but the true takeaway is that confidence should be lower – the range between your estimates (e.g., 45%-65%) might better represent the epistemic state. Agree to *both* update your uncertainty upwards.
  5.  **Focus on Process, Not Just Outcome:** Document your reasoning and prediction *now*. When the outcome is known, do a joint post-mortem: *Why* was the correct probability closer to one of you? What specific belief, evidence weighting, or model was mistaken? This builds better priors and processes for *next time*.

  **In-the-Moment Conclusion for Your Recession Disagreement:**

  Forget finding "the irrational party" tonight. Instead:

  1.  **Acknowledge CPA Failure:** "Given we've shared reasoning deeply and still disagree, Aumann suggests our fundamental starting assumptions (priors) likely differ more than we realized, even with our shared background."
  2.  **Run a Quick Prior Audit:** "Quickly, what's your base rate for recessions in non-crisis periods? What's your prior on the Fed nailing a soft landing?" See if a glaring prior difference emerges.
  3.  **Check Calibration (if possible):** "Do you have a track record on past recession predictions? What's mine?"
  4.  **Consult the Aggregate:** What's the current Metaculus median/mean? Why do you each deviate from it?
  5.  **Bet or Average:** Propose a small bet at your respective odds. If no bet, agree to average your probabilities *for the purpose of this specific interaction/meetup discussion* (e.g., if you're 30% and they're 50%, use 40% when discussing implications with the group), acknowledging this is a pragmatic hack, not a resolution.
  6.  **Schedule a Post-Mortem:** Agree to revisit this *after* the Metaculus question resolves to understand why the gap persisted.

  The goal isn't to "win" the disagreement but to refine your collective understanding and predictive machinery. Sometimes the most rational conclusion is mutual uncertainty and a commitment to learn from the outcome. Burning another evening *rehashing the same evidence* is likely futile; burning it *diagnosing your meta-differences* (priors, models, calibration) could be highly productive.
