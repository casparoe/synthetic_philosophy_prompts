prompt: |-
  A friend and I spent most of a long drive back from a decision-theory reading group last weekend arguing about the Pasadena paradox, which one of that week's papers had mentioned only in passing, and neither of us walked away persuaded. For reference, the game is this: toss a fair coin repeatedly until it first lands heads; if that happens on the n-th toss, you receive (-1)^(n+1) x 2^n/n. Summed in the natural order, by number of tosses, the expectation is the alternating harmonic series 1 - 1/2 + 1/3 - 1/4 + ..., which converges only conditionally, to ln 2, so by the Riemann rearrangement theorem those very same terms can be reordered to sum to any real number whatsoever, or to diverge to positive or negative infinity, without changing anything about the underlying gamble itself.

  My friend's position was that this is a non-problem: once you accept, as many decision theorists already do on independent grounds (following Menger's and Arrow's arguments that any utility function satisfying the expected-utility axioms must be bounded), that admissible utility functions have to be bounded, the expected-utility series becomes absolutely convergent, rearrangement stops mattering, and the Pasadena game reduces to just another unremarkable cousin of the St. Petersburg game. I felt this move was too quick, but I couldn't pin down exactly why on the spot, and I'd rather not lean on a hazy memory of how Nover and Hájek's original paper handles this exact reply, since I'd probably misremember or flatten their actual argument. So I'd like your help doing this properly: please construct the strongest possible case, built from first principles, that mandating bounded utility functions does not actually dispose of the problem the Pasadena game raises for decision theory. Engage directly with the absolute-convergence point rather than talking past it, and argue against the most defensible version of my friend's view, not a weaker one.
reasoning: |-
  We are to argue that even if we mandate bounded utility functions, the Pasadena paradox still raises a problem for decision theory. The friend's view is that with bounded utility, the expectation becomes absolutely convergent (so rearrangement doesn't matter) and the problem disappears. We must engage with this point and build a case against it.

   Recall the Pasadena game: 
     Toss a fair coin until first heads on toss n.
     Payoff = (-1)^(n+1) * 2^n / n.

   Without bounded utility, the expectation is the alternating harmonic series: 
     E = 1 - 1/2 + 1/3 - 1/4 + ... = ln(2) ≈ 0.693.

   But by Riemann rearrangement, we can rearrange the terms to get any real number or ±∞.

   The friend argues: if we require utility to be bounded, then we replace the raw payoffs by a bounded utility function. Since the utility function is bounded, the series for expected utility becomes absolutely convergent (because the terms are bounded and the probabilities decay geometrically). Then rearrangement is not an issue.

   However, we want to show that this does not fully dispose of the problem.

   Steps for the argument:

   1. Acknowledge that with a bounded utility function, the expectation is indeed absolutely convergent and rearrangement is not a problem.

   2. But note that the problem is not only about rearrangement. The Pasadena game exposes a deeper issue: the expectation is not defined without a specification of the order of summation. Even if we fix the order (by n) and get ln(2), we might ask: why that order? The natural order (by n) is arbitrary in the context of the game.

   3. The game is defined by a state space of outcomes (each outcome is a sequence of tails ending with a head). The outcomes are naturally ordered by the time of the first head (n). But if we consider the state space without an order, we are forced to assign utilities to outcomes and then compute the expectation. The problem is that the utility function we are using (if unbounded) leads to a conditionally convergent series. But even if we bound the utility, we are altering the original game.

   4. The core issue: the Pasadena game is designed to have payoffs that are unbounded and alternating. When we bound the utility, we change the payoffs arbitrarily. The decision theorist must choose a bounded utility function. But which one? The problem then shifts to the choice of the utility function.

   5. Consider: the original payoffs are in dollars (or some unit). If we use a bounded utility function, we are essentially transforming the dollar amounts arbitrarily. For example, we might use u(x) = x for |x| < M and u(x) = M for x>=M and u(x)=-M for x<=-M. But note that the payoffs in the Pasadena game grow without bound (in absolute value). So for any fixed bound M, there will be some n such that |2^n/n| > M. Then we are capping the utility at M for all n beyond a certain point. This changes the game significantly.

   6. Moreover, the expectation we compute with the bounded utility function will depend on M. As M increases, the expected utility will change. In fact, as M goes to infinity, the expected utility using the bounded utility function will approach the alternating harmonic series (if we use the natural order) and hence approach ln(2). But for any finite M, the expectation is different.

   7. The problem: the expectation is now dependent on the arbitrary choice of M (the bound) and the specific form of the bounded utility function. Why should we choose one bound over another? The original game does not specify a bound.

   8. Additionally, the bounded utility function approach does not tell us how to handle the original game with unbounded payoffs. The decision theorist must first choose a bounded utility function, but the game is defined with unbounded payoffs. The friend might argue that the unbounded utility function is inadmissible. But then we are left with the question: what is the value of the Pasadena game? It depends on the arbitrary bound.

   9. Another angle: even if we accept bounded utility, we must still compute the expectation. The bounded utility function will make the series absolutely convergent, so the order doesn't matter. But note that the payoffs in the game are assigned to outcomes in a specific way. The bounded utility function might assign the same utility to very different payoffs (for large |x|). This leads to a loss of information about the original payoffs.

   10. The Pasadena paradox highlights that the expected utility of the game is not well-defined without an order of summation (if we use an unbounded utility) or without a choice of bound (if we use a bounded utility). In the bounded utility case, we avoid the rearrangement issue, but we introduce an arbitrary parameter (the bound) that affects the expected utility.

   11. Moreover, the problem of the Pasadena game is not isolated. It is an example of a game that is not "expectation-consistent" under the usual summation. The bounded utility approach avoids the problem by changing the game. But the original game is still a well-defined gamble. How should a decision maker value it? The bounded utility approach does not give a unique answer because the answer depends on the bound.

   12. We might also note that the bounded utility requirement is controversial. Some decision theorists (like Savage) have argued for unbounded utility. But even if we accept bounded utility, the problem of the Pasadena game does not disappear; it becomes a problem of how to choose the bound.

   13. Finally, consider that the Pasadena game has been constructed to have a conditionally convergent expectation. The bounded utility approach changes the game so that the expectation becomes absolutely convergent. But the original game remains. The decision maker must confront the fact that the original game (with unbounded payoffs) does not have a well-defined expectation in the usual sense. The bounded utility approach does not solve the problem for the original game; it replaces the game by a different one.

   Therefore, the requirement of bounded utility does not dispose of the problem; it merely transforms it into a problem of choosing a bounded utility function arbitrarily.

   Conclusion: The Pasadena paradox still raises a challenge because it forces us to confront the arbitrariness in the choice of utility function and the dependence of the expected utility on that choice. The rearrangement issue is avoided, but at the cost of introducing an arbitrary bound that affects the valuation of the game.
answer: |-
  To address your friend's position rigorously, we must concede that a bounded utility function indeed forces the expected utility of the Pasadena game to be absolutely convergent, neutralizing the rearrangement issue. However, this does not resolve the deeper problem the paradox exposes. Below, I construct a first-principles case against the claim that bounded utility "disposes of" the issue, focusing on three core challenges: **indeterminacy under bounded utility**, **violation of statewise dominance**, and **epistemic arbitrariness**.

  ### 1. **Indeterminacy of Expected Utility Under Bounded Utility**
  Even with bounded utility, the expected utility (EU) of the Pasadena game remains indeterminate because it depends critically on the *choice of bound* and the *specific functional form* of the bound, not merely its existence.  

  - **The role of the bound**:  
    Suppose we adopt a bounded utility function \(u(x) = \text{clip}(x, -M, M)\), where \(M > 0\) is an exogenous bound (e.g., \(u(x) = x\) for \(|x| \leq M\), and \(u(x) = \text{sgn}(x)M\) otherwise). The EU is then:  
    \[
    \text{EU}_M = \sum_{n=1}^{\infty} \frac{1}{2^n} u\left( (-1)^{n+1} \frac{2^n}{n} \right).
    \]
    For any fixed \(M\), this series is absolutely convergent (since \(|u(\cdot)| \leq M\) and \(\sum \frac{1}{2^n} < \infty\)). However, **the value of \(\text{EU}_M\) is highly sensitive to \(M\)**:  
    - For small \(M\) (e.g., \(M < 2\)), all terms \(|\frac{2^n}{n}| > M\) for \(n \geq 2\), so utilities are clipped to \(\pm M\). This flattens the alternating structure, yielding \(\text{EU}_M \approx 0\).  
    - As \(M \to \infty\), \(\text{EU}_M\) approaches the conditionally convergent limit \(\ln 2\) (if summed in order of \(n\)), but never reaches it for finite \(M\).  
    - Crucially, **no principled method selects \(M\)**. The game itself provides no information about an "appropriate" bound. Thus, \(\text{EU}_M\) can be made arbitrary by varying \(M\)—e.g., \(\text{EU}_M \approx 0\) for small \(M\), or \(\text{EU}_M \approx 10\) for large \(M\) if the clipping is asymmetric.  

    **Conclusion**: Bounded utility replaces the rearrangement problem with a **bound-selection problem**. The EU is not a unique property of the game but depends on an arbitrary parameter \(M\), violating the decision-theoretic ideal that a gamble should have a well-defined value.

  ### 2. **Violation of Statewise Dominance**
  Bounded utility fails to preserve intuitive dominance relations between outcomes, undermining its coherence as a solution.  

  - **The dominance argument**:  
    Consider two variants of the Pasadena game:  
    - **Game A**: Payoff for first heads on toss \(n\) is \(a_n = (-1)^{n+1} \frac{2^n}{n}\).  
    - **Game B**: Payoff for first heads on toss \(n\) is \(b_n = (-1)^{n+1} \frac{2^n}{n} + \epsilon\) (where \(\epsilon > 0\) is small).  

    By statewise dominance, Game B is strictly preferred to Game A since \(b_n > a_n\) for all \(n\). Under unbounded utility, both games have conditionally convergent EUs, but dominance holds if we fix the summation order.  

  - **Problem under bounded utility**:  
    For a fixed bound \(M\), there exists \(N\) such that for all \(n \geq N\), \(|a_n| > M\) and \(|b_n| > M\). Thus:  
    \[
    u(a_n) = u(b_n) = \begin{cases} 
    M & \text{if } (-1)^{n+1} = 1 \\
    -M & \text{if } (-1)^{n+1} = -1 
    \end{cases} \quad \text{(for } n \geq N\text{)}.
    \]
    For \(n < N\), \(u(b_n) - u(a_n) = u(a_n + \epsilon) - u(a_n)\), which is positive but small. For \(n \geq N\), \(u(b_n) - u(a_n) = 0\). Thus:  
    \[
    \text{EU}(B) - \text{EU}(A) = \sum_{n=1}^{N-1} \frac{1}{2^n} \left[u(a_n + \epsilon) - u(a_n)\right] \approx 0 \quad (\text{small } \epsilon).
    \]
    For large \(N\) (i.e., large \(M\)), this difference is negligible, and for small \(M\), it is zero. **Game B is not strictly preferred to Game A in expectation**, violating statewise dominance.  

    **Conclusion**: Bounded utility sacrifices a fundamental axiom of rational choice (dominance) to avoid rearrangement issues. This is a Pyrrhic victory—it "solves" the paradox by introducing a worse problem.

  ### 3. **Epistemic Arbitrariness and the Primacy of the Gamble**
  Bounded utility sidesteps the core lesson of the paradox: that the Pasadena game is **epistemically defective** as a description of a gamble, regardless of utility constraints.  

  - **The gamble’s intrinsic structure**:  
    The game defines a set of outcomes (coin-toss sequences) with payoffs \(a_n\). The expectation is formally given by \(\sum_{n=1}^{\infty} \Pr(n) \cdot a_n\). Crucially:  
    - This series is only conditionally convergent.  
    - Conditional convergence implies that the sum’s value depends on the order of summation.  
    - The "natural order" (by \(n\)) is arbitrary—it reflects how we *label* outcomes, not an objective feature of the gamble.  

    **Bounded utility does not fix this defect**; it masks it by altering the payoffs. The underlying issue—that the gamble lacks a unique expected value—persists in the *original description*. Decision theory should flag such gambles as ill-posed, not rely on utility bounds to "rescue" them.  

  - **Analogy to the St. Petersburg game**:  
    Your friend calls the Pasadena game an "unremarkable cousin" of St. Petersburg, but this is misleading. St. Petersburg has a divergent expectation with *positive* terms, so bounded utility yields a finite, unique EU. Pasadena’s conditional convergence is more pernicious: it creates order-dependence *without* divergence, revealing that **the expectation is not even defined** for the raw gamble. Bounded utility avoids this by fiat, not by solving it.  

    **Conclusion**: The paradox shows that some gambles resist expectation-based evaluation *even after* imposing axioms like transitivity or independence. Bounded utility acts as a filter that screens out such gambles, but it does not explain why they fail—it merely avoids them.

  ### Final Synthesis
  Bounded utility prevents rearrangement but fails to provide a **unique, consistent, and dominance-respecting** expected utility for the Pasadena game. It replaces a problem of mathematical indeterminacy (order-dependence) with one of practical indeterminacy (bound-dependence) and normative compromise (dominance violation). The paradox thus endures as a critique of expectation-centric decision theory: it exposes gambles where the "expected utility" is not just infinite or undefined, but **meta-undefined**—dependent on auxiliary choices (order of summation or utility bounds) extrinsic to the gamble itself.  

  To resolve this, decision theorists must either:  
  1. Reject such gambles as ill-defined (but then explain how to identify them *ex ante*).  
  2. Develop a non-expectation-based evaluation (e.g., using weak convergence or signed measures).  

  Bounded utility is a technical fix for a conceptual problem; it does not address why the Pasadena game—a coherently describable gamble—resists traditional analysis. Your friend is correct that it neutralizes rearrangement, but incorrect that this "solves" the paradox. The deeper issue remains: **no decision rule can assign this gamble a stable, rational value without introducing arbitrariness.** That is the paradox’s enduring challenge.
