  So in linear algebra this year (I'm a senior) my teacher mentioned Zorn's lemma in passing to justify why even infinite-dimensional vector spaces have a basis, and I fell down a Wikipedia hole about it that night. I get the formal statement fine -- if every chain in a partially ordered set has an upper bound, the set has a maximal element -- and I already know its equivalent to the axiom of choice, everyone brings that part up immediately. What I actually want is the gut-level reason it works, not the formal proof (tried reading that version, eyes glazed over). Like if I tried to rig up some sneaky poset where every chain has an upper bound but there's still no maximal element, what exactly breaks? And is there something inherently sketchy about a lemma that tells you a maximal element exists without ever pointing to one -- should that bother me more than it currently does?
