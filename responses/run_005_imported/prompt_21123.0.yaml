  Structure-wise: start with the "why no sneaky poset?" using their framing. Build the natural numbers example—emphasize that the chain itself escapes the set. Then hit the real intervals to show boundedness ≠ upper bound *in the set*. For the existential angst, separate practicality ("math needs this to avoid paralysis") from philosophical acceptance (Hilbert hotels, etc.).  

