prompt: |-
  I write a science-and-ideas column and next week I've got an interview lined up with a philosopher who defends anti-reductionism about testimony -- basically the Reid/Coady line that we're entitled by default to just believe what people tell us, without needing independent perceptual or inductive backup for each claim. I don't want her just reciting the position for the whole piece, so can you draft me 8-10 interview questions, with at least one each on: the 'gullibility' worry and what would actually count as a defeater in real time (not just the stock line that context can defeat it), whether Coady's induction-base arguement against Hume only sinks *global* reductionism and leaves Elizabeth Fricker's local, case-by-case monitoring completely untouched, and whether the kids-learn-language-through-testimony argument really shows trust is *justified*, as opposed to just developmentally unavoidable. Tack a quick follow-up onto each one, keyed to whatever answer she's most likely to give.
reasoning: |-
  Okay, the user is a science-and-ideas columnist preparing for an interview with an anti-reductionist philosopher about testimony. They want fresh, non-repetitive questions targeting specific weaknesses in the Reid/Coady position. Key pain points: gullibility defenses needing concrete defeaters (beyond vague "context"), whether Coady's critique misses Fricker's local reductionism, and if language acquisition proves justification or just inevitability.

  Hmm, the user clearly knows the literature - name-dropping Reid/Coady/Fricker suggests they'll spot shallow questions. They're annoyed by stock answers ("context defeats!"), so questions must force novel concessions. Also, the follow-ups need to anticipate dodges - e.g., if the interviewee handwaves defeaters, the follow-up should demand real-time examples. 

  Breaking this down: First, the "gullibility" worry needs operationalizing. Instead of letting her say "defeaters exist," push for how ordinary people (not philosophers) spot them mid-conversation. Follow-up: If she cites speaker cues (shifty eyes), ask why that isn't perceptual reductionism creeping in. 

  For Fricker, the trap is showing Coady only refutes global reductionism. Question should corner her: If local monitoring is possible, why blanket default trust? Follow-up: If she says monitoring is inefficient, note that efficiency ≠ epistemic justification. 

  Language learning is trickier. Must distinguish between developmental necessity ("kids must trust to learn") and epistemic warrant ("trust is rational"). Follow-up: If she argues necessity implies justification, press her on why adaptive compulsions (like flinching from loud noises) aren't "justified" in the same way. 

  ...Also, user mentioned "real-time" defeaters. That's key. Philosophers love abstract defeaters (e.g., "if speaker is unreliable"), but laypeople need heuristics. Maybe ask: "When your barista says 'coffee is $6,' what *specific* cue would make you doubt mid-sentence?" Force her out of theory. 

  Structure: Lead with the strongest objection (gullibility), sandwich Fricker in middle, end with language since it's thorniest. Each question must sound conversational but hide philosophical traps. Follow-ups are scalpels - not new questions, but incisions into evasive answers. 

  ...User will want "ah-ha" moments. Example: If the philosopher admits local monitoring is possible but costly, that concedes reductionism isn't incoherent - just impractical. That's print-worthy. Similarly, if she ties defeaters to social norms (not perception), follow-up by asking if those norms themselves rest on testimony - circularity risk. 

  Final note: Avoid "stock" Reid arguments. No "children trust instinctively!" unless dissecting why instinct ≠ justification. Pitch questions so answers either reveal new defenses or expose cracks. User wants debate, not dogma.
answer: |-
  Here are 9 interview questions (+ follow-ups) designed to push beyond standard defenses, target your specified concerns, and provoke fresh insights:

  1.  **The Gullibility Core:**
      *   **Question:** Critics argue anti-reductionism licenses dangerous gullibility. Beyond the vague appeal to "context," could you walk us through the *specific, real-time cognitive process* an ordinary person uses to recognize a *defeater*? For instance, if someone tells me "The president just resigned," what *concrete* cue (beyond obvious contradiction) should trigger doubt *before* I simply believe it? Is it purely internal (e.g., feeling uneasy) or tied to specific external signals?
      *   *Likely Answer/Follow-Up Key:* If she mentions speaker characteristics (nervousness, known bias) or source plausibility, follow up: **"But doesn't identifying 'nervousness' rely on my own perceptual judgment about the speaker's state, and assessing 'plausibility' rely on my background inductive knowledge? Isn't this reintroducing reductionist elements *exactly when defeaters are needed*, contradicting the idea of *pure* default trust?"**

  2.  **Fricker's Local Challenge:**
      *   **Question:** Coady's famous induction argument seems to devastate *global* reductionism (Hume's requirement for universal inductive backup). But how does it touch Elizabeth Fricker's *local reductionism*? She argues we *do* need, and constantly perform, swift, context-sensitive assessments of a speaker's competence and sincerity *in the moment* for each testimonial act. Isn't this local monitoring compatible with trusting testimony *in general*, yet avoids blanket default acceptance?
      *   *Likely Answer/Follow-Up Key:* If she argues Fricker demands too much cognitive effort or is psychologically unrealistic, follow up: **"But isn't Fricker describing a fast, subconscious process akin to perceiving trustworthiness? If we *can* and *do* make these micro-assessments automatically (e.g., tone, confidence, situational appropriateness), doesn't this show default acceptance *isn't* actually fundamental, but a placeholder for this implicit local evaluation?"**

  3.  **Language Acquisition: Justified or Just Inevitable?**
      *   **Question:** The argument that children *must* trust testimony to acquire language is powerful. But does this demonstrate that such trust is *epistemically justified*, or merely that it's a *pragmatic, developmental necessity*? Couldn't evolution or learning simply hardwire a *compulsion* to believe caregivers for survival, regardless of truth-tracking? How does necessity translate to justification?
      *   *Likely Answer/Follow-Up Key:* If she argues necessity *entails* justification because it's the only functional path to truth, follow up: **"But many adaptive traits aren't truth-tracking (e.g., certain biases). Couldn't the mechanism be reliable *enough* for survival without being optimally truth-conducive? If a child *must* believe their caregiver's 'The sabertooth is friendly' to avoid punishment, does that *justify* the belief, or just explain why they hold it?"**

  4.  **The Burden of Proof Reversal:**
      *   **Question:** Anti-reductionism shifts the burden of proof: trust is innocent until proven guilty. But doesn't the sheer prevalence of error, misinformation, and deception (online especially) create a *general* defeater? Doesn't this modern epistemic environment force us towards a *presumption of caution*, even if not full Humean reductionism?
      *   *Likely Follow-Up:* If she downplays the prevalence or emphasizes context, ask: **"Doesn't the *awareness* of widespread deception itself function as a kind of pervasive, low-level background defeater, constantly priming us for local monitoring (like Fricker's), rather than pure default trust?"**

  5.  **Justification vs. Entitlement:**
      *   **Question:** Reid and Coady often talk about *entitlement* to believe. Is this distinct from *justification*? Does entitlement mean it's *permissible* to believe without evidence, or that belief formed this way is *prima facie justified*? How does this distinction play out when a default-trust belief clashes with a belief based on personal perception?
      *   *Likely Follow-Up:* If she clarifies entitlement as prima facie justification, ask: **"In a clash between a testimony-based belief and a direct perceptual belief (e.g., someone says 'It's not raining' while you feel rain), why wouldn't the perceptual belief *always* override, unless testimony carries equal justificatory weight? Doesn't this suggest perception *is* more fundamental?"**

  6.  **The Role of Induction Within Anti-Reductionism:**
      *   **Question:** Anti-reductionism rejects needing induction *for each testimonial belief*. But doesn't the very ability to recognize *defeaters* rely heavily on induction? We learn that shifty eyes *correlate* with lying, that certain sources *tend* to be unreliable. Isn't induction smuggled in through the back door via the defeater system?
      *   *Likely Follow-Up:* If she concedes induction informs defeaters, press: **"Doesn't this create a regress? If my entitlement to trust testimony *default* is foundational, but my ability to *defeat* that trust relies on induction (itself justified how?), haven't I just moved the reductionist demand one step back?"**

  7.  **Social Epistemology & Power Dynamics:**
      *   **Question:** Critics like Miranda Fricker highlight how default trust can reinforce epistemic injustice, privileging dominant voices. How does anti-reductionism avoid passively sanctioning existing power structures? Should the "default" weight of testimony vary based on the speaker's social position or history of being heard?
      *   *Likely Follow-Up:* If she says defeaters handle this (e.g., recognizing marginalization), ask: **"Doesn't identifying a speaker *as* marginalized, and thus potentially less credible to others (a 'credibility deficit'), itself require inductive/social knowledge that *modifies* the default trust *before* content is even assessed? Doesn't this show the 'default' is socially mediated, not pure?"**

  8.  **The Limits of "Human Nature":**
      *   **Question:** The appeal to human nature/social fabric is central to Reid/Coady. But human nature also includes capacities for deception, manipulation, and tribalistic bias. Why should we consider our "natural" trust propensity as fundamentally truth-conducive rather than just socially adaptive, potentially at odds with individual truth-seeking?
      *   *Likely Follow-Up:* If she argues trust is *overall* reliable, ask: **"But 'overall reliability' sounds like an *inductive* justification! If anti-reductionism ultimately rests on the *de facto* reliability of testimony (established how?), how is it distinct from a sophisticated form of reductionism?"**

  9.  **The Scientist's Dilemma:**
      *   **Question:** Science relies heavily on testimony (journals, colleagues, textbooks). Yet, science also embodies a radical skepticism demanding evidence and replication. How does anti-reductionism reconcile these? Is the scientist entitled to default trust in a colleague's data report, or is science a special context demanding reductionism?
      *   *Likely Follow-Up:* If she distinguishes contexts, ask: **"Doesn't the scientific norm of demanding evidence *precisely* illustrate that in domains where truth is paramount and error costly, we instinctively *suspend* default trust? Doesn't this suggest default trust is a useful heuristic for daily life, but not the bedrock of *serious* justification?"**

  **Key Tactics Embedded:**

  *   **Concreteness:** Forcing specifics on defeaters and processes.
  *   **Distinctions:** Pressing on entitlement vs. justification, necessity vs. justification.
  *   **Internal Tension:** Highlighting potential contradictions (e.g., defeaters relying on reductionist elements).
  *   **Modern Context:** Leveraging the information environment and power dynamics.
  *   **Alternative Explanations:** Framing trust as adaptive compulsion, not necessarily truth-tracking.
  *   **Regress/Smuggling:** Showing how reductionist elements might be necessary within anti-reductionism.
  *   **Comparison:** Contrasting with Fricker's local view explicitly.

  These questions should push your interviewee beyond rehearsed answers and into deeper philosophical territory, making for a much more engaging and insightful column. Good luck!
