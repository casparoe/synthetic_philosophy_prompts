prompt: |-
  ok so for my dual-enrollment intro to philosophy class (it's through the community college but i take it at my actual high school, counts as my humanities credit) we just finished reading Plato's Meno and i'm stuck on this part near the very end. right before it, socrates gets meno to agree that a guy who actually knows the road to larissa and some other guy who's never been but happens to have a correct guess about which road it is would BOTH lead a traveler there just fine — so right opinion works just as good as knowledge in that specific case. then it goes into this statue thing that i don't really follow:

  "SOCRATES: You have heard of the wandering statues of Daedalus, kept in the temple, which will run away if they are not fastened, but if fastened, stay where they are?
  MENO: I have.
  SOCRATES: True opinions are the same way. While they stay with a person they are a fine thing and do nothing but good, but they won't stick around long — they run right out of a person's soul, so they're not worth all that much until they get fastened down by working out the reason why. And that fastening, my dear Meno, is recollection, like we already agreed. Once they're fastened they become knowledge, and they become lasting. And that's why knowledge is more valuable and more honorable than right opinion — because it's tied down by a chain.
  MENO: That does seem to be like the truth, Socrates."

  (that's typed from the packet my teacher gave us so it might be a slightly different translation than whatever version is online, sry if it's not word for word.) my question is kind of two things — first, can someone just walk me through what the statue thing is actually saying and how it connects back to the larissa example, like why does he suddenly start talking about statues running away when two seconds ago we were just talking about giving directions to a town? and second — me and my friend got into an actual argument about whether this passage actually explains why knowledge is BETTER than right opinion, or whether it only explains why knowledge is more reliable/longer lasting, which don't feel like the same thing to me. like, in the ONE specific case of walking to larissa, the lucky guesser did just as good a job as the guy who knew — so in that moment right opinion seems just as valuable as knowledge, so how does "it sticks around longer" get you all the way to "it's more valuable"? is this actually still an open question in philosophy or did socrates basically nail it here and i'm just not seeing how the pieces fit?
