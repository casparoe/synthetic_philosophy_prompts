  Hmm, the user clearly has substantial self-study under their belt - they're using precise terms like "Copenhagen/QBism move" and name-dropping Maudlin. This isn't a beginner. Their marine biology background suggests they think in systems and mechanisms, which might explain why the "dial" metaphor feels unsatisfactory. 

  The core tension seems to be: is rejecting realism a legitimate way to save locality, or is it cheating? They suspect the latter based on Maudlin's argument. Let me reconstruct that EPR-to-Bell logic step by step...

  First, EPR's starting point: perfect correlations (like entangled particles with opposite spins). If we assume locality (no faster-than-light influence), then the measurement outcome at one detector must have been predetermined when the particles separated. Otherwise you'd need spooky action at a distance to explain the instant correlation. 

  Ah, and that predetermination is essentially realism - the property existed before measurement. So EPR says: locality + perfect correlations → realism. Then Bell comes along and says realism + locality → experimentally testable inequality. When we test it... boom, violation. 

  So crucially, realism wasn't an independent assumption Bell added; it was forced by EPR's locality argument. That's why Maudlin says you can't "just" reject realism to save locality - because realism was locality's offspring in this scenario. 

  The user's intuition is sharp: calling it a "dodge" hits the nail on the head. Copenhagen/QBism avoid the contradiction by rejecting realism earlier - before EPR even gets started - by denying that unmeasured properties exist at all. But that's a much deeper philosophical sacrifice than just tweaking a dial. 

  I should emphasize how radical this is: giving up realism means particles don't have definite properties until measurement. For a biologist used to thinking about observable phenomena, this must feel like saying a fish doesn't have a color until you look at it! 

  Also worth noting: some interpretations (like Bohmian mechanics) keep realism but ditch locality instead. But that comes with its own baggage - non-lorentzian wavefunctions, etc. 

  The user's frustration with pop-sci accounts is justified. They often oversimplify Bell as "locality OR realism, pick one" without showing how EPR welded them together first. Maudlin's point exposes that flaw beautifully. 

