  Now, assessing the analogy. It's actually a common one in philosophy. Multiple realizability is key here—the same mental state can be realized by different physical states. That supports functionalism, where mental states are defined by their causal roles. The user's point about causation not being scarce aligns with this. Kim's response is that functional properties might still be causally inert if the real work is done by physical realizers. But functionalists argue that higher-level properties can be causally relevant through their organizational role.

