prompt: |-
  So I'm writing a piece on longtermism and effective altruism, and I've landed an interview with a philosopher who's a real bullet-biter on Pascal's Mugging -- a defender of what's sometimes called 'fanaticism' in decision theory, the idea that a genuine expected-value maximizer has to just accept the mugger's demand rather than patch the math with something like a bounded utility function or Bostrom's leverage penalty. Can you draft me 8 or so interview questions that go beyond her just restating the position? I want at least one that presses on whether the leverage penalty is really any less ad hoc than the fixes she rejects, one that turns her own reasoning back on longtermism itself (if a random guy's claim to affect 10^30 people should get discounted for exactly that reason, why doesnt longtermism's own claim about shaping the lives of trillions of future people get the same discount), one on what happens when two muggers show up making opposite demands, and one on how she'd tell apart a 'legit' small-probability-huge-stakes argument -- like the case for taking AI extinction risk seriously -- from an actual mugging. For each one, throw in a follow-up keyed to whatever dodge she's most likely to reach for.
