prompt: |-
  So a coworker and I fell down this whole rabbit hole last week after he linked me some old LessWrong posts on decision theory (we started out just arguing about whether our trading bot should ever "precommit" to a strategy ahead of time, and it kinda spiraled from there). I'd never heard of "updateless decision theory" (UDT, sometimes lumped together with "FDT") before, but the basic pitch seems to be: instead of just picking whatever action looks best given what you currently know — which is what both causal decision theory and evidential decision theory do — you're supposed to work out, from behind some kind of veil of ignorance over every way the world could've gone, which single overall policy (a full mapping from possible observations to actions) has the best expected value, and then actually execute that policy later even if it feels like a terrible deal once you're standing in one specific branch of reality.

  The example that really got us going is "counterfactual mugging." Omega (a perfect predictor, basically) flips a fair coin. If it lands tails, Omega would've handed you $10,000 — but only if Omega predicted you'd hand over $100 in the case it landed heads instead. The coin actually comes up heads, and Omega shows up asking for the $100. An agent that only reasons from where it currently stands (it's heads, the tails-world never happened, paying is pure loss with zero causal or evidential upside) just keeps its money. UDT says pay anyway, because "pay on heads" is part of the one overall policy with the highest expected value averaged across both branches before the coin was even flipped — even though this particular you will never see a cent of that $10k. My coworker thinks refusing to pay is "leaving utility on the table" and basically irrational, but it bugs me that UDT seems to assume some version of you already had commitment power over the you that's standing their in the heads-branch, who never personally agreed to anything. There's also this "commitment races" worry I saw floating around in the comments, where if everyone reasons updatelessly and races to lock in commitments as early and blindly as possible, that seems like it could go badly wrong, especially once you're talking about AI agents bargaining with each other instead of humans.

  Can you write me an essay that actually settles this, at least for cases like counterfactual mugging: should a rational agent be "updateless" rather than reasoning the standard causal/evidential way? Go through the strongest arguments on both sides (Newcomb's problem and Parfit's Hitchhiker are probably fair game too), but don't let yourself off the hook with a "reasonable people disagree" ending — actually defend a specific verdict, even if it's something narrower like "be updateless only under conditions X and Y."
reasoning: |-
  Okay, let me tackle this user's query. They're deep into decision theory, specifically updeless decision theory (UDT) vs. standard causal/evidential approaches. The core example is counterfactual mugging, where UDT says to pay $100 in the heads scenario to secure $10k in the tails scenario, even though you're in heads and won't benefit. The user's coworker thinks refusing is irrational, but the user is bothered by UDT's assumption of commitment power over future selves.

  First, I need to unpack the key arguments for both sides. For UDT, it avoids self-sabotage in cases like counterfactual mugging and Newcomb's problem. By committing to a policy upfront, you ensure optimal outcomes across all possible branches. The precommitment argument is strong here—choosing the best strategy before knowing your position.

  But the user's concern about commitment is valid. In reality, we're temporal beings. The "you" in the heads scenario didn't agree to the policy; they're forced to comply. This feels like a violation of autonomy. Also, commitment races could be a real issue if multiple UDT agents try to commit first, leading to suboptimal outcomes.

  Looking at Parfit's Hitchhiker, UDT would have the driver pay, ensuring survival. CDT would defect, leading to death. This shows UDT's advantage in coordination problems. However, in scenarios like the Prisoner's Dilemma with transparent agents, mutual defection might occur if both commit updatelessly but can't trust each other.

  The user wants a definitive verdict, not a cop-out. So I need to weigh the strengths and weaknesses. UDT excels in predictable, high-stakes scenarios with perfect information (like Omega problems). But in competitive or dynamic environments, its rigidity and commitment issues pose risks. 

  The solution might be conditional UDT: use it when you can reliably bind future actions and trust the other party's predictability. Otherwise, default to causal reasoning. This balances optimality in designed tests with practicality in real-world messiness. Emphasize that UDT is a tool, not a universal rule, applicable under specific conditions like precommitment mechanisms and known incentives.
answer: |-
  ## The Updateless Imperative: Why Rationality Demands We Sometimes Ignore Our Evidence

  Your descent into the UDT rabbit hole is a familiar one – it starts with a practical question (precommitment in trading bots) and rapidly collapses into foundational questions about agency, identity, and rationality itself. The core tension is stark: does true rationality lie in always choosing the action that seems best *right now, from this vantage point* (Causal Decision Theory - CDT, Evidential Decision Theory - EDT), or in binding your future self to a pre-selected *policy* designed to maximize expected value *before you knew where you'd end up* (Updateless Decision Theory - UDT/FDT)? Counterfactual Mugging (CM), Newcomb's Problem (NP), and Parfit's Hitchhiker (PH) are the crucibles where these theories melt and reveal their substance. Let's forge an answer.

  **The Allure of the Update: CDT/EDT and Their Fatal Flaws**

  CDT (focusing only on causal consequences) and EDT (focusing on evidence and correlations) are intuitive. They tell the agent: "Look at the world as you find it. Weigh the causal impact or evidential implications of your *current* actions. Choose the one that maximizes expected utility *now*."

  *   **Counterfactual Mugging (Heads Branch):** "I see Heads. Omega is asking for $100. Paying causes me to lose $100. Not paying causes me to keep $100. Where's the benefit? The $10k in the Tails branch is causally disconnected from me now and evidentially irrelevant (since the coin flip already happened). Keep the $100." (Result: Lose out on the *expected* $5000 gain from the pre-flip perspective).
  *   **Newcomb's Problem (One-Boxing vs. Two-Boxing):** CDT reasons: "Omega is gone. Box B is either full ($1M) or empty. Taking Box A nets me $1000 regardless. Taking both always gets me $1000 more than taking just Box B. I take both boxes." If Omega predicted this, Box B is empty. CDT gets $1000, missing out on $1M. EDT sees taking only Box B as *evidence* Omega predicted that, so one-boxes and gets $1M. EDT *works* here, but struggles elsewhere.
  *   **Parfit's Hitchhiker:** Stranded in the desert, a driver rescues you only if you promise $1000 upon reaching town. Once in town: CDT/EDT (if they ignore the promise) reason: "Refusing causes me to keep $1000. Paying causes me to lose $1000. The driver is gone; paying doesn't causally affect my rescue (it already happened), and refusing isn't evidence I *wouldn't* have been rescued (I *was* rescued). Keep the money." (Result: Driver leaves you to die next time, or worse, this time if it was a test).

  **The flaw is systematic:** CDT/EDT agents are **myopic self-saboteurs**. They fail to recognize that their *current* decision is part of a *pattern* that was predictable *in advance*. By optimizing only for their local branch, they destroy value that existed in the *expectation* before the uncertainty was resolved. They leave utility on the table not because of bad luck, but because their decision theory blinds them to the broader strategic context. They are vulnerable to agents like Omega who can exploit their predictable, branch-local selfishness.

  **The Updateless Gambit: UDT/FDT as the Master Policy**

  UDT/FDT responds: "Rationality isn't about optimizing *from* a position; it's about choosing, *before you know your position*, the single *policy* (function from observations to actions) that has the highest *overall* expected utility across *all* possible branches of reality you might find yourself in. Once chosen, you *execute* the policy, even in branches where it feels locally suboptimal."

  *   **Counterfactual Mugging:** Before the flip, you evaluate policies.
      *   Policy A: "Refuse if Heads." Expected Value (EV): (0.5 * $0) + (0.5 * $10,000) = $5000 *only if Omega predicted refusal* (which it does, so $0).
      *   Policy B: "Pay if Heads." EV: (0.5 * -$100) + (0.5 * $10,000) = $4950 *if Omega predicted payment* (which it does).
      Policy B wins. In the Heads branch, you pay the $100. It feels like a loss, but it was the indispensable price of securing the $10k in the Tails branch. Refusing *in this branch* would retroactively destroy the value in the *other* branch.
  *   **Newcomb's Problem:** UDT/FDT evaluates policies: "Take only Box B" vs. "Take Both Boxes." If Omega is a perfect predictor, it knows which policy you chose. "Take only Box B" leads to $1M. "Take Both Boxes" leads to $1000. "Take only Box B" is the dominant policy. You one-box.
  *   **Parfit's Hitchhiker:** Policies: "Pay if rescued" vs. "Refuse if rescued." "Pay if rescued" leads to rescue + paying $1000 = net survival minus $1000. "Refuse if rescued" leads to no rescue = death. "Pay if rescued" is vastly superior. In town, you pay, even though *locally* refusing seems better. Paying *upholds the pattern* that gets you rescued.

  **The Core Arguments for UDT/FDT:**

  1.  **Avoiding Self-Sabotage:** UDT/FDT directly solves the self-sabotage inherent in CDT/EDT in NP, PH, and CM. It ensures you don't act in ways that, while locally optimal, undermine the very conditions that could have benefited you (or a version of you) elsewhere. It captures the *acausal* benefit of coordination with your past/future/counterfactual selves and predictors.
  2.  **Maximizing Pre-Event Expectation:** Rationality should care about the *best possible deal you could have struck before the universe unfolded*. UDT/FDT achieves this. CDT/EDT agents get a worse deal *by their own pre-flip standards*. The $4950 EV of paying in CM is objectively better than the $0 EV of refusing, *even for the agent in the Heads branch*, when evaluated fairly from the prior perspective they all shared.
  3.  **Precommitment is Rational:** The "veil of ignorance" argument is powerful. Before knowing your position, you would *rationally* choose the policy maximizing overall EV. Refusing to follow through in a specific branch is reneging on the optimal precommitment *you* (or a sufficiently similar decision process) made. The "commitment power" isn't assumed; **it's identified as the rational course of action.** Temporal inconsistency (changing your mind when your position changes) is the *irrational* flaw UDT fixes.

  **Addressing Your Concerns:**

  *   **"The Current Me Never Agreed!":** This confuses the *temporal stage* with the *decision-making entity*. The rational agent is the *persistent decision process* that exists across time and possibilities. The "you" in Heads *is* part of that entity. Binding that stage to the optimal precommitment *is* rational for the entity as a whole. Refusing is like your left hand refusing to pass a tool to your right hand because "I never agreed to help *you*" – it's a failure of the system to act cohesively towards its goal.
  *   **Commitment Races:** This is a serious concern, primarily in multi-agent strategic interactions (like AI bargaining). If agents rush to bind themselves to updateless policies without considering others' likely responses, they can indeed lock into disastrous equilibria (e.g., mutual defection in dilemmas where conditional cooperation was possible). **However, this is not a flaw in UDT *per se*, but a challenge in multi-agent UDT *coordination*.** UDT doesn't mandate blind, early commitment. A sophisticated UDT agent:
      *   Considers the *game-theoretic* context.
      *   Models other agents (are they UDT? CDT? Can they see my commitment?).
      *   Chooses a policy that is robust or best-responding to *their likely policies*.
      *   Might use commitment *strategically* only when beneficial and credible.
      *   Commitment races highlight the need for *reflective equilibrium* in multi-agent UDT, not its abandonment. UDT provides the *framework* for reasoning about optimal commitments *within* the strategic landscape.

  **The Verdict: When Updatelessness is Non-Negotiable**

  After weighing the arguments and the failures of alternatives, the conclusion is clear: **A rational agent *must* be updateless in scenarios involving perfect predictors (Omega), acausal dependencies, or situations where their actions form a predictable pattern across branches that can be exploited or leveraged.**

  *   **In Counterfactual Mugging:** Paying the $100 is rationally obligatory. Refusing isn't just leaving utility on the table; it's actively destroying $5000 of *expected value you could have secured* by choosing the right policy. The "loss" in the Heads branch is the necessary cost of the *overall* optimal strategy, a cost you implicitly accepted when you (or your decision algorithm) endorsed the policy maximizing pre-flip EV.
  *   **In Newcomb's Problem:** One-boxing is the only rational choice. Two-boxing is transparently foolish once you recognize Omega's prediction links your *policy* to the contents of Box B *acausally*.
  *   **In Parfit's Hitchhiker:** Paying is rationally required. It's the price of the survival strategy you needed before knowing if you'd be rescued.

  **The Caveat: Scope and Application**

  UDT isn't a panacea for *all* decisions:

  1.  **Computational Intractability:** Finding the optimal global policy for complex real-world situations is often impossible. We must approximate.
  2.  **Imperfect Predictors & Noisy Worlds:** UDT shines with perfect information and predictors (like Omega). In messy reality with unreliable signals and unpredictable agents, robust causal reasoning (often resembling sophisticated CDT) becomes necessary as a fallback or approximation. UDT tells you *what to aim for*; practical implementation requires heuristics.
  3.  **Multi-Agent Complexity:** As noted, commitment races and bargaining require careful game-theoretic application of UDT principles, not blind commitment. The optimal policy must account for other agents' reasoning.

  **Conclusion: The Updateless Core**

  While practical rationality in a noisy world demands flexibility and approximation, the *logical core* of rational choice in structured dilemmas involving prediction, acausality, and cross-branch coordination **demands updatelessness**. CDT and EDT are fundamentally flawed because they are blind to the value that exists in the *expectation* and the *pattern* of their actions. They are vulnerable to exploitation and systematically achieve lower pre-event expected value.

  Refusing to pay in Counterfactual Mugging isn't just a different choice; it's a failure of rationality. It prioritizes the myopic perspective of a single temporal stage over the welfare of the decision-making entity as a whole across possible worlds. UDT/FDT provides the framework for agents to act as unified, far-sighted entities, securing the best possible deal from the universe *before* it reveals their specific lot. Your coworker is right: leaving that utility on the table is irrational. The rational agent binds itself to the policy it would have chosen behind the veil of ignorance, recognizing that the occasional local "loss" (like $100 on Heads) is the indispensable foundation for global gain ($10,000 on Tails). That is the price and the power of truly consistent rationality.
