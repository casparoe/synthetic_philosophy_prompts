  Post-Dobbs, does this get harder to defend? Yes and no. Harder because integralists can point to abortion bans as proof that comprehensive doctrines *can* dominate politically. But Rawlsians might argue this backlash *validates* his fear of oppression: Without public reason's constraints, majorities impose sectarian views, destabilizing society. The chaotic legal patchwork post-Dobbs? Exactly the "burdens of judgment" chaos overlapping consensus tries to manage.

