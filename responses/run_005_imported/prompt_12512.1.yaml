  Ending with falsifiability is perfect - makes her define what evidence could disprove her theory. That's philosophy 101 but often glossed over in defenses. 

  This isn't just an interview - it's a sibling proving they finally understand her work well enough to challenge it. The questions should respect that depth while staying accessible to 200 non-expert listeners. Tone is key: rigorous but not hostile, with follow-ups that force clarity without being gotchas. 

