answer: |-
  Here are 10 interview questions designed to push the "resolute choice" view, with targeted follow-ups anticipating likely responses. Each question isolates a core tension, forces clarification, or targets a potential weakness, including your specific requests.

  ### Core Questions & Follow-Ups

  1.  **The Bratman Boundary:** "You position 'resolute choice' as distinct from both sophisticated and naive choice, *and* from Bratman's planning theory which emphasizes the inherent value of stable intentions for coordinating over time. Where exactly does Bratman stop and 'resolute choice' start doing unique work? Is resolute choice *more* than just a particularly strong endorsement of the general Bratmanian policy?"
      *   *Likely Answer/Follow-Up Target:* If she emphasizes commitment strength/purity, or overcoming *specific* future-incentive problems.
      *   **Follow-Up:** "But doesn't Bratman *also* argue that stability is rational *because* it solves coordination problems, even when a particular intention becomes individually costly? How does resolving the Toxin Puzzle *require* something beyond recognizing that the *policy* of stable intentions is generally beneficial? Are you saying Bratmanians *can't* resolve Toxin?"

  2.  **The Mechanism Mystery:** "Resolute choice involves forming a genuine intention to perform the costly future action *knowing* that when the time comes, you'll have no reason to do it and every reason not to. *How* does this intention actually persist or become effective at the later time? Is it sheer willpower dressed in philosophical clothing, a unique mental state, or something else?"
      *   *Likely Answer/Follow-Up Target:* If she appeals to identity/character ("being the kind of person") or a holistic perspective.
      *   **Follow-Up:** "If it's about 'being the kind of person,' isn't the rational thing at T2 (when action is due) *still* to recognize that drinking the toxin (or paying $600) *now* serves no purpose in building that character? The character-building investment was at T1 (intention formation). At T2, the cost is pure loss. Doesn't the sophisticated chooser win *at T2*?"

  3.  **Nuclear Deterrence - Biting the Bullet?:** "Let's apply this to the nuclear deterrence case you mentioned. A country credibly threatens massive retaliation to deter attack. If attacked, retaliation is now pointless (it won't undo damage) and catastrophically costly (escalation). The resolute chooser formed the intention to retaliate *to make deterrence credible*. Does resolute choice dictate that they *must* retaliate after being attacked, precisely *because* that's what they intended when it was strategically useful?"
      *   *Likely Answer/Follow-Up Target:* She might try to distinguish cases or appeal to consequences.
      *   **Follow-Up:** "If you say 'No, they shouldn't retaliate because the consequences are too dire,' haven't you just endorsed sophisticated choice for high-stakes scenarios? If you say 'Yes, they must retaliate to maintain future credibility,' are you comfortable endorsing the rationality of potentially world-ending actions based solely on a past intention?"

  4.  **The Venmo Voice Memo - External Enforcement?:** "In my bet, I made a *recorded promise* to my sister. You've argued the puzzle requires pure intention without external enforcement. Did the voice memo fundamentally change the situation? Did I avoid the 'true' toxin dilemma because the potential social shame or obligation created by the recording acted as an *external* cost, making payment at T2 less 'pointless' than drinking Kavka's toxin would be?"
      *   *Likely Answer/Follow-Up Target:* She might downplay the memo or argue intention was still key.
      *   **Follow-Up:** "But Kavka's billionaire uses a *mind-reader* to verify intention precisely to *avoid* any external enforcement mechanism – the *only* reason to drink is the past intention itself. If my recorded promise introduced *any* potential social/relational cost to *not* paying at T2, doesn't that mean my case wasn't a pure test of resolute intention? It smuggled in a small external reason."

  5.  **The Benefits of Being 'Resolute':** "You often say being resolute is about being 'the kind of person your future self and others can trust.' But the sophisticated chooser can *also* build trust by reliably following through on intentions *when it remains in their interest* at the time of action. What *unique, demonstrable benefit* does the resolute chooser gain that the sophisticated chooser, who reliably acts in their best interest at each moment, cannot achieve?"
      *   *Likely Answer/Follow-Up Target:* Claiming resolute choosers can make credible commitments the sophisticated cannot (like Toxin deals).
      *   **Follow-Up:** "But if sophisticated choosers are known to be sophisticated, wouldn't others simply *not offer them* Toxin-type deals? They'd only get deals where the T2 action *is* in their interest. Isn't the resolute chooser just opening themselves up to *exploitation* by binding themselves to harmful actions, rather than gaining a unique benefit?"

  6.  **The 'Why Bother?' Challenge:** "If the resolute intention genuinely persists to T2 and compels the action despite its pointlessness, what *is* the actual psychological or rational force at work at T2? If it's not the original reason (the prize is gone), and it's not a *new* reason (the action is still costly and pointless), *why* does the agent do it? Isn't 'because I intended to' just a label for irrational persistence?"
      *   *Likely Answer/Follow-Up Target:* Appeal to the rational structure of planning or identity.
      *   **Follow-Up:** "But isn't this just defining 'rationality' in a way that *includes* acting against your current interests because of a past mental state? How is this different from saying 'It's rational to be irrational in this specific way'? Does 'resolute choice' ultimately require rejecting the idea that rationality is primarily about maximizing expected utility *at the time of action*?"

  7.  **The Slippery Slope of Commitment:** "Resolute choice seems to valorize sticking to commitments *because* they are commitments, even when circumstances change drastically. Where do you draw the line? If I resolutely intend to meet you for coffee, but on the way I see a child drowning, is it irrational to break that commitment to save the child? Does the resolute view risk making us slaves to past decisions?"
      *   *Likely Answer/Follow-Up Target:* She'll likely allow for significant new information/overriding reasons.
      *   **Follow-Up:** "But doesn't admitting that *some* new information (like a drowning child) can rationally override a resolute intention open the door for the sophisticated chooser? They argue that *realizing the action is now pointless and costly* is precisely the kind of significant new information that *should* override the intention. How is your line not arbitrary?"

  8.  **The Evidence Question (Falsifiability):** "What would actually count as evidence that the sophisticated choice approach is correct and resolute choice doesn't capture a genuine, distinct form of rationality? If we consistently observe that people *fail* to follow through on purely resolute intentions (like drinking the toxin when the prize is secure) when there are no external stakes, does that undermine the view, or just show humans aren't perfectly resolute?"
      *   *Likely Answer/Follow-Up Target:* She might argue failure proves weakness, not incorrectness, or appeal to thought experiments.
      *   **Follow-Up:** "If empirical failure doesn't count against it, and thought experiments like Toxin are the primary evidence *for* it, isn't resolute choice in danger of being unfalsifiable – defined in a way that real-world evidence can't touch it? How do we *test* this view against sophisticated choice in a meaningful way?"

  ### Why this structure works

  *   **Targets Core Claims:** Questions 1, 2, and 6 directly challenge the mechanism and uniqueness of "resolute choice."
  *   **Forces Real-World Engagement:** Questions 3 (nukes) and 7 (slippery slope) push the view into high-stakes and practical domains, demanding clear answers.
  *   **Personalizes the Puzzle:** Question 4 (your Venmo bet) uses a concrete example she can't easily deflect and tests the purity of the thought experiment.
  *   **Highlights Potential Weaknesses:** Question 5 challenges the purported benefits, while Question 8 directly addresses falsifiability.
  *   **Anticipates Deflections:** Follow-ups are designed to cut off her standard party lines ("being trustworthy," changing the subject) and force deeper engagement.
  *   **Maintains Rigor & Accessibility:** The questions are philosophically sharp but phrased clearly enough for a podcast audience familiar with the basics.

  **Delivery Tip:** Frame these as genuine curiosity, not an attack. Start with, "Listeners loved your initial explanation, but some wrote in asking..." or "I was re-reading your chapter draft and got stuck on this point..." This makes the pushback feel collaborative and rooted in engaging with her work. Good luck with the interview – it sounds fascinating!
