  - the epistemic access problem: you can never actually confirm you're being accurately simulated/modeled by your counterpart rather than some strawman version of yourself
  - the "who's your actual trading partner" problem: out of the huge space of possible agents you could be logically correlated with, what picks out the specific one(s) you're supposedly trading with
