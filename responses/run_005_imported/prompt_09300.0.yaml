  - the trade-vs-extortion line getting blurry once you allow this kind of acausal influence at all, even though people treat them as cleanly seperate cases
  - cross-agent value translation: knowing what the other side even wants well enough to trade for it in the first place
  - the "it's just causal decision theory in a trenchcoat" objection, i.e. skepticism that the acausal framing adds anything real over ordinary reasoning about correlated agents

