  - Value translation (5): S-tier. Fundamental to trade; without it, no mutual benefit can occur.

  - CDT objection (6): C-tier. It's a philosophical debate; if UDT/FDT are accepted, it doesn't affect the trade concept.

  But let's see if any should be S besides 1 and 5.

