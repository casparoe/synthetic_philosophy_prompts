  2. "Who's your actual trading partner" problem: Out of many possible agents, how do you pick who you're trading with?

  3. Bounded computation / logical uncertainty: Can't run the other's full decision procedure to completion.

  4. Trade vs. extortion line blurring: Acausal influence might make it hard to distinguish trade from extortion.

  5. Cross-agent value translation: Knowing what the other side wants well enough to trade.

  6. "It's just CDT in a trenchcoat" objection: Skepticism that acausal framing adds anything over ordinary correlated agents reasoning.

  I should reason through each one step by step, then assign tiers.

  Starting with epistemic access (1): In acausal trade, you rely on the idea that another agent in a different universe or simulation is modeling you accurately. But you can't verify this; they might be simulating a simplified or incorrect version of you. This seems critical because if the simulation is wrong, the trade might not happen or could be exploitative. For example, if they think you're more cooperative than you are, they might not uphold their end. This could undermine the whole mechanism, making it unreliable. I think this is a high-tier problem, possibly S.

  Next, "who's your actual trading partner" (2): There are countless possible agents you could be logically correlated with. How do you select which one to trade with? In practice, agents might focus on similar or symmetric agents, but the space is vast. This could lead to inefficiency or miscoordination. However, decision theories like UDT or FDT might handle this by considering all possible correlations, but it's computationally intensive. Still, it might not be fatal; agents can use heuristics. I see this as a serious issue but maybe not S-tier. Perhaps A or B.

  Bounded computation / logical uncertainty (3): Real agents can't run infinite computations; they have limited resources. So, when trying to simulate another agent, they might approximate, leading to errors. Logical uncertainty means you don't know for sure what the other agent would do. This is a practical limitation that affects all decision-making, not just acausal trade. But for acausal trade, it might amplify other problems. Since it's a general issue in AI and decision theory, it might not be specific to acausal trade, but it could make it infeasible. I'd put this in B or C, as it's a challenge but not unique.

  Trade vs. extortion line blurring (4): In causal decision theory, trade is mutual benefit, while extortion is coercion. But in acausal settings, since there's no direct causal link, the distinction might blur. For instance, an agent might threaten to defect if you don't cooperate, but since it's acausal, it's not clear if it's a threat or part of the trade. This could lead to exploitation where one side benefits more, or it might prevent genuine trade from occurring. If agents can't distinguish, they might avoid acausal interactions altogether. This seems like a significant issue for the ethics and stability of acausal trade. I think this could be A or S-tier because it challenges the moral foundation.

  Cross-agent value translation (5): To trade, you need to know what the other values and how to provide it. But in acausal settings, you might not share common ground or understand their utility function. For example, if you're in different universes, their "resources" might not map to yours. This is similar to problems in value alignment in AI. Without understanding values, trade can't occur or might be misdirected. This feels fundamental; if you can't translate values, acausal trade is impossible. So, probably high-tier, like S or A.

  "It's just CDT in a trenchcoat" (6): The objection is that acausal decision theories (UDT/FDT) don't add anything new; you can achieve similar results with CDT by considering correlated agents. But proponents argue that CDT fails in certain thought experiments like Newcomb's problem, while UDT/FDT handle them better. If this objection holds, then acausal trade might not be a distinct concept. However, many decision theorists believe UDT/FDT are genuine advances. So, this might not be a problem for acausal trade per se but a meta-issue. If it's true, it could undermine the need for acausal framing, but since acausal trade relies on these theories, if they are valid, this objection might not stick. I'd say this is less damaging, perhaps C-tier, as it's more about the decision theory foundation than the trade mechanism itself.

  Now, to assign tiers:

  - S: Fatal issues.

  I think epistemic access (1) and cross-agent value translation (5) are candidates for S because they directly prevent the core mechanism from working.

  Epistemic access: Without accurate simulation, the trade fails.

