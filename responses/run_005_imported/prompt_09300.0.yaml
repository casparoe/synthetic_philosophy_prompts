  ok so my friend and I got into a whole argument last night about acausal trade and neither of us really budged after like two hours. he thinks once you accept something like updateless/functional decision theory the whole thing basically goes through and most objections are just people not having thought it through carefully; i think a handful of the objections are genuinely serious and don't just dissolve once you switch decision theories. figured i'd get a third opinion.

