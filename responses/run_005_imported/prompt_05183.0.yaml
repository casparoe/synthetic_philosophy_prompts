answer: |-
  Here's a counterargument against R. Jay Wallace's account, defending the position that hypocrisy itself is insufficient to undermine standing to blame, and that Wallace's "denial of equal standing" is either reducible to more fundamental problems (complicity or insincerity) or misdiagnoses the issue:

  1.  **Core Thesis:** Hypocrisy (understood as inconsistency between one's words/deeds) is never *by itself* a freestanding defeater of standing to blame. Its apparent power arises entirely from two independent factors:
      *   **Complicity:** The hypocrite is actively *participating* in the very wrong they condemn, undermining their position as a legitimate critic.
      *   **Insincerity:** The hypocrite demonstrates a lack of genuine commitment to the norm they invoke, suggesting their blame is performative or manipulative rather than a sincere moral appeal.
      Wallace's "denial of equal standing" is not a distinct mechanism but a *consequence* or *symptom* of these underlying problems.

  2.  **Where Wallace's Equal Standing Argument Goes Wrong:**
      Wallace treats hypocrisy as a unique violation of a presupposition of moral address – the reciprocal recognition of equal moral standing. He argues that by exempting oneself from the norm one imposes, the hypocrite implicitly denies this equality. However, this analysis fails because:
      *   **Mere Inconsistency Doesn't Deny Equality:** Consider an inconsistent blamer who *genuinely believes* the norm applies equally to all (including themselves), but suffers from weakness of will or situational failure. Their inconsistency doesn't stem from a belief in their *exemption* or superiority. They might feel deep shame and acknowledge their failure *under the same standard*. Their blame isn't predicated on denying the other's standing; it's predicated on the shared standard they both (in the blamer's view) violate. Their standing to blame stems from their *sincere commitment* to the norm, even if flawed in practice. Wallace conflates *acting inconsistently* with *denying the norm's applicability to oneself*.
      *   **"Denial of Equal Standing" Reduces to Complicity or Insincerity:** The *only* way hypocrisy *could* imply a denial of equal standing is if the inconsistency reveals either:
          *   **Complicity:** The blamer *knowingly* participates in the wrong *while* condemning it. This active participation makes them part of the problem they decry. Their blame isn't disqualified because they deny *equality*; it's disqualified because they are *simultaneously an offender* against the very norm. Their position as a "judge" is compromised by being an active "defendant." The problem is their *direct involvement in the wrongdoing*, not an abstract denial of equality. (e.g., The politician condemning adultery while committing it is *complicit* in the erosion of marital trust they criticize).
          *   **Insincerity:** The blamer doesn't *actually* endorse the norm they invoke. Their "blame" is a performance – perhaps to manipulate, gain advantage, or signal virtue. Their inconsistency exposes this lack of genuine belief. Here, the problem isn't denying the *other's* standing, but demonstrating that *they themselves* lack the sincere commitment to the norm that would give their moral address its legitimate force. Their "blame" isn't authentic moral criticism; it's a rhetorical weapon wielded without conviction. (e.g., The activist privately indulging in luxuries while condemning others' carbon footprints *might* reveal they don't truly prioritize climate action over personal comfort, making their public blame seem hollow and manipulative).
      *   **The Redundancy of "Denial of Equal Standing":** If the hypocrite is *not* complicit (they stopped the wrongdoing, or their past wrong is irrelevant to the current case) and *not* insincere (they genuinely believe in the norm and their inconsistency is akratic weakness), then what work does "denial of equal standing" do? In this case, their blame, while potentially weakened by their inconsistency, doesn't *presuppose* or *express* a denial of the other's moral equality. They are appealing to a shared standard they themselves struggle with. Their standing isn't *undermined*; their inconsistency might make them *less persuasive* or *open them to criticism*, but the validity of their *point* about the other's wrongdoing remains intact. Wallace's mechanism only seems necessary if we already assume complicity or insincerity.

  3.  **Reinterpreting Wallace's Cases:**
      The apparent force of Wallace's examples disappears when analyzed through complicity and insincerity:
      *   **The Adulterous Politician:** The problem isn't hypocrisy *qua* inconsistency denying equal standing. The problem is **complicity**: They are *actively engaging* in the behavior (adultery) that they claim undermines family values. They are *directly contributing* to the harm they decry. Their blame is disqualified because they are *part of the wrongdoing*, not because of an abstract denial of equality. Alternatively, if their adultery is exposed *after* they stopped and sincerely reformed, their *past* inconsistency might make them a less *effective* critic, but their standing to condemn *current* adultery isn't fundamentally undermined if their commitment to the norm is now sincere.
      *   **The High-Emissions Activist:** The problem isn't inconsistency denying equal standing. The problem is potential **insincerity**: Their personal choices might reveal that they don't *truly* believe individual carbon footprints matter as much as their rhetoric suggests, or that they prioritize personal comfort over the cause. This makes their blame seem inauthentic and manipulative. If, however, they genuinely believe in the cause (e.g., they are addicted to air travel due to family obligations but actively lobby for systemic change to make alternatives viable), their inconsistency (while opening them to criticism) doesn't negate the validity of their critique of *systemic* inaction or *others'* avoidable excesses. Their standing stems from their sincere commitment and arguments, not personal perfection.

  4.  **The Danger of Wallace's View:**
      Treating hypocrisy as a freestanding standing-defeater independent of complicity or insincerity risks:
      *   **Ad Hominem Validation:** It gives a philosophical veneer to dismissing valid criticism solely based on the critic's flaws ("Oh, you're a hypocrite, so your point is invalid").
      *   **Moral Quietism:** It discourages necessary moral criticism from imperfect individuals, allowing genuine wrongs to go unchallenged because the most vocal critics aren't saints.
      *   **Misplaced Focus:** It shifts attention from the *substance of the criticism* and the *wrongdoing itself* to the character of the critic.

  **Conclusion:**

  Wallace correctly identifies that hypocritical blame often *feels* illegitimate, but he misattributes the cause. The disqualifying force doesn't stem from hypocrisy *itself* creating a unique denial of equal standing. Instead, it arises because hypocrisy frequently *reveals* one of two more fundamental defects: **complicity** (the blamer is actively perpetrating the same wrong, undermining their role as critic) or **insincerity** (the blamer lacks genuine commitment to the norm, making their blame inauthentic). When hypocrisy exists *without* complicity or insincerity, it may render the blamer less persuasive or open to counter-critique, but it does not inherently undermine their *standing* to make a valid moral criticism based on a sincerely held, mutually applicable norm. Wallace's "denial of equal standing" is either a consequence of these underlying problems or an overreach that grants inconsistency an unwarranted power to silence substantive moral discourse.
