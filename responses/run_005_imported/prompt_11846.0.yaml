  Starting with the dark-room problem. It questions why organisms don't just seek predictable environments. Friston counters that agents must maintain homeostasis and thus actively engage with the environment. But if agents are defined by their expected states, it feels circular. This touches on agency and goals—core to FEP's explanatory power. If the principle can't explain exploration without presupposing goals, that's a major flaw. So this might be S-tier.

  Next, unfalsifiability. Critics say any stable system can be retrofitted into minimizing free energy. Proponents argue FEP makes testable predictions, like neural coding schemes. But if it's merely descriptive, not predictive, it's not falsifiable. This is a fundamental issue in philosophy of science—Popper's demarcation. If FEP can't be falsified, it's not scientific. That's potentially fatal, so S-tier alongside the dark-room issue.

  Markov blanket boundary problem. The mathematical concept might not map to physical boundaries. Using it as the "self" could be reification. Fristonians say it's about statistical dependencies, but the leap to physical boundaries is problematic. This is a conceptual overreach, serious but maybe not fatal. A-tier because it questions the biological relevance without invalidating the entire framework.

  "Old wine, new bottles" charge. Does FEP just rebrand existing ideas? While it unifies concepts like Bayesian inference and homeostasis under one formalism, critics say it adds no new empirical content. However, unification itself has value. If FEP offers novel predictions, it's substantive. But if it's just repackaging, it's less damaging. B-tier—it might not be revolutionary but doesn't break the theory.

  Scope problem. FEP applies to any non-equilibrium system, like thermostats. But cognitive systems are special. Friston argues it's a universal principle; the difference is in implementation. Still, if it doesn't explain cognition specifically, it might be too broad. This is a limitation but not fatal—C-tier. It's about applicability, not internal validity.

