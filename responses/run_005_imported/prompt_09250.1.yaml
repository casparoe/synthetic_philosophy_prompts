prompt: |-
  So I somehow landed a guest for my little history-of-philosophy podcast who's spent her career defending Al-Ghazali's occasionalism -- not just explaining it, actually defending it as basically correct. You know the fire-and-cotton bit from the Tahafut (17th discussion, i think?) -- fire doesn't burn the cotton, God burns the cotton, and the only reason it happens the same way every time is God's habit rather than any necessity sitting in the fire itself. I've read enough Hume-and-causation posts from this corner of the internet to recognize the "no necessary connection, just constant conjunction" move on sight (feels like the debate this whole blogosphere would be having if Bayes nets came with a theology requirement), so I really don't want the episode to be her restating the fire-cotton example for the tenth time and calling it a day. Can you draft me 8-10 interview questions that push past that? I want at least one that forces her to say what "God's habit" is doing that Hume's brute regularity doesn't -- is the theology actually explaining why nature is so orderly, or just relabeling the same unexplained fact -- one built on Ibn Rushd's (Averroes') objection that if nothing has a stable nature, science and even ordinary practical reasoning become impossible, and one on the miracle problem: if the everyday order is just habit, whats supposed to distinguish an actual miracle from God quietly deciding to change the habit. For each one, add a follow-up keyed to whatever answer she's most likely to give -- I don't want her to have a clean escape hatch on any of these.
