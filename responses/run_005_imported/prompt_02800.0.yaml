prompt: |-
  Okay weird one but it's been living in my head rent-free. My agent talked me into blurbing a friend-of-a-friend's debut novel, and because of a deadline crunch I only actually read half of it (first six chapters, don't judge). What I did read was genuinely great though, better than most debuts I've finished cover to cover, and everyone in publishing knows blurbing off partial reads is basically an open secret anyway. My publicist wants the blurb to say "the best debut of the year, couldn't put it down," and its entirely possible that's just true, maybe the back half holds up and the whole book really is that good, I'll find out when I read the rest for the launch. But it still feels weird to assert something that confidently before I actually know, even if it turns out accurate later. Does that only become okay retroactively once its confirmed, or was it fine all along as long as it checks out in the end? Am I overthinking a blurb, or is there something actually inconsistent about confidently asserting stuff you don't yet know, even when it happens to be true?
