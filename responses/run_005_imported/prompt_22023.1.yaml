  That's a brilliantly framed question, and you've pinpointed the exact tension that makes Turing's ESP passage so perplexing and fascinating. You're right – it *is* bizarre in context. Let's break down how Turing might have reacted to the exposure of Soal's fraud:

  1.  **Initial Reaction: Statistical Fury & Professional Embarrassment:**
      *   **The Core Offense:** Turing's fundamental identity was that of a rigorous mathematician and logician. The deliberate manipulation of data – especially data presented as statistically significant – would have struck him as a profound betrayal of scientific integrity, the very foundation of his work.
      *   **Wartime Parallels:** At Bletchley Park, statistical rigor wasn't academic; it was life-or-death. Faking data would have been unthinkable, tantamount to treason. Soal's fraud would have felt like a desecration of the statistical methods Turing held sacred. His anger would likely have been intense and deeply *professional* – anger at the corruption of the tool he relied on.
      *   **Embarrassment:** Yes, he would have felt embarrassed. He cited "overwhelming statistical evidence" in a landmark paper. Having that evidence exposed as fabricated, *especially* by a fellow statistician (Markwick), would sting. He'd likely acknowledge this error in judgment regarding the *specific source*.

  2.  **Re-evaluating the Evidence (Not the Principle):**
      *   **Scrutiny, Not Abandonment:** Turing wouldn't have junked his *epistemic principle* ("junk bedrock assumptions in the face of overwhelming evidence") because of fraud. Instead, he would have applied *even greater scrutiny* to the *nature* of the "overwhelming evidence." The Soal scandal would become a prime case study in *why* evidence needs to be not just statistically significant, but *beyond reproach* in its collection and handling, especially for extraordinary claims.
      *   **"Overwhelming" Re-defined:** He might have conceded that what *seemed* overwhelming at the time was, in fact, flawed. His standard for "overwhelming" would likely have been revised upwards, incorporating safeguards against fraud and methodological error that he hadn't fully appreciated were necessary in 1950. He might have said, "The evidence *as presented* was overwhelming *given the methodological standards then accepted and the apparent integrity of the researchers*. We now know those standards were insufficient and the integrity was lacking in this case."
      *   **Focus on Process:** His reaction would focus intensely on *how* the fraud was perpetrated and *how* it was uncovered (Markwick's re-analysis). He'd be fascinated by the statistical techniques used to detect the manipulation. This is where his Bletchley mind would engage – dissecting the failure in the "code" of the experimental protocol.

  3.  **The Broader Epistemic Point: Reinforced, Not Undercut:**
      *   **The Target Shifts, Not the Arrow:** Turing's core argument in that section wasn't *for* ESP. It was *against* using unfalsifiable concepts like consciousness or theological souls to *a priori* dismiss the possibility of machine intelligence. ESP was introduced as a *hypothetical counter-example* to the idea that brains operate solely by known physical laws. His point was: *If* overwhelming evidence forced you to accept ESP (implying minds *can* operate beyond known physics), then you couldn't logically use the "but machines are just physics!" objection to deny machine intelligence *either*.
      *   **The Principle Stands:** The Soal fraud doesn't invalidate the *logic* of this argument. It simply removes one *specific* piece of evidence that *might* have supported the premise. The *epistemic principle* – that even deeply held assumptions must yield to rigorously verified, overwhelming evidence – remains intact. In fact, the Soal scandal *exemplifies* the messy process of evidence challenging assumptions (in this case, the assumption of researcher integrity and methodological soundness).
      *   **A Stronger Case for Skepticism?:** Ironically, Soal's fraud might have made Turing *more* skeptical of *future* ESP claims, but it wouldn't have changed his core philosophical stance. He might have added a caveat: "The evidence must be *extraordinarily* rigorous and replicable to overcome the *extraordinary* nature of the claim *and* the demonstrated potential for error and fraud."

  4.  **The Personal Angle (Morcom & Openness):**
      *   **Compartmentalization:** Turing's openness, stemming from the Morcom experience, was likely a *personal* openness to the *possibility* of phenomena beyond strict materialism. It wasn't a *scientific* endorsement of specific, poorly verified claims. The fraud exposure would likely have caused him to *sharply separate* his personal philosophical leanings/hopes from his scientific assessment of evidence.
      *   **Relief?:** There might even have been a sense of relief. The Soal scandal resolved a cognitive dissonance: his personal openness conflicted with his scientific rigor regarding the *available evidence*. Removing the "overwhelming" but fraudulent evidence might have allowed his scientific side to rest easier, even if his personal openness remained. He wouldn't have felt *intellectually* compelled to defend ESP anymore.

  **Conclusion: Contained Embarrassment, Epistemic Reinforcement, and a Lesson in Rigor**

  *   **On the Specific Fraud:** Turing would have been furious and embarrassed about being misled by Soal. He would have acknowledged the error in trusting that specific data set.
  *   **On the ESP Passage:** He wouldn't see it as a "lapse," but as an argument based on the *best available evidence at the time*, which was later shown to be fraudulent. The *structure* of the argument (using a hypothetical challenge to materialist assumptions) remained logically sound for its purpose within the paper.
  *   **On the Epistemic Principle:** Far from undercutting it, the Soal scandal would have **reinforced** Turing's core point about the need for relentless scrutiny of evidence. It would have been a brutal lesson in *why* "overwhelming" evidence for extraordinary claims demands extraordinary levels of verification, transparency, and skepticism about methodology *and* researcher integrity. The principle of following evidence remains, but the *threshold* for what constitutes valid evidence for such claims would be raised significantly in his mind.
  *   **Revealing Aspect:** The passage *is* revealing. It shows Turing's willingness to engage with unconventional ideas *if* backed by data he trusted, stemming from both his scientific openness and a personal history that made him receptive to the *possibility*. The Soal scandal reveals the *danger* of that openness when the data is corrupted. His likely reaction – fury at the data corruption, not abandonment of the logical principle – shows the scientific rigor ultimately dominated. It wasn't a lapse in his core methodology; it was a failure in the *input* to that methodology, which he would have sought to correct with even greater analytical rigor.

  Had Turing lived, the Soal exposure would have been a significant footnote – an embarrassing example of flawed evidence he cited – but it wouldn't have overturned his broader argument about evidence and assumptions. It would have made him a far more formidable and cautious critic of *any* extraordinary claim, demanding forensic-level statistical analysis and replication before deeming evidence truly "overwhelming."
