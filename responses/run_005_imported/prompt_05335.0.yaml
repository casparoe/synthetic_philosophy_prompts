prompt: |-
  Next month I'm interviewing a social choice theorist on my podcast about her new book, which argues that ranked-choice voting basically fixes the strategic voting problem you get with plurality elections. I want to push back using the Gibbard-Satterthwaite theorem without turning the episode into a lecture. Can you draft me 8-10 questions, each with a follow-up baked in based on how she'll probably respond? I want at least one question on the 'sure, its manipulable in principle, but finding a winning manipulation is NP-hard so it doesn't actually matter' defense, one on whether real electorates are ever single-peaked enough to dodge the theorem that way, one pressing on 'manipulable in principle' vs 'manipulable often enough to actually matter' (has anyone even measured that?), and one on whether real-world IRV messes like Burlington 2009 count as evidence either way.
