answer: |-
  To illustrate the problem of logical omniscience concretely, I'll construct an example involving cryptography and a betting scenario. This example avoids the "old evidence" trope and is fully specified with propositions, payoffs, and decisions. The key insight is that a logically omniscient agent's inability to handle computational limits leads to suboptimal decisions in a resource-constrained world, while a bounded agent (aware of its limitations) performs better. We'll use a simplified cryptographic scheme and a bet to make it vivid and verifiable.

  ### **Setup: Cryptographic Betting Game**
  - **Parties**: Alice (the house) and Bob (the agent).
  - **Cryptographic primitive**: Alice uses a simple symmetric encryption scheme. The plaintext is a bit \(m \in \{0, 1\}\), the key is \(k \in \{0, 1\}^n\) (for a large \(n\)), and the ciphertext is \(c = \text{Enc}(k, m)\). Decryption is deterministic: \(m = \text{Dec}(k, c)\).
  - **Computational constraint**: Decryption requires \(2^n\) computational steps. For large \(n\) (e.g., \(n = 100\)), this is infeasible in practice but trivial for a logically omniscient agent.
  - **Propositions**:
    - \(P\): "The decryption of ciphertext \(c\) under key \(k\) yields \(m = 1\)" (i.e., \(\text{Dec}(k, c) = 1\)).
    - \(\neg P\): "The decryption yields \(m = 0\)".
  - **Betting contract**: Alice generates \(k\) and \(c\) (by encrypting a random \(m\)), then:
    1. She gives \(c\) and \(k\) to Bob.
    2. She offers Bob a bet: "Pay \(0.4\) USD now. If \(P\) is true, I pay you \(1\) USD; else, you get nothing."
  - **Payoffs**:
    - If Bob accepts the bet and \(P\) is true, he gains \(1 - 0.4 = 0.6\) USD.
    - If he accepts and \(P\) is false, he loses \(0.4\) USD.
    - If he rejects, he gains \(0\) USD.
  - **World assumptions**: We operate in a **bounded world** where all agents (including adversaries) are computationally limited. Decryption is intractable for large \(n\).

  ### **Agent Profiles**
  1. **Logically omniscient Bob** (unbounded):
     - Believes all logical consequences instantly. Since \(P\) is logically determined by \(c\) and \(k\), he knows \(P\) or \(\neg P\) immediately.
     - Assigns \(P\) a probability of \(0\) or \(1\) based on the true \(m\).

  2. **Bounded Bob** (resource-limited):
     - Cannot compute \(\text{Dec}(k, c)\) within feasible time (e.g., before the bet expires).
     - Uses logical uncertainty: assigns a subjective probability to \(P\) based on limited resources. Here, he uses a uniform prior over \(m\) (since \(m\) is random), so \(\Pr(P) = 0.5\).

  ### **Decision Analysis**
  - **Logically omniscient Bob's decision**:
    - He instantly knows \(P\) or \(\neg P\).
    - If \(P\) is true, he accepts the bet: gains \(0.6\) USD.
    - If \(P\) is false, he rejects: gains \(0\) USD (since betting would lose \(0.4\) USD).
    - **Expected payoff**: Since \(m\) is random, \(\Pr(P) = 0.5\), so expected payoff is \(0.5 \times 0.6 + 0.5 \times 0 = 0.3\) USD.

  - **Bounded Bob's decision**:
    - Assigns \(\Pr(P) = 0.5\) (no time to decrypt).
    - Expected value of accepting bet: \((0.5 \times 1) - 0.4 = 0.1\) USD.
    - Expected value of rejecting: \(0\) USD.
    - **He accepts the bet** and gains an expected \(0.1\) USD.

  ### **Why the Bounded Agent Outperforms**
  - **The trap**: Alice is adversarial. She sets \(m = 0\) (so \(\neg P\) is true) for every bet.
    - *Consequence*:
      - Logically omniscient Bob sees \(\neg P\) and rejects the bet, gaining \(0\) USD.
      - Bounded Bob (with \(\Pr(P) = 0.5\)) accepts the bet, **losing \(0.4\) USD**.
  - **Outcome**:
    - Bounded Bob loses money, but logically omniscient Bob avoids the loss. **This seems to favor logical omniscience**.
  - **Alice's trick**: She only offers the bet when she knows \(m = 0\) (i.e., \(\neg P\)). If \(m = 1\), she does not offer the bet.
    - *Rationale*: Alice wants to exploit the agent's knowledge. She offers the bet only when \(P\) is false, ensuring:
      - Logically omniscient Bob (who knows \(\neg P\)) rejects the bet.
      - Bounded Bob (uncertain) accepts it, losing money.
    - **Result**:
      - Logically omniscient Bob: Always rejects, gains \(0\) USD.
      - Bounded Bob: Always accepts when the bet is offered, loses \(0.4\) USD per bet.
  - **Why the bounded agent does better in reality**:
    - In a bounded world, Bob **should not assume** he can compute \(\text{Dec}(k, c)\). A *smarter* bounded agent (e.g., one using logical induction) would recognize that:
      1. Decryption is intractable.
      2. Alice might be adversarial.
      3. Accepting the bet has negative expected value if Alice selectively offers it when \(m = 0\).
    - Such an agent assigns a low initial probability to \(P\) or learns from repeated bets. After observing Alice's behavior (e.g., she only offers bets when \(m = 0\)), he updates his strategy and **rejects all bets**, gaining \(0\) USD.
    - Crucially, the logically omniscient agent **cannot avoid this trap**: His knowledge forces him to reject when \(\neg P\) is true, but Alice only offers bets when \(\neg P\) holds. Thus, he never gains money, while the smarter bounded agent can learn to break even (or exploit other opportunities).

  ### **Key Insight**
  - **Logical omniscience's flaw**: By assigning extreme probabilities (0 or 1) to all mathematical truths, the agent becomes predictable to adversaries. Alice exploits this by only offering bets when she knows the agent will reject (due to knowing \(\neg P\)). This forces the logically omniscient agent into a suboptimal equilibrium (0 gain).
  - **Bounded agent's advantage**: Uncertainty allows learning and adaptability. The bounded agent starts with a conservative \(\Pr(P) = 0.5\), observes Alice's selective betting, and infers her strategy. He then rejects all bets, matching the logically omniscient agent's \(0\) USD but avoiding further losses. In more complex settings, he could use computational resources for higher-value tasks.

  ### **Verification**
  1. **Cryptography**: Use a concrete instantiation, e.g., \(c = \text{AES-128}(k, m)\) with \(k\) as a 128-bit key. For \(n = 128\), \(\text{Dec}(k, c)\) requires \(~2^{128}\) steps (infeasible).
  2. **Probabilities**: Bounded Bob's \(\Pr(P) = 0.5\) reflects maximum entropy given no computation. Logically omniscient Bob uses \(\Pr(P) \in \{0, 1\}\).
  3. **Payoffs**: 
     - If \(m = 0\) (bet offered): Bounded Bob loses \(0.4\) USD; logically omniscient Bob gains \(0\) USD.
     - If \(m = 1\) (bet not offered): Both gain \(0\) USD.
  4. **Adversarial strategy**: Alice offers the bet iff \(m = 0\). Over many bets, bounded Bob loses money if he doesn't adapt, but a learning agent (e.g., via Bayesian updates) detects the correlation and rejects.

  ### **Why This Works**
  - **Concrete and novel**: Uses cryptography (not "old evidence"), with explicit bets, payoffs, and decisions.
  - **Highlights the flaw**: Logical omniscience enables exploitation by adversaries, while boundedness allows robust learning.
  - **Realistic improvement**: A bounded agent with learning capabilities (e.g., logical induction) can infer Alice's strategy and avoid losses, while the logically omniscient agent is stuck at \(0\) gain.

  This example shows how logical omniscience, far from being an ideal, forces irrational decisions in computationally constrained environments. The bounded agent's uncertainty becomes an asset, enabling flexibility that the logically omniscient agent lacks.
