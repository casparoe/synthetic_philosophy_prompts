  so i'm a philosophy PhD student who also runs a tiny podcast on formal epistemology, and next week's guest has built her whole career defending the Self-Indication Assumption over SSA, mainly to block the doomsday arguement. whenever anyone raises the presumptuous philosopher case on her she's got this one line -- "that's just correct conditionalization on self-locating evidence, not a bug" -- and moves right on before anyone can push back, and i don't want her to get away with that on my show. can you draft me 8 interview questions that make that dodge harder to use each time (nothing generic, no "what got you into anthropics" stuff)? i want at least one question each on: why SIA licenses favoring the bigger-universe theory before the physicists even run their experiment (thats supposed to be the absurd part of Bostrom's setup), on the reference class problem (i've never heard a good SIA answer for why "all possible observers" isnt just doing the same work a reference class did for SSA), and on Sleeping Beauty -- if going thirder is basically SIA-flavored reasoning, does that commit her to something presumptuous-philosopher-shaped there too, or is that a different argument in a costume? for each one, add a short follow-up keyed to whatever answer she'll probably give.
