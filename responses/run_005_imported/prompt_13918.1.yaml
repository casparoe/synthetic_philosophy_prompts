  Okay, the user is part of a self-study group tackling Aquinas's political writings and wants an expert evaluation of a member's exam-style answer. The question focuses on Aquinas's distinction between two types of tyrants and the licensed responses, while critiquing the oversimplified "killing is permissible" summary.

  Hmm, the answer demonstrates strong textual engagement but has two critical flaws: First, it misattributes the "defect of title" discussion to the Sentences commentary (actually from Summa Theologiae). Second, it incorrectly claims Aquinas's "general position" allows killing any tyrant once misrule becomes intolerable. The reality is more nuanced - Aquinas never extends this permission to tyrants by exercise.

  The John of Salisbury comparison is also problematic. While both discuss tyrannicide, Aquinas deliberately avoids Salisbury's "meritorious act" framing, emphasizing institutional solutions instead. The answer correctly identifies practical cautions in De Regimine but frames them as mere pragmatic concerns rather than fundamental limitations on private action.

  For grading, I'll use a 20-point scale: 12/20 seems fair. Major deductions for the textual misattribution (-3) and overgeneralization about forfeited authority (-3). Minor deductions for the Salisbury oversimplification (-1) and underdeveloped "worse disturbance" caveat (-1). Good structure and coverage of key concepts earn partial credit.

  The user needs actionable feedback - I'll provide specific line-by-line corrections they can share with their study partner. The group's dedication to self-correction is impressive, but they're right to seek external validation on technical Aquinas scholarship.
answer: |-
  Here's a detailed grading and feedback for the provided answer, using a 20-point scale broken down by key components:

  **Overall Score: 12/20**

  **Breakdown & Justification:**

  1.  **Accurate Description of the Two Tyrants: (4/4)**
      *   *Comment:* Correctly identifies and defines "tyrant by defect of title" (usurper) and "tyrant by way of exercise" (legitimate but unjust ruler). Cites the relevant sources (Sentences commentary for the first, De Regimine Principum for the second). Explains the origin of power clearly.

  2.  **Response to Tyrant by Defect of Title (Usurper): (3/5)**
      *   *What's Right:* Correctly states this ruler never had legitimate authority and may be forcibly resisted by *anyone*. Correctly notes the caveat about avoiding "worse disturbance."
      *   *What's Wrong/Oversimplified:* **Major Error:** Attributes this discussion primarily to the *Sentences* commentary. While Aquinas discusses usurpation there, his most developed and authoritative treatment of resistance to a usurper is in **ST II-II, Q.42, A.2 (On Sedition)**, where he explicitly allows for the overthrow of a usurper by private individuals ("multitudo") if public authority fails to act. The answer's source attribution is misleading and misses the primary locus.
      *   *Deduction:* -2 points for significant source misattribution.

  3.  **Claim of a "General Position" & Forfeiture: (0/4)**
      *   *What's Wrong:* **Fundamental Error.** The answer claims: "This reasoning is really the basis of his general position across the corpus: since an unjust ruler forfeits the title he holds, any tyrant, however he originally came to office, may in principle be killed once his misrule becomes intolerable." **This is incorrect and a serious oversimplification.** Aquinas *does not* extend the permission for *private individuals* to kill a tyrant who holds power legitimately but exercises it tyrannically (the second type). His position on the second type is *qualitatively different*. The "forfeiture" logic applies cleanly to the *usurper* (who never had title), but Aquinas *does not* explicitly state that a legitimate ruler who becomes tyrannical *automatically forfeits his title* in a way that licenses *private* killing. He argues for a different, much more restricted, process for dealing with them.
      *   *Deduction:* -4 points for a central misrepresentation of Aquinas's core distinction and principle.

  4.  **Response to Tyrant by Way of Exercise (Legitimate but Unjust): (4/5)**
      *   *What's Right:* Correctly identifies the source (*De Regimine Principum*). Accurately summarizes the practical warnings: private attempts often fail and worsen the tyranny, risk teaching a bad lesson about deposing rulers, and can be exploited by the ambitious. Correctly states Aquinas's conclusion that removal is the business of the original installing authority (or requires endurance/prayer).
      *   *What's Oversimplified:* While correctly noting Aquinas's practical concerns, the answer frames them *only* as pragmatic warnings ("how such attempts tend to go wrong") and claims Aquinas maintains the "permission in principle." **This is misleading.** Aquinas's arguments against private action against this type of tyrant are *also* grounded in principle: the ruler *still holds legitimate authority* (title), and it is not the place of *private individuals* to judge and execute that forfeiture. The authority to judge and depose resides with the *public body* that granted the authority or its superior (like the Pope for Christian princes). The distinction between *private* action and *public* action (by the competent authority) is crucial and principled, not just practical. The answer downplays this key *procedural* and *authoritative* distinction.
      *   *Deduction:* -1 point for underemphasizing the principled basis for restricting action to public authority.

  5.  **Addressing the "One-Line Summary": (1/2)**
      *   *What's Right:* Implicitly shows why the summary is too simple by highlighting the crucial distinction between the two types of tyrants and the vastly different permissions for response (private resistance/killing vs. public authority/endurance).
      *   *What's Lacking:* Could be more explicit in directly stating that the summary "Aquinas thought killing a tyrant was permissible" is only *partially* true and highly misleading. It *is* permissible (with caveats) for a *usurper* by *private individuals*, but it is generally *not* permissible for a *legitimate* but tyrannical ruler by *private individuals* – only by the competent public authority. The answer's own error in point 3 undermines this.
      *   *Deduction:* -1 point for lack of explicitness on this point and being undermined by the earlier error.

  6.  **John of Salisbury Comparison: (0/2)**
      *   *What's Wrong:* **Major Oversimplification.** While Aquinas was certainly aware of John of Salisbury and the tradition justifying tyrannicide, the answer misrepresents Aquinas's position by claiming he is "best read here as simply continuing the older line associated with John of Salisbury." Salisbury (*Policraticus*) argued much more explicitly and broadly for tyrannicide as a *duty* and *meritorious act* for *anyone* against *any* tyrant ("tyrannus exercitio"). Aquinas, especially in *De Regimine*, **deliberately distances himself from this radical position.** His emphasis on *public authority* and his stark warnings against *private* action against a legitimate ruler, even a tyrannical one, represent a significant *qualification* and *moderation* of the Salisburyan position, not a simple continuation. Attributing Salisbury's view to Aquinas on this specific point (private killing of a tyrant by exercise) is incorrect.
      *   *Deduction:* -2 points for a significant historical and doctrinal misrepresentation.

  7.  **Clarity, Structure, and Use of Sources: (2/2)**
      *   *Comment:* The answer is generally well-written, logically structured around the two types, and attempts to engage with specific texts (though incorrectly in places). It effectively contrasts the two responses.

  **Summary Feedback for the Member:**

  *   **Strengths:** You clearly understand and articulate the core distinction between the two types of tyrants. You correctly identify the primary sources for each discussion and summarize the *practical* warnings against private action against a tyrant-by-exercise well. The structure is logical.
  *   **Critical Weaknesses:**
      1.  **Source Error:** The discussion of resistance to the usurper is primarily found in *Summa Theologiae* II-II, Q.42, A.2 (On Sedition), not mainly in the *Sentences* commentary. This is an important textual accuracy point.
      2.  **Fundamental Misinterpretation:** Your claim that Aquinas has a "general position" allowing the killing of *any* tyrant (once misrule is intolerable) by private individuals because authority is forfeited **is incorrect and flattens his crucial distinction.** This logic *only* applies cleanly to the *usurper*. For the legitimate ruler turned tyrant, Aquinas **does not** grant private individuals the right to kill based on forfeiture. He restricts action to *public authority*.
      3.  **Oversimplification of Restriction:** While you note the practical warnings against private action on the second tyrant, you frame them *only* as pragmatic, missing the *principled* argument: the ruler *still holds legitimate title*, and only the body that granted it (or its superior) has the *authority* to judge and depose him. Private individuals lack this authority.
      4.  **Misleading Salisbury Comparison:** Suggesting Aquinas "simply continu[ed]" John of Salisbury's position on tyrannicide, especially regarding the second tyrant, is a serious misrepresentation. Aquinas's emphasis on public authority and warnings against private action represent a significant *moderation* of Salisbury's more radical stance. Aquinas does not endorse private tyrannicide against a legitimate ruler as meritorious.
  *   **Impact on Addressing the Question:** These errors mean you haven't fully accurately shown *why* the one-line summary is too simple. The core reason is that Aquinas **only** permits *private* killing/resistance against a *usurper*. Against a *legitimate* ruler turned tyrant, he **forbids** private killing and insists on action by *public authority* or endurance. Your answer incorrectly suggested the permission applied more broadly.

  **Final Note:** The group's approach is excellent – wrestling directly with the texts and challenging each other. This level of detailed feedback is exactly how understanding deepens. Encourage your member to revisit *ST* II-II, Q.42, A.2 and *De Regimine Principum* I, 6 with these points in mind. The distinction between *private* action and action by *public authority* is absolutely key.
