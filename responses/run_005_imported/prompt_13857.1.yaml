answer: |-
  That's an incredibly sharp and challenging question – your friend has pinpointed a genuine tension in moral philosophy, especially for consequentialist frameworks like Singer's. While her conclusion follows logically from a *strict* interpretation of Singer's initial argument, it's not the only way utilitarians or consequentialists address supererogation. Here's a breakdown of why it's complicated, and how the category *might* be preserved:

  1.  **The Friend's Argument (The Collapse Thesis):**
      *   **Premise 1 (Singer's Core Principle):** If we can prevent something very bad (e.g., death, extreme suffering) without sacrificing anything *morally significant*, we ought to do it.
      *   **Premise 2 (No Morally Significant Sacrifice Threshold):** Singer argues (especially in later work) that "morally significant" is extremely high. Giving up luxuries, non-essential comforts, and even significant personal projects *can* be required if the suffering prevented is severe enough (e.g., saving a life via effective charity). There's no clear line where sacrifice becomes "too much" to be obligatory.
      *   **Premise 3 (Maximization Implied):** Effective Altruism (EA), heavily influenced by Singer, pushes this further: it's not just about preventing *some* bad, but about doing the *most* good possible with your resources (time, money, talent). Obligation scales with capacity to do good.
      *   **Conclusion:** Therefore, what common sense calls "extraordinary" sacrifice (donating 50% of income, dedicating your career to high-impact causes) is, for someone with means, actually the *minimum* required to meet their moral obligation. Anything less is failing to do what you *ought* to do. Supererogation disappears; only obligatory acts and moral failures remain.

  2.  **Why This Feels "Too Quick" and Where Pushback Exists (Preserving Supererogation):**
      *   **The Demandingness Objection:** This is the classic counter. Critics (like Bernard Williams, Susan Wolf, and even some utilitarians like Samuel Scheffler) argue that a morality demanding *constant, maximal* sacrifice is simply too demanding to be plausible or livable. It alienates us from our personal projects, relationships, and identities – things that give life meaning. Supererogation acts as a crucial "pressure valve," recognizing that while we *can* do immense good, morality shouldn't *require* us to become saints or self-sacrificing machines at the cost of everything else that matters to us.
      *   **Scalar Utilitarianism (Shelly Kagan):** Kagan proposes separating the *evaluation* of actions (better/worse) from their *deontic status* (obligatory/permissible/wrong). Utilitarianism tells us which action produces the *most* good (the best action). But Kagan argues it doesn't necessarily follow that *every* action less than the best is *wrong* or *impermissible*. There might be a range of actions that are *good enough* (permissible), even if not the *best* (optimal). Under this view:
          *   Donating 10% effectively might be *good* and *permissible*.
          *   Donating 50% effectively might be *better* and even *supererogatory* (morally excellent beyond the call of duty).
          *   Donating nothing might be *bad* and *wrong*.
          *   **How it preserves supererogation:** The *best* action (max donation) is obligatory only in a weak sense ("it's what the ideally best person would do"), but failing to do it isn't necessarily a *wrong* or blameworthy act if you meet a sufficient threshold of doing good (e.g., 10%). The supererogatory act is the one that goes significantly beyond this sufficient threshold towards the optimal.
      *   **Rule Consequentialism/Pragmatic Compromise:** A rule consequentialist might argue that the *rule* "Do as much good as you possibly can" actually leads to worse overall outcomes. Why?
          *   **Psychological Realism:** If people feel morality demands constant, extreme sacrifice, they might burn out, resent morality, or reject it entirely, leading to *less* good being done overall. A morality that recognizes supererogation might be more motivating and sustainable.
          *   **The "Overload" Problem:** Calculating the *absolute maximum* good in every decision is impossible and paralyzing. We need practical rules of thumb and thresholds. Recognizing supererogation acknowledges this practical limit.
          *   **Preserving Personal Integrity:** Morality needs space for personal commitments that aren't globally optimal but are central to an individual's identity and well-being (raising your own child vs. saving more strangers, pursuing an art career that brings joy but isn't maximally impactful). Demanding constant sacrifice undermines this integrity.
          *   **Encouraging Widespread Participation:** Framing significant giving as "above and beyond" might encourage *more* people to give *something* substantial, whereas framing *all* non-maximal giving as failure might discourage participation altogether. "Doing good" becomes an achievable goal with an "extra mile" option.
      *   **Distinguishing Obligation from Ideal:** We can acknowledge that donating 50% is *morally ideal* (what the best version of ourselves would do) and produces vastly more good, without necessarily saying that someone who donates 10% effectively is committing a *moral wrong* akin to letting a child drown. They are meeting a baseline obligation (preventing *some* significant harm) but failing to meet the higher ideal. The supererogatory act is the one that achieves the ideal.

  3.  **Where Singer/EA Stands:**
      *   Singer *does* acknowledge the demandingness objection but tends to bite the bullet. He argues our intuitions about demandingness are corrupted by moral laziness and proximity bias. He believes recognizing the true scale of global suffering *should* radically reshape our understanding of obligation. For strict EA adherents, supererogation *does* largely collapse – effective giving isn't charity; it's restitution for the harm caused by unjust global systems they benefit from.
      *   However, *many* EAs in practice operate with a *pragmatic* acceptance of supererogation. They encourage "earning to give" or high-impact careers as *especially* commendable, but still celebrate significant (even if sub-maximal) effective donations as morally good and important. They focus on marginal improvements and encouraging more people to do *more* good, rather than solely condemning non-maximizers.

  **Conclusion: Is your friend "right"?**

  *   **Logically, within a strict, act-utilitarian interpretation of Singer's initial argument taken to its extreme:** Yes, she has a strong point. If *any* preventable suffering without *absolute* comparable sacrifice is obligatory, and obligation scales with capacity, then "supererogatory" acts are indeed just meeting the baseline obligation for those with high capacity. Supererogation collapses.
  *   **Philosophically and practically:** It's more nuanced. There are compelling consequentialist *and* non-consequentialist reasons to preserve the category of supererogation:
      *   **Scalar Utilitarianism:** Separates "best" from "obligatory."
      *   **Rule Consequentialism/Pragmatism:** Argues recognizing supererogation leads to *better overall outcomes* by being more sustainable, motivating, and psychologically realistic.
      *   **The Demandingness Objection:** Highlights that a morality without supererogation might be self-defeating and alienating.
      *   **Integrity and Meaning:** Recognizes the value of personal projects and commitments within a moral life.

  **The core tension is between the pure logic of maximization and the messy realities of human psychology, motivation, and the need for a livable, sustainable morality.** While Singer challenges us to radically expand our sense of obligation, preserving a space for supererogation might be essential for making that expanded morality actually work in the real world. Your intuition that it was "too quick" likely stems from sensing this practical and psychological friction, even if the pure logic seems compelling.
