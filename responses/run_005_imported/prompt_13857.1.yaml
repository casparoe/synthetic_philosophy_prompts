prompt: |-
  I had a long, slightly heated argument with a friend last night about effective altruism after she brought up Peter Singer's drowning-child argument. Her position was that once you accept Singer's reasoning, the whole concept of "supererogation" — acts that are morally good but not required — basically collapses: whatever produces the most good is simply obligatory, and anything less than that is a moral failure, so extraordinary charitable giving (or any other "above and beyond" act) was never really optional in the first place, just misdescribed by common sense. I felt this was too quick but couldn't pin down exactly where the argument goes wrong. Is she right that taking utilitarian-style reasoning seriously means there's no real room left for supererogatory acts, or is there a way to preserve that category even if something like Singer's argument is basically sound?
reasoning: |-
  Okay, the user had a heated debate with a friend about effective altruism and Peter Singer's drowning child argument. The friend argued that accepting Singer's reasoning eliminates the concept of supererogation—acts that are morally good but not required. The user felt this was too simplistic but couldn't articulate why. They want to know if utilitarian reasoning necessarily collapses supererogation or if there's a way to preserve it.

  First, I need to recall Singer's argument. The drowning child analogy suggests that if you can save a child with minimal cost, you're obligated to do so. Extending this, if you can save lives by donating to effective charities, that's obligatory too. The friend's point is that this makes any act that produces the most good obligatory, leaving no room for supererogation.

  But I remember that utilitarianism isn't the only framework. Even within consequentialism, there are nuances. The demandingness objection is key here. Utilitarianism might require extreme sacrifices, but some philosophers argue this is unrealistic. Bernard Williams criticized it for alienating individuals from their personal projects. Maybe supererogation acts as a pressure valve here.

  Then there's scalar utilitarianism, proposed by Shelly Kagan. He separates the evaluation of actions from their deontic status. So, while donating all your money might be the best action, not doing it isn't necessarily wrong—just less good. This could preserve supererogation by redefining moral obligation.

  Psychological realism is another angle. If morality demands too much, people might reject it entirely. Allowing supererogatory acts encourages more people to contribute without feeling guilty for not doing the maximum. This practical approach could justify the category.

  The user might also be concerned about the rigidity of moral obligations. They might value personal projects and feel that constant maximization is oppressive. Preserving supererogation allows for personal space without total moral failure. The deeper need here is reconciling moral ideals with human limitations, seeking a balanced approach that motivates without overwhelming.

