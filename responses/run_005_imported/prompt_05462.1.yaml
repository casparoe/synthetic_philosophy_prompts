  ### Key Insights:
  1. **Premise-Based (S-tier)**: Optimal balance for real committees. Works flawlessly for "tree-structured" agendas (single-conclusion derivations) but requires careful premise selection in agendas with cross-cutting dependencies (e.g., EU policy matrices).

  2. **Kemeny-PBP Divergence**: Occurs in agendas with:
     - **Redundant justification paths** (e.g., liability if either negligence OR strict obligation exists)
     - **Conclusion-premise feedback loops** (e.g., economic indicators determining policy, which then alters future indicators)
     - **Non-separable premises** (where one premise's meaning depends on another conclusion's value)

  3. **Practical Recommendation**: For policy committees, use **hybrid precedence rules**: premise-based voting with fallback to sequential priority on undetermined conclusions. This avoids Kemeny's computational hell while mitigating path-dependence risks (e.g., ECB's Governing Council procedures).

