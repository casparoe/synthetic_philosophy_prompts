      - Tractability: Very tractable. Only requires majority votes on each premise (or whatever rule is set for the premises) and then a logical deduction. For 50 members, it's just as easy as for 3.
      - Breaks down: When the logical connections are more complex than a simple tree (e.g., when there are multiple paths to the same conclusion, or when the agenda is not separable). In particular, if the agenda has interlocking dependencies (like a cycle in the logical structure) or if the premises do not uniquely determine the conclusions (non-separable agenda), then PBP might lead to inconsistent conclusions. Also, if the body must make a decision on every proposition (including conclusions that are not logically determined by the premises) then PBP doesn't cover that.

