answer: |-
  You've put your finger on the exact nerve where evolutionary biology's explanation of dispositions meets decision theory's demand for justification of *acts*. I'll argue fiercely for the unfashionable view: **Paying the driver, once safely in town with cash in hand, is indeed irrational under strict causal decision theory (CDT), and attempts to "rescue" the rationality of *this specific act* by appealing to the rationality of the *disposition* commit a fundamental category error.** Parfit's point about the *disposition* being rational is correct, but it doesn't magically transform the *act* into a rational one when evaluated on its own causal merits.

  Here's the case, argued as forcefully as CDT demands:

  1.  **The Iron Law of Causal Decision Theory:** CDT's core principle is ruthlessly clear: *An act is rational if and only if it maximizes causal expected utility.* Utility is defined by the agent's desires (e.g., survival, money). Rationality is assessed *from the perspective of the agent at the moment of choice*, considering only the causal consequences *flowing forward in time* from the act itself. Backward causation, magic, or retrospective justification are excluded. The past is fixed; only future consequences matter.

  2.  **The Town Scenario: A Causal Vacuum:** You are *now* in town. The driver is sitting there. Your life is no longer in immediate danger. You possess the cash. The critical question is: **What causal consequences does handing over $100 *now* produce?**
      *   **Consequence 1:** You are $100 poorer. (Direct, certain, negative).
      *   **Consequence 2:** The driver is $100 richer. (Irrelevant to your utility).
      *   **Consequence 3:** ... *Nothing else.*
      The driver's prediction, the desert ordeal, the promise – these are *historical facts*. Paying *cannot change them*. Paying *cannot* retroactively cause the driver to have picked you up (that already happened). Paying *cannot* cause you to be safe in town (you already are). Paying *cannot* magically alter the driver's past prediction algorithm. In the causal structure of the universe *from this moment forward*, paying $100 produces a net loss of $100 utility for you and *absolutely nothing else* of positive causal consequence. Stiffing him produces a net gain of $100 utility and *absolutely nothing else* of negative causal consequence. **Causally, paying is strictly dominated by not paying.**

  3.  **The Disposition Defense: A Smokescreen for the Act:** The standard rebuttal ("But you *need* the disposition to get picked up!") is powerful for explaining *why having the disposition is advantageous*, but it utterly fails to justify the *act of paying* at T2 (in town). Here's why:
      *   **Temporal Myopia of Rationality:** Rationality is evaluated *at the time of the act*. At T2, the benefits of *having had* the disposition (being alive in town) are *already secured and sunk costs*. They are not *caused* by paying *now*. Rationality at T2 cannot be held hostage to rewards already banked at T1. Demanding you pay *now* to justify *past advantages* is like demanding a soldier keep fighting *after* the war is won and the peace treaty signed because fighting *during* the war was beneficial. The context justifying the disposition *no longer applies*.
      *   **The Disposition Isn't the Act:** Having a reliable disposition to pay is one thing. *Acting* on that disposition *in a situation where it provides no causal benefit* is another. The disposition is a property of the *agent over time*; the act is a *singular event*. Justifying the property doesn't automatically justify every manifestation of it, especially when the manifestation is costly and causally inert. A disposition to feel rage when cheated might be evolutionarily advantageous (deterrence), but *punching someone* after they've cheated you and fled, when no one is watching and no future deterrence is possible, is still causally irrational (jail time, injury risk). The disposition's *existence* was rational; the *act* of punching, in that specific context, is not.
      *   **Confusing Levels of Analysis:** Defenders conflate the *meta-strategy* (adopting a disposition/policy) with the *object-level act* (paying at T2). The meta-strategy ("Be the type who pays") *was* rational *at the time of adoption or as a general policy* because it leads to better outcomes *across many possible scenarios*. But the rationality of the *policy* does not transfer to every *action dictated by the policy*, particularly when the policy forces you to perform an action that, *in the specific context you now find yourself in*, is causally self-defeating. The policy is rational *despite* sometimes demanding irrational acts, not *because* those acts become magically rational. **The policy rationally *exploits* your capacity for causally irrational acts at T2 to secure benefits at T1.**

  4.  **The Evolutionary Analogy Holds, and It Cuts Against the Act:** You rightly recall Robert Frank. Evolution *does* select for dispositions (emotions, "irrational" commitments) *because* they lead to better long-run outcomes *on average* by enabling credible threats/promises. But crucially:
      *   **The Individual Act Can Still Be Costly:** Feeling vengeful rage *right now* is painful and physiologically costly. Issuing an alarm call *right now* might get *you* eaten, even if the *disposition* to call alarms benefits your kin/group/genes overall. Evolution selects for the *disposition* because the *net benefit* outweighs the *net cost of the acts it produces*. It doesn't make each *instance* of rage or alarm calling *causally optimal for the actor in that moment*. The vervet monkey giving an alarm call while being the most exposed *is* acting against its immediate causal self-interest; it's the *disposition* across the population that's adaptive. Similarly, paying $100 *in town* is a net cost to *you now*; it's the *disposition* that got you to town that was beneficial.
      *   **"Hardwiring" Doesn't Equal Rationality:** Evolution hardwires these dispositions precisely *because* purely causal, moment-to-moment rationality would often lead to suboptimal outcomes (e.g., always defecting in prisoner's dilemmas). The fact that we *are* hardwired (or rationally choose to adopt a disposition) to sometimes act against immediate causal self-interest **proves CDT's point about the act**, not refutes it. It shows we need mechanisms *outside* strict CDT to achieve better outcomes – mechanisms that sometimes override CDT's prescription for the *current act*.

  5.  **Against "Updateless" and Functional Decision Theories (FDT):** These theories (often correctly) point out that CDT gets bad outcomes in these cases. Their solution is to evaluate acts based on the *general functional output* of the *decision rule* you are implementing, across all possible situations, including counterfactuals. But this is precisely the category error!
      *   **They Justify the Rule, Not the Act:** FDT/UDT tell you it's rational to *be an agent who uses a rule that says "Pay"*. This justifies the *character* of the agent or the *policy*. But when that rule outputs "Pay" *in the specific T2 situation*, the *act of paying itself* still has **zero positive causal consequences** for the agent *in that situation*. FDT/UDT *redefine rationality* to mean "acting in accordance with the best general policy," abandoning the core CDT commitment that rationality is about *causing good outcomes for yourself from your current state*. **They change the subject.** They solve the problem by denying the premise that rationality is about maximizing causal utility *for this act now*.

  6.  **The Brutal Honesty of CDT:** CDT gives the uncomfortable answer: *At T2, paying is irrational. Therefore, a purely self-interested, causally rational agent cannot credibly commit to paying.* This isn't a flaw in CDT; it's an accurate description of the limitations of pure causal rationality in strategic interactions involving precommitment. Parfit's "rational irrationality" is spot on: it's *rational to arrange to be irrational later*. But that "irrationality" at T2 is real. Calling the act "rational" via FDT/UDT is verbal sleight-of-hand, blurring the crucial distinction between the rationality of a disposition/policy and the rationality of an individual act governed by it.

  **Conclusion:** From the scorching pavement of the town square, with the keys to survival already in your pocket and the driver holding out his hand, handing over $100 is an act of pure, causally unjustifiable charity or foolishness. It makes you poorer and achieves *nothing else* for you. The fact that *being the type of person who would do this irrational thing* was essential to getting you to this point is profound and important – it explains why we have emotions, make promises, and adopt policies – but it does not retroactively inject causal power into the act itself. The disposition was rationally advantageous; the act it compels, in this causally isolated moment, is not. Causal Decision Theory delivers this verdict with unflinching, logical rigor: **Paying is irrational, full stop.** The fashionable alternatives rescue the *outcome* and the *disposition* by redefining rationality away from the causal impact of the singular act. They win the battle for practical success, but they lose the war for conceptual clarity about what makes an *act* rational in the moment of choice. Your instinct that the refutation feels "too fast" is absolutely correct. The emperor of act-rationality in the hitchhiker case has no causal clothes.
