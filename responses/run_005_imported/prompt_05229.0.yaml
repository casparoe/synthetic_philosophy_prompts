answer: |-
  Based on a close reading of Aquinas's principles in *De Regno* and the *Summa Theologiae* (especially II-II, Q42 on Sedition and Q64 on Homicide), here's the verdict he would likely reach on your case:

  1.  **The Leader's Status: Tyrant by Exercise, NOT Usurper.**
      Aquinas would **not** classify this leader as a usurper. The key distinction lies in the *origin* of power:
      *   **Usurper:** Seizes power illegitimately from the outset (no valid title). Your leader won power "in a genuinely free election." Aquinas grants legitimacy to rulers established by the community's consent (*De Regno* I, 6). The initial mandate was legitimate.
      *   **Tyrant by Exercise:** Acquires power legitimately but rules oppressively ("hollows out courts, jails journalists, rigs elections"). This perfectly fits Aquinas's description: "when a king, who is appointed for the good governance of a people and to be the guardian of justice, seeks to overturn justice and to destroy the very thing he was established to preserve" (*De Regno* I, 6). Subverting institutions *after* gaining power doesn't retroactively make him a usurper; it makes him a tyrant *in office*.
      *   **Consequence:** Therefore, the ruler remains, in Aquinas's framework, an authority who *was* legitimately installed by the community. His removal falls under the principle that only "public authority" or the community itself can act, **not** private individuals.

  2.  **The Foreign Drone Strike: Equivalent to Private Assassination.**
      Aquinas would **unequivocally condemn** this act for several reasons:
      *   **Lack of Proper Authority:** The core principle for removing a tyrant-by-exercise is that the authority to act resides with the community that established him or its legitimate representatives. A *foreign government* has **zero standing** in this relationship. Aquinas's framework is intensely focused on the internal political order and the relationship between a community and its ruler. A foreign power is fundamentally an *external* actor, alien to this specific political bond. Its action is not an exercise of the community's authority; it's an external imposition.
      *   **Secrecy and Lack of Public Sanction:** Aquinas emphasizes the importance of *public* action to avoid the chaos of private judgment and ambition. A "covert strike... in total secrecy, with no UN authorization or other recognized public sanction" is the *antithesis* of the public, authorized process Aquinas demands. It operates purely on the foreign power's private judgment.
      *   **Risk of Disorder and Pretext:** Aquinas's primary fear – that private tyrannicide licenses ambition and leads to the murder of good rulers on false pretexts (*Summa Theol.* II-II, Q42, A2, ad 3) – applies *even more strongly* to foreign intervention. A foreign power acting secretly is far more likely to be motivated by its *own* interests (geopolitical advantage, resource control, ideological opposition) than by a genuine, disinterested concern for justice in the target nation. This creates massive potential for abuse, destabilization, and cycles of violence, precisely the outcomes Aquinas sought to prevent by restricting removal to public authority.
      *   **The "Lone Citizen's Dagger" Analogy:** Aquinas would see the foreign drone strike **as morally equivalent to a private citizen's assassination.** Both involve actors fundamentally lacking the *authority* to judge and execute the ruler within that specific political community. The change of actor (foreign state vs. lone citizen) doesn't grant legitimacy; it simply makes the unauthorized act potentially more powerful and destabilizing. The core violation – acting without the mandate of the community wronged by the tyrant – remains the same.

  **Aquinas's Verdict:**

  Based strictly on his principles, Aquinas would conclude:

  1.  The leader, though tyrannical, remains a ruler who acquired power legitimately and therefore is **not** a usurper subject to private (or foreign) assassination.
  2.  The covert drone strike by a foreign power is an **unauthorized, private act of killing** (morally equivalent to a citizen's dagger), undertaken without the mandate of the community that established the ruler and without any public, legitimizing process.
  3.  This act constitutes **unjust homicide** (violating *Summa Theol.* II-II, Q64) and potentially **sedition** (if viewed as inciting disorder *from the outside*, though Aquinas primarily discusses internal sedition). It fundamentally violates the principle of legitimate authority for removing tyrants and risks greater evils than the tyranny it seeks to end.

  **Why? The Core Aquinas Principles in Play:**

  *   **Legitimacy of Origin Matters:** How power is gained determines the initial status of the ruler (usurper vs. legitimate).
  *   **Tyranny by Exercise ≠ Usurpation:** Legitimate origin isn't erased by subsequent tyranny; it changes the *method* required for removal.
  *   **Removal Requires Competent Authority:** Only the community that installed the ruler or its designated public authority has the right to remove a tyrant-by-exercise. This authority is intrinsic to the political community.
  *   **Rejection of Private Judgment/Vigilantism:** Allowing private actors (individuals *or* foreign states) to judge and execute rulers invites chaos, ambition, and the murder of good rulers on false pretenses.
  *   **Order and Due Process:** Aquinas prioritizes a public, orderly process over private violence, even for a good end, to prevent greater societal harm.

  The foreign drone strike fails Aquinas's test on every count related to the removal of a tyrant-by-exercise: wrong actor, wrong method, wrong authority, and high risk of disastrous consequences. His principles commit him to condemning it.
