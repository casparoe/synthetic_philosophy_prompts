  Now, the scenario: the leader was initially legitimate, elected freely. But then they dismantle courts, jail journalists, and rig elections. So, they started legitimately but became oppressive. According to Aquinas, this makes them a tyrant by exercise, not a usurper. Therefore, removal isn't for private individuals but the community that established them. 

