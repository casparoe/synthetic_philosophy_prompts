  Hmm, the core tension here is between two ethical frameworks: one based on concrete harm (the user's view) and one based on intrinsic wrongness (Devon's view). The user seems frustrated they couldn't articulate why these are distinct. They're intellectually unsettled - this isn't just about Mara's marriage anymore, but about how we ground moral judgments.

  I should note Devon's argument has logical weaknesses. His "slippery slope" claim (that "no harm" leads to permitting anything consensual) ignores how harm is defined in ethics. Philosophers like Mill clearly distinguish between other-regarding harm and mere distaste. Also, his appeal to tradition is a classic fallacy - historically common ≠ morally correct (slavery, homophobia etc. prove this).

  But Devon's disgust reaction is human. The user recognizes this isn't about labeling him "prude" - they're being remarkably fair. The real ask is for tools to dissect when feelings translate to valid ethics. That's sophisticated - they want rigor, not platitudes.

  Key angles to address:
  - The is/ought problem: Can "this exists" (tradition) prove "this should be" (morality)? Nope - Hume demolished that centuries ago.
  - Moral dumbfounding: Devon's "grossed out" reaction may be post-hoc rationalized as moral concern.
  - Cultural relativism pitfalls: If "universal disapproval = wrong", we'd condemn interracial marriage too.
  - Distinguishing spheres: Personal aversion (valid for Devon) vs. moral condemnation (requires justification beyond taste).

  The user's frustration makes sense - they sensed Devon conflated categories but lacked philosophical vocabulary to separate them. This is less about "solving" ethics and more about mapping the fault lines in the argument. I should emphasize that while disgust can signal harm (rotting food), it's unreliable for social norms (see Nussbaum's work on disgust and oppression). 

  Ultimately the user seems to want confirmation that requiring harm-based justification isn't a cop-out - it's actually more intellectually consistent than appeals to tradition or visceral reactions. But they also want this delivered without dismissing Devon's feelings as invalid, just not morally authoritative.
answer: |-
  You've hit on a core tension in moral philosophy: **Can something be morally wrong *solely* because it violates tradition or triggers disgust, absent any harm?** Devon's argument that your standard "proves too much" and that universal historical/cultural disapproval "must count for something" deserves scrutiny. Let's break this down rigorously:

  ### 1. **The "No Harm" Standard Doesn't Prove Too Much**
     Devon claims your standard ("no harm + consent") would permit *anything* consensual (e.g., cannibalism, incest). This is a misunderstanding:
     - **Harm is broader than physical injury:** It includes psychological harm, exploitation, coercion, and undermining autonomy. Philosophers like John Stuart Mill (in *On Liberty*) argued that society may only intervene to prevent *harm to others* — but "harm" is carefully defined as tangible damage, not mere offense.
     - **Consent isn't magic:** Valid consent requires capacity, information, and freedom. Many acts Devon might invoke (e.g., consensual cannibalism) inherently involve harm (death/maiming) or coercion (e.g., power imbalances). Your standard *does* rule out acts where consent is impossible or meaningless.
     - **Your standard *does* condemn many things:** Fraud, coercion, neglect — all cause harm. Devon’s slippery slope ignores that "no harm" is a high bar most immoral acts fail to clear.

  ### 2. **Disgust ≠ Morality (The "Yuck Factor" Fallacy)**
     - **Disgust is psychological, not ethical:** Research (e.g., by Paul Rozin or Jonathan Haidt) shows disgust is a primal emotion evolved to avoid pathogens/contamination. It often misfires in moral contexts (e.g., disgust toward gay marriage or interracial relationships). Calling something "gross" is a feeling, not an argument.
     - **Moral Dumbfounding:** Haidt's experiments reveal people often condemn harmless acts (e.g., consensual sibling incest with contraception) but cannot justify it beyond "it’s wrong." This suggests disgust-driven intuition, not reasoned morality.
     - **Key distinction:** Devon's disgust is *his* reaction. Mara's marriage doesn’t harm *him*. Turning personal aversion into moral condemnation imposes his preferences onto others’ lives — which *does* risk harm (stigma, discrimination).

  ### 3. **Tradition/History ≠ Moral Authority (Appeal to Tradition Fallacy)**
     - **Universality is exaggerated:** Polyamory/non-monogamy have existed in many cultures (e.g., pre-colonial Indigenous societies, ancient Mesopotamia). Monogamous marriage norms are dominant but not universal.
     - **Tradition has been wrong *often*:** Slavery, marital rape, homophobia, and gender apartheid were all historically widespread and "traditional." Their past acceptance doesn’t make them right; it shows tradition can entrench injustice.
     - **Why universal disgust?** Possible explanations with *no moral weight*:
       - **Biology:** Sexual jealousy as an evolutionary trait.
       - **In-group cohesion:** Policing relationships maintains social control.
       - **Cultural inertia:** Norms persist because they’re norms (e.g., blue for boys/pink for girls is a 20th-century flip).
     - **Burden of proof:** If tradition is the *only* justification, it’s circular: "It’s wrong because it’s not done, and it’s not done because it’s wrong."

  ### 4. **When *Could* Disgust or Tradition Matter Morally?**
     They *might* signal underlying harm, but only if validated:
     - **Disgust as heuristic:** If disgust reliably correlated with harm (e.g., rotting food = disease), it could be pragmatic. But in social contexts, it’s notoriously unreliable (e.g., disgust toward interracial couples once enforced racist harm).
     - **Tradition as social fabric:** If abandoning a tradition *causes demonstrable harm* (e.g., dismantling democracy), it matters. But tradition *itself* isn’t the moral cause — the harm is. No evidence shows consensual non-monogamy inherently harms society.
     - **Moral particularism:** Some philosophers (e.g., Bernard Williams) argue that local practices shape moral identity. But this defends *existing* communities (e.g., Mara's choice), not imposing external judgments.

  ### The Verdict: Devon's Argument Fails Rigorous Scrutiny
  - **His disgust is personal:** Valid for his own relationships, but not a basis to condemn others.
  - **Tradition is inert:** Historical disapproval, without evidence of harm, is descriptive (this happened), not prescriptive (this *should* happen).
  - **Your standard holds:** Consensual acts between adults that cause no harm (physical, psychological, or social — like broken agreements) are not morally wrong. If Devon insists otherwise, the burden is on him to identify the *harm*. If he can’t, his objection reduces to "I don’t like it," which is preference, not ethics.

  ### Why This Feels Unresolved
  Devon likely experiences **cognitive dissonance**: His intuition ("this is wrong") clashes with your harm principle. Since he can’t articulate harm, he retreats to tradition/disgust as proxies. But morality requires more than reflexive discomfort. As philosopher Martha Nussbaum argues, disgust has a "conservative, hierarchy-reinforcing" function — it often targets marginalized groups. Rigorous ethics demands we move beyond "yuck" to "why?"

  **In short:** Yes, Devon's gut reaction *is* doing unexamined work dressed as moral argument. The sharper reply? *"Feelings and traditions can signal issues worth exploring, but they aren't moral proof. If an act causes no harm, calling it 'wrong' just because it's novel or unsettling confuses preference with principle — and risks harming consenting adults who've done nothing to deserve condemnation."*
