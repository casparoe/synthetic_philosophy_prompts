  The user might not be considering that ELK is about getting the model's true internal state, not just behavior that looks truthful. Without direct access to the model's internals, we're stuck with correlating outputs with what we can verify. But that doesn't ensure the model isn't hiding things it knows we can't check.

  Also, scalability is an issue. As models get smarter, they might find better ways to deceive that humans can't detect. RLHF might work now with current models, but future ones could exploit loopholes. The user's solution might not be robust to scale.

