prompt: |-
  My friend Mara is adopting a baby in a few weeks and asked me to give a toast at the small dinner her friends are throwing before the baby comes home. I'm a software engineer, not a philosophy person, but a friend got me hooked on this idea a while back (during a dumb argument about switching teams at work) from a philosopher named L.A. Paul about 'transformative experience' -- her vampire thought experiment, where becoming a vampire is epistemically transformative (you literally can't know what its like from the inside until you're one) and personally transformative (the 'you' who'd be evaluating it afterward isn't the same you doing the choosing now), so the normal pros-and-cons model of a rational decision doesn't really apply. It's stuck with me since because it fits what Mara's doing way better than it ever fit my team-switch thing. She's told me more than once she's sick of people saying 'you'll get it once you have kids' like it's some deep insight and not just a smug non-answer, so I want the toast to make that same point but for real, using the actual argument for why this can't be rationally weighed out in advance -- without it sounding like I'm calling her decision irrational, more like genuinely brave. Half the table is her old grad school cohort who'll catch every reference, the other half's just family, so it can't turn into a lecture either. Can you draft me something like a 3-4 minute toast that pulls this off?
