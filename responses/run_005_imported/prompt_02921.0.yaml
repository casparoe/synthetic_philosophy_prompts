  Names… let’s avoid gimmicks. "Alex" for conciliationist (neutral), "Sam" for steadfaster (sturdy). Factual dispute? Something trivial but debatable—like "Is Bermuda in the Caribbean?"—so the real focus stays on the meta-argument. 

