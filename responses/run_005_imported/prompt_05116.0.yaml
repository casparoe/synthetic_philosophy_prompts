answer: |-
  For your dissertation footnote on Gödel's combined argument (ontological proof + anti-mechanism → afterlife), here's a clear citation strategy based on the current scholarship:

  1.  **Cite the Letter Directly for the Informal "Rationality of the World" Argument:** Yes, **absolutely cite Gödel's letter to his mother (March 1961)**. This is the primary source where he explicitly connects his philosophical beliefs (rationalism, anti-mechanism, optimism) to the idea of an afterlife and the "rationality of the world." It's the closest you get to Gödel stating the *consequence* of his views for personal existence.
      *   **Source:** *Kurt Gödel: Collected Works, Volume V: Correspondence, H–Z* (Oxford UP, 2003), pp. 439-441 (Letter #69 to Adele Gödel, March 23, 1961?).
      *   **How to Cite:** "Gödel explicitly connects his belief in the rationality of the world and the limitations of mechanism to the possibility of an afterlife in his personal correspondence (Gödel, *CW V*, p. 440)."

  2.  **Cite the Gibbs Lecture for the Core Anti-Mechanism Argument:** This is the essential source for his mature, public argument that the mind is *not* a finite machine/turing machine/finite formal system.
      *   **Source:** *Kurt Gödel: Collected Works, Volume III: Unpublished Essays and Lectures* (Oxford UP, 1995), pp. 304-323 (*Some Basic Theorems on the Foundations of Mathematics and their Implications*, 1951 Gibbs Lecture). Focus especially on §7 (pp. 320-323) where he discusses the implications for mechanism.
      *   **How to Cite:** "Gödel's central argument against the mechanistic view of mind, based on the incompleteness theorems, is most fully developed in his Gibbs Lecture (Gödel, *CW III*, pp. 304-323, esp. §7)."

  3.  **Cite the Ontological Proof Manuscripts:** While unpublished, they are canonical primary sources for his modal argument for God's existence.
      *   **Source:** *Kurt Gödel: Collected Works, Volume III: Unpublished Essays and Lectures* (Oxford UP, 1995), pp. 388-404 (*Ontological Proof*).
      *   **How to Cite:** "Gödel's formal ontological argument for the necessary existence of a maximally perfect being is found in his unpublished manuscripts (Gödel, *CW III*, pp. 388-404)."

  4.  **Secondary Literature Confirming the Synthesis & Interpretation:**
      *   **Hao Wang:** Wang is crucial. He discussed Gödel's philosophical views extensively in conversation and his writings. Focus on:
          *   *Reflections on Kurt Gödel* (MIT Press, 1987): See pp. 195-196 where Wang explicitly states Gödel believed his anti-mechanism view, combined with his rational optimism (embodied in the ontological proof), implied an afterlife. Wang calls it the "rationalistic justification of belief in an afterlife."
          *   *A Logical Journey: From Gödel to Philosophy* (MIT Press, 1996): pp. 316-317 reiterates the point about mechanism, God, and afterlife. Also, pp. 104-108 discuss the letter to his mother and its context.
      *   **Juliette Kennedy:** Her work often touches on Gödel's Platonism and rationalism.
          *   "On the Philosophical Development of Kurt Gödel" (2003, *Bulletin of Symbolic Logic*) provides context.
          *   "Gödel's 1946 Princeton Bicentennial Lecture: An Appreciation" (in *Interpreting Gödel*, CUP 2014) discusses his rationalist optimism. While not directly on afterlife, it supports the "rationality of the world" mindset.
      *   **Palle Yourgrau:** *A World Without Time: The Forgotten Legacy of Gödel and Einstein* (Basic Books, 2005). Chapter 5 ("The Scandal of Big 'T' and Little 't'") discusses Gödel's idealism, Platonism, and belief in an afterlife, linking it to his incompleteness results and views on time. Cites the letter to his mother.
      *   **Solomon Feferman:** While often critical of Gödel's philosophical extrapolations, his introductions in the *Collected Works* (especially Vol. III & V) meticulously document the sources and context. The intro to Vol. V discusses the personal letters and their significance.

  **Recommended Footnote Structure:**

  > "Kurt Gödel privately synthesized his anti-mechanism argument (that the human mind surpasses any finite formal system, established in his Gibbs Lecture [Gödel, *CW III*, pp. 304-323, esp. §7]) with his rationalist conviction in the necessary existence of a maximally perfect being (explored in his ontological proof manuscripts [Gödel, *CW III*, pp. 388-404]) to conclude that the mind must transcend physical death. He articulated this connection explicitly in personal correspondence, framing it as a consequence of the 'rationality of the world' (Gödel to Adele Gödel, March 1961, in *CW V*, p. 440). For secondary analysis confirming this synthesis and its relation to Gödel's Platonism, see Wang (1987, pp. 195-196; 1996, pp. 104-108, 316-317), Yourgrau (2005, Ch. 5), and Feferman's introduction to *CW V*."

  **Key Considerations for Your Dissertation:**

  1.  **Clarity on Synthesis:** Emphasize that while Gödel *held* these beliefs and *implied* this connection (especially in the letter), he never published a single, formal treatise titled "Gödel's Proof for the Afterlife." The argument is a reconstruction based on his core philosophical positions and private statements. Wang is the best secondary source explicitly stating the connection Gödel made.
  2.  **Distinguish Published/Unpublished:** Be precise. The anti-mechanism argument was presented publicly (Gibbs Lecture, though unpublished during his life). The ontological proof was private. The afterlife conclusion was strictly private/personal (the letter).
  3.  **Potential Objections:** Briefly acknowledge (perhaps in the main text, not just the footnote) that this is a highly controversial interpretation of the *implications* of Gödel's theorems and philosophy, far outside mathematical consensus. Your focus is documenting Gödel's *personal belief* and its internal logic within his system.
  4.  **"Rationality of the World":** Using this phrase from the letter is perfect for connecting the formal arguments to the personal conclusion.

  Using Wang (1987/1996) + the letter (*CW V*) + the Gibbs Lecture (*CW III*) provides the strongest, most direct support for your claim about Gödel's *combined* argument for an afterlife as he presented it informally. This combination is standard in scholarship discussing Gödel's philosophical theology and beliefs.
