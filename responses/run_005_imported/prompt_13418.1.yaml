  Next, exceptions. Costly observation is one—if gathering data uses resources, the net benefit might be negative. Also, if the agent updates imperfectly, like violating Bayesian principles, the value could be negative. Processing costs or emotional impacts are practical exceptions. The user, being an experimental physicist, might relate to resource constraints in experiments.

