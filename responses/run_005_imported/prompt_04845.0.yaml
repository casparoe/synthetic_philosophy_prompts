answer: |-
  Here's a deep dive into the Harsanyi/Rawls decision-theoretic crux, designed for your sidebar:

  **The Shared Structure: The Veil Itself**

  Both Harsanyi (1953, 1955, 1977) and Rawls (1971) employ a foundational device:
  1.  **Impartial Choice:** Rational individuals select principles governing a society.
  2.  **Radical Ignorance (The Veil):** Choosers lack *any* knowledge of their specific place in that society – social status, class, wealth, natural talents, race, gender, conception of the good, etc.
  3.  **Goal:** To derive principles of justice that are fair, as no one can tailor them to their own advantage.

  **The Critical Divergence: Rational Choice Under Radical Ignorance**

  The core disagreement lies in *how* a rational agent reasons under this unique type of uncertainty:

  1.  **Harsanyi's Expected Utility Maximization (Average Utilitarianism):**
      *   **The Rule:** The rational chooser maximizes their *expected utility*. They calculate the average utility they would experience across all possible social positions.
      *   **The Assumption:** Harsanyi argues that behind the veil, with *no information whatsoever* about the likelihood of occupying any particular position, the rational assumption is that each position is *equiprobable*. This draws directly from the Laplacean "Principle of Insufficient Reason" (if you have no reason to think one outcome is more likely than another, assign them equal probability).
      *   **The Calculation:** The chooser evaluates each possible set of social principles by: (a) Estimating the utility level associated with *every* social position under those principles; (b) Summing these utility levels; (c) Dividing by the number of positions to get the *average utility*. They choose the principles yielding the highest average utility.
      *   **The Rationale:** Harsanyi viewed this as a straightforward application of Bayesian rational choice under uncertainty. He argued it embodies impartiality (all positions weighted equally) and rationality (maximizing expected payoff). Ignoring probabilities, he contended, would be irrational. The "strains of commitment" or uniqueness of the choice don't fundamentally alter the rational calculation of expected value. This yields **Average Utilitarianism**: Society should maximize the average level of welfare/utility.

  2.  **Rawls's Maximin Rule (The Difference Principle):**
      *   **The Rule:** The rational chooser adopts the *maximin* rule: they select the principles under which the *worst-off* position is as good as possible. They focus on maximizing the minimum possible outcome.
      *   **The Assumption:** Rawls *rejects* the applicability of probabilistic reasoning (especially the Principle of Insufficient Reason) behind the veil. He argues the ignorance is so profound that assigning *any* probabilities, even equal ones, is arbitrary and unjustified. This isn't calculable *risk* (with known or estimable odds) but profound *uncertainty*.
      *   **The Rationale for Maximin (Why it's "Rational" here):** Rawls justifies maximin as uniquely rational in the *specific, morally charged context* of the original position due to three key features:
          *   **The "Uniqueness and Gravitas" of the Choice:** This is a once-and-for-all, constitutive choice defining the basic structure of society. There are no "do-overs." Getting it wrong has catastrophic and irreversible consequences for real lives.
          *   **The "Strains of Commitment":** The principles chosen must be ones agents can realistically commit to and live under *no matter what position they end up in*. If someone ends up in the worst-off position under a chosen set of principles, they must still find those principles acceptable and bearable. Maximin directly addresses this by ensuring the worst-off position is as good as possible.
          *   **The Rejection of Probabilities:** Assigning equal probability to ending up as anyone is arbitrary. Why not weight by population share? Or potential? The veil precludes *any* basis for probabilistic assignment. Maximin avoids this problem entirely by focusing solely on possible outcomes, not their likelihoods.
          *   **Moderate Scarcity & The Avoidance of Intolerable Outcomes:** Rawls assumes conditions aren't so desperate that life is universally awful, nor so abundant that conflict disappears. In this context, rational agents prioritize avoiding the possibility of ending up in an *intolerably bad* position over chasing the possibility of a higher average or a fantastic best position. The potential loss (ending up destitute) vastly outweighs the potential gain (ending up wealthy) in moral significance. This reflects a *high, but not infinite*, degree of risk aversion specific to this high-stakes, foundational choice.
      *   **The Result:** This leads directly to Rawls's **Two Principles of Justice**, particularly the **Difference Principle**: Social and economic inequalities are only justified if they work to the *absolute greatest benefit of the least advantaged*.

  **The Core Dispute: Risk Aversion vs. Probability**

  *   **Harsanyi's Charge:** He saw maximin as embodying "**infinite risk aversion**." In ordinary decision-making (e.g., investing, career choices), people don't *only* consider the worst-case scenario; they weigh probabilities and potential gains. Applying maximin universally would lead to absurdly conservative choices (e.g., never driving a car due to the non-zero risk of a fatal crash). He argued Rawls illegitimately imports an extreme, irrational aversion to risk into the original position to rig the outcome against utilitarianism.
  *   **Rawls's Rebuttal:** He insisted he wasn't arguing for maximin universally, only under the *very specific, morally unique conditions* of the original position. The combination of profound uncertainty, the gravity/irreversibility of the choice, the strains of commitment, and the desire to avoid intolerable outcomes *justifies* an exceptionally high (but contextually appropriate) degree of caution. It's not "infinite" risk aversion because the goal is to make the worst-off *better off*, not to avoid risk at all costs. The context transforms what counts as rational.

  **Judgment: Does Rawls Block Utilitarianism or Just Relocate the Dispute?**

  Rawls's argument for maximin **does not decisively *block* Harsanyi's utilitarian conclusion on purely decision-theoretic grounds; it primarily *relocates* the underlying moral disagreement into a dispute about rational choice under profound uncertainty.**

  1.  **The Relocation Thesis is Strong:**
      *   The debate hinges entirely on whether the conditions of the original position warrant abandoning standard expected utility theory (EUT) for maximin.
      *   Harsanyi sees the veil as creating a calculable risk scenario (equal probability) solvable by EUT. Rawls sees it as creating radical uncertainty where EUT is inapplicable and maximin is prudent.
      *   **Which view you find persuasive depends heavily on prior intuitions:** If you believe the original position's ignorance *does* justify assigning equal probabilities (or some probabilities), Harsanyi wins. If you believe it creates a qualitatively different kind of uncertainty where probabilities are meaningless and the stakes demand extreme caution, Rawls wins.
      *   Choosing between EUT+equal probability and maximin *under the veil* isn't a neutral decision-theoretic exercise; it's deeply infused with moral intuitions about fairness, the weight of potential catastrophe, and the acceptability of probabilistic trade-offs for human lives at the foundational level. The choice of decision rule *encodes* the moral stance.

  2.  **Why Rawls Doesn't Fully "Block" Utilitarianism:**
      *   **Harsanyi's Probability Argument Persists:** Critics argue Rawls's rejection of probabilities is arbitrary. Why is ignorance *so* profound that equal probability is invalid, yet *not* so profound that we can identify and compare the utility levels of the worst-off? If we can compare social states enough to rank worst-off positions (required for maximin), why can't we use that same information to estimate averages or even reasonable probabilities? Rawls's stance on probability remains controversial.
      *   **Moderate Risk Aversion within EUT:** Harsanyi argued that even *within* an expected utility framework, incorporating a plausible degree of risk aversion (concave utility functions) could lead to choices sensitive to the worst-off without abandoning utilitarianism. Rawls's maximin jumps straight to an extreme corner solution.
      *   **The Strains of Commitment Cut Both Ways:** Couldn't a utilitarian argue that knowing society maximizes average welfare provides a strong, stable basis for commitment, even for the less well-off? Rawls assumes the worst-off would find maximin uniquely acceptable, but this is contested.

  3.  **Where Rawls Succeeds (Contextually):**
      *   He powerfully highlights the **qualitative difference** between everyday risks and the foundational choice of societal principles. His description of the uniqueness, irreversibility, and high stakes resonates morally.
      *   He successfully argues that maximin is **not inherently irrational** *in this specific context*, given his characterization of the uncertainty and the moral weight of avoiding disaster for the least advantaged. It becomes a *plausible* rational response, even if not the only conceivable one.
      *   He exposes that **Harsanyi's "equal probability" assumption is not neutral**; it smuggles in a consequentialist, aggregative moral logic that the veil was supposed to leave open. Rawls forces the question: *Why* is equal probability the rational default here? His answer is that it isn't, because the context demands a different kind of rationality focused on guaranteeing basic acceptability.

  **Conclusion for Your Sidebar:**

  The Harsanyi-Rawls debate demonstrates that the seemingly technical question of decision rules behind the veil of ignorance is where their fundamental moral disagreement crystallizes. Harsanyi sees a rational calculator optimizing average outcomes under assumed equal odds. Rawls sees a prudent guarantor insulating society against catastrophic moral failure under profound uncertainty. While Rawls constructs a powerful, context-specific justification for maximin that makes his difference principle cohere internally, he doesn't *refute* utilitarianism on purely decision-theoretic grounds. Instead, he shifts the battleground: the acceptability of maximin versus expected utility maximization *in the original position* ultimately depends on prior convictions about the nature of moral uncertainty, the weight we give to the worst-off, and the permissibility of probabilistic trade-offs in defining basic justice. The veil itself cannot resolve this deeper clash; it merely provides the stage for it.
