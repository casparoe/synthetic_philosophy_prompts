answer: |-
  Davidson's shift from his early radical interpretation framework to the "prior/passing theory" distinction in "A Nice Derangement of Epitaphs" (NDE) represents a significant refinement—not outright rejection—of his core project. Let's break down the work of the distinction and its implications for "shared language," then address the tension with the truth-theory picture.

  ### 1. **The Work of the Prior/Passing Distinction**
     - **Prior Theory**: What a speaker/hearer *believes in advance* about the meanings of words, syntax, and truth-conditions in the language they expect to encounter. It's their pre-interpretive competence (e.g., knowing standard English conventions).
     - **Passing Theory**: The *actual interpretation* required to make sense of a *specific utterance* in context. It's the theory that correctly assigns truth-conditions to *this* utterance, even if it violates conventions (e.g., interpreting Mrs. Malaprop's "derangement" as "arrangement").

     **Key Argumentative Work**:
     - **Malapropisms as Data**: Cases like "a nice derangement of epitaphs" → "a nice arrangement of epithets" show communication succeeds *without shared prior theories*. The hearer's prior theory expects standard meanings, but their passing theory adapts instantly to the speaker's idiosyncrasy.
     - **Divergence is Normal**: Speaker and hearer *always* have different prior theories (due to differing idiolects, background knowledge, etc.). Successful communication depends *only* on their passing theories converging *for that utterance*.
     - **No "Third Thing"**: Conventionalism posits a shared language (a "third thing") enabling communication. Davidson argues prior theories can't be this "thing" because they diverge, and passing theories are too transient and utterance-specific to constitute a stable, shared system.
     - **Conventional Competence is Insufficient**: Knowing conventions (prior theory) doesn't guarantee interpretation (e.g., malapropisms break conventions but are understood). Conversely, interpretation often succeeds *despite* convention violations.

  ### 2. **Why This Rejects "Shared Language"**
  Davidson targets the idea that communication requires mastery of a *fixed, shared set of rules* (conventions):
  - **Transience of Passing Theories**: Each utterance may require a unique passing theory. There's no enduring, public *system* to master—only momentary convergence.
  - **Idiosyncrasy is Ubiquitous**: Malapropisms aren't rare errors; they exemplify how interpretation constantly relies on contextual, non-conventional adjustments (e.g., metaphors, slips, neologisms).
  - **No Explanatory Role for Conventions**: If communication works via passing theory convergence alone, conventions become epistemologically redundant. We don't *need* to postulate a shared code to explain understanding.
  - **Conclusion**: "There is no such thing as a language" in the sense of a *pre-existing, convention-governed structure* that speaker and hearer must share for communication to occur. Linguistic competence isn't knowledge of conventions but the ability to generate context-specific passing theories.

  ---

  ### 3. **Tension with the Early Truth-Theoretic Picture?**
  There *is* tension, but Davidson aims to *reconfigure*—not abandon—the truth-theoretic approach.

  - **Early Picture (Radical Interpretation)**:
    - Understanding = constructing a *single* Tarski-style truth theory for the speaker's *entire language*.
    - Charity resolves belief/meaning underdetermination holistically.
    - Assumes a stable language (L) with compositional semantics.

  - **NDE Challenge**:
    - If passing theories are utterance-specific and prior theories diverge, there's no fixed language (L) to model with *one* truth theory.
    - Truth-theories must be radically localized: one per utterance (passing theory), not per speaker/language.

  ### 4. **Reconciling the Two: Relativized Truth Theories**
  Davidson suggests a path forward that retains truth-theoretic formalism while accommodating NDE:
  - **Passing Theories *are* Truth Theories**: Each passing theory *is* a Tarski-style theory for a micro-"language" (i.e., the idiolect-in-context for that utterance). It assigns truth-conditions compositionally but *only for that occasion*.
  - **Prior Theories as Fallible Starting Points**: Prior theories are truth-theories too (for the expected language), but they're provisional and often wrong. Charity operates *locally* to adjust them into passing theories.
  - **Compositionality Preserved**: Passing theories remain recursive—e.g., interpreting "derangement" as "arrangement" requires re-assigning lexical truth-conditions while preserving syntactic structure.
  - **No Stable "Language"**: The truth-theory picture survives, but its object changes: not a shared language (L), but a series of ephemeral, utterance-specific systems. "Mastery" is the ability to construct these on-the-fly.

  **Why This Isn't a Full Retreat**:
  - Truth-conditions remain central to meaning.
  - Compositionality is still necessary (to handle novel utterances).
  - Charity is still key (to resolve local indeterminacies).
  - The *form* of a truth-theory is retained but *relativized to utterance-events*.

  ---

  ### 5. **Residual Tensions and Implications**
  - **Radical Occasion-Sensitivity**: If every utterance requires a unique truth-theory, does "meaning" evaporate into contextual flux? Davidson bites the bullet: meaning is entirely occasion-sensitive. What endures is the *procedure* for constructing truth-theories.
  - **Psychological Reality**: Can speakers really compute a new truth-theory per utterance? Davidson views passing theories as rational reconstructions of interpretive competence, not conscious calculations.
  - **Charity's Scope**: In radical interpretation, charity holistically constrains a whole language. In NDE, it operates piecemeal per utterance. This localizes underdetermination resolution.
  - **Conventions Rehabilitated?**: While denying conventions are *necessary*, Davidson allows they're often *useful*: prior theories (grounded in conventions) are reliable heuristics. But they aren't constitutive of meaning.

  ---

  ### Conclusion: A Dialectical Evolution
  NDE doesn't refute Davidson's early view but refines it in response to the underdetermination problem pushed further: not just belief/meaning trade-offs, but the *instability* of linguistic norms. The truth-theoretic picture survives by shrinking its scope to the momentary and occasion-specific. What's discarded is the idea of language as a shared, durable object. The "tension" is productive: Davidson shows that truth-theories can model interpretation *only if* we treat them as dynamic tools for constructing utterance-specific meanings, not static representations of communal languages. For your seminar, emphasize this as Davidson *radicalizing* his project, not reversing it—pushing linguistic particularism to its limits while retaining formal semantics as the framework for understanding.
