  ```

  ### Key Rationale:
  - **Fundamentality anchor**: Problems grounded in **unavoidable math/physics** (Löb's theorem, probability theory, thermodynamics of compute) rank higher. These can't be "designed around"; they require accepting tradeoffs or approximations.
  - **Formalism dependence**: Problems more tied to **representational choices** (e.g., explicit logical symbols in five-and-ten, discrete timesteps in procrastination) rank lower, as alternative frameworks (e.g., neural networks, continuous-time models) often dissolve them.
  - **Practical evidence**: Issues observed in **real-world systems** (e.g., logical uncertainty in ML, grain-of-truth failures in RL multi-agent systems) were weighted higher than those primarily seen in toy models (e.g., procrastination paradox).

  This reflects my view that the deepest challenges stem from the mathematics of self-reference and boundedness—not specific implementations. That said, even "lower-ranked" problems remain nontrivial in practice!
