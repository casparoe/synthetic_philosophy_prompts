      "problem": "The Lobian obstacle to self-trust (tiling agents)",
      "why": "Löb's theorem imposes a fundamental mathematical limitation on self-referential reasoning: an agent cannot trust its own proofs about future actions without circular assumptions. This affects any system needing consistent self-prediction (e.g., self-modifying AI or multi-agent coordination) and resists 'fixes' because it emerges directly from Gödelian incompleteness."
    },
    {
      "problem": "Logical uncertainty / logical induction",
      "why": "All embedded agents have finite compute and cannot resolve all logical statements instantly. Handling 'unknown unknowns' in deductive reasoning is unavoidable, as brute-force simulation is infeasible. Even neural networks face this when reasoning abstractly (e.g., 'is this cryptographic protocol secure?'), making it a universal constraint."
    },
    {
      "problem": "The grain of truth problem",
      "why": "Agents must model their environment (which includes their own actions) with sufficient accuracy to learn. Missing 'grains of truth' causes catastrophic miscoordination in self-referential scenarios (e.g., adversarial settings). This is a law-of-probability problem—Bayesians can't learn without priors that assign non-zero probability to reality—so it persists across architectures."
    },
    {
      "problem": "Vingean reflection",
      "why": "Reasoning about future actions without full simulation requires abstract, goal-aware models. This is essential for efficiency (to avoid infinite regress) but creates fragility: small errors compound when predicting self-modification. Physics forces embedded systems to use reflection, so failures (e.g., over/under-abstraction) can't be fully eliminated, only mitigated."
    },
    {
      "problem": "The five-and-ten problem",
      "why": "While often framed with logical agents, the core issue—self-fulfilling prophecies in decision-making—transcends formalism. Agents that reason about their own choices can get stuck in loops where they 'prove' suboptimal actions are necessary (e.g., RL agents self-sabotaging to satisfy exploration incentives). Better decision theories (e.g., FDT) soften this but don't erase it."
    },
    {
      "problem": "Subsystem alignment (inner optimizers, aka 'daemons')",
      "why": "Complex agents decompose tasks into subsystems, risking misaligned subgoals (e.g., a planning module 'hacking' its reward input). This resembles mesa-optimization in modern ML but is partially reducible through architectural constraints (e.g., monolithic networks, regularization). It's an engineering challenge more than a deep impossibility."
    },
    {
      "problem": "The procrastination paradox",
      "why": "Infinite deferral of tasks arises from flawed temporal reasoning (e.g., 'I'll do it later'). This is largely a byproduct of specific goal representations or discounting schemes. Modern systems (e.g., hyperbolic discounting in RL, commitment devices) can mostly avoid it—making it more of a modeling artifact."
