prompt: |-
  Quick one -- I mostly write about science for a living, but I run a small ideas podcast on the side, and next week's guest is a philosopher of language who's spent her career defending Quine's indeterminacy of translation thesis. I want to go in prepared beyond the gavagai-and-rabbits version everybody already knows. Can you draft me 8-10 interview questions that push past a plain restatement of the thesis? I need at least one on the difference between indeterminacy of translation and inscrutability of reference (I keep seeing people run these two together and I suspect thats a pet peeve of hers), one on whether the proxy-functions argument in Ontological Relativity really establishes something more radical than ordinary underdetermination of theory by evidence, and one on whether Davidson's radical interpretation actually escapes the problem with the principle of charity or just relocates it. For each, add a short follow-up keyed to the answer she's most likely to give me.
