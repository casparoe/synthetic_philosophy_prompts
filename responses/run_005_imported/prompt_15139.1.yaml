  ## Memorandum: Re-evaluating the "Adam Smith Prize" - Recommendation & Historical Context  

  **To:** Economics Department Renaming Committee  
  **From:** [Your Name/Committee Member]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding the "Adam Smith Prize" & Colonial Legacy  

  **1. Purpose & Context:**  
  This memo addresses the petition to rename the "Adam Smith Prize" for the best senior thesis, citing Smith’s alleged role in providing "intellectual foundations for colonial exploitation." It evaluates Smith’s writings on colonialism, engages the petitioners’ strongest arguments, and provides a clear recommendation.  

  **2. Adam Smith on Colonies: A Nuanced Analysis**  
  Smith’s views on colonialism in *Wealth of Nations* (1776) are complex and require direct engagement:  

  *   **Fierce Critique of Colonial Exploitation:**  
      Smith relentlessly attacked the mercantile system and colonial monopolies (e.g., the East India Company). He condemned these as:  
      *   Economically inefficient ("a dead weight" on commerce).  
      *   Morally corrupt (citing "plunder and oppression" in India).  
      *   Politically dangerous (creating monopolies that distorted governance).  
      *"The government of an exclusive company of merchants is, perhaps, the worst of all governments for any country whatever"* (Book IV, Ch. 7). This critique is foundational to anti-*mercantilist* and anti-*corporate monopoly* arguments.  

  *   **The Proposed Solution: Integration, Not Independence:**  
      Smith’s alternative was **not decolonization**, but **imperial integration**. He advocated:  
      *   Granting colonies parliamentary representation ("a union with Great Britain").  
      *   Opening colonial trade to all British merchants.  
      *   Gradually extending British institutions to colonies.  
      His aim was efficiency and stability within the empire, not self-determination. *"A new form of union... would secure the dependency of the colonies"* (Book IV, Ch. 7).  

  *   **The Contradiction & Limits:**  
      While Smith exposed the brutality and inefficiency of colonial *management*, he did not fundamentally challenge:  
      *   **British Sovereignty:** He assumed continued British rule was inevitable/desirable.  
      *   **Land Dispossession:** His focus was on trade monopolies, not settler colonialism’s inherent violence.  
      *   **Racial Hierarchy:** His writings reflect 18th-century Eurocentric assumptions, though less virulently than many contemporaries.  

  **3. Engaging the Petitioners’ Strongest Argument**  
  The petitioners’ core claim is valid: **Smith’s economic theories *were* later weaponized to justify colonial exploitation.**  

  *   **Strongest Point:** Smith’s theories (division of labor, free markets, productivity) provided a *language and framework* used by 19th-century imperialists to argue:  
      *   Colonies were vital for markets/resources ("productive consumption").  
      *   "Free trade" could be imposed by force to "develop" colonies (e.g., Opium Wars).  
      *   Colonial subjects were "unproductive" or needed European guidance to enter the global market.  
      This *posthumous* distortion of his ideas contributed to exploitative policies, even if it contradicted his *specific* critiques of mercantile monopolies.  

  *   **Fair Assessment:** This argument holds historical weight. Smith’s abstract theories lacked safeguards against imperial co-option. His focus on efficiency within the imperial framework, rather than justice or sovereignty, created an intellectual vacuum filled by later exploitative ideologies.  

  **4. Recommendation: Rename & Reframe - The "Political Economy Prize"**  

  I recommend **renaming the prize**, but not solely due to Smith’s colonial stance. Instead, reframe it to better reflect the *critical spirit* the prize should embody:  

  *   **Why Change?**  
      *   **Honesty:** Keeping the name requires constant defense against valid critiques of Smith’s imperial blind spots, distracting from the prize’s purpose.  
      *   **Pedagogy:** Economics must grapple with its historical entanglement with power structures like empire. Renaming signals intellectual maturity.  
      *   **Inclusivity:** The current name alienates students aware of colonialism’s legacy. A new name fosters broader engagement.  
      *   **Accuracy:** Smith’s *solution* to colonial problems was imperial integration, not liberation. Honoring him *specifically* for anti-colonialism is historically inaccurate.  

  *   **Why Not "Many Perspectives" or "Just Economics"?**  
      Separating Smith’s "economics" from "politics" is artificial. *Wealth of Nations* is a work of *political economy* deeply engaged with power, institutions, and empire. Dismissing these concerns undermines the field’s critical tradition.  

  *   **The Third Way: "The Political Economy Prize"**  
      This name:  
      1.  **Honors the Field:** Emphasizes the core discipline integrating economics, history, and politics.  
      2.  **Encourages Critical Engagement:** Invites theses examining power, institutions, and historical context – the *spirit* of Smith’s inquiry, even when challenging his conclusions.  
      3.  **Avoids Hero Worship:** Focuses on rigorous analysis, not venerating a figure with complex, contested legacies.  
      4.  **Addresses the Petition:** Acknowledges that figures like Smith require critical examination, not uncritical celebration.  
      5.  **Maintains Prestige:** A serious, discipline-focused name preserves the award’s stature.  

  **5. Implementation**  
  *   **Contextualize the Change:** Announce the new name alongside a brief explanation: *"This change reflects our commitment to the critical study of political economy in all its dimensions, encouraging rigorous engagement with economic ideas, their historical contexts, and their consequences."*  
  *   **Educational Opportunity:** Host a seminar on Smith, colonialism, and the uses/misuses of economic theory, featuring the winning thesis.  

  **Conclusion**  
  Adam Smith’s critique of colonial monopolies was profound, but his vision remained imperial. His theories, detached from his specific warnings, later fueled exploitative ideologies. Renaming the prize to "The Political Economy Prize" honors the critical, interdisciplinary tradition Smith helped found, while moving beyond defending a contested historical figure. It elevates rigorous analysis itself as the prize’s core value. I urge the committee to support this change.  

  **Vote Recommendation:** **Rename the prize to "The Political Economy Prize."**
