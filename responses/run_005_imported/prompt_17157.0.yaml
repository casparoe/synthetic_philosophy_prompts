  For real-world applications like legal battles or arms races, both models offer insights but capture different aspects. The war of attrition better explains why parties persist in symmetric standoffs (e.g., territory disputes), while the dollar auction perfectly models sunk-cost traps where institutions create artificial penalties (e.g., litigation where both sides risk enormous costs beyond the dispute's value). 

