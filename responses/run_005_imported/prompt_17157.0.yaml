answer: |-
  Below is a systematic comparison of the War of Attrition (WoA) and the Dollar Auction (DA), addressing their formal structures, equilibria, and explanatory power. I conclude that **while both models capture escalation dynamics, they are structurally distinct and illuminate different aspects of "runaway" conflicts. The DA is not a pathological case of WoA but a distinct mechanism where institutional rules amplify commitment.**  

  ### **1. Formal Structures & Equilibrium Concepts**  
  #### **War of Attrition (WoA)**  
  - **Core Setup**:  
    - Two symmetric players compete for a resource of value *V*.  
    - Time is continuous; players accumulate costs *c(t)* until one quits.  
    - The winner gains *V* but pays the cost *c(t_w)* (time of opponent’s quit). The loser pays *c(t_q)* and gains nothing.  
  - **Cost Structure**: Costs accrue linearly (e.g., *c(t) = kt*).  
  - **Equilibrium**:  
    - **Mixed ESS**: No pure strategy is stable. Players randomize persistence times *T* using a continuous distribution (e.g., exponential CDF: *F(t) = 1 − exp(−t/λ)*).  
    - **Key Insight**: Expected payoff must be zero at equilibrium (*V = E[cost]*). Players "bluff" via unpredictable persistence.  

  #### **Dollar Auction (DA)**  
  - **Core Setup**:  
    - A dollar bill (value *V*) is auctioned under modified rules:  
      - Winner pays their bid and receives *V*.  
      - Second-highest bidder pays their bid but receives *nothing*.  
    - Bidding is discrete (increments *ε*), starting at *0*.  
  - **Escalation Driver**: Sunk costs + the "punishment rule" for second place.  
  - **Equilibrium**:  
    - **No Nash Equilibrium in pure strategies**: Rational players bid past *V* to avoid losses.  
    - **Subgame-Perfect Equilibrium (SPE)**:  
      - For bids *b > V*, players bid *b + ε* if *b < 2V* (to limit loss to *V*).  
      - **Irrational Outcome**: Bidding escalates to *2V* (e.g., $2 for a $1 prize).  

  ---

  ### **2. Critical Comparison: Structural Divergences**  
  | **Feature**               | **War of Attrition**                          | **Dollar Auction**                          |  
  |---------------------------|-----------------------------------------------|---------------------------------------------|  
  | **Time/Bidding Structure** | Continuous time; costs accrue passively.     | Discrete bids; costs are actively chosen.   |  
  | **Symmetry**              | Players symmetric; roles identical.          | **Asymmetric roles**: Leader (high bidder) vs. follower (second-highest). |  
  | **Cost Imposition**       | Mutual cost accrual.                         | **Targeted punishment**: Only the loser pays without reward. |  
  | **Equilibrium Logic**     | ESS via randomization (no optimal *t*).      | SPE via backward induction (beyond *V*).   |  
  | **Exit Option**           | Either player can quit unilaterally.         | **Lock-in effect**: Second-highest bidder is trapped. |  

  **Why DA ≠ WoA**:  
  - The DA’s **asymmetric punishment** and **discrete bidding** create a unique trap: The second-highest bidder faces a *marginal* decision to bid *ε* more to avoid a *certain* loss. This has no analogue in WoA, where costs are symmetric and continuous.  
  - WoA’s randomization is evolutionarily stable; DA’s escalation stems from **institutional rules** forcing irrationality.  

  ---

  ### **3. Explanatory Power for Real-World Escalation**  
  #### **War of Attrition Better Explains**:  
  - **Symmetric standoffs** with passive costs:  
    - *Animal contests* (e.g., antler locking in deer).  
    - *Human examples*: Protracted strikes, R&D races (e.g., pharmaceutical firms persisting in drug development despite mounting costs).  
  - **Why?** WoA captures organic persistence under uncertainty without artificial rules.  

  #### **Dollar Auction Better Explains**:  
  - **Institutionally driven traps** with sunk-cost fallacies:  
    - *Litigation*: Both sides overspend to avoid "losing" after legal fees exceed the dispute’s value.  
    - *Price wars*: Firms match competitors’ discounts to avoid losing market share, even if unprofitable.  
    - *Auctions*: eBay-style bidding wars where pride/sunk costs dominate.  
  - **Why?** DA explicitly models the **lose-lose logic** of "pay to avoid loss," mirroring human institutional design flaws.  

  #### **Hybrid Cases (Arms Races, Climate Negotiations)**:  
  - **WoA applies** to symmetric persistence (e.g., Cold War missile stockpiling).  
  - **DA applies** when penalties for "second place" exist (e.g., trade wars where tariffs escalate to punish rivals).  

  ---

  ### **4. Why Prefer One Model Over the Other?**  
  | **Criterion**              | **War of Attrition**                          | **Dollar Auction**                          |  
  |----------------------------|-----------------------------------------------|---------------------------------------------|  
  | **Biological Plausibility** | High: Aligns with ESS in animal behavior.     | Low: Requires cognitive awareness of rules. |  
  | **Human Institutional Fit**| Limited: Assumes symmetric costs.             | **High**: Captures designed traps (e.g., auctions, legal systems). |  
  | **Predictive Power**       | Explains persistence distribution.            | Explains **why escalation exceeds value**.  |  
  | **Pathology**              | Evolutionarily stable.                        | **Truly pathological**: Rules induce irrationality. |  

  **Verdict**:  
  - For **animal contests or symmetric human conflicts**, WoA is superior.  
  - For **human escalation driven by institutional rules** (e.g., auctions, litigation), DA is more illuminating. Its "punishment rule" uniquely explains why parties bid beyond value.  

  ---

  ### **Conclusion**  
  The resemblance between WoA and DA is superficial: Both involve escalating costs, but their mechanisms differ fundamentally. The DA is **not** a pathological WoA; it is a distinct game where institutional rules transform rational actors into victims of their own commitments. For human runaway escalation (e.g., litigation, trade wars), the Dollar Auction’s focus on *asymmetric punishment* offers sharper insights, while the War of Attrition better explains organic, symmetric standoffs. Their complementary use—WoA for persistence dynamics, DA for designed traps—provides the most comprehensive lens for real-world conflicts.
