  First, I need to make sure I understand Williamson's argument correctly. The luminosity thesis claims that if you're in a state (like feeling cold), you know you're in that state. Williamson uses a sorites-like scenario: from cold to hot in small increments. Because of inexact discrimination, knowing you're cold at time t requires that you also feel cold at t+1 to avoid error. Chaining this leads to a contradiction when you reach a hot state. Applying this to knowledge itself (KK principle: knowing implies knowing that you know) leads to its rejection.

