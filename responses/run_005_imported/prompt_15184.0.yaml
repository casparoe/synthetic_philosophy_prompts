  So I've fallen down a rabbit hole reading about intuitionism for a philosophy of math elective, and I ran into a claim I can't quite wrap my head around: apparently in Brouwer's intuitionistic analysis, every total function from the reals to the reals ends up being continuous, and on something like [0,1] it's even uniformly continuous. There's an actual theorem ruling out anything like a step function existing as a legitimate function at all. Classically that's obviously false -- I can write down a discontinuous function in about five seconds -- so this isn't just "intuitionists can't prove X exists," it sounds like they're actively proving the negation of a perfectly good classical theorem, which is kind of wild for a foundational stance that I always thought of as just "classical math, but more careful about what counts as a proof."

  My professor mentioned this comes out of Brouwer's choice sequences plus the fan theorem and bar induction, but when I looked those up I just got lost in the machinery of spreads and neighbourhood functions. I don't need the fully rigorous derivation -- what I want is the gut-level story: why does thinking of a real number as an open-ended, in-progress "choice sequence" rather than a completed infinite decimal basically force any function defined on it to be continuous? And seperately, why does this count as intuitionism genuinely contradicting classical math, rather than just being a weaker, more cautious fragment of it (which I gather is NOT true of Errett Bishop's constructive math, even though that's also supposed to be "constructive")? Would love a walkthrough of what's actually going on here.
