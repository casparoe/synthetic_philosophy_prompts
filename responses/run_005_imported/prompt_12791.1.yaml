      "b": "Strong explanation of Systems Reply and Searle’s counter. Correctly identifies causal hookup argument. Misses Searle’s 'internalization' move (man memorizing rules = system *still* lacks understanding). Otherwise precise.",
      "c": "Defends Searle but fails to engage with core weakness: Searle *assumes* biological grounding solves semantics without proving it. No acknowledgment of functionalist counterarguments (e.g., how brains avoid the same critique). Overstates conclusion ('no digital computer will ever think')."
