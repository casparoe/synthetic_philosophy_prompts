answer: |-
  You've nailed the core tension perfectly, and your undergrad recollection is surprisingly sharp! The Popper/evolution debate is indeed nuanced and often oversimplified. Let's untangle it and see what it means for the "just-so story" charge in evolutionary psychology.

  **Popper's Evolving Position on Darwinism:**

  1.  **Initial Skepticism (Pre-1970s):** Popper's core philosophy demanded that scientific theories be **falsifiable** – capable of being proven wrong by empirical evidence. His primary target was pseudoscience and Marxism/Freudianism, which he saw as unfalsifiable. He *initially* grouped Darwinian natural selection with these, arguing:
      *   **The Tautology Problem:** "Survival of the fittest" seemed circular to him. How do we define "fittest"? As those who survive and reproduce. So, "the fittest survive" becomes "those who survive, survive." This, he argued, made it unfalsifiable – any outcome could be explained *post hoc* by defining the survivors as the fittest.
      *   **Distinction Between Fact and Mechanism:** Crucially, Popper *always* accepted **evolution as a historical fact** (descent with modification) based on overwhelming evidence (fossils, biogeography, homology). His target was specifically **natural selection as the *primary mechanism* driving adaptation and complexity.** He saw it as a "metaphysical research programme" – useful, inspiring, but not strictly scientific by his falsifiability criterion.
      *   **The "Just-So Story" Charge Precursor:** This is where his critique directly feeds into the modern evo psych debate. He worried that adaptive explanations were often untestable historical narratives concocted after the fact.

  2.  **The Shift/Clarification (1970s onwards):** Facing significant criticism from biologists (like Ernst Mayr and John Eccles) and philosophers, Popper revisited his position. His key statements are in essays like "Natural Selection and the Emergence of Mind" (1977):
      *   **"Unhappy" with Previous Formulation:** He explicitly stated he had been "misinterpreted" and that he was "very unhappy about" his earlier characterization of natural selection as tautological and non-testable.
      *   **Acknowledging Testability:** He conceded that **specific hypotheses *derived from* the theory of natural selection *are* falsifiable.** For example:
          *   Predictions about trait frequency changes under specific selective pressures (e.g., industrial melanism in moths).
          *   Predictions about vestigial structures or imperfect adaptations.
          *   Predictions from mathematical models of population genetics.
      *   **Natural Selection as a Framework:** His revised view positioned natural selection not as a single, monolithic theory easily falsified in one go, but as a **powerful, unifying *framework* or *research programme*** (a concept he developed, influenced by Lakatos). Within this framework, numerous specific, testable hypotheses could be generated and subjected to falsification.
      *   **The "Recantation" Nuance:** He didn't fully abandon his core concerns. He maintained that the *core proposition* of natural selection (differential survival/reproduction leading to adaptation) might be difficult to falsify *directly* in a single, decisive experiment, *especially for complex historical events*. However, he now fully accepted that the *framework* was scientific because it generated a vast array of testable consequences and could be *corroborated* by evidence, even if not definitively proven true.

  **Popper's Considered Position:**

  *   **Evolution (Descent with Modification):** Accepted as a well-corroborated historical fact.
  *   **Natural Selection as the Primary Mechanism:** Accepted as the central, scientifically valid *framework* for explaining adaptation and complexity. While the *core logic* might have metaphysical elements (difficulty of absolute falsification for ancient events), it functions scientifically because it **generates falsifiable predictions at lower levels** (specific adaptations, population changes, genetic models). Its explanatory power and the success of its derived hypotheses provide strong corroboration.

  **Implications for the "Just-So Story" Charge in Evolutionary Psychology:**

  Popper's framework provides **both ammunition for critics *and* a path forward for defenders, but emphasizes rigor.** It's **not** a wash; it sets a high bar:

  1.  **The Core Validity of the Charge (Critic's Point):**
      *   Popper's initial concern about *untestable historical narratives* is **directly applicable** to poorly done evo psych. If an adaptive hypothesis *only* offers a plausible-sounding story about why a trait *might* have been adaptive in the Pleistocene, without generating **unique, testable predictions** that could potentially *disprove* it against alternative explanations (cultural, developmental, non-adaptive evolutionary like genetic drift, or different adaptive functions), then Popper would likely dismiss it as "metaphysical" or pseudoscientific – a true "just-so story."
      *   Evo psych faces unique challenges: the "fossil record" for behavior/cognition is sparse, the EEA is reconstructed indirectly, current environments often mismatch ancestral ones, and traits are complex products of many genes. This makes generating *strongly falsifiable* predictions harder than for, say, beak size in finches.

  2.  **Defending Evo Psych (Within Popper's Framework):**
      *   **Specific Hypotheses Can Be Testable:** Popper's shift shows that complex historical frameworks *can* be scientific if they generate testable hypotheses. Evo psych *can* meet this bar. Defenders must demonstrate that *their specific hypotheses* lead to predictions that are:
          *   **Falsifiable:** What evidence would prove this hypothesis *wrong*? Can competing hypotheses (e.g., cultural transmission, byproduct of another adaptation) be ruled out?
          *   **Novel:** Do they predict something unexpected beyond just explaining existing data?
          *   **Rigorous:** Using methods like:
              *   Cross-cultural universality (controlling for cultural diffusion).
              *   Specific neurocognitive or physiological markers linked to the proposed function.
              *   Behavioral experiments manipulating cues of ancestral adaptive problems (e.g., cues of infidelity triggering jealousy responses).
              *   Identifying design features predicted by the adaptive problem (e.g., jealousy mechanisms being sex-differentiated *in precisely the ways* predicted by paternity uncertainty vs. resource diversion).
              *   Genetic correlations and heritability studies relevant to the trait.
              *   Comparative psychology (where ethically feasible and phylogenetically appropriate).
      *   **It's About the Hypothesis, Not the Whole Field:** Popper wouldn't condemn "evolutionary psychology" *in toto* any more than he condemned evolutionary biology. He would judge *individual hypotheses and research programmes* based on their testability and empirical support.

  3.  **The Principled Way Forward (Using Popper):**
      *   **Beyond Plausibility:** A well-supported adaptive hypothesis must go beyond mere "this makes sense." It must make **risky predictions** – predictions that could fail and thus falsify the specific adaptive explanation.
      *   **Key Questions from a Popperian Lens:**
          *   **What specific, observable phenomena does this hypothesis predict that *would not* be predicted by the main alternative explanations?** (e.g., If jealousy is an adaptation for paternity certainty, what *specific* sex differences in triggers, intensity, or behavioral outcomes does it predict that wouldn't arise from general attachment anxiety or cultural norms alone?)
          *   **What evidence would definitively *falsify* this specific adaptive claim?** If no such evidence is conceivable, it's likely untestable.
          *   **Can the predictions be tested with available (or foreseeable) methods?** If not, it might be untestable *in practice*, even if falsifiable in principle.
          *   **Does the hypothesis explain *more* than just the phenomenon it was invented to explain?** Can it predict new findings?
      *   **Distinguishing Well-Supported from Untestable:**
          *   **Well-Supported:** Generates novel, falsifiable predictions that survive rigorous testing against alternatives. Uses multiple lines of converging evidence (e.g., cross-cultural, experimental, physiological). Acknowledges limitations and alternative explanations. (Example: Well-designed studies on sex differences in jealousy triggers that control for cultural factors and measure specific physiological responses).
          *   **Untestable ("Just-So Story"):** Relies solely on *post hoc* plausibility. Fails to generate unique, falsifiable predictions. Vague about what evidence would disprove it. Ignores plausible non-adaptive or alternative adaptive explanations. (Example: "Music evolved to promote group cohesion" without specifying *how* this would be tested against "music is a byproduct of other cognitive adaptations" or "music is purely cultural," and without predicting specific, testable features of music cognition tied uniquely to group cohesion).

  **Conclusion for Your Longread:**

  Popper's history shows that labeling an entire field like evolutionary psychology (or even natural selection itself) as "unfalsifiable" is **too blunt an instrument.** His mature view recognizes that complex historical sciences operate via testable hypotheses *within* a broader framework. However, he provides **devastatingly effective ammunition** against *specific* adaptive hypotheses in evo psych (or any field) that fail to generate falsifiable predictions.

  **The key takeaway is rigor:** The "just-so story" charge sticks when hypotheses are merely plausible historical narratives. It loses force when hypotheses make specific, novel, and falsifiable predictions that are then rigorously tested against alternatives. Your job is to scrutinize each evo psych claim not by dismissing the field wholesale, but by asking: **"What unique, testable, and potentially falsifiable predictions does *this specific* hypothesis make, and how well have those predictions held up against evidence and competing explanations?"** Popper gives you the philosophical grounding to demand this level of rigor and to distinguish science from storytelling. The standoff persists because both sides often talk past each other – critics attack weak examples as representative, defenders point to rigorous examples while ignoring the field's methodological challenges. Popper's framework forces the focus onto the testability of *specific claims*.
