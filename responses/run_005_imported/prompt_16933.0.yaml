  Okay, let me start by unpacking the user's query. They're in a seminar on political obligation and civil disobedience, focusing on Simmons and Wolff. The core issue is whether the failure to justify a general political obligation leads to the conclusion that individuals can freely break any law they find inconvenient. The user's study group is stuck on this, and they need to write a response paper.

  First, I need to recall Simmons' and Wolff's arguments. Both reject all standard justifications for political obligation—consent, gratitude, fair play, natural duty. Wolff adds the autonomy argument. Their conclusion is philosophical anarchism: no general duty to obey the law. But the user's group thinks this implies moral permission to disobey any law for personal reasons. The challenge is to explain why that doesn't follow.

  I remember Simmons distinguishes between the state's lack of authority and the absence of all moral reasons to obey. Philosophical anarchism doesn't mean no reasons ever apply; it means no general obligation. So, even without authority, other moral considerations (like consequences or fairness) could still require compliance in specific cases.

  Next, the user might be conflating the absence of a general duty with the absence of any moral constraints. But Simmons would argue that moral reasons are context-dependent. For example, breaking a trivial law might be permissible, but violating laws against violence harms others, invoking different moral principles. The key is that the reason to obey comes from morality, not the law's authority.

  Also, the user's scenario mentions breaking laws based on personal judgment of inconvenience. But Simmons would caution against self-interested disobedience. Moral decisions should consider all relevant factors, not just personal convenience. Even without political obligation, moral duties like not harming others or fair play in cooperative schemes still apply.

  Wolff's autonomy argument adds that true moral autonomy requires rational assessment of each action, not blind obedience. But this doesn't mean ignoring moral reasons; it means evaluating them independently. So, a person must still weigh the moral implications of their actions, even if the law itself isn't binding.

  The user might also miss the distinction between particular and general obligations. Philosophical anarchism denies a blanket duty to obey all laws but allows for specific obligations arising from other sources. For instance, participating in a just cooperative practice might create a duty via fair play, even without consent.

  In drafting the response, I should structure it to clarify these points: the nature of philosophical anarchism, the persistence of moral reasons, and the fallacy of equating no authority with no constraints. Emphasizing Simmons' actual position versus the misinterpretation will help the user see where their group's reasoning went astray.
answer: |-
  You've hit on a crucial tension in philosophical anarchism, and your study group is wrestling with precisely the right question. Simmons (and Wolff) would firmly reject the conclusion that "a person is morally free to break any law she judges sufficiently unwise or inconvenient for herself." This is indeed a misunderstanding of "philosophical anarchism" as they defend it. Here's why the inference fails and what Simmons would actually say:

  **Where the Reasoning Goes Wrong:**

  1.  **Conflating "No General Obligation" with "No Moral Reasons Ever":** This is the core error. Simmons denies there is a *general, content-independent, prima facie obligation to obey the law simply because it is the law* (political obligation). This does **not** mean there are *no moral reasons whatsoever* to obey any particular law in any particular circumstance. He explicitly argues that many moral reasons *other than* a supposed "duty to obey the law" will often (even usually) require compliance.
  2.  **Misunderstanding "Philosophical Anarchism":** For Simmons, philosophical anarchism is the view that *states lack legitimate authority* (meaning they lack the moral right to command and the correlative obligation of citizens to obey). Crucially, he argues this does **not** entail:
      *   That all states are equally bad or tyrannical.
      *   That citizens have no moral reasons to comply with laws.
      *   That violent revolution or widespread lawlessness is justified.
      *   That individuals are morally free to do *whatever they please* regardless of the law.

  **What Simmons Would Say About How Citizens Are Entitled to Act:**

  Simmons emphasizes that the absence of political obligation **does not create a moral vacuum.** Citizens must still make moral decisions about obedience/disobedience on a case-by-case basis, weighing *other* relevant moral considerations:

  1.  **Moral Duties (Not Political Obligations):** Citizens still have universal moral duties that often align with the law:
      *   **The Duty Not to Harm Others:** This is a powerful reason to obey laws against murder, assault, theft, fraud, reckless driving, etc. Disobeying such laws usually violates this core duty. The reason to obey isn't "because it's the law," but "because stealing harms someone."
      *   **The Duty of Justice:** Supporting just institutions (even if you never consented to them) can be a moral requirement. Obeying laws that sustain basic justice (like those funding courts or social safety nets) might be required by this duty, *if* the state is reasonably just. (He's more skeptical about Fair Play creating a *general* obligation, but acknowledges it can create *specific* obligations in tightly defined cooperative schemes).
      *   **The Duty of Fidelity (in specific cases):** If you *do* explicitly consent to something (e.g., signing a contract governed by state law), you have a duty to keep that promise.
      *   **The Duty of Beneficence/Non-Maleficence:** Consider the consequences. Will your disobedience cause significant harm, chaos, or undermine valuable social coordination (even if imperfect)? Does compliance prevent harm or promote good?

  2.  **The Relevance of Law's Content:** Laws aren't arbitrary commands from a moral perspective. Many laws prohibit morally wrong acts (murder) or mandate morally right acts (paying compensation for harm caused). Obeying these laws is morally required *because of what they prohibit or require*, not because of the state's authority. Disobeying a morally good or neutral law *merely for convenience* might be permissible in some cases (if no harm is done), but disobeying a law prohibiting a morally wrong act is *still morally wrong* – the duty not to murder exists independently of the law against murder.

  3.  **Prudence and Practicality:** Simmons acknowledges that prudential reasons (avoiding punishment) and the practical need for social order often make compliance the sensible choice, even if not strictly morally *obligatory* in every instance due to political obligation. This isn't a *moral* reason, but it's a real factor in decision-making.

  4.  **Distinguishing Disobedience:** Simmons carefully distinguishes:
      *   **Ordinary Disobedience (e.g., jaywalking, minor tax evasion out of greed):** This might sometimes be morally permissible *if* it violates no other duty and causes no harm, precisely *because* there's no general obligation. But often, it *will* violate other duties (fairness, not freeloading on others' compliance, potentially causing minor harms).
      *   **Civil Disobedience (public, non-violent, conscientious breach aimed at reforming law/policy):** This might be *morally justified* under specific conditions (e.g., protesting a serious injustice) precisely *because* there's no general obligation, and higher moral duties (justice) take precedence. The justification comes from the *reasons* for disobedience, not the absence of obligation per se.
      *   **Criminal/Immoral Acts (murder, theft):** Disobeying these laws remains morally wrong *because the acts themselves are wrong*, regardless of the state's authority. The absence of political obligation doesn't magically make murder okay.

  **Why "Inconvenience" Isn't Enough:**

  Simmons would argue that judging a law "sufficiently unwise or inconvenient for herself" is *not* a sufficient moral justification for disobedience. Why?

  *   **Selfishness vs. Morality:** Disobeying solely for personal convenience ignores potential harms to others (violates non-maleficence) or freeloading on the cooperative efforts of others (potential fairness violation).
  *   **Lack of Moral Scrutiny:** The philosophical anarchist position demands *more* conscientious moral deliberation, not less. Wolff's autonomy argument emphasizes that individuals must take *personal moral responsibility* for their actions. Blindly following the law is wrong, but so is blindly disregarding it for selfish reasons. True autonomy requires rationally assessing *all* relevant moral reasons in each situation – including the duties listed above.
  *   **Trivializes the Law:** Breaking any law at whim based on personal inconvenience treats the entire legal framework with contempt and ignores the complex web of social coordination and reliance it represents, potentially causing harm or unfairness even with minor infractions.

  **In Conclusion:**

  Simmons would say: "You are *not* generally morally bound to obey the law *just because it is the law*. The state lacks that kind of authority. However, you are still morally bound by all the usual moral principles that apply to human interaction. When deciding whether to obey a particular law, you must carefully consider whether obeying (or disobeying) that law is required, permitted, or forbidden by *those underlying moral principles* (duties not to harm, duties of justice, fairness in specific contexts, fidelity to promises, beneficence, etc.). Disobeying a law *merely* because it's inconvenient for you, without regard to these other moral considerations, is almost never justified. Philosophical anarchism liberates you from blind obedience, but it burdens you with the full weight of personal moral responsibility for each act of disobedience."

  Your study group's objection is correct: the inference ("no political obligation, therefore free to break any law for personal convenience") is a non-sequitur. It ignores the vast landscape of moral reasons that persist even after the specific structure of "political obligation" is dismantled. Simmons's anarchist conclusion is far more nuanced and morally demanding than simple lawlessness.
