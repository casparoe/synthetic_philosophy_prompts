prompt: |-
  For my Buddhist philosophy seminar we've been stuck in the Mulamadhyamakakarika for what feels like a month now, and this Friday my professor's bringing in a Madhyamaka scholar over Zoom who defends the "paraconsistent" reading of the catuskoti -- the idea that when Nagarjuna rejects all four corners (it is, it isn't, it's both, it's neither) about stuff like whether the Tathagata exists after death, some of those rejections are meant to land on genuine true contradictions, not just signal that ordinary bivalent logic doesn't apply to conventional reality. It's basically the Garfield/Priest line, and half the seminar thinks it's the only reading that takes the text seriously as philosophy instead of mysticism, and the other half thinks its an anachronism the Prasangikas themselves (Tsongkhapa and co.) would've rejected, since on their reading each corner only gets denied under a reified, svabhava-loaded interpretation, not in its plain sense.

  I'm one of three people assigned to draft questions for the Q&A and I really don't want us to just have him restate the view, since he's obviously said all of this in print already. Could you write me 8-10 interview questions that push on the hard parts? I want at least one that makes him spell out the difference between "genuine contradiction" and "negation of only the reified reading of each horn" without that difference collapsing into a verbal dispute; one on the self-refutation worry -- there's a verse later in the text (13.8, I think?) where Nagarjuna says holding emptiness itself as a view makes you basically incurable, so how does asserting "some contradictions are literally true" not count as exactly that kind of view; one on how his reading fits with the Prasangika "no thesis" self-description, given Candrakirti's insistence that Madhyamikas only draw out the absurd consequences of other people's positions and assert nothing of their own; and one connecting the catuskoti's use on specific questions like the fate of the Tathagata to whether it's meant as a fully general schema for any proposition whatsoever. Also, for each question, add a short follow-up keyed to whatever answer he's most likely to give -- our professor keeps saying the first answer is never the interesting part, and I'd rather not find that out live.
