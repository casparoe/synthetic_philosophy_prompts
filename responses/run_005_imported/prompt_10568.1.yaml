prompt: |-
  So in my ethics seminar we just finished a two week unit on "why do promises bind" — we read Hume's stuff on promises as an artificial virtue and then Scanlon's Fidelity principle from What We Owe to Each Other — and it bled into real life this week because two people in my study group, Marcus and Sana, got into it over a story Marcus told at lunch. On his deathbed, his grandpa made Marcus promise, privately, with literally no one else in the room, that he'd secretly redirect a chunk of the inheritance to a cousin the rest of the family can't stand, instead of splitting everything evenly like the will technically says. Grandpa died about an hour later. No one alive knows the promise was ever made, so Marcus could just split things "fairly" and there'd be zero social fallout, ever.

  Here's roughly how the argument went (paraphrasing, but I think this is fair to both of them):
  (1) Sana said Marcus is obviously still bound, and that this actually confirms the class's "expectation" reading of Scanlon — promises bind because you deliberately get someone to rely on you, and breaking that reliance is a kind of exploitation of trust, so what matters is the expectation you created in your grandfathers mind before he died.
  (2) Marcus said that can't be right, since his grandfather is now dead and literally cannot be disappointed, relieved, or affected by anything that happens afterward — there is no expectation left anywhere in the universe to violate — yet it obviously still feels wrong to break the promise, so the wrongness can't be located in an expectation.
  (3) Sana said the expectation existed at the moment of promising and that's sufficient, the same way we still think you can wrong someone by defaming them after they've died even though they can't feel betrayed anymore.
  (4) Marcus said that move quietly changes the theory from "don't violate expectations" into "don't violate whatever expectations you once created, forever, even once its metaphysically impossible to violate them" — which just sounds like a complicated way of saying promises bind because you willed an obligation into existence, period, closer to the "normative power" view (the sort of thing Raz and Owens gesture at) he'd been defending from the start.
  (5) Sana said that's a false choice, because a pure will/power view can't explain why promises extracted through obvious manipulation, or made as a joke both people understand isn't serious, fail to bind — while the expectation view explains this easily, since no reasonable reliance gets created in those cases.
  (6) Marcus didn't really have a comeback for that one, but held that whatever the full story turns out to be, it can't be fundamentally about expectations, since his case shows the obligation surviving the total, permanent destruction of any expectation there is left to violate.

  Neither of them budged and I genuinely think they're each landing real punches on the other. Could you go through the exchange move by move, (1) through (6), and say who has the better of it at each step and why? Then tell me whether any single theory of promissory obligation we discussed actually survives the grandfather case as it stands, or whether it needs some third ingredient neither of them mentioned — and if so what that would be. End with a one-line verdict in the form \verdict{Marcus}, \verdict{Sana}, or \verdict{Neither}, for whoever comes closest to being right overall about why the promise still binds.
reasoning: |-
  Okay, let me unpack this ethics debate between Marcus and Sana about deathbed promises. The grandfather case is fascinating because it isolates the core tension in promissory obligation theories by removing all social consequences. 

  First, I need to map their arguments to the philosophical frameworks we know. Sana's pushing Scanlon's expectation-based view (Principle F), while Marcus is invoking something closer to Raz's normative powers. The key moves:

  Sana's opener (1) is textbook Scanlon - the reliance created at promise-making binds you. But Marcus counters (2) with the corpse problem: no consciousness left to disappoint. That's strong because Scanlon's theory lives in the space of interpersonal harm. 

  When Sana compares it to posthumous defamation (3), she's reaching for "duty survives death" analogies. But Marcus pounces (4) by showing this morphs her theory into something unrecognizable - suddenly it's about eternal duties detached from actual expectations. That's razor-sharp.

  Her rebuttal about manipulative promises (5) exposes a real weakness in pure will theories. But Marcus's persistence (6) highlights how both theories crack under the grandfather paradox: expectations die with the person, yet obligation lingers.

  Neither fully wins because:
  - Scanlon can't explain why obligation outlives the expectation-holder
  - Normative power theories struggle with context-dependent promises (like jokes)
  - The solution might lie in hybrid theories (Owens' "interest theory"?) where the promisee's interest persists beyond death, or in the promisor's moral self-constitution (Friedrich/Darwall)

  Final call? Marcus edges it by exposing the expectation theory's corpse-shaped hole, but both miss that promissory obligation might be multi-source. Still, his challenge stands: any theory must explain obligations to the dead.
answer: |-
  Let's break down the Marcus-Sana debate move by move, referencing the ethical theories involved:

  **Move (1) Sana's Opening (Scanlon's Expectation View)**  
  *Claim:* The promise binds because Marcus intentionally created reliance in his grandfather. Breaking it would exploit that trust.  
  *Strength:* Correctly applies Scanlon's Principle F (promises bind to prevent "loss of confidence" from broken expectations).  
  *Weakness:* Doesn't yet address the "dead promisee" problem.  
  **Verdict: Sana (theoretically sound, but incomplete)**  

  **Move (2) Marcus' Counter (The Corpse Problem)**  
  *Claim:* No expectation *exists* to violate after death → so expectation theory can't explain the lingering obligation.  
  *Strength:* Exposes a genuine flaw in expectation-based views. Scanlon focuses on *harm to the promisee*, which seems impossible here.  
  *Weakness:* Doesn't prove his own "normative power" theory.  
  **Verdict: Marcus (lands a critical hit)**  

  **Move (3) Sana's Defense (Temporal Extension)**  
  *Claim:* The *past* expectation suffices, like posthumous defamation wronging the dead.  
  *Strength:* Offers a plausible analogy; some legal/moral duties *do* survive death (e.g., wills, reputation).  
  *Weakness:* Stretches Scanlon beyond his text. Scanlon ties wrongness to *harmful consequences* of undermining reliance practices – hard to apply here.  
  **Verdict: Sana (effective salvage attempt, but strains the theory)**  

  **Move (4) Marcus' Meta-Critique (Theory-Swapping)**  
  *Claim:* Sana’s move abandons "don’t violate expectations" for "eternal duty from past will-act" – which is the normative power view he supports (à la Raz/Owens).  
  *Strength:* Correctly diagnoses that Sana's defense smuggles in a non-expectation element. Raz argues promises create obligations simply by invoking a shared normative practice.  
  *Weakness:* Doesn't refute that *some* duties survive death (e.g., executing wills).  
  **Verdict: Marcus (exposes theoretical inconsistency)**  

  **Move (5) Sana's Riposte (Manipulation/Joke Cases)**  
  *Claim:* Pure will/power theories fail because they can't explain why coerced or insincere promises don’t bind, while expectation theory can (no genuine reliance created).  
  *Strength:* Devastating against simplistic will-based views. Scanlon *does* handle context-dependent promises better.  
  *Weakness:* Doesn't resolve the grandfather case; just shows will theories have problems too.  
  **Verdict: Sana (exposes a flaw in Marcus' preferred theory)**  

  **Move (6) Marcus' Stand (Obligation Beyond Expectations)**  
  *Claim:* Regardless of other issues, the grandfather case proves obligation can exist *without any living expectation* → so expectation can't be fundamental.  
  *Strength:* Forces acknowledgment that *something* beyond expectation is at work. The intuition of bindingness persists despite the promisee's obliteration.  
  *Weakness:* Concedes Sana's point about will theories needing refinement.  
  **Verdict: Marcus (holds ground on the core challenge)**  

  ---

  **Does any single theory survive?**  
  - **Scanlon's Expectation View:** Buckles under the "dead promisee" problem. It needs heavy modification (e.g., duties to the dead as a *category*) to work.  
  - **Normative Power (Raz/Owens):** Better handles the grandfather case (obligation springs from Marcus' voluntary act within a practice), but struggles with Sana's manipulation/joke counterexamples.  
  - **Hume's Artificial Virtue:** Focuses on social utility – but here, *no one knows*, so utility is irrelevant. Fails.  

  **The Needed Third Ingredient: Moral Self-Constitution or Relational Integrity**  
  Neither fully captures why Marcus feels bound. A hybrid view is required, incorporating:  
  1. **The promisee's enduring interest:** Grandpa’s *wishes* (not just expectations) create a duty of respect for his autonomy, even posthumously (drawing on Joseph Raz and David Owens).  
  2. **The promisor's moral identity:** Breaking the promise betrays Marcus' own integrity – he shaped himself as "grandson-who-kept-the-promise" (à la Christine Korsgaard or Charles Taylor).  
  3. **Relational significance:** Promises sustain trust in human bonds; breaking it dishonors the *relationship*, not just the expectation (influenced by Margaret Gilbert).  

  ---

  **Final Verdict**  
  \verdict{Marcus}  
  *Why:* He forces the debate toward the core problem (obligations to the dead) and exposes the expectation view's greatest weakness. While Sana effectively critiques pure will theories, Marcus' challenge – that obligation persists *without any existing expectation to violate* – remains unanswered by Scanlon alone. His insistence that "something deeper is at work" aligns best with hybrid theories incorporating normative powers + promisor integrity.
