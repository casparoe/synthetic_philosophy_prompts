answer: |-
  Here are 10 interview questions (8 core + 2 follow-ups) designed to probe deeply into your guest's defense of Anscombe's position, incorporating your specific requests:

  1.  **Core (Intention/Foresight):** Anscombe insists Truman *intended* the deaths of civilians in Hiroshima and Nagasaki as a means to end the war, not merely foresaw them. Given the complex reality of these targets – significant war industry intertwined with dense civilian populations – how does your reading of Anscombe precisely *individuate* Truman's direct intention to kill non-combatants from his foresight of their inevitable deaths as a byproduct of targeting war production?
      *   *Likely Follow-Up:* If the guest argues the scale/weapon choice reveals intent: *"But couldn't Truman argue he *intended* to destroy war-making capacity and *foresaw*, with deep regret, massive civilian casualties as an unavoidable side-effect? What specific evidence or logical step forces us to see civilian death not just as foreseen, but as an* intended means *in Anscombe's strict sense?"*

  2.  **Core (Moral Seriousness vs. Fanaticism):** Anscombe famously dismissed calculations about lives saved by the bomb versus a land invasion as irrelevant to the *moral character* of the act itself, calling such reasoning "a corrupt mind." Critics see this as a dangerous fanaticism, prioritizing abstract principle over concrete human suffering. How do you defend this refusal to engage with the consequentialist calculus not as moral blindness, but as the *essence* of moral seriousness regarding absolute prohibitions?
      *   *Likely Follow-Up:* If the guest emphasizes the nature of the prohibition: *"Doesn't this absolute stance risk making morality practically inert in the real world of tragic choices? If we cannot *ever* weigh consequences when an act is intrinsically evil (like directly targeting innocents), does this condemn us to paralysis or even greater harm when facing genuine moral catastrophes?"*

  3.  **Core (Argumentative Work vs. Illustration):** In "Modern Moral Philosophy," Anscombe launches a broad critique of consequentialism and the very framework of "moral ought." How does the Hiroshima/Nagasaki case *do independent argumentative work* within this broader critique? Does it uniquely expose a flaw in consequentialism, or demonstrate the necessity of absolute prohibitions, in a way that a less extreme example could not?
      *   *Likely Follow-Up:* If the guest argues its unique gravity reveals something essential: *"Couldn't a consequentialist counter that the *extremity* of this case actually highlights the *necessity* of consequentialism in dire emergencies, rather than refuting it? How does focusing on this specific horror advance the *theoretical* argument against consequentialism itself, beyond just vividly illustrating Anscombe's pre-existing commitments?"*

  4.  **Core (Murder vs. Withholding Degree):** There's a significant gap between judging Truman's act as "murder" and judging that Oxford University should therefore withhold an honorary degree. What, in Anscombe's view (and yours), is the specific *moral significance* of a university refusing to *honor* someone for such an act? Is it primarily symbolic, pedagogical, a matter of institutional integrity, or something else? Why is *this* the appropriate response from an academic institution?
      *   *Likely Follow-Up:* If the guest emphasizes institutional complicity or upholding values: *"Doesn't awarding degrees to controversial figures happen frequently? Where does Anscombe draw the line? Is withholding the degree *only* about acts meeting the strict definition of murder, or are there other categories of grave injustice that would warrant it? Does this risk universities becoming moral tribunals beyond their core competence?"*

  5.  **Follow-up on #1 (Intention):** Building on the intention/foresight distinction: Anscombe requires the *object* of the act itself to be good, with bad effects only permissible if unintended and proportionate. In targeting Hiroshima/Nagasaki, could Truman *not* have claimed the *object* was "destroying military-industrial capacity," with the civilian deaths an unintended (though foreseen) side-effect? What makes Anscombe so sure the civilian deaths weren't *just* a disproportionate side-effect, but actually part of the chosen *means*?
  6.  **Follow-up on #2 (Consequences):** You argue that consequences are irrelevant to the intrinsic wrong. But what about the *intention behind the consequences*? If Truman genuinely believed (rightly or wrongly) that the bombs would *save* millions of lives overall, does the *good intention behind the foreseen consequences* factor into Anscombe's analysis at all, or is it truly irrelevant to the act's moral character?
  7.  **Follow-up on #3 (Consequentialism Critique):** Anscombe argues consequentialism lacks the tools to identify *intrinsic* wrongs like murder. Does the visceral horror of Hiroshima/Nagasaki serve primarily to *shock* us into recognizing the inadequacy of consequentialist balancing, thereby making her theoretical point about the *need* for concepts like absolute prohibition more compelling? Is its power more rhetorical than strictly logical within the philosophical argument?
  8.  **Follow-up on #4 (Degree Significance):** Beyond symbolism, what *practical moral effect* did Anscombe believe withholding the degree would achieve? Was it aimed at Truman (unlikely), the Oxford community, the broader public, or posterity? In today's context, where such symbolic gestures are more common but also often contested, how do you see the enduring relevance of her stance on institutional honor?
  9.  **Core (Supreme Emergency):** Michael Walzer, while condemning the atomic bombings, argues for a "supreme emergency" exception where violating the non-combatant immunity rule *might* be tragically permissible to avert an unthinkable catastrophe. Does Anscombe's position, as you defend it, leave *any* room for such an exception? Or is the prohibition on directly targeting innocents truly absolute, holding fast *however* catastrophic the alternative – even the potential collapse of a just society or the victory of an unimaginable evil?
      *   *Likely Follow-Up (Closing):* *"If the answer is truly 'no exception,' doesn't this position risk becoming morally untenable in the face of genuine, civilization-ending threats? If we *know* adhering to the prohibition means absolute doom, is maintaining moral purity the only imperative? How does Anscombe navigate this tension between absolute principle and catastrophic consequence?"*

  **Key features of these questions:**

  *   **Go Beyond Restatement:** They probe the *how* and *why* of Anscombe's reasoning, demanding justification and analysis of her specific arguments and distinctions.
  *   **Address Your Specifics:** Each requested topic (intention/foresight, consequences/seriousness, argumentative work, murder/degree, supreme emergency) is covered with a dedicated core question and follow-up.
  *   **Probe Tensions:** They explicitly challenge potential weaknesses or counter-arguments (fanaticism, impracticality, symbolic vs. practical effect, absolute prohibitions vs. catastrophe).
  *   **Follow-Ups:** Each core question has a specific, challenging follow-up anticipating the guest's likely defense, pushing for deeper clarification or confronting potential contradictions.
  *   **Closing Focus:** The final question directly tackles the core tension of absolute prohibition vs. catastrophic consequences, using Walzer as a foil, and the follow-up pushes hard on the implications of an absolute "no."

  Remember to actively listen to your guest's answers and be prepared to adapt these follow-ups slightly based on their specific phrasing and emphasis. Good luck with the podcast!
