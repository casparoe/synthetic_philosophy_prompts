  The user's deeper need might be to understand if his relationship is "meant to be." While probability explains the occurrence, the meaning comes from his choice to value the relationship. Emphasizing that the significance is assigned by him, not by fate, could be helpful. He can cherish the serendipity without needing a supernatural explanation.

