  This is gonna sound random but I cant stop thinking about it. I met my girlfriend a few months ago through this insane chain of near misses - I almost skipped the party, she almost left before I even got there, and we only ended up talking because the friend who was supposed to introduce us never showed and some random guy at the bar mixed up our names instead. If literally any one of those things had gone differently we never would've met. My best friend keeps telling me "that's not luck, that's fate, the odds of all that lining up are way too crazy for it to be random," and honestly part of me agrees with her. But then I think, well of course it feels impossibly unlikely in hindsight - I wouldnt even be here marveling about it if it hadn't happened this way. So is there actually something to that "too crazy to be chance" feeling, or does it fall apart once you realize I could only be asking this because it worked out?
