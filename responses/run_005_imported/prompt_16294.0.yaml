  Here is a 5-minute eulogy that respects your great-aunt's profound commitment to Ghazalian occasionalism, avoids forbidden causal language, acknowledges the doctrine explicitly for her colleagues, and remains accessible and meaningful for non-philosopher family:

  ---

  **Eulogy for [Great-Aunt's Name]**

  Family, friends, colleagues, we gather here in the wake of a profound absence. My great-aunt, [Great-Aunt's Name], was a remarkable woman. For over thirty years, she dedicated her life to exploring and teaching the rich intellectual traditions of Islamic philosophy. But for those of us who knew her well, her passion wasn't confined to the lecture hall. She lived her philosophy, deeply and consistently. Her intellectual lodestar was the great thinker, al-Ghazali, and specifically his understanding of reality known as *occasionalism*.

  This wasn't just academic for her. It was a lived conviction about the very nature of existence and action. She held, with Ghazali, that there is only one true Cause in the universe: God, the Divine Sustainer. Everything else – every object, every event, every one of us – exists and occurs not through some inherent power of its own, but solely because God wills it into being, moment by moment by moment. Nothing possesses independent causal power. A kettle doesn't *cause* water to boil; it is simply the *occasion* where God habitually chooses to manifest the boiling. A seed doesn't *cause* a plant; it is the *occasion* for God's creative act to unfold.

  This was central to her understanding of herself and her place in the world. She saw herself not as an independent agent imposing her will, but as a being utterly reliant, moment-to-moment, on Divine Will. Her presence, her actions, her words – she understood them as *occasions* where God’s habitual patterns of action were made manifest.

  Knowing this deep conviction, she left a specific request about this eulogy. She asked that we avoid certain phrases that would, in her view, misrepresent reality. Phrases like "she shaped her students," "her influence lives on," or even "her effect continues" would have made her uncomfortable. Not because she was humble – though she was – but because, according to her deeply held belief, attributing such lasting, inherent causal power to any creature, including herself, would be inaccurate. She was never the *cause*; she was the *occasion*.

  So, how do we honor her life and work within this profound framework?

  We honor her by recognizing the *occasion* she was. We reflect on the incredible patterns of Divine action that were consistently manifested *around* her presence. For decades, in her classroom, the Divine Will habitually chose to ignite curiosity, foster deep questioning, and illuminate complex ideas *in the presence of* her teaching. Students didn't leave her class *caused* by her, but profoundly changed *through the Divine action occurring* in that specific context she provided.

  We honor her deep integrity. She didn't just teach Ghazali; she sought to align her understanding of the world with Ghazali's vision. She grappled with its implications sincerely. Her occasionalism wasn't an abstract theory; it was a lens through which she experienced her dependence on God and witnessed the constant, miraculous recreation of the world around her. Her insistence on this point, even when it challenged everyday language, was a testament to her intellectual honesty and faithfulness to her understanding of truth.

  We honor the *pattern* that was her life. While no "effect" carries forward independently, we can contemplate the *Divine habit* that, for so many years, sustained a life dedicated to learning, teaching, faith, and family. We remember the unique constellation of moments, each divinely willed, that made her *her* – her wit, her passion for ideas, her love for this family, her sometimes fierce defense of her philosophical corner.

  Her colleagues here will understand the depth and rigor of her commitment to this school of thought. And for family and friends, perhaps the simplest way to grasp her view is this: She believed every single instant was a direct gift from God, with nothing held over from the moment before. Her life was a testament to that constant, dynamic dependence. She saw herself as a vessel, not a source; a locus, not a force.

  So, today, we don't say her influence continues as an independent force. Instead, we give thanks for the extraordinary *occasion* that was [Great-Aunt's Name]. We give thanks for the Divine actions so consistently manifested in her presence. We give thanks for her unwavering commitment to seeking truth as she understood it. And we acknowledge the profound absence of that specific, beloved occasion for God's habitual grace in our lives.

  May we find comfort in contemplating the Divine Sustainer she so deeply trusted. Let us take a moment of quiet reflection on the constant renewal of all things.

  ---

  **Why this works:**

  1.  **Explicitly Addresses the Doctrine:** It names occasionalism and Ghazali clearly, explaining the core tenets (One True Cause, moment-by-moment recreation, no inherent causal power in creatures) in accessible terms. Her colleagues will recognize the accuracy.
  2.  **Respects Her Stipulations:** It directly quotes her request and explains *why* the forbidden phrases are problematic *from her perspective*. It replaces causal language with "occasional" language: "occasion," "manifested around her," "occurring in that specific context," "Divine habit," "pattern," "locus," "vessel."
  3.  **Honors Her Life & Work:** It celebrates her dedication, integrity, passion, teaching, and impact *without* attributing causal power *to her*. It frames the changes in students and her life's work as Divine action occurring *in relation to* her presence as an occasion.
  4.  **Accessible to Non-Philosophers:** Uses metaphors (kettle/boiling, seed/plant), plain language explanations, and frames the core idea as "dependence on God" and "constant renewal," which are relatable concepts. The structure moves from explaining the belief to applying it to honor her life.
  5.  **Tone:** Respectful, warm, acknowledging loss ("profound absence"), celebrating her uniqueness and integrity, and offering comfort through gratitude and reflection on the Divine Sustainer she trusted.
  6.  **Length:** Structured to be delivered clearly in approximately 5 minutes.
  7.  **Theological Integrity:** Consistently uses language compatible with occasionalism: "Divine Will," "Divine action," "manifested," "habitual patterns," "Divine habit," "Sustainer," "constant recreation/renewal."

  Deliver it with sincerity and a measured pace, allowing the ideas to land, especially when explaining the core doctrine and how it shaped her view of herself. This eulogy truly honors *her* beliefs while celebrating the remarkable life she lived within them.
