answer: |-
  ## Memorandum: Recommendation for Honor Council Policy Revision

  **To:** Honor Council Members  
  **From:** [Your Name], Graduate Student Representative  
  **Date:** October 26, 2023  
  **Subject:** Proposed Revision of Automatic Referral Threshold for Turnitin Similarity Reports  

  ### I. Introduction
  This memo addresses the significant concerns regarding the current policy mandating automatic referral for formal misconduct hearings for any paper flagged by Turnitin at 25% similarity or higher. The Council recognizes the widespread dissatisfaction: the arbitrary nature of the 25% threshold, its failure to distinguish between legitimate citation and potential misconduct, and the perception of injustice surrounding borderline cases. After careful deliberation weighing the merits of retaining a numeric trigger versus adopting a purely holistic approach, I propose a specific, actionable revision.

  ### II. Recommendation: Implement a Tiered Threshold with Mandatory Preliminary Review
  **I move that the Honor Council recommend the following policy revision to the University Senate:**

  1.  **Raise the Automatic Referral Threshold:** Increase the Turnitin similarity score triggering *mandatory* referral to a formal hearing from **25% to 30%.**
  2.  **Implement Mandatory Preliminary Review for 15-30%:** For reports scoring between **15% and 30%**, require the instructor to conduct a **mandatory preliminary review** *before* deciding on the next step. This review must:
      *   Examine the Turnitin report in detail to identify the *nature* of the flagged similarities.
      *   Specifically assess whether the bulk of the similarity stems from:
          *   Properly cited quotations and paraphrases.
          *   Repetition of correctly cited bibliographic/reference list entries.
          *   Repetition of properly cited technical terms, formulae, or standard phrasing common to the discipline.
          *   The student's own work from previous submissions (with appropriate self-citation if required).
      *   Document this review briefly (e.g., via a standardized checklist/form provided by the Honor Council).
  3.  **Instructor Discretion Post-Review:** Based *only* on the findings of this mandatory preliminary review, the instructor will decide whether:
      *   **No further action is warranted** (e.g., similarity is demonstrably due to acceptable sources as outlined above).
      *   An **informal resolution** is appropriate (e.g., minor citation errors, poor paraphrasing needing education).
      *   A **formal misconduct referral** to the Honor Council is warranted (e.g., significant portions of uncited text, clear evidence of plagiarism despite the overall score).
  4.  **Automatic Referral Remains for ≥30%:** Papers scoring **30% or higher** will continue to be **automatically referred** for a full misconduct hearing, *unless* the instructor, *after conducting the mandatory preliminary review*, provides a compelling, documented justification to the Honor Council Chair *in advance* explaining why the high similarity is overwhelmingly attributable to acceptable sources (e.g., a heavily quoted primary source analysis with perfect citations). The Chair has discretion to accept or reject this justification and proceed with referral if necessary.
  5.  **Below 15%:** Scores below **15%** remain solely within the instructor's purview for informal handling, with no mandatory review required.

  ### III. Rationale for the Recommendation
  This proposal directly addresses the core flaws of the current system while mitigating the risks inherent in both extremes currently debated by the Council.

  *   **Addressing the Current Threshold's Arbitrariness & Inequity:**
      *   **Raising the Threshold (25% -> 30%):** Acknowledges that the original 25% was arbitrary. A higher threshold significantly reduces the number of students facing automatic hearings for papers where similarity is *likely* to be largely attributable to acceptable sources (proper citations, bibliographies, discipline-specific jargon). This directly alleviates the "26% railroad" problem.
      *   **Mandatory Preliminary Review (15-30%):** Directly tackles the fundamental flaw of treating *all* similarity equally. By *requiring* instructors to examine the *context* and *source* of matches within this critical band, we ensure borderline cases (e.g., 24%, 26%, 28%) are judged based on the *substance* of the similarity, not just the number. This eliminates the "24% dodged a bullet" feeling by ensuring even scores below 30% receive scrutiny if the nature of the match warrants it. It forces a focus on *quality* over mere *quantity*.

  *   **Engaging Seriously with the Best Argument for Pure Holistic Review:**
      The strongest argument for scrapping any numeric threshold is that plagiarism is inherently contextual. A paper scoring 12% could contain a critical, uncopied passage constituting egregious plagiarism, while a paper scoring 35% might be a meticulously cited analysis of a single dense primary text. A purely holistic approach, proponents argue, is the *only* way to achieve true justice by focusing solely on the *act* of misrepresentation, not a flawed algorithmic output.
      **Our proposal acknowledges this strength but intentionally mitigates its primary weakness:**
      *   **Mitigating Bias and Inconsistency Risk:** A purely holistic approach for *every* flagged paper places immense, potentially overwhelming, burden on instructors and creates significant risk of inconsistent application and perceived (or actual) favoritism across different departments and instructors. The tiered system with mandatory review *within a defined band* provides crucial structure:
          *   It sets clear expectations for instructors (mandatory review required for 15-30%).
          *   It standardizes *what* they must look for (nature of matches).
          *   It creates accountability through mandatory documentation of the review.
          *   It reserves the most resource-intensive process (formal hearings) only for the highest scores (≥30%) or cases where the instructor's review of a mid-range score finds serious misconduct. This balances contextual judgment with necessary procedural safeguards against capriciousness.

  *   **Engaging Seriously with the Best Argument for Retaining a Strict Numeric Threshold:**
      The strongest argument for keeping *some* automatic threshold is the need for predictability, efficiency, and a safeguard against under-enforcement or instructor reluctance. A clear number provides a bright line, ensures serious potential cases aren't overlooked due to instructor workload or leniency, and guarantees consistent application of the formal process at the upper extremes of similarity.
      **Our proposal preserves this core benefit while refining it:**
      *   **Retaining Automatic Referral (≥30%):** Maintains the predictability and guarantee of review for papers exhibiting very high levels of similarity, where the *likelihood* of significant misconduct, even considering context, is substantially higher. This ensures egregious cases cannot be easily dismissed.
      *   **Providing a Safety Valve:** The allowance for instructor justification *to the Chair* for bypassing automatic referral at ≥30% based on documented review *directly* addresses the critique that high scores can be caused by legitimate, cited material. This injects necessary flexibility at the very high end without abandoning the threshold entirely. The Chair's oversight maintains central accountability.
      *   **Structured Review Lowers Burden:** The mandatory review for 15-30% is more focused and feasible than expecting holistic assessment of *every* flagged paper, making the system more efficient and scalable than a pure holistic model.

  ### IV. Conclusion and Proposed Motion
  The current 25% automatic referral threshold is indefensibly arbitrary and fails to distinguish between scholarly citation and academic dishonesty. While pure holistic judgment offers theoretical precision, it risks inconsistency and unsustainable burden. Conversely, retaining any rigid threshold ignores the fundamental role of context in defining plagiarism.

  The proposed tiered system with a raised threshold (30%), a mandatory contextual review band (15-30%), and a documented justification option for high scores represents a principled middle path. It significantly reduces arbitrary outcomes for borderline cases, mandates necessary context analysis, retains efficiency and predictability for the most severe potential violations, and incorporates safeguards against both mechanistic application and potential bias.

  **Motion:** I move that the Honor Council recommend to the University Senate the adoption of the Turnitin Similarity Report Handling Policy as outlined in Section II of this memorandum, effective for the upcoming academic term, subject to review after one full academic year of implementation.
