answer: |-
  Your friend's position is **logically consistent**, not contradictory. He's operating within a specific ethical framework that distinguishes between *direct moral duties* (what we owe to beings for their own sake) and *indirect duties* (duties concerning a being that arise because of their impact on something else we *do* directly owe duties to).

  Here's why his views fit together:

  1.  **The Core Principle: Moral Standing Requires Rational Agency (Direct Duties):**
      *   Your friend's starting point is that full moral standing – the kind where we owe duties *directly to a being* because it has intrinsic value deserving of respect – requires the capacity for sophisticated reason (like understanding rights, obligations, contracts, or moral reasoning itself). This is a view associated with philosophers like Immanuel Kant.
      *   Animals, lacking this specific human-like rational capacity, do not possess this intrinsic moral standing *on his view*. Therefore, we do not owe them duties *for their own sake*. They cannot be "wronged" in the fundamental sense that a person can be wronged (e.g., having their autonomy violated).

  2.  **Indirect Duties: Duties *Concerning* Animals (But *To* Ourselves/Humanity):**
      *   Even if animals lack intrinsic moral standing demanding direct duties, your friend acknowledges that *how we treat them matters significantly*. However, the reason it matters stems from its impact on *human beings* and *human morality*.
      *   **The Cruelty Argument:** His reaction to the kids torturing the dog exemplifies this. He's not upset because the dog possesses a right not to be tortured that was violated (direct duty). He's upset because:
          *   **Character Development:** Engaging in or enjoying cruelty towards vulnerable beings (like animals) cultivates vicious character traits – callousness, indifference to suffering, sadism.
          *   **Slippery Slope/Hardening Effect:** Habitually inflicting suffering on animals can desensitize a person to suffering in general, making it psychologically easier for them to inflict suffering on *humans* later. This is a well-documented psychological phenomenon.
          *   **Duty to Humanity:** We *do* have direct duties to other rational human beings. Allowing or encouraging behavior that predictably damages a person's moral character and increases the risk they will harm other humans violates our indirect duty *to humanity*. We have a duty to discourage traits and actions that undermine the moral fabric of society and threaten human well-being.

  3.  **How the Views Coexist:**
      *   **View 1 (Animals lack intrinsic standing):** Explains why he believes nothing is *owed to the animal itself*.
      *   **View 2 (Opposition to cruelty):** Explains why he believes *we owe it to ourselves and other humans* to treat animals humanely and prevent cruelty. The wrong being committed is against the potential victims of the cruel person (including future human victims) and against the moral character of the perpetrator and society, *not* against the dog *as a rights-holder*.

  **Historical Precedent:** This is essentially **Kant's position**. Kant famously argued:
  > *"If a man shoots his dog because the animal is no longer capable of service, he does not fail in his duty to the dog, for the dog cannot judge, but his act is inhuman and damages in himself that humanity which it is his duty to show towards mankind. He must, therefore, practise kindness to animals, for he who is cruel to animals becomes hard also in his dealings with men."*

  **Is it the only view? No.** Many ethical systems (utilitarianism, animal rights theories, care ethics) argue that animals *do* have intrinsic moral standing based on sentience (capacity to suffer) or other criteria, and thus *are* wronged directly by cruelty. Your friend rejects this.

  **Where the Tension *Might* Lie (But Doesn't Necessarily Break Consistency):**
  *   **Emotional Response vs. Rationalization:** You might wonder if his *genuine upset* hints at an underlying intuition that the dog *was* wronged, which his stated philosophy tries to rationalize away. However, his *explanation* for his upset (concern about human character) is perfectly consistent with his stated principles. People can feel strong emotions based on indirect concerns (e.g., being furious at someone who betrays a friend, even if you weren't directly harmed).
  *   **Scope of Indirect Duties:** Could his logic *also* justify actions towards animals that don't involve overt cruelty but might cause suffering, if they don't demonstrably harm human character? (e.g., industrial farming practices done "humanely" but still causing suffering, if the workers aren't desensitized and consumers are ignorant). His view *might* allow for this, which you might find unsatisfying, but it wouldn't contradict his core logic. His logic specifically targets *cruelty* (intentional infliction of suffering, often for enjoyment) because of its direct link to damaging human character.

  **Conclusion:** Your friend is **not contradicting himself**. He holds a coherent, albeit restrictive, ethical position:
  1.  Animals lack the rational capacity necessary for us to owe them direct moral duties (they cannot be "wronged" in that fundamental sense).
  2.  However, we have strong *indirect duties concerning* animals because how we treat them impacts *human morality and well-being*. Deliberate cruelty is wrong not because it wrongs the animal, but because it corrupts the human perpetrator and poses a risk to other humans. His reaction to the dog's mistreatment aligns perfectly with this second principle.
