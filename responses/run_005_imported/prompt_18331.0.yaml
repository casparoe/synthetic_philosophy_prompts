answer: |-
  Here's a rigorous argument that organicism fails to escape van Inwagen's own anti-arbitrariness objection, engaging directly with his core contention that composition cannot admit vague boundaries. The crux is that **"constituting a life" generates a Sorites series *within* the very composites van Inwagen deems real (organisms), forcing him to either accept vague existence or an arbitrary sharp cutoff *for composition itself* – precisely what his argument purports to forbid.**

  ### Van Inwagen's Core Argument Against Restricted Composition (Recap)
  1.  **Premise (Sorites Generation):** For any proposed non-universal, non-nihilistic composition criterion (e.g., contact, fastening), we can construct a continuous Sorites series where the criterion is clearly satisfied at one end (e.g., two separate rods) and clearly not satisfied at the other (e.g., one fused rod).
  2.  **Premise (No Vague Existence):** Existence is not vague. At any precise moment in the series, it must be determinate whether a composite object exists or not.
  3.  **Premise (No Arbitrary Cutoffs):** There is no non-arbitrary, ontologically significant point within the Sorites series where composition could *precisely* begin or cease.
  4.  **Conclusion:** Therefore, restricted composition criteria fail. Only nihilism or universalism avoid this problem. Van Inwagen rejects both, proposing organicism instead.

  ### The Argument Against Organicism's Immunity
  Organicism claims the xs compose y iff their activity constitutes a life. The vulnerability lies in applying the Sorites template *to the life-constituting relation itself*:

  1.  **Generating the Life-Constituting Sorites Series:** Consider a paradigm organism (e.g., a cat) undergoing a continuous, gradual process of shedding a single particle (e.g., a skin cell or loose hair follicle).
      *   **Start Point (t0):** The particle is fully integrated and functionally active within the cat's life processes (e.g., part of the skin barrier, receiving nutrients). By organicism, the cat-composite *includes* this particle.
      *   **End Point (t100):** The particle has been completely shed, is lying detached on the mat nearby, and is no longer involved in any life processes of the cat. By organicism, the cat-composite *excludes* this particle.
      *   **The Series:** Construct a continuous series of moments (t1, t2, ..., t99) where the particle's integration into the cat's life processes decreases continuously. For example:
          *   t1: Particle is loosely attached but still within the functional skin layer.
          *   t50: Particle is detached but caught in the fur, still moved by the cat's activity.
          *   t75: Particle is barely clinging to the tip of a hair, subject only to air currents and gravity, minimally "caught up" in the cat's vicinity.
          *   t99: Particle is physically separated but still microscopically close to the cat's surface.

  2.  **Applying Van Inwagen's Premises to "Constituting a Life":**
      *   **Premise 1 (Sorites Generation - Satisfied):** The series is continuous and gradual. At t0, the particle is clearly "caught up in the life" of the cat. At t100, it is clearly not. The change is smooth.
      *   **Premise 2 (No Vague Existence - Applies):** Van Inwagen insists existence cannot be vague. Therefore, at *each precise moment* tn, it must be determinate whether the cat-composite *exists* and, crucially, *which particles compose it*. The existence of the composite cat *depends on* which particles are caught up in its life. If it's vague *whether particle P is part of life L at tn*, then it's vague *whether P is part of the composite cat*, and thus vague *what the cat is* or even *if that specific composite cat exists* at tn. Van Inwagen cannot tolerate this ontological vagueness.
      *   **Premise 3 (No Arbitrary Cutoffs - Applies):** "Constituting a life" or "being caught up in a life" lacks the precision to identify a *non-arbitrary, ontologically significant* moment tn where particle P *precisely* ceases to be part of the life (and thus the composite). Is it when metabolic influence ceases? When physical attachment breaks? When functional role ends? When distance exceeds 1 micron? Any specific point chosen seems as arbitrary as choosing the exact moment two welded rods become one object. Van Inwagen argues life provides a *natural* boundary, but the Sorites series shows the *boundary of the boundary* ("where does the life-process *precisely* include/exclude P?") is just as susceptible to vagueness as contact or fastening.

  3.  **The Problem of the Many as Consequence, Not Solution:** Van Inwagen's response is to embrace the Problem of the Many (PotM) for organisms: there are many slightly different aggregates of particles (varying by including/excluding borderline particles like the shedding cell at t50), *each* of which is equally caught up in the life. Thus, there are many cat-composites overlapping the region.
      *   **The Cost:** This directly violates Premise 3 (No Arbitrary Cutoffs) *as applied by van Inwagen himself*. In the original welding case, he argues that positing a vast number of slightly different composites appearing/disappearing at successive moments *doesn't solve the arbitrariness*; it merely relocates it. We still need a precise moment when composition *changes* from one aggregate to another, or when a specific aggregate *comes into or goes out of existence* as particles are added/removed. The Sorites pressure applies *to each individual composite aggregate* in the PotM swarm.
      *   **The Inconsistency:** Van Inwagen would *never* accept this move from a defender of "fastening." If they said, "Fine, in the welding series, there are millions of slightly different fastened objects appearing at each stage," van Inwagen would rightly object: 1) This is ontologically profligate and counterintuitive, and 2) **It doesn't resolve the arbitrariness.** *When precisely* does a specific aggregate cease to be "fastened enough" to compose an object? *When precisely* does a new aggregate come into existence? The demand for a precise cutoff in composition events (coming-into-being/ceasing-to-be of composites) remains unmet. **Organicism, by embracing PotM, adopts the very strategy van Inwagen deems unacceptable for other restricted answers.** He dismisses profligate ontologies generated by rival criteria but swallows his own, claiming it's forced by the "natural" boundary of life. However, the Sorites series shows the boundary of "life" is *not* sharp enough to avoid generating this profligacy in the first place.

  ### Why "Life" Doesn't Dodge the Argument
  *   **"Life" is Not Magically Precise:** Van Inwagen relies on life being a "natural" and non-arbitrary unity. However, the Sorites vulnerability stems from the *application* of the concept to specific particles in a continuous physical world. *Where exactly* does the metabolic process or functional integration of a life *precisely* include or exclude a given particle? The biological processes themselves are continuous and graded at the micro-level. Life provides a *criterion*, but applying it to determine *exact composition* at the level of fundamental particles runs into the same continuity problem as "contact" or "fastened."
  *   **Borderline Cases Highlight the Sorites Structure:** Cases like viruses, slime molds, or man o' wars aren't just peripheral annoyances; they are points *within* a Sorites series between paradigm non-organisms (a pile of sand) and paradigm organisms (a cat). If "constituting a life" is vague *between* organisms and non-organisms, it demonstrates the susceptibility of the concept to the same gradualist pressure van Inwagen exploits elsewhere. The shedding cat case shows the vagueness exists even *within* paradigm organisms.

  ### Conclusion: Organicism Doesn't Earn Its Keep
  Van Inwagen's argument against restricted composition succeeds only if *no* plausible non-arbitrary, non-vague criterion exists. He claims "constituting a life" provides this. However, **the Life-Constituting Sorites Series demonstrates that "constituting a life" is just as vulnerable to generating borderline cases requiring precise cutoffs as "fastened together" is.** Faced with this:

  1.  **Option 1 (Sharp Cutoff):** Insist there is a precise, non-arbitrary moment when a particle ceases to be "caught up in the life." This violates his insistence that life provides the *only* non-arbitrary boundary and that rival criteria are *inherently* susceptible to arbitrariness. It concedes that such cutoffs *are* possible, undermining the force of his original argument against others.
  2.  **Option 2 (Vague Existence):** Allow that it can be vague whether a particle is part of the life, and thus vague what composes the cat. This directly contradicts his core premise that existence cannot be vague.
  3.  **Option 3 (Embrace PotM):** Accept that there are many cat-composites differing by borderline particles. This is the path van Inwagen takes. **However, this move:**
      *   Incurs a massive and counterintuitive ontological cost (myriad near-identical cats).
      *   **Crucially, does not resolve the arbitrariness:** It simply shifts the demand for precision from "When does *the* cat lose particle P?" to "When does *this specific aggregate* cease to exist (or cease to constitute a life) as P is removed?" The Sorites pressure applies to *each individual composite* in the swarm. Van Inwagen's own argument implies that the *coming-into-being and ceasing-to-be of these composites* must be precise events. Yet, identifying the *exact moment* a particle's inclusion turns a non-life-constituting aggregate into a life-constituting one (or vice versa) is just as arbitrary as identifying the exact moment of fastening in the rod series.
      *   **Is Inconsistent:** He rejects analogous profligate ontologies generated by rival criteria precisely because they don't solve the arbitrariness problem. His acceptance of it for organisms relies solely on the special status he grants to "life," but the Life-Constituting Sorites shows this status doesn't insulate it from the fundamental problem of continuous variation.

  **Therefore, organicism does not provide a principled escape from the vagueness/arbitrariness objection.** It either succumbs to the same sharp-cutoff problem it attributes to rivals, accepts vague existence, or adopts an ontologically profligate and ultimately arbitrary solution (PotM) that van Inwagen's own reasoning should forbid. His argument against restricted composition, if sound, should rule out organicism as well. The "life" criterion fails to be the uniquely non-arbitrary, non-vague boundary he claims it is.
