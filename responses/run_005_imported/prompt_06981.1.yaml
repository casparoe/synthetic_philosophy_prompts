answer: |-
  Here are 9 interview questions designed to probe deeply into the strong indeterminacy thesis, incorporating your specific requests and featuring strategic follow-ups:

  1.  **Core Distinction:** "Quine famously argued that indeterminacy of translation differs *in kind* from the mere underdetermination of scientific theories by evidence. Scientific underdetermination is epistemic – we lack the data to pick the single true theory. But you defend the stronger claim: for translation, even with *all possible physical data*, there is no single correct manual. Can you articulate precisely why the difference isn't just one of degree – why the physical facts exhaustively *determine* physics but *fail* to determine meaning?"
      *   *Likely Answer Focus:* Emphasizing the absence of meaning facts *over and above* physical/behavioral facts; the non-existence of propositions as determinate entities; behavior being compatible with multiple incompatible intentional ascriptions.
      *   *Follow-up:* "If meaning isn't fixed by the totality of physical facts, doesn't that imply meaning is fundamentally *non-natural* or non-physical? Are you comfortable with that consequence, or is your point that meaning-talk is simply *not fact-stating* in the way physics is?"

  2.  **The Evidence Base (Chomsky's Challenge):** "Noam Chomsky argued that Quine's thesis only seems plausible because he artificially restricts the admissible evidence for meaning to dispositions for overt assent/dissent under sensory stimulation. If we include the *internal computational states* of speakers – the cognitive structures generative of behavior – doesn't this reintroduce facts of the matter about meaning and rule out radical indeterminacy?"
      *   *Likely Answer Focus:* Rejecting internal states as accessible or relevant evidence independent of behavior; arguing internal states are themselves only interpretable via behavioral criteria, leading to regress; Quine's physicalism implying internal states are just more physical facts already encompassed.
      *   *Follow-up:* "But isn't the *structure* and *causal role* of those internal states, as revealed by neuroscience or cognitive modeling, potentially constraining enough to fix meaning? If a specific neural pattern *reliably* correlates with using 'rabbit' and not 'undetached rabbit part' across diverse contexts, isn't that a fact about meaning?"

  3.  **LLMs: Challenge or Irrelevance?:** "Large Language Models translate fluently between languages without access to speakers' behavioral dispositions under sensory stimulation – indeed, without understanding in any human sense. They operate purely on statistical patterns in text. Does this success support your view (showing meaning fixation doesn't require determinate referents, just pattern matching), undermine it (showing complex translation *is* determined by public data), or is it simply orthogonal to Quine's radical translation scenario?"
      *   *Likely Answer Focus:* Arguing LLMs reinforce indeterminacy by showing successful communication relies on systematic correlations, not determinate reference; the outputs are compatible with multiple internal "interpretations"; LLMs operate on "surface" data akin to the linguist's evidence.
      *   *Follow-up:* "If an LLM internally develops distinct, stable vector representations for 'rabbit' and 'undetached rabbit part' that reliably drive different outputs in appropriate contexts, doesn't this *within the model* constitute a 'fact of the matter' about how *it* 'translates' the term, even if unknowable externally? Doesn't this suggest *some* level of determination is possible?"

  4.  **Beyond Behavior - Normativity & Community:** "Quine's scenario focuses on the solitary field linguist. But meaning seems deeply tied to normative practices within a linguistic community – correct vs. incorrect use. Doesn't embedding language use in a network of social norms, corrections, and shared practices provide additional constraints that rule out the wild indeterminacy suggested by the gavagai thought experiment for a whole community over time?"
      *   *Likely Answer Focus:* Arguing norms are themselves just patterns of behavior (approval, correction) observable as physical facts, and thus subject to the same indeterminacy; the "normativity" is projected by the interpreter.
      *   *Follow-up:* "If a community *systematically* corrects a child for using 'gavagai' when pointing to a rabbit's leg but not the whole rabbit, isn't that observable physical evidence specifically ruling out the 'undetached rabbit part' manual? Doesn't this public practice *fix* the extension?"

  5.  **The Cost of Indeterminacy:** "If there's truly no fact of the matter about meaning, what becomes of truth? If 'Snow is white' in Language A indeterminately translates to either 'Snow is white' *or* 'Snow is white and 2+2=4' in Language B (as per Quine's proxy functions), doesn't this render truth relative to a chosen translation manual, undermining any objective notion of truth?"
      *   *Likely Answer Focus:* Accepting the relativity; emphasizing that truth *within* a chosen manual/system is preserved; downplaying the practical significance for communication within a manual.
      *   *Follow-up:* "Doesn't this relativity of truth create profound problems for cross-manual discourse *about* truth itself? How can we even coherently *state* the indeterminacy thesis if truth is manual-relative?"

  6.  **Intentionality and Aboutness:** "Indeterminacy seems to sever the intrinsic link between language and the world – the 'aboutness' or intentionality of mental states. If reference is indeterminate, how can any utterance be *about* anything specific in the world? Does your view entail a form of eliminativism about intentionality?"
      *   *Likely Answer Focus:* Arguing intentionality is a pragmatic feature of our *use* of language within a system, not a deep metaphysical relation; or embracing a deflationary view of aboutness.
      *   *Follow-up:* "Doesn't the *causal history* of how we acquire words (e.g., being shown rabbits when learning 'rabbit') ground reference? Isn't that history part of the 'complete physical knowledge'?"

  7.  **Empirical Linguistics vs. Philosophy:** "Professional linguists largely proceed as if there are facts to discover about syntax, semantics, and translation. Does the strong indeterminacy thesis imply that their entire enterprise is fundamentally misguided, or merely that it operates pragmatically within an assumed background manual? Is linguistics more like physics or more like literary criticism on your view?"
      *   *Likely Answer Focus:* Arguing linguistics is a pragmatic, instrumentalist enterprise that works *within* a chosen framework; its success doesn't prove determinacy at the deepest level.
      *   *Follow-up:* "When linguists discover deep syntactic or semantic universals across languages, doesn't this strongly suggest *shared, determinate* underlying structures constraining translation?"

  8.  **The Role of Rationality & Charity:** "Davidson argued that the principle of charity – interpreting speakers as largely rational and holding mostly true beliefs – is a necessary precondition for interpretation and drastically narrows the range of plausible manuals. Doesn't charity provide the crucial constraint Quine omits, ensuring determinacy?"
      *   *Likely Answer Focus:* Arguing charity is itself a pragmatic choice, not a discovery of fact; multiple manuals can satisfy charity equally well by making different trade-offs between attributing truth and attributing rationality/logic; charity doesn't fix reference.
      *   *Follow-up:* "Is there *any* conceivable pattern of behavior so bizarre that charity would *force* us to adopt only one translation manual? If not, doesn't this concede the core indeterminacy point?"

  9.  **Falsifiability & Evidence Against:** "Finally, to help listeners grasp the stakes: What kind of evidence, even in principle, *could* count against the strong indeterminacy thesis? If complete physical knowledge of speakers (brain states, environment, behavior across time) is insufficient to rule out multiple incompatible manuals, what *could* possibly demonstrate that one manual uniquely captures the 'real' meanings?"
      *   *Likely Answer Focus:* Emphasizing that no evidence *could* count against it, as the thesis denies the *existence* of the facts such evidence would purport to reveal; it's a thesis about the *absence* of a certain kind of fact.
      *   *Follow-up (Crucial Closing):* "If *no conceivable evidence* could falsify the thesis, doesn't that risk placing it outside the realm of empirical inquiry altogether? How does it differ from a metaphysical assertion about the non-existence of meaning?"

  These questions push the guest to clarify the *metaphysical* claim (vs. epistemic underdetermination), defend the restrictive behaviorist evidential base against Chomsky, engage with the modern challenge/context of LLMs, and confront the potential unfalsifiability and radical consequences of her position. The follow-ups anticipate common defenses and aim to deepen the exploration.
