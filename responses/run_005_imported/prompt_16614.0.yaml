  Looking at point (1), Owen's stance relies on experimental evidence. The loophole-free experiments and Nobel prizes do add weight, but I should check if they truly rule out all alternatives. Superdeterminism isn't directly addressed by these experiments, so Owen might be overstating by calling it "settled." 

