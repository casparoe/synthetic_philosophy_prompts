  The user's unease probably comes from this distinction. The friend makes it sound like all lying is acceptable, but Arendt warns against lies that manipulate reality itself. When politicians lie about facts everyone can see—like election results—it undermines trust and the common world. That's dangerous for democracy.

  Also, Arendt values factual truth as the foundation of political discourse. Without shared facts, debate and action become impossible. The friend's argument ignores this. The user might be concerned that normalizing all lies leads to a loss of objective truth, which is essential for politics.

