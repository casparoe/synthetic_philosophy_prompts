prompt: |-
  So this is a weirdly specific thing that's been eating at me for like a week now because of a paper my lab just got back from review. I'm a PhD student in a computational genomics group, and we submitted a paper where we called a bunch of non-coding regions "functional" basically because they show consistent transcription factor binding, open chromatin, and when we knocked a few of them down with CRISPRi, expression of nearby genes shifted. Reviewer 2 absolutely tore into us, said we're basically redoing the whole ENCODE "80% of the genome is functional" fiasco from 2012, and that unless we can show these regions are under purifying selection (i.e. conserved across species, actually mattering for fitness — they even threw in the classic "80% vs less than 10% conserved" stat), we have no business calling anything "functional," we're just describing correlations and calling them biology.

  My advisor's at a conference this week so I can't just ask her, so I went down a rabbit hole and it turns out this is apparently a decades old fight in philosophy of biology between so-called "etiological" or "selected effect" accounts of function (Wright, then Neander) and "causal role" accounts (Cummins), and that the people who dunked on ENCODE were explicitly drawing on that exact distinction. I'm not a philosopher though and honestly it's making my head spin a little, so I'd really appreciate it if you could properly compare the two views for me — not the one-paragraph-each textbook version, but really dig into where they actually pull apart for a case like mine: an element that does something biochemically detectable and even seems to causally affect a phenotype when perturbed, where we simply don't know (yet, or maybe ever) whether that effect was "selected for." Is my reviewer's insistence on evidence of selection actually the philosophically correct standard for "function" talk, or is that itself a substantive and contestable choice between two views that are each internally coherent? And if you had to bet, for something like genome annotation specifically (as opposed to, say, an evo-devo context), is one of the two accounts just more defensible than the other, or is there some hybrid/pluralist position working scientists actually rely on in practice that I should be citing back at this reviewer instead?
