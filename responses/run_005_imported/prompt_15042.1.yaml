prompt: |-
  Ok so in my theology class we just finished the Confessions and now we're doing this whole unit on Augustine's views on lying, and my teacher gave us a handout about his book Contra Mendacium (i think thats latin for "against lying") that's kind of messing with my head. Basically theres this guy named Consentius who wrote to Augustine with an idea: send someone undercover to pretend to convert to the Priscillianist heretics, earn their trust, and then expose all their secret teachings so the church could shut the whole sect down before more people got misled by them. Feels like a pretty solid plan honestly, basically a sting operation. But Augustine's answer is no, absolutely not, because that's still a lie, and for him lying is a sin every single time no matter how good the goal is — he won't even carve out an exception for a whole deliberate strategy meant to stop people from being spiritually wrecked, and not just some split-second lie to save one person's life.

  From the handout, his actual reasoning is that what makes a lie wrong isn't the harm it does or doesn't cause, it's this thing he calls the "duplicity of the heart" — basically, having one thing in your mind while asserting the opposite out loud is corrupt all by itself, and no good outcome can cancel that out. So even the Priscillianist sting op counts as sinful, because the undercover guy would be sincerely asserting "I'm a real convert" while believing the total opposite the whole time.

  Me and my friend Sam got into an argument about this at lunch and I couldn't actually explain why Augustine's wrong, just that it feels obviously fine to infiltrate an actual dangerous cult like that to expose them. Can you write me a real argument against his position — one that actually engages with the "duplicity of heart" reasoning and shows specifically where it breaks down, instead of just saying "well sometimes the ends justify the means"? I wanna have something solid to bring back to Sam tomorrow.
