  ### Move-by-Move Analysis & Alternative Account

  **1. Elena's Opening Claim (Score: 1)**  
  *Claim:* The Knobe effect shows morality is constitutive of the *concept* of intentional action.  
  *Assessment:* **Plausible but contentious.** The asymmetry is robust and morally valenced outcomes clearly shift intentionality judgments. However, claiming morality is "baked into" the *core meaning* of intentional action overstates the case. It confuses *conceptual structure* with *strong cognitive association*.  

  **2. Sam's Pragmatics Reply (Score: -1)**  
  *Claim:* People use "intentionally" loosely to communicate blame, akin to pragmatic implicature.  
  *Assessment:** **Weak.** The "some board members showed up" analogy fails. That implicature (*not all*) is cancellable ("...in fact, all did"). The Knobe effect persists even when linguistic pragmatics are controlled (see Move 3). If it were mere conversational shorthand, rewording should eliminate the asymmetry—but it doesn’t.  

  **3. Elena's Rewording Evidence (Score: 2)**  
  *Claim:* Asymmetry persists with other phrases ("in order to," "decided," "wanted").  
  *Assessment:** **Strong.** Empirical data confirms this. Studies show the effect for:  
  - "Did he *bring about* the side effect intentionally?"  
  - "Did he *intend* to harm/help?"  
  - "Was he *in favor of* it?"  
  This undermines Sam's "single-word implicature" defense. The effect is semantic/conceptual, not pragmatic.  

  **4. Sam's "Entrenched Heuristic" Reply (Score: 1)**  
  *Claim:* It’s a blame-tagging *heuristic* (like base-rate neglect), not part of word meanings.  
  *Assessment:** **Reasonable but incomplete.** Comparing it to base-rate neglect is apt: both are automatic, stubborn biases. However, base-rate neglect isn’t valence-dependent *by design*, while the Knobe effect is intrinsically moral. This suggests a deeper link to moral cognition than mere heuristic error.  

  **5. Elena's Cancellability Point (Score: 1)**  
  *Claim:* Genuine implicatures are cancellable, but subjects resist "cancelling" the harm judgment.  
  *Assessment:** **Valid.** Classic pragmatic implicatures (e.g., "some" → "not all") vanish when cancelled ("some, indeed all"). Knobe-effect judgments resist cancellation (e.g., subjects reject "he harmed intentionally, but didn’t *mean* to"). This suggests the moral judgment isn’t peripheral—it’s integral to the attribution.  

  **6. Sam's Cancellation Finding Response (Score: 0)**  
  *Claim:* Stronger condemnation enables cancellation, showing "intentional" tracks blame intensity.  
  *Assessment:** **Inconclusive.** Some studies (e.g., Cushman 2008) show subjects *can* deny intentionality *after* assigning blame elsewhere (e.g., "he’s negligent, not intentional"). But others (e.g., Knobe 2010) show persistent asymmetry. If blame saturation *allows* denying intentionality, it supports Sam’s "blame-tracking" view. However, the effect’s resilience favors Elena.  

  ---

  ### A Better Account: **Affective Moral Cognition**  
  Both scholars overlook a synthesis:  
  - **Moral Valence Asymmetry:** Harm attracts stronger cognitive/affective processing than help (negativity bias). The chairman’s "I don’t care" amplifies perceived callousness *only for harm*, making the outcome feel more "active" (thus "intentional").  
  - **Double Process:** System 1 intuitively links harmful outcomes to intent due to blame; System 2 can override this if given explicit alternatives (explaining partial cancellability).  
  - **Conceptual Overlap:** Intentionality *isn’t* inherently moral, but moral evaluation recruits intentional-state concepts (desire, belief) *asymmetrically* for harm vs. help.  

  ### Key Takeaways for Your Reporting  
  - Elena’s core insight is robust: **morality modulates intentionality judgments pervasively**, not just pragmatically.  
  - Sam is right that **blame drives the asymmetry**, but understates how deeply moral cognition shapes conceptual application.  
  - The "better account" combines both: **automatic affective responses** (Sam’s heuristic) **structure how we deploy concepts** (Elena’s meaning-embedding) in morally laden contexts.  

  **Sources to Cite:**  
  - Knobe (2003) for the original effect.  
  - Uttich & Lombrozo (2010) on norm/valence asymmetry.  
  - Cushman (2008) on cancellability studies.  
  - Alicke (2008) on blame-validation model.
