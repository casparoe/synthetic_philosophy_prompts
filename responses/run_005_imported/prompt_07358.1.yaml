answer: |-
  ## The Kelly Delusion: Why Samuelson Sliced Through the Geometric Mirage

  The Kelly Criterion's siren song is seductive: maximize the expected logarithm of wealth, and with probability one, you'll surpass *any* other strategy over the infinite long run. Proponents, from Kelly and Thorp to Peters' "ergodicity economics," claim this grants Kelly-optimality a unique, objective claim to rationality – the *only* strategy a truly rational agent *must* choose, irrespective of their personal utility function. Paul Samuelson, however, saw this as a profound fallacy, a mathematical sleight-of-hand obscuring fundamental truths about utility and time. **Samuelson was fundamentally, devastatingly correct. Kelly-optimality is not privileged rationality; it is the specific preference of a log-utility maximizer projected onto infinity, and its claims to universality dissolve under scrutiny.**

  **The Kelly Illusion: Probability-1 Dominance as Mirage**

  Kelly advocates wield their infinite-horizon, probability-1 dominance theorem like an invincible sword. The argument appears unassailable: *Any* other betting fraction, persistently used, will almost surely be surpassed by Kelly over infinite trials. Doesn't this *prove* Kelly is objectively superior?

  Samuelson's genius was in exposing the bait-and-switch inherent in this argument. The theorem relies on *three critical and unstated assumptions*:

  1.  **Utility is Logarithmic (Implicitly):** Maximizing expected log wealth *is* maximizing expected utility *only* if U(W) = log(W). The "dominance" is defined purely in terms of *wealth* outcomes, but rationality is defined by *utility*. Dominance in wealth only translates to dominance in utility if utility scales precisely with log(wealth). For *any* other concave utility function (e.g., U(W) = sqrt(W), U(W) = -1/W), maximizing expected log wealth does *not* maximize expected utility, even over the long run. Kelly proponents assume the conclusion (log utility) within their proof of dominance.
  2.  **The Infinite Horizon is Irrelevant:** No economic agent operates over a truly infinite horizon. Humans are mortal. Investment goals have finite timeframes (retirement, buying a house, funding an endowment). The probability-1 result says nothing about performance over *any* finite period T, no matter how large. Crucially, over finite horizons, *other strategies can and do have higher probabilities of reaching specific wealth targets or avoiding ruin* than Kelly, especially for risk-averse individuals. Kelly might win "eventually," but "eventually" lies beyond the agent's planning horizon and lifespan.
  3.  **"With Probability 1" Ignores the Path:** Probability-1 dominance concerns the *limit*. It says nothing about the *distribution of wealth along the way*. The Kelly strategy can exhibit extreme volatility. It can lead to devastating drawdowns that, while theoretically recovered from *given infinite time*, would be catastrophic or intolerable for a real agent operating in finite time. A strategy offering smoother growth with a lower probability of catastrophic loss *within the relevant timeframe* can be strictly preferred under standard expected utility maximization.

  **Samuelson's Unassailable Core: Utility is Sovereign**

  Samuelson's rebuttal, distilled in his famous one-syllable-word paper ("Why we should not make mean log of wealth big though years to act are long"), cuts to the heart of the matter: **Rational choice theory is about maximizing *expected utility*, not wealth, over the relevant planning horizon.**

  *   **Utility is Personal:** Rationality does not dictate *which* utility function an agent *should* have. An agent with high risk aversion (e.g., U(W) = -exp(-aW)) rationally seeks stability and fears ruin. Forcing them into the volatile Kelly strategy because it wins "in the limit" violates their preferences and is therefore *irrational for them*. Kelly is optimal *only* for the specific preference structure embodied by log utility.
  *   **Time Matters:** Rational agents discount the future and care about consumption or wealth at specific points in time. A strategy that delivers superior performance over a 20-year horizon relevant to an agent's retirement goal is rationally preferable *for that agent*, even if Kelly would surpass it given 10,000 years. The infinite horizon is a mathematical abstraction disconnected from human experience and decision-making contexts.
  *   **The Fallacy of Composition:** The Kelly argument essentially says: "If you care *infinitely* about terminal wealth at time infinity, and only about that, then Kelly is best." But this is tautological. It defines the problem such that log utility is optimal. It doesn't prove that *every* rational agent *must* care infinitely about terminal wealth at infinity. Rational agents care about finite-horizon outcomes and have diverse risk preferences.

  **Countering the Kelly Defenders:**

  *   **"But Practically, Kelly is Good!":** This is often true *for investors whose risk tolerance aligns with its properties*. Fractional Kelly (betting a fraction of the Kelly stake) is a popular, pragmatic risk-management tool. However, its practical usefulness in specific contexts (e.g., repeated favorable gambles with known edge) does not elevate it to a universal principle of rationality. It remains a tool calibrated to a *type* of preference (moderate risk tolerance).
  *   **Ergodicity Economics (Peters):** This reframes the argument using dynamics, claiming non-ergodic processes require time-average growth maximization (equivalent to Kelly). While mathematically interesting, it ultimately smuggles in the same assumptions: it defines "rational" growth via the geometric mean/time-average, which is precisely equivalent to maximizing expected log wealth. It offers a different *story* but doesn't escape the core critique – it still assumes the agent's objective *is* to maximize that specific long-run growth rate, which is equivalent to assuming log utility. It doesn't prove other objectives are irrational.

  **The Verdict: Samuelson's Scalpel Triumphs**

  The Kelly Criterion's allure rests on a mathematical mirage – the conflation of a specific utility function (log) and an irrelevant time horizon (infinity) with objective, universal rationality. Samuelson surgically dissected this fallacy. He demonstrated that:

  1.  **Kelly-optimality is log-utility optimality.** It has no special claim beyond that.
  2.  **Probability-1 dominance over infinity is economically meaningless.** It provides no guidance for finite-lived agents with finite goals.
  3.  **Rationality is defined by maximizing expected utility over the relevant horizon.** Diverse, legitimate utility functions exist, and finite horizons are paramount.

  While the Kelly Criterion is a powerful tool for investors whose preferences align with its implicit log utility and tolerance for volatility over long periods, it possesses **no privileged, objective claim to being "the rational strategy."** Samuelson was right: elevating geometric mean growth maximization to a universal principle is indeed an "arbitrary preference dressed up as objective." Rationality requires acknowledging the sovereignty of individual utility and the finitude of time, principles that the Kelly criterion's infinite horizon sleight-of-hand cannot override. The geometric rationalists mistook a specific solution for the entire problem; Samuelson reminded us that the problem itself is richer and more human than their elegant, but ultimately limited, equation.
