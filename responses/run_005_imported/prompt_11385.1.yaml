answer: |-
  Your inquiry cuts to the heart of Moore's complex value theory. Moore *does* hold that unperceived beauty retains significant intrinsic value, though it exists in a different (and lesser) category than beauty *plus* appreciation. The principle of organic unities explains *why* this is coherent. Here's how the pieces fit:

  1.  **Unperceived Beauty: Significant Intrinsic Value (Not Mere Residue):**
      *   Moore's thought experiment explicitly argues that the *beautiful world itself* possesses intrinsic value *simply by being beautiful*, even unperceived. He considers it "absurd" to deny this.
      *   This value isn't a "small residue" – it's the *foundational* value of beauty *as a state of the universe*. It exists objectively, independent of consciousness. Protecting the remote wilderness preserves this objective good.

  2.  **Organic Unities: Explaining the Value Hierarchy:**
      *   The principle states: **"The value of a whole must not be assumed to be the same as the sum of the values of its parts."**
      *   Applied to beauty: A beautiful object *alone* (Part A) has intrinsic value (as per the thought experiment). Conscious appreciation of beauty *alone* (Part B - the mental state) also has intrinsic value. However:
      *   **The whole (A + B) - "beautiful object fittingly appreciated" - possesses a value *far greater* than the mere sum of the values of A and B.** The combination creates a new, vastly superior organic unity.
      *   **Analogy:** Imagine Part A (Beautiful Object) = 10 units of intrinsic value. Part B (Appreciation) = 5 units. The whole (A+B) isn't 15 units; it might be 50 or 100 units. The value explodes due to the *fitting relationship* between the object and the conscious state.

  3.  **Reconciling the Two:**
      *   **Unperceived Beauty Retains its "A" Value:** The unperceived beautiful wilderness still possesses its intrinsic value (the "10 units" in the analogy). This is non-trivial. Moore argues this value *is* real and significant *in itself*. Destroying it destroys that good.
      *   **The Greater Good Requires Combination:** The *greatest* goods Moore identifies (aesthetic enjoyment, personal affection) *are* these complex organic unities (A+B). They are supremely valuable *because* they combine an intrinsically valuable object with a fitting, intrinsically valuable conscious state directed towards it.
      *   **No Contradiction:** There's no contradiction. The thought experiment establishes that A has value. The principle of organic unities explains why A+B has *so much more* value than A or B alone. It doesn't negate the value of A; it contextualizes and elevates the value achievable when A is combined with B.

  4.  **The Parallel Case: Unloved Admirable Qualities:**
      *   Moore *can* and *does* say something parallel about unloved admirable qualities. This follows the same structure:
          *   **Part A (Admirable Personal Quality - e.g., courage, kindness):** This, *in itself*, possesses intrinsic value for Moore. A world containing such qualities is better than one without them, even if no one appreciates them or is affected by them. They are good states of being.
          *   **Part B (Personal Affection - love, admiration directed *towards* the person/quality):** This conscious state also has intrinsic value.
          *   **The Organic Unity (A+B - "admirable quality fittingly loved"):** This combination, the complex state of affairs where affection is appropriately directed towards the admirable quality *in a person*, constitutes one of the *greatest* goods. Its value is *far greater* than the sum of the value of the quality alone and the affection alone.
      *   **Key Difference?** While Moore *does* argue unloved admirable qualities have intrinsic value (like unperceived beauty), he places even greater emphasis on the *relational* nature of the supreme goods. Personal affection inherently involves a relationship between consciousness and its object (the person/quality). However, the *object* of that affection (the admirable quality *in the person*) still retains its intrinsic value even if the affection is absent. Destroying a person's courage destroys a good, even if no one ever knew they possessed it.

  **Implications for the Land Trust:**

  Moore provides a robust, non-utilitarian justification:

  1.  **Intrinsic Value of Wilderness:** Protecting the remote wilderness preserves an *objectively good state of the universe* – the intrinsic value inherent in its beauty, complexity, and existence, independent of human perception. This is a real good you are conserving.
  2.  **Preserving Potential for Greater Goods:** While unperceived *now*, preserving the wilderness maintains the *potential* for the far greater organic unity of human appreciation (B) being combined with its intrinsic beauty (A) in the future, should anyone encounter it. Destroying it destroys both the foundational value and all future potential for the supreme good involving it.
  3.  **Ecological Holism (Implicit):** Moore's organic unities principle resonates with ecological thinking. The wilderness itself is a vast, complex organic unity. Destroying part of it might destroy value far exceeding the sum of the values of its individual components (species, landscapes). Protecting the whole preserves this complex intrinsic good.
  4.  **Beyond Instrumental Value:** This justification moves beyond arguments based solely on ecosystem services (clean water, air) or future human use (recreation, medicine). It asserts the wilderness has value *in its own right*, simply by being what it is.

  **In Summary:**

  *   **Unperceived Beauty:** Retains significant intrinsic value (Moore's "A" value) – not a small residue.
  *   **Organic Unity:** Explains why "A + B" (beauty + appreciation) is vastly more valuable, but *depends on* the prior existence of "A".
  *   **Unloved Admirable Qualities:** Similarly retain intrinsic value ("A" value), while "A + B" (quality + fitting affection) is a supreme good. Personal affection *as a good* is inherently relational, but its *object* (the admirable quality) has value independently.

  Moore's framework strongly supports the land trust's practice. You are preserving foundational intrinsic goods (the beauty and existence of the wilderness) and the essential conditions for potential future supreme goods (human appreciation of that beauty), based on the objective value inherent in the state of the world itself.
