  I've been reading through some of the literature on safe Pareto improvements (SPIs) in bargaining under incomplete information—particularly Oesterheld and Conitzer's work on delegated game-playing—and I think I'm missing something at a fairly basic level. I get the surface pitch: instead of renegotiating the underlying game, players hand off play to delegates bound to a modified strategy profile that's guaranteed to weakly Pareto-improve on whatever equilibrium they'd otherwise land on, without forcing anyone to reveal exploitable private information. What I can't quite pin down is why the "safety" requirement is doing substantive work here rather than just being a dressed-up restatement of Pareto efficiency. Could you walk me through, at an intuitive level, what specifically goes wrong with a naive "just have everyone switch to the Pareto-improving strategy" proposal that the safety criterion is designed to block—and how this connects to worries about commitment races and information being leaked through the very act of proposing the improvement?
