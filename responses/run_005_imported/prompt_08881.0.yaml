  But does this really escape the regress? Strawson would say that if the agent's nature is determined by prior causes (genetics, environment), then they aren't truly responsible for their nature. Chrysippus might counter that the regress is irrelevant to moral responsibility, which is about present capacity to assent. However, this seems to relocate the problem. If the principal cause (the mind's nature) is shaped by factors beyond the agent's control, how can they be morally responsible? 

