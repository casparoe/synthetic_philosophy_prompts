  Okay, let me unpack this user's query about Henry Sidgwick's 1889 address. They're clearly deep in a philosophical rabbit hole, connecting Sidgwick's utilitarianism with his psychical research work. The core confusion seems to be about whether Sidgwick is supporting or refuting Hume's miracle argument, and what that "proportion of known to unknown" line really means.

  First, I need to reconstruct Sidgwick's argument step by step. He starts by acknowledging Hume's position: miracles are inherently improbable because they contradict uniform experience, while false testimony is comparatively more probable. But Sidgwick immediately reframes "contrary to experience" as merely meaning "novel" rather than "impossible." That's crucial - he's shifting the debate from impossibility to degrees of unfamiliarity.

  The user's coding background makes them want to Bayesianize this, but Sidgwick's 1889 context predates modern probability theory. His "no intellectual scales" lament isn't just rhetorical - he genuinely sees no way to quantify the improbability of novelty. When he says we can't know the proportion of known to unknown, he's making a profound epistemological point: we can't calculate priors for unprecedented events because we don't know the sample space of reality.

  About the Hume question: Sidgwick isn't taking sides. He accepts Hume's basic improbability framework but rejects its dogmatic application. His "quiet dismantling" comes through showing that novelty alone isn't sufficient grounds for dismissal - after all, many accepted phenomena were once novel.

  The user's frustration about practical guidance is understandable. Sidgwick deliberately avoids giving thresholds because he thinks each case requires contextual judgment. His "bound to face" admission is essentially saying: "Yes, weird claims start with high improbability, but no, I can't tell you exactly when to stop believing witnesses - stay empirically open while being rigorously critical."

  This tension between philosophical rigor and empirical openness explains why Sidgwick could simultaneously be a utilitarian icon and a psychical researcher. He's applying the same impartial standard to both domains: follow evidence wherever it leads, but acknowledge the limits of what evidence can prove when dealing with radical novelty.
answer: |-
  You've hit on a fascinating and nuanced passage where Sidgwick walks a tightrope between Humean skepticism and radical empiricism. Let's dissect his logic step-by-step:

  **1. Sidgwick vs. Hume: The Quiet Dismantling**
  *   **Hume's Core Argument:** Miracles (or any marvel) are maximally improbable because they are *contrary to the entire uniform course of human experience*. Testimony being false or mistaken, however, *is* within our experience. Therefore, it's always more rational to disbelieve testimony of a miracle than to believe the miracle occurred.
  *   **Sidgwick's Reformulation:** He agrees a marvel is "contrary to experience" but **radically redefines what that phrase means**. For Sidgwick, "contrary to experience" doesn't mean *logically impossible* or *inherently maximally improbable*. It simply means **"entirely novel and strange"** relative to *our current systematized knowledge*.
  *   **The Key Move:** Sidgwick points out that **humanity constantly encounters novel and strange things** that *become* part of experience (electricity, germs, relativity, quantum mechanics). The fact something is unprecedented *now* doesn't mean it *can't* become precedent *later*.
  *   **The Implication:** Hume's argument doesn't prove marvels *impossible*, only that they are *improbable* to a degree corresponding to their novelty. But crucially, this improbability isn't *absolute* or *infinite*; it's a matter of degree. **Sidgwick dismantles Hume's claim that the improbability of a marvel is *always* greater than the improbability of false testimony.** He puts them on a more level playing field as *different kinds* of improbabilities that can't be easily compared.

  **2. The "Proportion" Argument: More Than Just a Shrug**
  *   **The Core Insight:** Sidgwick argues we *cannot* accurately estimate the *prior probability* of a radically novel event (like telepathy) because doing so requires knowing something fundamentally unknowable: **the ratio of what we *know* about the universe to what we *don't* know.**
  *   **Why It Has Teeth:**
      *   **Rejects Naive Frequentism:** We can't say "telepathy has never happened before, so its prior probability is near zero" because that assumes our current experience captures *all possible* experiences. Sidgwick points out this is demonstrably false – history is full of unprecedented discoveries.
      *   **Highlights Epistemic Arrogance:** Assigning a very low prior probability to radical novelty *based solely on current knowledge* assumes we already know most of what's important or possible in the universe. Sidgwick argues this assumption is unjustified and unknowable ("that proportion is certainly one of the things that we do not know").
      *   **Undermines Quantification:** Your instinct to "slap a Bayesian framework on it" is exactly what Sidgwick is warning against *in this specific context*. Bayes' theorem requires a prior probability (P(H)). For a truly novel phenomenon (H), **what is P(H)?** Sidgwick argues that any specific number you assign (like 1 in a billion) is essentially arbitrary because it pretends to know the scope of the unknown. We lack the data to ground the prior.
      *   **Focuses on the Unknown Unknowns:** He's emphasizing that radical novelty points to *gaps* in our fundamental understanding of reality. The true prior probability isn't just low based on current data; it's *fundamentally incalculable* because we don't know the size or nature of the domain we're ignorant about.

  **3. Sidgwick's Conclusion: Embracing Epistemic Humility (Not Answering the Threshold Question)**
  *   **The Uncomfortable Truth:** Sidgwick concludes we *must* accept two things:
      1.  **Novelty Implies Improbability:** A claim of radical novelty *is* inherently improbable *based on established knowledge*. The more novel, the more initially improbable.
      2.  **The Rate is Unknowable:** **We cannot calculate *how* improbable it is, or *at what rate* the improbability increases with novelty.** There is no formula. We lack the necessary knowledge of the universe's total possibilities.
  *   **The Practical Implication:** Sidgwick is **NOT** giving a clear answer to "how weird does a claim have to be before I should stop trusting the witnesses?" Instead, he's providing a **framework for responsible investigation**:
      *   **Reject Dogmatic Skepticism (à la Hume):** Don't dismiss a claim *solely* because it's radically novel. Novelty alone isn't a sufficient reason for disbelief.
      *   **Demand Rigorous Evidence:** Precisely *because* the claim is initially highly improbable based on current knowledge, the **burden of proof is exceptionally high.** Evidence must be extraordinarily robust, gathered under meticulously controlled conditions, scrutinized for error and fraud far more intensely than for mundane claims.
      *   **Acknowledge the Limits of Logic:** Accept that assessing such claims involves grappling with fundamental epistemic uncertainty ("not very satisfactory to the logical mind, but one that we are bound to face").
      *   **Focus on Methodology:** This is why he helped found the SPR – to develop "Canons of Evidence" that could meet this high burden of proof *despite* the inherent improbability and epistemic uncertainty. The *process* of investigation becomes paramount.

  **In Summary:**

  1.  **On Hume:** Sidgwick **dismantles the *absolute* force** of Hume's argument by redefining "contrary to experience" as "novel" rather than "impossible" and pointing to historical precedent of novelty becoming accepted. He rejects Hume's claim that the improbability of the marvel is *always* greater than the improbability of false testimony.
  2.  **On the "Proportion":** This is a **profound epistemological argument**, not just a shrug. It highlights the fundamental *incalculability* of prior probabilities for radical novelty due to our ignorance of the universe's total scope. It undermines attempts to assign precise numerical priors and exposes the arrogance of assuming current knowledge defines all possibility.
  3.  **On the Threshold:** Sidgwick **does not provide a threshold.** He argues that while novelty *does* create initial improbability, the *degree* is unknowable. Therefore, the practical answer isn't a rule, but a **methodological imperative:** investigate radical claims with extreme rigor and skepticism, demanding evidence proportional to the strangeness of the claim, while remaining open to the possibility that genuine novelty *could* exist. He's explaining *why* the question is so hard, not giving a simple answer. His work with the SPR was an attempt to build the tools (the "Canons") to navigate this uncertainty rigorously.
