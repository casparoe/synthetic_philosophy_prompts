prompt: |-
  For my school's philosophy elective, we've been assigned an excerpt from Hume's An Enquiry Concerning Human Understanding, and I'm writing a short response paper connecting it to the modern debate over laws of nature. I follow the headline argument -- that we never actually perceive a "necessary connexion" between cause and effect, only constant conjunction -- but I keep getting stuck on the passage below, from near the end of Section VII, Part II, where Hume finally tries to define "cause":

  "It appears, then, that this idea of a necessary connexion among events arises from a number of similar instances which occur, of the constant conjunction of these events; nor can that idea ever be suggested by any one of these instances, surveyed in all possible lights and positions. But there is nothing in a number of instances, different from every single instance, which is supposed to be exactly similar; except only, that after a repetition of similar instances, the mind is carried by habit, upon the appearance of one event, to expect its usual attendant, and to believe, that it will exist. This connexion, therefore, which we feel in the mind, this customary transition of the imagination from one object to its usual attendant, is the sentiment or impression, from which we form the idea of power or necessary connexion. [...] Similar objects are always conjoined with similar. Of this we have experience. Suitably to this experience, therefore, we may define a cause to be an object, followed by another, and where all the objects, similar to the first, are followed by objects similar to the second. Or in other words, where, if the first object had not been, the second never had existed. The appearance of a cause always conveys the mind, by a customary transition, to the idea of the effect. Of this also we have experience. We may, therefore, suitably to this experience, form another definition of cause; and call it, an object followed by another, and whose appearance always conveys the thought to that other. But though both these definitions be drawn from circumstances foreign to the cause, we cannot remedy this inconvenience, or attain any more perfect definition, which may point out that circumstance in the cause, which gives it a connexion with its effect."

  Two things are confusing me. First, Hume gives two definitions of cause here, and they don't obviously pick out the same thing: one is about a regularity among external events (all A's followed by B's), the other about a habit of expectation formed in the mind of an observer. He seems to sense the gap himself -- he admits both are "drawn from circumstances foreign to the cause" -- but never tells us which one is actually supposed to capture what causation is. Second, my teacher mentioned that this passage is usually treated as the historical seed of "Humeanism" about laws of nature, the view associated with David Lewis on which laws are nothing but a compact summary of the total pattern of events. But if it's really the second, psychological definition doing the philosophical work for Hume, his position sounds like a claim about facts concerning our minds, not about what is out there in the world -- which seems like a much more deflationary claim than what contemporary Humeans about laws actually hold.

  Could you help me work out what Hume is actually committed to here, and then explain how direct the line from this passage really is to the present-day dispute between Humeans (Lewis's regularity/best-system account) and anti-Humeans (Armstrong's necessitation relations, Maudlin's primitivism, or dispositional essentialism) about laws of nature? I'd rather understand the actual argumentative move than just repeat the "no necessary connexion" slogan.
reasoning: |-
  Okay, let me tackle this student's question about Hume's two definitions of cause and their connection to modern debates about laws of nature. 

  First, I need to unpack why they're confused. They see Hume giving two definitions - one about external regularities ("all A's followed by B's") and one about psychological habits ("mind expects B after A"). The student is sharp to notice these don't neatly align, and that Hume himself calls both "foreign to the cause." 

  Hmm, the real issue here is metaphysical versus psychological. When Hume says "necessary connexion" is just our feeling of expectation from repeated conjunctions, he's making a radical move: what we call causation isn't in the world, it's in our heads. But then his first definition talks about objects being followed by other objects in the world. So which is it?

  Ah! The key is that for Hume, these are two sides of the same coin. The psychological part (definition 2) explains why we have the idea of necessity, while the regularity part (definition 1) describes what's actually happening in reality. There's no "glue" holding cause and effect together - just patterns in nature plus human psychology. 

  Now about the modern Humeanism connection... The student's teacher is right that this seeds Lewis' view, but the student is also right to sense a difference. Lewis takes the regularity part seriously as a foundation for laws, while downplaying the psychology. That's why contemporary Humeans can be realists about laws (as patterns) without buying into metaphysical necessity. 

  The jump to modern debates becomes clearer when we see anti-Humeans attacking exactly what Hume denied: that laws involve real necessitation (Armstrong), primitive physicality (Maudlin), or dispositions (Bird). They're all trying to put the "glue" back that Hume removed. 

  What this student really needs is to see how Hume's psychological move lets him avoid metaphysical commitments about the world, while still giving an account of why we think in causal terms. That's the bridge to modern Humeans who similarly want to ground laws without mysterious necessities. 

  I should emphasize that for Hume, the two definitions aren't rivals - they're complementary descriptions of the same phenomenon from different angles. The gap between them is precisely his point: causation as we conceive it is partly projection. 

  When connecting to Lewis, I'll note how he inherits Hume's regularity foundation but replaces psychology with systematicity (best-system account). This lets contemporary Humeans talk objectively about laws while staying true to Hume's core insight: no hidden necessities.
answer: |-
  This is an excellent set of questions that cuts to the heart of Hume's project and its modern legacy. Let's break down Hume's move and its connection to the contemporary debate.

  **1. Unpacking Hume's Two Definitions & His Core Commitment:**

  Hume is grappling with a fundamental problem: we *talk* about cause and effect implying necessity ("A *makes* B happen"), but when we introspect our experience, we never observe that "making" force itself. We only observe:
  *   Event A (e.g., one billiard ball moving towards another)
  *   Event B (e.g., the second ball moving away)
  *   The *constant conjunction* of A-like events and B-like events.

  **The Gap & The Definitions:**
  *   **Definition 1 (Regularity):** "an object, followed by another, and where all the objects, similar to the first, are followed by objects similar to the second." This defines cause purely in terms of patterns in the *external world* – a universal regularity. It describes *what happens*.
  *   **Definition 2 (Psychological):** "an object followed by another, and whose appearance always conveys the thought to that other." This defines cause in terms of the *internal mental state* of an observer conditioned by past experience. It describes *how we think* about what happens.

  **Why Two Definitions? What is Hume Committed To?**

  Hume isn't giving two competing definitions of the same *metaphysical thing*. He's exposing the *only two places* we can locate the idea of "necessary connection":
  1.  **In the World?** We look for it there (Definition 1 territory), but find only constant conjunction, *never* an observable "power" or "necessity" linking A and B.
  2.  **In the Mind?** We *do* find a strong feeling of expectation, a "customary transition" (Definition 2 territory). This feeling *is* the impression from which we derive the *idea* of necessary connection.

  **Hume's Core Commitment (The Actual Argumentative Move):** There is **no empirically discoverable "necessary connection" *in the objects themselves***. The *only* foundation for our idea of causal necessity is the psychological habit formed by observing constant conjunction.

  *   **"Circumstances foreign to the cause":** This is crucial. Hume admits both definitions point to things *other than* some inherent power in the cause itself. Definition 1 points to *other events* (past and future regularities). Definition 2 points to the *observer's mind*. The "cause" as a locus of intrinsic power connecting it to its effect is absent from our experience. We cannot define it by pointing to that power because we never perceive it.
  *   **Which Definition Captures Causation?** For Hume, **Definition 1 describes the objective, mind-independent regularity in the world** that we observe. **Definition 2 explains the *origin* of our *subjective idea* of necessity**, which we mistakenly project *onto* the regularity described by Definition 1. The *reality* of causation, as far as we can empirically know it, *is* the constant conjunction (Definition 1). The *feeling* of necessity *about* that conjunction comes from our psychology (Definition 2). They are two sides of the same coin: the world provides the pattern, our minds provide the sense of "must."

  **2. The Line to Modern Humeanism vs. Anti-Humeanism:**

  Your teacher is right that this passage is the seed of Humeanism about laws. However, your intuition about the difference between Hume's psychological emphasis and modern Humean realism is also spot on. Here's the connection and the evolution:

  *   **The Seed (Hume):**
      *   Denies objective, governing "necessary connections" (powers, dispositions, governing relations) inherent in nature.
      *   Reduces causation to constant conjunction (regularity).
      *   Explains the *appearance* of necessity psychologically.
      *   **Metaphysical Stance:** Deflationary/Projectivist. Necessity isn't "out there"; it's a projection of our minds onto observed regularities.

  *   **Modern Humeanism (Lewis, Loewer, etc. - The "Best System Account"):**
      *   **Retains Hume's Core Denial:** Rejects objective, irreducible necessary connections or governing powers as the truthmakers for laws.
      *   **Shifts from Psychology to Systematization:** Instead of grounding laws *only* in brute regularity or psychology, Lewis proposes laws are the axioms or theorems of the "Best System" that best balances **simplicity** and **strength** in describing the entire mosaic of particular matters of fact (all events throughout space-time).
      *   **Objective but Non-Governing Laws:** Laws are real patterns *within* the Humean mosaic, not things that *govern* it from outside. They supervene on the total history of particular events. A law is "true" because it is part of the most efficient summary of everything that happens, not because it forces things to happen.
      *   **Connection to Hume:** The "Humean mosaic" (the totality of particular events) is the modern descendant of Hume's constant conjunctions/Definition 1. The "Best System" is a sophisticated way to pick out the *important* regularities without invoking non-Humean necessity. It replaces Hume's psychological explanation for the *appearance* of necessity with an objective, systematic criterion for identifying *which* regularities deserve the label "law." **Modern Humeanism is thus *realist* about laws as objective features of the world (patterns in the mosaic), but *anti-realist* about any non-Humean necessity or governing power.** They embrace Definition 1's spirit (laws are about patterns of events) but provide a more robust, non-psychological criterion for identifying laws.

  *   **Anti-Humeanism (Armstrong, Maudlin, Bird, etc.):**
      *   **Rejects Hume's Core Denial:** Argues that laws *do* involve or express some form of objective, irreducible necessity, power, or primitive physical constraint *in the world itself*.
      *   **Armstrong (Necessitation Relations):** Laws are relations of necessitation between universals (e.g., N(F, G) meaning "F-ness necessitates G-ness"). This N is a real, irreducible relation in the world that *explains* the regularity.
      *   **Maudlin (Primitivism):** Laws are primitive fundamental entities that *directly govern* the evolution of the physical state through time. They are ontologically basic, not reducible to patterns.
      *   **Dispositional Essentialism (Bird, Ellis, etc.):** The fundamental properties of things are essentially dispositional (e.g., charge *is* the disposition to attract opposites). Laws are not separate entities but flow *necessarily* from the essential dispositional natures of properties. Necessity is built into the fabric of reality via these essences.
      *   **Connection to Hume:** Anti-Humeans argue that Hume's regularity account (and modern Humean systematizations) fails to capture the *modal force*, *explanatory power*, or *counterfactual robustness* of genuine laws. They see Hume's rejection of necessary connection *in the objects* as a fundamental mistake. They aim to put the "oomph" or "glue" back into nature that Hume removed. They see Definition 2 as admitting defeat, showing that Humeanism cannot account for the necessity we *rightly* attribute to laws.

  **The Directness of the Line:**

  The line is **very direct in terms of the core metaphysical disagreement**, but **indirect in terms of the specific accounts offered.**

  *   **Core Dispute (Direct):** The fundamental question dividing Humeans and anti-Humeans remains **exactly the one Hume posed:** Are laws of nature (and thus causation) ultimately just patterns in the occurrence of events (Humean mosaic/supervenience), or do they involve some form of objective, irreducible necessity, power, or governance inherent in nature (anti-Humean additions)? Hume definitively framed this question and argued for the first option.
  *   **Evolution of Arguments (Indirect):** Modern Humeanism (Lewis) is a sophisticated *response* to perceived weaknesses in simple regularity theories (like Definition 1 alone). It addresses problems like accidental regularities and the need for law-like explanation by introducing systematization. Anti-Humeanism has developed sophisticated positive accounts (necessitation relations, primitivism, dispositional essentialism) precisely to counter the Humean denial of necessity and provide a richer ontology. Hume's psychological explanation (Definition 2) is largely set aside by both sides in the *metaphysical* debate about what laws *are in the world*, though it remains relevant in epistemology and philosophy of mind. Modern Humeans focus on developing an objective account of laws *within* the constraint of Hume's denial of necessary connection.

  **In Summary for Your Paper:**

  *   Hume's two definitions expose his core insight: we find no "necessary connexion" in the world, only constant conjunction (Def 1). The *feeling* of necessity arises from our psychology (Def 2). The *reality* of causation is the regularity.
  *   He is committed to: **No objective necessary connections in nature. Causation = Constant Conjunction. Necessity = Projected Psychological Habit.**
  *   This passage is the **historical origin** of the Humean stance on laws: laws are ultimately descriptions of patterns, not expressions of governing powers.
  *   The **modern debate directly inherits Hume's core question** (Patterns vs. Necessity/Power) but has developed far more sophisticated versions of both Humeanism (Best System) and anti-Humeanism (Necessitation, Primitivism, Dispositionalism) to address the complexities Hume identified and the arguments developed since.
  *   **Key Contrast:** Modern Humeans are *realists* about laws *as objective patterns* identified systematically, while rejecting *non-Humean necessity*. Hume himself had a more deflationary/projectivist tone due to his emphasis on psychology (Def 2), but his core metaphysical claim (Def 1, no necessity "in the objects") is the foundation modern Humeans build upon. Anti-Humeans reject that foundation, insisting some form of necessity *is* "in the objects" or fundamental to reality.

  Focus your response paper on how Hume's dissection of our *idea* of necessity forces the question: "If it's not in the objects, where *is* it?" His answer (in the mind) and his definition of cause as regularity create the space that modern Humeans fill with systematization and anti-Humeans fill with various ontologies of power/necessity. The core battle line was drawn by Hume.
