  ### Justification of Scores  
  **Statement 1 (Owen): Score 1**  
  *Partly correct but incomplete.* Owen rightly identifies the disparity in false positive rates (FPR) as a fairness concern—non-defaulters in Group B face unnecessary hurdles more often. This violates "equal opportunity" fairness. However, his solution (different thresholds per group) risks introducing new unfairness (e.g., penalizing Group B for higher historical base rates without addressing root causes).  

  **Statement 2 (Naomi): Score 2**  
  *Clearly correct.* Naomi highlights calibration (identical risk scores → identical outcomes) as a core fairness property. Forcing equal FPR by adjusting thresholds per group would mean identical risk scores get different treatments *based on group membership*—effectively baking discrimination into the system.  

  **Statement 3 (Owen): Score 2**  
  *Clearly correct.* Owen correctly notes that calibration alone doesn’t prove fairness. If historical data reflects bias (e.g., Group B’s higher base default rate stems from past discrimination), calibration merely replicates that bias. Relying on it as a defense ignores systemic issues.  

  **Statement 4 (Naomi): Score 2**  
  *Clearly correct.* Naomi identifies the root problem: contaminated base rates/labels. Forcing equal FPR without fixing this relocates unfairness. It would:  
  - Treat marginal Group A applicants (lower true risk) and Group B applicants (higher true risk) identically, harming the former.  
  - Require explicit group-based thresholds, which is often illegal/inequitable.  
  Her call to audit data/labels is the principled fix.  

  ### The Bigger Picture: What’s Being Traded Off  
  Both miss that **fairness is multi-dimensional**, and no single metric (calibration, FPR equality) suffices. The core trade-off is between:  
  1. **Individual Fairness:** Should two people with identical *predicted risk* receive identical treatment? (Naomi’s calibration focus.)  
  2. **Group Fairness:** Should two groups experience similar *outcomes* (e.g., similar burdens for non-defaulters)? (Owen’s FPR focus.)  

  In this case:  
  - **You cannot satisfy both simultaneously** if base default rates differ (unless the model is perfect).  
  - **The root conflict is contaminated data.** Historical bias in labels/features distorts both predicted risk (undermining calibration) and base rates (inflating Group B’s FPR).  
  - **Band-Aid fixes (like group-specific thresholds) create new problems:** They violate individual fairness, require legally fraught group-based decisions, and ignore upstream data issues.  

  ### Recommendation  
  Prioritize Naomi’s approach:  
  1. Audit historical data/labels for bias (e.g., were Group B applicants denied loans more often despite similar creditworthiness?).  
  2. Fix features/labels to remove artifacts of past discrimination.  
  3. *Then* retrain the model. Only if disparities persist should you consider trade-offs between fairness metrics—with legal/ethical input.
