prompt: |-
  So last night a friend of mine (she's doing a postdoc in computational neuro) was going on about how Integrated Information Theory is basically the only serious scientific theory of consciousness we've got, because it actually spits out a number (phi) instead of just hand-waving about "neural correlates." I pushed back with this thing I vaguely remember from a Scott Aaronson blog post years ago — that you can apparently construct some boring grid-like circuit (something built out of an expander graph doing a bunch of parity/XOR checks, if I'm remembering right) that ends up with way higher phi than an actual human brain, even though its just crunching linear algebra and clearly isn't "experiencing" anything in any meaningful sense. Her comeback was basically "yeah, and Tononi's actual response to that was to just bite the bullet and say fine, the grid is conscious then" — which honestly didn't make me feel better about the theory, but she insisted that's the intellectually honest move given IIT's own axioms, and that my discomfort is just an unprincipled appeal to intuition. We went back and forth for like an hour on her couch and never actually resolved anything.

  So now I want an actual verdict out of you, not a "there are good points on both sides" cop-out. Write me an essay that seriously grapples with this: lay out why IIT's defenders think phi is a principled way to ground consciousness in a system's intrinsic causal structure (feel free to get into the axioms/postulates — intrinsic existence, integration, exclusion, whatever subset matters most for your argument), then lay out the strongest version of this "unconscious expander" style objection, plus the seperate-but-related "unfolding" worry that a recurrent network and its behaviorally-identical feedforward "unfolding" could get wildly different phi scores. Then actually tell me: does IIT survive this, or does biting the bullet basically amount to admitting the theory is unfalsifiable dressed up in impressive-looking math? Don't hide behind "it depends what you want out of a theory of consciousness" — pick a side and defend it.
