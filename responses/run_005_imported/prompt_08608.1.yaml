answer: |-
  Your reconstruction is impressively sharp for a memory-based summary, but let's dissect it point by point:

  ### 1. Accuracy: Is this Dummett?
  *   **The First Part (Corrosive Critique):** You nail this. Dummett relentlessly attacks restrictionist arguments (economic burden, cultural cohesion, integration difficulties) as veils for racism and xenophobia. He *does* ground refugee rights firmly in the 1951 Convention and basic morality, arguing states have minimal legitimate grounds to override them. His focus on unmasking *actual* motives as racist rationalizations is a signature Dummett move, distinct from, say, Carens' more abstract ethical arguments or Walzer's communitarian balancing.
  *   **The Second Part (Concession & Impartiality):** You correctly identify the "absorptive capacity" exception and the crucial impartiality requirement. Dummett *does* argue a state can restrict immigration *if* admitting more would genuinely overwhelm its capacity to provide essential services/support *and* if the restriction criteria are impartial (e.g., a global queue, not targeting specific nationalities/ethnicities). This is his attempt to carve out a *non-racist* justification for limits.
  *   **Attribution:** The *structure* (devastating critique + limited principled exception) isn't unique to Dummett, but the *emphasis* is his:
      *   **Specific Focus on Racism:** The sheer ferocity and centrality of unmasking *racism* as the core driver is Dummett's hallmark. While Miller discusses fairness and Walzer community, Dummett's primary lens is anti-racism.
      *   **Impartiality Test:** While impartiality is a common liberal value, Dummett elevates it to the *sole* criterion distinguishing legitimate restriction from illegitimate exclusion in this context. His work on voting theory likely informs this procedural emphasis. This *specific formulation and centrality* are strongly Dummettian.
      *   **Refugee Emphasis:** His strong, near-absolute stance on refugee obligations, grounded directly in the Convention and basic rescue morality, is a key pillar more pronounced than in some contemporaries.

  **Verdict:** Your summary is largely accurate and captures core Dummett arguments. You haven't fundamentally misrepresented him or accidentally attributed a general liberal argument. The *combination* of the corrosive anti-racism focus, the strong refugee claim, and the specific impartiality test as the gatekeeper for the "capacity" exception *is* distinctively Dummett.

  ### 2. Substance: Is the tension genuine? Can it be blocked?
  *   **The Tension is Real and Acute:** Your critique is spot-on. The elasticity of "absorptive capacity" is the book's Achilles' heel. As you say:
      *   "Capacity" is inherently political, economic, and social. What counts as "overwhelming"? Infrastructure? Housing budgets? Social cohesion (a concept Dummett himself critiques elsewhere!)? Defining it is deeply contested.
      *   Governments *can* and *do* manipulate resource-based arguments ("we're full," "our services are stretched") precisely to mask exclusionary motives Dummett condemns. Austerity politics easily feeds this.
      *   **The Impartiality Test's Weakness:** This is the crux. Dummett relies *heavily* on impartiality (non-discriminatory criteria) to prevent the capacity exception from swallowing his anti-racist rule. But as you imply:
          *   A government can *claim* its capacity-based restrictions are impartial (e.g., "global quota filled") while *defining* capacity in a way deliberately calculated to exclude specific groups it dislikes (e.g., setting the quota absurdly low based on xenophobic assumptions about strain).
          *   Impartial *application* of a policy doesn't guarantee impartial *intent* or *justification* in setting the capacity threshold itself. The test primarily catches *blatant* discrimination in selection, not the *covert* discrimination embedded in how "capacity" is constructed.
  *   **Can Dummett Block It?** Defending him requires leaning into aspects he might underemphasize:
      *   **Good Faith Requirement:** Dummett implicitly assumes states arguing capacity limits are acting in good faith, rigorously and honestly assessing their resources against needs. He might argue your scenario involves *bad faith* abuse of the exception, not a flaw in the principle itself. But his book offers little institutional guard against bad faith.
      *   **Burden of Proof:** He could argue the burden lies *heavily* on the state to *prove* capacity is genuinely overwhelmed, requiring transparent, evidence-based assessments, not just assertions. He gestures towards this but doesn't develop robust mechanisms.
      *   **Dynamic Capacity:** He might stress that "capacity" isn't static. A truly impartial and non-racist society would be *obliged* to actively *increase* capacity (invest in housing, services, integration) to meet moral obligations, rather than using existing limits as a fixed excuse. Again, this is hinted at but not systematized.
      *   **Refugee Carve-Out:** Crucially, the capacity exception arguably applies *less* (or not at all?) to refugees under his strong reading of the Convention/morality. Their claim is near-absolute. This limits the damage somewhat, but doesn't solve it for broader immigration.

  **Verdict:** The tension is a significant, arguably fatal, flaw in his practical framework. While Dummett *intends* impartiality to be a strong safeguard, its focus on procedural application rather than the substantive justification of the capacity threshold leaves a gaping hole for the very rationalizations he exposes. Blocking it requires assumptions about state good faith or institutional mechanisms he doesn't adequately provide.

  ### 3. Framing: Is this the most interesting fault line?
  *   **Strengths of Your Focus:**
      *   It highlights a core *practical* and *internal* contradiction within Dummett's own argument structure.
      *   It connects directly to the central theme of unmasking racist rationalizations – showing how his own concession can be co-opted.
      *   It's concise and impactful for your paragraph.
  *   **Other Potentially Interesting Fault Lines:**
      *   **Anti-Racism vs. Democracy:** Dummett is deeply skeptical of majoritarian will when it comes to immigration, seeing it as often racist. But his solution (impartial capacity limits) lacks democratic legitimacy itself. Is the anti-racist philosopher justified in overriding (or severely constraining) democratic preferences on this issue? This connects to broader tensions in liberal political philosophy.
      *   **The Refugee vs. Immigrant Distinction:** While strong on refugees, his framework for other immigrants is arguably quite restrictive *if* capacity is deemed limited. Is this tension morally justified? Does his focus on anti-racism obscure other ethical claims (e.g., freedom of movement, global poverty) that theorists like Carens emphasize?
      *   **The Role of Culture:** Dummett fiercely rejects cultural preservation/national identity as valid reasons for restriction, seeing them as inherently exclusionary. But is this too dismissive? Does his framework leave *any* room for legitimate concerns about the pace or scale of change, even if not ethnically defined? (This pits him directly against Walzer/Miller).
      *   **The Philosopher-Activist Gap:** How does the technical philosopher of language/logic approach a messy political issue? Does his focus on logical unmasking of motives lead him to underestimate the complexity of integration, social cohesion (non-racist aspects), or political feasibility? Does his absolutism on refugees reflect his philosophical rigor or activist passion?
  *   **Recommendation:** Your chosen fault line is **excellent and relevant**, especially for illustrating how a philosopher's carefully constructed policy framework might unravel under political reality. It's central to the book's argumentative structure.
      *   **However,** for a *longer feature*, briefly acknowledging *another* layer could add richness. Perhaps a sentence hinting at the **anti-racism vs. democracy** tension ("Dummett's deep suspicion of majoritarian sentiment on immigration...") or the **refugee/immigrant distinction** ("While offering refugees near-absolute sanctuary, his framework leaves other migrants vulnerable to the contested logic of capacity...") would show the depth of engagement without derailing your core point.

  ### Final Thoughts & Suggestions

  *   **Accuracy:** You're on solid ground. To bolster it, you could slightly tweak: *"...he argues that almost every argument actually offered for restricting immigration... turns out, on inspection, to be either question-begging or a rationalization (often racist) for maintaining the population's existing ethnic composition..."* (Adding "often racist" captures his emphasis).
  *   **Substance:** Your critique is valid. To strengthen the paragraph, consider tightening the last sentence: *"...so the impartiality test, focused on application rather than the justification of the capacity threshold itself, may do little to prevent the concession from being co-opted by the very motives Dummett exposes."*
  *   **Framing:** Stick with your core tension. It's powerful and directly serves your paragraph's purpose. Exploring others is better saved for the wider feature.
  *   **Overall:** This is a strong, insightful paragraph. The tension you identify is genuine, important, and well-explained. It effectively captures a key challenge in Dummett's attempt to bridge rigorous philosophy and practical policy advocacy. Proceed with confidence, perhaps adding just a touch more of his distinctive anti-racist emphasis.
