  Okay, let me unpack this user's query. They're a TA for a seminar on free will and moral responsibility, specifically discussing P.F. Strawson's "Freedom and Resentment" and Galen Strawson's Basic Argument. The user mentions that Galen responded to his father's work and is curious about how their views interact and which one is more correct. 

  First, I need to recall both arguments. P.F. Strawson argues that reactive attitudes like resentment or gratitude are inherent in human relationships. They don't depend on determinism; they're just part of our social fabric. The objective attitude—seeing others as objects to be managed—is only feasible in limited cases, like with children or mentally ill individuals. 

  Galen Strawson's Basic Argument says that true moral responsibility requires self-creation. But since we don't create our own mental makeup, we can't be ultimately responsible. This leads to an infinite regress. He concedes that we have reactive attitudes but insists they don't grant genuine desert.

  The user's main questions are: Do these views contradict? Are they addressing different questions? Who is more correct? 

  Assessing contradictions: P.F. is descriptive, explaining how we operate. Galen is prescriptive, arguing about what true responsibility requires. So they're not directly opposing; Galen shifts the focus to a metaphysical standard P.F. avoids. That's a key point.

  On who's right: P.F.'s approach is pragmatically sound. It grounds responsibility in social practices, making it relevant to real life. Galen's argument is logically tight but may set an impossible standard, making responsibility unattainable. The user's seminar might benefit from discussing whether moral responsibility needs such a high bar or if P.F.'s naturalistic view suffices.

  The user also hinted at the family dynamic, which is interesting but not the main issue. Their deeper need is likely to facilitate a productive seminar discussion. They need clear distinctions between the arguments and their implications for moral responsibility. 

  I should emphasize that P.F. avoids metaphysical debates, while Galen insists on them. The choice between the two depends on whether we value practical applicability or logical consistency. Highlighting this tension can help the TA guide their students' debate effectively.
answer: |-
  This is a *fantastic* collision of ideas, made even more intriguing by the father-son dynamic! You've nailed the core tension. Let's break down your questions:

  ### 1. Do P.F. and Galen Strawson Contradict Each Other?
     **Not directly, but they are fundamentally at cross-purposes.** Think of it as talking past each other on different levels:

  *   **P.F. Strawson ("Freedom and Resentment"):** Engages in **descriptive metaphysics** and **philosophical psychology**. His question is: *How does the concept of moral responsibility actually function within our human form of life?* His answer: It's grounded in our inescapable, natural, social-emotional reactive attitudes. These attitudes are constitutive of interpersonal relationships. The "truth" of determinism (or indeterminism) is irrelevant to *whether* we have these attitudes or *whether* they are justified *within the practice*. The "objective attitude" is a limited tool we apply in specific cases (children, insanity, severe manipulation), but it cannot replace the participant stance generally without dissolving the relationships that define us as persons. He **brackets** the traditional metaphysical question ("Is responsibility *ultimately* compatible with the nature of reality?") as misguided or irrelevant to the practice.

  *   **Galen Strawson (Basic Argument):** Engages in **pure metaphysics** and **conceptual analysis**. His question is: *What would "true," "ultimate," "desert-entailing" moral responsibility metaphysically require?* His answer: It would require being *causa sui* (self-caused) in a way that escapes the conditioning of prior causes (genetic, environmental, etc.) – specifically, being responsible for the "crucial mental respects" that lead to your choices. He argues this is impossible due to an infinite regress (who creates the creator?) and thus, *true* moral responsibility is impossible *regardless* of determinism. He **concedes** P.F.'s descriptive point: Yes, we *have* reactive attitudes and hold people responsible *as if* they were ultimately responsible. But, crucially, he argues this descriptive fact **does not entail** the metaphysical truth of ultimate responsibility. We're just stuck in a practice that presupposes an incoherent concept.

     **Conclusion on Contradiction:** They aren't *logically* contradictory because they address fundamentally different questions. P.F. describes and justifies the *practice* from within the human perspective. Galen analyzes the *metaphysical preconditions* of a specific, demanding conception of responsibility *from outside the practice*. Galen isn't *refuting* P.F.'s description of how we live; he's arguing that what the practice *presupposes* (ultimate responsibility/desert) is metaphysically impossible. He *is* changing the subject from "How does responsibility work for us?" to "What would it *really* take for responsibility to be ultimately true, and is that possible?"

  ### 2. Who is Doing More Serious Philosophical Work / Who Comes Closer to Being Right?
  This is the million-dollar question, and the answer depends heavily on your philosophical priorities:

  *   **The Case for P.F. Strawson:**
      *   **Grounded in Reality:** He takes human experience and social practice seriously as the *starting point*. His account explains why responsibility talk persists even after centuries of metaphysical debate about determinism.
      *   **Avoids Metaphysical Quagmires:** He successfully sidesteps the often intractable and abstract debate about determinism vs. indeterminism by showing it doesn't actually touch the core of our lived practice of holding responsible.
      *   **Explains Variation:** His framework elegantly explains *why* we *don't* hold certain agents responsible (the insane, children under duress) without needing to invoke dubious metaphysical free will – it's about the applicability of the participant stance/reactive attitudes.
      *   **Practical Relevance:** His view provides a robust foundation for ethics, law, and interpersonal relationships *as we actually experience them*. It accepts our humanity as it is.
      *   **Critique of Galen:** Galen's "true" responsibility might be a philosopher's fiction – an impossibly high standard irrelevant to the only kind of responsibility that *matters* in human life. Demanding *causa sui* is like demanding a circle be square.

  *   **The Case for Galen Strawson:**
      *   **Conceptual Rigor:** He identifies a deep, arguably fatal, conceptual problem with the notion of *desert* or *ultimate* responsibility that P.F. seems to take for granted within the practice. If responsibility entails *desert* (especially of *blame* or *punishment*), doesn't that *require* being the ultimate originator?
      *   **Exposes a Presupposition:** He successfully shows that our reactive attitudes and practices *do* tacitly presuppose something like ultimate responsibility (why feel *indignant* at a wrongdoer if they ultimately couldn't be otherwise?). P.F. might downplay this, but Galen forces us to confront it.
      *   **Metaphysical Honesty:** He refuses to let the practical utility or psychological inevitability of the practice obscure the potential metaphysical falsehood of its core presupposition. He takes the demand for *true* justification seriously.
      *   **Critique of P.F.:** P.F. might be guilty of a kind of naturalistic fallacy or complacency. Just because we *can't help* having reactive attitudes doesn't mean they are *ultimately justified* if they rest on an impossible metaphysical requirement. His view might provide a pragmatic *excuse* but not a genuine *justification* for blame/praise involving desert.

  **Who Comes Closer? A Balanced Verdict (Leaning P.F. for "Work"):**

  *   **"Serious Philosophical Work":** **P.F. Strawson** arguably does more *transformative* and *practically relevant* philosophical work. He reshaped the entire free will debate by shifting the focus away from sterile metaphysics towards the lived reality of responsibility practices. His framework is incredibly fertile for understanding ethics, psychology, law, and social interaction. Galen's argument, while logically powerful, is more of a devastating critique of a specific, demanding concept than a constructive account of responsibility *as we know it*.
  *   **"Actually Being Right":** This depends on what you think moral responsibility *is* or *requires*:
      *   If you think moral responsibility is *essentially* a social practice grounded in our emotional responses and relationships, and "desert" is defined *within* that practice (e.g., "desert" just means being an appropriate target of reactive attitudes given our norms), then **P.F. Strawson is right.** Responsibility is real *as a human phenomenon*.
      *   If you think moral responsibility *essentially* requires being the *uncaused cause* of your actions in a way that makes you *truly deserving* of ultimate credit or blame (heaven/hell level), then **Galen Strawson is right** that this is impossible. Responsibility in *this* sense is an illusion, however psychologically ingrained our feelings are.

  **For Your Seminar:**

  *   **Frame the Debate:** Emphasize they are answering different questions (descriptive practice vs. metaphysical preconditions).
  *   **Highlight the Stakes:** Does the practical reality and social necessity of the participant stance *justify* it, even if its deepest presupposition is incoherent (P.F.'s view)? Or does the incoherence of the presupposition undermine the *ultimate moral force* of the practice, leaving us in a state of inescapable illusion (Galen's view)?
  *   **The Family Dynamic Speculation:** Galen's piece is likely a respectful but rigorous philosophical engagement. He clearly understands his father's argument deeply and concedes its descriptive power while relentlessly pursuing the metaphysical question his father bracketed. It's a fascinating case of intellectual inheritance combined with fundamental dissent. (Try searching for Galen Strawson's "The Impossibility of Moral Responsibility" or later works like "Free Will and Luck" – he often explicitly addresses his father's position).
  *   **Provocative Question for Discussion:** "Is Galen Strawson demanding a kind of responsibility that *no one* ever actually claimed to have, or has he exposed the deep, impossible demand hidden within our ordinary practices of praise and blame?"

  By clarifying the *level* at which each Strawson is operating, you can help your cohort see that their "back and forth" might be due to conflating these distinct projects. Both offer profound insights; choosing between them depends on what you think the core question *is*. Good luck on Thursday!
