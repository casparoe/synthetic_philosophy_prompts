prompt: |-
  Random question but its been bugging me for weeks. I started taking propranolol (a beta blocker) for presentation anxiety at work, and it genuinely kills the physical symptoms - no racing heart, no shaking, nothing. But walking in, I still think "this matters, itll be bad if i screw up" - that thought just sits there totally flat now, no feeling attached. So was the anxiety basically just the racing heart, and that's just... gone now? Or is it still happening somehow, just without a body attached to it, because i still believe it matters? Kinda freaks me out not gonna lie, bc if i cant trust the feeling to tell me what actually matters, i don't know what would.
