  Okay, let me start by unpacking the user's question. They're confused about why Harsanyi's theorem isn't considered a definitive argument for utilitarianism. They feel like the axioms are hard to reject, so critics should have to point out which one they disagree with. The user mentions their roommate brought up the issue of weights, but they don't see how that changes things. 

  First, I need to recall the key points of Harsanyi's theorem. It shows that under VNM rationality for individuals and society, plus a Pareto condition, the social welfare function must be a weighted sum of individual utilities. The user is right that the axioms seem uncontroversial at first glance. So why isn't this the end of the debate?

  The user might not be aware of the deeper philosophical objections. For example, the assumption that interpersonal utility comparisons are possible is crucial here. Critics like Rawls argue that comparing utility across individuals isn't feasible. Harsanyi uses von Neumann-Morgenstern utilities, which are cardinal, but still, aggregating them assumes we can weigh them meaningfully. Rawlsians reject this, saying we can't measure utility that way, hence the veil of ignorance approach.

  Then there's the Pareto condition. The user mentions the weak version where society is indifferent only if everyone is indifferent. But the theorem often uses stronger versions, like if everyone prefers A, society does too. Even the weak Pareto might be problematic in some cases. For instance, if adding a person makes everyone else slightly worse off but the new person gains immensely, Pareto indifference might force society to accept it, which could conflict with other values.

  The weights are another point. The user's roommate mentioned them, but the user thinks unequal weights still lead to a form of utilitarianism. True, but unequal weights could allow prioritarianism, where weights are higher for the worse off. However, Harsanyi's linear form might not accommodate that. Prioritarians want a concave transformation, which isn't linear. So the theorem doesn't cover non-linear aggregations.

  Also, the context of risk. Harsanyi's setup is under uncertainty, using expected utility. But Rawls's maximin is designed for situations of deep uncertainty, where probabilities are unknown. The axioms assume known probabilities, which Rawlsians contest in the original position. 

  The user might not realize that Harsanyi's utilitarianism is additive, while other theories use different forms. The theorem doesn't allow for equity considerations directly. For example, reducing inequality might require a social welfare function that isn't additive. 

  I should also consider the user's background. They're in a seminar, so they're likely a grad student in econ or philosophy. Their frustration suggests they expected the theorem to be more conclusive. They need clarity on why critics aren't swayed. 

  The deeper need here is understanding the limitations of formal theorems in normative debates. The user wants to know if critics are ignoring math or if there's valid pushback. They might be seeking reassurance that their confusion is justified and that the debate is more nuanced. 

  I need to explain that the theorem's assumptions embed utilitarian premises, which opponents reject. The math is sound, but the philosophical underpinnings—like cardinal utility and interpersonal comparisons—are contested. Rawlsians offer an alternative framework rather than tweaking weights. 

  Also, the user mentioned "weighted-average flavor of utilitarianism." But weighted sums are still utilitarian. Prioritarians use a different functional form, concave not linear. So the theorem excludes that. 

  In summary, the user's missing that the axioms aren't as neutral as they seem. Critics reject interpersonal comparisons, the applicability of VNM in social choice, or the Pareto principle in certain contexts. The theorem is a powerful result, but it doesn't force opponents to accept utilitarianism because they dispute the foundations.
answer: |-
  You've hit on a profound and persistent source of debate in welfare economics and political philosophy. Your intuition that Harsanyi's theorem *seems* like a powerful argument for utilitarianism is absolutely correct – and your frustration about why it doesn't "end the debate" is shared by many economists. However, critics (Rawlsians, Prioritarians, Egalitarians, etc.) *do* reject specific premises of the theorem, even the seemingly innocuous ones. The disagreement isn't about the math, but about the *interpretation* and *applicability* of the axioms in the context of social justice. Here's a breakdown of why the debate continues:

  1.  **The Crux: Interpersonal Utility Comparisons (The BIG One):**
      *   **The Theorem's Assumption:** Harsanyi's framework *requires* that individual utilities be measured on a **cardinal and interpersonally comparable** scale. VNM utilities are cardinal (measuring intensity of preference under risk), but the theorem goes further: it assumes we can meaningfully say "Person A's utility gain from X is twice Person B's utility loss from Y" and that these differences can be added up.
      *   **The Critics' Rejection:** This is the primary point of attack. Rawlsians, following Robbins, Sen, and others, argue that **interpersonal utility comparisons are fundamentally impossible or meaningless** for ethical purposes. How can we *objectively* compare the intensity of my desire for a good bottle of wine with your desire for a new book, let alone aggregate them?
      *   **Harsanyi's Defense (The Veil of Ignorance):** Harsanyi argued that the VNM setup *does* allow for interpersonal comparisons *if* we adopt an impartial perspective – his "extended preference" approach. If you imagine yourself behind a veil of ignorance, equally likely to be *any* person in society, then maximizing your *expected* utility leads you to maximize the *average* utility. Critics counter that this "as if" approach smuggles in utilitarian aggregation *before* the veil of ignorance does its work, and that the veil should lead to different principles (like maximin) under deep uncertainty.

  2.  **The Nature of "Utility" and Rational Preferences:**
      *   **The Theorem's Assumption:** Preferences satisfy VNM axioms. This implies consistent, rational choice under risk.
      *   **The Critics' Rejection:** Some argue that VNM rationality is too narrow a model for *ethical* preferences. Preferences might be adaptive (e.g., the oppressed learn not to desire freedom), based on envy, or reflect "expensive tastes." Should society weight these preferences equally? Rawls argues that the primary goods index, not utility, should be the basis for social choice precisely because it focuses on objective means to pursue *any* life plan, sidestepping issues of subjective satisfaction or problematic preferences.

  3.  **The Pareto Principle (It's Stronger Than It Looks):**
      *   **The Theorem's Assumption:** Weak Pareto (Unanimous Indifference -> Societal Indifference) and usually a stronger version (Unanimous Strict Preference -> Societal Strict Preference).
      *   **The Critics' Rejection:** While seemingly unassailable, even the weak Pareto principle can have ethically counterintuitive consequences when combined with interpersonal comparisons and aggregation:
          *   **Distributional Insensitivity:** Pareto can force society to prefer a massive increase in one person's utility coupled with a tiny decrease for a vast number of very poor people, as long as *no one* is strictly worse off (which isn't required by weak Pareto, but illustrates the aggregation logic). Critics argue this violates equity concerns.
          *   **Status Quo Bias:** Pareto improvements are hard to find in the real world. Almost any change makes *someone* worse off in their estimation. Requiring strict Pareto improvement effectively blocks many redistributive policies, even those deemed highly just by non-utilitarian standards. The Pareto principle implicitly prioritizes the status quo distribution of welfare/endowments.

  4.  **The "Weighted Sum" vs. True Alternatives (Your Roommate is Partly Right):**
      *   **The Theorem's Result:** `U_society = w1*U1 + w2*U2 + ... + wn*Un`
      *   **Why Unequal Weights Aren't Enough:** You're correct that unequal weights (`w_i`) still yield a *linear* aggregation. This is still fundamentally **Utilitarian (or more precisely, Generalized Utilitarian)**. The key feature is the *additive separability*.
      *   **What Critics Want (Non-Linearity):**
          *   **Rawls (Maximin):** `U_society = min(U1, U2, ..., Un)` - This is *radically* non-linear. It only cares about the worst-off.
          *   **Prioritarianism:** `U_society = Σ f(Ui)` where `f()` is a *strictly concave* function (e.g., square root, log). This weights gains to the worse-off *more heavily* than gains to the better-off, but *non-linearly*. A linear weighted sum (`Σ wi*Ui`) cannot achieve this – it can only give constant extra weight to certain *individuals*, not variable extra weight based on their *level* of utility. Prioritarians care about the *absolute level* of utility when weighting, not just the identity of the person.
          *   **Egalitarianism:** Concerns about the *distribution* of utility itself (e.g., minimizing variance) cannot be captured by a simple weighted sum of individual utilities. `Σ wi*Ui` is indifferent to whether utilities are equal or wildly unequal, as long as the sum is the same. Egalitarians explicitly reject this.

  5.  **The Context of Choice: Risk vs. Fundamental Justice:**
      *   **The Theorem's Domain:** It deals with preferences over *risky prospects* (lotteries).
      *   **The Critics' Argument:** Rawls, in particular, argues that the principles chosen in the "original position" (behind the veil of ignorance) to govern the *basic structure of society* are fundamentally different from choices made under *known probabilities* about specific outcomes. The deep uncertainty of the original position justifies maximin, not expected utility maximization. Applying VNM rationality to the social choice over fundamental institutions is a category mistake.

  **Why the Debate Persists: It's Not (Just) About the Math**

  Harsanyi proved a powerful mathematical theorem: **If** you accept VNM rationality for individuals and society, **and** you accept interpersonal comparability of cardinal VNM utility, **and** you accept the Pareto principle, **then** social welfare *must* be a linear weighted sum of individual utilities.

  The debate persists because critics **forcefully reject the "if"**:

  1.  **Rawlsians:** Reject interpersonal comparability and the application of VNM rationality to fundamental social choice. Propose the veil of ignorance leading to maximin as an alternative framework.
  2.  **Prioritarians:** Reject the *linearity* of the aggregation. They insist that the aggregation function must be strictly concave to prioritize the worse-off based on their absolute utility level.
  3.  **Egalitarians:** Reject that social welfare is *solely* a function of the sum (or weighted sum) of individual utilities; they argue the *distribution* matters intrinsically.
  4.  **Others:** Question whether "social preferences" should even be modeled as VNM-rational in the same way individual preferences are, or whether the Pareto principle adequately captures societal obligations.

  **In essence:** Harsanyi brilliantly showed that utilitarianism (or generalized utilitarianism) is the *only* option *if* you buy into a specific, highly structured framework for representing preferences and making social choices under risk with interpersonal comparisons. Critics argue that this framework itself embodies core utilitarian assumptions (especially about interpersonal comparison) that they find ethically unacceptable or descriptively inaccurate for the problem of justice. They aren't ignoring the math; they are arguing that the mathematical setup doesn't capture the ethical problem they are trying to solve. Your confusion turning into skepticism is a healthy reaction – it means you're grappling with the deep philosophical disagreements underlying the formal result. The seminar likely presented the theorem's power; the ongoing debate reveals its contested foundations.
