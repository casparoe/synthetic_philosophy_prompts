prompt: |-
  My university philosophy club still has me on their alumni list somehow and roped me into moderating a Q&A next month with a Leibniz specialist -- shes built her whole career defending "best of all possible worlds" as a serious moral position, not just the punchline from Candide. Im a backend dev with zero formal philosophy training so I don't want to lob her softballs she's answered a thousand times. Can you write me 7-8 interview questions that make her actually defend the mechanics of the view, not just restate it? I want at least one on how "best" even gets calculated once you factor in compossibility (not everything good can coexist, so is that a real metric or just a label slapped on whatever happened to exist), one on how the privation theory of evil lets God "permit" sins that were still baked into the one optimal world he chose, one on the "motives incline without necessitating" plus infinite-analysis account of freedom (vs it secretly just being determinism with extra steps), and one on whether pre-established harmony -- monads never actually causally touching, just synced up like two clocks -- leaves any real room for being responsible for what your body does. Give each question a quick follow-up keyed to whatever dodge she'll probably reach for first.
