prompt: |-
  My team just rolled out a system where any flagged post gets reviewed by 25 randomly picked employees who each vote misleading or fine, majority rules. A coworker keeps insisting that with that many people voting, the crowd is basically guaranteed to land on the right answer, so we should just shut down our actual fact-checking team and let this run on autopilot. Thing is, most people just skim the top comment before voting instead of checking anything themselves, and on the really technical posts I doubt the average voter has better then a coin flip's shot at knowing what's true. Something about his confidence feels off to me but I can't quite explain why - is he right that more random voters basically guarantees the crowd gets it right?
reasoning: |-
  Okay, the user is dealing with a situation at work where their team has implemented a system for reviewing flagged posts. The system uses 25 randomly selected employees who vote on whether a post is misleading or fine, with the majority deciding the outcome. Their coworker believes that with so many voters, the crowd will almost always be correct, suggesting that the fact-checking team is unnecessary. However, the user is skeptical because voters often just skim the top comment instead of doing their own research, and on technical posts, they might only have a 50% chance of being correct.

  First, I need to address the coworker's argument. The coworker is relying on the Condorcet Jury Theorem, which does state that as the number of voters increases, the majority vote is more likely to be correct—but only if each voter is more than 50% likely to be correct. If each voter has a high probability of being right, say 60%, then adding more voters does improve accuracy. But the key here is that the theorem assumes voters are independent and each has better than random accuracy.

  The user's concern is that in reality, voters aren't independent. They're influenced by the top comment, which breaks the independence assumption. If the top comment is wrong, many voters might just follow that, leading to a herd mentality. So even with 25 voters, if they're all swayed by the same incorrect comment, the majority could be wrong. That's a big flaw in the coworker's reasoning.

  Also, on technical posts, the user suspects that the average voter might only have a 50/50 chance. If that's the case, the theorem doesn't apply because each voter isn't better than random. At 50%, adding more voters doesn't improve accuracy; it stays at 50%. So for those posts, the system isn't any better than flipping a coin, regardless of how many people vote.

  The user might also be worried about the implications of shutting down the fact-checking team. Without experts, the system could make consistent errors on complex issues. The coworker's confidence might stem from misunderstanding the theorem's assumptions, not considering real-world biases. The user needs to explain that the theorem's effectiveness hinges on voter competence and independence, which aren't present here.

  Another angle is the cost of errors. Even if the crowd is usually right, for critical decisions, a 10% error rate might be too high. Fact-checkers provide nuanced analysis, especially for borderline cases where crowd voting could go either way. The user might need to highlight that the crowd system lacks depth and could miss context that experts catch.

  The user's deeper need is likely to preserve the fact-checking team's role by proving that the crowd system isn't infallible. They need concrete arguments to counter the coworker's overconfidence. Emphasizing the lack of independence and the coin-flip scenario on technical issues should be key points. Also, mentioning real-world examples where herd behavior led to mistakes could strengthen their case.
answer: |-
  You're absolutely right to be skeptical - your coworker is misunderstanding the **Condorcet Jury Theorem** and overlooking critical real-world flaws in your system. Here's why his "guaranteed accuracy" claim is flawed:

  1.  **The Core Assumption is Wrong: Voter Competence >50%:** The Condorcet Jury Theorem *does* state that if each voter has an independent probability **greater than 50%** of being correct, then the probability the majority vote is correct increases towards 100% as the number of voters grows. **However, if voter competence is only 50% (a coin flip), the majority is also only correct 50% of the time, regardless of group size.** If competence is *below* 50%, the majority is actually *more likely to be wrong* as the group grows. Your suspicion about technical posts being coin flips for the average voter directly breaks the theorem's foundational requirement.

  2.  **Independence is CRITICAL (and Likely Absent):** The theorem assumes voters decide **independently**. Your observation destroys this:
      *   **"Most people just skim the top comment before voting":** This creates **herding behavior** and **cascades**. If the top comment is wrong, many voters will follow it *regardless of their own judgment*. With 25 voters, if the first few (or a persuasive top comment) are wrong, the majority can easily be wrong, even if individuals *might* have been slightly competent alone. This dependence makes the group *less* reliable, not more.

  3.  **The "50%+" Threshold is the Key:**
      *   **If avg. voter accuracy = 55%:** The probability the majority of 25 is correct is ~69%. Better than 55%, but far from guaranteed.
      *   **If avg. voter accuracy = 60%:** Majority correct ~85% of the time. Good, but still 1 in 7 errors.
      *   **If avg. voter accuracy = 50% (Coin Flip):** Majority correct = 50%. **No improvement.**
      *   **If avg. voter accuracy = 45% (Worse than random):** Majority correct drops to ~30%. Adding voters makes it *worse*.
      *   *(Calculations based on Binomial Probability)*

  4.  **Technical Posts are the Achilles' Heel:** As you suspect, on complex topics, average voter accuracy likely plummets towards 50% or below. The crowd has no magical ability to understand things they lack expertise in. A majority of uninformed guesses is still just a guess.

  5.  **Systemic Biases:** Crowds amplify *common* biases. If there's a prevalent misconception related to the post's topic, the crowd is likely to reinforce it, not correct it. Fact-checkers are trained to identify and counter such biases.

  6.  **The Cost of Errors:** Even if the crowd is "mostly" right (say 80-90%), the errors it *does* make could be catastrophic for your platform (e.g., leaving up dangerously misleading health info, taking down valid criticism). Fact-checkers provide nuanced judgment and handle borderline cases better.

  **Why Your Coworker is Overconfident:**

  He's focusing *only* on the "wisdom of crowds" effect under idealized conditions (independent, slightly competent voters) and ignoring:
  *   The **herding effect** you directly observe (top comment skimming).
  *   The **likely low competence** on complex topics.
  *   The **critical 50% threshold**.
  *   The **real-world consequences** of errors.

  **What You Should Argue:**

  1.  **"Garbage In, Garbage Out":** The crowd's output depends entirely on the *quality* and *independence* of the inputs. Our current inputs (uninformed voters influenced by top comments) are low-quality and dependent.
  2.  **Herd Behavior Breaks the Math:** Cite your direct observation: "Voters aren't independent; they follow the top comment. This invalidates the core math guaranteeing crowd accuracy. We're amplifying the first opinion, not aggregating diverse knowledge."
  3.  **Coin Flips on Complex Issues:** "For highly technical posts, expecting the average employee to be better than 50% accurate is unrealistic. At 50%, the crowd is literally no better than a coin flip, no matter how large. We *need* subject matter experts for these."
  4.  **Fact-Checking Adds Critical Value:** "Our fact-checkers provide depth, research, context, and handle nuance that crowd voting cannot. They counteract systemic biases and misinformation tactics designed to fool casual observers. They are our safeguard against the crowd amplifying *common* mistakes."
  5.  **Use the Crowd Wisely:** "The crowd vote might be a useful *signal* or *triage* tool for *some* types of posts (e.g., obvious spam, clear community guideline violations), but it cannot replace expert judgment for nuanced or technical truth assessment."

  **Conclusion:** Your coworker's confidence stems from misunderstanding the strict assumptions required for large crowds to be highly accurate. Given the observed herding behavior and the likelihood of low voter competence on technical issues, **relying solely on this crowd vote is statistically unsound and operationally risky.** Shutting down the fact-checking team would be a major mistake. The crowd system might be a useful supplement or triage tool, but it is *not* a replacement for expert analysis, especially on complex or controversial topics. Keep pushing back!
