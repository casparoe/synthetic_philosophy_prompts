  Ok so this has been living in my head for like two weeks now, and I only just found out it's an actual philosophy thing. Here's how I originally pictured it: a universe that contains nothing at all except two solid iron balls, completely identical in every way (same size, same weight, same temperature, same everything down to the last atom), sitting some fixed distance apart in an otherwise empty, perfectly symmetric space. No third object, nobody watching, nothing anywhere to break the symmetry between them. Every single property one ball has, the other has too. So is that genuinely two balls, or is calling it "two" kind of a cheat, like we're just describing the same describable thing twice?

  Turns out there's a real debate about this (something about a philosopher named Black and "indiscernibles"), but every summary I find either just says "yep, this disproves the idea that no two different things can be exactly alike" or says "no wait, the relations between them still count as different properties so its fine," and neither one really explains why the other side is wrong. Can you write me an essay actually working through the strongest arguments on both sides - including whether facts about how the balls relate to each other (like being some fixed distance apart) are enough to make them discernible after all, and whether a setup like this is even coherent to begin with - and then commit to an answer instead of leaving it at "reasonable people disagree"? A qualified verdict is fine, but i want an actual verdict.
