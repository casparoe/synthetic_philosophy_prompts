prompt: |-
  Ok so I'm the junior rep on my school's Honor Council (it's the student-faculty board that hears cheating cases and sends a recommendation to the Dean of Students, who like 95% of the time just goes with whatever we say), and we've got a case this Tuesday that's splitting the whole council and I need to bring in a written opinion. Here's the situation: five kids in my AP Chem class share a group chat, and the last three problems on last week's take-home set were supposed to be done completely independantly - the teacher was really explicit about this, it's graded like a quiz. Before anyone even started, the group agreed in the chat that if someone got stuck on the independent part they'd post their answer so everyone else could "check against it." In the end 2 of the 5 actually posted their answers and the other 3 copied off them. The remaining 3 swear that by the time the answers got posted they'd already finished on their own, so they never opened or used the shared answers - even though they'd fully agreed to the plan and were ready to use it the second they needed to.

  Half the council wants to only charge the 2 who actually copied, since technically the other 3 didn't turn in anything besides their own work, and our honor code only defines cheating as "giving or receiving unauthorized help" - it doesn't say anything about just agreeing to a plan you don't end up carrying out. The other half (kind of including me, which is awkward bc one of the "innocent" 3 is my friend) thinks that's letting people off the hook for basically getting lucky, since all 5 set the whole thing up together and had the exact same intentions going in - the 3 just happened not to need the answers once it came down to it. But I get the other side too, it does feel kind of messed up to punish someone the same as an actual copier when all they turned in was their own work. Can you write the actual memo I'd bring to Tuesday's meeting? It needs to say clearly what happens to each of the 5 - what they're charged with, if anything, and what the sanction is - keeping in mind the semester ends in two weeks so this has to move fast, and it actually has to deal with the "they never even used it" argument instead of just brushing past it, since that's the thing people keep bringing up.
reasoning: |-
  Okay, the user is a junior member of their school's Honor Council facing a tough case involving five students in an AP Chem class. They need to draft a formal memo recommending charges and sanctions before Tuesday's meeting. The core dilemma is whether all five students should be held accountable for agreeing to share answers, even though only two actually copied and three claim they didn't use the shared answers.

  First, I need to unpack the key facts: The teacher clearly designated three problems as independent work. All five students premeditated cheating by agreeing in a group chat to share answers if anyone got stuck. Two students posted answers, and the other three copied from them. However, the three who copied insist they'd already finished independently before seeing the answers. 

  The Honor Council is split. Half argues only the two who shared answers and the three who copied should be charged since the honor code specifically prohibits "giving or receiving unauthorized help." The other half, including the user, believes all five are equally culpable because they planned the scheme together, even if three didn't execute it. 

  The user's personal stake is tricky—one of the "innocent" three is their friend, adding emotional complexity. They need the memo to address the "they never used it" argument head-on, as it's a major sticking point. With the semester ending soon, decisions must be practical and timely.

  I should analyze the honor code closely. While it explicitly bans "giving or receiving" help, it likely implies broader principles like academic integrity. Premeditation matters because agreeing to cheat undermines the assignment's purpose. The three who didn't copy still participated in creating an unfair advantage pool, which violates the spirit of independent work. 

  For the memo structure, I'll recommend charging all five with Conspiracy to Violate Academic Integrity. The two who shared answers get additional charges for Facilitating Cheating, while the three who copied get Cheating violations. Sanctions should be tiered: heavier penalties for active participants (F on assignment + probation), lighter for conspirators (F on assignment but no probation). This balances intent with action. 

  Crucially, the memo must explain why conspiracy is chargeable even without execution. Analogies like attempted robbery could help—planning a crime is punishable. I'll emphasize that the scheme's existence pressured all members to potentially cheat, compromising the assignment's integrity. 

  For practicality, sanctions avoid affecting final grades disproportionately since the semester ends soon. Probation serves as a deterrent. The memo should conclude by stressing that premeditation erodes trust, which is foundational to the honor system.
answer: |-
  ## Honor Council Recommendation Memo  
  **Case:** AP Chemistry Take-Home Quiz Collaboration Violation  
  **Date:** [Date of Meeting]  
  **Submitted By:** [Your Name], Junior Representative  

  **I. Case Summary**  
  Five students in AP Chemistry established a group chat agreement to share answers for the final three problems of a take-home quiz explicitly designated for **independent work**. Two students (`Student A`, `Student B`) posted their answers to the chat. Three students (`Student C`, `Student D`, `Student E`) accessed these answers. All five admit to the pre-arranged plan to share answers if "stuck." `C, D, and E` claim they had completed the problems independently *before* accessing the answers and did not use them.  

  **II. Honor Code Violations & Charges**  
  The Council charges **all five students** with violations. The Honor Code prohibits "giving or receiving unauthorized help." However, this clause must be interpreted in light of the **fundamental purpose** of the Code: upholding academic integrity through individual effort and preventing unfair advantage.  

  1.  **Students A & B (Answer Posters):**  
      *   **Charge:** **Facilitating Cheating (Honor Code Violation - Giving Unauthorized Help)**  
      *   **Rationale:** They knowingly provided their answers to others in violation of explicit instructions, enabling cheating. Their actions directly created the unauthorized resource.  

  2.  **Students C, D, & E (Answer Accessors):**  
      *   **Charge:** **Conspiracy to Cheat & Creating an Unfair Advantage (Honor Code Violation - Receiving/Giving Unauthorized Help - *Based on Premeditation & Agreement*)**  
      *   **Rationale:**  
          *   **Premeditation:** They actively participated in an agreement *before starting the work* to circumvent the "independent work" requirement. This agreement constituted an *offer to give and receive unauthorized help*.  
          *   **Creation of an Unfair Advantage Pool:** By agreeing to pool answers, they created an unfair resource *available on demand*, fundamentally altering the conditions of the assessment from the moment they agreed. This violated the "independent work" mandate regardless of whether they ultimately pressed "download."  
          *   **Undermining Trust:** The agreement itself corrupted the integrity of the assignment. Other students worked truly independently without such a safety net.  
          *   **"Didn't Use It" Argument Addressed:** While turning in original work mitigates the *execution* of cheating, it does not absolve the *conspiracy* to cheat. The violation occurred when they agreed to create and use an illicit resource *if needed*. Their claim of non-use is unverifiable and irrelevant to the initial agreement that compromised the assignment's fairness. Punishing only execution ignores the corrosive effect of premeditated collusion.  

  **III. Recommended Sanctions**  
  *(Considering semester end, focus on assignment impact and clear message)*  

  1.  **Students A & B (Answer Posters):**  
      *   **Grade:** **F (Zero) on the Take-Home Quiz.**  
      *   **Additional:** **Academic Probation for the following semester.**  
      *   **Rationale:** Directly facilitated cheating. Probation reflects the seriousness of creating the illicit resource.  

  2.  **Students C, D, & E (Answer Accessors/Conspirators):**  
      *   **Grade:** **F (Zero) on the Take-Home Quiz.**  
      *   **Additional:** **Mandatory Academic Integrity Workshop** (to be completed before next semester if possible, or during next semester).  
      *   **Rationale:** Their premeditated agreement to cheat violated the core requirement of independent work and created an unfair advantage pool. The F addresses the compromised integrity of their submission. The workshop addresses the misunderstanding of "intent vs. action" in academic integrity. Probation is not recommended as their *execution* of cheating (if it occurred) is unproven, but their conspiracy is admitted.  

  **IV. Council Reasoning Summary**  
  *   **Unanimous on A & B:** Clear violation of "Giving Unauthorized Help."  
  *   **Majority on C, D, & E (Charged):** The pre-assignment agreement to share answers constituted an *offer to both give and receive unauthorized help*, violating the Honor Code's spirit and the specific "independent work" instruction. Punishing only execution incentivizes students to set up cheating schemes and gamble on not needing them. Academic integrity requires upholding rules *before* and during work, not just upon submission.  
  *   **Minority View (Not Charging C, D, & E - Noted for Record):** Argues the Honor Code language ("giving or receiving") requires proof of actual exchange/use. Believes charging based solely on agreement stretches the Code. Prefers no sanction beyond potential faculty disciplinary note.  

  **V. Recommendation**  
  The Honor Council **RECOMMENDS** the Dean of Students uphold the charges and sanctions as outlined above for all five students. This decision emphasizes that **premeditated collusion to circumvent rules for individual assessments constitutes an Honor Code violation in itself**, regardless of whether the illicitly obtained resource was ultimately utilized on the final submission. Failure to sanction the conspirators undermines the principle of independent work and incentivizes exploitative behavior.  

  **Signed,**  
  [Your Name]  
  Junior Representative, Honor Council  

  ---

  **Key Strengths of this Memo:**

  1.  **Addresses the Core Argument:** Directly confronts the "didn't use it" claim by framing the violation as the **premeditated agreement and creation of an unfair advantage pool**, not just the final copying act.
  2.  **Clear Charges & Sanctions:** Explicitly states what each group is charged with and what the recommended sanctions are.
  3.  **Tiered Sanctions:** Recognizes the difference in culpability between *providing* the answers and *conspiring to use them* while still holding all accountable. Probation for providers vs. workshop for conspirators reflects this.
  4.  **Honor Code Interpretation:** Justifies charging the conspirators by linking their agreement to the *offer* to give/receive unauthorized help and the creation of an unfair advantage, arguing this falls under the Code's intent.
  5.  **Practicality:** Avoids complex sanctions that would be impossible before semester end (e.g., long suspensions). Focuses on the assignment grade and manageable educational steps (probation, workshop).
  6.  **Transparency:** Acknowledges the minority view within the Council.
  7.  **Professional Structure:** Uses clear headings and formal language appropriate for an official recommendation.

  This memo provides a strong, principled, and practical framework for the Council and Dean to consider, directly tackling the central disagreement. Good luck with the meeting!
