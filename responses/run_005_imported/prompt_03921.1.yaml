  Been meaning to ask someone this for a while. I got really into Yudkowsky's modest epistemology stuff in Inadequate Equilibria years ago (the argument that you should mostly defer to expert/market consensus instead of trusting your own reasoning), and only recently clocked that its basically the same territory as the academic literature on higher-order evidence and epistemic akrasia -- not the LW akrasia-as-in-i-can't-make-myself-do-my-taxes sense, the actual philosophy one, where you end up believing P while simultaneously believing your own evidence doesn't support P. Problem is every example in that lit is a reskin of the same few setups: the hypoxic pilot, the reasoning-impairing drug, and peer disagreement. Can you invent a genuinely new case (ordinary life, nothing involving planes, drugs/alcohol/sleep-deprivation, or two people flat-out disagreeing) where someone seems rationally forced into that akratic state? Then say, for your specific case, whether "level-splitting" (just live with the akrasia) or "steadfast" (ignore the higher-order evidence entirely) strikes you as the less crazy resolution, and why. Actually spell the scenario out in detail, don't just gesture at it.
