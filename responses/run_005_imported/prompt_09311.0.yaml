  First, I need to recall how these genetic risk scores work. They're population-based, comparing the user's markers to a reference group. That group includes people with all sorts of lifestyles—sedentary, unhealthy diets, active, healthy eaters. So the 40% is an average that doesn't account for individual behaviors.

