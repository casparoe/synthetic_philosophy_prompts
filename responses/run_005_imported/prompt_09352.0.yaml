prompt: |-
  So I'm about a third of the way into a novel set on a fictional island nation that just wrote itself a new constitution after a nasty civil war, and one of the things the founders did was jam in a bunch of "eternity clauses" -- provisions, mostly protections for the ousted ethnic minority, that can't be amended or repealed, not even by a unanimous vote of everyone currently alive. My protagonist is a constitutional lawyer who helped draft the thing but is getting cold feet, and shes constantly sparring with an older colleague who justifies the whole setup with the Ulysses-at-the-mast story -- tying yourself up in advance so you can't give in to the Sirens later. My protagonist's counter is that its a lousy analogy: Ulysses was constraining his own future self, a guy who'd be around afterward to be glad he did it, whereas an eternity clause constrains people who aren't born yet, never agreed to anything, and might reasonably resent being ruled by decisions their great-grandparents made in a totally different emergency. She calls it the dead governing the living with better PR.

  I want their argument to actually be good on both sides, not a strawman I just hand to whichever character I like more, so could you write me an essay that seriously works through whether the Ulysses-contract analogy holds up as a justification for constitutional precommitment (entrenched clauses, supermajority thresholds, that sort of thing), or whether it's disanalogous in some deep way once you're binding future generations instead of your own future self? I want it in the actual weeds -- the self-paternalism/akrasia case for precommitment, the sovereignty-and-consent objection, that whole Jefferson-vs-Madison argument about whether one generation can rightfully bind the next if its relevant, and the deeper puzzle of whether a "sovereign" body can even coherently bind itself at all, given that it could in principle always change its own rules later. (I vaguely remember there's a Jon Elster book that pokes holes in the Ulysses metaphor for exactly this kind of case, but its been years since I read it and I don't trust my memory of the details, so don't take my word for anything there.) Don't just leave it at "there are good points on both sides" though -- actually pick a side, or a qualified version of one, and defend it, because that's what I actually need for the scene.
