  First, I need to recall Jaynes' argument. He used transformation groups to handle symmetries—rotations, translations, scaling—mandating that the probability should be invariant under these. That led to the 1/2 answer for the chord problem. The user sees this as a solid solution, making the principle of indifference work via symmetry. But why do philosophers still criticize indifference?

  The key points from critics: van Fraassen's cube factory shows that indifference over different descriptions leads to contradictions. Wine/water paradox is another example where labeling matters. Reference class problems highlight that the choice of partition affects the probability. These issues aren't resolved by group invariance alone. Jaynes' method works for Bertrand because the symmetries are clear, but not all problems have such symmetries.

