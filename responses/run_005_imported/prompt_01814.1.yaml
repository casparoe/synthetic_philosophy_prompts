answer: |-
  You're right to feel that your friend's conclusion misses something important - they're applying a simplistic economic model that ignores the **social context** of decisions. Your behavior wasn't irrational; it was contextually appropriate. Here's why:

  1.  **The Choices Weren't Actually "The Same":**
      *   **First Scenario (Family Present):** Your choice wasn't just about pizza slices. It was about:
          *   **Social Perception:** Avoiding appearing greedy or selfish.
          *   **Signaling Values:** Demonstrating politeness, consideration, or generosity.
          *   **Social Costs:** Potential judgment or negative feelings from others if you took the larger slice.
          *   **The choice set:** "Smaller slice" vs. "Larger slice + potential social disapproval."
      *   **Second Scenario (Alone):** The choice was purely about personal consumption:
          *   **Social Perception:** Irrelevant (no one to perceive you).
          *   **Signaling Values:** Unnecessary (no audience).
          *   **Social Costs:** Zero.
          *   **The choice set:** "Smaller slice" vs. "Larger slice" – pure preference based on hunger and enjoyment.

  2.  **Rationality Includes Social Preferences:** Standard economic models often focus narrowly on material consumption. Humans, however, are deeply social. Preferences routinely include:
      *   **Social Preferences:** Caring about fairness, reciprocity, reputation, and how others perceive us.
      *   **Context-Dependent Preferences:** Valuing things differently based on the situation (e.g., valuing politeness highly in a social setting, valuing pure satisfaction highly when alone).
      *   **Your preferences likely included:** "I prefer not to *appear* greedy in front of others" AND "I prefer to eat the slice I will enjoy more when alone." These are consistent and rational preferences that were activated by different contexts.

  3.  **Revealed Preference Fallacy:** Your friend is misapplying the concept of "revealed preference." This principle states that we infer preferences from choices *within a given context*. It doesn't assume preferences are immutable across *radically different contexts*. Your choices revealed:
      *   **Context 1:** You prefer avoiding social disapproval over having the larger slice.
      *   **Context 2:** You prefer the larger slice over the smaller one when social factors are absent.
      These are not inconsistent; they are preferences revealed in different situations.

  4.  **Rationality Means Responding to Incentives:** Rational behavior involves responding to the actual incentives and constraints present. In the first scenario, strong social incentives existed. In the second, they vanished. Changing your behavior in response to this change in incentives is the *essence* of rational adaptation.

  **Why Your Friend's View is Too Narrow:**

  1.  **Ignores Social Utility:** It fails to account for the "utility" (satisfaction) derived from social approval, avoiding disapproval, or adhering to personal/social norms. This utility was significant in the first scenario and absent in the second.
  2.  **Assumes Static Preferences:** It assumes preferences are fixed like physical constants, ignoring that human preferences are often complex, multifaceted, and context-dependent.
  3.  **Overly Simplistic Model:** Basic economic models are powerful tools for understanding markets but are often inadequate for capturing the richness of individual social decision-making. Behavioral economics explicitly studies how context, social norms, and psychological factors influence choices that deviate from the "rational actor" model.

  **Conclusion:**

  You were not irrational. You were acting rationally within two distinct choice environments. In the social context, the "cost" of taking the larger slice included potential social disapproval, which outweighed the benefit of the extra pizza. Alone, that cost vanished, so the benefit of the larger slice prevailed. Your preferences *for social standing* and *for pizza enjoyment* are both rational; you simply applied the relevant one based on the situation.

  **What to tell your friend:** "My preferences weren't inconsistent. My preference *not to appear greedy in front of family* was stronger than my preference for the larger slice *in that social setting*. When I was alone, the social preference became irrelevant, so my pure pizza enjoyment preference took over. Rational people respond to the actual costs and benefits present in each situation, and the social costs were a huge factor at the gathering that disappeared the next morning. Basic models that ignore social context can't explain this – it's why behavioral economics exists!"
