  First, I need to ensure I understand the user's core concern. They feel there's a sleight of hand in the inference from vague composition to vague existence. They want a strong argument against that inference, not just a reference to opposing views. They’re looking for a logical breakdown of why the transition from "composition is vague" to "existence is vague" might be flawed.

  The user’s confusion is common among newcomers to mereology. The Lewis argument is powerful because it uses a sorites paradox to challenge intermediate positions. The key points are the arbitrariness of cutoffs and the supposed incoherence of vague existence. To address this, I need to tackle both the epistemic and metaphysical aspects of vagueness.

  I recall that some philosophers, like van Inwagen himself, propose restricted composition. But defending that requires handling the vagueness issue. The user mentioned the "sleight of hand," so I should focus on why vague composition doesn’t necessitate vague existence. 

  The strongest counter-argument involves distinguishing between the vagueness of concepts and ontological vagueness. If composition is a relation defined by our concepts, then its vagueness is semantic or epistemic, not metaphysical. For example, "baldness" is vague because our definition isn't precise, but the hairs on a head exist determinately. Similarly, whether parts compose a whole might depend on our concept of an object, not on existence itself.

  Another angle is the supervaluationist approach. Even if there's no definite answer to whether composition occurs in borderline cases, each candidate precisification of "object" has a definite number of entities. So, existence isn't vague; rather, our language lacks a sharp boundary. This avoids vague existence by grounding it in multiple precise realities.

  The user might also benefit from understanding that rejecting the Lewis argument doesn't require accepting vague objects. By separating the criteria for composition from existence itself, we can maintain that objects exist determinately, even if it's indeterminate whether certain parts compose one.

  I should also address the arbitrariness worry. If composition is restricted, isn't any cutoff arbitrary? The response here is that many boundaries in nature are sharp despite appearing continuous. For instance, phase changes like water freezing have precise points under certain conditions. So, a defender of restricted composition could argue that composition might similarly have non-arbitrary thresholds, even if we can't pinpoint them.

  Finally, I need to structure this logically. Present the Lewis argument clearly, then dismantle the inference step by step. Emphasize the distinction between metaphysical and semantic vagueness. Use concrete examples like the Lego bricks to illustrate how vagueness in composition doesn’t imply vague existence. Conclude by assessing whether this successfully counters the argument or if universalism/nihilism remains unavoidable.
answer: |-
  You've hit on one of the most profound and persistent arguments in contemporary metaphysics. The Lewis-style argument against restricted composition (the view that composition happens sometimes, under specific conditions) *feels* persuasive because it leverages genuine puzzles about vagueness and existence. However, there are strong, well-developed counter-arguments that directly challenge the inference from "vague composition" to "vague existence." Here's the strongest case I can construct against that inference, drawing primarily on the work of philosophers like Peter van Inwagen, Theodore Sider, and proponents of semantic approaches to vagueness:

  **The Core Argument Against the Inference:**

  1.  **Distinguish Vagueness in *Concepts* from Vagueness in *Reality*:** The fundamental move is to insist that vagueness is a feature of our *language, concepts, and representations*, not a feature of *reality itself*. We have vague *predicates* like "bald," "heap," or "composes an object." Whether a particular collection of atoms satisfies the predicate "composes an object" can be vague or indeterminate. This does *not* mean that the *existence* of the atoms, or the *existence* of whatever objects there *determinately* are (like the individual atoms or fundamental particles), is vague. Reality is precise; our ability to perfectly *describe* or *categorize* all aspects of it with our concepts is limited.

  2.  **Composition is a Relation Defined by Concepts:** "Composition" isn't a brute, fundamental feature of the universe like fundamental physical forces. It's a relation we define and apply based on our conceptual scheme. We have criteria for what counts as "a single object" – criteria involving unity, causal integration, spatial continuity, functional unity, etc. These criteria themselves often involve vague predicates ("unified," "integrated," "cohesive"). Therefore, whether composition occurs is a question of whether a collection satisfies *our concept* of "object-hood," which has vague boundaries. It's not a question of some mysterious metaphysical switch being flipped in reality.

  3.  **The Sorites Series Shows Conceptual Vagueness, Not Ontological Vagueness:** The Lego brick scenario (from loose, to touching, to glued) is a classic Sorites paradox for the concept "composes an object." Just like adding grains one-by-one creates borderline cases for "heap," adding glue molecules one-by-one creates borderline cases for "do these two bricks compose a single object?" The existence of borderline cases shows that *our concept* "composes an object" is vague. It does *not* show that the *number of fundamental entities* (e.g., particles) in the world fluctuates indeterminately during the process. The fundamental particles/atoms exist determinately throughout. What's indeterminate is whether we apply the *label* "composite object" to that particular arrangement.

  4.  **Rejecting Vague Existence ≠ Accepting Arbitrary Cutoffs:** The restricted compositionist *can* avoid positing an arbitrary, precise cutoff *in reality* by embracing the vagueness of their *concept* of composition. They say: "There is no fact of the matter, no precise point in the glue-adding process, where composition *objectively* starts. It's genuinely indeterminate whether the bricks compose an object in the borderline region. This indeterminacy reflects the fuzziness of our concept, not a fuzziness in existence itself." The fundamental particles exist determinately; the question of whether they constitute *one additional thing* (a composite object) is conceptually vague.

  5.  **Supervaluationism as a Formal Tool:** This semantic theory provides a powerful model. Imagine multiple equally good, precise ways ("precisifications") of sharpening our vague concept "composes an object." On one precisification, composition requires 100% glue coverage. On another, it requires 90%. On another, 80%, etc. In the clear glued case, *all* precisifications agree: composition occurs. In the clear loose case, *all* agree: it does not. In the borderline region, *some* precisifications say "yes" (composition occurs, so there is a composite object), and *some* say "no" (no composition, only particles arranged brick-wise).
      *   **Key Point:** On *each* precisification, the *number of objects* is precise. On the 100% precisification, the composite object pops into existence exactly when the last glue molecule is added. On the 80% precisification, it pops in earlier. There is no single, vague reality. Instead, there are multiple precise candidate descriptions of reality, and our vague concept corresponds to the fact that these candidates disagree in the borderline zone. **Existence is never vague on any candidate description.** The "vagueness in the number of objects" is an artifact of considering *which* precise candidate description is the uniquely correct one – and there *is* no uniquely correct one. The *world* is precise; our *description* is indeterminate between various precise options.

  **Addressing Lewis's Core Worry Directly:**

  *   **Lewis:** "Vagueness in composition would entail vagueness in how many objects exist, which would be vagueness in existence itself. Existence can't be vague."
  *   **Response:** "Vagueness in composition *is* vagueness in how many *composite* objects exist *according to our conceptual scheme*. But the existence of the *fundamental* parts is never vague. Furthermore, the 'vagueness in number' isn't a feature of reality being fuzzy; it's a feature of it being indeterminate *which precise description* (each assigning a definite number) correctly captures reality relative to our vague concept. Reality itself, at the fundamental level, is perfectly precise. The 'vagueness' resides entirely in the relation between our conceptual scheme and that precise reality."

  **The Strongest Case for the Restricted Compositionist:**

  1.  **Intuition:** Common sense strongly suggests composition is restricted. We readily accept glued bricks as a single object ("this wall"), a pile of loose bricks as many objects ("those bricks"), and find the idea of a shoe-Moon object absurd. Universalism and nihilism both radically violate these intuitions.
  2.  **Explanatory Power:** Restricted composition provides the best explanation for why we interact with medium-sized dry goods as unified wholes (tables, chairs, organisms) rather than just interacting with their particles. There *is* something ontologically significant about the way their parts are bonded and function together.
  3.  **Avoiding Absurdity:** Universalism posits an explosion of arbitrary, gerrymandered objects (shoe+Moon, the first three blades of grass in my yard + Alpha Centauri) that play no causal role, violate parsimony, and defy any coherent principle of unity. Nihilism denies the existence of objects we constantly perceive and interact with. Restricted composition avoids these extremes.
  4.  **Vagueness Handled Semantically:** As argued above, the vagueness challenge can be met by locating the vagueness in our concepts and language, not in existence itself, using tools like supervaluationism.

  **Conclusion: Does the Inference Fail?**

  Yes, a very strong case can be made that the inference **fails**. The argument that vague composition *necessarily* entails vague existence commits a sleight of hand by conflating:

  1.  **Vagueness in the application of a concept** (does this arrangement satisfy "composes an object"?)
  2.  **Vagueness in fundamental existence** (do the basic constituents of reality exist?).

  The restricted compositionist can coherently maintain that:

  *   Reality at the fundamental level is precise (e.g., particles/fields exist determinately).
  *   Our concept of "composite object" is vague, having borderline cases.
  *   Therefore, in borderline cases, it is **indeterminate whether a composite object exists** (because it's indeterminate whether the concept applies), but this indeterminacy is *semantic* or *conceptual*, **not metaphysical**. It does not mean existence itself is vague or that the number of fundamental entities is fuzzy. It means we cannot perfectly map our vague concept onto the precise reality in every instance.

  **However, a crucial caveat:** This defense requires accepting that *indeterminacy in existence claims* (e.g., "A composite object exists here") is possible *without* indeterminacy in *fundamental* existence. Some philosophers (like Lewis himself, and arguably Sider in his later work) find *any* kind of existential indeterminacy metaphysically repugnant or incoherent. They insist that if it's indeterminate whether X exists, then *reality itself* must be indeterminate regarding X. This is a deep metaphysical divide. The semantic defense outlined above is powerful and widely accepted, but it doesn't *force* universalists or nihilists to abandon their views; it just shows their argument against restricted composition isn't logically inescapable. The debate continues precisely because both sides have strong points and deep intuitions pulling in different directions.

  You were right to sense a potential sleight of hand. The strongest rebuttal lies in meticulously separating the precision of fundamental reality from the inherent vagueness of our higher-level concepts like "object."
