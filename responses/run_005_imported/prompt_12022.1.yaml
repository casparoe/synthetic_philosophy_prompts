answer: |-
  Here’s a short story dramatizing Ainslie’s picoeconomic model of akrasia:

  **The Slope of Now**

  The cursor blinked on the blank document. Leo’s book chapter on neural correlates of decision-making was due in 72 hours. The reward: academic prestige, a crucial step towards tenure, the validation he craved. *Larger-Later Leo* surveyed this future with calm satisfaction. He’d planned meticulously.

  But *Present Leo* felt the familiar slope steepening beneath him. Across the room, the sleek console hummed. *Civitas: Imperium*, his strategic obsession, promised an immediate, potent hit: the thrill of conquest, the dopamine cascade of a perfectly executed maneuver. Its reward was small, fleeting – maybe two hours of immersion – but *so near*.

  Earlier, with the deadline days away, the curves had been clear. The larger-later reward – the book, the career – soared high and distant. The smaller-sooner reward – *Civitas* – was a minor blip. Choosing work was effortless. *Future Leo*, a unified entity back then, easily discounted the game.

  But time steepened the curve of *Civitas*. As the possibility of playing *now* drew near, its subjective value surged upwards, hyperbolically. Leo felt it like a physical pull. The abstract satisfaction of future tenure paled against the visceral, pixelated glory awaiting him on the screen. The curves were crossing. *Present Leo* was gaining ascendancy.

  "Just one skirmish," *Present Leo* whispered, his voice the siren song of the imminent. "A quick morale boost. Then straight back to work. Refreshed!"

  *Larger-Later Leo* recoiled. "No! You know the slope. One skirmish bleeds into a campaign. That campaign bleeds into the night. We’ve seen this fracture before."

  They weren’t two distinct voices, but shifting weights in his consciousness. Leo paced, not fighting an *external* temptation, but mediating a civil war between his temporal factions. His hand hovered near the console controller. The *value* of *Civitas*, in this moment, felt overwhelming. The chapter felt abstract, weightless.

  "See?" *Present Leo* pressed. "The work feels like nothing *now*. *This*," he gestured mentally at the console, "is everything. We *prefer* it. Right now, *we* want it more."

  He was right. In this sliver of time, the preference had reversed. The discounted value of the book chapter had plummeted below the surging value of the game. Akrasia wasn't stupidity; it was a mathematical inevitability of the crossing curves.

  But *Larger-Later Leo* didn’t fight the preference. He invoked the **Rule**. "The Domino Clause, Leo. Remember?"

  The Domino Clause was Leo’s core personal rule, forged in the ashes of past procrastination spirals: *Breaking the work-block for unplanned gaming collapses the structure for the entire week.* It wasn't about *this* game session. It was about the precedent. If *Present Leo* won *now*, it proved the Rule was weak. Future *Present Leos* – facing deadlines, tax forms, exercise – would see the breach. They would argue, "You broke it for *Civitas* last week, why not for scrolling now? Why not for napping?" The entire edifice of intertemporal bargaining, the fragile cooperation between successive selves, would crumble. The future became a series of cascading defeats, each smaller-sooner reward dominating its moment.

  *Present Leo* faltered. He felt the vast, arid landscape of future failures – the unwritten papers, the missed gym sessions, the neglected promises – stretching out if the Rule fractured. The immediate, intense glow of *Civitas* was still dazzling, but it was now ringed by the immense, encroaching shadow of discounted *future* losses – losses made tangible and terrifying by the Rule. The Rule weaponized the future against the present.

  "It’s not just *this* game," *Larger-Later Leo* said quietly. "It’s every future choice. Give in now, and we tell all the *Leos* to come that the Rule is negotiable. That their sacrifices are meaningless. The slope becomes a cliff."

  *Present Leo* groaned. The hyperinflated value of *Civitas* was still there, a physical ache. But superimposed was the catastrophic devaluation of *everything else* that the breach implied. The Rule made the long-term consequence *present* and *potent*.

  "Fine," *Present Leo* conceded, the word thick with reluctant surrender. "But... concession? The Rule holds *if*... if we schedule a *Civitas* block. After the chapter is submitted. Firmly scheduled. On the calendar."

  It was a picoeconomic counter-offer. *Present Leo* wasn’t defeated; he was bargaining. He demanded a credible commitment – a *later*, scheduled reward – to offset his sacrifice *now*. He needed assurance that his preference reversal wouldn’t be exploited without compensation.

  *Larger-Later Leo* considered. A scheduled reward *after* the work was done didn’t threaten the Rule. It reinforced it – work first, *then* play. It was a payoff to *Present Leo* that maintained the integrity of the bargain for future selves.

  "Deal," *Larger-Later Leo* agreed. "Scheduled block. 3 hours. Post-submission."

  The tension eased. The warring valuations settled. The immediate, overwhelming pull of *Civitas* receded, not extinguished, but contained by the negotiated truce enforced by the Domino Clause. The curves were still crossed – *Present Leo* still subjectively valued the game more *right now* – but the Rule, and the promise of a later concession, altered the calculus of action.

  Leo took a deep breath. The console’s hum faded into background noise. He turned back to the blinking cursor. He wasn’t resisting temptation through sheer force. He was a parliament of moments, governed by a precarious constitution written in the currency of discounted futures, where survival depended on honoring treaties made with selves yet to come. He started typing, the agreement echoing in the quiet room: *Hold the line. The Rule stands.* The slope of Now had been navigated, for this moment. The next crossing was always just ahead.
