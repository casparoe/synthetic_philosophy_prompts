answer: |-
  You've put your finger on the core tension between Lewis's elegant philosophical analysis and the messy reality of evolved behavioral regularities. Your vervet monkey research provides a powerful empirical counterexample to Lewis's necessity claim. Let's dismantle the common-knowledge requirement and confront its strongest defense.

  **The Argument Against the Necessity of Common Knowledge for Convention:**

  1.  **The Vervet Monkey Counterfactual:** Your research demonstrates the existence of *de facto* conventions (arbitrary, stable signaling systems for eagles, leopards, snakes) in a species demonstrably incapable of the iterated beliefs Lewis requires. The arbitrariness (e.g., specific calls for specific predators, potentially varying slightly between troops) and stability (learned, transmitted, self-perpetuating) are precisely what a theory of convention should explain. If conventions *can* exist without common knowledge – and your work shows they do – then common knowledge cannot be logically *necessary*.

  2.  **Evolutionary Game Theory's Explanatory Power:** Skyrms, Young, and others show rigorously how Lewis's *own* sender-receiver game model can converge on stable signaling equilibria *purely* through:
      *   **Reinforcement Learning:** Individuals repeat actions that yielded positive outcomes (e.g., avoiding predators after hearing/using a specific call, successfully coordinating with others using that call).
      *   **Differential Replication:** Behavioral variants that lead to better survival/reproduction (e.g., using the locally stable call) become more prevalent.
      *   **Population Dynamics:** Random interactions and learning rules lead to the fixation of one arbitrary signal-meaning pairing.
      This process requires:
      *   **No Belief Attribution:** Monkeys don't need to model "Monkey A believes that Monkey B believes that the 'eagle call' means eagle..."
      *   **No Infinite Regress:** The process halts at individual learning and behavioral response. Stability emerges from the aggregate dynamics, not from nested mental states.
      *   **No "Knowledge" in the Lewisian Sense:** Individuals need only dispositions to act based on past reinforcement, not justified true beliefs about others' mental states.

  3.  **What Evolutionary Dynamics Deliver (Lewis's Goals Met):**
      *   **Arbitrariness:** Multiple stable equilibria are possible (e.g., different sounds could signal "eagle"). Which one prevails is path-dependent and arbitrary.
      *   **Stability:** Once established, the regularity is self-perpetuating. Deviant behavior (using the "wrong" call) is less successful and selected against (punished by lack of reinforcement or negative outcomes).
      *   **Coordination:** The system *functions* to coordinate behavior (evasion) effectively.
      *   **Reason to Conform:** The reason to conform is starkly practical: non-conformity reduces fitness (increased predation risk). This is a powerful, non-epistemic reason.
      *   **Preference for General Conformity:** Individuals benefit *because* others conform – the call only works if others respond appropriately. This preference is embodied in the learning rules and selective pressures, not necessarily represented as a belief.

  **Addressing the Strongest Defense of Lewis:**

  The most compelling argument a Lewisian defender could mount is the **"Normativity and Justification Gap":**

  *   **The Argument:** Mere stable behavioral correlation, even if reinforced, lacks the *normative* dimension essential to convention. Lewis's common knowledge provides the *reason* and *justification* for conformity that goes beyond mere habit or reinforcement. It explains *why* we feel *bound* by convention and can *criticize* deviations. In Lewis's framework:
      1.  **Mutual Expectations:** I conform *because* I expect others to conform (and vice versa).
      2.  **Mutual Preferences:** I prefer to conform *if* others conform (and vice versa).
      3.  **Common Knowledge of 1 & 2:** This shared understanding creates a web of interdependent *reasons*. It justifies my conformity and provides grounds for expecting conformity from others and criticizing non-conformity ("But everyone *knows* you drive on the right here!").
      4.  **Distinguishing Conventions:** Common knowledge allows us to distinguish a genuine convention (like driving on the right) from a mere universal habit (like blinking) or a causally enforced regularity (like fleeing a predator roar). The latter lack the layer of mutual expectations and interdependent reasons.

  *   **The Evolutionary Rebuttal to the Strongest Defense:**
      1.  **"Normativity" Emerges from Reinforcement and Cost:** The "binding force" in the vervet system *is* the cost of deviation (predation). Criticism manifests as the failure of the system to work when a call is "wrong" (ignored or elicits the wrong evasion), directly impacting fitness. The "reason" to conform is survival, embedded in the learning mechanism. This *is* a powerful normative force, even if not linguistically articulated. The monkey isn't "bound by duty" but by the stark reality of what works.
      2.  **Distinguishing Conventions Without CK:**
          *   **Arbitrariness + Coordination:** The key marker is the presence of *multiple possible stable solutions* (arbitrariness) that solve a *coordination problem*. Blinking isn't arbitrary (it's physiological) and isn't solving a coordination problem. Fleeing a roar isn't arbitrary (it's a direct causal response to danger) and doesn't require coordination (individual flight suffices).
          *   **Function & Population Specificity:** Vervet alarm calls *function* to coordinate group evasion in response to specific threats, and the specific calls used are *population-specific* and learned – hallmarks of convention. Evolutionary stability analysis *shows* why this regularity persists while others (like random noises) do not.
          *   **Punishment of Deviance:** Within the population dynamics, "deviant" signaling or response strategies are selected against because they lead to worse outcomes. This internal enforcement mechanism is characteristic of convention.
      3.  **Lewis Confuses Consequence with Requirement:** Common knowledge is often a *consequence* of established conventions in cognitively sophisticated creatures like humans, enabling richer justification and discourse *about* the convention. However, it is not the *source* of the convention's stability or its defining characteristic. The vervet system shows the convention *precedes* and *functions without* this cognitive elaboration. The core phenomenon – a stable, arbitrary, self-perpetuating solution to a coordination problem – exists at the behavioral level.
      4.  **Redundancy of the Regress:** Once a signaling system is evolutionarily stable, individuals *de facto* act *as if* they have the relevant expectations (they respond predictably to calls). The infinite regress of "knowing that others know..." adds no explanatory power to the *stability* of the behavioral regularity itself; it only adds a layer of cognitive representation that may or may not be present. The behavioral coordination is the explanandum; evolutionary dynamics explain it without needing the cognitive superstructure.

  **Conclusion:**

  Your career studying vervets provides the crucial empirical evidence: conventions *do* exist in nature without infinite mutual knowledge. Evolutionary game theory provides the rigorous theoretical framework showing *how* this is possible, using Lewis's own models. Lewis's common knowledge requirement, while capturing an important aspect of *human reflection* on conventions, is not necessary for the core phenomenon of convention itself – a stable, arbitrary, self-perpetuating solution to a recurrent coordination problem. The strongest Lewisian defense, based on normativity and justification, ultimately fails. The "normativity" in biological conventions arises from the hard logic of reinforcement and fitness consequences, not from shared representations of mutual belief. The ability to distinguish conventions from other regularities resides in the functional role (solving coordination problems with multiple equilibria) and the mechanisms sustaining them (learning, selection), not in an inaccessible tower of iterated knowledge. Evolutionary dynamics deliver the arbitrariness, stability, and functional coordination that define convention in the philosophically relevant sense, rendering Lewis's demanding epistemic condition descriptively inaccurate and explanatorily superfluous for the core phenomenon. Your monkeys, and the models they inspired, show that convention emerges from the dynamics of interaction and learning long before the capacity for pondering mutual knowledge evolves.
