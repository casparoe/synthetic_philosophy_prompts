prompt: |-
  Ok so heres something that's been bugging me for a while. If I already believe someone's annoyed with me, their face can start looking angry to me even though I know their expression is actually neutral - and it doesnt feel like im just interpreting it that way after the fact, it genuinely looks different to me in the moment. Got me wondering whether beliefs and expectations can actually reach in and change what you perceive, or whether perception is more like a closed off system that just feeds the same raw data up to your beliefs no matter what you already think going in. Could you write me a dialogue between two people hashing this out face to face - one defending the view that perception is basically walled off from cognition, and one arguing that beliefs and expectations really do penetrate perception itself, not just your later judgment about it? I want them to actually use my face example plus at least one or two other real cases each, and push hard on each other's strongest points instead of just repeating their own side.
