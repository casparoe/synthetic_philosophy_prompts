  First, I need to recall what interpersonal utility comparisons mean. In economics, ordinalists like Lionel Robbins argue that you can't objectively measure or compare utility between people. So phrases like "you make each other happier" are off-limits. The challenge is to celebrate their relationship while respecting Priya's academic stance.

