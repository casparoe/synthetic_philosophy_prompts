  But this isn't just semantics - the stakes become clear when we consider what each theory explains. Etiological functions explain why traits exist (glycolytic GAPDH persists because it aided survival/reproduction). Causal-role functions explain how systems currently work (nuclear GAPDH participates in DNA repair mechanisms). The user's reviewer is implicitly demanding an etiological justification they can't provide.

