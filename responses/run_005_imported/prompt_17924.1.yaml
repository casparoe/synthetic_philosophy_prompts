answer: |-
  Here are 10 targeted questions designed to push the core tensions in the metaphysician's account, complete with predicted replies and sharp follow-ups. They're ordered strategically to build pressure on the normativity solution, ontology, empirical data, legal relevance, and falsifiability.

  ---

  ### **Question Set for the Metaphysician on Omissions as Causes**

  1.  **Core Challenge: Normativity & Naturalism**
      *   **Question:** You resolve causal promiscuity (e.g., everyone on Earth *not* watering my plant) by appealing to norm-violation or reasonable expectation. But causation is typically conceived as a natural, *mind-independent* relation. Isn't this solution smuggling evaluative (moral, conventional, or statistical) concepts into the *metaphysical ground* of causation itself, thereby abandoning a purely naturalistic account?
      *   *Predicted Reply:* "No, the 'norm' or 'expectation' here isn't necessarily moral; it's often statistical regularity, functional role, or contextually defined roles within a system – it's part of the causal structure of the world."
      *   **Follow-Up:** But statistical normalcy and moral expectation constantly diverge. Consider: statistically, it's *abnormal* for a passerby to perform CPR on a stranger in distress, but morally, we might expect it (or even demand it). If the passerby fails to act, is their omission a cause of death *only* because it's statistically abnormal (making it metaphysically causal), or *only* if it's morally expected (making causation evaluative)? Your account seems forced to choose one, undermining its claim to naturalism either way.

  2.  **Pressing the Normative Ground**
      *   **Question:** Building on the normativity point: *What precisely grounds* the relevant norm/expectation whose violation makes an omission causal? Is it objective features of the situation (e.g., biological needs, physical dependencies), social conventions, moral duties, statistical frequencies, or agent-specific roles? And crucially, *who determines* which norm is salient in a given case? Isn't this determination itself evaluative or interest-relative?
      *   *Predicted Reply:* "It's grounded in objective features *plus* context – the roles agents occupy, the dependencies present, the *actual* possibilities within the situation. The salience isn't arbitrary; it's fixed by the causal structure and the specific scenario."
      *   **Follow-Up:** Doesn't this simply relocate the problem? Determining which "role," "dependency," or "actual possibility" is *causally relevant* in a sea of potential omissions (e.g., why the plant owner's role matters but not the neighbour's identical physical capacity) seems to *require* invoking the very norms or expectations you claim are merely tracking pre-existing causal facts. Isn't this circular? How do you non-circularly specify the "context" without relying on the norm?

  3.  **The Ontological Worry (Beebee-esque)**
      *   **Question:** A core objection to omissions as causes is ontological: absences aren't *events* or concrete particulars; there's literally *nothing* there to stand in a causal relation. Your account posits the absence (e.g., the not-watering) as a genuine relatum. What *kind* of entity is this absence? Is it a negative fact, a privation, a sui generis type of event? How does this entity interact with positive events (like the plant's dying) in a way that satisfies standard physicalist or event-based ontologies of causation?
      *   *Predicted Reply:* "Absences *are* real features of the world – negative states of affairs or the non-occurrence of an expected event. Causation by absence involves the *dependence* of an effect on the non-occurrence of some event that was required to prevent it. We don't need mysterious 'negative events'; we have states of the world that include absences."
      *   **Follow-Up:** If absences are just "negative states of affairs," how do we individuate them? Is the "state of affairs" *John not watering the plant at time T* distinct from *Mary not watering the plant at T*, or *water not being applied to the plant at T*? Doesn't this proliferation of negative states re-introduce the promiscuity problem ontologically? And how does this negative state exert *causal influence*? Doesn't causation require energy transfer or counterfactual difference-making between *positive* events?

  4.  **Empirical Data & Folk Intuitions (Hitchcock/Knobe)**
      *   **Question:** You note that your norm-violation approach aligns with Hitchcock, Knobe, and others showing that ordinary causal judgments about omissions *are* sensitive to norms (moral, statistical, functional). But does this empirical data *vindicate* your metaphysical claim that omissions *are* causes, or does it merely show that the *folk concept* of causation is evaluatively loaded? Couldn't the data be explained by the folk *mistakenly* attributing causation based on blameworthiness, even if metaphysically, only positive events are causes (as per Dowe's quasi-causation)?
      *   *Predicted Reply:* "The data supports the view that our core concept of causation *includes* omissions as causes under norm-violating conditions. This isn't a mistake; it reflects the structure of causal reality as we interact with it. Metaphysics should account for our successful causal reasoning."
      *   **Follow-Up:** But if the folk concept is demonstrably sensitive to *moral* valence in ways that seem irrelevant to physical causation (e.g., Knobe effects where the *same* physical act is judged more causal if morally bad), doesn't this suggest the folk concept is *contaminated* by evaluation, not tracking a pure causal relation? Why should metaphysics adopt this potentially contaminated concept rather than purify it?

  5.  **The Legal Liability Red Herring?**
      *   **Question:** In law, we readily assign liability for harms caused by omissions *when there was a duty to act*. This seems to mirror your structure: omission + norm (duty) = cause. Does this legal practice provide *evidence* for your metaphysical claim that omissions can be genuine causes, or is it simply a separate normative practice (assigning responsibility) that *supervenes* on a purely positive-event metaphysics of causation? Couldn't courts be holding people responsible *for allowing harm to occur* without needing to reify the absence itself as a metaphysical cause?
      *   *Predicted Reply:* "Legal practice reflects a deep-seated recognition of genuine causal efficacy in omissions under duty conditions. It's evidence that our best practical reasoning treats these omissions as causes, which metaphysics should accommodate, not explain away."
      *   **Follow-Up:** But legal liability requires *both* causation *and* duty/breach. Courts often explicitly separate the two inquiries. Finding liability *because* of a duty doesn't prove the *causal relation itself* is metaphysically distinct from cases involving only positive acts. Isn't it more parsimonious to say the law attaches responsibility to the *failure to prevent* a harm caused by positive events (e.g., dehydration, gravity), without needing absences as causes?

  6.  **Falsifiability & The Normativity Shield**
      *   **Question:** A major concern is that your "only norm-violating omissions count" move seems unfalsifiable. For any alleged counterexample where an omission seems non-causal despite norm-violation (or causal despite no norm-violation), couldn't you simply redraw the boundaries of the relevant "norm" or "expectation" to fit? What evidence or conceivable scenario *could* falsify the claim that omissions *can* be genuine causes under your norm-violation condition?
      *   *Predicted Reply:* "The account *is* constrained. Not just any norm will do; it must be a norm grounded in the objective structure of the situation – dependencies, roles, genuine possibilities. We can point to clear cases where an omission clearly *doesn't* cause despite failure (e.g., I fail to buy a lottery ticket, someone else wins – my omission didn't cause their win, even though I violated a norm of prudence?) and cases where it clearly does (failing to water your own plant)."
      *   **Follow-Up:** But the lottery example seems to rely on pre-existing intuitions about causation (difference-making) *independent* of norm-violation. My omission *did* make a difference to *my* winning, but not to *the winner's* winning – that's a counterfactual analysis. Doesn't this suggest the *real* work in distinguishing causal from non-causal omissions is being done by counterfactual dependence or process theories *within* the context set by the norm, rather than the norm itself *making* the omission a cause? How do you rule out that the norm just sets the *scope* for applying a different causal criterion?

  7.  **Overdetermination by Omission?**
      *   **Question:** Consider a case of symmetric overdetermination by omission: Two negligent guards, each independently tasked with watching a prisoner, both fall asleep. The prisoner escapes. On your view, is Guard A's omission a cause? Guard B's? Both? If both, how do you avoid saying the escape was overdetermined by two distinct absences? If only one, how do you choose *which* one, given their symmetrical norm-violating omissions?
      *   *Predicted Reply:* "Both omissions are causes. Each made a difference: if either guard had been awake, the escape would likely have been prevented. This is a genuine case of causal overdetermination by omission."
      *   **Follow-Up:** But how can two *absences* (non-events) both be distinct, sufficient causes? Doesn't this multiply causes beyond necessity? If the escape occurs because *no guard was watching*, isn't that a *single* negative state (the absence of watchfulness) rather than two distinct causal relata? Doesn't this push us back towards a counterfactual account where the cause is the *combination* of absences, undermining the idea of *individual* omissions as distinct causes?

  8.  **Causation vs. Explanation?**
      *   **Question:** Might the intuition that "your not watering caused the plant's death" be better understood as an *explanatory* claim ("The plant died *because* you didn't water it") rather than a strictly *causal* one? Explanation is inherently interest-relative and can cite absences (why did it happen? *Because X didn't happen*). Does conflating explanation with causation risk importing pragmatic/evaluative elements into the metaphysics where they don't belong?
      *   *Predicted Reply:* "While explanation involves pragmatics, the underlying relation that *makes* the explanation true is causal. The absence genuinely figures in the causal history of the effect."
      *   **Follow-Up:** But doesn't the *explanatory relevance* of a specific absence (e.g., *your* not watering, not the neighbour's) depend entirely on our interests, knowledge, and norms? If the underlying causal relation is supposed to be natural and mind-independent, how can the *same* physical situation (plant dehydrates) contain *multiple* distinct causal relations (one for each possible waterer's omission), only some of which are ever explanatorily relevant? Doesn't this point towards the causal relation itself being interest-relative?

  ---

  ### **How to Use These**

  *   **Start with 1 & 2:** Directly challenge the normativity solution's core tension. Her replies will reveal how "thick" or "thin" her conception of the norm is.
  *   **Hit Ontology (3):** Ground the discussion in metaphysics after the normativity clash.
  *   **Bring in Data (4):** Connect to empirical work, questioning whether it supports metaphysics or folk concepts.
  *   **Bridge to Law (5):** Leverage your expertise, forcing her to clarify the relation between metaphysics and practice.
  *   **Press Falsifiability (6):** Crucial. Don't let her off the hook. Force her to specify what *would* count against her view.
  *   **Use 7 & 8 as Needed:** Deploy these if the discussion needs fresh angles on overdetermination or the explanation/causation distinction.

  These questions force her to defend the *metaphysical substance* of her normativity solution, its ontology, and its vulnerability to counterexamples, while connecting to legal practice and empirical psychology in ways relevant to your work. Good luck!
