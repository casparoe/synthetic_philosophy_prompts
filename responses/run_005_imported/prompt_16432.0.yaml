  I should assess if their argument holds. On EPR, the reality criterion is a hidden premise. They need to address that explicitly. For the stochastic case, their point is strong. Dismissing alternatives is acceptable if framed as philosophically costly. No-signaling doesn't negate nonlocality, so they should explain Bell nonlocality versus signaling.

