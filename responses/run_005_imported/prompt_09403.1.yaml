  For the moral dilemma, I plan to frame it as preserving the policy's credibility being what ultimately saves more lives long-term. The memo should acknowledge the agony of the choice but emphasize that exceptions unravel deterrence. I'll include operational angles too—rescue attempts, intelligence exploitation, counter-narratives—to show active effort beyond passive refusal.

