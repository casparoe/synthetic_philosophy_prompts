prompt: |-
  I'm a third-year philosophy PhD student, and this semester I'm in a small graduate seminar devoted entirely to Leibniz, working slowly through the *Discourse on Metaphysics*, the *Monadology*, the correspondence with Arnauld, and the *Theodicy*, along with the later exchange with Clarke. Completely separately, I've started sitting in on a reading group that some friends in the CS department run on the philosophy of AI, and a few weeks ago the session was on Bostrom's simulation argument: the trilemma that either almost no civilizations reach a technologically mature "posthuman" stage, or almost none of the ones that do bother running many high-fidelity simulations of their own evolutionary history, or we are almost certainly living in such a simulation right now.

  The two reading lists have started to bleed into each other in my head, and I raised the comparison at my last seminar meeting, half-expecting to be laughed at. My advisor wasn't hostile exactly, but she was openly skeptical that there's anything here beyond a superficial pattern-match between "possible worlds in the mind of God" and "possible worlds computed on a server somewhere," and she's asked me to either substantiate it properly for my term paper or quietly drop it. So I want to think through, using Leibniz's actual machinery rather than the more obvious Cartesian evil-demon move, what he would plausibly have made of Bostrom's argument.

  A few of the threads I'd like your help pulling on: Leibniz holds that monads are windowless and that each substance's complete concept already contains every predicate it will ever have, with the appearance of mind-body interaction explained away by pre-established harmony rather than any real causal traffic between substances — does that make the very idea of a "simulation," in Bostrom's sense, either redundant (since on Leibniz's view nothing was ever anything but internally generated, God-synchronized representation) or a kind of category mistake? Does the identity of indiscernibles give him principled grounds for treating "are we in a simulation or in base reality" as an empty question rather than a hard one, on the reasoning that a world discernible from ours in no respect whatsoever just is ours? And given the principle of sufficient reason, the constraint of compossibility, and his commitment to God's choosing, among all possible worlds, the one with the greatest variety compatible with the greatest order, would he find something like the third horn of the trilemma congenial — nested computational worlds as exactly the kind of plenitude a perfect creator should be expected to produce — or would he instead reject the whole trilemma on the grounds that a finite, non-omniscient "posthuman" running simulations for its own purposes cannot occupy the role his God occupies, so that none of the three disjuncts is even coherently statable in his terms? I'd rather see your own reconstruction of the argument than a pastiche of Leibniz's prose style.
