  Potential pitfalls: equating God's possible worlds with computer simulations. Leibniz’s possible worlds are metaphysical, not computational. Simulations are physical processes, which monads aren't. Also, posthumans aren't omniscient or benevolent, so their simulations don't align with God's criteria for choosing the best world. Highlighting these differences is key.

