prompt: |-
  Compare David Lewis's Principal Principle with Bas van Fraassen's Reflection Principle. Both instruct you to defer your present credence to another privileged quantity that plays the role of an "expert" -- objective chance in Lewis's case, your own anticipated future credence in van Fraassen's -- and, in their unrestricted forms, both run into well-known counterexamples: Lewis's principle runs into chances that can be "undermined" by their own possible future outcomes, while van Fraassen's runs into cases where you can rationally anticipate becoming irrational -- through manipulation, forgetting, or the like -- before the later time in question. Explain, for each principle, exactly what feature of the problematic evidence causes the trouble, and how the standard fix is supposed to work. Then say whether the two fixes amount, at bottom, to the same philosophical move, or whether the parallel breaks down under closer scrutiny.
reasoning: |-
  Okay, the user is asking about two principles in philosophy: David Lewis's Principal Principle and Bas van Fraassen's Reflection Principle. Both deal with deferring to an "expert"—objective chance for Lewis and your future self for van Fraassen. The user wants to know what causes problems for each, how they're fixed, and whether the fixes are fundamentally the same.

  First, I need to recall the details of both principles. The Principal Principle says your current credence should match the objective chance if you know it. But Lewis later realized that if a future outcome could affect the chance itself, that causes issues. For example, in a radioactive decay scenario, knowing that a certain outcome would make the chance different creates a conflict. The fix was to add an "admissibility" condition, excluding such undermining evidence.

  For the Reflection Principle, it says you should align your current credence with what you expect your future credence to be. The problem is when you know you'll become irrational—maybe due to drugs or forgetting. Van Fraassen's fix was to require that your future credence is based on your current conditional probability, assuming you update rationally.

  Now, the user wants to know if these fixes are the same move. On the surface, both restrict the principle to cases where the expert is "properly" informed. But the admissibility condition is about excluding specific undermining info, while Reflection requires conditionalizing on your current beliefs. The key difference is that admissibility is a negative condition (excluding certain evidence), while Reflection's fix is a positive one (ensuring rational updating). So they're similar in intent but different in mechanism. The user might be exploring deeper philosophical parallels or differences in handling expert deference, which could relate to epistemology or decision theory.
answer: |-
  Here's a breakdown of the Principal Principle (PP), the Reflection Principle (RP), their problems, fixes, and a comparison of those fixes:

  **1. David Lewis's Principal Principle (PP)**

  *   **Core Idea:** Your current credence (subjective probability) in proposition A, conditional on the proposition that the *objective chance* of A at time t is x, *and* on any *admissible* evidence E, should be x.
      *   `Cr(A | ch_t(A) = x ∧ E) = x` (where E is admissible).
  *   **"Expert" Role:** Objective chance (ch_t(A)).
  *   **Problem - Undermining Futures:** The unrestricted principle runs into trouble with evidence that is *inadmissible* because it *undermines* the chance statement itself. Specifically, the problem arises with evidence E that:
      *   **a)** Is *logically consistent* with `ch_t(A) = x`.
      *   **b)** Is *about the future* relative to t (the time the chance is defined).
      *   **c)** Entails that the *actual long-run frequency* or outcome history relevant to the chance process would be such that, *if it obtained*, the true chance `ch_t(A)` *could not actually be x*.
      *   **d)** Yet, if `ch_t(A) = x` *were* true, E *could* still be true (it's not ruled out by `ch_t(A) = x` alone).
  *   **What Makes E Problematic:** E provides information about the future outcome of the very chance process that `ch_t(A) = x` describes, in a way that logically conflicts with `ch_t(A) = x` being the *correct* chance *if E is true*. Holding `ch_t(A) = x` *fixed* while learning E creates an inconsistency because E suggests `ch_t(A) = x` isn't the right chance description of the world leading to E.
  *   **Standard Fix - Admissibility:** Lewis's solution is to restrict the PP by requiring that the evidence E be **admissible** relative to `ch_t(A) = x` and A. Crucially:
      *   **Historical Admissibility:** Evidence solely about the past and present up to time t is always admissible.
      *   **Excluding Underminers:** Evidence about the future after t that could undermine the truth of `ch_t(A) = x` is inadmissible. The PP *only* constrains credence conditional on `ch_t(A) = x` *plus admissible evidence*. Undermining future evidence E must *not* be included in this conditioning.
  *   **Resulting Form:** `Cr(A | ch_t(A) = x ∧ H_t) = x` (where H_t is the complete history of the world up to time t).

  **2. Bas van Fraassen's Reflection Principle (RP)**

  *   **Core Idea:** Your current credence in proposition A, conditional on the proposition that your *future credence* in A at time t will be x, should be x.
      *   `Cr_now(A | Cr_t(A) = x) = x`.
  *   **"Expert" Role:** Your own future credence (Cr_t(A)).
  *   **Problem - Anticipated Irrationality:** The unrestricted principle runs into trouble when you rationally anticipate that your future self at t will be *irrational* or have *defective* information. Specifically, the problem arises when you have evidence E *now* that:
      *   **a)** Leads you to believe `Cr_t(A) = x` (your future self will have credence x in A).
      *   **b)** But also convinces you that `Cr_t(A) = x` will be held for *bad reasons* (e.g., manipulation, forgetting crucial evidence, emotional disturbance, cognitive impairment, irrational reasoning).
  *   **What Makes E Problematic:** E reveals that your future self, while indeed holding credence x, is *not a trustworthy expert* on A. Their credence is corrupted. Deferring to this corrupted state is irrational *now* because you possess evidence *now* indicating that state is unreliable. Conditioning on `Cr_t(A) = x` alone ignores *why* you believe that future credence obtains.
  *   **Standard Fix - Rational Anticipation:** Van Fraassen's solution reframes RP as a constraint on *rational anticipation*. The core idea is that your future credence should be seen as the result of *conditionalizing* your current credence function on the evidence you expect to gain.
      *   **Conditionalization Requirement:** `Cr_t(-) = Cr_now(- | E)` (where E is the total evidence you expect to gain between now and t).
      *   **Reflection as Consequence:** If you are certain your future self will have updated by conditionalizing on E, then RP follows: `Cr_now(A | Cr_t(A) = x) = Cr_now(A | Cr_now(A | E) = x) = x`. The principle holds because your future self's credence is just your *current* conditional credence given the new evidence. You are, in effect, deferring to your *current* (conditional) expert judgment.
  *   **Resulting Form/Interpretation:** RP is rational only when you rationally expect your future self to be epistemically superior – specifically, to have updated correctly on all relevant evidence you expect them to have. It's a principle about *diachronic coherence* under *rational updating*, not blind deference to any future state.

  **Comparison of the Fixes: Same Move or Different?**

  The fixes share a *superficial similarity*: both restrict the principle to cases where the "expert" (chance/future self) is *appropriately qualified* or *properly informed* relative to the proposition in question. However, the *nature* of the fix and the underlying philosophical move differ significantly:

  1.  **PP Fix (Admissibility):** This is primarily a **negative exclusionary move**. It identifies specific *types of information* (undermining future information) that *must be excluded* from the evidence base when applying the PP. The expert (chance) is defined relative to a specific time (t) and information state (history up to t). The fix protects the expert's authority by *shielding it* from information that directly conflicts with its definition. The core deference (`Cr = ch`) remains simple, conditional only on admissible evidence.
  2.  **RP Fix (Conditionalization/Rational Anticipation):** This is primarily a **positive reinterpretive move**. It doesn't just exclude bad cases; it redefines what it *means* for the future self to be an expert worthy of deference. The future self is only an expert *if* its state is the result of rationally updating *your current* credence function. Deference is justified *only because* the future credence is seen as the *output* of your *current* conditional probability given new evidence (`Cr_t(A) = Cr_now(A | E)`). The RP becomes a *consequence* or *consistency condition* of rational diachronic planning, not a primitive rule of deference.

  **Does the Parallel Break Down?** Yes, under closer scrutiny, the parallel largely breaks down:

  *   **Nature of Constraint:** PP's admissibility is an *external* constraint on the *information* you can use with the principle. RP's fix (conditionalization) is an *internal* constraint on the *relationship* between your current and future doxastic states.
  *   **Source of Authority:** The PP's chance expert derives authority from its metaphysical nature (describing fundamental, time-dependent propensities/frequencies). Its fix protects this metaphysical role by excluding temporally incompatible information. The RP's future self expert, under the fix, derives its *entire* authority *epistemically* from its relationship to your *current* rational state via conditionalization. It has no independent authority.
  *   **The Philosophical Move:**
      *   The **PP fix** maintains that objective chance *is* the expert for certain propositions, provided we respect its temporal limitations. It's about *identifying and respecting the domain* of the expert.
      *   The **RP fix** redefines the "expert" not as the *future self's state itself*, but as *your current self's conditional judgment* about what you *should* believe *after* learning E. Deference is really to your *current* (conditional) expert judgment. It's about *reconciling your current and future selves* through rational updating, not deference to a distinct future authority.

  **Conclusion:** While both fixes address the problem by requiring the "expert" to be properly qualified, they do so in fundamentally different ways. The PP fix (**admissibility**) is a **protective exclusion** of incompatible information to safeguard the defined expert's authority within its temporal domain. The RP fix (**conditionalization/rational anticipation**) is a **reinterpretation** showing that the future self is only an expert *because* it embodies the result of applying your *current* expert judgment to new evidence. The RP fix fundamentally changes the *source* of the expert's authority from the future self to the current self's conditional probabilities. The parallel holds at the level of needing *some* qualification but breaks down when examining the *type* of qualification and the underlying philosophical justification for deference.
