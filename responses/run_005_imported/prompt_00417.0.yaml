answer: |-
  That's an excellent and profound question that cuts to the heart of the relationship between mathematics and physics. As a physicist wrestling with a mathematical result that *seems* to violate a fundamental physical law, your intuition is spot-on. However, the reason the axiom of choice (AC) hasn't been discarded due to Banach-Tarski is rooted in the crucial distinction between the abstract world of set theory and the physical reality governed by conservation laws. Here's why:

  1.  **The Pieces are Non-Measurable (and Non-Physical):**
      *   The core reason Banach-Tarski doesn't threaten conservation of mass is that the "handful of pieces" into which the ball is decomposed are **non-measurable sets**.
      *   In mathematics, "volume" (Lebesgue measure) is only defined for certain well-behaved sets. Non-measurable sets are incredibly pathological constructs. They cannot be assigned a consistent volume at all. They are infinitely fragmented, dense, and scattered in a way that defies classical notions of size.
      *   **Crucially, non-measurable sets cannot be realized as physical objects.** You cannot construct them out of wood, metal, plasma, or any known form of matter/energy. They exist purely within the abstract realm of set theory, constructed using the Axiom of Choice which allows for selections from infinitely many uncountable sets without a definable rule.
      *   Therefore, the "cutting" described in Banach-Tarski is **not a physical operation.** It's a purely theoretical decomposition within the formal system of Zermelo-Fraenkel set theory plus AC (ZFC). You cannot perform this decomposition on a physical ball with any physical tools.

  2.  **Conservation of Mass Applies to Physical Objects:**
      *   Conservation of mass/energy is a law governing the behavior of physical systems composed of measurable quantities of matter and energy.
      *   Since the "pieces" in Banach-Tarski are non-measurable and non-physical, the concept of "mass" simply doesn't apply to them. You cannot assign a mass value to these abstract sets. The paradox arises *because* volume (and thus mass, in the physical analogy) isn't defined for these sets.
      *   When mathematicians say the "volume" doubles, they are referring to the fact that the *reassembled* balls are measurable sets with volumes equal to the original, *despite* being composed of pieces that individually have no defined volume. This is a statement about the properties of mathematical constructs within ZFC, not about manipulating physical matter.

  3.  **Mathematics vs. Physical Reality:**
      *   Mathematics provides abstract models *of* reality. Not all mathematical constructs have direct physical counterparts. Non-measurable sets are a prime example.
      *   Banach-Tarski demonstrates a deep and surprising consequence of the Axiom of Choice *within the formal system of mathematics*. It highlights the limitations of our intuitive notions of volume when dealing with the full power of set theory.
      *   Physics, however, operates under different constraints. The physical universe appears to be built upon measurable quantities, continuous or discrete structures, and fundamental symmetries like conservation laws. The pathological sets required by Banach-Tarski simply don't map onto physical reality.

  4.  **The Utility and Necessity of AC (Despite Weirdness):**
      *   While AC leads to counterintuitive results like Banach-Tarski and the existence of non-measurable sets, it is also **incredibly useful and often necessary** for vast areas of mathematics that *are* essential for physics.
      *   AC is equivalent to the statement that every vector space has a basis (used constantly in quantum mechanics, functional analysis). It's needed to prove Tychonoff's theorem (fundamental in topology and analysis), the Hahn-Banach theorem (cornerstone of functional analysis and quantum theory), and the existence of ultrafilters (used in model theory and non-standard analysis).
      *   Many physicists implicitly rely on results dependent on AC when working in functional analysis, differential geometry, or operator algebra. Discarding AC would cripple large parts of the mathematical framework underpinning modern physics, even if the specific paradox of Banach-Tarski is physically unrealizable.

  5.  **Empirical Falsification Applies to Physical Theories:**
      *   The Axiom of Choice is not a physical hypothesis about how matter behaves. It's an axiom within a formal logical system (set theory). We don't empirically falsify logical axioms in the same way we falsify theories about the physical world.
      *   We evaluate axioms based on:
          *   **Consistency:** Does it lead to contradictions? (AC is consistent with ZF if ZF is consistent).
          *   **Usefulness:** Does it allow us to prove important theorems we want?
          *   **Intuition (to some extent):** Does it align with our basic notions? (This is where AC struggles, as Banach-Tarski shows).
      *   While Banach-Tarski clashes violently with physical intuition about volume and mass, it doesn't clash with physical *experiment* because the process it describes **cannot be physically instantiated**. There is no physical experiment that could falsify AC via Banach-Tarski.

  **In Summary:**

  Banach-Tarski doesn't violate conservation of mass because the "pieces" involved are non-measurable mathematical abstractions that cannot exist as physical objects with defined mass. The "cutting" and "reassembling" are purely theoretical operations within set theory, not physical processes. Conservation of mass applies only to measurable quantities in the physical world. While AC leads to this counterintuitive result, it remains a valuable tool for vast areas of mathematics crucial for physics. It hasn't been discarded because its "falsification" isn't physical – the paradox arises from a disconnect between a powerful mathematical axiom and our physical intuition about volume, not from an actual physical duplication of matter. It's a fascinating demonstration of the limits of applying mathematical intuition directly to physics, and vice-versa. As a physicist, your discomfort is completely justified and highlights the importance of carefully considering the domain (abstract math vs. physical reality) when interpreting results.
