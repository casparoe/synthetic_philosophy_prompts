  I'm plotting a novel narrated by Nora, who publicly exposes her ex-husband Felix's long-running investment fraud -- though partway through the book it will emerge that she helped move a portion of the proceeds herself for two years, before quietly repaying her cut and cutting ties, six years before the exposé. Before deciding how sympathetically to write her, I described the bare situation to two friends, Helena and Marcus, without telling them which way I meant to take it, and they ended up arguing about something I hadn't anticipated.

  (1) Helena said Felix doesn't get to wave away Nora's accusation just by pointing out she once did the same thing; that would be a smear, since her past involvement doesn't make the fraud any less fraudulent, or her any less right to expose it. (2) Marcus agreed the fraud is fraud regardless of who names it, but said that isn't the real question -- the question is whether Nora specifically, given her own hand in it, is well positioned to be the one publicly condemning Felix for it, rather than, say, passing what she knows to a journalist and staying out of the accuser's seat herself. (3) Helena answered that this just relabels hypocrisy-shaming as something more respectable: we don't say a getaway driver who turns state's witness lacks the standing to testify against his old crew just because he once did the same thing; if anything, we want people with dirty hands to come forward. (4) Marcus said testifying to facts and standing up as someone's moral accuser are different acts -- Nora's account of Felix's fraud doesn't just report what he did, it condemns him for it, and it's that condemning stance, not the facts themselves, that her own past complicates. (5) Helena pointed out that Nora repaid what she'd taken and walked away six years ago, while Felix kept going and escalated, so surely that difference in their present conduct means she isn't being inconsistent in condemning a fraud she no longer has any part in. (6) Marcus said reform might blunt the charge going forward, but it can't erase it retroactively: Nora made her restitution privately and has still never publicly accounted for her own role, and coming forward now as his sole accuser, while staying quiet about that, serves her own story as much as it serves the truth.

  Please go through Helena's and Marcus's six moves in order and, for each, say who has the better of the argument. Give me your verdicts first, as a JSON object of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>, "6": <score>}, where each score runs from -2 (clearly mistaken) to 2 (clearly right); then justify each score in a sentence or two. Close by telling me whether there's a distinction the two of them need but never quite reach for.
