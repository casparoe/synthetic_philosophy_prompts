  ### Justifications
  1. **Helena (+2)**: She is clearly right. Felix's fraud is objectively real regardless of Nora's past. Accusing her of hypocrisy doesn't refute the facts of *his* crime—it's a classic ad hominem diversion.
  2. **Marcus (+1)**: He makes a valid distinction. While Helena is correct factually, Marcus identifies the deeper question of Nora's *role* as public accuser. His framing is insightful, though not yet fully proven.
  3. **Helena (+1)**: Her analogy is strong—past participants *should* be able to expose crimes. But she oversimplifies by equating legal testimony (facts) with public moral condemnation (judgment), which Marcus addresses next.
  4. **Marcus (+2)**: He correctly identifies the core nuance Helena misses. Testifying to facts ≠ positioning oneself as a moral arbiter. Nora’s narration isn’t just evidentiary; it’s a performative act of condemnation, where her past *does* complicate her authority.
  5. **Helena (-1)**: Her point about Nora’s reform is fair, but Marcus’s objection (point 6) undermines it. Repayment and walking away mitigate ongoing guilt but don’t resolve the asymmetry in how she frames the narrative *now* (omitting her role while condemning his).
  6. **Marcus (+2)**: He decisively wins this exchange. Nora’s private restitution and silence about her own role create a legitimate conflict: by positioning herself as the *sole* moral accuser while burying her complicity, she controls the narrative to her advantage, undermining pure "truth-telling."

  ### The Missing Distinction
  Helena and Marcus never explicitly distinguish between **truth-telling as factual disclosure** and **truth-telling as moral performance**. Helena defends Nora’s right to *disclose facts* (which is unassailable), while Marcus critiques Nora’s right to *occupy the moral high ground* while airbrushing her past. The unresolved tension is whether Nora can separate these acts: could she expose Felix’s fraud *without* positioning herself as his unimpeachable moral adversary? The debate hinges on this unstated question of narrative framing versus factual revelation.

  This distinction is crucial for your novel—it defines Nora’s voice. Is she a repentant whistleblower acknowledging her flaws, or a self-righteous avenger rewriting history? Marcus’s points highlight the risk of the latter, which Helena’s defense doesn’t fully address.
