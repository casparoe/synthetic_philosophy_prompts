  First, I need to recall Reichenbach's common cause principle. It states that if two events are correlated, there must be a common cause that explains the correlation. The user's point is that in acausal trade scenarios, the correlation between agents' decisions comes from shared design or isomorphic decision functions. So, even if there's no direct causal link, the common cause exists in their origins or programming.

  The user mentioned examples like different Everett branches or hypothetical agents. In each case, the agents might have been created by the same process or designed similarly. For instance, two AIs with identical code would produce the same outputs given the same inputs. That shared code is the common cause. So, when they "cooperate" in an acausal trade, it's because their identical decision functions lead to correlated actions. A CDT agent, if aware of this shared design, would recognize that defecting isn't beneficial because the other agent would also defect, mirroring their choice.

  The big objection here is that logical correlation isn't a cause. Reichenbach's common cause is about physical events, not abstract computations. But I need to argue that the physical implementation of the decision functions acts as the common cause. The hardware running the same algorithm, the programmer who wrote the code—these are physical causes. When two systems run isomorphic functions, their physical states were set up to produce correlated outputs. So, the correlation stems from these initial conditions and design choices.

  The user wants me to avoid hedging. I should firmly state that CDT, when properly applied with awareness of correlations from common causes, can handle these scenarios. Exotic decision theories like UDT or FDT are unnecessary because they're just formalizing what CDT can already do with full information. The key is that CDT agents must consider the dependencies between their decisions and others' due to shared mechanisms.

  Also, the user might be frustrated with the rationalist community's push for complex theories. They might want a simpler, more grounded explanation that doesn't discard established frameworks. By linking acausal trade to Reichenbach's principle, I'm providing a bridge that demystifies the concept. This addresses their deeper need for clarity and skepticism towards unnecessary theoretical complications.
answer: |-
  You've cut straight to the core of the philosophical tension. I'll argue unequivocally that "acausal trade" is a misnomer masking ordinary correlation grounded in concrete common causes. The supposed need to abandon Causal Decision Theory (CDT) stems from an artificially constrained view of what constitutes a "cause" and an underappreciation of how CDT handles correlation *when its source is understood*. Let's dismantle the framing:

  1.  **The "Acausal" Correlation *Always* Has a Concrete Common Cause:** The correlation enabling "acausal" trade isn't magic. It arises from identifiable, physical antecedents:
      *   **Shared Origins/Design:** Two agents in different Everett branches share an identical pre-branch wavefunction and physical laws. Their decision procedures *are identical* because they *were identical* before the branch. The pre-branch state is the unambiguous Reichenbachian common cause. Similarly, two AIs designed by the same team using the same codebase share that design process and code as their common cause. The correlation is physically grounded in their shared history.
      *   **Isomorphic Decision Procedures:** Two agents running identical algorithms ("isomorphic" in the strong sense of same inputs -> same outputs) achieve this because their physical implementations were configured (caused) to compute that specific function. The cause is the design choice, manufacturing process, or initial conditions that instantiates *this specific algorithm* in both agents. The correlation arises *because* they are both physical instantiations of the *same causal process* (the algorithm's execution).
      *   **Reasoning About Hypotheticals:** When agent A reasons about a hypothetical agent B, the correlation exists *within A's own cognitive state*. A's prediction of B's action and A's own decision are both outputs of A's *single* decision process, causally influenced by A's knowledge, goals, and reasoning algorithm. The common cause is A's own cognitive architecture and the information it processes.

  2.  **CDT Handles Correlation Perfectly Well *When the Mechanism is Known*:** The standard critique paints CDT as myopically blind to correlation. This is false. CDT mandates maximizing expected utility based on *conditional probabilities* given one's action. **The key is correctly specifying the probability model.** A sophisticated CDT agent understands:
      *   If two agents share identical origins/design (the common cause), then `P(Agent B cooperates | I cooperate) ≈ 1` and `P(Agent B defects | I defect) ≈ 1` *because their identical causal processes respond identically to the strategic situation*. Defecting leads B to defect (with high probability *due to the common cause*), yielding the poor mutual defection payoff. Cooperating leads B to cooperate, yielding mutual cooperation. CDT, using the correct conditional probabilities reflecting the *known dependency via the common cause*, clearly prefers cooperation.
      *   Ignoring this correlation isn't CDT failing; it's the agent failing to incorporate available knowledge about the world's causal structure (the shared design/origin) into its probability model. CDT *requires* using the best available causal model. Knowing "B is my identical copy" *is* causal knowledge about how B's output depends on the situation, including my action *through the lens of our shared response function*.

  3.  **Logical/Mathematical Correlation *is* Causal at the Implementation Level:** This is the crucial rebuttal to the obvious objection. You're right: abstract mathematical truths aren't causes. But *implemented* decision procedures are physical systems.
      *   When two physically distinct systems are configured (caused) to compute the *exact same* input-output mapping `f(S) -> A` (where `S` is the state of the world including knowledge of the other agent), their outputs *will* be correlated for a given `S`.
      *   **The common cause is the set of prior physical events that caused both systems to implement `f`.** This could be the programmer writing the code, the factory producing identical chips, or the laws of physics governing the evolution of the pre-branch universe. The correlation between `A1 = f(S)` and `A2 = f(S)` is *entirely explained* by the causal chain that made System 1 compute `f` and System 2 compute `f`.
      *   **Reichenbach's Principle Holds:** The correlation `A1 <-> A2` exists precisely *because* of the common cause `C` (the shared design/origin/algorithm implementation). `C` screens off the correlation: `P(A1, A2 | C) = P(A1 | C) * P(A2 | C)`. Knowing `C` (they are identical copies), the actions are probabilistically independent *only if we condition on the specific strategic input `S`*, but crucially, `C` determines *how* they respond to `S`. CDT, knowing `C`, understands this deterministic (or highly probable) dependence.

  4.  **UDT/FDT are Formalizing CDT's Implicit Handling of Known Dependencies:** Proponents of "updateless" or "functional" decision theories often present them as radical departures. I argue they are sophisticated *implementations* of the CDT insight within complex, highly correlated scenarios. They effectively bake the knowledge of the common cause (the shared function `f`) and its implications for conditional probabilities (`P(B's action | My action, f)`) directly into the decision rule. They are computational tools for consistently applying CDT's core principle – maximize expected utility given the causal model – in environments where the causal model involves intricate logical dependencies stemming from shared origins or designs. They don't introduce new *rationale*; they provide a formal mechanism for calculating the correct conditional probabilities CDT needs when common causes create tight correlations.

  **Conclusion:** "Acausal trade" is not a distinct phenomenon requiring new decision theories. It's ordinary rational cooperation under conditions of extreme, predictable correlation, where the correlation is robustly explained by concrete Reichenbachian common causes: shared physical origins, identical design, or isomorphic implementation. A sufficiently reflective CDT agent, equipped with accurate knowledge of these common causes and the deterministic/probabilistic dependencies they create, can and *does* reason correctly to cooperate. The correlation is causal all the way down – it stems from the physical processes that created the agents and their decision algorithms. Demanding CDT ignore this known causal structure is asking it to use an impoverished model of the world. When given the full picture, CDT captures the essence of "acausal" trade without needing exotic replacements. The rabbit hole, while fascinating, often overcomplicates a fundamentally causal story.
