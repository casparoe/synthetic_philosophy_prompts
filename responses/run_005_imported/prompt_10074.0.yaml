  Okay, the user has shared a detailed excerpt from Brouwer's lecture on intuitionism. They're struggling with why Brouwer rejects the law of excluded middle in this specific case about π-3's decimal expansion. 

  Hmm, this is a deep philosophical question about mathematical truth. The user seems mathematically literate (they tracked down primary sources!) but new to intuitionism. Their confusion centers on why "either the pattern appears infinitely often or it doesn't" isn't self-evident. 

  Let me reconstruct Brouwer's argument step by step. First, he constructs a correspondence γc that requires knowing whether certain digit pairs in π-3 occur infinitely often. The footnote claims that assuming this must be true or false relies on tertium non datur (excluded middle). 

  The key insight is that for intuitionists, mathematical truth isn't pre-existing - it's constructed. When Brouwer says "there's no ground for believing" we can decide this, he means we lack any procedure to actually build: 
  - Either a proof that it occurs infinitely often (by constructing an infinite sequence of such pairs)
  - Or a proof that it doesn't (by deriving contradiction from the assumption that such a sequence exists)

  The user's analogy to "hard open problems" is telling. Classical mathematicians would agree this is merely unsolved, but Brouwer is making a stronger claim: without a constructive method to verify or refute it, the statement may not even be meaningful. 

  That footnote about the "set of all mathematical properties" is crucial. Brouwer sees excluded middle as smuggling in Platonism - the idea that all mathematical truths exist independently of our proofs. His "wider range" jab means this assumption is more radical than even set theory axioms. 

  I should emphasize the constructive alternative: an intuitionist would only accept "P is true" if we can exhibit P, and "not P" only if assuming P leads to absurdity. Mere inability to prove P doesn't make not P true for them. 

  The user might benefit from a simpler example. Consider "there are seven consecutive 7s in π's decimal expansion." Classically, this is either true or false. But intuitionistically, until we either find such a sequence or prove its impossibility, the disjunction has no content. 

