  Had a whole two-hour argument about this with my friend Jo last night over pizza and neither of us budged, so I want a third opinion. We'd both just read Frank Ramsey's "Epilogue" essay (the one he apparently read to the Apostles, which came out after he died in that Foundations of Mathematics essay collection), where he basically refuses to feel small just because the universe turned out to be physically enormous - his whole point is that his mental picture of the world is drawn in perspective rather than to scale, so people, conversation, and affection dominate the foreground no matter how tiny they are next to the stars, and he says he's totally unbothered by humanity eventually dying out once the sun cools or entropy finishes its work, since none of that touches what actually makes the present worth living.

  So here's what we were fighting about. Jo says that if you take Ramsey's attitude seriously, he'd have zero patience for longtermism and "astronomical waste"-style arguments (Bostrom, Toby Ord, the whole "there could be trillions of future people so reducing x-risk is basically the only thing that matters" line) - to her it's the exact same bigness-equals-importance move he spent that essay mocking, just applied to time instead of space. I said no, the guy basically invented subjective expected utility theory and was a weird-but-genuine utilitarian of some stripe, so he'd probably take the expected-value math completely seriously even while rolling his eyes at the "cosmic sublime" packaging people wrap around it today. Can you actually settle this properly - reconstruct as carefully as you can what Ramsey specifically (not "generic 1920s utilitarian") would plausibly say if someone walked him through the astronomical-waste argument for prioritizing existential risk. I'd like you to deal with both his emotional/rhetorical stance in the Epilogue and how well or badly it sits alongside his more technical decision-theory commitments, and please flag honestly where his actual writing just underdetermines the answer versus where your fairly confident.
