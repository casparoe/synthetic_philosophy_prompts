answer: |-
  Here’s a toast that navigates Lewis’s framework with precision for the experts, warmth for family, and an honest resolution to the arbitrariness concern—all in under four minutes. The key is framing the *origin* of their coordination as arbitrary (per Lewis) while showing how its *meaning* transcends that very arbitrariness:

  ---

  **(Raising glass, warm smile)**  
  "Everyone, if I could have your attention… For those who don’t know me, I’m [Your Name], the bride’s sibling, philosophy major, and—for tonight only—very nervous David Lewis explainer. *(Light laughter)*. But seriously: [Sister] and [Partner], this is for you both.  

  **Part 1: The Setup (Accessible Lewis for All)**  
  "You’ve all heard how these two met: every week, same lecture hall, same two seats by the radiator. No discussion, no planning—just showing up early, claiming those spots, week after week. They’ve joked it was their ‘coordination equilibrium.’ Let me unpack that quickly:  
  Imagine two people who *could* sit anywhere… but they both *want* to sit together. Problem is, they haven’t talked about *where*. So they scan the room. What’s obvious? What stands out? For them, it was those radiator seats—warm, good sightlines. Once they both *noticed* the other choosing it, and *noticed* each other noticing… well, suddenly, sitting there just made sense. It became their quiet little routine. Unspoken. Automatic.  

  **Part 2: The Twist (Lewis for the Experts)**  
  "Now, for the philosophers and linguists here: yes, this fits Lewis’s *Convention* perfectly. A regularity in behavior, sustained because both preferred *coordinating* over not—no matter the seats! Those radiator spots were **salient**—they stood out. The pattern became **common knowledge**: each knew the other knew it was ‘their thing.’ And it set a **precedent**: week one reinforced week two, and so on. Crucially, Lewis would note this was **arbitrary**. Had those seats been taken week one? Maybe the back row, or that windowsill, could’ve worked just as well. Any spot could’ve become ‘theirs’ if it caught on first.  

  **Part 3: The Pivot (Resolving Arbitrariness)**  
  "But here’s what Lewis *couldn’t* predict—and what makes tonight real, not just theoretical.  
  That arbitrariness? It only applies to *how* their coordination *started*. Not to *who they are*, or *what it became*.  
  Because the moment those seats *were* taken? That’s when everything changed. Sharing the windowsill wasn’t just another arbitrary option. It was **salience redefined**. Not by the radiator’s warmth, but by the warmth between them. The precedent wasn’t about seats anymore—it was about *choosing each other*, explicitly. What started as convenience became intention. What was replaceable became irreplaceable.  

  **Part 4: The Toast (Heartfelt Resolution)**  
  "So yes, their story begins with philosopher’s precision: two people finding equilibrium in a crowded room. But it *culminates* in something deeper. That initial coordination? It was a vessel—a perfectly arbitrary vessel—for something utterly non-arbitrary: their recognition, their laughter, their ‘click.’ The convention gave them the *chance*; they filled it with meaning no other two people could.  
  That’s why we’re here tonight. Not because any radiator seat would do… but because when they landed on theirs, they built a home.  

  **To [Sister] and [Partner]:** May your life together be rich with common knowledge, deepened by every precedent, and forever salient in each other’s eyes. Cheers!"  

  ---

  ### Why This Works  
  1. **Precision for Experts**:  
     - Explicitly names Lewis’s criteria (**salience, common knowledge, precedent, arbitrariness**).  
     - Uses the radiator seats → windowshift shift to demonstrate how salience can evolve beyond physical cues.  
     - Directly acknowledges arbitrariness as constitutive *of the initial regularity* (satisfying Lewis scholars).  

  2. **Clarity for Family**:  
     - Explains concepts in relatable terms ("scanning the room," "quiet little routine," "vessel").  
     - Uses the story itself as the primary metaphor (no jargon without grounding).  
     - Focuses on universal themes: inside jokes, shared moments, intention vs. chance.  

  3. **Resolves the Arbitrariness Worry**:  
     - **Key Move**: Limits arbitrariness to the *origin* ("vessel," "how it started").  
     - Elevates the *meaning* they created as non-arbitrary ("filled it with meaning no other two people could").  
     - Uses the windowsill moment as the turning point where arbitrariness ends and intention begins.  
     - Affirms that while the *equilibrium* was replaceable, *their connection* was not.  

  4. **Tone**:  
     - Warmth via focus on *their* story ("built a home," "laughter," "click").  
     - Humor disarms tension ("nervous David Lewis explainer," "radiator’s warmth vs. warmth between them").  
     - Ends on emotional sincerity, not academic cleverness.  

  The toast rewards close readers by rigorously applying Lewis’s framework, while offering family a poignant love story—and crucially, transforms the "arbitrariness" clause from a threat to the relationship into a celebration of how they transcended it.
