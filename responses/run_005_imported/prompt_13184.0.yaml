answer: |-
  Here's a new example that cleanly distinguishes Markovits' and Arpaly's views, using a **whistleblower scenario**:

  ### The Case: Lena the Vengeful Whistleblower
  Lena discovers that her company is dumping toxic waste into a river, endangering thousands of people downstream. She has long resented her arrogant boss (who orchestrated the cover-up) and sees this as her chance for revenge. **Her sole conscious motivation** is to ruin her boss's career. She leaks the evidence to regulators, fully aware this will stop the poisoning and save lives, but she explicitly **disavows** any moral concern for the victims ("I couldn't care less about those people; I just want to destroy my boss"). The action is objectively right (it prevents harm), and Lena knows the harm is occurring, but her motivating reason is purely personal vengeance.

  ---

  ### Analysis:
  1. **Arpaly's View: MORALLY WORTHY**  
     Arpaly requires the agent's *motivating desire* to be *responsive* to the right-making features. Here, Lena's desire for revenge **aligns** with the right-making feature (preventing harm to the public). Her action is non-accidentally right *because* her vengeful motive tracks the harm being caused: she acts *to expose the wrongdoing that creates the harm*. Crucially, Arpaly doesn't require Lena to *endorse* the moral verdict—she explicitly rejects it, but her psychology is still responsive to the moral facts. Like Huck Finn, her "bad" motive (vengeance) is contingently tied to the right outcome.

  2. **Markovits' View: NOT MORALLY WORTHY**  
     Markovits requires the agent to be **motivated by the right-making reasons themselves**. Here, the right-making reason is *preventing harm to innocent people*. Lena is **not motivated by this consideration at all**; she openly scorns it. Her motivating reason—revenge against her boss—is distinct from the moral justification (public safety). Even though she *knows* her action will prevent harm, she acts *despite* this, not *because* of it. For Markovits, motivation by coincidental or alien reasons (like vengeance) lacks moral worth, even if it aligns with the right outcome.

  ---

  ### Key Divergence:
  The disagreement centers on **whether the agent's *actual motivating reason* must match the *right-making feature*** (Markovits) or if **mere psychological responsiveness** suffices (Arpaly).  
  - Markovits demands **motivational identity**: the agent must act *for* the normative reason (e.g., "I do this *because* it saves lives").  
  - Arpaly accepts **motivational alignment**: the agent's desire must *track* the normative reason, even if framed non-morally (e.g., "I do this *to spite my boss*" [which implicitly requires the harm to exist]).  

  In Lena's case, her action is **responsive but not reason-driven**, creating the split:  
  ✅ Arpaly: Her desire for revenge *depends* on the harm (making it responsive).  
  ❌ Markovits: She isn’t moved *by the moral fact of the harm itself* (making it alien to her motivation).

  ---

  ### Why this works:
  - It avoids Huck Finn’s conflict (conscious belief vs. subconscious sympathy) by giving Lena **explicit knowledge** of the harm but **explicit rejection** of moral concern.  
  - It highlights Arpaly’s focus on **underlying desires** vs. Markovits’ focus on **surface reasons**.  
  - The right-making feature (preventing harm) is unambiguous, isolating the role of motivation.
