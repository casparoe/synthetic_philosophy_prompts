  ## MEMO: Co-op Board Election Method Recommendation  
  **To:** Board of Directors  
  **From:** Elections Committee  
  **Date:** October 26, 2023  
  **Subject:** Ensuring Fairer Elections - Moving Beyond Basic RCV  

  ### Background & The Current Issue
  This year’s adoption of Ranked-Choice Voting (RCV) aimed to solve vote-splitting in our 3+ candidate races. While it achieved that goal, a significant concern emerged: the elected Treasurer won under RCV’s instant-runoff rules, but a pairwise comparison revealed a majority preferred Candidate X (eliminated in Round 2) over the winner. This "Condorcet loser" outcome (where the winner loses head-to-head against another candidate) undermines confidence for many members. We must address this legitimate concern.

  ### Engaging Arrow's Impossibility Theorem
  Board President [Name] rightly notes Arrow’s theorem proves *no* ranked voting system can satisfy all mathematical fairness criteria (e.g., unanimity, independence of irrelevant alternatives, non-dictatorship) simultaneously. **This does not mean all systems are equally flawed.** Arrow’s theorem highlights inherent trade-offs, not futility. Our duty is to choose the system *best aligned with our co-op’s values* – specifically, maximizing the chance the winner reflects the broadest consensus and beats all others head-to-head where possible. Sticking with a known-flawed system because "nothing’s perfect" neglects our responsibility to improve.

  ### Evaluating Our Options
  1.  **Current Method (RCV / Instant Runoff):**  
      *   **Strengths:** Simple to understand/execute, eliminates vote-splitting, ensures winner has broad support (though not necessarily majority preference in all pairs). Familiar now.  
      *   **Weakness:** Can eliminate a candidate who is the *pairwise majority favorite* against others early (as happened), leading to results that feel undemocratic to many.  
      *   **Strongest Case to Keep:** Simplicity and momentum. After investing in RCV, changing *again* causes disruption. It solved our initial problem (splitting), and Arrow’s theorem reminds us *any* new system has theoretical flaws. If pairwise conflicts are rare, RCV may suffice.

  2.  **Recommended Method: Ranked Pairs (Condorcet Method)**  
      *   **How it Works:** Ballots remain identical (ranked choices). Tally *all possible head-to-head matchups* (A vs B, A vs C, B vs C, etc.). Record each pairwise victory. "Lock in" these victories, starting with the largest majority win, then the next largest, and so on, skipping any that would create a logical contradiction (e.g., A beats B, B beats C, but C beats A). The candidate at the top of the resulting "chain" wins.  
      *   **Why It’s Better:** It *guarantees* the election of a "Condorcet Winner" (a candidate who beats *every* other head-to-head) if one exists – resolving the core complaint this year. If no Condorcet winner exists (a true cycle), it resolves cycles robustly by honoring the strongest majorities first. It directly reflects the pairwise preferences expressed by voters.  
      *   **Addressing Complexity:** Tallying pairwise counts is straightforward (spreadsheet-friendly). The "locking in" step sounds complex but is logical and deterministic. Free online tools (e.g., OpaVote, PrefVote) automate this. For 34 ballots, verification is manageable.  
      *   **Why Not Another Condorcet Method?** Ranked Pairs is highly transparent, resistant to strategic voting, and meets strong fairness criteria. Alternatives like Schulze are excellent but slightly less intuitive to explain.

  ### Recommendation
  **The Elections Committee recommends adopting the Ranked Pairs method for future Co-op Board elections.**  

  While RCV solved vote-splitting, its failure to ensure the winner is the pairwise majority favorite against key competitors caused significant division. Ranked Pairs directly addresses this flaw by prioritizing broad, head-to-head acceptability. It uses the same ranked ballots we now use, minimizing voter retraining. Arrow’s theorem reminds us no system is utopian – Ranked Pairs can encounter ambiguities in rare, deep cycles – but it demonstrably better fulfills our goal of electing the candidate with the strongest overall mandate against their peers. It is the most reliable way to achieve consensus outcomes and restore trust.

  ### Next Steps
  1.  Committee will prepare a 1-page voter guide explaining Ranked Pairs with a simple example.  
  2.  We will test the method using this year’s ballots (anonymized) to demonstrate its outcome publicly.  
  3.  We propose a trial run for one position in the next election, with a post-election review.  

  Adopting Ranked Pairs demonstrates our commitment to responsive, mathematically robust self-governance.

  **Attachment:** Simplified Example of Ranked Pairs Tallying (1 page)  

  ---

  **Key Rationale for Structure & Content:**  
  *   **Problem-First:** Immediately validates member concerns to build trust.  
  *   **Arrow's Theorem Engaged:** Acknowledges its truth while rejecting fatalism, reframing it as a guide for choosing *better* trade-offs.  
  *   **Balanced RCV Case:** Honestly presents RCV's strengths (simplicity, solved splitting) as the main counter-argument.  
  *   **Clear Recommendation:** Ranked Pairs is named explicitly and justified based on the *specific flaw* experienced (Condorcet efficiency).  
  *   **Actionable & Practical:** Addresses complexity concerns with concrete solutions (tools, manageable scale) and proposes phased implementation.  
  *   **Concise & Decisive:** Fits on one page by focusing on core arguments, avoiding excessive technical jargon, and ending with clear next steps.  
  *   **Transparency:** Offers to demonstrate the method using real (anonymized) data.
