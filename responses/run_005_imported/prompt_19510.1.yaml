  Okay, this has kind of taken over my brain the last two weeks. I'm on the elections committee for my housing co-op (34 units), and this year we tried ranked-choice voting for the first time in the board election, to stop the vote-splitting we always got under plain plurality. Our new treasurer won the instant-runoff tally, but a bunch of us noticed that if you look at the ballots pairwise, a majority of members actually preferred the guy who got eliminated in round two over her, so half the building thinks the election was rigged. The other half, led by our board president (who fell down a wikipedia hole on Arrow's impossibility theorem), says its mathematically proven that no ranked system is ever fully fair, so we shouldn't bother fixing anything and should just keep doing RCV forever. I have to write the committee's memo to the board before next month's meeting -- can you draft it (a page, not ten)? It needs to actually recommend one specific voting method going forward, with real reasons, engage seriously with the Arrow's-theorem-so-why-bother argument instead of waving it off, and be honest about the strongest case for just sticking with RCV anyway.
