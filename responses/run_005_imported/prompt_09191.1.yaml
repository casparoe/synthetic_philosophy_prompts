  However, note that the bonus is only awarded if she randomizes. When she has the signal, she cannot in good faith randomize because she knows which village is more needy. And if she were to randomize anyway, she would get 10 with probability 0.5 and 0 with probability 0.5, plus 6, which is 0.5*10+0.5*0+6=11, which is the same as without signal. But she wouldn't randomize because 10 > 0.5*10+0.5*0+6=11? No, 10<11, so she would randomize even with the signal? But then she would get 11.

  So to prevent that, we must assume that the bonus is only available if she randomizes AND she does not know the state. That is, the bonus is for being fair in the face of uncertainty. If she knows the state and still randomizes, she doesn't get the bonus.

  Then:
    Without signal: she randomizes and gets 11 (5 from the village need plus 6 bonus).
    With signal: 
          If she randomizes: she gets 0.5*10+0.5*0 = 5 (because she doesn't get the bonus) -> 5.
          If she doesn't randomize: she gets 10.
          So she chooses not to randomize and gets 10.

    Expected utility with signal: 10.

    Without signal: 11.

  So she is worse off with the signal (10 vs 11).

  But is the bonus really part of the utility function? The utility function is defined as:

     U(action, state) = {
          if action is deterministic and matches the state: 10
          if action is deterministic and does not match: 0
          if action is randomized and she does not know the state: 0.5*10 + 0.5*0 + bonus = 5 + bonus
          if action is randomized and she knows the state: then she gets the outcome of the lottery without the bonus: 5
     }

  But note: when she has the signal, she has the option to randomize, but she also has the option to not randomize. She will choose the best action. Without the signal, she only has the options of deterministic actions or randomization. The catch is that the bonus is only available in the absence of the signal. This means that the utility function is not solely a function of the state and the action; it depends on whether she has the signal or not.

  Specifically, the bonus is available only if she does not have the signal. This violates the condition of Good's theorem that the utility function is defined on the state and the action, and does not depend on the information structure.

  Therefore, this is not a counterexample within the strict conditions of Good's theorem.

  Conclusion: It is very hard to find a counterexample that does not involve either:
     - A utility function that depends on the information structure (what the agent knows)
     - The experiment having a direct cost (either in utility or in resources)
     - The state of the world being influenced by the act of observation

