   Since 10 < 11, she is worse off in expectation for having the information.

   Why this violates Good's theorem's conditions: 
     - The utility function is not just a function of the state and the action. It also depends on whether the agent has the information. Specifically, the bonus of 6 is only awarded when she takes the action "flip a coin" and she does not have the information. 
     - Therefore, the utility function in the world with information is not the same as in the world without information.

   Verdict: This is not a genuine exception to Good's theorem because the conditions of the theorem (particularly, that the utility function is defined only on the state and the action) are not met.

   However, it does illustrate that in a broader sense, information can have a negative value if the agent has a preference for fairness that can only be satisfied in the absence of information.

   For the side question: In game theory, the strategic value of ignorance arises because the information structure affects the equilibrium of the game. For example, in a repeated game, a player who does not observe the other's actions might be able to cooperate more effectively. This is a different mechanism because it involves multiple agents and equilibrium effects. However, the root cause is similar: information can restrict the set of available strategies in a way that is detrimental. In the single-agent case with state-contingent utility, we are not in a game-theoretic setting.

   Therefore, while the single-agent example above and the game-theoretic examples both involve the value of ignorance, the game-theoretic ones are driven by strategic interaction and equilibrium selection, which is a genuinely different mechanism.
