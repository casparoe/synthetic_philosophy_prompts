  ### **Actual Counterexample: Utility Depends on Knowledge State**  
  **States:** \(S_1\), \(S_2\) (each \(p = 0.5\)).  
  **Actions:** \(A\), \(B\).  
  **Monetary payoffs:**  
  - \(A\): \(+10\) if \(S_1\), \(-10\) if \(S_2\).  
  - \(B\): \(-10\) if \(S_1\), \(+10\) if \(S_2\).  

  **Utility function:**  
  - Total utility = Monetary payoff + "Peace of mind" bonus.  
  - **Peace of mind:**  
    - \(+5\) utils if Alex acts *without knowing the state*.  
    - \(0\) utils if Alex knows the state when acting.  
  *(This captures anxiety from knowing risks or counterfactuals.)*  

  **Without information:**  
  - Alex must choose blindly.  
  - Expected monetary payoff for any action: \(0\).  
  - But receives peace of mind bonus: \(+5\).  
  - **Total expected utility: \(0 + 5 = 5\).**  

  **With information:**  
  - In \(S_1\): Alex picks \(A\) → monetary \(+10\), no bonus → utility \(10\).  
  - In \(S_2\): Alex picks \(B\) → monetary \(+10\), no bonus → utility \(10\).  
  - **Total expected utility: \(10\).**  

  **Now, adjust payoffs to make information harmful:**  
  - Change monetary payoffs to \(\pm 4\) (instead of \(\pm 10\)):  
    - Blind choice: \(0\) (monetary) \(+ 5\) (bonus) = \(5\).  
    - With information: \(4\) (no bonus) → expected utility \(4\).  
  - **Result: \(4 < 5\) → worse off with information!**  

  ### **Why This Violates Good's Theorem**  
  Good's theorem assumes:  
  1. **Utility depends only on the state and action** (not on the agent's knowledge state).  
  2. **The action set is identical** with or without information.  
  3. **No indirect costs/constraints** from observing information.  

  Here:  
  - **Utility violation:** The "peace of mind" bonus depends on whether Alex acts in ignorance. Utility is not purely a function of \((state, action)\); it includes a term for the agent's epistemic state.  
  - **Action set violation?** Actions are formally the same, but the peace of mind bonus is only accessible when acting without information. This functionally changes the utility landscape.  

  **Verdict:** This is **not a genuine exception** to Good's theorem. Instead, it violates a core premise (utility independence from the information structure). The theorem holds if utility is strictly outcome-dependent, but fails here because utility incorporates a "value of ignorance" component.  

