  Again, better.

  How to make it worse? We change the utility function to include regret. Suppose the newsvendor feels regret when he has unsold newspapers. Specifically, if he orders more than demand, he feels a regret cost that is proportional to the overage.

  But without information, he doesn't know the demand, so he doesn't feel regret? Or we can define the utility to be the profit minus a regret term that is only incurred when he has information.

