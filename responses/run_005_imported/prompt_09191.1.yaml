  I found a reference to a counterexample by Mark Machina: the agent has a utility function that is not separable across states, specifically, a non-expected utility agent. But we are assuming expected utility.

  Finally, I found a counterexample that fits the bill: the "Three Prisoners" problem in a decision-making context.

  Three Prisoners Problem (decision-theoretic version):

  Three prisoners, A, B, and C, are on death row. The governor will pardon one at random. The probability of being pardoned is 1/3 for each. The warden knows who is pardoned but cannot tell. Prisoner A asks the warden to name one of the others who will be executed. The warden says B will be executed. Now, what is the probability that A is pardoned? It becomes 1/3, while the probability that C is pardoned becomes 2/3.

  But how does this make A worse off in a decision problem?

  Let's make it a decision problem for prisoner A.

  Suppose that after the warden's information, prisoner A is given a chance to exchange fates with prisoner C. If he exchanges, he gets the pardon if C is pardoned, and dies if C is not.

  Without any information, prisoner A's chance of being pardoned is 1/3. If he exchanges with C, his chance becomes the probability that C is pardoned, which is 1/3. So he is indifferent.

  After receiving the information that B will be executed, if he doesn't exchange, his chance of being pardoned is 1/3. If he exchanges, it becomes 2/3. So he will exchange and get 2/3 chance.

  So the information is beneficial.

