           In state B: expected in state B: 5
           So overall: 0.5*5 + 0.5*5 = 5, plus the bonus of 6 -> 11.
     - So she chooses to flip a coin and gets 11.

   With (costless) observation that reveals the state:
     - In state A: 
          - If she helps A: 10.
