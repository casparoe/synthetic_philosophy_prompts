  ### **Final Counterexample: The Lose-Lose Revelation**  
  **States:**  
  - \(S_1\) (probability \(0.5\)), \(S_2\) (probability \(0.5\)).  

  **Actions:**  
  - \(A\): Pays \(+10\) if \(S_1\), \(-10\) if \(S_2\).  
  - \(B\): Pays \(-10\) if \(S_1\), \(+10\) if \(S_2\).  
  - \(C\): Pays \(0\) always.  

  **Utility:**  
  - Monetary payoff only.  
  - **But:** Alex has a psychological quirk: If they observe the state, they *cannot* choose action \(C\). (Perhaps knowing the state induces overconfidence, eliminating "safe" options.)  

  **Without information:**  
  - Expected utility:  
    - \(A\): \(0.5 \times 10 + 0.5 \times (-10) = 0\).  
    - \(B\): \(0.5 \times (-10) + 0.5 \times 10 = 0\).  
    - \(C\): \(0\).  
  - Alex chooses \(C\) for a guaranteed \(0\).  

  **With information (free look):**  
  - Alex cannot choose \(C\).  
  - In \(S_1\): Chooses \(A\) (utility \(10\)).  
  - In \(S_2\): Chooses \(B\) (utility \(10\)).  
  - **Expected utility: \(0.5 \times 10 + 0.5 \times 10 = 10\).**  

  **Result:**  
  - Blind choice: Utility \(0\).  
  - With information: Utility \(10\).  
  **Still not worse!**  

