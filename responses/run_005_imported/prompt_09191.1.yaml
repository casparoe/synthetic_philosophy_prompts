  Below is a fully specified decision scenario that illustrates a violation of the naive interpretation of Good's theorem—where a Bayesian agent ends up worse off in expectation for observing costless information. The example avoids direct costs, risks, or utility dependencies on the act of observation itself. Instead, it exploits a mismatch between the agent's belief-dependent utility and the information structure.

  ### **Scenario: The Regret-Averse Investor**
  **Agent:** Alex, a Bayesian investor who maximizes expected utility but experiences *regret*.  
  **States of the world (market performance):**  
  - \(S_1\): Market rises (probability \(p = 0.5\)).  
  - \(S_2\): Market falls (probability \(1-p = 0.5\)).  

  **Actions:**  
  - \(A\): Invest in stocks.  
  - \(B\): Hold cash.  

  **Utility function:**  
  - Utility depends on both the **outcome** (monetary gain/loss) and **counterfactual regret** (disutility from knowing a better action was available).  
  - Monetary payoffs:  
    - If market rises (\(S_1\)): Stocks yield \(+10\), cash yields \(0\).  
    - If market falls (\(S_2\)): Stocks yield \(-10\), cash yields \(0\).  
  - Regret adjustment:  
    - After choosing an action, Alex experiences regret if a better action *existed* in hindsight.  
    - Regret reduces utility by **8 utils** if the agent *knows* they chose suboptimally.  
  - **Total utility** = Monetary payoff - Regret (if applicable).  

  **Key detail:**  
  - Regret only manifests if Alex *knows the state* when acting. If Alex acts without knowing the state, regret is not incurred (since counterfactuals are ambiguous).  
  - **Without information**, Alex cannot compare outcomes deterministically, so regret is neutralized.  

  ---

  ### **Decision Without Information (Blind Choice)**  
  Alex has no information and must act on priors:  
  - **Expected utility of \(A\) (invest):**  
    - \(0.5 \times (10) + 0.5 \times (-10) = 0\).  
  - **Expected utility of \(B\) (hold cash):**  
    - \(0.5 \times (0) + 0.5 \times (0) = 0\).  
  - Alex is indifferent. Suppose they randomize: 50% choose \(A\), 50% choose \(B\).  
  - **Expected utility (blind):**  
    - If \(S_1\): Half choose \(A\) (get \(+10\), no regret), half choose \(B\) (get \(0\), no regret).  
      - Average utility: \(0.5 \times 10 + 0.5 \times 0 = 5\).  
    - If \(S_2\): Half choose \(A\) (get \(-10\), no regret), half choose \(B\) (get \(0\), no regret).  
      - Average utility: \(0.5 \times (-10) + 0.5 \times 0 = -5\).  
    - **Overall expected utility:** \(0.5 \times 5 + 0.5 \times (-5) = 0\).  

  ---

  ### **Decision With Information (Free Look at Market Outcome)**  
  Alex costlessly observes the true state before acting:  
  - **Case 1: Observes \(S_1\) (market rises)**  
    - If Alex chooses \(A\): Gets \(+10\), no regret (best action).  
    - If Alex chooses \(B\): Gets \(0\), but knows \(A\) would have yielded \(+10\) → regret \(-8\).  
      - Utility = \(0 - 8 = -8\).  
    - Alex maximizes utility by choosing \(A\) → utility = \(+10\).  
  - **Case 2: Observes \(S_2\) (market falls)**  
    - If Alex chooses \(A\): Gets \(-10\), and knows \(B\) would have yielded \(0\) → regret \(-8\).  
      - Utility = \(-10 - 8 = -18\).  
    - If Alex chooses \(B\): Gets \(0\), no regret (best action).  
    - Alex maximizes utility by choosing \(B\) → utility = \(0\).  
  - **Expected utility (with information):**  
    - \(0.5 \times 10 + 0.5 \times 0 = 5\).  

