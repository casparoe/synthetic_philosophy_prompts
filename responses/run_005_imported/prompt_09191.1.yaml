    He orders 2.
    If demand=0: profit = -2, and regret = R * (2 - 0) = 2R? 
    So total utility = -2 - 2R.
    If demand=2: profit = 4, regret = 0? because there is no overage? Or we define regret as the difference between the profit he got and the maximum profit he could have achieved in that state.

  In that state, if he had ordered 0, he would have made 0. But he made 4, so no regret? Or if he ordered 2, which was exactly the demand, then no regret.

  But if we define regret as the difference between the profit obtained and the maximum profit possible in that state, then:

  In state demand=0:
    Maximum profit is 0 (by ordering 0).
    If he ordered 2, he gets -2, so regret = 0 - (-2) = 2? 
    Then utility = profit - regret = -2 - 2 = -4.

  In state demand=2:
    Maximum profit is 4 (by ordering 2).
    If he ordered 2, he gets 4, regret=0, utility=4.

  Without information, he must choose without knowing the state. If he orders 2:
     utility = 0.5 * (-4) + 0.5 * 4 = 0.

  But without information, he could also order 0:
     utility = 0 in both states (because in state demand=0: profit=0, regret=0? because he could have achieved 0 by ordering 0; in state demand=2: profit=0, but the maximum he could have made is 4, so regret=4, then utility=0-4=-4). 
     So expected utility for ordering 0: 0.5*0 + 0.5*(-4) = -2.

  So he will choose to order 2 and get 0.

  With information:
    If demand=0: he orders 0 -> utility = 0 (profit=0, and regret=0 because that's the best he can do).
    If demand=2: he orders 2 -> utility=4 (profit=4, regret=0).

    Expected utility = 0.5*0 + 0.5*4 = 2.

  Still better.

  I recall a counterexample from the literature: the "paradox of the absentminded driver" but that is about inconsistent planning.

  After research, I remember that one counterexample is when the agent's prior beliefs are inconsistent with the true data-generating process. But the theorem assumes the agent updates correctly.

  Another counterexample is when the experiment is informative about something that the agent would rather not know because it affects his utility in a negative way. For example, learning that one has a terminal illness might cause anxiety even if it doesn't change the treatment.

  But that is a direct disutility from the information, which is a cost.

  We want a costless experiment.

  Here is a different idea: the agent's utility depends on the action and the state, but the state space is not the same as the one the experiment is about. Specifically, we can have a problem where the experiment provides information that is relevant for a decision that is not the one the agent is facing, and that information causes the agent to take an action that is optimal for that decision but has bad consequences in the overall utility.

  But the agent should be able to ignore irrelevant information.

  Alternatively, consider a scenario with multiple decisions, and the experiment only informs one of them, but the agent is forced to make a commitment that affects future decisions.

  However, Good's theorem is for a single decision.

  I found a known counterexample: the "non-conglomerability" of probability distributions. But that is about improper priors and can lead to the agent being worse off. But we assume a proper prior.

  After careful thought, I present a counterexample from game theory, but note that Good's theorem is for single-agent. However, we can make it a single agent by having the other player's move fixed by nature.

  Scenario: The Bayesian Agent and the Adversarial Nature

  The agent (Alice) is playing against an adversary (Nature) that is not strategic. There are two states of the world, S1 and S2, each with prior probability 0.5.

  Alice chooses an action from {A, B}.

  The adversary (Nature) chooses a move from {X, Y} independently, with probabilities: 
     In state S1: P(X)=1, P(Y)=0.
     In state S2: P(X)=0, P(Y)=1.

  But then the state determines the move of Nature.

  The utility for Alice depends on her action and Nature's move:

     If Alice chooses A and Nature plays X: 10
     If Alice chooses A and Nature plays Y: 0
     If Alice chooses B and Nature plays X: 0
     If Alice chooses B and Nature plays Y: 10

  Without any signal, Alice's expected utility for action A: 
     0.5 * 10 (if S1, Nature plays X) + 0.5 * 0 (if S2, Nature plays Y) = 5.
  Similarly for action B: 0.5 * 0 + 0.5 * 10 = 5.

  So she is indifferent.

  Now, suppose Alice can observe a signal that perfectly reveals the state. Then she can match the state: in state S1 (which means Nature will play X) she chooses A and gets 10, in state S2 (Nature plays Y) she chooses B and gets 10. Expected utility: 10.

  Better.

  To make it worse, we need to have the utility depend on whether she knows the state or not. How about if we introduce a penalty for "discrimination"? 

  Suppose that Alice is running a hiring process and she doesn't want to appear to be using group membership (which is what the state represents) in her decision. If she doesn't know the state, she can claim that her decision is group-blind. If she knows the state, then even if she doesn't use it, she might be accused of discrimination.

  But then we are adding a cost to knowing the state.

  Alternatively, we can have the utility function depend on the action and the state in a way that if she conditions on the state, she gets a lower payment from an external source that values fairness.

  But this is again a cost of information.

  I am considering a scenario from mechanism design: the agent might be better off not knowing private information so that she cannot be held responsible for acting on it. But this is game-theoretic.

  After research, I recall that there is a counterexample when the decision problem is not fixed: specifically, when the set of available actions changes upon receiving the information. 

  But Good's theorem assumes the action set is the same.

  Another idea: the agent might have a preference for randomization. For example, in some ethical dilemmas, the agent might want to flip a coin to decide. But with information, she is forced to choose deterministically, and that leads to a worse outcome in her own utility.

  Let's construct that.

  Scenario: The Fairness Dilemma

  A philanthropist must decide which of two villages, A or B, to help. She can only help one. The villages are identical in her prior. There is a state of the world that indicates which village is more in need, but she doesn't know it. She has a utility function that cares about fairness.

  Utility function:
     If she helps the more needy village, she gets 10.
     If she helps the less needy village, she gets 0.
     Additionally, if she uses a fair randomizing device (like a coin flip) to decide, she gets a bonus of 3.

  Without any signal, she can either:
     Choose village A: expected utility = 0.5*10 + 0.5*0 = 5.
     Choose village B: 5.
     Flip a coin: then with probability 0.5 she helps the more needy village (10) and with probability 0.5 she helps the less needy village (0), and plus the bonus 3. So expected utility = 0.5*10 + 0.5*0 + 3 = 5+3=8.

  So she will flip a coin and get 8.

  Now, suppose she can costlessly observe a signal that perfectly reveals the state (which village is more needy). Then she will choose the more needy village and get 10. But she doesn't get the bonus for randomization because she didn't randomize.

  So expected utility with the signal: 10.

  10 > 8, so she is better off.

  Not worse.

