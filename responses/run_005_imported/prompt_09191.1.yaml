        Exchange with B: similarly, expected utility = 1/3.
        Exchange with C: expected utility = 1/3.

   So he is indifferent.

  After the warden says B will be executed:
     Probability that A is pardoned given B executed = 1/3.
     Probability that C is pardoned given B executed = 2/3.

     If he does nothing: utility = 1 if A pardoned (prob 1/3), 0 if not -> expected utility = 1/3.
     If he exchanges with C: utility = 0.5 if C pardoned (prob 2/3), 0 if not -> expected utility = (2/3)*0.5 = 1/3.

   So he is indifferent again.

   Not worse.

  I am coming to the conclusion that in a single-agent, decision-theoretic setting with a fixed state space and a utility function that doesn't depend on the information structure, Good's theorem holds. The friend's challenge might be referring to settings that violate these conditions.

