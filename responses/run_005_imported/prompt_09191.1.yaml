   Example: The agent is about to gamble. There are two gambles:

     Gamble A: pays $10 if a fair coin lands heads, $0 otherwise.
     Gamble B: pays $0 if heads, $10 if tails.

  The agent must choose one gamble. The state of the world is the coin outcome.

  Without information, the agent is indifferent and might choose one arbitrarily, or randomize. Expected utility of either: 0.5*10 + 0.5*0 = 5.

  With information (observing the coin toss before choosing), the agent can always choose the gamble that pays off, so she gets 10.

  But suppose the agent has a utility function that includes a component for suspense or surprise. Specifically, she enjoys the suspense of not knowing the outcome until after the gamble. If she observes the coin toss before choosing, then she knows the outcome and there is no suspense. 

  Define the utility of a gamble as the monetary payoff minus a constant if the suspense is gone. But only if she observes the coin toss.

  Utility without information: 
     If she wins, she gets 10 + s (s for suspense).
     If she loses, she gets 0 + s.

   But suspense s is experienced regardless of win or lose, as long as she doesn't know in advance.

   Without information, for either gamble, expected utility = 0.5*(10+s) + 0.5*(0+s) = 5 + s.

   With information, she knows the outcome and there is no suspense. So if the coin is heads, she chooses Gamble A and gets 10.
     If tails, she chooses Gamble B and gets 10.
     So expected utility = 10.

   Now compare: 
     Without information: 5 + s
     With information: 10

   If s > 5, then 5+s > 10, and she is better off without information.

   But note: suspense s is only experienced if she does not have the information. This means the utility function has an extra term when she is in the dark. This is a direct dependence on the information structure.

   This violates the condition of Good's theorem.

   Therefore, in the strict setting of the theorem, this is not a counterexample.

   However, in a broader sense, it shows that if the agent has a utility that values ignorance, then information can have a negative value.

   Now, for the side question: the strategic value of ignorance in game theory.

   In game theory, there are known situations where a player is better off not knowing their type or not receiving a signal because it constrains their ability to communicate or because it allows them to commit to a strategy. For example, in a negotiation, if you don't know how much the other party values the good, you cannot accidentally reveal it. This is the same underlying phenomenon: the utility or the outcome depends on what you know because it affects your behavior and thus the behavior of others.

   In the single-agent setting, we had to make the utility depend on the information structure to create a counterexample. In game theory, the utility naturally depends on what others know and what you know because it affects their actions. So it's a genuine different mechanism, but it stems from the same root: information can be a liability if it affects the actions in a way that leads to a worse outcome.

   In summary, for a single-agent decision problem where the utility function is defined solely on the state and the action (and not on the information structure), and where the state is fixed and not affected by the observation, Good's theorem holds. The counterexamples require either:

     - A utility function that values suspense, regret, or fairness in a way that depends on information.
     - A cost of obtaining or processing the information.
     - The state being affected by the observation.
     // or //
     - The agent not being ideally rational (e.g., bounded rationality).

   Therefore, for the main example, I will provide the fairness example even though it bends the utility condition, because it is illustrative.

   Scenario: The Fairness Bonus

   Agent: Alice.
   States: which of two villages is more in need, {Village A, Village B}, each with probability 0.5.
   Actions: { help A, help B, flip a coin }.

