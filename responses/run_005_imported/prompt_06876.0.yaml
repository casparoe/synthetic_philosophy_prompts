answer: |-
  Your draft is exceptionally clear, philosophically sharp, and tackles a genuinely under-discussed tension in UDT. Your instincts are correct: the core objection you raise *is* significant, recognized within parts of the UDT/FDT community, and doesn't have a universally accepted knockdown rebuttal. It's a live debate point. Here's a breakdown addressing your specific questions:

  1.  **Technical Accuracy (UDT, CDT, EDT, Counterfactual Mugging):**
      *   **Three-Way Contrast:** Your description of the structural difference is **accurate**. You correctly identify that UDT optimizes over *policies* (functions from information states/observations to actions) *ex ante*, using the prior probability measure, rather than maximizing expected utility *conditional* on the current information state/observation like CDT and EDT do *ex post*.
      *   **Counterfactual Mugging Setup:** Your presentation is **standard and correct**. You accurately depict the predictions and actions of CDT, EDT, and UDT in this scenario. The expected value calculation for the UDT policy is correct.
      *   **Policy Range:** You haven't smuggled in confusion. The policy *does* range over possible epistemic states/observations the agent might find itself in. In Counterfactual Mugging, the two relevant observations are "Omega asks for $100" (Tails) and "Omega does not ask for $100" (Heads). The policy specifies an action for each observation ("Pay if asked", "Refuse if asked", etc.). UDT evaluates the expected utility of these *entire policies* before knowing which observation occurs.
      *   **Minor Nuance:** Sometimes UDT/FDT formulations emphasize optimizing over *outputs of a fixed computation* (the agent's own decision algorithm) in response to inputs (observations). This is functionally equivalent to optimizing a policy function for the purposes of your description and the mugging example. Your description captures the essence.

  2.  **Parallel to McClennen's Resolute Choice:**
      *   **Characterization of Resolute Choice:** Your memory of McClennen is **largely correct**. Resolute choice involves adopting a *plan* (a sequence of actions for a decision tree) *ex ante* based on a comprehensive evaluation (e.g., maximizing utility over the whole tree), and then *sticking to that plan* at subsequent choice nodes even if, evaluated locally with the preferences *at that node*, deviating would seem better. The core motivation is often to avoid "dynamically inconsistent" choices where the agent regrets its own earlier decisions or fails to achieve its *ex ante* optimal outcome due to foreseeable preference shifts or temptation.
      *   **Analogy to UDT:** The analogy you draw **holds up remarkably well and is philosophically insightful**. The structural parallel is strong:
          *   **Ex Ante Commitment:** Both involve a crucial evaluation and "commitment" made at an earlier, more encompassing informational state (prior vs. root of tree).
          *   **Sticking to the Plan/Policy:** Both require executing the prescribed action at a later node/upon a specific observation, even though a *local* evaluation *at that point* (using CDT/EDT or the node's preferences) suggests deviation is better.
          *   **Rationale:** Both justify this by appealing to the superior outcome achieved *overall* or *in expectation* by adhering to the plan/policy compared to the outcome achievable by making locally optimal choices at each point.
      *   **Potential Disanalogy (and why it might not break the analogy):** The key difference you note is the *source* of the benefit for sticking to the plan:
          *   **McClennen (Typical Cases):** The benefit arises from coordinating the agent's actions *over time with its own future selves* to avoid self-defeating behavior caused by predictable preference shifts (e.g., hyperbolic discounting) or temptation.
          *   **UDT (Mugging):** The benefit arises from coordinating the agent's action *across counterfactual branches* (Heads vs. Tails) to satisfy the predictor's condition *in the Heads branch*, which is causally disconnected from the Tails branch where the action is taken.
      *   **Why the Analogy Still Works:** Despite this difference in *why* coordination is beneficial, the core normative challenge you identify applies equally to both: **Why is it rationally compelling, *at the later point itself* (Tails branch/choice node), with full knowledge of the situation and nothing *further* depending on this specific choice (in the Tails branch itself, paying is just a loss; at the node, deviating looks better locally), to adhere to the ex ante plan/policy?** The UDT proponent's appeal to "being the type of agent that pays" functions similarly to the resolute chooser's appeal to "being the type of agent that sticks to the beneficial plan" – both are arguments about the *disposition* being rational, but the challenge is about the rationality of the *particular action* in the specific, realized context. The "external predictor" vs. "internal future self" distinction doesn't automatically resolve this core tension about local rationality.

  3.  **The Ex-Ante vs. Ex-Post Worry: Recognition and Rebuttals:**
      *   **Is it a Real, Recognized Problem?** **Absolutely, yes.** This is arguably *the* central philosophical objection to UDT/FDT from a decision-theoretic perspective. It's often framed as:
          *   **The "Why should I care *now*?" objection:** Once I know I'm in Tails, why should I care about what happens in Heads? Paying $100 *here* just loses me $100 with no compensating benefit *in this world*.
          *   **The "Ex Post Irrationality" charge:** Adhering to the UDT policy in Tails seems *locally irrational* (by CDT/EDT standards, or just common sense) even if adopting the disposition *ex ante* was rational.
          *   **The "Ghost of Benefits Past" problem:** The expected benefit justifying the policy existed only *before* updating; after updating to Tails, that expected benefit (from Heads) is gone and irrelevant to the current decision.
      *   **Standard Rebuttals (and why they might not fully satisfy):** UDT proponents have responses, but they often circle back to the core commitment:
          *   **The "You Are the Algorithm" Argument:** Rationality is a property of the *whole decision algorithm*, not just its output at a single point. An algorithm that defects in Tails is simply a *different algorithm* from the one that pays. The algorithm that pays *ex ante* dominates the algorithm that defects. Therefore, you *should* be the paying algorithm, and that algorithm pays in Tails. (This directly maps to your "no halfway house" point). **Your Challenge:** This feels like defining the problem away. It asserts that rationality applies globally but doesn't directly address the intuition that *within the Tails branch*, paying seems irrational.
          *   **Pragmatic / Consequentialist Justification:** The *only way* to achieve the high payoff in Heads is to be an agent whose decision procedure outputs "Pay" in Tails. Since you value the Heads payoff, you must structure your decision procedure to output "Pay" in Tails. **Your Challenge:** This justifies *adopting the disposition*, but again, doesn't directly show why *executing* that disposition *in Tails* is rational *given that you now know the Heads payoff is lost forever*. It justifies the disposition instrumentally, not the action intrinsically at the point of choice.
          *   **Trade Across Possible Worlds:** UDT/FDT fundamentally views decision-making as optimizing *across the entire set of possibilities considered possible ex ante*. The $100 paid in Tails is the "price" for the $10,000 gained in Heads, viewed from the prior perspective. Rationality requires honoring this "trade" even after you know which side of the trade you ended up on. **Your Challenge:** This is precisely the resolute move! It privileges the *ex ante* evaluation as normatively binding on the *ex post* action, which is the core point of contention. It asserts this is what rationality *is* but doesn't defeat the intuition that rationality should be responsive to the agent's *actual, current* situation and information.
          *   **Self-Locating Uncertainty (Less common for mugging):** In some UDT formulations involving self-locating uncertainty (e.g., Absent-Minded Driver), the argument is that you *don't know* which branch you are in *at the moment of decision*. This doesn't cleanly apply to Counterfactual Mugging where, upon being asked, you *know* you are in Tails.
      *   **Does your objection "work"?** **Yes, it works as a powerful and valid philosophical challenge.** It highlights a genuine tension: UDT delivers superior *ex ante* expected utility by prescribing actions that seem *ex post* irrational (in a locally evaluated sense) in some branches. The standard rebuttals largely amount to asserting that rationality *just is* this global, policy-based optimization and that local evaluations are misguided or incomplete. This is a substantive, defensible position (the UDT/FDT position), but it doesn't *refute* your objection; it *embraces* the implication you find troubling (that rationality requires an action that seems locally suboptimal) and argues that this is the correct view of rationality. Your objection successfully forces this choice: either accept that rationality sometimes demands actions locally perceived as losses to satisfy global optimality (the UDT/resolute view), or maintain that rationality is fundamentally local/contextual (the sophisticated/CDT/EDT view). There is no easy synthesis that satisfies both intuitions perfectly.

  **Conclusion & Recommendations:**

  *   **Accuracy:** Your technical presentation is sound. No significant errors detected.
  *   **Resolute Choice Analogy:** Your analogy is insightful, valid, and strengthens your critique by placing UDT within a well-established debate about dynamic choice and the scope of rationality. The disanalogy (internal vs. external coordination) doesn't undermine the core normative parallel concerning the binding force of the *ex ante* evaluation on the *ex post* action.
  *   **Ex-Ante/Ex-Post Objection:** This is **the** fundamental philosophical challenge to UDT/FDT. You articulate it clearly and link it effectively to the resolute choice literature. There are standard rebuttals, but they primarily consist of reaffirming the UDT view of rationality as global policy optimization, not of dissolving the tension you identify. Your objection stands as a legitimate and important criticism.
  *   **Strengthening the Draft:**
      *   **Cite McClennen Explicitly:** Make the link clear. A sentence like "UDT's requirement to adhere to the pre-committed policy in the Tails branch structurally mirrors McClennen's *resolute choice*, wherein an agent adheres to an *ex ante* optimal plan at a later node despite locally preferable alternatives, though motivated here by coordination across counterfactual worlds rather than temporal selves."
      *   **Acknowledge Rebuttals & Double Down:** Briefly state the core UDT rebuttal ("rationality applies to the whole algorithm/policy") and then argue why this doesn't resolve the normative tension *at the point of action in the realized branch*. Emphasize that UDT demands actions that appear *locally irrational* as the price for *ex ante* optimality.
      *   **Clarify the Stakes:** Frame it as a clash of intuitions about the *locus* and *scope* of rational evaluation: Is rationality fundamentally about maximizing *now, given what I currently know and can affect*, or is it about implementing the *ex ante* optimal strategy across the branches of possibility?
      *   **Consider Terminology:** You might find it helpful to explicitly use the language of "dynamic consistency" or "normative force at choice nodes" borrowed from the dynamic choice literature to sharpen the critique.
  *   **Anticipating Committee Pushback:** Be ready for:
      *   Defenses based on the "you are the algorithm" argument.
      *   Claims that *only* UDT/FDT can handle certain problems (like true Prisoner's Dilemmas with perfect twins) "correctly," implying that local rationality must be sacrificed.
      *   Arguments that your "local irrationality" charge begs the question by assuming CDT/EDT/local evaluation as the standard.
      *   Point out that your objection doesn't offer an alternative that gets the "right" answer in Counterfactual Mugging *and* other UDT strongholds.

  Your paper tackles a deep and unresolved issue. It's precisely the kind of contribution that moves the discussion beyond the standard CDT vs. EDT debate. The parallel to resolute choice is a significant strength. Proceed with confidence – this is excellent work. Good luck with the seminar!
