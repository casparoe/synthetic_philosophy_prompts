  Here's a constructive case for the irreducible reality of resultant moral luck, pushing back hard against the epistemic dissolution argument:

  **The Core Argument: Outcome as Constitutive of Moral Reality, Not Merely Evidential**

  The epistemic reduction (Zimmerman, Thomson) is elegant but fundamentally misdiagnoses the phenomenon. It reduces morality to a purely *internal* calculus of intentions, character, and foresight, treating the *external* world – the actual unfolding of consequences – as merely a window into that internal state. This ignores how the *actual occurrence of harm* (or benefit) fundamentally transforms the moral landscape in ways that cannot be reduced to evidence about the agent's prior mental state. Even holding *all* internal facts fixed (knowledge, intention, recklessness, negligence), the outcome itself creates distinct moral facts and demands. Here's why:

  1.  **Agent-Regret and the Necessity of Outcome-Dependent Response (Williams):**
      *   Bernard Williams' concept of "agent-regret" is crucial. It's *not* just regret that things happened, nor guilt over one's intentions. It's a specific, first-personal feeling *directed at one's own action and its actual consequence*, even when the consequence was unintended and beyond one's full control.
      *   **The Epistemic View Fails Here:** Imagine two lorry drivers (Williams' example). Both are equally careful, competent, and blameless by any internal measure. One, through pure bad luck, hits a child who darts into the road. The other doesn't. The epistemic view says both are equally morally innocent *because* the internal state (carefulness) is identical. Yet, the driver who hit the child *ought* to feel agent-regret. This isn't irrational guilt or a mistake; it's a *morally appropriate* response to the *fact* that *their* action resulted in this terrible outcome. This regret isn't evidence *for* blameworthiness; it *is* the appropriate moral response *to* the outcome *itself*, a response that wouldn't (and shouldn't) exist in the near-miss scenario. The outcome *constitutes* the ground for this unique moral emotion.

  2.  **The Creation of Moral Debt and the Imperative of Repair:**
      *   When reckless action *actually* causes harm, it creates a specific moral debt *to the victim* (or their survivors) that simply doesn't exist in the near-miss case, even with identical recklessness.
      *   **Epistemic View Inadequacy:** The epistemic view might say, "We only *infer* the recklessness was worse because harm occurred, but the underlying blameworthiness for the recklessness is the same." This misses the point entirely. The reckless driver who hits the child doesn't just owe an apology for *being reckless*; they owe reparations, restitution, and profound amends *specifically for causing the child's death or injury*. This obligation flows *directly from the outcome*. The near-miss driver, despite identical recklessness, owes no such debt to anyone. The actual occurrence of harm *creates* a new moral reality – a relational debt – that transcends the internal state of the agent. Blame isn't just a judgment *about* the agent; it often involves recognizing and responding to this debt *to* the victim. The outcome is constitutive of the debt.

  3.  **The Structure of Blame: Outcome as Integral to the Object of Evaluation:**
      *   Blame isn't solely directed at the *intention* or the *character flaw* in isolation. We blame agents *for what they did* – and "what they did" intrinsically includes the consequences *when those consequences flow directly from their voluntary actions* under their description.
      *   **Epistemic View Blindspot:** Consider the drunk driver. We blame the one who hits the child *for killing a child while drunk driving*. We blame the one who gets home safely *for driving drunk and risking lives*. These are different objects of blame. While both share the element of reckless endangerment, the first blame includes the *actualization* of the risked harm. This isn't just an intensifier based on evidence; it's a different *kind* of moral failing made possible only by the outcome. The outcome completes the moral description of the act. Holding the reckless *intention* fixed ignores that morality judges *actions in the world*, not just intentions in the mind. The reckless intention *plus* the harmful outcome constitutes a distinct moral wrong from the reckless intention *plus* the harmless outcome.

  4.  **The Victim's Perspective and the Reality of Suffering:**
      *   Morality isn't just about agents; it's profoundly relational. The victim of the drunk driver who was hit exists. They suffered. Their family suffered. This suffering is a concrete moral reality. The near-miss driver created risk, but no *actual suffering* occurred because of the luck of circumstance.
      *   **Epistemic View Limitation:** The epistemic view focuses solely on the agent's state relative to the *risk*. It cannot adequately account for the moral significance of the *actual suffering* inflicted. The victim's suffering isn't just evidence of the driver's recklessness; it's a *new moral fact* in the world, directly caused by the driver's action (even if luck played a role), demanding recognition and response. This suffering alters the moral equation *for the agent* by creating the obligations mentioned in point 2. To dismiss the difference the suffering makes as merely "better evidence" is to disrespect the moral reality of the victim's experience. The outcome *is* the suffering.

  **Conclusion: Why Resultant Luck is Irreducible**

  The epistemic reduction tries to quarantine morality within the agent's mind, making it immune to the vagaries of the external world. But morality is lived *in* the world, where actions have consequences that matter profoundly. Resultant luck highlights that the moral significance of our actions isn't fully determined at the moment of choice or by our internal states alone. The *actual unfolding of events* – whether our recklessness manifests as a terrifying near-miss or a tragic death, whether our risky gamble yields a windfall or ruin – changes what we *owe*, how we *should feel* (agent-regret), the *specific nature* of the wrong we committed, and the *relational debts* incurred. These differences are not epistemic artifacts; they are constitutive features of our moral reality shaped by the outcomes of our actions. Denying resultant luck doesn't solve a puzzle; it denies the profound way the world, and luck within it, shapes the moral burdens and consequences we actually bear. Only by acknowledging resultant luck as real can we capture the full weight of our existence as agents embedded in an uncertain world.
