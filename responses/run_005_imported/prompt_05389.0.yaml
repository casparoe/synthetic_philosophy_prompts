answer: |-
  Based on Douglass's arguments in the Glasgow speech and his broader intellectual trajectory, here's a reasoned analysis of how he'd likely align with modern SCOTUS approaches, leaning heavily on his *structure* rather than presumed politics:

  1.  **Core Principle:** Douglass's ultimate loyalty was to the **Reconstruction Constitution** (post-13th, 14th, 15th Amendments) as the fulfillment of the document's latent anti-slavery potential. His "move one" (public meaning) was always in service of "move two" (liberty/justice as the default), especially *after* 1865. He saw the Reconstruction Amendments as radically transforming the document's purpose and interpretive baseline.

  2.  **Reaction to Modern "Public Meaning Originalism":** He'd view it with **profound skepticism, bordering on hostility, as currently practiced by the conservative majority.** Why?
      *   **Divorce from Higher Law:** Modern originalism often explicitly rejects natural law/higher law as a legitimate interpretive tool (e.g., Scalia's positivism). Douglass's "move two" was *foundational* to his reading. He argued the Constitution *must* be read in light of its preamble's justice/liberty goals. Severing text from this animating purpose would strike him as a fundamental betrayal of his method. He didn't see "public meaning" as neutral; he saw it as *necessarily* infused with liberty's presumption.
      *   **Hostility to Reconstruction:** Douglass would perceive modern originalism's frequent focus on 1787/1791, and its sometimes cramped reading of the 14th Amendment (e.g., privileging narrow historical intent over broad principles), as an **attempt to roll back the Second Founding.** His entire post-1851 argument depended on the Constitution being a *living instrument* capable of radical transformation towards justice. Originalism fixated on pre-Civil War meanings undermines that project. He'd see it as prioritizing the "covenant with death" era over the "new birth of freedom."
      *   **Selective Application:** He'd be acutely aware of how the methodology seems flexible enough to reach desired conservative outcomes (Shelby, Dobbs) while sometimes yielding liberal ones (Bostock). He'd likely conclude the *method* is secondary to the *ends* for many practitioners, and the ends (limiting federal power to protect states/individual liberty in ways he'd often see as regressive) are frequently at odds with his vision of an active national government enforcing fundamental rights.

  3.  **Case Analysis:**
      *   **Shelby County v. Holder (2013):** Douglass would be **vehemently opposed.**
          *   *Move One (Text):* He'd argue the 15th Amendment's text ("The right... to vote shall not be denied... on account of race") and Section 2 ("Congress shall have power to enforce this article by appropriate legislation") provide *explicit* textual authority for the VRA. Preclearance was deemed "appropriate legislation" for decades. Gutting it based on an "equal sovereignty of the states" principle not found in the text of the Reconstruction Amendments, but inferred from pre-Civil War structure, would enrage him.
          *   *Move Two (Higher Law/Reconstruction Purpose):* He'd see this as a catastrophic abandonment of the 15th Amendment's core purpose – overcoming *de facto* racial disenfranchisement. The Court's reliance on changed circumstances and "current needs" would strike him as perverse, ignoring the persistent reality of racial discrimination in voting that preclearance was designed to combat. This decision embodies the "hostile takeover" of textualism/federalism principles he'd fear, actively undermining the Reconstruction project he staked his life on.
      *   **Dobbs v. Jackson Women's Health (2022):** Douglass would be **strongly opposed.**
          *   *Move One (Text):* He'd likely focus on the 14th Amendment's broad language: "liberty," "due process," "equal protection." While he might acknowledge the lack of explicit textual mention of abortion, he'd argue that liberty *presumptively* encompasses bodily autonomy and fundamental life decisions absent explicit denial. The Dobbs majority's demand for specific historical enumeration of a right would clash with his view that liberty is the baseline requiring explicit textual carve-outs to restrict.
          *   *Move Two (Higher Law/Reconstruction Purpose):* This is where his opposition would be fiercest. He was a strong advocate for women's rights. He'd see the denial of bodily autonomy and the forced continuation of pregnancy (especially impacting poor women and women of color disproportionately) as a fundamental violation of the liberty and equality principles enshrined in the 14th Amendment. The history-and-tradition analysis, rooted in periods where women had severely limited rights, would be anathema. He'd see Dobbs as using originalism to *contract* the scope of liberty protected by the Reconstruction Amendments, the exact opposite of his life's work. He'd likely align with the dissent's view of liberty.
      *   **Bostock v. Clayton County (2020):** Douglass would be **strongly supportive.**
          *   *Move One (Text):* This is the purest application of his "move one." The decision hinges entirely on the *public meaning of the words* in Title VII: "discriminate against... because of... sex." Gorsuch's textualist reasoning – that discriminating against someone for being gay or transgender *necessarily* involves sex – is exactly the kind of close, common-sense reading of enacted language Douglass championed in the Glasgow speech (e.g., no "slavery" = no constitutional sanction for slavery). He'd applaud the focus on the enacted text's ordinary meaning.
          *   *Move Two (Higher Law/Reconstruction Purpose):* The outcome – protecting LGBTQ+ individuals from workplace discrimination – aligns perfectly with the principles of equality and liberty he saw as the Constitution's ultimate purpose, especially under the 14th Amendment. He'd see this as the *proper* convergence of textual fidelity and justice.

  **The Leaning:**

  **Douglass would decisively reject the dominant conservative originalism of the Roberts Court (exemplified in Shelby and Dobbs) as a perversion of his method and a betrayal of the Reconstruction Constitution.** He'd see it as:

  1.  **Abandoning Higher Law:** Severing text from its animating purpose of liberty and justice.
  2.  **Hostile to Reconstruction:** Privileging pre-Civil War meanings and structures (like robust state sovereignty) over the transformative purpose and broad language of the 13th, 14th, and 15th Amendments.
  3.  **Selectively Deploying Textual Rigor:** Using it to strike down laws protecting rights (VRA) or deny the existence of rights (abortion) while finding it less compelling when text supports equality (Bostock, which he'd praise).

  **He would likely conclude that the "public meaning originalism" project, *as currently practiced by the Court's conservative majority*, is indeed a hostile takeover.** He deployed textual fidelity ("move one") *only* as a tool to serve the higher-law principle of liberty ("move two"), particularly within the framework of the *post-slavery* Constitution. Seeing it used to restrict liberty, undermine Reconstruction's guarantees, and elevate pre-Civil War federalism over national protection of fundamental rights would confirm his worst fears. He'd side with jurists who prioritize the Reconstruction Amendments' transformative purpose and embrace a view of liberty that evolves to meet new challenges to equality, using text as a foundation but not a cage. His alignment would be with outcomes advancing substantive liberty and equality, using textual arguments where they support that end (Bostock), but rejecting textual/historical arguments used to restrict it (Shelby, Dobbs). The *method* is only valid when it serves the *mission* of the Reconstruction Constitution.
