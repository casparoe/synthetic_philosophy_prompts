answer: |-
  Here’s a reconstruction of Aquinas’s likely reasoning on the Loop Track case, grounded strictly in *Summa Theologica* II-II, q.64, a.7 and his broader theory of voluntary action—without recourse to later scholastic formulations or modern trolley-problem jargon.

  ### Core Aquinas Framework (ST II-II, q.64, a.7)
  1.  **Intention (*per se intentum*) vs. Consequence (*praeter intentionem*):**  
      Aquinas distinguishes between what an agent *intends* (the chosen end and the means necessary to achieve it) and what is *outside the intention* (foreseen but not chosen consequences). In self-defense, killing the aggressor is *praeter intentionem*; the *per se intentum* is self-preservation.  
      *Key:* If an effect is **necessary to achieve the end**, it is part of the means and thus *intended*, not merely foreseen.  

  2.  **Proportionate Force:**  
      The defensive act must use force *proportionate* to the threat. Using more force than necessary, or achieving the good end through an evil means, is illicit.  

  ### Applying Aquinas to the Loop Track
  -   **Physical Act:** Throwing a switch to divert the trolley.  
  -   **Intended End (*finis operis*):** Saving five lives.  
  -   **Means:** Diverting the trolley onto the side track.  
  -   **Consequence:** Death of the one man on the side track.  

  **The Critical Issue:**  
  In the standard bystander case, diverting the trolley *away* from the five *directly* achieves the end. The death of the one is a *side effect* of moving the threat elsewhere. His death isn’t *necessary* for saving the five; it’s an unfortunate consequence of relocating the threat.  

  In the Loop Track, **diverting the trolley does *not* save the five unless the one man’s body stops it.** The loop ensures the trolley returns to kill the five *unless obstructed*. Thus:  
  -   The one man’s death **is causally necessary** to stop the trolley.  
  -   Saving the five **depends *directly* on his body being crushed** to halt the trolley.  

  ### Aquinas's Verdict: Impermissible  
  1.  **The Death is *Per Se Intentum* (Intended as Means):**  
      Aquinas insists that if an effect is *required* for the success of the act, it is *not* merely *praeter intentionem* but part of the means (*ST* I-II, q.12, a.2; q.20, a.5). Here, the man’s death isn’t a regrettable byproduct—it’s the *mechanism* by which the trolley stops. Diverting the trolley *only works* if he dies. His death is thus **intended in the act** (*voluntarium in se*), not merely foreseen.  

  2.  **Proportionate Force? Irrelevant:**  
      Aquinas’s proportionality condition requires that defensive force *not exceed* what is necessary (*moderamen inculpatae tutelae*). But here, the issue isn’t excess force—it’s that **an evil (killing an innocent) is chosen as a means** to save others. For Aquinas, no proportionality justifies *intending* evil (*ST* II-II, q.64, a.7 ad 2: "It is never lawful to kill a man *with intent*").  

  3.  **The Object of the Act is Corrupted:**  
      The physical motion (throwing a switch) is identical to the bystander case, but Aquinas judges acts by their moral object (*finis operis*). In the Loop Track, diverting the trolley **inherently involves** using the man’s death as a tool. The act is thus *formally distinct* from mere diversion—it becomes an act of "diverting-*to-crush-the-man*." This transforms it into an unjust killing.  

  ### Broader Thomistic Resources: Voluntary "in itself" vs. "in its cause"  
  -   **Voluntary *in se*:** What is directly chosen (e.g., diverting the trolley *to crush the man*).  
  -   **Voluntary *in causa*:** What is foreseen but not chosen (e.g., the one man’s death in the *standard* diversion, where it’s not instrumental).  
      *In the Loop Track*, the death is voluntary *in se* because it is **causally inseparable** from the act’s success. If the man miraculously survived, the five would die—so his death is *intrinsic to the plan*.  

  ### Does Aquinas's Framework Strain?  
  -   **No strain in generating a verdict:** Aquinas’s framework decisively rules the Loop Track impermissible. The death is not *praeter intentionem* but is *per se intentum* as a means.  
  -   **Strain in modern comparisons:** Modern DE often focuses on *intention as a mental state*. For Aquinas, the issue is **ontological**: Is the death *causally required* for the good effect? If yes, it’s intended in the moral structure of the act, regardless of the agent’s psychological focus. The Loop Track exposes this rigor—Thomistic DE doesn’t permit "wishful thinking" about side effects when the causal chain demands the evil.  

  ### Conclusion  
  Aquinas would condemn the Loop Track act as illicit homicide. The one man’s death is not a side effect but the *sine qua non* for saving the five, making it **intended per se** within the act’s moral structure. His framework handles this case *more* cleanly than modern intention-centric DE, precisely because it anchors "intention" in causal necessity rather than subjective mental states. The verdict flows directly from *ST* II-II, q.64, a.7: you may never *use* an innocent person’s death as a means to save others, even via a switch.
