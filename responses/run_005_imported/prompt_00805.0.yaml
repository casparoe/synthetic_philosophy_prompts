  The user seems deeply informed about philosophy of science—they mention technical solutions like Tichý-Oddie and Niiniluoto by name. This isn't surface-level curiosity; they've done homework and now wrestle with science communication ethics. Their core tension: wanting to keep intuitive "closer to truth" narratives while honoring philosophical rigor that undermines it. 

