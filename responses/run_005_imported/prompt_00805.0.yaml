  Breaking this down:  
  First, the Miller-Tichý problem is unavoidable. Their proof mathematically torpedoed Popper’s definition by showing false theories can’t be compared via true/false consequence counts. Every proposed fix since—whether measuring "distance" to truth or similarity—adds extra assumptions. Niiniluoto’s approach, for example, needs a language to define likeness, which itself is debatable. So yes, the field remains messy.  

  For communication, I see three layers:  
  1. **Honesty about uncertainty**: We must flag that "closer to truth" isn’t a proven technical concept but a metaphor rooted in scientific consensus.  
  2. **Reframing progress**: Shift focus to empirical adequacy (e.g., relativity predicts Mercury’s orbit where Newton fails) and problem-solving scope.  
  3. **Language tweaks**: "More accurate" or "wider applicability" avoids truth-realist baggage while feeling intuitive.  

  But crucially, abandoning the intuition entirely might overshoot. Science *does* progress; we need words for that. The key is separating day-to-day progress (GPS relying on relativity corrections) from grand claims about asymptotic Truth.  

  The user’s audience likely craves clarity, not caveats. So I’d suggest:  
  - Use "closer to truth" sparingly, always paired with concrete examples.  
  - Adopt fallback phrases like "better explains observations."  
  - Briefly note philosophical debates in sidebars for curious readers.  

