answer: |-
  Your critique cuts to the core of the debate. Laudan's Pessimistic Meta-Induction (PMI) *does* rely on an implicit, unstable reference class, and this flaw is fatal to its wholesale form. Moreover, this same instability undermines the "divide et impera" (DEI) strategy. Let's break this down rigorously.

  ### I. The Reference-Class Problem as Fatal to Wholesale PMI

  1.  **PMI's Inductive Structure:**
      *   Premise 1 (Historical): Most past theories that were empirically successful (T1, T2, ..., Tn) are now considered radically false (e.g., phlogiston, caloric, luminiferous ether).
      *   Premise 2 (Uniformity): Present theories (Tn+1, Tn+2, ...) are relevantly similar to past theories (T1...Tn) in terms of their epistemic status vis-à-vis success and truth.
      *   Conclusion: Therefore, present empirically successful theories are probably radically false.

  2.  **The Inductive Leap Requires a Stable Reference Class:**
      The inference from Premise 1 to the Conclusion is an *inductive projection*. Its validity depends on:
      *   **Definability:** The existence of a well-defined reference class `C` to which both past (T1...Tn) and present (Tn+1...) theories belong.
      *   **Homogeneity:** The property being projected (probability of being radically false *given* empirical success) must be stable across all members of `C` and over time.
      *   **Base Rate Stability:** The proportion of radically false theories within the *successful* subset of `C` must be constant (or projectable) from the past sample to present/future members.

  3.  **Why the Reference Class `C` is Undefined and Unstable:**
      *   **Lack of Specification:** PMI proponents offer no non-circular, non-question-begging criterion for membership in `C`. What defines "a scientific theory" for this induction?
          *   Is it *any* theory making predictions? (Too broad: includes folk theories, astrology).
          *   Is it theories achieving "mature science" status? (Circular and vague; how defined?).
          *   Is it theories achieving comparable levels of predictive precision/scope? (Ignores radical differences in methodology/instrumentation enabling that precision).
      *   **Epistemic Heterogeneity:** The historical sample (T1...Tn) and present theories differ profoundly in the factors *crucially relevant* to their likely truth-conduciveness:
          *   **Instrumentation & Measurement:** Compare inferring chemical composition via combustion residue analysis (phlogiston) vs. mass spectrometry or X-ray crystallography. The reliability and theory-ladenness differ astronomically.
          *   **Methodology & Evidential Standards:** The role of controlled experimentation, statistical inference, mathematical rigor, peer review, and demands for novel predictions have evolved dramatically. Caloric theory lacked the evidential constraints imposed by thermodynamics or kinetic theory.
          *   **Theoretical Depth & Integration:** Modern theories (QED, QCD, Standard Model, General Relativity, evolutionary synthesis) exhibit levels of mathematical coherence, cross-domain explanatory integration, and independent lines of evidential support unparalleled in past abandoned theories. Phlogiston was largely an *ad hoc* explanatory device within a limited domain.
          *   **Degree of "Radical Falsity":** The ontological discontinuity between past and present theories is often overstated. While "phlogiston" was discarded, the phenomena of oxidation/reduction were retained and refined. The ether vanished, but the wave nature of light and field concepts were retained and transformed. The *nature* of the failure matters for projecting *how* present theories might fail.

  4.  **Consequence: Inductive Projection Fails:**
      *   The lack of a defined, homogeneous reference class `C` means the base rate of radical falsity *given empirical success* calculated from the historical sample (Premise 1) **cannot be reliably projected** onto present theories.
      *   The profound epistemic differences suggest `C` is heterogeneous. The historical sample might belong to a subclass `C_historical` characterized by weaker methodologies, cruder instrumentation, and less integrated theorizing, with a high base rate of radical falsity. Present theories might belong to a distinct subclass `C_modern` with a *different* (likely lower) base rate of radical falsity due to stronger epistemic safeguards.
      *   **Therefore:** PMI commits the fallacy of **biased sampling** or **misplaced homogeneity**. It assumes the past sample is representative of the present regarding the critical property (propensity for radical falsity despite success), without justification for that representativeness across the vast epistemic shift. The induction collapses without a stable `C`.

  ### II. Undermining "Divide et Impera" (DEI) with the Same Problem

  The DEI strategy (Kitcher, Psillos) attempts to rescue realism by arguing that while *whole* past theories are discarded, their *successful components* – the "working posits" genuinely responsible for their empirical success – are typically preserved.

  1.  **The DEI Sorting Mechanism:**
      *   For an abandoned theory T (e.g., caloric theory), identify its posits (e.g., caloric fluid, conservation of caloric, caloric as a weightless substance).
      *   Sort these into:
          *   **"Working Posits" (WP):** Those that genuinely contributed to T's empirical successes (e.g., conservation of *something* (later energy) during heat transfer).
          *   **"Idle Posits" (IP):** Those not genuinely involved in generating successful predictions, often playing only explanatory or ontological roles (e.g., caloric as a subtle fluid, its weightlessness).
      *   Claim: WP are typically retained (e.g., energy conservation), while IP are discarded. This explains the success of past theories *without* conceding their truth and preserves the link between success and (partial) truth for present theories.

  2.  **The Reference-Class Problem for DEI Sorting:**
      The fatal flaw lies in **defining the criteria for "working" vs. "idle"**. This sorting is inherently reference-class dependent and suffers the same instability as PMI's `C`.
      *   **"Genuine Contribution" is Contextual:** What counts as "genuinely contributing" to empirical success depends entirely on:
          *   **The Evidential Base Available at Time t:** A posit might seem essential for success relative to evidence E1 at time t1 (e.g., ether for explaining stellar aberration), but later evidence E2 at t2 might show it played no *essential* role in generating *other* successes (e.g., explaining the null result of Michelson-Morley) or was even inconsistent with them. Was the ether ever a "working posit"? Relative to *which* successes and *which* evidence?
          *   **The Theoretical Framework at Time t:** The role a posit plays is defined within its host theory. Phlogiston's "release" seemed essential for explaining combustion *within the phlogiston framework*. From a modern perspective, it was fundamentally mistaken. The DEI sorting is done *retrospectively* using current knowledge, not by criteria available to the historical actors. This is circular for justifying realism *about present theories* – we use *current* science to define "working" in the past, assuming current science is reliable.
          *   **The Counterfactual Criterion:** The DEI claim that IP *didn't* contribute relies on counterfactuals: "Would T have been successful *without* posit P?" Answering this requires specifying the *alternative theoretical context* in which T exists without P. This alternative context is undefined and reference-class dependent. Could Fresnel's equations have been derived without *any* medium concept? Unclear. The counterfactual depends on the permissible theoretical alternatives *at the time*, which were constrained by the prevailing scientific paradigm.

  3.  **Consequence: Unstable Sorting Criteria:**
      *   There is no stable, transhistorical reference class `C_posits` or property `G` (genuine contributor) that allows a uniform sorting of past theory posits into WP and IP.
      *   The sorting criteria (`G`) are **theory-laden and temporally relative**. What counts as "working" depends on the *current best understanding* of the phenomena and the causal/nomological structure of the world. This makes DEI vulnerable to the same meta-induction it combats: just as we now judge past "working" components differently (e.g., was the wave equation *really* independent of the ether medium?), future science may judge our *current* "working" components (e.g., quantum fields, dark matter) as not genuinely essential contributors relative to *their* deeper understanding.
      *   **Therefore:** DEI fails as a *wholesale realist strategy*. It doesn't provide a general, ahistorical criterion for identifying truth-conducive components across theory change. Its sorting is parasitic on the *presumed* reliability of current science to judge the past, which is precisely what the PMI challenges. It merely shifts the reference-class problem from "theories" to "theory posits," without solving it.

  ### III. What Survives? The Primacy of Retail Assessment

  Your suspicion is correct. The reference-class problem, fatal to wholesale PMI and undermining wholesale DEI, points decisively towards **retail realism** as the only tenable path:

  1.  **No General Wholesale Verdict:** Neither the antirealist's PMI nor the realist's DEI (or No Miracles Argument) can establish a *general* conclusion about the truthlikeness of *all* or *most* successful scientific theories. The epistemic heterogeneity across scientific history and the instability of the required reference classes prevent such global inductions.
  2.  **Retail Assessment is Essential:** The epistemic status of a scientific theory – its likely truth or truthlikeness – must be evaluated on a **case-by-case basis**, considering:
      *   **Its Specific Evidential Support:** Depth, breadth, variety, precision, novelty of predictions.
      *   **Its Explanatory Coherence & Integration:** Internal consistency, fit with well-established theories in other domains, ability to unify diverse phenomena.
      *   **Its Resilience:** Ability to withstand rigorous testing and accommodate new evidence without *ad hoc* modifications that undermine its core content.
      *   **The Maturity of the Domain:** The reliability of instrumentation, the stability of background knowledge, and the sophistication of methodology *within that specific field*.
  3.  **Contextual Continuity:** While wholesale arguments fail, *localized* continuity arguments can be persuasive *within specific, well-developed research programs*. The retention of mathematical structure (e.g., Maxwell's equations), specific mechanisms (e.g., DNA as hereditary material), or conserved quantities (e.g., energy) across theory change in a *particular domain* provides *a posteriori*, context-specific reasons for realism about *those specific elements*. This is realism earned through detailed historical and scientific analysis, not guaranteed by a general philosophical argument.
  4.  **Survival of a Modest Optimism:** What survives the reference-class wreckage is not guaranteed truth, but a *defeasible, contextually grounded optimism*. Based on the demonstrable *progressive refinement* of explanatory power, predictive accuracy, and instrumental control within mature sciences – achieved through the very methodological evolution that breaks the PMI's reference class – we have *reason* (not proof) to believe that our best current theories in mature domains are *likely* approximately true, or at least tracking reality more closely than their predecessors. This optimism is earned retail, domain by domain, theory by theory, and remains perpetually open to revision based on new evidence. It is a conclusion drawn *from within* the scientific process, not a philosophical guarantee imposed *upon* it.

  **In essence:** The reference-class problem exposes the futility of seeking a *general, ahistorical* answer to scientific realism via inductive meta-arguments. The complexity, context-dependence, and historical evolution of scientific practice demand that assessments of truthlikeness be made at the retail level, grounded in the specific details of the theories, their evidence, and their historical trajectories. Nothing stronger survives rigorous scrutiny. Your physical chemist's instinct – honed on the details of specific models and evidence – points towards the correct, albeit less grand, conclusion.
