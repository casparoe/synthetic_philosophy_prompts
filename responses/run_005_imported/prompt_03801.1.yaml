  First, I need to recall the core arguments. Putnam's MR shows that mental states can be realized by different physical substrates, meaning they can't be identical to specific brain states. Functionalism thus defines mental states by their functional roles. Fodor extends this to argue that psychology, dealing with higher-level generalizations, can't be reduced to neuroscience without losing explanatory power. 

