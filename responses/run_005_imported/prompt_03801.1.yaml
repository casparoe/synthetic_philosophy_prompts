  Next, I should break down how Kim's points challenge functionalism. If psychology reduces locally, does it lose autonomy? Functionalism insists on multiple realizability as key to autonomy, but Kim's local reductions might still allow domain-specific explanations. However, disjunctive properties might not form genuine laws, undermining psychology's scientific status. 

