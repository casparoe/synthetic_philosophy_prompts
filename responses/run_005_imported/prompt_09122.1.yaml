prompt: |-
  I sit on the board of a mid-sized foundation that funds global-health work, and I'm now facing a live version of a question I've only ever debated on Overcoming Bias and LessWrong. Our executive director wants to settle next year's strategic bet -- bed-net scale-up versus pandemic-preparedness advocacy -- by defining a combined welfare metric (DALYs averted per dollar plus a grantee-capacity index), running conditional prediction markets among staff and trustees on each option, and pre-committing to fund whichever one the market prices higher once trading settles. Half the board is enthusiastic; the other half warns that advocacy's payoff is inherently harder to price, so its market will stay thin and never really get tested -- meaning we'd be dressing up a foregone conclusion as a forecast, with the further risk that a donor leak makes this look like a miniature 2003 DARPA "terrorism futures" episode. Draft the memo I'll circulate before the December board meeting: recommend adopt, reject, or adopt with modifications, with a concrete timeline, and engage the thin-market objection on its own terms rather than just invoking Hanson's standard rebuttal that manipulation is usually self-defeating.
reasoning: |-
  Okay, the user is on the board of a foundation focused on global health. They're dealing with a strategic decision between funding bed-net scale-up and pandemic-preparedness advocacy. The executive director proposes using prediction markets with a combined welfare metric to decide. The board is split, with concerns about thin markets for advocacy and potential PR risks.

  First, I need to understand the core issue. The thin-market objection is central here. Advocacy outcomes are harder to quantify and have longer time horizons, which could lead to less trading activity. Without sufficient participation, the market price might not reflect true predictions, making the decision unreliable. The user wants this addressed specifically, beyond just Hanson's argument that manipulation is self-defeating.

  The user also mentioned avoiding the "terrorism futures" comparison. DARPA's 2003 incident faced backlash for seemingly profiting from tragedy. Any leak could paint the foundation in a bad light, especially if the market appears speculative on advocacy outcomes. So the memo needs to address both the technical issue of thin markets and the reputational risk.

  The user's deeper needs might include maintaining board unity, ensuring a defensible decision-making process, and safeguarding the foundation's reputation. They need a solution that's both rigorous and politically viable. Adopting the proposal with modifications seems best. But what specific changes can mitigate the thin-market problem?

  Enhancing the advocacy market structure is key. Maybe requiring minimum participation from experts in advocacy and pandemic preparedness. Also, seeding the market with initial liquidity could encourage trading. Using synthetic data or case studies might help participants calibrate their predictions. 

  For the PR risk, transparency is crucial. Framing the markets as internal tools for forecasting, not gambling. Clear communication about the metrics and process. Pre-briefing key stakeholders and preparing talking points in case of leaks. 

  Timeline adjustments: A pilot phase for the markets. Run them for a set period, say 4-6 weeks, with defined liquidity and participation thresholds. If those aren't met, have a fallback like expert elicitation. This provides a backup without discarding the market data entirely.

  The grantee-capacity index needs refinement too. Ensuring it's measurable and not biased towards one option. Maybe separate indicators for bed-nets and advocacy to avoid conflating different capacity types.

  Balancing these elements: modifications to market design, clear thresholds, robust communication, and a fallback plan. This addresses the thin-market concern head-on while maintaining the benefits of prediction markets. Also, aligning the timeline to allow for adjustments before the final decision.
answer: |-
  ## MEMORANDUM

  **TO:** Board of Directors, [Foundation Name]  
  **FROM:** [Your Name], Board Member  
  **SUBJECT:** Recommendation on Executive Director's Prediction Market Proposal for Strategic Funding Decision  
  **DATE:** November 26, 2023  

  ### I. Executive Summary
  I recommend **adopting the Executive Director's (ED) proposal with significant modifications** to address the core "thin market" objection and reputational risk. The modified approach leverages the strengths of prediction markets while mitigating key weaknesses through structural enhancements, clear thresholds, and robust fallbacks. **We should not adopt the proposal in its current form due to the unaddressed risks, nor reject it outright given its innovative potential.**

  ### II. Core Recommendation: Adopt with Modifications
  The ED's proposal harnesses valuable collective intelligence but requires safeguards against thin markets and perception risks. Below is a concrete, modified plan:

  #### A. **Modified Prediction Market Structure**
  1.  **Two-Tiered Liquidity & Participation Requirements:**
      *   **Core Expert Pool:** Require *mandatory minimum participation* from 15-20 pre-identified internal/external experts with deep knowledge of *both* bed-nets *and* pandemic advocacy (e.g., epidemiologists, policy analysts, NGO leaders). Their initial trades seed liquidity.
      *   **Broader Staff/Trustee Pool:** Open trading to all staff/trustees, but implement a **minimum liquidity threshold** for the advocacy market (e.g., $5,000 in notional value traded, or 50 unique trades).
      *   **"Synthetic Data" Seeding:** Initial market prices should be seeded based on a rapid, anonymized expert survey to provide anchor points, reducing early volatility and encouraging engagement.

  2.  **Enhanced Metric Design for Advocacy:**
      *   Refine the "grantee-capacity index" into **specific, measurable proxy indicators for advocacy success** (e.g., "Increase in # of countries adopting WHO-recommended PPR frameworks within 3 years," "Measured increase in donor funding for PPR core functions"). Tie these directly to DALY-averting potential based on existing models (e.g., [Schäferhoff et al., 2019](https://gh.bmj.com/content/4/Suppl_8/e001307)).
      *   **Separate but Parallel Metrics:** Run markets on *both* the combined metric *and* key component proxies (e.g., "DALYs averted from Bed Nets," "Probability of >$100M new PPR funding catalyzed by 2026"). This provides richer data and identifies where uncertainty lies.

  3.  **Explicit "Thin Market" Trigger & Fallback:**
      *   Define clear, quantitative thresholds for a "valid" market *before* trading starts (e.g., minimum liquidity reached, minimum number of unique traders, price volatility below X% over final 48 hours).
      *   **If thresholds are NOT met for the Advocacy market (or its key proxies) by the deadline, trigger a pre-defined fallback:** A structured **Expert Elicitation process** (e.g., [IDEA protocol](https://idea.rivm.nl/)) focused *only* on the uncertain advocacy outcomes, using the *partial* market data as an input. The *combined* decision is then made using the robust bed-net market + expert elicitation for advocacy.

  #### B. **Mitigating Reputational Risk ("Terrorism Futures")**
  1.  **Internal Branding & Communication:**
      *   Frame explicitly as an **"Internal Forecasting Exercise"** or **"Collective Intelligence Trial."** Ban terms like "bet," "gamble," or "market."
      *   **Transparent Purpose Statement:** Circulate internally: "Goal: Leverage diverse staff/trustee knowledge to forecast health impact potential under uncertainty. This is a decision-support tool, not a gambling pool."
  2.  **Strict Confidentiality & Access Controls:**
      *   Use a secure, permissioned platform. Limit initial access to Core Expert Pool + Board/Key Staff. Require NDAs.
      *   **Pre-Emptive Donor Briefing:** ED/Chair proactively brief major donors *before* launch on the *purpose and methodology*, emphasizing the focus on maximizing health impact forecasting under uncertainty. Control the narrative.
  3.  **Crisis Comms Prep:** Draft holding statements: "Our innovative forecasting tool is designed solely to improve our ability to save lives by better predicting outcomes. It is not speculative and involves no real money or external trading."

  #### C. **Concrete Timeline**
  *   **Dec 1-15:** Refine metrics, identify Core Expert Pool (internal + 3-5 externals), finalize market rules/thresholds, draft comms.
  *   **Dec Board Mtg:** Present modified plan for Board approval.
  *   **Jan 2-12:** Platform setup, expert training/briefing, seed markets with synthetic data.
  *   **Jan 15 - Feb 15 (4 weeks):** Prediction Markets OPEN. Weekly liquidity/participation reports to ED & Board Chair.
  *   **Feb 16:** Assess if thresholds met.
      *   *Thresholds Met:* Execute decision based on settled market prices.
      *   *Advocacy Market Thresholds NOT Met:* Initiate 1-week Expert Elicitation (Feb 19-23). Final decision by Feb 26.
  *   **Mar 1:** Announce 2024 Strategic Bet internally/externally (framed as strategic decision based on best available evidence/forecasting).

  ### III. Engaging the "Thin Market" Objection
  The concern that the advocacy market will be thin, untested, and bias the outcome is valid *if unaddressed*. Hanson's point about manipulation is secondary here; the core issue is **informational uncertainty leading to trader disengagement.** Here’s how the modifications tackle it head-on:

  1.  **Forcing Function for Liquidity:** Mandating participation from a qualified Core Expert Pool guarantees baseline liquidity and informed trading, directly countering the "no one will trade it" scenario. They have the expertise to price complex advocacy outcomes.
  2.  **Lowering Entry Barriers:** Seeding with synthetic data based on initial expert input provides starting anchors, reducing the "fear of the blank slate" that discourages trading in novel domains.
  3.  **Proxies Reduce Ambiguity:** Focusing on specific, measurable advocacy proxies (e.g., funding increases, policy adoption) makes the forecast target less nebulous than "advocacy success," making it easier to reason about and trade.
  4.  **Explicit Failure Mode & Fallback:** Acknowledging the thin market risk upfront and defining *precisely* what constitutes failure (via thresholds) prevents an untested market from dictating the outcome. The fallback (expert elicitation) provides a rigorous, auditable alternative specifically for the uncertain component. The bed-net market, likely robust, still provides valuable data.
  5.  **Parallel Markets Provide Diagnostics:** Seeing which specific advocacy proxies *do* attract liquidity (e.g., policy adoption vs. funding increase) offers valuable insight into where uncertainty is highest, informing the fallback elicitation if needed.

  ### IV. Conclusion
  The ED's proposal is a bold and potentially powerful application of collective intelligence. However, the thin-market risk for pandemic advocacy is profound and the "terrorism futures" parallel is a legitimate PR concern. **By mandating expert participation, defining clear success/failure thresholds for market validity, implementing robust fallbacks, and managing communications proactively, we can harness the benefits of prediction markets while mitigating their key weaknesses in this context.** The modified timeline allows for rigorous execution before the 2024 funding cycle.

  I recommend the Board approve the modified plan outlined above at the December meeting.

  **Attachments:**
  *   Draft Minimum Liquidity/Participation Thresholds
  *   Draft List of Advocacy Success Proxy Metrics
  *   Draft Internal Communications Script
  *   Draft Donor Briefing Talking Points

  ---

  **Key Strengths of this Approach:**
  *   **Directly Addresses Thin Markets:** Forces liquidity via experts, defines failure, provides backup.
  *   **Manages Reputational Risk:** Proactive comms, controlled access, clear framing.
  *   **Maintains Rigor:** Fallback (expert elicitation) is a valid methodology.
  *   **Timely & Actionable:** Concrete deadlines enable a Q1 decision.
  *   **Diagnostic Value:** Even if the advocacy market fails thresholds, the process yields insights.
  *   **Builds Consensus:** Offers a structured, transparent process addressing both sides' core concerns.
