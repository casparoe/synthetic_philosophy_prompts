answer: |-
  Here’s a dialogue between **WILLIAMS** (internalist) and **McDOWELL** (externalist), dissecting your brother-in-law’s stance through their philosophical clash. Each responds directly to the other’s last point, escalating the nuance:

  ---

  **WILLIAMS:**  
  Your brother-in-law’s position is coherent. If future people genuinely *don’t* connect to his "subjective motivational set" (S) — his desires, projects, commitments — then he has no *internal reason* to reduce emissions. Reasons only exist *for him* if sound deliberation *from his S* could lead him to act. If "caring about strangers in 2150" isn’t in his S, and no chain of reasoning *he’d accept* links it to what he *does* care about (e.g., his own comfort, his kids’ inheritance), then morally regrettable or not, he lacks a reason.

  **McDOWELL:**  
  But that assumes his S is static. Suppose he values being a "decent person" today. Sound deliberation could reveal that decency *requires* acknowledging duties to future people — even if he feels no current concern. His motivational set isn’t a cage; it’s a starting point for *recognizing* reasons outside it. If he dismisses future suffering as irrelevant, he’s not reasoning soundly — he’s morally blinkered.

  **WILLIAMS:**  
  "Blinkered" by *whose* lights? Yours? His deliberation *is* sound *relative to his S*. If "being decent" to him means only caring about living people, then "duties to the unborn" is your external imposition. You’re smuggling in an objective "should" — that he *ought* to expand his concerns. But "ought" requires a motivational hook. If he shrugs and says, "I define decency as present-focused," your "duty" is just noise to him.

  **McDOWELL:**  
  You’re rigging "sound deliberation" by reducing it to instrumental reasoning *within* existing desires. True deliberation can *restructure* S. Imagine a 19th-century doctor who values "healing" but initially sees no reason to sterilize tools — he can’t grasp germ theory. Through reasoned argument (evidence, implications for patients), he *develops* a new concern: hygiene. Similarly, your brother-in-law, valuing prudence or non-cruelty, could — via reasoning about climate impacts — *come to care*. If he refuses, it’s not that reasons are absent; it’s that he’s *failing* to reason.

  **WILLIAMS:**  
  Ah, but your doctor example *presupposes* he already cares about patient outcomes! If he were a sadist who enjoyed infections, no argument would motivate him. Likewise, your brother-in-law must *already* have a "seed" in S that climate concern could latch onto — say, valuing stability or disliking waste. But if his S is entirely self-contained — no kids, no legacy wishes, pure "me-now" — then your "prudence" or "non-cruelty" appeals *don’t connect*. Without that seed, you’re not restructuring S; you’re grafting an alien branch.

  **McDOWELL:**  
  You’re conflating *psychological impossibility* with *rational absence*. Even your "pure me-now" guy values things like avoiding jail or social scorn. If we show him emissions laws will tighten, or his peers condemn climate apathy, *that* becomes a reason — via his desire for freedom/approval. But deeper: if he’s *truly* devoid of any evaluative touchstone (prudence, consistency, empathy), then he’s not just amoral — he’s practically unintelligible as an agent. Reasons exist in the space of *shared rational norms*. His refusal isn’t proof that reasons vanish; it’s a failure of *sensitivity*.

  **WILLIAMS:**  
  "Shared rational norms" are your externalist mirage. Rationality is *personal*. If he says, "I know the science, I know future suffering, I just *don’t care*," he’s not irrational — he’s clear-eyed about his priorities. Social pressure? If he’s a hermit, that fails. Laws? He might evade them. You keep appealing to "norms," but norms only bind if he *accepts* them. Otherwise, they’re just descriptions of what *others* want him to do. His motivational set is the ultimate filter.

  **McDOWELL:**  
  Then let’s expose the stakes. Suppose he says: "I admit future people will suffer horribly due to emissions, and I could prevent some of it at minimal cost — but nah." On your view, this isn’t *unreasonable*; it’s just him being true to S. But that collapses morality into psychology. The horror *is* a reason — *full stop*. His indifference doesn’t negate it; it reveals a flaw in his *character*, not in the reason’s existence. Internalism makes morality hostage to contingent desires. Externalism says: some reasons *call* to us, even if we’re deaf.

  ---

  ### Where the Disagreement Lies
  - **WILLIAMS' CORE:** Reasons are *agent-relative*. If no path exists from a person’s existing motivations (S) to action X via sound reasoning (logic, facts, non-self-deception), then X isn’t a reason *for them*. Morality can’t command the motiveless.  
  - **McDOWELL'S CORE:** Reasons are *discovered*, not manufactured from desires. Sound deliberation isn’t just instrumental; it can *awaken* new motivations by revealing objective demands (e.g., avoiding catastrophe). Refusing to engage isn’t neutral — it’s a rational/moral failure.  

  **Your brother-in-law’s impasse**:  
  - **Williams says**: If he *truly* lacks any hook (pride in legacy, fear of being judged by today’s peers, love for descendants), you can’t "reason" him into caring. Coercion (taxes, laws) or persuasion (appealing to his existing values) are the only levers.  
  - **McDowell says**: His claim "I don’t care" is a *refusal to see*, not proof no reason exists. The suffering of future people *objectively* demands action — his indifference is a defect, like ignoring a drowning child because "it’s not my kid."  

  The debate isn’t settled — it’s about whether morality is *invented* by our desires or *imposed* by the world.
