  The user mentions their colleague’s experiments. Lab results show cooperation for several rounds. That’s key. Humans might value fairness, reciprocity, or doubt others' rationality. Or perhaps they’re risk-averse, avoiding the certainty of low payoffs early on. But the user’s background in evolutionary biology makes me think they’d appreciate parallels. In biology, strategies like Tit-for-Tat evolve because they exploit cooperative opportunities, unlike backward induction which assumes perfect rationality and common knowledge. 

  The user’s deeper concern seems to be the applicability of game theory models. They’ve spent years modeling cooperation evolution, seeing how reciprocity works in nature. Backward induction’s failure in labs might highlight a flaw in assuming common knowledge of rationality. In real life, such knowledge is rare. Players might test cooperation, hoping others aren't purely rational. 

  I should address whether this invalidates payoff maximization. Not entirely. Backward induction is logically sound under its assumptions. The issue is those assumptions—common knowledge of rationality—being unrealistic. Maybe the criterion isn’t flawed, but its application is limited. We need models that account for bounded rationality or social preferences. 

  Also, the user might conflate individual and collective rationality. Backward induction satisfies individual rationality but ignores Pareto improvements. This tension is fundamental in game theory, seen in Prisoner's Dilemmas. Perhaps the centipede game is another example where individual rationality leads to collective suboptimality, not a refutation of payoff maximization per se. 

  The user’s suspicion isn’t wrong; it’s a valid critique of classical game theory’s assumptions. But discarding payoff maximization entirely might be premature. Instead, refining models to include human elements—like inequality aversion or learning—could bridge the gap. Their evolutionary bio perspective might favor this: strategies evolve based on repeated interactions, not one-off games. 

