  ### Actionable API Design Guidelines
  *(Inspired by Chinese Room Argument & Linguistic Philosophy)*

  **1. Names as Semantic Directives:**
     - 🟢 **DO:** Choose verbs that specify actions (`saveTo`, `renderHtml`, `validateInput`)
     - 🛑 **DON'T:** Use vague terms (`process`, `handle`, `perform`)
     - *Why:* `user.saveTo(db)` clearly means "saves to DB", while `data.persist()` is ambiguous.

  **2. Parameters as Semantic Constraints:**
     - 🟢 **DO:** Use type enums for constrained values (`level=LogLevel.ERROR`)
     - 🟢 **DO:** Embed types in names when critical (`setTimeoutSeconds(30)`)
     - 🛑 **DON'T:** Rely only on docs for parameter meaning.

  **3. Fluent Pragmatics:**
     - 🟢 **DO:** Return `this` for fluent chaining (`return this;` in setters)
     - 🟢 **DO:** Design idempotent methods for safe reuse (`config.set(key, value)` over `config.apply()`)
     - 🛑 **DON'T:** Ignore common sequences (make set+save atomic if needed).

  **4. State Qualia Exposure:**
     - 🟢 **DO:** Provide accessors for important state (`user.getAge()`)
     - 🟢 **DO:** Emit events for critical changes (`user.onNameChanged()`)
     - 🛑 **DON'T:** Hide state behind opaque handles.

  **5. Error Consciousness:**
     - 🟢 **DO:** Throw typed exceptions (`throw new FileNotFoundError(path)`)
     - 🟢 **DO:** Attach stack traces automatically.
     - 🛑 **DON'T:** Return magic error codes (`return -5`).

  **6. Documentation as Semantics Clarifier:**
     - 🟢 **DO:** Document effects, not just parameters ("Deletes the file immediately" vs. "Params: path")
     - 🟢 **DO:** Note common pragmatics ("Often used with `setName` before saving").

  **The Ultimate Test:**  
  After design, ask: "Could a user grasp what `user.saveTo(db)` **does** just from the syntax?" If yes, you escaped the Chinese Room.

