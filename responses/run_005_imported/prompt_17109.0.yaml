  For the memo structure, I'll include sections on the purpose of the rule, the recommended language, application to the recent incident, and a direct response to the neutrality objection. I'll emphasize that the rule isn't about repackaging beliefs but about demonstrating how those beliefs inform governance decisions that affect everyone in the community.

