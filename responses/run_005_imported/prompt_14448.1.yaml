  I just read about David Lewis's modal realism, the idea that literally every possible world exists just as much as ours does. If thats true, doesnt it mean theres a version of me out there -- the actual same me -- who studied medicine instead of art and became a doctor? Kinda comforting to think another me is out there right now living that life.
