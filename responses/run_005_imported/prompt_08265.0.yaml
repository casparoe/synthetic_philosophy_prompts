prompt: |-
  Quick one — I'm interviewing a behavioral ecologist next week for a science-mag piece on animal signaling, and she's one of the last researchers who'll still defend Zahavi's handicap principle by name (peacock trains, stotting gazelles, the greatest hits). I don't want the piece to read like the textbook version everyone's already seen a thousand times ("cost enforces honesty," done). Can you draft me 7-8 pointed interview questions, each with a short note on the answer she's likely to give and then a sharper follow-up to that specific answer? I want at least one question on whether Grafen's famous 1990 model actually needs the cost to be wasteful in an absolute sense, or just relatively higher for low-quality males (theres apparently a whole literature, including a paper basically titled "an erroneous hypothesis," arguing Grafen's math never really backed Zahavi up in the first place); one on signals that stay honest even at zero or negative cost in the newer trade-off models; and one on where uncheatable "index" signals, like a stag's roar pitch, fit in, since nobody thinks those work by being wasteful.
