  - The student explains why more than one probability function is involved (conditioning on B and ¬B gives two new probability functions).

  This is a good sketch. However, one minor issue: the student says "this has to hold not just of P itself but of any probability function reachable from P by conditioning" and calls it a requirement to avoid the Thesis being an "accident". This is a bit vague. Lewis's proof requires that Stalnaker's Thesis holds under every conditioning (or at least under conditioning on B and ¬B). The student does note this, but the phrasing is a bit informal. However, it is acceptable for a sketch.

  Score: 5/5 (the sketch is accurate and clear)

  Part (c): The student defines triviality: a probability function is trivial if there are no three pairwise incompatible events (A&B, A&¬B, ¬A) each with positive probability, which is equivalent to the sample space having at most two points. The student explains that this is too restrictive for realistic credence functions. Then, the student connects this to the problem for indicative conditionals being ordinary propositions: if they are, then we can ask for their probability, but the triviality result shows that this leads to triviality unless we give up on that.

  Evaluation:
