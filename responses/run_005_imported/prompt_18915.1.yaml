  2. Choose A and B such that A&B, A&¬B, ¬A have positive probability.
  3. Condition on B: then P(B|A) = 1, so by Stalnaker's Thesis for the conditioned function, P(A>B | B) = 1.
  4. Condition on ¬B: then P(B|A)=0, so P(A>B | ¬B)=0.
  5. By law of total probability: P(A>B) = P(B)*1 + P(¬B)*0 = P(B).
  6. Then by Stalnaker's Thesis for the original P: P(B|A) = P(A>B) = P(B), so A and B are independent.

  The student also notes that this must hold for any such pair A, B, which is impossible for a non-trivial probability function.

