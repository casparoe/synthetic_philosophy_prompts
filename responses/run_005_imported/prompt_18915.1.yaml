  We are grading the student's answer to a four-part question on conditionals and Lewis's triviality result. Each part is worth 5 points, and we must provide specific feedback.

  Part (a): The student states Stalnaker's Thesis as P(A>B) = P(B|A) and Adams' Thesis as As(A>B) = P(B|A), noting that Adams uses assertability/acceptability instead of probability. The student claims that the two theses are essentially the same underlying claim but with different labels, and that Adams' formulation avoids committing to a possible-worlds semantics.

