prompt: |-
  As a longtime reader of LessWrong and Astral Codex Ten, I've noticed that "Goodhart's Law" gets invoked constantly, almost always in its pithy, quotable form: "when a measure becomes a target, it ceases to be a good measure." That line is usually attributed to Goodhart himself, though as far as I can tell it actually comes from the anthropologist Marilyn Strathern's writing on academic audit culture, not from Goodhart's own 1975 work on UK monetary policy, where the original point was considerably narrower and more technical. Chasing this down made me notice something else that bothers me: people in this space tend to use "Goodhart's Law" and "Campbell's Law" almost interchangeably, as though Donald Campbell's remarks about the corruption of social indicators were simply the sociological cousin of the same insight Goodhart had about monetary aggregates. The more I sit with the two original formulations side by side, the less sure I am that they're actually making the same claim.

  I'd like you to work through this properly rather than wave at a resemblance. Please compare Goodhart's Law and Campbell's Law as their authors originally framed them, not the composite folk version that circulates under Goodhart's name. Do the two laws describe a single underlying mechanism by which a metric decouples from the thing it was meant to track once it comes under optimization pressure, or are they pointing at genuinely different mechanisms that happen to produce a similar-sounding warning? I'd like you to use Scott Garrabrant's four-part "Goodhart Taxonomy" (regressional, causal, extremal, and adversarial Goodhart) -- the framework that gets cited constantly in AI-safety discussions of specification gaming -- as a tool for actually settling this rather than just gesturing at it. Does Campbell's Law drop neatly into one of Garrabrant's four buckets (my own tentative guess is adversarial, since Campbell's central worry is the people being measured deliberately corrupting the indicator, whereas Goodhart's monetary-policy example seems more structural), or does Campbell's original formulation carry an emphasis that doesn't sit comfortably in any of the four categories? Please reach an actual verdict and defend it -- "they're basically the same idea," which is the answer I keep getting whenever I bring this up with friends, won't do.
reasoning: |-
  Okay, let's tackle this user's query. They're clearly well-versed in the LessWrong and ACX communities, noticing how Goodhart's Law is often cited in its simplified form. They've dug into the origins, realizing that the common quote actually comes from Marilyn Strathern, not Charles Goodhart. Plus, they're bothered by the conflation of Goodhart's Law with Campbell's Law. They want a detailed comparison of the original formulations, not the folk versions, and specifically to analyze them using Garrabrant's taxonomy.

  First, I need to recall the original contexts. Goodhart's 1975 paper was about monetary policy. He argued that once the government targets a specific monetary aggregate (like M3) to control inflation, market behavior changes, making that measure unreliable. This seems structural—no malicious intent, just adaptive responses. On the other hand, Campbell's 1976 work focused on social indicators. He emphasized that when metrics are used for decision-making, people might game the system, leading to corruption of the indicator. His examples include teachers cheating on tests or hospitals avoiding high-risk patients. So, intent and deliberate manipulation are central here.

  Next, applying Garrabrant's taxonomy. The four categories are regressional, causal, extremal, and adversarial. Goodhart's example fits regressional Goodhart: the correlation breaks under optimization because the proxy wasn't perfect. Campbell's Law, however, involves active gaming—people altering their behavior to hit the target, which aligns with adversarial Goodhart. But the user suspects this too. I should check if Campbell's emphasis on systemic perverse incentives adds something beyond adversarial. For instance, when Campbell talks about "corruption," it's not just individuals cheating but systemic pressures creating unethical behavior. That might not fully fit Garrabrant's adversarial category, which is more about individual bad actors.

  The user wants a clear verdict. They’ve heard "they're the same" but aren't satisfied. So, differentiating the mechanisms is key. Goodhart’s is about statistical breakdown under intervention (regressional), while Campbell’s is about strategic manipulation (adversarial). Also, Campbell’s focus on social systems and ethical decay might introduce elements not covered in the taxonomy. For example, the societal impact when institutions prioritize metrics over mission. That’s a nuance Garrabrant’s model might not capture, as it's more about optimization failures than ethical degradation.

  I should also address the user's note about Strathern's quote. Since they pointed out the misattribution, acknowledging that the popular version is a simplification. But the core of their query is comparing the original laws. Emphasize that while both warn about metrics failing under pressure, the mechanisms differ: structural vs. intentional, statistical vs. behavioral.

  Finally, structure the response: start with each law's origin, break down Garrabrant’s categories, classify each law, discuss where Campbell might not fit, and conclude with the verdict. Make sure to defend why they’re distinct despite surface similarities.
answer: |-
  Your skepticism is well-founded—Goodhart's and Campbell's Laws are **fundamentally distinct phenomena** that share only a superficial resemblance. Using Garrabrant's taxonomy reveals their divergent mechanisms, and Campbell's original formulation introduces ethical dimensions that escape strict categorization within the four Goodhart variants. Here's a systematic breakdown:

  ### 1. **Original Framings: Core Differences**
     - **Goodhart's Law (1975)**: Focused on **monetary policy control systems**. Goodhart observed that any *statistical regularity* (e.g., correlation between money supply M3 and inflation) breaks down when policymakers attempt to *control* inflation by targeting M3. Market agents adapt unintentionally (e.g., shifting to untracked financial instruments), invalidating the historical correlation. **Mechanism:** Optimization exploits imperfect proxies due to changing distributions.  
     - **Campbell's Law (1976)**: Arises from **social science evaluation**. Campbell warned that when quantitative social indicators (e.g., test scores, crime rates) become targets for *rewarding/punishing institutions*, they corrupt the very social processes they measure. People *strategically manipulate* the system (e.g., teaching to the test, falsifying crime reports). **Mechanism:** Actors with skin in the game deliberately distort inputs or processes to meet targets.

  ### 2. **Garrabrant's Taxonomy Applied**
     - **Regressional Goodhart**: Occurs when a proxy metric works at the mean but fails under optimization due to *noise or imperfect correlation* (e.g., targeting cholesterol levels ignores other heart disease factors).  
       - *Goodhart Fit*: **Yes**—His monetary example is a textbook case: M3 was a noisy proxy for inflation, and optimization revealed hidden variables.  
       - *Campbell Fit*: **No**—Campbell's corruption isn't statistical noise; it's *motivated gaming*.

     - **Causal Goodhart**: Optimizing a proxy metric inadvertently *causes harmful side effects* (e.g., boosting sales by spamming customers wrecks brand reputation).  
       - *Goodhart Fit*: Indirectly—Market shifts are side effects, but not his focus.  
       - *Campbell Fit*: **Partial**—Campbell includes side effects (e.g., schools cutting arts programs to focus on tested subjects), but core corruption is deliberate.

     - **Extremal Goodhart**: Pushing a metric to extremes exploits *nonlinearities* (e.g., maximizing protein intake harms kidneys).  
       - *Goodhart Fit*: Unlikely—His work assumes linear policy responses.  
       - *Campbell Fit*: **No**—Not about mathematical extremes; it's about perverse incentives.

     - **Adversarial Goodhart**: Actors *intentionally exploit loopholes* in the metric (e.g., generating clickbait to hit engagement targets).  
       - *Goodhart Fit*: **No**—Agents in his model aren't adversarial; they react neutrally to incentives.  
       - *Campbell Fit*: **Primary alignment**—Teachers "teaching to the test" or hospitals "upcoding" diagnoses are adversarial responses.

  ### 3. **Verdict: Divergent Mechanisms, with Campbell Transcending the Taxonomy**
     - **Goodhart's Law** is **regressional**: It describes a *statistical breakdown* when a proxy is optimized, arising from hidden variables and distributional shifts.  
     - **Campbell's Law** is **adversarial + ethical**: It centers on *strategic manipulation by self-interested actors* within institutional power structures.  

  Crucially, **Campbell adds two dimensions Garrabrant's taxonomy omits**:  
     - **Systemic Perversity**: Campbell emphasizes how metric corruption *erodes institutional missions* (e.g., education reduced to test prep).  
     - **Ethical Decay**: He highlights *demoralization* when professionals (e.g., teachers, police) are forced to game metrics against their values.  

  ### Why the Conflation Happens
  The folk version of Goodhart ("when a measure becomes a target...") is broad enough to subsume Campbell's concerns. However, **collapsing them obscures key distinctions**:  
  - Goodhart warns of *unintended breakdowns* in predictive validity.  
  - Campbell warns of *deliberate subversion* driven by accountability pressures.  
  Campbell’s work is sociological and moral; Goodhart’s is econometric.  

  **Conclusion**: They describe **different failure modes**. Goodhart’s Law is a *statistical pitfall* (regressional Goodhart), while Campbell’s Law is a *behavioral pathology* (adversarial Goodhart plus institutional ethics). Treating them as interchangeable ignores Campbell’s focus on human agency and systemic decay—elements essential to understanding real-world metric corruption. Your intuition is correct: Campbell’s emphasis on *motivated gaming* makes it adversarial, but his broader critique of *social systems under pressure* demands a lens beyond Garrabrant’s technical taxonomy.
