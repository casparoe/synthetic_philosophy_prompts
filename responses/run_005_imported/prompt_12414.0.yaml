  Here’s a toast that threads the needle: warm for family, slyly technical for philosophers, and neutral while celebrating their love. (Runtime: ~5 minutes, with pauses)

  ---

  **(Clink glass gently)** Friends, family, philosophers disguised as friends and family… thank you for gathering to celebrate Priya and Dev. Truly. As one of their oldest friends from undergrad, I’ve had a front-row seat to this… *remarkable* partnership. And I use that word deliberately.

  When I first met Priya and Dev, we were all wrestling with the big questions: "What’s for dinner?" "Is this paper due tomorrow?" "Can we *really* justify another cup of dining hall coffee?" You know, the classics. But even then, Priya and Dev stood out. While the rest of us were debating pizza toppings, they were debating… well, let’s just say the *stakes* of their conversations always felt a little higher. A little more… *existential*.

  Priya, with her fierce intellect and unwavering conviction. Dev, with his sharp wit and relentless drive to find a more elegant solution. I’ve watched them challenge each other, sharpen each other, and yes, passionately debate ideas most of us only encounter in very specific, possibly intimidating, academic journals. Their shared passion for understanding *how we ought to value lives* – how to build a better world, fundamentally – isn’t just academic. It’s woven into who they are. It’s the spark in their eyes when they talk, the energy that fills a room… or occasionally clears one at a party when someone mentions Arrhenius. *(Small chuckle, glance at philosopher friends)*.

  And here’s the beautiful thing about Priya and Dev: Their greatest strength isn't just their individual brilliance. It's how they navigate their differences. They don't just talk *at* each other; they build *with* each other. They find the common ground, the shared values beneath the complex models. Because at the end of the day, whether you're firmly Team More-Lives-Lived-Well-Enough or firmly Team Fewer-But-Exceptionally-Great-Lives... *(Pause, slight smile for the philosophers)* ...what underpins both views, what underpins *everything* they do, is a profound, shared commitment to *making life better*. To compassion. To reducing suffering. To creating joy.

  **Now, for those of you wondering what on earth I'm talking about** – don’t worry! Think of it like this: Priya and Dev are the couple who will spend hours meticulously planning the *most* ethical, sustainable, and delicious menu for a dinner party… and then also passionately debate whether inviting *more* guests with slightly simpler meals is ultimately a better outcome than having *fewer* guests with truly spectacular feasts. It’s about scale, value, and how you measure the goodness of an outcome. *(Pause, turn back to the couple, warmer tone)*. It’s about caring deeply about the impact of their choices.

  **And here’s where I get to my one slightly nerdy observation** – and Priya, Dev, I promise this is said with love and only *minimal* scheming. Watching you two navigate life’s big decisions – from where to live, to careers, to… well, *future family planning*… has been fascinating. Because suddenly, those high-stakes theoretical debates about whether adding more lives with sufficient well-being is always preferable, or whether there’s a critical threshold of flourishing you simply *must* meet first… **(Pause for effect, look between them with a knowing, affectionate smile)** …let’s just say they take on a wonderfully concrete, deeply personal dimension when you’re the ones potentially *doing* the adding, and responsible for ensuring the flourishing. It’s the ultimate real-world test case. And frankly, seeing how you lovingly negotiate *everything* else, I have no doubt you’ll approach that particular optimization problem – should you choose to undertake it – with the same blend of rigorous analysis, deep compassion, and unwavering teamwork that defines you both. Though Dev, I suspect Priya might keep a running tally… *(Light chuckle)*.

  **(Shift to deeply sincere tone)** But jokes about utility functions aside, what truly defines Priya and Dev’s relationship isn’t the debates, it’s the love that fuels them. It’s the way Dev looks at Priya like she just solved an impossible theorem. The way Priya’s whole face lights up when Dev walks into the room. It’s the quiet support, the shared laughter, the deep respect that forms the bedrock of their partnership. They challenge each other intellectually, yes, but they also lift each other up, comfort each other, and create a world together where *both* of them thrive – spectacularly.

  They’ve found in each other not just a partner, but a true intellectual equal, a best friend, and the love of their life. They prove that deep difference and profound unity aren’t opposites; they can be the very ingredients of an extraordinary marriage.

  **So, let’s raise our glasses:**

  To Priya and Dev! May your life together be filled with profound joy, deep meaning, and flourishing that surpasses even your most optimistic models. May you continue to challenge and inspire each other, build a world of love and laughter together, and navigate every future population – whether theoretical or literal – with the same wisdom, grace, and boundless affection you show each other every single day.

  To Priya and Dev!

