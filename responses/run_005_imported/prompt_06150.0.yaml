  I've spent years following the suffering-focused-ethics strand of the rationalist and EA blogosphere, and I've booked a podcast guest who defends a considered negative utilitarianism — not the crude 'only suffering counts' view, but a lexical threshold position on which suffering below some intensity trades off against happiness while suffering past that threshold can't be outweighed by any amount of it. Draft eight to ten interview questions that go beyond having her restate the position: I want one on R. N. Smart's old 'world-destruction' rejoinder to Popper — the argument that a consistent negative utilitarian should prefer painlessly ending all sentient life to any positive alternative — and whether a threshold view actually blocks that argument or just relocates which bullet she has to bite; one on what, besides raw intuition, could justify locating the threshold exactly where she puts it; and one on whether the asymmetry commits her to ranking s-risk reduction above extinction-risk reduction, given that a larger, longer-lived future multiplies the potential for suffering as much as for happiness. For each, add a follow-up keyed to the answer she's most likely to give.
