answer: |-
  You've pinpointed the core tension: the Humean needs chance to be both an *objective*, history-supervenient feature *and* a *practical guide* for non-omniscient agents. The "New Principle" (NP) and Thau-style admissibility fixes *appear* to resolve the formal contradiction generated by undermining futures. However, a strong skeptical case argues they do so at the unacceptable cost of **evacuating chance of its essential epistemic function**, precisely because they require conditionalizing on information far beyond what any non-omniscient agent possesses. Here's the argument, addressing the key Humean rejoinder:

  **The Skeptical Case: Relocating, Not Solving, the Bug**

  1.  **The Core of the Bug:** The original Principal Principle (PP) demands that if an agent at `t` knows the *entire past history up to t (H_t)* and knows the *chance of A at t is x (C_t(A) = x)*, then their credence in A should be x: `Cr(A | H_t ∧ C_t(A)=x) = x`.
  2.  **Undermining:** The BSA makes `C_t(A)=x` depend on the *entire* world history, including the future. An undermining future `F_u` is one where:
      *   `C_t(F_u) > 0` (The chances at `t` say `F_u` has a positive probability of happening).
      *   But if `F_u` *did* occur, the best system fitting the *actual* entire history (including `F_u`) would entail `C_t*(A) ≠ x` (or perhaps `C_t*(F_u) = 0`!), meaning the proposition `C_t(A)=x` would be *false* in the world where `F_u` occurs.
  3.  **The Contradiction:** Apply PP to `F_u` itself. `Cr(F_u | H_t ∧ C_t(F_u)=y) = y > 0`. But simultaneously, if `F_u` were true, `C_t(F_u)=y` would be false. This creates a conflict: PP tells the agent to have positive credence in a future that, if actual, would make the very chance statement they conditionalized on false. Worse, it can lead to probabilistic incoherence (Dutch books).
  4.  **The Humean Fix (NP/Thau):** The solution is to conditionalize not just on `H_t` and `C_t(A)=x`, but on the **entire theory of chance (T)** at the world, *or* equivalently, restrict admissibility to exclude information that screens off the future's impact on what `T` is.
      *   **Lewis's New Principle (NP):** `Cr(A | H_t ∧ T) = T(A)` (where `T(A)` is the chance of A according to theory T).
      *   **Thau-style Admissibility:** Revise PP to `Cr(A | E ∧ C_t(A)=x) = x` only if `E` is *admissible* relative to `C_t(A)=x`. Crucially, **admissibility now requires `E` to include (or not conflict with) whatever fixes what the correct chance theory `T` is**, even if that involves facts beyond `t`. Information about `T` itself is always admissible.
      *   **Formal Resolution:** Conditionalizing on `T` (or making information about `T` admissible) blocks the contradiction. If you know `T`, you know the *actual* chances, period. You know whether `F_u` is undermining or not. If `T` says `C_t(F_u)=y>0`, then `F_u` *is* compatible with `T` being true – `F_u` occurring *wouldn't* make `T` false. Undermining futures only exist relative to *misdescriptions* of the chance facts (like just asserting `C_t(A)=x` without specifying `T`). Knowing `T` settles everything.

  **The Skeptical Objection: The Epistemic Cost**

  The formal fix works *only if agents can conditionalize on `T` or possess admissible information equivalent to knowing `T`*. This is the fatal flaw:

  1.  **`T` is Too Strong:** `T` is the *entire, complete, true theory of chance for the whole world throughout all time*. Knowing `T` means knowing the complete Humean mosaic (past, present, *and future*) *or* knowing the complete functional description (the BSA winners) that supervenes on it. **`T` encodes the entire structure of the universe.**
  2.  **Chance Loses its Guidance Function:** The *whole point* of the Principal Principle is to explain how knowledge of *chance* (a relatively compact piece of nomological information) can and should guide the credences of agents who are *ignorant* of the vast majority of particular facts, *especially the future*. PP makes chance epistemically fundamental for non-omniscient agents.
      *   **NP/Thau Requirement:** To set rational credences using NP/Thau-PP, an agent must conditionalize on `T` or possess information admissible relative to `T`.
      *   **Consequence:** Rational credence now requires knowing (or having admissible information equivalent to knowing) the *entire theory of chance `T`*.
      *   **Problem:** **Knowing `T` is tantamount to near-omniscience about the world's structure and history.** If an agent knows `T`, they already know *whether `A` will happen or not*, or at least, they know the *complete, final blueprint* from which everything else follows. Chance, on this picture, becomes **epistemically redundant**. Why bother with `T(A)` when you already know `T`? The agent doesn't *need* chance to guide their credence about `A`; they can (in principle) read `A`'s truth value directly off `T` and the mosaic, or calculate it from the fundamental laws/dynamics encoded in `T`.
  3.  **The Relocated Bug:** The formal contradiction is resolved, but **the bug is relocated from the consistency of the theory to its *explanatory adequacy*.** Humeanism promised an account of chance that is both metaphysically minimal (supervenient on particular matters of fact) *and* capable of playing the core epistemic role attributed to chance (guiding reasonable partial belief under uncertainty). NP/Thau saves metaphysical consistency but sacrifices the epistemic role. Chance no longer *guides* non-omniscient agents; it merely *summarizes* the world for agents who already know (or must know) almost everything relevant. This fails to capture what chance is *for*.

  **Addressing the Key Humean Rejoinder: "Admissibility is Only Pre-t Information!"**

  The natural Humean rejoinder is: *"You misunderstand admissibility! For NP/Thau-PP, admissibility is defined purely in terms of information about events at or before `t`. Knowing `H_t` and the correct `T` is sufficient, and `T` itself is a feature fixed by the entire world, but we don't need to *know the future* to know `T`; `T` is determined by the entire world, but *information about `T` itself* is always about a feature of the world that exists *at `t`* (it's a fact about the global patterns). We conditionalize only on `H_t` and the proposition `C_t(A)=x` (or `T`), which are both facts true *at `t`*. There's no illicit forward reference!"*

  **Why This Rejoinder Fails to Save the Epistemic Role:**

  This rejoinder successfully defends the *metaphysical coherence* and *formal consistency* of the view. Facts about `T` *are* facts "at `t`" in the sense that they are timeless facts supervening on the entire history. However, it **does nothing** to address the **epistemic problem** for the non-omniscient agent:

  1.  **Knowing `T` is Still the Requirement:** The NP/Thau-PP *still dictates* that for `Cr(A | E ∧ C_t(A)=x) = x` to hold, `E` must include (or be admissible relative to, meaning compatible with) the complete truth about `T`. **Rational credence requires the agent's background information `E` to include the proposition specifying *what the true `T` is***.
  2.  **The Impossibility for Non-Omniscient Agents:** How does a *real*, non-omniscient agent *at `t`* come to know the proposition `T`? `T` is the complete, true, best system summary of the *entire* Humean mosaic. To know `T` at `t` requires knowing the complete set of global patterns that best systematize *all* events – past, present, *and future*. **This is information fundamentally inaccessible to any agent prior to the end of time.**
      *   **Dilemma for the Humean:**
          *   **Option 1 (No Knowledge of `T`):** If the agent doesn't know `T` (which is the normal case), then NP/Thau-PP *does not apply*. They cannot rationally set `Cr(A) = x` based *only* on knowing `H_t` and `C_t(A)=x`, because `C_t(A)=x` alone is inadmissible without `T`. The principle offers *no guidance* in the standard situation where agents have limited knowledge. Chance loses its normative force for actual epistemic agents.
          *   **Option 2 (Partial/Approximate Knowledge of `T`):** Perhaps agents work with their *best estimate* of `T`, `T_est`, based on `H_t`. But then we are back to the original problem! `T_est` is determined by `H_t`. `T_est` will assign chances. But `T_est` is fallible; the actual future might undermine it. `T_est` might assign positive probability to futures that would make `T_est` false. Applying NP using `T_est` (`Cr(A | H_t ∧ T_est) = T_est(A)`) still risks the agent having positive credence in futures that would undermine `T_est`. The contradiction re-emerges at the epistemic level for the agent using `T_est`. The formal fix only works for the omniscient knower of the *actual* `T`.
  3.  **The Role of Chance Undermined:** The whole rationale for positing objective chance is to have something that constrains rational credence *in the absence of complete knowledge of the world's structure and future*. If rational credence using chance *requires* knowing the complete world structure (`T`), then **chance is not playing its defining role.** It becomes an idle wheel in the epistemology of non-omniscient agents. The PP was meant to *connect* limited knowledge of the nomological (`C_t(A)=x`) to rational credence. NP/Thau severs this connection unless the agent possesses near-complete nomological knowledge (`T`), which is precisely the kind of knowledge chance was supposed to *substitute for*.

  **Conclusion: The Unrepaired Bug**

  Lewis and Thau successfully blocked the formal contradiction inherent in the original PP under Humeanism by demanding that rational credence conditionalize on the complete chance theory `T` or information admissible relative to it. However, this victory is Pyrrhic. The requirement to conditionalize on `T` reduces chance to an epiphenomenal summary, stripping it of its essential function: **to provide an objective, accessible guide to uncertainty about the future for agents who lack knowledge of the total world history and structure.**

  The skeptic argues that the "big bad bug" was never just a formal contradiction; it was the tension between Humean metaphysics and the *epistemic role* of chance. The NP/Thau fixes resolve the former but exacerbate the latter. They relocate the bug from the logic of chance to its very *point*. For the non-omniscient agent – the only kind for whom chance matters – Humean chance, even under the New Principle, fails to provide the normative guidance it promises. The necessitarian advantage remains: their chances (grounded in irreducible modalities, powers, or necessitation relations) *can* directly guide credence without requiring the agent to first know the complete theory of everything. The Humean cannot replicate this without smuggling in a form of omniscience. The bug, in its most profound form, persists.
