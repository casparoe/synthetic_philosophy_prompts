  Throughout, I'll maintain the scholar's voice: impatient with economic illiteracy but lighting up when explaining Hume's overlooked insights. The radio format allows for crisp rebuttals - "My dear host!" - before launching into precise exegesis. The goal is to make the audience feel Hume's relevance while seeing why his world can't map perfectly onto ours.
answer: |-
  Here’s a precise reconstruction of Hume’s arguments applied to your debates, highlighting both relevance and friction with modernity, followed by a Humean verdict:

  ### 1. **Tariffs & Trade Deficits: Hume’s Rebuttal**
     - **Core Mechanism:** Hume’s *price-specie-flow mechanism* ("Of the Balance of Trade") dismantles mercantilist fixation on deficits. If Nation A runs a trade surplus with Nation B, gold/silver (specie) flows *into* A. This inflates prices in A (more money chasing goods), making its exports dearer and imports from B cheaper. Simultaneously, specie outflow in B deflates prices, making *its* exports cheaper and imports dearer. Trade self-corrects: A’s surplus evaporates as B’s goods become more attractive. **Tariffs to "fix" deficits are thus self-defeating folly.**  
     - **Zero-Sum Fallacy:** In "Of the Jealousy of Trade," Hume explicitly rejects the idea that a neighbour’s gain is your loss: *"The encrease of riches and commerce in any one nation, instead of hurting, commonly promotes the riches and commerce of all its neighbours."* Prosperity spreads via emulation, knowledge transfer, and demand for complementary goods. Bilateral deficits are transient and irrelevant to national strength.  
     - **Modern Friction:**  
       - **Money ≠ Specie:** Hume’s mechanism relied on physical gold/silver moving between nations. Today, money is largely electronic, created by central banks. Capital flows (investments, loans) dwarf trade flows, decoupling trade balances from domestic money supply.  
       - **Floating Exchange Rates:** Currencies adjust instantly, potentially offsetting price effects Hume expected from specie flows. A tariff might simply strengthen the importer’s currency, negating its intended effect.  
       - **Mercantilist Resurgence:** Hume would see modern "trade war" rhetoric as a tragic regression to the very "jealousy" he condemned – mistaking transient accounting imbalances for national peril.

  ### 2. **Sovereign Debt Expansion: Hume’s Dread**
     - **Inherent Peril:** "Of Public Credit" is a Cassandra cry. Hume saw public debt as a "dreadful" "incumbrance," a "ruinous" practice mortgaging the future. His core anxieties:  
       - **Moral Hazard:** Easy credit tempts rulers into wars and extravagance without immediate tax pain: *"The practice of contracting debt will almost infallibly be abused, in every government."*  
       - **Economic Burden:** Servicing debt diverts taxes from productive use (infrastructure, defense) to idle bondholders: *"must weaken the state... and render it impotent and contemptible."*  
       - **Political Instability:** Eventually, crushing taxes or default become inevitable, risking revolution or foreign conquest: *"either the nation must destroy public credit, or public credit will destroy the nation."*  
       - **Intergenerational Injustice:** Debt is *"a tax upon posterity,"* forcing future generations to pay for past consumption.  
     - **Modern Friction:**  
       - **Perpetual Refinancing:** Hume assumed debt must eventually be repaid. Modern governments largely roll it over indefinitely via bond markets.  
       - **Central Banking & Fiat Money:** Central banks (unimaginable to Hume) can suppress interest rates via quantitative easing (buying debt with electronically created money), masking sustainability concerns. Low rates post-2008 enabled massive debt growth without (yet) triggering Hume’s predicted crisis.  
       - **Global Demand for Safe Assets:** US/EU/Japanese debt is absorbed by global investors & institutions as "safe assets," creating demand Hume couldn’t foresee, potentially delaying his reckoning.  
     - **Hume’s Unanswered Fear:** Even with modern tools, Hume would ask: What happens when debt service *does* crowd out essential spending? When demographics (aging populations) strain budgets further? When faith in perpetual refinancing wavers? His warning about political decay and ungovernability resonates amidst modern polarization fueled by fiscal choices.

  ### Humean Verdict on Sovereign Debt (in Idiom):
  *"Consider well, Sir, this monstrous Engine of State we have constructed – this Pyramidal Debt, built not of stone but of Promises. We tax not the Present, but the Unborn; we feast today, and leave the reckoning to strangers who inherit only our I.O.U.'s and our Folly. A Nation thus mortgaged may long deceive itself with the jugglery of low Interest and rolling Loans, yet depend upon it, Nature and Credit have their Limits. When the faith of Lenders falters – as falter it must when the Weight of Promise crushes the Pillars of Production – then shall we discover, too late, that Paper is but Paper, and that the only true Revenue is the honest Fruit of Labour drawn from a Soil not yet exhausted by the Extravagance of the Past."*

  ### For Your Scene:
  Have your scholar stress:
  1. **Hume’s dynamic optimism on trade** vs. modern protectionist "jealousy."
  2. **His profound pessimism on debt** as a slow poison, contrasting modern complacency enabled by central banking.
  3. **The irony:** Hume’s free-trade insights remain *more* applicable today (given global supply chains) than his debt fears seem (due to modern finance). Yet his debt warnings probe deeper – questioning not just economic mechanics, but political virtue and intergenerational justice. The friction lies not in his logic, but in our ability to indefinitely suspend his natural consequences via financial innovation. The radio host’s "parlour trick" reveals a thinker whose economic vision was radical for rejecting mercantilism, yet conservative in fearing the state’s capacity for self-destructive abstraction – a tension very much alive today.
