  On sovereign debt, Hume's warnings about "taxation upon posterity" and the temptation of perpetual debt feel prophetic post-2008. Yet he couldn't foresee central bank tools like quantitative easing. The key is showing how his fundamental worry about political weakness remains relevant despite changed mechanics.

