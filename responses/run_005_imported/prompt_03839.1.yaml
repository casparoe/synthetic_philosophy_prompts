prompt: |-
  I'm a retired physical chemist (spent most of my working life on catalysis) and since hanging up my lab coat a couple of years back I've been slowly working through the philosophy canon I never had time for. Lately that's meant Hume's economic essays, which I find oddly comforting to read, because he's obviously thinking like someone trying to isolate mechanisms in a messy system, which was very much my old bread and butter. Right now I'm stuck on a bit near the end of "Of Interest" (one of the 1752 Political Discourses) that I've read about five times now and I still dont feel like I've got the logic fully pinned down.

  Here's the bit, quoted in full, old spelling and all:

  "For suppose a nation removed into the Pacific ocean, without any foreign commerce, or any knowledge of navigation: Suppose, that this nation possesses always the same stock of coin, but is continually encreasing in its numbers and industry: It is evident, that the price of every commodity must gradually diminish in that kingdom; since it is the proportion between money and any species of goods, which fixes their mutual value; and, upon the present supposition, the conveniencies of life become every day more abundant, without any alteration in the current specie. A less quantity of money, therefore, among this people, will make a rich man, during the times of industry, than would suffice to that purpose, in ignorant and slothful ages. Less money will build a house, portion a daughter, buy an estate, support a manufactory, or maintain a family and equipage. These are the uses for which men borrow money; and therefore, the greater or less quantity of it in a state has no influence on the interest. But it is evident, that the greater or less stock of labour and commodities must have a great influence; since we really and in effect borrow these, when we take money upon interest. It is true, when commerce is extended all over the globe, the most industrious nations always abound most with the precious metals: So that low interest and plenty of money are in fact almost inseparable. But still it is of consequence to know the principle whence any phenomenon arises, and to distinguish between a cause and a concomitant effect."

  What's tripping me up is that last move. He spends the whole paragraph building this isolated-island thought experiment just to pry interest apart from the quantity of money, then immediately turns around and concedes that out in the real world the two are "almost inseparable" anyway - and somehow still thinks he's entitled to call money a mere "concomitant effect" rather than a genuine cause of low interest. That smells a lot like controlling for a confound in an experiment, which is very familiar ground for me, but I don't want to just be projecting my own training onto an 18th century text that might be doing something else entirely. So: is that actually the right way to read what's going on here, and if so, is Hume drawing on some more general rule for telling causes apart from mere concomitants that he sets out elsewhere (I have a dim memory of something like this from when I fought my way through Book 1 of the Treatise years ago), or is this essay just improvising its own logic on the spot? And stepping back a bit further - does the island thought experiment actually earn him the cause/concomitant distinction he wants, or is there a gap in the reasoning that a good philosopher (or scientist) ought to be uneasy about? I'd really appreciate a careful, step-by-step walkthrough of the argument rather than the standard gloss on Hume-and-the-quantity-theory-of-money that you'd get from an economics textbook.
