  I recall that average utilitarianism has serious flaws. The Mere Addition Paradox is one. Adding happy people to a happy world shouldn't make things worse, but under average utilitarianism, it does because the average drops slightly. That's counterintuitive. Also, the extinction problem: if one person exists with high welfare, adding even a moderately happy person lowers the average, making it wrong to have more kids. That's absurd because we usually think creating happy lives is good.

