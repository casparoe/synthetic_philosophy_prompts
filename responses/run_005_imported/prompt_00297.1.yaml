  Ok so I've been reading about Parfit's repugnant conclusion, and it seems like the fix is just obvious: switch from total utilitarianism to average utilitarianism, then adding a bunch of barely-worth-living lives can't drag things down since your just averaging welfare instead of summing it. Given that, why do population ethicists still treat this as some deep unsolved problem instead of just adopting the average view and moving on?
