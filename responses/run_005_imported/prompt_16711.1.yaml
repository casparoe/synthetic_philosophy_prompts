  - The opponent’s earlier passes must be mistakes or "trembles"—not strategic brilliance. Rational play now means minimizing losses.  
  - Consistency: If you abandon backward induction at round three, why not at earlier nodes? This leads to chaos.  

  For the anti-backward-induction side (Ben):  
