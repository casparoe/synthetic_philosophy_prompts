  - Stubbornly taking ignores the opportunity created by the opponent’s "irrationality."  

  Key nuances to weave in:  
  - **Self-undermining**: If CKR implies players take early, but they didn’t, does CKR still hold? Ava would say "no, but stick to the plan anyway"; Ben would say "CKR is dead, adapt."  
  - **Trembling hand**: Ava might invoke this to explain earlier passes without abandoning rationality. Ben would counter that it’s ad hoc.  
  - **Payoff dominance**: Ben might argue that passing *now* could lead to mutual gain if the opponent reciprocates. Ava would call this wishful thinking.  

