prompt: |-
  A friend and I spent two hours last weekend arguing about the surprise exam paradox: a teacher announces there will be a surprise exam next week; a student 'proves' by backward induction that no exam fitting that description can occur -- it can't fall on the last possible day, since by then it would be expected, so it can't fall on the second-to-last day either, and so on back to the first day -- yet the teacher gives one anyway and genuinely catches everyone off guard. My friend calls the argument invalid and dismissible; I think it points to something real, that the announcement behaves less like a false prediction than like a claim that becomes unknowable to its audience the moment it is believed.

  The disagreement turned out to matter more than I expected. I sit on my school's academic policy committee, and a teacher has asked for approval to reinstate unannounced, graded 'surprise quizzes,' given at some point within a two-week unit, with the only promise being that students won't know which day it will fall on until it happens. The student council's formal objection runs exactly the backward-induction argument above and concludes that the policy is either incoherent or bound to violate its own terms; the teacher calls this 'a clever trick, not a real objection.' Draft the committee's decision memo -- approve, reject, or approve with conditions -- with reasoning precise enough that a sharp student couldn't just shrug it off, rather than one that simply asserts that surprises obviously happen in practice.
reasoning: |-
  We are faced with the surprise exam paradox in the context of a real policy decision. The student council argues that the surprise quiz policy is logically incoherent because of backward induction. The teacher dismisses this as a clever trick. The committee must decide whether to approve, reject, or approve with conditions, and provide reasoning that addresses the paradox without merely asserting that surprises happen in practice.

  First, let's break down the paradox:

  The backward induction argument:
  - Suppose the exam must occur on one of the days in a finite set (say, Monday to Friday of next week).
  - On Friday, if the exam hasn't occurred by Thursday, then on Friday morning the students would expect it on Friday (since it must occur that week). So it wouldn't be a surprise. Therefore, the exam cannot be on Friday.
  - Then, by similar reasoning, on Thursday morning, if the exam hasn't occurred by Wednesday, the students would know it must be on Thursday or Friday. But we've ruled out Friday, so they would expect it on Thursday. Thus, it cannot be on Thursday either.
  - This reasoning continues backward, eliminating every day.

  However, the teacher can then give the exam on, say, Wednesday, and it will be a surprise because the students (having ruled out all days) did not expect it that day.

  The paradox lies in the self-referential nature of the announcement and the students' reasoning. The announcement is about the students' knowledge, and the students are using the announcement in their reasoning.

  Analysis of the paradox:

  1. The backward induction argument relies on the students' perfect logical reasoning and their belief that the exam must occur and that it will be a surprise. However, the argument itself leads to a contradiction because the exam can still be given and be a surprise.

  2. The flaw in the backward induction argument is that it assumes that the students, by the time they get to the last possible day, will have the belief that the exam must occur that day. But if the students are rational and believe the announcement, they also believe the backward induction argument and thus do not believe the exam can occur at all. This leads to a situation where the exam can occur on any day and be a surprise because the students have concluded that no exam is possible.

  3. Therefore, the surprise is possible because the students, having accepted the backward induction argument, do not expect the exam on any day. However, the teacher then gives the exam on a day that the students did not expect (because they expected no exam at all). But note: the announcement says the exam will occur and will be a surprise. The backward induction argument leads the students to disbelieve the announcement (because they conclude no exam can be given without violating the surprise condition). Hence, when the exam is given, it is a surprise because the students had come to believe the exam wouldn't happen at all.

  However, this resolution implies that the announcement is self-defeating: it causes the students to disbelieve it, which then allows the surprise to occur. But the announcement was true: the exam did occur and it was a surprise.

  But note: the student council's argument is that the policy is incoherent because the backward induction shows that no day is possible. The teacher's position is that it is a trick and that in practice, the surprise happens.

  We must provide a decision that is robust and addresses the logical argument.

  Alternative perspectives:

  - The announcement creates a situation of common knowledge: the students know the announcement, and the teacher knows that the students know, etc. This common knowledge is what fuels the backward induction.

  - Some philosophers and logicians have resolved the paradox by noting that the announcement cannot be common knowledge in a way that supports the backward induction. For example, if the exam is given on the first day, then the students did not expect it on that day because they were considering the possibility that it might come later. Thus, the surprise is preserved.

  - Another resolution is to note that the backward induction argument is self-referential and leads to a contradiction, so it must be flawed. The flaw is that the argument assumes that on the last day the students would know the exam must occur that day, but if the students have accepted the backward induction, they don't believe the exam will occur at all. Thus, the premise that the exam must occur that week is undermined by the very reasoning. Therefore, the students might not actually believe that the exam must occur on the last day because they have been led to doubt the entire announcement.

  Decision for the committee:

  We must decide on the policy. The teacher wants to give unannounced, graded surprise quizzes within a two-week unit. The student council objects on logical grounds.

  We can consider:

  1. Approve the policy: because in practice, surprise quizzes are common and do work. However, we must not simply assert that without addressing the paradox.

  2. Reject the policy: because of the logical objection.

  3. Approve with conditions: for example, by adjusting the policy to avoid the paradox.

  A way to break the paradox is to make the announcement such that it does not create the conditions for backward induction. For instance, if the teacher does not announce the exact window (like two weeks) but instead says that a surprise quiz will happen sometime during the term without specifying the window, then the backward induction cannot start because there is no fixed end date. However, in this case, the teacher has specified a two-week unit. Alternatively, we can note that in practice, students do not engage in such perfect backward induction because of bounded rationality, but that is not a satisfying response.

  Another approach: the backward induction argument requires that the students are certain that the exam has not occurred until the last possible day. But in reality, the students might assign probabilities to each day. This leads to a probabilistic model. In such a model, the surprise exam can occur without contradiction. For example, the students might assign decreasing probabilities as the week progresses, but then the exam can be given on a day when the probability was low enough to be surprising.

  However, the student council's argument is purely logical and non-probabilistic.

  A more formal resolution:

  The backward induction argument is flawed because it assumes that the students' knowledge is monotonic: that if the exam hasn't happened by day n-1, then on day n they know it must be on day n. But the announcement itself and the students' reasoning about it create a situation where the students cannot have that knowledge. Specifically, the students, having done the backward induction, do not believe the exam will happen at all. Therefore, on the last day, they do not know that the exam must occur that day because they have ruled out every day. Hence, when the exam is given on the last day, it is a surprise because they didn't believe it would happen at all.

  But note: the announcement said the exam would occur. The students, by the backward induction, have come to disbelieve the announcement. Therefore, the teacher's giving the exam on the last day would then be a surprise because the students did not believe it would happen. However, the announcement also said it would be a surprise, and that part is true. But the students' disbelief in the entire announcement is what allows the surprise to happen.

  This suggests that the announcement is self-fulfilling in a way: it causes the students to disbelieve it, which then makes the exam a surprise when it does happen.

  But this is not entirely satisfactory because the announcement also says the exam will occur, and the students disbelieve that. So the announcement is true, but the students don't believe it. That is possible.

  However, the student council might argue that the policy is incoherent because it leads the students to disbelieve the announcement, so the teacher cannot truthfully say that the students will be surprised because the students will have concluded the exam won't happen. But then the exam does happen, so the announcement was true.

  The key is that the surprise condition is about the state of the students' knowledge at the time of the exam. The backward induction argument leads the students to a state of believing that the exam cannot happen. Therefore, when the exam happens on any day, it is a surprise because they did not expect it at all.

  Thus, the policy is logically coherent: the exam can be given on any day and will be a surprise because the students have been led by the backward induction to expect no exam. The flaw in the backward induction is that it leads to the false conclusion that no exam is possible. But the teacher can give the exam and thereby falsify the backward induction. Therefore, the backward induction argument is invalid because it assumes that the students will continue to believe the exam must occur even as they eliminate all days. In reality, the students will come to believe that the exam will not occur at all, which then allows the exam to be a surprise.

  Therefore, we can approve the policy. But note: the above reasoning is complex and might be difficult for students to accept. However, we must draft a memo that addresses the issue.

  Alternatively, we can avoid the paradox by not making the announcement about the surprise. The teacher could simply give unannounced quizzes without promising that they will be a surprise. But the teacher in this case has promised that the students won't know until the day it happens.

  But the announcement is what triggers the paradox.

  Proposal for the committee:

  We can approve the policy with the condition that the teacher does not explicitly state to the students that the quiz will be a surprise. Instead, the teacher can just say that there will be one or more unannounced quizzes during the two-week unit. Without the explicit surprise announcement, the backward induction argument doesn't get off the ground because there is no promise that the quiz must be unexpected. The students might still try to guess, but without the teacher's promise that they won't be able to know in advance, the logical paradox does not arise.

  However, the teacher's current proposal includes the promise that the students won't know which day. That is equivalent to the surprise condition.

  Alternatively, we can note that the backward induction argument requires that the students have absolute certainty and perfect reasoning. In practice, students are not perfect logicians and may not engage in such reasoning. Moreover, the teacher can vary the quiz days from unit to unit, so that students cannot rely on any fixed pattern. This breaks the backward induction because the students cannot be sure that the quiz must occur on the last day if it hasn't occurred by then, because the teacher might have changed the pattern.

  But again, that is a practical argument.

  A better approach is to accept that the backward induction argument is flawed and that the policy is workable. We can explain that the flaw in the backward induction is that it leads the students to disbelieve the entire announcement, which then allows the surprise to occur. Therefore, the policy is not logically incoherent.

  Draft Decision Memo:

  To: Academic Policy Committee
  From: [Your Name]
  Subject: Decision on Request for Surprise Quizzes

  After careful consideration of the request by [Teacher's Name] to reinstate unannounced, graded surprise quizzes within a two-week unit, and the formal objection from the student council based on the surprise exam paradox, the committee has decided to approve the policy with the following reasoning.

  The student council's objection uses a logical argument known as the surprise exam paradox, which attempts to show by backward induction that a surprise quiz cannot be given within a fixed period. The committee acknowledges the intellectual merit of this argument but finds that it does not render the policy incoherent. The flaw in the backward induction lies in its self-referential nature: the argument assumes that the students will continue to believe the quiz must occur even as they eliminate each day. However, the very reasoning of the backward induction leads the students to disbelieve that the quiz will occur at all. Therefore, when the quiz is given on any day, it will be a surprise because the students, having been convinced by the backward induction, did not expect it. Thus, the backward induction argument is invalid because it leads to a false conclusion (that no quiz can occur) and is falsified by the actual occurrence of the quiz.

  Moreover, the committee notes that in practice, surprise quizzes are a common pedagogical tool and do succeed in surprising students. This is because students do not typically engage in the kind of perfect logical deduction required by the backward induction argument. Even if they do, the above reasoning shows that the argument is self-defeating and does not prevent a surprise.

  Therefore, the committee approves the request for surprise quizzes under the following conditions:

  1. The teacher must ensure that the quizzes are indeed unannounced on the day they occur. The teacher should not reveal the exact date in advance.
  2. The teacher should be aware that the announcement of the surprise element might trigger the paradox in the minds of some students. To mitigate this, the teacher is encouraged to avoid overemphasizing the "surprise" aspect and instead focus on the pedagogical purpose (e.g., encouraging consistent study).

  The committee believes that this policy strikes a balance between pedagogical effectiveness and addressing the student council's concerns.

  If the student council remains unsatisfied, we suggest a trial period for the policy with feedback collected from students at the end of the unit.

