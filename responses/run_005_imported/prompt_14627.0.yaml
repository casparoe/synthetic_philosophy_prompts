  For the arm-raising case: the decision (mental) is realized by neural state P, which causes muscle contractions. The subset view says the decision's causal powers (e.g., triggering arm motion in context C) are a subset of P's powers. But the reductionist will ask: is "triggering arm motion" really a mental power or just a physical power described mentally?

