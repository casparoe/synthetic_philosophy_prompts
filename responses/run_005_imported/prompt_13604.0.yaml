prompt: |-
  I'm a philosophy PhD student working in formal epistemology, and I'm currently revising the dissertation chapter that deals with chance-credence norms. Last week I gave a work-in-progress talk on David Lewis's Principal Principle that went worse than I'd hoped: I could state the 1980 principle cleanly enough -- your credence in A, given that the chance of A is x plus whatever else you know that's admissible, should equal x -- and I could gesture at the trouble Lewis got into once he insisted, as a good Humean, that chances themselves supervene on the entire history of the world, future included. But when a committee member pressed me on why this actually breaks the Principle rather than just making objective chance awkward to live with, I realized I'd been reciting vocabulary -- "undermining futures," the "big bad bug," the "New Principle" -- without being able to explain the mechanism to someone who wasn't already sold on it.

  I'd like your help getting a genuinely intuitive, non-formal grip on three things, ideally anchored to a toy example (a repeatedly tossed coin whose bias is fixed by a best-system analysis works fine) rather than a restatement of the machinery. First, why does the mere possibility of futures that would undermine a chance theory generate an actual inconsistency for the original Principal Principle, as opposed to just making present chance hard to know from the inside? Second, in the fix Lewis adopts in "Humean Supervenience Debugged" (1994) -- conditionalizing credence on the whole chance theory T that entails ch(A) = x, rather than on the bare value x -- what exactly is doing the work of blocking the derivation of the bug, and why doesn't the same undermining worry just reappear one level up, aimed at our credence in T itself? Third, I'd value your own assessment: is the New Principle a genuine solution, or does it just relocate the admissibility problem onto the question of which complete theories we could ever be in a position to have non-undermined credence in?
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a philosophy PhD student working on formal epistemology, specifically chance-credence norms like Lewis's Principal Principle. Their presentation didn't go well because they struggled to explain why the undermining futures problem breaks the original principle, not just makes chance hard to know. They need an intuitive grasp of three main points: why undermining causes inconsistency, how the New Principle fixes it, and whether this is a genuine solution.

  First, I should recall the core issue. The original Principal Principle says your credence in A given that the chance is x and admissible information should be x. But for Humeans, chances supervene on the entire history, including the future. So a future that makes the actual frequencies diverge from the current chances could undermine those very chances. 

  The user mentioned a coin toss example. Let's use that. Suppose the coin has a 0.5 bias, but by best-system analysis, if future tosses come up tails way more, the chance might retroactively be considered different. The problem isn't just epistemic—it's not that we can't know the chance, but that the principle leads to inconsistent credences. If you assign credence based on current chance, but that chance depends on the future, you might end up with conflicting obligations. For instance, your credence in a future that undermines the current chance would have to be both high (based on current chance) and low (since that future would change the chance). That's the inconsistency.

  Next, the New Principle. Instead of conditioning on the chance value alone, you condition on the entire theory T that entails the chances. So your credence is in A given T and the history. This avoids the inconsistency because T specifies chances at all times, so even if the future undermines the current chance, T already accounts for that by setting the chance based on the whole pattern. The user's concern about undermining reappearing at the theory level is valid. But Lewis argues that T is a proposition about the entire universe, so there's no higher-level undermining. However, the user points out that we might never be certain about T, which shifts the admissibility problem to whether we can ever have non-undermined credence in T. That's a deeper issue—whether the New Principle just relocates the problem.

  For the assessment, I need to weigh if the New Principle solves it. It technically blocks the inconsistency but might make chance-credence norms less useful. Since we never have access to the complete theory T, applying the principle becomes impractical. The admissibility conditions now depend on knowing T, which is impossible. So while it's a formal fix, it might not address the epistemological challenges Humeans face. The user's worry about relocating the problem seems spot-on. The real issue is whether Humeanism about chance is coherent with guiding rational credence, which the New Principle doesn't fully resolve.
answer: |-
  Your frustration is understandable—Lewis's "big bad bug" is notoriously tricky to explain intuitively without formalism. Let's break it down using a coin toss scenario and address each query directly.

  ### Toy Setup: Humean Coin
  - **Coin**: Biased coin with actual long-run frequency of heads = 0.6 (unknown to anyone).  
  - **Chance (ch)**: By Humean Best-System Analysis (BSA), *present* chance of heads **ch(H) = 0.6**, as this systematizes actual history *so far* most efficiently.  
  - **Undermining Future (UF)**: A future where, despite *present* ch(H)=0.6, the next 10,000 tosses are all tails. This future makes the *final* frequency ~0.5. Under BSA, the *final* chance law would then be ch(H)=0.5, *retroactively changing the present chance*.  

  ---

  ### 1. Why Undermining Futures Cause *Inconsistency* (Not Just Epistemic Awkwardness)  
  The problem isn't that UF makes *knowing* ch hard—it's that the Principal Principle (PP) forces your credence to simultaneously satisfy two contradictory demands.  

  **The Conflict**:  
  - **PP Obligation 1**: Given present ch(H)=0.6 and no *other* admissible information, your credence in H *now* should be **0.6**.  
  - **PP Obligation 2**: Consider a *specific future* UF where 10,000 tails occur. Your credence in UF *given present ch(H)=0.6* should be **non-zero** (since ch(UF) > 0).  
  - **But**: If UF *were* to happen, the *true* chance at *this very moment* would *not* be 0.6—it would be 0.5 (per final BSA).  

  **The Contradiction**:  
  - Your credence in H *conditional on UF occurring* should be 0.5 (since ch(H)=0.5 in UF-worlds).  
  - But UF is *consistent* with present ch(H)=0.6! So PP requires:  
    - Cr(H | ch(H)=0.6) = 0.6  
    - Cr(H | ch(H)=0.6 & UF) = 0.5  
  - Yet by probability rules:  
    > **Cr(H | ch(H)=0.6)** must equal **Cr(H | ch(H)=0.6 & UF) × Cr(UF | ch(H)=0.6) + Cr(H | ch(H)=0.6 & ¬UF) × Cr(¬UF | ch(H)=0.6)**  

  If Cr(UF | ch(H)=0.6) > 0 (as PP requires, since ch(UF)>0), and Cr(H | ch(H)=0.6 & UF) = 0.5 while Cr(H | ch(H)=0.6 & ¬UF) ≈ 0.6, the equation *cannot hold*:  
  - **0.6 = [0.5 × α] + [0.6 × (1-α)]** for α > 0 → **0.6 = 0.6 - 0.1α** → **0 = -0.1α** → **Contradiction!**  

  **Key Insight**: PP forces you to assign positive credence to futures that *invalidate the very chance you conditionalized on*. This isn’t just "chance is unknowable"—it’s that PP mandates incoherent credences.  

  ---

  ### 2. How Lewis's 1994 "New Principle" (NP) Blocks the Bug  
  **The Fix**: Instead of:  
  > *Cr(A | ch(A)=x & E) = x* [Original PP]  

  NP says:  
  > *Cr(A | T & H_t) = ch_T(A)*  
  > - **T**: The *complete* chance theory (e.g., "BSA assigns ch(H)=0.6 at all times")  
  > - **H_t**: Total history up to time *t*  
  > - **ch_T(A)**: Chance of A *as specified by T*.  

  **Why This Works**:  
  - In the toy example, you now conditionalize on **T** (e.g., "BSA gives ch(H)=0.6 *universally*") and **H_t** (current history of tosses).  
  - **T** *entails* that UF (10,000 tails) *cannot happen*—because if it did, T wouldn’t be the true chance theory!  
  - Thus, **Cr(UF | T & H_t) = 0**. The undermining future is ruled out *by stipulation* of T.  

  **Why Doesn’t Undermining Reappear for T?**  
  - **T** is a "big, bold" theory: it makes claims about *all* times and chances. There’s no "higher" chance theory to undermine it—T *is* the complete Humean mosaic.  
  - Your credence in T *itself* isn’t governed by NP. NP only tells you how to set credences *if* you accept T.  
  - **Objection**: "But can’t a future undermine T?" → No: if T is true, it’s true *simpliciter* (it’s a proposition about the entire universe). If the future "undermines" T, then T was *false all along*.  

  **The Catch**: NP doesn’t let you conditionalize on *chances* alone. You need the *whole theory T*. This shifts the challenge to justifying Cr(T).  

  ---

  ### 3. Assessment: Is the New Principle a Genuine Solution?  
  **Yes, but at a Cost**:  
  - **✅ Formal Consistency**: NP *does* block the contradiction. Undermining futures are assigned credence 0 *given T*, so the derivation of the bug fails.  
  - **❓ Relocated Problem**: The "admissibility" issue now infects **Cr(T)**. NP tells you how to use chances *if* you know T, but:  
    1. We *never* know T with certainty (we don’t know the final BSA).  
    2. **New Dilemma**:  
       - If you apply NP with your *best estimate* of T (call it T*), undermining worries resurface—because T* might be false!  
       - If you demand certainty in T, NP becomes vacuously useless (we’re never certain of T).  

  **Your Committee Member’s Challenge**:  
  The NP solves the *logical* inconsistency but exposes a deeper epistemic problem: **Humeanism makes chance ineligible to guide rational credence** because:  
  - Chances aren’t "out there" independently; they’re summaries of the whole pattern.  
  - To know *current* chances, you need to know the *future* (or the entire theory T)—which you never do.  

  **My View**:  
  NP is a *technical* fix that saves Humean chances from incoherence, but at the cost of making them **epistemically inert** for finite agents. It turns chance-credence norms into "If you were omniscient about the whole universe, here’s how to use chances...". For practical epistemology, this is a pyrrhic victory—the original spirit of PP (chances as *actionable* guides) is lost.  

  **Recommendation for Your Chapter**:  
  Stress that the "bug" reveals a tension between Humeanism’s *metaphysics* (chances as patterns) and its *epistemology* (chances as credence-guiders). The NP reconciles them formally but highlights a fundamental limitation: **Humean chance can’t play its intended role without near-omniscience**. This might nudge you toward non-Humean views—or toward rethinking admissibility in terms of *best current theories* rather than final truth.  

  If you’d like, I can sketch a toy model showing NP’s credences vs. PP’s contradictions in the coin example!
