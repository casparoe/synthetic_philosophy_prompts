  So I had this whole arguement with my friend last night about the AI shutdown problem and I honestly still think I'm right. My case was that Stuart Armstrong's "utility indifference" trick -- rig the AI's utility function so it's mathematically indifferent to whether the shutdown button gets pressed or not -- basically solves corrigibility, since an agent that truly doesn't care either way has zero reason to stop you from pressing it. My friend wasn't buying it but couldn't really explain why, just kept repeating that "indifferent isn't the same thing as corrigible." So who's actually right here -- is making an agent indifferent to being shut down enough to call it corrigible, or is she onto something she just couldn't put into words?
