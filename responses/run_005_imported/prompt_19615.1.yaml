prompt: |-
  So I've been working through Software Foundations (the free Coq textbook) and got stuck on something in the logic chapter. It shows that excluded middle (`P \/ ~P`) can't be proven in Coq's core logic since its intuitionistic -- ok fine. But then a couple exercises later theres a lemma (something like `excluded_middle_irrefutable`) that proves `~~(P \/ ~P)` for literally any P. That broke my brain a bit: if double negation just means "cancel the two minus signs," like it does everywhere else in math, proving ~~X should hand you X right back, which would just be excluded middle again. So either the book's being sloppy or I'm misunderstanding what double negation even means here. Can you explain concretely what actually breaks when you try to strip those two negations off, and why that exact breakage is where excluded middle "lives"?
