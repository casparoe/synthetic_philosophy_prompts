  (2) Felix: Distinguishes between the rationality of a disposition (beforehand) and the rationality of the act (in town). He argues that CDT is only about the act at the moment, so a rational disposition producing an irrational act (by CDT) is a distinction, not a contradiction.

  Score: 1 (Reasonable and defensible, but not without counterarguments)
