  ### The Fate of "Rational Irrationality" and Overlooked Distinctions
  "Rational irrationality" survives as a coherent notion within **causal decision theory (CDT)**, where Felix's distinction holds: it can be rational to cultivate a disposition that forces you into an act that is irrational when evaluated in isolation (e.g., paying in town). However, **resolute choice collapses this notion** by arguing that rationality must evaluate acts within the context of a broader plan—making the "irrational" act (paying) rational all along. Naomi and Felix are partially talking past each other: Felix focuses on *definitional coherence* (CDT's internal logic), while Naomi emphasizes *pragmatic adequacy* (how rationality functions for temporally extended agents). The deeper distinction is about **temporal scope**—whether rationality is node-specific (Felix) or plan-embedded (Naomi)—a divide reflecting competing intuitions about agency, not resolvable without meta-theoretical agreement on what rationality *should* explain.
