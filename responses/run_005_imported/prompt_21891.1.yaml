  First, I need to validate their point. Subjectivity is a key aspect here. They’re right that many aesthetic judgments are subjective. But why do philosophers still see a problem? I should think about the nuances they might be overlooking. Maybe it's not just about subjectivity versus objectivity. Perhaps there's a middle ground where some aesthetic properties are intersubjective or have objective bases.

  Next, the user might be coming from a place of frustration. They find the philosophical discussions unnecessary. I should acknowledge that their view has merit but also explain why the debate persists. They might need clarification on why subjectivity alone doesn't dissolve the problem. 

  Looking deeper, the user could be interested in the philosophy of aesthetics but feels that some issues are overcomplicated. They might want a clearer understanding of the arguments without the jargon. Their unspoken need might be to grasp the core philosophical concerns without getting lost in abstract theories.

  I recall that philosophers like Kant and Hume addressed taste. Hume talked about the ideal critic, suggesting some standards. Kant separated subjective pleasure from universal judgments. So even within subjectivity, there's a claim to universality. That's a point to mention. Also, aesthetic properties like coherence or balance might have objective elements, even if the experience is subjective.

  Another angle: testimony in other areas, like ethics or humor. We accept testimony for some subjective domains but not aesthetics. Why? That’s puzzling. The user’s ice cream analogy might not hold because aesthetic judgments often claim more than personal preference. They imply something about the object's properties worth experiencing.

  Also, the phenomenology of aesthetic experience—seeing a painting versus hearing about it. Direct engagement seems necessary. But why? If it's just subjective, why can't I trust a friend's taste? The problem lies in the need for first-hand experience to "get" the aesthetic value, which isn’t the same for ice cream preferences.

  The user might not have considered that some aesthetic judgments are better supported than others, like through expertise. That introduces an epistemic element. So, while taste is subjective, there are standards based on reasons and expertise. This complexity makes the testimony issue harder to resolve.

  I should also address the dissolution point. Even if subjectivity is accepted, the persistence of the debate suggests unresolved questions. Philosophers explore whether testimony can provide aesthetic knowledge despite subjectivity, or if there's a unique barrier. That’s why it remains a live problem.

