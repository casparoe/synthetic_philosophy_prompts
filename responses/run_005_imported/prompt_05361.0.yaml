  We are going to write a dialogue between a deflationist (let's call them Alex) and a critic (let's call them Jordan) about the conservativeness objection to deflationism. The objection is that adding a truth predicate to PA (Peano Arithmetic) should be conservative if truth is indeed deflationary, but compositional truth theories (like CT or KF) are non-conservative because they prove the consistency of PA.

  The deflationist (Alex) must offer a technically serious response. One well-known line of defense for the deflationist is to argue that the truth predicate they require is not the full compositional truth predicate that the critic has in mind. Specifically, the deflationist might insist that the truth predicate they need is a *disquotational* truth predicate, which is given by the Tarski biconditionals (like T("φ") ↔ φ) but without the full compositional axioms. Such a theory is often called the "disquotational theory" (DT). 

  It is known that if we add a truth predicate with the Tarski biconditionals for the base language (without the truth predicate) to PA, and we do so in a way that does not allow the truth predicate to appear in the induction schema, then the resulting theory (call it PA(S) or UTB) is conservative over PA. However, if we allow the truth predicate to appear in induction formulas (i.e., we extend the induction schema to formulas containing the truth predicate), then the resulting theory (often called PAT) is non-conservative and proves the consistency of PA.

  So, the deflationist might argue that they do not need the extended induction. They might claim that the disquotational truth predicate without induction for the truth vocabulary is sufficient for their purposes. Moreover, they might point out that the generalizations they care about (like "All theorems of PA are true") can be proven in a different way, perhaps by using a truth predicate that is not fully compositional but still disquotational and with a restricted induction.

  However, the critic might counter that without the extended induction, the deflationist cannot actually prove all the generalizations they set out to prove. For example, to prove "All axioms of PA are true" and then by induction on proofs to show that every theorem is true, one needs induction over formulas that contain the truth predicate. Without that, the deflationist might not be able to prove the global reflection principle.

  Therefore, the dialogue should focus on whether the deflationist can get by with a conservative extension (like UTB) and still account for the generalizations they need, or whether they are forced to accept a non-conservative extension (like PAT) and thus the truth predicate is not as thin as they claim.

  Let's structure the dialogue:

  1. Jordan presents the conservativeness objection: adding truth should be conservative, but it isn't for the theories that prove the generalizations.
  2. Alex responds by distinguishing between different truth theories and claiming that the deflationist only needs a conservative one (like UTB).
  3. Jordan argues that without the extended induction (as in PAT), Alex cannot prove the key generalizations (like "All theorems of PA are true").
  4. Alex then tries to show how they can still get the generalizations they need without the non-conservative extension. This is the tricky part.

  One idea for Alex: maybe they can use a reflection principle or a rule of inference instead of an axiom. Or they might argue that the generalization "All theorems of PA are true" is not something they need to assert as a single sentence, but rather that they can accept each instance (each theorem is true) without the universal generalization. But that seems to undermine the point of having a truth predicate for generalization.

  Alternatively, Alex might argue that the deflationist does not require the truth predicate to prove the consistency of PA, but rather that the truth predicate is only a device for disquotation and for expressing infinite conjunctions. So, the fact that a stronger truth theory proves the consistency of PA does not impugn deflationism because the deflationist does not require that strong theory.

  But Jordan would press: then how does the deflationist account for the apparent fact that we do reason with truth in ways that require the extended induction?

  Another technical point: there are conservative disquotational theories that can prove the global reflection principle for PA? Actually, no: if a theory proves the global reflection principle for PA, then it proves Con(PA). And if it is an extension of PA and is sound, then it must be non-conservative. But note: UTB (without extended induction) is conservative but does not prove the global reflection principle. PAT (with extended induction) is non-conservative and does.

  So, the deflationist must either:

  (a) Argue that they don't need to prove the global reflection principle (i.e., they don't need to assert that every theorem of PA is true) as a single sentence, but can make do with the schematic assertion for each theorem, or

  (b) Accept that the truth predicate they use is not conservative but then explain why that doesn't mean truth is substantial.

  But (b) seems to give up deflationism. So (a) is the route.

  However, the whole point of the truth predicate for the deflationist is to express generalizations. So if they cannot express the generalization that every theorem of PA is true, then they are failing at one of their main goals.

  But note: the deflationist might say that they can express the generalization in a schematic way. For example, they can have a rule that from a proof of φ in PA, they can infer T("φ"). But then they never have the single sentence ∀φ (Prov_{PA}(φ) → T(φ)).

  But then the critic might say: but we do assert and believe that single sentence! And the deflationist must account for that.

  This is the heart of the debate.

  Let's write the dialogue accordingly.
answer: |-
  ### Dialogue: Deflationism and the Conservativeness Objection

  **Characters:**
  - **Alex**: Deflationist, defending a minimalist view of truth inspired by Horwich.
  - **Jordan**: Critic, pressing the conservativeness objection using proof-theoretic arguments.

  **Setting:** A university common room, late evening, coffee cups scattered.

  ---

  **Jordan:** Alex, I’ve been thinking about our debate yesterday. Your deflationism hinges on truth being “thin”—just a disquotational device. But here’s the technical snag: if truth is that insubstantial, adding a truth predicate to Peano Arithmetic (PA) should be *conservative*. It shouldn’t prove new arithmetical facts. Yet compositional truth theories—like CT or KF—*do* prove new things. Most damningly, they prove \(\text{Con}(\text{PA})\), which PA can’t prove by Gödel’s second incompleteness theorem. If truth is deflationary, why does it pack such a punch?

  **Alex:** Fair point, Jordan. But you’re conflating two things: what deflationism *requires* and what compositional theories *deliver*. Deflationism doesn’t need full-blown CT. I only need a disquotational truth predicate governed by the Tarski biconditionals—\(T(\ulcorner \phi \urcorner) \leftrightarrow \phi\)—for \(\phi\) in the base language. Call this theory **UTB** (Uniform Tarski Biconditionals). UTB *is* conservative over PA. Problem solved.

  **Jordan:** Not so fast. UTB is conservative precisely because it’s weak—too weak for your deflationist goals. You care about generalizations like “All PA-theorems are true.” But UTB doesn’t prove that! To get \(\forall \phi (\text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow T(\ulcorner \phi \urcorner))\), you need induction *on formulas containing ‘T’*. And once you extend PA’s induction schema to \(\mathcal{L}_T\)—call that theory **PAT**—you’re non-conservative again. PAT proves \(\text{Con}(\text{PA})\). So deflationism is stuck: either you’re conservative but can’t state generalizations, or you can state them but aren’t conservative.

  **Alex:** You’re right that PAT is non-conservative. But deflationism doesn’t require PAT. UTB *can* handle generalizations—just not the way you think. I don’t need to *prove* \(\forall \phi (\text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow T(\ulcorner \phi \urcorner))\) as a single sentence. Instead, I can use a *scheme*: for each specific \(\phi\), UTB proves \(\text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow T(\ulcorner \phi \urcorner)\). That’s enough for my disquotational needs.

  **Jordan:** But that’s not generalization! It’s just infinitely many instances. The whole point of truth, on your view, is to express what we *can’t* state finitely—like “Everything PA proves is true.” If you retreat to a scheme, you’re admitting truth isn’t doing that work. Worse, in UTB, you can’t even *formulate* the universal claim because ‘T’ can’t appear in induction formulas. So deflationism fails its own test.

  **Alex:** I disagree. Consider how we use truth in natural language. When I say, “Everything Einstein said about relativity is true,” I’m not performing a metaphysical feat—I’m compressing many claims. Deflationism captures this via the scheme. Each instance \(\text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow \phi\) is provable in PA by the diagonalization lemma, and UTB converts \(\phi\) to \(T(\ulcorner \phi \urcorner)\). So I get the *effect* of generalization without the universal quantifier.

  **Jordan:** But compression is the issue! PA + UTB proves each instance \(\text{Prov}_{\text{PA}}(\ulcorner \phi_n \urcorner) \rightarrow T(\ulcorner \phi_n \urcorner)\), but it can’t prove the consistency of PA because it lacks the *global reflection principle*. That principle requires the universal quantifier. So you’ve avoided non-conservativeness by avoiding the very thing truth is supposed to enable. That’s ad hoc.

  **Alex:** Not ad hoc—principled. Deflationism treats truth as a logical device, not an explanatory one. I can even strengthen UTB conservatively. Take **FS** (Friedman-Sheard theory), which adds compositional axioms *without* full induction for ‘T’. FS is conservative over PA and proves partial generalizations. For example, it proves “All true atomic sentences are true,” or “All true conjunctions are true.” That’s enough for practical purposes.

  **Jordan:** Practical for whom? FS still can’t prove “All PA-theorems are true.” And Gödel’s theorem shows why that matters: PA can’t assert its own consistency, but we can—using truth. If deflationism can’t recover that, it’s inadequate. Truth isn’t just disquotation; it’s a tool for epistemic ascent.

  **Alex:** Ah, but here’s the technical nuance. I don’t need to *prove* \(\text{Con}(\text{PA})\) in the object language. I can use a meta-theoretic reflection principle: whenever PA proves \(\phi\), infer \(T(\ulcorner \phi \urcorner)\). This is a rule of inference, not an axiom. Add this to UTB, and you get a theory that’s *semantically conservative*—it doesn’t prove new arithmetical *theorems*, but it lets me trust PA. And crucially, this doesn’t require full PAT.

  **Jordan:** Semantic conservativeness is tricky. If your system infers \(T(\ulcorner \phi \urcorner)\) whenever PA proves \(\phi\), then in particular, if PA proves \(0=1\), it infers \(T(\ulcorner 0=1 \urcorner)\), which UTB converts to \(0=1\). So your system is consistent iff PA is. But this doesn’t avoid non-conservativeness. By the Deduction Theorem, if your system proves \(\text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow T(\ulcorner \phi \urcorner)\) for all \(\phi\), then it proves the universal generalization—and you’re back to PAT.

  **Alex:** Not necessarily. The reflection rule is sound, but it operates at the level of proofs, not provability. I’m not *axiomatizing* global reflection; I’m using a rule that preserves conservativeness. Work by Halbach and Horsten shows systems like **CR** (Compositional Reflection) with this rule are interpretable in PA. They don’t prove \(\text{Con}(\text{PA})\) outright.

  **Jordan:** But CR *does* prove the consistency of PA in a disguised form! If CR proves all PA-theorems are true, and PA is inconsistent, CR proves a falsehood. So CR ⊢ \(\text{Con}(\text{PA})\) in the metalanguage. That’s just as problematic. Deflationism can’t escape the fact that truth, even minimally construed, exceeds PA’s power.

  **Alex:** Only if you demand truth do explanatory work. I don’t. The consistency of PA isn’t “explained” by truth; it’s a logical consequence of how we use the predicate. Deflationism is about the *meaning* of truth, not its proof-theoretic strength. Truth is thin because it doesn’t add metaphysical content—even if it has logical heft.

  **Jordan:** Then you’ve shifted the goalposts. If truth has “logical heft” enabling new proofs, it’s not metaphysically thin. The conservativeness objection exposes that tension. You can’t have it both ways.

  **Alex:** I can. Conservativeness is model-theoretic: UTB adds no new arithmetical truths because every model of PA expands to a model of UTB. That’s deflationism in action: truth supervenes on the base facts. What PAT’s non-conservativeness shows is that *full induction for ‘T’* is substantial—not truth itself. I reject that addition as unnecessary for deflationism.

  **Jordan:** But then your version of deflationism is toothless. If you can’t even assert that your own theory is true, what good is it?

  **Alex:** I *can* assert it—schematically. And that’s all we ever do. When we say “PA is true,” we’re expressing confidence in each theorem, not unveiling a profound truth property. Deflationism reflects that.

  **Jordan:** *[Sighs]* So we’re back to metaphysics. I still think the proof theory bites you. But I’ll concede this: if deflationism retreats to schemata and rules, it’s consistent—though it may not capture everything we want from truth.

  **Alex:** And I’ll concede that PAT’s non-conservativeness is a challenge. But it’s a challenge *to the critic*, too: if truth is substantial, why is UTB sufficient for so much? Maybe conservativeness isn’t the right test.

  **Jordan:** Touché. Another coffee? I think we’ll need it.

  **Alex:** Definitely. This isn’t over.

  ---

  ### Key Technical Points Engaged:
  - **Alex’s Defense**: 
    - Distinguishes **UTB** (conservative disquotational truth) from **PAT** (non-conservative with extended induction).
    - Argues deflationism only needs UTB and its conservative extensions (e.g., FS), which prove generalizations *schematically* but not universally quantified.
    - Proposes reflection *rules* (not axioms) to handle trust in PA without proving \(\text{Con}(\text{PA})\) in the object language.
    - Cites conservativeness results: UTB and FS are conservative over PA (Halbach 2001), and reflection-rule systems avoid explicit \(\text{Con}(\text{PA})\) proofs.
    
  - **Jordan’s Counter**: 
    - Presses that schematic generalizations fail to capture the universal claim “All PA-theorems are true,” a key deflationist motivation.
    - Notes that reflection rules implicitly commit to consistency, risking non-conservativeness via the Deduction Theorem.
    - Insists that truth’s ability to prove \(\text{Con}(\text{PA})\) shows it’s robust, not deflationary.

  ### Outcome:
  No resolution, but the dialogue highlights core tensions:  
  1. **Generality vs. Conservativeness**: Can schematic truth achieve deflationism’s goals without non-conservative axioms?  
  2. **Rules vs. Axioms**: Do reflection rules salvage deflationism, or do they smuggle in substance?  
  3. **Metaphysics vs. Logic**: Is truth’s “thinness” a matter of meaning (Alex) or proof-theoretic behavior (Jordan)?  

  This mirrors real scholarly disputes (e.g., Horwich vs. Shapiro; Halbach vs. Ketland). Both sides land solid blows—neither is a pushover.
