  I should outline the necessary conditions: common knowledge of the surrogate, credible commitment, and no interference between goals. Then explain why under these conditions, the threatener prefers targeting the surrogate. If any condition fails, the strategy collapses. The user might benefit from examples or analogies, like the mutually assured destruction in game theory.

