  Berlin's interpretation is key here. He saw Tolstoy's theory as a rejection of "great man" history but noted a tension—Tolstoy acknowledges individual agency while insisting on historical laws. The calculus analogy, for Berlin, is a poetic metaphor rather than a rigorous framework, which might collapse under scrutiny but effectively conveys Tolstoy's critique of historical methodology.

  The user needs clarity on whether Tolstoy's analogy is functional or decorative. While the mathematical structure isn't literal, it systematically challenges reductionist historiography. The deeper point is epistemological: historians can't isolate variables like in sciences; they must embrace continuity and aggregation.

  For counterfactuals, Tolstoy's framework allows them only at the infinitesimal level (e.g., one person's choice) but not at macro levels, as those events are predetermined by the sum of all actions. So "if Napoleon hadn't invaded" is invalid because the invasion was inevitable given the integrated wills of millions.

