answer: |-
  This is a profound tension at the heart of information economics and financial regulation, and your focus on the *assumptions* of Good's theorem is exactly the right lens to resolve it. Here's a breakdown:

  **1. Recapping the Core Conflict:**

  *   **Good's Theorem (1967):** For a *single*, rational, Bayesian expected-utility maximizer facing a decision *after* receiving information, acquiring cost-free information relevant to that decision *cannot decrease* expected utility and will *strictly increase* it unless the information is irrelevant. Ignorance is never strictly preferred in expectation. *(Assumptions: Single agent, private information, decision follows revelation, Bayesian updating, expected utility maximization).*
  *   **Hirshleifer Effect (1971):** In a market setting *before* trading occurs, the *public* revelation of information (e.g., about future states of the world) can destroy the very basis for mutually beneficial risk-sharing trades. Agents with different risk tolerances or endowments trade to hedge risks they *both* face but perceive differently *because of uncertainty*. Public revelation resolves this uncertainty, eliminating the hedging motive. If the information reveals correlated bad outcomes or destroys diversification opportunities, *all* agents can be worse off *in expectation* compared to the pre-revelation, uncertain state where trading occurred. *(Assumptions: Multiple agents, public information revelation precedes trading, incomplete markets, heterogeneous preferences/endowments, risk aversion).*

  **2. Violations of Good's Theorem Assumptions in Hirshleifer's Scenario:**

  Hirshleifer's result violates several critical background assumptions of Good's theorem, rendering its conclusion inapplicable to the market context:

  *   **a) Single Agent vs. Multiple Strategic Agents:**
      *   *Good:* Assumes a single decision-maker whose action has no impact on others and who receives information privately.
      *   *Hirshleifer:* Involves **multiple, strategically interacting agents**. The key welfare loss arises from the *interaction* in the market – the destruction of *gains from trade*. Good's theorem says nothing about how one agent's information acquisition affects others' welfare or market opportunities.

  *   **b) Private Information Acquisition vs. Public Information Revelation:**
      *   *Good:* Concerns an agent *privately* acquiring information relevant to their *own* decision. The information is not revealed to others who might react strategically.
      *   *Hirshleifer:* Involves **mandatory, public revelation** of information *before* trading. This public nature is crucial. It simultaneously resolves uncertainty for *all* agents, changing the fundamental structure of the market equilibrium and eliminating the *common uncertainty* that was the basis for risk-sharing. Private acquisition wouldn't have this effect.

  *   **c) Information Acquisition Precedes Action (Decision) vs. Revelation Precedes Trading (Market Formation):**
      *   *Good:* The agent acquires information *before* taking their *final action*. The information directly informs that specific action.
      *   *Hirshleifer:* Public revelation occurs *before* the *market opens for trading*. The information fundamentally changes the **state space over which markets are formed** and the **nature of the contracts** agents desire. It's not informing an action within a fixed market structure; it *alters the market structure itself* by removing uncertainty that defined the need for contingent claims.

  *   **d) Absence of Specific Market Frictions (Implicitly):**
      *   *Good:* Operates in a frictionless decision-theoretic environment for a single agent.
      *   *Hirshleifer:* Relies critically on **market incompleteness**. If markets were complete (Arrow-Debreu securities for every state), public revelation might change prices but wouldn't necessarily destroy *all* risk-sharing opportunities – agents could still trade to achieve optimal risk-bearing *given the new information*. It's the combination of public revelation *and* the inability to contract on the newly revealed states (or the elimination of states where hedging was valuable) that causes the welfare loss. Good's theorem assumes no such constraints on the action space contingent on states.

  **3. Implications for Regulators and "More Disclosure is Always Better" Arguments:**

  The violation of Good's theorem assumptions in market contexts like Hirshleifer's has profound implications for regulatory philosophy on mandatory disclosure:

  *   **The Argument "More Disclosure is Always Weakly Welfare-Improving" is False in General Equilibrium:** Good's theorem provides **zero support** for this claim in market settings involving multiple agents, strategic interaction, public revelation, and incomplete markets. Hirshleifer provides a clear, theoretically robust counterexample where mandatory public disclosure *reduces* ex-ante expected welfare for *all* participants by destroying the gains from trade fueled by uncertainty.

  *   **Context is Paramount:** Regulators **must** consider the specific context of disclosure:
      *   **Timing:** *When* is the information revealed relative to when agents can contract/trade? (Pre-trade revelation is most dangerous for risk-sharing).
      *   **Nature:** Is the disclosure *public* or can it remain *private*? (Public revelation is key to Hirshleifer).
      *   **Market Structure:** How complete are the markets? How do agents interact? (Incompleteness amplifies the Hirshleifer risk).
      *   **Type of Information:** Does the information resolve *aggregate* risk (more likely to destroy risk-sharing) or *idiosyncratic* risk (might improve resource allocation)? Does it primarily affect valuation or the fundamental basis for risk transfer?
      *   **Purpose of Disclosure:** Is it aimed at reducing asymmetric information (addressing adverse selection/moral hazard) or is it revealing exogenous, symmetric uncertainty? (Hirshleifer concerns the latter).

  *   **Trade-offs Must Be Acknowledged:** Mandatory disclosure involves inherent trade-offs:
      *   *Potential Benefits:* Reducing asymmetric information (improving price efficiency, reducing adverse selection/moral hazard, promoting market integrity).
      *   *Potential Costs:* Destroying risk-sharing opportunities (Hirshleifer effect), creating strategic disadvantages (e.g., revealing proprietary information), imposing compliance costs, potentially increasing market volatility or correlation in the short term.

  *   **Hirshleifer as a Caution Against Premature/Excessive Mandatory Disclosure:** Regulators should be particularly wary of arguments for mandatory disclosure *before* markets have had a chance to form for risk-sharing related to the underlying uncertainty. Mandating disclosure of highly uncertain, aggregate future outcomes *too early* can be actively harmful. The optimal timing might involve allowing markets to form and trade *under uncertainty* before forcing resolution.

  *   **Focus on Net Social Welfare, Not Just Individual Rationality:** While an individual agent *might* prefer to know privately (per Good), forcing *everyone* to know publicly *at a specific time* can lead to a Pareto inferior outcome *ex-ante*. Regulation must consider the **system-wide equilibrium effects**, not just individual decision theory.

  *   **Not an Argument Against *All* Disclosure:** This is **not** a blanket argument against disclosure. Disclosure targeting *asymmetric* information problems often improves welfare. The argument is against the *unqualified* claim that "more disclosure is always weakly better" and highlights a specific scenario where mandatory *public* disclosure of *symmetric uncertainty* *before* trading *can* be detrimental.

  **Conclusion:**

  The Hirshleifer effect demonstrates that Good's theorem, while logically sound within its narrow domain of individual Bayesian decision-making, **does not generalize to settings of mandatory public information revelation preceding strategic interaction in incomplete markets.** It violates the core assumptions of single agency, private information, and a fixed decision context. For regulators, this means:

  1.  **Reject Dogma:** The argument that "more disclosure is always weakly welfare-improving" based on decision theory is fundamentally flawed for market regulation.
  2.  **Embrace Nuance:** Disclosure policy requires careful cost-benefit analysis considering *timing, publicity, market structure, information type*, and *specific welfare trade-offs* (efficiency vs. risk-sharing).
  3.  **Heed Hirshleifer's Warning:** Mandatory public disclosure resolving symmetric uncertainty *before* risk-sharing markets operate carries a significant risk of destroying welfare-enhancing trade opportunities. Regulators should prioritize understanding whether proposed disclosure rules might trigger this mechanism, particularly for disclosures concerning highly uncertain aggregate risks. Case-by-case analysis, informed by the specific market context and potential equilibrium effects, is essential.
