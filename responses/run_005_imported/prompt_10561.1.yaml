answer: |-
  I'll build the strongest version of your friend's case using **Levi's rule** (from philosopher Isaac Levi), a well-defined decision rule for imprecise probabilities that leverages "sequential rationality" to avoid both of your objections. I'll walk through a concrete pair of bets, then address whether it survives your comeback. For clarity, we'll use an Ellsberg urn with **100 balls, red and black in unknown proportion**. Your friend's imprecise credence for "red" is the interval **[0.4, 0.6]**, meaning she believes the true probability of red is *at least* 40% and *at most* 60%, but she can't pin it down further.

  ### The Decision Rule: Levi's Rule with α-Pessimism
  Levi's rule works like this:
  1. **Represent uncertainty**: Maintain a set of probabilities (here, all values between 0.4 and 0.6 for red).
  2. **Evaluate actions**: For any bet, calculate its **minimum expected utility (min-EU)** and **maximum expected utility (max-EU)** across all probabilities in the set.
  3. **Choose via α-weighting**: Use a weighted average of min-EU and max-EU:  
     \[
     \alpha\text{-weighted EU} = \alpha \times (\text{min-EU}) + (1 - \alpha) \times (\text{max-EU})
     \]
     Here, \(\alpha\) (between 0 and 1) is her "pessimism index." If \(\alpha = 1\), she's ultra-cautious (focuses on worst-case); if \(\alpha = 0\), she's optimistic (focuses on best-case). We'll use \(\alpha = 0.5\) for balance.
  4. **Sequential dependency**: When facing multiple bets, later decisions can depend on earlier actions *if* those actions reveal information or change the decision context. Crucially, this isn't "changing her mind"—it's a planned response to new circumstances (e.g., now she's *already* accepted/rejected a bet).

  ### The Concrete Bets
  - **Bet A**: Pays **\$100 if red**, costs **\$55 to enter**.  
  - **Bet B**: Pays **\$100 if black**, costs **\$55 to enter**.  

  *Why these bets?*  
  - Individually, each bet is *potentially* desirable:  
    - For Bet A (red): Max-EU occurs at P(red) = 0.6 → EU = (0.6 × 100) - 55 = 5.  
      Min-EU occurs at P(red) = 0.4 → EU = (0.4 × 100) - 55 = -15.  
    - For Bet B (black): Since P(black) = 1 - P(red), it's identical to Bet A. Max-EU = 5 (at P(black)=0.6), min-EU = -15 (at P(black)=0.4).  
  - But if she accepts **both bets**, she pays \$110 total. Since red and black cover all outcomes, she wins exactly \$100 (if red *or* black), guaranteeing a **\$10 loss**. This is the "guaranteed money on the table" problem you mentioned.  

  ### Walking Through the Sequential Decisions
  Assume Bets A and B are offered **one after the other**, and she uses Levi's rule with \(\alpha = 0.5\).

  **Step 1: Facing Bet A first**  
  - Calculate α-weighted EU for Bet A:  
    \[
    \alpha\text{-EU} = 0.5 \times (-15) + 0.5 \times 5 = -7.5 + 2.5 = -5.
    \]
  - Not betting (status quo) has EU = 0.  
  - Since \(-5 < 0\), she **rejects Bet A**.  
  - *Key point*: This rejection isn't arbitrary—it's a rational response to ambiguity. Bet A could lose up to \$15 in the worst case, and her pessimism (\(\alpha = 0.5\)) makes it unattractive.  

  **Step 2: Facing Bet B later**  
  - She has **already rejected Bet A**, so she has no existing commitments.  
  - Calculate α-weighted EU for Bet B *alone*:  
    \[
    \alpha\text{-EU} = 0.5 \times (-15) + 0.5 \times 5 = -5.
    \]
  - Not betting has EU = 0.  
  - Since \(-5 < 0\), she **rejects Bet B**.  

  **Outcome**: She rejects both bets, avoids the guaranteed loss, and ends with \$0.  

  ### Why This Avoids Both Problems
  1. **No "guaranteed money left on the table"**:  
     - If she naively accepted each bet individually (e.g., if she used max-EU alone), she'd take both and lose \$10. Levi's rule prevents this by rejecting each bet due to the downside risk.  
     - She doesn't miss out on "obvious" gains: Accepting both bets *together* is disastrous, and rejecting them *sequentially* is consistent with that.  

  2. **No "sharp credence in disguise"**:  
     - She never collapses her range to a single probability. At each step, she uses the *entire interval* [0.4, 0.6] to compute min-EU and max-EU.  
     - The \(\alpha\)-weighting is a *decision rule*, not a belief update. It transforms her imprecise belief into action without pretending precision.  

  3. **Sequential dependency is justified**:  
     - Her choice for Bet B *depends* on rejecting Bet A, but this isn't irrational. Rejecting Bet A means she enters the Bet B decision with a "clean slate"—no prior bets to compound risk.  
     - If she *had* accepted Bet A, Bet B would be far riskier (since it could compound losses). Levi's rule would handle that too:  
       - Suppose she accepted Bet A (despite α-EU = -5) for some reason. Now, facing Bet B:  
         - Accepting Bet B alone: α-EU = -5 (as before).  
         - But accepting Bet B *after accepting Bet A* would create a guaranteed \$10 loss. Levi's rule would detect this by evaluating the *combined outcome*: min-EU = max-EU = -10, so α-EU = -10. She'd reject Bet B to cut losses.  
       - This isn't "changing her mind"—it's adapting to new risks created by her prior action.  

  ### Does It Survive Your Comeback?  
  **Your comeback**: "The two choice-points are identical in everything that matters. Bet A and Bet B are symmetric—same stakes, same urn, same uncertainty. Treating them differently based on order is irrational."  

  **Her strongest rebuttal—and why it (partially) works**:  
  - **Yes, the bets are symmetric, but the *decision contexts* are not identical**. When she faces Bet B, she has already *acted* on Bet A (by rejecting it). This changes her "decision state":  
    - At Bet A: She faces *potential* future risks (e.g., if she accepts, Bet B could exploit it).  
    - At Bet B: Since she rejected Bet A, that future risk is gone. She now faces a simple, isolated bet.  
  - This isn't arbitrary—it's a feature of **dynamic consistency under ambiguity**. Imprecise probability theorists (like Levi or Teddy Seidenfeld) argue that rational agents must consider how *current choices affect future vulnerabilities*. In your "everything that matters" view, you ignore the *temporal position* and *path-dependence* of decisions.  
  - **Analogy**: Climbing a mountain. Two identical cliffs might exist, but if you've already climbed the first, the second feels different—you're tired, you know the risks better, and falling now would compound your prior effort. Treating them identically would be irrational.  

  **Where it might not survive**:  
  - **Order dependence can feel unsatisfying**. If Bet B were offered *first*, she'd reject it too (same calculation). But if the bets were offered simultaneously, she'd reject both (as above). So her choices are *consistent across sequences*, but the *reasoning* for rejecting Bet B depends on rejecting Bet A first. This exposes a quirk: **Her rejection of Bet B is rational only because she rejected Bet A**. If Bet B were offered alone, she'd still reject it (α-EU = -5 < 0), but the *justification* shifts.  
  - **Critics argue this is covert sharpness**: Some (e.g., Adam Elga) say α-weighting *implicitly* picks a sharp credence. For α = 0.5, she acts *as if* P(red) = 0.5 (since (0.4 + 0.6)/2 = 0.5). In this case, rejecting both bets aligns with a sharp credence of 0.5 (where each bet has EU = (0.5 × 100) - 55 = -5). But your friend counters: α reflects *attitude to ambiguity*, not belief. She could choose α = 0.3 and accept both bets (α-EU for each = 0.3×(-15) + 0.7×5 = -4.5 + 3.5 = -1 < 0? Wait, no—let's compute: at α=0.3, α-EU = 0.3×(-15) + 0.7×5 = -4.5 + 3.5 = -1, still negative. To accept a bet, she'd need α < 0.25. For example, α=0.2: α-EU = 0.2×(-15) + 0.8×5 = -3 + 4 = 1 > 0, so she'd accept each individually. But then she'd take both and lose $10! So for this Dutch-book scenario, only α > 0.25 avoids loss. This reveals a fragility: **Levi's rule only "works" here if her α is sufficiently high (pessimistic) to reject each bet individually**. If she's less pessimistic, she falls into the trap.  

  ### Conclusion
  Your friend's approach **survives your comeback in principle** but **demands a nuanced view of rationality**. Levi's rule:  
  - Avoids "guaranteed money left" by rejecting individually ambiguous bets.  
  - Avoids "sharp credence in disguise" by using the entire range for decisions.  
  - Justifies sequential dependency via path-sensitive risk (rejecting Bet A alters Bet B's context).  

  However, it hinges on accepting that:  
  1. **Temporal order creates materially different decision contexts**, even with symmetric bets.  
  2. **Ambiguity aversion (α)** must be strong enough to block "Dutch-bookable" choices.  

  If you believe rationality requires *identical treatment of identical epistemic situations*, her view fails. But if rationality includes *defending against dynamic exploitation*, her view holds ground. The unresolved tension is whether "everything that matters" includes the *history of actions* or just the *current belief and stakes*. Imprecise probabilists argue the former; strict Bayesians insist on the latter.
