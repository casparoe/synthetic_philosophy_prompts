  - Lenman's original argument that cluelessness is basically fatal to act consequentialism as an action-guiding theory
  - treating cluelessness as just garden-variety Bayesian uncertainty that a prior + an expected value calc can absorb
  - switching to an evidence-relative/subjectivized consequentialism where only reasonably foreseeable consequences count toward rightness
  - Mogensen's "maximal cluelessness" point, that complex cluelessness is way more pervasive than Greaves' framework suggests, to the point where it threatens the case for x-risk work too
  - the Beckstead-style "robustness" move of leaning on broad interventions (like x-risk reduction) that look good across most reasonable models of the far future
  - just biting the bullet that cluelessness is a general problem for any theory that cares about consequences at all, not something specific to consequentialism
  - GiveWell-ish pragmatic bracketing: focus on the measurable near term stuff and dont let complex cluelessness paralyze you

  Format as a JSON block like:

