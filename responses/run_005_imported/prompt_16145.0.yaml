  ok so I've been deep in the consequentialist cluelessness rabbit hole this week (started with a GPI paper, three tabs later I'm reading old EA forum threads on flow-through effects at 1am, u know how it goes). I want a sanity check on which of the standard "solutions" to cluelessness actually buy back real action-guidance vs which ones are just a fancy way of not answering the question.

