  In the absence of an observation model, the shift toward Blue is rational because:

  1. The constraint forces a redistribution within Red that leads to a net decrease in the probability of Red (because the low-probability event within Red, R_S, is forced to be even lower relative to the prior, and the high one is increased, but the increase is less than the decrease because of the way the constraint is applied).

