  What's wrong with the intuition that evidence "only about" Red shouldn't affect Blue? It assumes that the evidence is conditionally independent of Blue given Red. But we don't have a model of the evidence. The constraint we are given is a constraint on the posterior distribution. It does not come with a guarantee of conditional independence. In fact, the constraint on the conditional distribution within Red does not preclude an overall shift in the probability of Red.

