  I'll keep questions precise but open-ended, showing deep familiarity with the literature (CliqueBot vs FairBot, "modal combat" origins). Tone should be respectfully rigorous - this is for an expert audience. Flow matters: each question should build on the last, with the transparency sequence as the interrogation core.

