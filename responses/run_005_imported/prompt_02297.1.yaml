answer: |-
  Here's a breakdown of the Goodman-Lessing debate on forgeries, directly addressing your argument with your friend:

  **The Core Dispute:**

  *   **Your Friend (and Lessing):** If two objects are perceptually indistinguishable *even to experts*, they are aesthetically identical. Any claimed difference is about pedigree/provenance (history, authenticity), not the aesthetic experience itself. The "wrong" of forgery is moral (deception) or economic (fraud), not aesthetic.
  *   **Goodman:** Aesthetic properties are *not* solely inherent in the immediate sensory data. How we perceive, interpret, and *constitute* the work as art is fundamentally shaped by knowledge of its origin and history. Knowing it's a forgery changes the *very act of aesthetic perception* and what properties we can ascribe to it. Authenticity is an *aesthetic* factor.

  **Nelson Goodman's Argument (From "Languages of Art"):**

  Goodman's argument is subtle and hinges on his broader theory of symbols and how we understand art. It's not just "history matters," but *how* that history infuses the perceptual act:

  1.  **Art as Symbol System:** Artworks function within complex symbol systems. Understanding them involves recognizing "symptoms" (like brushstrokes, color, composition) *as* belonging to a specific artist's style, period, or tradition.
  2.  **Constitutive Conventions:** Our perception is governed by "constitutive conventions." Knowing a work is *by Vermeer* activates a specific set of conventions for looking: we see the brushstrokes *as* expressive of 17th-century Dutch mastery, subtlety, and innovation. We interpret light effects *as* deliberate choices within Vermeer's known oeuvre.
  3.  **Forgery Changes the Conventions:** When we know a work is *by Van Meegeren*, an entirely different set of conventions is activated. Now, the *same* brushstrokes might be seen *as* clumsy imitations, desperate attempts to mimic, or evidence of technical shortcuts. The light effects might be seen *as* garish or melodramatic deviations from Vermeer's subtlety.
  4.  **Differentiation & Discrimination:** Goodman argues that aesthetic experience isn't passive reception but active *differentiation* and *discrimination*. Knowing the origin changes *what we look for* and *how we categorize* what we see. A perceived "subtlety" in a *known* Vermeer might be perceived as "vagueness" or "lack of resolution" in a *known* Van Meegeren forgery of Vermeer.
  5.  **The "Future Perception" Point:** This is where it gets "weirder." Goodman contends that knowing a work is authentic allows us to see it *as part of a developing style or artistic problem-solving process*. We see it in relation to the artist's other works and its influence. A forgery, even a perfect one, cannot be integrated into the *genuine* artist's development. This knowledge fundamentally alters how we perceive its *significance* and *relationships*, even if the immediate sensory data is identical. Authenticity grants the work a specific place in art history that shapes its meaning and our perception *now* and *in the future*.
  6.  **Conclusion for Goodman:** Therefore, the "genuine" Vermeer and the "forged" Vermeer are **not the same work of art**, even if they look identical. They belong to different symbol systems (Vermeer's authentic corpus vs. Van Meegeren's deceptive corpus), activate different constitutive conventions for perception, and possess different aesthetic properties *because* of their different histories. **Aesthetic indiscernibility does not imply aesthetic identity.**

  **Alfred Lessing's Argument (From "What Is Wrong with a Forgery?"):**

  Lessing directly challenges the idea that authenticity is an aesthetic property:

  1.  **The Aesthetic Stance:** The aesthetic value of a work resides *solely* in the perceptual experience it affords. This experience is based on the work's observable properties – line, color, form, composition, expression – as they appear to a suitably sensitive and informed viewer.
  2.  **Perceptual Identity = Aesthetic Identity:** If two objects are perceptually indistinguishable (even to experts under ideal conditions), then the aesthetic experience they provide *must* be identical. There is no "hidden" aesthetic property accessible only through knowledge of provenance.
  3.  **Authenticity is Extrinsic:** The fact that a painting was created by Vermeer in the 17th century, rather than by Van Meegeren in the 20th, is an *extrinsic*, historical fact *about* the object. It doesn't change the object's intrinsic, perceivable qualities.
  4.  **The Wrong is Non-Aesthetic:** Lessing agrees forgery is wrong, but locates the wrong entirely in the realms of:
      *   **Deception/Fraud:** Lying about the object's origin for financial gain or prestige.
      *   **Violation of Artistic Achievement:** The forger parasitically exploits the genuine artist's creativity and reputation without contributing original artistic value of their own.
      *   **Historical Confusion:** Muddying the historical record of an artist's development.
  5.  **Conclusion for Lessing:** The genuine Vermeer and the perfect Van Meegeren forgery **are aesthetically identical objects**. The profound differences between them are moral, historical, and economic, **not** aesthetic. To claim otherwise is indeed "snobbery" about pedigree, confusing the object's history with its inherent aesthetic qualities.

  **Clash of Objections & Which Survives Better?**

  1.  **Lessing's Objection to Goodman: "The Epistemic Problem"**
      *   **Objection:** How can the *same* sensory data suddenly possess *different* aesthetic properties (subtlety vs. vagueness) just because we learn a historical fact? Isn't Goodman confusing the *interpretation* or *significance* of the experience with the aesthetic experience *itself*? Isn't he smuggling non-perceptual factors (history) into the definition of the aesthetic?
      *   **Goodman's Response:** Goodman argues that perception is *always* "theory-laden" and guided by concepts. There is no pure, unmediated "sensory data" divorced from our cognitive framework. Knowing the origin *is* part of the framework necessary to perceive the work *as art* correctly. The properties *are* relational – "subtlety" *relative to Vermeer's known style* is a genuine aesthetic property we perceive *when we know it's Vermeer*. We cannot perceive that specific relational property without that knowledge.

  2.  **Goodman's Objection to Lessing: "The Van Meegeren Paradox & Future Perception"**
      *   **Objection:** Lessing's view struggles with the actual historical case. Van Meegeren's "Vermeers" *were* initially perceived as masterpieces by experts. *After* being revealed as forgeries, the *same paintings* were suddenly perceived as clumsy, garish, and obviously flawed by many of the same experts. How can Lessing explain this dramatic shift in perceived aesthetic properties if the sensory data and the viewer's sensitivity haven't changed, only the knowledge of origin? Goodman argues this proves knowledge *constitutively changes* the aesthetic perception.
      *   **Lessing's Response:** Lessing might argue the initial experts were simply *wrong* in their aesthetic judgment, fooled by the historical context/deception. The later perception is the *correct* aesthetic judgment of the painting's intrinsic qualities, now unclouded by false beliefs about its origin. The *real* aesthetic properties were always there (the clumsiness, garishness); the experts just misperceived them initially due to bias.

  3.  **Goodman's Objection to Lessing: "The Work vs. The Object"**
      *   **Objection:** Lessing conflates the physical *object* with the *work of art*. The work of art *includes* its genesis and place in an artist's development. A perfect forgery is a different *work* (a Van Meegeren "in the style of Vermeer") masquerading as another *work* (a genuine Vermeer). They are different works, hence aesthetically different *by definition*.
      *   **Lessing's Response:** This is question-begging. It simply *defines* authenticity into the artwork, making the argument tautological ("real Vermeers are aesthetically superior because they are real Vermeers"). Lessing insists the *aesthetically relevant* properties are those perceptible in the object itself, regardless of origin.

  **Which Position Survives Better?**

  Goodman's position generally emerges as the more robust and philosophically sophisticated in this debate:

  1.  **Explains Real-World Phenomena:** Goodman's framework directly explains the **Van Meegeren Paradox** – why perceptions of the *same object* change so drastically upon revelation of forgery. Lessing's explanation ("the experts were just wrong initially") seems inadequate and dismissive of the powerful role context plays.
  2.  **Acknowledges Cognitive Load of Perception:** Goodman correctly identifies that aesthetic perception is an active, cognitive process deeply intertwined with knowledge and expectation. We don't perceive art in a vacuum. Lessing's ideal of pure perceptual data is arguably a philosophical fiction.
  3.  **Handles "Future Perception":** Goodman's point about the work's place in art history shaping its perceived significance and relationships is powerful. A forgery cannot *genuinely* participate in the narrative of Vermeer's development, and this *does* affect how we see it *now*.
  4.  **Avoids the Tautology Trap:** While Goodman defines the artwork to include origin, he does so based on a plausible theory of how symbols and conventions function in art appreciation, not merely as a circular definition. His argument shows *why* origin matters for perception.

  **Lessing's strength** lies in its intuitive appeal and its defense against elitism. He rightly identifies the non-aesthetic harms of forgery. However, his strict separation of the aesthetic from the historical struggles to account for the demonstrable *effect* historical knowledge has on our actual aesthetic experience and judgment. Goodman shows that pedigree isn't *just* snobbery; it fundamentally structures how we see and understand the work *as art*.

  **Conclusion:** While Lessing offers a clear, empiricist stance, **Goodman's argument better survives the core objections.** His theory that knowledge of authenticity *constitutively changes the act of aesthetic perception and the properties we can discern* provides a more compelling explanation for how we actually engage with art, especially when confronted with the fascinating and problematic case of the perfect forgery like Van Meegeren's. Your friend's position (Lessing's) captures an important truth about perceptual qualities but ultimately underestimates how deeply intertwined knowledge, history, and perception are in the aesthetic realm. Goodman's "weirder" point about future perception and constitutive conventions reveals the deeper complexity.
