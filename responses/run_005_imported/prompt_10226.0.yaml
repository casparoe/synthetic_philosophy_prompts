prompt: |-
  I just got put on my hospital's root-cause-analysis committee (total baptism by fire — this is my first case). A patient had a slow overnight bleed that nobody caught: the night nurse, the covering resident, and the attending each had at least one point where ordering another set of vitals or an extra scan probably would've caught it in time, but none of them did anything actively wrong — they each just didn't do the one extra thing. Half the committee wants to write this up as a pure systems failure with no individual responsibility, since if you start faulting the resident for not re-checking, you might as well fault the nurse, the attending, whoever wrote the staffing schedule that night, even the board for not funding more nursing staff. The other half thinks that logic is a recipe for never holding anyone accountable for anything, ever. Can you draft the reccomendation memo I have to bring to Tuesday's meeting -- it's basically going to set precedent for how we handle "failure to rescue" cases from now on, so it needs an actual decision rule for when an omission counts as someone's fault versus everyone's (or no one's), and it has to seriously engage with the "systems failure" side instead of just gesturing at it and then pinning the blame on an individual anyway.
reasoning: |-
  Okay, the user is a healthcare professional newly appointed to a root-cause-analysis committee, facing their first complex case. They're describing a "failure to rescue" scenario where multiple clinicians (nurse, resident, attending) missed opportunities to detect a slow overnight bleed, but no single person made an active error. The committee is polarized between viewing this purely as a systems failure versus assigning individual accountability. 

  The user's request is deceptively challenging: they need a recommendation memo that establishes a precedent-setting decision rule for similar cases. What makes this thorny is the tension between two legitimate concerns - the "swiss cheese model" reality where system gaps enable errors, versus the moral hazard of never holding individuals accountable for omissions. 

  I notice the user is subtly signaling their own stance through phrases like "baptism by fire" and the observation that half the committee wants to avoid blaming understaffing. They seem to lean toward a balanced approach but need cover for what will inevitably be a controversial decision. The memo must satisfy several unspoken needs: protect vulnerable frontline staff from scapegoating while upholding standards, acknowledge systemic constraints without excusing inaction, and give the committee concrete criteria to avoid endless philosophical debates.

  The clinical nuances matter here. A slow bleed is insidious - vital signs might initially compensate, labs can lag, and symptoms may be masked in sleeping patients. This isn't like missing a gunshot wound. The "failure to rescue" framework suggests we should judge actions based on whether reasonable clinicians would recognize deterioration given available data. 

  For the memo structure, I'm considering starting with core principles to anchor the decision: accountability exists on a spectrum, systems create the context but individuals make choices within it. The key differentiator might be whether the omission deviated from what a reasonable peer would do in that specific context - not an idealized standard. 

  The hardest part will be defining "reasonable" objectively. We can reference: unit culture norms (e.g. do nurses typically page for borderline vitals?), published clinical decision rules, and whether the patient met known escalation criteria (like MEWS scores). Crucially, the burden should shift based on role - an attending's failure to investigate subtle signs is more consequential than a nurse's. 

  I'm wary of solutions that just recommend "more training" - that's often performative. Better to propose specific system changes like mandated vital sign reassessment windows for certain labs, or hardwiring communication tools. But the memo must explicitly state that system fixes don't absolve individuals when their choices fell below standard. 

  The tone needs to be authoritative but not punitive. Phrases like "duty to act" carry more weight than "should have." And we should emphasize that accountability isn't about punishment - it's about restoring trust through transparency when professionals don't meet obligations to patients.
answer: |-
  ## RCA Committee Recommendation Memo: Framework for Failure-to-Rescue Accountability  

  **To:** Root Cause Analysis Committee  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Decision Framework for Individual vs. Systems Accountability in Failure-to-Rescue Cases  

  ---

  ### **I. Case Summary**  
  Patient experienced undetected slow overnight bleed despite multiple potential intervention points by nursing, resident, and attending staff. No single clinician committed an identifiable error, but collective omissions in vigilance (e.g., unrepeated vitals, unrequested scans) led to delayed intervention. Committee is divided on assigning individual accountability versus pure systems failure.  

  ---

  ### **II. Core Recommendation**  
  **Adopt a Dual-Accountability Framework:** Assign responsibility to *both* systems and individuals when omissions meet defined thresholds. Reject false binaries ("systems vs. people"). Instead, use the **Reasonable Clinician Test** to determine individual accountability, paired with rigorous systems analysis.  

  ---

  ### **III. Decision Rule: "When is an Omission an Individual's Fault?"**  
  An omission constitutes individual accountability if **ALL** criteria are met:  
  1. **Foreseeability:** The risk was clinically recognizable (e.g., post-op bleed risk, borderline vitals).  
  2. **Capability:** The clinician had the authority/resources to act (e.g., nurse could repeat vitals; resident could order scan).  
  3. **Deviation:** Action/inaction deviated from:  
     - **a)** Hospital policy/protocol, OR  
     **b)** Specialty-specific standard of care, OR  
     **c)** The "Reasonable Clinician Test" (Would 80%+ of peers in similar role/context have acted?).  

  *If all 3 criteria are unmet → Pure systems failure.*  
  *If all 3 are met → Individual accountability exists alongside systems factors.*  

  ---

  ### **IV. Application to Current Case**  
  | Role          | Foreseeable? | Capable? | Deviation?        | Accountability? |  
  |---------------|--------------|----------|-------------------|----------------|  
  | **Night Nurse** | Yes (vital trends) | Yes (repeat vitals) | **Yes** (no repeat despite instability)* | **Individual** |  
  | **Covering Resident** | Yes (nurse report + chart) | Yes (order scan/labs) | **Mixed** (depends on signout clarity) | **Systems-Leaning** |  
  | **Attending** | Yes (overall risk) | Yes (override/redirect) | **No** (if not alerted) | **Systems** |  
  **\*** *Assumes vital trends met hospital escalation protocols (e.g., MEWS score).*  

  **Finding:** **Shared accountability.** Nurse omission meets all 3 criteria. Resident/attending gaps reflect systems issues (signout rigor, escalation pathways).  

  ---

  ### **V. Systems Analysis & Action Plan**  
  **1. Accountability Actions:**  
     - **Nurse:** Retraining on vital sign escalation protocols.  
     - **Resident/Attending:** No blame, but system redesign (see below).  

  **2. Critical Systems Fixes:**  
     - **Hardwire Escalation:** Automated EMR alerts for vital sign deterioration (e.g., 2x borderline SBP triggers mandatory nurse/resident review).  
     - **Standardize Handoffs:** Mandatory I-PASS for overnight coverage; attending backup contact verification.  
     - **Resource Audit:** Validate night staffing against patient acuity metrics (not just ratios).  

  **3. Culture Shift:**  
     - **Just Culture Framework:** Distinguish human error (training) from at-risk behavior (coaching) from reckless (discipline).  
     - **Blame-Free Reporting:** Pilot "Good Catch" logs for near-misses without fear.  

  ---

  ### **VI. Precedent Setting**  
  This framework **rejects blanket immunity** for omissions while **preventing scapegoating**:  
  - **Individual accountability** applies only when clinicians deviate from *clear, achievable* standards.  
  - **Systems accountability** is *always* examined concurrently.  
  - **Resource constraints** (e.g., staffing) are systems issues – never excuse individual omissions *if standards were achievable*.  

  ---

  ### **VII. Committee Approval Requested**  
  Move to adopt this framework for all failure-to-rescue RCAs, effective immediately. Finalize systems interventions by [Date].  

  **Signature:** ________________________  
  **Chair, RCA Committee**  

  ---

  ### Key Talking Points for Meeting:  
  1. **"Reasonable Clinician Test"** prevents over-blaming but upholds standards: If 80% of peers would act, it’s not "extra" – it’s expected.  
  2. **Resources matter:** If staffing/resources made action impossible, it’s a systems failure (Criterion 2 unmet).  
  3. **This isn’t "who to punish"** – it’s "where do we reinforce standards vs. redesign systems?"  
  4. **Precedent protects staff:** Clear rules > arbitrary blame.  

  This memo balances just accountability with relentless systems focus – ensuring we *fix* problems, not just assign them.
