  Next, behavioral economics. The user references Strotz/Laibson's work on hyperbolic discounting. This is fascinating because Ramsey diagnosed "imagination failure" as a psychological flaw, while behavioral econ provides empirical proof of time-inconsistency. Ramsey would likely see this as validation—but with caveats. His model was normative (how we *should* act), not descriptive (how we *do* act). He'd probably view irrational discounting as a problem to overcome, not a parameter to build into models. 

  Then there's longtermism. Parfit's influence pushes Ramsey's intergenerational ethics to extremes. But Ramsey operated in a 1920s Cambridge milieu focused on proximate futures. Would he endorse obligations to distant potential people? His utilitarian math technically extends that far, but his writing suggests practical limits. The tension here is between pure logic and embodied moral intuition. 

