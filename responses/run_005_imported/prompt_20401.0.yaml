  For the third point, the user discusses superdeterminism and many-worlds. They say superdeterminism rejects statistical independence, which is separate from locality. That's accurate—superdeterminism avoids nonlocality by denying free choice or hidden variable independence. But it's controversial because it challenges experimental assumptions. For many-worlds, the user mentions locality in the Heisenberg picture. I remember that in MWI, all outcomes occur, so there's no single outcome to influence others. However, the non-separability of the wave function might still imply a form of nonlocality. The user's characterization is defensible but should note ongoing debates.

