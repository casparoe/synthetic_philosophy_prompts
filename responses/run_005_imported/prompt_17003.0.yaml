answer: |-
  You've pinpointed a fascinating and genuine tension within Aristotle's economic thought (*Politics* I.8-11 & *Nicomachean Ethics* V.5). Let's break down the two positions and why they clash:

  1.  **Money as Nomos (Convention/Law):**
      *   Aristotle argues that money (*nomisma*) is not valuable "by nature" (*physei*). Unlike a sheep (which provides wool, milk, meat) or grain (which provides sustenance), a coin has no inherent, natural utility for satisfying basic human needs.
      *   Its value arises solely from social convention (*nomos*) and legal agreement (*nomisma* derives from *nomos*). It is a human invention created to overcome the limitations of barter, serving as a universally accepted medium of exchange, unit of account, and store of value.
      *   This view emphasizes the *artificiality* and *contingency* of money's value. Its worth is not fixed in the nature of the metal but assigned by the community.

  2.  **Usury as Unnatural (Para Physin) due to Money's Sterility:**
      *   Aristotle condemns usury (*tokos*) as the most unnatural (*para physin*) form of wealth-getting.
      *   His core argument hinges on the physical nature of money itself: money is "barren" or "sterile" (*akarpotaton* - literally "most fruitless").
      *   Unlike living things (sheep can breed lambs) or seeds (which can grow into crops), money, being inanimate metal, *cannot naturally reproduce itself*. A coin cannot give birth to another coin.
      *   Charging interest (*tokos*) is therefore an unnatural act because it *pretends* that money can breed (*tokos* also means "offspring"). It forces money to generate more money from itself, violating its inherent, sterile nature. This is pure exchange for its own sake (*kapelike*), detached from the natural end of household management (*oikonomia*), which is to acquire goods necessary for life.

  **The Core Contradiction:**

  The tension arises precisely where you identified it: **The usury argument implicitly grants money a "natural" characteristic (sterility) and a "natural" function that is violated, directly contradicting the claim that money has *no* inherent natural properties or value.**

  1.  **"Sterility" as a Natural Property:** By asserting that money is "barren by nature" (*akarpotaton*), Aristotle *is* attributing a fundamental, inherent characteristic to the *substance* of money (metal coins). He's saying this sterility is an objective fact about the *physical nature* of the object, akin to the natural properties of a sheep or a seed. This directly undermines the purely conventional (*nomos*) view. If money's value is *only* convention, then its physical properties (like being metal) are irrelevant to its economic function – convention could theoretically assign value to *anything*, and that value could theoretically "breed" if convention allowed it (e.g., through interest).

  2.  **A "Natural" Function for Money?:** The usury argument relies on the idea that money has a *proper, natural use* (facilitating exchange for acquiring real goods for the household) which usury perverts. Aristotle explicitly states that money's "proper function" (*chreia*) is to be used in exchange (*Politics* 1257a). While he distinguishes this natural use (*chrematistike*) from unnatural money-making (*kapelike*), the usury critique pushes further. It suggests that using money to directly beget more money *violates its inherent nature as a sterile object*. This implies that money *does* have a natural telos (end/purpose) tied to its physical form (facilitating exchange, not self-replication), which is precisely what the *nomos* theory denies. The *nomos* theory says its purpose is *assigned* by society, not inherent.

  3.  **Convention vs. Nature in the Act of Usury:** If money's value and function are *purely* matters of convention (*nomos*), then why couldn't the convention *include* charging interest? Society could simply agree that lending money *entitles* the lender to more money back. Aristotle's argument against this relies *not* on convention being violated, but on an appeal to the *physical nature* of the object (its sterility) and the *unnaturalness* of making it "breed." He appeals to *physis* (nature) to condemn a practice he claims exists only due to *nomos* (convention). This creates a logical gap: How can something defined solely by convention violate a natural law?

  **Possible (Inadequate) Resolutions & Why the Tension Remains:**

  *   **Distinguishing Substance from Function?** One might argue Aristotle is saying the *metal* has natural sterility, while the *function* (medium of exchange) is conventional. But his usury argument explicitly ties the *function* of money-generation to the *sterility of the substance*. He doesn't say "Convention shouldn't allow breeding"; he says "Breeding is impossible *by nature*."
  *   **Teleology Creeping In:** Aristotle's strong teleological worldview (everything has a natural purpose) likely influenced the usury argument. He sees the *natural purpose* of wealth acquisition as supporting the household. Usury, generating money from money without involving real goods or productive activity, seems like a perversion of that natural order. However, this teleological view of *wealth* clashes with the nominalist view of *money itself*. If money is purely conventional, its "purpose" should also be purely conventional, not subject to judgments based on natural sterility.

  **Conclusion:**

  You are correct. There is a significant inconsistency between Aristotle's two propositions. His powerful and influential argument against usury fundamentally relies on attributing a natural characteristic (sterility) and a natural functional limit to money. This contradicts his foundational assertion that money has *no* inherent natural value or properties, deriving its entire being and function from human convention and law (*nomos*). The usury argument needs money to have a "nature" (its sterility) that the conventionalist theory explicitly denies it possesses. The tension highlights the difficulty of fully separating the physical substance of money from its social function, even for a thinker as rigorous as Aristotle. His teleological instincts seem to have overridden his nominalist insight in the case of usury.
