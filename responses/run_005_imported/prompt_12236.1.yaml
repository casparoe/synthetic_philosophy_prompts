prompt: |-
  A friend and I have spent the last couple of years building a statistical model for a fairly niche category of sports wagers, initially just as a way to put our shared background in statistics to some use outside our day jobs. Backtesting against several seasons of results has convinced us the model has found a genuine, persistent edge: on this type of bet, which happens to pay even money, our model puts the true probability of winning at about 55 percent rather than the 50 percent the price implies, so a winning bet doubles our stake and a losing one costs us the whole stake, with each bet effectively independent of the last. We intend to keep placing bets like this for years, rolling our winnings back into the pool rather than withdrawing them along the way. My friend's position is that since any individual bet here has a clearly positive expected value -- about 10 cents of profit for every dollar staked, on average -- the only defensible policy is to stake our entire bankroll on every single bet, since holding anything back just forfeits expected profit for nothing in return. When I push back that betting everything, every time, for years on end, seems obviously too risky, he says "too risky" is a feeling rather than an argument: if we're both genuinely indifferent to the possibility of losing it all, there's no further fact that could make a smaller stake the rational one, because expected value is exactly the quantity that rationality tells us to maximize.

  I would like to know whether he's actually right about that. Is it true that only risk aversion could ultimately justify staking less than everything on each bet here, or is there some more basic argument -- one that would apply even to two people who are genuinely indifferent to risk -- for why committing the whole bankroll every time would still be a mistake? If such an argument exists, I'd like to understand what fraction of the bankroll it would actually recommend staking on each bet, and how that number follows from the figures above, rather than just being told to be more careful.
reasoning: |-
  We are given a scenario where each bet has a 55% chance of winning and pays even money (so you double your stake if you win, and lose it if you lose). The expected value per unit staked is:
    E = (0.55 * 2) + (0.45 * 0) = 1.10, meaning a 10% expected return per bet.

  However, the friend argues that we should bet the entire bankroll on every bet because each bet has positive expected value. The question is whether this is the rational strategy even if we are risk-neutral.

  But note: if we bet the entire bankroll and lose the first bet, we are ruined and cannot bet again. The goal is to bet repeatedly over many years, rolling over the winnings.

  The key is to consider the long-term growth rate of wealth, which is maximized by the Kelly criterion. The Kelly criterion maximizes the expected logarithm of wealth. This is equivalent to maximizing the geometric growth rate.

  The formula for the fraction of the bankroll to bet in this even-money bet setting is:

    f* = p - q

  where:
    p = probability of winning (0.55)
    q = probability of losing (0.45)

  But note that in the even-money bet, when you win you get your stake back plus an amount equal to your stake (so net gain is equal to stake). Therefore, the net gain is 1:1. The general Kelly formula for a bet that pays b:1 (meaning you get b units for each unit staked, plus your stake back) is:

    f* = (bp - q) / b

  In our case, the bet pays even money: so if you bet 1 unit and win, you get 2 units (your 1 unit back plus 1 unit profit). Thus, the profit is 1 unit for each unit staked, so b = 1.

  Therefore:

    f* = (1 * 0.55 - 0.45) / 1 = 0.55 - 0.45 = 0.10

  So the Kelly criterion recommends betting 10% of the current bankroll on each bet.

  Why is this better than betting 100%? Because it maximizes the long-term growth rate. Betting 100% has a high chance of leading to ruin (even though the expected value after one bet is positive, if you lose you are ruined and cannot continue). The Kelly fraction balances growth and risk.

  Moreover, if we are risk-neutral, we might be tempted to maximize expected value. However, in a repeated betting scenario, the expected value of the bankroll after many bets is not additive because of the multiplicative nature of the bets. In fact, if we bet a fraction f of the bankroll repeatedly, the bankroll after n bets (with k wins and n-k losses) is:

    Bankroll_n = Bankroll_0 * (1+f)^k * (1-f)^(n-k)

  The expected logarithm of the bankroll is:

    E[log(Bankroll_n)] = log(Bankroll_0) + k * log(1+f) + (n-k) * log(1-f)

  Taking expectation per bet (with p for win and q for loss):

    Per bet: E[log(1 + return)] = p * log(1+f) + q * log(1-f)

  We want to maximize this with respect to f.

  The Kelly fraction f* maximizes this expression. For our numbers:

    g(f) = 0.55 * log(1+f) + 0.45 * log(1-f)

  We can take the derivative and set to zero:

    g'(f) = 0.55/(1+f) - 0.45/(1-f) = 0

    0.55/(1+f) = 0.45/(1-f)
    0.55*(1-f) = 0.45*(1+f)
    0.55 - 0.55f = 0.45 + 0.45f
    0.55 - 0.45 = 0.55f + 0.45f
    0.10 = f

  So f* = 0.10.

  Therefore, the Kelly criterion says we should bet 10% of the bankroll on each bet.

  What about the expected value? Note that if we bet a fraction f repeatedly, the expected value of the bankroll after n bets is:

    E[Bankroll_n] = Bankroll_0 * [p*(1+f) + q*(1-f)]^n
                   = Bankroll_0 * [0.55*(1+f) + 0.45*(1-f)]^n
                   = Bankroll_0 * [1 + 0.10f]^n

  But this expected value can be made arbitrarily large by increasing f (if we could bet more than 100% we would, but we are limited by our bankroll). However, note that the probability of ruin is also increasing with f. The Kelly criterion, by maximizing the growth rate, balances the trade-off.

  Moreover, note that if we bet more than the Kelly fraction, the long-term growth rate decreases and the risk of ruin increases. In fact, betting 100% leads to almost certain ruin (with probability 0.45 on the first bet, and if we survive the first, then 0.45 on the second, etc. so the probability of surviving n bets is 0.55^n, which goes to 0 as n increases).

  Therefore, even for risk-neutral agents, the rational strategy in the long run is to maximize the growth rate (i.e., use the Kelly criterion) because it maximizes the expected logarithm of wealth, which is equivalent to maximizing the median and mode of the terminal wealth and also minimizes the time to reach a given wealth goal.

  In summary, your friend is not correct. The argument for not betting the entire bankroll is not solely based on risk aversion but on the long-term growth of wealth. The Kelly criterion provides the fraction that maximizes the growth rate, and that fraction is 10% in this case.

  So the recommended fraction is 10% of the current bankroll per bet.
answer: |-
  Your friend's argument, while compelling for a single bet, overlooks the critical implications of repeated betting over time. When bets are independent and you reinvest your entire bankroll repeatedly, the goal shifts from maximizing the expected value of a single bet to maximizing the long-term growth rate of your bankroll. This is where the **Kelly criterion** provides a rigorous counterargument, even for risk-neutral individuals. Here's a step-by-step explanation:

  ### 1. **The flaw in maximizing expected value for repeated bets**
     - Your friend focuses on the expected value (EV) of a single bet:  
       EV = (0.55 × 2) + (0.45 × 0) = 1.10 units per unit staked (a 10% edge).  
       Betting the full bankroll does maximize EV for one bet.  
     - However, in repeated betting, if you lose any single bet, you go bankrupt and cannot place future bets. The probability of eventual bankruptcy approaches **100%** if you bet your entire bankroll repeatedly:  
       - Probability of surviving \(n\) bets = \(0.55^n\) (since each bet has a 45% chance of ruin).  
       - As \(n\) grows large, \(0.55^n \to 0\).  
     - Thus, betting everything sacrifices almost all future EV for a small gain today. Rationality requires considering the entire sequence of bets, not just one.

  ### 2. **Maximizing long-term growth: The Kelly criterion**
     The Kelly criterion maximizes the **exponential growth rate** of your bankroll by optimizing the fraction \(f\) staked per bet. It assumes you are indifferent to risk and care only about long-term wealth. The growth rate \(G\) is:
     \[
     G = p \ln(1 + f) + q \ln(1 - f)
     \]
     where:
     - \(p = 0.55\) (win probability),
     - \(q = 0.45\) (loss probability),
     - \(f\) = fraction of bankroll wagered.

     To maximize \(G\), take the derivative with respect to \(f\) and set it to zero:
     \[
     \frac{dG}{df} = \frac{p}{1 + f} - \frac{q}{1 - f} = 0
     \]
     Solving:
     \[
     \frac{0.55}{1 + f} = \frac{0.45}{1 - f} \implies 0.55(1 - f) = 0.45(1 + f) \implies 0.55 - 0.55f = 0.45 + 0.45f \implies 0.10 = f
     \]
     **Result:** The optimal fraction is \(f^* = 0.10\) (10% of your bankroll per bet).

  ### 3. **Why 10%?**
     - **Growth rate:** Betting 10% maximizes \(G \approx 0.55 \ln(1.1) + 0.45 \ln(0.9) \approx 0.008\) (or 0.8% per bet). This compounds exponentially.  
     - **Comparison to full-bankroll betting:**  
       - Betting 100%: \(G = 0.55 \ln(2) + 0.45 \ln(0) = -\infty\) (ruin is certain long-term).  
       - Betting 10%: Bankroll grows at ≈8% per 10 bets (expected).  
     - **Expected value after many bets:**  
       - With \(f^* = 0.10\), the median bankroll after \(n\) bets grows as \(\exp(n \cdot G)\).  
       - Betting 100% has higher EV *if* you avoid ruin, but the probability of ruin dominates, making the *typical outcome* (e.g., median) far worse.

  ### 4. **The role of risk neutrality**
     - Your friend is correct that risk aversion might justify staking less, but it is **not necessary** here. The Kelly criterion applies even if you are risk-neutral:  
       - It maximizes the expected logarithm of wealth, which is equivalent to maximizing the median wealth in the long run.  
       - Rational agents should prefer a strategy that almost surely dominates alternatives over time. Betting 10% does this; betting 100% leads to near-certain ruin.  

  ### 5. **Practical implications**
     - **Bankroll management:** Stake **10% of your current bankroll** on each bet. As your bankroll grows/shrinks, so does your bet size.  
     - **Why not more?** Betting >10% (e.g., 20%) lowers \(G\) and increases the risk of severe drawdowns. Betting >20% can even make \(G\) negative.  
     - **Robustness:** If your edge is slightly wrong (e.g., true \(p = 0.53\)), staking 10% remains robust, while overstaking risks ruin.

  ### Conclusion
  Your friend is mistaken: Rationality does **not** require betting your entire bankroll. Even for risk-neutral bettors, the Kelly criterion proves that staking 10% maximizes long-term growth and avoids almost certain ruin. This fraction is derived directly from your 55% win probability and even-money payoff:  
  \[
  f^* = p - q = 0.55 - 0.45 = 0.10.
  \]  
  Staking 10% balances growth and sustainability, turning your edge into compounded profits over years. Betting everything forfeits this for a fleeting, self-destructive gamble.
