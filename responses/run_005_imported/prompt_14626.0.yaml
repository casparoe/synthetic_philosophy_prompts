answer: |-
  Here’s a tight, layered scene hitting your beats—no strawmen, philosophical precision, and raw emotion simmering under formal wake attire:

  **Characters:**  
  - **ADLER** (60s, sharp, historically-minded, grip tightening on his whiskey glass)  
  - **BAUER** (70s, frail but intellectually fierce, leaning on his cane like a rapier)  

  **Setting:**  
  A cramped Weimar-era study repurposed for the wake. Rain streaks the windows. Low murmur of shocked colleagues.  

  ---

  **(BAUER stares into the dregs of his brandy. Adler approaches, face taut.)**  

  **ADLER:**  
  *They found it in his desk, Gustav. The diaries. Page after page calling us... vermin. While he rebuilt mathematics in our seminar rooms.*  

  **BAUER:**  
  *(Doesn’t look up)*  
  A vile mind. An irreplaceable one. The *Grundgesetze* derivations stand. They don’t bleed.  

  **ADLER:**  
  *(Leaning in, voice low but cutting)*  
  You think it’s coincidence? His war on psychologism—this terror that logic might be touched by *human* minds—mirrors his contempt for democratic noise. Both demand purity. Both recoil from the messy, the contingent... the *Jewish*.  

  **BAUER:**  
  *(Eyes snap up, cold)**  
  Correlation isn’t causation, Emil. His Platonism saved logic from subjectivism. That it repels democracy is your gloss.  

  **ADLER:**  
  Is it? *(Sets glass down with a click)* His *drittes Reich*—that "third realm" where thoughts exist untouched by flesh... It’s not just compatible with despising debate, Gustav. It’s the *same* impulse. Clean, eternal truths rising above the stink of human disagreement. Above *democracy*.  

  **BAUER:**  
  *(Stiffening)*  
  Nonsense. The objectivity of number isn’t tyranny! It’s liberation from opinion. You conflate epistemology with politics.  

  **ADLER:**  
  Do I? *(A step closer)* When he banishes psychology from logic for “contaminating” it with human thought—what is that but a purge? He built a citadel where only the flawless may enter. Just like his fantasy Germany. No dissent. No Jews. No debate. Only *order*.  

  **BAUER:**  
  *(Hand white on cane)*  
  So Russell’s paradox—that glorious, devastating flaw in his system—proves what? That cracks in his logic mirror cracks in his soul? *(Scoffs)* Sentimentalism! The paradox would exist if a saint wrote it! His arguments are *objects*, Emil. Like numbers. They don’t inherit his sins.  

  **ADLER:**  
  But *why* did he need thoughts in a sterilized realm, Gustav? *Why* wage holy war on anyone who dared ground logic in mind? It wasn’t just rigor—it was disgust. Disgust at the human element. *(Leans in, relentless)* The very thing that makes democracy possible—that we *build* truth together, through discourse—was filth to him. His philosophy *is* his politics.  

  **BAUER:**  
  *(After a heavy silence, voice graveled but firm)*  
  Then reject the third realm. Challenge his anti-psychologism. Show me where his bigotry *logically entails* a flaw in sense/reference. But don’t... *(He taps the cane hard on the floor)*...don’t ask me to burn the *Begriffsschrift* because the man was rotten. Truth isn’t tainted by its discoverer.  

  **ADLER:**  
  *(Quietly, exhausted)*  
  No. But sometimes... the discoverer is tainted by his truth. That cold, perfect realm he loved? It has no place for mercy. Or democracy. Or us.  

  **(Adler turns away. Bauer stares at Frege’s portrait—rigid, brilliant, inhuman. The rain drums like distant applause.)**

  ---

  **Key Hits Landed:**  
  - **Adler’s Core Hit:** Connects Frege’s philosophical disdain for subjectivity (anti-psychologism/third realm) to his anti-democratic, antisemitic contempt for human "messiness" as the *same* impulse toward purity.  
  - **Bauer’s Core Defense:** Separates the *logical validity* of Frege’s work (which exists independently) from his personal failings. Forces Adler to prove *logical* flaws, not just thematic parallels.  
  - **Adler’s Counter:** Argues Frege’s motivation for the "third realm" (disgust at human cognition) reveals a worldview inseparable from his bigotry.  
  - **Bauer’s Finisher:** Demands philosophical, not moral, refutation. Truth remains objective even if discovered by monsters.  
  - **Subtext:** The "drittes Reich" term hangs unspoken but palpable after Adler’s line—chilling in 1925 Germany. Bauer’s refusal to engage it underscores his compartmentalization.  

  This keeps both views steel-cased: Adler sees philosophy as expression of character; Bauer sees it as transcendent structure. The wake setting—rain, whiskey, portrait—keeps it visceral. No one "wins," but the fracture is absolute.
