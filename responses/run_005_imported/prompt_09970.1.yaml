prompt: |-
  So Leibniz obviously never got to weigh in on Kripke vs. David Lewis, but his letters to Arnauld about Adam's "complete concept" always struck me as him basically half-inventing counterpart theory already -- the bit where he says if Adam hadn't sinned it wouldn't be THIS Adam, just some other possible guy who happens to resemble him. Say you could brief him on the real modern debate: Kripke's rigid designators, where transworld identity is just stipulated and not some puzzle to solve, vs. Lewis's counterpart theory, where no individual is literally in more than one world and "Humphrey could've won" is made true by some similar-enough counterpart winning somewhere else. Which side does Leibniz actually end up on? Don't just give me the obvious "he's basically Lewis" answer -- use the real content of the complete-concept/superessentialism stuff to argue it properly, and give at least one place where his picture doesn't cleanly fit either camp (I keep thinking his view on whether merely possible worlds are even "real" the way Lewis needs them to be is one such spot, but maybe theres a better example).
