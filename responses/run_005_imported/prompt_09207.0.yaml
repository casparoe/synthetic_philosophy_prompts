  Breaking it down: Finkish dispositions involve the disposition itself being removed when the test condition occurs. The sorcerer instantly removes the wire's fragility before impact. So the conditional fails because the disposition isn't present at the moment of testing. Masking, however, keeps the disposition intact but adds an external factor that prevents manifestation. The glass is still fragile, but the padding absorbs the impact. The disposition exists, but the effect is blocked.

  The key difference is in the causal basis. Finkish cases alter the intrinsic basis (like removing charge), while masking introduces external interference without changing the basis. This distinction matters for how to fix the SCA. A solution for finkish cases might require the basis to persist, but that doesn't solve masking since the basis is still there. For masking, you need to ensure no external blockers, which doesn't address finks.

  Then, connecting to free will. Frankfurt cases involve an intervener ready to step in but doesn't. The user wants to know if this intervener is like a fink or a mask. If the intervener removes the ability (finkish), then the person couldn't have done otherwise. If it masks the ability, the ability is still there but blocked. Dispositional compatibilists need to argue that the ability remains (masked) to preserve free will. If it's finkish, the ability is lost, undermining compatibilism.

