prompt: |-
  My friend Dan's getting married in a few weeks and he's asked me to give the best man speech. He and his fiancée are both pretty deep in the rationalist-o-sphere (that's actually how they met, at a meetup), and they've got this running bit where they call their wedding vows "the nice version of Roko's basilisk" -- a commitment that's supposed to hold across time even when nobody can verify you're keeping it, minus the acausal blackmail and eternal torture. Dan half-jokingly told me it would mean a lot if I "worked the basilisk in somehow," since it's become weirdly load-bearing as a piece of their relationship lore at this point.

  Here's my actual problem though: something like a third of the guests are rationalist/EA-diaspora people who will 100% catch a real reference to timeless decision theory or acausal trade and be a little let down if I just namedrop "the basilisk" as a generic scary-AI punchline with no actual content behind it. The other two thirds are Dan's family, who have never heard of LessWrong and do not need the concept of a future superintelligence retroactively torturing people explained to them at a wedding, as a joke or otherwise -- that's just a bad note to hit no matter how its framed, funny or not. So whatever goes in the speech has to be real enough that the initiated crowd gets an honest laugh out of the actual decision theory, while staying vague enough on the object level that nobody's uncle needs a follow-up conversation about infohazards.

  Could you write me something like a 4-5 minute best man speech that threads this? I think the load-bearing move is to lean on the structural similarity -- precommitment, cooperation without any way to check up on each other, maybe even a Parfit's-hitchhiker-flavored beat about trusting someone before you have proof -- rather than the "AI" part of it, and to make it land as a speech about Dan and his fiancée specifically, not a decision theory bit that happens to end with "to the happy couple." Also very open to being told this is a terrible idea for a wedding toast, though at this point I'm kind of committed to it, acausally or otherwise.
