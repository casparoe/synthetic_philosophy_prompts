answer: |-
  ## Dialogue: The Strawson Schism

  **Characters:**  
  *   **Alex:** Defends Galen Strawson’s Basic Argument.  
  *   **Sam:** Defends P.F. Strawson’s reactive attitudes naturalism.  

  **(The scene: A university common room after a reading group meeting. Coffee cups litter the table.)**

  **Sam:** Alex, I still think you’re letting Galen’s Basic Argument spook you unnecessarily. His father, Peter, showed us decades ago why this kind of hyper-intellectualized challenge misses the point. Responsibility isn’t about some impossible, god-like self-creation; it’s woven into the very fabric of our interpersonal lives – resentment, gratitude, forgiveness. That’s the bedrock.

  **Alex:** Sam, I respect P.F.’s insight into how our practices *work*. But Galen’s argument exposes a foundational problem those practices simply *assume* away. It’s not about determinism, which his father successfully sidelined. It’s about *origination*. For anyone to be *ultimately* morally responsible for what they do, they’d have to be *causa sui* – the cause of themselves, specifically their core character and motives.

  **Sam:** We create ourselves through choices over time. We shape our character.

  **Alex:** But *how*? Let’s say you make a choice, Choice X. For that choice to be truly *yours* in a way that grounds ultimate responsibility, it must flow from *you* – your reasons, your values, your character at that moment, State Y. But where did State Y come from? Either:
  1.  It was caused by factors *outside* your control (genetics, upbringing, prior causes) – then *you* aren't ultimately responsible for it, or the choices flowing from it.
  2.  Or, you *chose* State Y. But that choice, Choice Z, would itself require you to have been in some prior State W, from which you made Choice Z. And so on... infinitely.

  **Sam:** So it’s a regress. But why is that *fatal*? Why demand this impossible "self-creation ex nihilo"?

  **Alex:** Because without it, responsibility is always *conditioned*. Your character – the very thing that determines *how* you respond to reasons and make choices – is ultimately a product of luck. Luck in your genetic makeup, your early environment, the causal chain that spat *you* out. You didn’t choose to be the kind of person who resists temptation easily or succumbs to it. **The crucial point is this applies *even if* some choices are undetermined random events!** An uncaused choice popping into existence isn’t *your* choice unless *you* somehow authored the "you" that was there to make it. Randomness doesn’t create *responsibility*; it just adds noise.

  **Sam:** (Leans forward) Okay, I concede that the regress argument highlights a genuine metaphysical puzzle about ultimate origination. We *are* thrown into the world with a nature not of our own making. **That’s a powerful observation, Galen makes it starkly.** But here’s where his father’s move is crucial: our responsibility practices *aren’t built* on solving that puzzle. They don’t require being *causa sui*. They arise from the practical necessity of navigating a social world populated by agents who can *intentionally* harm or benefit us. The reactive attitudes *are* that navigation system.

  **Alex:** But Sam, doesn’t P.F. *himself* give us the key to undermining the practice? He argues we *rightly* suspend reactive attitudes and adopt the objective stance towards people whose actions flow from conditions they didn’t choose and couldn’t control – the compulsive, the severely mentally ill, the brainwashed. We see their actions as caused *through* them, not *by* them as agents. Right?

  **Sam:** Right. Because in those cases, the normal framework of reasons-responsiveness – the capacity to recognize and act for reasons that *is* central to our concept of an agent – is impaired or bypassed.

  **Alex:** Exactly! But if the *only* difference between the compulsive gambler and the ordinary person is the *source* of their character – one had a terrible trauma, the other had a stable upbringing – and neither chose their initial setup or the causal laws governing it... **what principled reason is there *not* to extend the objective attitude to everyone?** Everyone's character, their capacity for reasons-responsiveness itself, is ultimately the product of factors they did not choose. Why is "ordinary upbringing luck" fundamentally different from "trauma luck" in terms of undercutting *ultimate* authorship? If we exempt the unlucky, doesn't consistency demand we exempt the lucky too? The lack of *ultimate* responsibility seems universal.

  **Sam:** (Pauses thoughtfully) That’s the hardest push, Alex. **I concede that Galen’s argument, combined with my father’s own criteria for exemption, creates serious pressure towards that generalization.** But here’s why the practice doesn’t collapse, and why the generalization is a *mis*application of the exemption criteria:
  1.  **The Nature of the Impairment:** We exempt the compulsive *not solely* because their character is unchosen, but because their condition *specifically bypasses or overwhelms their capacity to recognize and act on reasons* in that domain. The ordinary person, even shaped by luck, *possesses and exercises* that capacity. The exemption hinges on a *local* failure of agency *within* the general framework, not on the *ultimate metaphysical source* of the framework itself. We hold people responsible *for* acting from their (unchosen) character *when that character supports functional agency*.
  2.  **Practices vs. Metaphysical Grounding:** P.F.’s point is that asking for a *further* justification beyond the framework of reactive attitudes – like demanding ultimate *causa sui* – is to step outside the practice itself and ask a question it wasn’t designed to answer and doesn’t need to answer to be *internally* coherent and necessary. The "principled reason" is the *practical impossibility and undesirability* of living perpetually in the objective stance. It would dissolve the bonds of community, love, and mutual expectation that constitute a recognizably human life. We *need* the participant stance.
  3.  **"Ultimate" Responsibility vs. "Practice-Relevant" Responsibility:** Galen may be right that we lack *metaphysically ultimate* responsibility. But P.F. shows we possess *practice-relevant* responsibility – the kind that makes sense *within* the only framework that allows relationships and society to function. Demanding ultimate responsibility is like demanding a building’s foundation float in mid-air; it misunderstands what foundations *are for* – they ground the building *in the earth*, not in the void.

  **Alex:** So your defense boils down to: "The practice works, it's necessary for human life, and demanding its impossible metaphysical foundation is a category error. The exemptions only apply when agency is *locally impaired*, not because its ultimate origin is unchosen."

  **Sam:** Essentially, yes. The regress reveals a deep truth about our conditionedness, but it doesn’t invalidate the reality and necessity of the interpersonal distinctions we make *within* that conditioned state. Holding the ordinary person responsible, while exempting the compulsive, isn’t inconsistent *within the logic of the practice itself*, which tracks functional agency and reasons-responsiveness, not cosmic authorship. To abandon the practice because we aren't *causa sui* would be a profound misunderstanding of what moral responsibility *is for us*.

  **Alex:** I still see the specter of luck haunting every judgment... but I grant you this: trying to live perpetually by the objective attitude, seeing everyone as a complex mechanism shaped by luck, *would* be inhuman. P.F. nailed that. The reactive attitudes *are* inescapable features of our psychology. **That’s a powerful concession to your side – the practice is psychologically and socially necessary.** But Galen’s point remains: this necessary practice rests on a fiction. We treat people *as if* they were ultimate authors, knowing metaphysically they cannot be. It’s a noble, necessary lie. The tension is real.

  **Sam:** And I maintain it’s not a *lie*, but a different *kind* of truth – a practical truth embedded in our form of life. The lack of ultimate authorship isn’t a *threat* to this truth; it’s simply irrelevant to it. But yes, the tension persists. Perhaps that’s the human condition: living responsibly within a web of causes we didn’t choose.

  **(They both sip their coffee, the disagreement unresolved but clarified, the weight of both Strawsons' arguments hanging in the air.)**
