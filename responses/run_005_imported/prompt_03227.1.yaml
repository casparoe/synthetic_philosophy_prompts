answer: |-
  To demonstrate the non-commutativity of Jeffrey conditionalization, consider a simple outcome space with three mutually exclusive and exhaustive states: \(\omega_1\), \(\omega_2\), and \(\omega_3\). The prior probability distribution is uniform: \(P(\omega_1) = P(\omega_2) = P(\omega_3) = \frac{1}{3}\).

  ### First Observation
  - **Partition**: \(C_1 = \{S_1, S_2\}\), where \(S_1 = \{\omega_1, \omega_2\}\) and \(S_2 = \{\omega_3\}\).
  - **Redistribution**: After the observation, the probabilities are redistributed such that \(P_{\text{new}}(S_1) = 0.8\) and \(P_{\text{new}}(S_2) = 0.2\).

  Using Jeffrey conditionalization, the updated probabilities are:
  - \(P_{\text{new}}(\omega_1) = P(\omega_1 \mid S_1) \cdot 0.8 + P(\omega_1 \mid S_2) \cdot 0.2 = \left(\frac{1/3}{2/3}\right) \cdot 0.8 + 0 \cdot 0.2 = 0.5 \cdot 0.8 = 0.4\)
  - \(P_{\text{new}}(\omega_2) = P(\omega_2 \mid S_1) \cdot 0.8 + P(\omega_2 \mid S_2) \cdot 0.2 = \left(\frac{1/3}{2/3}\right) \cdot 0.8 + 0 \cdot 0.2 = 0.5 \cdot 0.8 = 0.4\)
  - \(P_{\text{new}}(\omega_3) = P(\omega_3 \mid S_1) \cdot 0.8 + P(\omega_3 \mid S_2) \cdot 0.2 = 0 \cdot 0.8 + 1 \cdot 0.2 = 0.2\)

  Thus, after the first observation: \(P(\omega_1) = 0.4\), \(P(\omega_2) = 0.4\), \(P(\omega_3) = 0.2\).

  ### Second Observation (Applied after First)
  - **Partition**: \(C_2 = \{T_1, T_2\}\), where \(T_1 = \{\omega_1\}\) and \(T_2 = \{\omega_2, \omega_3\}\).
  - **Redistribution**: After this observation, the probabilities are redistributed such that \(P_{\text{newer}}(T_1) = 0.1\) and \(P_{\text{newer}}(T_2) = 0.9\).

  Using Jeffrey conditionalization on the current probabilities:
  - First, compute conditional probabilities under \(P_{\text{new}}\):
    - \(P_{\text{new}}(T_1) = P_{\text{new}}(\omega_1) = 0.4\)
    - \(P_{\text{new}}(T_2) = P_{\text{new}}(\omega_2) + P_{\text{new}}(\omega_3) = 0.4 + 0.2 = 0.6\)
    - \(P_{\text{new}}(\omega_1 \mid T_1) = \frac{P_{\text{new}}(\omega_1 \cap T_1)}{P_{\text{new}}(T_1)} = \frac{0.4}{0.4} = 1\) (since \(T_1 = \{\omega_1\}\))
    - \(P_{\text{new}}(\omega_2 \mid T_1) = 0\) (since \(\omega_2 \notin T_1\))
    - \(P_{\text{new}}(\omega_3 \mid T_1) = 0\) (since \(\omega_3 \notin T_1\))
    - \(P_{\text{new}}(\omega_1 \mid T_2) = 0\) (since \(\omega_1 \notin T_2\))
    - \(P_{\text{new}}(\omega_2 \mid T_2) = \frac{P_{\text{new}}(\omega_2 \cap T_2)}{P_{\text{new}}(T_2)} = \frac{0.4}{0.6} = \frac{2}{3}\)
    - \(P_{\text{new}}(\omega_3 \mid T_2) = \frac{P_{\text{new}}(\omega_3 \cap T_2)}{P_{\text{new}}(T_2)} = \frac{0.2}{0.6} = \frac{1}{3}\)

  - Then, update:
    - \(P_{\text{newer}}(\omega_1) = P_{\text{new}}(\omega_1 \mid T_1) \cdot 0.1 + P_{\text{new}}(\omega_1 \mid T_2) \cdot 0.9 = (1)(0.1) + (0)(0.9) = 0.1\)
    - \(P_{\text{newer}}(\omega_2) = P_{\text{new}}(\omega_2 \mid T_1) \cdot 0.1 + P_{\text{new}}(\omega_2 \mid T_2) \cdot 0.9 = (0)(0.1) + \left(\frac{2}{3}\right)(0.9) = 0.6\)
    - \(P_{\text{newer}}(\omega_3) = P_{\text{new}}(\omega_3 \mid T_1) \cdot 0.1 + P_{\text{new}}(\omega_3 \mid T_2) \cdot 0.9 = (0)(0.1) + \left(\frac{1}{3}\right)(0.9) = 0.3\)

  Thus, updating in the order (first observation then second) yields: \(P(\omega_1) = 0.1\), \(P(\omega_2) = 0.6\), \(P(\omega_3) = 0.3\).

  ### Reverse Order: Second Observation First
  - **Second observation applied to prior**:
    - Partition \(C_2 = \{T_1, T_2\}\) with \(T_1 = \{\omega_1\}\), \(T_2 = \{\omega_2, \omega_3\}\), and \(P_{\text{temp}}(T_1) = 0.1\), \(P_{\text{temp}}(T_2) = 0.9\).
    - Conditional probabilities under prior:
      - \(P(\omega_1 \mid T_1) = \frac{P(\omega_1 \cap T_1)}{P(T_1)} = \frac{1/3}{1/3} = 1\)
      - \(P(\omega_2 \mid T_1) = 0\)
      - \(P(\omega_3 \mid T_1) = 0\)
      - \(P(\omega_1 \mid T_2) = 0\)
      - \(P(\omega_2 \mid T_2) = \frac{P(\omega_2 \cap T_2)}{P(T_2)} = \frac{1/3}{2/3} = \frac{1}{2}\)
      - \(P(\omega_3 \mid T_2) = \frac{P(\omega_3 \cap T_2)}{P(T_2)} = \frac{1/3}{2/3} = \frac{1}{2}\)
    - Update:
      - \(P_{\text{temp}}(\omega_1) = P(\omega_1 \mid T_1) \cdot 0.1 + P(\omega_1 \mid T_2) \cdot 0.9 = (1)(0.1) + (0)(0.9) = 0.1\)
      - \(P_{\text{temp}}(\omega_2) = P(\omega_2 \mid T_1) \cdot 0.1 + P(\omega_2 \mid T_2) \cdot 0.9 = (0)(0.1) + \left(\frac{1}{2}\right)(0.9) = 0.45\)
      - \(P_{\text{temp}}(\omega_3) = P(\omega_3 \mid T_1) \cdot 0.1 + P(\omega_3 \mid T_2) \cdot 0.9 = (0)(0.1) + \left(\frac{1}{2}\right)(0.9) = 0.45\)

  Thus, after second observation: \(P(\omega_1) = 0.1\), \(P(\omega_2) = 0.45\), \(P(\omega_3) = 0.45\).

  - **First observation applied to this**:
    - Partition \(C_1 = \{S_1, S_2\}\) with \(S_1 = \{\omega_1, \omega_2\}\), \(S_2 = \{\omega_3\}\), and \(P_{\text{final}}(S_1) = 0.8\), \(P_{\text{final}}(S_2) = 0.2\).
    - Conditional probabilities under \(P_{\text{temp}}\):
      - \(P_{\text{temp}}(S_1) = P_{\text{temp}}(\omega_1) + P_{\text{temp}}(\omega_2) = 0.1 + 0.45 = 0.55\)
      - \(P_{\text{temp}}(S_2) = P_{\text{temp}}(\omega_3) = 0.45\)
      - \(P_{\text{temp}}(\omega_1 \mid S_1) = \frac{P_{\text{temp}}(\omega_1 \cap S_1)}{P_{\text{temp}}(S_1)} = \frac{0.1}{0.55} = \frac{2}{11}\)
      - \(P_{\text{temp}}(\omega_2 \mid S_1) = \frac{P_{\text{temp}}(\omega_2 \cap S_1)}{P_{\text{temp}}(S_1)} = \frac{0.45}{0.55} = \frac{9}{11}\)
      - \(P_{\text{temp}}(\omega_3 \mid S_1) = 0\)
      - \(P_{\text{temp}}(\omega_1 \mid S_2) = 0\) (since \(\omega_1 \notin S_2\))
      - \(P_{\text{temp}}(\omega_2 \mid S_2) = 0\) (since \(\omega_2 \notin S_2\))
      - \(P_{\text{temp}}(\omega_3 \mid S_2) = \frac{P_{\text{temp}}(\omega_3 \cap S_2)}{P_{\text{temp}}(S_2)} = \frac{0.45}{0.45} = 1\)
    - Update:
      - \(P_{\text{final}}(\omega_1) = P_{\text{temp}}(\omega_1 \mid S_1) \cdot 0.8 + P_{\text{temp}}(\omega_1 \mid S_2) \cdot 0.2 = \left(\frac{2}{11}\right)(0.8) + (0)(0.2) = \frac{2}{11} \cdot \frac{4}{5} = \frac{8}{55} \approx 0.1455\)
      - \(P_{\text{final}}(\omega_2) = P_{\text{temp}}(\omega_2 \mid S_1) \cdot 0.8 + P_{\text{temp}}(\omega_2 \mid S_2) \cdot 0.2 = \left(\frac{9}{11}\right)(0.8) + (0)(0.2) = \frac{9}{11} \cdot \frac{4}{5} = \frac{36}{55} \approx 0.6545\)
      - \(P_{\text{final}}(\omega_3) = P_{\text{temp}}(\omega_3 \mid S_1) \cdot 0.8 + P_{\text{temp}}(\omega_3 \mid S_2) \cdot 0.2 = (0)(0.8) + (1)(0.2) = 0.2 = \frac{11}{55}\)

  Thus, updating in the order (second observation then first) yields: \(P(\omega_1) \approx 0.1455\), \(P(\omega_2) \approx 0.6545\), \(P(\omega_3) = 0.2\).

  ### Comparison
  - **Order: First then second**: \(P(\omega_1) = 0.1\), \(P(\omega_2) = 0.6\), \(P(\omega_3) = 0.3\)
  - **Order: Second then first**: \(P(\omega_1) \approx 0.1455\), \(P(\omega_2) \approx 0.6545\), \(P(\omega_3) = 0.2\)

  The final probabilities differ, demonstrating non-commutativity. For instance, \(P(\omega_1)\) is 0.1 vs. approximately 0.145, and \(P(\omega_3)\) is 0.3 vs. 0.2.

  ### When Order Does Not Matter
  For the order of Jeffrey updates to commute, the two partitions must be such that the conditional probabilities within each cell of one partition are invariant under the redistribution of the other partition. Specifically:
  - **Commutativity condition**: Jeffrey conditionalization commutes if the two partitions are compatible, meaning one partition is a coarsening of the other (i.e., every cell of one partition is a subset of a cell in the other partition). In this case, updating on the coarser partition first or the finer partition first yields the same posterior, provided the redistributions are consistent with the common refinement.

  In the example, the partitions \(C_1 = \{\{\omega_1, \omega_2\}, \{\omega_3\}\}\) and \(C_2 = \{\{\omega_1\}, \{\omega_2, \omega_3\}\}\) are incompatible because:
  - \(S_1 = \{\omega_1, \omega_2\}\) overlaps with both \(T_1\) and \(T_2\) without being contained in either.
  - The conditional probabilities (e.g., \(P(\omega_2 \mid T_2)\)) change after the first update, leading to order dependence.

  If, for instance, both observations used the same partition or one partition was a refinement of the other (e.g., \(C_1\) as above and \(C_2\) as \(\{\{\omega_1\}, \{\omega_2\}, \{\omega_3\}\}\)), then the order would not matter for the final posterior over the atoms, though the redistributions must be applied in a way that respects the hierarchy.

