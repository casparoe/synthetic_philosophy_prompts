  **Justifications:**  
  1. **Priya (+1):** Correctly identifies that functional design patterns aren't ownable like physical property ("non-rivalrous" knowledge), and her candle analogy holds for pure ideas. However, she understates the competitive harm in *rapid, exact replication* of a novel workflow.  
  2. **Marcus (+2):** Precisely identifies the core harm – the destruction of *competitive scarcity*. His "loss isn't less real just because nothing was used up" rebuts Priya's framing effectively.  
  3. **Priya (-1):** Overextends her argument. Equating studying *generic* industry practices (pricing pages, UX conventions) with cloning a *distinctive, complex* workflow conflates background knowledge with unique competitive differentiation, weakening her position.  
  4. **Marcus (+1):** Correctly defends the existence of a spectrum between generic conventions and proprietary innovations, acknowledging the boundary is fuzzy but real. This refutes Priya's "slippery slope" objection without denying nuance.  

  **What Both Are Missing:**  
  Priya underestimates how novel *combinations* of functional elements create temporary but valuable market advantages worthy of protection through norms (if not law). Marcus overlooks that such advantages are inherently fragile in software; true ownership stems from continuous innovation, brand trust, or patents/trade secrets – not merely being first with an observable interface. Both miss that ethical boundaries depend on *how* the replication occurs (clean-room reverse-engineering vs. theft) and the *novelty/originality* of the copied elements. Ideas themselves can't be "owned," but their *specific expression and timing* create competitive value that merits ethical consideration beyond pure legality. Sustainable innovation requires balancing sharing with respecting the effort behind *distinctive* executions – a line defined by convention, not inherent property rights.
