  First, the payoff matrix is straightforward. Player 1 has strategies T, M, B, and Player 2 has L and R. Player 1's payoffs are:
  - T: 3 (L), 0 (R)
  - M: 0 (L), 3 (R)
  - B: 1 (L), 1 (R)

  Marcus argues that B is strictly dominated by a 50/50 mix of T and M. Calculating that mixed strategy: against L, it's (0.5*3 + 0.5*0) = 1.5; against R, (0.5*0 + 0.5*3) = 1.5. Both exceed B's payoff of 1. So mathematically, the mixed strategy dominates B. 

  Yuki objects that since Player 1 isn't actually randomizing, it feels like a trick. But in game theory, rational players consider all possible strategies, including mixed ones. The definition of strict dominance includes being beaten by another strategy (pure or mixed) in all scenarios. So Marcus is correct here—B should be eliminated first.

  Next, Yuki worries about order dependence if mixed strategies can dominate. They mention a scenario where eliminating B first might affect other strategies differently than if another strategy were eliminated first. However, iterated strict dominance is order-independent when only strict dominance is involved. The key is strict inequalities—no ties. If two strategies are equally good, order might matter, but here all comparisons are strict. So Marcus is right about order independence in this case.

  Regarding the TA docking points for "wrong order," Marcus speculates it involved weak dominance (ties) rather than strict. That makes sense. If a problem has weakly dominated strategies, elimination order can affect the outcome. But in this matrix, all dominations are strict, so order shouldn't matter. The TA likely deducted points in a different context with weak dominance, which is a valid exception.

  Summarizing the scores:
