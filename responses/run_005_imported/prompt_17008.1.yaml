answer: |-
  ## Dialogue: Standing Grounds

  **Setting:** A quiet corner of the university library cafe, late afternoon. Empty coffee cups sit between **Dr. Aris Thorne** (defending the importance of standing) and **Dr. Lena Voss** (defending the independence of truth). The murmur of students fades into the background.

  **Aris Thorne:** Lena, I still think our group dismissed the standing argument too casually earlier. Yes, the *truth* of the climate scientist's warnings is independent of his flights. But *blame* isn't just about truth. It's a performative act, a demand for accountability. When the blamer is *actively* doing the very thing they condemn, they forfeit the moral authority to make that demand. It’s like trying to arrest someone while committing the same crime yourself.

  **Lena Voss:** Aris, that analogy smuggles in the *legal* authority of the state. Moral blame isn’t an arrest. Truth *is* sovereign here. If his claim – "your emissions are causing harm and must stop" – is factually correct and morally urgent, then pointing out *his* emissions, however hypocritical, doesn’t touch the *substance* of the accusation against *me*. It’s pure *tu quoque*: distracting, perhaps rude, but irrelevant to whether *I* need to change.

  **Aris:** But it *is* relevant to whether *he* is the one entitled to *deliver* that message *as blame*. Imagine a judge sentencing a thief while openly pocketing court funds. The thief *is* guilty, but the judge has lost the standing to pronounce that sentence credibly. The pronouncement itself becomes suspect, even if the underlying law is valid. The hypocritical blamer poisons the well of the moral appeal. The target *can* rightly say, "You have no right to *demand* this of me while you flout it yourself," without denying the underlying norm.

  **Lena:** "Poisoning the well" implies weakening the *credibility* of the speaker, which might make the *listener* less receptive. I’ll grant you that. Hypocrisy can be a devastating *rhetorical* weakness. But does it actually *silence* the moral claim? Does it mean the target *owes no answer* to the accusation itself? I say no. The truth of the accusation – "Your actions cause harm" – still stands, demanding a response based on its *own* merits, regardless of the speaker's flaws. Ignoring it because of the speaker’s hypocrisy is an *ad hominem* evasion.

  **Aris:** Okay, let’s get precise about what "losing standing" means. I’m *not* saying it renders the accusation *false*. Nor am I saying it completely destroys all *rhetorical* force – though it often does. I’m saying it undermines the blamer’s *specific entitlement to hold *this person* accountable *in this way*.* The target *is* entitled to dismiss the *demand for accountability coming from this particular source*, precisely because of the source’s inconsistency. They don't owe *this hypocrite* an account. The underlying moral truth might still bind them, and they might owe an account to *others*, or to their own conscience. But *this* act of blaming, from *this* person, loses its normative force.

  **Lena:** Hmm. So, it's not that the accusation vanishes, but that the *interpersonal transaction* of blame is corrupted? The hypocrite can't effectively *call you to account*? I can see that distinction. It moves away from the truth of the claim and towards the *relationship* inherent in blaming.

  **Aris:** Exactly! Blaming isn't just stating a fact; it's invoking a shared norm and demanding alignment. The hypocrite undermines the shared commitment to that norm *in practice*, making their invocation hollow.

  **Lena:** Let’s test that. Hard Case One: The Reformed Tax Cheat. Someone who cheated on taxes for years, got caught, paid back everything with penalties, and now genuinely campaigns against tax fraud. Do they have standing to blame current cheats?

  **Aris:** Yes, I think they *can* regain standing. Repentance, restitution, and a demonstrable change *restore* their moral position relative to *that specific norm*. They’ve acknowledged the wrong, aligned their actions, and now speak from a place of consistency. Their past hypocrisy is relevant context, but it doesn't necessarily *void* their current standing to condemn the *ongoing* wrong they've renounced. It might even give them *more* credibility – they know the temptation and rejected it.

  **Lena:** Interesting. So standing isn't necessarily permanently lost? It hinges on *current* alignment? What if they still cheat in some *other* area of life? Does that undermine their standing on taxes?

  **Aris:** *(Stirs cold coffee, thinking)* Tricky. If the *other* cheating reveals a *fundamental* disregard for norms or honesty, it might bleed over and taint their standing generally. But if it's unrelated – say, they cheat at golf while being scrupulous on taxes – it probably doesn't directly void their standing *on tax honesty*. The connection to the specific norm matters. Standing isn't monolithic; it can be norm-specific.

  **Lena:** Alright, concession noted. Now, Hard Case Two: G.A. Cohen’s terrorism puzzle. Imagine a peaceful suburbanite who has never faced oppression, never been tempted to commit violence for a cause. They condemn terrorism unequivocally. Cohen asked: does their very "purity," born of never being *tested*, actually give them *less* standing to condemn than, say, a former terrorist who renounced violence? Or even less than the hypocrite who condemns it while secretly funding it?

  **Aris:** *(Leans forward)* Ah, Cohen! That’s a deep cut. The suburbanite... their purity is untested, passive. They haven't *chosen* virtue in the face of strong temptation or perceived injustice. Does this make their condemnation less weighty? Less *authoritative*? I think Cohen might say yes, in a way. Their condemnation might sound facile, naive. They don't understand the pull of the cause, the desperation. It doesn’t mean terrorism is *justified*, but their *standing* to condemn *might* be weaker precisely because they lack the lived experience that would give their rejection of violence its full moral force. They haven't *earned* the right to that particular condemnation in the same way the repentant terrorist has.

  **Lena:** But Aris, that seems perverse! The suburbanite *is* consistent! They live peacefully and condemn violence. By your earlier logic about consistency granting standing, shouldn’t they have *more* standing than the hypocrite? Yet you’re suggesting their *lack of temptation* might *diminish* it? That feels counterintuitive.

  **Aris:** It *is* counterintuitive, and I’m not fully comfortable with it. But consider: the repentant terrorist speaks from *within* the moral struggle. They understand the reasons *for* violence, found them ultimately wanting, and chose peace. Their condemnation carries the weight of that hard-won understanding. The suburbanite's condemnation, while true and consistent, might lack that depth of earned conviction. It’s abstract. Their standing isn't *forfeited* like the hypocrite's; it’s perhaps *undeveloped* or lacks a certain *moral gravity* for *this specific wrong*. They certainly have *more* standing than the hypocrite! But perhaps less profound standing than the repentant actor.

  **Lena:** So, standing isn't just binary (have it/don't have it) or even just about current consistency? It's also about... *provenance*? The *source* of the consistency? Whether it was *tested*?

  **Aris:** Perhaps. Maybe it's about the *relationship to the specific challenge posed by the wrong*. The hypocrite is actively *succumbing* to the challenge while blaming others. The suburbanite has never *faced* the challenge. The repentant one has *faced and overcome* it. That overcoming *grants* a unique authority. The suburbanite's standing is valid but potentially thin; the hypocrite's is corrupted; the repentant one's is earned and robust.

  **Lena:** I see the nuance you're driving at. But I still hold that the *core* moral truth – "Terrorism is wrong" – retains its force regardless of who states it, even if the *effectiveness* or *perceived weight* of the condemnation varies wildly. The suburbanite's statement is *true*, and that truth imposes a reason for action on the terrorist, even if the terrorist dismisses the *speaker* as naive. The *wrongness* persists.

  **Aris:** And I agree the *wrongness* persists! But the *act of blaming* – the direct, personal "You are culpable for this wrong, and I call you to account" – that act *from the suburbanite* might not land with the same normative claim *on the terrorist* as it would coming from the repentant comrade. The terrorist might owe an answer to the *wrong*, but not necessarily to *that particular blamer*. The interpersonal claim falters. The hypocrite forfeits standing entirely; the untested blamer might have incomplete standing; the consistent and repentant blamer has full standing. But the underlying truth? Unassailable. Always.

  **Lena:** *(Smiles slightly)* So, we end closer than we started? Truth is inviolable, but the *authority to personally hold another accountable* is fragile, context-dependent, and can be lost, undeveloped, or earned through struggle and consistency. The climate scientist's warnings are true, urgent, and demand a response. But his personal authority to *blame others* while flying so much *is* deeply compromised, weakening his specific demands and entitling others to question his *role* as a blamer, if not the facts he presents.

  **Aris:** *(Nods)* That feels like progress. The charge of hypocrisy isn't *beside the point* if we care about effective moral dialogue and holding power accountable. It directly attacks the blamer's *license* to operate in that space. But it doesn't magically erase the truth they speak, however inconvenient that truth may be.

  **Lena:** Agreed. Now, about that second coffee... my treat. This standing business is thirsty work. And I promise not to blame you if you take the last biscuit.

  **Aris:** *(Chuckles)* Only if you promise not to take it yourself while condemning me. Some norms *must* be upheld, Lena. Some norms must be upheld.
