prompt: |-
  So this happened at a meetup a few weeks back and I still haven't been able to let it go. After the discussion group broke up, a few of us stuck around for poker, and during a break one guy (I'll call him Dave, normally a pretty careful thinker) proposed a side game: he'd flip a fair coin repeatedly until it landed heads, and pay $2 if that happened on flip 1, $4 on flip 2, $8 on flip 3, doubling every time, and he wanted to know what people would pay upfront for one go at it. Most of us said somewhere around $10-20, one guy said $6, and Dave got this look and said the "true" price is actually infinite and we were all just being irrational about it, then pulled out his phone to show the calculation, which as far as I can tell is correct (every single term in the sum works out to exactly $1, and there's infinitely many terms).

  I said the fix I vaguely remembered from years of lurking on LW is that money isn't the same as utility — your two-billionth dollar doesn't do as much for you as your first — and once you swap in a reasonably concave utility function for the raw dollar payouts, the expected utility comes out finite and small, matching what everyone actually offered to pay. Dave granted that for about five minutes and then came back with something that genuinely stumped me: he said you can always build a new version of the same game where, instead of paying out 2^n dollars at stage n, you pay out whatever dollar amount happens to be worth exactly 2^n worth of utility under your particular curve — and once you plug that schedule back in, you're staring at an infinite expected utility gamble again, no matter how sharply the curve bends, as long as the curve is unbounded. According to Dave the only actual fix is biting the bullet that utility itself has to be capped at some finite value no matter how much money or good outcome gets thrown at a person, which felt like a way weirder thing to accept than "diminishing returns" ever did. Somebody else at the table said this whole mess is basically just Pascal's Mugging with extra steps, and that Yudkowsky's leverage-penalty stuff was supposed to get you out of needing the cap, but nobody could actually reconstruct how that's supposed to work, myself included.

  I've spent enough years reading LW and ACX that I've apparently absorbed all the vocabulary and none of the actual understanding, and I'd like to sort out who was right at that table. Is Daves "rebuild it in utility units" move actually a legitimate construction, or is there a hidden flaw that gets it wrong somewhere? If capping utility really is the only clean fix, what does biting that bullet commit you to elsewhere — does it quietly break other stuff we want out of a decision theory? And is the Pascal's Mugging comparison actually apt, or were we conflating two things that just superficially rhyme with each other? A real walkthrough would be great, since "diminishing marginal utility solves it" is the part we'd already gotten to before things went sideways.
reasoning: |-
  We are discussing the St. Petersburg paradox. The original game pays $2^n if the first heads is on the nth flip. The expected value is:

  E = (1/2)*2 + (1/4)*4 + (1/8)*8 + ... = 1 + 1 + 1 + ... = ∞

  But people are only willing to pay a small amount to play. The standard explanation is diminishing marginal utility of money: each additional dollar is worth less. So we use a utility function, like the logarithm of wealth, to compute expected utility.

  Suppose we have initial wealth W and a utility function U. The expected utility of the game is:

  E[U] = Σ_{n=1}^∞ (1/2^n) * U(W + 2^n)

  With a concave utility function (like log), this sum converges. For example, with U(x)=log(x), we have:

  E[U] = Σ_{n=1}^∞ (1/2^n) * log(W + 2^n)

  This sum is finite because log(W+2^n) grows slowly (logarithmically) while the probabilities decay exponentially.

  But Dave's point is: we can define a new game that pays in utility units. Specifically, instead of paying $2^n, we pay an amount of money that gives exactly 2^n utility. That is, we set the payoff for the nth outcome to be an amount X_n such that:

  U(W + X_n) - U(W) = 2^n

  Note: We are adding utility. But we can also think in terms of absolute utility. Since utility is unique up to affine transformations, we can assume without loss of generality that U(W)=0 and U is increasing. Then we want:

  U(W + X_n) = 2^n

  Then the expected utility of the new game is:

  E[U] = Σ_{n=1}^∞ (1/2^n) * U(W + X_n) = Σ_{n=1}^∞ (1/2^n) * 2^n = Σ_{n=1}^∞ 1 = ∞

  So the expected utility is infinite again.

  This seems to show that if the utility function is unbounded, we can always construct such a game that gives infinite expected utility. Therefore, to avoid this, we must bound utility.

  But what does that mean? It means that there is some maximum level of utility that a person can achieve, no matter how much money they have. For example, U(x) might approach a constant as x goes to infinity.

  Now, the question is: is this acceptable? And what are the implications?

  Also, the Pascal's Mugging comparison: Pascal's Mugging is a situation where an extremely low probability event with an extremely high payoff dominates the expected utility calculation. The standard St. Petersburg already has an infinite expected utility in the original (if we don't use utility) or in the modified version (if utility is unbounded). So they are similar in that they both involve infinite expected utility from a sequence of events.

  However, in Pascal's Mugging, the probability is arbitrarily low (like 1/10^100) and the payoff is arbitrarily high (like 10^100 utils). In the St. Petersburg, the probabilities are fixed (1/2^n) and the payoffs grow exponentially.

  Yudkowsky's leverage penalty is one proposed solution to Pascal's Mugging. The idea is to penalize the probability of hypotheses that are "ad hoc" and specifically tailored to extract high utility. But in the St. Petersburg, the setup is not ad hoc; it's a well-defined game.

  Now, let's address the issues:

  1. **Is Dave's construction legitimate?** Yes, it seems so. If utility is unbounded, then for any n, we can find X_n such that U(W+X_n) = 2^n. Then the expected utility of the game is the sum of an infinite series of 1's, which diverges.

  2. **Does this force us to cap utility?** Not necessarily. There are other ways out.

     - **Bounded utility**: This is one solution. It means that utility has an upper bound. For example, U(x) = a - b/x (as x→∞, U→a) or U(x) = arctan(x) (bounded between -π/2 and π/2). Then even if we set U(W+X_n)=2^n, we cannot because 2^n would eventually exceed the bound. So the construction fails.

     - **Rejecting the game as unrealistic**: The payouts in the new game become astronomical very quickly. For example, if U(x)=log(x) (unbounded), then to get U(W+X_n)=2^n, we have:

          log(W+X_n) = 2^n   =>   W+X_n = exp(2^n)   =>   X_n = exp(2^n) - W

       The payout for n=10 would be exp(2^10) = exp(1024) which is an enormous number. The probability of n=10 is 1/1024, but the payout is so huge that it dominates. But in practice, no one can pay that amount. So we might say that the game is not feasible because the payouts are impossible to deliver.

       This is a practical objection. In reality, there is a maximum amount of money that can be paid. So we can cap the payout at the total wealth in the world, say M. Then the expected utility becomes finite.

     - **Using a leverage penalty or other decision theory fixes**: For Pascal's Mugging, Yudkowsky proposed a leverage penalty: discounting the probability of a hypothesis by how much it is leveraged to extract a large commitment of resources. But in the St. Petersburg, the game is not a hypothesis about the world; it's a well-defined game. So it's unclear how to apply that here.

  3. **What does capping utility imply?** If we cap utility, then we are saying that beyond a certain point, more money (or more good things) doesn't add any utility. This might be psychologically realistic: there is a limit to how happy a person can be. But it also might lead to counterintuitive results. For example, if utility is capped, then a person would not care about improving their situation beyond a certain point. However, note that the cap is typically approached asymptotically, so there is always some improvement, but it becomes negligible.

  4. **Is the Pascal's Mugging comparison apt?** Both involve infinite expected utility in theory. But the St. Petersburg is a well-defined mathematical game, while Pascal's Mugging is usually about an agent (like a mugger) making an incredible threat or promise. The St. Petersburg doesn't rely on an agent who might be lying. So they are similar in the mathematical structure of the expected utility calculation, but the context is different.

  5. **Other solutions?** 

     - **Probability discounting**: Some argue that for very large n, the probability 1/2^n is so small that it is effectively zero. But in the infinite sum, it adds up. 

     - **Finitism**: Reject the possibility of infinite payouts or infinitely many outcomes. In practice, the game must stop at some point because the universe is finite.

     - **Risk aversion**: Beyond diminishing marginal utility, people are risk-averse. But that is already captured by concave utility.

  6. **What about the leverage penalty?** Yudkowsky's leverage penalty for Pascal's Mugging is to adjust the probability based on the "leveraging" of the hypothesis. Specifically, if a hypothesis is adjusted to have a very high utility, we penalize its prior probability. In the St. Petersburg, the outcomes are not hypotheses; they are part of a fixed game. So we cannot apply the same penalty. Moreover, the probabilities are fixed.

     However, note that in the modified St. Petersburg with utility payouts, the payouts are growing double-exponentially (if U is log, then X_n = exp(2^n)). The probability of each outcome is 1/2^n. We might argue that such a game is not feasible because no one can guarantee such payouts. Therefore, we can ignore outcomes beyond a certain n.

  Conclusion:

  Dave's construction is valid and shows that if utility is unbounded, we can construct a St. Petersburg-like game that has infinite expected utility. To avoid this, we can either:

     a) Bound utility (so there is a maximum utility level).
     b) Recognize that in practice, the payouts required for high n are infeasible (so we cap n at a feasible point).

  Bounded utility is a clean theoretical fix. It does not break decision theory; in fact, it is a common assumption in economics for exactly these kinds of reasons.

  The Pascal's Mugging comparison is somewhat apt because both involve small probabilities and huge payouts leading to infinite expected utility. However, the solutions may differ because the contexts are different.

  In the original discussion, the group was right to offer only a small amount for the original game because of diminishing marginal utility. But Dave's modified game shows that if we take utility as unbounded, we can create a new paradox. Therefore, the only way to avoid the paradox entirely is to bound utility.

  As for the weirdness of capping utility: it is not that weird. Many utility functions in economics are bounded. For example, the utility of income is often modeled as bounded (like the log function for moderate ranges, but in theory log is unbounded, so we might use a bounded function for the entire range). Moreover, in a finite world, there is a maximum amount of resources, so utility is effectively bounded.

  So, Dave was correct that the only clean fix is to cap utility, but that doesn't mean we have to abandon diminishing returns. We can have both: diminishing returns (concave utility) and boundedness. For example, U(x) = x/(x+1) is bounded between 0 and 1 and concave for x>0.

  Thus, in the initial game, diminishing returns (without necessarily being bounded) explains the low willingness to pay. But to avoid the modified game, we need boundedness.

  In practice, because the world is finite, we don't face the modified game. But in theory, if we want a consistent decision theory for all possible gambles (even those with arbitrarily large payouts), then we must bound utility.
answer: |-
  The situation you described is a classic encounter with the St. Petersburg paradox, and Dave's "rebuild in utility units" move is a legitimate construction that exposes a deeper issue in decision theory. Let's break this down step by step, addressing the key questions and clarifying who was right.

  ### 1. **The Original Paradox and the "Diminishing Returns" Fix**
     - **The problem**: In the original game, Dave pays $2 for heads on flip 1, $4 on flip 2, $8 on flip 3, etc. The expected *monetary* value is infinite because:
       \[
       \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty.
       \]
       Yet, as your group demonstrated, no rational person pays more than $10–$20 for this gamble. This is the St. Petersburg paradox.
     - **The standard fix (diminishing marginal utility)**: Money does not scale linearly with utility. If we model utility with a concave function like \(U(\text{wealth}) = \log(\text{wealth})\), the expected *utility* becomes finite. For initial wealth \(W\):
       \[
       \mathbb{E}[U] = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \log(W + 2^n).
       \]
       This converges because \(\log(W + 2^n)\) grows much slower than \(2^n\) shrinks. For reasonable \(W\) (e.g., $1000), \(\mathbb{E}[U]\) is small, justifying a low entry fee (e.g., $10–$20). **This is correct and explains your group's intuition.**

  ### 2. **Dave's "Rebuild in Utility Units" Move**
     - **The construction**: Dave proposed defining a new game where the payout for outcome \(n\) is an amount \(X_n\) such that the *utility gain* equals \(2^n\). Formally:
       \[
       U(W + X_n) - U(W) = 2^n.
       \]
       If utility is unbounded (i.e., \(U\) can grow infinitely large as wealth increases), we can always solve for \(X_n\). For example:
       - If \(U(x) = \log(x)\), then \(X_n = e^{2^n + \log(W)} - W = W(e^{2^n} - 1)\).
       - The expected utility of this new game is:
         \[
         \mathbb{E}[U] = \sum_{n=1}^{\infty} \left(\frac{1}{2}\right)^n \cdot 2^n = \sum_{n=1}^{\infty} 1 = \infty.
         \]
     - **Why this works**: If utility is unbounded, \(X_n\) grows outrageously fast (e.g., for \(n=5\), \(X_5\) exceeds the world's GDP), but mathematically, the series diverges. **Dave is right: this construction is valid and leads to infinite expected utility, even after accounting for diminishing returns.**

  ### 3. **The Implications: Capping Utility is the Only Clean Fix**
     - **The core issue**: Dave's move shows that diminishing marginal utility alone isn't enough. If utility is unbounded, we can always design a St. Petersburg-like gamble with infinite expected utility by "scaling up" payouts to offset the concavity of \(U\).
     - **The solution**: To avoid this, utility must be **bounded above**. This means there exists some finite \(U_{\text{max}}\) such that:
       \[
       \lim_{\text{wealth} \to \infty} U(\text{wealth}) = U_{\text{max}} < \infty.
       \]
       Examples: \(U(x) = 1 - e^{-x}\) (bounded by 1) or \(U(x) = \arctan(x)\) (bounded by \(\pi/2\)).
     - **Why capping utility isn't "weird"**:
       - **Psychological realism**: Humans have satiation points. Beyond a certain wealth, additional money provides negligible gains in well-being (e.g., your first $1M vs. your $100th $1M).
       - **Theoretical necessity**: Bounded utility is a standard assumption in decision theory to resolve infinite expectations. It doesn't "break" anything; instead, it ensures consistency. For instance:
         - Expected utility maximization still works.
         - Risk aversion (concavity) and boundedness can coexist (e.g., \(U(x) = x/(x + 1)\) is both concave and bounded).
       - **Pascal's Mugging**: This is analogous. An agent threatens to inflict massive disutility unless you pay a small fee, claiming a tiny probability of being able to do so. With unbounded utility, you should comply no matter how small the probability—but bounded utility caps the expected loss, allowing you to ignore the threat. **The comparison is apt: both paradoxes exploit unbounded utility to create infinite expectations.**

  ### 4. **Objections and Workarounds (Why They Fail)**
     - **"Feasibility"**: One might argue that Dave's game is unrealistic because \(X_n\) grows too fast to be implementable (e.g., \(X_{10}\) exceeds all resources on Earth). But this is a practical hack, not a theoretical fix. Decision theory should handle idealized scenarios.
     - **Leverage penalties (Yudkowsky's fix)**: This penalizes hypotheses tailored to extract large utilities (e.g., a mugger claiming cosmic powers). However, Dave's game isn't a "hypothesis"—it's a well-defined gamble with explicit probabilities. Leverage penalties don't apply cleanly here.
     - **Finitism**: Rejecting infinite series or capping flips at some large \(N\) resolves the paradox in practice, but again, it dodges the mathematical issue.

  ### 5. **Who Was Right?**
     - **Your group**: Correct that diminishing utility explains low bids for the **original** game (with fixed dollar payouts).
     - **Dave**: Correct that diminishing utility alone fails for the **generalized** game (where payouts are defined in utility units). **He was also right that bounded utility is the only consistent fix.**
     - **The Pascal's Mugging comment**: Spot-on. Both paradoxes stem from the same root: unbounded utility allows infinite expectations to dominate decision-making.

  ### Conclusion
  Bounded utility is the essential fix. It doesn't require abandoning diminishing returns—it complements it. A concave, bounded utility function (e.g., \(U(x) = 1 - e^{-kx}\)) preserves all the intuitive features of risk aversion while avoiding infinities. Psychologically, it reflects real human preferences; theoretically, it keeps decision theory coherent. Dave won the argument, but the solution isn't as alien as it seemed—it's a natural extension of "diminishing returns" in a world where humans (and resources) are finite.

  **Practical takeaway**: For any real-world gamble, diminishing utility suffices (use \(U = \log\) or similar). But for decision theory to be robust against all possible gambles—including idealized, adversarial ones—utility must be bounded.
