prompt: |-
  Okay, this is going to sound like a weird jump but stick with me. A few months back I fell down a youtube hole about the Nuremberg trials and the German courts right after WW2, and there's this one argument from it that's been rattling around in my head ever since. Basically, some courts had to figure out what to do with a woman who'd reported her own husband to the Nazis for something he said, which WAS technically a crime under the law at the time. And the big debate was whether a law that's evil enough just stops being a "real" law at all, so a court is free to ignore it, versus a law counting as a law as long as it got passed the right way when it was passed, full stop, and how evil it was is a totally seperate question you deal with some other way. I looked it up after and apparently there's a whole famous back-and-forth between two law professors about exactly this (Hart was one, I think?) but I've never studied law or philosophy in my life, I just can't stop chewing on it.

  Reason I'm bringing this up is that I'm on the rules and bylaws committee for my condo association and we've basically landed in a mini real-life version of it. Buried in our bylaws, adopted back in 2009, is a clause banning any "commercial enterprise" run out of a unit. Nobody currently on the board even knew this clause existed until last week, it's never once been mentioned in a newsletter or a move-in packet, and it has never been enforced, even though one owner has openly run a small furniture-refinishing business out of his unit for a couple of years and another has been teaching paid yoga classes out of hers just as openly. Now our board president, who happens to be in the middle of a nasty unrelated parking-spot feud with a third owner, dug this clause up specifically to go after her over the online shop she runs out of her unit, and he wants the committee to vote Thursday on fining her and starting the process to force her out. When I pushed back he said, more or less, "a rule is a rule, we don't get to just pick which parts of our own bylaws count."

  I have to send the committee a real memo before that Thursday meeting, and it can't be a wishy-washy "here are both sides" thing, it needs to land on an actual recommendation for what we should do about the complaint against her. But it also has to seriously deal with the president's "a rule is a rule" point instead of just brushing it off, because honestly, its not a crazy thing for him to say. Can you write that memo for me?
