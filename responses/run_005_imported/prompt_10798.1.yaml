  First, the core need: They want intellectually rigorous questions targeting three specific sore spots in the Knobe effect debate. The user clearly knows the literature well—they mention rival explanations like norm-violation generality, pragmatic blame-language objections, and legal implications. This suggests they're aiming for a high-level discussion that advances the discourse, not just recapping basics.

  Hmm, the user's phrasing ("morally contaminated folk concept") reveals sympathy for skeptical views. They probably want to push the guest to defend her position under fire while keeping it engaging for listeners. The follow-up requests indicate they value dynamic debate over static Q&A.

  Breaking down the three required angles:
  1. Norm-violation vs moral specificity: Need to pressure whether moral badness is truly special or just a subset of norm-breaking. Must anticipate her likely "norm cluster" defense and counter with empirical counter-evidence like Beebe's goofy rule studies.
  2. Pragmatic objection: Must challenge whether "intentionally" reflects psychological reality or just blame rhetoric. Should be ready to dissect her "conceptual competence" argument with pragmatic intrusion data.
  3. Legal implications: This is the practical stake—if folk intent is morally loaded, does that undermine legal intent? Her probable "lay/legal distinction" reply needs confronting with jury decision-making realities.

  For structure, each question needs a sharp primary prompt + adaptive follow-up. The follow-ups should target predictable dodges: e.g., when she distinguishes moral from non-moral norms, immediately cite studies showing non-moral norm-violations fail to trigger the effect. Crucially, questions must force her to engage critics on their terms, not retreat to rehearsed positions.

  Also noting the user's meta-concern: avoiding stale content. Even challenging questions could feel repetitive if framed traditionally. Solution: anchor questions in fresh hypotheticals (e.g., "silly office rule" scenario) and contemporary debates like AI intentionality. The legal angle especially bridges theory with real-world consequences.

  Potential pitfalls to avoid: Questions becoming too technical for podcast format. Need crisp phrasing without sacrificing depth. And must balance rigor with conversational flow—follow-ups should feel like natural probes, not cross-examinations.

  Final thought: The user would appreciate questions exposing tensions in her view. Example: If she concedes pragmatic influences in law while insisting on conceptual purity in psychology, highlight that contradiction. That's where real insight sparks.
answer: |-
  Here are 10 interview questions (+ embedded follow-ups) designed to press the key pressure points in the Knobe Effect debate, moving beyond the standard chairman vignette and targeting the core philosophical and empirical controversies:

  1.  **The Norm-Violation Challenge (Beebe & Buckwalter, Knobe):** "Professor, critics like Josh Knobe himself now argue that the 'side-effect effect' might be driven by the perception of *norm-violation in general*, not specifically *moral* badness. Studies show effects with non-moral norms like violating silly office rules or aesthetic standards. Doesn't this suggest the asymmetry isn't fundamentally about *moral* judgment leaking into the concept of intentional action, but about *any* salient norm violation?"
      *   *Likely Response/Follow-Up:* (If she argues moral norms are special/primary): "But in those non-moral cases, the effect often seems weaker or less consistent. Doesn't that suggest moral badness *is* playing a unique, amplifying role? How do you explain the *robustness* of the moral case compared to, say, violating a rule about using blue pens?" (If she dismisses non-moral cases as irrelevant): "But if the *structure* of the asymmetry is identical – attributing intentionality more readily to bringing about a *foreseen* negative outcome when it violates *any* norm – doesn't that fundamentally challenge the claim that *moral* judgment is the unique contaminant of the core *concept*?"

  2.  **The Pragmatic/Linguistic Challenge (Adams, Steadman):** "A persistent objection is that when people say the chairman 'intentionally' harmed the environment, they aren't making a literal claim about his mental state or the structure of action, but engaging in a pragmatic, blame-laden *rhetoric*. It's a way of *holding him responsible*, not describing his psychology accurately. How do you rule out that this pragmatic use of language, rather than a corrupted *concept*, explains the asymmetry?"
      *   *Likely Response/Follow-Up:* (If she cites competence/performance or conceptual structure): "But studies show factors like *directness* of the outcome or *closeness* of alternatives significantly modulate intentionality attributions in these cases – factors deeply tied to pragmatic concerns about blameworthiness and control. Doesn't this variability look more like the flexible application of pragmatic norms than the rigid application of a morally-contaminated *concept*?" (If she cites robustness across contexts): "Even if robust, could this robustness reflect a deeply ingrained *pragmatic heuristic* for assigning blame, rather than a constitutive feature of the concept itself? How do you experimentally disentangle the two?"

  3.  **The Conceptual Competence Challenge (Machery, Cushman):** "Some argue the Knobe Effect reveals a performance error or a pragmatic intrusion, not the structure of our core competence with 'intentional action'. When people have time to reflect or are primed with neutral cases, the moral influence seems to weaken. Doesn't this suggest the moral 'leak' is a fast-and-frugal heuristic operating *on* the concept, not a feature *of* the concept itself?"
      *   *Likely Response/Follow-Up:* (If she argues reflection reveals the *true* concept or that the effect persists): "But if the 'reflective' judgment is the competence judgment, and the Knobe Effect diminishes under reflection, doesn't that *support* the performance error view? And for persistence: When studies *do* show persistence under reflection, couldn't that persistence reflect the entrenchment of the *pragmatic* blame heuristic, not the conceptual structure?" (If she questions the competence/performance distinction here): "If we can't reliably access a 'pure' competence judgment about intentionality independent of moral/pragmatic factors, doesn't that undermine the claim that we're seeing a *conceptual* truth rather than a pervasive *bias*?"

  4.  **The "Intentional" as Essentially Evaluative:** "Could your position be strengthened by arguing that 'intentional' *just is* an inherently evaluative concept? That separating a 'pure' descriptive core from moral/pragmatic elements is a philosopher's fiction, and the Knobe Effect simply reveals how the concept *actually functions* in our practices of explanation and blame?"
      *   *Likely Response/Follow-Up:* (If she agrees/leans this way): "But doesn't this create significant problems? If 'intentional' is inherently morally-laden, how do we make sense of *neutral* or even *praiseworthy* intentional actions ('She intentionally saved the child') without contradiction? And wouldn't this make the concept useless for the *descriptive* role it clearly plays in psychology, law, and everyday explanation?" (If she resists this strong claim): "If you resist the 'inherently evaluative' view, how do you *precisely* delineate the 'conceptual core' from the moral contamination? What experimental test could falsify your view of where the line is?"

  5.  **The Specificity of Moral Badness:** "Building on the norm-violation point: even if we grant a unique role for *norm* violation, why think it's specifically *moral* badness doing the work? In the chairman case, isn't the 'badness' also about *selfishness*, *callousness*, or *violating expectations of corporate responsibility* – norms that might sit at the intersection of morality, convention, and prudence? How do you isolate *moral* badness as the unique contaminant?"
      *   *Likely Response/Follow-Up:* (If she argues these are fundamentally moral): "But then doesn't 'moral' become so broad as to be indistinguishable from 'salient negative norm violation'? What experimental manipulation could show an effect *specifically* tied to a core *moral* violation (like harm, fairness) that *doesn't* occur with an equally salient but non-moral negative norm violation (like breaking a complex bureaucratic rule with negative consequences)?"

  6.  **The Legal Implications & Contamination:** "This has profound stakes for the law. If the folk concept of 'intentional' action used by jurors is demonstrably influenced by the perceived moral badness of the outcome, doesn't this fundamentally undermine its reliability for determining *mens rea*? How can we trust jury attributions of intent if the concept itself is 'morally contaminated' as you argue?"
      *   *Likely Response/Follow-Up:* (If she downplays the impact/distinguishes folk from legal concepts): "But jurors *bring* their folk concepts into the courtroom. Judges instruct on legal definitions, but decades of research show folk intuitions powerfully shape verdicts. If the folk concept is contaminated, won't jurors reliably over-attribute intent in morally bad cases and under-attribute it in neutral/good ones, even *after* instructions? Isn't this a systemic bias?" (If she suggests awareness mitigates the problem): "Can mere *awareness* of this bias overcome its deep, potentially automatic cognitive influence? What specific procedural safeguards does your view suggest are necessary?"

  7.  **Alternative Explanations: Desire/Belief Asymmetry:** "Some, like Al Mele, suggest the asymmetry stems not from moral judgment contaminating *intentionality*, but from asymmetries in attributing *desire* or *attitude*. We more readily attribute a *desire for harm* (or indifference tantamount to desire) in the bad side-effect case than a *desire for help* in the good case. Doesn't this explain the intentionality asymmetry *without* needing to claim the concept of intentional action itself is morally loaded?"
      *   *Likely Response/Follow-Up:* (If she argues desire attribution *is* part of intentionality): "But doesn't that just push the question back? *Why* do we asymmetrically attribute the desire/attitude based on moral valence? Isn't *that* where the moral judgment is doing the work, infecting the *preconditions* for intentionality rather than the core concept? How does your view differ substantively from Mele's at that point?" (If she argues the intentionality judgment drives the desire attribution): "What evidence shows that the intentionality judgment is *primary* and *causes* the desire attribution, rather than desire/attitude judgments driving the intentionality verdict?"

  8.  **The Challenge from Development & Cross-Culture:** "If the moral 'leak' into intentionality reflects the true, universal structure of the *concept*, we'd expect to see it robustly in young children and across diverse cultures. Yet, some developmental studies show the effect emerging only around age 6-8, coinciding with the development of sophisticated moral understanding and pragmatic skills. Cross-cultural work shows significant variation. Doesn't this suggest the effect is learned/adult-like, tied to social/moral/pragmatic development, rather than revealing the core structure of the concept?"
      *   *Likely Response/Follow-Up:* (If she cites counter-studies showing early emergence): "Even if present early, does its emergence coincide with moral understanding? And for cross-cultural variance: If the effect varies significantly based on cultural moral norms or pragmatic conventions, doesn't that point more strongly to a culturally-shaped pragmatic practice than to a universal conceptual structure?" (If she argues concepts develop): "But then at what point does the 'true' concept emerge? If young children lack the moral contamination, are they operating with a *different* concept of intentionality? Doesn't that undermine the claim that the Knobe Effect reveals our *fundamental* concept?"

  9.  **Implications for Responsibility Without Intent?** "Assume your view is correct: moral badness directly shapes whether we see an action as intentional. But we also hold people responsible for *unintentional* harms caused by negligence or recklessness. If the folk concept of 'intentional' is already morally loaded, does this distort our ability to clearly assign *degrees* of responsibility? Does it risk collapsing important distinctions?"
      *   *Likely Response/Follow-Up:* (If she argues the concept captures a distinct level): "But doesn't the Knobe Effect show precisely that the 'intentional' boundary is *moved* by moral badness? Actions that might otherwise be seen as merely reckless (foreseen but not desired/aimed at) get pulled into the 'intentional' category *because* they are bad. Doesn't this artificially inflate responsibility in bad cases by mislabeling recklessness as intent?" (If she downplays the practical impact): "Given the huge weight placed on 'intentional' in law and moral judgment, isn't even a small shift in this boundary due to moral valence practically and theoretically significant?"

  10. **The Future of the Debate / Knockout Test:** "Looking forward, what do you see as the single strongest *empirical* finding or argument supporting your view that the moral judgment *constitutively* shapes the concept, rather than merely influencing how we *apply* a neutral concept or how we *talk* about blame? Conversely, what finding would make you seriously reconsider your position? What would be the 'knockout' evidence against the conceptual contamination view?"
      *   *Likely Response/Follow-Up:* (Listen carefully to her "knockout" criteria): "Regarding your criteria against your view: [Reference her specific criteria]. Given [mention specific existing studies, e.g., non-moral norm effects, pragmatic modulation, developmental data], haven't we *already* seen significant evidence meeting that threshold? Why isn't *that* sufficient?" / "Regarding your strongest evidence: Doesn't [mention rival explanation, e.g., desire-asymmetry, pragmatic account] provide a more parsimonious explanation for that same evidence?"

  **Key principles used in crafting these questions:**

  *   **Specificity & Challenge:** Avoids vague prompts; directly cites rival theories (Beebe, Adams, Mele, Machery) and key empirical patterns (non-moral norms, development, legal implications).
  *   **Anticipating Defenses:** Follow-ups target predictable counter-arguments (distinguishing moral/non-moral, competence/performance, folk/legal concepts, robustness vs. variation).
  *   **Pressure on Core Claims:** Forces engagement with whether moral badness is *unique*, whether "intentional" judgments track *psychology* vs. *pragmatics*, and the *real-world consequences* of conceptual "contamination."
  *   **Moving Beyond Vignettes:** Questions focus on the *interpretation* of diverse evidence (developmental, cross-cultural, legal, non-moral norms) and underlying mechanisms (desire vs. intent, concepts vs. heuristics).
  *   **Stakes Highlighted:** Explicitly connects the debate to practical issues like legal responsibility and the nature of moral psychology.
  *   **Forward-Looking:** Ends by asking the guest to define the boundaries of her own theory.

  Use these as a springboard. Listen actively to her responses and be ready to adapt the follow-ups or drill deeper based on her specific arguments. Good luck with the taping!
