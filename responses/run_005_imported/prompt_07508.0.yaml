answer: |-
  This is an *excellent* application of the boundary problem – moving it from abstract nation-states to concrete, low-stakes governance reveals its core tensions beautifully. Forget "unsolved problem," let's get practical. Here's my take on applying the key principles to your tenants committee, weighing the considerations for each group:

  **Core Principles Revisited (for your context):**

  1.  **All-Affected Interests (AAI):** Anyone whose interests are significantly impacted by the committee's decisions should have a say. *Broad, inclusive, but potentially unwieldy.*
  2.  **All-Subjected (AS):** Anyone who is *coerced* by the rules/environment the committee creates/enforces should have a say. *Narrower, focuses on direct experience of rules.*
  3.  **Practical Stability & Feasibility:** Democracy needs a relatively stable demos. Who has a long-term stake in the building's community and rules? Who can practically participate consistently?
  4.  **Prevention of Domination:** The system shouldn't allow one group (like the landlord) to easily dominate decisions affecting others.

  **Applying Principles to Your Stakeholders:**

  1.  **The Landlord (Owns 3 Units, Lives Elsewhere):**
      *   **AAI:** *Massively affected.* Decisions impact property value, maintenance costs, rental income, legal liability. *Argument for inclusion.*
      *   **AS:** *Minimally subjected.* Doesn't live under the rules they create. Their *tenants* are subjected, not them directly. *Argument against voting rights.*
      *   **Stability/Feasibility:** Stable, long-term interest. Can participate.
      *   **Domination Risk:** *EXTREMELY HIGH.* Giving one entity (especially the owner) multiple votes per unit they own fundamentally skews power away from residents. This violates the core democratic ideal of political equality among members.
      *   **My Take:** **Exclude from voting.** Their interests are legitimate but distinct from *residential experience*. They already have significant power via ownership (setting base rules in leases, handling major repairs, eviction). Including them creates a conflict of interest and risks resident concerns being overridden by profit motives. *Alternative:* Establish a formal channel for landlord input (e.g., non-voting observer status, required consultation on major structural/financial decisions affecting their property).

  2.  **Non-Lease Adult Residents (Partners, Adult Kids living full-time):**
      *   **AAI:** *Deeply affected.* Daily life, shared spaces, rules enforcement impact them directly. *Argument for inclusion.*
      *   **AS:** *Directly subjected.* Live under the rules 24/7. *Strong argument for inclusion.*
      *   **Stability/Feasibility:** Likely stable, long-term participants in the community (assuming they live there full-time).
      *   **Domination Risk:** Low. Including them empowers those experiencing the rules.
      *   **My Take:** **Strongly Include with Voting Rights.** This is where the "one-per-lease" rule most obviously fails the AS principle and creates democratic illegitimacy *within* the demos. Someone living there full-time is *more* subjected to committee rules than an absentee landlord. *Implementation:* Define criteria (e.g., primary residence for >6 months, not transient). They become "resident members" distinct from "leaseholder members," both voting.

  3.  **Month-to-Month Sublets & Airbnb Guests (Rotating Cast):**
      *   **AAI:** *Affected* during their stay (noise rules, common areas). *Argument for limited inclusion?*
      *   **AS:** *Subjected* to rules *while present*. *Argument for very limited inclusion?*
      *   **Stability/Feasibility:** **Very Low.** Transient, unpredictable participation, minimal long-term stake in the community's future. Including them makes the demos unstable.
      *   **Domination Risk:** Low, but their transient interests might conflict with long-term resident interests (e.g., noise vs. quiet).
      *   **My Take:** **Exclude from Voting.** The instability outweighs the affected/subjected arguments *for formal voting rights*. Their interests should be protected by rules designed *by* the stable community (e.g., clear guest policies, quiet hours). *Alternative:* Ensure rules are clearly communicated to guests/subletters upon arrival. Consider a non-voting forum for *long-term* subletters (e.g., 6+ months) to voice concerns, but not set policy.

  4.  **The Superintendent:**
      *   **AAI:** *Professionally affected.* Job duties, workload, interactions are directly shaped by committee decisions (maintenance schedules, rule enforcement, common area use). *Argument for inclusion.*
      *   **AS:** *Subjected as an employee.* Must enforce and abide by the rules while working, even if not residing. *Argument for inclusion.*
      *   **Stability/Feasibility:** Stable presence, can participate.
      *   **Domination Risk:** Potential conflict of interest. Their role is to *implement* decisions, not necessarily *make* them. Could feel pressured by residents or landlord.
      *   **My Take:** **Exclude from Voting, but Integrate Formally.** Including the super blurs the line between governed and governor/implementer. It creates potential for undue influence or conflict. *Better Approach:* Give them a defined, *non-voting* role:
          *   Required attendance at meetings to report on maintenance/issues.
          *   Right to provide input on the feasibility/cost/implications of proposed rules/changes.
          *   Clearly defined channels for residents to report issues *to* the super.
          *   The committee acts as the super's primary "client" interface for building-wide matters.

  **Synthesizing into a Workable Model (My Recommendation):**

  1.  **Define the Core Demos:** **All full-time residents with a stable, long-term stake.** This includes:
      *   Named leaseholders ("Leaseholder Members").
      *   Non-lease adults who are primary residents for >X months (e.g., 6) ("Resident Members"). *Requires a simple registration process.*
      *   **One vote per qualifying adult resident,** regardless of lease status or unit ownership. This prioritizes **All-Subjected** and **Practical Stability**, ensuring those living under the rules daily have equal power.

  2.  **Handle the Landlord Formally (Outside the Demos):**
      *   No voting rights.
      *   Establish clear protocols: e.g., Landlord receives meeting minutes; committee must consult landlord on decisions impacting building structure, major capital expenses, or lease terms; landlord can appoint a non-voting representative to attend meetings.

  3.  **Handle the Superintendent as a Key Resource (Outside the Demos):**
      *   Non-voting participant with defined rights/responsibilities: attend meetings, provide reports & technical input, receive directives from the committee on building-wide matters.

  4.  **Address Transients via Rules (Not Membership):**
      *   Develop clear, fair guest and subletter policies (noise, common areas, duration limits) *approved by the resident demos*.
      *   Ensure these policies are communicated effectively to all guests/subletters upon arrival.

  **Why this weighting?**

  *   **Legitimacy:** Prioritizing the **All-Subjected** principle ensures those who must *live under* the committee's rules have the primary say in making them. This feels intuitively fairer for daily life.
  *   **Stability:** Basing membership on stable residency creates a predictable group committed to the community's long-term health.
  *   **Anti-Domination:** Excluding the landlord (with multiple potential votes) and separating the super prevents inherent power imbalances from corrupting the residents' self-governance.
  *   **Feasibility:** Defining "resident" based on primary residence duration is relatively easy to administer.
  *   **Protecting Interests:** Formal channels for landlord input and super feedback ensure relevant interests (property, practical implementation) are heard without granting undue power.

  **Implications for your specific groups:**

  *   **Landlord:** Loses direct voting control over residential life decisions but gains a structured channel for input on matters affecting their property. They retain ultimate ownership rights outside the committee's scope.
  *   **Non-Lease Residents:** Gain formal democratic standing and an equal voice, recognizing their full participation in the community. Legitimizes their presence and concerns.
  *   **Sublet Guests:** Remain subject to rules set by the stable community. Their influence is indirect, through the hope that residents consider guest experience when setting policies. No formal voice.

  This approach accepts that the boundary isn't "perfect" (e.g., defining "primary resident" has an edge case), but it grounds the demos in the lived experience of rule-subjection and practical community stability, which feels like the most defensible and functional solution for your micro-polity. Good luck with the committee debate – it's democracy in action!
