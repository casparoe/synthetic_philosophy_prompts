  - The series is the alternating harmonic series: 1 - 1/2 + 1/3 - 1/4 + ... which converges to ln(2).
  - This is correct and complete.

  Part (b) [30 points]:
  - The student correctly notes that the alternating harmonic series is conditionally convergent but not absolutely convergent (because the harmonic series diverges).
  - They mention the Riemann rearrangement theorem: that by reordering the terms, the series can be made to converge to any real number, or diverge to ±∞.
  - They argue that the expected value is undefined because the series is not absolutely convergent, and that this is a worse problem than St. Petersburg (which has an infinite expected value, which is at least well-defined in the extended reals).
