answer: |-
  Your question cuts to the heart of a profound and ongoing debate in quantum foundations. You're absolutely right that Bell's theorem forces a choice between abandoning **locality** (no instantaneous influences at a distance) or **realism** (definite pre-existing properties independent of measurement), and mathematically, the theorem treats these assumptions symmetrically. However, the emphasis on "nonlocality" in research programs stems from a combination of **interpretative preference, operational utility, historical context, and the specific nature of quantum correlations**. Here's why:

  1.  **The Nature of the Violation: Spooky Action at a Distance:**
      *   Bell tests directly demonstrate correlations between distant particles that are stronger than *any* locally realistic model can explain. When Alice measures her particle in location A, the outcome statistics for Bob's measurement in distant location B *instantly* depend on Alice's choice of measurement setting, *even if* the events are spacelike separated (no time for a light-speed signal).
      *   This *feels* like an influence traveling instantly from A to B (or B to A). While "nonlocality" doesn't necessarily imply controllable signaling (thanks to the no-signaling theorem), the *correlation itself* exhibits a form of non-separability that strongly suggests a breakdown of locality in the sense of Einstein's "spooky action at a distance." Sacrificing realism doesn't make this spooky correlation *feel* any less nonlocal; it just explains *how* it happens without hidden variables.

  2.  **The Challenge of Sacrificing Realism (Counterfactual Definiteness):**
      *   Abandoning realism means accepting that particles *do not possess* definite values for properties like spin or polarization *prior to and independent of* the specific measurement context. This challenges our classical intuition deeply.
      *   More importantly, it often requires abandoning **counterfactual definiteness**: the idea that it makes sense to talk about "what the result *would have been*" if a different measurement had been performed on the *same* system. Bell's theorem relies on counterfactual reasoning. If counterfactuals are meaningless, the theorem's assumptions about what *could have happened* become suspect.
      *   While interpretations like Copenhagen or QBism embrace this (properties are created by measurement), it leads to well-known conceptual difficulties like the measurement problem (when exactly does this creation happen?). Sacrificing locality, while counterintuitive, avoids some of these specific interpretational tangles. Nonlocal theories (like Bohmian mechanics) can maintain realism and counterfactual definiteness.

  3.  **Operationalism and Device-Independence:**
      *   Fields like device-independent quantum cryptography (DIQKD) and randomness generation exploit Bell nonlocality *without* needing to know the internal workings of the devices (hence "device-independent"). The key resource they rely on is the **observed violation of a Bell inequality**.
      *   This violation *operationally* certifies that the outputs of the devices are intrinsically unpredictable to any adversary limited by locality and classical resources. It directly leverages the fact that local realistic models *cannot* reproduce the observed correlations.
      *   While sacrificing realism is *one way* to explain the violation, the operational certification works purely based on the *failure of locality* within the local realistic framework. The protocol guarantees security *because* the correlations are nonlocal, regardless of the underlying ontological interpretation (realist or not). Nonlocality is the directly exploitable *resource*.

  4.  **Compatibility with Relativity (Peaceful Coexistence):**
      *   A major reason physicists are more comfortable emphasizing nonlocality is the **no-signaling theorem**. Quantum mechanics (and all known theories reproducing its predictions) rigorously prevent faster-than-light *communication* using entanglement. Bob cannot learn Alice's measurement choice faster than light by looking at his particles.
      *   This allows quantum nonlocality to coexist "peacefully" with Special Relativity. While there is nonlocal *correlation*, there is no nonlocal *control* or *signaling*. Sacrificing locality in this controlled, non-signaling way is seen as less catastrophic than violating the core principle of relativistic causality (no FTL signals). It becomes "only" a matter of nonlocal correlations, not controllable influences.

  5.  **Historical Context and Framing:**
      *   The EPR argument (which Bell formalized) was framed *specifically* as an argument for the incompleteness of QM *based on locality*. EPR assumed locality and realism to argue that QM must be incomplete. Bell showed that locality *plus* realism leads to a contradiction with QM. The natural conclusion from that lineage was to question locality.
      *   Interpretations emphasizing non-realism (like Copenhagen) were already dominant *before* Bell's theorem. Bell's work was seen as providing a rigorous argument *against* the local hidden variable programs (like de Broglie-Bohm early attempts) that aimed to restore realism *without* nonlocality. It solidified that *if* you want realism, you *must* accept nonlocality.

  **Why "Agnosticism" Isn't Always the Default:**

  1.  **Interpretations Take Stances:** While careful researchers acknowledge the formal symmetry in Bell's theorem, they work within specific interpretational frameworks. Bohmian mechanics explicitly chooses realism + nonlocality. Collapse models often add explicit nonlocal dynamics. Copenhagen/QBism embrace non-realism. Research programs often align with these interpretations.
  2.  **Nonlocality as the Directly Observable Consequence:** The experimental result is *correlations that cannot be explained locally*. This screams "nonlocality" as the most direct description of the phenomenon. Non-realism is the *explanation* for *how* nonlocal correlations can exist without signaling, but it's not what the experiment directly *shows* in the same visceral way.
  3.  **Utility:** As in device-independent cryptography, "nonlocality" directly names the resource being exploited. Talking about "the failure of local realism" is more cumbersome and less specific to the phenomenon being harnessed.

  **Conclusion:**

  You are correct that Bell's theorem symmetrically implicates locality and realism. Careful foundational discussions *do* acknowledge this symmetry. However, the emphasis on "nonlocality" in many research programs arises because:

  *   The observed correlations **manifestly defy local explanation**.
  *   Sacrificing realism introduces significant **conceptual challenges** (measurement problem, loss of counterfactuals).
  *   Quantum nonlocality is **operationally useful** (device-independence) and **compatible with no-signaling**.
  *   It provides a **more direct description** of the experimental violation.
  *   **Historical framing** centered on locality.

  While maintaining formal agnosticism about the *ultimate ontological commitment* (realism vs. non-realism) is philosophically sound for foundational work, the *phenomenon* of inexplicable (by local causes) correlations between distant events is most concisely and powerfully labeled "nonlocality." Research programs focused on exploiting or understanding this phenomenon naturally adopt that term. The choice isn't *arbitrary* taste, but a reflection of the phenomenon's nature, utility, and the relative palatability of the alternatives within the constraints of known physics (especially no-signaling).
