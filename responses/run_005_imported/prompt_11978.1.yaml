  This is a correct definition. Kripke defines a rigid designator as a term that designates the same object in every possible world in which that object exists. The contrast with a non-rigid designator (like a definite description) is also correctly explained. The example of 'the morning star' is appropriate because it is a description that might pick out different objects in different possible worlds.

