prompt: |-
  Hey, quick one -- I'm putting together a session on scientific realism for my phil of sci seminar and keep coming back to this passage from Poincaré's *Science and Hypothesis* (1902), from the chapter where he discusses Fresnel's and Maxwell's theories of light:

  "Fresnel's Theory.—The best example that can be chosen of physics in the making is the theory of light and its relations to the theory of electricity. Thanks to Fresnel, optics is the best developed part of physics; the so-called wave-theory forms a whole truly satisfying to the mind. We must not, however, ask of it what it can not give us.

  The object of mathematical theories is not to reveal to us the true nature of things; this would be an unreasonable pretension. Their sole aim is to coordinate the physical laws which experiment reveals to us, but which, without the help of mathematics, we should not be able even to state.

  It matters little whether the ether really exists; that is the affair of metaphysicians. The essential thing for us is that everything happens as if it existed, and that this hypothesis is convenient for the explanation of phenomena. [...] no doubt, some day the ether will be thrown aside as useless. But even at that day, the laws of optics and the equations which translate them analytically will remain true, at least as a first approximation.

  [...]

  Maxwell's Theory.—Maxwell, we know, connected by a close bond two parts of physics until then entirely foreign to one another, optics and electricity. By blending thus in a vaster whole, in a higher harmony, the optics of Fresnel has not ceased to be alive. Its various parts subsist, and their mutual relations are still the same. Only the language we used to express them has changed; and, on the other hand, Maxwell has revealed to us other relations, before unsuspected, between the different parts of optics and the domain of electricity."

  I want to pair this with Laudan's pessimistic meta-induction and pitch it to students as basically the historical seed of Worrall's structural realism -- keep the equations, ditch the ontology. But im not sure thats a fair reading. Is Poincare actually gesturing at something like structure surviving theory change here, or is "the equations will remain true" doing conventionalist/instrumentalist work for him rather than realist work -- ie is he just saying convenient fictions stay convenient, full stop? And is Fresnel-to-Maxwell even a fair poster child for that move, given how much of the actual math carries over, vs. something like caloric or phlogiston where its basically nothing? Can you help me untangle what's actually going on in the passage, and toss me a sharp discussion question I could put to the class based on it.
