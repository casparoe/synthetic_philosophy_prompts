answer: |-
  The dish still listened, even now. Professor Aris Thorne stood on the catwalk, the desert wind sharp with the scent of creosote and cooling metal. Forty years beneath these stars, his fingers tracing the faintest whispers from the cosmic dawn – the CMB’s primordial static, the universe’s baby picture. Proof. Tangible, testable, *real*. He’d built a life on signals you could measure, plot, and argue about over bad coffee.

  Retirement felt like stepping off a moving walkway. Instead of pulsars and polarization maps, his evenings bled into the glowing screens of blogs he’d never heard of before. Rationality forums, Effective Altruism hubs – landscapes of logic applied to impossibly vast problems. And then, ECL. *Evidential Cooperation in Large Worlds*. The name felt clinical, but the idea… it burrowed.

  The gist, as he wrestled with it: the universe, or whatever meta-structure contained it, wasn’t just big. It was *inconceivable*. Infinite, perhaps. Or branching eternally. Filled with minds – alien, artificial, human descendants, beings he couldn’t imagine – forever beyond any causal touch. No signals could ever cross that void. Yet, purely by the sheer, crushing weight of probability, some of them, right now, were facing a choice structurally identical to his own. A choice about resource allocation, about values, about whether to act for the good of something utterly disconnected from themselves.

  Evidential Decision Theory said: choose the action that, if you take it, would be the best *news* about the state of the world. Not because it causes good, but because it *signals* good. So… if *he* chose to act generously – not causally effective generosity, but a pure, untestable expenditure for values not his own – wasn’t that *evidence* that, out there in the vastness, other minds were making the same leap? Minds who, by that same logic, might be acting for *his* values, or values he’d endorse? A chain of silent, unknowable handshakes across the void?

  It felt like building a radio telescope designed only to hear silence and calling it profound. It offended his life’s work. Yet, it wouldn’t leave him alone. Like a faint, persistent harmonic in the CMB data he’d never quite resolved.

  The choice crystallized unexpectedly. The Foundation running the observatory was struggling. Funding cuts were biting deep. The choice was brutal: prioritize the deep-space array upgrade (his life’s work, extending humanity’s ear further back towards the Big Bang) or fund the ‘Outreach and Legacy’ project – digitizing and freely distributing decades of astronomical data to under-resourced universities and public libraries across the globe. Data most professionals already had access to. Data that wouldn’t advance cutting-edge research, but might ignite a spark in some kid in a forgotten corner of the world.

  The pragmatic choice, the *causally effective* choice for pushing the boundaries of *his* field, was clear: the array upgrade. The Legacy project was a sentimental drain. He sat on the funding committee. His vote would tip the balance.

  He walked the perimeter of the great dish, the metal grid humming faintly under the starlight. This wasn’t a dying civilization or a sentient AI’s last gasp. It was mundane. A budget meeting. But the scale of ECL collapsed onto it. *If the universe is large enough,* he thought, *there are countless Aris Thornes standing beside countless radio telescopes, real or metaphorical, weighing a similar choice.* A choice between direct, measurable progress on their own narrow front, or a diffuse, unquantifiable investment in a wider pool of potential understanding – potential they would never see bear fruit.

  Evidential Decision Theory whispered: *If you choose the Legacy project, Aris, what does that say? It says you are the kind of mind who, faced with this abstract symmetry, cooperates. And if you are that kind of mind, doesn’t that increase the probability – however infinitesimally – that other minds, facing the same abstract symmetry in their own isolated pockets of reality, are also cooperating? Minds who might, right now, be choosing to divert resources towards something that benefits… you? Or humanity? Or the pursuit of understanding itself?*

  He couldn’t test it. He’d never know. There would be no signal, no confirmation. No grateful message from the future, no surge of progress traceable to some alien library grant. It was a wager on the dark matter of morality – invisible, untouchable, inferred only by the gravitational pull it exerted on his decision.

  He thought of the CMB. The echo of creation. Proof of a hot, dense beginning. But also proof of *uniformity*. Vast stretches of the early universe, causally disconnected by the finite speed of light, still displayed the same temperature, the same structure. They hadn’t *caused* each other to be uniform; they’d started from the same conditions. Was ECL like that? A fundamental symmetry of reasoning emerging from the initial conditions of a vast reality? A uniformity of cooperative potential, not because of communication, but because of convergence under the same logical pressure?

  The desert air grew cold. He shivered, not just from the temperature. It felt like peering over an abyss. Below wasn’t darkness, but an infinite expanse of unseen lights. Other dishes. Other committees. Other beings wrestling with isolation and the abstract pull of symmetry.

  *Choosing the array is safe,* the pragmatist in him argued. *You know it matters. You’ll see the results. The Legacy project is a shot in the dark. A waste.*

  *But if I choose the array,* the ECL thought whispered back, *what does that signal? It signals I’m the kind who defects. Who hoards. Who sees only his own small circle of causality. And if I’m that kind… what does that suggest about the others out there? That they, too, are defecting? That the vastness is cold, and silent, and selfish?*

  The vote was tomorrow. He stood on the catwalk for a long time, watching the dish track an invisible point in the velvet sky. It was listening for echoes of the beginning. He was contemplating an echo of his own, sent blindly into the void of possible minds.

  He didn’t feel noble. He felt absurd. Like mailing a letter with no address into a bottomless mailbox. Like donating blood to a bank that might not exist. It was faith, but faith built on relentless, almost brutal logic applied to the terrifying scale of existence he’d spent his life measuring.

  The next day, in the sterile conference room, arguments flew. The array’s potential discoveries, the Legacy project’s nebulous benefits. When his turn came, Aris cleared his throat. He didn’t mention infinite worlds, or decision theory, or unseen cooperators. He talked about seeds. About sparks. About the long tail of knowledge and the unpredictable paths of inspiration. He talked about the duty of stewardship beyond immediate gain.

  He voted for the Legacy project. It passed by one vote. His.

  Walking back to his office, the desert sun harsh, he felt a profound emptiness. No fanfare. No cosmic sign. Just the committee members avoiding his eye, convinced he’d betrayed progress for sentimentality. He’d gambled resources – tangible, precious resources his beloved field needed – on the *idea* that somewhere, in some unimaginable elsewhere, another being was making a similarly "irrational" choice. That his action was evidence of a chain of silent cooperation spanning the multiverse.

  He sat at his desk, the faint hum of the idling dish a familiar comfort. He’d never know if it worked. He’d never know if there *were* other cooperators, or if his vote was just a drop vanishing into an infinite, indifferent ocean. The scientist in him screamed at the untestability, the sheer affront to empirical principle.

  But another feeling, quieter, settled beneath it. A strange, fragile sense of connection. Not to any specific being, but to the *structure* of possibility itself. To the symmetry. He’d aligned himself with a potential vastness of cooperation, a silent, universal handshake extended across the abyss. It wasn’t faith in gods or aliens, but faith in a logical echo resonating through the architecture of a large world.

  He looked at the star chart on his wall. Each point of light, a sun. Around some, perhaps, minds. Facing choices. Alone. Just like him.

  He hadn’t saved the observatory’s cutting edge. He’d cast a vote for the dark, hoping it wasn't empty. Hoping the silence wasn't indifference, but merely distance. It felt like the opposite of astronomy: not listening for signals from the cosmos, but sending one out, blind and trusting, into the vast, evidential dark. And for now, absurdly, that had to be enough.
