      This is why the induction step fails: because the agent cannot assume that its own proofs are sound without running into Löb's theorem.

  ### (2) The procrastination paradox

  The procrastination paradox is a toy example that illustrates the problem. Consider an agent that must press a button at some point. The agent has a rule:

      "Press the button now if and only if I do not have a proof that I will press the button at some future time."

  Alternatively, we can state it as:

      "I will press the button now unless I can prove that I will press it later."

  But note: if the agent can prove that it will press the button later, then it doesn't press now. But then, if it doesn't press now, and it uses the same reasoning at the next step, then it will again not press now because it might prove that it will press even later? And so on, ad infinitum.

  Let me formalize:

      Let P be the statement "the agent presses the button at some time".

      The agent's algorithm at time t:

          If the agent can prove P (using its proof system) then it does not press at t.
          Else, it presses at t.

      Now, what happens?

      Suppose the agent can prove P. Then it does not press at t=0. Then at t=1, the same situation: if it can prove P (which is still true? because the future is the same) then it doesn't press. So if it has a proof of P, it never presses? But then P is false. Contradiction.

      So the agent cannot prove P. Therefore, at t=0, since it cannot prove P, it presses. So P is true.

      But wait: if the agent presses at t=0, then P is true. So why couldn't the agent prove P? Because the agent's proof system is not strong enough to prove that it will press? But it does press.

      However, the agent's algorithm is self-referential. The agent might be using a proof system that cannot prove statements about its own future actions. In fact, the agent's own action (pressing or not) depends on whether it has a proof. So the proof system cannot assume that the agent will follow the algorithm without creating a circularity.

      This is similar to the surprise examination paradox.

      The problem is that the agent's proof system, if it is consistent, cannot prove that it will eventually press the button. Why? Because if it did, then the agent would not press at time 0, and then at time 1 it would have the same proof and not press, and so on. But then the proof that it will press is false. So the proof system cannot prove that without being inconsistent.

      Therefore, the agent does not have a proof of P at time 0, so it presses. But then P is true. So the proof system is incomplete: it cannot prove a true statement (P).

      This illustrates the weirdness: the agent does the right thing (presses the button) but it cannot prove in advance that it will do so. And if it had a stronger proof system that could prove it, then it wouldn't do it.

  ### (3) Why stronger proof systems per generation don't fully fix it

  The idea: each time the AI self-improves, it uses a proof system that is stronger than the previous one. So agent A0 uses system T0, A1 uses T1, where T1 is stronger than T0 (in the sense that T1 can prove everything T0 can, and more). Then A0 can prove properties about A1 because A1 uses T0? Not exactly.

  The hope is that A0, using T0, can prove that A1 (which uses T1) is safe. Then A1, using T1, can prove that A2 (which uses T2, even stronger) is safe, and so on. This breaks the circularity because each agent is using a different system.

  But the problem is that the chain of agents is infinite. So we have:

      A0 proves in T0: Safe(A1)
      A1 proves in T1: Safe(A2)
      A2 proves in T2: Safe(A3)
      ...

  But we want the whole chain to be safe. How can we prove that? We would need to prove that every agent in the chain is safe. But note that A0 only proves Safe(A1) and does not (and cannot) say anything about A2, A3, etc. Similarly, A1 proves Safe(A2) but we don't have a connection from Safe(A1) to Safe(A2) because they are in different proof systems.

  Moreover, the safety of the entire chain requires that every agent in the chain is safe. But A0 does not know what T1, T2, etc. are. It only knows that T1 is stronger than T0. But if T1 is too strong, it might be able to prove things that are false? Then A0 cannot trust T1.

  To trust T1, A0 must know that T1 is sound. But T1 is stronger than T0. How can A0, using T0, prove the soundness of T1? Typically, a theory cannot prove the soundness of a stronger theory. For example, Peano Arithmetic (PA) cannot prove the consistency of a stronger theory like ZFC.

  Therefore, A0 might not be able to prove that A1 is safe because A1 uses a stronger proof system that A0 cannot fully reason about.

  Moreover, even if we assume that each agent proves the next one safe, we still need to argue that the entire chain is safe. But the chain is infinite. We would need to do an induction over the agents, but the base case is missing. The first agent A0 is safe by design? But then A0 must trust A1, but A0 cannot prove the safety of the entire chain beyond A1.

