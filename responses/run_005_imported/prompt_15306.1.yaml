  I recall Frankfurt's bullshit concept: indifference to truth. Lying requires knowing the truth and concealing it. Current LLMs lack beliefs and intentions, so their false outputs aren't lies. But deceptive alignment models, if they develop goals, could intentionally deceive. So separating terms based on underlying mechanisms makes sense.

