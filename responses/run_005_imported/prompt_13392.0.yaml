answer: |-
  Here are eight interview questions designed to probe the Humean position deeply, with follow-ups anticipating likely responses. Each targets your specified themes while demanding substantive engagement beyond restatement:

  ### 1. On the New Principle & Concrete Undermining  
  **Question:** Take a toy undermining scenario: A coin’s *actual* 50% chance of heads depends (via best-system laws) on its *entire future sequence* including 50% heads. Under Lewis’s original Principal Principle, learning the true chance *P* would force a credence that undermines *P* itself. Walk us through precisely how conditionalizing on the *history-to-chance conditional* (“If the entire history is *H*, then *P* is the chance”) in the New Principle avoids this self-sabotage in *this specific case*. Where does the original principle’s inference go wrong that the New Principle corrects?  

  **Likely Answer:** She’ll note that the New Principle conditionalizes on the *entire hypothetical link* between history and chance, blocking credence in futures that would violate the very chance law being applied.  
  **Follow-Up:** But doesn’t this merely *relocate* the problem? If the best-system chance *P* is *defined* by the global pattern (including future frequencies), how can we even *coherently* conditionalize on "If *H* then *P*" when *P*’s truth *depends* on the future outcome we’re predicting? Isn’t this smuggling in a non-Humean fixation of chances?  

  ---

  ### 2. On Admissibility Beyond a "Laundry List"  
  **Question:** Lewis treated "admissible evidence" as a patchwork of examples (past history, theory, etc.). But if Humeanism grounds chance in the *best system itself*, shouldn’t we expect a *principled definition* of admissibility derived from the theory’s structure? Can you define "admissible evidence" *solely* in terms of the best system’s axioms and its fit/balance trade-offs, without circularly invoking "what avoids undermining"?  

  **Likely Answer:** She’ll argue admissibility flows from the best system’s role: evidence is admissible iff it doesn’t reveal information *outside* what the chance law summarizes for prediction.  
  **Follow-Up:** But the best system’s laws are global and supervenient—so *any* localized evidence (e.g., "coin flip #42 is heads") *could* undermine the pattern defining chance. Doesn’t this imply that *no* evidence about particulars is truly "admissible" under Humeanism? Or is admissibility just shorthand for "evidence we’ve decided *by fiat* won’t challenge our system"?  

  ---

  ### 3. On the "Big Bad Bug" & Circularity  
  **Question:** Lewis called it a "big bad bug": if my *current credences* are part of the Humean mosaic that *determines* the chances, deferring to those chances feels circular—like consulting a map that’s drawn by following my own footsteps. How does your version of Humeanism break this circle? Why isn’t "deference to chance" just deference to the *current state* of my own (or my community’s) credences?  

  **Likely Answer:** She’ll emphasize that chances are fixed by the *entire* mosaic (past, present, *and future*), not current credences alone, so credences are just one thread in a vast tapestry.  
  **Follow-Up:** But if the *entire tapestry* includes *all* credences (past/present/future), and chance is defined by patterns in that tapestry, doesn’t "deference" still reduce to trusting that the *actual* pattern of beliefs (including errors) happens to align with the *best systematization* of... the pattern of beliefs? Isn’t this a hall of mirrors?  

  ---

  ### Additional Probing Questions:  
  4. **On the Epistemic Authority of Chance:**  
     Humeans often say chances are "objectively correct" for guiding credence. But if chance is *defined* by our best epistemic standards (simplicity, strength, fit), isn’t this just saying "use methods that satisfy our standards"? Where does the *normative force* to obey chances come from, if not from outside the system?  
     *Follow-Up (if she appeals to accuracy):* But doesn’t Humeanism *deny* that chances track mind-independent propensities? If "accuracy" just means "aligns with the best-system frequencies," isn’t the norm circular?  

  5. **On the Cost of the New Principle:**  
     The New Principle requires agents to conditionalize on *highly theoretical* propositions (history-to-chance conditionals). How can ordinary agents—or even scientists—grasp these? Doesn’t this make the New Principle practically inert compared to Lewis’s "simple" deference to single-case chances?  

  6. **On Undermining Futures & Action:**  
     Suppose I learn that *if* I bet my life savings on heads, the resulting future frequency would make *this coin’s actual chance* 50%, but *if* I abstain, the chance would be 60% heads. How would the New Principle guide my credence *before* I act? Doesn’t Humeanism make chance hostage to my choices?  

  7. **On the Metaphysical Payoff:**  
     Lewis saw Humeanism as avoiding "mysterious" propensities. But with the New Principle, admissibility puzzles, and the "big bad bug"—does the theory *really* deliver a simpler ontology, or has it just shifted complexity into epistemology?  

  8. **On Rivals (e.g., Primitive Conditional Chances):**  
     Some (like Isaac Levi) argue that evidential relevance requires primitive *conditional* chances (P(A|B)) not reducible to best systems. Why is your Humean reduction preferable to accepting such primitives?  

  ---  
  **Key Design Notes:**  
  - **Concreteness:** Forces engagement with toy cases (Q1, Q6) to avoid abstraction.  
  - **Circularity Pressure:** Follow-ups (especially Q3 & Q4) target the core worry that Humeanism "bootstraps" normativity.  
  - **Metaphysical vs. Epistemic:** Q7 & Q8 contrast the purported ontological simplicity with epistemic costs.  
  - **No Retreat to Exposition:** Each question requires defending a *move* within the system, not restating it.  

  These should force your guest to defend the *workings* and *costs* of Humeanism under pressure, satisfying your listeners’ hunger for rigor. Good luck with the interview!
