answer: |-
  ## The Conditional Analysis Under Siege: Why Finks and Masks Demand Surrender

  The Simple Conditional Analysis (SCA) – defining a disposition to manifest M in condition C solely by the counterfactual "If C were the case, M would occur" – promised an elegant reduction of dispositions to familiar modal terms. Yet, two devastating counterexample families, Martin's finks and Johnston's masks (later Bird's antidotes), shattered this promise. While Lewis's Reformed Conditional Analysis (RCA) offered a significant repair, Bird demonstrated its vulnerability to masks. The core question persists: can *any* conditional analysis withstand the combined assault of finks and masks? This essay argues that these problems expose fundamentally distinct vulnerabilities, and that despite ingenious attempts, no viable conditional reduction survives their simultaneous pressure, revealing dispositions as irreducible modal properties.

  **Distinct Mechanisms of Failure: Why Finks ≠ Masks**

  At first glance, both finks and masks render the simple conditional false despite the presence of the disposition. However, they achieve this through *radically different mechanisms*, targeting different aspects of the conditional's logic:

  1.  **Martin's Finks: Targeting Disposition Persistence.** Finks operate by *removing the disposition itself* precisely when the stimulus condition C occurs. In the electrified wire case, the wire *is not* live when untouched. The finkish device *makes* it live only *because* and *when* a conductor touches it. Crucially, **the disposition (being live) does not exist at the crucial time *prior* to the stimulus triggering the manifestation.** The conditional "if touched, it conducts" is true *despite* the absence of the relevant disposition beforehand. Finks exploit the SCA's failure to require that the disposition *persists* through the onset of the stimulus condition. The counterfactual holds, but not because of an existing disposition; it holds because the stimulus *creates* the very state needed for the manifestation.

  2.  **Johnston's Masks / Bird's Antidotes: Targeting the Causal Pathway.** Masks operate while *leaving the disposition fully intact*. The fragile glass *possesses* the intrinsic microstructural property (its "causal basis") constituting fragility. The packing material doesn't alter this basis; it doesn't make the glass less fragile. Instead, **the mask *intervenes* in the causal chain *between* the stimulus (being struck) and the manifestation (breaking).** It absorbs or redirects the force, preventing the fragile structure from shattering. The conditional "if struck, it breaks" is false *even though* the disposition and its causal basis persist unchanged. Masks exploit the SCA's (and RCA's) failure to guarantee that the stimulus can *actually engage* the disposition's causal basis to produce the manifestation without external interference.

  **Lewis's Reformed Analysis: Blocking Finks, Succumbing to Masks**

  Lewis's RCA directly addressed finks by requiring the disposition's intrinsic causal basis to persist through the stimulus:
  > X is disposed to M when C iff X has some intrinsic property B such that: **if C were to obtain and X were to retain B throughout,** then C and B would cause M.

  This handles finks. In Martin's wire, when untouched, the wire lacks the intrinsic basis (electrons free to move) for being live. The finkish device adds this basis *only upon* touch. Crucially, the antecedent requires the basis to be present *before* and *retained through* C (being touched). Since the wire lacks B *before* touch and doesn't retain it (it gains it *during* touch), the RCA correctly denies that the untouched wire is disposed to conduct when touched.

  However, as Bird forcefully argued with the "antidote" (mask) case, RCA fails against masks. The fragile glass *has* intrinsic property B (its brittle molecular structure). The packing material doesn't destroy B; the glass retains B throughout the stimulus (being struck). According to the RCA, "if struck and glass retains B, then strike and B cause break." But in the masked scenario, strike and B *do not* cause break; the packing material prevents it. The counterfactual is false. Yet, intuitively, the glass *is* fragile – its intrinsic causal basis B is present and intact. RCA, like SCA, fails to ensure that the causal path from stimulus-plus-basis to manifestation remains unobstructed.

  **The Rescue Attempt: Explicit Exclusion Clauses**

  One seemingly straightforward rescue is to build the absence of finks and masks directly into the stimulus condition C:

  > X is disposed to M when C iff: **If C were to obtain *and no finkish or masking conditions were present*, then M would occur.**

  **Why This Fails:** This approach succumbs to fatal circularity and vacuity. The clause "no finkish or masking conditions" is just a placeholder for "*no conditions that would prevent the disposition from manifesting upon C, despite the disposition being present*." But **this is precisely what a disposition *is***. Defining a disposition as "if C and nothing interferes with the disposition manifesting, then M" reduces to "if C and the disposition manifests, then M." This is either circular (using the concept of the disposition's manifestation in its own definition) or trivial (true whenever M occurs under C, regardless of any underlying disposition). It fails to provide a *reductive* analysis in purely conditional or causal terms, smuggling in the very dispositional concept it seeks to reduce.

  **The Rescue Attempt: Proportional/Probabilistic Analysis**

  Another approach, championed by Manley and Wasserman (2008), replaces the strict conditional with a proportional or probabilistic one:

  > X is disposed to M when C iff X would M *in a suitable proportion* of C-cases (across relevant possible scenarios).

  **Why This Fails Against Finks and Masks:** While this handles some cases (e.g., a fragile glass might break in *most* strike scenarios, even if some involve masks), it struggles profoundly with robust finks and masks designed to be ever-present or highly probable.

  1.  **Robust Finks:** Imagine a "super-fink" wired such that *whenever* the wire *might* be touched in *any* possible scenario, it activates, making it live only at that exact moment. The wire is *never* disposed to conduct (it lacks the basis when untouched), yet it conducts in *100%* of the cases where it *is* touched (because the fink activates). The proportional analysis incorrectly deems it disposed to conduct. The analysis conflates the manifestation happening *due to the stimulus creating the basis* (fink) with manifestation happening *because of a pre-existing disposition*.
  2.  **Robust Masks:** Imagine a "universal mask" – perhaps a fundamental law or field ensuring that whenever a fragile object is struck, a force field instantly absorbs the impact. The glass retains its intrinsic fragility (causal basis B) in all scenarios. Yet, it breaks in *0%* of strike scenarios. The proportional analysis incorrectly denies that it is fragile. The analysis fails to distinguish between the *absence of a disposition* (low proportion) and the *presence of a disposition constantly thwarted by external interference* (masking).

  The proportional analysis cannot reliably isolate cases where the manifestation *fails to occur due to the absence of the disposition* (which should make the analysis false) from cases where the manifestation *fails to occur despite the presence of the disposition* (which should leave the analysis true). Finks and masks exploit this ambiguity in distinct ways, ensuring that no single proportion threshold can correctly classify all cases without again implicitly relying on dispositional concepts to define the "relevant" scenarios or "suitable" proportion.

  **Verdict: The Conditional Analysis Cannot Stand**

  Finks and masks, operating through distinct mechanisms – finks destroying the disposition *at the time of stimulus*, masks blocking the causal pathway *while the disposition persists* – constitute a pincer movement that no conditional analysis can withstand. Lewis's RCA successfully blocks finks by demanding intrinsic persistence but remains fatally vulnerable to masks. Explicit exclusion clauses collapse into circularity. Proportional analyses fail to distinguish genuine lack of disposition from universal interference.

  The core problem is that dispositions are **intrinsic properties that ground *potentialities***. A conditional analysis tries to reduce this potentiality to a simple connection between stimulus and manifestation. Finks show that this connection can hold *without* the prior intrinsic ground (the disposition). Masks show that the intrinsic ground can be present *without* the connection holding. **Any viable analysis must capture both the intrinsic grounding nature *and* the connection to manifestation under the right conditions.** The conditional form, by its nature, focuses only on the connection. Attempts to patch in the intrinsic grounding (like RCA) or rule out interference inevitably either fail against one class of counterexample or smuggle in the very dispositional concept they seek to reduce.

  Therefore, the combined force of finks and masks demonstrates that **dispositions resist reductive analysis solely in terms of counterfactual or conditional statements.** They are metaphysically robust, irreducible modal properties. While conditionals can track dispositions in favorable circumstances, they cannot provide the necessary and sufficient conditions for their analysis. The quest for a purely conditional reduction must be abandoned. Dispositions are, fundamentally, something more.
