  So we require: u / 100 = v / 10   =>   u = 10 * v

  But on the frontier: v = sqrt(100 - u)

  So: u = 10 * sqrt(100 - u)

  Set w = sqrt(100 - u), then u = 10w, and w^2 = 100 - u = 100 - 10w

  So: w^2 + 10w - 100 = 0

  Solving quadratic: w = [-10 ± sqrt(100 + 400)]/2 = [-10 ± sqrt(500)]/2 = [-10 ± 10*sqrt(5)]/2 = -5 ± 5*sqrt(5)

  We take the positive root: w = -5 + 5*sqrt(5) ≈ -5 + 5*2.236 ≈ -5 + 11.18 = 6.18

  Then u = 10 * w ≈ 61.8

