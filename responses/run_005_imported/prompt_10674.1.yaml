  Tomas gets 100 - 61.8 = 38.2 dollars.

  So:
  - NBS: Priya gets 66.67, Tomas 33.33
  - KSBS: Priya gets 61.8, Tomas 38.2

  Now, the dialogue:

  Priya proposes Nash, Tomas proposes Kalai-Smorodinsky.

  They both know the math, so they can compute.

  We'll write the dialogue accordingly.

  Note: The key arguments:

  Priya (for Nash) must defend against the IIA criticism: that if the set expands in a way that only helps one party, that party might actually get less (the example of a truncated set). But in our case, we are not truncating, but we can discuss the principle.

  Tomas (for KS) must defend against the criticism that KS can be influenced by irrelevant alternatives (the utopia point, which might be based on points that are not actually chosen).

