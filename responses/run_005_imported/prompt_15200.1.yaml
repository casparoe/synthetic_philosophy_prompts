prompt: |-
  Random tangent from the novel im drafting: I've fallen down a rabbit hole of decision-theory blog posts about "acausal threats" — basically blackmail where the threatener never actually causally interacts with you, they just need to correctly predict how you'd react — and a proposed defense called "surrogate goals," where you pre-commit to only ever letting threats hook onto some fake, low-stakes goal instead of the thing you really care about, so blackmailers get nothing real by targeting you. My antagonist's an old Hobbes scholar whos always quoting that Leviathan line about covenants without the sword being just words. I'm genuinely curious what you think Hobbes himself would make of surrogate goals as a fix for this - does a truly hard-wired commitment like that count as smuggling in your own personal "sword" (so it could actually work), or is it still just words dressed up in game theory, doomed the way any covenant is without real enforcement behind it? Bonus question: would his materialism even let him take "acausal" anything seriously in the first place, or would he just call the whole framing nonsense?
reasoning: |-
