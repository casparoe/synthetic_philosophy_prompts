answer: |-
  ## The Circularity Gauntlet: Assessing Joyce's Accuracy-Dominance Argument for Probabilism

  James Joyce's accuracy-dominance argument for probabilism presents an elegant and influential case: rational credences must obey the probability axioms because any incoherent credence function is *accuracy-dominated* – guaranteed to be strictly less accurate in *every possible world* than some coherent alternative. Crucially, this dominance holds only if inaccuracy is measured by a "legitimate" scoring rule, typically characterized as additive, continuous, and **strictly proper**. Herein lies the core tension: propriety is defined using probabilistic expectation. Does defining legitimacy in these terms smuggle in probabilism through the back door, rendering the argument circular? While the charge is serious and exposes a vulnerability, it does not ultimately defeat Joyce's project. The restriction to proper scoring rules can be independently motivated without presupposing the full force of probabilism.

  **The Circularity Charge: A Formidable Challenge**

  The critics' case is potent:

  1.  **Definitional Dependence:** Propriety is *explicitly* defined in terms of probabilistic expectation: A scoring rule `S(c, ω)` is proper iff, for any credence `c` and probability function `p`, the expected score `E_p[S(c, ω)]` is minimized when `c = p`. This definition presupposes the coherence and applicability of probabilistic expectation (`E_p`).
  2.  **Presupposing the Framework:** To accept that minimizing expected inaccuracy (under one's own credences) defines legitimacy *is* to accept that rational agents *ought* to manage their epistemic choices by maximizing probabilistically defined expected utility (here, minimizing expected inaccuracy). This is a core tenet of Bayesian decision theory, which itself *presupposes* probabilism (rational credences *are* probabilities) to define coherent preferences and actions.
  3.  **Question-Begging Restriction:** Requiring legitimate inaccuracy measures to be proper before proving probabilism seems to assume the very framework (probabilistic expectation as the arbiter of rational epistemic choice) that the argument aims to establish. It uses probabilism (in the guise of `E_p`) to justify the tools needed to prove probabilism. If an agent doesn't already accept that rational epistemic evaluation requires maximizing probabilistic expected accuracy, why should they accept the restriction to proper rules? Why not use, say, absolute deviation (which is *not* strictly proper) as the measure of inaccuracy?

  This charge strikes at the heart of the argument's foundational aspirations. If propriety rests on probabilistic expectation, and probabilistic expectation presupposes probabilism, then the dominance argument appears to be proving probabilism using tools only available *after* probabilism is assumed.

  **Defending Independence: Motivating Propriety Without Full Probabilism**

  Despite its force, the circularity charge can be defused. The restriction to proper scoring rules can be motivated by considerations prior to or independent of the full acceptance of probabilism as the *only* rational framework:

  1.  **The "No Regret" or "Anti-Manipulation" Principle:** This is the strongest independent motivation. Suppose a scoring rule is *not* proper. Then, there exists some probability `p` such that if an agent *truly* holds `p`, they can achieve a *lower* expected inaccuracy score (by the lights of `p` itself!) by publicly reporting some *different* credence `c' ≠ p`. This creates a perverse incentive for the agent to misrepresent their genuine belief to appear more accurate. A strictly proper rule eliminates this incentive: honesty is the *only* optimal policy *relative to one's own sincere assessment of likelihoods*. This motivation appeals to a principle of epistemic integrity: a legitimate measure of accuracy should not systematically reward deception or create unavoidable internal conflict between truthfulness and apparent accuracy. This principle seems plausible even without assuming that `p` must be fully coherent; it addresses the consistency between belief and report for *whatever* degrees of belief the agent holds.
  2.  **Uniqueness and Stability:** Strict propriety guarantees that for any coherent credence function `p`, `p` is the *unique* minimizer of expected inaccuracy under `p`. This prevents situations where wildly different credence functions are deemed equally good *by their own lights*. Requiring this uniqueness ensures that the scoring rule is sensitive enough to distinguish different credences based on their own assessments, promoting stability and determinacy in epistemic evaluation. This avoids arbitrary ties and reinforces the idea that each credal state has a distinct accuracy profile.
  3.  **Accuracy as Calibration and Refinement:** Propriety can be seen as ensuring that the scoring rule rewards credences for being *well-calibrated* and appropriately *refined*. A credence `c` in a proposition `A` should be deemed maximally accurate (in expectation) only when `c` reflects the true long-run frequency of `A` in scenarios the agent deems relevantly similar (i.e., according to `p`). A non-proper rule might reward overconfidence or underconfidence even relative to the agent's own understanding of the world's structure. This motivation leans on an intuitive connection between degrees of belief and hypothetical frequencies, which doesn't strictly require full coherence but does favor alignment.
  4.  **Minimal Decision-Theoretic Commitment:** While propriety is *defined* using expectation, the core motivation (avoiding incentives for misrepresentation) and the dominance conclusion (inaccuracy in *every* world) operate at a different level. The dominance argument shows that incoherent credences are *objectively* worse off, point-by-point in every conceivable state of the world, compared to a coherent alternative. The role of propriety is primarily to *ensure* that coherent credences are never dominated in this way and that incoherent ones *are*. One could argue that avoiding such universal, point-wise dominance is a minimal, pre-theoretic requirement of rationality *before* committing to any specific decision theory like expected utility maximization. The propriety requirement ensures the scoring rule has the *structural feature* needed to generate this dominance result for incoherence, a feature motivated by the "no regret" principle.

  **Weighing the Scales: Verdict**

  The circularity charge against Joyce's accuracy-dominance argument is **serious but not fatal**. It correctly identifies that the *definition* of propriety relies on probabilistic expectation, creating an apparent dependency loop. This necessitates careful justification for restricting "legitimate" inaccuracy measures to proper ones.

  However, the **strongest independent motivation – the "No Regret" or "Anti-Manipulation" Principle – provides a compelling, non-question-begging rationale for propriety.** The requirement that a legitimate scoring rule should not systematically incentivize an agent to misrepresent their own sincere beliefs is a powerful constraint on what constitutes a fair measure of accuracy. This principle appeals to a fundamental ideal of epistemic honesty and internal consistency between belief and report. It stands independently of whether the agent's beliefs are already coherent. The arguments from uniqueness and calibration provide further supportive, though perhaps less decisive, grounding.

  Therefore, while the dominance argument cannot claim to derive probabilism from *utterly* pre-theoretic grounds devoid of *any* normative epistemic assumptions, it successfully derives it from a very plausible and independently defensible principle about epistemic integrity and the avoidance of perverse incentives (the "No Regret" principle), coupled with the intuitive force of avoiding universal accuracy domination. The restriction to proper scoring rules, motivated primarily by this principle, does not *presuppose* the full doctrine of probabilism; it presupposes a weaker norm concerning the alignment between sincere belief and truthful reporting under an accuracy measure. Joyce's argument thus escapes fatal circularity and stands as a robust, though not entirely presupposition-free, justification for probabilism. The circularity charge highlights a crucial justificatory step requiring careful defense, but it does not demolish the argument's core structure or its significant persuasive power.
