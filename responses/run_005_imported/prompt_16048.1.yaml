  Key for the Quinean comeback: Even with innatism, the mapping from stimuli to innate concepts could be indeterminate (e.g., "rabbit" vs. "rabbit-stage" could both align with innate structures). The Chomskyan might counter that universals constrain options, but Quinean could argue universals are themselves underdetermined by behavior. 

