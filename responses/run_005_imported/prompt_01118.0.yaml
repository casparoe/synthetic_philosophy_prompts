  For the post I wanna frame von Neumann as basically an intellectual ancestor of the modern AI-pause crowd -- like, even this hardnosed Cold War hawk lands on "selectively restrict the scary branches of tech" as the only real way to survive. Could you help me flesh that comparison out a bit? Specifically I want (1) a sense of the clearest place in the essay where he actually lays out that "restrict the dangerous branches, not the safe ones" policy, and (2) if he applied that same framework today, your best guess at which current technologies he'd most want on the restricted list. Just trying to get the history right before I put a bunch of words in a dead genius's mouth.
