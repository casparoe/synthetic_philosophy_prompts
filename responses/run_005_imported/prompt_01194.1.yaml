  ok so my friend and i got into this whole debate last night that never got resolved and its still bugging me. she was saying habit-tracker apps (habitica, streaks, duolingo guilt-tripping you with the owl, whatever) are basically just Ben Franklin's virtue project from the autobiography, just digitized. i said no way, that's missing the actual structure of what he did — he didn't track all 13 virtues at once, he rotated through them one a week (temperance first, then silence, then order...) specifically because he figured nailing the early ones would make the later ones easier, and he was marking faults with little dots in a homemade book, not racking up streaks or points. we argued about it for like an hour and got nowhere.

