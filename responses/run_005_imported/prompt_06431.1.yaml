  Also worth stressing: Spinoza's democracy isn't about enabling arbitrary choices. It's about minimizing irrational passions (like fear/hatred) that flourish under tyranny. When rulers monopolize power, they force subjects into passive obedience - directly harming their conatus. 

  ...Wait, did I fully address why Spinoza cares? Must emphasize his ethical aim: increasing joyful adequacy. Democracy serves this by enabling public reason. The user might wonder if a determinist can value anything, but Spinoza's ethics flows from necessity itself - what *is* (in essence) dictates what *ought* (in flourishing). 

  Should I mention his critique of monarchies? Yes - absolute rulers create systemic ignorance by suppressing speech. That actively prevents citizens from understanding necessity, trapping them in bondage. Democracy's relative transparency allows more people to grasp causes, aligning their actions with rational interests. 

  Final thought: the user's physics lens might make them receptive to Spinoza's universe-as-system view. Political systems are subsystems; democracy has feedback mechanisms (e.g., debate) that stabilize collective conatus. Tyranny is like friction dissipating energy into heat (passions). 

