answer: |-
  Your brother-in-law's argument is clever and biologically grounded, but it conflates evolutionary history with clinical pathology. While his reasoning highlights important nuances, medicine's use of "disorder" for lactose intolerance isn't arbitrary or culturally biased. Here's a principled basis for the gastroenterologist's position:

  ### 1. **The Core Issue: Harmful Dysfunction in Context**
     - **Wakefield's "Harmful Dysfunction" Framework**: Philosopher Jerome Wakefield defines disorder as *harm* caused by the *failure of a naturally selected function*. 
       - **Dysfunction**: Mammals evolved to digest lactose *during infancy* via lactase. The *natural* loss of lactase post-weaning isn't a "failure"—it's an evolved trait.  
       - **Harm**: Symptoms (bloating, diarrhea, pain) occur when lactase-deficient individuals consume lactose. This *is* harmful under ordinary dietary conditions in dairy-consuming societies.  
       - **Key Insight**: The harm arises from a *mismatch* between biology and environment. Medicine prioritizes current well-being over ancestral states.

  ### 2. **Why "Default Mammalian Condition" ≠ Clinically Irrelevant**
     - **Environmental Context Matters**: Biology isn't evaluated in an evolutionary vacuum. Human-created environments (e.g., dairy-based diets) alter what constitutes dysfunction.  
       - *Analogy*: Myopia isn't "abnormal" in evolutionary terms (ancestral humans rarely needed sharp distance vision), but it’s a disorder in modern society because it impairs driving, reading, etc.  
     - **Population-Specific Norms**: While lactase persistence is a minority trait globally, in societies where dairy is dietary staple, *inability* to digest it causes harm. Medicine tailors definitions to local contexts.

  ### 3. **The Flaw in His Argument: Equating "Ancestral" with "Optimal"**
     - **Naturalistic Fallacy**: Your brother-in-law implies that what’s evolutionarily ancestral is inherently "correct." But evolution optimizes for reproductive fitness, not modern well-being. Many ancestral traits (e.g., propensity for fat storage) are maladaptive today.  
     - **Ignoring Symptomatology**: He dismisses the *clinical reality* of symptoms. If lactose ingestion causes distress, labeling this a "disorder" isn't parochial—it’s descriptive of bodily dysfunction *in that context*.

  ### 4. **Is Medicine Smuggling in Values? Partially, But Reasonably**
     - **Values Are Inevitable**: All disease concepts involve value judgments (e.g., pain/discomfort = undesirable). Medicine explicitly incorporates patient well-being as a goal.  
     - **Why It’s Not *Merely* Subjective**:  
       - **Boorse’s Biostatistical Theory**: Even if lactose intolerance is statistically common globally, it still represents a *subnormal functional ability* (digestive capacity) relative to species-typical goals (nutrient processing).  
       - **Pragmatic Justification**: Diagnosing it as a disorder enables access to treatments (e.g., lactase supplements), dietary adjustments, and insurance coverage—improving quality of life.

  ### 5. **A Middle Ground: Disorder vs. Normal Variation**
     - **Spectrum Thinking**: Lactase non-persistence is normal genetic variation, not inherently pathological.  
     - **Clinical Threshold**: It becomes a "disorder" *when symptomatic in a dairy-exposed environment*. For asymptomatic individuals (or in non-dairy cultures), it’s merely a trait.  
       - *Example*: In East Asia (where lactose intolerance prevalence is >90%), diagnosis focuses only on symptomatic cases.

  ### Conclusion
  The gastroenterologist’s use of "disorder" is defensible: **lactose intolerance is a harmful dysfunction *in environments where dairy is consumed***. Your brother-in-law is correct that lactase persistence is the derived trait, but he errs in assuming evolutionary history nullifies present-day harm. Medicine’s framework isn’t "parochial"—it’s contextually pragmatic, prioritizing relief from preventable suffering. The dispute isn’t *purely* verbal; it reflects tensions between descriptive biology and normative clinical practice. However, by acknowledging both perspectives (evolutionary norm vs. functional impairment in context), you might find common ground: lactose intolerance is biologically "normal" but clinically significant *if symptomatic*. 

  *P.S.* Your unease about "a biological fact doing too much philosophical work" is astute. Evolutionary biology describes *what is*, not *what ought to be valued* in healthcare. Medicine bridges that gap with patient-centered goals.
