  We are ranking seven proposed resolutions to the St. Petersburg paradox. The goal is to sort them into tiers (S, A, B, C, D) by how successfully each one dissolves the paradox on its own terms.

  The seven resolutions are:
  1. Bernoulli-Cramer utility curvature: Uses diminishing marginal utility (log or square root) to make expected utility finite.
  2. Buffon's moral-impossibility cutoff: Disregards extremely low probabilities (below a threshold) to avoid infinite expectations.
  3. Bounded utility per Menger: Requires that the utility function is bounded above to avoid the paradox and its recurrence in super-Petersburg games.
  4. Prospect-theoretic probability weighting: Uses probability weighting (overweighting small probabilities, underweighting large) to make the value finite.
  5. Peters's ergodicity/time-average reframing: Evaluates by time-average growth rate instead of expectation value.
  6. Finite-bankroll unrealizability: Points out that no real counterparty has an infinite bankroll, so the game isn't feasible.
  7. Rejecting expected-value maximization outright: Argues that expected value (or utility) maximization isn't the right norm for such decisions.

  Tier definitions:
  - S: Essentially resolves the puzzle (completely dissolves the paradox without relocating it or changing the question).
  - A: Addresses the core issue effectively but might have some limitations or be less general.
  - B: Partially addresses the issue but leaves some aspects unresolved or introduces new problems.
  - C: Only relocates the paradox or changes the question without fully resolving it.
  - D: Doesn't meaningfully address the core issue.

  Analysis:

  1. **Bernoulli-Cramer utility curvature**: This was the first major resolution and it makes the expected utility finite by using a concave utility function (log or square root). However, Menger later showed that if the utility function is unbounded, we can create a new paradox (super-Petersburg) by scaling up the payoffs. So it doesn't completely block the paradox. Thus, it's not S-tier. But it was a major step and does resolve the original paradox. We might put it in A or B.

  2. **Buffon's moral-impossibility cutoff**: This approach ignores probabilities below a threshold. It avoids the infinite expectation by truncating the series. However, it's arbitrary (how to set the threshold?) and doesn't address the fundamental issue of unbounded expectations. It's more of a practical fix. Probably C-tier.

  3. **Bounded utility per Menger**: Menger argued that utility must be bounded above to avoid the paradox. This is a strong solution because it prevents the recurrence in super-Petersburg games. It directly addresses the mathematical root of the infinity. This is a candidate for S-tier.

  4. **Prospect-theoretic probability weighting**: Prospect theory weights probabilities nonlinearly (overweighting small probabilities and underweighting large ones). This can make the value finite. However, it doesn't necessarily bound the utility and might be seen as changing the model (from expected utility to prospect theory). It's a different framework, but it does resolve the paradox. However, it might be considered a relocation (changing the decision model). We might put it in A or B.

  5. **Peters's ergodicity/time-average reframing**: Peters argues that we should use time-average growth rates (ergodicity) instead of expectation values. This reframing gives a finite value. But it changes the question: it's no longer about one-shot expectations but about repeated play. For a single play, it might not apply. It's a reframing, so it changes the terms. This might be B or C.

  6. **Finite-bankroll unrealizability**: This is a practical observation: the game as stated requires an infinite bankroll, which is impossible. So in reality, the expected payout is finite. It dissolves the paradox by noting it's not realizable. But it doesn't address the theoretical puzzle. It's more of a deflationary move. We might put it in C.

  7. **Rejecting expected-value maximization outright**: This is radical: it says that expected value maximization is not the right norm for decisions under uncertainty. It might suggest alternative norms (e.g., minimax, satisficing). This avoids the paradox by rejecting the framework. But it doesn't resolve it within the expected utility framework. It's changing the question. This could be C or D.

  Tier Assignments:

  - S: Bounded utility per Menger. This is the only solution that mathematically blocks the infinity by a fundamental requirement (bounded utility) and prevents recurrence. It directly addresses the core mathematical issue.

  - A: 
     - Bernoulli-Cramer utility curvature: It resolves the original paradox and is historically significant. However, it fails for super-Petersburg games. So it's not S, but it's a major step and works for the original.
     - Prospect-theoretic probability weighting: It resolves the paradox within a descriptive model of decision making. It doesn't require bounded utility but uses a different valuation. It's a valid resolution but in a different framework.

  - B:
     - Peters's ergodicity/time-average reframing: It changes the framework to repeated games and growth rates. It's an interesting alternative but not a resolution within the classical one-shot setup. It's a reframing that works for repeated play.

  - C:
     - Buffon's moral-impossibility cutoff: It's an ad hoc fix. The threshold is arbitrary and doesn't address the theoretical core.
     - Finite-bankroll unrealizability: It's a practical constraint, but the paradox is a theoretical one. It doesn't resolve the theoretical puzzle.
     - Rejecting expected-value maximization outright: This rejects the framework. It's a way out but doesn't resolve the paradox within the expected utility framework.

  - D: None.

  But note: Rejecting expected-value maximization might be more radical and could be seen as not addressing the core issue (if the core issue is within the expected utility framework). However, if we consider the core issue to be "why do people not pay a large amount for the game?" then rejecting expected value maximization does provide an answer: because they don't use that rule. But it doesn't explain what rule they should use. It might be C.

  However, let's reconsider:

