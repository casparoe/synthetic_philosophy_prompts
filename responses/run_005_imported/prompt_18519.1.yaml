  B-tier:
     - Peters's ergodicity: It's a reframing that works for repeated games and is gaining traction, but it's a change of perspective.

  C-tier:
     - Buffon: too arbitrary.
     - Finite bankroll: practical but not theoretical resolution.
     - Rejecting expected value: it's a rejection, not a resolution.

  Now, for the least confident placement: I am least confident about where to put "rejecting expected-value maximization outright". It could be argued that if we reject the norm, then the paradox doesn't arise. But is that a resolution? It avoids the paradox by denying the setup. That's more of a sidestep. I put it in C, but maybe it should be D? However, it does "dissolve" the paradox by saying that the decision rule that leads to the paradox is not the one we should use. But it doesn't provide a clear alternative that resolves the paradox within the same context. So C seems appropriate.

