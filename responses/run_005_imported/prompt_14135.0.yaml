answer: |-
  You've zeroed in on a profound tension at the heart of convention theory. My verdict is clear: **Skyrms's evolutionary account fundamentally undermines Lewis's requirement for *strict arbitrariness* as a *defining feature* of convention, revealing it as a contingent artifact of Lewis's rationalist framework rather than an essential property.** Here's why:

  1.  **Lewis's Arbitrariness as Rational Symmetry:** For Lewis, arbitrariness flows directly from the symmetry of the coordination problem *and* the rationality/common knowledge assumptions. Rational agents, facing multiple equally good Nash equilibria (coordination equilibria), need a mutually known reason to pick one. The convention *is* that arbitrary choice. The "could equally have taken hold" is crucial because, under perfect rationality and common knowledge, *no equilibrium has an inherent advantage* – selection is purely a matter of mutual expectation.

  2.  **Skyrms: Breaking Symmetry Through Dynamics:** Evolutionary dynamics (replicator, reinforcement learning) operate differently. They don't require foresight or mutual belief. Crucially, these dynamics are highly sensitive to:
      *   **Initial Conditions:** Small, random fluctuations in early populations can tip the system towards one equilibrium basin over another.
      *   **Basin Size & Attraction:** Equilibria have different-sized "basins of attraction." An equilibrium with a larger basin is more likely to be reached and harder to escape, even if all are equally "good" payoffs. Stochastic stability (Young) identifies the state(s) most resistant to random mutations/errors over the *longest* time – often *not* all equilibria are equally stable.
      *   **Path Dependence:** The history of the process matters. Getting "locked in" to one equilibrium early can make alternatives virtually unreachable, even if they were initially possible.
      *   **Payoff Sensitivity (Sometimes):** While many Skyrms models show symmetry-breaking even with identical payoffs, dynamics can also amplify tiny payoff differences, making one convention *significantly* more likely.

  3.  **The Crux: Stochastic Stability ≠ Arbitrariness:** This is where Lewis's definition cracks. Peyton Young's concept of stochastic stability shows that within an evolutionary framework, **one coordination equilibrium is often *vastly* more likely to emerge and persist than its rivals** when considering the noise inherent in real-world dynamics (mutations, experimentation, errors). This is the *opposite* of arbitrariness. While multiple equilibria *exist*, the dynamics make one (or a small subset) *highly probable*. The "could equally have taken hold" becomes empirically false in many evolutionary models – the dynamics make alternatives *improbable*.

  4.  **Vindication on Core Function, Rejection on Mechanism & Essential Property:**
      *   **Vindication:** Skyrms *brilliantly* vindicates Lewis's core insight that *convention-like regularities can emerge from purely decentralized interactions* to solve coordination problems. He shows this is possible, even robust, without high-cognitive-load assumptions like common knowledge and perfect rationality. The *function* of conventions (solving coordination problems) and their *equilibrium nature* are powerfully confirmed.
      *   **Rejection of Mechanism:** Skyrms completely replaces Lewis's rationalistic, expectation-based mechanism with a dynamic, history- and noise-dependent process.
      *   **Rejection of Strict Arbitrariness as Essential:** This is the critical point. By demonstrating that dynamics often *non-arbitrarily* select one equilibrium as the overwhelmingly probable outcome, Skyrms shows that Lewis's strict arbitrariness is **not a necessary feature of convention-like phenomena emerging from decentralized processes.** Arbitrariness might hold in highly idealized, perfectly symmetric rational models, but it's fragile and often absent in more realistic dynamic models. The requirement for strict arbitrariness reflects Lewis's rationalist starting point, not an inherent property of the phenomenon.

  **In Conclusion:** Skyrms doesn't merely swap out the mechanism within Lewis's definition. He demonstrates that the mechanism *itself* changes the nature of the phenomenon. **The evolutionary dynamics often render Lewis's strict arbitrariness empirically inaccurate.** Conventions *can* emerge without it. While multiple potential equilibria exist abstractly, the dynamics frequently make one convention highly probable and persistent, undermining "could equally have taken hold" as a defining *necessity*. Skyrms forces us to see conventions as **dynamically stabilized patterns** solving coordination problems, often *shaped* by historical accidents and structural features of the dynamics, rather than as *essentially arbitrary* solutions chosen solely by mutual expectations among rational agents. Lewis's arbitrariness is a feature of his *model*, not a universal feature of the *phenomenon* he sought to describe. Skyrms reveals a broader landscape of convention-like stability where strict arbitrariness is a special case, not the rule.
