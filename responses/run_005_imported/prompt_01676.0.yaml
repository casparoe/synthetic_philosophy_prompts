  Check if technical terms need simplification. Instead of "confirmation theory," use "what counts as evidence." Replace "Bayesian" with "how much evidence" something provides. Keep it accessible. Also, ensure characters listen and build on each other's points, like Alex bringing up the universe of objects, which Jordan addresses.

