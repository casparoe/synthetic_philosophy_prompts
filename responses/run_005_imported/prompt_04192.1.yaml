answer: |-
  This is a beautifully sharp test case that cuts to the heart of both theories. Let's dissect each account in its more sophisticated form and see how it fares with your grandmother scenario, paying close attention to whether they need illicit imports.

  **1. Hume's Conventionalism (Refined):**

  *   **Core Commitments:** Hume grounds promise-keeping in *utility* derived from a *convention*. Promises are an "artificial virtue."
      *   **Convention:** Society tacitly agrees to use certain words ("I promise") as signals that create binding expectations, enabling mutually beneficial cooperation that wouldn't be possible otherwise (e.g., delayed exchanges). This convention solves coordination problems.
      *   **Obligation Source:** The obligation arises *solely* from the utility of the *system* of promising. Keeping promises maintains the stability and effectiveness of this socially beneficial convention. Breaking a promise primarily harms this system by undermining general trust and making future cooperation harder. The obligation is thus *instrumental* and *system-dependent*.
      *   **"Own Terms" Nuance:** Hume acknowledges the psychological "sentiment" of obligation we feel, but argues this sentiment *arises from* our education within and participation in the beneficial convention. It's not a natural, pre-social feeling.

  *   **Application to Grandmother Case:**
      *   **Systemic Harm?** As you noted, the promise was made and broken in absolute secrecy. No one else knows it existed. Breaking it provides no example others can follow, erodes no general trust, and damages no cooperative expectations. It doesn't destabilize the convention.
      *   **Utility?** Keeping the promise provides no discernible social utility – the grandmother is gone, no one benefits from the act itself. Breaking it causes no social harm. The act is isolated from the cooperative system the convention exists to support.
      *   **Does Hume Explain the Obligation?** **No, not on its own terms.** Hume's account struggles profoundly here. The core elements justifying the obligation – systemic utility and the prevention of systemic harm – are absent. A Humean might appeal to:
          *   *Habit/Internalization:* You feel an obligation because you've internalized the convention's rules. But this feeling *isn't the source* of the obligation for Hume; it's a *consequence* of the system's utility. Explaining the *wrongness* by pointing to the feeling reverses Hume's causality and smuggles in an intrinsic wrongness he explicitly denies.
          *   *The "Sensible Knave" Problem:* Hume himself discussed the "sensible knave" who breaks rules secretly when it benefits him without harming the system. Hume admits the knave acts *reasonably* from a purely self-interested perspective but hopes moral sentiment will prevail. Applying this to your case: breaking the secret promise *is* the knave-like action. On pure Humean grounds, it's hard to condemn it as *morally wrong*; it might merely be imprudent if it risks discovery or weakens *your own* future commitment-keeping habit. **Conclusion:** Hume's conventionalism struggles to find a *moral* reason to keep the promise in this case without illicitly relying on either unexplained internal feelings of obligation or importing a non-conventional duty (like respect for the dead).

  **2. Scanlon's Contractualism (Principle F - Refined):**

  *   **Core Commitments:** Scanlon grounds the wrongness of breaking promises in a deeper moral principle: the **Principle of Fidelity (Principle F)**.
      *   **Principle F:** "If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A’s not doing X); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then, in the absence of special justification, A must do X unless B consents to X’s not being done." (*What We Owe to Each Other*, Ch. 7)
      *   **Obligation Source:** The wrongness lies in the *manipulative abuse of trust*. By intentionally invoking the practice of promising (which relies on mutual recognition of Principle F), you deliberately create a specific expectation in B and invite B to rely on you. Breaking the promise is a "free ride" on the trust you solicited – you gain the benefit of B's reliance (or their peace of mind) without fulfilling your end, acting in a way B could not reasonably reject.
      *   **"Own Terms" Nuance:** It's not primarily about the *consequences* of breaking trust (like undermining the practice generally, though that can be a factor), but about the *wrong done to the specific promisee* through the *act* of creating and then betraying an invited reliance. It's a *relational* wrong.

  *   **Application to Grandmother Case:**
      *   **Trust & Reliance Created:** At the moment of promising, you *did* intentionally create an expectation in your grandmother and invited her trust. You gave her assurance and peace of mind in her final moments based on your commitment. She *did* rely on that promise for her final wishes and emotional state before death.
      *   **The Wrongness:** Breaking the promise *now* is a betrayal of the *trust you actively solicited and she granted*. It frustrates the reliance *she placed in you at that time*. Scanlon argues the wrong is located in the *nature of that past interaction* and the *reason* you had to act based on the assurance you gave. You gained a benefit (fulfilling her wish for assurance) without paying the cost (performing the act).
      *   **Death's Impact:** Scanlon addresses the issue of the promisee's death. He argues Principle F still applies because the obligation was *incurred* at the time the promise was made and relied upon. Fulfilling the promise posthumously respects the *past act of trust* and the *reliance that was validly placed*. Not doing so is failing to discharge a duty *owed to her*, stemming from the past interaction, even though she can't *now* be disappointed. It disrespects the agency and trust she exercised *while alive*.
      *   **Does Scanlon Explain the Obligation?** **Yes, largely on its own terms.** Scanlon's framework *can* explain the wrongness without needing to import external elements *if* we accept his core argument: that the wrong is inherent in the *past act* of creating and betraying invited reliance/trust. He doesn't need ongoing expectations in the promisee *after* the promise is made, nor does he primarily rely on systemic harm. The focus is on the *past relationship* and the *reason-giving force* of the assurance provided. While the *harm* of disappointment is absent *now*, the *wrong* of betraying the solicited trust *remains*.

  **Comparison & Evaluation:**

  1.  **Hume's Shortfall:** The grandmother case highlights the core limitation of Hume's strict conventionalism. Its grounding in *systemic utility* and the *prevention of harm to the convention* leaves it unable to explain obligations arising from purely private, non-cooperative, one-off promises where no systemic consequences exist. It struggles to find a genuinely *moral* reason specific to this promise, tending to reduce it to prudence or habit.
  2.  **Scanlon's Strength:** Scanlon's Principle F, focusing on the *relational wrong* inherent in betraying *specifically invited trust*, provides a much more direct and plausible explanation. The obligation arises from the *past interaction* with the grandmother herself. Her death changes her *current state* but not the *moral fact* of the obligation incurred *to her* when she was alive and trusting. The wrong is in the *character of your action* – breaking faith with someone who trusted you based on your explicit assurance.
  3.  **Potential "Import" Challenge for Scanlon?** One might argue Scanlon *implicitly* imports the idea of respecting the *will* or *wishes* of the deceased. However, Scanlon would likely counter that Principle F explains *why* we have a duty *to respect those wishes* in this context: *because* we solicited reliance on our promise to fulfill them. The duty stems from the promise, not directly from her wishes alone. He grounds the duty to respect wishes *in this specific case* on the promise made.
  4.  **Does the Case Discriminate Cleanly?** **Yes, it does.** It cleanly separates the systemic/social focus of Hume from the relational/assurance-based focus of Scanlon. The case eliminates the systemic consequences Hume relies on while preserving the core elements Scanlon relies on (the past act of creating/inviting trust and reliance).

  **Conclusion:**

  While both theories face challenges, **Scanlon's contractualist account (Principle F) emerges significantly stronger in explaining the residual obligation in your grandmother case.** It provides a coherent, non-consequentialist explanation grounded in the specific past relationship and the wrong of betraying solicited trust, even after the promisee's death. Hume's conventionalism, relying on the utility of the social practice, struggles to find a foothold when the promise is isolated from any social system or cooperative consequence. Your intuition and your friend's position – that breaking the promise would still be wrong – are better captured by Scanlon's framework. The obligation persists because the promise created a specific moral debt *to your grandmother*, incurred at her bedside, which her death does not erase. Breaking it is a failure to honor that debt and the trust she placed in you.
