prompt: |-
  I'm taking an upper-level seminar on formal epistemology this semester, and we've just wrapped up a unit on David Lewis's account of objective chance. We worked through "A Subjectivist's Guide to Objective Chance" and then, more hastily than I would have liked, the three papers that Lewis, Michael Thau, and Ned Hall published together in the same 1994 issue of Mind on what Lewis had by then nicknamed the "big bad bug" for his own view.

  The problem, as I understand it, is that under Humean Supervenience the chance of an event at a time is fixed by the entire pattern of particular facts across all of history, future included, so there are "undermining" futures that the very chance distribution at that time assigns positive probability to, but which, were they to occur, would make that distribution false. The proposed fix, the New Principle, has you conditionalize on the complete chance theory of the world rather than on a bare, single chance hypothesis. My professor sketched this quickly and promised to circle back before our final papers are due, but the semester is almost over and I doubt we'll get there, so I'd like to think through for myself whether this is a principled repair or a technical patch bought at the cost of the view's original appeal.

  Could you write me a dialogue between two philosophers of probability who disagree about exactly this? One should be a committed Lewisian about chance who thinks the New Principle fully rescues deference to chance without sacrificing Humean Supervenience; the other should be a primitivist who holds that single-case objective chances are an irreducible feature of the world, not something read off the total pattern of history, and who argues that the very need for a patch shows Humean chance was never suited to ground the Principal Principle to begin with. I'd like both to be genuinely strong: the Lewisian should say something substantive in defense of the New Principle rather than simply restating it, and the primitivist should explain concretely how treating chance as primitive dissolves the undermining worry in the first place (and concede whatever that move costs elsewhere, such as making chance harder to know from frequencies) rather than just handing the Humean's problem back to them. Please have them respond directly to each other's points in sequence rather than delivering parallel monologues, and feel free to let them fight over a concrete case, such as a long run of decays in a radioactive sample, if it helps keep the disagreement from floating off into pure formalism.
reasoning: |-
  We are writing a dialogue between two philosophers: Lewisian (L) and Primitivist (P). 
   The Lewisian defends Humean Supervenience (HS) and the New Principle (NP) as a fix for the undermining problem. 
   The Primitivist argues that objective chances are primitive and irreducible, and that the NP is a patch that doesn't address the root problem.

   Setting: They are at a philosophy conference, during a coffee break, and they start discussing the undermining problem.

   Concrete case: Consider a radioactive sample with a half-life of 1 hour. At t0, the chance of decay of a particular atom in the next hour is 0.5. But the Humean says that the chance at t0 supervenes on the entire history, including the future. So, if the entire history (including the future) is such that the frequency of decay in this sample is, say, 0.3, then the chance at t0 would be 0.3. But the chance distribution at t0 (if it were 0.5) would assign positive probability to a future where the frequency is 0.3 (which would then make the chance at t0 be 0.3, not 0.5). This is undermining.

   The New Principle (NP) says: instead of conditioning on the chance of the event at t0 (C) and the history up to t0 (H), we condition on the entire chance theory T (which specifies the chance at every time for every proposition) and H. Then we use:

     P(A | T, H) = T(A)

   But note that T is a theory that says what the chances are at every time. Since T is a function of the entire history (including the future), T is determined by the world. So, conditional on T and H, the chance of A is T(A). And T is such that it is consistent with the chances it assigns at each time.

   The Primitivist will argue that chances are not determined by the entire history, but are instead primitive and exist at the time independently of the future.

   Let's write the dialogue accordingly.
answer: |-
  **Characters:**  
  - **Lewisian (L):** Defends Humean Supervenience (HS) and the New Principle (NP) as a principled fix.  
  - **Primitivist (P):** Argues that objective chances are irreducible and that the NP is an ad hoc patch.  

  **Setting:**  
  *Philosophy department lounge. L and P are debating over coffee after a seminar on Lewis’s “big bad bug.”*  

  ---

  **P:** Let’s cut to the chase: Lewis’s New Principle is a band-aid. The undermining problem proves Humean chance *can’t* ground the Principal Principle (PP). Take a radioactive atom decaying now. Under HS, its chance at *t* isn’t a real feature of *t*—it’s fixed by the *entire* history, future included. So, the chance distribution at *t* might assign positive probability to futures where the actual frequencies *contradict* that very distribution! That’s not deference to chance; it’s self-sabotage.  

  **L:** But the NP solves this cleanly. Instead of conditioning on a single chance hypothesis like *ch_t(A) = x*, we conditionalize on the *entire chance theory* *T* of the world. *T* tells us the chances at every time, given the global pattern. So, for proposition *A*, the New Principle says:  
  > **NP:** Your credence in *A* should be: **Cr(A | T ∧ H_t) = T(A)**  
  (Where *H_t* is history up to *t*, and *T* is the true chance theory.)  
  The NP respects deference while acknowledging that chances are holistic under HS.  

  **P:** Holistic? More like bootstrapped! *T* itself depends on the future. Suppose we have a sample of radium-226. At *t*, the Humean says *ch_t*(decay in 1hr) = 0.5. But *T* assigns positive probability to futures where, say, only 30% of atoms decay in this sample. If that future occurs, the *actual* global pattern—and thus *T*—would imply *ch_t* was *never* 0.5! The NP dodges this by forcing you to conditionalize on *T*, but *T* is only “true” if the undermining future *doesn’t* happen. It’s circular.  

  **L:** Not circular—self-locating. *T* encodes how chances evolve with history. Under the NP, when you conditionalize on *T*, you’re holding fixed that *T* is the *correct* theory for *all* times. So, for the radium case:  
  - If *T* says *ch_t*(decay) = 0.5, then *by definition*, futures where decay frequencies “undermine” this aren’t compatible with *T* being true.  
  - The NP ensures your credence in *A* tracks *T*’s prediction *given that T is true*. Undermining futures aren’t live options once you’ve conditionalized on *T*.  

  **P:** That’s my point! You’ve *defined away* undermining by fiat. But why should I trust *T*? For the primitivist, chances *at* *t* are fixed by local, irreducible propensities—say, the atom’s quantum mechanical properties *at* *t*. So *ch_t*(decay) = 0.5 is a fact about *t*, period. The future can’t “undermine” it because chances aren’t made true by future frequencies. The PP works *without* the NP: my credence in decay is 0.5, full stop. No self-undermining futures to worry about.  

  **L:** But what explains *why* the propensity is 0.5? With HS, chances reduce to the mosaic of events—frequencies, symmetries, laws. Your primitivism leaves chance metaphysically mysterious. How do you even *know* the chance is 0.5?  

  **P:** I’ll pay that epistemic price! Primitivism makes chance *robust*: it’s a fundamental feature of reality, like mass or charge. When I say *ch_t(A) = x*, that’s a fact independent of future history. So, in the radium case:  
  - Even if only 30% decay, that doesn’t retroactively change *ch_t* at *t*. It just means the *actual outcome* diverged from the *chance*.  
  - That’s no weirder than flipping a fair coin 100 times and getting 55 heads. The frequency isn’t the chance.  

  **L:** But then you lose the explanatory power of HS! Why *should* we expect frequencies near 0.5 in long runs? For the Humean, it’s because chances *are* patterns in the mosaic. For you, it’s a brute coincidence.  

  **P:** Not brute—governed by physical law. Quantum mechanics fixes propensities for decay. Frequencies *evidence* chances but don’t *constitute* them. Whereas for you, the NP *needs* the future to make *T* true *now*. But if I’m at *t*, how can I conditionalize on *T* when *T* depends on facts *beyond* *t*? The NP requires omniscience about the future!  

  **L:** Not omniscience—rational deference. *T* is a hypothesis you *update on*. At *t*, you have partial knowledge of history (H_t) and theories of chance. The NP says: *if* you knew *T*, you’d set Cr(A) to *T*(A). In practice, you approximate *T* from frequencies up to *t*—just like science! Primitivism doesn’t avoid this; you still need evidence to know chances.  

  **P:** But your “evidence” is ontologically loaded! For you, past frequencies constrain *T* because *T* supervenes on the whole mosaic. For me, past frequencies are *fallible evidence* for primitive chances. The difference is stark when we consider undermining:  
  - Under primitivism, no possible future makes *ch_t(A) = x* false, because *ch_t* is settled at *t*.  
  - Under HS + NP, futures that “undermine” *T* are *incompatible* with *T*—so they’re excluded by fiat. That’s not deference; it’s stipulation.  

  **L:** It’s not stipulation—it’s coherence. The NP is the *only* way to reconcile HS with chance deference. Without it, the PP *would* be inconsistent. But with it, we get a unified account: chances reduce to the mosaic, and rational credence reduces to chances. What does primitivism offer besides mystery?  

  **P:** A straightforward account of why undermining is impossible! If chances are primitive, they can’t be “undermined” by outcomes they govern—any more than Newton’s laws can be “undermined” by a falling apple. The PP needs no “New” patch because there’s no bug: my credence in *A* is *ch_t(A)*, and that’s that. The cost? I can’t *reduce* chance to frequencies. But that’s not a bug—it’s respecting chance’s fundamentality.  

  **L:** And yet, your “fundamental” chances make probabilistic laws inexplicable. Why does radium have a ~0.5 half-life? For HS, it’s because decay events *in fact* form a certain pattern. For you, it’s magic.  

  **P:** No—it’s physics! The NP saves HS only by making chance deference parasitic on global facts we can’t access until history’s end. That guts the PP’s epistemic force. I’ll take primitive chances and a functional PP over a “rescued” one that requires a crystal ball.  

  **L:** Then we agree to disagree. But remember: Lewis’s project was to ground everything in the mosaic. The NP isn’t a retreat—it’s the key to making chance both objective and Humean.  

  **P:** And *my* project is to show that some things—like chance—refuse to be grounded. The need for the NP? Proof that they’re right.  

  ---  

  **Key Disagreements Recap:**  
  - **L’s defense of NP:** It resolves undermining by conditionalizing on the *entire chance theory T*, ensuring deference while respecting HS’s holism. Undermining futures are excluded because they contradict *T*.  
  - **P’s primitivist dissolution:** Chances are irreducible properties settled at *t*, so no future can “undermine” them. The PP requires no patch, but primitivism makes chance epistemically opaque.  
  - **Trade-offs:**  
    - *HS + NP*: Chances are reducible and explanatory but require deference to unobservable global facts.  
    - *Primitivism*: Chances are local and PP-compatible but metaphysically "heavy" and harder to know.
