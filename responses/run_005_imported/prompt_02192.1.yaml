answer: |-
  You've hit on two major interpretive knots in Aquinas' text that scholars still debate. Let's untangle them step by step:

  **1. The Two Arguments in "I Answer That"**
  Your instinct is correct – Aquinas *is* making two distinct but related arguments:

  *   **Core Double Effect (Argument A):** This establishes the *general permissibility* of an act with double effects when:
      - The bad effect (killing) is *praeter intentionem* (beside the intention)
      - The good effect (saving life) *is* intended
      - The act itself is good/neutral (self-defense)
      - Proportionality: The good effect sufficiently justifies permitting the bad effect, and the force used is moderate/necessary.

  *   **Restriction on Intending Death (Argument B):** This imposes a *further limitation* specifically on *intending death itself*, even in self-defense. It relies on his prior argument (Article 3) that killing is only lawful when performed by public authority for the common good (punishment/just war).

  **Why both? How they connect:**
  *   Argument A licenses the *act* of self-defense that *results* in death, provided death isn't intended and proportionality holds. A private citizen can *do* something foreseeably lethal.
  *   Argument B forbids the private citizen from *intending the death itself* as part of their plan. Their intention must *only* be self-preservation. Death must remain an unintended, albeit foreseen, consequence of repelling the attack.
  *   Public authorities (soldiers/judges) are exempt from Argument B *only* because their intention to kill is *subordinated* to the public good (common defense/justice), not private self-preservation. Their act falls under the exception established in Article 3.

  **The key distinction Aquinas is drawing:** A private citizen can licitly *perform an act of proportionate self-defense* that foreseeably *causes* death, but they cannot licitly *choose death as their means* or *make death their goal*. Only public authorities can do the latter, *if* it serves the common good.

  **2. The "Means vs. Side-Effect" Question & Modern DDE**
  You are absolutely right to notice its absence. **The explicit "means vs. side-effect" distinction is NOT present in this Aquinas text.** Here's the breakdown:

  *   **Aquinas' Focus:** His distinction is purely **intentional**: *intended* (intentio) vs. *beside the intention* (praeter intentionem). The moral species is defined by the object of the *will*. He cares about *what the agent is choosing/willing*, not the causal role of the effect.
  *   **Proportionality is Key:** The main constraint beside intention is *proportionate force*. Using "more than necessary violence" makes the act unlawful, regardless of intention. This *implies* a rejection of lethal force when non-lethal would suffice, but doesn't explicitly frame it as "don't use the bad effect as a means."
  *   **The "Means" Condition is a Later Development:** The distinction between effects that are *means* to the end and effects that are mere *side consequences* was developed **later**, primarily by **Scholastic commentators (like Cajetan)** in the 16th century and refined significantly in the 20th century (e.g., by Germain Grisez, John Finnis). This was done to address ambiguities and harder cases that arise when applying Aquinas' core intentional distinction.
  *   **Modern DDE vs. Aquinas' Core:** The standard modern formulation of DDE (often 4 conditions) typically includes:
      1.  The act itself must be morally good or neutral.
      2.  The bad effect must not be intended (only permitted).
      3.  The good effect must not be *produced by means of* the bad effect.
      4.  There must be a proportionate reason for permitting the bad effect.
      **Condition #3 ("not as a means") is the critical addition not explicitly found in Aquinas' text here.** It provides a crucial tool for analyzing cases like the footbridge trolley problem.

  **Implications for Trolley Problems:**

  1.  **Aquinas' Text Alone is Insufficient:** Relying *solely* on this specific Aquinas passage to resolve the switch vs. footbridge distinction is **problematic**. He provides the core intentional distinction and proportionality, but lacks the explicit "means" criterion that modern ethicists use to explain *why* pushing the man is different (his death *is* the means of stopping the trolley).
  2.  **The "Doctrine" Has Evolved:** When people cite the "Doctrine of Double Effect" in trolley debates, they are almost always invoking the **modern, elaborated doctrine** (with the "means" condition), *not* Aquinas' text in isolation. This doctrine *draws inspiration* from Aquinas and claims him as its originator, but it incorporates later developments to handle complexities he didn't explicitly address.
  3.  **Does it Overextend Aquinas? Yes, but...** Strictly speaking, **yes**, the modern DDE used in trolley problems does more philosophical work than *this specific text* can support alone. It relies on conceptual tools (the means/side-effect distinction) developed later to refine and apply Aquinas' core insight about intention. However, proponents argue this development is a *logical extension* and clarification of Aquinas' principles, making them applicable to new scenarios. Critics argue it sometimes goes beyond his framework.

  **Conclusion:**

  You've identified a crucial nuance. Aquinas' Article 7 provides:
  -   The **foundation** for DDE: The intentional distinction (`praeter intentionem`) and proportionality.
  -   A **significant restriction**: Private citizens cannot *intend* death, only public authorities can (under specific conditions).

  It does **not** explicitly provide:
  -   The modern "means vs. side-effect" distinction central to trolley problem resolutions.

  Therefore, the "Doctrine of Double Effect" invoked in contemporary ethics is a **developed philosophical framework *inspired by* Aquinas**, not merely an exegesis of this single article. While Aquinas provides the core ideas about intention and proportionality, the explicit "means" condition is a later addition necessary to handle cases like the footbridge, meaning the modern doctrine *is* doing more work than the original text alone supports. Your rabbit hole led you to a very real and important historical-philosophical insight!
