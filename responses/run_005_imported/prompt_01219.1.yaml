answer: |-
  The bellows breathed. Not air, but heat. A shimmering, molten breath that rippled the heavy air above the forge pit. Old Man Li, face streaked with soot and sweat like charcoal tears, fed the beast. He didn’t look at the shape cooling on the stone slab beside him.

  Kai stood in the doorway, the cloying scent of hot metal and ash filling his nostrils, replacing the phantom scent of camphor and sickness that had clung to his father’s room for weeks. Two months. Two months since the silence fell, thick as forge dust.

  He’d come seeking… something. Not comfort, not really. After the funeral chants faded, hollow words about ancestors and peaceful rest, Kai had found himself adrift. Then he remembered Master Zhuang’s words, shared by his friend, the scholar. They hadn’t settled; they buzzed, like a trapped fly against glass. The freedom of the skull. The basin drumming. The forge.

  "Uncle," Kai said, his voice rough, unused.

  Li didn’t turn. He plunged a pair of long tongs into the coals, pulling out a lump of iron glowing with an inner sun. "Kai. You look thin. Like a blade left too long in the quenching trough."

  "My father…" Kai began, then stopped. What was there to say? *He’s gone* felt inadequate, a child’s description of a star vanishing. *I miss him* felt like clinging to smoke.

  Li grunted, placing the glowing lump onto the anvil. He raised his hammer. *Clang*. The sound echoed in the small, hot space. *Clang*. Sparks flew, brief, furious stars dying on the packed earth floor. *Clang*.

  "He was a good man, your father," Li said between strikes. "Steady. Like good steel. Held its shape under pressure." *Clang*. "But everything under heaven returns to the forge, boy. Everything."

  Kai watched the iron flatten, change. "Master Zhuang… he spoke of metal. Metal that demanded to be a famous sword. An ill omen."

  Li paused, hammer poised. He squinted at the shape on the anvil, then glanced at the cooling lump on the slab beside him – the one Kai now realized was the broken head of a plowshare. "Aye," Li rasped. "Stubborn metal. Wants to be only itself, forever. Foolish. The fire cares nothing for fame. Only transformation." He plunged the pliable iron back into the coals. "Your father wasn’t stubborn metal. He knew the cycle."

  "But *he* is gone," Kai insisted, the familiar ache tightening his throat. "Him. His laugh. His stories. His hands on the loom." The particularity of it felt like a physical weight. "That plowshare… it’s broken. It’s not *becoming* anything right now. It’s just… ruined. Waiting."

  Li turned then, his eyes dark coals in his soot-streaked face. He gestured towards a dusty corner. Kai saw a pile of discarded things: a cracked water jug, a rusted hinge, a smooth, pale curve. A human skull, scavenged from the burial mounds beyond the village, sat atop the pile like a grisly ornament. Li used it to prop open the back door on hot days.

  "Ask it," Li said, a strange challenge in his voice. "Ask the skull if it misses being Magistrate Wang. Or being a farmer’s wife. Or a singing girl."

  Kai stared at the empty sockets. Zhuangzi’s skull had boasted of freedom – no rulers, no subjects, no toil. Supreme happiness. But looking at this bleached bone, Kai felt no comfort, only the vertigo of dissolution. Where *was* the Magistrate? Where was the wife? Where was the essence that was *his father*? Was it dissolved, like salt in water? Or was it merely… elsewhere? Transformed beyond recognition? The skull offered only silence and the indifferent grin of bone.

  Later, back in his father’s empty house, Kai found himself sitting before the cold hearth. His father’s loom stood silent, half a bolt of rough cloth frozen mid-weave. The silence pressed in, thick and suffocating. The ache was a physical thing, a hollow space carved into his chest where his father used to be. He remembered Zhuangzi drumming on the basin, singing as his wife’s body cooled. *She was breath, then shape, then life, then dust. Just transformations.*

  Kai picked up a wooden bowl from the floor. He stared at it. Then, hesitantly, he tapped it with his knuckle. A dull *thunk*. Not music. Not lament. Just sound. He tapped again. *Thunk*. He thought of the hammer on the anvil. *Clang*. He thought of the bellows breathing. *Huuuh… haaah…*

  He tried to hum. It caught in his throat, a broken sound. He tapped the bowl again. *Thunk*. He closed his eyes, not picturing his father’s face, but the molten iron on Li’s anvil, flowing, changing. He thought of the skull’s empty boast, the terrifying freedom of being no one. He thought of the plowshare head, cooling, waiting for the fire to claim it again, to make it *something else*.

  He hummed again, a low, tuneless vibration in his chest. It wasn't singing. It wasn't wailing. It was just… sound. Air moving through a shape that was Kai, a shape formed by the same breath that had once formed his father. He tapped the bowl in a slow, arrhythmic beat. *Thunk… thunk… thunk…*

  The grief didn’t vanish. It sat beside him, heavy and cold. But the humming, the tapping… they weren't *for* the grief. They weren't defiance or acceptance. They were just… happening. Like the bellows breathing. Like the iron cooling. Like the silent, indifferent grin of the skull on Li’s pile of discards.

  The particular man who was Kai missed the particular man who was his father with a sharpness that felt eternal. But the sound in the room, the vibration in his chest, the image of molten flow and silent bone… they whispered of a scale where 'Kai' and 'father' were fleeting shapes in a dream, scenes dissolving even as they were lived. The forge breathed. The transformation was absolute. The happiness of the skull was a terrifying, unknowable thing. The bowl made its dull sound. The hollow space remained. Kai hummed into the silence, not because he was at peace, but because, for a moment, it was simply what the breath within this particular shape was doing, while it still could. The next transformation waited, patient and immense, just beyond the circle of firelight.
