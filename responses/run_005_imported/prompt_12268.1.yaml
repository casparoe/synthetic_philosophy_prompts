  The user's profession as a conservation journalist gives them unusual depth - they're clearly aware this isn't just about logistics but about competing ethical frameworks. What's interesting is their frustration with "balanced" approaches; they want a decisive recommendation that still engages counterarguments. That suggests their board needs actionable guidance, not academic debate.

