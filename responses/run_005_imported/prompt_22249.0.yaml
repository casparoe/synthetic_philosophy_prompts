  Ah, here's the crux: Newton needs absolute space to explain why tension arises in the first scenario (empty universe). Without it, what's the "background" they're rotating relative to? The cord alone can't serve that purpose because tension depends on the globes' state of motion relative to something inertial. 

  The user might be missing that Newton is making a metaphysical leap here. The globes experiment is designed to show that rotation requires no other bodies - just space itself. But as the user senses, this doesn't necessarily prove space is a "thing" - it could just mean rotational motion has absolute effects. 

  I should emphasize Mach's later objection: maybe the fixed stars (even if invisible) are what defines rotation. Newton assumes a universe with literally nothing else, but that may be physically incoherent. The tension might still depend on distant matter. 

  The user's frustration is understandable - Newton is indeed smuggling in his assumption of absolute space. The experiment shows rotation has detectable effects, but doesn't conclusively prove space is an entity. The key is recognizing that Newton sees tension in void as evidence of motion relative to space itself, while relativists see it as evidence that rotation is fundamentally different from linear motion. 

  This is a deep philosophical divide. The user has put their finger on precisely why this thought experiment remains controversial centuries later. Their intuition that tension is "just another physical relation" is actually the modern relativistic view. Newton would counter that without absolute space, there's nothing to "feel" centrifugal effects against in an empty universe. 

  I should applaud them for spotting the gap in Newton's reasoning. Their question exposes where Newton's argument relies on his prior belief in absolute space rather than proving it outright. The globes experiment is powerful precisely because it highlights this metaphysical tension (pun intended) between relational and absolute concepts of space.
answer: |-
  You've hit on one of the deepest and most controversial points in physics history! Newton's globe experiment isn't just repeating the bucket; it's designed to isolate and prove the existence of absolute space by addressing a specific objection. Let's break down the logical steps and why Newton thinks it does more than the bucket:

  ### 1. **The Core Argument (Empty Universe Scenario):**
     - **Setup:** Two globes connected by a cord, alone in an otherwise empty universe (no stars, no other matter).
     - **Observation:** The cord is under tension.
     - **Conclusion:** This tension *must* mean the globes are rotating *absolutely* – relative to space itself. There's nothing else for them to rotate relative *to*.

  ### 2. **Your Key Objection (and Why Newton Thinks He Avoids It):**
     You're right: the tension *is* a relation between the globes and the cord. Newton's key move is this:
     - **Tension as a Measure of *Force*, Not Just Relative Motion:**
       - Tension isn't just "the globes are moving apart." It's a *dynamic effect* caused by centrifugal force.
       - Centrifugal force, Newton argues, is only present when there is *absolute acceleration* (rotation being accelerated motion).
       - In an empty universe, the *only possible cause* for this force is absolute rotation relative to space itself. There is no other "background" to cause the force.
       - **Newton's Claim:** The tension directly measures the *quantity* (magnitude) and *determination* (direction) of absolute rotation, independent of any external reference bodies. The cord isn't just "another body"; its tension is the *instrument* detecting the absolute inertial effect.

  ### 3. **Adding the Fixed Stars (The Relativity Challenge):**
     - **Setup:** Now add distant stars fixed relative to each other.
     - **Observation 1 (Relative Motion):** You see the globes rotating relative to the stars *or* the stars rotating relative to the globes. This relative motion alone doesn't tell you which is "really" moving.
     - **Observation 2 (The Cord):** The cord has tension.
     - **Newton's Conclusion:** The tension proves the globes are undergoing absolute rotation. Why?
       - If the stars were rotating absolutely and the globes were absolutely at rest, there would be *no centrifugal force* acting *on the globes*. No centrifugal force = no tension in the cord connecting them.
       - The tension *only appears* when the globes themselves are undergoing absolute acceleration (rotation). The fixed stars are irrelevant to the force felt *by the globes*.

  ### 4. **The "Extra Work" Beyond the Bucket:**
     The bucket shows rotation is absolute (water climbs) but relies on the *container* being present. Critics could argue (as Mach later did) that the water's behavior depends on rotation relative to the *distant matter of the universe* (the bucket, the lab, the Earth, the stars). Newton anticipates this:

     - **The Empty Universe Scenario:** This is the crucial innovation. By imagining the globes *utterly alone*, Newton removes *all* possible distant matter. He argues:
       - If rotation were *only* relative to other matter, then in an empty universe, rotation would be meaningless, and there could be no tension in the cord.
       - **But:** The tension *does* appear (in the thought experiment). Therefore, rotation must be relative to something *other* than matter – absolute space.
     - **The Cord as the Decider:** When distant stars *are* present, the cord's tension breaks the symmetry of relative motion. It provides a *local, intrinsic measurement* (force) that distinguishes absolute rotation from mere relative rotation. The bucket's bulge does this too, but the globes make the "no external reference" argument explicit and unavoidable.

  ### 5. **The Gap You're Sensing (and Why It's Profound):**
     You're absolutely correct to feel Newton might be smuggling in his conclusion. The core issue is this:
     - Newton assumes that **centrifugal force inherently requires absolute acceleration relative to space itself.**
     - The alternative view (later championed by Mach and realized in General Relativity) is that **centrifugal force arises from acceleration relative to the *total distribution of mass in the universe*.** In an *actually* empty universe (which might be physically incoherent), rotation might be meaningless, or the force might vanish.

     **Newton's Logic Chain:**
     1. Tension exists (empirical fact in the experiment).
     2. Tension requires centrifugal force.
     3. Centrifugal force requires absolute acceleration (rotation).
     4. Absolute acceleration requires acceleration relative to something inertial (non-accelerating).
     5. In an empty universe, the *only* something inertial is absolute space.
     ∴ Absolute space exists.

     **The Point of Contention:** Step 4. Newton assumes absolute space is the necessary inertial background. Mach/Einstein argue the inertial background is *defined by* the large-scale distribution of mass. Newton's empty universe experiment is designed to *force* the conclusion of absolute space by eliminating the mass-defined alternative.

  ### In Summary

  *   **The Bucket:** Shows rotation has absolute effects (water climbs).
  *   **The Globes (Empty Universe):** Argues that since the absolute effect (tension) exists *even when no other matter exists*, it *must* be relative to space itself. This is the positive argument *for* absolute space.
  *   **The Globes (With Stars):** Shows that while relative motion is symmetric, the *force* (tension) breaks the symmetry and identifies which body is *absolutely* rotating. This counters the objection that absolute motion is undetectable.

  Newton believes the globes experiment proves absolute space because:
  1.  It demonstrates a measurable effect (force/tension) arising purely from motion.
  2.  This effect persists even when *all other matter is removed*, eliminating any relational explanation (rotation relative to other bodies).
  3.  Therefore, the rotation must be relative to space itself.

  Your intuition that tension is "just a physical relation between bodies" highlights the core of the Machian/Einsteinian critique: perhaps inertia itself *is* a relation to distant mass, making Newton's truly empty universe scenario impossible or meaningless. Newton's globes are his strongest argument *against* that relational view. The debate wasn't truly settled until General Relativity provided a new framework where inertia *is* tied to mass distribution, rendering absolute space unnecessary.
