  ### Key Philosophical Anchors
  - **Metaphysics**: Rejects mereological essentialism in favor of a *narrative ontology* of artifacts (inspired by Baker, Wiggins).  
  - **Ethics**: Aligns with the Burra Charter’s emphasis on "doing as much as necessary, as little as possible"—our locomotive fulfills this via incremental care.  
  - **Diplomacy**: Avoids zero-sum conflict by assigning complementary identities, reflecting how museums distinguish "original" vs. "working" reconstructions.  

  This approach balances scholarly rigor with practical heritage management, centering Bramwell’s ongoing life while honoring its origins.
