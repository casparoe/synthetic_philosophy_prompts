  ### Overall Insight
  Both Owen and Naomi conflate **descriptive causation** (the physical process in the tank) with **normative responsibility** (duties from the sign-up sheet). The fish died from starvation—a biological cause rooted in cumulative food deprivation. Owen’s omission was the *proximate responsible cause* due to his duty, but this doesn’t negate that the death required no intervention from others. The sign-up sheet makes Owen’s inaction *relevant*, but the tank’s events remain the physical basis. A fuller view separates:  
  - **Cause (descriptive)**: Lack of food on Wednesday, leading to starvation.  
  - **Responsibility (normative)**: Owen’s failure to fulfill his assigned duty.  
  This resolves the tension: Owen "caused" the death in a responsibility sense, but the physical cause is impersonal.
