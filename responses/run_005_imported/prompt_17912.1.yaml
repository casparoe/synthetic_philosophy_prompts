  Here’s a toast that navigates Moore’s philosophy with accuracy, embraces the irony, and keeps Uncle Dave engaged—all in under five minutes. It uses Moore’s framework as scaffolding but centers the couple’s unique dynamic:

  ---

  **(Clink glass)** Friends, family, philosophers—and those who’ve wisely avoided philosophy—gather round. We’re here, of course, because of love. But since the brilliant bride tasked *me*, the science guy, with toasting her union with our art-historian groom... well, let’s just say she knows how to ensure her wedding toast cites primary sources.

  **(Warmly, toward the couple)** [Bride] and [Groom], your union embodies an idea from [Bride]’s philosophical hero, G.E. Moore. In his *Principia Ethica*, Moore argued that the very highest goods in life aren’t fame or fortune, but two things: **Personal Affection** – that deep appreciation of another person’s unique qualities – and the **Aesthetic Appreciation of Beauty**. Individually, they’re wonderful. But Moore’s real genius was his point about "organic unities": sometimes, combining two great things creates something *far* greater than just their sum. A whole new level of value.

  **(With a knowing look at the grad table)** Now, Moore scholars in the room – relax, I’ve done the reading, especially *that* paper – know Moore was… let’s say… *particular* about "Personal Affection." For him, the pinnacle was a calm, almost contemplative admiration of someone’s character. Pure, deep, but… perhaps a touch reserved about the messier, warmer, *romantic* passions we celebrate today. He might have raised an eyebrow at the sheer, joyful *feeling* filling this room.

  **(Pivoting to the couple, with humor and affection)** But here’s where [Bride] and [Groom] don’t just *study* the ideal – they *improve* on the formula. You see, Moore saw Personal Affection and Aesthetic Appreciation as separate paths to the good. [Bride], you get Personal Affection – your life’s work is literally pondering the value of persons. [Groom], you get Beauty – your world is seeing the sublime in objects and images. A neat division of labor! Moore might have nodded approvingly.

  **(Building the key point)** But life, love, and especially *your* love, laughs at neat divisions. Because what makes *your* union the ultimate "organic unity" isn't just that [Bride] brings the affection and [Groom] brings the beauty. It’s that **together, you transform each other’s domain.**

  **[Groom], you don’t just *see* beauty; you help [Bride] – and all of us – *truly perceive* it.** You give us the context, the history, the wonder in the brushstroke or the curve of a vase. You turn looking into *seeing*. Moore insisted true appreciation wasn't passive; it demanded that "true perception."

  **[Bride], you don’t just *analyze* affection; you embody a warmth and loyalty that goes beyond the contemplative.** You show us that appreciating a person isn’t just admiring their virtues from a distance like a fine portrait, but embracing the whole, vibrant, sometimes gloriously imperfect human being. You bring the "appropriate emotion" Moore knew was essential.

  **(The Moorean twist with a wedding payoff)** So yes, Moore might have theorized that a beautiful unseen world is better than an ugly one. But what you two create is something even more profound: **a *seen* beauty, deeply *felt* and *shared*. Your love isn't just the sum of his eye and your mind. It’s a new thing altogether – a shared world where perception and emotion fuse, where admiration ignites warmth, and where the contemplation of each other’s best selves sparks a joy that’s anything but bloodless.**

  **(The Raise)** Moore defined the ideal as the combination of Personal Affection and the Appreciation of Beauty. [Bride] and [Groom], you’ve taken his framework and poured into it the very things he might have underestimated: passion, partnership, laughter, and the sheer, radiant warmth of your commitment. You prove that the *truest* organic unity isn’t just contemplation, but connection. So let’s raise our glasses: To the beautiful world you see in each other, to the profound affection you feel, and to the infinitely valuable, gloriously *greater-than-the-sum-of-its-parts* life you’re building together. To [Bride] and [Groom]!

  ---

  **Why this works:**

  1.  **Accurate Moore:** Hits the key points: the two greatest goods, the "organic unities" concept (explained simply), the primacy of true perception/appropriate emotion, and crucially, acknowledges his reservation about romantic passion (citing "that paper" signals insider knowledge without derailing).
  2.  **The Joke/Gap:** Directly addresses the irony ("Moore might have raised an eyebrow...") and uses the "division of labor" as a springboard to show how the couple *transcends* Moore's limitations.
  3.  **Accessible:** Explains concepts in simple terms ("calm admiration," "separate paths," "true perception," "shared world"). Uncle Dave understands the core idea: their combined strengths create something magical.
  4.  **Centers the Couple:** Every philosophical point is *immediately* tied back to *their* specific traits and relationship. It's *about* them *using* Moore, not *about* Moore.
  5.  **Avoids Empty Sentiment:** The warmth comes from concrete examples of how they enhance each other's perception and emotion, fulfilling Moore's criteria for true value in a way he might not have envisioned.
  6.  **Structure:** Clear flow: Moore's Idea -> The Irony/Joke -> How the Couple Embodies *and* Transcends the Idea -> The Toast.
  7.  **Time:** Designed for comfortable delivery in 4-5 minutes.
