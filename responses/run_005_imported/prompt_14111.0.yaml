  Here’s a toast that weaves updateless decision theory into a heartfelt message about marriage vows, designed to resonate with both the niche crowd and the broader audience:

  **(Clink glass gently)**  
  Friends, family, strangers from obscure corners of the internet… thank you all for being here to celebrate [Groom's Name] and [Bride's Name]. It’s an honour to stand up here for my closest friend.

  [Groom's Name] and I? We met… well, let’s just say it wasn’t over a shared love of sports or music. We met years ago, online, in the *deepest* part of some philosophical rabbit hole, passionately arguing about a bizarre thought experiment involving hypothetical muggings and imaginary coins. Sounds strange, right? But that argument sparked a friendship that’s lasted through everything life’s thrown at us. And ever since, there’s been this *one* peculiar idea we keep circling back to, like a dog with a particularly fascinating bone. It’s about how we make decisions… especially the *big* ones.

  **(Lean in slightly, conversational tone)**
  The gist of it is this: Most of the time, we make choices based on what’s right in front of us. New information comes in, the situation changes, and we update our plans. We’re constantly recalculating the best move *now*, given the latest data. It’s like placing a running bet on life – always checking the odds, always ready to adjust. And for most things? That makes perfect sense. You *should* update your route if there’s a traffic jam!

  **(Pause, shift tone to more profound)**
  But this idea we wrestled with, this "updatelessness"... it suggests there are moments, rare and profound moments, where the *truly* powerful choice isn’t made in the heat of the present, constantly re-evaluated. Instead, it’s a **policy** you set *in advance*. You look out at the vast, uncertain future stretching before you, with all its unknowns, its potential joys and inevitable hardships… and you decide. You commit. Not because you know what’s coming, but precisely *because* you *don’t*. You choose a path, a way of being, *before* the specific circumstances hit. And then… you stick to that policy. Not because some external force makes you, but because you already decided that *this* is who you want to be, no matter what information the future hands you.

  **(Turn fully to the couple, warmth and sincerity)**
  [Groom's Name], my brother, that’s why I’m thinking about it today. Because that, right there? That’s what a wedding vow *is*.

  **(Address the whole room)**
  It’s not a running bet. It’s not a conditional promise based on the latest data life serves up. "I’ll love you *if* the career goes well," or "I’ll be faithful *unless* someone more interesting comes along," or "I’ll stand by you *provided* things stay easy." That’s updating based on new information. That’s hedging your bets.

  **(Gesture towards the couple)**
  What [Groom's Name] and [Bride's Name] are doing today is something infinitely braver and more beautiful. They are standing here, looking out at that vast, uncertain future together, and they are setting their **policy**. Today, in front of all of us, they are saying: **"This is us. This is our commitment. This is the path we choose. Regardless."**

  Regardless of the arguments that will come (and they will!).
  Regardless of the unexpected hardships.
  Regardless of the tempting distractions life might throw out there.
  Regardless of the days when "updating" might *seem* like the easier, more logical choice.

  They are choosing, *right now*, the policy of love, partnership, and unwavering commitment. They are pre-committing to weathering every storm and celebrating every joy *together*, as a unit. They are declaring that their love isn't contingent on the shifting sands of circumstance, but built on the bedrock of a choice made here, today, with clear eyes and full hearts.

  **(Raise glass higher)**
  So, to [Groom's Name] and [Bride's Name]! To the courage it takes to make that updeless commitment! To choosing your policy – the policy of 'us' – and sticking to it with all your might, not because you have to, but because you *decided* to, here and now, forever. May your love be a constant, unwavering force, a testament to the power of a choice made in advance and honoured through every single update life brings your way.

  **To the happy couple!**

  **Key elements making it work:**

  1.  **Accessible Introduction:** Starts with a relatable, slightly humorous origin story ("arguing about a bizarre thought experiment").
  2.  **Simplified Core Concept:** Explains "updatelessness" in plain language ("policy set in advance," "not constantly re-evaluated," "regardless of future information") without jargon. The "running bet" vs. "chosen policy" contrast is clear.
  3.  **Seamless Link to Vows:** Explicitly connects the abstract idea ("policy set in advance") to the concrete act of making wedding vows ("That’s what a wedding vow *is*").
  4.  **Clear Contrast:** Uses the "running bet" analogy to highlight what vows are *NOT* ("if the career goes well," "unless someone more interesting comes along"), making the updeless commitment stand out as the superior choice.
  5.  **Emphasis on Agency & Courage:** Stresses they choose this *themselves* ("not because some external force makes you," "because you *decided* to") and that it's an act of bravery ("infinitely braver and more beautiful").
  6.  **Universal Resonance:** While the niche group hears the UDT reference loud and clear, everyone else hears a powerful message about the nature of true, unconditional commitment: choosing love *once* and sticking to it *through* everything.
  7.  **Focus on the Couple:** Brings it back constantly to *their* love, *their* commitment, *their* future. The theory serves the sentiment, not the other way around.
  8.  **Appropriate Tone:** Mixes warmth, sincerity, a touch of humor, and profound respect. Ends with a clear, heartfelt toast.
  9.  **Avoids Lecture:** No technical terms (UDT, CDT, Omega, etc.), no deep dives into the mugging paradox. The concept is used purely as a powerful metaphor for the vows.

  This toast delivers the specific, meaningful message about the nature of commitment you wanted, honouring your shared intellectual history while remaining a genuine, moving tribute for the entire wedding party. Good luck!
