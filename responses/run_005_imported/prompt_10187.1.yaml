prompt: |-
  A friend and I spent most of a long dinner arguing about the two-envelope paradox, and we never quite agreed on where the "you should always switch" reasoning actually breaks down. She maintained that the fix is basically Bernoulli's: once you replace the money in the envelopes with utility, the tempting calculation that switching raises your expected payoff by twenty-five percent evaporates, in much the same way that a concave utility function tames the infinite expectation of the St. Petersburg lottery. I maintained that this misdiagnoses the problem, and that the real fault sits further upstream, in a probability distribution over the envelopes' contents that the naive argument quietly assumes but that cannot actually exist. Neither of us budged, so I'd like your help settling the matter a different way. Suppose Daniel Bernoulli, fresh from writing his 1738 paper on the St. Petersburg problem, were handed the classic, bounded two-envelope setup, with no hidden infinities lurking anywhere in it. Working only with the mathematical and probabilistic concepts he actually had on hand in the 1730s, how do you think he would have diagnosed what goes wrong with the switching argument — and would the very utility-curvature move that rescued him in the St. Petersburg case have rescued him here too, or would it have missed the point entirely?
reasoning: |-
  We are considering the two-envelope paradox. In the classic setup, there are two envelopes. One contains twice as much money as the other. You choose one at random and then are given the option to switch. The paradox arises from the following reasoning:

  Let the amount in your chosen envelope be X. Then the other envelope has either 2X or X/2, each with probability 1/2. Therefore, the expected value of switching is:

  (1/2) * (2X) + (1/2) * (X/2) = (2X)/2 + (X/4) = X + X/4 = (5X)/4

  So the expected value of switching is 1.25X, which is greater than X. Hence, it seems you should switch. But then the same reasoning would apply after switching, leading to a cycle.

  Your friend argues that Bernoulli would fix this by introducing utility (a concave function of wealth), which would make the expected utility calculation not favor switching. You argue that the problem lies in the assumption of a prior probability distribution over the envelope contents that is uniform in a way that cannot actually exist.

  Now, let's consider Bernoulli in the 1730s. He had just written about the St. Petersburg paradox and introduced the idea of diminishing marginal utility. Would he use the same idea here?

  But note: the two-envelope paradox, as stated in the bounded case, does not involve infinite expectations. So the St. Petersburg issue of infinite expectation does not directly apply. However, the paradox still arises.

  Let me recall the bounded version: we assume that the envelopes contain positive amounts of money and that there is a fixed maximum possible amount (to avoid the unbounded case). However, the paradox can also occur without a bound if we are not careful about the prior.

  The root of the problem is the assumption that for any value X that you might find in your envelope, the other envelope is equally likely to contain 2X or X/2. This assumption cannot hold for all X simultaneously. Why?

  Suppose the envelopes contain A and 2A. If you pick the envelope with A, then X = A, and the other has 2A = 2X. If you pick the envelope with 2A, then X = 2A, and the other has A = X/2. So in reality, the two scenarios are:

  - Scenario 1: You have A, the other has 2A (which is 2X relative to your X=A).
  - Scenario 2: You have 2A, the other has A (which is X/2 relative to your X=2A).

  But note that these two scenarios are equally likely (each with probability 1/2). Now, if we condition on the value of X, we must be cautious. The issue is that the distribution of the initial choice of the envelope pair matters.

  Let the possible amounts in the envelopes be (a, 2a) for some a in a set of possible values. The problem is that if we assume a prior distribution over a that is very broad (like uniform on the positive reals) then we run into the problem that the distribution is improper. But even with a bounded set, the conditional probability that the other envelope is double or half is not always 1/2 for every observed X. Why?

  Suppose we fix a prior distribution for the smaller amount A. Let the cumulative distribution function (CDF) of A be F(a). Then, the total probability of observing an amount X in an envelope is:

  P(observed amount = X) = P(you picked the smaller and X=A) + P(you picked the larger and X=2A)
  = (1/2) * f_A(X) + (1/2) * f_A(X/2) * (1/2)   [if we are using densities]

  Wait, let me be more careful. The density of the observed envelope amount X is:

  f_X(x) = (1/2) * f_A(x) + (1/2) * f_A(x/2) * (1/2) * 2? 

  Actually, if A has density f_A, then the density of the observed envelope is:

  f_X(x) = (1/2) * f_A(x)   [if you picked the smaller one] 
            + (1/2) * (1/2) * f_A(x/2)   [if you picked the larger one, which is 2A, then A=x/2, and note that the density of the larger envelope at x is the density of A at x/2 multiplied by 1/2 (because if A has density f_A, then 2A has density f_A(x/2) * (1/2))]

  But wait, the factor 1/2 in the second term comes from the change of variables: the density of 2A at x is f_A(x/2) * |dA/d(2A)| = f_A(x/2) * (1/2). So:

  f_X(x) = (1/2) * f_A(x) + (1/2) * [ f_A(x/2) * (1/2) ] 
          = (1/2) f_A(x) + (1/4) f_A(x/2)

  Now, the conditional probability that you have the smaller envelope given that you observe X=x is:

  P(smaller | X=x) = [ (1/2) f_A(x) ] / f_X(x)

  Similarly, the conditional probability that you have the larger envelope given X=x is:

  P(larger | X=x) = [ (1/4) f_A(x/2) ] / f_X(x)

  But note: if you have the smaller envelope, then the other envelope has 2x. If you have the larger envelope, then the other envelope has x/2.

  So the expected value of the other envelope given X=x is:

  E[other | X=x] = 2x * P(smaller | X=x) + (x/2) * P(larger | X=x)

  This equals:

  = 2x * [ (1/2) f_A(x) / f_X(x) ] + (x/2) * [ (1/4) f_A(x/2) / f_X(x) ]
  = [ x f_A(x) + (x/8) f_A(x/2) ] / f_X(x)

  But we also know that:

  f_X(x) = (1/2) f_A(x) + (1/4) f_A(x/2)

  So:

  E[other | X=x] = [ x f_A(x) + (x/8) f_A(x/2) ] / [ (1/2) f_A(x) + (1/4) f_A(x/2) ]

