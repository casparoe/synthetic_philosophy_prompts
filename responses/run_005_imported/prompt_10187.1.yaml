  Suppose the prior probability for each pair is known. Then we can compute the conditional probabilities. The naive 1/2 assumption would only hold if the prior distribution is such that for every observed x, the probability that it came from the smaller envelope of a pair (x, 2x) is the same as the probability that it came from the larger envelope of a pair (x/2, x). But this is a very specific condition on the prior.

  Bernoulli might have realized that without knowing the prior distribution, one cannot assume that the conditional probabilities are 1/2. And if the prior distribution is unknown, then the expected value calculation cannot be done. So the paradox arises from an unjustified assumption about the conditional probabilities.

  But note that Bernoulli introduced utility to handle risk aversion. In the St. Petersburg case, the problem was the infinite expected value. Here, the problem is not the same. The two-envelope paradox does not have an infinite expectation issue in the bounded case. So Bernoulli might have been less inclined to use utility here, or he might have used it as a computational trick to avoid the issue.

  Given that the logarithmic utility makes the expected utility of switching equal to that of not switching, it does "resolve" the paradox in the sense that it removes the incentive to switch. However, it does not explain why the naive expected monetary value calculation is flawed.

  So which is the better diagnosis?

