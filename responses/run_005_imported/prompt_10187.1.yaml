  [ x f_A(x) + (x/8) f_A(x/2) ] / [ (1/2) f_A(x) + (1/4) f_A(x/2) ] = 5x/4

  Divide both sides by x (assuming x>0):

  [ f_A(x) + (1/8) f_A(x/2) ] / [ (1/2) f_A(x) + (1/4) f_A(x/2) ] = 5/4

  Set r(x) = f_A(x/2) / f_A(x). Then:

  [ 1 + (1/8) r(x) ] / [ (1/2) + (1/4) r(x) ] = 5/4

  Solve for r(x):

  4 * [1 + (1/8) r(x)] = 5 * [ (1/2) + (1/4) r(x) ]

  4 + (4/8) r(x) = 5/2 + (5/4) r(x)

  4 + 0.5 r(x) = 2.5 + 1.25 r(x)

  4 - 2.5 = 1.25 r(x) - 0.5 r(x)

  1.5 = 0.75 r(x)

  r(x) = 1.5 / 0.75 = 2

  So we require r(x) = 2, meaning f_A(x/2) = 2 f_A(x) for every x. This is impossible for a normalizable density over the positive reals because it would imply that the density increases as x decreases. For example, if we try to define a density that satisfies f_A(x) = c / x for some constant c, then we have an improper distribution (the integral diverges). Moreover, even if we consider a bounded interval, the condition f_A(x/2) = 2 f_A(x) cannot hold for all x in the interval because if the interval is [m, M], then for x near M, x/2 might be below m, and we cannot define f_A(x/2). Also, the density would have to increase without bound as x decreases, which is impossible if the interval has a positive minimum.

  Therefore, the assumption that for every x, the conditional probability that the other envelope is 2x or x/2 is 1/2 is inconsistent with any proper prior distribution on the envelope contents.

  Now, back to Bernoulli in the 1730s. He had the concept of expectation and utility, but the formal development of probability distributions (like densities) was not as advanced as today. However, he might have thought in terms of discrete cases or simple continuous cases.

  But note that Bernoulli introduced the logarithmic utility function to resolve the St. Petersburg paradox. Would he do the same here?

  In the two-envelope paradox, the naive expected value calculation (without utility) suggests switching is always beneficial. However, with a utility function, the expected utility of switching might not be greater. Let U be the utility function (concave). Then:

  E[U(switch) | X=x] = (1/2) U(2x) + (1/2) U(x/2)

  The expected utility of not switching is U(x). So we would compare:

  (1/2) U(2x) + (1/2) U(x/2) vs U(x)

  With a concave U, we have:

  (1/2) U(2x) + (1/2) U(x/2) <= U( (1/2)*2x + (1/2)*(x/2) ) = U( (2x + x/2)/2 ) = U( (5x/4) )

  But note that U(5x/4) is not necessarily less than U(x) because 5x/4 > x. So this does not directly resolve the paradox. In fact, without knowing the exact utility function, we cannot say.

  However, if we use the logarithmic utility (as Bernoulli did), then:

  E[U(switch)|X=x] = (1/2) log(2x) + (1/2) log(x/2) = (1/2) [log(2) + log(x)] + (1/2) [log(x) - log(2)] 
                     = (1/2) log(2) + (1/2) log(x) + (1/2) log(x) - (1/2) log(2)
                     = log(x)

  So the expected utility of switching is log(x), which equals the utility of not switching (which is log(x)). Hence, there is no gain in expected utility by switching.

  So with logarithmic utility, the expected utility of switching is the same as not switching. Therefore, there is no incentive to switch.

  But note: this calculation uses the same flawed assumption that the conditional probabilities are 1/2. However, the utility approach here has made the expected utility of switching equal to the utility of what you have. So the paradox disappears.

  But wait, the utility approach does not address the underlying problem of the prior distribution. It merely masks it by making the expected utility the same. However, in reality, the prior distribution does not exist that allows the conditional probability to be 1/2 for every x. Therefore, the utility fix might be seen as a patch that hides the real issue.

  But in the bounded case, we can choose a proper prior. For example, suppose the smaller amount A can only be one of two values: a1 or a2. Then the paradox does not arise in the same way because if you observe an amount that is not one of the two expected values, you know exactly what happened. But in the continuous case, the prior must be chosen appropriately.

  Bernoulli, with the tools of the 1730s, would not have had the measure-theoretic understanding to fully grasp the issue with the prior. However, he might have been able to see that the naive probability assignment (always 1/2 for double or half) leads to an inconsistency. But without a formal notion of probability density, he might have found it difficult to express.

