prompt: |-
  Me and my friend Dana got into it last night over counterpart theory vs. transworld identity (we're both auditing a modal metaphysics seminar this semester, which is apparently what happens to your social life now). Dana's whole position was that Kripke's Humphrey objection just ends the debate — you know, the bit about how it wouldn't comfort Humphrey one bit that some other guy, merely similar to him, won the election in some other world, because what Humphrey cares about modally is what could've happened to *him*, full stop. I tried to defend Lewis by pointing out that the counterpart relation is doing exactly the job that "sameness across worlds" is supposed to do, so the objection kind of just begs the question against counterpart theory rather than refuting it, but I fumbled the actual defense and we ended up repeating ourselves til about 1am.

  So I want your help doing this properly. Can you lay out the strongest possible argument that counterpart theory gives a better analysis of ordinary de re modal claims than transworld identity, Humphrey objection notwithstanding? Two things I really need you to actually engage with rather than wave away: first, explain concretely why the "it wouldn't comfort Humphrey" intuition doesn't show what Kripke thinks it shows about the semantics of "could have." Second — and this the part that actually got me stuck with Dana — if the counterpart relation is just similarity along whatever respects are salient in context, doesn't that make essentialist claims (what's essential vs. accidental to a given individual) come out relative to conversational context, in a way that seems to change the subject from whatever the transworld identity theorist thinks she's asserting when she says something is essential to Humphrey? I don't want a dodge like "well, essentialism is just interest-relative, get over it" — I want an actual response to why that's not a real cost, or at least a smaller one than what transworld identity owes an explanation for (feel free to bring in the accidental-intrinsics stuff too — Lewis's shape example, bent vs. straight, or whatever — if it helps the case). Don't bother being balanced or giving me Dana's side too, I've already got that — I just need the ammunition.
