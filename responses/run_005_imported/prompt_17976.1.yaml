answer: |-
  Here’s a dialogue between **B** (a Blackburn-style quasi-realist) and **G** (a Gibbard-style plan-expressivist), debating whose solution genuinely solves Frege-Geach. They start with modus ponens but quickly escalate to harder cases, with each accusing the other of either smuggling realism or relying on ad hoc tricks. The dialogue is tightly responsive, with each turn addressing the previous critique.

  ---

  **B:** Look, Simon’s solution is elegant: when I say "If lying is wrong, then getting your brother to lie is wrong," I’m expressing *higher-order disapproval*—disapproval of *not* disapproving of getting your brother to lie while disapproving of lying. It’s all attitude-management, no truth-conditions needed. Your "hyperplans" sound like a covert descriptivism.  

  **G:** *Covert*? Hardly. When I say "Lying is wrong," I’m expressing a plan to disapprove of lying. For modus ponens, it’s straightforward: "If lying is wrong, then..." is true *relative to a hyperplan* just in case, for any world where my hyperplan disapproves of lying, it also disapproves of getting your brother to lie. Logic falls out naturally because we’re assigning truth-conditions *relative to plans*. Your attitude-stacking feels jerry-rigged—why should *disapproving of inconsistent attitudes* mirror logic? It’s an ad hoc psychological fix!  

  **B:** Ad hoc? It’s systematic! Take **negation**. If I say "Lying is *not* wrong," I’m expressing *toleration* of lying—disapproving of the disapproval of lying. That’s a natural extension of the attitude framework. But your "truth-relative-to-a-hyperplan" just sneaks in propositional content. If "wrong" expresses a plan, then "not wrong" should just express *no plan to disapprove*. But that’s inert! How does that explain why "Lying is wrong and not wrong" is inconsistent?  

  **G:** Easily! A hyperplan that disapproves of lying *and* withholds disapproval (i.e., permits it) is *inconsistent as a plan*—it violates the rational requirement to avoid contradictory commitments. The inconsistency is in the planning state, not in attitudes about attitudes. Your "toleration" attitude is arbitrary—why not call it "anti-disapproval" or "meta-approval"? You’re inventing new attitudes case by case!  

  **B:** Fine, let’s try **disjunction**. Suppose I say, "Either stealing is permissible or lying is wrong." For me, that expresses *disapproval of disapproving of both stealing and lying*. It’s a unified attitude: I’m against condemning the whole pair. Now you—go on, give me truth-conditions for *that* without turning "permissible" and "wrong" into covert descriptions.  

  **G:** Gladly! Relative to a hyperplan, "Stealing is permissible or lying is wrong" is true iff either (1) the hyperplan *doesn’t* disapprove of stealing, or (2) it *does* disapprove of lying. No new machinery—just standard disjunction over world-plan pairs. But *you*? You’ve conjured a *third-order attitude*: disapproval of a *failure* to have a *specific combination* of first-order attitudes. How is that *not* ad hoc? What’s the general rule? "For any disjunction, invent a higher-order attitude that bundles the disjuncts"? That’s not solving Frege-Geach; it’s duct-taping it!  

  **B:** It’s not duct-tape—it’s tracking the *logic of commitments*! But you’re dodging the real issue. What about **non-assertoric contexts**, like wondering aloud: "Is lying wrong?" For me, that’s *considering whether to disapprove* of lying. It’s still an attitude-exploring act. Your hyperplan story collapses here. If "Is lying wrong?" isn’t asserting anything, what’s its "truth-condition"?  

  **G:** Simple: it expresses *uncertainty about which hyperplan to adopt*. I’m considering the set of hyperplans where lying is disapproved versus those where it isn’t. No truth-conditions needed—just an exploration of planning possibilities. But *you*? "Considering whether to disapprove" isn’t an *attitude*; it’s the *absence* of one. Your expressivism can’t distinguish wondering "Is lying wrong?" from apathy. Mine handles it seamlessly because hyperplans model *possible normative perspectives*.  

  **B:** "Possible normative perspectives"? That’s just **possible worlds** in disguise! You’ve smuggled in a realist ontology of "perspectives" with determinate truth-conditions. If hyperplans are just abstract objects that make sentences true or false, you’re a descriptivist with extra steps. Quasi-realism earns logic *without* that—by showing how our practical stances *project* logical structure.  

  **G:** And your "projection" is **psychologism**! You’re reducing logic to contingent human attitudes. Why *should* disapproving of inconsistent attitudes mirror logical entailment? What if someone *doesn’t* disapprove of inconsistency? For me, the inconsistency is in the *content of the plan*, fixed by rational constraints. Your solution is brittle—it works *only* if we assume agents have the "right" higher-order attitudes. Mine generalizes because it piggybacks on standard logic via relativized truth.  

  **B:** But if logic is "fixed" by rational constraints on plans, you’ve made rationality *descriptive*—a fact about ideal planners. That’s not expressivism! Expressivism is about *expression*, not hidden facts. I keep ethics practical all the way down.  

  **G:** And I keep it *systematic*. Face it: for complex embeddings—like "If either lying isn’t wrong or stealing is wrong, then..."—your attitude-stacking becomes a Rube Goldberg machine. Mine stays lean: just more world-hyperplan pairs. You’re patching cases; I’m offering a unified semantics.  

  **B:** Unified? Only by emptying "truth" of its substance! Call it "solving Frege-Geach" if you want, but you’ve sold expressivism’s soul to save it.  

  ---  

  ### Key Disagreements Highlighted:  
  1. **Systematicity vs. Psychology**:  
     - **Gibbard** claims his world-hyperplan framework provides a *general, logic-friendly semantics* for all normative sentences (assertoric or not).  
     - **Blackburn** accuses this of *covert descriptivism*—hyperplans reintroduce truth-conditional content, betraying expressivism’s core (ethics as expression of non-cognitive states).  
  2. **Ad Hoc Attitudes vs. Hidden Realism**:  
     - **Blackburn** argues Gibbard’s "truth relative to hyperplans" is *realism in disguise* (plans act as truth-makers).  
     - **Gibbard** counters that Blackburn’s higher-order attitudes are *unprincipled and psychologically implausible* (e.g., "disapproving of not disapproving" for negation).  
  3. **Handling Hard Cases**:  
     - **Negation**: Blackburn uses *meta-attitudes* (e.g., toleration); Gibbard uses *plan-inconsistency*.  
     - **Disjunction**: Blackburn bundles attitudes; Gibbard uses standard logical operators over plans.  
     - **Non-Assertoric Speech**: Blackburn struggles to define an *attitude for questioning*; Gibbard appeals to *uncertainty among possible plans*.  

  ### Why This Matters for Your Seminar  
  - **Gibbard** claims to "solve" Frege-Geach by *reconstructing truth-conditions* from planning states, making logic internal to practical reasoning.  
  - **Blackburn** insists logic emerges from *expressive practices alone*, avoiding any "creeping minimalism" that collapses into realism.  
  - Your professor will likely push on whether Gibbard’s hyperplans *over-intellectualize* moral psychology (can ordinary speakers really have "fully resolved plans"?), or whether Blackburn’s attitudes can handle, say, **mixed disjunctions** ("Stealing is wrong or grass is green") without implausible mental gymnastics.  

  **Pro tip:** Frame your presentation around this tension—expressivism’s attempt to *have its cake (logic) and eat it too (anti-realism)*. Both solutions are "live" because neither has definitively resolved whether embedding requires *semantic structure* (Gibbard) or *pragmatic projection* (Blackburn). Good luck—your professor will respect you engaging the thorniness!
