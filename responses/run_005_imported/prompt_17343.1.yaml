  The user's own intuition about promises—that they're about "deciding who you're going to be from now on"—is actually quite philosophically astute. It aligns with existentialist views (like Sartre's idea of self-creation through commitment) and Scanlon's contractualist approach, where promises create moral obligations regardless of social consequences. Theo seems to reject Hume's conventionalism and the "contract" reductionism, which fits with Scanlon's framework. 

  The constraints are tricky: avoid oversimplifying Theo's work (philosophers will notice), avoid jargon (non-philosophers will tune out), and don't make marriage sound like a "fiction" (Theo's mom is worried). The toast must also emotionally resonate—it’s a wedding, not a seminar. 

  The solution is to weave the philosophy into a narrative about marriage’s weight. Start with the user’s own "half-baked theory" (which is stronger than they realize), contrast it gently with the "contract" view Theo dislikes, then pivot to how Theo’s work reveals promises as acts of self-definition. Emphasize that the public vow isn’t just pressure—it’s a shared witness to their chosen selves. This honors Theo’s scholarship while keeping it accessible and warm. 

  Key moves:  
  - Use the user’s theory as an anchor (validates them, avoids jargon).  
  - Name-drop Hume/Scanlon lightly (signals rigor to philosophers) but immediately translate to everyday stakes.  
  - Stress that breaking a secret promise matters because it betrays *yourself*, not just expectations—this covers Theo’s "nobody would find out" point.  
  - Frame the wedding vow as "choosing who you’ll become together," which sidesteps "fiction" worries by making it deeply real.  
  - End with the ring as a "reminder to the self" (nodding to Scanlon’s principle F without citing it).  

  The tone must stay tender, not lecture-y. Phrases like "I’ve been noodling on this" and "Theo’s made me think harder" keep it humble. The philosophers will appreciate the embedded accuracy; everyone else hears a dad’s heartfelt take on commitment. Win-win.
answer: |-
  Here’s a toast that threads the needle—respecting Theo’s work while keeping it warm, accessible, and focused on the meaning of *their* promise. I’ve structured it to flow naturally in a speech (aim for 2-3 minutes delivery):

  ---

  **(Raise glass, smile at the couple)**  
  "To [Daughter] and Theo! Seeing you two together has been one of the great joys of my life. Now, Theo... when you marry into a family, you get the whole package. And part of *our* package is that we talk a lot. Sometimes, loudly. Over dinner. Especially when there’s a philosopher at the table finishing a PhD on... *promises*.  

  **(Light, self-deprecating chuckle)**  
  "Honestly, Theo, before your dissertation, I thought a promise was pretty straightforward. You say ‘I promise,’ and it means you’ll do the thing. Done. But listening to you wrestle with *why* that little phrase carries such weight... why it’s not just a prediction or a contract... well, it got me thinking. Hard. Especially about the promise you two are making today.  

  **(Shift tone slightly – more reflective, but still warm)**  
  "Theo argues—and forgive me if I oversimplify, Doctor-to-be—that reducing a promise to just a useful social trick, or calling it just a contract, misses something deep. It misses why breaking a *secret* promise, one nobody else knows about or is counting on, still feels like a betrayal. Not just of the other person, but of *yourself*.  

  **(Pause, look at the couple)**  
  "That hit me. Because the promise you make today *isn’t* secret. We’re all here, we’re all witnesses, and that matters. But Theo’s work suggests the *real* weight comes from something even more personal. It’s not just betting on your future self. It’s **deciding, right here and now, who that future self is going to be.**  

  **(Lean into the personal insight)**  
  "That’s what I see in you two. This isn't just a contract about shared chores or bank accounts—though, honey, please do the dishes sometimes. **(Gentle laugh)** This is you both standing up and saying, to each other and to yourselves: *‘This is who I choose to be. This is the life I choose to build. With you.’*  

  **(Connect back to philosophy briefly for the experts, but keep it human)**  
  "So, to the philosophers here – yes, I know Hume started the ‘convention’ conversation, and I hear Scanlon’s Principle F might be lurking in Theo’s footnotes somewhere... **(Wink at the philosophy table)** – but for the *rest* of us? What Theo’s digging into is why this moment isn’t just tradition. It’s an **act of self-creation.** You’re defining the people you commit to becoming.  

  **(Focus intensely on the couple, emotional crescendo)**  
  "And that’s why this promise holds, especially on the hard days. Not just because we’re all watching, but because *you* will know. On days when patience is thin or the road is steep, you’ll remember: *‘I chose this. I chose you. I chose* us*.’* That’s the anchor. That’s the weight Theo’s been writing about. It’s not a fiction. It’s the most real thing you’ll ever do.  

  **(Raise glass higher)**  
  "So here’s to [Daughter] and Theo – not just for making a promise today, but for having the courage to choose who they will be, together, every single day after this one. May your lives be a testament to the profound, beautiful weight of that choice. Cheers!"

  ---

  **Why this works:**

  1.  **Respects Theo's Work:** Name-checks Hume (social convention) and Scanlon (whose contractualism focuses on the *reasons* we owe others, relevant to "secret promise" scenarios). Uses accurate layman's terms ("not just a prediction/contract," "act of self-creation," "betrayal of yourself"). Philosophers will recognize the concepts (Principle F is Scanlon's core promise-keeping principle) without needing jargon. Explicitly rejects the "contract" and "social fiction" ideas Theo dislikes.
  2.  **Accessible to Non-Philosophers:** Uses clear metaphors ("betting on your future self," "anchor," "weight"). Grounds the philosophy in the *emotional* reality of marriage ("courage," "hard days," "choosing who you will be"). The parent's personal "thinking hard" journey makes it relatable.
  3.  **Centers the Couple & Their Promise:** Every philosophical point loops back to *their* specific commitment. The "secret promise" example highlights the *personal* weight Theo cares about, directly applicable to marital fidelity. The "choosing who you will be" framing makes the vow deeply personal and enduring.
  4.  **Avoids Landmines:** Doesn't call marriage a fiction or just a contract. Positively frames the public aspect ("witnesses") while emphasizing the *internal* commitment as the true source of obligation. Addresses Theo's mom's worry implicitly by celebrating the promise's reality.
  5.  **Tone:** Warm, slightly self-deprecating ("noodling," "oversimplify"), heartfelt, and ultimately uplifting. The brief, lighthearted moments ("loud dinner," "dishes") prevent it from feeling like a lecture.
  6.  **Structure:** Flows naturally from personal anecdote -> philosophical hook -> core insight -> application to marriage -> emotional conclusion/toast. Pacing feels right for a reception.

  **Delivery Tip:** Practice the rhythm. Pause slightly after the heavier philosophical points ("betrayal of yourself," "act of self-creation") to let them land before moving to the emotional payoff. Look at Theo when mentioning his work, and at both of them during the parts about their commitment. Your genuine emotion will sell it more than perfect philosophical precision. Good luck! They'll love it.
