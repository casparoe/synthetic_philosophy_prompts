  Right, so the memo's structure should probably: first validate both ethical positions, then expose why neither works alone, before landing on a modified approval that tightens oversight. The modifications should directly address the rights-based concerns - like mandatory euthanasia at pain score thresholds - while acknowledging this doesn't fully resolve the species-line problem. 

  Key phrasing challenges: how to say "your Kantian colleague has a point" without alienating the scientists, and how to justify continuing painful research while admitting it's ethically messy. Might borrow Nozick's own "this line is arbitrary but necessary" pragmatism while adding contemporary safeguards he couldn't have envisioned. 

