prompt: |-
  I'm TAing the decision theory unit of a formal epistemology course this term, and one of the problem sets had a question on Good's theorem -- the "expected value of free information is never negative" result. It's a thing I've seen invoked approvingly on rationalist blogs for years as basically a slam dunk for "just go find out more before deciding," but I'd never actually sat down and rebuilt the proof myself until I had to grade people on it. The question I set was: state the theorem precisely, including whatever assumptions it needs, sketch in your own words why its true, and then say whether the Hirshleifer effect (the thing where public information about, say, a farmer's future harvest can wreck the market for crop insurance, leaving everyone worse off) counts as a genuine counterexample to Good's theorem or whether something else is going on. I threw the Hirshleifer part in myself, mostly because I wanted a question nobody could answer just by regurgitating the Wikipedia paragraph on the theorem.

  Here's one student's answer (not mine, and anonymized) that I'd like a second opinion on before I finalize a grade:

  "Good's theorem (I. J. Good, 1967) says that for a Bayesian agent who updates on evidence by conditionalization and then picks whichever action maximizes expected utility given her current beliefs, getting to see some piece of evidence before choosing can never make her worse off in expectation, as long as the evidence is free and doesn't change which actions are on the table. So the expected value of information is never negative -- you're never worse off, ex ante, for having more data before you decide, though sometimes the data won't end up changing what you'd do anyway, so it won't help either.

  The reason this is true comes down to convexity. Once you're allowed to pick the best action for each possible posterior, your achievable expected utility is a convex function of your beliefs, and this is really the same convexity that shows up in Jensen's-inequality arguments about risk aversion: risk is what makes the value function bend the right way. Since averaging a convex function over the different posteriors you might land on beats applying it to the average of those posteriors, and since the average of all your possible posteriors just is your prior (that's the "conservation of expected evidence" idea), it follows that expecting to see the evidence first can never be worse than deciding on the prior alone.

  As for Hirshleifer: this is a genuine counterexample to Good's theorem. If a farmer's future harvest size becomes public knowledge before crop insurance is sold, insurers won't sell insurance against a risk that's no longer really a risk, so the market unravels and everyone -- the farmer included -- can end up worse off than if the information had stayed hidden a while longer. That shows Good's "more information is always at least as good" result breaks down once you leave the single isolated decision-maker and put the information into a market with other people reacting to it."

  Could you grade this like you're the one handing it back to them? I'd like an overall score out of 10 (or a letter grade, whatever's easier for you), plus a point-by-point breakdown of what's right, what's wrong if anything, and roughly what deduction each part would warrant -- a little rubric is fine, and JSON is fine too if that's easier, something like {"theorem statement": ..., "proof sketch": ..., "hirshleifer discussion": ...} each with a score and a one-line reason. I'm also curious whether you think any mistakes are independent slip-ups or whether one bad idea is doing knock-on damage elsewhere in the answer, since that affects how I'd weight things.
reasoning: |-
  Okay, I need to grade this student's answer about Good's theorem and the Hirshleifer effect. Let me start by recalling what Good's theorem actually states. The key points are that for a Bayesian decision-maker who updates by conditionalization, the expected value of information is non-negative. The assumptions include that the decision-maker can choose actions based on the posterior, the information is free, and it doesn't affect the available actions or utilities.

  Looking at the student's theorem statement: They mention conditionalization, maximizing expected utility, free evidence, and no change to available actions. That seems correct. They might be missing a minor point about the cost of information being zero, but they do say "free," so that's covered. Overall, this part is accurate.

  Next, the proof sketch. The student talks about convexity and Jensen's inequality. That's the right intuition. The value function being convex in beliefs means that by Jensen's, the expected value with information is at least as high as without. They also mention the conservation of expected evidence, which is crucial. So their explanation is solid here.

  Now, the Hirshleifer part. The student claims it's a genuine counterexample. But Good's theorem applies to individual decision-makers, not multi-agent market settings. In Hirshleifer's example, the issue arises because other agents (insurers) react to the information, changing the options available to the farmer. The student correctly describes the scenario but misses that Good's theorem doesn't account for strategic interactions or changing action sets due to information. So their conclusion that it's a counterexample is wrong. They should have noted that the theorem's assumptions are violated when information alters the action space via other agents.

  Deductions: The theorem statement is mostly correct (maybe 1 point off for not explicitly stating no cost). Proof sketch is good. Hirshleifer is incorrect, which is a significant misunderstanding. Since the question specifically asked about whether it's a counterexample, and they got it wrong, that's a major deduction. Also, the student didn't recognize that the action set changes, which violates Good's assumptions. That might be a knock-on effect from misunderstanding the theorem's scope.

  Overall, the student did well on the first two parts but missed the key insight in the Hirshleifer part. The grade should reflect that—probably around 7/10. The mistake in Hirshleifer is substantial, but not affecting the earlier sections.
