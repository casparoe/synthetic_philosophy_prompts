prompt: |-
  I've spent years reading LessWrong and the EA Forum, and last year that finally turned into something concrete: I joined the small committee that allocates a pooled donation fund that four of us run out of a shared spreadsheet each giving season. We take our cost-effectiveness estimates seriously, and this cycle we've hit a snag that I don't think our usual "expected value per dollar" heuristic can resolve.

  One applicant, a small biosecurity research collective, submitted an impact model that isn't a single point estimate but an open-ended list of mutually exclusive future scenarios, each roughly half as likely as the one before it, in which the estimated welfare effect of funding them alternates between very large gains (from a class of incident being averted) and very large harms (from information hazards and dual-use spillover), with the size of each swing growing even as its probability shrinks. When one member added the terms in the order the applicant listed them, she got a solidly positive figure; when another paired every "harm" scenario with the very next "benefit" scenario before running the total, he got a much smaller and less flattering one; a third member's grouping made the running total climb without bound. Nobody did anything illegitimate, and nobody disputes the applicant's underlying probabilities or payoffs -- this isn't a case of hidden overconfidence. I recognize the shape of this now: it's Nover and Hájek's "Pasadena game." Because the sum is only conditionally convergent, the Riemann rearrangement theorem guarantees that reordering the scenarios -- and no reordering is any more official than the applicant's own -- can drive the total to whatever value you like, or to none at all. No further biosecurity due diligence is going to fix that.

  Could you draft the roughly one-page decision memo I'll circulate to the other three members before we reconvene next Tuesday? I need a specific recommendation -- fund, decline, or fund conditional on the applicant restructuring the model into something that converges regardless of ordering -- with a firm deadline attached if you go the conditional route, plus a short general policy the four of us can reuse whenever a future proposal's expected value turns out to hinge on how terms are grouped rather than on any further fact about the world. One member will feel steamrolled if the memo simply treats order-sensitivity as automatically disqualifying, so please state the strongest honest version of her objection first -- that refusing to fund anything whose expected value isn't rearrangement-invariant is itself a substantive, unexamined decision rule rather than a neutral default -- before explaining where you actually come down and why.
reasoning: |-
  Okay, the user is part of a donation committee facing a tricky problem with a biosecurity grant application. They've encountered a Pasadena game scenario where the expected value changes dramatically based on how you order the scenarios in the calculation. Let me unpack this.

  First, the core issue is mathematical: the applicant's model uses a conditionally convergent series. That means rearranging the terms can give any sum you want—positive, negative, or divergent. The committee members got different results just by grouping scenarios differently. No amount of due diligence will fix that; it's inherent to the model structure.

  The user needs a decision memo with three key elements: a clear recommendation (fund/decline/conditional), a policy for future cases, and a rebuttal to one member's likely objection. The objection is important—one member thinks rejecting order-sensitive models isn't neutral but a substantive choice itself. I should address that fairly before explaining why caution is still necessary.

  Hmm... conditional funding seems most reasonable. The science might be sound, but the presentation makes evaluation impossible. Asking them to restructure the model—maybe using absolute convergence or bounded payoffs—gives them a chance to fix it. But there should be a tight deadline; grant cycles wait for no one.

  For the policy: future proposals should either bound their outcome ranges or use absolute convergence. Unbounded conditionally convergent models are unworkable for funding decisions. That's not bias—it's about having a basis for comparison. 

  The memo should acknowledge the objector's point: yes, requiring rearrangement-invariance is a choice. But it's a necessary one because funding decisions require robust estimates. Letting order dictate outcomes means the committee isn't actually evaluating impact—just the applicant's narrative sequence. That undermines the whole point of evidence-based giving.

  Also, the tone matters. These are thoughtful people who've read LessWrong; they'll respect careful reasoning. No jargon without explanation, but no oversimplifying either. "Conditionally convergent" needs defining, but briefly.
answer: |-
  ## MEMORANDUM  
  **To:** Pooled Fund Allocation Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Decision Recommendation & Policy Framework for Proposal #BS-2024 (Biosecurity Collective)  

  ---

  ### I. The Core Issue: Conditional Convergence  
  Applicant BS-2024’s impact model exhibits **conditional convergence**: its expected value (EV) changes arbitrarily based on scenario ordering. This is a mathematical inevitability (per the Riemann rearrangement theorem), not an error in due diligence. Key facts:  
  - All committee members calculated valid EVs using the applicant’s own probabilities/payoffs.  
  - Results ranged from **strongly positive** (sequential order) to **weakly positive** (paired order) to **divergent** (alternate grouping).  
  - No "true" EV exists; the value is order-dependent.  

  This mirrors the "Pasadena game" paradox (Nover & Hájek): when payoffs grow unbounded while alternating in sign and probabilities halve, no unique EV can be assigned.  

  ---

  ### II. Strongest Objection: Is Rejection an Unjustified Bias?  
  *As articulated by [Member Name] and deserving serious consideration:*  
  > *"Requiring rearrangement-invariance imposes a substantive philosophical standard, not a neutral default. By rejecting conditionally convergent models, we privilege a specific decision theory (e.g., bounded utility or absolute convergence) that may exclude high-stakes, low-probability interventions central to existential risk work. If the applicant’s probabilities and payoffs are accepted, refusing to compute an EV *at all* is itself a value-laden choice—one that risks underfunding crucial frontier science."*  

  **This objection is valid:** Demanding order-invariance *is* a normative stance. Ignoring it could incentivize framing effects over rigorous modeling.  

  ---

  ### III. Recommendation: **Conditional Funding**  
  **Approve funding contingent on the applicant restructuring their impact model within 10 business days to produce a rearrangement-invariant EV.**  

  #### Why conditional?  
  1. **The science may be sound, but the evaluation framework is broken.**  
     - The model’s core probabilities/payoffs may be defensible, but its unbounded, alternating structure makes fair comparison with other proposals impossible.  
  2. **Feasible fixes exist:**  
     - **Absolute convergence:** Cap outcome magnitudes (e.g., "no scenario exceeds ±X welfare units").  
     - **Bounded utility:** Implement diminishing marginal utility for extreme payoffs.  
     - **Tail-truncation:** Set a probability threshold (e.g., 99% of EV mass) and aggregate remaining tails.  
  3. **Accountability:** A 10-day deadline (aligning with our final meeting) ensures timely resolution without derailing the cycle.  

  #### Why not decline outright?  
  - Premature rejection risks discarding high-impact work due to a fixable presentation flaw.  
  - Demonstrates good faith to applicants in nascent fields where modeling norms are evolving.  

  #### Why not fund as-is?  
  - Funding order-dependent EVs undermines our cost-effectiveness mandate. We cannot defend allocating dollars when the EV could be manipulated to any value.  

  ---

  ### IV. Policy for Future Proposals  
  **Adopt the following standard for all future evaluations:**  
  > *"Impact models must yield expected values that are rearrangement-invariant. Proposals presenting conditionally convergent series (i.e., unbounded payoffs with alternating signs and declining probabilities) will be deemed non-evaluable unless restructured to satisfy absolute convergence or bounded utility. Applicants will be given one resubmission window (≤7 days) to address this."*  

  #### Justification:  
  - **Practical necessity:** Funding requires comparable, order-agnostic EVs.  
  - **Precedents:** Decision theory (e.g., Savage) and financial mathematics treat conditionally convergent expectations as pathological.  
  - **Procedural fairness:** Eliminates arbitrariness in committee deliberations and applicant framing.  
  - **EA alignment:** Preserves our commitment to evidence-based giving while avoiding paralysis from unbounded utilities.  

  ---

  ### V. Next Steps  
  1. **Immediate action:** Notify applicant BS-2024 of conditional approval and restructuring requirements (deadline: [Date + 10 days]).  
  2. **Committee vote:** Formal ratification of this decision and policy at our Tuesday meeting.  
  3. **Documentation:** Append this memo to BS-2024’s file and add the policy to our evaluation handbook.  

  **Approval of this framework ensures we uphold rigor without dismissing frontier work—a balance critical to our fund’s integrity.**  

  ---  
  **Attachments:**  
  - Summary of Pasadena game paradox  
  - Examples of bounded utility functions for biosecurity models  

  [Your Name]  
