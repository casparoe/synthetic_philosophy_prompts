answer: |-
  That's a fantastic rabbit hole! You've pinpointed a crucial tension within Smith's thought and its relationship to Singer. Let's break it down strictly from Smith's own psychology and principles:

  1.  **The Impartial Spectator's Veto:** Smith's core insight is that while our *sympathy* (fellow-feeling) is weak and naturally partial (stronger for those near and dear), our *moral judgment* involves an internalized "impartial spectator." This spectator evaluates our sentiments and actions from a distanced, objective perspective. In the China/finger scenario:
      *   **Sympathy is weak:** The man feels little direct distress for the distant millions.
      *   **The Spectator recoils:** However, the *idea* of actively choosing the finger over the millions is morally abhorrent when viewed impartially. It violates a fundamental sense of proportion and justice. It's *disproportionate*. The spectator acts as a powerful veto against extreme selfishness or cruelty, even when sympathy is absent.

  2.  **The Distinction Between Refusing Harm and Demanding Sacrifice:**
      *   **Smith's Scenario (Refusing Active Harm):** The man is asked *not to commit an act* (trading lives for his finger) that the impartial spectator deems monstrously disproportionate. This is a *negative* duty: "Do not actively cause/disproportionately allow vast harm for trivial gain."
      *   **Singer's Scenario (Demanding Active Sacrifice):** Singer demands a *positive* duty: "You *must act* to prevent significant harm to distant others, even at non-trivial personal cost (e.g., sacrificing luxury goods equivalent to saving a life)." This requires positive effort and sacrifice, not just refraining from an abhorrent trade.

  3.  **Smith's Grounds for Resisting Singer's Leap:**
      *   **Natural Partiality is Proper:** Smith explicitly argues that it is natural, proper, and even necessary for society that our active efforts and stronger affections are concentrated on those within our "sphere":
          *   "Every man... is first and principally recommended to his own care." (TMS VI.ii.1.1)
          *   "The care of... our children, our kinsmen, our friends, our benefactors... Nature has... rendered... peculiarly dear to us." (TMS VI.ii.1.2)
          *   We have a stronger *duty* to act for those close to us. Failing to help a drowning child *before us* would be blameworthy; failing to prevent the death of a distant, unknown child due to poverty might be lamentable but not necessarily a violation of strict *duty* in Smith's system.
      *   **The Spectator Judges Propriety, Not Utilitarian Calculus:** The impartial spectator judges the *propriety* of our sentiments and actions based on context and role, not by aggregating total utility. Sacrificing your life for a stranger might be heroic but *imprudent* and beyond duty. Sacrificing your child for strangers would likely be deemed *improper* by the spectator, violating natural affections. The spectator moderates our passions to fit the situation and our relationships, it doesn't demand we maximize global good.
      *   **The Demands of "Distant Beneficence":** Smith acknowledges a general duty of beneficence, but it is limited and tiered:
          *   "The wise and virtuous man is at all times willing that his own private interest should be sacrificed to the public interest... But to sacrifice... the greater interest of the universe to any particular interest is not agreeable." (TMS VI.ii.3.3) *However*, this "greater interest" is abstract. His focus remains on the *willingness* to sacrifice *if necessary for the public good (often meaning society around you)*, not an active duty to constantly calculate and sacrifice for the maximally distant good.
          *   Active beneficence is strongest where the connection is strongest and the ability to effect change is clearest. Distance (physical and relational) weakens both the felt sympathy and the *practical imperative* for active sacrifice judged by the spectator in context.
      *   **Sustainability of Moral Sentiment:** Smith likely believed that a morality demanding constant, significant sacrifice for distant strangers, overriding all natural partiality, would be unsustainable and potentially destructive to the local bonds that hold society together. The spectator ensures justice and prevents monstrosity, but it doesn't mandate universal, demanding altruism.

  4.  **Where Smith's Logic Creates Tension (and Might Lean Towards Singer):**
      *   **The Spectator's Sense of Proportion:** If the spectator recoils at the *disproportionality* of trading millions for a finger, doesn't it also recoil at the disproportionality of valuing a trivial luxury (like expensive coffee daily) over saving a life *if the means to do so are readily available*? The *principle* of disproportion could be extended.
      *   **The Spectator's Universality:** While filtered through the individual's understanding, the spectator aims for impartiality. Wouldn't a *truly* impartial view consider the suffering of the distant stranger as morally relevant as the suffering of the nearby stranger *if the cost to alleviate it is the same*? Smith might counter that the spectator *inhabits* a social being with natural affections, so pure impartiality is impossible and unnatural.
      *   **The "Given the Choice" Element:** Smith frames it as a hypothetical choice presented to the man. Singer frames everyday choices (e.g., donating) as equivalent to the drowning child scenario. If the spectator condemns the active trade *when presented*, might it also condemn passive inaction *when the opportunity and knowledge are present*? Smith's emphasis on natural partiality and tiered duties is his main counter here.

  **Conclusion: Strictly from Smith's Principles, He Has Grounds to Resist Singer's Leap.**

  Smith provides robust internal grounds to resist Singer's demanding positive duty of rescue for distant strangers:

  1.  **The Impartial Spectator's Role:** It primarily acts as a *veto* against extreme, disproportionate selfishness/harm, not as an *imperative* for demanding positive sacrifice for distant others.
  2.  **Natural Partiality:** Smith explicitly defends the moral propriety and social necessity of prioritizing those near and dear. Our strongest *duties* to act are local.
  3.  **Judging Propriety, Not Maximizing Utility:** The spectator judges the appropriateness of sentiment and action within context and relationships, not by a global utilitarian calculus.
  4.  **Limited Duty of Beneficence:** Beneficence is a general virtue but its active demands are strongest where connection and ability are clearest. Distance weakens the imperative for *demanding* sacrifice.

  **However, the tension is real.** The logic of the impartial spectator *could* be pushed towards Singer, especially on the grounds of disproportionality. If the spectator condemns valuing a finger over millions *because it's grotesquely disproportionate*, it might also condemn valuing minor luxuries over saving lives *if the connection is made clear and the action is feasible*. Smith would likely counter that:

  *   The connection is rarely that clear or immediate in daily life.
  *   The demands of local relationships and duties take precedence.
  *   A morality demanding constant sacrifice for distant strangers undermines the natural sentiments that ground virtue and society.

  Ultimately, Smith's system is designed to explain and justify the observed morality of 18th-century commercial society, with its strong local bonds and limited global awareness. Singer's argument leverages modern capabilities (global information, efficient aid organizations) and a rigorous utilitarian framework to demand more. While Smith's impartial spectator provides the *seed* of universal moral consideration that Singer cultivates, Smith's deep commitment to the propriety of natural partiality and tiered duties gives him the philosophical resources to resist Singer's demanding conclusion. He would likely see Singer's duty as an admirable but ultimately impractical and potentially unnatural over-extension of the moral sentiment.
