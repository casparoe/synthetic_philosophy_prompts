  I should break down each case. For Black's spheres, the properties are intrinsic (size, material) and extrinsic (distance). The relation "being 3 miles from the other" is symmetric. But is spatial relation a genuine property? Some philosophers argue that space is a background, so the relation doesn't count. Others say it does. The spheres could swap places without change, suggesting no haecceity. Weak discernibility here might be controversial because it relies on spatial relations, which aren't intrinsic.

  Now, quantum mechanics. Electrons in an entangled state have no individual identities. The spin singlet state is symmetric. The relation "has opposite spin to" is symmetric and irreflexive. But in quantum mechanics, particles are identical in a stronger sense—they lack individuality. Permuting them doesn't change the system. Weak discernibility here uses quantum relations, which are fundamental, not dependent on space. So it's a more robust example of weak discernibility because it's built into the theory.

  The key differences: the spheres depend on space, which might be contingent. Electrons' relational properties are inherent to their quantum state. Also, the electron case is empirically validated, making it a real-world problem. Black's spheres are hypothetical and might not apply if space is relational.

