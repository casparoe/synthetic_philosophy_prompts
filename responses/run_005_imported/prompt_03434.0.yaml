  At first glance, Leibniz seems to align with Lewis because his CIC doctrine implies Adam couldn't have been different - any change would make him a different individual. This resembles Lewis's denial that individuals have properties in other worlds. But the comparison gets complicated because Leibniz's worlds are fundamentally different - they're conceptual rather than concrete like Lewis's.

