prompt: |-
  So I've been going down a metaethics rabbit hole on my own for the last few weeks (no philosophy background, just a bunch of SEP articles I had to read like three times each and way too many youtube videos), and I keep getting stuck on the Frege-Geach problem for expressivism. I get the basic shape of it: if "lying is wrong" just means something like "boo, lying!", that seems fine when someone says it on it's own, but then you get an argument like "if lying is wrong, then getting your friend to lie for you is wrong; lying is wrong; therefore getting your friend to lie for you is wrong," and nobody's booing anything in that first half of the conditional, yet the sentence has to mean the same thing there as it does standing alone for the argument to actually work as modus ponens. Every intro-level explanation I've found just says something like "expressivists fixed this by making attitudes embeddable, e.g. by talking about consistency between plans, or it being inconsistent to disapprove of A without disapproving of A-and-B," and then just moves on like that obviously settles things. But when I try to actually picture what it means for two feelings to be "inconsistent" the way two beliefs can be, or what attitude is even supposed to be expressed by something like "lying is not wrong," I get lost, and I've never seen anyone really push on it hard.

  Could you write me a dialogue between an expressivist and a moral realist (or cognitivist, not totally sure which label is technically right) who are both genuinely sharp and actually hash this out? I don't want the realist to just be there to say "gotcha, it's just a feeling," and I don't want the expressivist to just namedrop a solution and wave their hands — I want them to actually walk through the mechanics of a real attempted answer (something in the spirit of what Blackburn or Gibbard tried, consistency among attitudes or plans or whatever) and have the realist find the actual weak joint in it and press on that specifically, with the expressivist either patching it or honestly conceding a limitation. Keep it going back and forth for a while, with each one really responding to what the other just said instead of both sides just restating their opening position, and use a fresh example instead of the lying one since that's the one every textbook already reaches for. Basically I want to see whether expressivism actually has an answer here or if it's just relabeling the problem in fancier words.
