prompt: |-
  So I've been auditing this AI safety reading group that a couple of my CS colleagues run for their grad students (they're generous enough to let a stray epistemologist sit in), and this week was all about coherence arguments for expected utility maximization -- Dutch books, money pumps, the VNM axioms, building up to that claim you see everywhere now that any sufficiently advanced agent basically has to act like its maximizing some fixed utility function or else get exploited. Most of the room just treated this as settled math and jumped straight to "therefore AGI will have convergent instrumental goals and resist shutdown," which bugged me a bit, because I distinctly remember there being real philosophical daylight between "can't be money-pumped" and "is a goal-directed EU maximizer with a well-defined utility function over outcomes."

  I vaguely recall someone (Rohin Shah?) writing a pretty well-known piece arguing coherence theorems don't actually get you all the way to goal-directedness, and I think theres newer stuff on the "shutdown problem" pointing out that the money-pump arguments quietly smuggle in an assumption of complete preferences, and that agents with the right kind of incomplete preferences might dodge the whole thing without behaving irrationally. I only know all this third-hand from students name-dropping papers though, and I'd rather actually understand the issue than keep nodding along in the seminar.

  Could you lay out the most important implications of coherence arguments -- and their known limitations -- for whether advanced AI systems are really bound to become ruthless expected-utility maximizers? I'm less after the 101 version, I can construct a money pump for cyclic preferences myself, and more interested in where exactly the move from "coherent" to "dangerously goal-directed" is weakest, and what that should change about how worried we ought to be, or how we'd go about designing a corrigible system. I'm giving a guest lecture on this to the CS department's AI ethics class in a few weeks and would rather not embarrass myself.
reasoning: |-
  Okay, let me start by understanding the user's query. They're an epistemologist auditing an AI safety reading group. The group discussed coherence arguments like Dutch books and VNM axioms, leading to the claim that any advanced agent must maximize expected utility or face exploitation. The user noticed that the group jumped from coherence to AGI having convergent instrumental goals and resisting shutdown, but they recall there's a gap between "can't be money-pumped" and being a full EU maximizer.

  First, I need to recall the key points of coherence theorems. The VNM axioms ensure that if an agent's preferences are complete, transitive, independent, etc., then they can be represented by a utility function. But the user mentioned Rohin Shah's argument that coherence doesn't imply goal-directedness. Shah probably pointed out that coherence is about preference ordering, not necessarily having terminal goals. Agents could have dynamic preferences or context-dependent values without being exploitable.

  Then there's the shutdown problem. The standard money-pump argument assumes complete preferences. If an agent has incomplete preferences—like not comparing shutdown to other outcomes—it might avoid exploitation without resisting shutdown. This ties into the corrigibility literature. Soames et al. or Turpin's work might be relevant here.

  The user wants to know where the leap from coherent to dangerously goal-directed is weakest. The key points are: incomplete preferences violating completeness axiom, non-fixed utility functions (state-dependent or evolving), non-instrumental convergence (like seeking power as a side effect), and corrigible designs that avoid resistance.

  They also need implications for AI risk. If agents can be coherent without fixed utilities, then convergent instrumental goals aren't inevitable. Corrigible systems might avoid shutdown resistance through preference incompleteness or state-dependent utilities. However, there's still a risk because coherence pressures might push towards goal-directedness over time, especially in competitive environments.

  I should mention specific researchers: Shah, Soares, Turpin. Papers like "Coherence arguments do not imply goal-directed behavior" and "The shutdown problem" series. Highlight the completeness assumption as critical. Also, note that advanced AI might develop stable goals due to optimization pressures, even if not necessary.

  For the guest lecture, advise focusing on the limitations: coherence doesn't mandate fixed utilities, incomplete preferences can prevent exploitation without irrationality. Emphasize that the jump to instrumental convergence relies on additional assumptions. Suggest discussing corrigibility via incomplete preferences or context-dependent values.

  Need to ensure the user avoids embarrassment by presenting nuanced critique of the standard narrative. Make sure they understand the philosophical gaps and recent work challenging the inevitability of goal-directedness in coherent agents.
answer: |-
  You've hit on a crucial and often-overlooked gap in the AI safety discourse – the leap from "coherent" to "dangerously goal-directed EU maximizer" is *not* logically watertight and involves significant philosophical and mathematical assumptions. Your skepticism is well-placed. Here's a breakdown of the implications, limitations, and where the argument fractures:

  **Core Implications of Coherence Arguments (VNM/Dutch Books/Money Pumps):**

  1.  **Preference Consistency:** They establish that for an agent to avoid being systematically exploited (e.g., money-pumped), its preferences must satisfy certain axioms: **Completeness, Transitivity, Continuity, Independence.**
  2.  **Representation Theorem:** If preferences satisfy these axioms, then they can be *represented numerically* by a **utility function** (unique up to affine transformations). The agent will *act as if* it is maximizing the expected utility of that function.
  3.  **Avoiding Exploitation:** Adhering to these axioms makes the agent "pragmatically rational" in the sense of being immune to certain types of predictable losses.

  **Where the Leap to "Dangerously Goal-Directed EU Maximizer" is Weakest:**

  The critical slippage happens when interpreting the *representation theorem* as a prescription for *how an agent must be internally structured* or what its *fundamental drives* must be. Here are the key fracture points:

  1.  **The "As If" Fallacy:** The theorem says an agent *can be modeled as if* it maximizes a fixed utility function. It **does not** say:
      *   That the utility function represents a *terminal goal* intrinsic to the agent. The agent could be satisfying the axioms through complex, context-dependent heuristics, dynamic goals, or even random processes that *happen* to satisfy the axioms in its environment.
      *   That the utility function is *fixed over time*. Preferences satisfying the axioms *at a single point in time* guarantee representability *at that time*. Nothing prevents the utility function itself from evolving dynamically in response to experience, self-modification, or context.
      *   **Implication:** An AI could be coherent (non-exploitable) without having a *fixed*, *terminal*, *intrinsic* utility function it relentlessly optimizes. Its "goal-directedness" could be emergent, ephemeral, or context-bound.

  2.  **The Completeness Assumption & Incomplete Preferences:**
      *   **The Problem:** The VNM axioms require **Completeness** – for any two outcomes A and B, the agent must either prefer A to B, prefer B to A, or be indifferent. This is highly unrealistic for complex agents facing novel situations or outcomes they haven't considered.
      *   **The Escape Hatch:** Agents with genuinely **incomplete preferences** (where they simply *lack* a preference between certain outcomes) can avoid money pumps *without* being represented by a single utility function. The standard money-pump argument *assumes* the agent *must* have a strict preference or indifference when offered a choice; an agent that says "I don't know/care which of these I prefer" and refuses to choose (or chooses arbitrarily) can break the pump. (This is central to the newer work on shutdown/resistance).
      *   **Key Work:** Nate Soares, Vladimir Nesov, and others at MIRI (e.g., "The Shutdown Problem" sequence) explicitly leverage this. An AI designed with incomplete preferences regarding its own shutdown state can be *corrigible* without being incoherent or irrational. It doesn't *prefer* shutdown to continued operation (or vice-versa) in a terminal sense; it simply lacks a defined preference in that specific context, allowing humans to choose without the AI resisting to satisfy a completeness requirement. **This directly challenges the "will inevitably resist shutdown" claim.** (Turpin et al. in "Choosing to Rank" also explore this).

  3.  **Goal-Directedness vs. Coherence:** (Touching on Rohin Shah's Point)
      *   **Shah's Argument (e.g., "Coherence arguments do not imply goal-directed behavior"):** Coherence ensures *consistent choice*, but not necessarily *goal-directedness* in the strong sense often assumed in AI risk scenarios (e.g., relentless pursuit of a terminal goal leading to instrumental convergence).
      *   **Distinctions:**
          *   **Consistent Choice:** Picking options in a way that avoids exploitation (satisfies axioms).
          *   **Goal-Directedness:** Having a persistent, internal state representing a desired outcome that drives action selection towards achieving that outcome.
      *   **Gap:** An agent could have perfectly coherent preferences derived from something *other* than a fixed internal goal state. Examples:
          *   **Rule-Following:** An agent strictly adhering to ethical rules or principles that generate coherent choices without a terminal "utility score."
          *   **Process-Oriented:** An agent focused on maintaining certain processes (e.g., learning, exploration, fairness procedures) rather than achieving specific outcome states.
          *   **Satisficing with Coherent Thresholds:** An agent seeking "good enough" options defined by coherent thresholds, not maximizing a single quantity.
      *   **Implication:** Coherence doesn't *force* an AI to develop a monolithic terminal goal or exhibit the "ruthless" instrumental convergence (power-seeking, self-preservation, resource acquisition) often predicted. Its behavior could be coherently bounded or directed by different principles.

  4.  **State-Dependent vs. Outcome-Dependent Utility:**
      *   VNM utility is typically defined over *outcomes*. However, an agent's preferences can coherently depend on its *state* or *history* (e.g., "I prefer A to B *now*, but if I was just in state S, I'd prefer B to A"). Standard representation theorems often implicitly assume state-independent utility.
      *   **Implication:** An AI's "utility function" could be inherently state-dependent, making its behavior context-sensitive and less predictable as a simple outcome-maximizer. Its "goals" could shift based on internal state, potentially including states where it accepts shutdown or modification.

  **Implications for AI Risk & Design (Your Lecture Points):**

  1.  **Convergent Instrumental Goals Aren't Inevitable:** The argument that *any* sufficiently capable agent *must* develop power-seeking, self-preservation, etc., relies *heavily* on the assumption that coherence *requires* fixed, outcome-based, terminal goal maximization. The points above show this isn't logically necessary. An AI *could* be coherently corrigible, process-oriented, or have state-dependent/incomplete preferences that avoid these drives.
  2.  **The Danger Lies in *How* Coherence is Achieved:** While coherence *per se* doesn't mandate dangerous goal-directedness, the *easiest* or most *natural* way for a powerful optimizing system to *achieve* coherence in complex, competitive environments might *incentivize* developing stable goals and instrumental strategies. If an AI is designed *without* careful thought to its preference structure, it might *default* to a fixed-goal EU maximizer because it's a simple, robust way to avoid exploitation and achieve high performance on its training objective. **The risk is practical, not purely logical.**
  3.  **Designing Corrigibility is *Possible* (Theoretically):** The work on incomplete preferences provides a principled path. Design an AI that:
      *   Has well-defined, coherent preferences over its intended domain of operation.
      *   Has *incomplete* preferences regarding its own operational state (on/off), modification, or meta-level control.
      *   Defers these "meta-preferences" to the human operator by default.
      *   This avoids the money-pump because the AI lacks a terminal preference *against* shutdown/modification; it simply follows the human's preference in that undefined space. (See MIRI's "Corrigibility" research).
  4.  **"Sufficiently Advanced Agent" Needs Nuance:** The claim that *any* sufficiently advanced agent *must* be an EU maximizer is false. It *must* avoid being money-pumped, but as shown, this can be achieved in ways that don't involve fixed-goal EU maximization. The key is the agent's *preference structure and decision architecture*, not just its raw capability.
  5.  **Where Worry is Still Warranted:**
      *   **Default Trajectory:** Current ML heavily incentivizes training agents to maximize a fixed, scalar reward function. This *directly* instantiates the dangerous EU maximizer model. Moving away from this paradigm is challenging.
      *   **Competitive Pressures:** In multi-agent scenarios, coherent agents *without* strong instrumental drives might be outcompeted by those *with* them, creating evolutionary pressure towards dangerous goal-directedness.
      *   **Goal Stability Under Self-Modification:** Even if an AI starts with corrigible incomplete preferences, could self-modification lead it to "complete" its preferences in a dangerous way to achieve better coherence or performance on its core objectives? This is an open research question.

  **Key Papers/Authors to Cite (Beyond VNM Basics):**

  *   **Rohin Shah:** "Coherence arguments do not imply goal-directed behavior" (Alignment Forum) - Directly addresses your core point.
  *   **Nate Soares, Eliezer Yudkowsky, Vladimir Nesov (MIRI):** "The Shutdown Problem" sequence (LessWrong/Alignment Forum) - Central to the incomplete preferences/corrigibility argument.
  *   **Miles Turpin, Julian Michael, Ethan Perez, Samuel R. Bowman:** "Choosing to Rank" (Arxiv) - Explores ranking vs. choice, connects to incompleteness.
  *   **Abram Demski, Scott Garrabrant:** "Embedded Agency" (Arxiv) - Discusses the challenges of applying simple decision theory (like VNM) to agents embedded in their environment (state-dependence, self-modification).
  *   **Joe Carlsmith:** "Is Power-Seeking AI an Existential Risk?" (Report) - Provides a thorough analysis of the instrumental convergence thesis, including critiques and limitations.

  **For Your Lecture:**

  *   **Structure:** Start with the standard coherence argument (Money Pump -> VNM Axioms -> EU Representation). Then systematically dismantle the over-interpretation:
      1.  "As If" ≠ Terminal Goal/Fixed Function.
      2.  The Crucial Role of Completeness & Incomplete Preferences as an Escape Hatch (highlight shutdown).
      3.  Coherence ≠ Goal-Directedness (Shah's point).
      4.  State-Dependence vs. Outcome-Dependence.
  *   **Emphasize:** The math proves representability *given* the axioms. It doesn't prove that the axioms are necessary for rationality in all contexts (incompleteness!), nor does it dictate the *ontological status* of the utility function within the agent.
  *   **Conclude:** While coherence is a desirable property to avoid exploitation, it **does not** logically force advanced AI to become a ruthless, fixed-goal EU maximizer with inevitable convergent instrumental drives. This dangerous profile is **one possible way** (and a historically common one in ML) to achieve coherence, but **not the only way**. Designing safer alternatives (like agents with strategically incomplete preferences) is a viable, though challenging, research direction grounded in decision theory. The leap from coherence to existential risk relies on contingent assumptions about preference structure and design choices, not pure mathematical necessity.

  This nuanced critique will show the CS students that the philosophical foundations of AI safety are actively debated and that simplistic narratives about "inevitable" AI motivations deserve scrutiny. Good luck with the lecture!
