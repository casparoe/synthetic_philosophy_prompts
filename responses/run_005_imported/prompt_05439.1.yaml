  The bass thump of terrible party music vibrated the cheap plastic cup in Elara’s hand. She scanned the crowded community hall – Dad beaming near the punchbowl, Aunt Mildred aggressively offering canapés – and knew she’d find him near the emergency exit. Leo, nursing a beer, staring into the middle distance like it owed him money.

  "Still calculating humanity's expiration date?" she asked, leaning against the wall beside him. The faint smell of stale smoke clung to the exit sign.

  Leo didn’t turn. "Just appreciating the statistical inevitability of this playlist causing actual brain damage. Exponential growth in bad decisions."

  Elara snorted. "Spare me the Doomsday schtick. It’s Dad’s party. Try smiling. It won’t kill you."

  "Statistically, *everything* kills you eventually," Leo muttered, finally looking at her. His eyes, the same hazel as hers, held that familiar mix of weary irritation and the ghost of intellectual excitement. "Unlike your cosmic fairy tales. Still banking on the universe obligingly inflating itself to make your existence probable?"

  Elara took a deliberate sip of her lukewarm Chardonnay. "It's not 'obliging,' Leo. It's inference. Bayesian updating with indexical uncertainty. If conscious observers are *possible*, and the universe is vast, then finding yourself existing *is* evidence for vastness. SIA isn't mystical, it's consistent."

  "Consistently *bonkers*," Leo shot back, pushing off the wall. "That's the problem with your Self-Indication Assumption. It dissolves into pure solipsism on steroids. Look, let's not rehash the whole Doomsday thing right now. Let's talk about your *other* favorite party trick: the Presumptuous Philosopher. Remember him? The guy who wakes up in a lab?"

  "Vividly," Elara said, her voice tightening slightly. They’d trodden this ground before, the grooves worn deep.

  "Okay," Leo leaned in, his voice dropping, intense. "Guy wakes up. Scientists say, 'Hey, we *might* have created ten copies of you, or a million. We flipped a coin. Heads, ten. Tails, a million.' Before they tell him the result, what should he believe? What’s the prior probability for heads or tails?"

  Elara sighed. "He starts with a fifty-fifty prior. Standard."

  "Right," Leo jabbed a finger. "Now, according to your precious SIA, *before* he knows the coin flip, he should think it’s *overwhelmingly likely* that tails came up, that there are a million copies! Because *if* there are a million, *he* is far more likely to *be* one of the observers existing! Right? That's the inference engine you endorse."

  "Yes," Elara said calmly. "Conditional on his existence as an observer, the hypothesis that allows for more observers like him is more probable. It’s simple reasoning from the inside."

  "Simple?" Leo’s laugh was sharp. "Elara, that’s not reasoning, that’s *magical thinking*! Why should the mere *possibility* of a million copies force him, sitting there as one single conscious point, to believe *with near certainty* that the million *actually exist*? He has *zero* evidence! The coin hasn't been read! All he knows is *he* exists. SIA tells him to conjure up 999,999 other versions of himself out of thin air, based purely on the abstract *potential* for them! That’s not science, that’s… cosmic narcissism! It demands belief in unseen multitudes just because you can imagine them. It turns 'I think, therefore I am' into 'I think, therefore there must be a gazillion mes!'"

  Elara held his gaze. She didn't flinch. "It demands updating based on the information available: 'I am an observer.' The hypothesis 'many observers exist' makes my specific observation – my existence – *less surprising* than the hypothesis 'few observers exist'. That's not narcissism, Leo, it's conditional probability. You accept it when it's not threatening your doomsday cult."

  Leo bristled. "Don't deflect. The *problem* is the sheer, unearned ontological weight SIA gives to mere possibility. It violates parsimony. It makes the universe bend over backwards to accommodate *us*."

  "And your Self-Sampling Assumption is a paragon of rigor?" Elara countered, her voice gaining an edge. She stepped closer, lowering her voice as a group of Dad’s colleagues wandered past. "You sample *one* observer, from *one* reference class. Sounds simple. Until I ask: *which* reference class, Leo? *That's* where SSA crumbles into dust, and you know it."

  Leo opened his mouth, but Elara pressed on. "Do you sample from all humans ever born? Then Doomsday says we’re doomed soon. Do you sample from all humans alive *now*? Suddenly, the argument evaporates. Do you sample from all conscious beings in the galaxy? In the universe? Across time? SSA gives you an answer *only* after you arbitrarily pick the boundaries of your little sampling box. It’s completely subjective! *That’s* your rock-solid foundation?"

  She gestured sharply with her cup. "The Presumptuous Philosopher *exposes* the weirdness of observer-centric reasoning, sure. But SSA just *hides* it behind a veneer of sampling that collapses the moment you touch it. My 'narcissism' at least forces me to confront the indexical uncertainty head-on. Your 'rigor' lets you pick whichever reference class gives you the existential dread you seem so fond of. Doomsday isn’t a prediction, Leo, it’s a *choice*. You *choose* the class that makes you feel special in your misery."

  Leo’s face flushed. "That's a cheap shot. The reference class problem is acknowledged. We try to define it reasonably—"

  "Reasonably?" Elara scoffed. "Define it 'reasonably' for the Presumptuous Philosopher *before* the coin flip. What's his reference class? 'Copies created in this experiment'? But he doesn't *know* how many there are! That's the point! Your SSA *can't function* without knowing the class size beforehand, which he doesn't! SIA *deals* with that uncertainty. Your SSA just pretends it doesn't exist until it bites you in the Doomsday scenario, where you conveniently define 'all humans ever' as the class to maximize the drama."

  They stood inches apart, the muffled thump of "Celebration" by Kool & The Gang seeping under the exit door. The air crackled with the old, unresolved tension. Leo searched for a retort, his jaw tight. Elara watched him, her cosmologist’s calm back in place, but her eyes held the sharp glint of someone who knew exactly where the cracks were in her brother’s intellectual armor.

  "At least," Leo finally ground out, "SSA doesn't force me to believe in a million invisible doppelgängers just to make my own existence statistically comfortable. That feels... desperate."

  Elara took another slow sip of wine. "And believing humanity is teetering on the brink because of a sampling assumption hinging on an arbitrary boundary you drew yourself? *That* feels like wisdom to you?" She offered a thin, challenging smile. "Different kinds of desperation, I suppose. Pass the existential dread, would you? I think Aunt Mildred’s heading this way with more mini-quiches."

  Leo didn’t laugh. He stared at her, the Presumptuous Philosopher still hanging, unresolved, in the space between them, a ghost only one of them could comfortably live with. The party noise swelled momentarily as the door opened, letting in a burst of laughter and the unmistakable aroma of cheap sherry trifle. The argument was far from over, but the battlefield had just gotten crowded.
