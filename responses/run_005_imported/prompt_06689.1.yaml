  Hmm, the core issue seems metaethical—it's about truthfulness in academic contexts and how instrumental reasons (like wanting an internship) interact with moral reasons. The user might be uncomfortable because their action, while individually pragmatic, contributes to a collective misrepresentation. The professor's use of the praise amplifies the dishonesty, giving it academic weight. 

