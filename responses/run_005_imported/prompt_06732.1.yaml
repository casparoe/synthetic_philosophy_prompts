prompt: |-
  I sit on my presbytery's candidates committee, which reviews ordination exams before they go to the floor. One candidate -- sharp guy, did a philosophy MA before seminary -- wrote in his atonement paper that he wants to take an exception to the Confession's language on penal substitution. His argument leans on that old David Lewis essay where Lewis tries to rescue the doctrine by comparing it to paying off someone else's debt, but then basically concedes the comparison only works if punishment doesn't have to fall on someone who actually deserves it -- which the candidate takes to mean that penal substitution survives only as a kind of legal fiction, not the real retributive justice the Confession seems to describe. Some commitee members want to call this a denial of an essential doctrine and end his process right there; others (myself half included, honestly, since I couldn't explain what "in our place" means any better than he does) think refusing exceptions like this would quietly screen out a lot of people who've actually thought it through. We report back to presbytery in two weeks -- can you draft the committee's recommendation memo: approve the exception, deny it, or send him back for revisions, with reasoning solid enough that both he and the stricter members would have to actually engage with it?
reasoning: |-
  Okay, the user is part of a presbytery's candidates committee reviewing a candidate's ordination exam. The candidate, who has a philosophy background, wants to take an exception to the Confession's language on penal substitution. His argument is based on David Lewis's essay that suggests penal substitution works like paying off someone else's debt but only if punishment doesn't require the person to deserve it. The candidate sees this as a legal fiction rather than real retributive justice. 

  The committee is split. Some think this is a denial of an essential doctrine and want to end his candidacy. Others, including the user, feel that denying such exceptions might screen out thoughtful candidates. The user needs a draft recommendation memo for the presbytery that either approves, denies, or asks for revisions, with solid reasoning that both the candidate and stricter members will engage with.

  First, I need to unpack the theological issues here. The Westminster Confession emphasizes penal substitution as Christ satisfying divine justice by bearing the punishment sinners deserve. The candidate's objection, via Lewis, points out a tension: if punishment must be deserved, how can substitution work without it being a legal fiction? 

  The user's own uncertainty about "in our place" suggests they recognize the complexity. The committee's dilemma is balancing confessional fidelity with intellectual honesty. Rejecting the exception might seem dogmatic, but approving it could undermine the Confession. A revision path might be the wisest, forcing the candidate to clarify without outright denial.

  Key stakeholders: the candidate (wants his view accepted), strict members (see this as essential), moderate members (want to retain thoughtful candidates), and the presbytery (needs clear guidance). The memo must respect all perspectives while steering toward a solution that upholds doctrine yet allows for nuanced engagement.

  The deeper need here isn't just procedural—it's about how the church handles theological tension. The user likely wants to preserve unity without stifling inquiry. The memo should model charitable rigor, showing that the committee takes both confession and intellect seriously.

  For the recommendation, "send back for revisions" makes the most sense. It avoids a hard yes/no, giving the candidate a chance to deepen his response. The reasoning should highlight where his argument currently falls short (e.g., not addressing biblical texts about Christ bearing sin) and ask him to reconcile his view with the Confession's core claims. 

  Phrasing is crucial: frame concerns as questions rather than accusations. Cite specific confessional language (WCF 11.3) and ask for engagement with Reformed heavyweights like Calvin or Owen. This positions the committee as facilitators, not gatekeepers, which might placate both sides.

  Also, subtly validate the user's unease about "in our place" by making that part of the requested revisions—e.g., "The candidate should articulate a positive alternative." That addresses the user's hidden need for clearer language themselves.

  Finally, the memo must feel pastoral, not bureaucratic. Emphasize the goal is clarity for ministry, not winning debates. That’s how you get buy-in from strict and lenient members alike.
answer: |-
  Here’s a draft recommendation memo designed to bridge the committee’s divide, uphold confessional integrity, and demand rigorous engagement from the candidate. It opts for **sending the exam back for revisions** as the most theologically responsible and pastorally wise path:

  ---

  # MEMORANDUM  
  **TO:** Presbytery of [Presbytery Name]  
  **FROM:** Candidates and Credentials Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Regarding Candidate [Candidate's Name] – Ordination Exam (Atonement)  

  ## I. EXAM UNDER REVIEW
  The Committee has reviewed Candidate [Candidate's Name]'s written ordination examination on the doctrine of the Atonement, specifically addressing Westminster Confession of Faith (WCF) Chapter 8, Sections 5 and 11.3, and Chapter 11.

  ## II. THE CANDIDATE'S POSITION & COMMITTEE ASSESSMENT
  The candidate articulates a thoughtful critique of the language surrounding Penal Substitutionary Atonement (PSA) as presented in the Confession. His argument centers on the philosophical challenge, drawing on David Lewis, concerning the transferability of *desert* (i.e., who *deserves* punishment). He contends that for substitution to be meaningful *without* constituting a "legal fiction," punishment cannot strictly require being borne by the one who personally deserves it in a retributive sense. He concludes that the Confession's language implies a retributive framework that renders true substitution logically incoherent, reducing it to a fiction rather than satisfying real justice.

  **Committee Assessment:**  
  1.  **Recognition of Engagement:** The Committee acknowledges the candidate’s serious engagement with the doctrine, his philosophical acuity, and his desire for theological coherence. His critique identifies a genuine tension debated within wider Christian theology and even among Reformed thinkers regarding the mechanics of imputation and satisfaction.  
  2.  **Confessional Fidelity Concern:** The Committee finds that the candidate's *current formulation*, particularly his characterization of the Confession's view as reliant on a "legal fiction" and his apparent rejection of the Confession’s understanding of Christ bearing the *punishment* *justly deserved* by the elect (WCF 11.3), **comes perilously close to, if not constitutes, a denial of an essential element** of the doctrine as articulated in our standards.  
  3.  **Critical Deficiency:** The candidate's argument, while philosophically interesting, fails to sufficiently:  
      *   **Engage the Biblical Testimony:** He does not robustly grapple with the key biblical texts underpinning the Confession's language (e.g., Isaiah 53:5-6, 10; Romans 3:25-26; 2 Corinthians 5:21; Galatians 3:13; 1 Peter 2:24; 3:18) which speak of Christ bearing sin, becoming a curse, being pierced for transgressions, and God's justice being satisfied *through* this act.  
      *   **Articulate a Positive, Confessionally Coherent Alternative:** He critiques the Confession's formulation but does not clearly articulate *how* his proposed understanding (relying on Lewis's debt analogy) fully satisfies the Confession's core affirmations that Christ "fully discharged the debt" of those for whom he died, acting as a "sacrifice to satisfy divine justice" (WCF 8.5), and that this satisfaction involved Christ bearing "the punishment due to us" (WCF 11.3).  
      *   **Distinguish Nuance from Rejection:** He does not adequately demonstrate how his view preserves the substance of "Christ suffering in our place" as an act of *justice satisfied*, rather than merely a transaction accepted by divine fiat. The distinction between a nuanced reinterpretation and a rejection of the core concept remains unclear.

  ## III. COMMITTEE RECOMMENDATION: REVISION REQUIRED
  The Committee **does not recommend approval of the exam in its current form**. We also **do not recommend ending the candidate's process** at this stage, recognizing the value of his intellectual rigor and the importance of careful theological formation.

  **We strongly recommend that the exam be returned to the candidate for significant revision, with the following specific requirements:**

  1.  **Positive Biblical Exegesis:** The candidate must provide a detailed exegesis of the core biblical texts related to Christ bearing sin, wrath, and punishment (e.g., Isaiah 53, key NT passages). He must explicitly demonstrate how his understanding of substitution flows *from* and *coheres with* this biblical witness, particularly the language of bearing sin/guilt/punishment.  
  2.  **Confessional Engagement:** The candidate must directly and thoroughly engage with the specific language of WCF 8.5 and 11.3. He must:  
      *   Explain precisely what he believes the Confession *means* by "satisfaction of divine justice," "bearing the punishment due to us," and "fully discharged the debt."  
      *   Clearly articulate what aspects of this language he believes are problematic and why.  
      *   **Crucially, he must articulate a positive formulation of substitutionary atonement that:**  
          *   Preserves the Confession's core affirmations listed above.  
          *   Explicitly affirms that Christ's suffering and death were *necessary* to satisfy God's justice regarding human sin.  
          *   Explains *how* this act constitutes genuine satisfaction of justice *in the place of sinners* without relying on the concept of a "legal fiction." How is the debt *paid*, the punishment *borne*, justice *satisfied*?  
          *   Addresses the relationship between divine justice, divine love, and the necessity of the cross within his framework.  
  3.  **Philosophical Nuance within Theology:** While philosophical tools are valuable, the candidate must demonstrate that his use of Lewis (or any philosopher) serves to elucidate the *theological and biblical* doctrine, not replace its core substance as understood within the Reformed tradition. He must show how his view remains firmly grounded in the authority of Scripture and the central tenets of the gospel.  
  4.  **Clarity on "In Our Place":** The candidate must provide a clear and robust theological definition of what "in our place" means within his revised understanding, moving beyond critique to constructive affirmation.

  ## IV. RATIONALE FOR REVISION PATH
  *   **Upholding Essential Doctrine:** The doctrine of Christ's substitutionary atonement, satisfying God's justice on behalf of sinners, is central to the gospel and the Reformed faith (Galatians 1:8-9, WCF 11). The Committee has a solemn duty to ensure candidates can affirm and teach this core truth. The current paper raises legitimate concerns about whether the *substance* of the Confession's teaching is affirmed.  
  *   **Pastoral & Formational Wisdom:** Sending the exam back honors the candidate's intellect and provides a crucial opportunity for deeper theological reflection and refinement. It avoids the premature dismissal of a thoughtful candidate while ensuring confessional standards are not lowered. Many ministers wrestle with articulating PSA; this process aims for clarity, not merely conformity.  
  *   **Engagement Over Stalemate:** This path demands rigorous engagement from the candidate with the Bible and Confession. It also challenges stricter committee members to engage with the candidate's revised arguments when presented, moving beyond initial reactions to substantive theological dialogue.  
  *   **Presbytery Clarity:** A revised paper, either successfully addressing these concerns or failing to do so, will provide the Presbytery with a much clearer basis for making a final determination than the current ambiguous position allows.

  ## V. RECOMMENDED NEXT STEPS
  1.  The Committee communicates this feedback and the requirement for revision to Candidate [Candidate's Name] immediately.  
  2.  The candidate is given [e.g., 4-6 weeks] to submit a revised exam section addressing the requirements outlined above.  
  3.  The Committee reconvenes to review the revised submission promptly upon receipt.  
  4.  The Committee will then make a final recommendation to Presbytery (Approve, Approve with Exception noted, or Deny) based on the revised work.

  Respectfully submitted,  
  The Candidates and Credentials Committee  
  Presbytery of [Presbytery Name]

  ---

  ## Key Strengths of this Approach

  1.  **Acknowledges Merit:** Validates the candidate's intellect and seriousness, preventing alienation.
  2.  **Identifies Core Issue:** Clearly states the *specific* confessional language (WCF 11.3) and concept ("punishment due to us") at stake, moving beyond vague accusations of "denial."
  3.  **Demands Rigor:** Forces the candidate to move beyond critique to positive construction *within* the confessional framework and based on Scripture. The requirement to explain "how justice is satisfied" and define "in our place" tackles the user's own uncertainty head-on.
  4.  **Provides Clear Path:** Gives concrete, actionable steps for revision (exegesis, confessional engagement, positive formulation).
  5.  **Balances Fidelity & Pastoral Care:** Upholds the essential nature of the doctrine while offering a path forward, addressing the concern about screening out thoughtful candidates.
  6.  **Promotes Deeper Engagement:** Ensures both the candidate and the Presbytery will have to engage with a more developed argument, satisfying the stricter members' need for substance and the moderates' desire for fair process.
  7.  **Focuses on Substance:** Shifts the debate from "Is this an exception?" to "Does this revised understanding faithfully articulate the gospel and the Confession's core teaching on atonement?"
  8.  **Clarity for Presbytery:** Provides the Presbytery with a clear rationale and a defined next step, regardless of the revision's outcome.

  This memo provides a robust, theologically grounded framework for the difficult discussion ahead, aiming for a resolution that strengthens both the candidate and the Presbytery's commitment to confessional integrity.
