  Random one for you -- I'm prepping a lecture on Gödel for my philosophy of religion seminar, and I keep running into blog posts claiming his ontological proof doesn't just get you God's existence but also formally guarantees an afterlife, as if the immortality part just falls out once you swap in a suitable property for 'God-like' in the same axioms. That doesn't match what I remember about how he actually argued for life after death, but its been a while since grad school. Can you set me straight on whether the afterlife claim is really part of the formal proof, and if not, what his actual argument for it looked like?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're prepping a lecture on Gödel for a philosophy of religion seminar and have encountered blog posts claiming that his ontological proof also formally guarantees an afterlife. They're skeptical because it doesn't match their recollection, and they want clarification on whether the afterlife is part of the formal proof and what Gödel's actual argument was.

