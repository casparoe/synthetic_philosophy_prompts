  I should outline the structure of the ontological proof briefly, then explain why immortality isn't part of it. After that, detail Gödel's separate argument for the afterlife based on God's goodness and the best possible world. Emphasize that the formal system is about existence and necessary properties, not personal immortality. Highlighting the unpublished nature of his notes and Sobel's criticism could add context about the argument's reception.

