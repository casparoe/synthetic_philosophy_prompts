answer: |-
  Here's a five-minute toast that honors your sister's work while celebrating her marriage, using her framework to deepen the meaning of vows without lecturing. It's structured for clarity, warmth, and dual audiences:

  ---

  **(Clink glass gently)**  
  "Hi everyone. For those who don’t know me, I’m the bride’s brother—and for those who *do* know my sister, you’ll understand why my job today isn’t just ‘give a toast,’ but ‘give a toast that survives peer review.’" *(Light laughter)*  

  "My brilliant sister has spent years studying how we make choices over time—not just in the moment, but across our whole lives. She’d explain it to me at dinner while I tried not to spill pasta on her Kant textbooks. She’d talk about how a purely ‘rational’ choice *right now* can sometimes lead you astray later if you’re not careful. How, if you only ever chase what feels best *in this second*, you might end up… well, empty-handed. Lost. Pumped dry." *(A knowing chuckle from philosophers; relatives lean in curiously)*  

  "But she also taught me there are ways to outsmart that trap. Three ways, actually.  

  "You can be **naive**: Live entirely for the present, assuming future-you will magically figure it out. ‘Follow your heart, always!’ It sounds romantic! But…" *(smile at your sister)* "...as our PhD here has rigorously proven, that’s how you get led in circles. Life has a way of exploiting good intentions if they aren’t anchored.  

  "Or you can be **sophisticated**: See the traps coming. You know future-you might waver, might get tempted. So you hedge. You build walls. ‘I’ll plan around my future self’s poor judgment.’ It’s clever. Safe. But…" *(pause, thoughtful)* "...it treats your own future like a threat. Like someone you don’t quite trust.  

  "Then there’s the third way. The way my sister argues is truly rational across time. **Resolute**. You look ahead. You see the traps, the uncertainties, the million ways preferences can shift or circumstances can change. You know future-you *might* want to abandon the plan. And then…" *(lean in slightly, voice warm but firm)* "...you choose *now* to bind yourself to a path. Not out of ignorance, but *because* you see the chaos. You precommit. You say, ‘This matters more than any fleeting preference. I choose us, even when it’s hard. Even when I’m tempted.’  

  ***(Shift focus fully to the couple, standing together)***  

  "And that’s what these two are doing today. They aren’t being naive. They see life’s complexity. They know there will be moments when walking away might *feel* easier. Moments when the immediate ‘trade’ looks appealing. They aren’t pretending otherwise.  

  "They aren’t just being sophisticated, either. They aren’t building prenups against each other’s future flaws. They aren’t treating the years ahead like a series of negotiations where one might exploit the other.  

  ***(Voice softens, filled with conviction)***  

  "They’re being **resolute**.  

  "Today, in front of all of us, they’re making a binding choice *across time*. They’re saying, ‘I see the whole uncertain journey. I see the potential money pumps life might throw at us. And I choose *us*, now and for every future version of myself, come what may.’  

  "It’s not a fairy tale promise. It’s braver. It’s a vow forged in full awareness of human frailty and change. It’s rationality and love intertwined: a defiant, joyous precommitment to a shared path.  

  ***(Raise glass)***  

  "So let’s toast to the resolute couple! To choosing each other, not just today with all this joy, but tomorrow, and next year, and in all the moments when the ‘rational’ short-term choice might whisper otherwise. To building a life that can’t be pumped dry because it’s anchored in something deeper than the moment. To love that sees the future clearly, and chooses it anyway.  

  "To [Sister's Name] and [Partner's Name]!"  

  ---

  **Why this works:**  

  1.  **Accessible Metaphor:** The "money pump" is explained simply as getting "led in circles" or "pumped dry." The three strategies are framed in relatable emotional terms (naive = magical thinking, sophisticated = building walls, resolute = brave commitment).  
  2.  **Honors the Work:** Philosophers will hear the precise structure (naive/sophisticated/resolute) and recognize the application to vows as a precommitment strategy. The "binding choice across time" and "defiant precommitment" are direct nods to diachronic rationality without jargon.  
  3.  **Deepens the Vows:** It elevates marriage beyond cliché. "Follow your heart" is explicitly rejected as naive. The toast argues their choice is *stronger* because it acknowledges future struggles.  
  4.  **Emotionally Resonant:** Focuses on trust ("not building walls against each other"), courage ("defiant, joyous"), and shared purpose ("anchored in something deeper"). The closing toast ties it all together warmly.  
  5.  **Respects Both Audiences:** Relatives hear a beautiful description of enduring love. Philosophers hear a sophisticated application of the thesis. The brotherly anecdotes ("spill pasta on Kant") add warmth and credibility.  
  6.  **Avoids Academia:** No technical terms (cyclical preferences, diachronic, etc.). The focus is on the *human behavior* behind the concepts.  

  **Delivery Tip:** Speak slowly and warmly. Pause after defining each strategy (naive/sophisticated/resolute) to let the concepts land. Make strong eye contact with the couple during the "resolute" section and the final toast. Your genuine pride and understanding will shine through. Good luck!
