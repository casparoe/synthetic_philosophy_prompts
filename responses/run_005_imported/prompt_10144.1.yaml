  For concept nativism: Question on whether "triggering" explains acquisition or just relabels it. Likely, the guest will say triggering avoids learning mechanisms. Follow-up: How does this differ from empiricist views if triggering requires pre-existing structure? This probes if nativism adds explanatory value.

