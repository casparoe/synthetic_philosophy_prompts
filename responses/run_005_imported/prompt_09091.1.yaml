prompt: |-
  Before retiring, I spent four decades in statistical mechanics, so "ergodic" already had a precise meaning for me by the time I stumbled across the "ergodicity economics" program associated with Ole Peters. Its central claim is that expected utility theory implicitly evaluates a gamble via an ensemble average across possible worlds, whereas any actual agent only ever lives through a single trajectory in time; replacing that ensemble average with the time-average growth rate of multiplicatively compounding wealth recovers Kelly-optimal betting — behavior extensionally equivalent to log-utility maximization — now derived as a theorem about dynamics rather than posited as a fact about psychology. Advocates describe this as replacing an "arithmetic," expectation-maximizing conception of rationality with a properly "geometric" one; critics reply that expected utility theory was never wedded to linear utility, that log-optimal growth strategies were well understood long before this rebranding, and that Samuelson's old objections to treating almost-sure long-run dominance as a universal decision criterion still stand. Rather than rehearsing either side's rhetoric, I would like you to locate the actual crux of the disagreement: is there some decision problem in which a committed "geometric rationalist" and a suitably calibrated expected-utility maximizer prescribe genuinely different actions, or does the whole dispute bottom out in framing rather than substance?
reasoning: |-
  Okay, let me start by unpacking the user's query. They have a background in statistical mechanics, so they're familiar with the term "ergodic" in that context. They came across Ole Peters' "ergodicity economics" and want to understand the core disagreement between that approach and traditional expected utility theory (EUT).

  First, I need to recall the central claims of ergodicity economics. Peters argues that EUT uses ensemble averages (averaging across parallel universes), but real individuals experience only one timeline. So, they propose using time-averages instead, especially with multiplicative wealth processes. This leads to maximizing the geometric mean growth rate, which corresponds to log-utility in EUT. Critics say EUT already accommodates log-utility, and Kelly's work predates this. Samuelson's critique against using long-run dominance as a universal criterion is also relevant.

  The user wants to know if there's a concrete decision problem where the two approaches prescribe different actions, or if it's just framing. So, I need to find scenarios where geometric rationality and EUT diverge. 

  First, consider non-ergodic processes. If a gamble's outcome depends on path-dependence or absorbing states, the ensemble and time averages might differ. For example, a gamble with a chance of ruin. In such cases, geometric rationality might avoid risks that EUT with linear utility would accept. But if EUT uses a utility function that models risk aversion (like CRRA), it might align with geometric rationality. 

  Wait, the key is when the utility function in EUT isn't logarithmic. For instance, if an agent has linear utility, EUT would maximize arithmetic mean, while geometric rationality always maximizes geometric mean. So in a single gamble without compounding, like a one-time bet, EUT with linear utility suggests maximizing expected value, but geometric rationality still uses the growth rate, which could lead to different choices. 

  But the user mentioned that advocates focus on multiplicative dynamics. So perhaps in repeated bets, geometric rationality and EUT with log-utility agree. The divergence occurs in single-shot decisions or when utility isn't logarithmic. Also, if there's path-dependence like bankruptcy, geometric rationality might avoid bets that EUT (with certain utilities) would accept. 

  Samuelson's point is crucial: long-run dominance doesn't imply rationality in single decisions. So, for a one-time gamble, geometric rationality might reject a positive EV bet if it risks ruin, whereas EUT with linear utility would accept it. But if EUT uses a utility function that values preservation (like negative exponential), it might also reject it. 

  The crux is whether the decision problem involves repeated independent bets. If yes, both approaches with log-utility agree. If not, and especially with bankruptcy risk, geometric rationality prescribes avoidance, while EUT with linear utility prescribes acceptance. However, EUT can mimic geometric rationality by choosing the right utility function. Thus, the difference is in the normative stance: geometric rationality mandates optimizing long-run growth, while EUT allows various utility functions. The substance might be in how they handle non-ergodic scenarios, but the core disagreement is normative.
answer: |-
  The crux of the disagreement lies in **normative prescriptions for non-ergodic, path-dependent decision problems**, particularly those involving **risk of ruin or irreversible losses**. While both frameworks often prescribe identical behavior (e.g., log-utility in EUT ≈ geometric rationality for repeated multiplicative bets), they genuinely diverge in scenarios where:

  ### 1. **Single-Shot Gambles with Bankruptcy Risk**
     - **Problem**: A one-time gamble where losing destroys all future capital (e.g., bet 95% of wealth on a 55%-win coin flip at even odds).
     - **Geometric Rationalist**: Rejects the gamble. The time-average growth rate is negative (due to ruin probability dominating):  
       \[ g = p \ln(1.95) + (1-p) \ln(0.05) < 0 \quad \text{(for } p = 0.55\text{)} \]
     - **Linear EU Maximizer** (utility = wealth): Accepts the gamble. Expected wealth increases:  
       \[ \mathbb{E}[W] = 0.55 \times 1.95W + 0.45 \times 0.05W = 1.065W > W \]
     - **Calibrated EU Maximizer** (e.g., CRRA utility): May reject if risk-averse, but this depends on *exogenous* curvature choice. Geometric rationality mandates rejection *endogenously* from dynamics.

  ### 2. **Path-Dependent Risks with Absorbing States**
     - **Problem**: A sequence of bets where failure in any round eliminates future growth (e.g., high-stakes entrepreneurship).
     - **Geometric Rationalist**: Focuses on survival. Avoids strategies where ensemble average is positive but probability of ruin is high. Maximizes:  
       \[ \lim_{T \to \infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right) \]
       This is undefined if ruin occurs.
     - **EU Maximizer**: Evaluates overall expected utility of wealth paths. May accept high ruin risk if compensated by high upside in non-ruined paths (e.g., linear utility: +EV despite 40% ruin risk).

  ### 3. **Non-Ergodic Dynamics with Correlated Risks**
     - **Problem**: Systemic risks affecting all future periods (e.g., climate change investments, pandemic preparedness).
     - **Geometric Rationalist**: Prioritizes robustness against tail risks that could collapse the entire time series. Rejects "long-shot" gains if they increase vulnerability to irreversible losses.
     - **EU Maximizer**: May accept based on low probability-weighted utility (e.g., if \( u(\text{gain}) \times p \) > \( u(\text{loss}) \times (1-p) \)).

  ### Why This is Substantive (Not Just Framing)
  - **Normative Divergence**: Geometric rationality *obligates* avoiding ruin-risk strategies, while EUT permits them if utility curvature is shallow.  
  - **Source of Valuation**: EUT values outcomes via psychological weights (utility); geometric rationality values via dynamical survival.  
  - **Samuelson’s Objection**: Geometric rationality treats one-shot decisions as if they were repeated, violating the independence axiom. EUT can model dynamic concerns but doesn’t mandate it.

  ### Where They Align
  For repeated, independent, multiplicative bets with no bankruptcy:  
  - Geometric rationality → Maximize geometric mean growth rate.  
  - EUT with log utility → Maximize expected log growth.  
  → Identical prescriptions (Kelly criterion).

  ### Conclusion
  The dispute bottoms out to a **normative disagreement about dynamic consistency in non-ergodic worlds**:  
  - Geometric rationalists argue that *all* decisions must optimize long-run survival in a single timeline.  
  - EUT allows agents to choose utility functions that may prioritize short-term gains or accept ruin risks.  
  **True divergence emerges when:**  
  (i) Outcomes are path-dependent with absorbing states (ruin),  
  (ii) Time-averages and ensemble averages differ (non-ergodicity), and  
  (iii) The EU agent’s utility function doesn’t sufficiently penalize ruin (e.g., linear or low-curvature utility).  

  Peters’ framework forces attention to dynamical fragility in ways EUT *can* model but doesn’t inherently prioritize. The substance lies in whether rationality *must* incorporate survival constraints derived from temporal dynamics—a demand EUT rejects as context-dependent.
