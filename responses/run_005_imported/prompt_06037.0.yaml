  **Where Kepler Drew the Line:**

  Kepler's core belief centered on **physically plausible celestial influences via light and geometry**. He genuinely believed planetary aspects (especially conjunctions, oppositions, and trigons) exerted measurable *physical* effects on Earth – primarily on weather, climate, and collective human psychology ("sublunary nature" and "temperament") – through mechanisms like light intensity, angular geometry, and possibly gravitational harmonics. He saw "great conjunctions" and eclipses/comets as powerful *physical triggers* for large-scale events (weather, social upheaval), rejecting their *symbolic* interpretation as divine omens. 

  Conversely, he dismissed doctrines relying on **symbolism, anthropocentrism, or unfounded tradition** as "superstitious nonsense." This included the zodiac's intrinsic meaning, assigning organs/treatments to signs, and crucially, *detailed deterministic fate* in natal charts. He saw natal astrology as useful only for broad temperamental inclinations (via planetary geometry at birth, *not* signs) and openly mocked precise fate prediction. His astrological practice was a pragmatic blend of belief in physical celestial-terrestrial interactions and a cynical acknowledgment of client expectations.
