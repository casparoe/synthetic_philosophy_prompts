  So we just spent two weeks on Galen Strawson's Basic Argument in my Free Will and Moral Responsibility seminar and one thing keeps bugging me. Strawson insists the regress (you can't be truly responsible for how you are, since that would require having already shaped yourself into that way for reasons, which needs an earlier self you're also not responsible for, and so on) works whether determinism or indeterminism is true -- not just under determinism like the usual hard determinist arguements. Is that neutrality actually doing real work or is it kinda cheating somehow? Also it's kind of funny that his dad, P.F. Strawson, wrote the classic compatibilist defense of responsibility through reactive attitudes in 'Freedom and Resentment' -- does that actually answer Galen's argument, or does it just dodge the question of whether we ever really deserve blame or praise? Write me an essay that works through both points and actually commits to a verdict on whether the Basic Argument succeeds in showing that we can never be truly morally responsible for what we do. Dont give me a wishy-washy 'both sides have merit' ending, pick a position and defend it.
