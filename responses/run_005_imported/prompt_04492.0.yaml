  ## The Unblinking Gaze: Anscombe, Intention, and the Weight of Hiroshima

  Elizabeth Anscombe’s opposition to the atomic bombings of Hiroshima and Nagasaki, culminating in her fiery pamphlet "Mr. Truman's Degree" (1956), is often treated as a biographical footnote to her magisterial *Intention* (1957). However, a closer examination suggests a profound, even foundational, relationship. The technical apparatus developed in *Intention* – particularly the rigorous distinction between *intended* and *merely foreseen* consequences, and the concept of intentional action as describable under multiple aspects – appears meticulously engineered to provide the unshakeable philosophical bedrock for the moral verdict she had already pronounced: that deliberately killing the innocent as a means to an end constitutes murder. Engaging this machinery against consequentialist and "supreme emergency" defenses reveals both the formidable power and the potentially crippling rigidity of her framework. While Anscombe's logic concerning the *means* of the bombings is internally consistent and exposes a deep moral horror, her charge of murder ultimately founders on the rock of her own absolutism regarding unconditional surrender and the failure of her framework to adequately engage the catastrophic scale of the alternatives.

  **Anscombe's Core Argument: Means, Murder, and Unconditional Surrender**

  Anscombe’s condemnation is specific and avoids simplistic pacifism or mere outrage at civilian deaths. Her argument hinges on two interlocking points:

  1.  **The Intended/Foreseen Distinction and Murder:** Drawing on the Doctrine of Double Effect (DDE), Anscombe insists that while *foreseeing* civilian deaths in attacking a legitimate military target may be tragically permissible under strict conditions, *intending* the deaths of innocent civilians as a *means* to achieve one's end is always murder. For Anscombe, intention is not merely about desired outcomes but about the structure of practical reasoning. An action is intentional *under the description* that specifies the agent's chosen means. In the case of Hiroshima and Nagasaki, she argues, the destruction of the cities and their inhabitants *was* the chosen means to break Japanese will and force surrender. The bombs were dropped *in order to* kill those civilians to achieve that terror. Therefore, regardless of the ultimate goal (ending the war), this specific act constitutes the murder of innocents. As she writes in *Intention*, "The only distinct *kind* of intention is intention *in* acting, which is the intention with which one acts." The intention *in* dropping the bomb was to destroy the city and its people *as a means*.

  2.  **The Primacy of Unconditional Surrender:** Anscombe locates the deeper injustice not solely in the bomb itself, but in the Allied demand for unconditional surrender. She argues this demand removed any possibility for Japan to surrender while preserving its national honor or political structure (specifically, the Emperor), creating a situation where only utter devastation or national annihilation seemed to offer a path to peace. This demand, she contends, was morally unjustifiable and directly created the perceived "necessity" for actions like the atomic bombings or the firebombing campaigns. The bomb, in this view, became the horrific instrument of a prior, flawed moral choice.

  **The Consequentialist and Supreme Emergency Rebuttal**

  The most potent challenge to Anscombe comes from weighing the bombs against the projected alternatives in August 1945:

  1.  **The Calculus of Invasion:** Allied planners estimated an invasion of the Japanese home islands (Operations Olympic and Coronet) would result in hundreds of thousands, potentially millions, of Allied casualties, and Japanese military and civilian deaths in the many millions. Japan was mobilizing its entire population for a desperate, suicidal defense. The bombs, this argument runs, precipitated an immediate surrender, saving vastly more lives – including countless Japanese civilians – than they took. Truman, Churchill, and their advisors genuinely believed the bombs were the least horrific option available to end the war swiftly.

  2.  **Walzer's "Supreme Emergency":** Michael Walzer, while deeply troubled by the bombings, offers a potential framework for justification through his concept of a "supreme emergency." This exists when: (a) a community faces an imminent threat of utter destruction or enslavement; (b) the threat is of an "unusual and horrifying kind" (like Nazism); and (c) the means chosen offer a *prospect of success* in averting the catastrophe and are not *disproportionate* (though they may violate deep moral constraints). Proponents argue that August 1945 presented such an emergency. The prolonged war threatened unimaginable bloodshed. The atomic bomb, while horrific, offered a sudden, decisive end, potentially saving far more lives than it cost. The shock of the new weapon *was* the mechanism that broke the deadlock in the Japanese cabinet and allowed the Emperor to override the military's desire to fight to the death.

  **Engagement and Verdict: Logic vs. the Abyss**

  Does Anscombe’s charge of murder hold up?

  1.  **On the Intended Means:** Anscombe’s analysis of the bombings *as intended means* is **largely compelling on her own terms.** The targeting of entire cities, the selection of sites with high civilian concentrations and limited military value compared to their symbolic/population density, the explicit goal of achieving maximum psychological impact through mass destruction – all strongly support her claim that civilian death was not a regrettable side-effect, but the very instrument of coercion. Consequentialist arguments, however overwhelming their projected numbers, do not dissolve the *intentional structure* of the act as Anscombe defines it. They change the *justification*, not the *description* of the intention. Walzer’s "supreme emergency" might excuse a violation of the norms of war, but it doesn't transform the intentional killing of innocents *as a means* into something else; it argues the violation was tragically necessary. On Anscombe’s premises, the act *remains* murder, even if deemed necessary. Her technical machinery successfully isolates this moral category.

  2.  **On Unconditional Surrender and the Framework's Rigidity:** This is where Anscombe’s charge falters, **not because her logic fails, but because her absolutism renders her framework inadequate to the historical reality.** Her condemnation of unconditional surrender as unjustifiable is crucial but underdeveloped. While morally stringent, it fails to grapple sufficiently with the nature of the Japanese regime – its militarism, brutality, and the fanaticism cultivated among its populace and leadership. Was preserving the Emperor system (the likely alternative to unconditional surrender) truly a morally acceptable outcome, given its role in enabling aggression and atrocities? Anscombe's framework, focused intensely on the *moment* of action and the *structure* of intention, struggles to incorporate the cumulative moral weight of the preceding years of total war and the genuine, empirically grounded fear of apocalyptic losses in an invasion. It risks treating the demand for unconditional surrender as an abstract policy error rather than a response (however flawed) to an existential conflict against a formidable and implacable enemy.

      Furthermore, while her distinction between intended and foreseen is powerful, applying it with absolute rigidity in the context of August 1945 risks a form of moral blindness. The "supreme emergency" argument, even if not fully absolving the *intentional structure* of the act, forces a confrontation with the sheer scale of the alternative. Anscombe’s framework provides no mechanism for acknowledging that an act falling under the description "murder of innocents as a means" *might* be the least horrific choice available when the alternative is a descent into an abyss of suffering orders of magnitude greater. Her verdict remains pure, but it can feel disconnected from the unbearable weight of the choice as it presented itself. The *necessity* argued by consequentialists, even if not justifying the *intentional structure*, challenges the absoluteness of her prohibition in the face of catastrophic alternatives.

  **The Verdict:**

  **Anscombe’s charge that the atomic bombings constituted murder, based on her specific definition relying on the intended/foreseen distinction, is logically coherent and technically correct within the framework she meticulously constructed in *Intention*.** The civilian deaths were not merely foreseen; they were the chosen instrument of terror. However, **this verdict, while formally sound on her terms, is ultimately incomplete and morally problematic due to the rigidity of her framework regarding unconditional surrender and its inability to meaningfully engage the scale of the "supreme emergency" calculus.**

  The deeper flaw is not in her analysis of the bomb *as used*, but in her dismissal of the context that made its use seem tragically necessary to decision-makers. While the demand for unconditional surrender may have been a contributing moral error, condemning the bombings *as murder* without fully grappling with the horrifying alternatives they potentially averted – alternatives involving the slaughter of millions, including the user's grandfather and countless Japanese – renders the charge, however logically pristine, existentially hollow. It demonstrates the power of her philosophical machinery to isolate a profound moral truth (the evil of targeting innocents) but also exposes its limitations when confronted with history’s most agonizing choices, where *all* options involve profound evil. The bombs were indeed murder by Anscombe's lights, but pronouncing this verdict feels less like a final moral accounting and more like a stark, unblinking gaze that cannot see the surrounding darkness.
