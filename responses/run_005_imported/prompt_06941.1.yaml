answer: |-
  Based strictly on Frederick Douglass's own arguments and principles—particularly his mature insistence on rigorous textual interpretation—he would **unequivocally condemn the Thirteenth Amendment's exception clause and support your campaign to abolish it.** Here's the verdict, argued on his terms:

  1.  **The Plain Text Betrays the Document's Purpose:** Douglass broke with Garrison by arguing the *original* Constitution, read strictly by its text ("*Is it not plain... that the Constitution guarantees to every State in this Union a Republican form of Government?*"), was fundamentally anti-slavery. He insisted the words "slave" and "slavery" were deliberately avoided, allowing the document to be interpreted as a "glorious liberty document" (*"The Constitution is a GLORIOUS LIBERTY DOCUMENT. Read its preamble... I defy the presentation of a single pro-slavery clause in it"* - Glasgow Speech, 1860). The Thirteenth Amendment's exception clause **shatters this textual purity.** It explicitly *names* "slavery" and "involuntary servitude" and *authorizes* it ("shall exist") under a specific condition. This clause is the textual antithesis of Douglass's core argument – it is *explicitly* a pro-slavery clause.

  2.  **The Exception Clause Embodies the "Covenant with Death" He Initially Feared:** Douglass's Garrisonian youth saw the Constitution as fatally compromised by implied slavery protections, a "covenant with death and an agreement with hell." The exception clause **is precisely the kind of explicit, sanctioned compromise with slavery his later textualism naively believed the framers had avoided.** Its plain language *is* a covenant permitting bondage, validating his earliest fears in a way the original Constitution's ambiguous clauses did not.

  3.  **Textual Interpretation Demands Rejection of the Exception:** Douglass argued the Constitution must be interpreted by its "plain reading," divorced from the "secret motives" of its framers (*"Take the Constitution according to its plain reading... it will be found to contain principles and purposes entirely hostile to the existence of slavery"*). Applying this method to the Thirteenth Amendment:
      *   **Plain Reading:** "Neither slavery nor involuntary servitude, **except as a punishment for crime**... shall exist within the United States." This is unambiguous: slavery *is* permitted under U.S. law as punishment.
      *   **Hostility to Slavery?** The main clause declares hostility. The exception clause *immediately and explicitly undermines that hostility* by defining the precise circumstance where slavery *is* permitted. The text offers no ambiguity to rescue.
      *   **Comparison to Fugitive Slave Clause:** Douglass argued the infamous Clause (Art IV, Sec 2) didn't *mention* slavery, allowing a liberty-based interpretation. The exception clause **leaves no such room.** It names the evil directly and sanctions it. His textual method cannot salvage it.

  4.  **His Later Writing on Convict Leasing Confirms the Betrayal:** Douglass's denunciation of the post-Reconstruction convict lease system (*"The old master class... still, as of old, the wily and powerful robber... by cunning, by fraud, and by violence, they reduce the freedmen to a condition... more intolerable than that from which the war... emancipated them"*) proves he recognized the exception clause *functionally recreated slavery.* His fury stemmed from seeing the *textual authorization* ("duly convicted") used to cloak a brutal reality. He would see today's prison labor system not as a perversion of the clause, but as its *logical and authorized consequence*.

  **The Verdict (On Douglass's Terms):**
  Frederick Douglass would judge the exception clause **as a fatal, irredeemable flaw in the Constitution's claim to be a "glorious liberty document."** His core argument – that the Constitution's text, read strictly, inherently opposed slavery – **cannot survive the plain, explicit language of the Thirteenth Amendment's exception.** It is the textual embodiment of the "covenant with death" he once denounced. His own method of interpretation demands its rejection. To remain consistent with his insistence on the supremacy of the text over hidden intent or historical compromise, Douglass would **vigorously support striking the exception clause** as the only way to align the Constitution's words with its purported purpose of universal liberty. He would see your campaign not as revising the document, but as finally *fulfilling* its textual promise by excising its one explicit sanction of bondage.
