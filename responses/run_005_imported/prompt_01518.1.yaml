answer: |-
  Based on a close reading of *The Descent of Man* (particularly Chapter IV) and Darwin's overall approach, here’s a reconstruction of how he might have responded to Street’s dilemma, emphasizing his own arguments and commitments:

  1.  **Conceding Contingency, Denying Complete Arbitrariness:** Darwin would readily agree with Street (and his own bee example) that the *specific content* of our proximate moral rules is highly contingent on evolutionary history and social structure. He explicitly states that if humans had evolved like hive-bees, our moral duties would be utterly different and repugnant to our current sensibilities. **This directly grants Street's point about the contingency of origins.**

  2.  **Rejecting the "No Relation" Horn:** Darwin would firmly reject the first horn ("no relation"). His entire project in Chapter IV is to demonstrate the *evolutionary origins* of the moral sense. He painstakingly traces it to social instincts, parental/filial affections, sympathy, and intelligence – all shaped by natural selection. For Darwin, there is a profound causal relation: evolution produced the moral sense.

  3.  **Rejecting the "Tracking Truth" Horn (as Street defines it):** Darwin would also likely reject the second horn *as Street frames it* ("natural selection tracked independent moral truths *because* true evaluative beliefs were fitness-enhancing"). He does *not* argue that natural selection directly favored believing in some independent moral truth (like Platonic forms or divine commands). His mechanism is about the evolution of *pro-social instincts and sentiments* (sympathy, fidelity, courage) that enhance group cohesion and survival, not about "tracking truth."

  4.  **Darwin's Third Way: The Evolution of Moral *Capacity* and the Role of Reason:** Darwin's escape route lies in his distinction between:
      *   **The Evolved Moral *Faculty* (Capacity/Sentiment):** This is the product of natural selection – the social instincts, sympathy, and the intellectual capacity for reflection and comparison. This faculty is contingent in its origins.
      *   **The *Content* of Moral Judgments Guided by Reason:** Darwin argues that as human intelligence develops, reason acts *upon* the raw material of social instincts and sympathy. Reason allows humans to:
          *   **Recall past actions/instincts:** Reflect on past impulses.
          *   **Compare actions/instincts:** Evaluate which impulses or actions are stronger or more persistent.
          *   **Approve/Disapprove:** Form judgments about what *ought* to be done based on this comparison and reflection.
          *   **Extend Sympathy via the "Expanding Circle":** Reason, combined with experience, communication, and habit, allows sympathy to extend beyond kin and tribe to "all races," "the imbecile, maimed, and other useless members of society," and even animals (*Descent*, Ch. IV). This expansion isn't *driven* by selection for tracking truth, but by the *application* of the evolved capacity for sympathy and reflection in increasingly complex social environments.
      *   **Convergence on Utilitarianism:** Crucially, Darwin sees this process of reasoned reflection, fueled by sympathy and social instinct, as *converging* on a specific standard: the general good or welfare of the community, which he explicitly equates with the "greatest happiness principle" (Utilitarianism). He argues this standard is "natural" because it arises from the very social instincts that bind communities together. As reason develops, humans *discover* that this principle provides the most coherent and satisfying guide for resolving conflicts between instincts and directing conduct for the stability and flourishing of the group. He treats this convergence as evidence of its legitimacy, not merely its utility.

  5.  **Darwin's Implicit Realism (Naturalistic, not Platonic):** Darwin's "realism" about the "greatest happiness principle" is *not* based on it being an independent, non-natural truth *tracked* by evolution. Instead, it's based on:
      *   **Its Emergence from Natural Processes:** It arises naturally from the interaction of evolved instincts/sympathy and developing reason.
      *   **Its Functional Centrality:** It is the principle that best serves the evolved function of social cohesion and welfare, which was the *original* selective advantage of the moral sense.
      *   **Its Consensual Endorsement by Reason:** It is the standard that intelligent reflection, drawing on sympathy and experience, consistently arrives at and endorses as societies advance. He sees this consensus among "civilized nations" as significant evidence (*Descent*, Ch. IV: "as man advances in civilisation, and small tribes are united into larger communities, the simplest reason would tell each individual that he ought to extend his social instincts and sympathies to all members of the same nation, though personally unknown to him. This point being once reached, there is only an artificial barrier to prevent his sympathies extending to the men of all nations and races.").
      *   **Its Objectivity *within* the Human Frame:** For Darwin, the standard is "objective" in the sense that it is the *discovered* and *necessary* conclusion of applying our evolved moral capacity (reason + sympathy) to the task of social living. It's not contingent in the way specific tribal taboos are; it's the *telos* of the moral faculty's development.

  **Darwin's Likely Response to Street:**

  "Madam, I quite agree that the specific rules deemed moral by any given tribe or species are profoundly contingent on their history and social structure, as my hive-bee illustration demonstrates. Natural selection shaped our social instincts and capacity for sympathy, not to track some external moral realm, but because these traits aided survival.

  However, you overlook the crucial role I assign to the *development of human reason*. As our intellect matured, it allowed us to reflect upon our instincts and sympathies, to compare actions, and to extend our concern beyond immediate kin and tribe. This process of reasoned reflection, grounded in our evolved social nature, leads us inevitably towards a standard: the general good or happiness of the community.

  This 'greatest happiness principle' is not an independent truth *tracked* by selection. Rather, it is the *discovered* and *rational* outcome of applying our evolved moral faculty – our sympathy and intellect – to the complexities of social existence. It is the standard towards which our moral sense naturally progresses as reason illuminates the connections between our actions and the welfare of others. While the *origin* of the faculty is contingent, the *standard* it converges upon through reason is not arbitrary; it is the necessary and legitimate guide for conduct derived from our very nature as social, sympathetic, and reasoning beings. The contingency lies in the path, not necessarily in the ultimate destination revealed by reason."

  **In essence:** Darwin would likely argue that Street's dilemma presents a false choice. He concedes the contingency of the *origins* of the moral faculty and *proximate* rules, denies that selection "tracked truth" in the strong sense, but asserts that the *development of reason* allows us to *discover* a non-arbitrary, objective (within the human frame) moral standard (Utilitarianism) grounded in the functional core of our evolved social nature. His "realism" is naturalistic and emergent, not pre-existing and tracked. He escapes the horns by emphasizing the transformative role of reason acting upon the evolved raw materials.
