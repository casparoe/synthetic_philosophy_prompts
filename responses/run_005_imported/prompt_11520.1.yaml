    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```
reasoning: |-
  We are ranking six positions on future contingents by philosophical defensibility, from S (most defensible) to D (least defensible). The positions are:

  1. Traditional Aristotelian reading: future contingents are neither true nor false.
  2. Diodorean necessitarianism: bivalence holds, so the future is fixed (fatalism).
  3. Peircean: future-tensed claims are true now only if inevitable; otherwise false.
  4. Ockhamist "thin red line": one branch is privileged as actual, so bivalence holds without fatalism? (Note: Ockhamism does not imply fatalism because the future is still contingent in the sense that it could have been otherwise, but the actual future is fixed by the privileged branch.)
  5. Supervaluationism (branching time): true if true on all branches, false if false on all, else indeterminate.
  6. MacFarlane's relativism: truth is relative to the context of assessment. At utterance, a future contingent is neither true nor false, but at a later context it may be true or false.

  Criteria for defensibility: We want a view that is philosophically serious, avoids fatalism (if possible, since fatalism is often seen as problematic), preserves human freedom, and coheres with our intuitions about time and possibility.

  Step-by-step reasoning:

  - The problem of future contingents arises because we want to allow for indeterminism (the future is open) and avoid fatalism (the future is fixed). So views that accommodate openness and freedom are more defensible in contemporary philosophy.

  - The traditional Aristotelian view (1) is historically important and avoids fatalism by denying bivalence for future contingents. It has been defended by many philosophers. However, it faces the challenge of explaining how we can reason about the future if such statements lack truth values.

  - Diodorean necessitarianism (2) is a fatalist view. It preserves bivalence but at the cost of denying any openness in the future. This is often seen as counterintuitive and incompatible with free will. Hence, it is less defensible in modern contexts.

  - The Peircean view (3) says that a future contingent is false if it is not inevitable. This leads to the counterintuitive result that if I say "I will go to the party tomorrow" and it is contingent, then it is false. Then, if I do go, it seems that I was wrong to say it? Also, it makes all contingent future statements false, which is extreme.

  - Ockhamism (4) preserves bivalence by having a "thin red line" (a privileged actual future). This allows that there is a truth about the future, but it does not entail that the future is necessary. It is compatible with divine foreknowledge in theology. However, the idea of a privileged branch is criticized for being ad hoc and for not capturing the openness of the future (since the other branches are not really possible in the same way).

  - Supervaluationism (5) is a popular approach in branching time. It captures the idea that the future is open: a statement is true only if it is settled true (true on all branches). This avoids fatalism and preserves truth-value gaps for genuine contingents. It is a common view in the literature and has been developed rigorously.

  - MacFarlane's relativism (6) is a more recent view. It aims to handle the context-sensitivity of truth for future contingents. It avoids the problems of the "thin red line" by making truth relative to the context of assessment. This view has gained attention and is seen as a sophisticated way to reconcile the openness of the future with the idea that future contingents become true or false as time passes.

