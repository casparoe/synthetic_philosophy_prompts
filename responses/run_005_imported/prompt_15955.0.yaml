prompt: |-
  I was recently appointed to my county's newly formed oversight board for pretrial risk-assessment tools, and at our first meeting the vendor and the public defenders' office talked past each other about what "fair" even means. The vendor maintains the tool is fair because it is well-calibrated within each racial group (a score of 7 out of 10 implies roughly the same rearrest rate whether the defendant is Black or white), while the public defenders maintain it is unfair because of the well-documented gap in false-positive rates across those same groups, the same pattern ProPublica reported in its investigation of COMPAS. I've since read that Kleinberg, Mullainathan, and Raghavan, and separately Chouldechova, proved that calibration and equal error rates across groups (sometimes called "equalized odds") cannot both hold once the groups' base rates of reoffending differ, but every proof I've found just manipulates conditional expectations, and I haven't managed to internalize why this has to be true rather than merely verifying that it is. Could you give me an intuitive, close-to-first-principles explanation of why a well-calibrated score is essentially forced into unequal error rates whenever base rates diverge across groups, ideally illustrated with a minimal worked example rather than the general algebra?
reasoning: |-
  We are going to consider a minimal example with two racial groups: Group A and Group B.
   Let's assume that the base rate of reoffending (the proportion of defendants who actually reoffend) differs between the groups.

   For simplicity, we will use:
     Group A: base rate = 0.3 (30% of defendants reoffend)
     Group B: base rate = 0.5 (50% of defendants reoffend)

   We have a risk-assessment tool that outputs a binary prediction: "high risk" or "low risk". However, for calibration we often have a score (like 1 to 10) and then we set a threshold (say 5) to make a binary decision. But the problem is about calibration and error rates, so we can think in terms of the binary decision.

   The two fairness criteria in conflict are:

   1. Calibration: Within each group, the probability of reoffending given a risk score (or a risk category) should be the same as the score implies. In our binary case, if we assign a "high risk" label, then the proportion of those labeled high risk who actually reoffend should be the same in both groups. Similarly for low risk.

   2. Equalized odds (or equal error rates): This requires that the true positive rates (TPR) and false positive rates (FPR) are equal across groups.

   However, we are going to see that if the base rates are different, then having calibration by group forces the false positive rates (and/or true positive rates) to be different.

   Let's set up:

   We have two groups: A and B.

   For Group A:
     Base rate: P(reoffend | A) = 0.3
     Therefore, P(not reoffend | A) = 0.7

   For Group B:
     P(reoffend | B) = 0.5
     P(not reoffend | B) = 0.5

   Now, suppose we have a risk score that is well-calibrated by group. For simplicity, let's assume the tool only outputs two scores: "high" and "low". We set the threshold such that:

     In Group A:
       Let the proportion of high-risk predictions be p_A.
       Among those labeled high-risk in A, the reoffending rate must be equal to the base rate? Not exactly. Actually, calibration requires that the reoffending rate among those labeled high-risk is the same as the risk score implies. But for simplicity, we can assume that the tool is designed to have a certain positive predictive value (PPV) that is the same in both groups? However, note that the vendor says that a score of 7/10 implies the same rearrest rate regardless of race. So in our binary case, we might set:

          P(reoffend | high, A) = P(reoffend | high, B) = 0.7   [for example, because 7/10]

          P(reoffend | low, A) = P(reoffend | low, B) = 0.2    [for example, because 2/10]

   But note: we cannot arbitrarily set these without considering the base rate. We must have that the overall reoffending rate in group A is 0.3, and in group B is 0.5.

   How do we relate the predictions to the base rate?

   We have:
     P(reoffend | A) = P(high | A) * P(reoffend | high, A) + P(low | A) * P(reoffend | low, A)

   Similarly for group B.

   Now, calibration requires that for each group and for each risk level, the reoffending rate is the same as the risk level's implied rate. But note: the risk levels are the same across groups? The vendor says that a score of 7/10 (which we map to high) has the same meaning in both groups. So we set:

     Let h = P(reoffend | high) = 0.7   (same for A and B)
     Let l = P(reoffend | low) = 0.2    (same for A and B)

   Now, for group A:

     0.3 = P(high | A) * 0.7 + (1 - P(high | A)) * 0.2

   Solve for P(high | A):

     0.3 = 0.7 * P(high | A) + 0.2 - 0.2 * P(high | A)
     0.3 - 0.2 = (0.7 - 0.2) * P(high | A)
     0.1 = 0.5 * P(high | A)
     P(high | A) = 0.1 / 0.5 = 0.2

   Similarly, for group B:

     0.5 = P(high | B) * 0.7 + (1 - P(high | B)) * 0.2
     0.5 = 0.7 * P(high | B) + 0.2 - 0.2 * P(high | B)
     0.5 - 0.2 = (0.7 - 0.2) * P(high | B)
     0.3 = 0.5 * P(high | B)
     P(high | B) = 0.3 / 0.5 = 0.6

   So in group A, 20% are labeled high risk, and in group B, 60% are labeled high risk.

   Now, let's compute the false positive rates (FPR) and true positive rates (TPR) for each group.

   Recall:
     TPR = P(high | reoffend)   [the probability that a reoffender is labeled high risk]
     FPR = P(high | not reoffend) [the probability that a non-reoffender is labeled high risk]

   We can compute these using Bayes' rule, but we can also use the information we have.

   For group A:

     We know:
       P(high | A) = 0.2

       Among the high risk in A, the proportion that reoffend is 0.7. So the number of true positives (TP) in group A is:
          TP_A = P(high | A) * P(reoffend | high, A) = 0.2 * 0.7 = 0.14 (of the entire group A)

       The total reoffenders in group A: base rate * 1 = 0.3
          So, TPR_A = TP_A / (total reoffenders in A) = 0.14 / 0.3 ≈ 0.4667

       Similarly, the false positives in group A: 
          FP_A = P(high | A) * P(not reoffend | high, A) = 0.2 * (1 - 0.7) = 0.2 * 0.3 = 0.06
          Total non-reoffenders in A: 0.7
          FPR_A = FP_A / (non-reoffenders in A) = 0.06 / 0.7 ≈ 0.0857

   For group B:

       P(high | B) = 0.6

       TP_B = P(high | B) * P(reoffend | high, B) = 0.6 * 0.7 = 0.42
       TPR_B = 0.42 / 0.5 = 0.84

       FP_B = P(high | B) * P(not reoffend | high, B) = 0.6 * (1-0.7) = 0.6 * 0.3 = 0.18
       FPR_B = 0.18 / 0.5 = 0.36   [Note: non-reoffenders in group B are 0.5 of the group]

   Now compare:

     TPR_A ≈ 0.4667, TPR_B = 0.84   -> not equal
     FPR_A ≈ 0.0857, FPR_B = 0.36   -> not equal

   Therefore, we see that even though the tool is calibrated (in the high risk group, 70% reoffend in both A and B; in the low risk group, 20% reoffend in both), the error rates (both TPR and FPR) are very different across groups.

   Why did this happen?

   The key is that the base rates are different. The tool must assign a higher proportion of group B as high risk (60%) than group A (20%) to achieve the same positive predictive value (PPV) and negative predictive value (NPV) in each group relative to their base rates.

   But when we look at the error rates, we see:

     In group A, because the base rate of reoffending is low (30%), the tool must be conservative in assigning high risk to avoid too many false positives. So it only assigns 20% as high risk. This leads to a low FPR (only 8.6% of non-reoffenders in A are labeled high) but also a low TPR (only 46.7% of reoffenders in A are caught as high risk).

     In group B, the base rate is high (50%). The tool must assign more as high risk (60%) to capture enough of the reoffenders. This leads to a higher TPR (84%) but also a much higher FPR (36%).

   Thus, the difference in base rates forces a trade-off: if we want calibration, we cannot have equal error rates.

   This is the essence of the impossibility result: when base rates differ, calibration and equal error rates (or equalized odds) cannot hold simultaneously.

   I hope this example helps.
answer: |-
  To understand why a well-calibrated risk-assessment tool must exhibit unequal error rates when base rates of reoffending differ across groups, let's break it down with a minimal, intuitive example. We'll use two groups (Group A and Group B) and simplify the risk scores to binary predictions ("high-risk" or "low-risk") to illustrate the core conflict.

  ### Step 1: Define Base Rates
  - **Group A**: 30% base rate of reoffending (e.g., 30 out of 100 people reoffend).  
  - **Group B**: 60% base rate (e.g., 60 out of 100 reoffend).  

  ### Step 2: Ensure Calibration by Group
  The vendor claims the tool is **well-calibrated**, meaning:  
  - A "high-risk" label implies the **same probability of reoffending** for both groups.  
  - A "low-risk" label implies the **same probability of reoffending** for both groups.  

  Assume:  
  - **High-risk prediction**: 80% chance of reoffending (same for both groups).  
  - **Low-risk prediction**: 20% chance of reoffending (same for both groups).  

  ### Step 3: Calculate Prediction Rates
  For the tool to be calibrated, the **overall reoffending rate** in each group must match the base rate. We use weighted averages:  

  **Group A (30% base rate)**:  
  Let \( p_A \) = proportion labeled "high-risk" in Group A.  
  - Reoffending rate = \( (p_A \times 80\%) + ((1 - p_A) \times 20\%) = 30\% \).  
  - Solve: \( 0.8p_A + 0.2(1 - p_A) = 0.3 \)  
    → \( 0.8p_A + 0.2 - 0.2p_A = 0.3 \)  
    → \( 0.6p_A = 0.1 \)  
    → **\( p_A = 1/6 \approx 16.7\% \)**.  

  **Group B (60% base rate)**:  
  Let \( p_B \) = proportion labeled "high-risk" in Group B.  
  - Reoffending rate = \( (p_B \times 80\%) + ((1 - p_B) \times 20\%) = 60\% \).  
  - Solve: \( 0.8p_B + 0.2(1 - p_B) = 0.6 \)  
    → \( 0.8p_B + 0.2 - 0.2p_B = 0.6 \)  
    → \( 0.6p_B = 0.4 \)  
    → **\( p_B = 2/3 \approx 66.7\% \)**.  

  **Result**: To maintain calibration:  
  - Only 16.7% of Group A is labeled "high-risk."  
  - 66.7% of Group B is labeled "high-risk."  

  ### Step 4: Calculate Error Rates
  Now compute **false positive rates (FPR)** and **true positive rates (TPR)**.  
  - **FPR**: % of non-reoffenders wrongly labeled "high-risk."  
  - **TPR**: % of reoffenders correctly labeled "high-risk."  

  **Group A (100 people)**:  
  - Non-reoffenders: 70 people (since 30% base rate → 30 reoffend, 70 do not).  
  - High-risk predictions: 16.7 people (16.7% of 100).  
    - True positives (reoffenders labeled high-risk):  
      Among high-risk, 80% reoffend → \( 0.8 \times 16.7 \approx 13.4 \).  
    - False positives (non-reoffenders labeled high-risk):  
      \( 16.7 - 13.4 = 3.3 \).  
  - **FPR_A** = False positives / Non-reoffenders = \( 3.3 / 70 \approx 4.7\% \).  
  - **TPR_A** = True positives / Reoffenders = \( 13.4 / 30 \approx 44.7\% \).  

  **Group B (100 people)**:  
  - Non-reoffenders: 40 people (60 reoffend, 40 do not).  
  - High-risk predictions: 66.7 people.  
    - True positives: \( 0.8 \times 66.7 \approx 53.4 \).  
    - False positives: \( 66.7 - 53.4 = 13.3 \).  
  - **FPR_B** = \( 13.3 / 40 \approx 33.3\% \).  
  - **TPR_B** = \( 53.4 / 60 \approx 89.0\% \).  

  ### Step 5: Compare Error Rates
  - **False Positive Rate (FPR)**:  
    - Group A: **4.7%**  
    - Group B: **33.3%**  
    → Group B has **7 times more false positives** relative to non-reoffenders.  

  - **True Positive Rate (TPR)**:  
    - Group A: **44.7%**  
    - Group B: **89.0%**  
    → Group B has **twice as many true positives** relative to reoffenders.  

  ### Why This Happens
  - **Calibration requires the tool to reflect group-specific base rates**. Since Group B has a higher base rate, the tool **must** label more people in Group B as "high-risk" (66.7% vs. 16.7%) to ensure a "high-risk" prediction implies 80% reoffending in both groups.  
  - **Consequence**: This forces a **trade-off in error rates**:  
    - Group B’s higher "high-risk" rate catches more true reoffenders (high TPR) but also sweeps in more false positives (high FPR).  
    - Group A’s conservative labeling avoids false positives (low FPR) but misses more reoffenders (low TPR).  

  ### The Core Impossibility
  - **Calibration** and **equal error rates** (like FPR/TPR parity) are mathematically incompatible when base rates differ.  
    - If base rates are equal, you *can* achieve both.  
    - If base rates differ (e.g., Group B reoffends more), calibration forces the tool to assign risk labels in proportion to the base rate, inevitably leading to unequal errors.  

  ### Practical Implication
  In your oversight role:  
  - The vendor isn’t wrong about calibration—but it’s only one facet of fairness.  
  - Public defenders focus on **error rate disparities**, which harm disadvantaged groups (e.g., Group B faces more false detentions due to high FPR).  
  - **No tool can satisfy both criteria simultaneously** when base rates diverge. Your board must decide which fairness definition aligns with community values.  

  This tension is unavoidable—it’s a mathematical consequence of differing base rates, not a flaw in the tool or data. Understanding this trade-off is crucial for policy decisions.
