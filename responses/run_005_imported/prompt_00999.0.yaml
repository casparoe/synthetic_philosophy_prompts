  ok this has been bugging me for a while: iirc Godel is the guy who actually proved God exists with that ontological argument, and didn't someone even run it through a theorem prover a few years back and it checked out fine? Separately, I know he was totally convinced there's an afterlife -- wrote his mom a bunch of letters laying out the reasoning. So doesn't the afterlife stuff basically fall out as a corollary once you've got a necessarily-existing God-like being nailed down logically? Feels like this should be the single strongest argument for life after death that's ever been made, since its coming from actual formal logic instead of just faith, but I never see anyone in the LW-sphere treat it that way. What am I missing?
