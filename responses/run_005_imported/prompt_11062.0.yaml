  The terminology objection is interesting. Why keep calling it "handicap" if cost isn't central? I can argue that the term still captures the idea that signals impose constraints that only high-quality individuals can comfortably bear. It's about the potential cost or the design for cost-effectiveness, not necessarily ongoing expenditure. The principle describes a strategic burden, not literal waste.

