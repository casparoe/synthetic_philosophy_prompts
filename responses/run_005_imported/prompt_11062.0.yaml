  Let me recall the core concepts here. Zahavi proposed that signals are honest because they're costly - like a peacock's tail that's hard to grow and maintain. Only high-quality individuals can afford such costs, so the signal honestly indicates quality. But Grafen's game-theoretic model showed something more nuanced: it's not absolute cost that matters, but how costs and benefits differ between high and low-quality individuals. Later critics like Számadó pointed out that people often misinterpret this as cost guaranteeing honesty, which isn't quite right.

