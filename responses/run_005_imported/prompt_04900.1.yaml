  I should also consider secondary sources. Hart explicitly critiques Blackstone in his debate with Fuller. Fuller, in his response, might not directly address Blackstone but offers an alternative natural law theory. The user should be directed to Hart's "Positivism and the Separation of Law and Morals" and Fuller's "Positivism and Fidelity to Law" for primary sources. Also, checking modern interpretations of Blackstone could help resolve if he's committed to the strong thesis.

