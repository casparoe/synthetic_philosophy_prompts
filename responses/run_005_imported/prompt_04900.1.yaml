answer: |-
  That's an excellent and precise question about a foundational passage – you've hit on a core ambiguity in Blackstone that directly fuels the Hart-Fuller debate. Let's break it down:

  1.  **Blackstone's Passage: Strong or Weak?**
      *   **The Strong Reading (Lex Iniusta Non Est Lex):** The phrase "**no human laws are of any validity, if contrary to this**" is the smoking gun. Taken literally and in isolation, this *does* sound like Aquinas: an unjust (contrary to natural law) human law is simply not valid law. It lacks legal force.
      *   **The Weak Reading (Source of Authority):** The second phrase, "**such of them as are valid derive all their force, and all their authority, mediately or immediately, from this original**," suggests a different emphasis. It focuses on the *ultimate source* of legal authority. Valid laws *are* valid *because* they ultimately trace their legitimacy back to conformity with natural law. This doesn't necessarily mean *every* individual law must be *directly* tested against natural law for validity *at the moment of application*; rather, the *system* derives its authority from natural law, and valid laws within the system are presumed (or structurally required) to be consistent.
      *   **Compatibility and Tension:** The two phrases *are* logically compatible only under the **Strong Reading**:
          *   **Premise 1 (Strong Validity Test):** If a human law is contrary to NL, it is invalid (has no force).
          *   **Premise 2 (Derivation):** Valid laws get their force from NL.
          *   **Conclusion:** Therefore, *only* laws consistent with NL *can* be valid and *do* derive their force from it. The derivation clause simply reinforces why the validity test in Premise 1 holds.
      *   **Why the Weak Reading Struggles:** If derivation is *only* about the system's ultimate source ("human law *as an institution* gets its authority from NL"), it doesn't automatically imply that *each individual* law contrary to NL is invalid *as law*. The derivation statement could be true even if some individual unjust laws were considered legally valid (though perhaps morally objectionable and maybe even voidable through legal mechanisms). However, Blackstone's explicit "no validity if contrary" statement strongly pushes against this interpretation.
      *   **Scholarly Consensus:** While nuances exist, the **dominant interpretation** (and the one Hart and Fuller were reacting to) is the **Strong Reading**. Blackstone is seen as firmly in the classical natural law tradition on this point. He is committing to the idea that substantive injustice (contravention of NL) *invalidates* a purported law, stripping it of legal character. This creates a necessary connection between law and morality *for legal validity*.

  2.  **Hart's Separability Thesis vs. Blackstone:**
      *   **Hart's Core Point (1958):** Hart argues for the **Separation Thesis** (often misstated as the "Separation of Law and Morals" – he prefers "separability"). His key claim is that **it is not *necessarily* true that the criteria for the validity of a law include conformity to morality or justice.** Legal validity is a matter of *social fact* – does the rule emanate from a source recognized as authoritative by the rule of recognition within that legal system (e.g., passed by Parliament, established by precedent)? A rule can be legally valid yet morally repugnant, and vice-versa.
      *   **Defusing Blackstone:** Hart directly attacks the Strong Reading. He argues Blackstone's view is:
          *   **Confusing:** It conflates "law" as a description of what *is* (valid according to system rules) with "law" as a description of what *ought* to be (morally just). Saying an unjust law "is not law" is ambiguous and potentially dangerous, obscuring the fact that it *is* part of the positive legal system and may be enforced.
          *   **Empirically False/Unnecessary:** We can *describe* a legal system (like Nazi Germany or apartheid South Africa) and identify valid laws within it using social sources (e.g., "enacted by the Reichstag") *without* needing to morally evaluate each rule. Insisting that only just laws are valid prevents us from accurately describing such systems *as legal systems* and obscures the precise nature of the moral dilemma citizens/judges face ("This is the law, but it is unjust").
          *   **Unhelpful:** Calling an unjust law "not law" doesn't tell us *what* to do about it (disobey? work for change? nullify?). Acknowledging it *is* law but morally wrong clarifies the choice.
      *   **Hart's Alternative:** Law is a system of primary rules (duties) and secondary rules (rules about rules, like recognition, change, adjudication). Validity flows from the rule of recognition, a social practice, *not* from moral merit. Blackstone's natural law is simply one possible *content* that might be incorporated into a rule of recognition (e.g., "What Parliament enacts is law, provided it doesn't violate fundamental human rights"), but it's not *necessary*.

  3.  **Fuller's "Inner Morality" vs. Blackstone:**
      *   **Fuller's Core Point:** Fuller agrees with Hart that the Strong Reading (substantive natural law as a *necessary condition* for validity) is problematic. *However*, he disagrees with Hart that law and morality are *entirely* separable. Fuller argues for a **procedural natural law**: there is an "internal morality of law" – principles essential for law to *be* law and function as a guide to human conduct.
      *   **The Eight Canons:** Laws must be (1) general, (2) promulgated, (3) prospective (not retroactive), (4) clear, (5) non-contradictory, (6) possible to obey, (7) relatively constant, and (8) congruent with official action. Failure in these respects doesn't just make law *bad*, it makes it *fail as law*.
      *   **Handling Blackstone Differently:** Fuller would likely say:
          1.  **Agreement on Connection:** Blackstone is *right* that there's a necessary connection between law and morality, but *wrong* to locate it *only* in substantive justice (NL).
          2.  **Reframing the Passage:** The "validity" Blackstone speaks of *deriving* from natural law could be reinterpreted (generously) to *include* the requirements of the inner morality. A system utterly failing Fuller's canons *cannot* derive genuine authority or "force" because it cannot function as law. A statute that was secret, retroactive, impossible to obey, and constantly changing *wouldn't* be a valid law, not because it was substantively unjust, but because it failed procedurally.
          3.  **Focus on Function:** Fuller shifts the focus from *substantive content* ("Is this law just?") to *procedural form* ("Can this thing even operate *as* law?"). A law meeting Fuller's canons *can* be valid law *even if substantively unjust* (though its injustice is still a problem). Blackstone's passage, in Fuller's view, conflates two different kinds of "morality" inherent in law: the procedural (essential for existence) and the substantive (essential for goodness).
          4.  **Defusing the Strong Reading Softly:** Fuller rejects Blackstone's *substantive* validity test ("contrary to NL = invalid") as too blunt and disconnected from law's distinctive function. His inner morality provides a *different*, procedural basis for saying certain purported "laws" fail as law, which Hart's positivism struggles to account for adequately.

  **Taxonomy for Your Chapter:**

  1.  **Blackstone's Position:** Interpreted as advocating the **Strong Reading** of the classical natural law thesis (`Lex Iniusta Non Est Lex`). Validity requires substantive conformity to natural law. His two sentences are compatible under this reading: contrary laws are invalid, valid laws derive authority from NL.
  2.  **Hart's Positivist Response:**
      *   **Core Thesis:** Strict **Separability Thesis** (Law and morality are conceptually distinct).
      *   **Critique of Blackstone:** Blackstone's view confuses law as it *is* (social fact, source-based validity) with law as it *ought* to be (moral ideals). It's descriptively inaccurate and practically unhelpful. Validity is determined by social sources (Rule of Recognition), not moral content.
      *   **Defusing Mechanism:** Provides a clear, value-neutral method for identifying valid law *within* any system, regardless of its justice. Separates the question "Is this valid law?" (descriptive, sociological) from "Is this law just?" (moral).
  3.  **Fuller's Procedural Natural Law Response:**
      *   **Core Thesis:** Rejects *substantive* natural law as a validity condition (`à la` Blackstone), but argues for a **necessary connection** between law and *procedural* morality (Inner Morality of Law).
      *   **Critique/Reframing of Blackstone:** Agrees law needs a moral foundation for validity/authority, but locates it in the *form and function* of lawmaking, not its *substantive outcomes*. Blackstone's focus on substantive NL is misplaced for determining validity.
      *   **Defusing/Replacing Mechanism:** Offers an *alternative* natural law criterion for validity focused on process. A "law" failing the inner morality *isn't law* because it cannot guide conduct. This provides a *procedural* basis for invalidity distinct from substantive justice, addressing a gap in both Blackstone (too substantive) and Hart (no necessary connection).

  **Key Distinction for Your Writing:**

  *   **Blackstone (Strong):** Substantive Injustice → **Invalidity** (Not Law)
  *   **Hart:** Substantive Injustice → **Valid (but Immoral) Law** (Separability)
  *   **Fuller:** Procedural Failure (e.g., secret, retroactive) → **Invalidity** (Not Law); Substantive Injustice → **Valid (but Immoral) Law** (as long as procedurally sound)

  Your instinct about the potential tension in Blackstone is astute. While the strong reading dominates interpretations Hart and Fuller engaged with, the "derivation" language does hint at a more systemic view. However, the explicit "no validity if contrary" clause decisively anchors it in the strong tradition Hart sought to dismantle with the separability thesis, while Fuller sought to replace it with his procedural alternative. Good luck with the chapter! This is core stuff.
