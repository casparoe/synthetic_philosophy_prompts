  First, I need to parse the Blackstone quote. The user quoted a section where Blackstone says natural law is supreme, and human laws contrary to it are invalid. The key phrases are "no human laws are of any validity, if contrary to this" and "such of them as are valid derive all their force... from this original." The user is confused whether these two parts are compatible and what exactly Blackstone is committing to.

  Looking at Blackstone's context, he was an 18th-century jurist. His Commentaries were foundational in common law. The passage in question comes from the introduction, where he discusses the nature of laws. The strong reading would align him with Aquinas's lex iniusta non est lex. But is that accurate? The second part about valid laws deriving authority from natural law suggests a source-based view. 

  I recall that scholars like Hart have interpreted Blackstone as holding the strong view. But others argue that Blackstone might be talking about the ultimate source of authority rather than a validity test for each law. The user's confusion about compatibility between the two sentences makes sense. If a law is invalid when contrary to natural law, but valid laws derive authority from it, there's tension. Maybe Blackstone means that valid laws are those consistent with natural law, so derivation and validity are linked.

  Now, the user wants to know how Hart's separability thesis counters this. Hart, in his 1958 Harvard Law Review article, argued that law and morality are separate. He distinguished between primary and secondary rules. For Hart, a law's validity comes from social sources like legislation or precedent, not moral correctness. So, even an unjust law could be legally valid if it meets the system's criteria. This directly opposes Blackstone's view. Hart would say Blackstone's approach conflates law with morality, leading to confusion. For example, calling an unjust law "invalid" blurs the distinction between what the law is and what it ought to be.

  Then there's Fuller's perspective. Fuller focused on the internal morality of law—procedural criteria like generality, promulgation, non-retroactivity, etc. Fuller might argue that Blackstone's natural law is too substantive. Instead, Fuller's procedural natural law ensures laws are functional. So, a law could be procedurally proper but substantively unjust. Fuller might say that Blackstone's view is incomplete because it doesn't address the inner morality that makes law possible. Fuller's approach provides a different kind of validity based on process, not just substance.

