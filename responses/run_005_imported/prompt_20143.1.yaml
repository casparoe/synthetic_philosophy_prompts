answer: |-
  You've hit upon one of the most profound puzzles in moral philosophy: the binding force of a promise when all conventional social mechanisms and relational consequences vanish. Let's dissect Hume and Scanlon rigorously, then confront your case directly. Neither theory easily resolves it, but the *nature* of their failure is illuminating.

  ### I. Hume's Conventionalist Engine: Justice as an Artificial Virtue
  Hume's account (Treatise, Bk III, Pt II, Sec I-V) doesn't merely say promises are useful conventions; he builds their binding force through a specific *social machinery*:

  1.  **The Problem of Self-Interest:** Humans need cooperation for survival/flourishing, but our natural self-interest and limited generosity make direct, simultaneous exchange of goods/services impossible ("I need your corn now, but you don't need my labor until harvest"). Promises solve this coordination problem.
  2.  **The Invention of the Symbolic Act:** Words like "I promise" are devised as a *conventional sign*. This sign isn't magic; it's like inventing the rules of property. Its meaning arises from collective agreement.
  3.  **The Obligation Generator: Mutual Advantage & Resentment:**
      *   **Utility:** The *practice* of promise-keeping is immensely useful. It enables complex, deferred cooperation, creating stability and trust essential for society.
      *   **Reciprocity & Interest:** Individuals see that *their own* long-term interest depends on adhering to the convention. If I break promises, others won't cooperate with me.
      *   **Moral Sentiment via Sympathy:** Through sympathy, we share the feelings of those harmed by broken promises. Witnessing promise-breaking evokes *disapproval and resentment* in observers (not just the victim). Conversely, promise-keeping evokes *approval*.
      *   **The "Artificial" Virtue:** This collective disapproval/approval, arising from perceived utility and mediated by sympathy, *creates* the moral sentiment ("ought") attached to promise-keeping. It's "artificial" because it's not innate like compassion; it's constructed by human convention for mutual benefit.

  **Why the Obligation Binds (for Hume):** You feel obliged because:
      *   You recognize the *general utility* of the practice.
      *   You feel the *social pressure* of potential resentment/disapproval.
      *   You have a *self-interested stake* in maintaining the system for future interactions.
      *   Sympathy connects you to the *general harm* caused by undermining trust.

  **Your Case vs. Hume:** Hume's engine stalls here. The key elements generating the obligation require an *ongoing social context*:
      *   **No Reciprocity:** There is no future interaction with your aunt, nor a need to maintain your reputation *with her*.
      *   **No Enforceable Resentment:** There is no one left who witnessed the promise or has a direct stake in its fulfillment *who can hold you accountable* or resent its breach. The social mechanism of resentment loses its target.
      *   **Diminished Social Utility:** While the *general practice* remains useful, fulfilling *this specific* promise yields no tangible social benefit (no cooperation facilitated, no trust maintained *between living parties*). The harm of breaking it seems isolated and inconsequential to the social fabric.
      *   **Sympathy's Limit:** Sympathy might make you imagine your aunt's *past* disappointment if she knew you broke it, but Hume ties the moral sentiment to *present* social utility and *observable* harm/resentment. A purely private, unobservable act lacks the social fuel.

  **Conclusion (Hume):** Strictly on Humean terms, the *moral* obligation dissolves with the death of the promisee and the disappearance of any social context where the breach could harm the practice or evoke resentment. The feeling that persists might be explained as habit, personal sentiment (like affection for your aunt), or a lingering echo of the social sentiment, but not as a *binding moral duty* generated by the convention itself for *this* promise.

  ### II. Scanlon's Expectational Engine: Principle F and the Wrong of Manipulation
  Scanlon's account (WWTE, Ch. 7) bypasses convention entirely. The core wrong of breaking a promise is found in **Principle F**:

  > *"If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A’s not doing so); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then, in the absence of special justification, A must do X unless B consents to X’s not being done."*

  **The Obligation Generator: The Wrong of Abuse of Trust:**
  1.  **Creating an Expectation:** By promising, you *deliberately* create a specific expectation in the promisee about your future conduct. You *intend* for them to rely on this expectation.
  2.  **The Assurance Dynamic:** Crucially, you provide this assurance *because you know they desire it* and you *aim* to satisfy that desire for security/planning. You invite their trust.
  3.  **The Source of the "Must":** Breaking the promise is wrong because it **manipulates the promisee's reliance**. You *exploited* their trust to get them to form an expectation/basis for action, knowing they would rely on it. Going back on your word is a *retroactive betrayal* of the position you deliberately put them in. It's "leaving them in the lurch" after actively encouraging them to depend on you. The obligation stems from the *wrongness of this manipulative action*, not from the words themselves or a social practice.

  **Why the Obligation Binds (for Scanlon):** You feel obliged because you recognize that breaking the promise would mean you had *wronged the promisee* by the very act of creating the expectation you now disregard. It would reveal your initial assurance as manipulative or insincere.

  **Your Case vs. Scanlon:** Scanlon's engine also faces a challenge, but it's different from Hume's:
      *   **The Problem of the Extant Expectation:** Your aunt *did* form an expectation based on your assurance. Scanlon argues the wrong lies in the *character of the act* performed *at the time of promising*: the act of inviting trust with the intention of creating reliance. This act has a moral quality *then*.
      *   **Is the Wrong Retroactive?** Scanlon emphasizes the *retroactive* nature of the wrong: breaking the promise *makes it true* that your initial act of assuring her *was* an abuse of her trust. It reveals the assurance as defective *at the time it was given*.
      *   **The "In the Lurch" Objection:** But can she *be* "left in the lurch" now? She can't suffer disappointment or harm *now*. However, Scanlon might argue:
          *   **The Past Wrong Argument:** The wrong *occurred* if you break it, but it occurred *at the time of the promise*. You *were* insincere or manipulative *then*, even if the consequences only become apparent (to you, morally) later. Her death doesn't erase the moral quality of *your past act*.
          *   **The Disrespect Argument:** Breaking the promise shows profound disrespect *for the person she was* and the trust *she placed in you*. It disregards the value of the relationship you had and the significance of that moment.
      *   **The "Special Justification" Clause:** Scanlon allows for "special justifications" to override Principle F. Your aunt's death *might* be seen as altering the reasons for keeping the promise (e.g., if the promise no longer served its original purpose). But this depends on the *content* of the promise. If the promise was intrinsically valuable to *her* or symbolic of your relationship, death may not nullify the reasons to fulfill it as a mark of respect.

  **Conclusion (Scanlon):** Scanlon's theory *can* potentially explain the binding force, strictly on its own terms. The key move is focusing on the *retroactive moral defect* inflicted on your *past act* of promising and the *disrespect shown to the past person and relationship*. The obligation persists because breaking the promise would fundamentally alter the moral description of what you *did* to your aunt when you made the promise – turning it from an act of assurance into an act of manipulation or bad faith. The feeling binds because you recognize that breaking it would stain that past moment and your relationship with dishonesty.

  ### III. Does Either Theory Explain *Your* Promise?

  1.  **Hume:** Strictly on Humean terms, **no**. The social machinery generating the distinctively *moral* obligation (via utility, reciprocity, resentment, and sympathy within an ongoing practice) is dismantled. The feeling you experience likely stems from non-Humean sources: personal loyalty, love, reverence for your aunt's memory, a sense of personal integrity, or the internalization of a moral norm whose original social foundation is gone. Hume might call this a "natural" sentiment (like familial affection) mistaken for the "artificial" virtue of promise-keeping.
  2.  **Scanlon:** **Yes, potentially, with a crucial emphasis on the retroactive wrong.** Scanlon provides the resources. The binding force comes from understanding that breaking the promise would reveal your *past act* of giving assurance at her bedside as fundamentally defective – a manipulation of her vulnerability and trust in a profound moment. Keeping it is necessary to affirm that your assurance *was* genuine and that you respected *her* and the trust *she placed in you*. Her current inability to be disappointed doesn't erase the moral significance of *how you acted towards her then* or the disrespect shown to *who she was* and *what that moment meant* by reneging. The obligation is to the truth of that past act and the value of that past relationship.

  **Why Your Intuition Persists & The Limits of Theory:**

  Your deep intuition that the promise *is* binding points to something both theories struggle to fully capture, though Scanlon gets closer:

  *   **The Enduring Significance of the Past Act:** The moment of promising, especially in the context of impending death, has a monumental, irrevocable quality. Your words *did* something real in that relationship at that time. Breaking the promise feels like a violation of a sacred moment, a betrayal of the person you were *then* to your aunt, and a denial of the significance *she* attached to your words. Scanlon's "retroactive wrong" touches this.
  *   **Identity & Integrity:** Keeping the promise is tied to your sense of self – the person who made that vow. Breaking it feels like a fracture in your own narrative integrity, a denial of the commitment that shaped a part of who you are.
  *   **The Objectivity of the Obligation:** Both theories ground obligation in contingent facts (social utility, psychological expectations). Your intuition feels like the obligation exists *because of the promise itself*, independent of consequences or anyone knowing. This points towards a more deontological view (like Kant's) where the act of promising creates a freestanding moral fact based on autonomy and fidelity. Scanlon tries to capture this through Principle F's focus on the inherent wrong of manipulation, but it still relies on the psychological state of the promisee *at the time*.

  **Final Verdict:**

  *   **Hume** genuinely fails, on his own strict terms, to explain a *moral* obligation persisting in your case. The social-conventional engine is offline.
  *   **Scanlon** has the resources to explain it by focusing on the retroactive moral defect inflicted on your past act of promising and the disrespect shown to your past relationship and your aunt as she was. **This is the "move" you might have missed:** The binding force isn't about disappointing her *now*, but about the truth of your character and actions *then*, and the respect owed to her memory and the significance of that moment. Her death doesn't nullify the moral quality of what you *did* when you gave her your word. Keeping it affirms the sincerity and respect inherent in that original act.
