  Let me break this down systematically. First, the retributivist first principle: punishment tracks moral desert based on culpable choice. The actus reus requirement must be examined - is it about the physical action or the culpable engagement? In both cases, the defendants performed identical culpable acts (aiming, pulling trigger) with identical mens rea. The gun jamming was pure luck.

  Now the counterarguments user mentioned:
  1. Harm as desert-constitutive: But this conflates outcome with desert. Desert comes from what the agent controls - their will and conduct. The completed harm is external to the agent's moral action.
  2. Crime individuation: While legally distinct, morally the culpable choice is identical. The "completed act" distinction only holds if we prioritize outcomes over intent.

  Aha - the key move is showing how any outcome-dependent punishment necessarily imports consequentialist elements: deterrence (punishing success more to discourage harmful outcomes) or expressive justice (symbolically responding to harm). But pure retributivism rejects such "socially useful" considerations.

  For the judge's voice, I should emphasize the cold logic: "The law claims to punish wickedness, yet here it punishes misfortune." Highlight how the failed attempter actually demonstrated greater dangerousness (overcame more obstacles) yet gets punished less. That paradoxical outcome undermines retributivism's core promise.

  The user needs this airtight because their plot turns on it. I'll structure it as a judicial opinion: state the retributive principle, show its implications, dismantle counterarguments, reveal hidden consequentialism in the status quo. The conclusion should have rhetorical force - about justice being blind to luck's accidents.
answer: |-
  Here’s a rigorous retributivist argument for punishing attempted and completed murder equally, structured as your judge’s internal reasoning. It systematically dismantles the "harm-as-desert-constitutive" rejoinder and exposes the hidden consequentialism in outcome-dependent sentencing:

  ---

  ### The Core Retributivist Principle: Desert Resides in the Will
  "Retribution, properly understood, is not vengeance for harm inflicted but justice for choices made. What an agent *deserves* is measured by the quality of their will—the conscious, culpable intention to violate fundamental moral and legal norms. The actus reus is essential only insofar as it manifests that guilty mind *through the agent’s own conduct*. Once the defendant has performed every act within their control to consummate the crime, their moral desert is fixed. Luck—whether a gun jams, a victim stumbles, or a third party intervenes—cannot *increase* or *decrease* their culpability. It can only alter the *consequences* of their fixed culpability.

  ### Addressing the Rejoinder: Is Harm Itself Constitutive of Desert?
  **The Claim:** *"Completed harm is not merely evidence of culpability; it is intrinsically part of the wrong for which we punish. Attempted murder and murder are distinct crimes because the murderer has *actually violated* the victim’s right to life, while the attempter has not. This ontological difference justifies differential desert."*

  **The Refutation:**
  1.  **Moral Agency vs. Metaphysical Outcome:** Retributivism grounds desert in *agency*, not metaphysics. The murderer and the attempter have *identical* intentions: to kill. They perform *identical* voluntary acts: aiming a lethal weapon, pulling the trigger. The murderer’s bullet killing the victim is a *causal outcome*, not a further *moral choice*. To make desert hinge on the physical result is to punish the actor for events outside their control—precisely what retributivism rejects when it condemns punishing the unlucky reckless driver more harshly than the lucky one. If desert is truly about *what the agent deserves for their choices*, the outcome is irrelevant.
  2.  **The 'Violated Right' Fallacy:** The claim that the murderer "violates a right" while the attempter merely "attempts to violate it" mischaracterizes the moral wrong. The fundamental wrong condemned by criminal law is the *conscious choice to destroy innocent life*. Both defendants commit *this* wrong. The attempter violates the victim’s right to *security* and *bodily integrity* just as egregiously as the murderer in the moment they pull the trigger. The victim’s survival is a post-hoc fact, not a diminution of the attempter’s *intentional violation* at the time of the act. Punishing the murderer more severely implies the *victim’s death* is a separate wrong *attributable to the killer*, rather than acknowledging it as the tragic *consequence* of a wrong already complete in the killer’s will and action.
  3.  **Individuation by Outcome is Consequentialist Camouflage:** Legally distinguishing "murder" from "attempted murder" based on outcome serves practical purposes (ease of proof, resource allocation), but it is not a *retributive* distinction. When pressed, the justification for harsher punishment for the completed act invariably reduces to:
      *   **Deterrence:** "We must punish actual harm more to deter people from causing it." (Consequentialist)
      *   **Victim/Vengeance Focus:** "Society/the victim demands greater punishment for the realized harm." (Vengeance, not desert-based justice)
      *   **Expressive Condemnation:** "The law must express greater outrage for actual death." But this expression targets the *outcome*, not the *culpability*. True retributive expression condemns the *intent and effort* equally. Punishing outcome more expresses outrage at *luck*.

  ### Where "Harm as Constitutive" Covertly Imports Consequentialism
  1.  **The "Dangerousness" Mirage:** One might argue the completed murderer demonstrates greater "dangerousness." But this is false. The failed attempter *demonstrated identical dangerousness*: they took identical lethal actions. The difference lies solely in *effectiveness*, not dangerousness. Punishing effectiveness is punishing skill or luck, not moral desert. Furthermore, assessing "dangerousness" looks *forward* (risk of future harm), a consequentialist concern, not backward at desert for the act committed.
  2.  **The "Moral Luck" Contradiction:** Retributivism promises justice based on *control*. If harm is constitutive of desert, we punish people for what they *could not control* (the outcome). This is the essence of resultant moral luck. The retributivist who accepts this abandons the core tenet that desert must be self-contained within the agent's will and choices. It becomes a system punishing *fate* as much as *fault*.
  3.  **The Paradox of Increased Culpability:** Consider the saboteur scenario. The *only* difference between the cases is a *third party's* action preventing the harm. How can a *third party's* benevolent intervention *reduce the attempter's desert*? If the attempter's desert is less because the victim lived, we imply the saboteur *did the attempter a moral favor*, lessening her blameworthiness. This is perverse. The attempter's desert should be utterly unaffected by the secret intervention of another; it was fixed when she willed the death and acted upon it.

  ### The Unavoidable Conclusion for the Consistent Retributivist
  "To punish the failed attempt less severely than the completed murder is not a nuanced application of retributivism; it is its abandonment. It substitutes a focus on *outcomes* for a focus on *culpable choices*. It allows the happenstance of a firing pin, a gust of wind, or an unseen saboteur to mitigate moral blameworthiness in the eyes of the law. This is anathema to justice.

  The law must punish the *intentional attempt to destroy a human life* with the utmost severity, irrespective of cosmic dice rolls. The defendant who aims a sighted rifle at her husband's heart and pulls the trigger has committed the same profound moral wrong as the one whose bullet finds its mark. Her will was equally malicious, her choice equally heinous, her rejection of the victim’s humanity equally complete. The jammed mechanism did not make her *less guilty*; it only made her *less successful*.

  Sentencing the attempter less harshly might soothe our consequentialist desire for proportional outcomes or placate an intuition that 'no harm, less foul.' But true retributive justice demands we look past the accident of result to the fixed landscape of the defendant's culpable mind and chosen acts. Anything else elevates luck over liberty and consequence over character. We punish *the person*, not the physics."

  ---

  ### Key Strengths for Your Novel
  *   **Internal Logic:** Forces the judge to confront the tension between her stated philosophy and legal reality.
  *   **Dramatic Weight:** Her conclusion is radical (equal punishment) and pits her against conventional wisdom, highlighting her intellectual rigor and isolation.
  *   **Philosophical Rigor:** Directly engages with the "harm-constitutive" argument, showing its dependence on non-retributive elements (metaphysical outcomes, dangerousness, social expression) and its vulnerability to the "third-party intervention" paradox.
  *   **Character Voice:** Allows for powerful, coldly logical pronouncements about justice, luck, and the nature of evil. ("We punish the person, not the physics.")
  *   **Plot Catalyst:** This opinion would be explosive, challenging precedent and inviting appeals/public backlash, driving the novel's conflict forward.

  This reasoning provides the uncompromising retributivist foundation your judge needs, making her subsequent actions (whether she adheres to it or finds it pragmatically impossible) deeply consequential for her character and the story.
