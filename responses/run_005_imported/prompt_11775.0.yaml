answer: |-
  Here's a proper steelman of both positions, followed by an analysis of who holds the stronger argument:

  **Steelman of the Manager's Position (Protecting Shared Norms/Values):**

  1.  **Workplace as a Moral Community:** A company isn't just a collection of individuals performing tasks; it's a community built on shared values, trust, and mutual respect. These values are the bedrock of its culture, identity, and internal cohesion. Employees implicitly agree to represent these values when they join.
  2.  **Values Transcend Direct Harm:** Conduct incompatible with core company values (e.g., integrity, responsibility, health, community well-being – even if interpreted subjectively) can erode the *foundation* of trust and shared identity, even if it doesn't cause immediate, tangible harm to performance or a specific colleague. Like discovering a neighbor holds deeply offensive but private views, it fundamentally alters how others perceive and relate to them, poisoning the communal well.
  3.  **Preventing Erosion & Maintaining Cohesion:** Allowing conduct demonstrably at odds with stated values creates cognitive dissonance and undermines morale. Employees who strongly identify with the values may feel betrayed or alienated knowing colleagues engage in conduct they find fundamentally objectionable, leading to friction, reduced collaboration, and a "why bother?" attitude towards the values themselves.
  4.  **Reputational Risk Management:** In the age of social media, private conduct rarely stays private. If controversial but legal conduct becomes public knowledge (e.g., extremist political activities, certain types of legal pornography, public intoxication), it can cause *significant* reputational damage to the company, alienate customers/investors, and make recruitment harder, even if the employee never brought it to work. The company has a legitimate interest in preventing this *potential* harm proactively.
  5.  **Managerial Prerogative & Defining Culture:** Management has the right and responsibility to define and protect the company's culture and values. This includes setting boundaries for conduct deemed incompatible, even off-duty. Employees are free to choose workplaces whose values align with their own personal choices.

  **Steelman of Your Friend's Position (Requiring Demonstrable Harm):**

  1.  **The Presumption of Liberty:** Employees are free citizens outside work hours. In a liberal society, the default position is that individuals have the right to engage in any lawful conduct that doesn't harm others. The burden of proof lies entirely with the employer to justify why *this specific* lawful conduct warrants intrusion into an employee's private life.
  2.  **The Slippery Slope & Vagueness Danger:** "Company values" and "incompatible" are inherently vague and subjective terms. Granting HR the power to police lawful private life based on such nebulous concepts creates a dangerous slippery slope. What next? Dismissing someone for their political views, religious practices, diet, legal relationships, or hobbies simply because a manager or vocal group finds them "incompatible"? This opens the door to arbitrary enforcement, discrimination, and a climate of fear.
  3.  **The Harm Principle as Essential Boundary:** The *only* legitimate justification for workplace discipline is conduct that demonstrably harms or creates a significant, foreseeable risk of harm to: a) the employee's job performance, b) colleagues (e.g., harassment, creating a hostile environment), c) the company's tangible interests (e.g., theft, disclosing secrets), or d) safety. Without this concrete link to harm, discipline is purely moralistic overreach, transforming HR into a corporate morality police.
  4.  **Erosion of Trust & Psychological Safety:** Knowing HR can discipline you for perfectly legal private behavior destroys employee trust and psychological safety. People will constantly self-censor, hide aspects of their lives, and fear accidental discovery, creating a stifling and inauthentic work environment. This harms morale and engagement far more than knowing a colleague smokes legal cannabis on weekends.
  5.  **Inefficiency and Distraction:** Policing lawful off-duty conduct diverts HR and management resources from addressing *actual* workplace problems like performance issues, discrimination, harassment, and safety hazards. It fosters gossip and judgment rather than professionalism.

  **Who is Actually Right, and Why?**

  **Your friend holds the stronger position.** The requirement for **demonstrable harm** is the crucial safeguard against corporate overreach and the protection of fundamental employee liberty. Here's why:

  1.  **The Vagueness Problem is Fatal:** The manager's position relies entirely on subjective interpretations of "values" and "incompatibility." Who defines them? How consistently? What conduct qualifies? Without a concrete harm requirement, this policy is inherently arbitrary and prone to abuse, bias, and inconsistency. It empowers HR/management to enforce personal moral preferences under the guise of "company values."
  2.  **The Slippery Slope is Real:** Dismissing someone for legal cannabis use today logically permits dismissal for other legal but unpopular private choices tomorrow (e.g., political donations, legal firearm ownership, certain sexual practices, unpopular religious observances, criticizing the company online off-hours). The principle of policing lawful private life *without harm* has no inherent limiting principle.
  3.  **Harm Principle Provides Objective Guardrails:** Requiring demonstrable harm (to performance, colleagues, tangible business interests, or safety) provides a clear, objective standard. It focuses discipline on *conduct that actually impacts the workplace*, not private morality. The cannabis example perfectly illustrates this: no harm was demonstrated or even alleged.
  4.  **Fundamental Rights Outweigh Vague Cultural Cohesion:** While workplace culture is important, it cannot justify infringing on core liberal rights to privacy and lawful private conduct. The potential for vague "erosion of values" or unspecified "reputational risk" is too flimsy and subjective a justification for overriding an individual's freedom outside work. Companies can foster positive cultures without policing lawful private lives.
  5.  **Practical Consequences:** The manager's policy, as described, creates a climate of fear, distrust, and inauthenticity. It damages the very "community" it purports to protect by turning colleagues into potential informants on each other's private lives and making employees feel constantly surveilled.

  **Conclusion:**

  The manager's desire for a cohesive culture is understandable, but the mechanism chosen – policing lawful off-duty conduct *without requiring demonstrable harm to the business or colleagues* – is fundamentally flawed and dangerous. It grants employers excessive, unaccountable power over employees' private lives based on subjective criteria. **Your friend is correct: a company generally has no legitimate business acting on off-duty conduct unless it demonstrably harms the workplace, specific colleagues, or the company's tangible interests.** The burden of proof must always lie with the employer to show this concrete harm. The cannabis dismissal described is a clear example of unjustified overreach based on the new policy. The "shared sense of what's normal and acceptable" cannot legitimately extend to controlling employees' lawful private lives in the absence of actual harm.
