  ok so in my philosophy of space and time seminar, newton's bucket is THE argument for substantivalism: the water goes concave even once its co-rotating with the bucket (so zero relative motion between them), meaning the concavity can't be about relative motion — it must be rotation relative to space itself. fine, i buy that part. but the next reading was on galileo's ship / galilean relativity, where uniform velocity is NOT detectable from inside a sealed system and is therefore merely relative, not a real fact about space. these feel like they're in tension: both are "can a sealed observer detect this kind of motion" arguments, yet newton answers yes for rotation and no for velocity. my prof said this gets patched by moving to "neo-newtonian" (galilean) spacetime but kind of rushed through it, and i didnt actually get how that structure lets you keep absolute rotation/acceleration while dropping absolute position and velocity. can you walk through that properly, and say whether the patch still counts as substantivalism about space or whether it quietly concedes the relationist's point for everything except rotation? not looking for the intro-level bucket recap, more the part after that.
