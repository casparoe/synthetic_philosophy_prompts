answer: |-
  You've pinpointed a fascinating tension within Moore's ethics, one highly relevant to your land trust's mission. Moore *does* hold both positions, and reconciling them requires understanding the nuances of his concepts of **intrinsic value** and **organic unities**. Here's how they fit together:

  1.  **Intrinsic Value & the Unperceived Beautiful World:**
      *   Moore's core argument in the thought experiment is that beauty possesses **intrinsic value**. Its goodness is a simple, non-natural property inherent to the state of affairs "the existence of beauty."
      *   The stipulation that the world is unperceived isolates this property. He argues that we intuitively judge the beautiful world to be *better* than the hideous one *even though no one experiences either*. This demonstrates that beauty's value isn't *derived solely* from the pleasure or appreciation it causes in observers; it has value "in itself."
      *   **Conclusion for the Land Trust:** Protecting remote wilderness preserves states of affairs possessing intrinsic value simply by virtue of their beauty, complexity, or natural order, regardless of human observation. This *is* a sturdy justification on Moorean grounds.

  2.  **Organic Unities & The Amplification of Value:**
      *   Moore's principle of organic unities states that "the value of a whole must not be assumed to be the same as the sum of the values of its parts." A whole can have a value greater (or less) than the mere sum of its parts' values when considered in isolation.
      *   **Applying this to Beauty & Appreciation:**
          *   *Part A (Isolated):* The existence of unperceived beauty (the beautiful object/landscape) has intrinsic value (V_a), as per the thought experiment.
          *   *Part B (Isolated):* A state of aesthetic appreciation (e.g., the feeling of admiration for beauty, *even directed at nothing specific*) might also have *some* intrinsic value (V_b), though Moore likely sees this as lower or less certain than the value of the beauty itself.
          *   *The Organic Unity:* The state of affairs "Person P *appreciating* the beauty of Object O" forms a new whole. Crucially, the value of *this whole* (V_whole) is **far greater** than the sum of V_a + V_b. The appreciation *fits* the beauty, and this fitting combination generates a unique and significantly higher value.
          *   **Analogy:** Think of flour (V_a) and sugar (V_b). Separately, they have some value. Combined in the right way with other ingredients (the "fitting" combination), they create cake (V_whole), whose value is vastly greater than flour + sugar.

  3.  **Reconciling the Two: Value Retention vs. Value Amplification:**
      *   **Unperceived Beauty Retains Significant Value:** Moore does *not* say that unperceived beauty has *only* a "small residue" of value. His thought experiment explicitly argues it has substantial intrinsic value (V_a) *on its own*. The organic unity principle doesn't *diminish* V_a; it demonstrates that V_a can be *incorporated* into a *different* state of affairs (the appreciation-beauty complex) that has *even more* value (V_whole).
      *   **It's Not Subtraction, It's Addition & Transformation:** The key is to avoid thinking that the value of the isolated beauty is *reduced* because it *could* be part of a more valuable whole. Its intrinsic value remains V_a. The appreciation-beauty complex *starts* with V_a but adds V_b *and* the unique value generated by their *organic combination*. V_whole >> V_a + V_b.
      *   **The Value of the Base:** Unperceived beauty is the essential *foundation*. Without V_a existing, there *cannot be* the vastly more valuable organic unity V_whole. Protecting V_a preserves the possibility for future V_whole and honors the intrinsic value present *now*.

  4.  **Applying the Analogy to Unloved Admirable Qualities:**
      *   Moore absolutely *can* (and implicitly does) say something parallel about unloved admirable qualities.
      *   **Intrinsic Value of Qualities:** Moore likely believed that certain admirable qualities (e.g., kindness, courage, intellectual honesty) possess intrinsic value *in themselves*. A world containing such qualities is better than one without them, even if no one recognizes or loves them. (This is less explicitly argued than beauty, but consistent with his framework).
      *   **Organic Unity of Affection:** Moore places the state of "consciousness of the intrinsic value of human affection" very high, possibly highest. Crucially, he means the appreciation *of* another person's qualities *combined with* the appreciation of *their* appreciation (mutual affection). This complex state (Person A appreciating the admirable qualities of Person B *and* Person B appreciating the admirable qualities of Person A) forms an organic unity of immense value (V_love_whole).
      *   **The Parallel:** Just like unperceived beauty:
          *   The admirable qualities themselves have intrinsic value (V_q) even if unloved.
          *   The organic unity of mutual personal affection (V_love_whole) is vastly more valuable than the sum of the isolated qualities (V_q + V_q) or isolated states of appreciation.
          *   The unloved qualities (V_q) retain their intrinsic value. They are the essential foundation *for* the possibility of the immensely valuable organic unity of mutual love. Without V_q existing, V_love_whole is impossible.
      *   **Does Personal Affection Resist Isolation?** Moore isolates the *elements* conceptually (the quality, the feeling of appreciation) to analyze their *potential* intrinsic value. But the *greatest good* – mutual personal affection – is *inherently relational* and *is* the organic unity itself. You can't isolate the "greatest good" aspect; it only exists *as* the complex whole. However, the *constituent parts* (the admirable qualities, the capacity for appreciation) *can* be considered in isolation and retain *some* intrinsic value.

  **Conclusion & Application for the Land Trust:**

  *   **Moore Provides Strong Support:** Your intuition is correct. Moore offers a robust philosophical justification: protecting remote wilderness preserves states of affairs (beauty, natural order) that possess **significant intrinsic value**, demonstrably good even if unperceived (V_a). This is not just intuition; it's a core argument from *Principia Ethica*.
  *   **Reconciling Organic Unities:** The principle of organic unities doesn't undermine this. It explains *why* we rightly value the *experience* of beauty (V_whole) even more highly. However, V_whole *depends upon* the prior existence of V_a. Protecting V_a preserves the foundation for both its inherent worth *and* the potential for future higher goods (V_whole).
  *   **The Analogy Holds:** Unloved admirable qualities (V_q) retain intrinsic value, just like unperceived beauty (V_a). The greatest good involving them (mutual affection, V_love_whole) is an organic unity that amplifies value but doesn't negate the value of the qualities alone.
  *   **Argument for the Trust:** You can argue:
      1.  The wilderness possesses intrinsic value (beauty, ecological complexity, existence value) that is real and good *in itself* (Moore's isolated beautiful world).
      2.  While experiencing this beauty creates a *different* and potentially *greater* good (the organic unity of appreciation), this greater good *requires* the underlying intrinsic value to exist first.
      3.  Protecting the wilderness preserves this fundamental intrinsic value. It honors the "beautiful world" now and safeguards the essential foundation for any future human appreciation.
      4.  Furthermore, knowing such beauty *exists*, even unseen, can itself be a form of appreciation that approaches being part of an organic unity – the consciousness of the intrinsic value *of* the unperceived beauty *in the world*. This knowledge arguably has value greater than the unperceived beauty alone, though less than direct perception.

  Moore's framework provides a powerful argument that protecting unseen wilderness is not just sentimental; it's the preservation of intrinsic goodness in the universe. The organic unity principle enriches this by explaining the *additional* value of direct experience, without diminishing the core value of the beauty itself. This offers a "sturdier" foundation than intuition alone for your land trust's vital work.
