  The user's confusion is between intrinsic value and the amplification from organic unities. They might think that if the combination is so much better, then unperceived beauty must have less value. But Moore would argue that the intrinsic value remains significant; it's just that adding appreciation enhances it. The analogy of a base ingredient in a recipe could help. Flour has value on its own, but when made into a cake, the cake's value is greater. The flour doesn't lose its worth; it's foundational. Similarly, unperceived beauty is the foundation that, when appreciated, becomes a greater good.

