prompt: |-
  ok this is going to sound random, but I started a new job last month doing animal-research compliance work (reviewing protocols before they go to our IACUC), and its sent me down an animal-ethics rabbit hole I was NOT prepared for. What keeps nagging at me is this bit from Nozick I half-remember from undergrad, where he floats something like "utilitarianism for animals, kantianism for people" -- animals' interests get aggregated/traded off utilitarian-style, but humans get the strong Kantian inviolable-rights treatment, never merely used as means. back then I just nodded along, but now that i'm looking at actual protocols it feels like a total cop-out, a way to have it both ways, and i can't quite pin down why (if it even is one). could you write me a dialogue between someone defending that nozick-style split view and a singer-style utilitarian who thinks the split is arbitrary/speciesist -- real back-and-forth where they engage each other's strongest points (esp on marginal cases like severely cognitively disabled humans vs. highly intelligent animals), not just talking past each other.
