answer: |-
  ## The Unmasked Failure: Why Masking Defeats Conditional Analysis and Demands Primitivism

  The quest to reduce dispositions to counterfactual conditionals has proven remarkably fraught. While Lewis's "reformed" conditional analysis (RCA) successfully navigated the treacherous waters of Martin's "finkish" counterexamples by requiring the persistence of the intrinsic causal basis, Johnston's "masking" and Bird's "antidotes" present a distinct and arguably more devastating challenge. This essay argues that **masking cases demonstrate a fundamental limitation not only of RCA but of any conditional analysis, compelling us to treat dispositions as metaphysically primitive.** While principled extensions of RCA are conceivable, they either lapse into circularity, become non-reductive, or fail to capture the essence of dispositionality, leaving primitivism as the most coherent option.

  **Lewis's Reformed Analysis and the Threat of Finks:**
  The simple conditional analysis (SCA) – "x is disposed to give r to s iff if x were subjected to s, x would give r" – succumbs to finks. A finkishly disposed object loses (positive fink) or gains (reverse fink) the disposition *precisely* when the stimulus occurs. Martin's insight was that the disposition itself must persist *through* the stimulus for the manifestation to occur. Lewis's RCA addresses this by incorporating the intrinsic causal basis (CB): "x is disposed to give r to s iff x has some intrinsic property B, such that if x were subjected to s *and B were to persist through the time of s*, then s and B would jointly cause r." The persistence requirement blocks finks, as finks work by removing or altering the CB *during* the stimulus, preventing the causal process.

  **The Emergence of Masking/Antidotes:**
  Masking/antidotes operate differently. Here, the intrinsic CB persists undisturbed through the stimulus, and the stimulus occurs. However, an *external* factor intervenes *downstream* in the causal chain initiated by the CB and stimulus, preventing the manifestation r from occurring. Classic examples abound:
  1.  **Fragile Vase:** A fragile vase (CB: molecular structure) is struck (s). The CB persists, and the causal process (crack propagation) begins. However, it is instantly encased in rapidly hardening foam (mask), preventing shattering (r).
  2.  **Poison:** A lethal poison (CB: chemical composition) is ingested (s). The CB persists, and the toxin begins affecting the system. However, an antidote (mask) is simultaneously administered, neutralizing the poison before death (r) occurs.
  3.  **Solubility:** A soluble salt (CB: ionic structure) is placed in water (s). The CB persists. However, the water is saturated (mask), preventing dissolution (r).

  In each case, the object *has* the disposition (fragility, lethality, solubility), the CB persists, the stimulus occurs, yet the manifestation is blocked by an external intervention acting *after* the CB-stimulus interaction has begun, but *before* r is fully realized.

  **Can RCA Accommodate Masking? The Completion Strategy and Its Perils:**
  Lewis himself proposed a potential solution: the "completion" strategy. RCA could be amended to: "...then s and B would jointly cause r *provided nothing interferes*." The idea is that the counterfactual implicitly assumes the absence of masks, just as it assumes the absence of finks.

  However, this strategy faces severe problems:
  1.  **Circularity/Triviality:** What counts as "interfering"? An interfering condition is precisely one that prevents the manifestation *despite* the presence of the CB and stimulus – i.e., one that *masks the disposition*. Defining "interfere" non-circularly, without appealing to the disposition itself or its manifestation, seems impossible. Saying "nothing prevents r" makes the analysis vacuously true ("x is disposed to give r iff if s and B persist, then r would occur unless it doesn't") and utterly uninformative. The analysis loses its reductive power.
  2.  **Loss of Specificity:** The "provided nothing interferes" clause is hopelessly vague. It doesn't specify *what kinds* of interferences are relevant or *when* they must be absent. Does it rule out *all* physically possible preventers? This seems too strong (e.g., a magical force field instantly materializing around the vase). Does it rule out only "relevant" or "expected" preventers? This introduces context-dependence and subjectivity anathema to a reductive analysis. RCA aimed to ground dispositions in intrinsic properties and precise causal relations; this clause abandons that precision.
  3.  **Failure to Capture the Disposition Itself:** The masked vase *is* fragile. Its intrinsic CB *is* poised to cause shattering upon striking, *under normal conditions*. The mask is an external accident. RCA + Completion struggles to capture this because the counterfactual ("if struck and CB persists, it would shatter unless interfered with") is true *only* if we implicitly understand the absence of masks as part of the "normal" background. But this understanding *presupposes* the disposition (fragility) rather than defining it. The disposition explains *why* the mask is relevant, not vice-versa.

  **Principled Extensions? Normal Conditions and Ceteris Paribus:**
  Could we salvage a conditional analysis by building in a "normal conditions" clause? "x is disposed to give r to s iff x has intrinsic B, such that *under normal conditions*, if x were subjected to s and B persisted, then s and B would cause r."

  This faces similar issues:
  1.  **Defining "Normal":** Defining "normal conditions" non-circularly is notoriously difficult. Are they conditions where masks *don't occur*? Again, circularity looms. Are they statistically common conditions? This makes dispositions contingent on accident (e.g., is fragility different in a world full of foam encasers?). Are they conditions specified by the *science* underlying the disposition? This moves towards primitivism, as the scientific explanation relies on the dispositional properties of the CB (e.g., the molecular structure's *disposition* to break under stress).
  2.  **Ceteris Paribus Not Salvific:** Appealing to *ceteris paribus* (all else being equal) laws fares no better. The *ceteris paribus* clause itself often means "in the absence of factors that would prevent the manifestation," which again collapses into circularity when trying to define the disposition itself. What needs to be "equal" is precisely the absence of masks and finks.

  **Why Masking Points to Primitivism:**
  Masking cases reveal a deep truth about dispositions that conditional analyses cannot capture:

  1.  **Intrinsic Basis + Extrinsic Luck:** A disposition is grounded in an *intrinsic* causal basis (B). However, whether the *manifestation* (r) occurs upon stimulus (s) depends not only on the persistence of B but also on the *absence of extrinsic, downstream blockers*. The object possesses the disposition *in virtue of* B, but B only guarantees the manifestation *if* the causal path to r remains unobstructed. The disposition itself, however, is a property of the object *now*, based solely on its intrinsic state (B).
  2.  **The Explanatory Primacy of the Disposition:** We identify B *as* the causal basis *because* it grounds the disposition. We understand the mask *as* a mask *because* it prevents the manifestation *of that disposition* despite the presence of B and s. The disposition is the prior concept used to interpret both the basis and potential interferers. Trying to define the disposition solely in terms of B, s, and a counterfactual outcome (r), while needing to exclude masks non-circularly, fails because the disposition is the conceptual anchor.
  3.  **Robustness Across Interference:** Our disposition ascriptions are remarkably robust. We confidently call the foam-encased vase fragile and the neutralized poison lethal. This robustness stems from recognizing that the *power* or *potential* is inherent in the object (via B), even if external circumstances prevent its exercise in a particular instance. Conditional analyses, focused solely on the manifestation's occurrence, struggle to capture this inherent power aspect. Primitivism, by taking dispositions as fundamental properties, accommodates this directly: an object possesses a dispositional property (e.g., fragility) as a basic feature, explaining both why it *would* break under s in ideal circumstances and why, in masked circumstances, it *doesn't* break *despite* having that property.

  **Verdict:**

  While Lewis's RCA admirably solved the problem of finks by demanding the persistence of the intrinsic causal basis, **masking cases expose an insurmountable obstacle for any conditional analysis of dispositions.** Principled extensions, such as completion strategies or appeals to normal conditions, either collapse into circularity (by implicitly referencing the disposition they aim to define), become non-reductive and vague, or fail to capture the core intuition that the disposition is an intrinsic property of the object *now*. Masking demonstrates that the connection between the intrinsic basis and the manifestation is not guaranteed solely by the basis and the stimulus; it is inherently vulnerable to extrinsic interference. Attempting to build the absence of such interference into the analysis non-circularly is impossible without presupposing the disposition itself.

  Therefore, **masking necessitates treating dispositions as metaphysically primitive.** Dispositions are fundamental properties of objects, grounded in their intrinsic causal bases, which confer specific potentials or powers. These powers explain *why* objects *would* behave in certain ways under ideal conditions (manifestation), *why* finks remove the power, and *why* masks prevent the exercise of the power without removing it. Recognizing dispositions as primitive provides the most coherent and robust framework for understanding these diverse phenomena and the nature of potentiality in the world. The failure of conditional analysis is not merely a technical setback; it reveals the fundamental dispositional character of causality and propertyhood.
