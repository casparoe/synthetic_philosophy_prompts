  First, I need to unpack the core tension: Nadia sees Confucian role ethics as institutionalizing nepotism, while Colin defends it as a permissible recusal mechanism. The user wants a move-by-move analysis rather than a verdict, so I'll mentally reconstruct their five argument stages:

