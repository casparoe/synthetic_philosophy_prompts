  But Dave's model reduced North to 43-44%. Why? The user mentioned that Dave's model finds the closest probability distribution consistent with the new odds. Maybe it's using a different approach, like minimizing KL divergence or something. 

  Perhaps the issue is that the initial distribution had North-Upper and North-Lower each at 25%, which implies P(Upper|North) = 0.5. The new info changes that to 1/6 and 5/6. If the model is trying to stay as close as possible to the original while respecting the new constraint, but why would that reduce P(North)? 

