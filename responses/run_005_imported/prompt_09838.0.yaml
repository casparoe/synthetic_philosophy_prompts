  After research, I recall that in probability kinematics, when updating a conditional probability, the marginal can change if the conditional affects the likelihood. But here, the evidence is specific to the North partition. 

  Perhaps Dave's model is minimizing the change in the joint distribution subject to the new constraint. For example, minimizing the sum of squared differences or KL divergence from the prior, subject to P(Lower|North) = 5/6. 

