answer: |-
  **MEMORANDUM**  
  **TO:** Technical Committee, County Search and Rescue  
  **FROM:** [Your Name], Technical Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Allocation Recommendation & Policy for Conditional Tips (Eagle Ridge Search)  

  ### **SUMMARY**  
  I recommend **NOT reallocating teams away from North tonight** based on the new tip. The tip only addresses how probability *within* the North sector should shift (Lower Bowl vs. Upper Ridge). It does NOT justify reducing North’s overall 50% probability or increasing South’s probability. For future cases, I propose a **standing policy: conditional tips only update probabilities within the specified area, leaving broader sector odds unchanged unless evidence directly supports a change.**  

  ---

  ### **BACKGROUND**  
  1. **Current Probability Map:**  
     - **South:** 50%  
     - **North:** 50% (split evenly: **Upper Ridge 25%**, **Lower Bowl 25%**).  

  2. **New Tip (from ski partner):**  
     > *"If she stayed north of the saddle, she’s 5–6x more likely in Lower Bowl than Upper Ridge."*  
     This provides **zero information** about South or the North-vs-South split. It only addresses how probability *within North* should change.  

  3. **Dave’s Model Output:**  
     - North overall drops to ~44%.  
     - South rises to ~56%.  
     - Dave recommends moving a team from North-Upper to South.  

  ---

  ### **ANALYSIS: WHY THE TIP SHOULD NOT AFFECT NORTH-vs-SOUTH ODDS**  
  The tip is **conditional**—it only applies *if* the skier is in North. It does **not** say she is *more likely to be in North* or *less likely to be in South*. Here’s the intuitive breakdown:  

  1. **The Tip Only Updates Probabilities *Inside* North:**  
     - Before tip:  
       - If in North, 50% chance Upper, 50% chance Lower.  
     - After tip:  
       - If in North, ≈17% (1/6) chance Upper, ≈83% (5/6) chance Lower.  
     - **South is unaffected** because the tip says nothing about it.  

  2. **Why Dave’s Model Shifts Probability to South (and Why It’s Misleading Here):**  
     Dave’s spreadsheet uses a "minimum adjustment" method (closest math match to current probabilities that fits the new tip). While mathematically sound *in general*, it **misapplies conditional information** in this context:  
     - The model treats the tip as a constraint that forces it to rebalance *all* probabilities, including South.  
     - **Result:** It "borrows" probability from North-Upper (which dropped sharply) and redistributes it across the entire map—including South—to minimize overall disruption.  
     - **Why this fails:** The tip gives **no evidence** to justify increasing South’s probability. South’s odds rising from 50% to 56% is an artifact of the model’s math, not real-world evidence.  

  3. **The Practical Risk:**  
     Shifting teams to South based on this tip would reduce effort in North-Lower (now the highest-risk sector inside North) and redirect resources to South on false premises. If the skier is in North, we’d be under-searching the most likely part of it.  

  ---

  ### **RECOMMENDATION FOR TONIGHT’S SEARCH**  
  1. **Do NOT move teams from North to South.**  
  2. **Reallocate resources WITHIN North:**  
     - Prioritize **North-Lower Bowl** (now ≈41.5% probability within North).  
     - Reduce focus on **North-Upper Ridge** (now ≈8.5% probability within North).  
  3. **Keep South’s allocation unchanged** at 50%.  

  *Updated Probabilities (Math Check):*  
  - South: **50%** (no change).  
  - North: **50% total** (no change).  
    - North-Lower: **≈41.5%** (5/6 of North’s 50%).  
    - North-Upper: **≈8.5%** (1/6 of North’s 50%).  

  ---

  ### **PROPOSED STANDING POLICY FOR CONDITIONAL TIPS**  
  To prevent recurring debates, adopt this rule:  
  > **"When a tip provides conditional odds (e.g., ‘If in Area A, then X is Y times more likely than Z’), it updates probabilities *only within the specified sub-area*. Broader sector probabilities remain unchanged unless new evidence directly supports revising them."**  

  **Examples:**  
  - ✅ *This tip:* Updates North-Lower vs. North-Upper odds. North-vs-South unchanged.  
  - ❌ *Dave’s model:* Should not be used for conditional tips, as it redistributes probability to unrelated sectors.  

  ---

  ### **ACKNOWLEDGING DAVE’S METHOD**  
  Dave’s model works well for *unconditional* tips (e.g., "South is 3x more likely than North overall"). However, it overreaches when applied to *conditional* evidence. My "gut feeling" wasn’t wrong—it reflected a correct intuition that conditional information should stay contained. The flaw is in applying a general math tool to a specific, inappropriate case.  

  ---

  **ACTION REQUESTED:** Vote at tomorrow’s briefing to adopt the conditional-tip policy and approve tonight’s allocation per above. Let’s settle this for good.  

  // Signed //  
  [Your Name]  
  **CC:** Dave, Search Managers, Technical Committee
