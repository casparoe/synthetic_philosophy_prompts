  The user described their experience where minimizing KL-divergence led to an unintuitive shift in the southern half's probability despite the evidence only concerning the north. This mirrors Judy Benjamin's case where HQ's message about Red territory (3:1 odds for HQ vs Second Company) intuitively shouldn't affect the Blue/Red probability, yet KL-minimization pushes P(Blue) from 0.5 to ~0.53. The boundary case where odds go to infinity (ruling out Second Company) forces P(Blue)=2/3 via standard conditionalization, breaking the "always 0.5" intuition.

  Their explicit requests:  
  - Commit to a position (not survey literature)  
