prompt: |-
  So my dad had a health scare a couple months ago and it turns out he's been borderline hypertensive for years without knowing it, because he's on this beta-blocker (originally prescribed for migraines, of all things) that happened to keep his blood pressure readings looking completely normal on paper. His cardiologist said something that stuck with me: the drug isn't treating the hypertension, it's masking it -- the underlying tendency toward dangerously high blood pressure is still fully there, it's just not allowed to show up as long as he keeps taking the pill. I mentioned this to my roommate, who's a philosophy TA, mostly as small talk, and she got way more excited than the situation warranted. Apparently this is a textbook "masking" case that metaphysicians use against a certain theory of what dispositions (fragility, solubility, that kind of thing) actually are, and there's a whole seperate family of counterexamples called "finks" that's supposed to be a different problem for the same theory -- and philosophers apparently still argue about whether finks and masks are really two different threats or just the same trick in two costumes.

  I looked up the basic idea myself -- the simple analysis being something like "x is disposed to M when C iff x would M if C" -- and I get why a poison-with-the-antidote-already-in-your-system case is supposed to break that. What I don't get is why my roommate kept insisting that "fixing" the analysis to rule out finks (something about tying the disposition to an intrinsic "causal basis" held fixed through the test, which I think traces back to David Lewis, but don't hold me to that) doesn't also automatically rule out masks. Could you actually walk through the comparison properly for me: what exactly distinguishes a fink from a mask as an objection to the conditional analysis of dispositions, and does a fix aimed at blocking one kind of counterexample generalize to the other? I'd also want your actual opinion on which of the two is the more serious problem for anyone who still wants to analyze dispositions in terms of counterfactuals at all -- not just a list of definitions, since I'd like to go back to my roommate with something better than "so I guess they're both bad."
