  EU(exit) = P(first)*0 + P(second)*4 = 0 + 4 * [p/(1+p)] = 4p/(1+p) 

  EU(continue) = P(first) * [future payoff] + P(second) * [future payoff] 

  If at first and continue, you go to second intersection. At second, you will exit with prob (1-p) getting 4, or continue with prob p getting 1. So EU from continuing at first is (1-p)*4 + p*1 = 4 - 4p + p = 4 - 3p. 

