  If you're at first (prob 1/(1+p)), continuing gives the expected payoff from the next intersection, which is EU_second = (1-p)*4 + p*1 = 4 - 3p. 

  If you're at second (prob p/(1+p)), continuing gives 1. 

  So EU(continue) = [1/(1+p)] * (4 - 3p) + [p/(1+p)] * 1 = [4 - 3p + p] / (1+p) = (4 - 2p)/(1+p) 

