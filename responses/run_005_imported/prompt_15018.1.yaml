  Let me unpack their dilemma layer by layer. First, the Molinist picture: God has three "moments" of knowledge—natural (necessary truths), middle (counterfactuals of freedom), and free (post-creation decisions). The sticking point is that middle knowledge includes truths like "If Sarah prays for X in circumstance C, I would do Y." So when God chooses to actualize a world where Sarah prays, the outcome is already baked into that world's selection.

