  First, I should recall the core of supervaluationism: it preserves excluded middle by making disjunctions true if they hold in all admissible histories, even if individual disjuncts are indeterminate. The user's discomfort likely stems from how truth is defined here. Ordinary truth seems tied to what's actual, but supervaluationism uses truth over possibilities. This shift might feel like a dodge because it avoids committing to the actual future.

  The user's deeper need is to articulate why this technical solution feels unsatisfying. They might want to uphold a correspondence theory of truth where statements are true based on reality, not possibilities. Supervaluationism's approach could seem to undermine the link between truth and actuality. Also, the rejection of bivalence while keeping excluded middle might appear inconsistent with everyday reasoning where "P or not P" being true implies one of them must be true.

  I need to argue that the cost of supervaluationism—truth of disjunctions without true disjuncts—is as problematic as bivalence failure. This involves showing that our ordinary concept of truth requires that a true disjunction must have a true disjunct. By violating this, supervaluationism creates a new paradox, essentially restating Aristotle's puzzle in a different form. The resolution is linguistic rather than substantive, which doesn't fully address the metaphysical uncertainty that Aristotle highlighted.

  I should also address the user's unspoken need for a coherent alternative or a stronger critique. They might seek validation that their intuition about truth's nature is reasonable. Emphasizing the divergence from common sense and the potential for counterintuitive outcomes (like true disjunctions with no true parts) could strengthen their argument. Highlighting that supervaluationism trades one problem for another, without solving the underlying issue of future contingents, would underscore their point that it's a restatement, not a resolution.
answer: |-
  Your intuition is spot-on: supervaluationism doesn't dissolve the core tension in Aristotle's puzzle; it relocates it from the *truth-value* of individual future contingents to the *meaning* and *behavior* of truth itself, creating a cost arguably equal to or greater than the bivalence failure it avoids. The key objection is that **supervaluationism fundamentally severs the intuitive, essential link between the truth of a disjunction and the truth of at least one of its disjuncts, violating a deep principle of ordinary reasoning about truth that is arguably more fundamental than bivalence.**

  Here’s a sharper articulation of your objection:

  1.  **The Core Intuition About Disjunction:** In ordinary language and classical logic, the truth of "P or Q" is *parasitic* on the truth of at least one of P or Q. We understand "or" precisely as meaning that *at least one alternative holds*. If someone asserts "It will rain tomorrow or it will not rain tomorrow" is true *today*, our natural question is: "Which one is it? Will it rain or won't it?" We expect the truth of the disjunction to be *grounded* in the truth of one disjunct. We cannot conceive of the disjunction being true while *neither* disjunct is true. This grounding principle is arguably more central to our pre-theoretic concept of truth than bivalence itself.

  2.  **Supervaluationism's Violation:** Supervaluationism explicitly breaks this link. It declares "There will be a sea battle tomorrow or there will not be one" (P ∨ ¬P) true *simpliciter* today because it's true on *every* admissible history. However, it simultaneously declares *neither* disjunct ("There will be a sea battle tomorrow" (P) nor "There will not be a sea battle tomorrow" (¬P)) true *simpliciter* today, because neither holds on *all* admissible histories. Truth *simpliciter* (supertruth) is decoupled from the actual future and defined solely over the space of possibilities.

  3.  **The Cost: Trading Bivalence Failure for Disjunction Failure:**
      *   Aristotle's puzzle presents a cost: rejecting bivalence (the principle that every meaningful statement is true or false) for future contingents feels deeply counterintuitive and threatens excluded middle (P ∨ ¬P).
      *   Supervaluationism *appears* to avoid the cost of rejecting excluded middle by preserving its supertruth. However, it pays a *different, equally severe cost*: it rejects the **disjunction property for truth *simpliciter***. It allows a disjunction to be true *simpliciter* while *no* disjunct is true *simpliciter*.
      *   **Why is this cost as serious?** Because the grounding of disjunction is arguably *more fundamental* to our ordinary concept of truth and logical reasoning than bivalence. We readily grasp the idea that we might not *know* which disjunct is true (epistemic limitation), but the idea that a disjunction is *definitely true* while *definitely neither disjunct is true* is deeply paradoxical on the face of it. It feels like a formal trick: "Your disjunction is true, but don't ask *which part* makes it true, because neither part *is* true (in the same sense)." This violates the very meaning we assign to "or" and "true" in conjunction.

  4.  **Restatement, Not Resolution:** What supervaluationism achieves is a clever *redescription* of the problem using the machinery of possible histories and supertruth. Instead of saying "P is neither true nor false," it says:
      *   "P is not supertrue and not superfalse."
      *   "¬P is not supertrue and not superfalse."
      *   "P ∨ ¬P is supertrue."
      The core *metaphysical* problem – the lack of a determinate, present fact of the matter about the contingent future event – remains untouched. The *logical* tension is not resolved; it's transformed. The discomfort shifts from "How can P ∨ ¬P be true if neither P nor ¬P has a truth value?" to "How can P ∨ ¬P be *supertrue* if *neither* P nor ¬P is *supertrue*, and what does 'supertrue' even *mean* if it allows this?" The technical apparatus masks but does not eliminate the underlying indeterminacy.

  5.  **The Threat to Truth's Connection to Actuality:** Ordinary truth aims to correspond to *how things actually are*. Supertruth corresponds to *how things must be, no matter which possible future unfolds*. While related, these are distinct. Declaring P ∨ ¬P "true" (supertrue) today, while insisting we cannot say anything true (supertrue) about *which* disjunct describes the *actual* future, feels like a disconnect. It suggests that "truth" (supertruth) applies to the *framework of possibilities* rather than directly to the unfolding *actuality*. This can feel like a retreat from the correspondence intuition that motivates truth-talk in the first place.

  **In essence:** Supervaluationism resolves Aristotle's puzzle *only* by redefining "truth" (as supertruth) in a way that deliberately severs the intuitive, necessary connection between the truth of a disjunction and the truth of its disjuncts. This severance is not a minor side effect; it is the core mechanism. The objection is that **violating this deep intuition about disjunction is *at least* as damaging to our ordinary concept of truth and logical reasoning as admitting truth-value gaps (bivalence failure) would be.** It doesn't solve the puzzle; it offers a technically consistent framework that preserves excluded middle *by* accepting a consequence (true disjunctions without true disjuncts) that seems equally, if not more, paradoxical from the perspective of ordinary truth-talk. It trades one counterintuitive result for another, leaving the fundamental metaphysical indeterminacy intact and merely dressing it in different logical clothing.
