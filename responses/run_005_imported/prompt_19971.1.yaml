prompt: |-
  So I went down a rabbit hole after an old LW thread linked to the SEP page on epistemic contextualism, and I think I finally get the bank cases (the classic setup where someone only bothers double-checking the bank's Saturday hours when theres real money riding on it). But contextualism and pragmatic encroachment both seem to just be two ways of saying the same thing, that higher stakes make knowledge harder to get, so they should always agree on whether a given person counts as knowing in any specific case. Given that, why do epistemologists like Stanley and DeRose treat them as genuine rivals instead of just two vocabularies for one insight?
reasoning: |-
  Okay, the user is asking about the difference between epistemic contextualism and pragmatic encroachment, specifically why they're considered rivals despite both addressing how stakes affect knowledge. Let me start by recalling what each theory entails.

  First, contextualism, like DeRose's, says that the meaning of "knows" changes with context. In low stakes, the standards for knowledge are lower, so saying "I know" is true. In high stakes, the standards rise, making the same claim false. It's about the semantics of knowledge attributions.

  Pragmatic encroachment, as per Stanley, argues that practical stakes directly affect whether someone has knowledge, not just the word's meaning. So in high stakes, even if all epistemic factors are the same, the knowledge itself is undermined because the stakes are higher. 

  The user thinks both agree that higher stakes make knowledge harder, so why the rivalry? The key difference is in what's being affected: contextualism is about language (the word "knows"), while pragmatic encroachment is about the knowledge itself. Contextualists maintain that truth conditions of knowledge claims depend on context, whereas encroachment says the stakes change the epistemic status directly. 

  I should explain the "same verdict, different reasons" point. Both might say a person doesn't know in high stakes, but for different underlying reasons. Contextualism attributes it to the context shifting the semantic standards, while encroachment says the knowledge relation is affected by practical factors. 

  Also, the user might be conflating agreement on outcomes with theoretical equivalence. Even if both theories lead to similar conclusions in bank cases, their explanations differ fundamentally. That's why epistemologists debate them—because they have different implications for the nature of knowledge and language. 

  The user's deeper need might be understanding why philosophers treat them as distinct theories despite surface similarities. They might want clarity on the nuances that separate the two, which is crucial for engaging with epistemological debates. Highlighting the semantic vs. epistemic distinction and the theoretical implications should address that.
answer: |-
  You've hit on a crucial insight – contextualism and pragmatic encroachment *do* often deliver the same verdicts in specific cases like the bank examples. However, they are fundamentally rival theories because they offer **diametrically opposed explanations** for *why* knowledge seems harder to get in high stakes, and they have **radically different implications** for the nature of knowledge itself. Here's the breakdown:

  1.  **The Core Difference: What Stakes Affect**
      *   **Contextualism (DeRose, Lewis):** Stakes affect the *context of attribution*. They change the **semantic standards** (the meaning/truth-conditions) of the word "knows." In low-stakes contexts, "S knows that P" requires meeting a lower epistemic standard. In high-stakes contexts, the *same sentence* "S knows that P" requires meeting a much higher epistemic standard to be true. **Knowledge itself doesn't change; the conversational context changes what counts as satisfying 'knows'.**
      *   **Pragmatic Encroachment (Stanley, Fantl & McGrath, Hawthorne):** Stakes affect the *state of knowledge itself*. They change the **epistemic relation** required for S to know that P. High practical stakes genuinely make it *epistemically harder* for S to know P, even holding all purely "truth-relevant" factors (evidence, reliability, etc.) constant. **Knowledge *itself* is partially constituted by practical factors.** The word "knows" has stable truth-conditions, but whether S meets them depends partly on practical stakes.

  2.  **Why They Seem Similar in Bank Cases (Same Verdict, Different Reason):**
      *   **Low Stakes:** Both agree "Keith knows the bank is open Saturday" is true (or appropriately asserted).
          *   *Contextualist Reason:* The conversational context sets a low standard; Keith easily meets it with his ordinary evidence.
          *   *Encroacher Reason:* The low stakes mean Keith's ordinary evidence *is sufficient* for knowledge (the epistemic bar is low).
      *   **High Stakes:** Both agree "Keith knows the bank is open Saturday" is false (or inappropriate).
          *   *Contextualist Reason:* The high-stakes context sets a *much higher* standard; Keith's ordinary evidence no longer meets it. He doesn't *fail* to know in the *old* sense; the *meaning* of "knows" has shifted.
          *   *Encroacher Reason:* The high stakes *raise the epistemic bar Keith needs to meet*. His ordinary evidence, sufficient in low stakes, is now *epistemically insufficient* for knowledge. He genuinely lacks a knowledge-state he might have had with the same evidence in lower stakes.

  3.  **Why They Are Genuine Rivals:**
      *   **Nature of Knowledge:**
          *   Contextualism preserves a **purely truth-conducive** (evidentialist/internalist/reliabilist - depending on the version) core for knowledge. Practical stakes only affect how we *talk* about knowledge, not its essence. Knowledge is "shifty" only linguistically.
          *   Pragmatic Encroachment makes knowledge **inherently practical**. What counts as *sufficient* evidence/reliability/justification for knowing P *depends* on the practical costs of being wrong about P. This directly challenges traditional evidentialism/internalism.
      *   **Semantics vs. Metaphysics:**
          *   Contextualism is primarily a **semantic thesis** about the word "knows" and knowledge attributions. It's a theory about language use.
          *   Pragmatic Encroachment is primarily a **metaphysical/epistemological thesis** about the nature of the knowledge relation itself. It's a theory about what knowledge *is*.
      *   **Stability of 'Knowledge':**
          *   Contextualism implies that whether S "knows" P *in the absolute sense* is unstable – it depends entirely on who is asking and why. There's no single answer to "Does Keith *really* know?" outside a context.
          *   Pragmatic Encroachment implies that whether S *has the knowledge-state* regarding P is stable relative to a fixed practical situation. If Keith's evidence and the practical stakes are fixed, he either knows or he doesn't, full stop. The answer to "Does Keith *really* know?" depends on the *actual* stakes he faces, not the attributor's context.
      *   **Theoretical Implications:**
          *   Contextualism needs to explain how and why the standards shift linguistically (e.g., Lewis's "Rule of Attention").
          *   Encroachment needs to explain *how* practical stakes become an epistemic factor (e.g., via the connection between knowledge and action/assertion norms - you can't properly act/assert on P unless you know P, and what counts as "properly" depends on stakes).

  **Analogy:** Imagine two theories explaining why a liquid boils at different temperatures on a mountain vs. at sea level.

  *   **Theory A (Contextualism Analogue):** The *meaning* of "boiling point" changes with altitude. At sea level, "boils at 100°C" means it reaches the bubbling state at 100°C. On the mountain, "boils at 100°C" means it reaches the bubbling state at a lower temperature. The *physical process* (water molecules gaining enough energy to overcome atmospheric pressure) is the same; we've just redefined the words.
  *   **Theory B (Encroachment Analogue):** The *physical process itself* is affected. Atmospheric pressure *directly changes the amount of energy* (heat) required for the molecules to escape and cause boiling. The meaning of "boiling point" (the temperature where liquid turns to gas) is stable, but the temperature required to achieve that state changes with pressure.

  Both theories predict water boils at a lower temperature on the mountain (same verdict as the bank cases). But they are fundamentally rival explanations: one is about language/convention, the other is about physics.

  **Why Stanley & DeRose Treat Them as Rivals:**

  *   **Stanley (Encroacher):** Believes contextualism is an unnecessary linguistic trick that avoids the real, uncomfortable truth: practical interests are *constitutive* of knowledge. He thinks it misdiagnoses the phenomenon revealed by the bank cases.
  *   **DeRose (Contextualist):** Believes encroachment unnecessarily "pragmatizes" the core epistemic relation. He argues that the linguistic flexibility of "knows" elegantly explains our intuitions without abandoning traditional, purely truth-conducive accounts of justification and knowledge. He sees encroachment as a radical and undesirable departure.

  **In essence:** They agree on the *phenomenon* (knowledge attributions are sensitive to stakes) but vehemently disagree on the *explanation* (is it about how we *use the word* "knows," or is it about what *knowledge itself* requires?). This disagreement strikes at the heart of what knowledge *is* and how language relates to it, making them genuine theoretical rivals, not just different vocabularies.
