  - Can't fully embrace pure EV either (hijacking risk)
  - Hybrid model seems best: cap speculative allocations

  *checks calendar* They need numbers by Thursday - no time for new research. Pragmatic solution: allocate majority to safe health option (say 70-80%), remainder to animal welfare as "exploratory" funding. This acknowledges both theories while containing downside risk.

  The objector might accept this - it neutralizes hijacking by bounding exposure. Ethically defensible too: we're balancing near-term certainty against astronomical stakes without gambling everything.

  Final memo should:
  1. Validate all three positions
  2. Show hybrid model respects each concern
  3. Recommend specific split (maybe 75/25?)
  4. Suggest framework for future votes

  User's tone suggests they favor the animal option but feel uneasy about overcommitting. This split lets them fund both conscience and common sense.
