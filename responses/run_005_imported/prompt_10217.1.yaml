  *scribbles quick expected value formula*
  EV = (Probability of theory being correct) x (Impact if correct)

  If the animal welfare impact is 1000x bigger but the probability is 0.1%, EV ties. But if impact claims are 10,000x or more... suddenly even 0.01% probability dominates. That's why he's worried.

  For the memo structure:
