  Watched Oppenheimer with the family over Thanksgiving and it turned into a whole argument about whether Truman did the right thing, which sent me down a rabbit hole afterward. Turns out the philosopher Elizabeth Anscombe was so against Truman that she wrote a whole pamphlet calling him a murderer and tried to stop Oxford from giving him a honorary degree, basically because the civilian death toll was so disproportionate to whatever military benefit came from ending the war a few months sooner. That argument bugs me though, since the Tokyo firebombing killed roughly as many people and nobody tried to block honors for the guys who planned that one, so either she was being inconsistent or her real objection was to nuclear weapons specifically, dressed up as a principled stand. Am I missing some piece of what she actually argued?
