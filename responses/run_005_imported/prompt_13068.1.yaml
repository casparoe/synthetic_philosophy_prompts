answer: |-
  You've hit on a core tension in Anscombe's argument and its reception. You're right that the scale of death in Tokyo (and other firebombed cities like Dresden) was comparable to Hiroshima/Nagasaki, and Anscombe *did* condemn those actions too. **Her objection was fundamentally about the *intentional targeting of civilians* as a *means* to win the war, which she believed applied categorically to both firebombing and atomic bombing.** However, the *Oxford degree controversy* provided a specific, high-profile platform to oppose Truman *personally* for a decision she saw as uniquely emblematic of this moral catastrophe.

  Here's a breakdown of Anscombe's core argument and why the focus landed on Truman:

  1.  **The Absolute Prohibition on Targeting Innocents:** Anscombe, drawing on Catholic Just War Theory (particularly Aquinas) and her own virtue ethics, argued that **deliberately killing innocent non-combatants is always intrinsically evil.** It violates the principle of non-combatant immunity and the absolute prohibition against murder. This isn't about *consequences* (like total deaths or ending the war sooner), but about the *intrinsic nature of the act itself.* The end does *not* justify such means.

  2.  **Intention is Key (Doctrine of Double Effect):** This is where the distinction you're sensing becomes crucial.
      *   **Atomic Bombs on Hiroshima/Nagasaki:** Anscombe argued that the *primary and immediate purpose* of dropping the bomb was to kill a massive number of civilians and destroy the civilian infrastructure of the city. The shock, terror, and societal collapse caused by annihilating the civilian population *was the means chosen* to compel surrender. Therefore, the deaths of civilians were *intended* as a means to the end.
      *   **Tokyo Firebombing (and Area Bombing):** While the *foreseen consequence* was massive civilian death, proponents *could* argue (however dubiously) that the *intended target* was industrial capacity, transportation networks, or military production *located within* the city. The civilian deaths, while anticipated and accepted, were arguably a *side-effect* (albeit a known and massive one) of attacking military targets. Under the Doctrine of Double Effect (which Anscombe supported), an action with both good and bad effects might be permissible *if*:
          *   The act itself is good or neutral (bombing military targets).
          *   The good effect is intended, the bad effect is only foreseen but not intended.
          *   The good effect is not produced *by means of* the bad effect.
          *   There is a proportionately grave reason for permitting the bad effect.
      *   **Anscombe's View on Area Bombing:** Crucially, **Anscombe rejected the validity of this distinction *in practice* for area bombing campaigns like Tokyo.** She believed the scale, methods (incendiaries specifically effective against wooden housing), and known outcomes proved that the *actual intention* was to destroy cities and kill civilians to break morale. She saw the "military target" justification as a thin veneer over a policy of deliberate terror bombing. **She condemned the firebombing of cities just as strongly as the atomic bombings on moral principle.**

  3.  **Why Focus on Truman and the Atomic Bombs for the Oxford Protest?**
      *   **The Specific Act:** Truman made the *specific, personal decision* to use the new atomic weapons on cities. He bore direct responsibility for that unique order.
      *   **Symbolism:** The atomic bombs represented a terrifying escalation in the *efficiency* of mass destruction, but for Anscombe, the *moral principle* violated was the same as area bombing. However, their singular, devastating impact made Truman's decision a stark, iconic example of the moral failure she condemned.
      *   **The Honorary Degree:** This was the immediate trigger. Awarding an honorary degree was seen by Anscombe and her supporters (like philosophers Philippa Foot and Iris Murdoch) as Oxford University *publicly honoring and condoning* actions they believed constituted mass murder. It was an opportunity to make a principled public stand against the normalization of such actions.
      *   **Feasibility of Protest:** Trying to block honors for *all* Allied leaders involved in strategic bombing (like Churchill, Arthur Harris, Curtis LeMay) would have been an even more diffuse and impossible task. Focusing on Truman for this specific, upcoming event was a targeted protest against the *principle* using a highly visible example.
      *   **The "New" Weapon Argument:** While Anscombe's core argument was about targeting civilians, not the weapon *type*, she *did* sometimes emphasize the unique horror of the atomic bomb as amplifying the moral outrage. However, her philosophical foundation remained the principle of non-combatant immunity.

  **Addressing Your Points Directly:**

  *   **"Inconsistent or Nuclear Specific?":** You're right to be bugged by the *apparent* inconsistency. However, **Anscombe was consistent in her *moral principle* (condemning all intentional targeting of civilians) but inconsistent in her *target of public protest*.** She condemned the firebombing morally but didn't launch a similar high-profile campaign against its architects. The Oxford degree was a specific catalyst focused on a specific person responsible for a specific, highly symbolic act that crystallized the moral issue for her.
  *   **"Dressed up as a principled stand?":** No, her stand *was* deeply principled, rooted in centuries of ethical thought. Her pamphlet "Mr. Truman's Degree" meticulously lays out the argument based on intentionality and the absolute wrong of targeting innocents. The *focus* on Truman was pragmatic and symbolic for the protest, but the *principle* was broader.
  *   **"Missing Piece?":** You've grasped the core. The key nuance you might be slightly underweighting is the **absolute centrality of *intention* in her moral framework.** For Anscombe, the atomic bombings made the intention to destroy the civilian population *inescapably clear* in a way that proponents of firebombing could (however disingenuously) try to obscure. Truman's decision was, for her, an unambiguous case of choosing mass murder as a tactic. Protesting *him* was the clearest way to denounce *that principle* when the university threatened to endorse it.

  **In essence:** Anscombe saw both the atomic bombings and the firebombing of cities as morally equivalent violations of the prohibition against targeting civilians. Her protest against Truman's honorary degree wasn't *only* about the atomic bombs per se, but about using that specific, undeniable instance of what she saw as mass murder to make a public, institutional stand against the principle itself. The firebombing was equally condemnable *in principle*, but the Oxford situation provided a unique platform to challenge the honoring of the man who ordered the atomic attacks.
