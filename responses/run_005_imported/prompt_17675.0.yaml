  The key tension to exploit: Kepler would be thunderstruck by the phone’s computational power (imagine skipping years of labor!) but horrified by its misuse. His treatise railed against astrologers who ignored planetary aspects in favor of lazy zodiac stereotypes. So the app is literally his dream and nightmare combined. 

