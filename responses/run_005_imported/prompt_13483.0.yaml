  Considering physics: quantum vacuum fluctuations are perfect. The information loss from early universe events is irretrievable due to cosmic inflation. For the past, prehistoric events without any trace—like a specific stone dislodged—work well. These examples must highlight the in-principle unknowability Fitch proves exists. 

  I should also address potential anti-realist responses. Dummett might reject classical logic or the knowability principle's application to all propositions. But the user needs to show their argument holds unless anti-realists make contentious moves, which weakens their position. 

