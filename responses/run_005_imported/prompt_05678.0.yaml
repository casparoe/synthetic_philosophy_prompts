  So this is kind of a random rabbit hole but hear me out. In my philosophy elective we spent like two weeks on Frege — the sense/reference distinction, the Hesperus/Phosphorus-type examples, why "the concept horse" is technically not a concept, all that — and right at the end my teacher mentioned almost as an afterthought that Frege kept a political diary near the end of his life (spring of 1924, he died in '25) where he rants about how Jews should be stripped of political rights and how Germany would've been better off with a dictator than with parliamentary democracy. Apparently Michael Dummett, basically the guy most responsible for reviving Frege's reputation in English-language philosophy in the 20th century, came across the diary while digging through Frege's papers in Germany in the 50s, and by the time he published his big 1973 book on Frege he felt he had to admit in the preface that there was something ironic about having spent years admiring the work of a "virulent racist." The full thing didn't even get properly published until 1994, and I guess this year is literally the 100th anniversary of Frege's death so there's been a little wave of blog posts about it again. I brought this up with my friend from debate and we could NOT agree — she thinks it's totally seperate from whether his logic actually holds up, I'm not so sure, and neither of us could argue the other side well.

  So could you write me a dialogue between two philosophers hashing this out — one who thinks the diary has basically zero bearing on whether we should trust things like the sense/reference distinction or the logicist project (treating your personal politics as evidence against your logic being a kind of genetic fallacy/ad hominem), and one who thinks the separation isn't actually that clean. Neither one should be a pushover — I want them actually responding to each other's specific points, not just restating their own view past each other. If you can, get the "not so clean" side to bring up this idea I stumbled on in an academic article, that Frege's zero-tolerance for anything besides ONE single objective logical truth (his whole war against Hilbert's formalism and against psychologism) might not be totally unrelated to his zero-tolerance in politics, and give the other side a real shot at explaining why that's a stretch. Maybe have them briefly get into whether Frege is even a fair comparison to someone like Heidegger, whose philosophy is way more directly tangled up with his Nazism. You could even set it at some kind of small panel discussion on Frege, since apparently that's an actual thing happening this centenary year. Doesn't need to end with a winner, just want something like 8-12 real back-and-forths that earns wherever it lands instead of one side obviously folding.
