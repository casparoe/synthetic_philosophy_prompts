  ## The Moorean Dream and the Wicked World: Keynes's Unresolved Tension

  Keynes's "Economic Possibilities for our Grandchildren" (1930) presents a tantalizing, Moorean vision: economic abundance, achieved through relentless capital accumulation, would finally liberate humanity from the "economic problem" of absolute needs. Freed from the compulsion to toil, we could abandon the instrumental "love of money" – recast from necessary driver to "disgusting" pathology – and embrace the true "good life": the cultivation of "timeless, passionate states of contemplation and communion" centered on love, beauty, and knowledge. This vision, as Keynes later confessed in "My Early Beliefs" (1938), was a direct inheritance from G.E. Moore, though one selectively pruned. The Bloomsbury group, Keynes admits, embraced Moore's conception of the ultimate good – these states of consciousness – while jettisoning his concomitant emphasis on the binding force of conventional moral rules and duties. They believed the good life was purely a matter of private, intense, aesthetic and intellectual experience, indifferent to consequences, achievement, or societal norms. Yet, writing against the backdrop of rising fascism, the older Keynes delivers a damning verdict on this selective Mooreanism: it fatally underestimated "the insane and irrational springs of wickedness in most men."

  **The Shortfall: Why the 15-Hour Week Remains Elusive**

  Keynes was remarkably prescient about the *magnitude* of material growth. By many measures, the advanced economies have achieved the productivity gains he foresaw. Yet, the predicted widespread leisure and shift away from instrumental money-seeking have not materialized. Why? The explanation lies at the intersection of his earlier economic analysis and his later psychological insight, but the primary driver is the **economics of relative needs and distribution he himself identified, yet underestimated.**

  1.  **The Insatiable Engine of Relativity:** Keynes understood that needs driven by social positioning – the desire to feel superior – were potentially limitless. However, he underestimated how this "relative" drive would be systematically amplified and exploited. Modern capitalism, fueled by advertising, consumer credit, and status competition, constantly redefines "necessity" upwards. Technological abundance didn't satiate desire; it redirected it towards ever-newer positional goods and experiences. The treadmill of keeping up, fueled by comparison (now global and instantaneous via media), ensures the "economic problem" morphs but endures.
  2.  **The Distributional Blind Spot:** Keynes assumed abundance would be widely shared. He grossly underestimated the forces of inequality. While aggregate output soared, its distribution became increasingly skewed. For the vast majority, the struggle for economic security – absolute *and* relative – persists. Stagnant real wages for many, coupled with rising costs for key goods like housing and education, mean that for large segments, the "economic problem" is far from solved. Working longer hours often remains a necessity, not a choice driven by avarice. Furthermore, the wealthy, having satisfied absolute needs many times over, channel their resources into competitive consumption and accumulation, perpetuating the status race Keynes hoped would diminish.

  While the later Keynes's insight into irrationality and wickedness explains humanity's failure to *use* potential leisure wisely (evidenced in political pathologies and self-destructive behaviors), it is less central to explaining the *absence* of that leisure. The core failure is economic and social: the system Keynes believed would generate abundance *for liberation* instead generated abundance harnessed to fuel an endless cycle of relative competition, exacerbated by profound inequality. The "love of money" persists not merely because of individual pathology, but because the system structurally incentivizes and rewards it, while failing to deliver the widespread security prerequisite for its abandonment.

  **The Ideal on Trial: Moorean Contemplation in a Wicked World**

  The harder question is whether the Moorean ideal itself – the private, contemplative pursuit of love, beauty, and knowledge, indifferent to consequence, achievement, or rules – retains its validity, irrespective of the leisure needed to pursue it. Keynes's later self-critique, highlighting the naivety of ignoring irrational wickedness and discarding moral rules, forces a reckoning. Does this invalidate the ideal, or merely reveal the flawed context of its initial adoption?

  **Defense: The Enduring Value of the Moorean Core**

  The Moorean vision, stripped of Bloomsbury's aristocratic insouciance and neglect of consequences, offers a crucial, enduring component of the good life. Its core value lies in:

  1.  **Intrinsic Value vs. Instrumental Frenzy:** In a world dominated by means-ends rationality, relentless achievement, and the commodification of experience, the Moorean emphasis on states of consciousness valued *for themselves* is a radical and necessary corrective. Contemplation of beauty, deep communion in love, and the pursuit of knowledge for its own sake represent a sanctuary from the instrumental "money game" Keynes decried. They cultivate inner richness and resilience.
  2.  **The Foundation of Meaning:** While not the *only* source of meaning, these states address a fundamental human need for connection, wonder, and understanding that transcends material accumulation or social standing. They provide a grounding that achievement or rule-following alone cannot offer.
  3.  **Psychological Necessity:** Cultivating capacities for contemplation, appreciation, and deep connection is arguably essential for psychological health and for resisting the very "springs of wickedness" Keynes later feared. A life devoid of such states risks shallowness, alienation, and susceptibility to destructive impulses or demagogic appeals offering false belonging or purpose.

  Keynes's later critique doesn't invalidate this core; it reveals the **dangerous incompleteness** of the Bloomsbury interpretation. The mistake wasn't valuing contemplation and communion; it was:
      *   **Privileging them exclusively:** Elevating private states above *all* other considerations, including consequences for others.
      *   **Dismissing rules and duties:** Believing that discerning the good in the moment obviated the need for general moral principles or civic responsibility.
      *   **Ignoring context:** Failing to see that cultivating such states requires a minimum of security and a just social order, and that their pursuit cannot be indifferent to the political and social conditions that enable or threaten them.

  **Against the Strongest Opposition: The Charge of Dangerous Irrelevance**

  The strongest opposing view argues that Keynes's later verdict *does* indict the ideal itself. In a world riven by inequality, climate catastrophe, resurgent authoritarianism, and profound injustice, the Moorean ideal – focused on private, aesthetic contemplation – appears not just naive, but dangerously **escapist, apolitical, and elitist**.

  1.  **Privilege and Passivity:** This ideal seems accessible only to a leisured elite, insulating them from suffering while offering no resources to address it. Its indifference to consequences and rules fosters political quietism in the face of wickedness. When fascism marches, contemplating beauty feels like complicity.
  2.  **Insufficient for Human Flourishing:** Humans are social and political animals. A good life must encompass engagement with the polis, striving for justice, meaningful contribution, and the exercise of agency – elements explicitly devalued in the pure Bloomsbury-Moorean formulation. Ignoring "achievement" ignores a fundamental human drive and source of dignity for many.
  3.  **Neglect of the Demands of Justice:** The ideal offers no inherent imperative to address inequality, oppression, or systemic evil. Its focus on private states can easily coexist with profound injustice, as Keynes's own elite circle arguably did. Moore's own inclusion of rules was likely an attempt to mitigate this.

  **Defending the Ideal Against the Charge:**

  This critique is powerful, but it targets a **caricature** of the Moorean good, inflated by Bloomsbury's selective reading and social detachment. The core ideal – the intrinsic value of contemplative, loving, and knowing states – is not *inherently* escapist, apolitical, or incompatible with engagement:

  1.  **Contemplation Fuels Action:** Deep engagement with art, philosophy, science, or human connection doesn't necessarily lead to withdrawal; it can fuel empathy, critical understanding, and a clearer perception of injustice. Knowledge of history or human nature, appreciation for the beauty of the world under threat, love for fellow humans – these can be powerful motivators for ethical and political action.
  2.  **Foundation, Not Entirety:** The Moorean states are best seen as a vital *foundation* or *dimension* of the good life, not its totality. A complete human life integrates contemplation with action, private fulfillment with public responsibility, appreciation of the timeless with engagement in the temporal. The ideal points to necessary goods often neglected, not to the exclusion of all others.
  3.  **A Resource Against Wickedness:** Cultivating capacities for love, deep understanding, and appreciation of beauty builds the inner resources needed to resist hatred, simplistic ideologies, and the allure of destructive power. It fosters the very discernment Keynes felt his circle lacked. While not sufficient alone, it is a necessary part of developing the moral and psychological strength to confront wickedness.

  **Conclusion**

  Keynes's economic forecast failed primarily because he underestimated the systemic power of insatiable relative needs within an unequal capitalism, not solely because of latent human irrationality. The Moorean ideal at the heart of his utopian vision, however, survives his later self-critique – albeit in a chastened and integrated form. Bloomsbury's error was not in cherishing "timeless, passionate states of contemplation and communion," but in isolating them from the messy realities of consequence, duty, and the ever-present potential for human wickedness. The pure, consequence-indifferent Bloomsbury ideal *was* a mistake, a luxury of privilege blind to its context. Yet, the core Moorean insight – that the highest human goods reside in experiences of love, beauty, and understanding valued intrinsically – remains essential. The true good life isn't the *replacement* of action with contemplation, or rules with spontaneous insight. It is the **integration** of the contemplative depth Moore championed with the moral and civic engagement Keynes realized was tragically absent from his early creed. We need the sanctuary of Moore's states to nourish our humanity, but we must step out of that sanctuary, armed with that nourishment, to confront the wickedness Keynes belatedly recognized and to build the just world where the Moorean good can truly flourish for all. The ideal isn't wrong; the mistake was believing it could exist in a vacuum, untouched by the world it hoped to transcend.
