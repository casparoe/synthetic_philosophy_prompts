prompt: |-
  Been going down a game theory rabbit hole for a multi-agent RL side project and got stuck on iterated elimination of dominated strategies. Every intro explanation I find only ever kills off a strategy when some other pure strategy beats it outright, but I keep running into offhand mentions of strategies that only get eliminated once you let the dominating strategy be a mix of two others. Could you cook up an actual small payoff matrix (say 3 of my strategies against however many of the opponent's you need) where none of my pure strategies dominates another, but one of them still gets strictly dominated by some mix of the remaining two? Also explain in plain terms why killing that strategy off is still legit even tho the "winning" mix never once beats it head-to-head as a pure strategy.
reasoning: |-
  We are to create a 3x3 payoff matrix (3 strategies for me, 3 for the opponent) such that:
   - None of my pure strategies is strictly dominated by any other single pure strategy of mine.
   - But one of my pure strategies is strictly dominated by a mixed strategy of the other two.

   Let me denote my strategies as A, B, and C (the one to be dominated by a mix of A and B).
   The opponent has strategies X, Y, Z.

   We require that:
     For every opponent strategy, the payoff of C is strictly less than the payoff of a particular convex combination of A and B.

   Specifically, we want a mixed strategy (p, 1-p) for A and B (with 0 < p < 1) such that for every column (opponent strategy) j:
     p * U(A, j) + (1-p) * U(B, j) > U(C, j)

   However, we must also ensure that:
     - C is not strictly dominated by A alone: meaning there exists at least one column where U(C, j) >= U(A, j)
     - C is not strictly dominated by B alone: meaning there exists at least one column where U(C, j) >= U(B, j)

   Let's construct an example.

   Consider the following payoff matrix (from my perspective, so I want to maximize):

          |   X   |   Y   |   Z
     -----|-------|-------|-------
      A   |   4   |   0   |   1
      B   |   0   |   4   |   1
      C   |   1   |   1   |   0

   Now, let's check pure strategy domination:

    - Compare A and C:
        Against X: 4 > 1 -> A beats C
        Against Y: 0 < 1 -> C beats A? Actually 0 vs 1: so C is better than A in Y.
        Against Z: 1 > 0 -> A beats C
      Since in Y, C is better, A does not dominate C.

    - Compare B and C:
        Against X: 0 < 1 -> C beats B
        Against Y: 4 > 1 -> B beats C
        Against Z: 1 > 0 -> B beats C
      Since in X, C is better, B does not dominate C.

    - Compare A and B? Not necessary for the problem, but note:
        Against X: A (4) > B (0)
        Against Y: A (0) < B (4)
        Against Z: A (1) = B (1)
      So neither dominates the other.

   Now, consider a mixed strategy: play A with probability p and B with probability (1-p).

   The expected payoff for the mixed strategy against each column:

     X: p*4 + (1-p)*0 = 4p
     Y: p*0 + (1-p)*4 = 4(1-p)
     Z: p*1 + (1-p)*1 = 1

   Compare with C:

     Against X: 4p > 1   => p > 1/4
     Against Y: 4(1-p) > 1 => 1-p > 1/4 => p < 3/4
     Against Z: 1 > 0   (always true)

   So if we choose p between 1/4 and 3/4, say p=1/2, then:

     Against X: 4*(1/2) = 2 > 1
     Against Y: 4*(1/2) = 2 > 1
     Against Z: 1 > 0

   Thus, the mixed strategy (A with 1/2, B with 1/2) strictly dominates C.

   Why is it legit to eliminate C?

   Because no matter what the opponent does, if I play the mixed strategy (1/2 A, 1/2 B) I get a strictly higher payoff than if I play C.

   Note: The mixed strategy doesn't have to be a pure strategy that beats C in every column. Instead, it is a combination that, by averaging, covers the weaknesses of the pure strategies.

   In this case:
     - A is strong against X and Z, but weak against Y.
     - B is strong against Y and Z, but weak against X.
     - C is mediocre: it gets 1 against X and Y (which is better than the weak pure strategy in that column) but worse than the strong one.

   However, by mixing A and B, we get at least 2 in X and Y and 1 in Z, which is better than C in every column.

   The key is that the mixed strategy can achieve a payoff that is a weighted average of A and B, and by choosing the weights appropriately, we can get a payoff that is above C in every scenario.

   Therefore, even though no pure strategy dominates C, a mixture of two pure strategies does.

   This is a valid reason to eliminate C because a rational player would never choose C when they can instead randomize between A and B and do better regardless of the opponent's move.

   Thus, we can eliminate C via iterated elimination of strictly dominated strategies (even when the dominating strategy is mixed).
answer: |-
  Below is a 3x3 payoff matrix where none of your pure strategies dominates another, but one of your strategies (C) is strictly dominated by a mixed strategy of the other two (A and B). Payoffs are from your perspective (row player), and higher numbers are better.

  ### Payoff Matrix:
  |          | Opponent X | Opponent Y | Opponent Z |
  |----------|------------|------------|------------|
  | **A**    | 4          | 0          | 1          |
  | **B**    | 0          | 4          | 1          |
  | **C**    | 1          | 1          | 0          |

  ---

  ### Step-by-Step Explanation:
  1. **No Pure Strategy Dominance:**
     - **A vs. C:**  
       - Against X: A (4) > C (1) → A better.  
       - Against Y: A (0) < C (1) → C better.  
       - Against Z: A (1) > C (0) → A better.  
       → **C isn’t dominated by A** (C wins in Y).  
     - **B vs. C:**  
       - Against X: B (0) < C (1) → C better.  
       - Against Y: B (4) > C (1) → B better.  
       - Against Z: B (1) > C (0) → B better.  
       → **C isn’t dominated by B** (C wins in X).  
     - **A vs. B:**  
       - Against X: A (4) > B (0) → A better.  
       - Against Y: A (0) < B (4) → B better.  
       - Against Z: A (1) = B (1) → Tie.  
       → **Neither dominates the other.**

  2. **Mixed Strategy Dominance (A and B over C):**  
     Consider a mixed strategy where you play **A with probability \(p\)** and **B with probability \(1-p\)**.  
     - **Against X:** Mixed payoff = \(4p + 0(1-p) = 4p\)  
       → Need \(4p > 1\) (C’s payoff) → \(p > 0.25\).  
     - **Against Y:** Mixed payoff = \(0p + 4(1-p) = 4(1-p)\)  
       → Need \(4(1-p) > 1\) → \(p < 0.75\).  
     - **Against Z:** Mixed payoff = \(1p + 1(1-p) = 1\)  
       → Always \(1 > 0\) (C’s payoff).  

     **Result:** For \(0.25 < p < 0.75\) (e.g., \(p = 0.5\)):  
     - Mixed payoff vs. X: \(4 \times 0.5 = 2 > 1\)  
     - Mixed payoff vs. Y: \(4 \times 0.5 = 2 > 1\)  
     - Mixed payoff vs. Z: \(1 > 0\)  
     → **The mixed strategy strictly dominates C in all cases.**

  ---

  ### Why Eliminating C is Legit (Plain Terms):
  - **The "winning" mix isn’t a pure strategy:**  
    The mixed strategy (A+B) **never exists as a single row** in the matrix. It’s a "ghost strategy" you create by randomizing between A and B.  
    - **Key insight:** Even if no pure strategy beats C everywhere, a **smart combination** of A and B can cover each other’s weaknesses.  
      - A crushes X but fails at Y.  
      - B crushes Y but fails at X.  
      - C is "okay" at X and Y (payoff=1) but terrible at Z.  
    By mixing A and B, you "borrow" A’s strength in X and B’s strength in Y, achieving **>1 in all cases**—something no pure strategy does.

  - **Rationality justifies elimination:**  
    If you can get a **guaranteed better payoff** by randomizing between A and B (e.g., flipping a coin) than by playing C—**no matter what the opponent does**—then choosing C is irrational. Iterated elimination accounts for such mixed strategies because:  
    - Rational players optimize payoffs, not just pure choices.  
    - Ignoring dominated strategies (even when dominated only by mixes) simplifies the game correctly.  

  ---

  ### Summary:
  - **C is eliminated** because a **50-50 mix of A and B** yields payoffs (2, 2, 1) against (X, Y, Z), strictly beating C’s (1, 1, 0).  
  - **No pure strategy dominates C**, proving that mixed strategies can reveal dominances invisible to pure-strategy comparisons.  
  - This is core to game theory: Rationality includes exploiting randomness to "hedge bets" against an opponent’s actions.
