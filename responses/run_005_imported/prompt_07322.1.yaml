  You're right to double-check - while your rabbi colleague's reading is **compelling and ethically resonant, it's an interpretive extension rather than Maimonides' explicit primary argument.** Here's the breakdown for accuracy:

  1.  **Maimonides' Explicit Stance on Sacrifice (Korbanot):**
      *   In the *Guide for the Perplexed* (Part III, Chapters 32 & 46 are key), Maimonides argues **animal sacrifice was a divine concession to human weakness and ingrained habit**, specifically the Israelites' familiarity with sacrificial practices from surrounding idolatrous cultures.
      *   His primary reason for viewing it as "lesser" or "embarrassing" is **theological and intellectual:** It involves physical, ritualistic acts, whereas the highest form of worship is pure intellectual contemplation and love of God (prayer being a step towards that). Sacrifice, in his view, catered to a primitive, material understanding of worship prevalent at the time.
      *   **His stated reason for its continuation (not abolition) is pedagogical and anthropological:** Abruptly abolishing a universally practiced form of worship would have been impossible. God, like a wise physician or teacher, gradually weaned the people away from idolatry by **redirecting** their sacrificial impulses towards the One God, while simultaneously introducing laws to limit and refine the practice, ultimately aiming for its supersession by prayer and intellectual worship.
      *   **Direct Quote (Guide III:32):** *"The first purpose of the Law... is to abolish idolatry and to wipe out its traces and all that is bound up with it... It was in accordance with the wisdom and plan of God... that He did not command us to give up and to discontinue all these manners of service... For to obey such a commandment would have been contrary to the nature of man, who generally cleaves to that to which he is accustomed... For this reason, God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings..."*

  2.  **Maimonides on Compassion for Animals (Tza'ar Ba'alei Chayim):**
      *   Maimonides **absolutely** affirms the Torah's commandments demanding compassion for animals as fundamental principles. He explicitly states these laws teach kindness and prevent cruelty, cultivating moral character.
      *   In his commentary on the Mishnah (Berakhot 5:3, and elsewhere like *Guide* III:48), he emphasizes that causing unnecessary suffering to animals is forbidden by Torah law (*tza'ar ba'alei chayim*). He uses the mother bird commandment (*shiluach haken*) as a prime example of this principle, stating its purpose is "to caution us against causing suffering to the mother bird" and to "inculcate the quality of mercy."
      *   **Direct Quote (Guide III:48):** *"There is a rule laid down by our Sages that it is directly prohibited in the Law to cause pain to an animal... This is the object of the prohibition... [of] killing an animal and its young on the same day... and that the mother shall not be slain on the same day with the young... The purpose of all these rules is to make us acquire the trait of mercy and to avoid cruelty."*

  3.  **Connecting Animal Compassion to His View on Sacrifice:**
      *   **Not Explicit:** Maimonides **does not explicitly state** in the *Guide* that his discomfort with sacrifice stems *primarily* from compassion for the animal. His stated rationale is consistently the historical-concessional one (idolatry) and the theological one (inferior worship).
      *   **Plausible Implication/Interpretation:** However, your rabbi's reading is a **reasonable and ethically coherent extension** based on his broader philosophy:
          *   Maimonides saw minimizing animal suffering as a core Torah value.
          *   Sacrifice inherently involves killing animals, which *could* be seen as conflicting with this ideal, *especially* when viewed from the "higher" perspective of intellectual worship he promoted.
          *   His emphasis on the *limitations* and *gradual abolition* of sacrifice *could* be interpreted as partly motivated by this ethical unease *alongside* the primary anti-idolatry reason.
          *   Framing sacrifice as a "concession" or "necessary evil" of its time *can* encompass both the anthropological reason (human habit) and an ethical discomfort (killing animals for ritual).

  **Scholarly Consensus & Your Angle:**

  *   Most scholars emphasize the **anti-idolatry** and **pedagogical concession** as Maimonides' primary and explicit reasons for his view on sacrifice (e.g., Marvin Fox, Kenneth Seeskin, Menachem Kellner).
  *   Few would argue that animal compassion is his *stated main reason* in the *Guide*.
  *   However, scholars *do* recognize Maimonides' strong commitment to animal welfare as a fundamental principle derived from the Torah's commandments. His ethical system *requires* compassion for animals.
  *   Therefore, while the *explicit textual link* to sacrifice isn't made by Maimonides himself, interpreting his overall stance on sacrifice as being *informed by* or *consistent with* his broader ethical stance on animal suffering is **a defensible and insightful modern reading**, especially within an article exploring precursors to animal ethics.

  **Recommendation for Your Piece:**

  1.  **Frame it Accurately:** Present it as a compelling interpretive lens based on Maimonides' *broader ethical principles* concerning animals, rather than his *explicitly stated primary reason* for critiquing sacrifice.
  2.  **Use Nuanced Language:**
      *   "Maimonides viewed sacrifice as a divinely ordained *concession* to ingrained human habit, necessary to wean the Israelites from idolatry... Yet, scholars like [Rabbi's Name] argue his profound emphasis on Torah commandments forbidding animal cruelty (*tza'ar ba'alei chayim*) suggests an underlying ethical discomfort with the sacrificial act itself, contributing to his view of it as an inferior form of worship destined to be superseded."
      *   "While Maimonides explicitly roots his critique of sacrifice in its origins as an anti-idolatry strategy and its limitations compared to intellectual prayer, his rigorous application of compassion-for-animals laws elsewhere resonates with a modern ethical reading that sees unease with animal suffering as an implicit factor in his hierarchy of worship."
  3.  **Quote Strategically:**
      *   Use the **Guide III:32 quote** about concession and gradualism to establish his primary argument.
      *   Use the **Guide III:48 quote** (or his Mishnah commentary on *shiluach haken*) to firmly establish his principle of animal compassion.
      *   *Then* bridge them interpretively: "Read together, these principles suggest that for Maimonides, the practice of animal sacrifice, however necessary historically, stood in tension with the Torah's higher ethical call to avoid causing suffering to living creatures."
  4.  **Acknowledge Nuance:** Briefly note that Maimonides' primary textual focus is on idolatry and pedagogy, but his ethical framework provides strong grounds for this extension.

  **Conclusion:** Your rabbi colleague's insight is valuable and highlights an ethically profound dimension of Maimonides' thought relevant to your theme. It's not his *explicit* main argument, but it's a **highly plausible and textually supported *interpretation* based on his unequivocal commitment to animal welfare elsewhere.** By presenting it as such – an ethical lens informed by his broader principles – you can build a strong, accurate, and insightful section without overstepping the textual evidence. This approach should withstand scrutiny from scholars who understand both his explicit arguments and his ethical philosophy.
