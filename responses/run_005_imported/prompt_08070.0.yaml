  We are given six fairness criteria to rank from S (most defensible) to D (least defensible) for use as a default legal standard in high-stakes automated risk-assessment tools. The criteria are:

  1. Demographic Parity (DP): The outcome (decision) is independent of the sensitive attribute. This means the same proportion of each group receives a positive outcome.

  2. Equalized Odds (EO): The classifier has equal true positive rates (TPR) and equal false positive rates (FPR) across groups. That is, for any two groups, TPR1 = TPR2 and FPR1 = FPR2.

  3. Equal Opportunity (EqOpp): A relaxation of equalized odds that requires only equal true positive rates (TPR) across groups.

  4. Predictive Parity (PP): Also known as outcome test. It requires that the precision (positive predictive value, PPV) is the same across groups. That is, among those predicted positive, the same proportion actually belong to the positive class, regardless of group.

  5. Calibration within Groups (Cwg): The predicted probability score is well-calibrated for each group. This means that for any predicted probability score s, the proportion of individuals with that score who actually belong to the positive class is s, and this holds for each group separately.

  6. Counterfactual Fairness (CF): A causal notion of fairness. It requires that the outcome would be the same in the counterfactual world where the individual's sensitive attribute is changed. This is typically defined using structural causal models.

  We must consider the context: high-stakes decisions (pretrial detention, lending) and the impossibility results (Chouldechova and Kleinberg et al.) which show that when base rates differ and the classifier is imperfect, calibration within groups cannot coexist with equalized odds (or equal opportunity) and predictive parity.

  Given the constraint that only one criterion can be mandated, we have to choose the most defensible as the default. We must also consider the legal and ethical implications.

  Analysis:

  - The impossibility results tell us that we cannot have both calibration and error rate balance (like equalized odds) when base rates differ and the classifier is imperfect. Therefore, mandating two of these simultaneously is impossible. Hence, we must pick one.

  - In high-stakes decisions, we care about both the accuracy of predictions and the avoidance of discrimination. 

  - Calibration within groups is important because it ensures that risk scores are meaningful and comparable across groups. For example, in pretrial detention, a risk score of 0.7 should mean a 70% chance of reoffending regardless of the group. Without calibration, we cannot trust the risk scores.

  - However, calibration alone does not prevent discrimination in the allocation of errors. For instance, if one group has a higher base rate, then even with calibration, we might see higher false positive rates for the group with the lower base rate (if we use the same threshold). 

