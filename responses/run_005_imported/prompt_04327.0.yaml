  Danto's historical context view also feels robust - meaning in art often depends on when/how it was created, not just what it looks like. For a novel exploring authenticity, this could add rich layers about art's relationship to its time.

  Dutton's achievement argument makes intuitive sense too - we admire human accomplishment, and forgery deceives about that. Though perhaps more psychological than philosophical at its core.

