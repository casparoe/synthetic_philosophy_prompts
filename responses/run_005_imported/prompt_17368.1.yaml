  The user's critique is that Putnam's position either reduces to Phillips' expressivism (by making "God" about personal commitment) or reinstates realism in ethics (by treating the ethical demand as mind-independent). They also mention Levinas might require more ontological weight than Putnam allows. I should address these points methodically.

  Looking at Putnam's use of Rosenzweig: the shift from "old" to "new thinking" emphasizes lived experience over detached metaphysics. This might avoid collapsing into realism by rejecting the God's-eye view entirely. But does this sufficiently ground the objectivity Putnam wants? The user might be right that without any metaphysical grounding, it risks becoming non-cognitivist.

