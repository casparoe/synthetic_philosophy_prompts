prompt: |-
  I'm one of about four people who maintain a small internal Lean library at my company -- basically a tiny in-house mathlib we use to verify parts of a job scheduler. Someone opened a PR with a lemma that says any partial schedule can be extended to a maximal one, proved via Zorn's Lemma (treat partial schedules as a poset ordered by extension, chains get an upper bound by just unioning them, so a maximal element exists). Because that proof bottoms out in choice, Lean forces the definition to be marked noncomputable. Half the maintainers are fine merging it since the theorem's true and we actually need it, the other half think noncomputable lemmas shouldn't live in the same library as our executable scheduler code, since it blurs the line between "this exists" and "here's how to actually build it," and once that norm slides people stop noticing the difference. Our contribution guide says nothing about this case. I've gotta send a short memo before next weeks review recommending one of: merge as-is, quarantine anything noncomputable into its own module, or reject and require a constructive version. Can you draft that memo -- actually pick one, give the reasoning, and don't just wave away the quarantine side as being precious about purity, there's something real going on there so take it seriously.
reasoning: |-
  We are in a situation where we have a lemma that uses Zorn's Lemma (hence Choice) to prove that any partial schedule can be extended to a maximal one. This lemma is noncomputable in Lean. The debate is about whether to merge it, put noncomputable things in a separate module, or reject it and require a constructive proof.

  I need to pick one and argue for it. The memo should be short and address the concerns of both sides.

  Key points:
  - The lemma is needed for the scheduler.
  - Half the team is okay with merging because the theorem is true and needed.
  - The other half is concerned about blurring the line between existence and computation, especially because the library is used for executable code.

  Options:
  1. Merge as-is: Accept the noncomputable lemma in the current library.
  2. Quarantine noncomputable code into a separate module: Keep the noncomputable parts isolated.
  3. Reject and require a constructive version: Do not accept noncomputable proofs and ask for a computable alternative.

  Arguments for each:
  - Merge as-is: Practicality. The lemma is true and necessary. The noncomputable marker is already a clear indicator that it's not computable. The executable code that uses this lemma might not actually compute the maximal schedule but only use its existence for proofs. So it might be safe.
  - Quarantine: This maintains a clear separation. The executable part remains purely constructive, and the noncomputable parts are in a separate module, which might be used only for proofs. This avoids accidental use of noncomputable things in computational contexts. It also sets a norm for the future.
  - Reject and require constructive: This is the most principled for a library that interfaces with executable code. However, it might be difficult or even impossible to prove this lemma constructively (since Zorn's Lemma is equivalent to AC). The maximal schedule might not be computable in general? So this could block progress.

  Considering the context: a small internal Lean library for a job scheduler. The noncomputable lemma is about the existence of a maximal extension, which might be used only in a proof (to show that a scheduler can always extend to maximal, but the actual algorithm might be constructive and not use this maximal element). So the noncomputable lemma might be only for the proof and not for the computation.

  However, the concern is that if noncomputable lemmas are mixed in, developers might start using noncomputable definitions in the computational parts without noticing.

  I think the best compromise is to quarantine noncomputable code into its own module. This way, we can have the lemma and use it for proofs, but it is clearly separated from the computational parts. This addresses the concern about blurring the lines while allowing the needed mathematics.

  Therefore, I recommend:

  **Option: Quarantine noncomputable code into its own module.**

  Reasoning:
  - We need the lemma for our proofs, and it is a classical mathematical fact. Avoiding it would be impractical.
  - At the same time, maintaining a clear separation between computable and noncomputable definitions is important for the integrity of our executable scheduler code. By isolating noncomputable lemmas, we prevent accidental use in computational contexts and make the distinction explicit.
  - This approach sets a precedent: any future noncomputable definitions or lemmas must be placed in the designated module. This norm will help the team stay aware of the difference between existence and computation.
  - The quarantine is not about purity for its own sake but about practical software engineering: we want to avoid hard-to-debug issues that might arise if noncomputable code leaks into the computational parts.

  Alternatively, if we find that the lemma is only used in proofs and never in the actual computation (which is likely), then having it in a separate module and importing it only in proof contexts would be safe.

  Draft memo:

  ---

  **To:** Lean Library Maintainers  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation for Handling Noncomputable Lemma in PR #XXX  

  ### Background
  A PR has been opened introducing a noncomputable lemma (using Zorn's Lemma) proving that any partial schedule can be extended to a maximal one. This lemma is required for our scheduler verification. However, the use of choice forces the definition to be marked `noncomputable` in Lean. The team is divided on whether to merge, quarantine, or reject.

  ### Recommendation
  I recommend we **quarantine noncomputable code into a dedicated module** and place this lemma there. 

  ### Reasoning
  1. **Practical Necessity**: The lemma is a fundamental mathematical fact we need for our proofs. Avoiding it would hinder progress.
  2. **Separation of Concerns**: By isolating noncomputable definitions, we maintain a clear boundary between constructive (executable) and classical (proof-only) code. This prevents accidental use of noncomputable constructs in computational contexts, which could lead to runtime errors or unexpected behavior in our scheduler.
  3. **Sustainable Norms**: Creating a designated module for noncomputable content sets a clear precedent. It ensures that future contributions will be mindful of the computability distinction without blocking classical reasoning where necessary. This approach is a balanced compromise that respects both the practical needs of the scheduler and the integrity of our executable codebase.

  ### Next Steps
  1. Create a new module (e.g., `Classical.lean`) for noncomputable definitions and lemmas.
  2. Move the lemma and its dependencies (if noncomputable) to this module.
  3. Update the contribution guide to require that noncomputable content be placed in this module.

  This solution addresses the concerns of both sides: we get the lemma we need, while explicitly safeguarding our computational core.

  ---

  This memo picks a side, provides reasoning, and takes the quarantine proposal seriously by highlighting its practical benefits.
answer: |-
  **To:** Lean Library Maintainers  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation for Handling Noncomputable Lemma in PR #XXX  

  ### Background  
  The PR introduces a noncomputable lemma proving that any partial schedule can be extended to a maximal one, using Zorn’s Lemma (via Lean’s `noncomputable` marker). While the theorem is needed for our scheduler verification, concerns have been raised about merging noncomputable code into a library used for executable components.  

  ### Recommendation  
  **Quarantine noncomputable definitions/lemmas into a dedicated module** (e.g., `Noncomputable/`), and merge the PR under this structure.  

  ### Reasoning  
  1. **Practical Necessity**:  
     The lemma is mathematically essential for our scheduler proofs. Attempting a constructive alternative risks:  
     - Significant delays (constructive proofs of maximality often require intricate assumptions or restricted domains).  
     - Compromising generality (our schedules may not satisfy finiteness or decidability constraints needed for computability).  

  2. **Mitigating the "Existence vs. Computation" Risk**:  
     - **Isolation Clarifies Intent**: By segregating noncomputable content, we enforce a visible boundary. Developers using the executable scheduler library (`Scheduler/`) cannot accidentally import noncomputable constructs. This maintains the "how to build it" spirit of our core code.  
     - **Preserves Constructive Norms**: Quarantining signals that noncomputable proofs are a last resort—not a default. It upholds our discipline without blocking progress, as the lemma remains accessible for verification (e.g., imported only in proof contexts).  

  3. **Balance Between Rigor and Pragmatism**:  
     - Rejecting the lemma impedes critical work; merging it naively risks eroding clarity. Quarantining is a lightweight compromise: it acknowledges the validity of classical proofs while containing their "blast radius."  
     - Crucially, **this is not purity for its own sake**. In executable code, Lean’s `noncomputable` can mask opaque dependencies (e.g., unextractable choice functions). Isolation prevents these from leaking into algorithms, avoiding subtle errors in deployment.  

  ### Implementation Plan  
  1. Create a new directory (e.g., `Noncomputable/`) for classical results.  
  2. Move the lemma and its proof (and future noncomputable items) here.  
  3. Restrict imports from `Noncomputable/` into the executable scheduler modules.  
  4. Update the contribution guide:  
     - Noncomputable content must reside in `Noncomputable/`.  
     - Justification is required for additions (e.g., "no known constructive alternative").  

  This approach delivers the needed lemma while safeguarding our executable code’s integrity. I recommend proceeding with these changes ahead of the PR merge.  

  **Signed,**  
  [Your Name]
