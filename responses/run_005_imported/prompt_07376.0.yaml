answer: |-
  This is a thoughtful and nuanced ethical dilemma. While your actions stem from good intentions and align with your partner's stated goal, the secrecy introduces moral complexity. Here's a breakdown of the key considerations:

  **Arguments That This is Ethically Acceptable (or Even Good):**

  1.  **Directly Fulfilling a Request:** Your partner explicitly asked for your help multiple times. You are providing that help effectively.
  2.  **Beneficence & Non-Maleficence:** The outcome is positive (reduced phone use) and desired by your partner. You haven't harmed them, restricted their freedom (they *can* still get the phone), or lied.
  3.  **Respecting Autonomy (in a way):** You're not forcing, coercing, or deceiving in a direct sense. You're simply altering the *choice architecture* – making the desired behavior (reading) easier and the undesired behavior (phone use) slightly harder. People use choice architecture on themselves all the time (e.g., putting junk food out of sight).
  4.  **Effectiveness:** As you noted, the subtlety might be key to its success. Explicit reminders can feel nagging or provoke resistance. This method bypasses that friction.
  5.  **Low Stakes & Reversible:** The changes are minor, easily reversible, and don't involve controlling core aspects of their life or relationships. If they *really* want the phone, they get it.

  **Arguments That This Raises Ethical Concerns:**

  1.  **Lack of Transparency & Informed Consent:** The core issue is secrecy. Your partner consented to *help* but not to *this specific method* of help, precisely because they are unaware of it. While not lying, you are withholding information relevant to how you are influencing their behavior.
  2.  **Paternalism:** There's an element of "I know what's best for you, and I'll arrange things so you do it without realizing." Even if your partner *does* want this outcome, managing it "behind the scenes" can feel infantilizing if discovered. It bypasses their conscious engagement with the change.
  3.  **Potential Erosion of Trust:** If your partner discovers this and feels manipulated, it could damage trust significantly, even if the outcome was desired. The feeling of being "managed" rather than collaborated with can be hurtful.
  4.  **The "Why" Matters:** Your worry that explaining it would ruin the effect highlights a tension. If the *only* reason it works is because it's covert, that suggests the method relies on bypassing their conscious will or potential resistance, which edges closer to manipulation.
  5.  **Setting a Precedent:** If this becomes a pattern for addressing behaviors (even with good intentions), it creates a dynamic where covert influence is normalized, potentially extending to areas where transparency is even more critical.

  **The Moral Weight of Secrecy:**

  Yes, keeping the method to yourself *does* matter morally on its own. Transparency is a cornerstone of trust in intimate relationships. While you haven't lied, secrecy about actions deliberately designed to influence your partner's behavior creates a power imbalance and withholds information they might reasonably expect to know, especially since they *asked* for your involvement.

  **Finding a Balanced View & Potential Paths Forward:**

  This isn't necessarily "wrong," but it exists in a gray area. The positive intent and outcome weigh heavily, but the secrecy is the ethical friction point. Here's how to navigate it:

  1.  **Acknowledge Your Discomfort:** Your unease is valid and signals an important ethical instinct about transparency in your relationship.
  2.  **Consider Disclosure (Carefully):** You could choose to tell them. Frame it positively:
      *   "Remember how you asked me to help you cut down on your phone time? I tried something subtle because I didn't want to nag. I moved the charger to the kitchen and put that book we like on the nightstand. It seems like it might be helping? What do you think?"
      *   Focus on *their* request, *your* intention to help without pressure, and the *outcome*. Ask for their feedback. They might appreciate the ingenuity! The key is presenting it as an experiment based on their request, not a covert operation.
  3.  **Shift Towards Collaboration:** Use this as a springboard. "Seeing how a simple change helped, maybe we could brainstorm other ways to make evenings more phone-free and relaxing? What else might work for you?" This empowers them and moves from "managing" to "partnering."
  4.  **Assess the Relationship:** Is this a relationship built on deep trust and security where minor, well-intentioned nudges like this are understood and accepted? Or is transparency paramount? Your partner's personality and your relationship history matter.
  5.  **Weigh the Risks:** Is the potential benefit of continued secrecy (maintaining the habit) worth the risk of undermining trust if discovered? Only you can judge this.

  **Conclusion:**

  Your actions are well-intentioned and effective, aligning with your partner's request. However, the deliberate secrecy transforms helpful "choice architecture" into something closer to covert influence, which carries ethical weight in a trusting relationship. While not inherently "wrong," it introduces a risk to trust and doesn't fully respect their autonomy *within the process*. The morally strongest path is likely **eventual disclosure** framed as a collaborative effort based on their request, or at least a shift towards more open collaboration on maintaining the habit. Your discomfort is a sign that transparency with your partner is a value you hold, and acting in alignment with that value usually strengthens trust in the long run.
