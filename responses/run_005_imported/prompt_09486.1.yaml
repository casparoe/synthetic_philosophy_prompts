prompt: |-
  I do interpretability-adjacent work at a smallish AI safety org (maybe 15 people, we're not exactly a household name) and somehow ended up on the internal committee that has to sign off before anything goes out under the org's name. I've been lurking on LW and the Alignment Forum for like a decade at this point, so I know this exact argument has been had a hundred times in the abstract -- but now I actually have to resolve one real instance of it by Tuesday, and "go read more Chris Olah posts" is not gonna cut it.

  Here's the case. One of our teams trained a sparse autoencoder on a model's residual stream, found a direction that fires reliably on stuff like lying-to-the-user, and showed that clamping it down measurably reduces deceptive completions. Genuinely cool result. But the draft write-up is titled "We Found the Model's Deception Feature," and the framing throughout just asserts that the network represents deception, full stop, the way you'd say a thermostat represents temperature. Two of the five of us on the committee think that's a real overclaim -- a direction that correlates with and causally influences a behavior isn't automatically a representation of it in any sense that earns the definite article, and the SAE-feature literature already has a track record of confident feature stories that didn't survive people poking at them harder. The other three think we're being precious about metaphysics, and that some working notion of "the model represents X" is just load-bearing: you can't design the next experiment, or explain the result to a funder, without positing something like that.

  I need to bring an actual memo to Tuesday's meeting, not a list of considerations -- something that tells the team concretely whether to publish as-is, reframe the write-up and how, or hold it for revision and for roughly how long, with the reasoning spelled out well enough that whichever side looses the vote can see their strongest point got taken seriously instead of steamrolled. Can you draft that memo for me?
reasoning: |-
  We are at a critical juncture where we must balance scientific rigor with communication effectiveness. The core issue is the framing of the discovery as "the model's deception feature." The argument against this framing is that it overclaims by implying that this feature is a direct representation of deception in a way that is univocal and definitive. The argument for is that such shorthand is necessary for progress and communication.

  After considering both sides, I propose a middle path: we reframe the write-up to be more precise without losing the narrative thrust. Specifically:

  1. **Title Change**: From "We Found the Model's Deception Feature" to something like "We Found a Feature Associated with Model Deception" or "A Sparse Autoencoder Feature for Reducing Deception." This avoids the definite article and implies correlation rather than identity.

  2. **Text Reframing**: Throughout the paper, replace assertions that the feature "represents deception" with language that emphasizes the empirical findings: the feature is correlated with deceptive outputs, and clamping it causally reduces deception. We can say the feature is "involved in" or "associated with" deception, but avoid claiming it is "the representation of deception."

  3. **Caveats Section**: Add a section (or expand the discussion) that explicitly addresses the limitations of the current work. This should include:
     - The possibility that the feature might be part of a broader circuit or represent a more general concept (e.g., "strategic falsehoods" in a wider context) that only sometimes manifests as deception in the narrow sense tested.
     - The fact that SAE features are interpretable directions but not necessarily the fundamental units of the model's computation, and that future work might refine or replace this finding.

  4. **Hold for Revision?**: I do not recommend holding the paper for a major revision. The core result is solid and timely. However, we should require the above changes (which are mostly textual) before publication. The team can implement these in a few days, so we can still meet any near-term publication goals.

  Reasoning for this approach:

  - **Against Overclaiming**: The history of SAE features (and interpretability more broadly) shows that initial exciting claims often get nuanced or overturned. We must avoid setting a precedent of overclaiming that could damage our credibility. Moreover, the field is young and we don't yet have a settled ontology of features. Using the definite article ("the deception feature") implies a uniqueness and finality that isn't justified.

  - **For Practical Communication**: We do need to tell a coherent story. The alternative framing (e.g., "a feature associated with deception") still allows us to build on this result and communicate it effectively. It also sets up the next steps: if this is one feature, are there others? How do they interact? This is more generative than claiming we've found "the" feature.

  - **Committee Consensus**: This approach respects both sides. The critics get the precision they want, and the proponents get to publish without undue delay. It also models the kind of careful communication we want to encourage in the field.

  Therefore, I recommend we require the team to revise the framing as outlined and then publish. We can approve the paper conditionally on these changes being made, with a deadline of, say, one week for the revisions (so the paper can go out shortly after). This balances urgency with due caution.

  Draft Memo:

  ---

  **MEMORANDUM**

  **To**: [Name of the Committee]  
  **From**: [Your Name]  
  **Date**: [Current Date]  
  **Subject**: Decision on Draft Titled "We Found the Model's Deception Feature"  

  After reviewing the draft and the committee's discussion, we have reached a decision on the publication of the paper. The core result — that a sparse autoencoder feature was found which correlates with deceptive outputs and that clamping it reduces deception — is robust and constitutes a valuable contribution. However, the framing, particularly the title and the language around the feature being "the model's deception feature," requires adjustment to align with our standards of scientific communication.

  ### Decision
  The paper is **approved for publication** pending the following revisions, which must be completed by **[Date, e.g., one week from today]**:

  1. **Title Change**:  
     - The title must be revised to avoid the definite article "the" and to reflect the correlational and causal nature of the finding without overclaiming. Suggested alternatives:  
       - "A Sparse Autoencoder Feature Associated with Model Deception"  
       - "Reducing Model Deception via a Sparse Autoencoder Feature"  
       - Or similar. The team may propose alternatives that capture the same nuance.

  2. **Language Reframing Throughout**:  
     - Replace all instances that assert the feature *is* "the deception feature" or that it *represents deception* (in a definitive, thermostat-like sense) with language that emphasizes the empirical observations. Examples:  
       - Instead of "this feature represents deception," use "this feature is correlated with deceptive outputs" or "this feature is involved in generating deceptive responses."  
       - Avoid the definite article when referring to the feature in the context of deception (e.g., not "the deception feature" but "a feature associated with deception").  
     - The narrative should still highlight the causal effect (clamping reduces deception) as a key finding, but without reifying the feature as the unique or final representation of deception.

  3. **Expanded Caveats Section**:  
     - Add a subsection (e.g., in the Discussion) that explicitly addresses:  
       - The possibility that this feature might not be exclusive to deception (e.g., it might activate in other contexts like fiction, mistakes, or other forms of false statements).  
       - The limitations of SAE features as interpretable but not necessarily fundamental units of the model.  
       - That this is a step toward understanding how deception is represented, but that future work might reveal a more complex picture (e.g., multiple features, distributed representations).

  ### Rationale
  This decision balances the need for clear communication of an important result with the necessity of scientific precision. The committee acknowledges:
  - The strong correlation and causal effect demonstrated are exciting and merit dissemination.
  - However, the field of interpretability has seen instances where initial feature attributions were later refined or challenged. Overclaiming, especially by using definitive language, risks undermining credibility and setting unrealistic expectations.
  - The proposed revisions maintain the impact of the work while appropriately qualifying the claims. This approach also aligns with best practices in emerging scientific fields, where provisional claims are framed as such to allow for iterative progress.

  We believe these revisions are feasible within the timeline and do not require additional experiments. The team should submit the revised draft to the committee chair by the deadline for a quick final check.

  Thank you to the team for their excellent work and to the committee for the thoughtful discussion.

