prompt: |-
  So a bit of context: my old LessWrong meetup turned into an actual (very small, maybe 40 regular listeners) podcast a couple years back, and next month we've finally got a real philosopher of physics on — she's spent basically her whole career defending the Everett interpretation — and I don't want to waste the slot. The thing is, almost everyone who listens has already been through Eliezer's old quantum mechanics sequence, so they've basically already internalized the whole picture where collapse postulates are an ugly unmotivated hack and decoherence plus no extra axioms just gets you many worlds for free. If I have her just make the case for many-worlds over textbook Copenhagen it's basically a rerun of a post half the audience has memorized, so I'd rather skip past that and go after the stuff philosophers of physics apparently still fight about even once collapse is off the table.

  Can you draft me 8-10 interview questions along those lines? I want at least one that presses her on whether the Born rule can really be derived from decision theory the way Deutsch and Wallace claim, rather than the probabilities being smuggled in through the back door; at least one on what actually makes something a seperate "branch" given that decoherence is a matter of degree, not a sharp event; and at least one that makes her engage with Bohmian mechanics specifically instead of Copenhagen — like why we should want her many, local, branching worlds over a single nonlocal trajectory that spits out the same statistics, since Bohm barely gets airtime in rationalist circles and I don't think that's because someone actually steelmanned it and it lost. I'd also like a question on the quantum suicide thought experiment and whether taking many-worlds seriously should actually change how she bets or makes decisions day to day, since that's the part that's always bugged me. For each question, add a line on what answer she's most likely to give and a sharp follow-up keyed to that answer, so I'm not just nodding along if she gives the standard reply — six genuinely hard questions beat ten soft ones.
