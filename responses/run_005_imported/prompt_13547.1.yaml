  The user pointed out Gödel's own comment about the resemblance. So, I should acknowledge that but then clarify the divergence. The technical reason lies in how provability predicates work. In a consistent system, if G is provable, it leads to a contradiction, so G must be unprovable. But that doesn't make G false—it just means the system can't prove it. Hence, incompleteness.

