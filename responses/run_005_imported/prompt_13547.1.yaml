  Also, the user seems frustrated with what they perceive as hand-waving. I should emphasize the technical safeguards in Gödel's construction, like the arithmetization of syntax, which avoids direct self-reference. Instead, it uses diagonalization to create a sentence that indirectly references itself via Gödel numbering.

  They might also wonder about systems that can express truth. But Tarski's theorem shows such systems can't be consistent and complete. So, Gödel's approach works precisely because it avoids the truth predicate, using provability instead, which is definable within the system.

