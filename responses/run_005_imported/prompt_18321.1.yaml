answer: |-
  ## The Phantom Handshake: Why Evidential Cooperation in Large Worlds Fails Its Own Test

  Evidential Cooperation in Large Worlds (ECL) presents a tantalizing vision: cooperation not through chains of cause and effect, but through the sheer statistical weight of correlated reasoning across vast cosmic distances. Its argument, rooted in evidential decision theory (EDT), promises a reason to transcend parochial self-interest even in a universe devoid of causal connections. However, upon close examination, the objections leveled against ECL – particularly concerning the estimation of correlation and the threat of fanaticism – prove devastating, not merely as practical hurdles, but as fundamental flaws that undermine its core logic *even within an evidentialist framework*. ECL fails by its own lights.

  **The Evidentialist Argument for Cooperation: Logic and Lure**

  ECL's logical structure hinges on three premises and the machinery of EDT:

  1.  **Large Worlds:** The universe (or multiverse) is vast enough to contain enormous numbers of agents who are causally isolated from each other.
  2.  **Correlated Reasoning:** Some subset of these causally isolated agents reason in ways "relevantly similar" to one's own decision procedure. Their choices are probabilistically correlated with one's own, not through causation, but through shared algorithmic structure or reasoning patterns.
  3.  **Evidential Leverage (EDT):** One's own decision provides *evidence* about the decisions of these correlated agents. Choosing option A makes it more likely (given the correlation) that other similar agents also choose A.
  4.  **Expected Value Calculation:** An EDT agent maximizes expected value based on the evidence provided by their own action. If mutually beneficial cooperation (C) yields a higher collective payoff than mutual defection (D) in interactions *between* correlated agents, then:
      *   Choosing C is evidence that many other correlated agents also choose C, leading to widespread mutual cooperation and high collective payoff.
      *   Choosing D is evidence that many other correlated agents also choose D, leading to widespread mutual defection and low collective payoff.
      *   Therefore, *even for a single interaction facing only causally inert others*, choosing C yields a higher *expected* collective payoff than choosing D. If an agent values the collective payoff (e.g., through altruism, or valuing the success of their reasoning "type"), EDT prescribes cooperation.

  This generalizes the superrationality solution to the one-shot Prisoner's Dilemma. In that case, two identical rational agents, knowing their reasoning is perfectly correlated, both reason that choosing C (Cooperate) is evidence the other also chooses C, leading to the mutually beneficial (C,C) outcome. ECL scales this up: in a vast universe, your choice of C is evidence that countless *other* correlated agents also choose C in *their* respective situations, boosting the expected aggregate good.

  **The Cracks in the Cosmic Mirror: Assessing the Objections**

  While elegant, ECL faces powerful objections that expose critical weaknesses:

  1.  **The Estimation Problem & Unfathomable Correlation:**
      *   **The Core Issue:** ECL crucially depends on knowing *which* agents are correlated, *how strongly*, and *what values/actions* they are correlated *on*. Premises 1 and 2 are existential claims ("there exist correlated agents"), but for the expected value calculation to be meaningful, we need quantitative estimates: *How many* agents are correlated with me? *What specific values* do they hold? *What specific actions* are we correlated on? *How strong* is the correlation?
      *   **ECL's Fatal Blind Spot:** ECL provides *no principled method* for obtaining these estimates. The vastness of the universe guarantees *some* correlation, but offers no handle on its *degree* or *content*. Are there 10^10 correlated agents sharing my values, or 10^100 with subtly different values leading them to "defect" when I "cooperate"? Is the correlation strength 0.51 or 0.999? The expected value calculation swings wildly based on these unknowns. Critically, **without a basis for assigning non-arbitrary probabilities, EDT cannot compute a meaningful expected value.** The "gains from trade" are not just unmeasurable; they are epistemically inaccessible. The argument *assumes* favorable correlation but provides no warrant for that assumption beyond the mere possibility.
      *   **The "Could Be Negative" Problem:** This lack of grounding means the expected value of cooperating could just as plausibly be *negative* as positive. If my "cooperation" is correlated with agents whose values oppose mine or who interpret "cooperation" destructively in their context, my action could be evidence of widespread harm. ECL offers no shield against this possibility. Its logic is symmetric: evidence flows both ways, but without knowing *what* the evidence signifies about others' actions, we cannot determine the valence of the outcome.

  2.  **Proving Too Much & Pascal's Mugging:**
      *   **The Slippery Slope:** If we accept ECL's logic based on the mere *possibility* of vast numbers of correlated agents, what constrains its application? Why stop at agents reasoning like humans? Could we be correlated with hypothetical agents whose welfare depends on us performing bizarre, costly acts? The structure resembles Pascal's Mugging: a tiny, unquantifiable probability of affecting an astronomically large number of entities can dominate the expected value calculation, demanding extreme sacrifices.
      *   **ECL's Vulnerability:** Because ECL lacks a principled way to *bound* the set of relevant correlated agents or *discount* implausible correlation scenarios, it inherently risks fanaticism. Any vaguely conceivable correlation with a sufficiently large population (e.g., agents in other quantum branches, simulated minds, Boltzmann brains) could, in principle, demand infinite sacrifice if assigned even an infinitesimal credence. EDT, applied naively within ECL's framework, lacks the resources to resist this. **The theory's inability to provide non-arbitrary probabilities for correlation scenarios makes it susceptible to exploitation by outlandish hypotheses demanding unreasonable sacrifices.**

  3.  **The Mysterious Correlation:**
      *   While often presented as a distinct metaphysical worry, the vagueness of "correlation without causation" exacerbates the estimation problem. If we cannot even clearly define *how* or *why* the correlation exists beyond "similar reasoning," it becomes even harder to justify any specific probabilistic claim about its strength or scope. The correlation is posited to do heavy lifting but remains fundamentally unexplained and unquantifiable within the theory.

  **The Causal Counter and the Evidentialist Quandary**

  A critic rooted in Causal Decision Theory (CDT) would immediately dismiss ECL: since my action *causes* no change in the distant agents' actions, CDT sees no reason to cooperate based on mere correlation. ECL proponents rightly note this objection is external – it assumes CDT's superiority. **The crucial point, however, is that the objections above are *internal* to the evidentialist project ECL relies upon.**

  EDT requires conditioning on one's action to assess its evidential bearing on outcomes. But for this conditioning to yield actionable expected values, the conditional probabilities involved must be reasonably estimable or constrained. ECL fails precisely here: **it forces the EDT agent into a state of radical uncertainty about the very probabilities (the nature and extent of correlation) that its prescription depends on.** Without a methodology for assigning non-arbitrary probabilities to correlation scenarios, the expected value calculation central to EDT *cannot be performed meaningfully*. An EDT agent committed to rigor should recognize this epistemic void and suspend judgment, finding no decisive evidential reason to cooperate (or defect) based on ECL. The "modest behavioral upshot" (e.g., favoring widely shared values) defenders propose is an ad hoc heuristic lacking derivation from ECL's core logic; it borrows plausibility from intuitive moral reasoning, not from the evidential calculus of large-world correlation.

  **Conclusion: Coherent in Theory, Bankrupt in Practice and Principle**

  Evidential Cooperation in Large Worlds presents a fascinating intellectual possibility. Its core insight – that correlation can substitute for causation in decision-making under EDT – is logically coherent within that framework. However, its fatal flaw lies in the **epistemological vacuum surrounding the concept of "relevantly similar" agents and the strength of their correlation.** Without a principled way to estimate *who* is correlated, *how many* there are, *what* they value, and *how strongly* their choices mirror one's own, the expected value calculation that is the engine of ECL sputters and stalls. The theory succumbs to the estimation problem, fails to guard against negative expected value outcomes or fanaticism, and leaves the nature of correlation fundamentally unexplained.

  Therefore, **ECL fails even by the standards of evidential decision theory.** It identifies a potential source of evidential influence but provides no viable means for an agent to rationally incorporate that influence into their decision calculus. The objections reveal not mere practical difficulties, but a fundamental incoherence at the heart of the proposal: it demands quantitative expected value calculations while denying agents the epistemic resources needed to perform them. The phantom handshake of cosmic cooperation dissolves upon contact with the harsh reality of unquantifiable correlation, leaving the evidentialist agent with no ECL-based reason to alter their course. While the dream of acausal cooperation is captivating, ECL, as currently formulated, remains a theoretically intriguing but practically and logically inert proposition.
