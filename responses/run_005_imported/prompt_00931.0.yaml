  The user mentioned Harnad revisited the topic regarding ChatGPT. I remember he likely maintains that without sensorimotor grounding, LLMs can't truly understand. But the persistence of research suggests others see nuances. For example, some might argue that the statistical patterns in language data indirectly encode real-world information. If the training data includes descriptions of sensory experiences, could that provide a form of grounding? Or is that still just symbols all the way down?

  Another angle: the definition of understanding itself. Philosophers have different theories—functionalist, representationalist, embodied cognition. Harnad's view is based on embodied cognition, but others might argue that if a system behaves as if it understands, that's sufficient. This ties into the Chinese Room thought experiment by Searle, which Harnad's work builds upon. Searle's argument has been debated for decades, so it's natural that Harnad's extension would also face scrutiny.

  The user's sources call the symbol grounding problem an "impossibility result," but Harnad's paper isn't a mathematical proof. It's a conceptual argument. Technical fields like AI might prioritize empirical results over philosophical arguments. When LLMs show emergent behaviors, researchers test them with new experiments, leading to ongoing research rather than closure.

  Also, LLM capabilities challenge previous assumptions. Their scale and data might create a different kind of "understanding" that Harnad didn't anticipate. Some researchers might believe that statistical learning can approximate grounding through correlation, even without direct experience. This could be why interpretability studies continue—to see how models represent information and if those representations mirror human-like understanding.

