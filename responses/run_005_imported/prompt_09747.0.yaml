  The user's analogy about defining "downhill" as the direction balls roll is spot-on. If we pick macrostates based on what's measurable or relevant to us, and those are tied to temporal asymmetries, then the Past Hypothesis might be circular. The user is asking if this is a known objection and if there's a solid response to it.

  I remember that this is indeed a recognized issue in philosophy of physics. Critics like Callender have pointed out the "coarse-graining problem." The user might not have encountered this in their readings yet. They need validation that their concern is legitimate and not just them going in circles.

