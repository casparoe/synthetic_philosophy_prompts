  First, I need to break down each of the four moves. Mara's first point argues ADHD isn't a disorder but a normal variation labeled as problematic. Dev counters with hypertension as a continuous trait with cutoffs, emphasizing worse outcomes. Mara rebuts that "worse outcomes" depend on societal values, like modern work environments. Dev responds that some symptoms cause universal issues, like forgetting to eat.

