  First, I need to unpack the core problem. The repugnant conclusion shows that maximizing total utility can lead to preferring a huge population with minimal well-being over a smaller, happier one. Arrhenius's theorems indicate that no population ethic can satisfy all intuitive principles without leading to counterintuitive results. The user needs to choose a social welfare function for their IAM, so they need practical guidance on navigating these ethical dilemmas in a quantitative model.

  The user mentioned critical-level utilitarianism (CLU), variable-value theories, and Parfit's "Theory X". They want to know how to handle the trade-offs between population size and average well-being in climate policy. Their explicit request is for practical implications, not a literature survey. They might be feeling overwhelmed by the philosophical complexity and needing actionable steps for their model.

  Looking deeper, the user likely needs to justify their choice of welfare function in their dissertation, addressing their advisor's concerns. They might also be seeking validation that it's acceptable to make a principled choice among imperfect options. There's an unspoken need for reassurance that sidestepping the impossibility theorems is feasible without compromising academic rigor.

  Key considerations: IAMs require cardinal, aggregable welfare metrics. Total utilitarianism is simple but leads to the repugnant conclusion. Alternatives like CLU add a critical level but face challenges in parameter selection. Variable-value theories avoid repugnance but might complicate discounting or violate other principles.

  Practical advice should include transparency in ethical choices, sensitivity analysis, and perhaps a hybrid approach. Emphasizing that all options have trade-offs, so the key is to be explicit about which bullet they're biting. Also, connecting these choices to climate policy specifics, like how population projections interact with emissions scenarios, could strengthen their model's relevance.

  I should also note the importance of separating empirical and normative parameters. For example, the critical level in CLU is normative and should be varied in sensitivity tests. Highlighting real-world implications, such as valuation of statistical lives versus climate damages, can bridge theory and policy.

  Finally, reassure the user that while no solution is perfect, methodological transparency and acknowledging the ethical trade-offs make their approach defensible. Their work contributes by framing these philosophical issues in an economic modeling context, which is valuable for policymakers who must make practical decisions amidst ethical uncertainty.
answer: |-
  This is a profoundly important and difficult challenge at the intersection of ethics, economics, and climate policy. Your advisor is right to push on this – the standard welfare functions used in IAMs often embed highly contestable population ethical assumptions *by default*. Here's a breakdown of the implications and practical approaches:

  **Core Implications of the Repugnant Conclusion & Impossibility Theorems for IAMs:**

  1.  **The Default is Problematic:** Standard Total Utilitarianism (TU) – maximizing the sum of utilities – prevalent in many IAMs (including DICE's lineage) *directly implies* the Repugnant Conclusion. Any policy maximizing total welfare under TU will, under sufficiently large population growth scenarios, favor policies leading to a vastly larger population with lives barely worth living over a smaller population with very high welfare. This is a feature, not a bug, of TU.
  2.  **No "Perfect" Solution Exists:** Arrhenius's theorems mean there is *no* population axiology that satisfies a set of seemingly minimal, intuitive desiderata (e.g., Non-Elitism, Non-Anti-Egalitarianism, Mere Addition, Avoidance of Sadism/Repugnance) without violating at least one. Choosing *any* welfare function means accepting *some* counterintuitive implication or violating *some* plausible principle.
  3.  **"Average Utilitarianism" is Not the Savior:** While AU avoids the Repugnant Conclusion (it prefers smaller, happier populations), it faces devastating problems:
      *   **The Mere Addition Paradox:** Adding happy people to an existing happy population *lowers* average welfare (if the new people are slightly less happy) and is therefore *disapproved* by AU, violating the strong intuition that adding happy lives is good.
      *   **Extinction Problem:** AU might prefer a world with one extremely happy person over a world with many very happy people (if the single person is happier *on average*).
      *   **Policy Perversity:** Under population decline scenarios (relevant for some projections), AU could disfavor policies saving lives if the saved individuals are expected to have below-average welfare.
  4.  **The Stakes are Enormous:** Population size is a *massive* multiplier in welfare calculations for long-term climate impacts. Choosing TU vs. AU vs. CLU vs. VV can radically alter the implied optimal climate policy stringency and the valuation of future damages, especially under divergent population projections (high growth vs. decline).

  **Practical Approaches for Choosing a SWF in IAMs:**

  1.  **Explicit Axiomatic Choice & Transparency:** The most defensible approach is to:
      *   **Acknowledge the Impossibility:** State clearly that *no* SWF satisfies all desirable properties.
      *   **State Your Chosen Axioms:** Explicitly list the core principles you prioritize and those you are willing to violate. Justify *why* these priorities make sense in the context of climate policy and intergenerational justice.
      *   **Acknowledge the Bullet:** Be upfront about which counterintuitive conclusion(s) your chosen SWF implies (e.g., "We adopt Critical-Level Utilitarianism with γ=2, accepting the possibility of the Sadistic Conclusion in rare cases but avoiding the Repugnant Conclusion and Mere Addition Paradox").
      *   **Document the Sensitivity:** This transparency is crucial for interpreting results and policy recommendations.

  2.  **Critical-Level Utilitarianism (CLU) - A Leading Contender:**
      *   **Concept:** Welfare = Σ(u_i - γ), where γ is a "critical level" of welfare above which adding a life is good, below which it is bad. γ > 0.
      *   **Advantages:**
          *   Avoids the Repugnant Conclusion (if γ > "barely worth living").
          *   Avoids the Mere Addition Paradox (adding lives above γ is good, even if slightly below average).
          *   Provides a continuous spectrum between TU (γ=0) and AU (γ→∞).
          *   Conceptually linked to the "Value of a Statistical Life" (VSL) – γ can be calibrated to reflect societal valuations of life risk. This offers a potential bridge to empirical economics.
      *   **Challenges:**
          *   **Choosing γ:** This is the *core normative parameter*. Is γ fixed? Does it vary with time/affluence? Calibrating γ to VSL is common but controversial (VSL reflects risk, not existence value; VSL scales with income, should γ?).
          *   **The Sadistic Conclusion:** CLU can prefer adding lives with *positive* welfare below γ to a population over adding lives with *higher* welfare (even above γ) if the former group is larger. This violates the intuition that higher welfare additions are always better than lower welfare additions.
          *   **Non-Transitivity Issues:** Some formulations can lead to non-transitive orderings.
      *   **Practical IAM Advice:** Use CLU. Treat γ as a *key normative sensitivity parameter*. Run scenarios with γ calibrated to VSL (acknowledging limitations), γ=0 (TU), γ at a "neutral level," and perhaps a high γ. Explicitly discuss the implications of γ choice for optimal policy (e.g., higher γ generally implies less stringent climate policy, as future larger populations are discounted more heavily relative to fixed γ).

  3.  **Variable Value (VV) / Number-Dampened Utilitarianism:**
      *   **Concept:** The marginal value of adding a person decreases as total population increases. Welfare = Σ(V(N) * u_i), where V(N) is a decreasing function of population size N. Or, Welfare = N * f(average u), where f is concave.
      *   **Advantages:**
          *   Directly targets the Repugnant Conclusion by dampening the value of large numbers.
          *   Can avoid both Repugnant and Sadistic Conclusions with careful functional form choice.
      *   **Challenges:**
          *   **Choosing the Dampening Function/Parameter:** Highly arbitrary. What shape? What degree of concavity? No clear empirical anchor.
          *   **Violations:** Can violate Mere Addition or other plausible principles depending on specification. May imply "elitism."
          *   **Discounting Interaction:** Complicates discounting calculations, as the value function V(N) itself changes over time with population.
      *   **Practical IAM Advice:** Less common in IAMs due to arbitrariness and complexity. If used, treat the concavity/dampening parameter as a major sensitivity variable. Acknowledge the lack of clear calibration and the specific principles violated.

  4.  **Person-Affecting Views & "Theory X" Aspirations:**
      *   **Concept:** Focus on making existing or future-*necessary* people better off, avoiding comparisons involving different possible people (who Parfit called "merely possible"). Parfit sought a theory that avoids repugnance without sadism or mere addition paradoxes.
      *   **Challenges:** No consensus "Theory X" exists. Formalizing person-affecting views for variable population policy choices is extremely difficult and often leads back to contradictions or requires restrictive assumptions (e.g., "Necessitarianism").
      *   **Practical IAM Advice:** Currently too underdeveloped and contested for direct implementation in standard aggregative IAMs. However, the *intuition* can inform qualitative discussion: emphasize impacts on people who *will* exist regardless of policy (near-term generations) and the potential creation of lives *expected* to be worth living (vs. miserable) under different climate paths. This leans towards avoiding policies that create massive suffering, even if TU might sometimes favor them under extreme growth assumptions.

  5.  **"Sidestepping" via Non-Comparability or Domain Restriction (Tentative):**
      *   **Non-Comparability:** Argue that welfare levels across vastly different population sizes or qualities of life are *incommensurable*. IAMs fundamentally require cardinal comparability, so this path largely blocks quantitative modeling.
      *   **Domain Restriction:** Argue that for *realistic* climate policy scenarios over the next 1-3 centuries, the range of plausible population sizes and welfare levels is such that *all* plausible SWFs agree on the sign (if not the magnitude) of welfare impacts. Thus, the choice matters less for the *direction* of policy (mitigation is good) than for the *optimal stringency*. This needs careful justification based on SSP population projections and damage function ranges. It doesn't resolve the fundamental ethical problem but might reduce its practical salience for near-term policy.

  **Recommendations for Economists & Policymakers:**

  1.  **Abandon Total Utilitarianism by Default:** TU's direct implication of the Repugnant Conclusion makes it ethically untenable as the sole or default basis for long-term policy evaluation involving population change. Stop treating it as the neutral, obvious choice.
  2.  **Embrace CLU with Sensitivity Analysis:** CLU is currently the most promising candidate for practical modeling. Its critical level γ provides a crucial normative lever.
      *   **Make γ Explicit & Varied:** Report results across a *meaningful range* of γ values. Don't hide it.
      *   **Link (Cautiously) to VSL:** Use VSL calibration as a *starting point* for discussion, not an endpoint. Acknowledge the conceptual gap between risk and existence value.
      *   **Discuss γ's Policy Impact:** Explicitly show how γ influences the Social Cost of Carbon (SCC) and optimal mitigation pathways.
  3.  **Transparency is Paramount:** The ethical assumptions embedded in the SWF are *at least* as important as assumptions about discount rates or damage functions. Model documentation and publications must clearly:
      *   State the chosen SWF and its axiomatic basis.
      *   Acknowledge the violated principles/counterintuitive implications.
      *   Report sensitivity to key normative parameters (γ in CLU, concavity in VV).
  4.  **Focus on Avoiding Catastrophe:** Across a wide range of plausible SWFs (excluding extreme TU), policies that avoid catastrophic climate outcomes leading to massive suffering or civilizational collapse are strongly favored. This provides some ethical common ground.
  5.  **Separate Empirical & Normative:** Distinguish clearly between:
      *   *Empirical:* Projections of population size, climate impacts on *per capita* consumption/health (damage functions).
      *   *Normative:* The choice of SWF (TU, CLU, AU, VV), the value of γ, and the discount rate. Don't let normative choices masquerade as technical inevitabilities.

  **In summary:** Taking the Repugnant Conclusion and impossibility theorems seriously means recognizing that choosing a SWF for an IAM is fundamentally an *ethical choice* with profound implications, not just a technical one. There is no perfect escape hatch. The most responsible approach is to **adopt Critical-Level Utilitarianism (CLU), treat the critical level γ as a central normative sensitivity parameter, rigorously test its impact, and be radically transparent about the axiomatic choices made and the counterintuitive bullets bitten.** Acknowledge that this choice, alongside discounting, is where core ethical commitments shape the model's quantitative output and policy recommendations. Your dissertation chapter highlighting this dilemma and providing a framework for navigating it transparently is a vital contribution.
