answer: |-
  This is *absolutely* the heart of the fascinating tension in Newton's thought, and your editor is wrong – cutting it loses the key to understanding why his "hidden" theology mattered so deeply to *how* he did science. The link isn't just coincidence; it's rooted in Newton's core conception of **Divine Dominion (*Dominatio*)** as an *active, continuous, and necessary* attribute of the *one* true God. Here's the breakdown:

  1.  **Anti-Trinitarianism & Divine Unity: The Foundation of Sovereignty:**
      *   Newton saw the Trinity as a catastrophic 4th-century corruption that introduced polytheism and obscured the *absolute, singular sovereignty* of God the Father. His unitarianism wasn't just about counting persons; it was about restoring the *unique, absolute, undivided power and authority* of the Supreme Being.
      *   For Newton, this unique God *must* be the **Pantokrator** – the Almighty Ruler, the Lord of Hosts. Passivity, distance, or delegation of ultimate control (especially to a co-equal Son) was anathema. It diminished God's glory and dominion.

  2.  **Dominion (*Dominatio*) as Active Control, Not Initial Design:**
      *   This is the crucial conceptual leap. Newton's God isn't defined *only* by being the First Cause or Designer. His essential nature includes **ongoing, active rule**.
      *   **The General Scholium (1713):** This is the manifesto. Read it carefully: "He endures forever and is everywhere present; and by existing always and everywhere, he constitutes duration and space... It is allowed by all that the Supreme God exists necessarily; and by the same necessity he exists *always* and *everywhere*... We know him only by his most wise and excellent contrivances of things, and final causes; we admire him for his perfections; but we reverence and adore him on account of his *dominion*: for we adore him as his servants; and a god without *dominion*, providence, and final causes, is nothing else but Fate and Nature."
      *   **Key Point:** Dominion isn't past tense. "Always and everywhere" necessitates *continuous* presence and action. A God whose dominion is merely historical (setting things up) isn't truly sovereign *now*. "Dominion" implies active governance.

  3.  **Science Reveals the *Need* for Active Dominion:**
      *   **The Problem of Stability:** Newton's *own physics* revealed a potential problem. His calculations (especially on the solar system's long-term stability) suggested accumulating irregularities. Comets perturbed orbits, mutual planetary gravitation caused drift. While he sought mathematical proofs of stability (and thought he found some in later editions of the *Principia*), his deepest conviction, fueled by observation and calculation, was that the system was **not** perfectly self-correcting.
      *   **God the Cosmic Maintainer:** If the cosmos *requires* occasional intervention to prevent decay or chaos, then **only an actively governing God can maintain the perfection and order befitting His creation.** A purely deistic God who built a perfect, self-sustaining machine would be *logical* – but Newton's physics suggested this wasn't the reality. His God *must* act to preserve the harmony He established. This wasn't a sign of *imperfection* in God, but rather a necessary consequence of the *created* nature of the cosmos (which inherently possesses less than absolute perfection/stability).
      *   **Opticks Queries (esp. Q31):** He explicitly links the beautiful order of the universe to God's continuous power: "Does it not appear from phenomena that there is a Being incorporeal, living, intelligent, omnipresent, who in infinite space, as it were in his sensory, sees the things themselves intimately, and thoroughly perceives them, and comprehends them wholly by their immediate presence to himself... And though every true step made in this philosophy brings us not immediately to the knowledge of the first cause, yet it brings us nearer to it, and on that account is to be highly valued." The emphasis is on *current* perception and governance.

  4.  **The Leibniz-Clarke Fight: Dominion vs. Perfection (and Pride):**
      *   **Leibniz's Jab:** Leibniz accused Newton (via Clarke) of implying God was an inferior watchmaker who needed to "wind up his watch" or "clean it" occasionally. For Leibniz, a perfect God *must* create a perfect, self-sufficient machine. Divine perfection implied a self-contained, harmonious universe requiring no intervention. Intervention would imply an *imperfect* initial creation.
      *   **Newton's (Clarke's) Core Argument:** This is where theology and physics collide head-on.
          *   **Theological:** Newton/Clarke argued Leibniz's view **diminished God's dominion and providence.** A God who *cannot* or *does not* actively govern His creation is not truly sovereign. Dominion *requires* the *capacity* and *will* to act. Making God a prisoner of His own initial laws (however perfect) robbed Him of true freedom and lordship. "The notion of the world's being a great machine, going on without the interposition of God, as a clock continues to go without the assistance of a clockmaker; is the notion of materialism and fate, and tends, (under pretence of making God a *supra-mundane intelligence*,) to exclude providence and God’s government in reality out of the world." (Clarke, Third Reply).
          *   **Physical:** Newton/Clarke argued that the phenomena (comets, potential instabilities) *demonstrated* the *need* for intervention. Denying this was denying the evidence. Divine perfection, for Newton, included the perfection of God's *active will* to sustain His creation, not just His initial design skill.
          *   **Pride?** Oh, absolutely wounded pride played a role. Newton took any challenge to his system (scientific *or* theological) extremely personally. But the core of the dispute was genuinely substantive: **What does Divine Perfection *mean*?** Is it expressed solely in the *initial act* of creating a perfect machine (Leibniz), or does it *inherently include* the continuous exercise of sovereign will to sustain and govern that creation (Newton)?

  **The Logical Connection Summarized:**

  1.  **Rejecting the Trinity** restores the **absolute, undivided sovereignty** of God the Father.
  2.  **True Sovereignty (Dominion)** necessitates **active, continuous governance**, not just initial design.
  3.  **Newton's Physics** revealed a universe that appeared to **require** such active governance to maintain order and prevent decay.
  4.  Therefore, an **actively intervening God** is not just possible, but **logically necessary** to uphold both God's essential attribute of *Dominion* and the observed order of the cosmos. Deism, by making God passive *after* creation, was effectively a denial of His true sovereignty and providence – as theologically offensive to Newton as the Trinitarian "corruption."

  **Why Fight for This Section?**

  *   **It Reveals Newton's Coherence:** It shows his theological heresy wasn't an isolated eccentricity but fundamentally shaped his *scientific* worldview and interpretation of his *own* discoveries. His God wasn't hidden; He was actively revealed *in* the ongoing phenomena.
  *   **Highlights the Stakes:** The Leibniz fight wasn't just about physics or pride; it was a profound clash of *theologies of nature*. What does God's perfection *look like* in the physical world?
  *   **"Hidden" Newton in Plain Sight:** The General Scholium and Opticks Queries *are* his public works. The "hidden" theology (anti-Trinity) is the key unlocking why he wrote those passages the way he did. You see the private conviction driving the public argument.
  *   **It's the Counter-Intuitive Hook:** The "fun fact" is Newton was a heretic. The *deep* story is that this heresy made him *reject* the emerging deism his physics seemed to suggest to others, leading him to insist *more* strongly on divine action.

  **Key Sources to Cite/Evoke:**

  *   Newton's **General Scholium** (Principia, 2nd & 3rd eds.)
  *   Newton's **Opticks** (Queries 28 & 31 especially)
  *   The **Leibniz-Clarke Correspondence** (Focus on Clarke's arguments as Newton's mouthpiece)
  *   Scholarship by **Stephen Snobelen, James Force, Rob Iliffe** – they've done the deepest work on precisely this nexus of theology and natural philosophy in Newton.

  Don't let the editor cut it! This *is* the fascinating core of the "hidden" Newton's profound influence on his "public" science. Frame it as the essential link explaining *why* his heresy mattered to everything else. Good luck!
