answer: |-
  You've hit on one of the most subtle and controversial passages in *Principia Ethica*. Moore's argument here *is* startling, but it's crucial to parse his precise claims and methodological context. Let's break down the structure, the potential contradiction, and the likely interpretation:

  ### 1. Moore's Core Argument in §122 (Step-by-Step)

  *   **Thesis:** Personal affection is a complex organic unity where the *whole* is vastly more valuable than the sum of its *isolated* parts.
  *   **Components Identified:**
      *   **A:** Appreciation/Cognition of the person's admirable *mental qualities* (character, intellect, etc.).
      *   **B:** Appreciation/Cognition of the person's *corporeal expression* of those qualities (looks, words, actions embodying the character).
      *   **(The Object):** The person themselves, possessing intrinsic value (partly *because* of those mental qualities).
  *   **Key Claim 1:** The whole `[Appreciation of (Mental Qualities + Corporeal Expression) + The Valued Person]` is *far* more valuable than any subset.
  *   **Key Claim 2 (The Shocking Bit):** When we *isolate* Component A (appreciation of mental qualities *alone*, stripped of *any* corporeal expression):
      *   It's phenomenologically difficult/impossible to imagine clearly.
      *   The isolated state `[Appreciation of Mental Qualities Alone]` appears to have *less* intrinsic value than the isolated state `[Appreciation of Mere Corporeal Beauty]` (Component B isolated).
  *   **Conclusion:** The immense value of personal affection stems primarily from the *organic unity* of the whole complex, *not* from the isolated high value of appreciating mental qualities (Component A). Component A's primary ethical importance is its *essential contribution* to the vastly more valuable whole, *not* its high intrinsic value in isolation.

  ### 2. Addressing Your Specific Questions & Concerns

  *   **Is Moore seriously saying appreciating character *in isolation* is worth *less* than appreciating a body *in isolation*?**
      *   **Yes, that is his explicit claim *about the isolated states*.** He says: "It even appears to be doubtful, whether, in itself, [the appreciation of mental qualities] possesses so much value as the appreciation of mere corporeal beauty undoubtedly does possess." He bites the bullet: Isolated `[Appreciation of Corporeal Beauty]` > Isolated `[Appreciation of Mental Qualities]`.
  *   **Is he ranking corporeal beauty *above* character appreciation *overall*?**
      *   **Absolutely not, and this is the critical nuance.** Moore is *only* ranking the *isolated* appreciation states. He is emphatically *not* saying:
          *   Corporeal beauty itself > Mental qualities themselves. (He likely thinks mental qualities have vastly *more* intrinsic value as objects).
          *   That appreciating someone *just* for their body is *better* than appreciating someone *just* for their character *in real life*. (Real-life appreciation is never purely isolated).
      *   **His core point is about *relational value*:** The combination `[Appreciation of Mental Qualities *WITH* Appreciation of Corporeal Expression]` within the context of valuing the person creates a whole (`Personal Affection`) whose value *dwarfs* the value of either isolated appreciation state, and indeed, dwarfs the sum of their isolated values. Component A is *essential* for the supreme value of the whole, *despite* its relatively low value in isolation.
  *   **Isn't applying the "method of isolation" to Component A methodologically fishy?**
      *   **Yes! This is the most powerful and valid criticism of this passage.** Moore himself established the doctrine of organic unities: the value of a whole is *not* necessarily the sum of the values of its parts considered in isolation. He explicitly warns against assuming a part contributes value proportional to its isolated value.
      *   **The Contradiction:** By isolating Component A (appreciation of mental qualities) and judging its low isolated value, and then using *that* low value to downplay Component A's *contribution* to the whole, Moore seems to violate his own doctrine. He's essentially saying: "Component A has low value alone, therefore its contribution to the whole isn't primarily *its own value*, but rather its role in forming the unity." But the whole point of organic unities is that a part *can* contribute immense value *only within the whole*, value it utterly lacks in isolation.
      *   **Why Moore Might Think He's Justified (Flawed or Not):** He might argue he's *only* using isolation to assess the *intrinsic value of the appreciation states themselves* as distinct conscious experiences, not to assess the value of the *objects* (mental qualities vs. body) or the contribution of the parts *within the whole*. He's trying to compare two *types of conscious states* (cognizing character vs. cognizing beauty) in their purest, most abstract forms. However, the artificiality of stripping character appreciation of *any* associated imagery (which he admits is near-impossible) makes this highly questionable.

  ### 3. Why This Isn't *Insane* (Just Very Counterintuitive & Methodologically Fraught)

  1.  **Focus on Conscious Experience:** Moore is fundamentally concerned with the intrinsic value of *states of consciousness*. He's arguing that the raw *experience* of contemplating pure character, devoid of any sensory or emotional embodiment (which he ties to corporeal expression), is a thinner, less valuable conscious state than the *experience* of contemplating beauty (which is inherently sensory/emotional). He's not commenting on the moral worth of the *person* with character vs. the *person* with beauty.
  2.  **Defending the Primacy of the Whole:** His primary goal is to defend the supreme value of the *complex whole* of personal affection *against* the idea that it derives its value simply from the high value of appreciating character alone. He's emphasizing that the *synthesis* with corporeal expression is crucial for the immense value.
  3.  **Explaining Intuition:** He's trying to explain *why* actual affection feels richer and more valuable than purely intellectual admiration. The corporeal connection provides the emotional warmth and immediacy.

  ### 4. Bloomsbury & The "Vibes-Level Takeaway"

  *   Bloomsbury (rightly) focused on Moore's **overall conclusion**: Personal affection and aesthetic enjoyment are the *supreme* goods. They embraced the idea of complex, emotionally rich, embodied human connection as intrinsically valuable.
  *   They likely glossed over or ignored §122's counterintuitive ranking because:
      *   It's buried in a technical argument.
      *   It contradicts lived experience (we *feel* character appreciation deeply).
      *   Moore's conclusion still places the *whole complex of affection* (which *includes* character appreciation inextricably linked to expression) at the pinnacle.
      *   His warning about isolating parts made them wary of taking §122's isolation exercise as an ethical prescription.

  ### Close Reading Summary & Key Takeaways

  1.  **Argument Structure:** Moore isolates components of personal affection to test their intrinsic value. He finds `[Appreciation of Mental Qualities Alone]` hard to conceive, but when conceived, seems less intrinsically valuable than `[Appreciation of Corporeal Beauty Alone]`.
  2.  **Shocking Claim:** Yes, he *does* claim the isolated appreciation of corporeal beauty has *more* intrinsic value than the isolated appreciation of mental qualities.
  3.  **Crucial Nuance:** This ranking *only* applies to the *artificially isolated conscious states*. He *emphatically does not* rank corporeal beauty *itself* above mental qualities *themselves*, nor does he suggest pursuing bodily appreciation *instead* of character appreciation. The *whole complex* containing *both* appreciations is supreme.
  4.  **Methodological Problem:** This application of isolation *does* arguably violate Moore's own organic unities doctrine. He uses the low isolated value of Component A to downplay its *contributory* value within the whole, which the doctrine warns against. Isolating Component A might be incoherent, as mental qualities are *cognized* through expressions.
  5.  **Moore's Real Point:** The supreme value of personal affection is an emergent property of the *synthesis* of appreciating mental qualities *through* their corporeal expression within a relationship with a valued person. Neither appreciation state alone captures the magic. The §122 exercise is primarily meant to show that the character appreciation part *isn't* so supremely valuable *by itself* that it explains the whole; the unity is key.

  **In essence:** Moore isn't a secret corporeal beauty supremacist. He's a *complex unity* supremacist. §122 is his (flawed and counterintuitive) attempt to demonstrate *why* the unity of personal affection is irreducibly supreme by showing that its *parts*, when unnaturally isolated, don't come close to explaining its value – and that one part (character appreciation) looks surprisingly weak in isolation compared to another (beauty appreciation), highlighting how much value emerges *only* in their combination. The Bloomsbury Group took the "unity is supreme" message and ran with it, understandably downplaying the problematic isolation experiment.
