  ## Hume's Monetary Paradox: A Leaky Theory in a Specie-Flow Straitjacket

  David Hume’s essays "Of Money" and "Of the Balance of Trade" represent foundational pillars of classical monetary economics. Yet, when scrutinized together, they reveal a fundamental tension that strains the coherence of his system. While Hume brilliantly articulates the long-run neutrality of money and the self-correcting mechanism of the price-specie-flow, his insistence on the desirability of a perpetually *increasing* money supply undermines this very framework. Ultimately, Hume fails to reconcile these elements; the specie-flow mechanism fatally undercuts his justification for perpetual monetary expansion, revealing a residual mercantilist impulse his own logic should have extinguished.

  **The Core Claims: Long-Run Neutrality vs. Short-Run Stimulus**

  1.  **"Of Money" - The Two Steps:**
      *   **Step One (Long-Run Neutrality):** Hume unequivocally states that "the greater or less plenty of money is of no consequence" for a nation's real wealth. Money is merely a "counter" representing commodities. Doubling the money supply merely doubles prices in the long run; real output, employment, and wealth remain unchanged. This is the Quantity Theory of Money in its purest classical form.
      *   **Step Two (Short-Run Stimulus):** Despite this neutrality, Hume argues a nation *should* desire a gradual increase in its money supply. The crucial reason lies in the "interval" between the injection of new money and the full adjustment of prices. During this lag, increased liquidity lowers interest rates, animates industry, encourages merchants and manufacturers, and stimulates employment and output. This "enlivening" effect is the sole benefit of more money.

  2.  **"Of the Balance of Trade" - The Automatic Corrector:**
      *   Here, Hume demolishes mercantilist obsessions with hoarding specie (gold/silver). He demonstrates the **price-specie-flow mechanism**: If one nation accumulates specie through a trade surplus, its domestic money supply increases. This inevitably leads to rising domestic prices relative to other nations. Its exports become more expensive (and thus less competitive), while imports become cheaper. This trade imbalance reverses, causing specie to flow *out* until equilibrium is restored. Attempts to permanently hoard specie are self-defeating; the system automatically redistributes money to maintain balance.

  **The Fatal Contradiction: Stimulus vs. Specie-Flow**

  The core problem arises when we apply the specie-flow mechanism to Hume's justification for perpetual monetary expansion:

  1.  **The Stimulus is Ephemeral Under Specie-Flow:** If a nation successfully increases its domestic money supply (say, via a trade surplus), Hume himself argues this triggers the price-specie-flow mechanism. Rising prices erode competitiveness, leading to a trade deficit and an *outflow* of money. The "stimulus" phase is not just temporary; it actively *causes its own reversal*.
  2.  **Perpetual Expansion is Impossible:** Hume's desired state of *constant* monetary increase requires either:
      *   *Continuous, unsustainable trade surpluses*: But the specie-flow mechanism makes this impossible. Any surplus triggers price rises and a corrective deficit.
      *   *Domestic money creation (e.g., paper credit)*: While Hume discusses banks and credit, his advocacy for increasing the money supply primarily focuses on specie (the metallic base). Crucially, *any* persistent increase in the effective domestic money supply relative to trading partners would still trigger the price-specie-flow dynamic if it impacted the price level and trade competitiveness. The mechanism targets the *effective* money supply influencing prices, not just specie.
  3.  **The "Interval" Becomes a Mirage:** The stimulating "interval" is predicated on the money supply increase being somewhat isolated and persistent enough for the stimulus to take effect *before* prices fully adjust and the specie-flow kicks in. However, in an open economy under the gold standard Hume assumes, the specie-flow mechanism acts precisely to *prevent* such persistence. The stimulus from one influx is likely cut short by the corrective outflow triggered by the resulting price changes. The "interval" becomes vanishingly small or inconsistent.
  4.  **Undermining the Very Reason:** The entire *rationale* for wanting more money – the stimulating "interval" – is rendered largely ineffective or self-negating by the very mechanism Hume uses to dismantle mercantilism. If the system automatically corrects monetary imbalances through trade and price adjustments, actively *seeking* an imbalance (a larger money stock than neighbors) is futile. The benefit is fleeting and provokes its own counterforce.

  **Weighing the Defenses (and Finding them Wanting)**

  *   **Defense 1: Focus on Gradual Increase:** Hume emphasizes *gradual* increases. Could this allow stimulus without triggering massive outflows? Perhaps, but gradualism doesn't negate the fundamental dynamic. A persistent *trend* of increase relative to others would still induce a persistent *tendency* for higher relative prices and trade deficits, draining money and counteracting the stimulus.
  *   **Defense 2: Stimulus Creates Lasting Gains:** Could the temporary stimulus improve productivity or capital stock, creating *permanent* real gains? Hume hints at this ("encrease of industry"). This is the strongest defense. *If* the stimulus sparks innovation, infrastructure, or skills that permanently boost productive capacity *before* the outflow occurs, then real wealth increases. However, Hume doesn't develop this argument sufficiently. His primary justification remains the direct, monetary stimulation *during the interval*. Furthermore, the specie-flow mechanism would still work to redistribute the *monetary* gains from this real growth.
  *   **Defense 3: Closed Economy Assumption Implicit?** Did Hume tacitly assume a relatively closed economy for the stimulus argument? His explicit focus on international trade in "Balance of Trade" and the mechanics of specie-flow strongly argue against this. His monetary theory is inherently international.

  **Verdict: Mercantilist Residue in a Classical Frame**

  Hume's monetary economics does not hang together coherently. The price-specie-flow mechanism, his brilliant contribution to international trade theory, acts as a devastating critique of his own policy preference for perpetual monetary expansion articulated in "Of Money."

  The desire for a constantly increasing money supply, justified by the stimulating "interval," is fundamentally at odds with the automatic, equilibrating force of specie-flow. The mechanism ensures that any monetary advantage gained is temporary and self-reversing. The "interval" is not a stable platform for policy but a transient phase inevitably leading to countervailing outflows.

  Therefore, **Hume is indeed smuggling in a mercantilist assumption – the inherent desirability of accumulating more money (specie) – that his own, superior trade theory logically kills off.** While he intellectually grasped the futility of hoarding specie, a residual belief in the active benefits of *having more money than others*, at least in the short run, persisted. This creates an unsupported exception to his long-run neutrality and undermines the logical consistency of his system. The specie-flow mechanism doesn't just complicate his stimulus argument; it eviscerates its foundation. Hume demolished the mercantilist edifice but couldn't quite resist keeping one of its prized bricks.
