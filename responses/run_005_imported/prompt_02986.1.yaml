answer: |-
  ## The Causal Weight of Nothing: Why Omissions Demand Normative Anchors

  Your postmortem unearthed a profound metaphysical fault line. The sentence naming the on-call engineer's failure feels intuitively correct, yet the counterfactual equivalence of *all* potential actors' inactions exposes a deep tension in how we understand causation itself. The question – are omissions genuine causes or merely convenient placeholders for blame? – forces us to confront the nature of causality and the problem of causal profligacy head-on. While David Lewis's counterfactual theory grants omissions full causal status, its inability to discriminate between relevant and irrelevant non-events renders it inadequate for practical reasoning. Phil Dowe's process theory, by denying omissions any causal power, safeguards precision but sacrifices intuitive and explanatory power. Sarah McGrath's normative approach, however, provides the crucial contextual anchor, rescuing omissions as *bona fide* causes *only when* they violate specific expectations, thereby resolving the profligacy problem and aligning with our practices of explanation and responsibility. **Omissions are causes in the full, literal sense, but their causal status is inherently and necessarily relative to contextually defined normative or statistical baselines; without this anchor, the concept collapses under its own weight.**

  **The Counterfactual Abyss: Lewis and the Profligacy Problem**
  David Lewis's counterfactual theory defines causation thus: Event C is a cause of event E if and only if, had C not occurred, E would not have occurred (or its occurrence would have been significantly different). This elegantly captures omissions: if the on-call engineer *had* rolled back within fifteen minutes (i.e., if their omission *had not occurred*), the outage *would have been* shorter. Lewis explicitly defends this in "Void and Object," arguing that absences *can* make counterfactual differences and thus qualify as causes. The problem, as you astutely recognized, is **causal profligacy**. If the on-call's omission is a cause, then so is *your* failure to roll back, the *director's* failure, the *unrelated engineer's* failure, and indeed, the failure of *anyone physically capable* of performing the rollback. The counterfactual test is satisfied equally by all: if *any* of them had acted, the outage would have been shorter. Lewis acknowledges this explosion of causes but accepts it as the cost of a simple, unified theory. He argues common sense *pragmatically* focuses on salient causes (like the one with a duty), but metaphysically, all these non-events are causes. This is deeply unsatisfying. It renders "cause" almost meaningless in complex scenarios, drowning the genuinely relevant factor in an ocean of trivial non-events. Why single out the on-call engineer if, metaphysically, your laziness is equally causal? Lewis offers no principled distinction *within* the causal category itself.

  **Process Purity: Dowe and the Denial of Omission-Causation**
  Phil Dowe's conserved quantity theory offers a stark alternative. For Dowe, genuine causation requires a spatiotemporally continuous process involving the transfer or exchange of a conserved quantity (like momentum, energy, or charge) from cause to effect. A brick breaking a window involves energy transfer; the on-call engineer *actively* deploying bad code involves energy transfers (typing, server commands). However, the *failure* to roll back involves no such physical process emanating *from* the omission itself. Nothing physical *flows* from the director's inaction *to* the prolonged outage. Dowe concludes omissions are not causes at all; they are mere "quasi-causes." We *treat* them like causes because they satisfy counterfactuals and are salient for responsibility, but strictly speaking, the cause of the prolonged outage is the *continuing operation of the faulty system* (a positive process), not the *absence* of intervention. This solves profligacy brilliantly: only positive processes are causes. Your director's inaction is metaphysically inert. However, this comes at a high cost. It severs the deep intuitive and explanatory link we perceive between the on-call's *duty-bound inaction* and the extended outage. Saying "the cause was the running bad code, not the failure to stop it" feels like a linguistic dodge, failing to capture why the postmortem rightly focuses on the *failure to act* as the critical lapse. It struggles to explain why we hold people responsible *for* omissions if they aren't causal. Dowe protects metaphysical purity but sacrifices explanatory adequacy for the very phenomena (like responsibility and preventable harm) where omissions matter most.

  **The Normative Lifeline: McGrath and Contextual Causation**
  Sarah McGrath (and similar theorists like Jonathan Schaffer) offers a way out by anchoring causation in **normative or statistical expectations**. On this view, whether an omission is a cause depends on a departure from a baseline of what *should* or *normally would* happen. The on-call engineer's failure to roll back is a cause because it violated a specific, explicit duty – the normative baseline defined by their role and the SLA. Your failure, the director's, or the unrelated engineer's, however, did *not* violate any relevant norm or expectation. You had no duty to act; your inaction was statistically normal. Thus, only the on-call's omission qualifies as a cause relative to this context. This approach directly addresses the profligacy problem: it provides a *principled* criterion (departure from norm/statistical norm) for distinguishing *relevant* omissions from the vast sea of irrelevant non-events. It explains the asymmetry in your postmortem: the sentence identifies the *normatively significant* omission, the one constituting a failure against an established standard. Crucially, McGrath argues this isn't merely about *blame* sneaking into *causation*; it's about what counts as a *deviation* requiring causal explanation in the first place. We explain events by citing deviations from the expected course. The bad deploy was a deviation; the on-call's failure to follow the rollback *procedure* (the norm) was another deviation directly linked to the prolongation of the harm. Your inaction wasn't a deviation at all.

  **Defending the Normative View Against Objections**
  This view faces challenges, but they can be met:

  1.  **"It's Just Blame in Disguise!"**: Critics argue this conflates causation with responsibility. However, McGrath contends norms define the causal *field*. Consider medicine: not giving penicillin *causes* death in a patient with bacterial infection *because* administering it is the standard of care (the norm). Not giving it to a healthy person isn't causal because there's no norm to administer it. The norm isn't *added* to causation; it defines what constitutes a causally relevant factor in that context. The SLA defines the operational norm, making the on-call's omission a deviation requiring causal citation.
  2.  **"Relativism Run Amok!"**: Doesn't this make causation subjective? Not necessarily. The relevant norms (SLAs, job descriptions, standard procedures) are often objective social facts within an organization or practice. The statistical baseline (what people *usually* do) is also often objectively measurable. While context matters, the baseline isn't arbitrary; it's grounded in the factual circumstances of the situation.
  3.  **"What About 'Natural' Omissions?"**: Does rain failing to fall *cause* a drought? The normative view can accommodate this via *statistical* baselines. In a region with regular rainfall, its absence is a deviation from the statistical norm and thus causally relevant. In a desert, it might not be. The context (geographical, climatic) sets the expectation.

  **Verdict: Causes Anchored in Expectation**
  Therefore, omissions *are* genuine causes, but only when they represent a departure from a contextually relevant normative or statistical baseline. This is not a "cop-out" but a necessary feature of how causation functions in explaining events within complex systems, especially those involving agents and expectations. Lewis's counterfactual theory correctly identifies a necessary condition for causation (making a difference) but fails to provide a sufficient condition for *causal relevance* in a world saturated with potential differences. Dowe's process theory provides a sufficient condition for a specific *type* of causation (physical interaction) but excludes phenomena central to human experience and responsibility. McGrath's normative approach provides the missing filter, grounding causal relevance in the deviation from expected patterns – be they moral, functional, or statistical. It explains why "the missing rollback caused the outage" is literally true *in the context of the engineering team's operational norms*, while "my failure to rollback caused the outage" is false, precisely because I had no such normative burden.

  **Implication for Postmortems: The Myth of the Singular Root Cause?**
  This analysis should indeed make us deeply suspicious of naming any *single* "root cause." Your outage was likely caused by a *causal chain* or *web*:
  1.  The bad deploy (a positive event).
  2.  The failure of automated monitoring to flag the issue instantly (an omission relative to design expectations).
  3.  The on-call engineer's failure to execute the rollback procedure within the SLA (an omission relative to their duty).
  4.  Perhaps systemic factors like unclear alerts or fatigue (positive states enabling the omission).

  Labeling *only* the on-call's omission as "the root cause" risks being reductive and unfair, even if it *is* a genuine cause within the normative context. It ignores the interplay of positive events and other potential omissions (like flawed procedures or tooling). A better approach acknowledges multiple contributing factors – positive events *and* normatively significant omissions – understanding that the "root" is often a complex knot, not a single strand. The normative view of omissions doesn't demand singularity; it helps us identify *which* omissions in the vast sea of non-events are genuinely part of the explanatory web. The postmortem wasn't *wrong* to cite the on-call's omission as *a* cause; it was potentially wrong to imply it was the *only* one. Recognizing omissions as normatively-relative causes enriches, rather than simplifies, our understanding of failure.
