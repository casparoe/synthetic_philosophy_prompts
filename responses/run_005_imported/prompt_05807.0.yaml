answer: |-
  You've hit on a crucial insight that many summaries miss: **Gongsun Long's "White Horse" and "Hard and White" arguments are fundamentally different in their structure and philosophical targets.** You're absolutely right to see one as primarily semantic/nominal and the other as primarily epistemological/metaphysical. Lumping them together as mere "sophistry" obscures their distinct contributions and the genuine philosophical puzzles they raise.

  Let's break them down side-by-side:

  | **Argumentative Element** | **White Horse Dialogue** | **Hard and White Dialogue** |
  |---------------------------|--------------------------|----------------------------|
  | **Core Claim** | "A white horse is not a horse" | "Hard, white, stone: two" (坚白石二) |
  | **Primary Philosophical Domain** | Semantics and naming | Epistemology sliding into metaphysics |
  | **Key Mechanism** | Combinatorial exclusion of terms | Sensory modality isolation |
  | **Argumentative Strategy** | Conceptual containment analysis | Introspection of perceptual experience |
  | **Underlying Premise** | The meaning of compound terms isn't the sum of their parts | Properties are only known through specific sensory channels |
  | **Ontological Implication** | Minimal; focuses on term reference | Strong; suggests independent existence of properties |
  | **Modern Philosophical Relevance** | Limited (semantic artifact) | Significant (perception, properties, consciousness) |

  Now, let's examine each argument in detail:

  1.  **The White Horse Dialogue (Semantics/Naming):**
      *   **Core Argument:** Gongsun Long argues that "a white horse is not a horse." His reasoning hinges on the *function* and *scope* of names (ming 名).
      *   **Mechanism:**
          *   "Horse" (马 *ma*) names/formally picks out the *shape* or *form* (形 *xing*) of horses. It includes *all* horses, regardless of color.
          *   "White" (白 *bai*) names/formally picks out the *color* white. It includes *all* white things, not just horses.
          *   "White horse" (白马 *bai ma*) names/formally picks out the *combination* of the shape "horse" *and* the color "white". Its extension is therefore narrower than "horse" alone (it excludes non-white horses like brown, black, etc.) and also narrower than "white" alone (it excludes non-horse white things like white jade, snow, etc.).
          *   Therefore, since "white horse" excludes things that "horse" includes (non-white horses) and excludes things that "white" includes (non-horse white things), it cannot be identical to either "horse" or "white". "A white horse is not a horse" because the term "white horse" has a different referential scope than the term "horse".
      *   **Argumentative Work:** This is fundamentally a logical argument about the **reference and extension of compound terms**. It explores how combining names creates a new term with a unique identity and scope, distinct from its components. It highlights the potential for ambiguity and category confusion in language. The focus is on the *relationship between words and what they designate*.
      *   **Modern Assessment (Does it hold up?):** As a **literal claim about identity**, it's largely seen as a clever **semantic trick** exploiting a specific, rigid definition of names and identity. Modern semantics understands that compound terms ("white horse") *are* subsets ("horse" with the property "white"), and we navigate this contextually without denying the subset relationship. However, it **remains philosophically interesting** for:
          *   Highlighting the complexities of linguistic reference and categorization.
          *   Foreshadowing issues in intensional logic (where terms with the same extension can mean different things - "morning star" vs. "evening star").
          *   Challenging simplistic notions of naming and identity. While not a robust argument for identity denial today, it effectively exposes potential pitfalls in language.

  2.  **The Discourse on Hard and White (Epistemology/Metaphysics):**
      *   **Core Argument:** Gongsun Long argues that a hard white stone is actually *two* things: hardness and whiteness (坚白石二 *jian bai shi er*). They are not unified in a single object in the way we naively assume.
      *   **Mechanism:**
          *   **Epistemological Premise:** Knowledge of properties is strictly tied to specific senses. *Sight* perceives whiteness but cannot perceive hardness. *Touch* perceives hardness but cannot perceive whiteness. You cannot simultaneously *see* hardness or *touch* whiteness.
          *   **The "Self-Hiding" (自藏 *zicang*) Move:** When you look at the stone, you perceive *only* whiteness; hardness "hides itself" because sight cannot access it. When you touch the stone, you perceive *only* hardness; whiteness "hides itself" because touch cannot access it. Since the senses never apprehend hardness and whiteness *together* in a single act of perception, there is no experiential warrant for claiming they are unified in a single object at that moment.
          *   **Metaphysical Leap:** This sensory isolation leads to the conclusion that hardness and whiteness are fundamentally **separate existents**. They don't inherently "belong" together. The stone isn't a unified substance possessing both properties; it's merely a locus where these two independent properties happen to coincide. Their apparent conjunction is contingent, not essential.
      *   **Argumentative Work:** This argument starts with an **epistemological observation** about the limitations and modality-specific nature of sensory perception. It then leverages this observation to make a **metaphysical claim** about the independent existence of properties ("universals" or "attributes"). The concept of *zicang* is crucial – it posits that properties exist independently of being perceived *and* independently of each other, even when we think they co-inhere in an object.
      *   **Modern Assessment (Does it hold up?):** This is **far more robust and philosophically enduring** than the White Horse argument.
          *   **Epistemological Point:** The core observation about sensory modality is undeniable and remains foundational in philosophy of perception. Qualia (subjective experiences) associated with different senses are distinct and not directly interchangeable.
          *   **Metaphysical Point:** While the strong conclusion of *completely independent existence* ("two things") is highly controversial and arguably an overreach, it powerfully highlights deep philosophical problems:
              *   **The Problem of Perception:** How do disparate sensory inputs (color from sight, texture from touch) get bound together into the perception of a single object? (The "binding problem" in neuroscience/philosophy of mind).
              *   **The Ontology of Properties:** Do properties (hardness, whiteness) exist independently of objects (substances) that bear them? This is a central debate between substance-attribute metaphysics (Aristotelian) and bundle theories (Humean), or even Platonic realism about universals.
              *   **Subjectivity and Qualia:** The argument anticipates debates about the private, subjective nature of sensory experience (e.g., "what is it like" to see white or feel hard?).
          *   **Why it Endures:** It isolates genuine puzzles about how perception relates to reality and the fundamental structure of properties. While most modern philosophers wouldn't accept the strong "two separate things" conclusion (preferring bundle theories, physicalist reduction, or substance-attribute models), the argument **forces engagement with these fundamental issues in a compelling way**. It's not just a trick; it points to a real philosophical tension.

  **Your Key Questions Answered:**

  1.  **Is your distinction real?** **Absolutely yes.** The White Horse argument is primarily **semantic/logical**, focused on the **relationship between names and their referents**. The Hard and White argument is primarily **epistemological/metaphysical**, focused on the **nature of perception and the ontological status of properties**. They are distinct maneuvers targeting different philosophical problems.
  2.  **Imposing Western Categories?** While Gongsun Long operated within the context of the "School of Names" (名家 *Mingjia*), concerned broadly with the relationship between language (*ming*), reality (*shi* 实), and disputation (*bian* 辩), your distinction reflects inherent differences in the *arguments themselves*. The semantic focus of "White Horse" and the perception/property focus of "Hard and White" are evident *within* the texts. Using modern analytical categories (semantics, epistemology, metaphysics) is a valid tool for *understanding* these differences, as long as we remain aware it's an interpretive lens. The arguments naturally lend themselves to this analysis.
  3.  **Which holds up as serious philosophy?**
      *   **White Horse:** Primarily of **historical and pedagogical interest** today. It's a clever demonstration of potential linguistic confusion, but its core claim doesn't withstand modern semantic analysis. It's largely viewed as a semantic artifact or a logical puzzle rather than a robust argument about reality.
      *   **Hard and White:** **Definitely holds up as a serious philosophical argument.** While its specific conclusion (properties are *completely* independent existents) is extreme and not widely accepted, it powerfully articulates fundamental and enduring problems in philosophy of perception, philosophy of mind (qualia, the binding problem), and metaphysics (the ontology of properties). It forces us to confront the gap between sensory experience and the nature of reality. Its core epistemological observation is undeniable, and its metaphysical challenge remains potent.

  **In Conclusion:** Trust your instincts. You've correctly identified a significant difference that many gloss over. The "White Horse" is a fascinating linguistic paradox, a product of its time focusing on naming. The "Discourse on Hard and White," however, delves into the perennial mysteries of how we perceive the world and what that world is fundamentally made of. It's the latter that continues to resonate as a profound and genuinely challenging piece of philosophy. Gongsun Long wasn't just playing a party trick twice; in the "Hard and White," he was grappling with questions that still puzzle us today. If you want to explore further, look into interpretations by scholars like Chad Hansen or A.C. Graham, who take the School of Names seriously within the framework of Chinese thought while also engaging with these universal philosophical issues.
