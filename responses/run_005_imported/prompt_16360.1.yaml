  Next, necessary existence as a positive property. Aquinas separated essence and existence, seeing existence as an act. Gödel treats necessary existence as a property, which Aquinas would likely reject as a category error. For Aquinas, necessary existence is about God's self-subsistence, not a predicate among others.

  Modal collapse is another point. If everything true becomes necessary, it eliminates contingency. Aquinas emphasized a contingent creation, so this collapse would undermine his worldview. He'd see it as a reductio ad absurdum against Gödel's axioms.

