answer: |-
  That's a brilliantly sharp observation about the Strawsons, and your question cuts right to the heart of the free will/moral responsibility debate. Let's break down the tension:

  1.  **Galen's Regress & the Demand for Universal Objectivity:**
      *   **Yes, Galen's argument, if sound, *logically* pushes toward the universal objective attitude.** If true moral responsibility (requiring ultimate self-creation) is impossible for *everyone*, then the foundation for reactive attitudes like resentment, indignation, and retributive blame simply vanishes. We *should* see everyone as Galen suggests: as complex natural systems whose behavior is ultimately the result of factors beyond their ultimate control (genetics, environment, luck). Blaming or resenting someone for their constitutive nature seems as irrational as blaming a hurricane. The "desert" required for retributive punishment evaporates.

  2.  **P.F.'s "Psychological Incapability" as Rebuttal:**
      *   **It's not a *logical* rebuttal to Galen's *metaphysical* claim.** Galen argues responsibility is *impossible*. Saying "we can't help feeling resentment anyway" doesn't make it metaphysically possible. It concedes Galen's point about the lack of ultimate responsibility *while* highlighting a crucial psychological reality.
      *   **It *is* a powerful *pragmatic/phenomenological* rebuttal to the *practical demand* for universal objectivity.** P.F.'s core point is that the objective attitude isn't just difficult; it's existentially unsustainable as a *total* framework for human interaction. His argument isn't merely "we find it hard," but that:
          *   Reactive attitudes are constitutive of our very concepts of personhood, relationship, meaning, love, friendship, and commitment. Trying to adopt the objective attitude universally would fundamentally change (or destroy) these forms of life.
          *   It's psychologically impossible *for beings like us* to maintain the objective stance universally. Our emotional responses are automatic and deeply ingrained. Suppressing them entirely isn't feasible without profound psychological cost or transformation (e.g., becoming profoundly detached, sociopathic, or utterly depressed).
          *   **Therefore:** Galen's logical conclusion leads to an existential *impasse*. While his logic might be sound *in the abstract*, it points toward a mode of existence that is psychologically impossible and existentially barren for human beings. P.F. argues we are *trapped* within the participant stance; it's our inescapable form of life. Insisting we *ought* to adopt universal objectivity is like insisting humans *ought* to fly without wings – it ignores our constitutive nature.

  3.  **The "Different Questions" Defense (Surviving the Objectivity Point):**
      *   **It *does* survive, precisely *because* of the psychological impossibility point.** The standard defense isn't just hand-waving; it highlights their distinct projects:
          *   **P.F. Strawson:** Asks, *"How does the practice of holding responsible actually function within human life, and what makes sense of our distinctions within it?"* He provides a *descriptive metaphysics* of our moral practices, grounded in our reactive nature. He explains *why* we exempt some (children, the insane) – because they lack the capacity for the participant stance relationships his framework depends on. His "never globally" claim is a statement about human psychology and social ontology, not a refutation of ultimate metaphysical impossibility.
          *   **Galen Strawson:** Asks, *"Is the *ultimate* kind of moral responsibility (requiring being *causa sui*) *metaphysically possible*?"* He argues it's not, regardless of determinism or our practices.
      *   **Why it survives objectivity:** Galen shows why, *from a God's-eye, abstract metaphysical view*, universal objectivity would be the rational stance. P.F. shows why, *from within the human form of life*, adopting that stance universally is impossible and destructive. Galen identifies a metaphysical truth *about* our condition; P.F. describes the psychological and social reality *of* our condition, which includes the inescapability of attitudes Galen's truth renders, strictly speaking, metaphysically unjustified. The conflict isn't *logical*; it's between a metaphysical conclusion and a phenomenological reality.

  4.  **Traction for Defending Retributive Punishment?**
      *   **P.F. Strawson:** **Provides significant, but qualified, traction.**
          *   **Pro:** He grounds retributive *sentiments* (resentment, indignation) in the core fabric of interpersonal relationships. Punishment, especially its expressive/condemnatory aspect, can be seen as an institutionalized, controlled form of the reactive attitudes. It affirms the victim's standing and the community's norms. He provides a framework for *why* we feel punishment is *fitting* for wrongdoing (it answers ill-will/disregard) and distinguishes it from mere management.
          *   **Con:** His framework *describes* the roots of retribution but doesn't necessarily *justify* its severity or specific forms. It shows why we *have* retributive impulses, not why acting on them institutionally in specific ways is *right*. It also operates entirely within the participant stance, leaving it vulnerable to Galen's critique that the whole stance rests on a metaphysical illusion. It justifies retribution *only if* we accept the participant stance as inescapable and valid *despite* its metaphysical fragility.
      *   **Galen Strawson:** **Undermines retributivism at its core.**
          *   His argument directly attacks the foundational concept of *desert* required for retributivism. If no one is truly deserving of blame in the ultimate sense, then no one deserves to suffer *because* they did wrong, purely for the sake of payback. Retributive punishment becomes, at best, a harmful expression of an understandable but ultimately irrational reactive attitude.
      *   **Do they wash out?** **Not entirely, but they create an unstable tension:**
          *   **P.F. gives you a *real* foundation *within human experience*:** He explains why retributive notions feel compelling, necessary, and deeply embedded in our moral psychology and social fabric. For practical legal theory focused on maintaining social relationships and norms, this is powerful.
          *   **Galen exposes its *metaphysical vulnerability*:** He relentlessly shows why, if we demand ultimate justification, retributivism (and moral responsibility itself) collapses. This creates a permanent unease for any retributivist who engages with the depth of the problem.
          *   **The Practical Path:** For defending retributive punishment *in practice*, P.F. provides the stronger traction, *if* one accepts that justification must be found *within* the human participant stance and its needs, not in ultimate metaphysical foundations. Galen forces the retributivist to acknowledge that their justification rests on accepting the participant stance *as is*, warts and all, knowing it lacks ultimate grounding. It becomes a pragmatic or existential choice, not a metaphysically secure one.

  **Conclusion:**

  *   **Consistency & Objectivity:** Galen's sound regress *does* logically demand universal objectivity. P.F.'s "psychological incapability" isn't a *metaphysical* rebuttal but a *phenomenological/pragmatic* one, highlighting why fulfilling that demand is existentially impossible for humans. We are condemned to live within the participant stance, even if Galen is right about its ultimate lack of foundation.
  *   **Retributive Punishment:** P.F. provides traction by grounding retributive sentiments and practices in the inescapable structure of human relationships. Galen fatally undermines the concept of desert required for pure retribution. They don't wash out; they create a dynamic where retributivism can be defended *only* from within the participant stance, with full acknowledgment of its metaphysical fragility exposed by Galen. The retributivist must argue that P.F.'s framework, despite lacking ultimate justification, is the only viable and necessary one for human social life, and that punishment is an essential expression within it. It's a defense based on human necessity, not metaphysical truth. For someone seeking an *ultimately* justified retributivism, Galen's argument is likely fatal.
