prompt: |-
  I sit on my museum's conservation committee. A mid-twentieth-century bronze figure in our collection has a failed internal armature and active bronze disease; the proposed treatment would, over several campaigns, excise and replace roughly two-thirds of the original metal with new sections cast from the sculptor's surviving plaster molds, leaving the piece visually and dimensionally indistinguishable from how it left the studio. The sculptor's estate maintains that the result still counts as 'the original bronze' for cataloguing and insurance purposes, since every replaced section follows the artist's own molds; one trustee argues that once most of the historical metal is gone we would in effect own an authorized replica rather than the object we accessioned, and that continuing to catalogue and insure it as an untouched original would misrepresent what we hold. Draft the committee's decision memo for next month's board meeting: recommend a concrete course of action -- proceed, decline, or proceed under specific cataloguing and disclosure conditions -- and engage seriously with the trustee's objection rather than treating standard conservation practice as though it already settles the question.
reasoning: |-
  Okay, the user is part of a museum conservation committee dealing with a complex ethical and practical dilemma. A mid-20th-century bronze sculpture has both structural failure (armature issues) and active bronze disease. The proposed treatment would replace about two-thirds of the original metal using the artist's original plaster molds. 

  The core conflict is philosophical: is this still "the original" after such extensive replacement? The artist's estate says yes because it follows the artist's molds, while one trustee argues it becomes an "authorized replica." The user needs a decision memo that doesn't just default to standard conservation practice but seriously engages the trustee's objection.

  Hmm... this touches on deep questions about authenticity in conservation. The standard approach might prioritize material authenticity, but here the material is mostly being replaced. The artist's estate's position emphasizes intentional authenticity - the artist's vision via their molds. The trustee is raising valid concerns about historical integrity and transparency.

  I should consider:
  - Practical aspects: Bronze disease is progressive and destructive. Without treatment, the piece deteriorates irreversibly. The armature failure means it can't even be displayed safely.
  - Ethical dimensions: Museums balance preservation of material, artist's intent, and historical context. Here all three are in tension.
  - Stakeholder perspectives: The estate has vested interest in maintaining "original" status (value, legacy), while the trustee represents institutional integrity.

  The memo needs to:
  1) Acknowledge the treatment is technically necessary to preserve the work
  2) Grapple openly with the authenticity question
  3) Propose a solution that preserves historical truthfulness without devaluing the conservation work

  Perhaps a middle path: proceed with treatment but with radical transparency in cataloguing and interpretation. Call it "the original work" but document the intervention extensively. The key is making the conservation history part of the object's story rather than hiding it.

  This satisfies conservation needs while honoring the trustee's concern about misrepresentation. It turns the intervention from something to conceal into part of the artwork's biography. The estate might still object, but this balances all concerns best.

  For the memo structure: start with factual background, then present both positions fairly, analyze the tensions, then recommend treatment with specific documentation protocols. Emphasize that authenticity isn't binary here - it's a composite of material, intention, and history.
answer: |-
  **MEMORANDUM**  
  **TO:** Board of Trustees  
  **FROM:** Conservation Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Treatment Recommendation & Authenticity Assessment for Mid-20th C. Bronze Sculpture (Accession #XXXX)  

  ### **I. Background**  
  The sculpture in question (Artist, Title, Date) suffers from two critical issues:  
  1. **Failed Internal Armature**: Compromising structural integrity.  
  2. **Active Bronze Disease**: Causing irreversible corrosion, threatening total loss if untreated.  
  The proposed conservation involves multi-stage excision of ≈65% original metal, replacing sections using the artist’s original plaster molds. The result would be visually and dimensionally identical to the piece as initially cast.  

  ### **II. Key Positions**  
  - **Artist’s Estate**: Argues the treated work remains "the original bronze," as replacements derive from the artist’s molds.  
  - **Trustee’s Objection**: Contends that replacing most historical metal reduces the object to an "authorized replica," misrepresenting provenance if catalogued/insured as original.  

  ### **III. Committee Analysis**  
  We acknowledge the Trustee’s objection as philosophically valid and central to our institutional ethics. Standard conservation practice (prioritizing structural stability and aesthetic coherence) does **not** inherently resolve questions of material authenticity. Key considerations:  
  - **Material Authenticity vs. Artist’s Intent**: While replacements honor the artist’s *design*, the original metal holds irreplaceable historical data (e.g., casting quirks, patina evolution, material composition).  
  - **Threshold of Replacement**: Replacing >50% of material fundamentally alters the object’s physical history. Even with artist-sanctioned molds, the result is a *hybrid*: part-historical artifact, part-contemporary fabrication.  
  - **Transparency Obligation**: Failing to disclose the scale of intervention risks erasing the object’s biography and misleading scholars, insurers, and the public.  

  ### **IV. Recommendation: PROCEED WITH TREATMENT UNDER STRICT CATALOGUING AND DISCLOSURE CONDITIONS**  
  **A. Treatment Approval**  
  The committee unanimously supports proceeding with conservation due to:  
  - The inevitability of total loss from bronze disease.  
  - The unique opportunity to use the artist’s original molds (ensuring formal fidelity).  
  - Ethical imperative to preserve the work’s *experiential* essence for public access.  

  **B. Mandatory Cataloguing & Disclosure Framework**  
  To address the Trustee’s concerns and maintain institutional integrity, we recommend:  
  1. **Revised Cataloguing Status**:  
     - Designate the object as: **"Artist, Title (Date), conserved [Year] with extensive inpainting/recasting."**  
     - **Do NOT** catalogue it as "untouched original." Specify in records: "≈65% original metal replaced using artist’s molds during 20XX conservation."  
     - Retain all excised metal (non-hazardous fragments) for archival/study purposes.  

  2. **Insurance & Valuation Adjustment**:  
     - Insure as a **conserved artwork with significant intervention**, not an "untouched original."  
     - Appraisal must reflect the post-treatment hybrid status (likely lower value than an unaltered original, but higher than a replica).  

  3. **Public Interpretation & Transparency**:  
     - Permanently display a plaque: "This work underwent major conservation in [Year] to address structural instability and corrosion. Approximately two-thirds of the bronze was recast using the artist’s original molds."  
     - Publish treatment documentation online (CT scans, treatment report, mold documentation).  
     - In exhibitions/publications, emphasize the sculpture’s complex biography as a case study in modern conservation ethics.  

  4. **Scholarly Access**:  
     - Grant researchers access to conserved work, archival metal samples, and conservation reports to study material evolution.  

  ### **V. Rationale for Hybrid Designation**  
  - **Honors Artist’s Legacy**: The molds preserve the artist’s formal intent, and the core narrative of the work survives.  
  - **Acknowledges Material Reality**: Rejecting "original" status respects the object’s altered physical history while avoiding misrepresentation.  
  - **Institutional Accountability**: This approach balances conservation necessity with scholarly rigor, aligning with our educational mission.  

  ### **VI. Conclusion**  
  While the Estate’s view prioritizes authorial intent, the Trustee rightly asserts that material authenticity carries irreplaceable historical weight. By proceeding with full transparency, we preserve the work’s aesthetic and educational value without obscuring its complex identity. This solution safeguards both the object and the museum’s credibility.  

  **Recommended Board Action:**  
  Approve treatment funding and adopt the proposed cataloguing/disclosure protocol.  

