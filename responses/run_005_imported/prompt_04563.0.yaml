  Okay, let me start by unpacking the user's query. They're fascinated by Good's theorem but notice real-world situations where more information leads to worse outcomes. They want an example where rational agents with free information end up worse off, and they want to see where the theorem's proof breaks down.

  First, I need to recall Good's theorem. It states that for a Bayesian agent, the value of information (VoI) is non-negative. The user sketched a proof: deciding without info picks the best average option, while with info, it's the average of best options per evidence, which can't be worse. 

  The user mentioned insurance markets where info sharing destroys deals. That hints at adverse selection. I remember Akerlof's "Market for Lemons" model. In that model, sellers know car quality; buyers don't. If buyers could get info, they'd only buy good cars, but sellers of bad cars exit, collapsing the market. Both sides lose when info is free but not yet revealed.

  Wait, but in that case, the info isn't free before the decision. The user wants a case where info is free but agents prefer it not exist. Rothschild-Stiglitz insurance model fits better. Insurers can't risk-rate, so they offer one premium. If insurers learn risk types, they charge high-risk more, low-risk less. But if low-risk find premium too high without info, they might not buy, leaving only high-risk, raising premiums further. 

  But here, the insurer gains from info. The user needs a case where all parties lose. Maybe a bilateral trade with interdependent values. Suppose Alice has a widget Bob wants. Alice's cost is $10, Bob's value is either $20 (high) or $0 (low), equally likely. Without info, expected surplus is $5. If Bob learns his value before deciding, he only buys if high, expected surplus $5. Same as before. 

  Not worse. Need a case where trade is beneficial but info prevents it. Suppose Bob's value is always above cost, but Alice doesn't know Bob's value. Without info, they trade at fixed price, say $15. Surplus $5 each. If Bob learns value is $11, he won't trade at $15. But if value is $19, he trades. Expected surplus lower? Alice's expected profit might be negative if she commits to price before knowing Bob's action. 

  Ah, the key is commitment. Without info, they can commit to trade no matter what. With info, Bob might back out if value is low, so Alice demands higher price, which might kill the deal. 

  The used car example. Alice sells car, cost $0 to her. Bob values it at $20 if good, $0 if bad. Equal chance. Without info, Bob pays expected value $10. Both get $10 surplus if we assume Alice values at $0. 

  If Bob gets free inspection before buying, he learns quality. If good, pays up to $20; if bad, pays $0. Expected payment $10. Same as before. Still no loss. 

  I need interdependent values. Suppose Alice knows quality, Bob doesn't. If Bob learns before buying, same as above. But if Alice learns before setting price, she charges $20 for good, $0 for bad. Bob pays $20 for good, gets $0 surplus; doesn't buy bad. Expected surplus for Bob: $10, same as before. Alice gets $20 for good, $0 for bad, average $10, same as without info. 

  Still no loss. The issue must be when the ability to act on info affects the equilibrium. Like in insurance, if insurers can price discriminate, low-risk get better deals, but if they couldn't, the pooling premium might be acceptable. But insurers gain from info. 

  The user's insurance example: info becoming public kills deals. That's the Hirshleifer effect. Suppose two farmers, each with crop subject to weather. Weather A or B, equally likely. Farmer 1 gets $100 if A, $0 if B. Farmer 2 gets $0 if A, $100 if B. Without weather info, they can insure each other: each pays $50 to the other if their crop fails. Expected utility higher with risk-sharing. 

  If they learn weather before deciding to insure, then if it's A, Farmer 1 has $100, Farmer 2 has $0. Farmer 1 won't pay Farmer 2 since no loss to cover. Similarly for B. No insurance occurs. Both are worse off without risk-sharing. 

  Expected utility without info: each has certain $50. With info, they have $100 or $0 with 50% chance, so higher risk. If utility is concave (risk-averse), expected utility is lower with info. 

  In this case, the info is free and correct. But after learning, they don't insure because no risk to share. The decision not to insure is rational per state, but ex-ante, they prefer not knowing. 

  Now, where does Good's theorem break? The theorem assumes the decision set is fixed. But here, the availability of the insurance contract depends on the information. Without info, they commit to a contract that pays in all states. With info, the contract isn't offered or is void in some states. 

  Good's proof relies on the agent choosing from the same set of actions regardless of info. But here, the actions available change with info. Without info, they can choose to "sign contract." With info, in state A, the contract is not beneficial for Farmer 1, so it's not chosen. The action "sign contract" is only available when they don't know the state. 

  So the key is that information can change the action space or the feasibility of commitments. Good's theorem doesn't account for strategic interactions or state-dependent constraints. 

  In the bilateral case, without info, they can commit to trade. With info, the option to enforce trade disappears because one party backs out. The action "trade" is no longer available in all states ex-post. 

  So the breakdown is in the assumption that the decision problem (available actions and consequences) remains constant regardless of what information is revealed. When information alters the game itself—like destroying the possibility of beneficial commitments—the premise fails.
answer: |-
  You've hit on a profound tension between a foundational theorem of rational decision-making and real-world strategic dilemmas. Good's theorem (formally: the expected value of sample information is non-negative for a Bayesian agent) *does* hold under its assumptions, but those assumptions are often violated in strategic or market settings. Here's a concrete example demonstrating how **rationally acting agents with free, accurate information can be worse off in expectation**, pinpointing where the theorem's logic breaks.

  ---

  ### **The Example: The Unraveling of Risk-Sharing Contracts**
  **Scenario:** Two farmers, Alice and Bob, each face independent but identically distributed crop risks next season.  
  - **States of the world:** Rainfall can be **Good** (probability 0.5) or **Bad** (probability 0.5).  
  - **Payoffs:**  
    - If rainfall is **Good**: Alice gets \$100, Bob gets \$0.  
    - If rainfall is **Bad**: Alice gets \$0, Bob gets \$100.  
  *(This symmetry simplifies the math; they have perfectly negatively correlated risks.)*  
  - **Utility:** Both are risk-averse with identical utility function \(U(\text{wealth}) = \sqrt{\text{wealth}}\).  

  #### **Case 1: No Information Available (Ex-Ante Contract)**  
  - Alice and Bob **commit to a contract BEFORE** learning rainfall outcomes:  
    - They agree to pool their harvests equally regardless of state.  
  - **Resulting wealth in every state:**  
    - Total wealth = \$100 (always), so each gets \$50.  
  - **Expected utility for each:**  
    \[
    EU_{\text{no-info}} = \sqrt{50} \approx 7.07
    \]

  #### **Case 2: Free Information Available (Ex-Post Decision)**  
  - A free, perfectly accurate rainfall forecast arrives **BEFORE** they decide on sharing.  
  - Alice and Bob now learn whether rainfall will be **Good** or **Bad** *before* choosing to share.  
  - **Rational behavior after learning the state:**  
    - If rainfall is **Good**: Alice gets \$100, Bob gets \$0. Alice has no incentive to share with Bob (she loses \$50). Bob can't force sharing.  
    - If rainfall is **Bad**: Alice gets \$0, Bob gets \$100. Bob has no incentive to share with Alice.  
  - **Result:** **No sharing occurs** in any state.  
  - **Expected utility for each:**  
    \[
    EU_{\text{info}} = 0.5 \times \sqrt{100} + 0.5 \times \sqrt{0} = 0.5 \times 10 + 0.5 \times 0 = 5
    \]

  #### **Comparison:**
  - \( EU_{\text{no-info}} \approx 7.07 \)  
  - \( EU_{\text{info}} = 5 \)  
  **→ Both are strictly worse off with the information!**  
  - **Expected wealth is identical** (\$50 per person in both cases), but the **loss of risk-sharing** due to information destroys utility under risk aversion.  

  ---

  ### **Why This is Rational and Information is "Free"**
  - **Rationality:** Agents update beliefs correctly (rainfall forecast is perfect) and maximize expected utility given their information. After seeing the state, refusing to share *is* optimal (giving away \$50 when you have \$100 reduces utility from 10 to \(\sqrt{50} \approx 7.07\), worse than 10).  
  - **Free information:** The forecast costs nothing and is perfectly reliable.  
  - **No irrationality:** No panic, misupdating, or behavioral biases. Purely Bayesian rationality + risk aversion.  

  ---

  ### **Where Good's Theorem Breaks Down**
  Recall your sketch of the proof:  
  > *"Deciding right now is like picking the best option on average, while waiting to see the evidence is like taking the average of 'best option for each thing you could've learned,' and that second number can never come out smaller."*  

  **The breakdown occurs at the phrase "best option for each thing"**—specifically, **what counts as an "option" changes when information arrives**. Good's theorem assumes the **set of available actions is fixed**, regardless of what information is revealed. In strategic or market settings, **information can destroy actions that were previously available**.  

  #### **The Failure in This Example:**
  1. **Without information:**  
     - The "action set" includes **binding commitments** (e.g., "sign a contract to share harvests unconditionally").  
     - This allows access to **Pareto-improving actions** (risk-sharing) that aren't available once information is revealed.  

  2. **With information:**  
     - Binding commitments are impossible *after* information arrives because agents know their payoffs.  
     - The action "share harvests equally" **vanishes from the choice set** in every state. Agents can only choose non-sharing actions.  
     - Good's theorem still holds *mathematically* for the reduced action set: given the state, not sharing *is* optimal. But the theorem doesn't account for the **disappearance of valuable actions** enabled by ignorance.  

  ---

  ### **Core Issue: Information Destroys Commitment Opportunities**
  This is a case of **strategic irreversibility**. The critical point is:  
  - **Ignorance enables cooperation:** Without information, agents can commit to actions that are ex-post suboptimal but ex-ante beneficial.  
  - **Information kills contracts:** When information arrives, the incentive to defect eliminates cooperative actions. This is why insurance markets "unravel" when risk information becomes available (e.g., genetic testing in health insurance).  

  Good's theorem assumes a **static action set**, but in multi-agent or market contexts, **information endogenously alters which actions are feasible**. The "value" being lost isn't in the Bayesian update itself—it's in the collapse of the institutional/strategic environment that allowed mutually beneficial actions to exist.  

  This is why real-world applications (insurance, financial markets, job markets) often legally restrict information flow (e.g., banning genetic testing for insurance) or enforce pooling—to preserve the actions that ignorance enables. Rationality isn't violated; the game itself changes.  

  If you want to explore further, this falls under the "Hirshleifer effect" (1971) or the economics of "contracting under asymmetric information." The key takeaway: **Good's theorem is robust for individual decisions with fixed actions, but not for games where information alters the rules.**
