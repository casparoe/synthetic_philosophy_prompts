answer: |-
  Here’s a focused argument against Dutch book arguments (DBAs) establishing probabilism as a requirement of *epistemic* rationality, centered on the **pragmatic-epistemic conflation**:

  ---

  ### **The Core Argument: Why DBAs Fail for Epistemic Rationality**
  1. **DBAs Only Prove Pragmatic Vulnerability**  
     DBAs show that if your credences violate the probability axioms, a bookie can craft bets guaranteeing a net loss *no matter which state of the world obtains*. This is a **pragmatic flaw**: you’re financially exploitable due to your betting dispositions. But *epistemic* rationality concerns how well your credences track truth, knowledge, or evidence—not whether they make you lose money in hypothetical wagers. Conflating these is a category error.

  2. **The Misleading Analogy: Beliefs vs. Betting Dispositions**  
     DBAs treat credences *as if they are* betting odds (via the "package principle"). But **epistemic rationality governs beliefs, not betting behavior**. You might have credences that are truth-directed (e.g., based on evidence) yet fail to align with betting quotients for reasons orthogonal to epistemic failure:  
     - **Risk aversion**: You may decline bets with positive expected value.  
     - **Non-instrumental goals**: You might value belief-accuracy independently of monetary outcomes.  
     - **Contextual factors**: Real-world betting involves transaction costs, deception, or moral constraints irrelevant to epistemic evaluation.  

  3. **Epistemic Rationality Can Demand Non-Probabilistic Credences**  
     Suppose you have overwhelming evidence that a fair coin is biased (e.g., 1000 heads in a row). A *non-probabilistic* credence (e.g., 0.99 heads, 0.99 tails) violates additivity but better reflects your evidence than any probabilistic alternative. If epistemic rationality demands *responsiveness to evidence*, this credence could be superior—even though it invites a Dutch book. DBAs penalize this as "irrational," revealing their pragmatic bias.

  4. **The Converse Dutch Book Theorem Doesn’t Save Epistemology**  
     Yes, probabilists avoid synchronic Dutch books. But this only proves that satisfying the axioms is *sufficient* for pragmatic coherence. It doesn’t show that violating them is *epistemically* defective. Consider:  
     - **Epistemic dilemmas**: In cases like the "lottery paradox," probabilism forces you to assign credence <1 to each of a set of propositions you know to be true collectively (e.g., "ticket *i* will lose"), while assigning credence 1 to their conjunction. Avoiding Dutch books here doesn’t resolve the *epistemic* tension—it’s a pragmatic patch for a doxastic problem.  
     - **Diachronic issues**: Updating via conditionalization avoids *diachronic* Dutch books, but epistemic rationality might require *violating* conditionalization (e.g., in learning from unreliable peers). DBAs prioritize money over truth.

  5. **The Burden of Proof: No Bridge Between Pragmatic and Epistemic**  
     Proponents of DBAs must explain why avoiding financial exploitation *entails* epistemic rationality. But:  
     - **No entailment**: Epistemic rationality could demand credences that sacrifice pragmatic coherence (e.g., believing truths at the cost of Dutch-book vulnerability).  
     - **No necessity**: If epistemic rationality *were* about avoiding exploitation, it would reduce to instrumental rationality for money-avoiders—yet we criticize beliefs as irrational even when they have no betting implications.  
     - **No sufficiency**: Probabilistic credences can be epistemically defective (e.g., ignoring new evidence) yet pragmatically unimpeachable.

  ---

  ### **Conclusion**
  DBAs successfully establish that probabilistic coherence is necessary for *pragmatic* rationality in betting scenarios. But they fail to show that probabilistic coherence is a requirement of *epistemic* rationality because:  
  - **Pragmatic exploitability ≠ epistemic defect**.  
  - **Epistemic goals (e.g., truth, evidence-responsiveness) can conflict with Dutch-book avoidance**.  
  - **DBAs presuppose a questionable link between belief and betting** that epistemic rationality need not honor.  

  Until proponents can bridge the gap between *avoiding guaranteed financial loss* and *holding epistemically justified beliefs*, DBAs remain arguments about wallets—not warrants for epistemic norms.
