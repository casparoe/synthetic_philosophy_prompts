answer: |-
  ## The Conditional Conundrum: Edgington vs. Stalnaker

  **Setting:** A worn armchair and a sleek ergonomic chair face each other across a coffee table littered with papers – Lewis's "Probabilities of Conditionals and Conditional Probabilities" prominent among them. **Eleanor Edgington** sips tea, her expression thoughtful. **Robert Stalnaker** leans forward, fingers steepled.

  **Eleanor Edgington (EE):** Robert, Lewis's proof is devastating... *if* you insist conditionals express propositions with truth values. It shows that equation – P(if A, C) = P(C|A) – is incompatible with standard probability theory applied to propositions. The only consistent escape is to deny the premise: conditionals *don’t* express propositions. They're devices for managing conditional *suppositions*, not bearers of truth.

  **Robert Stalnaker (RS):** Eleanor, that seems like throwing the baby out with the bathwater. The equation captures an *essential* intuition about how we evaluate conditionals. We *do* assess them as true or false in contexts: "If it rained, the streets are wet" *is* true if it rained and the streets are wet! Denying them truth conditions severs the vital link between meaning and truth. Lewis's proof doesn't doom truth conditions; it dooms the *universal* applicability of the equation. We need to restrict it carefully, using selection functions to model context.

  **EE:** Restrict it? That sounds like special pleading to dodge the bullet. Lewis showed that *if* conditionals have truth values *and* the equation holds generally, then P(C|A) must be a linear function of P(A) and P(C), which is absurd. Your 'restriction' feels like carving out exceptions wherever Lewis's proof bites, not a principled foundation. Why cling to truth values when they demonstrably force you to abandon the core probabilistic intuition in many cases?

  **RS:** Principled? The restriction arises directly from the *semantics*! My selection function f(w, A) picks the *closest* world where A is true. The probability P(A > C) is just the probability that C is true in *that* selected world. The equation P(A > C) = P(C|A) holds *only* when the selection function is well-behaved relative to the probability space – specifically, when f(w, A) is always within the set of A-worlds relevant for conditionalizing on A *in that context*. Lewis's proof assumes this holds universally across *all* partitions, which isn't required by the semantics. It fails when the partition interacts pathologically with the selection function.

  **EE:** "Pathologically"? You mean whenever Lewis's proof applies! You're essentially saying the equation holds *except* when it leads to triviality. That's not an explanation; it's a description of the problem. My view *explains* why the equation holds universally: because "If A, C" doesn't express a proposition whose probability is independent of P(C|A). Its probability *just is* P(C|A). There's no proposition for the probability calculus to get tangled up with in the first place. It dissolves the contradiction by removing one term.

  **RS:** Dissolves it? Or ignores the complexities of language? How does your 'no proposition' view handle *embeddings*, Eleanor? That's the perennial weak spot. Take negation: "It's not the case that if A, C." What does *that* mean for you? If "if A, C" has no truth value, how can it be negated? Does "Not (If A, C)" mean "If A, not C"? That clearly isn't always right. Or take disjunction: "Either if A, C, or if B, D." How do you assign a truth value to *that* complex proposition if its components lack truth values? Your semantics seems to leave these constructions fundamentally mysterious or forces awkward paraphrases that lose compositional meaning.

  **EE:** Compositionality *is* a challenge, I grant you. But not insurmountable. For negation: "Not (If A, C)" expresses the speaker's *rejection* of the conditional commitment P(C|A) is high. It might suggest P(C|A) is low, or that A is somehow improper to suppose. It's a speech act of denial directed at the conditional assessment itself. As for disjunction... "Either (if A, C) or (if B, D)" expresses a complex cognitive state: perhaps a preparedness to infer C *if* A is learned, *or* to infer D *if* B is learned, depending on which antecedent becomes salient or relevant. The truth conditions of the whole arise from the conditions under which one or the other conditional commitment is appropriately undertaken, not from the truth values of non-existent component propositions.

  **RS:** That sounds perilously close to saying the whole sentence is true just in case one of its conditional conjuncts would be *assertible* – which is dangerously circular and vague. More importantly, it abandons a core principle: the meaning of a complex sentence is a function of the meanings of its parts *and* the way they are combined. Your 'complex cognitive state' feels like a handwave when faced with the machinery of logic. Truth-conditional semantics provides a rigorous, compositional framework that your view struggles to replicate.

  **EE:** Rigor at the cost of empirical adequacy? Your framework preserves compositionality, but at what cost? You *lose* the universal link between the acceptability of a conditional and the corresponding conditional probability – the very intuition that motivated Adams and Lewis initially! You say the equation holds only under 'favorable' conditions defined by your selection functions. But that makes the *meaning* of the conditional hostage to these often opaque contextual parameters. How does the ordinary speaker know when P(If A, C) = P(C|A) holds? It seems your view replaces the elegant, intuitive probabilistic link with a complex, context-dependent apparatus that *sometimes* approximates it. My view keeps the core intuition pristine: assertability *is* conditional probability, full stop.

  **RS:** "Full stop" ignores the data! People *do* judge conditionals true or false independently of their current conditional probability assessment in complex embeddings or counterfactual scenarios. They *do* reason with negated conditionals and disjunctions of conditionals as if they have truth values. Your view requires a radical reinterpretation of vast swathes of linguistic practice and logical reasoning. My restriction of the equation isn't a dodge; it's a *prediction* of the semantics. The equation holds robustly in the core cases where the selection function aligns with the conditionalization context – which is most ordinary discourse. It breaks down precisely in the artificially constructed, partition-manipulating scenarios Lewis exploits in his proof, scenarios unlikely to arise naturally. That’s a *virtue*, not a vice. It shows the semantics is sensitive to context in the right way.

  **EE:** But Robert, that 'artificial' proof reveals a fundamental instability in the heart of your truth-conditional project. It shows that the proposition you assign to "If A, C" *cannot* generally have a probability equal to P(C|A) without collapsing the probability space. My view accepts the proof's conclusion gracefully: conditionals aren't in the propositional probability game. Your view has to constantly police the boundary between 'favorable' and 'unfavorable' contexts to avoid the collapse, and the criteria for that seem *post hoc* – defined by where the proof fails. Isn't the principled position to recognize that conditionals are a different logical animal?

  **RS:** And yours has to contort itself to handle embeddings that truth-conditional semantics handles with elegant simplicity. The proof is a paradox, Eleanor. Like all paradoxes, it exposes tensions in our intuitions and assumptions. My solution resolves the tension by refining the *truth conditions* (via selection functions) and recognizing the *contextual limitations* of the probabilistic equation. Yours resolves it by denying a core feature of meaning – truth-evaluability. I’ll take the refined truth conditions and the compositional power, even with the contextual restrictions. The burden is on you to show how your non-propositional view can genuinely account for the full logic of our language without resorting to stipulation or paraphrase that simply hides the propositional structure.

  **EE:** And the burden is on you to show that your 'favorable contexts' are anything more than the places Lewis's proof hasn't yet been applied! We both agree the equation captures something vital. I think it’s *so* vital it defines the meaning. You think it’s a contingent byproduct of favorable contexts. Until you give me a truly *principled*, *semantic* reason why those contexts are favorable beyond 'that's where the equation holds', I’ll maintain that ditching truth values is the cleaner, more honest solution to Lewis's challenge.

  *(Both fall silent, the weight of the other's challenge hanging in the air. The papers on the table seem no closer to a resolution.)*

  ## Key Pressed Weak Spots

  1.  **Stalnaker Presses Edgington on Embedding:** RS directly challenges EE's ability to handle negation and disjunction compositionally without truth values. EE's responses ("rejection of commitment," "complex cognitive state") are seen as vague and non-compositional compared to truth-conditional semantics.
  2.  **Edgington Presses Stalnaker on "Principled Restriction":** EE argues RS's restriction of the equation to "favorable contexts" defined by selection functions feels like an *ad hoc* fix to avoid Lewis's proof, rather than a deep semantic principle. She questions how speakers know when the context is "favorable."
  3.  **Edgington on Loss of Core Intuition:** EE argues RS sacrifices the universal, intuitive link between assertability and conditional probability (P(If A, C) = P(C|A)), which her view preserves perfectly. RS counters that his view preserves it robustly in ordinary contexts.
  4.  **Stalnaker on Empirical Adequacy:** RS argues EE's view cannot account for the way speakers *do* treat conditionals as truth-evaluable, especially in embeddings, without radical reinterpretation of linguistic practice.
  5.  **Edgington on the Proof's Significance:** EE sees Lewis's proof as a fundamental demonstration that truth values are incompatible with the equation, making her solution necessary. RS sees it as a paradox highlighting the need for context-sensitive truth conditions, making his solution sufficient.
