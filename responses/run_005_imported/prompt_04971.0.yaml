answer: |-
  ## Hospital Ethics Committee Opinion: Deferred Disclosure of Huntington's Disease Genetic Test Results

  **Case Summary:** Patient at 50% risk for Huntington's disease (HD) has completed pre-test counseling and blood draw, but requests indefinite deferral of disclosure of the test result. The committee is divided regarding whether this request should be honored, with arguments centered on the formal value-of-information theory (Good's theorem) versus the "right not to know."

  **Committee Recommendation:** The committee **recommends honoring the patient's request for indefinite deferral of disclosure** under the current circumstances, subject to the following specific safeguards and limitations:

  1.  **Affirmation of Deferral:** The patient's explicit request to defer disclosure is valid and shall be respected. The result will be securely stored but withheld until the patient initiates disclosure.
  2.  **Time-Limited Review Mandate:** Deferral is not absolute. The patient will be contacted by the genetics service **every 24 months** to:
      *   Reconfirm their deferral preference.
      *   Re-offer comprehensive counseling to discuss the implications of continued deferral vs. disclosure.
      *   Provide updated information on HD research/support resources.
  3.  **Explicit Destruction Option:** At each review point, the patient will be explicitly offered the option to **permanently destroy the sample and result without disclosure**, definitively exercising their "right not to know."
  4.  **Clear Pathway to Disclosure:** The patient retains the right to request disclosure at any time, subject to standard post-test counseling protocols.

  **Analysis & Limits of the Value-of-Information Argument:**

  The argument that a rational patient can only gain, in expectation, from having access to the information (as per Good's theorem), while formally correct *under its specific assumptions*, breaks down in this clinical context in several crucial ways, justifying our recommendation:

  1.  **Violation of "Cost-Free Evidence" Assumption:** Good's theorem assumes evidence is cost-free. **Knowing one possesses potentially devastating information incurs significant, unavoidable psychological costs, even if one chooses not to access the *specific content*.** The mere existence of the known result creates an "information burden" – a state of knowing you know something life-altering but haven't accessed it. This burden can manifest as chronic anxiety, hypervigilance, altered life planning under uncertainty, and relational strain. Deferral aims to *avoid* imposing this specific burden.
  2.  **Irreversibility of Knowing vs. Knowing Content:** Good's theorem treats the decision to "obtain evidence" as binary. However, **the critical irreversible step here is *knowing the test result exists*.** Once the patient knows a definitive result is stored and available, the state of pure pre-test uncertainty is permanently lost. Choosing *not to look* at the result is fundamentally different from never having generated it or having it destroyed. The value-of-information argument conflates "having the option to know" with "knowing the option exists," ignoring the psychological cost of the latter state. The "right not to know" protected by deferral is, in essence, the right to *avoid this irreversible state of knowing-you-know*.
  3.  **Threat to Option Value:** The health economist's framing ("gain from information she stays free to ignore") assumes the option to know retains full value indefinitely. However, **the psychological burden of *knowing the result exists* can actively diminish the patient's future capacity to make a truly free and rational choice about disclosure.** The anxiety associated with the "loaded" knowledge may pressure some patients into premature disclosure to relieve the burden, while paralyzing others from ever accessing the information, effectively destroying the value of the option over time. Deferral (with destruction option) preserves the *true* option value by preventing this corrosive burden.
  4.  **Context of Incurable Disease:** Good's theorem is neutral regarding content. The **unique nature of an incurable, late-onset neurodegenerative disorder like HD radically alters the utility calculus.** The potential disutility of knowing a positive result (profound psychological distress, impact on identity/relationships, potential discrimination) is exceptionally high and highly individualized. Rational actors can legitimately assign *negative utility* to the state of possessing (even if not accessing) a positive result. Standard VoI models often poorly capture these profound non-instrumental utilities and disutilities related to identity and existential well-being.
  5.  **Autonomy as Temporal and Contextual:** Respecting autonomy requires acknowledging that patients are not static rational actors but individuals whose values, coping capacities, and life circumstances evolve. Deferral respects the patient's **current autonomous judgment** that *now* is not the right time to enter the state of knowing-a-result-exists. Mandating an immediate "once and for all" decision about disclosure forces a choice under conditions the patient has explicitly judged unfavorable, disregarding their temporal autonomy. The review process respects *future* autonomy by ensuring continued access to support and the option to change course.

  **Conclusion & Scope:**

  This recommendation upholds the core ethical principle of respect for patient autonomy by honoring the specific request to avoid the irreversible state of "knowing a definitive result exists." It acknowledges the limitations of applying a pure value-of-information argument to contexts involving irreversible knowledge acquisition, profound psychological burdens, and incurable conditions where non-instrumental disutilities are paramount. The mandated reviews ensure the patient retains future autonomy and access to support while preventing indefinite limbo without engagement.

  **Applicability to Future Cases:** This framework (deferral + mandatory review + destruction option) is specifically recommended for predictive genetic testing for **untreatable, severe, adult-onset disorders** (like HD, certain prion diseases, some familial dementias/FAD) where the psychological burden of knowing a result exists is particularly high and the "right not to know" is a well-established ethical norm. It may not be appropriate for treatable conditions, childhood-onset disorders, or carrier testing, where the value-of-information calculus and ethical weight of deferral differ significantly. Each case requires careful consideration of disease characteristics, treatability, and the nature of the potential burdens.

  **Vote:** Approved by Majority Vote of the Ethics Committee.  
