  For the separateness question, I'll force a choice between "only blocks aggregation" and "affirms positive indifference." Follow-up: if she says coin tosses are required, ask why not let agents choose arbitrarily - wouldn't that also respect persons? This exposes if Taurek's equality is procedural or substantive.

  Parfit's point is subtle - saving someone benefits them regardless of aggregates. Taurekians might counter that the "benefit" only matters if we have reason to provide it. Follow-up should challenge whether "no duty to benefit more people" follows from separateness alone.

