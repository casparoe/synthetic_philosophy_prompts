answer: |-
  Here’s the strongest possible case for your friend’s position, arguing that Lewis prematurely dismissed his "sloppy thinking" hypothesis. The core contention is that the **absence of explicit complaints about fines’ vulnerability to substitution** is entirely consistent with the hypothesis and carries minimal evidential weight against it. Below is a systematic breakdown of why Lewis’s retraction is unjustified:

  ### 1. **Pragmatic Acceptance ≠ Normative Endorsement**  
     Lewis assumes that if fines’ substitutability were truly problematic, we would hear explicit objections. But this ignores how **practical necessity shapes discourse**. Fines involve *fungible resources* (money), making enforcement of non-substitution logistically impossible without draconian surveillance (e.g., tracking the source of every payment). Society tolerates substitution not because it is morally innocuous, but because alternatives are unworkable.  
     - **Why silence persists:** People don’t complain about inevitable realities. We accept airport security delays without endorsing them as ideal; similarly, we accept fine substitution as a practical concession, not a virtue. Complaints arise only when problems are *actionable*—and here, they aren’t.  

  ### 2. **Compartmentalization of Moral Intuitions**  
     The "sloppy thinking" hypothesis relies on a cognitive sleight-of-hand: the *metaphorical* slide from "debt" (fines) to "debt of punishment" (penal substitution). But this slippage occurs subconsciously, meaning its origins are **opaque to everyday reasoning**.  
     - **Why silence persists:** People intuitively distinguish fines from prison terms without scrutinizing *why*. The metaphor’s influence is stealthy: it doesn’t generate outrage about fines because the problematic linkage only surfaces when extending the logic to other punishments (e.g., the Atonement). We reject prison substitution *despite* the metaphor, not because we’ve diagnosed its source.  

  ### 3. **Absence of Salient Harm**  
     Lewis expects complaints about fines’ "abuse," but substitution rarely causes visible social damage. Unlike prison substitution (which would undermine deterrence/retribution), paying others’ fines lacks dramatic consequences:  
     - The state still receives funds.  
     - The offender still bears *some* cost (e.g., social shame, lost time).  
     - No innocent person is visibly brutalized (as with wrongful imprisonment).  
     - **Why silence persists:** People complain when harms are vivid and personal. Fines’ substitutability causes diffuse, systemic distortion (enabling sloppy metaphors) but no acute injury. We ignore what doesn’t scream.  

  ### 4. **The Debt Metaphor Is Too Entrenched to Question**  
     Monetary payments are foundational to modern economics and law. The idea that "debts can be paid by third parties" is normalized far beyond fines (e.g., loans, taxes, contracts). This creates a **conceptual blind spot**:  
     - **Why silence persists:** We no more question paying others’ fines than we question paying others’ restaurant bills. The practice is woven into the fabric of exchange-based societies. Critiquing it would feel like critiquing currency itself—an abstraction too deep for daily discourse.  

  ### 5. **Institutional Inertia and Privilege**  
     Fine substitution often benefits the powerful (e.g., wealthy parents paying children’s penalties). Those harmed by the metaphor (e.g., communities advocating for restorative justice) lack cultural leverage. Meanwhile, institutions profit from fines as revenue streams, disincentivizing scrutiny.  
     - **Why silence persists:** Complaints require awareness + power. The groups most affected by penal substitution (e.g., reformers, theologians) focus on extreme cases (prison, death penalty), not fines. The privileged have no incentive to protest a system that serves them.  

  ### Conclusion: Lewis’s Error of Evidential Expectation  
  Lewis treats the missing complaint as a "smoking gun" against the sloppy thinking hypothesis. But this assumes moral discourse is perfectly responsive to latent philosophical problems. In reality:  
  - **Unavoidable practices** breed resignation, not outrage.  
  - **Cognitive metaphors** operate beneath conscious awareness.  
  - **Structural harms** evade scrutiny without visible victims.  
  - **Hegemonic norms** silence alternative perspectives.  

  The absence of complaints is not evidence against the hypothesis—it’s precisely what the hypothesis *predicts*. Sloppy thinking thrives in the quiet corners of accepted practice, where inconvenient truths go unspoken because they seem futile, obvious, or irrelevant to daily life. Lewis’s insight was sound; his retraction was an unforced error.  

  **Your friend’s position holds**: The sloppy thinking hypothesis remains the best explanation for the asymmetry, and its stealthy nature ensures we wouldn’t hear the complaints Lewis expects.
