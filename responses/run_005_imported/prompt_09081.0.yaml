  The moral arguments: The company paid for the employee's time, so any output during that time belongs to them. But the solution isn't a trade secret or unique. The user didn't steal code or documents; they're reimplementing a concept. Also, the idea's obviousness matters—if it's a common approach, then claiming ownership is weaker.

  Another angle: the former teammate's perspective. They might feel that the user is taking credit for collective effort or undermining the company's investment. But since the solution wasn't formalized, it's not like taking proprietary code.

  Balancing fairness: The user has a right to use their expertise, but the company funded the initial development. Yet, preventing the user from using general problem-solving skills could hinder their career. If the solution is truly obvious, then it's part of the engineer's skill set, not a company asset.

  Possible resolutions: Modifying the approach enough to be distinct, acknowledging the inspiration, or ensuring no direct replication. The user's current project is separate, so as long as they're not harming the previous company, it might be acceptable.

  I should check if the user's deeper concern is about guilt or conflict with the former colleague. They might want validation that their actions are ethical to alleviate guilt or to respond to the teammate. Also, ensuring they don't damage professional relationships.

