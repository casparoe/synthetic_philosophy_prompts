  First, I need to break down the key elements. The solution was created during paid time, but not documented or patented. The user thinks it's something any decent engineer might come up with. They left the company and are now using it in their side project. The teammate objects, arguing that since the company paid for solving that problem, the solution belongs to them.

  The user mentioned avoiding legal aspects, so focusing on ethics. The core question is about ownership of ideas versus physical tools. They compare it to taking home a physical tool built on the job, which might be seen as theft. But ideas are intangible. So, is the idea owned by the company or the individual?

