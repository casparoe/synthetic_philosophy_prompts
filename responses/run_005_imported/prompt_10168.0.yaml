prompt: |-
  I'm teaching a graduate seminar this term on practical reason, and this week's session sets Bernard Williams's "Internal and External Reasons" alongside Book 2 of Hume's Treatise of Human Nature, on the standard assumption that Williams's internalism — an agent has a reason to act only if there is a "sound deliberative route" from that agent's existing "subjective motivational set" to the action — is essentially a descendant of Hume's claim that reason alone cannot move the will. While drafting my lecture notes I reread the relevant stretch of the Treatise more slowly than usual, and I've argued myself into a difficulty about it that I'd rather sort out with you than discover live in front of twelve second-year students.

  Here is the passage (Treatise 2.3.3.4, 6–7; I've cut one clause for length, marked with [...]):

  "Reason is, and ought only to be the slave of the passions, and can never pretend to any other office than to serve and obey them.

  "What may at first occur on this head, is, that as nothing can be contrary to truth or reason, except what has a reference to it, and as the judgments of our understanding only have this reference, it must follow, that passions can be contrary to reason only so far as they are accompany'd with some judgment or opinion. According to this principle, which is so obvious and natural, 'tis only in two senses, that any affection can be call'd unreasonable. First, When a passion, such as hope or fear, grief or joy, despair or security, is founded on the supposition of the existence of objects, which really do not exist. Secondly, When in exerting any passion in action, we chuse means insufficient for the design'd end, and deceive ourselves in our judgment of causes and effects. Where a passion is neither founded on false suppositions, nor chuses means insufficient for the end, the understanding can neither justify nor condemn it. [...] In short, a passion must be accompany'd with some false judgment, in order to its being unreasonable; and even then 'tis not the passion, properly speaking, which is unreasonable, but the judgment.

  "The consequences are evident. Since a passion can never, in any sense, be call'd unreasonable, but when founded on a false supposition, or when it chuses means insufficient for the design'd end, 'tis impossible, that reason and passion can ever oppose each other, or dispute for the government of the will and actions. The moment we perceive the falshood of any supposition, or the insufficiency of any means our passions yield to our reason without any opposition. I may desire any fruit as of an excellent relish; but whenever you convince me of my mistake, my longing ceases."

  My difficulty is this. A few lines before this passage, Hume's stated thesis is unconditional: reason "can never oppose passion in the direction of the will." Yet what he goes on to describe looks like exactly that kind of opposition — a passion that would otherwise have issued in action is extinguished once the understanding corrects the belief it depended on, and the fruit example reads like reason redirecting the will, not like a passion that remains fully in command while reason merely ministers to it. So I'd like your help with two connected points. First, is there a way of construing "yield to our reason without any opposition" that preserves the letter of the slave thesis — reason having, in itself, no power to alter what we want or do — or does the passage in fact concede real, if narrowly circumscribed, motivational efficacy to reason, contrary to Hume's own announced conclusion? Second, whichever reading you favor, what should we make of the fact that Williams's internalism relies on this same manoeuvre — an internal reason claim can be defeated or revised by correcting the agent's factual or instrumental beliefs, without appeal to any external reason — to answer the standard complaint that internalism can't make sense of an agent having reason to revise a deeply mistaken end? Does Hume's example show that this belief-correcting move was internalist-respectable all along, or does it show that the move smuggles in more than a strict internalist is entitled to?
reasoning: |-
  Okay, let me unpack this user's query carefully. They're teaching a graduate seminar on practical reason, specifically comparing Bernard Williams' internalism with Hume's Treatise Book 2. The core tension they've noticed in Hume's text seems genuinely troubling - that famous "slave of the passions" declaration appears contradicted by Hume's own example where reason seemingly overrules a passion (the fruit desire).

  Hmm, the user's credentials shine through here - they're clearly deeply read in both texts, having caught a nuance many miss. Their anxiety about presenting this live to grad students is palpable. Rightly so - this is exactly the sort of textual puzzle that could derail a seminar if not handled deftly. 

  First, I need to reconcile Hume's apparent contradiction. The key lies in how Hume defines "reason" strictly as instrumental calculation. When he says passions "yield to reason," it's not reason motivating directly, but rather the passion self-destructing because its cognitive scaffolding collapsed. Like realizing the delicious fruit you crave is actually rotten - the craving doesn't get overpowered, it just vanishes. That preserves the slave thesis technically, though it feels like cheating.

  Ah, but then Williams! His internalism leans hard on this same move - correct factual/instrumental beliefs to revise reasons without external inputs. The user's brilliant question: does Hume's example validate Williams or expose the move as question-begging? Tricky. Williams needs belief-correction to handle irrational ends, but if the motivational set (S) includes contingent beliefs, fixing them might not truly revise S itself. Yet calling this "smuggling" seems harsh - it's more like internalism's necessary machinery.

  The user's teaching context matters here. For grad students, I'd emphasize how this tension reveals internalism's core vulnerability: its dependence on the S-set's existing materials. Williams' "sound deliberative route" only works if the agent has some latent dissatisfaction with their false beliefs - otherwise, why would correcting beliefs change anything? Hume's fruit example works because the desire depends entirely on that false belief. But what about deeper irrationalities? 

  This connects to the user's implied worry about internalism's limits. If a racist's prejudice isn't belief-based but affective, belief-correction alone won't budge it - and internalism struggles there. Yet Williams would likely argue that if no sound route exists from their actual S-set (including that affective commitment), they truly have no reason to change. That's the hard pill internalism forces us to swallow.

  For seminar flow, I'd suggest structuring this as: 1) Dissect Hume's apparent contradiction 2) Show how belief-correction preserves his thesis technically 3) Map to Williams' parallel move 4) Pose the challenge: is this enough to handle all irrationality? 5) Debate whether internalism's constraints are features or bugs. The fruit example makes a perfect pivot between texts.
answer: |-
  This is an excellent tension to notice—one that reveals deep complexities in both Hume and Williams. Let's break down your two questions systematically:

  ### 1. Reconciling Hume's "Slave Thesis" with the Passion "Yielding to Reason"
  Hume’s claim that passions "yield to reason without any opposition" **does not violate his "slave thesis"** when understood within his strict definitions. Here’s why:

  - **Reason’s Role is Purely Instrumental**: For Hume, reason deals exclusively with relations of ideas (logic/math) or matters of fact (empirical beliefs). It has *no independent evaluative content*. When reason "corrects" a passion (e.g., showing the desired fruit doesn’t exist or tastes bad), it isn’t supplying a *new* motive or norm. It’s merely adjusting the *cognitive conditions* under which a pre-existing passion operates. The passion "yields" because its *own object* has been negated—not because reason has imposed a contrary desire.  
    *Example*: Your craving for fruit depends on the belief "this fruit is delicious." When reason falsifies that belief, the craving loses its object and dissolves—like a shadow vanishing when light hits it. No "opposition" occurs; the passion self-extinguishes.

  - **Passions are Belief-Dependent**: Hume notes passions become "unreasonable" *only* when coupled with false beliefs (e.g., hope for a nonexistent object). Correct the belief, and the passion ceases *on its own terms*. Reason isn’t "commanding" the will; it’s removing faulty fuel from the engine of passion. The will remains governed solely by passions—now accurately informed.

  - **The "Slave" Metaphor Holds**: Reason serves the passions by ensuring they align with reality. A slave who warns, "Master, the bridge you’re crossing is rotten!" isn’t seizing control—they’re enabling the master’s *own goal* (not falling). Similarly, reason’s corrections serve the passion’s *immanent aim*.

  **Verdict**: Hume’s text is consistent. Reason lacks *inherent* motivational power but can *indirectly* alter actions by updating the beliefs on which passions depend. No "opposition" means no *independent* force countering passion.

  ---

  ### 2. Williams’ Internalism and Hume’s Belief-Correction Manoeuvre
  Williams explicitly credits Hume as a precursor (*"Internal Reasons and the Obscurity of Blame"*), but your worry about "smuggling" is astute. Let’s dissect:

  - **Williams’ Parallel Move**: For Williams, an agent has a reason to φ iff there’s a "sound deliberative route" from their *existing* "subjective motivational set" (S) to φ-ing. Correcting false beliefs (e.g., "This fruit is delicious" → "It’s rotten") is part of "sound deliberation," revising the agent’s *instrumental* or *evaluative* premises without importing *external* norms. This handles cases like Hume’s fruit—or a person who "wants to drink petrol" because they falsely believe it’s gin.

  - **Does This Preserve Internalism?**  
    **Yes**, *if* the corrected belief is purely factual/instrumental (e.g., "Petrol is flammable"). Revising it doesn’t add new motives to S; it realigns S with reality. The *source* of motivation remains internal (e.g., "I don’t want to drink poison").  
    **No**, *if* the "belief" is actually a *disguised evaluation* (e.g., "Racism is justified"). Calling this a "false belief" implies an *external* norm (e.g., racial equality). Williams would resist this, insisting even moral errors must be critiqued via the agent’s *own* S (e.g., latent commitments to consistency or empathy).

  - **Hume’s Example: Validation or Smuggling?**  
    - **Validation**: Hume shows belief-correction needs no external norms. The fruit-lover’s S contains "desire for pleasure"; correcting "this fruit is pleasant" to "it’s foul" engages *only* their existing aversion to displeasure.  
    - **Smuggling?**: The worry arises when "false beliefs" include *evaluative* errors (e.g., "Torturing innocents is fun"). For Williams, if *no element in S* opposes torture (e.g., no empathy, no desire to avoid others’ pain), the agent has *no internal reason* to stop. Calling their enjoyment "unreasonable" would require external norms—precisely what internalism rejects.  
      → **Thus, Hume’s move works only for *non-evaluative* errors**. Williams uses it similarly, but its limits expose internalism’s inability to critique *perverse evaluations* without smuggling in externality.

  ---

  ### Teaching Recommendation: Frame the Debate
  In your seminar, pose this dilemma:  
  - **Hume/Williams Symbiosis**: Belief-correction is a powerful internalist tool for *instrumental* irrationality (Hume’s fruit, Williams’ petrol-drinker).  
  - **The Frontier Challenge**: Can internalism handle *evaluative* irrationality (e.g., someone who enjoys causing pain *knowing it causes pain*)?  
    - Williams says *no*: If their S contains no conflict, they have no reason to change.  
    - Critics (e.g., externalists like Parfit) say *yes*—but only by appealing to objective values, betraying internalism.  

  **Key Textual Nuance**: Note Hume’s *second* unreasonableness condition ("choosing insufficient means") is purely instrumental. His silence on *evaluative* errors suggests he’d agree with Williams: if you *truly* desire evil for its own sake (no false beliefs), reason is powerless to stop you. This sharpens the internalist/externalist divide.

  This tension isn’t a flaw but the *provocation* that makes both Hume and Williams indispensable to practical reason. Your students will relish the puzzle.
