answer: |-
  ## MEMORANDUM  
  **TO:** Capital Planning Committee Members  
  **FROM:** [Your Name], Member, Capital Planning Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Discount Rate Methodology for Long-Term Capital Projects (e.g., Seawall Proposal)  

  The upcoming vote on the $30M seawall proposal, and our broader mandate to establish a consistent discounting approach, hinges critically on the discount rate. As noted, divergent views exist: Finance advocates for our municipal bond rate (~5%), while the Resiliency faction proposes a near-zero rate. Both positions face legitimate critiques regarding their theoretical foundation versus outcome convenience.  

  This memo recommends adopting a **modified Social Discount Rate (SDR) approach**, explicitly distinguishing between **Financial Feasibility** and **Social Value**, and utilizing a **declining long-term rate**. The proposed method addresses the core ethical concern about discounting the future while respecting the high-discount argument regarding opportunity cost and uncertainty.  

  ### 1. Acknowledging the High-Discount Argument (Finance Position)
  The use of the municipal bond rate (~5%) is not ethically indefensible *in a specific context*. Its strongest justification is **Opportunity Cost of Capital**:
      *   **Resource Scarcity:** $30M spent on the seawall is $30M *not* spent on other pressing town needs (schools, roads, emergency services, tax relief). The bond rate reflects the market's assessment of the return required to justify diverting capital *today*.
      *   **Risk & Uncertainty:** As argued, the distant future (80+ years) is profoundly uncertain. Technological change, shifting shorelines, or unforeseen alternatives could render the seawall obsolete or less valuable. A higher rate inherently builds in a premium for this uncertainty – it’s not *just* "impatience" but a hedge against potentially wasted resources.
      *   **Wealthier Future Generations:** Assuming continued economic growth (historically ~1-3% per capita), future residents will likely be significantly wealthier than we are. Spending scarce resources today to benefit a much richer population tomorrow may be an inefficient allocation, especially if those resources could alleviate hardship *now*. This is a core tenet of standard cost-benefit analysis.

  **Critique:** Using the bond rate *alone* for social infrastructure with multi-generational benefits fundamentally misapplies a *financial* metric to a *social welfare* question. It ignores the unique, irreversible nature of climate adaptation and the ethical obligation to avoid imposing catastrophic costs on future citizens due to our inaction. It risks systematically undervaluing long-term resilience.

  ### 2. The Case for a Lower Social Rate (Resiliency Position)
  A near-zero rate emphasizes **Intergenerational Equity**:
      *   **Avoiding Discrimination:** A "pure" time preference (valuing a dollar today more than a dollar tomorrow simply because it's *today*) *is* difficult to ethically justify when the beneficiaries are different people (future generations). Their welfare matters equally in principle.
      *   **Irreversibility & Catastrophic Risk:** Climate impacts like sea-level rise pose existential, irreversible threats. Failure to invest adequately in adaptation transfers potentially catastrophic costs and risks to future residents who had no say in the decision. A low rate better captures the long-term social cost of *inaction*.
      *   **Market Imperfections:** Financial markets are notoriously short-sighted and struggle to price century-scale risks. Relying solely on market rates fails society's long-term interests.

  **Critique:** A rigid near-zero rate ignores genuine opportunity costs and uncertainty. It risks over-investing in very long-term projects at the expense of demonstrable current needs, potentially violating our fiduciary duty to *current* residents.

  ### 3. Recommended Approach: A Modified Social Discount Rate with Declining Long-Term Rate
  To reconcile these valid concerns, I propose we adopt a **two-component framework**:

  1.  **Financial Feasibility Threshold (Bond Rate):** Projects must demonstrate they are financially feasible *at the town's marginal cost of capital (currently ~5%)*. This ensures we are not committing to projects we cannot afford or that would crowd out other essential investments. It respects the opportunity cost argument.

  2.  **Social Value Assessment (Modified SDR):** **Simultaneously**, evaluate the project's *social net present value* using a **lower, explicitly justified Social Discount Rate (SDR)**. This rate should be derived using the **Ramsey Formula framework**:
      > **SDR = ρ + η * g**
      *   **ρ (Pure Time Preference):** **Recommendation: 0.1%.** This minimal rate acknowledges a tiny probability of civilizational catastrophe (justifying Owen's point that Stern's approach isn't "pure" impatience), not discrimination against the future. It is *not* zero, respecting uncertainty.
      *   **η (Elasticity of Marginal Utility of Consumption):** **Recommendation: 1.0.** (Moderate aversion to inequality). This reflects the judgment that a dollar is worth more to a poorer person (us now) than a richer one (future generations), supporting a *moderate* discount for growth.
      *   **g (Per Capita Consumption Growth Rate):** **Recommendation: Projection-based, ~1.0-1.5% long-term.** (Reflects realistic, potentially cautious, expectations for sustainable growth).
      > **Calculated SDR ≈ 0.1% + (1.0 * 1.0-1.5%) = 1.1% - 1.6%**

  3.  **Declining Rate for Very Long Horizons:** To further address deep uncertainty and the ethical weight of the far future, **apply a *declining* discount rate schedule** (e.g., 1.5% for 0-50 years, 1.0% for 50-100 years, 0.5% for 100+ years). This methodologically incorporates the intuition that while the near future is more knowable, the welfare of the distant future shouldn't be discounted into irrelevance.

  ### 4. Decision Rule & Application to the Seawall
  *   A project like the seawall must pass **both** the Financial Feasibility test (~5%) **and** demonstrate significantly positive Social Net Present Value using the Modified SDR (starting ~1.5%, declining).
  *   **For the Seawall:** Preliminary analysis suggests that while the project likely *fails* strict financial feasibility at 5% over 80 years, it likely generates substantial *positive social value* under the Modified SDR/Declining Rate approach, justifying its consideration as a critical, long-term resilience investment. A final vote would require full analysis under both metrics.
  *   **Going Forward:** Adopt this two-track, Modified SDR with Declining Long-Term Rate as our standard methodology for *all* capital projects, particularly those with impacts beyond 30 years. This provides consistency, transparency, and balances ethical imperatives with fiscal reality.

  ### Conclusion
  Choosing a discount rate involves fundamental value judgments about time, risk, equity, and efficiency. The high-discount argument based on opportunity cost and uncertainty is powerful and must constrain our spending. However, it is insufficient alone for intergenerational projects where market rates fail. The recommended framework provides a principled, transparent, and balanced method. It uses the bond rate as a necessary financial guardrail while employing a justified, lower social rate to ensure we adequately value the welfare of future residents facing the long-term consequences of our decisions today.

  **Recommendation:** Adopt the two-component framework (Financial Feasibility at Bond Rate + Social Value Assessment using Modified SDR with Declining Long-Term Rate) as standard methodology. For the SDR parameters, I propose ρ=0.1%, η=1.0, g=1.0-1.5% (long-term projection), declining after 50 years.

  **I move that we vote on adopting this methodology on Thursday.** I welcome discussion on the specific parameter choices.
