answer: |-
  You've identified key advantages of Kalai-Smorodinsky (KS) but missed crucial trade-offs that explain Nash's continued relevance in moral uncertainty models. Here's why Nash isn't obsolete:

  1.  **Independence of Irrelevant Alternatives (IIA) Violation by KS:**  
      **This is the core misconception.** Nash satisfies IIA, but **KS violates it**. IIA states that removing "irrelevant" (non-chosen) options shouldn't change the bargaining outcome. KS fails this: adding or removing options *can* shift the KS solution, even if those options weren't chosen. In moral bargaining, this is problematic. If an option deemed morally abhorrent by all theories (and thus irrelevant) is removed from the feasible set, the KS solution *can change* unpredictably. Nash remains stable. For delegates, IIA ensures bargaining depends only on genuinely viable compromises, not hypothetical extremes.

  2.  **The Utopian Point Problem:**  
      KS requires defining a "utopian point" (max utility each delegate *could* achieve if others fully conceded). In moral uncertainty, this is fraught:
      *   **Incommensurability:** Moral theories often use radically different utility scales (e.g., hedonic utils vs. virtue fulfillment points). Defining a meaningful max for one theory, given others' constraints, is arbitrary or impossible.
      *   **Feasibility:** The utopian point might represent an outcome *no single theory* considers achievable or even coherent. KS anchors the solution to this potentially arbitrary point, making the outcome sensitive to its definition. Nash relies only on the *feasible set* and the *disagreement point* (status quo/inaction), which are often more objectively defined.

  3.  **Scale Dependence (Less Severe but Present):**  
      While both solutions have scale dependencies, KS's dependence on the utopian point exacerbates the issue. Transforming utility scales (e.g., multiplying a theory's utility by a constant) *doesn't* change the Nash solution but *does* change the KS solution by altering the utopian point coordinates. This makes KS more sensitive to how theories normalize their utility functions, adding another layer of arbitrariness.

  4.  **Computational & Conceptual Simplicity:**  
      Nash has a closed-form solution (maximizing the product of gains over the disagreement point) and is computationally simpler to find in many cases. KS requires finding the utopian point and solving a linear equation, which can be trickier with complex feasible sets or multiple dimensions. Conceptually, maximizing the product of gains is an intuitive fairness criterion.

  **Why Nash Persists Despite KS's Individual Monotonicity:**

  *   **IIA is Paramount:** For many modelers, IIA is non-negotiable. A solution shouldn't change because you remove morally irrelevant or impossible options. KS's violation of IIA is a deal-breaker, outweighing the benefit of individual monotonicity.
  *   **Avoiding Utopian Arbitrariness:** Relying on the disagreement point (Nash) is seen as less arbitrary than relying on the utopian point (KS), especially given value incommensurability.
  *   **Predictability & Stability:** Nash provides more predictable outcomes when the feasible set changes in ways that don't alter the fundamental bargaining dynamics, thanks to IIA.

  **Conclusion:**

  You're correct that KS's **individual monotonicity** is desirable: no delegate is harmed by the feasible set expanding favorably for them. However, KS **violates IIA** and is **highly sensitive to the definition of the utopian point**. These flaws are critical in moral bargaining, where the feasible set may contain irrelevant/extreme options and utility scales are incommensurable. Nash's adherence to IIA and reliance only on the feasible set and disagreement point make it more robust *for these specific challenges*, despite lacking individual monotonicity.

  **Think of it as a trade-off:** KS prioritizes fairness in how gains respond to set expansions (monotonicity), while Nash prioritizes stability regarding irrelevant alternatives (IIA) and avoids reliance on a contested utopian point. Neither dominates the other universally; the choice depends on which axioms the modeler prioritizes for the specific context of moral uncertainty. William MacAskill's work explicitly discusses this Nash vs. KS trade-off, highlighting IIA violation as a key reason for Nash's use.
