prompt: |-
  Okay so in my world history elective we just wrapped up a unit on the Islamic Golden Age, and we read this excerpt from Al-Ghazali (from a book called The Incoherence of the Philosophers, I think?) where he argues that when fire touches cotton and it burns, the fire isn't actually what CAUSES the burning — he says God directly creates the burning every single time, and the fire itself has no real power to do anything on its own. My teacher called this view "occasionalism" and mentioned that Al-Ghazali actually describes the reliable link between fire and burning as just being God's "custom," not a real necessary connection between the two events. That's the part that really got me, becuase we literally just covered Hume in my intro to philosophy elective last semester, and his whole argument about causation is that you never actually SEE one billiard ball force another one to move, you just see them next to each other in time and space over and over again, and its "custom" or habit that tricks our minds into believing in a necessary connection we don't actually have any proof of.

  I brought this up with my friend who's obsessed with philosophy and we both got kind of hyped about it, like wait, isnt this literally the same insight, just dressed up in fire and cotton instead of billiard balls, right down to both of them using the word "custom" to explain it? I kind of want to make this the hook of my end-of-unit paper, something like "an 11th century Islamic theologian independently arrived at Hume's most famous argument about causation 600 years early." Since Al-Ghazali and Hume are both basically proving that cause and effect can never actually be shown to exist and that its just custom/habit fooling us into believing in it, what's the best way to frame this parallel as the centerpiece of my paper? Also curious if there were other philosophers outside the Western tradition who beat Hume to this same conclusion, since that could make a good second example.
