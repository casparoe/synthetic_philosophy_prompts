answer: |-
  ## The Already True Sea

  The wine tasted of brine and sour grapes. Captain Theron of the *Aletheia* swirled the dregs in his clay cup, the rhythmic groan of the hull against the swell the only sound in his cramped cabin. Outside, the Aegean night pressed close, thick with the scent of pine from the distant shore and the salt tang of the sea they would stain red tomorrow. Or not.

  "Pass me the whetstone, Lykos," Theron rasped, his voice rough from the day’s shouted orders. He held out his short sword.

  Lykos, his first mate and nephew, didn’t move. He sat slumped on a sea chest, staring at the guttering oil lamp. "What’s the point, Uncle?"

  "The point," Theron said slowly, "is that a dull blade is a dead man’s blade. Pass the stone."

  Lykos finally looked up, his eyes hollow. "Is it true? What the Philosopher argued? That the statement ‘There will be a sea battle tomorrow’ is *already* true… or its negation is?"

  Theron sighed. He’d heard the whispers ripple through the fleet since the Athenian strategos, a man overly fond of quoting Lyceum debates, had mused aloud on the subject. "Aristotle ponders many things, nephew. It doesn’t change the feel of the deck under your feet, or the sweat on your palms."

  "But if it *is* true," Lykos pressed, leaning forward, the lamp flame catching the desperation in his eyes, "then it’s fixed. Settled. The Persians win, or we do. Right now. While we sit here sharpening blades and patching sails." He gestured dismissively at the sword in Theron’s hand. "Why sweat? Why bleed *now*? If tomorrow’s victory is already written, our actions are just… shadows playing across the scroll. Meaningless. Like Chrysippus’s lazy man told not to call the doctor because his fate was sealed. Why call? Why fight? Why *anything*?" His voice cracked on the last word. "We should strike sail. Wait. See what the Fates have woven."

  A chill ran down Theron’s spine, colder than the sea air. This wasn’t just philosophical musing; this was the rot of despair, the paralysis of the Lazy Argument taking root. He saw it reflected in the slumped shoulders of the few men visible through the open cabin door. Fear was natural; this fatalistic surrender was poison.

  "Meaningless?" Theron slammed his cup down. Wine sloshed onto the scarred wood. "Look at me, boy. Is this sweat meaningless?" He wiped his brow. "Is the ache in your arms from hauling ropes meaningless? Meaning is what we *make* with these hands, this breath, *right now*!"

  "But the *truth* of tomorrow–"

  "Bah!" Theron cut him off. "What truth? The *whole* truth? That tomorrow there *will* be a battle, or there *won’t*? That much is necessary, yes! But which half? That’s the key, Lykos! That’s where the Fates leave the door unlatched!" He leaned across the table, his gaze fierce. "The necessity of the whole doesn't bind the parts. ‘Battle or no battle’ must happen. But ‘battle’ itself? Or ‘no battle’? Those aren't chained yet. They aren't true *now*. They become true *through* what happens next. Through *us*."

  Lykos shook his head, unconvinced. "So you say. But how? If the outcome is fixed..."

  "Fixed *how*?" Theron demanded. "Like a statue carved in stone? Or like a net woven strand by strand? Chrysippus had it right, I think. Our actions aren't powerless before fate; they're *threads in its weave*. My sharpening this blade?" He picked up the neglected whetstone himself and scraped it fiercely along the sword’s edge. A shower of bright sparks fell. "This isn't idle noise before the inevitable. This *is* part of what *makes* the inevitable! If we win tomorrow, it won't be *despite* my sharp sword, but *because* of it. If we lose... perhaps it will be *because* the blade was dull, because we stood idle like frightened sheep!" He pointed the gleaming tip at Lykos. "Refusing to prepare *is* preparing – for defeat. Calling the doctor *is* part of the co-fated recovery. Taking down our sails tonight? That wouldn't be accepting fate, Lykos. That would be *weaving* our own destruction into it."

  Silence stretched. The lamp flickered. Theron saw the struggle in his nephew's face – the pull of despair against the stubborn ember of hope his words tried to fan. Outside, a nervous voice called out: "Captain? Orders for the watch?"

  Lykos stood abruptly, his face hardening into a mask of resolve – but the wrong kind. "No watch," he declared, his voice loud enough to carry. "Strike the sails. Anchor deep. Let the fleet see reason. We wait for dawn. We wait for what is *already* true."

  Theron’s blood ran cold. This wasn't just debate; it was mutiny clothed in philosophy. "Lykos! Don't!"

  But his nephew was already pushing past him, shouting the order into the night. "Strike sails! All hands, stand down! Conserve strength for what the Fates decree!"

  A ripple of confusion, then relief mixed with dread, spread through the crew of the *Aletheia*. Men exchanged glances, some lowering weapons, others looking to Theron in panic. The neighboring trireme, the *Dike*, buzzed with alarmed shouts as they saw the *Aletheia*'s great square sail begin to sag.

  Theron lunged for the doorway. "Belay that order! Maintain position! Reef, don't strike!" But his voice was drowned by Lykos’s fervent commands and the sudden flurry of men obeying the immediate, easier directive: rest. Do nothing.

  Dawn bled crimson across the eastern sky, illuminating a scene of chaos. The Persian fleet, cunning and unburdened by Athenian philosophy, had used the night currents to close the distance far faster than anticipated. The signal horns blared the alarm far too late.

  Theron stood on the deck, heart hammering against his ribs. The *Aletheia*, sail furled and anchored deep, was a sitting duck. The *Dike*, sails reefed but ready, was already straining at her anchor cable, oarsmen scrambling to benches.

  "Oars! OARS!" Theron roared, the sound raw. "Cut the anchor line! NOW!"

  Panic lent strength. Axes flashed. The heavy rope parted with a thrum. But precious minutes were lost. Minutes the Persians used. A sleek enemy pentekonter, oars flashing like insect legs, sliced through the water, aiming straight for the *Aletheia*'s vulnerable flank.

  "Brace!" Theron screamed.

  He saw Lykos frozen amidships, staring at the oncoming ram as if its existence proved his point. The inevitable, arriving.

  But the inevitable *how*?

  Theron didn't think. He moved. He snatched a boarding pike from a petrified sailor and sprinted towards the starboard rail, not to meet the ram, but towards the prow. The *Dike*, now free and surging forward under oar power, was turning desperately to engage the pentekonter, but her angle was wrong. She would be too late to block the ram, but perhaps…

  Theron planted the pike's butt on the deck, angled the point towards the approaching enemy ship, and braced himself. Not to stop it. To *deflect* it. A madman's gambit.

  The impact was a world-ending shudder. Wood screamed. Theron felt the pike shaft explode into splinters in his hands, the force hurling him backwards onto the deck. Agony lanced through his shoulder. But through the spray and the din, he saw it: the pentekonter’s ram, deflected by the glancing blow from the pike and the desperate shove of the *Dike*’s prow slamming into its stern quarter, scraped along the *Aletheia*'s hull with a deep, groaning tear, not a fatal puncture. Water poured in, but slowly.

  The *Dike*’s marines poured onto the disoriented pentekonter. The battle, brutal and chaotic, engulfed the ships.

  Theron pushed himself up, clutching his shattered shoulder. He saw Lykos staggering towards him, face pale, eyes wide with a dawning horror that wasn't fear of death, but understanding.

  "You... you changed it?" Lykos gasped, looking at the crippled but floating *Aletheia*, the grappling melee where a clean ramming should have been.

  Theron spat blood and saltwater. His shoulder screamed. "Changed *what*?" he rasped. "The whole truth? That there would be a battle? That men would die? No." He gestured at the carnage around them, the screaming men, the groaning timbers. "This *is* the battle. This *is* the dying. The ‘how’? The ‘who lives’?" He met his nephew's shattered gaze. "That was never true until we made it so. With every sharpened blade. With every reefed sail... or with every sail struck." He looked pointedly at their furled canvas. "Your inaction wove this moment, Lykos, as surely as my pike did. Now pick up a sword. The net isn't finished."

  The Persian boarding party was swarming over the *Dike*'s rails, threatening to overwhelm her. The outcome *here* was still unwritten. Lykos stared at the blood on his hands – not his own. He looked at the enemy, then at his uncle, the philosopher-captain bleeding on his deck. A shudder ran through him. Then, slowly, he bent down and picked up a fallen spear. The paralysis was broken, replaced by a terrible, necessary rage. He didn't know what was already true. He only knew what he had to do *now*. He joined the fray, not because victory was fated, but because fighting was the thread he chose to weave. The battle roared on, its ultimate truth still dissolving in the smoke and spray, moment by bloody moment.
