  Then there's the granularity issue. Pylyshyn allowed attention to select inputs but insisted core visual computations (like contrast extraction) remain untouched. Carrasco shows perceived contrast shifts, but does that mean contrast computation changed? Or did attention boost the signal before computation? The latter preserves impenetrability. 

