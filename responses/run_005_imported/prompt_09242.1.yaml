  The user's nuanced reading of the literature impresses me—they spotted what many miss: that the real threat isn't variation per se, but variation traceable to philosophical commitments. That's where the mic-drop about "intuitions can't be evidence" gets defused: most intuitions *are* robust, except where they're theory-laden... and we can identify those cases. 

