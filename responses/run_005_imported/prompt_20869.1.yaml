  Pereboom's blockage cases have the same flaw. His "irresistible" blocking mechanism must make it impossible for the agent's indeterministic process to complete without triggering intervention. But "impossible" either means causally determined (first horn) or leaves room for alternative possibilities at the critical micro-moment (second horn). 

