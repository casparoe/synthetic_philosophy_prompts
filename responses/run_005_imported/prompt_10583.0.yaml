prompt: |-
  Ok, this is a bit of a rabbit hole but I'm hoping you can help me untangle it properly, its for a piece I'm working on about the demarcation problem. Every intelligent-design writer I read loves quoting Popper as having basically disowned evolution -- the claim is that natural selection isn't real testable science but a "metaphysical research programme," and that "survival of the fittest" collapses into "survival of the survivors," i.e. a tautology wearing a lab coat. That part checks out, he really did say things along those lines. But then a philosopher of science I interviewed for the piece mentioned, kind of offhand, that Popper walked a good chunk of this back later -- I think in a Darwin-themed lecture sometime in the late 70s -- and admitted he'd changed his mind about whether the theory was testable after all. Nobody on the ID side ever seems to mention that part, which made me suspicious that either the recantation is more limited than it sounds, or people are just quietly ignoring it because it's inconvenient.

  Could you write me an essay sorting this out for real, instead of the usual "some say X, some say Y" mush? Specifically I want it to (1) pin down exactly what Popper thought was untestable about natural selection as a mechanism, as distinct from evolution/common descent as a historical fact, which he never seems to have doubted, (2) take the tautology charge on its own terms and work out whether defining "fitness" independently of actual survival really rescues the theory or just moves the circularity somewhere else, and (3) figure out what the recantation actually concedes -- my hunch going in is that its narrower than "Popper recanted, case closed," but I want you to actually check that hunch rather than confirm it for me. And then give me a real verdict, not a diplomatic split. Does the theory of natural selection, as biologists actually use it, count as falsifiable in Popper's own terms or not, and is his flip-flopping here a case of him being sloppy about one theory in particular, or does it point to a genuine crack in falsifiability as a general criterion for science? No need for headers or anything formal, a page or two is plenty, just make the argument and land somewhere specific.
