  There's this whole modern wellness/manosphere thing where dudes go on all-meat carnivore diets and justify it in vaguely Nietzschean terms—strength vs weakness, anti-decadence, rejecting soft modern 'plant-based' living, etc. But Nietzsche actually wrote alot about his own diet, especially in the 'Why I am so Clever' section of Ecce Homo, and from what I remember he was pretty finicky and moderate about food (tiny quantities, obsessing over exactly which foods upset his stomach, meal timing, which climate and cuisine agreed with him) rather than some macho eat-nothing-but-meat maximalism. So: based on what he actually said about nutrition, decadence, and physiology, do you think he would've endorsed something like the modern carnivore-diet crowd, or would he have seen it as just another kind of dogmatic decadence? Try to go beyond the vibes people usually associate with him.
