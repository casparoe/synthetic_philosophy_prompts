prompt: |-
  I mostly write about science and tech stuff for a living, but I also run a small biweekly podcast where I try to get someone to make an old, gnarly idea feel useful for right now, and next week's guest is a philosopher and media historian who's just published a book arguing that Kierkegaard's writing on "the public" and the press -- specifically the stuff from the 1846 Two Ages review, the bit that usually gets excerpted on its own as "The Present Age" -- is basically the real ancestor of everything we now say about social media, and a much sharper argument than people give it credit for. She's already warned my producer that shes bored of being asked "so did Kierkegaard predict Twitter," and has a whole practiced answer about how that question flattens the actual argument into a vibe, so I really don't want to walk in and just lob that at her.

  Could you draft me 8-10 interview questions that force her to cash out the specific mechanism instead of gesturing at vibes? I want at least one question on what work "the press" specifically is doing in his account, as opposed to "media" or "technology" in general (obviously he never saw a computer) -- like, is there something about the press as an institution that's doing the damage, or would any sufficiently large anonymous audience produce the same effect on his view. I want one on "leveling," since I think most people (including past-me) hear that word and assume he's just being an anti-egalitarian snob, and I'd like her forced to say why that reading is wrong, or admit it isn't. And I want one that uses the Corsair affair -- I read that a satirical Copenhagen paper spent something like a year mocking his appearance, down to his trouser legs, in print, right around when he was writing this material, and I want to ask her straight out how much of the theory is a personal grudge dressed up as metaphysics. For each of those three, throw in a quick follow-up keyed to whatever answer she's most likely to give so I'm not just nodding along on air, and close out the list with one question on whether his account leaves any room at all for a "public" that isn't leveling, or whether that's built in as a structural inevitability of the press as such.
