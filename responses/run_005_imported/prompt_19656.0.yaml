prompt: |-
  Six weeks ago, when a woman I know only slightly through a mutual friend posted that she was in kidney failure and needed a living donor, I filled out the transplant center's online screening form -- mostly, if I'm honest, just to feel like I was doing something rather than nothing, and without expecting anything to come of it. Last week they called to tell me I am a match, and I now have to give them an answer within the month. The coordinator has laid out the terms plainly: a small but real surgical risk, several weeks away from my job to recover, in exchange for a good chance of giving this woman -- whom I have actually met only twice -- her life back. When I mentioned this at dinner, my brother told me I had lost my mind, and that I owed a near-stranger nothing at all.

  Here is what I can't argue my way out of, whatever my brother says. If this same trade-off were compressed into a single vivid moment instead of stretched across a waiting list, an intake form, and a surgery date months away -- if she collapsed in front of us right there at the table, and a doctor said I could save her at this same cost to my body and this same delay to my week -- I don't think anyone would hesitate to say I obviously should. Spread out and mediated the way it actually is, the identical trade in risk and benefit somehow starts to feel like generosity rather than something required of me, and I can't tell whether that shift is tracking something morally real -- some genuine difference between letting her illness run its course and actively cutting into my own body to stop it -- or whether it's just a fact about how my attention and sympathy happen to work, with no real moral weight behind it at all.

  I don't need help with the medical logistics; I have those well in hand. What I would like, before I call the coordinator back, is help thinking through whether the distance and the paperwork actually change what I owe her, and, if they don't, where -- if anywhere -- a line could be drawn on how much of myself this kind of reasoning can demand, because I don't see what stops it well short of a kidney.
reasoning: |-
  Okay, the user is grappling with a profound moral dilemma about donating a kidney to someone they barely know. They initially filled out the screening form impulsively, not expecting to be a match, but now face a real decision with serious implications. Their brother thinks it's crazy, but the user feels troubled by the discrepancy between their hypothetical willingness to act in an emergency versus the mediated reality of scheduled surgery.

  The core tension here is fascinating: why does the same physical sacrifice feel obligatory in an emergency but like generosity when spread across paperwork and waiting periods? The user is intellectually honest enough to question whether this difference reflects actual moral weight or just psychological bias. They're also wisely looking ahead - if this reasoning demands a kidney now, what stops it from demanding more later?

  Hmm... the user strikes me as highly principled but uneasy. They're not seeking medical advice (they've got that covered) or emotional validation, but rather a rigorous ethical framework. Their phrasing ("can't argue my way out of") suggests they feel morally compelled but wary of slippery slopes. The brother's objection clearly hasn't resolved their unease.

  The key angles I should address:
  First, the time/mediation question: Does paperwork dilute obligation? Probably not - the woman's need is equally urgent whether bleeding out or on dialysis. The psychological difference comes from how human brains process abstract vs concrete harm (psych studies show we respond more to vivid immediacy). But morally, her suffering isn't less real because it's bureaucratic.

  Second, the "where to draw the line" concern. This is crucial. We might distinguish between negative duties (don't harm) and positive duties (help). Letting her die isn't actively harming, but failing to prevent harm when we easily could. Most ethics systems set limits on positive duties based on proportionality - we aren't obligated to ruin our lives to save others. A kidney donation sits right on that edge: significant but not devastating sacrifice for transformative benefit.

  Third, the relationship factor. While personal connection isn't morally required, it's practically relevant - we're wired to prioritize kin/tribe. But interestingly, the user seems more troubled by the lack of connection making the act feel gratuitous rather than obligatory. That might point to where the real discomfort lies: not in the sacrifice itself, but in performing it outside expected social scripts.

  The slippery slope worry is valid but containable. We can consistently say bodily autonomy creates special limits - we wouldn't demand someone donate a lung lobe, for instance, because survival impact differs. The kidney's regenerative compensation (one can live normally with just one) makes it uniquely situated as a "permissible ask" that doesn't extend to non-regenerative sacrifices.

  What this user needs most isn't a yes/no answer but tools to test their own values. They might consider: If a button existed that painlessly transferred the kidney with no recovery time, would I press it? If yes, then the hesitation is about ancillary costs (surgery, time off), which are real but quantifiable. If no, then the objection is to the bodily violation itself - which deserves deeper examination.
answer: |-
  You've articulated a profound ethical dilemma with remarkable clarity. Let's break down the core philosophical tensions and explore where the line might be drawn:

  ### 1. **The Emergency vs. Mediated Reality Paradox**
     - **Your Insight Is Correct:** The moral weight of saving a life *shouldn't* change based on timing or bureaucracy. A life saved through scheduled surgery is identical to one saved in an emergency. The difference is psychological:
       - **Vividness Effect:** Emergencies trigger visceral, instinctive empathy. Paperwork and waiting allow cognitive biases (like emotional distance) to intervene.
       - **Omission Bias:** We perceive *allowing* harm (doing nothing) as less blameworthy than *causing* harm (surgery risks), even when outcomes are identical.
       - **No Moral Difference:** Ethically, failing to act when you *can* prevent death is equivalent to withdrawing life support. The woman’s need is constant; only your perception shifts.

  ### 2. **What Do You "Owe" a Stranger?**
     - **Minimalist View (Your Brother's):** You owe nothing beyond basic decency. Samaritan acts are supererogatory (beyond duty).
     - **Moderate View:** We owe others help when:
       - The cost to us is *proportionate* (not ruinous)
       - The benefit is *significant* (life/death)
       - We’re *uniquely positioned* to help (as a match).
     - **Key Test:** If *everyone* with your capacity refused, society collapses. This suggests a duty exists, though limited by sacrifice scale.

  ### 3. **Drawing the Line: Where Sacrifice Becomes Optional**
     While ethics can demand significant sacrifice, **three boundaries** protect against limitless demands:
     - **Bodily Autonomy:** Society recognizes extraordinary rights over one’s body. You cannot be compelled to donate blood, organs, or bone marrow—even to save lives. This is a fundamental limit.
     - **Proportionality:** Risk/reward must balance. Donating a kidney (low risk with modern medicine, high reward) differs radically from donating a heart (fatal to donor). The line falls where sacrifice destroys your own capacity to live well.
     - **Reasonable Burden:** Weeks of recovery is burdensome but recoverable. Years of disability would exceed "reasonable" duty. Your job, dependents, and health shape this calculus.

  ### 4. **The "Stranger" Factor: Irrelevant or Decisive?**
     - **Morally:** If duties arise from human need (not relationships), her being a stranger doesn’t diminish obligation. Few ethicists argue we should only save friends.
     - **Psychologically:** Connection fuels motivation, but its absence doesn’t erase duty. Your initial act—filling the form—suggests you *feel* this duty, even minimally.
     - **Practical Caveat:** Transplant centers prioritize emotional readiness. If reluctance could cause resentment or regret, they may decline you. Honesty matters here.

  ### 5. **A Framework for Your Decision**
     Ask:
     - **"Is this sacrifice *proportionate*?"**  
       *Consider:* Surgical risk is ~0.1% mortality; lifelong impact is minimal for most donors. Her survival chance rises dramatically.
     - **"Does this preserve my core well-being?"**  
       *Consider:* Recovery time vs. your job security/support system. Will this truly derail your life?
     - **"Would I expect this of others?"**  
       *Consider:* If roles reversed, would you hope someone might help? (Not guilt, but perspective.)
     - **"Is refusal based on principle or fear?"**  
       *Distinguish:* Valid boundaries vs. discomfort with bureaucracy/strangeness.

  ### Where the Line Holds Firm
  This reasoning **does not demand unlimited sacrifice** because:
  - Bodily integrity is a hard boundary (no one can demand your organs).
  - Catastrophic personal cost (e.g., permanent disability, bankruptcy) exceeds duty.
  - Repeat sacrifices aren’t required—this is a *singular* act.

  **In your case:** Donating a kidney sits *at the edge* of ethical duty—demanding enough to feel profound, but not so destructive as to be obligatory. That’s why it feels like generosity: because society *allows* you to refuse, even if refusing isn’t morally neutral. Your choice lies in that space between duty and grace.

  ### Final Thought
  Your hesitation isn’t moral weakness—it’s engagement. Whatever you decide, ensure it aligns with the person you believe you ought to be. If you donate, let it be for *her* humanity, not guilt. If you decline, own it as a legitimate boundary. Both choices can be defensible. The coordinator can guide you through medical concerns, but only you can weigh the moral weight of this act against the contours of your own life.
