  First, I need to recall the core issue. The old evidence problem challenges Bayesianism because evidence already known shouldn't affect theories. But in practice, it does. Mercury's precession is a classic example. Astronomers knew about it for decades, so P(E) = 1. When Einstein showed GR predicted it, it boosted GR's credibility. How does Bayesianism handle that?

  The user mentioned two fixes. Let me break them down. The first is learning the logical connection. The idea here is that even if E is known, the fact that T entails E might not be known. So when you learn T → E, that's new evidence. The probability of T given that T implies E should increase, especially if other theories don't predict E. The calculation involves conditional probabilities. P(T | T→E) depends on how surprising E is. If E was unlikely without T, then P(T | T→E) is high. But there's a problem with logical omniscience. Bayesians assume agents know all logical truths, so T→E should already be known if T and E are. But humans aren't logically omniscient, so we learn the implication later. That's a workaround, but it might feel like cheating because it bypasses the idealization.

