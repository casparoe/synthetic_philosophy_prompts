  First, I should recall the core principles of IIT. It posits that consciousness arises from the intrinsic causal structure of a system, not its functions. Phi measures how integrated information is within the system. Functionalists, on the other hand, tie consciousness to what a system does—its computations and behaviors. IIT explicitly rejects this, focusing solely on internal causal powers.

  Tononi's response to Aaronson is consistent: if the math says the grid has high phi, then it's conscious, regardless of its simplicity. The common reaction—"that can't be conscious"—is rooted in functionalist thinking because it's judging based on what the system does (error correction) rather than its internal structure. 

