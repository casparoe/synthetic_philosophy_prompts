answer: |-
  To achieve genuine cognitive penetration in your protagonist's perception—where her jealousy *literally reshapes* how sensory input becomes conscious experience—here's the precise philosophical/psychological breakdown, the circularity problem, and narrative implications:

  ### Core Conditions for Genuine Cognitive Penetration (CP)
  *(Contra Fodor/Pylyshyn's modularity & "New Look" skepticism)*

  1.  **Direct Top-Down Influence:** Fear must alter **early perceptual processing** (e.g., visual grouping, figure-ground segregation, motion detection, basic feature binding), not just attentional selection or post-perceptual judgment. The "look" or "feel" of the stimulus changes *before* conscious interpretation.
  2.  **Content-Specific Alteration:** The change must be specific to the *content* of the fear. It's not general anxiety making everything blurry; it's jealousy making the handshake *feel* lingeringly intimate or the hesitation *sound* guiltily pregnant.
  3.  **Phenomenal Contrast:** What she consciously experiences (the *phenomenology*) differs from what an untroubled observer (or her former self) would experience *given the same sensory input*. The stimulus itself isn't ambiguous; the *percept* is different.
  4.  **Bypassing Modular Encapsulation:** Early vision/audition is typically considered "encapsulated" (Fodor) – immune to beliefs/desires. For CP, her fear must *violate* this encapsulation, influencing processes like:
      *   **Feature Binding:** Combining basic elements (shape, color, motion). Jealousy might bind "hand on colleague's shoulder" + "slight lean-in" + "context of intimacy" into a *gestalt* of flirtation instantly.
      *   **Categorization:** Assigning the stimulus to a category at a perceptual level. The hesitation isn't *interpreted* as guilt; it's *heard as* a "guilty pause."
      *   **Affective Tone:** Fear imbues the percept itself with a threatening or suspicious *qualitative feel* – the colleague's smile carries an inherent, perceptible "smugness."

  ### Distinguishing CP from Alternatives (The Skeptic's Retreat)
  *   **Attention:** Skeptic: "She just *notices* different things." CP Rebuttal: Even if she attended to the *exact same* sensory features (e.g., duration of handshake, millisecond pause), they would *feel* qualitatively different (e.g., objectively 2 seconds feels like 5 seconds of lingering intimacy; a brief pause feels like an eternity of hesitation).
  *   **Memory:** Skeptic: "She misremembers neutrally." CP Rebuttal: The distortion happens *online* during perception. When the handshake *ends*, she already *perceived* it as overly long and intimate; it's not reconstructed later.
  *   **Post-Perceptual Judgment/Bias:** Skeptic: "She *judges* the neutral percept suspiciously." CP Rebuttal: The *percept itself* carries the suspicion. She doesn't see a neutral handshake and *then* think "That was intimate"; she *sees* an intimate handshake. The judgment is embedded in the perception.

  ### Siegel's Circularity Problem & Its Epistemic Toxicity
  This is crucial for your novel's tension.

  1.  **The Loop:**
      *   **Prior State:** Fear/JEALOUSY (J) exists.
      *   **Penetration:** J cognitively penetrates PERCEPTION (P). P is now "loaded" with J's content (e.g., sees "guilty hesitation").
      *   **"Confirmation":** The J-loaded percept (P_J) is taken as EVIDENCE (E) *for* the original J ("See! His hesitation proves his guilt!").
      *   **Reinforcement:** E (derived from P_J) strengthens J, making future penetration *more likely and intense*.

  2.  **Why it's Epistemically Problematic (Not Just Psychological):**
      *   **Loss of Independent Checks:** Perception normally provides *independent* data to test beliefs. CP severs this link. The "evidence" (E) is *generated by* the very belief (J) it's meant to support. There's no neutral perceptual ground left to challenge J.
      *   **Self-Sealing System:** The loop becomes self-validating. Every interaction is filtered through J, generating P_J, which is taken as E for J. Alternative hypotheses (e.g., "He's just tired") become perceptually inaccessible – she literally *can't see* the tiredness, only the guilt.
      *   **Illusion of Objectivity:** The protagonist *feels* she's being objective ("I *saw* him hesitate guiltily!"). The penetration hides its own operation, making the "evidence" feel compellingly real and external, not internally generated. This *feeling* of objectivity is epistemically dangerous.
      *   **Blocked Rational Revision:** Because the evidence *feels* so direct and perceptual, it resists counter-argument. Showing her objective facts (e.g., phone records) might not dent the *felt reality* of what she *saw* and *heard*. The penetration creates a deeper, sensory-level conviction that pure belief doesn't.

  ### Narrative Implications: How to Write It
  *   **Sensory Language:** Describe percepts *as they feel to her*, laden with affective/judgmental content from the start. Don't say "She saw him hesitate and interpreted it as guilt." Say: "The silence stretched, thick with unspoken guilt, before his 'Hello?' scraped out, rough with evasion." Or: "His fingers lingered on Sarah's, a fraction too long, a secret pressure transmitted skin to skin."
  *   **Contrast (Implied or Stated):** Hint at the objective reality subtly. "Later, she would replay it, wondering if it had truly lasted that long." Or show another character's baffled reaction to her "obvious" evidence.
  *   **Escalation:** Show the percepts becoming more distorted as jealousy deepens. A neutral glance becomes a "smirk of triumph," a quick goodbye becomes "hurrying away to *her*."
  *   **The "Feel" of Evidence:** Emphasize how *viscerally real* and *confirming* these experiences feel to her. They aren't deductions; they are gut-level *revelations* fueled by her fear.
  *   **The Trap:** Convey her growing entrapment within the loop. Each penetrated percept feels like undeniable proof, tightening the grip of jealousy, making the next distortion worse. Show her frustration when others don't "see" what's so "obvious" to her.

  **In essence:** For genuine CP, her jealousy must act like a dye coloring the *very fabric* of her sensory experience, not just a lens she looks through afterward. Siegel's circularity reveals why this is a uniquely devastating epistemic trap: it weaponizes perception against itself, creating a closed world where fear generates its own "proof" and feels utterly, irrefutably real. This creates profound psychological *and* narrative tension – the tragedy of a character truly blinded by what she believes she sees. Commit to writing the percepts *as she experiences them*, saturated with suspicion from the moment they enter consciousness.
