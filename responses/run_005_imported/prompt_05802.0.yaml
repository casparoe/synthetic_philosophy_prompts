  Hmm... Darwin's text is fascinatingly ambiguous here. When he defines morality as serving "the general good or welfare of the community," this could be interpreted two ways: as a mind-independent moral fact (realism) or as a naturally selected preference (anti-realism). The user seems particularly interested in whether Darwin escapes Street's dilemma entirely. 

  I recall Darwin emphasizes how moral instincts arise from social sympathy - not abstract reasoning - and how tribal survival favored communities with cooperative traits. His account feels thoroughly naturalistic. But crucially, he doesn't reduce morality to mere fitness; he describes genuine other-regarding preferences shaped by group selection. 

  For the hypothetical response to Street: Darwin would likely reject the "no relation" horn by insisting selective pressures did shape our moral faculties to track something real - communal welfare. But he'd also undermine Street's "explanatory idleness" charge by showing how this tracking itself conferred adaptive advantage. His group selection framework makes the tracking relation explanatorily vital. 

  The brilliance is that Darwin treats communal welfare as both a natural fact (observable in thriving tribes) and the target of evolved moral cognition. This avoids brute coincidence without invoking spooky moral facts. His account might dodge the dilemma by naturalizing the "truth-makers" completely. 

