prompt: |-
  Something's been bugging me about a work situation. At my restaurant job, somebody has to close on New Years Eve (worst shift of the year, dead on tips after midnight, don't get out till like 3am). Me and my coworker Diego are the two newest hires, so our manager wants to pick between us fair and square. She gave two options: 1) she flips one coin right now, heads I close and tails Diego closes, or 2) later this week the scheduling app generates a separate random number for each of us, each with the exact same 50% odds of landing on "you close" — except since theyre generated separately, theres a chance we both get flagged (then we'd just split the shift) or neither of us does (then she closes it herself). Diego says it makes no difference which way she does it since we're each getting the same 50/50 shot regardless. Something about that feels off to me but I can't explain what. Is he right that there's no real difference, or is my gut onto something here?
