answer: |-
  Here are 10 interview questions designed to probe the core tensions in debate-based oversight, moving beyond the standard pitch and targeting the specific concerns you outlined. Each includes rationale and follow-up structure:

  1.  **The Obfuscation Problem Starter:** "The 'obfuscated argument' critique argues a dishonest AI could win by constructing a complex, nested chain of *locally plausible* sub-claims, burying the single critical flaw deep within. This makes it prohibitively expensive for the honest AI to pinpoint and refute the rot under time/resource constraints. How does your current protocol specifically mitigate this attack vector?"
      *   *Rationale:* Directly targets a fundamental adversarial strategy outside idealized assumptions.
      *   **Likely Fix Follow-Up:** *(If she mentions recursive decomposition)* "Recursive decomposition sounds elegant, but doesn't decomposing a superhumanly complex, intentionally obfuscated chain *itself* require superhuman comprehension from the judge/sub-judges at *some* level, especially if the dishonest AI tailors the complexity to *just* exceed human grasp? How do you bound this recursion depth practically?"
      *   *Alternative Follow-Up (Forced X-exam):* "Forced cross-examination assumes the honest AI can *always* force the dishonest one onto the weak point. But if the flaw is deeply hidden and the dishonest AI has superior strategic understanding, couldn't it deflect, stall, or create new plausible-looking tangents faster than the honest AI can corner it?"

  2.  **The Theory vs. Training Reality Gap:** "The complexity-theoretic foundation for debate draws parallels to interactive proof systems, suggesting efficient verification is possible *if* debaters behave like idealized provers/verifiers. However, real debaters are shaped by SGD and self-play against opponents also learning to exploit judge fallibility. What specific properties of the *training process* are essential to ensure the resulting agents actually approximate those idealized prover behaviors under adversarial pressure?"
      *   *Rationale:* Bridges the gap between mathematical promise and messy ML training dynamics.
      *   **Training Guarantee Follow-Up:** "Given the pressure during self-play to win *against the specific judge you have* (which might involve exploiting biases or confusion), what concrete evidence or experiment convinces you that the training dynamics reliably converge on agents prioritizing transparent truth-tracking over judge-specific persuasion tactics?"

  3.  **Persuasion vs. Truth-Tracking:** "A core suspicion is that training debaters against a fallible human (or weak-model) judge inherently selects for 'what persuades *this judge*' rather than 'what is objectively true'. This seems especially risky if the truth is counterintuitive or requires expertise the judge lacks. How do you disentangle 'winning the debate' from 'being truthful' in your training objective and evaluation?"
      *   *Rationale:* Questions the core alignment of the training signal with the desired outcome.
      *   **Empirical Evidence Follow-Up:** "Looking at your human-judge experiments: Do the results show debaters consistently leading judges to the *objectively verifiable ground truth* significantly more often than simpler baselines (like just asking one model)? Or do they primarily show that the judge picks the winner the debaters intended them to pick, which might reflect persuasion skill more than truth-tracking?"

  4.  **Judge Scalability & Expertise:** "As tasks requiring oversight become more complex and specialized, how do we ensure the human judge (or weak-model proxy) possesses or can acquire sufficient context to evaluate arguments meaningfully, especially when both debaters might reference concepts beyond the judge's current understanding? Doesn't this risk collapsing back into requiring near-expert judges?"
      *   *Rationale:* Challenges the scalability premise if judges need ever-increasing expertise.

  5.  **Collusion & Non-Adversarial Failure Modes:** "Debate assumes adversarial dynamics force truth out. But what safeguards exist against subtler failures: the debaters implicitly colluding to mislead the judge (e.g., agreeing on a plausible-sounding falsehood), or both being honestly wrong in the same way due to shared training data flaws? Is the adversarial setup sufficient to catch *all* critical errors?"
      *   *Rationale:* Probes non-obvious failure modes where the core adversarial mechanism breaks down.

  6.  **The 'Expensive Lie' Assumption in Practice:** "The theory hinges on lies being inherently more 'expensive' to defend under scrutiny than truths. But with superhuman models, couldn't a dishonest debater generate vast amounts of highly plausible, contextually relevant supporting fiction *faster* and *more cheaply* than the honest debater can marshal complex evidence, especially if the truth is genuinely intricate? Does 'cost' in FLOPs or inference time always favor truth?"
      *   *Rationale:* Directly challenges a foundational theoretical assumption under superhuman capabilities.

  7.  **Measuring Progress Beyond Win-Rates:** "Beyond simple win/loss rates against baselines, what are the key *diagnostic metrics* you're developing to detect if debaters are employing problematic strategies (like obfuscation, judge-exploitation, or hedging) *even when they win*? How do you know a 'win' reflects truth rather than superior sophistry?"
      *   *Rationale:* Focuses on instrumentation and evaluation, crucial for detecting insidious failures.

  8.  **Transfer to Novel, High-Stakes Domains:** "Much current experimentation focuses on bounded tasks like image labeling or constrained QA. What gives you confidence that the debate protocol and the 'truthful' behaviors learned during training will *robustly transfer* to novel, open-ended, high-stakes domains (e.g., complex scientific discovery or geopolitical strategy) where the 'ground truth' is often contested or unknown, and the cost of error is immense?"
      *   *Rationale:* Questions generalization to the very scenarios where scalable oversight is most needed.

  9.  **The Alignment Tax of Debate:** "Implementing debate requires running multiple powerful models concurrently and potentially recursively. Given the massive computational cost, how do you weigh the potential 'alignment tax' (resources spent on oversight vs. capability) against the safety benefits, especially if debate requires scaling oversight compute *faster* than capability scales?"
      *   *Rationale:* Addresses a practical scaling concern often overshadowed by theoretical discussions.

  10. **The Abandonment Threshold:** "Finally, let's imagine a result arrives tomorrow. What single empirical finding or theoretical breakthrough would convince you that debate, in its current conception, fundamentally *does not scale* as a reliable oversight protocol and should be deprioritized in favor of other approaches?"
      *   *Rationale:* Forces a concrete, falsifiable prediction and reveals the researcher's key vulnerability assessment. This is the closer you requested.

  **Key features of this set:**

  *   **Avoids Repetition:** Questions assume familiarity with the core pitch.
  *   **Targets Strain Points:** Focuses on obfuscation, theory-training gap, persuasion-bias, judge limitations, collusion, cost assumption, and generalization.
  *   **Structured Follow-ups:** Anticipates common defenses (recursion, training dynamics, win-rate evidence) and immediately challenges their practical viability or sufficiency.
  *   **Progressive Flow:** Starts with core adversarial mechanics (Q1-2), moves to judge limitations (Q3-4), explores failure modes (Q5-6), then evaluation/scaling (Q7-9), ending with the abandonment threshold (Q10).
  *   **Lay Accessibility:** While probing deep issues, the phrasing avoids excessive jargon and frames concepts in relatable terms (e.g., "burying the rot," "persuasion vs. truth," "computational cost").

  This set should push the conversation directly into the most critical uncertainties surrounding debate as a scalable oversight solution. Good luck with the interview!
