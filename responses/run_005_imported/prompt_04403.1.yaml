  Elena argues that if move 6 has zero probability under common knowledge of rationality, Bayes' rule doesn't tell you what to believe when it happens. Deciding to see the deviation as a tremble instead of changed rationality is an extra assumption, not given by common knowledge. So backward induction is question-begging. 

