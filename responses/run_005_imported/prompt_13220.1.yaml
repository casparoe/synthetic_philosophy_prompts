answer: |-
  You're absolutely right to feel conflicted - this situation touches on the complex dynamics of **voluntary generosity vs. established expectations.** Both perspectives have merit, but your friend's reaction crosses a line. Here's the breakdown:

  1.  **Your Perspective is Valid & Important:**
      *   **Voluntary Acts ≠ Obligations:** You clearly initiated these actions out of kindness, not duty. No one demanded them, and you never formalized them as commitments.
      *   **Boundaries are Healthy:** Saying "no" when exhausted is essential self-care. Generosity shouldn't come at the cost of your well-being.
      *   **Lack of Reciprocity/Appreciation:** The core of your frustration likely stems from feeling unappreciated and the lack of similar effort from others. Your "stewing" suggests accumulated resentment over the imbalance.

  2.  **Your Friend's Perspective (The Grain of Truth):**
      *   **Patterns Create Expectations:** Humans are pattern-recognition machines. When you *reliably* do something kind for *years*, it naturally creates an expectation and becomes part of the social fabric. People start to unconsciously count on it.
      *   **"Pulling the Rug Out":** Her point about "no warning" has *some* validity. A sudden withdrawal of a long-standing pattern *feels* jarring and can be interpreted as a shift in the relationship, even if logically it shouldn't. A heads-up ("Hey guys, just FYI, my schedule is getting crazy, I might not always be able to do airport runs anymore") *could* have softened the blow.

  3.  **Where Your Friend is Wrong:**
      *   **Entitlement:** Saying you're **"entitled to count on it"** is the critical flaw. **Reliance is not entitlement.** She *relied* on your kindness, but she is not *entitled* to it. Entitlement implies a right or debt owed, which doesn't exist here.
      *   **Guilt-Tripping:** Her hurt feelings are valid, but weaponizing them to make you feel guilty for setting a boundary is unfair and manipulative. Her disappointment is hers to manage, not yours to fix by overriding your own needs.
      *   **Ignoring Your Effort & Intent:** Dismissing your years of voluntary generosity as "beside the point" invalidates your kindness and reduces it to a mere utility she expects to function on demand.
      *   **No Acknowledgment of Your State:** She focused entirely on her disappointment, showing no concern for *why* you were "wiped out." True friendship involves mutual care.

  **The Verdict:**

  *   **You are fundamentally "in the clear" morally.** You broke no promise, violated no agreement. You exercised a healthy boundary.
  *   **The "grain of truth" is about human psychology and social dynamics, not moral obligation.** Her *feeling* of being let down is understandable based on the pattern, but her *claim* of entitlement and her *reaction* are not justified.
  *   **The core issue isn't this one airport run.** It's the **unspoken contract** that developed where your consistent generosity became the baseline, likely without sufficient appreciation or reciprocity. This incident exposed that imbalance.

  **What to Do Now:**

  1.  **Acknowledge the Pattern (Without Accepting Blame):** When things are calmer, you could say: *"I understand that because I've often done airport runs in the past, you counted on me this time. I get why that change was disappointing."* This validates her *feeling* without agreeing with her *entitlement*.
  2.  **Reassert Your Boundary & Intent:** *"However, I need to be clear: those runs were always acts of kindness I chose to do when I *could*, not obligations I promised. Last weekend, I simply couldn't. My capacity to help fluctuates, and I need to be able to say no without it causing conflict, just like anyone else."*
  3.  **Highlight the Underlying Issue (Carefully):** *"This situation has made me realize how much I've taken on over the years – birthdays, check-ins, rides. I did it because I care, but I think the pattern led to some unspoken expectations. Moving forward, I need us all to be more mindful that these things are voluntary efforts, not automatic duties, and I'd love to see more shared responsibility in the group."*
  4.  **Observe the Response:** Pay close attention to how your friend and the group react to this.
      *   Do they acknowledge your point and show appreciation for past efforts?
      *   Do they demonstrate a willingness to step up more?
      *   Or do they double down on guilt or dismissal?
  5.  **Re-evaluate Your Role:** Consciously dial back the "extra stuff" for a while. See who notices, who steps up, and who complains. Let the group dynamic adjust. Focus your energy on reciprocal relationships.
  6.  **Prioritize Self-Care:** Your feeling of being "wiped out" is a signal. Protect your energy. You cannot sustainably pour from an empty cup.

  **In essence:** Your generosity created a *reliance*, but not an *entitlement*. While your friend's disappointment based on the pattern is understandable, her claim that you "can't pull the rug out" and that she's "entitled to count on it" transforms your kindness into an obligation you never agreed to. This incident is a painful but necessary catalyst for rebalancing the dynamics of your friendships. Healthy relationships allow space for "no" without guilt. You have every right to set that boundary.
