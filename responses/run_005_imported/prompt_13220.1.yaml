prompt: |-
  This came to a head last weekend and im still stewing over it. For like three years I've been the friend who does the extra stuff for our group -- organizing birthdays, doing 6am airport runs, checking in on people when they're clearly struggling. Nobody ever asked me to do any of this, I just started doing it because I wanted to. Last weekend I said I couldn't do an airport run because I was wiped out, and my friend got genuinely hurt, like I'd broken an actual promise, even though I never signed up for a standing commitment to anyone. When I pointed out that this was always just me choosing to be generous, not something I owed her, she said thats beside the point -- once you've reliably done something for people for years, they're entitled to count on it, and you can't just pull the rug out with no warning. Part of me thinks she's wrong, but I'm honestly not sure. Does the fact that none of this was ever required of me mean I'm in the clear, or does she have a real point buried in there?
