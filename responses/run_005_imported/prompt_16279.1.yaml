    (c) "Off-path" costs enforce honesty materially. Her "swap" accusation misrepresents the model.  
  - **Move 4 (Ben: Score 2):** Ben delivers a **critical clarification**. He correctly distinguishes:  
    - *Strategic cost* (differential marginal cost maintaining honesty, which can be small at equilibrium)  
    - *Efficacy cost* (baseline cost to produce/detect the signal, often substantial)  
    Nora *does* conflate these, replicating early critiques of Zahavi’s ambiguity. This distinction resolves the debate.  

  **Resolution:** Ben wins the exchange. Nora rightly defends Zahavi’s biological intuition but misapplies it to Grafen’s formal model. Ben demonstrates that honesty requires only *differential* costs (not absolute burden), and Nora’s objection conflates efficacy costs with strategic costs – the very confusion Grafen resolved.
