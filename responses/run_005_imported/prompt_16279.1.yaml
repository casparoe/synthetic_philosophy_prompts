  - **Move 2 (Ben: Score 2):** Ben is **correct and precise**. Grafen's ESS model requires only that the *marginal cost curve* is steeper for low-quality individuals (dC/dS_low > dC/dS_high). Equilibrium costs *can* be low for high-quality signalers. "Costly to fake" is the core mechanism.  
  - **Move 3 (Nora: Score -1):** Nora conflates concepts. Grafen's model *doesn't* reduce to cheap talk because:  
