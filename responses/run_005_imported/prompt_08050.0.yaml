prompt: |-
  So I'm a philosophy PhD student mostly working on mainstream epistemology (internalism vs externalism, reliabilism, the whole post-Gettier industry), but this term I've been auditing a seminar on classical Indian philosophy just to round out my background, and honestly it's wrecking my sense of how these categories carve things up. We spent the last two sessions on the Nyaya theory of the pramanas, and I feel pretty solid on the basic four (pratyaksa, anumana, upamana, sabda), but the professor blazed through the svatah-pramanya vs paratah-pramanya debate between the Naiyayikas and the Mimamsakas and I dont think I actually got what's at stake. A couple people in my cohort insisted afterward over coffee that this is basically just the internalism/externalism debate wearing different clothes, but when I try to spell out the mapping myself it falls apart -- the Mimamsa claim that validity (pramanya) is grasped intrinsically, just in virtue of a cognition arising, doesn't obviously line up with 'internalist' in the access-to-justifying-reasons sense, and Nyaya's extrinsic story still seems to require a further cognitive act (this anuvyavasaya business, the reflective awareness of the first cognition) rather than just brute causal reliability, so it doesn't cleanly map onto reliabilism either.

  Could you actually walk me through this debate properly -- why the Naiyayikas reject the Mimamsa (Bhatta and/or Prabhakara) view that cognitions are self-certifying, what work anuvyavasaya and the appeal to successful practical activity (pravrtti-samarthya, or samvada as a correspondence test) are doing in Nyaya's alternative account of how we come to know a cognition is valid, and specifically where the analogy to internalism/externalism actually holds up versus where it breaks down or is just misleading? I want to use this in a paper section, so please don't give me the encyclopedia-entry version of the four pramanas -- I'd rather you get into the actual mechanics of the arguments, and flag it if a point is genuinely contested among translators/scholars rather than settled.
