prompt: |-
  Okay so this summer I've been going down a bit of a decision theory rabbit hole trying to find a topic for an independent research project, and I keep running into this thing called "Good's theorem" on various blogs and old forum posts. Its from a short 1967 paper by a guy named I.J. Good (who I actually already knew the name of from AI safety stuff, he's the "intelligence explosion" guy, small world). The basic idea seems to be: if you're a Bayesian who actually updates properly on new evidence and then picks your best action given your new beliefs, then getting more information for free can never make your expected outcome worse, only better or equal. Apparently the proof is short enough that even I could kind of follow it — it comes down to the average of your best-case payoffs across all the ways the evidence could come out always being at least as big as the payoff of the single best action you'd pick with no evidence at all.

  Then totally seperately, in econ class we were doing a unit on adverse selection and my teacher used genetic testing and health insurance as the example. Her point was that if genetic tests got good and cheap enough that everyone — you and the insurance company — found out your real disease risk before any policy got signed, insurance could basically fall apart: insurers won't cover people they now know are high-risk at a price those people can afford, and "accurately priced" insurance kind of defeats the purpose for the people who need it most. So looking at it from before anyone's tested, pretty much everybody would rather that information not exist yet, even though it's free and completely accurate — which sounds exactly like a case where more information makes people worse off, not better, and that feels like a direct contradiction of Good's theorem.

  I asked my teacher about this and she just said "that sounds like a math class question," so thanks for nothing lol. Could you help me actually work through what's going on between these two? Like, does the insurance/genetic testing thing genuinely break Good's theorem, or is the theorem secretly relying on something (my best guess is it has to do with there only being one decision-maker in the theorem, versus a bunch of people whose contracts with each other depend on the same information) that quietly stops holding in the insurance case? I don't need the full formal proofs of either result, I just want to actually understand why these two things I read seem to flatly disagree, and more generally how you'd know in advance which category a new situation falls into.
reasoning: |-
  Okay, let me start by unpacking the user's question. They're diving into decision theory and stumbled upon Good's theorem, which says that for a Bayesian, free information can't hurt. But then in their econ class, the genetic testing and insurance example shows information making everyone worse off. That seems contradictory. The user wants to know why these two scenarios clash and how to reconcile them.

  First, I need to recall Good's theorem clearly. It applies to a single decision-maker who updates beliefs and chooses actions optimally. The proof hinges on averaging over possible information outcomes. Each piece of info leads to the best action for that scenario, so the expected value should be at least as good as acting without any info. That makes sense in isolation.

  Now, the insurance case involves multiple parties: insured individuals and insurers. Adverse selection kicks in because information asymmetry disappears. If everyone knows genetic risks, insurers charge high premiums to high-risk people, making insurance unaffordable for them. Low-risk folks pay less, but the risk pool shrinks, potentially collapsing the market. Before testing, both groups might prefer no information to avoid this breakdown. 

  So why the contradiction? The key difference is the number of decision-makers. Good's theorem assumes a single agent, while insurance has multiple agents with conflicting interests. The insurer's actions affect the insured's outcomes and vice versa. When information becomes public, it changes the strategic interactions. The theorem doesn't account for how one party's information affects others' options.

  Also, in the insurance scenario, the information isn't just observed—it's incorporated into contracts. Premiums are set based on risk, which alters the available choices. High-risk individuals lose the option to buy affordable insurance. So the action set changes with information, violating Good's assumption of fixed actions.

  The user might also be hinting at broader applications. They want a framework to predict when information helps or harms. The answer lies in checking if the setting has strategic interactions or if information alters the game structure. Single-agent vs. multi-agent is the first clue. Market structures, contract enforceability, and whether information is public or private also matter.

  I should make sure to explain without jargon. Use the insurance example to highlight the multi-party issue. Emphasize that Good's theorem holds for individuals but not necessarily in systems where actions are interdependent. The user's insight about multiple decision-makers is spot on—that's the core of the discrepancy.
answer: |-
  You've hit on a brilliant tension between a fundamental theoretical result and a powerful real-world economic phenomenon! This isn't a contradiction; it's a fantastic illustration of how assumptions shape conclusions. Let's break down why Good's theorem and the insurance adverse selection scenario *seem* to clash but actually live in different conceptual universes.

  **1. Good's Theorem: The Solo Bayesian Optimizer**

  *   **Core Assumption:** A *single*, rational decision-maker who:
      *   Has a well-defined utility function (what they want to achieve).
      *   Updates beliefs perfectly via Bayes' rule upon receiving new evidence.
      *   Always chooses the action that maximizes their *expected utility* given their *current beliefs*.
      *   Receives the information *for free* before making their final decision.
  *   **The Intuition:** Imagine you *must* choose an action *now* with your current knowledge. You get some expected utility. Now, imagine you get a free peek at some evidence *before* you choose. For *each possible outcome* of that evidence, you get to pick the *best action* for *that specific outcome*. Good's theorem proves that the *average* (expected value) of those "best action for each evidence outcome" utilities is *at least as high* as the utility of the "best single action without evidence". Information gives you flexibility to tailor your choice, which can't hurt and usually helps.
  *   **Analogy:** Choosing a vacation outfit *without* knowing the weather forces you to pick something mediocre for all possibilities. Getting a *free, accurate weather forecast* before packing lets you pick the *perfect* outfit for the actual weather. The forecast can't make you *worse off* than packing blindly.

  **2. The Insurance/Genetic Testing Scenario: A Multi-Agent Strategic Game**

  *   **Core Elements:**
      *   **Multiple Decision-Makers:** Insured individuals (with private risk profiles) AND Insurance companies (aiming for profit).
      *   **Strategic Interaction:** Each party's best action depends on what the *other* party knows and does.
      *   **Asymmetric Information (Initially):** You know your genetic risk better than the insurer.
      *   **Contractual Relationship:** The "action" (signing an insurance contract at a specific price) requires *agreement* between two parties with potentially conflicting interests.
      *   **Information Changes the Game Structure:** Crucially, making genetic information *public* doesn't just inform individual decisions; it fundamentally *alters the market structure and the available contracts*.
  *   **Why "Free" Information Can Make Everyone Worse Off (Ex-Ante):**
      1.  **Pre-Testing Equilibrium (Hidden Risk):** Insurers offer a single price based on the *average* risk of the population. High-risk individuals get a good deal (pay less than their true cost), low-risk individuals pay slightly more than their true cost. Insurance functions as a risk-pooling mechanism. *Everyone can get coverage.*
      2.  **Post-Testing Equilibrium (Revealed Risk):** Insurers *know* each individual's exact risk.
          *   They will offer policies priced *at or above* the expected cost for *each specific risk level*.
          *   High-risk individuals face prohibitively high premiums they can't afford (or that defeat the purpose of insurance).
          *   Low-risk individuals get fairly priced insurance, but...
          *   **The Market Breaks Down (Adverse Selection):** The high-risk individuals are priced out. The risk pool now *only* contains people insurers know are low-risk. The *original purpose* of insurance – pooling risk across different types to provide affordable protection against catastrophe for the unlucky – is destroyed. High-risk individuals get *no coverage*. Low-risk individuals might get coverage, but they never needed the pooling function as much. Crucially, **the option to buy affordable coverage *at all* disappears for the high-risk group.**
      3.  **Ex-Ante Preference:** *Before* anyone knows their *own* risk, everyone prefers the world where genetic testing *isn't* available (or isn't used by insurers). Why?
          *   **High-Risk People (Future):** Know they'll likely lose access to affordable insurance if tested.
          *   **Low-Risk People (Future):** While they *might* pay slightly less in a tested world, they recognize the *huge* loss to the high-risk group and the potential instability. More importantly, they value the *guarantee* that *if* they turn out to be high-risk (which is possible ex-ante), they will still have access to affordable insurance. The *option value* of the pooled system is high for everyone before their risk is known.

  **The Resolution: Where Good's Theorem's Assumptions Break Down**

  Your intuition about the "single decision-maker" vs. "multiple decision-makers" is **exactly right**. Here's why the insurance scenario doesn't violate Good's theorem:

  1.  **Multiple Agents, Conflicting Interests:** Good's theorem applies to *one* agent optimizing *their own* utility. Insurance involves *at least two* agents (insurer, insured) with different utility functions (profit vs. coverage/peace of mind). The insurer's optimal action (risk-based pricing) harms the high-risk insured's ability to achieve *their* optimal outcome (affordable coverage).
  2.  **Information Changes Available Actions/Options:** This is the most critical point. Good's theorem assumes the *set of possible actions* remains fixed. Information only changes your *beliefs* about which action is best.
      *   **In Insurance:** Public information radically *alters the action set itself*. Before testing, the action "Buy affordable insurance at the pooled rate" is available to everyone. After testing, this action *disappears* for high-risk individuals. Their *best available action without information* (buy pooled insurance) is *strictly better* than their *best available action with information* (go uninsured or pay ruinous premiums). Good's theorem doesn't consider information *destroying* valuable options.
  3.  **Information Asymmetry & Signaling:** The initial market relies on asymmetric information. Revealing information eliminates this, changing the strategic landscape fundamentally. Good's theorem has no concept of one agent's information affecting another agent's strategy or the feasibility of contracts.
  4.  **Ex-Ante vs. Ex-Post:** Good's theorem is usually stated from the perspective of the agent *before* receiving the information. The insurance "worse off" result is also an *ex-ante* perspective (before anyone knows their risk). However, in the multi-agent case, the information revelation changes the game so much that the *ex-post* realities for some agents (high-risk) are disastrous compared to the world without the information, even though the information itself is accurate.

  **How to Categorize Situations: Key Questions**

  So, how can you tell if "more information" might backfire systemically?

  1.  **How Many Decision-Makers?** Is it one person optimizing, or multiple players whose choices interact? (Multi-player = potential for trouble).
  2.  **Does Information Alter the Rules?** Does the information fundamentally change *what options are available* or *the structure of the interaction* (e.g., destroying a mutually beneficial pooling equilibrium, enabling discrimination, triggering regulatory thresholds)? If yes, Good's theorem likely doesn't apply directly.
  3.  **Is There Asymmetric Information Enabling Cooperation?** Is the current beneficial outcome (like pooled insurance) *dependent* on some information being hidden? Revealing that information can destroy the basis for cooperation.
  4.  **Who Controls the Information & Actions?** Does the recipient of the information also control all the relevant actions? In insurance, *you* get the genetic info, but the *insurer* controls the offer/pricing based on *their* knowledge.
  5.  **Ex-Ante vs. Ex-Post Welfare:** Are we judging the value of information *before* anyone knows their type/state (ex-ante) or *after* (ex-post)? Systemic harms often appear clearly in ex-ante evaluations in multi-agent settings.

  **Conclusion: Harmony, Not Contradiction**

  Good's theorem is a bedrock truth **for a single rational agent making decisions in isolation.** Getting free information *before* choosing your action cannot harm *your own* expected outcome *in that context*. The genetic testing/insurance scenario is a **multi-agent strategic situation** where the revelation of free, accurate information **destroys the feasibility of a valuable social arrangement** (risk-pooling via insurance) that depended on *imperfect* information. The "harm" comes not from the information itself per se, but from how it reshapes the strategic landscape and *removes desirable options* for some players, leading to a Pareto-inferior outcome *ex-ante*.

  Your teacher was half-right – it *is* a "math class question" in the sense that the math of Good's theorem has specific, narrow assumptions. But it's *also* profoundly an economics question about how information shapes markets and strategic interactions. You've identified a deep and important boundary in decision theory! This tension is why fields like information economics, mechanism design, and AI safety (where Good also worked!) are so crucial – they grapple with the complex realities of information when multiple agents are involved.
