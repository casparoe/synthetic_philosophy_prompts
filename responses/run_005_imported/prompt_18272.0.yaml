  On balance, I think Maya has the stronger argument for sneakers specifically. Since sneakers are mass-produced functional items, the physical object is what matters most, and the lack of paperwork shouldn't make an identical item "worthless" if it serves the same purpose. Dev is right that symbolic value affects market price, but Maya is correct that for the object itself, it's the same.

