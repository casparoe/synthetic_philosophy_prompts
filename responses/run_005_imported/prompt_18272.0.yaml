  This directly addresses Dev's analogy. She's saying that for mass-produced goods, authenticity is about the production run being authorized, not about uniqueness.

  This seems strong. For example, in manufacturing, identical items from different batches might both be authentic if both authorized. But if one batch is unauthorized, it's "fake," even if identical.

