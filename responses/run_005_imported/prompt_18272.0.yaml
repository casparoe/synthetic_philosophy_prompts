  - **Move 6 (Maya):** Maya points out that sanctioned history is a legal/economic fact, not intrinsic to the object, and it's odd that this determines perceived quality or authenticity. This highlights a key issue: what do we value in an object? The physical thing or its story? Better of it: Maya, as she questions the foundation.

  **What both are overlooking:**

