answer: |-
  You've zeroed in on the central tension in Leibniz's metaphysics regarding individuals, contingency, and possible worlds. This passage from the *Discourse on Metaphysics* is notoriously challenging, and scholars continue to debate precisely how to resolve the apparent conflict you've identified. Let's break down the positions and Leibniz's proposed solution:

  ### The Two Sides of the Tension
  1.  **The "Transworld Identity" Intuition:** Leibniz *insists* that Caesar's crossing of the Rubicon is contingent ("its opposite is possible"). This strongly suggests that *this very Caesar* might not have crossed. It feels like Kripke's rigid designation *avant la lettre* – the name "Caesar" picks out the same individual across possible worlds where he makes different choices.

  2.  **The "Complete Concept" Doctrine:** Leibniz is equally adamant that the complete individual concept (CIC) of Caesar contains *every* predicate true of him, including crossing the Rubicon. The CIC defines Caesar's very identity. Altering *any* predicate (like crossing the Rubicon) results in a *different concept*, and thus, a *different individual*. This sounds remarkably like Lewis's counterpart theory: other possible worlds contain individuals *resembling* Caesar who didn't cross, but they aren't numerically identical to *this* Caesar.

  ### Leibniz's Solution: Hypothetical Necessity & God's Free Choice
  Leibniz attempts to dissolve the tension by introducing two key distinctions:

  1.  **Absolute vs. Hypothetical Necessity:**
      *   **Absolute Necessity:** Truths that hold in *all* possible worlds (like mathematical truths). Their opposites imply a contradiction.
      *   **Hypothetical Necessity:** Truths that hold *only* in worlds where certain prior conditions are met. Their opposites are *possible* (non-contradictory) *in general*, but *not* possible *given the specific conditions*.
      *   **Applied to Caesar:** "Caesar crossed the Rubicon" is *hypothetically necessary*. *Given* that God freely chose to create *this specific world* containing *this specific Caesar* (defined by his CIC), it follows *necessarily* that Caesar crossed the Rubicon. However, the *opposite* ("Caesar did not cross") is *absolutely possible* – it doesn't imply a contradiction. It just means there are other possible worlds God *could have created* where a different individual (defined by a CIC containing "did not cross the Rubicon") exists.

  2.  **God's Free Will as the Source of Contingency:**
      *   Contingency arises *not* from something within Caesar himself being indeterminate, but from **God's free choice** among infinitely many possible worlds.
      *   Each possible world is defined by a complete set of compossible individual concepts (CICs). The CIC of *this* Caesar is only instantiated in worlds where he *does* cross the Rubicon. God *could have* chosen a different world containing a different Caesar-concept where crossing doesn't occur.
      *   The "sequence of things which God has shown by his free will" (§13) is crucial. The necessity of Caesar's action is *conditional* upon God's prior free choice to actualize *this* world-sequence.

  ### So, Which Side Does Leibniz Land On?
  Leibniz's position is a **nuanced rejection of both strict transworld identity *and* a pure Lewisian counterpart theory**:

  1.  **Rejection of Simple Transworld Identity:** Leibniz *cannot* accept that *numerically the same individual* Caesar exists in a world where he doesn't cross the Rubicon. His CIC *defines* him. A Caesar who doesn't cross has a *different* CIC and is therefore a *different individual*. "Caesar" rigidly designates *only* the individual defined by the CIC that includes crossing the Rubicon in *this* world. In other worlds, "Caesar" rigidly designates whatever individual (if any) has *that specific, complete concept*. No other individual has it.

  2.  **Rejection of Lewisian Counterpart Theory (as usually understood):** Leibniz is *not* saying other worlds contain numerically distinct but qualitatively similar "counterparts" of Caesar. Other worlds contain *different complete individual concepts*. Some of these concepts might *resemble* Caesar's concept (e.g., "a brilliant Roman general born on such-a-date"), but they are fundamentally *different concepts* defining different individuals. The resemblance isn't what grounds the truth of counterfactuals; it's the *absolute possibility* of the *different concept itself* existing in another compossible set chosen by God.

  3.  **Leibniz's "Third Way":** The truth of "Caesar could have not crossed the Rubicon" is grounded in:
      *   The **absolute possibility** of a *different complete individual concept* that closely resembles Caesar's concept *except* for not containing the predicate "crossed the Rubicon."
      *   The **compossibility** of this different concept with other concepts forming a *different possible world*.
      *   **God's free choice** to actualize *this* world (with Caesar-crossing) instead of *that* world (with Caesar-not-crossing).
      *   **Hypothetical necessity:** *Given* God's choice of *this* world and *this* Caesar-concept, Caesar's crossing is necessary.

  ### Dissolving the Tension (The Leibnizian Move)
  The tension dissolves when we realize Leibniz separates two questions:

  1.  **What is possible for *an individual defined by a specific CIC*?** Answer: Only what is contained in its CIC. For *this* Caesar (CIC_C), not crossing was *never* possible. It's hypothetically necessary he crosses *because* he is CIC_C. Transworld identity fails here.
  2.  **What is possible *simpliciter*?** Answer: Other possible worlds exist containing *different* CICs (e.g., CIC_C*) resembling CIC_C but lacking "crossed the Rubicon". God could have chosen a world containing CIC_C* instead of CIC_C. *That* is the sense in which "Caesar could have not crossed" is true – *not* because CIC_C could vary, but because God could have instantiated a *different*, Caesar-resembling concept (CIC_C*) instead. Counterpart theory, strictly speaking, isn't needed because the resemblance is a consequence of the concepts being *alternatives*, not the grounding relation.

  ### Does Essentialism Concede to Lewis?
  Leibniz's essentialism (via the CIC) is indeed incredibly strong. **It forces a conclusion closer to Lewis than to Kripke, though distinct from both:**

  *   **Concession to Lewis:** Leibniz *must* say that statements about what "Caesar" *could have done* are ultimately statements about what *other possible individuals* (defined by different CICs) *do* in other possible worlds. The subject of the counterfactual isn't the *numerically identical individual* across worlds. This is a fundamental similarity with Lewis's denial of transworld identity.
  *   **Difference from Lewis:** Leibniz grounds this in God's mind and the realm of concepts. Possible worlds are collections of *concepts* (CICs), not concrete entities. The "resemblance" between CIC_C and CIC_C* is a consequence of God's rational ordering of possibilities, not a primitive counterpart relation. For Leibniz, "Caesar could have not crossed" is true because the *concept* CIC_C* (which includes not-crossing) is possible and compossible with other concepts, not because some concrete counterpart resembles Caesar. Lewis's theory is fundamentally about concrete similarity across concrete worlds.

  ### Conclusion
  1.  **Standard Reading:** The dominant scholarly view is that Leibniz's CIC doctrine **precludes transworld identity**. The individual *is* the concept. Altering a predicate alters the concept, creating a different individual. His insistence on contingency is saved by God's free choice among possible worlds, each containing *different sets* of complete individual concepts.
  2.  **Resolving the Tension:** "Contingent, but still Caesar" only works if "Caesar" refers rigidly to the *concept* CIC_C. For *that* concept, crossing is necessary *given* this world. The contingency lies in God *not instantiating that concept at all* and instantiating a different one instead. Leibniz isn't helping himself to transworld identity; he's grounding counterfactuals in alternative concepts chosen by God.
  3.  **Distinguishing the Statements:** Once the CIC doctrine is taken seriously:
      *   **"Caesar could have not crossed the Rubicon"** means: **"There is a possible world W*, distinct from the actual world W, containing an individual substance defined by a complete individual concept CIC_C*, which closely resembles the actual Caesar's concept CIC_C in many essential respects *but* contains the predicate 'did not cross the Rubicon' instead of 'crossed the Rubicon'. God could have chosen to create W* instead of W."**
      *   **"Some Caesar-resembling individual in another possible sequence didn't cross it"** is essentially *what Leibniz means* by the first statement. The "Caesar-resembling individual" *is* defined by CIC_C*.
  4.  **Conceding to Lewis?** Yes, Leibniz's strong essentialism forces him to reject transworld identity for individuals. Counterfactuals about individuals involve comparisons across different possible concepts/individuals in different worlds. While his framework (theological, conceptual) differs significantly from Lewis's (naturalistic, concrete), the core *denial* that the same individual exists with different properties in different worlds aligns him more with Lewis's *conclusion* than with Kripke's, even if his *reasons* and *machinery* are distinct. He doesn't "quietly change the subject" like Lewis might be accused of; he provides a sophisticated alternative framework (God, concepts, hypothetical necessity) to explain contingency without transworld identity. The tension you feel is real, but Leibniz's solution lies in shifting the ground of contingency from the individual to God's choice of which individual concept (among many resembling possibilities) to instantiate.
