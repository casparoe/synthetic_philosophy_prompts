prompt: |-
  I'm finishing a novel set among the Cambridge circle that founded the Society for Psychical Research, and for the podcast series accompanying the book, next week's guest is a historian of Victorian moral philosophy known for arguing that Henry Sidgwick's decades of testing mediums and telepathic subjects were not a lapse from the rigor of his ethics but a continuation of it: an attempt to supply, empirically, the premise his utilitarianism needed to close what he called the "dualism of practical reason" -- the gap between the rational authority of self-interest and of impartial duty. Draft eight to ten interview questions that keep her from simply restating this thesis, including at least one on whether proof of survival would actually establish the cosmic moral order the dualism requires rather than merely show that consciousness continues, one on why his published ethics never drew on any of the séance-room evidence if the two projects were really one enterprise, and one on how to distinguish, in his own scrupulous reporting of negative results, a philosopher testing a needed premise from a grieving friend testing a hope. For each, note the reply she's likely to give and add a follow-up that doesn't let her rest there.
