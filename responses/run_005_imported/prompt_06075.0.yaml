prompt: |-
  For a column on the hidden assumptions behind "utilitarian" arguments in welfare economics, I've been working through Harsanyi's aggregation theorem: if each individual's preferences over lotteries satisfy the von Neumann–Morgenstern axioms, the social planner's preferences do too, and the social ranking also respects a Pareto condition over those same lotteries, then social welfare must equal a fixed weighted sum of the individual utility functions. An economist I interviewed keeps raising Peter Diamond's 1967 objection to this: because the Pareto condition is imposed on individual utilities before any uncertainty is resolved, even an equally weighted version of Harsanyi's rule cannot prefer an arrangement that gives people a fair chance at an indivisible good over one that simply hands the good to a single person outright, whenever the two arrangements happen to yield the same expected sum of utility. Rather than the two-person, coin-flip case that shows up in most treatments of this objection, could you construct your own concrete scenario — a specific, real-world-flavored setting, at least three people, and explicit numerical utilities — that makes this indifference vivid? Please show the arithmetic confirming that the two arrangements really do tie under Harsanyi's rule, and then explain, in a sentence or two, exactly which premise of the theorem is responsible for that tie.
reasoning: |-
  We are going to construct a scenario with three people (A, B, and C) and an indivisible good (say, a kidney for a transplant) that only one of them can receive. We'll consider two arrangements:

  1. **Arrangement 1 (Fair Lottery)**: We flip a fair three-sided coin (or use a random device with equal probabilities) to decide who gets the good. Each person has a 1/3 chance of receiving the kidney.

  2. **Arrangement 2 (Assign to One)**: We assign the kidney to one specific person (say, A) with certainty.

  We will assume that receiving the kidney provides a utility of 1 to the recipient and 0 to the others. Without the kidney, utility is 0.

  We need to compute the social welfare under Harsanyi's aggregation theorem. According to the theorem, social welfare is a weighted sum of individual utilities. For simplicity, we assume equal weights (so each weight is 1/3). Then the social welfare of a lottery is the expected value of the weighted sum of utilities.

  Let's compute for Arrangement 1 (Fair Lottery):

  - Each individual has a 1/3 chance of getting utility 1 and 2/3 chance of 0.
  - Therefore, the expected utility for each individual is (1/3)*1 + (2/3)*0 = 1/3.
  - The social welfare is the weighted sum (with weights 1/3 each) of the individual expected utilities:
      W1 = (1/3) * (1/3) + (1/3) * (1/3) + (1/3) * (1/3) = (1/3)(1/3 + 1/3 + 1/3) = (1/3)(1) = 1/3.

  Alternatively, we can think of the social welfare as the expectation of the weighted sum of utilities in each state. In state A (A gets the kidney):
      Weighted sum = (1/3)*1 + (1/3)*0 + (1/3)*0 = 1/3.
  Similarly, state B: 1/3, state C: 1/3.
  Since each state has probability 1/3, the expected social welfare is (1/3)*(1/3) + (1/3)*(1/3) + (1/3)*(1/3) = 1/3.

  Now, Arrangement 2 (Assign to A):

  - A gets the kidney for sure: utility 1 for A, 0 for B and C.
  - Expected utility for A: 1, for B: 0, for C: 0.
  - Social welfare: (1/3)*1 + (1/3)*0 + (1/3)*0 = 1/3.

  So both arrangements yield the same social welfare (1/3) and are therefore indifferent.

  The premise of the theorem that is responsible for this tie is the **Pareto condition imposed on lotteries before uncertainty is resolved** (i.e., ex-ante). This condition requires that if every individual is indifferent between two lotteries (in terms of expected utility), then the social planner must be indifferent too. In this case, each individual has the same expected utility in both arrangements (1/3 for each in the fair lottery, and 1 for A and 0 for B and C in the assignment to A, but note that B and C have 0 in the assignment and 1/3 in the lottery, so they are not indifferent). However, the Pareto condition in Harsanyi's theorem is applied to the entire profile of utilities. The key point is that the theorem only requires the Pareto condition to hold when every individual's expected utility is the same in two lotteries? Actually, no: the Pareto condition in the theorem is defined over lotteries and requires that if one lottery is weakly preferred by every individual (according to their vNM preferences) then the social planner must weakly prefer it. And if every individual is indifferent, then the social planner must be indifferent.

  But in our case, let's check individual preferences:

  - In the fair lottery, each individual's expected utility is 1/3.
  - In the assignment to A: 
      A's expected utility is 1 (which is greater than 1/3) -> A strictly prefers assignment to A.
      B's expected utility is 0 (less than 1/3) -> B strictly prefers the fair lottery.
      C's expected utility is 0 (less than 1/3) -> C strictly prefers the fair lottery.

  So there is no unanimity: the assignment to A is not Pareto comparable to the fair lottery. Therefore, the theorem does not force indifference on the basis of Pareto. Then why are we getting the same social welfare?

  The reason is that the theorem requires the social welfare function to be a linear combination of the individual utilities. In this case, we have:

      Social welfare = w_A * u_A + w_B * u_B + w_C * u_C.

  In the fair lottery, the expected social welfare is:

      w_A*(1/3) + w_B*(1/3) + w_C*(1/3) = (w_A + w_B + w_C)/3.

  In the assignment to A:

      w_A * 1 + w_B * 0 + w_C * 0 = w_A.

  If we set equal weights (w_A = w_B = w_C = w), then:

      Fair lottery: (3w)/3 = w.
      Assignment to A: w.

  So they are equal. But note that the weights are fixed and positive. The theorem does not require equal weights, but if we have equal weights then we get this tie.

  However, the objection by Diamond is that the fair lottery should be considered more equitable. The theorem, by being linear, does not capture aversion to inequality in the distribution of chances. The premise responsible is the linear aggregation (i.e., the requirement that the social welfare function is linear in the probabilities) which is a consequence of the vNM axioms applied to the social planner and the Pareto condition.

  Specifically, the theorem assumes that the social planner's preferences satisfy the vNM axioms (including independence) and the Pareto condition. This forces the social welfare function to be linear in the probabilities and hence to be a weighted sum of the individual utilities. This linearity prevents the social welfare function from being sensitive to the distribution of risks (like the fairness of the lottery) beyond the expected utilities.

  Therefore, the premise that forces the tie is the combination of the vNM axioms for the social planner and the Pareto condition, which together imply that social welfare is a linear combination of individual utilities (and thus only expected utilities matter, not the distribution of chances per se).

  But note: in the above calculation, we assumed equal weights. However, the theorem allows for any fixed weights. Let's see if we can break the tie by choosing different weights? Suppose we set w_A = a, w_B = b, w_C = c.

  Fair lottery: (a+b+c)/3.
  Assignment to A: a.

  These are equal only if (a+b+c)/3 = a, i.e., if a = b+c. If we choose weights such that a, b, c are not equal and a is not equal to the average, then they are not equal. For example, let a=1, b=2, c=3. Then:

  Fair lottery: (1+2+3)/3 = 6/3 = 2.
  Assignment to A: 1.

  Then the fair lottery is preferred. But that doesn't capture the fairness concern because now we are giving more weight to B and C. The fairness concern would be that even if we give equal weight to each individual, we might prefer the lottery because it gives each an equal chance. But in the equal weight case, the two arrangements are tied.

  So the problem is that under equal weights, the social welfare function does not distinguish between a fair lottery and an unfair assignment when the expected utilities are the same for the society (but not for each individual). The theorem does not require equal weights, but if we want to capture the idea of fairness (equal treatment) we might set equal weights. However, even then, the linear form does not allow for an extra value on the fairness of the procedure.

  Therefore, the premise that is responsible for the tie in the case of equal weights is the linear aggregation form (which is a consequence of the vNM axioms for the social planner and the Pareto condition). This form implies that social welfare is the weighted average of individual expected utilities, and when weights are equal and the total expected utility is the same, then the two are indifferent.

  But note: in the assignment to A, the total expected utility (unweighted) is 1, while in the fair lottery it is 1 (since 1/3+1/3+1/3=1). So the total expected utility is the same. The theorem (with equal weights) then reduces to the sum of expected utilities, which is the same.

  In summary, the theorem forces social welfare to be a linear function of individual utilities and thus only the expected utilities matter, not the distribution of the chances. Therefore, any two arrangements that yield the same vector of individual expected utilities (and hence the same weighted sum) are socially indifferent, even if one is fair and the other is not.

  To make it vivid, let's choose a real-world scenario:

  **Scenario**: There is one dose of a life-saving vaccine that can save a life. Without it, the person will die (utility 0). With it, the person lives (utility 1). There are three patients (A, B, C) who are identical in every respect (so we assign equal weights). The two arrangements:

  1. Fair lottery: each has a 1/3 chance of getting the vaccine.
  2. Assign to A: A gets the vaccine for sure.

  Under Harsanyi's rule with equal weights, both arrangements have a social welfare of 1/3 (as computed above). Therefore, the social planner is indifferent.

  But intuitively, one might argue that the fair lottery is better because it gives each an equal chance. The theorem cannot capture that because it only considers the expected utilities and aggregates them linearly.

  The premise responsible is the linear form of the social welfare function (which is derived from the vNM axioms and Pareto condition) that makes it indifferent to the distribution of risks as long as the expected utilities are the same.
answer: |-
  ### Concrete Scenario Illustrating Diamond's Objection to Harsanyi's Aggregation Theorem

  **Setting:**  
  Three patients (Ava, Ben, and Chloe) urgently need an indivisible life-saving treatment (e.g., a heart transplant). Only one dose is available. Each patient derives a utility of **1** if they receive the dose (survival) and **0** if they do not (death). Utilities are von Neumann–Morgenstern (vNM) consistent. The social planner uses Harsanyi's rule with **equal weights** (weight = \( \frac{1}{3} \) per person).

  #### Arrangement 1: Fair Lottery  
  A lottery assigns the dose randomly with equal probability (\( \frac{1}{3} \)) to each patient.  
  - **Expected utility per person**:  
    \( \text{EU}_\text{Ava} = \frac{1}{3} \cdot 1 + \frac{2}{3} \cdot 0 = \frac{1}{3} \)  
    \( \text{EU}_\text{Ben} = \frac{1}{3} \cdot 1 + \frac{2}{3} \cdot 0 = \frac{1}{3} \)  
    \( \text{EU}_\text{Chloe} = \frac{1}{3} \cdot 1 + \frac{2}{3} \cdot 0 = \frac{1}{3} \)  

  - **Social welfare** (weighted sum of expected utilities):  
    \( SW_1 = \left( \frac{1}{3} \cdot \frac{1}{3} \right) + \left( \frac{1}{3} \cdot \frac{1}{3} \right) + \left( \frac{1}{3} \cdot \frac{1}{3} \right) = \frac{1}{9} + \frac{1}{9} + \frac{1}{9} = \frac{3}{9} = \frac{1}{3} \).  

  #### Arrangement 2: Assign to Ava  
  Ava receives the dose with certainty; Ben and Chloe receive nothing.  
  - **Expected utility per person**:  
    \( \text{EU}_\text{Ava} = 1 \cdot 1 + 0 \cdot 0 = 1 \)  
    \( \text{EU}_\text{Ben} = 0 \cdot 1 + 1 \cdot 0 = 0 \)  
    \( \text{EU}_\text{Chloe} = 0 \cdot 1 + 1 \cdot 0 = 0 \)  

  - **Social welfare** (weighted sum of expected utilities):  
    \( SW_2 = \left( \frac{1}{3} \cdot 1 \right) + \left( \frac{1}{3} \cdot 0 \right) + \left( \frac{1}{3} \cdot 0 \right) = \frac{1}{3} + 0 + 0 = \frac{1}{3} \).  

  #### Result  
  Both arrangements yield identical social welfare: \( SW_1 = SW_2 = \frac{1}{3} \).  
  Harsanyi’s rule is **indifferent** between the fair lottery (equal chances) and outright assignment to Ava.  

  ---

  ### Why the Tie Occurs: The Responsible Premise  
  The **Pareto condition** (applied *ex-ante*, i.e., to expected utilities *before* uncertainty resolves) forces social indifference whenever all individuals are indifferent *ex-ante*—but here, Ben and Chloe strictly prefer the lottery, while Ava prefers the assignment. The tie arises because the theorem’s linear aggregation of vNM utilities **ignores distributional equity in chances**, reducing welfare to a weighted sum of individual expected utilities. Thus, it cannot value the fairness of the lottery procedure itself, as this would require nonlinear (e.g., variance-averse) social preferences.
