prompt: |-
  So this happened to a friend of mine and I can't stop turning it over, especially since it bumps right into some stuff from the judgment-and-decision-making course I'm TAing this semester as part of my cog sci PhD. She was on the academic job market last cycle, got two offers, took the one she actually wanted, signed the contract, moved cities, started teaching — completely done, no way to undo any of it now. A few months later she found out, kind of by accident, that an old grad-school friend of hers sits on the hiring committee at the OTHER school, the one she turned down, and could probably tell her things like whether she was their actual first choice or just next in line after someone else said no, or whether they'd have matched or beaten her current salary if she'd pushed harder in negotiations. None of this changes anything going forward — there's no decision left for it to feed into, she's not un-signing anything. She keeps flip flopping on whether to just ask. Her reasoning is basically "why not, more information can't make me worse off, worst case I just ignore whatever I hear," but she also admits, kind of sheepishly, that shes a little scared to actually ask and can't really say why beyond a bad feeling in her stomach.

  This is bugging me because I'm pretty sure I've taught a version of the idea she's leaning on — something about how a rational Bayesian agent should never be made worse off by getting free information before making a decision, since you can always just act as if you hadn't seen it. Except her situation isn't really "before a decision" anymore; the decision already happened. So I genuinely can't tell whether that principle even applies here, or whether she's just borrowing the vibe of a rationality argument to justify a curiosity that has nothing to do with rationality at all. Is there an actual principled answer to whether she "should" want to know in a case like this, or does it just dissolve into a question of whether she personally handles rumination better or worse than regret, with no theory backing either answer?
reasoning: |-
  Okay, the user is presenting a scenario involving their friend who's already made a job decision but is now tempted to seek "post-decision" information about the rejected option. As a cognitive science PhD student TAing judgment-and-decision-making courses, they're wrestling with how rational choice theory applies (or doesn't) to this situation. 

  First, I need to unpack why this bothers them intellectually. They're correctly spotting a tension between textbook rationality models (where information is always non-harmful pre-decision) and messy real-life psychology where information can actively hurt after decisions are irreversible. Their friend's "why not, it's free information" stance is textbook pre-decision Bayesian reasoning misapplied post-decision. 

  The core theoretical issue here is the concept of "decision closure." Rational choice models assume decisions end with action, but psychologically, closure requires emotional resolution too. The friend's dilemma exposes how rationality frameworks ignore the temporal dimension of decisions—once actions are irreversible, new information can't improve outcomes but can poison retrospective evaluation. 

  I should also address the user's meta-question about whether this "should" have a principled answer. The beautiful/horrifying truth is that cognitive science has to bifurcate here: normatively, no information can change utility, so indifference is rational. Descriptively, humans are terrible at being indifferent. Studies on counterfactual thinking (e.g., Medvec & Savitsky 1997) show near-miss information amplifies regret disproportionately. 

  The friend's "bad feeling in her stomach" is probably her embodied cognition recognizing what her conscious mind won't admit—that this information threatens her current satisfaction. Evolutionarily, post-decision information scanning was adaptive (e.g., "did I really choose the safest cave?"), but in modern contexts it backfires spectacularly. 

  What the user might really need is teaching material gold: this case perfectly illustrates the gap between normative and descriptive decision theory. Could even design a class activity where students argue for/against seeking the info, then reveal psychological research on post-decision information effects. 

  Also worth noting the friend's "sheepish" admission suggests she intuits the irrationality but wants permission to indulge curiosity. The real answer might be therapeutic: if she can't resist asking, she should pre-commit to interpreting any answer as meaningless. But that's hard when humans are neural nets trained on loss aversion.
answer: |-
  This is a fascinating case study that exposes the gap between formal rationality models and the messy realities of human cognition—precisely why it's gnawing at you. Let's break it down:

  ### 1. **The Bayesian Principle (and Why It Doesn't Apply Here)**
     - **The Core Principle**: You're right—in standard rational choice/Bayesian models, *free information before a decision* cannot harm a rational agent. If information might lower expected utility, you ignore it and act as if you never received it. The key is **instrumental value**: information is only useful if it can *change an action*.
     - **The Problem**: Your friend's decision is **irreversible**. There is no action to adjust. The information has *zero instrumental value*. The Bayesian "free information" argument collapses post-decision because there's nothing left to optimize. What remains is purely **emotional/epistemic value**.

  ### 2. **Why She "Shouldn't" Ask (The Psychological Case)**
     - **Counterfactual Dysphoria**: Learning she was the "first choice" elsewhere might trigger regret ("I left money on the table!"). Learning she was a "backup" might devalue her current position ("They only wanted me after others said no"). Humans are terrible at ignoring information that challenges their narrative, even when it changes nothing materially.
     - **Cognitive Dissonance Amplification**: She chose School A, invested effort moving/starting, and likely bolstered her commitment psychologically ("I love it here!"). Information about School B threatens this hard-won equilibrium. Dissonance theory predicts she’ll feel *worse* regardless of the answer.
     - **The Curiosity Trap**: Her "why not?" stance ignores that *not knowing* is often protective. Research (e.g., Gilbert on affective forecasting) shows people overestimate the benefits of resolving uncertainty and underestimate the psychological toll of unwelcome facts.

  ### 3. **Why She *Might* Still Ask (The Human Factor)**
     - **Closure Seeking**: If she's ruminating, *not knowing* might feel like an open loop. For some personalities, even painful certainty is better than ambiguity.
     - **Ego Utility**: Being the "first choice" elsewhere could boost self-esteem (though risky—if she wasn’t, it backfires).
     - **Negotiation Intel for *Future* Jobs**: If salary data from School B informs future negotiations elsewhere, it has instrumental value—but only if she plans to re-enter the market soon.

  ### 4. **The Principled Answer**
     - **Normative View (Rational Choice)**: *Indifference*. Since no action can change, information has no rational bearing on welfare. She should be neutral.
     - **Descriptive View (Cognitive Science)**: **She should not ask**. Evidence is overwhelming that post-decision "useless information" often reduces satisfaction:
       - **Regret Theory**: Learning about "near misses" or better foregone options amplifies regret.
       - **Confirmation Bias**: She'll likely interpret ambiguous info negatively (e.g., "they would've matched salary" → "I failed at negotiating").
       - **Affective Misforecasting**: She expects "curiosity relief" but won't anticipate how answers may linger/poison her view of her current job.
     - **Your Friend's "Bad Feeling"**: That's her System 1 (intuitive cognition) correctly flagging risk. Her gut knows this isn't harmless.

  ### 5. **Practical Advice for Your Friend**
     - **Reframe the "Why Not?"**: Instead of "What could I gain?", ask "What could I *lose*?" If her current job feels good, why risk undermining it?
     - **Precommit to Acceptance**: If she *must* ask, she should pre-commit to:  
       *"Whatever I learn, I will view it as noise. It changes nothing about my present reality."*  
       (But humans are famously bad at this.)
     - **Focus on Present Actions**: Channel curiosity into improving her *current* position (e.g., "How can I excel here?" vs. "What if elsewhere?").

  ### Why This Matters for Your Teaching
  This case is a **perfect teaching moment** for your JDM course. It highlights:
  - **Bounded Rationality**: Humans aren't Bayesian robots. Post-decision information has costs.
  - **The Temporal Window of Rationality**: Information is only "free" if received *before* decisions close.
  - **Emotional Opportunity Costs**: Curiosity isn't free—it consumes attention and emotional bandwidth better spent elsewhere.

  **Conclusion**: Your friend is borrowing a pre-decision rationality argument for a post-decision emotional dilemma. The principled answer (from cognitive science) is that seeking this information *is* irrational—not because it violates logic, but because it predictably harms well-being. Encourage her to trust her gut. Some doors stay closed for a reason.

  If she needs academic backup, point her to literature on **counterfactual thinking** (Roese, 1997) and the **value of ignorance** (Hertwig & Engel, 2016). Sometimes, not knowing isn't a bug—it's a cognitive feature.
