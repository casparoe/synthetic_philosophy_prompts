  2. Clarity: The work must be clear in its expression so that the feeling is transmitted without confusion.
  3. Universality: The feeling must be one that can be shared by everyone, regardless of education or background. It should be accessible to a peasant and a professor alike.

  Tolstoy rejected art that required specialized training or refined taste to appreciate. He also dismissed much of the established canon, including Beethoven, Shakespeare, Wagner, and even his own earlier works.

