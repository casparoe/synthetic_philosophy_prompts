  Key points to cover: 
  - **Medical consensus**: Explain the irreversible loss of all brain function (including brainstem) as the standard, emphasizing it's not "partial" damage but total necrosis. Contrast this with persistent vegetative states where the brainstem lives. 
  - **Controversies**: Address the biological integration examples (healing, pregnancy)—these are real but rely on artificial support and don't imply consciousness or recovery. Some scholars argue this shows "brain dead" bodies are still biologically alive organisms, just irreversibly damaged. 
  - **Philosophical divides**: Break down the "biological" view (death = somatic disintegration) vs. "consciousness" view (death = loss of personhood). Note that organ procurement hinges on the current standard. 
  - **Practical realities**: Acknowledge that while legal criteria enable transplants, they emerged from scientific recognition that without a brain, the body cannot function as a whole. The ventilator creates a misleading appearance of life. 

  Crucially, avoid implying their mom was "wrong"; her instinct reflects a real perspective. Stress that both diagnoses (brain death and cardiac death) are socially/medically constructed but grounded in evidence—though ongoing debates exist. The user needs reassurance that their father's dignity was maintained either way. 

