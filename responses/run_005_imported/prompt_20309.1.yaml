prompt: |-
  So I've been reporting a piece on "information avoidance" — the research area on why people skip the genetic test for Huntington's, don't check the banking app when they're overdrawn, or ask the surgeon to tell their partner the biopsy result first instead of them. Theres a whole psych/behavioral econ literature on this by now. But when I ran a draft past a decision theorist friend, he said I was dancing around the actual theoretical backdrop: there's a classic result called Good's theorem (I.J. Good, late 60s) that supposedly proves a rational Bayesian agent should never expect free evidence to leave them worse off — the expected value of information is always non-negative, as long as they go on to update and act optimally on whatever they learn. He said most of the "look how irrational humans are" framing in the avoidance literature just skips over what the theorem actually licenses you to conclude, and now I cant stop turning it over.

  My editor hates wishy-washy conclusions, so here's what I need from you: an essay that actually gets into the guts of the theorem — why the proof goes through (it's basically a Jensen's-inequality trick: choosing your best action after you've seen the evidence beats committing to one before you've seen it, on average), and what exactly "non-negative in expectation" is and isn't promising you — and then adjudicates whether cases like Huntington's testing, spoiler-avoidance, or the classic finding that making information public can destroy an insurance arrangement that private uncertainty had made possible, are real counterexamples to the theorem, or just cases it was never making a claim about in the first place. Don't hedge and list considerations on both sides and shrug at the end — I want an actual verdict I can quote in the piece (a qualified one is fine, something like "the theorem is airtight but almost never the right thing to say to an information-avoider," if that's where you land), plus the argument that gets you there.
reasoning: |-
  Okay, the user is a journalist working on a piece about information avoidance. They've encountered Good's theorem, which states that rational agents should always value free information positively in expectation. Their decision theorist friend criticized the common "humans are irrational" framing in information avoidance literature, arguing it overlooks this theorem. Now the user needs a clear, non-hedged analysis for their editor.

  Hmm, this is an interesting challenge. The user needs both technical accuracy about the theorem and practical insight about its real-world applicability. They're clearly frustrated with superficial takes in existing literature and want substantive analysis. The editor's demand for a strong conclusion means I can't just list pros and cons - I need to take a stand.

  First, let's unpack Good's theorem properly. The core is indeed Jensen's inequality applied to Bayesian decision theory. The key moves are: 1) Defining the value of information as the difference between expected utility with information versus without. 2) Showing that even before seeing the evidence, the maximum expected utility after seeing it must be at least as high as committing to an action now. That's the Jensen step - the maximum of expectations is less than or equal to the expectation of the maximum.

  But here's where it gets nuanced. The theorem assumes perfect Bayesian updating and optimal action selection after receiving information. It also assumes no decision costs - the information is truly free. And critically, "in expectation" means averaged over possible information outcomes, not guaranteeing improvement in every scenario.

  Now for the supposed counterexamples:
  - Huntington's testing: People avoid it because they fear the psychological burden of knowing, even if treatment options exist. But Good's theorem doesn't account for the disutility of knowledge itself - it only considers instrumental value for decisions.
  - Spoiler avoidance: Here the information actively destroys enjoyment utility. The theorem assumes utility functions don't change based on knowledge state, which isn't true here.
  - Insurance markets: When hidden information enables pooling equilibria, revealing it can collapse the market. But this involves strategic interactions between agents - Good's theorem is about a single agent.

  The verdict emerges clearly: These aren't counterexamples because they violate the theorem's assumptions. The theorem is mathematically sound but describes an idealized rational agent. Real humans experience information as non-instrumentally valuable or costly, have imperfect rationality, and operate in social contexts.

  For the user's piece, the powerful insight is that information avoidance often makes perfect sense when we expand our understanding of "costs" beyond the theorem's narrow frame. The takeaway shouldn't be "people are irrational" but "the theorem's assumptions don't hold for human experience." That's a much richer story.

  I'll structure the essay to first explain the theorem rigorously, then analyze the cases through its lens, and deliver the qualified verdict the editor wants. The tone should be authoritative but accessible - this is for a general audience piece after all. The key is making the technical underpinnings clear without jargon overload.
answer: |-
  ## Good's Theorem & Information Avoidance: When Rationality Meets Reality

  Your decision theorist friend is right to point you toward Good's theorem. It *is* the foundational theoretical result against which real-world information avoidance must be measured. But he's also right that much of the "irrationality" framing in the literature often glosses over *why* the theorem holds and, crucially, *where* it applies. Let's dissect it and see if the classic avoidance cases truly break it.

  **The Guts of Good's Theorem**

  Imagine a rational Bayesian agent facing a decision under uncertainty. They have:
  1.  **States of the world (θ):** Unknown factors affecting outcomes (e.g., "Has Huntington's gene," "Biopsy result").
  2.  **Actions (a):** Choices available (e.g., "Get test," "Don't get test," "Specific treatment plan").
  3.  **Utility function (U(a, θ)):** Measures desirability of outcome from taking action `a` in state `θ`.
  4.  **Prior beliefs:** A probability distribution `P(θ)` over the states.
  5.  **Potential Evidence (X):** Information they *could* obtain for free (e.g., test result, bank balance, biopsy report). The agent knows the conditional probabilities `P(X|θ)` (the likelihood).

  *   **Without Evidence:** The agent picks the action `a*` maximizing *expected* utility *now*, based *only* on their prior:
      `EU_no_info = max_a [ Σ_θ P(θ) * U(a, θ) ]`

  *   **With Evidence:** *After* observing the specific evidence `X=x`, the agent updates their beliefs to the posterior `P(θ|X=x)` (via Bayes' rule) and picks the action `a*(x)` that maximizes expected utility *given* `x`:
      `EU_info(x) = max_a [ Σ_θ P(θ|X=x) * U(a, θ) ]`

  *   **The Value of Information (VOI):** The *expected* improvement in utility from getting the evidence *before* committing to an action. Crucially, it's the expectation over *all possible evidence outcomes* `X` (weighted by their prior probability `P(X)`):
      `VOI = E_X [ EU_info(X) ] - EU_no_info`

  **Good's Theorem:** `VOI >= 0`. The expected value of free information is always non-negative for a rational Bayesian agent who updates beliefs correctly and acts optimally on the information received.

  **Why the Proof Works (The Jensen's Inequality Trick):**

  1.  **Commitment vs. Flexibility:** Consider an agent forced to choose an action `a` *before* seeing `X`. Their expected utility for that fixed `a` is `EU(a) = Σ_θ P(θ) * U(a, θ) = E_X [ Σ_θ P(θ|X) * U(a, θ) ]` (by the law of total expectation).
  2.  **Optimal Action After Seeing X:** For any *specific* `X=x`, the agent can achieve `EU_info(x) = max_a [ Σ_θ P(θ|X=x) * U(a, θ) ]`. This is *at least as good* as sticking with any *fixed* action `a` chosen beforehand, for *that specific `x`*: `EU_info(x) >= Σ_θ P(θ|X=x) * U(a, θ)` for any `a`.
  3.  **Taking Expectations:** Take the expectation over `X` of both sides:
      `E_X [ EU_info(X) ] >= E_X [ Σ_θ P(θ|X) * U(a, θ) ]` for any fixed `a`.
  4.  **The Key Insight:** The right-hand side, `E_X [ Σ_θ P(θ|X) * U(a, θ) ]`, is exactly `EU(a)` – the expected utility of committing to action `a` *without* information (from step 1).
  5.  **Therefore:** `E_X [ EU_info(X) ] >= EU(a)` for *any* fixed action `a`. This includes the *best* fixed action `a*` chosen without information: `E_X [ EU_info(X) ] >= EU(a*) = EU_no_info`.
  6.  **Conclusion:** `VOI = E_X [ EU_info(X) ] - EU_no_info >= 0`.

  **The Jensen Connection:** The function `f(a) = Σ_θ P(θ|X=x) * U(a, θ)` is linear in the probabilities. The `max_a` operation is convex. Jensen's inequality states that for a convex function `g`, `E[g(Y)] >= g(E[Y])`. Here, `g` is the `max_a` operation over the linear function `f(a)`, applied to the random variable `X`. The proof shows `E_X [ max_a f(a, X) ] >= max_a E_X [ f(a, X) ]`.

  **What "Non-Negative in Expectation" Does (and Doesn't) Promise:**

  *   **Does:** On average, across *all possible evidence outcomes* `X`, getting the information leads to decisions yielding at least as much expected utility as not getting it. You cannot rationally *expect* to be worse off *overall* by getting free information and acting optimally on it.
  *   **Does NOT:**
      *   Guarantee you'll be better off in *every* possible scenario. You might get bad news forcing a painful but optimal action, whereas ignorance might have allowed blissful inaction. (`EU_info(x)` *can* be less than `EU_no_info` for *specific* `x`).
      *   Account for the *cost of processing* information (cognitive load, time).
      *   Account for the *impact of knowing* on utility itself (e.g., anxiety from knowing a risk exists, loss of suspense).
      *   Guarantee the information leads to a *different* action. Sometimes the optimal action is the same regardless of `X`.
      *   Apply if the agent won't/can't update beliefs correctly or act optimally on the information received.
      *   Apply if obtaining the information changes the world (e.g., via signaling) or the options available.

  **Adjudicating the Cases: Counterexamples or Boundary Conditions?**

  1.  **Huntington's Testing:**
      *   **The Avoidance:** Fear of psychological burden, hopelessness, impact on family planning, stigma.
      *   **Analysis:** Good's theorem only considers the instrumental value of information for making *future physical actions* (treatment, lifestyle, financial planning). It ignores:
          *   **Direct Utility Impact:** Knowing you carry the gene likely causes immediate and sustained negative utility (dread, anxiety) regardless of actions taken.
          *   **Action Set Constriction:** Knowing might eliminate the option of "hopeful uncertainty," an action with positive utility for some.
      *   **Verdict:** **Not a counterexample.** The theorem assumes utility depends *only* on state and action (`U(a, θ)`), not on the *knowledge state* itself. Huntington's avoidance demonstrates that knowledge itself can be a direct source of disutility, violating a core assumption.

  2.  **Spoiler Avoidance:**
      *   **The Avoidance:** Actively avoiding information about plot twists to preserve surprise and enjoyment.
      *   **Analysis:** Here, the information *directly destroys utility* derived from the experience (`U(a, θ)`). Knowing the spoiler (`X=x`) changes the state `θ` relevant to utility – it changes the *experience* of consuming the media. The "no spoiler" state has higher utility for the consumption action than the "spoiler known" state, regardless of the underlying plot (`θ`). Good's theorem assumes `U(a, θ)` is fixed; it doesn't anticipate the information changing what `θ` *means* for utility.
      *   **Verdict:** **Not a counterexample.** This highlights the assumption that states `θ` are defined *independently* of the information process and that `U(a, θ)` captures *all* relevant utility. Spoilers show information can alter the experiential state itself.

  3.  **Destruction of Insurance Markets (e.g., Rothschild-Stiglitz):**
      *   **The Phenomenon:** When insurers cannot observe risk types (private information), a pooling equilibrium *can* exist where both high and low-risk individuals get coverage. Making risk information public destroys pooling; high-risk individuals are priced out or low-risk individuals leave, potentially collapsing the market. Overall welfare *can* decrease compared to the private information case.
      *   **Analysis:** Good's theorem applies to a *single agent* making decisions based on new information about *states of nature*. Insurance market collapse involves:
          *   **Strategic Interaction:** Multiple agents (insurers, customers) reacting to the information and *to each other's actions*.
          *   **Equilibrium Shifts:** Information changes the *game* being played, altering the set of possible stable outcomes (equilibria).
          *   **Welfare Comparisons:** "Worse off" is often assessed at a *group level* (e.g., total surplus), not just for a single decision-maker.
      *   **Verdict:** **Not a counterexample to Good's theorem per se.** The theorem holds for an individual agent considering their *own* expected utility from acting on the information. However, it was never designed to handle the complex strategic interactions and equilibrium shifts in markets. The negative outcome arises from the *system-level* consequences of *multiple* agents acting rationally on the information, not from a single agent rationally avoiding information based on their own expected VOI calculation. The theorem doesn't claim information can't destroy beneficial social arrangements enabled by uncertainty.

  **The Verdict (For Your Editor):**

  > **Good's theorem is mathematically airtight for a rational Bayesian agent operating within its strict assumptions: free information, correct updating, optimal action based solely on state-action utilities, and no direct utility impact from knowledge itself. The classic cases of information avoidance – Huntington's testing, spoiler aversion, and insurance market collapse – are not counterexamples that break the theorem. Instead, they expose its boundaries. They demonstrate that in the real world, information often carries intrinsic psychological costs, alters the very experiences we value, or triggers complex social dynamics that fall outside the theorem's idealized, individualistic framework. The profound insight of Good's theorem is that rational agents should *instrumentally* value free information. The profound insight of information avoidance research is that humans often rationally value *not knowing* because knowledge itself has non-instrumental costs that the theorem excludes. Telling an information avoider they are violating Good's theorem is usually irrelevant; the theorem simply doesn't capture the full human calculus of dread, hope, surprise, and social equilibrium that drives their avoidance.**

  **In short:** The theorem holds, but it's almost never the right thing to say to an information avoider. Their reasons for avoidance are usually rational *within the broader, messier reality of human experience* that Good's elegant model intentionally abstracts away. Your piece should illuminate this crucial distinction, not pit "irrational humans" against an idealized rationality standard that ignores the very costs driving avoidance.
