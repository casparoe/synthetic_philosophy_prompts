prompt: |-
  Ok so I've been reading rationalist-adjacent blogs for something like a decade now (LW, the diaspora blogs, ACX, that whole cluster), and "hinge propositions" is one of those phrases that gets thrown around alot whenever someone wants to gesture at the idea of beliefs so basic you can't actually update on them, they're more like the frame the updating happens in. I'd always just absorbed the concept secondhand through blog posts though, so a couple weeks ago I finally sat down and read the actual source, Wittgenstein's On Certainty (the notes he was scribbling in roughly the last year and a half of his life, published posthumously). Most of it clicks fine on a first pass, but there's a tension between an early passage and the much more famous "hinge" passage later on that I can't hold together in my head, and my reading group didn't really resolve it either, so figured I'd bring it here instead.

  Early on he writes:

  §95. The propositions describing this world-picture might be part of a kind of mythology. And their role is like that of rules of a game; and the game can be learned purely practically, without learning any explicit rules.
  §96. It might be imagined that some propositions, of the form of empirical propositions, were hardened and functioned as channels for such empirical propositions as were not hardened but fluid; and that this relation altered with time, in that fluid propositions hardened, and hard ones became fluid.
  §97. The mythology may change back into a state of flux, the river-bed of thoughts may shift. But I distinguish between the movement of the waters on the river-bed and the shift of the bed itself; though there is not a sharp division of the one from the other.
  §98. But if someone were to say "So logic too is an empirical science" he would be wrong. Yet this is right: the same proposition may get treated at one time as something to test by experience, at another as a rule of testing.
  §99. And the bank of that river consists partly of hard rock, subject to no alteration or only to an imperceptible one, partly of sand, which now in one place now in another gets washed away, or deposited.

  Then much later, in the bit everyone actually quotes:

  §341. That is to say, the questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn.
  §342. That is to say, it belongs to the logic of our scientific investigations that certain things are in deed not doubted.
  §343. But it isn't that the situation is like this: We just can't investigate everything, and for that reason we are forced to rest content with assumption. If I want the door to turn, the hinges must stay put.

  My problem is that 343 seems to require that hinges literally cannot move - that's the whole point of the metaphor, a hinge that swings isn't doing its job as a hinge. But 96-99 is explicitly describing hardened propositions turning fluid and fluid ones hardening, the riverbed itself shifting over time. So which is it? Does "exempt from doubt" mean something like "permanently outside the space of things this practice can revise" (in which case the river-bed passage is describing a genuinely different, weaker phenomenon - ordinary belief change, not hinge-change), or is Wittgenstein actually fine with hinges themselves being temporary and revisable, in which case I don't get why he'd phrase 343 so absolutely - "the hinges must stay put" sure sounds stronger than "well, for now at least."

  There's a related thing some of us in the reading group kept getting stuck on: people round these parts like to gloss hinge propositions as basically an "ur-prior" - the fixed thing sitting outside the whole updating process and so never itself getting Bayesian-updated, along the lines of what shows up in the updateless-decision-theory stuff on LW. But if hinges can harden and soften the way 96-99 describes, that sounds less like an ur-prior (which by construction doesn't change) and more like just a prior with unusually high inertia. Is that mapping onto Bayesian priors defensible, or does it quietly assume hinges are truth-apt propositions that get assigned credences at all, which I have a feeling Wittgenstein wants to deny? And when a riverbed genuinely does shift - when a hinge stops being a hinge - does he give us anything like an account of that transition being rational or evidence-responsive, or is the whole point that from inside the game you never see it coming, more like a Kuhnian paradigm shift? This feels adjacent to the regress problem Yudkowsky pokes at in "Where Recursive Justification Hits Bottom" - I'm curious whether you think Wittgenstein's hinge/riverbed picture is actually a rival answer to that regress, or more of a refusal to accept that the question needs one. Would love a close reading of what's actually going on across these two passages rather than the blog-post-summary version I already know.
reasoning: |-
  Okay, let me unpack this user's query. They've been engaging with rationalist blogs for a decade and finally read Wittgenstein's *On Certainty*. The main tension they're struggling with is between §96-99 (riverbed metaphor) and §343 (hinge metaphor). Specifically, how can hinges be immovable when the riverbed shifts over time?

  First, I need to recall both passages. The riverbed section describes how propositions harden or become fluid, changing roles over time. The hinge analogy emphasizes that certain propositions must stay fixed for inquiry to happen. The user sees a contradiction: hinges must stay put, but the riverbed shifts. They also ask about the Bayesian interpretation—are hinges like an ur-prior or just high-inertia priors? And how do paradigm shifts fit in?

  I should start by examining Wittgenstein's concepts. Hinges aren't empirical propositions; they're the framework that allows empirical investigation. The riverbed shifting isn't the same as doubting a hinge during normal inquiry. Shifts occur on a different timescale, perhaps through cultural or practice changes, not rational updating. 

  The user mentions Yudkowsky's regress problem. Wittgenstein's approach avoids the regress by denying that hinges need justification—they're part of our form of life. The riverbed shift isn't rational but a change in the framework itself. So the answer to the tension lies in distinguishing between normal doubt (which hinges are immune to) and long-term, structural change (which affects hinges but isn't based on evidence).

  Next, the Bayesian mapping. The user questions if hinges are ur-priors. But Wittgenstein rejects assigning credences to hinges; they're not truth-apt. They're rules, not beliefs. The riverbed analogy shows that what's a hinge can change, but not through Bayesian updating. It's a pragmatic shift, not evidential. 

  The Kuhnian paradigm shift comparison is apt. When hinges change, it's not a rational process but a gestalt shift. The user's reading group might have missed that Wittgenstein is challenging the need for foundational justification. His solution is that the regress ends in action, not propositions.

  I need to ensure the explanation clarifies that the immovability of hinges is contextual—within a practice, they're fixed. Over historical time, they can change, but that change isn't like doubting a belief. It's a transformation of the framework itself. Also, emphasize that Wittgenstein's project is therapeutic, dissolving the need for justification rather than providing a theoretical answer.
answer: |-
  You've hit on one of the deepest tensions in *On Certainty*—and Wittgenstein's genius lies precisely in holding these two seemingly contradictory insights together. Let's break it down with close textual analysis:

  ### The Apparent Contradiction
  1. **§343's Fixed Hinges**:  
     "If I want the door to turn, the hinges *must* stay put." This describes **functional necessity**: for doubt/inquiry to operate *at a given moment*, certain propositions cannot be subject to that doubt. They're the *enabling conditions* for rational activity.  

  2. **§96-99's Shifting Riverbed**:  
     Propositions "harden" and "become fluid," the riverbed "shifts." This describes **historical contingency**: what functions as a hinge isn't eternal. Newtonian absolute space was a hinge for 18th-century physics; post-Einstein, it's fluid.  

  ### Wittgenstein's Resolution: Two Levels of Analysis  
  **a) Synchronic Necessity vs. Diachronic Fluidity**  
     - **Within a language-game/practice**: Hinges *are* immovable. You cannot "test" whether your senses generally deceive you *while* conducting an experiment. Doubt requires a framework.  
     - **Across historical/cultural contexts**: Entire frameworks shift. The riverbed's "hard rock" (e.g., "the world exists") might persist for millennia, while "sand" (e.g., "diseases are caused by humors") washes away.  

  **b) Hinges Aren't Propositions About the World**  
     This is crucial (§99, §341):  
     - When functioning as hinges, statements like "the Earth is very old" **aren't empirical claims** but **grammatical rules**. They define what *counts* as evidence.  
     - Example: In a geology lab, "rock strata take millennia to form" isn't up for testing; it's the rule letting you interpret carbon dating. But in a revolutionary scientific era, it *becomes* fluid.  

  ### Bayesian Mapping: A Category Error?  
  Rationalist attempts to frame hinges as "ur-priors" or "high-inertia beliefs" **misunderstand Wittgenstein's anti-epistemology**:  
     - **Against credences**: Hinges aren't assigned probabilities ("I have 0.99 credence that my hands exist"). They're *pre-probabilistic* (§342: "not doubted *in deed*").  
     - **Not truth-apt**: A hinge isn't "true/false" but *constitutive*. Asking "what evidence supports this hinge?" is like asking "what evidence supports chess rules?" (§95: "mythology... rules of a game").  
     - **Riverbed shifts ≠ Bayesian updating**: When a hinge dissolves (e.g., phlogiston theory), it's not because it accumulated low probability. It's a **collapse of the language-game itself**—a "loss of meaning" event (§§96-97: "mythology changes into flux").  

  ### Regress and Rationality: Wittgenstein vs. Yudkowsky  
  Yudkowsky's "Where Recursive Justification Hits Bottom" assumes justification *must* bottom out in a proposition. Wittgenstein **dissolves** the regress:  
     - **Justification ends in action** (§110, §204): We act *certainly* (e.g., catching a falling child), not because we've justified it, but because it's our "form of life."  
     - **Hinges aren't justified; they're lived**: The riverbed shifts via **pragmatic necessity**, not evidence accumulation. When Copernican astronomy replaced Ptolemaic, it wasn't due to "updating" but a **reconfiguration of intelligibility** (§§160-161).  
     - **Kuhn was right (and Wittgensteinan)**: Paradigm shifts *are* gestalt switches. We don't "rationally choose" new hinges; the old framework becomes untenable ("washed away" like §99's sand), and new practices emerge with new certainties.  

  ### Why the Tension is Productive  
  Wittgenstein isn't contradicting himself but showing **two perspectives on certainty**:  
     - **Immanent perspective** (doing science, doubting): Hinges *must* stay fixed (§343).  
     - **Transcendent perspective** (observing history): Hinges *can* change (§97).  

  The shift isn't "rational" from *within* a system—it's like the world itself rearranging (§§97, 99: "not a sharp division"). When hinges move, it feels less like updating and more like **conversion** (§92: "I act with *complete* certainty. But this certainty is my own").  

  ### Conclusion: Wittgenstein's Answer  
  1. **Hinges are functionally immutable during inquiry** (§343) but **historically contingent** (§96).  
  2. **Riverbed shifts aren't "rational updates"** but **transformations of praxis** (e.g., quantum mechanics didn't "update" classical physics; it rewrote the rules).  
  3. **This *dissolves* the regress problem**: Justification doesn't "bottom out"—it *ends* in what we *do* (§204: "Giving grounds... comes to an end"). The demand for ultimate justification is a **philosophical illusion** (§192).  

  You're right that blog summaries flatten this. Wittgenstein's power is in showing certainty as both bedrock *and* river—fixed when we stand on it, fluid when we map its flow. The tension isn't a flaw; it's the point.
