  **Justifications:**  
  - **Move 1 (score 1):** Marcus correctly identifies Quine's core argument about the indeterminacy of translation below the sentence level. His point that no "privileged" reference exists philosophically aligns with Quine's thesis. However, he overlooks that practical MT evaluation prioritizes utility over metaphysical truth (hence not 2).  
  - **Move 2 (score -1):** Elena misrepresents Quine. Her "follow-up questions" solution assumes ambiguity is merely empirical (underdetermination), but Quine’s indeterminacy is stronger: no evidence *can* resolve it, as alternative translation manuals always exist for any finite data. Her analogy to hypothesis testing ignores Quine’s distinction between underdetermination (empirical) and indeterminacy (conceptual).  
  - **Move 3 (score 2):** Marcus accurately defends Quine. He correctly notes that indeterminacy persists regardless of data volume because rival translation manuals can always explain all existing evidence while diverging on untestable claims. This distinguishes it from temporary underdetermination.  
  - **Move 4 (score 1):** Elena fairly challenges Marcus' implied verificationist premise (no evidence → no fact). Her physics analogy is apt: empirical equivalence doesn’t negate facts (e.g., quantum interpretations). However, she undercuts Quine’s specific claim about *meaning* by conflating it with physical reality—meanings aren’t "out there" like particles.  

  **What both miss:**  
  - **Practical context:** MT evaluation (e.g., BLEU) doesn’t require metaphysical "correctness." References are proxies for adequacy/fluency, and multiple references mitigate indeterminacy.  
  - **Linguistic pragmatism:** Human translation relies on shared conventions and goals (e.g., communication), not just philosophical "facts." Quine’s indeterminacy may not impede real-world translation utility.  
  - **Alternative metrics:** Neither mentions that modern MT evaluation (e.g., METEOR, BERTScore) uses richer representations (synonyms, embeddings) that partially address sub-sentential indeterminacy.
