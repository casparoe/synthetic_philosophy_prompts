answer: |-
  ## Dialogue: Fly-Snapping Frogs & Swampman

  **Setting:** A university seminar room, coffee cups scattered. **Dr. Aris Thorne** (Teleosemanticist, Millikan defender) and **Dr. Lena Vance** (Fodorian, Asymmetric Dependence defender) are mid-debate.

  **Lena Vance (Fodorian):** ...precisely, Aris! Take Millikan's own favorite example: the frog snapping at flies. On teleosemantics, the content of the frog's visual state is supposed to be **fly**, because that’s what the state was *selected for* detecting, what conferred the fitness benefit. But hold on. What *actually* causes the snap? Flies, yes, but also BB pellets, small dark pebbles tossed by mischievous grad students, even shadows under lab conditions! The frog snaps at *all* small, dark, moving things (SDMTs). So why isn’t the content simply **SDMT**? What pins it down to **fly** specifically? Selection history seems spectacularly coarse-grained here. Evolution "cares" about fitness *consequences* – eating *something* nutritious – not about carving nature at its joints like **fly** versus **SDMT**. Fitness is achieved by snapping at SDMTs, flies being just a subset!

  **Aris Thorne (Teleosemanticist):** Lena, you’re conflating the *efficient cause* with the *proper function*. The mechanism fires for SDMTs *now*, but that doesn’t define its content. The *proper function* – what it was *selected for* – is detecting **flies**. That’s the specific environmental feature that explains *why* this neural mechanism proliferated. Snapping at SDMTs is just the *means* by which it performed that function *in the past environment*. The content is fixed by the *explanation* of the mechanism's existence and persistence: catching flies. BB pellets are irrelevant to that history; they weren’t part of the selecting environment. The content isn't "whatever causes it now," it's "whatever it was *supposed* to cause the frog to snap at *because* that snapping led to fitness in the past." **Fly** is the relevant explanatory kind for the selection history; **SDMT** is just a disjunction cobbled together from the mechanism's current failure modes.

  **Lena Vance (Fodorian):** But *how* does selection favor **fly** over **SDMT** as the content-bearer? Imagine two possible worlds: in World A, frogs evolved snapping at flies (SDMTs that happen to be nutritious). In World B, frogs evolved snapping at nutritious SDMTs – some flies, some tiny beetles, some seeds. The actual causal pattern in the frog's brain state might be *identical*: reliably triggered by SDMTs. Yet, on teleosemantics, the content differs (**fly** vs. **nutritious SDMT**) based solely on an external historical fact invisible to the current system. That seems arbitrary for fixing *content* – the state the frog is *in* now. The frog’s state is tokened by SDMTs in both worlds; why should history magically change what that state *means* for the frog *now*? Selection history is too blunt an instrument to carve content finely enough.

  **Lena Vance (Fodorian):** (Pressing further) And this brings us to Swampman! Davidson’s thought experiment: a lightning strike in a swamp spontaneously assembles a molecule-for-molecule duplicate of you, Aris. Swampman walks, talks, *seems* to think about teleosemantics, and points at a frog snapping at a BB pellet and says, "Ah, misrepresentation!" But according to teleosemantics, Swampman has *no* selection history. His neural states weren’t selected *for* anything. So, does he have any mental content *at all*? Can he genuinely *misrepresent* the BB pellet as a fly? Or is he just making noises and moving his limbs? It seems absurd to deny Swampman content – he’s your perfect duplicate! But teleosemantics seems forced into this counterintuitive corner. Content requires history; no history, no content.

  **Aris Thorne (Teleosemanticist):** (Leans forward) Ah, Swampman. The perennial challenge. I *don’t* concede that Swampman has content, at least not initially. Think carefully. What *is* Swampman? A spontaneously assembled structure. His visual system *resembles* mine, but it lacks the crucial feature: it has no *proper function*. Its states weren’t designed *by selection* to correlate with anything. When Swampman points and says "fly," it's merely a noise caused by certain stimuli, akin to a weather vane pointing in the wind. There’s no *normativity*, no *should* about how his states relate to the world. He can’t *misrepresent* because there’s no *representing* happening in the first place. Representation, for the teleosemanticist, is inherently normative and historical. Swampman is a zombie with perfect mimicry, but mimicry isn't function. He *gains* content only if his states are incorporated into a system that *acquires* functions – perhaps through learning or interaction, bootstrapping a new history of proper functions. But at t=0, post-lightning? No content. The intuition that he *must* have content relies on smuggling in the very normativity my theory grounds in history.

  **Lena Vance (Fodorian):** That’s a hard pill to swallow, Aris. Most find it deeply counterintuitive. But let’s grant it for argument's sake. My asymmetric dependence theory avoids this neatly. For Swampman, the content of *his* visual state (call it R) is **fly** because: 1) R is caused by flies (under normal conditions). 2) R would be caused by BB pellets *even if no flies existed* (BB pellets → R is robust). BUT, crucially, 3) R would *not* be caused by flies *if no BB pellets existed* (flies → R is *not* robust). More precisely: the fly→R law is asymmetrically dependent on the BB pellet→R law. If the BB pellet law were false (say, pellets didn't cause R), the fly law would still hold. But if the fly law were false (flies didn't cause R), the BB pellet law *might* still hold. BB pellets cause R *only because* flies cause R. Flies are the primary cause; pellets are parasitic. Hence, R means **fly**, and snapping at a pellet is genuine misrepresentation – *without* any appeal to history. Swampman has content immediately because the right *synchronic* causal-counterfactual relations hold.

  **Aris Thorne (Teleosemanticist):** (Smiling) Ah, Lena, but here’s my counter-press. Your "normal conditions" clause – that’s the teleological wolf in causal sheep’s clothing! *What counts* as "normal conditions" for determining the primary cause? Isn't "normal" precisely the conditions under which the mechanism *was supposed to operate*? In the frog's case, isn't it "normal" that flies, not BB pellets, are present? You need a principled, non-circular, non-teleological way to define "normal conditions" to ground which causal relation is primary. Otherwise, asymmetric dependence risks being gerrymandered. Why isn't "normal conditions" defined as "when BB pellets *aren't* shot"? Then flies become primary only relative to an arbitrary baseline. Teleosemantics *grounds* the normativity of "normal" in selection history. Without that, your asymmetric dependence seems to float free, lacking a robust account of *why* one causal path is privileged as the content-fixer. Can you define "normal conditions" purely synchronically, without any implicit appeal to design or function? Otherwise, haven't you just covertly reintroduced the teleology you sought to avoid?

  **Lena Vance (Fodorian):** (Pauses, thoughtful) Hmm. "Normal conditions"... That *is* a persistent challenge. I’d argue it can be defined statistically or nomologically – the conditions statistically prevalent in the environment where the system operates, or the conditions under which the fundamental laws operate without interference. But... I admit, the line between 'interference' and 'normal variation' can be blurry without some implicit notion of what the system is 'for'. Perhaps it's not as cleanly non-teleological as I'd like. Conversely, Aris, your reliance on history leaves Swampman in a content-less void that feels deeply unsatisfying and struggles to explain the *manifest* intentionality of a duplicate. It seems we both have our Swampmen to deal with – yours lacks content, mine might lack a truly non-teleological grounding for normativity. Neither theory seems to escape its own swamp entirely.

  **Aris Thorne (Teleosemanticist):** (Nods slowly) A fair point, Lena. Perhaps the quest to naturalize intentionality inevitably grapples with either the ghost of teleology past or the specter of normativity present. The frog keeps snapping, the BB pellets keep flying, and we keep arguing about what it all *means*. Shall we get more coffee before the students arrive?

  **(The dialogue ends inconclusively, highlighting the core tensions in both theories: Teleosemantics struggles with fineness-of-grain and Swampman's intuition, while Asymmetric Dependence wrestles with grounding normativity and defining "normal conditions" without teleology.)**
