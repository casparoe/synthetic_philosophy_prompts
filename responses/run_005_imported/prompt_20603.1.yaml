answer: |-
  ## The Moral Asymmetry of War: Why Revisionism Prevails on Principle but Requires Pragmatic Restraint

  The debate between Michael Walzer’s defense of the moral equality of combatants (MEC) and Jeff McMahan’s revisionist challenge strikes at the heart of how we understand the ethics of killing in war. While Walzer’s framework offers pragmatic coherence and acknowledges the grim reality of combat, McMahan’s relentless focus on individual moral liability ultimately provides the more compelling account of the *deep morality* of killing in war, even if its full implementation in law and practice faces significant hurdles. The crucial distinction between excuse and justification, the weakness of the epistemic argument as a grounds for *permission*, and the failure of collective frameworks to override fundamental individual rights necessitate rejecting MEC as a moral truth, though it may retain a qualified role in legal conventions.

  **I. The Traditionalist Case: Walzer’s Moral Equality of Combatants**

  Walzer’s defense of MEC rests on powerful pillars emphasizing war’s unique political and collective nature:

  1.  **The Separation of *Jus ad Bellum* and *Jus in Bello*:** Walzer argues that the justice of the war (*ad bellum*) and the justice of the fighting (*in bello*) constitute distinct moral realms. Soldiers are instruments of the state, not its moral judges. Their primary duty *as combatants* is to fight according to the shared rules of warfare (discrimination, proportionality), regardless of the political cause they serve. This separation is essential to maintain any semblance of humanitarian constraint amid conflict.
  2.  **War as a Mutual Enterprise:** Soldiers enter a state of "belligerent equality." By agreeing to fight under the rules, they enter a reciprocal relationship where killing is a tragic but permissible act within the bounded violence of war itself. The aggressor soldier and the defender soldier are equally *doing their job* according to the shared norms of their grim profession. To deny this is to render one side inherently criminal, making restraint impossible and demonizing combatants who may have little choice.
  3.  **The Epistemic Argument:** Soldiers, especially conscripts or those subject to state propaganda and the "fog of war," are typically incapable of reliably determining the objective justice of their nation's cause. Holding them morally liable for fighting for an unjust cause imposes an impossible burden of knowledge. MEC protects soldiers from being condemned as murderers based on information they cannot reasonably access or evaluate.
  4.  **Pragmatic Necessity and Law:** Abandoning MEC would be catastrophic in practice. If soldiers fighting for an unjust cause were inherently moral criminals, how could they be treated as prisoners of war? How could ceasefires or surrenders be negotiated? The laws of war, designed to limit suffering, depend fundamentally on the symmetry of combatant status and privileges. MEC provides the bedrock for workable international humanitarian law (IHL).

  Walzer’s vision is one of tragic realism: war is hell, but within its inferno, combatants who fight cleanly are moral equals, engaged in a terrible but mutually permitted activity. Denying this equality, he fears, plunges war into moral chaos and removes all constraint.

  **II. The Revisionist Challenge: McMahan’s Liability-Based Asymmetry**

  McMahan dismantles MEC by anchoring the ethics of killing in war to fundamental moral principles governing individual self-defense and the defense of others:

  1.  **Liability Tracks Responsibility for Unjust Threats:** The core principle is simple: you are morally liable to defensive harm only if you are morally responsible for an unjustified threat of harm. Killing is permissible only against those who are liable. Soldiers fighting for an *unjust cause* (aggression) are, by their participation, responsible for contributing to an unjust threat. Therefore, they are liable to be killed by those defending against that aggression. Conversely, soldiers fighting *justly* (defense) are not responsible for an unjust threat; killing them is morally impermissible for the unjust aggressors.
  2.  **Rejecting the *Ad Bellum/In Bello* Divide:** McMahan argues this separation is morally illusory. The justice of the cause fundamentally shapes the moral status of the acts performed in its pursuit. Fighting "cleanly" for an unjust aim doesn't erase the underlying injustice; it merely means the killing isn't *aggravated* by violations of *in bello* rules. A bank robber who shoots only at armed guards is still committing murder, even if he avoids shooting tellers. Similarly, an aggressor soldier fighting discriminately is still engaged in an unjustified killing.
  3.  **The Excuse/Justification Distinction is Crucial:** McMahan readily concedes the **epistemic argument**. Soldiers fighting for an unjust cause are often *excused* or *blameless* for their participation due to duress, ignorance, indoctrination, or lack of reasonable alternatives. However, an *excuse* does not equate to a *justification*. Being excused means you are not *culpable* or *deserving of blame* for acting wrongly. It does not mean your act is *permissible*. A conscripted aggressor soldier might be blameless, but his act of killing a just defender remains morally *unjustified* because it violates the defender's right not to be attacked unjustly. His blamelessness makes him *not a murderer* in the sense of being culpable, but his killing is still morally forbidden.
  4.  **Individual Morality Over Collective Practice:** War *is* a collective endeavor, but McMahan insists it cannot override the fundamental moral rights and liabilities of the individuals involved. The collective nature of war explains *why* individuals participate and might be excused, but it doesn't transform an unjust killing into a morally permissible act. The rights violated – the rights to life and bodily integrity – are individual rights. Their protection must be grounded in individual moral liability.

  McMahan’s conclusion is stark: MEC is a profound moral error. Most soldiers fighting for an unjust cause lack the moral permission to kill their just opponents, even if they fight within the *in bello* rules and are personally blameless. Their killing is morally unjustified, even if excused.

  **III. Engaging the Pressure Points: Why Revisionism Prevails Morally**

  *   **Epistemic Argument & Excuse vs. Justification:** This is the crux. Walzer uses the epistemic constraint to argue for *permission*: "They can't know, therefore they are permitted to fight." McMahan counters that the epistemic constraint only negates *culpability*, not the underlying *wrongfulness* of contributing to an unjust threat. The burden of proof lies on those claiming a *positive permission to kill*. How can ignorance of the injustice of one's cause *generate* a moral permission to kill someone who has done no wrong? The just defender has a right not to be attacked. The aggressor soldier's ignorance doesn't dissolve that right; it merely explains why he isn't blameworthy for violating it. McMahan's distinction holds: blamelessness (excuse) is not moral permission (justification). Walzer's framework conflates these, granting permission where only excuse exists.
  *   **Collective Practice vs. Individual Liability:** While Walzer powerfully describes war's collective reality, he fails to demonstrate how this collective nature *morally transforms* the fundamental wrong of unjust killing. Saying war is "different" doesn't negate the individual rights at stake. The collective context explains the prevalence of excuses, but it doesn't create a new moral realm where rights violations become permissible through reciprocity among wrongdoers. The defender's right not to be unjustly attacked doesn't disappear because the attacker wears a uniform and follows certain conventions. McMahan correctly prioritizes the bedrock morality of individual rights and liability.
  *   **Does Revisionism Prove Too Much/Little?** Critics argue McMahan's view either condemns virtually all soldiers (if few wars are truly just) or is so sensitive to individual circumstances as to be useless. McMahan avoids this by focusing on the *structure* of liability. *If* a war is objectively unjust (e.g., clear aggression), then *most* combatants on the unjust side are liable. The practical difficulty of *knowing* objective justice doesn't change the moral fact. Regarding law, McMahan readily admits his theory describes "deep morality," not necessarily practical law. He argues law *should* aspire to reflect morality but must incorporate pragmatic constraints like epistemic limitations and the need for workable rules. This isn't a weakness but a recognition of law's distinct function. Revisionism doesn't demand immediate legal abandonment of MEC; it demands we recognize MEC as a pragmatic, morally imperfect legal convention, not a moral truth.

  **Verdict: Moral Asymmetry Affirmed, Legal Pragmatism Endorsed**

  The strongest arguments lead decisively to the conclusion that **Jeff McMahan is fundamentally correct about the deep morality of killing in war.** The moral equality of combatants is a fiction. Liability to be killed is asymmetrical, grounded in individual moral responsibility for contributing to an unjust threat. Soldiers fighting justly are morally permitted to kill those responsible for the unjust threat they face. Soldiers fighting unjustly lack this moral permission, even if their personal participation is blameless due to epistemic constraints or duress. The excuse/justification distinction is vital and undermines Walzer's conflation of blamelessness with permission. The collective nature of war explains excuses but does not morally sanitize unjust killings or override individual rights.

  **However,** this moral verdict necessitates a **qualified endorsement at the level of law and practice.** McMahan himself acknowledges that the epistemic problems, the potential for abuse, the need for clear and enforceable rules, and the catastrophic consequences of abandoning combatant privileges in IHL mean that the *legal* equality of combatants – the core of IHL – remains a tragic necessity. Law must operate with bright lines and presumptions that deep morality may not always support. Therefore, while we must reject MEC as a *moral principle*, recognizing it as a profound error that obscures the true injustice of aggression, we should pragmatically **endorse the *legal* equality of combatants as a convention essential for mitigating the horrors of war.** This is not a contradiction, but a recognition of the gap between the morally ideal and the practically achievable, and the distinct functions of moral philosophy and humanitarian law. The deep morality is asymmetrical; the law, for now, must remain symmetrical. Our task is to narrow that gap where possible, guided by the moral truth McMahan reveals.
