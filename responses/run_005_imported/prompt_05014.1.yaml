answer: |-
  Here's the precise breakdown of the Doris/Harman debate and the strongest defenses of character consistency relevant to your novel-writing dilemma:

  **The Core Situationist Challenge (Beyond Milgram/Zimbardo):**
  Situationism argues that empirical evidence shows behavior is overwhelmingly predicted by *situational features* rather than *global, stable character traits*. The "greatest hits" illustrate this, but the deeper point is that the consistency required for Aristotelian virtues (e.g., "honest" across diverse situations) simply isn't found in the data. People are surprisingly inconsistent.

  **Doris vs. Harman: The Nuances of the Skepticism:**

  1.  **John Doris ("Lack of Character" - 2002):**
      *   **Position:** *Fragmentation, not Absence.* Doris doesn't deny that people have *some* enduring psychological features influencing behavior. He denies the existence of *robust* character traits – virtues (or vices) that manifest consistently across a wide range of different situations.
      *   **Key Argument:** **The Argument from Behavioral Inconsistency.** He meticulously reviews psychological studies showing that behavior in trait-relevant situations (e.g., helping behavior, honesty tests) correlates much more strongly with minor situational variations than with scores on personality tests *supposedly* measuring that trait. E.g., finding a dime in a phone booth dramatically increased helping behavior later, regardless of "helpfulness" scores.
      *   **Implication:** Character isn't *robust*. People have "local traits" – dispositions activated only in very specific contexts (e.g., "honest with friends but not with the tax office," "brave in battle but not at the PTA meeting"). Virtues, as traditionally conceived (stable across contexts), are empirically unsupported.
      *   **For Your Novel:** Doris would say your "brutally honest" lead *can* exist, but *only* if their honesty is highly context-dependent (e.g., brutally honest when giving tactical advice in battle, but tactful or deceptive in social settings). Their honesty isn't a *global* virtue driving them in all situations.

  2.  **Gilbert Harman ("Moral Philosophy Meets Social Psychology" - 1999 & later):**
      *   **Position:** **Radical Skepticism / Eliminativism.** Harman takes a harder line. He argues that the empirical evidence suggests **character traits (as commonly understood) *don't exist at all***.
      *   **Key Argument:** **The Explanatory Dispensability Argument.**
          1.  Situationism shows behavior is best predicted by situations.
          2.  Attributing behavior to character traits doesn't add any *explanatory power* beyond what's provided by the situation and basic psychological mechanisms (learning, perception, desire).
          3.  Therefore, character traits are an unnecessary postulate – like phlogiston or the ether. We should eliminate them from our psychological and moral vocabulary.
      *   **Implication:** It's not just that virtues aren't robust; it's that *talking about character traits is fundamentally mistaken*. People don't *have* honesty or cowardice in any meaningful sense. They just react to situations.
      *   **For Your Novel:** Harman would say your core virtues are pure fiction, psychologically speaking. Your characters' actions should *only* be explained by the immediate plot pressures and their basic drives/memories, *not* by reference to stable virtues like "bravery."

  **The Comeback: Defending (a Revised) Virtue Ethics:**

  Situationism landed a heavy blow, but virtue ethics didn't die. Here are the strongest responses, moving beyond simple "fiat":

  1.  **Response-Dependent Virtues / The "Sustaining Social Environment" (Maria Merritt, John Doris later, Nancy Snow):**
      *   **Argument:** Virtues aren't *inherent*, static properties of a person. They are dispositions that *depend on being sustained by a supportive environment*. A person can be "honest" *because* they are embedded in relationships, institutions, and practices that *reward and reinforce* honesty and make it easier to maintain.
      *   **How it Differs:** This accepts the situational data but argues virtues *can* be stable *within* supportive contexts. The virtue isn't purely internal; it's a dynamic relationship between the person and their world. Losing the supportive environment can fragment the virtue.
      *   **For Your Novel:** This is **GOLD** for you. Your characters' core virtues *can* hold steady **precisely because you control their world**. You can *engineer* their environments, relationships, and communities to be the "sustaining social environment" for their specific virtues. The brave leader has loyal comrades who rely on them; the honest one has found a niche where truth is valued (or their honesty creates that niche). Show how their world *supports* their virtue. When you *do* want to test them, threaten or remove that supportive environment. This makes their struggle *psychologically plausible*.

  2.  **Cognitive-Affective Personality System (CAPS) & If-Then Signatures (Walter Mischel, Yuichi Shoda):**
      *   **Argument:** Situationism mischaracterizes personality. Personality isn't about *global* traits, but about *stable patterns of variation* in response to situations. People have consistent "*if-then*" behavioral signatures (e.g., "IF criticized, THEN withdraws"; "IF threatened, THEN attacks"). These are stable dispositions, but they are *situation-contingent*.
      *   **How it Differs:** This provides a framework for *predictable character consistency* that incorporates situational sensitivity. A person *is* consistent – not in behaving the same everywhere, but in reacting to *specific types* of situations in characteristic ways.
      *   **For Your Novel:** Define your characters' virtues not just as "brave," but as "*brave when...*" (e.g., "brave when protecting the weak," "brave when facing physical danger," "brave when making a moral stand"). Show their *characteristic pattern of response* to *specific triggers* relevant to their virtue. This allows for nuance and depth without abandoning consistency. Their "brutal honesty" might manifest *specifically* when sensing hypocrisy or deception, not necessarily in every casual chat.

  3.  **Narrative Identity & Practical Wisdom (Dan P. McAdams, Alasdair MacIntyre - adapted):**
      *   **Argument:** Character is less about isolated behavioral dispositions and more about the *narrative identity* a person constructs and strives to live out. Virtue involves *practical wisdom* (phronesis) – the learned capacity to perceive what a situation demands and act accordingly *in line with one's values over time*. Consistency is found in the *commitment to a narrative* and the *deliberative effort* to enact it, not in robotic behavioral repetition.
      *   **How it Differs:** Focuses on agency, reflection, and long-term narrative coherence. A virtuous person *works* to recognize situational pressures and act virtuously *despite* them, learning from failures. Consistency is an *achievement*, not a starting point.
      *   **For Your Novel:** Show your characters *actively maintaining* their virtue. Show their *internal deliberation* when tempted. Show them *reflecting* on past failures to live up to their virtue. Show them *choosing* their core value *in the face of* situational pressure. The virtue isn't an automatic reflex; it's a defining commitment they consciously uphold. This makes their consistency a *story*, not a static fact.

  **Verdict for Your Novel:**

  *   **Is it naive?** Only if you portray the virtues as *magically immune* to all situations, operating like simplistic on/off switches with no internal struggle, deliberation, or dependence on context/support. The old "by fiat" approach *is* naive.
  *   **Is it "just fine actually"? YES, ABSOLUTELY – if you incorporate the insights:**
      1.  **Use "Sustaining Environments":** Show *how* the character's world (friends, role, mission, beliefs) actively supports their core virtue. Make the environment part of the reason the virtue holds.
      2.  **Define "If-Then" Signatures:** Be specific about *when* and *how* the virtue manifests. What are the characteristic triggers and patterns? Show it's not global, but *reliably present* in the situations that define the character's role in the story.
      3.  **Show the Work:** Depict the *effort*, *deliberation*, and *occasional failures*. A virtuous character isn't perfect; they are *committed*. Show them recognizing situational pressures and *choosing* their virtue anyway, or struggling to recover it after a lapse. This makes the consistency *earned* and believable.
      4.  **Leverage Narrative Identity:** Make the core virtue central to the character's *sense of self* and *purpose*. Show them defining themselves by it and actively working to live up to it.

  **Conclusion:** Situationism killed the idea of virtues as simple, global, situation-proof personality atoms. But it didn't kill character consistency *in fiction*. By embracing the concepts of **sustaining environments, situation-specific signatures, deliberate commitment, and narrative identity**, you can create characters whose core virtues feel psychologically plausible, deeply earned, and powerfully resonant *because* they hold steady against the storm – precisely *because* you, as the author, have shown *why* and *how* they hold. Your housemate is right about the old assumption being blown up, but wrong if they think compelling, consistent virtues are impossible on the page. The comeback is strong, and it's perfect fuel for great storytelling. Go make those virtues *work* for their consistency!
