  Hmm... the military/admin cost element seems transformed. Today's territories are largely self-funded, removing Smith's primary objection. But does that make them beneficial? Not necessarily. The financial secrecy they enable might create systemic risks - something Smith would likely condemn as "pernicious" based on his views on monopolies and market distortions.

