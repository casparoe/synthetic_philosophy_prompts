prompt: |-
  I've spent most of the past decade doing research in social psychology, where a result's scientific legitimacy is, in practice, settled by whether it survives peer review at a reputable journal. A senior colleague recently argued that this is not merely our field's best available proxy for a finding being methodologically sound, but constitutive of it: a result simply is sound once qualified reviewers accept it, and doubting this, on her view, is rather like asking whether a bachelor could secretly be married. The question isn't purely academic for me, since I'm deciding whether to spend the next year of my postdoc trying to replicate a result that, on her view, is already beyond doubt simply because it cleared review. I resist her position, partly because it seems to render our field's periodic replication scandals conceptually impossible rather than merely common and embarrassing, yet I can't identify any reviewer-independent standard of soundness that reviewers are supposedly trying, and sometimes failing, to track. I notice I'm confused: is she right that I'm reaching for a distinction without a difference, or is there a real crux here that her view dissolves too quickly?
reasoning: |-
  Okay, let me unpack this user's dilemma. They're a social psychology postdoc wrestling with a senior colleague's claim that peer review acceptance *defines* methodological soundness, not just indicates it. The user feels this can't be right—it would make replication crises impossible—but struggles to articulate an alternative standard. 

  Hmm, this is actually a deep philosophy-of-science question disguised as a practical career decision. The user's tension is palpable: they mention wasting a year replicating what's deemed "settled" science, yet their intuition screams that reviewers aren't infallible. Smart of them to notice how their colleague's view makes replication scandals logically incoherent. That's the red flag.

  First, I need to validate their skepticism. The colleague's analogy to bachelors is misleading—marital status is a definitional truth, while scientific soundness is about correspondence with reality. Peer review is human judgment, not logic. History proves this: cold fusion passed peer review. Replication failures in psychology (like ego depletion) demonstrate the gap.

  But the user's stuck because they can't name what reviewers *should* be tracking. Ah! That's the key. The standards exist *independently*: proper controls, statistical power, pre-registration, reproducibility. Reviewers approximate these, often poorly. The user's field actually *has* developed concrete criteria post-crisis—they're just not applied consistently. 

  I should emphasize this isn't abstract. For their postdoc decision: if the published study lacks power analysis or pre-registration, replication may be urgent. If it followed best practices, replication might wait. The colleague's view risks letting flawed papers become permanent "truth." 

  Also, the user's identity matters. As an early-career researcher, challenging a senior's dogma takes courage. They might fear seeming naive. I'll normalize their doubt—many philosophers (Popper, Lakatos) wrestled with this. The real crux is whether science self-corrects. If peer review = truth, self-correction stops. That's dangerous.

  Practical advice: Frame replication not as doubting reviewers, but as science working properly. Suggest auditing the study's methods against TOP Guidelines or p-curve analysis. That offers an "independent standard." Their instinct is correct—there's a vital difference between passing review and being robust. They shouldn't abandon skepticism.
answer: |-
  You've hit upon a profound tension at the heart of empirical science, especially in fields like social psychology. Your colleague's position represents a **strong social constructivist view** of scientific validity, while your unease reflects a **realist/empiricist commitment** to methodological rigor independent of social processes. Neither view is entirely right or wrong, but her position oversimplifies in dangerous ways. Here's why:

  ### The Crux Your Colleague Overlooks
  1. **Peer Review as a Fallible Human Process**  
     Peer review assesses *plausibility*, not truth. Reviewers operate under:
     - Time constraints and cognitive biases
     - Limited access to raw data/methods details
     - Field-specific paradigmatic assumptions
     - Inability to rerun analyses or check code thoroughly  
     *(Example: The infamous "Sokal Squared" hoax exposed how flawed papers using trendy jargon could pass review in elite journals).*

  2. **The Replication Crisis as Empirical Counterevidence**  
     If peer review were constitutive of soundness, failed replications of peer-reviewed work (e.g., Open Science Collaboration's 2015 findings that only 36% of psychology studies replicated) would be logically impossible. Their very existence disproves her claim.

  3. **Independent Standards DO Exist (Even If Imperfectly Applied)**  
     Reviewers *are* supposed to track objective methodological criteria:
     - **Statistical Validity:** Appropriate power, correct tests, alpha control
     - **Internal Validity:** Proper controls, randomization, manipulation checks
     - **Construct Validity:** Sound operationalization of variables
     - **Reproducibility:** Transparency in methods, data, and analysis code  
     The problem isn't the *absence* of standards—it's inconsistent *application* due to human/social factors.

  4. **Temporal Dimension**  
     Science is iterative. What appears sound today may be overturned tomorrow by new evidence or methods. Peer review is a snapshot, not an eternal guarantee.

  ### Why Her "Bachelor" Analogy Fails
  - **Bachelors** are defined *by* marital status (linguistic convention).
  - **Scientific soundness** is defined *by* correspondence with reality and methodological integrity (epistemic ideal).  
  Peer review is evidence *of* soundness—not its definition. Conflating the two commits a category error.

  ### Practical Implications for Your Postdoc
  | Approach | Risk | Reward |
  |----------|------|--------|
  | **Replicate the study** | High opportunity cost; may fail even if original was valid | Could uncover flaws; strengthen field's knowledge; high-impact publication |
  | **Accept it as settled** | Risk building on shaky foundations; ethical issues if result is false | Focus resources on new research |

  **Recommendation:**  
  Conduct a **feasibility assessment**:
  1. Audit the original study's methodology:  
     - Was power ≥ 80%?  
     - Pre-registered?  
     - Raw data available?  
     - Use questionable research practices (p-hacking, HARKing)?
  2. Check if **direct replications** already exist (many journals now prioritize these).
  3. Consider a **conceptual replication** if methodology is robust but context warrants retesting.

  ### Philosophical Resolution
  Your colleague is right that peer review is our *best institutional proxy* for validity in the absence of universal direct scrutiny. But you're correct that it's not *constitutive* of validity. The distinction matters precisely because:  
  > **Peer review is a gatekeeping mechanism; reproducibility is an ontological test.**  

  Fields mature by recognizing that social processes (review) and epistemic robustness (soundness) must align *through error-correction*—which requires doubting published work. The replication crisis wasn't a failure of peer review *per se*; it was a failure to acknowledge that peer review alone is insufficient as a truth criterion.

  **In short:** Proceed with clear-eyed skepticism. Your instinct to question is the engine of scientific progress. The real standard reviewers *should* track is **fidelity to empirical reality**—and our ability to assess that improves precisely when we test published claims.
