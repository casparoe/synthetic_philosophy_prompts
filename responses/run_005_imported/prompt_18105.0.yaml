  I'm a novelist working on a character who's basically a George Eliot type -- loosing her Christian faith young but ending up more devoted to duty and self-sacrifice than anyone still in the pews. Don't just give me the thing everyone quotes (that "God, Immortality, Duty" bit from the Cambridge garden anecdote) -- that's the one fact about her religion everybody already knows and I need more than that. What I actually want is your real opinion: was the ethic she built out of Feuerbach and Comte -- sympathy, fellow-feeling, the whole "religion of humanity" thing -- a genuinely independent, naturalistic morality, or is it secretly just Christian self-renunciation with the theology sanded off (which is kind of what her own novels suggest, honestly, with all that Maggie Tulliver/Dorothea Brooke-style renunciation)? Write me an essay that weighs the best version of both arguments but actually lands on a side and defends it -- I don't want "both have merit," I need something my character could actually live by.
