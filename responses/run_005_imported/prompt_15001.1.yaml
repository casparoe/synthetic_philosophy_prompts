  Need to balance the bioethicist's argument with the committee's operational realities. Point out that categorical floors might be too rigid and hard to define, while graduated scales are flexible. But also admit that current practices might not sufficiently protect sophisticated animals. Recommend further study or a subcommittee to explore specific prohibitions for certain procedures.

  Also, the user needs to recommend a disposition. Given the high distress and pigs' intelligence, reject or require more modifications. Maybe insist on better analgesia, post-op care, or endpoints. For policy, suggest evolving towards stronger protections but not abandoning cost-benefit entirely. This shows respect for the ethical concern while being pragmatic.

