answer: |-
  Here's a breakdown of Sidgwick's argument and its implications:

  1.  **What is "scandalous"?** Sidgwick is **not** primarily claiming the *reality* of the phenomena is scandalous, nor is he scandalized by the mere *existence* of the dispute. He is scandalized by **the *persistent unresolved state* of the dispute *despite* significant evidence warranting serious investigation.** Specifically:
      *   **The Phenomena's Potential Importance:** He emphasizes that *if* even a fraction of the reported phenomena are true, they would be of enormous scientific importance ("impossible to exaggerate the scientific importance").
      *   **Credible Testimony:** He points to the sheer volume and quality of testimony ("so many competent witnesses").
      *   **Public Interest:** He notes significant interest in resolving the question ("so many others profoundly interested").
      *   **Scientific Inertia/Incredulity:** He condemns the *response* (or lack thereof) of the "educated world" – their persistent, dismissive "attitude of incredulity" despite points 1-3.

      **Plain English Summary:** Sidgwick finds it scandalous that the scientific establishment simply dismisses these potentially revolutionary phenomena out of hand, ignoring credible reports and public interest, *without* conducting a proper, serious investigation to resolve the question definitively. The scandal is the *failure to investigate* properly, leading to a persistent, unresolved dispute based on prejudice rather than evidence.

  2.  **"Scandal" vs. Neutrality:** Sidgwick's use of "scandal" **is rhetorically strong but *not* necessarily inconsistent with his stated neutrality about the phenomena's *reality*.**
      *   **Target of Scandal:** The "scandal" is directed at the *scientific community's dismissive attitude and lack of investigation*, not at the phenomena themselves or their non-existence. He's scandalized by the *process failure*, not the potential outcome.
      *   **Basis for Scandal:** His outrage stems from the *logical inconsistency* and *intellectual laziness* he perceives: phenomena of potentially immense importance, backed by credible reports, are being ignored based on prejudice rather than evidence. This *failure of scientific duty* is the scandal.
      *   **Neutrality on Phenomena:** When he declares the SPR "unpledged" and committed to proceeding "without any foregone conclusion," he is explicitly stating the *Society's* methodological stance. They will investigate *without* assuming the phenomena are real *or* fake beforehand. This neutrality is about *methodology*, not about the *urgency* or *importance* of the question.
      *   **Consistency:** One can be passionately convinced that a question *deserves* rigorous investigation (and that failing to do so is scandalous) while simultaneously committing to investigate that question with an open mind and no pre-determined outcome. Sidgwick believes the *evidence warrants investigation*, not that the evidence *proves* the phenomena true. His passion is for *resolving the dispute through science*, not for a specific outcome.

  3.  **"Competent Witnesses": Evidential Weight or Appeal to Authority?**
      *   **Doing Evidential Work:** Sidgwick is using the witnesses strategically, and it *is* doing significant evidential work *within the context of his argument*. He's not claiming their testimony *proves* the phenomena real (he explicitly avoids that). Instead, he uses them to establish:
          *   **Plausibility:** That the reports aren't *prima facie* absurd or coming only from known frauds or the mentally unstable. "Competent" implies reliability, sanity, and observational skill.
          *   **The Need for Investigation:** The sheer number and credibility of the witnesses mean the reports *cannot reasonably be dismissed out of hand*. They constitute a body of *prima facie* evidence demanding scientific scrutiny. Ignoring such testimony *is* unscientific.
          *   **Contrasting with Incredulity:** He highlights the disconnect: reputable people report extraordinary things, yet the scientific establishment refuses to even look, based solely on prejudice. This makes the establishment's position look unreasonable.
      *   **Appeal to Authority?** It *is* structurally similar to an appeal to authority, but Sidgwick uses it carefully:
          *   He doesn't say "believe them because they are authorities," but rather "their testimony is credible enough that *ignoring it completely* is scandalous."
          *   He implicitly argues that the *quality and quantity* of testimony meet a basic threshold for scientific attention, especially given the potential stakes.
          *   In the context of 1882, before widespread laboratory controls and sophisticated instrumentation, witness testimony *was* a primary source of evidence for unusual events. Sidgwick is arguing it should be treated with the same initial seriousness as testimony in other areas.

  **In Summary:**

  *   Sidgwick's "scandal" is the **persistent dismissal of potentially revolutionary phenomena by the scientific establishment *without proper investigation*, despite credible testimony and public interest.**
  *   Calling this a "scandal" reflects his **passion for scientific inquiry and frustration with intellectual inertia**, not a pre-commitment to the phenomena being real. It's consistent with later neutrality because the *target* of his outrage is the *lack of investigation*, not the *falsity* of the phenomena.
  *   His reliance on "competent witnesses" is **a valid (for the time) argument for the *plausibility* of the claims and the *necessity of investigation***. It highlights the unreasonableness of *a priori* dismissal, leveraging the credibility of witnesses to demand scientific attention, rather than claiming their testimony alone constitutes proof.

  This passage perfectly captures the SPR's founding mission: to apply rigorous scientific methods to phenomena previously dismissed by mainstream science, motivated by the belief that such phenomena *deserved* investigation due to their potential importance and the weight of unexplained testimony. Sidgwick masterfully argues that the *failure* to investigate was the true scientific failing.
