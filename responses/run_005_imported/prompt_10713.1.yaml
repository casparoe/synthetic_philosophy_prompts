  The user mentions this feels philosophical. Right, because it's about definitions: what counts as "rational"? If rationality includes internal consistency (e.g., acting on one's values), then paying aligns with integrity, avoiding guilt, etc. Philosophers like Kant (duty) or Sen (commitments) would support this. Behavioral economics also shows people derive utility from fairness. 

