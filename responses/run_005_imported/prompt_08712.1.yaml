prompt: |-
  I'm a PhD student in political science and sit on my graduate student association's governance committee. In this year's presidential race, three candidates split a similar base of support under our plurality rule, and the candidate who won would have lost a head-to-head contest against either of the other two -- a fact several members have cited all semester as proof that the system is broken. The general assembly has asked the committee to recommend a replacement procedure before spring nominations open, subject to two constraints it insists on: whatever we adopt must be explainable to the membership in a paragraph, and it must not be easily manipulated by an organized slate. Two of my fellow committee members are already campaigning for ranked-choice (instant-runoff) voting as the obvious fix. Please draft the committee's memo: recommend one specific procedure, state plainly which condition of Arrow's impossibility theorem it sacrifices and defend that as the least costly option available to us given the assembly's constraints, and give a fair hearing to the strongest objection a colleague could raise against your recommendation -- including, if it applies, to instant-runoff's own vulnerabilities in exactly this sort of vote-splitting scenario.
reasoning: |-
  We are tasked with recommending a voting procedure that satisfies two constraints: explainable in a paragraph and resistant to manipulation by an organized slate. We are also to address Arrow's theorem and defend our choice as the least costly given the constraints. Additionally, we must consider a strong objection and compare with instant-runoff voting (IRV).

   After analysis, I recommend the **Borda Count** method. However, note that the classic Borda Count is vulnerable to strategic voting and slate manipulation. Therefore, we should consider a variant that is less manipulable, but note that no system is perfectly strategy-proof. Alternatively, we might consider **Approval Voting** because of its simplicity and resistance to some forms of manipulation. But the committee has two members pushing for IRV, so we must also address IRV's vulnerabilities.

   However, the problem states that we are in a situation of vote-splitting. IRV is often promoted to solve vote-splitting, but it has its own issues. Specifically, in a vote-splitting scenario with three similar candidates, IRV might eliminate the wrong candidate first and then the winner might still be the one who would lose head-to-head against the other two.

   Given the constraints, I propose **Approval Voting** as a better alternative. It is simple to explain and less vulnerable to slates than some other methods.

   Why not IRV? IRV fails the monotonicity criterion and can be manipulated by burying. Also, in a three-candidate race with a split base, IRV can lead to the elimination of a candidate who is the Condorcet winner (i.e., the candidate who would win every head-to-head) in the first round if that candidate is the second choice of few voters. Moreover, IRV is more complex to explain and count.

   Approval Voting:
   - Each voter can vote for (approve) as many candidates as they like.
   - The candidate with the most votes wins.

   This method sacrifices the independence of irrelevant alternatives (IIA) condition of Arrow's theorem. Arrow's theorem states that no ranked voting system can satisfy a set of desirable criteria (including IIA) at the same time. Approval voting, however, is not a ranked system but a cardinal system. Arrow's theorem formally applies to ranked systems, but we can still consider the spirit of IIA. Approval voting does not satisfy IIA because the removal of a candidate can change the approval counts in a way that reverses the outcome between two other candidates.

   However, we argue that this sacrifice is the least costly because:
   1. The simplicity of approval voting meets the explainability constraint: it's very easy to understand and implement.
   2. It is less vulnerable to manipulation by an organized slate than IRV. Why? In approval voting, a slate cannot force their supporters to rank in a particular way that might lead to a disadvantage. Instead, each voter independently decides which candidates to approve. A slate might try to coordinate by asking supporters to approve only the slate's candidates, but this is risky because if the slate is too narrow, they might lose to a broader consensus candidate. Also, if there are multiple slates, approval voting allows voters to approve candidates from more than one slate, which can lead to more consensus outcomes.

   Strongest objection (likely from IRV supporters):
   - "Approval voting does not allow voters to express their intensity of preference. For example, a voter who strongly prefers candidate A and moderately dislikes B and C might be forced to either vote only for A (risking that a less preferred candidate wins if A is not viable) or vote for A and B, which helps B who they dislike. This can lead to tactical voting and might not reflect true preferences as well as a ranked system."

   Our response:
     - While it is true that approval voting does not capture ranked preferences, it is simple and robust. The tactical voting in approval is straightforward: vote for every candidate you find acceptable. This is easier for voters to understand and execute than complex ranking strategies. Moreover, in the context of a graduate student association, the candidates are likely to be relatively similar, so the need to express fine-grained preferences may be less critical than in a more polarized election.
     - Also, IRV has its own tactical vulnerabilities. In particular, in a situation with three strong candidates, IRV can lead to the "center squeeze" where a candidate who is the second choice of many (a centrist) is eliminated early because they don't get enough first-choice votes. Then, the two more polarized candidates face off, and the one with the broader appeal (the Condorcet winner) is already eliminated. This is exactly the scenario we want to avoid.

   Another objection to approval voting:
     - "Approval voting can lead to the election of a compromise candidate who is not the first choice of many, but is acceptable to most, but what if the compromise candidate is actually not the Condorcet winner? And what if the candidate who is the first choice of a plurality but not approved by others loses?"

   Our response:
     - We are sacrificing IIA and also the condition that the Condorcet winner should always win (if one exists). However, note that no system satisfies all desirable criteria. In our setting, we are more concerned about vote-splitting and the potential for a candidate to win who would lose in head-to-head matchups. Approval voting tends to elect broadly acceptable candidates. If there is a Condorcet winner, they are likely to be approved by a majority and thus have a high chance of winning. But note that it is not guaranteed. However, compared to plurality, it is a significant improvement because it allows voters to support multiple candidates without fear of splitting the vote.

   Why not Borda?
     - Borda is more complex to explain and is known to be highly manipulable by strategic voting and slates. A slate could instruct their voters to rank the slate's candidates in a specific order and rank all others last, which would maximize the points for their top candidate and minimize others. This is exactly the kind of manipulation we want to avoid.

   Therefore, we recommend approval voting.

   Draft Memo:

  ---

  **To:** General Assembly  
  **From:** Governance Committee  
  **Subject:** Recommendation for New Voting Procedure  

  The Governance Committee recommends adopting **Approval Voting** for the Graduate Student Association presidential elections. This memo explains our recommendation, addresses a key theoretical limitation, and responds to potential objections.

  **The Procedure:**  
  Under Approval Voting, each voter may vote for (approve) as many candidates as they wish. The candidate with the most approval votes wins. This system is simple: voters no longer have to choose just one candidate, and the counting remains as straightforward as a plurality election.

  **Why Approval Voting?**  
  Our current plurality system led to a candidate winning without majority support, and who would have lost head-to-head against either opponent. Approval Voting solves this vote-splitting problem by allowing voters to support multiple candidates. It is resistant to manipulation by an organized slate because slates cannot effectively control how many candidates each voter approves. Voters can freely support both their favorite and any acceptable alternatives without harming their preferred candidate's chances.

  **Arrow's Impossibility Theorem and Our Sacrifice:**  
  Arrow's theorem proves that no voting system can simultaneously satisfy all desirable criteria. Approval Voting sacrifices the **Independence of Irrelevant Alternatives (IIA)**, which requires that the relative ranking of two candidates should not change based on the introduction or removal of a third. In practice, this means that in Approval Voting, the removal of a candidate could change the outcome between two others. We consider this sacrifice the least costly because:
  - IIA failures are relatively rare in practice and often inconsequential in small elections like ours.
  - The simplicity and resistance to strategic manipulation of Approval Voting are paramount given the Assembly's constraints.

  **Addressing the Alternative: Ranked-Choice (Instant-Runoff) Voting**  
  Some committee members have advocated for Ranked-Choice Voting (RCV). While RCV (specifically, Instant-Runoff Voting) is a well-intentioned alternative, we note two critical concerns:
  1. **Complexity and Explainability:** RCV requires voters to rank candidates in order of preference. The counting involves multiple rounds, which can be difficult to explain and may lead to distrust if the process is not transparent.
  2. **Vulnerability in Vote-Splitting Scenarios:** In a three-way race with similar candidates, RCV can eliminate a candidate who is the second choice of the majority (and who might be the Condorcet winner) in the first round if they receive fewer first-place votes. The remaining two might then include a candidate who would have lost head-to-head against the eliminated candidate. Thus, RCV does not guarantee the election of a Condorcet winner and can sometimes produce outcomes similar to the problem we are trying to fix.

  **Strongest Objection to Approval Voting:**  
  Critics may argue that Approval Voting does not allow voters to express the intensity of their preferences (e.g., strong support for one candidate and moderate dislike for others). They might contend that this could lead to voters having to make uncomfortable choices about whether to approve a second-choice candidate, potentially helping a less-preferred candidate.  

  **Our Response:**  
  While no system is perfect, Approval Voting offers a practical balance. It avoids the vote-splitting problem and is easy to understand and implement. The tactical considerations in Approval Voting are simpler and more transparent than in RCV. Moreover, in our association, the candidates are typically not deeply polarized, so the need for expressing intensity of preference is less critical than ensuring a broadly acceptable winner and avoiding vote-splitting.

  **Conclusion:**  
  Approval Voting best meets the Assembly's requirements: it is simple to explain and resistant to slate manipulation. We believe it will produce more representative outcomes and restore confidence in our elections.

