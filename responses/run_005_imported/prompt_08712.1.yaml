answer: |-
  **To:** General Assembly  
  **From:** Governance Committee  
  **Subject:** Recommendation for New Voting Procedure  

  After careful analysis of the presidential election outcome and the Assembly’s constraints—simplicity and resistance to manipulation by organized slates—the committee recommends **Approval Voting** as the replacement for our current plurality system. Below, we outline the procedure, defend our choice in light of Arrow’s theorem, and address key objections, including those to instant-runoff voting (IRV).  

  ### The Recommended Procedure: Approval Voting  
  Under Approval Voting, voters may select ("approve") **as many candidates as they wish**. The candidate with the most approvals wins. For example:  
  - Voters approve all candidates they find acceptable.  
  - No rankings, points, or rounds are needed. Ties are resolved by existing bylaws.  
  This system is explainable in one sentence: *"Vote for every candidate you support; the most-approved candidate wins."* It eliminates vote-splitting by allowing broad support without tactical penalties, satisfies the Assembly’s clarity requirement, and resists slate manipulation (e.g., slates cannot force voters to withhold approvals from rivals without risking backlash).  

  ### Arrow’s Theorem and Our Sacrifice  
  Arrow’s theorem proves that no voting system can satisfy all five fairness criteria simultaneously. Approval Voting sacrifices **Independence of Irrelevant Alternatives (IIA)**, which demands that the ranking between two candidates must not change if a third candidate is added or removed. For instance:  
  - If Candidate A beats B in a head-to-head race, adding a similar Candidate C might split A’s approvals, letting B win.  
  We defend this as the **least costly sacrifice** given our constraints:  
  1. **Simplicity**: IIA is abstract and rarely triggers voter confusion in small elections. Approval’s mechanics remain transparent.  
  2. **Manipulation resistance**: Unlike ranked systems (e.g., IRV), Approval has no complex ranking strategies for slates to exploit. Slates gain no advantage by fielding multiple similar candidates, as voters can approve them all.  
  3. **Practicality**: Approval ensures the winner has broad support—addressing our core vote-splitting crisis—while avoiding IRV’s procedural complexity.  

  ### Strongest Objection and Fair Comparison to IRV  
  **Objection**: *Approval Voting ignores preference intensity. Voters cannot distinguish between a "favorite" and a "barely acceptable" candidate, potentially electing a bland compromise who excites no one.*  
  This is valid: A candidate loathed by 49% but approved by 51% could win, whereas a universally tolerated moderate might lose to a polarizing figure. However, this mirrors real-world constraints—no system perfectly captures intensity without complexity.  

  **Instant-Runoff Voting (IRV)**: We acknowledge colleagues’ support for IRV but highlight vulnerabilities in our specific scenario:  
  - **IRV’s vote-splitting flaw**: In a three-way race with similar candidates (e.g., progressives A, B, and moderate C), A and B may split first-choice votes. If C leads in first choices, IRV eliminates the weaker of A/B (say, B), redistributes to A, and A beats C. *But* if most of B’s voters prefer C over A (e.g., if A is more extreme), C wins—even if A would beat C head-to-head. **This is identical to our plurality failure**, just in a later round.  
  - **Slate manipulation**: IRV is vulnerable to "bullet voting" (ranking only one candidate) or "burying" (ranking a weak rival above a strong one to manipulate eliminations). Organized slates can exploit this.  
  - **Complexity**: Explaining IRV’s rounds and redistributions exceeds a paragraph, risking voter distrust.  

  ### Why Approval Prevails  
  While IRV’s flaws risk perpetuating vote-splitting and manipulation, Approval Voting offers a robust alternative:  
  - **Solves vote-splitting**: By allowing approvals for multiple candidates, it prevents "wasted" votes.  
  - **Deters slates**: Slates cannot game approvals without alienating voters who support cross-coalition candidates.  
  - **Accessibility**: Ballots identical to plurality (checkboxes) ease adoption.  

  We urge the Assembly to adopt Approval Voting. It prioritizes simplicity, stability, and resistance to manipulation—trading IIA, a theoretically costly but pragmatically manageable sacrifice, for tangible improvements in fairness.  

  **Vote to implement Approval Voting for spring nominations.**
