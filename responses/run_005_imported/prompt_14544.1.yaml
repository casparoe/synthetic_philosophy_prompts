  First, I need to recall the core issues. The Frege-Geach problem questions how expressivism handles embedded moral statements in logical arguments. Creeping minimalism refers to the concern that expressivists end up sounding like realists by borrowing their machinery. The negation problem asks what attitude is expressed when we negate a moral claim.

  The user wants sharp questions that prevent dodges. For each question, I should anticipate the guest's likely deflection and provide a follow-up that forces a direct answer. Let me structure the questions accordingly.

  For the Frege-Geach problem, start by asking the guest to explain the embedding issue in a modus ponens argument. She might say that the conditional expresses a higher-order attitude. The follow-up should challenge how this maintains validity without descriptive content. 

  On creeping minimalism, ask if her solution collapses into realism. She might appeal to the "practical stance" explanation. The follow-up should press on how this differs functionally from realism. 

  For the negation problem, question what attitude "lying isn't wrong" expresses. She might use the "Hooray not-p" dodge. The follow-up should ask why this doesn't work for descriptive statements, highlighting the asymmetry. 

  Other angles: moral disagreement without contradiction, descriptive language in ethics, and the explanatory gap compared to realism. Each needs a dodge and a sharper follow-up. 

  The user's deeper need is to uncover the crux of expressivism's weaknesses. They want to move beyond rehearsed answers to genuine philosophical engagement. Ensuring each question has a concrete example and forces specificity is key. Avoid letting the guest retreat to broad metaphors. 

  I'll structure 8-10 questions covering these areas, each with a dodge note and follow-up. The goal is precision and preventing evasion, making the interview reveal the theory's substantive challenges.
answer: |-
  Here are 8 targeted questions designed to press the core challenges to expressivism/quasi-realism, with anticipated dodges and sharp follow-ups to force the crux:

  1.  **The Embedding Puzzle (Modus Ponens):** "Can you walk us through *exactly* how expressivism accounts for the validity of the argument: 'If lying is wrong, then getting your little brother to lie is wrong. Lying is wrong. Therefore, getting your little brother to lie is wrong'? Specifically, what attitude is expressed by the *conditional premise* ('If lying is wrong...') if the minor premise ('Lying is wrong') is fundamentally non-descriptive?"
      *   *Likely Dodge:* "The conditional expresses a higher-order attitude, like a commitment not to both disapprove of lying *and* not disapprove of getting your brother to lie."
      *   *Sharper Follow-up:* "But doesn't treating the conditional as expressing a *separate, higher-order* attitude risk making the argument invalid? Validity requires the *same propositional content* ('lying is wrong') to be shared between premises. If the minor premise expresses disapproval (Attitude A), and the conditional expresses a complex attitude *about* disapproval (Attitude B about A), how does the conclusion validly follow *about Attitude A*? Aren't we smuggling in shared descriptive content?"

  2.  **The Nature of the Attitude:** "You say moral claims express non-cognitive attitudes like disapproval. Could you precisely define the *type* of attitude expressed by 'Lying is wrong'? Is it identical to the attitude expressed by 'Boo, lying!'? If not, what distinguishes the *moral* attitude?"
      *   *Likely Dodge:* "It's a distinctive kind of practical, commitment-laden attitude, perhaps involving demands on others, or tied to our social nature."
      *   *Sharper Follow-up:* "If this attitude is so complex and rule-governed (as solving Frege-Geach requires), how is it fundamentally *non-cognitive* in a way that meaningfully differs from a *belief* about what we have practical reasons to disapprove of? Doesn't the complexity necessary for embedding start to look suspiciously belief-like?"

  3.  **Negation Problem - Simple Case:** "What attitude is expressed by the *negation* of a moral claim, like 'Lying is *not* wrong'?"
      *   *Likely Dodge:* "It expresses the *absence* of disapproval of lying" or "It expresses tolerance/permissibility towards lying."
      *   *Sharper Follow-up:* "But 'absence of disapproval' isn't itself an attitude expressed *by* the utterance. And 'tolerance' sounds like a *positive* attitude. How does expressivism distinguish the attitude expressed by 'Lying is not wrong' from the attitude expressed by 'Lying is permissible'? Are they identical? If not, what's the attitudinal difference?"

  4.  **Negation Problem - Embedded Negation:** "How does expressivism handle the negation *within* a complex statement, like in the antecedent of a conditional: 'If lying is *not* wrong, then...'? What specific attitude is expressed by the component 'lying is not wrong' *in that embedded context*?"
      *   *Likely Dodge:* "The whole conditional expresses a complex higher-order attitude about the relationships between attitudes."
      *   *Sharper Follow-up:* "Granted the whole expresses a complex attitude, but the *logic* relies on the *meaning* of the embedded components. What is the *semantic contribution* of the phrase 'lying is not wrong' *within* that complex expression? What attitude does *that specific part* correspond to, such that the logic works?"

  5.  **Creeping Minimalism - The Charge:** "Critics like Dreier argue that sophisticated expressivist solutions to Frege-Geach (like Blackburn's or Gibbard's) lead to 'creeping minimalism': that by building enough structure to mimic realist logic, truth, and inference, you've effectively conceded the game. The difference between 'realist' and 'quasi-realist' becomes merely terminological. Is this criticism fair? If not, what is the *substantive, non-verbal* difference that remains between your view and a robust moral realism?"
      *   *Likely Dodge:* "The difference is foundational! Realists think moral properties are 'out there' independent of our attitudes; quasi-realists explain the *phenomenon* of objectivity as arising from within our practical, attitude-expressing discourse."
      *   *Sharper Follow-up:* "But *operationally*, within the practice of moral argument, deliberation, and logical inference you've described – what *observable difference in practice* would there be between a community of quasi-realists and a community of robust realists? If they use the same logic, make the same inferences, assert the same sentences sincerely, and explain disagreement similarly, isn't the 'metaphysical' difference inert?"

  6.  **Disagreement Without Contradiction?:** "If I say 'Lying is wrong' (expressing my disapproval) and you say 'Lying is not wrong' (expressing your lack of disapproval/tolerance), why is this a *disagreement*? We're just reporting different attitudes, like me disliking licorice and you not minding it. Where is the *clash* that characterizes moral disagreement?"
      *   *Likely Dodge:* "Moral attitudes aren't mere preferences; they involve demands on others or expectations. Disapproving of lying involves thinking others *should* disapprove too, so your lack of disapproval conflicts with my demand."
      *   *Sharper Follow-up:* "Doesn't this mean the fundamental attitude expressed is not *just* 'Boo lying!' but something like '*Everyone* should disapprove of lying'? And isn't '*Everyone should disapprove of lying'* itself a *cognitive* claim (a belief about what attitudes people should hold) that can be true or false? Doesn't this collapse back into cognitivism?"

  7.  **The Explanatory Burden vs. Realism:** "Realism seems to offer a straightforward explanation for moral logic, truth-aptness, and the 'felt objectivity' of morality: moral facts exist. What does expressivism *explain better* than realism? What phenomenon is *more elegantly or parsimoniously accounted for* by starting with attitudes rather than beliefs/facts?"
      *   *Likely Dodge:* "Expressivism better explains the intrinsic motivational force of moral judgment (judging something wrong *just is* being motivated against it) and avoids mysterious non-natural properties."
      *   *Sharper Follow-up:* "But sophisticated realists (e.g., moral naturalists) claim they can explain motivation via normal belief-desire psychology (believing X is wrong *causes* a desire not to do X, given a background desire to be moral). And if quasi-realism builds structures complex enough to mimic truth-aptness and logic, isn't its 'parsimony' advantage lost? What's the *net explanatory gain*?"

  8.  **The Role of Descriptive Language:** "Moral discourse constantly mixes with descriptive language ('Lying *to save a life* is wrong'). How does expressivism compositionally handle the meaning of complex moral statements that depend heavily on descriptive content? What attitude is expressed by 'Lying to save a life is wrong'?"
      *   *Likely Dodge:* "The attitude is directed towards the *type of action* described. 'Disapproval of lying-to-save-a-life'."
      *   *Sharper Follow-up:* "But doesn't the *specific content* of the description ('to save a life') critically shape *which* attitude is expressed? How does this differ from having a belief *that* lying-to-save-a-life has the property of wrongness? Doesn't the dependence on the descriptive content show that the moral operator is functioning like a predicate applied to a state of affairs?"

  **Key Principles Behind These Questions:**

  *   **Force Specifics:** Avoid letting "higher-order attitudes" or "complex commitments" remain vague metaphors. Demand the *exact* attitude proposed for *specific* linguistic constructions (negation, conditionals, embedding).
  *   **Focus on Logic & Semantics:** The Frege-Geach problem is fundamentally about logic and compositional semantics. Keep the focus there, not just on psychology or motivation.
  *   **Compare to Cognitivism:** Constantly ask: "How is this *different in a substantial, non-verbal way* from a cognitivist explanation?"
  *   **Test for Creeping Minimalism:** Ask what concrete difference the expressivist metaphysics makes *to the practice* of moral discourse once all the quasi-realist machinery is in place.
  *   **Target Negation:** This is often the hardest nut for expressivism to crack cleanly. Press hard here.
  *   **Demand Explanatory Advantages:** Make them justify why the expressivist starting point is superior, not just possible.

  Good luck with the interview! Pressing on these points should definitely get beyond the elevator pitch and into the substantive philosophical debate.
