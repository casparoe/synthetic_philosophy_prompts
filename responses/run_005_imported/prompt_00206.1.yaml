  I should break down Millikan's argument step by step. She emphasizes the mechanism's proper function. The frog's snapping mechanism evolved because it caught flies, which provided nutrition. But the function isn't nutrition per se; it's catching flies. Even if flies are nutritious, the mechanism is specifically attuned to flies. That's the key point. The historical cause is flies, not just any nutritious thing. 

