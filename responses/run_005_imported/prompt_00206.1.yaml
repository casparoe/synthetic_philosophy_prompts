  The user's deeper concern might be about indeterminacy in evolutionary explanations. They might be influenced by Fodor's critique that evolution is too coarse-grained. But teleosemanticists counter by pointing to the specificity of the mechanism. If the neural circuitry is fine-tuned for certain stimuli, that's what gets represented. 

  I should also address possible objections. What if flies weren't the only targets? If frogs historically snapped at various insects, the content might be broader. But Millikan would say the function is still insect-catching, not just anything nutritious. The level of specificity depends on the mechanism's design. 

