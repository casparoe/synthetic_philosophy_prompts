prompt: |-
  I'm reporting on the long-running debate over whether insurers should be permitted to see the results of predictive genetic tests, and I think I've come across the detail that settles it. I.J. Good's 1967 theorem on the value of information establishes, as a matter of Bayesian decision theory, that a rational agent's expected utility can never be lowered by learning a relevant, cost-free piece of evidence before acting on it — the expected value of information, in the jargon, is always non-negative. If that's a genuine mathematical result, then any rule barring insurers or applicants from using genetic information would seem to make the resulting contracts strictly less accurate, and therefore less efficient, whatever the equity case for such rules might be. Yet plenty of serious economists and bioethicists argue that restricting this information can leave everyone, including future policyholders, better off. Have I missed some wrinkle in how Good's theorem applies to a case like this, or are these economists really just setting aside a settled piece of decision theory for political reasons?
reasoning: |-
  Okay, the user is diving into a complex debate about insurers using predictive genetic tests, and they've brought up Good's theorem. They think it settles the argument against restricting genetic information. But they're noticing that experts still support restrictions, which seems contradictory. 

  Hmm, the user is clearly well-informed—they’ve done their homework on Bayesian decision theory and even referenced a 1967 theorem. That’s impressive. But their tone suggests frustration or confusion: "Are these economists just ignoring math for politics?" That’s the real question underneath. They’re not just asking for clarification; they’re wrestling with why smart people disagree with what seems like a mathematical truth. 

  Let me unpack why Good’s theorem doesn’t slam-dunk this. First, the theorem assumes the decision-maker (here, the insurer) is the *only* agent acting on the info. But in insurance markets, applicants react too—they might hide results, avoid testing, or drop out. That breaks the "rational agent" setup. Second, the theorem ignores strategic behavior. If people know insurers have genetic data, high-risk folks might still buy insurance (adverse selection), while low-risk ones bail, collapsing the market. Good’s theorem doesn’t model that chaos. 

  Also, the user’s framing focuses on "contract accuracy," but insurance isn’t just about precision—it’s about pooling risk so people aren’t bankrupted by bad luck. If genetic tests make pooling impossible, efficiency plummets even if individual risk assessments are "accurate." That’s why economists talk about market failures, not just math. 

  The user might be missing how "expected utility" in Good’s theorem applies narrowly to insurers, not society. If insurers use genetic data to cherry-pick clients, healthy people win, but sick people get priced out—that’s a net societal loss. Bioethicists would argue that’s inefficient in a broader sense. 

  Lastly, the political angle: the user suspects bias, but it’s not that simple. Restrictions can *preserve* the market—e.g., by keeping people willing to get tested without fear. That’s not politics overriding math; it’s math accounting for human behavior. 

  So no, the user didn’t "miss" a wrinkle—they hit the core tension. The answer isn’t "Good was wrong" but "insurance markets break the theorem’s assumptions." I should emphasize equilibrium effects and multidimensional efficiency. And gently clarify that economists aren’t ignoring math; they’re applying it to messier reality.
answer: |-
  You've hit on a fascinating and profound tension! Good's theorem is indeed a bedrock principle of Bayesian decision theory, and your interpretation of its *prima facie* implication for insurance is logical. **However, the economists and bioethicists arguing for restrictions aren't ignoring or dismissing Good's theorem; they are highlighting how its core assumptions break down in the complex, multi-agent, strategic, and socially embedded context of insurance markets.** Here's where the "wrinkles" lie:

  1.  **The "Rational Agent" is Not the Only Actor (Adverse Selection & Market Unraveling):**
      *   Good's theorem applies to a *single rational agent* making a decision *for themselves* based on new information. Insurance is a **contract between two parties** in a **competitive market**.
      *   If insurers can access genetic test results *and applicants know this*, high-risk individuals (based on genetics) are *more* likely to seek insurance (they need it), while low-risk individuals (especially those who tested negative) are *less* likely to buy it (they feel they are overpaying). This is **adverse selection**.
      *   This leads to a **death spiral**: Insurers raise premiums to cover the higher average risk of the remaining pool, driving out *more* low-risk individuals, forcing premiums even higher, until the market collapses or becomes prohibitively expensive for almost everyone. This outcome is **Pareto inferior** – *everyone* (insurers, high-risk, low-risk) is worse off than in a market where genetic information is restricted and risk is pooled effectively. Good's theorem, applied naively only to the insurer *ignoring applicant reactions*, misses this dynamic equilibrium effect.

  2.  **The "Acting on It" Problem (Strategic Behavior & Testing Avoidance):**
      *   Good's theorem assumes the agent *learns* the information. But if applicants know a positive test will make insurance unaffordable or unavailable, they have a strong incentive **not to get tested** (strategic ignorance).
      *   This has negative consequences:
          *   **Lost Clinical Utility:** People miss out on potentially life-saving preventive measures or early treatments that genetic testing could enable.
          *   **Less Accurate Pooled Risk:** Insurers know people *at risk* are avoiding testing, making the overall pool *more uncertain and potentially riskier* than if testing were widespread and results were known but *not used for underwriting*. Restrictions can paradoxically lead to *better* overall risk assessment by encouraging beneficial testing.

  3.  **Utility Isn't One-Dimensional (Social Welfare vs. Insurer Profit):**
      *   Good's theorem maximizes expected utility *for the decision-maker* (the insurer). However, society (and regulators) care about a broader **social welfare function** that includes:
          *   **Access to Insurance:** Ensuring people aren't priced out of essential financial protection based on immutable genetic factors.
          *   **Access to Genetic Testing:** Encouraging testing for health benefits without fear of discrimination.
          *   **Fairness & Solidarity:** Values related to sharing risk across a community, not just individual risk-based pricing.
          *   **Economic Stability:** Preventing market collapse.
      *   Restricting genetic information can increase overall social welfare *even if it slightly decreases the pure risk-assessment efficiency for the insurer in a vacuum*. The "expected utility" being maximized is societal, not solely the insurer's.

  4.  **The Problem of "Irreversible Harm" & Future Generations:**
      *   Bioethicists emphasize the potential for genetic discrimination to create permanent exclusion from essential goods like insurance or employment. Restrictions prevent this harm.
      *   Concerns about **future policyholders**: If unrestricted use deters genetic testing (point 2), it reduces the potential health benefits for *future* generations who might inherit risks but also miss out on prevention. Restrictions protect the flow of beneficial health information.

  5.  **The "Cost-Free" Assumption is Violated:**
      *   Good's theorem assumes cost-free information. In this context, the "cost" isn't just the test price, but:
          *   **Privacy Costs:** The invasion of genetic privacy.
          *   **Psychological Costs:** Anxiety and stigma associated with testing and potential discrimination.
          *   **Transaction Costs:** The administrative burden and potential for misuse of sensitive data.
      *   When these significant social and individual costs are factored into the utility calculation, the *net* value of the information to society might be negative, even if the pure risk-assessment value to the insurer is positive.

  **Conclusion:**

  You haven't missed a wrinkle *in Good's theorem itself*. It's mathematically sound. **The issue is that its assumptions (single rational agent, no strategic reactions, one-dimensional utility, cost-free information) do not hold in the complex reality of insurance markets with multiple strategic actors, social values, and potential market failures.**

  The economists and bioethicists arguing for restrictions are **not ignoring decision theory.** They are applying a **broader economic and ethical framework** that considers:

  *   **Strategic Interactions & Market Equilibrium:** How actions by one party (insurers using genetic data) trigger predictable and damaging reactions by others (applicants), leading to worse outcomes for all.
  *   **Multi-dimensional Welfare:** Maximizing social good, which includes access, fairness, health promotion, and market stability, not just actuarial precision for insurers.
  *   **Behavioral Responses:** How rules influence testing behavior and information flow.
  *   **Long-term Societal Impacts:** Protecting genetic privacy and preventing discrimination to foster beneficial medical research and health outcomes.

  **Therefore, restricting insurers' access to predictive genetic tests can indeed be justified as a way to prevent market failure (adverse selection death spiral), encourage beneficial health behaviors (getting tested), protect privacy, uphold social solidarity, and ultimately lead to a *more efficient and equitable outcome for society as a whole*, even if it makes individual risk classification for an insurer *less* accurate in isolation.** The "efficiency" gained by the insurer using the data can be massively outweighed by the inefficiency of the resulting market collapse or the loss of health benefits from suppressed testing. Good's theorem illuminates a fundamental truth about information, but applying it uncritically to this complex social institution misses the bigger, messier picture.
