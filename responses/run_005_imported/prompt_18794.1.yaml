  A: Evolutionary Species Concept (EvSC) and Ecological Species Concept (ESC)
     - EvSC: Good for asexual and hybrid, but ring species and bacteria are a bit fuzzy. Still, it's a lineage-based concept that is broad.
     - ESC: Handles asexual, hybrid, and bacteria by niche. Ring species might be split by niche differences, but that might be acceptable.

