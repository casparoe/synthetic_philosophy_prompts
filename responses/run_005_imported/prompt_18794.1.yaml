  C: Morphological Species Concept (MSC) - works in practice for many cases but is arbitrary and not theoretically robust.

  D: Biological Species Concept (BSC) - fails for asexual and bacterial cases, and is problematic for ring species and hybrid speciation.

  But note: the CSC and EvSC are both considered more modern and integrative. However, for bacteria, the CSC might be better because of ecological cohesion.

