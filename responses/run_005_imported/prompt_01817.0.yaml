prompt: |-
  I'm a PhD student in philosophy working on the pre-history of expected utility theory, and I've run into a passage I can't fully unpack. It is from Laplace's discussion of the St. Petersburg problem in A Philosophical Essay on Probabilities (Truscott and Emory's 1902 translation of the 1814 French original), in the chapter "Concerning Hope." I follow the paradox itself well enough, but not the mathematics of the rule he proposes for resolving it. Here is the passage in full (the "eighth principle" mentioned in the first sentence is just his name, introduced a page earlier, for ordinary mathematical expectation):

  "The application of the preceding principles to the following question has greatly exercised the geometricians. Paul plays at heads and tails with the condition of receiving two francs if he throws heads at the first throw, four francs if he throws it only at the second throw, eight francs if he throws it only at the third, and so on. His stake at the play ought to be, according to the eighth principle, equal to the number of throws, so that if the game continues to infinity the stake ought to be infinite. However, no reasonable man would wish to risk at this game even a small sum, for example five francs. Whence comes this difference between the result of calculation and the indication of common sense? We soon recognize that it amounts to this: that the moral advantage which a benefit procures for us is not proportional to this benefit and that it depends upon a thousand circumstances, often very difficult to define, but of which the most general and most important is that of fortune.

  Indeed it is apparent that one franc has much greater value for him who possesses only a hundred than for a millionaire. We ought then to distinguish in the hoped-for benefit its absolute from its relative value. But the latter is regulated by the motives which make it desirable, whereas the first is independent of them. The general principle for appreciating this relative value cannot be given, but here is one proposed by Daniel Bernoulli which will serve in many cases.

  Tenth Principle.—The relative value of an infinitely small sum is equal to its absolute value divided by the total benefit of the person interested. This supposes that every one has a certain benefit whose value can never be estimated as zero. Indeed even that one who possesses nothing always gives to the product of his labor and to his hopes a value at least equal to that which is absolutely necessary to sustain him.

  If we apply analysis to the principle just propounded, we obtain the following rule: Let us designate by unity the part of the fortune of an individual, independent of his expectations. If we determine the different values that this fortune may have by virtue of these expectations and their probabilities, the product of these values raised respectively to the powers indicated by their probabilities will be the physical fortune which would procure for the individual the same moral advantage which he receives from the part of his fortune taken as unity and from his expectations; by subtracting unity from the product, the difference will be the increase of the physical fortune due to expectations: we will call this increase moral hope. It is easy to see that it coincides with mathematical hope when the fortune taken as unity becomes infinite in reference to the variations which it receives from the expectations. But when these variations are an appreciable part of this unity the two hopes may differ very materially among themselves.

  This rule conduces to results conformable to the indications of common sense which can by this means be appreciated with some exactitude. Thus in the preceding question it is found that if the fortune of Paul is two hundred francs, he ought not reasonably to stake more than nine francs."

  Could you help me with the following?

  1. Restate the Tenth Principle and the rule Laplace derives from it as an explicit formula in modern notation -- what precisely is being raised to what power, and how are the results combined?
  2. Use that formula to reconstruct his arithmetic. Does a starting fortune of 200 francs really imply a maximum reasonable stake of about nine francs in the doubling game described above, and if so, by what calculation?
  3. Identify the cardinal utility function that is implicitly doing the work here, and situate this "moral hope" rule relative to the standard modern treatment of the St. Petersburg paradox via a concave utility function. Does Laplace's version of the resolution escape the further difficulties that were later raised against merely unbounded, concave solutions -- e.g., by Karl Menger?
