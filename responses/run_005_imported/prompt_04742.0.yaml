  The core tension is between intellectual honesty and social appropriateness. The user's expertise makes standard patriotic tropes feel dishonest, but the setting demands celebration. The solution path involves reframing: instead of seeing arbitrariness as undermining, present it as the foundation of human connection. Citizenship becomes significant precisely because we collectively decide to honor these invented lines.

  Key angles to weave in: 
  The warmth comes from focusing on Priya's agency in choosing this community. 
  The intellectual nod is in describing citizenship as a "beautiful fiction" we sustain together. 
  Humor can lightly acknowledge the bureaucracy without diving into theory. 

