prompt: |-
  Quick one from office hours today—I'm teaching a seminar that pairs classical Islamic philosophy with early modern empiricism, and this week we did Hume on causation right after finishing al-Ghazali's Incoherence of the Philosophers (the 17th discussion, with the fire and cotton example). One of my sharper students put her hand up and said something like: "isn't al-Ghazali basically doing Hume's job 600 years early? They both deny theres any necessary connection between cause and effect, they both fall back on habit/custom to explain why we expect fire to burn cotton, and they even use almost the same example (Hume's got flame and heat, Ghazali's got fire and cotton)." Half the room nodded along, and honestly I didn't have a great answer on the spot beyond "well, one of them believes in God and the other doesn't," which felt pretty thin even as I said it.

  Now im second-guessing my own lecture notes, which basically frame al-Ghazali's occasionalism as a medieval dress rehearsal for Humean skepticism about induction. Is that actually a defensible way to teach it, or am I flattening a real difference between the two positions just because the surface-level argument (no necessary connection, only constant conjunction/custom) looks so similar? Genuinely not sure - would love your honest take before I revise the slides for next year.
