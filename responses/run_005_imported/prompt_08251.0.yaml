  Next, analyzing the friend's argument: it's a classic argument from marginal cases combined with a reversal test. The strength lies in exposing species-based arbitrariness. The user senses that intelligence alone can't resolve it—why? Because intelligence doesn't inherently grant moral inviolability; it's a property, not a justification. This is where the user gets stuck.

  To address this, I should explore possible defenses. One angle is moral agency: humans possess complex capacities like reciprocity, self-legislation, and abstract moral reasoning. This could justify distinct treatment without speciesism. But the superior species scenario challenges this—why shouldn't those same capacities in them override our rights? 

