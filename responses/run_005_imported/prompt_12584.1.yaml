answer: |-
  Here's the strongest case for why Samuelson's rebuttal fails and why ergodicity genuinely rescues growth-rate maximization as objectively correct for a finite agent facing multiplicative dynamics, *without* smuggling in log utility:

  ### Core Argument: The Observable Quantity & Non-Ergodicity
  1.  **What is Actually Measured?**: A single persistent agent (e.g., a trader, an investor, an evolving population) doesn't experience the ensemble average. They experience *one path* through time. The quantity relevant to their survival and success is the *realized* growth rate along their single trajectory: `g = (1/T) * ln(W_T / W_0)`. This is an *observable, measurable, physical quantity* for the agent.
  2.  **The Ensemble Average is a Phantom for Multiplicative Processes**: Samuelson's expected utility relies on `E[U(W_T)]`, calculated by averaging utility over infinitely many *parallel universes*. For multiplicative growth (compounding bets), the system is *non-ergodic*: the time-average (`g`) along a single path **does not equal** the ensemble average (`E[ln(1+r)]`) in general.
      *   **Example (The St. Petersburg Trap)**: Consider a game with infinite expected value (`E[Payout] = ∞`). The ensemble average says "bet everything, always!" Yet, along *any single trajectory*, the bettor goes bankrupt almost surely. The ensemble average is mathematically real but physically irrelevant to the single agent. Maximizing `E[ln(W)]` avoids this trap by maximizing the *actual* growth rate experienced.
  3.  **Samuelson's Fallacy: Mistaking the Map for the Territory**: Samuelson correctly states that maximizing `E[ln(W)]` is equivalent to log utility. His error is assuming this *invalidates* the time-average argument. It doesn't. The equivalence arises *because* `ln(W)` is the unique function whose expectation *corresponds directly* to the time-average growth rate `g` in the long run. Log utility isn't smuggled in; it's *revealed* as the utility function that correctly maps the observable, physically relevant growth process. Choosing a different utility function (`U(W) = W`, `U(W) = sqrt(W)`, etc.) maximizes a *different phantom quantity* (the ensemble average of that utility), not the actual realized growth rate of the agent's wealth.

  ### Addressing Samuelson's Core Objections
  4.  **"Finite Horizon" Doesn't Save Ensemble Averages**:
      *   **Problem of Path Dependency**: Even over finite horizons, wealth evolution is multiplicative: `W_T = W_0 * ∏ (1 + f_i * r_i)`. The *order* of wins/losses matters critically. Ensemble averages (`E[W_T]`) ignore this path structure. Maximizing `E[W_T]` (e.g., via full Kelly or over-betting) often leads to strategies where median/typical `W_T` is high, but the *probability of ruin or significant drawdown* is also high. The agent cares about their *actual* `W_T`, not the average over paths where they are already bankrupt.
      *   **Kelly Optimizes Typical Outcomes**: Maximizing `E[ln(W_T)]` = maximizing `E[ln(∏ (1+f*r_i))]` = maximizing the sum of `E[ln(1+f*r_i)]`. This explicitly optimizes the *compounded* outcome along the path. It directly maximizes the *median* `W_T` (or the geometric mean) and minimizes the probability of significant underperformance relative to the growth potential. This is demonstrably better for the *actual* finite-horizon outcome of the single agent than maximizing `E[W_T]`.
  5.  **"Utility Function Arbitrariness" is a Red Herring**:
      *   **Utility Should Reflect the Dynamics**: The "arbitrariness" argument presumes utility is divorced from the physical dynamics of wealth accumulation. For an entity whose survival and success depend on *compounded multiplicative growth*, the utility function *must* respect the multiplicative dynamics. `ln(W)` isn't arbitrary; it's the functional form that linearizes the multiplicative process (`ln(W_T) = ln(W_0) + Σ ln(1+f*r_i)`), making the growth rate additive and directly optimizable. Choosing `U(W)=W` for multiplicative dynamics is like choosing `U(Temperature)=T^3` for measuring thermal comfort – it distorts the physically relevant scale.
      *   **The Survival Criterion**: For any entity needing to persist (a trader avoiding ruin, a species avoiding extinction, a fund avoiding closure), the growth rate `g` is the objective measure of success/failure. Negative `g` implies inevitable demise. Positive `g` implies long-term growth. Maximizing `g` is synonymous with survival and dominance. No other utility function reliably ensures this for multiplicative dynamics.

  ### Why Ergodicity Economics is More Than Rebranding
  6.  **Shifting the Focus to System Properties**: Peters' framing forces the question: "Is the wealth process ergodic?" For additive noise (like salary fluctuations), it often is: time-average = ensemble average. `E[W_T]` is meaningful. For multiplicative noise (investing, betting), it's fundamentally non-ergodic. The ensemble average (`E[W_T]`) becomes dominated by exponentially rare, exponentially large winning paths that the single agent *will never experience*. Focusing on the non-ergodicity highlights why maximizing `E[W_T]` is fundamentally flawed physics for a single agent – it optimizes for phantom paths.
  7.  **Resolving Paradoxes**: The ergodicity lens cleanly resolves "paradoxes" like the St. Petersburg or the difference between ensemble-optimal (often full-Kelly or over-betting) and time-optimal (fractional Kelly) strategies. It explains why `E[W_T]` can suggest a strategy that guarantees bankruptcy along the single path.

  ### Conclusion: Objective Rationality Emerges from Dynamics
  Samuelson is wrong because he prioritizes the mathematical abstraction (`E[U(W)]`) over the physical reality of the single trajectory. **For a persistent agent facing repeated multiplicative bets, the objectively rational strategy is the one that maximizes the time-average growth rate `g` of their single wealth path.** This is not an *assumption* of log utility; it's a *consequence* of the multiplicative dynamics and the non-ergodicity of the process. Maximizing `E[ln(W)]` is the *unique* way to achieve this objective. It ensures:
  *   Survival (positive `g`).
  *   Dominance over alternatives in the long run (even finite long runs).
  *   Optimal median/geometric mean outcomes over finite horizons.
  *   Avoidance of ruinous strategies suggested by naive `E[W_T]` maximization.

  The ergodicity framing rescues growth-rate maximization by demonstrating that it optimizes the *only quantity that physically matters to the agent* – the realized growth along their one life – exposing ensemble averages as irrelevant mathematical phantoms in non-ergodic multiplicative systems. This makes it objectively correct, not a matter of subjective utility.
