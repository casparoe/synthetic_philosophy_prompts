  ### Dialogue: The Kelly Debate  
  **Setting:** *Two friends, Geo (advocate of geometric rationality) and Util (expected-utility skeptic), sit at a table with a shared bankroll of $10,000. They face a repeatable bet: 60% chance to double the staked amount (net gain = stake if win), 40% chance to lose the stake. They must jointly decide the fraction \(f\) of the bankroll to stake.*  

  **Util:** Let’s start simply. Expected value says we maximize wealth by staking everything. But betting \(f = 1\) risks 40% ruin. So we agree: risk aversion is rational. But why stake the Kelly fraction \(f^* = 0.2\)? My utility function \(U(W) = \sqrt{W}\) (or any concave non-log) could prefer \(f = 0.1\).  

  **Geo:** Because this bet repeats. Maximizing expected log wealth—the growth rate—ensures our wealth grows faster than with any other strategy. In the long run, Kelly dominates almost surely. Your \(\sqrt{W}\) might feel safer, but it’s mathematically inferior for repeated play.  

  **Util:** "Almost surely in the long run" is a lie by omission. Samuelson’s objection: if we bet 100 times and stop, Kelly doesn’t maximize expected terminal wealth. Compute it: \( \mathbb{E}[W_{100}] = W_0 (1 + 0.2f)^{100} \), maximized at \(f = 1\)! Kelly’s \(f^* = 0.2\) yields lower expected wealth than \(f = 0.3\) or \(f = 0.4\).  

  **Geo:** Your expected wealth is skewed by astronomically unlikely paths—winning 100 times. Probability: \(0.6^{100} \approx 10^{-22}\). Meanwhile, Kelly’s median wealth grows as \((1.2)^{100}\), while \(f = 0.4\)’s median crashes toward zero. Ensemble averages mislead; we live one path. Time-average growth rate \(\frac{1}{n}\log(W_n / W_0)\) converges to \(\mathbb{E}[\log(1+r)]\), which Kelly maximizes. Ergodicity demands this.  

  **Util:** Ergodicity is a red herring. Yes, \(\lim_{n \to \infty} \frac{1}{n} \log W_n = g(f)\) almost surely. But I don’t care about \(n \to \infty\) if I die in \(n = 100\). Gambler’s ruin? Kelly avoids ruin, but so does \(f = 0.1\)—with less volatility. Why accept Kelly’s 26% chance of halving our wealth in 100 bets when \(f = 0.1\) cuts that to 2%?  

  **Geo:** Because \(f = 0.1\) leaves growth on the table! Kelly’s growth rate \(g^* \approx 0.02007\) dwarfs \(g(0.1) \approx 0.0116\). After 100 bets, Kelly’s typical wealth is \(W_0 e^{2.007}\), while \(f = 0.1\) gives \(W_0 e^{1.16}\)—a 130% penalty. Under-betting is long-run recklessness.  

  **Util:** Typical isn’t expected. And your "long run" is a faith-based mantra. What if our edge is misjudged? If \(p = 0.6\) is wrong, Kelly amplifies estimation errors. With \(f = 0.2\), three losses in a row (probability 6.4%) cuts wealth by 49%. If we’re risk-averse, that’s traumatic.  

  **Geo:** Then size your uncertainty interval and bet fractional Kelly. But the math is clear: for known \(p\), log is the only utility function where optimal myopic play matches long-run optimality. Your \(\sqrt{W}\) forces recalculating \(f\) for every horizon—arbitrary!  

  **Util:** Horizon sensitivity is a feature! If we share this bankroll for 10 bets, I’d stake \(f = 0.25\) to maximize \(\mathbb{E}[\sqrt{W_{10}}]\). Why prioritize your infinite-horizon statistic when reality is finite?  

  **Geo:** Because finite horizons are arbitrary. We can always place one more bet. And Kelly’s "eventual" dominance isn’t distant: after 700 bets, Kelly beats \(f = 0.25\) with 95% probability. Your objection is nihilism—if we truncate rationality at \(n\) bets, why not \(n = 1\)?  

  **Util:** No—it’s about coherence. Expected utility with non-log \(U\) is consistent for any \(n\). Kelly forces log utility on me. Why is *your* risk tolerance canonical? If I’m poorer, I’m hungrier; \(\sqrt{W}\) models that. Log assumes constant relative risk aversion. Why is that universal?  

  **Geo:** In multiplicative dynamics, wealth is relative. Log is the utility of growth. Risk-neutral EV maximizers go extinct; Kelly optimizers survive. Evolution selects for \(\log W\).  

  **Util:** Evolution! Now we’re in just-so stories. I’m a human, not a replicator. If I value financial security, Kelly’s volatility is irrational. Your "extinction" is irrelevant if I retire before the long run.  

  **Geo:** So we’re at an impasse. You’d stake \(f = 0.1\), I’d stake \(f = 0.2\). How to share a bankroll?  

  **Util:** Compromise: \(f = 0.15\). But know this—I’m yielding to cooperation, not Kelly. In 100 bets, if we lose early, your growth-optimal strategy could leave us poorer than my conservative stake.  

  **Geo:** And if we win early, your under-betting sacrifices compounding. I’ll accept \(f = 0.15\), but only because joint action requires sacrifice. Still—simulate 10,000 paths. Kelly’s wealth distribution will have fatter tails and a higher median. You’ll see.  

  **Util:** Fat tails? Yes—and I fear the left tail more than you. Run your simulation: include the probability we fall below $1,000 before bet 20. I’ll bet Kelly underperforms for *my* utility.  

  **Geo:** Then let’s flip a coin for it? No—cooperation wins. \(f = 0.15\). Place the bet.  

  *(They shake hands, tension lingering. Neither has conceded; both feel unresolved. The bet is placed, but the argument is eternal.)*  

  ---

  **Key Points Pressed:**  
  - **Geo** pressed Util on ergodicity (time-average vs. ensemble divergence), the myopic efficiency of log utility, and under-betting’s long-run cost.  
  - **Util** pressed Geo on finite horizons skewing expectations, non-log risk aversion being rational, and Kelly’s volatility amplifying short-term ruin risk.  
  - **No last word:** Util’s compromise is pragmatic, not philosophical; Geo’s acceptance is cooperative, not conceding. The core dispute—whether long-run growth dominates all—remains open.
