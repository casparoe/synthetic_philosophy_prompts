   Geo: And we hope for the best. 

          But I still think we should have done 20%. 

   Util: And I think 10% would have been safer. 

          But we have a compromise. 

          So let's place the bet. 

          (They place the bet at 15%. The coin is flipped. It comes up heads. They win. Now their bankroll is $1000 * (1+0.15) = $1150.)

