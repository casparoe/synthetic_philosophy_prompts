  I should structure this carefully. Start with the dual-task evidence as positive proof against switching. Explain why no switching costs can't be dismissed as "super-fast switching" - because even ultrafast switching would show some measurable lag in complex tasks. Then address the integration issue by showing how two systems can achieve coordination without shared consciousness.

  The argument needs philosophical precision too - distinguish phenomenal consciousness from access consciousness, and explain why behavioral unity doesn't require subjective unity. Maybe reference Schechter's work on subcortical pathways allowing information exchange without conscious integration.

