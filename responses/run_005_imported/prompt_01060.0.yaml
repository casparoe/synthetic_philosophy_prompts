  First, I need to recall the core objections to REU. The diachronic choice issue is key: sophisticated REU maximizers might pay to avoid information, leading to certain loss. Buchak's defense involves rejecting the dominance principle across aggregated states. Also, the distinction between risk aversion via utility curvature vs. the risk function r is crucial.

