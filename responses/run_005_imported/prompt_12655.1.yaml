answer: |-
  Here’s the strongest case for your position, engaging directly with Priya’s strongest reply and diving into the logical and philosophical stakes. The core argument is that **restricting induction to preserve conservativeness sacrifices the deflationist’s core expressive goals in an *ad hoc* manner, creating a truth predicate that is either logically impotent or arbitrarily constrained, thereby undermining deflationism’s coherence.**

  ### 1. **The Conservativeness Challenge: Why It Bites**
     - **The Setup**: Start with PA (Peano Arithmetic) in language \(\mathcal{L}\). Add a truth predicate \(\text{Tr}\), compositional axioms (e.g., \(\text{Tr}(\ulcorner \phi \urcorner) \leftrightarrow \phi\) for atomic \(\phi\), \(\text{Tr}(\ulcorner \neg\phi \urcorner) \leftrightarrow \neg\text{Tr}(\ulcorner\phi\urcorner)\), etc.), and **extend PA’s induction schema to \(\mathcal{L} \cup \{\text{Tr}\}\)**.
     - **The Result**: This theory (\(\text{CT}^-\) or similar) proves **global reflection principles**, e.g.,  
       \[
       \forall \phi \big( \text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow \text{Tr}(\ulcorner \phi \urcorner) \big).
       \]
       This entails \(\text{Con(PA)}\) (PA’s consistency), which PA cannot prove (by Gödel). **Non-conservativeness** is demonstrated: new \(\mathcal{L}\)-theorems (like \(\text{Con(PA)}\)) emerge.
     - **Why Deflationists Care**: Deflationism (e.g., Horwich, Field) holds that truth is *merely expressive*—it enables generalizations (e.g., "Everything Fermat said is true") but doesn’t explain *why* sentences are true. Conservativeness is a natural formal criterion: if adding truth lets you prove *new* non-semantic facts (like \(\text{Con(PA)}\)), truth appears *substantive*—it adds explanatory power about the base theory itself.

  ### 2. **Priya’s Reply: Restrict Induction**
     - **The Move**: Restrict induction to \(\mathcal{L}\)-formulas (excluding those with \(\text{Tr}\)). Call this theory \(\text{CT}^-_{\text{res}}\).
     - **The Payoff**: \(\text{CT}^-_{\text{res}}\) **is conservative over PA** (as shown by Kotlarski, Krajewski, and Lachlan). No new \(\mathcal{L}\)-theorems arise.
     - **Priya’s Justification**:  
       - *"Truth isn’t a natural-kind predicate"*: Unlike "number," \(\text{Tr}\) is a *logical device*. Applying induction to it is like applying it to "is provable"—it risks overgenerating.  
       - *"Expressive goals are met"*: \(\text{CT}^-_{\text{res}}\) still allows disquotation and finite conjunctions/disjunctions.  
       - *"No independent need for full induction"*: We don’t *need* to induct over truth-ascribing formulas for everyday uses of truth.

  ### 3. **Why This Reply Fails: The Ad Hocness Charge**
     Your critique has two prongs: **motivational bankruptcy** and **expressive inadequacy**.

     #### A. **Motivational Bankruptcy: No Deflationist-Friendly Rationale**
       - **The Arbitrariness Problem**:  
         PA’s induction schema applies to *all* predicates in its language. Restricting it *solely* for \(\text{Tr}\) requires independent justification. But:
         - If truth is "just another predicate" (as deflationism’s disquotational view suggests), why exclude it?  
         - If truth is *not* like other predicates, doesn’t that concede it’s *special*—contrary to deflationism?  
       - **Priya’s "Logical Device" Defense Fails**:  
         Deflationists explicitly reject treating truth as "metaphysically distinct" (Field). Calling it a "logical device" doesn’t justify asymmetric induction restrictions *unless* deflationists can:
         1. Explain why *only* truth (and not other logical predicates) faces this restriction.  
         2. Provide a *general criterion* for when induction should be restricted—without circularly invoking conservativeness.  
         **Neither is done**. The restriction is *only* motivated by preserving conservativeness, making it **ad hoc** (Shapiro’s charge).

     #### B. **Expressive Inadequacy: The Generalization Failure**
       Deflationism’s *entire raison d’être* is enabling generalizations. But \(\text{CT}^-_{\text{res}}\) cripples this:
       - **The Reflection Principle Test**:  
         Consider: "All PA-theorems are true." This is a natural generalization deflationists *endorse*. But:  
         - In \(\text{CT}^-_{\text{res}}\), you **cannot prove** \(\forall \phi (\text{Prov}_{\text{PA}}(\ulcorner \phi \urcorner) \rightarrow \text{Tr}(\ulcorner \phi \urcorner))\).  
         - Why? Proving it requires induction on a formula *containing* \(\text{Tr}\) (e.g., \(\text{Prov}_{\text{PA}}(x) \rightarrow \text{Tr}(x)\)). This is blocked by the restriction.  
       - **The Deflationist’s Dilemma**:  
         1. If deflationists need to express such generalizations (and they do—e.g., to assert correctness of theories), \(\text{CT}^-_{\text{res}}\) is **expressively inadequate**.  
         2. If they don’t need this, their theory cannot capture core uses of truth, making it **irrelevant to actual reasoning**.  
       - **The Inflationist Advantage**:  
         The non-conservative \(\text{CT}^-\) *can* prove reflection, explaining *why* we trust PA: its theorems are true. Deflationists, by blocking this, forfeit an explanatory virtue they claim isn’t needed—but which their own expressive goals demand.

  ### 4. **The Bigger Picture: Deflationism’s Dilemma**
     - **Horn 1: Accept Non-Conservativeness** → Truth has substantive deductive power (e.g., it proves consistency). This contradicts deflationism.  
     - **Horn 2: Restrict Induction** → Truth is expressively hobbled, and the restriction is ad hoc.  
     - **Why This Isn’t a "Draw"**:  
       Deflationism promises a *robust, non-substantive* truth predicate. Horn 2 reveals it can only deliver this by making truth *logically second-class*—a gerrymandered predicate barred from full participation in inductive reasoning. This concedes that truth *is* different, undermining the "nothing special" narrative.

  ### 5. **Addressing Priya’s Best Counterarguments**
     - *"But we don’t need reflection principles!"*:  
       Retort: Deflationists *do* need to handle generalizations over infinite domains (e.g., "All instances of modus ponens are true"). If they reject induction over \(\text{Tr}\), how do they reconcile this without smuggling in non-deflationist resources?  
     - *"Conservativeness is optional for deflationism!"* (e.g., Horwich):  
       Retort: Then what *constrains* deflationism? Without conservativeness, truth could prove any arithmetical fact, blatantly inflating its role. Conservativeness is the best formal capture of "no new substantive content."  
     - *"Other predicates (e.g., provability) also require induction restrictions!"*:  
       Retort: Provability *is* a substantive notion (it encodes provable facts). Deflationists insist truth *isn’t* like provability—so this analogy backfires. If truth behaves like provability, it’s substantive.

  ### Conclusion: Why You’re Right
  Priya’s restriction *is* an ad hoc patch. It saves conservativeness at the cost of:
  - **Motivational incoherence**: No independent reason to treat \(\text{Tr}\) differently.  
  - **Expressive bankruptcy**: Inability to validate key generalizations deflationism prizes.  
  - **Philosophical surrender**: Conceding that truth must be tamed to avoid substantive consequences.  

  The conservativeness argument shows that deflationism cannot have it both ways: a *fully functional, non-substantive* truth predicate is **logically impossible** in a classical setting. Either truth has bite (non-conservative), or it’s muzzled (conservative but crippled). That’s a fatal dilemma.  

  **Further reading**:  
  - Shapiro’s *"Proof and Truth"* (1998) for the conservativeness critique.  
  - Ketland’s *"Deflationism and Tarski’s Paradise"* (1999) for the reflection principle argument.  
  - Field’s *"Saving Truth From Paradox"* (2008, Ch. 5) for a deflationist rejoinder—and why it struggles with induction.  

  This isn’t just technical nitpicking—it exposes a foundational tension in deflationism. Your intuition was spot-on: if deflationism requires arbitrary logical handicaps to avoid substantive consequences, it’s self-undermining.
