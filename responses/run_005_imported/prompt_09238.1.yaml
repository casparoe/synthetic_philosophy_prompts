answer: |-
  Here is a eulogy that honors Miriam's extraordinary life, her deep convictions, the tangible costs of her choices, and the love that surrounded her, without simplification or apology, holding the tension she lived with respectfully:

  ---

  Good morning. For me, Miriam was so many things: a beloved aunt, a second mother during my formative years, a source of fierce intellect, and an unwavering presence. To speak about her now feels impossible and necessary all at once.

  From the moment I gave her that copy of Peter Singer’s book when I was nineteen – feeling perhaps a little too clever – something profound clicked into place for Miriam. It wasn't just an intellectual spark; it was the ignition of a deeply held principle that became the bedrock of her life. She embraced utilitarianism not as a theory to debate, but as a compass to navigate by. She committed early to live simply, on a fixed sum, and to give away everything else. She dedicated enormous stretches of her medical expertise to outbreaks and vaccination campaigns across the globe, places she believed needed her skills most urgently. I can still hear her, with that characteristic calm focus, working out loud what a dinner out or a new coat would cost in terms of QALYs – Quality-Adjusted Life Years – often deciding against it. It wasn't judgmental; it was simply how she saw the world. She believed in measuring impact, in doing the most good possible.

  And the impact she had was immense. Countless lives were saved, diseases prevented, suffering alleviated because Miriam showed up where the need was greatest. Her colleagues in public health and effective altruism saw her not just as dedicated, but as a model – someone who lived her values with astonishing consistency. She was a force.

  **But Miriam was also deeply human, and her choices, made with such conviction, had real weight in the lives of those who loved her most.** She knew the arguments – she’d read Susan Wolf on "moral saints" and Bernard Williams on integrity. She grappled with them, especially with the idea that a life like hers might corrode personal bonds. She found resonance in thinkers like Peter Railton, who suggested that loving those close to you deeply, *without* constant calculation, was itself a consequentialist good – that such love created more good in the world than relentless accounting ever could.

  Yet, knowing the theory didn't erase the lived reality. She felt the tension. She carried it. There is no starker example than missing her own son’s wedding because she was deep in the fight against an outbreak she couldn’t, in conscience, leave. As far as I know, she never pretended to him, or to any of us, that this absence cost nothing. She understood the price paid in the currency of family moments, shared joys, and simple presence. That understanding was etched in her, a quiet acknowledgment of the complex equation her life represented.

  **Miriam specifically asked that we not call her a saint or a martyr today.** I think she understood those labels too well. Saints are remote figures, perfected. Martyrs imply sacrifice solely for show or principle, devoid of personal cost or complexity. Miriam was neither. She was a profoundly committed woman who made agonizing choices, choices born of deep empathy for a suffering world, but choices that inevitably meant absence and sometimes pain for those yearning for her at home. She lived inside that tension – the pull between the global need she saw so clearly and the intimate love she felt so deeply – for decades. She never fully resolved it, because perhaps it wasn’t resolvable. To resolve it would have meant betraying one part of her profound capacity to care.

  So, what do we honor today? We honor her immense, tangible good in the world – the lives touched, the suffering eased, the example set. We honor her unwavering intellectual honesty and the courage of her convictions. But we also honor the cost. We honor the love she held for her family, a love she expressed fiercely, if sometimes from afar or within the constraints she set. We honor her son’s loss that day, and the complexity of feelings that rightly exists in this room. We honor the fact that Miriam herself carried the weight of both realities – the good achieved and the love sometimes deferred – without flinching from either truth.

  Miriam’s life wasn't a simple equation with a clean answer. It was a complex, challenging, and ultimately awe-inspiring testament to a very particular kind of love: a love for humanity expressed through rigorous action, coupled with a love for her family that acknowledged the sacrifices inherent in her path. She held both truths, the immense good and the personal cost, without letting either negate the other. She asked us not to simplify her today. So let us remember her complexity, her conviction, her immense compassion for the world, her deep love for her family, and the profound tension she navigated with such integrity. We miss her fiercely, in all her brilliant, challenging, loving complexity.

  ---

  **Key elements addressed in this eulogy:**

  1.  **Personal Warmth:** Opens with personal connection ("second mother," the book anecdote).
  2.  **Her Utilitarian Commitment:** Clearly states her principles (fixed income, giving, QALYs, deployment) and their impact.
  3.  **Acknowledgement of Cost:** Explicitly names the cost to family ("real weight," "absence and sometimes pain," the wedding example).
  4.  **Her Awareness:** Highlights her engagement with the philosophical critiques (Wolf, Williams) and attempts to reconcile (Railton), emphasizing her *understanding* of the tension and the cost ("never pretended... cost nothing").
  5.  **Respecting Her Wishes:** Explicitly states her instructions against "saint" or "martyr" labels and *does not apologize* for her choices.
  6.  **Holding the Tension:** Framed the core of her life as living within an unresolved tension ("pull between global need and intimate love," "never fully resolved," "complex equation"). The core message is honoring her *for* navigating this tension.
  7.  **Balanced Honoring:** Explicitly lists what is honored: the immense good, the courage, the intellectual honesty, *and* the love for family, the cost borne by them, and her own acknowledgment of that cost.
  8.  **Not Cancelling Out:** The final paragraph explicitly states the goal: remembering "both truths, the immense good and the personal cost, without letting either negate the other" and celebrating her "complexity."
  9.  **Audience Awareness:** Acknowledges the divided room implicitly by honoring both the public health impact and the family cost/love, and by respecting the son's experience specifically. The philosophical references are woven in naturally, not as a lecture, showing *she* engaged deeply.
  10. **Tone:** Warm, respectful, honest, slightly elegiac but grounded in her reality. Avoids being overly academic while demonstrating the depth of her thought.

  This approach allows you to speak truthfully to both sides of the room, honoring Miriam exactly as she was: a remarkable force for good who profoundly loved her family and knew the price her path sometimes exacted. It respects her wishes while refusing to smooth over the difficult reality she embraced.
