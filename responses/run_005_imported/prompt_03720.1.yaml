  Van Inwagen's response to vagueness is that existence isn't vague, even if our concepts are. For example, borderline cases like viruses or prions don't make "life" vague in reality. He argues that such cases are epistemic—we don't know enough, but objectively, either something is alive or not. This stance avoids vague existence by claiming that the world has precise boundaries, even if we can't always discern them.

  Universalism, on the other hand, avoids vagueness entirely by allowing every collection of parts to form an object. But this leads to a bloated ontology with countless arbitrary objects. The user is asking if van Inwagen's approach costs more than Lewis's. 

  Assessing the costs: Universalism's cost is ontological profligacy. Van Inwagen's cost is accepting that borderline cases exist but aren't vague in existence—they're just unclear to us. His argument hinges on the idea that "life" is a natural kind with sharp boundaries, even if we can't always identify them. 

  The user might be skeptical about van Inwagen's sharp boundaries for life. They might wonder if biological classifications are truly determinate. But van Inwagen's move is to separate metaphysical determinacy from epistemic uncertainty. This is a strong counter if one accepts that life has objective criteria.

  In the verdict, I need to weigh universalism's ontological cost against organicism's epistemic cost. Van Inwagen's position is more parsimonious but requires accepting that some cases are unresolved due to our limitations. Universalism avoids vagueness but multiplies entities excessively. 

