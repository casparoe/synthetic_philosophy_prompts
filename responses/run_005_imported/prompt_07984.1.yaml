  But note: Some might argue that prohibitionism could be built-in if we think of prohibitions as group-relative, but the original account doesn't emphasize that. Similarly, for Potts, if we allow that the CI can be contextually modulated, it might be better. However, in the standard accounts, we'll stick to the above.

