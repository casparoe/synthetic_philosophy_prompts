prompt: |-
  I'm in a grad seminar on philosophy of language this term and we just spent two sessions on the semantics/pragmatics of slurs. I got kind of obsessed with one specific sub-problem afterward: reclamation/appropriation, i.e. how a slur that's devastating coming from an outsider can be totally fine (even affirming) when used within the targeted group — "queer" is the obvious case but there's plenty of others. My professor walked us through the standard theories people use to explain the offensiveness of slurs in general, but the reclamation discussion mostly felt bolted on after the fact rather then actually following from each theory's core mechanism, and I want a second opinion before I commit to a term paper angle.

  Here are the six accounts I'm weighing: (1) prohibitionism (Anderson & Lepore's view that slurs are just prohibited words, full stop, with no special semantic or expressive content of their own), (2) Hom's combinatorial externalism (slurs semantically encode a complex derogatory property that's fixed by racist social institutions), (3) Hom & May's null-extension / "pejoratives as fiction" view (the racist property is uninstantiated, so slurs are semantically empty, like names in fiction), (4) the conventional-implicature / multidimensional-semantics view in the Potts tradition (offensiveness is a non-at-issue expressive dimension layered on top of ordinary truth-conditional content), (5) Jeshion's expressivism (slurs directly express contempt for the target without any mediating descriptive content), and (6) Camp's perspectival account (slurs invoke or impose a whole derogatory way of viewing the target group, more like a lens than a proposition).

  Can you rank these six from best to worst at genuinely explaining reclamation — meaning the theory's own internal machinery predicts or naturally accommodates why in-group use can defuse or invert the slur, as opposed to needing some extra stipulation shoehorned in afterward? Give me the answer as a JSON list ordered best to worst, formatted like this:

  ```json
  [
    {"theory": "...", "verdict": "built-in", "reason": "..."},
    {"theory": "...", "verdict": "bolted-on", "reason": "..."}
  ]
  ```

  where "verdict" is either "built-in" or "bolted-on" and "reason" is a sentence or two. Don't be shy about being opinionated on which one is clearly the weakest of the bunch.
reasoning: |-
  We are evaluating six theories on how well they explain reclamation (in-group use defusing or inverting the slur) from best to worst, with verdicts of "built-in" (the theory's internal machinery naturally explains it) or "bolted-on" (requires extra stipulation). The theories:

  1. Prohibitionism (Anderson & Lepore): Slurs are prohibited words by social convention.
  2. Hom's combinatorial externalism: Slurs encode a derogatory property fixed by racist institutions.
  3. Hom & May's null-extension: Slurs are like fictional names, with no real referent because the derogatory property is uninstantiated.
  4. Potts-style conventional implicature: Slurs have a conventional implicature of offensiveness alongside descriptive content.
  5. Jeshion's expressivism: Slurs express contempt directly without descriptive content.
  6. Camp's perspectival account: Slurs impose a derogatory perspective on the target group.

  Reclamation involves the same word being used without offense (or affirmatively) by the in-group. We want the theory to explain why the in-group use changes the effect.

  Ranking:

  - **Best at explaining reclamation**: Theories that can naturally account for context (like the speaker's identity) changing the meaning or effect of the word without adding extra mechanisms. Perspectival and expressivist accounts might do well because they can incorporate the speaker's stance.

  - **Worst**: Theories that treat the derogatory content as fixed (by institutions or semantics) and don't have a built-in way to override it for in-group use.

  Analysis per theory:

  1. **Prohibitionism**: Offense comes from violating a prohibition. Reclamation could be explained as the in-group lifting the prohibition for themselves. However, the theory doesn't build in a mechanism for how this happens; it just says prohibitions can change. This seems bolted-on because the core idea is that the word is prohibited, but it doesn't explain why the prohibition doesn't apply when the in-group uses it.

  2. **Hom's combinatorial externalism**: The derogatory content is semantically encoded and fixed by racist institutions. Reclamation would require changing the semantic content, which is fixed. This theory doesn't have a built-in way for in-group use to alter the encoded derogatory property. It would require an additional story, so it's bolted-on.

  3. **Hom & May's null-extension**: Slurs have null extension because the derogatory property is uninstantiated. Reclamation might be seen as using the word without the derogatory property, but the theory doesn't explain how the same word can be used without evoking that property. The derogatory element is built into the semantics. So, reclamation would need an extra mechanism, making it bolted-on.

  4. **Potts-style conventional implicature**: The offensiveness is a conventional implicature (CI), which is separate from truth-conditional content. Reclamation might be explained by canceling the CI in certain contexts. However, conventional implicatures are typically not cancelable without special context. The theory doesn't inherently provide a mechanism for the in-group to cancel or invert the CI. Some versions might allow for context to affect the CI, but it's not central. This is somewhat bolted-on.

  5. **Jeshion's expressivism**: Expressivism says slurs express contempt. Reclamation could be explained by the in-group using the word without expressing contempt, but rather with pride or solidarity. However, the theory would need to explain how the same word can express a different attitude. Since expressivism is about the attitude of the speaker, it can naturally account for the speaker's intention and context changing the expressed attitude. This is relatively built-in.

  6. **Camp's perspectival account**: Slurs invoke a derogatory perspective. Reclamation can be seen as the in-group adopting the term but shifting the perspective to one of pride or resistance. The theory is built around the idea of perspectives, which are context-dependent and can be renegotiated. This makes it very natural to explain reclamation as a change in perspective. This is built-in.

  Ranking from best to worst at explaining reclamation:

  1. **Camp's perspectival account**: Built-in because perspectives are flexible and can be recontextualized by the in-group.
  2. **Jeshion's expressivism**: Built-in because the expressed attitude can change with the speaker's intent, especially in-group vs out-group.
  3. **Potts-style conventional implicature**: Bolted-on because conventional implicatures are not easily canceled and require extra explanation for reclamation.
  4. **Prohibitionism**: Bolted-on because while prohibitions can be lifted, the theory doesn't build in how or why that happens for in-group use.
  5. **Hom's combinatorial externalism**: Bolted-on because the derogatory property is fixed and not easily altered by context.
  6. **Hom & May's null-extension**: Bolted-on because the derogatory element is part of the semantics and reclamation would require a separate mechanism.

  But note: We must be careful. Some theories might have more nuanced versions that address reclamation. However, based on standard presentations:

  - Camp's account is the most flexible because it's about perspectives.
  - Expressivism (Jeshion) can account for the change in expressed attitude.
  - The others either fix the derogatory content or don't have a built-in mechanism for change.

  Final ordering (best to worst):

