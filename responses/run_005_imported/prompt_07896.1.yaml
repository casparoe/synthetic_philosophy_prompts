  About the Lakatos connection: Popper used "metaphysical research programme" in the 1970s, while Lakatos developed his "scientific research programmes" earlier, in the 1960s. Lakatos was Popper's student, so there's likely influence. Mentioning this adds context without muddying the waters, as long as it's noted as an aside.

