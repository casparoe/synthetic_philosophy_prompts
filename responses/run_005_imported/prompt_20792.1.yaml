prompt: |-
  Next week I'm interviewing a decision theorist on my little podcast -- she's built her career defending maxmin expected utility (the Gilboa-Schmeidler answer to Ellsberg's urn problem) as the rational response to ambiguity, not a bias. I'm a software engineer, not a philosopher, so I know the basic three-color urn setup and that it breaks Savage's sure-thing principle, and it caught my eye because it's basically the same shape as the distributionally-robust-optimization stuff we do at work, but I don't want her just restating that 101 version. Draft 8-10 questions that push past it: at least one on why the sure-thing principle, specifically, is the axiom worth sacrificing rather then something else, one on the "maxmin is just worst-case pessimism dialed to max" complaint and whether alpha-maxmin or the smooth ambiguity model actually dodge it or just relabel it, one on what happens once you chain several ellsberg-style choices together over time instead of judging them one at a time, and one on the finding that ambiguity aversion seems to track how expert people feel rather then the actual ambiguity -- which makes the whole thing look more psychological than rational. Give each question a short follow-up keyed to whatever answer she'll reach for first.
reasoning: |-
  Okay, the user is a software engineer preparing to interview a decision theorist who defends maxmin expected utility (MMEU) as rational for handling ambiguity. They want to move beyond the basic Ellsberg urn example and delve into deeper critiques and nuances. 

  First, I need to unpack their explicit requests: They want questions challenging why the sure-thing principle is sacrificed over other axioms, addressing the "maxmin is extreme pessimism" critique, exploring sequential Ellsberg-style choices, and examining the role of perceived expertise versus actual ambiguity. They also want strategic follow-ups for each.

  Hmm... the user's background in distributionally robust optimization (DRO) is key here. They recognize the mathematical similarity but want philosophical depth. That duality—practical math vs. normative rationality—should thread through the questions. 

  For the sure-thing principle sacrifice: The obvious counter is that ambiguity violates separability, but why not ditch completeness instead? The follow-up should push her to justify why preserving completeness (all preferences are comparable) is worth the trade-off. Maybe invoke Levi's bounded rationality as a contrast.

  On the pessimism critique: Alpha-maxmin and smooth models seem to soften maxmin, but do they just disguise pessimism? The follow-up needs to force her to distinguish between "rational caution" and "irrational fear." Could link to how DRO tunes conservatism with parameterized uncertainty sets.

  Sequential choices are tricky. If MMEU updates ambiguously over time, does it lead to dynamic inconsistency? The follow-up should probe whether freezing beliefs (Gilboa-Schmeidler updating) feels artificial. Software analogies to caching worst-case scenarios might resonate.

  The expertise point is fascinating. If ambiguity aversion hinges on subjective confidence, isn't it psychological? Follow-up must challenge whether MMEU can be "rational" if it's contingent on self-assessment. Maybe contrast with true uncertainty (Knightian) vs. perceived competence.

  ...Wait, did they imply wanting exactly one question per theme? No, they said "at least one" on each, so I can add more. A question on real-world applicability (beyond urns) would ground it. Also, the cognitive load critique—MMEU is computationally intense—might appeal to their engineering side.

  Should avoid letting her retreat to "Ellsberg proves ambiguity exists." Push toward why MMEU is uniquely rational versus alternatives. The follow-ups are crucial: anticipate her defenses and corner her with contradictions. 

  Example: If she says MMEU isn't pessimistic but prudent, ask why prudence demands *minimizing over all priors* rather than, say, averaging with a risk premium. Force her to defend the extremeness.

  Also, note their podcast is "little"—keep questions tight but lethal. No jargon dumps. Anchor in intuition: "If I feel like a novice, I avoid ambiguity; is that rational or just insecure?"
answer: |-
  Here are 8 focused questions pushing beyond Ellsberg 101, designed to challenge the rational foundations of MMEU, with strategic follow-ups anticipating common defenses:

  1.  **Sacrificing Sure-Thing:** "You argue MMEU rationally violates Savage's Sure-Thing Principle (STP). But why sacrifice STP *specifically*? Why not abandon Completeness (requiring a preference for all gambles) or Transitivity instead? Doesn't preserving Completeness while sacrificing STP privilege comparability over separability in a way that might *itself* be questionable under deep ambiguity?"
      *   *Follow-up (if she emphasizes comparability):* "If deep ambiguity means we genuinely *can't* form probabilistic beliefs, isn't demanding complete preference orderings *forcing* a comparison we rationally shouldn't make? Isn't Levi's 'Indeterminate Probability' view – allowing incompleteness – a more honest representation of true ignorance?"

  2.  **Beyond Pessimism?:** "Critics call MMEU 'pathological pessimism'. Proponents of α-MaxMin or Klibanoff's Smooth Ambiguity Model (SAM) argue they moderate this by weighting priors. But doesn't α-MaxMin just soften pessimism to a parameter, and doesn't SAM's 'ambiguity attitude' parameter essentially *relabel* the same underlying aversion without fundamentally explaining *why* minimizing over priors is uniquely rational?"
      *   *Follow-up (if she argues α/SAM capture nuance):* "If the 'rational core' is still aversion captured by deviating from expected utility under a single prior, doesn't *any* concave transformation over priors (like SAM) or weighting scheme (like α-MM) just *describe* the aversion rather than *justify* min-over-priors as *the* rational response? Why is min uniquely privileged?"

  3.  **Sequential Ambiguity & Dynamic Consistency:** "Ellsberg is static. In dynamic settings with chained ambiguous choices (e.g., sequential urns where composition depends on past ambiguous draws), how does MMEU handle updating? Gilboa-Schmeidler requires *freezing* the set of priors, leading to potential dynamic inconsistency (planning one thing, doing another later). Isn't this a major practical weakness for a normative theory?"
      *   *Follow-up (if she defends freezing priors):* "Doesn't freezing the prior set imply that no new ambiguous information can rationally *reduce* your perceived ambiguity? If I observe ambiguous data suggesting some priors are implausible, why can't I rationally exclude them, updating my set? Isn't refusing to update dynamically itself irrational?"

  4.  **Expertise vs. Ambiguity (The Rationality Challenge):** "Studies (like Fox & Tversky) show ambiguity aversion correlates strongly with *feeling like a novice* rather than the actual degree of ambiguity. If the aversion is driven by subjective confidence (or lack thereof) rather than objective uncertainty structure, doesn't this pull MMEU towards being a *psychological* description of insecurity, undermining its claim as the uniquely *rational* response to objective ambiguity?"
      *   *Follow-up (if she downplays the finding or links confidence to rational assessment):* "Can MMEU be truly 'rational' if two agents facing identical, objectively ambiguous prospects exhibit vastly different aversion solely based on their (potentially miscalibrated) *self-perceived expertise*? Doesn't rationality demand the response track the *structure of the world*, not just internal state?"

  5.  **Defining the "Reasonable" Prior Set:** "MMEU's bite depends crucially on defining the set of 'reasonable' priors (C). But what's the rational basis for C? Too small, it collapses to SEU; too large, it collapses to Wald's Maximin pure pessimism. Isn't specifying C itself an inherently ambiguous – and potentially arbitrary – step that smuggles subjectivity back into the core of the 'rational' model?"
      *   *Follow-up (if she appeals to objective information/constraints):* "In most real-world ambiguity (not neatly defined urns), objective constraints on priors are weak. Doesn't the need to *subjectively* determine C mean MMEU ultimately relies on a subjective judgment call *before* applying the min operator, making the 'objectivity' of the min step somewhat illusory?"

  6.  **The Cost of Robustness:** "In engineering (DRO), we use maxmin over uncertainty sets as a *deliberately conservative* tool to ensure performance guarantees, accepting we might sacrifice average-case performance. Isn't MMEU similarly a *conservative heuristic* rather than pure rationality? Isn't the truly rational agent one who, recognizing ambiguity, seeks more information or uses less extreme robustness (like convex risk measures), rather than defaulting to min?"
      *   *Follow-up (if she distinguishes normative/prescriptive):* "If MMEU is normative rationality, shouldn't it prescribe what an *ideally rational* agent *should* do with ambiguous knowledge? Does an ideal agent truly have *no rational basis* for distinguishing likelihoods within the set C, forcing them to act *as if* the worst is certain? Isn't that an epistemic failure?"

  7.  **Alternatives: Direct vs. Indirect Approaches:** "MMEU handles ambiguity 'indirectly' by modifying the decision rule over probabilities. Theories like Bewley's Knightian Uncertainty (incompleteness) or variational preferences (penalizing deviations from a baseline prior) handle it more 'directly' in the preference structure. Why is the indirect approach via min-over-priors *more rational* than admitting incompleteness or explicitly modeling aversion costs?"
      *   *Follow-up (if she argues MMEU is simpler/more decisive):* "Doesn't the demand for completeness and a complete preference ordering *force* MMEU into the min formulation? If we relax the requirement for completeness (Bewley), doesn't that avoid the 'pessimism' charge more cleanly by simply acknowledging we *don't know* enough to rank some options?"

  8.  **Cognitive Realism & Rationality:** "MMEU requires agents to conceive of and evaluate outcomes under *all* priors in set C, then take the min. This seems cognitively demanding. If a normative theory prescribes a strategy that is computationally intractable or psychologically implausible for humans (beyond simple urns), does that weaken its claim as a model of *rationality*, especially compared to simpler heuristics or models with lower cognitive load?"
      *   *Follow-up (if she separates ideal from bounded rationality):* "Even for an ideal rational agent with unlimited compute, *why* is the specific operation of minimizing expected utility over a set of priors the *epistemically correct* response to knowing only that the true prior lies in C? What epistemic principle justifies min rather than, say, a different aggregation rule?"

  **Key Interview Strategy:**

  *   **Listen Carefully:** Don't rigidly stick to follow-ups. Use them if her answer touches on the anticipated point, but adapt based on her actual response. Probe the *foundations* of her claims.
  *   **Clarify Terminology:** Ensure you're both using "rational," "normative," "ambiguity," and "pessimism" consistently.
  *   **Bridge to Her Work:** If she mentions specific papers or extensions (e.g., variational preferences, applications), ask how those address the core critiques raised.
  *   **Embrace Nuance:** The goal isn't to "win," but to explore the deep tensions in rational choice under ambiguity. Acknowledge valid points she makes.

  These questions push into the justifications, alternatives, dynamic behavior, psychological links, and practical/epistemic costs of MMEU, moving well beyond the basic Ellsberg demonstration. Good luck with the interview!
