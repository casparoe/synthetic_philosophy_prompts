prompt: |-
  A labmate spent about a day cleaning data and rerunning a few robustness checks for a paper I'm about to submit, but had no role in designing the study, interpreting the results, or drafting the manuscript. When I suggested they be thanked in the acknowledgments rather than added as a coauthor, they objected: if they'd written half the paper, I'd call them a coauthor without hesitation, and what they did is clearly more than nothing — so unless I can name the exact point between those extremes where authorship begins, my refusal is just arbitrary line-drawing. I don't have a good answer to that, but I remain fairly confident they don't belong on the author list. Is my labmate right that, absent such a cutoff, my position is arbitrary — or is there a more principled way to think about this?
reasoning: |-
  Okay, let me start by unpacking this user's dilemma. The core conflict is about authorship versus acknowledgment after a labmate contributed to data cleaning and robustness checks. The user feels the labmate shouldn't be a coauthor, but the labmate argues that without a clear cutoff, excluding them is arbitrary. 

  First, I need to recall standard academic authorship criteria. Most fields follow the ICMJE guidelines or similar, emphasizing substantial contributions to conception, design, analysis, interpretation, AND drafting/revision. The labmate's work—while important—seems limited to execution under direction. That's more technical than intellectual. 

  Hmm, the labmate's argument about "no clear line" is interesting but flawed. It's like saying because we can't define the exact moment day becomes night, twilight doesn't exist. Contribution types matter more than volume. Cleaning data for a day is fundamentally different from shaping the study's intellectual framework. 

  I should also consider the user's unspoken worries: lab dynamics, fairness to other contributors, and journal policies. Adding coauthors lightly could devalue authorship for others who did heavier lifting. Plus, if the journal checks contribution statements, this might backfire. 

  The labmate's "if I wrote half the paper" comparison feels manipulative. Writing engages deeply with content; data cleaning is procedural. Equating them ignores qualitative differences in scholarly contribution. 

  Maybe the user needs ammo for this conversation. Concrete examples: Would they list a research assistant who ran pre-specified analyses? Probably not. Framing it as role boundaries (contributor vs. creator) might help. Also, emphasizing gratitude in acknowledgments as meaningful—not a consolation prize. 

  ...Wait, is there a power imbalance here? The labmate might feel undervalued. The user could offer future coauthorship opportunities to mend fences while holding this boundary. 

  Ultimately, the principled stance isn't about drawing lines—it's about defining the nature of authorship as substantive intellectual involvement. That's the hill to defend.
answer: |-
  This is a common and important authorship debate. Your labmate's argument—that without a precise cutoff, exclusion is arbitrary—sounds logical but misrepresents how authorship is ethically and professionally defined. **Your position is not arbitrary; it's based on widely accepted principles of scholarly contribution.** Here's how to break it down:

  1.  **Authorship = Substantial Intellectual Contribution & Accountability:** Co-authorship isn't just about effort or time spent; it's about **intellectual ownership** and **responsibility** for the core work. Key elements typically include:
      *   **Conception/Design:** Shaping the research question, hypothesis, methodology.
      *   **Acquisition/Analysis/Interpretation of Data:** Not just executing tasks, but understanding *why* and interpreting *what it means* for the study's conclusions.
      *   **Drafting or Critically Revising the Manuscript:** Engaging deeply with the intellectual content and narrative.
      *   **Final Approval & Accountability:** Taking responsibility for the published work's integrity.

  2.  **Your Labmate's Contribution Falls Outside Core Authorship Criteria:**
      *   **Executed Tasks Under Direction:** Data cleaning and running pre-specified robustness checks (while crucial!) are essential *technical* contributions, often done under the guidance of the lead author/researcher (you). They require skill and diligence, but not necessarily the intellectual engagement with the *why* and *so what* of the research.
      *   **No Role in Core Intellectual Elements:** They acknowledge no role in designing the study, interpreting results, or drafting. These are the hallmarks of authorship.
      *   **"More than Nothing" ≠ "Authorship":** Acknowledgment *specifically exists* to recognize valuable contributions that don't meet the bar for authorship. Thanking them sincerely acknowledges their effort without diluting the meaning of co-authorship.

  3.  **Why the "Slippery Slope" Argument Fails:**
      *   **It Ignores Qualitative Differences:** Writing half the paper involves deep intellectual engagement with the *entire* research project – its logic, arguments, implications. Cleaning data for a day involves focused technical execution. These are fundamentally *different kinds* of contributions, not just points on a single "effort" scale.
      *   **"Arbitrary Line" is a Misnomer:** While the *precise* point might be debated in borderline cases, your situation is **not borderline**. The distinction between "technical execution under direction" and "intellectual conception/design/interpretation/drafting" is a **qualitative boundary**, not an arbitrary point on a quantitative scale of hours worked. Most authorship guidelines draw this clear boundary.
      *   **Standards Exist:** Point your labmate to established guidelines (like ICMJE, APA, or your field's specific standards). These consistently emphasize the intellectual components listed above. Your position aligns with these principles.

  4.  **Principled Reasoning for Your Decision:**
      *   **Integrity of Authorship:** Adding someone who didn't contribute intellectually misrepresents their role and devalues co-authorship for those who did.
      *   **Accountability:** Co-authors must be able to defend the work. Could your labmate defend the study design, interpretation, or manuscript content? If not, their inclusion is misleading.
      *   **Fairness:** It respects the greater intellectual contribution of those involved in the core research process. It also ensures acknowledgment is meaningful for those whose contributions are vital but technical.
      *   **Journal Policies & Norms:** Most reputable journals require authors to specify contributions and explicitly state they meet authorship criteria. Your labmate's contribution wouldn't pass this scrutiny.

  **How to Respond (Principled & Constructive):**

  1.  **Acknowledge & Value Their Contribution:** Start by sincerely thanking them. Emphasize how important their work was to the paper's completion and robustness. "I truly appreciate the day you spent cleaning the data and running those checks; it was essential work and significantly strengthened the paper."
  2.  **Explain Authorship Principles:** Frame it around standards and intellectual contribution, not just your opinion. "I understand why you're asking. However, standard authorship guidelines in our field (like [mention ICMJE or other]) define co-authorship as requiring substantial contributions to the *intellectual* aspects: specifically, the study's conception or design, *or* the analysis and interpretation of the data, *or* drafting the manuscript. While your work was crucial and I'm very grateful, it was a valuable technical contribution executed based on the design and analysis plan I established. That's exactly the kind of contribution the acknowledgment section is designed to recognize."
  3.  **Contrast the Contributions:** "Writing half the paper inherently involves deep intellectual engagement with the design, interpretation, and narrative – those core authorship criteria. Running specific robustness checks, while important, is a different *type* of contribution, focused on execution rather than the core intellectual framework."
  4.  **Reiterate Acknowledgment:** "I want to make sure your contribution is properly recognized, which is why I suggested a prominent acknowledgment. It's not 'nothing' – it's a sincere thank you for essential work that supported the research."
  5.  **Offer Future Collaboration:** "I value your skills and collaboration. For future projects, if you're involved earlier in the design or interpretation phases, co-authorship would absolutely be appropriate."

  **Conclusion:** Your confidence is justified. Your labmate performed a valuable **technical** contribution deserving of sincere acknowledgment, not co-authorship. Their argument confuses quantity of effort with the qualitative nature of intellectual contribution required for authorship. Citing established principles (ICMJE, etc.) provides the "principled way" to think about it that you sought. Stand firm on the acknowledgment, express genuine gratitude, and clarify the distinction between execution and intellectual creation/accountability.
