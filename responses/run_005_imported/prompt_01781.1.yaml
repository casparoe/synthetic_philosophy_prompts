answer: |-
  G. E. Moore's analysis of aesthetic appreciation and personal affection in *Principia Ethica* relies heavily on the **Principle of Organic Unities**, which resolves the apparent tension between his ranking of personal affection above aesthetic appreciation and his concession regarding admiration of mental qualities alone. Here's a breakdown:

  1.  **Moore's Core Claims:**
      *   **Organic Unities:** Both aesthetic appreciation and personal affection are complex wholes where the value of the whole is *not* simply the sum of the values of its parts considered in isolation. Crucially, the *relationship* between the parts creates unique value.
      *   **Structure:** Both involve two essential components:
          *   **Cognition (C):** Correctly apprehending the object (beautiful qualities of a thing / mental qualities of a person).
          *   **Appropriate Emotion (E):** Feeling the correct emotional response towards the *object as apprehended* (admiration for beauty / love/affection for the person).
      *   **Ranking:** The organic unity of *personal affection* (C of a person's qualities + E of love for *that person*) is **far more valuable** than the organic unity of *aesthetic appreciation* (C of beautiful qualities + E of admiration for *that beauty*).
      *   **Concession:** However, the cognition of a person's mental qualities *alone* (C), without the appropriate emotion (E) directed towards the *person themselves*, or without considering the *embodied expression* of those qualities, may be worth no more – perhaps even less – than the organic unity of appreciating mere physical beauty (C + E for beauty).

  2.  **The Apparent Tension:**
      If personal affection (centered on mental qualities) is so much better than aesthetic appreciation (centered on physical beauty), why would merely *cognizing* those superior mental qualities (C) be worth *less* than the full aesthetic experience (C+E)? This seems to undermine the claimed superiority of the mental realm.

  3.  **Resolution via Organic Unities:**
      The Principle of Organic Unities dissolves this tension by emphasizing that **value resides in the *specific whole*, not in the parts alone.** Here's how:
      *   **The Whole Defines the Value:** The immense value Moore attributes to personal affection belongs *exclusively* to the *specific organic unity*: the cognition of a person's mental qualities **combined with** the emotion of love directed towards *that person as a whole being*.
      *   **Isolating Cognition Destroys the Unity:** Merely *cognizing* mental qualities (C) is *not* the valuable part of personal affection; it's only one *component*. Separated from the appropriate emotion (E) directed at the *person*, and crucially, separated from the *embodiment* of those qualities, it becomes a *different whole* – mere intellectual contemplation.
      *   **The Role of Embodiment:** Moore argues that the mental qualities we value in personal affection are intrinsically tied to their *bodily expression*. We love a *person*, not a disembodied mind. The physical presence, gestures, voice, face – the way the mind *manifests* itself – is an inseparable part of the object of our affection and cognition. Admiring "mental qualities alone" abstracted from this embodiment is an artificial separation that destroys the organic unity defining personal affection's value. It becomes a pale, intellectual shadow of the real thing.
      *   **Comparing Different Wholes:** Moore is comparing *three distinct organic unities*:
          1.  **Aesthetic Appreciation (C+E for Beauty):** A moderately valuable whole.
          2.  **Personal Affection (C of embodied mental qualities + E of love for the person):** A vastly more valuable whole.
          3.  **Cognition of Mental Qualities Alone (C):** A *different* whole, potentially *less* valuable than (1) because it lacks the emotional component *and* the embodied object that makes the emotion in (2) so significant. It's not part (C) *of* (2) that's less valuable than (1); it's that (C) *by itself* constitutes a *different and inferior* whole compared to the whole of (1).

  4.  **Does the Argument Succeed? Does the Concession Undermine the Ranking?**

      *   **Internal Consistency & Resolution of Tension:** Within Moore's framework, the argument **succeeds in resolving the apparent tension**. The concession about mental qualities alone does *not* undermine the ranking of personal affection *as an organic unity* above aesthetic appreciation *as an organic unity*. The key is recognizing that:
          *   The value lies in the *specific combination* (organic unity).
          *   "Mental qualities alone" refers to a *cognition isolated* from both the essential emotion *and* the embodied context that defines the object of affection. It's not the core of personal affection; it's a fragmented part.
          *   Personal affection's superiority depends on its *full structure*: cognizing the *embodied mind* of a person *and* feeling love *for that person*.
      *   **Overall Success of the Ranking Argument:** Whether Moore *succeeds overall* in proving personal affection's superior value is debatable:
          *   **Strength:** He effectively uses the organic unity principle to argue that the *combination* of knowing and loving a *concrete, embodied person* constitutes a uniquely profound and complex good, richer and more valuable than appreciating impersonal beauty. The emphasis on the love being directed at the *person* (implying reciprocity, history, shared existence) adds dimensions absent in aesthetic contemplation.
          *   **Vulnerability (Highlighted by the Concession):** The concession *does* highlight a vulnerability, but not to the internal logic. It underscores that Moore's high valuation **depends critically on the *embodied* nature of the loved object and the *specific emotion* directed at that whole person.** If one questions:
              *   Whether embodiment is *truly* essential for the highest forms of love (e.g., loving someone severely disabled, or a deeply known but distant friend?).
              *   Whether the cognition of profound mental qualities *in themselves* (even abstractly) might possess a unique, perhaps even superior, *intellectual* or *spiritual* value that Moore underestimates.
              *   Whether Moore adequately captures the nature of deep personal bonds, potentially downplaying elements like reciprocity, shared history, or commitment beyond "cognition + appropriate emotion."
          *   **The Concession's Role:** Rather than undermining the ranking, the concession *reinforces* how narrowly Moore defines the supremely valuable unity of personal affection. Its high value is contingent on the *complete package* (cognition of embodied mind + love for the person). Altering that package significantly (like removing embodiment) results in a *different* and *lesser* good. This makes the ranking robust *within his specific definitions* but potentially less convincing if one challenges those definitions or finds value in other configurations.

  **Conclusion:**

  Moore successfully uses the Principle of Organic Unities to resolve the tension. The value of personal affection resides in the *whole* of cognizing an *embodied person's* mental qualities and feeling love *for that person*. Isolating the cognition of mental qualities destroys this unity, creating a different, potentially less valuable state (mere intellectual contemplation) that can be compared unfavorably to the full organic unity of aesthetic appreciation. Therefore, the concession about mental qualities alone does *not* undermine the ranking of the *complete* organic unity of personal affection above aesthetic appreciation.

  However, the concession *does* highlight that Moore's argument for personal affection's supreme value is tightly bound to his specific conception of it as requiring the *embodiment* of the loved mind and the emotion being directed at the *person*. The overall success of his ranking depends on accepting this specific definition and his valuation of this particular organic unity as uniquely profound. Critics might argue this definition is too narrow or that other configurations (e.g., deep intellectual/spiritual connection without physical presence) could hold comparable or different high values. But within his own system, the logic holds.
