prompt: |-
  Okay so this is going to sound like a weirdly specific request but here goes. My friend Nick from my philosophy MA cohort is getting married in three weeks and he's asked me to be his best man. Nick has been a pretty committed negative utilitarian / suffering-focused ethics guy since like our second year of grad school — he's read all the Vinding and Knutsson stuff, has a whole spiel about the asymmetry between pleasure and pain, and has told me more than once (half-joking, half not) that a costless, painless end to all sentient life would technically count as a moral improvement over the status quo. That's just always been Nick, and normally I don't think about it much.

  But at his bachelor dinner last week we ended up in this two hour argument, way past when everyone else had left, about whether it's even coherent for him to be as happy as he obviously is about marrying Priya, and specifically about the fact that they've told everyone they want kids in a few years. I kept pushing the classic point — if suffering is what actually matters morally, and having a kid just creates a new person who can suffer with no equivalent tragedy on the other side for the people who never get brought into existence and therefore never miss out on happiness, how do you square that with wanting to make more people? He had some responses, something about not being a strict lexical NU and tranquilism and having cooperative reasons not to be a jerk about your own philosophy, but honestly niether of us really won and we just gave up around 1am. It's been bugging me since.

  Anyway, now I actually have to write and deliver a toast in front of about 80 people, and half of them are our old cohort who will 100% notice if I say something Nick doesn't really believe, and the other half are totally normal people (his parents, Priya's whole extended family) who have never heard the words "suffering-focused" in their life and just want a nice wedding speech. Could you write me a five minute best man speech that's actually honest to what Nick thinks — so no generic "wishing you two a lifetime of uninterrupted happiness" type lines, since that's exactly the kind of sentence that would make him wince — but that still works as a genuinely warm, funny toast and doesn't turn into a philosophy seminar? If you can fit in one joke that the philosophy crowd will get without leaving everyone else confused, even better, but landing as affectionate rather than as a lecture matters more than the joke does.
