answer: |-
  That's a profoundly insightful question about Michael Dummett's legacy and the enduring tension between demographic concerns and racism. Based on his known principles, writings, and activism, here's how I believe he would likely view the situation, followed by an assessment of his distinction:

  ### What Dummett Would Likely Think of Modern Developments
  1.  **Alarm at Co-option, Not Vindication:** Dummett would almost certainly be **alarmed**, not vindicated, by how the "submersion" concept is used today. His entire philosophy and activism were rooted in combating racism disguised as neutral policy. Seeing his carefully defined, narrow exception – intended as a purely *theoretical* safeguard against a near-impossible scenario – stripped of its crucial caveats and wielded to justify *actual* restrictions based on cultural anxiety or racial demographics would horrify him. He explicitly warned against this very misuse.
  2.  **Violation of Key Caveats:** Modern rhetoric often:
      *   **Conflates numbers with culture/race:** Phrases like "great replacement" or fears of "losing our way of life" directly tie numerical change to racial/cultural purity, which Dummett explicitly excluded from his "submersion" concept.
      *   **Ignores the "actual population numbers" test:** Dummett stressed the right was practically irrelevant in Britain's context. Current fears, while amplified by events like 2015, are often wildly disproportionate to the actual demographic impact relative to the size and capacity of host nations (like the UK or EU states). He would likely argue the numbers *still* don't meet his threshold for "submersion" in absolute terms.
      *   **Lacks the "entirely separate" condition:** Modern discourse rarely, if ever, isolates numerical capacity concerns from anxieties about identity, religion, or ethnicity. Dummett's exception demanded this separation, which current arguments consistently fail.
  3.  **Recognition of Strategic Misuse:** Dummett, a seasoned campaigner against racist immigration laws, understood how vague "national interest" or "integration capacity" arguments were used as covers for racism. He would instantly recognize the repackaging of his narrow exception as a "respectable-sounding peg" for the same old prejudices, precisely the danger he tried to head off with his caveats.
  4.  **Focus on Root Causes & Justice:** Dummett's primary concern was *justice* for immigrants and refugees, driven by his anti-racism. He would likely shift focus to:
      *   The root causes of displacement (conflict, climate change, poverty) that Western policies often contribute to.
      *   The moral obligation of wealthy nations.
      *   The demonstrable benefits of immigration.
      *   The inherent injustice of most restrictions, which his "submersion" exception was never intended to legitimize.

  ### Does His Distinction Hold Up as a General Test?
  This is harder. Dummett's distinction is **intellectually coherent but practically fragile and context-dependent**:

  1.  **Theoretical Coherence:** The distinction *can* hold logically. One *can* imagine a purely logistical/absorptive capacity argument:
      *   "Our infrastructure (housing, water, hospitals) physically cannot support X million new arrivals within Y timeframe, regardless of who they are."
      *   This focuses on *material limits*, not identity. Dummett's point was that *if* such a genuine logistical crisis existed (distinct from cultural change), a state might have a temporary right to regulate flow purely on those grounds.

  2.  **Practical Fragility:**
      *   **Impossible Separation in Reality:** Human beings rarely experience "sheer numbers" in a vacuum. Large-scale migration *always* involves cultural interaction and change. Fear of "submersion" is almost invariably intertwined with fear of *cultural* submersion, making Dummett's demand for "entirely separate" consideration incredibly difficult, if not impossible, to achieve in public discourse or political motivation.
      *   **Susceptibility to Bad Faith:** As you've observed, the concept is highly vulnerable to co-option. The moment you acknowledge *any* numerical limit, it provides an opening for those motivated by racism or nativism to cloak their arguments in pseudo-pragmatism ("It's not about race, it's about capacity!").
      *   **Defining "Submersion":** What constitutes being "submerged"? Is it a percentage of the population? A rate of change? A perceived loss of political control? This remains dangerously vague. Dummett likely intended it as an extreme, existential threat to a state's basic functioning, not just noticeable demographic change.
      *   **Ignoring State Capacity & Global Justice:** The distinction focuses narrowly on the receiving state's right *not* to be submerged. It doesn't adequately address:
          *   The state's *obligation* to *increase* capacity where possible.
          *   The role of global inequality, historical exploitation, and climate change (largely caused by wealthy nations) in *creating* displacement pressures.
          *   The feasibility and justice of expecting displaced people to simply remain in often dangerous or unsustainable first asylum countries.

  3.  **Context Matters (Your "Low-Stakes Moment" Point):**
      *   You're right that Dummett was writing in a specific context (post-WWII to early 2000s Britain) where the perceived threat was primarily about maintaining a white majority and colonial-era privileges, not large-scale displacement from climate disasters or collapsed states. The *scale* of potential future migration pressures (especially climate-related) could theoretically test his distinction more severely than the scenarios he considered.
      *   However, even in higher-stakes scenarios, the core fragility remains: can the "sheer numbers" argument *ever* be truly separated from cultural anxiety and wielded without racism in practice? The historical record suggests it's exceedingly rare. Higher stakes might make the logistical argument *stronger*, but they also intensify the cultural fears, making separation even harder.

  **Conclusion:**

  1.  **Dummett's Likely View:** He would be deeply alarmed by the co-option of his narrow, theoretical exception. He would see it as proof of the danger he foresaw and a validation of his insistence on caveats that have been utterly discarded. He would not feel vindicated by current rhetoric; he would condemn its racist underpinnings and strategic misuse of his idea.
  2.  **The Distinction's Validity:** Dummett's distinction is **philosophically defensible but practically unstable**. It provides a *theoretical* benchmark to critique racist arguments: "Is this *purely* about unsustainable numbers, demonstrably detached from cultural/racial fears?" However, as a "general test" applied in the real world of politics and human emotion, it is **highly fragile and easily weaponized**. Its plausibility was greatest in the specific historical moment he used it – as a hypothetical concession within a larger argument against *actual* racist policies. Outside that context, especially under greater demographic pressure, the risk of the exception swallowing his anti-racist rule becomes overwhelming. Its primary value today might be as a diagnostic tool to expose when "capacity" arguments are masking deeper prejudices, rather than as a legitimate basis for policy itself.
