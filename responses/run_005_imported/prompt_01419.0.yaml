  Right, let's reconstruct Dummett's position carefully. His anti-racism credentials are unimpeachable—decades of grassroots work. So when this man carves out one narrow exception ("submersion"), we must treat it seriously. But crucially: he framed it as (a) purely numerical, (b) detached from culture/race, and (c) practically irrelevant to 2001 Britain. That last bit feels key—he was building a philosophical firewall, not endorsing real policies.

