answer: |-
  You've pinpointed the core tension: Lewis's "fixes" (NP & Thau-admissibility) *formally* avoid contradiction but functionally eviscerate chance's guiding role for non-omniscient agents. The skeptical case is that the bug isn't squashed, but relocated from formal inconsistency to practical/epistemic uselessness. Let's build the strongest case, addressing the Humean rejoinder head-on.

  **The Core Skeptical Argument: Relocation, Not Resolution**

  1.  **The Formal "Fix":** NP replaces PP with:
      `Cr(A | H_t ∧ T_w) = Ch_t(A)`
      Where `T_w` is the *complete* chance theory true at world `w` (i.e., the entire Best System for `w`). Thau achieves a similar effect by restricting PP's admissibility: only information compatible with `T_w` itself (or entailed by `H_t`) is admissible when conditionalizing on `Ch_t(A) = x`.
  2.  **Avoiding Formal Contradiction:** This works. The undermining future `F` is *incompatible* with `T_w` (if `F` occurs, `T_w` isn't the true Best System). Therefore, `F` is *ruled out* by conditioning on `T_w` (NP) or by making information about `F` inadmissible (Thau). The contradiction vanishes because the agent isn't asked to set `Cr(F | H_t ∧ Ch_t(F) = x) = x` while knowing `F` would falsify `Ch_t(F) = x`. NP/Thau ensure the agent only applies the chance value under the supposition of the *correct* `T_w`.
  3.  **The Functional Problem - The Relocated Bug:** The cost is that applying NP/Thau-PP requires knowing, or being able to conditionalize on, `T_w` *itself* (or knowing precisely what information is admissible in the Thau sense, which amounts to the same thing).
      *   **`T_w` is Global and Epistemically Inaccessible:** `T_w` supervenes on the *entire* Humean mosaic – past, present, *and future*. Knowing `T_w` requires knowing the complete global pattern that makes it the Best System. An agent at `t` simply *cannot* know `T_w`. They only know `H_t` (the history up to `t`).
      *   **Chance's Guiding Role is Lost:** The *point* of the Principal Principle was to explain how knowledge of *chance* (`Ch_t(A)=x`), combined with knowledge of the *past* (`H_t`), constrains rational credence (`Cr(A)`) for agents who are *ignorant of the future*. NP/Thau-PP require knowledge of the *future-dependent global pattern* (`T_w`) to apply the chance value. But if an agent *knew* `T_w`, they wouldn't *need* chances! `T_w` (being part of the complete truth about `w`) entails *all* future truths. Chance becomes epistemically redundant for any agent capable of using NP/Thau-PP correctly.
  4.  **The Skeptical Conclusion:** NP/Thau "solve" the formal contradiction only by making chance guidance *operational* solely for agents who already possess the very omniscience about the global pattern that chance was supposed to *compensate* for. For the non-omniscient agents chance was meant to guide, NP/Thau-PP are practically inapplicable. The "big bad bug" of undermining is thus relocated from generating a formal contradiction to rendering chance epistemically inert for its intended users. Chance might metaphysically supervene on the mosaic (saving HS), but it fails to play its defining epistemic role.

  **Addressing the Humean Rejoinder: "Admissibility is Only Past/Present!"**

  The natural Humean rejoinder is: *"Admissibility (Thau-style) is defined solely by what is fixed at or before t! `T_w` isn't known, but we can characterize admissible information purely temporally: any proposition entirely about history up to t is admissible. Undermining futures are about the future, so information about them is inadmissible. Agents only use `H_t` and `Ch_t(A)=x`, applying PP with the understanding that only past-tensed info is admissible. No future knowledge needed!"*

  **Why This Rejoinder Fails:**

  1.  **The Hole in "Entirely About History Up To t":** The rejoinder relies on a clear distinction between "past" and "future" propositions. However, propositions about the *chances themselves* (`Ch_t(A)=x`) are *not* "entirely about history up to t" on Humeanism. This is crucial.
      *   On Humeanism, `Ch_t(A)=x` is made true by the global Best System, which depends on the *entire* mosaic, including the future. `Ch_t(A)=x` is a *global, future-dependent fact*.
      *   Therefore, `Ch_t(A)=x` *logically implies* facts about the global pattern, *including constraints on the future*. Specifically, it implies that the future is *not* an undermining future relative to `Ch_t(A)=x` and `H_t`. If the future *were* undermining, `Ch_t(A)=x` would be false.
  2.  **Admissibility Collapses into `T_w`-Knowledge:** The Thau-admissibility condition states that information `E` is admissible (for use with `Ch_t(A)=x`) only if `E` is compatible with `T_w` or entailed by `H_t`. But `Ch_t(A)=x` *itself* is only true if the future conforms to the expectations of `T_w`. Therefore:
      *   Knowing `Ch_t(A)=x` *already rules out undermining futures*.
      *   For `E` to be admissible *given* `Ch_t(A)=x`, `E` must *also* be compatible with the non-undermining future implied by `Ch_t(A)=x`. Effectively, admissible `E` must be compatible with `T_w`.
  3.  **The Agent's Epistemic Predicament:** The agent at `t` knows `H_t` and believes `Ch_t(A)=x`. They contemplate some additional evidence `E` (e.g., a seemingly random fluctuation they observed at `t-1`). Is `E` admissible?
      *   **Problem 1:** `E` might *be* (or strongly suggest) the *start* of an undermining future, even if `E` is entirely about the past up to `t`. How can the agent tell if `E` is just noise or the seed of an undermining sequence? They cannot, without knowing the global pattern `T_w`.
      *   **Problem 2:** The *only* way to guarantee `E` is admissible (compatible with `T_w`) is to know `T_w`. Without knowing `T_w`, the agent *cannot reliably determine* if some `E` (even if entirely about the past) is admissible relative to `Ch_t(A)=x`. `Ch_t(A)=x` doesn't provide enough information about `T_w`'s details to screen off potential conflicts hidden in `E`.
  4.  **The Illusion of Guidance:** The rejoinder suggests the agent can blithely apply `Cr(A) = x` based on `H_t` and `Ch_t(A)=x`, ignoring future possibilities. But the specter of undermining means the agent *must* worry whether `H_t` *plus* `Ch_t(A)=x` *plus their new evidence `E`* are *jointly compatible* with a non-undermining future – i.e., with `T_w`. If `E` makes an undermining future significantly more likely (even if `E` itself is past-tensed), conditioning on `Ch_t(A)=x` *without* conditionalizing on `T_w` (or knowing admissibility) could lead the agent astray. The agent lacks the resources (`T_w`) to know if they are going astray.
  5.  **Functional Failure Redux:** To use PP/Thau safely and correctly, the agent needs to know which propositions are admissible. Determining admissibility requires knowing which propositions are compatible with `T_w`. Knowing that requires knowing `T_w`. Knowing `T_w` requires (near) omniscience. Therefore, the only agents who can correctly apply the reformed principle are those who don't need chances to guide their credences about the future. For the limited agents chance is *for*, the reformed principle offers no usable guidance. They are left with `H_t` and `Ch_t(A)=x`, knowing the latter depends on the future in a way they cannot fathom, unable to reliably incorporate new evidence without risking incoherence, and unable to apply NP because they lack `T_w`.

  **Conclusion: The Bug's New Habitat**

  Lewis and Thau successfully quarantine the formal contradiction. However, they do so by making chance's epistemic role parasitic on knowledge of the very global, future-dependent pattern (`T_w`) that Humean chance was supposed to summarize *for the benefit of the ignorant*. The requirement to conditionalize on `T_w` (NP) or to possess `T_w`-relative admissibility knowledge (Thau-PP) renders chance useless for guiding the credences of agents who lack comprehensive knowledge of the world's total history. The "big bad bug" of undermining is thus not eliminated; it metastasizes from a threat to formal consistency into a fundamental obstruction to chance fulfilling its core function within a Humean framework. The necessitarian advantage remains: only by making chance a primitive, local, non-supervenient feature of reality (or time) can it genuinely and robustly guide the credences of non-omniscient agents without requiring them to tacitly know the entire future. The Humean saves their metaphysics at the cost of chance's utility.
