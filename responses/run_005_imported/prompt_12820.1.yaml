answer: |-
  That's a deeply insightful observation about a genuine problem in science, and your unease is completely justified. What you're describing is a classic case of **outcome bias** amplified by the **replication crisis** context in social psychology. There isn't a strong *principled* reason to judge her more harshly than you for the *initial decision itself*, given the identical circumstances and reasoning. The difference in judgment stems almost entirely from the *outcome* and the field's heightened sensitivity to false positives.

  Here's a breakdown of why this unfairness happens:

  1.  **Outcome Bias:** This is the core cognitive bias at play. People judge the *quality of a decision* based on its *outcome* rather than the information available *at the time the decision was made*. You both made the same risky call with the same information and motivation (confidence in the effect, conference deadline pressure). The fact that yours turned out to be real and hers didn't retrospectively colors people's assessment of the *decision itself*. Your good outcome makes your decision seem "smart" or "justified by intuition"; her bad outcome makes the *identical* decision seem "reckless" or "sloppy."

  2.  **Fundamental Attribution Error:** When something goes wrong, people tend to attribute it to the person's character or competence ("she's careless," "she must have p-hacked") rather than situational factors or plain bad luck. When something goes right, they are more likely to attribute it to skill or the inherent quality of the work ("he's rigorous," "it was a solid finding"). This error ignores the crucial role of random variation and the fact you both operated under identical pressures and constraints initially.

  3.  **The Replication Crisis Context:** Social psychology is hyper-aware of false positives, p-hacking, and questionable research practices. A failed replication *automatically* triggers suspicion of underlying methodological flaws or misconduct *in the original work*, regardless of the original author's intent or process. Your successful replication (even if done later by others) shields you from this scrutiny. Her failed replication acts as a red flag, inviting people to look back and reinterpret her *initial* actions through a lens of suspicion ("Ah, *that's* why she didn't replicate first!"), even if that suspicion is unwarranted based solely on the initial decision.

  4.  **Hindsight Bias:** Knowing her effect wasn't real makes it seem *obvious* in hindsight that she *should* have replicated first. It makes the original finding look weaker or more dubious *in retrospect*. People struggle to mentally reconstruct the genuine uncertainty and confidence you both felt at the time.

  5.  **Confirmation of Preexisting Beliefs:** Once the replication failed, people seeking to explain it (especially those skeptical generally) find it easy to latch onto the lack of an initial replication sample as "evidence" supporting their suspicion of poor practice. Your success doesn't challenge their beliefs, so the same lack doesn't trigger the same scrutiny.

  **Why Your Guilt Makes Sense (But Isn't Necessary):**

  *   **Survivor's Guilt:** You recognize the randomness of the outcome and feel uneasy benefiting from luck while your friend suffers consequences from the same gamble.
  *   **Acknowledging the Risk:** Your guilt reflects a healthy understanding that your decision *was* risky, even if it paid off. You understand you "got away" with taking a shortcut that could have easily blown up, just as it did for your friend. This shows good scientific conscience.
  *   **Recognizing the Unfairness:** You see the inherent unfairness in how the same action is judged solely based on an outcome neither of you could control at the time of the decision.

  **Is There *Any* Principled Nuance? (Not much, but...)**

  *   **Post-Hoc Justification:** If *after* her failed replication, she doubled down without evidence or resisted the new findings, that *would* be a separate reason for criticism. But you're describing judgment based on the *initial* paper and its failure to replicate.
  *   **Pattern vs. Isolated Incident:** If she had a *history* of findings failing to replicate or questionable practices, that would justify skepticism. But judging her harshly for *this one* incident based on the outcome, while giving you a pass, is unfair.

  **What Can You Do?**

  1.  **Acknowledge the Luck (to yourself & perhaps trusted colleagues):** Recognize and articulate (at least to yourself) that your success involved a significant element of luck given the risky decision you both made. This counters the internalized "I'm just better" narrative.
  2.  **Advocate for Process (when appropriate):** In discussions about methodology or replication, subtly emphasize the importance of evaluating *decisions based on the information available at the time* and the dangers of outcome bias. You don't need to bring up your specific case, but promoting this principle helps shift the culture.
  3.  **Support Your Friend (if possible/appropriate):** If you have a good relationship, acknowledging the unfairness privately to her ("It sucks how differently people are treating that decision; we both made the same call based on the same reasons") can mean a lot. Be a supportive colleague without necessarily taking public stands that could backfire on either of you.
  4.  **Model Better Practices:** Let your experience reinforce the importance of pre-registration, replication (even if it slows things down), and transparency in *your own future work*. Use your "solid" reputation to champion rigor.

  **In Conclusion:** You are absolutely not overthinking this. The judgment your friend faces *is* largely unfair and driven by outcome bias, fundamental attribution error, and the specific anxieties of the replication crisis era. Your identical decision is viewed entirely differently because of a random outcome you couldn't control. Your guilt reflects an awareness of this randomness and the inherent risk you both took. While your success wasn't "tainted," it was fortunate. Recognizing this unfairness is a sign of your own methodological integrity and empathy.
