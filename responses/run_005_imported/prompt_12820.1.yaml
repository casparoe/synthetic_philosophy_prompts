  First, I need to address the core question: Is there a principled reason for the different treatment, or is it just outcome bias? The user mentions they both had identical reasons and actions. So, the outcome shouldn't justify harsher criticism. But I know that in academia, results often overshadow methods. People judge based on what happened, not just the decision process. That's outcome bias in action.

  Next, considering the field's context. Social psychology has had replication crises. Trust is fragile. When a study fails replication, it's easy to assume malpractice. The friend's failed result triggers skepticism, even without evidence of p-hacking. Meanwhile, the user's success lends credibility, masking the same methodological shortcut. This ties into fundamental attribution error—blaming the person rather than situational factors.

  The user's guilt is interesting. They feel they "got away" with something. That suggests they recognize the inherent risk in their decision. Both took a gamble; one won, the other lost. The guilt might stem from survivor's guilt or realizing that their success was partly luck. Acknowledging luck's role is important here. It wasn't superior judgment that saved them, but chance.

  I should also consider the friend's perspective. She's facing reputational damage, which affects her career. The user might want to support her, but how? Maybe by advocating for process-based evaluations or discussing the role of luck in research. But the user might hesitate to speak up to avoid association. That's a tough spot.

  Underlying needs: The user probably seeks validation that the disparity in judgment is unfair. They might also want ways to cope with guilt or help their friend without jeopardizing their own standing. There's a need for reassurance that their success isn't tainted and guidance on navigating the ethical dilemma.

  The user’s deeper concern could be about the fairness of academic evaluation and the randomness of success. They might be questioning the integrity of their own work, despite the positive outcome. Addressing the role of luck in science and systemic pressures (like conference deadlines) could help alleviate guilt.

