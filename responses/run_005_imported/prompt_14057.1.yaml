  For my IB Extended Essay, which looks at evolutionary signaling theory from a philosophy-of-biology angle, I want to move past the pop-science version of Zahavi's handicap principle ("a costly trait is honest because only high-quality individuals can afford it") and apply the stricter version Grafen formalized in 1990: a signal can only remain evolutionarily stable as an honest indicator if the marginal cost of producing a given signal level falls as the sender's quality rises, not simply because the signal looks expensive in absolute terms. I've also run into the related three-way distinction between genuine handicaps, cost-free "indices" that cannot be faked for purely physical reasons, and "conventional" signals whose honesty is enforced by social sanction rather than by differential cost.

