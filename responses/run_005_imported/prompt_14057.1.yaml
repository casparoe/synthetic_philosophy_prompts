  1. **Peacock tail length**: This is the classic example of the handicap principle. The cost of growing and maintaining a long tail is higher for low-quality males because it requires more resources and makes them more vulnerable. High-quality males can bear this cost more easily. Thus, the marginal cost of a longer tail is lower for high-quality males. **S tier.**

  2. **Stotting in Thomson's gazelles**: Stotting (jumping high in the air) is a signal to predators that the gazelle is fit and hard to catch. The cost of stotting (energy and time) is higher for a weak gazelle because it reduces their chance of escape. A high-quality gazelle can afford to stot because they have energy reserves and speed. The marginal cost of stotting (for a given level of stotting) is lower for high-quality gazelles. **S tier.**

  3. **Allofeeding/helping behavior in Arabian babblers**: In cooperative breeding, helpers feed others' offspring. The cost of helping (giving up food and energy) is higher for low-quality individuals because they have less surplus. High-quality individuals can afford to help more. This fits the differential cost condition. **S tier.**

  4. **Roaring contests among red deer stags**: Roaring is a signal of size and strength. The cost of roaring (energy expenditure) is lower for larger, stronger stags because they have more energy reserves and better respiratory capacity. Thus, the marginal cost of roaring at a given level is lower for high-quality stags. **S tier.**

