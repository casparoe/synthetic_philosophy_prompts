prompt: |-
  I cover cognitive science for a living, and I've got a podcast interview next week with a researcher who's built her whole career defending Friston's free energy principle -- she genuinely thinks it's not just a theory of the brain but a theory of life itself. I dont want to just let her repeat the "brain as prediction machine" elevator pitch, so can you draft me seven or eight interview questions that actually push on the hard parts? I need at least one on the dark room problem (if minimizing prediction error is the whole game, why isn't every organism just holed up somewhere dark and unchanging, and whether "epistemic value" in expected free energy is a genuine fix for that or just a term invented to patch the hole), one on the recurring charge that the whole framework is unfalsifiable -- that it can retrodict literally any behavior after the fact so it never actually rules anything out, and one on scope: is this really a claim about brains, or about any self-organizing system with a Markov blanket (a cell, a hurricane, a thermostat), and if it's the latter, why that shouldn't make us suspicious it's explaining too much to explain anything. For each of those three, give me a sharp follow-up keyed to whatever answer she's most likely to give first.
