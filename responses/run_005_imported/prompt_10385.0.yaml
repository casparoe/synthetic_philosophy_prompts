prompt: |-
  Okay, weird research hole I've fallen into and I'm hoping you can pull me back out of it. I'm about a third of the way into a new novel where my main character slips into a parallel Earth thats a physical duplicate of ours except for one detail: the clear drinkable stuff everyone there calls "water" isn't H2O, it's some other compound that looks, tastes, and behaves exactly the same in every way anyone on either planet could ever notice. My writing group's resident ex-philosophy-major informed me, slightly smugly, that I had basically just reinvented Hilary Putnam's old "Twin Earth" thought experiment, and sent me down a rabbit hole of secondary reading. Which is how I found out there's a second, less famous thought experiment in the same neighborhood by a guy named Tyler Burge, involving a patient who sincerely tells his doctor he has "arthritis" in his thigh (which is medically impossible, since arthritis is specifically a joint condition) — and apparently philosophers treat this as making a related but importantly different point than Putnam's water case, even though both get filed under "semantic externalism," the idea that meaning and thought-content aren't just facts about what's going on inside your skull.

  Could you actually spell out for me what the real difference between these two is supposed to be? My rough understanding, which might be wrong, is that Putnam's case only works because water is a natural kind with a hidden physical essence (H2O vs. whatever XYZ is), so it's really an argument about chemistry doing referential work behind our backs, whereas Burge's arthritis case is supposed to go through even though nothing physical or chemical is different between his two scenarios — only the linguistic community's conventions about how to use the word differ. If that's the actual shape of the disagreement: which of the two strikes you as the more radical challenge to the idea that meaning is "all in the head," and is it possible to accept Putnam's conclusion about natural-kind terms while still resisting Burge's broader claim about social convention, or does accepting one basically commit you to the other? Don't just tell me "they're both externalism" — I already know that much and it doesnt help me figure out whether the twist in my book (pun very much intended) is actually the tame version of this idea, and whether there's a weirder, more Burge-flavored plot sitting right there that I'm leaving on the table.
