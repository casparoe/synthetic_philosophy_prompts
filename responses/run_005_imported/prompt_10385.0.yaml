  First, I need to recall the core ideas. Putnam's Twin Earth argues that the meaning of "water" depends on the physical substance (H2O vs. XYZ), even if indistinguishable. Burge's arthritis case shows that a person can misuse "arthritis" based on their community's linguistic norms. Both support externalism but differ in the source of meaning: physical reality vs. social conventions.

