answer: |-
  Here are eight interview questions designed to engage the structural core of her position, incorporating your specific requests and anticipating common defenses. Each includes a follow-up keyed to likely replies:

  1.  **Core Consistency Challenge (Policy vs. Rescue):** "Your position rejects interpersonal aggregation in isolated rescue cases like Taurek’s five-vs-one. Yet, in policy contexts – say, evaluating two public health measures where one predictably causes significantly more deaths than the other – most people (and arguably, many ethical frameworks *including* non-aggregative ones) readily judge the policy causing fewer deaths as *better*, even absent special duties to the individuals involved. How does your view account for this apparent difference in judgment without implicitly relying on a form of aggregation, or is the judgment in the policy case mistaken?"
      *   *Likely Reply:* Argue that policy contexts involve institutional roles, distributive justice over time, or different kinds of "harms" that *are* aggregable (e.g., social stability, resource drain) unlike the pure loss of life in rescue cases.
      *   **Follow-up:** "If institutional roles or secondary effects *are* doing the justificatory work in policy, doesn't that suggest that in the pure rescue case – where those factors are stripped away – the numbers *don't* intrinsically matter? And if so, how does your view avoid the implication that, absent those secondary factors, a policy knowingly choosing the option causing more deaths could be morally permissible?"

  2.  **The Scope of the Non-Aggregation Claim:** "Taurek famously argued against the 'additive' nature of loss. Your work updates this defense. Could you clarify the *scope* of your rejection of aggregation? Does it apply only to the *direct comparison of final states* (e.g., {5 dead} vs {1 dead}), or does it also extend to rejecting the summing of *harms experienced* by individuals in the process leading to the outcome? For instance, does your view preclude saying that a single act causing excruciating pain to five people is *worse* than the same act causing that pain to only one, even if all survive?"
      *   *Likely Reply:* Double down on the non-comparability of distinct individuals' experiences/harms for direct state comparison; might distinguish "process harms" as potentially aggregable *if* they relate to a single act/agent's imposition.
      *   **Follow-up:** "If we *can* aggregate process harms (like intense pain) across individuals for a single act, why does the aggregation suddenly become impossible when the harm is death? Isn't death the ultimate harm, and if aggregation fails there, doesn't that cast doubt on its validity for lesser harms too?"

  3.  **Kamm's Weighted Lottery Challenge:** "Frances Kamm proposed a 'weighted lottery' as a compromise: giving each person an equal chance proportional to the numbers (e.g., 5/6 chance to save the group of five, 1/6 to save the one). This seems to respect the separateness of persons (no direct summing of welfare), gives everyone *some* chance, yet is sensitive to the numbers. Why do you reject this as a solution and insist on a flat 50/50 chance (or no chance mechanism at all), even when the numbers are very unequal?"
      *   *Likely Reply:* Argue that weighting the lottery *by numbers* implicitly assumes the greater loss *is* worse, violating the core non-aggregation principle. A 50/50 chance treats each *group* as a single claimant with equal moral standing, or treats each *individual* as having an equal claim on *my* saving action.
      *   **Follow-up:** "But doesn't the 50/50 chance between groups *itself* make an implicit claim? By treating the group of five as a single unit with the same moral weight as the single individual, aren't you effectively denying the moral significance of the *four extra individuals* within the larger group? How is *that* consistent with respecting the separateness of persons?"

  4.  **Scanlon's Contractualist Tie-Breaker:** "T.M. Scanlon, while critical of simple aggregation, argued in *What We Owe to Each Other* that if you *must* choose between saving A or saving (B&C), and you have no special ties, the principle "save the greater number" could be reasonably rejected by no one *as a tie-breaker* when no other relevant distinction exists. It doesn't sum welfare; it's a procedural rule justified by the equal concern owed to each person. Why isn't this a non-aggregative path to saving the greater number that avoids Taurek's objections?"
      *   *Likely Reply:* Argue that Scanlon's tie-breaker *presupposes* the numbers matter, which is precisely what's in dispute. From the single person's perspective, being abandoned because of a rule privileging numbers *is* reasonably rejectable. There's no "tie" that needs breaking if the claims aren't commensurable in the first place.
      *   **Follow-up:** "If Scanlon's principle *is* reasonably rejectable by the single person, doesn't that imply that *any* principle justifying saving the greater number would be reasonably rejectable by the person left behind? And if so, does your view ultimately commit you to saying that saving the greater number is *never* morally required (absent special duties), or merely that it's *permissible* not to? If the latter, what *positive* reason could justify *choosing* to save the greater number under your framework?"

  5.  **The "Special Duty" Escape Hatch:** "You often mention 'absent some special duty' when discussing the obligation to save the greater number. Could you elaborate on what kinds of 'special duties' you believe *could* legitimately ground an obligation to save the greater number in a rescue scenario? Are these duties agent-relative (e.g., a parent's duty to *their* child), role-based (e.g., a lifeguard's duty), or could they be more general (e.g., a duty grounded in fairness or minimizing overall 'claims')?"
      *   *Likely Reply:* Focus on concrete, specific duties: parental duties, professional roles (doctor, disaster responder), perhaps contractual obligations. Reject "fairness" or "minimizing claims" as covert aggregation.
      *   **Follow-up:** "If only these specific, contingent duties justify saving the greater number, doesn't that render the moral permissibility of saving the one (or flipping a coin) incredibly broad in ordinary circumstances? Does this imply that, for an ordinary bystander with no relevant special duties, it would be morally *permissible* to deliberately choose to save one stranger over five others, simply because they liked the color of their shirt?"

  6.  **The Role of the Agent's Perspective:** "A key aspect of Taurek's view, which you defend, centers the *agent's* perspective and their relationship to the individuals needing rescue. How does your view navigate the charge that this risks excessive moral subjectivity or agent-centered favoritism? Why should the agent's perspective (e.g., 'I can save this one person') trump the objective fact that saving *that* one person results in four more deaths than saving the other group?"
      *   *Likely Reply:* Emphasize that morality is fundamentally about what agents *do* and to *whom*. The "objective fact" of four more deaths isn't a single, aggregated *wrong* the agent commits *to anyone*; they wrong only the specific individuals they fail to save, and they can save *someone*.
      *   **Follow-up:** "But doesn't this focus on the agent's direct action and specific victims ignore the *opportunity cost* of their choice? By choosing to save the one, they *forego* the opportunity to save the five. Isn't the failure to seize the opportunity to prevent significantly more harm – even if that harm isn't aggregated onto a single entity – a morally relevant consideration for the agent?"

  7.  **The "Loss" Objection Revisited:** "Parfit famously argued that if you save the one, you don't just fail to save the five; you *ensure* the deaths of the four who *could* have been saved had you acted differently. He sees this as a distinct, additional loss *caused* by your choice. How does your framework address this 'causal' interpretation of the loss, which doesn't strictly rely on summing the welfare of the five versus the one?"
      *   *Likely Reply:* Argue that this is a redescription of the same problem. The "additional loss" of the four is still just the loss *to each of those four individuals*. The agent doesn't cause their deaths in a relevant sense (they were already in peril); they merely fail to prevent them. The causal story doesn't change the fundamental non-comparability of distinct losses.
      *   **Follow-up:** "Even if we accept that the agent doesn't *cause* the deaths, doesn't the fact that their choice *determines* which specific individuals die (the five if they save the one, the one if they save the five) create a unique responsibility? And doesn't the knowledge that their choice *could* have resulted in fewer deaths (even if those deaths aren't aggregated) impose a stronger reason to choose the action that *in fact* leads to fewer deaths?"

  8.  **Real-World Application & Limits:** "Finally, Taurek's case is often seen as a highly stylized thought experiment. Could you discuss a concrete real-world context – such as emergency triage protocols (e.g., mass casualty events), disaster relief resource allocation, or organ transplantation policies – where you believe the logic of your position *should* govern decision-making, and why? Conversely, are there areas where you think aggregation is not only permissible but morally necessary, despite your general skepticism?"
      *   *Likely Reply:* Might point to triage where immediate, individual-focused clinical judgment prevails over crude numbers (though this is contested), or perhaps very small-scale, immediate rescues by individuals without systemic roles. Acknowledge that large-scale policy *requires* some form of aggregation for feasibility, but argue this is a pragmatic concession, not a moral truth.
      *   **Follow-up:** "If aggregation is a pragmatic necessity in large-scale policy but morally suspect in principle, doesn't that create a troubling disconnect? Shouldn't we strive for policies that align with our deepest moral convictions, even if complex? And in the triage example you mentioned, if a medic has one dose of antidote and must choose between one gravely ill patient or five less ill patients who would *all* die without it, does your view truly suggest the medic may flip a coin, or even choose based on a non-aggregative factor like who is closest, rather than being obligated to save the five?"

  **Key strategies embedded:**

  *   **Forcing Specificity:** Questions 1, 2, 3, 5, and 8 demand clarification of scope, mechanisms, and real-world implications.
  *   **Internal Critique:** Questions 3 (Kamm vs. 50/50), 4 (Scanlon's non-aggregative move), and 7 (Parfit's causal loss) challenge her using tools or arguments from within the broad non-aggregation camp.
  *   **Pressing Implications:** Follow-ups consistently push towards the counterintuitive or potentially problematic conclusions of the view (e.g., permissibility of saving based on trivial preferences, disconnect between rescue ethics and policy ethics, the moral status of causing *preventable* extra deaths).
  *   **Avoiding the Soundbite:** The questions are framed to require engagement with specific arguments (Kamm, Scanlon, Parfit, policy consistency) rather than allowing a simple restatement of the core "no view from nowhere" thesis.
  *   **Practical Bite:** Question 8 directly addresses your request to move beyond the seminar room and forces consideration of actual consequences.

  Good luck with the interview! Remember to listen closely and adapt your follow-ups based on her actual responses in the moment.
