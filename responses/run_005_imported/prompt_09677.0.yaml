prompt: |-
  I'm a third-year philosophy major currently taking a seminar on aggregation and distributive ethics, where we've just spent two weeks working through John Taurek's "Should the Numbers Count?" alongside Derek Parfit's reply and a couple of the follow-up pieces by Kamm and Scanlon our professor assigned. As it happens, our department runs a small student-produced podcast, and I've been asked to interview this term's invited colloquium speaker: a moral philosopher whose research largely defends and updates Taurek's claim that we are not always obligated — perhaps not ever obligated, absent some special duty — to save the greater number when we can't save everyone. Among the graduate students she's known for shutting down objections with the line that "there is no view from nowhere from which five deaths add up to a bigger loss than one," and I'd rather not hand her another opportunity to just repeat it.

  Could you draft seven or eight interview questions that engage with the actual structure of her position instead of inviting a restatement of it? I'd like at least one question testing whether her rejection of interpersonal aggregation is consistent with judgments we make outside the isolated-rescue case — for instance, that a policy predictably causing more deaths is worse than one causing fewer — one that raises Kamm's weighted-lottery proposal as a friendlier compromise and asks why she still insists on a flat fifty-fifty chance instead, and one that puts Scanlon's tie-breaking argument for saving the greater number to her directly, since it claims to reach a number-sensitive verdict without ever summing welfare across people. For each of those, please add a short follow-up keyed to whatever reply she's most likely to give, so the exchange doesn't just stall at her first move. And could you close with a question about what, if any, real-world case — triage protocols, disaster response, organ allocation — she thinks her argument actually governs, as opposed to a thought experiment that stays safely in the seminar room?
