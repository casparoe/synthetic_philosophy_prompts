  We can break it into:

  = log(Γ(20)) - log(Γ(10)) - log(Γ(10)) + log(Γ(5110)) + log(Γ(4910)) - log(Γ(10020))

  Using Stirling's approximation:

  log Γ(z) ≈ (z-0.5)*log(z) - z + 0.5*log(2π)

  We can compute each term:

  First, for Γ(20): log Γ(20) = (20-0.5)*log(20) - 20 + 0.5*log(2π) = 19.5*log(20) - 20 + 0.5*log(2π)
  log(20)≈2.9957, so 19.5*2.9957 ≈ 58.416, then -20 + 0.5*log(2*3.1416)≈0.5*log(6.2832)≈0.5*1.8379≈0.91895 -> so about 58.416-20+0.91895≈39.335

