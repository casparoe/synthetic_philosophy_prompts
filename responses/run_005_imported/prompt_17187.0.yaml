  We are going to create a concrete toy example to illustrate Lindley's paradox (also known as the Jeffreys-Lindley paradox). This paradox shows that a frequentist hypothesis test (using p-values) can reject the null hypothesis (i.e., find a "statistically significant" result) while a Bayesian analysis on the same data might strongly support the null hypothesis.

  The paradox typically arises when:
  - The sample size is very large.
  - The effect size is very small (but the test is so powerful that it can detect even tiny effects as significant).
  - The Bayesian approach incorporates a prior that is skeptical of large effect sizes.

  Let me set up a simple scenario:

  Suppose we are testing whether a coin is fair. The null hypothesis (H0) is that the coin is fair (probability of heads, p = 0.5). The alternative hypothesis (H1) is that the coin is not fair (p ≠ 0.5).

  We flip the coin a very large number of times. Let's say we flip it 10,000 times and get 5,100 heads. So we have 5,100 heads and 4,900 tails.

  Frequentist approach (using p-values):

  We can use a binomial test or a normal approximation (since n is large). The test statistic for a two-sided test is:

  z = (observed proportion - 0.5) / sqrt(0.5 * 0.5 / n)

  Let p_hat = 5100/10000 = 0.51

  z = (0.51 - 0.5) / sqrt(0.25 / 10000) = (0.01) / (0.005) = 2.0

  The p-value for a two-sided test is the probability that a standard normal is beyond |z|=2.0, which is about 0.0455 (which is less than 0.05). So we reject the null hypothesis at the 5% level. We conclude the coin is biased.

  Bayesian approach:

  We are going to compare two models: 
  Model 0 (H0): p = 0.5 (exactly)
  Model 1 (H1): p is not 0.5, so we have to consider a prior distribution for p under H1.

  In Bayesian model comparison, we compute the Bayes factor, which is the ratio of the marginal likelihoods (the probability of the data under H0 divided by the probability of the data under H1, averaged over the prior for p in H1).

  Let me set up:

  H0: p = 0.5
  H1: p ~ Beta(a, b)   [a common prior for a proportion]

  But note: H0 is a point hypothesis, so we can compute the probability of the data under H0 exactly. For H1, we have to integrate over the prior.

  We choose a prior for p under H1. A common choice is a Beta(1,1) prior (which is uniform) or sometimes a more skeptical prior. However, the choice of prior can affect the result. For the paradox to occur, we might use a prior that is symmetric around 0.5 and concentrated enough to express skepticism about large deviations.

  But note: in Lindley's paradox, the prior under H1 is often chosen to be a symmetric distribution centered at 0.5, and we let the prior variance be fixed (not depending on n). For example, a normal prior on the logit scale, but for simplicity, we can use a Beta prior.

  However, to mimic the typical setup of Lindley's paradox, we can use a prior that is concentrated around 0.5. Let me use a Beta(a,a) prior, which is symmetric. The variance of a Beta(a,a) is 1/(4*(2a+1)). We want a prior that is not too spread out. But note: the exact choice of prior parameters is critical.

  Alternatively, let me use a normal approximation for the prior? That is sometimes done in Lindley's paradox. But for simplicity, I'll use a Beta prior and then we can compute.

  But note: the Bayes factor is:

  BF01 = [P(data | H0)] / [P(data | H1)]

  where P(data | H1) = ∫ P(data | p) * f(p) dp, and f(p) is the prior for p under H1.

  We choose a Beta(100,100) prior? Why 100? Because Beta(100,100) has mean 0.5 and variance (100*100)/((200)^2 * 201) ≈ 1/(4*201) ≈ 0.00124, so the prior is concentrated around 0.5. This prior expresses that we believe p is very likely to be between about 0.45 and 0.55 (about 99% within 0.5±3*SD, where SD≈sqrt(0.00124)≈0.035, so about 0.5±0.105). But we are going to see that even a prior that is not extremely concentrated can lead to the paradox when n is very large.

  Alternatively, let me choose a Beta(10,10) prior? This has mean 0.5 and variance 10*10/(20*20*21) = 100/(400*21)=100/8400≈0.0119, so standard deviation about 0.109. This prior is less concentrated.

