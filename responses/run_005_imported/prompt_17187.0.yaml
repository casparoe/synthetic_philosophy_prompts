  BF01 is the Bayes factor in favor of H0. A value of about 10^10 means very strong evidence for H0.

  So, in the Bayesian analysis with a Beta(10,10) prior, we get overwhelming support for H0 (the fair coin) despite the frequentist test rejecting H0 at the 5% level.

  Why does this happen?

  The key is that the Bayesian approach takes into account the prior probability of the effect. In this case, our prior under H1 was centered at 0.5 and we considered it very unlikely that p would be far from 0.5. The observed proportion (0.51) is very close to 0.5, and with such a large sample, the prior under H1 (which is spread out) actually makes the data more likely under H0 than under H1. The frequentist test only considers the null hypothesis and does not consider the plausibility of the alternative.

  Connection to the replication crisis:

  In many fields (like psychology), researchers often run studies with relatively small sample sizes. When they get a p-value just below 0.05, they declare significance. However, if the true effect is very small, then when other researchers try to replicate with a larger sample, they might get a similar effect size (say, small) but with a larger sample the p-value becomes very small (highly significant). However, a Bayesian might have been skeptical from the beginning because:

  1. The prior probability of a large effect might be low (many effects in psychology are small and noisy).
  2. When the sample size is small, the frequentist test might not have enough power to detect a small effect, but when the sample size is large, it can detect even trivially small effects (like our 0.51 vs 0.50).

  But the Bayesian approach, by incorporating a prior that expresses skepticism about large effects, requires stronger evidence (in terms of the likelihood) to overcome the prior. In the replication crisis, many findings that were initially "significant" in small samples turned out to be false because the effect sizes were overestimated (due to publication bias and selective reporting) and because the true effect was zero or very small. When replicated with a larger sample, the effect size estimate often shrank.

  Moreover, the Bayesian approach with a skeptical prior would have required a much more extreme result (or a larger effect size) to conclude that there is evidence against the null. This prevents the accumulation of false positives that are only due to random noise in small samples.

  In summary, Lindley's paradox shows that even a tiny deviation from the null (like 0.51 in 10,000 flips) can be statistically significant by a p-value test, but if we have a prior that expects the effect to be near zero (or exactly zero in the null) and we are testing against an alternative that allows a range of effects, then the data might actually support the null.

  This is why the difference in philosophy (frequentist vs Bayesian) matters. Frequentists do not incorporate prior beliefs, so they might reject the null for trivially small effects when n is large. Bayesians, by using a prior that is skeptical of large effects, avoid this and require that the effect be both statistically reliable and practically meaningful.

  Note: The choice of prior is critical. If we had chosen a very diffuse prior (like Beta(1,1)), then the Bayes factor might have favored H1. But in many scientific contexts, it is reasonable to have a prior that is concentrated around the null because most effects are small or null.

  I hope this example helps!
answer: |-
  I'll break this down with a concrete toy example that shows exactly how Lindley's Paradox happens, why frequentist and Bayesian methods clash, and how this connects to the replication crisis. No jargon beyond what's absolutely necessary—we'll use fake numbers for clarity.

  ### The Scenario: Testing a "Brain-Boosting" Pill
  Imagine a drug company claims their new pill improves exam scores in college students. You run a study:

  - **Null Hypothesis (H0)**: The pill does nothing (average score change = 0).  
  - **Alternative Hypothesis (H1)**: The pill *does* something (average score change ≠ 0).  

  You test 10,000 students (a huge sample size, common in post-replication crisis studies). Here's the result:  
  - Average score improvement = **0.1 points** (on a 100-point scale).  
  - Standard error = **0.05** (measure of how noisy the data is).  

  ---

  ### Step 1: Frequentist Approach (p-values)
  - **Calculate the test statistic**:  
    \( \text{z-score} = \frac{\text{Observed Effect}}{\text{Standard Error}} = \frac{0.1}{0.05} = 2.0 \).  
  - **Find the p-value**:  
    A z-score of 2.0 gives p = 0.046 (you look this up in a table or software).  
  - **Conclusion**: p < 0.05 → "Statistically significant!" The pill works!  

  **Why?** The frequentist logic: "Assuming the pill does nothing, there's only a 4.6% chance we'd see an effect this big (or bigger) by random luck. That's unlikely, so we reject the null."  

  ---

  ### Step 2: Bayesian Approach (Updating Beliefs)
  Bayesians start with a **prior belief** about how likely the pill is to work *before seeing the data*. Given the replication crisis (many "miracle" pills fail), we're skeptical. We set:  
  - **Prior belief**: 95% chance the pill does *nothing* (H0 is true). Only 5% chance it does *something* (H1 is true).  
  - **Effect size if real**: If H1 is true, we expect tiny effects (most pills are bunk or weak). Say, ±1 point.  

  Now, we **update this belief with the data**:  
  - Observed effect = 0.1 points (same as above).  
  - **Bayesian calculation**: Combines prior belief with data to get the **posterior probability** (updated belief).  

  The key insight:  
  - The data (0.1-point effect) is **much closer to "no effect" (0)** than to our expected real effect (±1 point).  
  - With 10,000 students, the data is **precise**—it's unlikely to be a fluke, but it's *also* too tiny to align with H1.  

  **Result**:  
  - After crunching numbers (see table below), the Bayesian finds:  
    - **Posterior probability for H0 (pill does nothing) = 99.7%**.  
    - **Posterior probability for H1 (pill does something) = 0.3%**.  

  **Conclusion**: "The data actually *strengthens* our belief that the pill is useless!"  

  | Approach       | Result for H0 ("no effect") | Conclusion          |
  |----------------|-----------------------------|--------------------|
  | **Frequentist** | p = 0.046 (significant)     | "Reject H0! Pill works!" |
  | **Bayesian**   | Posterior = 99.7%           | "H0 is strongly supported!" |

  ---

  ### Why the Disagreement? (Lindley's Paradox)
  - **Frequentists** only ask: "Is the data unlikely if H0 is true?"  
    → With big samples, even **trivial effects** (like 0.1 points) become "significant" because noise is crushed.  
  - **Bayesians** ask: "Compared to H1, how *well* does H0 explain the data?"  
    → If the observed effect is **closer to H0** than to typical H1 effects, and H0 was already *plausible*, the data can favor H0.  

  **In our example**:  
  - The effect (0.1) is tiny—way closer to 0 (H0) than to ±1 (H1).  
  - With 10,000 students, we *know* this tiny effect is real... but it's **trivially small**. Bayesians say: "This 'real' effect is so weak, it might as well be zero for practical purposes. Plus, we were skeptical to begin with."  

  ---

  ### Connection to the Replication Crisis
  1. **P-hacking & small samples**:  
     - In early studies, researchers used small samples (e.g., 20 students). To get p < 0.05, you need *big* effects (e.g., +5 points).  
     - Bayesians would say: "A +5-point effect is huge! If this were real, it'd be easy to replicate. But our prior says huge effects are rare."  

  2. **Replication with big samples**:  
     - When others replicate with 10,000 students, effects shrink toward their true value (e.g., +0.1 points).  
     - Frequentists: "p = 0.046 → still significant!"  
     - Bayesians: "This tiny effect is **consistent with H0** (no effect) and doesn't match our prior for H1. It's probably noise."  

  3. **Why fields got flooded with false positives**:  
     - Frequentist stats **reward small samples with big effects** (which are often flukes).  
     - Journals publish p < 0.05 results, ignoring that tiny effects will always be "significant" with big samples—even if useless.  
     - Bayesians, with their **skeptical priors**, would've said: "Show me an effect that's both *reliable* and *meaningful*."  

  ---

  ### The Bottom Line
  - **Frequentists** risk false positives by ignoring:  
    - Prior plausibility ("Is this hypothesis even reasonable?")  
    - Effect size ("Is this result *practically* important?")  
  - **Bayesians** avoid this by demanding:  
    - Data that *strongly* contradicts H0 **and** aligns with H1.  
    - A reasonable starting belief (prior).  

  Lindley's Paradox isn't "made up"—it's math showing how big data can make **trivial effects "significant"** while Bayesians (rightly) yawn. The replication crisis happened because fields like psychology overrelied on frequentist stats without asking: "Is this effect *actually* important, or just noise amplified by sample size?"  

  If you want the exact math for the Bayesian update (no jargon—just arithmetic), let me know!
