  **MEMORANDUM**  
  **TO:** Board of Directors & Repertoire Committee  
  **FROM:** Repertoire Committee Chair  
  **SUBJECT:** Decision on Mozart/Da Ponte *Don Giovanni* Production  
  **DATE:** October 26, 2023  

  **RECOMMENDATION:**  
  Proceed with the planned traditional production of *Don Giovanni*, supplemented by enhanced contextual programming. The production will be staged without directorial moralizing alterations to the libretto or score.  

  **TIMELINE:**  
  - **Nov 15, 2023:** Finalize partnerships for contextual programming (academic panels, talkbacks).  
  - **Dec 1, 2023:** Release dramaturgical guide for audiences addressing ethical complexities.  
  - **Jan 10, 2024:** Begin rehearsals with explicit directive: portray Giovanni’s predation authentically, avoiding romanticization.  
  - **Mar 15, 2024:** Premiere, followed by post-show panel: "Mozart, Morality, and Modernity."  
  - **Apr 2024:** Dedicated donor salon discussing ethical engagement with classic works.  

  ---

  **RATIONALE & ENGAGEMENT WITH BERNARD WILLIAMS:**  

  ### 1. **Artistic Integrity and Ethical Complexity**  
     Williams’ analysis of *Don Giovanni* (in *On Opera*) rejects didacticism, arguing the opera’s power lies in its refusal to simplify moral ambiguity. Giovanni’s seductions are *already* framed as violations: Donna Anna’s trauma, Elvira’s devastation, and Zerlina’s coercion are unambiguous. The Catalogue Aria (Leporello’s tally) is not a celebration but a grotesque inventory of objectification, emphasized by Mozart’s deliberately mechanical music. Williams insists that art’s role is to *provoke ethical reflection*, not to deliver verdicts. Forcing explicit condemnation onto the staging would violate the work’s immanent critique of power and privilege.  

  ### 2. **Addressing the #MeToo Imperative**  
     We acknowledge the valid concern that uncritical depictions of predation risk normalizing harm. **The strongest counterargument** contends that in a post-#MeToo era, institutions must actively disavow toxic narratives, especially when funded by public/donor capital. Silence *is* read as complicity.  
     **Our response**: Withdrawal or heavy-handed moralizing undermines the opera’s own ethical apparatus. Giovanni’s damnation—engineered by the murdered Commendatore—is Mozart’s unambiguous judgment. Staging this traditionally *honors* #MeToo principles: the victim (Anna) drives the pursuit of justice; the abuser is literally consumed by his crimes. Contextual programming will frame this for modern audiences.  

  ### 3. **Williams’ Philosophical Commitment**  
     Williams opposed "moralism" (applying rigid rules to complex contexts) and championed "thick" ethical concepts rooted in lived experience. *Don Giovanni* exemplifies this: its morality emerges from character interactions, not abstract rules. Forcing a directorial "condemnation" would:  
     - **Falsify the work**: Imposing an external moral overlay disregards the existing, sophisticated critique within Mozart’s score and Da Ponte’s libretto.  
     - **Set a dangerous precedent**: Requiring operas to conform to contemporary ethical directives invites censorship of *Tosca* (sexual coercion), *Madama Butterfly* (orientalism), or *Peter Grimes* (child abuse), flattening their critical potential.  
     Williams would argue that the committee’s duty is to present the work *faithfully*, then trust audiences to engage ethically—precisely because ethics cannot be codified into universal rules.  

  ### 4. **Mitigation Strategy**  
     To address concerns without compromising artistic integrity:  
     - **Dramaturgical Guide**: Distribute materials highlighting Giovanni’s actions as predatory, not charismatic. Contextualize the Catalogue Aria as evidence of dehumanization.  
     - **Post-Show Dialogues**: Partner with #MeToo advocates and ethicists to dissect the opera’s tensions.  
     - **Donor Engagement**: Host a salon exploring "Problematic Classics" with Williams’ philosophy as a framework.  

  ---

  **CONCLUSION:**  
  Williams’ philosophy compels us to resist instrumentalizing art as moral propaganda. *Don Giovanni*’s enduring power lies in its uncomfortable complexity—a mirror to human failings that demands active critical engagement. Withdrawing or distorting it would betray our mission as custodians of culture. By presenting it authentically *and* contextualizing its ethical dimensions, we honor both artistic legacy and contemporary responsibility.  

  **Approved by Repertoire Committee:**  
  [Signatures]  

  ---  
  **APPENDIX:** Bernard Williams’ relevant positions:  
  - *Ethics and the Limits of Philosophy* (1985): Rejects "theory-centric" morality.  
  - *On Opera* (2006): Praises Mozart for "not resolving tension but sustaining it" as ethical insight.  
  - "Moral Luck" (1981): Context, not rules, determines moral assessment.
