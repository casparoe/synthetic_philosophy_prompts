prompt: |-
  Okay so this is going to be a pretty personal ask but here goes. My younger brother has been in and out of rehab for meth for about six years now, and two weeks ago he "borrowed" (stole) money from our mom's account again while telling everyone he was doing great. I keep swinging between being genuinely furious with him and feeling like it's almost unfair for me to be mad, since the addiction really took off right after some bad trauma he went through as a teenager that our family never dealt with properly. My friend Dana, who's ABD in the philosophy department at her school, sent me P.F. Strawson's "Freedom and Resentment" after I vented to her about all this, and now we've been texting about it non stop for like two weeks, mostly just circling the same two points.

  Dana's pretty committed to the Strawsonian line: that reactive attitudes like resentment don't actually need to be backed up by some further fact about libertarian free will, their just built into what it means to be in a real relationship with someone, and that fully adopting what Strawson calls the "objective attitude" toward my brother (treating him as a thing to be managed or avoided rather than someone you hold to the ordinary demands of trust and honesty) would basically mean giving up on him as a person entirely. I've been reading around and find myself more drawn to something like Derk Pereboom's hard-incompatibilist position, that once you actually trace out the full causal history behind someone's actions (the genes he didn't pick, the trauma he didn't ask for), the resentment starts to look like its tracking something that isn't really there, and we have good reason to lean further into that objective stance than Strawson thinks we should, short of treating my brother like a broken appliance.

  Could you write me a dialogue between two people arguing these two positions out? I don't want either side to be a pushover here, they should both be sharp and actually respond to the other's specific points instead of just restating their own view over and over, and I'd love if it dug into specifics like the participant/objective attitude distinction, excusing vs exempting conditions, and manipulation-style arguments against desert, rather than turning into a generic "do we have free will" back and forth. Feel free to leave it without a tidy resolution, since that's honestly where Dana and I are stuck too.
