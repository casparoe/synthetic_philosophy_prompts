  ## The Unstable Ground: Abandoning Moral Equality, Reconstructing Combatant Responsibility

  The doctrine of the Moral Equality of Combatants (MEC), as championed by Michael Walzer, stands as a cornerstone of traditional Just War Theory. Its core tenet, the "independence thesis," insists that *jus in bello* (justice in war) is conceptually and morally separate from *jus ad bellum* (justice of war). Soldiers on opposing sides, irrespective of whether their nation fights a just or unjust war, confront each other as moral equals, each possessing an equal right to kill the other, provided they adhere to the rules of war. Jeff McMahan's revisionist project detonates this foundation. His liability-based account tethers the permission to kill directly to moral responsibility for contributing to an unjust threat. Consequently, combatants fighting without a just cause typically lack the right to kill those resisting their unjust aggression, regardless of their scrupulous observance of *in bello* constraints. Adjudicating this profound dispute requires confronting key defenses of MEC and grappling with the practical implications McMahan himself acknowledges. While McMahan successfully exposes MEC's core moral bankruptcy, a nuanced reconstruction of combatant responsibility, sensitive to practical constraints and associative duties, offers the most defensible path forward.

  **McMahan's Core Challenge: Liability Trumps Symmetry**
  McMahan's critique rests on a fundamental principle of self-defense and defense of others: one is only permitted to inflict harm on another if that person is morally liable to that harm. Liability arises when an individual, through their voluntary actions (or culpable omissions), makes themselves responsible for an unjust threat to others. Applying this to war, soldiers fighting in an unjust war are, by participating, contributing to an unjust threat. Their actions make them liable to defensive harm by those resisting that threat (just combatants). Conversely, just combatants are not responsible for an unjust threat; they are resisting one. Therefore, unjust combatants lack the moral right to kill just combatants, while just combatants *do* possess the right to kill unjust combatants. The symmetry of MEC collapses; combatants are fundamentally unequal in their moral standing and permissions.

  **Engaging Defenses of MEC and McMahan's Responses**

  1.  **The Epistemic Argument:**
      *   **Defense:** Proponents argue that ordinary soldiers, embedded in state propaganda, lacking access to high-level intelligence, and facing immense pressure, cannot reliably determine the *jus ad bellum* status of their own war. Holding them liable for fighting without a just cause is therefore unfair and impractical. MEC provides a clear, workable rule that doesn't demand impossible judgments from soldiers.
      *   **McMahan's Response:** McMahan concedes the *difficulty* of knowing but rejects it as a justification for MEC. Ignorance, he argues, is often culpable. Soldiers have a duty to make reasonable inquiries about the justification for war, especially given the gravity of killing. Furthermore, the epistemic challenge doesn't create a *positive permission* to kill; at best, it might offer an *excuse* for wrongful killing, mitigating blame without making the act permissible. The core moral truth – that killing in an unjust cause is wrong – remains. We don't grant bank robbers a "right to rob" because they mistakenly believe the bank owes them money; their culpable ignorance excuses, not justifies.
      *   **Assessment:** McMahan's distinction between justification and excuse is powerful. He successfully shows that epistemic limitations cannot *ground* a moral permission; they can only potentially *exculpate* individuals who act wrongly without full culpability. However, his stance arguably underplays the systemic nature of military indoctrination and the genuine difficulty of accessing reliable information in wartime, raising questions about the *reasonableness* of the expected inquiry for many conscripts or soldiers in highly authoritarian states.

  2.  **Seth Lazar's Associative Duties:**
      *   **Defense:** Lazar argues that McMahan's individualism overlooks the profound moral significance of special relationships, particularly the duties soldiers owe to their compatriots. These associative duties – to protect, stand with, and share the fate of one's fellow citizens – can generate a *pro tanto* permission to fight even in an unjust war. Soldiers are not merely individuals but members of a political community, and their role-specific obligations can create permissions that transcend the abstract liability calculation. While not overriding *jus ad bellum* concerns entirely, these duties can shield soldiers from the full force of liability, potentially preserving a qualified form of equality or at least mitigating the asymmetry.
      *   **McMahan's Response:** McMahan firmly rejects associative duties as capable of grounding a permission to kill innocent people (just combatants). He argues that duties to compatriots cannot override the stringent negative duty not to harm the innocent. Loyalty, while valuable, does not justify participating in mass violence against those who have done no wrong. Associative duties might explain *why* soldiers fight, or create conflicts of duty, but they cannot *justify* inflicting wrongful harm. The core prohibition remains supreme.
      *   **Assessment:** Lazar's argument highlights a genuine tension in McMahan's highly individualistic framework. Associative duties *are* morally significant and shape our obligations. McMahan successfully maintains that they cannot simply *trump* the fundamental wrong of killing the innocent. However, Lazar's point potentially suggests a more nuanced reconstruction: perhaps associative duties *reduce* the culpability or *degree* of liability for unjust combatants who fight out of a sense of (misguided) obligation to protect comrades or country, especially if they adhere strictly to *in bello* constraints. They don't grant a permission, but they might complicate the picture of blame and excuse. McMahan's dismissal might be too swift regarding the *weight* of these duties in the moral calculus of agents.

  **Benbaji's Contractarian Defense:**
  *   **Defense:** Yitzhak Benbaji argues that MEC functions as a mutually beneficial convention akin to the rules of a game. Recognizing the brutality inherent in war, states tacitly agree to a "war convention" where combatants are granted equal *jus in bello* rights regardless of *jus ad bellum*. This convention serves humanity's best interests by restraining violence, protecting civilians, and making wars less savage than they would be if each side viewed the other as criminal aggressors devoid of rights. Abandoning MEC would incentivize unrestrained warfare against "unjust" combatants.
  *   **McMahan's Response:** McMahan counters that conventions cannot create fundamental moral permissions where none exist. A convention that permits murder (which killing unjust combatants often is) is morally illegitimate, no matter its beneficial consequences. Furthermore, he argues the convention is unstable and unnecessary: soldiers can recognize *in bello* constraints as applying to *all* (minimizing suffering) without accepting the fiction of moral equality for killing combatants. Just combatants already have strong incentive to follow *in bello* rules to maintain their own moral standing and legitimacy.
  *   **Assessment:** Benbaji identifies a crucial pragmatic concern. McMahan effectively dismantles the idea that a convention can *morally justify* killing the innocent. However, Benbaji's core point about the *practical function* of MEC in limiting savagery retains significant force. McMahan's assertion that *in bello* constraints can be maintained without MEC is plausible *in theory*, but the historical and psychological link between viewing the enemy as a legitimate combatant and treating them humanely is strong. Abandoning MEC *morally* risks eroding the *practice* of restraint, a risk McMahan acknowledges but perhaps underweights.

  **The Cost of Divergence: Law vs. Deep Morality**
  McMahan readily concedes that the positive Law of Armed Conflict (LOAC) may need to diverge from the "deep morality" of war he describes. LOAC requires simple, clear, verifiable rules capable of universal application and enforcement. Determining *jus ad bellum* authoritatively *during* a conflict is often impossible, and asymmetric rules would be chaotic and prone to abuse. Symmetrical *jus in bello* rules, like MEC in law, promote predictability, compliance, and protection for all involved, especially civilians. This concession is pragmatic but costly for the revisionist position. It means that, in practice, LOAC will continue to treat combatants *as if* they were morally equal, even though, according to McMahan, they fundamentally are not. This creates a tension: the law sanctions behavior (unjust combatants killing just combatants) that deep morality condemns as murder. While necessary for practical reasons, this divergence underscores the tragic imperfection of regulating war and highlights that LOAC, while vital, is an instrument of *minimizing evil*, not a perfect reflection of moral truth.

  **Verdict: Abandon MEC as Stated, Reconstruct Responsibility**

  The Moral Equality of Combatants, as traditionally formulated by Walzer, **should be abandoned as a fundamental moral doctrine.** McMahan's core insight is compelling and correct: the moral permission to kill in war cannot be divorced from the justice of the cause one fights for. Contributing to an unjust threat renders one liable to defensive harm; fighting justly in defense against such a threat confers a permission. Walzer's independence thesis creates a morally indefensible space where killing the innocent is deemed permissible based solely on role and reciprocity, violating fundamental principles of individual moral responsibility.

  However, abandoning MEC does not necessitate adopting McMahan's framework wholesale without refinement. The defenses, particularly Lazar's and the pragmatic concerns underlying Benbaji's and the epistemic argument, point towards a necessary **reconstruction of combatant responsibility:**

  1.  **Moral Asymmetry is Foundational:** The core revisionist claim stands: unjust combatants generally lack the *fundamental moral permission* to kill just combatants. Their killing is typically wrongful, even if excusable or mitigated in some circumstances.
  2.  **Role of Excuse and Mitigation:** The epistemic difficulty, the force of associative duties, and the context of state coercion are crucial factors in assessing individual *culpability* and the *degree* of liability for unjust combatants. These factors do not create a *permission*, but they significantly affect blameworthiness and the moral weight of defensive actions against them. A soldier misled by propaganda fighting alongside childhood friends to protect his town is less culpable than a mercenary knowingly fighting for conquest, even if both lack the permission to kill just defenders.
  3.  **Reconstructed "Equality" in Constraint?:** While the *permission to kill* is asymmetric, the *duty to minimize harm* and adhere to *jus in bello* constraints remains stringent and largely symmetrical *for all combatants*. Just combatants have no license for unnecessary brutality. Unjust combatants, by adhering strictly to these constraints, significantly *reduce* their moral wrong-doing (from murderous aggression to wrongful participation in aggression with minimized harm) and potentially their liability. This reconstructed view maintains the vital practical function of *in bello* rules emphasized by Benbaji, without endorsing the fiction of moral equality for killing.
  4.  **Law's Pragmatic Symmetry:** The concession regarding LOAC is necessary and wise. The law must prioritize workable rules that maximize restraint and protect non-combatants. Maintaining symmetrical *jus in bello* obligations in law, even while acknowledging deep moral asymmetry, is the least bad option for regulating the hell of war. However, this legal pragmatism should not obscure the moral truth and should ideally evolve, where feasible, to better hold *states and leaders* accountable for aggression (*jus ad bellum* violations).

  **Grounds for the Verdict:**
  The grounds for abandoning MEC lie in its fatal conflict with basic principles of individual moral responsibility, liability, and the prohibition on harming the innocent. It morally sanitizes participation in unjust aggression. The grounds for reconstruction lie in acknowledging the powerful insights from Lazar (associative duties shaping context and potentially mitigating culpability), the practical realities highlighted by the epistemic argument and Benbaji (necessitating clear *in bello* rules and recognizing limits on individual judgment), and McMahan's own pragmatic concession about the law. This reconstruction preserves the core moral truth that fighting an unjust war is deeply wrong and removes the blanket moral immunity for killing just combatants, while incorporating nuance regarding blame, excuse, and the enduring, universal importance of restraint within warfare itself. It recognizes that while combatants are not morally equal, their shared humanity and the practical imperative to limit suffering demand symmetrical constraints on *how* they fight, even as *why* they fight determines the fundamental permissibility of their violence.
