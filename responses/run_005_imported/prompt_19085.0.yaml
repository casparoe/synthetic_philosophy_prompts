  ok so i've read a ton of the anthropics stuff on LW and in Bostrom's book, and i've noticed every explainer of the SSA vs SIA (self-sampling vs self-indication) debate leans on the exact same two set pieces: the presumptous philosopher against SIA, and the doomsday argument against SSA. at this point i suspect most people (and probably models too) have just memorized "SIA -> presumptuous philosopher bad, SSA -> doomsday bad" without actually getting why those two specific setups are the ones that make each view look crazy.

  so: invent a new anthropic scenario, not just a reskin of either of those two, where SSA and SIA still spit out different credences given the exact same evidence. then explain in plain terms what feature a scenario needs to have for the two views to diverge at all - i.e. what's actually doing the work underneath the specific window dressing in the classic cases.
