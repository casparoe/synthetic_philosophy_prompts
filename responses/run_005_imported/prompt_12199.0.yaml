  Ok this is a bit of a rabbit hole but I was reading about how philosophers analyze 'dispositions' (fragility, solubility, that kind of property) and it seems like the classic move is to define them with a simple if-then: something's fragile if it would break when struck. Apparently there's two different famous counterexamples to that idea, called 'finks' and 'masks', and reading about them back to back they honestly sounded like the same trick to me -- both are cases where the if-then just gives the wrong verdict. Can you actually spell out the difference between a finkish disposition and a masked one, each with a clean example? And why do people in this literature insist on keeping them as two seperate categories rather then just one big bucket of 'weird counterexamples to the conditional analysis'? Kinda reminds me of the difference between a race condition and just not hitting the right interface method, but idk if that's a real analogy or just me projecting dev brain onto it.
