  **Justifications:**  
  - **Vindicated ("zero alcohol" and "heavy cuisine dulls thought"):** Modern neuroscience confirms alcohol's neurotoxic effects even in moderation, impairing cognition and creativity. Nutrition science robustly supports Mediterranean diets for cognitive benefits over heavy, processed meals linked to inflammation and mental fog.  
  - **Partly right, for the wrong reasons ("thinking on foot" and "small, plain meals"):** Walking boosts creativity via increased blood flow and neurogenesis, but ideas also emerge during rest; Nietzsche overstates movement's exclusivity. Small meals aid metabolic health and focus, yet intermittent fasting shows cognitive benefits too—his "no snacking" rule oversimplifies meal timing science.  
  - **Mostly wrong but not absurd ("staple grain, national vice"):** While diet shapes cultural practices (e.g., beer in grain-growing regions), no evidence supports grains *causing* specific drug preferences; opium/rice links are historical coincidences, not biological determinism.  
  - **Refuted ("climate determinism"):** Genius arises globally (e.g., Nordic philosophers like Kierkegaard); climate impacts mood but not intellectual capacity. Modern work on environmental psychology emphasizes adaptability over geographic destiny.
