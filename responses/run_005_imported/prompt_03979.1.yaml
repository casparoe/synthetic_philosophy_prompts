prompt: |-
  I'm taking a seminar this term devoted to Hume's moral philosophy, and for the last couple of weeks we've been working through Book 3, Part 2 of the Treatise, on justice, property, and promising. I feel like I have a decent grip on the "headline" view: that fidelity to promises, like justice more generally, is an artificial rather than a natural virtue, ultimately grounded in convention and the interests it serves rather than in some free-standing moral fact about promising itself. What I'm still struggling with is the more granular argument Hume gives, in Section 5 ("Of the Obligation of Promises"), for why a promise couldn't possibly be a natural act of the will in the first place — especially the compressed version of that argument that he tucks into a footnote. I raised this in office hours, but we ran out of time right after getting to the conclusion, without really working through how each step is supposed to follow from the last.

  Here are the two paragraphs in question, together with the footnote Hume attaches to the end of the second one:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise. Nor is this only a conclusion of philosophy; but is entirely conformable to our common ways of thinking and of expressing ourselves, when we say that we are bound by our own consent, and that the obligation arises from our mere will and pleasure. The only question, then, is, whether there be not a manifest absurdity in supposing this act of the mind, and such an absurdity as no man cou'd fall into, whose ideas are not confounded by prejudice and the fallacious use of language.

  All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or non-performance of it, displeases us after a like manner, we say that we lie under an obligation to perform it. A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise. But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, wou'd have produc'd contrary impressions, or have been endow'd with different qualities. It wou'd be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men cou'd naturally fall into so gross an absurdity. A promise, therefore, is naturally something altogether unintelligible, nor is there any act of the mind belonging to it."

  Footnote: "Were morality discoverable by reason, and not by sentiment, 'twou'd be still more evident, that promises cou'd make no alteration upon it. Morality is suppos'd to consist in relation. Every new imposition of morality, therefore, must arise from some new relation of objects; and consequently the will cou'd not produce immediately any change in morals, but cou'd have that effect only by producing a change upon the objects. But as the moral obligation of a promise is the pure effect of the will, without the least change in any part of the universe; it follows, that promises have no natural obligation. Shou'd it be said, that this act of the will being in effect a new object, produces new relations and new duties; I wou'd answer, that this is a pure sophism, which may be detected by a very moderate share of accuracy and exactness. To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition; which is plainly absurd and impossible. The will has here no object to which it cou'd tend; but must return upon itself in infinitum. The new obligation depends upon new relations. The new relations depend upon a new volition. The new volition has for object a new obligation, and consequently new relations, and consequently a new volition; which volition again has in view a new obligation, relation and volition, without any termination. 'Tis impossible, therefore, we cou'd ever will a new obligation; and consequently 'tis impossible the will cou'd ever accompany a promise, or produce a new obligation of morality."

  Could you help me reconstruct this reasoning in a way I can actually follow, rather than just restating the conclusion? First, I'd like a clean, step-by-step version of the elimination argument in the first paragraph: why exactly does Hume think the mental act "belonging to" a promise cannot be a resolution, a desire, or an act of willing the promised action itself, so that only "the willing of that obligation" is left standing? Second, I'd like the same treatment for the regress in the footnote — I can see that Hume wants to trap a rationalist about morality (presumably someone in the mold of Samuel Clarke or Wollaston, given what he argues against them earlier in Book 3, Part 1) into willing an endless series of new volitions, but I lose the thread of exactly which premise forces the move from "willing a new relation of objects" to "willing the volition that would create that relation," and then keeps the regress going rather than letting it stop after one step; concretely, why can't the rationalist just say that what is willed is the future action that will instantiate the new relation, rather than the present volition itself? Third, an evaluative question: does the regress depend on an assumption a rationalist could reasonably reject, and if so, is this footnote argument actually weaker than the sentiment-based argument in the main text, or is it doing independent philosophical work rather than just restating that argument in the rationalist's own vocabulary?
reasoning: |-
  Okay, let me unpack this Humean puzzle step by step. The user is grappling with two dense arguments about why promising can't be a natural act of will - the main text's elimination argument and the footnote's regress argument. 

  First, I need to reconstruct Hume's elimination of alternatives. His core move is showing that resolutions, desires, and present-directed willings all fail to capture the obligation-creating power of promises. Resolutions lack binding force (we break New Year's resolutions without moral guilt), desires are irrelevant (we can promise against our wishes), and the will only governs present actions (promises are future-oriented). That leaves only "willing the obligation" as the supposed mental act - but that's where the trap springs.

  Now for the regress argument in the footnote, which targets rationalists who think morality consists in relations. If I will a new obligation (a new moral relation), but relations require pre-existing objects, then willing the obligation would require willing the volition itself - since the obligation depends on the act of will. This creates an infinite loop: obligation requires relation, relation requires volition, volition requires obligation... The rationalist can't escape by saying we will the future action because the obligation must exist now, at the moment of promising, before the action occurs.

  Hmm, the user's third question is sharp - does this depend on questionable premises? Yes, the regress assumes rationalists must ground obligation in relations discoverable by reason alone, which a Clarke-type might reject by positing primitive moral facts. But that's exactly Hume's point: he's showing rationalism can't accommodate promise-obligation without absurdity, making his sentiment-based theory more plausible. The footnote isn't redundant; it's a tailored reductio against rationalist metaphysics.

  The user clearly knows their Hume - they recognize the Clarke/Wollaston context and spot the vulnerability in the regress argument. I should acknowledge that sophistication while ensuring each logical step is transparent. They're not just memorizing conclusions but wrestling with Hume's engine room philosophy, so my reconstruction needs forensic clarity.
answer: |-
  Let's reconstruct Hume's intricate argument step by step, addressing both the main text and the footnote. I'll break it down into its logical components, then evaluate the rationalist regress and its philosophical implications.

  ### **I. Hume's Elimination Argument (Main Text)**
  Hume eliminates possible mental acts that could constitute a promise, concluding that only "willing the obligation" remains—but this leads to absurdity.

  1.  **Premise 1**: A promise creates a moral obligation (i.e., a new duty to act).
  2.  **Premise 2**: This obligation must arise from a specific "act of the mind" accompanying the promise.
  3.  **Elimination of Alternatives**:
      *   **Not a Resolution**:  
          *   *Why?* A resolution (e.g., "I resolve to pay you tomorrow") expresses *intention* but lacks inherent binding force. We break resolutions (like New Year's resolutions) without feeling we've violated a moral duty. Resolutions impose no *obligation*.
      *   **Not a Desire**:  
          *   *Why?* We can make promises *against* our desires (e.g., reluctantly promising to repay a debt we wish would vanish) or even with "aversion." The obligation persists regardless of desire. Desire is irrelevant to the *duty* created.
      *   **Not a Willing of the Promised Action**:  
          *   *Why?* The will directly influences *present* actions (e.g., I will to raise my arm *now*). A promise concerns a *future* action ("I will pay you *tomorrow*"). The will cannot directly cause a future action; it can only cause present actions (like uttering words). Therefore, the mental act cannot be willing the *future* action itself.
  4.  **Conclusion of Elimination**: The only remaining candidate for the mental act creating the obligation is **"the willing of that obligation"** itself. When we promise, we must be willing the *obligation* (the duty) into existence.
  5.  **Common Intuition**: Hume notes this matches how we talk ("we are bound by our own consent," "obligation arises from our mere will").
  6.  **The Absurdity**: Hume then argues that willing an obligation *directly* is impossible/absurd.

  ### **II. The Regress Argument (Footnote)**
  Hume targets rationalists who believe morality consists in objective "relations" discoverable by reason. The regress shows why willing an obligation (a new moral relation) is incoherent.

  1.  **Rationalist Premise (RP1)**: Morality consists in objective *relations* between objects/actions/facts (e.g., repaying a loan restores a natural relation of equality; breaking a promise creates a relation of inconsistency).
  2.  **Rationalist Premise (RP2)**: A new moral obligation requires a *new moral relation*.
  3.  **Hume's Challenge**: Promises supposedly create a *new* obligation (a new moral relation) *solely* by an "act of the will" ("I promise"), without changing any external facts (e.g., the loan exists before and after the promise; only the *obligation* is new).
  4.  **The Dilemma & Regress**:
      *   **Step 1**: To create a *new obligation* (O1), I must will the creation of a *new moral relation* (R1). (From RP2).
      *   **Step 2**: Relations (R1) depend on the existence and properties of *objects* (Oa, Ob). (From RP1 - relations aren't free-floating).
      *   **Step 3**: The *only* "object" changed by my act of will (V1 - the volition to create O1/R1) is... *the act of will itself* (V1). The external world (e.g., the loan, the parties) is unchanged.
      *   **Step 4**: Therefore, the new relation (R1) must be a relation *involving the volition V1 itself* (e.g., V1 stands in some relation to the loan, or to future action, or to the concept of obligation).
      *   **Step 5**: But for R1 to exist, V1 must already have the properties that ground R1. Yet V1 is *defined* as the volition *to create* R1/O1. R1/O1 doesn't exist *before* V1.
      *   **Step 6**: **The Regress Ignites**: To create R1, I must will (V1) the existence of R1. But R1 depends on properties of V1. So willing R1 (via V1) requires willing that V1 *already has* the properties that ground R1. But V1 *acquires* its properties *by* being the volition to create R1. How can V1 have the properties *before* it performs its function?
          *   *Concretely*: To will obligation O1 (via V1), I need relation R1. R1 depends on V1 having property P (e.g., "being an obligation-creating act"). But V1 only *is* an obligation-creating act *if* it succeeds in creating O1/R1. To succeed, R1 must already exist (grounded in P), but R1 only exists *because* of V1. **V1's status (P) depends on R1 existing, and R1 existing depends on V1 having P.** This is circular.
      *   **Step 7**: **The Infinite Loop**: The rationalist might try to break the circle by introducing a *second* volition (V2):
          *   V1 is the volition to create O1/R1.
          *   But O1/R1 depends on V1 having property P (e.g., "being binding").
          *   So, I need V2: the volition that V1 *has* property P (i.e., V2 wills that V1 is an obligation-creating act).
          *   But V2 itself needs to be efficacious. For V2 to *make* V1 have P, V2 must *itself* have some property Q (e.g., "being a property-conferring act") that grounds *its* efficacy.
          *   This requires V3: the volition that V2 has property Q... and so on *ad infinitum_.
      *   **Step 8**: **Absurdity**: We cannot complete an infinite series of volitions in a single act of promising. Therefore, it's impossible to will a new obligation into existence via a single act of will (the promise).

  **Why the Rationalist Can't Escape by "Willing the Future Action"**:  
  The rationalist might suggest willing the *future action* (FA) that instantiates the new relation (e.g., willing *to repay the loan*). Hume blocks this:
  1.  **The Obligation Problem**: The *obligation* exists *now*, at the moment of promising, *before* the future action occurs. Willing FA *now* doesn't create a *present* duty; it just expresses a future intention (which Hume already dismissed as insufficient for obligation).
  2.  **The Relation Problem**: The new moral relation (e.g., "duty to repay") must exist *now* to ground the *present* obligation. If the relation depends solely on FA happening in the future, then there is *no* obligation *now* – only a prediction or intention about the future. The rationalist needs the *relation itself* (the duty) to be created *now* by the act of will.

  ### **III. Evaluation: Strengths, Weaknesses, and Purpose**
  1.  **Does the Regress Depend on a Questionable Premise?**
      *   **Yes.** It crucially depends on **RP1: Morality consists solely in objective relations discoverable by reason.** A rationalist like Clarke could reject this. Clarke might argue for simple, irreducible, non-natural moral facts or relations (e.g., "Fidelity is fitting") that are *not* constituted by empirical objects or their properties. The act of promising could *directly apprehend* or *trigger* one of these eternal moral relations (e.g., the "fitness" of keeping promises) without needing to *create* a new relation or change existing objects. The obligation arises from the *eternal fitness* of the act-type "keeping promises," which the promisor invokes.

  2.  **Is the Footnote Argument Weaker than the Sentiment Argument?**
      *   **Relative Strength**: The sentiment-based argument (main text) is arguably **stronger against Hume's overall framework** because:
          *   It targets the core of his meta-ethics: morality *is* sentiment. You can't create a sentiment (obligation = a specific kind of displeasure at non-performance) by sheer will.
          *   It doesn't rely on controversial rationalist premises (RP1). It attacks the very possibility of *any* naturalistic account of promising creating a new sentiment.
      *   **The Footnote's Purpose & Strength**: It's **not redundant** and does **independent work**:
          *   **Ad Hominem Force**: It uses the rationalist's *own* premises (RP1, RP2) to generate an absurdity *within their system*. Even *if* morality were relations (which Hume denies), promising *still* couldn't work naturally. It's a powerful internal critique.
          *   **Highlights the "Creation" Problem**: Both arguments emphasize that promises require *creating* a new moral entity (obligation/sentiment/relation) *ex nihilo* by sheer will, which Hume argues is impossible. The footnote dramatizes this impossibility within rationalism's relational framework.
          *   **Closes an Escape Route**: It specifically blocks the rationalist escape hatch of trying to ground promise-obligation in a new "relation of objects" created by the will, showing that even this leads to incoherence. The sentiment argument doesn't address this rationalist move directly.

  **Conclusion:** Hume's granular argument is a sophisticated one-two punch. The elimination argument shows no *natural* mental state (resolution, desire, present willing) can ground promise-obligation, forcing the idea of "willing the obligation." The main text argues this is impossible because sentiments can't be willed into existence. The footnote shows that *even if* we adopt rationalist premises (morality as relations), "willing the obligation" leads to a vicious regress, proving promises cannot be natural acts. While the regress depends on RP1 (which a robust rationalist could reject), it remains a potent internal critique of relational rationalism and reinforces Hume's core claim: promise-obligation is artificial, relying on convention and the utility of a social practice, not a natural act of will or a discoverable relation.
