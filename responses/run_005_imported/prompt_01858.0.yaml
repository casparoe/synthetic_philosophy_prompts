  Let me break this down. First, the protocol sentence analogy: Neurath saw protocol sentences as revisable, context-dependent statements within the encyclopedic model of science. Similarly, Isotype icons aren't self-validating; they rely on conventions (like the unit-per-icon rule). The user’s comparison here is defensible because both reject direct givenness. Neurath might not have explicitly linked them, but the structural similarity in anti-foundationalism is there. The user should emphasize this shared function rather than claiming Neurath intended the link.

