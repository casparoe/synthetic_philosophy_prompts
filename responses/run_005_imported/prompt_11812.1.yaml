  The ending should leave Tomas (and the reader) uncertain. Tomas might believe the captain is unchanged underneath (mask), while the captain insists he's different. But an ambiguous reaction—hesitation versus instinctive calm—can sow doubt. The impact on trust: if masked, the crew fears relapse; if finked, they trust his transformation.

  Avoiding terms: Use descriptions like "the old fire" for temper, "the system's hum" for the external control. The poison/antidote analogy from Bird can be mirrored in a subplot—maybe a contained threat that's neutralized externally versus one that's inherently defused.

  Ensuring the philosophical tension is clear through character interactions and consequences. The story's climax should force a moment where the disposition would manifest, and the outcome (or lack thereof) drives the ambiguity home.
