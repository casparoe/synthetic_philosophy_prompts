  Okay, let me try to unpack the user's query. They had an argument with their friend about coherent extrapolated volition (CEV) in AI alignment. The user thinks it's a philosophical con because there's no objective fact about what an idealized self wants. Their friend disagreed. Then they found a passage from Sidgwick's *Methods of Ethics* that seems related but is hard to understand, especially the second paragraph.

  First, I need to parse Sidgwick's dense prose. The first paragraph defines "desirable" as what one would desire with perfect foresight. The second paragraph complicates this. The user is confused about why the simpler definition fails and how the "contented pig" example counters it. They also question if Sidgwick's fix—using present desires with perfect foresight—solves the problem or just moves it.

  Breaking down Sidgwick's argument: The simpler definition says "good" is what we'd desire with perfect knowledge and emotional forecasting. But Sidgwick points out that actions can alter future desires. For example, becoming a contented pig means your desires degrade, so you don't regret missing higher goods. But that degraded state isn't truly desirable. So the simpler definition fails because it doesn't account for desire corruption.

  Sidgwick's fix is to anchor the idealization to the present self. He suggests that we should consider what the person would desire *right now* if they had perfect foresight of all consequences. This avoids the problem of future corrupted desires. But the user is skeptical: can't present desires also be influenced? Sidgwick might argue that the present self, with perfect foresight, would recognize the risk of desire corruption and avoid paths leading to degradation.

  Comparing to modern CEV: Both deal with idealized preferences. CEV extrapolates coherent, informed desires, considering multiple selves. Sidgwick focuses on the present self with perfect knowledge. The difference is in temporal anchoring—CEV aggregates over possible future selves, while Sidgwick uses the current moment. Both face the problem of defining the "right" self to idealize.

  The user's deeper concern might be about objectivity in value theory. They see CEV as subjective since it depends on who idealizes. Sidgwick's approach also relies on the individual's present desires, which are subjective. However, Sidgwick is part of a larger ethical project that might include objective elements. The user might be looking for whether any ethical system can avoid this subjectivity.

  I should clarify Sidgwick's counterexample and his solution, then address the user's skepticism about corruptibility. Highlighting the temporal anchor as key. Also, note that both approaches struggle with defining the idealization process but offer different frameworks. Conclude that Sidgwick's fix is an improvement but not a full solution, and modern CEV builds on similar ideas with more complexity.
answer: |-
  You've hit on a core problem in ethics and value theory that's as relevant to AI alignment (CEV) today as it was to Sidgwick in 1874. Let's break down that dense second paragraph step-by-step:

  ### 1. **The "Simpler" Definition & Its Problem**
     *   **The Definition:** Sidgwick initially suggests defining "my Good on the whole" as *"what I should actually desire and seek if all the consequences of seeking it could be foreknown and adequately realised by me in imagination at the time of making my choice."*
     *   **The Problem (The Contented Pig Counterexample):** This definition focuses on the desires you would have **at the time of choice** *with perfect foresight*. Sidgwick argues this is insufficient. Why?
          *   **Corrupted Desires:** Some choices *fundamentally alter your capacity to desire what's truly better*. Imagine someone choosing a life of constant, shallow pleasure ("contented pig") over pursuing more complex, challenging, but ultimately more fulfilling goods (knowledge, virtue, deep relationships, art - "something better").
          *   **No Regret ≠ Good Choice:** Under the simpler definition, if this person, *after becoming the contented pig*, looks back with perfect foresight *from their pig-state*, they wouldn't regret their choice. Their desires *now* perfectly align with their piggish life; they wouldn't desire the "better" life they could have had. They might even think, "Yep, with perfect knowledge, I *still* would have chosen this simple pleasure."
          *   **But We Judge It Bad:** Sidgwick points out that we intuitively judge this outcome as *bad* ("all the worse for a man"). The person has lost access to higher goods *and* the very capacity to desire them. The simpler definition fails because it validates the corrupted, lower state as "good" simply because it's desired without regret *from that corrupted state*. It doesn't account for the *degradation* of desire itself.

  ### 2. **Sidgwick's Proposed Fix**
     *   **The New Definition:** "a man’s future good on the whole is what he would now desire and seek on the whole **if all the consequences of all the different lines of conduct open to him were accurately foreseen and adequately realised in imagination at the present point of time.**"
     *   **The Key Move: Anchoring to the *Present* Self:** Sidgwick shifts the idealization point. Don't ask what the *future, potentially corrupted self* would desire with perfect foresight. Ask what the *current self*, *right now*, would desire if it had perfect foresight about *all possible futures* resulting from its choices.
     *   **Why This (Might) Avoid the Pig Problem:**
          *   The *current* self, with perfect foresight, would see the *entire trajectory*: the initial pleasure *and* the subsequent degradation of its own desires/capacities.
          *   Crucially, it would also see the *alternative trajectory*: the challenges *and* the potential for accessing higher goods without degrading desire.
          *   Sidgwick assumes the *present* self, armed with this total foresight, would recognize the degradation as a *loss* and would *not* desire the path leading to the "contented pig" state. It would desire the path preserving or enhancing its capacity for higher goods. The "something better" remains visible and desirable *from the present vantage point*.

  ### 3. **Does the Fix Work? Your Criticisms are Spot On**
     *   **Corruptibility of the Present Self:** You're absolutely right to ask: "since whatever I'd desire 'right now with perfect foresight' seems just as corruptible as what my future self would desire?" Sidgwick's fix relies on the *current* self's dispositions being the "true" or "authoritative" ones. But:
          *   What if the *current* self already has corrupted or shallow desires? (Sidgwick assumes rationality and a basic desire for one's own good, but this is debatable).
          *   "Perfect foresight" includes emotional forecasting. What if the present self *with* perfect foresight *still* chooses the pig path because it can't *imagine* valuing the higher goods sufficiently? Or finds the immediate pleasure overwhelming even with knowledge?
     *   **The Problem Relocates:** Instead of "which future self is authoritative?", it becomes "which *aspect* of the present self is authoritative?" or "how do we define the 'present self'?". Sidgwick leans on the idea of a "rational" present self making a "prudent" choice for its whole future life, valuing all moments equally ("equal regard for all the moments").
     *   **The "Invented" Problem:** Your core point about the "philosophical con" remains valid. Sidgwick's "fix" defines the Good based on a highly specific counterfactual desire state of the *current* individual. There's no objective, external validation for *why* this specific counterfactual (present self + perfect foresight) is the right one, rather than, say, the desires of the most virtuous future self, or the aggregate of all possible future selves, or some external standard. It's a chosen idealization.

  ### 4. **Sidgwick vs. Modern CEV**
     *   **Strong Similarity:** Both grapple with the core problem: actual human preferences are flawed (ignorant, inconsistent, impulsive, corruptible). Both propose defining value based on *idealized* preferences (informed, coherent, rational, reflective).
     *   **Key Difference - The Temporal Anchor:**
          *   **Sidgwick:** Anchors the idealization firmly to the **current, individual self** making a choice *now* with perfect foresight about *its own* future. It's fundamentally about individual prudence over a lifetime. The "volition" being extrapolated is rooted in the present moment of decision.
          *   **CEV:** Tends to be more abstract and aggregate. It asks what humans *would* converge to desiring *if* they knew more, thought more clearly, etc., often considered over a *hypothetical process of reflection* or across humanity. It's less tied to a specific individual's current choice point and more about a hypothetical, collective, reflective state. It often involves aggregating the idealized preferences of *many* individuals ("our" volition).
     *   **The "Contented Pig" Problem in CEV:** CEV would likely also try to avoid validating the degraded pig state. It might do this by arguing that the *process* of idealization (knowing more, thinking clearly) would inherently lead humans to value self-improvement, avoiding desire-corruption, and pursuing "higher" goods, making the pig state *incoherent* with truly idealized preferences. But it faces the same core challenge: *defining* that idealization process authoritatively.

  **Conclusion:**

  1.  **Sidgwick's Point:** The "contented pig" shows that defining "good" solely by desires *at the time of choice/consummation* (even with perfect foresight) fails if the choice *degrades* desire itself. The corrupted self can't regret its corruption, but we judge the corruption as bad.
  2.  **His Fix:** Anchor the idealization to the *present* self with perfect foresight of all *future consequences and states*. This self would (he assumes) reject paths leading to its own degradation.
  3.  **Your Critique is Valid:** The problem *does* relocate. Why privilege the *current* self's dispositions? Can't *it* be flawed or corruptible even with knowledge? Sidgwick relies on an implicit notion of prudence and rational self-interest valuing its whole existence equally.
  4.  **Relation to CEV:** It's fundamentally the *same move* – substituting idealized preferences for actual ones. Sidgwick's version is more individualistic and temporally anchored to a specific present decision point, while CEV is often more collective and process-oriented. Both struggle with the core philosophical issue you identified: there's no purely objective, non-circular way to define the "right" idealization procedure. Sidgwick's "contented pig" is a powerful early illustration of why this idealization is *necessary* (to avoid validating degradation) but also why it's *difficult* (choosing the anchor point). You weren't being obtuse; you were grappling with a deep and persistent problem in value theory.
