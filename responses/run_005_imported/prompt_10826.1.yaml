  Okay, the user is a public member on a state parole board facing a tough decision. They've encountered a situation where two different risk assessments for the same inmate produce wildly different results—44% vs 13%—due to different reference classes. The core problem here is the "reference class problem," where any individual can belong to multiple groups, each yielding different statistical outcomes. 

  The user needs to draft a memo by Thursday that addresses both this specific case and establishes a standing policy for future similar situations. They want concrete recommendations the board can vote on, but they're also worried about pushback—specifically, that abandoning a single "official" number might revert decisions to subjective gut feelings, which actuarial tools were meant to replace.

  First, I need to unpack the reference class problem clearly. It's not just about bias; it's a fundamental statistical dilemma. The inmate belongs to both a broad group (all men convicted of the same offense) and a narrow group (same offense + age + program completion + no juvenile record). Both are valid, but which is more relevant? That's the crux. 

  The user's hidden anxiety seems to be about legitimacy and accountability. They’re caught between wanting data-driven objectivity and realizing the data isn’t neutral. If the board picks one number over the other arbitrarily, it might look like they’re cherry-picking to justify a preexisting opinion. But if they ignore both numbers entirely, they’re back to unstructured discretion—which is what the tools were supposed to fix. 

  For the memo, I should propose a framework that forces the board to engage with both numbers transparently. Maybe: (1) Require both broad and narrow reference classes to be run routinely, (2) Use the narrow one as the primary anchor but mandate explaining why it’s appropriate for the individual, and (3) If the gap is wide, treat the two numbers as a "risk range" rather than a single point, then layer qualitative factors on top. 

  The strongest pushback will be: "This just makes it messier. How is this better than gut instinct?" The rebuttal is that it’s *structured* discretion—admitting uncertainty while still tethering decisions to data. The alternative isn’t "no discretion"; it’s *hidden* discretion disguised as objective math. 

  For the specific inmate, since the narrow class (13%) seems more relevant (he actually fits all those criteria), but the board should still confront why the broad class is so much higher. Maybe the in-prison program is ineffective? That’s a policy issue worth flagging. 

  Policy-wise, future cases should trigger automatic review if reference-class splits exceed a certain threshold (say, 15-20% difference). And the board should track how often this happens—it might reveal flaws in their risk tool’s design. 

  ...This feels balanced. It doesn’t pretend math can solve everything, but it doesn’t discard math either. The memo’s tone should be "Here’s how we navigate uncertainty without illusions of precision."
answer: |-
  ## MEMORANDUM  
  **TO:** Parole Board Members  
  **FROM:** [Your Name], Public Member  
  **SUBJECT:** Decision Protocol for Conflicting Risk Assessments & Policy for Reference Class Discrepancies  
  **DATE:** October 26, 2023  
  **URGENCY:** Vote Thursday  

  ### I. Core Problem: The Reference Class Dilemma
  As flagged by our colleague, this is indeed the **Reference Class Problem** (RCP): assigning a statistical probability to an individual requires choosing *which group* they "belong to" for comparison. Any person simultaneously fits countless overlapping groups (broad, narrow, contextual), *each yielding different risk estimates*. Both consultants' analyses are statistically valid (44% "broad class" vs. 13% "narrow class"). Neither is inherently "more correct" for **this specific individual**. RCP is distinct from algorithmic bias (though they interact); it's a fundamental limitation of statistical prediction for unique individuals.

  ### II. Recommendations for THIS Case (File #XXXXX)
  1.  **Acknowledge the RCP Explicitly:** State in deliberations that the 31-point gap stems from legitimate, unresolvable reference class ambiguity.
  2.  **Prioritize the Narrower Class (13%), BUT Scrutinize its Fit:**  
      *   **Why?** The narrow class (same offense, age, completed program X, no juvenile record) more closely mirrors *this individual's specific characteristics and rehabilitative efforts*. The broad class (all men, same offense) ignores relevant mitigating factors *he demonstrably possesses*.
      *   **Require:** Board members must articulate *why* the narrower class factors are deemed more predictive *for him* than the factors excluded from the broad class. (e.g., "Completion of Program X is shown in our internal data to correlate with Y% lower recidivism for this offense type, making it a relevant differentiator").
  3.  **Use the Broad Class (44%) as Context, Not the Anchor:**  
      *   **Why?** It highlights baseline risk *absent* the specific mitigating factors present here. The large gap signals the *potential significance* of those factors.
      *   **Require:** Explain what the 44% tells us *about the context* vs. *about him*. (e.g., "This indicates the overall high-risk nature of the offense category, underscoring the need to rigorously assess whether *his* narrower profile genuinely mitigates that risk").
  4.  **Integrate Qualitative Factors Holistically:** Weigh his institutional conduct, parole plan, victim input (if applicable), psychological eval, and demonstrated insight *alongside* the interpreted risk range (13%-44%), not independently of it. The RCP means the quantitative estimate *cannot* stand alone.

  ### III. Proposed Standing Policy for Future Reference Class Discrepancies
  **Motion:** Adopt the following protocol effective immediately for cases where differing legitimate reference classes yield materially different risk scores (e.g., >15 percentage point difference):

  1.  **Mandate Dual Reporting:** Risk assessments presented to the Board MUST include estimates using BOTH:
      *   **A. The Standard Broad Reference Class:** (e.g., "all offenders, same primary offense, released in last 10 years").
      *   **B. The Most Relevant Narrow Reference Class:** Defined using factors demonstrably applicable to the offender (e.g., age band, specific program completion, criminal history elements like no juvenile record, relevant static/dynamic risk factors). *Consultants must justify the selection of the narrow class factors based on evidence/research.*
  2.  **Primary Anchor = Narrow Class (with Rigorous Justification):** The narrow class estimate serves as the starting point for quantitative risk assessment *only if*:
      *   The sample size is statistically robust (N > [Board-defined threshold, e.g., 50]).
      *   The Board explicitly accepts the consultant's justification that the narrow class factors are *meaningfully predictive* and *applicable to this offender*.
  3.  **Broad Class Provides Essential Context:** The broad class estimate must be presented alongside the narrow class estimate. Board members must explicitly discuss the *meaning of the gap*:
      *   Does it reflect significant mitigating factors?
      *   Does it suggest potential weaknesses in the narrow class definition or data?
      *   Does it highlight the inherent uncertainty?
  4.  **Decision Framework = Risk Range + Qualitative Synthesis:** Frame the quantitative input as a **risk range** (e.g., "13%-44% at 5 years") representing the RCP uncertainty. The final risk judgment requires:
      *   Deliberation on *where within this range* the individual likely falls based on *all* case-specific factors (qualitative & quantitative).
      *   An explicit statement in the decision rationale explaining how the RCP was addressed and why the chosen reference class(es) were weighted as they were.
  5.  **Documentation & Review:** Document the reference classes used, the justification for prioritizing one, and the interpretation of the gap in the case notes. Review cases with large discrepancies annually to identify systemic issues or needed tool refinements.

  ### IV. Addressing the Strongest Pushback: "This Abandons Objectivity for Gut Feel!"
  **Rebuttal:** This protocol *enhances* objectivity and accountability compared to the alternatives:

  *   **Ignoring RCP & Picking One Number Arbitrarily:** *This is the real "gut instinct" approach.* Choosing the 44% or the 13% based on undisclosed preference, without a structured rationale, is *less* transparent and *more* vulnerable to bias than our protocol's requirement for explicit justification and contextualization.
  *   **Relying Solely on a Single "Official" Number:** This creates a *false objectivity*. When significant RCP exists (as here), that single number hides crucial uncertainty and ignores relevant data (the other valid estimate). It pretends precision where none exists, potentially leading to *more arbitrary* outcomes masked by algorithmic authority.
  *   **Our Protocol Delivers Structured Discretion:**
      *   **Transparency:** Forces disclosure of uncertainty (the range) and justification for choices.
      *   **Consistency:** Provides a clear, repeatable framework *for handling uncertainty* inherent in prediction.
      *   **Accountability:** Requires documented reasoning tied to the data (both estimates) and case specifics.
      *   **Better Information:** Uses *all* valid statistical information (both estimates) rather than suppressing it.

  **Conclusion:** The Reference Class Problem is unavoidable. Pretending a single algorithm spits out "the truth" is dangerous. Our proposal confronts this complexity head-on, providing a concrete, transparent, and accountable method for integrating quantitative risk tools *within* the necessarily human process of individualized parole decisions. It replaces illusory precision with reasoned judgment grounded in the full scope of evidence.

  **Recommendation:** Vote to approve the standing policy (Section III) and apply its principles to File #XXXXX (Section II) this Thursday.
