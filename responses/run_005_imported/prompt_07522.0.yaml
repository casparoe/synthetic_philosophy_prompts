  Here's an analysis of **Prolonged Grief Disorder (PGD)** as a contemporary, contested psychiatric classification that vividly demonstrates Hacking's "looping effect," directly addresses your friend's objection, and navigates the "made up vs. found" tension:

  ### **The Classification: Prolonged Grief Disorder (PGD)**
  - **Added to DSM-5-TR (2022)** and ICD-11 (2018) after decades of debate.  
  - **Core criteria**: Intense yearning/longing for the deceased, accompanied by emotional pain (sadness, guilt, anger), preoccupation with the deceased, and functional impairment, persisting **beyond 12 months** (for most adults) after death.  
  - **Controversy**: Critics argue it pathologizes culturally/individually variable grief timelines, risks medicalizing normal suffering, and could be exploited by Pharma.

  ---

  ### **Tracing the Looping Effect**  
  **Phase 1: Classification Reshapes Self-Understanding & Conduct**  
  - **Pre-Diagnosis**: Individuals experiencing persistent grief often described themselves as "stuck," "lost," or "broken," but framed it as a moral/spiritual failing ("I should be stronger") or eternal love ("This is my loyalty").  
  - **Post-Classification Impact**:  
    - **Self-reconstitution**: Clinical language ("I have PGD") replaces self-blame with a medical narrative. Sufferers reinterpret symptoms (e.g., avoiding reminders → "avoidance behavior"; intense dreams → "preoccupation").  
    - **Behavioral shifts**:  
      - *Seeking treatment*: New specialist grief therapies (e.g., Complicated Grief Therapy) are pursued, whereas before, many suffered silently or sought pastoral care.  
      - *Social negotiations*: "I have a grief disorder" justifies workplace leave or declined social events, altering relationships.  
      - *Identity formation*: Online communities emerge (e.g., "PGD Warriors"), sharing strategies framed around DSM criteria ("My 12-month mark is next week—will I meet the diagnosis?").  

  **Phase 2: The "Loop" — How the Classified Reshape the Classification**  
  - **Advocacy & Backlash**:  
    - **Patient-led pushback**: Groups like the **Grief Justice Alliance** protest the 12-month threshold, arguing grief timelines vary by culture, relationship, or circumstance (e.g., traumatic loss). They share testimonials of functional lives despite persistent grief, demanding dimensional assessment.  
    - **Clinical repercussions**: Therapists report patients *rejecting* PGD labels as reductive, forcing clinicians to adjust language ("prolonged grief *response*").  
    - **Institutional pressure**:  
      - Research now emphasizes cultural validity, leading to proposals for **shorter thresholds (6 months) for traumatic grief** (e.g., child loss).  
      - ICD-11 added caveats excluding grief aligned with "cultural or religious norms."  
      - Upcoming DSM revisions face pressure to add **bereavement-specific modifiers** (e.g., "traumatic loss subtype").  

  **Phase 3: Expertise Under Pressure**  
  - Clinicians are compelled to develop **culturally sensitive screening tools** (e.g., distinguishing PGD from Hispanic *añoranza* or Navajo ancestral mourning practices).  
  - Debates intensify about **treatment ethics**: Should we "treat" grief, or support adaptation? This fractures the field into "validators" (focusing on suffering) vs. "critics" (fearing overmedicalization).  

  ---

  ### **Addressing Your Friend's Objection: "Just Learning a New Word?"**  
  Your friend reduces looping to semantic adjustment, but PGD shows **three key distinctions**:  
  1. **Generative Capacity**: The diagnosis doesn’t just rename existing states—it creates **new ways of being**. E.g., framing grief as "symptoms" enables access to disability accommodations, fundamentally altering life trajectories.  
  2. **Institutional Feedback**: Labels like "PGD" mobilize **collective action** (advocacy groups, specialized clinics) that *directly pressure diagnostic manuals*. Rocks don’t lobby the International Mineralogical Association.  
  3. **Path Dependency**: Once classified, treatment protocols (e.g., exposure therapy for "avoidance") reshape behavior in ways that **reinforce the diagnosis** (e.g., patients tracking "symptom reduction" per DSM criteria).  

  **Mere awareness** might change personal behavior; **looping** changes the social, clinical, and epistemic structures surrounding the category itself.  

  ---

  ### **"Made Up" vs. "Found"? A Co-Construction**  
  PGD is **neither purely invented nor simply discovered**:  
  - **Antecedent Reality**: The agony of persistent, disabling grief exists across cultures and history (e.g., Victorian "widow's weeds," Arabic *huzn*).  
  - **"Made Up" Elements**:  
    - The **12-month threshold** is arbitrary; cross-cultural studies show grief duration varies widely.  
    - **Symptom selection** (e.g., "identity confusion") reflects Western individualistic values—not collectivist societies where communal mourning persists for years.  
    - **Medicalization serves power structures**: Insurers require DSM codes for reimbursement, incentivizing expansion of treatable disorders.  

  **Verdict**: PGD is a **real phenomenon sharpened—and distorted—by classification**. The loop begins with raw human suffering ("found"), but the diagnostic machinery molds it into a clinically legible entity that, in turn, alters how suffering is experienced and governed ("made up").  

  ---

  ### **Why This Serves Your Novel**  
  - **Fresh Ground**: PGD’s 2022 inclusion makes it underexplored in literature/art.  
  - **High Stakes**: Embodies tension between validation and reductionism—mirroring your protagonist’s journey.  
  - **Nuanced Looping**: Shows classification as **iterative negotiation** (patients ↔ clinicians ↔ manuals), not top-down labeling.  
  - **Thematic Resonance**: Like your character’s arc, PGD reveals how diagnosis can be simultaneously *liberating* (legitimizing suffering) and *limiting* (imposing new scripts).  

  Use this tension: Your protagonist might resist the "PGD" label after her teenage diagnosis, only to later weaponize it for workplace accommodations—then join activists fighting its criteria. The loop becomes lived experience, not theory.
