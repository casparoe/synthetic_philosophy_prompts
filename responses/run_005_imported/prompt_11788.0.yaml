  Next, discuss the standard approaches. Assuming a fixed noise model (like Boltzmann rationality) or placing a joint prior over reward and rationality. Explain that these methods add structure but don't guarantee identifiability. The key point is that without external data or strong priors, the problem remains underdetermined. 

