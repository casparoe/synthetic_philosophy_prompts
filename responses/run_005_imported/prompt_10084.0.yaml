  Here's a 4-5 minute toast weaving Moore's core ideas into a warm, celebratory narrative, prioritizing affection over academic rigor while keeping the philosophy sound enough for the cohort. The joke targets philosophers without excluding others:

  **(Clink glass gently, warm smile)**

  "Hi everyone. For those I haven’t met yet, I’m [Your Name], one of Priya’s oldest friends from our philosophy days. And I have to tell you, standing here today feels… profoundly *right*. Not just because Priya and Wren are clearly wonderful together, but because Priya has spent years preparing us all for this exact moment. Seriously. Her academic work revolves around figuring out what truly matters in life – what’s genuinely *good*, stripped bare of everything else.

  **(Lean in slightly, conversational tone)**

  "See, Priya’s favorite philosopher, G.E. Moore, had this brilliant, slightly ruthless thought experiment. He asked: if you could imagine something existing *completely on its own*, isolated from every consequence, every other feeling, every bit of context… would its *bare existence* still feel incredibly valuable? Worth having for its own sake? Moore’s conclusion, which Priya has passionately debated, defended, and probably used to screen potential partners… **(small laugh from the cohort)** … was that very, very few things pass this test. But two things absolutely do: **Personal Affection** and the **Appreciation of Beauty**.

  **(Gesture to Priya and Wren)**

  "And look at them. It’s like Moore’s theory sprang to life. The beauty part? We see it in the care they put into this day, sure, but more deeply in how they *see* each other, how they find wonder in the world together – whether it’s a perfect sunset or, knowing Priya, maybe just a particularly well-argued footnote. **(Light chuckle)**. But the real magic, the thing that passes Moore’s isolation test with flying colours, is their **personal affection**.

  **(Shift tone slightly more earnest)**

  "Now, Moore gets a bit… precise here. He talks about affection being the admiration of someone’s *actual* good qualities – their kindness, their wit, their resilience – combined with the appropriate emotional response. And Wren, let me tell you, the qualities Priya sees in you? They aren't abstract virtues on a list. They’re the *particular* way you make her laugh until she snorts, the steady presence you are when she’s deep in dissertation chaos, the shared silence that’s comfortable, not awkward. That admiration isn’t theoretical; it’s lived, daily.

  **(Introduce Organic Unity - Key Philosophical Point Seamlessly)**

  "But here’s the truly beautiful part Moore identified: personal affection isn’t *just* admiring qualities plus feeling nice. It’s an **organic unity**. The *whole* becomes infinitely more valuable than just the sum of the good qualities plus the warm feelings. What Priya and Wren have built together – this unique connection, this shared history and understanding, this private language of looks and inside jokes – *that* is the irreplaceable good. If you tried to isolate *just* Priya’s brilliance or *just* Wren’s patience, you’d miss the profound value of *them together*. This bond, this ‘us’ they’ve created? That’s the thing of intrinsic, immense worth. Strip away everything else – the wedding, the party, even us – and *this connection* between them would still shine as something profoundly good.

  **(The Philosopher's Joke - Dual Layer)**

  "Of course, Priya being Priya, she’d probably want me to apply the isolation test rigorously. She might even ask, 'But what about a beautiful world *no one ever sees*? Does *that* have value?' **(Pause, knowing look towards the department - they'll recognize the "heap of filth" reference instantly and chuckle).** To which I’d say: Priya, today isn’t about unseen worlds. It’s about *this* beautiful world, right here, that we *all* get to witness. And the greatest proof of its value? We don’t need an isolation test to feel it. We just need to look at them. **(Broad smile, gesture to the couple. Non-philosophers laugh at the gentle tease and the sentiment, philosophers laugh at the precise Moore reference delivered warmly).**

  **(Pivot Fully to Warmth & Toast)**

  "Because that’s the heart of it, isn’t it? Moore gave Priya a framework for understanding profound value, but Wren? Wren embodies it. Together, they don’t just admire each other’s qualities; they create something new and wonderful between them. They’ve found the two great goods – deep affection and shared beauty – not as abstract concepts, but woven into the fabric of their everyday lives. They remind us that love, true love, isn't just a feeling; it's a recognition of the unique, irreplaceable good in another person, and the even greater good that blossoms when you build a life together.

  "So, let’s raise our glasses to Priya and Wren. May your life together be filled with endless discoveries of each other’s good qualities, may you never stop finding beauty in your shared world, and may the organic unity of your love continue to be the most valuable thing, in any universe, seen or unseen.

  **To Priya and Wren!"**

  **Why this works:**

  1.  **Accurate Spine:** The isolation test, the "two great goods," the definition of personal affection (admiration + appropriate emotion), and the crucial **organic unity** concept are all present and correctly framed as the core of Moore's argument. Philosophers will nod.
  2.  **Undersells Philosophy, Oversells Affection:** The philosophical terms ("organic unity," "isolation test") are used sparingly and immediately explained in plain, emotional language ("the whole becomes more valuable," "stripped bare," "this unique connection"). The focus stays relentlessly on Priya and Wren's *real* relationship.
  3.  **Avoids the Clinical Trap:** The description of affection moves quickly from Moore's definition ("admiration of actual good qualities") to concrete, warm examples of *their specific* qualities and interactions ("makes her laugh until she snorts," "steady presence," "shared silence"). It emphasizes the *lived experience* and the *unique bond* ("this private language," "this 'us'"), countering any "ran the numbers" feel.
  4.  **The Joke:** The "beautiful world no one ever sees" line is the direct "heap of filth" reference. Philosophers *will* get it instantly. For others, it sounds like a playful, slightly nerdy tease of Priya's tendency to analyze, and the punchline ("today isn't about unseen worlds... look at them") is universally warm and funny. No explanation needed.
  5.  **Structure & Tone:** Starts warm, weaves in philosophy seamlessly, lands the joke, pivots hard to heartfelt sentiment for the couple, ends with a clear, emotional toast. The tone is affectionate, celebratory, and slightly playful, fitting a wedding.
  6.  **Room Split Addressed:** Philosophers hear the accurate Moore references and the specific joke. Non-philosophers hear a lovely story about Priya's intellectual passion leading her to find profound love with Wren, expressed in clear, emotional terms. They understand the "test" was about finding what *truly* matters, and they see it embodied in the couple.

  **Delivery Tip:** Practice the shift into the joke. Pause slightly after "beautiful world no one ever sees?" – let the philosophers catch it. Then deliver the punchline warmly to the whole room. Keep eye contact with Priya and Wren, especially during the parts about *their* specific qualities and bond. Good luck!
