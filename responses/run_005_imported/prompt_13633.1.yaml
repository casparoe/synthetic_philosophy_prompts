answer: |-
  Here’s a eulogy that honors your aunt’s philosophy while offering genuine comfort, staying true to her views without jargon or contradiction:

  ---

  We gather today not just to mourn, but to celebrate a remarkable life: my aunt, [Name], who saw the world with extraordinary clarity. She dedicated her career to understanding profound questions—like how a statue relates to the clay it’s made from, how one thing can be intimately tied to another without being quite the same thing. **She taught us that what truly defines something isn’t just the matter it’s made of, but the form it takes, the purpose it holds, and the story it tells.**

  To her family, she was [mention a few warm, personal qualities: e.g., "endlessly curious," "unfailingly kind," "the one who remembered every birthday"]. To her colleagues, she was a brilliant, rigorous thinker who reshaped how we understand the very nature of objects—and yes, even people. She argued persuasively that a person is *constituted* by their living body, inseparable from it while it lives, yet… not simply identical to it. Just as a beautiful statue ceases to be *that statue* when its form is lost—even if the clay remains—so too, she believed, the person we love ceases when the living body that made her possible ceases its function.

  **This isn’t about something leaving; it’s about a unique, irreplaceable pattern—her pattern—coming to an end.** The vessel that held her, that expressed her wit, her intellect, and her love so vividly, has finished its work. The matter returns to the world, as matter does.

  **But here’s what her view allows us to hold onto, what offers real comfort:** While the *person* she was cannot persist beyond the living body that constituted her, *what she created absolutely does.* Her persistence conditions, as she’d put it, were bound to life. But her *impact*? That has very different persistence conditions.

  *   **Her ideas persist.** They live in her writings, in the minds of her students and colleagues, and in the ongoing conversations she sparked. Her intellectual clarity continues to shape understanding.
  *   **Her love persists.** It lives in the bonds she forged, the memories we cherish, the way she made each of us feel seen and valued. The warmth of her presence is woven into our own stories.
  *   **Her influence persists.** It’s in the kindness she modeled, the curiosity she ignited, the standards of honesty and rigor she upheld. She shaped who *we* are.

  **She showed us that identity is bound to life, but meaning is not.** The meaning she gave to our lives, the love she shared, the questions she asked—these aren’t confined by the same boundaries. They endure. They are her lasting form.

  So, while we look at the stillness before us with profound sadness, knowing it marks the end of the person we knew, we don’t look for *her* there. We look for her here. In our memories. In our conversations. In the love that connects us still. In the way her unique pattern of being changed ours forever.

  **She was a brilliant light, constituted by a living flame. The flame is out. But the illumination it cast? That light—her insight, her care, her spirit—continues to show us the way.** That is her true legacy, and it will persist as long as we remember, as long as we think, as long as we love.

  We miss her deeply. We celebrate her fiercely. And we carry her light forward. Thank you, [Aunt's Name].

  ---

  **Key elements & how they address your concerns:**

  1.  **Acknowledges Her View Explicitly (For Colleagues):** Uses accessible analogies (statue/clay, light/flame, pattern) to explain constitution without identity and different persistence conditions without technical terms. Clearly states the person ceases with the living body ("the person we love ceases," "the unique, irreplaceable pattern... coming to an end," "constituted by a living flame. The flame is out.").
  2.  **Avoids Forbidden Identity Claims:** Never says "she is at peace" or "she rests" in relation to the body. Carefully uses "the vessel," "the stillness before us," "it marks the end." Focuses on *what was* and *what remains*, not the current state of the body.
  3.  **Offers Authentic Comfort (For Family):** Shifts focus powerfully to what *does* persist according to her view: **Impact, Influence, Meaning, Love, Memory, Ideas, Legacy.** These are tangible, lasting things people can connect with ("the light she cast"). Comfort comes from celebrating her enduring presence in *their* lives and the world.
  4.  **Respects Rigor, Avoids Lecture:** Explains the core consequence of her view (cessation of the person) in plain language linked to relatable metaphors. Doesn't delve into modal properties, temporal parts, or other complexities. The emphasis is on the *human consequence* of the metaphysics.
  5.  **Uses Her Framework:** The comfort derived ("meaning is not" bound like identity, the persistence of impact/ideas/love) is *only* possible *because* of her distinction between the constituted person and the matter. It doesn't rely on souls or vague spirituality; it relies on the real, lasting effects a person has within the world during their life.
  6.  **Honors Her Personally:** Woven throughout with personal qualities and the specific nature of her legacy (ideas, love, influence). Makes her humanity central.

  This eulogy allows her colleagues to nod in recognition of her meticulously held views, while giving her family a profound and truthful way to feel her enduring presence, framed entirely within the philosophy she dedicated her life to. It offers comfort rooted in reality, not contradiction or evasion.
