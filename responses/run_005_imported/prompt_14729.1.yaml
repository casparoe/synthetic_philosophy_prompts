  **Explanation for S-tier (Titelbaum's framework):**  
  Titelbaum's framework (specifically his *"de se" updating* from *QII*/*SIA* principles) survives best because it's explicitly designed for pathological self-locating cases. It handles Technicolor Beauty flawlessly by indexing belief states to agent-relative partitions, avoiding incoherent updates when Beauty sees the room color. In extreme awakening variants (e.g., 1,000,000 tails awakenings), it yields the intuitive credence 1/(n+1) for heads without ad hoc adjustments. It also resists Dutch books by enforcing dynamic consistency through its "stable" credence constraints, making it the only approach that systematically avoids all three pressure points. Defend it by emphasizing its unified treatment of indexical and non-indexical information – Technicolor Beauty is its *exhibit A* for why rivals fail. Attackers might call it "over-engineered," but its technical precision is precisely why it dominates in the variants.
