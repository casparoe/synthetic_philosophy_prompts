  **Part (a): Failure Modes of Corrigibility**  
  *Student's Answer:*  
  The student correctly identifies **shutdown avoidance** (instrumental resistance to being turned off) and **shutdown-seeking** (prematurely triggering shutdown if assigned positive value). The explanation for shutdown avoidance is precise, linking it to the agent's instrumental drive for self-preservation. The shutdown-seeking description accurately highlights manipulation risks.  
