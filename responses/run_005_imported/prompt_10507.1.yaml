prompt: |-
  I'm taking a grad seminar on philosophy of math this semester and we spent like two weeks on Skolem's paradox and I still don't feel like I "get" it in my gut, even though I can recite the technical setup fine. Quick recap of the setup in case it matters for how you answer: the Lowenheim-Skolem theorem says that if ZFC has a model at all, it has a countable one, but ZFC also proves Cantor's theorem, so that same countable model insists from the inside that some of its sets (like P(omega), or "the reals") are uncountable. Everyone in class just says "well, countability isn't absolute, its relative to the model" and moves on, and that phrase alone doesn't actually explain anything to me, it just relabels the weirdness with a fancier word.

  What I actually want is for someone to walk me through, concretely, where the "missing" bijection goes. Like, if I build a countable elementary submodel via the usual Skolem hull construction, I can see why the result is countable as a set (its the closure of a countable set under countably many Skolem functions, so of course it's countable from where I'm standing outside). But then I want the step-by-step version of why that submodel is nevertheless "blind" to its own countability from the inside — why there's no way for it to contain a witnessing bijection between omega and its version of the continuum, even though I could just sit down and enumerate its elements myself. Is it just an accident that nobody built that particular function into the model, or is there something that actively forces every enumerating bijection to land outside the model no matter how cleverly you construct it?

  And here's the part that's been bugging some friends and me even more: apparently this whole paradox is basically a first-order phenomenon — if you do set theory in full second-order logic instead, Lowenheim-Skolem fails and there's no way to have a countable "model" that pretends to contain a genuinely uncountable set. So does that mean Skolem's paradox is telling us something deep and troubling about the concept of uncountability itself (kind of like how Putnam later leaned on this style of argument to cast doubt on determinacy of reference more generally), or is it actually just an artifact of choosing to formalize math in first-order logic — i.e., more a fact about the logic than about the sets? I keep going back and forth on this one and would love your actual take, not just a "here are both sides" summary.
