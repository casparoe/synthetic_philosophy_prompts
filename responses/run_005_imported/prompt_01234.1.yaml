answer: |-
  You've identified a profound limitation in interpreting Harsanyi's theorem as a foundation for utilitarianism. The core issue lies precisely in the **ex ante Pareto principle's blindness to ex post fairness and the distribution of risk**, leading to the planner's indifference between fundamentally different social states like lotteries and deterministic assignments when expected utilities are equal. This is not a mere technicality; it undermines key ethical intuitions utilitarianism aims to capture. Here's why:

  1.  **Indifference to Fairness in Process:**
      *   **The Scenario:** Two equally deserving claimants (A & B) for one indivisible good (e.g., a life-saving treatment). Option (a) is a fair lottery (50% chance each). Option (b) is giving the good outright to A (or B).
      *   **Ex Ante Equality:** *Ex ante*, both options yield identical expected utilities for A and B. Under Harsanyi's ex ante Pareto principle, the planner *must* be indifferent between (a) and (b).
      *   **Ex Post Inequality:** *Ex post*, the outcomes are starkly different:
          *   **Lottery (a):** Outcome is fair (each had an equal chance) but unequal (one gets the good, one doesn't).
          *   **Deterministic (b):** Outcome is both unfair *and* unequal (one is arbitrarily favored from the start, the other has no chance).
      *   **The Problem:** A core ethical intuition, often shared by utilitarians, is that *procedural fairness matters*. Giving both an equal chance (the lottery) is morally preferable to arbitrarily favoring one individual, *even if* the expected utility sums are identical beforehand. Harsanyi's planner, constrained only by ex ante Pareto, cannot distinguish between these options. This indifference violates the utilitarian impulse to maximize *actual* well-being in a way that respects fairness and impartiality in the *process* leading to outcomes. Utilitarianism cares about *who* suffers the deprivation, not just the statistical expectation.

  2.  **Indifference to the Distribution of Risk:**
      *   **The Risk:** Both options involve risk for the individuals. However, the *nature* of the risk differs fundamentally:
          *   **Lottery (a):** The risk is *symmetrically distributed*. Both individuals face identical, independent risks (50% chance of getting nothing).
          *   **Deterministic (b):** The risk is *asymmetrically distributed*. Individual A faces *no risk* (guaranteed the good), while individual B faces *certain deprivation* (100% chance of getting nothing).
      *   **The Problem:** Harsanyi's theorem treats these risk distributions as equivalent because the *ex ante expected utilities* are identical. However, a utilitarian concerned with the *actual* distribution of welfare and the burdens individuals bear might see a significant moral difference. The deterministic assignment imposes the *entire burden of uncertainty and loss* onto one specific individual, while the lottery spreads this burden equally. Utilitarianism, aiming to minimize suffering and maximize happiness, should arguably prefer the distribution that minimizes the *maximum burden* or shares burdens more equally, even if the mathematical expectation is the same. The ex ante Pareto principle ignores this distributional aspect of risk.

  3.  **Conflict with Ex Post Utilitarian Judgments:**
      *   **Ex Post Evaluation:** A utilitarian evaluating the outcomes *after* the fact would clearly see a difference:
          *   After the **lottery (a)**, while one person is deprived, the process was impartial. The outcome inequality stems from chance, not systemic bias.
          *   After the **deterministic assignment (b)**, the deprivation is the result of an arbitrary decision by the planner. This introduces an element of injustice and unfair treatment that wasn't present in the lottery scenario.
      *   **The Problem:** Harsanyi's planner, guided *only* by ex ante Pareto and the aggregation theorem, is forced to be indifferent *ex ante* between options that lead to social states a utilitarian would judge differently *ex post*. The theorem divorces the social welfare function from the ethical evaluation of the *realized outcomes* and the *fairness of the process* that led to them. True utilitarianism cares about the *actual* sum of happiness/welfare realized, not just the expectation calculated before uncertainty is resolved. The ex ante perspective obscures the inherent unfairness built into option (b).

  **Why this is a Genuine Problem, Not a Technicality:**

  *   **Core Utilitarian Values Undermined:** The indifference demonstrates that the Harsanyi planner, while producing a weighted sum of utilities, fails to capture fundamental utilitarian concerns: impartiality, fairness in process, the distribution of burdens (including risk), and the evaluation of actual outcomes. Utilitarianism is ultimately concerned with maximizing *realized* welfare in a just manner. Harsanyi's framework, constrained by ex ante Pareto, allows for social choices that systematically ignore procedural justice and the ex post distribution of welfare resulting from risk allocation.
  *   **The "Utility" is Thin:** The theorem treats individual utilities as given, preference-based constructs satisfying the EU axioms. However, these utilities, defined over lotteries, inherently incorporate individuals' *attitudes towards risk* (risk aversion, risk neutrality, risk seeking). The "affine sum" aggregates these risk attitudes along with preferences over outcomes. A utilitarian ethicist might argue that social welfare should be based on a concept of well-being *distinct* from individuals' subjective risk preferences. The indifference in the lottery case highlights how the aggregation is sensitive to these risk attitudes in a way that may not align with utilitarian ideals of fairness and impartial distribution.
  *   **Masking Arbitrary Power:** The indifference legitimizes the planner's ability to make arbitrary, deterministic assignments (favoring A over B for no reason) whenever a lottery would yield the same ex ante expected utilities. This grants the planner a power that seems fundamentally at odds with the utilitarian ideal of impartiality and equal consideration of interests. The lottery is the mechanism that operationalizes impartiality when goods are indivisible; indifference to using it undermines that principle.

  **Conclusion:**

  Harsanyi's theorem is a powerful result showing that ex ante Pareto optimality under uncertainty, combined with EU rationality, implies a linear aggregation of individual utilities. However, its reliance *solely* on the **ex ante** perspective renders it inadequate as a foundation for utilitarianism. The mandated indifference between a fair lottery and an arbitrary deterministic assignment when ex ante expected utilities are equal exposes this inadequacy starkly. This indifference signifies a failure to account for procedural fairness, the distribution of risk burdens, and the ethical evaluation of realized outcomes – all concerns central to utilitarian ethics. The theorem provides a decision rule for a planner under uncertainty, but it does not guarantee that this rule aligns with the substantive moral goals of maximizing actual well-being justly and impartially. The "utilitarianism" vindicated by Harsanyi is a thin, expectation-based version that can sanction unfair procedures and distributions of risk, making it a problematic basis for the richer ethical doctrine.
