  - Then: Argument 5 (fractional Kelly) because it reflects real-world practice and shows that full Kelly isn't practically optimal due to risk.

  - Then: Argument 6 (only for casino games) because it correctly identifies limitations in the model's assumptions.

  - Then: Argument 2 (ergodicity) because while it's an interesting perspective, it has been criticized and might not be as universally applicable as claimed.

  - Least convincing: Argument 4 (bargaining-style) because it's more of a metaphor and less rigorous.

  So the order: 3, 1, 5, 6, 2, 4.

