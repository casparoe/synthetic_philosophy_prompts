  - **#1 (Long-run dominance)** is second because it's a proven mathematical property (via the law of large numbers) for repeated bets with known odds. Its weakness (dependence on infinite trials) is acknowledged but doesn’t invalidate the core result.

  - **#5 (Fractional-Kelly argument)** is third because it reflects real-world practice: full Kelly is rarely used due to catastrophic risk sensitivity, which even Kelly proponents admit. This empirically undermines full Kelly as a practical "rational" target.

  - **#6 (Only works for casino games)** is fourth because it accurately highlights Kelly’s fragility—its assumptions (known probabilities, repeated bets) rarely hold outside gambling, making it inapplicable to most real-world decisions.

  - **#2 (Ergodicity argument)** is fifth because it misapplies statistical mechanics to decision theory. The core claim (that expected value is invalid for time-series outcomes) is disputed and often conflates mathematical nuances. It’s more provocative than proven.

  - **#4 (Bargaining-style framing)** is least convincing because it relies on metaphorical reasoning ("bargaining between timelines") without rigorous justification. It’s an interesting intuition pump but doesn’t hold up as a derivation of geometric rationality.
