  I should emphasize how the non-rivalry point does distinct normative work: where land appropriation harms others by exclusion, idea-sharing benefits all. That's why Jefferson calls free spread "benevolently designed." This moral dimension separates ideas from physical objects more profoundly than the general "no natural property" thesis alone could.

  The user's dissertation will be stronger if they show how Jefferson anticipates modern debates about rivalrousness in IP theory. They might contrast his view with Locke's labor theory - Jefferson rejects the notion that mixing labor with ideas creates natural rights. And they should acknowledge the tension in the concession but argue it reflects Jefferson's pragmatic legal realism about what legislatures can do versus what philosophers should recognize as natural.
