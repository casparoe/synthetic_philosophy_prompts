  I notice two main tensions they're trying to resolve: first, whether the "idea-specific" properties Jefferson describes (non-rivalry, expansibility) do any real argumentative work beyond the general "no natural property" claim; second, whether Jefferson's pragmatic concession about societal grants of monopoly contradicts his special treatment of ideas. The user seems frustrated by how these elements fit together - they're using words like "snag" and "stuck," and their tone suggests they suspect Jefferson might be inconsistent.

  Hmm... let me reconstruct Jefferson's logic step by step. The general argument does heavy lifting by denying any pre-social property rights - that's foundational. But the idea-specific properties aren't redundant; they serve two crucial functions: (1) explaining why ideas resist propertization even more fundamentally than physical objects, and (2) providing normative reasons against treating them as property. The fire/air metaphors aren't just poetic - they're ontological claims about ideas' behavior in the world.

  The user's second concern is sharper. Jefferson does seem to walk a tightrope: he calls ideas "incapable of confinement" but then approves society "confining" profits from them. But there's consistency here if we see the concession as purely utilitarian - society isn't recognizing natural rights but creating artificial incentives. The key is that for Jefferson, the monopoly isn't over ideas themselves but over profits from their application. 

