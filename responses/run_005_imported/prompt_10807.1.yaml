  The situation you describe is a well-known paradox in voting theory, often called the "spoiler effect" or a failure of the **Independence of Irrelevant Alternatives (IIA)**. IIA states that the relative ranking between two candidates should not change if a third candidate is added or removed, provided voters' preferences between the original two remain unchanged. Your voting method (a variation of the Borda count) is susceptible to this issue, and the arithmetic is likely correct—no rigging or error is needed for this reversal to occur.

  ### Why This Happened:
  - **Voter preferences are interdependent**: The points assigned to X and Y depend not just on direct comparisons but on how voters rank _all_ candidates. When Z (a "spoiler") is removed, the redistribution of points on ballots where Z was ranked can alter the outcome between X and Y.
  - **Example scenario**: Suppose the committee's ballots were:
    - 2 ballots: X > Y > Z  
      (X: 2 pts, Y: 1 pt, Z: 0 pts)
    - 2 ballots: Y > X > Z  
      (Y: 2 pts, X: 1 pt, Z: 0 pts)
    - 1 ballot: Z > Y > X  
      (Z: 2 pts, Y: 1 pt, X: 0 pts)
    
    Initial totals:  
    - X: (2×2) + (2×1) + (1×0) = 4 + 2 + 0 = **6**  
    - Y: (2×1) + (2×2) + (1×1) = 2 + 4 + 1 = **7**  
    - Z: (1×2) = **2** → Z withdraws.  

    After removing Z, the ballots become:  
    - 2 ballots: X > Y → X: 2, Y: 1  
    - 2 ballots: Y > X → Y: 2, X: 1  
    - 1 ballot: Y > X → Y: 2, X: 1 (originally Z>Y>X becomes Y>X)  

    New totals:  
    - X: (2×2) + (3×1) = 4 + 3 = **7**  
    - Y: (2×1) + (3×2) = 2 + 6 = **8**  
    Y now wins, even though no one changed their view of X vs. Y. The removal of Z shifted points because the last ballot’s support for Y increased (from 1 to 2 points) when Z was removed.

  ### Can This Be Avoided?
  No voting system is immune to all paradoxes (Arrow's Impossibility Theorem proves this), but some methods are less prone to IIA failures:
  1. **Condorcet method**:  
     - Compares candidates head-to-head. The candidate who beats all others in pairwise comparisons wins.  
     - In your case, this would directly reveal whether X or Y is preferred in a one-on-one matchup.  
     - *Drawback*: Can produce cycles (e.g., X>Y, Y>Z, Z>X), requiring tie-breakers.

  2. **Instant-runoff voting (IRV)**:  
     - Voters rank all candidates. The candidate with the fewest first-place votes is eliminated, and votes redistribute until one has a majority.  
     - *Advantage*: Less susceptible to spoilers than Borda.  
     - *Drawback*: Still vulnerable to IIA in some cases.

  3. **Approval voting**:  
     - Voters approve of as many candidates as they like. The candidate with the most approvals wins.  
     - *Advantage*: Simple and avoids ranking paradoxes.  
     - *Drawback*: Doesn’t capture nuanced preferences.

  ### Recommendations for Your Committee:
  - **Resolve the current impasse fairly**:  
    Since preferences between X and Y haven’t changed, hold a new vote **only between X and Y** using a simple majority (each member casts one vote). This directly measures who the group prefers head-to-head and avoids artifacts of the initial system.  
    - If members’ preferences are known from the original ballots (e.g., how they ranked X vs. Y), you could use this to declare a winner without revoting. For example, if 3 members ranked Y>X and 2 ranked X>Y, Y wins.

  - **Future-proof your process**:  
    - Use a **head-to-head majority vote** for the final decision between two candidates.  
    - For multiple candidates, consider **Condorcet** or **IRV** to minimize IIA issues.  
    - Avoid Borda-type systems when candidates might withdraw, as they amplify sensitivity to irrelevant alternatives.

  This reversal is not a flaw in your execution but a mathematical property of the voting system. It reflects how group preferences can be logically inconsistent when aggregated, not dishonesty or carelessness. Moving to a head-to-head vote between X and Y is the most transparent next step.
