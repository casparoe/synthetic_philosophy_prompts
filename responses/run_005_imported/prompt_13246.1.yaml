answer: |-
  Your situation beautifully illustrates the core challenge of caregiving equity: comparing fundamentally different types of burdens across subjective experiences. While there's no universal conversion rate between logistical and emotional strain, fairness *is* possible. Here's a framework rooted in equity theory and practical compromise:

  **Core Principles for a Legitimate Solution:**

  1.  **Acknowledge Both Burdens as Valid & Incommensurable:** Stop trying to "prove" one burden is heavier. Accept that:
      *   Your logistical cost (lost income, career risk, stress from coverage) is real and quantifiable in missed shifts/dollars.
      *   Her emotional cost (drain, potential burnout, mental health impact) is real, even if only she feels its intensity.
      *   Neither cancels the other out. Both require accommodation.

  2.  **Focus on Equity, Not Equality:** Equity means fairness based on individual circumstances, not identical hours. The goal is a split where *each feels the *relative* sacrifice is comparable*, not that the *absolute* hours or feelings are the same.

  3.  **Shift from "Hours" to "Tasks & Impact":** Instead of raw time, break care into specific tasks and assess their *primary* burden type:
      *   **High Logistical Burden (Likely Your Bigger Strain):**
          *   Appointments during your core work hours.
          *   Tasks requiring significant time blocks conflicting with inflexible work.
          *   Middle-of-the-night emergencies needing coverage (if applicable).
      *   **High Emotional Burden (Likely Her Bigger Strain):**
          *   Personal care (bathing, toileting).
          *   Managing difficult behaviors (confusion, anger, sadness).
          *   Constant companionship/supervision requiring high engagement.
          *   Handling complex medical discussions/decisions.
      *   **Mixed Burden:** Cooking, light housekeeping, medication management (logistical setup, emotional delivery).

  **Practical Strategies to Achieve Fairness:**

  1.  **Task Specialization (Play to Strengths/Reduce Weaknesses):**
      *   You take primary responsibility for tasks heavy on *logistics* that align *better* with your constraints: Managing finances, insurance paperwork, scheduling/researching services, coordinating medical appointments (perhaps handling the phone calls/insurance, even if she attends), tackling home modifications.
      *   She takes primary responsibility for tasks heavy on *emotional labor*: Daily personal care routines, companionship during emotionally vulnerable times, managing difficult mood episodes.
      *   Split mixed-burden tasks based on availability *and* tolerance: Maybe you cook weekend meals (when time is easier), she handles weekday meals. You handle medication setup Sunday night, she does daily dispensing.

  2.  **Weighted Hours System (Acknowledge Intensity):**
      *   **Develop a Simple Burden Scale (1-3):** Agree *together* on a burden rating for *each common task type*.
          *   *Example:* Bathing = 3 (High Emotional), Doctor Appointment = 2 (Mixed: Logistical setup, Emotional during visit), Grocery Shopping = 1 (Mostly Logistical).
      *   **Track "Burden Points," Not Just Hours:** Calculate weekly "points" based on tasks performed. Aim for rough parity in *points*, not hours. This explicitly values the *type* of effort.

  3.  **Compensate for the Imbalance:**
      *   **Financial Compensation (If Feasible):** Since your time directly costs income, if she takes significantly *more* hours (especially high-emotional ones), consider paying her a modest amount per hour from your income. This acknowledges the tangible cost to you *and* values her emotional labor. Frame it as "buying back" hours you literally cannot afford to lose.
      *   **Non-Financial Compensation:** What can *you* take off *her* plate that she finds draining but you find less so? Can you handle *all* the bill paying, house maintenance calls, or research into support programs? Can you guarantee her a specific, uninterrupted weekend day off every week?
      *   **Invest in Respite for Her:** Pool resources (even minimally) for occasional respite *specifically for her* – a cleaner for 2 hours, a sitter so she can have an afternoon out. This directly targets her primary burden.

  4.  **Prioritize "Costly Time" for You:**
      *   She covers care during your *most critical* work hours/shifts. Your contribution focuses on evenings, weekends, or tasks you can do remotely/asynchronously (like paperwork).
      *   This minimizes your *highest-cost* hours (missed shifts) and leverages her greater flexibility.

  5.  **Incorporate "Free Time" Differently:** Instead of splitting hours proportionally to free time, agree on a minimum amount of protected "recharge time" *each* of you needs weekly to function. Design the schedule to protect that core recharge time for both, even if the *total* hours aren't equal.

  6.  **Transparent Communication & Iteration (Crucial):**
      *   **Schedule Regular Check-ins (Weekly/Bi-weekly):** Not to argue, but to ask: "How are you *feeling* about the balance this week? Where did you feel most stretched? What one thing would make next week feel more manageable for you?"
      *   **Focus on "I feel" Statements:** "I felt really anxious scrambling to cover my shift Tuesday," vs. "You don't understand my job pressure." "I felt completely drained after bath time yesterday," vs. "You think your job is hard, try this."
      *   **Validate First:** "I hear that those afternoon visits are really wiping you out emotionally, that sounds incredibly hard." "I understand that missing that meeting caused real stress with your boss." *Then* discuss adjustments.
      *   **Be Willing to Rebalance:** Accept that the "fair" split will need tweaking as your mother's needs change, work demands shift, or emotional reserves deplete.

  **Addressing the "Unverifiable Experience" Problem:**

  *   **Trust is the Foundation:** You've stated you trust each other's honesty. Lean into that. Assume the reported strain is genuine.
  *   **Focus on Observable Needs & Outcomes:** Instead of debating internal feelings, focus on external signs: Is her patience shorter? Are you missing more work deadlines? These are proxies for strain that can guide adjustments.
  *   **The "Fair Enough" Standard:** Strive for a solution where both can honestly say, "This is hard, and the sacrifices aren't identical, but I feel my burden is seen and respected, and the overall arrangement is the best *fair* compromise we can manage right now." Absolute parity is impossible; mutual respect and shared sacrifice are the goals.

  **Key Takeaway:** You are **not** stuck. Legitimacy comes from **deliberately structuring the arrangement to acknowledge and accommodate both types of burden through task specialization, weighted systems, compensation mechanisms, protecting critical time, and ongoing compassionate communication.** It requires moving beyond simply counting hours and embracing the messy reality of differing costs. The solution won't be perfectly quantifiable, but it can be profoundly fair through mutual understanding and flexible adaptation. Start with the task list and burden ratings – making the invisible (emotional labor) visible is the first step towards equity.
