  ### What is Actually Happening?
  1. **Condorcet Cycle in Pairwise Comparisons**:
     - The head-to-head results show that The Salt House (SH) beats Orchard Light (OL), OL beats A Quiet Defection (QD), and QD beats SH. This forms a cycle (SH > OL > QD > SH), meaning no novel is preferred by a majority to every other in all pairwise matchups. This is a classic Condorcet paradox, which arises when individual preferences are transitive (each judge has a clear ranking), but the collective preference is intransitive due to conflicting majorities.
     - The cycle indicates that the jury's aggregated preferences lack a Condorcet winner—a candidate that would win all head-to-head matchups. This is not uncommon with ranked voting systems when preferences are evenly divided or have specific patterns.

  2. **Reversal When Removing an Irrelevant Alternative**:
     - After setting aside The Cartographer's Wife (CW), the relative standings of SH, OL, and QD reversed completely, even though no judge changed their rankings of these three. This demonstrates a violation of the independence of irrelevant alternatives (IIA), a principle stating that the ranking between two options should not depend on the presence of a third, irrelevant option.
     - This reversal is a known flaw of the Borda count method (or similar points-based systems). In Borda count, points are assigned based on rank position (e.g., 3 points for 1st, 2 for 2nd, 1 for 3rd, 0 for 4th with four candidates). The removal of CW changes the "scale" of points and can alter the relative scores of the remaining candidates, especially if CW was ranked inconsistently across ballots (e.g., sometimes high, sometimes low). For instance:
       - If CW was often ranked below SH but above QD, SH's Borda score might drop more than QD's when CW is removed, causing a reversal.
     - This behavior highlights that Borda count is sensitive to the addition or removal of candidates, making it vulnerable to strategic nomination or "spoiler" effects.

