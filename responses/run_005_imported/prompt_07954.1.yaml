  First, I should note Bentham *did* write privately about this (in manuscripts like "Offences Against One’s Self"), but never published it. The user’s fictional pamphlet is a bold "what if." So authenticity hinges on mirroring his style: relentlessly logical, data-hungry, and dismissive of moralizing. 

  Key angles he’d likely stress: 
