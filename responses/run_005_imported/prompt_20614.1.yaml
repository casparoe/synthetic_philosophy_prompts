prompt: |-
  So I keep having this same argument with a friend from my meetup and neither of us ever manages to actually resolve it, which bugs me bc at this point we're basically just lobbing our respective camp's talking points past each other. Background: there's this whole "coherence arguments" thing that comes up a lot in AI safety discourse -- the idea, I think Yudkowsky's "Coherent decisions imply consistent utilities" post is the cleanest version of it, that any agent whose preferences violate stuff like transitivity or completeness can be money-pumped out of resources, so anything smart enough to notice and fix that will end up behaving *as if* it's maximizing some expected utility function over outcomes. Which is a big part of why people expect sufficiently advanced/optimized AI to look "goal-directed" and worry about instrumental convergence -- self-preservation, resource acquisition, resisting shutdown, all that. My friend's counter is basically the Rohin-Shah-shaped objection: literally any behavior can be redescribed as EU-maximization if you're allowed to gerrymander the utility function enough (like one defined directly over entire action-histories), so the theorem doesn't actually predict or rule out anything interesting about whether a given system ends up goal-directed in the scary sense people worry about. I tried to bring in the incomplete-preferences angle -- something about how an agent that chooses "resolutely" can have incomplete preferences and still dodge the standard money pumps, which I vaguely remember weakens the arguement even further -- and that's about when we both admitted we were out of our depth and went to go get another beer instead.

  Could you write me a dialogue between two people who both actually know this stuff cold and hash it out properly? One of them should be making the strongest available case that coherence/money-pump arguments really do give us good reason to expect optimized agents -- including future AI systems -- to be well-modeled as stable expected-utility-maximizers with something like fixed goals. The other should be making the strongest available case that this whole line of argument is much weaker than people treat it as, and doesn't license the conclusions that get drawn from it in AI safety discussions. I want actual back-and-forth: each of them should be responding to the specific last thing the other one said (the gerrymandered-utility-function move, what money-pumps do and don't establish about stability of goals over time, the incomplete-preferences/resolute-choice stuff, whatever else seems relevant) rather than both just restating their opening position at each other, and neither one should obviously be winning on vibes alone -- I want to come away still genuinely unsure who's got the better of it.
