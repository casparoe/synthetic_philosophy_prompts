  Hart's point about retroactivity is honest but problematic. Applying it would mean the court admits that the old laws were valid, which could validate the Nazi legal framework. In a society rebuilding its justice system, that might send the wrong message. Fuller's approach allows the court to reject Nazi laws entirely, reinforcing that true law must adhere to moral principles. This seems more aligned with the need for moral reconstruction post-atrocity.

