answer: |-
  Here’s a sharpened version of your objection, framed as a decisive challenge to Yablo’s solution to causal exclusion. I’ll structure it as a *reductio* against the sufficiency of proportionality alone, targeting the core claim that proportionality neutrally resolves exclusion worries:

  ### The Grain-Relativity *Reductio* Against Yabloan Proportionality
  1.  **Yablo's Core Claim**: A property \(C\) is causally efficacious for effect \(E\) iff \(C\) is *proportional* to \(E\):  
      (i) **Required**: No coarser property than \(C\) guarantees \(E\) (necessity condition).  
      (ii) **Enough**: No finer property than \(C\) adds anything relevant to bringing about \(E\) (sufficiency condition).  
      Proportionality screens off non-proportional properties (e.g., scarlet screens off red for Sophie’s peck).

  2.  **Symmetry Premise**: Proportionality is *purely relational* between cause-property and effect-specification. There is no *intrinsic* privilege granted to mental properties or physical realizers by the proportionality criterion itself. The "winning" property depends entirely on the grain of the effect description \(E\).

  3.  **The Gerrymandering Lemma**: For *any* putative mental cause \(M\) (e.g., pain) and its physical realizer \(P\) (e.g., C-fiber firing), one can *always* construct *two distinct effect specifications*:  
      - \(E_{\text{coarse}}\) (e.g., "withdrawal reflex"): \(M\) satisfies proportionality:  
        (i) *Required*: Coarser properties (e.g., "neural activity") don’t guarantee withdrawal.  
        (ii) *Enough*: Finer properties (e.g., \(P\)) add nothing relevant to withdrawal *qua* withdrawal.  
        \(P\) is screened off.  
      - \(E_{\text{fine}}\) (e.g., "precise 450ms latency of motor neuron cluster X’s firing pattern"): \(P\) satisfies proportionality:  
        (i) *Required*: Coarser properties (e.g., \(M\)) don’t guarantee *this exact* neural pattern (due to multiple realizability).  
        (ii) *Enough*: Finer properties (e.g., "C-fiber firing at 40Hz with glutamate spike Y") add nothing beyond \(P\) for *this specific* effect.  
        \(M\) is screened off.  

  4.  **The Dilemma for Yablo**:  
      - **Option 1**: Accept both \(E_{\text{coarse}}\) and \(E_{\text{fine}}\) as legitimate causal relata.  
        *Consequence*: Proportionality delivers contradictory verdicts: \(M\) causes withdrawal but not the neural pattern realizing it, while \(P\) causes the neural pattern but not the withdrawal. This violates the *causal closure of the physical* (the neural pattern *is* the physical realization of the withdrawal) and suggests systematic *causal preemption* between \(M\) and \(P\). Kim’s exclusion problem resurfaces at the level of effect specification.  
      - **Option 2**: Deny the legitimacy of either \(E_{\text{coarse}}\) or \(E_{\text{fine}}\).  
        *Challenge*: On what *principled, non-question-begging basis*? Yablo’s proportionality apparatus *itself* provides no resources to privilege one grain of effect description over another. Any stipulation (e.g., "effects must be functional/macro") either:  
        (a) **Smuggles in dualism** (if macro-effects are irreducibly non-physical), or  
        (b) **Presupposes the solution** (by defining "relevant effects" as those proportional to mental properties), or  
        (c) **Collapses into physics-fundamentalism** (if only fine-grained physical effects are "real").  

  5.  **Conclusion**: Proportionality alone cannot resolve exclusion. It merely relocates the problem to the *metaphysics of effect-individuation*. Without an independent account of why *only* effects at a certain grain (proportional to mental properties) are "real" or "causally relevant," Yablo’s solution is circular or incomplete. The gerrymandering lemma shows proportionality is *insufficient* to secure the causal efficacy of the mental against Kim.

  ### Can a Committed Yabloian Block This?
  *   **The Best Defense: "Proportionality is a Constraint on *Explanatory Relevance*, not Ontology"**  
      A Yabloian might argue proportionality identifies the *explanatorily relevant* cause *for a given explanatory context*, not the *sole ontological cause*. Sophie’s pecking *qua* response-to-red is explained by redness; *qua* specific-retinal-response is explained by scarlet. Both are "real" causes relative to different effect-aspects.  
      *   **Rebuttal**: This concedes the objection! If *both* \(M\) and \(P\) can be causes relative to their "own" effects, then Kim’s worry – that non-reductive physicalism implies systematic causal overdetermination or physical causal closure violation – remains untouched. The exclusion argument targets *causal efficacy in producing a single, concrete physical event* (e.g., the motion of Sophie’s beak at t). Splitting effects linguistically doesn’t resolve the ontological competition for causing *that event*.

  *   **The "Fixed Grain of Mental Properties" Move**: Argue mental properties *by their nature* are only apt for causing certain coarse-grained effects (e.g., behaviors defined intentionally).  
      *   **Problem**: This is ad hoc unless grounded in an independent theory of mental causation. It also risks epiphenomenalism about the mental for fine-grained physical effects, violating physical causal closure if those effects lack sufficient physical causes.

  ### Bonus: Bennett & List/Menzies
  *   **Karen Bennett ("Making Things Up")**: Her "compositional exclusion" solution focuses on grounding, not proportionality. She argues realizing properties don’t compete with grounded properties because the latter are *partly constituted by* their realizers. \(M\) causes \(E\) *in virtue of* \(P\) causing \(E\).  
      *   **Dodges Gerrymandering?** Partially. Bennett avoids effect-grain relativity by denying competition outright. However, she still needs an account of *how* \(M\)'s causal efficacy is "inherited" without overdetermination. If the *only* causal work is done by \(P\) at the fine-grained level, the threat of mental epiphenomenalism remains. Her solution depends on the metaphysics of grounding being robust enough to support causation.
  *   **List & Menzies (Interventionist Proportionality)**: They integrate proportionality into an interventionist causal model framework. Causes are difference-makers relative to a contrast space and variable set.  
      *   **Dodges Gerrymandering?** **Yes, in principle.** Interventionism *explicitly* makes causation relative to a chosen variable set/granularity. Crucially, they argue the *cognitive* or *agential* perspective (defining variables for mental states and intentional actions) is *legitimate and irreducible* to the physical perspective. There’s no "one true grain"; different models capture real causal patterns. Exclusion is avoided because mental and physical variables belong to different, non-competing causal models.  
      *   **Cost**: Requires buying into interventionism and causal perspectivalism. Critics argue it sidesteps the ontological core of Kim’s argument by retreating to epistemology.

  **In Sum**: Your objection is potent. Yablo’s proportionality, standing alone, is vulnerable to the grain-relativity *reductio*. A robust defense requires supplementing it with either a perspectival/interventionist framework (à la List & Menzies) or a strong metaphysics of grounding/realization (à la Bennett). Without such additions, proportionality fails to decisively "evaporate" exclusion.
