prompt: |-
  I'm one of the public members on my state's parole board (long story — a piece I wrote a few years back on actuarial risk tools apparently impressed the right person), and we've hit a snag this month I can't stop turning over. We're deciding on a file where the risk instrument our office uses was run by two different consultants who reached very different numbers for the exact same guy: one anchored his five-year reoffending estimate to "all men convicted of this offense category released in the past decade," which comes out to 44%, and the other used a narrower comparison group — same offense, same age band, completed the same in-prison program, no juvenile record — which comes out to 13%. Everyone agrees both groupings are legitimate and both rest on decent sample sizes, but nobody can tell me why one is "more correct" for this specific human being than the other. A board member who used to teach philosophy says this has an actual name, something like "the reference class problem" (hope I'm getting that right), and that it isn't just the usual algorithmic-bias story with extra math — it's that literally any person belongs to endless overlapping reference classes that would each hand you a different number, bias or no bias.

  I need to send round a short memo before thursdays vote, and I'd like it to do double duty: what we should do with this particular file, and what our standing policy should be for weighing these actuarial numbers whenever this kind of split shows up again (apparently it's more common than I realized). Make the recommendation concrete enough that the board could actually vote on it line by line, and please don't let the memo off easy on the strongest pushback it'll get in the room — that walking away from the single "official" number just hands the decision back to individual members' gut instincts, which is exactly the unaccountable, possibly more biased discretion these tools were brought in to replace.
reasoning: |-
  Okay, let me unpack this parole board member's problem. They're stuck between two very different risk assessment scores (44% vs 13%) for the same inmate, stemming from different reference classes - one broad ("all men convicted of this offense category") and one narrow (adding age, program completion, no juvenile record). The philosophical reference class problem is real here - both approaches are statistically valid but yield opposite results. 

  The core tension is between wanting objective data versus recognizing that all "objective" numbers depend on subjective framing choices. The board member's memo needs to resolve this specific case while creating a policy for future splits, without reverting to unstructured discretion. 

  Hmm, the key challenges are:
  First, rejecting both numbers as definitive requires offering something better than gut feelings. 
  Second, any framework must withstand the criticism that it reintroduces the very subjectivity risk tools were meant to eliminate. 
  Third, the solution should force explicit reasoning about why certain factors matter more in this case.

  I recall that in sentencing guidelines, courts often use "departures" - structured deviations based on articulated reasons. That could work here. For the policy recommendation, we'd need: 
  1) Hierarchy of evidence (prioritizing dynamic over static factors) 
  2) Requirement for case-specific justification when deviating from the midpoint 
  3) Documentation standards to prevent arbitrary decisions

  The pushback about reverting to subjectivity is valid but answerable - the alternative isn't no discretion, it's better-structured discretion. The memo should emphasize that unexamined deference to any single number is its own form of bias.

  For this specific inmate, the narrow reference class seems more relevant given his program completion and clean juvenile record - factors indicating change. But the policy shouldn't automatically prefer narrow classes, as overspecialization can create statistical ghosts. The framework should require explaining why certain variables are dispositive in each case.

  The philosophical depth here is striking - it's not just about algorithms but about how we categorize humans for prediction. The memo must acknowledge that while offering practical resolution tools. The "departure analysis" concept might bridge that gap by making subjectivity auditable.
answer: |-
  Here's a concise memo addressing both the immediate case and a standing policy, designed for board discussion and voting. It confronts the core tension head-on:

  ---

  **MEMORANDUM**  
  **TO:** Parole Board Members  
  **FROM:** [Your Name], Public Member  
  **DATE:** [Date]  
  **SUBJECT:** Policy & Decision Framework for Divergent Actuarial Risk Assessments (File: [Inmate ID])  

  **I. The Immediate Case ([Inmate ID])**  
  We face divergent risk assessments: **44%** (broad reference class: "All men convicted of [Offense Category], released past decade") vs. **13%** (narrow class: "[Offense Category], age [X-Y], completed [Program Z], no juvenile record"). Both methodologies are statistically valid.  

  **Recommended Action:**  
  1.  **Acknowledge the Reference Class Problem:** Neither number is inherently "more correct." The discrepancy arises because risk tools *always* embed a choice about which characteristics define the comparison group.  
  2.  **Prioritize Dynamic & Proximal Factors:** The narrow class incorporates factors directly relevant to *this inmate's post-release prospects*:  
      *   **Program Completion:** Demonstrates engagement and skill acquisition.  
      *   **Clean Juvenile Record:** Suggests earlier life stability (a known protective factor).  
      *   **Age Band:** Reflects maturation (offense desistance correlates strongly with age).  
  3.  **Use the 13% as the *Primary* Anchor:** This better reflects the individual's recent history and rehabilitative efforts.  
  4.  **Consider the 44% as Context:** It highlights baseline systemic risk absent mitigating factors.  
  5.  **Require Qualitative Justification:** Grant parole *only if* the inmate's institutional conduct, release plan, victim input (if applicable), and interview support the lower-risk profile suggested by the narrow class.  

  **Vote Recommendation:** **Grant Parole**, contingent on standard conditions, based on the preponderance of evidence favoring lower risk when *individualized* factors are weighed.  

  **II. Proposed Standing Policy for Divergent Actuarial Scores**  
  When consultants provide materially divergent risk scores (>15% absolute difference) due to legitimate reference class choices:  

  1.  **Mandate Dual Reporting:** Consultants *must* provide both:  
      *   **A. The "Standard" Reference Class Score** (as defined in Board policy/state statute).  
      *   **B. An "Individualized" Reference Class Score** incorporating *at least three* dynamic/proximal factors relevant to desistance (e.g., program completion, disciplinary record last 24mo, age, validated dynamic risk assessment results, victim reconciliation progress).  
  2.  **Establish a Hierarchy of Factors:** Prioritize reference classes incorporating:  
      *   **Dynamic Factors** (behavior change, skills) > **Proximal Static Factors** (current age, time since offense) > **Distal Static Factors** (original offense type, decades-old juvenile record).  
      *   **Rehabilitative Participation** (programs, therapy) carries significant weight.  
  3.  **Board Analysis Framework:** Members *must* explicitly discuss:  
      *   **a.** Which reference class better captures *this individual's current reality and prospects*? Why?  
      *   **b.** Do the inmate's specific actions and history *support or contradict* the assumptions of the chosen reference class?  
      *   **c.** Is there qualitative evidence (case file, interview, victim statements) *reinforcing* the selected risk estimate?  
  4.  **Document the Reasoning:** The final decision memo must:  
      *   State which risk estimate (or weighted midpoint) was primarily relied upon.  
      *   Explain *why* that reference class was deemed most appropriate *for this case*.  
      *   Acknowledge the alternative estimate and why it was given less weight.  
      *   Detail the qualitative factors bridging the actuarial data to the individual.  
  5.  **No Default Midpoint:** Avoid mechanically averaging scores. The choice must be reasoned, not mathematical.  

  **Addressing the Core Pushback: "Isn't this just gut feeling in disguise?"**  

  *   **No. This is *Structured Discretion*:** Unchecked deference to *any* single number is an illusion of objectivity. It hides the inherent subjectivity in *choosing which number to generate*. Our current dilemma proves no single number is "truth."  
  *   **Replaces *Hidden* Subjectivity with *Explicit* Judgment:** The policy forces us to articulate *why* certain factors matter more *for this person*, making our reasoning transparent and auditable. Gut feeling is "I feel he's low risk." This is "We rely on the 13% estimate because it incorporates his program completion (demonstrating X), clean recent conduct (showing Y), and age (consistent with desistance data Z), and his interview/release plan corroborates A, B, and C."  
  *   **Maintains Accountability:** Documentation requirements ensure decisions can be reviewed for consistency and rationale, unlike opaque gut instincts or blind faith in one algorithm.  
  *   **Uses Tools, Doesn't Worship Them:** Actuarial tools provide valuable *anchors* and *comparative context*. This policy ensures they inform, rather than replace, the Board's statutory duty for individualized decisions.  

  **Vote Recommendation for Policy:**  
  Adopt the above Standing Policy framework, effective immediately for all cases with materially divergent actuarial scores.  

  **Proposed Votes for Thursday:**  
  1.  **On File [Inmate ID]:** ☐ Grant Parole (as recommended) ☐ Deny Parole  
  2.  **On Standing Policy:** ☐ Adopt as Proposed ☐ Reject ☐ Amend (Specify)  

  ---

  **Key Strengths of this Approach:**  

  *   **Concrete & Actionable:** Provides clear steps for *this case* and future cases.  
  *   **Confronts the Philosophy:** Names the "Reference Class Problem" and doesn't shy away from its implications.  
  *   **Balances Data & Discretion:** Uses tools rigorously but rejects false precision. Forces articulation of *why* data is applied.  
  *   **Mitigates Bias Risk:** Prioritizing dynamic/proximal factors focuses on *changeable* aspects and recent behavior, reducing over-reliance on static traits (e.g., race, old offenses). Mandated documentation combats arbitrary decisions.  
  *   **Defensible:** Provides a replicable, reasoned framework far superior to either algorithmic deference or unstructured intuition.  
  *   **Practical:** Consultants can implement dual reporting. Board members have a clear discussion/documentation rubric.  

  This framework acknowledges the inherent limitations of risk prediction while providing a robust, transparent, and fairer method for integrating these tools into the irreducibly human decision of parole.
