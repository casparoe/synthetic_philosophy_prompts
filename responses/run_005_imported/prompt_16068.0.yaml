prompt: |-
  Okay so this might be a weird one but here's the deal. I've been kind of obsessed with the "is consciousness even real" question for about a year now, ever since a friend sent me a Keith Frankish essay and I fell down the rabbit hole -- never studied any of this formally, I just read whatever I can find online and argue about it with my roommate til 2am. I help run a tiny local philosophy meetup that started doing recorded Q&As during the pandemic and never stopped, and next month's guest is a philosopher who defends illusionism, the view that phenomenal consciousness -- the redness of red, the ouchiness of pain, all that stuff -- doesn't actually exist, it just seems to. I won't use her real name here since I don't want to put words in her mouth, but she's a genuine defender of the position, not some strawman I made up.

  Her go-to move whenever someone pushes back is some version of "I'm not denying that something is going on, I'm denying that introspection is reporting it accurately," and she kind of treats that as case closed every time. I want questions that don't let her rest there so easily. Can you write me around 8 interview questions that go beyond just "explain illusionism to the audience"? Specifically I want one that presses on the thing that bugs me most: if the "seeming" of redness is itself just an illusion, isnt the illusion-making itself something it would have to feel like to undergo, so who exactly is getting fooled? I also want one on whether this whole approach is just relabeling the hard problem as a "meta problem" (explaining why we think theres a hard problem) rather than actually solving anything, and one on that "quasi-phenomenal properties" idea, or whatever the exact term for it is, where the stuff introspection reports is supposedly real but just not phenomenal -- that distinction has always smelled like a shell game to me and I want her forced to cash it out with a concrete example. For each question throw in a quick follow up aimed at whatever answer she's most likely to give, and end the whole list with a question about what observation could ever convince her illusionism is false, because right now it kind of feels unfalsifiable to me.
