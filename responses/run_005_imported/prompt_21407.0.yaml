  Ok so I had this whole two-hour argument with my friend last night about whether gut disgust is real moral evidence or just an evolutionary artifact that debunks itself once you notice where it comes from, and its bugging me because I'm on the committee at my university that signs off on chimera research, and next week we vote on a proposal to grow human neural tissue in animal brains for neurodegeneration research. Half the committee is basically running Kass's old "wisdom of repugnance" line -- that the sheer strength and cross-cultural consistency of people's revulsion here is itself a reason for caution, even if no one can fully articulate why. The other half says that's exactly the kind of intuition an evolutionary story should make us suspicious of, since disgust evolved to police contamination and species boundaries rather than track moral facts -- and if an evolutionary backstory is enough to disqualify a moral intuition, that same move should disqualify the intuitions behind the committee's own consent and animal-welfare rules, not just the gut reaction everyone's a little embarrassed to be swayed by. Can you draft the short recommendation memo I'm bringing to Thursday's meeting? It needs an actual verdict -- approve, reject, or approve with conditions -- and it can't just wave the repugnance side away as obviously unphilosophical; it has to actually say whether the debunking move is allowed to apply that selectively.
