  First, I need to recall the core arguments. Lewis is a Humean who thinks laws are just regularities that fit into the best deductive system balancing simplicity and strength. Armstrong is a non-Humean who believes laws involve a necessitation relation between universals. 

  The inference problem: Lewis argues that even if N(F,G) exists, it doesn't logically guarantee that all Fs are Gs. Armstrong responds that necessitation is a metaphysical relation, not a logical one, but that seems to make it brute. That's a problem for Armstrong.

  On the other hand, Armstrong attacks Lewis's Humean account. If laws are just summaries of instances, they can't explain those instances without circularity. Also, Lewis needs primitive natural properties to avoid gerrymandered regularities, which seems non-Humean. So Lewis might be smuggling in what he rejects.

  The user asks if these are mirror-image problems. Both involve gaps, but they're different. Armstrong's issue is a gap in his theory (why does N(F,G) entail regularity?), while Lewis's gap is about explanatory power and primitives. 

  For which theory fares better? Lewis's view is more parsimonious and doesn't require mysterious metaphysical relations. His natural properties are primitive, but he can argue they're necessary for any account. Armstrong's necessitation seems more problematic because it doesn't do the work it's supposed to.

