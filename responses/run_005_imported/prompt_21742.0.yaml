  so in my logic and decision theory seminar we covered 'program equilibrium,' specifically the trick where two copies of FairBot end up cooperating in a one-shot Prisoner's Dilemma just by each running a bounded proof search over the other's source code, and apparently the reason this actually works (rather than the search just failing on both sides) comes down to Löb's theorem. I can follow the proof of Löb's theorem fine on its own, but I don't get why its not basically smuggling in the answer -- FairBot's code is self-referential by construction, so couldn't you set up the same kind of fixed point to 'derive' the opposite outcome, two FairBots defecting on each other, or honestly whatever conclusion you want? What is Löb's theorem specifically contributing here that plain self-reference/diagonalization wouldn't already give you for free, and why does it pin down cooperation instead of leaving the outcome undetermined?
