answer: |-
  ## The Kelly Gambit: A Dialogue on Growth and Risk

  **Setting:** A quiet corner booth in a dimly lit restaurant, empty coffee cups and dessert plates pushed aside. Alex (Geometric Rationalist) and Sam (Bayesian Expected Utility Theorist) continue their debate.

  **Alex:** (Leaning forward, tracing a curve on the tablecloth) Sam, let me try again. Forget *my* preference. The coin flip *itself* – 60/40, even money – has an inherent growth rate. Bet too little (say 10%), you leave growth on the table. Bet too much (say 80%), you court disaster, volatility drag eats you alive. There’s a *single* point, 20% of bankroll – the Kelly fraction – where the *geometric mean* growth rate per bet is maximized. That’s not arbitrary; it’s a mathematical property *of the game*.

  **Sam:** (Nodding slowly) I agree the Kelly fraction maximizes the expected *logarithm* of wealth. It maximizes 𝔼[log(1 + f*X)], where X is the payoff. But Alex, that 𝔼[log] *is* a specific utility function: logarithmic utility. It’s U(W) = log(W). Why is *that* utility function uniquely "rational"? If someone is more risk-averse – say, they have U(W) = -1/W – they’d choose a smaller bet. If they’re less risk-averse, maybe larger. Expected Utility Theory (EUT) tells you the optimal bet *given* your risk aversion. Kelly just assumes log utility is king.

  **Alex:** But it’s *not* just about assuming log utility! Think about *what happens over time*. You and I play this game repeatedly. I bet Kelly (20%). You bet some other fixed fraction. With probability *one*, over the long run, my wealth will eventually exceed yours and stay larger forever. Your strategy is *dominated* almost surely in the limit. Doesn’t that objective, long-run outcome suggest something fundamental?

  **Sam:** (Holding up a hand) "Long run," "limit," "almost surely." Those are doing heavy lifting, Alex. No one plays infinitely. I play for N bets. Maybe N=10, maybe N=100, maybe N=1000. Crucially, *I might go bankrupt before N gets large!* Kelly betting has a non-zero probability of ruin if you bet full Kelly and face possible losses exceeding your stake – here, betting 20%, you *could* theoretically hit ruin if you get a long string of tails, though it's unlikely. More realistically, deep drawdowns are painful long before infinity. EUT handles finite horizons and risk of ruin *directly* via the curvature of U(W). A more concave utility function naturally leads to smaller bets, reducing ruin probability and smoothing wealth paths *within* the finite game I actually play.

  **Alex:** You're focusing on the ensemble – the average over many parallel universes where I play N bets. But *I* live in *one* sequence. What matters to *me* is the *time-average growth rate* along my single path: (1/N) * log(W_N / W_0). Kelly maximizes the *expected value* of *that* time-average growth rate. Ergodicity economics highlights this: for multiplicative growth (like wealth), the ensemble average (𝔼[W_N]) and the time-average growth rate behave differently. Maximizing 𝔼[W_N] – what someone with linear utility would do – encourages insane over-betting because it chases the huge upside in parallel universes, ignoring the risk of ruin *in your own path*. Kelly optimizes for the single trajectory.

  **Sam:** I understand the distinction. But why is optimizing the *expectation* of the *log* of the *final* wealth (which is equivalent to optimizing the expected *growth rate*) the *only* rational goal for a single trajectory? Suppose I play 100 bets. My utility depends on my wealth *after 100 bets*, W_100. Why must U(W_100) be log(W_100)? Why not W_100^0.5 (more risk-averse) or W_100 (risk-neutral)? The asymptotic dominance result is impressive, yes, but it doesn't tell me what to do *at N=100*. If I have a finite horizon or intermediate consumption needs, Kelly might be far too aggressive *for me personally*. EUT provides the framework to incorporate *all* those personal factors – horizon, outside wealth, risk tolerance, consumption – into a single coherent choice via U(W).

  **Alex:** Because geometric mean optimization shows up in other fundamental places where aggregation matters! Think Nash Bargaining – the solution maximizes the product of utilities. Logarithmic pooling of expert probabilities – averages probabilities geometrically to avoid double-counting. It’s a natural way to handle multiplicative interactions or proportional changes. Wealth dynamics *are* multiplicative. Privileging the geometric mean isn't capricious; it respects the inherent multiplicative structure of the problem. It’s the utility function the *problem* suggests, not just one I impose.

  **Sam:** I’ll concede it’s a compelling *default* or *reference* strategy, especially for institutions focused purely on long-term capital growth. But as a universal prescription of "rationality"? No. Samuelson's fury was precisely against that overreach. Saying "maximize growth rate" smuggles in a *very* specific risk preference – the constant relative risk aversion (CRRA) of γ=1 (log utility). Someone with γ=2 (U(W) = -1/W) is *more* risk-averse. Insisting Kelly is "rational" for them dismisses their valid preference for safety. The asymptotic dominance is real, but before the asymptote, their preferred strategy (fractional Kelly, say 10%) gives them higher *expected utility* according to *their own* preferences. It better protects them from the drawdowns *they* fear within *their* finite horizon.

  **Alex:** (Sighs) But Sam, doesn’t the long-run dominance imply that *any* deviation from Kelly is, in a deep sense, inconsistent? If you could truly play forever, deviating is irrational because you lose almost surely. Isn't finite life just an approximation to the infinite game? Shouldn't our finite strategy mimic the infinite ideal as closely as possible?

  **Sam:** That’s the crux. Is life an "approximation to infinity"? Or is infinity a useful mathematical fiction? For the pension fund with a 50-year horizon? Maybe mimicking Kelly makes sense. For the retiree drawing down savings? Absolutely not. EUT respects the agent's actual constraints and preferences. It says: "State your horizon and your risk aversion honestly, and I'll tell you the optimal bet *for that scenario*." Kelly says: "Your horizon and risk aversion are secondary; maximize growth." It *is* privileged mathematically *for the infinite multiplicative game*, but humans aren't infinite multiplicative games. We stop. We care about the path. We have varying appetites for risk. Ignoring that is where Kelly advocacy feels dogmatic.

  **Alex:** (Leans back, thoughtful) Dogmatic... perhaps sometimes. But dismissing the geometric structure and the long-run dominance feels like ignoring a fundamental truth about the *nature* of repeated betting. Maybe... maybe it's about the *frame*. For someone whose *primary, overwhelming* goal is long-term capital growth with no intermediate needs, Kelly *is* rationally privileged. For others, with different goals or constraints, EUT provides the flexibility. But to deny Kelly's unique optimality *within its own growth-maximizing frame* seems wrong.

  **Sam:** And to claim that frame is the *only* rational frame for *all* decision-makers seems equally wrong. Kelly is optimal *if and only if* your utility is logarithmic *or* your sole criterion is infinite-horizon growth-rate dominance. For finite beings with diverse risk tolerances, EUT reigns. The 'privilege' comes with very specific, often unstated, assumptions about utility or horizon.

  **Alex:** So... we agree Kelly is mathematically special for growth in the long run...

  **Sam:** ...but not universally rationally obligatory for finite agents with non-log utility.

  **Alex:** (A small smile) A truce, then? For tonight.

  **Sam:** (Returns the smile, raising a water glass) A truce. Until the next coin flip.

  **(The End)**
