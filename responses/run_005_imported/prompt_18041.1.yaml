answer: |-
  Here’s a toast crafted for Danny's celebration, weaving warmth, humor, family love, and the profound undercurrents you described, all while keeping the philosophy implicit and the focus celebratory yet inclusive:

  **(Clinking glass gently to get attention. Warm smile.)**

  "Okay, everyone! Settle down… or don’t, honestly, it *is* a [Family Name] party. But gather ‘round for a second because tonight, we are here for one primary, fantastic reason: **Danny!** My big brother. The guy who finally figured out after *eleven years* that maybe the government *doesn’t* actually run on sarcasm alone. Though, Danny, I gotta say, watching you navigate bureaucracy with that signature eyebrow raise was its own kind of performance art. Remember that time you tried to explain the concept of 'hurry up and wait' to Aunt Rosa using interpretive dance? We *still* haven’t recovered."

  **(Pause for laughter. Lean in slightly.)**

  "But seriously. Eleven years. That’s a lot of forms, a lot of waiting rooms, a lot of proving things you already knew deep down. Danny, you’ve built a life here, poured your heart and sweat into this ground. You put down roots long before any piece of paper could confirm it. And when you talk about this ceremony coming up, about finally ‘counting’... I hear that. I hear the sheer *weight* lifting off your shoulders. I hear the relief of stepping out from under a specific kind of uncertainty that most of us in this room have never had to shoulder. That relief? That’s hard-won. That’s real. That’s **yours**, Danny. Tonight, and especially on that day, we celebrate *you*. We celebrate the official recognition of what we’ve always known: this is your home. You belong *here*, unequivocally. Raise your glasses for a second – just to Danny, and the sheer, stubborn, glorious achievement of this moment! **To Danny!**"

  **(Everyone: "To Danny!" Sip. Pause. Tone shifts slightly, warmer, more encompassing.)**

  "Now, anybody who knows Danny knows he didn’t build this life in a vacuum. He built it right here, smack in the middle of *this* gloriously loud, opinionated, food-fighting family. And that’s the thing about belonging in a family like ours… it’s never been about checking the right boxes or holding the right papers. It’s about who shows up. Who argues politics at the dinner table until the empanadas are cold. Who helps you move apartments in a downpour. Who remembers your weird allergy to that one specific brand of cilantro. Who laughs at your terrible jokes, or *is* the terrible joke, depending on the day. **(Look pointedly at another relative, maybe a sibling, for a laugh.)**

  "Our circle was drawn a long time ago, not by laws or lines on a map, but by shared history, by love that got tested and came out stronger, by the simple, fierce act of claiming each other. We know, deep in our bones, that belonging isn't something granted only at a ceremony. It’s forged in the everyday. It’s the quiet certainty that you are *known*, and you are *wanted*, exactly as you are. That you matter, simply because you’re *you*, sitting right here at this table."

  **(Make deliberate, warm eye contact with Marisol, just for a beat, including her naturally in the next line.)**

  "So, Marisol, pass the platanos, will you? Because this feast wouldn't be complete without you arguing with Mom about the recipe. **(Gentle smile at Marisol, then back to the room.)** What I mean is... Danny, stepping across that threshold in three weeks is a huge, personal victory. It changes things *for you*, profoundly and rightly. We are so incredibly proud and happy for you. But it doesn't change one single thing about the circle drawn right here in this room. This family? Our belonging to *each other*? That was never up for a vote. It was never waiting on a stamp. It just *is*. It's the bedrock."

  **(Shift focus fully back to Danny, celebratory.)**

  "So, Danny, my brother – congratulations! May your ceremony be everything you’ve worked for, everything you deserve. May you feel the full weight of that relief, that pride, that solid ground finally firm beneath your feet. And may you *always* remember that long before the government caught up, you already counted – fiercely, completely, and irrevocably – right here."

  **(Raise glass high.)**

  "To Danny! To family! To belonging that runs deeper than any border, any law, any line! **Cheers!**"

  **The Philosophical Mechanics (Embedded & Invisible):**

  1.  **Danny's Achievement & Relief:** Explicitly validates Danny's journey and the real significance of the legal recognition ("finally counts," relief from uncertainty, "solid ground"). Addresses his framing directly without critique. (Honors the personal reality).
  2.  **The Familial "Demos":** Defines the family's belonging circle ("circle drawn a long time ago," "never been about checking boxes," "claimed each other," "bedrock"). Uses accessible metaphors (circle, bedrock) instead of "demos." (Contrasts with the state's boundary).
  3.  **The All-Affected/All-Subjected Principle:** Implicitly invoked by grounding belonging in shared life, shared burdens, shared history ("who shows up," "who helps you move," "shared history," "forged in the everyday"). The line "belonging isn't something granted only at a ceremony" directly counters the idea that legal status defines worth or inclusion. The warmth towards Marisol embodies this – her presence, arguments, contributions *are* her belonging, unaffected by papers. (The core argument for Marisol's inherent belonging).
  4.  **Rejecting the State's Boundary as Defining Moral Belonging:** The key move: "it doesn't change one single thing about the circle drawn right here in this room." Explicitly decouples the state's legal act from the family's pre-existing, deeper bond. "Belonging that runs deeper than any border, any law, any line" is the closing thesis statement. (Directly addresses the boundary problem as it impacts the family's understanding of itself).
  5.  **Marisol's Inclusion:** Achieved by:
      *   **Naturalization:** She's seamlessly included in the description of family belonging ("*this* gloriously loud... family," "our circle").
      *   **Direct Address:** A specific, warm, *normal* interaction ("Marisol, pass the platanos...") that places her as an active, integral participant in the family fabric, not a symbol. It's affectionate and typical, not spotlighting her status.
      *   **Embodiment of the Principle:** Her presence *is* the argument against needing papers for familial belonging. The toast doesn't *explain* this regarding her; it simply *acts* as if it's true (because it is for the family).
  6.  **Humor & Warmth:** Uses specific, believable family anecdotes (interpretive dance, moving in rain, arguing recipes, terrible jokes, Aunt Rosa) and affectionate teasing to ground it in genuine family dynamics.
  7.  **The Closing:** Provides a clear, uplifting line ("To Danny! To family! To belonging that runs deeper than any border, any law, any line!") that everyone can genuinely raise a glass to, celebrating both Danny *and* the family's enduring bond.

  This toast allows Danny his unqualified celebration and validates his feelings while simultaneously reinforcing the family's immutable, pre-political bond that includes Marisol absolutely. The philosophy underpins the structure and specific phrases, but remains entirely in the subtext, accessible to those who know but invisible and emotionally resonant for those who don't.
