  We are analyzing Aquinas's position on tyrannicide according to his distinctions. The key points from Aquinas are:

  1. **Defect in Title (usurper) vs. Defect in Exercise (tyrant)**: 
     - A usurper (who seized power illegally) is not a true ruler and may be killed by anyone, as he is like a robber (Commentary on the Sentences, Distinction 44).
     - A legitimate ruler who becomes a tyrant (abusive) is different. For such a ruler, Aquinas is very cautious: private citizens should not kill the tyrant because it may lead to chaos and because there might be a higher authority (like the community, nobles, pope, or emperor) that should handle it.

  2. **Availability of Higher Authority**:
     - If there is a higher authority (e.g., the community, an assembly, the pope, an emperor) that can judge and depose the tyrant, then that authority must be used. Private action is not allowed if such an appeal is possible.
     - If no such authority exists, then the situation is more dire, but Aquinas still does not explicitly endorse private citizens killing a legitimate tyrant. He might allow it only in extreme cases and by the community acting as a whole, not by a private individual.

  3. **Risk of Greater Evil**:
     - Killing a tyrant might lead to worse chaos, so it should be avoided if the outcome would be worse than the tyranny.

  4. **Private Citizen vs. Public Authority**:
     - In the case of a usurper, Aquinas in his early work (Commentary on the Sentences) is more permissive: a private citizen may kill the usurper because the usurper has no just authority and is an enemy of the community.
     - In the case of a legitimate tyrant, Aquinas in his later work (De Regimine Principum) is clear that only a public authority (like the community or its representatives) may act, and even then, only if there is no higher authority to appeal to.

  Now, let's analyze the scenarios:

  **Scenario 1**: 
  - A general seizes the throne by bloody coup (usurper) and rules brutally. No higher authority (emperor, pope, council) exists.
