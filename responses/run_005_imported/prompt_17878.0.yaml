  Based on Aquinas's distinctions in *Summa Theologiae* (I-II, Q.42, A.2; II-II, Q.42, A.2; *De Regimine Principum* I.6–7) and his *Commentary on the Sentences* (Dist. 44), here's the analysis:

  ```json
