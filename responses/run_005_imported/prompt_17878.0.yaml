    "clearly_licit_for_a_private_citizen": [1, 4],
    "probably_licit": [],
    "genuinely_unclear_in_aquinas": [],
    "probably_illicit": [3],
    "clearly_illicit_for_a_private_citizen": [2, 5],
    "notes": {
      "1": "Usurper with defect in title (seized power illegally); Aquinas permits private citizens to kill such rulers as they lack legitimacy and are 'like robbers' (Commentary on Sentences Dist. 44).",
      "2": "Legitimate ruler with defect in exercise (abuse of power); assembly of nobles exists, so private action is illicit—Aquinas requires appeal to higher/public authority (De Regimine I.6).",
      "3": "Governor is legitimate ruler (appointed); appeal to king is unrealistic but Aquinas still forbids private action for non-usurpers, prioritizing community action over individuals (De Regimine I.7).",
      "4": "Usurper due to defect in title (ruling beyond term by force); Aquinas treats this as illicit power seizure, permitting private citizen action (Commentary on Sentences Dist. 44).",
      "5": "Legitimate ruler with minor defects; stable realm and low severity make killing illicit due to disproportionate risk of chaos (ST II-II Q.42 A.2)."
    },
    "tiebreaker": "You are closer to the correct reading. Aquinas rigorously distinguishes between usurpers (defect in title, where private action may be licit) and legitimate-but-abusive rulers (defect in exercise, where private action is generally forbidden unless no higher authority exists). Marco oversimplifies by conflating these cases."
  }
  ```

  ### Key Aquinas Principles Applied:
  - **Defect in Title (Usurper)**: Scenarios 1 and 4 involve rulers who gained power illegally. Aquinas’s early *Commentary* allows private citizens to kill such figures, as they have no moral authority.
  - **Defect in Exercise (Tyrant)**: Scenarios 2, 3, and 5 involve legitimate rulers who became abusive. Aquinas (*De Regimine*) forbids private action, emphasizing that only public authorities (e.g., assemblies, the community collectively) may act—especially if constitutional checks exist (Scenario 2) or tyranny is mild (Scenario 5).
  - **Higher Authority**: Scenario 3’s unrealistic appeal doesn’t justify private action; Aquinas insists the *community* (not individuals) must handle legitimate-but-oppressive rulers when superiors fail.
  - **Risk of Chaos**: Scenario 5’s stability and Scenario 2’s existing assembly make killing illicit due to disproportionate social harm (ST II-II Q.42 A.2).

  **Tiebreaker**: Your reading is more accurate. Aquinas’s stance is context-dependent: he permits private tyrannicide *only* for usurpers (defect in title), not legitimate rulers turned tyrannical (defect in exercise). Marco’s "simple position" ignores Aquinas’s careful distinctions between these cases and his emphasis on public authority.
