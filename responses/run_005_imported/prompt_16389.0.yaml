prompt: |-
  A friend and I got into it this weekend over I.J. Good's old theorem on the value of information - the one saying that a Bayesian expected-utility maximizer should always be willing to look at free evidence before acting, since the expected payoff from conditioning your choice on the evidence can never be lower than just acting on your prior (the intuitive reason being that whatever posterior you end up with, it has to average back out to your prior over all the ways things could go, so there's no way to expect the evidence to systematically bite you - its basically a convexity/Jensen's-inequality argument wearing a decision-theory costume). My friend kept sliding from that precise result into a much bigger slogan, something like "a rational agent should never want to stay ignorant of anything, and no rational society should ever suppress or avoid information, since information literally can't hurt you." I pushed back with some half-remembered stuff about info economists showing that revealing information can straight up destroy insurance markets by wrecking the risk-pooling that made the trade worthwhile in the first place, plus the whole strand of game theory on the strategic value of credibly not knowing things (bargaining, commitment devices, that sort of thing) - but I couldn't turn that into an actual rebuttal, just a pile of examples that felt relevant.

  So here's what I want from you: argue, as rigorously as you can, against generalizing from Good's theorem to that bigger "information can never hurt a rational agent or a rational society" slogan. Don't give me the cheap answer about information not really being free in real life - assume it's free, that's not the interesting objection. I want you to go premise by premise through Good's actual setup and say exactly which one my examples (or better examples of your own, if you've got them) are quietly dropping once you leave the single-decision-maker, fixed-problem, non-strategic case the theorem was actually proved for.
reasoning: |-
  Okay, the user is asking me to rigorously argue against the generalization of I.J. Good's theorem to the slogan that "information can never hurt a rational agent or society." They want me to identify which premises of Good's theorem are violated in real-world scenarios like insurance markets or strategic interactions.

  First, I need to recall Good's theorem clearly. It states that for a single Bayesian decision-maker, acquiring free evidence cannot decrease expected utility. The key premises include a fixed decision problem, no costs to information, and no strategic interactions. The user wants me to show where these premises fail in broader contexts.

  The user mentioned insurance markets as an example where revealing information can destroy risk-pooling. That's a classic case of adverse selection. If insurers can't distinguish high-risk from low-risk individuals, they charge an average premium. But if information reveals risks, low-risk individuals might drop out, leading to market collapse. Here, the issue is that the decision-maker (the insurer) isn't the only one acting; individuals respond to premiums based on their private info. This violates the single-agent premise.

  Another point is strategic ignorance in game theory. In bargaining, not knowing your reservation price can prevent exploitation. If a seller knows your maximum willingness to pay, they can extract more surplus. By remaining ignorant, you avoid this. This ties into the fixed decision problem premise—when others react to your information, the problem isn't fixed anymore.

  The user also hinted at societal impacts. Consider public health decisions during a pandemic. If a government reveals too much about infection rates without context, it might cause panic or stigmatization, leading to worse outcomes. Here, the violation is in the utility function—societal utility includes stability and public trust, which aren't captured in individual Bayesian updates.

  I should structure the argument by listing each premise of Good's theorem and then showing scenarios where relaxing that premise leads to information causing harm. Key premises include:
  1. Single, non-strategic agent.
  2. Fixed decision problem (no feedback loops).
  3. Utility function unaffected by information acquisition.
  4. Bayesian updating without changing others' behavior.

  For each, provide concrete examples. Insurance markets break due to multiple agents and endogenous reactions. Strategic ignorance examples show how information can alter opponents' strategies. Societal cases involve utility functions that include coordination or trust, which are disrupted by information.

  I need to ensure rigor. Use terms like adverse selection, moral hazard, subgame perfection. Highlight that Good's theorem assumes a controlled environment, but once interactions occur, the averaging argument fails because the decision space changes. Also, emphasize that societal rationality isn't just aggregated individual rationality—coordination mechanisms can be fragile.

  The user dismissed the "cost of information" objection, so focus on structural violations of premises. Avoid real-world costs; stick to theoretical cases where even free information hurts. Think of Akerlof's lemons model or Schelling's commitment theories.

  Finally, conclude that the generalization fails when moving from individual epistemology to multi-agent systems or societal contexts. The slogan ignores dynamic interactions and systemic effects, which Good's theorem doesn't account for.
answer: |-
  You're absolutely right to push back, and your intuition about the limitations of Good's theorem is spot-on. Good's result is elegant and powerful *within its specific domain*, but generalizing it to "information can never hurt" is a profound error. The key lies in meticulously dissecting the theorem's premises and showing how your examples (and others) violate them when moving beyond the single-agent, non-strategic, fixed-problem context. Let's go premise by premise.

  **Recap of Good's Theorem Premises (Implicit & Explicit):**

  1.  **Single Agent:** There is one rational Bayesian expected-utility maximizer making the decision.
  2.  **Fixed Decision Problem:** The set of available actions, the state space, the consequence function (mapping state-action pairs to outcomes), and the agent's utility function over outcomes are fixed and unaffected by the act of acquiring information itself.
  3.  **Fixed Prior:** The agent has a well-defined prior probability distribution over the state space.
  4.  **Free & Passive Evidence:** Acquiring the evidence is costless. The evidence is generated by a fixed likelihood function (P(Evidence | State)). Acquiring evidence does not change the state of the world or the structure of the problem.
  5.  **Bayesian Updating:** The agent updates beliefs strictly via Bayes' theorem upon receiving evidence.
  6.  **Posterior Choice:** After updating, the agent chooses the action maximizing expected utility given their posterior belief.
  7.  **Comparison:** The agent compares the expected utility of:
      *   Acting now based on the prior.
      *   Acquiring the free evidence, updating to *some* posterior (averaging over all possible evidence), and *then* choosing the optimal action for that posterior.

  **Good's Conclusion:** Option 2 (acquiring evidence) always has expected utility at least as high as Option 1 (acting now). Information has non-negative expected value.

  **Violating the Premises: How Information Can Hurt**

  1.  **Violating Premise 1 (Single Agent) & Premise 2 (Fixed Problem - Structure): Introducing Multiple Agents & Strategic Interaction (Your Game Theory Examples)**
      *   **The Core Issue:** When other rational agents exist and their actions depend on what *you* know (or what they *think* you know), acquiring information changes the *strategic landscape*. Your knowledge becomes a state variable in *their* decision problem.
      *   **Example: Bargaining with Known Reservation Value.**
          *   **Setup:** You are selling a unique item. Your reservation price (minimum you'll accept) is `R`, known only to you. The buyer has a valuation `V > R`, known only to them. You engage in alternating-offer bargaining. Assume the buyer makes the first offer.
          *   **Ignorance Can Be Bliss (For the Seller):** Suppose you, the seller, *do not know* your own `R`. You might have a prior over possible `R` values. Crucially, the *buyer also knows you don't know R*. The buyer, wanting to secure the deal, might make a relatively high first offer to ensure it's above whatever `R` turns out to be, fearing you might reject a lowball offer if you later learn `R` is high. You might accept this high offer, getting significant surplus.
          *   **Information Hurts:** Now, suppose you *learn* your exact `R` before bargaining starts, *and the buyer knows you know it*. The buyer realizes you will reject any offer below `R`. Knowing `V > R`, the buyer will offer just *slightly more than `R`* (or perhaps exactly `R` depending on bargaining power assumptions). Your surplus is minimal.
          *   **Why Good's Theorem Doesn't Apply:**
              *   Premise 1 Violated: There are multiple agents (buyer, seller).
              *   Premise 2 Violated: The buyer's strategy (offer amount) *depends critically* on whether you know `R`. The "consequence function" (what offer you get) changes based on your information state. Learning `R` fundamentally alters the structure of the game *for the buyer*.
              *   Premise 4 Violated (Implicitly): Acquiring information (`R`) changes how the other agent *acts*, thereby changing the potential outcomes available to you. The evidence acquisition isn't passive; it triggers a different equilibrium.
          *   **Mechanism:** Information destroys your *bargaining power* derived from the buyer's uncertainty about your walk-away point. Knowing `R` commits you to rejecting below `R`, allowing the buyer to extract almost all surplus. Ignorance creates a form of credible commitment to potentially accept lower offers, inducing the buyer to offer more.

  2.  **Violating Premise 2 (Fixed Problem - Payoffs): Information Changing the Utility Function or Feasible Set (Insurance Markets & Societal Examples)**
      *   **The Core Issue:** Acquiring information can change the set of feasible actions available *to others*, or change the *payoffs* associated with outcomes, even for a single agent, by altering market dynamics or social equilibria.
      *   **Example: Insurance Market Collapse (Akerlof's Lemons for Insurance).**
          *   **Setup:** A population has individuals with different risk levels (High/Low). An insurer offers a single insurance contract priced based on the *average* risk (prior belief). The contract is actuarially fair on average. Both High and Low-risk individuals might buy it, pooling risk.
          *   **Ignorance Sustains the Market:** Because the insurer doesn't know individual risks (only the average), and individuals don't necessarily know their *exact* risk either (or it's prohibitively costly to reveal), the pooling contract is viable. Low-risk individuals subsidize high-risk, but gain peace of mind; high-risk gain essential coverage.
          *   **Information Hurts (Destroys the Market):** Suppose a free, perfectly accurate genetic test reveals each individual's exact risk type. *Now individuals know their type*. Low-risk individuals realize the pooled premium is *above* their fair price. They drop out. The insurer, seeing only high-risk individuals remain, must raise premiums to cover the now-higher average risk. This further drives out any remaining moderate-risk individuals, leading to a "death spiral" until only the highest-risk remain and the premium is unaffordable, or the market collapses entirely. *Both* high-risk individuals (who lose access to affordable insurance) and low-risk individuals (who could have gotten insurance slightly above their fair price but below their subjective valuation of security) are worse off than under the pooling equilibrium. Society loses a valuable risk-sharing mechanism.
          *   **Why Good's Theorem Doesn't Apply:**
              *   Premise 2 Violated (Fundamentally): The act of acquiring information (individuals learning their type) changes the *feasible actions* available in the market. The viable pooling contract *disappears* as a possible outcome. The "consequence" of the insurer initially offering insurance *changes* based on whether individuals know their types. The information doesn't just update beliefs; it *destroys the possibility* of the mutually beneficial risk-pooling trade. The payoff structure itself changes.
              *   Premise 1 Blurred: While each individual might be a Bayesian optimizer, the *market outcome* depends on the *aggregate* response of all individuals to their new information. The insurer is also a strategic actor responding to the pool composition.
              *   **Mechanism:** Information enables *adverse selection*. Knowing one's type allows individuals to make choices (buy/don't buy) based on private information that harms the collective outcome. Ignorance facilitated a cooperative, Pareto-improving equilibrium.

  3.  **Violating Premise 2 (Fixed Problem - Payoffs) & Premise 4 (Passive Evidence): Information Changing Preferences or Causing Direct Harm (Psychological & Societal)**
      *   **The Core Issue:** Information can directly alter an agent's utility function (e.g., causing anxiety, destroying happiness) or trigger harmful societal reactions, even if the underlying state of the world is unchanged.
      *   **Example: The Fatalist Medical Test.**
          *   **Setup:** An agent faces a choice: take a pleasurable but risky action (e.g., climb a mountain) or a safe but boring one (stay home). There's a small prior probability `p` that a latent, incurable, fatal condition exists. If the condition exists, the risky action will certainly trigger death; otherwise, it's safe. The safe action leads to mild utility `S` regardless. The risky action leads to high utility `R >> S` if safe, or death (utility `D ≈ -∞`) if the condition exists. Expected utility of acting now: `(1-p)*R + p*D ≈ (1-p)*R` (since `p*D` dominates negatively). Expected utility of safe action: `S`. Assume `(1-p)*R > S`, so they climb.
          *   **Ignorance is Enjoyable Bliss:** The agent climbs, enjoys the experience (`R`), and likely never knows if the condition existed. They live happily.
          *   **Information Hurts:** Suppose a free, perfectly accurate test exists for the condition. Good's theorem *would* say to take the test: if negative (prob `1-p`), climb and get `R`; if positive (prob `p`), stay home and get `S`. Expected utility of testing: `(1-p)*R + p*S`.
          *   **The Catch:** Compare `(1-p)*R + p*S` (Test) vs. `(1-p)*R` (Act Now). Since `S > D ≈ -∞`, but `S` is likely much smaller than `R`, and `p` is small, `(1-p)*R + p*S` is *less than* `(1-p)*R` if `S < R` (which it is). `(1-p)*R + p*S = (1-p)*R + p*S < (1-p)*R + p*R = R` (since `S < R`). More importantly: `(1-p)*R + p*S < (1-p)*R`? Rearranged: Is `p*S < 0`? Only if `S < 0`. But `S` is positive (boring but safe life). **Numerically, `(1-p)*R + p*S` is always less than `(1-p)*R` if `S < R`.** This seems to contradict Good! What's wrong?
          *   **The Resolution (Violating Premise 2):** The key is the utility of "climb and condition exists." Good's calculation implicitly assumes that if you test positive and choose the safe action, you get `S`. *But what is the actual experience?* You learn you have a fatal condition. Your life is now shadowed by this knowledge. The utility of "stay home" *after a positive test* is **not** `S` (the utility of a normal safe day), it's `S'`, where `S' << S` (possibly even negative due to despair/anxiety). The consequence "safe outcome" *given the knowledge of the fatal condition* has a *different utility* than the safe outcome *without that knowledge*. The information directly degrades the utility of the safe outcome.
          *   **Why Good's Theorem Doesn't Apply:**
              *   Premise 2 Violated (Crucially): The utility function `U(outcome)` is **not** fixed. The utility of the "safe" consequence `S` changes to `S' < S` (possibly `S' << 0`) *if you know the fatal condition exists*. The act of acquiring information alters the payoff associated with a state of the world. The "fixed consequence" (being alive but not climbing) now carries the psychological burden of knowing one's fate.
              *   Premise 4 Violated (Implicitly): The evidence isn't passive; it directly causes psychological harm. The state of the world (having the condition) is unchanged, but *knowing* that state changes the agent's phenomenological experience, hence their utility.
          *   **Mechanism:** Information inflicts direct psychological harm (anxiety, despair) that outweighs the potential decision-improving benefit. The "fixed consequence" assumption is naive to the impact of knowledge itself on well-being. Ignorance preserves well-being.

  4.  **Violating Premise 2 (Fixed Problem - Structure) & Premise 1 (Single Agent): Information Destroying Equilibria Requiring Uniform Priors (Societal Coordination)**
      *   **The Core Issue:** Some beneficial social equilibria rely on shared ignorance or uniform priors. Revealing information can shatter common knowledge assumptions necessary for coordination, leading to Pareto-inferior outcomes.
      *   **Example: The Investment Strike (Based on Global Games).**
          *   **Setup:** Many investors are deciding whether to invest in a country. The investment is profitable only if a *sufficient fraction* of others also invest (e.g., critical mass for infrastructure). Each investor has a slightly noisy private signal about the country's fundamental strength `θ`. There's a prior that `θ` is likely adequate.
          *   **Ignorance Sustains Investment (Coordinated Equilibrium):** If no one gets precise public information, and private signals are clustered, investors might coordinate on the "invest" equilibrium based on the shared prior and expectation that others will also see adequate signals. Investment happens, fundamentals are revealed as good, all profit.
          *   **Information Hurts (Causes a Run):** Suppose a free, public, definitive report is issued. It reveals `θ` is *slightly below* the critical threshold needed for investment to be profitable if everyone invests. However, if *everyone still invested*, the return would still be positive (though suboptimal). But now, investors know `θ` is below threshold. Each investor, knowing this *and knowing everyone else knows this*, realizes that *everyone* now has a strong incentive *not* to invest, fearing others won't. This becomes a self-fulfilling prophecy: no one invests, the country collapses, everyone gets zero. The outcome is disastrously worse than if they had remained ignorant and coordinated on investing.
          *   **Why Good's Theorem Doesn't Apply:**
              *   Premise 1 Violated: Multiple agents.
              *   Premise 2 Violated: The feasibility of the "invest" equilibrium *depended on the lack of common knowledge* that `θ` was slightly suboptimal. The public information changes the structure of the coordination game, destroying the Pareto-superior equilibrium. The "consequence" of individual investment decisions changes because the information alters the beliefs and thus the *expected actions* of all other players.
              *   Premise 4 Violated: The evidence (public report) actively changes the beliefs of all agents simultaneously, destroying the common prior assumption necessary for the good equilibrium.
          *   **Mechanism:** Public information creates *common knowledge* of a slightly negative state, enabling a coordination failure (a "run") that wouldn't occur under dispersed, slightly optimistic private signals based on a good prior. Ignorance (or noisy information) sustained beneficial coordination.

  **Conclusion: The Precise Cracks in the Foundation**

  Your friend's slogan fails catastrophically when we relax the core premises of Good's theorem, which are essential for its "information cannot hurt" conclusion:

  1.  **Single Agent, Non-Strategic World:** Good assumes a lone decision-maker against nature. Introduce other rational agents whose strategies depend on your information (Bargaining, Markets), and information can become a liability, weakening bargaining power or destroying cooperative equilibria (Insurance).
  2.  **Fixed Decision Problem (Actions, Consequences, Utilities):** Good assumes learning doesn't change the rules of the game, the payoffs, or what consequences feel like. Information can destroy feasible actions (Insurance Market collapse), alter the psychological utility of outcomes (Fatalist Test), or shatter the common knowledge necessary for coordination (Investment Strike).
  3.  **Truly Passive Evidence:** Good assumes learning doesn't *cause* harm or change the world. Information can inflict direct psychological harm (Fatalist Test) or trigger harmful social dynamics (panic, stigma, coordination failure) that wouldn't occur otherwise.

  Your insurance example primarily violates **Premise 2 (Fixed Problem - Feasible Actions/Payoffs)** by destroying the risk-pooling mechanism. Your strategic ignorance examples primarily violate **Premise 1 (Single Agent)** and **Premise 2 (Fixed Problem - Structure of Interaction)** by changing the strategic game other agents play against you.

  The fundamental error in the slogan is the assumption that the *only* effect of information is Bayesian belief updating within a fixed decision frame. In multi-agent systems, complex societies, and contexts where knowledge itself alters preferences or capabilities, information acquisition is *not* a passive belief-updating mechanism; it's an *action* that actively reshapes the decision landscape, often in ways that eliminate beneficial options or trigger harmful dynamics that dominate any local decision improvement. Rational agents and societies must sometimes value strategic ignorance or opacity to preserve valuable equilibria, cooperation, psychological well-being, or coordination mechanisms that depend on shared uncertainty.
