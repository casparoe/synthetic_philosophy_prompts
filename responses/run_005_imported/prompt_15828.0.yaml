  For the utility framing question, I'm imagining her retreating to "rational agents incorporate all costs" - so the follow-up should press whether that makes the slogan tautological rather than profound. And for Hirshleifer, she might dismiss it as irrelevant to individual rationality, but the follow-up should force her to confront whether her policy prescriptions ignore systemic collapse risks. 

  The finale needs teeth: asking for a single realistic counterexample. When she inevitably waffles, the follow-up must deny her escape hatches - no redefining "rational," no appeals to misestimated utilities, no calling it "not evidence." Make her either admit the slogan's fragility or concede hidden limits. 

