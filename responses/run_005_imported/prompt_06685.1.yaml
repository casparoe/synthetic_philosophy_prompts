  First, I need to unpack why the standard "Solomonoff dissolves grue" claim is fragile. The core issue is that "simplicity" isn't absolute - it depends on your computational alphabet. If I build a UTM with GRUE/BLEEN primitives, "emerald is grue" becomes shorter to specify than "green". This isn't just theoretical; it mirrors how natural language predicates gain entrenchment through use. 

  Goodman's entrenchment solution fails because it's circular - we prefer green because it's entrenched, but what made it entrenched? That just pushes the problem back. Solomonoff seems better by offering a formal measure, but the UTM relativity recreates the same arbitrariness at the computational level. 

