  5. Conclusion: relocation, not resolution
answer: |-
  ## The Solomonoff Siren Song: Why Algorithmic Induction Fails Goodman's Test

  The claim that Solomonoff induction dissolves Goodman's grue problem is seductive but ultimately illusory. Algorithmic information theory **does not provide a genuine, principled solution** to the new riddle of induction. Instead, it **merely relocates the arbitrariness** identified by Goodman from the level of "natural" predicates to the choice of the Universal Turing Machine (UTM) or description language. This relocation doesn't solve the problem; it obfuscates it with computational formalism while preserving its core epistemic sting, especially for the critical pre-T period where predictions matter most. Here's why:

  ### (a) Goodman's Entrenchment: Why It Stumbles
  Goodman's own solution relied on the "entrenchment" of predicates – well-worn concepts like "green" have a history of successful projection, making them preferable to novel, gerrymandered predicates like "grue." This fails on its own terms due to **circularity and historical contingency**:
  1.  **Circularity:** Entrenchment presupposes a prior framework of "projectible" predicates. Why is "green" entrenched? Because we *already* found it projectible! This doesn't explain *why* certain predicates became entrenched in the first place; it just describes the outcome. Goodman offers a descriptive account of inductive practice, not a justificatory foundation.
  2.  **Contingency:** Entrenchment is path-dependent. Had our scientific or linguistic history fixated on "grue" and "bleen," *those* would be entrenched. This makes inductive validity hostage to historical accident, undermining its claim to objective rationality. We need a reason *beyond* mere historical usage to privilege "green" over "grue" for *future* predictions.

  Solomonoff induction seemed to offer that missing foundation: simplicity defined objectively via Kolmogorov complexity (K).

  ### (b) Solomonoff's Promise & The UTM Relocation Gambit
  Solomonoff induction proposes a prior weighting hypotheses by 2^-K(h), where K(h) is the length of the shortest program generating hypothesis `h` on a UTM. The argument against grue: "All emeralds are green" is shorter to specify than "All emeralds are grue (green if observed ≤ T, else blue)," as "grue" requires specifying the arbitrary time `T`. Hence, green dominates *a priori*.

  **The Fatal Flaw:** Kolmogorov complexity is **relative to the choice of UTM**. A UTM is defined by its instruction set (primitives). Consider:
  1.  **Standard UTM (Primitives: RGB, basic logic):** `green` is primitive. `grue` requires defining a conditional: `if time <= T: output "green" else output "blue"`. K(green) < K(grue).
  2.  **Grue-UTM (Primitives: GRUE, BLEEN, basic logic):** `grue` *is* primitive. Defining `green` now requires `if time <= T: output "grue" else output "bleen"`. K(grue) < K(green)!

  The arbitrariness Goodman located in predicates ("Why prefer 'green' over 'grue'?") is relocated to the choice of computational primitives ("Why prefer an RGB-UTM over a GRUE-UTM?"). There is no language-independent, "God's UTM" grounding for absolute simplicity. The "naturalness" is injected by the human choice of the initial description language.

  ### (c) The Convergence Defense: Cold Comfort Pre-T
  The standard rejoinder is that *given enough data*, predictions converge *regardless* of the UTM choice. This defense **fails utterly for the pre-T case**, which is the heart of Goodman's riddle:
  1.  **Empirical Indistinguishability Pre-T:** By definition, all emeralds observed before time `T` are *both* green and grue. Every data point is identically compatible with both hypotheses. No evidence gathered before `T` can distinguish them or favor one UTM's prior weighting over another's.
  2.  **Prior Dominance:** Predictions *before* `T` about emeralds *after* `T` depend *entirely* on the prior weighting. The RGB-UTM predicts "green" with high probability; the GRUE-UTM predicts "blue" (i.e., the "grue" switch) with high probability. There is no convergence of predictions *before* `T` – the predictions are diametrically opposed.
  3.  **The Long Run is Too Late:** Convergence *after* `T` is irrelevant. Once `T` passes, we see the color and know the answer. The entire problem is about *predicting* the unknown future *before* that point. Convergence "in the limit" offers no guidance when we need it most – when making the prediction under uncertainty. The UTM choice dictates the prediction pre-T, and that choice is arbitrary relative to the empirical data available.

  ### Goodman vs. Hume: A Distinct Challenge
  This is **not merely Hume's problem in a computational costume**. Hume's challenge is deeper and broader: Why should we believe the *future will resemble the past* at all? Why expect *any* regularity? Hume attacks the justification for induction itself.

  Goodman *accepts* that we seek regularities but challenges how we choose *which* apparent regularity to project. Given the same past data ("All observed emeralds are green/grue"), why project "green" rather than "grue"? This is a problem of **underdetermination and predicate preference** *within* the practice of induction. Solomonoff induction attempts to answer Goodman by providing a formal criterion (simplicity/K-complexity) for choosing between empirically equivalent hypotheses pre-T. Its failure lies in showing that this criterion itself lacks the necessary objectivity; it depends on an arbitrary choice one level up. Hume's problem remains untouched underneath – Solomonoff assumes the universe is computable and that finding the shortest program is the goal, which are themselves inductive leaps vulnerable to Humean skepticism.

  ### The Verdict: Relocation, Not Resolution
  Solomonoff induction does not solve the new riddle of induction. It provides a sophisticated, formal framework that **relocates the arbitrariness** from Goodman's level of "natural predicates" to the level of the Universal Turing Machine's instruction set. The "convergence in the limit" defense is impotent precisely when Goodman's riddle bites hardest: before time `T`, where the empirically indistinguishable green and grue hypotheses make divergent predictions, and the choice is dictated solely by the arbitrary UTM-dependent prior.

  The appeal to algorithmic information theory does not furnish a principled, objective ground for preferring "green" over "grue." It demonstrates that *if* we fix a description language (UTM), we can define simplicity within it. But the choice of that language, which determines which predicates are "simple," remains as contingent and arbitrary as Goodman's entrenchment, lacking the transcendent justification its proponents seek. The computational costume changes the appearance, but the ghost of grue still haunts the machine.
