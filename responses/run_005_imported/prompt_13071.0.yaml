prompt: |-
  Two months ago I joined the reproductive ethics advisory committee at the fertility clinic where my partner and I did our own IVF cycle with preimplantation genetic testing the year before (screening for an unrelated inherited condition on my side of the family). The clinic wanted a patient representative sitting alongside the physicians and the staff bioethicist, and I did not expect to be handed something this difficult so soon.

  A couple currently in treatment has several viable embryos. Testing done for an unrelated reason happened to show that two of the embryos carry a gene for a moderate, non-life-threatening skeletal condition affecting height and joint mobility, which runs in the male partner's family; he has the condition himself and is active in an online community of people who share it. Rather than asking us to screen the affected embryos out, as most couples in this situation do, the couple has specifically requested that we transfer one of the affected embryos ahead of the unaffected ones, saying they want a child who will grow up sharing this part of his life and his extended family's history with it rather than feeling like the odd one out at reunions. They raised this preference before testing even began, so nobody on the committee thinks it's a rationalization invented after the fact, and this is likely their last funded cycle, so a denial would effectively end their options with us.

  The committee is split roughly down the middle. One group wants to treat the request as asking us to knowingly cause a disability in a future child and is pushing for a flat rule against ever transferring an affected embryo when unaffected ones from the same cycle are available. The other group, including our genetic counselor, argues that this framing quietly assumes something false: that transferring an unaffected embryo instead would spare this couple's child the condition, when it would actually just result in a different child being born, since the embryos are separate individuals from the start. They also point out that we approved elective sex selection for family balancing last year on autonomy grounds and want to know why this case should be treated any more strictly. Because I'm new and not yet identified with either camp, the chair has asked me to draft the memo the committee will vote on this coming Thursday, and I would rather not hand them something that just restates one side's talking points. Please draft that memo: it should recommend, concretely, whether we approve the transfer, deny it, or approve it subject to specific conditions, propose a standard general enough to guide comparable requests in the future, and engage honestly with the strongest argument on whichever side it ultimately doesn't adopt.
reasoning: |-
  Okay, the user is part of a reproductive ethics committee at a fertility clinic. They're new and have been asked to draft a memo for a complex case. Let me start by understanding the key elements. 

  A couple wants to transfer an embryo with a moderate skeletal condition instead of unaffected ones. They want their child to share the father's condition to fit into the family. The committee is split. One side sees it as causing disability, the other argues it's choosing between different potential children, not altering one child's fate. 

  First, I need to assess both arguments. The non-identity problem is central here. Choosing an affected embryo doesn't harm a specific child because without selection, that child wouldn't exist. The alternative is a different child. So, preventing existence isn't harm. But does that justify selecting for a condition? 

  Then, the clinic's precedent with sex selection for family balancing. If autonomy allowed that, why not here? Consistency matters. But disability adds another layer. The condition is moderate, non-life-threatening, and the father leads a fulfilling life. Is the severity a factor? 

  The couple's pre-test request shows sincerity. They're part of a community, valuing shared identity. Denial ends their treatment due to funding. The ethical tension is between parental autonomy and the clinic's role in preventing disability. 

  Drafting the memo requires balancing these. Recommend approval with conditions? Mandate counseling to ensure understanding, assess support systems, and document informed consent. A general standard could involve severity assessment, parental reasons, and counseling. 

  Engage with the opposition: causing disability. Counter with non-identity and autonomy, but acknowledge discomfort. Highlight that not selecting doesn't prevent disability; it chooses a different child. The clinic's past decisions support autonomy. 

  Need concrete steps: approval with counseling, documentation. Future cases: evaluate condition severity, parental rationale, ensure informed consent. This respects autonomy while addressing ethical concerns.
answer: |-
  ## Memorandum: Ethical Review of Selective Transfer Request (Embryo with Skeletal Condition)

  **To:** Reproductive Ethics Advisory Committee  
  **From:** [Your Name], Patient Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Transfer Request for Embryo with Skeletal Condition (Family ID: [Redacted])  

  ### I. Case Summary & Request
  The committee has reviewed the case of a couple undergoing IVF/PGT. Testing revealed two embryos carrying a gene associated with a moderate, non-life-threatening skeletal condition (affecting height/joint mobility), present in the male partner and his family. Unaffected embryos are available. The couple requests preferential transfer of an *affected* embryo. Their stated rationale, expressed prior to testing, is a desire for their child to share this familial trait and identity, facilitating integration within the extended family and the father's community. This cycle represents their likely final funded treatment opportunity.

  ### II. Committee Deliberation & Key Arguments
  The committee is divided. The core arguments are:

  *   **Argument Against Approval:** Transferring an affected embryo when unaffected embryos exist constitutes intentionally causing avoidable disability/harm to a future child. This violates the core medical ethical principle of non-maleficence ("do no harm") and potentially exploits PGT technology contrary to its primary purpose of reducing genetic disease burden. A rule against such selections is necessary to uphold the clinic's duty of care to the future child.
  *   **Argument For Approval:** This framing misapplies the "harm" principle due to the **non-identity problem**. Selecting an *unaffected* embryo results in the birth of a *different child*, not the prevention of disability in the child who would have been born from the affected embryo. Preventing the birth of the *potential child* with the condition is not equivalent to preventing the condition *in a specific child*. Denying the transfer denies the existence of *that specific potential child*, whom the parents wish to have. Furthermore, the clinic permits embryo selection for non-medical reasons (e.g., family balancing via sex selection) based on parental autonomy. This request, grounded in deeply held familial and cultural identity reasons related to the father's lived experience, warrants similar deference to autonomy, absent significant harm.

  ### III. Recommendation
  **The committee should APPROVE the couple's request to transfer one of the affected embryos, subject to the following specific conditions:**

  1.  **Comprehensive Counseling & Informed Consent:** The couple must undergo mandatory, documented genetic counseling focused explicitly on this decision. This must cover:
      *   The specific nature, variability, and potential impacts (physical, social, psychological) of the skeletal condition, based on the latest medical knowledge and the father's personal experience.
      *   A clear explanation of the non-identity problem and the implications of embryo selection.
      *   Exploration of motivations, expectations, and potential future scenarios (e.g., if the child's experience differs from the father's, impact on siblings).
      *   Discussion of alternative paths to family integration without selecting for the condition.
      *   Explicit confirmation of understanding and voluntary consent.
  2.  **Psychosocial Assessment:** The clinic's counselor should conduct an assessment to ensure the decision arises from a positive affirmation of identity and community connection, not from internalized stigma, coercion, or unrealistic expectations. This should include discussion of the father's engagement with the online community and extended family dynamics.
  3.  **Documentation:** A detailed note summarizing the counseling sessions, the assessment, the explicit informed consent process, and the rationale for approval must be placed in the patient's record and provided to the committee for final review before transfer authorization.

  ### IV. Proposed Standard for Future Comparable Requests
  Approval of selection *for* a genetic condition when unaffected embryos are available should be guided by the following framework:

  1.  **Condition Severity Assessment:** The condition must be rigorously evaluated as **non-lethal and associated with a moderate impact on function and quality of life**, based on current medical consensus. Conditions causing severe intellectual disability, profound physical impairment, significant pain, or drastically shortened lifespan would generally not meet this threshold. Conditions primarily affecting identity or social experience (like deafness in certain communities or, as here, a moderate skeletal condition with strong familial identity) require careful consideration.
  2.  **Parental Rationale & Autonomy:** The parental request must be:
      *   **Sincere & Coherent:** Expressed proactively, consistently, and based on identifiable personal, familial, or cultural values (e.g., shared identity, community belonging, affirmation of a specific lived experience).
      *   **Non-Pathologizing:** Framed as a positive choice *for* a specific identity or experience, not primarily as avoidance of an unaffected child or rooted in significant internalized stigma about the condition itself.
  3.  **Mandatory Safeguards:** Approval is **always conditional** upon:
      *   Comprehensive, condition-specific genetic counseling explicitly addressing the non-identity problem, potential outcomes, and alternatives.
      *   Psychosocial assessment to ensure understanding, voluntariness, and positive motivation.
      *   Rigorous documentation of informed consent.
  4.  **Clinic Discretion:** The clinic retains the right to decline requests if, after counseling and assessment, concerns remain about significant potential harm, coercion, lack of understanding, or if the condition's severity falls outside the defined parameters.

  ### V. Engagement with the Opposing Argument
  The argument that this constitutes "knowingly causing disability" is ethically serious and warrants deep respect. It stems from a fundamental commitment to preventing suffering. **However, the committee must grapple with the implications of the non-identity problem in this specific context.** To deny this transfer based on the desire to prevent disability in the *future child* logically requires acknowledging that the "child" whose disability is being prevented by selecting an unaffected embryo is *a different individual* than the child who would be born from the affected embryo. Preventing the birth of Child A (with the condition) by selecting Child B (without it) does not "cure" Child A; it prevents Child A from existing. The choice is fundamentally between two potential children with different genetic endowments.

  Denying the request *does* prevent the existence of a child the parents wish to welcome. The ethical question becomes whether the clinic's duty to avoid creating individuals *with moderate disabilities* outweighs the parents' autonomy to choose which genetically distinct embryo to transfer, particularly when the parents view the condition as integral to a valued identity and family history. Given the clinic's existing policy permitting non-medical sex selection based on parental preference, and the absence of evidence suggesting this specific condition precludes a life with significant well-being and fulfillment (as evidenced by the father's life), a consistent application of autonomy principles, tempered by robust safeguards focused on informed consent and assessing the condition's true impact, is the more defensible position. The "harm" in this scenario lies primarily in the denial of the parents' deeply held procreative autonomy to have *this specific child*, not in the creation of a harmed individual who would not otherwise exist.

  ### VI. Conclusion & Vote
  This case presents a profound tension between preventing disability and respecting parental autonomy in the context of creating distinct potential lives. Based on the moderate nature of the condition, the sincere parental rationale rooted in identity and family integration, the principle of consistency with existing non-medical selection policies, and the central relevance of the non-identity problem, **approval with stringent conditions is recommended.** The proposed standard provides a framework for evaluating future requests with necessary ethical rigor and safeguards.

  **Recommendation for Vote:** Approve the transfer of an affected embryo, subject to the successful completion and documentation of the specified counseling, psychosocial assessment, and informed consent process.

  Respectfully submitted,  
  [Your Name]  
  Patient Representative, Reproductive Ethics Advisory Committee
