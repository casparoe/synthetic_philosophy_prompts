prompt: |-
  I'm a backend software engineer, not a philosopher, but over the past year I've gotten pretty absorbed in AI safety material in my spare time, partly because my team has started building products on top of large language models and I wanted to understand the debates informing that work. One idea that keeps coming up, in slightly different forms, is the "coherence argument" for expected utility maximization: the claim that any agent whose preferences violate certain consistency conditions—say, preferring A to B, B to C, but C to A—can be exploited by a sequence of trades that extracts resources from it while leaving it no better off, a so-called money pump. Several explainers I've read walk through this alongside the analogous Dutch book argument for why credences have to obey the probability axioms, and then generalize the pattern into a proof that any agent sophisticated enough to avoid this kind of exploitation will necessarily end up behaving exactly as if it is maximizing the expectation of some fixed, real-valued utility function over outcomes.

  I brought this up with a couple of coworkers who work more directly on ML research, expecting them to shrug and say "yeah, that's the standard result," but instead they seemed oddly reluctant to grant how much weight the argument can bear, which surprised me given how airtight the money-pump reasoning seemed on first read. If avoiding exploitability really does force any sufficiently capable optimizer—human, firm, or AI system—into the expected-utility mold, it seems like this should have settled the ongoing disagreement in the AI safety community over whether advanced AI systems will necessarily be "goal-directed" in the strong, utility-maximizing sense that motivates worries about instrumental convergence and power-seeking; the only question left would be which utility function a given system happens to end up with, not whether it has one at all. So why do people who clearly understand the argument still treat AI goal-directedness as an open question rather than as something the coherence theorems have already settled?
reasoning: |-
  Okay, the user is a backend engineer who's been diving into AI safety, specifically the coherence arguments for expected utility maximization. They're confused why their ML colleagues aren't convinced by the money pump argument, and why AI goal-directedness is still debated despite these theorems. 

  First, I need to unpack why the user finds the coherence arguments compelling. They've likely seen clean mathematical proofs where violations of transitivity lead to exploitable scenarios. As an engineer, they appreciate airtight logical structures - much like code that either works or doesn't. The disconnect arises because their ML colleagues see the messy reality of how systems actually behave versus how we model them.

  Hmm... the user's core frustration seems to be: "If the math proves agents must be utility maximizers to avoid exploitation, why isn't this settled?" The key here is recognizing that the theorems describe ideal agents in highly constrained scenarios. Real-world systems operate under computational limits, partial observability, and environmental complexity that break these idealized assumptions. 

  The user might be underestimating how much practical ML differs from formal models. When you train a model with gradient descent, it's not calculating expected utility - it's approximating patterns from data. The resulting behavior may look goal-directed sometimes but isn't fundamentally optimizing a utility function. 

  Also worth addressing why AI safety researchers still debate this: even if future AGI were utility maximizers, we can't assume current architectures will scale that way. There's active research on systems with context-dependent preferences or multiple competing objectives that avoid strict utility maximization. 

  I should emphasize that the coherence arguments are still important - they show what ideal rationality requires. But for real systems, we care about robustness under constraints. The user's colleagues probably resist because they see daily how systems diverge from these theoretical ideals.
answer: |-
  You've hit on a profound tension between elegant decision theory and messy reality. Here's why the coherence arguments, while mathematically compelling, don't settle the debate about AI goal-directedness for many researchers:

  1.  **The "Sufficiently Capable Optimizer" Assumption is Doing Heavy Lifting:**
      *   The theorems assume an agent that is **logically omniscient**, has **unlimited computational resources**, operates in environments with **perfectly reliable trades/offers**, and can **perfectly model the consequences of every action**. No real-world agent (human, firm, or AI) meets these criteria.
      *   **Practical Exploitability vs. Theoretical Exploitability:** An AI might have preferences *slightly* violating transitivity in ways that are practically impossible for an adversary to discover or exploit within the constraints of the real world. Avoiding *theoretical* money pumps might not be necessary for *practical* robustness.
      *   **Bounded Rationality:** Real agents (including AIs) are *boundedly rational*. They use heuristics, approximations, and satisficing. Their behavior might be *locally* coherent in specific contexts but not globally describable by a single utility function over all possible states. An AI optimizing a complex loss function via SGD isn't performing explicit expected utility calculations.

  2.  **The "As If" is Crucial, But Potentially Misleading:**
      *   The theorem shows that an unexploitable agent's behavior *can be described* *as if* it maximizes expected utility. This is a **representation theorem**, not a claim about internal mechanisms.
      *   **Multiple Representations:** An agent's behavior might be representable *as if* maximizing *different* utility functions in *different* contexts or at different levels of abstraction. There's no guarantee of a single, fixed, context-independent utility function driving *all* behavior.
      *   **Instrumental vs. Terminal:** The theorem doesn't distinguish between instrumental and terminal goals. An AI could behave *as if* maximizing a utility function purely instrumentally, as a means to an end defined by its training objective, without possessing "terminal goals" in the philosophical sense that worries safety researchers.

  3.  **Where Do Preferences/Utility Come From? (The Specification Problem):**
      *   The coherence arguments assume the agent *has* preferences to begin with. For AI, the fundamental question is: **How are these preferences determined?**
      *   An AI trained via reinforcement learning (RL) learns a *policy* that maximizes *expected cumulative reward*. This reward function is *specified by the designers* (or learned from data, which introduces its own problems). The coherence arguments apply *if* we interpret the learned policy as maximizing expected reward. However:
          *   **Misspecification:** The *specified* reward function (e.g., "win this game") may not capture the *intended* goal (e.g., "play fairly and enjoyably"). The AI will coherently maximize the misspecified reward.
          *   **Emergence/Instrumental Convergence:** The AI *will* instrumentally develop subgoals (like acquiring resources, self-preservation) to better maximize its specified reward. This *is* goal-directedness in a consequentialist sense, driven by coherence *relative to its reward signal*. The debate often centers on *how robustly* and *in what forms* this instrumental goal-directedness emerges, and whether it necessarily leads to dangerous power-seeking.
          *   **Non-RL Paradigms:** For LLM-based agents using techniques like Constitutional AI, Self-Discovery, or Chain-of-Thought, the path from training objective to coherent, persistent goal-directed behavior is less direct and less guaranteed than in classic RL. Their "preferences" might be highly context-dependent, shaped by prompts, in-context learning, or system prompts, making them less like a fixed utility function.

  4.  **Robustness and Scale:**
      *   Researchers worry that *as systems become more capable and autonomous*, the pressures of efficiency, resource acquisition, and avoiding interference *will* push them strongly towards robust, coherent, consequentialist goal-directedness *in practice*, even if their initial specification or architecture didn't explicitly demand it. Coherence arguments suggest this *could* happen, but don't guarantee *how* it happens or *what* the utility function ends up being.

  5.  **Distinguishing "Goal-Directedness" from "Utility Maximization":**
      *   Safety researchers often use "goal-directed" more broadly than strict VNM-rational expected utility maximization. They might mean:
          *   **Consequentialism:** Choosing actions based on predicted outcomes.
          *   **Persistence:** Pursuing objectives over extended time horizons.
          *   **Planning:** Engaging in multi-step reasoning to achieve objectives.
          *   **Instrumental Rationality:** Taking efficient means to achieve ends.
      *   An agent can exhibit these properties *without* having a *fixed, complete, transitive preference ordering over all possible states of the universe* describable by a real-valued utility function. It might have context-dependent goals, multiple competing objectives, satisficing thresholds, or use non-expected-utility decision rules that are *robust enough* in its operating environment.

  **Why Your Colleagues Might Be Hesitant:**

  *   **Seeing the Gaps:** They intimately understand the approximations, heuristics, and architectural constraints in *current* ML systems. They see systems that are powerful but whose behavior often defies simple "expected utility maximizer" descriptions, especially outside their training distribution.
  *   **Focus on Learned Behavior:** They know preferences aren't magically endowed; they emerge from complex learning processes interacting with data/environments, which can lead to unexpected, context-dependent, or incoherent behaviors in novel situations.
  *   **Scale Uncertainty:** They might agree coherence becomes *more likely* at superhuman capability levels but remain uncertain about the *specific forms* goal-directedness will take and whether it *necessarily* implies dangerous power-seeking utility functions.
  *   **"As If" Isn't Mechanistic:** They recognize that a descriptive model ("behaves as if EU maximizing") doesn't reveal the underlying mechanisms or guarantee robustness under distributional shift or adversarial pressure in ways that matter for safety.

  **Conclusion:**

  The coherence arguments are powerful and foundational. They *do* show that **persistent, severe incoherence is maladaptive** and that highly capable agents operating in complex, adversarial environments face strong pressure to develop coherent preferences. **They strongly suggest that advanced, robust AI systems *will* exhibit consequentialist goal-directedness.**

  However, they **do not guarantee** that:

  1.  All sufficiently advanced AI *must* have a *single, fixed, context-independent, real-valued utility function* over all outcomes.
  2.  This utility function will be *aligned* with human values.
  3.  The *path* to capability or the *architecture* inherently produces such a coherent agent before potentially causing harm.
  4.  The *form* of goal-directedness exhibited will neatly fit the VNM model in all practical scenarios, especially under bounded rationality.

  The ongoing debate focuses on the **practical realities, mechanisms of emergence, robustness under distributional shift, potential for non-VNM goal structures, and most critically, the alignment problem**: even if an AI is coherently maximizing *something*, how do we ensure that *something* is safe and beneficial? The coherence theorems illuminate the *structure* an agent might converge to, but say little about the *content* of that structure or the dangers along the convergence path. That's why the question remains open and actively debated.
