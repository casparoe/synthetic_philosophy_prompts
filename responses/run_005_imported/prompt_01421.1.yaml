  First, I need to unpack Rawls's "logically prior" argument. He compares promising to baseball: rules exist before any particular game. Similarly, the practice of promising defines what a promise is and the obligations it creates. Individuals can't opt out of the rules case by case; that would undermine the practice. For Rawls, justifying the practice (utilitarian benefits of reliability) is separate from justifying individual acts within it. In private promises, even with no social consequences, the obligation holds because the practice rules exclude utilitarian calculations for individual promises.

  The user's students are bothered by this. Why should a private promise bind if there's no social fallout? Rawls's answer seems circular: the practice forbids weighing consequences, so you can't. But that doesn't explain why the obligation feels just as strong. The user wants me to argue that this fails, especially in cases like deathbed or desert island promises, and to show why the "logically prior" move doesn't save the practice theory. Then, I need to offer an alternative, like expectation-based obligations or normative powers, and commit to one.

  To challenge Rawls, I should focus on the internal logic of his theory. The practice defines the rules, but in a totally private promise, the practice isn't doing any work. The son's promise to his father exists outside the social framework—no reputational risk, no enforcement. Rawls says the practice's rules still apply, but why? If the practice's purpose is social coordination, and here it's irrelevant, insisting on its rules seems arbitrary. The "logically prior" claim might not hold because the concept of a promise could exist independently of a social practice through interpersonal commitment.

  I can use the desert island example: two people, no society, one promises to share food. If they break it, no social consequences, yet it feels binding. Rawls would say the practice still applies, but that's implausible. The practice isn't sustaining the obligation; it's the act of committing to another person. The obligation arises from the promisee's reliance and the promisor's intentional creation of an expectation, not the social institution.

  For the alternative, I'll go with the expectation-based view, drawing on Scanlon. Promissory obligation comes from the moral duty not to create and then betray expectations. When you promise, you invite trust; breaking it is a betrayal, which is wrong independently of any social practice. This explains private promises: the son creates an expectation in his father, and breaking it harms him by betraying that trust. The normative force is in the interpersonal relation, not the practice.

  I need to ensure I engage with "logically prior." Rawls says you can't have a promise without the practice, like you can't steal a base without baseball rules. But in private promises, the promisee understands the commitment as binding because of the personal assurance, not social rules. The concept of a commitment can exist without a practice; it's a basic moral capacity. So, the practice isn't logically prior—it's a codification of a pre-existing moral norm.

  Finally, I'll structure the response: first, show why Rawls's answer fails in private cases; second, argue that "logically prior" doesn't rescue it; third, present the expectation-based alternative as superior. Keep it concrete and avoid listing options; stick to one alternative. The user wants depth, so I'll delve into why the practice isn't necessary and how expectation handles it better.
answer: |-
  Here's an argument against Rawls's practice-based account, specifically targeting his response to the deathbed promise case and the "logically prior" claim, followed by a committed alternative:

  ### Why Rawls's Answer Fails in the Deathbed/Desert Island Case
  Rawls insists the son's obligation stems solely from the *practice rules themselves*, which prohibit case-by-case utilitarian calculation. He argues that the "logically prior" practice defines the very possibility of promising and its obligations, rendering individual discretion illegitimate *by definition*. However, this move collapses into circularity or irrelevance in truly private promises:

  1.  **The Practice Provides No *Actual* Normative Force in Isolation:** In the deathbed case (or a classic desert island promise between two people with no society), the *social practice* of promising is functionally absent. There's no threat of sanction, no reputational mechanism, no reliance on general expectations to stabilize interactions. The practice's *justification* (its utility in maintaining social order and trust) simply doesn't apply here. Rawls says the son lacks "standing" to calculate consequences *because the practice forbids it*. But *why* does the practice's prohibition bind the son *when the practice itself serves no purpose in this context*? To say "the rules forbid it" is merely to restate the rule, not to provide a reason *why* it should bind absent the practice's justifying purpose. The "logically prior" claim becomes a hollow shell – the *form* of the rule exists, but the *substance* of its normative force (derived from the social good) is missing.

  2.  **The "Logically Prior" Move Confuses Definition with Normative Source:** Rawls is correct that the *concept* of a "strikeout" requires the rules of baseball. Similarly, the *concept* of a "promise" might imply a background framework. However, this confuses the *definitional conditions* for calling an act a "promise" with the *source of the normative obligation* incurred *by* making one. Even if we grant that labeling an act a "promise" requires a social context (debatable, see below), it doesn't follow that the *obligation* it creates *must* derive solely from the social practice. The deathbed case exposes this: we can *recognize* the son's utterance *as* a promise *and* feel its binding force *even while acknowledging the social practice is inert*. The "logically prior" practice defines the *type* of act, but it doesn't necessarily *exhaust* the source of the obligation generated *by performing* that act interpersonally. Rawls conflates the ontology of the act-type with the genesis of the obligation.

  3.  **It Renders the Obligation Mysterious and Fails the Intuition Test:** Rawls's account leaves the *felt* obligation in the deathbed case unexplained. If the sole source of obligation is participation in a socially justified practice, and that practice provides no tangible benefit or enforcement mechanism in *this* instance, *why* does the son feel bound? Why does the father feel wronged if the promise is broken? Rawls's answer – "because the rules say so" – feels inadequate. It doesn't capture the deeply *personal* wrong of betraying a specific trust placed in *you* by *this specific person* in a moment of vulnerability. The practice theory cannot account for the direct, dyadic moral force that persists even when the social scaffolding is removed.

  ### What Actually Does the Binding Work: The Deliberate Invitation of Reliance (Expectation-Based Obligation)
  The binding force of a promise, especially in private cases, stems primarily from the **deliberate creation of expectation and the normative implications of inviting reliance.**

  1.  **The Core Mechanism:** When A promises B, A *intentionally* performs an act designed to make B believe A will do X. A *invites* B to rely on this future performance. This act has intrinsic moral significance:
      *   **Intentionality:** A *means* to induce B's reliance. This isn't accidental.
      *   **Vulnerability:** By inviting reliance, A creates a situation where B is potentially worse off if A reneges (disappointment, frustration, practical loss, betrayal of trust).
      *   **Normative Trigger:** Intentionally creating a justified expectation of future action in another, thereby making them vulnerable to your choices, generates a prima facie obligation to fulfill that expectation. To break the promise is to *exploit* the vulnerability one has deliberately created – it's a form of manipulation or bad faith.

  2.  **Why This Explains the Deathbed/Desert Island Case:** The son *deliberately* tells his father he will do X, intending the father to believe him and to find solace or resolution in that belief. He *invites* the father's reliance, creating vulnerability (the father dies trusting his son). Breaking the promise is wrong *because* it betrays that specific invitation and exploits that specific vulnerability. The wrong is done *directly to the father*, not to the social practice. The desert islanders create reliance on each other. The obligation flows directly from the promisor's intentional act towards the promisee and the resulting normative relationship of induced reliance and vulnerability.

  3.  **Relation to Practice (Without Dependence):** Social practices of promising are powerful *tools* for creating clear, reliable expectations and managing reliance on a large scale. They standardize the "invitation of reliance," making it easier to recognize and enforce. However, the *fundamental moral obligation* arises from the deliberate interpersonal act of inviting reliance and creating vulnerability itself. The practice is a highly effective social *implementation* and *amplification* of this underlying moral dynamic, but it is not the *source* of the obligation. The deathbed promise works *without* the practice because it directly triggers the core moral mechanism: intentional invitation of reliance creating vulnerability.

  In conclusion, Rawls's "logically prior" practice cannot rescue his theory in the face of truly private promises because it fails to provide a *reason* for the obligation when the practice's justifying purpose vanishes, conflates the definition of an act with the source of its obligation, and leaves the intuitive moral force unexplained. The binding work is done by the promisor's deliberate act of inviting the promisee's reliance, thereby creating a specific vulnerability and incurring a direct obligation to that person to avoid betraying the trust they intentionally solicited. The practice is a scaffold built upon this interpersonal foundation, not the ground itself.
