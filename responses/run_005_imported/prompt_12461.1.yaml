answer: |-
  You've nailed a profound weakness in the "modern history" patch. Yes, it **fundamentally relocates the arbitrariness problem** it accuses Cummins-style theories of having, arguably without resolving it and potentially making it *more* problematic. Here's why:

  1.  **The Core Charge Against Cummins: Arbitrary System/Capacity Selection:**
      *   Causal-role (CR) functions are defined *relative to a chosen capacity of a chosen system*. The heart's CR function *could* be making thumping noises relative to the capacity "producing audible diagnostic sounds for physicians."
      *   Etiologists argue this makes functions subjective, ungrounded in biology, and "too liberal" – anything *can* be a function depending on the arbitrary choice of system/capacity. The "real" function, they claim, must be anchored in objective evolutionary history.

  2.  **The Modern History Patch & Its New Arbitrary Parameter:**
      *   Godfrey-Smith's modern history theory (MHT) says: A trait's function is the effect for which it was selected *in the recent past* (e.g., the last few thousand or million years, depending on context).
      *   **This introduces a new, critical, and fundamentally arbitrary parameter: "How recent is recent?"** There is no *principled*, non-arbitrary biological answer to this question. It requires a *choice*.

  3.  **Why This Choice is as Arbitrary (or Worse) as the CR Choice:**
      *   **No Biological Grounding:** Evolution doesn't operate on fixed time scales. Selection pressures change continuously. Defining a specific timeframe ("last 100,000 years," "since the Pleistocene," "since the trait reached its current form") is entirely external to the biological process itself. It's imposed by the theorist.
      *   **Demarcation Problems:** How do we handle traits under *ongoing* selection shift? Imagine wings gradually increasing in size over 500,000 years, improving flight incrementally but also slightly altering thermoregulation. When exactly does "thermoregulation" stop being the "recent" function and "flight" take over? The choice of timeframe dictates the answer arbitrarily.
      *   **Multiple Sequential Functions:** What about traits co-opted multiple times? If a structure had Function A (distant past), then Function B (intermediate past), and now Function C (very recent past), MHT prioritizes C. But why is the *most recent* past inherently more relevant to defining the trait's *current* function than the effect that built it (A) or the effect that maintained it through a long period (B)? The answer seems to be convenience ("we care about what it does now"), not a deep biological principle. This prioritization is itself an arbitrary choice.
      *   **Contrast with "Original Selection":** While pinpointing the *very first* selective effect can also be messy (what counts as "first"?), it at least appeals to a *singular historical event* – the initiation of the trait lineage. "Recent history" appeals to an amorphous and shifting *time window*. The arbitrariness of *which* window to choose feels more salient and less anchored than the (still difficult) task of identifying an origin point.
      *   **Relocation, Not Elimination:** MHT doesn't eliminate the need for an arbitrary selection; it just changes *what* is being selected. The CR theorist arbitrarily selects a *system/capacity*. The MHT etiologist arbitrarily selects a *timeframe* within the evolutionary history. Both choices significantly determine the functional attribution.

  4.  **How This Undermines the Etiologist's Selling Point:**
      *   The core etiological claim is to provide an *objective, historical grounding* for functions that avoids the perceived subjectivity and liberalism of CR theories.
      *   **MHT fatally compromises this objectivity.** By making function attribution dependent on the arbitrary choice of a "recent history" timeframe, it reintroduces a significant element of subjectivity/convention. The function is no longer determined *solely* by the trait's history; it's determined by history *plus* our decision about which chunk of that history counts as "recent" enough to matter *now*.
      *   **It fails to be significantly "less liberal."** While it might rule out *extremely* ancient functions (like thermoregulation for modern wings), within the plausible "recent" timeframe, multiple effects might have been under selection (e.g., flight efficiency *and* predator evasion *and* mate attraction via flight displays). Choosing *which* effect(s) within the "recent" window constitute the "function" still involves interpretation and potentially arbitrary emphasis, echoing the CR problem of selecting *which* causal role is significant. The timeframe choice itself dictates which effects are even candidates.

  **Conclusion:**

  You are absolutely right. Godfrey-Smith's modern history theory, while solving the specific problem of exaptation (allowing wings to be "for flight"), does so by introducing a new parameter – "recent history" – that is **fundamentally arbitrary in its definition and application.** This arbitrariness:

  *   Is directly analogous to the arbitrariness the etiologist charges the CR theorist with regarding system/capacity selection.
  *   Potentially makes the functional attribution *more* unstable and context-dependent than the original etiological focus on origin (which, while also messy, at least targeted a specific *event*).
  *   Fatally undermines the etiological claim to provide a uniquely objective, non-arbitrary grounding for biological functions. The choice of timeframe becomes a theoretical convention, not a discovery of a biological fact.

  MHT successfully handles exaptation cases pragmatically, but it does so by sacrificing the very strict objectivity that was the main selling point of etiological theories over Cummins-style approaches. The arbitrariness isn't eliminated; it's merely shifted from the choice of system/capacity to the choice of timeframe.
