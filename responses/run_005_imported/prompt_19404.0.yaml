answer: |-
  Here's a 4-5 minute toast that weaves the philosophy in naturally, lands emotionally, and gets laughs without a lecture – focusing on what makes *this* couple unique:

  **(Clink glass gently)** Friends, family, fellow survivors of graduate school dinners... thank you all for being here to celebrate [Bride] and [Groom]. It’s an absolute honor to stand up here. When [Bride] asked me to do the toast, my first thought was, "Easy! I’ve got a decade’s worth of embarrassing stories!" Then I remembered her fiancé. **(Look at Groom, smile knowingly)** [Groom], my friend, you are brilliant, kind, and you have a terrifyingly specific superpower: you can turn a simple question about passing the salt into a 45-minute discourse on the metaphysics of condiment transfer.

  **(Light laugh)** Case in point: remember that dinner where I naively asked about your Master's thesis? "Oh," I thought, "Promises! Like, pinky swears? Scout's honor?" **(Mimic wide-eyed innocence)** Two hours later... I emerged blinking into the moonlight, my brain full of Hume, Scanlon, and the unsettling realization that I might have been accidentally violating moral philosophy every time I said, "Yeah, I’ll totally call you tomorrow."

  **(Pause for laugh)** For those blissfully unaware: [Groom] basically studied *why* a promise is a big deal. Is it because society has these grand, invisible rulebooks we all agree to – like the rules of chess? You say "I promise," and *boom*, the obligation clicks into place because the ‘game’ demands it. Or… **(Lean in conspiratorially)** ...is it something deeper? Is it because when you look someone in the eye and say those words, you’re deliberately inviting them to trust you, to *rely* on you? And breaking that isn’t just breaking a rule, it’s breaking *their* heart, their plans, their faith?

  **(Shift tone to warm, focus on couple)** Now, most couples walk down the aisle, say their vows, and *that’s* when the grand social machinery of marriage officially kicks in. The rulebook snaps open! The practice begins! Hume high-fives society! **(Gesture vaguely)** But here’s the beautiful, hilarious, and deeply true thing about [Bride] and [Groom]: they’ve been operating on Scanlon-levels of personal commitment since roughly their third date. **(Look at Bride)** [Bride], remember when he promised he’d *learn* to appreciate your bizarre fascination with competitive miniature golf documentaries? **(Look at Groom)** [Groom], remember when she promised she wouldn’t judge your elaborate spreadsheet system for optimizing breakfast cereal rotation? These weren't just casual 'maybes'. You looked at each other, you *meant* it. You invited each other to rely on that.

  **(Pace slightly, build)** Their relationship hasn't been waiting for today's ceremony to become 'real' or 'binding'. Long before the ring, the venue booking, or even the terrifying moment [Groom] probably tried to explain his thesis to [Bride]'s grandma... they were building obligations brick by brick through a thousand tiny, unofficial promises. "I promise to pick you up when your flight lands stupidly late." "I promise to listen, even when it's about your weird dream involving sentient office supplies." "I promise to be there when things are tough." "I promise to celebrate the ridiculously small wins." They created expectations in each other. They made each other *rely*. And they kept showing up. Scanlon would be nodding furiously right now. Probably muttering about 'justified expectations' and 'the duty of fidelity'. **(Wave hand dismissively)** Don't worry, that's the last name-drop, I promise! **(Wink)**

  **(Soften, heartfelt)** So what does today mean, then? If the obligation, the deep reliance, the *real* promise was already there? **(Pause)** Today isn't the *start* of their commitment. It's a magnificent, joyful, slightly over-catered **celebration** of it. It’s them standing before everyone they love – **(Gesture around)** – not to *create* the obligation through some grand social ritual... but to *honor* it. To shine a spotlight on the profound trust they’ve already built, brick by tiny, reliable brick. It’s their way of saying, "Look! See this incredible thing we’ve made through showing up for each other, day after day? We’re so proud of it, we want you all to witness it, bless it, and maybe help us eat this cake."

  **(Raise glass)** So, to [Bride] and [Groom]: You two didn’t need society’s rulebook to teach you how to bind yourselves to each other. You figured out the deepest truth: that promising is about building a future together, deliberately, reliably, one shared expectation at a time. You’ve already proved the philosophers right – and wrong – by simply loving each other well. Today, we celebrate not the beginning of your promises, but the beautiful, enduring weight of the ones you’ve already kept. May your life together continue to be filled with laughter, deep understanding, unwavering support, and perhaps slightly shorter philosophical explanations over dinner. Cheers!

  **Why this works:**

  1.  **Accessible & Funny:** Opens with relatable humor about the groom's intensity and the listener's confusion. Uses simple analogies (chess, rulebooks) and funny, specific couple examples (mini-golf docs, cereal spreadsheets) instead of jargon.
  2.  **Philosophy as Structure, Not Lecture:** Clearly frames the Hume (social practice) vs. Scanlon/reliance (personal trust) split in the first half, using it to set up the *contrast* with the couple's actual behavior. The names are dropped early and contextually, then left behind.
  3.  **The Insightful Pivot:** The core of the toast is the *revelation* that their relationship *already* embodied the deeper (Scanlon/reliance) view *long* before the wedding. This makes the philosophy serve a point *about them*.
  4.  **Emotional Payoff:** Connects the philosophy directly to their love story. The "thousand tiny, unofficial promises" section is warm and specific. The conclusion reframes the wedding as a celebration of *existing* commitment, which is both unique and deeply romantic.
  5.  **Satisfies Both Audiences:**
      *   **Aunts & Coworkers:** Hear funny stories about the couple, witness a warm tribute to their love and commitment, get a clear (if simplified) idea of the "promise" concept without feeling lectured. The emotional core resonates.
      *   **Grad School Friends:** Immediately recognize the accurate (enough) framing of Hume vs. Scanlon. See the concepts cleverly used to highlight the couple's unique relationship dynamic. Appreciate the twist on the wedding as a celebration of pre-existing reliance. The "Scanlon would be nodding" line is a knowing wink.
  6.  **Landing on "True About Them":** The entire toast hinges on the specific observation of their long history of serious, unofficial promises, making the philosophical contrast meaningful and personal. It celebrates *their* way of building commitment.
  7.  **Flow & Timing:** The structure (hook -> explanation -> contrast -> couple's story -> reframing the wedding -> heartfelt conclusion -> toast) fits 4-5 minutes naturally. Humor is interspersed, building to the warm conclusion.

  **Remember to:**

  *   **Personalize:** Fill in the specific, funny examples of their "unofficial promises." The more real and quirky, the better!
  *   **Delivery:** Speak warmly, make eye contact with the couple and the audience. Pause for the laughs after the funny lines. Let the heartfelt section land sincerely.
  *   **Practice:** Time yourself! Adjust as needed to hit the 4-5 minute mark comfortably.

  This toast uses the philosophy not as decoration, but as a lens to reveal something genuinely special about how this particular couple built their love. Good luck! They'll love it.
