  First, I need to confirm the structural parallels. The tetralemma's four possibilities (true, false, both, neither) do map to Belnap's four values and Verilog's states. That's a solid observation. But the user might be equating structure with intent. Nāgārjuna wasn't building a logic system; he was deconstructing metaphysical claims. The key difference is purpose: logic systems handle incomplete/contradictory data, while Madhyamaka targets the inherent contradictions in any ontological position.

