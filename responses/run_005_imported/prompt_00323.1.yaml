prompt: |-
  I've been reading about P.F. Strawson's idea that our reactive attitudes -- resentment, gratitude, indignation -- are what actually ground moral responsibility, rather than any metaphysical fact about free will. As a software engineer, this makes me think of blame in incident postmortems and code reviews. Can you construct a concrete example, maybe a production outage caused by an engineer's mistake, where Strawson's framework says we're right to feel resentment toward them, even though a complete causal story (sleep deprivation, a misconfigured CI pipeline, an unreasonable deadline) fully explains why they made the error? I want an example that really sharpens the tension between preserving our reactive attitudes and the hard determinist's worry that nobody is ever truly responsible for anything.
