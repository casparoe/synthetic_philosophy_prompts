  Mechanism design comes to mind—it's about creating rules so parties are incentivized to act honestly. The Nash Bargaining Solution might be relevant here. It finds a fair split without needing all private info by using threat points (no-deal outcomes) as references. But how to apply it without disclosing costs?

  The user mentioned not trusting the partner's disclosures. So, any solution must work without verification. Perhaps a binding arbitration clause where both submit sealed bids of their minimum acceptable shares? But that still requires some disclosure. Hmm.

  Another angle: performance-based adjustments. Instead of fixed splits, tie payments to milestones or revenue tiers. That way, actual costs don't need to be revealed upfront. The larger company's costs are probably more stable, so the startup might accept their estimates if payments are based on measurable outputs.

