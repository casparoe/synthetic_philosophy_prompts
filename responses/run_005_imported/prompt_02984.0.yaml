  The user mentions the modern constitution view where the statue and the lump are distinct but coinciding. They wonder if Locke is suggesting something similar. Locke's key point is that "mass of matter" and "living body" are different kinds of things, so identity criteria differ. For masses, it's about the same particles; for living organisms, it's about the continuity of life. 

