  Additionally, the user's frustration suggests they want a clear, defensible counter without seeming dogmatic. Highlighting disjunctivist distinctions—relational vs. intrinsic properties, epistemic vs. metaphysical indistinguishability—can provide that. Emphasizing that disjunctivists accept the appearance but reinterpret its implications could resolve their confusion. They need to realize that rejecting the principle isn't churlish; it's a coherent alternative to the sense-datum theory's ontological commitments.
answer: |-
  You've hit on a crucial tension in perception philosophy! Your friend presents the classic argument from illusion compellingly, and disjunctivists like McDowell and Martin *do* have a sophisticated response. Crucially, they **reject the core inference rule driving the argument**, not the phenomenological observation that the oar *looks bent*. Here's what they deny, step-by-step:

  1.  **The Phenomenal Principle:** This is the *real* target. The argument relies on an implicit premise: **If something appears F to a subject S, then S is directly aware of something that *is* F.**
      *   Your friend uses it: "the oar looks bent" → "I must be directly aware of *something* bent" → "it can't be the oar (which is straight)" → "therefore, it must be some other bent thing (a sense-datum)".
      *   **Disjunctivist Rejection:** Disjunctivists categorically deny this principle. They argue that an object *appearing F* does *not* logically entail that *anything* you are directly aware of *is* F. Appearing F is a *relational property* of the object itself in that specific perceptual context, not proof of the existence of a mental object possessing F.

  2.  **The Analysis of "Looks Bent":**
      *   **Your Friend/Sense-Datum Theorist:** "Looks bent" means "I am directly aware of something that possesses the property of bentness."
      *   **Disjunctivist:** "Looks bent" means "The mind-independent oar *is presenting itself to me* in a way that is *visually similar to* how a genuinely bent oar *would* present itself under standard conditions." The oar itself, under *these specific conditions* (partially submerged in water), has the property of *looking bent*. This is a property of the *real oar-in-water*, not proof of an intermediary bent entity.

  3.  **The Nature of the Experience:**
      *   **Argument from Illusion:** The illusory experience (awareness of a bent sense-datum) and the veridical experience (awareness of a real bent oar) share a common, intrinsic experiential core (the "bent" appearance). This common element *is* the sense-datum.
      *   **Disjunctivist Rejection (Naïve Realist Core):** In the *veridical* case, the experience's nature is fundamentally constituted by the direct presentation of the mind-independent object and its properties. In the *illusory* case, the experience is fundamentally *different*: it is a case of the mind-independent object (the straight oar) *misleadingly presenting itself* as bent due to the distorting medium (water). While the two experiences are *subjectively indistinguishable* for the perceiver, their underlying metaphysical structures are *radically different* (hence "disjunctivism"). The illusory experience *lacks* the constitutive relation to an actually bent object that defines the veridical experience. The "bent appearance" in illusion is *not* the presence of a bent mental object; it's the *absence* of a successful relation to a bent physical object, replaced by a misleading presentation of a straight one.

  4.  **The Indistinguishability Move:**
      *   **Argument from Illusion:** Since illusion and veridical perception are subjectively indistinguishable, and illusion involves sense-data, veridical perception must also involve sense-data (the "highest common factor").
      *   **Disjunctivist Rejection (Epistemological Point):** Disjunctivists accept the *epistemic* indistinguishability (you can't tell introspectively which disjunct you're in). **But they vehemently deny that indistinguishability implies a common metaphysical core (sense-data).** They argue this move illegitimately infers ontology from epistemology. Just because two things are indistinguishable *to me* doesn't mean they share the same underlying nature. The disjunctivist holds that the veridical experience has a nature (direct awareness of the object) that the illusory experience *lacks*, even though I can't tell them apart by introspection alone. The "highest common factor" is purely epistemological (the subject's inability to discriminate), not ontological (a shared mental object).

  **What the Disjunctivist *Does* Grant & What They Reject:**

  *   **Grants:** The oar *looks bent*. The experience is subjectively indistinguishable from seeing a genuinely bent oar. The oar itself is straight.
  *   **Rejects:**
      *   The inference from "looks bent" to "directly aware of *something* bent".
      *   The Phenomenal Principle itself.
      *   That the "bent appearance" requires the existence of a bent *entity* (mental or otherwise).
      *   That subjective indistinguishability implies a shared metaphysical component (a sense-datum) in both veridical and illusory cases.
      *   That the illusory experience has the same fundamental structure (direct awareness of an object) as the veridical experience, just with a different object (sense-datum vs. oar). They see the illusory structure as fundamentally *different* (a misleading presentation).

  **In essence:** The disjunctivist agrees with the *phenomenology* ("it looks bent") but radically disagrees with the *ontology* the sense-datum theorist builds upon it. They argue the sense-datum theorist makes an unwarranted leap from how things *seem* to what *must exist* in the experience. They offer an alternative account where the mind-independent world itself, under specific conditions, has the power to present misleading appearances *without* generating mental objects possessing the apparent properties. The "bentness" is a property of the *presentation*, not a property of a *thing* presented (other than the real oar presenting itself misleadingly).

  It's not churlish to say it looks bent; it *does*. The churlish-seeming move is actually the sense-datum theorist's insistence that this *must* mean you're directly aware of a bent *thing*. The disjunctivist says that's where the unwarranted philosophical leap happens, not in the basic observation. Their rejection targets the core inference rule (Phenomenal Principle) and the ontology derived from it, not the raw subjective fact of the appearance.
