  The user's deeper struggle might be understanding how disjunctivism avoids the slippery slope to sense-data. They need to see that disjunctivists attack the foundational move: equating appearance with direct awareness of an object possessing that property. By reframing appearances as how objects manifest under conditions, not mental intermediaries, disjunctivists block the inference. Also, the indistinguishability point is key. Disjunctivists like Martin argue that indistinguishability doesn't prove identical mental states; it's epistemic, not metaphysical. So veridical cases remain direct perceptions. 

