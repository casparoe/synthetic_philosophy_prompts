answer: |-
  ## Dialogue: Reasons & Mud

  **Setting:** A worn armchair and a sturdy wooden chair face each other in a book-lined study. Rain taps gently against the window. **Alex** (defender of fitting-attitude analysis) sips tea. **Bailey** (critic) leans forward intently.

  **Bailey:** Alex, I’ve been wrestling with this fitting-attitude idea of yours – that something is good, or valuable, or admirable, *just because* it has features that give us reasons to have a pro-attitude towards it – to desire it, admire it, respect it. But I think I’ve hit a snag. Consider this: Imagine a powerful, eccentric billionaire offers me a fortune – life-changing wealth – *if* I can genuinely bring myself to *admire* this utterly ordinary, insignificant patch of mud right here. <*Bailey gestures vaguely towards the window*> Not because it’s special, but *just* to win the money.

  **Alex:** An intriguing, if bizarre, scenario. Go on.

  **Bailey:** Well, clearly, the prospect of winning that fortune gives me a powerful, genuine *reason* to want to admire the mud. It’s a prudential reason, a self-interested reason, but a reason nonetheless. According to your analysis, Alex, if something has features that provide reasons to favor it (like admire it), then it *is* admirable. Here, the mud has a feature – namely, *being the object whose admiration triggers a massive payout* – that gives me a decisive reason to admire it. So, by your lights, this utterly unremarkable mud becomes... *admirable*? That seems patently absurd. Admirable mud? Really? This can’t be right. It’s the *wrong kind of reason* making me want the attitude.

  **Alex:** <*Nods slowly, setting down teacup*> Ah, the infamous "Wrong Kind of Reasons" problem. A classic challenge, Bailey. But I think my analysis can weather it. You’ve hit upon the crucial distinction: not *all* reasons to have an attitude are reasons that speak to the *object's* value. Your reason – the financial incentive – isn’t grounded in any feature *of the mud itself* that might make admiration fitting or appropriate. It’s entirely grounded in the *consequences* of *having* the attitude of admiration. It’s a reason *for wanting to be in the state of admiring*, not a reason *provided by the mud* that *calls for* admiration.

  **Bailey:** Okay, I see the move: distinguishing reasons grounded in the *object's own features* ("object-given" or "fittingness" reasons) from reasons grounded in the *benefits or penalties of having the attitude itself* ("state-given" reasons). Only the former make the attitude *fitting* and thereby confer value on the object. The payout reason is state-given, so it doesn’t make the mud admirable. Neat. But here’s my worry: **How do you *draw* that distinction without smuggling in the very notion of value or fittingness you’re trying to analyze?** You say the *mud itself* has to provide the reason. But what *counts* as the mud providing the reason? Isn’t the *only* way to identify an "object-given" reason for admiration to already recognize that the object *possesses features that are admirable*? If I say the mud’s feature is "being linked to a payout," you dismiss it as not relevant to *admirability*. But how do you know it’s not relevant, except by already knowing what *is* admirable? Your distinction seems to *presuppose* an independent grasp of value-relevant features, making the buck-passing analysis circular.

  **Alex:** Hmm. That’s a deeper cut. I’d argue we can identify the *type* of feature relevant to an attitude without presupposing its *value*. For admiration, we look for features like excellence, achievement, nobility, beauty – characteristics that *merit* a response of esteem. The payout link isn’t that *type* of feature. It’s about my state, not the mud's quality.

  **Bailey:** But that feels question-begging. Why are *those* the relevant types? Isn’t it because we *already* understand admiration as a response *to* excellence, etc.? You’re still leaning on a prior understanding of the attitude's proper object. Let me press you further with a parallel case. Think about **belief** and Pascal’s Wager. Pascal argued that even if evidence for God’s existence is lacking, the potential infinite reward of belief (heaven) and the infinite penalty of disbelief (hell) give us a prudential reason to *believe* in God. It’s a powerful *state-given* reason – a reason to want to be in the state of belief because of its beneficial consequences.

  **Alex:** Yes, a structurally similar problem for the fitting-attitude analysis of *doxastic* justification – a belief is justified if there are reasons for it, but Pascal offers the wrong kind of reason.

  **Bailey:** Exactly. Now, can your distinction save the day here too? Can you say the prudential reason is "state-given," while only "evidence-given" reasons (reasons grounded in the truth of the proposition) make the belief *fitting* or justified? And crucially, **can you draw *this* distinction – between state-given and evidence-given reasons for belief – without already presupposing an independent understanding of what makes a belief justified (namely, being supported by truth-related evidence)?** If you need to presuppose the concept of evidential support to define the "right kind" of reason for belief, doesn’t that undermine the buck-passing ambition to *analyze* justification solely in terms of reasons? It seems the same circularity threatens.

  **Alex:** <*Leans back, steeples fingers*> You’re forcing me to sharpen the point. For belief, the relevant "object-given" reason isn't about the *belief-state's* consequences, but about the *content* of the belief – features indicative of its *truth*. We identify reasons as "evidence-given" by recognizing their connection to truth-conduciveness, which is constitutive of the belief attitude's aim. We don’t need a prior concept of *justification* to see that; we need the concept of belief *aiming at truth*.

  **Bailey:** But doesn’t saying belief *aims at truth* already give us a normative standard – that beliefs *ought* to track truth? Isn't *that* the core normative concept you were hoping to analyze *away* in terms of reasons? It feels like the buck stops, not with reasons, but with this prior normative aim or standard. Similarly, for admiration, isn't saying it *responds to excellence* already invoking a normative standard? How is "aiming at truth" or "responding to excellence" fundamentally different from the value concepts you're trying to reduce?

  **Alex:** <*Sighs, a thoughtful pause*> You’ve pinpointed the crux. Perhaps the buck-passing account doesn't eliminate normativity entirely, but locates it in the *nature of the attitudes themselves*. The 'right kind' of reason is defined relative to the *constitutive aim* or *internal standard* of the specific attitude – truth for belief, excellence for admiration, desirability for desire. The analysis then becomes: X is valuable (good, admirable, etc.) iff X has features that provide reasons of the *kind appropriate to* that pro-attitude, given its constitutive aim.

  **Bailey:** So, the buck is passed *to* reasons, but only *after* we've fixed what counts as the 'right kind' by appealing to the normativity inherent in the attitude types themselves? The analysis isn't purely reason-based; it's reason-plus-attitude-norm based.

  **Alex:** Essentially, yes. The fitting-attitude analysis needs that anchor. Without it, distinguishing right from wrong kind reasons seems arbitrary or circular. With it, the distinction gains traction: the payout reason doesn’t connect to the *aim* of admiration (esteeming excellence), just as Pascal's reward doesn't connect to the *aim* of belief (tracking truth).

  **Bailey:** Alright. So, to judge whether your distinction succeeds in saving the buck-passing analysis from the Wrong Kind of Reasons problem, we need to see if you can adequately explain two things *without* covertly relying on the very value concepts you're trying to analyze:

  1.  **The Nature of the Anchor:** Can you provide a satisfactory, non-question-begging account of the "constitutive aim" or "internal standard" of attitudes like admiration, desire, or belief? What makes truth the aim of belief, rather than just a frequent correlate? How is this aim normative?
  2.  **The Independence of the Distinction:** Can you identify what makes a reason "object-given" (or "evidence-given") *solely* by reference to this constitutive aim and the features of the object, *without* implicitly judging whether the attitude would be *fitting* or *correct*? Can the distinction be drawn purely from the 'direction of fit' or the functional role of the attitude, without smuggling in value?

  **Alex:** Precisely. That’s the gauntlet you’ve thrown down, Bailey. For the fitting-attitude analysis to truly solve the Wrong Kind of Reasons problem and deliver on its reductive promise, it must provide a compelling, non-circular account of the normative standards internal to our attitudes *and* show how the 'right kind' of reasons flow directly from an object's features in light of those standards, without presupposing the value they're meant to ground. The success of the distinction hinges entirely on whether that can be achieved. I have my work cut out for me.

  **Bailey:** <*Nods, a hint of a respectful smile*> And I’ll be right here, with my mud and my wagers, ready to see if you can pull it off. The challenge stands agreed: deliver *that*, and you might just save the buck. Fail, and the mud remains stubbornly unadmirable, no matter the fortune offered. Fair?

  **Alex:** Fair. Pass the biscuits? This requires fuel.

  **Bailey:** <*Passes the tin*/> Fuel for thought, indeed.
