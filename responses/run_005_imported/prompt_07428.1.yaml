answer: |-
  Here’s Priya’s toast, weaving the "wrong kind of reasons" problem into its structure while aiming for warmth, humor, and emotional payoff:

  **(Priya stands, clinking her glass. She smiles, but there’s a familiar intensity in her eyes – the look of someone about to dissect a concept.)**

  "Right. Okay. Deep breaths. For those who don’t know me, I’m Priya. Mara’s old officemate back in the grad school trenches. Twenty years… feels like yesterday we were arguing over Hume at 2 AM, fueled by terrible coffee and existential dread. And Theo… well, Theo was usually the one who’d eventually wander in, declare we were all missing the point, and somehow make us laugh about it. Usually while stealing Mara’s last biscuit. Some things," *(she nods towards Theo)* "never change."

  *(Small ripple of laughter. Priya takes a deliberate sip of her wine.)*

  "So. A toast. To Mara and Theo. Finally. *Finally*. We all saw the gravitational pull, even if the orbit was… elliptical. Cometary, even. Now, my particular corner of philosophy – fitting attitudes, reasons, value – it’s basically about *why* we feel things like admiration, or…" *(she gestures vaguely at the couple)* "...this profound, enduring commitment. *Why* do we value this thing, this *them*? What’s the *right reason*?"

  *(She leans forward slightly, her focus sharpening.)*

  "And here’s the rub, the demon on my shoulder – professionally speaking. Philosophers worry about the *wrong kind of reasons*. Imagine… imagine a terrifying Value Demon. It says, *‘Admire this completely worthless, tacky garden gnome… or I’ll set your dissertation on fire.’* You’d have a *reason* to admire the gnome – a very good, fire-avoiding reason! But it’s the *wrong kind* of reason. It doesn’t track the gnome’s actual *value*; it’s just coercion. The gnome is still objectively hideous. The *right kind* of reason comes *from* the thing itself – its beauty, its history, its meaning – and *that’s* what grounds genuine admiration, genuine value."

  *(She pauses, scanning the room. A few non-philosophers look politely confused. One of the cohort members, Alex, smirks into their drink.)*

  "And standing here, looking at you two… my brain, bless its obsessive little heart, immediately went into audit mode. *‘Priya,’* it said, *‘are you about to give reasons for why they’re perfect together that are the *right* kind? Reasons grounded in who Mara and Theo *actually are*? Or are they the *wrong* kind? Reasons born of… well, twenty years of orbiting each other? Shared history? Comfort? Habit? Sunk cost fallacy? The sheer bloody-mindedness of knowing each other *this* well and deciding, ‘Sod it, let’s make it official’?* Basically, the Value Demon of Time and Convenience whispering, *‘Just admire the gnome, it’s easier.’*"

  *(Mara raises an eyebrow. Theo chuckles.)*

  "See? They know me. So, let’s audit. Out loud. Because apparently, that’s how I roll at weddings."

  **Reason Attempt 1:** *"They complement each other perfectly!"* Okay, is this right-kind? Maybe. Mara’s fierce, focused intensity balanced by Theo’s… strategic chaos? His ability to diffuse her storms with a terrible pun? That *feels* intrinsic. But wait… is that just *functionality*? Like two gears meshing after years of grinding? Couldn’t *any* two people, stuck in each other's gravity well long enough, develop complementary coping mechanisms? Slippery slope towards wrong-kind territory. Rejected for now.

  **Reason Attempt 2:** *"They’ve stuck by each other through thick and thin!"* Ah, endurance! Admirable! But… is endurance *itself* the value, or a signpost? People endure terrible jobs, bad relationships, ill-advised haircuts, out of sheer inertia or fear of change. Is *this* endurance grounded in the *value* of the relationship, or just… endurance? The Value Demon of Sunk Cost looms large. Also rejected. Too shaky.

  **Reason Attempt 3:** *"Look how happy they make each other!"* *(Priya gestures at them. Mara is leaning into Theo, genuinely glowing. Theo has his arm around her, looking utterly content.)* Happiness! Pro-attitude central! But… is *this* happiness the *reason* for valuing the relationship, or the *result*? And crucially, is it happiness *because* of who the other person fundamentally *is*, or happiness born of familiarity, shared jokes, knowing exactly which takeaway to order? Couldn’t the Value Demon of Habit produce *this* specific brand of comfort? The wrong-kind specter is persistent…

  *(Priya sighs dramatically, running a hand through her hair. She looks directly at Mara and Theo.)*

  "This is why I don’t get invited to more parties. But then… I look at you. Not just *now*, radiating newlywed bliss, but the whole messy, two-decade arc. I remember Mara, sleep-deprived and furious over Kant, and Theo showing up with *actual* coffee, not the sludge we brewed, and just sitting silently with her until the storm passed. Not because it was convenient – he probably had his own thesis crisis brewing – but because *Mara* was in crisis. I remember Theo, adrift after that brutal job market year, and Mara *relentlessly* badgering her contacts, not out of obligation, but because she fundamentally believed in his weird, brilliant mind, even when he doubted it himself. I remember the *arguments* – oh, the glorious, pedantic, meta-ethical screaming matches! – that always ended not with a victor, but with a deeper, slightly exasperated respect. The way you challenge each other *because* you see the potential in the other, not to win."

  *(Her voice softens, loses the analytical edge.)*

  "The Value Demon of Habit doesn’t create *that*. The Demon of Sunk Cost doesn’t fuel *that* kind of attention, *that* kind of fierce, specific loyalty. Habit might get you through Tuesday. It doesn’t make you bring coffee during a Kant crisis. Sunk cost might keep you in orbit. It doesn’t make you fight for someone else’s dream. Convenience doesn’t generate… *this*." *(She gestures again at their quiet connection.)*

  "The right kind of reason… it doesn’t come from outside. It comes from the thing itself. And what I see, what I’ve *always* seen, even when you were driving each other (and the rest of us) mad, is that the value of *you two together* generates its *own* reasons. The reasons aren't imposed by time or convenience or fear of being alone. They flow *from* the sheer, undeniable, sometimes infuriating, but ultimately magnificent *reality* of who you are to each other. The demon loses. Spectacularly."

  *(She raises her glass, her smile wide and genuine now.)*

  "So, screw the audit. Here’s the right-kind reason, grounded entirely in the intrinsic value of the phenomenon before us: Mara and Theo, you are, quite simply, *for each other*. You always have been. Not because of time, or habit, or demons, but because together, you are more vividly, complexly, wonderfully *yourselves* than apart. Your value together generates the best possible reason: itself. And *that* is worth celebrating. To Mara and Theo!"

  **(Clinking of glasses, applause, possibly a relieved sigh from Alex in the corner.)**

  **Key elements addressed:**

  1.  **Philosophical Accuracy:** The core problem (distinguishing right/wrong kind of reasons via the Value Demon example) is clearly explained in accessible terms. Priya explicitly frames her "audit" using this structure.
  2.  **Dramatization:** The philosophy isn't namedropped; it *drives* the toast's structure and Priya's internal conflict. Her "auditing" of potential reasons demonstrates the problem in action.
  3.  **Character:** Priya's voice is consistent – analytical, obsessive, self-aware ("this is why I don’t get invited to more parties"). Her struggle *is* the toast.
  4.  **Warmth & Humor:** The warmth emerges *through* the analysis. The humor comes from her self-deprecation, the relatable examples ("sunk cost fallacy," "ill-advised haircuts"), and the contrast between philosophical rigor and a wedding toast. The specific, fond memories of their past anchor the warmth.
  5.  **Emotional Payoff:** The transition from analysis to genuine feeling ("screw the audit") is key. The resolution argues that their relationship *itself* generates the right-kind reasons, observable in their specific history and actions, defeating the "demons" of habit/sunk cost. The final reason ("you are for each other") is simple, profound, and moving.
  6.  **Audience Awareness:** She explains the demon for non-philosophers. The cohort members (like Alex smirking) signal they understand the meta-joke. The substance works for both groups.
  7.  **Substance Over Jargon:** The philosophical *problem* is central, but the *solution* presented is based on observed reality (their actions and history), not abstract theory.

  This toast should give Priya a strong, character-driven moment that satisfies both the intellectual rigor of her field and the emotional core of the wedding, landing the scene effectively. Good luck with the final stretch of your novel!
