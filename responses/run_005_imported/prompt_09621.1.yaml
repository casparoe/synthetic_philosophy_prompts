prompt: |-
  So I was out for drinks last night with my friend Priya (she's doing a neuro PhD, I'm in philosophy) and we ended up in this massive argument about split-brain patients that never really got resolved. She kept insisting that once you cut the corpus callosum you basically end up with two seperate people stuck in one skull — like the classic Sperry/Gazzaniga stuff where the left hand points to a picture that the talking half of the brain swears it never saw, so obviously "someone" saw it who isn't the same someone doing the denying. I pushed back that this is too fast: sure, information clearly isn't getting shared between the hemispheres the way it normally does after surgery, but that doesn't mean there are two subjects of experience rather than one subject whose access to her own perceptions and outputs has gotten weirdly fragmented. I even half-remembered that Nagel paper from the 70s where he basically says the "one or two" question might not have a determinate answer at all for these patients, and I brought up that newer study (2017-ish?) where split-brain patients could apparently still do some cross-field matching that the classic two-streams picture doesn't obviously predict — though I couldn't remember it well enough to actually defend it, which is probably why Priya still thinks she won.

  Anyway, could you write me a dialogue that does the argument justice? Two philosophers bump into each other right after a colloquium talk on split-brain syndrome and keep hashing it out in the hallway — one of them defends the view that commissurotomy patients really do harbor two distinct subjects/streams of consciousness, the other thinks there's still just one subject whose mental life has become weirdly disunified rather than duplicated. I want them equally sharp and actually responding to each other's best moves, not just restating their own side — so get them into stuff like cross-cueing as a possible confound in the classic experiments, whether "two streams of consciousness" and "two persons" are even the same question, and how much weight the newer evidence for residual interhemispheric integration should really carry for either side. Don't feel like you need to resolve it neatly at the end either, I'd honestly rather it end with the disagreement sharpened then fake-resolved.
